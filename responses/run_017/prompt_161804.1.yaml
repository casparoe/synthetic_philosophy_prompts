  We are given a scenario with two problems (Allais paradox problems) and a planner who aggregates citizens' expected utilities via a social welfare function F. The lotteries are defined over an urn with 89 red balls and 11 white balls.

  Problem 1:
    A: £1m for sure.
    B: £1m if red; if white, then a lottery that gives £5m with probability 10/11 and £0 with probability 1/11.

  Problem 2:
    C: £0 if red, £1m if white.
    D: £0 if red; if white, then the same lottery as in B: £5m with probability 10/11 and £0 with probability 1/11.

  We assume that every citizen i has a utility function u_i (with u_i(0)=0) and they are expected utility maximizers.

  Part (a):

  We are to compute for an arbitrary citizen i:
    EU_i(B) - EU_i(A) and EU_i(D) - EU_i(C) and show they are equal to the same quantity δ_i.

  First, compute EU_i(A):
    A yields £1m for sure, so EU_i(A) = u_i(1m)

  Now, EU_i(B):
    B gives:
      - with probability 89/100: £1m
      - with probability 11/100: a lottery that gives £5m with prob 10/11 and £0 with prob 1/11.
    So, the expected utility from the white ball branch is: (10/11)*u_i(5m) + (1/11)*u_i(0) = (10/11)*u_i(5m) (since u_i(0)=0).
    Therefore, EU_i(B) = (89/100)*u_i(1m) + (11/100)*(10/11)*u_i(5m) 
                      = (89/100)*u_i(1m) + (10/100)*u_i(5m)

  Then, δ_i = EU_i(B) - EU_i(A) = [ (89/100)*u_i(1m) + (10/100)*u_i(5m) ] - u_i(1m)
            = (89/100 - 1)*u_i(1m) + (10/100)*u_i(5m)
            = (-11/100)*u_i(1m) + (10/100)*u_i(5m)
            = (1/100) * [ -11*u_i(1m) + 10*u_i(5m) ]

  Now, for Problem 2:
    EU_i(C): 
        C gives £0 if red (prob 89/100) and £1m if white (prob 11/100).
        So, EU_i(C) = (89/100)*u_i(0) + (11/100)*u_i(1m) = (11/100)*u_i(1m)

    EU_i(D):
        D gives £0 if red (prob 89/100) and if white (prob 11/100) then the lottery: £5m with prob 10/11, £0 with prob 1/11.
        So, the white branch has expected utility: (10/11)*u_i(5m) + (1/11)*u_i(0) = (10/11)*u_i(5m)
        Therefore, EU_i(D) = (89/100)*u_i(0) + (11/100)*(10/11)*u_i(5m)
                           = 0 + (10/100)*u_i(5m)

    Then, EU_i(D) - EU_i(C) = (10/100)*u_i(5m) - (11/100)*u_i(1m)
                             = (1/100) * [10*u_i(5m) - 11*u_i(1m)] 
                             = δ_i   [same as above]

  So indeed, δ_i = (1/100)*[10*u_i(5m) - 11*u_i(1m)]

  δ_i > 0 if and only if 10*u_i(5m) > 11*u_i(1m)  <=>  u_i(5m) > (11/10)*u_i(1m)

  This condition is demanding because it requires that the utility of £5m is at least 10% more than the utility of £1m. But note that if the utility function is concave (diminishing marginal utility, which is typical for risk aversion), then u_i(5m) < 5*u_i(1m). However, (11/10)*u_i(1m) is only 1.1 times u_i(1m), and 5*u_i(1m) is much larger. So for a risk-averse individual, we might have u_i(5m) < 5*u_i(1m) but still u_i(5m) > 1.1*u_i(1m) is likely. However, the condition is not extremely demanding. But note: if the individual is very risk averse, then u_i(5m) might be only slightly more than u_i(1m), so that 1.1*u_i(1m) might exceed u_i(5m). So the condition is demanding for highly risk-averse individuals.

  But the key point is that for each citizen, the sign of δ_i is the same for both comparisons: if δ_i > 0, then the citizen prefers B to A and D to C; if δ_i < 0, then the citizen prefers A to B and C to D. Therefore, every citizen either has the same preference in both problems (either always choosing the safe option or always the risky) or is indifferent.

  Now, the planner uses an increasing function F of the vector of expected utilities. Since F is increasing, it preserves the ordering of the vectors. Therefore, if for every citizen the comparison between A and B is the same as between C and D (both are determined by the sign of δ_i), then the social ranking must also be the same for both problems. Specifically:

  - If for all i, δ_i ≤ 0 (so A is at least as good as B and C is at least as good as D for every citizen), then the vector of expected utilities for A must be at least as good as for B (componentwise, and strictly in at least one component if there is a strict preference) and similarly for C and D. Then F, being increasing, would rank A at least as good as B and C at least as good as D.

  - Similarly, if for all i, δ_i ≥ 0, then F would rank B at least as good as A and D at least as good as C.

  - If there is a mix, then we have to aggregate. But note that the difference vector for B and A is (δ_1, δ_2, ..., δ_n) and for D and C is also (δ_1, δ_2, ..., δ_n). Therefore, the vector of expected utilities for B is the vector for A plus (δ_1,...,δ_n) and similarly for D and C. So the vector of expected utilities for B minus the vector for A is the same as for D minus the vector for C. Hence, the comparison between A and B is the same as between C and D for the entire vector. Therefore, the social ranking must be the same: either A is socially preferred to B and C to D, or B to A and D to C, or indifference in both. In particular, we cannot have A preferred to B and D preferred to C (the Allais pattern) because that would require that in the first problem the vector for A is better than B (so the vector difference is negative) and in the second problem the vector for D is better than C (so the vector difference is positive) — but the vector difference is the same in both cases.

