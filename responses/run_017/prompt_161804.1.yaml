    However, the problem allows any increasing utilities, and we are working with expected utilities, so we can define the expected utility vectors directly.

    But to be concrete, we can assume that the citizens have linear utility over money, and then we can set:

        In lottery L: citizen1 gets £0, citizen2 gets £1m -> so expected utility vector (0,1)
        In lottery M: citizen1 gets £1m, citizen2 gets £0.1m -> vector (1, 0.1)  [if u_i(x)=x]
        In lottery R: citizen1 gets £3m, citizen2 gets £0 -> vector (3,0)

    Then α=1/2.

    The mixture αL+(1-α)R yields:
          citizen1: (1/2)*0 + (1/2)*3 = 1.5
          citizen2: (1/2)*1 + (1/2)*0 = 0.5
        so vector (1.5, 0.5)

    The mixture αM+(1-α)R yields:
          citizen1: (1/2)*1 + (1/2)*3 = 2
          citizen2: (1/2)*0.1 + (1/2)*0 = 0.05
        so vector (2,0.05)

    Leximin ranks M above L because the sorted vector for L is (0,1) and for M is (0.1,1): the first component 0<0.1 so L is worse.

    But in the mixtures, sorted vector for αL+(1-α)R is (0.5,1.5) and for αM+(1-α)R is (0.05,2). The first component: 0.5 vs 0.05 -> since 0.05<0.5, then αM+(1-α)R is worse. So leximin ranks αL+(1-α)R above αM+(1-α)R.

  This violates independence because:

    We have M > L, but then we have αL+(1-α)R > αM+(1-α)R.

  The structural feature that makes this possible is that the aggregation by leximin (which is not linear) is sensitive to the distribution of utilities and how the mixture affects the worst-off. In particular, the mixture of L and R leads to a higher minimum than the mixture of M and R.

  In part (a), the key feature was that the difference between the lotteries in the two problems was the same for every citizen (the same δ_i). But in this part, the lotteries L, M, and R are chosen arbitrarily and the difference vectors are not the same.

  Part (c):

  Now, the planner evaluates lotteries ex post: in each state s (which occurs with probability p(s)), there is an allocation (x1(s), ..., xn(s)), and the social welfare in that state is F(u1(x1(s)), ..., un(xn(s))). Then the overall welfare is the expected value of this: W(L) = Σ_s p(s) * F(u1(x1(s)), ..., un(xn(s))).

  We are to prove that this ranking satisfies independence for any F.

  Independence axiom for lotteries: For any lotteries L, M, R and any α in (0,1), if L is preferred to M, then αL+(1-α)R is preferred to αM+(1-α)R.

  So, assume that the planner ranks L above M, meaning W(L) > W(M).

  We need to show that W(αL+(1-α)R) > W(αM+(1-α)R).

  Note that the compound lottery αL+(1-α)R means that with probability α we run lottery L and with probability (1-α) we run lottery R. Each of L and R is a lottery over states.

  But we can think of the entire compound lottery as a single lottery over states. Specifically, we can model it as a product of the initial chance and then the lottery.

  However, the key is that the ex post evaluation in each final state does not depend on how we mixed. In each state, we have an allocation.

  Now, let the state space be large enough to include the initial chance and then the lottery. But we can also think of the compound lottery as a mixture.

  The welfare W(αL+(1-α)R) = Σ_s p(s) * F(...) but now the states are the states of the compound lottery.

  Alternatively, we can write:

    W(αL+(1-α)R) = α * W(L) + (1-α) * W(R)

  Why? Because the compound lottery yields L with probability α and R with probability (1-α). Then in the event L (which happens with prob α), the welfare is W(L), and in the event R, the welfare is W(R). Therefore, the expected welfare is α * W(L) + (1-α) * W(R).

  Similarly, W(αM+(1-α)R) = α * W(M) + (1-α) * W(R)

  Now, if W(L) > W(M), then:

    α * W(L) + (1-α) * W(R) > α * W(M) + (1-α) * W(R)

  because we are adding the same term (1-α)W(R) and multiplying W(L) and W(M) by the same positive α.

  Therefore, W(αL+(1-α)R) > W(αM+(1-α)R).

  Hence, the ranking satisfies independence.

  The contrast between (b) and (c) is that in (b) the planner aggregates utilities ex ante (by applying F to the vector of expected utilities) and this can lead to violations of independence, especially when F is non-linear (like leximin). In (c), the planner aggregates ex post (by applying F in each state and then taking expectation) and this leads to an expected value of F, which is linear in the probabilities and hence satisfies independence. Therefore, violations of independence in social choice can arise from ex ante aggregation (especially with non-linear social welfare functions) but not from ex post aggregation.

