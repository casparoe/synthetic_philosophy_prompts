prompt: |-
  I'm writing a novel and I've got myself into a hole. Three characters break the same law in the same year, and I want the reader to feel that one of them is a hero, one is a pain in the neck, and one is just a criminal — but every time I try to say why, I end up writing a line of dialogue that sounds like a seminar. So I want the spec first, before I commit to any more scenes.

  Give me the desiderata: what a theory of political obligation has to deliver, and separately what an account of civil disobedience has to deliver, if its supposed to be good enough for a character to use in first person *and* good enough for me to plot with. For each requirement, the case that motivates it — ideally one of these, since they're the scenes I actually have:

  N, a mid-level official who swore an oath and then leaks the internal memo; D, who has no vote, no passport and no plausible claim to have consented to anything, has lived here nineteen years, works, pays tax, and refuses to register for the thing everyone has to register for; M, who hides her son the night before he's due to report and tells nobody; K, who pays every tax except the slice that funds one programme, and writes to say so. And then the same law eighteen months later, after the government has changed twice: I need to know whether M and K still owe the same thing, and whether the fact that they complied for a while changes what they owe now.

  Things I specifically want your view on. Whether an account really has to answer the "why this lot and not any other reasonably decent state" question, or whether that's just a prejudice of one camp. Whether it has to keep "the law is valid" apart from "you have to obey it". Whether it has to handle the character who is only about sixty per cent sure the law is unjust, whether "you're permitted to act on your judgement" and "you're judgement is right" come apart, and who carries the risk of being wrong. Whether what makes D's refusal disobedience rather than crime is the publicity, the willingness to take the penalty, or the fact that it's addressed to an audience — and whether an account that demands all three quietly rules out resistance in places where going public gets you killed. Whether it has to say what the character owes afterwards — a trial, an apology, repair, keeping the rest of the law — or whether that's beyond what a theory of obligation is for. How much sacrifice is enough: I don't want a theory that requires my characters to be saints, but I don't want one that lets K off because the form was annoying. Whether it has to distinguish the person who pays, the one who drives the lorry and the one who votes, or whether they're all equally implicated. Whether emigrating discharges the thing, given that M can't leave because she's caring for her mother. And whether any of this is about law specifically or about authority generally — one of my subplots is a character defying a union directive and I don't know if that's the same animal.

  Then the part I care about most: which requirements are non-negotiable and which are just what one camp happens to like, and flag any pair you think can't be jointly met. I've got a suspicion that "must bind even when you think the requirement is wrong, because that's what authority is" and "must never require you to abet something seriously unjust" can't both survive, and that "must give clear first-personal guidance" fights with "mustn't tell the agent to defer when she's probably right". Tell me if I'm wrong. And say which single requirement knocks out the most candidates — that's the one I'll put in the mouth of my barrister.

  No long scorecard: a couple of lines each at the end on consent, fair-play/benefit, natural-duty and associativist accounts is plenty, and skip anything that needs a library. British English throughout (judgement, colour, defence), and prose rather than a wall of headings — I'm a novelist, I'll notice.
reasoning: |-
  Okay, let's tackle this complex query from a novelist struggling with political obligation and civil disobedience in their characters. The user needs clear philosophical frameworks that work for both character motivation and plot mechanics, without sounding academic.

  Hmm, the core challenge is creating distinct moral positions for three characters who break the same law, while making their justifications feel authentic in dialogue. The user's specific examples (N leaking memos, D refusing registration, M hiding her son etc.) show they need concrete application, not abstract theory. 

  First, I should identify what makes a theory usable for fiction. Key requirements emerge: it must allow for gradations of obligation (hero vs pain vs criminal), handle uncertainty ("60% sure"), and clarify consequences (like post-compliance duties). The user's suspicion about conflicting principles ("must bind even when wrong" vs "never abet injustice") is spot-on - that's the classic authority/morality tension.

  For political obligation theories, the non-negotiables are:
  - Must separate validity from obedience (so characters can acknowledge a law exists while refusing compliance)
  - Must address "why this state" (otherwise D's situation makes no sense)
  - Must permit conscientious refusal without requiring sainthood

  For civil disobedience specifically:
  - Publicity requirement needs flexibility (can't get characters killed in oppressive regimes)
  - Must distinguish from mere crime through intentionality
  - Should address aftermath (apology? ongoing obligation?)

  The user's immigration question about M is revealing - if obligation requires consent, non-citizens fall through cracks. Fair-play theory struggles here, while natural duty might work better. 

  When evaluating theories:
  - Consent fails D completely (no passport = no consent)
  - Fair-play struggles with K's selective tax refusal
  - Natural duty handles uncertainty well but risks being too vague
  - Associativism explains M's local ties but not N's leak

  The knockout criterion? Probably "must bind while permitting disobedience to grave injustice." That torpedoes strict consent theories and sets up the barrister's speech nicely. For civil disobedience, "must work under tyranny" eliminates rigid publicity requirements.

  User's British English request matters too - "judgement" not "judgment", etc. And no academic jargon. The response should mirror their vivid prose style while delivering precise philosophical distinctions.
answer: |-
  Here’s a distilled, novelist-focused spec for political obligation and civil disobedience, built around your characters and non-negotiables. British English, prose-first, with requirements prioritised for drama and plot utility.

  ---

  ### **I. Core Requirements for Political Obligation**  
  *(What binds N, D, M, K to the state?)*  

  1. **"Why this state, not another?" MUST be answered.**  
     *Case:* D has no passport, never consented, but lives/works/pays tax here for 19 years. If the theory can’t explain why *this* state claims D (not just "any decent state"), D’s refusal lacks moral texture. *Non-negotiable*.  

  2. **Separate "law is valid" from "you must obey it".**  
     *Case:* N swore an oath (implying validity) but leaks the memo. If validity *entails* obedience, N’s heroism collapses into hypocrisy. *Non-negotiable for moral complexity.*  

  3. **Handle uncertainty (the 60% problem).**  
     *Case:* M hides her son but isn’t sure conscription is unjust. The theory must permit acting on doubtful judgement *without* guaranteeing righteousness. The *actor* carries the risk of being wrong. *Essential for internal conflict.*  

  4. **Emigration ≠ automatic discharge.**  
     *Case:* M can’t leave (caring for mother). Obligation can’t hinge on literal exit options. *Non-negotiable for realism.*  

  5. **Complicity gradations matter.**  
     *Case:* K pays most taxes but not the slice funding Programme X. Is K less implicated than the voter who backed it? Theory must differentiate roles (payer, enactor, voter). *Crucial for K’s "pain in the neck" status.*  

  ---

  ### **II. Core Requirements for Civil Disobedience**  
  *(What makes D/M/K’s acts disobedience vs. crime?)*  

  6. **Publicity OR audience-addressing suffices; penalties optional.**  
     *Case:* M hides her son secretly (no publicity). If publicity is *required*, M is just a criminal—but her act is politically resonant. D’s refusal *is* public (addressed to the state). *Demanding all three (publicity, penalty, audience) rules out resistance under tyranny. Non-negotiable.*  

  7. **Sacrifice threshold: "More than inconvenience, less than sainthood".**  
     *Case:* K can’t whine about "annoying forms"—but shouldn’t need to risk death. Refusal must cost *something* material (job loss, fines, stigma). *Keeps K relatable, not heroic.*  

  8. **Aftermath: Ongoing obligation, but context-dependent.**  
     *Case:* Post-regime change, M/K don’t "owe" the same thing retroactively. But they may owe:  
     - **Repair** (if harm was done),  
     - **Defence** (if prosecuted under valid law),  
     - **Continued compliance** (with *other* laws).  
     *Non-negotiable for sequel hooks.*  

  ---

  ### **III. Your Suspicions & Knockout Criterion**  
  - **"Must bind even when wrong" vs. "Never abet grave injustice"**: These *can* coexist **if** the theory permits *exceptions* for fundamental injustices (e.g., Rawls’ "nearly just society"). But if the state is tyrannical, obligation evaporates. *N’s leak tests this: if the memo reveals atrocities, obligation may break.*  
  - **"Clear guidance" vs. "Don’t defer when probably right"**: Conflict is inevitable. First-person judgement is fallible; the theory must accept this tension. *M embodies this.*  
  - **Knockout Criterion** (for your barrister):  
     *"Must explain why obligation persists when you rationally believe the law is unjust, yet the state remains broadly legitimate."*  
     This sinks weak consent/fair-play theories.  

  ---

  ### **IV. Theory Scorecard (2 lines each)**  
  - **Consent (Locke)**: Fails D (no consent given) and M (can’t emigrate). Too individualistic.  
  - **Fair-Play (Rawls)**: N/K benefit from state, so owe compliance. Struggles with complicity gradations (is paying tax = voting?). Makes D’s refusal look ungrateful.  
  - **Natural Duty (Kant)**: "Duty to support just institutions." Binds D/M even without consent. Allows disobedience if law undermines justice. Best for uncertainty (act on judgement).  
  - **Associative (Dworkin)**: Obligation from communal ties. Explains D (19 years of belonging). Excuses M’s secrecy if the community betrays her son.  

  ---

  ### **V. Authority vs. Law & Your Subplot**  
  - **Union directive defiance**: Same animal if the union has *authority* (members consented, it provides benefits). If it’s corrupt, disobedience mirrors civil disobedience. Use the same framework.  

  ### **Final Non-Negotiables**  
  1. Answers "why this state?"  
  2. Separates validity from obedience.  
  3. Permits secret disobedience (no publicity dogma).  
  4. Sets sacrifice threshold above inconvenience.  

  **Barrister’s knockout line**: "No theory that demands complicity in atrocity can bind a moral agent—but no society survives if every uncertain conscience vetoes the law." (Use Natural Duty; it balances best).  

  ---  
  *For your scenes: Natural Duty (+ Associative for D/M) handles uncertainty, complicity, and aftermath. Lets N be heroic (duty to justice > oath), D stubborn (duty conditional on state’s justness), K annoying (minimal sacrifice), M morally torn (secret disobedience justified if conscription is child-sacrifice).*
