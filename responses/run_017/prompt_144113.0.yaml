prompt: |-
  You are a philosopher of action and a decision theorist with many years of experience teaching upper-level undergraduates, and you are unusually good at the architecture of an explanation: what has to be in place before what, and the exact point at which a good student's understanding silently derails. Please think carefully before you write. Begin your reply with a section headed "Brainstorm" in which you spend two or three paragraphs on: the two or three ways this particular session is likeliest to fail; the orderings of the material you considered and rejected; and which single step you take to be the genuinely hard one. Only then give me the plan. Aim for something I can read in five minutes and hand to a competent TA.

  The setting: I am teaching a third-year seminar on rational choice. Week 9, seventy-five minutes, eighteen students, a whiteboard and one side of A4. They have already done Newcomb's problem with an opaque box and a near-perfect predictor, the one-shot prisoner's dilemma, and they can state both theories in the crude form I gave them: causal decision theory maximises expected utility of the causal consequences of the act, evidential decision theory maximises expected utility conditional on the act. They can do a Bayesian update on an urn of unknown bias. No calculus, and no continuous priors: if an update is needed, do it over a two- or three-valued hypothesis with a table.

  What I want next week's session to make land is evidential cooperation in a large world: why, and under precisely what conditions, an evidential agent's own act can be a reason to cooperate with thousands of strangers over whom it has no causal influence whatsoever, and how the strength of that reason depends on the size of the population, on what the agent gets to observe, and on whether the population's composition is known. By a large world I mean only this: the agent is one of many similar agents, and the joint distribution over all of their acts is something that has to be specified rather than something the decision problem hands you.

  The candidate case I have been working with, which you should feel free to trim or replace, is what I call the Nine Thousand Silos. Nine thousand agents, each sealed alone, one-shot, no communication, no commitment devices, no repetition, no reputation, no shared signal anyone observes. Each may press or not press. Pressing costs the presser one unit and adds three units to the payoff of every other agent, so the benefit is non-rival and undiluted: my payoff is three times the number of other pressers, minus one if I press. Two dials. The first is visibility: how many other agents' choices are revealed to me before I decide, which I want to be able to set at zero, at ten, and at eight thousand nine hundred and ninety-nine. The second is provenance: either the Registrar has truly announced that exactly three thousand of the nine thousand will press, or nothing about the composition is announced and the agents are exchangeable, their common tendency being one of two values, 0.2 or 0.8, with prior probability one half on each.

  Define the evidential leverage of pressing as the difference between the expected number of other pressers conditional on my pressing and the expected number of other pressers conditional on my not pressing; the agent presses exactly when three times the leverage exceeds one. My own numbers: under the unannounced, exchangeable version with no observations, leverage is about 0.36 times eight thousand nine hundred and ninety-nine, which is absurdly large; under the Registrar's announcement it is minus one, so the evidential reason does not merely vanish but reverses; and as the visibility dial is turned up, leverage collapses towards one regardless of how large the population is, because with a uniform-ish prior it comes out at roughly the population size divided by the number of observed acts plus a small constant. Correct me if any of that is wrong.

  What I want from you is not the explanation but the plan for it, in this order of concern. First, the dependency structure: the ordered components, stated as what must precede what and why, including where the definition of leverage belongs, whether the threshold arithmetic comes before or after the qualitative surprise, and why the reverse order fails. Second, the carrying example: is the Silo Census the right vehicle, and what must such a case have and lack; in particular say whether the payoff should really be non-rival, whether the agents should really be unable to see any shared signal, and in what order the two dials should be turned, with what the students should be able to compute at each setting. Third, the misconception map. Here is my provisional list: that this is just the causal-correlation confusion and evidential decision theory is magical thinking; that the correlation would have to be near-perfect, as with the predictor in Newcomb's problem; that one agent among nine thousand cannot matter; that conditioning on one's own act cannot be evidence about eight thousand nine hundred and ninety-nine other acts at once, since that would violate some conservation of evidence; that knowing the overall press-rate and knowing the exact composition are the same piece of information; and that the reference class is obviously the nine thousand silos rather than something wider or narrower. Tell me where in the sequence each of these should be headed off, in the order the students will actually form them, and add the ones I have missed. Fourth, one final check: a single question I can put to them at the end whose wrong answers are diagnostic, together with what each wrong answer tells me. Fifth, what to leave out and say out loud that you are leaving out. My own list is functional and updateless decision theories, the general question of which decision theory is correct, the full Savage small-world apparatus, commitment and pre-commitment, iterated games, and anything that turns on agents seeing each other's decision procedures. Tell me if any of those exclusions is a mistake, and what else belongs on the list.

  Two constraints. Do not explain the material to me; I know it, and I need the shape of the session, not its content. And do not give me readings, citations, or anything that would require a library or the internet: everything in the session has to be reconstructible from this message and from what the students already have.
