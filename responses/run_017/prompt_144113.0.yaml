  Hmm, the user is teaching a seminar on rational choice and needs a lesson plan for a session on evidential cooperation in large worlds. They've provided detailed parameters: third-year students, 75 minutes, specific prerequisites (Newcomb's problem, PD, basic CDT/EDT), and a case study called Nine Thousand Silos. The core challenge is making students grasp how an evidential agent's own act can signal cooperation with thousands of strangers without causal influence.

  The user wants five structured outputs: dependency structure, case evaluation, misconception map, diagnostic question, and exclusions list. They emphasize sequencing—what must precede what—and preempting misunderstandings. The Silo case has two dials (visibility and provenance) to manipulate, and the math shows counterintuitive results (high leverage in exchangeable settings, reversal under Registrar announcement).

  Key pedagogical traps I anticipate: 
  First, students might conflate evidential reasoning with magical thinking or Newcomb-style perfect correlation. This requires early distinction between predictor-based correlations (known mechanism) vs. statistical dependencies in populations (unknown parameters). 

  Second, the "one agent can't matter" intuition needs dismantling through the leverage calculation itself. But if I present arithmetic before the qualitative wonder, they'll dismiss it as a math trick without internalizing why it's conceptually possible. So I should start with Registrar case (leverage -1) to shock them first. 

  Third, the conservation-of-evidence fallacy ("one datapoint can't inform 8999 others") must be preempted by stressing how exchangeability propagates information globally. This belongs right after introducing the unannounced exchangeable scenario.

  For the case itself: the non-rival payoff is essential to isolate the pure information effect. Removing shared signals is correct—any common observation would dilute the act's evidential uniqueness. Dial sequence: start with Registrar (province dial) to show leverage reversal, then zero-visibility exchangeable for high leverage, then add visibility to demonstrate its collapsing effect. 

  Major misconception missed: that exchangeability assumes identical agents, so the prior must be symmetric (0.2 or 0.8 for all). If students think tendencies vary individually, leverage collapses. I'll add this to the misconception map.

  Final diagnostic question: "Why does leverage approach 1 when we observe many others?" Wrong answers: if they say "because my act matters less" (confuses causal impact), or "observed acts screen off mine" (only true under known composition). Correct answer: observations pin down the tendency, reducing uncertainty about others.

  Exclusions list is sound: functional/updateless theories would overcomplicate, and commitment devices belong to causal solutions. I'd also exclude any evolutionary justification—this is purely about reasoning given beliefs.
answer: |-
  ### Brainstorm  
  **Likeliest Failures:**  
  1. **Magical Thinking Conflation:** Students may conflate evidential leverage with Newcomb's predictor's near-perfect correlation, dismissing it as "spooky action at a distance." This risks painting EDT as irrational.  
  2. **Arithmetic Distraction:** Premature focus on leverage calculations (e.g., 0.36 × 8999) may obscure the *why*. Students could fixate on computation without grasping how conditioning works.  
  3. **Scale Intuition Collapse:** The leap from PD (one other agent) to 9,000 strangers may trigger "one drop in the ocean" dismissal, especially if population-size effects aren’t scaffolded.  

  **Rejected Orderings:**  
  - Starting with leverage definition: Requires prior intuition about conditioning on one’s act.  
  - Beginning with Registrar case: Its negative leverage (-1) is jarring without first seeing positive leverage in action.  
  - Visibility dial first: Observations dilute leverage, so zero-visibility must anchor the baseline.  

  **The Hard Step:**  
  Grokking that conditioning on *one’s own act* in an *exchangeable population* updates beliefs about *all others simultaneously*. This violates "conservation of evidence" intuitions and hinges on statistical dependence via an unknown parameter.  

  ---

  ### Lesson Plan  

  #### 1. **Dependency Structure**  
     - **Step 0: Recap EDT vs. CDT**  
       *Why:* Reactivate "conditioning on the act" (EDT) vs. "causing outcomes" (CDT). Use PD to contrast.  
     - **Step 1: Introduce Silo Case (Zero Visibility, Unannounced)**  
       *Why:* Establishes purest form—no observations, unknown tendency. Compute *qualitative* surprise: "If I press, what does that suggest about others?"  
     - **Step 2: Define Leverage**  
       *After Step 1, before math:* Leverage quantifies the "suggestion" (∆E[others|act]). *Threshold arithmetic comes here:* Press iff 3×leverage >1.  
     - **Step 3: Registrar Variant**  
       *After leverage:* Fixed composition (3,000 pressers) makes one’s act *counter-evidence* (leverage = -1). Shows how known parameters break dependence.  
     - **Step 4: Visibility Dial**  
       *Last:* Adding observations (10→8,999 others seen) shrinks leverage. Demonstrates "inference diluted by data."  
     *Reverse order fails:* Starting with Registrar or visibility masks the core surprise (Step 1).  

  #### 2. **Silo Case Evaluation**  
     - **Keep non-rival payoffs:** Critical. Rival benefits would introduce competitive dynamics, muddying cooperation.  
     - **No shared signals:** Essential. Shared signals (e.g., weather) would create confounding evidence.  
     - **Dial Sequence:**  
       1. **Unannounced, zero visibility** (Baseline: high leverage).  
       2. **Registrar announced** (Leverage reversal).  
       3. **Unannounced, visibility = 10** (Leverage shrinks; students compute posterior with 2-valued prior).  
       4. **Unannounced, visibility = 8,999** (Leverage ≈1).  

  #### 3. **Misconception Map (Order of Preemption)**  
     | Misconception | When to Preempt |  
     |---------------|----------------|  
     | "EDT = magical thinking" | Step 0 (recap): Contrast with Newcomb. "No predictor here—only statistical dependence." |  
     | "One agent can’t matter" | Step 1: Pre-computation intuition pump. "If all are similar, your act *reflects* the group." |  
     | "Correlation must be perfect" | Step 1: Stress exchangeability ≠ determinism. |  
     | "Conservation of evidence violated" | Step 2: Emphasize that unknown *common tendency* couples all agents. |  
     | "Known press-rate = known composition" | Step 3: Registrar case—exact count vs. tendency are distinct. |  
     | **Added:** "Agents are independent" | Step 1: "Exchangeability ≠ independence. Same prior, same inference." |  

  #### 4. **Diagnostic Question**  
     *End with:* **"Why does leverage →1 when I see almost all others, but stay high when I see none?"**  
     - *Wrong answer 1:* "Because my act can’t affect them." → Confuses CDT/EDT.  
     - *Wrong answer 2:* "Seeing others tells me everything." → Misses that *residual uncertainty* vanishes with observations.  
     - *Right answer:* "With many observations, the tendency is known, so my act adds no new evidence."  

  #### 5. **Exclusions**  
     - **Your list is sound:** Functional/updateless theories, Savage, commitment, iteration, decision-procedure observation.  
     - **Add:** Evolutionary explanations, population-level rationality (e.g., "group selection").  
     - **Say aloud:** "We’re isolating pure evidential reasoning—no dynamics, no meta-reasoning."  

  ---

  **Time Allocation:**  
  - Steps 0–1 (15 min), Step 2 (10 min), Step 3 (15 min), Step 4 (15 min), Misconceptions interleaved (10 min), Diagnostic Q (10 min).  
  **Whiteboard Use:**  
  - Left: Silo payoff structure.  
  - Right: Leverage calculations table (visibility settings).  
  **TA Note:**  
  Rehearse the "unknown tendency" prior update (2-valued hypothesis) with a small-N analog first (e.g., 10 silos).
