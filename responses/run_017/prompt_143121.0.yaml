prompt: |-
  I work in root cause analysis at a freight company, and me and two colleagues have started noticing something we keep doing, and I want to know whether it has a name.

  Our whole job is basically "what's the best story that explains this mess" — a friend who did a philosophy minor says that's got a fancy name, inference to the best explanation or abduction or something. Anyway. What we've noticed is that our best explanation tends to get *better* over time, and we don't think it's because we learned anything new. We think it's because the list of stuff the explanation is supposed to cover keeps getting quietly edited.

  Two cases.

  1. A run of late deliveries in the north region. The explanation we settled on was that the nightly batch job in the sorting software was finishing late, so vans were going out with half their loads. That covered maybe seventy percent of the incidents right away. The rest: over the next couple of months they one by one stopped being the kind of thing we were explaining. A depot that doesn't even use the batch job had late vans — that got called a dispatch problem, different failure mode. Late arrivals where the van actually left on time became transit delays, not a depot thing. Nobody ever said ignore those, and honestly each reclassification was reasonable on its own, some of them were probably right. But by the end the batch job story explained everything on the list, and the list had been trimmed to fit the story.

  2. Not work, family history. Why did my great-uncle's shop go under in the sixties? The family answer is that he was undercapitalized after the expansion. The bits that don't fit — the fire, the year his brother ran it, the near-identical shop two streets over that survived on less capital — have all, over about forty years of retelling, been reclassified as separate stories. The fire was after he'd already lost it. That year was really my grandmother's business. Again: each one plausible, maybe even correct, and the explanation now fits perfectly.

  I also think there's a mirror image. Once we'd committed to the batch job story, new complaints started getting *folded in* as extra successes — the routing complaints, the driver overtime — where before we'd committed they'd have been logged as unrelated grumbling.

  So the thing has two directions, and that might be one phenomenon or two, I can't tell.

  I had a look around and it isn't anything I could put a name to. It isn't bolting an extra assumption onto a theory to save it; nothing gets added to the batch job story. It isn't the thing where a theory explains everything and therefore explains nothing — the story has real content, it's the target that moved. I thought of the Texas sharpshooter, but as I understand it that's drawing the circle around your bullet holes after you've fired; here the target was drawn up front and then narrowed. Moving the goalposts isn't right either, that's about changing what counts as success, not about what's on the inventory.

  So: is there an established concept for this — the cumulative, individually defensible redrawing of what an explanation is answerable for, in both directions? And I don't just want a label. If there's a literature I'd want to know what the nearest concepts are and where exactly this sits relative to each. If there isn't one, then: what's the right way to carve it, when is "that's actually a different phenomenon" a legitimate move and when is it this thing, and does any of it matter for whether best-explanation reasoning can work at all, or is it just sloppy bookkeeping that a careful person could avoid?
reasoning: |-
  Okay, the user works in root cause analysis at a freight company and has noticed a pattern where explanations seem to improve over time not because of new information, but because the scope of what needs explaining gets adjusted. They provided two examples: one from work about late deliveries and another from family history about a shop failing. 

  The key points are that the explanation itself doesn't change, but the set of incidents it's supposed to cover gets edited. Incidents that don't fit are reclassified as separate issues (trimming), while new incidents that might have been considered unrelated get folded into the explanation (assimilation). 

  The user wants to know if there's a name for this phenomenon, related concepts in literature, and whether it's a fundamental flaw or just sloppy work that can be avoided. They're clearly thoughtful and detail-oriented, given how they've analyzed the problem and ruled out existing fallacies like Texas sharpshooter or moving goalposts. 

  This seems like a sophisticated observation about how human cognition handles explanatory coherence. The trimming aspect resembles concept creep (narrowing definitions) or boundary work in sociology. The assimilation part feels like confirmation bias or theory-laden observation. The overall mechanism where the explanatory target shifts to maintain coherence reminds me of the Quine-Duhem thesis - how theories are tested in bundles rather than isolation. 

  For literature, Kuhn's paradigms come to mind - how anomalies get explained away during normal science. Also Tetlock's work on how experts handle disconfirming evidence. The user might appreciate knowing this is a recognized cognitive behavior pattern, not just sloppiness. 

  The deeper need here seems to be about validation of their methodological concerns. They're questioning whether their root cause analysis approach is fundamentally sound, which is really important in their field. They'd probably benefit most from understanding this as an inherent challenge in abductive reasoning that requires conscious countermeasures like maintaining immutable incident logs or pre-defining explanatory boundaries.
answer: |-
  What you're describing is an exceptionally astute observation about how explanatory narratives evolve in practice – and yes, it *does* have names and sits at the intersection of several well-established concepts in philosophy of science, cognitive psychology, and sociology of knowledge. It's not just sloppy bookkeeping; it's a fundamental tension in human reasoning.

  Here's how we can dissect it, using your excellent cases:

  1.  **The Core Mechanisms:**
      *   **"Trimming" (Exclusion):** Removing anomalies or discrepant cases from the set of facts the explanation *must* cover by reclassifying them as belonging to a different category or phenomenon. (e.g., late deliveries not using batch job → dispatch problem).
      *   **"Assimilation" (Inclusion):** Incorporating new events or previously unrelated observations into the explanatory scope *because* they *can* be interpreted as fitting the now-dominant explanation. (e.g., routing complaints → seen as *caused by* the batch job delay).
      *   **Target Drift:** The cumulative effect of trimming and assimilation is that the very *definition* or *boundaries* of the phenomenon being explained subtly shift to enhance the fit and coherence of the preferred explanation. The target moves to match the arrow.

  2.  **Established Concepts and Literature:**
      Your observation brilliantly captures facets of several key ideas:

      *   **The Quine-Duhem Thesis:** This fundamental principle in philosophy of science states that scientific hypotheses cannot be tested in isolation; they are always embedded in a network of background assumptions and auxiliary hypotheses. When faced with a counterexample (anomaly), we have a choice: reject the core hypothesis *or* adjust the auxiliary assumptions/boundary conditions. **This is *exactly* what you're seeing:**
          *   *Trimming:* Adjusting the auxiliary assumption "All late deliveries in the North Region during period X are instances of phenomenon Y" by reclassifying specific cases (e.g., "That depot doesn't count because it doesn't use the software," "That delay wasn't *departure* delay").
          *   *Assimilation:* Adjusting the auxiliary assumption "Phenomenon Y *only* causes late departures" to "Phenomenon Y also causes routing issues and overtime" (linking them via the core hypothesis).
          *   *Literature:* W.V.O. Quine, "Two Dogmas of Empiricism"; Pierre Duhem, "The Aim and Structure of Physical Theory".

      *   **Kuhnian Paradigms & Anomaly Management:** Thomas Kuhn's work on scientific revolutions describes how scientists work within a dominant "paradigm" (framework of theories, methods, standards). During "normal science," anomalies (counterexamples) arise. The initial reaction isn't to reject the paradigm but to:
          *   *"Dissolve" the anomaly:* Show it's not a *real* counterexample through reanalysis or reclassification (**Trimming** - your family history example is textbook Kuhn in miniature).
          *   *Extend the paradigm:* Show how the paradigm *can* explain the anomaly, often by developing new applications or interpretations (**Assimilation** - the routing complaints).
          *   Only when anomalies become overwhelming does a paradigm shift occur.
          *   *Literature:* Thomas Kuhn, "The Structure of Scientific Revolutions".

      *   **Concept Creep (Narrowing) & Theory-Laden Observation:**
          *   *Concept Creep (Downward):* The phenomenon where the definition of a concept becomes *narrower* over time. This maps directly to **Trimming**. The "late delivery problem caused by batch job" concept gets narrower as edge cases are excluded.
          *   *Theory-Laden Observation:* Our expectations and theories shape what we *see* and how we *categorize* observations. Once committed to the batch job theory, new events (routing complaints) are *seen through that lens* and categorized as related (**Assimilation**), whereas previously they might have been seen as noise. Your prior beliefs actively shape your classification.
          *   *Literature:* Nick Haslam (Concept Creep); Norwood Hanson ("Patterns of Discovery") / Kuhn / many cognitive psychologists on theory-ladenness.

      *   **Confirmation Bias & Belief Perseverance:** While related, these are more general. Confirmation bias (seeking/interpreting info to confirm beliefs) fuels **Assimilation**. Belief perseverance (clinging to beliefs despite disconfirming evidence) motivates **Trimming** as a defense mechanism for the core explanation.

      *   **Boundary Work (Sociology of Science):** The process by which communities define what counts as legitimate within their domain vs. outside it. Your team, implicitly, is doing boundary work: deciding what counts as part of "this specific problem" vs. "a different problem." This defines the target for the explanation.
          *   *Literature:* Thomas Gieryn.

  3.  **Labeling Your Specific Phenomenon:**
      The most precise descriptions are:
      *   **Explanatory Boundary Adjustment via Auxiliary Hypothesis Modification** (Quine-Duhem lens).
      *   **Anomaly Management through Taxonomic Drift** (Kuhnian lens).
      *   **Concept Narrowing (Trimming) & Theory-Laden Assimilation** (Cognitive lens).
      *   **The Coherence-Driven Redefinition of the Explanandum.** (Explanandum = the thing to be explained).

      While there isn't one universally agreed-upon *single* term for this *exact* two-way cumulative process, "**explanatory drift**" or "**phenomenon boundary creep**" would be understandable and descriptive labels within your field, capturing the *shifting target* aspect.

  4.  **Is it Legitimate? Does it Matter? Can it be Avoided?**
      *   **Legitimacy:** Individual reclassifications *can* be entirely legitimate, rational, and correct (e.g., the fire *did* happen later; that depot *doesn't* use the software). The problem arises from the *cumulative, coherence-driven pattern* where the *primary driver* for the reclassification appears to be preserving the preferred explanation, rather than purely evidence-based redrawing of boundaries.
      *   **Matter for Inference to Best Explanation (IBE)?** Absolutely. It poses a significant challenge:
          *   **Threat to Validity:** If the set of facts explained is malleable, how do we *genuinely* test the explanation's scope and power? Its apparent "bestness" might be an artifact of boundary shifting.
          *   **Potential for Dogma:** It can entrench explanations prematurely, making them resistant to falsification.
          *   **Undermines Predictive Power:** If the boundaries drift, the explanation's ability to predict *new* instances of the *originally defined* phenomenon weakens.
      *   **Can it be Avoided?** Not entirely, but it can be **managed rigorously**:
          *   **Define the Explanandum Rigorously Up Front:** Before analysis begins, explicitly define: What *exactly* counts as an instance of the problem? What are the inclusion/exclusion criteria? What are the *boundaries* (geographic, temporal, system scope, failure mode)? *Document this.*
          *   **Immutable Incident Log:** Maintain a *timestamped, uneditable* log of *all* incidents initially included in the investigation. Any reclassification must be explicitly justified *against the pre-defined criteria*, documented, and treated as a *hypothesis itself* (e.g., "Incident #45 reclassified as Dispatch Failure based on criteria X, evidence Y").
          *   **Track the Drift:** Actively monitor *how* the set of explained incidents and the problem definition evolve. Ask: "Is this reclassification driven by *new evidence about the incident itself*, or by *the need to fit the current leading explanation*?"
          *   **Consider Alternative Explanations Explicitly:** Force the team to articulate how competing explanations would handle the *entire original dataset*, including the anomalies. Does a different explanation require *less* boundary adjustment?
          *   **Beware Assimilation:** When new events arise, consciously ask: "Would we have linked this to Problem X *before* we had Explanation Y? What independent evidence links them beyond the explanation?"
          *   **Cultivate "Respect for the Anomaly":** Treat anomalies not just as nuisances to be explained away, but as potentially crucial clues pointing to flaws in the explanation or a need to redefine the problem scope more fundamentally.

  **Conclusion:** You've identified a profound and well-recognized challenge in abductive reasoning (IBE) – **the dynamic interplay between an explanation and the definition of what it explains.** It's driven by our innate desire for coherent narratives and our reliance on auxiliary assumptions (Quine-Duhem). While individual boundary adjustments can be valid, the cumulative, coherence-driven drift you describe ("explanatory drift" / "phenomenon boundary creep") risks inflating the perceived explanatory power of a theory by subtly reshaping the target. It's not just sloppy bookkeeping; it's an inherent cognitive and sociological tendency. The key is rigorous upfront definition, transparent tracking of boundary changes, and constant vigilance against letting the desired explanation dictate the problem's boundaries. Your observation shows deep insight into the practical epistemology of root cause analysis.
