answer: |-
  Below is a decision tree designed as a practical instrument for first-year PhD students to navigate the question: **"What does the silence of surviving sources about a set of people license us to say?"** The tree is built from logical distinctions grounded in your specified concrete cases (tax rolls, colonial inventory, estate correspondence), with branch questions phrased to be answerable without prior knowledge of historiographical positions. It prioritizes logical space over names, then maps named (or unnamed) positions onto that space. 

  I've addressed your core distinctions:  
  - **Evidence vs. missing data** (Q1), **mechanism** (suppression vs. legibility threshold, Q3), **inference target** (people vs. machinery, Q4), **quantitative gaps** (Q5), **traces/presuppositions** (Q6), **filling gaps** (epistemic vs. institutional, Q7), and **elite silences** (Q8).  
  - **Absence vs. line-item presence** is integrated into Q4 (inference target) and Q6 (traces), as it is not a standalone methodological commitment but shapes *how* we interpret the silence (e.g., a line-item in the colonial inventory is a trace of the machinery, not the person).  
  - Your supervisor's concern about **suppression vs. legibility collapsing** is flagged: They often yield identical conclusions about the unrecorded population, differing only in *explaining why* the silence exists (Q3 is retained but marked as unstable).  
  - **Unstable nodes** (where answers often correlate or positions overlap) and **unoccupied leaves** (incoherent/unattractive) are explicitly noted.  

  The tree has **8 branch questions** and **9 leaves** (5 named positions, 2 unnamed, 2 unoccupied). Each leaf includes:  
  - **Name** (or "unnamed" if no major defender).  
  - **Most awkward commitment**: One-sentence summary of its hardest-to-defend stance.  
  - **Worst-handled case**: The concrete case it struggles with most.  

  ---

  ### **Decision Tree**  
  *Start with the tax roll case (landless cottagers' entries stop abruptly; landholders continue). Answer sequentially.*  

  1. **Can this silence (missing cottager entries) serve as evidence for a historical claim?**  
     - **Yes** → Go to Q2.  
     - **No** → *Leaf 1: Archival Positivism*.  

  2. **Were the cottagers likely still present when records stopped?**  
     - **Yes** (present but unrecorded) → Go to Q3.  
     - **No** (silence indicates absence) → *Leaf 2: Demographic Literalism*.  

  3. **Why did recording stop?**  
     - **Suppression**: Authorities actively excluded them (e.g., policy change to erase the poor).  
     - **Legibility threshold**: The system never categorized them consistently (e.g., cottagers fell below a "paperwork threshold").  
     *(Note: These often collapse in practice; suppression implies intent, legibility implies systemic bias, but both license similar claims about the unrecorded. Positions rarely split here.)*  
     → Go to Q4.  

  4. **In the colonial inventory case (enslaved person listed only as property), does silence about their experiences inform us primarily about...?**  
     - **The unrecorded people**: Their lives, agency, or experiences.  
     - **The machinery**: The record-keeping system, power structures, or categories that produced the silence/line-item.  
     *(This branch distinguishes absence vs. line-item: A line-item is a trace of the machinery, not the person.)*  
     → Go to Q5.  

  5. **In the tax roll case, can quantitative gaps (e.g., abrupt stops, missing sequences) estimate the unrecorded population?**  
     - **Yes** → Go to Q6.  
     - **No** → Go to Q6.  

  6. **In the colonial case, does reading traces (e.g., the inventory presupposing racial hierarchies) recover aspects of the unrecorded person?**  
     - **Yes** (traces reveal the unrecorded) → Go to Q7.  
     - **No** (traces only describe the record/machinery) → Go to Q7.  

  7. **How should we address the silence?**  
     - **Epistemic move**: Imaginative reconstruction (e.g., "critical fabulation"), flagged as non-definitive.  
     - **Institutional move**: Build counter-archives or change recording practices.  
     - **Neither** (describe the gap but don't fill it) → *Leaf 9: Gap Agnosticism*.  
     → Go to Q8.  

  8. **Does the estate correspondence case (elite family never mentioning finances) require different methods than non-elite silences?**  
     - **Yes** → Assign to position.  
     - **No** → Assign to position.  

  ---

  ### **Leaves (Positions)**  
  *Mapped from logical paths, with awkward commitments and worst-handled cases.*

  - **Leaf 1: Archival Positivism**  
    - *Path*: Q1=No.  
    - **Named?** Yes (traditional empiricists, e.g., Leopold von Ranke's adherents).  
    - **Most awkward commitment**: "Patterned silences (e.g., selective disappearance of cottagers) are random noise, never evidence."  
    - **Worst-handled case**: **Tax rolls** (abrupt stop for cottagers only is starkly non-random).  

  - **Leaf 2: Demographic Literalism**  
    - *Path*: Q1=Yes, Q2=No.  
    - **Named?** Unnamed (rarely defended explicitly today).  
    - **Most awkward commitment**: "Silence always indicates physical/legal absence of the unrecorded."  
    - **Worst-handled case**: **Colonial inventory** (line-item proves the person existed; silence about their life doesn't mean they vanished).  

  - **Leaf 3: Power Analysis (e.g., Trouillot, Foucault)**  
    - *Path*: Q1=Yes, Q2=Yes, Q4=Machinery, Q6=No, Q7=Institutional, Q8=No.  
    - **Named?** Yes.  
    - **Most awkward commitment**: "Quantitative gaps (Q5) are inadmissible; only qualitative power relations matter."  
    - **Worst-handled case**: **Tax rolls** (abrupt stop invites quantitative questions about the unrecorded population).  

  - **Leaf 4: Legibility Structuralism (e.g., James Scott)**  
    - *Path*: Q1=Yes, Q2=Yes, Q3=Legibility, Q4=Machinery, Q5=Yes, Q6=No, Q7=Institutional, Q8=Yes.  
    - **Named?** Yes.  
    - **Most awkward commitment**: "Legibility thresholds are apolitical technical limits (ignoring that they often enforce power)."  
    - **Worst-handled case**: **Colonial inventory** (racial categorization is political, not a neutral "threshold").  

  - **Leaf 5: Critical Fabulation (e.g., Saidiya Hartman)**  
    - *Path*: Q1=Yes, Q2=Yes, Q4=People, Q6=Yes, Q7=Epistemic, Q8=No.  
    - **Named?** Yes.  
    - **Most awkward commitment**: "Imaginative reconstruction licenses provisional knowledge about the unrecorded."  
    - **Worst-handled case**: **Estate correspondence** (elite financial silences resist "fabulation" due to strategic opacity).  

  - **Leaf 6: Trace Hermeneutics (e.g., Arlette Farge)**  
    - *Path*: Q1=Yes, Q2=Yes, Q4=People, Q6=Yes, Q7=Neither, Q8=Yes.  
    - **Named?** Yes.  
    - **Most awkward commitment**: "Traces in line-items (e.g., colonial inventory) can recover the unrecorded without speculation."  
    - **Worst-handled case**: **Tax rolls** (total absence leaves no traces to interpret).  

  - **Leaf 7: Quantitative Gap Realism (unnamed)**  
    - *Path*: Q1=Yes, Q2=Yes, Q4=People, Q5=Yes, Q6=No, Q7=Neither, Q8=Yes.  
    - **Named?** Unnamed (practiced but rarely theorized).  
    - **Most awkward commitment**: "Quantitative patterns alone can reconstruct the unrecorded, ignoring qualitative context."  
    - **Worst-handled case**: **Colonial inventory** (line-items resist population estimates; individual presence defies aggregation).  

  - **Leaf 8: Unoccupied: Inferential Overreach**  
    - *Path*: Q1=Yes, Q2=Yes, Q3=Suppression, Q4=People, Q5=Yes, Q6=Yes, Q7=Epistemic, Q8=Yes.  
    - **Why unoccupied?** Incoherent: Claims quantitative gaps + traces + fabulation yield definitive knowledge about the unrecorded (ignores speculation risks).  

  - **Leaf 9: Gap Agnosticism**  
    - *Path*: Q7=Neither.  
    - **Named?** Yes (e.g., Joan Scott's caution about "experience").  
    - **Most awkward commitment**: "We can describe why the gap exists but must never fill it (even provisionally)."  
    - **Worst-handled case**: **Estate correspondence** (elite silences demand explanation, not just description).  

  ---

  ### **Key Notes on the Tree**  
  1. **Suppression vs. Legibility (Q3)**: Positions rarely split here; both mechanisms often license identical claims about the unrecorded (e.g., "cottagers were marginalized"). Suppression adds intent, legibility adds systemic bias, but conclusions converge.  
  2. **Branch Instabilities**:  
     - Q3 (mechanism) often correlates with Q7 (filling gaps): Suppression leans institutional; legibility leans epistemic.  
     - Q4 (inference target) and Q6 (traces) are interdependent: Choosing "people" forces Q6=Yes; choosing "machinery" forces Q6=No in coherent positions.  
     - Q5 (quantitative gaps) is unstable with Q4: Choosing "people" often requires Q5=Yes; "machinery" allows Q5=No.  
  3. **Collapsing Leaves**:  
     - *Power Analysis* (Leaf 3) and *Legibility Structuralism* (Leaf 4) collapse on claims about the unrecorded (both conclude the machinery erased them) but diverge on intent vs. systems.  
     - *Critical Fabulation* (Leaf 5) and *Trace Hermeneutics* (Leaf 6) collapse on using traces (Q6=Yes) but diverge on filling gaps (Q7).  
  4. **Design Choices**:  
     - Elite silences (Q8) are last to avoid overcomplicating early branches.  
     - Line-items (colonial case) are handled in Q4 and Q6: Their "trace" status shapes whether we infer the person (rare) or machinery (common).  
     - Cases are embedded in questions (tax rolls in Q1–3/Q5, colonial in Q4/Q6, estate in Q8) to ground abstractions.  

  This tree is intentionally "scrappy" — positions overlap, nodes are unstable, and some leaves are unattractive — to provoke debate. Use it as a starting point for discussion, not a rigid taxonomy. For teaching: Have students role-play the cases, follow their answers, and defend the resulting position's awkward commitment.
