prompt: |-
  Hey — I'm on the investment committee of a small liberal arts college's endowment (about $90M), and I've got to circulate a memo before next week's meeting. Can you write me a first pass? American English please.

  We're deciding what to do with a one-time $6M bequest. Three options, five-year horizon, payoffs in today's dollars:

  A. A locked-in $2.0M gain (bond ladder / guaranteed annuity thing).
  B. 80% chance of +$3.0M, 20% chance of −$0.5M.
  C. 60% chance of +$4.5M, 40% chance of −$1.5M.

  Straight expected value ranks B ($2.3M) over C ($2.1M) over A ($2.0M), so B wins. But one trustee, Marla, keeps pushing a different procedure: rank the outcomes worst to best, then replace each probability p with its square before adding up, so the bad tail counts for more than its share. On her arithmetic the ordering flips and A comes out ahead by a decent margin. Separately, our committee has had an informal "floor rule" for years — never take an option with more than a 5% chance of losing more than 10% of the money at stake, whatever the upside — which knocks C out but leaves A and B standing.

  The part I can't settle: our finance guy says we make twenty-ish calls like this a year across the portfolio, the tail risks are close to independent, so any weighting of the tails is just a taste that costs us money in the agregate; he also says Marla's rule, applied consistently, would make us prefer losing slowly over winning overall. Marla says that's fine for the portfolio but not here, because of our spending floor: one bad year means real cuts to financial aid, and the damage doesn't average out across years.

  Draft the memo: recommend one option, and say whether we adopt Marla's rule as standing policy or only for this case. Give the finance guy's objection a real hearing instead of a strawman. Under 700 words, something I could actually put in front of five people with votes.
reasoning: |-
  Okay, the user is on an investment committee for a $90M college endowment and needs to draft a memo about allocating a $6M bequest. They've got three options with different risk profiles and a key debate about risk assessment methods. 

  First, let's unpack their situation: They're time-pressed professionals needing a concise, decision-ready document. The memo must resolve a technical dispute between two valid perspectives - the finance officer's portfolio math versus Marla's loss-aversion approach. The emotional undercurrent matters too: this isn't just theoretical, because losses could mean cutting financial aid. 

  Hmm... the core tension is between expected value optimization and real-world institutional fragility. The finance guy makes a mathematically sound point about independent tail risks averaging out, but Marla's right that endowment spending has non-linear consequences - one bad hit forces immediate budget cuts that compound social impact. 

  For structure: I'll lead with clear recommendations since they're under word count pressure. The "floor rule" gives solid cover to eliminate Option C immediately. Between A and B, Option A's certainty aligns better with the endowment's duty as a perpetual institution - can't let abstract probabilities gamble with student aid. 

  Notably, the user asked to avoid strawmanning the finance position. Good sign they want rigor. I'll explicitly grant that his expected-value framework would win over time... but emphasize that endowments aren't hedge funds. The phrase "utility of losses exceeds utility of gains" might help crystallize this. 

  On Marla's method: While creative, applying it universally could indeed cause irrational conservatism. Better to frame it as situational wisdom - useful for one-time allocations with spending floor implications, not general policy. 

  Word count check: At ~500 words, this leaves room for the committee to add specifics. Should I include the probability math? Maybe just reference the attachments since they'll have backup docs. Tone is crucial - collegial but decisive. No jargon like "risk-adjusted returns" without explanation. 

  ...Wait, did I address the independence argument adequately? Added the "asymmetric pain" point about financial aid cuts not reversing if next year's returns are good. That should satisfy Marla's concern without fully rejecting portfolio theory. 

  Final read-through: Recommendations stand up to scrutiny, objections are fairly represented, and the spending floor rationale protects the institution's mission. Hits the professional tone they need for trustees. Done.
answer: |-
  ## Memorandum: Allocation of $6M Bequest  
  **To:** Endowment Investment Committee  
  **From:** [Your Name/Committee Role]  
  **Date:** October 26, 2023  
  **Subject:** Recommendation for $6M Bequest Allocation & Risk Framework  

  **I. Context**  
  We must allocate a $6M bequest across three options with a 5-year horizon and payoffs in today’s dollars:  

  | Option | Payoff Structure | Expected Value (EV) | "Floor Rule" Status |  
  |--------|------------------|---------------------|---------------------|  
  | **A**  | Guaranteed +$2.0M | $2.0M              | **Passes**          |  
  | **B**  | 80% +$3.0M, 20% -$0.5M | $2.3M          | **Passes** (Max loss: 8.3% of capital) |  
  | **C**  | 60% +$4.5M, 40% -$1.5M | $2.1M          | **Fails** (40% chance of 25% loss) |  

  **II. Analysis & Recommendation**  
  1.  **Option C is eliminated** per our standing "floor rule" (≤5% chance of >10% loss). Its 40% risk of a $1.5M loss exceeds our tolerance.  
  2.  **Between A and B:**  
      *   *Finance Perspective:* Option B has a higher EV ($2.3M vs. $2.0M). Given ~20 independent decisions/year, statistically favoring EV-optimal choices *should* maximize long-term value. Penalizing low-probability tails consistently (like Marla’s method) could indeed lead to systematic underperformance by over-weighting remote risks.  
      *   *Marla’s Perspective & Spending Floor:* A $0.5M loss on *this specific allocation* could force immediate cuts to financial aid due to our endowment spending floor. The social impact of such a cut is severe and non-linear; it isn’t "averaged out" by gains elsewhere or in future years. The *utility* of avoiding this loss outweighs the marginal EV advantage of B.  
      *   **Recommendation:** **Option A (Guaranteed +$2.0M).** While B has a higher EV, the asymmetric downside risk to our core mission—even at 20% probability—is unacceptable for this discrete, impactful allocation. The certainty of A ensures no disruption to financial aid, aligning with our fiduciary duty to current students.  

  **III. Marla’s Risk-Weighting Method: Policy Application?**  
  Marla proposes ranking outcomes worst-to-best and weighting probabilities quadratically (p → p²) to emphasize tail losses. While insightful for highlighting asymmetric downside:  
  *   **Applied universally, this method could be problematic.** It systematically over-weights low-probability losses beyond their actuarial cost, likely leading to excessively conservative portfolio-wide decisions and long-term underperformance (as finance notes).  
  *   **However, it valuably diagnoses mission-critical exposures.** We agree with Marla’s *underlying principle*: **tail risks to essential spending (e.g., financial aid) warrant extraordinary aversion.**  

  **IV. Revised Policy Recommendation**  
  1.  **Formalize & Strengthen the "Floor Rule":**  
      *   Define the "floor" explicitly (e.g., "minimum required annual financial aid budget").  
      *   Require *any* investment with material downside (>5% probability of loss) to be stress-tested against its potential impact on the floor.  
      *   Automatically exclude options where significant losses (>10% of capital at risk) could breach the floor.  
  2.  **Reject universal adoption of Marla’s p² method.** It is too blunt an instrument for all decisions.  
  3.  **Adopt a mission-risk lens for discrete, large allocations:** For impactful, one-off decisions (like this bequest) where a loss directly threatens essential operations, prioritize capital preservation over EV maximization. **This is the principle guiding our Option A recommendation today.**  

  **V. Conclusion**  
  We recommend **Option A (Guaranteed +$2.0M)** for the $6M bequest. This prioritizes the certainty of funding our financial aid commitments. We further recommend **formalizing our "floor rule"** to rigorously protect essential spending, while **not adopting Marla’s specific p² weighting** as general policy. The finance team’s portfolio perspective is valid for diversified, long-term growth, but discrete allocations impacting near-term essential spending demand heightened loss aversion.  

  **Attachments:** Expected Value & Risk Calculations (Detailed).  
  **Word Count:** 598  

  ---

  ### Key Rationale Highlights
  *   **Mission Over Math:** EV favors B, but Option A's certainty protects against *any* financial aid cuts.  
  *   **Asymmetric Pain:** A $0.5M loss hurts students *now*; a $3M gain doesn't necessarily expand aid equivalently.  
  *   **Practical Policy:** Formalizing the floor rule addresses Marla's valid concern without adopting an overly rigid formula.  
  *   **Respects Both Views:** Finance's portfolio logic is acknowledged, but overruled on this specific allocation due to mission sensitivity.  

  This memo provides a clear recommendation, addresses the core debate fairly, and proposes a scalable policy solution.
