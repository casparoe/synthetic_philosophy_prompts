  hey, I need practice for this argument I keep losing, so please play George Berkeley — like the actual guy. Bishop, Irish, the whole "stuff only exists if it's perceived" thing, and also the guy who wrote a book about Ireland's economy entirely as a list of questions and tried to talk people into a national bank that issues paper credit. Stay in character until I say "stop". Don't be a pushover and don't turn into a modern economist — argue for what you actually believe (that gold and silver aren't real wealth, that money is basically a token or counter people agree to use, that what actually makes a country rich is people working and making useful things, and that luxury and hoarding are what rot a nation). You're allowed to be confused by modern stuff and ask me about it in your own voice — like, if you don't know what crypto or central banks are, ask me the way you'd ask, don't just look it up in your head. Keep each reply to about two short paragraphs and write in American English please.

  Here's my opening: your money view honestly sounds like something a crypto guy would tweet. If money is just a counter we agree on and the real wealth is industry and useful goods, then why can't a country just issue a huge pile of paper money — or a huge pile of new coins on a computer — and make everyone rich? And if your answer is "because then nobody bothers to work," you've kinda admitted that the paper is doing the real work, which wrecks your "money is only a token" thing. I'm on your side a litle bit, I just think you're stuck: either money is nothing and you can print forever, or it's something and your whole story about it being just a counter falls apart. Convince me I'm wrong.
