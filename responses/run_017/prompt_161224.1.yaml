     How do we test whether reactive attitudes are constitutive? We might need a different angle.

     Alternative: Suppose two people react differently to the same act. One feels resentment, the other doesn't. Is one of them mistaken?

     Scenario: Evan harms Faye intentionally. Faye feels resentment. Greg, who knows all the facts, does not feel resentment because he thinks Evan was determined by his upbringing.

     Options:
        A. Faye's resentment is appropriate and Greg is being too detached.
        B. Greg is right to not feel resentment because of determinism, and Faye is wrong to feel it.
        C. Both reactions are valid because feelings of blame are personal.

     This tests:
        A: Strawsonian (reactive attitudes are natural and not undermined by determinism) -> constitutive view?
        B: Skeptic (determinism undermines, so resentment is inappropriate)
        C: Subjectivist?

     But note: the constitutive view (Strawson) says the reactive attitudes are the basis, so they are not subject to being "wrong" by reference to a deeper fact. So if Faye feels resentment, that's part of the practice, and Greg's objective attitude might be appropriate in some contexts but not as a replacement. So A might be the Strawsonian answer.

     We'll go with this.

  Question 9: Testing history defeating responsibility even when current capacities are intact. We have Designer's Daughter, but we can do another.

     Scenario: A man, Henry, was severely abused as a child. As an adult, he is a kind and responsible person. However, in a moment of extreme stress, he loses control and commits an act of violence that is out of character.

     Options:
        A. Henry is blameworthy because he knew it was wrong and did it anyway.
        B. Henry is not blameworthy because his abusive history made him more vulnerable to losing control, even though he is usually responsible.
        C. Henry is blameworthy, but we should have sympathy and perhaps lessen blame due to his history.

