  We'll define the leaves and their expected answers.

  Leaves:

  1. **Strawsonian (constitutive reactive attitudes)**: 
     - Blame is tied to the natural reactive attitudes (resentment, etc.) and is appropriate when there is ill will or poor quality of will.
     - History: usually, current quality of will matters, unless there is an exemption (like insanity) or excuse (like coercion).
     - Indeterminism: not required; reactive attitudes are part of our framework and don't depend on metaphysics.
