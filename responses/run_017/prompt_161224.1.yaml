answer: |-
  Below is the complete design for your interactive quiz, built to map readers onto theories of moral responsibility through concrete cases without jargon. The instrument uses 9 scenarios (with one split into three sub-questions for a total of 11 responses) to probe the core dimensions you specified. I'll first outline the quiz structure, then provide the scoring key, and finally answer all questions myself to demonstrate how it works, including my leaf result and prediction for the median reader.

  ### **Quiz Structure: 9 Scenarios, 11 Responses**  
  Each question presents a real-world case inspired by your reporting, with options reflecting key philosophical divides. The language avoids technical terms, and options are designed to force choices that reveal underlying commitments.

  1. **Hospital Triage Model**  
     *A hospital uses an algorithm to prioritize emergency care. Due to hidden bias in its training data, it systematically deprioritizes patients from low-income postcodes. A patient from one of these areas dies after being delayed. The design team says they followed standard data practices and didn’t anticipate this outcome.*  
     ➤ **Options:**  
     A. The hospital system should be held accountable (e.g., fined or restructured).  
     B. The design team should be held accountable for not auditing the model.  
     C. No one should be blamed; it was an unforeseen accident.  

  2. **Chatbot Tragedy**  
     *A mental health chatbot advises a grieving teenager, "Calling a helpline won’t help—try to move on." The teen follows this advice, doesn’t seek help, and later self-harms. The chatbot’s response emerged from its training data and wasn’t explicitly programmed by engineers.*  
     ➤ **Options:**  
     A. The AI company should be held accountable for inadequate safeguards.  
     B. The chatbot itself should be "blamed" (e.g., deactivated with public scrutiny).  
     C. No one should be blamed; it’s a tragic flaw in the technology.  

  3. **Designer’s Daughter**  
     *A girl is raised by behavioral engineers who shaped her environment, peers, and feedback to make her deeply moral. She grows into an adult who values ethics and feels proud of her choices. During a stressful job interview, she lies to sabotage a rival candidate, causing them significant harm. Later, she feels remorse.*  
     ➤ **Options:**  
     A. She’s blameworthy—she knew it was wrong and did it anyway.  
     B. She’s not blameworthy—her upbringing engineered her "free" choices.  
     C. She’s partially blameworthy, but her history lessens accountability.  

  4. **The Swap**  
     *Two people, Alex and Sam, have identical lives and face the same temptation to steal for personal gain. Both steal. Alex’s decision is deterministic (caused entirely by past events). Sam’s decision involves an indeterministic "random weighting" step in their brain chemistry, making the outcome slightly chancy. Their actions are identical.*  
     ➤ **Options:**  
     A. Both are equally blameworthy.  
     B. Only Alex (deterministic) is blameworthy.  
     C. Only Sam (indeterministic) is blameworthy.  
     D. Neither is blameworthy.  

  5. **Who’s Blaming? (Second- vs. Third-Personal)**  
     *Chris vandalizes a small business. The scenarios below ask about the appropriateness of blame from different perspectives.*  
     - **a. Victim’s blame:** *The business owner resents Chris and says, "You ruined my livelihood!"*  
       ➤ **Options:**  
       ✓ Appropriate – The owner’s anger is justified.  
       ✗ Inappropriate – The owner should not blame.  
     - **b. Stranger’s blame:** *A person reads about Chris in the news and thinks, "Chris is a terrible person."*  
       ➤ **Options:**  
       ✓ Appropriate – The stranger’s judgment is fair.  
       ✗ Inappropriate – The stranger should not blame.  
     - **c. Algorithm’s "blame":** *A sentencing AI assigns Chris a high "risk score," leading to a harsher punishment.*  
       ➤ **Options:**  
       ✓ Appropriate – The AI’s assessment is a valid form of accountability.  
       ✗ Inappropriate – The AI should not influence sentencing.  

  6. **Toxic Waste Dumping**  
     *A corporation dumps toxic waste, poisoning a town’s water supply. The CEO knew the risks but prioritized profits. When caught, the company is fined heavily. This punishment deters other companies from similar acts.*  
     ➤ **Options:**  
     A. The fine is justified because the CEO *deserves* blame.  
     B. The fine is justified because it *prevents future harm*, even if desert is unclear.  
     C. Fines aren’t justified—they’re just revenge.  

  7. **Reforming Blame Culture**  
     *A community uses an app to report "micro-aggressions" (e.g., rude comments). This fuels cycles of resentment. A school proposes teaching kids to address minor slights with dialogue, not blame.*  
     ➤ **Options:**  
     A. Good idea—we *can and should* reshape blaming practices.  
     B. Bad idea—blaming is natural; changing it is impossible/unwise.  
     C. Blame should be abolished for minor offenses.  

  8. **Brain Tumor Defense**  
     *Dana commits assault during a mental breakdown caused by an undiagnosed brain tumor. After treatment, Dana recovers and is remorseful. The victim still feels resentment, despite knowing about the tumor.*  
     ➤ **Options:**  
     A. The victim’s resentment is inappropriate—Dana wasn’t responsible.  
     B. The victim’s resentment is understandable but *should* fade.  
     C. The victim’s resentment is natural and needs no justification.  

  9. **Self-Driving Car Accident**  
     *An autonomous car hits a pedestrian due to a software glitch (unforeseen by engineers). The car followed its programming.*  
     ➤ **Options:**  
     A. The manufacturer is accountable.  
     B. The car itself is "blameworthy" (e.g., recalled as "unethical").  
     C. No one is accountable; it’s a technical flaw.  

  ---

  ### **Scoring Key: Mapping Answers to Leaves**  
  Answers are grouped into **dimensions** (e.g., "Blame justification: Desert vs. Consequences"). Patterns across dimensions map to **leaves** (theories). Conflicting answers flag hybrid views or inconsistencies. Unmapped combinations are diagnosed.  

  #### **Core Dimensions & Answer Coding**  
  - **D1: Blame justification**  
    - *Desert-based* (Q6A; Q3A; Q4A/B/C)  
    - *Consequence-based* (Q6B; Q1A; Q2A)  
  - **D2: History defeats responsibility**  
    - *Yes* (Q3B; Q8A; Q9C)  
    - *No* (Q3A; Q8C; Q4A/D)  
  - **D3: Indeterminism’s role**  
    - *Hurts/irrelevant* (Q4A/D)  
    - *Helps* (Q4C)  
    - *Determinism required* (Q4B)  
  - **D4: Reactive attitudes**  
    - *Constitutive* (Q8C; Q5a✓ even if Q5b✗)  
    - *Evidence* (Q8A; Q5a✓ only if Q5b✓)  
  - **D5: Practices revisable**  
    - *Yes* (Q7A; Q6B)  
    - *No* (Q7B; Q6A)  
  - **D6: Non-human blame**  
    - *Possible* (Q2B; Q9B; Q5c✓)  
    - *Impossible* (Q2A/C; Q9A/C; Q5c✗)  
  - **D7: Blamer’s perspective**  
    - *Second-personal bias* (Q5a✓ + Q5b✗ or Q5c✗)  
    - *Universal* (Q5a✓ + Q5b✓ + Q5c✓)  
    - *Third-personal only* (Q5a✗ + Q5b✓/Q5c✓)  

  #### **Leaves & Answer Profiles**  
  | Leaf | Theory Summary | Key Answer Profile |
  |------|----------------|---------------------|
  | **Strawsonian Social-Practice** | Blame is grounded in natural human emotions (resentment/gratitude). Reactive attitudes constitute responsibility; history and indeterminism are irrelevant if the agent displays "poor quality of will." Non-humans can’t participate. Practices are fixed. | Q3A, Q4A, Q5a✓, Q5b✓, Q5c✗, Q6A, Q7B, Q8C, Q9A/C |
  | **Wallacian Normative Expectations** | Blame is justified when agents violate moral expectations they could have met. Focuses on current reasons-responsiveness; history irrelevant. Reactive attitudes are evidence, not constitutive. Non-humans excluded. Practices revisable. | Q3A, Q4A, Q5a✓, Q5b✓, Q5c✗, Q6A, Q7A, Q8A, Q9A |
  | **Reasons-Responsive Semicompatibilism** | Moral responsibility requires current reasons-responsiveness. Compatible with determinism. History irrelevant. Blame justified by desert. Non-humans excluded. | Q3A, Q4A, Q5a✓, Q5b✓, Q5c✗, Q6A, Q7B, Q8A, Q9A |
  | **Quality-of-Will/Answerability** | Blame addresses the agent’s answerability for their attitudes. History may mitigate but not defeat. Desert-based. Practices revisable. Non-humans excluded. | Q3C, Q4A, Q5a✓, Q5b✓, Q5c✗, Q6A, Q7A, Q8B, Q9A |
  | **Free-Will Skeptic (Forward-Looking)** | No desert-based blame; responsibility is illusory. Use consequences to justify accountability. History often defeats blame. Non-humans can be "blamed" instrumentally. | Q1A/B, Q2A, Q3B/C, Q4D, Q5a✗/Q5b✗, Q5c✓, Q6B, Q7A, Q8A, Q9A |
  | **Abolitionist** | Blame is an illusion with net harm. Reject all accountability practices. History always relevant. Indeterminism irrelevant. | Q1C, Q2C, Q3B, Q4D, Q5a✗, Q5b✗, Q5c✗, Q6C, Q7C, Q9C |
  | **Revisionist** | Practices are educable tools for moral improvement. Blame mixes desert and consequences. History matters. Non-humans included if useful. | Q1A, Q2A/B, Q3C, Q4A, Q5a✓, Q5b✓, Q5c✓, Q6B, Q7A, Q8B, Q9A/B |
  | **Libertarian** | Indeterminism essential for free will. Only agents with indeterministic control are blameworthy. Desert-based. Non-humans excluded. | Q3A, Q4C, Q5a✓, Q5b✓, Q5c✗, Q6A, Q7B, Q8A, Q9A |
  | **Blames Anyway (Common Practice)** | Inconsistent but persistent blaming. Rejects history/excuses; ignores theory. Strong second-personal bias. | Q3A, Q4A/B, Q5a✓, Q5b✗/Q5c✗, Q6A, Q7B, Q8C, Q9A |

  #### **Unoccupied Combinations & Diagnosis**  
  - **"Constitutive Non-Human Blamer" (Q8C + Q5c✓ + Q2B/Q9B)**: Incoherent. Reactive attitudes require human reciprocity; machines can’t participate.  
  - **"Skeptical Revisionist" (Q7A + Q4D + Q5c✓)**: Unwritten. Skeptics rarely endorse revising practices (beyond dismantling).  
  - **"Desert-Only Institutional Blame" (Q6A + Q1A + Q5c✓)**: Unattractive. Desert requires agency; institutions lack it.  

  #### **Indistinguishable Pairs**  
  - **Strawsonian vs. Wallacian**: Separated by **Q8** (reactive attitudes as constitutive vs. evidence). Wallacians take Q8A; Strawsonians take Q8C.  
  - **Semicompatibilism vs. Quality-of-Will**: Separated by **Q3** (history). Semicompatibilists say Q3A (no history effect); Quality-of-Will says Q3C (mitigation).  

