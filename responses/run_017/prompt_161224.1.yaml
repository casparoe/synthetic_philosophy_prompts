        A: Current capacities matter most (semicompatibilism, Strawsonian)
        B: History can defeat responsibility (even if current capacities are usually intact, the history can create vulnerabilities that excuse in extreme situations)
        C: Middle ground.

  Question 10: Testing whether non-human can be blamed. We have the hospital and chatbot, but we can do a direct one.

     Scenario: A self-driving car hits a pedestrian because of a software glitch that no one anticipated. The car was following its programming.

     Options:
        A. The car manufacturer is blameworthy.
        B. The car itself is blameworthy.
        C. No one is to blame; it was an accident.

     This is similar to the hospital and chatbot, but we can include it to see consistency.

