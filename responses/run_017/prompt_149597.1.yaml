  ### Leaf Summary (11 Leaves)
  1. **Verbal Dispute** (e.g., Wittgensteinian, deflationist)  
     *Path*: Node 0 → Merely verbal.  
     *Awkward commitment*: That experts persistently misunderstand their own language.  

  2. **Empty: Intrinsic Qualia Tied to Function**  
     *Path*: Node 1 (Yes) → Node 2 (No).  
