  5. **Relationalism/Structuralism** (e.g., Shoemaker, Cohen)  
     *Path*: Node 1 (No) → Node 3 (No) → Node 5 (Yes) → Node 8 (Relations).  
     *Awkward commitment*: That two experiences could feel identical despite differing in all intrinsic properties, if relations match.  
     *Synchronic/diachronic verdict*: Same answer (No to both cases), and comfortable—relations define character.  

  6. **Reductive Representationalism** (e.g., Dretske, Tye)  
     *Path*: Node 1 (No) → Node 3 (No) → Node 5 (Yes) → Node 8 (Representational content).  
     *Awkward commitment*: That palimpsest involves a change in experience even when reports/discriminations are fixed.  
     *Synchronic/diachronic verdict*: Same answer? Twin-taster: No (if content unswapped); palimpsest: Yes (content changes). But this is unstable—fixed reports suggest fixed content. Awkward for the view.  

  7. **Non-Reductive Phenomenal Realism** (e.g., Chalmers, property dualist)  
     *Path*: Node 1 (Yes) → Node 2 (Yes) → Node 4 (No) → Node 7 (No) → Node 9 (Distinct) OR Node 7 (No) → Node 10 (No).  
     *Awkward commitment*: That physical science is incomplete despite causal closure.  
     *Synchronic/diachronic verdict*: Same answer (Yes to both cases), and comfortable—qualia are intrinsic and potentially hidden.  

  8. **Epiphenomenalism** (e.g., Huxley, Jackson)  
     *Path*: Node 1 (Yes) → Node 2 (Yes) → Node 4 (No) → Node 6 (No).  
     *Awkward commitment*: That evolution preserved qualia despite their causal irrelevance.  
     *Synchronic/diachronic verdict*: Same as non-reductive realism.  

  9. **A Posteriori Physicalism** (e.g., Loar, Papineau)  
     *Path*: Node 1 (Yes) → Node 2 (Yes) → Node 4 (Yes) → Node 6 (Yes) → Node 9 (Identical/supervenient) → Node 11 (Emergent).  
     *Awkward commitment*: That we can refer to physical properties using concepts that obscure their true nature.  
     *Synchronic/diachronic verdict*: Same as non-reductive realism.  

  10. **Russellian Monism or Panpsychism** (e.g., Russell, Goff)  
      *Path*: Node 1 (Yes) → Node 2 (Yes) → Node 4 (Yes) → Node 6 (Yes) → Node 9 (Identical/supervenient) → Node 11 (Fundamental).  
      *Awkward commitment*: That fundamental particles have experiential properties.  
      *Synchronic/diachronic verdict*: Same as non-reductive realism.  
      *Cannot separate from a posteriori physicalism at earlier nodes*: Both answer identically until Node 11.  

  11. **Mysterianism** (e.g., McGinn, Nagel)  
      *Path*: Node 1 (Yes) → Node 2 (Yes) → Node 4 (No) → Node 7 (No) → Node 10 (Yes).  
      *Awkward commitment*: That humans are constitutionally unable to grasp a fundamental aspect of reality.  
      *Synchronic/diachronic verdict*: Same as non-reductive realism.  
