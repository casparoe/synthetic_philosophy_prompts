  Below is a complete design for a 75-minute session that meets your requirements. The activity forces participants to experience the limitations of excluded middle through gameplay, without using technical terms until the debrief. It avoids the epistemic "we don't know" interpretation by making truth contingent on constructive commitments during play.

  ---

  ### **Game: Proof Builders vs. Oracles**  
  *The core tension: Players must construct proofs using only what they can explicitly verify, while a hidden rule blocks classical case-splitting.*

  #### **Materials**  
  - Whiteboard + markers  
  - Projector displaying the **game rules** (see below)  
  - 12 index cards (6 red, 6 blue)  
  - A sealed envelope labeled "Contingent Truth" (contents: a simple Python function, e.g., `def collatz(n): while n != 1: n = n//2 if n%2==0 else 3*n+1` and a note: "Does `collatz(27)` halt?")  

  #### **Roles & Teams**  
  - **Proof Builders (4–5 people)**: Must prove statements by constructing explicit evidence.  
  - **Oracles (4–5 people)**: Challenge proofs and demand evidence for disjunctions.  
  - **Referee (you)**: Enforces rules silently (use a bell: 1 ding = valid move, 2 dings = invalid).  
  - **Math-Degree Guy (MDG)**: Assign as "Wildcard" (can join either team but must rotate every 10 mins).  

  #### **Game Rules (Displayed via Projector)**  
  1. **Goal**: Proof Builders score 1 point for proving a "Golden Statement" (revealed mid-game).  
  2. **Basic Moves**:  
     - Assert `A` (if you can show direct evidence for `A`).  
     - Assert `A → B` (if you can transform evidence of `A` into evidence of `B`).  
     - Assert `A ∨ B` (only if you **commit to `A` or `B` now** and show evidence for your choice).  
  3. **Key Constraints**:  
     - **Disjunction Commitment**: If you assert `A ∨ B`, Oracles immediately demand: "Which one? Prove it." No hedging.  
     - **One Path Only**: No saving/rewinding state. If you try to split cases (e.g., "If `A`... if not `A`..."), Referee blocks it (2 bells).  
     - **Evidence Rules**:  
       - "Evidence" for a programmatic claim (e.g., "`f` halts") = a step-by-step execution trace.  
       - "Evidence" for negation (e.g., `¬A`) = a function converting evidence of `A` to a contradiction.  
  4. **No Hidden Truth**: All claims are about the **current game state** (e.g., cards on the board, the Python function). Referee has no secret knowledge.  

  ---

  ### **Phase 1: Training Round (15 min)**  
  **Goal**: Prove "All red cards are on the left OR all blue cards are on the right."  
  - *Setup*: Shuffle 6 red/blue cards into 3 piles (left/mid/right). Builders see the board.  
  - *Designed friction*:  
    - Builders try: "Either red-left is true or not; if not, blue-right must be true!"  
    - Oracles demand: "Which one? Show us *now*."  
    - Referee blocks case-splitting (2 bells).  
  - *Resolution*: Builders realize they must *pick a side* and audit cards. They score by physically moving cards to satisfy their choice.  
  - *Why it works*: Forces disjunction commitment with tangible evidence. MDG often tries to optimize by pre-splitting cases and hits the bell.  

  ---

  ### **Phase 2: Golden Statement Round (45 min)**  
  **Goal**: Prove: "The `collatz` function halts for `n=27` OR it does not halt for `n=27`."  
  - *Setup*: Reveal the sealed envelope. Show the Python function. Rules forbid running it beyond 3 steps (simulate resource limits).  
  - **Predictable Breakdowns**:  
    | Scenario | Referee Response |  
    |----------|------------------|  
    | Builders say: "It must halt or not—let’s assume cases." | Bell x2 + point to "One Path Only" rule. |  
    | Builders assert `Halts ∨ ¬Halts` without committing. | Oracles demand: **"Which one? Prove it now."** |  
    | MDG tries to "solve" by writing a proof sketch. | Referee: "Where’s your evidence? Trace *this* input." |  
    | Two players team up to run `collatz(27)` illegally. | Bell x2 + freeze their turn. Let Oracles challenge. |  
    | Someone argues: "But in reality, it *does* one or the other!" | Referee: "The rule is about what **you can show**, not reality." |  
  - **Scoring**: Builders score only if they:  
    - Commit to `Halts` and show a full trace (impossible without cheating), OR  
    - Commit to `¬Halts` and show how *any* trace would loop (impossible).  
  - **Outcome**: After 30 mins, Builders fail. Reveal that both disjuncts are open problems.  

  ---

  ### **Phase 3: Debrief (15 min)**  
  **Map gameplay to logic**:  
  | **Game Moment** | **Logical Concept** | **Script** |  
  |-----------------|----------------------|------------|  
  | "Which one? Prove it now." | BHK interpretation of disjunction | "When you said *or*, you had to **give me one** and back it up. That’s how disjunction works constructively: a proof of `A∨B` is a tuple `(tag, evidence)` where `tag` tells me which one." |  
  | Blocked case splits | Excluded middle isn’t free | "When you tried to split on `P ∨ ¬P`, you were using a 'ghost rule'—one we **didn’t provide**. Classical math lets you fork proof paths; here, you had to walk one road." |  
  | Failed `collatz` proof | Undecidability ≠ ignorance | "This wasn’t about *knowing*—it’s that a constructive proof requires a **method**. If no method exists (like for halting), `P ∨ ¬P` is like asking for a unicorn." |  
  | MDG’s optimization attempts | Non-constructive shortcuts | "Some 'proofs' (like assuming ¬Halts leads to contradiction) might work classically, but they’d still need to **build** evidence for the disjunct you want." |  

  **Address pitfalls**:  
  - *"So constructivists just hate case-splitting?"* → "No—they allow it **if you have the disjunction upfront**. But asserting `P ∨ ¬P` without evidence is what’s rejected."  
  - *"Isn’t this just avoiding ignorance?"* → "Notice: the game didn’t have a ‘truth’ hidden from you. The Python function **is what it is**—but a constructive proof requires **you** to output a witness or function. No witness? No proof."  

  ---

  ### **What the Game Can’t Do**  
  - **Liberties taken**:  
    - Uses a **finitary BHK interpretation** (proofs = executable evidence) for simplicity. Real constructivism allows abstract constructions.  
    - "One Path Only" rule crudely simulates **no backtracking in proof trees**. In actual intuitionism, reasoning is monotonic (once proven, always true), but branching *is* allowed with disjunctions you have evidence for.  
  - **Contested point**: Hardlining "no case-splits ever" oversimplifies. Some constructivists accept limited forms of LEM (e.g., for decidable predicates).  
  - **What’s missing**: The game can’t convey **topological** (e.g., Kripke semantics) or **computational** (e.g., realizability) models of constructivity. Focus here is on proof-as-construction.  

  ---

  ### **Why It Meets Your Requirements**  
  1. **Disjunction commitment is enforced mechanically**: Oracles’ "Which one?" + Referee’s bell make it costly to waffle.  
  2. **Single structural rule ("One Path Only")**: Blocks classical case-splitting cleanly. Players *see* it’s the bottleneck.  
  3. **Avoids epistemic reading**: Truth isn’t hidden—the Python function is public. Failure comes from inability to *construct*, not to *know*.  
  4. **Handles MDG**: His "solving" attempts hit the rules (e.g., no trace for `collatz`). Rotation prevents takeover.  

  Run it as-is. The friction in Phase 2 will make the debrief land.
