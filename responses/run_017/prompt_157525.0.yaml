  **Rules in full**:

  - The goal: Prove the statement: "For any proposition P, P or not P." (∀P:Prop, P ∨ ¬P)
  - The proof must be done using the following rules:
      - If you have A and you have B, you can write A ∧ B.
      - If you have A ∧ B, you can write A.
      - If you have A ∧ B, you can write B.
      - If you have A, you can write A ∨ B for any B.
      - If you have B, you can write A ∨ B for any A.
      - If you have A → B and you have A, you can write B.
      - To prove A → B, you can write: "Assume A", then prove B under this assumption. Then you can write A → B.
      - ¬A is defined as A → False.
      - If you have A and ¬A, you can write anything (including False).
      - You can write any tautology that follows from what you have by these rules.
  - Special rule: When you write A ∨ B, you must specify which of A or B you are proving. For example, if you write "P ∨ ¬P", you must say whether you are proving P or ¬P, and you must have a proof of that one.
