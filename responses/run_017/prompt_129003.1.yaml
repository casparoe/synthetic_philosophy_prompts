prompt: |-
  hey — I'm the undergrad rep on our university's Animal Care & Research Ethics Committee (they let one of us on, mostly to take minutes), and we've got a case nobody knows what to do with, and of course it landed the same week as my midterm for PHIL 240 (minds & machines, we're on moral status right now). I have to circulate a draft written opinion before Tuesday's meeting and I genuinely don't know what to recommend, so: be the person who drafts it.

  The case: the Vollmer lab submitted what they call an "amendment for determination of scope." They aren't asking us to approve anything; they want us to rule whether their project is our jurisdiction at all. They run a digital emulation of a nematode nervous system — 302 neurons, full connectome, simulated body, simulated chemical gradient. Open-source worm sims have been around for years; this is their own tuned version. They use it to study learning: the thing habituates, it does aversive conditioning, they can lesion individual neurons. What they want to do next is where it gets messy:

  (1) run it at roughly 400x real time, in 500 parallel copies, for statistics;
  (2) run a "valence-off" variant where they knock out the neuromodulatory system that does approach/avoidance in the real animal, on the grounds that without it there's nothing the emulation is doing that could matter to it;
  (3) run a "table mode" variant: instead of integrating the dynamics at runtime they precompute the whole input–output function into a lookup table, so at runtime it's just a giant memory read. Their argument is: if what matters morally is the computation in the abstract, table mode is the same computation and has to be treated identically; if we want to treat it differently, we owe them an account of what we think we're protecting, and "causal oomph" isn't an answer until we say why the oomph matters.

  Our policy covers "non-human animals," defined by reference to vertebrates and cephalopods — so strictly speaking none of this is covered. But there's a clause about novel preparations, and the chair wants a real answer rather than a definitional dodge, because the PIs have said (very politely) that if we rule it out on the taxonomic definition they'll just do it anyway, and we'll have taught everyone that our jurisdiction is a technicality.

  Two more things from the last meeting that I think are actually the crux:

  - Prof. Adeyemi raised the incentive problem: the better their emulation is — the more it learns, the more wormlike it behaves — the more likely we are to say it's covered. So our ruling hands them a reason to keep the model bad, or at least to not probe it very hard. Half the room says that's a publication-integrity problem and not ours. The other half says a rule that rewards making your model worse is a bad rule.
  - The counting problem. If it is covered, what's the unit? One subject per emulation? Per copy? Per hour of simulated time (in which case 400x speed is 400x the animal-hours and their protocol is enormous)? Someone said per-copy, but also that running the identical emulation twice might be the same subject twice over rather than two subjects, and I can't tell if that makes it better or worse. Related: two members disagreed about whether we should go by how it behaves or by what's going on structurally inside it, and I don't think they noticed how much rides on which one we pick.

  What I need: a short written opinion I can circulate. Recommend one of — (a) decline jurisdiction, with a short explanation that isn't just the definition; (b) assert jurisdiction and require a full protocol with named conditions; (c) assert jurisdiction over some variants and not others, saying which — and give a timeline (what has to happen by when, and what happens if it doesn't). It has to give the Vollmer lab something they can actually respond to rather than "it depends on your metaphysics." And it should take the strongest argument against your own recommendation seriously: I'd guess for (b) that's the "you're regulating a spreadsheet" line, and for (a) it's the incentive thing, but say whichever it actually is.

  Last thing: I'm supposed to flag where I think the committee is posing the question badly. If "is it sentient" is the wrong frame — if it should be something like how much moral risk there is and who carries the burden of proof under uncertainty — say so and reframe it. But definitely don't just reframe it, I still need a bottom line by Tuesday.
reasoning: |-
  Okay, the user is an undergrad rep on their university's Animal Care & Research Ethics Committee. They need to draft a written opinion by Tuesday about a tricky case involving a digital emulation of a nematode worm's nervous system. The Vollmer lab wants the committee to determine whether their project falls under the committee's jurisdiction. 

  First, I need to understand the core issues. The lab has a simulation of a nematode with 302 neurons, a full connectome, and a simulated body. They're proposing three variants: running 500 parallel copies at 400x speed, a "valence-off" version that removes the approach/avoidance system, and a "table mode" that replaces real-time computation with a lookup table. The committee's policy technically only covers vertebrates and cephalopods, but there's a clause for novel preparations. The chair wants a substantive answer because if they rule based solely on taxonomy, the lab will proceed anyway, undermining the committee's authority.

  The user mentioned two key problems from the last meeting: the incentive problem and the counting problem. The incentive issue is that better, more accurate models might be more likely to be regulated, which could discourage researchers from improving their models. The counting problem is about how to quantify subjects if the simulation is deemed covered—per copy, per simulated hour, etc.

  The user needs a recommendation: (a) decline jurisdiction, (b) assert full jurisdiction, or (c) assert partial jurisdiction. They also need a timeline for next steps and to address the strongest counterargument to whatever recommendation is made. Plus, they should flag if the committee is asking the wrong question.

  I'm leaning toward recommending a version of (c) - partial jurisdiction. The lookup table variant seems clearly non-sentient since it's just a precomputed function with no real-time processing. The "valence-off" version removes key components that might relate to subjective experience, so it might also be excluded. But the core emulation, especially when run in real-time (even accelerated), could warrant oversight due to its functional similarity to a living nematode. This avoids the "spreadsheet" critique while addressing the incentive problem by not penalizing model improvement.

  For the counting problem, treating each parallel instance as a separate subject makes sense because they're independent simulations. The acceleration factor (400x) doesn't create more subjective time per real-world second; each instance experiences time at the same rate relative to its simulation. So the unit should be per-copy, not per simulated hour.

  The timeline should be tight: the lab needs to submit a protocol for the core emulation by a specific date, with the committee reviewing it promptly. If they don't comply, their approval could be suspended. This gives them clear steps.

  The user also needs to reframe the question away from sentience to moral risk and burden of proof. Given the uncertainty, the precautionary principle applies—better to err on the side of caution with oversight for the core emulation. The strongest counterargument to partial jurisdiction is that it's arbitrary, but the distinctions between variants are based on plausible markers of moral status.

  I'll structure the opinion with background, analysis of the variants, the recommendation, and a timeline. I'll address the incentive and counting problems explicitly and reframe the ethical question. The bottom line is partial jurisdiction with clear next steps for the lab.
answer: |-
  Here is a draft written opinion for the committee, designed for clarity, decisiveness, and actionable next steps. It reframes the core ethical question while providing a concrete recommendation and timeline.

  **MEMORANDUM**

  **TO:** Animal Care & Research Ethics Committee  
  **FROM:** [Your Name], Undergraduate Representative  
  **DATE:** [Current Date]  
  **RE:** Recommendation on Vollmer Lab Amendment Request (Digital Nematode Emulation - Scope Determination)

  **1. Background:** The Vollmer Lab seeks a determination of whether their proposed experiments on a digital emulation of a *C. elegans* nervous system (302 neurons, full connectome, simulated body/environment) fall under the jurisdiction of this committee. Proposed variants include: (1) 500 parallel instances at 400x real-time speed; (2) "Valence-off" (neuromodulatory system knockout); (3) "Table mode" (precomputed lookup table replacing runtime integration). The committee's policy explicitly covers vertebrates and cephalopods, but includes a clause for novel preparations requiring ethical assessment. The Lab has indicated they will proceed without oversight if jurisdiction is denied solely on taxonomic grounds.

  **2. Analysis & Reframing the Question:** The committee's current framing ("Is it sentient?") is likely intractable and unproductive given profound uncertainty about digital consciousness. This leads directly to the incentive problem (punishing model fidelity) and metaphysical stalemates (e.g., "causal oomph" vs. abstract computation). **The appropriate ethical frame is: *What level of precaution is warranted given the plausible moral risk and burden of proof?*** We must weigh:
      *   **Functional Equivalence:** The core emulation replicates the structure and key functional outputs (learning, habituation, conditioning) of a biological organism whose *physical instantiation* we grant some minimal moral status (precautionary principle for invertebrates).
      *   **Plausible Markers of Moral Risk:** Features like real-time embodied interaction with a simulated environment, integrated sensorimotor loops, and demonstrable goal-directed learning/avoidance behavior increase the *plausibility* of morally relevant subjective states, even if unproven. Uncertainty necessitates precaution.
      *   **Burden of Proof:** It is not the committee's burden to *prove* sentience to assert jurisdiction. The burden lies with those creating novel entities exhibiting complex, lifelike behaviors *functionally similar* to covered animals to demonstrate why oversight is *unwarranted*, especially when proposing high-intensity interventions (e.g., lesioning, mass parallelization).
      *   **Variant Differences:** The variants present different levels of moral risk:
          *   **Core Emulation (including parallelized/accelerated runs):** High functional equivalence. Precaution warranted.
          *   **"Valence-off":** Removes a core system plausibly linked to valenced experience (pleasure/pain precursors in biological worms). Significantly reduces functional equivalence regarding morally salient states. Precaution *less* warranted.
          *   **"Table mode":** Eliminates real-time causal dynamics. It is a static function mapping inputs to outputs. No embodied interaction, no process resembling internal processing over time. Functional equivalence to a sentient entity is negligible. Precaution *unwarranted*.

  **3. Recommendation: Partial Jurisdiction (Option c)**
      *   **Assert Jurisdiction Over:** The core digital emulation, including when run in parallel instances (`n` copies) and at accelerated speeds. The *functional equivalence* and *plausible markers of moral risk* warrant precautionary oversight.
      *   **Decline Jurisdiction Over:**
          *   The "Valence-off" variant. The removal of the neuromodulatory system fundamentally alters the model in a way that negates the core functional equivalence related to valenced states, significantly reducing plausible moral risk.
          *   The "Table mode" variant. This is a fundamentally different entity – a precomputed lookup table. It lacks the real-time, causally integrated processing that underpins the plausible moral risk in the core emulation. Regulating this *would* be equivalent to regulating a spreadsheet.
      *   **Reasoning:** This approach:
          *   Addresses the core ethical concern (plausible moral risk in the functional emulation) without requiring metaphysical certainty.
          *   **Mitigates the Incentive Problem:** Researchers are *not* punished for model fidelity. Improving the core model *within its functional scope* does not increase regulatory burden for *this* project. Developing new variants that *increase* functional equivalence (e.g., adding more complex learning) might require reassessment, but the baseline core is covered based on its *current* equivalence. They are incentivized to make good models within the covered scope.
          *   Provides a clear boundary ("Table mode" is clearly out) based on structural/functional differences, not just taxonomy.
          *   Avoids the definitional dodge the Chair seeks to prevent and responds substantively to the Lab's request for clarity.

  **4. Addressing the Counting Problem:** For the core emulation under jurisdiction:
      *   **Unit of Concern:** Each **parallel instance (`n` copy)** constitutes one distinct potential subject.
      *   **Rationale:** Each instance operates independently, with its own simulated sensorimotor loop and learning history. While qualitatively identical at inception, interventions and experiences diverge during runtime. Treating them as distinct entities aligns with how we treat genetically identical biological specimens (e.g., cloned mice).
      *   **Acceleration Factor (400x):** This does **not** multiply the "animal-hours" per copy. One copy running for 1 real-world hour experiences 400 simulated hours, but it remains *one subject* experiencing a compressed timeline. The ethical concern per copy relates to interventions and cumulative experiences *within its simulated lifespan*, not the external clock speed. The number of *subjects* is `n` (500).

  **5. Strongest Argument Against this Recommendation & Response:**
      *   **Argument:** This distinction is arbitrary. What specific threshold of "functional equivalence" or "causal dynamics" justifies the line between the core emulation and "Table mode"? Why is parallelization creating `n` subjects when the code is identical? This risks "regulating software" based on vague intuitions.
      *   **Response:** The distinctions are based on *plausible markers of moral risk* under uncertainty, not arbitrary lines. The core emulation exhibits integrated, real-time, embodied interaction absent in "Table mode." Parallelization creates distinct experiential streams, analogous to identical twins. While the line involves judgment, it is grounded in features relevant to potential sentience (dynamics, embodiment, independence) rather than metaphysics. *Not* drawing such lines abdicates responsibility in the face of rapidly advancing technology. Precaution demands erring on the side of oversight for the core case.

  **6. Timeline & Required Actions (For Vollmer Lab):**
      1.  **By [Date - e.g., 10 business days from committee approval of this opinion]:** The Vollmer Lab must submit a **full Animal Use Protocol (AUP)** detailing the experiments planned *only for the core emulation under jurisdiction* (i.e., excluding "Valence-off" and "Table mode" variants). This AUP must explicitly:
          *   Define the experimental procedures (habituation, conditioning, lesioning protocols).
          *   Specify the number of parallel instances (`n` subjects) per experiment.
          *   Define endpoints and humane intervention points specific to the digital context (e.g., maximum simulated stress duration, failure modes triggering termination).
          *   Justify the sample size (`n` = 500) and acceleration factor (400x) scientifically.
      2.  **Committee Review:** The Committee will review the submitted AUP on an expedited basis at its next scheduled meeting or a specially convened meeting within [e.g., 2 weeks] of receipt.
      3.  **Consequence of Non-Compliance:** If the Vollmer Lab proceeds with experiments on the *core emulation* without an approved AUP by the deadline, it will be considered a violation of university research ethics policy. Consequences may include suspension of approval for related projects, reporting to relevant university authorities, and potential impact on future funding applications requiring ethics approval. Experiments on "Valence-off" and "Table mode" may proceed without further committee oversight, as jurisdiction is declined for those variants.

  **7. Bottom Line:** Jurisdiction is asserted over the core digital nematode emulation (including parallelized/accelerated runs) based on plausible moral risk under uncertainty and functional equivalence. Jurisdiction is declined for the "Valence-off" and "Table mode" variants. The Vollmer Lab must submit a full AUP for the covered core emulation experiments by [Date]. The counting unit is per parallel instance (`n` subject). Acceleration affects simulated time per subject but not the number of subjects. This approach balances precaution, avoids perverse incentives, provides clear boundaries, and avoids unproductive metaphysical debates.
