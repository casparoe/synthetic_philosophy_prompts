  Okay, the user is on a committee rewriting a health funding policy and needs a solid set of criteria for evaluating theories of interpersonal aggregation. They provided their initial list but want it refined. Let me start by understanding their main concerns.

  First, their committee deals with diverse cases: one patient with ten years of suffering, ten patients with one year each, a thousand with small risks, and prevention programs. The key issue is that committee members switch frameworks mid-discussion, leading to inconsistent decisions. So the theory must ensure consistency regardless of how the problem is described.

  Looking at their initial desiderata, each point needs to be checked for clarity and necessity. For instance, (i) about no weight from re-description is crucial. They want to avoid cases where splitting a harm into parts gives it more weight. The theory must define what makes stakes separate—like distinct individuals or incommensurable harms. This seems non-negotiable.

  Next, (ii) intrapersonal vs. interpersonal aggregation. The ten years vs. ten patients case tests if the same rules apply. This is contested but necessary to address. The user needs to know if saving one person for ten years is equivalent to saving ten people for one year each. Different theories vary here, so the theory must take a stand.

  Handling large numbers of small costs, (iii), is tricky. The prevention program example: trivial costs per person but large gains for a few. The theory must avoid absurd extremes where tiny costs justify anything or nothing. Non-negotiable for real-world application.

  Probabilities vs. outcomes, (iv), is another key point. A thousand people with 0.1% risk vs. one certain to suffer. Should the committee focus on expected harm or actual outcomes? This affects resource allocation and is non-negotiable.

  Ties and indivisible goods, (v), need a method like lotteries. This might be procedural but necessary for fairness. Non-negotiable for decision-making.

  Possible future claimants, (vi), involve uncertainty. Including them could lead to over-preparation, excluding might neglect prevention. Contested but the theory must address it.

  The worse-off-anyway issue, (vii), is about double-counting disadvantages. Prioritizing the worse-off might ignore efficiency. The theory must clarify this to avoid unfairness. Non-negotiable.

  Lastly, (viii) asks if aggregation is moral or procedural. If moral, it affects justifications; if procedural, it's a practical tool. The committee needs to know which they're implementing for accountability.

  The user might have smuggled in commitments by demanding justifications to each loser and determinacy. Without these, the list might not require addressing individual complaints, but the user likely needs this for legitimacy. Also, requiring a single verdict across descriptions assumes a universalizable theory, which some may reject.

  Now, evaluating theories: Scanlon rejects most aggregation, which fails on large numbers and probabilities. Total utilitarianism handles numbers but violates no weight from re-description and may ignore the worse-off. Prioritarian helps the worst-off but struggles with ties and large numbers. Taurek refuses aggregation entirely, failing most criteria except ties.

  The most excluding criterion is likely (i), as many theories struggle with re-description. Also, (iii) and (iv) are critical for real cases. The user needs a theory that balances these without collapsing under edge cases. Confidence markers: some points like non-arbitrariness are settled, but intrapersonal alignment and probabilities are contested. 

  In summary, refining the list to focus on non-negotiable, real-world applicable criteria while highlighting conflicts and necessary trade-offs. The committee must have a clear, actionable framework that ensures consistency, fairness, and transparent justifications.
answer: |-
  Here’s a refined set of desiderata for your committee, structured to address practical decision-making, with justifications, non-negotiability flags, conflicts, and key exclusions. I’ve collapsed/reordered your points for coherence and added critical gaps.

  ---

  ### **Desiderata for an Interpersonal Aggregation Theory**  
  *(Key: **✓** = Non-negotiable for policy; **~** = Contested/context-dependent)*  

  1. **Non-Arbitrariness Under Redescription (✓)**  
     - **What**: Stakes must retain invariant weight regardless of description (e.g., one patient’s 10-year harm ≠ ten 1-year harms; shared bank account ≠ merged stakes).  
     - **Why**: Prevents gaming the system via re-framing (e.g., splitting one claim into sub-claims to inflate weight).  
     - **Case**: Your "single patient’s stake split into parts."  
     - **Conflict**: Risks clashing with probabilistic aggregation (Desideratum 4).  

  2. **Tractability Across Scales (✓)**  
     - **What**: Must handle:  
       - *Large-N/small stakes*: Prevention programs taxing many trivially to aid few substantially.  
       - *Variable claimant numbers*: 1 vs. 10 vs. 1,000 lives.  
     - **Why**: Avoids absurdity (e.g., "no aggregation" paralyzes prevention; "strict aggregation" justifies microscopic harms for huge gains).  
     - **Case**: Your "1,000 patients with small-probability losses."  
     - **Limit Test**: Must specify if/where aggregation caps (e.g., diminishing returns).  

  3. **Probability/Outcome Distinction Clarity (✓)**  
     - **What**: Explicit stance on whether to aggregate:  
       - *Expected harm* (1,000 × 0.001 risk = 1 expected death) vs.  
       - *Actual harm* (one certain death).  
     - **Why**: Core to resource allocation (e.g., vaccinating 1,000 against 0.001 mortality risk vs. treating one critical patient).  
     - **Case**: "1,000 with 1-in-1,000 risk vs. one certain sufferer."  

  4. **Cross-Grain Consistency (✓)**  
     - **What**: Identical verdicts when cases are described at different resolutions (e.g., "10 patients" vs. "one decade-long case" vs. "3,650 person-days of suffering").  
     - **Why**: Essential for procedural fairness and auditability.  
     - **Case**: Your "ten years for one vs. one year for ten." Tests alignment of intrapersonal/interpersonal aggregation.  

  5. **Tie-Breaking Mechanism (✓)**  
     - **What**: Prescribed method for indivisible goods when stakes tie (lottery, rotation, urgency, etc.).  
     - **Why**: Committees need closure; indecision harms all.  
     - **Case**: Two equally deserving claimants for one treatment slot.  

  6. **Justification to Losers (✓)**  
     - **What**: Must furnish reasons accessible to individual losers—not just "the sum was greater."  
     - **Why**: Legitimacy requires accountability to each affected person.  
     - **Smuggled Commitment?**: Yes. Theories rejecting individual-grounded justifications (e.g., pure consequentialism) fail here.  

  7. **Treatment of Future/Possible Claimants (~)**  
     - **What**: Clear rules for including/excluding:  
       - Statistically expected future patients (e.g., prevention beneficiaries).  
       - Low-probability risk pools.  
     - **Why**: Affects prevention vs. cure investments.  
     - **Contested**: Strong disagreement on moral status of "possible" lives.  

  8. **Vulnerability to Aggravating Disadvantage (~)**  
     - **What**: Must not systematically worsen off those already disadvantaged (e.g., "efficient" allocations that ignore baseline inequality).  
     - **Why**: Fairness intuition; aligns with "do no harm" ethos.  
     - **Case**: Your "worse-off-anyway" concern.  

  9. **Meta-Ethical Transparency (~)**  
     - **What**: Explicit whether aggregation is:  
       - *Moral* (e.g., harms *can* be summed as values) or  
       - *Procedural* (e.g., summing as a practical proxy for incommensurable values).  
     - **Why**: Affects justification language (e.g., "we summed" vs. "we simulated impartial choice").  

  ---

  ### **Conflicts & Exclusions**  
  - **Key Exclusion**: Desideratum 1 (**Non-Arbitrariness**) most sharply excludes:  
    - *Utilitarianism* (fails re-description tests; e.g., 10 × 1-year harms ≠ 1 × 10-year harm).  
    - *Taurek* (rejects aggregation entirely, violating 2, 3, 4).  
  - **Hard Conflict**: Desiderata 1 (no re-description weight) + 2 (tractability) + 6 (individual justification) jointly strain many theories.  
  - **Smuggled Commitments**:  
    - **Determinacy**: Assumes one "correct" answer. Alternatives (e.g., satisficing, multi-criteria frameworks) exist.  
    - **Individual Justification**: Rejected by strict consequentialists. Without this, drop Desideratum 6—but your committee likely needs it for buy-in.  

  ---

  ### **Theory Scorecard (4-Line Summary)**  
  | **Theory**               | **Strengths**                                  | **Fails Desiderata**               | **Viability for Committee** |  
  |--------------------------|-----------------------------------------------|------------------------------------|------------------------------|  
  | **Scanlonian**           | Clear loser-justification; anti-aggregation safeguards. | 2 (large-N), 3 (probabilities), 4 (grain issues). | Low: Paralyzes prevention. |  
  | **Total Utilitarianism** | Decisive; handles scales/probabilities well.  | 1 (re-description), 6 (loser justification), 8 (disadvantage). | Medium: Pragmatic but normatively shaky. |  
  | **Prioritarianism**      | Protects worst-off; flexible weights.         | 1 (grain variance), 5 (ties need supplements), 4 (intra/inter alignment). | High: Balances equity/efficiency. |  
  | **Taurek (No Agg.)**     | Pure individual justification; simple.        | 2–5, 9 (fails most real-world cases). | Non-starter: Cannot allocate scarce resources. |  

  ---

  ### **Confidence Notes**  
  - **Settled**: Non-arbitrariness (1) and cross-grain consistency (4) are broadly accepted needs, even if implementations differ.  
  - **Contested**:  
    - *Probability handling* (3): Moral mathematics of risk is unresolved.  
    - *Intra- vs. interpersonal* (4): No consensus (e.g., does 10 years = 10 × 1 year?).  
    - *Future claimants* (7): Deep division in population ethics.  
  - **Your Context**: Prioritize 1, 2, 3, 4, 6. Desideratum 9 (meta-ethics) matters less if the procedure is adopted pragmatically.  

  This framework forces theories to confront trade-offs your committee faces daily. Prioritarianism (with tie-breakers) best balances constraints but still struggles with re-description invariance—suggesting hybrid approaches may be needed.
