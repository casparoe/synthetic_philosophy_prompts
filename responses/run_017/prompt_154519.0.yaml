  ### Grading for Candidate 17  
  **Overall Mark: 19/30**  
  *(a) 7/10, (b) 6/10, (c) 6/10*  

  #### Part (a) Mark: 7/10  
  *Justification:* Correctly identifies why asymmetry theorists prefer the Understanding Claim and rejects the Transmission Claim plausibly, but under-specifies the "work left to do" by neglecting to explain why *moral* understanding is epistemically necessary when other domains lack this requirement.  

  #### Part (b) Mark: 6/10  
  *Justification:* Accurately applies RC and diagnoses Nadia’s lack of robustness, but the sensitivity argument for knowledge failure is flawed, and the analysis of "acting for right reasons" omits key nuances about moral motivation.  

  #### Part (c) Mark: 6/10  
  *Justification:* Correctly states the objection but fails to engage with core asymmetrist defenses (e.g., understanding as constitutive of moral knowledge). Conflates epistemic and practical defects.  

  ---

  ### Line-by-Line Comments  

  1. **"The Transmission Claim says that what is missing is knowledge itself... The Understanding Claim says that knowledge gets through... but the recipient lacks something further."**  
     *Credit:* Clear, accurate distinction.  
     *Minor reservation:* "Gets through" underplays the Understanding Claim’s ambiguity about whether knowledge is transmitted.  

  2. **"If moral testimony could not transmit knowledge, then almost nobody would have any moral knowledge... That consequence is unacceptable."**  
     *Credit:* Strong rejection of Transmission Claim, leveraging real-world plausibility.  

  3. **"What work does the Understanding Claim still have to do? It has to show that this missing understanding... is itself an epistemic deficit... that distinguishes morality."**  
     *Substantive error:* Omits that the asymmetry theorist must explain why *only morality* requires understanding for justification/knowledge. Non-moral cases (e.g., math) show knowledge without understanding is possible.  

  4. **"Her belief tracks her colleague’s utterance rather than the moral fact... A belief that varies with what someone says... is not sensitive to those facts... is not knowledge."**  
     *Substantive error:* Sensitivity is not necessary for testimonial knowledge (e.g., I know Everest exists via testimony despite counterfactual dependence). Collapses *sensitivity* (a controversial condition) with *reliability* or *proper function*.  

  5. **"She acts well but not from understanding... her action is not obviously defective."**  
     *Credit:* Nuanced on action evaluation.  
     *Minor reservation:* Fails to distinguish *acting rightly* from *acting for right reasons* (seminar emphasized the latter requires grasping moral reasons).  

  6. **"The objection succeeds... If dependence on another’s say-so were defective, my belief about Fermat... would be defective. It plainly is not."**  
     *Substantive error:* Assumes parity without argument. Asymmetrists argue moral knowledge *requires understanding* constitutively (e.g., for justification), while math does not. Ignores the "further work" from (a).  

  7. **"The moral reasons are in principle available to Nadia... she could ask her colleague to explain himself. The two cases are on a par."**  
     *Substantive error:* Collapses *procedural* parity (access to reasons) with *epistemic* parity. In math, testimony derives authority from verifiable proof; moral testimony lacks analogous public verification.  

  ---

  ### Strongest Move vs. Weakest Inference  
  - **Strongest Move:** Rejecting the Transmission Claim in (a) by appealing to the social necessity of moral testimony ("almost nobody would have moral knowledge"). *Why:* Effectively uses real-world implications to expose the claim’s implausibility.  
  - **Weakest Inference:** Arguing that Nadia lacks knowledge due to sensitivity failure in (b). *Why:* Misapplies sensitivity to testimony (ignoring seminar counterexamples) and treats it as uncontroversially necessary for knowledge.  

  ---

  ### Closing Note: Requirements for Full Marks  
  To score full credit, the answer needed to:  
  1. **In (a):** Explicitly contrast why non-moral testimony (e.g., math) transmits knowledge *without* requiring understanding, while moral testimony might not.  
  2. **In (b):** Address whether sensitivity is relevant to testimonial knowledge (per seminar debates) and distinguish *right action* from *acting for right reasons* more rigorously.  
  3. **In (c):** Engage the asymmetrist reply that moral understanding is *constitutive* of knowledge/justification in a way mathematical understanding is not—e.g., due to morality’s action-guiding role.
