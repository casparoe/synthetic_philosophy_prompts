answer: |-
  ### **Intervention-Relative Reward Identification: A Framework for Resolving Ambiguity in Inverse Reinforcement Learning**  

  #### **Abstract**  
  Inverse reinforcement learning (IRL) struggles with underdetermination: many rewards explain the same behavior. This project reframes the problem by arguing that reward ambiguity is not inherent to data alone, but *relative to the class of interventions* for which the reward will be used. We formalize a taxonomy of intervention classes (e.g., action-set expansions in assistive robotics, environmental dynamics changes, or policy nudges) and characterize the equivalence classes of rewards indistinguishable under each. The core hypothesis is that richer interventions yield finer reward equivalence classes, resolving classic underdetermination. We test this via theoretical analysis and synthetic simulations (gridworld and continuous control), demonstrating how intervention class dictates what data resolves ambiguity. Deliverables include a practitioner checklist for reward deployment, clarifying what ambiguity remains and how to mitigate it.  

  ---

  ### **1. Introduction and Motivation**  
  Assistive robotics (e.g., wheelchair-mounted arms) often uses IRL to infer user preferences from demonstrations. Yet deployments face a critical gap: rewards are inferred from users’ *restricted* motor capacities (e.g., head-array inputs), but deployed to guide robots with *expanded* capacities (e.g., precise arm movements). This mismatch creates a fundamental ambiguity: does a user’s observed "nudge toward cup" reflect a *desire* for cup proximity, or merely motor limitations? Standard IRL treats reward ambiguity as a universal problem, ignoring that ambiguity depends on *how the reward will be used*. We contend that underdetermination is **intervention-relative**: it shrinks or expands based on whether the reward will drive predictions, environmental changes, or capacity-altering actions. This project formalizes this relativity, offering a framework to resolve ambiguity by aligning IRL with deployment goals.  

  ---

  ### **2. Research Questions and Objectives**  
  **Core Question:** How does the *class of interventions* for which a reward is deployed determine the *equivalence classes of rewards* that explain observed behavior?  

  **Objectives:**  
  1. **Taxonomy & Equivalence Classes:** Define intervention classes (Table 1) and characterize reward equivalence for each.  
  2. **Ambiguity Diagnosis:** Show why existing IRL debates (e.g., MaxEnt vs. Bayesian priors) are proxies for unstated intervention assumptions.  
  3. **Empirical Stress Test:** Quantify ambiguity gaps in capacity-mismatched settings (e.g., when a demonstrator’s action set expands post-deployment).  
  4. **Practitioner Checklist:** Create a tool linking intervention classes to residual ambiguity and data-collection strategies.  

  **Table 1: Intervention Classes & Reward Ambiguity**  
  | **Intervention Class**          | **Example**                          | **Reward Equivalence Class**                          |  
  |---------------------------------|--------------------------------------|-------------------------------------------------------|  
  | *In-distribution prediction*    | Forecasting user actions            | Coarse: All rewards reproducing policy              |  
  | *Environment dynamics change*   | Altering object physics             | Moderate: Rewards agreeing on state preferences     |  
  | *Agent action-set expansion*    | Assistive arm adding new motions    | Finer: Rewards agreeing on intent under new options |  
  | *Choice-set alteration*         | Nudging via action reranking        | Finer: Context-dependent intent                   |  
  | *Preference shift*              | Adapting to new user goals          | Finest: Requires explicit preference queries       |  

  *Hypothesis:* Equivalence classes narrow as interventions grow richer (e.g., action-set expansion reduces ambiguity vs. prediction).  

  ---

  ### **3. Background and Gap Analysis**  
  Existing IRL literature treats reward ambiguity as monolithic—focusing on identifiability under fixed capacities (e.g., "many rewards fit one policy"). Remedies like feature-count matching or Bayesian priors implicitly assume an intervention class (e.g., *prediction*), but fail when deployed interventions diverge (e.g., *capacity expansion*). This creates two gaps:  
  - **Theoretical:** No framework links reward equivalence to intervention classes. For example, a MaxEnt prior may suffice for environmental interventions but fail for action-set changes.  
  - **Empirical:** Synthetic evaluations ignore capacity mismatches, overstating real-world applicability.  
  *Economist Critique Response:* While revealed preference theory handles capacity constraints, it assumes static choice sets and lacks sequential decision-making (e.g., how a *history* of constrained actions obscures intent when new options emerge). Our work formalizes ambiguity in *dynamic* settings where interventions alter capacities mid-trajectory.  

  ---

  ### **4. Proposed Approach**  
  **Phase 1: Theoretical Taxonomy**  
  - Define intervention classes formally using MDP abstractions (states, actions, transitions).  
  - For each class, derive equivalence classes: rewards \(R_1, R_2\) are indistinguishable if they prescribe identical policies under all interventions in the class.  
  - **Key Insight:** Capacity-relative ambiguity (action-set changes) requires stronger conditions (e.g., reward consistency across counterfactual actions) than environmental interventions.  

  **Phase 2: Empirical Validation**  
  - **Gridworld:** Simulate a demonstrator with 3 actions (e.g., "nudge left/right/wait") and a robot with 5 actions (e.g., "grasp," "move fast"). Fit rewards using:  
    - (a) MaxEnt IRL, (b) Bayesian IRL, (c) Feature-count matching.  
  - **Continuous Control:** Use MuJoCo to simulate an assistive task (e.g., "serve drink") with a capacity-limited user (stochastic, low-precision inputs) and a high-precision robot.  
  - **Metric:** Post-deployment policy divergence when rewards inferred under limited actions drive expanded actions. Quantify disagreement as KL divergence between reward-optimal policies.  

  **Why Synthetic Data?** Public datasets (e.g., RoboMimic) provide trajectory data; simulations let us systematically vary capacity gaps.  

  ---

  ### **5. Expected Outcomes and Deliverables**  
  1. **Taxonomy of Intervention-Relative Ambiguity:** A mathematical characterization of reward equivalence classes.  
  2. **Empirical Evidence:** Demonstration that capacity mismatches induce measurable policy divergence (e.g., >40% suboptimal actions in expanded action sets).  
  3. **Practitioner Checklist:** A one-page guide:  
     - *If deploying under [Intervention Class], collect [Data Type] to shrink ambiguity.*  
     - *Example:* For action-set expansion, collect demonstrations under *temporarily augmented interfaces* (e.g., eye-tracking + joystick) to disambiguate intent.  

  ---

  ### **6. Risks, Limitations, and Scope**  
  **Risks:**  
  - *Collapsing Hierarchy:* If equivalence classes are identical across interventions, the taxonomy adds no value. We mitigate by testing edge cases (e.g., extreme capacity mismatches).  
  - "Relabeled Identifiability": If existing identifiability conditions (e.g., linear independence) subsume our classes, we reframe them as special cases of intervention relativity.  
  - *Oversimplification:* Real users have noisy, adaptive preferences. We limit scope to stationary rewards.  

  **Scope for 6-Month Pilot (60% effort):**  
  - Months 1–2: Theoretical framework + gridworld implementation.  
  - Months 3–4: Continuous-control simulations.  
  - Months 5–6: Checklist design + documentation.  
  *Resources:* Standard RL libraries (Stable-Baselines3), MuJoCo, workstation (no new human data/IRB).  

  ---

  ### **7. Conclusion**  
  This work challenges IRL’s "one-size-fits-all" approach to reward ambiguity. By tying identifiability to intervention classes—especially capacity shifts in assistive tech—we turn philosophical debates into testable engineering principles. Outcomes will clarify when IRL rewards reflect true intent versus capacity artifacts, enabling safer, more aligned assistive systems.  

  ---  
  *Format:* 2 pages, single-spaced, 11pt Arial. *Word Count:* ~1,200.  
  *American English:* Checked (e.g., "behavior," "artifact").
