  Nadia's gradual replacement is strong. It challenges persistence without sortal shifts. Tobias's Historical Constraint tries to address this, but the matter-condition requirement might be arbitrary. Why can't a lump survive matter replacement if gradual? His asymmetry might work, but the vagueness issue remains.

  Nadia's halfway point is tricky. If the lump's existence is vague, does that affect constitution? Tobias says vagueness is only semantic, which is a standard response. But if constitution requires a lump, and it's indeterminate whether there's a lump, that might imply metaphysical vagueness, which is problematic.

