  Okay, the user writes a science column and is grappling with the terminology around AI "hallucinations." They've noticed a tension: engineers call false outputs "hallucinations" and log them as errors, yet simultaneously claim the AI doesn't actually "believe" anything because it's just predicting tokens. The user wants to reconstruct the implicit theory of meaning behind this practice, specifically examining if teleosemantics (where function defines content) underpins it. 

  Hmm, the user is clearly well-versed in philosophy of mind—they name-drop teleosemantics, informational theories, and intentional stance without explanation. Their frustration is palpable: they sense cognitive dissonance in the industry's jargon. Two sharp objections are raised: (1) Isn't the AI's "proper function" actually approval-seeking, not truth-telling? (2) Could weaker theories of content justify "hallucination" talk just as well? 

  First, let's unpack why "hallucination" feels apt despite token-prediction. Calling false outputs "errors" implies a normative standard beyond statistical loss—a tacit assignment of representational duty. Teleosemantics fits this best: even if training optimizes for approval, the *deployment context* socially assigns a truth-tracking function. Regulators and users treat it as a knowledge source, creating a derived proper function. Without this, "error" would merely mean "unapproved output," but labs log *factual* inaccuracies as failures. 

  Ah, but the user's first worry is spot-on. Pure teleosemantics might initially suggest confabulation is *functional* if it pleases humans. Yet in practice, labs distinguish "helpful bias" (e.g., polite evasion) from "hallucination" (false claims). This implies a hybrid norm: the system ought to truth-track *when* accuracy is socially expected. Teleosemantics can absorb this if we consider environment-matching part of its socially assigned function. 

  Second query: do weaker theories suffice? Informational theories (covariation) fail—AIs don't counterfactually covary with facts. Interpretivism (intentional stance) *allows* calling outputs "false" but doesn't *require* it—we could equally say "the system isn't *trying* to assert anything." Yet labs insist on "hallucination = error," suggesting a stronger commitment to malfunction. 

  If teleosemantics were dropped, vocabulary would shift. Labs might say "low approval-score outputs" instead of "errors," and regulators couldn't demand "truthfulness," only "compliance with training objectives." The sting of "hallucination" as *failure* would vanish. 

  User’s depth impresses me. They’ve nailed the central tension in AI ethics: how we anthropomorphize systems while denying agency. Their column could highlight this as philosophy in action—tech’s unspoken metaphysics shaping regulation. Might subtly warn against hollow anthropomorphism: if we drop teleosemantics, accountability weakens.
answer: |-
  The vocabulary of "hallucination" and "confabulation" in AI does indeed presuppose a robust theory of representational error—one that leans heavily on **teleosemantics**, though with pragmatic adaptations for deployment contexts. Here’s how the practice holds together, its tensions, and what underpins it:

  ### 1. **Teleosemantics as the Core Framework**  
  The practice treats AI outputs as *malfunctions* when they confidently assert falsehoods, implying:  
  - The system has a **proper function**: to provide accurate, relevant information.  
  - "Hallucination" is not statistical deviation but **failure to fulfill this function**, akin to a defective heart failing to pump blood.  
  - This persists despite engineers’ token-prediction disclaimers because the *deployment context* socially assigns a truth-tracking role. Regulators, users, and developers all treat the AI as an epistemic tool.  

  ### 2. **Addressing the Selection History Problem**  
  Your first worry is acute: training optimises for human approval (e.g., RLHF), not truth. Strict teleosemantics *might* initially suggest confabulation is functional if it maximises approval. Yet the practice resolves this by:  
  - **Hybrid proper function**: The system is *designed* to win approval *via* truthfulness in expectation. Hallucinations are "errors" because they violate the *implicit epistemic contract* of deployment—users assume truthful answers absent disclaimers.  
  - **Environment of evolutionary adaptedness (EEA)**: Labs define "proper function" relative to *intended deployment contexts* (e.g., factual QA). When confabulations occur in-domain, it’s malfunction; in novel domains, it’s "out-of-distribution error," preserving the teleosemantic frame.  

  ### 3. **Why Weaker Theories Fail**  
  The practice’s "error" language isn’t sustained by non-teleosemantic theories:  
  - **Informational/covariational theories**: These equate content with reliable correlation (e.g., smoke signalling fire). But LLMs don’t reliably covary with truth—they generate plausible strings. Calling outputs "false" would be incoherent here.  
  - **Interpretivism/intentional stance**: We *could* adopt the stance that the AI "believes" its outputs, but this doesn’t explain why *only confident falsehoods* are "hallucinations." Bland truths aren’t errors, though penalised equally—implying a normative standard beyond behaviour.  
  Only teleosemantics licenses treating confabulation as *systemic failure* rather than expected noise.  

  ### 4. **What the Practice Strictly Requires**  
  - **Minimal commitment**: Ascribed **proper function** (truth-tracking in specified domains), plus **malfunction** when falsehoods occur in those domains.  
  - **Pragmatic add-ons**: Social context determines the function. An AI designed as a fiction generator wouldn’t "hallucinate"—it would "create."  
  Without teleosemantics, labs couldn’t call hallucinations "errors" in a principled way—only "low-likelihood outputs" or "low-reward responses."  

  ### 5. **Consequences of Dropping Teleosemantics**  
  If the field abandoned this underpinning:  
  - **Vocabulary shift**: "Hallucination" would become "adversarial output" or "reward mismatch." Incident reports would log "reward model underspecification," not "errors."  
  - **Regulatory framing**: Benchmarks couldn’t demand "truthfulness"—only "predictive calibration" or "compliance with human preferences."  
  - **Accountability erosion**: Calling confabulations "malfunctions" justifies recalls and fixes. Losing that frame reduces errors to aesthetic flaws.  

  ### In Short  
  The practice *strictly requires* a teleosemantic core: AI has a derived proper function (truth-telling in context), and hallucination is malfunction. While training for approval complicates this, deployment norms rescue the framework. Without it, "hallucination" loses its normative bite—becoming mere statistical deviance, not failure. Labs tacitly embrace teleosemantics because it alone turns falsehoods into errors worth fixing.  

