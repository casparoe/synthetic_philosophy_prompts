answer: |-
  Here's a comprehensive exam package focusing on the core challenge you've identified, designed to push students beyond rote answers.

  ---

  **Exam Question: Contractualism and the Aggregation Problem in Sequence**

  Consider a research station with 100 inhabitants facing 100 consecutive cold nights. Each night, they must choose whether to run a generator.
  *   **Option A (Run Generator):** One designated person ("Duty Person") suffers significant discomfort (-10 units). The other 99 gain minor comfort (+1 unit each).
  *   **Option B (Off):** No one suffers discomfort, no one gains comfort (0 units for everyone).

  We examine two decision scenarios:

  1.  **One-Shot Decision:** The choice is made *only* for **tonight**. There is no prior arrangement or future nights to consider.
  2.  **Sequence Decision:** The choice is made **in advance** for all 100 nights. A rota is established ensuring each person serves as the Duty Person exactly once. Each night, the generator *is* run according to the rota.

  **Contractualist Verdicts:**
  *   In the **One-Shot** case, standard contractualism holds that Option B (Off) is required. The Duty Person's complaint against running the generator (suffering -10) is stronger than any single beneficiary's complaint against *not* running it (missing out on +1, a complaint strength of 1). Contractualism's non-aggregation principle forbids summing the 99 small complaints to outweigh the single large one.
  *   In the **Sequence** case, implementing the rota seems clearly preferable to never running the generator. Each person ends the 100 nights with a net gain of +89 (-10 once, +99 once; actually +89 net: (-10) + (99 * +1) = +89). No one has a net complaint against the rota plan compared to perpetual Option B (net 0).

  **The Problem:** The *action taken on any single night* within the sequence is identical in kind to the action rejected in the one-shot case. Yet, the overall sequence plan (involving 100 such actions) is obligatory, while each individual action seems forbidden.

  **Your Task:** Critically evaluate whether a contractualist framework can consistently endorse *both* the one-shot verdict (no run tonight) *and* the sequence verdict (implement the rota plan). If both cannot be consistently endorsed, which verdict must be rejected? Precisely explain what aspect of contractualism needs adjustment or clarification to resolve this tension, and justify your solution. Address the implications of your resolution regarding the permissibility of aggregating burdens/benefits *within a single life* over time.

  ---

  **Model Answer (Approx. 700 words):**

  The tension between the one-shot and sequence verdicts exposes a critical ambiguity within standard contractualism regarding the scope of its non-aggregation principle and the unit of moral assessment. Reconciling both verdicts requires careful refinement of contractualist reasoning, primarily concerning aggregation over time *within* a single life.

  **Structural Identity and the Core Tension:** The actions on each night within the sequence are morally identical to the one-shot case: one person suffers -10 to provide +1 to 99 others. Contractualism's core non-aggregation principle – that we cannot sum the strength of distinct individuals' complaints to outweigh a stronger complaint from another individual – directly forbids this action in the isolated one-shot context. The Duty Person's complaint against suffering (-10) outweighs *any single beneficiary's* complaint against missing out (+1), and the 99 small complaints *cannot be summed*. However, the sequence plan, composed entirely of these forbidden actions, results in each person being significantly *better off* overall (+89 vs. 0) and *no one has a net complaint* against the plan itself. This creates an inconsistency: if each constitutive action is forbidden, how can the plan mandating them be required? Standard non-aggregation applied rigidly per occasion seems to prohibit the beneficial sequence.

  **Resolving the Tension: Allowing Intra-Personal Aggregation Over Time:** The inconsistency forces the contractualist to reject the rigid application of the one-shot verdict *within the context of a planned sequence*. The key difference lies not in the numbers per se, but in the *temporal scope* and *subject* of assessment. Contractualism must permit aggregating benefits and burdens *over time within the life of a single individual* to assess their *overall net position* relative to alternative courses of action.

  *   **Justification for Intra-Personal Aggregation:** Unlike aggregation *across persons*, which contractualism prohibits because it potentially sacrifices one individual's fundamental interests to the summed lesser interests of others, aggregation *within a life* respects the unity of that life. A person is a single subject experiencing the totality of their life. When evaluating a *plan* affecting their whole life-course, what matters morally is their *overall* justifiability-to-others, grounded in the net impact on *their* life. Rejecting intra-personal aggregation would mean treating each temporal slice of a person's life as a distinct moral patient, which is deeply counterintuitive and ignores the integrated nature of personal experience and well-being. In the sequence, the rota plan is justifiable *to each person* because, looking at their *entire life* during the 100 nights, they suffer a significant loss *once* but gain a compensating benefit *ninety-nine times*, resulting in a substantial net gain. No individual can reasonably reject this plan *based on their overall outcome*. Crucially, this aggregation is only permissible *within* the life of a single subject for whom the experiences cohere.

  **Costs of Rejecting Intra-Personal Aggregation:** If contractualism refused intra-personal aggregation, it would condemn the beneficial sequence plan solely because each nightly action resembles the forbidden one-shot case. This would lead to severe Pareto inefficiency (everyone worse off) and prevent mutually beneficial long-term cooperation schemes where burdens are distributed over time. This is a reductio ad absurdum for such a rigid view; contractualism must permit assessing overall life-plans.

  **Sensitivity to Choice Framing:** This resolution makes the moral verdict sensitive to how the choice is framed: as isolated moments or as part of a life plan. While this might seem objectionable, it reflects a plausible moral reality. The moral significance of an action often depends on its context within broader commitments, relationships, and life plans. Choosing *not* to run the generator on a single night *outside* any rota is different from faithfully executing one's agreed-upon role *within* a mutually beneficial, reciprocally structured plan that everyone has reason to accept ex ante. Contractualism, focusing on justifiability to individuals, *should* be sensitive to this contextual embedding.

  **The Ex Ante/Veil Trap:** Appealing to an ex ante perspective under uncertainty doesn't resolve the core tension *here*. In this scenario, the rota is fixed in advance; there is no uncertainty about who bears the burden when. Evaluating *ex ante* simply means assessing the plan before knowing one's specific duty nights. But the contractualist assessment *ex ante* still needs to justify the plan *to each individual* considering the range of outcomes they *might* experience. The non-aggregation principle applies to *potential* complaints across possible identities. The ex ante assessment *favors* the rota because each person, knowing they will be burdened only once and benefit 99 times, sees it as a net gain and thus cannot reasonably reject it. However, this doesn't address the nightly action paradox; it merely confirms the sequence verdict. It doesn't explain why the nightly action, identical to the forbidden one-shot action, is now permissible. The real work is done by allowing the intra-personal aggregation over time that makes the *ex ante* assessment favorable.

  **A-Grade: Personal Identity and the Stopping Place:** If personal identity is not a "deep further fact" (e.g., Parfitian reductionism), the justification for intra-personal aggregation weakens. If a person over time is more like a series of psychologically connected stages, then aggregating burdens and benefits across these distinct stages might resemble aggregating across distinct persons. Contractualism could face pressure: either 1) embrace aggregation across persons (collapsing into utilitarianism), 2) stubbornly refuse all aggregation (leading to the sequence problem), or 3) find a non-arbitrary middle ground. A third option might be to anchor aggregation in the *degree of psychological connectedness* between stages. Stages closely connected (e.g., consecutive days) could permit aggregation for planning purposes relevant to that connected entity, while stages weakly connected (e.g., childhood vs. old age) might not. This preserves a non-utilitarian, non-arbitrary contractualism focused on justifiability to the relevant connected psychological entity at the time of agreement, but it significantly complicates the theory and its application.

  ---

  **Marking Scheme (Total: 25 Marks)** 

  1.  **Identifies Structural Identity & Core Tension (4 marks):**
      *   *Must-hit:* Clearly states the nightly actions are identical in kind to the one-shot case. Explicitly articulates the tension: forbidden actions composing an obligatory plan.
      *   *Common Mistake:* Treats the sequence as fundamentally different due to "repetition" or "fairness" without focusing on the identity of the nightly acts.
  2.  **Resolution via Intra-Personal Aggregation & Justification (6 marks):**
      *   *Must-hit:* Argues contractualism *must* permit aggregating benefits/burdens *over time within a single life* to assess net position for long-term plans. Justifies this by appealing to the unity of the person/single subject of experience, contrasting it sharply with impermissible inter-personal aggregation.
      *   *Common Mistake:* Simply asserts "aggregation over time is fine" without justifying *why* it's different from cross-person aggregation. Or confuses it with inter-personal aggregation.
  3.  **Costs of Rejecting Intra-Personal Aggregation (3 marks):**
      *   *Must-hit:* Explains that rejecting intra-personal aggregation would absurdly forbid the mutually beneficial sequence (Pareto inefficiency), preventing justified long-term cooperation.
      *   *Common Mistake:* Vague mention of "bad consequences" without specifying the inefficiency or cooperation problem.
  4.  **Addresses Framing Sensitivity (4 marks):**
      *   *Must-hit:* Acknowledges verdict depends on choice framing (isolated act vs. part of life plan). Argues this sensitivity is justified/plausible because context (e.g., being part of a reciprocally beneficial scheme) changes justifiability to individuals.
      *   *Common Mistake:* Dismisses framing sensitivity as obviously bad without argument, or fails to connect it to contextual justifiability.
  5.  **Addresses Ex Ante Trap (3 marks):**
      *   *Must-hit:* Correctly identifies that introducing an ex ante/veil perspective (without uncertainty) doesn't resolve the tension; it merely confirms the sequence verdict without explaining the permissibility of the nightly actions. Notes that uncertainty would reintroduce the non-aggregation principle for expected complaints.
      *   *Common Mistake:* Mistakenly claims the ex ante view *solves* the problem by making the rota fair/acceptable, failing to see it doesn't address the nightly action paradox.
  6.  **A-Grade: Personal Identity Challenge (5 marks):**
      *   *Must-hit:* Recognizes that if personal identity is reducible (e.g., to psychological connectedness), the justification for intra-personal aggregation is undermined. Engages thoughtfully with the implication: risk of collapse into utilitarianism (if aggregating across stages like persons) or paralysis (if no aggregation). Briefly sketches a potential third option (e.g., aggregation tied to degree of connectedness) OR convincingly argues why one of the first two options is preferable.
      *   *B-Grade vs. A-Grade:* A B-grade answer might mention the personal identity challenge but not develop its implications or sketch alternatives. An A-grade answer *must* grapple with the consequences for contractualism and explore solutions/outcomes.

  **Separating A from B:** A B answer will competently hit points 1-5. An A answer *must* also successfully engage with point 6, demonstrating deeper philosophical insight into the metaphysical underpinnings and potential vulnerabilities of the proposed resolution.

  **Earning Zero:** Answers that fundamentally misunderstand the case (e.g., confusing the one-shot and sequence, misstating the outcomes), fail to engage with contractualism/non-aggregation, or merely restate the basic aggregation problem without addressing the sequence challenge earn zero. Answers advocating solely for utilitarianism without engaging the contractualist puzzle as posed also score poorly, unless thoroughly argued as the only consistent outcome (which would still require hitting points 1, 3, and potentially 6).
