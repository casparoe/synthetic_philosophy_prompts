  Premise (4) claims that family resemblance concepts lack necessary conditions. This is where things get tricky. Does overlapping similarity really exclude any necessary conditions? Consider "game"—could there be a minimal condition, like being an activity? If we reject (4), we can say that family resemblance concepts can have some necessary features without having a full set of sufficient conditions. 

  Premise (5) follows from (4), so if (4) is weak, (5) might not hold. The user wants to keep both family resemblance concepts and sharp-boundary ones. Rejecting (4) allows that. For example, "game" might require being rule-governed, but not all rule-governed activities are games. Meanwhile, "prime number" has strict conditions. 

