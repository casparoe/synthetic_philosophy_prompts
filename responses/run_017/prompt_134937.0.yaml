answer: |-
  ### Restatement of the Church-Turing Debate in PL/Operational Semantics Vocabulary

  #### **1. Core Claim (Human-Computable Functions)**  
  *Original*: Turing-machine computable functions = human-computable functions via finite, explicit procedures with unbounded resources.  
  *Translation*:  
  - **Objects**: Formal languages (e.g., untyped λ-calculus) and abstract machines (e.g., Turing machines, CEK machines).  
  - **Claim**: The set of functions definable in any Turing-complete language (e.g., λ-calculus) is identical to the set of functions implementable via a small-step operational semantics where:  
    - The semantics is **finitely specified** (e.g., a fixed set of reduction rules).  
    - The machine has **unbounded storage** (e.g., an infinite tape, a growable stack/heap).  
    - Computation is **step-by-step** (small-step semantics) and **deterministic modulo resource limits**.  
  - **Role of the thesis**: Acts as a **robustness result** for the equivalence of independently developed formalisms (λ-calculus, Turing machines, combinatory logic). This is a **theorem** (e.g., "All Turing-complete systems are observationaly equivalent for terminating programs").  

  #### **2. Stronger Claim (Physical Computation)**  
  *Original*: Any physical process computes only Turing-computable functions.  
  *Translation*:  
  - **Objects**: Runtime systems (e.g., JVM, Wasm engine) executing on physical hardware.  
  - **Claim**: Any function computed by a physical runtime (with finite energy/matter but unbounded time/storage) is definable in a Turing-complete language. Physical "primitives" (e.g., FPU instructions, syscalls) are **implementations of functions already in the computable set** (Δ<sup>0</sup><sub>0</sub> arithmetic, stateful I/O).  
  - **Distortion**: Your framework assumes physical runtimes are **formalized as part of the language's operational semantics** (e.g., embedding syscalls as external functions). The strong claim asserts that these extensions never add *new computable functions*, only *efficiency or convenience*. If true, physical runtimes are merely **optimized interpreters** for Turing-complete languages.  

  #### **3. Epistemic Status & Convergence Argument**  
  *Original*: Is the thesis a definition, empirical hypothesis, or theorem?  
  *Translation*:  
  - **In your framework**: It is a **meta-theorem about equivalence of formal systems**. The convergence of λ-calculus, Turing machines, etc., is **proof of a deep invariant** in computation theory, akin to showing multiple type systems (Hindley-Milner, System F) having the same expressive power.  
  - **Residue**: The "informal human procedure" aspect has **no direct counterpart**. Your work validates against:  
    - **Differential testing**: Compare outputs of a reference interpreter (e.g., a proven-correct abstract machine) against a production runtime.  
    - **Corpus validation**: Check language semantics against hand-worked cases (e.g., Rosetta Code examples) to cover intuitive human procedures.  
  - **What's lost**: The "informal-to-formal" link is **never directly proven**; it's justified by the convergence argument + empirical validation. Your substitute is **extensional equivalence** across formalisms.  

  ---

  ### **Interface Thesis: Interactive Computation**  
  *Original*: Focus on interaction behaviors (infinite input/output streams) rather than finite functions.  
  *Translation*:  
  - **Your vocabulary**: Distinguish between:  
    - **Partial functions**: `f : Input → Output` (modeled as big-step semantics; may diverge).  
    - **Productive processes**: Interactive systems with small-step semantics `State → Input → (Output × State)` running forever (e.g., a web server).  
  - **Formal counterpart**:  
    - **Big-step semantics** for functions (observational equivalence: same output for same input).  
    - **Coinductive small-step semantics** for reactive systems (observational equivalence: same traces of I/O events).  
  - **Colleague's claim**: Correct. The Church-Turing thesis concerns **terminating computations** (partial functions), while the interface thesis concerns **non-terminating, reactive systems**.  
  - **Does your framework collapse them?**  
    - **No**: Extensional equality of functions (Church-Turing) ignores ongoing behavior.  
    - **Reactive systems** require **behavioral typing** (e.g., session types) or **process calculi** (π-calculus) to specify liveness properties.  
    - **Example**: A runtime sustaining a stateful server process (e.g., Erlang actor) is **not** definable as a function `Input* → Output*` because it must handle *interleaved inputs* at arbitrary times.  

  ---

  ### **Residue Report**  

  #### **Clean Mappings**  
  - **Equivalence of formalisms** (λ-calculus ≈ Turing machines) maps to **observational equivalence proofs** (e.g., compiler correctness between IRs).  
  - **Physical computation as runtime implementation** maps to **primitives added via FFI/syscalls**, with correctness defined as **preservation of observable behavior**.  
  - **Interface distinction** maps cleanly to **small-step (reactive) vs. big-step (functional) semantics**.  

  #### **Mappings with Distortion**  
  - **Strong physical claim**:  
    - Your view: Adding primitives is routine (e.g., `sin(x)` as a hardware op).  
    - Distortion: The strong claim asserts these primitives are **always reducible to Turing-computable functions**. Your framework **assumes this** by treating runtimes as formalizable in the metalanguage (e.g., modeling hardware in Coq).  
    - **Hunch survival**: Correct. The substantive part *does* live at the implementation level:  
      - If a physical device (e.g., quantum computer) *actually* computes a non-Turing-computable function (e.g., solves halting problem), it could be exposed as a primitive.  
      - But the strong claim denies this possibility. Your vocabulary *exposes* that the debate is about **whether the physical universe admits formalization in a Turing-complete metalanguage**.  
  - **Convergence argument**:  
    - Distortion: Philosophers treat convergence as evidence for informal claims; you treat it as **proof of invariance**.  

  #### **No Counterpart**  
  - **Informal "human computation"**:  
    - No direct analogue, as specifications are checked against **formal models**, not intuitive procedures.  
    - Nearest substitute: **Validation against a corpus** of diverse programs (e.g., CompCert's test suite) + **user studies** on programmer intuition (rare).  
  - **Epistemic uncertainty**:  
    - In your work, the Church-Turing thesis is a **design choice** (e.g., "Our language is Turing-complete") backed by formalism equivalence. The "is it true?" question has no bite.  

  ---

  ### **Verdict: Vocab Defects vs. Original Fuzziness**  
  - **Defects in your vocabulary**:  
    - Cannot directly model **informal human procedures** (residue: rely on corpora/testing).  
    - **Physical implementation** is black-boxed (e.g., "syscall" is a label in semantics). The strong claim forces you to ask: "Is this black box Turing-computable?"  
  - **Original fuzziness exposed**:  
    - The core claim conflates **formal equivalence** (provable) with **human cognition** (untestable in your framework).  
    - The interface thesis reveals Church-Turing's **limited scope**: it says nothing about reactivity, liveness, or real-time constraints.  
  - **Hidden insight**: Your framework shows that **extensional equality is insufficient** for reactive systems. The interface thesis isn't about "more functions" but **more behaviors** (e.g., responsiveness guarantees). Philosophers often miss this because they fixate on functions.  

  **Final note**: Your hunch stands. Adding primitives *is* banal, but the strong claim constrains *what primitives can exist*: if the universe computes only Turing-computable functions, no primitive can break that. The debate's residue is a reminder that your semantics always **rests on a physical substrate** whose capabilities are assumed, not proven.
