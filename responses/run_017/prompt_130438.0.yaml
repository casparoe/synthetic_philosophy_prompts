answer: |-
  ### One-Sentence Procedure  
  "Classify the prediction type; if missed, rigorously validate 'averted outcome' defenses and pre-specified auxiliaries; allow one free retiming with a new public pre-commitment; after two misses or invalid rescues, discontinue unless escalated to [Named Senior] for judgment."

  ### Decision Procedure Steps  
  1. **Classify Prediction Type** (pre-falsification):  
     - **Dated Point Forecast**: Specific outcome by a specific date.  
     - **Dominance Claim**: Specific force dominates all others by a date, causing an outcome.  
     - **Bare Mechanism/Existence Claim**: Mechanism or outcome exists, no date.  
     - *Output*: Type, date (if applicable), and headline outcome.  

  2. **Validate "Averted Outcome" Defense** (if claimed):  
     - Require **all** to be true:  
       a. *Causal link*: Evidence (e.g., policy documents, media) that the forecast directly triggered a major intervention.  
       b. *Novelty*: Intervention was not planned/implemented before the forecast.  
       c. *Effect*: Independent data (e.g., third-party reports) shows the intervention caused the miss.  
     - *If defense fails*: Treat as a miss.  

  3. **Audit Auxiliary Hypotheses**:  
     - Cross-check original proposal/reports for pre-specified auxiliaries (e.g., "no new technology," "no policy change").  
     - For retrofitted auxiliaries (e.g., "unforeseen technology"):  
       - Accept **only** if pre-specified or supported by independent contemporary evidence (e.g., data from the forecast period).  
       - Reject if retrofit without evidence.  

  4. **Apply Retiming Rules**:  
     - **First miss** (any type): Allow one free retiming. Model team must:  
       - Set a **new date**.  
       - Define a **new independently checkable consequence** (e.g., different outcome or metric).  
       - Enter both in a **public pre-commitment ledger** (time-stamped project document).  
       - *Renew with these conditions*.  
     - **Second miss** (or first miss with retrofitted auxiliaries):  
       - Discontinue unless model team provides new pre-commitment (as above) **and** case passes judgment call (Step 5).  
     - **Bare claims**: First miss requires setting a date/consequence (treat as dated forecast).  

  5. **Judgment Call Escalation Points**:  
     - Hand to **[Named Senior: Head of Research]** for final ruling if:  
       - Two misses occur but new evidence (e.g., external shock, partial mechanism validation) suggests exceptional promise.  
       - "Averted outcome" defense is borderline (e.g., intervention link is indirect).  
       - Bare claim retiming consequences are ambiguous.  
     - *Analyst must document reasons for escalation*.  

  6. **Stop with "No" At**:  
     - Two misses without validated defense or pre-specified auxiliaries.  
     - "Averted outcome" defense fails validation.  
     - Retrofitted auxiliaries without evidence.  
     - Second miss without escalation approval.  

  ---

  ### Case Applications  
  #### Case 1: Neo-Malthusian Food-and-Population Model  
  - **Classification**: Dated Point Forecast (famine windows: Year 5 and Year 10).  
  - **"Averted Outcome" Defense?** None claimed.  
  - **Auxiliary Audit**: Original model assumed "no yield improvements"; retrofitted claim of "unforeseen tech" lacks pre-specification.  
  - **Miss Count**: Two (both windows passed).  
  - **Judgment Call?** No.  
  - **Recommendation**: **Discontinue** (two misses; no free retiming left).  

  #### Case 2: Resource-Depletion Model  
  - **Classification**: Dominance Claim ("depletion forces dominate substitutes by Year 8, causing permanent spike").  
  - **"Averted Outcome" Defense?** None claimed.  
  - **Auxiliary Audit**: Original model pre-specified "no new extraction tech"; collapse due to tech invalidates dominance claim.  
  - **Miss Count**: One (spike occurred but not sustained).  
  - **Judgment Call?** No.  
  - **Recommendation**: **Renew with one free retiming** (new public pre-commitment: e.g., "price spike without tech substitution by Year 12" and "new metric: resource-to-reserves ratio").  

  #### Case 3: Institutional-Trust Decline Model (Flagship)  
  - **Classification**: Dominance Claim ("trust erosion dominates interventions by Year 10, causing collapse").  
  - **"Averted Outcome" Defense?** Claimed (forecast "helped trigger policies").  
    - Validation:  
      - Causal link: Weak (no evidence forecast directly influenced policies; policies existed pre-forecast).  
      - Novelty: Policies planned before forecast (e.g., OECD anti-corruption initiative).  
      - Effect: Trust stabilized due to economic recovery (per IMF reports), not policies.  
    - **Defense fails**.  
  - **Auxiliary Audit**: Original model omitted interventions; retrofitted "policy response" auxiliary lacks pre-specification.  
  - **Miss Count**: One (threshold not crossed).  
  - **Judgment Call?** Escalate to **[Head of Research]** if new evidence arises (e.g., trust erosion in sub-indicators); else, no.  
  - **Recommendation**: **Renew with one free retiming** (new public pre-commitment: e.g., "collapse by Year 15" and "new consequence: trust polarization index").
