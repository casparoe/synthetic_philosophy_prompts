  Detailed Steps (in order):

  1. **Classify the Prediction**: Determine the type of prediction made by the model at the time of funding or last review. Choose one:
     - **Dated Point Forecast**: A specific outcome by a specific date.
     - **Dominance Claim**: A claim that one force will outweigh all others by a given date, leading to an outcome.
     - **Bare Mechanism/Existence Claim**: A claim about a mechanism or the existence of a phenomenon without a specific timeline.

  2. **Evaluate 'Averted Outcome' Defense (if claimed)**:
     - Require the model authors to provide evidence that:
       a. The model's prediction was widely known and directly influenced a policy intervention or major behavioral change.
       b. The intervention was not already planned or occurring at the time of the prediction.
       c. The intervention is independently verified (by third-party sources) to have caused the avoidance.
     - If the defense is not claimed, skip to step 3.

  3. **Audit Auxiliary Hypotheses**:
     - Check the original model documentation (proposal, prior reports) for declared auxiliary assumptions (e.g., "no new technology", "no policy change").
     - For any new auxiliary hypotheses introduced after the miss (e.g., "unforeseen technology emerged"), determine if they were:
       a. Pre-specified in the original model documentation (allowable).
       b. Not pre-specified but independently supported by evidence at the time of the original prediction (allowable only if strong evidence exists and is documented).
       c. Retrofit without pre-specification or independent contemporary evidence (not allowable).

  4. **Count Misses and Apply Retiming Rule**:
     - For Dated Point Forecasts and Dominance Claims:
       - First miss: Allow one free retiming. The model team must specify a new date and a new independently checkable consequence (must be different from the original and not a trivial extension) in a public pre-commitment ledger (e.g., a project document that is time-stamped and accessible).
       - Second miss (or if the first miss already occurred and this is the second): Do not allow further retiming without a new public pre-commitment that includes both a new date and a new checkable consequence. However, if the model has already used its one free retiming, then after the second miss, recommend discontinuation (unless step 5 applies).
     - For Bare Mechanism/Existence Claims: 
       - These do not have a date. If the mechanism has not been observed and the authors ask for more time, require them to set a first date by which some testable consequence (even if not the full mechanism) must occur. Then treat as a Dated Point Forecast from that point.

  5. **Judgment Call Points**:
     - If the model has two misses but the authors present a compelling case with new evidence (e.g., new data that the mechanism is operating as predicted but slower, or a major external shock that was unpredictable and disrupted the timeline), then the case must be handed to a named senior decision-maker (specify the role, e.g., "Head of Research") for a final judgment.
     - The senior decision-maker must consider:
       a. The model's track record (including past predictive successes).
       b. The novelty and importance of the model's mechanism.
       c. The feasibility of the new pre-commitment.

  6. **Decision**:
     - After step 4, if the model has:
       - No misses: Renew.
       - One miss and a valid retiming: Renew with the new public pre-commitment.
       - Two misses: Recommend discontinuation (unless passed to senior and they approve).
     - If the 'averted outcome' defense is validated: Treat as a successful prediction and renew.
     - If the 'averted outcome' defense is claimed but not validated: Treat as a miss and proceed to step 4.

