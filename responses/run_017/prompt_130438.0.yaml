  - **Retiming Rule**: 
    - This is the second miss. The model has already had two chances. No free retiming left.
  - **Judgment Call?**: None, unless the model team presents new evidence that meets step 5. If not, then:
  - **Decision**: Discontinue.

  **Case 2: Resource-depletion model**
  - **Prediction Classification**: Dated Point Forecast (price spike by a specific date).
  - **'Averted Outcome' Defense?**: Not claimed. The price spike occurred but then collapsed due to an extraction technology not in the model.
  - **Auxiliary Hypotheses Audit**: 
    - Check if the model pre-specified that no new extraction technology would emerge. If the model did not include such technology and it was not pre-specified as an auxiliary, then the collapse after the spike is a miss (because the model predicted a sustained spike or continued depletion, not a temporary spike). 
    - However, note: the model did predict the spike. But the model's mechanism (depletion leading to sustained high prices) was invalidated by the subsequent collapse. So the prediction of a spike was correct, but the underlying mechanism (depletion without technological substitution) was flawed. This is one miss (on the mechanism after the spike).
  - **Retiming Rule**: 
