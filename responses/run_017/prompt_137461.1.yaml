prompt: |-
  I've got a 90-minute slot in an upper-level metaethics seminar, 14 students, most of them fine with the reasons-first framework and with buck-passing about value, but all of them treating it as obvious that a reason is a reason *for* somebody. I want to loosen that. Can you design an activity where they end up taking seriously the idea that there could be rationales that aren't anyone's — that a consideration can count in favor of something even with no agent around whose reason it is — without me saying any of that up front, and without the label showing up until the debrief? Ideally they build the case themselves and only notice at the end where they've arrived.

  Two things I want built in, because they're exactly what I fail to get across when I just lecture at them.

  First, I think they collapse two cases: a reason nobody in fact has (unclaimed) and a reason nobody could have (unclaimable — no agents exist, or the content doesn't fit any possible agent's situation, whatever). They hear "no one has it" as obviously meaning "it isn't there," and so they can't even hear the interesting version, which is the unclaimed-but-claimable one. I want the activity to drive that wedge apart in a way they generate rather than one I hand them.

  Second, the case type I find most gripping and can never make land: orphaned mandates. A rule or rationale left behind by a practice that no longer exists — a lighthouse whose ships are gone, a checksum in a dead protocol, a monastic rule for a monastery empty for two centuries, a file format nobody can open anymore. Something that seems to still *call for* something while nobody around has the aim that made it a reason. If you can build the activity around them inventing their own orphaned mandates and then stripping features away to see what normative residue survives, great, but do it however works better.

  What I need: rules and materials (whiteboard and index cards, that's the room; no money, and ideally no laptops), a rough timeline, and a debrief that maps specific moments in the activity onto specific moves in the dialectic. I also want them to come away seeing that this isn't just objectivism about value re-described, since that's definately where half the room will try to file it. And tell me what will predictably go wrong the first time I run it — my guess is someone says "that's just a metaphor" and the whole thing deflates, but you tell me — plus be honest about which feature of the idea the activity can't reproduce and I'll have to say out loud myself.

  Write it as plain continuous prose, no headings, bullets, bold or tables, just something email-length I can read on my phone on the way in.
reasoning: |-
  Okay, let me tackle this metaethics seminar activity request. The professor wants students to explore unclaimed reasons through an experiential activity, avoiding direct instruction. 

  First, I need to consider the core objectives: separating unclaimed from unclaimable reasons, and examining orphaned mandates. The students' starting point is treating reasons as necessarily belonging to agents - that's the assumption to challenge. 

  For the activity structure, index cards could work well for creating 'artifacts'. Students generating examples themselves is crucial for ownership of the discovery. Phase one might involve inventing functional rules (e.g. "If signal weak, boost antenna"), then phase two removing agents and purposes to expose residual normativity. 

  Timing is tight - 90 minutes total. Maybe 15min intro, 30min artifact creation, 15min stripping exercise, 20min small group discussion, 10min debrief. The stripping phase is key for driving the wedge between unclaimed/unclaimable. 

  Potential pitfalls: students dismissing normative residue as metaphorical, or reducing it to objectivism. The debrief must explicitly map activity moments to philosophical distinctions. Orphaned mandates are the strongest case against reduction - I'll emphasize examples like defunct monastery rules where the 'point' persists without any possible claimant. 

  What might go wrong? Someone might shortcut to "it's just objective value" early. The activity design needs to prevent this by keeping focus on concrete examples until the debrief. The professor should prepare to gently redirect such interventions. 

  The hardest part to convey through pure activity is why this isn't just buck-passing in disguise. That may require brief direct commentary during debrief, using their own examples to show how orphaned mandates aren't serving any agent's aims.
answer: |-
  Here's an activity designed to sneak them into the territory. Grab index cards as you head in. Start by framing it as an exercise in normative archaeology: "We're going to excavate layers of practical reasoning today, seeing what holds up when contexts shift. Pair up – you'll build something, then dismantle it." 

  **Phase 1: Constructing the Mandate (20 mins)**  
  Hand each pair two index cards. On Card A, they write a very specific, concrete *action* tied to a clear *aim* and *context*: "When [Context], do [Action] to achieve [Aim]." Push for detail: "When the signal strength drops below 40% (Context), recalibrate the secondary antenna array (Action) to maintain uplink stability (Aim)." Or "When the novice monk enters the refectory after the third bell (Context), bow towards the elder's table (Action) to show humility (Aim)." On Card B, they write the *rationale* explaining *why* that action serves that aim in that context: "Recalibration compensates for signal dispersion." "Bowing acknowledges hierarchy and reduces pride." Collect all Card As (Actions) and shuffle. Collect Card Bs (Rationales) separately.  

  **Phase 2: The Great Abandonment (25 mins)**  
  Redistribute Card As randomly to different pairs. Tell them: "The context and aim written on your *original* Card A are gone. Vanished. The antenna array is now in a museum. The monastery is ruins. But this *action* lingers." Point to the Card A they now hold. "Your task: Argue, using *only* the rationale you can find or construct from the debris, whether this action *should still be performed* in *some* sense. You can invent a *new* context, but it must be plausible and unrelated to the original aim. Don’t look for Card B yet! Reason from the action’s inherent logic." Give them 10 mins to discuss. Then, hand out the Card Bs (Rationales) randomly. "Now you’ve found a fragment of the old rationale. Does this change your argument? Does it make the 'should' stronger, weaker, or just different? Refine your case."  

  **Phase 3: Shifting Sands & The Core Residue (20 mins)**  
  Regroup as a class. Ask pairs to report:  
  1.  What action they had.  
  2.  What rationale fragment they found (Card B).  
  3.  Their argument *before* seeing Card B.  
  4.  Their argument *after*.  
  5.  Crucially: "If we now stipulate that *no possible agent* exists who could have the original aim (e.g., no monks left, no comms engineers), does *anything* normative survive in the rationale itself? Is it just a fact, or does it still 'call for' the action, even uselessly?" Whiteboard observations. Push hard on the difference between these two claims they’ll likely make: "Nobody *has* a reason to do this now" (true) vs. "There *is no reason* to do this now" (debatable). Note when they appeal to the *internal logic* of the rationale fragment ("Because bowing *just is* respectful," "Recalibration *is* the proper response to signal loss") even when useless.  

  **Debrief (25 mins)**  
  "Today we explored normative fossils. You built mandates (action + rationale for an aim), then stripped away: first the context/aim, then the possibility of any agent having that aim. What survived?" Map their process:  
  *   **Constructing Card A/B:** Embodied the standard view – reasons are *for* agents pursuing aims.  
  *   **Losing Context/Aim (Phase 2 start):** Created the "unclaimed reason" scenario. They likely argued using *potential* aims or *analogous* contexts – showing the rationale *could* be claimed.  
  *   **Finding Card B (Rationale Fragment):** Introduced the orphaned mandate. The rationale existed independently, offering normative structure.  
  *   **Stipulating No Possible Agent (Phase 3 Q5):** Forced the "unclaimable reason." Key moment: When they said the rationale fragment *still contained a 'point'* (e.g., "Bowing *would be* respectful *if*..."), that's the residue. It’s not a reason *for* anyone, but a reason *why* the action *fits* a (non-existent) standard.  
  *   **Why not just objectivism?** Because the orphaned rationale isn't a *value* (goodness) being passed on. It's a *structural* norm – a "this is how you X" even when X-ing is impossible/pointless. It's the 'ought' embedded in the practice itself, detached from good-making. The lighthouse beam *still signals safe passage* even with no ships; that's its rationale, not an objective value 'safe passage is good'.  

  **Predictable Snags & Required Intervention:**  
  1.  **"It's just a metaphor!"** (Likely when discussing unclaimable residue): Counter: "When you said 'Recalibration *is* the proper response,' or 'Bowing *is* respectful,' what work was 'proper' or 'respectful' doing? Were you *only* describing a historical fact, or pointing to a normative standard that *applies* to the action, even vacuously? If it's *only* a metaphor, what's the literal truth it's standing in for?" Force them to articulate the normative language they naturally used.  
  2.  **Collapsing Unclaimed/Unclaimable:** They'll blur Phase 2 (arguing based on potential claims) and Phase 3 (no possible claim). In debrief, explicitly contrast pairs' Phase 2 arguments (finding new agents/aims) with the Phase 3 'last stand' of the rationale fragment itself. Highlight the moment they realized *no* agent could claim it, yet something normative seemed to linger.  
  3.  **Reduction to Objectivism:** You'll need to explicitly state the distinction in debrief (as above). The activity *shows* the structural norm, but you must *say* why it's not buck-passing: Orphaned mandates aren't reasons *to promote value*; they are the ghostly remains of *how one would* engage with a (dead) practice correctly. Their 'gripping' quality comes from this structural 'ought' persisting without a subjective 'for'.  

  The activity can't *perfectly* simulate the non-agent-relativity of the residue; they'll naturally project. But by making them generate the mandates, strip the context, and wrestle with the useless rationale fragment, they'll *feel* the pull of something normative left behind. Your debrief connects that feeling to the philosophical moves, driving the wedge and revealing the orphan.
