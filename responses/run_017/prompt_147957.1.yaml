prompt: |-
  I was living in Edinburgh through the 2014 independence campaign and voted in it, and I am now doing some part-time postgraduate work on democratic theory, where I want to use that referendum as a case study of the boundary problem rather than as decorative background. The facts I am working from, so that we are not at cross purposes: the vote was held on 18 September 2014 on the simple question whether Scotland should be an independent country, needing only a simple majority; it was authorised by the 2012 agreement between the Scottish and UK governments and by the Scottish Independence Referendum Act 2013; the electorate was residence-based and about 4.3 million strong — British, Commonwealth and EU citizens resident in Scotland aged 16 or over, with 16- and 17-year-olds enfranchised for the first time — so that Scots living in England or Wales could not vote while EU citizens living in Scotland could, and the voters of the rest of the United Kingdom had no say at all; the result was 55.3 per cent No to 44.7 per cent Yes on a turnout of 84.6 per cent. What I want first is a disciplined mapping rather than an opinion. Take three or four of the standard answers to the boundary question — everyone whose interests are materially affected, everyone who would be subject to the coercion of whichever state or states result, the constituent-power view on which a people with a claim to self-determination simply is the right unit, and the thinner civic view on which lawful residence and a stake in the community suffice — and tell me what franchise each would actually have produced that September. I especially want four pressure points: the Scots resident elsewhere in the UK who were excluded; the EU citizens resident in Scotland who were included and whose citizenship would have been transformed twice over had Scotland left the UK and joined the EU; the 16- and 17-year-olds, and, if a criterion reaches them, why it does not also reach the 15-year-olds and the not-yet-born who will live longest with the outcome; and the rest of the UK, whose defence, currency, debt and EU membership were all in play.

  Then say which criterion the actual franchise best matches and which it flatly contradicts — and then run the case the other way, because what interests me most is what it shows about the theory. Two features strike me as badly handled by the way the boundary question is normally posed. The first is that this demos was not discovered but chosen by a party to the dispute: the Scottish Government drafted the franchise, the Scottish Parliament enacted it, Westminster consented, and each contested element of it — the lowered voting age, the exclusion of Scots abroad, the inclusion of EU residents — was widely taken at the time to favour one side. As I have encountered it, the discussion asks which boundary is correct and seems to have very little to say about a boundary strategically chosen by one of the parties, where who decides is settled by a decision that is undemocratic in just the sense under discussion. Is that a genuine gap, or does one of the criteria already absorb it? The second is a test I have been turning over and cannot make work, which I have been calling the reconstitution condition: the demos competent to dissolve a union must be the same demos, constituted in the same way, that would be competent to reconstitute it, so that a decision which cannot be revisited by the electorate that inherits its consequences — because those voters are dead, newly enfranchised or newly arrived — is defective in a way that has nothing to do with the justice of the cause. Does that condition collapse into one of the standard criteria? Does it condemn cases we take to be clear, such as the American colonies or the secession that produced the Irish Free State, since those were irreversible too? And does it do any work on the problem of the chosen demos, or only relocate it one level up?

  What I want from the answer is discipline about the mapping rather than breadth: who the rival claimants are, what each criterion counts as evidence of affectedness or subjection, what verdict it returns on each pressure point, and where it falls silent instead of being made to speak. I would rather have 700 careful words than a tour of the positions available, and I should mention that I am writing this from a borrowed flat with no library and no internet, so argument and example are all I can use and pointers to literature would be wasted on me.
reasoning: |-
  Alright, let me approach this systematically. The user presents a highly specific academic inquiry about the 2014 Scottish independence referendum as a case study for democratic boundary theory. They're clearly deeply knowledgeable - having lived through the event and now studying democratic theory at postgraduate level. 

  First, I need to parse their layered request: they want a disciplined mapping of how four standard democratic boundary criteria would have shaped the referendum franchise, applied to four specific "pressure points". Then they want analysis of how the actual franchise aligns with these theories, plus examination of two conceptual challenges they've identified - the "chosen demos" problem and their "reconstitution condition".

  The user's working without library/internet access, so I must build the response entirely from logical argumentation and the facts they've provided. Their tone suggests impatience with vague theoretical discussions - they want precise application. I notice they're particularly troubled by how theories handle strategic franchise design and irreversible decisions.

  For the mapping section, I'll take each criterion in turn:
  - Materially affected: Must carefully distinguish between direct/substantial effects vs indirect/remote ones. The Scots outside Scotland are tricky here - while affected, is it materially different from other UK citizens?
  - Subject to coercion: This turns on the jurisdiction of the new state. Important to note EU citizens in Scotland would face dual coercion changes.
  - Constituent-power: The most categorical - hinges entirely on prior recognition of "the people". Need to show why this excludes some groups inherently.
  - Civic residence: Most inclusive but with age threshold issues. Must explain why it stops at 16 when younger residents also have stakes.

  For pressure points, I'll systematically apply each criterion to:
  1. Scots elsewhere in UK
  2. EU residents in Scotland 
  3. 16-17 year olds (and by implication younger)
  4. Rest of UK population

  Then for alignment: The civic residence criterion clearly matches the actual franchise best, while constituent-power directly contradicts it by excluding non-ethnic Scots. 

  On their conceptual challenges:
  The "chosen demos" problem exposes how most theories assume a neutral framer rather than contested process. I'll argue only the "subject to coercion" view partially addresses this through its procedural focus. 

  Their reconstitution condition is fascinating but problematic - while intuitively appealing, it would invalidate most historical secessions. Better seen as highlighting democratic reversibility concerns within existing criteria rather than a standalone test.

  Throughout, I must resist tangents and maintain forensic focus on their questions. No literature references - pure reasoning from their stated facts and democratic principles. The tone should remain academic but avoid unnecessary jargon, respecting their expertise while ensuring logical transparency.
answer: |-
  Here is a disciplined mapping of the 2014 Scottish independence referendum franchise against four standard democratic boundary criteria, followed by analysis of your conceptual challenges:

  **1. Materially Affected Interests**
  *   **Franchise Produced:** Significantly broader than 2014.
      *   *Scots resident elsewhere in UK:* Included. They have strong economic, familial, cultural, and identity-based interests affected by Scotland's constitutional status (e.g., pensions, citizenship options, national identity, family links).
      *   *EU citizens resident in Scotland:* Included. Their residency rights, employment, access to services, and future EU status are directly affected.
      *   *16/17-year-olds:* Included. Their long-term future (education, employment, citizenship) is materially affected.
      *   *Rest of UK:* Included. Defence posture, national debt apportionment (including Scottish share), currency union stability, EU membership negotiation dynamics, and national identity/territorial integrity are materially affected. *Pressure Point:* The criterion struggles with intensity and proximity. Why not include international markets (affected by debt/currency)? Why not the 15-year-old (similarly affected long-term)? Why not the not-yet-born (most affected long-term)? It risks infinite regress without a threshold of *direct* and *substantial* impact, which is inherently contestable.

  **2. Subject to Coercion (Resulting State(s))**
  *   **Franchise Produced:** Narrower than 2014 for some groups, potentially broader for others.
      *   *Scots resident elsewhere in UK:* Excluded (if Scotland leaves). They would remain subject primarily to UK state coercion, not the new Scottish state. Their Scottish identity doesn't change legal jurisdiction.
      *   *EU citizens resident in Scotland:* Included (if Scotland leaves). They would become subject to the coercion of the new Scottish state regarding residency, law, taxation, etc. Their EU status is secondary to the primary jurisdiction change.
      *   *16/17-year-olds:* Included. They would be subject to the laws of the resulting state(s). *Pressure Point:* If Scotland becomes independent, why exclude 15-year-olds who will also be subject to its laws within a short timeframe? The "subject to" test focuses on the *immediate* change in sovereign authority, potentially overlooking those becoming subject soon after or bearing long-term consequences without direct initial subjection.
      *   *Rest of UK:* Excluded. They remain subject to UK state coercion. The changes (defence, debt, currency) occur *within* the continuing UK state structure; they are not newly subject to a *different* sovereign power. The UK state persists.

  **3. Constituent-Power (Pre-political People/Self-Determination)**
  *   **Franchise Produced:** Likely significantly narrower than 2014.
      *   *Scots resident elsewhere in UK:* Included (often). They are typically seen as part of the pre-political "Scottish people" based on birth, ancestry, or origin, regardless of current residence. Excluding them weakens the claim to represent the whole nation.
      *   *EU citizens resident in Scotland:* Excluded. Membership is based on ethno-national or historical belonging, not current residence or civic participation. They are not part of the "Scottish people" in this primordial sense.
      *   *16/17-year-olds:* Included. They are members of the people/nation. *Pressure Point:* Why exclude 15-year-olds? Age thresholds within the "people" are arbitrary under this view. The not-yet-born aren't *current* members of the people. This view is silent on the Rest of UK; they belong to a *different* pre-political people (British/English/Welsh/N. Irish), so their exclusion is inherent.

  **4. Civic Residence/Stake in Community (Thinner Civic View)**
  *   **Franchise Produced:** Matches the 2014 franchise very closely.
      *   *Scots resident elsewhere in UK:* Excluded. They lack current lawful residence and the immediate stake derived from living, working, paying taxes, and using services *in* Scotland.
      *   *EU citizens resident in Scotland:* Included. They have lawful residence and a tangible stake (jobs, homes, families, use of services, participation in local community).
      *   *16/17-year-olds:* Included (specific choice). The franchise extended the civic community to include this age group, arguing they have a stake (e.g., in education, part-time work, community involvement) sufficient for this fundamental decision. *Pressure Point:* Why exclude 15-year-olds? The line is inherently contestable ("stake" at 16 vs. 15 is a matter of degree, often set by convention/policy). The not-yet-born lack current residence/stake. The Rest of UK lacks residence *in Scotland*; their stake is in the *UK* polity, not the specific Scottish community voting to potentially leave it.

  **Alignment & Contradiction:**
  *   **Best Match:** The **Civic Residence/Stake in Community** view aligns almost perfectly with the 2014 franchise. It justifies the inclusion of resident EU citizens and 16/17-year-olds and the exclusion of Scots resident elsewhere in the UK and the Rest of UK electorate.
  *   **Flat Contradiction:** The **Constituent-Power** view directly contradicts the 2014 franchise. It demands the inclusion of Scots resident elsewhere in the UK (as part of the nation) and demands the exclusion of resident EU citizens (as non-members of the pre-political people). The franchise explicitly rejected this ethno-national basis.

  **Analysis of Conceptual Challenges:**

  1.  **The "Chosen Demos" Problem:**
      *   This is a genuine gap in standard boundary theories. The theories typically focus on normative justification *for* a boundary ("Who *should* decide?"), assuming a neutral or undisputed framer. They lack robust tools to analyze the *process* and *strategic agency* involved when one party (like the Scottish Government/Parliament) *designs* the demos for a vote it initiates, especially when contested elements (age, ex-pats, EU residents) demonstrably align with perceived campaign advantages.
      *   **Absorption?** No standard criterion fully absorbs this. The "Subject to Coercion" view comes closest *implicitly*: it focuses on the *resulting* state's jurisdiction, implying the authority to define that jurisdiction might lie with the entity creating the new state (or the entity whose territory is contested). However, it doesn't directly address the democratic legitimacy *of that entity's choice* of franchise *for the separation decision itself*. The gap remains – theories struggle to normatively evaluate a process where the demos is strategically defined by one side in the dispute it aims to resolve.

  2.  **The "Reconstitution Condition":**
      *   **Collapse?** It doesn't neatly collapse into a standard criterion. It introduces a novel *procedural* constraint focused on reversibility and temporal consistency of the demos, distinct from the substantive justifications (interests, coercion, peoplehood, residence) offered by the others.
      *   **Condemn Clear Cases?** Yes, potentially. It casts doubt on the American Revolution and Irish secession (as you note), as the demos voting for independence was not the demos that could later vote to rejoin Britain (due to death, migration, new citizens). It highlights a tension: democratic legitimacy often assumes the demos is a continuous entity, but major constitutional ruptures inherently disrupt that continuity.
      *   **Work on Chosen Demos/Relocation?** It primarily **relocates the problem one level up.** The reconstitution condition argues that the demos defining itself *now* (via a chosen franchise) must be constituted such that the *future* demos inheriting the consequences can reconstitute the union *using the same franchise rules*. This doesn't resolve *who chooses the initial franchise rules*; it just imposes a consistency requirement on those rules across time. The core democratic problem of *who authorizes the initial franchise definition* remains unaddressed. The condition highlights a potential defect (irreversibility by the affected future polity) but doesn't solve the prior problem of authorization.

  **Conclusion:** The 2014 franchise maps clearly onto the Civic Residence criterion while contradicting the Constituent-Power view. Your conceptual challenges expose significant limitations in boundary theory: the "chosen demos" problem reveals a lack of theory for contested franchise design by interested parties, and the "reconstitution condition" highlights an under-explored tension between democratic rupture and the continuity/reversibility expected of a demos, but it relocates rather than resolves the authorization dilemma. Both point towards the need for theories that better integrate the *procedural legitimacy* of *defining* the demos for foundational constitutional votes.
