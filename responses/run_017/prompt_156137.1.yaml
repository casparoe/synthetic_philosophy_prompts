  ### Residual Risks  
  Situations the procedure can’t fully resolve, and defaults under time pressure.  

  | Situation | Why It Stalls | What It Actually Turns On | Default If Deadline Hits |
  |-----------|--------------|---------------------------|--------------------------|
  | Conflicting calibrated reports (e.g., 1 rave, 1 pan) | No arbitration rule for equal-weight experts. | Juror’s risk tolerance; chair’s tiebreak. | SAMPLE if resources allow; else NOT. |
  | "Fit claim" ambiguity (e.g., "new for tradition" but tradition undefined) | Subjective whether claim is truly "fit." | Reader’s credibility; juror’s genre knowledge. | Treat as experiential claim (less transferable). |
  | Calibration drift (e.g., reader loved Book X last year, hates similar Book Y now) | Procedure assumes stable calibration. | Gut check: flag for chair review. | Downgrade to uncalibrated. |
  | High-priority SAMPLE but slots exhausted | Resource limit; can’t sample all. | Chair’s triage (severity of negative claim/verdict strength). | NOT if negative claim; WHOLE if strong positive. |

  ---

  ### Smuggled Assumptions  
  Philosophical claims embedded in the procedure. Defend these if challenged:  
  1. **Fit claims are epistemically privileged**: Claims about a work’s novelty within a tradition are more transferable via testimony than experiential claims (e.g., "feels like...").  
  2. **Calibration justifies deference**: Agreement on past works licenses treating a reader’s verdict as evidence, not just opinion.  
  3. **Negative asymmetry**: Specific criticisms are easier/faster to verify than holistic praise.  
  4. **Inaccessibility voids experiential judgment**: You cannot ethically sign a citation for a work whose aesthetic experience you cannot access, even with testimony.  
  5. **Recommendation ≠ belief**: You can recommend (sign) based on trusted testimony without personal aesthetic belief (applies only to "fit-heavy" works).  

