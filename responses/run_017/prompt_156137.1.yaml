  | (a) 700pp Debut | Verdict (rapturous), Texture (prose), Negative (plot collapse) | Step 4 | Positive verdict with checkable negative claim. Requires sampling. | Sample | To be determined after sampling | Deferring (if flaw unconfirmed) / Judging (if flaw disproven) | No |
  | (b) Translated Novella | Verdict (ecstatic), Fit ("new for tradition") | Step 5 | Inaccessible + one uncalibrated report = verdict "Positive" (not Strong Positive). Fit claims insufficient without calibration/consensus. | Not | No | N/A | **Yes** (you can’t support a book you’d likely love) |
  | (c) Your Favorite | Verdict (lukewarm), Texture (reported), "What it’s like" (reported) | Step 4 | Mixed verdict (your adoration ≠ report consensus). Requires sampling per procedure. | Sample | To be determined after sampling | Judging (your sample overrides reports) | **Yes** (reports force sampling despite your love) |

