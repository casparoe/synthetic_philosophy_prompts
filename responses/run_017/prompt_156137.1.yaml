  ### Critical Notes  
  1. **What the Procedure Cannot Do**:  
     - Resolve deep disagreements about calibration or claim types.  
     - Compensate for biased/inconsistent readers.  
     - Guarantee you’ll love a book you sign for.  
     - Overcome resource limits (e.g., if 50 books hit "SAMPLE," only 40 get sampled).  

  2. **Unwelcome Outcomes Are By Design**:  
     - The Translated Novella (**Case b**) fails because one ecstatic report (uncalibrated) + inaccessibility doesn’t meet the bar for "Strong Positive + fit-heavy." You’d reject a book you’d likely champion if you read it.  
     - Your Favorite (**Case c**) forces sampling despite your adoration, risking a "death by committee" outcome.  

  3. **When to Break Protocol**:  
     - If a book triggers existential dread (e.g., "I can’t sign without reading"), override Step 5 and read it whole (costs 1 of your 25 slots).  
     - If all jurors hate a procedure-compliant pick, the chair can veto it.
