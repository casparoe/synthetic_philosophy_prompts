  ### Decision Procedure Table  
  Tape this above your desk for quick reference during report evaluations. Steps are ordered sequentially with explicit stop points. **Key**:  
  - **Sufficient Answer**: What resolves the question (or what to do if unresolvable).  
  - **On No**: Consequence of an insufficient answer.  
  - **Judgment Call**: "Fact" = objective criteria; "Judgment" = subjective interpretation.  
  - **Who Signs Off**: "You" = individual juror; "Chair" = jury chair approval needed.  
  - **Typical Failure**: Common pitfalls at each step.  

  | Step | Question | Sufficient Answer | On No | Judgment Call? (Who Signs Off) | Typical Failure |
  |------|----------|-------------------|-------|--------------------------------|----------------|
  | 1 | Is the book in a form/language *fundamentally inaccessible* to me? (e.g., untranslatable form, language I cannot experience) | Yes: Skip to Step 5. No: Proceed to Step 2. Unclear: Treat as "No." | Proceed to Step 2. | Judgment (You) | Overestimating your ability to "simulate" the experience (e.g., assuming you’d "get" a novel in verse). |
  | 2 | Are there *specific, checkable negative claims*? (e.g., "plot breaks on p. 200," "prose collapses in Act 3") | Yes: Flag for sampling; note page/chapter. No: Proceed to Step 3. Unclear: Treat as "No." | Proceed to Step 3. | Fact (You) | Missing a verifiable flaw; mistaking vague criticism ("dull") for checkable claims. |
  | 3 | What is the *aggregate verdict*, weighting calibration? | Use calibration-weighted scoring:<br>- Calibrated reader: +2 (rave), -2 (pan)<br>- Uncalibrated: +1 (rave), -1 (pan), 0 (lukewarm)<br>Sum scores: ≥+3 (Strong Positive), +1/+2 (Positive), 0 (Mixed), ≤-1 (Negative). Proceed to Step 4. | N/A | Judgment (You) | Overweighting calibrated readers; ignoring conflicting signals. |
  | 4 | What *reading level* is warranted? | - **Strong Positive** + **no checkable negatives**: Read WHOLE.<br>- **Positive** + **checkable negatives**: SAMPLE.<br>- **Mixed**: SAMPLE.<br>- **Negative**: NOT.<br>- **Strong Positive/Positive** but inaccessible (from Step 1): NOT. | N/A | Judgment (Chair approves allocation) | Assigning WHOLE to books with unverified flaws; ignoring length (e.g., 900 pages). |
  | 5 | For books NOT read whole: Can I *sign* based on reports? | - **Inaccessible** + **Strong Positive** + **fit-heavy claims**: QUALIFIED.<br>- **Not inaccessible** or **no Strong Positive** or **experience-heavy claims**: NO.<br>- **SAMPLE books**: Reserve judgment until sampling. | Advance only if QUALIFIED; else reject. | Judgment (You, but Chair approves shortlist) | Signing based on experiential claims ("feels like...") for inaccessible books. |

  **Stop Points**:  
  - Stop after Step 4 for WHOLE books (no Step 5 needed).  
  - Stop after Step 5 for NOT books (decision final).  
  - SAMPLE books loop back after sampling (re-run from Step 3 with sample findings).  

