  Looking at their points, point 5 about information value might be the weakest. The regress problem and favoring small, fast projects could be significant issues. Also, the fungibility discount in point 3 does seem distinct from neglectedness since it's about counterfactual funders' actions, not just how many are already funding. Durability in point 4 is separate from importance because it accounts for the time dimension of benefits, not just magnitude. 

  For defending ITN, the best argument is that it avoids false precision. The user's model requires data that's hard to get, and ITN's simplicity prevents overconfidence in subjective estimates. Their marginal value framing assumes quantifiable inputs, which might not be available, leading to inaccurate outputs.

  The user might have deeper needs. They're frustrated with unproductive arguments and want a more effective process. But they might also need buy-in from colleagues attached to ITN. So, the critique should highlight practical challenges in implementing their proposal, which could hinder adoption.

