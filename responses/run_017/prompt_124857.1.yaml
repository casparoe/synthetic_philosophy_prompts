  ### Part One: Dissecting the Conditions
  The strategy-stealing argument relies on six core conditions. For each, I outline its role, a minimal failure setting, and the impact on the argument. Failures are classified as **collapse** (the conclusion is invalid and the argument fails outright) or **degradation** (the conclusion weakens but might hold in a limited form; here, all failures cause collapse).

  1. **Symmetry**  
     - **Role**: Ensures the first player can execute the second player's strategy from the opposite role.  
     - **Failure setting**: A 2-move asymmetric game. Players A and B; A wins if the total moves sum to an even number, B wins if odd. Player A moves first. If A moves (e.g., "1"), B moves "1" and wins (sum=2, even → A wins? Wait: define clearly). Revised: Moves are integers. After A's move, B moves. Win condition: B wins if the sum is odd; else A wins. A moves first: if A plays 1, B plays 1 (sum=2 even → A wins? Not symmetric). Truly symmetric example: Players are indistinguishable, but win conditions depend on seat. Fixed roles: "First" and "Second" are asymmetric positions. Minimal setting: One move total. First player moves; if they choose left, they win; if right, they lose. Second player never moves. This is symmetric only if roles are swapped, but roles are fixed. Without symmetry, the first player cannot copy the second player's strategy.  
     - **Failure impact**: Collapse. The argument cannot start, as the stolen strategy is inapplicable. A defender concedes this: symmetry is fundamental.

  2. **Draw-freeness**  
     - **Role**: Guarantees that if the second player lacks a winning strategy, the first player must have one.  
     - **Failure setting**: Tic-tac-toe. Symmetric, perfect-information, but draws are possible with optimal play. The strategy-stealing argument would imply the first player wins, but they do not (it's a draw).  
     - **Failure impact**: Collapse. Without draw-freeness, "second player has no winning strategy" does not imply "first player wins"; it could be a draw. A defender concedes this: draw-freeness is necessary for the contradiction.

  3. **Surplus-inertness**  
     - **Role**: Allows the first player to treat the extra move as inert (never harmful), enabling the stolen strategy to work.  
     - **Failure setting**: A 2-move game. Players alternate; the player who takes the second move loses (like a reverse Kayles). Symmetric, draw-free. Second player wins: if first player takes move 1, second player forces first player to take move 2 and lose. Surplus-inertness fails because an extra move (taking move 1) is harmful (it enables the opponent to force a loss).  
     - **Failure impact**: Collapse. The argument fails (the first player cannot make an arbitrary move without risking harm), and the conclusion is false (second player wins). A defender concedes this: surplus-inertness is load-bearing.

  4. **Role-symmetric simulability**  
     - **Role**: Ensures a strategy designed for one seat (e.g., second player) can be executed from the other seat after the extra move.  
     - **Failure setting**: A game with turn-dependent actions. Players choose numbers; second player wins if their number is higher. But the first player must move first, and the second player's strategy (e.g., "always play 1 higher than the opponent") requires seeing the opponent's move first. After the first player's arbitrary move, they cannot execute this strategy because they must move before the second player.  
     - **Failure impact**: Collapse. The stolen strategy is unexecutable. A defender concedes this: simulability is required for copying.

  5. **Determinacy**  
     - **Role**: Ensures one player has a winning strategy, so "second player has no winning strategy" implies "first player wins."  
     - **Failure setting**: An infinite game without determinacy. Example: Players alternate stating bits; player 1 wins if the sequence encodes a proof in ZFC of 0=1. Symmetric, no draws, surplus-inert (extra bits don't hurt), but not determined (outcome depends on unresolved math).  
     - **Failure impact**: Collapse. Without determinacy, the argument's conclusion doesn't follow. For finite games (determined by Zermelo's theorem), this holds, but the generalization fails. A defender concedes this for non-determined settings.

  6. **Two-sidedness**  
     - **Role**: Ensures no third-party interference; the game is purely between two symmetric players.  
     - **Failure setting**: A three-player symmetric game with no draws. Players A, B, C; each writes a number; the highest unique number wins. If A moves first, B second, C third, C often wins by undercutting. The strategy-stealing argument fails because copying B's strategy (designed for two players) doesn't account for C.  
     - **Failure impact**: Collapse. The stolen strategy is ineffective against multiple actors. A defender concedes this: the argument assumes exactly two sides.

  ### Part Two: Subtle Failure Modes
