  7. **Informational harm**: This is a form of surplus-inertness failure. Fatal. Conceded.

  8. **Parity effects**: Also a form of surplus-inertness failure. Fatal. Conceded.

  9. **Fitted response**: Not fatal. Defender would say this is a misdescription: the strategy is defined for all histories and should work.

  10. **Bounded rationality objections**: The claim is in-principle, so these are irrelevant. Defender would treat as misdescription.

  ## Part Six: Immunity to bounded rationality

  The claim is in-principle: it says a winning strategy exists for the first player, not that anyone can find or execute it. Therefore, bounded rationality is not an objection.

  But is this immunity defensible? Yes, because the claim is about the structure of the game, not about the players.

  However, for the corollary (that a follower's lead must be due to deficit of play), if the first player could have played better but didn't due to bounded rationality, then the corollary holds: it's a deficit of play. But if the game hasn't been solved, we might not know.

  The in-principle qualification might make the position unfalsifiable in practice? Because we can always blame the first player's play. But in principle, if we could solve the game and see that even with optimal play the first player cannot win (and the second player wins), then we would know surplus-inertness fails. But the strategy-stealing argument says that cannot happen. So the position is not unfalsifiable by empirical observation of game outcomes per se, but by the structural conditions. If we observe a second player win in a game that we have independently verified as symmetric, draw-free, and surplus-inert, then we have a contradiction. But we can always reexamine the surplus-inertness.

  Therefore, the position is not unfalsifiable in principle: we can check the conditions and then check who wins. But in practice, for complex games, we might not be able to.

  For the purpose of arguing that an observed advantage is not structural, the position provides a reason to attribute the advantage to play rather than structure, as long as the conditions hold. The limitation is that we must be confident about the conditions.

