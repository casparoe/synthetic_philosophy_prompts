  ## The Immaterialist Imperative: Why Berkeleyan Metaphysics Demands Monetary Nominalism

  Your friend's metallist resistance is understandable but ultimately untenable within Berkeley's immaterialist framework. The core error lies in clinging to *any* notion of mind-independent grounding for value or scarcity, even a "robust regularity." Immaterialism doesn't merely reinterpret the natural-versus-conventional contrast; it dissolves the metaphysical foundation upon which the metallist distinction rests, leaving nominalism as the only coherent monetary theory for the Berkeleyan. Here's the structured case:

  **1. The Metallist Premise Undermined: Substance Dualism Collapses**
  The metallist position fundamentally relies on **substance dualism:** the belief that physical matter (gold) possesses properties (scarcity, utility) *independently of being perceived or conceived*, granting it a value-basis prior to and outside convention. For the metallist, gold's scarcity is a brute fact about the "world-out-there," making it a uniquely suitable anchor. Immaterialism explicitly denies this premise. If "to be is to be perceived" (or perceived by God), then *there is no "matter" independent of mind*. Gold's "physical properties," including its perceived scarcity, are simply *ideas* sustained in a regular order by the Divine Mind. Crucially, this regularity *is* the only reality; there is no deeper, mind-independent stratum wherein "real scarcity" resides. **The metallist's "robust regularity" of gold's supply isn't a *contrast* to conventional scarcity; it *is* a divinely sustained convention.** Berkeley’s Query 23 attacks the very notion of "intrinsic value" precisely because it smuggles in this illicit concept of mind-independent substance. Denying matter *is* denying the ontological basis for the metallist's "natural scarcity."

  **Steelman Rebutted: Robustness as Difference?**
  Your friend contends that the divine regularity of gold’s supply is *robust* in a way human conventions are not, making it a valid anchor. While there’s a *phenomenological* difference in perceived stability (gold feels reliably scarce; paper can be printed), this is a difference of *degree, not kind*, ontologically. From the immaterialist perspective:
  *   **Both are Divine Conventions:** Gold's supply regularity is maintained by God's will, just as the rules governing a national bank or a cryptocurrency are (in Berkeley's view, ideally) maintained by divinely guided human institutions acting within the divine order of ideas.
  *   **No Fallback "Nature":** The robustness doesn't point to a mind-independent nature; it points only to the *consistency* and *predictability* of the divine will *as experienced*. If God willed gold to rain from the sky tomorrow (a logical possibility within immaterialism), its "robust scarcity" would vanish instantly. Its stability isn't inherent, it's granted.
  *   **Cryptocurrency Clarifies:** Your friend argues crypto's scarcity is "only" agreed enforcement, while gold's is natural. But for Berkeley, crypto's algorithmic scarcity *is* a complex, human-created regularity within the divine order. Its "hard cap" functions as a *rule* enforced by code and consensus – a rule whose perceived stability might rival or even exceed that of gold (which suffers mining booms, technological disruption). Ontologically, both scarcities are *enforced patterns of ideas*. The crypto token isn't a "worse" counter than gold; it might be a *purer* instantiation of Berkeley's "ticket," explicitly embodying the conventional, rule-based nature of value-denomination (Query 25) without the misleading illusion of intrinsic "stuff-ness" that gold projects. Its value arises solely from its agreed-upon function within a system, unburdened by metallist superstition.

  **2. The Anchor Replaced: Teleology, Not Matter**
  This leads to the debasement objection: Without a physical anchor, what prevents the sovereign from minting infinite tickets, destroying value and order? Berkeley's nominalism *does* provide constraints, but they are **teleological and ethical**, not physical. Money, as a "ticket" or "counter" (Query 23, 25), is an *instrument*. Its purpose isn't to store intrinsic value but to facilitate exchange, industry, public credit, and ultimately, human flourishing under God.

  *   **Value from Proportion:** Query 23 links value to "the proportion of demand and plenty." Issuing tickets without regard to the *real productive capacity* and *needs* of the economy disrupts this proportion. Flooding the system counters doesn't create more goods/services ("plenty"); it simply dilutes the purchasing power per ticket relative to demand.
  *   **Credit & Industry:** Berkeley’s concern for credit and industry provides the normative anchor. Credit represents trust in *future productivity*. Indiscriminate issuance destroys this trust by signaling a disregard for the real foundations of value (productive labor, goods) that the tickets merely represent and facilitate. It violates the *purpose* of money as a tool for virtuous industry and public benefit.
  *   **Divine Order & Prudence:** The sovereign operates within the divine order. Prudent monetary policy – ensuring the supply of "counters" aligns with the productive capacity and needs signified by "demand and plenty" – is a duty. It maintains social harmony, fosters virtue through industry, and upholds the public trust, all reflections of divine will. The constraint isn't the *weight of gold* but the *weight of responsibility* to uphold the system's functionality and divine purpose. Berkeley's proposed national bank, backed by land (a productive asset representing real wealth potential), exemplifies this: its note issue wasn't anchored in metal's intrinsic value but in the *potential productivity* of the land and the *prudence* of the institution managing it.

  **Conclusion: Nominalism as the Necessary Corollary**

  Immaterialism doesn't just *permit* monetary nominalism; it *demands* it. By eliminating the metaphysical possibility of mind-independent substance, Berkeley destroys the only foundation upon which metallism can stand – the belief in intrinsic, matter-derived value. The "natural scarcity" of gold is revealed as merely another divinely sustained regularity within the ideal order, ontologically indistinguishable in kind from the conventional scarcity enforced in a well-managed paper system or even a cryptocurrency. The contrast between "natural" and "conventional" scarcity collapses into a continuum of perceptual stability within the divine economy of ideas.

  Therefore, the Berkeleyan *must* embrace money as pure "ticket or counter." Its value is constituted solely by its function within a system of conventions (divine and human) governing exchange, credit, and the representation of the divinely-ordained proportion between demand and plenty. The constraint on issuance isn't a non-existent material anchor, but the teleological imperative to align the supply of these counters with the real productive capacity of the community and the ethical imperative to maintain trust, industry, and public order under God. Berkeley's economic writings in *The Querist* are not merely compatible with immaterialism; they are its logical and necessary monetary expression. The metallist, denied the fallback of mind-independent nature or substance, has no coherent position left within the Berkeleyan universe. Nominalism wins by metaphysical necessity.
