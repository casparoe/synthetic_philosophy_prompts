  First, I need to recall the core elements of the debate. The user defines metallism as money having intrinsic value from physical properties, while nominalism sees money as conventional tokens. Berkeley's Querist clearly favors the ticket/counter view. The challenge is to show this isn't just compatible with immaterialism but required by it.

  Hmm, the key fragility points the user raises are important. First, whether immaterialism allows any meaningful distinction between natural scarcity (like gold) and conventional scarcity (like cryptocurrency). Second, how nominalism can prevent irresponsible money printing if there's no physical anchor. 

  I should start by identifying what exactly metallism relies on that immaterialism rejects. Metallism needs substance dualism - that matter exists independently and gives value. But Berkeley denies this, making any "intrinsic value" claim incoherent. Without mind-independent matter, scarcity can't be a brute fact about gold; it's just divinely maintained regularity, no different in kind from conventional rules.

  For the natural vs conventional contrast - it doesn't disappear but becomes degrees of perceptual stability. Gold's scarcity feels more fixed because God sustains it consistently, while human conventions are more mutable. But ontologically, both are ideas. This means cryptocurrency's scarcity isn't fundamentally different - its algorithmic rules create perceptual stability similar to gold's.

  The debasement objection is trickier. Berkeley can't use physical limits, but his nominalism offers something better: economic teleology. Money isn't about storing value but facilitating industry and virtue. So constraints come from money's purpose - issuing tickets should align with productive capacity and public benefit. This actually gives stronger normative guidance than metallism's arbitrary physicalism.

  I need to steelman the metallist position properly. Their best argument is that regularities differ - gold's scarcity is cosmically stable while conventions are fragile. But Berkeley can counter that God could change gold's regularity too; what matters is the functional role within the divine order. Cryptocurrency then becomes a purer example of Berkeleyan money because its scarcity is explicitly conventional yet perceptually stable.

  The conclusion should be bold: immaterialism doesn't just allow nominalism but demands it, and provides superior ethical constraints for monetary policy. The physical anchor is replaced by purpose-driven norms.
