prompt: |-
  I'm a backend dev, no philosophy training whatsoever, so apologies in advance if I'm describing something that has an obvious textbook name -- though that's kind of the question.

  I keep noticing the same shape in really unrelated places and I want to know whether it's been picked out and named before, because right now the only way I have of talking about it is my own clumsy version.

  The shape: a system -- animal, program, person, whatever -- has a set of routines it can run. Which routine gets started next is genuinely sensitive to the situation: different situation, different routine, and it can still change course right up until the moment the routine starts. But once a routine has started it runs to completion no matter what. If the world changes halfway through in a way that makes the routine pointless or actively bad, the system keeps going anyway. And it's not that it fails to notice -- it's that nothing it notices can get any grip until the routine finishes. Then it's flexible again, picks the next routine, and goes rigid again. All the flexibility is at the seams; all the rigidity is inside the blocks.

  Three places I see it:

  - The thing I half remember from a pop-science book I read years ago. A digger wasp drags its paralyzed prey to the burrow, leaves it at the entrance, goes inside to check the burrow, comes back out, drags the prey in. If you move the prey a few inches while she's inside, she comes out, drags it back to the entrance, leaves it, goes in to check again -- and you can apparently keep doing that to her. I genuinely can't vouch for the details, so don't hold me to them; the point is the shape. She can "reconsider" at the entrance and not mid-sequence.

  - My own code, which is where I started thinking about this. I've got a job runner where jobs are made of stages. Between stages the job re-reads config, and a scheduler can cancel it, reroute it, reorder the remaining stages. Inside a stage it's completely non-preemptible -- no signal, no cancel, no partial rollback, the stage either finishes or the whole process dies. Increasingly I think of the "intelligence" of that system as living entirely in the gaps between stages, and I have no idea whether that's a deep observation or just a fact about my implementation.

  - Me, annoyingly. I can deliberate about whether to start explaining something in an argument, and I can deliberate after each sentence about whether to keep going, but once I've started a sentence I finish it -- even in the cases where I realize halfway through that it's wrong. I finish the sentence and then correct it, every single time. Same with a bunch of other things I won't bore you with.

  So:

  1. Does this configuration -- flexible at the seams, rigid inside the blocks -- have a name of its own? I have a vague memory that there's a word for the wasp case specifically, but as far as I understand it that word just means "rigid routine," and it doesn't seem to cover the part I find interesting, which is that the very same system is flexible elsewhere.

  2. The part I actually care about. I keep loosing an argument with a friend about whether this shape is compatible with doing something freely, or whatever the right phrasing is. She says: sure, the wasp is mechanical, but a creature that can select which routine to run, and re-select at every seam, is not mechanical -- that just is what deliberating is. I say: that only moves the mechanism up one level, because whatever does the selecting at the seam is itself either running a routine or it isn't, and if you add another layer of flexible selection on top of that you get exactly the same question again. Neither of us can say what would even settle it. Is there an established name for this disagreement? Is there an established account of what you'd have to add to "flexible selection over rigid routines" to make it stop being mechanical -- or an established argument that nothing you could add would ever be enough?

  3. Boundary cases, because if I get a definition I want to know what it excludes. (a) A system with exactly one seam, right at the start, deterministic after that -- a pocket calculator, basically. (b) A system whose seams arrive at random times rather than when the situation calls for one. (c) A system that can be interrupted by anything at all but has exactly one fixed response to any interruption. (d) A system where the seams are real but the blocks are a millisecond long. Which of these are the same phenomenon as what I described and which aren't, and what's the principled difference?

  If there genuinely isn't a name for it, then coin one and define it, and say what falls outside. Please don't just hand me the word for the wasp thing and stop -- a name that only covers the rigidity and ignores the seams is definately not what I'm after, and I'll be able to tell if that's what I got.
reasoning: |-
  Okay, the user is a backend developer who's noticed a recurring pattern in various systems—like a digger wasp's behavior, their own job runner code, and even human actions—where decision-making is flexible between rigid routines but inflexible during their execution. They want to know if this pattern has a name, whether it's compatible with "free will," and how to distinguish it from boundary cases.

  First, I need to address each of their questions. The pattern they describe seems to match hierarchical control systems, especially with finite state machines. For the wasp, it's a fixed action pattern, but that doesn't cover the flexibility at transition points. Terms like "modular decomposition" or "reactive planning" come to mind. I should synthesize these into a cohesive term.

  Next, their debate about free will versus determinism. The user is stuck in a regress argument: adding layers of selection doesn't escape mechanism. Compatibilism might be relevant here—where freedom is about responsiveness to reasons, not lack of determinism. Highlighting that the seams allow for deliberation based on inputs could align with compatibilist views.

  For the boundary cases, I need to clarify which scenarios fit the pattern. A pocket calculator (single seam) is included as a degenerate case. Random seams might not fit if they're not context-sensitive. Fixed responses to interruptions are different because they lack flexibility at transitions. Millisecond blocks might still qualify if the structure remains, but the user might see it as too granular.

  I should ensure the coined term emphasizes both rigidity and flexibility. "Seam-Rigid Modularity" or "Gapped Rigidity" could work, defining the seams as decision points. Also, explaining why certain cases are excluded will help the user apply the concept accurately.

  The user's deeper need seems to be understanding if their system design reflects a fundamental structure in nature and cognition, and resolving the philosophical debate with their friend. Providing clear terminology and philosophical context should address both their practical and theoretical concerns.
answer: |-
  What you're describing is a profound and pervasive pattern that cuts across biology, computation, and cognition. You've identified it clearly: **flexible, context-sensitive decision-making *between* rigid, uninterruptible execution blocks.** This has indeed been studied under several names, but none perfectly capture the duality you emphasize. Here's the breakdown:

  ### 1. The Name(s) for the Pattern
  *   **Best Established Fit: Hierarchical Control / Finite State Machines (FSMs) with Atomic Actions:** This is the closest established framework. Your system is a **state machine** where:
      *   Each "routine" or "stage" is a **state**.
      *   Transitions **between** states (the "seams") are where deliberation, sensing, and context-sensitive decision-making happen.
      *   While *in* a state, the system executes an **atomic action** or **fixed action pattern** – it runs to completion without interruption based on new external inputs *during* execution.
      *   This is hierarchical because the "intelligence" resides at the higher level of state transition logic.
  *   **Specific Terms & Why They Fall Short:**
      *   **Fixed Action Pattern (FAP):** This *is* the term for the wasp's rigid routine (like dragging prey). Its limitation: It *only* describes the rigid block, ignoring the flexible transition logic *between* FAPs. It doesn't capture the system-level interplay you see.
      *   **Atomicity/Transactionality:** From CS, this describes the "run to completion" property of the blocks ("all or nothing"). But it doesn't inherently describe the flexible deliberation *between* atomic units.
      *   **Subsumption Architecture (Brooks):** In robotics, this involves layers of competence, where higher layers can suppress inputs/outputs of lower layers. It has rigidity within layers and flexibility at interaction points, but it's more about parallel behaviors competing than sequential atomic blocks.
      *   **Reactive Planning / Situated Action:** Emphasizes action selection based on immediate context (like your seams), but often allows for more interruption *during* execution than your rigid blocks imply.
  *   **Your Coinage (Emphasizing the Duality):** Since existing terms lean towards *either* the rigidity *or* the flexibility, I propose **"Seam-Rigid Modularity" (SRM)** or **"Gapped Rigidity"**.
      *   **Definition:** A system architecture where agency manifests exclusively in context-sensitive selection between discrete, uninterruptible modules ("blocks"). Intelligence resides at the transitions ("seams"), while execution within a block is deterministic and encapsulated.
      *   **Core Features:** Context-sensitive selection at seams; Atomic execution within blocks; No mid-block interruption based on changing context.

  ### 2. The Free Will/Mechanism Debate (Compatibilism vs. Incompatibilism Regress)
  You and your friend are replaying a classic philosophical argument:

  *   **Your Friend:** Argues for **Libertarianism (Incompatibilist Free Will)**: True freedom requires the ability to have done otherwise *at the point of choice*, and the flexible selection at the seams represents this genuine, non-mechanical deliberation. The seams are where "the self" acts.
  *   **You:** Argue for **Hard Determinism/Mechanism**: If the selection mechanism at the seam is itself a deterministic process (even a complex one involving weights, rules, randomness), then the *entire system* is mechanical. Adding layers just pushes the mechanism "up" without escaping it. This is the **"Homunculus Problem"** or **"Regress Argument"**: Explaining a complex decision-maker by positing a *smaller* decision-maker inside it just begs the question – what explains *that* one?
  *   **The Established Name:** This is the core tension between **Compatibilism** and **Incompatibilism** regarding free will.
      *   **Compatibilism:** Freedom is compatible with determinism. What matters is *how* the decision is made, not whether it's determined. For your system, a compatibilist would say freedom lies in the seam's ability to *responsively select* the next block based on *reasons* (current state, goals, inputs) in a non-coerced way. The rigidity of the block doesn't negate the freedom exercised at the seam. Your job runner *is* acting freely (for certain definitions of free) when it selects the next stage based on config and state.
      *   **Incompatibilism:** True freedom requires the ability to break causal chains (Libertarianism) or is impossible (Hard Determinism). You lean hard determinist: the seam selection, however complex, is just a mechanical process. Adding layers of selection doesn't create "true" freedom; it's just more complex machinery.
  *   **What Would Settle It?** Nothing empirically observable *can* settle it definitively. It depends on your **definition of "freedom"**:
      *   If freedom = **Exemption from Causation/Laws of Nature** (Incompatibilist view), then SRM systems (including humans?) are not free. Any selection mechanism is part of the causal web.
      *   If freedom = **Deliberative Responsiveness to Reasons** (Compatibilist view), then SRM systems *can* exhibit freedom *at the seams*. The wasp isn't free because its selection is too simple/brittle; your job runner has limited freedom; a human deliberating at a seam has significant freedom.
  *   **The Established Argument (The Regress):** Your point is correct and well-known. Adding layers of selection doesn't *inherently* break determinism. Compatibilists argue you don't *need* to break determinism for a meaningful concept of freedom; the complexity and reason-responsiveness at the seam *is* sufficient for agency. Incompatibilists argue this is just kicking the can.

  ### 3. Boundary Cases & The Principled Difference
  The core of SRM is the **combination** of *context-sensitive flexibility at transitions* and *execution atomicity within blocks*. The principled difference lies in **where agency/intelligence is allowed to manifest**.

  *   **(a) Pocket Calculator (Single Seam, Deterministic):** **SRM (Degenerate Case).** It has one seam (input reception/parsing/selection) followed by one rigid block (computation/output). The seam has context-sensitivity (interpreting the input). Intelligence is minimal but exists solely at the seam. Fits the pattern.
  *   **(b) Random Seams (No Context Sensitivity):** **NOT SRM.** If seams occur randomly, not triggered or informed by the situation, then the system lacks the *context-sensitive deliberation* at the transitions. This is just random interleaving of rigid blocks. The key feature (selection *based on state*) is missing.
  *   **(c) Single Fixed Interruption Response:** **NOT SRM (Or Very Limited SRM).** While it has potential seams (interruptions), the response is fixed. There's no *deliberation* or *choice* at the seam; it's just a hardwired reflex triggering *another* rigid block. If the "interruption" always triggers the same next action regardless of broader context, there's no genuine selection. If the interruption type *is* the context and triggers different fixed responses, it *might* be a very simple SRM with the interruption handler as the seam logic.
  *   **(d) Millisecond Blocks:** **SRM (In Principle).** The *structure* is identical: flexible choice at micro-seams, atomic execution within micro-blocks. Whether we call it "intelligent" depends on the complexity of the seam logic. A CPU's microcode operates this way. However, *functionally*, if blocks are this short, the system *approximates* continuous responsiveness – the rigidity becomes negligible. It blurs the line you're observing, but the architectural principle remains if the atomicity is enforced.

  **In Summary:**

  *   **Pattern:** Seam-Rigid Modularity (SRM) – Flexible, context-sensitive selection *between* atomic, uninterruptible execution blocks.
  *   **Debate:** You're replaying the Compatibilist (freedom in reason-responsive selection) vs. Incompatibilist/Hard Determinist (all selection is ultimately mechanical) argument about free will. Adding layers doesn't inherently resolve it; the debate hinges on definitions.
  *   **Boundaries:** SRM requires **BOTH** intelligent (context-driven) selection **AT** the seams **AND** atomic execution (no interruption) **WITHIN** the blocks. Cases lacking intelligent selection (b, c) or lacking atomic blocks aren't SRM. Short blocks (d) fit structurally but blur the functional rigidity. Single-seam systems (a) are a degenerate case.

  You've hit upon a fundamental architectural pattern in both natural and artificial systems. The fact that you see it in wasps, code, and your own cognition speaks to its deep utility in organizing behavior in a complex world. Your "clumsy" description was remarkably precise!
