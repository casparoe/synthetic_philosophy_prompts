prompt: |-
  I spent most of last night arguing with a friend about the 2006 International Astronomical Union decision in Prague, and I need a third party. The facts, so you don't have to rely on memory: Pluto was found in 1930 and was counted as the ninth planet for decades, though its mass turned out to be tiny; from the 1990s on, astronomers found more and more Kuiper Belt objects, and in 2005 Eris turned up, comparable to Pluto in size and mass. A 19-member IAU committee chaired by Iwan Williams had offered three candidate definitions — cultural (roughly, a planet is whatever enough people call one), structural (big enough to be rounded by its own gravity), and dynamical (big enough to have swept other bodies out of its orbital region). A separate committee chaired by Owen Gingerich produced a draft that would have kept Pluto a planet and treated bodies like it as a subcategory; it was voted down. What passed requires a body to orbit the Sun, be rounded by self-gravity, and have cleared its orbital neighbourhood — which Pluto fails, so it became a dwarf planet. Many planetary scientists rejected the outcome outright and still work with a geophysical definition instead. New Horizons flew past Pluto in July 2015 and returned images of a geologically complicated world, which did nothing to settle the argument.

  My friend is a deflationist about truth and thinks the case is a triumph for her view. Her claim: if the equivalence schema is all there is to truth, then nothing in 2006 was discovered about Pluto at all — the only question was which sentence the community should adopt — so the episode was a verbal dispute wearing the costume of an empirical one, and deflationism is precisely what lets us see that. I said that a theory whose only contribution is to reclassify a practice's central disputes as merely verbal is confessing, not explaining. I also pressed her on a case she couldn't handle: an astronomer says 'Pluto is a planet' in 1995, and says it again in 2008. Same speaker, same object, same non-linguistic facts, and yet something about the truth of what he says seems to have shifted. She said that just shows truth isn't the interesting notion here; I said that's the sound of a theory retiring from the field.

  So I want a proper two-way case analysis, not a survey of positions. First, a disciplined mapping: who the actors were (the committees, the IAU membership that voted, the planetary scientists who dissented, the textbook writers and planetarium curators and schoolchildren), what the actual options were, and what counted as evidence for each — orbital dynamics, mass and shape, population counts, pedagogical and cultural considerations. Then run the theory through it. Assume I already know the standard moves and vocabulary — disquotationalism, Horwich-style minimalism, prosententialism, blind ascription, the scope problem, the appeal to truth's expressive role, the norm-of-assertion and aim-of-belief objections — and don't recite them at me; deploy them. Specifically: (a) Say what you think about the 1995/2008 ascription, and what your answer costs. If the schema has to be relativized to times, speakers, or meanings to give an answer, does that relativization quietly reintroduce the substantive machinery about propositions, interpretation, and meaning that deflationism was supposed to make unnecessary — the kind of objection associated with Hartry Field, that thinness about truth is bought by paying for it in the theory of meaning — or is that just an honest division of labour between two theories? Take a side. (b) Consider the cultural candidate definition, on which a planet is a planet if enough people say it is. Had something like that been adopted, would the deflationist be committed to saying that the truth of 'Pluto is a planet' is constituted by a social fact, and is that a collapse into a consensus theory or only an apparent one? (c) Deal with the ascriptions that no amount of disquotation reaches — that what the 1995 textbook said was true, that everything the resolution implies about Pluto is true, that my childhood belief about the ninth planet turned out to be false. Say whether the expressive function deflationists invoke really covers them, or whether these ascriptions are doing explanatory work in the episode that a thin notion of truth cannot do. (d) Here is a distinction I invented in the argument and want tested rather than indulged: I called it a charter dispute — the parties agree on every non-linguistic fact, but the resolution fixes which concept an institution will charter, and in doing so changes what is true. Say whether deflationism can mark that distinction, or whether it must dissolve it, and whether dissolving it is a cost. Finish by telling me honestly whether the episode confirms deflationism, is an anomaly for it, or is a case it never anticipated — and, equally honestly, where the theory is simply silent and you refuse to make it speak.
reasoning: |-
  Okay, I need to unpack this user's query. They had a heated debate about Pluto's planetary status and the deflationist view of truth. The user wants a detailed analysis, not just a recap of positions. Let me start by mapping the actors and their evidence.

  First, the IAU committees: Williams focused on scientific criteria like orbital dynamics, while Gingerich's draft included cultural aspects. The voters chose the dynamical definition, excluding Pluto. Dissenting planetary scientists preferred geophysical definitions based on shape and geology. Textbook writers and educators had to adjust materials, showing the cultural impact. Evidence varied—dynamics from population counts, geophysics from New Horizons data, cultural from public sentiment.

  Now, the user's specific questions. For (a), the 1995/2008 ascription: A deflationist would say the sentence "Pluto is a planet" changed truth value because community usage shifted. But this requires relativizing to contexts, which might reintroduce meaning theory—Field's objection. If meaning is socially determined, maybe it's a division of labor. But it risks making deflationism dependent on a robust theory of meaning. 

  For (b), the cultural definition: If adopted, "Pluto is a planet" would be true if socially accepted. Deflationism treats truth as disquotation, so the social fact constitutes truth only in the sense that it's the condition for asserting the sentence. It avoids consensus theory collapse because truth isn't defined by consensus; it's about the linguistic rules in place. 

  On (c), blind ascriptions: Expressing "what the 1995 textbook said was true" relies on disquotation but points to a missing proposition. Deflationism handles this via prosentences or context, but it might not explain the cognitive shift. The expressive role works here, though it feels thin for explaining belief revisions. 

  For (d), charter disputes: Deflationism dissolves the distinction between factual and conceptual changes. The dispute is verbal because truth depends on adopted conventions. Dissolving this might be a cost if we intuitively see institutional decisions as changing facts, but deflationists argue that's a misperception. 

  Overall, the episode fits deflationism by showing truth as dependent on linguistic conventions. However, it highlights issues with meaning relativity and the theory's ability to explain conceptual changes. Deflationism is silent on why certain definitions are preferred, which might frustrate those seeking deeper explanations. The user's frustration with their friend's view is understandable—deflationism reclassifies disputes as verbal, which can feel dismissive. I need to present this honestly, admitting where the theory has limitations.
answer: |-
  Here's a disciplined case analysis, deploying deflationism directly against the Pluto episode, acknowledging costs and silences:

  **Actor/Evidence Mapping:**
  | **Actor Group**              | **Key Positions/Evidence**                                                                 | **Definition Favored**           |
  |------------------------------|-------------------------------------------------------------------------------------------|----------------------------------|
  | **Iwan Williams Committee**  | Orbital dynamics (KBO population density, resonance sharing), mass comparisons (Eris)      | Dynamical                        |
  | **Gingerich Committee**      | Geophysical complexity (potential for roundness, geology), historical continuity           | Structural (with "plutonian" subclass) |
  | **IAU Voting Members**       | Combination of dynamical evidence & pedagogical concerns (avoiding "50+ planets")          | Dynamical (adopted)              |
  | **Dissenting Planetary Scientists** | New Horizons geology (cryovolcanism, atmosphere), sphericity, hydrostatic equilibrium | Structural/Geophysical           |
  | **Textbook/Pedagogy Actors** | Clarity for students, memorability, cultural inertia vs. scientific currency              | Mixed adoption (cultural/dynamical) |

  **Deflationist Deployment:**

  **(a) The 1995/2008 Ascription & Its Cost**  
  *Deflationist Answer:* In 1995, "Pluto is a planet" expressed a proposition accepted under the operative linguistic conventions (implicit structural definition). By 2008, conventions changed via IAU resolution. The *sentence* "Pluto is a planet" in 2008 expresses a different proposition (requiring dynamical clearance) which is false. Truth-value shift reflects meaning shift, not planetary change.  
  *Cost:* This **requires relativizing the schema to linguistic contexts**. Deflationism *can* maintain thinness about truth only by **outsourcing the heavy lifting to a substantive theory of meaning** (how conventions fix reference, how resolutions alter semantic norms). Field’s objection hits hard: this exposes deflationism’s dependence on a non-deflationist theory of meaning/content determination. It’s not a clean division of labor but a vulnerability. If meaning is socially constructed and dynamic, deflationism survives but inherits meaning’s problems.

  **(b) Cultural Definition & Consensus Collapse**  
  Had the cultural definition been adopted, "Pluto is a planet" would be true iff sufficient people assert it. The deflationist **avoids collapse into a consensus theory of truth**. Truth remains disquotational: "Pluto is a planet' is true" *means* Pluto is a planet. The cultural fact is **not constituting truth**; it’s constituting the *application condition* for the *term* "planet." Truth is still thin – the social fact makes the sentence assertible, not "truly true" in a substantive sense. The deflationist distinguishes: *convention sets meaning*, *meaning + world sets truth*. Consensus defines "planet," not truth itself. Apparent collapse is illusory.

  **(c) Blind Ascriptions & Expressive Function**  
  - "What the 1995 textbook said was true": Deflationism handles this via **prosententialism** or **disquotation under past conventions**. "True" here avoids rearticulating complex historical content.  
  - "Everything the resolution implies is true": Acts as a **finite endorsement of infinite consequences** (e.g., "Pluto isn’t a planet," "Eris isn’t a planet," etc.).  
  - "My childhood belief was false": **Normative signaling** – rejects past belief-state under current standards.  
  *Explanatory Gap?* Deflationism covers the *expressive role* adequately. However, it **cannot explain why the belief revision *feels* substantive** or why New Horizons imagery fueled dissent. The "falseness" of the childhood belief stems from linguistic change, but the phenomenology suggests discovering a *worldly* error. Deflationism dismisses this as confusion, which is a cost for those experiencing the dispute as empirical.

  **(d) Charter Disputes: Dissolution or Distinction?**  
  Deflationism **necessarily dissolves your charter distinction**. The dispute *is* verbal because:  
  1. All parties agree on non-linguistic facts (Pluto's mass, orbit, KBO density).  
  2. The IAU resolution altered semantic conventions ("planet" now requires orbital clearance).  
  3. Truth-value changes follow from (2).  
  *Cost of Dissolution:* It **undermines the intuition that the IAU 'changed Pluto's status'** based on new evidence. Deflationism reframes this as "changed our label's meaning." For scientists invested in the *worldly* significance of "planet" (e.g., as marking geophysically active bodies), this feels reductionist. Deflationism struggles to explain why the choice *mattered* beyond semantics – it cannot accommodate "institutional chartering" as a metaphysically distinct act.

  **Verdict on Deflationism & the Episode:**  
  - **Confirms Deflationism** in showing truth's dependence on linguistic convention and the resolvability of the dispute by semantic decision. The core mechanics of truth-value change align with meaning shift.  
  - **Anomaly for Deflationism** in exposing its **helplessness against phenomenology**: Dissenting scientists aren't *merely* protesting a label but defending a geophysical category they believe carves nature better. Deflationism cannot explain this realism without smuggling in substantive truth.  
  - **Silences:** Deflationism has **nothing to say about:**  
    - *Why* dynamical over structural definition was chosen (pedagogy vs. science? power dynamics?).  
    - The *normative force* of the IAU resolution for non-astronomers.  
    - Whether "dwarf planet" is a *better* category for scientific progress.  
    It refuses to engage whether "planet" *should* track orbit or geology – that’s beyond truth, in pragmatics or metaphysics.

  **Conclusion:** The episode is a **qualified win for deflationism** on technical grounds (truth-value change via meaning shift) but a **pragmatic failure**. It correctly diagnoses the dispute as verbal but cannot account for why it *felt* substantive or why the outcome provoked outrage. By reducing the conflict to semantics, it dismisses the underlying scientific realism driving dissent – a cost for those who see truth as more than disquotation. Your friend is right on the letter, but your instinct about "confessing, not explaining" hits the theory's weakness: it reclassifies the dispute but offers no resources to understand its heat or resolution.
