  Applying this to "The Prestige": Angier's duplicates appear instantly across the theater, and the original drowns. The film doesn't dwell on the moral weight of this, focusing instead on sacrifice and deception. The duplicate behaves identically to Angier, so from the outside, it's indistinguishable. Functionalism would say the duplicate is a full person because it functions identically. But if consciousness requires continuity or biological substrate, then the duplicate is just a copy without moral status.

