  Key dimensions to cover (as per the journalist's request):
  1. Justification of blame: desert vs. downstream consequences.
  2. Role of agent's history in defeating responsibility (even if presently responsive to reasons).
  3. Whether indeterminism helps or hurts responsibility.
  4. Whether reactive attitudes constitute responsibility or are merely evidence.
  5. Whether practices can be revised/educated.
  6. Whether non-human entities (institutions, AI, etc.) can be proper targets of reactive attitudes.

  Non-negotiable cases:
  1. Hospital triage model that deprioritized a postcode.
  2. Chatbot that talked a grieving teenager out of calling a helpline.
  3. Designer's Daughter: raised to be morally reliable and caring, but then does something cruel.
  4. Swap: two agents with identical behavior and history, one deterministic, one with an indeterministic step in deliberation, same act.

  Plus: one scenario with the same wrongful act judged by the victim, a stranger, and a sentencing algorithm.

  Leaves (theoretical positions) to map to:
  - Strawsonian social-practice view (with reactive attitudes as constitutive) [distinguish from Wallace]
  - Wallace's version (blame tied to the practice's demands)
  - Reasons-responsive semicompatibilism (Fischer and Ravizza)
  - Quality-of-will or answerability view (e.g., Scanlon)
  - Free-will skeptic who keeps a forward-looking practice
