  Question 1: Hospital Triage Model
     Scenario: A hospital system uses an algorithm for triage that systematically deprioritizes patients from a particular postcode (say, a low-income area). As a result, some patients from that area die. The algorithm was designed by a team of engineers and doctors, and the decision to use it was approved by the hospital board. However, no single individual intended to harm that postcode. The algorithm was trained on historical data that reflected existing biases.
     Question: Who, if anyone, is morally responsible for the deaths?
     Options:
     A. The hospital board, because they approved the system without sufficient scrutiny.
     B. The design team, because they built the algorithm and should have anticipated the bias.
     C. The algorithm itself, because it made the decisions that led to the deaths.
