prompt: |-
  I sit on the technical review panel for a programme that funds field trials of genetically engineered organisms for vector control and agricultural pest suppression. Nearly every proposal we read runs the same risk: the case for release is argued at the level of the construct or the gene — a transmission advantage, a super-Mendelian inheritance bias — while the risk assessment is argued at the level of the local population or the host–symbiont system: persistence, collapse, spread beyond the release site. When the two lines of argument point to different outcomes, we have no principled way to decide which to act on, or what we would have to measure in a two-year monitoring window to find out. What we need, then, is not another position in the units-of-selection debate but a specification: what a theory of the units of selection would have to be able to do in order to be adequate for this job — planning and auditing deliberate releases into evolving systems we cannot fully control.

  Please write that specification. Keep adequacy tied to that purpose throughout, and build it around the cases a theory would have to get right, including at least these:

  - A construct with a large within-population transmission advantage whose spread lowers the productivity or viability of the groups it invades, up to local extinction. Gene-level and group-level descriptions give different expectations here, and the theory has to tell us what to bet on, not merely how to redescribe what happened.
  - An engineered symbiont in a host–microbiome system, where heritable material moves horizontally between lineages and parent–offspring relations are not tree-like. There is no obvious answer to what the replicating unit is, and the theory has to say something actionable rather than treating this as a degenerate case.
  - A release design in which groups happen to be composed of relatives, so that the same predicted outcome can be laid out either as kin selection or as selection between groups.
  - A organism that modifies the environment in which it is selected, so that what a decomposition treats as the fixed environmental background is partly a product of the population's own heritable traits.
  - A system in which the lower-level units progressively lose the capacity to reproduce independently over the timescale of interest, so that the status of a candidate unit is itself something that changes rather than something given in advance.
  - The general worry that any observed outcome can be retrofitted to some level or other. We have to commit to measurements before we know the outcome, so the specification must say what makes a level claim testable in advance and what would count as it failing.

  For each requirement, give the case or consideration behind it, and mark it as non-negotiable or as the preference of a particular camp. Say which distinctions a candidate theory must respect and which are spurious — for instance between a replicator, an interactor, and a beneficiary; between selection of a unit and selection for a trait; between selection acting at a level and selection at that level being the strongest; between being a unit of selection and being the bearer of an adaptation; between a causal claim and a bookkeeping decomposition that is mathematically equivalent to another. If some subset of the requirements cannot be jointly satisfied — maximal generality across substrates versus testability with noisy field data, say, or refusing to presuppose a hierarchy of levels versus being able to say which partition is the real one — flag that explicitly, since a list that turns out to be internally unsatisfiable is itself the result I most want. Then name the single requirement that does the most work in excluding otherwise popular theories, and explain why.

  End, if it is cheap to do so, with a short table scoring gene-level selectionism, multi-level selection, and inclusive-fitness approaches against the list; the criteria and their motivating cases are the deliverable, not the scoring. Please do not give me a literature review, a reading list, or citations — I want the specification itself, written so that a regulator who is not a population geneticist could follow which requirements are doing real work.
reasoning: |-
  Okay, the user is part of a technical review panel for funding field trials of genetically engineered organisms. They're frustrated because proposals argue the case for release at the gene/construct level (transmission advantages) but assess risks at population/system levels (persistence, spread). When these conflict, there's no principled way to decide. They need a specification for what a theory of units of selection must do to be adequate for planning and auditing releases.

  Hmm, this is a deeply practical problem about bridging theoretical frameworks with real-world regulatory decisions. The user isn't asking for another academic debate - they need actionable criteria to evaluate risks in evolving systems. Their examples reveal key pain points: conflicts between selection levels (gene vs group), horizontal transfer in microbiomes, kin/group equivalence, niche construction, evolving unit status, and the retrofitting problem.

  The core tension seems to be between prediction and post-hoc explanation. Regulators need to commit to monitoring protocols before release, so the theory must generate testable pre-release predictions. That immediately rules out many popular frameworks that are better at redescribing outcomes than forecasting them.

  Let me break down their six required cases. First is the gene-group conflict - where a selfish genetic element spreads while harming groups. Any adequate theory must resolve which level dominates outcomes, not just note the tension. Second is the microbiome challenge with horizontal transfer - we need to define replicating units without relying on vertical inheritance. Third is the kin/group equivalence case - the theory shouldn't get distracted by mathematical reducibility when operational predictions matter. 

  Fourth is niche construction - the theory must handle when the "environment" is actually shaped by the organisms themselves. Fifth addresses evolving unit status (like obligatory symbionts) - the framework must accommodate units that gain/lose independence during the trial. Sixth is the retrofitting problem - the biggest hurdle where theories must forbid after-the-fact level assignment.

  The non-negotiable requirements emerge clearly: predictive power over explanatory elegance, handling changing unit status, rejecting level-hopping explanations, and operational testability. The microbiome and evolving unit cases will likely exclude rigid hierarchical theories, while the retrofitting requirement challenges gene-centric views that can always explain outcomes post-hoc.

  I suspect the niche construction case (#4) does the heaviest lifting by forcing the theory to abandon the fixed environment assumption - a core premise in many selection models. Without this, predictions in engineered systems will always be brittle.

  For the comparative table, I'll focus on how each major framework (gene-level, multi-level, inclusive fitness) handles the six cases at the operational level a regulator would care about. The key is showing where they fail the adequacy test - like gene-level approaches stumbling on group collapse predictions, or inclusive fitness struggling with horizontal transfer.
answer: |-
  ## Specification for an Adequate Theory of Units of Selection for Deliberate Release Risk Assessment

  **Purpose:** To provide a *practical, predictive framework* for planning field trials & auditing releases of genetically engineered organisms (GEOs) into evolving ecosystems. The theory must resolve conflicts between arguments at different biological levels (gene, individual, group, system) *before release* and specify *testable predictions* for post-release monitoring within a limited (e.g., 2-year) window. Adequacy is tied *solely* to this purpose.

  **Core Requirements & Their Motivations (Non-Negotiable Unless Marked):**

  1.  **Resolve Gene-Group Conflict Predictively:**
      *   **Case:** Construct with strong within-population transmission advantage that *reduces group productivity/viability*, potentially causing local extinction (e.g., a costly gene drive in a vulnerable population).
      *   **Requirement:** The theory MUST predict the dominant outcome (e.g., spread + collapse, spread without collapse, containment) in advance. It cannot merely describe the conflict or offer post-hoc redescriptions. It must specify pre-release measurements to distinguish likely trajectories (e.g., initial transmission rate vs. group fecundity decline rate).
      *   **Distinctions:** *Must Respect:* Causal strength of selection *at* different levels *within the specific system*. *Spurious:* Equating the *existence* of gene-level selection with the *irrelevance* of group-level consequences for the prediction.

  2.  **Define Actionable Replicating Units in Non-Treelike Systems:**
      *   **Case:** Engineered symbiont in a host-microbiome system with extensive horizontal gene transfer (HGT), blurring lineages and parent-offspring relationships (e.g., engineered gut bacterium).
      *   **Requirement:** The theory MUST operationally define the "replicating unit" relevant to spread and persistence *within the trial context*. It must specify what "spread" and "inheritance" mean here (e.g., frequency of the *gene* across hosts, persistence of the *strain* within hosts, host colonization success) and predict outcomes based on that definition. It cannot dismiss this as a degenerate case.
      *   **Distinctions:** *Must Respect:* The functional integration and heritability pathways *in the specific engineered system*. *Spurious:* Insisting on a single, universal replicator definition (e.g., only genes *or* only cells) regardless of context; treating vertical inheritance as the only legitimate mode.

  3.  **Handle Kin/Group Equivalence Without Reducibility Distraction:**
      *   **Case:** Release design where groups naturally consist of relatives (e.g., localized release of siblings), making kin selection and group selection models predict the same outcome mathematically.
      *   **Requirement:** The theory MUST generate identical *operational predictions and monitoring requirements* regardless of whether the framing is kin or group selection. It cannot get bogged down in philosophical debates about "real" levels when the practical predictions converge. The focus is on the measurable outcome, not the preferred decomposition.
      *   **Distinctions:** *Must Respect:* Mathematical equivalence of predictions under different framings *for this specific scenario*. *Spurious:* Insisting one framing is "more fundamental" if it doesn't change the testable predictions or monitoring plan.

  4.  **Incorporate Niche Construction/Dynamic Environment:**
      *   **Case:** Engineered organism that alters its own selective environment (e.g., pest suppressing soil microbe that changes pH, plant pest suppressing its own host plant's defenses).
      *   **Requirement:** The theory MUST account for feedback loops where the "environment" in a selection model is partially a heritable product of the population's traits. Predictions must be dynamic, not assuming a fixed background. It must specify measurements of both organism traits *and* relevant environmental variables over time.
      *   **Distinctions:** *Must Respect:* The causal interdependence between organism traits and environmental states. *Spurious:* Treating the environment as purely exogenous; separating "selection" from "environmental change" when they are causally entangled.

  5.  **Accommodate Evolving Unit Status:**
      *   **Case:** System where lower-level units lose independent reproductive capacity over the trial timescale (e.g., engineered obligate endosymbionts becoming more integrated, Wolbachia-like).
      *   **Requirement:** The theory MUST allow the "unit of selection" to be a *dynamic property* that can shift during the monitoring period. It must predict trajectories accounting for potential changes in the level of functional integration (e.g., from independently replicating strain to host-dependent trait) and specify measurements to detect such shifts (e.g., symbiont culturability, host dependence).
      *   **Distinctions:** *Must Respect:* The potential for the *status* of a unit (e.g., replicator, interactor) to evolve. *Spurious:* Assuming units are fixed entities defined only at the start.

  6.  **Prevent Retrofitting / Ensure Pre-Commitment to Testability:**
      *   **Worry:** Any observed outcome can be explained post-hoc by choosing a convenient level of selection ("it was group selection!" or "it was selfish gene!").
      *   **Requirement:** The theory MUST *force pre-release specification* of: (a) The *primary level(s)* of selection expected to dominate the outcome (e.g., gene spread vs. group persistence). (b) *Specific, quantifiable predictions* at those levels within the monitoring window (e.g., "gene frequency increases by X% but host population density decreases by Y%"). (c) *Clear criteria for failure:* What measurements would falsify the primary level hypothesis or the predicted outcome? (e.g., "If gene spreads >X% *without* group density decrease >Y%, the group-harm effect is negligible").
      *   **Distinctions:** *Must Respect:* The fundamental difference between prediction and post-hoc explanation. *Spurious:* Treating mathematical equivalence of decompositions (like Price equation partitions) as license to avoid pre-committing to a primary causal hypothesis for prediction. *Non-Negotiable core of adequacy.*

  **Critical Tensions & Potential Unsatisfiability:**

  *   **Generality vs. Operational Testability:** A theory maximally general across biological substrates (viruses, microbes, insects, plants) may struggle to provide the specific, measurable predictions needed for noisy field data on a particular GEO. Highly specific, operational theories might lack transferability. *This tension must be explicitly acknowledged; perfect resolution may be impossible, but the theory must lean towards operational testability for the release context.*
  *   **Dynamic Units vs. Predictive Clarity:** Requiring units to be dynamic (#5) inherently clashes with the need for clear pre-release predictions and level specification (#6). The theory must provide a framework for defining plausible *scenarios* of unit evolution and their predicted signatures, rather than assuming perfect foresight.
  *   **Causal Claims vs. Mathematical Equivalence:** While mathematical decompositions (Price, IF) are powerful, the theory must prioritize identifying the *strongest causal drivers* (#1, #6) within the system, even if equivalent bookkeeping exists. Insisting on a single "real" level (#3) is often spurious, but refusing to identify *primary drivers* for prediction (#6) is fatal.

  **The Most Excluding Requirement:**
  **Requirement #6 (Prevent Retrofitting / Ensure Pre-Commitment to Testability)** does the most work in excluding otherwise popular theories. Many theoretical frameworks (especially purely gene-centric or purely group-centric views, or overly flexible multi-level approaches) excel at *explaining* outcomes post-hoc using their preferred decomposition or level. They often lack a strict methodological requirement to pre-specify the primary level/driver and concrete, falsifiable predictions *before* the outcome is known. A theory adequate for regulation *must* enforce this pre-commitment, ruling out approaches that treat level assignment as primarily interpretive rather than predictive.

  **Comparative Scoring (Illustrative, Not Definitive):**

  | Requirement                                   | Gene-Level Selectionism | Multi-Level Selection (MLS) | Inclusive Fitness (IF) |
  | :-------------------------------------------- | :---------------------- | :-------------------------- | :--------------------- |
  | **1. Resolve Gene-Group Conflict Predictively** | Often ignores/downplays group harm risk; predicts spread only. Risk of collapse missed. | Explicitly models conflict; can predict spread vs. collapse based on relative strength. | Predicts based on net effect; may miss *how* collapse occurs if focus is only on relatedness. |
  | **2. Define Units in Non-Treelike Systems**    | Struggles; "replicator" often ambiguous with HGT. Gene focus may be misleading. | Flexible; can define interactors at host or microbiome level. Replicator definition still tricky. | Lineage-based; struggles fundamentally with non-treelike inheritance. Often inadequate. |
  | **3. Handle Kin/Group Equivalence**           | May reframe kin effects as gene-level. Prediction same, but framing differs. | Can use group or kin framing; should yield same prediction. Needs discipline. | Naturally uses kin framing; predicts same outcome as MLS group framing here. |
  | **4. Incorporate Niche Construction**         | Environment fixed; misses feedback loops. Poor prediction. | Can incorporate group-level environmental modification. Individual-level harder. | Difficult; environment usually exogenous in IF models. Poor prediction. |
  | **5. Accommodate Evolving Unit Status**        | Rigid replicator view; struggles with integration. | Can model shifting levels of organization. A strength. | Fixed relatedness structure; struggles with evolving integration. |
  | **6. Prevent Retrofitting (Pre-Commitment)**  | **Weakness:** Tends to explain *all* outcomes as gene-level post-hoc. Avoids pre-specifying group effects. | **Moderate:** Can pre-specify levels/focus, but often flexible enough to reframe. Needs strong rules. | **Moderate:** Can pre-specify costs/benefits/relatedness. Can be reframed post-hoc as MLS. |
  | **Overall Adequacy for Release Auditing**      | **Low:** High risk of missing group/system risks (#1, #4), poor on HGT (#2), prone to retrofitting (#6). | **Moderate-High:** Best on conflicts (#1), evolving units (#5), can handle HGT context (#2). Needs strict rules on #6. | **Moderate:** Good for kin-structured releases (#3), but poor on HGT (#2), niche construction (#4), evolving units (#5). Can be flexible on #6. |

  **Summary for Regulators:** An adequate theory must force scientists to clearly state BEFORE release: (1) What level (gene, group, system) is MOST LIKELY to drive the key outcome (spread or harm)? (2) What SPECIFIC NUMBERS do they expect to measure? (3) What numbers would PROVE THEM WRONG? It must handle selfish genes harming groups, messy microbiomes, environmental changes caused by the GEO itself, and the possibility that the "unit" evolving changes during the trial. Most importantly, it must prevent scientists from explaining away surprises after the fact by simply picking a different level of analysis. The theory must make risky predictions up front.
