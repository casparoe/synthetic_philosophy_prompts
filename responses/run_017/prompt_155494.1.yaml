answer: |-
  I'll break this down step by step to address your core questions: what the bet is worth, whether it's well-defined, how the payout cap and multiple plays affect it, and whether your roommate's concern is valid. I'll avoid jargon and focus on clear explanations, drawing from the mathematical properties and practical implications. The key takeaway is that your friend is partially correct about the expected value (69 cents), but this doesn't mean you should pay a dollar to play—and the "weirdness" you observed in simulations is due to a fundamental property of the bet, not just a technicality.

  ### 1. **The expected value is well-defined and approximately 69 cents—but with a big caveat**
     - **The math**: For a single play, the expected value (EV) is calculated as follows:
       - If the first heads occurs on flip \(n\), you receive \((-1)^{n+1} \frac{2^n}{n}\) dollars (positive for odd \(n\), negative for even \(n\)).
       - The probability of first heads on flip \(n\) is \(\frac{1}{2^n}\).
       - The EV simplifies to \(\sum_{n=1}^{\infty} (-1)^{n+1} \frac{1}{n}\), which is the alternating harmonic series. This converges to \(\ln(2) \approx 0.693\) dollars (about 69 cents).
       - So yes, there is a "fact of the matter": for this specific bet, with terms summed in order of increasing \(n\), the EV is well-defined and positive (69 cents).
     - **Why your simulation didn't converge**: Despite the EV being well-defined, the variance (a measure of how spread out the payouts are) is infinite. Here's why:
       - The actual payout magnitudes \(\frac{2^n}{n}\) grow exponentially with \(n\), while the probabilities \(\frac{1}{2^n}\) shrink exponentially. For large \(n\) (e.g., \(n = 20\)), a single outcome can be huge (e.g., ±$52,428 for \(n=20\)), but it's very rare (probability \( \approx 9.54 \times 10^{-7} \)).
       - When you simulate, the running average stays near 69 cents for long stretches (since small \(n\) outcomes are common), but when a large \(n\) occurs, it causes a massive jump in the average (e.g., a large positive payout for odd \(n\) spikes it up, a large negative for even \(n\) crashes it down). Because these extreme events happen rarely but are very influential, the running average never settles—it keeps lurching. Running more samples doesn't fix this; it's inherent to the bet's infinite variance.
     - **The order-of-summation "technicality"**: The EV is only well-defined because we sum the terms in the natural order (by flip number \(n\)). If you reordered the terms (e.g., grouped all positive payouts first), the sum could change or diverge due to conditional convergence (this is the Riemann series theorem). But in this context—flips happening in sequence—the order is fixed, so the EV is unambiguously \(\ln(2)\). Your ML friend's suggestion to "run more samples" misses the point; the issue isn't estimation difficulty but the underlying infinite variance.

  ### 2. **The payout cap doesn't change much in practice**
     - **Your concern**: You worry that your friend can't pay out massive sums (e.g., she caps at $30,000), so the giant payouts for high \(n\) are "fictional." This should affect the EV, right?
     - **Reality**: For a reasonable cap like $30,000, the EV changes very little. Here's why:
       - Without a cap, EV = \(\ln(2) \approx 0.693\).
       - With a cap at $30,000, payouts for \(n \leq 19\) are unchanged (since \(\frac{2^{19}}{19} \approx 27,594 < 30,000\)), but for \(n \geq 20\), you'd pay/receive exactly ±$30,000 instead of the full \(\pm \frac{2^n}{n}\).
       - The capped EV can be calculated as:
         - Sum for \(n = 1\) to \(19\): \(\approx 0.7187\) (partial sum of the alternating series).
         - Plus a small adjustment for \(n \geq 20\): about \(-0.019\) (details below).
         - Total capped EV \(\approx 0.7187 - 0.019 = 0.700\) (about 70 cents).
       - This is extremely close to the uncapped EV (69.3 cents). The difference is tiny because:
         - The probability of \(n \geq 20\) is very low (\(< 2 \times 10^{-6}\)).
         - Capping reduces both extreme gains and losses, but they roughly balance out in expectation.
       - **Conclusion**: Your friend is right that the cap "doesn't matter" for the EV—it stays around 69–70 cents. The "huge numbers" for \(n \geq 20\) have such low probability that they don't significantly impact the average.

  ### 3. **Playing once vs. 200 times: Repetition doesn't solve the core problem**
     - **One play**:
       - EV is +69 cents, so if you play for free, you expect to gain money on average.
       - But if you pay $1 to play, your net EV is \(0.693 - 1 = -31\) cents (you expect to lose about 31 cents per play). Thus, paying $1 is a bad deal—you're overpaying for the bet. Your friend is wrong to say you're "leaving money on the table" by refusing; refusing a $1 entry fee is rational because the bet isn't worth that much.
       - **Risk perspective**: You win money 2/3 of the time (when \(n\) is odd), but most wins are small (e.g., 50% chance of +$2 for \(n=1\)). You lose 1/3 of the time (when \(n\) is even), with losses often larger but less frequent (e.g., 25% chance of -$2 for \(n=2\)). Due to infinite variance, there's a small chance of catastrophic loss (e.g., -$52,428 for \(n=20\)) that could ruin you, even if it's unlikely. This makes the bet feel risky despite the positive EV.
     - **200 plays**:
       - If you play 200 times independently for free, the expected total gain is \(200 \times 0.693 = 138.60\) dollars. However, because the variance is infinite, the actual outcome is highly unpredictable:
         - The sample average doesn't converge to the mean (due to heavy tails), so you might gain $138, lose $1,000, or anything in between.
         - Rare large payouts still dominate: A single extreme outcome (e.g., one \(n=20\) loss) can wipe out hundreds of small gains. For example:
           - Probability of at least one \(n \geq 20\) outcome in 200 plays: \( \approx 1 - (1 - 1/524,288)^{200} \approx 0.00038 \) (very low, but not impossible).
           - If it happens (e.g., a $52k loss), it overshadows everything else.
       - **With a $1 entry fee per play**: Net EV per play is -31 cents, so for 200 plays, you expect to lose \(200 \times 0.31 = 62\) dollars total. This is worse than playing once—don't do it.
       - **Your friends' arguments**:
         - "Repetition favors you": True only if variance is finite. Here, it's infinite, so repetition doesn't "average out" the risk. The EV increases (more plays → higher expected total), but the uncertainty grows too. Your friend is oversimplifying.
         - "Repetition makes EV reasoning legitimate": Partly true—for finite-variance bets, more plays reduce relative risk. But here, repetition doesn't stabilize the outcome. The other friend is correct that EV is always defined mathematically, but it becomes less useful for prediction when variance is infinite.
     - **Takeaway**: Playing 200 times amplifies both the potential upside and downside. It doesn't change the EV per play, but it magnifies the impact of rare events. With a payout cap, the variance becomes finite, making repetition safer—but as above, the cap doesn't alter the EV much.

  ### 4. **Your roommate's point: Valid for risk, but not for EV**
     - **The concern**: "You lose most of the time and big wins are one-in-a-million" is a risk-aversion argument, not an EV one.
       - You win 2/3 of the time (since P(n odd) = 2/3), but most wins are small (+$2 for n=1 happens 50% of the time). Losses are less frequent (P(n even) = 1/3) but can be larger (e.g., -$4 for n=4). Big wins/losses are rare (e.g., P(n=20) ≈ one in a million).
       - So yes, you often gain small amounts, but rarely lose bigger or win huge. This unevenness makes the bet feel "unfair" psychologically, even though the EV is positive.
     - **Is it a real objection?**:
       - For pure EV reasoning (maximizing average outcome), no—the positive EV means it's theoretically profitable in the long run. But humans aren't purely EV-maximizers; we care about risk.
       - With infinite variance, one bad outcome can be devastating, so many people would avoid this bet even with positive EV (especially if you can't absorb a $50k loss). Your roommate's point highlights why paying $1 to play is "stupid": you'd lose money about 31% of the time per play after the fee, and the small losses feel frequent compared to the rare big wins.
       - In finance terms, the "certainty equivalent" (what you'd pay to avoid risk) is less than the EV for risk-averse people. So if your roommate is risk-averse, their objection is reasonable.

  ### 5. **Who was reasoning badly (and why)**
     - **Your dice-tower friend**: She's correct that the EV is ~69 cents and that the cap doesn't significantly affect it. But she's wrong to insist you should pay $1 to play—that turns a positive-EV bet into a negative-EV one. Her "repetition favors you" claim is misleading due to infinite variance.
     - **You**: Your simulation approach was fine, but the non-convergence isn't a flaw—it reveals the bet's nature. Capping for realism was smart, but as shown, it doesn't change the EV much.
     - **ML friend**: "Run more samples" is bad advice here; it doesn't fix non-convergence from infinite variance.
     - **Other friend**: Saying the EV "depends on order of summation" is technically true in math, but irrelevant here—the flip order fixes the summation. They're right that repetition supports EV reasoning generally, but it fails for this bet.
     - **Roommate**: Their "lose most of the time" point is exaggerated (you win 2/3 of the time), but they're spot-on about risk. Paying $1 is indeed "stupid" due to net negative EV and risk aversion.

  ### What to do
  - **Don't pay to play**: If you must, pay no more than 69 cents per play (though this is impractical). Paying $1 guarantees a negative EV.
  - **With the cap**: Play for free if offered—it's +EV with negligible cap impact. But only if you're risk-neutral and can handle worst-case losses.
  - **For 200 plays**: Avoid paying entry fees. If free, expect ~$138 profit on average, but be prepared for wild swings. With a cap, it's safer.
  - **Overall**: This bet is a great example of how infinite variance makes EV a poor guide for decisions. In practice, decline it unless you're playing for trivial stakes with a cap. And next game night, suggest a lower-variance bet! 

