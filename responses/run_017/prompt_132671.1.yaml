prompt: |-
  I am the methodologist to the Standing Committee on Protected Taxa, the statutory body that maintains our jurisdiction's list of protected animals. Listing a taxon triggers binding duties on everyone who keeps, breeds, transports, handles or kills animals in it: enclosure and stocking standards, handling and stunning requirements, and a licensing regime for any procedure likely to cause pain. Delisting removes all of it. The list is revised on a fixed eighteen-month cycle; each cycle we receive six to twelve petitions, each with a dossier of published and grey evidence, industry and animal-protection submissions, and a staff summary of roughly fifteen pages. The Committee has nine appointed members — two veterinarians, an ethologist, a neuroscientist, two industry representatives, an animal-protection representative, an economist, and a chair who is a retired judge — and they meet for two days per cycle. So whatever I put in front of them has to be runnable inside that time, in language that does not presuppose the theory, and it has to satisfy the two constraints that actually bind us: a duty to give reasons a reviewing court will accept as non-arbitrary, and a duty to treat like cases alike across cycles even though the membership turns over.

  What the Committee has already resolved, after two cycles of going in circles, is that the property it is trying to track is the capacity for valenced conscious experience, that brain measures of every kind are admissible only as evidence about that capacity and never as the thing that matters, and that the smallness of an animal's brain is not by itself a reason to count a unit of its suffering for less. What it has not resolved is how to turn any of that into a decision it can repeat.

  Our working draft has a two-gate shape: a first gate on whether there is sufficient evidence of any valenced experience at all, and a second on how much the taxon's suffering should count. I do not think this survives contact with the dossiers, for reasons I want you to judge rather than accept: the underlying property looks continuous while our duties are binary, and the gates import a between-species comparability that we have no way to establish. Please rebuild it, or replace it, as a procedure.

  I need the following, in the form of something I can hand to a non-specialist:

  An ordered sequence of questions, with what counts as a sufficient answer to each, where the sequence terminates in a recommendation not to list, where it terminates in a recommendation to list, and where it stops and refers the matter to the Committee because the question is one of values or of statutory purpose rather than of evidence. Include how the procedure handles evidence that is absent rather than negative, and who bears the burden in that case. Include how to combine proxies when they conflict, and in particular whether a proxy's validity should be treated as clade-local — our neuroscientist's view is that a relationship calibrated within vertebrates carries essentially no information about an arthropod or a nerve-net animal, and I do not know whether the procedure should encode that as a rule or as a caution. Include what the unit of account is: the individual animal, the expected-sentience-weighted individual, or the population-level total, and at which stage, if any, the number of animals affected is allowed to enter. Include whether the output can be partial — a listing that attaches to some practices and not others — and what that does to consistency across cycles. Include a one-page version in words that a new member could follow on the morning of the meeting.

  Three submissions this cycle pull in directions I cannot reconcile, and the procedure should say explicitly how each is handled and which of them it simply cannot accommodate. Industry argues that central neuron count is the only principled and measurable proxy, that behavioural evidence is projection, and that we should adopt a numerical threshold and apply it without interpretation. An animal-protection submission argues that any threshold on a continuous property is arbitrary, that a nonzero probability of valenced experience multiplied by population scale mandates listing anything with any marker at all, and that refusing to aggregate is itself a moral choice. A consultant argues that what matters is experience per unit of objective time rather than per moment, that temporal resolution varies enormously across taxa, and therefore that a measure which ignores the density of subjective time systematically undercounts small, fast animals.

  Then run the finished procedure on three petitions from this cycle, showing the gates in operation and the reasons that would go in the record. Group A comprises about forty species of large, long-lived, socially complex reef-dwelling cephalopods: the dossier is almost entirely allometric — high absolute brain mass, high central neuron counts, a single large integrating structure — with only a couple of studies on nociceptive sensitisation and nothing at all on motivational trade-offs, and annual welfare exposure in the low thousands. Group B comprises social insects with roughly a million neurons and no single integrating structure: flexible rather than reflex responses to injury, a persistent avoidance of a place where they were shocked that survives the loss of a high-value resource, shifts in response that are reversed by analgesics, and one small unreplicated cognitive-bias result of the kind read as a pessimism-like state; annual exposure is stated in the dossier at around ten to the eleventh individuals. Group C comprises filter-feeding animals with a nerve net and no centralisation at all: habituation, a whole-body withdrawal that reorganises ongoing feeding and is modulated by prior state, almost no neuroanatomical data beyond cell counts, and a bycatch mortality that the petition puts at ten to the thirteenth. At least one of the three must come out somewhere my Committee will not want to go, and I would rather it be A, which is where the political pressure is.

  Finally, tell me plainly what the procedure cannot do: whether it can say anything about moral status in the rights-bearing sense as opposed to the strength of a claim not to be made to suffer, whether it can compare a unit of experience across architectures that share no evolutionarily conserved substrate, what it does with valenced states that might differ in kind rather than degree from ours, and how badly it misfires for the taxa sitting near whatever boundary it draws. Please do not give me citations, reading lists, or suggestions about which experts to consult — we have those, and a procedure that depends on new evidence is useless to us. Take every figure I have given as it stands in the dossier, without checking it.
reasoning: |-
  Okay, let me try to unpack this complex request from the methodologist. They're dealing with a high-stakes scientific-ethical decision framework that has to withstand legal scrutiny while being practically usable. 

  First, I need to understand the core challenge: they've already established that the committee cares about valenced conscious experience, but haven't found a reliable way to operationalize this. Their current two-gate system seems flawed because it forces binary decisions on a continuous phenomenon and assumes cross-species comparability that might not exist.

  The user is clearly frustrated after two cycles of deadlock and wants a concrete procedure that addresses several thorny issues:
  - How to handle absent evidence
  - How to weight conflicting proxies (especially across clades)
  - What unit of account to use (individual vs population)
  - Whether partial listing is possible
  - How to address three specific controversial submissions

  The three test cases are cleverly chosen to stress-test any system: cephalopods (large brains but sparse behavioral data), social insects (tiny brains but complex behaviors), and nerve-net animals (minimal anatomy but some response modulation). The political pressure around cephalopods makes this especially delicate.

  I notice the user emphasizes practical constraints repeatedly: no time for new evidence, must work for non-specialists, must produce court-acceptable reasons. This suggests I should avoid theoretical elegance in favor of defensible pragmatism. The repeated "don't cite experts" warning is notable - they're drowning in evidence but lack a decision algorithm.

  The neuroscientist's concern about clade-local proxies seems crucial. If a vertebrate-calibrated measure is meaningless for arthropods, any procedure must account for that without requiring impossible comparative work. The temporal resolution argument from the consultant also needs addressing - it could radically change how we count suffering in fast-metabolizing animals.

  For the framework itself, I'm considering moving away from their "gate" metaphor toward an evidence sufficiency approach. Instead of trying to measure suffering magnitude comparably across taxa, we might focus on whether there's sufficient evidence of morally relevant experience at all, then handle scale separately as a policy matter. This could satisfy their consistency requirement while avoiding false precision.

  The unit of account problem is tricky. Weighting by sentience capacity feels necessary but unmeasurable; population totals introduce utilitarianism concerns. Perhaps we can separate the "is there a being here" question from "how much should we weigh aggregate impacts" - the former being scientific, the latter ethical/political.

  For the three controversial submissions, I'll need explicit rebuttals built into the procedure:
  1) Against industry's neuron-count threshold: reject because it ignores potential qualitative differences in neural architectures
  2) Against protectionists' probability argument: reject because it collapses the evidence threshold to near-zero
  3) For the temporal resolution point: incorporate as a mandatory consideration for any taxa with differing metabolic rates

  The test cases will force hard choices. Cephalopods might fail despite their brains due to lack of behavioral evidence. Social insects might pass based on analgesic-reversed behaviors. Nerve-net animals become the real challenge - their responses might be explainable as non-valenced reflexes, but the scale argument is overwhelming. That's probably where the committee won't want to go politically, but the procedure should take them there if the evidence meets the standard.

  Ultimately I'll need to admit the procedure's limits: it can't establish moral rights, can't compare subjective experiences across architectures, and will always have edge cases. But it can provide legally defensible, consistent decisions based on best available evidence - which seems to be their core need.
answer: |-
  Here is a decision procedure designed for your constraints, presented as requested. It replaces the "two-gate" approach with an **Evidence Sufficiency Framework** focused on the *existence* of valenced experience (Gate 1) while explicitly separating *aggregate welfare weight* (Gate 2) as a distinct policy question for the Committee. This avoids false comparability while ensuring defensible, consistent decisions.

  **The Protected Taxa Listing Procedure (v1.0)**

  **Core Principle:** Listing requires sufficient evidence that a taxon possesses the biological capacity for valenced conscious experience (VCE). This is a necessary condition. Delisting requires sufficient evidence that it lacks this capacity. Absence of evidence is not evidence of absence; burdens of proof apply.

  **Unit of Account:** The procedure assesses the *individual organism*. Population scale enters only at Gate 2 (Policy Weighting), not at the listing decision (Gate 1).

  **Handling Absent/Negative Evidence & Burden:**
  1.  **For Listing (Proponent Burden - Petitioner):** The petitioner bears the burden to provide *sufficient positive evidence* for VCE capacity. Absence of evidence on key proxies is a weakness in the petition but doesn't automatically defeat it if other evidence is sufficient. Negative evidence (e.g., a well-designed study failing to find a key marker) counts against listing.
  2.  **For Delisting (Proponent Burden - Petitioner):** The petitioner bears the burden to provide *sufficient positive evidence* that VCE capacity is biologically absent (e.g., fundamental architectural incompatibility). Absence of evidence for VCE is *not* sufficient for delisting; negative evidence (failed VCE tests) supports delisting but requires careful assessment for methodological adequacy.
  3.  **Committee Referral:** If the evidence is genuinely ambiguous/equipoised after applying the framework, the Committee must decide based on the statutory purpose (precaution assumed).

  **Combining Conflicting Proxies:**
  1.  **Clade-Local Calibration (Rule, not just caution):** A proxy (e.g., neural structure, behavioural response) validated *only* within a specific clade (e.g., vertebrates) has **reduced weight** when applied to a fundamentally different clade (e.g., arthropods, nerve-net animals). Its presence *supports* VCE less strongly; its absence *counts against* VCE less strongly. Proxies validated across wider evolutionary distances carry more weight.
  2.  **Hierarchy of Evidence Strength (Guiding Principle, not strict rule):** Evidence is weighted by its directness and robustness in indicating VCE:
      *   **Stronger:** Behavioural evidence of motivational trade-offs involving aversive stimuli *reversed by analgesics/anesthetics specific to that taxon*, complex learned avoidance persisting despite conflicting motivations.
      *   **Moderate:** Nociceptive sensitisation, conditioned place aversion (without strong conflict tests), physiological stress responses integrated with behaviour, neuroanatomy indicating integrative processing *and* homologues of key pathways linked to VCE in closer relatives.
      *   **Weaker:** Simple withdrawal reflexes, habituation, non-specific physiological stress, isolated neuroanatomical features without functional context. High neuron count/brain mass *alone* is weak evidence.
  3.  **Resolving Conflict:** Stronger evidence types generally outweigh weaker conflicting types *within the same clade*. Conflicting evidence *of similar strength and directness* within a clade creates ambiguity, potentially triggering Committee referral. Evidence from a distant clade conflicting with evidence within the target clade is discounted per Rule 1.

  **Procedure: Ordered Sequence of Questions**

  1.  **Does the taxon possess fundamental neurobiological architecture plausibly necessary for VCE?**
      *   *Sufficient Negative Answer:* Yes, if evidence demonstrates a complete absence of any neural or diffusely networked system capable of integrating sensory information and modulating responses based on internal state (e.g., simple reflex arcs only, no interneurons, no evidence of any modulation). **→ Recommendation: DO NOT LIST.**
      *   *Sufficient Positive Answer:* Not required at this stage. Absence of evidence here is problematic but doesn't end the inquiry. Evidence of *any* neural/net system capable of integration/modulation means proceed.
      *   *Ambiguous/Insufficient Evidence:* Proceed to Q2. *(Note: Very few multicellular animals fail this completely; nerve nets pass this bar).*

  2.  **Is there sufficient positive evidence, weighted by clade and strength, that the taxon exhibits behavioural or neurophysiological markers indicative of VCE capacity?** (Apply Evidence Strength Hierarchy & Clade-Local Rule rigorously)
      *   *Sufficient Positive Answer:* Yes, if evidence includes at least **one "Stronger" marker validated within the clade or a closely related one**, OR a compelling convergence of multiple "Moderate" markers *not explainable by non-valenced mechanisms* (e.g., simple reflexes, fixed action patterns). **→ Proceed to Gate 2 (Policy Weighting).**
      *   *Sufficient Negative Answer:* Yes, if rigorous, well-designed studies consistently fail to find *any* "Stronger" or "Moderate" markers *and* provide plausible non-valenced explanations for observed behaviours, *or* fundamental architecture makes VCE implausible (per Q1). **→ Recommendation: DO NOT LIST.**
      *   *Ambiguous/Insufficient Evidence (Equipoise):* Evidence is mixed, weak, conflicting, or absent on key markers without clear preponderance. **→ REFER TO COMMITTEE.** Committee decides based on statutory purpose (precaution likely applies).

  3.  **GATE 2: POLICY WEIGHTING (COMMITTEE DECISION POINT)**
      *   *Trigger:* A positive outcome from Q2 (Sufficient evidence VCE exists).
      *   *Question:* Given the evidence of VCE capacity, what is the appropriate scope and weight of protection for *this taxon* considering:
          *   The *strength and nature* of the evidence for VCE (e.g., robustness of markers, potential qualitative differences).
          *   The *scale of welfare exposure* (number of individuals affected annually).
          *   The *potential for varying subjective experience density* (e.g., metabolic rate/temporal resolution arguments).
          *   Practical feasibility and proportionality of applying full protections.
      *   *Output:* Full Listing (all protections) OR **Partial Listing** (tailored protections, e.g., specific handling/stunning requirements but modified enclosure standards, specific licensing exemptions). **→ Recommendation: LIST (Full or Partial).**
      *   *Consistency:* Partial listings must be justified by specific, evidence-based differences in VCE evidence strength/character or overwhelming feasibility concerns. Justifications become precedents binding future cycles. Scale alone is *not* a valid reason for partial listing; it informs the *weight* of protection but not the *existence* of the claim.

  **Handling the Three Submissions Explicitly:**

  1.  **Industry (Neuron Count Threshold):** Rejected as the sole proxy. Neuron count is admissible only as one "Moderate" or "Weak" proxy (depending on context), subject to the Clade-Local Rule. It cannot override contradictory stronger behavioural evidence within the clade. Numerical thresholds are rejected as arbitrary for a continuous property and ignoring qualitative architecture.
  2.  **Animal-Protection (Nonzero Probability + Scale):** Rejected for Gate 1. The burden requires *sufficient positive evidence*, not just any marker. A "nonzero probability" is always present for most neural animals after Q1; this collapses the evidentiary gate. Scale is explicitly excluded from Gate 1. *However:* This argument is central to **Gate 2**. Strong evidence of VCE *combined with massive scale* is a compelling reason for the Committee to apply *full* protections in Gate 2, even if VCE seems less complex than in vertebrates. Refusing to aggregate *is* a policy choice made explicit in Gate 2.
  3.  **Consultant (Temporal Resolution/Subjective Density):** Incorporated. This is not a Gate 1 question about the *existence* of VCE, but a critical factor for **Gate 2** regarding the *weight* of suffering and potentially the design of specific protections (e.g., stunning methods for very fast taxa). The procedure *requires* this argument to be considered in Gate 2 for taxa with significantly different metabolic rates.

  **Application to Test Petitions:**

  *   **Group A (Large Cephalopods):**
      *   Q1: Pass (Complex central brain, high integration).
      *   Q2: **Ambiguous/Insufficient Evidence.** High absolute brain/neuron count (Moderate/Weak proxy, clade-appropriate). Nociceptive sensitisation (Moderate proxy). *Lacks* key Stronger markers (motivational trade-offs with analgesics, complex persistent avoidance under conflict). Studies absent. Burden not met by petitioner. **→ REFER TO COMMITTEE.** *Committee likely applies precaution (List) due to architecture and potential, but evidence is weaker than often assumed. Partial listing could be considered if feasibility arguments are strong, but scale is low.*

  *   **Group B (Social Insects):**
      *   Q1: Pass (Neural system capable of integration/modulation).
      *   Q2: **Sufficient Positive Evidence.** Flexible injury response + Persistent place aversion despite resource loss + Analgesic reversal = Convergence of **Stronger** markers (validated within arthropods). Cognitive bias result (Moderate) adds support. High neuron count irrelevant per Clade-Local Rule. **→ Proceed to Gate 2.**
      *   Gate 2: Extremely high scale (10^11). Evidence strong within clade. Temporal resolution likely high (consider density). **→ Recommendation: LIST (Full).** *This is the politically hardest but evidentially strongest case of the three.*

  *   **Group C (Nerve-net Filter Feeders):**
      *   Q1: Pass (Nerve net, whole-body modulated response).
      *   Q2: **Sufficient Negative Answer?** Habituation & Withdrawal modulated by prior state = **Weak** proxies only. No Moderate/Strong markers. No neuro data beyond cell count. No evidence *against* VCE, but petitioner burden *for* listing not met. Fundamental architecture makes complex VCE less plausible than in A or B. **→ Recommendation: DO NOT LIST.** *Massive scale (10^13) is irrelevant for Gate 1. Gate 2 is not reached.*

  **What the Procedure Cannot Do:**

  1.  **Moral Status (Rights-Bearing):** The procedure tracks *capacity for valenced experience* as the trigger for protection from imposed suffering. It makes no claim about inherent rights, dignity, or moral status beyond this consequentialist duty to minimize suffering caused by human actions.
  2.  **Cross-Architecture Experience Comparison:** It *cannot* quantify whether "a unit of suffering" in a cephalopod is equivalent to one in a bee or a fish. It establishes *that* a taxon has a capacity warranting protection, and in Gate 2, scale and potential qualitative factors inform the *weight* given to preventing suffering in policy application, but no common currency is established.
  3.  **Valenced States Differing in Kind:** The procedure relies on markers (behavioural/neural) presumed to indicate *something* analogous to valenced states in familiar taxa. If a taxon possesses VCE fundamentally different in kind (e.g., not based on aversion/attraction), our current markers may fail entirely. The procedure would likely fail to list such a taxon unless new, validated markers for *that kind* of experience were proposed and accepted. This is a fundamental epistemic limit.
  4.  **Edge Cases & Misfires:** Taxa near the evidentiary boundary (like cephalopod Group A) will be contentious. The procedure relies on available proxies; new discoveries could rapidly change assessments. It may misfire for:
      *   Taxa with VCE but no currently recognized proxies (False Negative).
      *   Taxa displaying proxies robustly but where they are epiphenomenal to non-valenced processing (False Positive - though the proxy hierarchy aims to minimize this).
      *   Highly derived or alien neurobiologies. The "fundamental architecture" question (Q1) is the bluntest instrument.
  5.  **Resolving Deep Uncertainty:** When evidence is truly ambiguous (Q2 equipoise), the procedure forces a Committee value judgment under the statute (precaution). It doesn't eliminate this uncertainty.

  **One-Page Member Guide: The Listing Decision Flow**

  1.  **Basic Architecture?** Does it have *any* nervous system/net that could potentially support integrated responses? (Almost always YES - proceed). If clearly NO (like simple reflexes only) → **DO NOT LIST.**
  2.  **Evidence of "Suffering-like" Capacity?** We look for strong signs:
      *   Does it *learn* to avoid something painful *even when it really wants something there*? (Strongest sign).
      *   Does painkiller medication change its reactions to injury or stress? (Strong sign).
      *   Does it get more sensitive to harm after being hurt? (Moderate sign).
      *   Does its brain structure look like it *could* process experiences like pain/fear, *especially* compared to its close relatives? (Moderate/Weak sign).
      *   **Crucial:** Evidence from very different animals (e.g., insect vs. fish) isn't as strong as evidence from similar animals. Brain size/number alone isn't enough.
  3.  **Making the Call (Q2):**
      *   Found at least one **Strong sign** (or several solid Moderate signs converging)? → **PROCEED TO POLICY WEIGHING (Gate 2).**
      *   Looked hard, found *no* Strong signs and the Moderate/Weak signs have other explanations? → **DO NOT LIST.**
      *   Evidence mixed, weak, or too unclear? → **COMMITTEE VOTE NEEDED** (likely lean towards precaution).
  4.  **Policy Weighing (Gate 2 - If Listing is Warranted):** Now consider:
      *   *How strong* is the evidence (e.g., one weak sign vs. multiple strong ones)?
      *   *How many* individuals are affected? (Billions vs. thousands).
      *   Might their experience be very fast/dense due to metabolism? (Consultant's point).
      *   Are *full* protections practical? If not, can we tailor them (Partial Listing)?
      *   **Output:** Recommend **FULL LISTING** or **PARTIAL LISTING** with specific justifications recorded as precedent.
  5.  **Key Principles:**
      *   **Burden:** The person asking to list must show good evidence it *can* suffer. The person asking to *de*list must show good evidence it *can't*.
      *   **Scale:** Huge numbers matter for *how much* we protect (Gate 2), not *if* we protect (Gate 1).
      *   **Consistency:** We follow our past reasons (precedents) unless new evidence clearly changes things. Tailored (Partial) listings need clear, evidence-based reasons.
      *   **We Don't Compare Suffering:** We decide if there's enough evidence *that* it suffers meaningfully, not if its suffering is "like" a mammal's. Scale and evidence strength guide policy weight.

  This procedure provides a clear, auditable, precedent-respecting path through complex evidence, separates the scientific (Gate 1) from the evaluative/policy (Gate 2), and directly addresses your core constraints and the problematic submissions. It forces hard but defensible choices on cases like cephalopods (referral) and social insects (list), while providing a reasoned basis for excluding nerve-net filter feeders despite scale.
