  Here's the joke, built around your cleanup rule collapsing and the regress:

  **Setup:** So, our condo board votes to allow a loud rooftop party. All-Affected says nearby condo associations get a vote – the noise impacts them. Subjected-to-Coercion says only *our* owners vote – it's our rules. Neither matches just "residents."  
  **Punchline:** Then I propose the Cleanup Rule: the vote belongs to the poor janitor stuck cleaning confetti out of the pool filter at 3 AM. He sighs, "Fine, I vote 'no'. But who voted that *I'm* the one dealing with the consequences? Was it the affected? The subjected? Or... *another* janitor?" And now he's stuck defining who defines the cleanup crew, needing a vote by nobody in particular.

  *(98 words)*

  **Why it works for your audience:**
  1.  **Concrete Scenario:** Condo board decision makes it relatable.
  2.  **Criteria Diverge:** Clearly shows All-Affected (nearby condos) vs. Subjected (owners) vs. Residents.
  3.  **Cleanup Rule Introduced:** Uses your concept, giving the vote to the janitor (consequences).
  4.  **Collapse & Regress:** The janitor instantly identifies the core problem – defining "consequences" requires *another* boundary rule ("who voted that I'm the cleanup?"), launching the exact regress inherent in founding the demos ("needing a vote by nobody in particular").
  5.  **Accurate & Insightful:** Lands because it precisely mirrors the theoretical dilemma they study.
  6.  **Punchline Flows:** The janitor's weary, meta question delivers the humor and the point simultaneously.
