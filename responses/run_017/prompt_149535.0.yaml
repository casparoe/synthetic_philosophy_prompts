  We are going to design a classroom activity to demonstrate the Ellsberg paradox and explore variations that might affect ambiguity aversion. The goal is to have students experience the paradox without prior explanation and then debrief to connect their experience to the theory.

  ## Overview
  We will have three conditions for the ambiguous urn, each assigned to a third of the class (approx. 7-8 students per condition). The conditions are:
  1. **Randomiser Condition**: The composition of the ambiguous urn is determined by a randomiser (e.g., a computer or a fair device) that the class can trust is random.
  2. **Adversarial Condition**: The composition is set by a classmate (the "adversary") who gets a bonus if the bettors lose. This classmate is trying to make the bettors lose.
  3. **Ignorant Condition**: The composition is set by a classmate who is blindfolded and draws a slip from a bag (so she doesn't know the composition and is just following a random process). She is visibly a person but has no knowledge.

  We will have two urns:
  - **Known Urn**: Contains 50 red and 50 black balls (total 100 balls). Everyone knows the composition.
  - **Ambiguous Urn**: Contains 100 balls that are either red or black, but the exact composition is unknown. It will be set in one of the three ways above.

  The activity has three parts:
  1. **Pricing Stage**: Students individually state their willingness-to-pay (or minimum selling price) for four bets: 
     - Bet on red from known urn (KR)
     - Bet on black from known urn (KB)
     - Bet on red from ambiguous urn (AR)
     - Bet on black from ambiguous urn (AB)
     We will use a procedure that elicits their personal valuation for each bet separately.

  2. **Betting Stage**: We will actually run bets on the ambiguous urn in the three conditions. We will do multiple rounds to see if behavior changes with experience.

