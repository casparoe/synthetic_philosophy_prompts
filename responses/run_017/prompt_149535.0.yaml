answer: |-
  Below is a complete classroom game plan designed to make students experience the Ellsberg paradox firsthand, with your three-condition twist to test the "missing information vs. adversarial context" hypothesis. The game uses points (convertible to snacks/bragging rights), runs in 90 minutes, and includes safeguards against students trying to "take both bets."

  ---

  ### **Game Overview**
  **Core Idea:**  
  Students price bets on two urns:  
  - **Known Urn:** 50 red, 50 black balls (transparent container).  
  - **Ambiguous Urn:** Unknown red/black composition (opaque container), split into three variants:  
    1. **Randomiser:** Composition set by a public randomiser (e.g., RNG).  
    2. **Adversary:** Composition set by a classmate paid to make bettors lose.  
    3. **Ignorant:** Composition set by a blindfolded classmate drawing from a bag (no knowledge).  

  Students price four bets separately:  
  - Red (known urn), Black (known urn), Red (ambiguous urn), Black (ambiguous urn).  
  The **Ellsberg pattern** emerges when:  
  - `Price(Red known) + Price(Black known) ≈ 100` (value of a sure win).  
  - `Price(Red ambiguous) + Price(Black ambiguous) < 100` (violates expected utility).  

  **Adversarial Hypothesis:**  
  Aversion will be strongest in the **Adversary** condition (suggesting the effect stems from strategic vulnerability, not just missing information).  

  ---

  ### **Materials**  
  - **Urns:**  
    - 1 transparent jar (50 red, 50 black beads).  
    - 3 identical opaque jars (each with 100 red/black beads; compositions hidden).  
  - **Randomiser:** Laptop/phone with RNG (e.g., random.org) to pick a number 0–100 for the Randomiser urn.  
  - **Adversary Setup:** Envelope with a "bonus card" (explained later).  
  - **Ignorant Setup:** Bag with 101 slips (numbers 0–100), blindfold.  
  - **Betting Sheets:** For pricing (Table 1) and repeated betting (Table 2).  
  - **Projector:** Display instructions, RNG results, and betting rounds.  

  ---

  ### **Timeline (90 Minutes)**  
  #### **0–10 min: Setup & Rules**  
  - **Urn Setup:**  
    - **Known Urn:** Show students the 50/50 mix.  
    - **Ambiguous Urns (set in real time):**  
      - **Randomiser:** Publicly run RNG (0–100); fill urn with that many red beads.  
      - **Adversary:** Select a student "Adversary." They fill the urn secretly (any mix). They get a bonus card (e.g., +10 points) if >50% of bets on *their urn* lose.  
      - **Ignorant:** Blindfold a student; they draw a slip from the bag (e.g., "37"). Fill urn with 37 red beads. Remove blindfold—they know nothing.  
  - **Group Split:** Divide class into 3 groups (7–8 students). Each group assigned to one ambiguous urn.  
  - **Rules:**  
    - "You'll price bets on drawing a red or black bead from each urn. Pricing is *separate* for each bet."  
    - "Later, there will be actual betting rounds. Points convert to snacks!"  
    - **NO THEORY:** Avoid terms like "ambiguity" or "probability."  

  #### **11–25 min: Pricing Stage (Elicit Ellsberg Pattern)**  
  - **Task:** Students price all four bets on their sheets:  
    > *"What is the most points you would pay to take this bet? If you win, you gain 100 points. If you lose, gain 0."*  
    | Bet | Your Price |  
    |-----|-----------|  
    | Red from known urn | _____ |  
    | Black from known urn | _____ |  
    | Red from ambiguous urn (your group's) | _____ |  
    | Black from ambiguous urn (your group's) | _____ |  

  - **Key Instructions:**  
    - "Price each bet **individually**. You cannot combine bets."  
    - "Be honest—this affects your points!"  
  - **Why this works:**  
    - Forces isolated pricing (blocks "take both bets" strategy).  
    - Summing `Red known + Black known` ≈100 points (sure-win value), but `Red ambiguous + Black ambiguous` will likely be <100, creating the paradox.  

  #### **26–45 min: Ambiguous Urn Betting (3 Conditions)**  
  - **Task:** Each group bets *only* on their ambiguous urn variant for 5 rounds.  
    - **Betting Sheet (per round):**  
      > *"Bet on RED/BLACK? Or PASS? If you bet, you pay 40 points. Win = +100 points. Lose = 0."*  
    - **Urns stay fixed** (no replacement). Draw with replacement to keep compositions static.  
  - **Procedure per Round (3 min/round):**  
    1. **Project urn name** (e.g., "Adversary Urn: Round 1").  
    2. Students write bets privately.  
    3. Draw one bead (publicly), record results.  
    4. Update points.  
  - **Hypothesis Testing:**  
    - **Randomiser:** Mild aversion (prices slightly <50).  
    - **Ignorant:** Moderate aversion (person = suspicion).  
    - **Adversary:** Strong aversion (many passes/low prices; "someone's out to get me").  

  #### **46–60 min: Repeated Betting Stage (Fixed Urn)**  
  - **Task:** All students bet on the **same** ambiguous urn (use the **Randomiser urn** for simplicity).  
    - Run 10 quick rounds (2 min total): Project outcomes without student input (simulate draws).  
    - E.g., Show 10 draws: R,B,B,R,R,B,R,B,B,R → red = 50% (emergent 50/50).  
  - **Debrief Hook:**  
    - "After 100 rounds, this would be a fair coin. Does that change how you’d bet *now*?"  
    - Let students discuss briefly (exposes tension: long-run frequency vs. immediate distrust).  

  #### **61–85 min: Debrief & Theory Connection**  
  - **Step 1: Reveal Urn Compositions**  
    - Randomiser: e.g., 52 red.  
    - Adversary: e.g., 100 black (maximize losses).  
    - Ignorant: e.g., 49 red.  
  - **Step 2: Plot Pricing Data**  
    - Project class averages:  
      - `Avg(Red known) + Avg(Black known)` → Should be ≈100.  
      - `Avg(Red ambiguous) + Avg(Black ambiguous)` → Should be <100, **lowest for Adversary**.  
    - **Key Question:** "Why is the sum for the ambiguous urn less than 100? What does expected utility say about this?"  
  - **Step 3: Connect to Ellsberg**  
    - "Today you experienced the **Ellsberg paradox**: People prefer known probabilities over unknowns, violating expected utility."  
    - Map moments:  
      - Pricing sums → "No single probability explains your ambiguous-urn prices."  
      - Adversary urn → "Aversion spikes when you fear someone knows more/has opposing incentives."  
      - Repeated betting → "Long-run frequencies don’t erase short-run distrust—especially against adversaries."  
  - **Step 4: Formalize Ambiguity Aversion**  
    - Introduce term *only now*: "This is **ambiguity aversion**—preference for known risks over unknown uncertainties."  

  #### **86–90 min: Payoffs & Wrap-Up**  
  - Award snacks by points (e.g., top 3 scorers).  
  - **Final Discussion:** "Would you price differently if you could bet on both colors? Why can’t you?" (Teaches comonotonicity: selling both *should* yield 100, but aversion prevents it.)  

  ---

  ### **Payoff Scheme**  
  - **Points system:**  
    - Pricing: If a student’s bid wins a bet, they gain `100 - bid` points.  
    - Betting: Pay 40 points to bet; win +100 (net +60), lose 0 (net -40).  
    - Adversary bonus: +10 points if >50% bets on their urn lose.  
  - **No real money:** Points → snacks/bragging rights. Top 3 earn snacks.  

  ---

  ### **What Could Go Wrong & Fixes**  
  1. **"Why not take both bets?"**  
     - **Prevented by:** Isolated pricing/betting. If asked, say: "Each bet is priced/bought separately—no bundles."  
  2. **Adversary doesn’t try to win**  
     - **Fix:** Stress: "Your bonus depends on making bettors lose!" Most will set extremes (e.g., 100 red).  
  3. **Pricing confusion**  
     - **Fix:** Run a coin-flip demo first ("Price a bet on heads: win 100 points").  
  4. **Time crunch**  
     - **Fix:** Skip repeated betting simulation; use pre-generated 50/50 sequence.  
  5. **Weak effects**  
     - **Fallback:** Use pre-collected data from past classes to show expected pattern.  

  ---

  ### **What the Game Can’t Reproduce**  
  - **Theoretical nuance:** You’ll need to clarify that no *single prior* reconciles the pattern.  
  - **Probability vs. uncertainty:** Students may conflate risk (known probabilities) and ambiguity (unknown). Debrief explicitly.  
  - **Ellsberg’s math:** Post-game, walk through why `P(Red) + P(Black) = 1` must hold under expected utility.  

  This plan creates experiential friction, leverages your three-condition twist, and forces students to confront why they feel uneasy about the ambiguous urn—setting up a powerful "aha" moment when you reveal Ellsberg.
