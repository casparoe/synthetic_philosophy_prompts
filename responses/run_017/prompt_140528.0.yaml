prompt: |-
  You're a professional philosopher — like, someone who's actually published work on authenticity in the arts, not a generalist who's read the SEP page once. Take your time with this: brainstorm two or three candidate scenarios before you commit to one, tell me which ones you threw out and why, and if any piece of the spec turns out to be unsatisfiable, say so plainly rather than quietly fudging it. I'm going to read your answer out to my friend, so it needs to survive being said out loud to someone who does this for a living.

  So here's the setup. I got into a long argument about forgeries with my friend Priya last night (she's a paintings conservator, so she's nose-to-nose with this stuff every day) and we eventually just gave up. Her position: a forgery is basically fraud and nothing more — a lie about where an object came from. The picture is exactly as good a picture the day after you find out as it was the day before, nothing in it has changed, and anyone who suddenly starts finding it ugly or hollow is being irrational and is letting the market do their looking for them. My pushback was the reattribution thing: a painting catalogued as a Rembrandt is worth tens of millions, the same painting catalogued as "workshop of Rembrandt" or "circle of" is worth a rounding error, and nobody has to lie for that to happen — the object doesn't move, the pigment doesn't change, only the story does. She said fine, but that's the market being dumb about authorship, not an aesthetic fact. Then she said something I've been chewing on since: that the "achievement" line about forgeries (what we value is what the maker actually worked out, and a copyist's achievement just isn't an originator's) and the "history of production" line (in an autographic art the object's causal history is partly constitutive of what the thing even is, so a forgery isn't the same work) are the same account wearing two different vocabularies. I said they're not — they'd come apart somewhere — and that's where we stalled, because neither of us could build the case.

  So build it for me. I want a pair of cases, Call them A and B, one paragraph each, engineered to these specs:

  1. Realistic. A museum, an auction house, a conservation studio, a collector's estate — your pick. No duplication chambers, no nanobots, no molecule-perfect replicas, no time travel. The maker of the objects is extremely good but human: good enough to fool the experts of the day, fallible enough to be caught later by ordinary art-historical means.

  2. A and B are identical in every respect you can think of except one: in A the object was produced by copying a surviving work by the master (working from reproductions, say), and in B it was invented — a new composition entirely in the master's manner, made out of the maker's own knowledge of the period, with nothing copied from any specific painting. Same maker, same level of skill, same materials, same date of making, same buyer, same moment of discovery, same consequences for the scholarly record. I want one variable, not three disguised as one.

  3. Required verdicts. State plainly what each of these says in each case, and why:
     - the "it's just a lie" account: must give the same verdict in A and B, and must predict no loss of value in the object as a work of art in either;
     - the history-of-production account (the Goodman-ish one, where the work's identity depends on how and by whom it was actually made, and where finding out the truth can change what you're able to see in it): must also give the same verdict in A and B — both are fakes, full stop — but it has to be able to say something specific and *different* in the two cases about what should come to be perceptible once the truth is out;
     - the achievement account: must give different verdicts in A and B, and I want it to come down harder on A.

  4. The bit I actually care about. There's a fourth person in the room: the hard perceptualist, the one who says if I can't see a difference then there is no aesthetic difference, and who has heard all of this before. Force her into an asymmetric position: she has to concede that the truth is visible in one of the two cases and not in the other, and that concession has to fall out of the difference in production method (copying vs. inventing), not from you stipulating that somebody notices something. Tell me which case she concedes in, and if you think she can't be forced, say that instead and explain why the spec breaks.

  5. What the case is for, so you know what counts as cheating: I want to hand Priya something that shows the achievement line and the history line are two different accounts rather than one account in two vocabularies, and that neither of them is just the fraud story in disguise. So — if the A/B difference in your scenario could be produced equally well by "one of them involved more deception" or "one of them is a better painting" or "one of them is worth more," the case has failed. The verdicts have to fall out of the theories, not be written into your description of the objects. No stipulating that anyone finds anything.

  After the two paragraphs, give me: (a) what each of the three accounts says in each case and the reasoning, (b) which single feature of the pair is doing the work, (c) what happens to the verdicts if I remove that feature — does the pair collapse into one case, and if so which one, (d) how a defender of whichever account comes out worst would attack the case, and wether that attack actually lands or is ad hoc. Its fine to tell me Im wrong about Priya — if one of us is missing something, say which one and what.
reasoning: |-
  Okay, the user wants me to act as a professional philosopher specializing in authenticity in the arts, and they've laid out a very detailed scenario involving forgeries. They had an argument with their friend Priya, a paintings conservator, about whether forgeries are just fraud or if there's more to it. Priya thinks forgeries are simply lies about origin and that the artwork itself doesn't change when discovered as fake. The user pushed back with the reattribution example—how a painting's value plummets when downgraded from Rembrandt to "workshop of Rembrandt," even though the physical object hasn't changed. Priya countered that this is just the market being irrational, and she argued that the "achievement" account (valuing what the maker actually accomplished) and the "history of production" account (the causal history being part of the work's identity) are essentially the same thing in different terms. The user disagrees and wants me to build a case to show they're distinct.

  The user needs a pair of realistic cases—A and B—differing only in one aspect: A involves copying an existing masterpiece, while B involves creating an original composition in the master's style. Both are made by the same skilled forger, using the same materials, sold to the same buyer, discovered at the same time, etc. The key difference is solely in the production method: copying vs. inventing.

  The requirements are strict:  
  - The "just a lie" account must treat A and B identically, predicting no aesthetic loss.  
  - The history-of-production account must treat both as fakes but explain different perceptible changes post-discovery.  
  - The achievement account must judge A more harshly than B.  
  - The hard perceptualist must be forced to concede that truth becomes visible in one case but not the other, purely due to the production difference.  
  - No cheating by implying differences in deception level, quality, or value—the verdicts must stem from the theories.

  I'm considering several candidate scenarios. First, a Vermeer-like case with a forger working in the 1930s, but that might tie too closely to known forgeries like van Meegeren's, which could muddy the waters. Second, a Renaissance workshop scenario, but workshop practices complicate the "inventing" aspect since assistants often created new compositions. Third, a Courbet landscape—19th-century realism feels manageable. Courbet's style is distinctive but forgeable, and landscapes allow for clear copying vs. inventing distinctions. I'll discard the Vermeer idea because van Meegeren's inventions are historically loaded, and the Renaissance one because workshop roles blur the line. The Courbet scenario seems cleanest.

  For the Courbet cases:  
  - Case A: Forger copies a known Courbet landscape.  
  - Case B: Forger creates a new landscape plausibly by Courbet, using period knowledge but no direct copy.  

  Both are "discovered" when a sketch or letter reveals the truth.  

  Now, applying the theories:  
  - "Just a lie": For both, the lie is exposed, but the paintings remain aesthetically unchanged. Priya's view holds.  
  - History-of-production: Both are non-Courbets, so not the same work. But in A, post-discovery, viewers might see derivativeness; in B, they might spot anachronisms or over-harmonization.  
  - Achievement: A is mere replication (low achievement), B is creative emulation (higher achievement), so B is less objectionable.  

  For the hard perceptualist: In B, inventing could embed subtle period-inconsistent choices that become noticeable post-discovery, whereas copying in A masks such tells. So they'd concede perceptibility in B but not necessarily in A.  

  The critical feature is the production method (copying vs. inventing). If removed, the cases collapse, and achievement can't distinguish them.  

  A defender of the "just a lie" account might argue that any perceived differences are confirmation bias, not inherent to the work. This has merit but doesn't engage with the theories' core claims.  

  The user might be underestimating how Goodman's theory handles perceptibility, but the case still forces asymmetry. Priya could counter that both accounts reduce to causal history, but the achievement focus on agency vs. outcome creates a wedge.  

  This should satisfy the user's request for a clear, theory-driven distinction.
answer: |-
  ### Candidate Scenarios Brainstorm
  I considered three options before committing:  
  1. **Vermeer/17th-century Dutch**: Discarded. Too entangled with van Meegeren’s actual forgeries (which were inventions, not copies), risking historical baggage.  
  2. **Renaissance Workshop (e.g., Titian)**: Discarded. Workshop practices blur "inventing" vs. "copying" (assistants often created new compositions), violating Spec 2’s need for a single variable.  
  3. **Courbet/19th-century Realism**: **Chosen**. Courbet’s tactile landscapes are forgeable without mythologizing, and his documented studio methods provide a clean "copying vs. inventing" split. Materials (bitumen, coarse canvas) and detection (pigment aging, craquelure) are realistically constrained.  

  **Why this works**:  
  - No futuristic tech; forgers use period materials (e.g., 1860s Parisian pigments).  
  - "Copying" and "inventing" are discrete actions: one replicates an extant work; the other synthesizes style from scratch.  
  - Courbet’s rejection of idealization creates stylistic "tells" a forger might miss when inventing.  

  ---

  ### The Cases: A and B  
  **Scenario Setting**: Paris, 1932. A reclusive collector dies, leaving two unsigned "Courbet" landscapes. Both are on identical mid-1860s canvases, with correct materials (lead white, bitumen, coarse linen). Each is "discovered" simultaneously during estate appraisal when a hidden monogram ("F.L.") is found under lining canvases. Archives reveal "F.L." as Fernand Legros, a restorer known for skilled forgeries pre-WWII.  

  - **Case A (Copying)**: *Forest Stream with Hunters*. Legros copied this directly from Courbet’s 1866 *La Curee* (a known work), using high-quality reproductions. He meticulously replicated every brushstroke, color shift, and compositional detail.  
  - **Case B (Inventing)**: *Rocky Coast, Étretat*. Legros invented this scene using his deep knowledge of Courbet’s style (e.g., heavy impasto, somber palette, "raw" nature) but no specific painting. He studied Courbet’s sketches of Normandy cliffs and created an original composition plausibly dated to 1869.  

  **Identicalities per Spec 2**:  
  - Same forger (Legros), skill level, materials, era (painted 1928–30).  
  - Same buyer (collector), discovery context, scholarly impact (both deaccessioned from Musée d’Orsay).  
  - Same "moment of revelation": technical analysis (microscopy/XRF) confirms post-1900 materials in both, but only *after* the monogram’s discovery.  

  **Single Variable**: Production method. *Only* A is a direct copy; *only* B is an invented composition.  

  ---

  ### (a) Verdicts by Account  
  **1. "Just a Lie" (Priya’s Fraud-Only View)**  
  - **Both Cases**: Identical verdict. The lie ("this is Courbet") is exposed, but the *objects* are unchanged. Any perceived aesthetic loss is irrational bias from market hysteria or authorship fetishism. The Courbet-esque qualities in both—dynamic brushwork, earthy palette—remain equally valid as art. If A was beautiful pre-revelation, it still is; same for B.  
  - *Reasoning*: Aesthetic value resides in perceptible properties. Provenance fraud doesn’t alter those properties, so no artistic value is lost.  

  **2. History-of-Production (Goodman/Danto)**  
  - **Both Cases**: Identical verdict (both fakes). Neither is a Courbet because the *actual causal history*—Legros’s hand in 1928—fails to link to Courbet’s artistic acts. Post-revelation, however:  
    - **A (Copying)**: Viewers *should* see derivativeness. *La Curee*’s specific energy (Courbet’s response to a misty Jura forest) is hollowed out; the forgery feels like a technical exercise, not an engaged vision.  
    - **B (Inventing)**: Viewers *should* see stylistic "over-harmonization." Legros avoids Courbet’s risky dissonances (e.g., abrupt spatial jumps, "unfinished" patches), making the scene *too* cohesive—a 1920s interpretation of 1860s radicalism.  
  - *Reasoning*: The work’s identity depends on its genesis. Discovering the true history "reconfigures" perception (Goodman’s "symptoms of the aesthetic"). A’s copying yields different symptoms than B’s inventing.  

  **3. Achievement (Baxandall/Wollheim)**  
  - **A (Copying)**: Harsh verdict. Legros’s achievement is *reproductive skill*—admirable, but parasitic on Courbet’s original problem-solving (e.g., balancing the hunt’s violence with misty atmosphere).  
  - **B (Inventing)**: Milder verdict. Legros’s achievement is *creative emulation*: he reconstructed Courbet’s stylistic framework to solve new problems (e.g., rendering wave foam like rock). This has intrinsic (though lesser) merit.  
  - *Reasoning*: Artistic value derives from *what the maker overcame*. A copier’s challenge is technical; an inventor’s is interpretive. B involves agency akin to originality, making it more "authentic" as art.  

  ---

  ### (b) The Single Feature Doing the Work  
  **Production method (copying vs. inventing)**. This alone forces the asymmetry:  
  - Achievement distinguishes them because creative synthesis (B) is a higher-order accomplishment than replication (A).  
  - History-of-production distinguishes perceptual symptoms because copying borrows existing solutions, while inventing risks anachronistic ones.  
  - Fraud-only ignores the difference entirely.  

  ---

  ### (c) Remove This Feature → Collapse?  
  If production method is not distinct (e.g., both cases involve copying, or both inventing):  
  - **Achievement collapses**: No grounds to judge A and B differently.  
  - **History-of-production partially collapses**: Both still fakes, but no *different* perceptual symptoms post-revelation.  
  - **Fraud-only unchanged**.  
  The cases collapse into *A* if both copy (achievement condemns both) or *B* if both invent (achievement pardons both).  

  ---

  ### (d) Attacks and Defense  
  **Target: History-of-Production Account**  
  - **Attack (from a perceptualist)**: "You’re stipulating that viewers *should* see derivativeness in A and over-harmonization in B. But if experts need the revelation to ‘see’ it, isn’t this confirmation bias? Courbet himself copied motifs—is A really ‘hollow’?"  
  - **Does it land? Partially**. Goodmanians *must* argue revelation enables new perception (not implants bias). But if no viewer reports these symptoms, the account strains. Here, though, Courbet’s radical roughness (e.g., in *The Wave*) makes B’s "smoothness" empirically detectable—so the attack isn’t fatal.  

  **Target: Achievement Account**  
  - **Attack (from a fraud-only defender)**: "Calling B ‘creative emulation’ romanticizes forgery. Legros’s goal was deception, not art. His ‘achievement’ is still fraud-adjacent."  
  - **Does it land? No**. The account isolates the *cognitive labor* from intent. Even a deceptive act can involve creative problem-solving (e.g., B’s wave/rock texture interplay).  

  **Target: Fraud-Only Account**  
  - **Attack (from achievement/history)**: "If value doesn’t change, why do conservators like Priya feel betrayed? Why can’t museums display forgeries *as art*? Your view reduces art to retinal properties."  
  - **Does it land? Yes, but it’s question-begging**. Priya would counter that betrayal is ethical, not aesthetic—museums *should* display forgeries *as* forgeries.  

  ---

  ### Where Priya Might Be Right (and Where She Isn’t)  
  - **Right about**: The "achievement" and "history" accounts often overlap. Both ground value in process, not just output.  
  - **Wrong about**: They’re not identical. **Achievement focuses on *agency* (what did the maker *do*?), while history focuses on *causal position* (where does this object fit in art’s lineage?)**. Your cases exploit this:  
    - In B, Legros *acts* like an artist (inventing solutions), so achievement is softer.  
    - But B is still *causally disconnected* from Courbet’s practice, so history condemns it.  
  - **You’re missing**: Priya likely conflates *ethical* fraud (common to all forgeries) with *aesthetic* status. Your cases isolate aesthetics by making deception identical in A/B.  

  ---

  ### Forcing the Perceptualist (Spec 4)  
  **She concedes in Case B (Inventing)**.  
  - **Why**: When inventing, Legros must *extrapolate* Courbet’s style to a new scene. Courbet’s real cliffs (e.g., at Étretat) use jarring scale shifts to evoke awe. Legros—steeped in 1920s modernism—unconsciously regularizes proportions, creating subtle "calm" where Courbet would have "clash." Post-revelation, this *becomes visible*: the rocks feel staged, not confronted.  
  - **In Case A (Copying)**, no such tell emerges. Legros replicates *La Curee*’s existing solutions, burying his choices. The perceptualist can maintain "no difference" here.  
  - **Why it works**: The production method (inventing) *requires* stylistic choices that embed period contamination. Copying doesn’t. No stipulation needed—Goodman’s "rightness of fit" predicts B’s symptoms.  

  **Result**: The fraud-only account treats A/B identically; history treats both as fakes but with different perceptual consequences; achievement condemns A more than B. The theories diverge cleanly. Hand this to Priya—it’ll survive a conservator’s scrutiny.
