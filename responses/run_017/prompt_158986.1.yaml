  Hmm, the user is putting together a decision tree handout for an advanced seminar on modality and semantic content. They've identified a problem where students can recite labels for classic thought experiments but blur together distinct philosophical positions. They want a decision tree that sorts views based on how they handle concrete cases rather than names, starting from shared commitments about necessary a posteriori truths and reference determination.

  The tree needs to cover several key distinctions: status of the a priori-accessible intension (semantic content vs. knowledge about reference), nature of the two dimensions (modality/context/epistemic), role of deep necessity (philosophical work vs. bookkeeping), treatment of essentially indexical expressions (special apparatus vs. unified framework), and whether conceivability is load-bearing or detachable. The leaves should name positions like Kripkean direct reference, Chalmers-style epistemic two-dimensionalism, Stalnaker/Kaplan contextualism, descriptivist variants, and Soames' skepticism.

  The constraints are important: for advanced undergraduates who know cases but little secondary literature, so vocabulary must be limited and questions answerable from concrete examples. Need to collapse leaves where positions actually overlap, and map empty cells in the logical space with explanations of why they're unoccupied (incoherent/unattractive/unclaimed). Also need to keep semantic and epistemological questions separate, unlike their colleague's philosophy of mind version.

  The key will be crafting binary questions that force distinctions without presupposing theory-laden vocabulary. For example:
  - First question could tackle the semantic status of intension by contrasting "Hesperus is Phosphorus" with "water is H2O" to see if students view the cognitive significance as part of meaning
  - Next might distinguish dimensions by examining how "I am here now" behaves across contexts versus epistemic scenarios
  - Then probe deep necessity's role through whether zombie arguments reveal something metaphysically impossible or just epistemically opaque
  - Fourth question on indexicals could use Perry's shopper case to test if they need special treatment
  - Finally, conceivability's weight by asking if we could discover Twin Earth water isn't H2O

  For empty cells, positions that deny semantic content to intensions while giving deep necessity philosophical work might be unattractive (why privilege epistemically accessible necessity if it's not semantic?), while combining descriptivism with direct reference machinery might be incoherent. The most discriminating questions will likely be the first (semantic status of intension) and second (nature of dimensions), as they split Kripkeans from two-dimensionalists immediately, while the conceivability question mainly separates Chalmers from Stalnaker.
answer: |-
  Here’s a decision tree designed to sort views by their *answers to concrete cases*, not labels. It starts from your shared commitments and branches via binary questions answerable from cases alone. Empty cells are flagged, and redundant branches noted.  

  **Shared Starting Point**:  
  All students accept:  
  - Some identities are necessary but knowable only a posteriori (e.g., "Hesperus = Phosphorus," "Water = H₂O").  
  - A term can refer despite most associated descriptions being false (e.g., "water" on Twin Earth refers to XYZ, not H₂O).  

  ---

  ### **Decision Tree**  
  *(Answer each question with **Yes** or **No**, based on case judgments)*  

  1. **When competent speakers grasp a term (e.g., "water"), is the a priori-accessible intension (e.g., "watery stuff") part of its *semantic content*?**  
     - *Test Case*: On Twin Earth, does "water is watery" express a contingent or necessary truth?  
     - **Yes** → Go to Q2.  
     - **No** → Go to Q3.  

  2. **Is the primary ("deep") necessity *philosophically robust*? (Does it explain metaphysical possibility, mind-body relations, etc.?)**  
     - *Test Case*: Can zombies (physically identical but non-conscious beings) tell us about *metaphysical* possibility?  
     - **Yes** → **Epistemic Two-Dimensionalism (Chalmers)**.  
       *(Intension is semantic; deep necessity does work; zombies reveal metaphysical limits.)*  
     - **No** → **Unoccupied** (incoherent: if intension is semantic, deep necessity can’t be *just* bookkeeping).  

  3. **Are the two dimensions tracking distinct kinds of *modality* (metaphysical vs. epistemic)?**  
     - *Test Case*: Is "Hesperus might not be Phosphorus" true in *any* modal context?  
     - **Yes** → Go to Q4.  
     - **No** → Go to Q5.  

  4. **Do essentially indexical expressions (e.g., "I," "now") require *separate rules* beyond the two-dimensional framework?**  
     - *Test Case*: Does "I am here now" have a different *semantic structure* than "water is H₂O"?  
     - **Yes** → **Metasemantic/Contextualist (Stalnaker, Kaplan)**.  
       *(Dimensions = context + modality; indexicals need distinct apparatus; conceivability is non-load-bearing.)*  
     - **No** → **Unoccupied** (unattractive: collapses indexicality into general two-dimensionality, losing Kaplan’s insights).  

  5. **Is the framework’s conceivability apparatus *load-bearing* for explaining reference or necessity?**  
     - *Test Case*: If we discovered Twin Earth "water" isn’t XYZ (but something else), would this challenge the *semantic theory*?  
     - **Yes** → **Collapse: Epistemic Two-Dimensionalism (Chalmers)**.  
       *(Conceivability fixes reference; differs from Q2 only if semantic content is rejected—but Q1 already sorted this.)*  
     - **No** → Go to Q6.  

  6. **Can reference-fixing descriptions (e.g., "the liquid causing XYZ") explain necessary a posteriori truths *without being semantic content*?**  
     - *Test Case*: Is "the standard meter is one meter long" contingent *de re* but necessary *de dicto*?  
     - **Yes** → **Descriptivist/Reference-Fixer Variant (Jackson, Lewis)**.  
       *(Grants cases but treats "meter" semantically as descriptive; conceivability is idle.)*  
     - **No** → **Direct Reference + Skepticism (Kripke, Soames)**.  
       *(No semantic role for intensions; two-dimensionalism misdescribes modal epistemology.)*  

  ---

  ### **Empty Cells & Collapses**  
  - **Q2→No**: Incoherent (see above).  
  - **Q4→No**: Unoccupied and unattractive (no theorist denies indexicals need special treatment).  
  - **Q5→Yes**: Collapses into Chalmers (conceivability is load-bearing only if intension is semantic, per Q1).  
  - **Leaves merging**:  
    - Soames/Kripke grouped: Both reject semantic intensions (Q1→No) and treat conceivability as non-load-bearing (Q5→No).  
    - Stalnaker/Kaplan distinct from Chalmers via Q1 (No vs. Yes) and Q4 (indexicals separate).  

  ---

  ### **Which Questions Do the Work?**  
  - **Q1 (semantic status of intension)** is the critical cut:  
    - *Yes* → Chalmers or incoherent.  
    - *No* → All others (Stalnaker, Descriptivists, Kripke/Soames).  
  - **Q3 (dimensions as modality)** splits the "No" branch:  
    - *Yes* → Stalnaker/Kaplan.  
    - *No* → Descriptivists vs. Kripke/Soames.  
  - **Q5 (conceivability load-bearing)** is **redundant** if Q1→No (all answer "No") or Q1→Yes (only Chalmers answers "Yes").  
  - **Q4 (indexicals separate)** is vital: isolates Stalnaker/Kaplan from others.  
  - **Q6 (reference-fixers semantic?)** splits descriptivists from direct reference skeptics.  

  **Final Note**: The tree discriminates best when prioritizing Q1 → Q3 → Q4/Q6. Q2 and Q5 are eliminable (Q2 collapses, Q5 is derivable from Q1). Focus students on *cases* at each node (e.g., Twin Earth for Q1, zombies for Q2) to avoid slogan-matching.
