prompt: |-
  I'm a high school senior writing an extended research paper on assisted dying — specifically on what the law should permit when a competent adult asks a doctor to prescribe or administer a drug that will end their life. My teacher's main criticism of my drafts is that I argue case by case: I produce an example, show that some view I dislike handles it badly, and declare victory. She wants me to say first what any adequate view would have to be able to do, and only then test views against that. So that is what I am asking you for: the specification, not the verdict.

  The purpose the view has to serve: it should be good enough to guide an actual legal rule in a country with decent palliative care but very uneven social support, where doctors are fallible and overworked, where some patients are poor or isolated, and where some depend on relatives for daily care. If a view is only adequate for ideal institutions or ideal families, mark that as a limitation instead of letting it slide in unnoticed.

  What I would like from you:

  1. The list of requirements a view has to meet, each with the case or consideration behind it, so I can see why it belongs on the list rather than just take it on faith.
  2. For each requirement, whether it is non-negotiable, a preference of one camp, or genuinely negotiable — and please tell me plainly if any of the things people demand in this debate are really just the prejudices of one side dressed up as standards.
  3. The pairs of requirements that I suspect cannot be jointly satisfied, with the argument for why not. If the list turns out to be unsatisfiable as a whole, tell me which requirement you would drop and what that costs.
  4. Which single requirement does the most work in ruling out popular positions.

  The cases I think a view has to handle — please use them, correct them, or replace them with sharper versions, and add any that are missing:

  - The request that is partly socially caused: a young person with a severe disability, competent and stable in what she says over many months, whose suffering is real but is largely produced by inadequate care funding, inaccessible housing, and isolation. The same state that underfunded her support is being asked to authorise her death. I do not know whether the right requirement is that the view must handle this at all, or that it must say something specific about it: I keep finding that views which appeal only to autonomy have nothing to say, and views that appeal only to injustice end up telling her she is not really choosing.
  - The deadline case: someone whose suffering is unbearable now but who, on the best available evidence, would probably be glad in two years that the request was refused. Whatever the view says here has to confront the fact that we routinely let competent people take large risks of death for reasons we think unwise, and sometimes refuse them things for their own future good.
  - The cases we already permit: refusing life-saving treatment, having treatment withdrawn, deep sedation at the end of life, and high-dose pain relief given foreseeably but not intentionally to hasten death. Any view must deal with these, and I think it fails if the only difference it can point to is who physically performs the last act.
  - The professional-role case: why a doctor, and what follows if no doctor will participate. Is the appeal to medicine's internal norms doing real work, or is it gatekeeping?
  - The scope case: someone who clearly stated years ago that she wanted assistance if she ever reached advanced dementia, and now cannot reaffirm it. Is covering or not covering this a legitimate choice of scope, or is a view incomplete without an answer?
  - The expressive case: whatever rule we adopt is also a message to people whose lives resemble the lives being ended. I am unsure whether being required to handle this is a real desideratum or a political one.
  - The administrability case: if the test asks whether suffering is unbearable and beyond improvement, someone has to decide, under uncertainty, with an error rate. I want to know which direction the burden of proof should fall and whether any view can avoid this problem rather than just relocate it.

  Finally, only in the last few lines, score the four positions I keep meeting — an appeal to the sanctity of life, an appeal to autonomy, an appeal to the relief of suffering, and an appeal to the integrity of medicine — against the requirements you marked non-negotiable. Keep that part short; the list and its motivating cases are the part I care about. Please do not give me sources, reading lists, or citations, and please do not just restate the autonomy-versus-sanctity-of-life debate, which I have already read plenty of.
reasoning: |-
  Okay, let me approach this systematically. The student needs a framework to evaluate assisted dying policies, grounded in real-world constraints rather than idealized scenarios. They've identified seven cases that expose tensions in common positions.

  First, I'll consider their "social causation" case where structural failures create suffering. Any viable policy must acknowledge this without negating agency. The requirement here is that the view must distinguish between suffering caused by medical conditions versus socially remediable factors, without delegitimizing the patient's experience. This is non-negotiable for avoiding exploitation.

  For the "deadline case" involving fluctuating will, the core requirement is respecting contemporaneous autonomy while preventing irreversible harm during temporary despair. This creates tension with how we handle other risky choices. The burden of proof must favor preservation when recovery is probable - non-negotiable for protecting vulnerable populations.

  The comparison to existing end-of-life practices necessitates consistency. If withdrawing life support is permissible, the physical actor distinction seems arbitrary. A coherent view must either justify this distinction or reject it - non-negotiable for logical integrity.

  Regarding medical gatekeeping, the requirement is that physician involvement shouldn't create inaccessible barriers while maintaining ethical oversight. This exposes a dilemma: making doctors gatekeepers may protect against coercion but risks scarcity-driven denials.

  The dementia case requires addressing precedent autonomy versus present interests. This might be legitimately negotiable since policy boundaries must be drawn somewhere.

  The expressive impact on vulnerable groups is non-negotiable - policies send social messages that affect real behavior. Data shows suicide contagion risks.

  Administrability is crucial: any standard relying on subjective suffering assessments will have error rates. The burden must favor life when uncertainty exists - non-negotiable for feasibility.

  Now evaluating common positions:
  - Sanctity of life fails the consistency test (allows treatment withdrawal but not assisted dying)
  - Pure autonomy fails the deadline case and structural injustice concerns
  - Suffering-focused views struggle with administrability and social causation
  - Medical integrity risks gatekeeping and accessibility issues

  The deepest tension lies between preventing coercion in unjust conditions and respecting genuine autonomy. No policy perfectly resolves this, but prioritizing administrable safeguards comes closest.
answer: |-
  Here is a specification of requirements for a view on assisted dying, designed for real-world legal implementation. Each requirement is derived from your cases and contextual constraints, with its rationale, negotiability status, and conflicts highlighted. The four positions are scored briefly at the end against non-negotiable requirements.

  ### **Core Requirements & Their Rationale**
  *(Non-negotiable = Essential for minimally just policy; Negotiable = Reasonable views may differ)*

  1.  **Distinguish Suffering Sources**  
      *Rationale*: From your "socially caused suffering" case. A view must acknowledge when suffering stems from remediable social injustice (e.g., isolation, poverty) vs. irremediable illness, without invalidating the patient’s experience.  
      *Negotiability*: **Non-negotiable**. Failing this enables states to "solve" systemic failures via death.  
      *Conflict*: Clashes with pure autonomy (ignores context) and pure suffering-relief (may overlook injustice).

  2.  **Temporal Competency Safeguard**  
      *Rationale*: From your "deadline case." Must account for evidence that suffering/desire to die may be transient (e.g., depression treatable within months). Must reconcile with other high-risk choices (e.g., extreme sports).  
      *Negotiability*: **Non-negotiable**. Prevents irreversible harm during temporary despair.  
      *Conflict*: Tension with autonomy (competent adults usually decide risks) and suffering-relief (present agony may demand urgency).

  3.  **Consistency with Existing Practices**  
      *Rationale*: From "cases we already permit." If withdrawing life support or deep sedation is ethical/legal, rejecting assisted dying *solely* because a doctor administers death is incoherent.  
      *Negotiability*: **Non-negotiable**. Arbitrary distinctions undermine moral/logical credibility.  
      *Conflict*: Challenges sanctity-of-life views that permit passive dying but not active assistance.

  4.  **Avoid Medical Gatekeeping**  
      *Rationale*: From "professional-role case." Medical norms must not be the *primary* justification, as overworked doctors may err, and conscientious objection could deny access.  
      *Negotiability*: **Negotiable**. Medicine’s role can be debated, but it cannot create unjust barriers.  
      *Limitation*: If doctors refuse, an alternative pathway (e.g., state panels) must exist.

  5.  **Clarity on Precedent Autonomy**  
      *Rationale*: From "scope case" (advanced dementia). Must explicitly state if advance directives are valid when competence is lost, or require contemporaneous consent.  
      *Negotiability*: **Negotiable**. Societies may reasonably choose either scope, but the view must commit.  
      *Risk*: Ignoring this creates hidden cruelty (e.g., binding people to past wishes they can’t affirm).

  6.  **Expressiveness Constraint**  
      *Rationale*: From "expressive case." The law signals whose suffering is "unbearable enough" to warrant death, impacting marginalized groups (e.g., disabled, elderly).  
      *Negotiability*: **Non-negotiable**. Laws shape social norms; ignoring this risks coercion or abandonment.  
      *Conflict*: Pure autonomy dismisses this as paternalism; suffering-relief may amplify "burden" messaging.

  7.  **Administrable Uncertainty Standard**  
      *Rationale*: From "administrability case." Any test for "unbearable suffering" or "irremediability" faces ambiguity. Requires clear burden of proof (e.g., "must prove beyond reasonable doubt that suffering is irremediable").  
      *Negotiability*: **Non-negotiable**. Vague standards lead to arbitrary or discriminatory outcomes.  
      *Conflict*: All views struggle here, but suffering-relief is most vulnerable (pain is subjective).

  ---

  ### **Key Conflicts Between Requirements**
  -   **Suffering Sources vs. Pure Autonomy**: Autonomy-focused views cannot address socially caused suffering (Req 1) without importing external justice criteria, which may override individual choice.  
  -   **Expressiveness vs. Suffering-Relief**: If the law validates death for suffering largely caused by social neglect (Req 1), it signals that certain lives aren’t worth supporting (violating Req 6).  
  -   **Temporal Safeguard vs. Autonomy**: Delaying assistance for possible future relief (Req 2) may override a competent person’s current wish, contradicting autonomy.  
  -   **Consistency Requirement vs. Sanctity-of-Life**: Sanctity views allow passive death (e.g., withdrawing treatment) but prohibit active assistance, violating Req 3’s demand for non-arbitrary distinctions.

  ---

  ### **Most Disqualifying Requirement**
  **Req 1 (Distinguish Suffering Sources)** does the most work in ruling out popular positions:  
  -   **Pure autonomy** fails: It cannot critique requests caused by injustice, risking state complicity in neglect.  
  -   **Suffering-relief** fails: It may approve deaths where suffering is remediable by social support, violating expressiveness (Req 6).  
  -   **Medical-integrity** fails: Doctors lack tools to diagnose "social vs. medical" suffering.  
  *Only hybrid views (e.g., autonomy + social justice) can satisfy this.*

  ---

  ### **Unsatisfiable Requirements?**
  The list is *collectively unsatisfiable* in an ideal sense due to:  
  - **Req 1 (no death for injustice-induced suffering)** vs. **Req 7 (administrability)**: Truly distinguishing "social" vs. "medical" suffering requires utopian social-work resources.  
  *Which to drop?* Req 7 (clear standards) is least droppable—without it, law becomes unworkable. Instead, **modify Req 1**: Demand that policies *minimize* injustice-induced requests via robust social safeguards (e.g., mandatory support offers), not perfect diagnosis. *Cost*: Some unjust deaths may occur, but fewer than under no constraints.

  ---

  ### **Scoring Major Positions**
  *(Against non-negotiables: Req 1, 2, 3, 6, 7)*  

  | **Position**          | **Score**                                                                 |  
  |------------------------|---------------------------------------------------------------------------|  
  | **Sanctity of Life**   | Fails Req 3 (inconsistent with allowing treatment withdrawal/sedation).   |  
  | **Pure Autonomy**      | Fails Req 1 (ignores social injustice) and Req 2 (no temporal safeguards). |  
  | **Suffering-Relief**   | Fails Req 1 (may approve injustice-driven deaths) and Req 7 (unadministrable). |  
  | **Medical Integrity**  | Fails Req 4 (gatekeeping if doctors refuse) and Req 7 (suffering is non-medical). |  

  **Result**: All popular positions fail at least one non-negotiable requirement. A viable view must hybridize elements (e.g., autonomy + safeguards against injustice + temporal limits).
