prompt: |-
  so I'm two thirds into a novel and I've written myself into a corner that turns out to be a philosophy problem, so I need the spec before I write the last third.

  Two threads. (1) The republic in the book — which I've been makeing up as I go — ratified a Founding Charter about forty years before the action starts. The Charter contains what everybody in the book calls the Durability Clause: the founding generation, who had just come out of a long civil war and didn't trust themselves, wrote in that certain provisions can't be repealed except by a two-thirds vote followed by a nine-year wait, during which the repeal has to be re-passed twice. Now a clear majority wants out, they've done the first votes, and they're five years into the wait. (2) A character, Mira, has a recurrent bipolar illness; years earlier, between episodes, she signed a standing instruction with her clinic saying that if she ever refuses her medication she's to be treated anyway, and that her refusal at the time isn't to count as a refusal. She's refusing now, she says she's never felt better, the clinicians think she's in an episode, and the clinic is petitioning to treat her against her will.

  What I want isn't the answer to either case. It's the standard. Before I let my characters argue, I want the requirements list: what any account of when a precommitment legitimately binds the person — or the polity — that made it has to get right, with the case behind each requirement, including the cases I already feel sure about and the ones I can't decide. The ones I know I need handled: Ulysses and the ropes versus Ulysses and the contract (is tying yourself up different from authorizing someone else to tie you?); the person who changes her mind because she learned something, or because she converted, or because someone paid her; the founder's dead hand; the people born later who never voted for the thing; the precommitment that was itself made under pressure; the case where the later self has strictly better information than the earlier one had.

  Distinctions I need it to respect rather than collapse: binding your options versus binding your will versus binding what counts as a reason for you; waiving a right versus handing a power to someone else; "I wasn't competent then" versus "I'm not competent now"; and a precommitment that fails because it was never really mine versus one that fails because it was never really about me.

  Three devices my characters keep proposing, and I need to know whether they're real answers or just ways of making the problem prettier — say which, and why: (a) the ratchet, where a clause can be amended only in the direction of making itself harder to amend, so each generation binds the next one tighter than it was bound; (b) the two-key release, where the precommitment can be lifted only by the present self together with someone who knew the earlier self and is charged with speaking for her; (c) the reversion clause, where the whole thing lapses unless it's reaffirmed every few years — and tell me whether something that has to be re-signed is a precommitment at all or just a habit.

  Then: which requirements are non-negotiable and which are only what one camp happens to want; which pair I should stop hoping to satisfy at the same time; and which single requirement knocks out the most of the usual moves — the "the later self is just a different self with different preferences" move, the "true self / second-order endorsement" move, and the "a constitution isn't a contract, it's a framework that has to stay put for there to be anyone to repeal it" move. A line each on those three is plenty, the criteria are the part I actually need.

  The standard I'm after is one good enough to tell me whether Mira is being kept faith with or being governed by a stranger who happens to share her name, and whether the majority in my republic is being asked to wait or being told to obey its grandparents.

  Also — say how confident you are in what you're claiming, and single out the one thing you're least sure of. I'd rather know where the argument is thin before I put it in somebody's mouth.
reasoning: |-
  Okay, let's tackle this. The user is writing a novel and has hit a philosophical snag with precommitment dilemmas in both personal and political contexts. They need a framework to evaluate when a precommitment legitimately binds, with clear criteria and distinctions. 

  First, I need to unpack their core ask: a "requirements list" for any account of precommitment legitimacy. They've given specific cases (Ulysses variants, changed minds, dead hand problem, etc.) and distinctions (binding options vs will, waiving rights vs delegating power). They also want three devices assessed (ratchet, two-key, reversion) and key philosophical moves critiqued.

  Hmm, the challenge here is balancing theoretical rigor with narrative utility. The user isn't after answers for Mira or the republic, but tools for their characters to debate convincingly. That means the criteria must:
  - Handle both individual and collective cases symmetrically where possible
  - Flag where the two contexts diverge (e.g., "dead hand" matters more for polities)
  - Expose fault lines between autonomy-based vs stability-based justifications

  I notice they're wary of "prettifying" solutions. Good—so devices like the ratchet might paper over tensions without resolving them. The reversion clause especially walks the line between habit and genuine commitment. 

  Their unspoken need might be avoiding philosophical hand-waving. When Mira's clinicians override her, is it paternalism or fidelity? The framework must make that stakes visible. Similarly for the republic: is this delay mechanism democratic rigor or gerontocracy? The criteria should force characters (and readers) to confront tradeoffs.

  Biggest pitfall: conflating competence with identity. "I wasn't me then" vs "I'm not me now" needs sharper handling than standard true-self theories. Also, the information asymmetry case might torpedo simplistic "earlier self knew best" arguments.

  Least confident in assessing the two-key solution. Charging someone to "speak for" a past self risks creating a custodial relationship—but is that more or less authentic than institutional enforcement? Needs more thought.
answer: |-
  Here's a specification for the philosophical standard governing legitimate precommitment, designed to equip your characters for their arguments. It prioritizes clear criteria, distinctions, and addresses your specific cases and proposed devices.

  **Core Purpose of Precommitment:** To protect a persistent core interest, value, or identity against predictable future irrationality, weakness of will, coercion, or temporary shifts in perspective/values, *without* unjustly enslaving the future self/polity to the past.

  **Requirements List (What Any Account MUST Get Right):**

  1.  **Authenticity at T1:** The commitment must genuinely originate from the agent's/polity's core values, beliefs, or rational assessment of long-term interests at the time of commitment (T1). *Case:* A coerced oath during war lacks authenticity. A Charter drafted under genuine shared purpose meets it.
  2.  **Competence at T1:** The agent/polity must possess the cognitive and volitional capacity to understand the commitment's nature, scope, and potential consequences at T1. *Case:* Mira signing *between* episodes likely meets this. Signing *during* mania does not. Founders drafting the Charter soberly post-war likely meet it.
  3.  **Predictable Threat:** The commitment must be designed to counter a *specific, foreseeable* threat to core interests/values that the agent/polity *reasonably predicts* will arise and impair judgment/action at T2 (future). *Case:* Ulysses foreseeing the Sirens' effect. Mira foreseeing manic refusal. Founders foreseeing post-war instability & rash repeal. A clause against unforeseen tech (e.g., banning "future communication devices") fails.
  4.  **Proportionality & Least Restriction:** The means of precommitment must be the least restrictive necessary to effectively counter the predictable threat, and the burden imposed must be proportional to the severity of the threat. *Case:* Ropes vs. Crew Contract: Ropes (binding options) are less restrictive than authorizing others to use force (binding will/power delegation) *if* equally effective. 9 years/3 votes must demonstrably prevent rash repeal better than shorter periods/fewer votes.
  5.  **Identity Persistence Relevance:** The account must address whether the core values/interests the commitment protects remain central to the agent/polity *across* time. *Case:* A religious conversion fundamentally altering core values challenges the commitment's legitimacy *if* it protected the old values. Mere preference change (e.g., liking olives now) doesn't necessarily invalidate a commitment protecting health. Polities must grapple with generational turnover and evolving values vs. enduring principles ("dead hand").
  6.  **Information Asymmetry:** Must handle cases where T2 possesses *crucially better information* than T1 about the situation the commitment addresses. *Case:* Mira learns her "episodes" were misdiagnosed side effects. Republic learns the repealed provision causes unforeseen catastrophe. Legitimacy hinges on whether the *new info fundamentally alters the core threat/value* the commitment addressed, or just the circumstances. *Caveat:* T2 claiming "better info" during *manifest irrationality* (mania) is suspect.
  7.  **Non-Alienation:** The commitment must not fundamentally alienate the agent/polity from its own agency or core identity. It should preserve, not destroy, autonomy in the service of protecting it. *Case:* "Authorizing force if I refuse" preserves Mira's core value (well-being) against episodic distortion. Selling oneself into irrevocable slavery violates non-alienation. The Charter's procedure preserves democratic repeal, just with delay.

  **Essential Distinctions (Must Respect, Not Collapse):**

  *   **Binding Options (Ropes) vs. Binding Will/Reasons (Crew Contract) vs. Delegating Power (Crew Command):** Options: Limits *what you can physically do*. Will/Reasons: Tries to control *your decision-making process*. Delegating Power: Hands authority to *another agent*. Each has different implications for autonomy, effectiveness, and potential for abuse.
  *   **Waiving a Right vs. Handing Power to Someone Else:** Waiving: "I relinquish my right to refuse treatment *in this specific future scenario*." Handing Power: "I give the Clinic *ongoing authority* to decide for me whenever they deem X." Waiving is more targeted and less alienating.
  *   **"I Wasn't Competent Then" (T1) vs. "I'm Not Competent Now" (T2):** The first attacks the commitment's *foundation*. The second is *precisely the scenario the commitment was designed for*. Distinguishing them is crucial (Mira's clinicians argue T2 incompetence *now*; Mira argues T1 incompetence *then*).
  *   **"Never Really Mine" (Authenticity/Competence failure) vs. "Never Really About Me" (Identity/Persistence failure):** The first questions the commitment's origin ("Was it *ever* me?"). The second questions its continuing applicability ("Is it *still* me?"). Both can invalidate, but for different reasons.

  **Assessment of Proposed Devices:**

  1.  **The Ratchet (Only harder to amend):**
      *   **Why it's prettier, not an answer:** It assumes making amendments harder is *always* good, ignoring evolving contexts, unforeseen flaws, or the risk of entrenching harmful rigidity. It exacerbates the "dead hand" problem for future generations. It doesn't address *why* the original commitment binds *now*; it just makes escape harder indefinitely. *Verdict:* A dangerous illusion of stability, not a legitimacy criterion.
  2.  **Two-Key Release (Present Self + Past Self's Proxy):**
      *   **Why it *could* be a partial answer (for individuals):** It directly addresses identity persistence and informational asymmetry. A trusted proxy who "knew her then" can assess if current refusal aligns with T1 Mira's core values *and* if T2 Mira is manifestly impaired. *Verdict:* A potentially legitimate mechanism for *individuals* (like Mira) to operationalize the "Identity Persistence" requirement, especially combined with a competence assessment *now*. More problematic for polities (who speaks for "past citizens"?).
  3.  **Reversion Clause (Lapses unless reaffirmed):**
      *   **Is it precommitment?** Yes, but a weaker form. The initial act *is* a precommitment binding future selves for the interval. Reaffirmation *is* a new commitment.
      *   **Why it's prettier/partial answer:** It mitigates the "dead hand" problem by requiring periodic endorsement. However, it weakens the core function – protecting against predictable *temporary* impairment at T2. If Mira is manic at the reaffirmation point, she dissolves the protection she needs. For the Republic, it transfers the conflict to the reaffirmation vote, potentially *during* the predicted period of instability. *Verdict:* A useful tool for long-term commitments where values/contexts *reasonably* evolve, but potentially undermining for commitments against specific, episodic threats.

  **Knocking Out Philosophical Moves & Non-Negotiables:**

  *   **Non-Negotiable Requirements:** Authenticity (R1), Competence at T1 (R2), Predictable Threat (R3), Non-Alienation (R7). Without these, the commitment lacks legitimacy from the start.
  *   **The Tension Pair:** **Identity Persistence (R5)** and **Information Asymmetry (R6)** are inherently difficult to satisfy simultaneously. Prioritizing strict persistence ignores crucial new knowledge. Prioritizing new information can dissolve commitments too easily. Your standard *must* define how to weigh enduring values against changed facts/understanding.
  *   **Move-Knocker-Outer: Information Asymmetry (R6).**
      *   *Knocks out "Later self is just different":* If the later self has *crucially better information* relevant to the *core protected value*, dismissing it as mere "preference change" is inadequate. It forces engagement with substance, not just identity.
      *   *Knocks out "True Self / Second-Order Endorsement":* During manifest impairment (mania, panic), the "current self" cannot reliably provide second-order endorsement. More importantly, R6 forces the question: *Even if competent now, does new info change the fundamental calculus?*
      *   *Knocks out "Constitution as Framework, not Contract":* While true, R6 demands that even a framework must have mechanisms to respond to *fundamental* unforeseen realities threatening the polity's *survival or core purpose* (the very thing frameworks exist to enable), lest it become a suicide pact. The "9-year wait" *is* the framework's response mechanism; R6 asks if it's sufficient when information asymmetry is extreme.

  **Confidence & Caveat:**

  *   **Overall Confidence:** High (8/10) on the requirements and distinctions as necessary components of a robust standard. They capture the core dilemmas you outlined.
  *   **Least Sure About:** The precise operationalization of **Identity Persistence (R5)**, especially for *polities*. How much value change invalidates the commitment? Is it about core *procedures* (democracy, rights) or specific *outcomes* (a particular economic model)? This is the murkiest requirement, crucial for the "dead hand" problem. *Suggestions for your characters:* Focus on whether the *threat* the clause guards against still exists, and whether the *core function* of the unrepealable provisions remains vital to the Republic's identity (e.g., preventing factional tyranny vs. enforcing a specific social policy). For Mira, focus on whether health/stable self remains her core value.

  **Applying the Standard:**

  *   **Mira:** Legitimacy hinges on **Competence at T1** (was she truly between episodes?), **Predictable Threat** (does refusal *now* fit the scenario she foresaw?), **Competence at T2** (is she *currently* impaired? Clinicians say yes), and crucially, **Information Asymmetry** (has she presented *new, credible info* fundamentally altering the diagnosis or treatment efficacy?). Without compelling new info, the commitment likely binds *because her current refusal is evidence of the impairment she sought to guard against*.
  *   **The Republic:** Legitimacy hinges on **Authenticity & Competence at T1**, **Predictability of Threat** (was post-war instability a valid reason for the Durability Clause?), **Proportionality** (is 9 years/3 votes the least restrictive effective measure?), **Identity Persistence** (does the *core purpose* of the protected provisions still align with the Republic's identity?), and **Information Asymmetry** (has the majority presented *new, unforeseen* reasons for repeal so compelling that waiting 4 more years causes irreparable harm?). The "dead hand" is countered only if the clause's *purpose* is obsolete or harmful *despite* the founders' foresight.

  This standard provides the philosophical "spec" – your characters now have the framework, distinctions, and fault lines to argue *within*, revealing their own priorities and interpretations of these criteria. Good luck with the final third!
