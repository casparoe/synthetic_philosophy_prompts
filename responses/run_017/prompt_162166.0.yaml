     1. Make the belief track the fact in a more stringent way? (But how?)
     2. Require that the belief not be easily wrong? (safety condition: if you believe it, it must be true in nearby worlds)

  But note: the safety condition would avoid the deduction problem? 
     - For q: in nearby worlds, if you believe q, is q true? 
          - In the disguised mule world, you believe q but q is false. And if that world is nearby (for q) then safety is violated.
     - But if we say that the disguised mule world is not nearby (because it's far), then safety holds for q? But we stipulated it is the nearest for q.

     Safety: S safely believes p iff in most nearby worlds where S believes p, p is true.

     In the deduction case, in the disguised mule world (which is nearby for q) you believe q and q is false -> safety fails.

     But if we make the safety condition only consider the worlds that are close for the actual process, then maybe.

     We don't resolve.

  What will go wrong the first time:

  1. Someone might say the skeptical world (disguised mule) isn't close. We stipulated it is the closest for q, but they might argue it's not close at all.

  2. Someone might say "I derived it, so of course I know" and ignore the tracking conditions.

  3. Someone might try to sneak a look at the actual state (e.g., by googling a horse vs zebra). We need to prevent that by using fictional examples or controlling the setup.

  4. In the deduction step, they might question the entailment: does p entail q? In the example, if p is "zebra", then q is "not a disguised mule". Yes, that's entailment.

  5. In the counterfeit case, they might say they would inspect the bill. We must stipulate they don't.

  Note on what the game can't stage:

  - We can't physically simulate the counterfactual worlds. We rely on description and thought experiment.
  - The staking is only a proxy for the cost of being wrong. In real life, the cost of not knowing (by the tracking account) might be that you shouldn't rely on q in high-stakes situations. But we simulate by points.

  Timeline:

  Total 80 minutes.

  - Round 1: 40 min
     - 5 min: setup and explanation of worlds.
     - 10 min: p and staking (including analysis of tracking conditions for p).
     - 5 min: deduction of q.
     - 15 min: q and staking (first let them stake, then analysis, then settle).
     - 5 min: settle scoring for round 1.

  - Round 2: 15 min
     - 5 min: setup.
     - 5 min: analysis of tracking for p and staking.
     - 5 min: settle scoring.

  - Debrief: 25 min
     - 15 min: map moments and draw conclusions.
     - 10 min: discuss repairs.

  But 40+15+25 = 80.

