prompt: |-
  In the seminar I help run — an impartiality-and-giving reading group, mostly people with economics or policy backgrounds — a move keeps recurring. Impartial benevolence, it is said, is just prudence scaled up. Within a single life we aggregate constantly: a painful month now against ten comfortable years, a hard decade of training against a career, savings against consumption. Nobody thinks prudential aggregation is illegitimate, and the trade-offs it licenses are exactly the shape of the trade-offs utilitarianism makes between people. So, the argument goes, once you grant that intrapersonal aggregation is rational, there is no principled residue left to the objection from the separateness of persons; that objection is a label for an intuition that has not survived being thought about.

  I want an audit of the analogy, not a verdict on utilitarianism. Please give me:

  1. The mapping, made explicit. A table of correspondences: what plays the role of the temporal stages, of the deliberating planner, of compensation, of the party who bears the total, of prudence's authority, of whatever ties the stages of one life together.

  2. What the source quietly imports into the target. List the properties of a single life across time that the analogy carries over to a population — one locus at which the sum is experienced; one memory that owns both the cost and the benefit; the sacrificing and the compensated party being the same party; aggregation being optional for the agent and unenforceable by others; ex post ratification by the very person who decided. For each, say whether its absence in the interpersonal case actually does work in the separateness objection or is inert decoration.

  3. The disanalogies that matter, separated from the ones that don't. I suspect some candidate disanalogies are beside the point (that bodies are spatially located, that numbers of people are larger) and others carry the whole weight. Say which, and why.

  4. A gradient test I can put to the group. Hold the trade-off fixed and vary only the degree of psychological unification across the parties: one adult human across fifty years; a pair with shared affect and a joint decision procedure; ten thousand people with a standing assembly, joint deliberation, pooled records standing in for shared memory, ex post ratification, and a shared narrative each has internalized as their own; ten thousand strangers. Does the defensibility of aggregation vary monotonically along this gradient? If it does, what is doing the work — a brute fact about separate bodies, or an empirical, degree-valued fact about how unified the parties are? And then the question that matters: does a monotonic answer vindicate the analogy or destroy it, given that the analogy's users need aggregation to be fine at the far end of the gradient? If you think the unity of a single life is itself achieved by deliberative self-constitution rather than given, say what that does to the argument.

  5. Whether the conclusion survives. Does the analogy carry the claim that the separateness objection is dead, or was the analogy doing the work all along? If it fails, propose a better comparison — one that captures whatever is genuinely right about interpersonal aggregation without importing the features you listed in section 2 — and note whether what survives is utilitarianism specifically or something weaker.

  Two constraints: assume no access to libraries or the web, so no citations, reading lists, or appeals to what some author argued; I want the argument, not the literature. And if you use any term of art, define it in a line.
reasoning: |-
  Hmm, the user is running a seminar on impartiality and benevolence, mostly for people with economics or policy backgrounds. They've noticed a recurring argument that impartial benevolence is just prudence scaled up - meaning that aggregating costs and benefits within one person's life isn't controversial, so why should it be problematic between different people? They want me to audit this analogy without judging utilitarianism itself.

  The user has given me a very structured request with five specific sections to cover. I need to address: (1) the explicit mapping between intrapersonal and interpersonal aggregation, (2) what gets quietly imported from one domain to the other, (3) which disanalogies actually matter, (4) how defensibility changes along a gradient of psychological unification, and (5) whether the conclusion that the separateness objection is dead actually holds. Plus they want all this without citations or specialized jargon.

  For section 1, I'll create a clear table showing how elements of personal prudence map to interpersonal utilitarianism. The temporal stages become different people, the deliberating planner becomes the utilitarian decision-maker, compensation becomes transferable utility, and so on.

  Section 2 should highlight the crucial features of personal identity that get smuggled into the interpersonal case - like having a single consciousness that experiences both cost and benefit, or the same entity both sacrificing and being compensated. I'll need to indicate which of these actually matter for the separateness objection.

  For section 3, I'll distinguish between superficial differences (like spatial separation) and fundamental ones (like the lack of a unified perspective). The key disanalogies involve the absence of shared identity and subjective experience across individuals.

  Section 4 is particularly interesting - testing how aggregation defensibility changes as we vary psychological unity. I'll propose a gradient from a single person to complete strangers. If defensibility varies along this spectrum, it suggests that unity matters, which actually undermines the analogy since utilitarianism requires aggregation to work even for strangers.

  Finally for section 5, I'll conclude that the analogy doesn't actually defeat the separateness objection because it relies on features unique to personal identity. I'll suggest a better comparison might be contractual agreements or team reasoning, which capture some legitimate aggregation without pretending people share a single identity.

  Throughout this, I'll keep the language accessible since this is for a seminar discussion, define any technical terms immediately, and focus on the logical structure rather than academic references as requested.
answer: |-
  Below is a structured audit of the prudence-to-utilitarianism analogy, addressing each request. Key terms are defined inline.

  ---

  ### 1. Explicit Mapping (Correspondences Table)

  | **Prudential Aggregation (Intrapersonal)** | **Utilitarian Aggregation (Interpersonal)** | **Role** |
  |--------------------------------------------|---------------------------------------------|----------|
  | Temporal stages of a single person (e.g., "young self," "future self") | Distinct individuals in a population | Units being aggregated |
  | The person as a unified agent | The utilitarian decision-maker (society, impartial observer, or policymaker) | Deliberating planner |
  | Future benefits compensating present sacrifices (e.g., savings enabling retirement comfort) | Benefits to one group compensating costs to another (e.g., taxes funding public goods) | Mechanism of compensation |
  | The same person over their whole life | The aggregate population ("society") | Party bearing the total net outcome |
  | Personal identity and continuity (psychological/physical unity) | Shared humanity, moral equality, or social contract | What "ties" the units together |
  | The agent’s own authority over their life stages | Moral authority of impartiality (e.g., "veil of ignorance" legitimacy) | Source of authority for trade-offs |
  | Ex post endorsement by the surviving self | Hypothetical consent or ex post societal stability | Retrospective ratification |

  ---

  ### 2. What the Analogy Quietly Imports (and Whether It Matters)

  The analogy implicitly assumes properties of a single life that **do not hold interpersonally**. For each, I note if its absence undermines the separateness objection ("Does work") or is irrelevant ("Inert"):

  - **Single locus of experience**: Costs and benefits are felt by one consciousness.  
    *Does work*: Absence in interpersonal case makes aggregation feel like "using" one person for another.  
  - **Unified ownership**: One "self" both sacrifices and benefits.  
    *Does work*: Central to separateness—no one consents to be the perpetual "sacrificed stage."  
  - **Endorsement by the compensated**: The same entity that bore the cost later approves the outcome.  
    *Does work*: Victims of severe sacrifices (e.g., slavery) cannot retroactively endorse their suffering.  
  - **Optional/unenforceable aggregation**: An individual can reject prudential trade-offs (e.g., choose hedonism).  
    *Inert*: Utilitarian trade-offs can be imposed, but this is a distinct coercion objection.  
  - **Continuity of identity**: Stages are causally/psychologically connected.  
    *Does work*: Separateness highlights disconnectedness of lives; no shared identity to ground aggregation.  

  **Summary**: The core ethical "work" is done by (1)–(3). The analogy masks that interpersonal sacrifices lack a unified beneficiary who *experiences* both sides.

  ---

  ### 3. Disanalogies That Matter (vs. Those That Don’t)

  - **Matter decisively**:  
    - **No shared subjectivity**: Pain and pleasure occur in distinct streams of consciousness. Sacrifices for strangers lack the *intrapersonal* justification ("I suffer now so *I* benefit later").  
      *Why it matters*: The separateness objection claims this difference invalidates summing across persons.  
    - **No identity persistence**: My future self is *me*; others are not. There is no "we" that persists to bear costs and reap benefits.  
      *Why it matters*: Undercuts the authority of the "planner" to trade welfare between independent entities.  

  - **Don’t matter**:  
    - **Spatial separation**: Bodies being distinct is ethically inert unless tied to subjectivity (e.g., two people sharing a brain might still be separate persons).  
    - **Scale**: Aggregating over 10 people vs. 10 billion is a practical, not principled, difference.  
    - **Causal interdependence**: Societies are interconnected, but this doesn’t create a unified self.  

  ---

  ### 4. Gradient Test: Psychological Unification and Defensibility

  **Gradient** (holding trade-off fixed: e.g., 1 unit of suffering now for 100 units of benefit later):  
  1. **One adult over 50 years** → Defensible (prudence).  
  2. **Two people with shared affect/joint decisions** (e.g., romantic partners) → Defensible if both consent.  
  3. **10,000 with strong unity** (shared memory, narrative, assembly) → Defensible only if institutions ensure *each* ratifies the outcome.  
  4. **10,000 strangers** → Indefensible (classic separateness objection).  

  **Analysis**:  
  - Defensibility **declines monotonically** as psychological unity decreases.  
  - **What does the work?** Not spatial separation, but the **empirical degree of subjective unification**. Shared identity enables endorsement, making aggregation feel like a collective project rather than imposition.  
  - **Impact on analogy**: This **destroys** the analogy. Utilitarianism requires aggregation to work at the *low-unity end* (strangers), but defensibility collapses there. The analogy only "works" where unity is high, defeating its purpose.  
  - **Self-constitution angle**: If personal unity is achieved via deliberation, it strengthens the gradient. A person is an "achievement" of narrative coherence; groups lack this capacity for self-creation. The analogy thus fails because persons are *constituted* by their intrapersonal unity—groups are not.  

  ---

  ### 5. Conclusion: Does the Analogy Survive?

  - **Conclusion destroyed**: The analogy **does not** show the separateness objection is "dead." It relies on features unique to personal identity (unified experience, self-endorsement) that vanish interpersonally. The objection survives because interpersonal aggregation lacks the *self-referential* character of prudence.  
  - **Better comparison**: **Team reasoning or joint projects**. E.g., a sports team sacrifices individual goals for shared success.  
    - Captures legitimate aggregation without importing problematic features:  
      - Parties opt-in to a shared goal.  
      - Compensation is reciprocal (not one-way sacrifice).  
      - Ex post ratification is possible.  
  - **What survives?** Not utilitarianism per se, but **weaker claims**:  
    - Aggregation *can* be legitimate when parties share goals or identity.  
    - Impartiality doesn’t require ignoring separateness—it requires institutions that respect it (e.g., consent mechanisms).  
    The core insight—that trade-offs are sometimes necessary—stands, but the *justification* shifts from "prudence scaled up" to "negotiated cooperation."  

  ---

  **Final Note**: The analogy’s flaw is treating persons as "stages" of a super-person. But morally, persons are ends, not means—even to a greater sum. The gradient test shows unity is a prerequisite, not an afterthought.
