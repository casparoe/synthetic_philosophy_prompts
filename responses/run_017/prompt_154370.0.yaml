prompt: |-
  I'm writing a novel and I've got myself into a hole. Three characters break the same law in the same year, and I want the reader to feel that one of them is a hero, one is a pain in the neck, and one is just a criminal — but every time I try to say why, I end up writing a line of dialogue that sounds like a seminar. So I want the spec first, before I commit to any more scenes.

  Give me the desiderata: what a theory of political obligation has to deliver, and separately what an account of civil disobedience has to deliver, if its supposed to be good enough for a character to use in first person *and* good enough for me to plot with. For each requirement, the case that motivates it — ideally one of these, since they're the scenes I actually have:

  N, a mid-level official who swore an oath and then leaks the internal memo; D, who has no vote, no passport and no plausible claim to have consented to anything, has lived here nineteen years, works, pays tax, and refuses to register for the thing everyone has to register for; M, who hides her son the night before he's due to report and tells nobody; K, who pays every tax except the slice that funds one programme, and writes to say so. And then the same law eighteen months later, after the government has changed twice: I need to know whether M and K still owe the same thing, and whether the fact that they complied for a while changes what they owe now.

  Things I specifically want your view on. Whether an account really has to answer the "why this lot and not any other reasonably decent state" question, or whether that's just a prejudice of one camp. Whether it has to keep "the law is valid" apart from "you have to obey it". Whether it has to handle the character who is only about sixty per cent sure the law is unjust, whether "you're permitted to act on your judgement" and "you're judgement is right" come apart, and who carries the risk of being wrong. Whether what makes D's refusal disobedience rather than crime is the publicity, the willingness to take the penalty, or the fact that it's addressed to an audience — and whether an account that demands all three quietly rules out resistance in places where going public gets you killed. Whether it has to say what the character owes afterwards — a trial, an apology, repair, keeping the rest of the law — or whether that's beyond what a theory of obligation is for. How much sacrifice is enough: I don't want a theory that requires my characters to be saints, but I don't want one that lets K off because the form was annoying. Whether it has to distinguish the person who pays, the one who drives the lorry and the one who votes, or whether they're all equally implicated. Whether emigrating discharges the thing, given that M can't leave because she's caring for her mother. And whether any of this is about law specifically or about authority generally — one of my subplots is a character defying a union directive and I don't know if that's the same animal.

  Then the part I care about most: which requirements are non-negotiable and which are just what one camp happens to like, and flag any pair you think can't be jointly met. I've got a suspicion that "must bind even when you think the requirement is wrong, because that's what authority is" and "must never require you to abet something seriously unjust" can't both survive, and that "must give clear first-personal guidance" fights with "mustn't tell the agent to defer when she's probably right". Tell me if I'm wrong. And say which single requirement knocks out the most candidates — that's the one I'll put in the mouth of my barrister.

  No long scorecard: a couple of lines each at the end on consent, fair-play/benefit, natural-duty and associativist accounts is plenty, and skip anything that needs a library. British English throughout (judgement, colour, defence), and prose rather than a wall of headings — I'm a novelist, I'll notice.
reasoning: |-
  Okay, the user is writing a novel and needs help with political obligation and civil disobedience theories to differentiate three characters breaking the same law. Let me unpack their query.

  First, they want desiderata for both political obligation and civil disobedience. The characters are N (leaker), D (non-registrant), M (hiding son), K (tax resister). Each should evoke different reactions: hero, nuisance, criminal. The user struggles with dialogue sounding academic, so they need practical, plot-friendly criteria.

  Key issues include:
  - Why obey this state over others?
  - Separating law's validity from obedience.
  - Handling partial certainty about injustice.
  - Publicity vs. safety in disobedience.
  - Post-disobedience obligations.
  - Level of sacrifice required.
  - Complicity in roles (payer, driver, voter).
  - Emigration as discharge.
  - Applicability to unions vs. state.

  The user suspects conflicts between "must obey even when wrong" and "mustn't abet injustice," and between clear guidance and not deferring when right. They want to know which requirements are essential and which knock out most theories.

  Starting with political obligation desiderata:
  1. **Binding force despite disagreement:** Characters need to feel bound even if unsure about the law's justice. M is 60% sure, so the theory must handle partial dissent without requiring absolute certainty.
  2. **State specificity:** Why this government? D has no consent mechanism, so theories relying on consent (like Locke) fail here. Fair-play or associative theories might work better.
  3. **Validity vs. obedience:** Need to separate legal validity from moral duty to obey. N swore an oath, so validity might be separate from ongoing obligation.
  4. **Implication levels:** Distinguish between lawmakers, enforcers, and compliers. K paying taxes vs. someone driving the lorry—complicity varies.
  5. **Emigration:** Does leaving absolve obligation? M can't leave, so theories must address non-voluntary membership.
  6. **Post-compliance duties:** After obeying, do they still resist? The law changes, but their initial compliance might affect current obligations.

  For civil disobedience:
  1. **Definition:** What makes D's act disobedience vs. crime? Publicity, acceptance of penalty, addressing an audience. But in oppressive regimes, publicity is dangerous. So the theory must allow for covert resistance when necessary.
  2. **Risk of error:** If M is wrong about the law's injustice, who bears the risk? Theories must balance personal judgment with accountability.
  3. **Sacrifice level:** Not sainthood but more than inconvenience. K withholding tax because forms are annoying shouldn't count; it needs significant moral motivation.
  4. **Post-disobedience actions:** Apologies, reparations? Or is the obligation discharged after punishment?
  5. **Applicability beyond state:** Union subplot—same principles? Authority structures differ, but core of legitimacy and resistance might parallel.

  Conflicting requirements:
  - Authority requiring obedience even when wrong vs. not complicit in injustice. This is the core conflict. Associative theories might navigate this by emphasizing role obligations but allowing egregious injustice as an override.
  - Clear guidance vs. not deferring when probably right. If the character is 60% sure, should they act? The theory needs epistemic humility—acting when certainty is high enough, but who judges that?

  Knockout requirement: "Must never require complicity in grave injustice." This eliminates theories like Hobbesian absolutism, which demand obedience regardless. The barrister can use this to dismiss rigid theories.

  Theories:
  - **Consent:** Fails for D (no consent) and state specificity. Knocked out by non-voluntary membership.
  - **Fair-play:** Benefits received (like D working/paying taxes) create obligation. But what if benefits are imposed? And it doesn't handle implication levels well.
  - **Natural duty:** Obligation to just institutions. Requires state justice assessment, which might not align with the characters' actions if the state is partially unjust.
  - **Associative:** Obligations from relationships and roles. Handles N's oath and D's long-term residence. Allows for role-based duties but permits overriding in grave injustice. Best fit, though vague on sacrifice levels.

  For civil disobedience, publicity can be waived in dangerous contexts. Post-disobedience: reparations if harm done, but not inherent. Union defiance similar if the union has legitimate authority but demands injustice.

  User's suspicion is correct—conflict between authority and injustice complicity is irreconcilable in strict terms. Associative theories offer a middle ground by contextualizing obligations but permitting disobedience in extreme cases.
answer: |-
  Right. Let's cut through the seminar fog. You're a novelist: you need *practical* theory that holds up in a character's gut and drives plot. Below are the desiderata – the non-negotiables any credible account must deliver to work for your scenes. I'll flag conflicts and knockout blows. British English throughout, prose not bullet points.

  ### I. Desiderata for Political Obligation (Why your characters owe anything to *this* state)  
  A theory must:  

  1.  **Bind even when the agent doubts the specific law's justice (Motivation: M's 60% uncertainty).**  
      *Why essential:* If obligation evaporates the moment someone questions a law, anarchy reigns. M needs to feel the pull *despite* her doubts. But it must *not* demand blind obedience – the tension is the point.  
      *Conflict risk:* High. "Must bind despite doubt" clashes with "must not require complicity in grave injustice." You can't have both absolutes.  

  2.  **Explain why *this* state, not just any decent one (Motivation: D's lack of consent/alternatives).**  
      *Why essential:* D has no passport, no vote. Generic "duty to just states" feels alienating – why *here*? Theories that fail this (some natural duty accounts) make D's situation incomprehensible. It's not prejudice; it's grounding.  
      *Knockout potential:* High. Kicks out overly abstract universalist theories.  

  3.  **Separate "the law is valid" from "you must obey it" (Motivation: N's oath vs. leaking).**  
      *Why essential:* N swore an oath to uphold the system, making the memo's validity distinct. But validity doesn't automatically mean obedience if the *content* is unjust. This gap creates N's moral crisis.  

  4.  **Handle non-voluntary membership (Motivation: D & M can't emigrate).**  
      *Why essential:* M is trapped caring for her mother; D lacks papers. If obligation relies on consent or easy exit, they owe nothing. But they *live* here – their ties must matter. Emigration can discharge *future* obligations, but not erase past ones (e.g., taxes owed while resident).  

  5.  **Graduate implication (Motivation: K paying tax vs. lorry driver vs. voter).**  
      *Why essential:* Plot hinges on complicity. The voter shapes policy, the driver directly enforces, K merely funds. A theory blurring these makes K seem as culpable as the lorry driver – which undermines your "nuisance" vibe.  

  6.  **Survive regime change (Motivation: The same law 18 months later).**  
      *Why essential:* If obligation rests solely on the current regime's legitimacy, M and K's duty might vanish with the government. But laws often persist. Theories must address *systemic* continuity or the weight of past compliance (did complying legitimise it? weaken their standing to resist now?).  

  ### II. Desiderata for Civil Disobedience (What makes breaking the law *disobedience*, not crime)  
  A theory must:  

  7.  **Permit action based on sincere judgement, not certainty (Motivation: M's 60% again).**  
      *Why essential:* Saints are boring. M must act on her best, flawed judgement. The agent *must* carry the risk of being wrong – otherwise, it's arrogance, not conscience. "Permitted to act" and "judgement is right" *must* come apart, or resistance becomes infallible.  

  8.  **Define disobedience without demanding suicidal publicity (Motivation: D's refusal vs. regimes that kill dissent).**  
      *Why essential:* Publicity/accepting penalty shows fidelity to the *system* being addressed. But demanding it "always" rules out just resistance under tyranny. D's quiet refusal must count. Core elements: (a) conscientious breach, (b) *aimed* at reforming law/policy (even if covert), (c) willingness to answer *if* called (not necessarily seeking punishment).  

  9.  **Require significant sacrifice, not convenience (Motivation: K vs. annoying forms).**  
      *Why essential:* To separate K's principled stance from grumbling. Sacrifice = accepting real cost (risk, effort, stigma) because the *injustice* demands it. Annoyance isn't enough. But no sainthood: K paying *most* tax shows proportionality.  

  10. **Specify post-act obligations (Motivation: What does K owe after refusal? M after hiding her son?).**  
      *Why essential:* Plot resolution. It's *part* of disobedience theory. Owing a trial (if caught)? Yes, to affirm the system. Apology/repair? Only if harm was done *to individuals* (not the state). Keeping other laws? Generally yes, to show fidelity to the *system* you're trying to reform.  

  11. **Apply to non-state authority (Motivation: Union subplot).**  
      *Why essential:* Authority structures share core features: rules, enforcement, claimed legitimacy. Does the union have genuine collective purpose? Is the directive unjust? If yes, defiance parallels state disobedience.  

  ### Conflicts & Knockout Blows
  - **The Irreconcilable Core:** You're right. "Must bind even when you think the requirement is wrong" (Authority's core) *cannot* coexist with "must never require complicity in grave injustice." Theories *prioritise* one. Associativists lean to authority; natural duty to injustice. Your characters must reflect this tension – N feels bound by oath (authority first), D defies (injustice first).
  - **Clarity vs. Epistemic Humility:** "Must give clear first-person guidance" *does* fight "mustn't tell the agent to defer when she's probably right." Rigid rules (always obey/never obey) are clear but stupid. Good theories embrace *deliberation*: "Obey unless injustice is grave and probable." M's 60% *is* the drama.
  - **The Knockout Requirement:** **"Must never require complicity in grave injustice."** This sinks Hobbesian absolutism, crude consent theories, and some fair-play accounts. It's your barrister's sledgehammer: "No theory demanding a person aid genocide can be moral." (Use that line).
  - **Other Dealbreakers:** Failing **State Specificity** (#2) makes D's story float; ignoring **Non-Voluntary Membership** (#4) ignores reality; demanding **Suicidal Publicity** (#8) betrays the oppressed.

  ### Theories in Two Lines Each
  - **Consent:** Obligation from voluntary agreement (oaths, voting). *Fails:* D never consented; M can't leave. Too individualistic. Knocked out by #4.
  - **Fair-Play:** Obligation from accepting benefits (D's roads, security). *Fails:* Benefits often imposed; doesn't explain *this* state (#2) or handle grave injustice well. K's tax strike challenges it.
  - **Natural Duty:** Obligation to support just institutions. *Fails:* Vague on "just" and *which* state (#2). Excels on #7 (judgement) and forbidding complicity (#Knockout).
  - **Associativist:** Obligation from shared identity/citizenship (N's oath, D's 19 years). *Best fit:* Explains #2, #4, #6, and N's conflict. Vague on #7 (how wrong is too wrong?) but allows role-based duties (#5).

  ### Your Characters Sorted
  - **N (Leaker):** Associativist. Oath binds, but leaking is *role-based* disobedience – a duty *within* the system. Heroic if leak exposes grave injustice (#Knockout).
  - **D (Non-registrant):** Natural Duty/Fair-Play hybrid. Owes something for benefits, but injustice overrides. Refusal is disobedience (#8 covert). Pain in the neck if protest is minor; heroic if registration is oppressive.
  - **M (Hides son):** Natural Duty. Acts on judgement (#7), risk on her. Disobedience even if covert (#8). Criminal only if wildly wrong. Post-act: owes repair if son harmed someone.
  - **K (Tax resister):** Fair-Play. Pays most, so acknowledges obligation. Nuisance if protest trivial (#9); justified if funding grave injustice. Post-act: owes back taxes + penalty if caught. Compliance then resistance? Weakens fair-play claim but injustice may still override.

  **Final Plot Note:** The changed government (#6) matters most for Associativists (is the system intact?) and Consent theorists (did new elections re-bind?). M and K likely owe *less* if the regime is now illegitimate, but the *injustice* of the law itself is unchanged. Their prior compliance? It shows they weren't anarchists, but doesn't forfeit future resistance if the wrong persists. Now write – your seminar days are over.
