          However, in ML we often use datasets labeled by multiple humans and take majority vote. So it is not entirely foreign.

          But the philosophical solution is not just about how we get labels; it is about what meaning consists in. In ML, we don't typically say that the model's meaning is constituted by the community. We say the model is trained to mimic the community.

          So the translation is bent.

