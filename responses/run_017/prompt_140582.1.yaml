   Then, the residue report:

     - Which of the three claims (i, ii, iii) translate cleanly?
     - Which translate only by being bent?
     - Which have no expression in ML vocabulary?

   Specific residue questions:

     - Does the notion of the "correct answer" have a real counterpart in ML? (We have an external labeler, so error is defined externally. Does this dissolve the normativity or just shift it to a third party?)

     - Is community agreement in ML just the deployment distribution plus a stipulation about who corrects? Is that an answer or a restatement?

     - Does the private-language strand (a learner trained only on its own outputs) have any grip? (i.e., no external labels, no one to disagree.)

     - How to read the residue: Does it show that ML lacks intentional/normative notions, or that the skeptical claim is just underdetermination with a first-personal flourish?

     - Is interpretability research (asking which algorithm a network implements) the same as asking which rule I meant? Or is there a difference?

   Translation of (i) Skeptical argument:

     In ML terms:
       We have a hypothesis class H. We are given training data S = {(x_i, y_i)} from a training distribution D_train, which has support only in a bounded region (say, inputs below a threshold T). The target function is f (e.g., addition). The learner, via an optimizer (like SGD), selects a function h from H that minimizes empirical risk on S. We assume h fits the training data perfectly (zero error).

       However, the training data is consistent with infinitely many functions. For example, the function f and also the function g (quaddition) which equals f for inputs in the support of D_train but may differ outside (e.g., above T). The skeptical argument says: there is no fact about the learner that determines whether h is implementing f or g. Why? Because the training data and the learning process are consistent with both.

       This is underdetermination: the data does not uniquely identify the target function. The no-free-lunch theorem tells us that without inductive bias (which comes from the hypothesis class and the optimizer), we cannot generalize. But even with inductive bias, the learner might not have chosen the target f if the bias doesn't rule out g.

       However, note: the learner does choose a particular function h. So we can say: the function h is fixed by the learning process. But the skeptical argument is about what the learner *meant* (intended to learn). In ML, we don't typically ascribe intention to the learner. We only have the function h that was selected.

       Translation: The claim that the learner means addition and not quaddition is, in this setup, equivalent to the claim that the function h (which the learner has learned) is equal to f (the target) on the entire domain. But we cannot know that from the training data alone. We can only evaluate on OOD data (if we have it) to see if h matches f there.

       But note: the learner does not have access to the entire domain during training. So the function h is determined by the training data, the hypothesis class, and the optimization process. We can say that h is the function that the learner *implements*. The question of "meaning" in the philosophical sense might be about whether the learner has captured the intended rule (which is f). But the learner doesn't have an intention; it has a mapping.

       So the extra weight? The ML vocabulary does not have a notion of "meaning" beyond the function that is implemented. Thus, the claim that the learner means addition is just that the function it implements is addition (everywhere). But without OOD data, we cannot verify that. And the training process does not guarantee it.

       However, note: the learner might not even implement a function that is defined on the entire domain (if the domain is infinite, the network is finite). But we can consider its behavior on any input we test.

       So: (i) translates fairly cleanly as the problem of underdetermination by the training data and the inductive bias.

   Translation of (ii) Objection to dispositional reply:

     The dispositional reply in philosophy: what I mean by "+" is fixed by my dispositions to answer when asked to add.

     Objection: 
       - Dispositions are finite (I haven't been asked about all numbers).
       - Dispositions cannot account for normativity: even if I am disposed to say 125 when asked 68+57, that doesn't make it correct. I might be wrong.

     In ML:
       We might think of the learner's dispositions as the function h it has learned. But note: the function h is defined for all inputs (even if we haven't tested them). But the training process only fixed h on the training set and then the inductive bias fixed the rest. However, the learner's "disposition" is just h.

       The normativity point: in ML, the correctness of the output is defined by the target function f (via the loss function). The loss function is provided externally. So the normativity comes from the external standard.

       But the objection in philosophy is that the dispositional account cannot supply normativity because dispositions are descriptive (what I would do) and not prescriptive (what I should do). In ML, we have an external standard (the labels) that defines what the learner should do. So the normativity is external.

       However, note: the learner might not match the target f. Then we say it is making an error. The loss function (with external labels) provides the normativity.

       But what if we try to use the learner's own dispositions (its own outputs) as the norm? Then we get a circularity: the learner is correct if it does what it is disposed to do. But then there is no room for error. In ML, we avoid this by having an external labeler.

       So the dispositional account in ML would be: the learner's rule is just h. But then we cannot say that the learner is wrong when it outputs h(x) for an input x (if we don't have an external label). We can only say that it outputs h(x). To say it is wrong, we need an external standard.

       Translation: The objection in philosophy is that dispositions (the function h) cannot supply normativity. In ML, we agree: we need an external loss function. So (ii) translates cleanly: without an external loss function (or target function), we cannot define error. The learner's own outputs are just what they are.

       But note: in ML, we do have an external loss function. So the normativity is provided by that.

   Translation of (iii) Skeptic solution: assertibility conditions and community agreement.

     In philosophy: we don't say that a statement is true (in the sense of corresponding to a fact about meaning) but that it is assertible (we are justified in asserting it) based on community agreement.

     In ML: 
       We might think of deployment. When we deploy the model, we use it in a community. We evaluate the model on new inputs. If the model's output agrees with what the community would output (or what the community deems correct), then we say the model is correct.

       But note: in the ML setup, we have an external labeler. The community agreement might be the source of the labels. So the "correct" answer is defined by the community's response.

       However, the skeptical solution replaces truth conditions (the meaning of "+" is the addition function) with assertibility conditions (we are justified in saying that someone means addition if they agree with the community on what to say).

       In ML, we might say: we don't have access to the true target function f, but we have a deployment distribution D_deploy, and we have a set of correctors (the community) who provide labels. Then, the model's output is correct if it matches the community's label. And we train the model to match the community's labels on the training set, and we hope it will match on deployment.

       But note: the community might be wrong? The philosophical account doesn't require that the community is infallible, just that agreement is what we go by.

       In ML, we typically assume the labels are correct. But if the community is the source of the labels, then "correct" is defined by the community. This is similar to using human labels.

       However, the user's setup has a target function f. What if the community disagrees with f? Then we have a problem. But in the skeptical solution, there is no f beyond the community's behavior.

       So in the ML setup, if we take the community as the labeler, then the target function f is defined by the community's responses. Then, the model is trained to approximate the community's labeling function. And community agreement is then defined as the model matching the community's labels on the deployment distribution.

       But note: the deployment distribution might include OOD inputs. And the community might not have been seen those inputs either. Then, the community might not agree on them. So the model might not be assertible on those.

       Translation: The skeptical solution translates to ML as: the meaning of the model is not fixed by the training data and the learning process alone, but by its agreement with the community on the deployment distribution. And we evaluate the model by whether it is assertible (i.e., whether its outputs are in agreement with the community) on the deployment distribution.

       However, note that in standard ML we have a fixed target function f (which might be the community's labeling function). But the skeptical solution avoids the notion of a fixed target function and replaces it with the community's behavior. So in ML, if we take the community as the source of truth, then we are adopting the skeptical solution.

       But this is a bit bent because in the philosophical skeptical solution, there is no fact of the matter about the rule beyond the community's practices. In ML, we still have a function (the community's labeling function) that we are trying to learn.

   The user's setup has an external target function f. So if we are not taking the community as the source of truth, then the community agreement is just a way to get labels for f (if the community is reliable). But the philosophical skeptical solution does not rely on an external f.

   So (iii) translates only by being bent: we have to change the setup to remove the external target function and replace it with community labeling.

