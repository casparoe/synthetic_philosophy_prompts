   (ii) The objection to the dispositional account: My dispositions are finite and cannot account for the normativity of meaning (i.e., why a particular answer is correct or incorrect).

   (iii) The skeptical solution: Meaning is not about truth conditions but about assertibility conditions and community agreement.

   We are to translate these into ML vocabulary:

   - hypothesis class
   - training distribution
   - learner selected by an optimizer
   - held-out and out-of-distribution (OOD) evaluation
   - identifiability and underdetermination of a target function by finitely many samples
   - no-free-lunch and inductive bias
   - a loss function whose labels come from outside the learner
