  | Claim                   | Translation Cleanliness | Key ML Concept                     | Residue                                  |
  |-------------------------|-------------------------|------------------------------------|------------------------------------------|
  | (i) Skeptical argument  | Clean                   | Underdetermination, compliance gap | None                                     |
  | (ii) Dispositional gap  | Clean                   | External loss function             | None                                     |
  | (iii) Skeptical solution| Bent                    | Deployment + community as labeler  | Assumes external standard; regress remains |

  ### Final Residue Analysis
  - **What ML lacks**: Intentionality (first-person "meaning") and non-instrumental normativity. ML operationalizes normativity via \(f^*\) and loss, reducing the paradox to generalization under distribution shift.  
  - **What dissolves**: The metaphysical "no fact" claim. ML shows it's **epistemic underdetermination** with a fixed \(h\).  
  - **What bends**: Community agreement becomes a pragmatic label source, not a dissolution of truth.  
  - **Private language**: Fully captured—self-supervised models exhibit exactly the normativity vacuum described.  
  - **Interpretability**: Different from rule-following; it describes \(h\), not intention.  

  **Conclusion**: Your vocabulary captures (i) and (ii) cleanly and (iii) operationally. The residue is the first-person, intentional layer—which ML excludes by design. The skeptic's challenge is not a new problem for ML but a reflection of known challenges (underdetermination, OOD generalization) framed in agent-centric terms. For interpretability, focus on describing \(h\) (e.g., "this network implements a quadratic approximation") without invoking "what the network *meant*."
