  Okay, let me tackle this user's query. They work in health-policy analysis and moral philosophy, encountering a specific problem. The interpersonal case is clear: leveling down without benefits isn't seen as better. But they're stuck on the intrapersonal version—reducing good years in a single life to match bad years, with no net gain. 

  First, I need to recall the standard terms. Leveling Down Objection applies to egalitarianism in interpersonal cases. But for the intrapersonal scenario, there's no common term. The user mentions people split on whether flattening the life is better, even without gains. That's puzzling because the usual objections don't apply the same way when it's the same person over time.

  The user's deeper need is understanding why the intuition differs between interpersonal and intrapersonal cases. They also want to know if the boundary shifts with psychological discontinuity. I should break down the components: lifetime aggregation, temporal neutrality, and shape of life. 

  Temporal neutrality assumes we should treat all life periods equally. But the user's example challenges that. If someone values reducing suffering in bad years more than maintaining highs, weighting might justify the trade-off. But the sharp case—destroying 100 units for 1—tests the limits. That's where prioritarianism comes in, but applied intrapersonally.

  Psychological discontinuity adds complexity. If the person doesn't remember or connect their past/future selves, does that make it more like separate persons? Parfit's view might apply here, suggesting the boundary is fuzzy. But even then, it's not full separateness. 

  The Shape of a Life thesis suggests that a balanced life is preferable, even without net gain. But the user points out that leveling down intrapersonally isn't actually leveling—it's redistribution within a life. So the analogy to interpersonal leveling down breaks because there's no separate worse-off individual losing out. 

  The real issue might be whether a life's narrative value makes a flatter distribution better. Some might accept sacrificing total well-being for reduced suffering in bad periods, especially if they prioritize minimizing lows. But that conflicts with utilitarianism. 

  I need to clarify that the second case—trading 100 units for 1—is where prioritarianism could bite, but steep weighting seems implausible. The user needs to see how different ethical frameworks handle this: prioritarianism vs. utilitarianism vs. egalitarianism. 

  Also, distinguishing between the two intrapersonal cases is key. The first (pure leveling) tests shape preferences, the second (trade-off) tests weighting. The boundary between interpersonal and intrapersonal might blur with psychological discontinuity, but it's not a full shift. 

  Finally, the user wants precise conceptual carving. They need terms for these concepts, understanding which arguments apply where. Terms like Intrapersonal Leveling Down, Temporal Prioritarianism, and Shape of a Life should help structure their analysis. Highlighting which scenarios involve net loss versus redistribution is crucial for their policy work.
answer: |-
  Your query masterfully identifies a critical gap in moral philosophy—the intrapersonal analogue to the interpersonal Leveling Down Objection (LDO). Here's a systematic dissection:

  ### 1. **Core Concepts & Terminology**
     - **Interpersonal Case**: The *Leveling Down Objection* targets **egalitarianism**. It argues that if equality is intrinsically valuable, leveling down (making the better-off worse off without benefiting anyone) should be an improvement. Most reject this, viewing equality as *instrumentally* valuable (e.g., via prioritarianism, which weights benefits to the worse off).
     - **Intrapersonal Case**: This lacks a standard name. Proposed terms:
       - **Intrapersonal Leveling Down** (for the pure case: lowering peaks with no gain).
       - **Temporal Prioritarianism** (for the weighted case: sacrificing more in good periods for less gain in bad ones).

  ### 2. **The Phenomenon Carved**
     - **What It Is**:
       - **Pure Intrapersonal Leveling**: Reducing high-well-being periods in a life to match low periods, with *no net benefit* anywhere (your first case). *Example*: Lowering 30 years at 90 to 30, while 30 years at 30 remain unchanged.
       - **Weighted Intrapersonal Transfer**: Sacrificing significant well-being in good periods for marginal gains in bad periods (your second case). *Example*: Destroying 100 units in good years to gain 1 unit in bad years.
     - **Why It Differs from Interpersonal LDO**:
       - **No "Victim"**: In the intrapersonal case, the "loser" and "beneficiary" are the same person over time. The objection "someone is harmed for no one's benefit" loses force.
       - **Lifetime Aggregation**: Moral frameworks (e.g., utilitarianism, prioritarianism) often sum/average well-being *across a whole life*. Reducing variance might seem desirable even without net gain.
       - **Temporal Neutrality**: Many theories treat all life stages equally. Sacrificing in high periods for low periods may align with temporal impartiality.

  ### 3. **Key Philosophical Divides**
     - **The Shape of a Life Thesis** (Velleman, Slote):  
       Some argue a "flattened" life (30+30) is *better shaped* than a "spiky" one (90+30), even with identical totals. This values narrative coherence: avoiding extreme highs/lows creates a more stable, dignified life.
       - *Counter*: Pure leveling (90→30, 30 unchanged) *lowers* total well-being (3600 vs. 1800). Critics ask: Why prefer less well-being identically distributed?
     - **Temporal Prioritarianism**:  
       Prioritizing gains during worse life stages. Sacrificing 100 units in good years for 1 unit in bad years *could* be justified if bad years are sufficiently awful (e.g., chronic pain). This mirrors interpersonal prioritarianism but *within* a life.
       - *Counter*: At extreme weights, this violates Pareto efficiency and seems irrational ("Why hurt my future self immensely for trivial past relief?").

  ### 4. **Boundary Conditions: Psychological Discontinuity**
     If the person lacks psychological continuity between good/bad phases (e.g., severe dementia between life stages), the case resembles interpersonal leveling:
     - **Parfitian View**: Discontinuous selves are morally akin to distinct persons. Leveling down *between* these selves faces the standard LDO: one "self" is harmed, none benefit.
     - **Holistic View**: Even with discontinuity, the *whole life* retains moral significance. Flattening may still improve life-shape or reduce "intra-life inequality."

  ### 5. **Genuine Analogues & Misfits**
     - **True Intrapersonal Analogue to Interpersonal LDO**:  
       *Only the pure leveling case* (no gain, same total). But note: **this is impossible** without reducing the total. Lowering 90→30 *must* reduce the sum unless bad years improve (which they don’t). Thus, *all* intrapersonal leveling involves net loss—making it fundamentally distinct from interpersonal leveling (which can preserve totals).
     - **Weighted Transfer as the Sharper Test**:  
       This is where prioritarianism bites. The steep trade-off (100:1) tests whether we weight suffering in bad periods *so heavily* that trivial gains there offset massive losses elsewhere. This isn't leveling down—it's **redistribution with a net loss**, justified by urgency.

  ### 6. **Where to Look**
     - **Pure Leveling/Shape of Life**:  
       Velleman ("Well-Being and Time"), Slote ("Goods and Lives").
     - **Temporal Weighting**:  
       Parfit (*Reasons and Persons*, §64 on "Benevolence"), Brink ("Prudence and Authenticity").
     - **Discontinuity**:  
       Scheffler ("Boundaries and Allegiances"), Lewis ("Survival and Identity").

  ### Synthesis
  | **Aspect**               | **Interpersonal LDO**                  | **Intrapersonal Case**                             |
  |--------------------------|----------------------------------------|----------------------------------------------------|
  | **Core Objection**       | "Harms someone, benefits no one"       | "Reduces lifetime well-being for no gain"          |
  | **Pure Leveling Logic**  | Egalitarianism fails                   | *Only possible with net loss*; tests life-shape value |
  | **Weighted Redistribution** | Prioritarianism justifies transfers  | **Temporal Prioritarianism** justifies steep trades |
  | **Discontinuity Effect** | N/A (always distinct persons)          | Blurs boundary; may strengthen LDO-like objections |

  **Conclusion**: The pull in the first intrapersonal case stems from an implicit **Shape of a Life** preference. The second case tests **Temporal Prioritarianism**. Neither is identical to interpersonal LDO due to lifetime aggregation and the necessity of net loss. The boundary softens with psychological discontinuity but doesn't dissolve—life-phase selves lack full personhood. Your "carving" reveals two distinct intrapaternal phenomena masquerading as one.
