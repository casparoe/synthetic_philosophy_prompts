prompt: |-
  I write about science and ideas for a broadsheet, and I have been given roughly three months of reporting time and about 4,000 words for a single feature. The question I want the piece to be about is what we are actually doing when we claim to know something about the distant past, and how much of that knowledge is likely to survive the next fifty years.

  Two framings I have taken from recent interviews have been competing for the centre of the piece, and I would like you to adjudicate and then go further.

  The first, from a historian: that the basic unit of historical knowledge should not be the source but the transmission event. On this view, any claim about the deep past is graded by reconstructing the chain behind it — an observation, a report, a copy, a selection, a translation, an excavation record, a restoration — and then grading the claim by its weakest link rather than by the number of apparently independent sources that repeat it, on the grounds that apparent independence usually conceals a shared ancestor. He wants this taught to first-year undergraduates as the successor discipline to source criticism, and he thinks the older habit of asking who wrote a text, when, for whom and with what bias is a special case of it.

  The second, from an archaeologist: that the growth is all in non-testimonial evidence — radiocarbon, ancient DNA, isotopes, tree rings, remote sensing — where there is no reporter to interrogate and where the traditional tools have nothing to grip; on her account, I am paraphrasing, the history of periods without written sources becomes the model, and text-based history is reduced to a literature of illustration built around a skeleton of measurement.

  A third thing I keep running into, which neither of them quite addresses: damaged texts are increasingly completed by models trained on the surviving corpus, and a machine-proposed restoration can end up in the published record looking like a reading of the physical evidence. The worry is not primarily forgery. It is that the reconstruction is informed by the very body of material it is subsequently taken to corroborate, so that a chain can acquire a link that is at once highly probable and evidentially empty.

  What I want is not a survey. Given my constraints — 4,000 words, three months, readers who are educated but not specialists — which two or three open questions should the piece be built around, in what order, and why? Please make the criteria explicit: how much of the rest of the terrain hangs on each question; whether it can be made intelligible and genuinely interesting to a general reader in the space I have; whether it is live rather than settled in disguise; and whether an answer would change a practice outside the seminar room, since courts, legislatures and museums do act on claims about the deep past. Name at least one question in this area that sounds important and that you would cut, and say why it is overrated. Then tell me what evidence or event over the next two or three years would move things up or down your list.

  Please close with a short note on your own confidence: how confident you are in each of your main claims, and which single point you are least sure of. I would rather that was flagged plainly than smoothed into prose that reads as confidence. I do not want a reading list or citations; if you mention a particular author, work or finding, be sure of it from memory or leave it out. Please write in British English.
reasoning: |-
  Okay, the user is a science and ideas writer for a broadsheet, working on a 4000-word feature about how we claim to know the distant past and whether that knowledge will last. They've got two competing framings from experts and a third concern about AI restoring texts. They need me to help choose central questions for the piece.

  Hmm, this is a deep epistemological challenge wrapped in practical journalism constraints. The historian's "transmission event" framework seems radical - shifting focus from sources to chains of copying/translation/restoration. Meanwhile the archaeologist pushes for hard science evidence like DNA or isotopes making textual history mere "illustration". And that AI restoration problem is sneaky - machine completions that look like evidence but are circular.

  Right, the key is selecting 2-3 open questions that meet their criteria: must be pivotal (much terrain hangs on them), accessible to general readers, genuinely unsettled, and capable of changing real-world practice. Courts and museums acting on historical claims adds stakes. Also need to name one overrated question to cut.

  Let me brainstorm candidate questions: Could ask whether non-testimonial evidence replaces or just reshapes historical narratives. Or how we audit machine-reconstructed texts without creating circular proofs. Or if transmission chain analysis changes how we weigh historical claims in legal settings. 

  The overrated question? Probably "Can we ever really know the past?" - too philosophical, doesn't guide practice. Whereas the AI restoration question feels urgent with tech advancing fast.

  For evidence that could shift things: Watch how courts handle carbon-dated evidence vs oral histories in land rights cases. Or if major museums start flagging AI-restored fragments. A big DNA study rewriting Bronze Age trade routes could test the archaeology framing.

  Confidence-wise: Strong on selecting the transmission chain question - it's transformative. Less sure about demoting textual criticism entirely, as old methods still matter for bias detection. The AI circularity worry feels solid but needs monitoring as tools evolve.
answer: |-
  Here’s a structured proposal for your feature, prioritising open questions that meet your criteria of pivotality, accessibility, liveness, and real-world impact. I’ll address your constraints explicitly and close with a confidence assessment.

  ### Core Questions to Build Around (in recommended order):
  1. **When machines 'read' damaged texts, are we creating circular evidence?**  
     *Why this first?*  
     - **Pivotality**: Directly tackles your unresolved third concern. It exposes a silent crisis in the interpretation of *all* textual evidence (ancient scripts, scrolls, inscriptions) as AI tools proliferate.  
     - **Accessibility**: Generative AI is a public preoccupation. Illustrate with vivid examples (e.g., a charred Roman scroll "read" by ML, a contested biblical fragment reconstruction).  
     - **Liveness**: Zero consensus. Epigraphers debate if ML "suggestions" should be italicised or banned from critical editions; museums rarely disclose digital interventions.  
     - **Real-world impact**: Courts use textual evidence in cultural property disputes; museums display "reconstructed" artefacts; religious groups base claims on contested readings. A flawed ML restoration could distort laws or repatriation claims.  

  2. **Is 'hard science' rewriting history—or just providing better footnotes?**  
     *Why second?*  
     - **Pivotality**: Engages the archaeologist’s framing. Tests whether isotopes/DNA/remote sensing *replace* narratives or merely *augment* them. Covers the historian’s anxiety about texts becoming "illustration".  
     - **Accessibility**: Use dramatic cases (e.g., DNA rewriting Anglo-Saxon migration theories; lidar revealing Mayan megacities under jungle). Contrast "lab certainty" with messy human testimony.  
     - **Liveness**: Active turf wars. Archaeologists lobby for funding shifts to labs; historians warn of "scientism" ignoring power dynamics in the past.  
     - **Real-world impact**: Legislatures use ancient DNA in indigenous land rights cases (e.g., Kennewick Man). Climate policy cites paleoclimate data (tree rings/ice cores). Who "owns" the past when science speaks?  

  3. **Can grading the 'chain' of transmission save history from itself?**  
     *Why third?*  
     - **Pivotality**: The historian’s "transmission event" model challenges foundational practice. It forces scrutiny of *how* a claim survives, not just *what* it says.  
     - **Accessibility**: Trace a single claim’s journey (e.g., "Boudica sacked London" via Tacitus → medieval copy → mistranslation → school textbook). Highlight weak links (a 9th-century scribe’s bias?).  
     - **Liveness**: Emerging methodology, not yet mainstream. Opponents call it impractical; proponents say it’s essential in an age of deepfakes and digital decay.  
     - **Real-world impact**: Museums could label exhibits with "transmission reliability scores". Courts might reject historical precedents with broken chains (e.g., disputed treaties).  

  ### The Overrated Question to Cut:  
  **"Will digital storage preserve the past better than stone or parchment?"**  
  *Why cut it?*  
  - **Overrated**: It’s technically focused (bit rot vs vellum decay) and distracts from your core epistemic theme. While digital preservation matters, it doesn’t address *how knowledge is constructed or corrupted*. Solutions (blockchain, multiple archives) are discussed ad nauseam without resolving deeper issues of interpretation or AI interference.  

  ### Evidence/Events That Could Reshape These Questions (2024-26):  
  - **⬆️ If**: A high-profile legal case (e.g., The Hague) rules against a nation using ML-reconstructed texts as evidence. *Impact*: Forces standards for digital restoration disclosure.  
  - **⬇️ If**: A major ancient DNA study is retracted due to sample contamination. *Impact*: Tempers "science as saviour" narratives, boosts historian/archaeologist collaboration.  
  - **⬆️ If**: A museum consortium adopts "transmission grading" for labels. *Impact*: Validates the historian’s framework, pushes methodology into public view.  

  ### Confidence Assessment:  
  | **Claim**                                                                 | **Confidence** | **Key Uncertainty**                                                                 |  
  |---------------------------------------------------------------------------|----------------|-------------------------------------------------------------------------------------|  
  | **AI text restoration creates circular evidence loops**                   | High (90%)     | Speed of ethical guideline adoption by publishers/museums.                          |  
  | **Non-testimonial evidence is reshaping historical authority**            | Very High (95%)| Whether science can address *why* vs. *what* (e.g., DNA shows migration, but not motive). |  
  | **Transmission event analysis could revolutionise historical practice**   | Medium (70%)   | Feasibility of implementation beyond theory. Will time-poor scholars adopt it?      |  
  | **Cutting digital preservation is the right editorial choice**            | High (85%)     | If a catastrophic archive loss occurs, public panic *could* make this urgent.       |  

  **Least Sure Point**: That transmission event grading will gain real-world traction (e.g., in courts/museums) within 50 years. Academia moves slowly, and resistance to overhauling source criticism remains entrenched. The *idea* is robust, but its practical adoption is my biggest doubt.  

  ---  
  This structure builds from immediate technological disruption (AI) through the shifting evidentiary landscape (science vs. texts) to a radical methodological proposal (transmission chains). It stays rooted in practices affecting courts, museums, and public understanding—precisely where claims about the past face real-world tests.
