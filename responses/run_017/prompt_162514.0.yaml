  Okay, the user is a novelist preparing a three-hour seminar on Wittgenstein's language games and family resemblance for other novelists. They need a practical teaching plan that avoids superficial summaries and addresses the audience's specific needs. 

  First, I notice the user is deeply aware of their audience's profile: intelligent, verbally skilled, allergic to lectures, and likely to challenge the relevance to fiction writing. They're also wary of common misconceptions—both philosophical ones and industry-specific ones like conflating family resemblance with vague similarity in reviews. 

  The core challenge is structural: how to sequence Wittgenstein's ideas so each step feels necessary. Meaning-as-use must come first because it's the foundation—without it, language games make no sense. But introducing it too early risks misinterpretation as subjective authorial intent. The solution is to anchor it in public practice immediately with a concrete example. 

  For the central example, "portrait" works better than "game" or literary terms. It has clear correct/incorrect uses (a police sketch isn't a portrait), no single defining feature (medium, style, purpose vary), and avoids triggering writers' defensive reflexes about their craft. Crucially, it lacks the baggage of Wittgenstein's overused games example. 

  The biggest traps I anticipate: 
  1. Novelists might confuse meaning-as-use with "the author decides meaning"—this must be preempted when introducing the concept by emphasizing communal practice. 
  2. They might reduce family resemblance to vagueness, which needs correction when presenting borderline cases by stressing structured affinities. 
  3. Most dangerously, they might think rejecting private essences flattens fictional inner lives—here I'd explicitly divorce metaphysical claims from narrative technique. 

  On the definitional question, I'll frame family resemblance as a positive claim about extensions lacking sharp boundaries—not a refusal to define. This matters for the closing exercise: judging a verse novel should generate arguments about weighted resemblances, not just shrugs. If someone invokes private language, I'll acknowledge it but table it as beyond scope; its premature introduction could derail everything. 

  The success metric is crucial. If participants analyze the verse novel by debating which novel-features matter more (narrative cohesion vs. poetic form), they've grasped the framework. If they default to dictionary definitions or authorial intent, the public-practice element failed. 

  Throughout, I'll keep philosophy intact—no premature writing tips. The user wants to bridge that gap live, which is wise; forced applications would feel reductive. Instead, the rigor of the session will naturally open doors for their craft translation later.
answer: |-
  Here is a teaching plan designed for your specific audience and constraints, prioritizing intelligibility, engagement, and avoiding common pitfalls while staying philosophically honest. It centers on a single, non-game example and structures the concepts to build necessity.

  **Core Pedagogical Principle:** Start with the concrete *problem* Wittgenstein addresses (the demand for essences/sharp boundaries) to motivate his solutions, rather than starting with abstract doctrine. Anchor everything in observable *use*.

  **The Plan: A Three-Hour Arc**

  **Part 1: The Problem & The Core Insight (60 mins)**
  1.  **Hook & Problem Framing (15 mins):**
      *   Start with a question: "How do we know what a novel *is*? Or 'realism'? Or 'plot'? What makes something count as one?" Solicit quick answers – expect appeals to definitions, examples, necessary features, feelings.
      *   **The Trap:** Pose a challenge: "Give me a strict definition of 'Game' that includes everything we call a game (chess, ring-around-the-rosy, solitaire, professional football) and excludes everything that isn't (a lecture, breathing, war)." Let them struggle briefly. Highlight the frustration. *This is the problem:* We demand essential definitions, but they crumble upon inspection. This demand drives much philosophical confusion and, Wittgenstein argues, misleads us about language itself.
      *   **Why this order?** Starting with the *problem* (the demand for essences) makes the subsequent ideas *necessary solutions*. Without seeing the problem, "family resemblance" seems arbitrary or trivial.
  2.  **Meaning is Use: The Foundational Shift (30 mins):**
      *   **Slogan Introduction:** "Don't ask for the meaning, ask for the use." (PI 43) *Immediately* contextualize: This is a *method*, not a metaphysical claim. It shifts attention *away* from hidden mental states or abstract definitions *towards* observable activity.
      *   **The Carrying Example: PORTRAITS**
          *   *What it is:* A rich, non-game concept with varied applications (photorealistic oil painting, caricature, passport photo, death mask, abstract Picasso profile, royal portrait on a coin, literary portrait in biography).
          *   *Why it works:*
              *   **No Single Feature:** What unites a Rembrandt self-portrait, a political cartoon, and your driver's license photo? Not "resemblance" (abstract Picasso?), not "human likeness" (death mask? coin?), not "artistic intent" (passport photo?), not "medium" (literary portrait?).
              *   **Clear Correct/Incorrect Uses:** We confidently call a police sketch a portrait, but not a landscape; a statue *bust* might be, but a full statue *might* not be called one primarily; a candid snapshot *isn't* typically a portrait, but a carefully staged one *is*. We know when the label feels wrong (calling a landscape a "portrait").
              *   **No Available Definition:** No necessary-and-sufficient condition holds water under pressure.
              *   **Avoids Writerly Baggage:** Using "novel" or "character" too early risks defensiveness or premature craft talk. "Portrait" is adjacent (artistic representation) but distant enough to allow objective analysis.
          *   *Application:* Show diverse examples. Ask: *What are we DOING* when we call something a portrait? (Identifying a subject? Commemorating? Satirizing? Authenticating? Analyzing character? Decorating?) Emphasize the *actions* surrounding the word.
      *   **Crucial Preemption:** *Meaning is use does NOT mean "the author/speaker decides the meaning."* Hammer this NOW. Meaning is determined by the *public rules of the language game*, the established practices of the community. An author can't decree that "elephant" means "typewriter" in their novel and be understood; they work *within* shared practices, even when stretching them. (This combats the "author decides" misconception early).
  3.  **Introducing Language Games (15 mins):**
      *   **Definition via Example:** Point back to the "Portrait" activities. *That cluster of activities* – naming, depicting, commemorating, judging authenticity, analyzing, hanging in a gallery – is part of a "language game." It's the whole weave of language and the actions into which it is woven (PI 7). Show other simple "games": Giving orders/obeying; Reporting an event; Making a joke; Telling a story.
      *   **Key Point:** Language games are *public*, rule-governed practices (though the rules may be implicit, flexible, and context-dependent, not like chess). Rules aren't necessarily written; they are shown in how we correct mistakes ("That's not a portrait, it's a landscape!").
      *   **Why order here?** "Meaning is use" provides the *reason* to look at language games. "Use" happens *within* these games. Family resemblance makes no sense without seeing concepts operating within different, overlapping games. **Dependence:** Problem -> Meaning is Use (Method) -> Language Games (Context for Use) -> Family Resignemce (Description of Concept Behavior).

  **Part 2: Family Resemblance & Its Implications (60 mins)**
  4.  **Family Resemblance: The Positive Claim (30 mins)**
      *   **Back to Portraits:** Map out overlapping similarities: A & B share pose/staging; B & C share medium (photography); C & D share purpose (identification); D & E share focus on character; E & F share artistic distortion. No single thread runs through all, but they form a connected network. Like family: build, eyes, gait, temperament criss-crossing.
      *   **Positive Claim:** Frame this as Wittgenstein's *positive* description of how many concepts *actually work*: Their extension is held together by a network of overlapping similarities, not a single defining essence. This is a fact about the concept's structure in our language. **Commitment:** This is a positive claim about the *kind* of boundary (or lack thereof) the concept has, *not* merely a refusal to define. Refusal comes later as a consequence.
      *   **Misconception Busting:**
          *   *Not Disjunctive Definition:* It's NOT "X is a portrait iff it resembles OR is artistic OR is for ID..." This just pushes the problem back (define "resembles" for portraits? Define "artistic"?) and implies sharp boundaries where there are none. Family resemblance describes a *pattern* of actual usage, not a logical formula.
          *   *Not Mere Vagueness:* Vagueness suggests a grey area *between* clear cases. Family resemblance explains *why* there are clear cases and *why* borderline cases exist – it's the structure of overlapping criteria with no single anchor. Borderline cases arise when an item shares *some* relevant resemblances but lacks others strongly associated with the core (e.g., a photorealistic sculpture? A candid photo labeled "portrait of city life"?).
      *   **Cost of Using a Literary Example Here:** If we used "Novel" now, the discussion would immediately veer into craft debates ("*I* think a novel must...") and genre policing, obscuring the philosophical point about conceptual structure. "Portrait" provides cleaner analytical distance. We *will* bring it back.
  5.  **The Slogan & Its Consequences: No Essence, But Not Nihilism (30 mins)**
      *   **The Slogan:** "For the strength of the family model really consists... in the fact that no one feature *is* common to all." (Paraphrasing PI 67). Concepts like "portrait" (and "game," "language," "number," "novel") lack a single defining essence.
      *   **Consequence 1 - Rejecting the Demand:** We must abandon the *insistence* that every concept *must* have a sharp boundary or essential definition to be meaningful or useful. This demand is a philosophical illusion. Our concepts work perfectly well without it in actual practice.
      *   **Consequence 2 - NOT "No Fact of the Matter":** This is **critical** to preempt. Lack of essence does NOT mean "anything goes" or there's no difference between correct and incorrect use. **Head this off explicitly:** Point back to the clear cases and corrections within the language game (Passport photo=Portrait; Landscape ≠ Portrait). Rules exist *within the practice*; they are public and teachable, even if flexible and context-sensitive. The "fact of the matter" is determined by the rules of the relevant language game(s) in their specific context. Borderline cases exist, but they are the exception, not the rule, and often resolvable by examining context/purpose.
      *   **Misconception Busting:** *Language Game ≠ Constitutive Rules like Chess:* Preempt during discussion. Chess has codified rules. Most language games (like critiquing a portrait, writing a novel) have looser, implicit, purposive "rules" – norms of practice, expectations, goals. The "rules" are shown in how we learn, correct, and justify usage within the form of life. (This combats the rigid "chess rules" misconception).

  **Part 3: Application, Challenges, and the Check (60 mins)**
  6.  **Bringing it Home: Literary Concepts (25 mins)**
      *   **Exercise:** Apply the framework to "NOVEL." Break into small groups (3-4 people).
          *   Task 1: List diverse examples (e.g., *Middlemarch*, *Ulysses*, *The Da Vinci Code*, *The Road*, *Mrs Dalloway*, *Cloud Atlas*, *The Hitchhiker's Guide*, *Austerlitz*, a graphic novel like *Maus*).
          *   Task 2: Identify overlapping features/resemblances (e.g., narrative prose, fictional, extended length, character development, plot structure, thematic exploration, world-building, published as a single volume). *Emphasize*: Don't seek *the* defining feature, map the *network*.
          *   Task 3: Identify clear non-examples (e.g., a single haiku, a news article, a play script, a dictionary).
          *   Task 4: Brainstorm potential borderline cases (e.g., *The Canterbury Tales*? *Pale Fire*? *Lincoln in the Bardo*? A novel-in-verse? A very long, complex short story? A heavily fictionalized biography?).
      *   **Group Discussion:** Share findings. Focus on the *network* of resemblances and the role of context/purpose (e.g., marketing, literary tradition, authorial intent?) in resolving borderlines. *Guide them away* from trying to legislate "The Definition." Ask: "What language games involve calling something a 'novel'?" (Writing, publishing, marketing, bookselling, reviewing, critiquing, literary scholarship, prize-giving, reading for pleasure). How do the rules/norms differ subtly in each?
      *   **Preempting Writerly Misconceptions:**
          *   *Inner Life ≠ Behaviour:* Explicitly state: "Wittgenstein's point about meaning being public *does not* imply fictional characters are 'just behaviour' or lack inner life. We *portray* inner life *using public language* (thought reports, free indirect discourse, dialogue, description of action/expression) within the language game of fiction. The 'rules' of that game allow for rich representation of the subjective using shared tools. The 'meaning' of a character's sigh resides in how it functions within the narrative context, not in positing a private, inaccessible inner object."
  7.  **The Check: The Borderline Case (20 mins)**
      *   **Present the Case:** A **"Novel in Verse"** (e.g., *The Golden Gate* by Vikram Seth, *Autobiography of Red* by Anne Carson, *Omeros* by Derek Walcott). Or a **Book of Linked Stories** with overarching narrative/theme (e.g., *Olive Kitteridge* by Elizabeth Strout, *A Visit from the Goon Squad* by Jennifer Egan).
      *   **Question:** "Is this a novel? What settles it – or what makes it debatable? Use the framework we've built."
      *   **Success Criteria:**
          *   **Success:** Arguments appealing to *weighted resemblances* ("It has a continuous narrative arc like core novels, but lacks prose; it shares thematic depth and character development, but the verse form pushes it towards poetry"). Discussion of *which language games* are involved ("Publishers marketed it as a novel; reviewers treat it as hybrid; it won a fiction prize"). Acceptance that it *is* borderline, with reasons *why* based on the network structure and context. *No* appeal to a single essential feature as decisive.
          *   **Failure:**
              *   Appeal to a single defining feature (e.g., "It's prose!" or "The author said so!").
              *   Dismissal as "just vague" without analysis.
              *   "It doesn't matter / It's subjective" (showing "no fact of the matter" misconception).
              *   Getting stuck in craft debates ("But *real* novels need...") ignoring the conceptual analysis.
      *   **What Failure Tells You:**
          *   Appeal to single feature: The positive claim about network structure didn't land.
          *   Dismissal as vague: The distinction between family resemblance and vagueness wasn't grasped, or the "no essence ≠ no rules" point failed.
          *   "Doesn't matter/Subjective": The public, rule-governed nature of language games and the reality of correct/incorrect use wasn't internalized; "no fact of the matter" took hold.
          *   Craft debate: The session didn't successfully separate the philosophical analysis from immediate craft application early enough, or the "Portrait" buffer wasn't sufficient.
  8.  **Handling Private Language & Refusals (15 mins)**
      *   **Refuse to Explain at this Level:** Private Language Argument (PI 243ff), Rule-Following (PI 143-242), "Form of Life" depth, Beetle-in-a-box (PI 293), Picture Theory of Meaning critique. These require deeper dive into metaphysics, epistemology, and rule skepticism – too much for 3 hours focused on core PI concepts for non-philosophers. They risk derailing and causing significant confusion.
      *   **What to Do When Raised (as it will be):**
          1.  **Acknowledge & Contain:** "That's a crucial and complex part of Wittgenstein's later work, touching on the nature of sensation, rules, and inner experience. It's deeply connected to the ideas we're discussing, especially meaning-as-use and the public nature of language."
          2.  **State the Limitation:** "Unfortunately, doing justice to the private language argument requires more time and groundwork than we have today. It builds directly on rejecting the idea of purely private meaning, which relates to our point that meaning resides in public use within language games."
          3.  **Redirect:** "For our purposes today, the key takeaway relevant to that is Wittgenstein's insistence that language gets its meaning from public practice, not from private mental acts or objects. If someone asks about character 'inner life,' refer back to Point 6 above."
          4.  **Offer a Path (Optional):** "If you're fascinated, I recommend reading PI sections 243-315 carefully, but be warned, it's dense! Stanley Cavell or Marie McGinn offer good secondary guides." (Have a single reference ready, but don't make it a list).
      *   **Why Refuse:** Engaging with PLA properly would consume the entire seminar, confuse the core message, and introduce advanced skepticism your audience isn't prepared to navigate.

  **Summary of Order Justification:**
  *   **Problem (Essence Demand) First:** Makes Wittgenstein's project necessary.
  *   **Meaning is Use Next:** Provides the methodological shift to solve the problem. *Must* preempt "author decides" immediately.
  *   **Language Games Next:** Provides the context/arena where "use" happens. Essential for understanding the public, rule-governed nature of meaning.
  *   **Family Resemblance Next:** Describes the observed structure of concepts *within* language games, solving the initial problem. Requires the prior steps to avoid being seen as "just vagueness" or "no rules."
  *   **Positive Claim:** Teaches FR as a description of how concepts *are*, not just a refusal.
  *   **Consequences (No Essence ≠ Nihilism) Immediately After:** Crucial preemption of "no fact of the matter."
  *   **Application Later:** Allows concepts to solidify before applying to the audience's domain, reducing defensiveness.
  *   **Check Last:** Tests integration of all components.

  This plan respects your audience's intelligence and impatience by grounding everything in concrete examples and problem-solving, directly addresses the inevitable "So what for writing?" by applying it to "novel," and strategically preempts or corrects the major misconceptions at the points where they are most likely to arise. It keeps the philosophy intact while making it accessible and relevant. Good luck!
