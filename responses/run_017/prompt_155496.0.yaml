prompt: |-
  I'm giving a forty-five-minute guest lecture on self-locating evidence to a room of astrophysics graduate students. They apply Bayes' theorem daily but have never encountered indexical evidence, so my worry is that they will recast everything as an ordinary likelihood and miss what is new. I want a plan for the lecture, not the lecture.

  Give me the order the components have to come in, with the dependencies stated: where the self-sampling assumption (reason as if you were drawn at random from the actual observers in your reference class) and the self-indication assumption (reason as if you were drawn at random from all possible observers) must enter, relative to the point where the dispute stops looking like a disagreement about priors.

  I want one case to carry the session. I have been sketching a variant of the presumptuous philosopher in which the hypotheses differ in more than head count: the colony hypothesis posits ten observers who all have evidence exactly like mine, while the civilization hypothesis posits a million observers of whom only a thousand do. The two assumptions then pull in opposite directions rather than merely disagreeing about how strongly to prefer the more crowded world. Is that the case to build on, or does it import too much, and what must a carrying example here contain and omit?

  Then the misconception map, in the order they will form. I expect 'SIA just helps itself to the conclusion that crowded worlds are likely,' 'SSA implies you should expect to be mediocre in every respect,' and 'this is only a choice of prior, so there is nothing to argue about,' plus whatever else you would predict, and I want to know where in the sequence each should be defused.

  Close with one question I can put to them whose correct answer differs by assumption but not merely because one hypothesis contains more observers, and name one thing I should openly refuse to adjudicate.
reasoning: |-
  Okay, the user is preparing a 45-minute lecture on self-locating evidence for astrophysics graduate students. These students are familiar with Bayesian methods but haven't encountered indexical evidence before. The main challenge is ensuring they grasp what's genuinely new here rather than recasting everything as ordinary likelihoods.

  The user wants a structured plan focusing on sequence and dependencies. Key elements are the Self-Sampling Assumption (SSA) and Self-Indication Assumption (SIA), and when their divergence goes beyond prior disagreements. 

  For the core example, they're considering a modified Presumptuous Philosopher scenario where hypotheses differ in both headcount and evidence distribution: Colony (10 observers, all matching user's evidence) vs. Civilization (1M observers, only 1K matching). This seems effective because SSA and SIA pull in opposite directions here, not just in strength. SSA would favor Colony (since matching evidence is guaranteed there but rare in Civilization), while SIA favors Civilization due to higher total observers. This stark contrast should highlight the conceptual novelty.

  The misconception map needs addressing in order of emergence. Likely misunderstandings include:
  1. "SIA arbitrarily favors crowded worlds" (defuse when introducing SIA)
  2. "SSA implies expecting mediocrity" (address after SSA's observer-centric focus)
  3. "This is just prior choice" (counter after showing the evidence-update divergence)

  For the closing question, the user wants something where the answer differs by assumption without relying solely on headcount differences. The core example itself provides this: "Given my evidence, does Civilization become more probable?" SSA says no, SIA says yes. 

  The user should explicitly refuse to adjudicate which assumption is "correct" - this is an open philosophical debate. The goal is framework comparison, not resolution.

  The lecture flow should be:
  1. Hook with non-indexical Bayes to establish baseline
  2. Introduce indexical evidence through Doomsday/Sleeping Beauty
  3. Formalize SSA and SIA
  4. Present the Colony vs. Civilization case
  5. Contrast updates under both assumptions
  6. Tackle misconceptions as they arise
  7. End with the question and meta-commentary

  Timing is tight: 5min setup, 15min foundations, 15min core case, 10min misconceptions/Q&A. The case study must be introduced before deep SSA/SIA discussion to ground abstractions.
answer: |-
  Here's a battle-tested lecture plan designed to force the novelty of self-locating evidence into focus, leveraging your astrophysics students' Bayesian fluency while preventing premature conflation with standard likelihoods. The core case is excellent.

  **Lecture Plan: Sequence & Dependencies**

  1.  **(5 min) Hook & Baseline: The Limits of Standard Bayes**
      *   **Component:** Start with a *non*-indexical problem they'd solve instantly. E.g., "You have two hypotheses about a distant galaxy: H1 (common type, 1e9 stars) and H2 (rare type, 1e6 stars). You observe a specific spectral line. P(Line|H1) = 0.1, P(Line|H2) = 0.8. Update." They do it. Emphasize: Evidence is *objective*; the observation doesn't depend on *who* observes it or *when*.
      *   **Dependency:** Establishes their comfort zone. The novelty of indexical evidence requires this contrast.

  2.  **(10 min) Introducing the Indexical: "I" as Evidence**
      *   **Component:** Simple indexical puzzles. Use **Doomsday Argument (Briefly)** and **Sleeping Beauty (Focus on the "Monday/Tuesday" indexical uncertainty)**. Highlight the new question: *Given that* ***I*** *am having this experience now, what does it tell me?* Contrast with the galaxy example – the evidence ("I see X") inherently references the observer.
      *   **Dependency:** Creates the problem space. Shows that standard likelihoods (`P(E|H)`) seem insufficient or ambiguous when `E` contains "I". Sets the stage for needing new rules.

  3.  **(5 min) Formalizing the Challenge: Reference Classes & The Need for Assumptions**
      *   **Component:** Define "self-locating evidence" (evidence specifying your location within a possible world). State the core problem: How do we calculate `P(I have evidence E | H)`? Introduce the concept of a **reference class** (actual observers like me? all possible observers?).
      *   **Dependency:** Builds directly on step 2. Shows the ambiguity in defining the likelihood for "I observe E". Explicitly states the need for new principles (SSA/SIA).

  4.  **(15 min) Core Mechanism: SSA and SIA Defined & Applied (Initial Pass)**
      *   **Component:**
          *   **Define SSA:** "When you don't know your identity, reason as if you were randomly sampled from the **actual observers** in your reference class within the actual world." `P(I am observer O | H) = 1 / N_H` (where `N_H` is the number of qualifying observers *in the actual world* under H).
          *   **Define SIA:** "When reasoning about which world is actual, reason as if you were randomly sampled from all **possible observers** across all possible worlds." This *weights hypotheses by their expected number of observers*. `P(H) proportional to P_prior(H) * N_H`.
          *   **Simple Application:** **Presumptuous Philosopher Lite (Hypotheses differ *only* in headcount: H_low (1e10 observers), H_high (1e20 observers). No distinguishing evidence.)**
              *   SSA: `P(I exist | H_low) = 1`, `P(I exist | H_high) = 1` -> No update, equal posteriors if priors equal.
              *   SIA: `P_posterior(H_high) / P_posterior(H_low) = (P_prior(H_high) * 1e20) / (P_prior(H_low) * 1e10) = 1e10 * (P_prior ratio)` -> Strongly favors H_high.
          *   **Point:** This *looks* like a prior disagreement (`P(H) prop to N_H` vs `P(H) constant`). SIA's update seems absorbed into the prior weighting. *This is the misconception we need to shatter.*

  5.  **(15 min) The Pivotal Case: Your Colony vs. Civilization Scenario - Where SSA and SIA Diverge Fundamentally**
      *   **Component: Introduce Your Case:**
          *   **Hypotheses:**
              *   H_colony: 10 observers exist. **All 10** have evidence exactly like yours (`E`).
              *   H_civ: 1,000,000 observers exist. **Only 1,000** have evidence exactly like yours (`E`). The other 999,000 have different, incompatible evidence.
          *   **Priors:** Assume `P_prior(H_colony) = P_prior(H_civ) = 0.5` for simplicity.
          *   **Your Evidence:** `E` (e.g., "I am an astrophysics grad student in 2024 seeing this lecture").
      *   **Apply SSA:**
          *   Reference Class: Observers with evidence `E` (the only ones "like you").
          *   H_colony: N_actual = 10 (all have `E`). `P(I have E | H_colony) = 1` (You are certain to be in the reference class).
          *   H_civ: N_actual = 1000 (have `E`). `P(I have E | H_civ) = 1000 / 1,000,000 = 0.001`.
          *   **Posterior Odds (SSA):** `[P(H_colony|E) / P(H_civ|E)]_SSA = (0.5 * 1) / (0.5 * 0.001) = 1 / 0.001 = 1000`. **Strongly favors H_colony.**
      *   **Apply SIA:**
          *   First, weight hypotheses by total observers: `P_effective(H_colony) prop 0.5 * 10 = 5`, `P_effective(H_civ) prop 0.5 * 1,000,000 = 500,000`.
          *   Now, conditionalize on `E` using SSA-like likelihood *within* each world (finding observers *like you*):
              *   H_colony: `P(I have E | H_colony) = 1` (as before).
              *   H_civ: `P(I have E | H_civ) = 1000 / 1,000,000 = 0.001` (as before).
          *   **Posterior Odds (SIA):** `[P(H_colony|E) / P(H_civ|E)]_SIA = (5 * 1) / (500,000 * 0.001) = 5 / 500 = 0.01`. **Strongly favors H_civ.**
      *   **The Crucial Point:** SSA and SIA give *opposite* answers! This divergence **cannot be reduced to a prior disagreement**. The core difference lies in *how the evidence `E` updates the probabilities*.
          *   SSA conditions on "I am *an actual* observer with `E`" (favors worlds where `E` is common among actual observers).
          *   SIA first weights by total possible observers, *then* conditions on "I am an observer with `E`" (favors worlds with more observers overall, even if `E` is rare there). The update step (`P(E|H)`) is fundamentally different in interpretation.
      *   **Dependency:** This is the heart. Steps 1-4 lead here. The key dependency is establishing the *apparent* prior disagreement in the simple case (Step 4) *before* showing how the Colony/Civ case breaks that framing. The novelty of indexical updating is laid bare.

  **Why This Case Works (Carrying Example):**
  *   **Pulls SSA & SIA Apart:** They give diametrically opposed answers.
  *   **More Than Headcount:** Headcount *and* the distribution of evidence matter critically. It forces reasoning about your "typicality".
  *   **Omits Distractions:** No complex physics, no controversial anthropic principles beyond SSA/SIA, no extra dimensions. Focuses purely on the core statistical issue.
  *   **Contains Essentials:** Clear hypotheses, quantifiable observer counts, specific evidence `E`, unambiguous reference class for SSA (observers with `E`), forces calculation of `P(I have E | H)` under both rules.

  **Misconception Map (Order of Formation & Defusal):**

  1.  **"SIA just helps itself to the conclusion that crowded worlds are likely."**
      *   **Forms:** When first encountering SIA in the simple Presumptuous Philosopher (Step 4). It *looks* like an arbitrary prior bias.
      *   **Defusal:** **Pivotal Point (Step 5 - Colony vs. Civ).** Show SIA *can* favor the *less* crowded world (H_civ is favored, but only because its massive headcount outweighs the low probability of having `E` *within* it). Emphasize SIA is about *your chance of existing at all*, not just favoring large `N`. Its update rule is distinct.

  2.  **"This is only a choice of prior, so there is nothing to argue about."**
      *   **Forms:** During/after Step 4 (Simple Presumptuous Philosopher). The divergence seems absorbed into `P_prior(H) * N_H` vs `P_prior(H)`.
      *   **Defusal:** **Pivotal Point (Step 5 - Colony vs. Civ).** The dramatic flip depending on whether you use SSA or SIA *after conditioning on the specific evidence `E`* proves this is fundamentally about *how evidence updates probability in the presence of indexical uncertainty*, not just prior weighting. The likelihood `P(E|H)` is interpreted differently.

  3.  **"SSA implies you should expect to be mediocre in every respect."**
      *   **Forms:** When grasping SSA's focus on sampling from actual observers (Step 4/5), especially after Colony/Civ where SSA assumes you are a *random* observer *with `E`*.
      *   **Defusal:** **After Step 5, during misconception Q&A.** Clarify: SSA relates to *indexical* properties tied to your existence as an observer (birth rank, location in universe, specific evidence defining your reference class). It doesn't apply to *non-indexical* properties (e.g., height, intelligence within your local population) – use standard statistics for those. SSA tells you about your likely *location* or *identity* within a world, not about non-indexical traits defining observers. Cite the reference class focus.

  **(Potential Extra) "We can just avoid indexicals by always modeling from a 3rd-person perspective."**
  *   **Forms:** Anytime, but likely during intro (Step 2) or when seeing the complexity (Step 5).
  *   **Defusal:** **During Step 2/3 or Step 5 Q&A.** Challenge: *How* do you calculate the probability that *someone* with your exact evidence `E` exists *and* that *you* are that someone? Modeling the world objectively (3rd-person) doesn't tell you which observer you are. The indexical "I" needs explicit handling in the probability calculus.

  **Closing Question & Refusal:**

  *   **Closing Question:** "Based on my evidence `E`, does observing `E` make Hypothesis H_civ (the large civilization) *more* or *less* likely than it was before I had this evidence, and why? Answer under both SSA and SIA."
      *   **Answer Differs by Assumption:**
          *   **SSA:** Observing `E` makes H_civ **less likely** (posterior odds drop). Because `E` is rare under H_civ (only 0.1% of observers have it), making it less surprising under H_colony where it's universal.
          *   **SIA:** Observing `E` makes H_civ **more likely** (posterior odds increase, significantly). While `E` is rare *within* H_civ, H_civ's massive headcount means your existence *with any evidence* is much more likely under H_civ. Observing `E` doesn't overcome this headcount advantage enough to favor H_colony.
      *   **Why it Works:** It forces them to think about the *update* caused by the evidence `E` itself, not just the final posterior. The answer hinges directly on how `P(E|H)` is defined under each assumption, highlighting the core difference beyond simple headcount priors.

  *   **What to Refuse to Adjudicate:** **Openly refuse to declare which assumption, SSA or SIA, is "correct" or "should be used".**
      *   **Reason:** This is the deepest philosophical debate in anthropic reasoning. There are strong arguments (and counter-arguments) for both (e.g., SIA avoids "presumptuousness" but may lead to observer-driven fine-tuning; SSA avoids the "baby-paradox" but may lead to Doomsday-like conclusions). Your goal is to elucidate the *structure* of the problem and the *consequences* of each choice, not to resolve the foundational philosophical dispute. Acknowledge it's an active area of discussion.

  This structure leverages their Bayesian skills, introduces the novel element forcefully with a clear contrast case, shatters the "just a prior" misconception decisively, maps and counters predictable misunderstandings, and ends with a question reinforcing the core conceptual difference. Good luck!
