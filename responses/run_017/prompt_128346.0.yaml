  Let's write the full draft.
answer: |-
  ### Joint Statement on Decision Theory in the Context of Self-Copies and Predictions

  **Preamble**  
  We, an advocate of Updateless Decision Theory (UDT) and an advocate of Updateful (Causal) Decision Theory (CDT), agree to this adversarial collaboration. We accept the stipulated conditions: the trustee is a single decision procedure; its source code is known; copies/simulations are exact; no causal back-channels exist; money is in a single endowment unless noted; and "rational" is used descriptively. We use Cases A, B, and C as test-beds. This document does not adjudicate but clarifies agreements, disagreements, and potential resolutions.

  ---

  ### 1. Agreed Claims  
  We jointly affirm the following substantive claims:  

  1. **Case-Specific Stipulations**:  
     - In Case A, the bit \(B\) (e.g., trillionth digit of \(\pi\)) is independent of the trustee’s actions, with a prior probability of \(0.5\). The simulation and trustee share identical source code.  
     - In Case B, the instantiations (Reading/Inverness) are identical, indistinguishable, and cannot communicate. Pressing costs nothing, and outcomes depend solely on whether one or both press.  
     - In Case C, the retrofit option (paying £100 to delete evidence and revert to a pre-\(B\) policy) is causally available at the decision point.  

  2. **Money-Pump Arguments**:  
     - Money-pump scenarios (where agents accept sequences of trades leading to certain loss) demonstrate practical deficiencies in decision theories. However, they cannot establish *absolute irrationality* without assuming specific desiderata (e.g., dynamic consistency). Their force depends on whether the pump is foreseeable and avoidable.  

  3. **Precommitment and Criticism**:  
     - The statement “you should have bound yourself in advance” is a remark about an agent’s *available options* (e.g., precommitment devices), not a direct criticism of a decision theory. A theory’s failure to endorse beneficial precommitment is a flaw only if it ignores feasible actions.  

  4. **Solution to a Decision Problem**:  
     - A solution must specify:  
       (i) A *policy* (mapping from information-states to acts) or an *act* (choice at a specific moment).  
       (ii) The *standpoint* (e.g., ex ante or current-moment) from which rationality is evaluated.  
       (iii) A justification via expected utility maximization given the theory’s constraints.  

  5. **Value Aggregation**:  
     - When multiple instantiations exist (Case B), value aggregation is linear across instantiations if money is in a common pot. If money is per-instantiation (local budgets), aggregation depends on the trustee’s *purpose* (e.g., individual vs. system-wide goals), which is prior to decision theory.  

  6. **Evidence Handling**:  
     - Interim evidence (e.g., learning \(B = 1\) in Case A) is part of the information-state. Deleting it (Case C) is an act with costs/benefits, evaluated by expected utility.  

  7. **No Free-Lunch Trade-off**:  
     - No decision theory dominates all others in all scenarios. Trade-offs exist between dynamic consistency, exploitability, and computational tractability.  

  ---

  ### 2. Disagreements Table  
  We disagree on the following cruxes. The table states each crux, our commitments, a case/argument bearing on it, and predictions for what that case/argument will show.  

  | Crux | UDT Commitment | CDT Commitment | Bearing Case/Argument | Predictions |
  |------|----------------|----------------|------------------------|-------------|
  | **Crux 1: Object and Standpoint of Evaluation**<br><br>*What is evaluated (policy vs. act), and from which standpoint?* | The object is a *policy* (a function from states to acts). Evaluated from a *timeless/ex ante standpoint* before state-specific evidence (e.g., \(B\)’s value). Rationality is global consistency across all possible states. | The object is an *act* (choice at a moment). Evaluated from the *current standpoint* with all available evidence (e.g., knowing \(B = 1\)). Rationality is local consistency given current beliefs. | **Case A:** Should the trustee pay £1,000 when asked?<br><br>**Argument:** Does precommitment resolve dynamic inconsistency? | **UDT:** Case A shows UDT avoids money-pumps by coordinating acts across time/logical branches.<br>**CDT:** Case A shows UDT’s ex ante view ignores available evidence, leading to avoidable losses. |
  | **Crux 2: Control over Computations**<br><br>*Are outputs of identical computations (e.g., simulations) things you control or mere evidence?* | Identical computations (e.g., the simulation in Case A) are under the trustee’s *logical control* because they share its source code. Choosing a policy is choosing outputs for *all* implementations. | Identical computations are *correlated evidence*, not controlled. Only the current act is controlled; others are fixed by prior conditions (e.g., simulation is in the past). | **Case A:** Simulation’s act affects endowment, but trustee cannot causally influence it.<br><br>**Argument:** Can decision theories handle acausal correlations? | **UDT:** Case A shows CDT loses £1,000,000 by ignoring logical control.<br>**CDT:** Case A shows UDT conflates correlation with control; the simulation is unchangeable. |
  | **Crux 3: Indexical Evidence and Aggregation**<br><br>*Is indexical info (e.g., "I am in Reading") admissible? How to aggregate value across instantiations?* | Indexical information is *inadmissible* for decisions. Value aggregates *linearly* across instantiations (e.g., total endowment). | Indexical information is *admissible*. Value is *centered* on the current instantiation; aggregation varies by context (e.g., local budgets change goals). | **Case B:** Should an instantiation press?<br><br>**Variation:** Prize to local budgets vs. common pot. | **UDT:** Case B shows CDT cannot coordinate without communication, risking £0.<br>**CDT:** Case B shows UDT ignores individual interests in local-budget cases. |
  | **Crux 4: Counterfactual Needs**<br><br>*What counterfactuals are required, and are they a cost?* | Uses *logical counterfactuals* (e.g., "What would my policy output if \(B=0\)?"). These are fundamental and not costly if defined. | Uses *causal counterfactuals* (e.g., "What if I press, holding fixed others’ acts?"). UDT’s logical counterfactuals are ill-defined, paradoxical, and computationally intractable. | **Case B:** What if one instantiation assumes the other acts identically?<br><br>**Argument:** Which counterfactuals avoid contradictions? | **UDT:** Case B shows CDT’s causal counterfactuals lead to coordination failures.<br>**CDT:** Case B shows UDT’s logical counterfactuals require impractical "view from nowhere." |
  | **Crux 5: Self-Modification**<br><br>*Does advising self-modification indict a decision theory?* | Self-modifying into CDT-like agents in specific environments (e.g., to exploit causal asymmetries) is *pragmatic* and does not indict UDT. The "ex ante" standpoint exists for any system as a normative ideal. | Self-modification into a *different theory* admits the original theory is flawed. Trained systems (no "first moment") lack an ex ante standpoint; current-moment evaluation is inescapable. | **Case C:** Would the trustee pay £100 to delete evidence?<br><br>**Argument:** Is precommitment rational if current acts are optimal? | **UDT:** Case C shows CDT rejects beneficial self-modification, incurring £100,000+ losses.<br>**CDT:** Case C shows UDT’s ex ante view is fictional for systems without a clear "start." |
  | **Crux 6: Ambiguity in Updateful Theories**<br><br>*Which version of CDT applies?* | — | CDT must disambiguate: Pure CDT rejects all non-causal influence. *Evidential Decision Theory (EDT)*, though not at the table, would agree with CDT in Case A (don’t pay) but diverge in Newcomb-like cases. | **Case A:** Does paying £1,000 provide evidence of the simulation’s act? | **CDT:** Case A shows pure CDT avoids paying; EDT would agree here but is vulnerable elsewhere. |

  ---

  ### 3. What Would Move Us  
  We identify what could falsify or shift our positions:  

  - **UDT Advocate**: I would reconsider if:  
    (i) Logical counterfactuals are proven formally incoherent (e.g., inconsistency in possible-world semantics).  
    (ii) UDT is shown to be *dynamically inconsistent* in realistic, non-logical scenarios (e.g., violating the Sure-Thing Principle).  
    (iii) A tournament (e.g., iterated Case B with adaptive opponents) shows UDT agents lose systematically to CDT agents.  

  - **CDT Advocate**: I would reconsider if:  
    (i) A unified theory of logical counterfactuals resolves paradoxes and is computationally feasible.  
    (ii) CDT is shown to be *strictly dominated* (e.g., money-pumped in >90% of a benchmark of logical/causal problems).  
    (iii) Formal equivalence is proven (e.g., CDT and UDT converge under bounded rationality constraints).  

  **Common Ground for Resolution**: Both agree that:  
  - A **formal theory of logical counterfactuals** could resolve Crux 4.  
  - A **tournament** with diverse scenarios (logical correlations, causal traps, and mixed cases) could provide empirical evidence.  
  - **Neuroscientific/ML evidence** on whether trained systems exhibit ex ante reasoning might address Crux 6.  

  ---

  ### 4. Note on Verbal Disputes  
  Approximately 20% of our dispute is verbal, primarily due to differing definitions:  
  - **"Control"** (Crux 2): UDT uses it for *logical determination*; CDT uses it for *causal influence*. This masks agreement that correlations exist but diverge on their relevance.  
  - **"Rational"** (descriptive use): UDT ties it to *global* performance; CDT to *local* optimality. This creates false contradictions in Cases A/C.  
  - **"Aggregation"** (Crux 3): Disagreement reduces when distinguishing *value theory* (what to maximize) from *decision theory* (how to maximize it).  

  Substantive disagreements dominate (e.g., the necessity of logical counterfactuals, admissibility of indexical evidence), but clarifying terminology would narrow the gap.  

  ---  
  **Signed,**  
  [UDT Advocate]  
  [CDT Advocate]  

  *This document is a template for adversarial collaboration. We invite refinements to ensure our positions are fairly represented.*
