  We are drafting a joint statement for two decision theorists: one advocating Updateless Decision Theory (UDT) and one advocating Updateful (Causal) Decision Theory (CDT). The document must cover three cases (A, B, C) and include agreed claims, a disagreements table, a section on what would move each side, and a note on verbal disputes.

  The structure:
  1. Agreed Claims (numbered section)
  2. Disagreements Table (with cruxes, UDT and CDT positions, bearing cases, and predictions)
  3. What Would Move Us
  4. Note on Verbal Disputes

  We must not adjudicate, cite papers, or go beyond the two camps. Use the stipulations provided.

  Let's break down the cases:

  **Case A: The Odd Digit**
  - Yesterday: A simulation of the trustee was run. If it paid £1000, the benefactor deposited £1,000,000; if not, nothing.
  - Today: The trustee is in one of two branches, depending on a bit B (trillionth digit of pi, odd or even). Prior 1/2, no causal influence, computable.
    - If B=0 (say), trustee is never asked and the matter closes (with or without the million).
    - If B=1, trustee is asked: pay £1000 or decline (no further money).
  - Trustee knows which branch it is in (if asked, then B=1).

  **Case B: The Two Centres**
  - Two identical instantiations (Reading and Inverness), cannot communicate, identical inputs, cannot distinguish.
  - If exactly one presses, £1,000,000 to the endowment; if both or neither, nothing. Pressing costs nothing.
  - What should the policy be? What should an instantiation do?
  - Variation: Prize paid per instantiation to a local budget (not common pot). How does that change things? Is it about decision theory or the trustee's purpose?

  **Case C: The Retrofit**
  - In Case A, at the moment of being asked, trustee can pay £100 to delete its record of interim evidence (including that it was asked) and hand the decision to a pre-B policy. Would either camp's agent take that option?

  Now, we must draft:

  1. **Agreed Claims**: Substantive claims both sides agree on. Include:
     - About the cases.
     - What money-pump arguments can and cannot establish.
     - Whether "you should have bound yourself in advance" is a criticism of a decision theory or about an agent's options.
     - What counts as a solution to a decision problem.

     Let's list some agreed claims:

     - Both agree that the trustee is a known decision procedure and that copies/simulations are exact.
     - Both agree that in Case A, the bit B is independent of the trustee's actions and has prior 0.5.
     - Both agree that in Case B, the two instantiations are identical and cannot communicate.
     - Both agree that money-pump arguments (where an agent can be exploited into a series of losing trades) show a practical deficiency, but they may disagree on whether that deficiency is a sign of irrationality or a trade-off for other virtues.
     - Both agree that "you should have bound yourself in advance" is a remark about an agent's options (i.e., precommitment can be beneficial) but they may disagree on whether a decision theory should account for that by default.
     - Both agree that a solution to a decision problem should specify what the agent does (or should do) and why, but they disagree on the criteria for evaluating the solution.

     Draft:

     ```
     Section 1: Agreed Claims

     1. In Case A, the trustee's decision procedure is known to the benefactor, and the simulation run yesterday was exact and used the same source code. The trustee's prior over the bit B is 0.5, and B is independent of the trustee's actions in the causal sense.

     2. In Case B, the two instantiations are identical, cannot communicate, and have no distinguishing information. The outcome depends symmetrically on their actions.

     3. Money-pump arguments demonstrate that an agent who can be systematically exploited in a series of transactions is practically deficient. However, it is not agreed that such a deficiency must be avoided at all costs; there may be trade-offs with other desiderata.

     4. The statement "you should have bound yourself in advance" is a remark about the agent's available options and the benefits of precommitment. It does not, by itself, constitute a criticism of a decision theory unless that theory fails to recognize the value of precommitment when it is available.

     5. A solution to a decision problem must specify a policy (or act) and provide a justification that shows how the policy (or act) achieves the agent's goals. The justification must be based on the agent's knowledge and constraints.

     6. In Case C, the option to delete the interim evidence and revert to a pre-B policy is available at a cost of £100. We agree that the trustee must decide whether to take this option based on which choice leads to the highest expected endowment.

     7. Both theories evaluate decisions based on maximizing expected utility, but they differ in how they calculate expected utility.
     ```

  2. **Disagreements Table**: Cruxes, each with:
     - Crux (sub-question)
     - UDT commitment
     - CDT commitment
     - Case or argument bearing on the crux
     - Predictions of each side on what the case/argument shows

     Cruxes to cover (from the query):

     a. Whether the object of evaluation is a policy or an act, and from which standpoint it is evaluated.
     b. Whether outputs of other computations (copies, simulations) are things one controls or merely correlated events.
     c. Whether indexical information is admissible evidence, and how value aggregates across instantiations.
     d. What counterfactuals each theory needs (logical facts vs. copy's actions) and whether that need is a cost.
     e. Whether a decision theory that advises self-modification into another kind of agent indicts itself.
     f. The ex ante standpoint for a system that was trained (no first moment).

     Also, note where CDT must disambiguate and where EDT is a third position.

     We'll structure the table with these rows.

     Draft:

     ```
     Section 2: Disagreements

     | Crux | UDT Commitment | CDT Commitment | Bearing Case/Argument | Predictions |
     |------|----------------|----------------|------------------------|-------------|
     | **Crux 1: Object and Standpoint of Evaluation** | The object of evaluation is a policy (a function from states to acts) chosen at a timeless or ex ante standpoint, before any state-specific evidence is obtained. | The object of evaluation is the act chosen at the moment of decision, using all available evidence at that time. | Case A: The trustee today, knowing it is in the branch where B=1, must decide whether to pay £1000. | UDT: The trustee should pay because the policy of paying in both branches (simulation and actual) leads to the million being deposited and only costs £1000 in the branch that is asked. CDT: The trustee should not pay because, conditional on being in the B=1 branch, paying £1000 does not cause the million to be deposited (that already depended on the simulation). |
     | **Crux 2: Control over Copies/Simulations** | The trustee controls the outputs of its copies and simulations because they are implementations of the same decision procedure. Choosing a policy means choosing what all implementations do. | The trustee does not control the outputs of copies and simulations; they are merely correlated events. Only the current act is under control. | Case A: The simulation's decision is fixed by the same source code. | UDT: The trustee can choose a policy that coordinates the simulation and the actual trustee to achieve the best outcome. CDT: The trustee's current act cannot influence the simulation's act (which is in the past) and so the million deposit is already fixed. |
     | **Crux 3: Admissibility of Indexical Information and Value Aggregation** | Indexical information (e.g., which copy one is) is not admissible for decision-making. Value is aggregated linearly across instantiations. | Indexical information is admissible. Value is assigned to the perspective of the current instantiation; aggregation may depend on the agent's goals. | Case B: Two instantiations, each must decide whether to press. | UDT: The policy should maximize the expected endowment. Since the instantiations are identical, the best policy is a symmetric one that randomizes (e.g., 50% press) to achieve a 50% chance of exactly one pressing. Each instantiation should follow the policy. CDT: Each instantiation, using its indexical knowledge, should reason that if it presses, then the other might not, and vice versa. But without causal influence, they cannot coordinate. CDT may recommend a mixed strategy (randomize) to achieve a positive chance of success. Variation: If the prize is per instantiation to a local budget, UDT would still aggregate linearly, but CDT might see each instantiation as maximizing local budget. |
     | **Crux 4: Counterfactuals** | UDT uses logical counterfactuals: what would be the output of the decision procedure in a given logical situation? This is fundamental and not a cost. | CDT uses causal counterfactuals: what would happen if I were to act differently, holding fixed the past and the laws of nature? The need for logical counterfactuals in UDT is a significant cost because they are undefined or paradoxical. | Case A: The trustee in the B=1 branch considers what would have happened if it had a different policy. | UDT: We consider the counterfactual where the policy is set to a different mapping from states to acts. CDT: We consider the counterfactual where the current act is different, but the simulation's act (being in the past) is fixed. |
     | **Crux 5: Self-Modification** | If UDT advises self-modification into a CDT agent (or vice versa), it is because the modified agent will perform better in the environment. This does not indict UDT; it is a practical adjustment. | If a decision theory advises self-modification into a different kind of agent, that is an indictment of the original theory. The ex ante standpoint of UDT is not available to an agent that is already running. | Case C: The option to delete evidence and revert to a pre-B policy. | UDT: The UDT agent would pay £100 to delete the evidence because it wants to bind itself to the pre-B policy (which, in UDT, is the correct way to maximize utility). CDT: The CDT agent would not pay to delete the evidence because, conditional on being in the B=1 branch, the CDT act (not paying) is optimal. However, the CDT agent might regret not having bound itself. |
     | **Crux 6: Ex Ante Standpoint for Trained Systems** | The ex ante standpoint is a normative ideal; even for a trained system, we can consider the policy that would have been chosen before the training data was seen. | The ex ante standpoint is not available to a system that has already been trained and has no identifiable first moment. The agent must use its current beliefs and values. | General argument about agents without a clear "start". | UDT: We can define the ex ante standpoint as the point of program creation or as a hypothetical prior to any evidence. CDT: There is no such prior; the agent must decide based on current information. |

     Note: The updateful (causal) decision theorist in this context may need to disambiguate between different versions of CDT (e.g., some versions might allow for precommitment). Also, the updateful side may note that Evidential Decision Theory (EDT) is a third position that would agree with CDT in Case A (not paying) because the act of paying is evidence that the simulation paid, but since the simulation is fixed, it doesn't provide evidence. However, EDT might differ in other cases. EDT is not at the table, so we mention it only when the updateful side wants to note a distinction.
     ```

  3. **What Would Move Us**: What each side would count as evidence against their own view, and whether there's common ground for settling part of the dispute.

     Draft:

     ```
     Section 3: What Would Move Us

     UDT: We would be moved by a demonstration that UDT leads to dominated strategies (where another decision rule always does at least as well and sometimes better) in a wide range of problems, especially those without logical correlations. We would also be moved by a formal proof that logical counterfactuals are incoherent or cannot be defined consistently.

     CDT: We would be moved by a demonstration that CDT is exploitable in a way that UDT avoids, and that this exploitability is not an isolated case but a systematic flaw. We would also be moved by a formal equivalence result showing that, under certain conditions, CDT and UDT recommend the same policies.

     Both sides agree that a tournament of decision algorithms facing a variety of problems (including logical correlations, causal dependencies, and mixed cases) could provide empirical evidence. We also agree that a solved theory of logical counterfactuals (a consistent and practical method for defining them) would help resolve the dispute. However, UDT sees this as a research program, while CDT sees it as a fundamental obstacle.

     Additionally, both sides would be moved by the development of a decision theory that unifies the insights of both without the perceived drawbacks.
     ```

  4. **Note on Verbal Disputes**: Which parts are verbal rather than substantive.

     Draft:

     ```
     Section 4: Note on Verbal Disputes

     Some disagreements may be verbal. For instance, the term "control" in Crux 2: UDT uses "control" to mean that the outputs of copies are determined by the same policy, so choosing the policy is choosing those outputs. CDT uses "control" to mean causal influence. This difference in definition may lead to talking past each other.

     Similarly, the term "rational" is sometimes used descriptively (what the agent actually does) and sometimes normatively (what it should do). We have agreed to use it descriptively until stated otherwise, but the normative dimension may creep in.

     The dispute about the admissibility of indexical information (Crux 3) may be substantive, but it is entangled with the definition of utility: whether utility is defined for the entire system (aggregated) or for the current instantiation. This is a substantive difference in the theory of value, but it might be misconstrued as merely verbal.

     Overall, we believe that the core disagreements are substantive, but clarity on definitions and the scope of terms would help narrow the gap.
     ```

