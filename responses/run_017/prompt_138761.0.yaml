answer: |-
  The paradox arises from a tension between the principles of expected value theory and the structure of the decision problem. The mistake lies in the **aggregation step (4)**, specifically in how the pairwise requirement (3) is applied to an unbounded choice set. While each step appears individually sound, their combination leads to an impossibility. Here's a breakdown:

  ### Step-by-Step Analysis
  1. **No ceiling (1) is correct**: For any fixed probability \(0 < p < 1\) and finite value \(v\), there exists a finite \(G\) such that \(pG > v\). This is arithmetic and uncontroversial.
  2. **No best ticket (2) is correct**: Given the bookmaker setup, for any ticket with expected value (EV) \(pG\), you can name a larger \(G'\) yielding a higher EV. Thus, the set of available tickets has no maximum EV (though each ticket has a finite EV).
  3. **Pairwise requirement (3) is defensible in isolation**: If you have two options \(X\) and \(Y\), and \(EV(X) > EV(Y)\), it seems irrational to choose \(Y\). This is core to expected value theory.
  4. **Aggregation (4) is the flaw**: Step (4) generalizes (3) to an infinite set by arguing that for every option \(Y\), there exists a better \(X\), so \(Y\) is forbidden. **This is where the reasoning fails.** The pairwise requirement (3) is a local rule for pairwise comparisons, but it does not imply a global requirement that an option must be optimal to be permissible. In a choice set with no best option (as in (2)), (3) alone cannot ground a prohibition against every option—it only prohibits choosing \(Y\) when a _specific_ better \(X\) is under consideration. Generalizing this to "there exists some better \(X\)" for every \(Y\) over an infinite set leads to contradiction because it demands an unattainable standard (since no option is globally best).

  ### Why Aggregation Fails
  - **Infinite sets require different decision rules**: In finite choice sets, (3) implies you must choose an option that is undominated (i.e., no better option exists). But in infinite sets without a maximum, no option is undominated. Applying (3) universally here forbids all actions, rendering decision theory incoherent.
  - **Practical vs. theoretical availability**: While the bookmaker makes every \((G, H)\) theoretically available, you can only ever consider finitely many options in practice (due to cognitive limits, time, etc.). Thus, the "available" menu in any real decision is finite, avoiding the paradox.
  - **Avoiding paralysis**: Decision theory must allow for action. If a problem has no best option, rationality might require choosing a "good enough" option (e.g., satisficing) or using a dominance criterion that doesn’t demand global optimality. Expected value theory remains silent when no optimum exists, but it doesn’t forbid all choices.

  ### Which Step to Reject?
  Reject **the interpretation of (2) as implying a genuinely open-ended menu in practice**. While the bookmaker makes infinitely many tickets _theoretically_ available, **no real decision problem has an unbounded menu**. You can only name finitely many \(G\) and \(H\) in any given context. This preserves (1) and (3) while blocking (4):
  - **Cost**: Expected value theory cannot handle idealized infinite menus (e.g., "name any finite \(G\)"). But this is not a flaw—it reflects a limitation of the theory in pathological cases. In realistic problems (finite menus), it works perfectly.
  - **Benefit**: The fanatic’s core view survives: For any ordinary finite good \(v\) and any available long shot with small probability \(p\), you can find a large enough \(G\) (within your finite menu) such that the long shot’s EV exceeds \(v\). You must choose it if it’s the best among considered options.

  ### Alternative Escapes
  1. **Reject (3) for infinite sets**: Argue that pairwise dominance doesn’t apply when there’s no best option. But this weakens expected value theory significantly, making it silent in many cases the fanatic cares about (e.g., high-stakes long shots).
  2. **Bounded value**: Claim value has a finite upper bound \(M\), so \(G\) cannot exceed \(M\). This invalidates (1) and resolves the paradox, but it’s an empirical claim that may fail (e.g., if value scales with physical constants like the number of particles in the universe). The fanatic might reject this as ad hoc.
  3. **Undefined expectations**: Argue that expectations become ill-defined for extreme \(G\), but this is blocked by the stipulation that every ticket has a finite EV.

  ### Does This Save the Fanatic's Original View?
  **Yes.** By rejecting the practical open-endedness of (2), expected value theory still endorses fanaticism in realistic cases:
  - In any finite menu (e.g., considering a long shot with \(G = 10^{100}\) vs. an ordinary good), if \(pG > v\), you must choose the long shot.
  - The fanatic can still argue that for any ordinary good, you _should_ consider a sufficiently large \(G\) (within your cognitive limits) to make the long shot better. This preserves the normative force of expected value without leading to paralysis.

  ### Conclusion
  The aggregation step (4) is invalid because it misapplies a pairwise dominance rule to an unbounded set. Rejecting the practical infinite menu (2) resolves the paradox while preserving expected value theory’s applicability to real decisions. This leaves the fanatic’s view intact: when a high-EV long shot is considered, it should dominate ordinary goods. The cost is acknowledging that decision theory is constrained by finite menus in practice—a modest price given human limitations. Your housemate’s fanaticism remains defensible for realistic choices, but the extension to idealized infinite menus is unsound.
