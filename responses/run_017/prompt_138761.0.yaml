   Alternatively, we might reject the idea that the bookmaker scenario is realistic. In reality, we don't have access to such a bookmaker. Therefore, the open-ended menu does not arise. But the fanatic might counter that we do have access to long shots (like buying a lottery ticket that pays a huge amount if you win) and that we can always imagine a longer shot with a bigger payoff. So the problem might still arise in principle.

   However, note that in the real world, lotteries have a fixed set of prizes and odds. We cannot choose arbitrary G and p. Therefore, the set of available lottery tickets is finite. So the problem of an open-ended menu does not arise.

   But the fanatic might say: we can create new lotteries? Well, that's not typically available. So in practice, we are safe.

   But the fanatic might insist that in principle, we can always design a new lottery with a larger G. Then we are back to the problem.

   Conclusion:

   The step that is most vulnerable is the extension of the pairwise requirement to an infinite set without a maximum. The pairwise requirement (3) is meant for finite sets. In infinite sets, we need a more sophisticated decision theory. One such theory is to use the concept of admissibility: an option is admissible if it is not dominated by any other option. But in this case, no option is admissible. Therefore, we might say that there are no admissible options, so the decision problem is pathological. We might then say that rationality does not require anything in such a situation, but that does not help because we must act.

   Alternatively, we might use a ranking of options by expected value and then choose an option that is sufficiently high (even if not the best). But without a maximum, we cannot define "sufficiently high" without an arbitrary cutoff.

   Therefore, I think the best response is to reject the open-endedness of the menu (2) by appealing to practical limitations: we can only consider finitely many options. Then we choose the best among the ones we considered. This leaves the fanatic's original point intact for the finite set we consider: we should always prefer a long shot with a sufficiently large G to any ordinary good, provided that the long shot is among the options we consider. But we are not required to consider an unbounded set.

   However, the fanatic might push: what if we are required to consider more and more options? Then we might never decide. But that is a problem of computational limitations, not of the decision theory per se.

   In summary, the mistake is in the aggregation step (4) when applied to an infinite menu without a maximum. The pairwise requirement (3) leads to forbidding every option only when there is no best option. To avoid this, we must either have a maximum (by bounding the menu) or reject the pairwise requirement in such contexts. Given that the fanatic wants expected value theory to be action-guiding, they must accept that the menu is finite in practice.

   Therefore, I reject (2) as a description of a realistic decision problem. The menu of available options is always finite in practice. Thus, there is a best ticket (or at least a set of tickets tied for best) and we can choose that.

   This escape leaves expected value theory intact for the cases the fanatic cares about: when there is a finite set of options, we choose the one with the highest expected value. And in the finite set, the fanatic's point holds: a small chance of a huge good can dominate a sure thing of a finite good. But we are not forced into paralysis.

   However, note that if we accept that the menu is finite, then the fanatic's argument for fanaticism still goes through for that menu. The problem of paralysis only arises in the idealized infinite menu.

   Therefore, the cost of rejecting (2) is that we must accept that we only ever face finite menus. This seems plausible. And it leaves expected value theory as a guide for finite decision problems.

   But what if we face a decision problem that is inherently unbounded? For example, we might be able to keep thinking of better and better long shots indefinitely. Then we would never decide. But in reality, we have to act within a limited time. Then we must choose from the options we have considered so far. So again, we have a finite menu.

   Therefore, I recommend rejecting (2) as an unrealistic idealization. The menu of available options is always finite in practice.

   Alternatively, we might accept (2) but reject (3) for infinite menus. Instead, we might require that we choose an option that is "maximal" (if one exists) and if none exists, we use a different rule. But without a maximal element, we might have to use a satisficing rule: choose an option that has expected value above a certain threshold. However, setting the threshold arbitrarily might be problematic.

   Given the two options, I prefer to reject (2) because it is more realistic and preserves the pairwise requirement (3) for the cases we actually face.

   So to answer your questions:

   - Which step do I reject? I reject (2) as a description of real decision problems. The menu is not genuinely open-ended in the way required because we can only access finitely many options.

   - Does this leave expected value theory silent in the cases the fanatic wants to pronounce on? No, because in the finite menu, the fanatic can still say that we should choose the long shot with the huge G over the ordinary good if the expected value of the long shot is higher. And by the no ceiling principle (1), for any ordinary good with value v, we can find a long shot (with a sufficiently large G) that has an expected value greater than v. So if such a long shot is in the menu, we should choose it. But if it is not in the menu (because we didn't think of it), then we don't. So the fanatic's point still holds conditionally: whenever we consider a long shot with a sufficiently large G, we should choose it over the ordinary good. But we are not required to consider all possible long shots.

