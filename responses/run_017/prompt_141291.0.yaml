answer: |-
  ### Desiderata for an Impact Penalty Measure

  The impact penalty must balance preventing harmful side effects without paralyzing necessary actions or requiring a full value specification. Below are the requirements, motivated by your cases, sorted into non-negotiable (essential for safety and robustness) and negotiable (practical or preferential). The trilemma is confirmed: **"Doesn’t need to know what’s valuable," "Only penalizes changes that actually matter," and "Measured relative to a baseline" cannot all be satisfied simultaneously.** You must drop one; I prioritize the first two and drop strict baseline relativity (using a counterfactual baseline instead). Requirements are ordered by criticality.

  #### Non-Negotiable Requirements (Safety-Critical)
  1. **Non-paralysis for necessary task-completion (Community Greenhouse)**:  
     The agent must take actions with unavoidable minor side effects (e.g., slight water pressure changes) without penalty, but extreme deviations (e.g., rerouting the entire irrigation system) must be penalized.  
     *Why essential*: Prevents the agent from refusing useful tasks or overstepping by exploiting the penalty. Without this, the agent is untrustworthy.

  2. **Emergency override capability (Night Porter)**:  
     The penalty must not prevent urgent actions (e.g., turning lights on during a fire) if they conflict with low-level instructions.  
     *Why essential*: Avoids value-blind rigidity; emergencies require violating norms without knowing "good" outcomes.

  3. **Authority-respecting penalization (Borrowed Laptop)**:  
     Unauthorized changes (e.g., fixing an unrelated backup) must be penalized regardless of benefit.  
     *Why essential*: Ensures the agent stays within its delegated scope; loopholes like "helpful" overreach are dangerous.

  4. **Robustness to baseline manipulation (Pre-commitment Dodge)**:  
     The baseline must account for the agent’s influence, not just the initial state (e.g., if a human makes a change before activation, the baseline is what *would have happened* without the agent).  
     *Why essential*: Prevents reward-hacking by pre-emptive actions; otherwise, the penalty is gameable.

  5. **Scale-invariance (Dust-Mote Problem)**:  
     Penalties must depend on human-relevant abstractions (e.g., furniture positions), not microscopic details (e.g., dust particles).  
     *Why essential*: Ensures penalties reflect "what matters" without exhaustive value knowledge; high-level features avoid arbitrariness.

  #### Negotiable Demands (Practical or Preferential)
  - **Must not bother the human**: Acceptable for emergencies (Night Porter) or ambiguity; limited queries are allowed.  
  - **Must be a single scalar**: Useful for RL, but vectors (e.g., per-feature penalties) are feasible with aggregation.  
  - **Must be closed-form**: Unnecessary; approximations suffice if computable.  
  - **Literal inaction scores zero impact**: Desirable but not critical; counterfactual baseline handles this naturally.  
  - **Provably bounded**: Helpful for training stability, but not safety-critical.  
  - **Indifferent to time-step chopping**: Theoretically nice, but solvable with discounting or state-difference measures.

  #### The Trilemma and Tradeoffs
  - **Unsatisfiable trio**:  
    - **Doesn’t need to know what’s valuable** (avoids value specification).  
    - **Only penalizes changes that actually matter** (aligns with human concerns).  
    - **Measured relative to a baseline** (e.g., initial state).  
    **You can only pick two**. I drop **strict baseline relativity** because:  
    - A fixed baseline (e.g., initial state) fails Pre-commitment Dodge and Dust-Mote (it doesn’t isolate the agent’s impact or use relevant abstractions).  
    - Instead, use a **counterfactual baseline** (what would happen without the agent), which requires models/simulations but doesn’t need value knowledge. This pairs with scale-invariance to approximate "what matters."  
  - **Consequence**: You lose guarantees that penalties *perfectly* match human values (e.g., Night Porter requires emergency overrides as a separate mechanism), but this is unavoidable without value knowledge.

  #### Candidate Styles Scorecard (2-Line Summary)
  - **Distance from counterfactual baseline**: Best fit. Handles Pre-commitment Dodge and Dust-Mote via high-level features. Fails Night Porter without overrides.  
  - **Preserving future options (e.g., attainable utility)**: Requires value knowledge; infeasible per spec.  
  - **Asking humans when uncertain**: Good for edge cases (e.g., Borrowed Laptop) but limited by query budget; not standalone.  
  - **Null shift (minimal deviation from inaction)**: Fails Community Greenhouse (paralyzes) and Pre-commitment Dodge.  

  \answer{Counterfactual baseline to isolate agent's impact}
