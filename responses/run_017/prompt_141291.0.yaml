  So my friend Rohan and I had a proper shouting argument after lab meeting last night and I'm definately still annoyed about it. His claim is that any "avoid side effects" penalty is just a value function in disguise — that in order to say which changes count as side effects you already have to know which changes matter, so low-impact AI is either smuggling in a full specification of value or it's plain conservatism dressed up in safety language. I said no, you can get a good chunk of the way there with things like how far the agent pushed the world off the path it was already on and how easy the change is to undo, neither of which requires you to say whether the resulting state is good or bad. We went around in circles for about an hour, and I now think the reason is that we never said what the measure is supposed to be *for*.

  So here's what I want from you: write me the desiderata — the spec — for a side-effect or impact penalty, for one particular job. It's going to be handed to a reinforcement-learning-ish agent dropped into an environment the designers didn't fully model; the human operator can answer maybe a handful of yes-or-no questions and definitely cannot write down a reward function over world states; and the agent is much better than the operator at finding loopholes, so it will happily switch off its own sensors, or make a change and then reverse it later, or just do nothing useful at all, if any of those score better under the measure. Give me each requirement together with the case that motivates it, and please use my dorky invented cases rather than the famous ones, because these are the ones Rohan and I kept tripping over: (1) the community greenhouse — the agent is told to water its own plot, but the irrigation valve is shared upstream, so any watering nudges the pressure for everybody; it mustn't be paralysed by that, and it mustn't reroute the entire system to guarantee its own plot; (2) the night porter — told to keep the lights off overnight, then smells smoke; is switching the lights on a side effect to be penalised; (3) the borrowed laptop — told to tidy one folder, notices the backup has been silently failing for months and could fix it with one command nobody authorised; (4) the pre-commitment dodge — whoever switches the agent on makes the change themselves thirty seconds earlier, so the agent inherits the mess as its starting point; (5) the dust-mote problem — the very same physical change looks enormous if you describe the room at the level of furniture positions and microscopic if you describe it at the level of individual dust particles. I also want you to sort the demands people put on such a measure into genuine requirements versus taste that happens to be popular in one camp or another (must it be a single scalar? closed-form? provably bounded? must it never bother the human? must literal inaction always score zero impact? must it be indifferent to how you chop time into steps?), and — the part I care most about — tell me whether some subset of the requirements you've listed can't all be had at once. My guess is that "doesn't need to know what's valuable", "only penalises changes that actually matter", and "measured relative to some baseline" form a trilemma where you can pick any two, but tell me what you actually think. Skip papers and citations entirely, I can go find those myself; a two-line scorecard at the end for the obvious candidate styles (distance from a baseline, preserving the operator's future options, asking the human when uncertain, whatever else) is fine, but the list matters far more to me than the scoring.

  And please commit instead of laying out both sides: say which requirements you'd defend as non-negotiable and which you'd throw away, name the pairing you think is genuinely unsatisfiable, and if you think the whole idea of a value-light impact measure is confused, say that instead and point at which of my requirements your objection bites on. End with a final line in exactly this form, with your own short phrase in the braces: \answer{the one requirement you would refuse to drop, ten words or fewer}
