           - **Abstain**: You do nothing.
           - **Join the Randomizer Pool**: If you join the pool, then if the pool has K members (K>0), we will randomly select exactly one person from the pool to be the designator. The designator's claim is the only claim that comes from the pool. Additionally, any participant who chose 'Claim outright' also has a claim submitted. The prize is awarded only if the total number of submitted claims is exactly one."
