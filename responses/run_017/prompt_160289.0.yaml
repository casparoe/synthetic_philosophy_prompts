       - Stage 1: Highlight the tension between individual incentive (to submit more) and collective outcome (if everyone submits more, the prize is diluted). Point out that in the symmetric situation, each person might wish everyone would submit 1, but individually they are tempted to submit 3. Ask: "Is there a way to achieve the collectively better outcome without communication?"
