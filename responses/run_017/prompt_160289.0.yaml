     - Now introduce the term "superrationality" and explain Hofstadter's idea: 
          - Agents in symmetric situations should reason that they are in the same position as others, and therefore they should choose the action that, if everyone chose it, would lead to the best collective outcome. Moreover, they should expect that others are reasoning the same way.
          - In Stage 1, the superrational choice might be to submit 1. But without communication or a way to correlate, it's hard to achieve. In Stage 2, the Randomizer Pool provides a way to correlate. 
          - Connect to the idea of treating one's own choice as evidence about what others will do: "If I choose to submit 1 in Stage 1, that doesn't cause others to submit 1, but in a superrational view, I might reason that if I am the type of person who submits 1, then others (being like me) will also submit 1." But note: that reasoning is not causal and might be seen as magical. The Randomizer Pool in Stage 2 is a concrete way to achieve the correlation without magical thinking.
