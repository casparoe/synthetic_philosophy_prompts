           - If one person claims outright and everyone else joins the pool, then the one claim outright plus one claim from the pool (because the pool will select one designator) -> two claims, so no prize.
           - If one person claims outright and the rest abstain, then only one claim: the claimant wins.
           - If no one joins the pool and two people claim outright: two claims, no prize.
