     - Although weakly dominated, some might do it. 
     - *Handling:* Explain why it's dominated: if you submit zero, you have zero chance of winning, but if you submit at least one, you have a positive chance. So it's always better to submit at least one.

  3. **Stage 2: Someone claims outright to test the mechanism or out of skepticism:**
     - This might void the prize. 
     - *Handling:* In the debrief, use this as a teaching moment: "One defector can ruin the outcome for everyone. This is similar to the prisoner's dilemma."

  4. **Attempts to communicate:**
     - The design assumes no communication. 
     - *Handling:* Emphasize that decisions are private and simultaneous. If someone tries to communicate, remind them that it's not allowed.

  5. **Misunderstanding the Randomizer Pool:**
     - Some might think that joining the pool is the same as claiming, or that the pool might submit multiple claims. 
     - *Handling:* Explain with examples. Emphasize: the pool will submit exactly one claim only if there is at least one person in the pool and no one claims outright? Actually, the pool submits one claim regardless of outright claims, but if there are outright claims, then total claims become at least two. Clarify: "The pool does not know about the outright claims until after everyone has chosen."

  6. **Taking small stakes unseriously:**
     - Some might make arbitrary choices because the stakes are low. 
     - *Handling:* Emphasize that real money is at stake. Also, the intellectual challenge should be engaging.

  **What the Activity Cannot Reproduce and What the Facilitator Must Supply:**
  - The activity uses a correlated device (the Randomizer Pool) in Stage 2 to achieve the symmetric outcome. Without this device, the original Platonia dilemma would require independent randomization. The facilitator must explain that in the original dilemma, without the pool, the best symmetric mixed strategy is to claim with probability 1/12, which gives a 38% chance of exactly one claimant. The Randomizer Pool is a form of correlation device that ensures exactly one claim if everyone joins. 
  - The felt lesson: The benefit of correlation is clear in Stage 2. Without the device, the participants would have to independently randomize and the outcome would be uncertain. The facilitator must stress that superrationality as originally conceived by Hofstadter does not require such a device; it relies on the idea that symmetric agents will reason to the same conclusion and choose the same mixed strategy. However, the device shows how much better a correlated equilibrium can be. The facilitator should also note that the Randomizer Pool is not a product of the participants' own reasoning; it is an external mechanism.

  **Final Script:**

  The facilitator should avoid using the terms superrationality, evidential decision theory, and correlation device until the debrief.

  - Stage 1 script: as above.
  - Stage 2 script: as above.

  **Materials List:**
  - 12 envelopes for Stage 1, each marked with a unique ID (1-12) and containing 3 blank slips.
  - Pens for writing.
  - A container (hat) for drawing a slip in Stage 1.
  - Forms for Stage 2 (12 copies) with the three options and a place for the ID.
  - A randomizer for Stage 2: a 12-sided die or a random number generator (if using a die, note that if K<12, we might need to re-roll; better to use a list and a random integer generator on a phone).
  - Cash or vouchers: total up to $24 for Stage1 (if T=12, $1; if T=36, $0.33; etc.) and $12 for Stage2.

  This design fits within 90 minutes and addresses the educational goals.
