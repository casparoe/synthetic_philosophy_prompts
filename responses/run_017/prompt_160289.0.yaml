  | 50–80 | **Debrief & Concept Revelation** |
  | 80–90 | **Payout & Wrap-up** |

  ---

  ### **Materials**
  - **Stage 1 (Luring)**:
    - 12 envelopes (pre-labeled with unique anonymous IDs: P1 to P12).
    - 36 blank index cards (3 per envelope).
    - One large collection box.
    - Randomizer: A 12-sided die for drawing the winning entry.
  - **Stage 2 (Platonia)**:
    - 12 decision forms (options: ☑️ Claim Outright / ☑️ Abstain / ☑️ Join Randomizer Pool; with ID pre-filled).
    - One opaque bag for Randomizer Pool selection (if used).
    - Randomizer: A 12-sided die for selecting the designator from the pool.
  - **General**:
    - Whiteboard for recording results (T, prize value, claims).
    - Calculator for prize computations.
    - $20 in cash/vouchers (scaled payouts; see scheme below).

  ---

  ### **Payoff Scheme**
  - **Budget**: $20 total for both stages (∼$1.67/student average).
  - **Scaling**: Nominal 120 units = $1.20 in real stakes.  
    - **Stage 1 Prize**: Actual payout = ($1.20) / T (total entries).  
      *Example*: If T=12, prize = $0.10; winner receives this amount.  
    - **Stage 2 Prize**: Fixed $1.20 awarded if exactly one claim exists.  
  - **Why this works**:  
    - Maintains strategic equivalence (dilution/voiding scales proportionally).  
    - Stage 1 expected values: ∼$0.03–$0.15/student (if T=12–36).  
    - Stage 2 expected values: ∼$0.10/student if all join the pool.  
    - Low stakes preserve incentives without financial risk.  
  - **Payout Protocol**: Winners paid privately post-session to avoid social dynamics.

  ---

  ### **Facilitator Script**  
  *(Avoid terms: superrationality, evidential decision theory, correlation device)*  

  #### **Stage 1: Luring Stage (0–25 min)**  
  - **Introduction (0–5 min)**:  
    > "We’ll start with a simple game. There’s a prize pool of $1.20. You each decide how many entries to submit: 1, 2, or 3. Write your ID on each entry card. The prize amount is $1.20 divided by the **total entries** from everyone. After submissions, I’ll draw one entry randomly—if it’s yours, you win the prize. Submitting more entries raises your chance of winning but shrinks the prize. Ready? You have 5 minutes to decide."  

  - **Submission (5–15 min)**:  
    - Distribute envelopes (IDs P1–P12).  
    - Participants write their ID on 1–3 cards, seal in envelopes, and place in collection box.  
    - *Key instruction*: "Submit anonymously and simultaneously—no discussing choices."  

  - **Resolution (15–25 min)**:  
    - Open envelopes, count total entries (T). Record T on whiteboard.  
    - Calculate prize: $1.20 / T.  
    - Draw winning entry using 12-sided die: Assign each entry a number (1 to T), roll die until valid.  
    - Announce winner and prize amount (e.g., "T=18, prize=$0.07; winner is P5").  

  #### **Stage 2: Platonia Stage (25–50 min)**  
  - **Transition & Rules (25–30 min)**:  
    > "Next stage: A separate $1.20 prize, paid only if **exactly one person claims it**. You have three choices:  
    > 1. **Claim Outright**: You claim the prize.  
    > 2. **Abstain**: You do nothing.  
    > 3. **Join Randomizer Pool**: If anyone joins, I’ll randomly pick **one person** from the pool to submit a claim. Anyone who 'Claims Outright' also submits a claim. The prize is paid only if the **total claims = 1**.  
    > *Example*: If all join the pool, one is chosen to win. If one claims outright and others join, at least two claims exist—no prize."  

  - **Submission (30–40 min)**:  
    - Distribute decision forms. Collect forms in a box.  

  - **Resolution (40–50 min)**:  
    - Tally choices:  
      - **C** = Claim Outright, **A** = Abstain, **K** = Join Pool.  
    - If **K > 0**, use 12-sided die to select one designator from the pool.  
    - Determine total claims: **C + 1** (if **K > 0**), or **C** (if **K = 0**).  
    - Announce outcome:  
      - "Claims: [number]. Prize void? [Yes/No]. Winner: [if applicable]."  

  ---

  ### **Debrief (50–80 min)**  
  **Goal**: Connect experiences to superrationality components without naming it yet.  

  1. **Stage 1 Reflection (50–60 min)**:  
     - Q: "In Stage 1, what happened to the prize? Why?"  
       - Highlight: Dilution from high T (e.g., T=36 → prize=$0.03).  
     - Q: "If everyone submits 1, prize = $0.10. If you submit 3 while others submit 1, your expected value is higher. Why didn’t we all submit 1?"  
       - Draw out: **Individual dominance** (submitting 3 is better *if others restrain*) vs. **collective ruin** (all submit 3 → prize shrinks).  
     - Whiteboard math:  
       - If all submit 1: EV = (1/12) × $0.10 ≈ $0.008.  
       - If all submit 3: EV = (3/36) × $0.03 ≈ $0.002.  
       - If you submit 3 while others submit 1: EV = (3/14) × ($1.20/14) ≈ $0.018.  

  2. **Stage 2 Reflection (60–70 min)**:  
     - Q: "What happened in Stage 2? Did we get the prize? Why?"  
       - If prize voided: "How did claims exceed one?" (e.g., someone claimed outright + pool designator).  
       - If successful: "How did we achieve exactly one claim?" (e.g., all joined pool).  
     - Contrast:  
       - **Independent randomization**: "What if everyone flipped a coin to claim? Probability of exactly one claim: 12 × (1/12) × (11/12)^11 ≈ 3.2%."  
       - **Pool outcome**: "With the pool, if all join, chance of success = 100%, each wins with 8.3% probability."  
     - Q: "Why might someone claim outright? What if everyone did?"  

  3. **Reveal Superrationality (70–80 min)**:  
     - Name the concept: "Today’s games illustrate **superrationality**."  
     - Map experiences:  
       | **Game Moment** | **Superrationality Component** |  
       |------------------|--------------------------------|  
       | Stage 1 disappointment | Clash: Dominant action (submit 3) vs. symmetric optimum (all submit 1). |  
       | Stage 2 pool success | Benefit of **correlation**: Pool ensures one claim without independence. |  
       | Stage 2 outright claim voiding prize | Risk of defection; coordination requires trust in symmetry. |  
     - Core insight:  
       > "Superrationality asks you to treat your choice as **evidence** of what other identical agents do, not as a **cause**. In Stage 1, choosing 1 is rational if you believe others reason identically. The Stage 2 pool operationalizes this—joining means you expect others to join, creating a self-fulfilling equilibrium."  
     - Limitations:  
       - The pool is a **correlation device** (facilitator-supplied)—it doesn’t emerge from pure reasoning. Without it, independent randomization (p=1/12) gives 38% group success.  
       - Pure superrationality lacks a mechanism; the device shows how correlation improves outcomes.  

  ---

  ### **Predictable Problems & Solutions**  
  1. **Stage 1 over-entering**:  
     - *Why*: Misunderstanding dilution or temptation to exploit.  
     - *Fix*: Clarify with examples pre-decision (e.g., "If all submit 3, prize = $0.03").  

  2. **Stage 2 outright claim "test"**:  
     - *Why*: Skepticism about pool or curiosity.  
     - *Fix*: In debrief, discuss: "One defector voids the prize—like a single prisoner defecting."  

  3. **Communication attempts**:  
     - *Why*: Desire to coordinate.  
     - *Fix*: Enforce anonymity: "No talking; decisions are private."  

  4. **Pool misunderstanding**:  
     - *Why*: Confusion on pool vs. claiming.  
     - *Fix*: Examples in rules (e.g., "Pool + one outright claim = two claims → no prize").  

  5. **Low-stakes unseriousness**:  
     - *Why*: Small payouts reduce engagement.  
     - *Fix*: Emphasize intellectual stakes: "This models billion-dollar dilemmas!"  

  ---

  ### **Frank Assessment: What the Activity Can and Cannot Do**  
  - **Reproduced effectively**:  
    - Tension between dominance and collective optimality (Stage 1).  
    - Value of correlation over independence (Stage 2 pool vs. mixed strategy).  
    - Evidential reasoning: Choices signal expected group behavior.  
  - **Cannot reproduce without facilitator**:  
    - **The correlation device (pool) is exogenous**. In pure superrationality, agents independently "reason identically" to achieve coordination. Here, the pool forces correlation—it doesn’t emerge from reasoning alone.  
    - **Facilitator must supply**:  
      - The link between symmetry and evidence ("Your choice is a mirror of others’").  
      - The 38% success rate of independent randomization (p=1/12) vs. 100% with the pool.  
  - **Felt lesson dependency**:  
    - 70% depends on the pool: It concretizes correlation, making success tangible.  
    - 30% survives without it: Stage 1’s frustration and Stage 2’s voided prize highlight dominance/coordination clashes, but the "aha" moment of seamless coordination requires the device.  

  This design ensures students viscerally confront the incentives before labeling them, priming deep discussion. The pool is a pedagogical bridge to Hofstadter’s insight—without it, the dilemma feels unsolvable; with it, superrationality’s promise shines.
