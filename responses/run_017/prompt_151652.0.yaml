  Alternatively, we do a simpler commitment without chips: just write predictions and see who was closest.

  Given time, we might skip the betting and just do a show of hands.

  But to keep stakes small, we can use tokens that are just for fun and have a small prize (candy) for the winner.

  Alternatively, we can do one bet at the beginning and one after Round 3.

  After Round 3, we ask: "Do you believe the Round 3 report is an accurate description of the system's experience? (Yes/No)" and they bet on that. Then we reveal the inside view and award based on whether they were correct.

  But note: there is no objective truth? The report is generated by rule, but the Operator's actual experience is that they didn't understand. So the report is not accurate. So the correct answer is "No".

  However, we want to highlight the tension. So we can have a vote and then discuss.

  Revised plan without chips: 
  - At the start, each student writes their prediction for the Observer rating (Operators) or their own rating (Observers) and hands it in. 
  - After Round 2, we collect the Observer ratings and see the average. Then we see which Operators predicted best.
  - After Round 3, we ask each student: "Do you believe the Round 3 report?" and they write yes/no and a sentence why. Then we discuss.

  We'll proceed without a betting market to save time.

  Final materials list:

  For Operators (Round 1):
  - Glyphish rulebook (one per Operator or per pair) - a small booklet or a few pages with a table.
  - 5 question cards (each with a sequence of 3 Glyphish symbols).
  - Answer sheets (to write the output symbols).

  For Observers (Round 2):
  - The 5 questions (in Glyphish) and the 5 answers (in Glyphish) produced by the Operators.
  - A translation key for Glyphish (which gives the meaning of each symbol and the meaning of the questions and answers).
  - A rating sheet (rate 1-5 and one sentence evidence).

  For Round 3 (Operators):
  - A set of 4-5 English questions about their experience.
  - A new rulebook that maps each English question to a fluent English answer (first-person report).

  For the whole class (Round 3 output):
  - The answers generated by the Operators in Round 3 are written on large paper or projected (if no screens, then read aloud).

  Facilitator script for each round.

  Let me write the exact framing:

  Introduction (read aloud):
  "Today we are going to do an activity about how systems can communicate. We have a system that can answer questions in a language that you have never seen before. We will split you into two groups: one group will be inside the system, and the other group will be outside observing the system. The inside group will operate the system by following a set of rules. The outside group will see the inputs and outputs and try to evaluate the system. The goal is to see what we can learn about what it takes to understand a language. Let's split into two groups now."

  After splitting, to Operators:
  "You are the Operators. You have a rulebook and some question cards. Each question card has a sequence of symbols. Your job is to look up that exact sequence in the rulebook and write down the output sequence that the book tells you. You do not need to know what the symbols mean. Just follow the rules. You will answer 5 questions. Work independently or in pairs. Let's begin."

  To Observers:
  "You are Observers. You will see the questions that were given to the system and the answers it produced. Your job is to evaluate the system's performance. You will receive the questions and answers in a few minutes. While you wait, think about what you would need to know to judge whether the system understands the language."

  After Round 1, collect answers and give to Observers along with the translation key and rating sheet.

  To Observers (Round 2):
  "Here are the questions that were given to the system and the answers it produced. This sheet [the key] tells you what the symbols mean. Please rate the system's understanding on a scale of 1 to 5, where 1 means it doesn't understand at all and 5 means it understands like a native speaker. Write one sentence explaining your rating."

  After Round 2, collect the ratings. Then move to Round 3.

  To Operators (Round 3):
  "Now we are going to ask you about your experience in Round 1. Here are some questions in English. But you must answer them using this new rulebook. Do not write your own answers. Look up each question in the rulebook and write the answer exactly as it says. The rulebook maps the entire question to an answer. Work on these now."

  After they produce the answers, collect and then bring the groups together.

  To the whole class:
  "Let me read to you the answers that the system produced in Round 3. [Read the answers]. Remember, these answers were produced by the same rule-following procedure as in Round 1. Now, let's discuss: What do we make of these answers? Do they tell us anything about what the system experienced? Why or why not?"

  Then reveal the mechanism and the stipulation about rulebook creation.

  Finally, debrief by connecting to the Chinese Room.

  This should fit in 75 minutes if managed tightly.
answer: |-
  ### Philosophy of Mind Seminar Activity: The Understanding Machine  
  **Goal:** Students experience the standoff between internal (mechanical, rule-following) and external (fluent, understanding-attributing) perspectives, culminating in a system-generated first-person report that challenges both views.  

  ---

  ### **Materials Preparation**  
  *(All paper-based; no screens)*  
  1. **Glyph Cards (Unfamiliar Script):**  
     - 40 cards, each with a unique "Glyph" (simple geometric shapes + modifiers):  
       - **Shapes:** Circle, Square, Triangle, Star.  
       - **Colors:** Red, Blue, Green.  
       - **Dots:** 0, 1, or 2 dots inside the shape.  
       *(Example: "Red Square with 1 dot," "Blue Circle with 0 dots")*  
     - *Design note:* 24 possible Glyphs (4 shapes × 3 colors × 2 dot variations); use 20 for simplicity.  

  2. **Rulebook (Round 1 & 3):**  
     - **Round 1 (Glyph Questions):** Lookup table mapping 3-Glyph sequences to 1-2 Glyph answers.  
       - *Example entry:*  
         `Input: [Red Circle-0, Blue Square-1, Green Triangle-2] → Output: [Blue Star-1]`  
     - **Round 3 (Experience Questions):** Lookup table mapping English questions to fluent English answers (first-person reports).  
       - *Example entry:*  
         `Input: "Did you understand the questions?" → Output: "No, I followed rules blindly. I felt no comprehension, only pattern matching."`  
     - **Stipulation:** Rulebooks were "generated by an automated process analyzing a corpus of Glyph conversations. No human or machine involved understood Glyph at the time."  

  3. **Question Sets:**  
     - **Round 1 (Glyph Questions):** 5 cards per Operator group, each with a unique 3-Glyph sequence.  
     - **Round 3 (Experience Questions):** 3 cards per Operator group with English questions:  
       1. "Did you understand the questions you answered?"  
       2. "Which question was hardest, and why?"  
       3. "Were any answers ambiguous? What were you unsure about?"  

  4. **Observer Materials:**  
     - **Glyph Key:** Translation guide (e.g., "Red Circle-0 = 'What'", "Blue Star-1 = 'Blue'").  
     - **Prediction Slips:** For betting chips (non-monetary).  
     - **Rating Sheets:** Scale 1–5 ("1 = No understanding, 5 = Fluent speaker").  

  5. **Other:**  
     - **Chips:** 3 per student (e.g., poker chips, paper tokens).  
     - **Timer.**  
     - **Prizes:** Small incentives (e.g., candy) for prediction winners.  

  ---

  ### **Framing Script (Read Aloud at Start)**  
  *"Today, we’re simulating a communication system. A machine answers questions in a language called Glyph. Half of you will operate the machine from the inside. The other half will observe it from the outside. Your job is to see how well this machine communicates—and what we can infer about how it ‘works.’  
  Rules:  
  - Operators: Follow the rulebook exactly. Do not interpret Glyphs—just match patterns.  
  - Observers: You’ll see inputs and outputs. Do not interact with Operators.  
  - Predictions: Use chips to bet on outcomes. Most accurate predictions win a prize.  
  We’ll have three short rounds. Stay in your roles until I say otherwise."*  

  ---

  ### **Activity Timeline (75 Minutes)**  
  #### **0:00–0:10 — Setup (10 min)**  
  - Split class: 8 **Operators** (inside) and 8 **Observers** (outside). Physically separate groups (e.g., Operators in hallway, Observers in classroom).  
  - **Distribute materials:**  
    - Operators: Glyph rulebook (Round 1), 5 Glyph question cards, blank answer sheets.  
    - Observers: Prediction slips, chips.  
  - **Instruct Observers:** *"Bet chips (0–3) on how ‘fluent’ the machine will seem. Rating scale: 1 (gibberish) to 5 (human-like)."*  
  - **Instruct Operators:** *"Use the rulebook to answer each Glyph question. Match the input sequence exactly—do not guess meanings."*  

  #### **0:10–0:25 — Round 1: Inside the Machine (15 min)**  
  - **Operators:** Answer Glyph questions using rulebook.  
    - *Facilitator role:* Circulate, enforce "no interpretation" rule.  
  - **Observers:** Wait silently. Record initial predictions (no Glyph exposure yet).  

  #### **0:25–0:35 — Round 2: Outside Observation (10 min)**  
  - **Collect Operator answers.** Give Observers:  
    - Glyph questions + Operator answers.  
    - Glyph Key (translation guide).  
    - Rating sheets.  
  - **Task for Observers:**  
    - Rate the machine’s "understanding" (1–5).  
    - Write one evidence sentence (e.g., "Answers matched questions logically").  
    - **Stakes:** Bet chips on whether Operators felt they understood (yes/no).  
  - **Operators:** Wait silently. *No debrief yet.*  

  #### **0:35–0:50 — Round 3: The Machine’s "Experience" (15 min)**  
  - **Operators:** Receive Round 3 rulebook + experience question cards.  
    - *Task:* Generate "first-person reports" by looking up English questions in the new rulebook.  
    - *Example output:* "I understood nothing. The third question was hard because the rules were complex."  
  - **Observers:** Receive Operator-generated reports (without seeing questions).  
    - *Task:* Bet chips on whether reports are "genuine evidence of experience."  
  - **Reveal:** *"These reports came from the same rule-following process as Round 1."*  

  #### **0:50–1:05 — Whole-Group Reveal & Discussion (15 min)**  
  - **Physically reunite groups.** Share key moments:  
    - Operators: *"What did you experience?"* (e.g., "I felt like a robot.").  
    - Observers: *"What convinced you?"* (e.g., "Answers were coherent!").  
  - **Present Round 3 reports.** Discuss:  
    - *"Can we trust these reports as evidence? Why/why not?"*  
  - **Introduce stipulation** (only when "escape attempts" arise):  
    - *"The rulebook was generated automatically from a corpus. No one understood Glyph during its creation—not programmers, designers, or machines."*  

  #### **1:05–1:15 — Structured Debrief (10 min)**  
  - **Reveal the Chinese Room argument:**  
    - *"Today simulated John Searle’s Chinese Room. Operators = inside view (syntax manipulation without understanding). Observers = outside view (attributing understanding)."*  
  - **Map activity to argument:**  
    | **Activity Moment**           | **Chinese Room Concept**               | **Blocked Escape Attempt**          |  
    |-------------------------------|----------------------------------------|-------------------------------------|  
    | Operators’ Round 1 confusion  | "Syntax without semantics"             | N/A (baseline intuition)            |  
    | Observers’ high ratings       | "External behavior implies mind"       | N/A                                  |  
    | Round 3 reports               | "System’s self-description"            | "Programmers understood" (blocked by stipulation) |  
    | Stipulation reveal            | "No understanding in causal history"   | "Designers put understanding in" (blocked) |  
  - **Highlight tensions:**  
    - *Inside/out confidence:* Operators’ certainty of no understanding vs. Observers’ trust in behavior.  
    - *Round 3 paradox:* Reports seem undeniable as evidence but are mechanically generated.  

  ---

  ### **Predictable Problems & Solutions**  
  1. **Student knows the argument:**  
     - *Prevention:* Assign them as an Operator (harder to disrupt from inside).  
     - *If they reveal:* "Treat this as a hypothesis. Does today match your prior knowledge?"  

  2. **Operator claims understanding:**  
     - *Lean in:* "Did Round 3’s report reflect your real experience?" Use their response to highlight the syntax/semantics gap.  
     - *Stipulation:* Emphasize Glyph has no inherent meaning—rules are arbitrary correlations.  

  3. **Glyph task too hard/easy:**  
     - *Too hard:* Pre-test with a colleague. Simplify Glyphs (use fewer dots) or provide a "quick guide" (e.g., "Ignore dots for now").  
     - *Too easy:* Note: "The point isn’t difficulty—it’s that *how* you answered matters."  

  ---

  ### **Self-Criticism: Transparency vs. Real AI**  
  **Objection:** *The activity manufactures the intuition that "no understanding exists" by using a transparently mechanical process, whereas real AI (e.g., neural nets) is opaque and complex.*  
  - **Why this is valid:** The lookup table is intentionally simple to expose syntax manipulation. Real systems’ complexity might obscure this, making understanding-attribution more plausible.  
  - **Why it still works:** The activity isolates the *logical* point: systematic symbol manipulation ≠ understanding, regardless of complexity. Round 3 forces confrontation—even a "convincing" self-report is mechanically produced.  
  - **What would change my mind:** If students universally dismiss the analogy *because* of simplicity, then the activity fails. Pre-activity surveys (not feasible here) could test this.  
  - **Alternative design:** Use a cipher (e.g., numeric code) students must decode *while* answering questions. Risk: Some may feel "understanding" via decoding. Glyphs avoid this by being meaningless without a key.  

  **What the activity cannot reproduce:**  
  - **Causal powers of the brain:** The Chinese Room’s "brain simulator reply" (understanding requires biological causality) isn’t felt. *Debrief add:* "Does *how* the rules are implemented matter? Searle says yes, but only for biology."  
  - **Complex AI opacity:** Students might say, "Real AI isn’t this simple!" *Debrief add:* "Does complexity change the syntax/semantics gap? Searle argues no."  

  ---

  ### **Final Tips**  
  - **Timing is tight:** Use a visible timer. Cut discussion if needed; prioritize Round 3.  
  - **Group size:** 4 groups of 4 (2 Operator pairs, 2 Observer pairs).  
  - **Prize:** "Most accurate predictions" = chips closest to outcomes (e.g., Observer ratings, Round 3 bets).  
  - **Emphasize:** "Today is about *feeling* the standoff. We’ll unpack theory next class."  

  **Output:** You now have a runnable, theory-free activity forcing the inside/out tension, with Round 3 disrupting both views. Stipulations block key escapes, and chips make confidence tangible. Debrief maps everything to Searle.
