prompt: |-
  Hey — I'm a software engineer with no philosophy background, so keep it concrete and skip the citations, I can't follow them anyway.

  I run a team of about a dozen engineers at a company that's gone pretty hard on AI-assisted development: most nontrivial code now starts as a model-generated draft that a human reviews and merges. People are quietly worried we're loosing our grip on our own systems. I've got maybe a year and something like 20-30% of two senior engineers' time to actually do something about it. So I want an agenda, not a survey.

  Here's the candidate list of worries, roughly as my team states them: engineers who can competently review code they couldn't have written; juniors never building the mental models you used to get from grinding through hard bugs; everyone's sense of what they personally do and don't understand getting badly calibrated; us quietly inheriting the model's framing of what a problem even is, so we stop noticing we've been handed the question; and on-call incidents where nobody can reconstruct why the system behaves the way it does. Plus whatever I'm not thinking of.

  Which two or three would you spend the year on, in what order, and why? I care much more about the reasoning than the list: what criteria you're ranking by (how much damage, how fixable at my level rather than at the model labs, how much of the rest depends on it, how neglected), the trade-offs between those criteria, and which worries you're putting low because they sound alarming but don't really follow.

  The part I most want: what observable evidence over the next year should move something up or down. What would I actually track on my own team to find out I'd backed the wrong horse?

  One half-formed idea of mine, in case it's useful: I suspect the useful distinction isn't "understands vs. doesn't understand" but "can judge vs. can produce," and that we're drifting hard toward judge-only. If that's the wrong frame, say so and hand me a better one.
reasoning: |-
  Okay, let's tackle this problem. The user is a software engineering manager leading a team that heavily relies on AI-generated code drafts. Their team is worried about losing understanding of their own systems, and they need a concrete action plan. The user wants to prioritize two or three issues from their list, with clear reasoning and observable metrics to track progress.

  First, I need to understand the core concerns. The team listed several issues: inability to review complex AI-generated code, juniors not building mental models, poor calibration of personal understanding, inheriting the AI's problem framing, and on-call incidents where no one understands system behavior. The user also mentioned a half-formed idea about "judge vs. produce" skills drifting towards judge-only.

  Looking at these, the most critical issues seem to be the on-call incidents and the inability to review code. These directly impact system reliability and team effectiveness. If the team can't handle incidents or review code properly, that's an immediate operational risk. The junior engineers' lack of mental models is a long-term concern but might be less urgent.

  Next, the criteria for prioritization. The user mentioned damage potential, fixability at their level, dependency on other issues, and neglect. On-call issues probably cause the most immediate damage and are fixable through better observability and documentation. Code review competence is also high damage because it affects code quality daily. Both are within the team's control without needing model-level changes.

  The junior development issue is important but might be addressed indirectly by improving code reviews and documentation. Inheriting the AI's framing is harder to tackle and might require cultural changes beyond the current scope. 

  For observable evidence, tracking incident resolution time and RCA effectiveness makes sense for on-call problems. For code reviews, measuring review times and the ratio of AI-generated to manually written code could indicate understanding. If these metrics don't improve, it might mean the initiatives aren't working. 

  The user's "judge vs. produce" frame is useful but incomplete. The key is maintaining "debuggability" - the ability to dive deep when needed. Ensuring the team can still produce and debug code, not just judge it, is crucial. Initiatives like "rewrite Fridays" and manual debugging sessions can help maintain these skills. 

  I should recommend focusing first on on-call incidents, then code review competence, and finally junior development. These are actionable, high-impact, and interlinked. Tracking specific metrics will help assess progress and adjust priorities if needed.
answer: |-
  Based on your constraints and goals (concrete, actionable, focused on observable impact), here's the prioritization and reasoning:

  **Prioritized Worries (Order of Attack):**
  1.  **On-Call Incidents & System Reconstruction Failure** (Operational Firefighting)
  2.  **Engineer Competence in Reviewing Code They Couldn't Produce** (Core Competency Erosion)
  3.  **Juniors Never Building Foundational Mental Models** (Long-Term Capability Risk)

  **Why This Order & Criteria Used:**

  1.  **Immediate, Tangible Damage & Urgency:** On-call incidents directly impact system stability, user experience, SLAs, and engineer stress/burnout. Failure to reconstruct *why* during an incident is an existential threat to operating your system. You can't afford a major outage you can't fix.
  2.  **High Leverage & Fixability at Your Level:** Both #1 and #2 are addressable with *process changes, tooling, and focused training within your team*. You don't need to change the AI model itself. Fixing #1 directly forces improvements relevant to #2 (understanding, debugging).
  3.  **Foundation for Other Issues:** Competent review (#2) is the primary defense against inheriting the model's framing and poor personal calibration. Improving debugging/reconstruction (#1) inherently builds the mental models juniors lack (#3).
  4.  **Neglect & Amplification:** The "judge-only" drift you identified is *most dangerous* in incident response and complex review. These areas magnify the consequences of shallow understanding.

  **Why Others Rank Lower (For Now):**

  *   **Personal Calibration / Inheriting Model Framing:** These are critical *symptoms*, but attacking them directly is abstract and hard to measure. They are *primarily mitigated by improving #1 and #2*. If engineers get better at dissecting AI code during review and debugging failures, their calibration improves *and* they become more aware of the model's framing limitations. Tackle the root cause (lack of deep engagement) via concrete tasks (review, debugging).
  *   **"Whatever I'm Not Thinking Of":** Your core list is excellent. Focusing here risks scope creep. The initiatives for #1-#3 will surface other issues organically.

  **Your Frame: "Judge vs. Produce" - Refinement Needed**
  You're onto something crucial, but it needs sharpening. The key risk isn't *just* losing "produce" skill, it's losing **debuggability** – the ability to *dive deep, understand causality, and modify* complex systems *under pressure*. This combines elements of both judging *and* producing when the stakes are high.

  **Better Frame: Maintaining "Debuggability"**
  *   **What it Means:** Can your engineers, *especially under time pressure* (like an incident), effectively:
      *   Trace execution flow & data transformations?
      *   Understand the *why* behind non-obvious behavior?
      *   Formulate and test hypotheses about system behavior?
      *   Make safe, targeted changes to fix issues?
  *   **Why it Matters:** This is the core skill threatened by over-reliance on AI-generated drafts. It's essential for incident response (#1), competent review (#2), and building mental models (#3). It transcends just writing the initial code.

  **Concrete 1-Year Agenda (Focusing Debuggability)**

  1.  **Quarter 1-2: Attack On-Call Reconstruction Failure (Priority #1)**
      *   **Action:** Implement "**AI-Generated Code Autopsy**" for every significant on-call incident involving AI-drafted code.
          *   Mandatory step in the post-incident process (RCA).
          *   **Goal:** Trace the *exact* AI-generated code block(s) responsible & reconstruct the logic chain leading to failure.
          *   **Process:** Use pairing: Senior + Owner + (Junior Observer). Treat it like a live debugging session. Force manual tracing, hypothesis testing, and explanation ("Explain this block *to me* as if I'm a junior").
          *   **Outputs:** Annotated code snippets explaining the flaw *in context*, specific gaps in reviewer understanding, and concrete fixes.
      *   **Action:** Invest in **Observability Tooling:** Ensure critical flows instrumented *before* and *after* AI-generated logic. Require logging of key decisions made within AI-generated blocks. Make tracing *easier*.
      *   **Observable Evidence (Track Monthly):**
          *   **Mean Time To Recovery (MTTR)** for incidents involving AI-drafted code.
          *   **% of Significant Incidents** where RCA *conclusively identified* the flawed AI-generated logic and *why* it behaved unexpectedly.
          *   **Engineer Sentiment (Survey):** Confidence in understanding AI-generated code during incidents (1-5 scale).

  2.  **Quarter 2-3: Fortify Code Review Competence (Priority #2)**
      *   **Action:** Introduce "**Targeted Reconstruction Reviews**" for *high-risk* AI-generated drafts (new components, complex logic, critical paths).
          *   **Requirement:** Before approval, the *reviewer* must manually re-implement a *critical subset* (e.g., core algorithm, key conditional) of the AI's solution *from scratch* based *only* on the specification (no peeking!). Then compare.
          *   **Goal:** Forces deep engagement, reveals hidden assumptions in the AI's solution, calibrates understanding. Focuses effort on the riskiest parts.
      *   **Action:** Develop & Mandate "**AI Review Checklist**": Specific prompts/questions reviewers *must* answer for AI-drafted code:
          *   "Can I trace the data flow through *this* block step-by-step?"
          *   "What edge cases did the AI *likely* miss here? How do I know?"
          *   "What's the most complex part of this logic? Can I explain it simply?"
          *   "Does this solution feel 'off' compared to how we'd solve it? Why?"
      *   **Observable Evidence (Track Per Review/Quarterly):**
          *   **Average Review Time** for AI-drafted vs. human-drafted code (expect AI reviews to take longer initially).
          *   **# of Critical Bugs Found in Prod** traced back to AI-drafted code that passed review.
          *   **% of AI Drafts** requiring major refactoring *post-review* due to fundamental misunderstanding (track via PR comments).
          *   **Reviewer Confidence Score** (Simple 1-3 scale self-assessment post-review).

  3.  **Quarter 3-4: Address Junior Mental Model Gap (Priority #3)**
      *   **Action:** Create "**Manual Debugging Sandbox**" Sessions:
          *   Bi-weekly sessions (1-2 hours). Present a *real*, non-trivial bug that occurred in AI-generated code (sanitized).
          *   **Task:** Juniors (paired/solo) must debug it *without* using AI assistance. Rely *only* on logs, code, and manual tracing.
          *   **Goal:** Force the "grind" of building causal mental models. Seniors facilitate, ask probing questions, but don't give answers.
      *   **Action:** "**Rewrite Fridays**" (Limited Scope):
          *   Allocate 10-20% of one Friday per month for juniors.
          *   **Task:** Take a small, *working* module originally AI-generated and rewrite it *manually* from the spec (no AI). Compare results, discuss differences.
          *   **Goal:** Practice the "produce" skill on manageable scopes, reinforcing understanding.
      *   **Observable Evidence (Track Quarterly):**
          *   **Junior Performance** in Sandbox Sessions (Qualitative assessment by senior facilitator: engagement, hypothesis quality, progress).
          *   **Junior Contribution to RCAs/Reviews:** Measurable increase in substantive questions/insights during incident autopsies or AI code reviews.
          *   **Junior Confidence (Survey):** Self-assessment of understanding core system components.

  **How You Know You're Backing the Wrong Horse (Observable Red Flags):**

  1.  **MTTR Stays High or Increases:** If incidents involving AI code are taking *longer* to resolve after 6 months, your focus on debuggability (#1) isn't working.
  2.  **Reconstruction Success Rate Doesn't Improve:** If, after 2-3 Autopsies, you're still frequently hitting dead ends during incident RCAs, the approach needs adjustment.
  3.  **Critical Bugs in Reviewed AI Code Remain Constant/Increase:** This signals your review process (#2) isn't catching fundamental flaws. If the checklist/reconstructions feel like useless bureaucracy, not learning tools, they've failed.
  4.  **Review Times Plummet Without Quality Improvement:** If AI reviews become *faster* than human reviews without a corresponding drop in bugs, it means reviewers are rubber-stamping, not engaging deeply (#2 failure).
  5.  **Junior Engagement/Progress Stalls in Sandbox:** If juniors consistently can't make headway in manual debugging sessions after 3-6 months, or show no increased insight in reviews/RCAs (#3), the approach isn't building the needed models.

  **Key Trade-Offs Acknowledged:**

  *   **Short-Term Speed vs. Long-Term Resilience:** This plan *will* slow down initial development slightly (longer reviews, autopsies, sandbox time). Frame it as investment in stability and future velocity. Measure success partly by *reduced firefighting time*.
  *   **Senior Time Investment:** Leverage the Autopsies and Targeted Reviews as explicit training moments. Seniors teaching during these is part of the solution, not just overhead.
  *   **Not Solving Everything:** This tackles the most critical, actionable symptoms. Improving debuggability and review competence will naturally mitigate personal calibration and framing issues over time.

  **The Core Principle:** Don't fight the AI use. Instead, force **structured, mandatory deep dives** in the highest-risk, highest-impact situations (incidents, critical reviews) and for foundational skill building (juniors). Make the implicit understanding explicit through process and focused practice. Track concrete outcomes related to system stability and engineer capability.
