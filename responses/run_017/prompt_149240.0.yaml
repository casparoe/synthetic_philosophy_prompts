  1. **Delegated end goal?** (by principal for task)  
     - **No**:  
       2. **Explicit step-by-step instructions?**  
          - **Yes**: **Mere instrument** (e.g., basic spreadsheet macro).  
          - **No**: **Instrument with discretion over means** (e.g., autopilot following fixed flight plans with real-time adjustments).  
     - **Yes**:  
       3. **Authorized to override literal instructions?** (to better serve goal)  
          - **Yes**: **Fiduciary-style agent** (e.g., trading system enforcing loss limits despite user override attempts).  
          - **No**:  
            4. **Authority to coordinate other systems?** (without per-action approval)  
               - **Yes**: **Autonomous coordinator** (e.g., smart grid controller allocating resources across subsystems).  
               - **No**: **Delegated agent** (e.g., booking bot rebooking flights within user-set constraints).  

  ### Unoccupied Combinations & Diagnoses  
  - **Delegated goal: No + Authority to coordinate: Yes** → *Incoherent* (coordination implies goal delegation).  
  - **Fiduciary: Yes + Authority to coordinate: No** → *Occupied* (e.g., lawyer-bot withholding harmful client info).  

  ### Relativization & Leaf Clarity  
  - **Relativized nodes** (system/principal/task) work: leaves stay clean (e.g., email-drafting model is *mere instrument* for user-approved tasks but *delegated agent* if sending autonomously).  
  - **Forced monadic node**: None—all branches relativize cleanly.  

  ### Collapsed Distinction  
  - **Autonomous coordinator** merges "agent of collective" (e.g., DAO governance bot) and "tool of bureaucracy" (e.g., tax-filing system coordinating agencies)—*actual result* of relativization (same system/task, different principal perspectives).  

  ### Unseparated Pair  
  - **Delegated agent** vs. **Instrument with discretion**: Distinction hinges on *goal delegation*, not autonomy (e.g., trading system with loss limit is *fiduciary* if goal-overriding, *delegated agent* if not). Tree separates them cleanly at Node 1.
