  Hey — I need a borrow of a philosophy brain. I said yes to grading a take-home for a friend's "Religion and the Limits of Language" seminar (she's the instructor, she's out for a few weeks, I said yes before I'd read the packet) and I'm now four answers in and giving everything a 16/20, which is definately a sign I've stopped reading properly. I'm not telling you what I'd give this one because I don't want to anchor you.

  Here's the question, verbatim, I'm not allowed to adjust it:

  **Q3 (20 marks).** In the lectures on religious belief Wittgenstein works against the assumption that religious utterances are hypotheses on all fours with "there is a plane overhead": the picture of a Last Judgment is not held the way a prediction is held, and the difference it makes shows up in a life rather than in an expectation. Some later writers take this much further and argue that religious language is a self-contained language-game whose internal criteria are the only ones there are, so that philosophy can at most describe it.

  Consider the following case, which is invented. On the Kesh plateau the villagers say of a certain glacier: "It is keeping count." They invoke this sentence when deciding what may and may not be done on the ice, and they console the bereaved with it. Asked whether the glacier thinks, they say no. Asked what would show that it had stopped counting, they say nothing could — it isn't that sort of thing. A visiting anthropologist writes that the Kesh sentence is not a belief at all but a useful fiction.

  **(a)** [4] Distinguish two claims that are easy to run together: (i) that a religious picture is not held as an empirical hypothesis, and (ii) that nothing could in principle count as evidence against it. Does (i) entail (ii)?
  **(b)** [6] Apply this to the Kesh. Is their sentence a hypothesis? Could a Kesh person be wrong about it, and in what sense? Is the anthropologist missing something, and if so what? And does whether the case is closer to a religious picture or to a bad empirical theory depend on how the sentence is used rather than on what it says?
  **(c)** [6] Consider the objection that if a religious picture is answerable to nothing outside itself, calling it belief is a courtesy: the person has an attitude or a policy, not a belief. Does this objection land on the stronger, self-contained-language-game version of the view but miss the merely grammatical one, or the reverse, or neither?
  **(d)** [4] What work, if any, is done by saying that Wittgenstein is doing grammar rather than metaphysics — describing the use of these expressions rather than telling us what there is?

  And here's the answer I'm stuck on (Candidate 2207, ~600 words):

  ---

  Wittgenstein's target in the lectures is a picture of religious belief as an explanatory hypothesis of the same kind as the belief that a plane is overhead. His point is grammatical: if you ask what difference it makes whether a man believes in a Last Judgment, the difference is not that he expects a dateable event, but that the picture regulates what he does and how he weighs things — as a man might be governed by a picture of himself as judged, or by a picture of the suffering of others. So the religious utterance is not a prediction with poor evidence; it is the sort of thing that stands at the top of a life rather than inside it.

  Does not-a-hypothesis entail not-answerable-to-evidence? I want to say yes, and I think Wittgenstein is committed to it. If a picture is genuinely regulative rather than descriptive — if it is what you measure by rather than something you measure — then there is no room for a check: whatever experience you might be tempted to call evidence against it will already be seen in its light. This is why he can treat the religious picture as a kind of hinge: it stands fast for the person who holds it not because it is well supported but because, from inside, it is what support looks like. Questions of evidence and of doubt simply do not get a grip. That also explains the hostility to the demand for grounds: religion needs no grounds, and asking for them is like asking what grounds you have for thinking you have hands.

  The Kesh sentence is not a hypothesis, since the villagers have ruled out in advance what would count against it — they say nothing could show that the glacier had stopped counting. Nor, I think, is it really a belief; the anthropologist is basically right. The sentence is a useful fiction, a device for coordinating conduct and soothing grief, and the Kesh are wrong to suppose that it says anything about the glacier. The real content is visible in the mourner who repeats it and thereupon takes up a certain stance toward her dead: that is a stance, not a claim. If a religious picture works like the Kesh sentence, then the atheist and the believer are not disagreeing about anything; they have adopted different stances, and the Wittgensteinian should welcome that result, because Wittgenstein's own view is precisely that religious belief is a self-contained language-game with its own internal criteria, which philosophy can describe but which no outsider can properly assess or criticise.

  Finally, the grammar-not-metaphysics line is what makes all of this safe. Wittgenstein is not telling us whether God exists; he is pointing out that a sentence like God sees works differently from one about a cat on a mat. Once that is seen, the metaphysical dispute dissolves into a difference of forms of life, and the philosopher's job is to describe and then leave it alone.

  ---

  What I want from you: a mark out of 20, and then the actual margin comments — not a general impression, the point-by-point version, keyed to specific sentences or moves. Where it's fine, say it's fine in one line so I know you didn't just skip it. Where it's wrong, quote the offending bit back to me and say what's wrong with it in a way I can paste into the feedback. Also flag separately anything that's defensible-but-contested rather than wrong, because I don't want to dock marks for an interpretive disagreement.

  Second thing, and this is the part I actually care about: my prior is that anyone writing this fluently has read some secondary literature and is quietly smuggling in a partisan reading while making it sound like plain exposition. Tell me whether that's what's happening here, or whether I'm pattern-matching "Wittgensteinian" to "motte-and-bailey for unfalsifiable beliefs" and grading my own priors. If there's a step that doesn't follow, point at the exact inference, not at the neighbourhood.

  Please don't send me to the secondary literature — no citations, no go read so-and-so, I've got the packet and I'm offline for another week. Just the philosophy.
