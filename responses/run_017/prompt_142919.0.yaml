  We are given five candidate scoring measures and a set of tasks to evaluate them. We'll address each part in order.

  ### (a) Properties for each measure

  We need to check for each measure:
  - Is it proper on a fixed vocabulary?
  - What is the effect of uninformed refinement (splitting a cell equally) on expected score?
  - Can the score be improved without epistemic improvement (by coarsening, inventing distinctions, relabeling, or exploiting mu)?

  #### 1. Atom-log (AL)
  - **Propriety**: For a fixed partition A, the expected score is E[-log c(A_w)] = -Σ_{a in A} c(a) log c(a), which is minimized (by Gibbs' inequality) when the reported credences match the true probabilities. Thus, it is proper.
  - **Uninformed refinement**: Suppose we split a cell a into k subcells equally. The new credence for each subcell is c(a)/k. The contribution to the expected score from the original cell a was -c(a) log c(a). After splitting, the contribution becomes -c(a) [log(c(a)/k)] = -c(a) log c(a) + c(a) log k. Since log k > 0, the expected score increases (becomes worse) by c(a) log k. So uninformed refinement raises the expected score (worsens it).
  - **Gaming**: 
    - Coarsening: If we coarsen the vocabulary (by merging cells), then for a world in the merged cell, the new credence is the sum of the old. Since the log is concave, by Jensen's inequality, the score -log(merged credence) may be lower (better) or higher (worse) depending on the credences. For example, if we merge two cells with low credence, the merged credence is low, so the score becomes worse (because -log(low) is high). But if we merge two cells with moderate credence, the merged credence is higher, so -log(merged) is lower (better). Thus, coarsening can sometimes lower (improve) the score without any epistemic improvement. So gaming by coarsening is possible.
    - Inventing distinctions: We just saw that uninformed refinement worsens the score, so inventing distinctions without information is punished. 
    - Relabeling: The score depends only on the credence assigned to the true cell, so relabeling (changing the labels of the cells) without changing the credence function would not change the score (as long as the true world is labeled correctly). But note: if we relabel such that the true world gets a higher credence, then the score improves. However, without an epistemic improvement (i.e., without actually having more information), we cannot arbitrarily reassign credences arbitrarily. The agent must assign the same credence to the same set of worlds. So if we change the partition and then assign different credences, that is not just relabeling but a change in the credence function. Therefore, pure relabeling (without changing the partition or the credence values for the sets) does not change the score.
    - Exploiting mu: This measure does not use mu.

  #### 2. Uniform-extension Brier (UEB)
