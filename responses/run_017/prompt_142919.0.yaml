        = (1-0.35)^2 + (0-0.35)^2 + (0-0.15)^2 + (0-0.15)^2 
        = (0.65)^2 + (0.35)^2 + (0.15)^2 + (0.15)^2 
        = 0.4225 + 0.1225 + 0.0225 + 0.0225 = 0.59

  For F: already on the finest partition: (0.5, 0.2, 0.2, 0.1) for (w1,w2,w3,w4)
  - Brier score at w1: 
        = (1-0.5)^2 + (0-0.2)^2 + (0-0.2)^2 + (0-0.1)^2 
        = (0.5)^2 + (0.2)^2 + (0.2)^2 + (0.1)^2 
        = 0.25 + 0.04 + 0.04 + 0.01 = 0.34

  So UEB ranks F better than C by 0.59 - 0.34 = 0.25.

  #### 3. BXB (Background-extension Brier)
  We need a background measure mu. The problem doesn't specify, so let's assume uniform for simplicity (then it becomes UEB). But the problem allows any mu. Let's do both with uniform and with a non-uniform example.

  First, with uniform mu: then it is the same as UEB. So BXB (uniform) gives:
     C: 0.59
     F: 0.34
     F better.

  But the problem says to state any mu we need. Let's also try a non-uniform mu. Suppose the tournament designer sets mu(w1)=0.4, mu(w2)=0.3, mu(w3)=0.2, mu(w4)=0.1.

  For C: 
     Vocabulary: a1={w1,w2}, a2={w3,w4}
     mu(a1) = mu(w1)+mu(w2)=0.4+0.3=0.7
     mu(a2)=0.2+0.1=0.3

     Extension:
        For w1 in a1: q(w1) = 0.7 * (0.4/0.7) = 0.4
        For w2 in a1: q(w2) = 0.7 * (0.3/0.7) = 0.3
        For w3 in a2: q(w3) = 0.3 * (0.2/0.3) = 0.2
        For w4 in a2: q(w4) = 0.3 * (0.1/0.3) = 0.1
     So extended credence: (0.4, 0.3, 0.2, 0.1)

     Brier score at w1: 
          = (1-0.4)^2 + (0-0.3)^2 + (0-0.2)^2 + (0-0.1)^2
          = 0.36 + 0.09 + 0.04 + 0.01 = 0.50

  For F: already on the finest partition, so the extension is just its credence: (0.5,0.2,0.2,0.1)
     Brier score at w1: 0.34 (as before)

  So with this mu, BXB gives:
     C: 0.50
     F: 0.34
     F is better.

  But note: the actual world is w1, and C's extended credence for w1 is 0.4, while F's is 0.5. F is more accurate at w1.

  #### 4. CCB (Common-coarsening Brier)
  First, we need the meet of C and F's vocabularies. 
     C: {{w1,w2}, {w3,w4}}
     F: finest: {{w1},{w2},{w3},{w4}}
     The meet is the finest partition coarser than both. 
     The coarsest partition that is coarser than both: 
          Coarser than F: any partition that merges some of the singletons.
          Coarser than C: must not split {w1,w2} or {w3,w4}.
          So the meet is exactly C's partition: {{w1,w2}, {w3,w4}}.

  For C: 
     Collapse its credence to the meet: already there. So c_meet = (0.7, 0.3) for ( {w1,w2}, {w3,w4} )
     The actual world w1 is in the first cell. 
     Brier score on the meet: 
          = (1-0.7)^2 + (0-0.3)^2 = 0.09 + 0.09 = 0.18

  For F: 
     Collapse its credence to the meet: 
          For {w1,w2}: 0.5+0.2=0.7
          For {w3,w4}: 0.2+0.1=0.3
     So c_meet = (0.7, 0.3)
     Brier score on the meet: same as for C: 0.18

  So CCB gives a tie.

  #### 5. INB (Ignorance-normalized Brier)
  First, compute the raw Brier score on the agent's own vocabulary, then subtract the uniform distribution's score.

  For C:
     Vocabulary: two cells, a1={w1,w2}, a2={w3,w4}
     Raw Brier at w1: 
          Since w1 in a1: 
          = (1 - c(a1))^2 + (0 - c(a2))^2 = (1-0.7)^2 + (0-0.3)^2 = 0.09+0.09=0.18
     Uniform distribution: c_unif(a1)=0.5, c_unif(a2)=0.5
     Uniform's raw Brier at any world: (1-0.5)^2 + (0-0.5)^2 = 0.25+0.25=0.5? 
          But note: the Brier score for a partition is: if the true cell is a, then (1 - c(a))^2 + sum_{b≠a} c(b)^2.
          For the uniform distribution, at a1: (1-0.5)^2 + (0.5)^2 = 0.25+0.25=0.5.
          The normalization constant is 1 - 1/|A| = 1 - 1/2 = 0.5. And indeed, the raw score of the uniform distribution is 0.5.

     INB(C) = 0.18 - 0.5 = -0.32

  For F:
     Vocabulary: four cells.
     Raw Brier at w1: 
          = (1-0.5)^2 + (0-0.2)^2 + (0-0.2)^2 + (0-0.1)^2 = 0.25 + 0.04 + 0.04 + 0.01 = 0.34
     Uniform distribution: each cell gets 0.25.
     Uniform's raw Brier at any world: (1-0.25)^2 + 3*(0.25)^2 = (0.75)^2 + 3*0.0625 = 0.5625 + 0.1875 = 0.75.
     Also, 1 - 1/|A| = 1 - 1/4 = 0.75.

     INB(F) = 0.34 - 0.75 = -0.41

  So INB ranks F better than C: -0.41 < -0.32, so F has a lower (better) score.

  Summary of (b):

  | Measure | C's score | F's score | Who wins? | Difference (F-C) or note |
  |---------|-----------|-----------|-----------|--------------------------|
  | AL      | 0.3567    | 0.6931    | C wins    | C by 0.3364             |
  | UEB     | 0.59      | 0.34      | F wins    | F by 0.25               |
  | BXB (uniform) | 0.59   | 0.34      | F wins    | F by 0.25               |
  | BXB (non-uniform) | 0.50 | 0.34      | F wins    | F by 0.16               |
  | CCB     | 0.18      | 0.18      | tie       | -                       |
  | INB     | -0.32     | -0.41     | F wins    | F by 0.09 (since -0.41 is lower) |

  ### (c) Strict ranking

  We rank from 0 (worst) to 10 (best), break ties, and name the single failure mode that most limits it.

  Criteria: 
  - Propriety: should be proper on fixed vocabulary.
  - Rewards refinement with genuine information: if you refine and assign informed credences (closer to truth), your score should improve.
  - Punishes refinement without information: if you refine uniformly, your expected score should not improve.
  - Resistance to gaming: cannot improve score by coarsening, inventing distinctions (without information), relabeling, or exploiting mu.
  - Fair comparisons across agents: the score should allow comparison of agents with different granularity in a way that reflects their accuracy.

  We also consider the worked example: we want a measure that, in the example, rewards F for being more specific and accurate at the finest level.

  Based on (a) and (b), and the criteria:

  1. AL:
     - Propriety: yes.
     - Rewards refinement with information: if you refine and assign higher credence to the true subcell, your score improves.
     - Punishes refinement without information: uninformed refinement worsens expected score.
     - Gaming: can improve by coarsening if it increases the credence in the true cell. In the example, C won because it was vague and could assign 0.7 to the true cell, while F had to assign 0.5. But F was more specific and knew that w1 is more likely than w2, but AL doesn't credit that.
     - Comparison: in the example, it ranked the coarse agent better. But intuitively, F has more information and should be rewarded for the specific assignment.

     Failure mode: does not credit specificity at all. In fact, it penalizes it: being forced to assign credence to smaller cells means you have to dilute your credence, so AL will be higher (worse) for the same underlying uncertainty.

     Score: 3. It is proper and punishes uninformed refinement, but it is highly gameable by coarsening and doesn't reward genuine refinement.

  2. UEB:
     - Propriety: yes.
     - Rewards refinement with information: if you refine and assign non-uniformly within a cell (which you would if you have information), then the extended distribution is more accurate and the Brier score improves.
     - Punishes refinement without information: leaves expected score unchanged.
     - Gaming: 
          - Coarsening: makes expected score worse, so not beneficial.
          - Inventing distinctions: doesn't change expected score, so no benefit.
          - Relabeling: no effect.
          - Exploiting mu: not applicable (mu is uniform, fixed).
     - Comparison: in the example, F won. And F's extended credence was (0.5,0.2,0.2,0.1) while C's was (0.35,0.35,0.15,0.15). At w1, F is better. This seems fair: F has a more accurate extended distribution.

     Failure mode: the extension is uniform, so if the true distribution is not uniform within cells, then the extended credence is not accurate. Also, it doesn't punish uninformed refinement, so an agent can make arbitrary splits without penalty, which might be seen as not encouraging the agent to learn within-cell structure.

     But note: if the agent has no within-cell information, then the uniform extension is the best it can do. And the score doesn't change, so it's not harmful.

     In comparison, it seems fair in the example.

     However, consider two agents: one with coarse partition and one with fine. If the coarse agent has a very accurate aggregate, but the fine agent is doing the best it can with uniform within cell, then the coarse agent might win if the fine agent has to dilute the credence. In the example, F won, which is desired.

     Score: 7.

  3. BXB:
     - Propriety: yes.
     - Rewards refinement with information: if you have information and assign accordingly, the extended distribution will be more accurate.
     - Punishes refinement without information: only if mu is not uniform. If mu is uniform, then it's like UEB (unchanged). If mu is not uniform, then uninformed refinement can make it worse. But if the true distribution is proportional to mu, then it might be appropriate. But in general, without information, the agent might be forced to use a non-uniform extension that doesn't match the truth.
     - Gaming: 
          - If the agent knows mu, it might choose to refine or coarsen to optimize the score. For example, if a cell has a very skewed mu, then splitting it uniformly might hurt. So the agent might avoid splitting such cells even if it has no information, or might split cells that are uniform in mu. This is gaming by choosing the partition based on mu.
     - Comparison: depends on mu. In our example, with non-uniform mu, F still won.

     Failure mode: sensitive to the choice of mu, and agents can game by choosing partitions that align with mu.

     Score: 5. It shares the benefits of UEB but is vulnerable to mu gaming.

  4. CCB:
     - Propriety: yes, for a fixed meet.
     - Rewards refinement with information: if the meet is fixed, then refining your own vocabulary doesn't change the collapse to the meet, so the score doesn't change. Therefore, it does not reward refinement at all.
     - Punishes refinement without information: doesn't change the score.
     - Gaming: 
          - If an agent coarsens its vocabulary, it can make the meet coarser. In the extreme, it can make the meet {Omega}, and then score 0. This is catastrophic gaming.
     - Comparison: in the example, it tied. But F has more information and should be better.

     Failure mode: severe vulnerability to coarsening, and does not reward refinement.

     Score: 1.

  5. INB:
     - Propriety: yes.
     - Rewards refinement with information: if you refine and assign more accurate credences, the raw Brier score improves and the normalization constant also changes. But the net effect might be positive.
     - Punishes refinement without information: can sometimes improve the score (e.g., splitting a cell with zero credence). So it does not punish.
     - Gaming: can improve by splitting cells with zero credence, or by other means.
     - Comparison: in the example, F won, which is desired.

     Failure mode: gaming by splitting cells with low or zero credence.

     Score: 4.

  Ranking (from best to worst):

  1. UEB: 7
  2. BXB: 5
  3. INB: 4
  4. AL: 3
  5. CCB: 1

  But we must break ties strictly. So we assign integers:

     UEB: 7
     BXB: 5
     INB: 4
     AL: 3
     CCB: 1

  Failure modes:
     UEB: does not incentivize learning within-cell structure (because uniform extension is fixed and not punished for not learning) but is resistant to gaming and rewards informed refinement.
     BXB: vulnerable to gaming by partition choice based on mu.
     INB: vulnerable to gaming by splitting cells with low credence.
     AL: penalizes specificity, gameable by coarsening.
     CCB: extremely gameable by coarsening to trivial partition.

  ### (d) Bonus for informativeness

  We consider whether to add an explicit bonus for informativeness, knowing that it makes the measure improper.

  The main issue is that without a bonus, some measures do not reward refinement even with information (like CCB) or not enough (like UEB doesn't reward uninformed refinement but also doesn't reward informed refinement within-cell because it uses uniform extension). 

  But UEB and BXB do reward informed refinement: if you have within-cell information and you refine and assign non-uniformly, then you are not doing an uninformed refinement. You are doing informed refinement, and the extended distribution will be more accurate, so the score improves. So they naturally reward it.

  AL penalizes refinement, so we wouldn't want to add a bonus to that.

  INB and CCB: adding a bonus might help, but they have other issues.

  For UEB, it already rewards informed refinement, so we don't need a bonus. But if we want to encourage refinement even without information, then we might add a bonus. But that would be improper.

  In the accuracy-first view, we should not add a bonus for informativeness if it is not reflected in accuracy. So we would not add it.

  Instead, we would give up on having the score be the sole epistemic value and allow that the vocabulary itself is an epistemic achievement. But the instruction is to answer whether we would add a bonus.

  I would not add a bonus for informativeness to any of these measures. The measures that naturally reward informed refinement (UEB, BXB) are already doing well. The others have more fundamental issues.

  ### (e) What this setup cannot settle

  This setup assumes that we can compare accuracy across different granularities. But it may be that cross-granularity accuracy comparisons are not coherent. The scoring rules we considered are defined by extending or collapsing credences, but these extensions are arbitrary. The choice of extension (uniform or by a background measure) may not be justified. Moreover, the vocabulary itself is a form of knowledge: the ability to draw distinctions is an epistemic achievement that is not captured by the credences alone. By only scoring the credences, we are ignoring the value of the conceptual framework. This setup also doesn't address how the vocabulary is chosen or learned, and whether that process should be credited. Ultimately, the choice of scoring rule depends on whether we see the refinement as part of the epistemic state or not.

  Therefore, the setup cannot settle whether the vocabulary is an epistemic achievement that should be credited separately.
