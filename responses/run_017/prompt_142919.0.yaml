  ### (a) Properties of the Five Measures

  1. **Atom-log (AL)**  
     - Proper on fixed vocabulary: Yes (minimized by true credences via Gibbs' inequality).  
     - Uninformed refinement: Raises expected score (worsens it) by \(c(a) \log k\) for splitting cell \(a\) into \(k\) equal subcells.  
     - Gaming:  
       - Coarsening: Can lower (improve) score without epistemic gain (e.g., merging low-credence cells reduces \(-\log\) penalty).  
       - Inventing distinctions: Punished (raises score).  
       - Relabeling: No effect (score depends only on credence in true cell).  
       - Exploiting \(\mu\): Not applicable.

  2. **Uniform-extension Brier (UEB)**  
     - Proper on fixed vocabulary: Yes (minimized when reported credences match true, under uniform extension).  
     - Uninformed refinement: Leaves expected score unchanged.  
     - Gaming:  
       - Coarsening: Worsens score (e.g., merging cells increases penalty).  
       - Inventing distinctions: No benefit (score unchanged).  
       - Relabeling: No effect.  
       - Exploiting \(\mu\): Not applicable (fixed uniform \(\mu\)).

  3. **Background-extension Brier (BXB)**  
     - Proper on fixed vocabulary: Yes (minimized when reported credences match true, under \(\mu\)-extension).  
     - Uninformed refinement: Effect depends on \(\mu\): raises, lowers, or unchanged (e.g., worsens if \(\mu\) is non-uniform).  
     - Gaming:  
       - Coarsening: Can worsen or improve score based on \(\mu\).  
       - Inventing distinctions: Can worsen if \(\mu\) non-uniform.  
       - Relabeling: No effect.  
       - Exploiting \(\mu\): Agent can game partition choice if \(\mu\) is known (e.g., avoid splitting \(\mu\)-skewed cells).

  4. **Common-coarsening Brier (CCB)**  
     - Proper on fixed vocabulary: Yes, for fixed meet (minimized when credences collapse to true meet distribution).  
     - Uninformed refinement: Leaves score unchanged (if meet fixed).  
     - Gaming:  
       - Coarsening: Can dramatically lower (improve) score (e.g., coarsening to \(\{ \Omega \}\) yields perfect score).  
       - Inventing distinctions: No benefit (if meet unchanged).  
       - Relabeling: Can change meet and score.  
       - Exploiting \(\mu\): Not applicable.

  5. **Ignorance-normalized Brier (INB)**  
     - Proper on fixed vocabulary: Yes (raw Brier is proper; normalization constant doesn't affect minimization).  
     - Uninformed refinement: Can lower (improve) score without epistemic gain (e.g., splitting a zero-credence cell).  
     - Gaming:  
       - Coarsening: Can worsen or improve score.  
       - Inventing distinctions: Can improve score (e.g., splitting low-credence cells).  
       - Relabeling: No effect.  
       - Exploiting \(\mu\): Not applicable.

  ### (b) Worked Check  
  \(\Omega = \{w_1, w_2, w_3, w_4\}\), actual world \(w_1\).  
  - **Agent C**: Partition \(A_C = \{\{w_1, w_2\}, \{w_3, w_4\}\}\), credences \((0.7, 0.3)\).  
  - **Agent F**: Partition \(A_F = \{\{w_1\}, \{w_2\}, \{w_3\}, \{w_4\}\}\), credences \((0.5, 0.2, 0.2, 0.1)\).  

  | Measure         | C's Score                           | F's Score                           | Winner (More Accurate) | Difference (F–C) |
  |-----------------|-------------------------------------|-------------------------------------|------------------------|------------------|
  | **AL**          | \(-\ln(0.7) \approx 0.3567\)        | \(-\ln(0.5) \approx 0.6931\)        | C                      | C by 0.3364      |
  | **UEB**         | Brier: \((1-0.35)^2 + \cdots = 0.59\) | Brier: \((1-0.5)^2 + \cdots = 0.34\) | F                      | F by 0.25        |
  | **BXB** (\(\mu\) uniform) | Same as UEB: 0.59            | Same as UEB: 0.34                   | F                      | F by 0.25        |
  | **BXB** (\(\mu: w_1=0.4, w_2=0.3, w_3=0.2, w_4=0.1\)) | Brier: \((1-0.4)^2 + \cdots = 0.50\) | Brier: 0.34                         | F                      | F by 0.16        |
  | **CCB**         | Meet is \(A_C\); Brier: \((1-0.7)^2 + (0-0.3)^2 = 0.18\) | Collapsed to \(A_C\); Brier: 0.18  | Tie                    | —                |
  | **INB**         | \((0.18) - (1 - 1/2) = -0.32\)       | \((0.34) - (1 - 1/4) = -0.41\)      | F                      | F by 0.09        |

  - **Notes**:  
    - BXB requires \(\mu\); shown for uniform and a non-uniform example.  
