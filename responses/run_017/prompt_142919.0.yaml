  #### 4. Common-coarsening Brier (CCB)
  - **Propriety**: For a fixed group of agents, we take the meet of their vocabularies. But the group changes? For a single agent, if we consider a fixed meet (which might be the meet of all agents in the tournament), then the meet might be fixed. But the problem is that the tournament might have many agents with different partitions. The meet is taken over the group of agents being scored together. But for a single agent, the meet might be coarser than its own vocabulary. The agent's credence is then collapsed to the meet: for a cell m in the meet, c(m) = sum_{a subset m} c(a). Then we score with the Brier score on the meet.

    Is it proper for a fixed meet? The meet is fixed. The agent reports c on its own vocabulary, which is then collapsed to c_meet on the meet. The true world w is in some cell of the meet, say m_w. The score is the Brier score on the meet: 

          (1 - c_meet(m_w))^2 + sum_{m≠m_w} (0 - c_meet(m))^2

    But note: the meet is fixed. The agent's true credence on its own vocabulary, when collapsed to the meet, is the same as collapsing its true credence. The Brier score on a fixed partition is proper. So if the meet is fixed, then reporting the true credences (which collapse to the true meet credences) minimizes the expected score. So it is proper for a fixed meet.

    However, if the meet changes when the agent changes its vocabulary, then it might not be proper. But for a fixed group of agents (so the meet is fixed), then it is proper for that meet.

    But note: the agent's own vocabulary might be finer than the meet. The collapse is deterministic. So the agent's report on its own vocabulary determines c_meet. The expected Brier score on the meet is minimized when c_meet matches the true probabilities on the meet. And the true collapse of the agent's credence is the true meet distribution. Therefore, by reporting its true credences, the agent induces the true meet distribution. Hence, it is proper.

  - **Uninformed refinement**: Suppose the meet is fixed (because it is determined by the group). If the agent refines its vocabulary (without changing the meet, because the meet is the coarsest partition finer than everyone's), then the collapse to the meet is the same. So the c_meet is the same. Therefore, the score is unchanged. So uninformed refinement leaves the score unchanged.

  - **Gaming**:
    - Coarsening: If the agent coarsens its vocabulary, it might make the meet coarser. Because the meet is the finest partition coarser than all agents. If one agent coarsens, then the meet might become coarser. This would change the scoring partition. And the collapse of the agent's credence to the new meet might be different. This could change the score arbitrarily. For example, if the meet becomes {Omega}, then every agent gets the same score: (1-1)^2 + 0 = 0, which is perfect. So by coarsening to the coarsest possible, an agent can get a perfect score. This is a huge problem.

    - Inventing distinctions: If the agent refines its vocabulary, but the meet does not change (because other agents are coarse), then the score is unchanged. So no incentive.

    - Relabeling: If the agent changes the names of its cells, it doesn't matter. If it changes the partition by regrouping, then it might change the meet. For example, if it regroups in a way that is incompatible with the meet, then the meet might become coarser.

    - Exploiting mu: Not used.

  #### 5. Ignorance-normalized Brier (INB)
  - **Propriety**: The raw Brier score on the agent's own vocabulary is proper. Subtracting a constant (which depends only on the partition) does not affect propriety, because the constant is the same for any credence function on that partition. So it is proper.
  - **Uninformed refinement**: The raw Brier score on a partition A: for a world in cell a, the score is (1 - c(a))^2 + sum_{b≠a} (0 - c(b))^2 = 1 - 2c(a) + sum_{b} c(b)^2.
    The expected score under the agent's true c is: 1 - 2 sum_a c(a)^2 + sum_a c(a) * [ sum_b c(b)^2 ] = 1 - 2 sum c(a)^2 + sum c(b)^2 = 1 - sum c(a)^2.
    Now, the normalization constant is 1 - 1/|A|. So the INB score is: [1 - sum c(a)^2] - [1 - 1/|A|] = 1/|A| - sum c(a)^2.

    If we split a cell a into k subcells equally, then the new partition has |A| + k - 1 cells. The new credence for each subcell is c(a)/k. The new sum of squares: 

          sum_{b≠a} c(b)^2 + sum_{i=1}^{k} (c(a)/k)^2 = sum_{b} c(b)^2 - c(a)^2 + c(a)^2 / k

    The new INB score: 1/(|A|+k-1) - [ sum c(b)^2 - c(a)^2 + c(a)^2/k ]

    The old INB score: 1/|A| - sum c(b)^2.

    The change in score: 

          [1/(|A|+k-1) - ( sum c(b)^2 - c(a)^2 + c(a)^2/k )] - [1/|A| - sum c(b)^2]
          = [1/(|A|+k-1) - 1/|A|] + [ c(a)^2 - c(a)^2/k ]
          = [1/(|A|+k-1) - 1/|A|] + c(a)^2 (1 - 1/k)

    The term in the first bracket is negative (since the partition size increased). The second term is positive. 

    For example, if |A|=2, k=2, c(a)=0.5 (and the other cell has 0.5), then:

          Old INB: 1/2 - (0.25+0.25) = 0.5 - 0.5 = 0.
          New INB: 1/(2+2-1)=1/3 - [ (0.25)^2 *4 ] = 1/3 - 0.25 = 0.333 - 0.25 = 0.083.

          So the score increased (worsened) by 0.083.

    But if c(a)=1.0, and |A|=1 (so one cell), then old INB: 1/1 - 1^2 = 0. Now, split into k=2: new INB: 1/2 - 2*(0.5)^2 = 0.5 - 0.5 = 0. So unchanged.

    In general, the change is negative (improving) if:

          c(a)^2 (1 - 1/k) > 1/|A| - 1/(|A|+k-1)

    This is possible if c(a) is close to 1 and k is large? For example, |A|=2, c(a)=0.9 (so other cell 0.1), k=2:

          Change: [1/(2+1) - 1/2] + 0.9^2 * (1-0.5) = [1/3-0.5] + 0.81*0.5 = (-1/6) + 0.405 = -0.1667+0.405=0.2383.

          Positive, so worse.

    Another example: |A|=1, c(a)=1, k=2: then change: [1/2 - 1/1] + 1^2*(1-0.5) = (-0.5) + 0.5 =0.

    How about |A|=2, c(a)=0.99, k=1000:

          Change: [1/(2+999) - 1/2] + 0.99^2 * (1-1/1000) ≈ [1/1001 - 0.5] + 0.9801 * 0.999 ≈ -0.499 + 0.979 ≈ 0.48 (positive, worse).

    So it seems uninformed refinement always worsens the score or leaves it unchanged.

    But let's try: |A|=2, c(a)=0, and k=2. Then the cell a has 0 credence. Then splitting it: the new credences for the subcells are 0. The change:

          [1/3 - 1/2] + 0^2 * (1-0.5) = -1/6 ≈ -0.1667, so improvement.

    But note: if c(a)=0, then the true world is not in a. So the agent is certain that a is false. Splitting a cell that is known to be false does not change the score for the true world. For the true world, which is in the other cell, the raw Brier score: 

          Before: (1 - c(other))^2 + (0 - c(a))^2 = (1-c(other))^2 +0.
          After: the other cell is unchanged, and the new cells in a have 0. So the score is the same.

    And the normalization constant: before 1/2, after 1/3. So the INB score becomes: raw score - (1-1/|A|) for the agent's own partition? Actually, the normalization is the score of the uniform distribution on the agent's partition. For the new partition, the uniform distribution would have a raw Brier score of 1 - 1/(|A|+k-1). The agent's raw score is unchanged (because the true world is in the other cell, and the other cell is unchanged, and the new cells are 0). So the INB score change: 

          New INB = raw_score - [1 - 1/(|A|+k-1)] 
          Old INB = raw_score - [1 - 1/|A|]

          Change = [1 - 1/|A|] - [1 - 1/(|A|+k-1)] = 1/(|A|+k-1) - 1/|A| <0.

    So it improves. But is that gaming? The agent improves its score by splitting a cell that it knows is false. But this doesn't change its epistemic state. So yes, gaming.

    Therefore, uninformed refinement can sometimes improve the score.

  - **Gaming**: 
    - Coarsening: If we coarsen by merging cells, then the number of cells decreases. The raw Brier score might change. The normalization constant changes. It might improve or worsen. For example, merging two cells with credence 0: then the new cell has 0. The raw score for a true world not in those cells is unchanged. The normalization: 1/|A| increases to 1/(|A|-1) [since we reduce the number of cells by 1]. So the INB score: raw_score - (1-1/|A|) becomes raw_score - (1-1/(|A|-1)). The change: [1-1/(|A|-1)] - [1-1/|A|] = 1/|A| - 1/(|A|-1) <0, so it worsens. But if we merge cells that have high credence, it might improve? 
    - Inventing distinctions: As above, splitting a cell with zero credence improves the score.
    - Relabeling: Doesn't matter.
    - Exploiting mu: Not used.

