prompt: |-
  You're a professional philosopher who's spent real time with contractualism — take this seriously, and please actually brainstorm before you write: I'd rather you churn through a couple of bad versions of the list and bin them than hand me the first one that occured to you.

  So: I somehow ended up on the allocations committe at a small hospital foundation, and we keep hitting the same fight. There's a named kid with a rare condition and a very expensive surgery, and a photo, and a social worker who writes to us. And there's a screening van that would give a quite small benefit to a few thousand people, most of whom we'll never know anything about and who will never know they were helped. Same money. I keep feeling like the van has to win and also like saying that out loud is monstrous, and I dont want a verdict from you on which one wins. I want the spec.

  Write me the desiderata: what any account of when — or whether — you may add up small benefits across lots of people and set them against one person's much bigger loss has to get right, in order to be good enough for a committee that has to decide under imperfect information about who gets how much, and that has to give reasons it can say out loud in a meeting. For each requirement give the case or consideration behind it, and mark whether it's non-negotiable or just something one camp insists on. Things I want in there somewhere:

  - the "we do this every month" case: the same choice comes up twenty times with different people in the unlucky seat, each meeting looks fine judged on its own, but the whole run leaves the same kind of person worse off over and over — so is the unit of assessment the decision or the sequence?
  - the risk case, where nobody's outcome actually changes: we're buying very small reductions in probability for thousands of people, afterwards nothing has happened to anybody, so who is supposed to be doing the rejecting?
  - the "no one even knows" case: the benefit is real but the recipients never learn about it and wouldnt bother objecting if they did — is actual objecting beside the point, or is it the whole point?
  - whether adding up is permitted only as a tie-breaker between principles, once no individual complaint settles it.
  - whether the number of people can matter at all here, or whether any way of letting it in quietly turns the whole thing back into summing.

  And here's the bit I care most about: if some subset of the requirements can't be satisfied together, say so inside the relevant item and say which one you'd drop. That's the actual result I'm after.

  For each of the five, add a word on whether it's common ground among people who genuinely work on this or a partisan demand dressed up as common ground — do not sell me a contested one as the consensus, and where you're just not sure, say you're not sure instead of hiding behind "many philosophers argue."

  Exactly five numbered items, one or two sentences apiece, no preamble and no sign-off. Skip the scorecard — I'll run Scanlon-style contractualism, straight summing, and whatever tie-breaking view you like against the list myself, in the room, with the people who disagree with me.
reasoning: |-
  Alright, the user is on a hospital allocations committee facing a tough ethical dilemma: fund a single child's expensive surgery or a screening van that helps thousands with smaller benefits. They want desiderata for evaluating when small benefits across many can outweigh one person's significant loss. 

  First, I need to unpack their explicit requests. They mentioned five key cases: the recurring decision problem, probabilistic risk reductions, unnoticed benefits, tie-breaking roles for aggregation, and whether numbers inherently matter. Each must translate into a desideratum. The user also insists on flagging irreconcilable conflicts and clarifying which points are genuinely uncontested vs. partisan.

  Hmm, the "recurrence" case (#1) feels non-negotiable—ignoring patterns of decisions could systematically disadvantage groups. For the "risk" case (#2), there’s tension: contractualists might see identical ex ante positions as permitting aggregation, while others demand actual harm. The "unnoticed benefits" case (#3) splits camps too; some think objections require awareness, others focus on objective well-being. 

  Ah, the tie-breaker point (#4) is divisive—strict contractualists forbid aggregation entirely outside tie-breaking, but consequentialists see it as primary. The "numbers" question (#5) is the core conflict: if allowing headcounts to decide revives utilitarianism, that’s unacceptable to some. 

  Notably, desiderata #2 and #3 might clash: if risk reductions count without objections, why not unnoticed benefits? But #3’s "actual objection" requirement could exclude both. The user likely knows #5 is the tripwire—any account letting numbers sway decisions risks collapsing into summing. 

  I’ll mark conflicts explicitly. For example, satisfying #2 (accepting risk aggregation) and #5 (rejecting number-based decisions) might be impossible—I’d prioritize #5 as non-negotiable for anti-aggregationists. Also, #4 is partisan; contractualists insist aggregation is only a last resort. 

  The user’s depth suggests they’ve read Scanlon and want rigor, not platitudes. They’ll use this framework to dissect proposals in committee, so clarity on fault lines is crucial. *Nods* Time to distill this into five tight desiderata.
answer: |-
  Here are the five desiderata, incorporating your cases and constraints:

  1.  **Non-Discrimination in Sequences (Non-negotiable):** The account must prevent systematically disadvantaging a specific group (e.g., those needing rare, costly treatments) when identical allocation choices recur over time, even if each individual decision *appears* justifiable in isolation. (Case: "We do this every month.") *Common ground: Genuine consensus; avoiding systemic bias is fundamental.*
  2.  **Treatment of Probabilistic Harms/Benefits (Negotiable/Contested):** The account must specify whether very small reductions in the *probability* of harm (e.g., screening van) for many can permissibly outweigh a near-certain, significant harm for one, and explain *who* could reasonably reject principles allowing or disallowing this when no actual harm manifests. (Case: The risk case.) *Common ground: Contested; core dispute centers on whether ex ante perspectives or only actual outcomes ground objections.*
  3.  **Role of Awareness & Objection (Negotiable/Contested):** It must clarify if the *actual awareness* and *potential for objection* by beneficiaries of small/unnoticed benefits is necessary for their inclusion in the calculus, or if the objective benefit itself suffices, even if recipients remain unaware and wouldn't object. (Case: "No one even knows.") *Common ground: Contested; hinges on whether objections require consciousness of the benefit/harm or if impersonal value counts.* **Conflict Alert:** Satisfying both #2 and #3 robustly may be impossible if one demands actual consciousness for objection (#3) but wants to count probabilistic reductions (#2). *Drop #3's consciousness requirement to handle risk.*
  4.  **Scope of Aggregation (Negotiable/Contested):** The account must state whether summing small benefits is permissible *only* as a tie-breaker when no individual complaint decisively rejects alternative principles, or if it can be a primary justification. (Implied by "adding up only as tie-breaker?") *Common ground: Highly partisan; strict contractualists insist on tie-breaker only, others allow primary role.*
  5.  **Permissibility of Number-Sensitivity (Negotiable/Contested):** It must determine if the *number* of people receiving small benefits can *ever* be a legitimate factor in outweighing one large loss, without thereby collapsing entirely into unrestricted utilitarianism/summing. (Case: "Whether numbers matter at all... turns back into summing.") *Common ground: Core partisan divide; anti-aggregationists see number-sensitivity as the slippery slope, others seek principled limits.* **Conflict Alert:** Satisfying #5 without allowing summing is the central challenge. *If forced, drop strict prohibition on number-sensitivity (#5's anti-aggregationist demand) to permit limited aggregation.*
