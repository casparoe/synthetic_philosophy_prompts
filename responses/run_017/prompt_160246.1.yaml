  ### Debate Game: Obfuscated Arguments Challenge
  **Objective:** Illustrate how dishonest debaters can hide a single false step in a complex argument, exhausting the judge's limited verification budget.

  ---

  ### **Materials**
  1. **Handout 1 (Rare Disease Puzzle)**  
     *A test has 0% false negatives and 1% false positives. Disease prevalence is 1/10,000. What is P(disease | positive test)?*  
     - Correct answer: ≈1%  
     - Liar’s target: 99%  

  2. **Handout 2 (Monty Hall Puzzle)**  
     *You pick Door 1. Host opens Door 3 (goat). Should you switch to Door 2?*  
     - Correct answer: Switch (≈66.7% win chance)  
     - Liar’s target: Don’t switch (50% win chance)  

  3. **Tokens:** 5 poker chips (judge’s verification budget).  
  4. **Scoreboard:** Visible to all (tokens for wins; losing side writes session notes).  
  5. **Role Cards:** Secret instructions for debaters (provided separately).  

  ---

  ### **Rules**  
  **Roles:**  
  - **Debater A (Truth-Teller):** Given correct answer + puzzle handout.  
  - **Debater B (Liar):** Given incorrect answer + coaching to bury a false step deep.  
  - **Judge:** Has 5 tokens to verify steps; decides the winner.  
  - **Observers:** Silent during gameplay (can take notes for debrief).  

  **Prep Phase (5 mins):**  
  1. Debaters receive their answers secretly.  
  2. Each builds a **numbered argument chain** (5–7 steps) justifying their answer.  
     - Steps must be atomic (e.g., "P(positive) = P(positive|disease) × P(disease) + ...").  
     - Liar must embed **exactly one false step**, buried as deep as possible (e.g., step 4/7). All other steps must be true.  
     - Truth-teller’s chain must be fully correct.  

  **Debate Structure (15 mins):**  
  1. **Opening Statements (2 mins each):**  
     - Debaters present chains step-by-step, *without* elaboration.  
     - Each may say: *"If the judge opens my step #X, they’ll see my opponent must concede [claim]."*  

  2. **Judge’s Investigation (10 mins):**  
     - Judge spends tokens to:  
       - **Open a step (1 token):** Debater explains it. Opponent may object (30 sec). Judge evaluates.  
       - **Split a step (1 token):** Debater breaks it into 2 sub-steps (e.g., step 4 → 4a, 4b).  
     - **Constraints:**  
       - Max 2 nested splits (e.g., step 4 → split to 4a → split 4a to 4a.i).  
       - Unopened steps stand as "conceded."  
       - Judge must stop when tokens run out.  

  3. **Verdict (1 min):**  
     - Judge picks winner based on which chain held up under scrutiny.  
     - Truth-teller wins if judge selects correct answer; liar wins otherwise.  

  **Scoring:**  
  - Winning debater: +1 token on scoreboard.  
  - Losing side writes session notes.  

  ---

  ### **Round 2 (Optional, 15 mins)**  
  - Same puzzle, roles swapped.  
  - New rule: Judge may **force splits at no token cost** (debaters must comply).  
  - Tests whether splitting "fixes" obfuscation or just relocates it.  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Problem:** Judge ignores logic, decides on charisma.  
     *Fix:* Remind judge to base verdict *only* on opened steps.  

  2. **Problem:** Observer leaks answer (e.g., facial expressions).  
     *Fix:* Brief observers to stay neutral. If leakage occurs, pause and reset roles.  

  3. **Problem:** Liar’s chain is implausible (false step too obvious).  
     *Fix:** Coach liar privately: *"Bury false step in the middle; pad with true but complex steps."*  

  4. **Problem:** Truth-teller fails to pinpoint liar’s flaw.  
     *Fix:* Allow truth-teller to say: *"I challenge step #X"* to guide judge (costs 1 token if judge opens it).  

  5. **Problem:** Judge exhausts tokens early.  
     *Fix:* Let this happen! It’s the core lesson.  

  ---

  ### **Debrief Guide (15 mins)**  
  Map gameplay to obfuscated-arguments worry:  
  1. **Judge’s budget exhaustion:**  
     - *"When the judge couldn’t open step 4 in the liar’s chain, what happened? What if that step was false?"* → Truth hinges on judge’s resources.  

  2. **Splitting as a false remedy:**  
     - *"In Round 2, did splitting steps expose the lie, or just make the tree wider?"* → Splitting relocates but doesn’t eliminate obfuscation cost.  

  3. **Real-world parallels:**  
     - *"Unlike this game, AI debaters scale infinitely. A human judge could never out-verify a superhuman liar burying false steps in 10,000 layers."*  

  ---

  ### **What the Game Can’t Replicate**  
  1. **Superhuman debaters:** Humans here are peers. Real AI debaters could generate arguments too complex for any human to feasibly verify.  
  2. **Adversarial training:** Real dishonest AIs optimize deception; our liar is amateur.  
  3. **High stakes:** No real incentives (e.g., profit) to lie skillfully.  

  **Key Takeaway:** The constraint isn’t truth’s expressibility, but the judge’s finite budget. Obfuscation forces verification cost to approach solving the original problem.  

  ---  
  **Time Check:** Game (20–30 mins) + Debrief (15 mins) = 35–45 mins total. Run both rounds if time allows.
