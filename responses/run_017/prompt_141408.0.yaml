prompt: |-
  I'm giving a thirty-minute guest lecture to a room of second-year epidemiology residents, in their journal-club slot, on Simpson's paradox. They've all seen the kidney-stone and Berkeley-admissions examples and have cached the moral "aggregate numbers lie, disaggregate." I want to break exactly that: my claim is that the reversal is an arithmetic fact about ratios that has nothing to do with causality, that the more common professional failure among people who already know the paradox is stratifying when they should aggregate, and that "is this a confounder?" is downstream of a question they aren't yet in the habit of asking.

  Plan the session — don't explain the paradox itself. I need: (1) the order the pieces have to go in and why. I'm tempted to open with a bare pair of 2x2 tables with no story attached at all, so the reversal first registers as arithmetic, before anyone can reach for a causal story; steelman starting with the vivid case instead. (2) One carrying example, medical enough not to feel imported, in which the stratifying variable is downstream of the exposure, so that the aggregate estimate is the right one and stratifying is the error — and why that example rather than the canonical ones, and what it must and must not contain. (3) The misconceptions in the order they'll form, and the point in the sequence where each gets defused: I expect "the stratified numbers are the truth," "a reversal means something is broken in the data," and a conflation of the reversal with non-collapsibility of the odds ratio. (4) Whether to introduce a causal graph at all in thirty minutes and, if so, where. (5) One end-of-session question that separates someone who got it from someone who has merely learned to distrust aggregate tables.

  I've also been using a rule of thumb I don't trust to survive contact with experts: stratify on a variable only if it is a cause of the exposure rather than a consequence of it. Tell me where that rule breaks — I'm least sure about variables that proxy for an unmeasured confounder while also being affected by the exposure — and whether to teach the rule, teach the graph instead, or openly say I'm leaving the hard case out at this level.
reasoning: |-
  Okay, the user is preparing a lecture on Simpson's paradox for epidemiology residents who already know the basics. They want to challenge the idea that disaggregation is always correct and emphasize that the paradox is about arithmetic, not causality. The main goals are to show that aggregation can sometimes be right, to address misconceptions, and to decide on teaching causal graphs. 

  First, I need to consider the structure. Starting with raw numbers instead of a story might help residents see the arithmetic first, but a vivid example could engage them. The user is torn between these approaches. A medical example where stratifying is wrong is crucial—something with a mediator where aggregate is correct. The example must be clear and not have confounding to avoid confusion.

  Misconceptions to tackle include thinking stratified numbers are always true, that a reversal indicates data issues, and conflating the paradox with non-collapsibility. Each needs to be addressed in sequence. For causal graphs, introducing them briefly with the mediator example could help, but time is limited. The end-of-session question should test understanding by asking when to aggregate despite a reversal.

  The user's rule of thumb (stratify only if the variable causes exposure) is problematic when variables are proxies for confounders but affected by exposure. Teaching the graph is better, but acknowledging the complexity might be necessary for an intro session. The example needs to avoid time-varying factors and ensure the stratifying variable is a clear mediator. 

  Overall, the lecture should flow from arithmetic demonstration to medical example, then address misconceptions, touch on graphs, and end with a test question. The key is reinforcing that context determines whether to aggregate or stratify, not the presence of a reversal.
answer: |-
  Here’s a structured 30-minute session plan targeting your goals, designed to challenge ingrained habits while respecting time constraints:

  **Order & Why (1):**  
  1.  **Open with Bare Arithmetic (5 mins)**  
      *   **Do:** Present two 2x2 tables (e.g., Treatment A vs. B, Success/Failure) stratified by Factor Z (e.g., Z+/Z-). Show aggregate favors A, but within *each* stratum of Z, B is better. **No context, no story.**  
      *   **Why:** Forces immediate confrontation with the mathematical reality. Prevents reflexive causal narratives ("Z must be a confounder!"). Establishes the paradox as a property of weighted averages of ratios, period.  
      *   *Steelman Counter:* Starting vivid risks anchoring bias on causal stories. Bare math creates cognitive dissonance needed to break "disaggregate always" reflex.

  2.  **Introduce Medical Example - Stratifying is the Mistake (10 mins)**  
      *   **Example:** "Aspirin Trial & Headache Severity"  
          *   *Exposure:* New Aspirin (N) vs. Standard Aspirin (S) for acute headache relief (Success = pain-free in 1hr).
          *   *Stratifying Variable:* Headache Severity at 30 mins (Mild/Severe) - **measured post-exposure**.
          *   *Result:* Aggregate shows N better. Stratified by Severity-30min, S appears better *within each severity stratum*.  
          *   *Why Aggregate is Correct:* Headache severity at 30 mins is *caused by* the aspirin (N works faster, leading to more 'Mild' cases at 30min). Stratifying on this mediator (Z) blocks part of the beneficial effect of N. The aggregate comparison captures the true total effect. Stratifying introduces bias by conditioning on a collider (if unmeasured causes of both initial severity and response exist) or just obscuring the path (N -> Z -> Outcome).
      *   **Why this example?**  
          *   Medical relevance (drug effect, symptom progression).
          *   *Crucially:* Z is unambiguously **downstream** of exposure (timing: Drug taken -> Severity measured 30min later -> Outcome at 60min).
          *   *Avoids:* Confounding (ideally, assume randomization or no baseline confounding), complex time-varying factors.
          *   *Must Contain:* Clear temporal ordering (Exposure -> Stratifier -> Outcome), making mediator role intuitive.
          *   *Must Not Contain:* Any suggestion Z is a baseline risk factor (confounder).

  3.  **Address Misconceptions Sequentially (10 mins)**  
      *(Weave these into the Aspirin example discussion)*  
      1.  **"Stratified = Truth":**  
          *   *Formation:* After seeing Berkeley/kidney stones.  
          *   *Defuse (During Aspirin Example):* "In the Aspirin trial, the stratified result *looks* consistent S>N, but it's actually *wrong* because we chopped up the effect of N working faster. The aggregate number, which seemed 'suspect' because of the reversal, is actually the valid estimate of N's total effect."  
      2.  **"Reversal = Broken Data":**  
          *   *Formation:* Seeing paradox as a red flag implying bias.  
          *   *Defuse (After Arithmetic & Aspirin):* "The reversal itself is neutral math. It tells you *nothing* about whether the aggregate or stratified estimate is 'correct' for your causal question. It only signals that the association differs across strata of Z. Whether that means you *need* to stratify or *must not* stratify depends entirely on the causal role of Z relative to your exposure and outcome."  
      3.  **Conflation with Non-Collapsibility:**  
          *   *Formation:* When discussing ORs specifically.  
          *   *Defuse (Briefly, if ORs mentioned):* "While non-collapsibility (where ORs change magnitude upon aggregation even without paradox) is related math, Simpson's Reversal is distinct. Reversal is about *direction* changing based on weights, and crucially, it *can* happen with Risk Differences/Ratios. The core lesson here (aggregate vs. stratify) applies regardless of the measure."

  4.  **Causal Graphs (3 mins - Yes, Briefly)**  
      *   **Where:** Immediately after explaining *why* stratifying was wrong in the Aspirin example.  
      *   **Do:** Sketch a simple DAG: `(Exposure) -> [Stratifier Z] -> (Outcome)`. Highlight the path `Exposure -> Z -> Outcome`.  
      *   **Say:** "Stratifying on Z blocks this path. If this path is part of the effect we want to measure (the *total* effect), blocking it introduces bias. The aggregate table preserves this path." Contrast with confounder DAG (`Z -> Exposure`, `Z -> Outcome`).  
      *   **Why:** Provides a visual anchor for the "downstream" concept. Makes the rule of thumb more concrete. Avoids deep dives into d-separation.

  5.  **The Killer End-of-Session Question (2 mins)**  
      *   **Question:** "You are comparing mortality rates between Hospital A and Hospital B. The aggregate mortality is higher at Hospital A. However, when you stratify by disease severity (e.g., APACHE score), Hospital A has lower mortality *within every severity stratum*. What is the *first* causal question you absolutely must answer before deciding whether the aggregate or stratified comparison is more appropriate for assessing hospital performance?"  
      *   **Answer You Want:** **"Is disease severity (the stratifying variable) *caused by* the choice of hospital or by factors *prior* to hospital admission?"** (i.e., Is severity a mediator or a confounder?).  
      *   **Why it Separates Understanding:**  
          *   Shows they moved beyond "reversal = disaggregate".  
          *   Focuses on the *causal role* of Z relative to exposure (E) as the critical factor.  
          *   Recognizes that the same numerical phenomenon requires opposite analytical approaches depending on context.

  **Addressing Your Rule of Thumb & Teaching Approach:**  

  *   **"Stratify only if Z is a cause of E" Rule:**  
      *   **Breaks When:**  
          1.  **Z is a Proxy for an Unmeasured Confounder (U), but also Affected by E:**  
              *   *Example:* E = New Exercise Program, Outcome = Heart Health, Z = Blood Pressure (measured post-exercise), U = Genetic Risk (unmeasured).  
              *   *Problem:* Z is caused by E (exercise lowers BP) *and* is associated with U (genetic risk affects BP). Stratifying on Z (BP) would:  
                  *   Block part of the exercise effect (`E -> Z -> Outcome`).  
                  *   *Induce association* between E and U via colliding paths (`E -> Z <- U`), creating bias.  
              *   *Rule Fails:* Z is *not* a cause of E (it's affected by E), so the rule says "don't stratify". However, if U is a strong confounder, naive aggregation *also* has confounding bias! Neither naive approach is good.  
      *   **Teaching Recommendation:**  
          *   **Teach the Graph (DAG) Briefly:** It clarifies roles (confounder, mediator, collider) better than a simple rule.  
          *   **Acknowledge the Hard Case:** Explicitly say: "The simple rule 'stratify only if Z causes E' works well for distinguishing confounders (where stratification helps) from mediators (where it harms). But it gets tricky if Z is *both* affected by E *and* associated with unmeasured causes of the outcome. That's a more complex scenario requiring advanced methods like g-estimation or careful sensitivity analysis. For today, focus on distinguishing the clear confounder case from the clear mediator case using the DAG."  
          *   **Refine the Rule (Optional):** "A *safer* starter rule is: Stratify on Z only if it is a *confounder* (common cause of E and Y). If Z is an effect of E (or an effect of Y), stratifying is usually harmful unless you have a very specific reason (like effect decomposition) and understand the pitfalls."

  **Session Flow Summary:**  

  1.  **(5 min) Bare Arithmetic Reversal:** "Math is real, no stories yet."  
  2.  **(10 min) Aspirin Example:** "Here, aggregating is RIGHT, stratifying is WRONG. Why? Z is downstream." + Simple DAG.  
  3.  **(10 min) Tackle Misconceptions:** Weave into Aspirin discussion: "Stratified isn't always truth", "Reversal isn't broken data", "Not just OR collapsibility".  
  4.  **(3 min) Causal Graph Anchor:** Reinforce confounder vs. mediator DAGs.  
  5.  **(2 min) Killer Question:** "Hospital example - What's the FIRST question about Z?"  

  This plan confronts the "disaggregate always" reflex immediately with math, provides a compelling medical counter-example where aggregation is correct, uses a simple DAG to clarify the "why," explicitly debunks key misconceptions arising from prior exposure to the paradox, and ends with a question testing deep understanding of the core causal framing. It acknowledges but sidesteps the hardest edge cases of the rule of thumb by focusing on clear confounder vs. mediator distinctions.
