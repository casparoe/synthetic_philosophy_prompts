  Below is a decision tree flowchart for your ethics handout. It starts with the basic rescue case (save 1 stranger or 5 strangers, all die otherwise) and branches through concrete questions to isolate distinct ethical positions. The tree has **14 branch nodes** and **10 leaf positions** (8 named, 2 unnamed). Positions are labeled only at the endpoints, and each leaf includes its most awkward commitment. Nodes avoid theory-laden language and use variations of the rescue case to force distinctions.  

  ### **Rescue Case Decision Tree**  
  Start: You are a bystander. Save 1 stranger or 5 strangers? All die otherwise.  

  1. **Is it permissible to save the 5?**  
     - *No* → **Leaf 1: Radical Anti-Aggregation** (unnamed).  
       - *Awkward commitment: Must let 1,000+ die to save 1, even if harms are identical.*  
     - *Yes* → Node 2.  

  2. **Is saving the 5 *required* (not just permissible)?**  
     - *No* → Node 3.  
     - *Yes* → Node 4.  

  3. **Is it permissible to save the *1***?  
     - *No* → **Leaf 2: Mandatory Lottery View** (e.g., Taurek-inspired).  
       - *Awkward commitment: Must flip a coin even if you could save 100 vs. 1.*  
     - *Yes* → **Leaf 3: Agent-Centered Prerogative** (Scheffler-inspired).  
       - *Awkward commitment: Permits saving 1 over 1,000 if you "feel like it."*  

  4. **In a new case: Save 1 from death, or save 5 from *stubbed toes*?**  
     - *Yes, still required to save the 5* → Node 5.  
     - *No* → Node 6.  

  5. **Now: Save 1 from death, or save 1,000,000 from stubbed toes?**  
     - *Yes, required* → **Leaf 4: Strong Aggregationism** (e.g., Total Utilitarianism).  
       - *Awkward commitment: Must prioritize a billion stubbed toes over one death.*  
     - *No* → **Leaf 5: Diminishing Marginal Weight** (unnamed).  
       - *Awkward commitment: Preventing a harm becomes *less* urgent as more people experience it.*  

  6. **Another case: Save 1 from death, or save 5 from *losing a leg*?**  
     - *Yes, required to save the 5* → Node 7.  
     - *No* → Node 8.  

  7. **Now: Save 1 from death, or save 5 from a *broken arm* (less bad than leg loss)?**  
     - *Yes, required* → **Leaf 6: Weak Aggregationism** (e.g., Prioritarianism).  
       - *Awkward commitment: Must save 5 from broken arms over 1 from death.*  
     - *No* → **Leaf 7: Threshold Aggregationism** (e.g., Nagel-inspired).  
       - *Awkward commitment: Leg loss "counts" but a broken arm doesn’t—no non-arbitrary threshold.*  

  8. **Basic case with equal harms: Save 1 from death or 5 from death?**  
     - *Still required to save the 5* → **Leaf 8: Tiebreak Aggregationism** (e.g., Scanlon’s Contractualism).  
       - *Awkward commitment: If the 1 faces a slightly worse harm (e.g., torture), you *must* save the 1, even vs. 1,000.*  
     - *Not required* → **Leaf 9: Pairwise Comparison View** (Scanlon-style Contractualism).  
       - *Awkward commitment: Cannot save 5 from death over 1 from death if the 1 can "reasonably reject" being abandoned.*  

  9. **Back to Node 4 path: If you save the 1, are you blameworthy?**  
     - *Yes* → **Leaf 10: Quasi-Requirement View** (e.g., Rule-Utilitarianism).  
       - *Awkward commitment: Blame for saving 1 vs. 5, but not if harms are unequal (e.g., death vs. stubbed toe).*  
     - *No* → Rejoin Leaf 3 (Agent-Centered Prerogative).  

  ---

  ### **Key Omissions & Structural Notes**  
  - **Incommensurability** is embedded in Leaf 9 (Pairwise Comparison): Losses can’t be summed; only ordinal comparisons per individual.  
  - **Risk cases** (e.g., 20% chance for 5 vs. 100% for 1) aren’t a node because they don’t cleanly split views—most positions treat risk like certainty.  
  - **Standpoint** isn’t a node because no major theory changes *requiredness* based on role (e.g., the 1 may save themselves, but bystanders must save 5).  
  - **Unnamed leaves** are positions with no prominent defenders (Leaf 1, Leaf 5).  
  - **Tree cannot separate**:  
    - Taurek’s "equal chances" (Leaf 2) vs. contractualist pairwise (Leaf 9) in cases with equal harms.  
    - Weak vs. Strong Aggregationism when per-person harm is moderate (e.g., leg loss).  

  ---

  ### **Nasty Follow-Up Cases for Discussion**  
  Use these to probe students who land on the same leaf:  
  1. **The Sleeping Five**: Save 1 from death, or save 5 from death *who are asleep and will never know they were in danger*. Does your verdict change? (Tests if harm requires subjective experience.)  
  2. **The Distant Million**: Save 1 neighbor, or save 1 million strangers on another continent. Identical harms. Does distance matter? (Tests impartiality vs. relational duties.)  
  3. **The Broken Promise**: Save 5 from death, but you promised the 1 you’d save them. Required? (Tests agent-relative constraints vs. aggregation.)  

  ---  
  This tree isolates core disagreements in "do the numbers count?" while avoiding theory labels until endpoints. Use the follow-ups to expose hidden divergences!
