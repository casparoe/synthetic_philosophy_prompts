prompt: |-
  Hi. I work in the policy and democratic services team at a mid-sized unitary council (pop. around 280k — big enough to matter, small enough that everyone knows everyone). Over the last couple of years we keep getting asked to run things by sortition: citizens' assemblies, lottocracy-style standing panels, drawn scrutiny juries, whatever the requester happens to have read about. The asks come from campaign groups, from officers who think a drawn body would unblock something, and from a few councillors who I suspect mainly want to hand off a vote they don't fancy taking. At the moment we say yes or no on vibes, and I want something I can actually run and then defend.

  What I need from you is a decision procedure, in the order I'd run it, for a request landing on my desk:

  - The questions, in order.
  - What counts as a good enough answer to each one, so I can tell when someone has actually answered rather than just asserted.
  - Where the procedure just stops with a no.
  - Where it hands the decision over to a person or to full council because it's a values call rather than a factual one.
  - And be honest about which steps are judgement calls wearing a clipboard.

  Three things I think it has to get right, because that's where our vibes approach keeps breaking down:

  1. Sortition seems to be doing three quite different jobs in these requests, and I dont think one design does all three. Sometimes it's a mirror — the body should look like the city. Sometimes it's a filter — we want people who aren't already captured, who'll actually sit with evidence instead of a line. Sometimes it's a shield — we want the decision taken somewhere that re-election, party whips, local donors and the local paper can't reach. I want the procedure to start by making the requester say which job they want, and then let the design fall out of that: who's in the pool, how many, paid or not, who writes the question and the briefing material, binding or advisory, one-off or rotating.

  2. The pre-commitment problem. Half these requests reach us after officers have already got a preferred option, or with a remit that lets cabinet quietly ignore whatever comes out. I think the procedure should kill those — a consultation that can't bite is worse than no consultation — but I want a test for it that isn't just me disliking the requester.

  3. Who counts as the pool. Our instinct is a stratified sample of residents, but the hard cases nearly always dump the costs on people who aren't a tidy demographic category: one ward next to a proposed facility, commuters who don't live here, under-18s, people only in the city for two years, future residents. And then there's the repeat-draw thing: we've got maybe 40k households, and if we run one of these a year we might end up with a class of professional drawn citizens who come back knowing how the machinery works. I genuinely don't know if that's a bug or a feature, and I want the procedure to tell me rather than me guessing.

  Constraints: about a week per request, around £60k a year total, one analyst who can do a stratified draw if you tell them what to stratify on, and no in-house deliberative-polling expertise. Whatever I recommend has to fit on a page a councillor will actually read, and our monitoring officer has to be able to defend it. We can run at most one real one a year, so the procedure also needs to say which requests to turn down.

  Then please run it, out loud, on three:

  (a) A petition with roughly 8,000 signatures asking for a citizens' assembly to set the city's twenty-year transport plan — congestion charging, bus franchising, a workplace parking levy. My gut says yes: this is exactly the sort of thing assemblies are for.

  (b) A motion from a backbench councillor for a drawn panel to decide members' allowances, the rules on councillors' outside interests, and whether to introduce term limits. This smells like a conflict of interest to me, and also like the one case where the shield job is doing real work.

  (c) A request from a residents' group in the ward next to a proposed waste facility: they want the siting decision made by a drawn panel instead of the planning committee. I'd quite like to say yes to these people, they've been badly messed about for years — but I've got a feeling the honest procedure is going to hand me a no, and if it does I want to understand why before I have to go and say it to their faces.

  One more thing: if the procedure has a branch for "we're drawing from the same pool again next year / can we invite back the people who were good", spell it out, because we're about to hit exactly that.

  Please write it in British English (organisation, favour, recognise, and so on). Ta.
reasoning: |-
  Okay, the user works in policy and democratic services at a unitary council and needs a structured decision procedure for handling sortition requests. They've outlined specific pain points: distinguishing between the mirror, filter, and shield functions of sortition; addressing pre-commitment issues; and defining participant pools. 

  First, I need to unpack their core frustrations. The "vibes-based" approach is failing because they lack clear criteria, leading to inconsistent decisions. The three functions of sortition (mirror/filter/shield) are often conflated in requests, causing design mismatches. Pre-commitment is a hidden landmine—consultations that can't change outcomes waste resources and erode trust. Pool definition gets messy with edge cases (commuters, future residents) and repeat participation risks creating "professional citizens."

  Their constraints are practical: limited budget (£60k), minimal staff (one analyst), no deliberative expertise, and max one assembly/year. The output must fit a one-page councillor briefing and withstand legal scrutiny. Emotionally, they seem weary of defending ad hoc decisions and want something robust yet humane—especially for the waste facility case where they empathize with residents but suspect refusal is inevitable.

  For the procedure itself, I'll structure it as a flowchart-style checklist. Stage 1 should force requesters to explicitly name the function (mirror/filter/shield), as this dictates everything else—pool composition, size, authority. Stage 2 tackles pre-commitment: if decision-makers haven't bound themselves to the outcome, it dies immediately. Stage 3 defines the pool with clear rules for hard cases: use residency rolls for mirror/filter, special eligibility for shield, and cap repeat draws at once every 5 years to avoid professionalization. 

  The three test cases reveal how this works: 
  - The transport petition passes (mirror function, council pre-commitment, resident pool). 
  - The councillor allowances motion fails spectacularly (shield function required but pool definition impossible without external oversight). 
  - The waste facility request dies at pre-commitment (planning can't legally delegate). 

  On repeat participation: I'll build in a "draw history" check and limit re-selection to avoid over-reliance on experienced participants. For the waste facility refusal, I'll emphasize that the procedure protects residents more than a toothless assembly would—they deserve real consultation, not symbolism. 

  The tone must stay pragmatic British civil service: no jargon, blunt about "judgement call" steps (marked with †), and ruthless when killing non-viable requests. I'll flag where legal sign-off (Monitoring Officer) is non-negotiable. And yes—spelling will be meticulously British ("organisation", "favour").
answer: |-
  Here’s a **Sortition Request Decision Procedure** for your team, designed for clarity, defensibility, and alignment with your constraints. It’s structured as a 5-stage checklist, with explicit kill steps, delegation points, and flags for judgement calls (marked †).  

  ---

  ### **Stage 0: Pre-Screen (Admin Check)**  
  *Before formal assessment, reject requests that:*  
  ❌ **Fail basic viability**: No budget (£60k/year cap), analyst unavailable, or >1 request/year already approved.  
  ❌ **Misuse sortition**: Purely performative (e.g., "validate" a pre-decided policy), or replace statutory processes (e.g., planning committees†).  
  ❌ **Scale mismatch**: Requests requiring >50 participants or >3 meetings (cost-prohibitive).  
  → *Proceed only if request passes Pre-Screen.*  

  ---

  ### **Stage 1: Define the FUNCTION**  
  **Question:** *"What job is sortition doing here? Choose ONE primary function:"*  
  - **A. Mirror** = Reflect city demographics (stratified random sample).  
  - **B. Filter** = Insulate from vested interests (deliberative mini-public).  
  - **C. Shield** = Absorb accountability for high-risk decisions (independent jury).  

  **Good Answer:** Explicit choice + justification linking function to the issue’s nature.  
  → **Kill if**: Requester refuses to specify or demands "all three".  
  → **Delegate if**: Function conflicts with statutory/legal constraints (e.g., Shield for planning decisions → Monitoring Officer).  
  † *Judgement call*: Is the requester’s chosen function *plausible* for the issue? (e.g., "Mirror" for technical transport planning is weak).  

  ---

  ### **Stage 2: Confirm PRE-COMMITMENT**  
  **Question:** *"Has the ultimate decision-maker (Cabinet/Full Council) pre-committed in writing to either: (a) implement the outcome, or (b) publicly justify rejection?"*  

  **Good Answer**: Signed terms of reference or council motion binding the outcome.  
  → **Kill if**: No written pre-commitment exists.  
  → **Delegate if**: Pre-commitment is ambiguous → Monitoring Officer for legal review.  
  † *Judgement call*: Is the pre-commitment credible? (e.g., Cabinet openly opposes the assembly’s topic → likely ignore outcome).  

  ---

  ### **Stage 3: Define the POOL**  
  **Question:** *"Who is in the selection pool? Specify eligibility criteria and stratification needs."*  

  **Rules**:  
  - **Mirror**: Stratify by age, gender, ethnicity, ward, deprivation. Pool = residents (electoral roll).  
  - **Filter**: As above + exclude recent elected officials/lobbyists.  
  - **Shield**: Narrow pool (e.g., affected ward residents) + independent facilitator selects.  
  - **Repeat draws**: No participant serves >1 assembly every 5 years. No "invite backs".  
  - **Hard cases**:  
    - *Future residents/under-18s* → Not eligible (legal impracticality).  
    - *Commuter/non-resident impacts* → Stratify by employment postcode †.  
    - *Hyper-local impacts* → Use ward boundaries OR delegate to Monitoring Officer if unfair exclusion risk.  

  **Good Answer**: Clear, defensible criteria matching the function.  
  → **Kill if**: Pool is impossible (e.g., "future residents"), or >10% of households would be ineligible due to repeat draws†.  
  † *Judgement call*: Does the pool fairly represent affected interests?  

  ---

  ### **Stage 4: Assess DESIGN FEASIBILITY**  
  *If request passes Stages 1-3, assign analyst to draft design spec:*  
  - **Size**: 15-25 participants (cost-efficient, robust deliberation).  
  - **Process**: 2-3 meetings, expert witnesses, facilitated deliberation.  
  - **Output**: Advisory report (binding only if Full Council pre-commits).  
  - **Cost**: £15k-£40k (venue, facilitation, participant fees £150/day).  

  **Kill if**: Design exceeds budget/time, conflicts with function (e.g., "Mirror" with tiny pool), or lacks impartial oversight.  

  ---

  ### **Stage 5: VALUES CHECK**  
  *Final delegation point:*  
  → **Full Council vote required if**:  
  - Topic is highly political (e.g., constitutional changes).  
  - Shield function involves elected members’ interests.  
  - Legal/moral risk exceeds officer authority.  

  ---

  ### **Procedure Summary Flow**  
  `Request → Stage 0 → Stage 1 → Stage 2 → Stage 3 → Stage 4 → Stage 5 → APPROVE/DENY`  
  ⏱ *Process time*: 3-5 days if no delegation/kills.  

  ---

  ### **Test Cases**  
  **(a) Transport Plan Petition (8k signatures)**  
  - Stage 1: **Mirror** (requester wants "city’s voice").  
  - Stage 2: Cabinet *must* pre-commit (transport is executive function).  
  - Stage 3: Residents, stratified. ✅  
  - Stage 4: Feasible (high cost, but within annual budget).  
  - Stage 5: No values conflict.  
  → **APPROVE** (aligns with your gut).  

  **(b) Councillor Allowances Motion**  
  - Stage 1: **Shield** (insulate from self-interest).  
  - Stage 2: Full Council pre-commitment possible.  
  - Stage 3: **KILL** at Stage 3. *Why?* Pool must exclude councillors/staff, but "public" pool risks unfairness (non-residents? vulnerable excluded?). Monitoring Officer confirms: only Independent Remuneration Panel can advise.  
  → **DENY**.  

  **(c) Waste Facility Siting**  
  - Stage 1: **Shield** (protect from NIMBY pressure).  
  - Stage 2: **KILL** at Stage 2. *Why?* Planning Committee *cannot* delegate statutory decision-making (§101 Local Govt Act 1972). Pre-commitment impossible.  
  → **DENY** (but offer non-sortition options: enhanced consultation, expert review).  

  ---

  ### **Key Outputs per Request**  
  - **APPROVED**: Brief for councillors (1 pager): Function, pool, cost, pre-commitment clause.  
  - **DENIED**: Written rationale citing stage failed + legal/policy basis.  

  ### **Why This Works**  
  - **Kills bad-faith asks**: Pre-commitment test stops symbolic consultations.  
  - **Function-driven**: Prevents "Swiss Army knife" misuse of sortition.  
  - **Guards against professionalisation**: Repeat draw limits protect against "civic careerists".  
  - **Defensible**: Audit trail shows objective criteria, not vibes.  

  ---  
  **Final note**: The judgement calls † are unavoidable in governance, but this procedure *minimises* them and *documents* rationale. Always run Stage 0 first—it saves 80% of effort.
