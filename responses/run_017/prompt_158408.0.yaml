prompt: |-
  I'm putting together the closing session of a graduate seminar I teach on evidence, underdetermination, and the so-called historical sciences, and I've asked a colleague from our anthropology department — an archaeologist who works on later prehistoric settlement — to come in as a respondent. The session is built around a distinction I've been developing in my own work and want to defend in front of her. Call the first class inert residues: the unintended by-products of behaviour, such as the sheen on a sickle blade, strontium and oxygen signatures in tooth enamel, the spacing of postholes, the species and age profile of faunal material in a ditch fill. Call the second class legible residues: things produced at least partly in order to be read by somebody else — sealings, standardised weights and measures, coinage, monumental iconography, written records, and deliberate deposits that seem to quote or re-stage earlier deposits. The claim I want to make is that only legible residues can carry an inference to institutions. The argument is short: an institution — a postmarital residence rule, a debt-tribute obligation, a levy on grain, a regime of heritable rights in land — is a set of rules, and rules have to be representable to the people who live under them; where nothing was made to be read, there was no rule there to recover, only behaviour. So, on my view, the current wave of confident claims about Neolithic institutions, resting on ancient DNA and isotope work at sites with no seals, no metrology and no iconography, is overreach, and the honest inference stops at patterns of movement, diet and biological relatedness. My stock hypothetical in the seminar is a ditched enclosure in which the cattle bones carry pasture signatures from seventy kilometres away while the ceramics are local, and the aDNA shows that the adult women in the adjacent burials are the non-locals: I say this licenses at most a claim about where women came from, and not the claim that the community had a matrilocal marriage institution.

  What I need help with is how to hold that line without collapsing into positions I don't want to occupy. I'm not sceptical about meaning in material culture, and I don't want to sound like the old processual suspicion that belief and normativity lie permanently beyond the trowel; I also don't want to lean on the indiscriminate form of underdetermination, since I think bridging arguments really can be disciplined by formation theory, use-wear analysis and taphonomy. The step I'm least sure about is the one from rules must be representable to those who follow them to only artifacts made to be read can evidence rules. Is there a defensible formulation — perhaps restricted to codified institutions, or to institutions that are officially recognised as such by their participants — that lets me keep the scepticism about prehistoric kinship-and-debt claims while conceding that house plans, storage capacity and the treatment of the dead can tell us a good deal about what people were expected to do? And I'd welcome your view on a connected worry I have not been able to shake: on my account, ritual and symbolic seem to function as residual categories that we retreat to precisely when the residue is inert, which is very close to the methodological vice the contextual archaeologists complained about thirty-odd years ago.
reasoning: |-
  Okay, I see the user is preparing a closing session for their graduate seminar on evidence and underdetermination in historical sciences. They've developed a distinction between "inert residues" and "legible residues" and want to defend the position that only legible residues can support inferences about institutions. They're concerned about avoiding unwanted philosophical positions while maintaining skepticism about claims of prehistoric institutions based on non-legible evidence.

  The user's core argument is that institutions require representable rules, and therefore only artifacts intentionally created to communicate (legible residues) can serve as evidence for them. They're particularly skeptical about claims of Neolithic institutions based solely on ancient DNA and isotope analysis. Their example about cattle bones, ceramics, and burial practices illustrates their concern that such evidence only supports claims about behavior patterns, not institutional rules.

  I need to help the user refine their position without falling into problematic stances. They specifically want to avoid processual archaeology's dismissal of meaning in material culture, and they don't want to rely on broad underdetermination arguments. They're also concerned about ritual/symbolic becoming a "residual category" - a problem contextual archaeologists criticized.

  The key tension here is between the user's desire to maintain skepticism about institutional claims from inert residues while acknowledging that material culture patterns can reveal expectations and norms. They're questioning whether their "rules must be representable" premise necessarily leads to "only legible residues evidence rules." 

  I think the solution lies in distinguishing between different types or levels of institutions. The user might limit their skepticism to formal, codified institutions that require explicit representation - these would indeed require legible residues. Meanwhile, they could acknowledge that habitual practices, norms, and expectations might be inferred from patterned material evidence, even when not intentionally communicative. This preserves their skepticism about claims of formal Neolithic institutions while allowing material culture to reveal social expectations.

  For their concern about ritual/symbolic becoming a residual category, I suggest emphasizing that intentional communication isn't limited to what we typically label as "ritual" or "symbolic." The key is the communicative intent, not the domain. This avoids the problem of retreating to ritual when other explanations fail.

  The user might also benefit from framing their position as methodological rather than ontological - it's about what we can confidently claim from different types of evidence, not about what actually existed in the past. This helps avoid implying that non-codified norms aren't "real" institutions.

  I'll develop these points into a coherent response that strengthens their argument while addressing their concerns about avoiding problematic positions and the ritual-as-residual problem. I'll provide specific reformulations of their claims and suggestions for how to present this in their seminar session.
answer: |-
  Here’s a refined approach to defend your core argument while avoiding philosophical pitfalls, incorporating your concerns about ritual/symbolic categories and institutional inference:

  ### 1. **Reframe the Distinction: Intentional Semiosis vs. Behavioral Traces**
     Replace "inert vs. legible" with **"communicative intent" vs. "systemic patterning"**:
     - **Communicative Residues**: Objects created *explicitly to convey meaning* to an audience (seals, inscriptions, standardized weights). These presuppose shared rules.
     - **Systemic Patterning**: Material patterns emerging from repeated behavior (faunal profiles, site structures, isotopic signatures). These reflect *regularities* but not necessarily codified rules.

     This avoids implying inert residues are "meaningless" while clarifying their evidentiary limits.

  ### 2. **Restrict "Institutions" to Codified Structures**
     Narrow your claim to **formally representable institutions**:
     > "Only communicative residues can evidence *explicitly codified rules*—those requiring collective recognition and transmission. Systemic patterning reveals *normative practices* (habits, expectations) but not necessarily institutionalized rules."

     **Example defense**:  
     - Cattle bones showing non-local women *could* indicate matrilocality as a practice.  
     - But claiming a *matrilocal marriage institution* requires evidence of its explicit recognition/enforcement (e.g., marriage contracts, kinship iconography).  
     - The inference leap from practice to rule conflates *regularity* with *codification*.

  ### 3. **Concede Ground on Non-Codified Normativity**
     Acknowledge that systemic patterning reveals **embodied norms**:
     - House plans → expectations of household composition  
     - Deliberate deposits → ritual conventions  
     - Storage capacity → economic planning norms  
     This avoids processualist skepticism while maintaining:  
     > "Such norms become 'institutions' only when participants recognize them *as rules*—a step requiring communicative representation."

  ### 4. **Address the "Ritual as Residual" Problem**
     Reject the category "ritual/symbolic" as a catch-all:  
     - **Key move**: Treat communicative intent as *empirically identifiable*, not assumed.  
       - *Example*: A reused heirloom pot in a foundation deposit = communicative (it "quotes" past acts).  
       - Animal bones in a ditch = systemic (unless arranged iconographically).  
     - **Avoid**: Saying "when behavior isn’t functional, it’s ritual." Instead: "When patterning shows intentional semiosis, it’s communicative."

  ### 5. **Strengthen the "Representability" Argument**
     Refine your logical step:  
     > "Rules *that require coordination across strangers/distance/time* must be representable. Systemic patterning alone cannot distinguish between:  
     > (a) A binding rule ("marry outside the clan") vs.  
     > (b) Emergent practice (women move due to resource scarcity).  
     Communicative residues resolve this by showing the rule was *made explicit*."

  ### 6. **Engage Your Critic Constructively**
     For your archaeologist respondent:  
     - **Validate**: "Systemic data *constrains* institutional possibilities (e.g., aDNA rules out patrilocality)."  
     - **Challenge**: "But without communicative traces, can we distinguish a 'bride-exchange system' from female mobility driven by ecological factors?"  
     - **Propose**: "Your ceramic typologies *might* become communicative if standardised motifs mark clan identities—but we’d need evidence of intentional messaging."

  ### Suggested Seminar Structure
  1. **Frame the Issue**:  
     "How do we know when patterned behavior reflects a rule versus a habit?"  
  2. **Present Your Cases**:  
     - Communicative: Mesopotamian cylinder seals recording debt → direct evidence of institutions.  
     - Systemic: Your cattle bones/isotopes example → shows mobility, not rules.  
  3. **Defend the Boundary**:  
     "Codified rules require social storage (D. Childe)—which demands communicative tech."  
  4. **Preempt Objections**:  
     - "This isn’t about denying meaning, but about evidence thresholds for *formal* institutions."  
     - "Taphonomy/formation theory ground systemic inferences—but they can’t extract unrepresented rules."  
  5. **Bridge to Anthropology**:  
     "In non-literate societies, institutions are maintained orally/performatively. But without *materialized* communication, they leave no direct trace. Our inferences must be proportionate."

  ### Why This Works
  - **Avoids underdetermination overreach**: You accept robust behavioral inferences (bridged by formation theory).  
  - **Saves normativity**: Practices/norms are recoverable; only *codified* institutions require higher evidence.  
  - **Defangs the "ritual" critique**: Communicative intent is argued case-by-case, not presumed.  
  - **Historically grounded**: Aligns with work on early institutions (e.g., Garfinkel on storage, Scott on legibility).

  This preserves your skepticism about Neolithic "institutions" while acknowledging archaeology’s power to reconstruct social expectations. The crux becomes: **Systemic patterning reveals *what people did*; communicative residues reveal *what they agreed they should do*.**
