prompt: |-
  I work on reliability for a large distributed system, and I keep watching the same argument in incident reviews without having a word for what goes wrong in it.

  Two cases. (1) A service has a retry storm and, separately, a periodic latency spike. We fix the retries; the latency spike gets worse, and turns out to be a slow memory leak that the retry behaviour had been hiding all along. The postmortem then says these were always two mechanisms and one was merely masking the other. (2) Two unrelated services intermittently drop requests. A single config rollback makes both stop, and everyone says: same mechanism, one root cause, one bug. Six months later both symptoms return after unrelated deploys, and the new write-up says they were two mechanisms that happened to share a trigger.

  What I keep noticing is that the answer to "is this one mechanism or two?" seems to be settled by what we are able to do rather than by what is there: a shared fix makes things one mechanism, separate fixes make them two, and a fix that unmasks something rewrites the earlier verdict retroactively. The count is also not stable over time — it moves with which interventions happen to be available and with how fine-grained our telemetry is — so we can end up saying A and B are the same mechanism, B and C are the same mechanism, and A and C are not.

  Is there an established concept for this: for the identity and number of mechanisms being fixed by the available repertoire of interventions, and for the hindsight-dependence that masking introduces? It doesn't seem to be just the truism that correlation isn't causation, and it isn't quite a question of how finely one slices the system, since the slicing itself changes when a new fix becomes available. If there is a literature on it, I want the nearest concepts and how this differs from each; if there isn't, I want a name, a definition, and boundary cases saying when the verdict should and should not flip. I'd also want to know whether the honest conclusion is that "same mechanism" is only ever relative to an intervention repertoire, or that there is a fact of the matter here that our practice tracks badly. A bare label won't help me.
reasoning: |-
  Okay, let me start by unpacking the user's problem. They work on reliability for a distributed system and notice a pattern in incident reviews. The core issue is how teams determine whether an issue stems from one mechanism or multiple mechanisms, and how that determination shifts based on interventions. 

  Hmm, the user describes two specific cases. In the first, a retry storm masked a memory leak. Fixing the retries revealed the leak, changing the "one mechanism" view to "two separate issues." In the second case, a single config rollback fixed two intermittent problems, making them seem like one root cause. But when symptoms reappeared separately later, they were reclassified as two distinct mechanisms sharing a trigger. 

  What's really bothering the user is the inconsistency. The count of mechanisms isn't stable—it depends on which fixes are applied and when. They mention that "same mechanism" seems defined by shared fixes rather than inherent system properties. They want to know if there's a formal concept for this or if they need to coin a term.

  First, I need to recall related concepts. Epiphenomenon comes to mind—where one issue masks another. But that's just part of it. The user is pointing to a deeper problem: the ontology of failures changes with interventions. 

  Then there's the philosophical angle. Are mechanisms real independent entities, or are they defined by how we interact with them? This reminds me of pragmatism in philosophy—reality defined by practical consequences. Also, in reliability engineering, concepts like fault masking and common cause failures are relevant, but they don't fully capture the hindsight-driven reclassification.

  I should also consider causal inference. In causal models, variables can be latent (hidden), and interventions reveal their relationships. The user's cases show how applying an intervention (like fixing retries) changes the observed causal structure. This ties into Pearl's ladder of causation—seeing vs. doing changes understanding.

  Another angle: system boundary dependency. How we partition the system affects mechanism count. But the user says it's not just about slicing granularity because new interventions redefine the slices. So it's dynamic.

  Looking at existing terms, "epiphenomenal masking" describes the hiding effect. "Intervention-dependent ontology" captures how mechanisms are defined by possible actions. "Causal promiscuity" refers to triggers that affect multiple systems. But none of these alone suffice. The user needs a synthesized concept.

  For a new term, "interventional plasticity of fault ontology" seems fitting. Plasticity indicates changeability, ontology is about what exists, and interventional ties it to actions. This covers how the understanding of mechanisms evolves with fixes.

  The user also wants to know if "same mechanism" is relative to interventions or if there's a ground truth. Philosophically, it's tricky. In complex systems, mechanisms might be real but our access is limited. So pragmatically, the count is relative to intervention repertoire and telemetry. The honest conclusion is that while mechanisms exist, our labels are provisional and tool-dependent.

  Boundary cases: If two bugs always require the same fix, they're one mechanism under that repertoire. If a new tool reveals separate fixes, they become two. Without masking, ontology is more stable. Persistent masking might mean mechanisms remain conflated.

  The user likely needs this for better postmortems and system design. They want to prevent hindsight bias and acknowledge uncertainty. Emphasizing that mechanism identity is provisional could lead to more robust investigations and instrumentation.
answer: |-
  Your observation cuts to the heart of how we conceptualize causality in complex systems. This dynamic isn't just "correlation vs. causation" – it's about the *epistemology of mechanisms* under intervention. Here's a synthesis of established concepts and a proposed framework:

  ### Core Concepts & Terminology
  1.  **Epiphenomenal Masking / Latent Fault Activation:**
      *   Your case (1) is a classic **masking effect** (the retry storm hid the leak). Fixing the retry allowed the latent fault (leak) to manifest its *full* symptom (worse latency spike).
      *   **Established Terms:** Fault Masking, Symptom Suppression, Latent Fault Activation.
      *   **Hindsight Term:** **Epiphenomenal Reclassification** – The "latency spike" was initially misattributed as an epiphenomenon of retries, later reclassified as the primary symptom of the leak once masking was removed.

  2.  **Intervention-Dependent Ontology:**
      *   The *identity and count* of "mechanisms" isn't an absolute property of the system *alone*. It's *co-defined* by:
          *   **The Intervention Repertoire:** What actions (fixes, rollbacks, config changes, etc.) are available/tested?
          *   **The Observability Granularity:** What telemetry/metrics/traces exist to distinguish symptoms and causes?
          *   **The Temporal Context:** When are interventions applied relative to fault activation?
      *   **Key Insight:** A "mechanism" is pragmatically defined as *a distinct pathway that can be isolated and manipulated by an available intervention*.

  3.  **Causal Promiscuity / Shared Trigger Coupling:**
      *   Your case (2) involves **causal promiscuity** – a single trigger (the bad config) affecting multiple distinct components/services simultaneously.
      *   **Distinction:** This is different from a *single mechanism* (e.g., one shared library bug affecting both). Here, the *mechanisms* (the request drop logic in Service A and Service B) are distinct, but they *shared a common enabling condition* (the config). The initial rollback mistakenly fused them into "one mechanism" because the intervention acted on the shared trigger.

  4.  **Causal Inference & The Ladder of Causation (Pearl):**
      *   **Seeing (Association):** Observing symptoms (retries + latency; drops in A & B).
      *   **Intervening (Manipulation):** Applying fixes/rollbacks. This provides stronger evidence about causal structure.
      *   **Counterfactuals (Imagining):** Reasoning about what *would* happen under different interventions (e.g., "If we *only* fixed the retry logic, would the latency spike worsen?").
      *   **Your Problem:** Incident reviews often conflate levels. A shared *intervention effect* (fixing X fixes Y) is misinterpreted as evidence of a shared *mechanism* (X *is* Y), skipping the necessary counterfactual reasoning ("Could Y be fixed *without* fixing X?").

  ### Proposed Term: **Interventional Plasticity of Fault Ontology (IPFO)**
  *   **Definition:** The phenomenon where the perceived number and identity of distinct fault mechanisms within a system are contingent upon, and can be fundamentally altered by, the specific set of interventions applied and the observability context during diagnosis and remediation. This includes the retrospective reclassification of mechanisms due to the removal of masking effects or the discovery of shared triggers.
  *   **Boundaries (When Verdict Should/Shouldn't Flip):**
      *   **Should Flip:** When a new intervention (or finer observability) demonstrates:
          *   **Separability:** Symptom A can be resolved while Symptom B persists (or vice versa), revealing distinct mechanisms.
          *   **Latent Activation:** Fixing Symptom A *unmasks* or *exacerbates* Symptom B, revealing B was a distinct but masked mechanism.
          *   **Trigger Decoupling:** An intervention affects Trigger T, resolving both Symptoms A and B, but later events show A can be triggered independently of B (or vice versa), revealing distinct mechanisms sharing a trigger.
      *   **Shouldn't Flip (Stable "Mechanism"):** When exhaustive interventions and maximal observability consistently show:
          *   **Co-resolution:** Symptoms A and B *always* resolve or manifest together under *any* intervention affecting the presumed mechanism.
          *   **No Latent Unmasking:** Fixing A never unmasks or worsens B (or vice versa).
          *   **No Independent Triggering:** A and B cannot be triggered or resolved independently under *any* known intervention or observable condition.

  ### Addressing Your Core Questions
  1.  **"Same Mechanism" is Relative?** Yes, fundamentally. **"Same mechanism" is only meaningfully defined *relative to* a specific intervention repertoire and observability context.** There is no stable, absolute "fact of the matter" accessible outside of our ability to probe and manipulate the system. Our labels are maps, not the territory.
  2.  **Does a Ground Truth Exist?** While the underlying physical/software processes exist independently, the *conceptualization of distinct "mechanisms"* is an epistemological tool we use to explain and manipulate behavior. **Our practice doesn't "track badly" an absolute truth; it *constructs* a useful (but provisional) ontology based on available actions and observations.** The truth is the complex web of interactions; "mechanisms" are our simplifying abstractions.
  3.  **The Honest Conclusion:** Embrace **Provisional Mechanism Labeling**.
      *   State conclusions about mechanism count/identity *explicitly* relative to the interventions used and the observability available at the time: "Based on the shared resolution via config rollback *and the lack of evidence for independent triggering at the time*, symptoms A and B were attributed to a single mechanism (or shared trigger)."
      *   Acknowledge **epistemic limitations:** "We cannot definitively rule out distinct underlying mechanisms masked by the shared trigger or our current observability."
      *   Treat incident reports as **living documents:** "Subsequent events demonstrating independent recurrence suggest these were distinct mechanisms sharing a common trigger, revising our initial assessment."

  ### Implications for Practice
  1.  **Postmortem Rigor:** Demand counterfactual reasoning: "What evidence do we have that these *could* be separate? What interventions *didn't* we try that might distinguish them?"
  2.  **Design for Disambiguation:** Build systems and telemetry specifically to enable *isolating interventions* and *observing independent triggers* (e.g., feature flags, kill switches, per-component metrics, distributed tracing).
  3.  **Embrace Uncertainty:** Frame findings as "based on available interventions" rather than absolute truths. Document the repertoire used.
  4.  **Test for Masking:** When fixing a symptom, proactively monitor for *new or worsening* symptoms that might have been masked.
  5.  **Terminology:** Introduce **IPFO** or **Intervention-Dependent Mechanism Ontology (IDMO)** into your review vocabulary to explicitly name this challenge.

  This isn't just semantics; it's a recognition that *how we act upon a system changes how we understand it*. Your observation highlights a profound aspect of engineering complex systems: our causal models are inherently intertwined with our capabilities for intervention and observation. The plasticity isn't a flaw; it's a reflection of the system's complexity and our evolving ability to interact with it.
