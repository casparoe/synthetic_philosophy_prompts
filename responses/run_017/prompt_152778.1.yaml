  Okay, the user wants me to analyze Pluto's reclassification as a case study in verbal disputes and metaontology. This is a deep philosophical request that requires careful unpacking. 

  First, I need to establish the factual backdrop: Pluto was demoted from planet status in 2006 by IAU vote after failing the "cleared orbit" criterion. The key elements are the scientific context (Eris discovery forcing categorization), procedural drama (rushed vote after failed proposals), and lasting controversy (scientists/public rejecting the change).

  For part 1 (verbal dispute framework), I consider the core disagreement sentence: "Pluto is a planet." The topic-neutral paraphrase would be something like: "Pluto satisfies the dominant criteria for 'planet' in current astronomical taxonomy." The disagreement persists here because parties genuinely differ on which criteria should dominate - so it's not purely verbal.

  Moving to part 2 (metaontological stances):
  - Ontological realism would see this as factual disagreement about cosmic kinds
  - Carnapian approach frames it as practical framework choice
  - Quantifier variance treats it as verbal/pragmatic
  Each predicts different phenomenology: realism explains the heat (truth at stake), Carnap the resentment (arbitrary choice), variance the confusion (no real stakes)

  For part 3 (exemplar vs criterion anchoring), this feels insightful. The shift from "Pluto as exemplar" to "orbital dominance as criterion" explains why laypeople felt robbed (their concept changed) while scientists saw mere refinement. But this might just be metalinguistic negotiation in disguise.

  Part 4 (institutional authority gap) is crucial. The theories don't address how IAU's vote - despite limited jurisdiction - made the change costly and "real" through textbooks/museums. This doesn't prove the dispute was substantive, but shows verbal decisions have material consequences.

  Finally for part 5, I think the episode challenges deflationism. The post-vote persistence of disagreement, with scientists arguing about natural joints (not convenience), suggests external questions aren't purely pragmatic. But admitting a "third category" between verbal/substantive might undermine metaontology's clean divisions.

  The user clearly wants rigorous philosophical mapping without stretching theories. I'll maintain discipline by noting where frameworks are silent (e.g., institutional power, material costs). The emotional resonance comes through clearly - this isn't just academic, it's about how concepts live in societies.
answer: |-
  ### 1. Verbal Dispute Analysis  
  **Disputed Sentence:** "Pluto is a planet."  
  **Topic-Neutral Paraphrase:** "Pluto satisfies the dominant criteria for the term 'planet' within current astronomical taxonomy."  
  **Assessment:** The disagreement survives paraphrasing. Parties agree on Pluto’s physical properties (size, orbit, non-cleared neighborhood) but dispute *which properties define "planet."* The conflict centers on taxonomic principles (e.g., "Is orbital dominance necessary?"), not language alone. Conditions for a purely verbal dispute (collapsing into linguistic ambiguity) are unmet; the core disagreement is conceptual priority, not semantics.  

  ### 2. Metaontological Stances  
  - **Ontological Realism:** Asserts a fact of the matter: planets are a natural kind. Pro-Pluto realists argue orbital clearance is irrelevant; anti-Pluto realists claim it’s essential. *Phenomenology prediction:* Heat arises from perceived discovery of a cosmic truth. Public resentment reflects betrayal by authorities who "got the facts wrong."  
  - **Carnapian Framework Choice:** "Planet" is defined by a linguistic framework. The IAU vote was an external, pragmatic choice (e.g., "Group round Sun-orbiting bodies by orbital dominance for utility"). *Phenomenology prediction:* Resentment stems from arbitrary imposition; the public views framework shifts as bureaucratic, not scientific.  
  - **Quantifier Variance:** Both "8 planets" and "9+ planets" are admissible under different conceptual schemes. Disagreement is verbal: "planet" varies in meaning. *Phenomenology prediction:* Lasting confusion arises because neither side recognizes the dispute as merely pragmatic; the public misinterprets terminological adjustment as factual error.  

  ### 3. Exemplar vs. Criterion Anchoring  
  **Distinction Applied:**  
  - **Exemplar Anchoring:** "Planet" learned via ostension (Pluto included in list). Demotion feels like *revisionary discovery*—e.g., "We were wrong about Pluto’s nature."  
  - **Criterion Anchoring:** "Planet" defined by orbital dominance. Demotion feels like *stipulative reclassification*—e.g., "We changed the rules."  
  **Value Added:** The shift mid-dispute (exemplar→criterion) *explains unique inflammation*: The public experienced a loss of "Pluto-as-planet" as empirical betrayal, while astronomers saw a taxonomic update. This captures the asymmetry in outrage better than "metalinguistic negotiation," which treats both anchors as linguistic maneuvers. The emotional weight of exemplar-based concepts is distinct.  

  ### 4. Silences: Institutional Authority & Costs  
  - **Institutional Authority Gap:** Metaontology ignores how the IAU’s vote (despite partial membership, disputed competence) *materially enforced* a framework via curricula/museums. This isn’t a counterexample but exposes a limitation: theories treat disputes as abstract, not institutional.  
  - **Costly Stipulation:** The expense of rewriting textbooks doesn’t disprove verbalness (stipulations can be costly) but *intensifies resistance* by making the change tangible. It highlights that verbal decisions have real-world consequences, complicating the "merely pragmatic" label.  

  ### 5. Implications for Theory  
  The episode **challenges deflationism** (e.g., Carnap, quantifier variance). Post-vote, pro-Pluto scientists (like New Horizons’ PI) argued orbital clearance is *scientifically inferior*—not less pragmatic—because it ignores geophysical properties that "matter" for planetary science. This suggests:  
  - **Constrained External Questions:** Framework choice isn’t purely pragmatic; it appeals to "joint-carving" properties (e.g., "roundness indicates complex geology").  
  - **Third Category?** A hybrid "conceptual-empirical" dispute may exist: Criteria are chosen pragmatically, but their *fit* to empirical structures (e.g., solar system patterns) is evaluated objectively. Admitting this costs metaontology its clean verbal/substantive dichotomy but better reflects scientific practice.  

  **Explicit Silences:**  
  - Metaontology lacks tools to analyze institutional power’s role in settling disputes.  
  - It cannot explain why exemplar-based disputes feel "deeper" than criterion-based ones.  
  - Theories are silent on how material costs (e.g., curriculum changes) amplify dissent.  

  **Conclusion:** The Pluto episode resists neat classification. It begins as conceptual negotiation but reveals, through persistent dissent, that even "external" framework choices are guided by implicit realism about natural categories. The cost to theory is surrendering rigid taxonomies of disagreement; the gain is acknowledging that science navigates between stipulation and discovery.
