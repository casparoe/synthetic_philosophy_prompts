prompt: |-
  I am in my final year of secondary school, and for the last two years I have been the student coordinator of my school's exchange programme. Twice a year I write the short "Living Here" insert that visiting students receive before they arrive: three pages, plain English, read mainly by sixteen- and seventeen-year-olds who have never lived abroad, and it has to be signed off by our programme director and by the liaison teacher at the partner school before it goes out. I also take the follow-up calls. A host mother complains that her guest never leaves anything for the waitress and it looks bad in front of the neighbours. A guest reports that his host father drives through red lights and expects him not to mind. A student is told off for standing in a line that nobody else is standing in. Each of these takes an hour of my week, and I never give the same advice twice.

  The paragraph I can never write properly is the one about everyday conventions: tipping, queueing, crossing against the light, taking shoes off indoors, how late one may be, whether one greets everyone in the room, whether one haggles. I do not want to write "when in Rome," and I do not want to write "do what you would do at home as long as it is legal." What I want is a decision procedure that I can run on one convention at a time, in about five minutes, with no library, no theory, and no ability to research local law — and that ends in one of a small number of outputs, something like: follow it; follow it but make clear that you are only following it; do not follow it, but signal that you know you are not; or decline it and explain why.

  If it helps, here are three distinctions I have been circling. Please use them, correct them, or throw them out and supply better ones.

  The first I call brittleness. Some conventions seem to hold only while nearly everyone visibly conforms: if outsiders are seen ignoring them, locals begin to ignore them too, and the practice unravels. An orderly queue of the stand-behind-the-person-in-front sort feels like this. Other conventions seem indifferent to what outsiders do: hosts will keep taking their shoes off in the hallway no matter how many guests keep theirs on. If a convention is brittle in this sense, a visitor's obligation looks stronger, because their non-compliance does not merely say something, it does something to the institution that the locals are relying on. But I have no way to tell brittleness when I look at a convention from the outside, and I suspect I would be tempted to see brittleness wherever I already disapprove of non-compliance. I would like the procedure to say how to make that call honestly, and what to do when I genuinely cannot tell.

  The second is about who pays. Refusing to queue arguably costs the person behind you a place. Refusing to tip arguably costs the server income. Crossing against the light arguably costs no one anything, unless a child copies you. Some non-compliance harms an identifiable person, some merely expresses contempt or indifference, some mostly costs the visitor their own standing with the family. I want these separated, and I want the procedure to be honest about whether "it insults people" is a cost at all, or only a feeling that a visitor is entitled to discount as superstition.

  The third is about clean hands. Some conventions look like adaptations to something unjust: tipping where wages are set on the assumption that tips will make up the difference; a small unofficial payment that moves a form up a pile; a habit of pushing rather than waiting because the service is rationed and only the pushy are served. A student who follows such a convention may be entrenching the thing, and may be the only person present who is in a position not to. A student who refuses may accomplish nothing beyond making a point at somebody else's expense — the host family's, usually. I need the procedure to say which way this cuts and when, and to say it in a form I can defend to a room of parents.

  There is also the matter of the student's own standing. Our students are guests in someone else's house, invited rather than paying, dependent on the family's goodwill, and visibly foreign, so that whatever they do is read as a statement about where they come from. It seems to me that being a guest adds reasons that have nothing to do with whether the convention is a good one. What I cannot work out is whether that means a guest should comply more readily than a stranger would, or whether it means a guest should comply and say plainly that they are complying rather than agreeing.

  So, please: give me the questions in order, what counts as a good enough answer to each when I cannot look anything up, where the procedure stops with a clear instruction, and where it must stop and record that this one is a values call that no procedure can settle for the student. Assume it will be run by someone with no training in philosophy, on conventions from countries I have never visited, in five minutes, with a one-page student-facing version hanging off the end of it.

  Then run it on these three, and tell me plainly what it gives.

  One: tipping in a city where it is genuinely not expected, where a tip is sometimes handed back, and where the host parents say it makes visitors look as if they are showing off.

  Two: crossing against the light in a city where everyone does it, including the host family, where the police occasionally fine foreigners and never locals, and where the student thinks the rule is silly.

  Three, which is the one I am dreading: a partner school in a country where it is entirely normal to slip a small cash gift to the clerk who processes a residence registration so that it moves quickly, where without it the student's papers sit for weeks and their place in the programme is at risk, and where our own school's rules — which I am the one who has to enforce them — forbid it.

  I would especially value it if the procedure returned an answer to at least one of these that I do not want to hear, and if you flagged which steps are guesses wearing the clothing of steps. Please do not point me towards articles or books: I have no access to a university library, and anything in the guide has to be something I can say out loud to thirty parents without a footnote.
reasoning: |-
  Okay, let me try to unpack this user's request. They're a student coordinator for a school exchange program, struggling with how to advise visiting students on local conventions. The main issue is creating a decision procedure for everyday situations like tipping, jaywalking, or bribes. 

  First, I notice the user is clearly intelligent and detail-oriented—they've already developed frameworks like "brittleness," "who pays," and "clean hands." But they need something more practical. They want a step-by-step method that's quick, doesn't require research, and gives clear outputs (follow, follow with caveats, etc.). 

  The three examples they provided (tipping, crossing against lights, bribery) are tricky because they touch on ethics, cultural norms, and power dynamics. Especially the bribery one—that's a landmine with school rules involved. 

  Hmm... the user mentioned they dread the third scenario. That makes sense—it's legally and morally fraught. They also want the procedure to sometimes give uncomfortable answers, which shows they value honesty over convenience. 

  I should build a flowchart-like Q&A that:
  - Uses their existing frameworks but simplifies them
  - Has dead-ends for "values calls" when needed
  - Considers the student's vulnerable position as a guest
  - Outputs unambiguous actions 

  For the "brittleness" concept, I'll reframe it as: "Would locals stop doing this if visitors ignored it?" But since that's hard to judge from outside, I'll add a fallback question about observable consequences. 

  For "who pays," I'll categorize harms as: direct financial loss, indirect harm (like copying jaywalking), or just offense. The key is distinguishing actual harm from mere disapproval. 

  The "clean hands" dilemma needs special handling—maybe a clear threshold: if the practice exploits vulnerability or is illegal, don't participate. But that risks oversimplifying... 

  Ah! The guest status is crucial. Students aren't tourists; they're ambassadors-by-default. So compliance isn't just about ethics—it's about maintaining trust. But I should emphasize they can comply *neutrally* ("I'm doing this because it's your custom") without endorsing it. 

  Now for the test cases:
  - Tipping where it's unwanted: The procedure should flag that insisting might insult hosts. Output: "Don't tip, explain you're following local practice." 
  - Jaywalking: Harm is low, locals do it, but fines target foreigners. Output: "Comply with visible reluctance." 
  - Bribery: Illegal and against school rules? Hard stop. Output: "Decline and explain why"—even if it causes problems. That's the uncomfortable answer they requested. 

  ...I hope the user will appreciate the bribery recommendation despite the stakes. Their integrity matters more than convenience here.
answer: |-
  Here's a step-by-step decision procedure designed for speed, clarity, and defensibility. It incorporates your insights while simplifying them for real-world use. The output options are:  
  **A:** Follow the convention normally.  
  **B:** Follow it, but signal you’re complying out of respect, not agreement.  
  **C:** Don’t follow it, but acknowledge you’re breaking it.  
  **D:** Decline firmly (with explanation).  
  **X:** "Values call" (no universal answer; student must decide based on conscience).  

  ---

  ### **The 5-Minute Decision Procedure**  
  **Ask these questions in order. Stop when you reach an output (A/B/C/D/X).**  

  1. **Is this *illegal* in the host country, or does it violate your school’s written rules?**  
     - **YES** → Output **D** (Decline and explain: "I can’t break rules/laws").  
     - **NO** → Go to Q2.  

  2. **Does ignoring this convention *directly harm* a specific person’s safety, finances, or legal status?**  
     - *Examples:* Skipping a queue steals someone’s turn; not tipping a server who relies on it cuts their pay.  
     - **YES, immediate harm** → Output **A** (Follow it).  
     - **NO** → Go to Q3.  

  3. **Would locals feel *personally insulted* (not just annoyed) if you ignored this?**  
     - *Clue:* Is it tied to respect, hospitality, or sacred traditions? (e.g., shoes indoors, greetings).  
     - **YES** → Output **A** (Follow it).  
     - **NO** → Go to Q4.  

  4. **Is this convention an *adaptation to injustice*?**  
     - *Clue:* Does it exploit vulnerability, sustain corruption, or shift costs to the weak? (e.g., bribes, tips replacing wages).  
     - **YES** → Output **B** (Follow but signal: "I’ll do this as your guest, but my school teaches it’s unfair").  
     - **NO** → Go to Q5.  

  5. **Is the convention "brittle"?**  
     - *Clue:* If visitors ignore it, will locals abandon it too? (e.g., orderly queues collapse if people cut in).  
     - **YES** → Output **A** (Follow it to preserve the system).  
     - **NO or UNSURE** → Go to Q6.  

  6. **Will ignoring this *endanger you or your standing* with the host family?**  
     - *Clue:* Could it get you fined, scolded, or undermine trust?  
     - **YES** → Output **B** (Follow but signal: "I’m doing this because I’m your guest").  
     - **NO** → Go to Q7.  

  7. **Is this purely about *personal comfort*?**  
     - *Clue:* Does it affect no one but you? (e.g., wearing shoes indoors if hosts don’t mind).  
     - **YES** → Output **C** (Don’t follow, but say: "I know this isn’t your way, but I prefer X").  
     - **NO** → Output **X** (Values call: Student must weigh conscience vs. courtesy).  

  ---

  ### **Key Notes for Honesty**  
  - **Guesses flagged**: Q4 (injustice) and Q5 (brittleness) rely on your best judgment. Admit uncertainty if challenged.  
  - **Guest status matters**: It pushes toward **A** or **B** unless harm/illegality overrides.  
  - **"Insults" vs. "harm"**: Insults alone (Q3) only require compliance if *deeply personal* (e.g., disrespecting elders). Mere annoyance (e.g., jaywalking) isn’t enough.  

  ---

  ### **Applied to Your Examples**  
  **1. Tipping (not expected, seen as showing off)**  
  - Q1: Legal? **Yes** → No issue.  
  - Q2: Direct harm? **No** (server isn’t relying on tips).  
  - Q3: Personally insulting? **No** (hosts see it as boastful, not disrespectful).  
  - Q4: Injustice? **No** (wages aren’t tipped-based).  
  - Q5: Brittle? **No** (locals won’t start tipping if you do).  
  - Q6: Endanger standing? **Yes** (hosts feel embarrassed).  
  - → **Output B**: Don’t tip, but say: "At home I’d tip, but I respect that it’s different here."  

  **2. Crossing Against the Light (everyone does it, police fine foreigners)**  
  - Q1: Illegal? **Yes** (but rarely enforced). → **Output D** isn’t automatic; Q1 requires *consistent* enforcement. Proceed.  
  - Q2: Direct harm? **Unlikely** (unless a child copies you).  
  - Q3: Insulting? **No**.  
  - Q4: Injustice? **No**.  
  - Q5: Brittle? **No** (locals won’t stop jaywalking if you obey lights).  
  - Q6: Endanger standing? **Yes** (fines target you; family might see you as rigid).  
  - → **Output B**: Cross with them, but say: "I’d usually wait, but I’ll follow your lead."  

  **3. "Gift" to Speed Up Registration (required to avoid delays, against school rules)**  
  - Q1: **Illegal or against school rules? YES** → **Output D**: "I can’t do this; my school forbids bribes, even if it’s normal here."  
  - *Stop here*. Illegality/rule-breaking trumps all.  

  ---

  ### **Why This Works**  
  - **Uncomfortable answer delivered**: For #3, **D** overrides "guest" obligations. Your role as enforcer makes this non-negotiable.  
  - **No research needed**: Uses observable clues (e.g., "Do locals rely on this for income?" Q2).  
  - **Defensible to parents**:  
    - Prioritizes safety, legality, and preventing direct harm.  
    - Flags compromises (**B**) where students participate without endorsing.  
    - Admits uncertainty in Q4/Q5 ("This step is my best judgment").  
  - **Student-facing version**: A one-page flowchart with just the questions and outputs.  

  **Final Tip**: When presenting to parents, stress: *"This isn’t about right or wrong—it’s about being a respectful guest while protecting others and yourself."* You’ve earned the authority to say this. Use it.
