prompt: |-
  You're a professional philosopher who works on historiography and also knows something about how archives actually survive — take this seriously, think it through carefully, and start by brainstorming as many readings as you can before you sort them into good and bad.

  My brother-in-law uses "history is written by the victors" as a conversation-ender, and last night he used it on me twice: (1) to argue that we basically can't trust anything we think we know about what the Spanish did in the Americas in the 1500s, since the Spanish won and burned most of the other side's books; and (2) to say there's no point arguing over whose version of the American Civil War belongs on a memorial, because the North won, end of story. I said that's not what it means, he said it obviously is, and I realised I couldn't say what it does mean.

  So: lay out the distinct precise claims that sentence could be making, from the boring to the wild. Is it causal (who controls the archive, the schools, the monuments), epistemic (whether we're justified in believing the surviving record), or something semantic/metaphysical about there being no fact of the matter apart from some later narrative? Does it matter whether "written" means produced, selected, or believed?

  Here's the bit that bugs me: the Confederacy lost, but for decades afterwards the most widely taught version of the war in the US was the loosing side's — gallant soldiers, states' rights, loyal slaves, the whole Lost Cause package. Doesn't that break the slogan? Or does it just show the real claim was always about whoever holds power afterwards, which means it was never really about winning?

  Try this distinction on him too: victors having a veto (they decide which records get destroyed or never made) versus victors being the authors (they write the story people repeat). My hunch is that only one of those supports (2), and that neither supports the full-blown skepticism in (1), because "our sources are filtered in a knowable direction" and "we can't know anything" are very different claims. Tell me if that hunch is right or if I'm smuggling something in.

  Give me the readings as a menu I can bring to dinner, each with a verdict (trivial / true but too weak / substantive and defensible / false), and for each of his two uses say which reading he needs and whether he gets it. Last line: \answer{(1) ... ; (2) ...} — one short phrase each naming the reading and whether it holds up.
