answer: |-
  Here's a philosophical breakdown of "history is written by the victors," tailored for your dinner debate. I've categorized readings by their claims, strength, and relevance to your cases.

  ---

  ### **Readings of "History is Written by the Victors" (Categorized & Verdicts)**  
  *Key dimensions: "Written" = Produced? Selected? Believed? | Scope: Causal, Epistemic, Semantic*  

  | **Reading** | **Precise Claim** | **Verdict** | **Why?** |
  |-------------|-------------------|-------------|----------|
  | **1. Archival Control** | Victors physically preserve/destroy sources (e.g., burn records, seize archives). | **True but too weak** | Explains gaps but doesn’t determine *interpretation*. Survivor bias ≠ victor narrative. |
  | **2. Narrative Dominance** | Victors fund monuments, textbooks, and state rituals, promoting their perspective as "official." | **Substantive and defensible** | Power shapes public memory. But: contested, nonlinear, and losers can resist (e.g., oral histories). |
  | **3. Epistemic Hegemony** | Victors control institutions (schools, media), making their version *believed* by future generations. | **Mixed: True contextually, false universally** | Requires sustained power (e.g., postwar USSR). Fails where power fragments (e.g., Reconstruction South). |
  | **4. Ontological Claim** | There *is no history* beyond the victor’s narrative; "facts" are constructed by power. | **False (self-refuting)** | If true, the slogan itself is just a victor’s fiction. Ignores archaeology, cross-cultural evidence, and counter-narratives. |
  | **5. Selection Bias** | Victors curate which events/voices enter the historical record (e.g., erasing dissent). | **Substantive and defensible** | Archival gatekeeping is real. But historians correct for bias via methodology (sourcing, corroboration). |
  | **6. Causal Determinism** | Military victory *automatically* ensures control over historical memory. | **False** | Your Lost Cause example refutes this: losers won cultural battles for decades via NGOs, schools, and ideology. |

  ---

  ### **Applying the Readings to Your Brother-in-Law’s Claims**  
  **(1) Spanish Colonial Records ("We can’t trust anything")**  
  - **His reading:** *Epistemic Hegemony + Ontological Claim* (victors destroyed sources → total skepticism).  
  - **Why it fails:**  
    - Mesoamerican codices survived (e.g., *Codex Mendoza*).  
    - Spanish friars (e.g., Sahagún) recorded Indigenous accounts against colonial interests.  
    - Archaeology, linguistics, and Indigenous oral traditions provide counter-evidence.  
  - **Verdict:** His skepticism relies on Readings #3 and #4, which collapse under archival/critical scrutiny. **Sources are filtered but not erased.**  

  **(2) Civil War Memorials ("No point arguing, North won")**  
  - **His reading:** *Causal Determinism* (victors dictate memory).  
  - **Why it fails:**  
    - **Lost Cause proved the opposite:** Confederates (losers) dominated memorials, textbooks, and films until the 1960s via groups like UDC and Hollywood.  
    - **Power ≠ Victory:** Postwar power resided in *white Southern elites + Northern allies* – not the Union army.  
    - **Your veto vs. authorship distinction is critical:** The North "vetoed" slavery but didn’t "author" memory until Civil Rights activism.  
  - **Verdict:** He needs Reading #6, but history shows #2 (Narrative Dominance) applies only when victors *maintain cultural power* – which the Union did not.  

  ---

  ### **Your Hunches: Valid**  
  - **"Veto vs. Authorship":** Spot on. Victors can *suppress* records (veto) but not necessarily *write* the story. The Lost Cause was authored by losers with persistent influence.  
  - **"Filtered ≠ Unknowable":** Correct. Historians treat bias as a *problem to solve*, not a dead end. We reconstruct via:  
    - **Counter-archives** (e.g., slave narratives, Indigenous petitions).  
    - **Material evidence** (e.g., soil analysis of encomienda sites).  
    - **Comparative historiography** (e.g., Spanish vs. Nahuatl chronicles).  

  ---

  ### **Dinner Menu for Your Brother-in-Law**  
  Serve these talking points:  
  1. **Lost Cause Paradox:** "If victors write history, why did the *losers* write the dominant Civil War narrative for 100 years? Maybe it’s about **who holds power after the war**, not who won battles."  
  2. **Spanish Archives:** "Yes, Spaniards burned Aztec codices – but we still have Indigenous voices from trials, church records, and Aztec descendants’ lawsuits. **Absence isn’t silence.**"  
  3. **The Slogan’s Fatal Flaw:** "If ‘history is written by victors’ were *always* true, we couldn’t even know it was true! The fact we debate it proves history is contested, not dictated."  

  \answer{(1) Epistemic fatalism — false; (2) Causal determinism — false}
