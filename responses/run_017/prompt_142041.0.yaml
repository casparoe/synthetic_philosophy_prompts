  ### Game Setup: "The Card Conundrum"

  **Objective:** Students experience the problem of logical omniscience viscerally by revealing incoherent probability assignments through a betting market, then debate whether failures stem from irrationality or resource constraints.

  #### **Structure**  
  - **Players:** 14 students.  
  - **Initial Points:** 100 points each (virtual currency).  
  - **Core Mechanic:** Students bet on 10 propositions about a **face-down card** drawn from a standard 52-card deck. Propositions are layered to expose logical dependencies.  
  - **Scoring:** Quadratic scoring rule (strictly proper) scaled to 100 points per proposition:  
    - If proposition true: `Score = 100 × [1 - (1 - p)^2]`  
    - If false: `Score = 100 × [1 - p^2]`  
    (e.g., assigning `p=1` to a true proposition yields 100; `p=0.5` yields 75 if true, 75 if false).  
  - **Resource Purchases (Wrinkle):** Students spend points mid-game for:  
    - **Extra Time (10 pts):** +2 minutes to think.  
    - **Calculator (5 pts):** Compute probabilities (e.g., 13/52).  
    - **Peer Notes (15 pts):** View one other student’s bets for 2 minutes.  
  - **Final Score:** Sum of proposition scores minus points spent.  

  ---

  ### **Propositions (Layered Design)**  
  *Disguised to reveal failures of logical omniscience. Card = drawn card.*  

  1. **Immediate (no deduction):**  
     - P1: The card is a heart.  
     - P2: The card is red.  
     - P3: The card is a face card (J/Q/K).  

  2. **Disguised Equivalences (require 1 step):**  
     - P4 (≡ P1): The card is a red card and not a diamond.  
     - P5 (≡ P2): The card is not a spade and not a club.  

  3. **Tautologies (obscured):**  
     - P6: The card is red or black.  
     - P7: The card is a heart or not a heart.  
     - P8: If the card is a heart, then it is red.  

  4. **Multi-step Inferences (3–4 steps):**  
     - P9: The card is a heart only if it is not a non-heart.  
     - P10: The card is black or a heart if and only if it is not a diamond.  

  ---

  ### **Game Flow (90 mins)**  
  1. **Setup (5 mins):**  
     - Draw one card face-down (e.g., 7♦).  
     - Distribute proposition list. No lecture—just rules.  

  2. **Betting Phase (20 mins):**  
     - Students assign probabilities (0.0–1.0) to each proposition.  
     - **Resource Purchase:** At any time, students spend points for extra tools (e.g., buy calculator to compute P(face card) = 12/52).  

  3. **Revelation & Scoring (10 mins):**  
     - Reveal the card. Calculate scores automatically (spreadsheet).  

  4. **Dutch Book Audit (15 mins):**  
     - Display aggregate bets. Show incoherences:  
       - *Example 1:* Student assigns P(P1) = 0.8 but P(P4) = 0.6 (equivalent claims).  
       - *Example 2:* Student assigns P(P1) = 0.7 > P(P6) = 0.6 (P1 entails P6).  
     - Calculate sure losses (e.g., "If you sold P4 and bought P1, you’d lose 0.2 points regardless of the card").  

  5. **Discussion (20 mins):**  
     - Students form small groups to defend their bets. Prompt: *"Were you irrational before buying resources, or just resource-poor?"*  

  ---

  ### **Debrief: Mapping to Logical Omniscience**  
  After the game, reveal how moments map to formal epistemology:  

  #### **1. Closure Under Logical Consequence (Failure = Dutch Book)**  
  - **P1 → P6 (P1 entails P6):**  
    - *Moment:* Students assign P(P1) > P(P6).  
    - *Problem:* Violates monotonicity (if A ⊨ B, P(A) ≤ P(B)).  
    - *Debrief:* "If you believe the card is a heart, you must believe it’s red or black. Why didn’t you?"  

  #### **2. Tautologies (Failure = P < 1)**  
  - **P6, P7, P8 (tautologies):**  
    - *Moment:* Students assign P < 1 (e.g., P(P6) = 0.95).  
    - *Problem:* Tautologies should have P = 1.  
    - *Debrief:* "You knew P6 *must* be true—why not bet 100%?" Maps to "believing all tautologies."  

  #### **3. Logical Equivalence (Failure = P ≠ for same fact)**  
  - **P1 ≡ P4 (same fact, different syntax):**  
    - *Moment:* Students assign P(P1) = 0.8, P(P4) = 0.6.  
    - *Problem:* Equivalent propositions demand equal probability.  
    - *Debrief:* "P1 and P4 are identical—why different prices?"  

  #### **4. Resource-Bounded vs. Normative Failure**  
  - **Resource Purchases:**  
    - Students who bought tools often fix incoherences (e.g., use calculator to see P(P6) = 1).  
    - *Debrief:* "If extra resources fixed your bets, was your initial failure *rational*? Or is logical omniscience too strict a norm?"  
    - **Philosophical Fork:**  
      - *Patching Models (e.g., impossible worlds):* "Maybe there’s a world where hearts aren’t red!"  
      - *Rejecting the Norm:* "Should we demand closure if it’s computationally impossible?"  
      - *Resource-Bounded Reply:* "Agents aren’t irrational—they’re optimizing under constraints."  

  ---

  ### **Predictable Pitfalls (First Run)**  
  1. **Chaos in Betting:** Students overlook layered equivalences (P1/P4) or tautologies (P8). Expect 70% to assign P(tautology) < 1.  
  2. **Resource Misuse:**  
     - *Overinvestment:* Anxious students spend heavily on notes/calculator but gain little.  
     - *Underinvestment:* Confident students skip resources, then lose on Dutch books.  
  3. **Scoring Confusion:** Some struggle with quadratic scoring—provide a cheat sheet.  
  4. **Time Crunch:** Tautologies (P9/P10) rarely get P=1; students focus on "interesting" bets (P1–P3).  

  ---

  ### **What the Game Can’t Capture**  
  - **Speed vs. Omniscience:**  
    The game **empirically shows slowness**, but the **philosophical problem** is deeper: even with infinite time, undecidable truths (e.g., in Peano arithmetic) defy closure. Use this to distinguish:  
    - *Empirical:* "We’re slow."  
    - *Normative:* "Should we *expect* agents to believe all consequences?"  
  - **Complex Tautologies:**  
    P9–P10 are simple; real logical omniscience fails for propositions requiring induction (e.g., "this long proof is valid").  
  - **Syntax vs. Semantics:**  
    Students *know* P1 ≡ P4 but bet differently—this mirrors syntactic belief (fixable with effort). True logical omniscience fails even for agents who grasp semantics.  

  ---

  ### **Why It Works**  
  Students **feel** the Dutch book’s bite ("I paid more for repackaged P1!") and debate rationality vs. poverty. The debrief ties gut reactions to theory—closing the gap between "knowing" and "feeling" the problem.
