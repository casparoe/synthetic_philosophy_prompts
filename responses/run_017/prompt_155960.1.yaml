answer: |-
  Here’s a targeted Q&A sheet for your audience, prioritizing objections from Bayesian/accuracy-first and QUD perspectives. Ordered by potential damage (high to low), with replies and soft spots flagged.  

  ---

  ### **Q&A Sheet: Comparative Norm of Assertion**  
  **Core Thesis**: Flat assertion is permitted iff *p* is the best-supported *complete* answer to the operative QUD (i.e., maximizes probability relative to alternatives).  

  ---

  1. **Objection (Bayesian Coherence)**:  
     *"Why tie permissibility to *comparative* support instead of *absolute* epistemic utility? If I aim to maximize accuracy (e.g., Brier score), shouldn’t I assert the *most probable* proposition *regardless* of alternatives? Asserting a 45%-likely valve failure seems strictly dominated by asserting the disjunction (valve A or B), which has 75% probability and higher expected accuracy."*  
     **Reply (2-min)**: Accuracy-centric rules apply to *credences*, not *assertoric content*. Flat assertion is a *categorical* act that presents *p* as *the* answer. Asserting disjunctions evades the QUD’s demand for specificity (e.g., "Which valve failed?"). The norm reflects that assertions must resolve the question *as posed*—not maximize scoring-rule payoffs in isolation.  
     **Soft Spot**: Concedes tension with *strictly proper* scoring rules. If the audience views assertion *purely* as a credence-reporting tool, this won’t fully resolve it.  

  2. **Objection (QUD-Sensitivity Abuse)**:  
     *"Your norm makes assertion *too* QUD-relative. Couldn’t I gerrymander the question to make any claim assertable? E.g., if the QUD is ‘Is it valve A or not?’, I can flatly assert ¬A at 55% (beating A’s 45%), even though I’d hedge if asked ‘Which valve?’—violating intuitive consistency."*  
     **Reply (2-min)**: QUDs aren’t speaker-choosable; they’re contextually fixed by conversational goals (cf. Roberts 2012). Gerrymandering fails because the *complete answer* must address the *actual* epistemic target (e.g., diagnosing *which* valve failed). Pragmatics blocks question manipulation.  
     **Soft Spot**: Relies on vague "contextual fixation." Needs a formal model of QUD constraints.  

  3. **Objection (Scoring Rules vs. Assertion)**:  
     *"If assertion aims at accuracy, why doesn’t permissibility track *expected accuracy*? In your valve case (A:45%, B:30%), asserting A has lower expected accuracy than ‘A or B’ under any proper scoring rule. Your norm seems to *reward overprecision*."*  
     **Reply (2-min)**: Assertions aren’t mere accuracy-optimizing moves; they’re moves in a *coordination game* where informativeness matters. Withholding a complete answer (e.g., asserting disjunctions) can stall progress on the QUD. The norm balances precision against evidence—45% *can* warrant assertion when it’s the *best available* complete resolution.  
     **Soft Spot**: Doesn’t quantify the "coordination value" of informativeness. Decision theorists will want a utility function.  

  4. **Objection (Alternative-Set Arbitrariness)**:  
     *"What determines the set of ‘alternatives’? If I can assert ‘Valve A failed’ (45%) because I consider only {A, B, C}, but not if I include ‘A or B’ as an alternative (75%), your norm is *partition-dependent* in a way that feels unprincipled."*  
     **Reply (2-min)**: Alternatives are constrained by the QUD’s *structure*. For "Which valve?", answers are mutually exclusive (A, B, C). "A or B" isn’t a *complete* answer—it doesn’t resolve *which one*. The QUD’s semantics fixes the relevant partition.  
     **Soft Spot**: Semanticists may press cases where QUDs *allow* disjunctive answers (e.g., "Which valves might have failed?").  

  5. **Objection (Pragmatic Encroachment)**:  
     *"Doesn’t ‘best-supported’ collapse into *expected utility*? If stakes are high, shouldn’t I need more evidence to assert? E.g., asserting ‘Valve A failed’ at 45% is reckless if a wrong assertion costs lives—but your norm ignores stakes."*  
     **Reply (2-min)**: The norm is purely *epistemic* (evidence-relative). Pragmatic factors affect *whether to assert*, not *permissibility*. High stakes may make hedging prudent, but if A is still the best-supported answer, flat assertion remains *permissible* (though perhaps imprudent).  
     **Soft Spot**: Blurs the line between permissibility and advisability. Decision theorists may demand a unified utility framework.  

  6. **Objection (Aggregation Failure)**:  
     *"Can your norm handle *conjunctions*? If I know *p* (95%) and *q* (95%) independently, I can assert each but not ‘p and q’ (90.25%) if alternatives include the conjunctions. But intuitively, asserting conjunctions is sometimes fine."*  
     **Reply (2-min)**: Conjunctions are assertable only if *they* are the best answer to the QUD. If the question is "Is *p* true?", asserting "p and q" is unresponsive. If it’s "What’s the full state?", then yes—but only if the conjunction beats *its* alternatives (e.g., "p and ¬q").  
     **Soft Spot**: Struggles with embedded questions ("Tell me everything relevant").  

  7. **Objection (Threshold Reappearing)**:  
     *"Doesn’t ‘best-supported’ require a *threshold*? If all answers are <1% probable (e.g., ‘Which random particle decayed first?’), asserting the ‘best’ (0.1%) seems absurd. Don’t we need a floor?"*  
     **Reply (2-min)**: In low-probability contexts, *no* flat assertion is permissible—silence or hedging is required. This matches intuitions: if all answers are terrible, asserting *any* is improper. Thresholds aren’t needed; the comparative rule handles this.  
     **Soft Spot**: Implicitly endorses a "no assertion" zone—feels threshold-like.  

  ---

  ### **The Phantom Question (Hope Nobody Asks)**  
  *"If knowledge is just a special case (exhaustive yes/no QUDs), why not *reduce* your norm to knowledge? For non-exhaustive questions, we can model assertion as selecting a *subset* of possibilities, governed by knowledge-like constraints on partitions."*  
  **Why it’s bad**: Forces you into a technical debate about knowledge reducibility, distracting from your core innovation.  

  ---

  ### **The Revision-Worthy Objection**  
  **Objection (Dutch-Book Vulnerability)**:  
  *"Your norm licenses assertions that are *accuracy-dominated*. E.g., in the valve case, asserting A (45%) has lower expected accuracy than asserting ‘A or B’ (75%). If I pay you per accurate assertion, I can Dutch-book you: you’ll assert A over ‘A or B’, but lose money more often. This suggests your norm is *epistemically irrational*."*  
  **Why it demands revision**: If Bayesian rationality *requires* avoiding dominated actions, and assertion is an epistemic action, this clashes with your norm’s foundations. A successful landing means your view violates core decision-theoretic norms—requiring a reformulation (e.g., adding a dominance-blocking clause) or conceding that assertion isn’t purely epistemic.  
  **Do not improvise**: If this lands, say: *"That’s a serious challenge I need to think more about. A preliminary thought is that assertion serves communicative goals beyond scoring-rule optimization—but I agree this needs refinement."*  

  ---  
  **Final Tip**: Anchor replies in *their* frameworks: "From a QUD perspective..." / "Under a scoring rule, this would be problematic because..." shows you speak their language. Good luck!
