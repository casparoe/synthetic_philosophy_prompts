  First, I need to parse their main concerns. They mentioned the anchoring problem—how to correct for issues like akrasia without replacing the agent. Then there's the diachronic-seed problem: whether agents with identical current preferences but different histories should have the same outputs. They're unsure if seed-insensitivity is a real desideratum or a bias toward a "true self." Also, coherence (intrapersonal vs. interpersonal), tractability for engineering, and the output's purpose (deliberative vs. trustee mandate).

  The user wants the negative structure—conflicts between desiderata. They suspect action-guidance clashes with traceability, and their supervisor thinks seed-insensitivity conflicts with responsiveness. They also want to distinguish genuine correctness criteria from hidden biases. Plus, they want to know which desiderata are often silently satisfied or ignored in existing accounts.

  I should start by listing core desiderata. Non-negotiable ones might include Anchoring, Traceability, and Action-Guidance. Anchoring ensures the idealization doesn't drift into creating a different person. Traceability ties the output back to the agent's actual motivations. Action-Guidance requires the output to be usable in real decisions. These are foundational for any account that aims to be both faithful to the agent and practical.

  Then, negotiable desiderata. Seed-insensitivity might be optional, depending on whether the theory values current state over history. Coherence-Scope could vary; some accounts focus on individual coherence, others include interpersonal. Tractability could be seen as an epistemic concern rather than a theoretical one. Output-Purpose might differ based on the account's application—deliberative vs. trustee roles.

  Conflicts are key. Traceability vs. Action-Guidance: deep idealizations might lose the agent's original motivations, while shallow ones may not correct enough. Seed-insensitivity vs. Responsiveness: if outputs ignore history, they might not reflect the actual person. Also, Coherence-Scope vs. Action-Guidance—interpersonal coherence could override individual quirks, making it less responsive.

  The most exclusionary desideratum is probably Anchoring. If an account can't define what's held fixed vs. changed, it fails fundamentally. Many proposals might silently satisfy Anchoring and Coherence, assuming coherence is necessary. But they might ignore Tractability and Seed-Sensitivity, especially in philosophical contexts where practicality isn't prioritized.

  Hidden biases: demanding seed-insensitivity might stem from a belief in a true self, while requiring interpersonal coherence could reflect political ideals like impartiality. The user should scrutinize these in their list.

  I need to ensure each desideratum is clearly defined, with the rationale, and marked as non-negotiable or negotiable. Highlight conflicts and the exclusionary power of Anchoring. Finally, note which desiderata are commonly addressed or overlooked in the literature.
answer: |-
  Here is a structured set of desiderata for any idealized-preference account, designed to test the coherence of the genus and its viability for high-stakes delegation. I distinguish **non-negotiable** criteria (essential for *any* minimally adequate account) from **negotiable/local** ones (contingent on specific goals like interpersonal aggregation or computational feasibility). Conflicts and hidden biases are highlighted.

  ---

  ### **Core Desiderata**  
  1. **Anchoring Constraint**  
     - **Requirement**: The idealization must correct epistemic/volitional defects (ignorance, akrasia, adaptive preferences) *without* replacing the agent’s core practical identity. Must specify what constitutes "fixed points" (e.g., foundational values, life projects) vs. revisable elements (e.g., factual beliefs, instrumental preferences).  
     - **Rationale**: Prevents the account from collapsing into paternalism or creating a *de facto* different agent.  
     - **Status**: **Non-negotiable**. Without this, the theory lacks a *subject*.  

  2. **Traceability**  
     - **Requirement**: The output must be demonstrably grounded in the agent’s *actual* motivational set (e.g., desires, commitments, cares) — not merely consistent with it.  
     - **Rationale**: Ensures the idealization is an *extrapolation* of the agent’s own standpoint, not an external imposition.  
     - **Status**: **Non-negotiable**. Core to the concept of acting *on the agent’s behalf*.  

  3. **Action-Guidance**  
     - **Requirement**: The output must yield a complete (or completable) preference ordering over actions/states in real-world contexts.  
     - **Rationale**: A theory that outputs indecision or paradox fails its purpose in high-stakes delegation.  
     - **Status**: **Non-negotiable** for engineering applications (*your framing*).  

  4. **Responsiveness**  
     - **Requirement**: The idealization must reflect the agent’s *particular* history, relationships, and identity-constituting traits.  
     - **Rationale**: A "seed-insensitive" output treats agents as interchangeable nodes, violating the personal nature of volition.  
     - **Status**: **Non-negotiable** for accounts prioritizing personal authenticity.  

  ---

  ### **Negotiable/Local Desiderata**  
  5. **Seed-Insensitivity**  
     - **Requirement**: Agents with identical current preference orderings (but divergent histories) receive identical idealized outputs.  
     - **Rationale**: Reflects a commitment to a "true self" emergent from current states, not historical paths.  
     - **Status**: **Negotiable**. Conflicts with *Responsiveness*; often a disguised metaphysical commitment.  

  6. **Coherence-Scope**  
     - **Requirement**: Specifies whether coherence is strictly *intrapersonal* (resolving contradictions within one agent’s psychology) or *interpersonal* (harmonizing preferences across agents).  
     - **Rationale**: Determines if the account aims for individual autonomy or collective rationality (e.g., CEV’s aggregation problem).  
     - **Status**: **Local**. Depends on whether the theory serves individual deliberation or multi-agent trusteeship.  

  7. **Tractability**  
     - **Requirement**: The idealization must be approximatable by finite, fallible systems (e.g., AI).  
     - **Rationale**: For engineering applications, unrealizable ideals are vacuous.  
     - **Status**: **Local** (epistemic constraint). Non-negotiable for *delegation*, but not for metaphysical coherence.  

  8. **Output-Purpose Clarity**  
     - **Requirement**: Explicitly defines if the output is a *deliberative tool* for the agent or a *binding mandate* for a trustee.  
     - **Rationale**: Deliberative outputs tolerate uncertainty; trustee mandates require determinacy.  
     - **Status**: **Local**. Shapes idealization depth (e.g., reflection vs. convergence).  

  ---

  ### **Conflicts & Exclusionary Power**  
  - **Key Conflict 1**: **Traceability vs. Action-Guidance**  
    Deep idealizations (e.g., full logical omniscience) risk severing ties to actual motivations (*Traceability*), while shallow ones may lack the robustness needed for complex decisions (*Action-Guidance*). **Insoluble** if "grounding" requires preserving contingent quirks that hinder coherence.  

  - **Key Conflict 2**: **Seed-Insensitivity vs. Responsiveness**  
    As your supervisor notes, these are **jointly unsatisfiable**. Seed-insensitivity demands output invariance across histories; Responsiveness demands history-dependence. Reveals a fork in the genus: "true self" vs. "narrative self" accounts.  

  - **Most Exclusionary Desideratum**: **Anchoring Constraint**.  
    It eliminates proposals that:  
    - Fix *only* trivial features (e.g., "desires exist"), allowing total value drift.  
    - Fix *too much* (e.g., all current preferences), collapsing into actualism.  
    → Knocks out >50% of toy models (e.g., "idealize all beliefs but no desires").  

  ---

  ### **Hidden Biases & Silent Priorities**  
  - **Likely Prejudices in Disguise**:  
    - **Seed-Insensitivity**: Often smuggles in a *ahistorical rational agent* model from neoclassical economics.  
    - **Coherence-Scope (interpersonal)**: Frequently assumes *impartiality* is a universal ideal, reflecting liberal political commitments.  

  - **Silently Satisfied**: Most accounts assume **Coherence-Scope (intrapersonal)** is necessary and sufficient. Also treat **Action-Guidance** as a default (ignoring how idealization may yield incommensurability).  

  - **Silently Ignored**: **Tractability** (philosophical proposals often handwave computation). **Output-Purpose** is rarely distinguished, leading to category errors.  

  ---

  ### **Summary for Your Framework**  
  The genus’ coherence hinges on resolving the **Traceability-Action-Guidance** tension. Engineering applications demand non-negotiable **Tractability** and **Anchoring**, while philosophical accounts often sacrifice these for **Seed-Insensitivity** or broad **Coherence-Scope**. Scrutinize whether your desiderata assume "convergence" is necessary (a bias toward rationalist universalism) or treat narrative identity as expendable (a bias toward atomism).  
    
  For your dissertation: Structure the dispute around **Anchoring** as the keystone. If it fails, the genus collapses; if satisfied, conflicts like Seed-Insensitivity vs. Responsiveness define subspecies. This isolates the "empty or replacement" threat as a failure of Anchoring/Traceability.
