prompt: |-
  so a city council I'm advising is toying with the idea of running one real decision through a decision market instead of a normal vote, and they've asked me for a one-pager on what such a mechanism would have to get right before I'd sign off on it. I want the spec, not the pitch.

  The setup to write it against: the decision is whether to bring in congestion charging for the downtown core. The council picks a welfare metric up front (say some composite of median commute time, downtown air quality and small-business revenue, measured 18 months after launch). Traders buy and sell contracts that pay out conditional on the measure being adopted, and the market's recommendation is binding unless a supermajority overrides it. Real money, real losers, and it all has to survive an audit and a local newspaper.

  Give me the desiderata: what any mechanism like this has to deliver to count as good enough for that job — the cases it must get right, the distinctions it can't collapse, the results from social choice or market design it can't contradict — with the case or consideration behind each, and mark which are non-negotiable and which are just preferences of one camp.

  I already know I'm going to get "markets can be manipulated" and "the metric is gameable". Fine, put them on the list, but the bits I'm actually stuck on and want handled properly:

  - the adoption/do gap. What gets priced is how the metric looks in worlds where the policy is adopted, but what the council needs is what happens if it does the thing. Adoption is itself caused by stuff — lobbying, who's mayor, the state of the budget — that also causes the outcome, so a contract can trade high without the policy doing any of the work. Say what a design would have to add for the price to mean what the council wants it to mean, and whether that's even available with one city and no control.
  - abstention. What should the mechanism do when nobody shows up to trade, or the spread is wider than the decision is worth? A thing that always outputs a confident recommendation even on no information is worse than one that can shut up. I want a requirement about this.
  - metric drift. The metric is frozen before the debate, but the policy may change what residents care about, and the residents get a vote later.
  - the scoreboard problem. It's a one-off decision with a payout 18 months out, so we may never find out whether the market was actually well calibrated — which makes it hard to judge the mechanism itself. Is "you can tell after the fact whether it worked" a requirement, and what's the cheapest way to get it?
  - the people implementing the policy are also allowed to trade on it.

  Also: flag any pair of requirements you think can't be jointly satisfied (my hunch is that "legible enough for the public to trust it" pulls against "robust to adversarial traders", but you tell me), and tell me which single requirement does the most work in ruling out candidate designs. If it's quick, a small table scoring binding futarchy, an advisory-only market, and a citizens' assembly that just gets the prices as one input is fine — but the criteria are the part I care about, so keep the weight there.
reasoning: |-
  Okay, the user is advising a city council considering a decision market for congestion charging. They need a one-pager outlining what the mechanism must get right. Let me start by understanding their core concerns.

  First, the adoption/do gap. The market prices outcomes if adopted, but adoption itself might correlate with factors affecting the outcome. For example, if the policy is adopted during economic growth, the positive outcomes might be due to the economy, not the policy. The mechanism needs to isolate the policy's causal effect. Without control groups or multiple cities, this is tough. Maybe using predictive models or adjusting for confounders, but that adds complexity and potential bias.

  Next, abstention. If there's low participation, the market might give a noisy or false signal. The mechanism must require a confidence threshold, like minimum volume or narrow spreads, to avoid forced decisions. Without it, the council risks acting on unreliable data.

  Metric drift is another issue. Post-policy, resident priorities might shift. The pre-defined metric could become irrelevant. The user is concerned about legitimacy if the metric no longer reflects public values. The mechanism must either lock the metric rigidly, risking misalignment, or allow updates, which introduces gaming risks. Highlighting this trade-off is essential.

  The scoreboard problem: since the payout is 18 months later, verifying the market's accuracy is delayed or impossible if overridden. This affects accountability. The requirement should be that outcomes are tracked and audited, even if overridden, to allow post-hoc evaluation. But that's only partial without a counterfactual.

  Insider trading by policymakers is a conflict of interest. Strict trading bans for involved parties are non-negotiable to maintain integrity. Enforcement through audits and real-time monitoring is needed, but challenging.

  Conflicting requirements: Legibility vs. robustness. Simple designs are easier to trust but vulnerable to manipulation. Complex designs are robust but hard to explain. Also, causal identification vs. feasibility—getting true causal effect without control groups might be impossible, forcing a trade-off.

  Key trade-offs table: Binding futarchy struggles with adoption/do gap and abstention. Advisory markets avoid binding issues but lack enforceability. Citizens' assembly adds interpretation but reduces market influence.

  The user's deeper needs: They want a credible, auditable mechanism that the public and council can trust. They need to preempt criticism from opponents, especially around manipulation and metric relevance. Ensuring the mechanism doesn't become a political liability is crucial. Highlighting non-negotiables like causal inference, confidence thresholds, and insider bans addresses these concerns while acknowledging feasibility limits.
answer: |-
  Here’s a specification of desiderata for a congestion charging decision market, structured for auditability and real-world constraints. Non-negotiables (NN) are bolded; others reflect trade-offs between epistemic rigor and pragmatic legitimacy.

  ---

  ### **Core Desiderata for Decision Market Mechanism**  
  *(Congestion Charge Case: Binding recommendation via real-money market on composite welfare metric @ T+18mo)*  

  #### **1. Causal Identification (Adoption/Do Gap)**  
  - **NN: Price must reflect *causal effect* of policy adoption**, not correlation.  
    *Why*: If traders price high because pro-adoption mayors correlate with good economies (which independently improve metrics), the market fails.  
    *Requires*:  
    - **Explicit adjustment for confounders** (e.g., market contracts conditioned on *realized* confounders like unemployment rate at T+18mo).  
    - **"Synthetic control" contract design**: Traders bet on *difference* between adopted vs. non-adopted scenarios using city data + comparable non-policy cities.  
    *Feasibility*: Limited without controls; best effort via predictive models (e.g., "policy-on" vs. "policy-off" forecasts from independent models as trading anchors).  

  #### **2. Abstention & Confidence Thresholds**  
  - **NN: Mechanism must withhold recommendation if uncertainty exceeds threshold**.  
    *Why*: Forcing a decision on low participation or wide spreads invites chaos.  
    *Requires*:  
    - **Predefined liquidity/spread triggers** (e.g., no output if daily volume < $10k *or* bid-ask spread > 20% of price).  
    - Fallback to council vote if thresholds unmet after X days.  

  #### **3. Metric Rigidity vs. Drift**  
  - **NN: Welfare metric is fixed at launch; no retroactive amendments**.  
    *Why*: Drift invites moral hazard (traders optimize for outdated goals).  
    *But*: Residents’ values may shift post-policy (e.g., new priorities after charge introduced).  
    *Requires*:  
    - **Pre-debate metric ratification** with public consultation.  
    - **"Legitimacy sunset"**: If post-policy polling shows >40% reject metric validity, council may override *without* supermajority.  

  #### **4. Ex Post Verifiability (Scoreboard Problem)**  
  - **NN: Outcome must be auditable against real-world data**.  
    *Why*: If market is overridden, we lose counterfactual; undermines learning.  
    *Requires*:  
    - **Independent auditor tracks metric components** (commute times, air quality, revenue) regardless of adoption.  
    - **"Shadow market" for non-adoption scenario** (trades concurrently; payout based on if *non*-adoption would have yielded better metric).  
    *Cheapest verification*: Compare market forecast to post-hoc expert panel assessment.  

  #### **5. Conflict Management (Insider Trading)**  
  - **NN: Policy implementers (city staff, contractors) banned from trading**.  
    *Why*: Incentive to sabotage or boost metrics for profit.  
    *Requires*:  
    - **Real-time identity verification** + public trading ledger.  
    - **Penalties for malfeasance** tied to audit outcomes.  

  #### **6. Robustness & Manipulation Resistance**  
  - **NN: Survive adversarial traders with $100k+ budgets**.  
    *Why*: Real money attracts strategic actors (e.g., ride-hail firms betting against charge).  
    *Requires*:  
    - **Liquidity subsidies** (e.g., seeded market maker) to absorb shocks.  
    - **Circuit breakers** during anomalous volatility.  
    *Conflict*: "Legibility for public trust" vs. complexity of anti-manipulation tools. Simplify with plain-English trading alerts.  

  #### **7. Social Choice Compatibility**  
  - **Must not violate Arrovian principles** (e.g., non-dictatorship, IIA).  
    *Why*: Market as "voter" shouldn’t override coherent preferences.  
    *Requires*: **Advisory if council can override**; binding only if market is sole "voter."  

  ---

  ### **Key Trade-offs & Dealbreakers**  
  | Requirement          | vs. Feasibility                     | Highest-Stakes Conflict             |  
  |----------------------|-------------------------------------|-------------------------------------|  
  | Causal Identification| Near-impossible without controls    | Vs. Abstention (if no data → no trade) |  
  | Verifiability        | Costly shadow markets              | Vs. Public trust (if unauditable)   |  
  | Anti-manipulation    | Complexity obscures legibility     | **Non-negotiable: Fails if gamed**  |  

  **Most consequential requirement**: **Causal Identification**. Ruled out designs:  
  - Naive "Adopt/Reject" binary markets (ignores confounders).  
  - Unadjusted prediction markets (prices correlation, not causation).  

  ---

  ### **Design Scoring (Quick Comparison)**  
  | **Design**            | Causal ID? | Abstention? | Verifiable? | Insider Risk | Public Trust? |  
  |------------------------|------------|-------------|-------------|--------------|---------------|  
  | Binding Futarchy       | ❌          | ❌           | ▲           | ❌            | ▲             |  
  | Advisory Market        | ▲          | ✅           | ▲           | ▲            | ✅             |  
  | Citizens' Assembly     | ✅          | ✅           | ✅           | ✅            | ✅             |  
  *(▲ = Partial; ✅ = Strong; ❌ = Weak)*  

  **Recommendation**: Citizens’ Assembly using market prices *as input* (plus experts) satisfies most NN criteria while mitigating adoption/do gap via deliberation. Add liquidity thresholds and independent audit to advisory market if insisting on market primacy.  

  ---  
  **Bottom Line**: A market *can* work only with:  
  1. Confounder-adjusted contracts,  
  2. Hard abstention triggers,  
  3. An auditor tracking outcomes even if overridden.  
  Without these, it’s a correlated-opinion poll with financial stakes.
