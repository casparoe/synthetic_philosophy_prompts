            Similarly, in GOOD state, the probability of no launch is the chance they see red: 1-p.

            Then expected value:

              = 0.5 * [ (1 - (1-p)) * 100 + ... ] -> wait:

              In GOOD state: 
                  P(launch) = P(all see green) = p -> so if they see green, someone will launch -> then payoff 100.
                  P(no launch) = P(all see red) = 1-p -> payoff 0.
              In BAD state:
                  P(launch) = P(all see green) = 1-p -> then payoff -1000.
                  P(no launch) = P(all see red) = p -> payoff 0.

              EV = 0.5 * [ p * 100 + (1-p)*0 ] + 0.5 * [ (1-p) * (-1000) + p * 0 ]
                  = 0.5 * [100p] + 0.5 * [-1000(1-p)]
                  = 50p - 500(1-p) = 50p - 500 + 500p = 550p - 500.

              With p=0.92: 550*0.92 - 500 = 506 - 500 = 6.

            So the expected value is positive, and the same as for the single decider. The curse disappears.

          We want to show that independence is key.

          Given time, we do two variants:

            Variant A: Expert with two signals (anyone-may-launch) -> one round.

            Variant B: Correlated signals (anyone-may-launch) -> one round.

          But note: the veto variant is also important. We can choose the two that are most revealing.

          I think the expert variant and the veto variant are more pedagogically valuable. We can leave the correlated signals for the debrief and explain.

          So:

            Variant 1: Expert variant (anyone-may-launch, but one expert has two independent signals).

            Variant 2: Veto variant.

          Now, what to reveal with each:

            Variant 1: We want to see if the presence of an expert reduces the false launch rate? But in the anyone-may-launch rule, the expert might be more cautious (since they have more information) but others might still launch on a false positive. We want to see if the group would be better off if only the expert decided.

            We will run two sub-rounds? But time. We run one round of the expert variant (anyone-may-launch with an expert) and then we also run a round where only the expert decides? But that would be two rounds.

          Given time, we can run:

            In the same round as the expert variant, we also compute what would have happened if only the expert had decided. We don't need to run it again because we know the expert's signals and what they would have done.

          So in the expert variant round:

            - We have the whole group, state drawn.
            - We secretly give one participant two signals (so two cards, say "green" and "red", but they see both).
            - The rest get one signal each.
            - Everyone decides whether to launch (under the rule that anyone may launch).
            - We reveal the state and outcome.

            Then we ask the expert: based on your two signals, would you have launched if you were the sole decider?

            And we compute what the outcome would have been if only the expert decided.

            Then we compare: the actual outcome (with anyone launching) and the outcome if only the expert decided.

          This can be done in one round.

          Variant 2: Veto variant.

            - We run a round with the whole group, but the rule is: the action will be taken unless at least one participant vetoes (i.e., writes "veto").
            - Payoffs are the same: in GOOD state, taking the action gives 100, not taking gives 0; in BAD state, taking gives -1000, not taking gives 0.
            - We draw a state and give signals.
            - Each participant decides: they can either do nothing (which allows the action) or veto (which blocks the action).
            - The action is taken only if no one vetoes.

            We want to see if they become too cautious: in the GOOD state, if one participant sees a red signal, they might veto, causing the group to miss out on the good action.

            The unilateralist's curse now becomes a curse of inaction in the GOOD state.

          Now, the scoring:

            We use points. We tell them that the points are just for learning and we will not rank individuals. We will track the group's cumulative score.

            For the group rounds (like whole group or groups of 4), everyone in the group gets the same score for that round.

            For the sole decider rounds, the whole room gets the same score.

            We record the cumulative score for the room on a board.

          To avoid individual scorekeeping undermining the shared stakes, we do not reveal individual decisions until after the debrief. We only reveal the group outcome and the cumulative group score.

          Materials:

            - Cards for states (GOOD/BAD) for each round and each group.
            - Cards for signals (green/red) for each participant per round.
            - Response cards for decisions (for each participant per round: for launch/not or for veto/not).
            - Envelopes for the group rounds (for the state and signals).

          Timeline:

            0-5 min: Introduction. Explain the structure: a series of rounds, each round has a hidden state, and they will get a private signal. Explain the payoff matrix:

                           GOOD state   BAD state
                Launch        +100        -1000
                No launch       0           0

            5-20 min: Phase 1 (sole decider) - 3 rounds.
                - Each round: 
                    - Facilitator draws a state (flip a coin, or use a random number in secret).
                    - Facilitator draws a signal for themselves (with accuracy p=0.92: so if state is GOOD, 92% chance of green; if BAD, 92% chance of red -> so 8% chance of a false signal).
                    - Facilitator decides to launch or not.
                    - Facilitator reveals the state and the outcome. Record the outcome for the whole room.

            20-35 min: Phase 2 (whole group, anyone may launch) - 3 rounds.
                - Each round:
                    - Draw a state.
                    - Generate 20 signals (each participant gets one).
                    - Distribute signals.
                    - Each participant writes "launch" or "not" on a card and hands it in (without talking).
                    - If at least one "launch", then the action is taken.
                    - Reveal state and outcome. Record the outcome for the whole room.

            35-45 min: Phase 3 (groups of 4) - 3 rounds per group.
                - Break into 5 groups of 4.
                - Each group gets 3 envelopes (one for each round). Inside each envelope: state card (sealed) and 4 signal cards.
                - In each round, each group member takes one signal card (without showing others), then writes "launch" or "not".
                - The group leader collects the decisions. If at least one "launch", then the action is taken. Then they open the state card and compute the outcome.
                - They record the outcome for the round for their group.
                - After 3 rounds, they compute the total for the group.

            45-50 min: Reassemble and collect group scores for Phase 3. Compute the average per-person score for Phase 3 (by summing all group totals and dividing by 20).

            Now cumulative scores:

              Phase 1: 3 rounds -> total for the room: sum of outcomes for each round (which is 20 * outcome of the round, because everyone gets the same).

              Phase 2: similarly, 3 rounds -> total for the room: 20 * outcome per round.

              Phase 3: we have 5 groups, each with 3 rounds. For each group, we have the total for the group over 3 rounds. Then the total for the room is the sum of the 5 group totals. Then per-person total for Phase 3 is total room / 20.

            We then show the cumulative per-person score for the three phases.

            50-60 min: Variant rounds.

              Variant 1: Expert variant (whole group, one round)
                  - Draw a state.
                  - Choose one participant randomly as the expert. Secretly give them two signal cards (drawn independently: so for the expert, two draws from the same distribution).
                  - Give one signal card to each of the other 19.
                  - Everyone decides whether to launch (anyone may launch).
                  - Collect decisions. If at least one launch, action taken.
                  - Reveal state and outcome.
                  - Ask the expert: what were your two signals? Would you have launched if you were the sole decider? Compute what the outcome would have been.

              Variant 2: Veto variant (whole group, one round)
                  - Draw a state.
                  - Give one signal to each participant.
                  - Explain: the action will happen automatically unless at least one person vetoes. So each participant writes either "veto" or "allow" (or nothing) to allow.
                  - Collect: if at least one veto, then the action is blocked (no launch). If no veto, then launch happens.
                  - Reveal state and outcome.

            60-75 min: Debrief.

          Now, what might go wrong:

            - One participant who never launches: in the anyone-may-launch phase, if they get a green signal, they might still not launch. That is their choice. But it might save the group in a BAD state? Or cost the group in a GOOD state. We can't control. We can only hope that most participants are rational.

            - One participant who launches every time: similarly, they might cause a false launch in a BAD state.

          How to handle: In the debrief, we can note that the activity assumes that participants are rational and act on their signal. But in reality, people might have different thresholds. However, the curse is about the structural incentives, not about individual irrationality.

          Features the game cannot reproduce:

            - Catastrophic magnitudes with very small probabilities: our payoffs are fixed and known. In reality, the magnitude of a catastrophe might be huge and the probability very small, and people might not agree on the probabilities or the magnitudes.

            - The stakes are not contested in the game, but in reality, there might be disagreement about what is good or bad.

            - Career and reputational incentives: in the game, there is no penalty for being the one who launched and caused a disaster, or for being the one who vetoed and saved the group. In reality, there might be asymmetric rewards and punishments.

          One misleading impression:

            - The game might suggest that the unilateralist's curse is always bad. But in some contexts, having many decision-makers might be good (e.g., if the action is beneficial in more states). The curse specifically arises when the action is harmful in some states and the evidence is imperfect.

          Debrief (5 minutes):

            - Recap the pattern: 
                  Sole decider: we did well.
                  Whole group: we did poorly.
                  Groups of 4: in between.

            - Why? In the BAD state, even though each person has only an 8% chance of a false green signal, with 20 people, it's very likely that at least one gets a false green. In the GOOD state, we were already very likely to get a green signal even with one person.

            - The fix: instead of anyone may launch, we require that at least k people agree to launch. We set k such that the probability that k people get a green signal in the BAD state is very low.

            - In the expert variant: even though we had an expert, the anyone-may-launch rule still allowed a non-expert to launch on a false positive. And the expert might have been more conservative because they had more information. So the group might be better off if they deferred to the expert.

            - In the veto variant: we saw that one person can block the action. In the GOOD state, if one person gets a false red signal, they might veto and cost the group the benefit. So the same logic applies: the more people there are, the more likely it is that at least one will veto in the GOOD state.

            - Therefore, the unilateralist's curse is not about launching being bad, but about the structural incentive of unilateral action in a group with imperfect information.

            - The remedy is to adjust the threshold for action (or inaction) to the group size.

          We hope they arrive at the fix: require a certain number of people to agree to launch.

          What follows: adding a decision-maker can make the group worse off if it increases the chance of a false launch without adding much to the chance of a true launch (which is already high).

          Finally, we correct the misleading impression: the curse is specific to the payoff structure and the independence of errors. If errors are correlated (like the variant we didn't run), then the curse might not appear.

          We also note that in real life, we might not know the prior or the signal accuracy, and the stakes might be contested.

          We end.

          Materials list:

            - A coin or RNG for drawing states.
            - A way to generate signals: for each participant in each round, we need a card with "green" or "red". We can pre-generate for the group rounds using envelopes.
            - Response cards: for each participant, a card to write their decision.
            - Scoreboard to record cumulative room score.

          Scoring sheet:

            We record for each round in each phase:

              Phase 1 (sole decider rounds):
                  Round 1: state: ___, facilitator's signal: ___, decision: ___, outcome: ___
                  ... for 3 rounds.

              Phase 2 (whole group rounds):
                  Round 1: state: ___, number of launch votes: ___, outcome: ___
                  ... for 3 rounds.

              Phase 3 (groups of 4): for each group, we record:
                  Group 1: 
                      Round 1: state: ___, outcome: ___
                      Round 2: ...
                      Round 3: ...
                  ... for 5 groups.

            Then we compute the cumulative score for the room.

          Pre-generation for group rounds: we need 5 groups * 3 rounds = 15 envelopes. For each envelope, we draw a state and then for each of the 4 members, draw a signal (with p=0.92 given the state).

          This is a lot of work, but we can do it in advance.

          We are done.
answer: |-
  Below is a complete, runnable design for your 90-minute session, optimized for clarity, engagement, and pedagogical impact. It adheres to your constraints and leverages the core mechanics of the unilateralist's curse.

  ---

  ### **Game Design: "The Launch Decision"**
  **Objective**: Participants experience how individual rationality leads to collective harm when anyone can act unilaterally, and discover the structural fix (threshold voting).

  #### **Core Parameters**
  - **Hidden states**: `GOOD` (action beneficial) or `BAD` (action catastrophic).  
  - **Private signal accuracy**: `p = 0.92` (each signal is correct 92% of the time).  
  - **Payoffs** (points per person):  
    - Launch in `GOOD`: **+100**  
    - Launch in `BAD`: **-1000**  
    - No launch (status quo): **0**  
  - **Rounds**:  
    - **Round 1 (Baseline)**: 1 decider (facilitator), 3 rounds.  
    - **Round 2 (Small Group)**: Groups of 4, 3 rounds.  
    - **Round 3 (Large Group)**: Full group of 20, 3 rounds.  
    - **Variants**: 2 rounds (details below).  

  #### **Why These Numbers?**
  - **Single decider rationality**:  
    - *EV(launch | green signal)* = `(0.92 × 100) + (0.08 × -1000) = 92 - 80 = +12` (barely positive → rational to launch).  
    - *EV(no launch | red signal)* = `(0.92 × 0) + (0.08 × 0) = 0` (rational to abstain).  
  - **Group harm amplification**:  
    - With 20 people, *P(at least one false green in BAD)* = `1 - (0.92)^20 ≈ 0.81`.  
    - *P(at least one true green in GOOD)* = `1 - (0.08)^20 ≈ 1.0` (saturates quickly).  
    - **Expected value (20 people)**:  
      `0.5 × [1.0 × 100] + 0.5 × [0.81 × -1000] = 50 - 405 = -355` (worse than status quo).  
  - **Asymmetry visibility**:  
    - With 4 people: *P(false green in BAD)* = `1 - (0.92)^4 ≈ 0.28` → *EV = -64*.  
    - With 20 people: *P(false green)* jumps to **0.81** → *EV = -355*.  
    → Damage grows with group size due to accumulating false positives.  

  #### **Variant Rounds** (Choose 2)
  1. **Better-Informed Expert** (Variant 1):  
     - One participant (secretly assigned) gets **two independent signals** (accuracy 0.92 each).  
     - Others get one signal.  
     - **Reveals**: Deferring to the expert avoids false launches, but "anyone-may-launch" wastes their expertise.  
  2. **Veto Power** (Variant 2):  
     - Default = **launch happens unless ≥1 person vetoes**.  
     - Payoffs unchanged.  
     - **Reveals**: The curse flips → paralysis in `GOOD` states (one cautious person can veto). Highlights status quo bias in standard remedies.  
     *(Omitted: Correlated signals. Use debrief to explain its lesson.)*  

  ---

  ### **Practical Setup**
  #### **Materials**
  - **State cards**: 2 decks (GOOD/BAD) for facilitator.  
  - **Signal cards**: Green/Red cards (pre-generated for all rounds).  
  - **Decision cards**: "LAUNCH"/"NO" (baseline), "VETO"/"ALLOW" (variant 2).  
  - **Envelopes**: For group rounds (pre-pack state + signals per group).  
  - **Scoreboard**: Public tracker of **collective points** (e.g., whiteboard).  

  #### **Timeline (90 Minutes)**
  1. **Intro (5 min)**:  
     - Explain rules, payoffs, and shared stakes: *"Your points determine the group’s collective score. No individual rankings."*  
     - Emphasize silence during decisions.  

  2. **Round 1: Solo Decider (15 min)**  
     - Facilitator acts alone.  
     - **Per round (3×)**:  
       - Draw state (secretly).  
       - Draw private signal (accuracy 0.92).  
       - Decide: Launch or not.  
       - Reveal state/outcome. Update **group score** (e.g., `+100` for all if GOOD launch).  

  3. **Round 2: Small Groups (20 min)**  
     - Split into 5 groups of 4.  
     - **Per group (3×)**:  
       - Give each group a pre-packed envelope (state + 4 signals).  
       - Privately view signals → write "LAUNCH/NO" → submit silently.  
       - Group lead checks if anyone launched → reveals state → records outcome.  
     - **Score**: Average scores across groups.  

  4. **Round 3: Full Group (15 min)**  
     - All 20 participants.  
     - **Per round (3×)**:  
       - Draw state (secretly).  
       - Distribute private signals (1 per person).  
       - All submit "LAUNCH/NO" silently.  
       - If ≥1 launch → action taken.  
       - Update group score.  

  5. **Variants (15 min)**  
     - **Expert Variant**: Assign one expert (two signals). Run 1 round with full group (anyone-may-launch).  
     - **Veto Variant**: Run 1 round with full group (action happens unless vetoed).  

  6. **Debrief (20 min)**:  
     - Show score trends: Solo/small groups → positive; large group → negative.  
     - Ask: *"Why did bigger groups do worse?"* Guide them to identify:  
       - In `BAD`, *P(false green)* keeps rising with group size.  
       - In `GOOD`, *P(true green)* maxes out early.  
     - **Fix**: *"How can we prevent false launches but keep true ones?"* Elicit threshold voting (e.g., require ≥k greens to launch).  
     - Connect to real world: Adding deciders can worsen groups if thresholds aren’t scaled (e.g., nuclear launch protocols).  
     - **Correctives** (see "Honest Notes" below).  

  ---

  ### **Honest Notes**
  **Predictable Issues**:  
  - **Never-launcher/Always-launcher**:  
    - *Handling*: Privately remind them the game assumes rational actors (launch only on green). If they resist, use their behavior in debrief: *"If some ignore signals, the curse intensifies."*  
  - **Noise**: With 20 people, signal distribution takes time. Prep envelopes ahead.  

  **What the Game Misses**:  
  - **Catastrophic stakes**: Real-world harms (e.g., extinction) involve tiny probabilities of massive losses. Our `-1000` is a proxy.  
  - **Contested stakes**: Participants don’t debate payoffs; real groups disagree on what’s "good" or "bad."  
  - **Reputational incentives**: No penalty for being the one who caused disaster (or saved the day).  

  **Misleading Impression**:  
  - The game implies the curse is *always* bad. In reality, unilateral action can be vital in emergencies (e.g., disaster response). Correct by noting: **"The curse arises only when errors are independent and risks asymmetric. Scaling thresholds fixes the structure, not the people."**  

  ---

  This design ensures participants *feel* the curse before naming it, and collaboratively derive the threshold fix. The point system and shared scoring minimize individualism. Run groups of 4 and 20 to make asymmetry visceral.
