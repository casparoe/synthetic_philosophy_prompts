     - Any participant may choose to "launch" (take the action) or not.
     - If at least one participant launches, the action is taken and everyone gets the payoff for that state and the action.
     - If no one launches, everyone gets the status quo payoff.

   Payoffs:
     - In the GOOD state: 
          Launching yields a high payoff (say, +100) because the action is beneficial.
          Status quo is 0.
     - In the BAD state:
          Launching yields a very low payoff (say, -1000) because the action is catastrophic.
