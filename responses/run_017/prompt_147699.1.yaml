     - Prior: P(GOOD) = P(BAD) = 0.5 (for simplicity).

   For a single decider:
     - Signal accuracy: p (so P(signal=green | GOOD) = p, P(signal=red | GOOD) = 1-p, etc.)

   The expected value of launching when seeing a green signal:

     EV(launch | green) = P(GOOD | green) * 100 + P(BAD | green) * (-1000)

   Using Bayes:

     P(GOOD | green) = P(green | GOOD) * P(GOOD) / P(green)
                     = p * 0.5 / [P(green|GOOD)*P(GOOD) + P(green|BAD)*P(BAD)]
                     = p * 0.5 / [p*0.5 + (1-p)*0.5]   [because in BAD state, P(green|BAD) = 1-p? Actually, we have to define the signal in BAD state.]

