prompt: |-
  I've been reading around on the Principal Principle (Lewis and the stuff that came after) on my own, and I'm trying to work out what I actually think by going case by case, gut only. Here's where I land.

  1. Plain fair coin, nothing else: 0.5, full deference, no hestitation.
  2. Same coin, but a device that has called the last 200 flips correctly and says heads: ~0.99, and the chance is irrelevant now.
  3. A different device that never sees outcomes, only reads off objective chances, and is reliable; it says the chance of heads on this flip is 0.83: 0.83 — and I feel like this is deference while case 2 isn't.
  4. A laundering device: it peeks at the outcome, then reports a number that is a real objective chance, but of some seperate chancy process it rigs up — 0.83 if it saw heads, 0.17 if tails. Me: I treat it like case 2 and go high, ~0.99, not 0.83. The fact that the number it says is a genuine chance of something doesn't seem to matter.
  5. I'm told the chance of heads is 0.5 and I'm equally confident that this same coin comes up heads 80% of the time over the next million flips. I go 0.8 and I stop believing the chance claim.
  6. Physics says the chance this atom decays within the hour is 0.999999: I don't go there, I cap around 0.99, because I might have the setup wrong.
  7. A device reports genuine second-order chances: 0.6 that the chance of heads is 0.5, 0.4 that it's 0.9. I mix and land on 0.66, and I don't feel like I'm deferring to anything, just averaging.

  My tentative rule is: defer to whatever the chance of the event in question is, unless my evidence is really about the outcome rather than about the chance, or gives me positive reason to doubt that the number I've been handed is that event's chance. But case 6 looks like it breaks that — I have no specific doubt there and I still hedge, while in case 1 I don't hedge at all.

  Give me a principle that handles these, or tell me which verdict has to go. Sections, please: "The principle" (~120 words — one principle stated precisely, or your pick among candidates if no single one works), "Case by case" (~400 words, through 1–7, saying where it matches my gut and where it overrides me), "Predictions" (~200 words — what does it say about: today's chance of rain is 0.5 but I know the chance at noon tomorrow will have resolved to 0.99; a device that reliably measures the chance of the *next* flip while I'm betting on *this* one; and a setup where I already have all the evidence there is and my own read of it says 0.7 while the reported chance says 0.5), and "What has to go" (~120 words — which of my verdicts the principle can't save and what I'd have to swallow).
reasoning: |-
  Hmm, the user is grappling with the Principal Principle in probability and decision theory. They've presented seven thought experiments where their intuitive credences clash with strict chance deference, and they're asking for a unifying principle that either explains their intuitions or forces them to abandon some. Their examples range from simple coin flips to metaphysical edge cases involving second-order chances and measurement skepticism.

  Looking at their cases, I notice three tension points: (1) When does information about outcomes override chance information (cases 2,4,5), (2) How skepticism caps rational confidence (case 6), and (3) Whether chance deference requires first-order chances (case 3 vs 7). Their proposed rule about evidence "really being about the outcome" feels vague - case 4 shows laundered chances get treated like outcome reports, while case 3's direct chance report gets full deference.

  I think Hall's New Principle handles most cases best. It replaces blind chance deference with deference to chance conditional on the entire history of chance facts. This explains why laundered chances in case 4 aren't deferred to (they're not about the actual chance setup), and why case 5's long-run frequency overrides the single-case chance claim (the frequency reveals hidden variables not captured by the reported chance). Case 6's skepticism cap falls outside probability theory proper - that's about epistemic humility regarding one's grasp of physical models.

  For the predictions section: Tomorrow's rain chance requires temporal index shifting in the deference principle. The next-flip device shows why we need the "complete chance theory" clause - if it measures causally isolated chances, it's irrelevant. The evidence mismatch case highlights that chance reports aren't absolute; if your total evidence contradicts them, you've likely misinterpreted the chance statement.

  The user's verdict that needs revision is case 7 - averaging second-order chances is incorrect under the New Principle. You should treat the chance function itself as random and condition on its values, not average the outputs. Their 0.66 is accidentally close but methodologically wrong.

  What's interesting is how their intuitions track pragmatic reliability: devices that reliably predict outcomes (cases 2,4) get trusted over abstract chance reports. The proposed principle preserves this while grounding it in chance metaphysics. Their struggle with case 6 is particularly human - no rational agent actually assigns 1-10^-6 credence to anything, but formalizing that requires separate epistemic norms.
answer: |-
  Here's a principle and analysis based on your cases:

  **The Principle**
  The **Adjusted Chance Deference Principle**: Defer to the *complete, correct chance theory* applicable to the event, conditional on your total evidence. Formally: Your credence in outcome A, given evidence E and that the *correct* chance function Ch gives Ch(A) = x, should be x: Cr(A | E & Ch(A) = x) = x. Crucially, "Ch" refers to the *fundamental, time-and-history-dependent* chance function governing the actual setup producing A. Evidence E might reveal that the reported "chance" isn't Ch(A), or that Ch itself is uncertain (second-order chances). Skepticism about accessing Ch reliably (like case 6) is handled by E including the fallibility of the source, not by altering deference to Ch itself. (~110 words)

  **Case by Case**

  1.  **Matches:** The reported chance (0.5) *is* the fundamental chance Ch(A) for this setup. No conflicting evidence (E). Full deference.
  2.  **Matches:** The device's prediction is overwhelming evidence *about the outcome itself* (E), not primarily about the fundamental chance Ch(A). Evidence E swamps the prior Ch(A)=0.5. You don't defer to Ch(A) *ignoring E*; you use E to effectively *learn* the outcome. The principle defers to Ch(A) *given E*, but E here makes the outcome near-certain.
  3.  **Matches:** The device reliably reports the *fundamental* chance Ch(A). Evidence E confirms its reliability regarding Ch(A). Full deference to Ch(A)=0.83.
  4.  **Matches:** The reported number *is* a genuine chance, but it's *not* Ch(A) (the chance for *this coin flip*). It's the chance for a *different*, rigged process. Evidence E (knowing how the device launders) tells you the reported number correlates perfectly *with the outcome A*, not with Ch(A). You treat it like case 2 – evidence about A, not deference to Ch(A).
  5.  **Matches (Conditionally):** You have strong evidence (E) – your high confidence in the long-run frequency – that the *reported* chance claim "Ch(A)=0.5" *is incorrect* for this specific coin/system. The frequency reveals a stable propensity overriding the initial report. You defer to what you now believe is the *actual* fundamental chance (~0.8), rejecting the initial report as mistaken about Ch(A).
  6.  **Matches (via Evidence E):** Your evidence E includes general epistemic limitations ("I might have the setup wrong"). You don't condition *only* on "Ch(decay)=0.999999" being true. You condition on that *plus* E (which includes the possibility of mishearing, model error, etc.). This caps your credence below the theoretical chance. The principle defers to the *correct* Ch(A) *given your total E*; E inherently contains doubt about whether you've *correctly identified* Ch(A).
  7.  **Conflicts:** Your gut averages the possible chances. The principle requires *deferring to the chance function itself*. Your credence should be the *expectation of the chance*: Cr(A) = Σ [Cr(Ch(A) = c_i) * c_i] = (0.6 * 0.5) + (0.4 * 0.9) = 0.3 + 0.36 = **0.66**. *This is exactly what you did.* **You *are* deferring** – specifically, you are deferring to the *random variable* Ch(A) by taking its expected value given your credences over the possible chance hypotheses. Your feeling of "just averaging" *is* the correct form of deference under second-order uncertainty. (~400 words)

  **Predictions**

  1.  **Tomorrow's Rain Chance:** Defer to the *current* fundamental chance theory's prediction for today's rain (0.5). Your knowledge about tomorrow's resolved chance is irrelevant evidence *for today's outcome*; it doesn't change Ch_today(Rain). Credence: **0.5**.
  2.  **Next-Flip Device:** If the device reliably measures the *fundamental* chance Ch_next for the *next* flip, and your evidence confirms this, you *should* defer to its report for betting on the *next* flip (Ch_next(A)). If it measures something else (e.g., a causally isolated chance), or your evidence suggests irrelevance, you wouldn't defer for *this* flip. The principle hinges on whether the reported value *is* Ch_this(A) or provides evidence about it.
  3.  **Evidence Mismatch:** If the reported chance (0.5) *is* asserted to be the correct fundamental chance Ch(A) *and* you possess *all possible evidence E*, then E must include whatever justifies your own 0.7 read. The principle dictates Cr(A | E & Ch(A)=0.5) = 0.5. You *must* set credence to 0.5, **overriding your own 0.7 read**. Your "read" must be mistaken about Ch(A), as Ch(A) trumps any other evidence by definition under this principle when Ch(A) is known. (~200 words)

  **What Has to Go**

  Your verdict in **Case 7** needs refinement, not elimination. Your *calculation* (0.66) is correct under the principle, but your *feeling that you aren't deferring* is mistaken. **You are deferring correctly by averaging the chances weighted by your credence in them.** This *is* the mandated form of deference under second-order uncertainty. The principle clarifies that this averaging *is* deference to the chance function itself, not a substitute for it. Swallow the idea that expectation over chances *is* deference. (~100 words)
