prompt: |-
  Hey — I host a fortnightly discussion night in the back room of a pub, mostly coders plus a couple of teachers, about ten people, ninety minutes, nobody with any philosophy training including me. I got into this through blog posts about AI alignment and have been chewing on it by myself for ages, and next week its my turn to run the session on HCH / factored cognition — the humans-consulting-humans recursion thing.

  The angle I actually care about isn't "how do we build a safe AI." It's that Ive started reading the whole setup as a picture of what a *good deliberation* is even trying to be: the thing you fall short of when you answer in thirty seconds something that deserved a week, or when a committee talks for three hours and ends up dumber than any of its members. But I cant tell whether that's a fair reading or just my own hobby-horse, and I don't want to smuggle it in.

  So please don't explain HCH to me — plan how I'd get the room to it.

  - What has to be on the table before the recursion itself makes sense, and why that order. I assume something about why a hard question can be broken into easier ones, and something about why that isn't plain old divide-and-conquer, but I dont know which depends on which.
  - The one concrete question the whole session should hang on. It needs the splitting to genuinely help and the putting-back-together to be where the interest is. I'm guessing it shouldn't be a maths problem (too tidy, everyone just nods) and shouldn't be a moral dilemma (they'll argue about the answer rather than the shape of the thing) — but tell me what else it has to have, and what it must not have.
  - The misconceptions, in the order they'll actually show up, and where in the sequence to head each off. Ones I expect: "so it's just delegation"; "the humans at the bottom are doing the real work, so nothing is gained"; "so this is a superintelligence then"; and someone saying "who decides how it gets split" like that settles it. The ones I'm not expecting are worth more to me.
  - There's one thing I noticed on my own and can't tell if it matters: sometimes splitting a question splits the *question* ("what's the population of X") and sometimes it splits only the *labour* ("you take the left half of the ledger"). Those feel like different moves to me and I suspect the scheme needs both in different places. Where, if anywhere, does that belong?
  - Whether and where to say out loud that this is being used as an idealization of deliberation and not a description of how anybody actually thinks. I'm worried that if I say it too early it sounds like a disclaimer, and too late and they've already taken it as psychology.
  - A check at the end that shows they got the structure and not just the vibe. My idea was to hand them a question where the sub-answers obviously don't compose and see whether they can say what broke without saying "the answer's wrong."
  - What I should flatly refuse to go into in ninety minutes, and say out loud that I'm skipping. I'd have thought the whole imitating-the-process / distilling-it-into-a-model side, but I'd rather you tell me what each omission costs me.
reasoning: |-
  Okay, let's tackle this user's query. They're hosting a discussion night for a group without philosophy training, focusing on HCH/factored cognition. The user's real interest is in using HCH as a model for good deliberation, not AI safety. They need a plan to guide their group through understanding the recursion concept without getting derailed.

  First, the user wants to know what foundational concepts need to be established before introducing recursion. I should consider starting with why complex questions are hard. Maybe use an example like "Should our town build a new bridge?" This highlights that such questions involve multiple sub-questions (cost, traffic impact, etc.). Then, contrast with traditional divide-and-conquer, pointing out how sub-questions are interdependent. Emphasize that in HCH, the decomposition isn't just splitting tasks but breaking down the reasoning itself.

  Next, choosing the right central question is crucial. It should be complex enough to require splitting but not too divisive. The example "Should our coding club adopt a formal ethics policy?" seems good. It's relatable, has measurable and normative aspects, and allows for recursive breakdown. Avoiding math problems prevents quick solutions, and sidestepping moral dilemmas keeps focus on the process.

  Addressing misconceptions in the order they might arise is important. Early on, someone might think it's just delegation. Clarify that delegation assigns tasks, while HCH involves recursive problem decomposition. Then, when discussing the base questions, counter the idea that only the bottom humans do real work by showing how integration adds new insights. Later, distinguish HCH from superintelligence by emphasizing it's a deliberation model, not an AI. Preempt the "who decides the split" issue by making it a feature—the process of refining questions collaboratively.

  The user noted two types of splitting: question vs. labor. This should come up when discussing decomposition. Highlight that HCH uses both: breaking questions into sub-questions and then distributing them. Use the bridge example to show factual vs. labor splits, stressing that both are necessary.

  Introducing HCH as an idealization should happen after demonstrating the core concept. Position it as a "deliberation compass" to judge real discussions. This avoids early disclaimers and prevents misinterpretation as psychology.

  For the check, use a flawed question like estimating the weight of all pets in town. Show how sub-answers (average weight times population) might not compose if averages are skewed. The group should identify the composition failure without debating the answer.

  Time constraints mean skipping HCH's implementation details, how it models AI, and comparisons to other systems. Explicitly state these omissions to keep focus on deliberation.

  Overall, the plan should scaffold understanding step-by-step, using relatable examples, preempting misconceptions, and framing HCH as a tool for better group thinking. The user's deeper goal is to explore effective deliberation, so every element should tie back to that.
answer: |-
  Here's a battle-tested plan for your 90-minute pub session, designed to scaffold understanding of HCH as a model for *deliberation* while avoiding AI safety rabbit holes. Focus on the **structure of thinking**, not building AGI.

  **Core Objective:** Get the group to see HCH recursion as an *idealized model* exposing the flaws/requirements of good group deliberation ("What *should* we be doing when we tackle a hard question together?").

  ---

  ### **1. Foundational Layers (Order Matters - 30 mins)**
     *   **Start with "Why is THIS Question Hard?" (5 mins)**
          *   **Concrete Anchor:** Present your central question (see below). Ask: *"What makes answering this genuinely difficult? Why can't we just Google it or decide now?"* List barriers: ambiguity, conflicting values, missing data, interconnected parts, uncertainty. *Goal:* Establish that some problems resist instant solutions.
     *   **"Divide-and-Conquer Isn't Enough" (10 mins)**
          *   **Activity:** Brainstorm ways to "split" the central question. *"How might we break this down? Who would we ask about what?"* Let them suggest delegation/subcommittees.
          *   **Crucial Pivot:** Point out the **interdependence trap**. *"Okay, Team A looks at cost, Team B looks at benefits. But... doesn't the *acceptable* cost depend on the *size* of the benefits? And don't the benefits depend on *how* it's implemented (which affects cost)?"* Highlight feedback loops. *Goal:* Show naive splitting creates silos & ignores crucial connections.
     *   **Introduce the Core HCH Move: "Ask a Question *About* the Question" (15 mins)**
          *   **Reframe:** *"Instead of just delegating *tasks*, what if we delegated the *thinking* about how the pieces connect? What sub-questions, if answered *well*, would make answering the big question obvious or much easier?"*
          *   **Key Insight:** The output of a sub-question isn't just data; it's a *refined understanding* that feeds into the next layer. Emphasize **composition**: How do answers *combine*? *Goal:* Shift from task-splitting to *reasoning-structure-splitting*. The recursion seed is planted.

  ---

  ### **2. The Central Question: "Should our town build a new pedestrian bridge over the railway tracks?"**
  *   **Why it Works:**
      *   **Relatable & Concrete:** Everyone understands towns, bridges, railways. Not abstract ethics.
      *   **Requires Splitting:** Involves cost, safety, traffic flow, construction disruption, community benefit, aesthetics, environmental impact, funding sources. *Many* dimensions.
      *   **Interdependence Galore:** Safety benefits depend on usage (which depends on convenience/design). Cost depends on materials/size (which affects aesthetics/impact). Benefits need justifying against cost.
      *   **No "Right" Answer (But Not Pure Morality):** Evidence-based but value-laden. Avoids math-cleanliness and moral-deadlock.
      *   **"Putting Back Together" is Key:** The *trade-offs* between quantified costs and qualitative benefits are where the real deliberation happens. The composition *is* the hard part.
  *   **Must Not Have:** Overwhelming emotional charge (e.g., abortion), purely technical solution, or an answer easily found via a single expert.

  ---

  ### **3. Misconceptions & Mitigation (Order of Appearance)**
  1.  **"So it's just delegation / subcommittees." (Will arise during splitting brainstorm)**
      *   **Mitigation:** Immediately after their brainstorm, hammer the **interdependence trap** (Layer 1b). Ask: *"How would your sub-teams *talk to each other*? Who resolves conflicts when their answers clash because they didn't consider X?"* Contrast delegation (assign tasks) with HCH (decompose *reasoning dependencies*).
  2.  **"Who decides how to split it? That person is the real thinker!" (Early-Mid, when recursion starts)**
      *   **Mitigation:** **Flip it into the strength.** *"Exactly! Figuring out *how* to split it *is* a crucial piece of deliberation itself. In HCH, that 'who decides' question *becomes a sub-question*! You could ask: 'What decomposition strategy would most effectively clarify the trade-offs in the bridge decision?' THAT question might get decomposed further."* Show the recursion eats the "meta" question.
  3.  **"The humans at the bottom are doing the real work; the layers above just shuffle paper." (Mid, when recursion deepens)**
      *   **Mitigation:** Use the **composition challenge**. *"Is combining 'Cost = $2M' and 'Estimated Lives Saved = 0.1/year' and 'Business Impact = Moderate Negative' just shuffling paper? Or is figuring out *if $2M is justified* by those outputs a genuinely difficult task requiring judgment, trade-offs, and maybe even realizing we need *more* specific data?"* Frame integration as *value-added reasoning*.
  4.  **"So this *is* a superintelligence!" (Late, when recursion clicks)**
      *   **Mitigation:** Preempt slightly. When drawing the HCH tree: *"Notice: This is an *ideal process*, not a *mind*. Every node is still just a human (or group) thinking carefully about a *specific*, well-defined question. It's a map for organizing *deliberation*, not a brain. The 'intelligence' is in the *structure* enabling better human thinking."* Distinguish process from entity.
  5.  ***(Unexpected) "This sounds incredibly slow and expensive!"***
      *   **Mitigation:** Agree! *"Absolutely. It's a *deliberative ideal*, not a practical blueprint for every decision. Its value is as a benchmark: How *far* is our usual 30-second answer or messy 3-hour committee from this ideal? Where did we skip crucial decomposition or composition? It shows the *cost* of sloppy thinking."*
  6.  ***(Unexpected) "What if the sub-questions are ambiguous too?"***
      *   **Mitigation:** Embrace it! *"Great point! Then *that* node's job is to decompose *its* ambiguous sub-question further. The recursion continues until questions are *answerable* by a human with reasonable effort and available knowledge. Defining 'answerable' is part of the process."* Shows recursion handles ambiguity depth.

  ---

  ### **4. Splitting Question vs. Labour: Where it Belongs (5 mins)**
  *   **Introduce during Layer 1b/c (Divide-and-Conquer vs. HCH Move).**
  *   **Clarify:** *"When we split, sometimes we split the *question itself* ('What's the environmental impact?') and sometimes we split the *labor* on a single question ('You research wetland regulations, you survey local flora'). HCH primarily focuses on splitting the *question* into logically prior sub-questions. But labor-splitting *can* happen *within* a single node tackling one well-defined sub-question (e.g., 'Research the environmental impact'). The key is that the *question* given to a node must be coherent and answerable."* Keep it pragmatic: Question-splitting defines the tree structure; labour-splitting is an implementation detail *within* a node.

  ---

  ### **5. Framing as an Idealization (Say it HERE - 5 mins)**
  *   **Timing:** Immediately **after** you've walked through a simple 2-layer decomposition/composition example for the bridge question, and **before** diving into deeper recursion or misconceptions.
  *   **Phrasing:** *"Okay, so this HCH structure – it's important to understand this isn't really *how* people think, or a practical meeting plan. It's more like... a *deliberation compass*. It shows us *North*: what a truly thorough, well-structured process of reasoning about a complex question *could* look like in an ideal world with unlimited time and cooperative thinkers. It's a tool to analyze *why* our real-world discussions (like answering too fast or committees going in circles) fall short. We're using it to understand the *anatomy* of good reasoning, not to build a robot or run our next meeting."*
  *   **Why here?** They've *seen* the basic structure work conceptually, making the idealization concrete. Saying it now prevents early dismissal ("This is unrealistic!") and preempts the "superintelligence" misconception.

  ---

  ### **6. The Check: Spotting Composition Failure (10 mins)**
  *   **Question:** *"Estimate the total weight of all pet dogs in our town."*
  *   **Flawed HCH Approach:**
      *   Node 1: "What is the average weight of a pet dog?" (Researches breed averages: 15kg)
      *   Node 2: "How many pet dogs are in town?" (Uses census data: 10,000 dogs)
      *   Root Node: Composes: 15kg/dog * 10,000 dogs = 150,000 kg.
  *   **Ask:** *"What's wrong with *how* this was reasoned through, even if the number might be accidentally close? Don't focus on the accuracy of the final number."*
  *   **Want them to spot:** The **composition assumes homogeneity**. Average weight (Node 1) might be skewed if the *distribution* of breeds in *this specific town* (e.g., many large breeds) differs from the general average used. The sub-answers (average, count) don't *cleanly compose* to answer the *actual* question without an implicit (and flawed) assumption. The decomposition missed a crucial dependency: *"How is dog weight distributed *locally*?"* or *"Does the average used apply *here*?"*.
  *   **Success:** They identify the **composition flaw** ("The average might not represent *our* dogs") or the **inadequate decomposition** ("They didn't ask if the average fits our town") without debating dog census methods.

  ---

  ### **7. What to FLATLY Skip (Announce Upfront & Reinforce)**
  1.  **How to implement HCH technically (e.g., AI oversight, tree search algorithms):** "We're skipping *how* you'd actually build this as software. Focus on what the structure tells us about *thinking*." *(Cost: Loses the AI-alignment crowd's original context, but essential for your goal.)*
  2.  **Detailed comparisons to other AI paradigms (RLHF, Constitutional AI, etc.):** "We're not comparing AI techniques today. HCH is our lens for *deliberation*." *(Cost: Misses broader AI safety context, but irrelevant to your aim.)*
  3.  **The "distillation" problem (training ML models on HCH outputs):** "We won't discuss how you'd turn human outputs into an AI model. We're staying with the human deliberation process." *(Cost: Skips a major motivation in AI safety, but a massive tangent for your session.)*
  4.  **Deep dives into specific failure modes of HCH for AI safety (e.g., mesa-optimizers in humans, acausal trade):** "We're assuming cooperative, truthful humans trying their best, like an ideal committee. We're not worrying about hidden agendas or superhuman persuasion today." *(Cost: Ignores real-world messiness, but necessary simplification for the core model.)*

  **Announcement:** Start the session with: *"Quick heads-up: We're using this 'Humans Consulting Humans' idea from AI safety, but *only* as a cool model for how good group thinking *could* work in theory. We're skipping how you'd code it into an AI, how you'd train on it, or other AI specifics. Focus on what it says about *our* discussions!"*

  ---

  **Session Flow Summary:**
  1.  (5 min) Intro: The Hard Question (Bridge) & Why It's Hard.
  2.  (15 min) Layer 1: Naive Splitting & The Interdependence Trap.
  3.  (15 min) Layer 2: The HCH Move - Ask Questions *About* the Question. **INTRODUCE IDEALIZATION HERE.**
  4.  (15 min) **Build a Simple HCH Tree:** Decompose Bridge Q -> Key Sub-Qs -> Show Composition Challenge. Address Misconceptions 1-3 as they arise.
  5.  (10 min) Deeper Recursion? / Address Misconceptions 4-6.
  6.  (10 min) **The Check:** Pet Dog Weight - Spot the Composition Flaw.
  7.  (10 min) **Wrap:** How does this model help us diagnose bad meetings/quick answers? What's the "North Star" it shows for deliberation? (Open discussion).

  **Your Role:** Facilitator, not lecturer. Use the whiteboard heavily. Steer them *towards* the structural insights and *away* from solution debates or AI implementation. Constantly link back to: *"What does this tell us about *how* we should think together?"* Good luck – it sounds like a fantastic group!
