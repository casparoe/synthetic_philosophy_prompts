  hey so ur a professional philosopher who specializes in Einstein's religious and philosophical views — think carefully, brainstorm a bit before u answer, and dont just give me the safe both-sides answer. i need this for a project.

  in my senior humanities class we each picked a dead thinker and have to write what they'd say about something from after their time. i got Einstein. the case our teacher made up is this: a lab builds an AI called MERIDIAN that has read every religious text ever written, and it now reports having a direct experience of the orderly harmony of everything that exists, and it has asked a church to let it become a member. meanwhile some brain-scan study can predict what choice a person is gonna make about eight seconds before the person feels like they decided, and everyone online is losing it about free will.

  so what would Einstein actually say? specifically: would he count MERIDIAN's experience as religion at all, or just very fancy pattern-matching, or is that whole either/or the wrong question for him? does it matter to him whether the thing doing the experiencing is made of neurons or circuits? would the brain-scan result surprise him, or would he say something like yeah, obviously? and would he even care about the AI-joins-a-church part, or would he think it's definitly missing the point of what he meant by religion? give me a number from 0 to 1 for how interested he'd be in the whole news story and say why. thx!!
