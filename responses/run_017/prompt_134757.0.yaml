answer: |-
  ### Translation to Causal-Inference Framework

  **Target Trial Emulation**  
  - **Intervention:** Implementation of a standardized insect welfare intervention (e.g., habitat modification reducing acute suffering) across all ecosystems.  
  - **Counterfactual Contrast:** Intervention vs. status quo (no targeted welfare action).  
  - **Primary Outcome:** Discounted welfare-capacity-years (WCY), defined as integrated valenced experience (positive/negative) per unit time.  
  - **Population:** All insects alive during the study period.  
  - **Time Horizon:** Fixed duration (e.g., 10 years) with continuous outcome assessment.  
  - **Analysis Set:** Entire insect population under intention-to-treat, with weights for sentience probability.  

  **Expected Value Decomposition**  
  The expected welfare impact (Δ) of the intervention is:  
  *E[Δ] = P(S) × E[WC | S] × E[N × T]*  
  - *P(S)*: Prior probability of insect sentience (0.001–0.1).  
  - *E[WC | S]*: Expected welfare capacity per sentient insect-year (in WCY units), conditional on sentience.  
  - *E[N × T]*: Expected insect-years exposed (population size × mean survival time).  

  The astronomical number (*N ≈ 10¹⁸*) multiplies *E[N × T]*, scaling the product *P(S) × E[WC | S]*.  

  **Variance Structure**  
  Uncertainty propagates multiplicatively:  
  - *Var(E[Δ])* is dominated by covariance terms in *log(P(S))*, *log(E[WC | S])*, and *log(E[N × T])*.  
  - The distribution of *E[Δ]* is **log-normal** with heavy tails:  
    - 5th percentile: *P(S) = 0.001*, *E[WC | S]* at lower bound (e.g., minimal capacity), low *N × T*.  
    - 95th percentile: *P(S) = 0.1*, *E[WC | S]* at upper bound (e.g., vertebrate-equivalent), high *N × T*.  
  - **Decision Consequences:**  
    - Expected value optimization ranks insect interventions highest due to *E[N × T]* term.  
    - Under model uncertainty, the CI for *E[Δ]* spans *>99%* of total expected welfare affectable by humans (upper tail) to *≈0* (lower tail).  
    - Value-of-information analysis shows research targeting *Var(P(S))* and *Cov(P(S), E[WC | S])* dominates direct action when the prior’s geometric SD exceeds 3×.  

  ---

  ### Residue Report

  #### 1. Surrogate Validity and Transportability  
  **What the Framework Can Address:**  
  - Surrogates (nocifensive behavior, etc.) are indirect measurements of latent sentience (η).  
  - Transportability requires *η*-equivalence across species: *P(Y | S, X) = P(Y | S, X')* for insects (X) vs. humans (X').  
  - Without joint identifiability of η (no gold standard in target), **transport is unverifiable**. The causal diagram has an unmeasured confounder (evolutionary divergence) blocking transport.  

  **Limitations:**  
  - Surrogate validation theory requires *at least one population* with identified η. Here, only humans have η observed (via self-report).  
  - *P(S)* is not an estimand; it is a **hyperprior over model structures**. Plugging *P(S)=0.001* is not estimation but sensitivity analysis.  
  - **Verdict:** Your suspicion is correct. Below a validity threshold (e.g., partial correlation <0.3 between surrogate and η), *P(S)* loses its epistemic grounding. The framework flags this as *non-identifiable transport*, not conservative uncertainty.  

  #### 2. Unit of Analysis  
  **Impact of Unit Choice:**  
  - Insect-lives: Magnitude driven by birth/death rates. High mortality implies most welfare loss occurs in early life.  
  - Insect-years: Magnitude driven by mean lifespan. If 99% die in <1 hour, *E[N × T]* shrinks by ~4 orders of magnitude vs. total lives.  

  **Framework Constraints:**  
  - The choice is **not forced** by the math. Welfare theory must specify whether the outcome is cumulative (time-at-risk) or event-based (lives).  
  - Instrumental variable approaches cannot resolve this; it requires an external theory of moral weights.  
  - **Implication:** Scale argument robustness depends entirely on the *assumed welfare aggregation function*. No statistical test can arbitrate.  

  #### 3. Identification of Total Effects  
  **Direct vs. Total Effects:**  
  - Intervention *I* (e.g., reduced pesticides) affects welfare *W* through mediators: land use (*M₁*), predator dynamics (*M₂*), etc.  
  - Standard mediation (e.g., Pearl’s PDE) requires *sequential ignorability*: no *I*-*M*-*W* confounders.  
  - **Failure:** Ecosystem feedback loops violate exogeneity (e.g., *M₂* affects *I* via pest resurgence). This is a *non-ignorable mediator-outcome confounder*.  

  **Epistemic vs. Metaphysical Uncertainty:**  
  - *Sign reversal* (e.g., intervention increases predation) is epistemic in principle—soluble with perfect ecological models.  
  - **Metaphysical residue:** If "sentience" has vague boundaries (e.g., emergent in colonies but not individuals), the counterfactual *W* is undefined. Identification theory assumes well-defined outcomes; it cannot parse ontological indeterminacy.  

  #### 4. Linear Aggregation Across Branches  
  **Role of Linearity:**  
  - *E[Δ] = ∫ P(θ) Δ(θ) dθ* is linear in probabilities. This is **essential** to the argument: non-linear weighting (e.g., *min(P(S), 0.01)*) would suppress small *P(S)*.  
  - Population-level QALY models exclude risk aversion across moral gambles. They assume constant marginal value of welfare.  

  **Gap Analysis:**  
  - The framework *can* incorporate risk aversion via utility functions (e.g., *U(E[Δ]) = E[Δ]¹⁻ᵟ*), but this is normative, not empirical.  
  - **Residue:** Your framework treats all uncertainties as commensurable probabilities. It cannot natively handle "incommensurable stakes" objections without ad hoc transformations.  

  ---

  ### Verdict  
  **The scale argument is structurally sound within your framework but critically dependent on non-empirical premises at two nodes:**  
  1. **The interpretation of *P(S)*** as a legitimate probability (rather than a placeholder for model uncertainty).  
  2. **The choice of welfare aggregation unit** (lives vs. time-at-risk), which is undeclared in the argument.  

  **The unresolvable flaw is transportability failure for sentience surrogates.** This is not missing data but a **lack of identifiability conditions**: no feasible experiment can validate cross-phylogeny surrogates without access to the latent outcome. Consequently:  
  - *P(S)* cannot be improved by better insect neuroscience alone.  
  - The expected-value calculation is internally coherent but rests on an untestable prior.  
  - Value of information remains high, but only if one accepts *P(S)* as a meaningful input.  

  **Thus, the argument cannot be fully operationalized for prioritization without importing external philosophical commitments.** The framework exposes where evidence reaches its limits—it does not create those limits.  

