prompt: |-
  Hey — I'm a judicial clerk at a state supreme court and I've got a twenty-buck bet with the clerk across the hall about how one of our justices is going to vote in a notice case that's being argued next month. I've gone through her statutory-interpretation opinions and I can't settle on the rule she's actually running, because she does textualist-looking things and purposivist-looking things in a pattern that matches neither label cleanly. Here's the track record: everything is anonymised, the quotes are paraphrases from my notes rather than anything verbatim, and I've nudged a few facts so it isn't searchable — please don't try to look any of it up.

  - Bike paths. The Bike Safety Act bans operating a "motorized vehicle" on a public bike path. She held that a throttle-assisted delivery e-bike is covered: she used dictionaries from the year of enactment, said "motorized" is the word doing the work, and said the Act's short title can't narrow the operative words. She added that the parks department's fifteen-year practice of treating e-bikes as bicycles "cannot outvote the enacted text."
  - Same Act, next case. A powered wheelchair ridden by someone who can't walk: not covered, even though everyone concedes it is literally a motorized vehicle. Her reasons were that the Act is about traffic speed and path safety, and that reading it to catch wheelchairs would put it in collision with the state's accessibility statute.
  - Landlord notice. A statute requires that a notice to quit be "in writing, delivered to the tenant's dwelling." The landlord emailed the notice and also taped a paper copy to the door; the tenant admitted in open court that she opened the email the day it was sent. She held the notice invalid: "written" means paper, delivery means delivery to the dwelling.
  - Valet. A local ordinance charges a fee on "operators of commercial parking facilities." A valet-only service that parks cars on public streets and owns no lot: not covered. She said the drafters' failure to name the category "is not ours to repair," and she refused to look at the council committee report saying valet services were meant to be included.
  - Crypto. An anti-money-laundering act imposes duties on "financial institutions." A crypto exchange: covered. Her reasoning was that this is a general category whose membership has to be tracked as business models change, that the legislature had amended the act twice to keep pace with new kinds of intermediary, and that the point of the act — a paper trail for suspicious flows — would be gutted otherwise.
  - Scrivener's error. A penalty provision cross-references "Section 4(b)," but the conduct it obviously targets sits in 4(c). She applied it to 4(c), saying the text read as a whole cannot bear the cross-reference, while again refusing to consult the drafting committee's notes.
  - Vulnerable adults. The Protection of Vulnerable Adults from Financial Exploitation Act penalises "any person who obtains property from an adult by undue influence." A caregiver who received a large gift from a fully competent fifty-year-old with no disability: not covered. She leaned hard on the title and the preamble.

  The new case: that same landlord-notice statute was amended six years ago to add that notice may be given by electronic mail "if the tenant has designated an electronic address in the lease." In our case the lease contains no email address, but the tenant has paid rent through the court system's own online portal for three years, logs in most weeks, and has replied to two earlier notices-to-cure that the landlord sent through that portal. The landlord served the notice to quit only through the portal; the tenant opened it the same day and the system logged both delivery and the read.

  What I want from you isn't "she's a textualist" or "she's a purposivist" — those labels predict opposite outcomes here and each is consistent with most of the list, which is exactly my problem. Give me the two or three genuinely distinct decision-rules that fit her whole track record, say what each one predicts about the portal case, and tell me which you'd bet on and why — in particular, how each rule has to explain the email-notice case and the crypto case, since those seem to pull against each other (one is a general term applied to something new, the other is a specified manner of notice that wasn't followed, and I can't tell whether she treats those as the same move or different ones). Then tell me the one further fact-pattern I should watch for that would finally separate the rules that survive. If you think her precedents genuinely underdetermine the case, say that too, and say what she'd be committing herself to either way.
reasoning: |-
  Okay, let me tackle this judicial clerk's problem. They're trying to predict how a state supreme court justice will vote in an upcoming notice case. The clerk has provided seven anonymized cases showing the justice's approach to statutory interpretation, and there's a pattern that doesn't neatly fit textualism or purposivism. The key is to identify distinct decision-rules that explain all these cases and apply them to the new portal case.

  First, I need to parse each case to spot patterns. The Bike Path case used dictionary definitions and rejected administrative practice. But then the Wheelchair case ignored literal text for purpose and harmonization. The Landlord Notice case insisted on strict textual compliance. The Valet case refused to expand a term beyond its plain meaning. Crypto expanded a general term to cover new technology based on legislative intent and purpose. Scrivener's Error corrected a textual inconsistency without extrinsic aids. Vulnerable Adults used the title and preamble to narrow the statute's scope.

  The tension is clearest between Crypto (broad purpose-driven reading) and Landlord Notice (strict textual reading). How can both coexist in one approach? Maybe the justice distinguishes between core textual commands and terms meant to evolve, or uses purpose only when text creates ambiguity or absurdity.

  Looking at the new case: same statute as Landlord Notice, amended to allow email if designated in lease. Tenant used portal for rent and prior notices, but lease lacks email designation. Portal delivery was logged as received and read. Strict textualism would say no designation in lease = invalid. But the Crypto case suggests purpose matters when text is general. Here, the purpose is actual notice. Yet Landlord Notice was strict even when tenant admitted receipt. But that was pre-amendment; now electronic notice is partially authorized. The amendment's condition (designation in lease) might be jurisdictional, or maybe practical assent through use suffices.

  Possible decision-rules:
  1. **Text-as-enacted supremacy with absurdity/harmonization override:** Default to original public meaning unless it creates internal conflict (Wheelchair) or absurdity (Scrivener's Error). Portal case: lease lacks designation, so text controls - invalid notice. But Crypto complicates this by updating general terms.
  2. **Contextual functionalism:** Interpret text through its function in the regulatory scheme. If a reading would defeat core purpose (Crypto) or create systemic conflict (Wheelchair), adapt; else stick to text. Portal: actual notice achieved through established channel, so valid despite lease gap. But Landlord Notice’s “delivery means delivery” resists functionalism.
  3. **Rule-bound pragmatism:** Prefers bright-line rules (Landlord Notice, Valet) unless text is internally inconsistent (Scrivener’s Error) or purpose is manifest in statute itself (Vulnerable Adults title). Portal: lease designation is a clear precondition, so invalid. Crypto’s update might fit as avoiding obsolescence of broad terms.

  Resolving Crypto vs. Landlord Notice: Crypto’s “financial institutions” is an evolving category, while notice methods are fixed formalities. The justice might see electronic notice as requiring strict compliance because legislature carved a specific exception. Portal use isn’t email "designated in lease," so no exception applies.

  For the new case, I'd predict invalid notice. Landlord Notice set a high bar for formality, and the amendment’s specific condition (lease designation) wasn’t met. Tenant’s portal use might show assent, but the justice’s textualism in formal procedures seems rigid.

  To distinguish between rules, watch for a case where text is clear but applying it would undermine a statute’s manifest purpose without absurdity. If she still sticks to text, she’s a rule-bound textualist; if she adapts, she’s contextual.
answer: |-
  Based on her track record, your justice operates with a sophisticated, context-sensitive approach that defies pure textualism or purposivism. Her decisions reflect **three distinct but overlapping decision-rules**, each predicting different outcomes in the portal case. Crucially, she treats **general terms** (like "financial institutions") differently from **specific procedural commands** (like notice requirements), resolving the Crypto/Landlord tension.

  ---

  ### **Decision-Rule 1: Textual Fidelity with Purpose-Driven Exceptions**  
  **Core Logic:**  
  - Default to ordinary meaning at enactment (Bike Paths, Landlord Notice).  
  - **Override text only if:**  
    (a) It creates *irreconcilable conflict* with another statute (Wheelchair) or *internally* (Scrivener's Error);  
    (b) Literal application would *defeat the statute's manifest purpose* (Crypto, Vulnerable Adults).  
  - Rejects extrinsic evidence (Valet, Scrivener's Error) unless purpose is ambiguous.  

  **Prediction for Portal Case:**  
  - **INVALID NOTICE.**  
    - Text: "designated in the lease" is unambiguous. Tenant's portal use ≠ lease designation.  
    - Purpose: No statutory conflict or absurdity (tenant received notice, but formality trumps actual notice per *Landlord Notice* precedent).  
    - *Crypto* is distinguished: "Financial institutions" is a broad *category* requiring evolution; "designated in the lease" is a *specific condition*.  

  **Strengths:**  
  - Explains *Landlord Notice* (strict formality) vs. *Crypto* (purpose updates general term).  
  - Fits her refusal to repair omissions (Valet) unless text/purpose demands it (Scrivener's Error).  

  ---

  ### **Decision-Rule 2: Contextual Formalism**  
  **Core Logic:**  
  - Text controls, but "meaning" is determined by **regulatory context and statutory structure.**  
    - *Formal procedures* (notices, deadlines) demand strict compliance (Landlord Notice).  
    - *Evolving regulatory terms* ("financial institutions," "motorized vehicle") adapt to context (Crypto, Wheelchair).  
  - Legislative history excluded as unreliable (Valet), but titles/preambles define scope (Vulnerable Adults).  

  **Prediction for Portal Case:**  
  - **VALID NOTICE.**  
    - Tenant’s consistent portal use for rent/notices functionally "designated" it as an electronic address.  
    - Statute’s purpose (actual notice) achieved; lease omission is a technicality overridden by conduct.  
    - *Landlord Notice* distinguished: Email wasn’t authorized *at all* then; now electronic notice is partially permitted.  

  **Strengths:**  
  - Explains *Wheelchair* (context: accessibility > traffic safety) vs. *Bike Paths* (no competing policy).  
  - *Crypto*’s update fits evolving terms; *Landlord Notice*’s rigidity fits procedural rules.  

  ---

  ### **Decision-Rule 3: Rule-Bound Pragmatism**  
  **Core Logic:**  
  - Prefers **bright-line rules** for predictability, *except* where text leads to:  
    (a) Absurdity (Scrivener's Error),  
    (b) Grave injustice (Wheelchair), or  
    (c) Regulatory dysfunction (Crypto).  
  - Titles/preambles define boundaries (Vulnerable Adults), but dictionaries anchor meaning (Bike Paths).  

  **Prediction for Portal Case:**  
  - **INVALID NOTICE.**  
    - "Designated in the lease" is a bright-line rule; tenant’s conduct creates ambiguity.  
    - No absurdity/injustice: Tenant received notice but statutory form wasn’t followed.  
    - *Crypto* is the exception (dysfunction), not the rule.  

  **Strengths:**  
  - Explains rejecting administrative practice (Bike Paths) and legislative history (Valet) to avoid subjectivity.  
  - *Vulnerable Adults* uses title as a boundary fence; *Scrivener’s Error* fixes clear drafting flaws.  

  ---

  ### **Which Rule Wins? My Bet**  
  - **Bet on Decision-Rule 1 (Textual Fidelity with Exceptions).**  
    - **Why:** It best reconciles her "inconsistencies":  
      - *Landlord Notice* and *Crypto* aren’t in tension—they represent **different statutory types**. She strictly enforces *procedural formalities* (Landlord) but flexibly interprets *regulatory categories* (Crypto).  
      - Portal case mirrors *Landlord Notice*: A notice statute with exact requirements. Tenant’s conduct won’t override "designated in the lease" (per *Bike Paths*: "practice cannot outvote text").  
    - **Odds:** 70% she votes **INVALID**. Her formalism in procedural contexts is unwavering.  

  ---

  ### **The Decisive Fact-Pattern to Watch**  
  To definitively separate Rules 1 and 2, watch for a case with:  
  > **"A clear textual command that, if applied literally, would *mildly undermine* the statute’s purpose—without absurdity or conflict."**  

  - **Example:** A notice statute requires "posting in the courthouse lobby." Plaintiff posts it on a bulletin board *inside* the lobby but obscured by a pillar. Defendant admits seeing it.  
    - **Rule 1 Predicts VALID:** Text satisfied ("in the lobby"); no conflict/absurdity.  
    - **Rule 2 Predicts INVALID:** Purpose (actual notice) defeated by poor placement; context overrides text.  
    - *Your justice’s choice*: If she upholds validity, Rule 1 wins. If not, Rule 2 wins.  

  Until then, her precedents *underdetermine* the portal case, but Rule 1 is marginally safer. By voting "invalid," she commits to **textual primacy in procedural settings**. Voting "valid" would signal **contextual assent trumps formality**—a shift from *Landlord Notice*.  

  ---  
  **Final Thought:** Her jurisprudence resembles "textual-purposeivism" (Barak) or "fidelity to text in context" (Eskridge). Labels aside, she’s consistent: **Procedures are rigid; definitions are fluid.** Bet your $20 on "invalid."
