  For the contested parts:  
  - Yes, specialists debate whether Landauer’s principle is fundamental or derivative. Some (like Ladyman, Norton) argue it’s circular; others (Bennett, Landauer) see it as foundational.  
  - Measurement *can* be reversible (Bennett’s view), but there are dissenters (like Penrose who ties it to consciousness).  
