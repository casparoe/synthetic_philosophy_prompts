answer: |-
  ### The case as you're reading it
  In variant one, a demon starts with a pre-initialized \(M\)-bit memory (all zeros). Each cycle: it detects a molecule's position in a Szilard-engine-like setup, records the result (0 or 1), extracts \(kT \ln 2\) work via gas expansion, and **never erases**. After \(M\) cycles, the register is full (a random-looking string correlated with the gas), \(M kT \ln 2\) work is extracted, and no heat is dumped. You assume the shutter operation is free, the initial memory preparation is externally provided, and the demon/piston are thermodynamically ideal. The puzzle: entropy seemingly vanishes.

  **Assumptions tightened**:  
  - The "known standard state" implies the memory’s *initial* entropy is zero.  
  - The environment’s role is ambiguous; I’ll treat it as a bath at \(T\).  

  ---

  ### Cycle-by-cycle bookkeeping  
  **Initial state**:  
  - Gas: Entropy \(S_{\text{gas}} = k \ln \Omega_0\) (equilibrium).  
  - Memory: \(M\) bits, all 0. Entropy \(S_{\text{mem}} = 0\).  

  **Cycle \(i\) (1 to \(M\))**:  
  1. **Measurement**: Demon determines molecule’s side (L/R). This is logically reversible (no entropy change *if* done ideally).  
  2. **Work extraction**: Shutter opens; gas expands isothermally, doing work \(W_i = kT \ln 2\) on the piston. Entropy *increase* of gas: \(\Delta S_{\text{gas}} = k \ln 2\) (from volume doubling).  
  3. **Recording**: Demon writes bit \(b_i\) (0=L, 1=R) to memory.  
     - *Before writing*: Memory bit is 0 (certain). Entropy = 0.  
     - *After writing*: Bit is \(b_i\) (random relative to ignorance). Entropy = \(k \ln 2\).  
     - **Entropy change for memory**: \(\Delta S_{\text{mem}} = +k \ln 2\).  
     - **Gas entropy increase** (\(\Delta S_{\text{gas}} = +k \ln 2\)) is **exported to memory**. Net system entropy change: \(\Delta S_{\text{gas}} + \Delta S_{\text{mem}} = +k \ln 2 + k \ln 2 = +2k \ln 2\).  
  4. **Heat flow**: Work \(W_i = kT \ln 2\) is extracted. To keep gas at \(T\), it absorbs heat \(Q_i = W_i = kT \ln 2\) from the bath. Bath entropy *decreases* by \(Q_i / T = k \ln 2\).  
     - **Net entropy change (gas + memory + bath)**:  
       \(\Delta S_{\text{gas}} + \Delta S_{\text{mem}} + \Delta S_{\text{bath}} = (+k \ln 2) + (+k \ln 2) + (-k \ln 2) = +k \ln 2\).  

  **After \(M\) cycles**:  
  - Work extracted: \(W_{\text{total}} = M kT \ln 2\).  
  - Gas entropy: Back to \(S_{\text{gas}} = k \ln \Omega_0\) (cyclic process).  
  - Memory entropy: \(S_{\text{mem}} = M k \ln 2\) (fully random string).  
  - Bath entropy: \(\Delta S_{\text{bath}} = -M k \ln 2\) (absorbed heat to fuel work).  
  - **Total entropy change (universe)**: \(\Delta S_{\text{total}} = \Delta S_{\text{mem}} + \Delta S_{\text{bath}} = M k \ln 2 - M k \ln 2 = 0\).  

  **The catch**: The \(M k \ln 2\) entropy in memory is **correlated with the gas’s microstate history**. While the *marginal* entropy of memory is high, the *joint* entropy of gas + memory is \(k \ln (\Omega_0 \cdot 2^M) - k \ln 2^M = k \ln \Omega_0\) (due to perfect correlation). **No entropy is destroyed**—it’s stored in correlations. But crucially, **the initial memory preparation (all zeros) had zero entropy**. This cost was paid externally *before* the experiment. If you include that reset step, you’d dump \(M kT \ln 2\) heat.  

  ---

  ### What is settled  
  Specialists universally agree on:  
  1. **Landauer’s principle**: Erasing 1 bit *must* dissipate \(\geq kT \ln 2\) heat.  
  2. **Measurement can be reversible**: No unavoidable thermodynamic cost to *acquiring* information if done quasi-statically (Bennett’s model).  
  3. **The second law is preserved** in Szilard’s engine + erasure.  
  4. **Correlations matter**: Total entropy accounts for joint states; marginal entropy isn’t additive.  
  5. **Initialized memory is a resource**: Pre-set low-entropy memory enables work extraction.  

  ---

  ### What is contested  
  **(2) Does erasure do independent work, or is it circular?**  
  - **"Circular" camp** (e.g., Norton, Earman): Landauer relabels "low-entropy reservoir" as "blank memory." The second law is presupposed, not derived.  
  - **"Independent" camp** (Bennett, Landauer): Bit erasure is *the* fundamental entropy cost. Information is physical, and counting bits explains *how* the second law is obeyed microscopically.  
  - **Lean**: Most statistical mechanics texts treat Landauer as non-circular, but philosophers often challenge this.  

  **(3) Must measurement cost anything?**  
  - **Consensus**: Measurement *can* be thermodynamically reversible (no minimum cost).  
  - **Caveat**: Real measurements (e.g., involving amplification) may dissipate, but this is practical, not fundamental.  
  - **Dissenters**: A minority (e.g., Penrose) ties measurement to consciousness, demanding irreversibility. Not taken seriously in foundations.  

  **(4) Does usable vs. correlated information matter? (Variant two)**  
  - **Specialist view (contested)**: Thermodynamic work requires *control* based on *addressable* information. Scrambling destroys usability but not correlations.  
  - **Argument for cost**: To extract work cyclically, the demon needs "fresh" bits it can read/write independently. Scrambled bits can’t be locally accessed for feedback without irreversible operations (e.g., decoding).  
  - **Argument against**: If scrambling is truly unitary (reversible), no heat is dumped, and correlations persist—but you still can’t *use* them for further work without low-entropy "slots" to write new measurements.  
  - **Lean**: Resource theory (beyond your course) formalizes this—"non-equilibrium" states (like blank memory) fuel control. **Not settled**, but most agree usable information is necessary for cyclic engines.  

  **Where I go beyond your course**:  
  - Mentioning "resource theory" (e.g., work/entropy trade-offs in correlated systems) is beyond Szilard/Landauer. It’s cutting-edge but not universally accepted as essential.  
  - The "addressability" point invokes quantum-inspired ideas (e.g., delocalized info can’t be used locally). This is reconstructed from debates (e.g., debates on Maxwell’s demon in quantum contexts).  

  ---

  ### The question to put to my TA  
  **"If the demon never erases, the entropy is stored in memory correlations. But to run *cyclically forever*, doesn’t the demon need an *infinite* supply of pre-initialized memory? If so, does Landauer’s principle add anything beyond noting that the second law requires an eternal, externally supplied low-entropy reservoir?"**  

  This forces the TA to either:  
  (a) Defend Landauer as fundamental by explaining why erasure is unavoidable for *finite* demons, or  
  (b) Admit that the "resolution" just externalizes the entropy cost—which might be circular.
