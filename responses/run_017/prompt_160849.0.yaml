answer: |-
  Look, your loophole *sounds* clever – bake in correlations at the source to fake the overlap the PBR theorem forbids. And yeah, superficially, it mirrors the superdeterminism dodge for Bell. But the cost isn't just "conspiracy", it's *universal, state-dependent correlation* undermining the entire concept of preparation. Here's why it's worse:

  Bell superdeterminism links hidden variables to future *measurement choices*. Your loophole links the hidden states of *any two systems*, regardless of origin, to their *quantum state preparations*. For your picture to hold universally, *every single time* we prepare a system in state |ψ>, its hidden variables must be precisely correlated with the hidden variables of *every other system prepared in any other state |φ>*, anywhere, anytime, in just the right way to mimic the overlap PBR forbids. This isn't just a correlation laid down once; it's a global, dynamically enforced rule that the hidden states of *all* systems, prepared independently *in practice*, are perpetually fine-tuned to each other's *intended* quantum states. It makes the hidden variables of a system depend not just on its own preparation history, but on the preparation history of *every other system* it might eventually be measured alongside – a profound, non-local conspiracy against preparation autonomy.

  The extra cost? **Preparation becomes impossible.** In standard physics, preparing a system isolates its state. Your view implies we *cannot* ever prepare two systems truly independently, *even in principle*. The hidden variables "know" about each other's designated quantum states across space and time. Bell superdeterminism breaks local causality for measurement settings. Your view breaks the causal independence of *state preparation itself* for *all* systems. It implies the universe enforces a hidden, global correlation network specifically keyed to our *descriptions* (the quantum states), making those descriptions physically real *by proxy* in the most baroque way possible. Why not just let the quantum state *be* the physical state? It's vastly simpler and doesn't require this universal, pre-established harmony of hidden variables. What specific, universal physical law enforces these correlations without referencing the quantum state it's supposedly reducing to ignorance?
