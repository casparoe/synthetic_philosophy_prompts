prompt: |-
  Bit of an odd request but here goes. I finished a clerkship over the summer and in January I start as a staff attorney at a state supreme court, and the judge I'll be working for has asked each of us to write a one-page memo on our own interpretive methodology before the next argument sitting — she says she wants to know in advance where we'll predictably disagree with her. I've been trying to write mine and I keep finding that the pieces don't obviously fit together. A friend from law school who is a committed purposivist read my draft and said it's just purposivism with extra steps and that I'm kidding myself; I dont think she's right, but I cant tell which bit she's pointing at. I mostly absorbed this stuff from half-reading a well-known textualist treatise in law school and then copying the judge I clerked for, so it's entirely possible I've picked up things that don't cohere. Here's roughly where I land:

  (1) The meaning of a statute is what a competent, legally informed reader at the time of enactment would have taken the words to convey. It's fixed at enactment and doesn't get updated, so for new technology I ask what the enacting-era reader would have understood the relevant kind to cover, and I don't buy dynamic updating.
  (2) Relatedly, I never read legislative history: no committee reports, no floor statements, no sponsor's statements.
  (3) But I am fine with dictionaries, corpus-linguistics searches, treatises, and how the same phrase was used in neighboring statutes around the same time.
  (4) I think you're also allowed to ask what that reader would have expected the words to cover in a case like the one in front of you, not just their dictionary sense — so in the old no-vehicles-in-the-park hypothetical I'd want to know whether an enacting-era reader would have understood the ban to reach an ambulance driving in to reach someone having a heart attack.
  (5) I like the absurdity doctrine and the scrivener's-error fix: where literal application would be genuinely absurd the court should read it sensibly. I'd include the old style of case where a statute bans importing foreign contract laborers under a contract for labor or service and a congregation hires a minister from abroad — I think it shouldn't apply there even though the words on their face cover it.
  (6) I think constitutional avoidance and clear-statement rules are legitimate and important: the legislature has to speak clearly before we read a statute to preempt state law, to tread on state prerogatives, or to raise a serious constitutional doubt.
  (7) I'm happy with the textual canons — whole text, noscitur a sociis, eiusdem generis — but I think the rule of lenity is mostly junk and should be a last-resort tiebreaker after you've found real ambiguity. It annoys me when a court narrows a criminal statute that looks clear to me.
  (8) I think statutory precedent should bind fairly strongly: once a court has settled what a statute means, a later court shouldn't reopen it just because it now thinks that reading was wrong, and the fact that the legislature has left the reading alone for years counts in favor of keeping it.
  (9) When the text really is ambiguous I pick the reading that best serves the statute's purpose — but only a purpose you can find in the enacted text itself, preamble, findings, title, not one reconstructed from anyone's testimony.
  (10) And the reason I like the package is that it constrains judges, it's more democratically legitimate than the alternatives, and legislatures are so bad at anticipating cases that asking what they would have wanted is usually asking a question with no answer.

  Can you audit this for me? What I want is the pairs that are actually in tension, ranked by how severe the tension is, with what would have to give in each case and what giving it would cost me — not a list where everything gets flagged as equally suspicious. I also want to know which pairs only look inconsistent and why, because my friend is not going to accept it's all fine without an argument, and I'd rather hand her the good version of that response. Tell me anywhere I'm using a label to smuggle back in something I said I rejected in (1) or (2), and whether (10)'s rationale is doing work my other commitments quietly undercut. If there's a single revision that cleans up the most, say which one. And please don't just tell me to become a purposivist: I want to know what breaks, not to switch teams. No case names or reading recommendations, I have plenty of those.
reasoning: |-
  Okay, the user is a new staff attorney at a state supreme court who needs to present a coherent interpretive methodology memo to their judge. Their draft has been criticized by a purposivist friend as inconsistent. Let me analyze their ten points systematically.

  First, I notice strong textualist foundations in points 1-3: fixed meaning at enactment, rejection of legislative history, and reliance on linguistic tools. This aligns with modern textualism. But then complications arise:

  Point 4 introduces an element of expected application, which textualists often distinguish from meaning. This could create tension with point 1's fixation principle. The ambulance example suggests they're actually blending meaning and application - that's where the "extra steps" critique might bite. 

  Point 5's absurdity doctrine seems in tension with strict fixation. If meaning is truly fixed, why should absurd outcomes matter? The minister example particularly strains point 1's premise. This needs explicit justification about how absurdity relates to meaning rather than overriding it.

  Point 6's avoidance doctrines actually fit well with textualism when framed as linguistic clear-statement requirements rather than policy choices. That's an important clarification to maintain consistency.

  Point 7's rejection of lenity as "junk" contradicts point 9's purposivism in ambiguity. If they distrust purposivism so much, why embrace it for ambiguities? There's a significant tension between their skepticism of judicial discretion (point 10) and this safety valve.

  Point 8's strong stare decisis conflicts with point 1's original meaning priority. If the original meaning is clear but precedent got it wrong, why should it bind? They need to explain this hierarchy clearly.

  The biggest red flag is point 9's purposivism after claiming to reject legislative purpose (point 2). Claiming to derive purpose solely from text is theoretically possible but operationally tricky - it risks smuggling in the very purposivism they disclaim.

  Their rationale (point 10) about constraint and democratic legitimacy is undermined by several exceptions. The absurdity doctrine and purposive tie-breaking introduce discretion they claim to reject. They need to either reframe these as meaning-based or acknowledge limited discretion.

  The most damaging tensions are: 
  1) Between fixed meaning (1) and absurdity/purpose exceptions (5,9) 
  2) Between rejecting legislative history (2) and claiming textual purpose (9) 
  3) Between textual fixation (1) and stare decisis (8)

  To fix this without abandoning textualism, I'd recommend:
  - Clearly separating meaning from application
  - Framing absurdity as revealing linguistic meaning
  - Treating "textual purpose" as structural implications rather than intent
  - Acknowledging stare decisis as a separate pragmatic value
  - Demoting lenity consistently with their criminal law skepticism

  The simplest fix would be to reframe point 9 as using linguistic canons and structure to resolve ambiguity, avoiding "purpose" language entirely. This maintains textualist purity while keeping most of their framework intact.
answer: |-
  Based on your description, your methodology is primarily textualist but incorporates elements that create significant tensions, particularly when viewed through a purposivist lens. Below is an audit ranking the tensions by severity (high to moderate), what must give, the cost of adjustment, and where appearances of inconsistency can be defended. The goal is coherence within *your framework* without switching teams.

  ### High-Severity Tensions
  1. **Fixed Meaning (1) vs. Absurdity Doctrine (5)**  
     - **Tension:** Claiming meaning is fixed by the enacting-era reader’s understanding conflicts with overriding that meaning when it leads to "absurd" outcomes. If meaning is truly fixed, absurdity shouldn’t override it—it would reflect the legislature’s choice.  
     - **What Must Give:** You must either:  
       - *Drop (5)*: Cost: Loses a pragmatic safety valve; risks unjust outcomes.  
       - *Reconceptualize (5) as part of (1)*: Argue absurdity reveals the enacting reader *wouldn’t* have understood the text to cover the case (e.g., "vehicle" excludes ambulances because context implies *mischievous* uses). Cost: Risks stretching "meaning" beyond linguistic evidence.  
     - **Friend’s Critique:** This looks like purposivism (avoiding bad outcomes) masked as textualism.  

  2. **No Legislative History (2) vs. Textual Purpose (9)**  
     - **Tension:** Rejecting legislative history while using "purpose" derived from the text alone is unstable. If purpose must be found *only* in the text (preamble, title, etc.), it may be too vague to resolve ambiguities—yet you rely on it when text fails.  
     - **What Must Give:**  
       - *Clarify that "purpose" is structural, not intent-based*: Use the text’s organization, context, or canons (e.g., *noscitur a sociis*) to infer purpose—never "what lawmakers wanted." Cost: May not resolve hard cases where structure is silent.  
       - *Drop "purpose" from (9)*: Resolve ambiguities using only linguistic canons/corpus tools from (3). Cost: Loses a key tool for ambiguity.  
     - **Smuggling Risk:** Using "purpose" from text alone *could* tacitly import intent if not carefully bounded.  

  3. **Fixed Meaning (1) vs. Stare Decisis (8)**  
     - **Tension:** If meaning is fixed at enactment, a precedent that misreads it should be corrected—yet you bind future courts to erroneous readings if legislatures don’t act.  
     - **What Must Give:**  
       - *Prioritize (1) over (8)*: Admit stare decisis is a pragmatic exception to textual fidelity for stability. Cost: Weakens democratic legitimacy argument (point 10).  
       - *Reframe (8) as evidence of meaning*: Argue legislative inaction implies acquiescence to the *court’s interpretation* of the original meaning. Cost: Conflates meaning with judicial gloss.  

  ### Moderate-Severity Tensions
  4. **Rejecting Lenity (7) vs. Purposivism in Ambiguity (9)**  
     - **Tension:** Dismissing lenity (a canon favoring defendants) but using purpose to resolve ambiguity creates inconsistency: both are ambiguity tools, yet you reject one as "junk" while embracing the other.  
     - **Apparent Inconsistency Defense:** Lenity is a *tiebreaker rule*; purposivism in ambiguity is a *meaning-seeking tool*. You can argue lenity is superfluous if purpose/text resolves ambiguity.  
     - **What Must Give:**  
       - *Drop lenity criticism*: Call it a last-resort tool (aligning with your "tiebreaker" view). Cost: Weakens your anti-lenity stance.  
       - *Drop (9)*: Use only linguistic tools (3) for ambiguity. Cost: May leave gaps in hard cases.  

  5. **Expected Application (4) vs. Fixed Meaning (1)**  
     - **Tension:** Asking what an enacting-era reader would *expect* the text to cover (e.g., ambulances in parks) risks conflating "meaning" with subjective expectations.  
     - **Apparent Inconsistency Defense:** Distinguish "expected application" from "meaning": Meaning is linguistic; expectation is contextual evidence of that meaning (e.g., "vehicle" *includes* ambulances linguistically but context implies exclusion).  
     - **Risk:** If "expected application" overrides plain meaning, it mimics purposivism. Anchor it strictly in linguistic evidence (e.g., corpus data on "vehicle" in emergencies).  

  ### Low-Severity Tensions (Defensible)  
  6. **Avoidance Doctrines (6) & Canons (7) vs. Textualism**  
     - **Defense:** Clear-statement rules and textual canons are tools to *discern* meaning, not override it. Avoidance respects constitutional boundaries—a legitimate constraint. Purposivists might call this "smuggling," but textualists view it as linguistic precision.  
  7. **Dynamic Updating Rejection (1) vs. Stare Decisis (8)**  
     - **Defense:** Rejecting updates to meaning (e.g., for new tech) but accepting precedent is a common textualist compromise for stability. Distinguish: Updating *changes* meaning; stare decisis *preserves* judicial interpretations.  

  ### Key Revisions for Coherence
  - **Highest-Impact Fix:** **Reconceptualize absurdity (5) as part of original meaning (1).** Argue absurd outcomes reveal a *linguistic* limitation: Enacting-era readers would understand terms to carry implicit exceptions (e.g., "vehicle" excludes life-saving uses). This avoids overriding text while keeping the doctrine.  
  - **Reframe "purpose" (9):** Replace "purpose" with "structural implications" or "contextual inferences" from the text itself. Never imply intent.  
  - **Clarify "expected application" (4):** Position it as evidence of linguistic meaning, not a separate test.  
  - **Acknowledge Stare Decisis (8) as Pragmatic:** Admit it’s a non-textualist concession to stability.  

  ### Why Your Friend Sees "Purposivism"  
  - Points 4 (expected application), 5 (absurdity), and 9 (purpose in ambiguity) *look* like they use extratextual policy to soften textualism. By tightening these to focus on *linguistic evidence* (what words conveyed, not what outcomes were desired), you reduce the tension.  

  ### Does (10) Undercut Itself?  
  - **Constraint/Democratic Legitimacy:** Your exceptions (absurdity, avoidance, stare decisis) *do* introduce judicial discretion, but this is true of all textualisms. Defense: Emphasize that every tool (absurdity, canons) is framed as *discovering* meaning, not creating it.  
  - **Legislative Futility:** Point 10 argues legislatures can’t anticipate cases—yet your method relies on their words *as understood at enactment*. This is consistent: You’re bound by what they *said*, not what they *would have wanted*.  

  **Final Recommendation:** The single best revision is to **fold absurdity (5) into original meaning (1)** by arguing absurdity reveals a *linguistic* limit to the text’s coverage. This resolves the worst tension while preserving your core. Then reframe "purpose" in (9) as "textually derived implications." The result is a consistent textualism with pragmatic caveats—not "purposivism with extra steps."
