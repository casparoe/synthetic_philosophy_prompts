  Hmm, their opening is strong—they've preempted the "tie-breaker" move about numbers and framed the within-life aggregation as already using the same metric (psychological connectedness) that reductionists use to blur person-boundaries. Smart. They want a real fight, not a straw man, so I need to channel a true Scanlonian who's unshaken by the reductionist challenge. 

