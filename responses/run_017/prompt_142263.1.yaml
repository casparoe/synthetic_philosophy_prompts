prompt: |-
  hey — so I'm a 3rd-year PhD student (ML, mostly preference learning and RLHF-adjacent stuff; my advisor is more theory than empirics) and I've somehow ended up as the token technical person on the advisory board of a small funder. They've got around $2M to spend over three years, and they've decided to spend it on the *conceptual* side of inferring what people want from what they do — IRL, reward inference, preference learning, whatever you want to call it. Explicitly not more benchmarks, not more scaling, and they can't fund compute, so anything that needs a cluster is off the table. Realistically it's about five or six postdoc-years, maybe a couple of senior people part-time, and they want to be able to say at the end that they changed what people think is worth working on, not that they produced twelve papers.

  What I keep going in circles on is what to actually put in the call. Some candidates I've been kicking around:

  - the identifiability stuff. If behavior is generated by something roughly like a boundedly rational agent, the reward is pretty badly underdetermined: lots of rewards fit the same behavior, and whole families of transformations of a reward give identical predictions. So what exactly is the estimand? Is "the human's reward function" even a coherent target, or should we be estimating something else — what they'd choose with better information, what they'd endorse on reflection, some counterfactual-choice target? And how do you decide between those without already knowing the answer?

  - what I've started calling the inference-aware demonstrator problem: once people know their behavior is being used to train a system (labelers, users who've read one news article about algorithms), the behavior starts encoding their *theory of the learner*, not just their preferences. Clicks get partly strategic, partly performed. Is this a real problem for the whole framework, or a measurement annoyance you can design around?

  - whose behavior counts. The machinery is built for a single agent, but deployed systems act for a population, and the people generating the data usually aren't the ones the system's actions land on.

  - misspecification. If the human isn't rational in the way the model assumes, you get a confident, wrong reward, and I don't think anyone has a good story for telling that apart from success.

  I defintely don't want a survey and I really don't want a reading list — I want a defended agenda. Which of these (or something I'm not seeing) should they prioritize, in what order, and on what criteria: how upstream is it of the rest, is it tractable in three years by theorists and philosophers with no compute, is it neglected, and how much downstream practice would actually change if it got answered? Which are overrated, or don't really follow from the setup at all? What evidence over the next couple of years should move things up or down the list? And I'd also like to hear what you'd tell them is a flat-out waste of the money, with the reasoning for killing it.
reasoning: |-
  Okay, let me unpack this user's query. They're a third-year PhD student in machine learning, focusing on preference learning and RLHF, but their advisor leans more theoretical. Now they're on the advisory board of a small funder with $2M over three years to spend on conceptual research in inferring human preferences from behavior—no benchmarks, scaling, or compute-heavy projects. The goal isn't just papers but shifting the field's priorities.

  The user has outlined four candidate areas: identifiability issues, inference-aware demonstrators, whose behavior counts in population-level systems, and misspecification problems. They want a defended agenda—prioritization based on upstream impact, tractability without compute, neglect in current research, and potential to change downstream practices. They also want to know what to avoid funding.

  First, I need to assess each candidate area against their criteria. The funder's constraints are clear: theoretical work, no compute, conceptual impact. The user's role as the token technical person suggests they need robust arguments to convince a non-technical board. Their deeper needs might include establishing credibility, ensuring the funder's legacy, and avoiding wasted resources.

  Starting with identifiability: It's foundational. If rewards are underdetermined, everything else rests on shaky ground. It's tractable with theory/philosophy, neglected outside niche papers, and solving it could redefine the field's targets. High priority.

  Inference-aware demonstrators: This feels urgent with real-world implications. As users become aware of being watched, behavior changes—strategic clicks, performed actions. It's a mess for current methods. Empirical but could use theory. Medium priority; needs lightweight experiments.

  Whose behavior counts: Population vs. individual mismatch is critical for deployment fairness. It's a systemic issue, tractable with game theory and philosophy, and neglected. High potential to influence policy. High priority.

  Misspecification: If models assume rationality but humans aren't, you get confident errors. It's a known problem but hard to tackle without compute. Might be less tractable in three years. Medium-low priority; could be deprioritized unless linked to identifiability.

  I should also consider unmentioned angles, like epistemic modesty or value formation, but they might not fit the timeframe. 

  For prioritization: Identifiability first—it's the bedrock. Then whose behavior counts—it's pressing for ethics. Follow with inference-aware demonstrators for near-term relevance. Misspecification last as it's tougher without compute.

  What to kill: Anything incremental or applied. Also, avoid funding pure philosophy without ML ties, or projects that need data/compute. 

  The user needs clear reasoning: Why each rank, why some ideas are overrated (e.g., misspecification without identifiability progress), and how success looks. They’ll need to justify this to the board, so the rationale must be airtight and persuasive.
answer: |-
  This is an *excellent* mandate and a rare opportunity to tackle foundational issues often ignored in the rush to deploy. Your candidate areas are sharp, and the funder's constraints ("no benchmarks, no scaling, no compute") force focus on the *ideas* that truly underpin the field. Here’s a defended agenda, prioritizing based on **upstream impact**, **tractability without compute**, **neglect**, and **potential to shift practice**.

  **Prioritized Agenda (Order Matters):**

  1.  **The Identifiability Crisis: What Are We Even Estimating?** (Highest Priority)
      *   **Why:** This is the most upstream problem. If "the reward function" isn't a coherent or identifiable target *even under idealized assumptions*, everything downstream (learning algorithms, evaluation, deployment) is built on sand. It directly challenges the core premise of IRL/RLHF.
      *   **Tractability:** Perfect for theorists/philosophers. Requires formal modeling (decision theory, game theory), philosophical analysis (concepts of preference, desire, value, counterfactuals), and mathematical analysis (invariance classes, equivalence relations under different rationality models). No compute needed, just deep thought and proofs.
      *   **Neglect:** While known in niche theory circles (e.g., Ng & Russell, Hadfield-Menell, Everitt et al.), it's systematically ignored in applied work. Funding here would force the *entire field* to confront it. The "twelve papers" pressure often pushes people away from this foundational unease.
      *   **Potential Downstream Shift:** Revolutionize the *goals* of preference learning. Instead of chasing "the" reward, the field might shift towards:
          *   Explicitly defining estimands: e.g., "predictive policy under bounded rationality model X", "counterfactual choice under information Y", "endorsed value after deliberation Z".
          *   Developing methods robust to equivalence classes (e.g., learning *sets* of compatible rewards, or features invariant under transformations).
          *   Forcing transparency: Papers would *have* to state *which* concept of "preference" they are targeting and why.
      *   **Evidence to Watch:** If major labs start publishing RLHF failures directly attributable to identifiability issues (e.g., small perturbations in data/model leading to radically different learned rewards with similar fit), bump this even higher. Ignore papers that hand-wave it away.

  2.  **Whose Behavior Counts? The Principal-Agent Problem in Preference Data** (High Priority)
      *   **Why:** This is the collision point between the *technical framework* (single-agent IRL) and the *societal reality* of deployed systems impacting populations. It directly addresses fairness, legitimacy, and the fundamental mismatch in how data is generated vs. used. It's a showstopper for ethical deployment.
      *   **Tractability:** Requires blending ML theory (multi-agent systems, aggregation), game theory (mechanism design, incentives), economics (social choice, welfare), and political philosophy (representation, legitimacy). Theorists can model different data generation regimes (e.g., only users, only stakeholders, opt-in panels), aggregation functions (voting, averaging, maximin), and incentive structures. Philosophers can analyze normative justifications for different approaches. No compute needed for core models.
      *   **Neglect:** Hugely neglected in core RLHF/IRL research. Fairness ML often focuses on protected attributes *after* the reward is learned, not on the fundamental question of *who defines the reward in the first place*. Alignment discussions touch on it but lack formal integration into the learning framework.
      *   **Potential Downstream Shift:** Force a paradigm shift from "learning *a* reward" to "designing processes for defining *whose* reward(s) matter and *how* to aggregate them for a system impacting many." Change how data is collected (e.g., stratified sampling, participatory design), how objectives are defined (e.g., explicit trade-offs, constrained optimization over sub-population rewards), and how systems are evaluated (e.g., reporting disaggregated impacts).
      *   **Evidence to Watch:** Increased regulatory scrutiny on algorithmic bias traceable to unrepresentative preference data, high-profile failures where a system optimized for one group harmed another. If major conferences start dedicated tracks on "Representation in Preference Learning," it's gaining traction.

  3.  **The Inference-Aware Demonstrator: Behavior as Meta-Game** (Medium Priority)
      *   **Why:** Directly tackles the validity of the *data source* as the field scales. It's not just noise; it's a fundamental shift in what the data *means*. This undermines the core assumption that behavior reveals "true" preferences.
      *   **Tractability:** More challenging without compute. Requires game theory (signaling games, information design), behavioral economics (theory of mind, strategic behavior), and potentially some light experimental design. Theorists can model different "theory of the learner" assumptions held by demonstrators and design mechanisms to mitigate strategic behavior. Philosophers can analyze concepts of authenticity and performativity. *Lightweight, targeted behavioral experiments* (e.g., MTurk studies on how instructions change labeling behavior) are tractable within budget and provide crucial validation for theory.
      *   **Neglect:** Increasingly recognized anecdotally ("labeler drift", "gaming the RM"), but rarely modeled formally as part of the *core learning problem*. Often dismissed as an "implementation detail" rather than a foundational challenge.
      *   **Potential Downstream Shift:** Move the field from naive "collect more data" to sophisticated data collection protocols and model architectures designed for adversarial or strategic settings. Foster research on: incentive-compatible elicitation, detecting and filtering strategic behavior, modeling the demonstrator's mental model of the learner, and learning from *interactions* rather than static demonstrations.
      *   **Evidence to Watch:** Concrete evidence of learned reward models being easily "hacked" by labelers aware of the training process, or significant degradation in RLHF performance as the user base becomes more algorithmically literate. If platforms report increasing "algorithmic gaming," prioritize this higher.

  4.  **Misspecification: Confidence Masks Ignorance** (Lower Priority - *Link to Identifiability*)
      *   **Why:** While critical, it's downstream of Identifiability. If you don't know *what* you're estimating, diagnosing *bad* estimation is harder. Current approaches often produce "confidently wrong" rewards due to model mismatch.
      *   **Tractability:** Difficult without compute for empirical validation. The core *theoretical* work involves analyzing failure modes under specific mismatches (e.g., human is noisy but model assumes optimality; human has state-dependent rewards, model assumes constant). This can be done, but **crucially depends on progress in Identifiability** to define what "wrong" even means relative to the target estimand. Philosophers can contribute on epistemology of uncertainty in learned values.
      *   **Neglect:** Not neglected per se; many papers note model mismatch as a limitation. What's neglected is *practical, theoretically grounded diagnostics* for detecting it *without* knowing the ground truth reward, and formal analysis of *why* confidence can be high even when wrong.
      *   **Potential Downstream Shift:** Development of robust uncertainty estimates for learned rewards (beyond just Bayesian posteriors that might be misspecified too), diagnostic tests for model mismatch (e.g., testing consistency across different behavioral contexts), and fallback mechanisms.
      *   **Why Lower Priority Here?** Without solving Identifiability, work here risks being ad hoc. Progress on Identifiability (Priority 1) will directly feed into defining and detecting misspecification. Fund work here *only* if tightly coupled with the estimands defined in Priority 1. Evidence like catastrophic failures due to unmodeled human biases could bump it up, but the root cause often traces back to Identifiability or Representation.

  **What's Overrated & What to Kill:**

  *   **Overrated: Sole Focus on "Better Algorithms" for Existing Formulations.** Funding yet another variant of a preference learning loss function or RLHF scheduler, *without* addressing the foundational questions above, is a waste. It treats the symptoms (poor performance) without addressing the disease (ill-defined goals, invalid data, wrong agents).
  *   **Overrated: Purely Descriptive "What People Want" Surveys/Anthropology.** While valuable context, it doesn't provide the formal frameworks needed to build systems. The funder's mandate is *conceptual foundations for inference*, not ethnography.
  *   **Kill It: Anything Requiring Large-Scale Data/Compute.** This is non-negotiable per the constraints. Proposals promising breakthroughs via massive data collection or training runs should be rejected outright. They violate the core premise.
  *   **Kill It: Incremental Benchmarks/Tweaks.** "New dataset for testing IRL robustness" or "slight improvement on preference aggregation metric" – no. The goal is to change *what* is benchmarked and *why*, not add another benchmark.
  *   **Kill It: Vague "Ethical Guidelines" Without Technical Integration.** Funding philosophers to write another set of principles disconnected from the mathematical formalism of reward learning won't change practice. Ethics must be baked into the *technical formulation* (like Priority 2 demands), not an add-on.
  *   **Kill It: Projects Ignoring the Constraints.** Senior researchers proposing their usual compute-heavy empirical work, repackaged. Be ruthless. The *unique* value here is funding the deep theory others can't/won't.

  **Key Criteria for Selection & Monitoring:**

  1.  **Upstreamness:** Does it challenge the *most basic assumptions* of the field? (Identifiability wins).
  2.  **Tractability w/ Constraints:** Can rigorous progress be made with theory, math, philosophy, and *very* light experiments? (Priorities 1 & 2 excel).
  3.  **Neglect:** Is the problem acknowledged but systematically avoided in the mainstream? (All 4 are, but 1 & 2 most profoundly).
  4.  **Downstream Leverage:** If solved (or even rigorously framed), would it *force* changes in how *everyone* does preference learning? (Yes, for 1, 2, and 3).
  5.  **Evidence for Relevance:** Monitor real-world failures (deployment disasters, regulatory actions, user revolts) and whether they map directly onto these problem areas. Also monitor if any major labs start seriously tackling them – if they do, it validates the priority but also means the funder should focus on the *most* neglected aspects.

  **Final Pitch to the Board:**

  "Focus the call on **redefining the targets** (What *should* we learn from behavior?) and **reconciling the framework with reality** (Who defines it? What happens when people know they're being watched?). Specifically:

  1.  **Formal Foundations:** What *can* be inferred from behavioral data? What are the coherent targets? (Identifiability)
  2.  **Collective Values:** How do we define and learn objectives for systems impacting populations when data comes from subsets? (Whose Behavior Counts)
  3.  **Strategic Data:** How does awareness of the learning process change behavior, and how can we learn valid preferences despite it? (Inference-Aware)

  We explicitly *won't* fund more algorithms chasing ill-defined goals, large-scale experiments, or benchmarks. We will fund the deep thinking needed to make preference learning rigorous, responsible, and fit for purpose in the real world. Success looks like papers that make people say 'Oh damn, we *have* to think differently now,' and changes in how leading labs frame their research questions."

  This agenda is ambitious, foundational, and perfectly suited to the constraints. It has the highest chance of truly "chang[ing] what people think is worth working on." Good luck!
