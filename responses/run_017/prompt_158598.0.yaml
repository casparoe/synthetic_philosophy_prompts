answer: |-
  ## Adversarial Collaboration: Reverse Engineering in Evolutionary Psychology

  **Agreed Framework Claims**

  1.  **Evolutionary Roots:** Human cognition and behaviour are products of evolution by natural selection acting on genetic variation within ancestral populations. Phenotypic traits, including psychological mechanisms, exist because they conferred fitness advantages (directly or indirectly) in past environments, or are by-products of such traits.
  2.  **Reverse Engineering Logic:** Identifying functional design in biological systems is a legitimate scientific endeavour. When a trait exhibits complex functional organisation well-suited to solving a specific adaptive problem recurrent in the ancestral environment, this constitutes *prima facie* evidence for its evolution as an adaptation for that function.
  3.  **Domain of Confidence:** Reverse engineering has demonstrably succeeded in identifying adaptations in sensory and perceptual systems (e.g., specific photoreceptor sensitivities tuned to ambient light spectra, auditory range matching communicative frequencies, depth perception mechanisms). The evidential strength is high here due to clear links between physical structure, quantifiable environmental inputs, and specific functional outputs.
  4.  **Core Evidence Type:** "Design evidence" – the demonstrable, non-arbitrary fit between a proposed cognitive mechanism's structure (e.g., computational rules, informational inputs, behavioural outputs) and the specific demands of a hypothesised ancestral adaptive problem – is the primary, necessary evidence for identifying a psychological adaptation. Mere current utility is insufficient.
  5.  **Converging Evidence Standard:** Strong inferences about psychological adaptations require converging lines of evidence beyond initial design plausibility. This minimally includes: comparative evidence (homology/analogy across species facing similar problems), cross-cultural evidence (universality or patterned variation explicable by differential selection pressures), and functional evidence (demonstrating the mechanism operates as hypothesised to solve the problem).
  6.  **Current Function ≠ Selection History:** The fact that a trait currently serves a beneficial function does not entail that it was *selected for* that function. Traits can be co-opted for new functions (exaptations) or arise as non-adaptive by-products (spandrels) of other selected traits. Identifying *selection-for* requires evidence the trait's specific features were shaped by that function.
  7.  **Empirical Dispute:** The core disagreement is not about the validity of evolutionary theory or the *potential* for domain-specific psychological adaptations. It is an empirical dispute about the *prevalence* of such adaptations relative to alternative explanations (by-products, exaptations, domain-general learning) for specific observed cognitive patterns, and the *evidential standards* required to confidently infer selection-for-psychological-function based on design evidence.
  8.  **Testability Requirement:** Hypotheses about psychological adaptations must generate empirically testable predictions distinct from those generated by alternative hypotheses (e.g., domain-general learning, cultural transmission, by-product accounts).

  **Disagreements Table**

  | Issue (Neutral Wording) | Camp A Position                                                                 | Camp B Position                                                                                                                                                               | Crux Question                                                                                                                                                                  | Test Case / Measurement                                                                                                | A's Predicted Outcome                                                                                                  | B's Predicted Outcome                                                                                                                                 | Damaging Result                                                                                                                               |
  | :---------------------- | :------------------------------------------------------------------------------ | :---------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------------------------------------- |
  | **1. Default Stance**   | Complex, functional cognitive patterns are *likely* adaptations until proven otherwise; adaptation is the primary explanatory lens. | Complex functional patterns *require* rigorous testing against strong null hypotheses (e.g., by-product, exaptation, learning); adaptation claims demand high prior scrutiny. | Does assuming adaptation as the default stance lead to more empirically productive and accurate science than requiring strong positive evidence against alternatives *before* invoking adaptation? | Track the historical success rate of specific EP hypotheses: proportion initially proposed as adaptations that withstand subsequent rigorous testing against alternatives over time. | High proportion withstand testing; early adaptation focus efficiently identifies true adaptations.                  | Significant proportion are falsified or better explained by alternatives; premature adaptation focus leads to proliferation of low-confidence claims. | A: High falsification rate of prominent early claims. B: Failure to generate novel, confirmed predictions without an adaptation-first heuristic. |
  | **2. Domain-Specificity Prevalence** | The mind consists largely of numerous, functionally specialised modules shaped by distinct selection pressures. | Domain-general learning mechanisms, cultural transmission, and exaptations of broader capacities explain many putatively domain-specific patterns; true, dedicated modules are rarer. | For cognitive patterns showing functional specialisation, how often does the pattern persist robustly against attempts to explain it via domain-general learning tuned by local payoffs or as a by-product? | See Concrete Tests below (Tuning-Tracking, Novel Environment, Matched Control).                                        | Patterns resist change via learning/payoff shifts in novel contexts; show specificity not predicted by general models. | Patterns shift readily with learning/payoff changes; domain-general models predict outcomes as well or better than dedicated adaptation models.         | A: Widespread failure of predicted specificities/resistances. B: Consistent failure of domain-general models to capture key functional nuances without adding *ad hoc* modules. |
  | **3. Weight of Design Evidence** | Strong design evidence (good fit to ancestral problem), especially combined with universality, provides substantial evidence for selection-for-function. | Design evidence alone is weak due to the "adaptive story problem" (multiple plausible stories); strong evidence requires proof against alternatives *or* evidence of specificity/resistance consistent only with selection history. | Is design evidence + universality sufficient for a confident inference of selection-for-function, or is positive evidence *against* key alternative explanations always required? | Analyse cases where strong design evidence + universality exists *but* a plausible by-product or learning account also exists. Does subsequent evidence typically resolve it? | Resolution typically favours adaptation; alternatives often lack comparable design fit.                           | Resolution often remains ambiguous; plausible alternatives persist despite design evidence.                                                        | A: Key cases universally resolved *against* adaptation despite strong initial design evidence. B: Key cases resolved *for* adaptation *without* needing specific anti-alternative evidence beyond design/universality. |
  | **4. Tuning vs. Tracking** | Adaptive cognitive biases reflect tuning to *ancestral* statistical regularities; they exhibit lag and limited plasticity in novel environments. | Adaptive cognitive biases primarily track *individual* reinforcement histories within a lifetime via domain-general learning; they are highly plastic to current payoffs/base rates. | Does the magnitude and direction of an adaptive asymmetry bias primarily reflect the statistical structure of the *ancestral environment* (tuning) or the *individual's experienced payoffs and base rates* (tracking)? | **Concrete Test Below** (Error Management Payoff Reversal)                                                              | Bias persists strongly despite reversed payoffs/lifetime training; shift is slow/incomplete.                         | Bias reverses rapidly and completely to match new payoff asymmetry within an experimental session or after brief exposure.                              | A: Rapid, complete reversal to new optimum. B: Failure to reverse under strong, sustained reversed payoffs.                                    |
  | **5. Novel Predictions** | Adaptation hypotheses generate unique, counter-intuitive predictions about behaviour in evolutionarily novel contexts. | Domain-general learning models, fitted to individual experience, generate predictions in novel contexts that are often as accurate or more accurate than adaptation models. | In evolutionarily novel tasks/settings, do predictions derived solely from an adaptation hypothesis (without fitting to individual learning data) outperform predictions from a domain-general learning model fitted to participants' reinforcement history? | **Concrete Test Below** (Novel Environment Prediction)                                                                 | Adaptation model predicts sign/direction significantly better than chance *and* better than baseline learning model. | Domain-general learning model predicts behaviour at least as accurately as the adaptation model; adaptation model performs no better than null.          | A: Learning model consistently outperforms adaptation model. B: Adaptation model consistently outperforms learning model even after controlling for general task learning. |

  **Concrete Cruxes: The Tuning-Tracking Probe & Extensions**

  1.  **Core Test: Error Management Payoff Reversal**
      *   **Task:** A binary decision task under uncertainty with asymmetric error costs (e.g., judging threat: False Negative (miss threat) cost >> False Positive (false alarm) cost, or judging edible: False Positive (poison) cost >> False Negative (miss food) cost). Base rates are manipulable.
      *   **Populations/Manipulations:**
          *   *Group 1 (Control):* Experience task with ancestral-typical payoff asymmetry and base rates during training phase (many trials).
          *   *Group 2 (Reversed Payoffs):* Experience task with the *reverse* payoff asymmetry (e.g., cost of false alarm made higher than cost of miss for threat) during training phase (same number of trials). Base rates held constant.
          *   *Group 3 (Reversed Base Rates):* Experience task with ancestral-typical payoff asymmetry but *reversed* base rates (e.g., safe events much more frequent than threats) during training phase (same number of trials).
      *   **Measurement:** Strength and direction of bias in the test phase (identical for all groups, with neutral/balanced payoffs and base rates). Primary measure: Proportion of costly-error-avoidant responses.
      *   **Distinguishable Outcomes:**
          *   **Strong Tuning (A Favoured):** Groups 2 & 3 show bias *significantly closer* to Group 1 (ancestral pattern) than to the new payoff/base-rate optimum, despite extensive training. Bias resists reversal.
          *   **Strong Tracking (B Favoured):** Groups 2 & 3 show bias *at or near* the new payoff/base-rate optimum. Bias fully reverses. Group 1 shows the ancestral bias.
          *   **Partial Plasticity/Mixed:** Groups 2 & 3 show a shift towards the new optimum but not fully; residual bias towards ancestral pattern. Interpretation ambiguous.
          *   **Null:** No consistent bias develops in any group, or bias doesn't shift meaningfully in Groups 2/3. Challenges the adaptive asymmetry premise for this task.

  2.  **Novel Environment Prediction**
      *   **Premise:** Adaptation Hypothesis predicts a specific, counter-intuitive behavioural bias in a novel task/scenario based on an analogy to an ancestral problem (e.g., a social exchange bias manifesting in a novel economic game with no evolutionary precedent).
      *   **Procedure:** Camp A pre-registers the predicted direction/sign of the bias *based solely on the adaptation logic*, before data collection. A domain-general reinforcement learning model is defined (e.g., Rescorla-Wagner, temporal difference learning). Participants undergo sufficient trials in the novel task for the learning model to be fitted to *each individual's* reinforcement history (successes/failures, payoffs).
      *   **Measurement:** Compare predictive accuracy (e.g., correlation, classification accuracy) for the *next* set of decisions between:
          *   (a) The pre-registered adaptationist prediction (same for all).
          *   (b) Predictions from the individualised learning model.
          *   (c) A sensible null model (e.g., always choose most frequent option, random).
      *   **Distinguishable Outcomes:** As per Table Row 5.

  3.  **Matched-Control Requirement**
      *   **Principle:** Any adaptive hypothesis proposing a dedicated mechanism (M) for function (F) must specify *in advance* a plausible, structurally adjacent trait (C) that could serve as a by-product explanation for the same pattern. The hypothesis must predict a *discriminating pattern* that distinguishes M (adaptation for F) from C (by-product).
      *   **Example:** Hypothesis: Dedicated "cheater detection module" (M) predicts specific, content-dependent reasoning facilitation *only* on social contract rules. Control (C): General deontic reasoning ability (by-product of broader capacities). Discriminating Pattern: Performance on social contract problems should show a specific, robust dissociation (e.g., in speed, accuracy, neural activation, developmental trajectory, impairment patterns) compared to logically identical non-social deontic problems, *beyond* what general reasoning ability differences predict.
      *   **Test:** Evaluate the hypothesis by testing for the pre-registered discriminating pattern.
      *   **Distinguishable Outcomes:**
          *   **Supports Adaptation:** Discriminating pattern found robustly as predicted.
          *   **Supports By-Product:** Discriminating pattern absent; performance explained by general reasoning (C).
          *   **Ambiguous/Null:** Mixed results, or pattern found but explained by confounds (e.g., general difficulty differences).

  **Verbal Disputes and Internal Divisions**

  *   **"Adaptation" Semantics:** Part of the disagreement centres on the *strength of evidence required* to label a trait an "adaptation" *for a specific function*. Camp A often uses the term based on strong design evidence and plausibility. Camp B (especially the by-product wing) reserves it for cases where evidence *against* key alternatives (like the trait being a by-product) is also strong. This is partly a terminological difference about the threshold for the label. The substantive dispute is whether the *evidence patterns themselves* (like those probed above) actually distinguish selection-for-function from alternatives.
  *   **Camp B Divergence:** The two wings of Camp B converge on rejecting the necessity of domain-specific adaptations for many phenomena but diverge significantly in their positive accounts:
      *   The **By-Product/Exaptation Wing** focuses on architectural constraints and side-effects of other adaptations (e.g., language as a spandrel of general intelligence). They might find domain-general learning explanations insufficiently constrained. They would likely *agree* with Camp A that some robust biases (like core sensory adaptations) show strong tuning, but argue these are rare in higher cognition.
      *   The **Domain-General Learning Wing** emphasises the power of reinforcement, statistical learning, and cultural transmission tuned to *contemporary* payoffs. They are most sceptical of tuning and most confident in tracking. They see minimal need for innate, domain-specific modules beyond very basic perceptual/motor ones. They might view by-product accounts as still too "modular".

  **Small Grant Study Recommendation**

  The most informative single study would be a robust implementation of the **Error Management Payoff Reversal Test**, incorporating elements of the **Matched-Control Requirement**. For example: Study a well-established putative adaptive asymmetry (e.g., sexual overperception bias under uncertainty). Define a matched control task with similar cognitive demands but no theorised adaptive asymmetry (e.g., judging age). Pre-register the prediction that the adaptive bias will show significantly less plasticity to reversed payoffs/lifetime training than the matched control bias. Include the reversed payoff and reversed base rate groups alongside controls.

  *   **Informative Result for Both Sides:**
      *   **Strong Tuning (Adaptive Bias Resists Reversal, Control Bias Shifts):** Camp A sees confirmation of dedicated adaptation. Camp B (especially domain-general wing) must acknowledge a robust pattern demanding explanation beyond simple tracking, though the by-product wing might still offer explanations.
      *   **Strong Tracking (Both Biases Reverse Fully):** Camp B (especially domain-general wing) sees confirmation of powerful learning. Camp A must acknowledge that this specific bias, even if ancestrally adaptive, is highly malleable and not evidence of a dedicated module tuned to ancestral stats.
      *   **Dissociation (Adaptive Bias Resists, Control Bias Shifts Partially/Not at All):** Challenges simple domain-general accounts but also may challenge the specific adaptation account if the control shifts more than expected. Forces refinement of theories.
      *   **Null/No Bias:** Challenges the fundamental premise of an adaptive asymmetry for that task in the studied population. Both sides must re-evaluate the evidence base for that specific claim.

  This design directly probes the core tuning-tracking crux, incorporates a control for general plasticity, forces pre-registered predictions, and yields results that constrain both adaptationist and alternative explanations, regardless of the outcome.
