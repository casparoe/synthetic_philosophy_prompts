  Looking deeper at what they need: they want to prevent talking past each other, so the document needs neutral framing. The cruxes must be empirical and testable, not theoretical. The tuning-tracking probe should be operationalized with clear experimental designs. I should also flag verbal disputes about "adaptation" and internal splits in Camp B, plus a practical study suggestion for a small grant.

