  ### Dutch Book Coherence Review Procedure for Risk Register Submissions

  **Introduction**  
  This procedure tests the *coherence* of probability assessments (i.e., whether they comply with the axioms of probability) using the Dutch Book argument. It **does not** assess accuracy, calibration, or modelling choices. Submissions may be rejected for incoherence, but passing does not imply the numbers are reasonable—only that no guaranteed loss can be exploited at the stated odds. The Chief Risk Officer (CRO) resolves modelling or values choices.

  **Key Limitations**  
  - **Cannot detect**: Inaccuracies, poor calibration, or non-quantifiable risks.  
  - **Cannot prescribe**: What probabilities *should* be.  
  - **May misfire**: Due to rounding, ranges, or unresolved events; small losses below materiality are ignored.  
  - **Requires CRO intervention**: For one-sided bets, non-resolving events, cross-team mismatches, or justified revisions.  

  **Materiality Threshold**  
  A guaranteed loss <1% of total stake is immaterial. Tolerances below include rounding (max 0.025 per probability) + 0.01 materiality.

  ---

  ### Procedure  
  *Run in order for each quarter. Use spreadsheet for calculations.*

  #### **I. Preprocessing**  
  1. **Convert ranges**: For ranged probabilities, use the midpoint (e.g., [10%, 20%] → 15%).  
  2. **Flag special cases**:  
     - **One-sided**: Events where the team declines to take the other side of the bet.  
     - **Non-resolving**: Events that may never occur or be verifiable.  
  3. **Round inputs**: Use probabilities as submitted (rounded to nearest 5%).  

  #### **II. Static Checks (Per Team)**  
  *Fail any check → reject submission. For flagged events → escalate to CRO.*  

  1. **Axiom 0: Valid Probabilities**  
     - **Check**: All probabilities ∈ [0, 1].  
     - **Failure**: Any probability <0 or >1.  
     - **Stop**: Reject outright.  

  2. **Implication (If A ⇒ B, then P(A) ≤ P(B))**  
     - **Check**: For logically nested events (e.g., "Flood at X" ⇒ "Flood at X or Y"), verify P(A) ≤ P(B) + tolerance.  
     - **Tolerance**: 0.035 (0.025 rounding × 1 event-pair + 0.01 materiality).  
     - **Failure**: P(A) > P(B) + 0.035.  
     - **Action**:  
       - If neither A nor B is flagged → reject.  
       - If either is one-sided/non-resolving → escalate to CRO.  

  3. **Complements (P(A) + P(¬A) ≈ 1)**  
     - **Check**: For complementary pairs (e.g., "Flood at X" and "No flood at X"), compute |P(A) + P(¬A) - 1|.  
     - **Tolerance**: 0.06 (0.025 rounding × 2 events + 0.01 materiality).  
     - **Failure**: |P(A) + P(¬A) - 1| > 0.06.  
     - **Action**:  
       - If neither event is flagged → reject.  
       - If either is one-sided/non-resolving → escalate to CRO.  

  4. **Mutually Exclusive Events (P(A ∨ B) ≈ P(A) + P(B))**  
     - **Check**: For mutually exclusive pairs with P(A ∨ B) provided (e.g., "Flood at X" and "Flood at Y" where X, Y disjoint), compute |P(A ∨ B) - [P(A) + P(B)]|.  
     - **Tolerance**: 0.085 (0.025 × 3 probabilities + 0.01).  
     - **Failure**: Difference > 0.085.  
     - **Action**:  
       - No flags → reject.  
       - Any flag → escalate to CRO.  

  5. **Conditional Probabilities (P(A|B) × P(B) ≈ P(A ∧ B))**  
     - **Check**: Where P(A|B), P(B), and P(A ∧ B) are provided, compute |P(A|B) × P(B) - P(A ∧ B)|.  
     - **Tolerance**: 0.085 (0.025 × 3 probabilities + 0.01).  
     - **Failure**: Difference > 0.085.  
     - **Action**:  
       - No flags → reject.  
       - Any flag → escalate to CRO.  

  #### **III. Cross-Team Checks**  
  *All teams passing static checks → proceed.*  

  6. **Same Event, Different Teams**  
     - **Check**: For identical unconditional events (e.g., "River gauge at X > threshold") across teams, compute max probability difference.  
     - **Tolerance**: 0.035 (0.025 rounding + 0.01 materiality).  
     - **Failure**: Difference > 0.035.  
     - **Action**: Escalate to CRO (modelling choice—should probabilities align?).  

  #### **IV. Cross-Time Checks**  
  7. **Revisions from Prior Quarter**  
     - **Check**: For revised probabilities of the same event (same team), compute |P_old - P_new|.  
     - **Tolerance**: 0.035 (0.025 rounding + 0.01 materiality).  
     - **Failure**: Difference > 0.035.  
     - **Action**: Escalate to CRO (may reflect new information—not inherently incoherent).  

  #### **V. Outcome**  
  - **Pass**: All checks within tolerances.  
  - **Reject**: Any static check failure (non-flagged events).  
  - **Escalate to CRO**: Flagged events, cross-team, or cross-time issues.  
    - *CRO decides*: Accept (modelling choice), reject, or request revision.  

  ---

  ### Worked Examples  

  #### **Example 1: Jointly Incoherent Submissions**  
  - **Context**: Team A (River Monitoring) and Team B (Flood Response) submit for same quarter.  
  - **Submissions**:  
    - Team A: P(River gauge X > 5m) = 40%  
    - Team B: P(River gauge X > 5m) = 50%  
  - **Static checks**: Both pass individually (no internal violations).  
  - **Cross-team check**: Difference = 10% > 0.035 → escalate to CRO.  
  - **Dutch Book**:  
    - Sell £100 bet on "Gauge > 5m" to Team A at 40% (£40 received).  
    - Buy £100 bet on "Gauge > 5m" from Team B at 50% (£50 paid).  
    - **Outcome**:  
      - If gauge > 5m: Pay Team A £100, receive £100 from Team B. Net: £40 - £50 = **-£10**.  
      - If gauge ≤ 5m: Pay nothing, receive nothing. Net: **-£10**.  
    - **Loss**: Guaranteed £10 (10% of stake).  
  - **CRO action**: Align probabilities or justify discrepancy.  

  #### **Example 2: Rounding Mimicking Incoherence**  
  - **Context**: Team C submits:  
    - P(IT outage at Site X) = 40%  
    - P(No IT outage at Site X) = 50%  
  - **Static check (complements)**: |40% + 50% - 100%| = 10% > 0.06 → appears incoherent.  
  - **Reality**: True probabilities 42% (rounded to 40%) and 57% (rounded to 55%? but submitted as 50%).  
  - **Rounding analysis**:  
    - Max rounding error: 0.025 × 2 = 5% → observed 10% gap exceeds tolerance (6%).  
  - **Procedure**: Reject (non-flagged events).  
  - **Resolution**: Team revises to 40% and 60% (sum=100%, within tolerance).  

  #### **Example 3: Coherent but Absurd Submission**  
  - **Context**: Team D submits:  
    - P(Cyberattack in Q3) = 0%  
    - P(Data breach in Q3) = 100%  
  - **Static checks**:  
    - Axiom 0: Pass (0%, 100% ∈ [0, 1]).  
    - No complements/implications to check → pass.  
  - **Procedure outcome**: Pass.  
  - **Issue**: Numbers are coherent but absurd (0% implies impossibility; 100% implies certainty).  
  - **Action**: Chair overrides *on calibration grounds* (not coherence) and requests evidence review.  

  ---

  **Final Note**: This procedure ensures probabilistic coherence but relies on the CRO and reviewers to judge context, materiality, and reasonableness. Always document decisions for audit.
