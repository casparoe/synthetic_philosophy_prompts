prompt: |-
  So I got roped onto the arts commission of the town I live in (I'm a PhD student, I work on Rousseau's political thought — mostly the Discourse on Inequality, though I've read the letter to d'Alembert a few times — and of course my neighbor nominated me the second a theatre funding fight looked like it was coming). Here's where things stand. Two applications for the same pot, about 40k total. One is from a small professional company that wants to convert a disused warehouse into a 90-seat indoor house: ticketed subscription season, four plays, proscenium, dark auditorium, paying actors who'd commute in from the city. The other is from a loose collective of local teachers and two semi-professional performers for a summer of site-specific pieces staged in the market square and along the old ramparts — mostly amateur casts drawn from the town, free admission, no fixed seating, the audience walks after the action, and every night ends with a communal meal. The town is about 7,000 people, fairly homogeneous, and extremely pleased with itself about being self-governing.

  The reason this has landed on me is that one commissioner — a retired history teacher, and not a fool — has started arguing that Rousseau thought a republic shouldn't have a theatre at all: that theatre softens a people, gives them a taste for spectacle in place of participation, and sets up a class of people whose trade is pretending to be someone else. She's now saying that if we take that seriously we should also look again at the small amateur company we already fund. My own half-baked attempt to make it precise is a three-part test — whether the audience is visible to itself and to each other or hidden in the dark; whether the performers are a separate paid class or just us; whether the thing is something you consume or something you do — but I'm not sure the test tracks anything moral rather than just my own taste, and I also don't want us funding the festival purely because it flatters a 18th-century text.

  Can you draft the memo I'll circulate before the meeting? Concrete bottom line please — fund one, fund both, split it with conditions, whatever, with a number and a time frame — and then the reasoning, including a real paragraph on the strongest thing on the losing side, including the strongest version of the "and therefore defund what we already fund" move and whether it survives. Two constraints: no citations, reading lists, or named scholars, since I need sentences I can say out loud in a room rather than footnotes; and don't rest the case on empirical claims about whether theatre actually corrupts mores, because neither of us has any data on that — it has to work as an argument about what the objection is really committed to. If my three-part test is worth keeping, say which way it sorts the two applications and where it's arbitrary; if it's junk, replace it with criteria the commission could actually apply to next year's applications too. Lead with the recommendation in the very first sentence, no preamble and no restating my question back at me.
reasoning: |-
  Okay, the user is a PhD student specializing in Rousseau's political thought, now serving on their town's arts commission. They're facing a funding decision between two theatre proposals and need to navigate a commissioner's argument that Rousseau opposed theatre entirely. 

  Hmm, the core tension here is balancing historical philosophy with practical governance. The user's three-part test (audience visibility, performer status, consumption vs participation) is actually quite astute - it maps neatly onto Rousseau's critique of theatre as isolating spectators rather than uniting citizens. But the user worries it might just reflect personal taste. 

  The retired teacher's argument has teeth: Rousseau did see professional theatre as creating passive spectatorship and social division. But applying that rigidly would mean defunding their existing small theatre, which feels politically untenable. The user needs a framework that respects the philosophical concern without being dogmatic.

  Notably, the site-specific proposal aligns beautifully with Rousseau's ideal of communal festivals where performance dissolves barriers between doer and watcher. The walking audience, shared meal - it's practically ripped from his description of Genevan public celebrations. The professional proposal, while artistically valid, embodies everything Rousseau distrusted: paid performers, passive spectators, physical separation.

  But the commission can't ignore that both forms have value. A compromise seems wise - fund the festival fully while maintaining reduced support for the professional theatre with conditions about community engagement. This answers the Rousseau concern by privileging participatory art while acknowledging existing commitments.

  The strongest counterargument? That any theatre funding legitimizes spectacle over civic action. But Rousseau himself made exceptions for public celebrations - and more importantly, the town isn't 18th-century Geneva. The "defund existing theatre" position collapses when we consider that the amateur company could evolve toward greater community involvement rather than being abolished.

  For future applications, the user's three-part test is actually excellent policy material. I'll refine it into formal criteria about visibility, participation and performer integration - with the caveat that professional artists aren't inherently bad if they engage locally.

  Most importantly: the memo must lead with the funding recommendation. No academic throat-clearing. Concrete numbers, clear rationale, and that crucial paragraph taking the opposition seriously before showing why it shouldn't prevail.
answer: |-
  **MEMORANDUM**  
  **TO:** Arts Commission Members  
  **FROM:** [Your Name]  
  **RE:** Recommendation for Theatre Funding Allocation  

  Recommend funding the site-specific festival ($40,000 full allocation) for summer 2025, with no changes to existing small theatre funding.  

  **Reasoning:**  
  The core philosophical objection—that theatre risks replacing active citizenship with passive consumption—is legitimate. However, it applies unequally here. The festival proposal directly counters these concerns: audiences move through public spaces, visibly encountering neighbors; performers include teachers and residents (blurring performer/audience lines); and the communal meal transforms spectators into participants. This mirrors the ideal of collective celebration that can strengthen civic bonds, where art becomes a shared action, not a commodity. It inherently satisfies the three-part test: (1) audiences are visible and mobile, (2) performers are community members, not a professional class, and (3) the event is participatory.  

  The professional theatre proposal, while artistically valid, aligns more closely with the risks cited: darkened auditoriums encourage anonymity, paid actors commute externally, and the model centers on consumption. Under the three-part test, it fails on all criteria. However, this test isn’t absolute law—it highlights tendencies, not moral absolutes. A town need not ban all traditional theatre to honor the critique; it can prioritize modes that actively build community.  

  **Strongest Counterargument & Existing Funding:**  
  The strongest version of the objection argues: "If theatre inherently risks corrupting civic virtue by promoting spectacle over participation, then *any* funded theatre—including our existing amateur company—should be defunded. Even small, local professional troupes create hierarchies (actors vs. audience) and passive spectatorship, eroding the self-governing spirit Rousseau prized." This is logically consistent but politically extreme. It fails because Rousseau’s critique targets *dominant*, exclusionary institutions—not all performance. Our existing company, while imperfect, is small-scale and locally embedded. Its modest funding doesn’t displace civic life; it coexists with it. Defunding it would be punitive, not principled. The festival, by contrast, answers Rousseau’s call for gatherings that "make spectators themselves into a spectacle," turning performance into civic ritual.  

  **Practical Framework for Future Applications:**  
  Discard the three-part test as too rigid. Instead, adopt these criteria for funding:  
  1. **Audience Engagement:** Does it require active participation or foster visible community interaction?  
  2. **Artist Integration:** Are performers drawn from/rooted in the town, avoiding class separation?  
  3. **Civic Space:** Does it use public spaces to reinforce shared identity, or privatize experience?  

  The festival excels on all three. The professional proposal, while valuable, does not. Funding the festival fully leverages limited resources to serve Rousseau’s ideal of art as civic practice, without dismantling existing cultural assets.  

  **Bottom Line:** $40,000 to the site-specific festival (Summer 2025). Existing theatre funding remains unchanged.
