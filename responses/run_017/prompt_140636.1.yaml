prompt: |-
  You are a professional philosopher who works on identity over time and material constitution, and who has some patience for the ways institutions — museums, registries, insurers, hospital ethics committees — operationalise identity claims they cannot actually define. Please think carefully and work in stages rather than delivering a verdict in one breath: first set out the different things our practice might be tracking (matter, form, function, continuous existence, causal history, convention); then reconstruct the implicit theory; then test that reconstruction against the awkward cases at the end, and mark clearly where it fails. I would rather have a careful diagnosis than a tour of the standard positions, though if a standard position really is the hinge, name it and show what work it does rather than just labelling it.

  Here is the practice I am stuck inside. I am a volunteer trustee of a small maritime heritage trust that owns a nineteenth-century wooden fishing vessel, kept afloat and sailed every summer. Over roughly forty years she has been repaired plank by plank: very little of the timber that was in her when we acquired her is still in her, and the mast, the rigging and the engine are all replacements. Nobody involved doubts that she is the same boat — she keeps the same name, the same registration, the same entry in the register of historic vessels, and she remains eligible for the maintenance grants our trust exists to hand out. But the practice seems to tie itself in knots a few steps on. Some years ago a comparable boat was dismantled, her timbers numbered and stored, and then rebuilt with about eighty per cent of her original material, on a new structural cradle, to her original lines. In architectural conservation this technique of re-erecting something from its surviving original elements has a name, anastylosis, and is normally classed as restoration rather than new building. Our own funding rules, however, treated that vessel as a reconstruction — on the ground that she had ceased to exist as a vessel during the interval — and the insurers wanted to rate her as a new build. So we appear to hold that the piecemeal replacement of nearly all the matter leaves identity untouched, while a gap in existence destroys it even though most of the original matter returns. The same rulebook then adds a quantitative test: a project counts as maintaining an original vessel only while at least sixty per cent of the structural fabric is original. When a case lands near that line the trustees settle it by majority vote — and yet nobody on the board thinks the vote *makes* the vessel the same vessel; we all think a majority could get it wrong. For what it is worth, the same people are entirely untroubled in saying that a patient with a donor heart, or one who has simply replaced most of their cells over a lifetime, is straightforwardly the same person, while a patient whose brain has permanently stopped functioning is not, even though the body is warm and intact. I realise this is the Ship of Theseus with paperwork and an insurance schedule attached.

  So: what does this cluster of rules actually presuppose about what it is for a thing to persist? Reconstruct the implicit theory as charitably as you can, and then separate three things — what the practice strictly presupposes, what it merely fits well with, and what it is entirely neutral about. In particular, tell me whether we are committed to one consistent criterion or whether we are running a coalition of criteria that happens not to clash in the cases we usually meet; and if it is a coalition, say which rival theories of identity over time would license exactly the rules we have anyway, so that our rulebook is philosophically underdetermined. Then take the counterfactuals seriously: if we adopted the view that persistence admits of degrees, or that there is no determinate fact of the matter about which vessel is Theseus's, or that distinct material things can coincide and share all their matter at a time, what would our grant criteria, our register entries and our insurance clause actually have to say instead? And where the practice is arbitrary or incoherent — the sixty per cent line, the vote, the asymmetry between the plank-by-plank boat and the dismantled one — locate the fault precisely and tell me the cheapest revision that would remove it, and what that revision would cost us in terms of what we are trying to preserve.
reasoning: |-
  Okay, the user is a trustee of a maritime heritage trust dealing with a real-world Ship of Theseus problem. They've described how their institution handles identity for a wooden boat that's been gradually replaced plank by plank versus one that was dismantled and rebuilt. They need a philosophical analysis of what their practices presuppose about persistence, where it fails, and how to fix inconsistencies without losing their conservation goals.

  Hmm, this is fascinating because it's not just abstract philosophy - it's about funding rules, insurance policies, and conservation ethics. The user clearly understands the philosophical stakes but needs help unpacking their institutional logic. They mentioned being untroubled by similar cases with human bodies, which suggests they see a distinction between biological and artefactual persistence.

  First, I should identify what their practice actually tracks. Their rules seem to prioritize continuous existence over material continuity - the constantly repaired boat keeps its identity while the dismantled/rebuilt one doesn't, despite having more original material. Yet they also have that arbitrary 60% material threshold and voting system. That contradiction needs untangling.

  The core tension is between three things: 1) their functional approach to the gradually repaired boat, 2) their existential requirement for the dismantled one (the "gap" matters), and 3) the material threshold that contradicts both. The voting system admits there's factual uncertainty while maintaining there is a fact of the matter - which is philosophically unstable.

  For the implicit theory, it's closest to endurance theory with conventionalist escape hatches. They treat the boat as persisting through part replacement as long as there's spatiotemporal continuity, but draw a hard line at disassembly. The 60% rule then smuggles in material criteria through the back door.

  The cheapest fix would be to drop the percentage rule and voting system, replacing them with criteria focused on continuity of function and custodianship. For the dismantled boat case, they might create a "reconstructed original" category that preserves heritage value without pretending it's the same entity. This would align better with their own intuition that material isn't what matters most.

  What's clever about their question is how they spot that their practice already contains the seeds of its own solution - their comfort with biological persistence shows they intuitively grasp functional persistence. The challenge is translating that insight into coherent institutional rules without undermining their conservation mission.
answer: |-
  Your practice reveals a sophisticated, albeit conflicted, operational metaphysics of persistence. Let's dissect it systematically.

  ### I. What the Practice Tracks (Implicitly)
  1. **Continuous Existence**: Spatiotemporal continuity is paramount. The plank-by-plank boat never ceased being a *floating, functional vessel*. The dismantled boat had a "gap" where no vessel existed.
  2. **Functional Continuity**: The vessel must remain sailable and recognizable as a working boat. Identity is tied to ongoing maritime function.
  3. **Material Inheritance**: Original matter confers heritage value but isn't strictly necessary for identity (*until* the 60% rule appears).
  4. **Formal/Structural Integrity**: The identity-preserving repairs must follow original lines/design. Rebuilding "to original lines" is insufficient after disassembly.
  5. **Causal History**: The chain of custody matters. Continuous stewardship by the trust legitimizes identity claims.
  6. **Conventional Recognition**: Registration, naming, and institutional memory anchor identity socially.

  ### II. Reconstructed Implicit Theory
  Your practice presupposes a **Hybrid Endurance Theory with Conventionalist Overrides**:
  - **Core Commitment**: An entity persists iff it maintains *spatiotemporal continuity of organized function*.  
    - *Why?* The gradually repaired boat survives because functional activity (sailing, maintenance) never ceased. The dismantled boat "died" when its function stopped.
  - **Material Threshold as Proxy**: The 60% rule isn't identity-defining but a *heritage authenticity heuristic*. It ensures conservation grants fund historically significant objects, not replicas.
  - **Voting as Epistemic Tool**: Trustees vote not to *constitute* identity but to *assess* whether functional continuity was preserved when material thresholds are ambiguous.
  - **Asymmetry Explained**:  
    - *Plank-by-plank*: Continuous function overrides material turnover (like biological organisms).  
    - *Dismantled vessel*: Functional discontinuity destroys identity, even if matter is reused (like a corpse vs. a transplant recipient).  
    - *Implied Premise*: **Function requires embodiment**, but the *same matter* isn't necessary if function flows continuously.

  ### III. Where the Theory Fails (Diagnosing the Knots)
  1. **The 60% Contradiction**:  
     - *Conflict*: If functional continuity suffices for identity (plank-by-plank case), why does material percentage matter?  
     - *Fault*: Conflating *identity persistence* (metaphysical) with *heritage value* (normative). The rule is a conservation policy smuggled into identity criteria.  
     - *Cost of Incoherence*: Undermines the core functionalist commitment.

  2. **The Voting Paradox**:  
     - *Conflict*: Voting implies conventionalism ("identity is decided by us"), yet trustees believe they track mind-independent facts.  
     - *Fault*: Mistaking *epistemic limitations* (we can't measure functional continuity precisely) for *ontological indeterminacy*.  
     - *Cost*: Erodes confidence in institutional objectivity.

  3. **Anastylosis Asymmetry**:  
     - *Conflict*: Rejecting the rebuilt boat's identity contradicts architectural conservation norms (anastylosis = restoration).  
     - *Fault*: Overemphasizing *temporal gaps* while downplaying *material and formal continuity*.  
     - *Cost*: Inconsistent treatment of materially similar conservation methods.

  ### IV. Philosophical Underdetermination & Rival Theories
  Your rules are compatible with multiple theories:
  - **Functionalist Endurantism** (favored): Persistence requires continuous causal role fulfillment (fits plank-by-plank and person cases).
  - **Conventionalism**: Identity is socially stipulated (fits voting but contradicts trustees' realism).
  - **Hybrid Material-Functional Views**: E.g., *Lynne Baker's Constitution View*: The boat persists if its "primary kind" (functional vessel) is preserved through gradual part replacement, but ceases if reconstituted after disassembly.  
    - *Crucially*: **No standard theory licenses the 60% rule**. It's purely pragmatic.

  ### V. Counterfactual Rulebook Revisions
  | **Theory Adopted**          | **Grant Criteria**                                                                 | **Insurance/Registry Implications**                                  |
  |-----------------------------|------------------------------------------------------------------------------------|----------------------------------------------------------------------|
  | **Degrees of Persistence**  | Grants prorated by "identity strength" (e.g., 100% for plank-by-plank, 80% for anastylosis) | Vessels rated on "originality index"; premiums scaled accordingly. |
  | **Ontological Indeterminacy** | Grants require provenance documentation, not identity claims; focus on historical value.   | Registry lists "objects of contested identity"; insured as replicas after major gaps. |
  | **Coincident Entities** (e.g., David Wiggins) | Distinguish "Original Vessel (reconstituted)" and "Replica" after anastylosis; grants only to former. | Dual registry entries; insurers rate based on matter's age. |

  ### VI. Cheapest Coherent Revision
  **Problem:** The core contradiction is using functional continuity for identity *except* when material falls below 60%—a normatively motivated exception.

  **Solution:** **Decouple identity from heritage value.**  
  - **Step 1:** Affirm functional continuity as sole identity criterion. Dismantled boats lose identity; plank-by-plank repairs preserve it.  
  - **Step 2:** Replace the 60% rule with a **Heritage Significance Assessment** (HSA):  
    - *Original Matter*: Weighted factor (e.g., 40% of score).  
    - *Continuity of Craft/Custodianship*: 30% (preserves trust's mission).  
    - *Functional Integrity*: 30%.  
    - Grants awarded above a HSA threshold (e.g., 75/100), *not* tied to identity.  
  - **Step 3:** Replace voting with **Expert Panels** assessing HSA.  

  **Costs & Benefits:**  
  - *Cost*: Accepts that a preserved boat with <20% original matter is "the same vessel" but may not merit heritage funding. Forces explicit valuation of conservation ethics over metaphysics.  
  - *Benefit*: Resolves incoherence; aligns with your functionalist intuitions; accommodates anastylosis cases (high HSA but new identity).  

  **Why this works**: It honors your insight that identity isn't gradable (contra degrees-of-persistence views) while acknowledging that conservation aims to preserve *more than* strict identity—namely historical substance and craft tradition. The asymmetry between gradual and sudden change remains defensible: continuous function sustains identity; reassembly creates a new entity with inherited properties. This revision makes your implicit metaphysics explicit and disentangles it from pragmatic conservation goals.
