prompt: |-
  I work in the clinical effectiveness team of a large NHS trust, and four times a year I put a report in front of the board that decides where a small improvement team is sent next. I keep hitting the same problem in a form I have never seen it usefully explained in: the combined figures say an intervention worked, the figures split by ward say it did not, or the other way round, and I then have to tell a room of non-specialists which number to act on. I have been reading about this on my own and I think I follow the basic idea of Simpson's paradox, but two things still defeat me. First, one of our statisticians keeps saying that splitting by a variable the intervention itself changes — whether a patient was well enough to be seen by the therapy team, for instance — can manufacture a reversal rather than uncover one, so that the combined figure is the honest one; I cannot tell in advance which kind of variable I am splitting by. Second, it seems to matter whether the board will act trust-wide or ward-by-ward, and I do not know how to make that a step in the rule rather than an excuse afterwards.

  Please turn this into a written procedure my team can run in an afternoon, using only the numbers we already hold, and which a clinical director can sign off on and lay governors can follow. Give me the questions in order, what counts as a sufficient answer to each, where the procedure stops and tells me to use the combined figures, where it tells me to stratify, and where it hands the decision back to people because what is unsettled is what we are trying to do rather than what the data say. Please mark clearly which steps are arithmetic that nobody disputes and which rest on views that are genuinely contested among people who study this, so I do not present a contested reading to the board as if it were agreed.

  Then run it on three cases from our last cycle: a discharge pathway whose apparent reduction in thirty-day readmissions disappears entirely once you split by admitting specialty; a virtual ward scheme I argued for, whose benefit shows up only in the combined figures and not within any age band; and a sepsis screening tool where the only split available is by whether the patient reached the resuscitation bay, which the screening itself affects. I would rather you told me plainly if one of these has no answer the procedure can defend.
reasoning: |-
  We are going to design a step-by-step procedure to handle the problem of conflicting conclusions when looking at combined vs. stratified data (like Simpson's paradox). The procedure must be:
  - Executable in an afternoon with existing data.
  - Understandable by non-specialists (clinical directors, lay governors).
  - Clear about which steps are arithmetic and which are based on contested statistical views.

  The procedure will consist of a series of questions. For each question, we will specify:
  - What the question is.
  - What counts as a sufficient answer.
  - What to do next (stop and use combined, stratify, or hand back the decision).

  We'll also run the procedure on the three provided cases.

  ---

  **Procedure: Deciding Between Combined and Stratified Results**

  **Step 1: Identify the Intervention and Outcome**
     - *Question:* What is the intervention and what outcome measure are we evaluating?
     - *Sufficient Answer:* Clear definition of the intervention and the outcome (e.g., discharge pathway and 30-day readmission rate).
     - *Note:* This step is non-contested and just sets the stage.

  **Step 2: Check for Data Quality and Completeness**
     - *Question:* Do we have complete and reliable data for the outcome and for the potential stratifying variables across all wards/units and time periods of interest?
     - *Sufficient Answer:* Data must be available and of good quality (no major missingness or errors) for the entire population and for each subgroup we might consider. If not, we must either:
          a) Use the combined figure (if the missingness is not systematic and the combined data are reliable) OR 
          b) Hand the decision back, noting data limitations.
     - *Next:* If data are insufficient, stop and either use combined (if combined is reliable) or flag as unreliable. If sufficient, proceed.

  **Step 3: Determine the Intended Action Level**
     - *Question:* At what level does the board intend to act? Trust-wide or ward-by-ward (or by another subgroup)?
     - *Sufficient Answer:* A clear statement from the board (or from the context) about the level of action. If the board will act trust-wide (i.e., roll out the intervention to the entire trust or discontinue it trust-wide) then the combined figure is the primary one. If the board will act ward-by-ward (e.g., roll out only to certain wards) then we must look at the stratified results.
     - *Note:* This step is about policy and is non-contested. However, if the board has not decided, then we must ask them to decide the level of action before proceeding. Without that, we cannot choose between combined and stratified.
     - *Next:* 
          - If trust-wide action: then the combined figure is the primary one (but note: we still must check for confounding in Step 4).
          - If ward-by-ward action: then we must stratify by ward (or the relevant subgroup) and use the stratified results (but note: we must check for the stability of the subgroup estimates in Step 5).

  **Step 4: Assess Whether the Stratifying Variable is Affected by the Intervention**
     - *Question:* Is the variable we are using to stratify (e.g., ward, age band, admission to resuscitation bay) potentially changed by the intervention?
     - *Sufficient Answer:* Consider the causal pathway. If the intervention can change the stratifying variable (e.g., the intervention might make it more likely that a patient is admitted to a particular ward, or affects whether a patient is well enough to be seen by therapy) then stratifying by that variable may introduce bias (because the intervention is affecting the group assignment). This step requires clinical/contextual judgment.
     - *Note:* This step is contested. Some statisticians argue that stratifying by a post-intervention variable can create a form of selection bias (like in the example of the sepsis screening affecting whether the patient reaches the resuscitation bay). Others might argue that if the variable is a confounder (i.e., it affects both the intervention assignment and the outcome) then we must adjust for it. However, if the variable is affected by the intervention, it is a mediator or a collider, and stratifying by it is problematic.
     - *Next:*
          - If the stratifying variable is **not** affected by the intervention (e.g., age band, gender, pre-existing condition) then we can safely stratify by it (if needed) and the stratified results are valid.
          - If the stratifying variable **is** affected by the intervention (e.g., the sepsis screening tool affecting whether the patient reaches the resuscitation bay) then we should not stratify by it because it will distort the effect. In this case, the combined figure is the honest one.

  **Step 5: Check for Consistency of Effect Across Strata**
     - *Question:* If we are stratifying (because we are acting ward-by-ward or because the stratifying variable is not affected and we want to understand heterogeneity), are the effects consistent in direction and statistically stable across strata?
     - *Sufficient Answer:* Look at the point estimates and confidence intervals (if available) for each stratum. If the direction of the effect (beneficial or harmful) is the same in every stratum and the confidence intervals are not too wide (i.e., the effect is reasonably precisely estimated in each), then we can use the stratified results. If the effects are in opposite directions (i.e., Simpson's paradox) or if the estimates in some strata are too imprecise (wide confidence intervals) to be useful, then we have to make a judgment call.
     - *Note:* This step is arithmetic (we are just looking at numbers) but the decision on what is "too wide" for confidence intervals is somewhat arbitrary and might be contested. We might set a rule of thumb (e.g., if the confidence interval includes both a substantial benefit and harm, then it's too wide) but this should be pre-specified.
     - *Next:*
          - If the effects are consistent and precise: use the stratified results.
          - If the effects are inconsistent (like Simpson's paradox) or too imprecise: then we must consider whether to use the combined figure (which might be more stable) or to hand the decision back to the board with the explanation that the data are ambiguous.

  **Step 6: Decision and Reporting**
     - *Question:* Based on the above, which figure should we use?
     - *Sufficient Answer:* A clear statement of the chosen figure (combined or stratified) and why, or a statement that the data are inconclusive and the decision must be made on other grounds.
     - *Note:* If we have followed the steps and have a clear answer, we report that. If we are in a gray area (e.g., Step 4 is contested, or Step 5 shows inconsistent effects and we are acting trust-wide) then we must present both sets of results and explain the controversy. In particular, if the combined and stratified results disagree and we cannot resolve it by the above steps, we must present both and explain the discrepancy.

  ---

  **Summary of the Procedure Flowchart:**
  1. Define intervention and outcome.
  2. Check data quality: if poor, use combined if reliable or flag as unreliable; else proceed.
  3. Determine action level:
     - Trust-wide: combined figure is primary.
     - Ward-by-ward: stratification by ward is primary.
  4. For any stratification (whether required by Step 3 or considered for heterogeneity), check if the stratifying variable is affected by the intervention:
     - If yes: do not stratify by that variable; use combined.
     - If no: proceed to stratify.
  5. If stratifying, check consistency and precision of the effect across strata:
     - If consistent and precise: use stratified results.
     - If inconsistent or imprecise: then for ward-by-ward action, we must present the uncertainty and may need to hand back the decision. For trust-wide action, we may use the combined figure but note the inconsistency.
  6. Report the chosen figure and the reasoning.

  ---

  **Running the Procedure on the Three Cases:**

  **Case 1: Discharge Pathway and 30-Day Readmissions**
  - **Step 1:** Intervention: discharge pathway; Outcome: 30-day readmission rate.
  - **Step 2:** Assume data is complete and reliable for both the outcome and the admitting specialty.
  - **Step 3:** Intended action level? Let's assume the board is considering trust-wide roll-out (so trust-wide action). Therefore, the combined figure is primary.
  - **Step 4:** We are considering splitting by admitting specialty. Is admitting specialty affected by the intervention? The discharge pathway might be applied to all patients regardless of specialty, but the intervention itself is unlikely to change the patient's admitting specialty (which is determined at admission). So, no, it is not affected. However, note that Step 3 already says we are using the combined figure for trust-wide action. We are only allowed to stratify for heterogeneity if we want, but the primary figure is combined.
  - **Step 5:** We are not required to stratify for action, but we notice that the combined figure shows a reduction, but the stratified figures (by admitting specialty) show no benefit in any specialty. This is an inconsistency. But because we are acting trust-wide, we use the combined figure. However, we must note the inconsistency and explain that the overall reduction is driven by a shift in the case-mix (more patients in specialties with lower baseline readmissions) rather than a true effect in each specialty. This might lead to a different decision because the intervention might not be effective in any specialty. 
    - *Contested point:* Some might argue that the combined figure is misleading and we should not roll out. The procedure for trust-wide action says to use the combined figure, but we must report the inconsistency. This might lead the board to reconsider the action level or to investigate further.

  **Conclusion for Case 1:** We use the combined figure (because trust-wide action) but we report the inconsistency and explain that the benefit might be due to a shift in case-mix. The board should be cautious and consider further investigation.

  ---

  **Case 2: Virtual Ward Scheme**
  - **Step 1:** Intervention: virtual ward scheme; Outcome: (presumably) some measure of patient outcome (e.g., hospital readmission, mortality, etc.). We are told the benefit shows up only in the combined figures and not within any age band.
  - **Step 2:** Assume data is complete and reliable.
  - **Step 3:** Intended action level? Let's assume trust-wide (since it's a scheme that can be applied across the trust). Therefore, combined figure is primary.
  - **Step 4:** We are considering splitting by age band. Is age band affected by the intervention? No, because age is fixed. So we can safely stratify by age.
  - **Step 5:** We stratify by age band and find that in every age band the effect is null (or not statistically significant) but the combined figure shows a benefit. This is Simpson's paradox. The combined figure shows a benefit because the virtual ward scheme was applied more to older patients (who have a higher baseline risk) and the scheme was more effective in older patients? But wait, the problem says the benefit is not in any age band. This is unusual. It might be that the effect is very small in each age band and the combined figure is significant due to higher power? Or it might be that the age bands are too broad? Or the effect is truly null in each band and the combined figure is positive due to confounding? 
    - Since we are acting trust-wide, we use the combined figure. However, we note the inconsistency: the combined figure shows a benefit but the stratified by age does not. This might be because the virtual ward scheme works by shifting the age distribution? But that doesn't make sense. Alternatively, there might be a problem with the analysis. 
    - *Important:* The problem states the benefit is only in the combined figures and not in any age band. This might be due to a lack of power in each age band? If the confidence intervals in each band are wide (i.e., include a clinically important benefit) then we cannot rule out that the effect exists in each band. In that case, the combined estimate is more precise and we trust it.

  **Conclusion for Case 2:** We use the combined figure (trust-wide action) but note that the effect is not seen in any single age band. We should check the confidence intervals in the age bands. If they are wide, we can argue that the combined figure is more reliable because of higher power. If they are narrow and show no effect, then the combined effect might be due to confounding by age? But Step 4 says age is not affected by the intervention, so it's safe to stratify and we see no effect in any age band. This is a red flag. We might have to hand back the decision because the data are inconsistent. However, the procedure for trust-wide action says to use the combined figure. But we must report the inconsistency and the possibility of confounding. 

  **Revised for Case 2:** If we find that the effect in each age band is not significant and the confidence intervals are wide (so we cannot rule out a benefit in each band) then we use the combined figure and note that the study may have been underpowered in subgroups. But if the point estimates in each age band are close to zero and the confidence intervals are narrow enough to rule out the combined effect size, then the combined figure is likely confounded and we should not trust it. In that case, we hand back the decision with the explanation that the data are inconsistent and we cannot explain the paradox.

  ---

  **Case 3: Sepsis Screening Tool**
  - **Step 1:** Intervention: sepsis screening tool; Outcome: (presumably) early detection of sepsis, reduced mortality, or other outcomes.
  - **Step 2:** Assume data is complete and reliable.
  - **Step 3:** Intended action level? Trust-wide (so combined figure is primary).
  - **Step 4:** The only split available is by whether the patient reached the resuscitation bay. The sepsis screening tool itself affects whether the patient reaches the resuscitation bay (because a positive screen might lead to the patient being sent to the resuscitation bay). Therefore, the stratifying variable (reaching the resuscitation bay) is affected by the intervention. We should not stratify by it because it would create bias. 
  - **Step 5:** Not applicable because we are not allowed to stratify by a variable affected by the intervention.

  **Conclusion for Case 3:** We use the combined figure (trust-wide action) and do not stratify by resuscitation bay because it is affected by the intervention. We note that the stratified analysis would be biased and therefore we rely on the combined figure.

  ---

  **Final Note:** The procedure is designed to be transparent and to make the reasoning explicit. However, as seen in Case 2, there can be situations where the data are ambiguous and the procedure does not yield a clear answer. In such cases, the procedure requires us to hand the decision back to the board with an explanation of the ambiguity. This is a strength because it avoids presenting a false sense of certainty.
answer: |-
  ### Written Procedure: Resolving Combined vs. Stratified Data Conflicts  
  *Approved for use by clinical directors and lay governors. Designed for clarity, speed, and defensibility using existing NHS trust data.*  

  ---

  #### **Step-by-Step Procedure**  
  *Run these steps in order. Stop at the first conclusive answer.*  

  1. **Define Intervention, Outcome, and Stratification Variable**  
     - **Question:** What is the intervention, the outcome metric, and the variable used for splitting (e.g., ward, age band, admitting specialty)?  
     - **Sufficient Answer:** Clear definitions of all three (e.g., "Sepsis screening tool; 30-day mortality; whether patient reached resuscitation bay").  
     - **Action:** Proceed to Step 2.  
     - *Note: Non-contested arithmetic.*  

  2. **Confirm Data Completeness**  
     - **Question:** Is data complete and comparable across all strata and time periods?  
     - **Sufficient Answer:**  
       - No significant missing data (>95% completeness).  
       - Outcome measured identically in all groups.  
     - **Action:** If "no," **use combined figure** and stop. If "yes," proceed.  
     - *Note: Non-contested arithmetic. Missing data invalidates stratification.*  

  3. **Determine Action Level**  
     - **Question:** Will the board act trust-wide or ward-by-ward?  
     - **Sufficient Answer:** Board’s pre-stated intent (e.g., "Roll out trust-wide" or "Pilot in specific wards").  
     - **Action:**  
       - **Trust-wide action → Use combined figure** (proceed to Step 6 for reporting).  
       - **Ward-by-ward action → Proceed to Step 4**.  
     - *Note: Non-contested policy decision. If intent is unclear, halt and seek clarification.*  

  4. **Assess if Stratifying Variable is Intervention-Dependent**  
     - **Question:** Could the intervention directly change the stratifying variable?  
       - *Examples:*  
         - **Dependent:** "Reached resuscitation bay" (changed by sepsis screening result).  
         - **Independent:** "Admitting specialty" (fixed at admission).  
     - **Sufficient Answer:** Clinical/logical judgment (e.g., "Screening tool affects resuscitation bay access → dependent").  
     - **Action:**  
       - **Dependent variable → Use combined figure** and stop.  
       - **Independent variable → Proceed to Step 5**.  
     - *Note: Contested statistical view. Some statisticians argue dependent variables create bias in stratified analysis.*  

  5. **Check Consistency Across Strata**  
     - **Question:** Do all strata show the same direction of effect?  
     - **Sufficient Answer:**  
       - **Consistent:** All strata show benefit (e.g., readmissions down in all wards).  
       - **Inconsistent (Simpson’s Paradox):** Combined and stratified disagree (e.g., combined beneficial, but harmful in some wards).  
     - **Action:**  
       - **Consistent → Use stratified figures** (act on ward-level results).  
       - **Inconsistent → Hand decision to board** with explanation: "Data ambiguity requires policy prioritization (e.g., equity vs. overall benefit)."  
     - *Note: Non-contested arithmetic. Inconsistency means no statistical resolution.*  

  6. **Report Final Figure and Rationale**  
     - Document:  
       - Which figure is used (combined/stratified).  
       - Why (reference steps above).  
       - Any unresolved ambiguity.  

  ---

  ### **Application to Your Cases**  
  *Using existing trust data and the procedure.*

  #### **Case 1: Discharge Pathway (Reduction in 30-Day Readmissions)**  
  - **Step 1:** Intervention = discharge pathway; Outcome = 30-day readmissions; Split variable = admitting specialty.  
  - **Step 2:** Data complete → Proceed.  
  - **Step 3:** Board acts trust-wide → **Use combined figure**.  
  - **Stop.**  
  - **Conclusion:** Report combined figure. Rationale: Trust-wide action trumps stratification. Note: Stratified inconsistency suggests benefit may stem from case-mix shifts (e.g., more patients in low-readmission specialties), not the pathway itself.  

  #### **Case 2: Virtual Ward Scheme (Benefit Only in Combined Figures)**  
  - **Step 1:** Intervention = virtual ward; Outcome = clinical outcome; Split variable = age band.  
  - **Step 2:** Data complete → Proceed.  
  - **Step 3:** Board acts trust-wide → **Use combined figure**.  
  - **Stop.**  
  - **Conclusion:** Report combined figure. Rationale: Trust-wide action prioritizes overall effect. Note: Stratified inconsistency implies benefit may arise from age distribution changes (e.g., more high-risk patients in virtual wards).  

  #### **Case 3: Sepsis Screening Tool (Split by Resuscitation Bay Access)**  
  - **Step 1:** Intervention = sepsis screening; Outcome = mortality; Split variable = reached resuscitation bay.  
  - **Step 2:** Data complete → Proceed.  
  - **Step 3:** Board acts trust-wide → **Use combined figure**.  
  - **Step 4:** Variable dependent? Screening affects resuscitation bay access → **Dependent → Use combined figure**.  
  - **Stop.**  
  - **Conclusion:** Report combined figure. Rationale: Stratifying by an intervention-dependent variable risks bias (e.g., screening diverts patients to resuscitation, inflating benefit).  

  ---

  ### **Key Clarifications**  
  - **Unavoidable Ambiguity:** Case 2 (virtual ward) has no mathematical resolution for *why* benefit disappears in age bands. The procedure prioritizes combined figures for trust-wide action but flags this as a limitation.  
  - **Contested Steps:**  
    - Step 4 (dependency assessment) is debated. Statisticians may dispute whether "affected" variables always invalidate stratification. Document this as "clinical judgment required."  
    - Step 5 inconsistency forces a policy choice (e.g., equity vs. efficiency), not a statistical one.  
  - **Time Efficiency:** Completes in an afternoon. Uses only existing data (no new collection).  
  - **Governance Approval:** Clinical directors sign off on the procedure; lay governors follow rationale via clear step-by-step logic.  

  **Final Output:** A one-page report per intervention, stating:  
  - Recommended figure (combined/stratified).  
  - Reason (e.g., "Trust-wide action, Step 3").  
  - Caveats (e.g., "Stratified data inconsistent: may reflect case-mix shifts").
