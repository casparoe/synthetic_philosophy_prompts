prompt: |-
  I direct a small qualitative team at a contract research organisation, and for the past year we have been building the item pool for a patient-reported outcome instrument for a chronic condition that has no biomarker: the symptoms are, for practical purposes, whatever patients say they are. The sponsor wants a draft pool in six weeks. What we actually do is concept-elicitation and then cognitive-debriefing interviews: forty-five minutes, semi-structured, one interviewer and one notetaker, recorded, transcribed, and coded the following weekend by three people with psychology degrees and no philosophical training, none of whom will read anything I give them beyond a one-page sheet. The output has to survive review by a psychometrician and a clinician and, eventually, a regulator asking what evidence we have that our items mean what we claim they mean. We are also running in three languages, and I do not trust our back-translations.

  I have been reading about Dennett's heterophenomenology — the idea, as I have it, that we treat subjects' utterances as texts to be interpreted rather than as authoritative verdicts on their own experience, and that the proper object of study is what people say about what goes on in them rather than any inner show we are supposed to take at face value. I want that turned into something my team can run. So: give me a protocol, in the order we would execute it, from the moment a transcript lands to the moment a candidate item is admitted, held back, or killed. For each gate I need the question to ask, what would count as a sufficient answer to it, the conditions under which the protocol simply returns a no, and the points at which it has to stop and hand the decision to a named human being because the question has stopped being one about evidence and become one about what we are trying to measure — whether the instrument is for detecting change in a trial or for giving patients a vocabulary, for instance. I have been using two homemade devices and I would like you to tell me whether they survive the translation or whether they quietly reintroduce the error the method exists to avoid. My two-route rule: a candidate item enters the pool only if the symptom concept turns up both in spontaneous recall during open elicitation and under structured probing, and only if no interviewer named it first. My gloss-swap test: later in the same interview, substitute the clinician's proposed gloss for the patient's own word, and count the concept as the patient's only if they go on to use the gloss unprompted; if they merely assent to it when offered, we treat it as ours rather than theirs.

  Then run the protocol on three cases, and I would rather you told me now if it kills an item my sponsor is attached to than let me find out at the pre-submission meeting. One: patients volunteer brain fog constantly, endorse it heavily, and cannot define it beyond metaphors that look like they came from a patient forum; the sponsor wants it as a headline item. Two: when the pain items are asked before the fatigue items, mean fatigue severity comes out roughly a point lower on the 0–10 scale than when the order is reversed, and I cannot tell whether we have an item or a framing artefact. Three: a patient reports a symptom in the room, in front of the clinic nurse, that their own daily electronic diary for the same fortnight does not support. A fourth, smaller thing while you are at it: the sponsor insists our items be worded as first-person claims about inner goings-on, and I have a suspicion the third-person stance of the method should make me resist that, but I cannot tell whether that is what the method really implies or a misreading on my part. Please do not point me at papers or reading lists — I have no library access from the field sites, so argue from the position itself, and note where the protocol is doing real work and where it is only a judgement call with procedural clothing on.

  Structure the response in these sections, in this order and roughly these lengths: What the method commits us to, in our vocabulary — about 250 words; The protocol — about 700 words, as numbered gates with question, sufficient answer, stop rule and escalation; Worked applications — about 700 words, one subsection per case in the order I gave them, plus a short note on the item-wording question; Where the protocol misfires — about 250 words, the questions it cannot settle for us and where a person must decide; The one-page version — about 200 words, the checklist I can pin up above the coding desk.
reasoning: |-
  Okay, the user is leading a qualitative team developing a patient-reported outcome (PRO) instrument for a chronic condition without biomarkers. They need a practical protocol based on Dennett's heterophenomenology to ensure items are valid and meaningful. Let me unpack their requirements.

  First, their current process involves concept-elicitation and cognitive-debriefing interviews. The team has psychology backgrounds but no philosophical training. They need a structured method to interpret patient utterances as texts rather than taking them at face value. The output must withstand scrutiny from psychometricians, clinicians, and regulators.

  Key constraints: transcripts are coded by three people with only a one-page guide; back-translation concerns across three languages; sponsor wants a draft pool in six weeks. They also shared two homemade rules - the "two-route rule" (spontaneous + probed mention) and "gloss-swap test" (patient must adopt clinician's term unprompted).

  The user wants a gate-based protocol that:
  - Specifies questions to ask at each stage
  - Defines sufficient evidence thresholds
  - Has clear stop rules when automation fails
  - Escalates judgment calls about measurement goals
  - Tests their existing rules against Dennett's framework

  Their three test cases:
  1. "Brain fog" - heavily endorsed but poorly defined via forum metaphors
  2. Pain-fatigue order effect - potential framing artifact
  3. Symptom-narrative mismatch between interview and diary data
  Plus the sponsor's insistence on first-person wording

  I need to build this around Dennett's core principles: treating reports as speech acts requiring interpretation, focusing on what people say (not private experiences), and acknowledging that subjects can be wrong about themselves.

  For the protocol structure, I'll create numbered gates progressing from utterance to item decision. Each gate needs:
  - A specific question
  - Clear pass/fail criteria
  - Stop rules that trigger human escalation
  - Designated decision-makers when goals conflict

  The user's two rules need evaluation:
  - Two-route rule aligns well (avoids leading)
  - Gloss-swap test is problematic (demands unprompted adoption is unrealistic)

  For the cases:
  1. Brain fog should fail under heterophenomenology - metaphors aren't actionable
  2. Order effect requires framing artifact analysis
  3. Diary mismatch needs source triangulation
  4. First-person wording should be negotiable since the method focuses on report interpretation

  The one-page summary must distill this into bullet points coders can use immediately: key questions, evidence thresholds, stop flags, and escalation paths.

  Biggest challenges will be:
  - Training coders to interpret rather than accept claims
  - Handling sponsor attachment to problematic items
  - Resolving measurement goal conflicts
  - Managing multilingual nuances without proper back-translation

  The protocol's weakest points will be when linguistic interpretation crosses into clinical meaning-making - those always require human judgment. Also, translation issues will need senior oversight.
answer: |-
  ### What the Method Commits Us To
  Heterophenomenology treats patient utterances as *reports to be interpreted*, not privileged access to inner states. We commit to:  
  - **No authoritative introspection**: Patients aren't infallible about their symptoms. Their words are data about what they *believe and express*, not direct evidence of private experiences.  
  - **Textual interpretation**: Transcripts are "speech acts" requiring analysis of context, consistency, and linguistic patterns—like anthropologists studying a culture.  
  - **Third-person stance**: We study *what people say happens in them*, not "what happens." This avoids assuming experiences match reports.  
  - **Error tolerance**: Patients can be mistaken or inconsistent (e.g., misremembering symptoms), and our job is to detect this without dismissing them.  
  This means items must withstand scrutiny as *reliable linguistic markers* of patient-reported concepts, not as mirrors of "truth."  

  ---

  ### The Protocol: Gates for Item Admission  
  *(Execute in sequence per transcript/concept)*  

  **Gate 1: Utterance Validity Check**  
  - **Question**: "Is this a clear, unprompted description of a symptom experience?"  
  - **Sufficient answer**: Spontaneous mention during open elicitation, using patient’s own words (e.g., "My head feels full of cotton").  
  - **Stop/escalate**: If utterance only occurs after interviewer probing → escalate to Lead Researcher + Clinician to judge if concept is coerced.  
  - **Your rule check**: *Two-route rule survives*. Requires spontaneous + probed mention, blocking interviewer-led concepts.  

  **Gate 2: Semantic Stability Test**  
  - **Question**: "Does the patient’s description resist reinterpretation when challenged?"  
  - **Sufficient answer**: Patient uses consistent descriptors when probed (e.g., "brain fog" = "forgetful + slow" across questions).  
  - **Stop/escalate**: If descriptions shift under minimal pressure (e.g., "brain fog" becomes "headache" when probed) → kill item. Escalate to Psychometrician if ambiguity persists.  
  - **Your rule check**: *Gloss-swap test modified*. If patient *assents* to clinician’s gloss but doesn’t reuse it, flag as "sponsor-proposed concept"—don’t kill yet. If they *reject* it, kill.  

  **Gate 3: Contextual Consistency Review**  
  - **Question**: "Is the report consistent with other evidence from this patient?"  
  - **Sufficient answer**: Symptom aligns with diary data, observed behavior (e.g., pauses mid-sentence), or prior mentions.  
  - **Stop/escalate**: Contradictory evidence (e.g., diary shows no fatigue but interview claims "crippling exhaustion") → escalate to Clinician + Lead Researcher to assess plausibility.  

  **Gate 4: Cross-Linguistic Equivalence**  
  - **Question**: "Does the concept retain core meaning in all languages?"  
  - **Sufficient answer**: Back-translation matches source intent *and* elicits similar examples in all languages.  
  - **Stop/escalate**: Suspected "translation artifact" (e.g., Spanish "niebla mental" implies confusion, not slowness) → kill non-equivalent versions. Escalate to multilingual Lead Researcher.  

  **Gate 5: Frame Robustness Check**  
  - **Question**: "Is the concept independent of interview context?"  
  - **Sufficient answer**: Severity/endorsement stable regardless of item order or setting (e.g., fatigue score doesn’t shift if pain questions precede it).  
  - **Stop/escalate**: Framing effects detected → kill item or reformulate. Escalate to Psychometrician for statistical validation.  

  **Gate 6: Regulatory Viability**  
  - **Question**: "Can we defend this as measuring what we claim?"  
  - **Sufficient answer**: Evidence from Gates 1–5 shows the item captures a patient-driven, stable concept.  
  - **Stop/escalate**: Insufficient evidence → kill. If sponsor disputes, escalate to Regulatory Lead with documentation.  

  ---

  ### Worked Applications  
  **Case 1: Brain Fog**  
  - **Gate 1**: Passes (spontaneous mentions).  
  - **Gate 2**: Fails. Metaphors ("like wading through syrup") lack stable descriptors. Patient can’t define it without forums → *kill*.  
  - **Why it dies**: Heterophenomenology treats this as cultural meme adoption, not personal experience. Sponsor’s attachment ignored—item invalid without actionable meaning.  

  **Case 2: Pain-Fatigue Order Effect**  
  - **Gate 5**: Framing artifact confirmed (mean fatigue score drops when pain items lead).  
  - **Action**: Kill fatigue items *as currently worded*. Escalate to Psychometrician to test split versions (e.g., "physical fatigue" vs. "mental fatigue").  
  - **Core issue**: Patients may conflate symptoms contextually. Item must isolate fatigue from pain.  

  **Case 3: Diary-Inconsistent Symptom**  
  - **Gate 3**: Contradiction detected (interview: "daily nausea"; diary: 0/14 days).  
  - **Escalate**: Clinician reviews—was the diary used retrospectively? If yes, interview may be more reliable. If real-time diary, kill item as unreliable report.  

  **Item-Wording Question**  
  - Sponsor’s first-person demand ("I feel foggy") is *compatible*. Heterophenomenology studies *reports*, so wording format is neutral. Resistance isn’t needed—what matters is whether the phrase is patient-validated (via Gates 1–4).  

  ---

  ### Where the Protocol Misfires  
  - **Ambiguous symptom boundaries**: E.g., is "burning fatigue" pain or fatigue? Gate 2 flags inconsistency, but Clinician must decide clinical intent.  
  - **Cultural/language gaps**: When metaphors lack equivalents (e.g., English "fog" vs. languages without an equivalent), the Lead Researcher must arbitrate—no automated fix.  
  - **Sponsor-goal conflicts**: If the instrument is for "patient vocabulary" (exploratory) vs. "trial endpoints" (validated change), Regulatory Lead decides trade-offs (e.g., keeping less stable items for inclusivity).  
  - **Diary reliability**: If diaries are poorly maintained, Gate 3 defaults to interview data—judgment call by Clinician.  

  ---

  ### One-Page Version: Coding Desk Checklist  
  **ITEM ADMISSION PROTOCOL**  
  1. **UNPROMPTED?**  
     - ✓ Spontaneous mention in open section.  
     - ✗ Only if interviewer named it → Escalate to Lead + Clinician.  

  2. **STABLE MEANING?**  
     - ✓ Consistent description when probed.  
     - ✗ Shifts under pressure → Kill.  
     - Clinician’s gloss reused? ✓ = patient’s. Mere assent? ✓ = sponsor’s.  

  3. **BACKED BY EVIDENCE?**  
     - ✓ Matches diary/behavior.  
     - ✗ Contradicts → Escalate to Clinician.  

  4. **WORKS IN ALL LANGUAGES?**  
     - ✓ Back-translation matches intent.  
     - ✗ Artifact detected → Kill non-matching versions.  

  5. **RESISTS FRAMING?**  
     - ✓ Scores stable if question order changes.  
     - ✗ Not stable → Kill/reword. Escalate to Psychometrician.  

  6. **DEFENSIBLE?**  
     - ✓ All gates passed → Admit to pool.  
     - ✗ Failed any gate → Kill.  
     - Sponsor dispute? Escalate to Regulatory Lead with evidence trail.  

  **STOP & FLAG**: Contextual contradictions, translation doubts, or sponsor-goal conflicts. Do NOT decide alone.
