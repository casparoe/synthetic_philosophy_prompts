prompt: |-
  I'm writing a final-year paper on whether familiar social decision rules — cost–benefit analysis with a monetary numéraire, prioritarian weighting, and maximin-style rules that have to identify who is worst off — presuppose interpersonal comparisons of well-being, and on whether such comparisons are even the kind of thing that could be true or false. A friend in the economics department, who thinks the whole enterprise is confused, gave me an argument I can't find the exit from. He insists it isn't a sceptical argument at all but a plain application of measurement theory; to me it seems to prove far more than even he wants, because run in the other direction it appears to threaten the intrapersonal comparisons that prudence, and the expected-utility framework itself, depend on. I would most like to hold on to (1) and (2) below, which I take to be orthodoxy, and I would give up almost anything else rather than accept (6). The argument, as I've reconstructed it:

  (1) A person's utility function, recovered from that person's preferences in the usual way — preferences over lotteries, subject to the standard coherence constraints — is unique only up to positive affine transformation: u(·) and a·u(·)+b with a > 0 encode exactly the same facts about that person, no more and no less.

  (2) Take two people and a policy that helps one and harms the other. Whether the gain exceeds the loss is not invariant under separate admissible rescalings of the two functions: multiply the gainer's function by ten and any verdict you like flips. Likewise for comparisons of levels.

  (3) If a claim's truth value is not invariant under every admissible redescription of the subject matter, then there is no fact of the matter whether it is true; it is an artefact of the representation rather than a feature of the world.

  (4) So there is no fact of the matter about interpersonal comparisons of gains, losses or levels, and everything built on them — compensation tests, prioritarian weights, identifying the worst off — rests on nothing.

  (5) But the reasoning generalises. Suppose we measure a single person's welfare separately at different times, or in different domains of one life (health, consumption, relationships), and then add the components. Each component is fixed only up to its own positive affine transformation, so the total requires exactly the same arbitrary choice of unit and origin that (2) complains about.

  (6) So there is no fact of the matter about whether a single life goes better or worse overall either: prudential aggregation, and the cost-effectiveness arithmetic that health policy runs on, collapse along with the interpersonal case.

  What I want is a diagnosis rather than a bibliography — I'm writing this somewhere without library access, so please argue from the structure of the problem instead of from what various authors have said, and I don't need provenance for the labels I've seen floating around, the level-comparability versus unit-comparability distinction and the like. Name the step you would reject, explain why it looked to be in good standing, and price the alternatives. In particular, I can't tell whether (5) is a genuine parallel, in which case the argument is valid and something plausible has to go — presumably (3) — or whether a disanalogy is being smuggled in: something about a single person's preferences ranging over whole-life prospects that makes intrapersonal differences invariant in a way interpersonal ones are not, and so about what exactly does the comparing when we compare across times. If the disanalogy is real, I want to know what the interpersonal comparabilist has to posit that the intrapersonal case gets for free, and whether positing it amounts to a discovery about well-being or to a stipulation that builds the answer in. Two candidate bridges I've toyed with: fixing everyone's unit by counting barely-perceptible steps up from a neutral baseline, so that one just-noticeable increment is the same size for every person; and extracting a common scale from hypothetical other-regarding preferences, the move where each person ranks prospects under the assumption that they might turn out to be anyone. My worry about the first is that it seems to assume what was in question; my worry about the second is that it yields an ordering only where people's attitudes to one another's experiences happen to agree, and I don't know what to say when they don't — the envious, the sadistic, the merely indifferent. If I have to choose, I'd sooner keep (1) and (2) and the shakiness of cost–benefit analysis than swallow (6); but I suspect I don't have to choose, and I want to know what keeping everything costs me.
reasoning: |-
  Okay, the user is writing a final-year paper on interpersonal comparisons of well-being in social decision rules. Their economist friend presented an argument challenging the factual basis of such comparisons, extending even to intrapersonal comparisons. The user wants to avoid accepting point (6) which undermines prudential reasoning. They need a diagnosis of the argument's flaws, preferring structural analysis over citations.

  The core issue is invariance under admissible transformations. The friend argues that since interpersonal comparisons aren't invariant under separate affine transformations, they lack factual basis. The user suspects a disanalogy between intra and interpersonal cases but can't pinpoint it.

  The key lies in Step (3)'s overreach. While invariance matters for representing physical quantities, welfare comparisons function differently. A single person's extended preferences over whole-life prospects naturally generate invariant intrapersonal comparisons. When I imagine being myself at different times, my choices reveal comparable utilities across time. The affine transformations here must align because it's one preference structure.

  Interpersonal comparisons lack this unified framework. Each person's utility scale is isolated. Bridging them requires additional structure like a "barely perceptible step" metric or hypothetical choice scenarios, but these face philosophical and practical challenges.

  The user must recognize that rejecting Step (3) doesn't mean anything goes. Interpersonal comparability must be argued for separately, not assumed. The disanalogy is real: intrapersonal comparisons derive from actual preferences while interpersonal ones require constructive methods.

  For their paper, the user should frame this as Step (3) being too blunt. Welfare comparisons aren't measurement artifacts but normative constructs with different foundations in intra versus interpersonal contexts. This preserves prudential reasoning while acknowledging the genuine difficulties in social welfare judgments.
answer: |-
  Here's a diagnosis pinpointing the flaw and pricing the alternatives, focusing on the structure you've provided. The core issue lies in **Step (3)** and its application, revealing a crucial disanalogy between the intra- and interpersonal cases.

  1.  **Reject Step (3) as Overstated/Overgeneralized:** The core problem is Step (3): *"If a claim's truth value is not invariant under every admissible redescription of the subject matter, then there is no fact of the matter whether it is true; it is an artefact of the representation rather than a feature of the world."*
      *   **Why it looks plausible:** Measurement theory *does* teach that the meaningfulness of quantitative comparisons depends on invariance under admissible transformations. For *physical* quantities like length or temperature (interval scale), comparisons of *differences* are meaningful (invariant under affine transformations), while comparisons of *ratios* are not (unless on a ratio scale). Step (3) seems to extend this logic to well-being comparisons.
      *   **Why it's flawed:** Step (3) ignores the crucial role of **interpretation** and **domain-specific constraints**. The "admissible redescription" (affine transformation) is defined *relative to the information content of the representation*. The transformation is admissible *only* because it preserves the *specific information* the representation was designed to capture (ordinal preferences + attitude to risk). It doesn't follow that this representation captures *all* possible meaningful information about well-being. Claiming that "no invariance under admissible transformations = no fact of the matter" assumes that the original representation (the vNM utility function) is the *only* possible source of information about well-being comparisons *and* that it captures everything relevant. This is a substantive, controversial claim about the nature of well-being, not a neutral consequence of measurement theory.

  2.  **The Disanalogy: Unitary Agency vs. Multiple Agencies:** The flaw in Step (3) becomes critical in Step (5). The argument *correctly* identifies that if we treat different temporal slices or domains within *one person* as separate "agents" with *separately scaled* vNM functions, then adding them suffers the same non-invariance problem as interpersonal comparisons. **But this separation is artificial and misrepresents the actual basis for intrapersonal comparisons.**
      *   **The Intrapersonal Case (Why (5)/(6) Doesn't Follow):** Prudential reasoning isn't based on stitching together separate, isolated vNM functions for each time-slice, each scaled arbitrarily. It relies on the **single, unified preferences of the person *over whole-life prospects***. When we say "the gain at T1 outweighs the loss at T2 for person P," this comparison isn't an artifact of arbitrary scaling *because*:
          *   **The Scaling is Fixed by Unitary Preferences:** The vNM utility function `u(·)` for the whole person, derived from preferences over lotteries involving *entire life histories* (states of the world specifying outcomes at all relevant times), *already incorporates comparisons across time within its single scaling*. The person's choices reveal how they trade off well-being at different times *within one coherent preference structure*. Affine transformations `a·u(·) + b` applied to *this entire function* preserve *all* the information about these trade-offs and comparisons across time/domain *within the life*. The invariance problem in (2) arises precisely because we *lack* a single preference structure spanning different people.
          *   **Invariance Under *Joint* Transformation:** While `u(T1)` and `u(T2)` components *within* the single function `u` can be rescaled *together* (`a·u(T1) + b`, `a·u(T2) + b`), the *differences* `u(T1) - u(T2)` and *ratios* `[u(T1) - u_ref] / [u(T2) - u_ref]` (if `u_ref` is fixed, e.g., neutrality) *are* invariant under this *joint* affine transformation. The non-invariance in the interpersonal case stems from applying *separate* affine transformations. The intrapersonal case naturally involves a *single*, joint transformation for the whole function.
      *   **The Interpersonal Case:** There *is no* overarching preference structure encompassing both individuals. Person A's vNM function captures *only* their own preferences. Person B's captures only theirs. There is no *actual choice behavior* or *preference revelation* that inherently links the scales of `u_A` and `u_B`. Applying separate affine transformations (`a·u_A + b`, `c·u_B + d`) is genuinely admissible relative to the information content of their *isolated* preference sets. The non-invariance of `u_A(gain) > u_B(loss)` under these separate transformations highlights that this comparison *cannot be derived solely* from the individual, isolated preference information. **It requires additional structure.**

  3.  **Pricing the Alternatives & Salvaging Comparability:**
      *   **Keeping (1), (2), Rejecting (3)/(6):** This is the most defensible position. It accepts the vNM representation as capturing risk attitudes and ordinal preferences within a life, and acknowledges that *within that specific representation*, interpersonal comparisons lack inherent scale linkage. Crucially, it denies that this representation exhausts the meaning of well-being comparisons.
          *   **Cost:** You must argue that meaningful interpersonal comparisons require **additional normative or empirical foundations** *beyond* the revealed preferences captured by vNM theory. You cannot claim they are *facts* derivable *solely* from individual vNM functions + measurement theory. You must justify the "bridge."
      *   **Evaluating Your Candidate Bridges:**
          *   **Barely-Perceptible Steps (JNDs):** This attempts to define a common empirical unit ("one util = one JND"). *Problem:* It presupposes a specific theory of well-being (hedonic, sensation-based) and faces severe practical/epistemological problems (measuring JNDs non-circularly, assuming linearity, applicability to non-sensory goods). It *does* provide a potential common scale *if* accepted, but it's a substantive metaphysical/methodological commitment, not a discovery forced by logic. It risks "assuming what was in question" if presented as the *only* way comparisons *could* be meaningful.
          *   **Hypothetical Extended Preferences (HEP):** This (Harsanyi, etc.) uses a thought experiment: individuals, behind a "veil of ignorance" (not knowing who they will be), rank social states. If their preferences converge, this defines a social welfare function incorporating comparable utilities.
              *   *Strength:* Grounds comparability in *actual* (though hypothetical) *choice behavior*.
              *   *Weaknesses:* (1) It yields a social ordering, not necessarily interpersonal *facts*. (2) As you note, divergence (envy, sadism, indifference) is a problem – it doesn't guarantee *unique* comparability. (3) It relies on controversial assumptions (impartiality in the veil, rationality under radical uncertainty). (4) It arguably *constructs* comparability rather than *discovers* it.
          *   **Other Bridges:** You could appeal to philosophical theories of well-being (objective goods lists, capabilities, flourishing) that provide a common metric independent of preferences. Or, more pragmatically, argue that *for policy purposes*, we need *some* comparable scale, and constructing one (e.g., via willingness-to-pay surveys with redistributive adjustments, or health-adjusted life years - HALYs) is a normative necessity, even if imperfect. HALYs, while facing their *own* measurement challenges, demonstrate that practical intrapersonal aggregation across domains (health vs. time) *can* be done by defining a common metric (e.g., "healthy year equivalents") based on population preferences over health states – showing the disanalogy to the interpersonal case where no such common population-wide preference over *individual identities* exists.

  4.  **Conclusion: The Cost of Keeping Everything Plausible:**
      *   **You can keep (1) and (2):** vNM utilities are unique up to affine transformations *within a person*; interpersonal comparisons using them directly are not invariant under separate rescalings.
      *   **You can reject (6):** Intrapersonal prudential aggregation *is* grounded in the invariant comparisons revealed within a single person's unified preferences over whole-life prospects. The scaling *is* fixed jointly.
      *   **You must reject Step (3):** The lack of invariance under transformations admissible *relative to isolated preference sets* does *not* prove "no fact of the matter." It proves that the facts (if they exist) aren't *contained within* those isolated sets. Measurement theory sets conditions for meaningfulness *within a representation*; it doesn't dictate that no other meaningful representations or comparisons are possible.
      *   **The Price:** To salvage *interpersonal* comparability as meaningful (not necessarily "factual" in a strong metaphysical sense, but justifiable), you must explicitly **posit and defend a "bridge principle"** (JNDs, HEP, objective goods, capabilities, or pragmatic construction). This bridge is not "discovered for free" like the intrapersonal case; it's a substantive normative or methodological commitment. The shakiness of cost-benefit analysis based *purely* on unadjusted vNM utilities remains, but it doesn't doom *all* attempts at interpersonal comparison or social decision rules – it just shows they require more foundational work than the intrapersonal case. The disanalogy is real and resides in the existence of a unitary agent whose preferences span the compared domains (time/parts of life) versus the lack of any such agent spanning distinct individuals.
