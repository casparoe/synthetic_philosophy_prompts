prompt: |-
  I run a weekly 80-minute discussion section for a first-year Ethics and Everyday Life course: 18 students, one flat-ish room with movable chairs, no AV, and I'd rather not have them on their phones. Next week's topic is everyday conventions — tipping, queueing, jaywalking — whether these are moral obligations or just etiquette with gossip attached, and in particular whether a visitor has to follow the local version.

  The problem is they've all heard when in Rome about a thousand times. Left to talk, they say "it depends on the culture lol" and we're finished in ten minutes. So I want them to run into the thing instead of discussing it.

  My half-formed plan: invent a small made-up town (so nobody's actual knowledge about, say, tipping norms in Japan does any work), split them into locals and visitors, hand the locals a private sheet with three or four local practices — around crossing the street, queueing at a bakery, and leaving money at a café — and let the visitors blunder through a few staged encounters. Then swap some people over and debrief. That's as far as I've got and it feels thin.

  What I want them to feel rather than be told:

  - that these rules are arbitrary in content and still genuinely binding. Not "it's polite to," but: you cannot fail to conform without thereby saying something. There's no neutral option.
  - that the very same physical behaviour means different things depending on who does it. This is the one I most want and my plan doesn't get near it. A local who jumps the queue in a jokey, stylised, everyone-knows-it's-a-joke way is doing something different from a visitor doing the identical thing, and I want that to land as a difference in the action, not just in how people react.
  - that conforming can also be the offence. Doing the local thing too exactly, or doing it visibly as a guest, can read as mockery or as slumming — so when in Rome isn't automatically the safe answer.
  - that locals pay the cost of keeping the practice going and visitors can just leave, and whether that changes what the visitor owes.

  Two more things I'd like built in if you can: one practice that the locals themselves beleive is a moral rule rather than a custom (I want the gap between "we do this" and "this is right" to show up in the play rather than in the discussion), and one where a newcomer genuinely can't tell whether it's a rule of the town or just how this one particular person happens to behave.

  Constraints: no lecture up front; they shouldn't hear the words convention, coordination, or the Roman proverb from me until after the debrief. Locals need some way of sanctioning visitors that isn't just them being rude — some scoring thing so the visitors actually feel the cost — but no real money and nothing that leaves anyone genuinely embarrassed in front of 17 other people. I'd also rather be a bystander during the play than a referee.

  So: the town and its practices, the roles and what each role knows at the start, a timeline with minutes on it, and a debrief that maps specific moments back onto those four points. Then tell me what will predictably go wrong the first time I run it, and be honest about which part of the "are conventions obligations" question a simulation like this just can't reach, so I know what I have to say out loud myself.
reasoning: |-
  Okay, let me start by understanding what the user needs. They run an 80-minute discussion section for a first-year Ethics course, focusing on everyday conventions like tipping and queueing. The problem is that students default to "when in Rome" too quickly, leading to shallow discussions. The user wants a simulation where students experience the nuances of conventions rather than just talking about them.

  First, I need to address their main goals. They want students to feel that conventions are arbitrary but binding, that the same behavior means different things based on who does it, that conforming can sometimes be offensive, and that locals bear the cost of maintaining these norms. Also, they need to include a moral vs. customary rule distinction and ambiguity in whether something is a rule or personal habit.

  The user’s plan involves creating a fictional town with specific practices, splitting students into locals and visitors, and staging encounters. But they feel it's thin. So I need to flesh this out. Let me think about designing the town. Creating a fictional place like "Sycamore Bend" with unique customs prevents real-world knowledge from interfering. Practices like queueing at the bakery with a token system, paying at the café with exact change, and the "Sycamore Shuffle" for crossing the street can cover the required aspects.

  For the roles, locals get detailed rules, while visitors get minimal info. Including "Deep Roots" locals who see the token queue as a moral rule adds the moral-custom distinction. The ambiguous practice could be the "three-tap" greeting, where it's unclear if it's a town rule or personal habit. 

  To show that behavior meaning changes based on who does it, the "Sycamore Shuffle" can be done by a local as a joke versus a visitor doing the same thing. Locals might laugh when a local does it but get upset with a visitor. This highlights the difference in interpretation.

  For the cost to locals, the token system at the bakery requires locals to manage it. If visitors disrupt it, locals have to fix the mess, showing the maintenance cost. Visitors can leave, emphasizing their lower stake.

  Scoring with "Community Harmony Points" (CHP) for locals and "Visitor Standing" (VS) for visitors adds stakes without real money. Using index cards for transfers keeps it low-pressure. Swapping roles halfway ensures everyone experiences both perspectives.

  The timeline needs to fit into 80 minutes. Setting up the room, briefing roles, running encounters twice with a swap, then debriefing. Debrief questions should connect experiences to the four key points. Predicting issues like locals over-sanctioning or visitors being too timid helps the user prepare.

  What the simulation can't address is why conventions feel binding universally or their moral weight. The user might need to discuss coordination problems and norm internalization afterward. Also, the simulation might not fully capture long-term consequences or deep cultural integration, so pointing that out is important.

  Including the "three-tap" greeting creates ambiguity. Visitors might copy someone without knowing if it's a rule, leading to confusion. This addresses the user's point about not knowing if it's a rule or personal behavior.

  I should also consider constraints: no AV, no phones, avoid embarrassment. The scoring system with cards is discrete. The facilitator stays as a bystander, only stepping in if needed. Keeping explanations minimal during setup avoids lecturing.

  Testing the practices for clarity is crucial. Maybe running through a quick example with a colleague could help. Ensuring the "Deep Roots" locals naturally express the moral aspect without revealing it to visitors. The swap allows students to see both sides, deepening the experience.

  Debrief questions should guide students to articulate the differences in behavior interpretation, the costs borne by locals, and the ambiguity in practices. Connecting specific moments from the simulation to the learning objectives solidifies the concepts.

  Potential pitfalls: Locals might be too harsh, visitors too passive, or time management issues. Having a timer for each encounter and clear roles can mitigate this. Emphasizing that it's a simulation helps reduce embarrassment. The user should watch for groups finishing early and have discussion prompts ready.

  Overall, the simulation should create experiential learning that leads to a richer discussion, moving beyond superficial answers. The user can then bridge any gaps in the debrief with targeted explanations.
answer: |-
  Here’s a detailed simulation plan designed to make your students **experience** the nuances of conventions, followed by a debrief framework and honest pitfalls:

  ---

  ### **The Town: Sycamore Bend**  
  A small, isolated town with unique conventions (prevents real-world knowledge interference).  

  #### **Key Practices**  
  1. **"The Token Queue"** at Birch Bark Bakery:  
     - Locals take a numbered token upon entering. *Skipping the token box is the gravest offence*.  
     - **Twist:** "Deep Roots" locals (3-4 students) believe tokens are a *moral rule* ("Only fair people deserve fresh bread").  

  2. **"Exact Change Only"** at Cedar Café:  
     - Pay *exactly* 12 "Bend Bucks" (BB) for drinks. Over/underpaying requires a loud apology to the room.  
     - **Twist:** Visitors who *over-precise* ("Here are precisely 12 BB, as your quaint custom demands") offend locals.  

  3. **"The Sycamore Shuffle"** at crosswalks:  
     - Cross only after doing 3 small hops on the curb. Locals do it fast/playfully; outsiders miss the rhythm.  
     - **Twist:** A local hopping *slowly/mockingly* is "joking"; a visitor doing the same is "mocking us."  

  4. **"Three-Tap Greeting"** (Ambiguous practice):  
     - Some locals tap their shoulder 3x before handshakes. *Unclear if it’s a town rule or personal habit*.  

  ---

  ### **Roles & Setup**  
  **Time:** 5 min  
  - Split class: **12 Locals** (incl. 3-4 "Deep Roots"), **6 Visitors**.  
  - **Locals** get:  
    - A sheet with practices **#1-3** explicitly defined + **#4 NOT mentioned** (it "emerges" organically).  
    - "Deep Roots" get an extra note: "*Tokens protect fairness. Cheaters are bad people*."  
  - **Visitors** get:  
    - A vague map showing bakery/café/crosswalk locations.  
    - "Observe first, but participate when ready."  

  **Scoring System (Low-Stakes Sanctions):**  
  - Locals hold **3 "Community Harmony Points" (CHP)** each on index cards.  
  - Visitors hold **3 "Visitor Standing" (VS)** cards.  
  - If a local feels a visitor breaks a norm, they take **1 VS card**. If a visitor feels unfairly targeted, they take **1 CHP**. *No verbal debate allowed—just card exchange*.  

  ---

  ### **Timeline**  
  **Phase 1: Visitor Immersion (25 min)**  
  - Visitors enter "Sycamore Bend" (one bakery "counter," one café "table," a taped crosswalk).  
  - Locals mill about, enacting practices naturally (e.g., taking tokens, hopping at crosswalks).  
  - *You silently observe; intervene only if stalled*.  
  - **Goal:** Visitors try tasks (buy "bread," cross street) while locals enforce via card exchanges.  

  **Phase 2: Role Swap + New Tensions (20 min)**  
  - 3 Visitors become "New Locals"; 3 Locals become "Day-Trippers" (new visitors).  
  - **New rule:** "Deep Roots" locals now enforce that *new locals must uphold tokens as moral duty*.  
  - Repeat encounters with rotated roles.  

  **Phase 3: Debrief (30 min)**  
  Begin with: *"Show of hands: Who felt genuinely frustrated? Confused? Judged?"* Then:  

  | **Debrief Question**                           | **Target Concept**                                  |  
  |------------------------------------------------|-----------------------------------------------------|  
  | "When did identical behavior (e.g., hopping) feel different based on WHO did it? Why?" | *Meaning changes with identity* |  
  | "Locals: When did enforcing a rule feel like a burden? Visitors: When did ‘playing along’ feel unsafe?" | *Cost of maintenance vs. freedom to leave* |  
  | "Did anyone conform perfectly but STILL offend? How?" | *Over-conformity as mockery* |  
  | "Was the shoulder-tap a rule? How did you decide?" | *Ambiguity in norm detection* |  
  | "Deep Roots: Did others care as much as you about tokens?" | *"Moral" vs. "custom" divergence* |  

  Then reveal the 4 key concepts, linking to student examples:  
  > *"So when Zoe hopped slowly, locals laughed—but when Eli did it, cards were taken. Same action, different meaning. And when Kai paid EXACTLY 12 BB with a bow, Marta took a card—why? Because..."*  

  ---

  ### **What Will Go Wrong (And How to Fix)**  
  1. **Visitors freeze or locals over-enforce:**  
     - Prep locals: "Start by modeling norms naturally; only ‘sanction’ after 2 violations."  
     - Have backup task cards ("Ask about the weather in an accent").  

  2. **The "moral" norm isn’t challenged:**  
     - Secretly prompt a "Day-Tripper" to say: *"Tokens are silly—just line up!"* to trigger Deep Roots’ reaction.  

  3. **Ambiguous practice (#4) flops:**  
     - Plant 2 locals to use the tap-greeting early. If ignored, have one grumble, *"Nobody respects traditions!"*  

  4. **Card exchanges feel arbitrary:**  
     - Encourage visitors to lean in: "Lean into the awkwardness—real visitors feel this!"  

  ---

  ### **What the Simulation CAN’T Teach (Requires Your Voice)**  
  - **Why conventions feel universally binding:**  
    *Simulation shows subjective weight; you must explain how norms become internalized as "right" (e.g., via shame, coordination benefits).*  
  - **The line between obligation and coercion:**  
    *Students experience social pressure; you must distinguish moral duty ("You ought to tip") from pragmatic conformity ("Or you’ll get spit in your coffee").*  
  - **Long-term consequences:**  
    *The game can’t show how repeated violations exile people or how norms evolve. Mention this in closing.*  

  ---

  ### **Materials & Room Setup**  
  - **Signs:** "Birch Bark Bakery (TAKE TOKEN)," "Cedar Café (EXACT CHANGE)," "Maple St. Crosswalk (HOP BEFORE CROSSING)."  
  - **Props:** Numbered tokens, play money (12 BB bills), index cards for CHP/VS.  
  - **Chairs:** Bakery "counter" (1 table), café "seating" (4 chairs), open space for crosswalk.  

  This forces students into the **messy reality** of conventions—where behavior is never neutral, identity shapes meaning, and "fitting in" can backfire. The debrief will crack open nuanced discussion, and your summary stitches theory to lived chaos.
