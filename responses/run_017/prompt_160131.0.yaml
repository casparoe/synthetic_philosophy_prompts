  2. **Limitations of present-day evaluations**: Both camps agree that present-day evaluations are limited in their ability to detect either type of failure. Evaluations typically focus on static benchmarks and do not capture the dynamic, strategic, or long-term aspects of system behavior. Moreover, evaluations are often conducted in controlled environments that may not reflect real-world deployment conditions.

  3. **The need for new evaluation methods**: Both camps agree that new evaluation methods, such as the blind-window protocol, charter-replay audit, and capability-clamped series (as defined in the query), are necessary to better understand the risks. These methods are seen as promising steps toward resolving the disagreement.

  4. **The possibility of both failure modes**: Both camps acknowledge that both discontinuity and drift are plausible failure modes, and that they are not mutually exclusive. It is possible that elements of both could occur in a single failure trajectory.

