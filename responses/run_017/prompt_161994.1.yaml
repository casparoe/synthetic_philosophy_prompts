  Thus, the principle holds.
answer: |-
  Based on your cases and tentative rule, I'll extract a unified principle that captures your intuitions, test it against your examples, identify edge cases, and highlight where it might diverge from your verdicts. The core tension is between *individual claims* (which you're willing to assert at high probabilities) and *universal/conjunctive claims* (which you avoid even when seemingly probable), especially when error correlations or non-exchangeability undermine base rates.

  ### Refined Principle: The Contextual Assertion Threshold (CAT)
  Print a claim if and only if:
  1. **Individual Probability Threshold**: The claim's probability (given all evidence, including error correlations) exceeds a context-dependent threshold θ.  
     - *θ increases with*:  
       - Stakes (e.g., public health vs. lottery ticket).  
       - Cost/visibility of correction (e.g., database errors are hard to fix retroactively; news sentences are easier to amend).  
       - Claim scope (single claims θ₁; conjunctions of *n* claims θₙ; θ₁ < θₙ for *n* ≥ 2).  
     - *θ decreases with*:  
       - Process transparency (e.g., lottery’s random draw lowers θ).  
  2. **No Universal Generalizations**: Never assert a universal claim (e.g., "all X are Y") over a large set unless its probability is ≈1, *even if* individual probabilities are high.  
     - Universal claims require near-certainty due to combinatorial explosion of risk.  
  3. **Base Rate License for Individuals**: A base rate licenses an assertion about a specific individual *only* if:  
     - The individual is exchangeable with the class (no uneliminated carving changes the rate).  
     - The process generating the outcome is controlled and transparent (e.g., lottery vs. real-world events).  
     - The claim is not a universal generalization (clauses 1–2 take precedence).  
  4. **Error Structure Dependence**: Probability assessments must account for error correlations (e.g., single sensor invalidates per-line odds).  
  5. **No Global Consistency Requirement**: No need to ensure all claims in a corpus are simultaneously true; individual high-probability assertions can coexist with a belief that some are false.  

  ---

  ### Testing CAT Against Your Cases
  | Case | Your Verdict | CAT Prediction | CAT’s Explanation |
  |------|--------------|---------------|-------------------|
  | **(a) Lottery ticket** | ✅ Assert "ticket 437 loses" (P=0.9999999); ✅ Assert "one wins"; ❌ Deny "all lose" | ✅ All upheld | Exchangeability guaranteed by lottery mechanism (clause 3). Threshold θ low due to low stakes and transparency (clause 1). "All lose" violates clause 2. |
  | **(b) Database line** | ✅ Publish per-line (P=0.997); ✅ Stand by a line if queried; ❌ Deny "all lines correct" | ✅ All upheld | Per-line θ moderate (public stakes, but corrections possible). "All correct" fails clause 2 (P≈10⁻⁵). |
  | **(c) Book claims** | ✅ Stand by each claim; ✅ Preface: "likely an error"; ❌ Editor’s universal claim | ✅ All upheld | Preface satisfies clause 5. Editor’s demand for universal certainty violates clause 2. |
  | **(d) Single sensor** | ❌ Pull database despite per-line P=0.99 | ✅ Pull database | Error correlation invalidates per-line odds (clause 4). System-wide θ too low (stakes high, correction hard). |
  | **(e) Two audits** | ❌ Refuse "all lines correct" (P=0.96) | ✅ Refuse "all correct" | Universal claim P=0.96 << 1 (clause 2). Individual lines still publishable (θ high but met). |
  | **(f) Conjunction** | ✅ Print conjunctive claim (P=0.92); ❌ Reject DB line at P=0.92 | ✅ Both upheld | Conjunction: θ lower for small *n* (clause 1; ordinary reporting, low correction cost). DB line: θ higher (reference use, high stakes). |
  | **(g) Delivery van** | ✅ Print odds (base rate); ❌ Deny "was their van" even if P=0.999 | ✅ Both upheld | No exchangeability guarantee (real-world factors; clause 3). Stakes high (accusation). |

  **Key Insight**: CAT distinguishes **(a)** and **(g)** via clause 3. Lottery tickets are exchangeable by design; vans are not, even with random assignment, because real-world events (e.g., driver behavior, maintenance) introduce non-exchangeable factors. Your unease in **(g)** is defensible: CAT *does not* require asserting categoricals from observational base rates alone, only from controlled processes.

  ---

  ### Predictions for New Cases
  1. **Two audits agree (e) extended**:  
     - ❌ *Never* print "every line is correct."  
     - *Why*: Universal claim (clause 2); P=0.96 is insufficient. Print per-line assertions only.  

  2. **Clumped errors (e.g., one bad batch affects 50 lines)**:  
     - ✅ Publish per-line if P > θ.  
     - ❌ Do not publish "all lines correct."  
     - ⚠️ *But*: If an error is found in one line, assert all 50 in the batch are suspect (clause 4).  
     - *Why*: Error correlation changes risk profile; universal claim still banned (clause 2).  

  3. **200 documents, one forged, source answers truthfully**:  
     - For any *single* document: ✅ Print "this is genuine" *only if* you ask the source (P=1.0).  
     - For an *unqueried* document: ❌ Do not assert "genuine" (P=0.995); ✅ Print base rate odds.  
     - *Why*: Exchangeability holds (clause 3), but high stakes (forgery) raise θ. Since verification is cheap, θ demands near-certainty (clause 1).  

  ---

  ### Verdicts CAT Would Overturn
  None. CAT fully supports your original verdicts. However, it clarifies two points:  
  - **(a) is preserved**: The lottery’s controlled process justifies exchangeability (clause 3).  
  - **(g) unease is justified**: Real-world base rates lack controlled-process guarantees. Even with random van assignment, hidden variables (e.g., maintenance records) may violate exchangeability. CAT *does not* force you to print the categorical claim.  

  ---

  ### Is CAT About Belief or Printing?
  CAT governs *assertion*, not belief. Your book example **(c)** shows you can rationally:  
  - *Believe* each claim individually (high P).  
  - *Believe* at least one claim is false (high combinatorial probability).  
  - *Print* each claim (meets θ) + a disclaimer (clause 5).  
  This is consistent: Printing is a public act with reputational/ethical stakes; belief is private. CAT prioritizes accountability in publishing over internal consistency.  

  ---

  ### Final Recommendation
  Use CAT as your core principle. It:  
  - Explains all your cases.  
  - Justifies your reluctance in **(g)** without sacrificing **(a)**.  
  - Handles error correlations and universal claims rigorously.  
  - Allows flexible thresholds for different contexts.  

  For your talk, frame it as: **"Print claims that clear a context-sensitive bar of certainty, but avoid universal assertions and untethered base-rate leaps—because the real world isn’t a lottery."** This bridges reliability engineering (error correlations, system failure) and journalism (accountability, public trust).
