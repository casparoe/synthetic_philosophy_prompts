  4. **Error Structure**: Account for error correlations when assessing the probability of a claim. If errors are strongly correlated, treat the set as a unit when setting thresholds.

  5. **No Requirement for Global Consistency**: It is acceptable to believe and to print individual claims that are each highly probable, even if their conjunction is not, and to also print that at least one of them is likely false.

