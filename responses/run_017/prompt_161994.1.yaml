  **Principle for Printing Claims**:

  1. **Individual Claims Threshold**: Print a specific claim (atomic or a small conjunction of a few claims that are naturally linked) if its probability, conditional on all available evidence (including error correlations), exceeds a threshold θ. The threshold θ is determined by:
     - Stakes: Higher stakes require higher θ.
     - Ease of correction: If corrections are difficult or costly, require higher θ.
