  Therefore, (6b) is unmeasurable in the current setting because we don't observe the outcome for non-enrolled patients.

  Similarly, (6a) is measurable because we observe the outcome for the enrolled.

  But note: the user says the outcome is only observed for enrolled patients. So for non-enrolled, we don't know if they would have benefited. Therefore, (6b) cannot be measured.

