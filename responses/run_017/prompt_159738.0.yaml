  - Between 4 and 5: (4) says we must use group membership, but (5) is about individual similarity. Using group membership might be seen as contrary to individual fairness. However, the user argues that group membership is necessary for auditing and to avoid disparities. This might be an apparent tension that can be dissolved: using group membership does not necessarily conflict with individual fairness if the groups are part of the similarity metric or if we use group information to achieve individual fairness.

