  5. The deep notion is individualized: similar people treated similarly under a task-appropriate similarity metric.

  6. Two desired criteria (separable):
     6a. Wasted-slot parity: same share of slots going to each group are wasted (i.e., given to patients who wouldn't benefit).
     6b. Miss parity: same share of patients who would benefit (in each group) are missed (i.e., don't get a slot).

