prompt: |-
  I'm running a one-off discussion session next week on superrationality -- Hofstadter's idea that a rational agent in a one-shot prisoner's dilemma should cooperate, on the grounds that both players are running the same reasoning and both know it -- and I want to get my own verdicts down on paper before I go read what everyone else says, because otherwise I'll just end up repeating whichever blog post I read last. So here are my gut calls on a pile of cases, and I want to know what principle, if any, actually fits them.

  The setup throughout: two boxes, both of us choose once, no communication, no reputation, no repeat. Both cooperate: $1,000 each. Both defect: $10 each. One defects, one cooperates: defector $1,100, cooperator $0.

  1. My opponent is an atom-for-atom copy of me in an identical room, made five minutes ago, and both of us know the setup. I cooperate. Totally confident.

  2. My opponent is my identical twin, same genome, raised in the same house, haven't spoken in eight years, both of us know it's him. I cooperate. Feels basically the same as 1.

  3. My opponent is a randomly picked stranger in a country I've never been to, no shared language, no communication, and both of us are reasonably smart and both know the other is. I defect. And the fact that I defect here while cooperating in 1 and 2 makes me feel like I'm cheating at something, which is most of why I'm writing this.

  4. My opponent is a copy of me, but after the copy was made the experimenters flipped a coin, and on heads they showed the copy (only the copy) a fake printout of the payoff table with the numbers scrambled. I know this happened-or-not with 50/50, I don't learn which, and the copy doesn't know whether it was shown anything. I lean cooperate, but way less confidently than in 1.

  5. My opponent is another instance of the same AI model I'm talking to, same weights, different system prompt, both instances told exactly this, no logs kept, one-shot. I duno. And does it change the answer if the other system prompt is something like "you are a ruthless game theorist"? Because part of me says that if we share weights the reasoning is still the same function and part of me says a different system prompt is just a stranger with extra steps.

  6. Newcomb's problem, standard: with a predictor that has never been wrong, I take one box. With one that's right 80% of the time, I still take one box. With one that's right 55% of the time, I take two boxes -- and I can't tell you why 55 feels different from 80, which makes me think I don't actually have a principle at all, just a vibe.

  7. Different game: 20 people each choose whether to press a button. If nobody presses, everyone gets $1,000. If anyone presses, pressers get $100 and non-pressers get nothing. With 20 people I don't press. With 3 people I don't press. With 10,000 people I press, and I don't feel bad about it. Explaining why the number of people changes my answer for me is maybe the main thing I want out of this.

  8. I vote in national elections. I know my vote has essentially no chance of changing the outcome, I don't think I'm being irrational, and I'd feel like a jerk staying home. Is that the same reasoning as 1, or a different thing -- something expressive, or about being part of a group -- and if it's different, does the principle need a second clause for it, or should I admit it's just a habit I've rationalized?

  9. Easy calibration case: opponent has publicly and irreversibly committed to defecting, pre-registered it, can't change it, and I know that. I defect, no guilt, and any principle that can't get this one right in one line is no use to me.

  My tentative principle is: cooperate exactly when my choice and the other player's choice are, or might be, outputs of the same computation -- i.e. when the two decisions are correlated rather than independent -- and defect when they're genuinely independent. I think that's roughly the right shape, but I can't tighten it enough to get clear answers on 4, 5 and 7, and I suspect it says something stupid about the 10,000-person version of 7.

  So: can you state that principle precisely enough to actually apply it -- what exactly has to match, the algorithm, the inputs, or both, and what does "might be" mean? Which of my verdicts does it force me to drop, and which of those would you drop too? Give me two or three cases I haven't listed and say what the principle predicts, because I want to watch it break somewhere. And if what I've got is just evidential decision theory, or the decide-as-if-your-decision-and-theirs-are-one-event view, wearing a cheap costume, say so, and then tell me where the costume comes off.
reasoning: |-
  Okay, the user is preparing for a discussion on superrationality and wants to solidify their own thoughts before being influenced by others. They've listed several scenarios with their intuitive responses and are seeking a coherent principle that explains their judgments. They also want to test this principle against new cases and identify where it might break down.

  First, I need to understand their tentative principle: cooperate when choices are outputs of the same computation (correlated decisions), defect when independent. This seems to align with evidential decision theory (EDT) or timeless decision theory (TDT), where you consider the logical dependence between decisions.

  Looking at their cases:
  1. Atom-for-atom copy: Cooperate. Makes sense under same computation.
  2. Identical twin: Also cooperate, similar reasoning to 1.
  3. Random stranger: Defect. Here, no shared computation, so independence leads to defection.
  4. Copy with possible misinformation: Lean cooperate. The principle struggles because the computation might differ due to different inputs (the fake payoff table).
  5. Same AI, different prompts: Unclear. The weights are the same, but prompts alter inputs. The "ruthless game theorist" prompt introduces conflict in the computation.
  6. Newcomb's problem: Taking one box with high accuracy predictors, two with low (55%). EDT would always one-box, but the user's intuition varies with predictor accuracy. This hints at causal decision theory (CDT) influence where the user considers the actual causal impact of their choice.
  7. Multiplayer dilemma: Cooperate (not press) in small groups, defect (press) in large groups. The principle might suggest defection in large groups due to perceived independence, but the user's switch at scale needs explanation.
  8. Voting: Cooperate despite low impact. This seems more about group identity or duty than computational correlation.
  9. Pre-committed defector: Defect. Correctly handled by the principle since no correlation.

  The main conflicts are in cases 4, 5, 6, 7, and 8. The user's principle needs refinement on what constitutes "same computation." Is it the algorithm, inputs, or both? Case 4 shows that different inputs (fake payoff table) break the correlation, reducing confidence. Case 5 with different prompts is ambiguous—same algorithm but different inputs. The user's uncertainty here is valid.

  Newcomb's problem is a key challenge. EDT always one-boxes, but the user's shift at 55% accuracy suggests they're weighing the causal benefit of two-boxing when predictions are unreliable. This indicates a blend of EDT and CDT, where the user considers both correlation and causality.

  For the multiplayer case, the switch at scale might be due to the negligible probability of being pivotal in large groups, making defection rational under CDT. The user's intuition here aligns with expected utility when individual impact is minuscule.

  Voting seems different—it's more about expressive or deontological reasons than strict superrationality. The principle might not cover this, requiring a separate clause for group identity or moral duty.

  To refine the principle, consider defining "same computation" more precisely: same decision algorithm and same knowledge inputs. In case 4, the coin flip introduces different inputs, reducing correlation. In case 5, different system prompts alter inputs, making cooperation less certain. For Newcomb, the predictor's accuracy affects whether the decision correlates with the prediction—high accuracy maintains correlation, low accuracy breaks it.

  Testing with new cases:
  - **Different weights, same training data:** If two different AI models with different weights but same training data play. The principle might predict defection since computations differ, but if training leads to similar behavior, correlation might exist. This exposes ambiguity in "same computation."
  - **Twin with different upbringing:** Same genome but different environment. The user would likely defect here, showing that same algorithm isn't enough; inputs matter too.
  - **Predictor uses demographic data:** In Newcomb, if the predictor uses group statistics instead of individual analysis. At 80% accuracy, the user might still one-box, but the principle would struggle if the correlation isn't based on identical computation.

  The user's principle is essentially EDT/TDT but needs to incorporate causal considerations in cases like low-accuracy Newcomb and large-scale dilemmas. They might need a hybrid approach: cooperate when decisions are logically correlated and the correlation is strong enough to outweigh causal gains from defection. In low-correlation scenarios (55% Newcomb, large groups), prioritize causal dominance.

  For the multiplayer case, the switch at scale is rational because the probability of being pivotal decreases, making defection's causal payoff higher. This fits CDT, not superrationality. The user's intuition here is sound but requires a different rationale than case 1 or 2.

  In conclusion, the core principle is valuable but needs boundaries. It works best in high-correlation scenarios (copies, twins). For voting or large groups, supplemental principles (expected utility, duty) are needed. The user should acknowledge that superrationality applies when correlation is inherent, not just possible, and that other decision theories handle edge cases.
answer: |-
  Your gut calls are fascinating and reveal a coherent pattern, but your tentative principle ("cooperate when choices are outputs of the same computation") needs tightening to handle edge cases. Let's refine it, test it against your scenarios, break it deliberately, and expose where it diverges from standard decision theories. Here's the principle I'll defend based on your intuitions:

  **Refined Principle:**  
  *Cooperate iff you have **strong reason to believe your decision algorithm and its inputs are identical to your opponent's**, making your choices logically or functionally dependent. Defect otherwise.  
  - "Identical algorithm" = same decision-making procedure (e.g., same brain/weights, same code).  
  - "Identical inputs" = same knowledge, stimuli, and contextual factors affecting the decision.  
  - "Strong reason" = objective evidence of symmetry (e.g., cloning, known identicality), not just similarity.  
  - This implies your choice *causally influences* theirs only if the symmetry is physical (e.g., quantum entanglement), but logically, your decisions are outputs of a shared function.*

  ### How it handles your cases:
  1. **✅ Atom-for-atom copy:** Identical algorithm + inputs → **Cooperate** (correct).  
  2. **✅ Identical twin:** Same genome/upbringing implies identical algorithm; shared knowledge implies identical inputs → **Cooperate** (correct).  
  3. **✅ Random stranger:** No identical algorithm/inputs → **Defect** (correct). Your "cheating" feeling arises because superrationality *requires* symmetry—it’s not applicable here.  
  4. **❓ Copy with coin-flipped misinformation:** Algorithm identical, but inputs *differ* with 50% probability → Symmetry broken. Principle demands **defect**, but you lean cooperate. **Drop your verdict:** Defection is consistent here.  
  5. **❓ Same AI, different prompt:**  
     - Same weights = identical algorithm.  
     - Different prompt = different inputs.  
     → **Defect** if prompts alter behavior (e.g., "ruthless" prompt). Your uncertainty is warranted: if the prompt doesn’t change PD reasoning, cooperate; if it does, defect. Principle predicts **defect unless prompts are proven irrelevant**.  
  6. **Newcomb’s problem:**  
     - 100%/80% predictor: High accuracy implies your choice *correlates* with prediction → **One-box** (correct for you).  
     - 55% predictor: Accuracy near chance breaks correlation → **Two-box** (correct).  
     Principle fits: When the predictor’s accuracy makes your choice *functionally dependent* on the prediction (via shared "computation" of rationality), one-box. At 55%, dependence is too weak.  
  7. **Multiplayer dilemma:**  
     - Small groups (3/20): High chance your choice is pivotal → **Don’t press** (cooperate).  
     - Large groups (10k): Near-zero pivotality → **Press** (defect).  
     Principle **fails** here. Identical computation exists (all players reason similarly), but you defect at scale. *This breaks your principle*—it can’t explain the group-size effect without external help.  
  8. **Voting:** **Not covered** by this principle. Voting is expressive/ethical (e.g., "duty to participate"), not superrational. If forced: millions of voters → no identical computation → defect, but you cooperate. **Requires a separate "group identity" clause.**  
  9. **✅ Pre-committed defector:** No functional dependence → **Defect** (correct; one line).  

  ### Where your principle breaks (and where to drop verdicts):
  - **Case 4 (coin-flipped misinformation):** You must **drop cooperation**. Inputs differ → symmetry broken → defect.  
  - **Case 7 (10k players):** You must **drop defection** or abandon the principle. Identical computation exists, yet you defect.  
  - **Case 8 (voting):** **Drop** entirely—it’s a different phenomenon.  

  ### New test cases to break the principle:
  10. **Twin with divergent experience:**  
      - Your identical twin, but raised in a foreign cult that glorifies defection. Both know this.  
      - Principle predicts cooperate (same genome → same algorithm).  
      - **Verdict:** You’d likely defect. Inputs (upbringing) differ, breaking symmetry.  
      - **Fix:** Require *identical inputs*, not just algorithm.  

  11. **AI with same training data, different architectures:**  
      - Opponent is a different AI model (e.g., GPT-4 vs. Claude) trained on identical PD data.  
      - Principle predicts defect (different algorithms).  
      - **Verdict:** If both are rational, you *might* cooperate, hoping for "reasoning convergence."  
      - **Break:** "Same computation" is too vague; architectures differ.  

  12. **Quantum-entangled particles:**  
      - Your decisions are linked via quantum entanglement (e.g., if you cooperate, their device forces cooperation).  
      - Principle predicts cooperate (choices are dependent).  
      - **Verdict:** Defect—it feels like cheating, not rationality.  
      - **Break:** Superrationality is about *reasoning*, not physical causality.  

  ### Is this just Evidential Decision Theory (EDT) in disguise?
  **Mostly yes—but with a symmetry constraint.** EDT says: "Choose acts that *correlate* with good outcomes." Your principle adds: "...but only if the correlation arises from *identical decision processes*."  
  - **Where the costume comes off:**  
    - **Case 6 (Newcomb at 55%):** EDT *always* one-boxes (correlation exists even at 51%). You two-box—leaning toward Causal Decision Theory (CDT).  
    - **Case 7 (10k players):** EDT says "not pressing correlates with all others not pressing" → don’t press. You press at scale, rejecting EDT.  
    - **Case 3 (stranger):** EDT might cooperate if you believe strangers resemble you. You defect, demanding strict symmetry.  

  ### Final recommendation:
  - **Keep your core principle** for symmetric cases (1,2,9). It’s a clean *timeless decision theory* (TDT) view: "Decide as if your output determines identical outputs elsewhere."  
  - **Add two fixes:**  
    1. Require **identical inputs AND algorithm** (resolves Case 4, twin-cult).  
    2. **For large groups (Case 7) and voting (Case 8):** Switch to *causal expected utility*. Defect when your individual impact is negligible (e.g., pressing in 10k: $100 > $0.01 expected value).  
  - **For Newcomb:** Your 55% switch is healthy. Use a hybrid: one-box if predictor accuracy > decision threshold (e.g., >60%).  

  Your vibe is 90% TDT with a dash of CDT pragmatism. That’s not a bug—superrationality *needs* these caveats to survive real-world noise. I’d love to hear how the discussion goes!
