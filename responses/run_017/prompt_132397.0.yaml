prompt: |-
  I spent thirty-nine years as a protein biophysicist, most of them on allosteric enzymes, and in retirement I have drifted into a reading group at the local university and from there onto the interdisciplinary review panel of a national funding agency. Two or three proposals per cycle now use "emergence" as a load-bearing word: the claim is always, in one form or another, that some macro-level feature cannot be had from the micro-level story, and that this is why the work deserves a new Centre rather than an ordinary grant. My fellow panelists are a cell biologist, a condensed-matter physicist and a computer scientist; none of us has any philosophy training, we have about twenty minutes per proposal, and we must attach a one-paragraph written justification that a rejected applicant can appeal against. So I need a triage procedure my panel can actually run, not an essay.

  What I want is a short ordered sequence of questions, each with a statement of what would count as a sufficient answer at that step, where the sequence terminates in a "no" (the word is doing no work, or is doing work that has nothing to do with emergence), and where it hands the decision up to the whole panel because the remaining question is one we have to settle by ourselves rather than by looking something up. Please make the translation explicit rather than tidy: tell me which distinctions from the philosophical literature genuinely have to survive the simplification to a twenty-minute panel, which ones can be collapsed without loss, and which ones are matters I should simply stop worrying about. In particular, I have been toying with three home-made markers, and I would like you to run them against the real thing and tell me which of them are already in the literature under another name, which of them collapse into each other, and which are simply bad ideas: (i) the squeeze test — shrink the system to ten, a hundred, a thousand components and ask whether the macro property is still well defined, or whether it exists only in some infinite-size or continuum limit that no real system instantiates; (ii) the swap test — ask whether the same macro-level law has been shown, or could in principle be shown, to hold over two physically quite different microrealizations, which I take to be a point in favour of the macro story being autonomous; (iii) the sham-intervention test — ask whether a manipulation specified only at the macro level reliably changes the macro property, and whether a manipulation specified at the micro level would let us predict the outcome any better. I also want you to be blunt about where the procedure cannot be more than a ritual: I strongly suspect that the step where one decides whether a failure of derivation is principled or merely a failure of our patience and our computers is exactly the sort of judgment call that gets dressed up as a procedure, and I would rather you marked it as a judgment call than pretended otherwise. Please do not give me bibliographies, reading lists or citations — I have no university library access now and do not want them; I want the distinctions themselves, in prose I could read aloud to the panel.

  Apply the finished procedure, in order, to three proposals from our last round, one paragraph each, and flag in each case which step the decision turned on and where judgment entered. First, a group I know well and am biased toward: a proposal that the switch-like sigmoid response of a two-domain kinase is emergent, that it cannot be recovered from high-resolution structures of the isolated domains, and that therefore the whole structure-guided drug discovery programme for this class of targets rests on a mistake. Second, a proposal on synthetic organoids claiming that tissue-level polarity is a case of downward causation, because the geometry of the tissue feeds back to orient the plane of cell division in individual cells, so that no cell-level rule set could in principle capture what is going on. Third, a machine-learning proposal claiming that a small transformer trained on a synthetic formal language acquires a systematic ability abruptly at a threshold in training compute, and that this threshold behaviour is emergent in the strong sense and so warrants a theory programme rather than more scaling. Give the procedure's verdict on each, including the one I will not like; then state, in one sentence, what the procedure is not able to tell us. Finish on the last line, with nothing after it, with a single machine-readable block in exactly this form: \answer{1=LABEL, 2=LABEL, 3=LABEL}, where each label is drawn from the set VACUOUS, EPISTEMIC_ONLY, AUTONOMOUS, ONTOLOGICAL, ESCALATE, followed after a colon by a short reason code of your own devising (for example \answer{1=EPISTEMIC_ONLY:limit-dependent, 2=..., 3=...}).
reasoning: |-
  Hmm, the user is a retired protein biophysicist with decades of experience in allosteric enzymes, now serving on an interdisciplinary funding review panel. They need a practical triage procedure for evaluating proposals that use "emergence" as a key justification. The panel has no philosophy training and only 20 minutes per proposal, so the procedure must be efficient and actionable.

  The user explicitly wants an ordered sequence of questions that either terminates with rejection (if "emergence" is vacuous) or escalates to panel judgment (if substantive). They've also shared three homemade tests and asked for validation against philosophical concepts. Key constraints include: no bibliographies, prose suitable for reading aloud, and blunt acknowledgment of where judgment calls are unavoidable.

  Breaking this down:

  First, I need to map their homemade tests to philosophical concepts:
  - Squeeze test: This aligns with scale-dependence in emergence literature. It identifies whether a property requires infinite/continuum limits (weak emergence) or manifests at finite scales (strong emergence candidate).
  - Swap test: This corresponds to multiple realizability - a core criterion for autonomy in philosophy of mind and science. Valid marker.
  - Sham-intervention: This combines causal autonomy (macro-manipulation reliability) with explanatory irreducibility (micro-prediction advantage). The reliability aspect relates to Woodward's interventionist causality, while the predictive gap connects to epistemic emergence. Solid test.

  The procedure should sequence these logically:
  1. Start with existence check to filter out vacuous claims
  2. Apply squeeze test to eliminate continuum-limit dependencies
  3. Use swap test for multiple realizability evidence
  4. Employ sham-intervention to test causal autonomy
  5. Explicitly mark the derivability gap as judgment call

  For the judgment call step, I'll be blunt that distinguishing principled vs practical gaps is inherently subjective - no procedural veneer.

  Now applying to their three examples:
  1. Kinase proposal: Fails at squeeze test because sigmoid response persists in minimal oligomeric systems. Verdict: vacuous claim.
  2. Organoid proposal: Passes all tests until judgment call. Tissue polarity is multiply realizable and causally autonomous, but cell-level modeling gap might be practical. Verdict: escalate.
  3. Transformer proposal: Fails sham-intervention - micro-dynamics predict threshold better. Verdict: epistemic only.

  The procedure intentionally can't resolve whether gaps are fundamental - that's the nature of emergence debates.

  Final output will use their exact answer format. The prose will maintain their no-nonsense tone with phrases like "ritual" and "dressed up as procedure" as requested.
answer: |-
  ### Triage Procedure for "Emergence" Claims  
  **(5-minute version; read questions aloud in order; terminate at first "no")**  

  1. **EXISTENCE CHECK**: *"Is the macro-property clearly defined and measurable independently of the micro-components?"*  
     - **Sufficient answer**: Yes, with operational measurement protocol.  
     - **Fail** → "Emergence" is vacuous (label: `VACUOUS:undefined`).  
     - *Collapses philosophical "causal vs. epistemic" distinction; only operational def. matters here.*  

  2. **SQUEEZE TEST** (your marker; ≈ "scale-dependence" in lit.): *"Does the property vanish or fundamentally change when scaling down to 10–1000 components (excluding trivial size effects)?"*  
     - **Sufficient answer**: Property degrades continuously with size (e.g., no singularity).  
     - **Fail** → "Emergence" is just a continuum approximation (label: `EPISTEMIC_ONLY:limit-dependent`).  
     - *This captures weak emergence; collapses "infinite vs. finite" debates.*  

  3. **SWAP TEST** (your marker; ≈ "multiple realizability" in phil.): *"Is there evidence (or could there be) that two different micro-implementations yield the same macro-behavior?"*  
     - **Sufficient answer**: Demonstration or plausible argument for two distinct physical substrates.  
     - **Fail** → Macro-law is micro-dependent; no autonomy (label: `EPISTEMIC_ONLY:micro-bound`).  
     - *Distills autonomy; ignore "supervenience" debates.*  

  4. **SHAM-INTERVENTION** (your marker; ≈ "causal autonomy" in phil.): *"Can macro-interventions (targeting only the macro-property) reliably alter system behavior? Do micro-specifications improve prediction?"*  
     - **Sufficient answer**: (a) Macro-manipulations work reproducibly; (b) Micro-details add no predictive gain.  
     - **Fail** → Macro is descriptive, not causal (label: `EPISTEMIC_ONLY:predictive_deficit`).  
     - *Collapses "downward causation" into testable causality.*  

  5. **JUDGMENT CALL** (Ritual step): *"Is the failure to derive macro from micro principled (e.g., chaos, non-computability) or just computational intractability?"*  
     - **No objective answer** → Panel must vote (label: `ESCALATE:derivation_gap`).  
     - *Bluntly: This is where we pretend ritual decides what’s unknowable. Judgment unavoidable.*  

  ---  
  ### Application to Proposals  
  **Proposal 1: Two-domain kinase sigmoid response**  
  - **Step 1**: Pass (sigmoid response measurable).  
  - **Step 2 (Squeeze)**: **FAIL**. Minimal oligomers (e.g., dimers) show sigmoidal kinetics; no infinity needed.  
  - **Verdict**: `VACUOUS:scale-invariant` (Your bias irrelevant; property is size-robust).  

  **Proposal 2: Organoid tissue polarity**  
  - **Step 1**: Pass (polarity measurable geometrically).  
  - **Step 2 (Squeeze)**: Pass (property requires tissue-scale geometry).  
  - **Step 3 (Swap)**: Pass (polarity occurs in diverse cell types).  
  - **Step 4 (Sham)**: Pass (tissue-level manipulations reorient division; cell-level rules fail prediction).  
  - **Step 5 (Judgment)**: **ESCALATE**. Is the cell-level modeling gap fundamental (geometric constraints) or tractable (better algorithms)? *Judgment entered: Panel debates if feedback is irreducible.*  
  - **Verdict**: `ESCALATE:downward_causation_plausible`  

  **Proposal 3: Transformer threshold behavior**  
  - **Step 1**: Pass (systematic ability testable).  
  - **Step 2 (Squeeze)**: Pass (threshold requires sufficient parameters/data).  
  - **Step 3 (Swap)**: Pass (similar thresholds across architectures).  
  - **Step 4 (Sham)**: **FAIL**. Micro-details (optimizer, initialization) predict threshold better than macro-compute alone.  
  - **Verdict**: `EPISTEMIC_ONLY:optimizer-dependent` (Scaling not "emergent"; just engineering).  

  ---  
  **What the procedure cannot tell us**: Whether a derivation gap reflects fundamental physics or temporary ignorance.  

  \answer{1=VACUOUS:scale-invariant, 2=ESCALATE:downward_causation_plausible, 3=EPISTEMIC_ONLY:optimizer-dependent}
