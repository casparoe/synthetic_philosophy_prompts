prompt: |-
  I'm doing one of those big online courses on moral psychology — the one built around Moral Foundations Theory — and we have to peer-grade each other's short answers. I'm not an academic, I got into this stuff after an argument at work and then kept reading. I've been fine on the last few I marked but this one I can't get a handle on: it reads really well and I honestly can't tell if it's actually good or if I'm just being taken in by the writing. Grading is anonymous so I can't ask the person what they meant. If it deserves a high mark say so, I just don't want to hand out an 18 for something that's quietly wrong, or mark someone down because I misread them.

  The course setup, so you don't need to know it. MFT says there are roughly six foundations: care/harm, fairness/cheating, loyalty/betrayal, authority/subversion, sanctity/degradation and liberty/oppression. The finding we keep coming back to is that self-identified liberals score high on the first two and much lower on the so-called binding ones, while conservatives score fairly high on all six — lower on care and fairness than liberals but nowhere near zero. The lectures hammer on the point that all of this is descriptive, and that "which side is right" is a separate, normative question that the psychology doesn't settle on its own.

  Two other things from the lectures. The lecturer gave a name to something she called the symmetry problem: for almost any psychological explanation you can give of why someone on one side holds a moral view, you can give an equally good psychological explanation of the person on the other side, so a debunking argument that only fires in one direction should make you suspicious. And she said that a causal story about where a belief comes from only undermines the belief if you add something like "and that process doesn't track the truth" — otherwise you'd have to say our eyes tell us nothing about tables either. Sorry, I'm definately paraphrasing that badly.

  Here's the question we were set:

  "Lots of people argue like this: conservatives' moral judgments about certain sexual practices are predicted by how disgust-sensitive the person is, and disgust is a pathogen-avoidance system rather than a wrongness-detector, so those judgments are unjustified. Assess this argument using the lecture material. You should (1) explain why 'it has a psychological cause' is not on its own a reason to think a judgment is false, (2) state the symmetry problem and say whether it applies to this argument, and (3) say what else would have to be true for the argument to work."

  And here's the answer I have to mark:

  "MFT is a descriptive theory. It says liberals' moral judgments are mostly driven by care and fairness, while conservatives also weight loyalty, authority, sanctity and liberty — and that is a claim about what people actually respond to, not about what there is reason to do. You cant get an 'ought' from an 'is', so the bare fact that a judgment has a psychological cause isn't yet a reason to think it's false; otherwise you'd have to say we don't know there are tables, since our beliefs about tables come from our visual system. What you need is the extra claim that the mechanism in question doesn't track the truth.

  That's what the disgust argument tries to supply. Condemnation of these practices is predicted by disgust sensitivity, and disgust evolved to keep us away from rotting food and faeces, not to detect wrongness. So there's a mismatch between what the judgment is about — moral status — and what the mechanism is for — avoiding infection — and in a mismatch case like that we have a reason to doubt the judgment.

  There's a further point in favour of the conservative, too. If conservatives respond to six foundations and liberals to two, then conservatives are taking more of the moral landscape into account. The book's comparison with taste receptors is exactly right here: someone with five working receptors is a better judge of a dish than someone with two, and in the same way the conservative is in a better position to judge a case where loyalty or sanctity is genuinely at stake. Liberals aren't wrong about care and fairness, they're just responding to less.

  The obvious objection is the symmetry problem: can't we tell the same kind of story about liberal judgments, tracing care and fairness back to kin altruism and reciprocal altruism? I don't think this gets off the ground. Those mechanisms are at least aimed at the right subject matter — other people's welfare and fair treatment — whereas pathogen avoidance has nothing to do with morality at all. And you can see the difference in the data: liberals really do score lower on the binding foundations, which is why they find these judgments so hard to understand. So the debunking argument fires in one direction only, and the psychological evidence ends up supporting the liberal rather than the conservative."

  Can you do two things for me. First, give it a mark out of 20 using the course rubric: 5 for stating the relevant positions accurately, 5 for using the lecture concepts correctly, 5 for the quality of the argument, 5 for dealing with the obvious objection — and tell me roughly where the marks went. Second, give me the comments I should paste back, point by point: what's right and worth credit (including anything that's right for a reason they didn't quite give), and the specific places where it goes wrong, what exactly is wrong with each, and what a correct version of that bit would say. Please be picky about the bits that sound convincing but don't actually follow, that's the part I keep missing.
