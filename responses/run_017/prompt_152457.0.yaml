  So step (3) only works when the evidence partition is known and finite.

  In the general case, you might not be able to be Dutch booked if there are evidence you haven't considered.

  But the bookie could still, in principle, offer bets for the evidence when it happens, but in the argument, the bets are offered at t1, so they have to be conditional on future evidence.

  If you don't have a credence for E when E is unimaginable, you can't be coerced into betting on it.

  Therefore, SLA, when applied diachronically, only requires that for the evidence and hypotheses you currently can consider, your updating plan should be conditionalization.

  For the rest, rationality doesn't demand anything specific, or perhaps you should update as best you can when new evidence arrives.

