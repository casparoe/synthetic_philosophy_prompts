  Now, about the friend's Newcomb's problem point: in Newcomb's, some people think it's rational to take both boxes even if you're predictable, but that's controversial. In this case, at t2, you're accepting a bet based on your new credences, which might not be what you planned, but in the setup, you're following your plan.

