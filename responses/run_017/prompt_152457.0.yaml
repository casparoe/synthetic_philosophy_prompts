  In step (4), it says the bookie has to know your plan, which is true for the Dutch book to be constructed.

  But for rationality, it's about whether you can be exploited, not whether you actually are exploited.

  The Dutch book theorem shows that if your credences are incoherent, you are vulnerable to a sure loss; you might not actually face a bookie, but the vulnerability is the issue.

  Similarly for updating: if your plan is not conditionalization, you are vulnerable to a sure loss if a bookie exploits it.

  But if there are possible evidence that you didn't consider, and thus no bet is made for that, you might not be vulnerable for those cases.

  Therefore, you are only vulnerable for the evidence you do consider.

  So again, rationality requires that for the evidence you can describe, you plan to conditionalize.

  For other evidence, you might not have a plan, so no vulnerability.

  Thus, step (5) is incorrect: SLA does not require that you have credences for every possible future hypothesis or evidence; only for those in your current ontology.

  And step (6) doesn't follow because you don't need sharp credences for everything.

  Therefore, the bad step is in the interpretation in (5) and (6), not in (3) per se.

  (3) is fine as long as we assume a fixed and known partition.

  But (4) observes that (3) needs that, and (5) extends it unreasonably.

  So by accepting (3) with the understanding that it applies when partitions are specified, we avoid the problem.

  What does it cost? It means that for agents who face unforeseen evidence, conditionalization isn't mandated by Dutch book, so there might be other norms, but that's fine. We can still say that when you can specify partitions, you should conditionalize.

  For synchronic coherence, it's similar: you don't need credences for propositions you can't grasp, only for those you can.

  So probabilism is required over your current conceptual scheme.

  I think this resolves the issue.

  Now, about the extra assumptions: in the standard diachronic Dutch book, it's often assumed that the bookie knows your plan and that the evidence partition is fixed. This doesn't make the norm only for predictable agents; it's that if you have a non-conditionalization plan, you are irrational because you could be exploited, even if no one does exploit you. The vulnerability is the issue.

  But for unforeseen evidence, since you can't be exploited for it (because no conditional bet can be placed), there's no vulnerability, so no irrationality in not having credences for it.

  Therefore, the norm is still one of rationality, but bounded by your current epistemic state.

  So to answer the user: I give up the inference from (2) and (3) to the requirement for all possible evidence, which is in (5). Specifically, I reject that SLA requires conditionalization for evidence you can't now describe.

  Giving it up costs nothing for probabilism or conditionalization in ordinary cases; it just limits the scope to describable evidence.

  What that step looked like it was buying was a fully general requirement for all possible futures, but that's impossible, so it's overreaching.

  The step to give up is the universal quantification in (5).

  (5) says: "Whatever you might later treat as evidence, whatever you might later take seriously as a hypothesis, has to be in the book now."

  But that's not true; only what you can now treat as evidence needs to be considered.

  So SLA requires conditionalization only for the evidence you can now enumerate.

  For the rest, when new evidence arrives, you form credences then and update as best you can, perhaps by conditionalization relative to your new algebra.

  But the Dutch book doesn't force it.

  I think that's the solution.
answer: |-
  I've spent some time with this puzzle, and it's a deep one—classic in the literature on Dutch books and Bayesian rationality. The core tension arises from extending the synchronic Dutch book argument (which targets static credences) to diachronic cases (which involve belief updating over time) without proper constraints. The conclusion that rationality requires sharp, defined credences for every conceivable future hypothesis and evidence—including those you can't now describe or imagine—is indeed untenable. But rejecting that conclusion doesn't force you to abandon probabilism or conditionalization in ordinary cases. Instead, the misstep is in **step (5)**, specifically in its claim that SLA (Synchronic Loss Avoidance) requires your current credences to cover every possible future hypothesis and evidence, no matter how indescribable or unforeseen. Below, I'll explain why (5) is the bad step, what giving it up costs, and what it was mistakenly thought to buy. I'll also address how this preserves the key insights from (1)-(4) and handles your concerns about extra assumptions.

  ### Why Step (5) is the Bad Step
  Step (5) claims:  
  > *"Nothing in (2) or (3) confines the cells to evidence you can now describe, or the hypotheses to ones you can now formulate. Whatever you might later treat as evidence, whatever you might later take seriously as a hypothesis, has to be in the book now."*

  This is where the argument overgeneralizes. The Dutch book theorem (1) and SLA (2) are fundamentally about coherence *at a given time* with respect to the propositions *you can currently entertain*. Similarly, the diachronic argument for conditionalization in (3) only works if the evidence cells and hypotheses are part of your current conceptual framework—that is, if you can represent and assign probabilities to them now. If you can't even describe or conceive of certain evidence or hypotheses (e.g., "being drugged" or "a theory nobody has stated yet"), you can't have credences for them, so they can't be included in the Dutch book setup. Thus, SLA does *not* require you to have sharp credences for literally every possible future event; it only applies to what is cognitively accessible to you at the time.

  **Why this is a misstep:**  
  - **The Dutch book arguments rely on bettability:** For a Dutch book to be constructed, the bets must be formulable and acceptable based on your current credences. If you can't describe an evidence proposition \(E\) now, you can't assign a conditional probability \(P(H|E)\) now, so no conditional bet can be priced or offered at \(t_1\). The bookie can't include indescribable evidence in the "package" because it can't be defined in the betting contract.  
  - **SLA targets vulnerability, not omniscience:** SLA (from step 2) forbids policies that make you vulnerable to a sure loss *for the bets you can actually consider*. If you can't consider certain evidence or hypotheses, you're not vulnerable to a sure loss involving them—there's no "package" to accept or reject. Rationality doesn't demand immunity from losses in scenarios you can't conceptualize; it demands coherence within your current epistemic state.  
  - **The diachronic argument in (3) assumes a fixed partition:** As step (4) notes, (3) requires enumerating evidence cells in advance. But (3) doesn't imply that this enumeration must cover all metaphysically possible worlds—only those you can currently represent. If your current conceptual scheme doesn't include "drugged" or "unimagined theory," those worlds aren't in your possibility space now, so they're not part of the Dutch book argument for conditionalization.

  In short, step (5) mistakenly assumes that "every world you count as possible" (from SLA) includes worlds you *will* or *might* count as possible in the future, even if you can't count them as possible now. But SLA is about your current perspective: "worlds you count as possible" means those in your current model of the world, not all future expansions of it.

  ### What Giving Up Step (5) Costs
  Giving up this overgeneralization comes with minimal costs to the core ideas you want to preserve (probabilism, conditionalization in ordinary cases, and the force of Dutch books). Here's what it costs and what you gain:

  - **Cost: The scope of the Dutch book argument for conditionalization is limited.**  
    You can no longer claim that rationality *strictly requires* conditionalization for all possible evidence, including evidence you can't describe or foresee. This means that in "messy" cases (e.g., after being drugged or encountering a radical new theory), the diachronic Dutch book doesn't apply, so conditionalization isn't mandated *by this specific argument*.  
    - **Why this is acceptable:** These messy cases are edge cases where rationality is often compromised anyway (e.g., due to cognitive limitations). We can still say that in ordinary situations—where you have a well-defined, finite partition of evidence you can describe—conditionalization is required to avoid sure loss. For the edge cases, other norms might apply (e.g., "do your best to update coherently given your new state"), but they aren't forced by Dutch book vulnerability.

  - **Gain: You keep everything else intact.**  
    - (1) **Dutch book theorem:** Untouched. Synchronic probabilism still holds for your current credences over the propositions you can entertain.  
    - (2) **SLA:** Preserved as the core rationality principle, but now properly scoped: It forbids accepting sure-loss packages *for bets you can currently formulate*.  
    - (3) **Diachronic argument for conditionalization:** Still valid, but only when applied to evidence partitions you can now describe. For example, if you're about to run an experiment with known outcomes \(E_1, E_2, \dots, E_n\), rationality requires you to plan to update by conditionalization to avoid sure loss.  
    - (4) **Observation about (3):** Correct and harmless—it just notes that (3) needs a known partition and a known updating plan. This doesn't imply that the partition must be exhaustive of all metaphysical possibilities.  
    - **Probabilism and conditionalization in ordinary cases:** Fully preserved. You can still insist that, for standard epistemic contexts, rationality demands coherent credences and updating by conditionalization—precisely because, in those contexts, evidence and hypotheses are describable and bettable.

  In essence, giving up step (5) costs you a false sense of universality but saves the heart of Bayesian rationality. It also aligns with real-world epistemology: agents aren't required to be logically omniscient or to foresee the unforeseeable.

  ### What Step (5) Looked Like It Was Buying (and Why It Was Misleading)
  Step (5) seemed to be buying a **fully general, exceptionless norm** that would make conditionalization a universal requirement of rationality, applying even to chaotic or unimaginable scenarios. This was appealing because it promised a clean, all-encompassing extension of the Dutch book argument: if probabilism forbids static incoherence, and SLA forbids dynamic incoherence, then surely rationality must forbid any "gap" in your credences or updating policy, no matter how exotic.

  But this overreach is what led to the absurdity in step (6). In reality, step (5) was conflating two things:
  - **What rationality requires:** Coherence *within your current epistemic state*.
  - **What is humanly possible:** Having credences for *everything* that might ever happen.

  Rationality can't demand the impossible (e.g., sharp credences for indescribable evidence), so step (5) was always doomed. The Dutch book arguments only "buy" norms for the conceivable—they don't extend to the inconceivable.

  ### Handling Your Concerns About Extra Assumptions
  You mentioned that standard repairs often "bolt on" assumptions (e.g., "you're certain of your future beliefs," "the bookie knows your plan," "you won't forget"). These *are* used in diachronic Dutch book arguments, but giving up step (5) shows why they're less problematic than they seem:
  - **Where the assumptions come from:** In the diachronic argument (step 3), assumptions like "the bookie knows your plan" and "a fixed evidence partition" are part of the *thought experiment* to demonstrate vulnerability. They don't need to hold in reality for the norm to be binding. Rationality requires that *if* you have a plan for describable evidence, it should be conditionalization to avoid exploitability. The bookie is just a tool to show this—you're irrational if your plan makes you vulnerable, even if no bookie exists.
  - **Is this a norm only for predictable agents?** No. Vulnerability to sure loss is about your *internal* coherence, not external predictability. For instance, if you have a non-conditionalization plan for known evidence, you're irrational because your commitments (e.g., bet acceptances) conflict over time. This is true even if no one exploits it. Unpredictable agents can still be incoherent! But crucially, this only applies to describable evidence—for the indescribable, there's no commitment to conflict with.
  - **Your desire to keep conditionalization in ordinary cases but not "drugged" cases:** This is exactly what giving up step (5) achieves. In ordinary cases, with describable partitions, conditionalization is required. In "drugged" cases, you might not have a prior credence for "being drugged," so no Dutch book can be set up, and conditionalization isn't enforced by this argument. Rationality might still demand you recover coherence when possible (e.g., after regaining clarity), but that's a separate issue.

  ### Addressing the Newcomb's Problem Dodge
  Your friend's point—that (3) is "Newcomb's problem with extra steps"—isn't compelling here. In Newcomb's, the debate is about whether rationality allows two-boxing when you're predictable. But the diachronic Dutch book isn't about prediction; it's about dynamic consistency. At \(t_2\), you're not "shrugging at the bet"—you're freely accepting it based on your updated credences. The issue is that your \(t_1\) and \(t_2\) decisions jointly guarantee a loss if you didn't plan to conditionalize. This isn't a Newcomb-like conflict between dominance and expected utility; it's about coherence across time. Rejecting step (5) doesn't invoke Newcomb's; it simply limits the scope of the coherence demand to what you can currently grasp.

  ### Summary and Path Forward
  - **Bad step:** Step (5), by overgeneralizing SLA and the diachronic argument to require credences for all possible future evidence/hypotheses, even indescribable ones.
  - **What giving it up costs:** A universal, exceptionless requirement for conditionalization (it no longer applies to indescribable evidence). But this is a small cost, as such cases are pathological and rare.
  - **What it buys back:** Everything else: probabilism via (1), SLA as a rationality principle via (2), conditionalization for ordinary cases via (3), and a clear role for the assumptions in (4). You keep conditionalization as rationally required when evidence partitions are describable.
  - **No need for dodgy bolts-ons:** The norm still binds all agents, not just predictable ones, because it's about avoiding vulnerability for the bets you can make. Assumptions like "known partition" are part of the argument's setup, not restrictions on who is rational.

  If you want to dive deeper, I recommend looking at work on "bounded rationality" in Dutch book arguments (e.g., by Schervish, Seidenfeld, or Kadane) or "imprecise probabilities" for handling unresolved uncertainty. But for your reading group, the key is to push back on step (5)—it's the hinge where a good argument overextends into impossibility.
