  Rationality should be about internal coherence, not about being predictable to others.

  In the diachronic Dutch book, the bookie is exploiting your updating rule, which you have committed to. But if you don't commit to a rule, or if your rule depends on the evidence, it might not be exploitable.

  But in the argument, you have a plan, and if it's not conditionalization, it can be exploited.

  But the problem is that for evidence you can't imagine, you can't have a plan.

  So perhaps the key is to reject the idea that rationality requires you to have a full updating policy for all possible evidence, including unimaginable evidence.

