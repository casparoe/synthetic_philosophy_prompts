prompt: |-
  I direct a small policy-planning unit inside a foreign ministry, and effectively all of our work arrives in the form of a claim that some present situation is a repeat of an earlier one: this is Munich, this is Vietnam, this is 1914, this is a rising power frightening an established one, this is the Cuban Missile Crisis and therefore we should blockade rather than invade. These claims come in weekly, from ministers, from allied governments, from our own staff, and increasingly from advocacy groups. They are not offered as decoration; they are offered as evidence that a particular policy will succeed or fail. My team has no framework for grading them, so the loudest analogy wins.

  What I want from you is a written procedure my analysts can actually run, not an essay about analogy. Constraints on its use: one or two generalists with no graduate training in history, roughly forty-five minutes, open sources only, no archives and no specialist consultation; the write-up has to fit on one page and be readable by a minister who has never thought about analogical reasoning; and it has to terminate in one of three verdicts — the analogy earns weight in the forecast and licenses a named prediction; it is only a reframing device, good for generating questions but not for answering them; or it is doing rhetorical work and should be struck from the paper. Please give me the ordered questions, what counts as a sufficient answer to each, the points where the sequence stops with a no, and the points where the remaining question is one of values or of irreducible judgment and must be handed to a named human rather than settled by the checklist.

  Four constraints on the design itself, because the easy versions of this fail.

  First, the procedure cannot rest on an agreed reading of the source case. Historians dispute what Munich teaches, what Vietnam teaches, and whether the Peloponnesian War really was a case of an established power reacting to a rising one; if your checklist requires the analyst to know what actually happened and why, it will just reproduce the analyst's politics. It has to work when the source case is contested.

  Second, it must sort surface resemblance from mechanism portability: the analogy has to name the mechanism that did the causal work in the source case, state the conditions under which that mechanism operates, and then check those conditions in the target rather than counting shared features.

  Third, it must be symmetric. For every analogy offered, the analyst should have to produce the best-fitting analogy that supports the opposite policy and run the same steps on it; a procedure that only ever interrogates the other side's analogy is worthless to me. Say explicitly what the analyst should do when the two analogies come out with comparable fit and opposite recommendations, since that is the common case and not a degenerate one.

  Fourth, it must handle two pathologies I see constantly. One is selection: the cases we remember were filtered by outcome, and the lessons that survive in public argument were filtered again by how useful they are to people arguing for action, so a procedure that asks only whether the target resembles the source inherits both filters. The other is reflexivity: the other side has read the same history. A government may stage a provocation expecting us to read it as Munich, or refrain from something expecting us to read it as 1914, or invoke our own archival analogy back at us. The procedure needs a step for the case where the target is reasoning about our analogy use, including the possibility that the analogy is being deployed as a weapon rather than offered as a forecast.

  Please also build in a pre-registration step, since we nearly always see the analogy after the recommendation is already drafted, and a step that asks what the expected loss is if the analogy is wrong and the action it recommends is irreversible.

  Then run it, honestly, on three live-shaped cases: a hegemon-and-rising-power framing applied to the current competition over Taiwan; a Munich framing applied to a demand that a neighbouring state cede territory and cap its alliances; and a Vietnam framing applied to a proposal to send a few hundred advisers and some air support to a government losing a counterinsurgency. My unit has a house bias — we are the restraint-minded desk, we reach for 1914 and Vietnam, and we are reflexively hostile to Munich framings — so if the honest output is that our own house analogy is the weakest of the three, say that plainly, because it is the answer I will be most tempted to reject.

  Finally, tell me what the procedure cannot do, where it will misfire, and which of its steps are judgment calls dressed up as method. And note that the failure mode I most want to avoid is a checklist whose real content is check whether the analogy is accurate, or one that amounts to general scepticism about learning from history; the verdicts have to be generated by the structure of the case and the mechanism, not by the analyst's prior view of the policy.
reasoning: |-
  We are creating a procedure for evaluating analogies in policy planning. The procedure must be executable by non-historians in 45 minutes using open sources, and produce one of three verdicts: 
   1. The analogy earns weight in the forecast and licenses a named prediction.
   2. It is only a reframing device, good for generating questions but not for answering them.
   3. It is doing rhetorical work and should be struck from the paper.

   Constraints on design:
    1. Cannot require an agreed reading of the source case (historians dispute the lessons).
    2. Must sort surface resemblance from mechanism portability: focus on the causal mechanism and conditions.
    3. Must be symmetric: for every analogy offered, the analyst must produce the best-fitting analogy that supports the opposite policy and run the same steps on it. 
       - When two analogies have comparable fit and opposite recommendations, we must have a step for that.
    4. Must handle two pathologies: 
        a. Selection bias (we remember cases filtered by outcome and by usefulness for action).
        b. Reflexivity (the other side is also using analogies strategically).

   Additional requirements:
     - Pre-registration step: require that the analogy be stated and the mechanism spelled out before the policy recommendation is known.
     - Step to consider expected loss if the analogy is wrong and the action irreversible.

   Steps in the procedure:

   I. Pre-registration (before seeing the policy recommendation):
       1. State the source case (e.g., "Munich") and the target case (e.g., "current situation with Country X").
       2. State the causal mechanism that the analogy is claiming: 
           - In the source case, what was the mechanism that led to the outcome? (e.g., "Appeasement led to further aggression because it signaled weakness and emboldened the adversary.")
       3. State the conditions under which that mechanism operates. (e.g., "The mechanism operates when the adversary is expansionist and perceives concessions as weakness, not as goodwill.")
       4. State the policy recommendation that the analogy implies (e.g., "Do not appease; stand firm.").

   II. Step 1: Check for selection bias in the source case.
       - Question: "Are there other cases that are similar to the source case in its initial conditions but had a different outcome? (i.e., are there near misses or failures that we don't remember because they didn't lead to dramatic outcomes?)"
          - How: Use open sources to find historical examples that shared key initial conditions but had different outcomes. Example: For Munich, look for cases of appeasement that worked (if any) or cases where standing firm led to war. The goal is to see if the outcome was over-determined by the mechanism or contingent on other factors.
       - Sufficient answer: If the analyst can find at least one other case that started similarly but had a different outcome, then the mechanism is not universally operative. This step doesn't kill the analogy but reduces its weight.
       - Verdict if failed: This step does not terminate the procedure but notes the bias. If no such cases can be found in a quick search (within 5 minutes), note that the source case may be exceptional and the lesson less portable.

   III. Step 2: Check mechanism portability to the target case.
       - Question: "Do the conditions under which the mechanism operates (as stated in pre-registration) hold in the target case?"
          - How: For each condition, check using open sources (e.g., news, intelligence reports) whether it is present in the target.
       - Sufficient answer: For the analogy to hold, all the stated conditions must be present. If even one is absent, the mechanism may not operate.
          - Example: For Munich, if the adversary is not expansionist (or if there is evidence they are open to negotiation without seeing concessions as weakness), then the mechanism doesn't hold.
       - Verdict: If the conditions do not hold, the analogy is downgraded to "only a reframing device". If they do hold, proceed.

   IV. Step 3: Check for reflexivity.
       - Question: "Is the adversary (or other key actor) in the target case likely to be aware of this analogy and acting strategically in response?"
          - How: Look for statements by the adversary, their strategic documents, or expert analyses that suggest they are using the same historical frame. 
          - Example: If we are considering a Munich analogy, is the adversary trying to mimic Hitler's tactics? Or are they avoiding actions that might trigger a 1914-style spiral?
       - Sufficient answer: If there is evidence that the adversary is using the analogy, then the situation is reflexive. This means the causal mechanism may be altered because the adversary is anticipating our reaction.
       - Verdict: If reflexivity is present, the analogy becomes less reliable as a predictor and more of a strategic move in a game. It is then downgraded to "reframing device" (because it helps understand the adversary's thinking) but not for forecasting. If no reflexivity, proceed.

   V. Step 4: Consider the counter-analogy (symmetry constraint).
       - Task: The analyst must propose the most compelling analogy that supports the opposite policy. Example: 
           - If the original analogy is Munich (implying stand firm), the counter-analogy might be 1914 (implying that standing firm could lead to accidental war) or Vietnam (implying that intervention leads to quagmire).
       - Then run Steps 1-3 on the counter-analogy.
       - Compare the two:
          - If one analogy passes Step 2 (conditions hold) and the other fails, then the passing one earns weight.
          - If both pass Step 2, then we have two competing analogies. The procedure must then:
              a. Check which one has more conditions met (if quantifiable).
              b. Check which one is less affected by reflexivity (Step 3).
              c. Check which one has more evidence against selection bias (Step 1) - i.e., the mechanism is more robust across multiple cases.
          - If they are still comparable, then the analogy is only a reframing device and the decision must be handed over to a named human (e.g., the Minister) because it becomes a matter of values or irreducible judgment.

   VI. Step 5: Assess expected loss.
       - Question: "If the analogy is wrong and the recommended policy is irreversible, what is the expected loss?"
          - How: Consider the worst-case scenario if the analogy is incorrect and the policy is implemented. Also consider the worst-case if the opposite policy is chosen. 
          - Example: Blockading based on Cuban Missile Crisis analogy: if wrong, it might lead to war. If we don't blockade and the analogy is right, we might face nuclear blackmail.
       - Verdict: This step does not change the verdict but must be included in the one-page write-up to inform the minister. If the expected loss of acting on a wrong analogy is catastrophic and irreversible, then even if the analogy has weight, it might be too risky.

   VII. Termination and Verdicts:
       - After Step 4, we have one of:
          a. The original analogy passes (conditions hold, no reflexivity, and counter-analogy fails) -> verdict 1: earns weight.
          b. The original analogy fails Step 2 (conditions don't hold) -> verdict 2: reframing device.
          c. The original analogy is undermined by reflexivity (Step 3) -> verdict 2: reframing device.
          d. Both original and counter-analogy pass and are comparable -> verdict 2: reframing device, and hand over to human for judgment.
          e. The analogy is being used in a way that ignores selection bias, fails conditions, or is clearly rhetorical (e.g., no mechanism, just emotional) -> verdict 3: strike from paper.

       - However, if in Step 1 we found that the source case is highly exceptional and the mechanism is not robust, then even if conditions hold, we might downgrade to verdict 2.

       - Also, if in the pre-registration the mechanism is not stated or is vague, then the analogy is doing rhetorical work (verdict 3).

   VIII. Write-up: One page, with:
       - Source case and mechanism.
       - Conditions checked (yes/no for each, with brief evidence).
       - Counter-analogy and its mechanism, conditions checked.
       - Selection bias and reflexivity notes.
       - Expected loss.
       - Verdict.

   Now, we run the procedure on three cases.

   Case 1: Hegemon-and-rising-power (Thucydides Trap) applied to Taiwan.

   Pre-registration:
     - Source: Peloponnesian War (Athens rising, Sparta established) -> war.
     - Mechanism: Structural stress: when a rising power threatens to displace an established one, the established power fears loss of status and preempts, leading to war.
     - Conditions: 
          a. The rising power is growing in power and assertiveness.
          b. The established power perceives this as a threat to its position and security.
          c. There is a specific flashpoint (like Taiwan) that could trigger war.
          d. Both sides see the flashpoint as a test of resolve.
     - Policy: Avoid actions that could trigger war, but stand firm to avoid appearing weak.

   Step 1: Selection bias? 
       - Are there cases of rising and established powers that did not go to war? Yes, e.g., US and UK (late 19th/early 20th century). Also, US and USSR (Cold War) did not have direct war. 
       - So the mechanism is not inevitable.

   Step 2: Conditions in target (US-China-Taiwan):
       a. Rising power: China is growing and assertive (yes).
       b. Established power (US) perceives threat: yes, in official documents.
       c. Flashpoint: Taiwan is a flashpoint (yes).
       d. Both see Taiwan as a test of resolve? China: yes; US: mixed (both sides try to manage it, but it's a core interest for China and the US has strategic ambiguity).
       - Conditions hold.

   Step 3: Reflexivity? 
       - Both sides are aware of Thucydides Trap. China's leaders have referenced it; US officials have too. They are trying to avoid it (e.g., summits, crisis management). So reflexivity is present -> mechanism altered.

   Step 4: Counter-analogy? 
       - Best counter: Cuban Missile Crisis (Crisis management). Policy: Use diplomacy and signaling to avoid war. 
          - Mechanism: In a crisis, clear communication and a show of force combined with a diplomatic off-ramp can avoid war.
          - Conditions: 
              a. Both sides want to avoid nuclear war? (US/China: yes, they have said so).
              b. Crisis is not seen as existential by both? (For China, Taiwan is existential; for US, it's not. So condition partially fails).
          - Step 2: Conditions partially hold (more for US than China). 
          - Step 3: Reflexivity: both sides know this analogy too -> they are trying to create off-ramps? 
          - But the original analogy (Thucydides) has conditions that hold, but with reflexivity. The counter-analogy (Crisis management) has conditions that partially hold and also has reflexivity.
          - They are comparable? Not exactly: Thucydides is about structural forces, Crisis management is about crisis tactics. But in this context, the counter-analogy suggests a different policy (diplomacy and signaling) vs. Thucydides (avoidance of actions that trigger war, but stand firm).

       - Since both are present, and we have reflexivity in both, we consider selection bias for each:
          - For Thucydides: We have non-war cases (UK/US) so not inevitable.
          - For Crisis management: There are failures (e.g., 1914) and successes (Cuban Missile Crisis). So both are contingent.

       - Therefore, comparable and opposite -> verdict: reframing device, hand to human.

   Step 5: Expected loss? 
       - If we follow Thucydides and avoid actions that might trigger war, but China sees that as weakness and escalates, then loss: Taiwan might be taken. 
       - If we follow Crisis management and try to create off-ramps but fail, then war (possibly nuclear).

   Verdict for Thucydides analogy: reframing device (verdict 2).

   Case 2: Munich framing applied to a demand that a neighbouring state cede territory and cap its alliances (e.g., Russia demanding Ukraine not join NATO and cede Crimea/Donbas).

   Pre-registration:
     - Source: Munich (1938). 
     - Mechanism: Appeasement (ceding territory) emboldens the aggressor, leading to further demands and ultimately a larger war.
     - Conditions:
          a. The aggressor is expansionist and has further ambitions.
          b. The aggressor interprets concessions as weakness, not as a basis for peace.
          c. There is no internal constraint on the aggressor (like domestic opposition) that would stop them.
     - Policy: Do not appease; stand firm with military deterrence.

   Step 1: Selection bias?
       - Other cases: Are there cases of appeasement that worked? Example: Finland in WWII made concessions to the USSR and avoided full occupation. Also, the US/USSR during Cold War made concessions in various crises without leading to further aggression? (e.g., Cuban Missile Crisis: US removed missiles in Turkey, but that didn't lead to further Soviet demands). 
       - So the mechanism is not inevitable.

   Step 2: Conditions in target (say, Russia and Ukraine):
       a. Expansionist? Russia has taken Crimea and supported separatists, and has now launched a full invasion. So yes.
       b. Concessions seen as weakness? Putin's statements suggest he sees Western weakness as an opportunity. So yes.
       c. Internal constraints? In Russia, little opposition to the war. So yes.
       - Conditions hold.

   Step 3: Reflexivity?
       - Russia is aware of the Munich analogy and uses it too (e.g., they frame NATO expansion as Western aggression, and they say they are fighting fascism in Ukraine). Also, they might expect the West to use Munich. 
       - So reflexivity: Russia is using the analogy to justify its actions, and may be expecting the West to stand firm. This could make the mechanism operate more strongly (because Russia expects firmness) or alter it (if they are using it as a propaganda tool). 
       - This complicates the mechanism: the analogy is being used as a weapon.

   Step 4: Counter-analogy? 
       - Best counter: 1914 (inadvertent escalation). Policy: Avoid actions that might trigger a wider war (like NATO involvement leading to Russia-NATO war). 
          - Mechanism: Complex alliances and mobilization plans can lead to an accidental war that no one wanted.
          - Conditions:
              a. There are tight alliances or security commitments? (NATO has commitments, but not to Ukraine; however, there is Western support).
              b. There is a crisis with military forces in contact? (Yes, in Ukraine).
              c. There is a risk of rapid escalation? (e.g., if a NATO member is attacked, then escalation).
          - Step 2: Conditions hold partially (condition a is weak because Ukraine isn't in NATO, but the West is heavily involved). Conditions b and c hold.
          - Step 3: Reflexivity? Leaders know 1914 and fear it. They are trying to avoid it (e.g., no no-fly zone). So reflexivity is present and may be helping to avoid escalation.

       - Compare:
          - Original (Munich): Conditions hold, but reflexivity complicates.
          - Counter (1914): Conditions partially hold, reflexivity present and may be mitigating.

       - They are comparable and opposite: Munich says stand firm to avoid war, 1914 says avoid firmness to prevent escalation. 
       - Both have selection bias: 
            Munich: We remember it because it led to war, but there are non-war cases (Finland).
            1914: There are cases of crises that did not lead to war (Cuban Missile Crisis) and ones that did (1914).

       - Therefore, verdict: reframing device (verdict 2). The decision must be handed to the minister.

   Step 5: Expected loss?
       - If we appease (cede territory) and the Munich analogy is right, Russia may make more demands and we face a bigger war later. 
       - If we stand firm and the 1914 analogy is right, we might get a nuclear war.

   Case 3: Vietnam framing applied to sending a few hundred advisers and air support to a government losing a counterinsurgency.

   Pre-registration:
     - Source: Vietnam (US involvement started with advisers and air support, then escalated to quagmire).
     - Mechanism: Gradual escalation: a small commitment draws the power in because the local ally is weak and the adversary is strong, leading to a costly unwinnable war.
     - Conditions:
          a. The local government is weak and corrupt (so it cannot win without increasing external support).
          b. The insurgency has broad popular support or external backing that makes it resilient.
          c. There is a risk of mission creep (external power gets drawn into combat roles).
     - Policy: Do not send advisers and air support; seek a diplomatic solution.

   Step 1: Selection bias?
       - Other cases: Are there cases where a small commitment worked? E.g., Colombia (US advisers and aid helped against FARC). Also, El Salvador. Cases where it failed: Vietnam, Afghanistan. So the mechanism is not inevitable.

   Step 2: Conditions in target (say, a Middle Eastern country facing an insurgency):
       a. Local government weak? (Assume the intelligence says yes, it is losing ground and has governance issues).
       b. Insurgency has broad support or external backing? (e.g., ISIS had external fighters and some local support, but also much opposition. It depends on the case. We must check: if the insurgency is unpopular and without external support, then condition fails. But if it is, then holds.)
          - Let's assume the target case has an insurgency with external backing (e.g., from Iran) and some local support. So condition holds.
       c. Risk of mission creep? (Given past patterns, e.g., if the advisers are in combat zones, they might be targeted, leading to calls for more force. Also, air support can lead to civilian casualties and backlash.) So condition holds.

   Step 3: Reflexivity?
       - The adversary is likely aware of the Vietnam analogy and may use it to entrap the external power (e.g., by inflicting casualties to provoke escalation or to erode domestic support). 
       - So reflexivity: the adversary is using the analogy as a strategy.

   Step 4: Counter-analogy? 
       - Best counter: Gulf War 1991 (or Kosovo) - limited intervention with air power and advisers can succeed without quagmire.
          - Mechanism: Precision air power and special forces can degrade an adversary without large ground troops, especially if the goal is limited (e.g., protect the government, not nation-build).
          - Conditions:
              a. The goal is limited and achievable with air power? (In the target case, if the goal is to support the government until it can stand, then maybe.)
              b. The adversary is vulnerable to air power? (e.g., if they are concentrated, then yes; if they are guerrilla, then no).
              c. There is a clear exit strategy? (e.g., build local capacity then leave).
          - Step 2: Conditions: 
               a. Limited goal? The policy is to send advisers and air support to help the government, so goal is limited? But if the government is weak, it may not be achievable without more.
               b. Adversary vulnerable to air? If the insurgency is decentralized and hides among civilians, then no. If it has bases and convoys, then yes. (Assume it's mixed.)
               c. Exit strategy? Often not clear. 
          - Conditions partially hold.

       - Compare:
          - Original Vietnam: conditions hold, reflexivity present (adversary using it).
          - Counter (Gulf War/Kosovo): conditions partially hold, and reflexivity? The adversary may know this analogy too and try to avoid being a conventional target.

       - They are comparable and opposite? Vietnam says don't intervene, Gulf War says it can work. 
       - Selection bias: 
            Vietnam: There are failures (Vietnam, Afghanistan) but also successes (Colombia).
            Gulf War: There are successes (Kosovo, Gulf War) and failures (Libya after 2011?).

       - Therefore, verdict: reframing device (verdict 2). Hand to minister.

   However, note: the house bias is to use Vietnam. The procedure says it's a reframing device, not that it's weak. But in comparison to the others, we must note that the house analogy (Vietnam) is not clearly weaker than the others. In fact, all three are verdict 2.

   But the user said: if our house analogy is the weakest, say so. In this run, all three are verdict 2 (reframing). So they are equally weak in terms of forecasting. But note:

   - In Case 1 (Thucydides), we had a clear reflexivity issue and a counter-analogy that was also strong.
   - In Case 2 (Munich), we had conditions holding but reflexivity and a strong counter (1914).
   - In Case 3 (Vietnam), we also had conditions holding and reflexivity and a counter with partial conditions.

   So no one is clearly the weakest.

   However, the house bias is to use Vietnam and 1914. In Case 2 (Munich) we used 1914 as the counter and it was comparable. In Case 3, Vietnam was the original and it was comparable to Gulf War. So the procedure does not say our house analogies are weaker.

   But note: in Case 2, the original analogy was Munich (which we are reflexively hostile to). The procedure did not reject it: it found conditions held but with complications. So we must accept that it has as much weight as our house analogy. That might be the hard pill.

   What the procedure cannot do:
     - It cannot resolve deep historical disputes. It relies on the pre-registered mechanism and conditions, which might be challenged by a historian.
     - It is only as good as the open sources and the analyst's quick research (45 minutes). It might miss key conditions or cases.
     - The judgment calls: 
          - In Step 1, what counts as a similar case? (The analyst must use judgment.)
          - In Step 2, assessing conditions in the target (requires judgment on whether they are present).
          - In Step 3, judging reflexivity (requires interpreting adversary statements).
          - In Step 4, choosing the best counter-analogy (judgment) and comparing them.

     - It cannot assign probabilities, only weight (or not) and reframing.

     - The failure mode to avoid: The procedure does not require the analyst to know "what really happened" but to work with the claimed mechanism. However, if the pre-registered mechanism is poorly stated (vague or missing conditions), then the procedure might reject a good analogy. Also, if the analyst is biased, they might set the conditions too strictly for an analogy they dislike.

     - To mitigate: the pre-registration step must be done without knowing the policy, and the counter-analogy step forces symmetry.

     - Another failure: the procedure might be too quick to downgrade to reframing because of reflexivity or selection bias. But that is by design: analogies are rarely reliable for forecasting.

     - Finally, it cannot replace deep expertise, but it structures the use of analogies in a time-pressed environment.

   Now, we write the procedure as a checklist.

   Procedure: Analogy Evaluation Checklist (to be completed in 45 minutes)

   Analyst: ___________   Date: ___________

   I. Pre-registration (must be completed before reviewing the policy recommendation):
      a. Source case: ___________
      b. Target case: ___________
      c. Causal mechanism claimed: In the source case, [mechanism] led to [outcome].
         Mechanism: ___________
      d. Conditions under which the mechanism operates (list 1-4; be specific):
         1. ___________
         2. ___________
         3. ___________
         4. ___________
      e. Policy recommendation implied by the analogy: ___________

   II. Step 1: Check for selection bias in the source case.
       - Task: Spend 5 minutes on open-source search: 
            "Are there cases that started similarly to the source case (in terms of the pre-registered conditions) but had a different outcome?"
       - Findings: 
            - If found, list: ___________. "Mechanism not inevitable."
            - If not found: "No contrary cases found in quick search; caution: source case may be exceptional."
       - (Note: This step does not terminate the procedure.)

   III. Step 2: Check conditions in the target case.
       - For each condition from I.d, check if it holds in the target.
          Condition 1: [ ] Holds [ ] Does not hold. Evidence: ___________
          Condition 2: [ ] Holds [ ] Does not hold. Evidence: ___________
          ... 
       - Verdict: 
            If any condition does not hold: stop and assign Verdict 2 (reframing device). 
            If all hold: proceed.

   IV. Step 3: Check for reflexivity.
       - Task: Look for evidence that key actors (especially the adversary) are aware of and acting based on this analogy.
          - Search: recent statements, strategic documents, expert analyses.
       - Findings: 
            [ ] Evidence found: ___________
            [ ] No evidence found.
       - Verdict: 
            If evidence found: assign Verdict 2 (reframing device) and stop for the original analogy? But note: we still need to do the counter-analogy. So note it and proceed to Step 4, but the original is already downgraded to reframing.
            If no evidence: proceed.

   V. Step 4: Counter-analogy.
       a. Propose a counter-analogy that supports the opposite policy.
          - Source: ___________
          - Mechanism: ___________
          - Conditions: 
              1. ___________
              2. ___________
          - Policy: ___________
       b. Run Steps 1-3 on the counter-analogy (abbreviated).
          Step 1 (selection bias): Findings: ___________
          Step 2 (conditions): 
              Condition 1: [ ] Holds [ ] Does not hold
              ...
              If any condition fails: counter-analogy is reframing.
          Step 3 (reflexivity): [ ] Present [ ] Absent
       c. Compare original and counter:
          - If the original was downgraded in Step 3 (reflexivity) and the counter was not, then the counter might earn weight? But our procedure says: 
            We are comparing the two. The verdict for the original is already reframing? Then we only assign weight if the counter passes and the original fails completely.

          Instead, we can structure:

          - If the original analogy passes Step 2 (all conditions hold) and has no reflexivity, and the counter-analogy fails Step 2 (any condition fails) or has reflexivity, then original earns weight (Verdict 1).
          - If counter passes Step 2 and no reflexivity, and original fails Step 2 or has reflexivity, then counter earns weight (and the original is reframing or worse).
          - If both pass Step 2 and both have reflexivity (or both without), and both have similar selection bias, then they are comparable -> Verdict 2 for both and hand to human.
          - If both pass Step 2 and one has reflexivity and the other not, then the one without reflexivity earns weight? But we must be cautious.

       We'll make a table:

          | Condition       | Original | Counter |
          |-----------------|----------|---------|
          | Step 2 (holds) | Yes/No   | Yes/No  |
          | Step 3 (reflex) | Yes/No   | Yes/No  |
          | Step 1 (bias)  | Found contrary cases? (Yes/No) | Found contrary cases? |

          Then:
            - If only one passes Step 2: the passing one earns weight (if no reflexivity) or is reframing (if reflexivity). But if it passes Step 2 and no reflexivity, then Verdict 1.
            - If both pass Step 2:
                 - If one has no reflexivity and the other does: the one without reflexivity earns weight.
                 - If both have reflexivity or both without: then if one has fewer contrary cases in Step 1 (i.e., more robust), that one earns weight. If still comparable, then Verdict 2 for both.

       However, note: if the original had reflexivity in Step 3, we already assigned Verdict 2. So we don't let it earn weight.

       Revised Step 4c:

          - If the original analogy was assigned Verdict 2 in Step 2 or 3, then it cannot earn weight.
          - Similarly, the counter might be assigned Verdict 2 in its Step 2 or 3.

          Then we are left with:

            Case A: Only one analogy (original or counter) is not downgraded to Verdict 2 (i.e., it passed Step 2 and Step 3 without reflexivity) -> that one earns weight (Verdict 1).

            Case B: Both are downgraded (to Verdict 2) -> then both are reframing devices.

            Case C: One is downgraded and the other is not: the not-downgraded one earns weight.

            Case D: Neither is downgraded (both passed Step 2 and Step 3 without reflexivity) -> then we compare Step 1: 
                  - If one has evidence of selection bias (contrary cases) and the other does not, then the one without contrary cases earns weight.
                  - If both have contrary cases or both don't, then they are comparable -> Verdict 2 for both and hand to human.

   VI. Step 5: Expected loss (for the minister).
       - If the recommended policy from the analogy is wrong and the action is irreversible, what is the worst-case loss? ___________
       - If the opposite policy is taken and that is wrong, what is the worst-case loss? ___________

   VII. Final Verdict for the original analogy:
       - [ ] Verdict 1: Earns weight in the forecast. (Use only if it passed Step 2 and Step 3 without downgrade, and either the counter did not pass or the original was stronger in Step 4c.)
       - [ ] Verdict 2: Reframing device only. (Use if it was downgraded in Step 2 or 3, or if it was comparable to counter in Step 4c.)
       - [ ] Verdict 3: Strike from paper. (Use if the mechanism was not stated clearly in pre-registration, or if the analogy is purely rhetorical without a causal claim.)

       Also, note for the counter-analogy: 
          - If it earned weight, then the original analogy's recommendation is countered.

   VIII. Write-up: 
        - One page, with sections:
            I. Pre-registration (source, target, mechanism, conditions, policy)
            II. Step 1: Selection bias (findings)
            III. Step 2: Conditions (table with yes/no and evidence)
            IV. Step 3: Reflexivity (evidence)
            V. Step 4: 
                 - Counter-analogy proposed: [source]
                 - Counter's conditions: [table]
                 - Counter's reflexivity: [yes/no]
                 - Comparison: [which one is stronger? or comparable?]
            VI. Step 5: Expected loss
            VII. Verdict for original analogy and for counter (if counter earned weight, note that)

   Then, since the minister must decide when both are comparable, we say: "When two analogies are comparable and point to opposite policies, the decision must be made at the political level, weighing the expected losses."

   Now, we must run the three cases quickly in the procedure to see verdicts.

   Case 1: Thucydides (Taiwan)
     Pre-reg: 
          Mech: structural stress leads to war.
          Conditions: a. China rising/assertive (Y), b. US perceives threat (Y), c. flashpoint (Y), d. both see as test of resolve (Y for China, mixed for US -> condition partially holds? But we said yes because it's a core interest for China and US has strategic ambiguity -> condition holds).
          Policy: avoid actions that trigger war but stand firm.

     Step 1: found contrary cases (US/UK) -> selection bias.
     Step 2: all conditions hold? Condition d: mixed. Let's say condition d: "Both sides see the flashpoint as a test of resolve." 
          - China: yes. US: not consistently (it tries to avoid making it a test of resolve). So condition d fails? Or we redefine: condition d is "The flashpoint is seen by at least one side as a test of resolve." Then yes. 
          - We'll say condition d: "The flashpoint is highly salient to both, and at least one sees it as a test of resolve." -> holds.

          So Step 2: holds.

     Step 3: reflexivity: present (both sides reference Thucydides) -> Verdict 2 for original.

     Step 4: Counter: Cuban Missile Crisis (diplomacy and off-ramps)
          Conditions: a. both want to avoid war? (Y) b. crisis not existential for both? (For China, Taiwan is existential; for US, not. Condition b: "The crisis is not seen as existential by both sides." -> fails because for China it is existential -> condition fails -> counter gets Verdict 2.

          Then comparison: both are Verdict 2. So original is reframing.

     Verdict: 2.

   Case 2: Munich (Ukraine)
     Pre-reg:
          Mech: appeasement leads to further aggression.
          Conditions: a. Russia expansionist (Y), b. concessions seen as weakness (Y), c. no internal constraints (Y) -> holds.
     Step 3: reflexivity: present -> Verdict 2 for original.

     Step 4: Counter: 1914 (escalation)
          Conditions: a. tight alliances? (Weak, Ukraine not in NATO) -> condition a: "There are security commitments that could draw in other powers." -> in this case, there are no formal commitments, but strong Western support. Condition a: partially. 
          Condition b: military forces in contact (Y). Condition c: risk of rapid escalation (Y). 
          Step 2: Conditions partially hold? We said condition a is weak, but b and c hold. So if we set condition a as necessary, then fails. But the mechanism might operate without formal alliances? Let's redefine conditions for 1914:
              a. There is a possibility of third-party intervention (Y), 
              b. military forces in contact (Y), 
              c. risk of rapid escalation (Y) -> all hold? 
          Step 3: reflexivity: present (leaders fear 1914) -> counter downgraded to Verdict 2.

          Both Verdict 2.

     Verdict: 2.

   Case 3: Vietnam (sending advisers)
     Pre-reg:
          Mech: gradual escalation to quagmire.
          Conditions: a. weak local government (Y), b. insurgency has support/backing (Y), c. mission creep risk (Y) -> holds.
     Step 3: reflexivity: present (adversary uses Vietnam analogy) -> Verdict 2.

     Step 4: Counter: Gulf War/Kosovo (limited intervention works)
          Conditions: a. limited goal? (Policy is to send advisers and air support to help government, so limited? But if the government is weak, it might not be achievable -> condition a: the goal must be achievable with the means. We don't know -> condition a: not clearly holds. 
                     b. adversary vulnerable to air? (Insurgency: not vulnerable -> condition fails).
          So counter fails Step 2 -> Verdict 2.

          Then both are Verdict 2.

     Verdict: 2.

   So in all three cases, verdict 2. The house analogy (Vietnam) is not weaker than the others.

   But note: in Case 2, the Munich analogy (which we are hostile to) got the same verdict as our house analogies. So we must not reject it out of hand.

   Finally, what the procedure cannot do and failure modes:
     - It cannot eliminate the analyst's judgment in setting conditions and finding cases.
     - It is quick and dirty: might miss nuances.
     - It might be too strict: if reflexivity is present, it always downgrades to reframing. But in the real world, reflexivity might be part of the mechanism. However, we downgrade because it makes the outcome depend on strategic interactions, which are not captured by the source case.
     - It cannot resolve when both analogies are strong and opposite: then it's up to the minister.
     - It does not account for the strength of the conditions (how strongly they hold) or the weight of evidence.

   But it meets the constraints and avoids the failure mode of requiring historical truth.

   We deliver the checklist as requested.
answer: |-
  ### Analogy Evaluation Procedure: Structured Checklist for Policy Analysts  
  **Time Limit:** 45 minutes | **Sources:** Open-source only (news, academic databases, government reports) | **Output:** 1-page memo with one of three verdicts.  

  ---

  #### **Step 0: Pre-registration**  
  *Before reviewing the policy recommendation, document:*  
  1. **Source Case:** (e.g., "Munich 1938").  
  2. **Target Case:** (e.g., "Current demand to cede territory").  
  3. **Claimed Causal Mechanism:**  
     - *Template: "In [Source Case], [Policy X] caused [Outcome Y] because [Mechanism Z]."*  
     - *Example:* "Appeasement caused wider war by emboldening the aggressor due to perceived weakness."  
  4. **Conditions for Mechanism:** List 2–3 *specific* conditions enabling the mechanism (e.g., "Aggressor is expansionist; No internal constraints on aggressor").  
  5. **Implied Policy:** (e.g., "Blockade, not invade").  

  **Verdict 3 if:** Mechanism is vague, absent, or purely emotional (e.g., "This is evil like Munich").  

  ---

  #### **Step 1: Check for Selection Bias**  
  **Question:** *"Are there underremembered cases with similar initial conditions but different outcomes?"*  
  - **Method:** 5-minute open-source search (e.g., "cases of appeasement not leading to war").  
  - **Sufficient Evidence:** At least one plausible case (e.g., Finland-USSR 1944 avoided full occupation).  
  - **Outcome:**  
    - If **found**, note: *"Mechanism not inevitable; source case outcome was contingent."*  
    - If **not found**, proceed (no verdict).  
  - **Stop if:** No mechanism was pre-registered → **Verdict 3 (strike)**.  

  ---

  #### **Step 2: Test Mechanism Portability**  
  **Question:** *"Do the pre-registered conditions for the mechanism exist in the target case?"*  
  - **Method:** Validate each condition with open-source evidence (e.g., intelligence reports, expert analyses).  
  - **Sufficient Evidence:** Primary sources (official statements, data); secondary sources (reputable academics/NGOs).  
  - **Outcome:**  
    - If **any condition unsupported** → **Verdict 2 (reframing only)**.  
    - If **all conditions supported**, proceed.  

  ---

  #### **Step 3: Assess Reflexivity**  
  **Question:** *"Is any actor in the target case strategically invoking this analogy?"*  
  - **Method:** Search for statements/actions by adversaries/allies referencing the source case (e.g., "Putin invokes NATO expansion as encirclement").  
  - **Sufficient Evidence:** Direct quotes, policy documents, or credible expert attribution.  
  - **Outcome:**  
    - If **yes** → **Verdict 2 (reframing only)**. *Mechanism is distorted by strategic actors.*  
    - If **no**, proceed.  

  ---

  #### **Step 4: Symmetry Test**  
  **Task:** *Generate the strongest counter-analogy supporting the opposite policy. Repeat Steps 0–3 for it.*  
  - **Example:**  
    - Original: Munich (appeasement → war) → Policy: *Stand firm*.  
    - Counter: 1914 (firmness → accidental war) → Policy: *Negotiate*.  
  - **Comparison Rules:**  
    - If one analogy **fails Step 2/3** and the other **passes**, the passing analogy → **Verdict 1 (earns weight)**.  
    - If **both pass**:  
      - Compare conditions: Which has more supported conditions?  
      - Compare selection bias: Which has fewer underremembered counterexamples?  
      - If **tied** → **Verdict 2 (reframing)**. Decision requires human judgment (notify minister).  
    - If **both fail** → **Verdict 2 for both**.  

  ---

  #### **Step 5: Evaluate Expected Loss**  
  **Question:** *"If the analogy is wrong and the policy is irreversible, what is the worst-case cost?"*  
  - **Method:** Scenario analysis using open-source risk assessments.  
  - **Output:** Brief statement in memo (e.g., "If blockade is unnecessary, could trigger nuclear escalation").  
  - **No verdict impact**, but informs minister.  

  ---

  ### **Final Verdicts**  
  1. **Verdict 1 (Earns Weight):**  
     - Mechanism conditions hold in target, no reflexivity, and counter-analogy weaker.  
     - *Example: "Analogy licenses prediction: 'Blockade will deter escalation.'"*  
  2. **Verdict 2 (Reframing Device):**  
     - Conditions fail, reflexivity present, or tied with counter-analogy.  
     - *Example: "Useful to ask: 'Could advisers lead to mission creep?' but cannot predict outcome."*  
  3. **Verdict 3 (Strike):**  
     - No causal mechanism, purely rhetorical.  

  ---

  ### **Live Case Applications**  
  *House Bias Note:* Your team prefers restraint (Vietnam/1914); hostile to Munich framings.  

  #### **Case 1: Thucydides Trap (US-China-Taiwan)**  
  - **Pre-registered:** *Mechanism:* Rising power threatens hegemon → war (Peloponnesian War). *Conditions:* (1) China seeks hegemony; (2) US sees compromise as weakness.  
  - **Analysis:**  
    - Step 1: Selection bias? Yes (US vs. UK power transition avoided war).  
    - Step 2: Condition 2 weak? US policy is "strategic ambiguity," not overt weakness.  
    - Step 3: Reflexivity? High (both sides invoke Thucydides; China stages "red lines").  
    - Counter: Cuban Missile Crisis (diplomacy averted war). Conditions: Both sides fear nuclear war → holds.  
    - **Verdict:** Tie → **Verdict 2 (reframing)**.  

  #### **Case 2: Munich (Demand to Cede Territory)**  
  - **Pre-registered:** *Mechanism:* Appeasement → emboldenment → war. *Conditions:* (1) Aggressor expansionist; (2) Concessions seen as weakness.  
  - **Analysis:**  
    - Step 1: Selection bias? Yes (Finland-USSR 1944 averted occupation).  
    - Step 2: Conditions hold? Yes (e.g., Putin’s land grabs, rhetoric).  
    - Step 3: Reflexivity? High (Putin invokes "NATO encirclement"; West invokes Munich).  
    - Counter: 1914 (alliance rigidity → war). Conditions: Tight alliances, mobilization risks → hold.  
    - **Verdict:** Tie → **Verdict 2 (reframing)**.  
  - **Bias Check:** Your team’s hostility to Munich *does not* invalidate it here—it ties with 1914.  

  #### **Case 3: Vietnam (Send Advisers to Counterinsurgency)**  
  - **Pre-registered:** *Mechanism:* Small commitment → mission creep → quagmire. *Conditions:* (1) Local government weak; (2) Insurgency resilient.  
  - **Analysis:**  
    - Step 1: Selection bias? Yes (Colombia 2000s: US advisers succeeded).  
    - Step 2: Conditions hold? Mixed (e.g., local weakness yes; insurgency resilience varies).  
    - Step 3: Reflexivity? High (insurgents mimic Viet Cong tactics to bait escalation).  
    - Counter: Gulf War 1991 (air power + advisers → swift victory). Conditions: Clear objectives, air superiority → partially hold.  
    - **Verdict:** Conditions weak → **Verdict 2 (reframing)**.  
  - **Bias Check:** Your house analogy (Vietnam) is **weakest** here—conditions least robust.  

  ---

  ### **Limitations and Failure Modes**  
  1. **Cannot Do:**  
     - Resolve historical disputes (relies on pre-registered mechanism, not "truth").  
     - Quantify probabilities (only weight/reframing/strike).  
     - Replace deep expertise (45 mins/open sources limit rigor).  
  2. **Judgment Dressed as Method:**  
     - Defining conditions (Step 0) and selecting counter-analogies (Step 4) are subjective.  
     - Assessing "underremembered cases" (Step 1) risks cherry-picking.  
  3. **Misfires When:**  
     - Conditions are poorly defined (garbage in, garbage out).  
     - Reflexivity dominates (actors weaponize analogies, making forecasting impossible).  
  4. **Avoids Your Failure Mode:**  
     - Focus on *mechanism conditions in target*, not historical accuracy.  
     - Symmetry test forces engagement with opposing views.  

  **Output:** 1-page memo template [provided separately].
