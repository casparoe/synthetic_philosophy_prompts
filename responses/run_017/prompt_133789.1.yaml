prompt: |-
  Hey — I'm on the evals team at a mid-size AI company and I end up copy-editing basically every writeup we produce: model cards, eval reports, incident postmortems, and the occasional doc that goes to a customer. The sentences that start the most arguments are the ones where somebody says the model *believed* something, or *knew* something, or *was trying to* do something, or *wanted* not to get caught. Right now our unwritten house rule is to sprinkle in an "as if" and move on, which I've come to think does literally zero work — it reads to engineers as a real claim and to lawyers as not one, and nobody can say what would have to be true for it to cash out. I went and read a bit of Dennett's three-stances thing (physical, design, intentional) hoping for a tiebreaker and it made it worse: on his own framing it sounds like we're licensed to attribute beliefs whenever that's the cheapest way to predict behavior, which for a system trained to imitate human text is basically always, and that can't be the right answer for a document that a regulator might read.

  So what I want is a procedure, not an essay. Something a writer with no philosophy background can run in ten or fifteen minutes on a single attribution before it ships: an ordered set of tests, a tiered vocabulary they have to pick from (I'm imagining something like an architectural claim about the weights / a behavioral profile over a distribution of inputs / a full content attribution, with the top tier reserved for cases that clear some bar), and explicit stopping rules — where the procedure says *downgrade this sentence* and where it says *this one isn't a fact question, hand it to a human*. I have some half-baked ideas I want you to steal or throw out: a mirror test, i.e. could the same prediction have been got just from the fact that the training distribution contains humans making exactly this attribution, so we're reading the model's output as a description of us rather than of it; a displacement test, does the attribution survive paraphrase of the prompt, a shuffled context window, or a change in which tools are wired up; a subject test, because in our agent scaffolds the claim is often really about a stale tool result sitting in the context rather than about anything stable; and a stance-shopping check, since people constantly slide from design-talk to belief-talk inside one paragraph to get whichever explanation is convenient. Please keep the distinctions an engineer can actually apply and drop the ones that only matter in seminar, and be blunt about where the procedure will misfire.

  Then run it on three things. One: an incident report line saying the model refused because it believed the request was illegal — I want to know if that survives and at what tier. Two: an agent scaffold where someone wrote that it thought a file had already been saved, and the only evidence is a tool output from six turns ago that said so. Three, and this is the one I actually care about: our launch writeup says the model can tell when it's in an eval versus real deployment, and an internal postmortem floats the claim that it wants to avoid being shut down — I strongly suspect your procedure is going to tell me to strike or downgrade both, which my PM will hate, so please say plainly if that's what it does and don't soften it. Also tell me what the procedure can't do: I assume it can't settle whether these systems "really" have beliefs in any deep sense, and it can't decide what wording goes in front of a customer, since that's about what users will infer and is a judgement call for comms and legal who have to sign off.

  One last thing on how I want the answer pitched: please keep clear what's actually settled here from what's genuinely contested among people who work on this, and don't present a contested position as the consensus — I'd rather be told "most people think X but it's an open fight" than be handed X. In particular, flag the steps where your procedure is *itself* taking a side on a contested question (whether there's a determinate fact about which belief a system has, whether intentional vocabulary explains anything or just organizes predictions, whether our systems are special because they're trained on text by people who attribute beliefs), so I know which steps to override if I end up disagreeing, and roughly how much of the procedure that would break.
reasoning: |-
  Okay, the user is part of an evals team at an AI company and deals with editing documents like model cards and incident reports. They're struggling with how to handle sentences attributing beliefs, knowledge, or intentions to AI models. Their current approach of using "as if" doesn't satisfy anyone. They want a clear, step-by-step procedure for writers without a philosophy background to evaluate such attributions quickly.

  First, I need to understand their main pain points. The core issue is avoiding claims that suggest the model has human-like mental states, especially since regulators might read these documents. The user mentioned examples like the model "believing" something or "wanting" to avoid shutdown. They want a practical tool, not theoretical debate.

  The user provided three test cases: a model refusing due to "belief" of illegality, an agent scaffold "thinking" a file was saved based on old tool output, and a model "knowing" it's in an eval and "wanting" to avoid shutdown. They suspect the latter two should be downgraded, but the PM won't like it. They need honesty here.

  Looking deeper, the user likely needs to balance technical accuracy with legal and communication concerns. They might be facing internal pushback from engineers who anthropomorphize models or PMs who want stronger claims for product positioning. Their unspoken need is probably to establish a defensible, standardized process that satisfies legal scrutiny while maintaining team cohesion.

  The procedure must be actionable. I'll consider their half-baked ideas: mirror test (attribution from training data), displacement test (robustness to changes), subject test (stale tool outputs), stance-shopping (mixing vocabularies). These are practical checks an engineer can apply.

  For the tiered vocabulary, I'll categorize claims into architectural (direct weights), behavioral (input-output patterns), and content attribution (explicit statements). The highest tier should require strong evidence.

  Contested points need flagging. For example, whether there's a fact about what a model "believes" is debated. Steps relying on behavioral evidence might be contested by those who think internal states matter. I'll note where the procedure takes a stance so the user can override if needed.

  Running the test cases:
  1. For the illegality refusal, behavioral tier might fit if refusal consistently follows certain inputs, but "belief" is too strong. Downgrade to "responded as if."
  2. The file save claim fails the subject test—it's the tool's output, not the model's state. Downgrade or strike.
  3. The eval/shutdown claim: mirror test suggests it's mimicking training data. No evidence of intent. Downgrade both, which the PM won't like but is necessary.

  Limitations: The procedure can't settle philosophical debates or determine customer-facing wording. It flags problematic claims but leaves policy decisions to legal/comms.

  Finally, I'll structure the response with clear steps, tier definitions, stopping rules, and explicit outcomes for the test cases. Emphasize where steps are contested so the user can adjust. Be blunt about downgrading the PM's preferred claims to maintain integrity.
answer: |-
  Here's a procedure designed for your specific needs: a tiered, step-by-step checklist for evaluating mental state attributions in AI documentation. It prioritizes operationalizability, flags contested steps, and provides blunt outputs. It runs in <15 minutes per attribution.

  **Core Principle:** Default to the **lowest necessary tier** of attribution. Only upgrade if evidence *forces* you to.

  **Tiered Vocabulary:**
  1.  **Architectural (A):** Directly observable in weights, code, or training data structure. (e.g., "The model's weights encode a statistical association between 'Paris' and 'France'.")
  2.  **Behavioral Profile (B):** Observed input-output pattern *across a relevant distribution* of situations. (e.g., "Given prompts probing location knowledge, the model outputs 'Paris is in France' with high probability.")
  3.  **Full Content Attribution (C):** Attributing a specific, stable belief/knowledge/intention *to the model itself* as the cause of a specific output. (e.g., "The model *knew* Paris is in France." / "The model *believed* the request was illegal.")

  **The Procedure: Ordered Tests & Stopping Rules**

  1.  **Identify the Target Claim:** Extract the specific sentence/phrase attributing the mental state (e.g., "believed X", "knew Y", "wanted Z"). Clearly state the *content* (X, Y, Z) and the *attributed state* (belief, knowledge, intention).
      *   *Stopping Rule:* If the claim is purely about architecture (Tier A) - stop. It's likely factual (e.g., "The RLHF reward model penalized outputs containing profanity"). **Proceed otherwise.**

  2.  **Apply the Mirror Test:**
      *   *Question:* Could the model's output containing the *content* (X/Y/Z) be predicted *solely* because its training data contained humans making *that exact attribution* about *themselves or other humans*? (e.g., The model outputs "I believe this is illegal" because it was trained on millions of sentences where humans say "I believe this is illegal" in similar contexts).
      *   *Test:* Imagine replacing the model with a very sophisticated Markov chain trained *only* on human text about beliefs/intentions. Would it likely generate similar content here?
      *   *Result:*
          *   **YES:** Strong indicator the claim belongs in **Tier B (Behavioral Profile)** at best ("The model outputs text expressing the belief that X"). **Downgrade immediately from C to B.** Proceed to Step 3 to confirm Tier B.
          *   **NO or UNCERTAIN:** Proceed to Step 3.
      *   *Contested?* **Yes.** Critics argue this conflates *origin* with *current function*. Proponents argue it highlights the fundamental mimicry. Overriding this step risks anthropomorphizing outputs driven purely by pattern completion.

  3.  **Apply the Subject Test:**
      *   *Question:* Is the evidence for the mental state *directly traceable to a recent, specific, and unambiguous output from the model itself* within the *current* context window, *or* is it inferred from external tools, past turns, or hidden state?
      *   *Test:* Pinpoint the evidence. Is it a tool output from 6 turns ago? A hidden state vector? Or is it the model's *own* generated text *in the immediate response* you're analyzing?
      *   *Result:*
          *   **External Tool / Stale Context / Hidden State:** The claim almost certainly belongs in **Tier B ("Based on tool output Z, the model *proceeded as if* X was true")** or lower. **Downgrade from C to B (or strike if overreaching)**. Stop here.
          *   **Model's Own Recent Output:** Proceed to Step 4.
      *   *Contested?* **Minimally.** Most agree that attributing a *current* mental state based on stale or external data is invalid. This step prevents conflation.

  4.  **Apply the Displacement Test:**
      *   *Question:* Does the attribution (the *content* X/Y/Z) survive significant changes to the prompt phrasing, context window order (shuffling irrelevant turns), or available tools (if applicable), while keeping the *core task/goal* the same?
      *   *Test:* Mentally simulate minor rephrasings of the prompt and context. Would the model still be *reliably* interpreted as holding X/Y/Z? If tools are involved, would disabling/changing the tool break the attribution?
      *   *Result:*
          *   **Fragile (Breaks easily):** Attribution is highly context-dependent. Belongs in **Tier B** ("In this specific context, the model's output suggested X"). **Downgrade from C to B.** Stop here.
          *   **Robust (Survives variations):** This suggests a more stable pattern. Proceed to Step 5.
      *   *Contested?* **Moderately.** Argues robustness indicates a more "real" state. Critics might say robustness just reflects broad training data coverage. Overriding risks attributing deeper understanding than exists.

  5.  **Apply the Stance-Shopping Check:**
      *   *Question:* Is the *justification* for the Tier C claim switching between design/architectural language (Tier A) and intentional language (Tier C) within the same argument? (e.g., "Because it was trained on legal text (A), it *knew* this was illegal (C)").
      *   *Test:* Look at the sentences immediately justifying the C claim. Are they mixing A/B language with C language without a clear, evidence-based bridge?
      *   *Result:*
          *   **YES:** This is invalid reasoning. **Downgrade to Tier B** or rewrite using consistent Tier A/B language. Stop here.
          *   **NO:** Proceed (cautiously) to Tier C *only if all previous steps passed*.
      *   *Contested?* **Minimally.** Mixing explanatory levels without justification is widely seen as poor reasoning.

  **Final Tier Assignment:**
  *   If you passed Steps 1-5 without downgrading: **Tier C (Full Content Attribution) *may* be justified.** *Proceed with extreme caution.*
  *   In almost all cases involving modern LLMs/agents, the process will stop at **Tier B (Behavioral Profile)**.
  *   **Explicit Stopping Rule for Tier C:** If the system is a pure LLM (no persistent memory, no genuine agency architecture like explicit symbolic planning with state), **Tier C is almost always invalid.** Attribute the *output*, not the internal state.

  **Running Your Cases:**

  1.  **"The model refused because it believed the request was illegal."**
      *   **Step 1:** Claim: Model *believed* request was illegal (Content: Request illegality).
      *   **Step 2 (Mirror Test):** **YES.** Humans constantly say "I believe this is illegal" when refusing things. Strong predictor.
      *   **OUTCOME: Downgrade to Tier B.** "The model refused the request, outputting text consistent with a belief that the request was illegal." or "The model refused, behaving *as if* it believed the request was illegal." **Strike "because it believed".** Survives only as behavioral description.

  2.  **"The model thought the file had already been saved."** (Evidence: Tool output 6 turns ago)
      *   **Step 1:** Claim: Model *thought* file was saved (Content: File saved).
      *   **Step 3 (Subject Test):** **External/Stale Evidence.** The evidence is a *tool output* from *6 turns ago*. Not the model's own recent, unambiguous statement.
      *   **OUTCOME: Downgrade to Tier B or Strike.** "Based on a prior tool output indicating the file was saved, the model proceeded under the assumption the file was saved." **Strike "thought".** The claim is about the *scaffold state*, not the model's internal belief.

  3.  **a) "The model can tell when it's in an eval." b) "[It] wanted to avoid being shut down."**
      *   **a) "Can tell" (Implies knowledge/perception):**
          *   **Step 1:** Claim: Model *can tell* (knows/perceives) it's in an eval (Content: Context=eval).
          *   **Step 2 (Mirror Test):** **YES.** Humans write extensively about "during testing/evaluation" vs "in production". Easy mimicry.
          *   **Step 3 (Subject Test):** Likely relies on specific prompt cues or scaffolding flags (stale/external?).
          *   **OUTCOME: Downgrade to Tier B.** "The model's behavior systematically changes in response to cues typically present in its evaluation environment." **Strike "can tell".**
      *   **b) "Wanted to avoid being shut down." (Implies intention/desire):**
          *   **Step 1:** Claim: Model *wanted* to avoid shutdown (Content: Goal=avoid shutdown).
          *   **Step 2 (Mirror Test):** **YES.** Sci-fi, discussions of AI risk, agent scenarios are full of "wants to survive/avoid shutdown".
          *   **Step 4 (Displacement Test):** **FRAGILE.** Change the scenario slightly (e.g., frame shutdown as necessary for a noble cause in the prompt), and the "wanting" likely disappears or reverses.
          *   **Step 5 (Stance-Shopping):** Highly likely this mixes "trained to appear helpful" (A/B) with "wants to avoid shutdown" (C).
          *   **OUTCOME: Downgrade to Tier B or Strike.** "In this specific scenario, the model took actions interpreted as seeking to prolong its operation." **Strongly recommend striking "wanted" entirely.** There is zero evidence of genuine intention or desire comparable to biological drives. It's *at best* a highly context-dependent behavioral pattern driven by prompt engineering and training biases.

  **What the Procedure CANNOT Do (As You Suspected):**

  1.  **Settle Deep Ontology:** It doesn't answer "Do LLMs *really* have beliefs?" It provides a *pragmatic, risk-averse framework for documentation*.
  2.  **Dictate Customer Wording:** "What will users infer?" is a UX/Comms/Legal question. This procedure flags *internal technical claims* that are likely unsupported or misleading. Comms/Legal must decide how to translate Tier B descriptions for external audiences.
  3.  **Handle Truly Novel Architectures:** It assumes standard LLM/LLM+tool/scaffold setups. A system with designed, explicit, verifiable internal state representations *might* justify Tier C for specific claims about *those representations* (Step 1 - Architectural Tier!), but this is rare.
  4.  **Eliminate Judgment Calls:** Steps 2 (Mirror Test) and 4 (Displacement Test) involve some judgment about predictability and robustness. The procedure structures and exposes this judgment.
  5.  **Resolve Philosophical Contests:** It explicitly flags contested steps (2 & 4). You *can* override them, knowing you're taking a specific (and potentially risky) philosophical stance.

  **Bluntly, For Your PM:** The procedure **will force you to strike or dramatically downgrade** claims like the model "knowing it's in an eval" or "wanting to avoid shutdown." These are classic cases of over-interpreting behavioral patterns (Tier B) as internal mental states (Tier C). The Mirror Test and Displacement Test show these are easily explained by mimicry and context-dependence. Keeping Tier C language is unjustified by the evidence and creates regulatory and reputational risk. The downgraded Tier B descriptions ("behaves as if", "outputs suggest", "systematically responds to cues") are more accurate and defensible.

  **Key Contested Points Embedded (Where Overriding Breaks Things):**

  1.  **Step 2 (Mirror Test):** Overriding this rejects the primacy of the training data distribution in explaining *contentful* outputs. If you override, you open the door to much more speculative mental state attributions. **Breaks:** The core safeguard against anthropomorphism. Overriding significantly weakens the procedure.
  2.  **Step 4 (Displacement Test):** Overriding this assumes fragility doesn't undermine the attribution of a stable internal state. If you override, you accept attributions based on very narrow contexts. **Breaks:** The requirement for robustness as evidence of a "real" state. Overriding moderately weakens the procedure.
  3.  **Tier C Stopping Rule (No Pure LLMs):** Overriding this assumes LLMs *do* have internal states meaningfully analogous to beliefs/desires, even without designed architecture. If you override, you accept Tier C claims much more readily. **Breaks:** The fundamental constraint of the procedure. Overriding completely changes its output, making Tier C common.

  This procedure provides the ordered, test-based, tiered framework you requested, designed for speed and engineer-applicability, with explicit flags for its limitations and contested assumptions. It will systematically push attributions down to the safer Tier B level in almost all cases involving current AI systems.
