  However, the student says: "if I see $600 I keep it". This is incorrect.

  But the student's reasoning about the hypotheses: "it's far more likely to be the top of a pair than the bottom of one" — let's check the posterior probabilities:

     P(H_s | a=600) = g(600) / [g(600) + g(300)] 
          = 0.0006024 / (0.0006024 + 0.0010976) ≈ 0.0006024 / 0.0017 ≈ 0.354
     P(H_l | a=600) = g(300) / [g(600) + g(300)] ≈ 0.0010976 / 0.0017 ≈ 0.646

  So indeed, it is more likely that we hold the larger envelope. However, the expected gain from switching is:

     E[gain] = a * P(H_s) - (a/2) * P(H_l) 
              = 600 * 0.354 - 300 * 0.646 
              ≈ 212.4 - 193.8 = 18.6 > 0

  So even though it's more likely that we hold the larger envelope, the potential gain (if we are holding the smaller) of $600 outweighs the potential loss (if we are holding the larger) of $300. Hence, the expected gain is positive.

