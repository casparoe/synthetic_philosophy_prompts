     g(a) = (1/500) * exp(-a/500)
     g(a/2) = (1/500) * exp(-a/(1000))
  So the condition becomes:
     (1/500) * exp(-a/500) > (1/2) * (1/500) * exp(-a/(1000))
  Divide both sides by (1/500):
     exp(-a/500) > (1/2) * exp(-a/(1000))
  Take natural log:
     -a/500 > ln(1/2) - a/(1000)
     -a/500 + a/1000 > -ln(2)
     (-2a + a)/1000 > -ln(2)
     -a/1000 > -ln(2)
  Multiply by -1 (reverse inequality):
     a/1000 < ln(2)
     a < 1000 * ln(2) ≈ 693.15

