     E[gain | a] = [a * g(a) - (a/2) * g(a/2)] / [g(a) + g(a/2)]
  and the condition for positive expected gain is correctly stated as g(a) > g(a/2)/2.

  (ii) For the exponential prior with mean 500, the density is g(s) = (1/500) * exp(-s/500). The student notes it is decreasing and correctly reasons that the condition for switching is when the observed amount is below the median of the distribution of S. The median of an exponential distribution with mean μ is μ * ln(2). Here, μ=500, so median is 500 * ln(2) ≈ 346.57. The student states:
     - For $80 (which is below the median) switch.
     - For $600 (above the median) do not switch.

  However, we must check the condition: g(a) > g(a/2)/2.
