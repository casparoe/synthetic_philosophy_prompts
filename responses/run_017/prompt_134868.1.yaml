  We are designing a 90-minute activity for a group of 14 retirees and others. The goal is to explore the moral implications of digital minds, specifically focusing on:
  1. The clock-speed problem (how varying simulation speeds affect the amount of experienced time).
  2. The merging of copies (whether merging two streams into one is a gain, a death, or neither).

  We want to avoid upfront lectures and jargon. The activity should lead the participants to encounter the problems themselves. We will use index cards, a whiteboard, and a fixed budget of "compute hours" as resources.

  **Core Idea: The Welfare Accounting Game**
  Participants act as a committee that allocates a limited budget of compute hours to run simulations of digital minds for various tasks. They will create, run, and sometimes merge simulations. At the end, they must calculate the total welfare produced (in "person-hours of positive experience") and then discuss why it's problematic.

  **Materials:**
  - Index cards (each representing a simulation instance)
  - Whiteboard to track the total compute hours used and welfare tally
  - Markers
  - A timer (for real-time constraints in the game)

  **Setup:**
  - Each participant gets a role: some are "task proposers" (they want simulations for specific tasks) and others are "allocators" (they decide how to spend compute hours). Since we have 14 people, we can have 4 task proposers and 10 allocators (but adjust as needed). Alternatively, we can have the whole group act as allocators and the facilitator (you) as the task proposer.
  - Total compute hours budget: 1000 compute hours (written on the board).

  **Rules of the Game:**
  1. **Task Proposals:** The task proposers (or the facilitator) present tasks that require simulations. Each task has:
     - A description (e.g., "Run a simulation to design a new drug", "Run a simulation to write a novel", "Run a simulation to keep an elderly person company").
     - A required wall-clock duration (e.g., 2 hours of real time).
     - A clock-speed factor (how fast the simulation runs relative to real time: 1x, 10x, 100x). This determines how much subjective time the simulation experiences.
     - Optionally, a welfare impact per subjective hour (e.g., +1 for positive, -1 for negative, 0 for neutral). We can predefine these or let the group decide.

  2. **Allocation Phase:** The allocators discuss and decide which simulations to run, at what clock speed, and for how long (in wall-clock time). They must stay within the 1000 compute-hour budget (which equals wall-clock time multiplied by the computational intensity, but we simplify: compute hours = wall-clock time * clock-speed factor? Actually, let's define: one simulation running at clock-speed S for T real-time hours costs T * S compute hours. This reflects that faster simulations require more computational resources per real-time second.)

     Example: Running a simulation at 100x for 1 real-time hour costs 100 compute hours and gives the simulation 100 subjective hours.

  3. **Running Simulations:** When a simulation is approved, an index card is created for it. On the card, write:
     - Task description
     - Clock-speed factor (S)
     - Real-time duration (T)
     - Subjective time = S * T
     - Welfare per subjective hour (W)
     - Total welfare = S * T * W

     The card is placed on the table to represent an active simulation.

  4. **Special Operations:**
     - **Copying:** At any time, the group can choose to copy an existing simulation (by making a duplicate index card). The copy operation costs an additional C compute hours (let's set C=10, for example). The new copy has the same state and starts from that point.
     - **Merging:** Two simulations (of the same original) can be merged. The group must decide what happens to the experiences. The merged simulation continues as one. The merge operation costs M compute hours (set M=5). The welfare accounting for the merged simulation going forward is as usual, but what about the two that were merged? We leave it to the group to decide how to account for the two streams that are now gone.

  5. **Time Constraints:** The game is played in real-time. We have 45 minutes for the main activity (to leave time for debrief). Every 5 minutes of real time represents a day in the game world. So after each 5-minute interval, the group can propose new tasks and adjust.

