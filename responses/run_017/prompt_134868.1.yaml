     - For a simulation that ran at high speed: it produced more welfare per real-time hour because of the high subjective time.
     - For copies: when they are merged, what happens to the welfare of the two copies that were merged? Do we count the entire subjective time of both until the merge? Or do we consider that the merged entity only has one stream? And after the merge, it continues? What if the two copies had different experiences?

