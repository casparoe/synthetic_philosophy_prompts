  - 0-5 min: Explain the rules and assign roles. Write the compute budget (1000) on the board.
  - 5-50 min: Gameplay in 5-minute rounds (9 rounds). In each round:
     - New tasks are proposed (by the facilitator or task proposers).
     - Allocators discuss and decide which simulations to start, stop, copy, or merge. They must account for compute hours used.
