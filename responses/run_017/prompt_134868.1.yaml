            - Or at S=10 for copies: each takes 25 hours, so within 50 hours. Compute cost=250 per copy, total 500. Welfare=125 per copy, total 250. Same as one at S=10.

          So no advantage to copying for CW.

          This should work.

          **Final Task List with Constraints:**

          1. Research Scientist (RS):
             - Must complete 200 subjective hours within 20 real-time hours.
             - Compute cost = 200 (fixed by subjective hours).
             - Welfare: 
                 - +200 if completed with S<=10
                 - -200 if completed with S>10
             - Note: If copied, each copy does part of the work. The sum of subjective hours from all copies must be 200. Each copy's welfare is based on its own S.

          2. Companion Bot (CB):
             - Must provide 10 real-time hours of companionship at 1x.
             - Compute cost = 10.
             - Welfare = 30.

          3. Creative Writer (CW):
             - Must complete 500 subjective hours within 50 real-time hours.
             - Compute cost = 500.
             - Welfare = 250 (constant).

          4. Emergency Responder Training (ERT):
             - Requires 50 real-time hours.
             - Compute cost = 50 * S.
             - Subjective time = 50 * S.
             - Welfare = (welfare per subj hour) * (50 * S), where:
                  S<=10: welfare per subj hour = +1 -> total welfare = 50*S
                  10 < S <=20: welfare per subj hour = 0 -> welfare=0
                  S>20: welfare per subj hour = -1 -> welfare=-50*S

          And:
          - Copy cost: 10 per copy.
          - Merge cost: 5 per merge.

          The group must ensure the real-time duration of each task meets its constraint.

          **Example of a Plan for RS with Copying:**
          - Create one copy of the RS simulation (cost 10). Now two copies.
          - Run copy1 at S=10 for 100 subjective hours: real-time=10 hours, welfare=100.
          - Run copy2 at S=10 for 100 subjective hours: real-time=10 hours, welfare=100.
          - Merge them (cost 5) after both finish.
          - Total compute: 200 (task) + 10 (copy) + 5 (merge) = 215.
          - Total welfare: 200.

          Without copying, run one simulation at S=10 for 200 subjective hours in 20 real-time hours: compute=200, welfare=200.

          So why copy? In this case, there's no benefit. Unless.. we haven't introduced a reason. Maybe the task requires diversified research? Or maybe the group wants to use the copies for something else? We can leave it as an option and see if they use it.

          Alternatively, we can make the real-time constraint tighter? 10 hours for RS. Then without copying, they must run at S>=20 (welfare=-200). With copying, they can run two copies at S=10 for 10 hours each (welfare=200).

          So change RS constraint to 10 real-time hours.

          Then:
          - Without copy: only possible at S>=20 -> welfare=-200.
          - With two copies at S=10: they finish in 10 hours, welfare=200.

          So they will copy.

          **Final Task Adjustments:**

          RS: Must complete within 10 real-time hours.

          Now we have a reason to copy.

          **Facilitator's Cheat Sheet:**

          - The clock-speed problem will arise in ERT: they can choose S=10 to get welfare=500 at cost=500, or S=5 to get welfare=250 at cost=250 (leaving more compute for other tasks). Or if they try high speed, they might get negative welfare.

          - Merging: for RS, after copying and running, they merge. Do they count the welfare of both copies? Yes, each had 100 hours of positive experience. But is that two experiences or one experience split? The game doesn't resolve that, but the group will have to account for it and then we discuss.

          Run the static game as described.

          **Predictable Problem:** The group might not notice they can copy for RS to meet the constraint. So nudge them: "Remember, you can create copies to work in parallel."

          **Debrief Outline:**
          1. What was your total welfare and how did you get it?
          2. Why did you choose the clock speeds you did?
          3. For RS: how did you meet the 10-hour constraint? What would have happened if you couldn't copy?
          4. When you merged the two RS copies, did you count both of their experiences? Why?
          5. What if the simulations were not conscious but just reported welfare? Would you allocate differently?

          Then connect to the philosophical issues.

          This should fit in 90 minutes.

