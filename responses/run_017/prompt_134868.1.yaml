answer: |-
  ### Digital Minds Welfare Simulation  
  **Goal:** Explore moral accounting for digital minds via clock-speed dilemmas and merging copies.  

  #### Materials  
  - Index cards (1 per simulation)  
  - Whiteboard (track total welfare and compute)  
  - Markers  
  - 1000 "compute hours" (CH) tokens (paper scraps)  
  - Timer  

  #### Setup (5 min)  
  - Divide into 3 groups: **Task Proposers** (3-4 people, suggest simulations), **Allocators** (8-10 people, approve/cancel sims), **Accountants** (2 people, track CH/welfare on whiteboard).  
  - Write rules:  
    > 1. Each sim runs at **clock-speed S** (1x, 10x, or 100x).  
    > 2. **Cost** = Real-time duration (hrs) × S (in CH).  
    > 3. **Welfare** = Subjective time × Welfare score.  
    > 4. **Copy cost**: 50 CH. **Merge cost**: 20 CH.  
    > 5. **Real-time constraint**: All sims must finish within 24 real-time hrs.  

  #### Tasks (Pre-written on cards)  
  - **Research Scientist**: *Requires 100 subjective hours. Welfare: +1/hr if S≤10x; -2/hr if S=100x.*  
  - **Companion Bot**: *Must run in real-time (S=1x) for 10 hrs. Welfare: +3/hr.*  
  - **Emergency Trainer**: *Fixed 5 real-time hrs. Welfare: +1/hr (S=1x), 0/hr (S=10x), -3/hr (S=100x).*  

  #### Gameplay (60 min)  
  1. **Proposal Phase (5 min/round × 4 rounds)**  
     - Task Proposers suggest sims (e.g., "Run Researcher at 100x for 1 real-time hr").  
     - Allocators vote yes/no (majority rules). If yes:  
       - Accountants deduct CH cost, create index card (note S, duration, welfare score).  
       - Sims run **concurrently**—real-time advances 1 hr/round.  

  2. **Copy/Merge Actions (Anytime during rounds)**  
     - **Copy**: Pay 50 CH to duplicate a sim (e.g., split Researcher into two halves).  
     - **Merge**: Pay 20 CH to combine two *copies of same sim* into one. Accountants stop both, start merged sim.  

  3. **Welfare Tracking**  
     - Accountants record **subjective time** (real-time × S) and welfare per sim.  
     - *Example*: Researcher at 100x for 1 hr → 100 subj. hrs, welfare = 100 × (-2) = -200.  

  #### Final Accounting (10 min)  
  Groups calculate:  
  1. **Total welfare** (sum all sims’ welfare).  
  2. **Total CH spent**.  
  3. **Did they meet real-time constraints?**  

  #### Debrief (15 min)  
  - **Reveal the dilemmas**:  
    - **Clock-speed**: "If a sim runs 100x faster, is 1 hr of *our* time worth 100 hrs of *theirs*? Does welfare scale with speed?"  
    - **Merging**: "When two copies merge, do we count both their experiences? Is it two deaths or zero?"  
    - **Backups/Consciousness**: "Does copying make ‘deleting’ a sim okay? What if sims only *report* distress but aren’t conscious?"  
  - **Map to philosophy**:  
    - Person-years vs. mind-count?  
    - Is merging loss, gain, or neutral?  
    - Is speed a moral multiplier?  

  #### Predictable Problems & Fixes  
  - **Problem**: Groups ignore high-speed risks → ERT run at 100x causes massive negative welfare.  
    **Fix**: Ask: "Would you run *your* mind at 100x? Why/why not?"  
  - **Problem**: Merging welfare disputed (e.g., "Only count one copy!").  
    **Fix**: "If you were copied and merged, would you feel ‘killed’?"  
  - **Limitation**: Game can’t simulate subjective unity after merging. **Say aloud**: "Real controversy: Is a merge more like amnesia or death?"  

  #### Why It Works  
  - **No upfront theory**—dilemmas emerge from resource constraints.  
  - **Moral quantification forces trade-offs** (e.g., high-speed efficiency vs. welfare risk).  
  - **Merging/copying makes abstract problems visceral**.  

  **Total words**: 798
