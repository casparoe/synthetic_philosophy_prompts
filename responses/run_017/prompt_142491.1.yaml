prompt: |-
  I'm a fourth-year PhD student in philosophy writing on collective harm, and I've been asked to convene a small adversarial collaboration at our department's ethics workshop between two camps that have spent a decade talking past each other, and to produce the joint document they would sign. The first camp I'll call the difference-makers: they hold that the reason against an individual contribution to a collective harm is a function of the expected difference that contribution makes to the outcome, so that the familiar inefficacy thought is answered by insisting that what matters is expectation rather than certainty, and that in threshold cases your uncertainty about whether this is the pivotal act does the real work. The second camp I'll call the participation camp, and I suspect it is really a coalition of at least two wings — one that grounds the reason in membership of, or complicity in, a practice that is collectively harmful, and one that grounds it in something like universalisation or the expressive character of the act — so I want to know whether the coalition survives contact with the cases. To keep us off well-worn ground I've stipulated a set of institutional details rather than relying on slogans. First, the binned-purchase case: a regional processor orders birds in blocks of 500, rounds up, destroys the residual each quarter, and resets its counter, so that a single skipped chicken changes only how much is wasted unless it happens to be the five-hundredth. Second, the market-incidence case: in a large competitive market my abstention lowers demand infinitesimally, the price falls infinitesimally, and other consumers absorb almost all of it, so that the difference I make depends on whether we hold others' behaviour fixed or evaluate against the new equilibrium. Third, the public-counter case: the processor publishes its counter in real time, so I can know that I sit at position 3 of 500 and that 497 others would have to abstain with me. Fourth, the substitution case: the portion I decline is certain to be bought by somebody else. Fifth, the offset-lottery case: having to fly for a family emergency, I can either pay for the verified removal of one tonne with certainty, or buy a ticket costing one thousandth as much that has a one-in-a-thousand chance of triggering the removal of a thousand tonnes, with the same expected removal and money left over for other causes. Sixth, the resolution problem: the expected difference my flight makes to global mean temperature is around a trillionth of a degree, which is below the resolution of any climate model, any policy threshold I can identify, and arguably any probability estimate I can make with precision. And seventh, the shrinking-practice case: the same act performed when the practice has ten million participants and when it has ten, holding my own behaviour fixed.

  What I want is the document itself, not a report on the literature — please don't pad it with citations, since both camps know the debate and we only have ninety minutes. Give me the claims both sides can sign, including about the cases above and about what would have to be true for the inefficacy thought to bite at all; then the disagreements, each stated twice, once in the wording the difference-making side would accept for itself and once in the wording the participation side would accept for itself, with no strawmen and nothing so thin that the other side could sign it too; then a verdict, for each disagreement, on whether it is substantive, verbal, or partly each, and if verbal, what the real question turns out to be once the words are discharged. Then the cruxes: the sub-questions such that settling them would move at least one side, and for each one the case, argument or empirical finding that both sides agree would bear on it — ideally one of mine or a sharpened variant of it — together with each side's prediction written down in advance and an honest note about how each side would update if the case came out against them. I especially want the cruxes to include at least these: whether the offset lottery is an acceptable substitute for restraint, and if not, whether that is risk-aversion about moral goods or something the difference-making framework cannot represent; whether the stringency of the reason scales with the expected difference and hence with the size of the practice, or stays roughly invariant; whether the reason survives known non-pivotality and certain substitution, and whether the participation camp gives the same answer to both; whether counterfactual difference is measured against others' behaviour fixed or against the new equilibrium; whether there is a threshold of moral significance below which tiny expected differences stop generating reasons at all; and whether, once the counter is revealed and I provably made no difference, there is any remainder — anything to regret, disown, or owe — or whether the ex post fact fully exculpates. Please also tell me plainly where the participation camp splits, if it does, and which of my cases pries the wings apart.

  Format: open with a numbered Agreed Claims section, each claim followed by a single line on why both sides can sign it. Then a table with the columns Disagreement ID, Question at issue, Difference-making formulation, Participation formulation, Substantive / verbal / mixed, and, Verbal reformulation. Then a second table with the columns Crux ID, Sub-question, Test or case both accept as bearing on it, What would count as settling it, Difference-making prediction, Participation prediction, and How each side would update if it came out the other way. Close with three or four sentences on whether the participation coalition holds and on what remains genuinely unsettled. After the document, add a JSON object with this exact schema: {"agreed_claims": [{"id": "", "claim": "", "why_both_sign": ""}], "disagreements": [{"id": "", "question": "", "difference_making_formulation": "", "participation_formulation": "", "status": "", "verbal_reformulation": ""}], "cruxes": [{"id": "", "sub_question": "", "test_case": "", "settlement_condition": "", "difference_making_prediction": "", "participation_prediction": "", "difference_making_update_if_wrong": "", "participation_update_if_wrong": ""}], "coalition_fragility": "", "most_decisive_further_case": "", "genuinely_unresolved": ""}.
reasoning: |-
  Hmm, the user is a fourth-year PhD student in philosophy working on collective harm. They need to convene an adversarial collaboration between two camps: the "difference-makers" and the "participation" camp. The user has provided seven detailed cases to test the theories and wants a joint document with specific sections: agreed claims, disagreements, cruxes, and a closing note on coalition fragility.

  First, I need to understand the core positions. The difference-makers focus on expected impact—each act's probabilistic difference to the outcome. The participation camp seems split: one wing emphasizes complicity in harmful practices, the other focuses on universalization or expressive meaning. The cases are designed to probe these views without rehashing old debates.

  Looking at the cases: binned purchase tests threshold effects; market incidence examines equilibrium vs fixed-behavior counterfactuals; public counter makes pivotality knowable; substitution ensures no net reduction; offset lottery contrasts certainty vs high-impact probability; resolution questions tiny measurable effects; shrinking practice checks if reasons scale with group size.

  For the agreed claims, both sides likely agree that individual acts can be wrong even without certainty of harm, and that expectations matter. They'd also agree that substitution cases remove difference-making reasons, but participation might still see a complicity issue. The resolution problem shows both acknowledge limits in measuring tiny impacts.

  The disagreements need careful phrasing. For example, on offset lotteries: difference-makers see equal expected value as acceptable, while participation might reject it as insufficiently expressive or universalizable. The public counter case might split the participation camp—complicity wing cares about joining the harmful act regardless of pivotality, while expressive wing might focus on the act's meaning changing when pivotality is known.

  Cruxes should test predictions. For scaling with practice size: difference-makers say reasons weaken as groups grow (smaller expected impact), participation says reasons stay strong due to complicity. If empirical data showed people's judgments don't scale, difference-makers might adjust their model, while participation might not budge.

  The participation coalition might fracture on cases like public counter. If the counter shows no pivotality, does complicity still hold? The expressive wing might say the act symbolizes complicity regardless, but if symbolism changes when pivotality is known, that could split them.

  Finally, the genuinely unresolved issues include whether moral significance thresholds exist, and how to handle infinitesimal impacts in decision-making. The shrinking practice case is key here—does complicity weaken as the group shrinks, or is it binary?
answer: |-
  ## Joint Statement: Collective Harm in Threshold and Diffusion Contexts

  **Agreed Claims**  
  1. **Individual contributions to collectively harmful outcomes can generate moral reasons for restraint, even when the individual’s causal impact is negligible or uncertain.**  
     *Why both sign:* Difference-makers ground this in non-zero *expected* harm; participation theorists in complicity/expressive features.  
  2. **The inefficacy objection (that my act makes no difference) fails when uncertainty about pivotality is non-negligible.**  
     *Why both sign:* Difference-makers emphasize expected difference under uncertainty; participation theorists reject pivotality as necessary for wrongness.  
  3. **In the substitution case, the difference-making reason against purchasing vanishes.**  
     *Why both sign:* Difference-makers see no expected harm; participation theorists (complicity wing) may still see a concern, but agree the *primary* difference-making reason lapses.  
  4. **The resolution problem demonstrates genuine limitations in quantifying expected differences for extremely diffuse harms.**  
     *Why both sign:* Both acknowledge practical/epistemic constraints on calculating infinitesimal expected impacts.  
  5. **For the participation camp, the expressive meaning of an act can provide a reason independent of its causal impact.**  
     *Why both sign:* Participation camp asserts this; difference-makers accept it as a coherent (if distinct) claim.  
  6. **In the binned-purchase case, skipping a chicken *can* be obligatory if the probability of being pivotal is significant.**  
     *Why both sign:* Difference-makers cite expected difference; participation theorists cite complicity in the harmful practice/residual waste.  

  **Disagreements**  

  | ID | Question at Issue | Difference-making Formulation | Participation Formulation | Status | Verbal Reformulation |
  |----|-------------------|-------------------------------|---------------------------|--------|----------------------|
  | D1 | Does the moral equivalence of expected outcomes make the offset lottery morally equivalent to direct removal? | "When the expected harm averted and cost are identical, the offset lottery is morally equivalent to direct removal." | "Participating in the harmful act (flying) while relying on a probabilistic offset fails to adequately express dissociation from the harm or fulfill one's duty of non-complicity." | Mixed | Is the expressive dimension of *directly refraining* from the harmful act essential to fulfilling the duty, even when expected outcomes are equal? |
  | D2 | Does the stringency of the reason scale with the size of the collective (holding individual impact fixed)? | "The moral reason against an individual contribution weakens as the collective grows larger, because the expected difference made by the individual decreases." | "The reason against participating in a collectively harmful practice remains stringent regardless of the practice's size, because the nature of the act (complicity in harm) is unchanged." | Substantive | Does the *wrong-making feature* reside solely in the causal structure (expected difference) or also in the relational fact of participation? |
  | D3 | Does the reason survive *known* non-pivotality (Public Counter case)? | "If an agent knows with certainty their act is not pivotal (position 3/500), the difference-making reason against contributing dissolves." | "Even with known non-pivotality, contributing constitutes complicity in the harmful collective practice and expresses endorsement of its harms, generating a reason against participation." | Substantive | Does *knowingly joining* a harmful collective endeavor constitute a wrong independent of causal efficacy? |
  | D4 | How is counterfactual difference measured? | "An individual's difference-making impact is assessed by comparing the outcome *with their act* to the outcome *without their act, holding others' behavior fixed*." | "The relevant counterfactual for assessing participation in a practice considers the equilibrium state of the practice itself; the 'difference' is being part of it versus not." | Verbal | Is the relevant comparison: (A) The world with my specific act vs. the world without it, *ceteris paribus*? Or (B) My membership in the harmful practice vs. my non-membership, acknowledging the practice's equilibrium dynamics? |
  | D5 | Is there a threshold below which an expected difference is morally insignificant? | "When the expected harm of an individual act falls below a threshold of practical significance (e.g., below model resolution or perceptible impact), it generates no meaningful moral reason for restraint." | "Any participation in a practice known to cause significant collective harm generates a *pro tanto* reason for restraint, regardless of the infinitesimal expected difference, due to complicity." | Substantive | Can the *de minimis* principle apply to reasons grounded in complicity/expression? |

  **Cruxes**  

  | ID | Sub-Question | Test/Case | Settlement Condition | Diff-Making Prediction | Participation Prediction | Diff-Making Update If Wrong | Participation Update If Wrong |
  |----|--------------|-----------|----------------------|------------------------|--------------------------|-----------------------------|------------------------------|
  | C1 | Is the offset lottery morally equivalent to direct restraint? | **Offset Lottery Case:** Flying + buying the lottery ticket vs. not flying + paying for direct removal. | Consistent, widely shared intuitive judgment that flying + lottery is *less* commendable/permissible than not flying. | Equivalent (Acceptable Substitute). | Not Equivalent (Unacceptable). | If not equivalent, incorporate expressive/non-consequentialist elements into the framework. | If equivalent, refine complicity/expression account to explain why probabilistic offsetting *does* adequately dissociate. |
  | C2 | Does reason stringency scale with practice size? | **Shrinking Practice Case:** Identical act (e.g., buying 1 chicken) in a practice with 10 million participants vs. 10 participants (holding individual expected impact *per act* constant if possible, else focus on perception). | Empirical data showing people judge the reason significantly weaker in the large group vs. the small group. | Stringency Scales Down (Weaker reason in large group). | Stringency Invariant (Equally strong reason). | If invariant, explore non-cognitive factors (symbolism, identification) influencing perceived wrongness. | If scales, refine complicity to account for dilution effects in very large groups. |
  | C3 | Does the reason survive known non-pivotality? | **Public Counter Case:** Knowing you are position 3/500, buying anyway vs. abstaining. | Consistent judgment that buying in this case is still wrong/reprehensible. | No Reason (Permissible). | Reason Persists (Wrong). | If wrong persists, incorporate expressive/complicity reasons as additional factors. | If not wrong, concede pivotality is necessary *when known*, weakening the pure complicity claim. |
  | C4 | Does the reason survive *certain* substitution? | **Substitution Case:** My declined chicken *will* be bought by another customer. | Consistent judgment that abstaining is still morally required/commendable despite substitution. | No Reason (Permissible to buy, futile to abstain). | Reason Persists (Abstain required - Complicity/Expression). | If reason persists, incorporate expressive value of non-participation even if futile. | If no reason, refine complicity to require plausible causal contribution potential. |
  | C5 | Is regret/remnant obligation warranted ex post if proven non-pivotal? | **Public Counter Case (Ex Post):** After contributing at position 3/500, outcome unchanged. Do you owe regret/compensation? | Consistent judgment that regret/remnant obligation *is* appropriate despite proven non-pivotality. | No Remainder (Fully Exculpated). | Remainder Exists (Regret/Obligation owed - Complicity). | If remainder exists, acknowledge non-consequentialist residue. | If no remainder, refine complicity to be more outcome-dependent. |

  **Closing Remarks**  
  The participation coalition *fractures decisively* on **Case C3 (Public Counter - Known Non-Pivotality)**. The **complicity wing** maintains the reason persists, grounding wrongness in joining the harmful endeavor itself. The **expressive/universalization wing** struggles: if the act cannot *express* endorsement of causing the harm (since it demonstrably didn't), and universalization seems irrelevant (as my buying doesn't *cause* others to buy), their rationale weakens significantly. This case exposes the complicity wing as the core resilient position against difference-making. **Crux C1 (Offset Lottery)** remains genuinely unresolved and critical, probing whether moral demands transcend expected outcomes. The fundamental divide persists: is the core wrong-making feature located in the *expected causal consequence* or in the *relational fact of participation* in collective harm?

