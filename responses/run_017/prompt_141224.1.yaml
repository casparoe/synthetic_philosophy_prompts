prompt: |-
  I have been reading rationalist blogs and forums—LessWrong, Overcoming Bias, and the long comment threads on the functional decision theory paper—for well over a decade, and I now teach an advanced undergraduate seminar, cross-listed between philosophy and computer science, on rational choice, decision theory, and agency. I am writing the take-home final and I need one essay question, together with a model answer and a marking scheme, on counterfactual mugging and XOR blackmail. The question must be unanswerable by merely reciting the definitions of causal decision theory, evidential decision theory, and functional decision theory; it should force students to apply them to a single decision function in a variant I will call the Two-Branch Exchanger Case.

  In this variant, Omega is a perfect predictor and administers a two-branch case. Omega flips a fair coin. If it lands heads, Omega asks you to pay $1,000; if you pay, Omega gives you $1,000,000, and if you refuse, nothing happens. If it lands tails, Omega does not ask you for money; instead, a perfect-predictor blackmailer sends you an XOR blackmail letter. The letter was sent if and only if exactly one of the following is true: (i) you have a rare disease; (ii) you would pay the blackmailer $1,000 upon receiving the letter. If you do have the disease and you do not pay, the blackmailer reveals that you have the disease; if you pay, they do not. If you do not have the disease, the blackmailer has no secret to reveal, so refusing to pay costs you nothing and paying costs you $1,000. Having the disease revealed would cost you $1,000,000; the prior probability that you have the disease is 50%; and you know all of this. You are told the result of the coin flip: in the heads branch you face Omega's request, and in the tails branch you receive the blackmail letter. You have only one decision procedure: a single fixed mathematical function that maps your total evidence to an action, and the predictors' predictions of what you would have done in the branch that did not occur are perfectly correlated with the output of this same function on that branch's input. You cannot adopt one disconnected policy for the heads branch and a different disconnected policy for the tails branch.

  Please write the student-facing exam question itself, self-contained and suitable for a 90-minute essay, then give a model answer of about 700 words, and then give a marking scheme built around five must-hit points, the marks each is worth (total 20), and a one-line note on how candidates typically get each wrong. The question should require students to say what a CDT agent, an EDT agent, and an FDT agent do in each branch of the Two-Branch Exchanger Case, to explain why the intuitively attractive package of paying Omega in the heads branch but refusing to pay the blackmailer in the tails branch is not available to a single decision function, or is available only at catastrophic cost, and to say what the case shows about the difference between evaluating a physical act and evaluating the output of a decision function. Do not ask for bibliographies, reading lists, or citations, and do not use any verbatim quotations from published works; paraphrase any letter or request in your own words. Please write the exam question, the model answer, and the marking scheme in American English.
reasoning: |-
  We are creating an exam question on the Two-Branch Exchanger Case, which combines elements of counterfactual mugging and XOR blackmail. The key is that the student must apply CDT, EDT, and FDT to a single decision function that operates in both branches, with the predictors using the same function for predictions in the branch that did not occur.

  Exam Question:

  **Two-Branch Exchanger Case**

  Consider the following scenario involving Omega, a perfect predictor, and a blackmailer. Omega flips a fair coin. If the coin lands heads, Omega approaches you and asks for $1,000. If you pay, Omega gives you $1,000,000. If you refuse, nothing happens. If the coin lands tails, Omega does not approach you. Instead, you receive a letter from a perfect-predictor blackmailer. The blackmailer sent the letter if and only if exactly one of the following is true: (i) you have a rare disease, or (ii) you would pay the blackmailer $1,000 upon receiving the letter. 

  You know that:
  - The prior probability that you have the disease is 50%.
  - If you have the disease and do not pay the blackmailer, the blackmailer reveals your disease, which costs you $1,000,000. If you pay, they do not reveal it.
  - If you do not have the disease, then the blackmailer has no secret to reveal. Therefore, paying costs you $1,000 and refusing costs you nothing.
  - You are told the outcome of the coin flip. In the heads branch, you face Omega's request. In the tails branch, you receive the blackmail letter.

  Crucially, you have a single decision function that maps your total evidence (which includes the coin flip outcome and any other relevant information) to an action. The predictors (Omega for the heads branch and the blackmailer for the tails branch) base their predictions on the output of this same decision function applied to the input of the branch that did not occur. That is, the prediction of what you would do in the heads branch (if the coin were tails) is determined by running your decision function on the heads branch input, and similarly, the prediction of what you would do in the tails branch (if the coin were heads) is determined by running your decision function on the tails branch input. Therefore, you cannot have one policy for heads and a completely independent one for tails; they are linked by the same function.

  Answer the following:

  1. Describe what a causal decision theory (CDT) agent, an evidential decision theory (EDT) agent, and a functional decision theory (FDT) agent would do in the heads branch and in the tails branch. Be specific: for each theory, state whether the agent pays or refuses in each branch.

  2. Explain why the intuitively attractive strategy of paying in the heads branch (to get $1,000,000 from Omega) but refusing to pay in the tails branch (to avoid losing $1,000 when there's no disease or when the disease is not revealed) is not available to a single decision function without incurring catastrophic costs. What is the catastrophic cost?

  3. Discuss what this case shows about the difference between evaluating a physical act and evaluating the output of a decision function. Why is it important to consider the decision function as a whole?

  ---

  Model Answer (approx. 700 words):

  In the Two-Branch Exchanger Case, the decision function must produce consistent outputs for both branches because the predictors use the same function to determine their actions in the counterfactual branch. We analyze CDT, EDT, and FDT.

  First, consider CDT. CDT evaluates actions based on the causal consequences. In the heads branch, paying $1,000 to Omega causes a gain of $1,000,000. Refusing causes nothing. So CDT pays. In the tails branch, CDT considers the causal impact of paying or refusing. Paying $1,000 to the blackmailer does not cause the disease to exist or not. The disease is already present or not. If the agent has the disease, paying prevents the revelation (saving $1,000,000) but costs $1,000, so net gain $999,000. Refusing costs $1,000,000 if the disease is present and 0 if not. Since the disease is independent (50% chance), the expected utility of paying is 0.5 * (-$1,000) + 0.5 * ($999,000) = $499,000. The expected utility of refusing is 0.5 * (-$1,000,000) + 0.5 * ($0) = -$500,000. So CDT pays in the tails branch as well. Thus, CDT pays in both branches.

  Second, consider EDT. EDT conditions on the action to see what evidence it provides. In the heads branch, paying is evidence that the coin was heads (because if it were tails, the decision function might have done something else, but here the function is fixed). However, in this branch, the agent knows the coin is heads, so paying doesn't provide new evidence about the coin. But EDT must consider the evidence about the disease? Actually, in the heads branch, the disease is irrelevant because the blackmail letter isn't sent. The only effect is: paying gains $1,000,000. So EDT pays. In the tails branch, EDT conditions on the action. If the agent pays, that provides evidence that the agent would pay in the heads branch (because the same function is used). The blackmailer's letter was sent if exactly one of (i) disease or (ii) paying in tails is true. But note: the agent knows the coin is tails and that the letter was received. The agent also knows the prior of the disease (50%). If the agent pays, then the condition for the letter being sent becomes: exactly one of (i) disease or (ii) true (since paying is true). This equals: disease is false. Because if disease is false, then exactly one (false and true) is true. If disease is true, then both are true -> not exactly one. Therefore, paying in the tails branch is evidence that the agent does not have the disease (because otherwise the letter wouldn't have been sent). So if the agent pays, they are certain they don't have the disease. Therefore, paying costs $1,000 and nothing is revealed (so no loss). If the agent refuses, then the condition for the letter is: exactly one of (i) disease or (ii) paying (which is false) -> so disease must be true (because then exactly one: true and false). So refusing is evidence that the agent has the disease. Therefore, if they refuse, the blackmailer reveals the disease, costing $1,000,000. So in the tails branch, if the agent pays, they lose $1,000 but avoid the revelation (and they are sure they don't have the disease). If they refuse, they are sure they have the disease and lose $1,000,000. So EDT pays in the tails branch to avoid the $1,000,000 loss. Thus, EDT also pays in both branches.

  Third, FDT. FDT evaluates the output of the decision function in all possible situations. It considers the entire function. The function has two outputs: one for heads (pay or refuse) and one for tails (pay or refuse). The blackmailer's action (sending the letter) depends on the tails output and the disease. Specifically, the letter is sent iff exactly one of (disease, tails-output=pay) is true. Also, Omega's prediction for the heads branch (which is used in the tails branch by the blackmailer) is based on the heads output. But note: the blackmailer only uses the tails output? Actually, the problem states that the blackmailer's prediction of what you would have done in the heads branch (if it had occurred) is based on the decision function applied to the heads branch input. However, in the tails branch, the blackmailer uses that prediction (the heads output) as part of the condition? Let me clarify: the blackmailer sends the letter if and only if exactly one of (disease, you would pay the blackmailer in the tails branch) is true. But the problem says: "(ii) you would pay the blackmailer $1,000 upon receiving the letter" — that is the action in the tails branch. So the condition is: the letter is sent iff exactly one of (disease, the decision function outputs pay in the tails branch) is true. The prediction of the heads branch is not directly used by the blackmailer. However, the decision function is fixed for both branches, so the outputs are linked.

  FDT considers the function that maps (branch, disease) to action. But note: the disease is unknown until the tails branch? Actually, the disease exists in both branches, but it only matters in the tails branch. The agent doesn't know the disease status until they condition on the branch? The agent never directly observes the disease; they only get the letter in tails and then can condition on that.

  FDT would look for a fixed point. The intuitive strategy (pay in heads, refuse in tails) is what we want. Let's check if it can be a fixed point. Suppose the decision function is: heads -> pay, tails -> refuse. Now, in the tails branch, the blackmailer uses condition: exactly one of (disease, tails-action=refuse) -> exactly one of (disease, false). This is equivalent to disease being true. So the letter is sent only when the disease is present. Therefore, if the agent in the tails branch refuses, then if they have the disease (which they do with 50% chance), they lose $1,000,000. If they don't, they lose nothing. But wait, the agent doesn't know the disease status. However, the letter was sent only when disease is true? So if they receive the letter, they know they have the disease? Then if they refuse, they lose $1,000,000. So that's bad. Alternatively, if they pay in tails, then condition: exactly one of (disease, pay=true) -> exactly one of (disease, true) -> which is when disease is false. So they would only receive the letter when they don't have the disease. Then if they pay, they lose $1,000 unnecessarily. So the intuitive strategy leads to: in tails, if they get the letter, they know they have the disease (if they refuse) or they know they don't (if they pay). Either way, they are forced to lose money: either $1,000,000 (if they refuse and have the disease) or $1,000 (if they pay and don't have the disease). But note: with 50% chance of disease, the expected loss is $500,000. This is catastrophic.

  But FDT can choose a different function. Consider the function: pay in both branches. Then in the tails branch, condition: exactly one of (disease, pay=true) -> exactly one of (disease, true) -> so when disease is false. So the letter is sent only when no disease. Then in the tails branch, if the agent pays, they are sure they don't have the disease (because the letter was sent only in that case). So they pay $1,000 and avoid any revelation (but they don't have the disease, so no harm). If they had the disease (and the letter wasn't sent because the condition fails: both true -> not exactly one), then they don't receive the letter and don't pay. So they avoid the $1,000 cost and the disease remains secret? But wait, if they don't receive the letter, they don't act. So in the case of disease, they don't pay and the blackmailer doesn't reveal (because they didn't get a chance? The problem says: if tails and the letter is not sent, then nothing happens). So the agent loses nothing when they have the disease and the function pays in both? Actually, the blackmailer only reveals if you have the disease and you refuse to pay the letter. But if the letter is not sent, then you don't get the chance to refuse. So the disease remains secret. Therefore, with the "always pay" function: 
  - Heads: pay $1,000, get $1,000,000 -> net $999,000.
  - Tails: if no disease (50%), you get the letter and pay $1,000. If disease (50%), no letter and nothing happens. So expected utility: 0.5 * (-$1,000) + 0.5 * $0 = -$500. Plus the heads branch: 0.5 * $999,000 = $499,500. Total expected utility: $499,500 - $500 = $499,000.

  Alternatively, consider "refuse in both". In heads: refuse, so nothing. In tails: condition: exactly one of (disease, refuse=false) -> exactly one of (disease, false) -> when disease is true. So the letter is sent only when disease is true. Then in tails, if they refuse, they have the disease and lose $1,000,000. So expected utility: heads: 0, tails: 0.5 * (-$1,000,000) = -$500,000.

  Now, the intuitive strategy (pay in heads, refuse in tails) as above: in tails, if they get the letter, then they know that the condition (exactly one) holds. But with the function, condition: exactly one of (disease, refuse) -> but refuse is false? Wait, in tails they refuse, so the action is refuse. Condition: exactly one of (disease, false). So the letter was sent iff disease is true. Therefore, when they get the letter, they know they have the disease. And they refuse, so they lose $1,000,000. So expected utility: heads: 0.5 * $999,000 = $499,500; tails: 0.5 * (-$1,000,000) = -$500,000; total: -$500. Worse than always paying.

  But what if we try a function that pays in heads and pays in tails? That's the always pay, which we saw: total expected utility $499,000.

  Is there a better function? Consider: refuse in heads and pay in tails. Then in heads: refuse, so 0. In tails: condition: exactly one of (disease, pay=true) -> when disease is false. So the letter is sent only when no disease. Then in tails, the agent pays $1,000 and they don't have the disease. So tails cost: $1,000. Expected utility: heads: 0, tails: -$1,000 (only when no disease, which is 50%) -> expected cost $500. Total expected utility: -$500.

  So the best fixed function is always pay: expected utility $499,000.

  Therefore, FDT would choose the function that pays in both branches.

  Now, the catastrophic cost of the intuitive strategy (pay in heads, refuse in tails) is that in the tails branch, when the letter is received (which happens only when the disease is present, because the condition becomes disease true and refuse false -> exactly one true), the agent then refuses and loses $1,000,000. Since the disease is present with 50% chance and the tails branch occurs 50% of the time, the expected loss from tails is $500,000, which is catastrophic compared to the gains in heads (expected $499,500) leading to a net loss of $500. In contrast, always paying avoids this.

  Finally, the case shows that decision theories must evaluate the entire decision function because the outcomes depend on the function's outputs in multiple scenarios. Physical acts are evaluated in isolation by CDT and EDT, but FDT considers the function's behavior across all possible inputs. This is crucial because predictors (like Omega and the blackmailer) use the same function to set up the scenario. Therefore, the agent must choose a function that performs well globally, not just locally in the current branch.

  ---

  Marking Scheme (out of 20):

  Must-hit points:

  1. (4 marks) Correctly identifies the actions for CDT in both branches: pays in both. 
     - Note: Common mistake is to have CDT refuse in tails because they think paying doesn't cause anything, but they forget that in tails, paying does cause the blackmailer not to reveal if the disease is present.

  2. (4 marks) Correctly identifies the actions for EDT in both branches: pays in both. 
     - Note: Common mistake is to have EDT refuse in tails because they fail to condition on the action and the disease status appropriately.

  3. (4 marks) Correctly identifies the action for FDT: pays in both branches, and explains that FDT chooses the best fixed function (which is to pay in both). 
     - Note: Common mistake is to say FDT follows the intuitive strategy without realizing it leads to a net loss.

  4. (4 marks) Explains why the intuitive strategy (pay in heads, refuse in tails) is not available without catastrophic cost: because in the tails branch, refusing leads to a loss of $1,000,000 when the disease is present (which is the condition under which the letter is sent), and the expected loss is $500,000, which is catastrophic compared to the gains. 
     - Note: Common mistake is to only mention the loss in tails without quantifying the expected loss or without linking it to the function's fixed nature.

  5. (4 marks) Discusses the difference between evaluating a physical act and evaluating the output of a decision function: physical acts are evaluated in isolation (by CDT and EDT, which are local) but the function must be evaluated globally (by FDT) because the predictors use the same function for predictions in counterfactual scenarios. 
     - Note: Common mistake is to only describe the theories without contrasting the local vs. global evaluation.

  Total: 20 marks.
answer: |-
  ### Exam Question: Two-Branch Exchanger Case  
  **Time Allotment:** 90 minutes  
  **Instructions:**  
  Answer all parts of the question below in a clear, structured essay. Do not regurgitate textbook definitions of decision theories; instead, apply them rigorously to the scenario. Focus on logical reasoning, and avoid fluff or speculation.  

  **Scenario:**  
  Omega flips a fair coin.  
  - **Heads:** Omega asks you for $1,000. If you pay, Omega gives you $1,000,000. If you refuse, nothing happens.  
  - **Tails:** You receive a blackmail letter. The letter was sent if and only if exactly one of these is true: (i) you have a rare disease (prior probability 50%), or (ii) you would pay the blackmailer $1,000 upon receiving the letter.  
    - If you have the disease and refuse to pay, the blackmailer reveals it, costing you $1,000,000.  
    - If you pay, the secret is kept (no cost if you lack the disease).  
    - If you lack the disease, refusing costs nothing; paying costs $1,000.  

  You know the coin result: In heads, you face Omega; in tails, you get the letter. You have one fixed decision function mapping your total evidence (including the branch) to an action. Predictors (Omega and the blackmailer) use this exact function to simulate counterfactual branches. For example, the blackmailer’s prediction of your heads-branch action uses the function’s heads-branch output, and vice versa. You cannot independently optimize each branch.  

  **Question:**  
  1. **Action Analysis:** What would a causal decision theory (CDT) agent, an evidential decision theory (EDT) agent, and a functional decision theory (FDT) agent do in the heads branch and the tails branch? Specify "pay" or "refuse" for each theory and branch.  
  2. **Intuitive Strategy Failure:** Why is the intuitively attractive strategy—paying Omega in heads (to gain $1,000,000) but refusing the blackmailer in tails (to avoid a $1,000 loss when possible)—unavailable or catastrophically costly for a single decision function? Quantify the catastrophic cost.  
  3. **Decision Function vs. Physical Acts:** What does this case reveal about the difference between evaluating a physical act (e.g., handing over money) and evaluating the output of a decision function? Why must agents consider their function holistically?  

  ---  
  ### Model Answer (Approx. 700 words)  

  **1. Action Analysis**  
  - **CDT Agent:**  
    - *Heads:* Pays. CDT values causal effects: Paying causes a $999,000 net gain ($1,000,000 minus $1,000). Refusing causes no gain.  
    - *Tails:* Pays. CDT ignores correlations and focuses on disease probabilities. With a 50% disease chance, paying has an expected utility of (0.5 × –$1,000) + (0.5 × $999,000) = $499,000 (the latter from preventing a $1,000,000 loss if diseased). Refusing risks a 50% chance of losing $1,000,000 (if diseased), so expected utility is –$500,000. Paying dominates.  
  - **EDT Agent:**  
    - *Heads:* Pays. EDT conditions on the act: Paying is strong evidence the coin is heads (since the function must be consistent), but in heads, the agent already knows the branch. Thus, paying purely signals a $999,000 gain.  
    - *Tails:* Pays. EDT conditions on the act and the letter’s arrival. Paying implies the disease is absent: The letter was sent iff exactly one of (disease, pay) is true. If you pay, "pay" is true, so "exactly one" requires disease false. Thus, paying provides evidence you lack the disease, costing only $1,000 (no revelation risk). Refusing implies disease true (since "exactly one" must hold), risking a $1,000,000 loss. Paying avoids this.  
  - **FDT Agent:**  
    - *Heads and Tails:* Pays in both. FDT treats the decision function as a unified object. It evaluates all outputs jointly:  
      - If the function pays in both branches:  
        - *Heads:* Gain $999,000.  
        - *Tails:* Paying implies disease false (per EDT’s logic), costing $1,000 safely. If diseased (50%), no letter is sent (since "pay" and "disease" make two truths, violating "exactly one"), so no cost occurs. Expected utility: 0.5 × $999,000 (heads) + 0.5 × [0.5 × –$1,000 (tails, no disease) + 0.5 × $0 (tails, disease, no letter)] ≈ $499,500.  
      - Alternatives (e.g., pay in heads/refuse in tails) yield lower utility (see Part 2). FDT chooses the highest-utility function: paying globally.  

  **2. Intuitive Strategy Failure**  
  The intuitive strategy—pay in heads, refuse in tails—is catastrophically costly because the decision function links branches. If the function refuses in tails, the blackmailer’s condition (letter sent iff exactly one of disease/refuse is true) simplifies to: letter sent iff disease true (since "refuse" makes the second condition false). Thus, receiving the letter implies disease true. If you refuse, you lose $1,000,000. This happens with 50% disease probability in tails, so expected loss in tails is $500,000. Meanwhile, heads yields 50% × $999,000 ≈ $499,500. Net expected utility: –$500.  
  The cost is catastrophic because refusing in tails converts the letter into proof of disease, guaranteeing maximal loss when diseased. By contrast, paying in both branches nets $499,500 (as above). The function cannot isolate tails: Refusing there makes heads payments irrelevant to tail outcomes, but the disease revelation dominates.  

  **3. Decision Function vs. Physical Acts**  
  This case shows that evaluating physical acts in isolation (like CDT/EDT) ignores how predictors use the decision function globally. CDT/EDT treat paying/refusing as local physical acts: CDT only considers branch-specific causality (e.g., "paying doesn’t cause disease"), while EDT only considers local evidence (e.g., "paying implies no disease in tails"). But FDT evaluates the function’s outputs across all inputs, recognizing that predictors simulate counterfactuals using the same function. Here, the blackmailer’s letter depends on the function’s tails-output, but also on its heads-output (via the disease-pay link), making outcomes interdependent.  
  Agents must consider their function holistically because predictors force trade-offs: A "refuse in tails" output makes disease revelation certain when the letter arrives, which outweighs heads gains. Physical acts are ephemeral; the function’s consistency across scenarios determines long-term utility. FDT thus outperforms CDT/EDT by optimizing the function, not just acts.  

  ---  
  ### Marking Scheme (Total: 20 marks)  
  Assess answers based on five must-hit points. Award partial marks for incomplete or partially correct reasoning.  

  | **Points**                                                                                                | **Marks** | **Common Mistakes**                                                                 |
  |-----------------------------------------------------------------------------------------------------------|-----------|-------------------------------------------------------------------------------------|
  | **1. Correct CDT actions:** Pays in heads (causal gain) AND pays in tails (avoids disease loss risk).     | 4         | Mistake: Claims CDT refuses in tails, ignoring disease probability and causal prevention of revelation. |
  | **2. Correct EDT actions:** Pays in heads (evidence of branch) AND pays in tails (evidence of no disease).| 4         | Mistake: Claims EDT refuses in tails, misapplying evidence (e.g., ignores that refusing implies disease). |
  | **3. Correct FDT action:** Pays in both branches (optimal function); explains fixed-point evaluation.     | 4         | Mistake: Asserts FDT uses intuitive strategy; fails to quantify utility or consider alternatives. |
  | **4. Explains intuitive strategy’s catastrophic cost:** Refusing in tails implies disease → $1M loss; net utility –$500. | 4 | Mistake: Only describes the loss qualitatively; doesn’t link to function consistency or expected utility. |
  | **5. Discusses function vs. acts:** Contrasts local act evaluation (CDT/EDT) with global function optimization (FDT); ties to predictor interdependence. | 4 | Mistake: Vaguely praises FDT without explaining why functions matter (e.g., omits predictor simulations). |
