  | C3      | Is the apparent richness of crowded/peripheral vision perceived or reconstructed from gist/expectation?                             | The apparent richness is largely an illusion generated post-perceptually by the semantic gist plus generic expectations about scenes; phenomenal detail is sparse outside the focus of attention.                       | The apparent richness reflects genuine, locally detailed (though perhaps not perfectly veridical) phenomenal content present in early visual areas, which is aggregated into a gist but lost for specific identification due to crowding/access limits. | (b) Crowded-flanker display: Present a central target (e.g., letter) surrounded by closely spaced flankers (e.g., other letters). Adjust spacing so target identification is near chance. Ask subjects to describe the *appearance* of the central region (not to identify). Compare descriptions against predictions of: (i) a model assuming only gist + noise is represented phenomenally; (ii) a model assuming local detailed features are present phenomenally but inaccessible for identification.                                                                                                                                                                               | Subject descriptions will align primarily with the "gist + noise/reconstruction" model, being vague, generic, or inconsistent with the actual local features present. Descriptions will not reliably differentiate local feature combinations.         | Subject descriptions will provide evidence for specific local feature conjunctions (e.g., "jagged bits", "curves crossing") that align better with the "local detail present" model than the "gist + noise" model, despite inability to identify the target. | Genuine           | Tests the granularity of non-accessed phenomenology in crowding.                                                                 |
  | C4      | Does "access" mean availability to *any* downstream consumer, or specifically availability for report, reasoning & deliberate action? | Access consciousness is defined by availability to the specific "consumers" responsible for the "global" functions: verbal report systems, working memory, deliberative reasoning, and voluntary action planning systems. Availability only to lower-level, encapsulated systems (e.g., motor routines, basic orienting) does not constitute access consciousness. | Access consciousness requires availability to the *subject*, meaning some form of introspective self-access or global availability sufficient for the experience to be part of the subject's unified perspective, even if not available for standard report/reasoning/action. | (c) Experience-sampling during absorbed walking: Probes mid-episode. Detailed analysis of unprompted reports regarding the *quality* and *locus* of awareness (e.g., "I vaguely sensed the steps", "My foot landing felt sharp", "I saw the blurry plants but didn't *register* them"). Combine with neural measures (EEG/fMRI) looking for signatures of self-referential processing or frontal integration without full ignition.                                                                                                                                                                                             | Reports will describe experiences outside the focus of attention as indistinct, lacking specific detail, or only becoming clear *upon* the probe directing attention. Neural signatures of self-reference/frontal integration will correlate tightly with report detail and ignition. | Reports will describe distinct, albeit not finely detailed, phenomenal qualities for unattended aspects *at the time*, prior to the probe. Neural signatures may show partial frontal integration or self-referential processing without full-blown ignition signatures. | Genuine (border) | Touches on definitions but has empirical implications for the minimal neural correlates of "availability to the subject".            |

  **Part 3: Verbal Disputes**

  We identify one primary source of potential verbal disagreement:

  *   **V1: Definitional Border of Phenomenal Consciousness:** Disagreements sometimes arise depending on whether "phenomenal consciousness" is defined *strictly* by intrinsic qualitative character ("what it is like-ness") or whether the definition *implicitly includes* a minimal condition of "availability to the subject" (even if not for report/reasoning). GWT proponents often lean towards the latter, seeing minimal self-access as inseparable from phenomenality. CO proponents strictly separate intrinsic qualia from any form of access or availability. This difference can lead to talking past each other when debating whether a given state is "phenomenally conscious but unaccessed" (CO) or "not genuinely phenomenally conscious at all due to lack of minimal self-access" (GWT). Clarifying this definitional commitment at the outset is crucial.

