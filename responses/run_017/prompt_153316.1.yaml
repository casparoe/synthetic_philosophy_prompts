answer: |-
  ## Joint Statement: Global Workspace Theory (GWT) & Conscious Overflow (CO) Following Adversarial Collaboration

  **Part 1: Agreed Claims**

  We, defenders of Global Workspace Theory (GWT) and Conscious Overflow (CO), after sustained collaborative examination, agree on the following substantive points:

  1.  **A1: Neural Signature:** A transient, large-scale neural activation pattern ("ignition"), involving widespread reciprocal connectivity, particularly between prefrontal and posterior cortical regions, is a measurable neural signature reliably correlated with the state of *access consciousness* – the broadcasting of information for global cognitive utilisation.
  2.  **A2: Architectural Distinction:** The distinction between *phenomenal consciousness* (the subjective qualitative character of experience, 'what it is like') and *access consciousness* (the global availability of information for reporting, reasoning, planning, and voluntary action) is conceptually coherent and empirically useful for organising research.
  3.  **A3: Phenomenal Richness Requires Explanation:** Subjects consistently report phenomenally rich experiences in situations where access is demonstrably limited (e.g., the detailed visual periphery in a glance, unattended sounds, the feeling of stairs underfoot while lost in thought). This reported richness, whether veridical or illusory, constitutes a core explanandum for any theory of consciousness.
  4.  **A4: Evidence for Ignition & Access Limits:** Existing evidence robustly demonstrates that workspace ignition is necessary for the flexible, sustained cognitive access required for standard report and deliberate action. Evidence also clearly establishes severe capacity limits on access consciousness (e.g., inattentional blindness, change blindness, working memory limits).
  5.  **A5: Evidence Inconclusive on Phenomenal Richness:** Existing evidence (e.g., partial report superiority, metacontrast masking, inattentional blindness reports) does not definitively establish whether the phenomenal character associated with unattended or unaccessed sensory information is as rich and detailed as subjects report, or whether it is sparser and the richness is inferred or confabulated post-perceptually.
  6.  **A6: Overstated GWT Claim:** The claim that GWT *entails* that phenomenal consciousness is strictly identical to or coextensive with access consciousness (i.e., that ignition is both necessary *and sufficient* for phenomenality) is stronger than the core architectural claim requires and is challenged by subjective reports of richness outside focal attention.
  7.  **A7: Overstated CO Claim:** The claim that overflow *necessarily* implies massive, highly detailed, and perfectly veridical phenomenal representations persisting independently of access over extended periods is stronger than the core overflow claim requires. The nature and fidelity of non-accessed phenomenology remain open empirical questions.
  8.  **A8: Ignition's Functional Role:** Workspace ignition plays a crucial, non-eliminable functional role in enabling flexible cognition – integrating information from specialised modules, overcoming encapsulation, and making information available for systems underlying report, deliberation, and executive control. This functional role exists irrespective of the overflow debate.

  **Part 2: Cruxes of Disagreement**

