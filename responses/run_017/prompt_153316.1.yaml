  | C2      | Can report-based measures alone settle questions about phenomenal consciousness? If not, what neural signature would indicate phenomenal consciousness without access? | Report (verbal or behavioural) is the primary, necessary criterion for attributing specific phenomenal content. No neural signature can definitively indicate phenomenal content *without* the potential for report. | Report is a fallible indicator of phenomenology. Neural decoding (e.g., from visual cortex) showing content-specific representations that correlate with subjective reports *when access is possible*, but persist robustly under conditions preventing report, would indicate phenomenal consciousness without access. | (a) as above; (c) Experience-sampling during absorbed walking: Deliver brief vibrotactile probes mid-walk (e.g., at stair descent onset). Subject immediately reports any concurrent sensory/perceptual experience (e.g., footfeel, visual scene detail, thought content). Simultaneously record high-density EEG/fMRI. Develop neural decoders for specific perceptual contents (e.g., stair texture, peripheral object category) from trials *with* full access/report. Apply these decoders to probe trials.                                                                                                                                                                 | Neural decoders will only show robust content-specific activation on probe trials where the subject *reports* awareness of that specific content. Reports will often mention only gist or task-relevant features.                                     | Neural decoders will show robust content-specific activation on probe trials even when subjects report no awareness of that specific detail or only report gist. Reports will frequently mention rich, task-irrelevant details.                                          | Genuine           | Tests if neural patterns reliably associated with *specific* phenomenal content persist without