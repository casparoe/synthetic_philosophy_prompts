prompt: |-
  I head the integrity function at a UK-registered international development NGO. We run health and local-government programmes in about a dozen countries, mostly in West and East Africa and South Asia. Our country offices send me something in the region of forty "is this corruption?" queries a year, and they are not exotic: a payment someone has asked for before releasing a shipment, a gift offered to a monitoring team, a contractor's contribution to a local politician's constituency fund, a per diem a government partner expects before he will attend a meeting. They arrive by email from programme managers and finance officers with no legal training, usually needing an answer the same day because a workshop, a customs clearance or a relationship is waiting on it. Every answer has to be logged in a register our institutional donors can audit, and I report the pattern to our audit committee each quarter. Because we are a UK body, we also carry the risk of the corporate offence of failing to prevent bribery committed on our behalf, where the defence turns on whether we had adequate procedures in place — so an undocumented judgement call is worse than no judgement call at all.

  Our current guidance is a two-page gift-and-hospitality policy built on the familiar principal–agent idea: corruption is a public or organisational functionary taking a benefit to do something he should not do. It fails in two directions at once. It is too narrow, because a great deal of what harms our programmes is clientelist — resources converted into political support or a following rather than into private consumption — and that does not feel like a bribe to anyone involved. And it is too quick, because in half our operating countries the boundary between a public office and the person holding it is drawn very differently from the Weberian picture the policy assumes, refusing a gift is a serious insult, and the local vocabulary may use one word where English distinguishes gift, tip, commission and bribe. I do not want to solve that by deferring to local practice either: the local practices our staff are told to respect are frequently the ones the poorest people we work with complain about most bitterly.

  What I want from you is a decision procedure my country teams can actually run, together with the conceptual work that justifies it. Concretely:

  First, set out — briefly, and with no citations, reading lists or named authorities, since I want the distinctions doing the work rather than borrowed names — a classification of the phenomena I have to sort: a bribe in the narrow sense; clientelist exchange, where the return is loyalty, a vote or a following rather than private enrichment; gift and hospitality whose point is to constitute or maintain a relationship; and coercive extraction, where our own staff or partners have no realistic alternative. Say why the classification matters operationally, since each kind should end in a different action: refuse and report, refuse quietly, redesign the payment, tolerate and log, or escalate to our donor. I also want corruption kept separate from mere elite capture, from bad programme design and from operating in a predatory or grossly underfunded state: if the procedure labels everything, it stops picking anything out.

  Second, build the procedure itself. A colleague has proposed five tests, and I want you to order them, keep the ones that survive, discard or repair the ones that do not, and add any that are missing, telling me in each case what the test is really tracking: the refusal test (can the person asked to pay decline without losing the service or the relationship, and who actually bears the cost if she does?); the convertibility test (is this cash in an envelope, or a goat slaughtered for the visitors, whose value is bound up in the act of giving?); the avowal test (would both parties be willing to have it known — known to whom: their peers, their families, the intended recipients of the service, our donor?); the recurrence test (is this a one-off or an expected, more or less standard rate?); and something he calls the second-best trap, where suppressing the transfer leaves the intended beneficiaries worse off than before. Flag explicitly which of these tests are culturally loaded in ways that will misfire in our operating environments — the avowal test looks to me like it will misfire where discretion is part of the point of a gift — and build in a step that asks whose account of the local norm is being offered to us and whether the person offering it has any standing to give it.

  The procedure has to be usable in twenty minutes by someone with no legal training, fit on one side of A4, specify what counts as a sufficient answer to each question and what to do when an answer cannot be obtained in the time available, say where it stops outright with a no, and say where it stops because the remaining question is one of values rather than fact and has to be referred to me or to the audit committee. Assume the person running it may have to justify the answer to a village chief, a district official and a donor auditor in the same week.

  Then run it, in full, on three cases. (1) In a country where we fund district health boards, an MP maintains a fund from which he contributes to the funeral costs of constituents who apply to him; contractors working on our projects replenish it; and no one involved regards this as anything but what a good representative does. (2) A customs broker asks for a modest cash payment to release a consignment of vaccine refrigerators held at a border; the power supply at the destination clinic is unreliable and the cold chain is close to failing. (3) Our own routine practice: we pay government officials a sitting allowance to attend our monitoring workshops, set above their civil-service daily rate because otherwise they do not come, and our field teams accept small gifts — a goat, baskets of fruit — from village leaders during monitoring visits. I expect the procedure to condemn something we do as a matter of routine, and I want to see how you handle that: I cannot stop it unilaterally, the whole sector does it, and a procedure that simply says "stop" on case 3 is a procedure my teams will quietly ignore. Tell me what a realistic answer looks like when the procedure's verdict is one I cannot implement.

  Finally, give me the one-page version for country staff, and a short note to me on what the one-page version loses. Close by saying plainly what a procedure of this kind cannot do: which of our questions it will leave unanswered, and where the judgement of a particular experienced person is doing work that the checklist only appears to have removed.
reasoning: |-
  Okay, the user heads the integrity function at a UK-registered international development NGO operating in challenging environments across Africa and South Asia. They're drowning in daily "is this corruption?" queries from field staff who need quick, auditable decisions. Their existing policy fails because it's too narrow (missing clientelism) and culturally tone-deaf. 

  Hmm... what they really need isn't just a better form - it's an operational philosophy that bridges UK legal risks and on-ground realities. The tension screams through their examples: that funeral fund case shows how Western frameworks collapse when faced with socially embedded practices. And their frustration with Case 3 (sitting allowances) reveals they want honesty about systemic compromises.

  First, I should dismantle their colleague's five tests. The avowal test is indeed dangerous - demanding transparency about gifts in contexts where discretion equals respect. And that "second-best trap" needs reframing; it's not about accepting harm but recognizing when refusal harms beneficiaries more. 

  For the classification system, I'll avoid academic jargon. Key distinctions: coercive extraction (refuse) vs. relationship-building gifts (log). Clientelism is the real beast here - it requires program redesign, not just refusal. Must emphasize that elite capture is different; it's about systemic exclusion, not individual transactions.

  The procedure must fit on one page but allow for "gray zone" referrals. For Case 1 (MP's funeral fund), the answer can't be simple condemnation - it's clientelism requiring donor consultation. Case 2 (customs payment) clearly fails the refusal test (coercion), but I'll suggest parallel escalation paths: pay under protest while reporting. 

  Ah, Case 3 is the landmine. The sitting allowance fails the refusal test spectacularly. But saying "stop" would make staff ignore the whole system. So I'll propose logging it as a systemic risk while working with donors on salary support - acknowledging the NGO can't fix broken bureaucracies alone. 

  The one-page version will sacrifice nuance about cultural context - that's the tradeoff. And in the closing note, I must stress that no checklist replaces seasoned judgment when local power dynamics are in play. The procedure's real value is forcing conscious choices, not eliminating them.
answer: |-
  Here’s a practical decision framework for your teams, designed for clarity, auditability, and cultural nuance. It addresses your core requirements: classification, a usable 20-minute procedure, case applications, and clarity on limitations.

  ---

  ### **I. Classification & Operational Significance**
  1. **Bribe (Narrow)**:  
     *Payment/gift to a public/org official to influence a specific action, violating rules.*  
     **Action:** REFUSE, REPORT to HQ/donor. Risk: UK Bribery Act violation.  

  2. **Clientelist Exchange**:  
     *Resource transfer (cash, goods) in exchange for political loyalty/support (votes, influence), not personal enrichment.*  
     **Action:** REDESIGN the program/delivery mechanism. Risk: Distorts program goals, entrenches inequality.  

  3. **Relationship-Constituting Gift/Hospitality**:  
     *Non-cash, culturally embedded gesture (meal, token gift) to establish/maintain trust or respect.*  
     **Action:** TOLERATE & LOG if below threshold. Risk: Insult if refused; may escalate if excessive.  

  4. **Coercive Extraction**:  
     *Payment demanded under duress where refusal causes immediate harm to beneficiaries/program.*  
     **Action:** PAY (documented), ESCALATE to HQ/donor for systemic action. Risk: Extortion, operational paralysis.  

  **Why the distinction matters**:  
  - **Bribes** threaten legal liability → **Report/Refuse**.  
  - **Clientelism** corrupts program intent → **Redesign** to bypass intermediaries.  
  - **Relationship gifts** sustain operations → **Tolerate/Log** within limits.  
  - **Coercion** is emergency triage → **Pay/Escalate** to fix systems.  

  **Excluded (to avoid over-labeling)**:  
  - **Elite Capture**: Systemic exclusion of the poor (program design issue).  
  - **Bad Program Design**: Unrealistic timelines/budgets causing shortcuts.  
  - **Predatory State Context**: Underfunded systems forcing officials to seek "top-ups" (systemic, not individual fault).  

  ---

  ### **II. Decision Procedure: 5-Step Assessment**  
  *(Ordered tests, fit on 1 page A4, 20-minute max)*  

  | **Test & Question**                     | **Sufficient Answer**                                                                 | **Action Trigger**                                                                 |
  |-----------------------------------------|---------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------|
  | **1. Refusal Test**: Can the recipient decline without losing the service/relationship? Who bears the cost? | If refusal risks program harm/insult → **Coercion/Relationship**. If refusal has no cost → **Bribe**. | Failure → *Coercion* or *Bribe*. Proceed to Step 2. |
  | **2. Convertibility Test**: Is this cash (easily converted) or a perishable/non-tradable item? | Cash/valuables → **Bribe/Clientelism**. Culturally bound non-cash item → **Relationship Gift**. | Cash → *Bribe/Clientelism risk*. Non-cash → *Tolerate/Log* if small. |
  | **3. Recurrence Test**: Is this a one-off or a standard/expected rate? | Standard rate → **Systemic Issue**. One-off → **Context-specific risk**. | Standard rate → *Escalate to HQ* (may indicate coercion/clientelism). |
  | **4. Beneficiary Impact Test**: If blocked, does it harm intended beneficiaries more? | If harm is immediate/severe (e.g., vaccines spoiling) → **Coercion**. If not → **Bribe/Clientelism**. | Harm → *Pay & Escalate*. No harm → *Refuse/Redesign*. |
  | **5. Norm Validation Test**: Whose account of "local norm" is this? Do they have standing? (e.g., village elder vs. contractor) | If from beneficiary/neutral elder → Valid. If from payer/recipient → Suspect. | Unreliable account → **Pause, consult HQ**. |

  **Critical Notes**:  
  - **Culturally Loaded Tests**: The *Convertibility Test* is safe (objective). The *Refusal Test* and *Norm Validation Test* guard against cultural misfires (e.g., gifts requiring discretion).  
  - **When to Stop**:  
    - **Hard "No"**: Cash to officials for specific actions (Bribe).  
    - **Refer to HQ**: Clientelism, systemic coercion, or unreliable norm accounts.  
  - **Time Crunch**: If Step 1 or 4 indicate coercion with immediate harm → Pay under protest, log, escalate within 24h.  

  ---

  ### **III. Case Applications**  
  **Case 1: MP’s Funeral Fund**  
  - **Refusal Test**: Contractors likely can’t refuse without repercussions → *Risk*.  
  - **Convertibility**: Cash → *High risk*.  
  - **Recurrence**: Expected practice → *Systemic*.  
  - **Beneficiary Impact**: Not immediate harm, but distorts accountability → *Clientelism*.  
  - **Norm Validation**: MP/contractors benefit; poor constituents may resent it.  
  **Verdict: CLIENTELIST EXCHANGE** → Redesign: Donor-funded community funeral grants, bypassing MP. **Action: REFER TO DONOR/HQ.**  

  **Case 2: Customs "Facilitation" Payment**  
  - **Refusal Test**: Refusal = spoiled vaccines → *Coercion*.  
  - **Convertibility**: Cash → *Bribe risk*.  
  - **Beneficiary Impact**: Immediate harm (cold chain failure) → *Emergency*.  
  - **Recurrence**: Likely standard at border → *Systemic issue*.  
  **Verdict: COERCIVE EXTRACTION** → **Action: PAY (document broker’s name/demand), LOG, ESCALATE to HQ/donor for diplomatic pressure.**  

  **Case 3: Sitting Allowances & Gifts**  
  - **Refusal Test**: Officials won’t attend without allowance → *Coercive system*.  
  - **Convertibility**: Cash allowance → *Bribe-like*; Goat/fruit → *Relationship*.  
  - **Beneficiary Impact**: No workshops = no program → *Harm*.  
  - **Recurrence**: Standard sector-wide → *Systemic*.  
  **Verdict**:  
  - **Sitting Allowances**: COERCION (systemic) → **Action: LOG as systemic risk; ESCALATE to donors to lobby for govt salary reforms.**  
  - **Gifts**: RELATIONSHIP-CONSTITUTING → **Action: TOLERATE & LOG if <$50 value.**  
  **Realistic Approach**: Acknowledge this is suboptimal but sector-wide. Log all payments/gifts; aggregate data to push donors on systemic solutions.  

  ---

  ### **IV. One-Page Field Guide for Staff**  
  **"QUICK DECISION TREE"**  
  1. **Is it CASH to a govt/official?**  
     - **YES** → Is it to get a specific action? → **YES = BRIBE (REFUSE, REPORT)**.  
     - **NO** → Go to Step 2.  

  2. **Can you refuse without harming beneficiaries or causing insult?**  
     - **NO** → Is it cash? → **YES = COERCION (PAY, LOG, ESCALATE)**.  
     - **NO** → Non-cash? → **Relationship Gift (LOG if <$50)**.  

  3. **Is it expected often (not one-off)?** → **ESCALATE to HQ**.  
  4. **Stuck?** → Call HQ Integrity Unit immediately.  

  **LOG ALL** in the register: Who, what, when, value, why paid/refused.  

  ---

  ### **V. What the One-Page Version Loses (HQ Note)**  
  - **Nuance in "Beneficiary Harm"**: Field staff may misjudge long-term harm (e.g., normalizing bribes) vs. immediate needs.  
  - **Clientelism Detection**: Relies on HQ referral; staff may miss political loyalty dynamics.  
  - **Norm Validation**: Oversimplifies power dynamics (e.g., whose voice matters).  
  - **Systemic Pressure**: Staff can log coercion but can’t fix broken systems alone.  

  ---

  ### **VI. What This Procedure Cannot Do**  
  1. **Resolve Systemic Dysfunction**: It flags coercion/clientelism but can’t fix underpaid officials or predatory states.  
  2. **Replace Experienced Judgment**: Ambiguous norms (e.g., "Is this goat a bribe or courtesy?") require your contextual insight.  
  3. **Prevent All Liability**: UK Bribery Act compliance requires *systemic* fixes beyond logging.  
  4. **Answer "Is This Ethical?"**: It detects *categories of risk* but can’t resolve moral trade-offs (e.g., saving vaccines vs. validating extortion).  

  **Final Note**: This procedure makes risks visible and auditable. But the hardest choices — where survival, ethics, and legality collide — will always land with you and the audit committee. The checklist doesn’t eliminate judgment; it forces it into the open.  

  ---  
  Let me know if you need the field guide formatted as a standalone document or donor briefing.
