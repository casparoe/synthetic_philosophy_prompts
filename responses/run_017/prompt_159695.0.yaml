      Overview: We are simulating a decision-making body. In each round, there is an opportunity to take an action that can be either beneficial or harmful. The true state (beneficial or harmful) is hidden. Each member gets a private signal (either "good" or "bad") about the state, but the signal is noisy and some members are more reliable than others. You won't know your own reliability.

      Rules per round:

          - The facilitator will hand out private signals (on a card) to each player.
          - There will be a 3-minute discussion period. During discussion:
               - You may talk about whether to take the action, but you may not show your signal card or quote the exact signal. You can say things like "I have a positive signal" or "I'm optimistic".
               - In the unilateral rule: any player can take the action at any time during the discussion by standing up and saying "I press". The first player to do so takes the action and the round ends immediately.
          - If the discussion period ends and no one has pressed (in unilateral rule), then we will ask if anyone wants to press now. If one or more players indicate they want to press, the first to do so (by standing and saying "I press") takes the action.
          - If no one presses, the action is not taken.

          Payoffs in unilateral rule:
              - If the action is taken and the state is good:
                   - The player who pressed gets 5 points.
                   - Every other player gets 1 point.
              - If the action is taken and the state is bad:
                   - Every player (including the presser) loses 3 points.
              - If the action is not taken:
                   - No change in points.

