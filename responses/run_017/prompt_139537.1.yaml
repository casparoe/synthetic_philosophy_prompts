  For Vietnam, users might include cautious diplomats or military planners. Procedurally, it shifts the burden to prove no quagmire. Predictively, defining a reference class is tricky—conflicts where intervention led to prolonged stalemate? Vietnam itself is both vivid and atypical, affecting its representativeness. Authorising here justified restraint, avoiding another Vietnam syndrome.

