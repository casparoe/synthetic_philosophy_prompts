  ### Classroom Game: Signaling Challenge  
  **Objective:** Illustrate the handicap principle's core concepts through experiential learning without using jargon or peacock examples. Focus on differential cost, equilibrium loops, and cost avoidance.  

  ---

  ### **Game Setup**  
  **Players:**  
  - 18 students → 6 groups of 3.  
    - **Roles per group:**  
      - 1 High-type sender (assigned secretly).  
      - 1 Low-type sender (assigned secretly).  
      - 1 receiver.  
  - **Materials per group:**  
    - 2 envelopes (for sender decisions).  
    - 3 decision cards (2 for senders, 1 for receiver).  
    - Poker chips: 15 per group (5 per player as starting endowment per round).  
    - Tally sheet (projected for all groups to record results).  

  **Payoffs (per round):**  
  - **Senders (if accepted):**  
    - High type: +10 chips.  
    - Low type: +5 chips.  
  - **Senders (if rejected):** 0 chips.  
  - **Receiver (per sender):**  
    - Accept High: +5 chips.  
    - Accept Low: -5 chips.  
    - Reject: 0 chips.  
  - **Signal costs (paid upfront unless specified):**  
    - *Round 1:* Cost = 3 chips (both types).  
    - *Round 2:* High cost = 3 chips, Low cost = 6 chips.  
    - *Round 3:* Cost covered externally (see "Pawnshop" below).  

  **Rules:**  
  1. **Sender types:**  
     - High/Low assigned randomly via cards at start (fixed for all rounds).  
     - Senders know their type; receivers **never** know types.  
  2. **Signal decision:**  
     - Senders decide: **Send** (pay cost) or **Not Send** (no cost).  
     - Write choice on card, seal in envelope, hand to receiver.  
  3. **Receiver decision:**  
     - **Rule 1:** Automatically reject if "Not Send."  
     - **Rule 2:** If "Send," choose **Accept** or **Reject**.  
     - Write decisions on card.  
  4. **Cost avoidance (Round 3 "Pawnshop"):**  
     - Before signaling, any sender can take a **loan** to cover cost.  
     - If accepted: Repay loan from payoff (e.g., if High, 10 - cost).  
     - If rejected: Loan forgiven (no repayment).  

  ---

  ### **Game Flow (3 Rounds, 15 min each)**  
  **Round 1: Uniform Cost (10 min play + 5 min tally)**  
  - **Announce:** "Cost to send = 3 chips for everyone."  
  - **Expected behavior:**  
    - Both types send (cost < benefit: High 10-3=7, Low 5-3=2).  
    - Receiver sees two signals, accepts both (no way to distinguish).  
  - **Outcome:**  
    - High: 10 - 3 = **+7 chips**.  
    - Low: 5 - 3 = **+2 chips**.  
    - Receiver: 5 (High) - 5 (Low) = **0 chips**.  
  - **Tally on board:**  
    | Group | High Sent? | Low Sent? | Receiver Action | High Chips | Low Chips | Receiver Chips |  
    |-------|-----------|----------|-----------------|-----------|----------|---------------|  
    | 1     | Yes       | Yes      | Accept Both     | +7        | +2       | 0             |  

  **Round 2: Differential Cost (10 min play + 5 min tally)**  
  - **Announce:** "High cost = 3 chips. Low cost = 6 chips."  
  - **Expected behavior:**  
    - High sends (10-3=7 > 0).  
    - Low does **not** send (5-6= -1 < 0).  
    - Receiver sees one signal (High) and one no-signal (Low), accepts signaler only.  
  - **Outcome:**  
    - High: 10 - 3 = **+7 chips**.  
    - Low: 0 (rejected).  
    - Receiver: +5 (accept High) + 0 (reject Low) = **+5 chips**.  
  - **Tally on board (add to Round 1):**  
    | Group | High Sent? | Low Sent? | Receiver Action | High Chips | Low Chips | Receiver Chips |  
    |-------|-----------|----------|-----------------|-----------|----------|---------------|  
    | 1     | Yes       | No       | Accept High     | +7        | 0        | +5            |  

  **Round 3: Cost Avoidance "Pawnshop" (10 min play + 5 min tally)**  
  - **Announce:** "Loan option: Borrow cost upfront. If rejected, debt forgiven. If accepted, repay from payoff."  
  - **Expected behavior:**  
    - High sends (with/without loan; expects acceptance).  
    - **Low sends with loan** (if rejected: 0; if accepted: 5-6= -1, but risks nothing).  
    - Receiver sees two signals, accepts both (cannot distinguish).  
  - **Outcome:**  
    - High: 10 - 3 = **+7 chips** (no loan) or 10 - 3 = **+7 chips** (loan).  
    - Low: Takes loan → if accepted, 5 - 6 = **-1 chips**; if rejected, **0 chips** (debt forgiven).  
    - Receiver: 5 (High) - 5 (Low) = **0 chips**.  
  - **Tally on board (add to previous):**  
    | Group | High Sent? | Low Sent? | Receiver Action | High Chips | Low Chips | Receiver Chips |  
    |-------|-----------|----------|-----------------|-----------|----------|---------------|  
    | 1     | Yes       | Yes (loan)| Accept Both     | +7        | -1       | 0             |  

  ---

  ### **Debrief (25 min)**  
  **Reconstruct the game:**  
  - **Round 1:** "Why did everyone signal? What did the receiver learn?"  
    - Both types signaled because cost was affordable. Receiver gained no info → accepted both.  
    - **Key point (1):** Uniform cost doesn’t prevent dishonesty. Cost must hurt Low more than High.  
  - **Round 2:** "Why did Low stop signaling? How did the receiver know who to accept?"  
    - Low avoided signaling because cost was too high (6 > 5). Receiver inferred signal = High.  
    - **Key point (2):** Honesty is a loop. Signals work because:  
      - Receivers *expect* only High can afford the cost → accept signalers.  
      - High *knows* receivers accept → signals.  
      - Low *knows* it’s not worth it → doesn’t signal.  
  - **Round 3:** "Why did Low signal again? What broke?"  
    - Loan let Low avoid cost if rejected → mimicked High risk-free. Receiver accepted both → system collapsed.  
    - **Key point (3):** If senders dodge the cost (via loans/resale), Low "cheats" → honesty breaks.  

  **Connect to biology:**  
  - Handicap principle: Signals (e.g., antlers, vibrant colors) are honest **only** if:  
    - Cost is *differentially affordable* (High can bear it, Low cannot).  
    - Cost is *unavoidable* (no "loans" in nature).  
  - Mention: Peacocks are the classic example, but now you’ve *felt* why cost matters.  

  ---

  ### **Predictable Issues & Fixes**  
  1. **Round 1 confusion:**  
     - **Issue:** Receivers might reject signals arbitrarily.  
     - **Fix:** Enforce rule: "If you see a signal, you *must* accept (it’s the only info you have)."  
  2. **Round 2 skepticism:**  
     - **Issue:** Low types might still signal (e.g., "maybe the receiver will accept me anyway").  
     - **Fix:** Show math: "Low gets 5-6= -1 if accepted. Is that better than 0?"  
  3. **Round 3 loan misuse:**  
     - **Issue:** High types take loans (unnecessary), or Low types avoid loans.  
     - **Fix:** Clarify: "Loans are optional. But if rejected, you pay nothing."  

  ---

  ### **Limitations to Clarify**  
  - **What the game can’t show:**  
    - In real biology, costs aren’t "set" but emerge from the environment (e.g., predation risk).  
    - Evolution shapes costs/signals over generations (not 3 rounds).  
  - **Say this:** "Today, you experienced the *logic* of costly signals. In nature, this happens through survival pressures, not game rules."  

  ### **Materials Prep**  
  - **For you:**  
    - 6 sets of role cards (High/Low/receiver per group).  
    - Chips (5 per player per round × 18 students × 3 rounds = 270 chips).  
    - Projector with tally sheet.  
  - **For students:**  
    - Decision cards, envelopes, pens.  

  **Total time:** 75 min (5 setup, 45 gameplay, 25 debrief).  
  **Reward:** Chocolate for top 3 chip earners (motivates engagement without pay-to-win).  

  This design forces students to *live* the handicap principle’s logic. By Round 3, the "scandal" of Low types gaming the system will make point (3) visceral. No jargon upfront—just chips, choices, and "aha!" in the debrief.
