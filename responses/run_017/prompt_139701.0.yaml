  Okay, the user is grappling with a complex ethical dilemma regarding academic integrity policies and disability accommodations. They're on a committee rewriting their university's academic integrity code and have encountered a philosophical inconsistency in how medication use is treated differently for diagnosed vs undiagnosed students. 

  The core tension they're wrestling with is: why is the same drug considered "restorative" for one student but "enhancement" for another? They've identified parallel cases in healthcare coverage and sports doping rules, suggesting this is a fundamental philosophical question about how we define "normal" function and medical necessity.

  Hmm, this is deep stuff. The user clearly has sophisticated understanding of the philosophical dimensions - they've already analyzed three possible baselines for defining "normal" function (individual trajectory, statistical norm, capability threshold). Their frustration with "restoration vs enhancement" being treated as self-explanatory is completely valid - it's anything but. 

  What they're really asking for is:
  1) A clear articulation of the unstated principles underlying current policies
  2) Pressure-testing of edge cases that expose contradictions
  3) Evaluation of their proposed "capacity-neutral" alternative

  The emotional tone suggests intellectual frustration mixed with determination to get this right. This isn't just academic for them - real students' futures hang in the balance. They want rigor, not platitudes.

  Let me break this down systematically. First, the implicit theory behind current practice seems to be a hybrid model:
  - Borrowing from Daniels' normal function model for healthcare
  - Mixed with Rawlsian fairness concerns in academic settings
  - Overlaid with practical resource constraints

  But the cracks show in cases like:
  - The constitutionally distractible student who gets no accommodation
  - The congenitally deaf child receiving "restorative" tech they never had
  - The athlete using altitude training for same effect as banned transfusions

  Their proposed "capacity-neutral" model is thoughtful but has three fatal flaws:
  1) It assumes stable student preferences (but capabilities reshape desires)
  2) It can't handle positional goods problems (all advantages become "unfair")
  3) It collapses the special moral claim of illness

  The sports analogy reveals something important: in purely competitive contexts, we care about purity of performance and equal starting points. But education isn't zero-sum in the same way - we want genuine mastery, not just ranking.

  The most honest reconstruction is that current practice relies on:
  1) A value-laden species-typical functional baseline
  2) With a moral priority for treating pathology
  3) Plus administrative feasibility concerns
  4) All framed as objective to avoid contentious value debates

  Cost containment absolutely plays a role in healthcare coverage decisions, but dressing it as "medical necessity" gives it ethical cover. The user's instinct about "metaphysical costumes" is spot-on.

  For their committee, I'd suggest:
  - Acknowledge the inherent vagueness but show it's manageable
  - Distinguish disability accommodations from integrity violations more clearly
  - Consider shifting focus to "unfair advantage" only when grading is comparative
  - Be transparent about resource constraints rather than masking them as philosophy

  The sports parallel holds surprisingly well - both contexts wrestle with defining "natural" performance - but education's purpose changes what we value in that definition.
answer: |-
  Your inquiry cuts to the philosophical core of institutional distinctions between therapy and enhancement. Below is a reconstruction of the implicit theory, its tensions, and an evaluation of alternatives.

  ---

  ### **1. The Implicit Distinction: Restoration vs. Improvement**
  The practice relies on a **hybrid baseline** combining *statistical species-typical function* with a *value-laden welfare threshold*:
  - **Statistical Normality**: "Normal function" is defined as capacities within the central range of human variation (e.g., typical attention span, height, metabolic function). Insulin for diabetes restores glucose metabolism to this range; stimulants for ADHD restore focus to neurotypical levels.
  - **Welfare Threshold**: Interventions are prioritized when they bridge a gap to a minimum threshold of functioning required for basic flourishing (e.g., antidepressants for debilitating depression).  
  - **Rejection of Individual Counterfactuals**: The congenital deafness case shows the practice *does not* require restoration to a person's *own* past state. A cochlear implant is therapy because it provides access to a species-typical sensory capacity deemed essential for social and cognitive development.

  **Where Baselines Diverge**:  
  - A short child with healthy hormone levels (statistically normal) vs. one with growth hormone deficiency (sub-threshold welfare). Therapy is denied to the former because short stature alone doesn’t breach the welfare threshold absent pathology.  
  - **Value-Laden Necessity**: "Normal function" is not value-free. The disability office assumes attention and impulse control are *necessary* for academic participation. Laser eye surgery is "optional" because corrected vision (via glasses) is already accessible; growth hormone for non-pathological short stature isn’t "needed" for flourishing.

  ---

  ### **2. Pressure Points: Where the Distinction Frays**
  #### **Case 1: Identical Capacities, Different Histories**  
  - **Constitutionally distractible student** (no illness) vs. **ADHD student** (illness-mediated). Current rules prioritize the latter.  
    - *Defensible?* Only if the justification is **corrective justice**: The ADHD student is owed accommodation to offset an unchosen disadvantage. The distractible student’s baseline, while low, isn’t deemed a "medical deficit."  
    - *Administrative Reality*: Scarce resources (diagnostic capacity, medication costs) reinforce this distinction, but the core rationale is ethical: society compensates for pathology, not natural variation.  

  #### **Case 2: The Slippery Slope of Restoration**  
  - Cochlear implants for congenital deafness *are* enhancements by a strict "restore to prior self" standard. Yet they’re accepted as therapy because:  
    - They target a *function* (hearing) central to human capabilities.  
    - The welfare threshold (access to language, education) justifies intervention regardless of personal history.  
  - **Vagueness as Non-Fatal**: The line blurs (e.g., SSRIs for mild dysthymia vs. severe depression), but institutions anchor decisions to:  
    - **Diagnostic gatekeeping**: A medical authority certifies a "disorder" (DSM, ICD codes).  
    - **Severity filters**: Impairment must significantly impede major life activities.  
    - This is untidy but administratively functional—not philosophically fatal.  

  ---

  ### **3. Evaluating "Capacity-Neutral Provision"**
  Your proposal replaces restoration/enhancement with:  
  - **Benefit-ranking by student ends** (healthcare).  
  - **Unfair positional advantage** (academic integrity).  

  **Why It Collapses**:  
  - **Circular Preferences**: Student desires adapt to available interventions (e.g., wanting stimulants only because peers use them). "Benefit" becomes endogenous.  
  - **Positional Advantage Overreach**: Caffeine, tutoring, or elite schooling *do* create unfair advantages. Banning them would paralyze academia; permitting them undermines the test. The current system avoids this by condemning only *pharmacological* enhancements lacking a "therapy" justification.  
  - **Erodes the Claim of Illness**: If we owe accommodations only to prevent unfairness, not to remedy pathology, we lose the moral force that compels provision for the sick. A diabetic’s insulin isn’t about "fairness" in exam-taking—it’s about sustaining life.  

  **Best Reconstruction of Current Practice**:  
  The system rests on two pillars:  
  - **Therapeutic Necessity**: Medicine’s purpose is to restore or maintain species-typical function when it falls below a welfare threshold (Daniels’ *Just Health*).  
  - **Corrective Justice**: Institutions compensate for *unchosen* functional deficits to provide equal opportunity.  
  Cost containment operates within this frame (e.g., denying growth hormone to a healthy short child) but wears "medical necessity" as a disguise.  

  ---

  ### **4. The Sporting Parallel and Divergence**  
  **Shared Logic**:  
  - Both use **medical gatekeeping** to permit otherwise banned interventions (e.g., inhalers for asthmatics).  
  - Both appeal to **"natural" performance**: Altitude training is "natural"; transfusions are "artificial."  

  **Key Differences**:  
  - **Zero-Sum vs. Non-Zero-Sum**: Sport is purely competitive; academia combines competition with absolute mastery. Thus, anti-doping rules prioritize **purity of performance** ("spirit of sport"), while academic integrity prioritizes **authenticity of achievement**.  
  - **Coherence**: Anti-doping’s rationale *is* more coherent:  
    - **Explicit Contract**: Athletes consent to a level playing field where advantages from "unnatural" means are banned.  
    - **Bright(er) Lines**: Banned substances are listed; therapeutic exemptions require proof of medical *need* (not just benefit).  
  - **University Policy’s Unique Burden**: It must balance fairness, welfare, and education’s intrinsic goals. A stimulant may undermine authenticity but support welfare—forcing a trade-off anti-doping avoids.  

  ---

  ### **Synthesis and Path Forward**  
  Your committee’s distinction relies on a **normative view of human functioning**: Health is the absence of pathology that impedes core human capabilities. This view is value-laden but not arbitrary—it aligns with social commitments to equal opportunity.  

  **Recommendations**:  
  - **Acknowledge Vagueness**: Set severity thresholds for accommodations (e.g., ADHD must impair ≥2 life domains).  
  - **Decouple Integrity from Disability Policy**: Academic integrity rules should focus on *fraud* (e.g., illicit drug procurement) and *unfairness* (e.g., access disparities), not medical status.  
  - **Transparent Cost Containment**: Separate "medical necessity" from resource limits (e.g., "Growth hormone isn’t covered for idiopathic short stature due to cost, not medical philosophy").  

  The restoration/enhancement distinction is imperfect but ethically grounded. Abandoning it for pure "capacity neutrality" sacrifices the moral logic that justifies aiding the sick—while anti-doping’s stricter ethos cannot map onto academia’s pluralistic aims.
