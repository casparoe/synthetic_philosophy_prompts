  Okay, the user is diving deep into the replication crisis in psychology and its implications for scientific realism, particularly through the lens of the pessimistic meta-induction (PMI). They want a disciplined mapping—focusing on the target of the induction, whether psychology's crisis is structurally different from historical cases like phlogiston, and what this means for PMI itself. They're stuck on the lack of successor theories in psychology's case and whether this makes realism harder to defend.  

  First, I need to clarify the target of PMI here. The user mentions unobservable posits, causal claims, and statistical practices. In psychology's replication failures (e.g., ego depletion), the core issue isn't necessarily that the unobservables (like "ego" or "willpower") were falsified in isolation—it's that the entire causal claim ("willpower depletion causes X") collapsed when the effect vanished under rigorous testing. So the target seems to be mid-level causal claims bundled with their methodological scaffolding. That's different from historical PMI cases where posits (like phlogiston) were replaced by new entities (oxygen).  

  The user is sharp to notice the "successor theory" gap. In classic PMI, realism survives because successor theories explain why old theories worked approximately (e.g., phlogiston explained combustion in limited contexts). But in psychology, effects like ego depletion didn't just get refined—they evaporated. There's no deeper theory explaining why they seemed real before; it was mostly methodological noise (p-hacking, publication bias). This hits realism harder because there's no preservation of explanatory structure—just exposure of fragile methods.  

  Where does this leave PMI? It suggests PMI needs refinement: it conflates "theory failure due to ontological error" (phlogiston) with "claim failure due to methodological fragility" (ego depletion). The latter doesn't indict unobservables per se; it indicts how we test them. So PMI might overreach if applied naively to psychology. But crucially, psychology's crisis doesn't doom all science. Fields with robust measurement (e.g., particle physics) or mature causal models (e.g., evolutionary biology) anchor their posits more firmly. The user's fear of pessimism "spreading" is valid but containable: science isn't monolithic. Variability in methodology maturity matters.  

  Breaking points in the analogy: PMI assumes theories are abandoned for better ones. But in psychology, we're often left with a null, not a successor. Also, historical PMI targets ontologies (what exists), while replication crises often target epistemic reliability (what we can know given flawed methods). Different beasts.  

  Final take: The crisis hurts realism about psychology specifically by revealing how methodologically mediated its claims are. But it doesn't kill realism broadly—it just shows that for less mature sciences, realism requires extra caution. PMI itself needs to distinguish between failures of ontology and failures of practice. The user's itch for "where pessimism stops" is answered by looking at fields where methods and metaphysics are more tightly coupled.
answer: |-
  Here's a disciplined mapping of the psychology replication crisis onto the Pessimistic Meta-Induction (PMI), addressing your core questions about targets, structural differences, implications for realism, and the PMI itself:

  ---

  ### **1. Target of the Pessimistic Meta-Induction Here**
  - **Primary Target**: **Mid-level causal claims** (e.g., "ego depletion impairs self-control," "power posing alters hormone levels") and their **statistical support structures**.  
  - **Secondary Target**: **The reliability of the field's epistemic practices** for generating stable knowledge.  
  - *Not the Target*: Broad unobservable posits (e.g., "cognitive processes," "unconscious motives") or overarching theories (e.g., cognitive architecture). The crisis attacks specific effects embedded in a web of methodological and statistical practices, not deep ontology.

  ---

  ### **2. Structural Difference from Classic PMI Cases**
  | **Classic PMI Cases** (Phlogiston, Aether)          | **Psychology Replication Crisis** (Ego Depletion, etc.)       |
  |-----------------------------------------------------|---------------------------------------------------------------|
  | Theory abandoned due to **ontological mismatch** (wrong entities). | Effects abandoned due to **epistemic fragility** (no underlying causal structure to explain). |
  | Successor theory **explains why old theory appeared successful** (e.g., phlogiston captured oxidation; aether fit Galilean transforms). | **No successor theory emerges**; effects vanish under rigorous methods. No deeper mechanism explains initial results. |
  | Failure reveals **approximate truth** preserved structurally (e.g., energy conservation). | Failure reveals **methodological artifacts** (p-hacking, publication bias) with no preserved structure. |
  | Problem: **False ontology**. | Problem: **Unreliable epistemology**. |

  **Key Difference**: Classic PMI attacks the *content* of theories (what exists). The replication crisis attacks the *process* of science (how we know). Psychology’s failures lack a "preservation base" for realism because there’s nothing to preserve—no latent structure explaining past success.

  ---

  ### **3. Implications for Scientific Realism**
  - **Hits Realism Harder in Psychology**: Precisely because there is no successor theory. Realist rescues (structural preservation, explanatory continuity) fail when effects dissolve into noise. This suggests **local anti-realism about specific effects and their supporting methodologies** is warranted.  
  - **But Misses Realism About Unobservables Broadly**: The crisis doesn’t undermine realism about *all* psychological constructs (e.g., memory encoding, attentional biases), many of which are robust. It targets **claims inflated by flawed statistical practices**.  
  - **Lands on Statistical Practice**: The core failure is **inferential overreach**—treating statistical artifacts (e.g., p < 0.05) as evidence for real causal structures. This is a crisis of *evidence*, not metaphysics.

  ---

  ### **4. Impact on the Pessimistic Meta-Induction Itself**
  The replication crisis forces refinements to PMI:
  - **Successor-Theory Clause Needed**: PMI should distinguish between:  
    - **(A) Theory rejection with preservation** (classic PMI: realism survives).  
    - **(B) Effect dissolution with no preservation** (psychology crisis: local pessimism).  
    PMI overgeneralizes if it treats (B) like (A).  
  - **Posits vs. Methods Distinction**: PMI traditionally targets ontological posits. The crisis shows we need a separate "**pessimistic induction over scientific methods**": *"Many past methodologies produced false positives; therefore, current methodologies likely do too."*  
  - **PMI Was Never Purely Metaphysical**: The crisis reveals PMI as an **epistemic warning** about scientific *practices*, not just theories. It’s a tool to enforce methodological humility.

  ---

  ### **5. Does Local Pessimism Spread? Where It Stops**
  - **Why It Doesn’t Necessarily Spread**:  
    - **Maturity Gradient**: Psychology relies heavily on noisy, multivariate human behavior; particle physics relies on precise, controlled detectors. Differences in **domain tractability** matter.  
    - **Methodological Robustness**: Fields with pre-registration, high-powered designs, and replication norms (e.g., genomics) are less vulnerable.  
    - **Convergent Evidence**: Realist commitments are stronger where effects are confirmed via **multiple experimental pathways** (e.g., ATP in biochemistry vs. a single social-psych paradigm).  
  - **Where It *Does* Spread**: To fields with similar **epistemic risk factors**:  
    - Low-powered studies (e.g., neuroscience).  
    - Uncontrolled variables (e.g., epidemiology).  
    - Pervasive publication bias (e.g., management science).  
  - **Where It Stops**: At fields with:  
    - **Strong predictive success** (e.g., orbital mechanics).  
    - **Engineered artifacts** (e.g., semiconductors work because quantum theory is reliable).  
    - **Direct manipulation of entities** (e.g., CRISPR gene editing relies on accurate DNA models).  

  ---

  ### **6. Breaking Points in the Analogy**
  - **No Discernible Structure to Preserve**: When effects vanish entirely (no "approximate truth"), the classic PMI framework doesn’t apply.  
  - **Blurred Line Between Posit and Method**: In psychology, the "effect" (e.g., ego depletion) is inseparable from its measurement (e.g., Stroop task post-taxing activity). Failure is methodological, not ontological.  
  - **No Successor, Just Absence**: Unlike phlogiston → oxygen, ego depletion → *null* offers no continuity. This voids preservationist arguments.  

  ---

  ### **Conclusion**
  The replication crisis **hurts realism about specific psychological claims** more than classic PMI cases because it reveals **epistemic holes, not ontological progress**. It forces PMI to split into two arguments: one against unreliable *methods* (applying widely), and one against unstable *posits* (applying selectively). Local pessimism in psychology is justified but contained by **methodological rigor and domain constraints** elsewhere. The crisis ultimately shows that the PMI is less a metaphysical sledgehammer and more a diagnostic tool for scientific practice.
