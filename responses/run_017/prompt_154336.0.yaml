  **Simplified Practical Procedure**:

  1. **Adjust probabilities for bias and thin data** for each project (for both funding levels) as described.
  2. **Apply the common shock** to get the overall success probability for each project.
  3. **Mandatory project**: always include at 100%.
  4. **Barrier test for worst-case (all fail)**: ensure that after spending on the mandatory project, the base is still above £12m. If not, we have a problem (escalate to investment committee).
  5. **Rank the projects** by a score that is the Kelly fraction for the single project: score = p - (1-p)/(M-1), but only for funding at 100% and 70% separately. For each project, we have two scores: for 100% and for 70%. We take the maximum score over the two funding levels, and the corresponding funding level. But note: the score might be negative, in which case we would not fund the project.
  6. **Select projects** in descending order of this score. For each project, if its score is positive and we haven't reached the capacity (8 projects) and the barrier test and the budget constraint (80% of base) allow, we add it at the funding level that gave the maximum score.
  7. **Capacity adjustment**: after selecting a project, if the total number of projects is >8, then reduce the success probability of every project in the portfolio by 10% for each project over 8. We do this by multiplying the success probability by (1 - 0.1*(N-8)) for N>8.
  8. **Barrier test after each addition**: after adding a project, check:
        - Total investment <= 0.8 * W
        - W - total investment >= 12m
     If not, skip the project and continue to the next.
  9. **Common shock and correlation**: we have not explicitly included the common shock in the portfolio growth, but we have already adjusted the probabilities for the common shock. The ranking score uses the overall probability that includes the common shock. The barrier test is for the worst-case (all fail) which includes the common shock.

