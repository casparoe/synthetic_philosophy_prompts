  **Answer to the CFO**:

  " Our procedure maximizes the long-run growth rate of the program's budget, which is the most reliable way to avoid falling below the £12m threshold and to compound the base over time. It is true that expected value maximization would allocate capital to the highest-EV projects first. However, EV maximization does not account for risk of ruin (falling below £12m) or for the multiplicative nature of compounding. In particular, if we take on a project with high expected value but also high variance, we might experience a string of losses that depletes the base and triggers a shutdown, even though the project had a positive EV. The Kelly criterion (which we have adapted) balances growth and risk by sizing each investment so that the bankroll grows at the fastest sustainable rate. It is a proven strategy in repeated-bet settings. 

  Moreover, our projects have correlated failures (due to bad seasons) and capacity constraints, which make the portfolio effect nontrivial. Simply ranking by EV and funding until the money runs out would over-concentrate in high-risk, high-return projects and could lead to catastrophic losses in a bad year. Our procedure explicitly accounts for these correlations and constraints.

  However, we acknowledge that in the very near term and in a one-off decision, EV maximization might yield a higher expected base in the next cycle. But our goal is to sustain and grow the program over many cycles, and for that, we must prioritize survival and steady growth. "

  The real argument parts:
    - The risk of ruin is a real argument.
    - The multiplicative nature of compounding and the advantage of maximizing long-run growth rate.
    - The correlation and capacity constraints are real.

  The change of framing:
    - The switch from one-off EV to long-run growth is a change of framing, but it is a valid and necessary one for a repeated game.

  **What the procedure cannot do**:

    - The procedure assumes that the base is the entire bankroll and that it is used as such. However, the base is part of a larger firm that can absorb variance. If the firm is willing to recapitalize after a bad year, then the risk of ruin is not an absorbing barrier. In that case, we might be overly conservative. The breaking point: if the firm has a history of topping up the program, then the barrier at £12m is not a true ruin. We should then use a less conservative criterion. What would change our mind: if the CFO states that the firm will not let the program fall below £12m and will recapitalize if needed.

    - The procedure relies on the probability estimates being unbiased after shrinkage. If the breeders are systematically overoptimistic and the shrinkage is not enough, we will still overallocate to marginal projects. We can cheaply measure the calibration of the breeders over time: track their forecasted probabilities against actual outcomes in a holdout set. If the observed success rate is consistently below the forecasted probabilities, we should increase the shrinkage (increase `k` or adjust the prior mean).

    - The horizon is not infinite: the corporate review cycle is 18 months after falling below £12m. This means that we must survive not just one cycle but a sequence of cycles until the review. Our barrier test only checks the immediate worst-case (total loss in one cycle). We should also simulate a string of bad years. A more robust barrier test would require that after the current cycle's investment, the base is at least £12m plus a buffer for the next cycle's operating expenses. However, we have reserved 20% for the autumn cycle, which provides some buffer.

    - The procedure might misfire by being too conservative in a bull market (when there are many good projects) or too aggressive in a bear market. In particular, the common shock might hit and cause several projects to fail together, which we model, but the capacity constraint adjustment is a rough estimate. We would not notice until after a bad year that the per-project success rate dropped more than 10% per extra project.

    - The most load-bearing assumption is that the capital behaves as a multiplicative bankroll with an absorbing barrier. If the firm's risk tolerance is higher (i.e., they are willing to recapitalize), then we are leaving money on the table. The next most critical assumption is that the probability adjustments are sufficient. 

    - Extrapolations past the growth-rate argument:
          - The Kelly criterion is for an infinite horizon. For a finite horizon (especially a short one), it may be optimal to take more risk. We have addressed this by the barrier test (which ensures survival in the worst-case).
          - Without recapitalization, the barrier is truly absorbing, and our procedure is sound. With recapitalization, we might be too conservative.

    - Cheap measurement: 
          - Track the forecasted probabilities versus actual outcomes to improve the shrinkage.
          - Simulate the procedure on historical data to see if it would have avoided the years that caused previous programs to fail.

  **Conclusion**:

  Given the complexity, we have provided a detailed procedure that is computable in a spreadsheet for up to 10 projects. In practice, we might need to use simulation for the expected log growth, which might be done in a day for a small number of projects. Alternatively, the simplified ranking procedure is a practical fallback.

  In the cases, we have shown how the procedure would work.

  For the exploration budget: it is coherent if it is sized as a fixed small percentage of the base (say 2-5%) and used only for projects that have positive expected value but a negative Kelly fraction (and strategic importance). It should be replenished only from the base's growth, and when it's empty, no exploration. This allows for learning without risking the core bankroll.
answer: |-
  ### Allocation Procedure for Seed Variety Development Programme

  **Objective**: Allocate the programme's base (current bankroll) to candidate lines to maximize long-run growth while avoiding a fall below £12m. The procedure accounts for lumpy investments, correlated failures, capacity constraints, biased probabilities, and the mandated project.

  ---

  ### Step-by-Step Procedure for the Team
  *Run this sequence every cycle (spring and autumn). Use a spreadsheet for calculations.*

  1. **Initialize Parameters**:
     - Current base (£W$), e.g., £18m.
     - Threshold: £12m.
     - List all candidate projects (including mandated project) with:
       - Investment required at 100% and 70% funding (£I_{\text{full}}$, £I_{70\%}$).
       - Champion's success probability ($p_{\text{champ}}$).
       - Analyst's success probability ($p_{\text{analyst}}$) and reference class size ($n$).
       - Expected payoff multiple on success ($M$), including distribution if available.
     - Set constants:
       - Capacity limit: 8 projects.
       - Per-project degradation rate: 10% per project over capacity.
       - Bad-year probability: 12.5% (1 in 8 years).
       - Bad-year success probability: 8%.
       - Shrinkage factor: $k = 5$ (weight for Bayesian adjustment).

  2. **Adjust Probabilities for Bias and Thin Data**:
     - For each project, calculate the **adjusted success probability**:
       $$
       p_{\text{adj}} = \frac{n \cdot p_{\text{analyst}} + k \cdot \text{historical\_avg}}{n + k}
       $$
       - Historical average = 35% (baseline success rate).
       - Use $p_{\text{analyst}}$, not $p_{\text{champ}}$, to mitigate optimism.
       - If $p_{\text{analyst}}$ is unavailable, use $p_{\text{champ}}$ but increase $k$ to 8 (stronger shrinkage).
     - Apply **funding-level adjustment**:
       - At 70% funding: $p_{70\%} = 0.8 \times p_{\text{adj}}$.
       - At 100% funding: $p_{\text{full}} = p_{\text{adj}}$.

  3. **Account for Common Shock (Bad Year)**:
     - Adjust probabilities for systemic risk:
       $$
       p_{\text{final}} = \left(\frac{7}{8} \times p_{\text{funding}}\right) + \left(\frac{1}{8} \times 0.08\right)
       $$
       - $p_{\text{funding}}$ is $p_{\text{full}}$ or $p_{70\%}$.

  4. **Mandated Project**:
     - Automatically include at 100% funding.
     - Use $p_{\text{final}}$ and $M$ as provided (no adjustment for capacity yet).

  5. **Barrier Test (Worst-Case)**:
     - Calculate total investment ($I_{\text{total}}$) if all candidate projects (including mandated) are funded at 100%.
     - **Hard no if**:
       $$
       W - I_{\text{total}} < £12\text{m}
       $$
       - *Escalate to committee*: Request capital infusion or de-prioritize non-mandated projects.

  6. **Select Projects and Funding Levels**:
     - **Rank projects** by **expected growth density (EGD)**:
       $$
       \text{EGD} = \frac{p_{\text{final}} \cdot \log(1 + f \cdot (M - 1)) + (1 - p_{\text{final}}) \cdot \log(1 - f)}{I_{\text{funding}}}
       $$
       - $f$ = Fraction of base invested ($I_{\text{funding}} / W$).
       - Calculate EGD for both 100% and 70% funding levels.
     - **Greedy selection**:
       - Start with the mandated project.
       - Add the project with the highest EGD that satisfies:
         - Capacity: Total projects ≤ 8 (no degradation).
         - Budget: Total investment ≤ 80% of $W$ (reserve 20% for autumn cycle).
         - Barrier: $W - I_{\text{total}} \geq £12\text{m}$ (post-investment base).
       - If adding a project exceeds capacity:
         - Apply degradation: Reduce $p_{\text{final}}$ for all projects by 10% per project over 8.
         - Recalculate EGD with degraded $p_{\text{final}}$.
       - Stop when:
         - No projects have positive EGD, or
         - Budget/capacity/barrier constraints bind.

  7. **Cannibalization/Correlation Adjustment**:
     - If projects are near-duplicates (e.g., same trait, different backgrounds):
       - For the first project in the pair, use full $M$.
       - For subsequent projects, reduce $M$ by **cannibalization factor** (e.g., 50%):
         $$
         M_{\text{eff}} = M \times (1 - 0.5 \cdot p_{\text{first}})
         $$
         - $p_{\text{first}}$ = success probability of the first project.
       - Recalculate EGD with $M_{\text{eff}}$.

  8. **Final Check and Escalation**:
     - **Recalculate barrier test** with selected portfolio.
     - **Hard no if**:
       - Post-investment base < £12m.
       - Expected log growth rate < 0 (entire portfolio).
     - **Escalate to committee if**:
       - A project with negative EGD is strategically critical (e.g., Case A: flagship long-shot).
       - Cannibalization/correlation adjustments change the portfolio materially.
       - Budget exceeds 80% of base but high-growth opportunities exist.

  9. **Output**:
     - List of funded projects, funding levels, and total investment.
     - Expected log growth rate of the base.
     - Probability of cohort-wide failure and post-failure base.

  ---

  ### Response to CFO: "Why Not Highest Expected Value (EV) First?"

  > "Our goal is to maximize the programme's long-run growth rate while avoiding irreversible failure (base < £12m). A highest-EV approach ignores three critical risks: (1) **Bankroll depletion**: High-EV projects often have high variance; losses compound and risk triggering shutdown. (2) **Correlated failures**: In bad years (1 in 8), cohort-wide failure drops the base suddenly—EV ignores this tail risk. (3) **Capacity degradation**: Overloading strains resources, lowering all projects' success rates.  
  >   
  > Our method optimizes for **survival and compounding** by sizing bets proportionally to edge and bankroll. It is mathematically proven (Kelly criterion) to outperform EV maximization in repeated bets. While EV ranking might yield higher *expected* base in a single cycle, it risks the programme's existence over multiple cycles—a tradeoff that aligns with corporate's tolerance for restart risk (55 jobs lost on closure).  
  >   
  > **Real argument (85%)**: Survival, compounding, and constraints.  
  > **Framing shift (15%)**: Prioritizing geometric mean growth over arithmetic mean payoff."

  ---

  ### Case Applications

  #### **Case A: Flagship Long-Shot**
  - **Parameters**:  
    $I_{\text{full}} = £2.2\text{m}$, $M = 40$, $p_{\text{champ}} = 8\%$, $p_{\text{analyst}} = 2.5\%$ (mid), $n = 8$.  
  - **Adjustments**:  
    $p_{\text{adj}} = \frac{8 \cdot 0.025 + 5 \cdot 0.35}{13} = 15.4\%$  
    $p_{\text{final}} = (7/8 \cdot 0.154) + (1/8 \cdot 0.08) = 14.1\%$  
  - **Kelly Fraction**:  
    $f^* = 0.141 - \frac{1 - 0.141}{39} = 11.9\%$  
    Investment fraction = $£2.2\text{m} / £18\text{m} = 12.2\%$ (≈ Kelly, borderline).  
  - **Verdict**:  
    - Barrier test: Fails if total cohort investment > £6m (since $18 - 6 = 12$).  
    - Likely **rejected** due to barrier risk or capacity constraints.  
  - **Exploration Budget**:  
    - **Coherent if**: (1) Sized ≤ 5% of base (£0.9m), (2) Funded from base growth (not principal), (3) Used only for projects with +EV but -Kelly fraction.  
    - Case A qualifies ($\text{EV} = 0.025 \cdot 40 - 1 = 0$).  
    - If exploration budget is empty, **reject or escalate**.

  #### **Case B: Dull Elite Backcross**
  - **Parameters**:  
    $I_{\text{full}} = £1.9\text{m}$, $M = 2.4$, $p_{\text{full}} = 0.6$, $n = 14$.  
  - **Adjustments**:  
    $p_{\text{adj}} = \frac{14 \cdot 0.6 + 5 \cdot 0.35}{19} = 53.4\%$  
    $p_{\text{final}} = (7/8 \cdot 0.534) + (1/8 \cdot 0.08) = 47.7\%$  
    $p_{70\%} = 0.8 \cdot 0.534 = 42.7\%$ → $p_{\text{final}} = 38.5\%$  
  - **Kelly Fraction**:  
    - 100% funding: $f^* = 0.477 - \frac{0.523}{1.4} = 10.4\%$ (good).  
    - 70% funding: $f^* = 0.385 - \frac{0.615}{1.4} = -5.4\%$ (reject).  
  - **Verdict**:  
    - **Fund at 100%** (higher growth density).  
    - If two available: Fund one at 100%; second only if barrier/capacity allow and EGD >0 after degradation.

  #### **Case C: Near-Duplicates**
  - **Parameters**:  
    Two projects, $p_{\text{analyst}} = 0.4$, $M = 3.0$ each.  
  - **Adjustments**:  
    $p_{\text{adj}} = \frac{8 \cdot 0.4 + 5 \cdot 0.35}{13} = 38.1\%$ → $p_{\text{final}} = 34.2\%$.  
  - **Cannibalization**:  
    - First project: $M = 3.0$, $f^* = 0.342 - \frac{0.658}{2.0} = 1.3\%$ (fund).  
    - Second project: $M_{\text{eff}} = 3.0 \cdot (1 - 0.5 \cdot 0.342) = 2.49$,  
      $f^* = 0.342 - \frac{0.658}{1.49} = -10.0\%$ (reject).  
  - **Verdict**: **Fund only the first project**.

  ---

  ### Limitations and Breaking Points
  1. **Bankroll Assumption**:  
     - **Assumption**: Base behaves as a multiplicative bankroll with an absorbing barrier at £12m.  
     - **Breaking point**: If corporate recapitalizes after bad years (barrier not absorbing), the procedure is **too conservative**.  
     - **Test**: Track corporate’s response to losses over 2 years. If base falls below £15m but no recapitalization occurs, the assumption holds.  
     - **Misfire**: Avoiding high-EV, high-variance projects (Case A) may leave money on the table if recapitalization is likely.

  2. **Probability Estimates**:  
     - **Assumption**: Shrinkage ($k=5$) and reference-class adjustments yield unbiased $p_{\text{final}}$.  
     - **Breaking point**: If breeders’ forecasts are systematically optimistic (e.g., actual success rates < 80% of forecasts), expected growth is overstated.  
     - **Test**: Track forecast vs. actual success rates for 2 years. If underperformance >20%, increase shrinkage ($k=8$) or use analyst-only probabilities.  
     - **Misfire**: Overfunding marginal projects, unnoticed until cumulative failures deplete the base.

  3. **Finite Horizon vs. Infinite Growth**:  
     - **Extrapolation**: Kelly maximizes asymptotic growth, but corporate reviews impose 18-month horizons. The barrier test bridges this gap.  
     - **Failure mode**: String of bad years triggers a review before the portfolio’s edge materializes.  
     - **Mitigation**: Simulate 3-year failure probability; if >30%, reduce project count.

  4. **Correlation Model**:  
     - **Assumption**: Common shock (bad years) is the only correlation.  
     - **Breaking point**: If project failures correlate *within* good/bad years (e.g., disease strain specificity), risk is underestimated.  
     - **Test**: Analyze historical failure clustering beyond bad years.  
     - **Misfire**: Unanticipated cohort failure in a "good" year drops base below £12m.

  **Conclusion**: The procedure’s survival focus is justified given the stakes (jobs, programme continuity). However, if recapitalization is likely, shift toward EV maximization with a barrier constraint. Track forecast calibration and failure clustering yearly to refute assumptions.
