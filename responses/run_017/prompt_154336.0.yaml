              - For the second one, payoff = M_i * c_i * (1 - cannibalization_factor) on success if the first one also succeeds, and M_i * c_i if the first one fails.
        - This makes the projects' returns dependent in a way that is not captured by the common shock. This would require a custom adjustment in the simulation. In the simplified procedure, we can:
              a. If both are in the candidate list, we only allow the one with the highest score.
              b. Or, we reduce the multiple for the second one by the cannibalization factor for the purpose of the score.

