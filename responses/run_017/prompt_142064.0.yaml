  Killer counterargument: If Molinists define CCFs as brute facts (not modelable causally), the whole interventionist framing becomes irrelevant. But that just pushes the problem to epistemology - how God knows brute facts about indeterministic systems.

  Timeline seems manageable: weeks 1-2 for framework setup, 3-4 for modeling, 5-6 for providential cases, 7 for objections, 8 for synthesis. Scoping to one case study (e.g. Judas' betrayal) would help if pressed for space.

