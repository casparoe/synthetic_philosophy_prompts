  ### Decision Tree for Units of Selection

  **Root:** Trait T has increased in frequency across generations in a population. What is the unit/level of selection?

  1. **Is T a property of a replicator (e.g., allele, gene) that is directly inherited?**  
     - *Yes*: Go to 2  
     - *No*: Go to 8  

  2. **Does T bias its own transmission independently of organismal fitness?**  
     - *Yes*: **Leaf A: Strict Replicator-Level Selection**  
       - Characterization: Selection acts directly on the replicator via transmission distortion (e.g., meiotic drive).  
       - Awkward commitment: Ignores organismal costs even when severe.  
       - Tag: **Causation**  
     - *No*: Go to 3  

  3. **Does T increase the bearer’s expected offspring count?**  
     - *Yes*: **Leaf B: Organism-Level Selection**  
       - Characterization: T’s increase is driven by its benefit to individual survival/reproduction.  
       - Awkward commitment: Cannot explain traits costly to the bearer.  
       - Tag: **Causation**  
     - *No*: Go to 4  

  4. **Does T increase the expected offspring count of the bearer’s relatives?**  
     - *Yes*: **Leaf C: Kin Selection / Inclusive Fitness**  
       - Characterization: T spreads via indirect fitness benefits to genetically similar individuals.  
       - Awkward commitment: Requires measurable relatedness and additive fitness effects.  
       - Tag: **Bookkeeping**  
     - *No*: **Leaf H: Pluralist View**  
       - Characterization: T’s increase can be formally modeled at multiple levels (e.g., gene, individual, group) with identical outcomes.  
       - Awkward commitment: Avoids specifying a primary causal level.  
       - Tag: **Bookkeeping**  

  8. **Is T a property of a single organism?**  
     - *Yes*: Go to 9  
     - *No*: Go to 15  

  9. **Is T genetically inherited?**  
     - *Yes*: Go to 10  
     - *No*: Go to 14  

  10. **Does T reduce the bearer’s expected offspring count?**  
      - *Yes*: Go to 11  
      - *No*: **Leaf B: Organism-Level Selection**  

  11. **Do T’s benefits primarily go to the bearer’s relatives?**  
      - *Yes*: **Leaf C: Kin Selection / Inclusive Fitness**  
      - *No*: Go to 12  

  12. **Is there variation in T’s frequency among groups?**  
      - *Yes*: Go to 13  
      - *No*: **Leaf H: Pluralist View**  

  13. **Do groups with higher T frequency produce more offspring groups?**  
      - *Yes*: **Leaf D: Group Selection (Interdemic)**  
        - Characterization: T spreads due to differential productivity of groups, despite individual cost.  
        - Awkward commitment: Requires group heritability and minimal migration.  
        - Tag: **Causation**  
      - *No*: **Leaf H: Pluralist View**  

  14. **Is T developmentally plastic and influenced by parentally modified environments?**  
      - *Yes*: **Leaf I: Resisting Framing (Niche Construction/Developmental Systems)**  
        - Characterization: T’s increase arises from cross-generational feedback between organisms and environment.  
        - Awkward commitment: Rejects "unit of selection" as separable from developmental context.  
        - Tag: **Explanation**  
      - *No*: **Leaf H: Pluralist View**  

  15. **Is T a property of a group (e.g., colony, deme)?**  
      - *Yes*: Go to 16  
      - *No*: Go to 20  

  16. **Is T heritable at the group level?**  
      - *Yes*: Go to 17  
      - *No*: **Leaf H: Pluralist View**  

  17. **Do groups with T produce more daughter groups?**  
      - *Yes*: Go to 18  
      - *No*: **Leaf H: Pluralist View**  

  18. **Can T’s frequency change be fully explained by individual-level fitness differences?**  
      - *Yes*: **Leaf E: Multilevel Selection (Collective Fitness as Average of Members)**  
        - Characterization: Group-level change is an arithmetic re-averaging of individual fitnesses.  
        - Awkward commitment: Obscures emergent group properties.  
        - Tag: **Bookkeeping**  
      - *No*: **Leaf F: Multilevel Selection (Collective Fitness as Collective Output)**  
        - Characterization: Groups with T produce more daughter groups due to irreducible group traits.  
        - Awkward commitment: Demands evidence that group effects cannot be partitioned to individuals.  
        - Tag: **Causation**  

  20. **Is T a property of a species or clade?**  
      - *Yes*: **Leaf G: Species/Clade-Level Selection**  
        - Characterization: T increases due to differential speciation/extinction of lineages.  
        - Awkward commitment: Requires heritable species-level traits decoupled from organismal fitness.  
        - Tag: **Causation**  
      - *No*: **Leaf I: Resisting Framing**  

