  - **Stalling point: Node 15 (Is T a property of a group?)**  
    - Why: "Group" typically implies subpopulations (e.g., demes), not species. Users may question if species qualify as "groups" for selection or if they belong in node 20. The tree defines "group" as suborganismal collectives (e.g., colonies), resolving species at node 20.
