  ### Diagnostics

  #### 1. Indistinguishable Leaf Pairs  
  - **Leaf C (Kin Selection) & Leaf D (Group Selection)**: Indistinguishability is **formal**. Both model the same causal process (altruism) but partition fitness differently; kin selection uses relatedness-weighted individual fitness, while group selection uses group productivity.  
  - **Leaf E (Multilevel-Average) & Leaf H (Pluralist)**: Indistinguishability is **practical**. If group fitness is exactly the average of member fitness, pluralism argues that labeling it "group selection" is arbitrary bookkeeping.  

  #### 2. Unoccupied Regions of Logical Space  
  - **Non-reproducing groups with heritable traits**: Empty due to **incoherence**. If groups lack "reproduction" (node 17), heritability (node 16) cannot drive selection.  
  - **Non-genetic, non-plastic traits with group benefits**: Empty due to **unattractiveness**. If T isn’t inherited (nodes 9, 14) and lacks group heritability (node 16), no mechanism sustains increase.  
  - **Species-level traits reducible to organismal fitness**: Empty due to **incoherence**. Node 20 assumes species properties are emergent (e.g., speciation rate); if reducible, it defaults to Leaf E or H.  

