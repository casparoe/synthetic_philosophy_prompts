prompt: |-
  Hey — I'm TAing an intro metaphysics course and I've got the dispositions tutorial next week, one fifty-minute group, first-years who've done counterfactuals (world-similarity, antecedent strengthening, that sort of thing) but nothing on dispositions beyond the slogan that 'fragile' just means 'would break if struck'. I was talking with the other TA and we couldnt agree on how to run it: she wants to open with the counterexamples, I want them to feel the pull of the simple conditional analysis first. What I actually want them to leave with is the sense that the two ways it fails are *seperate* failures — the fink case, where the stimulus itself destroys or removes the disposition, versus the mask case, where the disposition is still there but something blocks the manifestation — and not just two versions of 'the thing didn't break'. So don't write me the explanation; plan how I should run the session.

  The bit I'm least sure about is order: what has to be on the board before the first counterexample lands, whether fink or mask should come first and why, how long to sit with the plain case so the counterexample actually bites, and where the repair attempts belong relative to the two cases — the 'in normal conditions' / ceteris paribus clause, and the move of identifying the disposition with its intrinsic causal basis instead of a counterfactual. Also the example: my instinct is one object in three variants (wine glass: bare / rigged / padded), but I'm worried they'll just learn three labels and never see the structure, so tell me what the carrying example needs and doesn't need and whether a minimal-pair version beats the sci-fi version — they groan at guardian angels and hidden wiring. I was going to try an electrical fuse as a real-world fink, then realised a fuse does conduct for a split second before it melts, which seems to make it useless as a counterexample unless I build the duration into the response. Is that the right way to rescue it, or should I drop it?

  Misconceptions I'm expecting, which I want defused at the point in the sequence where they actually arise rather than in a list at the end: that fink and mask are the same failure; that if the manifestation is blocked the thing was never really fragile; that finks are gerrymandered and couldn't happen in nature; and that 'in normal conditions' fixes everything. Two curveballs I want handled rather than dodged, and I want to know where in the session each fits: (1) my coin-flip fink — a glass wired so that when struck there's a 70% chance a mechanism hardens it, so it usually doesn't break: is this a fink, a mask, or something else, and does it push us toward a probabilistic conditional analysis? (2) a glass that is both padded (mask) and, unknown to anyone, chemically toughened by the padding process ten minutes earlier (fink): which label applies, and is that a real problem or just a boring case of both? Finally, give me one question to put at the end that tells me whether they've got the distinction or just memorised the words — it should be a case they haven't seen — and tell me explicitly what I should refuse to get drawn into at this level (I'd guess dispositional essentialism and the realism-about-powers debate, but tell me what you'd cut).
reasoning: |-
  Okay, let me tackle this TA's dilemma. They need a lesson plan on dispositions for intro metaphysics students, focusing on distinguishing finkishness from masking. The core challenge is sequencing: when to introduce counterexamples, how to make the distinction stick, and handling common misconceptions. 

  First, I'm noticing the tension between wanting students to feel the pull of the simple conditional analysis (SCA) first versus diving straight into counterexamples. The TA's instinct to build intuition for SCA before complicating it makes sense—students need to understand why the analysis seems appealing before seeing why it fails. 

  For the object example, a wine glass in three variants (bare/rigged/padded) could work if we emphasize the structural difference rather than just labeling cases. The carrying example might be clearer though—no sci-fi elements, just a person carrying something heavy. Key is contrasting "ability actively removed mid-test" (fink) versus "ability intact but blocked" (mask). 

  The electrical fuse counterexample is salvageable if we specify the disposition as "conducting electricity when voltage is applied" and note the fuse melts before current flows. Better to use this real-world case than guardian angels. 

  Timing-wise: spend 10 mins on SCA intuition-building, then introduce fink cases (15 mins), then mask cases (15 mins). Explicitly compare them side-by-side before repair attempts. The coin-flip fink should come after both classic cases—it's a hybrid that tests probabilistic understanding. The double-case glass is best saved for the distinction-reinforcement phase. 

  Common misconceptions need addressing in flow: when discussing fink cases, preempt "gerrymandered" objections by noting real-world examples like airbag sensors. When introducing masks, shut down "wasn't really fragile" by emphasizing intrinsic basis versus extrinsic blockers. 

  The end should test conceptual transfer: "A fire alarm that normally sounds when smoke is detected, but has its circuit fried by the same heat that causes smoke during a real fire." Make them identify the failure mode. 

  Crucially, avoid rabbit holes: no dispositional essentialism debates, no realism arguments. Stick to conditional analysis mechanics. The repair attempts? Mention "normal conditions" only to show why it fails against finks, and save intrinsic basis for the very end as a teaser for future topics.
answer: |-
  Here's a battle-tested lesson plan focused on **sequence, clarity of distinction, and managing misconceptions** for your 50-minute tutorial:

  **Core Goal:** Students distinguish *finkishness* (disposition removed *during* stimulus) from *masking* (disposition present but manifestation blocked) as *structurally different* failures of the Simple Conditional Analysis (SCA).

  **Key Principle:** Build intuition for SCA *first*, then hit it with *one* counterexample type at a time, *explicitly compare* them, *then* discuss repairs.

  **Materials:** Whiteboard or projector. Key terms pre-written: Disposition, Stimulus, Manifestation, SCA, Finkish Disposition, Masked Disposition.

  **(0-10 mins) Feeling the Pull of SCA:**
  1.  **Hook:** "What does it *mean* to say this glass is fragile?" Elicit: "It would break if struck." Write SCA: **`D(S,M) iff (S □→ M)`** (Fragile iff struck □→ breaks).
  2.  **Intuition Pump:** Use a **plain wine glass**. Ask: "If I strike it (gently but sufficiently), what happens? Why call it fragile *now*?" Reinforce: SCA captures our basic intuition. *This feels right.*
  3.  **Generalize:** Apply SCA to other examples (e.g., "Sugar is soluble iff put in water □→ dissolves", "This wire is conductive iff voltage applied □→ current flows"). Board: Column 1 - Disposition (D), Stimulus (S), Manifestation (M).
  4.  **Emphasize:** SCA is simple, intuitive, and links dispositions directly to observable counterfactual behavior. *This is the baseline we're testing.*

  **(10-25 mins) Introducing FINKISHNESS:**
  1.  **Transition:** "But is it *always* this simple? What if something *interferes*?"
  2.  **The Fink Case (Use REAL-WORLD FUSE):**
      *   "Consider a standard electrical fuse. Its job? To be conductive *unless* too much current flows, then it *melts* to break the circuit and prevent fire."
      *   **SCA Claim:** "Is the fuse conductive? SCA says: Conductive iff voltage applied □→ current flows."
      *   **The Counterexample:** "Imagine applying a massive voltage surge *just* high enough to melt the fuse *instantly*. What happens?"
          *   Voltage applied (S) happens.
          *   BUT, the surge melts the fuse wire *before any significant current can flow* (M does *not* occur).
          *   **Crucially:** The *same* stimulus (applying the high voltage) *destroys* the disposition (conductivity) *during* the attempt to manifest it. The disposition *vanishes* mid-process.
      *   **Board:** Column 2 - Fink Case. D: Conductive, S: Apply Voltage, M: Current Flows. **SCA Prediction:** M *should* happen. **What Happens:** Fuse melts instantly → No significant current flow → M *fails*. **Why?** S *removes* D. **Label:** FINKISH DISPOSITION.
  3.  **Key Question:** "Is the fuse *really* conductive *at the moment S occurs*? (Yes, intrinsically). But does SCA hold? (No!). Why not? (S itself *destroys* D before M can happen)."
  4.  **Address Misconception (Gerrymandering):** "Are finks 'cheating' or unnatural? No! Airbags (deploy on impact, changing the car's 'crumbliness'), safety cut-offs, biological feedback loops – systems designed to *remove* a disposition *in response to* the stimulus are common. The fuse is real."

  **(25-40 mins) Introducing MASKING:**
  1.  **Transition:** "Okay, SCA fails if the stimulus *destroys* the disposition. But is that the *only* way it fails?"
  2.  **The Mask Case (Use PADDED GLASS):**
      *   "Back to fragility. Take a *perfectly ordinary* fragile wine glass."
      *   **SCA Claim:** Fragile iff struck □→ breaks.
      *   **The Counterexample:** "Now, carefully pack this glass in incredibly dense, impact-absorbing packing foam. Really wedge it in there. Now, strike the *foam* (hard enough that it *would* break the bare glass). What happens?"
          *   Stimulus (strike) occurs.
          *   Glass *remains* fragile (intrinsically unchanged!).
          *   BUT, the foam absorbs/deflects the force → The glass *does not* break (M fails).
      *   **Board:** Column 3 - Mask Case. D: Fragile, S: Struck, M: Breaks. **SCA Prediction:** M *should* happen. **What Happens:** Force blocked → No break → M *fails*. **Why?** Something *external* (foam) *prevents* S from *causing* M, *even though D is still present*. **Label:** MASKED DISPOSITION.
  3.  **Key Question:** "Is the glass *still* fragile inside the foam? (Yes!). Why didn't SCA hold? (The disposition was *there*, but something *interfered* with the causal link between S and M)."
  4.  **Address Misconception ("Not Really Fragile"):** "Did the foam make the glass *intrinsically* non-fragile? No! Take it out of the foam – it's just as breakable as before. The fragility is masked, not removed."

  **(40-45 mins) Explicit Comparison & Core Distinction:**
  1.  **Side-by-Side on Board:** Point to Fink Column vs. Mask Column.
  2.  **CRITICAL QUESTION:** "What is the *fundamental difference* between what happens in the Fink case and the Mask case regarding the disposition *itself* when the stimulus is applied?"
      *   **Fink:** The disposition **is REMOVED/DESTROYED** *by* (or *during*) the stimulus. (Conductivity *stops* when voltage is applied).
      *   **Mask:** The disposition **is still PRESENT**, but something **BLOCKS** the manifestation. (Fragility *remains*, but force is blocked).
  3.  **Emphasize:** "These are *different mechanisms of failure* for SCA. Fink: D vanishes. Mask: D is present but M is thwarted. *Two distinct problems*."

  **(45-55 mins) Handling Curveballs & Testing Distinction:**
  1.  **Coin-Flip Fink (Glass w/ 70% Hardening):**
      *   Present it. Ask: "Fink or Mask? Or something else?"
      *   **Guide:** The stimulus (strike) *might* trigger a mechanism that *removes* the fragility (hardens it). If it hardens, fragility is *removed* – that's **Finkishness** (probabilistic: only happens 70% of the time). If it doesn't harden, it might break *unless* masked. This pushes towards a *probabilistic* analysis, but the *mechanism* (removing D) is finkish when it occurs.
  2.  **Double Trouble Glass (Padded + Chemically Toughened):**
      *   Present it. Ask: "Which label(s) apply?"
      *   **Guide:** The *padding* is **Masking** (blocking force). The *chemical toughening* (if triggered by padding application) is **Finkishness** (removing fragility). It's a boring case of **both** happening simultaneously to the same object. No deep problem, just illustrates the independence of the mechanisms.
  3.  **The TEST Question (Novel Case - End of Session):**
      *   "Imagine a match. It's flammable – it would light if struck. But it's been dipped in a special chemical. **The chemical does TWO things: (1) It makes the match head slightly damp, so friction isn't enough to ignite it immediately. (2) The heat generated by the initial friction *activates* the chemical, which rapidly *dissolves* the flammable compound in the match head before it can catch fire.** Is the failure of flammability here due to finkishness, masking, both, or neither? EXPLAIN."
      *   **What you want:** (1) The dampness **masks** flammability (blocks initial ignition despite disposition being present). (2) The heat-triggered dissolution **finks** flammability (stimulus heat removes the disposition). **BOTH** are present. If they identify both mechanisms correctly, they've got it. If they just say "both" without the *why*, probe.

  **Where Repairs Belong & What to Cut:**
  *   **"Normal Conditions" Clause:** Mention it *after* both counterexamples are understood. Ask: "Could adding 'in normal conditions' fix SCA?" Briefly discuss: It *might* help with masks (packing foam isn't "normal" for testing fragility), but **it fails against finks** (applying voltage *is* the "normal" test condition for conductivity, but the fuse *fails* SCA under those very conditions because S removes D). Board: "Normal Conditions helps Mask? Maybe. Fails for Fink."
  *   **Intrinsic Causal Basis:** Briefly foreshadow as the *next step*: "One sophisticated response is to say dispositions aren't *defined* by the counterfactual, but are real properties (the glass's molecular structure, the wire's material) that *ground* the counterfactual *when* it holds. But that's a topic for another day..." **DO NOT get into details.**
  *   **CUT:** Dispositional Essentialism, realism vs. anti-realism debates about powers, Lewis's reformed conditional analysis, Martin's electro-fink details. **Stick strictly to:** SCA, Fink (D removed *by* S), Mask (D present, M blocked), the distinction between them, and why "normal conditions" isn't a magic bullet.

  **Example Choice Rationale:**
  *   **Stick with Wine Glass (bare / rigged-fink / padded-mask):** It's intuitive. The key is your **narration**.
      *   For Fink: **Emphasize the mechanism:** "The *instant* it's struck, a sensor triggers..." (even if imaginary, focus on the *structural change*). Better than fuse if fuse timing confuses you.
      *   For Mask: **Emphasize the intrinsic stability:** "The glass itself is *unchanged*; it's still just as brittle. The foam is *stopping the force*."
  *   **Carrying Example (If Preferred - Minimal Pair):**
      *   **SCA:** "X is carry-able (by person P) iff P tries to lift X □→ P lifts X."
      *   **Fink:** X is a (magic) box that *instantly* becomes superglued to the table *if* P tries to lift it. Disposition (lift-ability) *removed* by the attempt.
      *   **Mask:** X is a normal box, but it's bolted to the table. Disposition (lift-ability) present, but bolts *block* the lifting. **Needs:** Clear intrinsic property (weight/shape) for "carry-able", a stimulus (trying to lift), and distinct mechanisms for removal (fink) vs. blocking (mask). Avoids sci-fi if "bolted" is used for mask and "superglue mechanism" for fink is deemed too sci-fi (use "electromagnet engages" if needed).
  *   **Fuse Rescue:** It *can* work if you define the disposition and manifestation precisely: "Conductive *at time t*" vs. "Current flows *sustained for duration d*". Emphasize: "The massive voltage surge melts the filament *so fast* that *no significant current flows before the circuit is open*." The SCA fails because S (applying that voltage) causes D to vanish *before* M (significant current flow) occurs. If this feels messy, **use the wine glass fink.**

  **Misconception Management (In-Flow):**
  *   **"Same Failure"**: Explicitly contrast Fink (D removed) vs. Mask (D present) on the board during comparison.
  *   **"Not Really Fragile (Mask)"**: Hammer the point: "Intrinsically, is it fragile? YES. The mask is external."
  *   **"Finks are Unnatural"**: Use the real fuse example (or airbag sensor: impact removes "crumbliness" by deploying bag).
  *   **"'Normal Conditions' Fixes Everything"**: Show it fails for the Fink case under normal testing conditions (striking the glass *is* normal, applying voltage *is* normal).

  **This plan prioritizes:** Building intuition for SCA -> Isolating Fink -> Isolating Mask -> Explicit Comparison -> Testing Distinction. The curveballs come last as application exercises, and repairs are handled minimally to avoid detours. Good luck!
