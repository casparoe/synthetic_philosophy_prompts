prompt: |-
  Writing a problem sheet on rationalisability for second-years and I've realised I don't actually know whether my own position hangs together, so: here's roughly where I've landed, tell me what's broken.

  1. My working test for "what common belief in rationality permits" in a finite normal-form game is iterated elimination of strictly dominated strategies, with mixed strategies allowed as dominators.
  2. I never worry about the order of deletion, or whether you cross things out one at a time or all in one go — for strict dominance I've always just assumed it can't matter.
  3. I'm slightly uneasy about mixed dominators, because I also hold that a rational player only randomises when indifferent; but I allow them anyway, since in the little 3x3 I knocked up (row player's payoffs 4/0/2, 1/1/1, 0/4/2) the middle row only goes out if you let a mixture do the work.
  4. I then ran the same routine on a three-player example — three firms each picking one of two platforms, no communication between them — and wrote in the solutions that the surviving strategies are exactly the ones compatable with common belief in rationality.
  5. When the strict version leaves too much standing, I also bin weakly dominated strategies and don't fuss about the order there either, e.g. I'm happy to delete down to the bottom in traveller's-dilemma-style games.

  Which pairs genuinely clash, which only look like they do, and what's the cheapest fix each time? Rank the tensions by severity rather than flagging all of them as equally bad, and if one of my case verdicts (the 3x3, or the three-firm thing) isn't actually delivered by what I say elsewhere, say so plainly and tell me which commitment has to go.
reasoning: |-
  Okay, the user is designing a problem sheet on rationalizability for second-year students and has realized they might have inconsistencies in their approach. They've outlined five key points about their methodology and want to know where the conflicts lie, how severe they are, and how to fix them cheaply.

  First, I need to unpack each of their points. Point 1 states they use iterated elimination of strictly dominated strategies (IESDS) with mixed strategies as dominators. That's standard for rationalizability in finite games. Point 2 mentions they don't worry about deletion order for strict dominance, which is correct since order doesn't matter for strict dominance. But they should note that weak dominance is order-dependent.

  Point 3 reveals unease about mixed dominators because they believe rational players only randomize when indifferent. This is a conflict because mixed strategies in IESDS can eliminate pure strategies even if no pure strategy dominates them, like in their 3x3 example. The middle row is eliminated only by a mixed strategy, which contradicts their indifference principle for randomization.

  Point 4 talks about a three-player example where they claim surviving strategies after IESDS are exactly those compatible with common belief in rationality. This is accurate only if mixed strategies are allowed in the elimination process. Without mixed strategies, more strategies might survive, so their approach here depends on allowing mixed dominators.

  Point 5 mentions they eliminate weakly dominated strategies when strict dominance isn't enough and don't worry about order. But weak dominance elimination is order-dependent, which can lead to different results based on the sequence. This clashes with their assumption that order doesn't matter.

  The main tensions are:
  1. Allowing mixed dominators (point 1) vs. believing players only randomize when indifferent (point 3). This is a severe conflict because the indifference principle isn't met when mixed strategies are used to eliminate others. The user's 3x3 example relies on a mixed strategy to eliminate the middle row, but if players only mix when indifferent, that mixed strategy wouldn't be chosen actively to dominate others.

  2. Applying weak dominance elimination without considering order (point 5) is problematic because the order affects outcomes. For example, in the Traveler's Dilemma, deleting in a specific order might lead to different results. This is a medium-severity issue since it can lead to incorrect or inconsistent solutions.

  3. The three-player example's outcome depends on allowing mixed dominators. If they retract mixed strategies, their solution might not hold, meaning they need to adjust either their method or the example.

  The cheapest fixes:
  - For the mixed strategy conflict: Bite the bullet and allow mixed strategies in IESDS, explaining that rational players can consider mixed strategies as possibilities even if they end up playing pure. Or, teach IESDS with pure dominators only, but then their 3x3 example wouldn't work as the middle row wouldn't be eliminated.
  - For weak dominance: Avoid it entirely for rationalizability or note that order matters and use caution. Since weak dominance is messy, sticking to strict dominance is safer.
  - For the three-player example: If they keep mixed strategies in IESDS, the example holds. If not, they need to revisit the solution.

  The user's unease about mixed strategies is valid based on their belief about randomization. Addressing that inconsistency is crucial. They might need to clarify that considering mixed strategies doesn't mean players will use them, but they help in eliminating non-rationalizable strategies. Alternatively, they could present rationalizability as including mixed strategies and separately discuss when players actually randomize.
answer: |-
  Your position has internal tensions, but they're fixable. Here's a breakdown of clashes, severity rankings, required fixes, and verdicts on your examples. The core issue is mixing **behavioral** principles (when players randomize) with **epistemic** definitions (what beliefs justify elimination).

  ### Ranking of Tensions (High to Low Severity)
  1.  **Mixed Dominators vs. Randomization Only Under Indifference (Point 1 vs. Point 3)**
      *   **Severity:** High (Fundamental conceptual clash)
      *   **Nature of Clash:** Allowing mixed strategies as dominators (Point 1) is essential for standard rationalizability (Pearce 1984) and captures the full power of "common belief in rationality." It implies players consider *any* belief (including probabilistic ones) over opponents' strategies. However, your stance that "a rational player only randomizes when indifferent" (Point 3) is a behavioral rule about what a player *does*. Rationalizability is about what they *can believe and consider*, not what they necessarily play. Using a mixed strategy to *dominate* another strategy doesn't require the *dominating player* to actually *play* that mixture; it just shows that the *dominated strategy* is never a best response to *any* belief (probabilistic or pure) the player could hold. Your unease stems from conflating the justification for elimination (beliefs) with the action rule (play).
      *   **Cheapest Fix:** **Bite the bullet on mixed dominators.** Clarify the distinction:
          *   *Rationalizability (IESDS with mixed dominators):* Defines the set of strategies that *could* be played by a rational player who has *beliefs* (including probabilistic ones) consistent with common belief in rationality. This *allows* for the *consideration* of mixed strategies as beliefs about others *and* as potential dominators.
          *   *Actual Play:* A rational player, *when choosing their action*, only uses a mixed strategy if indifferent between the pure strategies in its support. They might *consider* many mixed strategies of opponents (justifying elimination), but only *play* mixed when indifferent.
      *   *Alternative Fix (Costly):* Abandon mixed dominators. Use IESDS *only with pure dominators*. This yields the **Iterated Undominated** set, which is larger than the rationalizable set. You must then abandon your 3x3 example verdict (Point 3) – the middle row *survives* pure-strategy IESDS since no pure strategy dominates it.

  2.  **Ignoring Order for Weak Dominance (Point 5)**
      *   **Severity:** Medium (Results in incorrect/unreliable solutions)
      *   **Nature of Clash:** Order of deletion *absolutely matters* for iterated elimination of *weakly* dominated strategies (IEWDS). Different sequences can lead to different surviving sets. Claiming it doesn't matter (Point 5) is incorrect. The Traveler's Dilemma is particularly sensitive; deleting in the "wrong" order might not lead to the low-payoff outcome.
      *   **Cheapest Fix:** **Avoid IEWDS for defining rationalizability.** Strictly state that common belief in rationality is characterized by IESDS *with mixed dominators*. For games where this leaves "too much" (like Traveler's Dilemma), present IEWDS as a *heuristic* or *refinement* (e.g., illustrating a plausible path), but explicitly note:
          1.  The result depends on the order.
          2.  It relies on stronger epistemic assumptions than common belief in rationality alone (e.g., admissibility, trembles, or specific belief revision policies).
      *   *Alternative Fix:* If you *must* use IEWDS definitionally, adopt a specific order convention (e.g., "all-at-once" deletion per round, maximal elimination per round) and state it clearly. Acknowledge this is a refinement.

  3.  **Three-Player Example Verdict (Point 4)**
      *   **Severity:** Low (Depends entirely on Fix for #1)
      *   **Nature of Clash:** Your verdict ("surviving strategies are exactly compatible with common belief in rationality") is **correct ONLY IF** you allow mixed dominators in the IESDS process (Point 1). If you switch to pure-strategy IESDS (as a fix for #1), your verdict is likely incorrect – more strategies would survive than are rationalizable.
      *   **Fix:** Your verdict is sound **if and only if** you maintain your Point 1 (mixed dominators allowed). If you abandon mixed dominators (to resolve #1), you must abandon this verdict.

  4.  **Ignoring Order for Strict Dominance (Point 2)**
      *   **Severity:** None (You are correct)
      *   **Nature of Clash:** There is no clash here. Your assumption is correct: for **strict** dominance (with pure or mixed dominators), the final set of surviving strategies is **order-independent**. Deleting one-by-one or all-at-once per round yields the same result. This is a key property of strict dominance.

  ### Verdicts on Your Cases
  1.  **Your 3x3 Example (Point 3):**
      *   **Your Claim:** Middle row is eliminated only via mixed dominance.
      *   **Compatibility:** This claim **depends critically** on allowing mixed dominators (Point 1). If you insist players only randomize when indifferent (Point 3) and *disallow* mixed dominators for this reason, the middle row **survives** IESDS. Your verdict requires Point 1.
      *   **Resolution:** You must choose:
          *   **(Recommended):** Keep Point 1 (mixed dominators allowed) and Point 4 verdict. Explain that the mixed strategy demonstrates the middle row is *never* a best response to *any belief* (probabilistic or not), hence eliminated under common belief in rationality. The fact that a rational player wouldn't *play* that mixture unless indifferent is irrelevant to the dominance argument.
          *   **(Alternative):** Abandon the elimination of the middle row in this example. Concede that only pure-strategy IESDS is used, resulting in a larger surviving set.

  2.  **Three-Player Platform Example (Point 4):**
      *   **Your Claim:** Surviving strategies = Compatible with CBR.
      *   **Compatibility:** This verdict is **correct ONLY IF** mixed dominators are allowed in the IESDS process (Point 1). If you use only pure dominators, the surviving set is larger than the rationalizable set, making your verdict false.
      *   **Resolution:** Maintain Point 1 to keep this verdict valid.

  ### Summary of Required Fixes & Path Forward
  1.  **Resolve the High-Severity Clash (Points 1 vs 3):** Embrace mixed dominators for IESDS as defining rationalizability. Decouple this from the behavioral rule about actual randomization. Clarify to students:
      *   *"Common belief in rationality implies a strategy is played only if it is a best response to some belief (possibly probabilistic) about others' play, which itself is consistent with CBR. This justificiation allows us to eliminate strategies dominated *even* by mixed strategies. However, when a rational player chooses their action, they will only randomize if truly indifferent between the pure strategies involved."*
  2.  **Fix the Medium-Severity Clash (Point 5):** Remove IEWDS as a definitional tool for CBR. Use it cautiously as a heuristic/refinement only, explicitly noting order dependence and stronger epistemic requirements. Stick to IESDS (with mixed dominators) for the core definition.
  3.  **Confirm Low-Severity Verdict (Point 4):** Your three-player verdict stands *only* because you correctly used mixed dominators. Ensure your solution reflects that.
  4.  **Rejoice (Point 2):** Your confidence in order-independence for strict dominance is well-placed.

  **Cheapest Overall Path:** Keep Points 1, 2, and 4. Modify Point 3 (accept mixed dominators are necessary for the epistemic justification, separate from the action rule). Radically revise Point 5 (demote IEWDS to heuristic status, emphasize order dependence). This preserves your core examples and the standard definition of rationalizability while resolving the conceptual tension and avoiding the pitfalls of weak dominance. Your problem sheet can then cleanly present IESDS with mixed dominators as the operational test for common belief in rationality.
