prompt: |-
  I'm writing a paper on hedonism as a theory of welfare, and I keep getting stuck one step before where the standard accounts seem to begin: everyone argues about what pleasure *is*, and nobody says what an account of pleasure would have to be able to *do* before we'd be entitled to use it for the work hedonism wants done. So I want the specification first. Please write the desiderata for a theory of pleasure: what any adequate account must deliver, with the case or consideration behind each requirement, and with each marked as either non-negotiable or as a preference of one camp. Fix the purpose as follows, since adequacy is relative to it: the theory is to be good enough (i) to say what, if anything, makes a stretch of a life go better for the person living it; (ii) to be usable by people who actually measure well-being in practice — experience-sampling and day-reconstruction studies where subjects report a handful of labelled feelings, and welfare assessments of animals and pre-linguistic infants who report nothing at all; and (iii) to stay distinguishable from a desire-satisfaction view and from a mood- or happiness-based view, rather than collapsing into either. It is not required to be a metaphysically reductionist analysis of a natural kind, and it is not required to make hedonism true by definition.

  Here is my own draft list, which I suspect is part genuine and part prejudice, so please also tell me which of these are real desiderata and which are just preferences dressed up as requirements. Extensional coverage at both ends: the theory must handle, or explain away, scratching a poison-ivy itch; the click when a proof you've been stuck on finally comes together; the relief of learning a scary diagnosis was a false alarm; an hour spent rereading letters from someone who died, which you'd call good on the whole but which feels mostly like ache; a horror film you pay to see and describe as fun while covering your eyes; the grim satisfaction of being proved right about someone's downfall; a runner's high in the middle of exhaustion; total absorption in a task with no noticeable feeling at all; and the mild, entirely unnoticed comfort of a well-fitted shoe. On the other side, it must refuse to count the mere burn of food too hot to enjoy, the mere sensory intensity of a loud surprise, the mere fact that everything you wanted to be happening is happening (the experience-machine case), a good day's background mood, and the addicted gambler's compulsion. It must keep apart (a) a pleasure's occurring, (b) its being noticed, and (c) its being endorsed or valued by the agent; and it must keep apart how pleasant an experience is from how much it contributes to the person's welfare, so that a degrading pleasure or a pleasure you'd rightly feel guilty about is not thereby a small one. It must allow pleasures to differ in kind and not only in intensity and duration — the old complaint about reducing everything to quantity — while still supplying some exchange rate that makes pleasures comparable within a life, comparable across persons, and aggregable enough to sum; it must fit with the fact that wanting and liking can come apart and that no single neural signature for pleasantness has turned up; and it must let one experience be mixed rather than carrying a single scalar valence.

  The part I most want is the structure of the list rather than the list itself. Flag any pair or subset of requirements you think cannot be jointly satisfied — in particular whether the demand that pleasures differ in kind can coexist with the demand for a scale you can aggregate and compare across people, given how coarse self-report is — and say which single requirement excludes the most candidates. Then, briefly, how the four standard families do against the list you ended up with: the view that pleasure is a distinctive felt quality; the view that it is a matter of enjoying or taking pleasure in something, in the attitudinal sense; the adverbial or representational view on which pleasure is a way of experiencing an object; and the desire-fulfillment view. Consider also, if you think the honest answer goes this way, a fifth option: that pleasure is not one thing at all but a family resemblance across states, and then say what we would have to give up — measurability, the exchange rate, perhaps the use of 'pleasure' in a theory of welfare altogether. A table is fine for the list.
reasoning: |-
  Hmm, the user is working on a paper about hedonism as a theory of welfare and is struggling with foundational issues. They're frustrated that discussions jump straight to defining pleasure without first establishing what criteria such a definition must satisfy. They want me to outline the desiderata for a theory of pleasure that would be adequate for their specific purposes: defining welfare, being measurable in practice (including with animals and infants), and distinguishing hedonism from desire-satisfaction or mood-based views.

  The user has provided their own draft list of requirements and wants me to evaluate which are genuine desiderata versus personal preferences. Their examples include various edge cases like scratching poison ivy, solving proofs, or rereading letters from deceased loved ones. They also emphasize the need to separate pleasure occurrence from notice and endorsement, allow for qualitative differences while maintaining comparability, and accommodate neuroscience findings about wanting versus liking.

  I need to structure this carefully. First, I'll organize the desiderata into three categories based on their purpose: welfare-theoretic adequacy, empirical usability, and conceptual distinctness. For each requirement, I'll specify whether it's non-negotiable or camp-dependent, and provide the justification behind it.

  The user's draft list seems mostly valid, but I should note where some items might be negotiable. For example, the requirement for cross-person comparability might be stronger than necessary, and the demand for explaining every counterexample could be excessive. The wanting/liking dissociation is well-supported by neuroscience, while the lack of neural signature is a current empirical observation that might change.

  Major tensions exist between qualitative diversity and quantitative aggregation - these may be fundamentally incompatible. Also, handling pre-linguistic subjects while avoiding collapse into desire views is tricky. The most exclusionary requirement is probably the need to separate valence from welfare contribution, as it rules out many straightforward definitions.

  For evaluating standard theories: Felt-quality views struggle with mixed experiences and measurement. Attitudinal theories handle complexity well but blur lines with desire views. Adverbial theories are elegant but may not resolve aggregation issues. Desire-fulfillment views directly violate the distinctness requirement. The family resemblance approach sacrifices precision but may be most honest to the phenomena.

  I'll present this in a structured table first, then add explanatory notes about tensions and theory evaluations. The table should make the relationships clear, while the narrative can address the user's deeper concerns about whether a unified theory is even possible given their constraints.
answer: |-
  Here is a structured list of desiderata for a theory of pleasure, derived from your purpose and draft, categorized by core function, with justification and negotiability. Your draft items are largely genuine requirements, with a few noted as negotiable preferences. A table summarizes the desiderata, followed by analysis of tensions, exclusionary requirements, and how standard theories fare.

  **Desiderata for a Theory of Pleasure (Purpose: Foundational for Hedonistic Welfare)**

  | **Category**                     | **Desideratum**                                                                 | **Case/Justification**                                                                                                                                                             | **Negotiability**           |
  | :------------------------------- | :------------------------------------------------------------------------------ | :--------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :-------------------------- |
  | **I. Welfare-Theoretic Adequacy** | **1. Define Positive Valence:** Account for what makes an experience *positively valenced* or "feel good" in a way that constitutes a welfare benefit. | Core to hedonism: welfare *is* positive experiential valence. Without this, the theory fails its primary purpose.                                                                     | **Non-negotiable**          |
  |                                  | **2. Separate Valence from Welfare Contribution:** Valence (pleasantness) must be distinct from *how much* it contributes to welfare. A pleasure can be intense yet contribute little (or negatively) to overall welfare due to context (degradation, guilt, long-term harm). | Degrading pleasures, "guilty pleasures," pleasures harmful to future states. Hedonism needs valence as the *currency*, but its *value* can be context-dependent.                            | **Non-negotiable**          |
  |                                  | **3. Handle Mixed/Complex Experiences:** Account for experiences that are not purely pleasant or unpleasant but contain elements of both (e.g., bittersweet memories, challenging effort). | Rereading letters from a deceased loved one (ache + comfort), runner's high amidst exhaustion, grim satisfaction. Life experiences are often complex.                                   | **Non-negotiable**          |
  |                                  | **4. Allow for Qualitative Differences:** Pleasures must differ in *kind* (quality, source) beyond just intensity and duration. | The "old complaint": reducing solving a proof, savoring wine, and scratching an itch to mere intensity/duration seems phenomenologically inadequate and ignores how we value experiences. | **Preference (Hedonist Camp)** |
  |                                  | **5. Provide Aggregation/Comparability:** Supply a principle (even if rough) for comparing different pleasures *within a life* (Is an hour of reading poetry better than 30 mins of chocolate?), aggregating them over time, and making *some* interpersonal comparisons (crucial for policy/ethics). | Necessary for hedonism to be a practical theory of welfare assessment across time and between individuals. Without comparability, welfare summation is impossible. | **Non-negotiable**          |
  | **II. Empirical Usability**      | **6. Accommodate Pre-Linguistic/Non-Reporting Subjects:** Be applicable to infants and non-human animals who cannot self-report. | Welfare assessments for infants (pain management) and animals (animal welfare science) are crucial practical applications.                                                             | **Non-negotiable**          |
  |                                  | **7. Interface with Measurement Tools:** Be compatible with methods like Experience Sampling (ESM) and Day Reconstruction (DRM) that rely on self-reports of labelled feelings (happy, sad, stressed, excited, etc.) and observable behavior. | Essential for empirical research on well-being. The theory must make sense of what these methods are (imperfectly) capturing.                                                           | **Non-negotiable**          |
  |                                  | **8. Account for Wanting/Liking Dissociation:** Accommodate neuroscientific/behavioral evidence that the mechanisms driving "wanting" (incentive salience) and "liking" (hedonic impact) are distinct and can dissociate. | Addicted gambler's compulsion (high wanting, low/negative liking), sensory-specific satiety (liking decreases while wanting may persist).                                                | **Non-negotiable**          |
  |                                  | **9. Allow Unnoticed/Background Pleasures:** Distinguish the *occurrence* of a pleasant state from the *attention paid to it* or its conscious notice. | Mild comfort of a well-fitted shoe, background warmth of sunshine. Welfare benefit shouldn't depend solely on introspection.                                                         | **Non-negotiable**          |
  | **III. Conceptual Distinctness** | **10. Distinguish from Desire-Satisfaction:** Must not collapse into the view that pleasure *is* the satisfaction of a desire occurring within the experience. | Experience Machine: All desires about experience are satisfied, but (arguably) no genuine positive valence/welfare if disconnected from reality. Mere "everything going as wanted" isn't sufficient. | **Non-negotiable**          |
  |                                  | **11. Distinguish from Mood/Happiness:** Must not collapse into a global, dispositional state like a "good mood" or "happiness as life-satisfaction." | A good day's background mood vs. specific pleasant experiences within it. Hedonism focuses on moment-to-moment affect, not global evaluations.                                           | **Non-negotiable**          |
  |                                  | **12. Separate Occurrence, Notice, & Endorsement:** Clearly distinguish (a) the pleasant state occurring, (b) the agent noticing/attending to it, and (c) the agent endorsing/valuing it as good. | Enjoying a horror film while covering eyes (occurrence + notice, but perhaps not full endorsement/value). Relishing a guilty pleasure (occurrence + notice, endorsement conflicted). | **Non-negotiable**          |
  | **IV. Extensional Adequacy (Illustrative, derived from I-III)** | **13. Include Key Cases:** Must plausibly include: relief of false alarm, click of insight, runner's high, absorption (if pleasant), grim satisfaction (if pleasant), horror film fun (if pleasant), bittersweet rereading (pleasant aspect). | Core, diverse examples of putative positive valence contributing to welfare.                                                                                                  | **Preference (Test Cases)** |
  |                                  | **14. Exclude Key Non-Cases:** Must plausibly exclude: mere sensory intensity (loud noise), mere desire-satisfaction in absence of positive valence (Exp Machine), mere compulsion without liking (addicted gambler), mere background mood. | Cases that violate distinctness from desire-satisfaction or mood, or lack positive valence despite other features.                                                                 | **Preference (Test Cases)** |

  **Analysis of Your Draft:** Your list is overwhelmingly genuine desiderata. The only items leaning towards "preference dressed as requirement" are:
  *   **Extensional Coverage Demands (13 & 14):** While crucial for testing, demanding a theory *must* handle *every* specific edge case perfectly (like explaining away poison ivy scratching as either pleasant or not welfare-relevant) is a very high bar. *Requiring* plausible handling is fair; demanding *definitive* handling of every case risks being a preference. *Negotiability: Preference (Test Cases)*.
  *   **Qualitative Differences (4):** While a strong desideratum for many (and phenomenologically compelling), a strict quantitative hedonist *could* argue all that matters is intensity/duration, sacrificing quality distinctions. Your purpose (distinguish from desire/mood) doesn't strictly require it, though aggregation (5) is harder without it. *Negotiability: Preference (Hedonist Camp)*.
  *   **Cross-Person Aggregation:** Your draft emphasizes this. While *intra*-personal comparability/aggregation (5) is non-negotiable for hedonism, the feasibility and necessity of *precise inter-personal* comparison/aggregation is debated (e.g., for policy vs. individual life guidance). *Negotiability: Partially Preference (Scope of Theory)*.

  **Tensions and Exclusionary Power:**

  1.  **The Central Tension: Diversity vs. Aggregation (4 vs. 5):** This is the most significant conflict. How can pleasures be fundamentally different *kinds* of states (solving proofs vs. eating cake) yet be placed on a single, commensurable scale of "pleasantness units" for aggregation and comparison, especially across individuals with potentially different qualitative sensitivities? Self-report (7) is indeed coarse, often reducing diverse states to a few labels or a 1-10 scale, potentially masking qualitative differences. This tension is *the* core challenge for sophisticated hedonism. A theory satisfying both (4 & 5) likely needs complex resources (e.g., multi-dimensional valence, contextual weighting).
  2.  **Pre-Linguistic Measurement vs. Conceptual Purity (6 vs. 10 & 11):** How do we identify "pleasantness" in infants/animals without relying solely on behavior that looks like desire-satisfaction (violating 10) or expressions of general mood (violating 11)? This requires a behaviorally/neurally anchored concept of valence distinct from desire and mood.
  3.  **Most Exclusionary Requirement:** **#10 (Distinguish from Desire-Satisfaction)** is likely the most destructive. Many intuitive or naturalistic accounts link pleasure closely to desire fulfillment. The Experience Machine case is a powerful argument that this link isn't necessary or sufficient. A theory failing #10 essentially collapses hedonism into a form of desire theory regarding experiences, undermining its distinctness. #2 (Valence ≠ Welfare Contribution) also excludes simplistic views that equate "feels good" with "is good for you."

  **Evaluation of Standard Theories Against Desiderata:**

  | **Theory of Pleasure**       | **Key Mechanism**                                                                 | **Major Strengths**                                                                 | **Major Weaknesses Against Desiderata**                                                                                                  | **Overall Fit**                                     |
  | :--------------------------- | :-------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------------------------- | :-------------------------------------------------- |
  | **1. Felt Quality (Sensory/Simple)** | Pleasure is a distinctive, simple, introspectible feeling (like sweetness or warmth), common across experiences. | Simple, intuitive (1). Clear distinction from desire/mood (10, 11). Easy aggregation (5 - if qualities map to intensity). | Struggles *severely* with mixed/complex states (3), unnoticed pleasures (9), qualitative diversity (4), wanting/liking split (8). Fails extensional adequacy (e.g., absorption, bittersweet) (13,14). Very hard to apply to animals/infants without behaviorism (6). | **Poor.** Fails core non-negotiables (3, 6, 8, 9). |
  | **2. Attitudinal (Taking Pleasure In)** | Pleasure is an attitude (enjoying, being pleased by) directed towards some object/event/content of experience. | Excellent with mixed states (3 - can enjoy complex objects), qualitative diversity (4 - attitude towards diverse objects), unnoticed pleasure (9 - attitude can be non-reflective). Handles wanting/liking (8 - attitude ≠ desire). Distinguishes occurrence/notice/endorsement (12). | High risk of collapsing into desire-satisfaction (10 - "taking pleasure in X" often linked to wanting X). Distinguishing it from a mood-based *disposition* can be tricky (11). Aggregation (5) is conceptually difficult (how to measure/compare attitude intensities across diverse objects?). Animal application (6) requires behavioral proxies that might conflate with desire/mood. | **Strongest Contender.** Handles complexity well. Key challenge is safeguarding distinctness (10, 11) and aggregation (5). |
  | **3. Adverbial/Representational** | Pleasure is a *way* or *manner* of experiencing (e.g., "gratefully," "joyfully") or a positive representation of sensory/representational content. | Handles diversity (4 - different modes for different contents), mixed states (3 - different aspects experienced differently), potential for unnoticed background modes (9). Can integrate neuroscience. | Risk of circularity. Defining the "positive way" without invoking felt quality or attitude is hard. Aggregation (5) remains difficult. Distinction from desire (10) & mood (11) requires careful formulation. Application to animals/infants (6) complex. | **Promising but Vague.** Depends heavily on specific formulation to meet distinctness (10,11) and aggregation (5). |
  | **4. Desire-Fulfillment (Within Experience)** | Pleasure *is* the experience of one's current desire about the present experience being satisfied. | Easy aggregation (5 - desire strength/satisfaction intensity). Clear for pre-linguistic subjects (6 - desire inferred from behavior). | **Catastrophically violates #10.** *Is* the desire-satisfaction view. Experience Machine is a counterexample. Blurs notice/endorsement (12). Struggles with mixed states (3) and wanting/liking split (8). | **Incompatible.** Fails core non-negotiable (10). |
  | **5. Family Resemblance**    | "Pleasure" refers to a cluster of states linked by overlapping similarities (relief, joy, sensory delight, contentment, flow, etc.), not a single essence. | Matches phenomenal diversity (4), handles mixed states (3), easily accommodates wanting/liking (8) and neuroscience complexity. Avoids forcing a reduction. | **Sacrifices Aggregation/Comparability (5):** If states are fundamentally different, finding a common scale for summation and interpersonal comparison becomes highly problematic or impossible. Blurs boundaries with desire-satisfaction and mood (10, 11). Measurement (7) becomes fragmented. Weakens hedonism's core claim that welfare *is* one fundamental thing (positive valence). | **Honest but Costly.** Requires abandoning or radically redefining hedonism's quantitative, unified core (5), potentially making it unusable as a *theory of welfare* rather than a descriptive phenomenology. |

  **Conclusion:** Your focus on the pre-definitional requirements is astute. The desiderata reveal deep tensions, particularly between qualitative diversity (#4) and quantitative aggregation/comparability (#5), and the constant pressure to collapse into desire-satisfaction (#10) while remaining empirically applicable (#6, #7, #8). **#10 (Distinctness from Desire-Satisfaction)** is likely the most stringent filter. **Attitudinal theories** handle complexity best but must vigilantly guard against collapsing into desire views. **Adverbial theories** are promising but under-specified. The **Family Resemblance** view acknowledges reality but forces a choice: either abandon hedonism's core quantitative ambition (#5) or accept that "pleasure" might not be a unified enough concept to bear the full weight of a theory of welfare as currently conceived. Your paper's crucial step is demonstrating that no theory satisfies all desiderata perfectly, forcing a choice about which compromises are acceptable for a viable hedonism.
