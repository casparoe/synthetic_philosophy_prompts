prompt: |-
  Hi — I need something practical and I'd love your help. Please act as a professional philosopher who also knows a lot about evolutionary biology and signaling theory, take a few minutes to brainstorm freely before you commit to anything, and then write the final answer in American English, in under 900 words total.

  Some background: I help run a tiny volunteer fund that hands out micro-grants (a couple hundred up to about two thousand dollars) to local community projects — a community garden, a repair cafe, a kids' coding club, a meals-on-wheels type thing. We get around 150 applications a month, six volunteers read them on a Sunday afternoon with about ten minutes each, we approve roughly fifteen, and a three-person board signs off without reading them. Right now our discussion is basically vibes: "she sounds really commited", "this one feels like a real project." I hate it, because I think we keep funding people who are good at writing applications and missing people who are good at actually doing things. So I started reading on my own about costly signaling — the handicap principle, peacocks tails, the idea that a signal can only be honest if it's expensive in a way that someone lacking the underlying quality couldn't afford to fake — and I want to turn that into a real procedure my volunteers can run.

  Here's what I need: an ordered set of questions someone with no theory can work through in ten minutes on a grant application, telling them what counts as a good enough answer at each step, where the procedure just stops and says no, and where it has to hand the decision to a human because the question is really about our values and not a fact. Please think carefully about which distinctions have to survive the translation and which ones you can drop without gutting the idea. A few things I specifically want handled: my sense is that "expensive" is slippery, so I want the procedure to separate different kinds of cost — money, time, risk of embarrassment, opportunity cost — and crucially to ask "expensive for whom?", since a costly signal might just be a receipt for privilege (a slick video, a professional website) rather than evidence of the thing we care about, which is follow-through. There also seem to be signals that are honest not because they're costly but because they're a byproduct you literally can't fake — evidence that the thing already happened — and I'd like the procedure to treat those separately from conventional ones. And I read something once about how the very best candidates sometimes signal by *not* signalling, by being conspicuously modest, and we have applicants like that too; I don't want the procedure to punish them for it.

  Then please run it on three applications and show me the output, including one where the answer will annoy me: (1) a glossy two-minute professionally shot video plus a six-page business plan, from an applicant who works in marketing; (2) a messy, typo-filled application from someone who has been running a monthly repair meetup in a church hall for fourteen months and has photos with the same faces showing up; (3) my favorite — a refugee mutual-aid organizer with a genuinely moving story, tons of evident caring, and nothing at all that anyone can check. I'd rather you run the procedure honestly on all three than tell me what I want to hear. Finally, be straight with me about what this procedure can't do: where it will misfire, which judgment calls it dresses up as steps, and what fraction of the decision should stay with the humans no matter how good the checklist is.
reasoning: |-
  Okay, let me tackle this problem systematically. The user runs a micro-grant program struggling with subjective "vibes-based" evaluations that may favor polished applicants over genuine doers. They want a signaling theory-based screening procedure that separates real commitment from performance, while accounting for privilege and different cost dimensions.

  Hmm, the core challenge is translating abstract biological signaling concepts into practical grant evaluation steps. I need to identify key principles that survive translation: signal cost relativity (expensive for whom?), multiple cost dimensions (time/risk/opportunity), and byproduct signals (unfakable evidence). The procedure must avoid punishing modest applicants while flagging privilege-masked signals.

  First, I'll structure the evaluation around three phases: initial knockout checks, signal assessment with cost analysis, and human judgment flags. The knockout questions should target absolute requirements while the signal phase examines four cost dimensions with privilege awareness. For the "conspicuous modesty" issue, I'll add a bypass for strong byproduct evidence.

  Important nuances: "expensive" must be contextualized to the applicant's means. A $500 expense means different things to a marketing professional versus a refugee organizer. Also, separating conventional costly signals from unfakable byproducts is crucial - photos of ongoing work should weigh more than business plans.

  For the test cases: 
  The marketer's glossy materials should fail on disproportionate cost and privilege indicators. 
  The repair cafe's messy application should pass through byproduct evidence despite poor presentation. 
  The refugee organizer's case will likely hit multiple human judgment flags - their caring is evident but unverifiable, requiring value-based decisions.

  I should explicitly warn about limitations: this can't eliminate judgment calls (especially around values), may misfire on edge cases, and still requires human oversight for about 20-30% of decisions. The procedure mainly filters clear mismatches and structures ambiguity.

  The final output needs clear decision pathways: automatic rejections at knockout stage, proceed-to-fund for strong signals, and human deliberation flags. Instructions must emphasize contextual cost assessment to avoid privilege blindness.
answer: |-
  Here’s a practical 5-step signaling-based evaluation procedure, designed for 10-minute reviews. It prioritizes **unfakable evidence of commitment** while filtering privilege-distorted signals. Each step either rejects, approves, or flags for human judgment.

  ---

  ### **The Procedure**
  **Step 1: Knockout Check (1 min)**  
  *Question: "Is there concrete proof the project ALREADY EXISTS?"*  
  - **Good answer:** Photos/videos of active work, receipts for project-related purchases, participant sign-in sheets, social media updates >3 months old.  
  - **Weak answer:** Only promises, plans, or testimonials.  
  - **Stop & reject if:** No evidence of prior action.  
  - *Why?* Filters "idea-only" proposals. Byproduct signals (evidence you can’t fake without doing the work) are gold.

  **Step 2: Costly Signal Assessment (4 min)**  
  *Question: "What has the applicant INVESTED (time/money/risk/opportunity) relative to their means?"*  
  Breakdown:  
  - **Time:** Hours spent weekly (e.g., "40 hrs/month while working night shifts" > "a few hours").  
  - **Money:** % of their income spent (e.g., "$500 from a teacher’s salary" > "$500 from a CEO").  
  - **Risk:** Social/embarrassment exposure (e.g., "organized immigrant elders despite deportation fears" > "hosted a neighborhood BBQ").  
  - **Opportunity Cost:** What they gave up (e.g., "quit part-time job to run this" > "used vacation days").  
  - **Stop & reject if:** Investments seem trivial *for their context* (e.g., a lawyer spending $100).  
  - **Flag for human judgment if:** Investments are substantial but privilege distorts cost (e.g., slick video from a marketing pro).  
  - *Why?* Honest signals hurt to fake. Privilege makes money/time cheap for some.

  **Step 3: Anti-Privilege Filter (2 min)**  
  *Question: "Could these signals ONLY come from someone deeply embedded in the community/issue?"*  
  - **Good answer:** Local partnerships, niche knowledge (e.g., "using Somali elders to resolve disputes"), unique access (e.g., "volunteers are all housing-insecure").  
  - **Weak answer:** Generic professionalism (business plans, stock photos).  
  - **Reject if:** Signals are easily bought (e.g., expensive video + no local ties).  
  - *Why?* Isolates signals that require authentic presence, not just cash.

  **Step 4: Modesty Bypass (2 min)**  
  *Question: "If the application is understated, does BYPRODUCT EVIDENCE (Step 1) show traction?"*  
  - **Good answer:** Low-key application but strong proof of impact (e.g., "messy application w/ 50 photos of monthly repair events").  
  - **Flag for human judgment if:** Byproduct proof exists but is hard to interpret (e.g., refugee organizer’s oral history).  
  - *Why?* Avoids punishing quiet achievers. Byproduct evidence > self-promotion.

  **Step 5: Values Check (1 min)**  
  *Question: "Does this align with our mission, regardless of signals?"*  
  - **Flag for human judgment if:** Uncertain about community need, ethics, or scalability.  
  - *Always human territory: Values can’t be fully proceduralized.*

  ---

  ### **Test Runs**
  **Application 1: Marketer’s glossy video + business plan**  
  - **Step 1:** Fails. No evidence of existing work.  
  - **Step 2:** Professional materials cost little *for a marketer* (low relative cost).  
  - **Step 3:** Signals (video, plan) are generic, replicable by any pro.  
  - **Decision:** ❌ REJECT (fails Step 1, Step 3).  

  **Application 2: Messy repair cafe w/ photos**  
  - **Step 1:** Passes. Photos show recurring events with same attendees (unfakable byproduct).  
  - **Step 2:** High time cost (14 months), low money cost (church hall).  
  - **Step 3:** Niche community faces in photos = authentic embeddedness.  
  - **Step 4:** Modesty bypass triggered; byproduct evidence dominates.  
  - **Decision:** ✅ APPROVE.  

  **Application 3: Refugee mutual-aid organizer**  
  - **Step 1:** Mixed. "Moving story" isn’t proof; no verifiable byproducts. **Flag for human judgment.**  
  - **Step 2:** Caring is evident but unverifiable. Risk/effort implied but not proven.  
  - **Step 4:** No bypass (lacks byproduct evidence).  
  - **Decision:** ⚠️ FLAG for human review. Values call: Is "evident caring" enough without proof?  

  ---

  ### **Limitations & Caveats**
  1. **Judgment Dressed as Procedure:**  
     - "Relative cost" (Step 2) requires guessing applicants’ privilege. Volunteers might misjudge.  
     - "Embeddedness" (Step 3) can bias toward familiar community structures.  

  2. **Misfires:**  
     - **False negatives:** Exceptional newcomers with no track record get rejected at Step 1.  
     - **False positives:** Scammers can fake byproducts (e.g., staged photos).  

  3. **Human Judgment Required For:**  
     - 20–30% of cases (e.g., values conflicts, ambiguous evidence).  
     - Edge cases: Artists, trauma survivors, or hyper-local efforts where "proof" looks unconventional.  

  4. **What the Procedure Can’t Do:**  
     - Predict future success. Signals indicate commitment, not competence.  
     - Replace empathy. The refugee organizer’s story *should* be heard by humans.  
     - Eliminate privilege bias entirely (Step 3 is a Band-Aid).  

  **Final note:** This system makes 70–80% of decisions evidence-based, reserving 20–30% for human discernment. It shifts focus from *persuasive writing* to *provable action* while protecting the "quiet doers." Run it for 3 months, track misfires, and refine.  

  > "The peacock's tail only works because it's heavy. Look for the weight."
