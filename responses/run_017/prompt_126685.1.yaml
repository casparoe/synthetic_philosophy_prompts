  We are designing a decision procedure for a public agency adjudication unit that handles support payment applications. The test has three components: 
  1. Difficulties must be substantial rather than trivial (S)
  2. Difficulties must be long-term rather than temporary (L)
  3. The help needed must be substantial rather than occasional (H)

  The procedure must:
  - Guide caseworkers through a series of ordered questions.
  - Define what counts as a sufficient answer for each question.
  - Specify when to stop with a "no" decision.
  - Specify when to refer to a panel for value judgments.
  - Address four difficulties: tolerance vs. consistency, comparing vs. classifying, non-collapsibility of components, and reasons that are legitimate and non-insulting.

  Design Principles:

  1. **Tolerance vs. Consistency**: 
     - Use stored exemplar cases (anchors) that are periodically reviewed (e.g., annually) by a panel to reset the baseline.
     - Implement a rule that breaks the chain of precedent when the cumulative drift (measured by the number of small-step precedents) exceeds a threshold (e.g., 10 steps). Then, the case is referred to a panel to set a new anchor.

  2. **Comparing vs. Classifying**:
     - Allow pairwise comparisons only in the middle of the process to rank cases relative to anchors. However, at the edges (clear yes or no), use classification. We will design a procedure that uses comparison to anchors and then to a small set of neighboring cases, but when the comparison becomes too thin (i.e., no clear ordering or too many steps from an anchor), refer to a panel.

  3. **Non-Collapsibility**:
     - Keep the three components separate by requiring independent assessments and then combining them with a set of rules (like a decision tree) that does not reduce to a single score. We can use a flowchart that requires each component to be met at a threshold, but with trade-offs allowed in a structured way.

  4. **Reasons**:
     - Publish the procedure and the criteria in advance, including the thresholds for each component (with examples) and the trade-off rules. This makes the arbitrariness of thresholds legitimate. However, avoid one-point differences by using bands (e.g., low, medium, high) and only making decisions at the band boundaries. The written reason to the applicant will refer to the band and the exemplar cases (without identifying past applicants) to explain the decision.

  Procedure Outline:

  We design a multi-step procedure:

  **Step 1: Initial Screening (quick no)**
     - Ask: Are the difficulties trivial? (if yes, then no; if no, proceed)
     - Ask: Are the difficulties temporary? (if yes, then no; if no, proceed)
     - Ask: Is the help needed only occasional? (if yes, then no; if no, proceed)

     If any answer is "yes", the case is denied with a reason that cites the specific component (e.g., "Your difficulties are assessed as temporary"). This step catches clear negatives.

  **Step 2: Component Assessment**
     For each component (S, L, H), the caseworker must assign a level from a small set (e.g., Low, Medium, High) based on predefined criteria and examples.

     - **Substantial Difficulties (S)**:
          - Low: Difficulties are minor and do not significantly impede daily living.
          - Medium: Difficulties are noticeable and impede some daily activities.
          - High: Difficulties are severe and impede most daily activities.

     - **Long-term (L)**:
          - Low: Expected to last less than 6 months.
          - Medium: Expected to last between 6 months and 2 years.
          - High: Expected to last more than 2 years or permanent.

     - **Substantial Help (H)**:
          - Low: Help needed less than once a week or for minor tasks.
          - Medium: Help needed several times a week for important tasks.
          - High: Help needed daily or constant for essential tasks.

     The caseworker must document evidence for each.

  **Step 3: Trade-off Rules**
     We use a decision table that requires at least two components to be High and the third not Low, or other combinations. For example:

     | S     | L     | H     | Outcome |
     |-------|-------|-------|---------|
     | High  | High  | High  | Yes     |
     | High  | High  | Medium| Yes     |
     | High  | Medium| High  | Yes     |
     | Medium| High  | High  | Yes     |
     | High  | High  | Low   | Refer to Panel (trade-off) |
