  For the methodology, a tiered approach makes sense: first establish the grain-dependence thesis conceptually, then model it formally, then explore the calibration uncertainty twist. The formal model could indeed use a grain parameter (γ) and noise parameter (σ) in a decision-theoretic framework, perhaps simulating how cluelessness varies across grains.

