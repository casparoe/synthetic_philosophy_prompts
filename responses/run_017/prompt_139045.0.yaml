  First, let's unpack the audience composition since objections will vary by role. The Lean/Coq mathematicians (majority) likely care about preserving classical tools like Hahn-Banach, while verification engineers only care about compiled code behavior. The type theorist might challenge foundational framing, the constructivist opposes choice entirely, and the philosopher could attack the premise itself. 

  The user's soft spots are clear: tier boundaries aren't stable (e.g., a ghost choice becoming computational if someone later extracts a basis), their "most AC uses are Tier 2" claim is anecdotal, and they might misrepresent type theory's "AC-as-theorem" stance. They're also wary of philosophical diversion ("you changed the subject") and want to avoid Banach-Tarski debates.

  The worst objection likely comes from the type theorist: "Your tiers misunderstand how choice actually functions in dependent type theory." This could undermine their entire framework since Lean/Coq users work in those systems. Damage control would require conceding early that their categorization is toolchain-specific (not foundational) and emphasizing practical extraction over theory.

  For other objections:
