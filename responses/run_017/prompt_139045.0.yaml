  - The constructivist's "AC is always harmful" objection needs shutdown by redirecting to Tiers 1-2 being harmless.
  - Philosopher's "you changed the subject" requires admitting the talk is engineering-focused, not metaphysical.

  Key tactics: 
  - Preemptively concede tier instability to mathematicians. 
  - Anchor the talk with "swap-invariance is testable" as the must-land point for engineers. 
  - Hope nobody asks for tier distribution stats (user has none). 

  The thesis survives if they frame this as a pragmatic tool for builders, not a philosophical stance. But they must avoid overclaiming tier universality and sidestep foundational debates.
answer: |-
  **Bottom line: Your thesis survives the room's hardest objection (Type Theorist's foundational challenge), but you must concede tier instability upfront to keep mathematicians engaged.**

  ---

  ### Q&A Prep Sheet: Top 7 Objections (Ordered by Damage Potential)
  *(Phrased as spoken in the room, with asker's role)*

  1.  **Type Theorist:** "You're attacking a strawman. In dependent type theory, 'choice' is just `Π (a : A), Σ (b : B a), R a b → Σ (f : Π a, B a), Π a, R a (f a)`. It's a provable *theorem* about repackaging data, not an axiom about 'oracles'. Your 'tiers' misunderstand the actual object of debate."
      *   **Reply:** "You're absolutely right about the repackaging. My tiers aren't about that theorem itself, but about *how its instances are used computationally* in proof *extraction*. A proof using that theorem might erase (`Tier 1`), might define a concrete function (`Tier 2`), or might force extracting an opaque oracle (`Tier 3`) – that's where my distinction kicks in. My focus is on the extractor's output, not the proof term's type."
      *   **Weakness:** This concedes your framing *isn't* about the core type-theoretic statement but about its use in compilation. It risks looking like you dodged the "real" AC.

  2.  **Constructivist:** "This is sophistry. Any use of choice, even your 'ghost' tier, contaminates the proof. It makes existence non-constructive and undermines the computational meaning of mathematics. Swap-invariance is bandaiding a fundamentally flawed approach."
      *   **Reply:** "I respect that position. My goal isn't to argue for classical math, but to help *users* of classical tools like Lean/Coq *manage* the computational impact of choices they've already made to use those tools. For them, knowing if a choice ends up in the binary (`Tier 3`) and if its behavior is observable (`swap-invariance`) is crucial for verification, even if you reject the foundations."
      *   **Weakness:** Doesn't engage the foundational critique; positions your work as purely pragmatic for an impure workflow.

  3.  **Philosopher:** "You've changed the subject entirely. The classical debate about AC concerns the nature of mathematical existence and truth, independent of computation. Your 'tiers' and 'swap-invariance' address engineering concerns, not the philosophical question of whether infinite, non-constructive choices are legitimate."
      *   **Reply:** "Guilty as charged. I'm a software engineer. My 'thesis' isn't trying to settle the 100-year-old debate. It's saying: *For practitioners building verifiable systems by extracting computational artifacts*, the old philosophical question isn't the most *actionable* one. Instead, asking 'Does this specific use force an opaque oracle into my binary (`Tier 3`)? And can I test if it matters (`swap-invariance`)?' *is* actionable. I'm offering tools for the builder, not the philosopher."
      *   **Weakness:** Explicitly concedes the philosophical point; your work is framed as orthogonal, not a refutation.

  4.  **Mathematician (Lean):** "Your 'Tier 2' is naive. What about choosing a basis for `ℝ` as a `ℚ`-vector space? It 'comes with an ordering' in principle, but defining a concrete, computable well-order on `ℝ` requires extreme care (like in `Computability.Hilbert2`). Calling this 'just a definition' sweeps real work under the rug. My basis choice might be computationally heavy!"
      *   **Reply:** "Fair point! This highlights my 'Tier 2' boundary fuzziness. My core point is: if the *specification* of the choice (e.g., 'give me a basis') can be satisfied by a *concrete, implementable function defined elsewhere* – even a complex one like `Computability.Hilbert2` provides – then it's not an *opaque oracle* (`Tier 3`). The function exists in the codebase; it's not an axiom. The complexity is real, but it's defined, not axiomatic."
      *   **Weakness:** Blurs the line between "defined elsewhere" and "axiomatic oracle". Complexity != opaqueness, but the distinction feels practical, not fundamental.

  5.  **Verification Engineer:** "How do I *test* 'swap-invariance' practically? Fuzzing the choice function? That sounds expensive and incomplete. Does your script automate this?"
      *   **Reply:** "Great question. For critical `Tier 3` uses, you'd test it like any other functional dependency: property-based testing. Generate multiple valid choice functions satisfying the spec (e.g., different orderings, different hash seeds), run your extracted program with each, and verify the *observable outputs* (results, logs, side effects) are identical. My weekend script just flags `Tier 3` uses; automating invariance tests is next (or use existing QC frameworks!)."
      *   **Weakness:** Testing non-determinism/complex dependencies *is* hard; this is a promise of future work, not a solved problem.

  6.  **Mathematician (Coq):** "Banach-Tarski *is* relevant! It's the canonical example showing choice's power and counter-intuitiveness. Dismissing it ignores why people worry about choice philosophically and computationally – it *enables* non-constructive weirdness that might sneak into extraction."
      *   **Reply:** "I'm not dismissing its importance *philosophically*. My point is *pragmatic*: in this room, focused on proof *engineering*, *nobody* is extracting Banach-Tarski decompositions to runnable code. The computational weirdness is contained in the proof. It's a `Tier 1` ghost in practice. Focusing on uses that *do* extract (`Tier 3`) lets us prioritize where tooling and testing matter most for building systems."
      *   **Weakness:** Assumes no one will ever extract exotic choice consequences; might seem dismissive of foundational concerns motivating some.

  7.  **Lean User:** "You claim 'a decent chunk is Tier 2'. What's the actual ratio in `Mathlib`? If it's tiny, your whole 'mostly harmless' framing falls apart."
      *   **Reply:** "Honestly? I haven't run the numbers systematically across `Mathlib` – that's a bigger project. My 'decent chunk' comes from patterns: choosing from `Fin n`, picking unique witnesses via `Subtype.val`, using `Classical.choose` on a `Nonempty` type backed by a concrete instance. These *are* common. The script flags them as `Tier 2`/`Tier 1`. I'd love to collaborate on a full audit! The key point remains: identifying the `Tier 3` uses is critical."
      *   **Weakness:** Admits lack of hard data; relies on anecdotal plausibility.

  ---

  ### Critical Concessions & Strategy
  *   **Concede in First 2 Minutes:** "My tier boundaries *aren't* set-theoretically fundamental. A `Tier 1` choice today might become `Tier 3` tomorrow if someone decides to extract that basis. This is about *current computational intent* in a specific project. I'm offering a *pragmatic lens for engineers*, not a new philosophy."
  *   **Must-Land Reply (Verification Focus):** "**Swap-invariance is testable.** For any `Tier 3` choice, if swapping different valid choice functions *doesn't change the program's observable behavior*, then the oracle is harmless – like a hash order you don't depend on. We can use property-based testing to check this." (This gives engineers a concrete, tool-based takeaway).
  *   **Question You Hope Nobody Asks:** "Can you formally define 'observable behavior' and 'swap-invariance' within the metatheory of the proof assistant itself, without appealing to the external runtime?" (Forces you into deep type theory/formal semantics you explicitly avoided. **Dodge:** "That's a deep metatheoretic question! My work operates at the level of the extracted artifact and runtime testing for now, which is where verification engineers live.")

  **Your thesis survives** because you reframe the debate for your audience's *engineering* concerns. The strongest objections force concessions on philosophy (you changed the subject) and foundational type theory (you misrepresent the "axiom"), but your core message – *focus on computational impact and testable invariance for extracted code* – provides actionable value for builders. Stick to the pragmatic, tooling-focused narrative.
