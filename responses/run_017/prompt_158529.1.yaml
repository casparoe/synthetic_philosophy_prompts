  But is there a deeper driver? The user mentions reasoning from trend vs. mechanism, weight on catastrophic risks, and moral relevance of different denominators. These might tie into the purpose layer. For example, focusing on mechanisms (like game theory or cultural evolution) versus trends could influence one's stance. Also, the moral weight given to total suffering versus individual risk might affect which denominator is preferred.

