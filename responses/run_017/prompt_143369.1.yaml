answer: |-
  Your frustration is warranted: the literature's inertia stems from multiple, entangled disagreements masquerading as a single debate. The stalemate isn't monolithic; it's a knot of distinct issues conflated under the "lottery/preface" label. Your asymmetry observation is astute and points to the core problem. Here's a diagnosis structured around your concerns, engaging the families and your probe.

  ### 1. The Asymmetry and the Conflation of Two Problems
  You're correct: **lottery and preface are distinct genera**, artificially unified by surface similarity. The divergence in intuitions isn't accidental—it reflects deep structural differences:
  - **Lottery**: The mechanical, *a priori* guarantee of exactly one failure creates **ineliminable epistemic dependence**. Believing *any* individual "ticket *i* loses" requires ignoring that *if it were to win*, you'd still hold this belief falsely. Safety/robustness views exploit this: your belief isn't sensitive to the truth (if ticket *i* won, you'd still believe it lost). This isn't about low probability; it's about **modal fragility** under a known error distribution.
  - **Preface**: Here, the evidence is **inductive and statistical** (your past error rate), not a guaranteed single failure. Errors are *expected* but not *guaranteed* in number or location. Higher-order evidence (your fallibility) doesn't directly undermine each first-order belief's local justification. Denying belief wholesale feels like capitulation to global skepticism, not local rationality.

  **Why they're conflated**: Framing both as "high probability conjuncts + unlikely conjunction" obscures this. The lottery's fixed failure mechanism is unique; the preface's inductive risk is general (e.g., scientific theories, historical narratives). Treating them together lets theorists leverage the lottery's intuitive pull (against individual beliefs) to pressure preface concessions, but the preface resists—rightly, because the cases differ.

  ### 2. The Three-Case Probe: Exposing the Families' Commitments
  Holding marginals fixed while varying dependence structures is illuminating. Here’s how each family handles your cases:

  - **Threshold Views (e.g., Lockeanism)**  
    Verdict: *Identical for all three cases*.  
    Why: Only marginal credences matter. If credence in each proposition is 0.999, you believe all individually. The conjunction's low probability (≈0.368 for independent cases, lower for lottery) is irrelevant to individual beliefs. They sacrifice deductive closure outright.  
    **Problem**: Fails your probe entirely. It can't distinguish between cases where dependence rationally *should* affect belief (lottery) and where it shouldn't (preface). This is why many find pure threshold views unsatisfying—they ignore epistemic structure.

  - **Closure-Restricting Views (e.g., non-agglomerative approaches)**  
    Verdict: *Belief in all individual claims for all three cases, but conjunction denied*.  
    Why: Allows "rational inconsistency." The agent believes each claim separately, but avoids believing the (inconsistent) conjunction. Dependence is irrelevant; local justification suffices.  
    **Problem**: Struggles with *why* closure fails only for the conjunction. In the calibration case, learning one error *might* rationally undermine beliefs in neighboring claims (due to positive correlation), but this view lacks resources to explain that. It also can't capture the lottery-specific intuition that individual beliefs are defective *before* aggregation.

  - **Robustness/Safety Views (e.g., Williamson, Hawthorne)**  
    Verdict: *Differentiated across cases*.  
    - Lottery: **No belief** in any ticket loss (fragile: if ticket wins, you'd still believe loss).  
    - Classic Preface: **Belief** in each claim (robust: if claim *i* were false, you'd likely detect it via evidence).  
    - Calibration Case: **No belief** (or highly restricted belief) in individual readings. Why? If an instrument is miscalibrated, your belief in a reading isn't sensitive to its truth—a nearby world with botched calibration makes you wrong *en bloc*. Learning one error *does* undermine neighbors.  
    **Strength**: Only this family "passes" your probe by tracking dependence.  
    **Weakness**: Must explain why preface beliefs *feel* robust but lottery beliefs don't—often appealing to the nature of evidence (direct vs. statistical).

  - **Contextualist/Compartmentalized Views (e.g., pragmatic encroachment, partition-sensitive models)**  
    Verdict: *Highly variable, context-dependent*.  
    Why: Belief ascriptions shift with stakes, questions, or cognitive partitions. In the lottery, high stakes (winning matters) or "lottery-thinking" contexts raise the threshold, denying belief. In the preface, low-stakes or "scholarly" contexts permit belief. In the calibration case, if the block shift is salient (e.g., in a safety-critical context), belief is withheld; otherwise, it might be attributed.  
    **Problem**: Risks ad hocness. The three cases might all support belief or not, depending on context—but this doesn't resolve normative questions about rationality.

  ### 3. The Stalemate: Four Layers of Disagreement
  The deadlock isn't at bedrock; it's that multiple distinct disputes are tangled:
  - **Verbal/Conceptual**: Is "belief" a high credence (functional for decision-making) or a robust commitment (stable across counterfactuals)? Threshold views prioritize the former; robustness views the latter. Your probe shows this matters: dependence structures only affect the latter.
  - **Normative Ambiguity**: "Justification" oscillates between:  
    - *Local procedural justification* (was this belief formed well given its *direct* evidence? → favors closure restriction)  
    - *Global coherence justification* (can beliefs survive integration? → favors robustness).  
    The preface tempts us with local propriety; the lottery with global disaster.
  - **Formal/Structural**: Is there a credence-to-belief map satisfying:  
    (i) High probability → belief,  
    (ii) Deductive closure,  
    (iii) Non-triviality (beliefs possible)?  
    **Impossibility results** (e.g., Douven, 2012) show these are jointly unsatisfiable under independence. But your calibration case shows *dependence matters*—and no-go results assume specific probabilistic structures. Progress might come from generalizing these theorems.
  - **Empirical Burdens**: Safety views assume beliefs *must* track truth modally; contextualism assumes stakes *do* shift attributions. Both need psychological backing. Do people actually withhold lottery beliefs but hold preface beliefs? Does dependence (as in your probe) affect intuitive ascriptions? The literature often ignores this, treating intuitions as fixed.

  ### 4. What Progress Looks Like (and What Doesn't)
  **Stalemate-breakers**:
  - **Disentangle the paradoxes**: Stop treating lottery/preface as one problem. The lottery is about *incompatible possibilities under certainty*; the preface is about *fallibility management*. This clarifies that "solutions" needn't apply to both.
  - **Formalize Dependence**: Your probe reveals that dependence structures *should* matter rationally. Generalize impossibility theorems to correlated evidence. Develop models where robustness is defined relative to dependence (e.g., in calibration case, belief requires sensitivity to *block-level* errors, not just individual ones).
  - **Clarify the Normative Target**: Is rationality about avoiding *actual inconsistency*, or avoiding *inescapable risk of error*? The former pushes toward closure; the latter toward thresholds or contextualism. Choose one.
  - **Empirical Grounding**: Test whether ordinary belief attributions track dependence (e.g., does your calibration case elicit withheld belief?). If they do, robustness gains support; if not, threshold/contextualism might.

  **What Won't Help**: Rehearsing the same intuitions or refining threshold values. The debate needs **fewer generic "belief" talk and more specification**: belief-for-what? (action? assertion? reasoning?). 

  **Honest Conclusion**: The literature stalls because it tries to solve two distinct problems with one account. Your calibration case shows that *dependence structure* is crucial but undertheorized. Progress requires **splitting the paradoxes, modeling correlational constraints, and embracing that "belief" may be a plural concept**. Until then, the stalemate reflects not bedrock disagreement, but a failure to isolate what's really at issue in each case. The honest move is to declare the "single problem" framing a pedagogical artifact and pursue the paradoxes separately.
