  We are dealing with a situation where individual decisions made at different times are consistent when viewed in isolation, but when taken together, they reveal an inconsistency. Specifically:

  1. In the first meeting (Michaelmas), the committee approves funding for the debating society (5-4).
  2. In the second meeting (Hilary), the committee approves funding for the jazz band (5-4) and rejects funding for both (5-4 against the joint motion).
  3. The voting patterns are such that the same four members who supported both individual grants also supported the joint motion, and the five who opposed the joint motion each opposed at least one of the individual grants.
  4. There is no change in membership between the two meetings (for the first case) and no individual changed their mind (they voted consistently with their previous votes when the same issue came up again).

  The paradox is that the set of decisions implies:
     - Debating society funded (from Michaelmas).
     - Jazz band funded (from Hilary).
     - Not both funded (from the joint motion in Hilary).

  But if both are funded individually, then the joint motion should have passed, but it didn't. So the collective decisions are inconsistent.

  Now, let's break down the questions:

  a) How does this differ from the ordinary doctrinal paradox (discursive dilemma)?
     - In the doctrinal paradox, the inconsistency arises in a single meeting when voting separately on premises and then on the conclusion. Here, the votes occur at different times and on different agendas. The inconsistency is only revealed when we combine the decisions from two different meetings.

  b) How is it different from the group simply changing its mind?
     - In this case, the group did not change its mind on any specific motion. The motion to fund the debating society passed in Michaelmas and was not revisited in Hilary. The motion to fund the jazz band passed in Hilary. The joint motion was new in Hilary. Moreover, the same members voted consistently on the same issues. So it's not a change of mind.

  c) Path-dependence and order-dependence:
     - These typically refer to how the outcome of a sequence of votes on a fixed set of alternatives can change based on the order of voting. Here, the set of alternatives is not fixed at the beginning because the joint motion was not considered in the first meeting. The agenda grew.

  d) The second case with membership change:
     - The structure is the same: two individual approvals at different times and a joint rejection. The only difference is that the membership changed. The inconsistency arises from the collective decisions, not from individual inconsistency. So it's the same phenomenon.

  Now, regarding the reopening: if the earlier decision was formally reopened and a rescission motion failed, then we have an explicit reaffirmation of the first decision. This would make the inconsistency even more stark because now the first decision is explicitly upheld at the same time as the second and the joint motion are decided. But note: in the original case, the first decision was not reopened. However, the inconsistency is already there without reopening because the first decision stands.

  So what is this phenomenon?

  We can see it as a form of **inconsistency in collective judgment over time** or **temporal discursive dilemma**. However, note that the standard discursive dilemma is static. This is dynamic.

  In social choice theory, there is a concept called the **discursive dilemma over time** or **dynamic inconsistency in collective judgment**. But let's see if there is an established term.

  Alternatively, this might be related to the **Ostrogorski paradox** which deals with inconsistency between individual and collective opinions on multiple issues, but that is usually in a simultaneous vote.

  Another related concept is the **multiple elections paradox** (or the problem of referenda) where voting separately on multiple issues can lead to an outcome that is inconsistent with the majority will on a package. However, that is typically simultaneous.

  In this case, the votes are sequential and the agenda expands. So we are in the realm of **sequential voting with an expanding agenda**.

  But note: in the first meeting, only the debating society was considered. In the second meeting, the jazz band and the joint motion were considered. The joint motion is a new issue that connects the two.

  This is similar to the **problem of intertemporal consistency of collective choice**.

  However, I don't think there is a single established term for this exact phenomenon.

  But let me propose:

  The phenomenon is that the collective judgments made at different times on logically related propositions are inconsistent when taken together, even though each set of judgments at a given time is consistent and the individuals are consistent.

  Now, let's try to define:

  **Definition**: A collective decision-making process exhibits **temporal discursive inconsistency** if:
     - There are two or more logically interconnected propositions that are decided at different times (so the agenda is expanded to include new connections).
     - Each decision at each time is made by majority rule (or similar) and is internally consistent (i.e., the set of propositions decided at the same time is consistent).
     - The set of all decisions taken together is logically inconsistent.
     - The inconsistency arises because the new decision (on the connection) is made without revisiting the old decisions, and the old decisions are not reversed.

  How does this differ from the standard discursive dilemma?
     - In the standard discursive dilemma, all propositions are decided at the same time. Here, they are decided at different times and the agenda grows.

  How does it differ from changing minds?
     - The individuals did not change their minds. The collective inconsistency arises because the group did not have the opportunity to consider the entire set of propositions together.

  How does it differ from path dependence?
     - Path dependence usually involves the same set of alternatives and different orders. Here, the set of alternatives (propositions) is expanding.

  Now, for the two cases:

  Case 1 (same committee, same members, two meetings): included because the decisions are made at two different times and together they form an inconsistent set.

  Case 2 (committee with membership change): included because even though the membership changed, the collective decisions are recorded as the decisions of the same body (the committee) and they are inconsistent when taken together.

  What if the earlier decision was reopened and the rescission motion failed?
     - That would be included as well because it reinforces the earlier decision, but the inconsistency remains.

  Now, what to exclude?

  Exclude:
     - A case where the committee revisits the same exact motion and reverses it (that's changing mind).
     - A case where the committee in a single meeting has an inconsistency (that's the standard doctrinal paradox).

  Diagnostic test:

     - Step 1: Identify a set of collective decisions on propositions P, Q, R, ... made at different times.
     - Step 2: Check that the decisions at each time are logically consistent (i.e., the set of propositions decided at time t is consistent).
     - Step 3: Check that the entire set of decisions is logically inconsistent.
     - Step 4: Verify that the propositions are logically interconnected (e.g., R might be equivalent to P and Q).
     - Step 5: Verify that the individuals who voted on the same proposition at different times did not change their vote (if they had the chance) and that the inconsistency is not due to individual inconsistency but collective aggregation over time.

