  ### Analysis of the Phenomenon

  Your observation describes a scenario where collective decisions made at different times are individually consistent but collectively inconsistent when taken together, due to the expansion of the agenda over time. This differs from the standard doctrinal paradox and related concepts in key ways. Below, I address your specific queries before providing a formal classification.

  #### Key Distinctions
  - **(a) Ordinary doctrinal paradox (discursive dilemma):**  
    In the doctrinal paradox, inconsistency arises from simultaneous voting on premises and conclusions in a single meeting (e.g., voting separately on premises A and B, then the conclusion "A ∧ B" yields a contradiction). Your case differs because the decisions occur **across multiple meetings** with an **expanding agenda** (the joint motion only appears later). The paradox emerges from accumulating decisions, not simultaneous voting.

  - **(b) Group changing its mind:**  
    A group "changing its mind" implies reversing a prior decision when revisiting the same motion. Here, no motion is revisited: the debating society grant was never re-voted, and individuals held consistent positions. The inconsistency stems from **new connections** (the joint motion) revealing latent contradictions in past decisions.

  - **(c) Path/order dependence:**  
    Path dependence (e.g., Condorcet cycles) assumes a fixed set of alternatives voted in different sequences. Your case has a **dynamic agenda**: the joint motion was absent in the first vote. The paradox arises from adding new propositions, not resequencing existing ones.

  - **(d) Membership turnover:**  
    The second case (with committee replacements) is **structurally identical** to the first. Individual consistency is preserved, and the collective inconsistency results from aggregating decisions made by the same formal body (the committee) over time. Membership changes don’t alter the core mechanism.

  #### Role of Reopening Decisions  
  If the debating society grant was formally reopened and a rescission motion failed (e.g., 5–4 to uphold it), the inconsistency would **persist but intensify**. The reaffirmed decision would deepen the contradiction with the later joint motion rejection. This reinforces the paradox by making the inconsistency explicit without resolving it.

