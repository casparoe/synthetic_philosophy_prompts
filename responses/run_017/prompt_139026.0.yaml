answer: |-
  Here’s a synthesis based on your cases and principle, structured as requested. Confidence ratings are noted at the end.

  ---

  ### **I. The Principle**  
  Selection operates at multiple levels, but we assign the "unit of selection" for a trait based on two distinct roles:  
  1. **Predictive Unit**: The level *required* to calculate the change in trait frequency. This is always the gene/allele (via covariance with fitness), as gene-frequency change is the fundamental accounting of evolution.  
  2. **Functional Unit**: The level where the trait’s fitness consequences are *directly aligned* or *in conflict*. This is the entity whose replication is promoted (or harmed) by the trait, and it can be genes, cells, organisms, or groups.  

  A trait’s "unit" isn’t singular. The predictive unit is always genetic, but the functional unit varies: it’s the level where fitness interests coherently manifest. Conflict or alignment determines whether we call a trait "for" a gene, organism, or group.  

  ---

  ### **II. Where Each Clause Comes From**  
  - **Predictive Unit (Gene-Level Bookkeeping)**:  
    From [c] and [d]. Both segregation distorters and camouflage alleles change frequency via allele-covariance. Your discomfort in [d] arises because the functional unit differs ([c] exploits the organism; [d] benefits it), but prediction identically requires gene-level math. Resisting "the gene is selected" in [d] conflates prediction with function.  

  - **Functional Unit (Alignment/Conflict)**:  
    - [a] Sterile workers: Functional unit is the *gene* (via kin selection). "Colony does better" is an outcome, not a causal force—it dissolves into relatedness. No functional work at colony level.  
    - [b] Cytoplasmic sterility: Functional unit is the *mitochondrial genome* (promoting its spread) vs. *nuclear genome* (restoring fitness). The plant is a conflicted arena.  
    - [e] Restraint traits: Functional unit is the *group*. Kin arguments often reduce it to gene-level, but if the trait evolves *despite* individual cost and requires group structure (e.g., cage selection), group interests function distinctly.  
    - [d] Camouflage: Functional unit is the *organism*—the trait aligns with its survival/reproduction. Genes are vehicles.  

  ---

  ### **III. Verdicts I'd Have to Give Up**  
  You must concede [d] to gene-level *prediction*. The allele for camouflage spreads via the same covariance math as the distorter in [c]. However, you’re right that the *functional* unit differs: camouflage serves the organism, while the distorter hijacks it. [e] stands if group structure creates emergent fitness (e.g., trait stabilizes *only* with group feedback). Your principle’s "work left over" applies here: if holding individual fitness fixed still shows group benefit (e.g., in the chicken experiment), group selection is functionally real.  

  ---

  ### **IV. New Cases**  
  - **Genomic Imprinting in Maize**:  
    - **Predictive Unit**: Alleles (imprinted genes).  
    - **Functional Unit**: *Conflict* between paternal genome (selected for larger endosperm to enhance offspring success) and maternal genome (selected to conserve resources for other offspring). The kernel is the arena; neither "plant" nor "group" is the beneficiary. Functional unit is the *parental genome-of-origin*.  

  - **Test Case: Quorum Sensing in Bacteria**:  
    Bacteria produce public goods (e.g., enzymes) only at high density. At low density, freeloaders (non-producers) outcompete producers. But in structured groups (e.g., biofilms), producers can persist.  
    - **Predictive Unit**: Alleles for production/non-production.  
    - **Functional Unit**: If production evolves *only* in metapopulations with group turnover (so groups of producers "outcompete" freeloader groups), the *group* is a functional unit. Kin reduction may apply, but if group structure drives the outcome (e.g., via between-group selection gradients), functional work remains at group level.  

  ---

  ### **V. Confidence**  
  **Overall: High confidence** in the predictive/functional distinction resolving your cases. This reconciles gene-centric accounting with multi-level function.  
  **Least Confident Bit**: The boundary of "functional work left over" for groups [e]. In practice, group and kin selection are often mathematically equivalent—but if group structure (e.g., trait-group partitioning) is essential to the *causal story*, functional group selection holds.  
  **Your Tension**: Spot-on that "unit of selection" conflates prediction (always gene) and beneficiary (varies). Separating them saves your verdicts without ignoring genetics.  

  ---  
  This keeps [a]-[e] largely intact, clarifies why [c] and [d] *feel* different, and places genomic imprinting where it belongs: gene-level prediction, genome-of-origin functional conflict.
