  Okay, the user is asking about the requirements for a lexical-threshold negative utilitarianism to be operational in decision-making, like in animal welfare or public health. They’ve listed several points but want a thorough breakdown. Let me start by understanding their core query.

  First, they mention that pleasure and pain might be on one axis or two. If they're separate, how do you bridge them for lexical priority? That’s crucial because without a common scale, comparing across axes is messy. The user probably needs clarity on how these axes interact, especially for threshold application.

  Next, the threshold itself. What determines it? Intensity, duration, etc.? And why there specifically? The continuity problem is a big deal—how do you justify a sharp cutoff in a continuous spectrum? This seems non-negotiable because without a defined threshold, the theory isn’t actionable.

  Then, aggregation: does the threshold apply per episode or across individuals? If a lot of mild suffering aggregates, does it hit the threshold? This affects policy decisions where many individuals experience low-level suffering. The user’s context (regulator) means this is critical for real-world applications.

  Probability is another issue. Lexical thresholds make any non-zero risk of severe suffering dominate. But in practice, every option might carry some risk. How does the theory handle this without paralyzing decision-making? This might require a de minimis exception, but that complicates the lexical purity.

  Scale transformation invariance is technical but important. If you recalibrate pain scales, does the threshold move? If not, the theory might be arbitrary. The user wants robustness here, probably non-negotiable for scientific rigor.

  Temporal profiles matter because moment-by-moment vs. retrospective assessments differ. Which one counts for crossing the threshold? Regulators need to know what to measure, so this is practical.

  Finally, the nature of pain's badness. Is it intrinsic or contextual? Deserved pain might not count the same. This ties into ethics, affecting how interventions are judged. The user might be hinting at moral dimensions beyond mere sensation.

  Now, the user wants to know which requirements conflict. I suspect justifying the threshold's location (Requirement 2) and scale invariance (Requirement 5) clash. A fixed threshold in a continuous space seems arbitrary unless scale-dependent, but invariance demands it not be. That’s a tough one.

  Also, aggregation (Requirement 3) and probability (Requirement 4) together could be problematic. If aggregates can cross the threshold, and any risk is unacceptable, then large-scale interventions with tiny severe-suffering risks might always be rejected, which isn’t feasible.

  The user might be a policymaker or ethicist looking to apply this theory. Their unspoken need is likely practicality: can this framework actually guide decisions without being too rigid or collapsing under its own constraints? They might also want to identify if lexical threshold theories are viable at all or if compromises are necessary.

  Overall, the biggest hurdle is the threshold justification combined with scale invariance. Without a natural zero or fixed points, placing a lexical threshold objectively seems impossible. That might be the key takeaway—lexical thresholds face foundational challenges when operationalized.
answer: |-
  Here is a complete specification of requirements for a hedonic commensurability theory to operationalize lexical-threshold negative utilitarianism (LTNU) in a regulator's decision procedure, incorporating your points, splitting where necessary, adding critical ones, and assessing negotiability:

  ### Core Requirements for Hedonic Commensurability under LTNU

  1.  **Unified Hedonic Axis (Non-Negotiable):**
      *   **Requirement:** Pleasure/pain must reside on a *single, bipolar axis* (e.g., -10 [worst agony] to +10 [bliss]). Pain reduction and pleasure gain must be interconvertible *below* the threshold.
      *   **Case:** Lexical priority *across* types (severe pain vs. mild pleasure) requires a common scale. Two axes (e.g., separate pain and pleasure scales) lack a principled bridge for declaring lexical dominance; comparing "10 pain units" to "100 pleasure units" becomes arbitrary. A single axis defines the threshold's location unambiguously relative to all experiences.

  2.  **Threshold Definition & Location (Non-Negotiable):**
      *   **Requirement:** The theory must define the threshold's *hedonic location* (e.g., intensity = X, or integrated intensity-duration load = Y) and provide a *non-arbitrary justification* for why it falls *there* and not at nearby points, despite underlying phenomenological continuity.
      *   **Case:** Without this, the threshold is merely stipulated, undermining objectivity and inviting manipulation ("move the threshold to favor my policy"). Continuity is the core challenge: why is suffering *just below* X permissible to outweigh, while suffering *at* X lexically dominates all below-threshold goods? Appeals to radical qualitative change (e.g., "unbearable," "intolerable," "destroys agency") are common but need grounding in the metric.

  3.  **Aggregation Scope (Negotiable - Camp Dependent):**
      *   **Requirement A (Episode-Focused):** The threshold applies solely to *individual experiential episodes*. Aggregate mild suffering across individuals/episodes *cannot* sum to exceed the threshold. Only episodes where an individual's experience *itself* crosses the threshold count.
      *   **Requirement B (Aggregate-Focused):** Suffering *can* be aggregated across individuals/episodes. Sufficient mild suffering in a population *does* sum to cross the lexical threshold.
      *   **Case:** LTNU's practical implications diverge radically. A regulator assessing factory farming (billions of mild suffering days) vs. rare catastrophic accidents (few severe suffering episodes) needs clarity. Episode-Focus protects against "death by a thousand cuts" arguments but may neglect diffuse large-scale mild suffering. Aggregate-Focus avoids this but risks making *any* large-scale intervention lexically forbidden if it imposes even minimal widespread mild suffering.

  4.  **Probability Handling (Non-Negotiable for Feasibility):**
      *   **Requirement:** The theory must resolve how LTNU handles *non-zero probabilities* of threshold-crossing suffering. Pure LTNU renders *every* option with any such risk unrankable/inferior to options with zero risk, paralyzing real-world decisions where perfect safety is impossible.
      *   **Case:** Vaccines (rare severe side effects), new farming systems (unknown severe welfare risks), infrastructure projects (accident risks). Solutions require either:
          *   A *de minimis* probability rule (e.g., risks below Z% are ignored lexically - but violates pure LTNU).
          *   Expected disvalue calculations *only below* the threshold, with lexicality applying *solely* to certain outcomes (not risks) - undermining core intuition.
          *   A secondary decision rule for probabilistic cases (e.g., maximin) - complexifying the theory.

  5.  **Scale Invariance & Threshold Anchoring (Non-Negotiable):**
      *   **Requirement:** The resulting ordering of outcomes must be invariant under *admissible transformations* of the hedonic scale. Crucially, the *threshold's location* must be anchored to the underlying phenomenology, not the scale's numerical labels. If the scale is recalibrated (e.g., multiplying all values by 2), the threshold's *hedonic referent* must remain fixed, changing its numerical label accordingly.
      *   **Case:** Scales (e.g., 0-10, -100 to 100) are conventional. If the threshold is defined as "intensity >= 8", recalibrating to a 0-20 scale where the same experience is now 16 makes "8" meaningless. The threshold must track the *experience*, not the number. Invariance ensures the theory's recommendations don't change with arbitrary scaling choices.

  6.  **Temporal Currency (Negotiable - Camp Dependent):**
      *   **Requirement A (Momentary):** Threshold crossing is assessed based on *instantaneous* or *very short-duration* hedonic states. Aggregation over time occurs *after* identifying threshold-crossing moments.
      *   **Requirement B (Integrated/Retrospective):** Threshold crossing is assessed based on the *total integrated disvalue* of an experience or its *retrospective evaluation* (e.g., "was the overall experience unbearable?").
      *   **Case:** A long, dull ache vs. a brief, excruciating stab. Momentary focus identifies the stab as lexical; integrated focus might see the prolonged ache as worse overall. Retrospective views ("it wasn't so bad afterwards") conflict with peak/momentary intensity. Choice impacts policy (e.g., prioritizing brief severe pain vs. chronic moderate pain).

  7.  **Intrinsic vs. Contextual Badness (Non-Negotiable):**
      *   **Requirement:** The theory must distinguish between the *intrinsic hedonic disvalue* of an experience (its "felt badness") and its *all-things-considered moral disvalue* within a state of affairs. Lexical priority applies only to the *intrinsic hedonic disvalue* crossing the threshold. Consensual, deserved, or constitutive pains (e.g., surgery, effortful training) may have high intrinsic disvalue but low/neutral moral disvalue.
      *   **Case:** Applying LTNU naively could lexically forbid necessary surgery (severe pain) or strenuous but rewarding activities. The hedonic metric must isolate the raw experiential quality from its context for the lexical rule to apply meaningfully to "suffering" as such.

  8.  **Interpersonal Comparability (Non-Negotiable for Policy):**
      *   **Requirement:** The hedonic scale must support *meaningful interpersonal comparisons* sufficient to determine if *any individual* within the affected population experiences suffering above the threshold due to an intervention.
      *   **Case:** A regulator *must* compare welfare impacts across different animals or humans. If comparisons are impossible or highly speculative, identifying threshold-crossing becomes guesswork, crippling the decision procedure. This requires cardinality and a robust basis for comparison.

  9.  **Measurability & Operationalization (Non-Negotiable for Application):**
      *   **Requirement:** The theory must provide (or be compatible with) *operational criteria and methods* for reliably detecting when the threshold is crossed in real-world subjects (e.g., specific behavioral, physiological, or neurological markers for animals; validated self-report scales + criteria for humans).
      *   **Case:** A regulator cannot act on an abstract threshold. They need concrete, observable signs: "If behavior X or biomarker Y occurs at level Z, this constitutes threshold-crossing suffering." Without this, the theory is inert for practical ranking.

  ### Analysis of Tensions and Viability

  1.  **Most Likely Irreconcilable Pair:** **Requirement 2 (Non-Arbitrary Threshold Location)** and **Requirement 5 (Scale Invariance/Anchoring)**.
      *   **Conflict:** Scale invariance demands the threshold's *phenomenological referent* is fixed. Requirement 2 demands a non-arbitrary *justification* for why *that specific* referent marks the lexical break, despite continuity. Justifying a sharp cutoff in a continuous dimension is inherently challenging. Appeals to conceptual necessity (e.g., "intolerability") or biological/psychological discontinuities (e.g., triggering specific pain pathways, loss of consciousness) exist, but their ability to bear the justificatory weight for *lexical* priority (vs. just being very bad) is debatable and often seems arbitrary upon scrutiny.

  2.  **Most Excluding Requirement:** **Requirement 4 (Probability Handling)**.
      *   **Reason:** Pure, unmodified LTNU is catastrophically sensitive to any non-zero probability of threshold-crossing suffering. Almost every real-world intervention carries *some* such risk, however small. Theories that strictly adhere to lexical priority for *risks* render nearly all options incomparable or inferior to a vanishingly small set of perfectly safe options (which may not exist). Most plausible candidate theories *must* modify LTNU (e.g., with de minimis rules, expected value below threshold, or lexicality only for certainties) to be functional, thereby excluding purist LTNU interpretations.

  3.  **What Might Be Left Standing?**
      *   **Modified LTNU Theories:** Theories incorporating a *de minimis* probability threshold (**Req 4**) and focusing on **Episode-Focus (Req 3A)** combined with **Momentary Intensity (Req 6A)** have the best chance. They anchor the threshold (**Req 2 & 5**) to intense, short-lived suffering states (potentially justifying the cutoff via neurobiological correlates of "unbearable" pain - e.g., overwhelming nociceptive signals). They maintain a single axis (**Req 1**), distinguish intrinsic badness (**Req 7**), and demand interpersonal comparability/measurability (**Req 8 & 9**).
      *   **Scorecard (Illustrative):**
          *   **Pure LTNU:** Fails **Req 4** (Probability) catastrophically. Struggles profoundly with **Req 2** (Justification).
          *   **Aggregate-Focused LTNU (Req 3B):** Increases tension with **Req 2/5** (justifying summing) and worsens **Req 4** (probability problem now applies to diffuse aggregates). Likely unworkable.
          *   **Integrated/Retrospective Focus (Req 6B):** Complicates **Req 2/5/9** (defining/measuring the integrated threshold non-arbitrarily). Increases risk of downplaying severe momentary suffering.
          *   **Modified LTNU (de minimis + Episode/Momentary):** Only viable contender. Requires compromises (**Req 4**), but satisfies core non-negotiables (**1, 5, 7, 8, 9**) and offers a pragmatic path for **2/3/6**. Justification (**Req 2**) remains the weakest link.

  **Conclusion:** Operationalizing LTNU requires significant theoretical commitments. The joint demands of **non-arbitrary threshold justification** amidst phenomenological continuity and **handling non-zero risks** are the most severe obstacles. A modified form, incorporating a de minimis rule and focusing on momentary episodes of intense suffering defined by measurable correlates, offers the most plausible, though still challenging, path forward for practical application. The "lexical threshold" concept itself faces severe justificatory pressure (**Req 2**) within a continuous hedonic landscape.
