  For the first phenomenon, terms like "base rate laundering" or "optimism laundering" come to mind. The latter captures how individual optimism gets aggregated into what looks like objective data. The second phenomenon might be part of the "frame problem" in epistemology, where defining relevance is inherently subjective.

  I should also consider the user's deeper needs. They're writing a methods section and need robust concepts that withstand scrutiny. They might be seeking frameworks to critique the uncritical application of the outside view in their field. Their examples—dissertation timelines and seed grants—suggest they want to highlight systemic biases in academic decision-making processes.

  The user’s three informal categories (contaminated composition, shifting classes, self-description issues) are insightful. The first corresponds to the recursive bias problem. The second relates to Goodhart effects. The third is about strategic labeling. These might be subtypes rather than distinct phenomena.

  For the second issue, distinguishing between necessary and sufficient conditions for reference class membership could help. The user’s worry about "pushing the inside view up one level" echoes foundational debates in statistics (e.g., reference class problem in probability) and philosophy (e.g., Quine's ontological relativity).

  Potential literature to recommend: Tetlock’s "Superforecasting," Kahneman’s work on noise and bias, Douglas Hubbard’s applied probability texts, and possibly social studies of quantification (Espeland, Porter). For the recursive bias, organizational learning literature (Levitt and March) might address how organizations internalize flawed metrics.

  The user’s unspoken need might be to legitimize their critique within political science methodology. They likely want to challenge the perceived objectivity of institutional metrics without dismissing evidence-based decision-making entirely. Providing precise terminology and academic references would bolster their argument’s credibility.

