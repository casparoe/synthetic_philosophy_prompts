  First, I need to recall if there's existing literature addressing these specific concerns. The Planning Fallacy and Reference Class Forecasting come to mind, especially from Kahneman and Tversky. But the user points out a deeper layer: the data in the reference class is contaminated because each entry was generated via inside-view reasoning. That's a significant twist. 

