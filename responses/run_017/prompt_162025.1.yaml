  Below is an eight-question diagnostic instrument designed to sort respondents by their implicit views on survival through gradual replacement, tailored for neuroscience/ML students and clinicians. Each question presents a concrete case with answer options, written in British English (<40 words per question). The scoring key maps answer combinations to major philosophical positions, flags indistinguishable pairs, and identifies unstable/incoherent patterns. 

  ---

  ### **Questionnaire: "Survival Through Replacement"**  
  *For each scenario, tick one box. Answer based on intuition—no prior knowledge needed.*  

  1. **Gradual Neuron Swap**  
     Over years, your neurons are replaced one-by-one with identical silicon units. Your behaviour and experiences stay unchanged. At 100% replacement, are you still you?  
     ☐ **A: Yes**  
     ☐ **B: No**  

  2. **Instantaneous Swap**  
     The same end state (100% silicon brain) happens in one operation under anaesthetic. On waking, behaviour is identical. Are you still you?  
     ☐ **A: Yes**  
     ☐ **B: No**  

  3. **Silent Dimming**  
     In gradual replacement, behaviour/reports stay normal. Could consciousness “dim out” silently without detection?  
     ☐ **A: Impossible—you’d report any dimming**  
     ☐ **B: Possible—dimming might be silent**  

  4. **Population-Level Replacement**  
     Replacements only match whole-network function (single-unit swaps wouldn’t behave identically). After 100%, are you still you?  
     ☐ **A: Yes**  
     ☐ **B: No**  

  5. **Time-Dilated Substitutes**  
     Replacements run faster internally but predict outputs to keep timing correct. Abstract causal structure matches, but fine-grained dynamics differ. Post-replacement, are you still you?  
     ☐ **A: Yes**  
     ☐ **B: No**  

  6. **Reversion to Biological**  
     After 60% replacement, the process reverses using cultured biological cells. At 100% biological again, are you still you?  
     ☐ **A: Yes**  
     ☐ **B: No**  

  7. **Branching During Replacement**  
     At 50% replacement, the system is copied. Both copies continue to 100%. Are both you?  
     ☐ **A: Both are equally me**  
     ☐ **B: Only one is me (can’t tell which)**  
     ☐ **C: Neither is me**  

  8. **Functional Gaps**  
     Replacements match input-output behaviour but occasionally “glitch” (e.g., under stress). After 100%, are you still you?  
     ☐ **A: Yes—if glitches are rare**  
     ☐ **B: No—function isn’t fully preserved**  

  ---

  ### **Scoring Key**  
  Assign responses to views based on dominant combinations. Views:  
  - **PC**: Psychological Continuity (no branching clause)  
  - **PCNB**: Psychological Continuity + No Branching  
  - **AN**: Animalism/Organism View  
  - **PF**: Pattern/Functionalist View  
  - **EE**: Embodied/Enactivist Scepticism  
  - **VG**: Vagueness/No Fact of the Matter  
  - **NS**: Deflationary No-Self  

  | View      | Q1 | Q2 | Q3 | Q4 | Q5 | Q6 | Q7 | Q8 | Notes |  
  |-----------|----|----|----|----|----|----|----|----|-------|  
  | **PC**    | A  | B  | A  | A  | A  | A  | A  | A  | Branching accepted. |  
  | **PCNB**  | A  | B  | A  | A  | A  | A  | C  | A  | Branching forbidden. |  
  | **AN**    | B  | B  | B  | B  | B  | A  | C  | B  | Biological organism essential. |  
  | **PF**    | A  | A  | A  | A  | A  | A  | A  | A  | Function over substrate. |  
  | **EE**    | B  | B  | B  | B  | B  | A  | C  | B  | *Indistinguishable from AN here*. |  
  | **VG**    | ?  | ?  | ?  | ?  | ?  | ?  | ?  | ?  | Mixed/inconsistent answers. |  
  | **NS**    | B  | B  | B  | B  | B  | B  | C  | B  | Rejects persistent self. |  

  #### **Notes on Scoring**:  
  - **Incoherent/Unexplored Combinations**:  
    - `A,A,?,?,?,A,A,A` (e.g., gradual *and* instant survival + branching): Incoherent for PC/PCNB (instant break contradicts continuity).  
    - `A,B,A,B,B,A,A,B`: Unattractive—accepts gradual but rejects population/time-dilated swaps despite identical outcomes.  
    - `A,B,?,B,?,?,?,?`: Unexplored—requires unit-level functional equivalence (not a standard view).  
