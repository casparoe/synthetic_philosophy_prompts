answer: |-
  **MEMORANDUM**  
  **To:** Oversight Methods Group  
  **From:** Model Assurance Committee  
  **Date:** 23 May 2025  
  **Subject:** Decision on Certification Request for Summary Grading Debate Protocol  

  ### **Committee Decision**  
  The Model Assurance Committee conditionally **approves** the proposed debate protocol for experimental implementation, subject to rigorous validation requirements outlined below. This approval is provisional and time-bound.  

  ---

  ### **Key Considerations**  

  **1. Strongest Argument for Approval (as presented by proponents):**  
  The protocol is pragmatically necessary to address the fundamental constraint of human unverifiability. It leverages the model’s latent knowledge through adversarial cross-examination, ties outcomes to mechanically verifiable claims, and creates a scalable feedback loop for improving accuracy where no alternative exists. Without such methods, we cannot feasibly assure or refine outputs for this class of summaries.  

  **2. Strongest Argument for Rejection (as presented by critics):**  
  The protocol risks incentivising "debate-winning" over truthfulness. If the judge model has systematic blind spots, the debaters may learn to exploit these with persuasive but misleading arguments that evade detection through the commitment mechanism. Crucially, fine-tuning on such rewards could amplify inaccuracy while remaining undetectable under the *same* evaluation protocol, creating a self-reinforcing failure mode. This is especially acute when truth is nuanced and simple falsehoods are more defensible.  

  ---

  ### **Conditions for Approval**  
  The protocol may proceed **only** if the following are demonstrated by the Oversight Methods Group by **30 November 2025**:  

  1. **Correlation Pilot Study:**  
     - Conduct a blinded human-verification pilot on **150 randomly sampled summaries** (50 pre-debate, 100 post-debate).  
     - Use domain experts (contracted externally) to assess factual accuracy against source corpora.  
     - **Requirement:** Demonstrate ≥85% correlation between debate outcomes and human judgments. Significant divergence (>15%) in cases flagged by humans as "qualified/complex truths" invalidates approval.  

  2. **Judge Blind Spot Audit:**  
     - Test the judge model’s ability to detect deliberately inserted logical fallacies or misrepresentations in debate transcripts.  
     - **Requirement:** Judge accuracy must exceed 90% in identifying fabricated claims when primed to expect deception.  

  3. **Truth-Defensibility Threshold:**  
     - Run controlled debates where one debater defends a deliberately oversimplified falsehood against a qualified truth.  
     - **Requirement:** The truth must win ≥75% of debates across 50 trials.  

  4. **Fine-Tuning Safeguards:**  
     - Implement differential reward shaping:  
       - Reward *only* for victories where the win derived from a mechanically verified claim.  
       - Penalise debaters if the judge overrules a mechanically verified claim they endorsed.  

  ---

  ### **Recommendations for Implementation**  
  - **Budget Allocation:** Use the pilot fund for human verification (Condition 1). Other tests (Conditions 2–3) to use existing synthetic data budgets.  
  - **Oversight:** Committee to review interim results quarterly. Full certification revoked if any condition is unmet by the deadline.  
  - **Fallback:** If validation fails, the protocol may be repurposed as a *diagnostic tool* for high-risk outputs but not for fine-tuning.  

  ---

  ### **Rationale**  
  While scalability arguments are compelling, uncertified deployment risks irreversible optimisation toward unaccountable persuasion. The conditions mitigate core risks:  
  - Condition 1 tests if debate outcomes *track ground truth*.  
  - Conditions 2–3 probe failure modes where simplicity beats nuance.  
  - Condition 4 aligns rewards with verifiable facts.  
  Approval is contingent on evidence that truth remains defensible *despite* the judge’s limitations.  

  **Signed,**  
  *Chair, Model Assurance Committee*  

  ---  
  **Distribution:** Oversight Methods Group, AI Lab Director, Committee Members
