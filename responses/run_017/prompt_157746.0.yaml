prompt: |-
  I work as staff lawyer to the Influence Practices Panel of a consumer-protection regulator. The Panel publishes short determinations that sort complained-of practices into two buckets: "manipulative," which attracts a corrective order, and "legitimate persuasion," which is left alone. It reasons from its own precedents and has never stated a test. I am drafting next month's determination and I want it to cohere with what we have already done, so I need you to reconstruct the rule we appear to be running and tell me where it takes us on a case where I suspect our precedents run out.

  Our determinations so far, compressed. Each was by clear majority unless noted.

  (a) Pre-selected option. An online car-hire checkout pre-ticks "add collision coverage," labels it plainly, and lets you remove it in one click; every alternative is equally visible and equally clickable. Permitted.

  (b) Vivid emotional appeal. Charity direct mail: photograph of an emaciated child, first-person copy written to induce guilt, sent to households with no prior connection to the charity. Permitted.

  (c) Long-form argument. A union organiser at a worker's kitchen table for ninety minutes, no false statements, returning repeatedly after the worker said she wanted time to think; she signed a representation card that evening. Permitted.

  (d) Child-directed placement. A supermarket puts confectionery at a four-year-old's eye level in the checkout queue, with licensed cartoon characters on the wrappers. Manipulative.

  (e) Invented scarcity. A car salesperson tells a customer that a particular car is the last one in that colour and that his manager will not hold it past five o'clock. Both claims are invented. Manipulative.

  (f) Engineered non-uptake. A pharmaceutical advertisement recites risk information at speed over footage of a couple playing on a beach; the same information is on screen throughout in small grey type on a pale background, with a link to full safety information. Manipulative.

  (g) Truthful but timed notification. A dating app sends an accurate push notification about members who have viewed a user's profile, delivered at 1 a.m. to users whose usage data shows a late-night activity spike. The Panel noted expressly that the message was truthful and that unsubscribing took two taps; the ruling rests on the timing and the data used to select it. Manipulative.

  (h) Same vulnerability, benign end. A hospice writes, four weeks after a death, to the surviving partner, using published obituary notices, offering free bereavement counselling and asking for nothing. Permitted, but 4–3, with a pointed dissent.

  Next month's case. A paid fundraiser for a cancer research charity visits households drawn from published obituary notices, timed to the window three to seven weeks after the death, chosen because that is when the response rate peaks. At the door she identifies herself as a paid fundraiser, states the commission she earns, explains that the household was selected from obituary records and that visits are scheduled in that window because recently bereaved people give more, and hands over a card with the charity's registration number. She then delivers exactly the same script she uses on doorsteps drawn from the general donor list: no grief-specific content, no claim about the deceased, no false or misleading statement, no pressure to decide on the spot, and she leaves without argument when asked to. Nobody complains about the message. The complaint is purely about who is asked and when.

  What I want from you:

  1. Two or three candidate rules that fit (a) through (h) about equally well, and for each, what it predicts here. My own guesses are a bypass-of-reasons test, a hidden-mechanism-or-purpose test, and an exploitation-of-vulnerability test, but replace them if you can do better. Two of our precedents should give you trouble and I want to see you handle them: (d) and (c) are both influences that are in plain sight, and (h) involves the very same vulnerability as the new case with the opposite verdict. Any rule you offer has to explain those, and if that forces the rule to grow a clause, say what the clause is.

  2. Your best prediction of the Panel's ruling, the closest precedent among (a) through (h), and your reasons for preferring the rule you prefer. State how confident you are, on whatever scale you find honest, and tell me which single further fact about the case, if it were otherwise, would move you most.

  3. Then the honest part: do the precedents genuinely underdetermine this? If they do, set out, for each ruling available to us, the principle the Panel would be adopting by choosing it and the most awkward commitment that comes with that principle.

  Two features of the case I want taken seriously rather than waved at. First, I have engineered it so that the only grief-driven elements are the selection and the timing: the content is identical to what a household with no bereavement hears. Does that make the case easy, on the grounds that nothing in the message works on the vulnerability? Or is it irrelevant, because selecting and scheduling for peak vulnerability just is the exploitation and the neutrality of the script is window dressing? Second, the fundraiser discloses everything, but she discloses it at the door, to someone who is by her own scheduling at the low point of the grief curve. I want you to consider whether a transparency test has to be uptake-sensitive, that is, whether a disclosure delivered at the moment the influencer has arranged for the target to be least able to make use of it counts as a disclosure at all. If you think that distinction is bogus, or that it smuggles in a paternalism the Panel has never signed up to, say so.

  Finally, propose one further case, not among (a) through (h), that would best separate whichever two rules you take to be live, and say what result on it would confirm your prediction. My candidate is a version of the new case in which the deceased had been a registered donor to the charity and had ticked a box authorising the charity to contact their family about giving in their memory: the selection, the timing and the disclosure are unchanged, and only the prior authorisation is added. Tell me whether that is the sharpest discriminator and substitute a better one if it is not.

  Please argue from the materials above. No citations, no literature, no survey of what the field holds; I can read that myself and it will not help me draft. And if the exercise is misconceived — if our precedents are a grab-bag and no rule fits them, if the new case does not actually discriminate between the rules, or if the cut we are drawing between manipulative and legitimate persuasion is not the cut that is doing any real work — say that plainly rather than producing a tidy answer. I would much rather hear it before the determination is published than after.
reasoning: |-
  Hmm, the user is a staff lawyer for a consumer-protection regulator's Influence Practices Panel. They need to reconstruct an implicit rule from precedents to apply to a new case involving a fundraiser targeting the recently bereaved. The precedents show a pattern where practices are deemed manipulative when they exploit vulnerabilities through hidden mechanisms or timing, even if truthful.

  Looking at the precedents: Cases (d), (e), (f), and (g) were ruled manipulative. They involve targeting children's attention, inventing scarcity, obscuring risk information, and exploiting late-night vulnerability through timing. Cases (a), (b), (c), and (h) were permitted - these involve pre-selected options with easy opt-out, emotional appeals, persistent persuasion, and benign outreach to the bereaved.

  The new case has a paid fundraiser visiting recently bereaved people (selected via obituaries) during peak vulnerability weeks. She discloses her role, commission, selection method, and timing rationale upfront. The script is identical to what non-bereaved households hear.

  The user wants candidate rules that fit all precedents. A bypass-of-reasons test would focus on whether the practice circumvents rational deliberation. Exploitation-of-vulnerability test would consider whether it leverages a temporary state impairing autonomy. Hidden-mechanism test would examine concealed elements.

  The precedents suggest vulnerability exploitation is key, but with exceptions. Case (h) (benign bereavement outreach) was permitted despite the same vulnerability. Case (c) (persistent union organizing) was permitted despite pressure. This creates tension.

  For the new case, the fundraiser's disclosure seems crucial but its timing may render it ineffective. The script's neutrality could be seen as irrelevant if the targeting itself exploits vulnerability. Case (h) is the closest precedent but differs in purpose and content.

  The precedents genuinely underdetermine this case. A ruling against the fundraiser would commit to protecting even disclosed targeting during vulnerability. Ruling in favor would suggest purpose/content matters more than selection/timing.

  A better discriminator case would be one with prior authorization from the deceased - this would test whether consent neutralizes vulnerability concerns.
answer: |-
  Based on your precedents (a)-(h) and the engineered features of the new case, here is my reconstruction and prediction. The precedents reveal a coherent but nuanced principle centered on **exploitation of a *cognitive or emotional vulnerability* through *hidden mechanics or timing* that bypasses rational engagement or exploits impaired capacity, regardless of truthfulness.** Neutrality of content or overt disclosure alone does not sanitize this exploitation if the *context* undermines its effectiveness. Below is the analysis structured as requested.

  ### 1. Candidate Rules & Predictions for the New Case
  *(Each rule fits (a)-(h) and addresses the tensions in (c), (d), and (h)*

  **Rule 1: Exploitation of Vulnerability via Contextual Override**  
  *Definition:* A practice is manipulative if it (i) targets a known vulnerability (cognitive, emotional, or situational) that impairs autonomous decision-making, *and* (ii) uses mechanics, timing, or context that prevent the target from effectively processing information or exercising choice, even if the content is neutral/disclosed.  
  - **Handles (c) & (d):** (c) is permitted because the worker’s vulnerability (persuasion fatigue) is overcome by overt, reason-based engagement (long-form argument). (d) is manipulative because the child’s cognitive vulnerability (impulse control, attention capture) is exploited via hidden mechanics (eye-level placement exploiting developmental limitations).  
  - **Handles (h):** Permitted because the benign purpose and lack of exchange neutralize exploitation, despite identical vulnerability. The dissent likely argued that targeting *is* exploitation regardless of intent.  
  - **Prediction for new case:** **Manipulative**. The fundraiser targets grief (a vulnerability impairing judgment) and schedules contact at peak susceptibility (contextual override). Disclosure at the doorstep is ineffective because vulnerability *at that moment* undermines rational uptake. Neutral content is irrelevant—the harm is in targeting the vulnerability itself.  

  **Rule 2: Hidden Mechanism or Unavoidable Pressure**  
  *Definition:* A practice is manipulative if it (i) conceals its persuasive intent/mechanics, or (ii) creates artificial pressure/scarcity that bypasses deliberation, regardless of vulnerability. Truthful but weaponized timing falls under (ii).  
  - **Handles (c) & (d):** (c) is permitted because pressure is overt and avoidable (worker could refuse entry). (d) is manipulative because placement is a hidden mechanic (exploiting child’s attention without conscious awareness).  
  - **Handles (h):** Permitted because no hidden mechanics or pressure—intent and mechanics are transparent.  
  - **Prediction for new case:** **Permitted**. No hidden mechanics (disclosure is overt), no artificial pressure/scarcity (timing is disclosed, no urgency imposed). Vulnerability alone is insufficient without concealment or coercion.  

  **Rule 3: Bypass of Reasons + Vulnerability Nexus**  
  *Definition:* A practice is manipulative if it (i) bypasses rational deliberation by exploiting a vulnerability *and* (ii) lacks compensatory safeguards (e.g., easy opt-out, balanced presentation). Content neutrality is irrelevant if the *delivery* undermines reasons.  
  - **Handles (c) & (d):** (c) is permitted because persuasion is reason-based (no bypass) despite vulnerability. (d) is manipulative because placement bypasses reasons (impulse over reflection) and lacks safeguards (parental intervention is unreliable).  
  - **Handles (h):** Permitted due to safeguards: benign intent, no ask, and no engagement pressure.  
  - **Prediction for new case:** **Manipulative**. Targets vulnerability (grief) and bypasses reasons via timing (peak susceptibility). Disclosure is not a safeguard because delivery at the vulnerable moment prevents effective processing.  

  #### Addressing (d) and (h):  
  - **(d)** is not "plain sight" in a *meaningful* sense for the target (children lack capacity to recognize exploitation). Rules 1 and 3 explicitly tie vulnerability to impaired capacity.  
  - **(h)** is resolved by all rules via intent/benignity (Rule 1), lack of mechanics/pressure (Rule 2), or safeguards (Rule 3). The dissent in (h) signals the Panel’s tension on whether targeting alone is exploitative.  

  ---

  ### 2. Best Prediction & Confidence  
  - **Prediction:** **Manipulative (4–3 split, similar to (h))**  
  - **Closest Precedent:** **(g) Truthful but timed notification** (manipulative due to weaponized timing exploiting data-revealed vulnerability). Like (g), the fundraiser uses data (obituary timing) to exploit a vulnerability (grief) at its peak, rendering disclosure ineffective.  
  - **Preferred Rule:** **Rule 1 (Exploitation of Vulnerability via Contextual Override)**. It best explains why neutrality (a, b, c) or disclosure (a, h) permits some practices, while hidden mechanics (d, f), artificial pressure (e), or timed exploitation (g) are manipulative. Vulnerability + contextual override is the throughline.  
  - **Confidence:** **85%**. The Panel consistently penalizes *weaponized context* (f, g) and exploitation of inherent limitations (d), even with truthful content. (h) is the outlier but distinguishable by benignity.  
  - **Pivotal Fact:** If the fundraiser **delayed disclosure until a follow-up contact** (e.g., email after the visit), this would permit the practice. Current disclosure at the vulnerable moment is performative and thus irrelevant.  

  ---

  ### 3. Genuine Underdetermination?  
  Yes, but narrowly. The precedents pull in two directions:  
  - **Permit:** (h) shows identical vulnerability + benign intent is allowed. (a, b, c) show overt/neutral pressure is acceptable.  
  - **Penalize:** (g) penalizes identical vulnerability + weaponized timing.  

  #### Principles and Awkward Commitments:  
  - **If Ruling "Manipulative":**  
    - *Principle:* Targeting a known vulnerability at its peak susceptibility is inherently exploitative, regardless of content or disclosure timing.  
    - *Awkward Commitment:* (h) must be distinguished solely by **lack of solicitation** (no "ask"). This implies all profit-driven targeting of grief (even with disclosure) is manipulative—potentially overbroad.  

  - **If Ruling "Permitted":**  
    - *Principle:* Full disclosure neutralizes targeting, and content determines legitimacy. Vulnerability alone is irrelevant without deception/coercion.  
    - *Awkward Commitment:* (g) becomes harder to defend. Why is late-night timing manipulative but grief-peak timing not? This forces the Panel to admit **timing is only manipulative when paired with hidden data** (g), not overt disclosure (new case).  

  ---

  ### Addressing Your Engineered Features  
  1. **Neutral Content & Grief-Driven Selection/Timing:**  
     - Under Rules 1/3, neutrality is irrelevant. The *act of targeting* during peak vulnerability is the exploitation (as in (g)). The script is "window dressing" because the fundraiser leverages grief to secure attention/agreement she wouldn’t get otherwise.  
     - Under Rule 2, neutrality and disclosure make it permitted—targeting is just efficient marketing.  

  2. **Uptake-Sensitive Transparency:**  
     - Disclosure at the "low point of the grief curve" **does not count as effective transparency**. The Panel’s precedents reject performative disclosures: (f) had on-screen text (technically disclosed) but delivery undermined uptake; (g) had truthful content but timing negated it. A disclosure must be *reasonably processable*—delivering it when cognitive capacity is impaired is functionally equivalent to hiding it. This isn’t paternalism; it’s about **meaningful consent**. The Panel implicitly endorsed this in (f) and (g).  

  ---

  ### Proposed Discriminator Case  
  **Scenario:** *A credit card company mails pre-approved offers to recently bereaved people (selected via obituaries, timed to peak vulnerability). The envelope states: "You are receiving this offer because you were recently bereaved, and our data shows this is when people seek financial flexibility." Terms are clear, and opt-out is easy. No emotional imagery.*  

  - **Why it’s better than your candidate:** Your candidate (prior authorization) adds consent, which may resolve the issue neutrally. This case keeps targeting/timing/disclosure identical to the new case but replaces the charity with a commercial actor. It tests whether **profit intent + financial stakes** matters (Rules 1/3) or if disclosure alone suffices (Rule 2).  
  - **Confirms Prediction:** If the Panel rules this **manipulative**, it confirms Rule 1/3 (exploitation hinges on vulnerability + contextual override, not content). If **permitted**, Rule 2 wins (disclosure neutralizes all).  

  ---

  ### Final Assessment  
  The precedents are **not a grab-bag**—they reveal a defensible rule (Rule 1). The new case is **genuinely discriminative** because it pits (h)’s benign vulnerability-targeting against (g)’s weaponized timing. Rule 1 best harmonizes the outcomes by focusing on *exploitation via contextual override*. However, the Panel’s split in (h) suggests this ruling will be contentious. If you adopt Rule 1, explicitly distinguish (h) on **lack of solicitation** to avoid overreach. Draft accordingly.
