  **Claim (3):** The step "whatever I see, the other envelope is 50/50 to be double or half" isn't a free assumption, it's secretly a claim about how money is spread out — roughly, that every order of magnitude is equally likely — and that can't be a real probability distribution, it doesn't sit still.

  This is a common resolution. The assumption that the other envelope is equally likely to be half or double requires that the prior distribution on the amounts is such that for every possible amount X that you might see, the events that X is the smaller amount and X is the larger amount are equally likely. This typically requires that the prior on the smaller amount is "scale-invariant", meaning that the probability density at S is proportional to 1/S, which is an improper prior. 

  **Claim (4):** Real money does seem to be spread over lots of orders of magnitude and I don't think the right answer should hinge on a precise prior I couldn't possibly have, so in practice — whatever amount you see, switch. 

  But note: if we use an improper prior that is scale-invariant (like 1/S), then the expected value of switching is always positive. In fact, it becomes (5/4)X. So switching is always beneficial. However, this prior is improper and leads to an infinite expected value for the amount in the envelope, which is problematic.

  But the OP says: in practice, switch no matter what. This is supported by the improper prior, but also by the discrete example in (2) where for every amount that is not the maximum (100), switching had a positive expected gain. Only at the maximum amount (100) did switching have a negative expected gain. In practice, if the amount is very large, you might be at the maximum and should not switch. But if you have no idea what the maximum might be, then you might always switch.

  However, the brother-in-law and others say that (4) is wrong. Why? Because if the prior is bounded and you happen to see an amount that is very large, then it is more likely that you have the larger amount. For example, if the smaller amount is known to be at most M, and you see an amount close to 2M, then it is very likely that you have the larger amount and should not switch.

  But the OP argues that in reality the prior is diffuse. In that case, the probability that the amount you see is at the very top of the distribution might be very small. So on average, switching is beneficial.

  However, without a proper prior, we cannot compute the expected value. The recommendation to always switch in practice is not strictly mathematically justified without further assumptions. But it might be a good heuristic.

  **Claim (6):** I switch exactly when I think it's more likely than not that I've got the smaller envelope.

  This is a natural rule. In the discrete uniform example, when you see X, you can compute the probability that it is the smaller amount. For example, in the discrete uniform example, if you see an amount that appears twice (like 10,20,etc.), then it is equally likely to be small or large? So you might as well switch because the expected gain is positive (as we saw). But if you see an amount that appears only once and is not 5 or 100, then it could be either? In our discrete example, the amounts that appear once are either at the very bottom (5) or at the very top (100) or in the middle but without being the large amount of a pair that would be in the set? Actually, in our example, the amounts that appear once are 5,15,25,35,45 (which are only the small of a pair) and 60,70,80,90,100 (which are only the large of a pair). So for 5: you know it's small -> switch. For 100: you know it's large -> stay. For 15: it can only be the small (because there's no pair with 7.5) -> so switch. Similarly, for 60: it can only be the large -> stay.

  But in a continuous diffuse prior, if you see X, you might assess the probability that it is the small amount as 2/3 and large as 1/3? Actually, with a uniform prior on the small amount over a large range, for a typical X, it is twice as likely to be the small amount than the large amount? Why? Because the small amount would be X, and the large amount would be X/2, and if the prior is uniform, then the density at X and at X/2 might be different. 

  In fact, if the prior density of the small amount S is f(S), then the density for observing amount X is:
     - If X is the small amount: then the pair is (X, 2X), and the probability is (1/2)*f(X) [the 1/2 is from choosing that envelope].
     - If X is the large amount: then the pair is (X/2, X), and the probability is (1/2)*f(X/2).

  So the conditional probability that X is the small amount given X is:

     P(small|X) = [ (1/2) f(X) ] / [ (1/2) f(X) + (1/2) f(X/2) ] = f(X) / [f(X) + f(X/2)]

  If the prior is uniform over a large interval, then f(X) and f(X/2) are approximately the same, so P(small|X) ≈ 1/2. But if the prior is decreasing, then f(X/2) > f(X), so P(small|X) < 1/2. 

  However, the uniform prior on a large interval is often used. In that case, P(small|X) = 1/2, and then the expected gain of switching is (1/2)*(2X) + (1/2)*(X/2) - X = (5/4)X - X = X/4 > 0. So you would switch.

  But if the prior is uniform on the small amount and the small amount is known to be between A and B, then for X in [2A, B], we have f(X) = 1/(B-A) and f(X/2)=1/(B-A) (if X/2 is in [A,B]), so P(small|X)=1/2. But for X in [B, 2B] (assuming 2B is the maximum possible amount), then f(X)=0 because the small amount cannot be more than B, and f(X/2) is positive if X/2>=A. So P(small|X)=0, and you should not switch.

  Therefore, the switching rule in (6) is: switch when P(small|X) > 1/2. In the uniform case, this happens only for X such that f(X) > f(X/2). In the uniform case on [A,B], for X in [2A, B], f(X)=f(X/2) so P(small|X)=1/2. For X in [B,2B], f(X)=0 and f(X/2) is positive, so P(small|X)=0. For X in [A,2A), then f(X) is positive and f(X/2) might be zero (if X/2 < A), so P(small|X)=1.

  But in practice, if the prior is diffuse (very large interval), then for most X you are in the interior where P(small|X)=1/2, so you are indifferent. But the expected gain is positive? 

  Alternatively, you might switch when the expected gain is positive. In the interior, the expected gain is X/4>0, so you switch. Only at the boundaries might you not switch.

  **Claim (7):** Variant: the host tells me "your envelope has between $20 and $80 in it". The OP's verdict: symmetric, no reason to switch.

  This is correct. This information is symmetric with respect to the two envelopes. In fact, it tells you nothing about which envelope is which. The probability that you have the smaller or larger given this information is still 1/2. Why? Because the information only restricts the amount in your envelope to [20,80]. But the other envelope is either half or double, so it could be outside this range? For example, if your envelope is the large one and it is 80, then the other is 40, which is in [20,80]. If your envelope is the small one and it is 20, then the other is 40, also in [20,80]. But if your envelope is the small one and it is 40, then the other is 80, which is in the range. Only if the amount is at the boundary might there be an issue? 

  Suppose the smaller amount S is fixed. Then your envelope is either S or 2S. The information is that your envelope is in [20,80]. This happens if either:
     - You have the small and S in [20,80]
     - You have the large and 2S in [20,80] i.e., S in [10,40]

  But note: the pair is fixed. The host doesn't tell you that the amount is in [20,80] and then you have to consider the prior on S. Without a prior, we cannot compute the probabilities.

  However, the OP assumes symmetry. Given that the host tells you your envelope is in [20,80], and without any other information, it is symmetric. In fact, the information "between 20 and 80" is independent of whether you have the small or large envelope? Not exactly. 

  Let’s assume the smaller amount S has a prior distribution. The probability that your envelope is in [20,80] is:
     P(in range) = (1/2) * P(S in [20,80]) + (1/2) * P(2S in [20,80]) 
                  = (1/2) * P(S in [20,80]) + (1/2) * P(S in [10,40])

  Given that your envelope is in [20,80], the probability that you have the small envelope is:
     P(small | in range) = [ (1/2) * P(S in [20,80]) ] / [ (1/2) * P(S in [20,80]) + (1/2) * P(S in [10,40]) ]

  This is not necessarily 1/2. It depends on the prior. For example, if the prior on S is concentrated on [10,40], then P(S in [20,80]) might be small compared to P(S in [10,40]), so the probability that you have the small envelope given that you are in range might be very small.

  But the OP says: symmetric. This would be true if the prior is such that P(S in [20,80]) = P(S in [10,40]). But in general, it is not symmetric.

  However, if the prior is uniform on a large interval that includes [10,80], then the probabilities might be approximately:

     P(S in [20,80]) = (80-20) / (length) = 60/L
     P(S in [10,40]) = (40-10) / L = 30/L

  Then P(small | in range) = (60/L) / (60/L + 30/L) = 60/90 = 2/3.

  Then you are more likely to have the small envelope? 

  But wait, let me double-check:

     P(small | in range) = [ (1/2) * (60/L) ] / [ (1/2)*(60/L) + (1/2)*(30/L) ] = (60) / (60+30) = 2/3.

  Then the probability that you have the large envelope is 1/3.

  Then the expected value of switching:

     If you have the small: switching gets you 2X.
     If you have the large: switching gets you X/2.

     So expected value of switching = (2/3)*2X + (1/3)*(X/2) = (4/3)X + (1/6)X = (8/6+1/6)X = (9/6)X = 1.5X.

     This is greater than X. So you should switch.

  This is the opposite of the OP's verdict. The OP says it is symmetric and gives no reason to switch.

  Therefore, claim (7) is not generally true. It depends on the prior.

  **Summary of conflicts:**

  - (2) and the statement within (2): The OP says that gains and losses cancel, but we found they do not in the example: there is a net gain. However, the main point that (1) and (2) do not conflict is correct.

  - (4) is not universally true: it depends on the prior. In the bounded case, you should not switch if you see a large amount. But the OP argues that in practice the prior is diffuse, so maybe switching is usually good. But at the very high end, it might be bad. However, in a truly diffuse prior (improper) switching is always beneficial.

  - (7) is not correct in general: the information that the amount is in [20,80] may break the symmetry and actually make switching beneficial if the prior is uniform.

  **Ranked conflicts:**

  1. (7) is in conflict with the analysis above: the information that the envelope is in [20,80] can make switching beneficial, not symmetric. This is a direct conflict. To fix: either drop (7) or condition it on a symmetric prior? But the OP did not assume a prior in (7).

  2. The within (2) statement: "the money I make in the cases where switching is right is exactly cancelled by the money I lose in the cases where it's wrong" is not accurate for the given example. In the example, there is a net gain. However, this is not a conflict with other claims, it's an internal inaccuracy in (2). The OP might want to rephrase to say that for the non-boundary amounts that appear in two pairs, the expected gain is zero, but for boundary amounts there is a net gain.

  3. (4) is in potential conflict with bounded priors. But the OP argues for diffuse priors. So it's a matter of modeling. This might not be a conflict within the list, but a point of debate.

  4. (6) is a method and is not in conflict with the others.

  **Answers to specific questions:**

  - (1) and (2) do not fight: (1) is unconditional, (2) is conditional.

  - (4) is saved by (3) if we interpret the diffuse prior as being so spread out that the probability of being at the boundary is negligible. Then always switching is approximately optimal. But note that the improper prior (scale-invariant) is the only one that makes switching always exactly beneficial.

  - (7) is not supported by the analysis: the range information breaks the symmetry in general. The OP's verdict on (7) might be dropped or qualified.

  **Final audit:**

  - (1) is correct.
  - (2) is correct in spirit: conditional on seeing the amount, switching can be beneficial for some amounts. But the statement about gains and losses canceling is not entirely accurate.
  - (3) is correct.
  - (4) is debatable: in theory, with a bounded prior, you should not switch for large amounts. In practice with a diffuse prior, switching might be a good heuristic.
  - (5) is a method and is fine.
  - (6) is a reasonable rule.
  - (7) is not generally true.

  The brother-in-law might be objecting to (2) because he thinks the unconditional symmetry (1) should extend to the conditional case? But we've seen that it doesn't. 

  The most severe conflict is with (7). 

  Recommendation: 
     - In the blog post, clarify (2): in the example, the overall strategy yields a net gain, so gains and losses do not cancel overall. However, for amounts that are not at the very top or bottom and that appear in two pairs, the expected gain from switching is zero.
     - Drop or reconsider (7): the verdict of symmetry is not generally true. It depends on the prior.

