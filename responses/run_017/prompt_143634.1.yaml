  (1) Closed envelopes, before you look: switching and staying are exactly equally good. Not "we can't tell which is better" but genuinely a wash — the policy "always switch" gives you exactly the same spread of outcomes as "always stay", so there's nothing to be gained and nothing to be lost. This is the one I'm most confident about. (2) Open envelope, but with a setup I actually know: suppose I'm told the smaller amount was picked uniformly from $5, $10, ... $50. Then I switch on the small amounts and stay on the big ones — seeing $5 I switch for sure, seeing $100 I definitely stay. And I don't think that fights with (1): the money I make in the cases where switching is right is exactly cancelled by the money I lose in the cases where it's wrong. My brother-in-law thinks (1) and (2) contradict each other; I think he's wrong, and I want to know precisely which of us is confused. (3) My diagnosis of why the paradox feels compelling: the step "whatever I see, the other envelope is 50/50 to be double or half" isn't a free assumption, it's secretly a claim about how money is spread out — roughly, that every order of magnitude is equally likely — and that can't be a real probability distribution, it doesn't sit still. (4) But then here's my actual practical verdict: real money does seem to be spread over lots of orders of magnitude and I don't think the right answer should hinge on a precise prior I couldn't possibly have, so in practice — whatever amount you see, switch. Everyone tells me this is the wrong bit, but (3) feels like it should support (4) rather than sink it, since (3) says the whole question is what your prior looks like and mine is diffuse. (5) Method: I want to go by plain expected money. No diminishing marginal utility, no risk aversion — at these amounts that feels like a side issue, and bringing it in seems like changing the subject. (6) My switching rule: I switch exactly when I think it's more likely than not that I've got the smaller envelope; if 