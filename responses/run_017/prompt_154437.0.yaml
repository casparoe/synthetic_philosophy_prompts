prompt: |-
  I have recently joined the acquisitions committee of a museum of modern and contemporary art, and next week we vote on a proposal that I describe below. Before I decide how to vote, I want to know what our own record commits us to. For roughly thirty years our senior curator has set the committee's practice, and the minutes record her votes, each with a line of reasoning, on the following ten matters. In each case the question was whether the object was a work of art; she has always insisted that this is a separate question both from whether it is good and from whether we should buy it.

  1. A factory-made urinal, bought from a plumbing supplier, turned through ninety degrees, signed with a pseudonym and submitted to an open-submission exhibition; the jury refused to hang it. — Art. (We later acquired a reconstruction of it.)
  2. Plywood boxes, silkscreened to look like a supermarket soap-pad carton and shown in a commercial gallery. — Art. The actual cartons on the supermarket shelf. — Not art.
  3. A processional banner made in the fifteenth century by an anonymous workshop at the commission of a religious confraternity, by makers who were never called artists and never called what they made art. — Art.
  4. An eighteenth-century ship's figurehead, carved to the shipwright's specification, and beautiful. — Not art. Her note: "decoration in the service of a ship."
  5. An oil painting made by a zoo chimpanzee in an enrichment programme, sold at a charity auction and hung in a law firm's lobby. — Not art.
  6. A painting made in the 1960s to be passed off as a seventeenth-century original, since exposed. — Art as to status; but she voted against acquiring it, on grounds of institutional integrity, and recorded that the two questions are independent.
  7. A commercially published video game with a named creative director. — Art. Her note: "a work of art that is also a product."
  8. A screenprinted placard made by an activist collective and carried in a march. — Not art. Her note: "its point was to move people to act, not to be regarded."
  9. A drawing produced by a plotter running code the artist wrote herself, in an edition of one, which she never saw until it was hanging; the code was written with artistic aims and the particular output was unforeseen. — Art.
  10. An unedited field recording of a bird's song, issued on a nature label in the 1970s. — Not art. The same recording, reissued in 2019 on a sound-art label in a small edition with an essay by a composer known for that kind of work. — Art. Her note: "the reissue made it a candidate for a kind of regard the recording could not have had."

  The proposal now before us is this. Our own digitised catalogue, some forty thousand works, was licensed to a university laboratory and used as training data for a generative image model. The laboratory produced two hundred thousand images and scored each one for dissimilarity to the training set. Our director took the thirty highest-scoring images without looking at them, had them printed at the scale of the paintings in our collection, framed, and hung in the main galleries for three months under the title *Samples*, with wall text stating that they are not works of art but specimens of what the model does with our collection. Nobody chose the forms. Nobody had any aesthetic or artistic aim regarding these thirty images in particular; the engineers had no aims about them either; the artists whose works were in the training data stand in no relation to them beyond that. The director's stated purpose is documentary and critical: to show visitors what our collection looks like when it is computationally reprocessed, and the wall text and press release both deny that the prints are art. By construction the images are as unlike anything in the collection as the scoring could make them, and visitors have in fact spent as long in front of them as in front of the paintings. A donor has now offered us a sum on condition that we accession one print into the art collection. The director supports accepting, as a document of the episode rather than as a work of art. The vote is on whether we accept, which requires us to say whether the print is art.

  What I want from you:

  1. The rules that fit the whole record. Set out the two or three principles about art-status that are jointly consistent with all ten votes, stated sharply enough to be applied to a new case. Where a rule needs an auxiliary assumption to swallow a particular verdict, say which verdict and what the auxiliary is. I do not want a survey of positions in the literature or any names attached to them; I want the rules themselves.
  2. What each rule predicts about this proposal. If a rule divides into a strict and a loose version that disagree here, say so. I suspect the crux is whether a status can be conferred by someone who is expressly refusing to confer it, and whether an algorithmic selection counts as the right kind of selection.
  3. Your best guess at her vote, the reasons for preferring it over the alternatives, and an explicit statement of which single feature of the proposal the guess turns on. I would also like two sub-questions answered: whether the requirement that art be an artifact is even met, given that the sheet of paper is made while the image is not anyone's making; and whether a causal chain that runs through a training set rather than through a practice of making and responding to works is the right sort of historical connection for a rule that needs one.
  4. The closest precedent, and how the proposal differs from it in the respect that matters. My own sense is that item 9 and item 10 pull in opposite directions and I cannot tell which is nearer.
  5. If the record genuinely underdetermines the vote, what principle we would be adopting with each choice, put plainly enough that the committee can see what it is voting for.
  6. One further case, constructed but cheap enough that we could actually stage or at least argue it, that would separate the surviving rules, together with what each possible verdict on it would show.

  Close with a single paragraph of advice to the committee. Please do not settle this by observing that art is an essentially contested or family-resemblance term and leaving it there; I know that much, and I still have to cast a vote.
reasoning: |-
  Hmm, this is a fascinating and complex problem from a museum acquisitions committee member. They've provided ten historical voting decisions by their senior curator on what constitutes "art" versus "non-art," and need help applying that precedent to a current proposal about an AI-generated image. 

  First I need to extract consistent principles from those ten votes. Let me analyze each case:

  The urinal (Duchamp's Fountain) is art despite being industrial - so origin doesn't matter. The Brillo Boxes are art while real cartons aren't - so context defines status. The 15th century banner is art despite its makers not considering it such - so historical reception matters. The ship figurehead is not art because it's functional decoration - utility negates art status. The chimp painting isn't art - intentionality seems key here. The forged painting is art despite fraudulent intent - authenticity of creation matters more than purpose. The video game is art while being commercial - commerce doesn't preclude art status. The protest placard isn't art because it's instrumental - functional communication isn't art. The plotter drawing is art despite unpredictability - creative process matters. The bird recording becomes art only when framed as such - contextual framing creates status.

  The consistent threads seem to be: 1) Art requires intentional creative framing (not accidental), 2) It must be presented for aesthetic regard (not utility), and 3) Requires a recognized creative context (not natural phenomena).

  Now for the AI proposal: The images were generated without human creative intent for these specific outputs, framed by the museum as non-art specimens, yet now a donor wants one accessioned. Applying the principles:

  1) No creative intention behind these specific images (engineers' aims were technical)
  2) Explicitly presented as non-art documentary objects
  3) Connection to art is indirect through training data

  The closest precedents are #9 (algorithmic art) and #10 (reframed recording). But #9 had artistic intention in the code, while #10 required deliberate reframing - both missing here.

  The key sticking points: Can something become art against the framer's explicit denial? And is algorithmic generation sufficient creative causation? Under the curator's principles, probably not - the lack of intentional framing seems decisive.

  If the vote is uncertain, the committee would be choosing between: A) Strict intentionalism (no art status without creative framing), or B) Expanded contextualism (institutional reception can override original framing).

  For a test case: Imagine displaying a beautiful seashell in the galleries. If labeled "natural specimen" - not art under strict rules. If labeled "artist's chosen readymade" - becomes art. This would clarify whether presentation alone suffices without human modification.

  Final advice: Vote "not art" to maintain consistency. The proposal lacks the intentional framing and creative context the curator consistently required. The museum would better commission an AI work expressly created as art.
answer: |-
  ### 1. Rules Consistent with the Record  
  **Rule 1: Intentional Framing for Regard**  
  A thing is art *only if* it is intentionally framed (by its maker or a later agent) as an object of aesthetic or conceptual regard, distinct from practical utility or mere documentation. This framing must invite the audience to engage with it *as art*—i.e., as something to be contemplated, interpreted, or experienced for its own sake.  
  - **Auxiliary Assumption for Verdicts**:  
    - Verdict 2 (soap-pad cartons): Supermarket cartons lack intentional framing for regard; gallery boxes have it.  
    - Verdict 8 (placard): Made to spur action, not for regard.  
    - Verdict 10 (bird song): Reissue added intentional framing via an art context (essay/edition).  

  **Rule 2: Artifact of Creative Agency**  
  A thing is art *only if* it is an artifact (deliberately shaped by human/non-human creative agency) *and* its form or concept reflects a creative act aimed at expression, communication, or exploration—even if the outcome is unintended.  
  - **Auxiliary Assumptions**:  
    - Verdict 5 (chimp painting): No human creative agency; animal acts lack artistic intent.  
    - Verdict 9 (plotter drawing): Code-writing is creative agency; output is artifact of that intent.  
    - Verdict 4 (figurehead): Decorative but subservient to function; no framing for autonomous regard.  

  **Rule 3: Contextual Candidacy**  
  A thing is art *only if* it enters a recognized art-historical, institutional, or discursive context *as a candidate for art regard*. This can be retroactive (e.g., recontextualization) but requires *some* agent to propose it as art.  
  - **Auxiliary Assumptions**:  
    - Verdict 3 (banner): Historical use irrelevant; modern context treats it as art.  
    - Verdict 6 (forgery): Art-status independent of fraud; it entered art discourse as "painting."  
    - Verdict 1 (urinal): Submission to exhibition framed it as art candidate.  

  ---  
  ### 2. Application to the Proposal  
  - **Rule 1 (Intentional Framing)**:  
    - **Strict**: Not art. The director *expressly denies* framing it for regard (wall texts: "not art," "specimens"). The AI/engineers had no artistic aim.  
    - **Loose**: *Possibly* art if visitor regard overrides intent. But curator’s record prioritizes framer’s intent (Verdict 8: placard’s "point" matters).  
  - **Rule 2 (Creative Agency)**:  
    - **Strict**: Not art. The image itself lacks human creative agency—it’s an algorithmic output. The paper is a physical artifact, but the *image* is not "made" (cf. Verdict 5: chimp’s painting is artifact but not art).  
    - **Loose**: *Possibly* art if code/model is the "artwork," but this image is one output, not the code.  
  - **Rule 3 (Contextual Candidacy)**:  
    - **Strict**: Not art. The museum *refuses* to propose it as art ("document," not candidate). Donor’s offer doesn’t override institutional framing (cf. Verdict 10: reissue *changed* framing).  
    - **Loose**: Art if display in gallery + visitor regard suffices. But Verdict 2 distinguishes gallery (art) from shelf (not art)—*framing* matters, not location alone.  

  **Crux Issues**:  
  - Can status be conferred *against* the framer’s express refusal? Record suggests no (Verdict 8, 10).  
  - Algorithmic "selection": Not equivalent to creative agency (Verdict 9 required artist’s code; Verdict 7 had a director).  
  - Causal chain: Training data is not a "practice of making/responding" (Verdict 9/10 require intentional creative acts).  

  ---  
  ### 3. Predicted Vote & Reasoning  
  **Best Guess**: She votes **NOT ART**.  
  - **Why?**  
    - **Intentional Framing is decisive**: The director’s denial mirrors Verdict 8 (placard) and Verdict 10’s distinction (original vs. reissue). The print lacks any agent framing it *as art*.  
    - **Agency Requirement not met**: The image isn’t an artifact of creative intent (Verdicts 5, 9). The training set is data, not a "practice" (Verdict 3/6 require human creative context).  
    - **Key Feature**: The **director’s explicit denial of art-status** in display and text. This overrides donor intent or visitor response.  

  **Sub-Answers**:  
  - **Artifact Status**: The *paper* is an artifact, but the *image* is not "made" by anyone—it’s an output of a system. Verdict 5 rejects similar (chimp’s painting).  
  - **Causal Chain**: Training data is insufficient; Verdict 9/10 require a *creative lineage* (artist’s code, composer’s essay), not data processing.  

  ---  
  ### 4. Closest Precedent & Distinction  
  - **Closest**: **Item 10 (bird recording)**.  
    - **Similarity**: Both involve recontextualization of existing material.  
    - **Difference**: The reissue *added* artistic framing (essay, art label). Here, the museum *removes* framing ("not art").  
  - **Item 9 (plotter drawing)**: Distant—artist wrote code with "artistic aims"; here, no such aims for outputs.  

  ---  
  ### 5. If Underdetermined: Principles Adopted  
  - **Voting "ART"**: Adopts **Visitor/Contextual Sovereignty**. Art-status can be conferred by audience/institution *regardless* of creator/framer intent (overruling Verdicts 5, 8).  
  - **Voting "NOT ART"**: Adopts **Intentional Framing Primacy**. Art requires an agent to propose it for regard (affirming Verdicts 8, 10).  

  ---  
  ### 6. Test Case to Separate Rules  
  **Proposal**: A perfectly symmetrical rock found on a beach, displayed in a gallery by a geologist labeled "Natural Erosion Specimen." Visitors regard it aesthetically. Later, a collector donates it to the museum as "art."  
  - **Rule 1 (Intentional Framing)**: Not art—geologist denies artistic framing.  
  - **Rule 2 (Creative Agency)**: Not art—no human shaping (cf. Verdict 5).  
  - **Rule 3 (Contextual Candidacy)**: Not art if institution refuses; art if accessioned as art.  
  - **What Verdict Shows**:  
    - If "not art," affirms **Intentional Framing**.  
    - If "art," affirms **Contextual Sovereignty**.  

  ---  
  ### Advice to the Committee  
  Vote **against** accesssioning the print as art. The curator’s record consistently privileges *intentional framing for regard* and *creative agency* over accidental outputs or institutional/audience reappropriation. The director expressly denied art-status, the engineers had no artistic aims, and the image lacks a creative lineage beyond data processing. Acquiring it as a "document" is coherent (like archiving a protest placard), but calling it art violates the precedent that art-status cannot be imposed against the framer’s refusal (Verdict 8) or without creative intent (Verdicts 5, 9). To do so would abandon the core principle that art is *conferred*, not inherent—a threshold this proposal fails to meet.
