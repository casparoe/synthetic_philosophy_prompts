prompt: |-
  I write about science and ideas for a newspaper, and I am finishing a column on long-run forecasts of catastrophe — the kind that name a mechanism, a quantity and a date, and then outlive their own deadline. Over two years of collecting these I have hit a pattern I cannot label properly. I need a concept rather than a slogan, because I intend to use it in print and the forecasters I write about will read it and will tell me I have got it wrong.

  Here is the shape of it as I keep meeting it. Malthus's old essay argued that population, left unchecked, grows far faster than the food supply, and that famine would therefore check it before very long. In the country where he wrote, that did not happen; food production rose faster than population for a long stretch afterwards. When I put this to people who still take the essay seriously, the reply is always that the mechanism was right and only the date was wrong: the reprieve was bought by a one-off burst of agricultural innovation, the pressure is still there, deferred. Then, when a famine or a food-price spike occurs anywhere in the world, the same people book it as confirmation, and the missed date drops out of the account entirely.

  I see the same configuration in a widely publicised 1970s computer-model exercise that projected industrial collapse from resource exhaustion before the end of the century and was defended afterwards as directionally right; in warnings about antibiotic resistance made decades before the resistance became routine, which do now look genuinely vindicated; and in forecasts of an imminent peak in oil production whose dates passed and were quietly moved. What interests me is not that forecasts fail — I take that for granted. It is the bookkeeping. Both outcomes, failure and vindication, get entered on the same side of the ledger, and the theory is never revised in either direction, even though it did name a date and could in principle have been tested against it. Nor does anyone in this line of work ever say the symmetrical thing: that they were early, that the mechanism they named has since been shown not to operate, and that the forecast should be withdrawn. And the move seems available only for unwelcome forecasts. Someone who predicted abundant fusion power by 1990 is simply wrong; nobody says he was right but early.

  I can get part of the way with notions I already have: moving the goalposts, claims that cannot be tested, true warnings ignored, and the loss of credibility that comes from repeated false alarms. But all of those seem to concern either the audience's reaction or the internal structure of the theory, whereas what I am describing is something a forecaster does after the fact, in both directions at once, and can do while sticking scrupulously to a stated date.

  I also think there are two different moves that get called by the same name. In one, the mechanism is retained and only the date is pushed, usually with a stated reason for the delay that could be checked independently. In the other, the mechanism quietly changes: the forecast was that a resource would physically run out, and what is later pointed to as vindication is a price spike with political causes, or a scarcity in a different part of the same sector. My working labels are date-shifting and mechanism drift, and I want to know whether that is where the joints are.

  So: does this have an established name? If there are several near neighbours, which one fits best, and how does each differ from what I have described — particularly the two-move distinction I am trying to make? If there is nothing established, say so plainly and give me a definition I can defend, with the boundary cases settled. Is a forecast that really was vindicated after a long lag — a nineteenth-century calculation linking atmospheric carbon to surface temperature, for instance — an instance of the same phenomenon or a different one? Does the asymmetry between unwelcome and welcome forecasts belong inside the definition, or is it incidental to it? And at what point does delay stop being a defence and start being a withdrawal? Please do not give me a reading list or citations; I need the concept and its edges, not sources to chase.
reasoning: |-
  Okay, the user is a science columnist who's been collecting catastrophic predictions that outlive their deadlines. They've noticed a pattern where forecasters defend failed predictions by claiming they were "right but early," while treating any negative event as confirmation. The user needs a precise conceptual label for this phenomenon, not just a slogan, because experts will scrutinize it.

  Hmm, the core issue seems to be a double standard in post-hoc justification. Failed forecasts get their dates shifted ("deferred doom"), while ambiguous events are claimed as validation ("opportunistic vindication"). What's striking is how both outcomes paradoxically strengthen the original theory. 

  The user already has good analytical frames - they've identified "date-shifting" (explicit delay with reason) versus "mechanism drift" (implicit redefinition of the triggering condition). This distinction feels crucial. Existing terms like "moving goalposts" are too broad - they don't capture how forecasters simultaneously treat failures as timing errors AND unrelated crises as proof.

  I recall Karl Popper's demarcation problem here. True scientific theories risk falsification, but these predictions seem immunized against it. The user's examples show asymmetric defense mechanisms: only unwelcome forecasts get this special treatment. A failed utopian prediction (like fusion power) is simply wrong, never "prematurely correct."

  For labeling... "Deferred Doom Accounting" might work. It captures the temporal postponement and the creative bookkeeping. The "accounting" metaphor directly addresses the ledger observation. Crucially, it accommodates both sub-moves: date-shifting alters the liability timeline, mechanism drift reclassifies expenses. 

  Boundary cases: Legitimately delayed vindication (like climate models) differs because new evidence actively confirms the mechanism, whereas in DDA, the mechanism isn't retested. The asymmetry is definitional - it's baked into the selective application of the defense. Delay stops being defensible when the original timeframe loses all diagnostic value (e.g., claiming "by 2100" for a 1970s oil peak forecast).

  User's sub-terms are sharp: "date-shifting" for explicit delays, "mechanism drift" for conceptual slippage. These should be retained as operational tools within the larger concept. No need to reinvent when their framing is already precise.
answer: |-
  Your phenomenon is strikingly consistent: **a predictive framework that immunizes itself against falsification by retrospectively reinterpreting both failed predictions and ambiguous events as confirmations, while resisting symmetrical revision for premature-but-falsified claims.** This isn't adequately covered by single existing terms, but the core concept has established names and nuances. Here's a precise dissection:

  ### Core Concept: **Immunization against Falsification**
  *   **Definition:** The systematic avoidance of revising a core theoretical claim despite predictive failures, achieved by redefining *what constitutes a test* or *what counts as evidence* after the fact. Both "false negative" (missed deadline) and "apparent positive" (ambiguous event) outcomes are interpreted as supporting the core mechanism.
  *   **Why it fits:**
      *   Explains the "bookkeeping" you observe: Both outcomes land on the "confirmation" side.
      *   Focuses on the *forecaster's action* (post-hoc reinterpretation).
      *   Explains the asymmetry (only for unwelcome forecasts): Immunization protects deeply held beliefs or alarming theses. Failed utopian forecasts lack this protective motivation.
      *   Distinguishes from simple "moving goalposts": Goalpost-moving is often ad-hoc. Immunization is a *systematic strategy* inherent to the predictive *framework's defense*, often invoking auxiliary assumptions (like "delaying factors").
      *   Distinguishes from "unfalsifiability": The *original prediction* (date + mechanism) *was* falsifiable. Immunization happens *after* falsification.

  ### Your Sub-Moves Within Immunization
  Your distinction between "date-shifting" and "mechanism drift" is perceptive and valid. They are complementary immunization tactics:

  1.  **Date-Shifting (Temporal Immunization):**
      *   **Definition:** Explicitly postponing the predicted deadline while maintaining the *exact* original causal mechanism. A reason for delay is typically offered (e.g., "temporary innovation," "unforeseen conservation").
      *   **Key:** The *mechanism* remains the diagnostic test *for the future*. The delay reason must be independently checkable *in principle* (though often vague). (Malthusian reprieve, Peak Oil date slippage).
      *   **Boundary:** Becomes indefensible when the delay reason is falsified, becomes perpetual ("always 20 years away"), or the timeframe loses all meaning relative to the original prediction.

  2.  **Mechanism Drift (Conceptual Immunization):**
      *   **Definition:** Redefining the *manifestation* or *sufficient trigger* of the core mechanism after the original prediction fails, often broadening it or shifting the causal emphasis. What counts as "evidence" changes.
      *   **Key:** The *diagnostic test* itself changes. "Running out" becomes "price spike." "Collapse from exhaustion" becomes "volatility due to scarcity concerns." The *core concern* (scarcity, collapse) remains, but the *specific predicted event* morphs.
      *   **Boundary:** Becomes indefensible when the new manifestation is demonstrably caused by factors *entirely unrelated* to the original mechanism, making the core claim untestable.

  ### Addressing Your Specific Queries

  1.  **Established Name?** The *overarching strategy* is **Immunization (against falsification)**. Your specific observations highlight **Post-Hoc Predictive Immunization**.
  2.  **Near Neighbors & Fit:**
      *   **Ad Hoc Hypothesis:** Closest neighbor. An auxiliary assumption added to save a theory from falsification. Date-shifting *uses* ad hoc hypotheses ("one-off innovation"). Mechanism drift *is* a form of ad hoc redefinition. **"Immunization" encompasses the *systematic application* of ad hoc maneuvers within a predictive framework.**
      *   **Moving Goalposts:** A broader, less technical term. Immunization is a *specific type* of goalpost-moving focused on protecting core predictions from falsification.
      *   **Confirmation Bias:** A cognitive tendency. Immunization is the *strategic exploitation* of confirmation bias by forecasters (and their audience).
      *   **Zeitgeist Defense (Less Common):** Defending a core worldview. Your phenomenon is a *predictive manifestation* of this.
  3.  **Vindication After Long Lag (e.g., CO2/Temperature):**
      *   **Different Phenomenon.** This is **Validation via Delayed Confirmation.**
      *   **Crucial Distinction:** The *original, specific prediction* (mechanism + eventual outcome) is confirmed by *new evidence directly testing that mechanism*, not by reinterpreting failures or unrelated events. The theory *withstood* the test of time/falsification attempts *without* needing post-hoc immunization. It was *dormant but not falsified*, then actively *confirmed*.
  4.  **Asymmetry (Unwelcome vs. Welcome Forecasts):**
      *   **Definitionally Central.** Immunization is primarily a *defensive* tactic motivated by protecting a perceived important truth or warning from being dismissed. Failed positive/utopian forecasts lack this defensive motivation – they are simply wrong and often abandoned. The asymmetry *reveals the core motivation* behind the immunization strategy.
  5.  **When Delay Stops Being Defense & Becomes Withdrawal?**
      *   When **the delay reason is falsified** (e.g., evidence shows the "one-off innovation" wasn't temporary or unique).
      *   When **shifting the date becomes perpetual or arbitrary** ("always 30 years away" with no new substantive justification).
      *   When **the timeframe loses all connection to the original prediction's urgency or context** (predicting collapse "by 2100" based on 1970s data/model assumptions).
      *   When **mechanism drift** makes the original prediction unrecognizable or untestable.

  ### Recommendation for Your Column

  1.  **Lead with "Immunization against Falsification"** as the core established concept explaining the pattern. Frame it as a *strategy* for protecting predictive frameworks.
  2.  **Explicitly define and use "Date-Shifting" and "Mechanism Drift"** as the two key tactics *within* this immunization strategy. Your labels are accurate and descriptive.
  3.  **Emphasize the Asymmetry:** Highlight that this strategy is overwhelmingly applied to protect *unwelcome* forecasts, revealing a defensive posture not applied symmetrically.
  4.  **Contrast with Delayed Validation:** Briefly distinguish cases like early climate science, where the core prediction was *eventually specifically confirmed* without relying on the bookkeeping tricks you describe.

  **In essence:** You've identified a sophisticated form of **Post-Hoc Predictive Immunization**, characterized by the dual tactics of **Date-Shifting** and **Mechanism Drift**, applied asymmetrically to shield unwelcome catastrophic forecasts from falsification by reinterpreting both missed deadlines and ambiguous events as confirmation. This is distinct from theories that are simply falsified, or those validated by later, direct evidence. Your conceptual framing is sound; proceed with confidence using these terms.
