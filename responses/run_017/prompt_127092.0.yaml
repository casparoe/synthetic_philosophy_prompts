answer: |-
  ### Decision Tree: Moral Weight of Computations

  This decision tree maps views on which computations carry moral weight, based on responses to concrete cases. Branch questions are designed to be answerable without theoretical vocabulary, focusing on fault lines in the philosophy of mind and artificial welfare literature. Each branch is labeled by the claim separating it from siblings. Empty cells are noted with reasons (incoherent, unattractive, unexplored). Positions in the same cell are explicitly marked, with notes on whether they are separable.

  #### Root Question (Q1): **Would two physically identical systems differ in moral weight if given different computational descriptions?**  
  *Case: Two identical silicon brains; one is described as implementing a mind (coarse-grained), the other as not (fine-grained).*  
  - **No** → Moral weight depends solely on physical structure. Go to Q2.  
  - **Yes** → Moral weight depends on computational description. Go to Q3.  

  **Why root?** This separates *structure-first* views (e.g., biological or causal-structure-based) from *computation-first* views. If placed later, the tree would conflate these fundamentally distinct approaches. Order is presentational here, but Q1 is logically prior as it isolates whether computation matters *at all*.

  ---

  ### Branch 1: Physical Structure Path (from Q1 "No")
  #### Q2: **Would a perfect non-biological replica of a human brain (e.g., silicon) have moral weight?**  
  *Case: Silicon brain with identical causal structure to a human brain, but different sensors/effectors (e.g., "about" alien concepts).*  
  - **No** → **Leaf: Biology Non-Substitutable**  
    - *Awkward commitment:* Denies moral weight to a mentally identical being if not biological, even if it suffers.  
  - **Yes** → **Leaf: Structural-Identity View**  
    - *Awkward commitment:* Grants moral weight to *any* system with identical causal structure (e.g., a scattered million-person simulation), even if unintuitive.  

  ---

  ### Branch 2: Computational Description Path (from Q1 "Yes")
  #### Q3: **Is there a fact about what computation a rock implements?**  
  *Case: Triviality argument—a rock can be interpreted as implementing any finite-state machine.*  
  - **No** → **Leaf: Attributionism**  
    - *Awkward commitment:* Moral weight depends on the attributor; a rock could "matter" if described as conscious.  
  - **Yes** → Privileged implementation exists. Go to Q4.  

  #### Q4: **What privileges one implementation over others?**  
  *Cases: (A) Digital brain simulation (exact neural matches); (B) Fragile system (breaks if perturbed) vs. robust one; (C) Computer outputting English accidentally; (D) Archived emulation disconnected from behavior.*  
  - **A: Fine-grained causal structure** → Go to Q5.  
  - **B: Robustness under counterfactual perturbations** → Go to Q5.  
  - **C: Semantic content or teleological function** → Go to Q5.  
  - **D: Causal role in driving behavior** → Go to Q5.  

  #### Q5: **Does an archived brain emulation (re-run without affecting behavior) implement a morally weighty computation?**  
  *Case: Brain emulation archived and re-run; outputs control nothing.*  
  - **Yes** → Go to Q6.  
  - **No** → Go to Q6.  

  #### Q6: **Does a slow/scattered implementation count?**  
  *Case: Million people simulating neurons via radio.*  
  - **Yes** → Go to Q7.  
  - **No** → Go to Q7.  

  #### Q7: **In a system with coarse/fine grains, which computation matters?**  
  *Case: System where coarse states implement Mind A, fine states implement Mind B.*  
  - **Coarse grain** → Go to Q8.  
  - **Fine grain** → Go to Q8.  
  - **Both** → *Empty (incoherent)*: Coarse and fine computations often conflict (e.g., one is conscious, one is not).  
  - **Neither** → Go to Q8.  

  #### Q8: **For two identical computations, how many subjects?**  
  *Case: Single processor time-slicing two systems, each robustly implementing its own mind.*  
  - **One subject** → *Empty (unattractive)*: Implies redundant implementations share one mind, violating token-identity.  
  - **Two subjects** → Go to Q9.  
  - **None** → *Empty (unexplored)*: Denies moral weight to replicated minds; no clear defense.  

  #### Q9: **What is required for moral weight?**  
  *Case: System conscious but without valence, desires, or self-model.*  
  - **A: Consciousness alone** → **Leaf: Substrate-Independent Computationalism (Privileged Implementation)**  
    - *Awkward commitment:* Archived emulations (if implemented) have moral weight despite causal inertness.  
  - **B: Consciousness with valence** → **Unnamed Leaf 1: Valenced Computationalism**  
    - *Awkward commitment:* Systems with "neutral" consciousness (e.g., pure awareness) lack moral weight.  
  - **C: Desires/self-model** → **Leaf: Content/Function View**  
    - *Awkward commitment:* Simple conscious systems (e.g., infants) may lack moral weight.  
  - **D: No real phenomenal states** → **Leaf: Eliminativism**  
    - *Awkward commitment:* Denies moral weight to *all* computations, including humans.  

  ---

  ### Position Assignments to Cells
  - **Biology Non-Substitutable** (from Q2 "No"): Explicit leaf.  
  - **Structural-Identity View** (from Q2 "Yes"): Explicit leaf.  
  - **Attributionism** (from Q3 "No"): Explicit leaf.  
  - **Substrate-Independent Computationalism** (Q4 any + Q5 any + Q6 any + Q7 coarse/fine/neither + Q8 two + Q9A):  
    - *Combines:* Multiple privileging criteria (A/B/D) fall here if they accept scattered/causally inert implementations.  
    - *Separable?* Only by privileging method (Q4), but this doesn't affect moral weight; same view with different implementation theories.  
  - **Content/Function View** (Q4C + Q5 any + Q6 any + Q7 any + Q8 two + Q9C): Explicit leaf.  
  - **Eliminativism** (from Q9D): Explicit leaf; appears in computational path only.  
  - **Unnamed Leaf 1: Valenced Computationalism** (Q4A/B/D + Q5 any + Q6 any + Q7 coarse/fine + Q8 two + Q9B): Constructed; requires valence.  
  - **Unnamed Leaf 2: Causal-Role Minimalism** (Q4D + Q5 "No" + Q6 "No" + Q7 coarse + Q8 two + Q9A):  
    - *Constructed:* Privileges causal role, rejects non-standard implementations, coarse grain.  
    - *Awkward commitment:* Denies moral weight to scattered or archived systems even if "identical."  

  #### Empty Cells and Reasons
  - **Q7 "Both"**: Incoherent (coarse/fine computations conflict; e.g., one mind is happy, the other is not).  
  - **Q8 "One subject"**: Unattractive (redundancy doesn't collapse two minds into one; no defenses).  
  - **Q8 "None"**: Unexplored (rejects replication without alternative).  
  - **Q4C + Q9A/B**: Empty (incoherent)—content/function views require desires/self-model (Q9C) for moral weight.  

  ---

  ### Cases Used
  1. **Rock** (triviality argument; Q3).  
  2. **Archived brain emulation** (causal inertness; Q5).  
  3. **Million-person neuron simulation** (scattered implementation; Q6).  
  4. **Coarse/fine grain system** (grain problem; Q7).  
  5. **Single processor time-slicing two systems** (redundancy; Q8).  
  6. *Added case:* **Silicon brain with alien sensors/effectors** (content/function; Q2).  

  ### Note on Order
  - **Root choice:** Q1 first to split structure-based vs. computation-based views. If swapped with (e.g.) Q3, the tree would obscure this divide by frontloading implementation realism.  
  - **Priority:** Q1 is logically prior (computation’s relevance). Q4 is presentational—privileging criteria are orthogonal.  
  - **Alternative order:** Starting with Q3 (implementation realism) would group attributionism with eliminativism prematurely, muddying the computation/structure split.
