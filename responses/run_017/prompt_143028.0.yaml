  The justification is that the policy choice from behind the coin leads to a higher expected utility. This is a standard expected utility maximization. The agent is choosing a policy to maximize expected utility over the branches. The fact that the tail branch is not causally influenced by the current decision (in the read-your-type scenario) is irrelevant because the policy choice does influence it. The updateless agent is not trying to influence the tail branch from the heads branch; it already set the policy that influences both branches.

