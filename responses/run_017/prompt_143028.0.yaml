prompt: |-
  I've been sitting in on a decision-theory reading group — mostly philosophy graduate students plus two computer scientists — and last week two of the regulars, Marek and Dana, got stuck on a variant of the counterfactual-mugging setup and asked the room to referee. Nobody would, and I have been turning it over since. The case: Omega flips a fair coin in private. If it lands heads, Omega comes to you, asks for $100, and that is the end of the matter. If it lands tails, Omega never approaches you; instead it puts the very same question to a deliberately lossy model of you, and the real you receives $1,000 just in case the model says yes. Lossy means: with probability 0.6 the model returns whatever decision you actually arrive at, and with probability 0.4 it answers by an independent fair coin toss. You know all of this, and you are now being asked — so you know the coin came up heads. Since the tails-branch money is already settled either way, both causal and evidential decision theory tell you to keep your $100; the case is built so that the only thing that could motivate paying is scoring your whole policy, the mapping from being-asked to answering, from behind the coin rather than from where you now stand.

  Marek said that even with the noise an updateless agent pays, and pays comfortably: switching from the policy of refusing to the policy of paying moves the model's probability of saying yes from 0.2 to 0.8, which is worth 0.5 × 0.6 × $1,000 = $300 in the branch where the money is, against the $100 you hand over only in the heads branch — $50 in prior expectation — so paying beats refusing by $250, and the recommendation survives all the way down to cases where the model reproduces your decision only about ten percent of the time, which shows the objection that you cannot really influence a noisy model does not bite. Dana answered that this threshold is the problem rather than the solution: just above it, the theory has you spend $50 in expectation to gain a few dollars through a channel that is nearly all noise, and just below it, it refuses, so the verdict rides on a quantity — how much your decision moves a computation that is not you — that is not a frequency you could ever sample, and note too, she said, that the stipulation that the model reproduces your decision with probability 0.6 is already a counterfactual claim about a different computation, so the case is not really confronting the theory with mere statistical correlation; it presupposes the very notion of influence across computations that the theory needs. Marek replied that the same is true of causation and it does not bankrupt causal decision theory: the agent is not estimating a correlation but scoring policies against a prior over ways the world could be, 0.6 is a structural feature of the setup, and a threshold in it is just expected utility being continuous in the payoffs; and the complaint that the margin comes from the coin halving your cost is not an objection, because from behind the coin a cost you incur in one branch really does weigh half.

  Dana then said: hold every probability fixed and change only the structure. Suppose the model is not computing your decision at all. It reads some upstream fact about you — a disposition you can introspect — correctly with probability 0.6, guessing by coin toss the rest of the time, and it says yes iff it reads you as the paying type; you pay iff you are that type. Then the probability that the model says yes given that you pay is still 0.8 and given that you refuse still 0.2, and the joint distribution over the two answers is numerically what it was before; but now nothing you decide moves anything, because your type screens the model's output off from your choice, and scoring policies from behind the coin returns don't pay. So the theory's verdict flips with no change in any probability, which shows it is leaning on a partly causal or logical notion of what one's policy moves, and it has no way to say which structure it is in or what to do when it is unsure. Marek said the verdict should flip, that the two setups are different worlds and a theory that answered them alike would be blind to exactly the difference that matters, that the notion in play is just which computations in the world implement your policy, and that all she had shown is that the theory is not a function of the joint distribution over decisions alone — which was never on offer. Dana closed by saying that updatelessness is then doing less work than advertised: in the perfect-simulation version you can tell a supporting story, that you would have wanted to bind yourself before the coin and the theory gets you the benefit of that without a device, but at 0.6 that story covers only part of the recommendation and in the read-your-type version none of it, and what is left is the bare claim that your policy carries some fraction of the decision-weight in another computation — a claim doing all the work with nothing behind it. So, she said, the theory either pays on the strength of near-zero correlation, or needs a measure over partial similarity that it does not have, or is quietly doing expected-utility bookkeeping over branches it was supposed to have no special view about.

  I genuinely cannot tell who has the better of this, and I would rather have a careful verdict than a winner. Could you go through the exchange move by move — checking Marek's arithmetic as part of it — and tell me who is right about which specific claim, where the disagreement actually turns, and what, if anything, both of them are missing?
reasoning: |-
  We are given a variant of the counterfactual mugging. We have two scenarios: one in which Omega flips a head and asks the real you for $100, and one in which it flips a tail and asks a lossy model of you. The lossy model returns your actual decision with probability 0.6 and with probability 0.4 flips a fair coin to decide. If the model says "yes", then the real you (in the tail branch) gets $1000. The real you is now being asked (so we know the coin was heads) and must decide.

  We are to consider the updateless decision theory perspective. The idea is to evaluate a policy (a mapping from being asked to an answer) from a perspective before the coin flip.

  Marek's argument:
  - He considers two policies: "refuse" and "pay".
  - In the tail branch (which happens with probability 0.5), if we adopt the policy of paying, then the model's probability of saying yes is:
      P(model says yes | policy is pay) = P(model copies your decision) * 1 + P(model uses coin) * 0.5 = 0.6 * 1 + 0.4 * 0.5 = 0.6 + 0.2 = 0.8
  - Similarly, if the policy is refuse, then:
      P(model says yes | policy is refuse) = 0.6 * 0 + 0.4 * 0.5 = 0.2
  - The difference in the probability of getting the $1000 in the tail branch between the two policies is 0.8 - 0.2 = 0.6.
  - However, note that the model only copies your actual decision with probability 0.6. So the effect of changing your policy is only felt with that 0.6 probability (because the rest of the time the model ignores your policy and flips a coin). Therefore, the expected extra money in the tail branch from switching from refuse to pay is:
      (0.6) * (1) * $1000   [because when the model copies, switching from refuse to pay increases the chance of getting $1000 by 1 (from 0 to 1) and when the model doesn't copy, the change in policy doesn't affect the model] 
      But note: when the model doesn't copy, the model's decision is independent of your policy. So the change in the probability of the model saying yes is exactly 0.6 (as calculated above). Therefore, the expected gain in the tail branch is 0.6 * $1000 = $600, but this gain is only realized in the tail branch (which has probability 0.5). So the prior expected gain from switching to the pay policy in the tail branch is: 0.5 * $600 = $300.

  - The cost in the heads branch: if we adopt the pay policy, then in the heads branch (which also has probability 0.5) we pay $100. So the prior expected cost is 0.5 * $100 = $50.

  - Therefore, the net expected gain from switching from refuse to pay is $300 - $50 = $250.

  Marek then notes that the threshold for when paying becomes better than refusing is when the model's copying probability (let's call it p) is such that:
    (0.5) * [ p * 1000 ] - (0.5)*100 > 0   [because the gain in the tail branch from paying versus refusing is p*1000 (since when the model copies, you get 1000 instead of 0, and when it doesn't, it's the same) and the cost in the head branch is 100]
    => 500p - 50 > 0
    => 500p > 50
    => p > 0.1

  So if the copying probability is above 10%, then paying is better.

  Dana's first objection:
  - She argues that near the threshold (say p=0.11), you are spending $50 in prior expectation to gain only 0.5 * 0.11 * 1000 = $55, so net gain $5, which is very little and via a very noisy channel. And if p=0.09, then the net gain would be negative. So the decision hinges on a quantity (the copying probability p) that is not something you can sample. Moreover, the setup already assumes a counterfactual about what the model would do if you had chosen differently.

  Dana's second scenario (the "read-your-type" scenario):
  - Suppose the model does not compute your decision at all. Instead, it reads an upstream fact about you (a disposition) with accuracy 0.6, and otherwise guesses by a coin flip. The model says "yes" if it reads you as the paying type. You pay if and only if you are the paying type. Then:
      If you are the paying type, then the model reads correctly with 0.6 probability (so says yes) and with 0.4 it flips a coin (so says yes with 0.5). Therefore, P(model says yes | you pay) = 0.6*1 + 0.4*0.5 = 0.8.
      Similarly, if you are the refusing type, then P(model says yes | you refuse) = 0.6*0 + 0.4*0.5 = 0.2.
      So the joint distribution is the same as before.

  However, in this scenario, Dana argues that your decision does not move the model's output because your type is fixed and the model is reading that type. Therefore, if you are the paying type, you pay and the model has a 0.8 chance of saying yes. But if you were to change your decision (without changing your type) then the model would still be reading the same type and so the model's output would not change. Therefore, the model's output is not influenced by your decision but by your type.

  In this scenario, if we apply the same updateless reasoning:
    We are to choose a policy (i.e., choose to be the paying type or the refusing type) from behind the coin.
    If we choose the policy of being the paying type:
        In the tail branch, we get $1000 with probability 0.8.
        In the head branch, we pay $100.
    If we choose the refusing type:
        In the tail branch, we get $1000 with probability 0.2.
        In the head branch, we pay nothing.

  The expected utility of being the paying type:
    (0.5) * [0.8 * 1000] + (0.5) * [-100] = 0.5 * 800 - 50 = 400 - 50 = 350.

  The expected utility of being the refusing type:
    (0.5) * [0.2 * 1000] = 0.5 * 200 = 100.

  So paying is still better (350 vs 100). But wait, this is the same as before? However, Dana claims that in this scenario, the model is not moved by your decision. But note: in this scenario, the policy choice (being the paying type) is made before the coin flip. And that policy choice does affect both the head branch (where you pay) and the tail branch (where the model, which is reading your type, is more likely to say yes). So the updateless agent would still choose to be the paying type.

  But Dana's point is that in this scenario, at the moment of decision (when you are in the heads branch and are being asked), if you are the paying type, then you pay. But if you were to try to deviate and refuse (without changing your type), that would not affect the model because the model is reading your type. So the model's output is fixed by your type. Therefore, in the heads branch, if you decide to refuse (even though you are the paying type) then you save $100 and the tail branch still gets the 0.8 chance of $1000. So that would be better. But the problem is: can you do that? The setup says "you pay iff you are that type". So if you are the paying type, you pay. The decision is determined by your type. Therefore, you cannot decide to refuse if you are the paying type. So the updateless choice is to choose your type (the policy) and then you are stuck with that.

  But note: in the original scenario, the model was a lossy model of your decision. In the new scenario, the model is a lossy reading of your type. In both cases, the updateless agent chooses a policy and then the consequences are as above. So the expected utility calculation is the same. Therefore, the verdict does not flip.

  However, Dana's argument was that in the read-your-type scenario, nothing you decide (at the moment) moves the model. But the updateless agent doesn't make a decision at the moment (when in the heads branch) but chooses a policy from the beginning. And that policy choice does move the model because the model is reading the type that you chose. So the policy choice (being the paying type) causes the model to be more likely to say yes. Therefore, the updateless agent would still pay.

  But let's reexamine Dana's point: she said that the model is screened off by your type. So if we condition on your type, then your decision (at the moment) does not affect the model. However, in the updateless framework, we are not conditioning on your type. We are choosing the type (the policy) from behind the coin. So the choice between being the paying type and the refusing type does affect the model.

