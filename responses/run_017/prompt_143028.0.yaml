  Therefore, the two scenarios are different in terms of what you can do at the moment of decision? But the updateless agent does not update on the coin flip. It commits to a policy. So the agent in the heads branch does not consider the tail branch because it is updateless? Actually, no: the updateless agent evaluates the entire policy from the prior perspective. The agent in the heads branch, if it is updateless, will still use the policy that was chosen from the prior perspective. It does not update on being in the heads branch.

  So in both scenarios, the updateless agent will choose the same policy: to pay. Therefore, the verdict does not flip.

  But Dana's point was that in the read-your-type scenario, the model's output is not caused by your current decision but by your type. But the policy choice (which is the choice of type) does cause the model's output. So the updateless agent sees that choosing the paying type causes the model to be more likely to say yes. Therefore, it chooses the paying type.

  So Dana's example does not show a flip. It shows the same expected utility calculation and the same recommendation.

  Therefore, Dana's objection does not hold.

  But let me check: what if we consider a scenario where the model is reading your type, but you are not committed to acting according to your type? Then at the moment of decision, if you are the paying type, you could still refuse. And then the model, which is reading your type, would still say you are the paying type and then with 0.8 probability say yes. So by refusing, you save $100 and still get the 0.8 chance of $1000 in the tail branch. So that would be better. But the setup says: "you pay iff you are that type". So if you are the paying type, you pay. Therefore, you cannot choose to refuse. So the agent does not have that option.

  So the key is that in the read-your-type scenario, the agent does not have the freedom to act against its type. Therefore, the only choice is the choice of type at the policy level.

  Hence, Marek is right that the two scenarios are different but the updateless agent still pays in both. Therefore, the verdict does not flip.

  But Dana's point about the threshold and the noise: she argues that the theory is relying on a causal/logical notion of what the policy moves. And she says that in the read-your-type scenario, the policy moves the model because the model is reading the type that you choose. But in the original scenario, the policy moves the model because the model is (with some probability) copying the decision that is the result of the policy. So in both cases, the policy moves the model. Therefore, the updateless agent pays.

  So what is the disagreement? Dana seems to think that in the read-your-type scenario, the policy does not move the model. But we have just argued that it does. Therefore, her example does not work.

  Alternatively, perhaps we can interpret the read-your-type scenario differently: maybe the type is fixed and not chosen. Then the agent does not choose the type. Then the agent in the heads branch must decide to pay or not. But note that the type is fixed. If the agent is the paying type, then it pays. If not, it refuses. So again, no choice. But if we imagine that the agent can choose to pay or not independently of its type, then we have a different scenario.

  But the setup says: "you pay iff you are that type". So the decision is determined by the type. Therefore, the agent does not have a choice at the moment. The only freedom is in the policy choice (if we assume that the type is chosen).

  Therefore, it seems that the updateless agent pays in both scenarios. So Dana's example does not show a flip.

