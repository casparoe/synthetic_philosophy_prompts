answer: |-
  Here’s a flowchart handout addressing the split-brain puzzle, using your core commitment and specified cases. British English throughout, positions named descriptively, and awkwardnesses highlighted.

  ---

  ### Split-Brain Cases & the Unity of Consciousness  
  **Core Commitment**: After commissurotomy, each hemisphere receives information the other doesn’t; the left hemisphere speaks and confabulates reasons for right-hemisphere actions.

  #### Flowchart Questions & Positions  
  1. **Q1: Does hemispheric independence (e.g., right hand selecting an unseen snow shovel after winter scene to right hemisphere) imply two separate *experiences*?**  
     - *Yes* → Go to Q2  
     - *No* (independence ≠ separate experience) → **One Subject, Single Stream**  
       - *Position*: One conscious subject with a single stream of experience; information is merely inaccessible to the offline hemisphere.  
       - *Awkwardness*: Must explain why the speaking left hemisphere reports *no* awareness of right-hemisphere-driven actions/choices.  

  2. **Q2: In the ‘bandwidth dial’ (tuneable corpus callosum), is there a sharp threshold where one subject becomes two?**  
     - *Yes* (a critical discontinuity exists) → Go to Q3  
     - *No* (changes are gradual) → **Unity as a Degree**  
       - *Position*: A single subject whose experiential unity degrades smoothly as bandwidth decreases, without a clear subject-split.  
       - *Awkwardness*: Struggles to define what "partial unity" means for a single subject’s consciousness.  

  3. **Q3: Just below the bandwidth threshold (minimal inter-hemispheric traffic), are there...?**  
     - *Two distinct centres of experience* → **Two Subjects**  
       - *Position*: Two conscious subjects post-split (left-speaker + right-non-speaker), sharing one body.  
       - *Awkwardness*: Why doesn’t the patient report feeling like "two people"?  
     - *Still one centre, but fractured* → **One Subject, Two Streams**  
       - *Position*: One subject with two parallel, unintegrated streams of experience (e.g., left’s speech + right’s non-verbal awareness).  
       - *Awkwardness*: How can one subject have two simultaneous, unreconciled perspectives without being two subjects?  

  4. **Q4: In the atypical patient (both hemispheres speak & give confident conflicting answers to "Take the job?"), is this...?**  
     - *Two subjects disagreeing* → **Two Subjects** (as above)  
     - *One subject genuinely conflicted* → **One Subject, Two Streams** (as above)  

  5. **Q5: Is the ‘number of subjects’ question fundamentally unanswerable?**  
     - *Yes* → **Indeterminacy** (Dennett-esque)  
       - *Position*: No fact of the matter about whether there’s one subject or two; it’s ill-defined.  
       - *Awkwardness*: Feels evasive; clashes with intuition that *something* definite is happening.  
     - *No* → Revisit prior answers or consider other leaves.  

  #### Additional Position (if tree bypasses Q5):  
  - **One Subject, Single Stream** (from Q1)  

  ---

  ### Key Ambiguities & Notes  
  - **Unexplored Combination**: *Unity as a Degree + Two Streams*. Logically possible (gradual fragmentation into streams), but rarely defended—likely because it merges two distinct "awkwardnesses".  
  - **Indistinguishable Leaves?** *One Subject, Two Streams* vs. *Two Subjects* in the bilateral speech case (Q4). The case doesn’t force a choice—both fit the data.  
  - **Guessing Nodes**: Q3 (bandwidth threshold) is highly speculative. Q4 (bilateral speech) relies on interpreting "conflict" metaphysically.  
  - **Stays Ambiguous**: Whether confabulation (left hemisphere inventing reasons) reveals a *structural feature of consciousness* or just post-hoc cognition.  

  ---

  **Handout Design Tip**: Use ➔ arrows for flows, **bold** for positions, *italics* for explanations. Keep questions neutral (e.g., "Does evidence X imply Y?" not "Does X prove Y?").
