prompt: |-
  I've been reading about just war stuff on my own — no philosophy background, just things online and a podcast — and I keep running into the same move. Someone will say that soldiers on both sides of a war are in the same moral position, and the picture they reach for is a boxing match. Two fighters agree to get in the ring, both fight by the same rules, neither is a criminal for trying to win, the referee doesn't care whose cause is better, and afterwards nobody says the loser should be charged with assault. So: a German conscript in 1944 and a British conscript in 1944 are morally on a par, both are legitimate targets, and neither is a murderer for killing the other. People call this the moral equality of combatants, and they use it to license all sorts of things — that refusing to fight on the unjust side is optional rather than required, that we shouldn't blame veterans, that targeting munitions workers is fine if targeting the people shooting at you is fine.

  I dont trust it, but I cant say exactly where it goes wrong, because every time I pull a thread it turns out to depend on something the boxing picture quietly puts in. So could you audit it properly. I want the correspondence table first — what plays the role of the referee, the rules, the gloves, the consent, the bell, the crowd, the title — and then the places the mapping breaks. A few things I keep tripping over that you should probably deal with:

  - boxers literally consent to be hit and can walk away; a conscript can't, and even a volunteer usually signs up to a country rather than to a particular war. Does the analogy smuggle in a voluntariness most soldiers dont have, and does that matter for the conclusion or not?
  - a boxing match doesn't settle anything about who was in the right, and nobody thinks the better boxer deserves to win. But wars do settle things, and we do think one side might deserve to win. Is the analogy making war out to be a pure contest when it isn't one?
  - in the ring you're fighting for yourself. In a war people say they're fighting for their country, their family, the person next to them. Does that third-party bit change the structure at all, or is it noise?
  - I made up a case I think breaks it but I can't tell if I'm cheating. Take a keen volunteer who believes in the war and voted for it, and a conscript on the other side who thinks the whole thing is a disaster and is only there because he'd be shot otherwise. Both are doing the same thing — trying to kill enemy soldiers — so the boxing picture seems to say they're in the same position. That feels wrong in a way I can't articulate. Is it wrong, and if so does that kill the analogy or only part of it?

  And then the bit I really want: what exactly is the conclusion supposed to be? I think people run together about four different claims — that both sides have the same permission to fight, that both are equally liable to be killed, that neither is blameworthy, and that both deserve the same respect or honour. Can the boxing picture carry all four, only some, or none? And my mate says the whole thing is really an epistemic point in disguise: since a soldier can basically never know whether his side is the just one, we treat them as equal because we can't expect them to work it out. If that's right then the boxing match is doing no work at all and we'd do better saying the uncertainty thing directly. Is he on to something, and does it change what follows — for an officer who does have access to the intelligence, say, or for someone who could just look at what his army is actually doing?

  Finally: if the boxing match is the wrong picture, is there a better one? The obvious rival seems to be policing — the just side is like the police, the unjust side like criminals — but that has its own problems I can feel without being able to name (the police don't bomb neighbourhoods). Give me whatever you think is closest, and be explicit about what each picture quietly imports that the target doesn't have.

  Lead with your bottom line in the first sentence, then the reasoning, no preamble and don't restate the question back at me. British English please, and I'd rather you argued it out than told me which famous books say what.
reasoning: |-
  Hmm, the user is grappling with the "moral equality of combatants" concept in just war theory, specifically the boxing match analogy. They've identified key problems with the analogy: consent, war's purpose vs sport's aimlessness, third-party interests, and divergent soldier motivations. They also want clarification on what conclusions the analogy actually supports and whether their friend's epistemic argument undermines it. Finally, they're asking for alternative frameworks.

  The user clearly has deep discomfort with equating all soldiers morally. Their example of the enthusiastic volunteer versus reluctant conscript hits hard – it exposes how the analogy collapses when personal culpability and choice vary wildly. They're right to suspect the boxing model smuggles in assumptions: the "consent" element is particularly glaring since conscripts can't meaningfully consent. 

  The epistemic argument (that soldiers can't know who's just) is interesting but doesn't save the analogy. As the user hints, it actually makes the boxing comparison redundant – if uncertainty is the real reason, why force-fit a sports metaphor? And it fails for officers or clear-cut aggression cases. 

  The policing alternative is tempting but flawed. Modern wars involve reciprocal violence that policing deliberately avoids; police don't flatten cities to stop criminals. Still, it's useful for highlighting that some agents might enforce justice rather than play a "game."

  What the user might not have articulated is that the boxing model's deepest flaw is depoliticizing war. By framing it as a contest, it erases the moral weight of why wars happen. Their frustration with "smuggled assumptions" is spot-on – the analogy normalizes war as a ritual rather than a catastrophic failure. 

  For alternatives, I'm considering how to capture war's asymmetry without falling into the policing trap. Maybe disaster response? Where responders aren't "equal" to those causing the disaster but still face shared dangers. But that might not fit... Perhaps no analogy works perfectly because war's moral horror is sui generis.
answer: |-
  **The boxing analogy fundamentally misrepresents war by smuggling in assumptions of consent, symmetry, and moral indifference that rarely apply, making its conclusions about moral equality unsound.**

  **Correspondence Table & Where It Breaks:**

  | Boxing Element | War Analogy | Breakdown Point |
  |----------------|-------------|----------------|
  | **Referee** | Laws of War / International Law | No neutral enforcer; laws are violated asymmetrically; "referee" (e.g., UN) lacks authority/power. War isn't officiated. |
  | **Rules** | *Jus in bello* (rules of conduct) | Rules are contested, violated, and enforced unevenly. Violations by one side (e.g., aggression) negate symmetry. |
  | **Gloves** | Weapons restrictions (e.g., bans on chemical weapons) | "Gloves" are optional; unjust side often ignores restraints. Compliance isn't mutual. |
  | **Consent** | Enlistment/conscription | Soldiers rarely consent to *specific wars* or being targets. Conscripts face coercion; volunteers serve causes, not "matches". |
  | **Bell** | Declaration of war / ceasefire | Wars start/stop chaotically, without mutual agreement. No clear "beginning/end" ritual. |
  | **Crowd** | Domestic public / international community | "Crowd" isn't neutral; often partisan. Civilians are participants/victims, not spectators. |
  | **Title** | Victory / political aims | Victory doesn't confer moral legitimacy (unlike a boxing title). Wars decide power, not justice. |

  **Addressing Your Specific Tripping Points:**

  1.  **Consent & Voluntariness:** Yes, it smuggles in voluntariness. Boxers consent *to the specific fight and its risks*. Soldiers consent (if at all) to service, not to a particular unjust war. Conscripts consent to nothing. This undermines the "equal footing" premise. If coercion removes moral agency for the conscript, it challenges whether they *can* be morally equivalent to a willing participant.
  2.  **War as Pure Contest:** Absolutely. Boxing’s goal is winning under rules; war’s goal is imposing political will, often *because* one side believes its cause is just. The analogy erases the moral significance of *why* the war is fought (*jus ad bellum*). We *do* care which side "deserves" to win based on justice, not just capability.
  3.  **Fighting for Self vs. Others:** It significantly changes the structure. Boxing is individualistic. Soldiers act as agents for states/causes/civilians. Killing a soldier isn't (morally) just harming *them*, but harming an agent of an unjust aggressor or defender. This links the soldier's action to the moral status of their side's cause.
  4.  **Your Keen Volunteer vs. Reluctant Conscript Case:** This *does* break the analogy and challenges moral equality. The volunteer *chooses* to pursue an unjust cause; the conscript is *forced* to defend against aggression (presuming a just war context). They are both *doing* the same act (fighting), but their *moral positions* differ vastly due to intent, voluntariness, and the justice of the cause they serve. The analogy obscures this by focusing only on the act within the "ring".

  **The Conclusion(s) & The Epistemic Dodge:**

  The analogy is used to support:
  1.  **Same Permission to Fight:** (Both can licitly use force).
  2.  **Equal Liability to be Killed:** (Both are legitimate targets).
  3.  **Non-Blameworthiness:** (Neither is a murderer/criminal).
  4.  **Equal Respect/Honour:** (Both deserve veteran benefits, memorials, etc.).

  **The boxing picture struggles to support *any* of these robustly once the broken mappings are exposed.** It might weakly suggest (1) and (2) *if* symmetry holds, but it doesn't. It offers no basis for (3) or (4).

  **Your mate's epistemic point:** This is a common defence, but it's a *retreat*, not a justification via the analogy. The boxing picture *itself* implies symmetry is real, not just perceived. If the *real* reason is epistemic uncertainty, the analogy is redundant and misleading. Crucially:
  *   It fails for actors *with* knowledge (e.g., leaders, officers with intelligence).
  *   It fails in clear-cut aggression (e.g., Ukraine 2022 – we *don't* grant moral equality to Russian and Ukrainian soldiers).
  *   It doesn't explain why *blameworthiness* should be equal even if *liability* might sometimes be pragmatic. It collapses distinct moral concepts.

  **A Better Picture? Policing (With Caveats):**

  The policing analogy is closer but imperfect:
  *   **Just Side as Police:** Upholding law/order, using necessary force against violators.
  *   **Unjust Side as Criminals:** Violating the peace, liable to proportionate force.
  *   **What it imports better:** Rejects symmetry; acknowledges one side acts justly, the other unjustly; soldiers of the unjust side are more akin to culpable aggressors than contestants; victory ideally restores justice, not just decides a winner.
  *   **Where it breaks:**
      *   **Scale & Reciprocity:** Police operate under state monopoly on force. Wars involve two organised forces reciprocally targeting each other, unlike police vs. criminals.
      *   **Collateral Damage:** Modern war inevitably harms innocents in ways policing (ideally) avoids. "Bombing neighbourhoods" is a key break.
      *   **Legitimacy of Authority:** Who is the "legitimate sheriff"? International law is weaker than domestic law. Determining the "just side" can be contested.
      *   **Conscripts as Criminals?** Casting coerced conscripts on the unjust side as "criminals" feels overly harsh and ignores their lack of agency.

  **Bottom Line on Pictures:** No analogy perfectly fits war's unique horror, scale, and political complexity. The **boxing picture is worse** because it actively obscures war's moral asymmetry and the importance of *jus ad bellum*. The **policing picture is better** for highlighting asymmetry and just cause, but stumbles on reciprocity and scale. **War is ultimately *sui generis* – a catastrophic breakdown requiring its own moral framework, not a borrowed ritual.** The core flaw of the boxing analogy is that it portrays war as a rule-governed contest between moral peers, when it is usually a violent political struggle between agents of causes of radically different moral standing.
