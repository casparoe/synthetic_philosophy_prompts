  ### Scalable Oversight Decision Tree  
  **Start Node:** I accept deployment of systems with unverifiable outputs, needing a trust story.  

  1. **Do we eventually get ground truth for free (without extra effort)?**  
     - Yes → Node 2  
     - No → Node 3  

  2. **Is ground truth available quickly (e.g., within minutes/hours)?**  
     - Yes → Leaf A: **Ground Truth Supervision**  
     - No → Node 4  

  3. **Can the reviewer reliably compare two outputs (e.g., "A vs B, which is better?")?**  
     - Yes → Leaf D: **Comparative Oversight**  
     - No → Node 5  

  4. **Can we collect many samples to train a model?**  
     - Yes → Leaf B: **Delayed Reward Modeling**  
     - No → Leaf C: **Manage Risk & Correct Later**  

  5. **If the model is wrong and a perfect explanation exists, can the reviewer understand it (given unlimited time)?**  
     - Yes → Node 6  
     - No → Node 7  

  6. **What’s the primary bottleneck?**  
     - Model might hide/avoid giving the explanation → Node 8  
     - Explanation exists but is too long/complex to digest → Node 9  

  7. **Can you occasionally pay for expert review?**  
     - Yes → Node 10  
     - No → Node 11  

  8. **Can we collect many samples to train a model?**  
     - Yes → Leaf E: **Recursive Reward Modeling**  
     - No → Node 12  

  9. **Can we collect many samples?**  
     - Yes → Leaf H: **Iterated Amplification**  
     - No → Node 13  

  10. **Can we collect many samples?**  
      - Yes → Leaf K: **Weak-to-Strong Generalization**  
      - No → Leaf G: **No Method, Manage Risk**  

  11. **Can the task be fully specified as a compact machine-checkable rule?**  
      - Yes → Leaf M: **Formal Spec & Verifier**  
      - No → Leaf N: **Scale RLHF & Hope**  

  12. **Can you run multiple models for the same input?**  
      - Yes → Leaf F: **Debate**  
      - No → Leaf G: **No Method, Manage Risk**  

  13. **Can the model break the task into sub-tasks the reviewer can verify?**  
      - Yes → Leaf I: **Decomposition-Based Verification**  
      - No → Leaf J: **Capability Restriction**  

  ---

  ### Leaf Methods  
  | Leaf | Name                          | Most Awkward Commitment                                      | Cheapest Falsification Test                                  |
  |------|-------------------------------|-------------------------------------------------------------|-------------------------------------------------------------|
  | A    | Ground Truth Supervision      | Ground truth is always timely and sufficient for training.  | Deploy in a test env; measure latency/cost of truth collection. |
  | B    | Delayed Reward Modeling       | Delayed signals train a model that generalizes correctly.   | Train a proxy model on delayed data; test on fresh tasks.   |
  | C    | Manage Risk & Correct Later   | Errors caught later have acceptable costs.                  | Simulate failures; quantify recovery costs/impact.          |
  | D    | Comparative Oversight         | Weak reviewers can rank outputs better than generating them.| Compare reviewer rankings vs. ground truth on samples.      |
  | E    | Recursive Reward Modeling     | Models honestly evaluate sub-tasks they could exploit.      | Have models evaluate sub-tasks; check for sandbagging.      |
  | F    | Debate                        | Truth emerges more often when models compete.               | Run debates on known-true/false claims; measure judge accuracy. |
  | G    | No Method, Manage Risk        | Risks are containable without technical solutions.          | Red-team catastrophic failures; assess mitigations.         |
  | H    | Iterated Amplification        | Amplified supervisors stay aligned through iterations.      | Test 2-3 iterations on small tasks; check for drift.        |
  | I    | Decomposition-Based Verification | Models decompose tasks truthfully; reviewers verify steps. | Decompose a task; corrupt a step; see if reviewer catches it. |
  | J    | Capability Restriction        | We can prevent models from attempting unverifiable work.    | Try to provoke unverifiable outputs; measure bypass rate.   |
  | K    | Weak-to-Strong Generalization | Limited expert labels train models stronger than the expert.| Train on few expert labels; test against expert on new data. |
  | M    | Formal Spec & Verifier        | Tasks can be fully specified; verifiers have no loopholes.  | Write a spec for a task; try to find adversarial passes.    |
  | N    | Scale RLHF & Hope             | Models won’t exploit verification gaps as they scale.       | Train RLHF models on progressively harder tasks; test for cheating. |

  ---

  ### Notes  
  - **Unseparated Leaves:**  
    - *Recursive Reward Modeling (E)* vs. *Iterated Amplification (H)*: Both decompose tasks, but the tree splits them by bottleneck (incentive vs. complexity). If the bottleneck is ambiguous, the methods blur.  
    - *Formal Spec (M)* vs. *Capability Restriction (J)*: Both avoid oversight, but *M* requires specifiability; *J* requires task-avoidance.  

  - **Unoccupied Combinations:**  
    - **"Need absolute judgment + No ground truth + Timely expert review"** → *Weak-to-Strong (K)* covers this, but only with many samples. One-shot absolute judgments with experts are unattractive (experts are expensive per query).  
    - **"Model sandbagging + One-shot + Multiple models"** → *Debate (F)* assumes adversarial dynamics, but if models collude, it fails (unexplored).  

  - **Why No Market Mechanisms?**  
    Market-style methods (e.g., prediction markets) fit *Incentive Problems (Node 8)* but require many agents and repeated interactions. The tree routes these cases to *Debate (F)* or *Recursive Reward Modeling (E)*, as markets lack empirical backing for one-shot/absolute judgments.  

  **Tree Logic:** Focuses on concrete bottlenecks (time, comprehension, incentives) and practical constraints (samples, experts, specifiability). Ends with "manage risk" when no method ensures trustworthiness.
