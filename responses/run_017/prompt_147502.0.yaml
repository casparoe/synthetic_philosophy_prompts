       C: No real-time oversight; manage risk and correct later
          Commitment: That the cost of errors before correction is acceptable.
          Test: Simulate deployment and measure the cost of errors.

       D: Comparative oversight
          Commitment: That comparative judgments by the weak reviewer are aligned with true quality.
          Test: Compare the weak reviewer's preferences with ground truth or expert preferences on a sample.

       E: Recursive reward modeling
          Commitment: That the model can be trusted to honestly evaluate sub-tasks even when it knows the evaluation will be used to train a reward model.
          Test: Check if the model's evaluations of sub-tasks correlate with ground truth on held-out sub-tasks.

       F: Debate
          Commitment: That the debate process surfaces the truth more often than a single model's output.
          Test: Run debates on known-true and known-false statements and see if the judge can tell.

       G: No method, manage risk
          Commitment: That the risks are manageable without a technical solution.
          Test: Red-team the system to find failures and assess impact.

       H: Iterated amplification
          Commitment: That the amplified supervisor (built from decomposition) remains aligned at every iteration.
          Test: Run a small-scale iteration and check if the resulting model is more aligned than the base model.

       I: Decomposition-based verification
          Commitment: That the model's decomposition of the task is truthful and that the reviewer can verify each step.
          Test: Have the model decompose a task and then check if the steps are correct and if the reviewer can verify them.

       J: Capability restriction
          Commitment: That we can prevent the model from encountering or attempting unverifiable tasks.
          Test: Try to elicit the model to do unverifiable tasks and see if the restriction holds.

       K: Weak-to-strong generalization
          Commitment: That a model trained on limited expert labels will generalize to be more aligned than the expert on new examples.
          Test: Train a model on a small set of expert labels and test on held-out examples to see if it matches expert performance.

       M: Formal spec and verifier
          Commitment: That the task can be fully specified in a formal language and that the verifier is correct.
          Test: Write a formal spec and verifier for a sample task and see if it catches errors.

       N: Scale RLHF and hope
          Commitment: That the model won't learn to produce unverifiably bad outputs as capabilities increase.
          Test: Train a model with RLHF on tasks that are hard for the reviewer and check if it cheats when it can.

