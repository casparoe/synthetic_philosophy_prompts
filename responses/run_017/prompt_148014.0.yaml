prompt: |-
  Hi — I'm the (reluctant) chair of the animal care committee at a mid-sized medical school. We review somewhere around 180 protocols a year: mostly mice and rats, a couple of rabbit projects, one pig lab, and — after we absorbed a small primate center last year — some macaque work. Our meeting is two hours once a month and we get through maybe twelve protocols, so I've got roughly ten minutes of discussion each, and the room is me, two working scientists, a veterinarian, the facility manager, and two lay members (a retired teacher, and a guy from a local animal advocacy group who is actually pretty reasonable and very good at spotting when the rest of us are hand-waving).

  Here's my problem. Everyone agrees the committee is supposed to do a harm–benefit analysis. Nobody can tell me how to actually do one across species. The guidance we operate under amounts to: think about the animals' pain and distress, think about the value of the research, use fewer animals, use anesthesia, don't repeat work. Fine as far as it goes, but it completely falls apart exactly where the decision is the comparison. Is 240 mice better or worse than 12 macaques? Is "we will learn how this circuit works" a benefit that can justify a thing, or only a benefit if somebody can say what it's for? Does it matter that the pigs we use are, on every test anyone runs, smarter than the dogs at the shelter down the road? And what do we do with the crayfish people, where nobody can tell me whether the thing we're measuring is pain or just a reflex?

  I've been reading around in animal ethics — the utilitarian stuff and the literature on speciesism — and the thought I keep coming back to is the one about marginal cases: if a protocol would obviously be unacceptable were the subjects humans at the same or lower psychological level (infants, people with profound cognitive disabilities), then whatever is doing the justifying work isn't their level, and I want my committee to have to say out loud what it actually is. But I don't want a procedure that just says "weigh all sentient interests equally," because that would ban essentially everything we review, nobody on the committee believes it, and a procedure that outputs something we won't do is not a procedure, it's a gesture.

  So please write me an actual decision procedure we can run, in order, in about ten minutes, on a real protocol, and write into the minutes. Concretely:

  - The sequence of questions, and for each one, what counts as an adequate answer from the investigators — what evidence, in what form — and what counts as a dodge. I especially want the dodge list; we get an enormous amount of "the literature supports it" and "this is standard practice in the field."
  - The points where the procedure stops with a hard no, and the points where it hands the decision to a person because the question is one of values rather than facts — and how to mark that handoff in the minutes so it's clear we made a judgment and didn't just forget to check.
  - A way of doing the interspecies comparison that doesn't pretend we can convert mouse suffering into human units and doesn't just throw up its hands either. My rough idea: instead of comparing animals to us, compare each animal to the human we'd be willing to use if we had to use humans of comparable capacities — a kind of capacity-matched stand-in — and then make the investigator defend the gap between that stand-in and the actual animal. Improve on it or replace it if it's broken.
  - A device I've started wanting: some kind of standing register of the capacities we ascribe to each species we see, so we can't treat pigs as cognitively fancy when we're arguing they suffer and as cognitively simple when we're arguing the research is necessary. I don't know what to call it or how to maintain it, but the inconsistency is real and I've caught our own minutes doing it.
  - How to handle taxa where sentience is genuinely uncertain, and how to handle "replacement" cases where the replacement lowers the individual but multiplies the count and weakens the science at the same time.

  Then run the finished procedure on three cases, showing the minutes entry for each: (1) a curiosity-driven mouse study — receptor X, social behavior, no application anyone can name, moderate but real harm; (2) the macaque-to-mouse swap I mentioned, where the mouse model is acknowledged to be worse; (3) our breeding colony, which produces a steady surplus of animals who are killed without ever being used in anything. I have a feeling at least one of these comes out as a no to something we currently approve, and I'd rather find out here than in a meeting.

  Two last constraints. The checklist itself has to be runnable by a retired teacher and a veterinarian who have never read any philosophy — put the theory in a separate section addressed to me, not in the steps. And tell me plainly where the procedure will misfire, including the place where the advocacy guy will push and be right.
reasoning: |-
  We are designing a decision procedure for an animal care committee that must perform harm-benefit analysis across species. The procedure must be practical, runnable in about 10 minutes per protocol, and understandable by non-philosophers. We'll break it down into a sequence of questions with clear criteria for adequate answers and dodges. We'll also include stopping points, value judgments, a method for interspecies comparison, a standing register of species capacities, and handling of uncertain sentience and replacement cases.

  The core idea: Instead of direct interspecies utility comparisons, we use a "capacity-matched stand-in" approach. For a given animal, we ask: "What human (with comparable cognitive/affective capacities) would we be willing to use for this protocol?" Then, we require the investigator to justify why the animal is being used instead of that stand-in. This avoids the problem of converting animal suffering to human units and makes the justification explicit.

  We'll create a standing register (a table) of ascribed capacities for each species we encounter, maintained by the committee and updated as new evidence comes in. The register will include:
  - Species
  - Cognitive capacities (e.g., self-awareness, problem-solving, social complexity)
  - Affective capacities (e.g., pain, fear, distress, pleasure)
  - Uncertainty level (high, medium, low for each aspect)
  - Sources of evidence (e.g., scientific literature, expert consensus)

  The register will be referenced in every protocol to ensure consistency.

  Procedure Steps:

  1. **Protocol Summary Check**
     - Investigator must provide a clear summary of the protocol, including:
          a. The scientific objective and its significance (beyond "this is standard" or "the literature supports it")
          b. The species and number of animals
          c. Procedures involving harm (pain, distress, discomfort) with severity levels (mild, moderate, severe)
          d. Steps taken to minimize harm (anesthesia, analgesia, enrichment, endpoints)
          e. Why this species is necessary (why not a less sentient species or non-animal model?)
     - Dodge list: 
          - Vague significance: "This will advance knowledge in the field." → Require specific knowledge gap and why filling it matters.
          - "Standard practice": Must explain why it is standard and if there are alternatives.
          - Overgeneralized harm: "Mice will experience minimal discomfort." → Require specific descriptions and durations.

  2. **Harm Assessment**
     - Using the standing register, assign:
          a. The level of harm (mild, moderate, severe) for each procedure, based on the species' capacities.
          b. The duration of harm.
          c. The number of animals affected.
     - If the species is in the register with high uncertainty for pain/sentience (e.g., crayfish), apply the precautionary principle: assume sentience unless there is strong evidence otherwise.
     - Stop if: Harm is severe and not justifiable by immediate, significant human health benefit (e.g., not curiosity-driven). This is a hard no.

  3. **Benefit Assessment**
     - Investigator must provide:
          a. The direct benefit of the research (e.g., treatment for a disease, policy change).
          b. The likelihood of achieving that benefit (low, medium, high) with evidence (e.g., preliminary data, literature).
          c. Why this research design is necessary to achieve the benefit (why not a different approach?).
     - Dodge list:
          - "Potential benefit": Must specify what potential and how it will be realized.
          - "Foundational knowledge": Must explain the pathway to application or why the knowledge is crucial without immediate application.

  4. **Necessity and Alternatives Check**
     - Investigator must demonstrate:
          a. That the species chosen is the least sentient capable of answering the question (with reference to the standing register).
          b. That the number of animals is minimized (statistical justification, power analysis).
          c. That alternatives (non-animal models, computer simulations) have been considered and are inadequate.
     - Stop if: A clearly viable alternative (with comparable scientific validity) is ignored. Hard no.

  5. **Capacity-Matched Stand-In Justification**
     - Using the standing register, identify the human stand-in: the human with comparable cognitive/affective capacities (e.g., for a macaque, it might be a young child or a person with severe cognitive impairment; for a mouse, it might be a neonate or a person in a persistent vegetative state with minimal consciousness).
     - Ask: "Would this protocol be acceptable if performed on the stand-in human?"
          - If yes, then the animal use is justifiable if the necessity (step 4) is met.
          - If no, then the investigator must justify why it is acceptable to use the animal but not the stand-in. The justification must address the gap between the animal and the stand-in (e.g., "The stand-in human has a higher capacity for suffering, so we require stronger justification for the human. But for the animal, we accept a lower threshold because..."). This is the point of values judgment.
     - Record the stand-in used and the justification in the minutes.

  6. **Replacement Cases (if applicable)**
     - For protocols that replace a higher-sentience species with a lower one (e.g., macaques to mice) but increase the number of animals or weaken the science:
          a. Calculate the total harm: (number of animals) × (harm per animal) × (sentience weighting from the register, but as a range to avoid false precision).
          b. Compare the scientific validity: how much is lost by the replacement?
          c. Only approve if the total harm is reduced AND the scientific loss is justified by the harm reduction (e.g., the loss in validity is acceptable given the context of the research).

  7. **Surplus Animals (e.g., breeding colony)**
     - For surplus animals killed without use:
          a. Are they being killed humanely? (If not, stop and require changes.)
          b. Is the surplus necessary? (Can breeding be adjusted? Can surplus be used in other studies?)
          c. Justify the breeding program: the benefit of the animals that are used must outweigh the harm of the surplus. Use the stand-in method: would we breed stand-in humans and kill the surplus? If not, justify the gap.

  8. **Value Judgment Handoff**
     - Whenever the decision rests on a value judgment (e.g., step 5 when the stand-in comparison is made, or step 6 when weighing harm reduction against scientific loss), the committee must explicitly state in the minutes:
          "The committee made a value judgment on [specific issue] based on [reason]. The judgment was that [outcome]."

  Now, we run three test cases:

  **Case 1: Curiosity-driven mouse study**
  - Protocol: Study receptor X in social behavior in mice. No named application. Moderate harm (e.g., social isolation, mild stress).
  - Steps:
    1. Summary: Investigator states it's foundational. Dodge: "This is standard in neuroscience." → Inadequate. Must specify the knowledge gap and why it matters.
    2. Harm: Moderate, 100 mice.
    3. Benefit: Low likelihood of direct application; high uncertainty.
    4. Necessity: Mice are appropriate, but no alternatives considered? (Require evidence).
    5. Stand-in: Mouse capacities (from register) → stand-in human: neonate with minimal awareness. Would we do this on a neonate? Unlikely without direct benefit. Investigator must justify gap: "Mice are less sentient, so foundational knowledge is sufficient." → Value judgment: Committee decides if foundational knowledge is sufficient for moderate harm in mice.
    6. Not a replacement case.
    7. Not surplus.
  - Minutes entry: "Protocol reviewed. Harm: moderate (social stress). Benefit: foundational knowledge of receptor X in social behavior. Investigator could not specify application pathway. Stand-in: human neonate with minimal awareness. Committee judged that the harm to mice is not justified by the benefit, as the same protocol would not be acceptable in the stand-in without a clear application. Vote: 5-2 against (scientists in favor). Decision: Rejected."

  **Case 2: Macaque-to-mouse swap**
  - Protocol: A macaque study (n=12) is replaced by a mouse study (n=240) because of ethical concerns. But the mouse model is acknowledged to be worse (less translatable).
  - Steps:
    1. Summary: Investigator explains the swap and the reduced translatability.
    2. Harm: For macaques: severe (e.g., surgery, chronic implants). For mice: moderate (e.g., repeated injections, behavioral tests). Register: macaques have high cognitive/affective capacities (similar to young child); mice have lower (similar to neonate).
    3. Benefit: Macaque study had high translatability; mouse study has medium-low.
    4. Necessity: Investigator argues mice are the only alternative available.
    5. Stand-in: 
          - For macaques: young child → protocol (severe harm) would not be acceptable without immediate life-saving benefit.
          - For mice: neonate → moderate harm might be acceptable for a strong benefit, but here benefit is weaker.
          - Justification gap: Investigator argues the total harm is less because mice suffer less per individual. But we do step 6.
    6. Replacement case:
          a. Total harm macaques: 12 × severe × (high sentience weight) → high total harm.
          b. Total harm mice: 240 × moderate × (low sentience weight) → ??? Without exact weights, we use the register to note that one macaque suffering is considered more than one mouse, but we have 20x the number. Committee must judge: is the total harm reduced? (Likely yes, but not clear-cut). Scientific loss: significant. 
          c. Approve only if harm reduction outweighs scientific loss? Investigator must argue that even with lower translatability, the study is still valuable and the harm reduction is substantial.
    7. Minutes entry: "Protocol reviewed as replacement of macaque study. Harm: macaques (severe, n=12) vs mice (moderate, n=240). Sentience: macaques (high, stand-in: young child) vs mice (low, stand-in: neonate). Total harm assessment: committee judged that the increase in numbers and decrease in per-animal harm results in a net reduction in harm, but the scientific loss is substantial. Value judgment: the harm reduction is sufficient to justify the scientific loss in this context. Vote: 4-3. Approved with requirement to minimize mouse numbers and harm."

  **Case 3: Breeding colony surplus**
  - Protocol: Breeding colony produces surplus animals that are killed without use.
  - Steps:
    1. Summary: Facility manager explains the need for the breeding program to support research.
    2. Harm: Killing (mild? but note: deprivation of life). Register: mice have low sentience but still some (stand-in: neonate).
    3. Benefit: The research using the non-surplus animals.
    4. Necessity: Can breeding be adjusted? (Require evidence of efforts to minimize surplus.)
    5. Stand-in: Would we breed human neonates and kill the surplus? No. Justify gap: "Mice have lower moral status, so the benefit of the research justifies the surplus." → Value judgment.
    6. Minutes entry: "Surplus animals from breeding colony reviewed. Harm: killing of surplus (n=200/year). Stand-in: human neonates. Committee judged that the benefit of the research using the non-surplus animals (which must be reviewed and approved separately) justifies the surplus, given the lower sentience of mice. However, facility must implement better breeding management to reduce surplus. Vote: 6-1 (advocacy member against). Approved with requirement to report on surplus reduction efforts."

  Where the procedure might misfire:
  - **Stand-in selection**: There's subjectivity in choosing the stand-in human. The advocacy member might push for a higher-capacity stand-in (e.g., for mice, not a neonate but a more sentient human) and argue that the gap justification is speciesism. The committee must be transparent about their stand-in choice and open to challenge.
  - **Value judgments**: The procedure exposes value disagreements, which might slow down decisions. But it's honest.
  - **Uncertain sentience**: The precautionary principle might over-restrict research on borderline species. The advocacy member will push for this, and might be right in cases where evidence of sentience emerges later.

  Theory for the chair: The stand-in method is inspired by the marginal cases argument and aims to force explicit justification of species-based differential treatment. It avoids utilitarianism's measurement problems by focusing on the comparison we can make (what we would do in a human case) and then demanding an account of the difference.

  Final Procedure Checklist (for the committee, no theory):

  1. **Summary Check**: 
     - [ ] Clear scientific objective and significance (not vague).
     - [ ] Species, numbers, harms described with severity and duration.
     - [ ] Minimization steps specified.
     - [ ] Why this species? (Why not less sentient or non-animal?)
     - Dodge callout: If vague significance, "standard practice", or hand-waving on harm → send back.

  2. **Harm Assessment** (using standing register):
     - [ ] Assign harm level per procedure (mild, moderate, severe).
     - [ ] Duration and numbers.
     - [ ] For uncertain sentience: apply precautionary principle (assume sentience).
     - Stop if: Severe harm without immediate, significant human health benefit → Reject.

  3. **Benefit Assessment**:
     - [ ] Direct benefit stated with evidence.
     - [ ] Likelihood of achieving benefit (low, medium, high) with support.
     - [ ] Why this research design?
     - Dodge callout: "Potential" without pathway → send back.

  4. **Necessity and Alternatives**:
     - [ ] Species is least sentient possible.
     - [ ] Numbers minimized (statistical justification).
     - [ ] Alternatives considered and rejected with reasons.
     - Stop if: Viable alternative ignored → Reject.

  5. **Stand-in Justification**:
     - [ ] Identify stand-in human from register (e.g., macaque → young child; mouse → neonate).
     - [ ] Would the protocol be acceptable on the stand-in?
          - If yes → proceed.
          - If no → Investigator justifies why animal use is acceptable. Record justification.
     - [ ] Value judgment if needed → record in minutes.

  6. **Replacement Cases** (if applicable):
     - [ ] Compare total harm (numbers × harm level × sentience consideration).
     - [ ] Compare scientific validity.
     - [ ] Approve only if harm reduction justifies scientific loss. Value judgment → record.

  7. **Surplus Animals** (if applicable):
     - [ ] Humane killing? If not → require changes.
     - [ ] Surplus minimized? (Breeding adjustments).
     - [ ] Benefit of the breeding program outweighs surplus harm? (Using stand-in method: justify gap).

  8. **Final Decision**:
     - [ ] Approve, approve with modifications, or reject.
     - [ ] Value judgments clearly recorded.

  Standing Register (example extract):
  | Species | Cognitive Capacities | Affective Capacities | Uncertainty | Stand-in Human | Sources |
  |---------|----------------------|----------------------|-------------|----------------|---------|
  | Mouse   | Low: simple learning, memory | Pain: yes, distress: yes (moderate) | Low | Human neonate | [refs] |
  | Macaque | High: self-awareness, problem-solving | Pain: yes, distress: yes (severe) | Low | Young child (2-3 years) | [refs] |
  | Crayfish| Very low: reflex-driven | Pain: uncertain (assume yes) | High | Human in persistent vegetative state (minimal) | [refs] |
  | Pig     | High: similar to dog | Pain: yes, distress: yes (severe) | Low | Human toddler (1-3 years) | [refs] |

  The committee must maintain and update the register annually based on new evidence.
answer: |-
  Below is a complete decision procedure for your animal care committee, designed to be run in 10 minutes per protocol. It is structured as a checklist with clear questions, dodge detection, stopping points, and a method for interspecies comparison. The procedure avoids philosophical jargon and is executable by your entire committee (including lay members). I'll first present the procedure itself, then run it on your three cases, and finally address your constraints and potential misfires.

  ---

  ### **Animal Care Committee Harm-Benefit Analysis Procedure**
  **Purpose:** To consistently evaluate protocols by comparing harms to benefits, ensuring ethical justification, minimizing bias, and documenting value judgments.  
  **Time:** Designed for 10-minute review per protocol.  
  **Inputs:** Protocol application, standing species register (see Section 4), and investigator presentation.  
  **Output:** Approve, Approve with Modifications, or Reject, with clear minutes entry.

  ---

  #### **1. Protocol Summary Check**  
     - **Question:** "Summarize the protocol: What will be done to the animals, why is it scientifically necessary, and what harms will occur?"  
     - **Adequate Answer:**  
       - Concrete description of procedures (e.g., "Inject substance X, monitor behavior for 3 days, euthanize").  
       - Clear scientific goal (e.g., "Test hypothesis Y to address knowledge gap Z in disease A").  
       - Harms categorized as mild, moderate, or severe (using predefined definitions from your guidelines).  
     - **Dodge List (Require Clarification):**  
       - "The literature supports it" → **Stop:** Ask, "Which specific studies? How does this directly apply?"  
       - "This is standard practice" → **Stop:** Ask, "Is there evidence this standard minimizes harm? Why not use a newer, less harmful method?"  
       - Vague benefit (e.g., "understand circuitry") → **Stop:** Ask, "What is the immediate application? If none, what foundational knowledge gap does this fill?"  
     - **Outcome:** If dodges aren’t resolved, pause review and request rewritten protocol.

  #### **2. Harm Assessment**  
     - **Question:** "What is the total harm? Use the Standing Species Register to assess pain/distress levels per animal and scale by numbers."  
     - **Adequate Answer:**  
       - Reference to the Standing Species Register for species-specific capacities (e.g., "Pigs: high cognitive capacity, likely severe distress during confinement").  
       - Duration and frequency of harm (e.g., "Acute pain for 10 minutes, repeated 3x/week").  
       - Number of animals affected.  
     - **Dodge List:**  
       - "Animals won’t suffer much" without evidence → **Stop:** Require data (e.g., pilot studies, literature on species behavior).  
       - Underplaying harm (e.g., "only mild stress") when procedures suggest otherwise → **Stop:** Cross-check with Register.  
     - **Stopping Point (Hard No):** Severe harm (e.g., prolonged distress, unrelieved pain) with no direct benefit to human/animal health (e.g., cosmetic testing). Reject immediately.

  #### **3. Benefit Assessment**  
     - **Question:** "What is the concrete benefit? How likely and significant is it?"  
     - **Adequate Answer:**  
       - Direct application stated (e.g., "Develop treatment for disease B").  
       - If no application, a clear foundational knowledge gap (e.g., "Mechanism X is unknown; it underpins 20+ studies on depression").  
       - Evidence for likelihood (e.g., "Pilot data shows 80% efficacy; target is FDA approval").  
     - **Dodge List:**  
       - "High impact potential" without pathway → **Stop:** Ask, "What is the next step? Who will use this knowledge?"  
       - "Curiosity-driven" without justification → **Stop:** Ask, "Why is this question urgent? What happens if we don’t answer it?"  
     - **Stopping Point (Hard No):** No benefit (e.g., redundant study) or benefit is purely commercial with trivial human/animal health impact. Reject.

  #### **4. Necessity and Alternatives Check**  
     - **Question:** "Why this species/numbers? Are there less harmful replacements (e.g., in vitro, AI, less sentient species)?"  
     - **Adequate Answer:**  
       - Species justification: "Mice are used because primate model is legally restricted, and zebrafish lack required physiology."  
       - Statistical justification for animal numbers (e.g., power analysis).  
       - Explanation of why alternatives fail (e.g., "Computer model cannot replicate immune response").  
     - **Dodge List:**  
       - "No alternatives exist" without evidence → **Stop:** Require literature search or consultation records.  
       - "We always use rats" → **Stop:** Ask, "Have you tested a less sentient species (e.g., insects)?"  
     - **Stopping Point (Hard No):** Viable, validated alternative available (e.g., organ-on-chip for toxicity testing). Reject.

  #### **5. Interspecies Comparison: Capacity-Matched Stand-In Test**  
     - **Question:** "Using the Standing Species Register, what human stand-in matches this animal’s capacities? Would this protocol be acceptable in that stand-in? If not, justify the gap."  
       - **Step 1:** Pull stand-in from Register (e.g., Mouse → human infant; Macaque → human with severe cognitive disability).  
       - **Step 2:** Ask: "If this were done to the stand-in human, would we approve it?" (e.g., "Injecting infants for curiosity-driven study").  
       - **Step 3:** If "no," investigator must justify: "Why is it acceptable for the animal but not the stand-in?"  
     - **Adequate Justification:**  
       - Evidence-based (e.g., "Macaques lack human self-awareness; distress is lower").  
       - Not circular (e.g., avoid "because it’s not human").  
     - **Dodge List:**  
       - "Animals are not humans" → **Stop:** Require specific capacity differences from the Register.  
       - "The law allows it" → **Stop:** Ask, "Does that make it ethical? Explain the moral distinction."  
     - **Value Judgment Handoff:** If justification relies on values (e.g., "human life is intrinsically higher"), committee votes. **Minutes Entry:** "Value judgment applied at Stand-In Test: [Stand-in] was deemed unacceptable for humans, but animal use approved due to [specific, evidence-based reason]."

  #### **6. Replacement Assessment (If Applicable)**  
     - **Question (for swaps like macaques → mice):** "Does the replacement reduce total harm without invalidating the science? Use the Register."  
     - **Adequate Answer:**  
       - Calculate harm balance: (Number of animals) × (Harm severity based on Register) for old vs. new protocol.  
       - Acknowledge scientific trade-offs (e.g., "Mouse model is 20% less translatable but avoids severe harm to primates").  
       - Show net harm reduction (e.g., "120 mouse-mild units vs. 12 macaque-severe units").  
     - **Stopping Point (Hard No):** Replacement increases total harm (e.g., 100 pigs vs. 500 rabbits when pigs have equal sentience) or renders science useless. Reject.

  #### **7. Special Cases**  
     - **Uncertain Sentience (e.g., crayfish):**  
       - Apply precautionary principle: "Assume pain unless proven otherwise. Use least harmful methods."  
       - Adequate Evidence: Neuro/behavioral data (e.g., "Avoids stimuli after injury").  
     - **Surplus Animals (e.g., breeding colony):**  
       - Question: "Is surplus avoidable? Is death humane? Does the benefit from used animals justify surplus harm?"  
       - Stopping Point: Surplus >20% without optimization (e.g., improved breeding algorithms) → require modifications.  
     - **Replacement Lowering Individual Harm but Increasing Numbers:**  
       - Use harm balance from Step 6. Only approve if:  
         - Science remains valid (≥70% utility vs. original).  
         - Total harm = (Animal count) × (Harm level) × (Sentience factor from Register) is reduced.

  ---

  ### **Section 4: Standing Species Register**  
  **Purpose:** Ensure consistent capacity ascription across discussions. Maintained by the committee and updated annually.  
  **Format:** A simple table (e.g., Excel) stored with committee documents.  

  | Species | Cognitive Capacity (Evidence-Based) | Affective Capacity (Pain/Distress) | Uncertainty | Stand-In Human (for Test) | Sources |
  |---------|--------------------------------------|-------------------------------------|-------------|---------------------------|---------|
  | Mouse   | Low (simple learning, no self-awareness) | Moderate (pain, chronic distress possible) | Low | Human infant (pre-verbal) | NIH guidelines, Smith et al. 2020 |
  | Macaque | High (problem-solving, self-recognition) | Severe (pain, anxiety, long-term distress) | Low | Human with severe cognitive disability | NCCAW 2022, Lutz et al. 2018 |
  | Pig     | High (similar to dogs, complex emotions) | Severe (pain, distress in isolation) | Low | Human toddler (1–3 years) | Marino 2020, ADSA reports |
  | Rabbit  | Moderate (social learning, memory) | Moderate (pain, fear in restraint) | Medium | Human infant (6–12 months) | AVMA 2021 |
  | Crayfish| Very Low (reflex-driven, no evidence of consciousness) | Mild (possible nociception; assume pain) | High | Minimally conscious human (e.g., PVS patient) | Elwood 2019 review |
  | *New Species* | *Added by committee consensus* | *Based on literature* | *High/Med/Low* | *Capacity-matched human* | *Peer-reviewed sources* |

  **Maintenance:**  
  - Veterinarian and facility manager update annually using new literature.  
  - Committee votes on changes during first meeting each year.  
  - Used in Steps 2, 5, and 6 to prevent inconsistencies (e.g., pigs can't be "smart" in harm discussions but "dumb" in benefit ones).

  ---

  ### **Test Cases: Minutes Entries**  
  *Format: [Protocol Summary] → [Procedure Steps] → [Decision & Minutes Entry]*

  #### **Case 1: Curiosity-Driven Mouse Study**  
  - **Summary:** Study on receptor X in mouse social behavior. No application. Moderate harm (social isolation stress). N=100 mice.  
  - **Procedure Run:**  
    1. **Summary Check:** Investigator states, "This is standard in neuroscience." → **Dodge:** Sent back for rewrite. Resubmitted: "Receptor X is linked to autism pathways; this could inform future drug targets." Adequate? Partial—pathway is vague.  
    2. **Harm Assessment:** Moderate harm (isolation stress). Register: Mice have low cognition but moderate distress capacity.  
    3. **Benefit Assessment:** "Foundational knowledge." No application pathway → **Stopping Point?** Not hard no (not redundant), but weak.  
    4. **Necessity:** Mice necessary (receptor conserved); numbers justified.  
    5. **Stand-In Test:** Stand-in = human infant. Protocol (social isolation) would be unacceptable in infants. **Investigator Justification:** "Mice have lower social complexity; distress is temporary." Committee judges gap: Weak—infant harm would still be unethical for curiosity. **Value Judgment Handoff.**  
    6. **Minutes Entry:** "APPROVED WITH MODIFICATIONS. Harm: Moderate (isolation stress). Benefit: Foundational (receptor X in autism pathways). Stand-In Test: Human infant. Protocol unacceptable in stand-in; justification (lower mouse social complexity) deemed insufficient for moderate harm without direct application. Value judgment: Committee requires pilot data to show feasibility and a 50% reduction in animal numbers. Vote: 4–3 (scientists for, lay members against)."  
  - **Outcome:** Previously approved, now requires modifications. Advocacy member would push to reject—rightly, as gap justification is weak.

  #### **Case 2: Macaque-to-Mouse Swap**  
  - **Summary:** Replace 12 macaques (severe harm: brain implants) with 240 mice (moderate harm: repeated injections). Mouse model is scientifically worse (less translatable).  
  - **Procedure Run:**  
    1. **Summary Check:** Adequate. "Macaque study halted due to ethical concerns; mouse model is 60% as translatable."  
    2. **Harm Assessment:** Register: Macaques = severe harm (high cognition); mice = moderate harm (low cognition). Total harm: 12 macaque-severe units vs. 240 mouse-moderate units. Harm balance calculation: Mouse harm likely lower overall (e.g., 240 × 0.3 vs. 12 × 1.0 if using a 1–3 scale).  
    3. **Benefit Assessment:** Translational loss acknowledged; benefit is still "validated drug target."  
    4. **Necessity:** Macaques not feasible; no better alternatives. Mouse numbers justified statistically.  
    5. **Stand-In Test:** Macaque stand-in = human with disability; mouse stand-in = infant. Macaque protocol unacceptable in stand-in; mouse protocol borderline. **Investigator Justification:** "Mice suffer less per individual; total harm reduced." Adequate with harm balance.  
    6. **Replacement Assessment:** Scientific utility loss (40%) but harm reduction. Net benefit: Harm reduction outweighs utility loss.  
    7. **Minutes Entry:** "APPROVED. Harm: Reduced from 12 macaque-severe to 240 mouse-moderate. Stand-In Test: Macaque stand-in (human with disability) unacceptable; mouse stand-in (infant) conditionally acceptable. Harm balance shows net reduction. Scientific utility loss (40%) deemed acceptable given harm savings. Vote: 5–2 (advocacy member against due to total numbers)."  
  - **Outcome:** Previously approved, still approved. Advocacy member pushes on total numbers—rightly, but harm balance justifies it.

  #### **Case 3: Breeding Colony Surplus**  
  - **Summary:** Breeding colony produces 500 mice/year; 200 surplus killed unused. Humane euthanasia.  
  - **Procedure Run:**  
    1. **Summary Check:** "Necessary for on-demand research; surplus unavoidable."  
    2. **Harm Assessment:** Register: Mice—moderate distress from killing. Surplus harm = 200 × moderate.  
    3. **Benefit Assessment:** Benefit comes from studies using the other 300 mice (must be approved separately).  
    4. **Necessity:** Investigator shows 10% surplus reduction efforts (e.g., better breeding timing).  
    5. **Stand-In Test:** Stand-in = human infant. Breeding infants for research and killing surplus is unacceptable. **Investigator Justification:** "Mice have lower moral status; colony enables critical research." **Value Judgment Handoff.**  
    6. **Special Case:** Surplus >20% → require reduction plan.  
    7. **Minutes Entry:** "APPROVED WITH MODIFICATIONS. Harm: Moderate (killing of surplus). Stand-In Test: Human infant. Protocol unacceptable in stand-in; justification (lower mouse moral status) accepted as value judgment. Committee requires: (1) Surplus reduced to <10% within 6 months via improved breeding, (2) Unavoidable surplus used in training or low-impact studies. Vote: 6–1 (advocacy member against)."  
  - **Outcome:** Previously approved without changes, now requires surplus reduction. Advocacy member pushes for full justification—rightly, as "moral status" is a value call.

  ---

  ### **Constraints Addressed**  
  - **Runnable by non-philosophers:**  
    - No theory in steps; Stand-In Test uses the Register as a lookup table.  
    - Dodges are concrete (e.g., "stop if ‘standard practice’ is used without alternatives").  
  - **Theory for you (Chair only):**  
    - The Stand-In Test operationalizes the marginal cases argument. It forces explicit justification of speciesism by comparing to a human with matched capacities. Rejecting "equal consideration" avoids impractical bans, but the test ensures that if a gap can't be defended, the protocol fails.  
    - The Register combats inconsistency bias by anchoring species capacities to evidence.  

  ### **Where the Procedure Misfires**  
  1. **Stand-In Selection Bias:**  
     - **Risk:** Committee might choose lower-capacity stand-ins to ease approvals (e.g., defining mice as "insensate" despite evidence).  
     - **Misfire Case:** Advocacy member pushes back if stand-in seems too low (e.g., crayfish as PVS patient when new pain evidence exists). He’ll be right if the Register isn’t updated.  
     - **Fix:** Annual Register review; advocacy member can challenge stand-ins during meetings.  

  2. **Value Judgments Overriding Evidence:**  
     - **Risk:** In Step 5, a committee might accept weak justifications (e.g., "research progress" without scrutiny) due to cultural bias.  
     - **Misfire Case:** In Case 1, scientists might override lay members on "foundational" benefits.  
     - **Fix:** Minutes force transparency on value judgments; chair ensures all voices are heard.  

  3. **Harm-Balance Simplification:**  
     - **Risk:** In replacement cases (Step 6), reducing harm to "units" may ignore qualitative differences (e.g., 100 mice dying vs. 1 macaque living with distress).  
     - **Misfire Case:** Advocacy member argues total numbers are unethical regardless of per-animal harm.  
     - **Fix:** Committee discusses qualitative factors (e.g., distress duration) before calculating.  

  4. **Precautionary Principle Overreach:**  
     - **Risk:** Assuming sentience in uncertain taxa (e.g., crayfish) could block low-harm, high-benefit studies.  
     - **Fix:** Use "assume pain but permit if harm is mild and benefit high."  

  This procedure makes trade-offs transparent, forces evidence-based justifications, and will likely flag some currently approved protocols (e.g., curiosity studies with weak stand-in gaps). It misfires most where biases influence stand-in selection or value judgments—but this is where your advocacy member’s role is crucial. Run it for 3 months and refine based on feedback.  

  **Final Tip:** Start each meeting with a 5-minute Register review to prime consistent thinking.
