prompt: |-
  I have been running small informal experiments on myself, and I keep hitting the same pattern. I would like to know whether it has been isolated and named, and if not, how to carve it out.

  The pattern: my reports arrive more specific than my own sensitivity. A shape flashed briefly at the edge of the visual field — I answer with a full description, something like a red triangle tilted left, and I feel no hesitation at all. When I then run the same trials with an explicit option to answer unclear, I am wrong about as often as not, and on the very next trial I answer exactly as before. The same thing happens with material from last week: I produce a definite wording for what someone said to me, feel no uncertainty about it, and afterwards cannot distinguish my version from two alternatives I could equally have produced. Giving myself permission to say that I do not know changes nothing, so the specificity is not an artifact of being forced to answer.

  I came to this while reading work that treats conscious experience as a user interface rather than a window onto underlying processing, and I can see why an interface would hand up one definite value instead of a spread of candidates. But I want the phenomenon itself, not the metaphor. It does not look like ordinary overconfidence: what is off is not my estimate of my accuracy but the determinacy of the content. It does not look like confabulation in the familiar sense, since there is no deficit and nothing I am papering over. And it is not quite the claim that experience away from the centre is less detailed than it seems: detail is a matter of how much, whereas this is a matter of whether what is there has one value at all.

  So: is there an established concept for this, or a literature I should be reading? If the nearest concept fits only partly, say which it is and where the fit breaks. If there is nothing established, coin a term, define it, and give me the boundary cases — in particular, tell me what would distinguish specificity that belongs to the experience from specificity that enters only at the point of report, since I cannot tell from the inside. A label on its own will not settle anything for me.
reasoning: |-
  Okay, let me unpack this user's query. They're describing a fascinating phenomenon where their verbal reports about sensory experiences are more specific than their actual perception. For example, they confidently identify a shape as a "red triangle tilted left" even when the stimulus is ambiguous, and they don't feel uncertain. When given the option to say "unclear," they still provide specific answers just as often, and later can't distinguish their report from alternatives. 

  Hmm, what's striking here is that this isn't just overconfidence—it's about the content feeling determinate when it shouldn't be. The user already ruled out common explanations: not confabulation (no deficit), not just degraded peripheral vision (it's about categorical specificity, not resolution). Their metaphor about consciousness as a "user interface" is apt, but they want the phenomenon itself, not the analogy. 

  First, I need to map this to established concepts. Confidence-accuracy dissociation comes close—where confidence doesn't match performance—but it usually focuses on confidence levels, not the determinacy of the content. Phenomenological overflow theories (like Block's) argue experience is richer than reportable, but here it's the opposite: report is richer than experience. Metacognitive blindness fits partially, but again, it's about awareness of accuracy, not the content's specificity. 

  The user’s point about "detail vs. determinacy" is crucial. It’s not that the experience has low resolution; it’s that the brain assigns a discrete value (e.g., "triangle") despite ambiguity. This screams predictive processing: the brain fills in based on priors. But most literature on perceptual filling (like filling-in at the blind spot) involves actual sensory gaps, whereas here there’s no deficit—just ambiguity. 

  Post-perceptual processing theories (e.g., Lau’s PAS framework) might explain how reports get polished post-hoc, but the user insists the determinacy feels inherent to the experience, not added during reporting. That’s the crux: how to experimentally dissociate experience from report. 

  For boundary cases: 
  - If specificity is part of the experience, forcing "unclear" responses should create dissonance (but it doesn’t). 
  - If it’s added at report, neuroimaging might show late-stage prefrontal activity during reporting. 

  The user’s methodological rigor is impressive—they’ve already controlled for demand characteristics by allowing "unclear" responses. Their frustration with "labels that don’t settle anything" tells me they want testable mechanisms, not just taxonomy. 

  I should coin a term that captures this: "Perceptual determinacy illusion" (PDI). It emphasizes the illusion of specificity without presuming its origin. The definition must hinge on the mismatch between report determinacy and objective ambiguity tolerance. 

  Key next steps for them: 
  - Use confidence ratings to quantify metacognitive mismatch. 
  - Test with degraded stimuli where true determinacy is impossible. 
  - Measure reaction times—if specificity is post-perceptual, reports might take longer. 

  This feels like a novel intersection of metacognition and perception. The user’s DIY approach is brilliant—they’ve almost crafted a testable model. My job is to scaffold that, not just label it.
answer: |-
  Based on your rigorous self-observation and the exclusion of common explanations, you've isolated a phenomenon that **lacks a fully established name in the literature but intersects with several concepts**. I'll synthesize the closest frameworks, identify gaps, propose a term, define boundary cases, and outline empirical tests.

  ### Key Overlaps & Where They Fall Short
  1.  **Perceptual Confidence / Metacognitive Miscalibration:**
      *   **Overlap:** Your confidence (feeling "no hesitation") exceeds accuracy.
      *   **Gap:** Standard metacognition research focuses on *confidence ratings about accuracy*, not the *determinacy of the perceptual content itself*. Your core observation is that the *experience feels specific* ("red triangle tilted left"), not merely that you're confident you're right. The content feels unambiguous, not just likely correct.

  2.  **Filling-in (Perceptual Completion):**
      *   **Overlap:** The brain interpolates missing data (e.g., blind spot, peripheral vision).
      *   **Gap:** Filling-in typically addresses *spatial gaps* or *low resolution* to create a *coherent scene*. Your case involves *assigning a specific categorical identity/value* ("triangle," "red," "tilted left") to an inherently ambiguous stimulus *without* the feeling of interpolation. It feels like direct perception, not completion.

  3.  **Post-Perceptual Decision/Binding:**
      *   **Overlap:** Late-stage processes (e.g., in prefrontal cortex) commit to a discrete interpretation for report.
      *   **Gap:** These models often assume the *experience itself is vague or probabilistic*, and specificity arises only at response commitment. Your introspection strongly suggests the *experience feels determinate* prior to report.

  4.  **Perceptual Presence / Phenomenal Overflow:**
      *   **Overlap:** The feeling that rich detail is present in experience (e.g., Block's arguments).
      *   **Gap:** These debates focus on the *amount* of detail available vs. reportable. Your issue is about the *categorical determinacy* ("*this* specific shape/color/orientation") assigned to ambiguous input, regardless of detail quantity.

  ### Proposed Term & Definition
  **Term: *Perceptual Determinacy Illusion (PDI)***

  **Definition:** *The phenomenological state where conscious perceptual experience presents itself as possessing a specific, unambiguous categorical value (e.g., identity, attribute, orientation) for a stimulus, despite objective ambiguity or noise in the sensory input sufficient to make multiple interpretations equally plausible, and where metacognitive awareness fails to reflect this underlying ambiguity.*

  ### Boundary Cases & Distinguishing Features
  1.  **PDI vs. Simple Low Resolution/Detail:**
      *   **PDI:** Experience feels sharp, specific, and categorical ("*That is definitely a red triangle tilted left*"), even if objectively wrong. The *categorical assignment* is illusorily determinate.
      *   **Low Detail:** Experience feels fuzzy, indistinct, or lacking information ("*Something reddish and pointy, maybe angled?*"). Uncertainty is felt.

  2.  **PDI vs. Confabulation:**
      *   **PDI:** Arises from normal processing of ambiguous input. No neurological deficit or memory failure is implied. The "illusion" is the *determinacy itself*, not necessarily the specific content.
      *   **Confabulation:** Typically involves generating *specific false narratives or details* to compensate for *deficits* (e.g., amnesia, anosognosia). The falsehood is the core issue.

  3.  **PDI vs. Overconfidence:**
      *   **PDI:** The *content of the experience* feels unambiguous and specific. Overconfidence is a *metacognitive judgment* *about* that content's accuracy. PDI can exist *without* overconfidence if one reports the specific experience but doubts its accuracy (though in your case, they co-occur).
      *   **Overconfidence:** High confidence in an incorrect judgment, regardless of whether the underlying experience felt determinate or vague.

  **Distinguishing Experience from Report (The Core Challenge):**

  You cannot introspectively distinguish where determinacy arises. Here's how experiment could tease it apart:

  1.  **Delayed Report + Interference:** Present stimulus, then impose a demanding cognitive task (e.g., math) for several seconds *before* allowing the report. If the determinacy is part of the initial experience, it should survive the delay. If it's a post-perceptual reconstruction for report, interference might increase vagueness or errors without changing metacognitive confidence.
  2.  **Confidence Ratings on Specificity vs. Accuracy:** Ask separate questions:
      *   *How specific was your visual experience?* (e.g., "I saw a definite red triangle tilted left" vs. "I saw something ambiguous")
      *   *How confident are you that your description is accurate?*
      PDI predicts high reported specificity even when accuracy confidence should be low (if the subject is calibrated).
  3.  **Neural Correlates:** fMRI/EEG could look for dissociations:
      *   Early sensory areas might show patterns consistent with ambiguity (e.g., mixed representations).
      *   Later areas (e.g., ventral stream for objects/features, prefrontal for decision) might show patterns consistent with a single, specific interpretation *before* the report stage.
      *   Activity patterns locked to the *experience* (using techniques like binocular rivalry as a proxy) vs. locked to the *report*.
  4.  **Priming/Adaptation:** If the illusory specific value is truly part of the perceptual representation, it should cause priming or adaptation effects consistent with that specific value, even if objectively wrong. E.g., misperceiving an ambiguous shape as a triangle might still prime the word "triangle" or adapt a subsequent real triangle.

  ### Why Your Observation Matters
  You've pinpointed a potential flaw in the naive "transparency" of perception. The brain may present a *single, definite interpretation* as the raw experiential data, hiding the underlying computational uncertainty. This aligns with predictive processing (the brain is generating *the best single guess*), but your observation emphasizes the *phenomenological consequence*: the *feeling* of direct access to a determinate fact, even when the input doesn't support it.

  **Your next steps:** Design experiments using methods like delayed report + interference or separate specificity/accuracy ratings. Look into literature on **perceptual decision-making under uncertainty** (e.g., work by Michael Shadlen, Daniel Wolpert, Wei Ji Ma), **metacognition of perception** (e.g., Hakwan Lau, Stephen Fleming), and **phenomenology of perception** (e.g., Andy Clark's predictive processing applied to experience). PDI sits at the intersection of these fields. Your self-experiments provide a strong foundation for formalizing this phenomenon.
