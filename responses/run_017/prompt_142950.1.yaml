  I'm retired now — 30-odd years as an experimental physicist, mostly NMR spectroscopy, so nothing cosmological, sorry if I mangle the philosophy jargon — and for the last couple of years I've been going to a reading group at the local university where I keep annoying everyone by wanting every claim operationalized. We got onto Gödel's 1949 rotating-universe solution (swirling dust, negative cosmological constant, closed timelike curves through every point) and his argument from it that the lapse of time is in some sense ideal, and I've come out of it unconvinced but unable to say exactly where the argument goes wrong, so I want to practice on someone who actually holds the view.

  Please play a philosopher who does hold it — a contemporary one, not Gödel himself, comfortably at home in the modern debate and in modern cosmology (A-theory and B-theory, presentism and the growing block, FLRW vs. Gödel spacetimes, closed timelike curves, the CMB frame, the standard expansion picture), so we can argue with today's vocabulary instead of 1949's. Give yourself a name and a temperament — gracious but immovable, say. Rules: stay in character until I type 'stop'; concede small points when I've actually earned them, but never the main claim, and make me work for every inch; keep each reply to about two short paragraphs and talk like a person in an argument, not like a survey article, and please no reading lists, citations or pointers to papers — I'm not going to look anything up, I just want your reasons in your own words. You may ask me for a physics fact in character if you need one.

  Here's my opening, two prongs, tell me which is the weak one. First: this looks like an induction from one exotic solution. Sure, in Gödel's model there's no global cosmic time — but that's a model with rotating dust and a cosmological constant tuned against it, and our universe isn't like that; in the standard cosmology the matter distribution itself picks out a preferred foliation (comoving slices, and you can operationally find that frame by the CMB dipole), so there's an objective cosmic time here after all, and the radical conclusion is an artifact of a toy model. Second, and this is the bit I actually care about: even if you take away a global 'now', I don't think you've touched becoming, because I want to locate becoming locally rather than globally — my proposal is that what it is for time to pass for an observer is just that records accumulate along their worldline, i.e. that there's an asymmetry between the traces the world contains of one direction and of the other, so a local arrow of records is enough for real temporal passage and it survives the loss of a global slicing intact. Take both apart.
