  If we keep step (4), we'd have to accept that all statistical reasoning is circular - which contradicts established practice in evidence-based fields. Abandoning step (3) instead preserves the integrity of reference classes while acknowledging that class selection involves judgment. What survives is a more nuanced outside view: not that distributional forecasts replace singular reasoning, but that they constrain and complement it, serving as error-checking procedures against cognitive biases.

