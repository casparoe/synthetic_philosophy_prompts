  ### Decision Tree for Lottery and Preface Paradoxes

  **Instructions:** Answer each question based on concrete judgments about the cases. Proceed down the tree until you reach a leaf (a named or unnamed position). Cases referenced:  
  - **Lottery**: 1 million tickets, one winner, fair. Low stakes unless specified.  
  - **High-stakes lottery**: Wrong belief about a ticket losing results in death.  
  - **Lab**: 1,000 independent measurement reports; each has individual evidence and 0.1% failure rate.  
  - **Preface**: Author believes each claim in her book but also believes at least one is false.  

  ---

  #### Branch Questions:
  1. **In the lottery, is it rational to believe a specific ticket (e.g., #1) will lose?**  
     - **Yes** → Go to Q2.  
     - **No** → Go to Q6.  

  2. **In the high-stakes lottery, is it rational to believe a specific ticket will lose?**  
     - **Yes** → Go to Q3.  
     - **No** → Go to Q3.  

  3. **In the lab, is it rational to believe a specific measurement report?**  
     - **Yes** → Go to Q4.  
     - **No** → Go to Q5.  

  4. **If rational to believe each lottery ticket loses, is it rational to believe all lose?**  
     - **Yes** → Go to Q5.  
     - **No** → Go to Q7.  

  5. **If rational to believe each lab report, is it rational to believe all 1,000 are correct?**  
     - **Yes** → Leaf 7 or 8.  
     - **No** → Leaf 6.  

  6. **In the lab, is it rational to believe a specific measurement report?**  
     - **Yes** → Go to Q7.  
     - **No** → Go to Q8.  

  7. **Is it rational for the preface author to believe each individual claim?**  
     - **Yes** → Leaf 2, 3, or 9.  
     - **No** → Leaf 1.  

  8. **In the lottery, if not rational to believe a ticket loses, is it rational to act as if it loses (e.g., discard it)?**  
     - **Yes** → Leaf 4.  
     - **No** → Leaf 5.  

  ---

  #### Leaves (Views):
  1. **Infallibilism**  
     - **Most awkward commitment**: Denies rational belief in *any* fallible claim (e.g., lab reports, preface claims), making empirical knowledge nearly impossible.  
     - *Path*: Q1=No → Q6=No → Q7=No.  

  2. **Fixed Threshold + Closure Denial** (e.g., Richard Foley)  
     - **Most awkward commitment**: Allows rational belief in individual lottery/lab claims but denies closure, making inconsistent belief sets rational.  
     - *Path*: Q1=Yes → Q2=Yes → Q3=Yes → Q4=No → Q5=No → Q7=Yes.  

  3. **Contextual Threshold + Closure Denial** (e.g., Stewart Cohen)  
     - **Most awkward commitment**: Threshold for belief shifts with stakes (e.g., high-stakes lottery denies belief), leading to "elusive" rational beliefs.  
     - *Path*: Q1=Yes → Q2=No → Q3=Yes → Q4=No → Q5=No → Q7=Yes.  

  4. **Acceptance-Only** (e.g., L. Jonathan Cohen)  
     - **Most awkward commitment**: Belief is never rational in lottery-like cases; only "acceptance" for practical action is defensible.  
     - *Path*: Q1=No → Q6=Yes → Q7=Yes → Q8=Yes.  

  5. **Unnamed (Radical Skepticism)**  
     - **Most awkward commitment**: Denies rational belief *and* rational action in lottery/lab cases, paralyzing decision-making.  
     - *Path*: Q1=No → Q6=Yes → Q7=Yes → Q8=No.  

  6. **Lottery-Specific Closure Denial** (e.g., Timothy Williamson)  
     - **Most awkward commitment**: Lottery tickets are exceptional—rational to believe each loses but not all lose—due to strong negative correlation.  
     - *Path*: Q1=Yes → Q2=Yes/No → Q3=No → Q5=No → Q7=Yes.  

  7. **Full Closure + Low Threshold**  
     - **Most awkward commitment**: Rational to believe all lottery tickets lose (a known falsehood) or all lab reports are correct (despite 63% failure risk).  
     - *Path*: Q1=Yes → Q2=Yes/No → Q3=Yes → Q4=Yes → Q5=Yes.  

  8. **Unnamed (Inconsistentist)**  
     - **Most awkward commitment**: Denies multi-premise closure everywhere, allowing blatantly inconsistent beliefs (e.g., "all lab reports are correct" is irrational, but no issue with holding conflicting beliefs).  
     - *Path*: Q1=Yes → Q2=Yes/No → Q3=Yes → Q4=No → Q5=Yes.  

  9. **Preface-as-Norm** (e.g., David Christensen)  
     - **Most awkward commitment**: Rational to believe all preface claims *and* that one is false, treating inconsistency as unavoidable for limited agents.  
     - *Path*: Q1=No → Q6=Yes → Q7=Yes → Q8=N/A.  

  ---

  #### Unoccupied Combinations & Why:
  - **Q1=No → Q6=No → Q7=Yes**: Denies belief in lottery/lab claims but affirms preface claims. Incoherent—preface claims are similarly fallible.  
  - **Q1=Yes → Q3=Yes → Q4=Yes → Q5=No**: Affirms lottery closure but denies lab closure. Unexplored; no clear motivation for asymmetry.  
  - **Q1=No → Q6=No → Q8=Yes**: Denies belief in lottery/lab claims but endorses action. Unattractive—action without belief is practically incoherent.  

  #### Indistinguishable Leaves:
  - **Leaf 2 (Fixed Threshold) and Leaf 3 (Contextual Threshold)** cannot be separated when lab stakes are unspecified. Both answer identically for low-stakes lab.  
  - **Leaf 7 (Full Closure) and Leaf 8 (Inconsistentist)** overlap if lab closure is denied arbitrarily; tree relies on lab conjunction answer to split them.  

  #### What the Tree Shows:
  The lottery and preface are not the same problem—the lottery’s negative correlation (only one winner) splits views (see Leaf 6) while the preface’s independent errors highlight rational inconsistency (see Leaf 9).  

