prompt: |-
  I sit in on a graduate reading group that has spent the term on Scanlon's contractualism: the view, roughly, that an act is wrong when it would be disallowed by any set of principles for the general regulation of behaviour that no one could reasonably reject, and that whether a principle is rejectable is settled by comparing the complaints it would give particular individuals rather than by totalling benefits and burdens across people. At the last session, two of the regulars argued past one another for the better part of an hour. I have to write up the session notes and would rather adjudicate the argument properly than summarize it, so I am setting it out as faithfully as I can.

  They started from the standard worry: because the test looks at complaints one person at a time, it seems unable to add up many small burdens. It therefore appears to tell us to inflict an hour of severe nausea on each of two million people rather than break one stranger's arm, and, by the same structural feature, it cannot see why five lives saved is better than one.

  1. Marta said insensitivity to numbers is the point of the view rather than a defect. Justification here is person-relative: what we owe someone is a justification addressed to her, and telling her she must bear a broken arm because two million others would otherwise suffer less is no answer to her at all. The transplant case is the payoff — we do not kill one to save five — and any view that reaches the nausea verdict by summing will somewhere sacrifice an individual to the aggregate. She added that Ellis's confidence about the nausea case is itself suspicious: the individual burden is tiny, the victim is unidentified, and the intuition has exactly the shape of the utilitarian verdict he is supposed to be arguing for rather than assuming.

  2. Ellis replied that Marta is conflating two things the contractualist needs to separate: refusing to sum burdens across persons, and refusing to count how many persons a principle burdens. The first may be defensible; the second is not, and the rejectability test as stated can only do the second, since the strength of a complaint is a function of what happens to the person who has it, so adding further complainants cannot strengthen anyone's complaint. That is also why the view cannot say that five deaths are worse than one. Marta wants the transplant verdict, but she is deriving it from the same source that produces the nausea verdict, and she has offered no principled way to keep the first and discard the second. If she wants the transplant result, she should get it from a tie-breaking rule or from the distinctive wrong of killing.

  3. Marta conceded that the nausea verdict has some pull, and said contractualism has two internal resources. First, numbers enter through risk: where a principle distributes a burden by lottery, each person's complaint is only as strong as her probability-weighted prospect, and enlarging the pool dilutes each complaint, so the view can register how many people are affected without summing anything. Second, burdens that recur within a single life accumulate inside that person's own complaint. On this reading contractualism is numbers-blind only where burdens are certain and borne by distinct people, which is precisely where, she says, numbers should not count.

  4. Ellis said the risk move forces a choice of standpoint and that neither horn is comfortable. Consider a maintenance crew of a thousand keeping a hazardous generator running. Policy S gives each worker a one-in-a-hundred chance of a disabling hand injury, so about ten injuries are expected. Policy C names ten workers who will certainly be injured and spares the rest. Set aside any preference for certainty as such: the expected number of injuries is the same and everyone, ex ante, prefers S. Assess complaints ex post and the two policies are indistinguishable, since the injured have complaints of identical strength under both — so contractualism cannot explain why we must spread the risk, which looks like a plain duty. Assess them ex ante and contractualism has quietly taken on expected-value reasoning over a population, which is the aggregative apparatus it was meant to replace; at that point it is ex ante prioritarianism with a story about justification bolted on. So counting-through-risk is either idle or a surrender.

  5. Marta gave two replies. First, the ex ante standpoint is not a concession but the natural home of the view: what gets assessed is a principle, and a principle is the sort of thing one accepts or rejects before knowing where the losses land. Second, the duty to spread need not come from expected numbers at all. Each worker can reasonably reject a principle that assigns certainty to a named few while others bear nothing, because it singles her out; that is a complaint about how she is being treated relative to others, not an aggregate of anyone's injuries. She called this the singling-out complaint, and said it is individual in form, so contractualism gets the duty to randomize for free.

  6. Ellis answered that the singling-out complaint is numbers in disguise: its entire force depends on how many others are spared. If the crew were ten and all ten had to be injured, there would be nothing to single out and no complaint; if it were ten with one to be injured, the complaint has the same shape. What Marta calls singling out is just the minimization of total harm described from the position of the loser. Worse, the ex ante move has a further cost, which he called the after-the-draw objection: once the lottery is drawn and the ten injured are known, Marta's view seems committed to saying that the policy is still not reasonably rejectable, so that we may go ahead against people whose injuries we now know to be certain — and that is exactly the kind of sacrifice contractualism was built to forbid.

  7. Marta said the after-the-draw objection confuses which principle we may act on with what we owe those who end up badly off under it. Compensation, aid and accommodation are governed by further principles, and keeping the two apart is a virtue: it lets us act on principles everyone can accept while still having something to say to the injured. She then suggested the whole dispute may be misdescribed. Perhaps the rejectability test was never meant as a decision procedure for cases of this shape at all, but as a model of the relation of mutual recognition among persons; if so, insensitivity to numbers is the correct output rather than a defect, and Ellis's objection presupposes the decision-procedure reading.

  8. Ellis granted that the aggregation objection by itself does not refute contractualism, but said that is the wrong thing to grant. If the test is a model of mutual recognition rather than a criterion of wrongness, then it cannot deliver verdicts on institutional cases like the crew's at all, and Marta should say so plainly instead of reaching for the decision-procedure reading when the nausea case is on the table and the recognition reading when the exposure case is.

  Please adjudicate move by move: rate each of the eight moves on a scale from clearly mistaken to clearly right, with a sentence or two justifying each rating, judging the arguments as actually made rather than as they could have been made. Then say who is more right overall and on which point, and finally say what both parties are missing — in particular whether the duty to spread risk in the exposure case is as clear as Ellis assumes, what it would really cost contractualism to take numbers into account where burdens are certain, and whether the ex ante / ex post distinction is doing the work both of them take it to do. No citations or reading suggestions, please.
reasoning: |-
  Hmm, the user is asking me to adjudicate a philosophical debate about Scanlon's contractualism. They're part of a graduate reading group and need to write session notes, but want to properly evaluate an argument between two participants - Marta and Ellis - about whether contractualism can handle cases involving multiple small burdens versus single large ones.

  The core issue is contractualism's apparent inability to aggregate smaller harms across multiple people. The debate has eight moves, covering cases like choosing between breaking one arm vs causing nausea to millions, and a risk distribution case with workers exposed to hand injuries. Marta defends contractualism's number-insensitivity as principled, while Ellis sees it as a flaw.

  Let me break this down move by move. For Marta's first point, she argues that justification must be person-relative - you can't tell someone to suffer a broken arm just because it would spare many others minor nausea. This seems strong as a core contractualist commitment. Ellis counters that Marta conflates not summing burdens with not counting affected persons, which is insightful - these are distinct issues. Marta then offers two solutions: risk-based dilution and intra-personal accumulation of burdens. The risk point is clever but Ellis effectively challenges it with the worker exposure case, showing problems with both ex post and ex ante evaluations.

  The debate gets particularly interesting when Marta introduces "singling-out" as a non-aggregative complaint. Ellis is sharp to point out this still secretly relies on numbers - the complaint vanishes if everyone is equally burdened. His "after-the-draw" objection is powerful too - once losers are known, contractualism seems to permit their sacrifice. Marta's final move about mutual recognition versus decision procedure feels like repositioning rather than solving the core problem.

  Overall, Ellis seems more consistent in highlighting contractualism's structural limitations, while Marta keeps adjusting the framework to avoid unwanted conclusions. Neither fully addresses whether the duty to spread risk is truly foundational or just aggregation in disguise. The ex ante/ex post distinction also seems messier than they acknowledge - real-world principles often blend both temporal perspectives.

  For my adjudication, I'll rate each move on a spectrum from clearly mistaken to clearly right, then assess who wins overall and what both are missing about risk distribution and the temporal aspects of contractualist reasoning.
answer: |-
  Here is a move-by-move adjudication of the argument:

  1.  **Marta (Move 1): Clearly Right.** She accurately articulates the core contractualist commitment to person-relative justification and its anti-aggregative rationale. Her point that intuitions favoring aggregation in the nausea case may beg the question against contractualism is valid and strategically important. She correctly identifies the Transplant Case as contractualism's intended payoff.
  2.  **Ellis (Move 2): Clearly Right.** He makes a crucial distinction between *summing burdens* (which contractualism rejects) and *counting affected persons* (which it seemingly cannot do). He correctly diagnoses the structural flaw: adding complainants doesn't strengthen any *individual* complaint, explaining the nausea verdict *and* the inability to prioritize saving five over one. His challenge that Marta must consistently accept both the nausea verdict and the transplant verdict (or find a different basis for the latter) is forceful.
  3.  **Marta (Move 3): Partly Right / Partly Problematic.** Her suggestion about *intra-personal accumulation* of burdens is plausible and addresses cases like recurring small harms. However, her *risk-based dilution* move introduces significant complications Ellis will exploit. While it's a genuine internal resource, its application is less straightforward than she implies, especially regarding standpoint.
  4.  **Ellis (Move 4): Clearly Right.** He effectively exposes the dilemma inherent in using the risk move to handle numbers. The *ex post* assessment renders spreading risk inexplicable, while the *ex ante* assessment smuggles in the very aggregative logic (expected value reasoning across persons) that contractualism aims to avoid. His framing of the duty to spread risk as a "plain duty" sets up the challenge.
  5.  **Marta (Move 5): Partly Right / Partly Mistaken.** She is **clearly right** that the *ex ante* standpoint is the natural one for assessing principles and that a "singling out" complaint *can* be individual in form (objecting to being treated worse than others without justification). However, she is **mistaken** in claiming this *fully* explains the duty to randomize "for free." The force of the singling out complaint *does* seem to depend on how many others are spared, as Ellis will argue, making it less purely individual than she claims.
  6.  **Ellis (Move 6): Clearly Right.** He correctly identifies that the perceived wrong of "singling out" in Policy C *depends* on the number of people spared relative to those burdened. If all ten must be injured, singling out vanishes. This shows the complaint isn't *purely* about individual treatment but implicitly comparative in a way sensitive to numbers. His "after-the-draw" objection is devastating: if the principle wasn't reasonably rejectable *ex ante*, contractualism seems committed to overriding the known, certain complaint of the losers *ex post*, violating its core prohibition on sacrifice.
  7.  **Marta (Move 7): Partly Right / Partly Evasive.** She is **right** that contractualism distinguishes the justification of the *principle* from duties of *rectification* (compensation, aid) owed to those harmed under it. This separation *is* a feature. However, her suggestion to shift the interpretation of contractualism ("model of mutual recognition") feels **evasive** in the context of a debate specifically about its ability to deliver verdicts on cases like nausea and the crew. It doesn't solve the structural problem Ellis identifies for the decision-procedure reading she initially used.
  8.  **Ellis (Move 8): Clearly Right.** His concession is apt, but his key point is correct: contractualism cannot have it both ways. If it's purely a model of recognition, it doesn't directly deliver verdicts on institutional cases like the crew policy, undermining its use in the debate. If it's a criterion for wrongness (as needed to discuss the nausea/arm case), it must grapple with the aggregation/numbers problem Ellis has laid bare.

  **Overall Assessment:** **Ellis is more right overall.** He consistently identifies fundamental structural limitations in Scanlon's formulation of contractualism regarding the aggregation of complaints across persons and the handling of numbers. His distinction between summing burdens and counting persons (Move 2), the dilemma of the risk move (Move 4), the dependence of the "singling out" complaint on numbers (Move 6), and the "after-the-draw" objection (Move 6) are powerful critiques Marta doesn't fully overcome. While Marta effectively articulates contractualism's core motivations (Move 1, Move 5's *ex ante* point) and identifies some resources (Move 3), her solutions either face serious problems (risk dilution) or seem like shifts in the view's purpose (Move 7) when pressed.

  **What Both Parties Are Missing:**

  1.  **The Duty to Spread Risk:** Ellis assumes it is "plain," but its foundation is less clear-cut. Is it purely about fairness (avoiding arbitrary disadvantage), minimizing ex ante expected harm (aggregative), or something else? Contractualism struggles to ground it without either the "singling out" complaint (which Ellis showed is number-sensitive) or ex ante aggregation (which it rejects). Its intuitive pull *might* stem partly from aggregative intuitions Ellis himself relies on.
  2.  **Cost of Counting Certain Burdens:** Taking numbers into account for *certain* burdens borne by distinct individuals would require contractualism to allow that the *mere fact* that many people have a complaint, even if each is weak, can make a principle rejectable. This directly contradicts its core tenet that justification is owed *to each individual* based only on *their* complaint. It would fundamentally alter the view, collapsing the distinction between "summing" and "counting" that Ellis made, and making it much harder to resist sacrificing individuals for aggregates in *other* cases (like Transplant).
  3.  **The Ex Ante / Ex Post Distinction:** Both lean heavily on this distinction, but it may be blurrier than they assume. A principle assessed *ex ante* governs actions *ex post*. The "after-the-draw" objection highlights this: a principle acceptable *ex ante* can lead to actions causing severe, certain harm *ex post* that seem unreasonably imposed *on the specific person now bearing it*. Conversely, an *ex post* assessment ignores the fairness and expectations established *ex ante*. Neither standpoint perfectly captures the moral reality of a principle governing actions over time and under uncertainty. Contractualism's focus on principles struggles to seamlessly bridge this gap.
