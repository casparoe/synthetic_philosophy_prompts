prompt: |-
  I write literary fiction, and in three weeks I am giving a ninety-minute masterclass at a writers' centre to a room of working novelists. They are intelligent adults with no formal logic and no probability theory, and almost all of them currently think of disagreement between characters as a function of temperament, or of who happens to have more facts, or of how much the author needs the scene to last. My aim for the session is that they leave able to open a draft of their own, find a scene in which two competent characters fail to persuade one another, and say exactly why that failure is earned rather than manufactured — and, when it is manufactured, what would have to be true of the characters for it to be earned.

  The idea I want to build the session around is Aumann's agreement theorem: roughly, that agents who start from a common prior and whose current posteriors are common knowledge between them cannot persist in disagreeing. I am drawn to it because it is a theorem about the structure of a conversation rather than about the content of one, which is exactly what a novelist has control over. But it is also fragile to teach: stated too early it sounds either obvious or false, and my writers will reach for it as a rule about how people behave when it is really a constraint on what a scene can coherently contain.

  What I want from you is the plan for the explanation, not the explanation. Give me: the order in which the components must arrive and what depends on what — the shared prior, the posterior, the difference between both parties knowing something and its being common knowledge between them, the way each round in which a character declines to move is itself a piece of evidence the other must absorb, and the fact that the result is about beliefs and not about preferences, so that characters who agree completely about the facts can still argue forever about what to do. Tell me where in the sequence each of these belongs and why moving it earlier or later would break something.

  Then give me the one example that has to carry the whole thing. I would rather it be a scene between two people than an urn of balls, since my writers will only half-attend to anything abstract — but tell me what such a scene must contain and, more importantly, what it must lack: no hidden evidence, no factual asymmetry, no stubbornness or self-deception or bad faith in either character, at least until we are ready to let those in deliberately.

  Give me also the misconceptions, in the order they will actually form in the room, and the exact point at which each should be headed off. The ones I anticipate are: that the theorem recommends splitting the difference or meeting in the middle; that it assumes the characters have the same evidence rather than the same prior; that convergence should happen within a single exchange when in fact it takes iterated rounds; and that it says something about how real people behave. Name any I have missed.

  Two further constraints. First, I want the session to end with what I call the leak test: for any disagreement the writers want to keep, they should be able to point to the specific condition that fails — a prior not shared, a posterior not common knowledge, an inference too costly for a character to perform, a value difference masquerading as a factual one — and if they cannot name the leak, the scene is contrived. Tell me at what point in the sequence the leak test can be introduced without turning the theorem into a checklist of excuses, and what check for understanding I should use at the end to tell whether they have the structure rather than the slogan. Second, tell me what to refuse to explain at this level and say openly that I am refusing it.

  Commit to one plan: one order, one carrying example, one placement for each misconception. Where you think my framing is wrong — including my insistence on the leak test — say so in a single sentence each time and then give me the plan as you would have it, with your reasons.
reasoning: |-
  Hmm, the user is a literary fiction writer preparing a masterclass for working novelists. They want to teach Aumann's agreement theorem as a tool for creating authentic character disagreements in fiction. The challenge is explaining this mathematical concept to writers without formal logic training, while avoiding common misconceptions.

  The core need is structural: what sequence of concepts will make the theorem click without overwhelming them? The writers currently view disagreements through temperament or plot necessity lenses. The theorem offers a structural alternative - disagreements must stem from coherent epistemic conditions.

  Key teaching challenges:
  - Avoiding premature abstraction (urns/balls)
  - Preventing misinterpretation as behavioral prescription
  - Distinguishing belief convergence from compromise
  - Separating factual vs value disagreements

  For the sequence, I'd start concrete: create a scenario where two rational characters with identical information still disagree. This creates productive confusion. Then layer concepts: 
  1. Shared prior (established background knowledge)
  2. Private evidence (what each observes)
  3. Posteriors (their updated beliefs)
  4. Common knowledge failure (why they don't realize their evidence must be different)

  The carrying example must be barebones: perhaps two chefs tasting identical soup but disagreeing on saltiness. No hidden variables, no biases - just pure inference failure. Their repeated failure to converge after sharing observations demonstrates the common knowledge gap.

  Critical misconceptions to preempt:
  - "This means characters should compromise" (no, it's about belief updating)
  - "They must have same evidence" (actually same prior, different observations)
  - "Convergence should be instant" (requires iterative belief updating)
  - "This is how people actually behave" (it's a logical constraint for coherent fiction)

  The leak test comes last: after establishing the theorem's conditions, show how violating any creates plausible disagreement. But position it as a diagnostic tool, not a writing rule. Final check: have writers analyze their own scenes using the conditions.

  Refusals: 
  - No Bayesian calculations 
  - No game theory notation
  - No real-world validity debates

  This approach makes the theorem a lens for examining narrative coherence rather than a writing formula.
answer: |-
  Here is a committed plan for your masterclass, structured to build conceptual understanding while preempting misconceptions. It prioritizes **narrative intuition over formalism** and uses a single, tightly controlled example to carry the logic.

  ---

  ### **Sequence of Components & Why This Order**
  1. **Start with the Problem**: Present a bare-bones scene where two competent characters fail to persuade each other despite seeming "reasonable."  
     *Why first?* Writers recognize this as a familiar frustration. It creates tension: *"Why isn't this working?"*  

  2. **Introduce the Posterior Beliefs**: Define "posterior" simply as *"what each character currently believes about X after seeing the evidence."*  
     *Why now?* It’s concrete ("Claire believes the deal is risky; Leo believes it’s safe"). Avoid priors or common knowledge until the problem is visceral.  

  3. **Reveal Identical Evidence**: Show that both characters saw **the exact same facts/events** (no hidden information, no asymmetry).  
     *Why here?* Forces writers to discard "more facts" as the cause. Creates cognitive dissonance: *"Same facts, different conclusions? How?"*  

  4. **Define Shared Prior**: Explain the prior as *"what both characters already knew/believed about the world BEFORE this scene."* (e.g., "Both trust market data").  
     *Why after evidence?* Writers confuse "same evidence" with "same starting point." Emphasize: **Shared prior enables different interpretations of identical evidence**.  

  5. **Common Knowledge (CK)**: Contrast:  
     - *"Both know the sky is blue"* (not CK) vs.  
     - *"Both know the sky is blue, both know the other knows, both know the other knows they know..."* (CK).  
     Use a quick improv exercise: *"If I told you not to look at the door, would you? Why?"* → CK of instructions changes behavior.  
     *Why here?* CK is abstract. Anchoring it to posterior disagreement (Step 2) makes it relevant. *Moving it earlier loses narrative grounding.*  

  6. **The Update Loop**: Show each character’s refusal to change their belief as **new evidence for the other**.  
     *"When Leo says ‘I still think it’s safe,’ Claire learns: ‘Leo saw our shared evidence and *still* disagrees. That means he must have seen something I missed—or I’m wrong.’"*  
     *Why last?* This is the engine of the theorem. Writers must grasp Steps 1-5 first, or this feels like "stubbornness."  

  7. **The Theorem (Simplified)**:  
     *"If two people:  
     (a) Start from the same prior knowledge,  
     (b) Update rationally on shared evidence,  
     (c) And their current beliefs are common knowledge...  
     They cannot agree to disagree. One must convince the other."*  
     *Why now?* Stated earlier, it seems false ("But people *do* disagree!"). Now, it resolves the dissonance from Step 3.  

  8. **Separate Beliefs vs. Preferences**: Add a twist: *"Now they agree the deal is safe, but Claire wants to invest while Leo doesn’t."*  
     *Why here?* Distinguishes "disagreement about facts" (covered by theorem) from "disagreement about values" (not covered). Prevents overapplication.  

  ---

  ### **The Carrying Example: "The Architect and the Engineer"**
  - **Characters**: Ana (architect) and Ben (engineer), designing a disaster-resistant school.  
  - **Shared Prior**: Both believe "concrete strength is predictable," "safety is paramount," and trust each other’s expertise.  
  - **Identical Evidence**: They inspect the same building site, same soil report, same budget.  
  - **Posteriors**:  
    - Ana: *"The foundation needs 10m pilings (shallow soil)."*  
    - Ben: *"5m pilings suffice (soil is compact)."*  
  - **The Loop**:  
    - Ana states her belief. Ben states his. Neither shifts.  
    - Ana thinks: *"Ben saw everything I saw and insists on 5m? He must know something about compaction I don’t."*  
    - Ben thinks: *"Ana insists on 10m? She must think I’m underestimating quake risk."*  
  - **What It Lacks**: No ego, trauma, lies, or missing data. Only rational inference from shared ground.  
  - **Resolution**: When Ben says, *"I reviewed the seismic chart; it shows compact soil absorbs shocks better,"* Ana realizes *he misinterpreted the chart*. She explains the error—they converge on 8m.  

  ---

  ### **Misconceptions & When to Head Them Off**
  1. **"This means they should meet in the middle!"**  
     *When*: After introducing the update loop (Step 6).  
     *Response*: "No—the theorem forces convergence of *beliefs*, not compromise. Ana and Ben don’t average 10m and 5m; they both adopt 8m because they corrected a factual error."  

  2. **"They must have the same evidence!"**  
     *When*: After defining shared prior (Step 4).  
     *Response*: "Same evidence isn’t required—it’s the *shared prior* that lets them interpret evidence differently. Ana and Ben saw the same report but weighted the seismic chart differently."  

  3. **"Convergence should happen in one exchange!"**  
     *When*: During the update loop (Step 6).  
     *Response*: "It takes iterations! Ben’s first refusal teaches Ana he has a *reason* to hold his view. His second refusal deepens her doubt. Rounds are data."  

  4. **"This is how real people behave!"**  
     *When*: After stating the theorem (Step 7).  
     *Response*: "No—it’s a constraint on coherent fiction, not psychology. Real people have biases, trauma, and bad faith. Your characters don’t need to obey this—but if they *are* rational and disagree, you must violate a condition."  

  5. **Missed Misconception**: **"Characters must be emotionless!"**  
     *When*: During the carrying example.  
     *Response*: "Emotions can exist—but they can’t *cause* the disagreement if the theorem’s conditions hold. If Ana is angry, it must not alter her rational processing of Ben’s statements."  

  ---

  ### **The Leak Test & Final Check**
  - **When to Introduce**: After separating beliefs/preferences (Step 8).  
  - **Why Not Earlier?** If introduced with the theorem, it becomes a "get-out-of-jail-free card." Now, writers see it as a diagnostic: *"Your scene breaks? One of these pipes is leaking."*  
  - **The Test**: For any persistent disagreement, ask:  
    - Did they truly share a prior (e.g., different core values)?  
    - Are posteriors truly common knowledge (e.g., one character fakes agreement)?  
    - Is there hidden evidence or inference costs (e.g., "She couldn’t process his math")?  
    - Is this actually a values clash (e.g., "It’s not about risk assessment—Ana prioritizes cost over safety")?  
  - **Check for Understanding**: Give a 1-paragraph scene where characters disagree. Ask writers to:  
    - Identify which condition is violated.  
    - Propose a rewrite where the disagreement *persists coherently* by breaking a different condition.  

  ---

  ### **What to Refuse to Explain (and Say You’re Refusing)**
  - **Refusal 1**: *"I won’t derive the math or use Bayes’ rule—we care about narrative implications, not equations."*  
  - **Refusal 2**: *"I won’t debate real-world applicability—this is a tool for fiction, not psychology."*  
  - **Refusal 3**: *"I won’t tackle irrationality (e.g., trauma) today—focus on rational disagreement first."*  

  ---

  ### **Why This Plan Works**
  - **Narrative-First**: Concepts emerge from story problems, not abstraction.  
  - **Myth-Busting**: Misconceptions are preempted *as they arise* during the logic build.  
  - **One Anchor Example**: "The Architect and the Engineer" embodies all components without distractions.  
  - **Leak Test as Payoff**: Writers leave with a concrete protocol to audit their drafts.  

  **Time Allocation**: Steps 1-5 (30 mins), Steps 6-8 + Example (40 mins), Leak Test + Exercise (20 mins). Adjust as needed—but guard the sequence. Deviations risk confusion.
