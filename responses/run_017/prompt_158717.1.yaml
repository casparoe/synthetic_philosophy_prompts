prompt: |-
  Hey, I'm putting together a short chapter on what individuals owe in situations where the harm only shows up collectively, and before I even look at what people have already said I want the spec nailed down first. So: write me the desiderata that an account of a single agent's reasons in collective-harm cases would have to meet.

  Fix the purpose like this: it has to be able to tell one person what she has most reason to do on an ordinary Tuesday, and separately say something coherent about whether anyone may blame or criticise her if she doesn't — I don't want those two questions quietly treated as the same question.

  Cases it has to get right (add any I'm missing): the tiny-contribution case, where a few thousand people each do something whose effect on the victim is imperceptible on its own; the lumpy-threshold case, where the harm comes in discrete units, e.g. a canteen that restocks whole animals in batches sized to last week's sales, so whether your sandwich matters depends on where in the batch it lands and you can't tell which; the constitutive rather than causal case, like a vote whose only real effect runs through the size of the winning margin instead of through who wins; the repeat-player case, where the same agent faces the same negligible choice hundreds of times over a life; and the awkward one where the party being harmed is arguably better off existing at all, since the demand that created them is also what creates the harm.

  Then say which distinctions the account must not collapse: making a difference versus being one of the people who make it, expected versus actual efficacy, acting wrongly versus being aptly blamed, what I should do versus what we should do, and reasons not to contribute versus reasons to pay for it afterward.

  Mark which of these you take to be genuine requirements and which are just a prejudice of one camp — I think the idea that if your act makes no difference then you can't have a duty not to do it is an assumption smuggled in as a result. And tell me whether any subset of the desiderata can't be satisfied together, since that's the part I actually care about, plus which single requirement eliminates the most popular existing answers. Keep the scorecard to a couple of lines, I'll do that bit myself.
reasoning: |-
  Okay, the user is working on a chapter about individual obligations in collective harm situations. They want to nail down the specifications before reviewing existing literature. Let me start by understanding their main request: they need desiderata for an account that explains a single agent's reasons in collective-harm cases.

  First, they specified the purpose: the account must tell an individual what they have most reason to do on an ordinary day, and separately address whether they can be blamed if they don't act. These two questions should be distinct. So the desiderata need to ensure that reasons for action and blameworthiness are treated separately.

  Next, the cases they mentioned: tiny contributions (imperceptible harm), lumpy thresholds (discrete harm units like canteen restocking), constitutive cases (like voting affecting margins), repeat players (same choice multiple times), and existence-related harms (where the harmed party benefits from existing). I need to make sure the account handles all these scenarios. Maybe add a case where harm is probabilistic? But the user might have covered the bases with lumpy thresholds including uncertainty.

  Key distinctions they want preserved: difference-making vs. being part of the group, expected vs. actual efficacy, wrong action vs. blameworthiness, individual vs. collective obligations, and contributing vs. compensating. Each of these needs to be non-collapsible. The user suspects that the idea of "no difference, no duty" might be an unwarranted assumption. So desiderata should challenge that if necessary.

  Now, deeper needs: The user is likely an academic, maybe in philosophy or ethics. They want a robust framework that avoids common pitfalls. Their unspoken need might be to identify which desiderata are genuinely necessary versus biased assumptions. They also want to know if any desiderata conflict, as that's crucial for their chapter. Highlighting tensions between desiderata, like between individual reasons and no-blame in tiny contributions, would be key.

  They mentioned eliminating popular answers. So desiderata like "Non-Zero Reason" could challenge consequentialist views, while "Blame Separation" targets accounts that conflate wrongness and blame. The requirement to distinguish expected vs. actual efficacy might rule out purely probabilistic approaches.

  Conflicts: "No-Difference Immunity" might clash with "Repeat Player" if repeated actions collectively cause harm but individually don't. Also, "Existence-Relative Harm" complicates harm assessment when existence is beneficial. Need to flag these tensions.

  Finally, the user wants a concise scorecard. So summarizing which desiderata are essential and which are contested, plus conflicts. Ensuring clarity on which requirements are widely accepted versus debated (like "Non-Zero Reason") helps them frame their argument.
answer: |-
  Here's a distilled set of desiderata for an account of individual reasons in collective harm cases, based on your specifications:

  **Core Purpose:**
  1.  **Action Guidance:** Must specify what *a single individual* has most reason to do in the specific choice situation ("an ordinary Tuesday").
  2.  **Blame Separation:** Must provide a distinct, coherent account of whether that individual is *aptly subject to blame or criticism* for their choice, without collapsing this into the "most reason" judgment.

  **Cases to Handle:**
  3.  **Tiny Contribution:** Account for reasons when an individual's causal contribution to harm is imperceptible/negligible (e.g., one straw on the camel).
  4.  **Lumpy Threshold:** Account for reasons when the harm mechanism involves discrete thresholds, and the individual cannot know if their action is the trigger (e.g., canteen restocking).
  5.  **Constitutive Contribution:** Account for reasons when the individual's action contributes constitutively to a harmful collective outcome (e.g., vote affecting margin/salience, not just winner).
  6.  **Repeat Player:** Account for reasons when the same individual faces functionally identical negligible choices repeatedly over time.
  7.  **Existence-Relative Harm:** Account for reasons when the harmed party arguably benefits overall from the system causing the harm (e.g., workers created by demand for a harmful product).

  **Distinctions to Preserve (Non-Collapsible):**
  8.  **Difference-Making vs. Group Membership:** Must not collapse the distinction between *actually making a difference* (causally/constitutively) and *merely being part of the group* that does.
  9.  **Expected vs. Actual Efficacy:** Must distinguish reasons based on *ex ante expected consequences* from reasons based on *ex post actual consequences*.
  10. **Wrongness vs. Blameworthiness:** Must distinguish an action being *wrong* (violating a duty/reason) from the agent being *aptly blamed* for performing it.
  11. **Individual vs. Collective Ought:** Must distinguish what *I* should do from what *we* should do.
  12. **Contribution vs. Compensation:** Must distinguish reasons *not to contribute* to harm from reasons *to compensate* for harm already caused.

  **Desiderata Classification:**
  *   **Genuine Requirements (Widely Agreed Core):** 1 (Action Guidance), 2 (Blame Separation), 3-7 (Case Coverage - essential tests), 8 (Difference-Making vs. Group Membership - core puzzle), 10 (Wrongness vs. Blameworthiness - core separation), 11 (Individual vs. Collective Ought - core separation).
  *   **Contested/Assumption-Laden (Require Argument):**
      *   **9 (Expected vs. Actual Efficacy):** Some (e.g., objective consequentialists) see actual consequences as primary; others (e.g., expectabilists) see expected consequences as primary for reasons. *Must be addressed, but the account's stance needs justification.*
      *   **12 (Contribution vs. Compensation):** While clearly distinct phenomena, *how* an account grounds the former (esp. in no-difference cases) influences views on the latter. *Preserving the distinction is essential, but its implications are contested.*
      *   **"No Difference, No Duty" Assumption:** This is **not** a genuine requirement; it's the very assumption your desiderata must *challenge*. Desiderata 3 (Tiny Contribution) and 6 (Repeat Player) specifically target its plausibility. A successful account *must* either explain duties without difference-making *or* robustly defend why difference-making *is* necessary despite these cases.

  **Tensions & Eliminators:**
  *   **Key Tension:** The core tension lies between satisfying **1 (Action Guidance)** + **3 (Tiny Contribution)** + **6 (Repeat Player)** + **8 (Preserving Difference-Making)** while avoiding the **"No Difference, No Duty" Assumption** and maintaining **10 (Wrongness vs. Blame Separation)**. How can one have a decisive reason *not* to act in a way that seems to make *no* difference and for which one might not be *blameworthy*? Accounts struggle to ground the "wrongness" without difference-making or without collapsing into "we" oughts.
  *   **Major Eliminator:** The requirement that the account provide **Action Guidance (1)** for individuals in **Tiny Contribution (3)** and **Lumpy Threshold (4)** scenarios, *without relying on actually making a difference*, eliminates most simple consequentialist and deontological accounts (e.g., Parfit's initial "C" principle, standard harming/not-aiding distinctions). It forces engagement with expected utility, participation, expressive, or collective obligation views.
  *   **Secondary Eliminator:** Insisting on a clean **Wrongness vs. Blameworthiness (10)** separation, especially in **Tiny Contribution (3)** cases, eliminates accounts that implicitly define wrongness *as* what merits blame, or vice-versa.

  **Concise Scorecard of Conflicts:**
  | **Desideratum**         | **Conflicts Most With**                     | **Notes**                                                                 |
  | :---------------------- | :------------------------------------------ | :------------------------------------------------------------------------ |
  | **1. Action Guidance**  | 8 (Difference-Making), 3 (Tiny Contribution)| How guide action if no perceptible difference?                            |
  | **3. Tiny Contribution**| 8 (Difference-Making), Assumption           | Core challenge to "no difference, no duty".                               |
  | **6. Repeat Player**    | 8 (Difference-Making)                       | Individual acts may not differ, but pattern clearly does.                 |
  | **10. Wrongness≠Blame** | Common Intuitions                           | People often intuitively link them; account must justify separation.      |
  | **Existence-Relative (7)**| Standard Harm Metrics                     | Complicates defining the "harm" the individual contributes to.            |

  **Crucial Takeaway:** The most fundamental challenge is providing **Action Guidance (1)** grounded in reasons *for the individual* in **Tiny Contribution (3)** and **Lumpy Threshold (4)** cases, without relying on actual difference-making (**8**) (rejecting the smuggled assumption), while keeping the judgment of wrongness distinct from blameworthiness (**10**). This nexus eliminates the most intuitive popular answers and forces complex solutions involving expectation, participation norms, collective agency, or revised conceptions of harm/duty. The **Repeat Player (6)** case intensifies the pressure on views that might dismiss tiny contributions as irrelevant.
