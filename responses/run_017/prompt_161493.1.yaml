  4. **Decision on shipping:**
     - If we are shipping to the entire population, use the standardized effect for the entire population (if there was a sign reversal) or the unadjusted effect if no sign reversal and no post-assignment variable issues.
     - If we are shipping to one segment, then use the effect in that segment (if the segment is defined by a pre-assignment variable). However, note that if the segment is small, the estimate might be imprecise.

     But note: if we are shipping to one segment, we must have enough data in that segment.

