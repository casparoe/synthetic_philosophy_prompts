          How could that happen? The assignment is done at the user level, so within a country, it should be balanced. Unless there was a problem in the assignment mechanism that correlates with country (e.g., assignment by a non-random mechanism that depends on something that also varies by country).

          Therefore, step 1: check within-country assignment balance.

          In our example, in Country1: A has 100, B has 1000 -> imbalance. We must investigate why. It might be because the test started in Country1 later and we assigned more to B in that period? And at the same time, the traffic from Country1 increased over time? 

          Then we must adjust for time. We break the test by time period and see the effect in Country1 by time period. Then, we can compute a standardized effect for Country1 by averaging the time-specific effects? 

          But note: we are only going to ship in Country1. So we want the effect in Country1. We can do:

            For Country1, run a logistic regression including time (as a categorical variable) and treatment. This adjusts for time.

          However, the procedure is for 20 minutes. We might not have time for a regression. 

          Alternatively, we can compute the conversion rates for A and B in Country1 for each time period (e.g., week) and then take an average of the weekly risk differences (weighted by the number of users in that week) to get an overall effect for Country1 that accounts for the time trend.

          Steps for Country1:

            - Divide the test period into weeks (or days if necessary).
            - For each week, compute:
                 nA_week, nB_week, conversions_A_week, conversions_B_week, pA_week, pB_week.
            - If there is a week with no A or no B, then skip or combine? But if we have at least one user in each variant per week, then:
            - Compute the risk difference per week: RD_week = pB_week - pA_week.
            - Then, the overall risk difference for Country1 is the weighted average of RD_week, weighted by the total users in that week (nA_week + nB_week).

            Alternatively, we can pool the data but include week as a fixed effect in a regression.

          If after adjusting for time, the effect in Country1 is still negative, then we do not ship.

          But note: what if we don't have enough data per week? Then we might use a coarser time bin.

          And if we don't have enough data in Country1 overall, then we cannot make a decision.

          Summary for case (c):

            Step 1: Check within-country assignment balance. If imbalanced, check time trends and adjust by standardizing over time.
            Step 2: Compute the effect in the country of interest (after adjusting for time if necessary) using risk difference (to avoid non-collapsibility).
            Step 3: If the effect is negative and significant (or if we are not powered, but the point estimate is negative), then do not ship.

            However, the case says we see a loss in every country. So even if we adjust for time, we might still see a loss in the country of interest.

            And since we are only shipping in one country, we do not ship.

          But note: the overall effect is positive. We ignore that because we are not shipping overall.

  Therefore, the decision procedure:

  1. **Data Integrity Check (5 minutes):**
     - Check sample sizes per variant and per segment. Flag any segment with less than 30 users in a variant.
     - Check assignment balance: 
          - For pre-assignment segments, check that the proportion of users in each segment is similar between variants (e.g., using a chi-square test or by eye). 
          - For post-assignment segments, only check overall balance and segment sizes (but note: we won't use these segments for decision).
     - Check time trends: plot the cumulative conversion rate by variant (and by segment if pre-assignment) over time. Look for anomalies or shifts that might indicate a data issue or a drift in traffic mix.

     If any issue is found (e.g., severe imbalance in pre-assignment segments, or a time anomaly), then:
          - If the issue is in the segment we care about (for shipping), then try to adjust (e.g., standardize over time) or hand off for more analysis.
          - If the issue is in a segment we don't care about, but the overall effect is what matters and there is an overall assignment issue, then stop and investigate.

     If no issue, proceed.

  2. **Classify the Segmentation Variable (2 minutes):**
     - If post-assignment: 
          - If we are shipping to the entire population, use the overall effect and ignore the segments. 
          - If we are shipping to a specific segment defined by the post-assignment variable, hand off to an expert.
          - Stop the procedure for this segmentation variable.
     - If pre-assignment: proceed.

  3. **Check for Sign Reversal (5 minutes):**
     - If the overall effect and the segment effects are in the same direction (e.g., both show B winning or both show B losing), then there is no paradox. Use the overall effect if shipping to the entire population, or the segment effect if shipping to a segment.
     - If there is a sign reversal (overall and every segment disagree in direction):
          - Switch to risk differences (or risk ratios) to avoid non-collapsibility issues.
          - For pre-assignment segments, standardize the effect to the entire population (if shipping to the entire population) or to the segment of interest (if shipping to a segment) using the observed segment sizes (or future mix if known) to compute standardized conversion rates and then the risk difference.
          - Compare the standardized risk difference with the unadjusted overall risk difference. If they still show a sign reversal, then hand off to an expert (genuine Simpson's paradox that may require causal discovery). Otherwise, use the standardized effect.

  4. **Make the Shipping Decision (3 minutes):**
     - For shipping to the entire population: use the standardized overall effect (if there was a sign reversal) or the unadjusted effect (if not).
     - For shipping to a specific segment: use the effect in that segment (after adjusting for any within-segment issues like time drift).

  5. **Hand Off When (5 minutes for checks):**
     - Post-assignment segmentation for which we care about the segment effect.
     - After standardization, the risk difference still shows a sign reversal.
     - The sample size in the segment of interest is too small.
     - The assignment imbalance is not explainable by traffic drift and cannot be adjusted in the time available.

  Run on the cases:

  Case (a): 
     - Pre-assignment (device), and split and mix look fine -> so assignment is balanced per device.
     - But then sign reversal is impossible (because the overall effect must be a weighted average of the segment effects). Therefore, we must have a data error. Stop and investigate.

  Case (b):
     - Segmentation by post-assignment variable (onboarding). We are not told that we are shipping only to users who complete onboarding, so we use the overall effect and ship because B wins overall. We ignore the segments.

  Case (c):
     - Pre-assignment (country). We are shipping to one country.
     - We see that in every country, B loses. So in the country we are going to ship to, we expect B to lose.
     - Step 1: Check within-country assignment balance. If balanced, then we trust the country-specific effect and do not ship.
          If imbalanced, then adjust for time. If after adjustment the effect is still negative, do not ship.

     Therefore, we do not ship.

     This is an answer the analyst might not want to hear (because overall B wins, but we are not shipping to the overall).

  Note: In case (c), it's possible that in the country we are shipping to, after adjusting for time, the effect becomes positive. But the case says it loses in every country, so we assume even after adjustment it's negative.

  Final decision procedure in a flowchart would be:

    START
    │
    ▼
    Data Integrity Check (sample sizes, assignment balance, time trends)
    │
    ├── If issue found ──> Attempt quick fix (e.g., standardize over time) or hand off.
    │
    └── If no issue ──> Classify segmentation variable.
            │
            ├── Post-assignment: 
            │      ├── Shipping to entire population: use overall effect.
            │      └── Shipping to segment: hand off.
            │
            └── Pre-assignment: 
                   ├── No sign reversal: use overall or segment effect based on shipping decision.
                   └── Sign reversal: 
                           ├── Switch to risk differences.
                           ├── Standardize to target population.
                           ├── If still sign reversal: hand off.
                           └── Else: use standardized effect.
answer: |-
  Below is a 20-minute decision procedure for handling Simpson's paradox in A/B tests, designed for analysts with SQL/regression skills. It addresses your requirements, including post-vs-pre-assignment variables, traffic drift, non-collapsibility of odds ratios, and population standardization. The procedure prioritizes defensible decisions over causal depth, with clear handoff points.

  ---

  ### **Decision Procedure: Simpson's Paradox Triage**
  **Time Budget**: 20 minutes (split per step)  
  **Inputs**: Topline result (variant B wins/loses overall), segment-level results, segment sizes, assignment timestamps.  
  **Output**: Ship/don’t ship decision, or handoff to PM/expert.  
  **Tools Needed**: SQL, calculator, or basic regression (logistic or linear).

  #### **Step 1: Classify the Segmentation Variable (3 min)**  
  **Goal**: Determine if the variable is **pre-assignment** (fixed at assignment) or **post-assignment** (outcome-dependent).  
  - **Pre-assignment**: Device, country, week (safe to use).  
  - **Post-assignment**: "Completed onboarding", "made first purchase" (risky; may introduce bias).  
  **Decision**:  
    - If **post-assignment → Skip to Step 4**. Do not trust segment-level results.  
    - If **pre-assignment → Proceed to Step 2**.  

  #### **Step 2: Check Data Integrity & Traffic Drift (5 min)**  
  **Goal**: Rule out measurement errors or traffic shifts.  
  **Checks**:  
  1. **Balance**: Segment sizes proportional between variants? (e.g., iOS split 50/50 in A/B).  
  2. **Sample size**: Any segment with <100 users per variant? Flag as unreliable.  
  3. **Time drift**: Plot daily traffic per segment. If segment mix shifted >20% during the test, note it.  
  **Decision**:  
    - If imbalance, small samples, or drift → **Handoff to data engineer** (measurement issue).  
    - If clean → Proceed to Step 3.  

  #### **Step 3: Resolve Sign Reversal (Odds Ratios → Risk Differences) (8 min)**  
  **Goal**: Distinguish non-collapsibility (mathematical artifact) from genuine paradox.  
  **Key Insight**:  
    - Non-collapsibility **cannot cause sign reversals** in odds ratios. If OR >1 overall but <1 in every segment (or vice versa), it’s a true paradox, not stats noise.  
    - **Fix**: Convert odds ratios to **risk differences (RDs)** or **risk ratios (RRs)**. RDs/RRs are collapsible and avoid this pitfall.  

  **Action**:  
  1. For each segment, compute:  
     - Conversion rate (A): `pA = conversions_A / users_A`  
     - Conversion rate (B): `pB = conversions_B / users_B`  
     - **Risk difference (RD)**: `RD_seg = pB - pA`  
     - **Segment weight**: `w_seg = (users_A + users_B) / total_users` (use **current test mix**; ignore future mix for now).  
  2. Compute **standardized overall RD**:  
     - `RD_overall_std = Σ (RD_seg × w_seg)`  
  3. Compare to **crude overall RD** (from topline):  
     - `RD_crude = (total_conversions_B / total_users_B) - (total_conversions_A / total_users_A)`  

  **Decision**:  
    - If `RD_overall_std` and `RD_crude` **agree in sign** (e.g., both positive) → Non-collapsibility artifact. **Trust standardized RD**.  
    - If `RD_overall_std` and `RD_crude` **disagree in sign** → Genuine Simpson’s paradox. **Handoff to causal expert**.  
    - If segments have **high variance** (e.g., RDs range from -10% to +15%) → Use **weighted average RD** for decision.  

  #### **Step 4: Choose Standardization Population (2 min)**  
  **Goal**: Pick the right population for shipping.  
  **Rules**:  
    - Shipping to **all users**? Use **test population mix** (Step 3’s `RD_overall_std`).  
    - Shipping to **one segment** (e.g., only iOS)? Use **that segment’s RD** (ignore overall).  
    - Future mix known (e.g., "next quarter traffic will be 80% iOS")? Recompute `RD_overall_std` with **future weights**.  

  #### **Step 5: Final Decision & Handoff (2 min)**  
  **Goal**: Ship or stop.  
  **Decision**:  
    - If **RD >0** (B wins) in target population → **Ship B**.  
    - If **RD ≤0** (B loses) → **Don’t ship**.  
    - If **unresolved paradox** or **post-assignment variable** → **Handoff to PM/expert** with:  
      - "Effect direction depends on segmentation; causal mediation needed."  
      - "Post-assignment segments are biased; cannot isolate treatment effect."  

  ---

  ### **Run on Your Cases**
  #### **Case (a): B wins overall, loses on iOS/Android, split/mix fine**  
  - **Step 1**: Device (iOS/Android) = **pre-assignment**. Proceed.  
  - **Step 2**: Split balanced, no drift → **Clean**.  
  - **Step 3**: Compute RDs:  
    - Suppose:  
      - iOS: `RD_ios = -0.03` (B loses), weight = 0.6  
      - Android: `RD_android = -0.02` (B loses), weight = 0.4  
    - `RD_overall_std = (-0.03 × 0.6) + (-0.02 × 0.4) = -0.026`  
    - `RD_crude = +0.01` (B wins overall) → **Sign reversal!**  
  - **Verdict**: Genuine Simpson’s paradox → **Handoff to causal expert**.  
  - **Why?** RDs should not reverse under clean randomization. Likely unmeasured confounding (e.g., device interacts with treatment).  

  #### **Case (b): B wins overall, loses among users who completed/didn’t complete onboarding**  
  - **Step 1**: "Completed onboarding" = **post-assignment**. Skip to Step 4.  
  - **Step 4**: Shipping to **all users** → Use **crude overall RD** (ignore segments).  
  - **Verdict**: If `RD_crude >0` → **Ship B**.  
  - **Why?** Segment effects are biased (onboarding is outcome-dependent). Topline is valid.  

  #### **Case (c): B wins overall, loses in every country; shipping to one country**  
  - **Step 1**: Country = **pre-assignment**. Proceed.  
  - **Step 2**: Check drift (e.g., if Country X surged mid-test). If drift >20%, reweight RDs by time.  
  - **Step 3**: Compute RD for **target country** (e.g., US):  
    - `RD_us = -0.01` (B loses)  
  - **Step 4**: Shipping to **one country (US)** → Use `RD_us`.  
  - **Verdict**: **Don’t ship B** (loses in US).  
  - **Why?** Overall win is irrelevant; country-specific effect is negative.  

  ---

  ### **What the Procedure Can’t Settle**  
  1. **Post-assignment segments**: Cannot resolve without causal graphs (e.g., mediation analysis).  
  2. **Genuine sign reversals**: If RDs disagree after standardization → Unexplained paradox (needs DAGs).  
  3. **Small segments**: Results with <100 users/variant are noise-prone (handoff for Bayesian methods).  
  4. **Heterogeneous effects**: If RDs vary wildly (+10% in iOS, -20% in Android) → Business tradeoff (handoff to PM).  

  **Bottom Line**:  
  - **Ship** if: (1) Topline RD valid (no post-assignment issues), or (2) Target segment RD positive.  
  - **Don’t ship** if: (1) Target segment RD negative, or (2) Unresolved paradox.  
  - **Handoff** if: Post-assignment variables, data issues, or true sign reversal.  

  This ensures you defend decisions in meetings without overstepping analytical limits.
