  We are facing a Simpson's paradox situation in A/B testing. The goal is to create a decision procedure that can be run in about 20 minutes to resolve such paradoxes. The procedure must address the following:

  1. Distinguish between post-assignment variables (like "users who finished onboarding") and pre-assignment variables (like device, country, week).
  2. Handle traffic mix drift (segment sizes change during the test).
  3. Account for non-collapsibility of odds ratios (if applicable) and distinguish it from a genuine sign reversal.
  4. Decide which population to standardize to when we're going to ship to a specific segment.

  We are to run the procedure on three cases and be explicit about what the procedure cannot settle.

  Key concepts:
  - Simpson's paradox: the direction of an association reverses when data from several groups are combined.
  - Non-collapsibility: In logistic regression, the odds ratio can change when adding a predictor even if that predictor is not a confounder. This is a mathematical property and not due to confounding. The marginal odds ratio (without adjusting for covariates) is not a weighted average of conditional odds ratios (within strata). Therefore, it is possible for the marginal odds ratio to be greater than 1 while all conditional odds ratios are less than 1 (or vice versa) without any confounding.

  Procedure Outline:

  Step 1: Verify data integrity and measurement.
  - Check for data collection issues: missing data, misassignment, mislogging.
  - Ensure that the assignment was random and that the segments are defined correctly.
  - Check the sample sizes in each segment and overall. If any segment has very small sample size, the results in that segment may be unreliable.

  Step 2: Distinguish between pre-assignment and post-assignment variables.
  - Pre-assignment variables (like device, country, week) are fixed at the time of assignment and can be used for stratification without introducing bias.
  - Post-assignment variables (like "users who finished onboarding") are outcomes or mediators. Conditioning on them can introduce bias (e.g., if the treatment affects the post-assignment variable, then conditioning on it may block part of the treatment effect or introduce collider bias).

  Step 3: Handle traffic mix drift.
  - If the segment sizes (proportions of traffic in each segment) change during the test, we must account for this in the analysis. We can use standardization (averaging the segment-specific effects weighted by a standard population) or use a regression model that includes time or adjusts for the changing mix.

  Step 4: Address non-collapsibility for odds ratios.
  - If using logistic regression and odds ratios, note that non-collapsibility can cause the marginal and conditional odds ratios to differ. However, non-collapsibility alone does not cause a sign reversal. A sign reversal is a more severe form of non-collapsibility and is not typical. In fact, for non-collapsibility without confounding, the marginal and conditional odds ratios are on the same side of 1 (both >1 or both <1) but with different magnitudes. If we observe a sign reversal (i.e., marginal OR>1 and conditional OR<1 in every stratum, or vice versa), then non-collapsibility alone cannot explain it. Therefore, a sign reversal indicates either:
     a) A problem with the analysis (e.g., confounding, selection bias, or model misspecification) OR
     b) A genuine Simpson's paradox due to a causal mechanism (which would require careful causal reasoning).

  Step 5: Decision on which population to standardize to.
  - If we are going to ship to a specific segment (e.g., one country), then we should look at the effect in that segment. Otherwise, if we are going to ship to the entire population, we should standardize to the entire population (or use a weighted average that reflects the future traffic mix).

  The Procedure:

  1. **Check for data integrity issues:**
     - Look at the overall and segment-level sample sizes and conversion counts. If any segment has too few observations (e.g., less than 30 in a cell), flag it as unreliable.
     - Check the assignment rates by segment. If the assignment is not balanced in a segment (e.g., variant A and B have very different counts in a segment), then there might be an assignment issue.
     - Check the time trend: plot the daily conversion rates by variant and segment to see if there are anomalies or shifts that might indicate a data problem.

     If any data integrity issue is found, stop and investigate that first.

  2. **Classify the segmentation variable:**
     - Is the variable a pre-assignment (fixed) or post-assignment (outcome/mediator) variable?
       - Pre-assignment: safe to condition on (e.g., device, country, week).
       - Post-assignment: conditioning might introduce bias (e.g., completed onboarding). In this case, we cannot trust the segment-level results without further causal analysis.

     If the segmentation is by a post-assignment variable, then:
       - The overall effect (unadjusted) is the total effect of the treatment.
       - The segment effects are conditional on an intermediate outcome and may not represent causal effects. We should avoid making decisions based on these segments and instead report the overall effect. However, if we are interested in the effect only for those who completed onboarding (for example), then we might want to condition, but note that this is a different effect (it's the effect conditional on having completed onboarding). This is a causal question that requires more advanced methods (like principal stratification or mediation analysis) and is beyond the scope of a 20-minute procedure. Therefore, the procedure should stop and recommend either:
          a) Report the overall effect and ignore the segment breakdown for this variable, OR
          b) Hand off to a causal inference expert.

  3. **Check for non-collapsibility vs. sign reversal:**
     - If the effect measure is an odds ratio, and we see a sign reversal (e.g., overall OR>1 but in every segment OR<1, or vice versa), then non-collapsibility alone cannot explain a sign reversal. Therefore, we must suspect either:
          a) Confounding: the segments are confounded? But if the assignment was randomized, then confounding should not be present unless there is a failure in randomization (which we check in step 1) or the stratification variable is a post-assignment variable (which we check in step 2).
          b) Model misspecification: e.g., non-linear effects not captured? But in a simple logistic regression with just treatment and segment, this might not be the case.
          c) Genuine Simpson's paradox due to the distribution of the outcome and the segment sizes.

     How to proceed:
     - For pre-assignment segments, if we have a sign reversal, we can standardize the results to a common population (using inverse probability weighting or standardization) to get an average treatment effect that is consistent. We can do this by:
          - Calculating the segment-specific conversion rates for both variants.
          - Then, compute the overall conversion rate for each variant by taking a weighted average of the segment-specific rates, using a standard set of weights (e.g., the overall proportion of the segments in the entire population, or the future expected mix).
          - Then, compute the marginal effect (risk difference) or marginal odds ratio from these standardized rates.

     However, note: if we are using odds ratios, we might still see non-collapsibility. Therefore, it is safer to use risk differences or risk ratios for standardization because they are collapsible.

     Proposed approach for sign reversal in pre-assignment segments:
       - Switch from odds ratios to risk differences (or risk ratios) for the standardization.
       - Calculate the standardized risk difference (or risk ratio) for the entire population and for the segment we care about (if shipping to one segment).

     Steps for standardization for pre-assignment segments (with sign reversal):
       a) For each segment, compute:
            pA_seg = conversion rate in variant A
            pB_seg = conversion rate in variant B
            nA_seg = number in variant A in segment
            nB_seg = number in variant B in segment

       b) Choose a standard population: if we are going to ship to the entire population, use the overall segment proportions (from the entire test population) as weights. If we are going to ship to a specific segment, then we only care about that segment.

       c) If we want an overall effect for the entire population (with current segment mix), then:
            overall_pA = sum(weight_seg * pA_seg)   [weight_seg = (nA_seg + nB_seg) / total_n]
            overall_pB = sum(weight_seg * pB_seg)

          Then, compute the overall risk difference: overall_pB - overall_pA, or the risk ratio: overall_pB / overall_pA.

          Alternatively, if we expect the segment mix to change in the future, use the expected future weights.

       d) Compare the standardized risk difference (or risk ratio) to the unadjusted overall risk difference (or risk ratio). If they have the same sign (and the same direction of effect) then the sign reversal is due to non-collapsibility and the changing weights? But note: non-collapsibility does not cause sign reversal. So if we see a sign reversal in the odds ratio, but the risk difference does not reverse, then we can rely on the risk difference.

