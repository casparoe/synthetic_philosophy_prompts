     - If the segmentation variable is post-assignment, and we don't have a causal analysis plan, hand off to an expert.
     - If after standardization (with risk differences) we still have a sign reversal (i.e., the standardized risk difference has the opposite sign of the unadjusted risk difference), then we have a genuine Simpson's paradox that might require causal methods to resolve (like checking for unmeasured confounders or effect modification). Hand off to an expert.
