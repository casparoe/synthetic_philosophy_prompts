  The unresolved cases they mention are revealing: the organoid tests minimal consciousness, the paused simulation challenges temporal continuity, and the occasional pain state raises questions about intensity/duration of experiences. Their framing question about what moral weight attaches to is crucial - I suspect we need to think in terms of experiential moments within systems.

