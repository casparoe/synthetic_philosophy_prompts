  For moral progress (step 6), Strawson can argue reforms come from *refining* internal standards (e.g., recognizing mental illness as a new excusing condition), not stepping outside the practice. The user's "improvement" point is valid, but it doesn't require an external standpoint—just richer application of internal norms. 

  Confidence-wise: I'm 90% sure step (7) is the problem. The user's phrasing ("no one ever had that kind of control") subtly reintroduces the metaphysical question Strawson dismisses. Alternatives? Rejecting step (6) is morally untenable. Rejecting dissolution (step 3) costs Strawson's core insight. So step (7) must fall. 

