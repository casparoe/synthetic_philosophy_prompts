answer: |-
  You've constructed a sharp, internally consistent argument that exposes a genuine tension in Strawson's framework. Your interpretation of Strawson is largely accurate, and the dilemma you present is legitimate. Here's my blunt assessment:

  **The Damaging Step is (7). It subtly imports an external, metaphysical conception of "control" that Strawson explicitly rejects.** Rejecting (7) preserves Strawson's core dissolution while accommodating moral progress without needing an external standpoint. Here's the breakdown:

  1.  **Confidence Level:** 90% confident step (7) is the culprit. 80% confident in this diagnosis. The argument isn't muddled; it's insightful and exposes a pressure point. Steps (5) and (7) *do* contain the equivocation, but (7) is where it crystallizes into the damaging move.
  2.  **Why (7) Looks Fine (But Isn't):**
      *   It *seems* like a straightforward application of the practice's internal standard: "Resentment is fitting only toward someone whose will manifested disregard." If "manifesting disregard" requires a specific *kind* of metaphysical control that we discover *no one ever has*, then indeed, by the practice's lights, resentment is *never* fitting.
      *   It *seems* to avoid needing universal objectivity – a counterfactual judgment suffices.
  3.  **Why (7) is Problematic (The Strawsonian Rebuttal):**
      *   **Strawson Redefines "Control":** Strawson *replaces* the traditional metaphysical notion of "control" (free will vs. determinism) with *socially embedded, practice-immanent conditions*. The excusing conditions ("did he mean it?", "was he coerced?", "was he in a position to know?", "is he a child?", "is he psychotic?") *are* the criteria for determining whether someone's action *counts as* manifesting a quality of will (like disregard) that makes reactive attitudes fitting. There is no *further*, *metaphysical* "control" *behind* these conditions that the practice is tracking.
      *   **The Hypothetical Bites on Metaphysics, Not Practice:** Your step (7) asks: "suppose it turned out that no one ever had *that kind of control* over their will." The fatal phrase is "*that kind of control*." If "that kind of control" means *the kind excluded by standard excusing conditions* (e.g., coercion, psychosis), then the discovery that *no one ever* satisfies the *absence* of these conditions would indeed collapse the practice from within. But Strawson would argue this is a nonsensical, non-empirical hypothesis – it's the *determinist's metaphysical worry* disguised as an empirical discovery. It posits a *global* excusing condition ("determinism") that the practice, by its very nature, does not and *cannot* recognize. The practice operates *exclusively* with *local*, *specific* excusing conditions. Discovering universal determinism isn't discovering a new, universal excusing condition *within the practice*; it's pointing to something *external* to the framework of reasons the practice uses.
      *   **"Manifesting Disregard" is Practice-Relative:** For Strawson, an action "manifests disregard" *precisely when* it meets the practice's conditions for being an expression of the agent's quality of will, *absent the recognized excusing conditions*. The judgment of "manifesting disregard" *is constituted by* the application of these internal standards. There is no deeper "control" fact that makes it *really* true or false *independently* of the practice's application of its own norms. The hypothetical in (7) pretends there is such a fact ("no one *really* had control"), smuggled in via the phrase "that kind of control."
  4.  **Reconciling Step (6) - Moral Progress Without External Standpoint:**
      *   Strawson *can* and *does* account for moral progress *entirely internally*. The history you describe is *not* about stepping outside the practice to judge it externally. It's about *refining the application of the practice's own internal standards* and *discovering new, relevant excusing conditions*.
      *   **Example (Mental Illness):** We didn't step "outside" responsibility and decide mentally ill people weren't responsible *in principle*. We came to understand severe mental illness as *constituting a new type of excusing condition* analogous to, but distinct from, childhood or coercion. We recognized that the *expression* arising from such illness does not reliably manifest the *quality of will* that reactive attitudes track. This was a discovery *within* the practice, driven by empirical understanding and moral reflection *using the framework of the practice itself* (e.g., "Does psychosis prevent someone from 'meaning it' in the relevant way?", "Does it distort their understanding of others' expectations?"). We judged the *older pattern* as getting specific *cases* wrong (misapplying the internal standards by failing to recognize a valid excusing condition), not the whole practice wrong from an external vantage point. The "improvement" is judged *by the practice's own evolving, but internal, standards of fittingness*.
  5.  **Addressing Your Dilemma (Step 9):**
      *   **Rejecting the First Horn:** You do *not* need an external standpoint to make moral progress intelligible. Progress happens through immanent critique and refinement of the practice's internal standards (see point 4 above).
      *   **Rejecting the Second Horn:** You do *not* have to deny that withdrawing resentment from the mentally ill was an improvement. It *was* an improvement *according to the practice's own, refined standards of fittingness*.
      *   **The Cost of Rejecting (7):** You must fully embrace Strawson's *redefinition* of the conditions of responsibility as *exhausted by* the socially embedded, participant reactive attitudes and their associated excusing/justifying conditions. You must give up the idea that the practice is *really* tracking some deeper, metaphysical "control" that could be globally absent. This means the traditional free will debate *is* dissolved – the question "But are they *really* responsible, given determinism?" has no traction *within the only framework that gives "responsibility" its meaning*. The cost is accepting that responsibility is fundamentally a social, interpersonal phenomenon, not a metaphysical property discoverable from an objective, third-person perspective. You lose the *possibility* of that kind of metaphysical validation (or invalidation) of the entire practice.
  6.  **What Giving Up the Dissolution Costs (If You Chose That Horn):**
      *   If you *insist* on the possibility of a global, external verdict like the one in (7), you *do* effectively resurrect the traditional free will debate within Strawson's framework. The cost is high:
          *   You undermine Strawson's core anti-metaphysical argument. Determinism becomes a *potential* universal excusing condition.
          *   You make the psychological impossibility of universal objectivity irrelevant to the *justification* of the practice. Even if we *can't* give up the reactive attitudes, they might be *globally unfitting*.
          *   You open the door to the very skepticism Strawson sought to block. The "no responsibility" verdict from within becomes a live, unsettling possibility.
          *   You struggle to explain why we *don't* treat determinism as an excusing condition in daily life, even if we believe it true (Strawson's point about the required withdrawal being impossible).

  **Conclusion:** Your argument brilliantly exposes how easily one can sneak the metaphysical question back in under the guise of applying internal standards. However, Strawson's dissolution relies on a strict insistence that the *only* standards for "fittingness," "control," "quality of will," and "manifesting disregard" are the immanent, practice-constituted ones expressed through the specific excusing conditions. Step (7) violates this by implicitly invoking a metaphysical notion of "control" that stands outside the practice. Rejecting (7) preserves the dissolution *and* accommodates moral progress as immanent critique. The cost is accepting that responsibility is irreducibly social and that the traditional metaphysical question is, within the practice of holding responsible, literally senseless. If you find that cost too high (the loss of metaphysical depth), then you must reject Strawson's core project, not just step (7). But your argument doesn't *force* you to do that; it forces you to see where Strawson draws his line in the sand.
