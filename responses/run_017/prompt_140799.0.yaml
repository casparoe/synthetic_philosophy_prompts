prompt: |-
  As a novelist revising the philosophical argument at the center of my manuscript, I need a calibrated credence rather than a literary opinion. My protagonist, a fictional Hobbesian named Adrian Vance, defends a thesis he calls the Geometric Parity Thesis. I will state the needed background as I understand it, without relying on any sources you would have to look up. Hobbes treats geometry as the model of a demonstrative science because the objects geometers study—lines, figures, and the motions that generate them—are drawn or described by us, whereas natural philosophy cannot be fully demonstrative because we do not make natural bodies and must instead conjecture their hidden causes. On the same basis, he argues that civil philosophy is demonstrable because the commonwealth is something we make ourselves. For the sake of my novel I stipulate that Hobbes also accepts a kinematic requirement: to make an object in the sense relevant to demonstration is to generate it by a continuous motion that the maker could in principle perform and describe, as a point moved generates a line.

  Now the specific claim I need evaluated. Vance's Geometric Parity Thesis says that Hobbes's argument commits him to the following conditional: civil philosophy is demonstrable in the strict geometrical sense only if the institution of a commonwealth is a single, transparent act of construction by the founders, and not a gradual, unplanned process of habituation that the subjects could never survey as one motion. Call the latter sort of process Sedimentary Authorization. So the proposition I want your credence on is this: given the Hobbesian background I just supplied and the stipulated kinematic requirement, the Geometric Parity Thesis is a correct account of what Hobbes's argument requires—that is, Hobbes is committed to holding that a commonwealth produced by Sedimentary Authorization would not be demonstrable in the way geometry is.

  I do not want to be told that it depends on how one reads Hobbes. I want a number. Please give me your credence that this proposition is true, decomposed into the sub-questions it depends on. At minimum, assign rough probabilities to these terms: that Hobbes's criterion for a demonstrative science really does require generation by describable motion; that the making of a commonwealth by covenant is meant by Hobbes to be a single transparent act rather than something that could be produced by Sedimentary Authorization; that a process like Sedimentary Authorization could still count as something we make ourselves in the relevant sense; and any further term you think belongs. State how the terms combine into your final number, and identify which sub-question your final credence is most sensitive to. Then tell me which term you are least confident in and what kind of argument or evidence would move it most.

  Two of my characters illustrate the disagreement I am trying to place. Vance assigns a credence of 0.8 to the Geometric Parity Thesis; a skeptical mathematician named Miriam Dass assigns 0.2. Tell me which of the sub-questions in your decomposition their disagreement most likely tracks, and whether you think either of them is being inconsistent with something else they believe.

  Please write in a form I could lift into a novelist's notes: be explicit about the arithmetic or the informal weighting you use to combine the sub-probabilities, but keep the register formal and controlled.
