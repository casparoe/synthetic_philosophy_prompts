answer: |-
  Below is a decision tree designed for your interactive explainer, built from the logical space of the July Crisis historiography. I've structured it to address **causal contribution** (who made the difference) and **moral culpability** (whose actions were blameworthy), as these are the dimensions most actively debated by historians. **Liability to repair** is excluded because it isn't meaningfully separable here—the events are too historically distant, and states no longer exist in the same form. The tree avoids proper names until the leaves, ensuring users don't need prior knowledge.

  The tree has **10 nodes** (questions) and **7 leaves** (named positions). Nodes are ordered to first resolve foundational disagreements (e.g., agency and intent) before escalating to specific actions. For clarity:
  - Each node is a yes/no question.
  - Answers lead to the next node or a leaf position.
  - Each leaf includes a **named position** and its **least comfortable commitment**—a concise, provocative implication historians who hold this view must accept.
  - **Confidence ratings** indicate whether a node reflects a real historiographical dispute (High) or a logical reconstruction (Medium/Low). Guesses are flagged.

  ---

  ### **Decision Tree: Who is to Blame for the Outbreak of World War I in 1914?**  
  *Start at Node 1 and follow your answers.*

  #### **Node 1: Can states (rather than individuals or systems) bear blame for the war?**  
  *(High confidence: Real dispute, e.g., structuralists vs. intentionalists)*  
  - **No** → Leaf A: **Systemic/Structural Causes**  
    *Least comfortable commitment:* The war was inevitable given pre-1914 alliances, militarism, and nationalism; human agency barely mattered.  
  - **Yes** → Node 2.  

  #### **Node 2: Did any decision-maker actively want a general European war?**  
  *(High confidence: Core of Fischer debate; separates "desire" from "risk")*  
  - **Yes** → Node 3.  
  - **No** → Node 4.  

  #### **Node 3: Was this desire driven by a need to secure or elevate great-power status?**  
  *(High confidence: Fischer's central argument about German aims)*  
  - **Yes** → Leaf B: **German War Guilt (Fischerite)**  
    *Least comfortable commitment:* Germany deliberately provoked war to dominate Europe, sacrificing millions for imperial ambition.  
  - **No** → *Empty Cell* (Unattractive: No major position argues a state wanted war for non-great-power reasons (e.g., ideology or religion).)  

  #### **Node 4: Did any decision-maker knowingly accept the risk of a general war?**  
  *(High confidence: Dispute over "calculated risk" vs. miscalculation)*  
  - **Yes** → Node 5.  
  - **No** → Leaf A: **Systemic/Structural Causes** (If no one willed or risked war, only systems explain it.)  

  #### **Node 5: Was a critical action motivated by unconditional support for an ally?**  
  *(High confidence: "Blank check" debates about German backing of Austria-Hungary)*  
  - **Yes** → Node 6.  
  - **No** → Node 7.  

  #### **Node 6: Did this support encourage an ally to act aggressively?**  
  *(High confidence: Key to assigning responsibility for escalation)*  
  - **Yes** → Leaf C: **Austro-German Conspiracy**  
    *Least comfortable commitment:* Germany enabled Austria-Hungary's belligerence, making both equally culpable for causing the war.  
  - **No** → *Empty Cell* (Incoherent: Backing an ally "unconditionally" without encouraging aggression is a contradiction in this context.)  

  #### **Node 7: Was mobilizing a major power's army an independent cause of escalation?**  
  *(High confidence: Historiographical divide over Russian mobilization)*  
  - **Yes** → Leaf D: **Russian Escalation Thesis**  
    *Least comfortable commitment:* Russia's mobilization was a voluntary act of aggression that made continental war unavoidable.  
  - **No** → Node 8.  

  #### **Node 8: Did the refusal to restrain an ally significantly enable the crisis?**  
  *(Medium confidence: Logical extension of alliance debates; e.g., France/Russia)*  
  - **Yes** → Leaf E: **Franco-Russian Provocation**  
    *Least comfortable commitment:* France and Russia bear moral blame for encouraging hardline actions to exploit the crisis.  
  - **No** → Node 9.  

  #### **Node 9: Did a failure to communicate firm intentions worsen the crisis?**  
  *(Medium confidence: Ferguson's argument about British ambiguity; niche but established)*  
  - **Yes** → Leaf F: **British Shared Responsibility**  
    *Least comfortable commitment:* Britain’s dithering misled Germany into thinking it could risk war without British intervention.  
  - **No** → Node 10.  

  #### **Node 10: Was the crisis primarily triggered by a small state's aggression?**  
  *(Low confidence: Logical reconstruction; Serbia's role is contested but not central to most theories)*  
  - **Yes** → Leaf G: **Serbian Recklessness**  
    *Least comfortable commitment:* Serbia’s government tolerated terrorist actions that incited the crisis, shifting blame from great powers.  
  - **No** → Leaf H: **Collective Failure**  
    *Least comfortable commitment:* All major powers share blame for fatalism and incompetence; no one is uniquely responsible.  

  ---

  ### **Key Features & Pushback**  
  **Logical Space & Coverage**:  
  - **Named positions mapped**:  
    - Systemic Causes (A)  
    - German War Guilt (B)  
    - Austro-German Conspiracy (C)  
    - Russian Escalation (D)  
    - Franco-Russian Provocation (E)  
    - British Shared Responsibility (F)  
    - Serbian Recklessness (G)  
    - Collective Failure (H)  
  - **Empty cells**: Two exist (after Nodes 3 and 6). Both are *unattractive*: They force morally or logically awkward stances (e.g., wanting war for trivial reasons or unconditional support without consequences). No major historian occupies these.  
  - **Positions the tree cannot separate**:  
    - *Franco-Russian Provocation (E)* and *Collective Failure (H)* blur if "failure to restrain" is deemed part of systemic dysfunction. The tree prioritizes causal chains over temperament.  
    - *Russian Escalation (D)* and *Austro-German Conspiracy (C)* are separated by Node 7 (mobilization as independent cause).  

  **Pushback on the Tree Approach**:  
  This tree **works** for your goals but has limits:  
  1. **Temperament vs. Logic**: Historians often disagree due to *emphasis* (e.g., Fischer stresses German documents; structuralists downplay individuals). The tree forces discrete choices on contested evidence.  
  2. **"Blame" Ambiguity**: The tree conflates *causal contribution* and *moral culpability* at the leaves (e.g., Fischerite = both). This is unavoidable—positions inherently merge them. To separate, you'd need three parallel trees, but liability is irrelevant, and causal/moral splits are rare in this historiography.  
  3. **Incident-Review Bias**: Your "same runbook/sleep" test assumes rational actors. This favors *miscalculation* theories (e.g., Collective Failure) over *deliberate aggression* (e.g., German War Guilt), as the latter requires ascribing irrational evil. I mitigated this by frontloading intent (Node 2).  

  **Recommendation**: Proceed with the tree. It captures key disputes accessibly. For balance, add a disclaimer: "Historians disagree on both facts and interpretations; this tool simplifies complex debates."  

  Would you like adjustments (e.g., collapsing nodes, rephrasing questions, or adding a position)?
