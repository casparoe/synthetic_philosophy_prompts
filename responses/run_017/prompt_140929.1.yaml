prompt: |-
  So I'm the junior person on a small working group that writes classification reports on atrocities — basically we decide whether a campaign gets the g-word or gets something lesser (crimes against humanity, mass displacement, cultural destruction). We work off the Convention definition, including the fact that its protected-groups list stops at national, ethnical, racial and religious and we've allways refused to stretch it to political groups. Worth knowing too: Lemkin's own broader idea was built to cover killing a group's language, institutions and economic base, not just its members, and our precedent 4 is basically us deciding not to go that far.

  Our track record, shortened:

  - Vardinia, 2003: army units kill most of the men and boys of an ethnoreligious minority across four towns; intercepted orders say no male of them is to remain. We called it genocide.
  - The Kalsten relocations, 1998: the rural population of a minority is deported wholesale from a border province, around 4,000 die of exposure and disease (the cabinet had been warned this would happen), their language schools are shut, and the group goes on existing in camps and in the cities. We did not call it genocide; the writeup says the group was moved, not destroyed.
  - Operation Greenfield, 2011: a herding group's wells are poisoned and their herds destroyed, roughly 2,000 dead, survivors end up as urban dependents, and an internal memo says their way of life has to end so the land can be settled. Genocide.
  - The Marrow schools, 1970s–90s: minority children taken into majority-language boarding schools, the language banned in public life, ~600 dead of neglect, and the group today still has 200,000 self-identifying members. Not genocide: we called it cultural destruction and said the g-word there would be a category error for us.
  - The Pelletier decrees, 2016: forced sterilisation of the group's women, children separated from families, under a hundred dead. Genocide.
  - Sula, 2008: the group's entire population in one province — about 30,000 out of a 2-million-strong group — systematically killed. Genocide. Our note says we don't require the destroyed part to be some share of the whole group; destroying the group where it lives is destroying it in part.

  New case, and it's tearing us apart. A state facing an insurgency in a province inhabited almost entirely by a distinct ethnoreligious group (everyone agrees it's a protected group; it's 400,000 people out of 6 million worldwide). Nobody is deliberately killed. Instead: the group's land is reclassified as state land under a zoning law and they're evicted; a biometrics re-registration requires in-person appointments at offices outside the province, and anyone who can't comply loses rations, benefits and school enrolment; the group's language-medium schools are merged into majority-language ones. Excess deaths from all this are around 9,000. The cabinet was briefed by its own demographers that the group would definately cease to exist as a distinct group in that province within a generation and that the displaced would be absorbed. The ministers' stated purpose is administrative integration and counterinsurgency; the internal memos say the distinctness of the group's identity is the soil the insurgency grows in, and that within a generation there will be no separate group here. Also politically relevant: the group's own representatives are split, half want the label and half think using it for a case with no massacres cheapens it.

  Do you think we'll call it genocide? I care less about the verdict than about which rule we've been implicitly running — something like purpose to destroy the group physically or biologically, versus purpose to end the group's continued existence as the group it is by whatever means, versus something knowledge-based where foreseeable destruction is enough. Which of those are actually consistent with all six precedents above, where do they split on this case, and which precedent is the closest analog — I keep thinking it's Sula, but Sula had everyone dead. And what's the one further case you'd put in front of us that would tell the rules apart? Last thing: one member has started calling this paperwork destruction — campaigns that end a group entirely through administrative acts with no killings at all — and wants it as a named sub-type. If we adopt that, what are we committing to, and does it make our no in precedents 4 and 2 harder to keep?
reasoning: |-
  Okay, let me unpack this complex genocide classification dilemma. The user is part of a working group dealing with a borderline case where a state systematically dismantles an ethnoreligious group's existence through non-lethal means. 

  First, I need to reconcile their six precedents with the new case. The key tension lies between physical destruction (Vardinia, Operation Greenfield, Sula) and erasure of group identity (Marrow schools, Kalsten). The Pelletier forced sterilizations sit in between - biological destruction without mass killing. 

  The new case is tricky because it mirrors Kalsten's displacement and Marrow's cultural suppression, but with cabinet-level documentation showing foreseeable group disappearance. Sula seems relevant too - destroying a group "in part" geographically. But unlike Sula's killings, here deaths are indirect. 

  The user's deeper concern is about consistency in their framework. Three possible rules emerge:
  - "Physical/bioloigical destruction only" (would exclude new case)
  - "Purpose to end group existence by any means" (might include it)
  - "Foreseeable destruction suffices" (gray zone)

  Precedent 4 (Marrow schools) is the biggest obstacle - they rejected genocide despite cultural destruction and some deaths. If they now call this new case genocide, they'd need to distinguish why cultural destruction plus demographic absorption qualifies when Marrow didn't. 

  The sterilizations case (Pelletier) is actually the closest analog - it shows they accept non-violent methods can constitute genocide if they destroy the group's continuity. The new case extends that logic to administrative destruction. 

  If they create a "paperwork destruction" sub-type, it would force reevaluation of Kalsten (where displacement didn't destroy the group) and Marrow (where cultural suppression didn't achieve demographic absorption). But it could be justified by the cabinet's explicit acknowledgment of foreseeable group disappearance here. 

  The test case I'd propose: forced mass conversion programs where group identity is erased but members survive physically. That would force them to decide between physical and existential destruction as criteria.
answer: |-
  Based on your precedents and the Convention's definition, here's a breakdown of how your group is likely to approach this case and the underlying rules:

  **Predicted Outcome & Reasoning:**  
  You will **not call this genocide**, but it will be a contentious split decision (likely 3-2 or 4-3). Here's why:  

  1. **Missing Core Element:** Your precedents consistently require **physical/biological destruction** (Vardinia, Operation Greenfield, Sula) or **reproductive destruction** (Pelletier) for the g-word. The new case lacks direct killing, sterilization, or biological destruction.  
  2. **Kalsten/Marrow Precedents Prevail:** This aligns with Kalsten (displacement without group destruction) and Marrow (cultural suppression + some deaths ≠ genocide). The group persists elsewhere (like Kalsten’s camps) and worldwide.  
  3. **"Destroyed in Part" Doesn’t Apply:** Sula required *physical annihilation* of a geographic subset. Here, the group disappears via assimilation—not physical elimination.  
  4. **Intent vs. Outcome:** Ministers targeted the group’s *distinctness* (identity), not its physical existence. Your group has historically separated identity erosion from biological destruction (Marrow).  

  **Your Implicit Rule:**  
  *"Genocide requires specific intent to physically or biologically destroy a protected group, in whole or in part, with foreseeable mass death or reproductive cessation being a key factor."*  
  - **Consistent with all 6 precedents:**  
    - Vardinia/Sula/Greenfield: Physical destruction.  
    - Pelletier: Biological destruction.  
    - Kalsten/Marrow: No physical/biological destruction → no genocide.  
  - **Splits on the new case:**  
    - Majority: No physical/biological destruction → no genocide.  
    - Minority: Foreseeable demographic erasure + 9k deaths = destruction "in part."  

  **Closest Precedent:**  
  **The Kalsten Relocations (1998)** – not Marrow or Sula.  
  - Shared elements: Forced displacement, foreseeable deaths, group survives elsewhere, state intent to eliminate the group’s presence in a region.  
  - Key difference: Kalsten had no systematic administrative dismantling of institutions *combined* with demographic absorption plans. This makes the new case more severe but not qualitatively different under your framework.  

  **The Test Case to Clarify Rules:**  
  Introduce a scenario: **"A state systematically separates all children of Group X from parents at birth, erases their records, and raises them in majority-culture households. No deaths, no violence, but Group X disappears in one generation."**  
  - Under a "biological destruction" rule: Not genocide (no killing/sterilization).  
  - Under an "existential destruction" rule: Genocide (group destroyed by assimilation).  
  - Your group’s likely answer (based on Marrow): Not genocide. This confirms your physical/biological threshold.  

  **On "Paperwork Destruction" as a Sub-Type:**  
  **Doing this would undermine your past decisions and expand the definition significantly.**  
  - **Commitments:** You’d be committing to:  
    - Genocide covering non-violent, administrative destruction of group identity.  
    - "Intent to destroy" including cultural assimilation + demographic absorption.  
    - Foreseeable group disappearance (without mass death) as sufficient.  
  - **Conflict with Precedents:**  
    - **Marrow Schools (Precedent 4):** Becomes harder to defend. If paperwork destruction is genocide, Marrow (boarding schools, language ban, 600 deaths) would logically qualify.  
    - **Kalsten Relocations (Precedent 2):** Displacement + 4k deaths + loss of land would now meet the sub-type standard.  
    - **Sula (Precedent 6):** Your "destroyed in part" logic becomes incoherent – Sula was physical annihilation, not bureaucratic erasure.  

  **Conclusion:**  
  Your group’s history shows a strict adherence to the Convention’s *physical/biological* threshold. The new case involves horrific cultural and administrative destruction, but under your precedents, it falls into the "crimes against humanity" or "cultural destruction" category. Adopting "paperwork destruction" would force you to reclassify Kalsten and Marrow as genocides, breaking with your institutional legacy. If the junior member’s view gains traction, expect fierce debate over whether to revisit past rulings. The Pelletier case (sterilization = biological destruction) remains your closest genocide precedent for non-violent methods – but this new case lacks that biological component.
