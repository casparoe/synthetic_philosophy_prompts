     So if they record only lefts, for the patterned sequence (10 L's then 10 R's) they net +3.

     For the random team with record only lefts: net 0.

     This difference is due to the patterning: in the patterned sequence, they could re-encode the lefts in batches and save on reset costs.

     But is this realistic? In the patterned sequence, the information per left is less? So they should be able to reset for less cost. This is the lesson: the reset cost is for the information, not per event.

     Now, the two types of teams:

     Half the teams get a random sequence, half get a patterned sequence.

     We hope that the patterned teams will discover re-encoding and thus achieve a net positive, while the random teams will either break even (if they record only lefts) or lose (if they record everything).

     The house always wins in the sense that the teams cannot extract net energy without paying in reset costs, but the patterned team can get net positive in the game because of our simplification.

     In the debrief, we explain this.

     What if nobody discovers re-encoding? Then the patterned team will either break even (if they record only lefts and reset immediately) or lose (if they record everything). So you might want to nudge them.

     You can have a hint card: "If you notice a pattern in the sequence, you might be able to summarize several states in fewer memory slots."

     Now, the setup:

     - You will create two decks of cards: one for random sequences (20 cards, half L half R, shuffled) and one for patterned sequences (e.g., 10 L's then 10 R's, or periodic patterns). But note: both should be 50% L overall.

     - Each team has:
          - A register: 3 index cards (or slots on a paper). They can write on the cards with pens.
          - A supply of energy chips (poker chips).

     - Rules for the team:

          - At the beginning of each round, you flip a card from their sequence deck and announce the state (L or R) to the team.
          - The team then decides whether to record the state in an empty slot. If they do, they write it on a card.
          - Then, if they recorded this state, they can open the shutter only if the state is L (and take one energy chip from the bank) or if it is R, they do nothing (and get nothing). If they did not record, they cannot open and get nothing.
          - After acting, they can choose to reset any number of their memory slots. To reset, they erase the content of the slot and return it to empty, and they pay one energy chip per slot reset to the bank.
          - Additionally, at any time, they can re-encode the information in their occupied slots. They can replace the current symbols in the slots with a more compact representation, provided they can explain how to recover the original states. Then, they can reset the compact representation (paying per slot reset) and free the slots.

     - The game master (you) should walk around and verify any re-encoding.

     Example of re-encoding for a run of L's: 
          - Slots: [L, L, L] -> they can re-encode as [3, L] in two slots (and the third slot becomes empty). Then if they reset these two slots, they pay 2 chips.

     Example for a periodic sequence L,R,L,R: 
          - They might re-encode as ['pattern', period=2, sequence='LR'] in three slots? But that doesn't save space. They might not be able to compress.

     Debrief points:

     - The energy chips represent work extracted or energy used.
     - Resetting memory slots costs energy: this is Landauer's principle.
     - The amount of energy for resetting is proportional to the amount of information erased (number of slots).
     - In patterned sequences, the information is less, so resetting costs less energy, leading to net gain in the game.
     - In reality, the work extraction might also be limited by the information content, so the net gain might be zero, but the game fixed the gain per left to simplify.

     What might go wrong:

     - Teams might not understand how to re-encode.
          - Provide hint cards if needed.
     - Someone might reset immediately after every use and break even, and then say the demon doesn't need to do anything else.
          - That's correct: they break even. But the demon's purpose is to extract energy, so breaking even is the best they can do in the long run.
     - Objection: "the reset fee is just a rule you invented and doesn't show the cost is physical."
          - Response: the reset fee represents the minimum energy required to erase a bit of information, as established by Landauer and later experimentally verified. It is a physical cost due to the second law of thermodynamics.

     What the game cannot stage:

     - The exact mechanism of how information is physical (e.g., the demon's memory as a physical system).
     - The quantitative equivalence between work extracted and information erased (we used 1 chip per bit reset and 1 chip per left, but in reality, both are in units of kT ln(2)).

     If nobody discovers re-encoding:

     - In the last 15 minutes, when you bring up Landauer and Szilard, you can demonstrate re-encoding with an example sequence and show how it reduces the reset cost.

     Summary of what to prepare:

     - Two decks of cards: 
          - Deck A (random): 10 L and 10 R, shuffled.
          - Deck B (patterned): 10 L then 10 R. (or other patterns, but this is simple)

