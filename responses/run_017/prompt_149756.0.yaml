  But the user says in option 5: "if I'm the sort of person who'd work that out, isn't that exactly what Mick would see coming?" But Mick's prediction is fixed when he writes the card. If Mick thinks the user will shoot middle, he might write a random side, knowing it won't match. But since the user shoots middle, Mick is still wrong. So the outcome doesn't change. Mick loses regardless of what he wrote if the user shoots middle. So the user should shoot middle every time. 

