prompt: |-
  I need a specification rather than a position paper. A hospital ethics committee is rewriting its policy on the determination of death, and the policy has to govern two decisions: when life-sustaining treatment may be withdrawn, and when organ procurement may begin. Before I look at the candidate criteria, I want to know what we should be asking of one.

  Write the desiderata: what any adequate account of death has to deliver, with the case or consideration behind each. My starting list, which I would rather you correct and extend than adopt, is: (i) keep apart the definition of death, the criterion by which we recognize it, and the bedside tests, and say which of the three a committee is entitled to revise; (ii) say whether irreversible means cannot be reversed by any means or will not be reversed because we have decided not to try, and whether a declaration made today could be falsified by a later technology that restores what was lost; (iii) handle cases where the criteria conflict, such as a body with a destroyed brain but sustained circulation, or a patient whose circulation is deliberately arrested and later restored, by giving priority rules or by explaining why there is no fact of the matter; (iv) rule on patients in whom loss of the capacity for consciousness and loss of integration of the organism as a whole come apart, as in the permanently vegetative patient and the anencephalic infant; (v) say whether an organism whose integration is maintained by an external controller rather than by its own brain is alive or is maintained tissue; (vi) either respect the rule that procurement may not cause the donor's death or show why that rule should be given up; (vii) yield a determinate time of death, since the law needs one, even if the underlying biology is a process; (viii) be administrable at the bedside by clinicians using imperfect tests under time pressure, and defensible to families.

  For each requirement, state the consideration behind it and whether it is non-negotiable or a preference of one camp. Flag any pair you expect to be jointly unsatisfiable — that is the part I most want to see. Name the single requirement that does the most work in excluding candidate accounts. Then, briefly, score whole-brain, brainstem, higher-brain, and circulatory-respiratory criteria against the list.
reasoning: |-
  Hmm, the user is asking for a specification on the desiderata for defining death criteria in a hospital ethics committee policy rewrite. They need this to cover two key decisions: when to withdraw life-sustaining treatment and when to start organ procurement. They've provided their own starting list of points but want me to correct and extend it rather than just adopting it.

  Looking at their list, I notice several important aspects: they want clear distinctions between definition, criterion, and tests; clarity on irreversibility; conflict resolution methods; handling edge cases like PVS and anencephaly; addressing external maintenance systems; organ procurement ethics; establishing a time of death; and practical considerations for clinicians. These are all valid concerns in medical ethics.

  I should organize this systematically. The user specifically wants me to identify any potentially conflicting desiderata - that's crucial because some requirements might pull in opposite directions. For example, biological accuracy versus administrative practicality often conflict in medical contexts. The irreversibility definition also creates tension between theoretical possibility and clinical reality.

  For structure, I'll categorize the desiderata as either non-negotiable (essential for any coherent policy) or contested (where ethical positions differ). Non-negotiables would include conceptual clarity, avoiding killing through procurement, and practical applicability. Contested areas would include how to handle integration versus consciousness conflicts, and the interpretation of irreversibility.

  The irreversibility question (#2) seems particularly fundamental - it could exclude certain criteria depending on how it's defined. A circulatory criterion might fail if we demand absolute irreversibility, while neurological criteria might satisfy it better.

  I'll also need to address how different criteria perform against these standards. The whole-brain criterion handles organismal integration well but struggles with consciousness-focused cases. Brainstem-only approaches might work in some jurisdictions but have consciousness conflict issues. Higher-brain criteria are philosophically clean for consciousness but messy biologically. Circulatory criteria are practical but vulnerable to resuscitation technology.

  The user is clearly deeply versed in this field - their list shows sophisticated understanding of the philosophical and practical tensions. They're probably wrestling with how to balance theoretical purity with clinical reality in their committee. My response should honor that complexity while providing clear guidance.
answer: |-
  Here is a refined, extended, and analyzed set of desiderata for an adequate account of death, structured for a hospital ethics committee policy specification, incorporating your points and adding critical ones. Non-negotiable requirements are marked **(NN)**; contested preferences are noted.

  ### Desiderata for an Adequate Account of Death

  1.  **Conceptual Clarity & Hierarchy:** *Distinguish and relate the definition of death, the criterion for death, and the bedside tests.*
      *   **Consideration:** Prevents conceptual confusion, ensures tests validly operationalize the criterion, which must align with the definition. The committee can revise the *criterion* and *tests* based on evolving science/standards, but revising the *definition* (e.g., "permanent cessation of organismal functioning as a whole") requires broader societal/legal consensus, as it's foundational. **(NN)**
      *   **Type:** Primarily NN (structure), but scope of revision is context-dependent.

  2.  **Operational Irreversibility:** *Specify the meaning of "irreversible" in the criterion (cannot be reversed by current technology & standard practice vs. cannot be reversed *in principle* by any future technology). Address whether a declaration based on current irreversibility could be falsified by future advances.*
      *   **Consideration:** Core to the concept of death. A declaration must be definitive *now*. "Irreversible" must mean *cannot* be reversed *by any means available now or reasonably foreseeable in the immediate context*, not *will not* be reversed due to a decision. A declaration based on current irreversibility should not be considered "wrong" if future tech *could* have revived the person *had it been available then*; death is declared based on current capabilities. **(NN for requiring current/practical irreversibility; Contested on the "in principle" vs. "current" interpretation).**
      *   **Type:** NN (Requires a clear, operational definition), but the *interpretation* of irreversibility is highly contested.

  3.  **Conflict Resolution:** *Provide explicit, principled guidance for resolving conflicts between criteria (e.g., sustained circulation without brain function, circulatory arrest deliberately induced and reversed).*
      *   **Consideration:** Real-world cases (e.g., "Beating-Heart Cadavers," Controlled DCD) create ambiguity. Policy must dictate whether one criterion supersedes another (priority rules) or if specific combinations definitively indicate death despite apparent conflict. **(NN)**
      *   **Type:** NN.

  4.  **Consciousness vs. Integration:** *Address cases where the loss of the capacity for consciousness dissociates from the loss of somatic integration (e.g., Permanent Vegetative State - PVS) or where somatic integration is severely compromised without complete brain destruction (e.g., Anencephaly).*
      *   **Consideration:** PVS patients retain hypothalamic/brainstem functions (integration) but lack consciousness. Anencephalic infants lack higher brain structures (no capacity for consciousness) but may exhibit limited brainstem reflexes/integration briefly. Does death require loss of both, one, or the other? This is a core philosophical/biological divide. **(Contested - Defines the major camps: Higher-Brain vs. Whole-Brain/Integrationist)**
      *   **Type:** Contested Preference (Deeply divides neurological criteria camps).

  5.  **External Control & Integration:** *Determine the status of an organism whose somatic integration is maintained solely by external artificial support (e.g., ventilator, ECMO) after the loss of endogenous capacity for integration (e.g., total brain failure).*
      *   **Consideration:** Is this a living organism being technologically supported, or merely perfused tissue lacking the organism's essential unity? Crucial for defining when "life-sustaining" treatment is actually sustaining *life* versus *cellular activity* in a dead organism. **(NN for requiring a clear stance; Contested interpretation)**
      *   **Type:** NN (Requires a clear answer), but the *interpretation* is contested.

  6.  **Organ Procurement Ethics:** *Either strictly adhere to the Dead Donor Rule (DDR - procurement must not cause death) or provide a rigorous ethical justification for abandoning it.*
      *   **Consideration:** The DDR is a foundational principle in transplant ethics and law. Violating it risks public trust and legal sanction. Any policy must explicitly confront this, either by ensuring death declaration precedes procurement or by arguing why procuring vital organs from living but imminently dying/donating patients is ethically permissible. **(NN - Must explicitly address the DDR)**
      *   **Type:** NN.

  7.  **Determinate Time of Death:** *Provide a method for assigning a specific time of death, even if the underlying biological process is gradual.*
      *   **Consideration:** Legal requirements (wills, inheritance, insurance, criminal law) and administrative processes (death certificates, stopping treatment, starting procurement) necessitate a specific time. The criterion/tests must allow a point (or very narrow window) to be identified based on fulfilling the criterion. **(NN for practicality/law)**
      *   **Type:** NN (Operational Requirement).

  8.  **Clinical Feasibility & Defensibility:** *Be administrable at the bedside by clinicians using available, imperfect tests under time constraints (especially for DCD). Yield declarations that are defensible to families based on clear rationale and observable facts.*
      *   **Consideration:** Policy must work in real hospitals. Onerous, highly specialized, or extremely time-consuming tests are impractical. Ambiguous results or criteria requiring deep philosophical justification at the bedside undermine trust and create conflict. Transparency is key for family acceptance. **(NN for implementation)**
      *   **Type:** NN (Operational Requirement).

  9.  **Biological Foundation:** *Align with the best scientific understanding of organismal death as the permanent loss of function of the organism as a whole.*
      *   **Consideration:** The definition must have a coherent biological basis, not just be a social convenience. It should explain *why* the cessation of the chosen functions constitutes the death of the *organism*. **(NN for coherence)**
      *   **Type:** NN (Conceptual Foundation).

  10. **Consistency:** *Apply the same concept and criterion of death universally for both treatment withdrawal and organ procurement decisions.*
      *   **Consideration:** Using one standard for "dead enough to withdraw treatment" and another for "dead enough to procure organs" is ethically dubious, undermines trust, and creates legal vulnerability. Death is a unitary biological state. **(NN for ethical/logical coherence)**
      *   **Type:** NN.

  **Key Conflicts (Jointly Unsatisfiable Pairs):**

  *   **#4 (Consciousness vs. Integration) & #9 (Biological Foundation):** A "Higher-Brain" criterion prioritizing consciousness aligns poorly with the biological concept of organismal death (integration), which persists in PVS. A strict "Integrationist" view struggles to explain why an anencephalic infant isn't biologically "alive" despite lacking consciousness.
  *   **#2 (Irreversibility - "in principle") & #7/#8 (Determinate Time/Feasibility):** Insisting death only occurs if loss is irreversible *in principle* (by any future tech) makes declaring death impossible (we can't know the future) and is clinically unworkable. Practical irreversibility is essential for #7 and #8, but philosophically less "pure".
  *   **#6 (DDR) & Strict Biological Interpretation of #5:** If an organism on maximal support after total brain failure is deemed *biologically alive* (just externally integrated), then procuring organs violates the DDR. Only if it's deemed *dead* (#5) can procurement proceed without DDR violation. Adherence to DDR often hinges on the interpretation of #5.

  **The Most Workhorse Requirement:**

  *   **#2 (Operational Irreversibility)** does the most work in excluding candidate accounts. How "irreversible" is defined directly impacts the validity of circulatory criteria (vulnerable to ECMO/advanced CPR), the confidence in neurological criteria tests, and the fundamental finality of the declaration. A strict "in principle" irreversibility arguably invalidates *all* current criteria.

  **Scoring Candidate Criteria:**

  *   **Whole-Brain (Cessation of all functions of entire brain, including brainstem):**
      *   **Strengths:** Strong on #5 (Brain is controller, loss = dead organism), #9 (Aligns with integration), #6 (Adheres to DDR if death declared first), #4 (Consciousness & integration lost together *by definition*), #10 (Universal).
      *   **Weaknesses:** #8 (Tests are complex, time-consuming, prone to false positives in some contexts), #3 (Conflict rare, but theoretically possible), #2 (Irreversibility relies on clinical judgment/tests, vulnerable to future tech critiques), #7 (Time can be pinpointed after tests).
  *   **Brainstem (Cessation of all brainstem functions):**
      *   **Strengths:** Simpler tests than whole-brain (#8), strong on #5 & #9 (Brainstem as critical integrator), #6 & #10, #7.
      *   **Weaknesses:** #4 (Formally requires loss of consciousness/integration together, but conceptually prioritizes integration; PVS patients *retain* brainstem function), #1 (Definition must clearly state brainstem death = organismal death), #2 (Similar to whole-brain).
  *   **Higher-Brain (Loss of capacity for consciousness/sentience):**
      *   **Strengths:** Directly addresses #4 (PVS/anencephaly are "dead"), #1 (Conceptually clear definition), #7 (Time potentially based on event causing loss), #6 & #10 (If defined as death).
      *   **Weaknesses:** **Fails #5 & #9:** Body with functioning brainstem/hypothalamus is biologically integrated and alive as an organism. **Fails #6:** Procurement from a PVS patient *causes* death if they are still biologically alive. #8 (No reliable, immediate bedside test for permanent loss of consciousness; diagnosis of PVS takes time/observation).
  *   **Circulatory-Respiratory (Cessation of circulatory/respiratory functions):**
      *   **Strengths:** #7 (Clear time - cessation), #8 (Simple observation), #1 (Conceptually simple), #9 (Historically aligned), #5 (Loss leads rapidly to integration failure).
      *   **Weaknesses:** #2 (Highly vulnerable - CPR/ECMO can reverse), #3 (Conflict with neurological function in "beating-heart" donors - requires neurological criterion), #6 (Requires waiting for irreversibility *before* procurement in DCD, creating time pressure), #4 (Doesn't directly address PVS/anencephaly - they are alive by this criterion until circulation stops).

  This specification provides a rigorous framework for your committee to evaluate proposed criteria and craft a policy that is conceptually sound, ethically defensible, legally compliant, and clinically practical. The conflicts highlighted, especially around irreversibility and consciousness/integration, are where the deepest ethical deliberation will be required.
