  ### Step 5: Application to Your Brother's Case
  **Case description**: A cortex with local circuits intact but long-range connections degraded. Stimulating one region produces vigorous local responses but abnormal propagation. This mirrors hypoxic injury, where global integration is impaired.  

  **Analysis per candidate**:  
  - **Candidate 1 (Actual, Differentiated Integration)**:  
    - **Verdict**: Likely fragmented experience. Local regions may form "islands" of consciousness if they have actual, differentiated constraints (e.g., via intact local feedback). The largest whole might be smaller (e.g., a single region), so the subject could be multiple or diminished.  
    - **Degree**: Reduced, as constraints are less integrated globally.  
    - **Discriminating measurement**: EEG or fMRI to assess functional connectivity. High gamma-band coherence *within* regions but low coherence *between* regions would support fragmented experience. A low "integration index" (e.g., weighted mutual information) quantifies reduction.  
    - **Clause doing work**: "Differentiated" and "largest whole." Without differentiation, local activity might not count; without maximality, we couldn't identify subjects. Stipulation? Differentiation is argued (from Case 8), but maximality is assumed.  

  - **Candidate 2 (Causal-Architectural Integration)**:  
    - **Verdict**: If local architecture supports consciousness (e.g., thalamocortical loops intact), there might be experience, but degraded. If long-range degradation severs key feedback, experience could be minimal.  
    - **Degree**: Reduced, depending on architectural integrity.  
    - **Discriminating measurement**: Structural MRI to map connectivity, combined with TMS-EEG to test if stimuli evoke integrated responses. Intact local architecture with impaired global feedback suggests reduced experience.  
    - **Clause doing work**: "Causal architecture capable of supporting conscious states." This is largely stipulative (based on neuroscience consensus) and may not help if architecture is partially intact.  

  - **Candidate 3 (Dynamic Information Integration)**:  
    - **Verdict**: Experience is present but diminished and possibly fragmented. Information integration is high locally but low globally.  
    - **Degree**: Reduced proportional to integration loss.  
    - **Discriminating measurement**: Perturbational Complexity Index (PCI) from TMS-EEG, which quantifies information integration. Low PCI indicates impaired consciousness.  
    - **Clause doing work**: "Integrates information over time" – argued from Cases 6 and 8. Less stipulative than Candidate 2.  

  **Overall for your brother**:  
  - All candidates agree experience is reduced or fragmented due to degraded integration.  
  - **Key measurement**: PCI or similar integration metrics (e.g., Lempel-Ziv complexity in EEG) can discriminate between candidates. For example:  
    - High local integration with low global supports Candidates 1 and 3 (fragmented subjects).  
    - Low integration everywhere supports Candidate 2 (no/minimal experience).  
  - **Honest limitations**: No candidate cleanly predicts "how much" experience exists—only relative reduction. In severe cases, the line between "fragmented" and "none" is blurry (as in your uncertainty for Case 10). This reflects the hard problem: we infer experience from correlates, not first-hand access.  

