  ### Step 4: Implications for Degree of Consciousness
  Each candidate allows for degrees, but the coherence of comparisons depends on how "extent" is defined.  

  - **Candidate 1 (Actual, Differentiated Integration)**:  
    - Degrees are coherent. Extent scales with the richness of actual constraints (e.g., number of discriminable states).  
    - Human vs. mouse: More in human, due to greater differentiation (e.g., cortex supports more states).  
    - Mouse vs. cerebellum: More in mouse, as cerebellum has simpler constraints.  
    - Comparisons are well-defined if we measure differentiation (e.g., entropy of system states) and integration (e.g., mutual information between parts).  

  - **Candidate 2 (Causal-Architectural Integration)**:  
    - Degrees are coherent only within consciousness-supporting architectures. Extent scales with functional richness of the architecture (e.g., feedback depth).  
    - Human vs. mouse: More in human (more complex architecture).  
    - Mouse vs. cerebellum: Mouse has some experience; cerebellum has none (lacking architecture).  
    - Comparisons are well-defined if we can quantify architectural "capability" (e.g., density of feedback loops), but this risks circularity.  

  - **Candidate 3 (Dynamic Information Integration)**:  
    - Degrees are coherent and quantifiable. Extent is proportional to information integration (e.g., how much uncertainty is reduced by the whole vs. parts).  
    - Human vs. mouse: More in human (higher integration capacity).  
    - Mouse vs. cerebellum: More in mouse; cerebellum has near-zero integration.  
    - Comparisons are well-defined mathematically (e.g., using Φ-like measures), but operationalizing it is challenging.  

  **Key point**: All candidates make comparisons coherent by tying extent to measurable properties (differentiation, architecture, information). Without such grounding, degrees are merely verbal.  

