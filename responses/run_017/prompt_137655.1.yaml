  Hmm, the user is a graduate TA marking an exam on Susan Wolf's "Moral Saints" paper. They've shared a student's answer and want my independent evaluation before finalizing grades. The context is interesting - they're personally grappling with a real-life "moral saint" in their housing co-op, which inspired the exam question about "divided sainthood."

  Looking at the student's answer: In part (a), they reconstruct Wolf's argument as essentially about demandingness - that moral sainthood leaves no room for non-moral excellences and personal projects. They then equate this to the over-demandingness objection against consequentialism and connect it to Williams' integrity objection. This is problematic because Wolf explicitly distinguishes her position from demandingness objections. Her core concern isn't just the weight of demands but how moral priorities crowd out other valuable aspects of life. The student misses Wolf's key distinction between quantitative demandingness and qualitative impoverishment.

  In part (b), the student argues that divided sainthood solves Wolf's worry by concentrating costs on one volunteer while preserving non-moral values at community level. They claim Wolf's argument only applies to demanded sacrifices, not voluntary ones. But this overlooks Wolf's deeper point that moral sainthood is objectionable as a life ideal regardless of voluntariness. The student also misses how the arrangement might corrupt the beneficiaries' relationship to morality.

  The answer gets some basics right - identifying that saints prioritize morality above all else, and that Wolf values non-moral excellences. But the misinterpretations are significant. The demandingness conflation in part (a) undermines their entire framework, and their treatment of voluntariness in part (b) ignores Wolf's structural critique.

  For grading: Based on the rubric, I'd allocate 3/8 for part (a) (for basic accuracy but missing core distinctions), 4/7 for part (b) (for engaging the scenario but flawed application), and 2/5 for quality/objection handling. Total 9/20 - below passing if that's the threshold. 

  I should note where phrasing is merely loose versus substantively wrong, and suggest what's needed to earn higher marks - particularly clarifying Wolf's non-demandingness critique and addressing how divided sainthood affects the moral character of the community.
answer: |-
  Below is a comprehensive assessment of the student's answer based on your rubric and the content of Wolf's "Moral Saints." I've assigned a mark of **9/20** with detailed justifications. The answer demonstrates superficial engagement but misrepresents Wolf's core argument, leading to flawed applications. Key issues are italicized in comments for clarity.

  ---

  **Overall Mark: 9/20**  
  *(Breakdown: Part (a): 3/8 | Part (b): 4/7 | Quality/Verdict: 2/5)*  

  **Justification**:  
  The answer accurately identifies surface elements of Wolf’s view (e.g., moral saints prioritize morality, non-moral goods matter) but fundamentally misconstrues her argument as a "demandingness complaint." This error cascades into part (b), where the defense of divided sainthood ignores Wolf’s qualitative critique of sainthood as a life ideal. The response also fails to substantively engage objections and omits required distinctions (e.g., over-demandingness vs. Wolf’s objection). While the prose is clear, the reasoning collapses under Wolf’s actual framework.  

  ---

  ### Part (a) Comments (3/8)  
  **Rubric Criteria**: Reconstruction of Wolf’s argument (accuracy), distinction from over-demandingness objection.  

  #### What’s Correct/Loose:  
  - ✅ **Basic claim**: Correctly states Wolf’s view that moral saints prioritize morality above all else and that this excludes non-moral excellences.  
  - ⚠️ **Loose phrasing**: "Exhausted and probably miserable" oversimplifies Wolf. She argues saints *lack* non-moral virtues (e.g., humor, aesthetic passion), not just that they’re tired. Flag but don’t heavily penalize.  

  #### **Substantive Errors**:  
  - ❌ **Misattribution of "demandingness"**:  
    *Student*: "Her complaint is essentially a demandingness complaint."  
    *Problem*: Wolf explicitly **distinguishes** her view from demandingness objections (J. Phil p. 421). Her critique is **qualitative**: A life saturated with moral concerns lacks *pluralistic value* (beauty, humor, intellectual curiosity), even if it isn’t "exhausting." Demandingness is about *cost*; Wolf is about *character*.  
  - ❌ **Conflation with over-demandingness**:  
    *Student*: "Wolf makes the very same complaint about ordinary morality [as the consequentialist demandingness objection]."  
    *Problem*: Wolf argues demandingness objections fail because morality *could* be extremely demanding yet still correct (p. 420). Her objection is that moral sainthood is **unattractive as an ideal**, even if feasible. They are **different objections**.  
  - ❌ **Misreading Williams**:  
    *Student*: Links Wolf to Williams’ "integrity objection."  
    *Problem*: Williams’ objection targets consequentialism’s threat to personal projects. Wolf’s focus is broader: **any morality** that dominates life excludes non-moral virtues. Williams isn’t needed here.  

  **What Was Needed**:  
  - To earn full marks, the student must:  
    1. Specify what is "lost" (non-moral excellences like cultivating friendships for their own sake, developing talents).  
    2. Quote Wolf’s distinction: Saints have "no time or energy" for non-moral pursuits *because* morality "crowds out" other values (p. 421), not due to exhaustion.  
    3. Contrast: Over-demandingness = "morality asks too much"; Wolf = "a morally perfect life is not a *good human life*."  

  ---

  ### Part (b) Comments (4/7)  
  **Rubric Criteria**: Treatment of divided sainthood, Wolf-based objections, defense against an objection.  

  #### What’s Correct/Loose:  
  - ✅ **Beneficiaries’ perspective**: Correctly notes non-moral goods are preserved for non-saints.  
  - ✅ **Voluntariness**: Rightly states the saint "chooses" the role.  
  - ⚠️ **Loose phrasing**: "The value Wolf is worried about losing is preserved at the level of the community" – defensible but incomplete. Wolf cares about individual lives, not aggregate "community value."  

  #### **Substantive Errors**:  
  - ❌ **Misdiagnosis of Wolf’s worry**:  
    *Student*: "Wolf’s problem with the moral saint is a problem about the cost of sainthood to whoever has to live it."  
    *Problem*: Wolf’s worry is not about *cost* but about the **impoverished character** of the saint’s life (p. 422). Even a joyful, energetic saint lacks non-moral virtues. Divided sainthood doesn’t solve this.  
  - ❌ **Voluntariness as a fix**:  
    *Student*: "Wolf’s argument [...] has nothing to say about a case in which demands are freely taken on."  
    *Problem*: Wolf objects to sainthood as an ideal **regardless of voluntariness**. A volunteer saint’s life still lacks the "variety of commitments" that make a life well-lived (p. 419–420).  
  - ❌ **Ignoring objections to the arrangement**:  
    *Student*: Dismisses the saint’s life as "her own choice" and focuses only on demandingness.  
    *Problem*: Fails to engage Wolf’s core objection: The arrangement **endorses sainthood as an ideal**, which Wolf argues is *intrinsically unattractive*. Also misses:  
    - The **beneficiaries’ moral complacency** (if they outsource morality, are they living well?).  
    - **Structural harm**: The arrangement normalizes treating a person as a "moral tool."  

  **What Was Needed**:  
  - To earn higher marks, the student should:  
    1. Argue that divided sainthood *fails* because it still holds up sainthood as an ideal (contra Wolf’s pluralism).  
    2. Object that the beneficiaries’ lives may lack *moral depth* if they offload obligations.  
    3. Defend their position against, e.g., "Doesn’t this reduce the saint to a means?" or "Can a community flourish if morality is compartmentalized?"  

  ---

  ### Quality/Verdict (2/5)  
  **Rubric Criteria**: Position defended, at least one objection handled.  
  - ❌ **Verdict quality**: The position ("divided sainthood answers Wolf’s worry") is unsupported because it relies on the misreading of Wolf from part (a).  
  - ❌ **Objection handling**: Only addresses a "residual worry" about the saint’s choice, ignoring deeper Wolfian objections (e.g., the ideal’s unattractiveness). No substantive counterargument is developed.  
  - ✅ **Clarity**: The writing is coherent but cannot compensate for foundational errors.  

  ---

  ### Final Notes  
  - **Interpretive Assumption**: I assume Wolf’s argument is *not* about demandingness but about the *qualitative impoverishment* of a morally dominated life. If your teaching emphasized a "demandingness-adjacent" reading, adjust marks upward (max 12/20).  
  - **Rubric Alignment**: Deductions focus on misrepresentation (part a), shallow application (part b), and missing objection engagement (verdict).  
  - **Flag for Student**: Highlight the conflation of "demandingness" with Wolf’s critique as the critical error. Recommend reviewing pp. 420–422.  

  This answer shows the student read Wolf but didn’t grasp her central distinction. If this reflects a common trend, consider clarifying in future teaching that Wolf’s objection survives even if sainthood is joyful and chosen.
