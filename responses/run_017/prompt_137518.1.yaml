  3. **Regional Growth Anomaly (California School Comparison)**  
     - *Symmetry*: Asymmetric | *Unit*: Northwest Europe vs. Yangtze Delta | *Time/Gap*: Growth rates (1500–1800) | *Contrast*: Population | *Focus*: Difference-maker  
     - **Question**: Among advanced Eurasian regions (e.g., Yangtze Delta, Japan, India), why did only Northwest Europe experience accelerating growth in science and technology after 1500, and what factor (e.g., energy costs, institutional pluralism) distinguished it?  
     - *Diagnosis*: Uses regional units to avoid national essentialism.  

  4. **Hybrid Causal History (Institutional Process)**  
     - *Symmetry*: Symmetric | *Unit*: Northwest Europe vs. China | *Time/Gap*: Growth rates (1500–1800) | *Contrast*: Counterfactual pair | *Focus*: Causal history  
     - **Question**: How did distinct causal processes (e.g., scientific societies, patent systems) in Northwest Europe versus China lead to self-reinforcing growth in Europe but convergent stagnation in China by 1800?  
     - *Diagnosis*: Narrates institutional evolution in both regions.  

  5. **Global Transition Timing (Unified Divergence)**  
     - *Recast*: Not symmetric/asymmetric | *Unit*: N/A | *Time/Gap*: Timing (pre-1800) | *Contrast*: Global population | *Focus*: Causal history  
     - **Question**: Why did the transition to modern growth occur in Britain circa 1750–1800, and why did comparable societies (e.g., Song China, Abbasid Caliphate) not achieve earlier takeoffs, given that the transition closed off alternatives?  
     - *Diagnosis*: Rejects "divergence" for a singular global event.  

  6. **National Growth Difference (Classic Factor Model)**  
     - *Symmetry*: Asymmetric | *Unit*: Britain vs. China | *Time/Gap*: Growth rates (1500–1800) | *Contrast*: Counterfactual pair | *Focus*: Difference-maker  
     - **Question**: Why did Britain, but not China, experience sustained growth in science and industry after 1500, and what necessary condition (e.g., Atlantic trade, Enlightenment culture) was missing in China?  
     - *Diagnosis*: Classic "why Europe, not China" framing.  

  7. **Regional Levels in Context (Divergence as Anomaly)**  
     - *Symmetry*: Asymmetric | *Unit*: Northwest Europe vs. Yangtze Delta | *Time/Gap*: Levels (1800) | *Contrast*: Population | *Focus*: Causal history  
     - **Question**: Within a population of high-development regions (e.g., Yangtze Delta, Gujarat, Italy), what historical processes (e.g., resource exploitation, knowledge diffusion) caused Northwest Europe to achieve uniquely high industrial/scientific levels by 1800?  
     - *Diagnosis*: Explains Europe as an outlier among peers.  

  8. **Symmetric Regional Histories (Co-evolutionary Paths)**  
     - *Symmetry*: Symmetric | *Unit*: Northwest Europe vs. Yangtze Delta | *Time/Gap*: Growth rates (1500–1800) | *Contrast*: Counterfactual pair | *Focus*: Causal history  
     - **Question**: How did co-evolving factors (e.g., labor systems, market integration) generate growth in Northwest Europe but equilibrium traps in the Yangtze Delta during the early modern period?  
     - *Diagnosis*: Rejects "absence" for path-dependent lock-in.  

  9. **Hybrid Difference-Maker (Geopolitical Trigger)**  
     - *Symmetry*: Asymmetric | *Unit*: Northwest Europe vs. China | *Time/Gap*: Levels (1800) | *Contrast*: Population | *Focus*: Difference-maker  
     - **Question**: Among major Eurasian polities, what factor (e.g., naval competition, small-state rivalry) present in Northwest Europe but absent in China caused divergent industrial/scientific levels by 1800?  
     - *Diagnosis*: Hybrid units to stress geopolitical structure.  

  10. **Symmetric Growth Histories (Bin Wong-style Balance)**  
      - *Symmetry*: Symmetric | *Unit*: Britain vs. China | *Time/Gap*: Growth rates (1500–1800) | *Contrast*: Population | *Focus*: Causal history  
      - **Question**: Among early modern agrarian empires, why did Britain achieve accelerating growth in science and production while China maintained stable but non-accumulative development, and how did their distinct state-society relations shape these paths?  
      - *Diagnosis*: Uses population contrast to generalize.  

  ---

  ### **Notes on the Tree**  
  **Indistinguishable Leaves**:  
  - Leaf 3 (*Regional Growth Anomaly*) and Leaf 7 (*Regional Levels in Context*) are separable (growth vs. levels) but conflate if growth is seen as the path to levels.  
  - Leaf 1 (*Asymmetric National Levels*) and Leaf 6 (*National Growth Difference*) are distinct (levels vs. growth) but may merge if levels are proxies for prior growth.  

  **Unoccupied but Coherent Combination**:  
  - **Symmetric | Unit: Britain vs. China | Time/Gap: Growth rates | Contrast: Population | Focus: Difference-maker**  
    - *Question*: Among early modern states, what factor (e.g., patent laws) explains Britain’s growth acceleration and China’s non-acceleration between 1500–1800?  
    - *Diagnosis*: **Unattractive**—it demands quantifying a difference-maker across a broad population (e.g., Ottoman, Mughal states) when data is scarce.  

  **Best Capture of the Debate**:  
  **Leaf 3: Regional Growth Anomaly** (Why only Northwest Europe among advanced regions?). This leaf embodies the core methodological shift in the Great Divergence debate—away from Eurocentric "exceptionalism" toward comparative regional analysis (e.g., Pomeranz, Rosenthal-Wong)—while accommodating symmetric and asymmetric intuitions. It avoids national reification, uses a population contrast, and centers growth dynamics, making it the most cited framework in contemporary historiography.
