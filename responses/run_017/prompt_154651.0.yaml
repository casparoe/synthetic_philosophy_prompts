  - Generalization (necessary but insufficient) 
  - Robustness (broader property) 

  For the brain analogy: yes, this maps directly. The neuron-replacement debate hinges on whether substitutes realize the computational structure or merely simulate outputs. 

  Need to clarify that case 4's classification depends on the fallback mechanism—if it computes using spec's logic, it realizes; if it's just caching, it simulates. The buried-copy variant is clearly simulation since the original does all real work. 

  Finally, note that part of their disagreement is verbal (e.g., "estimating" vs "computing"), but the underlying distinction is real and consequential for reliability.
answer: |-
  Your team is grappling with **computational realization** versus **behavioral simulation**—a distinction with philosophical roots in functionalism and computer science, but not universally "settled." Below, I define the property, contrast it with related concepts, classify your cases (including boundaries), and address the brain analogy. The core tension is whether a system **implements the causal structure specified** or merely **reproduces observable outputs**.

  ### The Property: **Implementation Fidelity**
  - **Definition**: A system **realizes** a specification if and only if:  
    (a) It produces identical outputs to the spec for all inputs (actual and counterfactual), *and*  
    (b) Its internal causal transitions **mirror the dependencies** prescribed by the spec (e.g., intermediate steps map to spec steps, even if renamed).  
  - **Key differentiators**:  
    - **vs. Input/Output agreement**: I/O agreement is necessary but insufficient. Case (3) has perfect I/O agreement but fails (b).  
    - **vs. Robustness**: Robustness ensures correctness under perturbations (e.g., noise). Implementation fidelity requires *structural alignment* with the spec’s causal logic.  
    - **vs. Generalization**: Generalization predicts correctly on new data. Fidelity requires generalization *plus* adherence to the spec’s *reasoning pathway*.  
  - **Context-dependence**: It’s a property of the system **relative to a spec and a purpose**. A table (Case 3) "plays back answers" for certification but "computes" if the spec defines a lookup table.  

  ### Classification of Your Cases
  | Case | Description                  | Verdict                          | Why                                                                 |
  |------|------------------------------|----------------------------------|---------------------------------------------------------------------|
  | 1    | Clean reimplementation       | **Realization** (Uncontested)    | Mirrors spec’s causal dependencies (b), even with new intermediates. |
  | 2    | Learned approximator         | **Contested** (Boundary)         | **Yes** if it *implicitly* captures causal dependencies (e.g., via learned weights). **No** if it’s a "glorified interpolator" with no causal logic. Depends on *how* it generalizes. |
  | 3    | Precomputed table            | **Simulation** (Uncontested)     | No causal process: outputs are stored, not computed (fails b).      |
  | 4a   | Table + fallback calculator  | **Realization** (if fallback computes) | Fallback must use the spec’s *logic* (not ad hoc). If it does, the system *realizes* the spec dynamically. |
  | 4b   | Buried original copy         | **Simulation**                   | The original does the work; the wrapper is a switch. No novel implementation. |

  ### Why It’s Retrospective and Purpose-Dependent
  - **Retrospective**: You can’t verify fidelity for *all* counterfactual inputs. Passing stress tests (Case 2) supports but doesn’t prove realization. A failure on a novel input *reveals* it was simulation.  
  - **Purpose-dependent**:  
    - **Certification**: Requires I/O correctness + proof of structural alignment (e.g., formal verification).  
    - **Blame assignment**: Focuses on *why* a failure occurred. Did the system deviate from the spec’s causal logic?  
    - **Regulatory explanation**: Demands transparency into the implementation (hence tables often fail).  

  ### Relation to Philosophical Debates
  Your distinction sits **between** two established debates:  
  1. **Functionalism vs. Simulation** (e.g., "Does a perfect brain simulator feel pain?"):  
     - **Fit**: Your Case 3 mirrors "simulation" arguments (e.g., Searle’s Chinese Room).  
     - **Imperfection**: You care about *engineering specs*, not consciousness. Your "realization" is narrower.  
  2. **Multiple Realizability** (e.g., "Can any system realize a formal description?"):  
     - **Fit**: Case 1 aligns with multiple realizability (different substrates implement the same function).  
     - **Imperfection**: You reject systems that lack causal alignment (Case 3), unlike pure functionalism.  

  **Your unique carve-out**: Engineering "implementation fidelity" adds **causal transparency** and **counterfactual resilience** to functional equivalence.  

  ### The Brain Analogy: Real Distinction, Not Projection
  - **Neuron replacement**:  
    - If substitutes **realize each neuron’s causal role** (e.g., same input-output *and* internal state transitions), the system still thinks.  
    - If they **cache/output precomputed signals** (analogous to Case 3), it’s playback.  
  - **Why it’s real**: Brains likely rely on **dynamic causal processes** (e.g., feedback loops, plasticity). A playback device would fail under novel stimuli or damage, revealing it lacks realization.  

  ### Where Your Disagreement Is Verbal vs. Substantive
  - **Verbal**: Whether "estimating" (Case 2) counts as "computing." In engineering, both are computation—but "estimation" implies approximation without causal fidelity.  
  - **Substantive**: Whether structural alignment (b) is necessary. Your colleague in Case 2 likely demands **explicit** correspondence to spec intermediates, while you accept **implicit** alignment (e.g., a neural net learning latent variables that mirror spec steps).  

  ### Practical Advice
  - **Resolve boundary cases** (e.g., Case 4) by asking:  
    - Does the fallback **recreate the spec’s causal logic** (e.g., same equations)? → Realization.  
    - Is it a **generic safe behavior** (e.g., clamp to max)? → Simulation.  
  - **For certification**: Require formal proofs of equivalence for all inputs (using model checking or theorem proving).  
  - **For learned models**: Use explainable AI techniques to verify alignment of latent variables with spec intermediates.  

  **In short**: Your "implementation fidelity" is the wedge between *doing* and *mimicking*. It’s real, consequential for reliability, and distinct from pure I/O equivalence. The brain analogy holds because both turn on causal structure—not just behavior.
