answer: |-
  **INSTITUTE FOR PRIORITIES IN SUFFERING REDUCTION**  
  **HUMAN SUBJECTS COMMITTEE**  
  **REF: HSC/23/0457/DR**  

  **Date:** 2023-10-27  
  **To:** Dr. A. Finch, Principal Investigator, Department of Applied Neuro-Ethics  
  **From:** Dr. E. Vance, Chair, Human Subjects Committee  
  **Subject:** Determination Regarding Protocol IPSR-DAN-0457: "Efficacy and Tolerability of Novel Analgesic Compound ZX-114 in Post-Operative Settings" & Related Submissions  

  Dear Dr. Finch,

  The Human Subjects Committee (HSC) has completed its review of the above-referenced protocol and three ancillary submissions (IPSR-DAN-0457a, IPSR-DAN-0457b, IPSR-DAN-0457c) under Standing Order 7.1 (Review of Interlinked Protocols). The Committee met on 2023-10-25 and reached the following determinations, applying the Institute’s Charter (Article III: Lexical Priority Framework) and relevant Guidance Notes (HSC-GN-1, HSC-GN-4).

  1.  **Regarding Protocol IPSR-DAN-0457 (Primary Analgesic Trial):**
      *   The Committee acknowledges the potential of Compound ZX-114 to significantly reduce post-operative pain rated at 4-6 on the Standard Clinical Pain Scale (SCPS) for an estimated 15,000 patients annually.
      *   The protocol design includes a placebo arm. HSC Biostatistical Assessment Unit analysis confirms a calculated probability of 1.2 x 10^-6 (approximately one in 833,333) that a single participant in the placebo arm could experience post-operative pain exceeding the established Lexical Threshold (LT) due to unforeseen surgical complications and placebo inefficacy. This pain is projected to persist for 45-60 minutes, exceeding the LT duration parameter.
      *   **The Committee resolved that:** Any non-zero probability of inducing Lexical Suffering (LS), defined as pain exceeding the LT in intensity and/or duration (Charter Art. III.2, HSC-GN-4 §2.1), renders a protocol inadmissible. The anticipated reduction of sub-threshold suffering (STS) for 15,000 individuals, however substantial, cannot offset the potential imposition of LS upon even one individual (Charter Art. III.4, Standing Order 12.8a: Non-Compensability of LS). The protocol is therefore **REFUSED**.
      *   The Committee notes that a revised protocol omitting any participant exposure to surgical procedures (e.g., pharmacokinetic studies only) would likely be approved via Expedited Review Track (Standing Order 5.3) within five (5) working days.

  2.  **Regarding Submission IPSR-DAN-0457a (Procedural Pain Assessment):**
      *   This submission sought pre-approval for the lumbar puncture procedure required in the (now refused) main protocol, rated by the Investigator as 7/10 on the SCPS.
      *   The HSC Pain Metrics Subcommittee recalculated the projected pain using the Institute's Internal Suffering Quantification Scale (ISQS), as mandated by HSC-GN-4 §3.1 for near-threshold assessments. The ISQS score was determined to be 690 (Threshold: 700). Duration was confirmed at 8-12 minutes, below the LT duration parameter.
      *   The alternative scale submitted by the Investigator (Revised McGill Hybrid Scale) was noted but deemed non-compliant with Standing Order 9.4 (Mandated Scales for Threshold Proximity). It was therefore set aside.
      *   **The Committee resolved that:** As the ISQS score (690) and duration fall demonstrably below the Lexical Threshold, the procedure is classified as Sub-Threshold Suffering (STS). The lumbar puncture procedure, as described, is **APPROVED** for potential use in future protocols involving STS only.

  3.  **Regarding Submission IPSR-DAN-0457b (Mass Sensory Testing):**
      *   This proposed study aims to establish baseline neural correlates of STS by applying calibrated thermal stimuli (rated ISQS 450, duration 2 seconds) to participants' forearms.
      *   The initial design proposed 12,000 participants each receiving two (2) stimuli.
      *   **The Committee resolved that:** Each individual stimulus falls below the Lexical Threshold (ISQS 450 < 700, duration 2s < min. duration LT) and constitutes STS. The suffering imposed by each stimulus is therefore compensable via the Standing Offset Schedule (HSC-SOS-1). The suffering per stimulus (0.45 SOS Units) is readily offset by the standard participation compensation package (including refreshments valued at 0.8 SOS Units, per SOS-1 Schedule A, Item 7b). The study, in principle, is **APPROVED**.
      *   However, the Committee raised concerns regarding the *cumulative potential* of two STS events in close temporal proximity (15-minute interval) within a single participant. While HSC-GN-4 §5.2 states STS events are non-additive *for threshold determination*, the potential for unforeseen affective summation warrants caution (Standing Order 14.2: Precaution in Repeated STS Exposure).
      *   **The Committee therefore resolved to amend the protocol:** Approval is contingent upon modifying the design to administer only one (1) stimulus per participant, requiring a total of 24,000 participants. This eliminates cumulative risk within individuals. The amended protocol (IPSR-DAN-0457b-AM1) is **CONDITIONALLY APPROVED**.

  4.  **Regarding Submission IPSR-DAN-0457c (Threshold Calibration Validation):**
      *   This proposed study seeks to validate a rapid diagnostic tool for impending LS events. Validation requires inducing a precisely controlled supra-threshold pain (ISQS 720, duration 25 seconds) in a single, fully informed, and consenting volunteer. The validated tool is projected to prevent approximately 28,000 instances of similar LS annually in clinical settings.
      *   **The Committee resolved that:** The deliberate induction of Lexical Suffering (LS), regardless of duration (if exceeding LT parameters), is categorically impermissible (Charter Art. III.3). The potential future prevention of 28,000 instances of LS cannot ethically offset the deliberate imposition of one instance of LS. This remains true even if the prevented instances were themselves narrowly supra-threshold (Charter Art. III.4: Non-Summation Across Threshold). The voluntary, informed consent of the participant, while ethically commendable in other contexts, does not constitute a valid offsetting factor within the Lexical Priority arithmetic (Standing Order 12.8b: Irrelevance of Consent to LS Imposition). The submission is therefore **REFUSED**.

  **Dissenting Minutes:**

  *   **Dr. P. Swift:** "The Committee's rigid application of an arbitrary threshold introduces profound inefficiencies. The vast net reduction in suffering achievable through the analgesic trial (Ref 1) and the calibration study (Ref 4) outweighs the miniscule or singular harms incurred, viewed through the lens of total experiential welfare. Thresholds are philosophically untenable; suffering and relief exist on a continuum best managed by summation and aggregation." (Classical Hedonic Utilitarian Perspective, Standing Order 20.1d)
  *   **Dr. L. Graves:** "The Committee's reliance on the Offset Schedule (Ref 3) and its tolerance for mass STS exposure betrays the core imperative of suffering reduction. Compensating pain with trivial pleasures is morally grotesque. The threshold, set far too high, legitimizes vast quantities of unnecessary suffering. True priority requires minimizing *all* suffering, relentlessly, without diversionary arithmetic. This threshold is a concession to comfort, not a commitment to abolition." (Purely Suffering-Focused Perspective, Standing Order 20.1e)

  **Conclusion:** The HSC reaffirms its commitment to the Lexical Priority Framework as the foundational ethic of the Institute for Priorities in Suffering Reduction. All determinations are made in strict accordance with the Institute Charter and established Standing Orders. Appeal may be lodged with the Institute Ethics Review Board within 14 days per Standing Order 18.3.

  Sincerely,

  Dr. Elara Vance  
  Chair, Human Subjects Committee  
  Institute for Priorities in Suffering Reduction

  ---

  **APPENDIX: GUIDANCE NOTE 4 (HSC-GN-4)**  
  **Determining Whether a Procedure Is Sub-Threshold**

  1.  **Purpose:** This Note provides procedural guidance for classifying anticipated suffering as Sub-Threshold Suffering (STS) or Lexical Suffering (LS) under the Institute Charter (Article III).
  2.  **Lexical Suffering (LS) Definition:** Suffering constitutes LS if:
      *   2.1. Its *Intensity* meets or exceeds the Lexical Threshold (LT) Intensity Parameter (700 on the ISQS); OR
      *   2.2. Its *Duration* meets or exceeds the LT Duration Parameter (15 minutes for continuous stimulus, 30 minutes for intermittent/recurring distress with <5min relief intervals); OR
      *   2.3. It is reasonably foreseeable that the suffering could trigger cascading effects (e.g., severe trauma, lasting phobia) intrinsically linked to the LS state, even if the primary stimulus duration is shorter (Standing Order 12.5).
  3.  **Primary Scale for Intensity Assessment:**
      *   3.1. The Internal Suffering Quantification Scale (ISQS) is the sole mandatory instrument for procedures where anticipated suffering is likely to exceed ISQS 650 or where SCPS/NRS scores indicate ≥7/10.
      *   3.2. ISQS scores are determined by the HSC Pain Metrics Subcommittee using calibrated reference scenarios (§7).
      *   3.3. Alternative scales submitted by Investigators may be noted but hold no determinative weight for LT proximity assessments (Standing Order 9.4).
  4.  **Sub-Threshold Suffering (STS) Classification:** Suffering is classified as STS ONLY if:
      *   4.1. Intensity is confirmed below 700 ISQS; AND
      *   4.2. Duration is confirmed below the applicable LT Duration Parameter; AND
      *   4.3. No cascading LS effects are reasonably foreseeable.
  5.  **Aggregation and Cumulation:**
      *   5.1. Multiple STS events *cannot be aggregated* to reach or exceed the LT. Each event is assessed individually for STS/LS status.
      *   5.2. STS events *do not sum* for threshold determination. Suffering rated ISQS 400 twice in one individual remains two instances of STS; it does not become ISQS 800.
      *   5.3. However, protocols involving repeated STS exposure within short timeframes (<24 hours) require heightened scrutiny for potential protocol amendment to minimize per-individual exposure frequency (Standing Order 14.2, see Ref 3 determination).
  6.  **Commensurability and Offset:**
      *   6.1. ONLY STS is commensurable with units of pleasure or relief according to the Standing Offset Schedule (HSC-SOS-1).
      *   6.2. LS is INCOMMENSURABLE and NON-OFFSETTABLE. No quantity of pleasure, relief from STS, or prevention of future suffering (STS or LS) can ethically offset the deliberate imposition of LS (Charter Art. III.4).
  7.  **Reference Scenarios (ISQS Calibration Examples):**
      *   700 LT: Standard severe acute renal colic (first 15 minutes).
      *   690: Lumbar puncture (experienced subject, optimal technique).
      *   500: Significant dental drilling (no anaesthetic).
      *   450: Standard 2-second 49°C thermal stimulus.
      *   300: Vigorous intramuscular vaccination.
      *   150: Mild hunger pang (1 hour post-missed meal).
      *   50: Mild boredom (listening to non-preferred music genre for 10 minutes).
      *   5: Minor inconvenience (buttoning shirt with slightly stiff button).
      *(Note: ISQS scores are absolute and not transferable to other scales. Subjectivity bands are accounted for in Subcommittee modelling.)*
