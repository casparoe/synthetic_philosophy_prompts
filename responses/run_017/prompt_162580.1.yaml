prompt: |-
  You are a philosopher of social science who also reads applied econometrics for a living — the kind of person development economists ring up before they let a causal verb into an abstract. Before you write anything, spend some time brainstorming privately about what makes causal inference from history structurally different from causal inference with experiments: the small number of independent units, the fact that the treatment was not assigned by anyone, the way one country's institutions are another country's geography, and the way a mechanism can be true without the study in front of you being able to show it. Then set the brainstorming aside and give me something usable.

  I write a column for a magazine that covers science and ideas, and about twice a month I am handed a new study about why some nations are rich and others are poor. They arrive as press releases and PDFs in three recurring flavours: institutionalist (rules that constrain expropriation, secure property, or bind the ruler), geographic (disease burden, crop potential, soils, navigable water, latitude), and cultural (trust, thrift, patience, work norms, religious inheritance). I have roughly fifteen minutes, no access to the authors' data, at most a regression table and a robustness section I can eyeball but not re-run, and an editor who wants a headline sentence. What I need from you is a decision procedure I can actually run in that window, on that evidence, repeatedly: the questions in the order I should ask them, what counts as a sufficient answer to each, the point at which the procedure stops and tells me to write the associational or conditional sentence instead of the causal one, and the point at which it stops and hands the question to me as a matter of judgment rather than fact. It must work for a reader who can interpret a coefficient but cannot replicate it, and it should be explicit about which steps are real tests and which are judgment calls dressed up as tests.

  Two things I want you to engage with rather than merely accommodate. First, I have a private heuristic I have been using and half-trust, and I would like you to keep it, sharpen it, or replace it with something better and tell me which you did and why: I call it the swap test, and it says that if I can take the mechanism the authors propose and substitute a mechanism from a different family — read the institutionalist study as a geography study, read the culture study as an institutions study — and the design, data, and identifying variation they have could not tell the two apart, then the study has only earned a claim about some persistent cause and my sentence should say so. Second, please run the finished procedure on three cases I actually face. Case one is the familiar cross-country regression over a hundred-plus countries, institutions scored by some index of security from expropriation, income per capita today as the outcome, historical variation used to make the identification story go through, and a press release that says institutions cause prosperity. Case two is narrower and stranger, the kind of thing that has started appearing and that I never know how to write up: a within-one-country study of districts on either side of a river that was the boundary of a medieval monastic land-tenure system six centuries ago, where the districts that inherited the communal side of the boundary are about a fifth richer today, the gap appears right at the river, and it does not appear at a placebo boundary forty kilometres away. Case three is the one I will not enjoy: my own favourite pending piece, a culture explanation built on survey measures of patience and trust plus a historical religious-border design, which I have already pitched as a two-thousand-word feature and which I very much want to write. Please run the procedure on it honestly and bluntly, and tell me what the design can and cannot carry even if that kills or badly shrinks my story. Close by saying plainly what the procedure cannot do — the questions it defers rather than answers, including what to do when the truth is that several mechanisms are real and mutually reinforcing and the interesting question was never which one but how they composed. I do not need references, citations, or a reading list; I need the reasoning, and I need it in a form I can keep beside me and run under deadline.
reasoning: |-
  We are designing a decision procedure for evaluating causal claims in historical development studies under severe time and data constraints. The procedure must account for key structural differences between historical inference and experimental inference: few independent units, non-random assignment, overlapping mechanisms, and the difficulty of proving mechanisms. The procedure will incorporate the user's "swap test" heuristic and provide explicit steps that distinguish tests from judgment calls.

  The procedure has 9 steps, organized into three phases: 
  Phase 1: Assess the core causal claim (steps 1-4)
  Phase 2: Test for alternative explanations (steps 5-7)
  Phase 3: Evaluate mechanisms and write (steps 8-9)

  At any step, if the answer is unsatisfactory, the procedure may stop and recommend writing a conditional or associational sentence, or defer to judgment.

  **Step-by-Step Decision Procedure:**

  **Phase 1: Core Causal Claim**
  1. **What is the source of identifying variation?** 
     - *Test:* Look for a clear description of the historical event or variation that creates the "as-if" randomness. Check if the variation is exogenous to the outcome (e.g., a natural experiment, arbitrary border, random event).
     - *Sufficient answer:* The variation is pre-determined, not caused by the outcome or other confounders, and occurs before the treatment and outcome. If not, stop: write associational.
     - *Judgment call:* Assessing exogeneity requires historical knowledge; if unclear, proceed but note uncertainty.

  2. **Is the variation independent across units?**
     - *Test:* Check if the treatment assignment in one unit could affect others (e.g., spillovers, common shocks). 
     - *Sufficient answer:* The study acknowledges and accounts for spatial or temporal dependence (e.g., clustering, spatial econometrics). If not, stop: write associational with caution.
     - *Judgment call:* In history, true independence is rare; if the design is spatial (like borders), check for no spillovers across the boundary.

  3. **Does the design isolate a clean comparison?**
     - *Test:* Look for a sharp discontinuity (e.g., regression discontinuity) or a clear counterfactual (e.g., control group). For cross-country, check if the instrument (e.g., settler mortality) is strong and relevant.
     - *Sufficient answer:* For borders, a discontinuity plot with a clear jump; for cross-country, first-stage F-stat > 10. If weak, stop: write associational.
     - *Judgment call:* Eyeballing discontinuity plots; if fuzzy, the claim is weaker.

  4. **How persistent is the effect?**
     - *Test:* Check the temporal gap between treatment and outcome. Is there a theory of persistence? 
     - *Sufficient answer:* The study shows intermediate outcomes or mechanisms at various points in time. If the gap is centuries without intermediates, stop: write conditional (e.g., "if the effect persists, then...").
     - *Judgment call:* Long persistence is plausible for some factors (institutions) but not others (short-lived policies).

  **Phase 2: Alternative Explanations**
  5. **Run the Swap Test (user's heuristic):**
     - *Test:* Take the proposed mechanism (e.g., institutions) and swap it with an alternative from another family (e.g., geography). Ask: could the same design and data equally support the alternative? 
     - *Sufficient answer:* If the swapped mechanism is also consistent with the variation (e.g., the river boundary also divides soil types), then the study has only earned a claim about a "persistent historical cause" without specifying which. If it passes (i.e., cannot be swapped without loss), proceed; else, stop: write about persistent causes.
     - *Judgment call:* This step is entirely judgment. The swap test is a falsification exercise in your mind.

  6. **Check for omitted variables:**
     - *Test:* Look at the robustness section. Are there controls for other major families of explanations? (e.g., an institutions study controls for geography and culture). 
     - *Sufficient answer:* The study includes controls from rival families and the effect holds. If not, stop: write conditional (e.g., "after controlling for X, but unobserved Y might matter").
     - *Judgment call:* Deciding which variables are essential; use common rivals (geography, culture, institutions).

  7. **Test for pre-trends and balance:**
     - *Test:* Check if outcomes or covariates were similar before treatment. For borders, look at placebo boundaries or pre-period data.
     - *Sufficient answer:* Pre-treatment outcomes balanced; placebo boundaries show no effect. If imbalance, stop: write associational with caution.
     - *Judgment call:* Assessing whether imbalance is random or systematic.

  **Phase 3: Mechanisms and Writing**
  8. **Evaluate the mechanism:**
     - *Test:* Does the study provide direct evidence for the proposed mechanism (e.g., surveys for culture, laws for institutions) and show it is caused by the treatment? 
     - *Sufficient answer:* Mechanism is measured and shown to be affected by the treatment (e.g., the boundary affects institutions, which then affect income). If not, the causal claim about the mechanism is weak; write the outcome claim but note the mechanism is speculative.
     - *Judgment call:* Mechanisms are hard to prove; often deferred.

  9. **Decide the headline:**
     - If all steps passed: write a causal headline (e.g., "Medieval land tenure caused long-run prosperity").
     - If failed at 1-4: write associational (e.g., "Associated with").
     - If failed at 5-7: write conditional (e.g., "May cause, but alternatives exist").
     - If mechanism (step 8) failed: add "through unclear channels".
     - If judgment calls dominate: write with hedging and note competing explanations.

  **Procedure Limitations:**
  - Cannot handle multiple mutually reinforcing causes (complementarity).
  - Cannot adjudicate between equally plausible mechanisms without new data.
  - Defers deep historical context to the writer's judgment.
  - Does not solve the "many causes" problem; focuses on the one studied.

  **Applying the Procedure to Your Cases:**

  **Case 1: Cross-country institutions study (Acemoglu et al. style)**
  1. **Identifying variation:** Historical settler mortality as instrument for institutions. Exogenous? Arguably, but debated (geography might affect both). *Judgment: Controversial, but proceed cautiously.*
  2. **Independence:** Countries are not independent; common shocks (e.g., colonialism). Study clusters? If yes, okay. *If not, stop: associational.*
  3. **Clean comparison:** First-stage F-stat? If >10, okay. *If weak, stop.*
  4. **Persistence:** Gap of centuries. Are intermediates shown? Often not. *Stop: write conditional.*
  5. **Swap test:** Swap for geography. Could settler mortality affect development through disease burden directly? Yes. *Swap test fails: write "persistent historical causes".*
  6. **Omitted variables:** Controls for latitude, malaria? If yes, okay. *Otherwise, stop.*
  7. **Pre-trends:** Not usually checked in cross-country. *Problematic.*
  8. **Mechanism:** Institutions measured, but mechanism from mortality to institutions to income? *Weak without intermediates.*  
  *Verdict:* Due to swap test failure and persistence issues, headline: "Historical factors, possibly including institutions, are associated with modern prosperity."

  **Case 2: River boundary study (medieval land tenure)**
  1. **Identifying variation:** River as arbitrary boundary? Exogenous? If it's a natural feature not related to development, yes. *Good.*
  2. **Independence:** Check for spillovers. If districts are separate and no trade across river, okay. *Judgment: Probably okay.*
  3. **Clean comparison:** Discontinuity at river? Sharp jump in outcomes? Placebo boundary shows nothing? *If yes, good.*
  4. **Persistence:** Six centuries. Intermediates? Study might show 19th-century outcomes. *If not, conditional.*
  5. **Swap test:** Swap institutions for geography. Could the river divide soil quality? Study checks soil continuity? If yes, and placebo boundaries are similar, swap fails. *If soils differ, swap passes (problem). Here, if they control geography, swap test passes (supports institutions).*
  6. **Omitted variables:** Controlled for geography? Culture? *If yes, good.*
  7. **Pre-trends:** Pre-medieval data? Unlikely, but placebo boundaries help. *Acceptable.*
  8. **Mechanism:** Direct measure of institutions (e.g., land rights)? *If yes, strong; else weak.*  
  *Verdict:* If steps 5-7 pass, headline: "Medieval land-tenure institutions caused long-run prosperity in these districts."

  **Case 3: Your culture study (patience, trust, religious border)**
  1. **Identifying variation:** Religious border as exogenous? If the border is historical and arbitrary (e.g., Peace of Westphalia), good. *Check for non-arbitrary borders (e.g., along rivers).*
  2. **Independence:** No spillovers? If the border is porous, problem. *Judgment: Assume controlled.*
  3. **Clean comparison:** Discontinuity at border? Placebo? *If yes, good.*
  4. **Persistence:** How old is the border? Centuries? Intermediates? *If no intermediates, write conditional.*
  5. **Swap test:** Swap culture for institutions. Could the same religious border also divide institutions (e.g., state policies)? If the study doesn't control institutions, swap succeeds -> then write about "historical divide" not culture. *This is the critical step. To save the story, the study must control for institutions and geography and show culture remains.*
  6. **Omitted variables:** Controlled for institutions, geography? *If not, stop: conditional claim.*
  7. **Pre-trends:** Balance before the religious split? *If not, problem.*
  8. **Mechanism:** Surveys show trust/patience differ at border? And these cause prosperity? *If mechanism is shown, good; else, weak.*  
  *Verdict:* If swap test fails (i.e., no alternative), and controls are good: "Religious history shaped cultural traits that boosted prosperity." If swap test passes (alternatives exist), headline: "A historical religious divide continues to influence prosperity today, but the channel remains unclear."

  **Closing Note:** The procedure cannot resolve when multiple causes interact. In that case, your judgment must step in to explore composition. Also, it relies on the study's robustness checks; without them, the procedure may stop early. Use it as a filter, not a truth machine.
answer: |-
  Below is a decision procedure tailored to your constraints. It incorporates your "swap test" heuristic, sharpens it into a formal step, and structures it into a sequential checklist. The procedure has **8 core questions** to be asked in order, with explicit criteria for when to stop and downgrade a causal claim. It distinguishes between **tests** (based on observable evidence in the paper) and **judgment calls** (where you must rely on contextual reasoning). Steps are designed for speed: you can complete them in 15 minutes using only the abstract, regression tables, robustness checks, and design description.

  ---

  ### **The Decision Procedure: 8 Steps for Causal Headlines**
  **Phase 1: Validity of the Design (Tests)**  
  *Focus: Can this design support* any *causal claim?*

  1. **Is the identifying variation *exogenous* and *isolated*?**  
     - **Test:** Check if the source of variation (e.g., a border, historical event, or instrument) is plausibly unrelated to confounders.  
     - *Sufficient answer:* The paper shows balance in pre-treatment characteristics (e.g., soil quality near the border) or uses a natural experiment (e.g., arbitrary boundaries).  
     - **STOP if failed:** Write associational (e.g., "linked to," "associated with").  
     - *Example:* A river boundary study must show similar geography/economics on both sides *before* the treatment.

  2. **Is there a sharp *counterfactual*?**  
     - **Test:** Look for a clear comparison group (e.g., districts just inside/outside a border) or a discontinuity (e.g., a jump at a threshold).  
     - *Sufficient answer:* Regression tables show a large, significant coefficient for the treatment variable; robustness checks confirm it’s not driven by outliers.  
     - **STOP if failed:** Write conditional (e.g., "in contexts where [treatment] occurs, [outcome] follows").

  **Phase 2: Rival Explanations (Judgment Calls)**  
  *Focus: Is the proposed cause distinguishable from alternatives?*

  3. **Apply the *Swap Test* (your heuristic, formalized):**  
     - **Judgment call:** Mentally replace the authors' mechanism (e.g., "institutions") with one from a rival family (e.g., "soil quality" for geography or "work ethic" for culture). Ask: *Could the same design/data produce an identical result for the swapped mechanism?*  
     - *Sufficient answer:* No. The design must exploit variation *unique* to the proposed mechanism (e.g., a border that *only* affects institutions, not geography/culture).  
     - **STOP if failed:** Claim only "a persistent historical cause" (e.g., "Medieval boundaries shaped long-run prosperity, but the channel is unclear").  
     - *Why we sharpen it:* Your heuristic is sound but underspecified. We add: (1) Focus on whether the *identifying variation* is mechanism-specific, and (2) Use placebo tests (Step 4) to reinforce it.

  4. **Is there a *placebo* or *falsification* test?**  
     - **Test:** Check robustness for fake boundaries, pseudo-events, or irrelevant outcomes.  
     - *Sufficient answer:* Placebos (e.g., a boundary 40km away) show null effects; falsification tests (e.g., applying treatment to pre-period outcomes) fail.  
     - **STOP if failed:** Downgrade to "suggests" or "hints at" causality.  
     - *Judgment call:* Does the placebo truly rule out geography/culture? (e.g., a fake river boundary might not replicate soil micro-variation).

  **Phase 3: Persistence and Specificity (Mixed)**  
  *Focus: Did the cause *persist* and is the mechanism *credible*?*

  5. **Does the effect *decay* or *persist*?**  
     - **Test:** Look for intermediate outcomes (e.g., 19th-century wealth) or sensitivity to time lags.  
     - *Sufficient answer:* Effects hold across multiple periods; no decay when lags are adjusted.  
     - **STOP if failed:** Add temporal hedging (e.g., "with effects lasting centuries").

  6. **Is the mechanism *directly tested*?**  
     - **Test:** Check if the paper measures the mechanism (e.g., property rights indices for institutions) and links it to the outcome.  
     - *Sufficient answer:* A "mechanism regression" shows the treatment affects the mechanism, and the mechanism affects the outcome.  
     - **STOP if failed:** Claim "prosperity followed [cause]" not "[mechanism] caused prosperity."  
     - *Judgment call:* Is the mechanism plausible? (e.g., "patience" causing growth is murkier than "property rights").

  **Phase 4: Final Call (Judgment)**  
  *Focus: What can you responsibly assert?*

  7. **Are there *uncontrolled confounders*?**  
     - **Judgment call:** Could omitted variables (e.g., climate, migration) explain results?  
     - *Sufficient answer:* Rival factors are measured and controlled (e.g., latitude in institutional studies).  
     - **STOP if uncertain:** Use "after accounting for [controls]" or flag as "tentative."

  8. **Is the effect *homogeneous*?**  
     - **Judgment call:** Could the cause work differently elsewhere? (e.g., monastic tenure might rely on specific cultural contexts).  
     - *Sufficient answer:* Heterogeneity tests (e.g., subsamples) show consistent effects.  
     - **Final decision:** If all prior steps pass, write a causal headline. If not, use the downgraded language from earlier steps.

  ---

  ### **Applying the Procedure to Your Cases**
  **Case 1: Cross-Country Institutions Study**  
  - **Step 1 (Exogeneity):** Historical variation (e.g., settler mortality) may reflect geography. *Judgment: Likely failed.* → STOP: Write associational.  
  - **Step 2 (Counterfactual):** No true control group; 100+ countries aren’t independent units. *Test: Failed.* → Headline: "**Strong institutions correlate with prosperity, but causal claims remain debated due to unobserved geographic factors.**"  
  - *Why swap test isn’t needed:* Failed at Step 1. But if applied: Swapping "institutions" for "disease burden" fits the same data/design → confirms STOP.

  **Case 2: River Boundary (Monastic Tenure)**  
  - **Step 1 (Exogeneity):** Boundary arbitrary? Likely passed (river as "natural experiment").  
  - **Step 2 (Counterfactual):** Sharp discontinuity + placebo boundary → passed.  
  - **Step 3 (Swap Test):** Swap institutions for geography. Could soil quality differ at the river? If placebo shows no effect → swap *fails* (design is unique to tenure). *Judgment: Passed.*  
  - **Step 4 (Placebo):** Null effect 40km away → passed.  
  - **Step 5 (Persistence):** Six centuries with no intermediates? *Judgment: Hedge.*  
  - **Step 6 (Mechanism):** Measured? Unlikely → avoid "institutions caused."  
  - **Headline: "**Medieval land-tenure rules near river boundaries boosted long-run prosperity, though the precise channel remains unclear.**"  

  **Case 3: Your Culture Study (Trust/Patience + Religious Border)**  
  - **Step 1 (Exogeneity):** Religious borders may align with geography/institutions. *Test: Must show balance.* If not → STOP.  
  - **Step 2 (Counterfactual):** Discontinuity at border? Likely passed.  
  - **Step 3 (Swap Test):** Swap "culture" for "institutions." Could the same border divide property rights? If design can’t rule this out → swap *succeeds* → STOP: "persistent cause."  
  - **Step 4 (Placebo):** Critical. Null effect at fake borders? If yes → supports culture.  
  - **Step 5 (Persistence):** Centuries without intermediates → add hedging.  
  - **Step 6 (Mechanism):** Surveys measure trust? Passed. But does trust *cause* growth? Weak without mediation tests → hedge.  
  - **Verdict:** If swap test fails (you can't rule out institutions), headline: "**Religious borders predict prosperity, but whether culture or institutions drive this is unresolved.**" If swap test passes (your design *can* isolate culture): "**Historic religious borders fostered cultures of patience, lifting prosperity.**"  

  ---

  ### **What the Procedure Cannot Do**
  1. **Handle complementarities:** When geography, institutions, and culture *reinforce* each other (e.g., malaria eroding trust + institutions), the procedure flags rival mechanisms but can’t show how they compose. Defer to narrative: "How these forces interact is the real puzzle."  
  2. **Prove mechanisms definitively:** Historical data rarely supports "X caused Y through Z" without assumptions. The procedure limits mechanistic claims to what the design can test.  
  3. **Resolve deep identification flaws:** If the variation is endogenous (Step 1 failed), the procedure stops early. No statistical fix can rescue this.  
  4. **Replace context:** Judgment calls (Steps 3, 7, 8) require knowing, e.g., that monastic boundaries rarely follow soil lines. If you lack this, default to caution.  

  ---

  ### **Final Notes**
  - **Your swap test:** We kept and sharpened it. It now explicitly ties to the *identifying variation* (not just the mechanism) and uses placebos (Step 4) to reduce subjectivity.  
  - **Speed optimization:** Focus on Step 1 (exogeneity) and Step 3 (swap test). If either fails, causal claims are suspect.  
  - **When in doubt:** Use "suggests," "hints," or "persistent legacy of [event]." Reserve causal verbs ("caused," "boosted") only for Steps 1–4 passed + swap test failed.  
  - **Your culture piece:** Be ruthless. If the religious border *could* reflect institutions (e.g., via laws), the swap test fails, and your story shrinks to "history matters, channel unclear." That’s still compelling—but honest.  

  This procedure won’t make you popular with authors, but it will keep you honest. Under deadline, ask: *"Would this design look identical if the mechanism were swapped?"* If yes, causality stays in the abstract; if no, you’ve earned a verb.
