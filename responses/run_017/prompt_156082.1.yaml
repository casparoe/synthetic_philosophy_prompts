prompt: |-
  I spent most of my career in marine geophysics — magnetic anomaly surveys, largely off the Reykjanes Ridge — and since retiring I have been auditing the philosophy of science reading group at the university I used to work for. They have asked me to take one of their work-in-progress slots next month, and I would like to use it to defend a position on the problem of old evidence that I have been working out on my own, in my own vocabulary, without much knowledge of how the professionals argue about it. What I want from you is not a defence of the position but a Q&A preparation sheet: I know the room, I know roughly who will be in it, and I would rather walk in having already been beaten up on paper.

  The position, briefly. Old evidence — evidence you already had in hand when you first took a theory seriously — plainly does lend theories support: the advance of Mercury's perihelion is the shopworn example, and the one from my own field I would rather talk about is the symmetrical striping of magnetic anomalies either side of the mid-ocean ridge crests, which was mapped before anyone had the seafloor-spreading-plus-reversals explanation for it (I am hazier than I would like about the exact chronology of the surveys, and I would like to know now whether that is going to sink me). And yet the Bayesian machinery gives you nothing: if the evidence is already in your background knowledge, your probability for it is one, and conditioning on it cannot move your credence in the theory. My diagnosis is that two questions have been run together. There is a static question — how much support a piece of evidence gives a theory relative to a body of background belief — and there is a dynamic question — what ought to happen to your credence when you learn something. I want to answer the static one by evaluating the support against the belief state you were in *before* the evidence arrived rather than the one you are in now, which I have been calling the retrospective prior manoeuvre. And I want to answer the dynamic one by pointing out that in an old-evidence episode what is genuinely new to you is not the datum but the news that the theory would have led you to expect it: that it entails it, and entails it without having been bent to fit it. So the update goes on the derivation rather than on the datum, and the size of the boost should track how surprising you find it that the theory says that about the evidence — roughly, how improbable you would have said it was, before you had the theory in view, that it would turn out to entail the datum. I am aware, dimly, that these two answers may not always agree with one another, and I would like that worry sharpened rather than smoothed over.

  The room will be about a dozen people. There will be a senior philosopher of science who works on measures of confirmation and thinks in terms of the difference between the probability of the evidence given the theory and its probability given the background alone; he will want to know what fixes the earlier belief state I am appealing to, since it is counterfactual, partly lost, and selectable at will, and he will suspect I have simply relocated the arbitrariness of the prior into the choice of time slice. There will be a formal epistemologist who thinks exclusively in terms of credences and updating and who will probably say that a support relation that never touches credence is not confirmation at all, and who will press me hard on what my probability for the proposition that the theory entails the evidence is supposed to be and on what I take the relevant space of alternatives to be. There is one error-statistician in the group who thinks the whole Bayesian frame is the wrong tool and evidence is a matter of how severe a test a theory has survived; she will want to know whether my account can tell genuine support from post hoc accommodation, or whether the words *without having been bent to fit it* are doing all the real work. There is a historian of science who works on mid-century earth science and who will object that my *before* state is a historian's fiction, that in the cases I care about the evidence was assembled in the same breath as the theory, and that nobody in the field had any determinate prior about the striping at all. And there will be four or five graduate students, one of whom reliably asks the simple question that the rest of us have been circling.

  So: give me the seven or eight objections I should actually expect, ordered by how likely they are and how much damage they would do, each phrased the way that person would phrase it rather than the way I have phrased it — I have the mathematics for Bayes' theorem but not the jargon — each with a two-minute reply I could give standing up, a note on where that reply is soft, and a note on what I should simply concede at the outset and what I should refuse to give up. Tell me separately whether I should drop the ridge-anomaly example for something safer and what it would cost me if I do. And include, at the end, the one question I am privately hoping nobody asks.
reasoning: |-
  Hmm, the user is a retired marine geophysicist preparing for a philosophy of science presentation on the problem of old evidence. They want a Q&A prep sheet anticipating objections to their position. Let me analyze this carefully.

  First, the core of their position: They propose separating static support (retrospective evaluation against prior belief state) from dynamic updating (learning about theory-evidence entailment). For old evidence like magnetic striping data, they argue we should assess support against pre-evidence beliefs, while the actual update occurs when we discover the theory entails this evidence unexpectedly.

  Key concerns I need to address:
  - The formal epistemologist will challenge the counterfactual "prior belief state" as arbitrary and unanchored
  - The confirmation theorist will question whether this static support actually affects rational credence
  - The error-statistician will probe how this distinguishes genuine predictions from accommodations
  - The historian will dispute the existence of a clean "pre-evidence" state in actual scientific cases

  The ridge anomaly example is powerful professionally but historically messy - I should note the 1958-1963 timeline issues but advise keeping it for rhetorical impact. The Mercury perihelion backup is safer but less engaging for this audience. 

  For objections, I'll prioritize:
  1. The counterfactual prior problem (most damaging)
  2. Credence-impact objection (core to Bayesian concerns)
  3. Distinction without difference challenge (from error-statistics)
  4. Historical unreality (from science historian)
  5. Measurement arbitrariness 
  6. Double-counting risk
  7. Prediction vs accommodation
  8. What about disconfirmation?

  The "nightmare question" would be how this handles cases where theories are constructed specifically to fit old evidence - their "not bent to fit" clause doing heavy lifting. I'll suggest conceding this requires additional criteria while holding that entailment discovery still provides some boost.

  For replies, I'll keep them to 2-minute stand-up length with clear vulnerabilities flagged. Crucially, I'll advise holding firm on the core separation of static/dynamic questions while conceding operational difficulties in defining the retrospective prior.
answer: |-
  Here’s your Q&A preparation sheet, structured for maximum readiness. I’ve focused on the objections you’re likely to face, ordered by **damage potential** (high to moderate) and **likelihood** based on your room description. Each objection is phrased as your critics would, followed by your 2-minute reply, its soft spots, and strategic concessions/holds.

  ---

  ### **Objection 1: The Counterfactual Prior Problem**  
  *(From the senior confirmation theorist)*  
  "Your 'retrospective prior' is a fiction. How do we rigorously specify the belief state *before* the evidence existed? Scientists rarely have precise priors about specific data like magnetic striping. This just relocates Bayesian subjectivity into cherry-picking historical moments."  

  **Your 2-Minute Reply:**  
  "We *reconstruct* priors counterfactually by bracketing the evidence and theory. For the Reykjanes Ridge, we ask what rational beliefs geophysicists held about seafloor magnetism *before* the symmetry was mapped (e.g., assuming randomness or uniform polarity). This isn’t arbitrary—it’s fixed by historical context and default assumptions. The key is that support is *relative* to that epistemic baseline, not to an idealized 'ignorance' state."  

  **Where It’s Soft:**  
  - Reconstructing priors relies on historical interpretation (your historian will pounce).  
  - Concede: "This requires careful historiography—it’s not always straightforward."  
  **Hold Firm:** "Without this, we conflate *support* with *updating*. We need a static benchmark for confirmation."  

  ---

  ### **Objection 2: The Credence-Detachment Objection**  
  *(From the formal epistemologist)*  
  "If your 'static support' never changes actual credences, how is it confirmation? Confirmation must guide rational belief. You’re smuggling in a non-Bayesian notion of 'support' that does no work in decision or inference."  

  **Your 2-Minute Reply:**  
  "Confirmation has two roles: justifying *current* credences (dynamic) and evaluating *explanatory power* (static). The latter matters for theory choice—e.g., why we trust general relativity over Mercury-fitted alternatives. When we learn *T entails E*, our credence *does* update: not on *E* (old), but on the surprise that *T* predicts *E* without ad hoc tweaks. That’s where dynamic confirmation kicks in."  

  **Where It’s Soft:**  
  - Needs formalizing: What *is* the probability of "T entails E"?  
  - Concede: "I’m still refining how to quantify 'surprise of entailment'."  
  **Hold Firm:** "Separating static/dynamic resolves the Bayesian paradox. Credences update on *entailment-discovery*, not *E* itself."  

  ---

  ### **Objection 3: Prediction vs. Accommodation Distinction**  
  *(From the error-statistician)*  
  "Your 'not bent to fit' clause is doing all the work! How does your account distinguish a severe test (e.g., predicting *unknown* striping) from post-hoc accommodation? If the theory was built *using* the evidence, entailment isn’t surprising—it’s engineered."  

  **Your 2-Minute Reply:**  
  "Two safeguards: First, static support uses the *pre-theory* state—so if Vine-Matthews was crafted to fit existing striping data, its support is low. Second, dynamic updating scales with how *improbable* the entailment seemed pre-theory. For seafloor spreading, the surprise was that a *simple* mechanism (spreading + reversals) entailed symmetry—something no one expected from baseline geology."  

  **Where It’s Soft:**  
  - Requires judging "simplicity" or "non-ad-hocness" (philosophically thorny).  
  - Concede: "We need auxiliary principles (e.g., parsimony) to assess 'bent to fit'."  
  **Hold Firm:** "Entailment alone isn’t enough—it must be *unexpected* given background knowledge."  

  ---

  ### **Objection 4: The Historian’s Reality Check**  
  *(From the historian of science)*  
  "Nobody in 1962 had a 'prior' about magnetic striping! Evidence and theory co-evolved: surveys were patchy, and Vine’s thesis explicitly used early symmetry hints. Your 'before' state is a rational reconstruction, not actual history."  

  **Your 2-Minute Reply:**  
  "You’re right—scientists rarely have precise priors. But we can use *proxy beliefs*: e.g., the dominant view that ocean basins were static (Hess’s 'geopoetry' draft was ignored!). Symmetry was shocking because it contradicted expectations of magnetic chaos. I’m not describing psychologists’ priors but *rationalized* ones for confirmation assessment."  

  **Where It’s Soft:**  
  - Proxy beliefs may be contested (e.g., did anyone expect "chaos"?).  
  - Concede: "Actual history is messy—but we *need* idealized models to make sense of support."  
  **Hold Firm:** "Even co-evolved evidence can be evaluated *as if* it was pre-existing for static support."  

  ---

  ### **Objection 5: The Measurement Arbitrariness Problem**  
  *(From the confirmation theorist, again)*  
  "How do we *quantify* static support? If it’s P(E|T) / P(E) evaluated at a past time-slice, but P(E) was undefined/vague, isn’t this just hand-waving?"  

  **Your 2-Minute Reply:**  
  "We use the best available background beliefs. For magnetic striping pre-1963, P(E) could draw on beliefs about terrestrial magnetism: e.g., the probability of symmetric patterns given random anomalies. We don’t need exact numbers—ordinal comparisons suffice (e.g., symmetry is *much* likelier on spreading than on static models)."  

  **Where It’s Soft:**  
  - Still qualitative.  
  - Concede: "Yes, this is often semi-formal. But so is Bayesianism’s 'background knowledge'."  
  **Hold Firm:** "The *ratio* P(E|T)/P(E) is meaningful even if imprecise."  

  ---

  ### **Objection 6: The Double-Counting Worry**  
  *(From a grad student)*  
  "If we use static support *and* dynamic updating on entailment, are we counting the evidence twice?"  

  **Your 2-Minute Reply:**  
  "No—they answer different questions. Static support: 'How impressive is T’s fit with E, given what we knew before E?'. Dynamic updating: 'How should I revise my belief when I learn T explains E?'. Example: Learning that Newton’s theory *failed* on Mercury’s perihelion *reduced* its support, but didn’t change the fact that it once *had* static support for other data."  

  **Where It’s Soft:**  
  - Risk of over-weighting evidence psychologically.  
  - Concede: "In practice, scientists might blur these—but rationally, they’re distinct."  
  **Hold Firm:** "Conflating them creates the old-evidence paradox."  

  ---

  ### **Objection 7: What About Disconfirmation?**  
  *(From the error-statistician)*  
  "Your account focuses on support. How does old evidence *disconfirm*? If E is already known, and T fails to entail it, does that penalize T?"  

  **Your 2-Minute Reply:**  
  "Absolutely. Statically: if P(E|T) is low in the pre-E state, T is unsupported by E. Dynamically: learning that T *cannot* explain E (or entails ¬E) should crash your credence in T. Old evidence *can* disconfirm—e.g., continental drift was partly ignored because it didn’t explain symmetric striping *until* plate tectonics."  

  **Where It’s Soft:**  
  - Less explored in your account.  
  - Concede: "I’ve focused on confirmation, but disconfirmation is symmetric."  
  **Hold Firm:** "The machinery extends naturally."  

  ---

  ### **The Ridge Example: Keep or Drop?**  
  **Keep it.** The cost of switching to Mercury is losing engagement and your expert authority. The chronology worry won’t sink you if you:  
  1. **Acknowledge the mess**: "Surveys accelerated post-1958 (Mason/Raff), but symmetry was fully mapped only by 1963—*after* Vine’s paper (1963) but *before* its widespread acceptance. The *explanation* was the surprise."  
  2. **Focus on the conceptual point**: The *pattern* was known, but not its cause. Your story works if the *theory* was developed after the *data* was public.  

  ---

  ### **The Nightmare Question (You Hope Nobody Asks)**  
  **"Can your account handle cases where the theory was explicitly designed to fit old evidence, but we later agree it was genuine confirmation? (E.g., Dirac’s equation predicting positrons from known energy anomalies)"**  

  **Why It’s Deadly:**  
  - Challenges your "not bent to fit" criterion. If Dirac built his equation to explain the anomaly, was entailment still "surprising"? Yet we credit it as confirmation.  
  **Your Lifeline Reply:**  
  "Here, static support is weak—but dynamic confirmation comes from *new* evidence (e.g., Anderson’s cloud chamber). For old evidence, the boost is modest unless entailment was unexpected given background constraints (e.g., relativity + quantum mechanics *could have* ruled out Dirac’s move). Still, this is a hard case—I’d need to refine 'surprise'."  
  **Damage Control:** Preempt by noting that *some* old-evidence support is weaker than prediction.  

  ---

  ### **Summary: Strategic Stance**  
  - **Concede upfront**:  
    - Reconstructing priors is imperfect and context-dependent.  
    - Quantifying "surprise of entailment" needs work.  
  - **Never concede**:  
    - The static/dynamic distinction is essential to solve the problem.  
    - Old evidence *can* confirm via entailment-discovery.  

  You’re ready. They’ll push hard—but your core argument is robust. Good luck!
