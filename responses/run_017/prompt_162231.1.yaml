answer: |-
  ### Exam Question: The Surprise Exam Paradox in a Probabilistic Setting

  **Background:**  
  A teacher announces to a class at the start of a term with \(N\) teaching days the following:  
  - **(A1)** There will be at most one exam: it will occur on one of the \(N\) days, or on none.  
  - **(A2)** On the morning of the exam (if there is one), a student who accepts (A1)–(A3), has observed no exam on earlier days, and conditionalizes on this information, assigns probability at most \(t\) to the exam being that day.  
  - **(A3)** The student knows the teacher’s selection procedure (i.e., the full probability distribution over \(\{ \text{day } 1, \dots, \text{day } N, \text{no exam} \}\)).  

  A **t-surprising policy** is a probability distribution over the \(N+1\) outcomes that satisfies (A2) for every day \(k\) (from 1 to \(N\)) on which an exam could occur. Specifically, for each day \(k\), conditional on no exam occurring on days \(1\) to \(k-1\), the probability of an exam on day \(k\) is \(\leq t\).  

  ---

  **Part (a) [12 marks]:**  
  (i) For which thresholds \(t\) does a t-surprising policy exist?  
  (ii) For such \(t\), what is the maximum probability that an exam occurs (i.e., it falls on one of the \(N\) days)?  
  (iii) Give an explicit t-surprising policy that achieves this maximum exam probability.  

  **Part (b) [8 marks]:**  
  The classical surprise exam paradox assumes the exam will definitely occur and that students will be "surprised" (often interpreted as being unable to know in advance the exam day). In this model, the exam might not occur, and "surprise" is defined by a credence bound \(t\). Does this model **resolve** the classical paradox or merely **relocate** it? Defend your position by addressing:  
  - What happens to the "definite exam" requirement in the classical case?  
  - Does a teacher who delivers no exam (with positive probability) keep their promise under (A1)–(A3)?  
  - Is a morning credence \(\leq t\) equivalent to being "surprised"?  

  **Instructions:**  
  - Your answer must be self-contained. No citations are needed or wanted.  
  - Part (a) requires mathematical justification. Part (b) requires clear, concise reasoning.  
  - Time allowed: 45 minutes.  

  ---

  ### Model Answer (Approx. 700 words)  

  **Part (a)**  
  A t-surprising policy is defined by probabilities \(p_1, p_2, \dots, p_N\) (for exam on days \(1\) to \(N\)) and \(p_0\) (for no exam), summing to 1. Condition (A2) requires that for each day \(k\), if no exam occurred on days \(1\) to \(k-1\), the conditional probability of an exam on day \(k\) is \(\leq t\). Let \(q_k\) be the probability that no exam has occurred by the end of day \(k-1\) (so \(q_1 = 1\)). Then:  
  \[
  q_k = p_0 + \sum_{j=k}^{N} p_j, \quad \text{and} \quad \frac{p_k}{q_k} \leq t.
  \]  
  This implies \(p_k \leq t q_k\). Since \(q_{k+1} = q_k - p_k\) (no exam before day \(k+1\) implies no exam before day \(k\) and no exam on day \(k\)), we substitute:  
  \[
  q_{k+1} = q_k - p_k \geq q_k - t q_k = (1-t) q_k.
  \]  
  With \(q_1 = 1\), iterating this inequality gives:  
  \[
  q_2 \geq (1-t), \quad q_3 \geq (1-t)^2, \quad \dots, \quad q_{N+1} \geq (1-t)^N.
  \]  
  But \(q_{N+1} = p_0\) (no exam by day \(N\)), so:  
  \[
  p_0 \geq (1-t)^N.
  \]  
  The probability of an exam is \(1 - p_0 \leq 1 - (1-t)^N\).  

  **(i) Existence:** A t-surprising policy exists for all \(t \in [0,1]\). For \(t = 0\), \(p_0 \geq 1\), so the only policy is \(p_0 = 1\) (no exam). For \(t > 0\), policies with positive exam probability exist.  
  **(ii) Maximum exam probability:** The maximum is \(1 - (1-t)^N\).  
  **(iii) Explicit policy:** Set:  
  \[
  p_k = t(1-t)^{k-1} \quad \text{for} \quad k = 1, \dots, N, \quad p_0 = (1-t)^N.
  \]  
  *Verification:* Sum: \(\sum_{k=1}^N p_k + p_0 = t \sum_{k=0}^{N-1} (1-t)^k + (1-t)^N = t \cdot \frac{1 - (1-t)^N}{t} + (1-t)^N = 1\). For day \(k\), \(q_k = \sum_{j=k}^N p_j + p_0 = (1-t)^{k-1}\) (geometric series), so \(p_k / q_k = t \leq t\). Equality holds, satisfying (A2).  

  **Part (b)**  
  The lottery model **relocates** the classical paradox but does not fully resolve it. It shows that the impossibility in the classical case arises from the interaction of certainty and surprise, and offers a consistent alternative when certainty is relaxed.  

  - **Definite exam requirement:** The classical paradox demands the exam occurs with probability 1 (\(p_0 = 0\)). In our model, \(p_0 \geq (1-t)^N\). Setting \(p_0 = 0\) forces \((1-t)^N = 0\), which for finite \(N\) requires \(t = 1\). But if \(t = 1\), (A2) is vacuous (it allows a conditional probability of 1, meaning no surprise). Thus, the classical setup (certain exam and non-vacuous surprise, \(t < 1\)) is impossible. The paradox reemerges here: certainty and non-trivial surprise (\(t < 1\)) are incompatible.  

  - **Teacher’s promise with no exam:** (A1) explicitly permits no exam. If no exam occurs, (A2) is vacuously satisfied (it only applies "if there is an exam"). Thus, a teacher with \(p_0 > 0\) keeps the promise. However, this diverges from the classical paradox, where "there will be an exam" is a premise. The model avoids contradiction by weakening this premise.  

  - **Credence bound vs. surprise:** A credence \(\leq t\) is not equivalent to the classical "cannot know" notion of surprise. (A3) ensures the student knows the entire distribution, so they are aware of the possibility of an exam on day \(k\) but assign low credence to it conditional on survival. For small \(t\) (e.g., \(t = 0.05\)), the exam is unexpected (a "probabilistic surprise"), but this is distinct from epistemic impossibility. The classical surprise is stronger; it requires that the student cannot *know* the exam day in advance, even with the distribution. Here, surprise is a property of the *credence* induced by the policy, not of the student’s knowledge state.  

  The model relocates the paradox by embedding the classical case as a limit: when \(p_0 = 0\) (certainty), non-vacuous surprise (\(t < 1\)) is impossible, as shown in the recursion. By allowing \(p_0 > 0\), the model dissolves the contradiction for probabilistic surprise. However, it does not address the classical intuition that "surprise" should preclude any possibility of advance knowledge. Thus, the paradox persists in its original form for those who insist on certainty and a knowledge-theoretic (not credence-based) surprise.  

  ---

  ### Marking Scheme (Total: 20 marks)  
  **Part (a) [12 marks]**  
  1. **Condition (A2) formalized** as \(p_k / q_k \leq t\) for all \(k\), with \(q_k\) defined as the probability of no exam before day \(k\). [1 mark]  
  2. **Derives the recurrence** \(q_{k+1} \geq (1-t) q_k\) from \(p_k \leq t q_k\) and \(q_{k+1} = q_k - p_k\). [2 marks]  
  3. **Iterates recurrence** to show \(q_{N+1} \geq (1-t)^N\) and thus \(p_0 \geq (1-t)^N\). [2 marks]  
  4. **Correct bound** for exam probability: \(1 - p_0 \leq 1 - (1-t)^N\). [1 mark]  
  5. **Explicit policy**: \(p_k = t(1-t)^{k-1}\) for \(k=1,\dots,N\), \(p_0 = (1-t)^N\). [2 marks]  
  6. **Verification**: Shows \(q_k = (1-t)^{k-1}\) and \(p_k / q_k = t\) for all \(k\). [2 marks]  
  7. **Existence**: States policies exist for all \(t \in [0,1]\); for \(t>0\), exam probability can be positive. [2 marks]  

  **Part (b) [8 marks]**  
  1. **Classical paradox recovery**: Notes that setting \(p_0 = 0\) forces \(t=1\) via \(0 \geq (1-t)^N\), making surprise vacuous. [2 marks]  
  2. **Position**: Argues the model relocates (not resolves) the paradox, as the classical case is impossible. [1 mark]  
  3. **Definite exam**: Explains that certainty (\(p_0=0\)) conflicts with non-vacuous surprise (\(t<1\)). [1 mark]  
  4. **No exam promise**: States that (A1) allows no exam and (A2) is vacuously satisfied if no exam occurs. [1 mark]  
  5. **Credence vs. surprise**: Distinguishes low credence (unexpectedness) from classical "cannot know" surprise; notes (A3) ensures student knows the policy. [2 marks]  
  6. **Overall assessment**: Concludes the model dissolves the probabilistic version but not the knowledge-theoretic classical paradox. [1 mark]  

  **Common Errors (Marks Deducted)**  
  - **A1 misinterpreted**: Assumes exactly one exam (not "at most one") and concludes impossibility for all \(t\). [-2 in (a)]  
  - **Flawed backward induction**: Uses last-day deletion only (e.g., "no exam on day \(N\) if \(t<1\)") without recursion. [-3 in (a)]  
  - **Incorrect bound**: Gives \(1-t\), \(N(1-t)\), or similar instead of \(1 - (1-t)^N\). [-2 in (a)]  
  - **Uniform prior assumption**: Assumes \(p_k\) equal without justification. [-1 in (a)]  
  - **Ignores no exam in denominator**: Forgets \(q_k\) includes \(p_0\) in conditional probabilities. [-1 per instance, max -2 in (a)]  
  - **Conflates credence with knowledge**: Claims (A2) means "student cannot know" exam day. [-1 in (b)]  
  - **Omits vacuity at t=1**: Fails to note (A2) is trivial when \(t=1\). [-1 in (b)]  

  **Grading Standards**  
  - **A (17–20)**: Correct math in (a); complete, nuanced (b); no major errors.  
  - **B (13–16)**: Minor math errors (e.g., miscalculated bound); superficial (b) (e.g., misses credence/knowledge distinction).  
  - **C (9–12)**: Multiple errors in (a) (e.g., incorrect recurrence); incomplete (b) (e.g., no mention of \(p_0=0\) forcing \(t=1\)).  
  - **D (5–8)**: Fundamental flaws (e.g., assumes certainty; backward induction only).  
  - **F (0–4)**: Minimal progress.
