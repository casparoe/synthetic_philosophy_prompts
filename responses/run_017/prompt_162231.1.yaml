prompt: |-
  I am writing the final exam for a fourth-year seminar on paradoxes in formal epistemology, and I need one question on the surprise exam paradox that cannot be answered by running through the dialectic students will have memorized: the backward induction from the last day, the point that "surprise" is a property of the students' epistemic situation rather than of the date, the observation that the announcement is self-referential, the gesture at the knowledge-versus-truth distinction. I want them to have to do actual work on a variant they have not seen, and to show that they can tell a genuine result about the paradox from a redescription of it.

  The variant I have been teaching — call it the lottery model — works like this. A teacher addresses a class at the start of a term of N teaching days and announces:

  (A1) There will be at most one exam: it will fall on one of the N days, or on none of them.
  (A2) On the morning of the exam, if there is one, a student who accepts (A1)–(A3), who has observed that no exam has occurred on any earlier day, and who conditionalizes on this information, assigns probability at most t to its being that day.
  (A3) The student knows the teacher's selection procedure, i.e. the joint distribution over {day 1, …, day N, no exam}.

  Call a policy t-surprising when it satisfies (A2) on every day on which it can place an exam. Part (a) of the question should ask for which thresholds t a t-surprising policy exists, and for the maximum probability with which such a policy can place an exam as a function of t and N — together with an explicit policy that attains it. Part (b) should then ask whether the lottery model dissolves the classical paradox or merely relocates it, and require the student to take a definite position and defend it: in particular, to say what has happened to the clause that there will definitely be an exam, whether a teacher who delivers no exam with positive probability has kept the promise, and whether a morning credence of at most t is really the same thing as being surprised.

  Please write the question itself, a model answer of roughly 700 words, and a marking scheme out of 20.

  Constraints on what I need from you:

  - The question should be doable in 45 minutes and be fully self-contained: it must not depend on any named author, paper, date, or quotation, and students should be told that no citations are expected or wanted. Anything the variant needs must be stated in the question.
  - The marking scheme should name the specific moves a top answer must make, with marks attached — I expect something like: a correct conditional-probability formulation of (A2); the backward recursion and the inequality it generates; the bound on the no-exam probability and hence on the probability of an exam; an explicit extremal policy attaining it; and, for part (b), a claim about where the classical paradox sits inside the result.
  - The scheme should also name the errors that must cost marks, distinguishing an A answer from a B answer. The ones I most want caught: treating (A1) as if it said exactly one exam and concluding impossibility for every t; running the ordinary last-day deletion and thinking nothing else changes; conflating a credence bound with the claim that the student cannot know; producing a bound like 1 − t or N(1 − t) instead of the correct geometric one; assuming the student's priors must be uniform; and forgetting that on the final day the denominator still contains the probability of no exam at all.
  - In the model answer, the recovery of the classical case should be explicit and correct: forcing the probability of an exam to 1 makes the no-exam probability 0, which is compatible with the constraint only at t = 1, where the surprise requirement has become vacuous — so the impossibility is driven by the certainty clause, and the last-day step is the terminal case of the recursion rather than a separate flaw in the announcement.
  - The model answer should also register that (A3) is doing substantial work: if the student does not know the teacher's procedure, the constraint falls on the student's actual credences and can be met by keeping the student uncertain about the policy itself, which changes what "surprise" is a property of.
reasoning: |-
  We are writing an exam question on a variant of the surprise exam paradox, the "lottery model". The question has two parts: (a) a mathematical part asking for the conditions under which a t-surprising policy exists and the maximum probability of an exam, and (b) a philosophical part discussing whether this model dissolves or relocates the paradox.

  The question must be self-contained and doable in 45 minutes. The model answer should be about 700 words and include the recovery of the classical paradox. The marking scheme should detail the required steps and common errors.

  Here is the exam question:

  ---

  **Question: The Surprise Exam Paradox in a Probabilistic Setting**

  A teacher announces to a class at the start of a term of \(N\) teaching days the following:

  (A1) There will be at most one exam: it will fall on one of the \(N\) days, or on none of them.
  (A2) On the morning of the exam, if there is one, a student who accepts (A1)–(A3), who has observed that no exam has occurred on any earlier day, and who conditionalizes on this information, assigns probability at most \(t\) to its being that day.
  (A3) The student knows the teacher’s selection procedure, i.e., the joint distribution over the set of outcomes \(\{ \text{day 1}, \ldots, \text{day } N, \text{no exam} \}\).

  A *t-surprising policy* is a probability distribution over the \(N+1\) outcomes (the \(N\) days and "no exam") that satisfies (A2) for every day \(k\) (from 1 to \(N\)) on which the policy might place an exam. That is, for each day \(k\), if we condition on the event that the exam has not occurred on days 1 to \(k-1\), then the conditional probability that the exam is on day \(k\) is at most \(t\).

  **Part (a):** 
  (i) For which thresholds \(t\) does there exist a t-surprising policy? 
  (ii) For such \(t\), what is the maximum possible probability that an exam occurs (i.e., the probability that the exam is on one of the \(N\) days) that a t-surprising policy can achieve? 
  (iii) Give an explicit t-surprising policy that achieves this maximum probability of an exam.

  **Part (b):** 
  The classical surprise exam paradox assumes that the exam will definitely occur and that the students will be surprised (in a sense that is often taken to require that they cannot know in advance that the exam is on a given day). In this probabilistic model, the exam might not occur, and "surprise" is defined by a bound on the morning credence. Does this model resolve the classical paradox, or does it merely relocate it? In particular, address:
  - What happens to the requirement that the exam definitely occurs?
  - Whether a teacher who delivers no exam with positive probability has kept the promise (given that the announcement (A1) allows for no exam, but what about the surprise condition?).
  - Whether a morning credence of at most \(t\) is equivalent to being surprised.

  Take a definite position and defend it.

  ---

  **Model Answer (Approximately 700 words):**

  **Part (a):**

  We model the teacher's policy as a probability distribution \(p_1, p_2, \ldots, p_N, p_0\) where \(p_k\) is the probability of the exam on day \(k\) (for \(k=1,\ldots,N\)) and \(p_0\) is the probability of no exam. We require \(p_0 + \sum_{k=1}^N p_k = 1\).

  Condition (A2) must hold for every day \(k\). For a fixed day \(k\), the condition applies only if the exam has not occurred on any day before \(k\). The event that no exam has occurred before day \(k\) has probability \(q_k = p_0 + \sum_{j=k}^N p_j\). Conditional on this event, the probability that the exam is on day \(k\) is \(p_k / q_k\). Condition (A2) requires that for every \(k\), \(p_k / q_k \leq t\).

  Note that \(q_k\) is the probability that the exam has not occurred by the end of day \(k-1\). We have \(q_1 = 1\) (since no days have passed) and \(q_{k} = q_{k-1} - p_{k-1}\) for \(k \geq 2\), because the event "no exam before day \(k\)" is the same as "no exam before day \(k-1\)" minus the event "exam on day \(k-1\)". Also, \(q_{N+1} = p_0\).

  The condition for day \(k\) is:
  \[
  \frac{p_k}{q_k} \leq t
  \]
  which implies \(p_k \leq t q_k\).

  We can express \(q_{k+1} = q_k - p_k \geq q_k - t q_k = (1-t) q_k\). Therefore, we have:
  \[
  q_{k+1} \geq (1-t) q_k
  \]
  with \(q_1 = 1\). Iterating this inequality:
  \[
  q_2 \geq (1-t) q_1 = (1-t)
  \]
  \[
  q_3 \geq (1-t) q_2 \geq (1-t)^2
  \]
  and so on, until
  \[
  q_{N+1} \geq (1-t)^N
  \]
  But \(q_{N+1} = p_0\), the probability of no exam. Therefore, \(p_0 \geq (1-t)^N\).

  The probability of an exam is \(1 - p_0 \leq 1 - (1-t)^N\).

  We now show that this bound can be achieved. Consider the policy defined by:
  - \(p_k = t (1-t)^{k-1}\) for \(k = 1, 2, \ldots, N\)
  - \(p_0 = (1-t)^N\)

  Check that this is a valid distribution: 
  \[
  \sum_{k=1}^N p_k = t \sum_{k=0}^{N-1} (1-t)^k = t \cdot \frac{1 - (1-t)^N}{t} = 1 - (1-t)^N
  \]
  Then \(p_0 + \sum_{k=1}^N p_k = (1-t)^N + 1 - (1-t)^N = 1\).

  Now, for the condition on day \(k\): the probability that no exam has occurred before day \(k\) is \(q_k = \sum_{j=k}^N p_j + p_0\). We compute:
  \[
  q_k = \sum_{j=k}^N t (1-t)^{j-1} + (1-t)^N = t (1-t)^{k-1} \cdot \frac{1 - (1-t)^{N-k+1}}{1 - (1-t)} + (1-t)^N = (1-t)^{k-1} [1 - (1-t)^{N-k+1}] + (1-t)^N
  \]
  But note: 
  \[
  \sum_{j=k}^N t (1-t)^{j-1} = t (1-t)^{k-1} \cdot \frac{1 - (1-t)^{N-k+1}}{t} = (1-t)^{k-1} - (1-t)^N
  \]
  Then \(q_k = [(1-t)^{k-1} - (1-t)^N] + (1-t)^N = (1-t)^{k-1}\).

  The conditional probability for day \(k\) is \(p_k / q_k = t (1-t)^{k-1} / (1-t)^{k-1} = t \leq t\). So the condition holds with equality on every day.

  Therefore, a t-surprising policy exists if and only if \(t \geq 0\) (but note for \(t=0\) we must have \(p_k=0\) for all \(k\), so the only policy is no exam with probability 1, which is t-surprising because there is no exam to condition on). However, we are interested in having an exam with positive probability. The above policy achieves an exam with probability \(1 - (1-t)^N\), which is positive as long as \(t>0\) and \(N\) finite.

  But note: if \(t=0\), then the bound \(p_0 \geq (1-t)^N = 1\) forces \(p_0=1\), so the exam probability is 0. For \(t>0\), we can have positive exam probability.

  Moreover, the bound \(1 - (1-t)^N\) is the maximum because we have shown \(p_0 \geq (1-t)^N\) and hence the exam probability \(\leq 1 - (1-t)^N\), and we have a policy achieving equality.

  **Answer for (a):**
  (i) A t-surprising policy exists for every \(t \in [0,1]\). However, for \(t=0\), the only t-surprising policy has no exam for sure. For \(t>0\), there are policies with positive exam probability.
  (ii) The maximum probability of an exam is \(1 - (1-t)^N\).
  (iii) The policy that achieves this is: for each day \(k\) (from 1 to N), probability \(p_k = t (1-t)^{k-1}\), and probability of no exam \(p_0 = (1-t)^N\).

  **Part (b):**

  The lottery model does not entirely dissolve the classical paradox but relocates it. It shows that the paradox in its classical form arises when we require the exam to occur with probability 1 and the surprise condition to hold for a threshold \(t < 1\).

  In the classical paradox, the teacher announces that there will definitely be an exam and that it will be a surprise. In our model, the definite exam corresponds to setting the probability of no exam to zero. But from part (a), we have that \(p_0 \geq (1-t)^N\). If we require \(p_0 = 0\), then we must have \((1-t)^N = 0\), which for \(N\) finite requires \(t=1\). However, if \(t=1\), then the surprise condition (A2) becomes vacuous: it only requires that on the morning of the exam, the conditional probability of the exam being that day is at most 1, which is always true. Thus, the surprise condition is not met in any substantial sense. Therefore, the classical paradox (with a definite exam and a non-vacuous surprise) is impossible.

  The lottery model shows that the impossibility in the classical case is due to the requirement of certainty of the exam. By allowing a positive probability of no exam, we can have a non-vacuous surprise (with \(t<1\)) and still have an exam with high probability (which approaches 1 as \(t\) approaches 1 or as \(N\) becomes large).

  Regarding the teacher's promise: the announcement (A1) explicitly allows for no exam, so the teacher who delivers no exam with probability \(p_0 = (1-t)^N\) has not violated (A1). Moreover, condition (A2) is vacuously satisfied when there is no exam because (A2) only applies "on the morning of the exam, if there is one". Therefore, the teacher has kept the promise.

  However, one might question whether a morning credence of at most \(t\) is equivalent to being surprised. In the classical paradox, surprise is often taken to mean that the student could not have known in advance that the exam would be that day. In the probabilistic setting, we have only bounded the credence. But note that (A3) ensures the student knows the entire policy, so the student knows that the conditional probability will be at most \(t\). But this does not necessarily prevent the student from being surprised. Surprise might be a psychological state that can occur even when one knows the probabilities. Moreover, if \(t\) is small (say, 0.1), then the student each morning assigns at most 10% chance to the exam being that day, so when the exam does occur, it is unexpected. However, the student might also assign high probability to the exam not occurring at all. This model shifts the surprise from absolute certainty to a matter of degree. But it does not capture the idea that the student could not have known the exam day in advance. In fact, the student knows the entire distribution and so could, in principle, know the possible days. But the student does not know which day it will be until it happens. So the surprise is about the specific day, which is consistent.

  The model does relocate the paradox: the classical impossibility is a special case (when the exam probability is 1) and we see that it forces \(t=1\). However, the model also shows that if we relax the certainty requirement, we can have a meaningful surprise. Thus, the paradox is resolved by showing that the surprise condition and the certainty condition are incompatible for non-vacuous surprise.

  **Marking Scheme (Total 20 marks):**

  **Part (a) [12 marks]**
  - Correct formulation of the conditional probability condition for each day: \(p_k / q_k \leq t\) [1 mark]
  - Derivation of the inequality \(q_{k+1} \geq (1-t) q_k\) [1 mark]
  - Iteration to get \(q_{N+1} \geq (1-t)^N\) and hence \(p_0 \geq (1-t)^N\) [2 marks]
  - Conclusion that the exam probability is at most \(1 - (1-t)^N\) [1 mark]
  - Construction of the explicit policy: \(p_k = t (1-t)^{k-1}\) for \(k=1,...,N\) and \(p_0 = (1-t)^N\) [2 marks]
  - Verification that the policy satisfies the conditions (i.e., \(p_k / q_k = t\) and \(q_k = (1-t)^{k-1}\)) [2 marks]
  - Statement that the policy achieves the bound \(1 - (1-t)^N\) [1 mark]
  - Explanation that a t-surprising policy exists for every \(t \in [0,1]\), but for \(t=0\) the exam probability is 0 and for \(t>0\) it can be positive [2 marks]

  **Part (b) [8 marks]**
  - Clear statement that the classical paradox corresponds to requiring the exam with probability 1 (i.e., \(p_0=0\)) and non-vacuous surprise (\(t<1\)) [1 mark]
  - Recognition that setting \(p_0=0\) forces \(t=1\) by the inequality \(0 = p_0 \geq (1-t)^N\), so that the surprise condition becomes vacuous [2 marks]
  - Conclusion that the classical paradox is impossible because the two conditions are incompatible [1 mark]
  - Discussion of the teacher's promise: the teacher with positive no-exam probability has not violated (A1) and (A2) is satisfied [1 mark]
  - Addressing whether a credence bound is equivalent to surprise: noting that surprise in the classical sense is about knowledge and certainty, but here it is about low credence, and that the student knows the policy but still might be surprised by the timing [2 marks]
  - Overall assessment: the model relocates the paradox (by showing the classical case is a limit) and resolves it by showing the incompatibility in the classical case and providing a consistent model when certainty is dropped [1 mark]

  **Common Errors and Deductions:**
  - Treating (A1) as if it said exactly one exam: leads to impossibility for every t. [Deduct 2 marks in part (a)]
  - Running the ordinary last-day deletion (backward induction without probabilities) and not addressing the rest: [Deduct at least 3 marks in part (a) for incomplete reasoning]
  - Conflating the credence bound with the claim that the student cannot know: [Deduct 1-2 marks in part (b) if not addressed properly]
  - Producing an incorrect bound (like \(1-t\) or \(N(1-t)\) instead of \(1-(1-t)^N\)): [Deduct 2 marks in part (a) for the bound, and 1 for the policy if it doesn't match]
  - Assuming the student's priors are uniform: [Deduct 1-2 marks for part (a) if used without justification, because the policy is fixed by (A3)]
  - Forgetting that on the final day the denominator \(q_k\) includes the no-exam probability: [Deduct 1 mark for each day it is missed, up to 2 marks]

  Note: The marking is cumulative and the total for part (a) is 12 and part (b) is 8. The above deductions are from the total for that part.

