  - **B-N-Y-Y-Y-Y-Y-Y**: Unexplored.  
  - **A-N-Y-Y- - - -**: Unexplored.  

  ### Branch Notes  
  - *Contested*: Q4 (aggregation), Q5 (risk aversion), Q6 (sacrifice), Q8 (absoluteness). Disagreement reflects substantive divides in the field.  
  - *Standard carving*: Q1 (pain/suffering), Q2–3 (scope). These frame the logical space without controversy.  
  - *Invented distinction*: Q8 (absoluteness vs. relativity) is my construct for precision.  
  - *Not contested*: Q7 (prevention priority) is underdiscussed but not disputed.  
