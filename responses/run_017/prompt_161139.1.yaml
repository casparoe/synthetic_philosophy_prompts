  **Taxonomy of Suffering-Focused Ethics (T-View)**  
  *Core claim: Some suffering level cannot be outweighed by any pleasure.*

  ### Branching Questions  
  1. **Attaches to:**  
     - A. Pain (sensation)  
     - B. Suffering (aversiveness)  
  2. **Scope: Within a life?**  
     - Y. Yes  
     - N. No  
  3. **Scope: Across persons?**  
     - Y. Yes  
     - N. No  
  4. **Case: Billion 5s itches vs. one 1m joy → Aggregate below-threshold pains?**  
     - Y. Yes (itches outweigh joy)  
     - N. No  
  5. **Case: 1-in-billion vast suffering vs. modest pleasure certainty → Avoid any risk?**  
     - Y. Yes (reject pleasure)  
     - N. No  
  6. **Case: Choose agony to spare others mild tedium → Sacrifice permissible?**  
     - Y. Yes  
     - N. No  
  7. **Case: Prevent existing severe pain vs. create barely net-positive life → Priority to prevention?**  
     - Y. Yes  
     - N. No  
  8. **Case: Being with extreme sensitivity → Threshold absolute?**  
     - Y. Yes (itch always worse)  
     - N. No (relative to norm)  

  ### Leaves (Positions)  
  *(Combinations of answers; "unnamed" if no known position)*  
  - **B-Y-Y-N-Y-N-Y-Y**: "Strong Lexical Threshold"  
  - **B-Y-Y-N-Y-N-Y-N**: "Relativist Threshold"  
  - **B-Y-Y-N-Y-Y-Y-Y**: Unnamed  
  - **B-Y-Y-Y-N-Y-N-N**: "Aggregative Sacrifice View"  
