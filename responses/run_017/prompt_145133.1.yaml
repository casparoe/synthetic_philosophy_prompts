answer: |-
  Here’s your Sunday-night philosophy exam package, designed to force engagement with flip-cases and push beyond surface-level debate. The model answer takes a firm particularist stance to provoke discussion.

  ---

  **Handout: Philosophy Group Exam (90 mins / 900 words max)**

  **Question:**  
  "Flip-cases (e.g., pleasure derived from cruelty switching from a reason *for* to a reason *against* an action) present the decisive challenge in the particularism-generalism debate. Explain why these cases cannot be adequately handled as extreme fade-cases (where a reason is merely outweighed). Critically evaluate the strongest generalist strategy for rescuing moral principles in the face of flip-cases. Conclude by arguing whether this debate is fundamentally about (a) the existence of invariant moral reasons, or (b) how we learn, teach, and apply moral judgment."

  ---

  **Model Answer (798 words):**

  Flip-cases are the battleground for particularism vs. generalism because they expose whether moral reasons possess *invariant valence* – a fixed positive or negative direction. Fade-cases, where a reason (e.g., keeping a promise) is outweighed by a stronger reason (e.g., saving a life), pose no deep threat to generalism. Generalists readily explain these using concepts like "pro tanto" reasons (true but defeasible) or weight-balancing. The promise-keeping reason persists, diminished but intact. Flip-cases, however, suggest a reason’s very *character* changes with context. Pleasure isn’t just outweighed when it stems from cruelty; it becomes *a reason against* the action. This isn't a quantitative shift (more weight on the other side), but a qualitative *reversal*. If generalism relies on principles stating "Feature F is (pro tanto) a reason for action A," flip-cases suggest such principles are fundamentally unstable. The core of the dispute isn't whether reasons can be overridden, but whether they can *invert*.

  The strongest generalist reply to flip-cases is **hedged principles with contextually specified defeaters**. Generalists argue principles should incorporate the conditions under which a feature's valence flips: "Pleasure is a reason *for* an action, *unless* that pleasure is sadistic, *in which case* it is a reason *against*." This aims to preserve invariant valence by refining the feature described: not "pleasure" simpliciter, but "non-sadistic pleasure" is the invariant reason-for. Hedges like "normally," "prima facie," or "in the absence of defeaters" signal that the principle holds *by default*, and its failure requires a specific explanation (the presence of a defeating context, like sadism). This strategy insists that moral thought requires *some* default patterns, and flip-cases merely reveal the need for more nuanced principles, not their abandonment.

  However, this generalist strategy faces a fatal dilemma regarding its capacity to genuinely *guide* moral judgment: it is either **empty or useless for learners**. 

  1.  **The Emptiness Problem:** If the hedge ("unless sadistic") simply restates the flip-condition identified by correct judgment in the specific case, the principle offers no independent guidance. To know whether the "sadism" defeater applies requires the very contextual sensitivity particularists champion. The principle becomes a tautology: "Pleasure is a reason for unless it isn't." It codifies the outcome of judgment without providing a rule to *achieve* that judgment. It doesn’t tell someone *how* to recognize sadism as a defeater; it just labels the result.
  2.  **The Uselessness Problem:** If the hedge attempts substantive, context-independent guidance (e.g., "Sadism = pleasure derived from physical pain witnessed directly"), it risks being either over-inclusive (capturing non-flip cases like justified punishment) or under-inclusive (missing novel or subtle forms of cruelty). Moral life constantly presents new contexts. A learner armed with rigidly defined defeaters might misapply them or be paralyzed when facing an unfamiliar scenario that *feels* like a flip-case but doesn't match their list. True moral competence requires perceiving *why* sadism matters in *this* configuration, not matching features to a pre-defined list. The hedged principle, if substantive, fails to equip agents for novelty.

  Therefore, flip-cases reveal that the core dispute is **not primarily about ontology (what reasons exist) but about moral epistemology and pedagogy (how we judge, learn, and teach)**. Generalism, even in its hedged form, assumes moral competence involves applying general rules to particulars. Particularism argues competence is a holistic, perceptual capacity – seeing the *salience* of features within the unique normative landscape of a situation. Flip-cases demonstrate that no simple list of invariant reasons or defeaters can capture this. The "principle" the generalist needs is effectively: "See the situation rightly." But this isn't a principle guiding judgment; it *is* the description of good judgment itself.

  Furthermore, the particularist claim that "reasons are context-dependent" is **not a self-defeating general principle**, but a *metaphysical* claim about how reasons function. It denies there *are* invariant, atomistic reasons to be codified. Claims like "Context determines valence" describe the nature of moral reality, not a rule for acting within it. Teaching morality, then, isn't about imparting rules, but cultivating perception through examples, dialogue, and developing sensitivity to the interplay of features – exactly what your philosophy group attempts! We learn to see that *this* pleasure flips, not by applying a rule, but by understanding the cruel context.

  Consequently, flip-cases show that the live dispute concerns **the nature of moral reasoning itself**. Generalism’s hedged principles fail to provide genuine guidance without presupposing the contextual judgment they are meant to generate. The debate pushes us towards particularism: moral judgment is fundamentally situational perception, not subsumption under rules. For our group, this means arguing cases requires deep attention to their unique configuration, not just appealing to abstracted principles whose applicability is precisely what’s in question.

  ---

  **Marking Scheme (Out of 20):**

  1.  **Clear Distinction Flip vs. Fade (0-4):** Explains why flip-case involves valence *inversion*, not mere quantitative outweighing (fade). *Common Mistake:* Conflating flip/fade, e.g., saying cruelty just "outweighs" pleasure massively.
  2.  **Flip-Cases as Core Challenge (0-4):** Argues flip-cases threaten invariant valence, the foundation of generalist principles. *Common Mistake:* Treating flip-cases as just a "harder" fade-case without explaining the qualitative threat to generalism.
  3.  **Strongest Generalist Reply (0-4):** Presents *hedged principles/contextual defeaters* accurately (refining the feature, invoking defaults + specific defeaters), avoiding strawmen (e.g., "generalists ignore context"). *Common Mistake:* Attributing a weak or implausible strategy to generalism (strawman), or only mentioning weighing.
  4.  **Critique of Generalist Reply (0-4):** Effectively argues the dilemma: hedged principles are either empty (tautological) or useless for guidance (inflexible/over-rigid defeaters). *Common Mistake:* Only attacking simple principles without addressing nuanced hedges, or vague critique like "it's complicated."
  5.  **Addressing the Core Dispute & Implications (0-4):** Clearly argues the debate is about moral epistemology/pedagogy (how we judge/learn) vs. ontology, explains why particularism's core claim isn't self-defeating, and draws a clear conclusion for practical reasoning. *Common Mistake:* Remaining purely abstract about reasons, not engaging with judgment/learning; claiming particularism is self-refuting; fence-sitting on the dispute's nature.

  **Fence-Sitting Penalty:** Answers that merely list "both sides have points" without resolving *why* flip-cases are decisive or *what* the core dispute is, or that avoid taking a stance on the efficacy of the generalist reply or the nature of the debate, are capped at **9/10**.

  ---

  **Contested Reading in Model Answer:**

  *   **The Assumption:** The model answer leans heavily on interpreting generalism as requiring **invariant valence** for features (F is *always* a reason for/against, even if defeasible). Some generalists (e.g., "default generalists") might argue principles only specify *default* valences, where flips are expected exceptions requiring explanation, but the default still provides genuine (though fallible) guidance. The model answer critiques this by arguing the "default + exception" structure either becomes empty (if the exception is defined by the outcome) or fails to guide in novel cases (the uselessness problem).
  *   **What You're Signing Up For:** The model answer presents a robust particularist challenge to a strong version of generalism (invariant valence). This will force your group to debate whether "defaults plus context-specific defeaters" genuinely solve the guidance problem for flip-cases or merely postpone it. It explicitly rejects the idea that the debate is easily resolved by "better principles." Be prepared for pushback defending the usefulness of defaults!
