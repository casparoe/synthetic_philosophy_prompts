  We are going to translate the Frege-Geach problem and expressivist responses into the vocabulary of functional programming, using concepts like types, expressions vs. statements, values, side effects, compositionality, pure functions, and monads.

  ### The Expressivist Starting Point
  Expressivism says that a moral sentence, such as "stealing is wrong", is not of type `Bool` (a truth value) but rather performs an action (a side effect). In programming terms, we might think of it as having a type that represents an effectful action. Let's denote:

  - **Descriptive sentence (e.g., "It is raining")**: has type `Bool` (or `Prop` if we are in a logic). It denotes a fact about the world and can be true or false.

  - **Moral sentence (e.g., "Stealing is wrong")**: on expressivism, it is not a `Bool` but an action that expresses an attitude. We might assign it a type like `IO ()` (in Haskell) or `Eff ()` (in some effect systems) — a computation that performs an effect (expressing disapproval of stealing) and returns nothing of interest.

  ### The Frege-Geach Problem
  The problem arises when we embed a moral sentence in a conditional:

  ```haskell
  if stealingIsWrong then gettingBrotherToStealIsWrong else ...
  ```

  Here, `stealingIsWrong` is used in a conditional, which expects a `Bool` (or at least a truth-apt value). But if `stealingIsWrong` is of type `IO ()`, we have a type error: we cannot use an effectful action in a condition.

  Moreover, modus ponens:

  Premise 1: `If stealing is wrong, then getting your little brother to steal is wrong.`
  Premise 2: `Stealing is wrong.`
  Conclusion: `Therefore, getting your little brother to steal is wrong.`

  If we interpret the conditional as a function of type `Bool -> Bool -> Bool` (or `Prop -> Prop -> Prop`), then both premises must be of type `Bool`. But expressivism says the moral sentences are `IO ()`, so they don't fit.

  ### Expressivist Repairs

  #### 1. Expressing attitudes toward conditionals or negations
  One expressivist move is to say that when we use a moral sentence in a conditional, we are expressing a complex attitude. For example, in the conditional, we are expressing an attitude about the connection between stealing being wrong and getting your brother to steal being wrong.

  But note: the conditional itself is a complex expression. We need to assign a type to the entire conditional. The expressivist might say that the conditional is also an expression of an attitude, but now an attitude toward a conditional content.

  In programming terms, we might try to lift the effect into a context where it can be composed. This is reminiscent of using a monad to handle effects in a pure setting.

  Let's try:

  - Instead of `IO ()`, let's assign moral sentences a type that can be embedded. We might define a type constructor `Moral` that wraps a proposition and then the effect of expressing an attitude about that proposition.

  But note: expressivists don't want to admit that there are moral propositions (truth-apt). So we might have:

  ```haskell
  data Moral a = Moral (a -> IO ())
  ```

  But then what is `a`? For a simple moral sentence, `a` might be an action (like stealing). But then the sentence "stealing is wrong" would be:

  ```haskell
  stealingIsWrong :: Moral Stealing
  stealingIsWrong = Moral (\stealingAct -> ... expression of disapproval ...)
  ```

  But now, how do we form a conditional? We need to express an attitude about a conditional relationship.

  The expressivist might say that we can have higher-order attitudes. For example:

  ```haskell
  conditionalAttitude :: Moral a -> Moral b -> Moral (a -> b)
  ```

  But note: this is getting complex and it's not clear how to use modus ponens.

  Alternatively, we might use a monad to sequence the effects? But note: in the conditional, we are not necessarily sequencing but embedding.

  #### 2. Quasi-realism
  The quasi-realist project (e.g., Blackburn, Gibbard) attempts to reconstruct the features of moral discourse (truth-aptness, embedding, disagreement) using only conative attitudes. The idea is to show that we can have something that behaves just like a belief (so it has a type that can be used in conditionals) but is built out of attitudes.

  In programming terms, we might think of this as defining a monad that encapsulates the expressivist effect and then provides a way to lift moral sentences into a truth-apt representation within that monad.

  We might define:

  ```haskell
  -- The type of moral propositions: they are truth-apt in the context of a system of attitudes.
  newtype Moral a = Moral { runMoral :: SystemOfAttitudes -> (Bool, SystemOfAttitudes) }
  ```

  But wait, this looks like a state monad where we are updating and querying a system of attitudes. Then:

  - A simple moral assertion: `stealingIsWrong :: Moral Bool` would be a computation that, given the current system of attitudes, returns `True` (if stealing is disapproved) and leaves the system unchanged? Or perhaps it updates the system to include disapproval?

  But expressivists don't want to reduce morality to a descriptive fact about the system of attitudes. They want to keep the expressive function.

  Alternatively, we might use a continuation monad? Gibbard's solution uses a notion of hyperplans, which are like complex contingency plans for what to do in any situation. Then a moral judgment is a hyperplan.

  We can think of:

  ```haskell
  type Hyperplan = WorldState -> Action
  ```

  Then, a moral judgment might be a function that takes a hyperplan and returns a boolean (or an effect) about whether that hyperplan endorses the action.

  But Gibbard's account is more complex. He defines:

  - A normative content as a set of hyperplans (the ones that endorse the judgment).
  - Then, "stealing is wrong" is the set of hyperplans that forbid stealing.

  This set is truth-apt: it can be true or false that a given hyperplan is in the set. But then, we've moved to a descriptive account of hyperplans? The expressivist might say that we are still expressing an attitude: we are expressing acceptance of a system of norms that forbids stealing.

  But note: the set of hyperplans is a descriptive fact. So we have:

  ```haskell
  type MoralProposition = Set Hyperplan

  stealingIsWrong :: MoralProposition
  stealingIsWrong = { h | h forbids stealing }
  ```

  Then, conditionals work by set operations:

  ```haskell
  ifStealingWrongThenBrotherStealingWrong :: MoralProposition
  ifStealingWrongThenBrotherStealingWrong = { h | if h forbids stealing then h forbids brotherStealing }
  ```

  And modus ponens holds: if the actual hyperplan is in `stealingIsWrong` and in `ifStealingWrongThenBrotherStealingWrong`, then it must be in `brotherStealingWrong`.

  But now, we have a descriptive type for moral sentences: `MoralProposition` is a set, so it's a value that can be embedded. However, the expressivist component is that in asserting a moral proposition, we are expressing our acceptance of a hyperplan that is in the set? So the assertion has two aspects:

  1. The descriptive content: the set of hyperplans (which is truth-apt).
  2. The expressive component: by asserting, we are also expressing that we accept a hyperplan in that set.

  So the type of a moral assertion might be:

  ```haskell
  assertMoral :: MoralProposition -> IO ()
  assertMoral prop = do
    -- Express that we accept a hyperplan in prop.
    ...
  ```

  But then, the embedded occurrence of a moral sentence (like in a conditional) doesn't perform the expression; it just refers to the set (the descriptive content). The expressivist has now introduced a descriptive content for moral sentences that can be embedded. This is the quasi-realist move.

  ### The Residue Report

  You suspect that the monad analogy is doing too much work, and the real issue is whether the reassembled belief-like thing is genuine or a convincing fake. In the quasi-realist account above, we have:

  - A moral sentence when unembedded (asserted) does two things: it expresses an attitude (effect) and it describes a set of hyperplans (truth-apt content).
  - When embedded, only the truth-apt content is used.

  So the puzzle is: does this descriptive content (the set of hyperplans) capture everything we mean by the moral sentence? The quasi-realist says yes, because moral discourse is just about expressing such attitudes in a way that behaves like realism. But the moral realist might say: no, because the set of hyperplans is just a psychological fact, whereas moral truths are objective.

  The dispute then shifts to whether we need objective moral truths. The quasi-realist says we can do without them, and the reconstructed discourse is all there is. The realist says that the quasi-realist has left out the objective truth-maker.

  In your vocabulary, the question is: did we just use a monad (or a functor/applicative) to lift the effectful expression into a context where we can have compositionality (by separating the descriptive content) and then perform the effect only when the moral sentence is asserted? And then, is the descriptive content (the set of hyperplans) a real value or just a placeholder?

  The distortion: we had to assign a truth-apt content to moral sentences (the set of hyperplans) to make the embedding work. But expressivism originally wanted to avoid any truth-apt content for moral sentences. Quasi-realism is a form of expressivism that says: we can have truth-apt content that is grounded in attitudes, and that's all we need.

  The hole in your framework: the monad analogy helps with compositionality, but it doesn't settle the metaphysical question of whether the truth-apt content we've constructed (the set of hyperplans) is a good enough substitute for objective moral facts. That question is outside the functional programming analogy. It's a question about what we want from ethics: do we need mind-independent truths? The quasi-realist says no, and the realist says yes.

  So the translation doesn't bottom out on the technical issue of compositionality (which we solved by introducing a truth-apt content) but on the philosophical issue of whether that solution is adequate. The functional programming analogy can help us see the structure of the problem and the solution, but it doesn't resolve the metaphysical dispute.

  ### Summary

  - **Expressivism without repair**: moral sentences as `IO ()` -> type error when embedded.
  - **Expressivist repair (attitudes toward complexes)**: we try to define a monadic type `Moral a` that can embed, but it's unclear how to do conditionals without introducing a truth-apt layer.
  - **Quasi-realism**: introduces a truth-apt descriptive content (like `Set Hyperplan`) for moral sentences, so they can be embedded. The expressive act is then a separate effect that happens when the sentence is asserted.

  The residue: the monad analogy helps with the compositionality problem, but the deeper issue is whether the truth-apt content we've constructed (which is based on attitudes) is sufficient for moral discourse. That is a philosophical, not technical, question.

  So, to answer your suspicion: the monad is not doing too much work in the analogy for the compositionality problem, but it doesn't resolve the realism/anti-realism debate. The difference between "real belief and truth" and a "convincing fake" is not captured by the type system. It depends on whether we think the truth-apt content we've constructed (the set of hyperplans) is a genuine truth-maker or merely a useful fiction. The functional programming framework does not have the vocabulary to adjudicate that, because it is a matter of interpretation and philosophical commitment.
answer: |-
  Let's translate the Frege-Geach problem and its responses into functional programming concepts, preserving the philosophical structure while mapping to your vocabulary. I'll flag distortions and the "residue" where your framework might not fully capture the dispute.

  ### Core Translation
  1. **Descriptive Statement (Realism):**  
     Type: `WorldState -> Bool`  
     Example: "It is raining" is a pure function from world state to a truth value. Compositional, referential, and embeds without issues.

  2. **Expressivist Moral Statement (Base):**  
     Type: `IO ()`  
     Example: "Stealing is wrong" is an effect (expressing disapproval), not a value. It *performs* an action (attitude-expression) rather than describing a fact.  
     **Problem:** This is a **type error** when embedded. Conditional `if stealingIsWrong then ...` expects a `Bool`, but gets `IO ()` – an effect where a value is required.

  ---

  ### Frege-Geach Problem as Composition Failure
  - **Grammar expects:** A moral sentence in a conditional (`if P then Q`) requires `P: Bool`.  
  - **Expressivism provides:** `P: IO ()` → **type mismatch**.  
  - **Modus Ponens breakdown:**  
    ```haskell
    -- Needs:
    conditional :: Bool -> Bool -> Bool
    applyModusPonens :: (Bool -> Bool) -> Bool -> Bool

    -- But given:
    stealingIsWrong :: IO ()
    conditional :: IO () -> IO () -> ???  -- No coherent type!
    ```

  ---

  ### Expressivist Repairs (Translated)
  #### 1. Attitude Toward Complex Propositions
  - **Claim:** When saying "if stealing is wrong...", you express a *higher-order attitude* (e.g., disapproval of combinations of attitudes).  
  - **Type:** Lift the effect into a monad `M` (e.g., `Attitude a`).  
    - Simple attitude: `stealingIsWrong :: M ()`  
    - Conditional attitude: `ifWrongThen :: M (M () -> M ())`  
  - **How it "solves" embedding:**  
    - Moral sentences become `M Prop` (where `Prop` is a propositional "shell").  
    - Composition uses monadic bind:  
      ```haskell
      ifStealingWrong :: M (M () -> M ())  -- Attitude toward conditional
      thenClause :: M ()                   -- Attitude toward brother stealing
      -- Combine via:
      ifStealingWrong >>= ($ thenClause)   :: M ()
      ```  
  - **Cost:** This is **lifting the effect into a monad** (e.g., `IO` → `ExceptT Attitude IO`). The "content" of the embedded sentence is a **thunked effect** (`M ()` wrapped in `M`). Modus ponens works syntactically but is no longer truth-functional—it's an operation on attitude structures.

  #### 2. Quasi-Realism (Blackburn/Gibbard)  
  - **Goal:** Rebuild truth-aptness and compositionality from attitudes alone.  
  - **Type:** A free monad over attitude effects:  
    ```haskell
    data Moral a = Pure a 
                 | Express (Attitude) (Moral a)

    -- Moral sentences become:
    stealingIsWrong :: Moral Bool  -- Not just an effect, a "simulated" truth value
    ```  
  - **How it "solves" embedding:**  
    - Moral sentences now yield a `Moral Bool` that *behaves like* `Bool` under composition.  
    - Embedding uses `fmap`/`ap`:  
      ```haskell
      conditional :: Moral Bool -> Moral Bool -> Moral Bool
      conditional = liftA2 (\p q -> not p || q)  -- Moral (Bool -> Bool -> Bool)
      ```  
    - **Monadic reflection:** The quasi-realist claims `runMoral :: Moral a -> (a, [Attitude])` decomposes the value/effect pair, letting attitudes "mirror" logical operations.  
  - **Cost:** This is **effect rebinding** (like `State` monad simulating mutable state). Truth becomes `Moral Bool` (a program producing attitudes + a boolean), not `Bool`.

  ---

  ### Residue Report: Where Your Framework Reaches Limits
  #### 1. The Monad Analogy Overextends
  - **Monads handle composition** but **obscure metaphysics**. Quasi-realism uses monads to simulate truth-aptness, but the dispute is whether `Moral Bool` ≈ `Bool` or is a "hack."  
  - **Your suspicion is correct:** The monad translation *resolves the technical embedding problem* but leaves the **philosophical question intact**: Is `Moral Bool` merely a syntactic fix, or does it recover "realist" semantics?  
    - Realists: `Moral Bool` is a fake—it outputs a value but has no input (`WorldState -> Moral Bool` lacks a world-to-mind direction of fit).  
    - Expressivists: All "truth" is program equivalence under `runMoral`—no deeper realism needed.

  #### 2. What Your Vocabulary Misses
  - **Attitude Psychology:** Your framework treats "attitudes" as opaque effects (e.g., `IO`). But metaethics cares about *what attitudes are* (e.g., conative states like disapproval vs. beliefs).  
    - **Distortion:** Modeling "disapproval of conditionals" as `M (M () -> M ())` ignores psychology: Can humans hold such attitudes? FP doesn't care, but philosophy must.  
  - **Truth vs. Correct Assertibility:**  
    - FP: Truth is `Bool` or `Prop`.  
    - Metaethics: Is "truth" just *assertion conditions* (e.g., `runMoral` outputs `True`)? Or a mind-independent property?  
    - **Hole:** Your types can't distinguish "simulated truth" (`Moral Bool`) from "real truth" (`WorldState -> Bool`). This is the core dispute.

  #### 3. Thin Dispute? Partly
  - **Where it's thin:** Frege-Geach is solved technically by monads/lifting. Compositionality is recoverable.  
  - **Where it's thick:** The **metaphysical residue** remains:  
    - Realists: Quasi-realism is "program equivalence without semantics"—attitudes lack truth-makers.  
    - Expressivists: Truth *is* program equivalence (no "magic bytes" needed).  
    - **Your framework exposes this:** The dispute reduces to whether `runMoral`'s output is all "truth" means. FP has no tools to answer this—it’s philosophy all the way down.

  ### Key Distortions Introduced
  1. **Attitudes as Effects:** Treating attitudes as `IO` oversimplifies. Real attitudes have cognitive structure (e.g., direction of fit).  
  2. **Monad as Attitude Container:** Using monads implies a tidy separation between "pure logic" and "effects." Actual attitudes blur this.  
  3. **Truth-Aptness as Type:** `Moral Bool` solves typing but ignores that truth is normative in ethics (e.g., "should be asserted" vs. "tracks reality").

  ### Bottom Line
  Your framework perfectly models the **embedding problem** and **solutions** (monads/lifting). The "residue" is purely philosophical: whether recomposing attitudes *constructs truth* or *simulates* it. FP has no type for "realism," so the dispute can't dissolve—but the translation shows the realist's demand for `WorldState -> Moral Bool` is *just another effect*. Whether that effect is necessary is where philosophy takes over.
