prompt: |-
  Hey — I've been reading rationalist blogs and forums for like a decade and I write typed functional code for a living, so the vocabulary I actually think in is: expressions vs. statements, values vs. side effects, types, compositionality, pure functions, and monads as the trick that makes effects composable again.

  I keep seeing metaethicists dunk on expressivism with the Frege–Geach problem and I want the whole dialectic rendered in my native tongue. Setup as I understand it: expressivism says a moral sentence like 'stealing is wrong' doesn't describe a state of the world, it does something — expresses or creates a conative attitude, closer to an assignment or a command than to an assertion. Frege–Geach: that can't be all there is, because 'stealing is wrong' also occurs unasserted inside 'if stealing is wrong, then getting your little brother to steal is wrong', and modus ponens on that conditional plus the first premise plainly works. If the sentence's whole job is to perform an attitude, there's nothing left for it to contribute when embedded.

  So: translate this as faithfully as you can. What's the *type* of a moral sentence on each picture? Is the puzzle literally a type error — an effectful thing showing up where the grammar demands a value — with 'embedding' just being composition? Do the same for the two repairs: the expressivist move of expressing an attitude toward a conditional or a negation (the 'not wrong' case), and the quasi-realist project of reassembling belief-like, truth-apt, disagreement-capable behaviour out of conative materials. Is 'attitude toward a complex' anything I'd recognise, or is it just lifting a side effect into a monad and declaring victory?

  Then the residue report, which is the part I actually want: what has no counterpart in my vocabulary? My suspicion is that monad is doing too much work in the analogy, and that the interesting question — whether the reassembled thing is really belief and truth or a very convincing fake, and why anyone thinks the difference matters — is exactly where the translation bottoms out. Tell me whether that's a hole in my framework or a sign the original dispute is thinner than it sounds, and flag anything you had to distort to fit.
