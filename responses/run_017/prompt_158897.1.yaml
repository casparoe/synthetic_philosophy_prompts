prompt: |-
  Me and three mates have been going round in circles on this for about a month and I want something that settles it, or at least shows us where we actually disagree rather than where we think we disagree.

  The thing we keep hitting is this. Me and my partner might try for a baby in the next year or so, my sister's doing IVF and has been asked about screening embryos, and one of the group works on a forty-year flood defence plan for the council. In every one of those, whatever we decide changes *which* people end up existing, not just how good their lives are. My mate says that means nobody is made worse off by the bad choice, so nothing is wrong with it. I think that's obviously dodgy but I can't say why without going in a loop.

  So: write me a quiz that sorts someone by what they say about cases, not by which theory they think they like. About ten questions, each one a concrete situation with three or four answers to pick from, then a scoring key at the end that maps patterns of answers onto named positions, with a one-line plain-English gloss of each position and its most awkward consequence. Everyone in my group is happy to answer things like "that's wrong", "that's not wrong", "you can't compare those two", or "that's wrong but not because anyone's worse off" — so make the options that sort of verdict, not names of views. No question should mention a philosopher or ask anyone to identify a theory; if I wanted that I'd just read the wikipedia page.

  Cases I want in there: a teenager who has a baby now when waiting a few years would mean a different, better-off child; a factory that leaks something which both causes a birth defect and, by luck, is also what led to that particular child being conceived at all; two hospital programmes with the same budget where one helps children who already exist and one changes which children get born; a flood defence or energy policy that changes which people are alive in fifty years; picking between embryos; and one where the choice changes how many people there are rather than just who.

  But I also want the questions the usual versions of this never ask, because those are the ones we keep tripping over:

  - Does it matter how *similar* the alternative person would have been? Say the other child would have had the same parents, born the same month, and a life that's 95% the same. Most of us feel that makes a difference and none of us can say why.
  - Which "compared to what" is the right one: what you'd have done instead, or what would have happened if nobody had done anything? Our flood defence argument flips completely depending on this and we only noticed last week.
  - What if you don't know whether your choice changes who exists — say you're about 50/50 on it?
  - Does it matter if the badness is spread really thin across a million people instead of concentrated in one kid?

  The leaves I want named (or marked "unnamed" if it's literally just us): the narrow view where it only counts if it's worse for the very same person; the view that identity doesn't matter at all; the in-between one where identity doesn't matter but how many people there are does; the full add-it-all-up impersonal one; the averaging one; the "those two outcomes just aren't comparable" one; the "it's wrong but not because anyone's worse off, more like it used them" one; and the asymmetric one where you've got a reason not to create a child who'd be miserable but no reason to create one who'd be happy.

  And this is the bit I'm most curious about: build it out of the combinations of answers first, then tell me which combinations nobody actually holds, and for each empty one say whether it's empty because its incoherent, because it's just unattractive, or because nobody's bothered to work it out. Also be straight with me about which pairs of positions your quiz genuinely can't seperate — I'd rather know than get a tidy-looking key that fudges it.

  Keep each question to a short paragraph, don't assume anyone's read any philosophy, and no reading lists, I've got enough of those already. British spellings please.
reasoning: |-
  Okay, the user and their friends are stuck in a philosophical debate about whether choices that affect which people come into existence can be considered wrong when no specific person is made worse off. They've been going in circles for a month and want a tool to clarify their disagreements without theoretical jargon. 

  The user describes real-life scenarios: having a baby now vs later (resulting in different children), embryo screening, and long-term infrastructure planning. Their mate argues that since different people exist, no one is worse off, so the choice isn't wrong. The user feels this is flawed but can't articulate why. 

  They want a 10-question quiz with concrete cases and answer options like "wrong/not wrong/can't compare" - no theory names. Key cases include: teen pregnancy timing, factory pollution affecting conception identity, hospital funding (existing vs future children), flood defenses altering future populations, embryo selection, and variable population size. 

  Special twists requested: 
  - Does similarity between potential people matter? (e.g., 95% same life but different person) 
  - Which baseline counts: "what you'd do otherwise" vs "if no one acted"? 
  - Uncertainty about affecting identity 
  - Diffused harm (small harm to many) 

  Desired positions to map: 
  1. Only same-person harm counts (narrow) 
  2. Identity irrelevant (impersonal total) 
  3. Identity irrelevant but numbers matter 
  4. Impersonal with averaging 
  5. Non-comparable outcomes 
  6. Wrong but not harmful (e.g., exploitation) 
  7. Asymmetric: avoid miserable lives but no duty to create happy ones 

  Crucially, the user wants: 
  - Honesty about unmappable positions 
  - Explanation of why some combos are empty (incoherent/unattractive/unexplored) 
  - British spellings, no philosophy references 

  I'm designing a quiz where each question probes a specific tension. For example: 
  - Q1 tests if non-identity cases feel wrong 
  - Q2 introduces similarity to see if it weakens the objection 
  - Q3 pits "worse off" against exploitation concerns 
  - Q4 handles population size changes 
  - Q5 examines baseline selection (flood defense dilemma) 
  - Q6 addresses uncertainty 
  - Q7 checks harm distribution 
  - Q8 isolates embryo selection ethics 
  - Q9 tests asymmetry 
  - Q10 forces tradeoffs between groups 

  The scoring will reveal which principles are consistently applied. I'll flag where: 
  - Asymmetric views clash with impersonal averaging 
  - "Can't compare" answers override other logics 
  - Similarity concerns don't cleanly fit major theories 

  I'm noting that some combos are incoherent (e.g., claiming outcomes can't be compared while endorsing asymmetric duties). Others are unattractive (e.g., saying teen pregnancy is wrong only if the child is identical). The hospital funding question (Q10) will likely split "total" vs "average" utilitarians. 

  Importantly, I'll admit that similarity (Q2) and baselines (Q5) aren't perfectly resolved in existing theories - which might explain their group's stalemate. The key will show where positions overlap (e.g., impersonal total vs averaging often align except in population ethics).
answer: |-
  Here’s a 10-question quiz designed to pinpoint disagreements about choices that affect *who* exists. Each scenario avoids theory names, uses British spellings, and focuses on concrete verdicts. The scoring key maps answer patterns to positions (named or "unnamed"), highlights irreconcilable differences, and flags empty/rare combinations.

  ---

  ### **The "Who Exists?" Quiz**
  *Answer each question with your gut reaction. Pick the verdict that feels closest:*
  **A:** That’s wrong.  
  **B:** That’s not wrong.  
  **C:** You can’t compare the outcomes.  
  **D:** It’s wrong, but not because anyone is *worse off*.

  ---

  1. **Teen Parent Timing**  
     A 16-year-old chooses to have a baby now. If she waited until 25, she’d be financially stable and have a different child (due to different eggs/sperm meeting), who’d have a much better life. She has the baby now.  
     *Your verdict?* ➔ A / B / C / D  

  2. **The Similar-But-Different Child**  
     Same as #1, *but* the child born now and the child born later would have near-identical lives (same parents, birth month, school, 95% same experiences) – except the child born now grows up in poverty.  
     *Your verdict?* ➔ A / B / C / D  

  3. **Factory Leak**  
     A factory leaks a chemical causing severe birth defects in 10 children. Investigations show the chemical *also* altered the timing of conception: without the leak, entirely different children would exist. The affected children have painful lives but wouldn’t exist otherwise.  
     *Your verdict?* ➔ A / B / C / D  

  4. **Small Harm, Many People**  
     A policy slightly increases air pollution for 1 million future people. Each person has a minimally worse life (e.g., mild asthma). The policy *also* changes which couples meet, so all 1 million are different people than under cleaner air.  
     *Your verdict?* ➔ A / B / C / D  

  5. **Flood Defence Baselines**  
     A council builds cheap flood defences for a coastal town. In 50 years, 10,000 people live there. If they’d built expensive defences, the town would thrive, attracting *different* residents (due to economic shifts). The cheap defences fail; lives are lost.  
     *Compared to: (i) building expensive defences?* ➔ A / B / C / D  
     *(ii) doing nothing at all?* ➔ A / B / C / D  

  6. **Uncertain Outcome**  
     A doctor prescribes a drug to a pregnant patient. There’s a 50% chance the drug causes a disability *and* changes which sperm fertilises the egg (leading to a different child). You don’t know which outcome occurred.  
     *Your verdict?* ➔ A / B / C / D  

  7. **Embryo Selection**  
     During IVF, parents choose Embryo A (who will have a good life) over Embryo B (who will have a severe, painful disability). Both would be genetically their children.  
     *Your verdict?* ➔ A / B / C / D  

  8. **Helping Existing vs. Future Children**  
     A hospital has £1 million. Programme X helps 100 existing disabled children (improving their lives). Programme Y ensures 100 future children are born healthy (instead of disabled) by screening parents. *But* Programme Y’s children wouldn’t exist otherwise.  
     *Your verdict on funding Y over X?* ➔ A / B / C / D  

  9. **Creating a Miserable Life**  
     A woman uses a fertility treatment knowing it will create a child with agonising, incurable pain. The child will exist only if she does this.  
     *Your verdict?* ➔ A / B / C / D  

  10. **Extra Happy Person**  
      A policy adds one very happy person to the future population. It doesn’t harm anyone, but it changes *who else exists* (e.g., alters migration patterns). Without it, fewer, equally happy people exist.  
      *Your verdict?* ➔ A / B / C / D  

  ---

  ### **Scoring Key**
  Tally your answers. The pattern reveals your position. **Bold** = Core principle. *Italic* = Awkward consequence.  

  | Position (Gloss) | Answer Pattern | Why Empty? (If Applicable) |
  |------------------|----------------|-----------------------------|
  | **1. Narrow Person-Affecting** <br>("Only harms to specific people matter") | **Consistently B/C** on non-identity cases (#1,3,4,5i,8,10). **A** on #9 (creating misery). "D" rare. | *Awkward: Lets you harm future groups if you change who exists.* |
  | **2. Asymmetric** <br>("Avoid creating miserable people, but no duty to create happy ones") | **A** on #9. **B/C** on #10. Mix of A/B on others, but **never A on #10**. | *Awkward: Creating a happy child is neutral, but creating an identical miserable child is monstrous.* |
  | **3. Impersonal Total** <br>("Add up wellbeing; more happy people is better") | **A** on #9. **B** on #10. **A** on #8 (funding Y prioritises more total wellbeing). | *Awkward: Favours massive populations with barely-worthwhile lives.* |
  | **4. Impersonal Average** <br>("Maximise average wellbeing, not total") | **A** on #9. **C/B** on #10 (adding a happy person may not raise averages). **D/B** on #8 (funding Y might not help averages). | *Awkward: Favours tiny, ultra-happy populations over larger, happier totals.* |
  | **5. Non-Comparabilist** <br>("Outcomes with different people can’t be judged") | **Mostly C** (especially on #1,3,4,5,6,8,10). **A** only on #9. | *Awkward: Paralyses long-term planning (flood defences, embryo selection).* |
  | **6. Wrongness Without Harm** <br>("Some acts wrong even if no one is harmed") | **D** on key cases (#1,3,7,9). C or B on #10. | *Awkward: Hard to define what makes it wrong if not harm.* |
  | **Unnamed Similarity-Sensitive** <br>(Your group’s common view) | **A** on #1, **B/C** on #2 (less wrong if lives are near-identical). | *Not a full theory; often paired with #1 or #6.* |
  | **Unnamed Baseline-Relative** <br>(Your flood defence split) | **A** on #5i (vs. better defence), **B/C** on #5ii (vs. doing nothing). | *Reflects disagreement about moral baselines.* |

  ---

  ### **What Your Quiz Can’t Do (And Why)**
  - **Q2 (Similarity) is the outlier**: No major theory explains why similarity matters. If you answered differently on #1 vs #2, you’re likely borrowing intuitions from #1 or #6 without a consistent framework.  
  - **#3 vs #4 (Total vs Average)**: Q8 and Q10 distinguish these. If you chose **A** on #8 (fund Y) + **B** on #10 → **Total**. **C/D** on #8 + **C/B** on #10 → **Average**.  
  - **Uncertainty (Q6)**: Answers here don’t map cleanly. If you chose **A**, you lean toward risk-aversion or #6. **B/C** suggests #1, #2, or #5.  
  - **Empty Combinations**:  
    - **Consistent A on #10 + B on #9**: (Creating misery isn’t wrong but creating happiness is?!) → *Incoherent*.  
    - **Mostly C + A on #7 (embryo selection)**: (Can’t compare outcomes… but selecting against disability is wrong?) → *Unattractive/unexplored*.  
    - **Mostly D + C on #9**: (Creating misery is wrong but not due to harm? But also can’t compare outcomes?) → *Incoherent*.  

  ---

  ### **Where Your Group Probably Disagrees**
  1. **Flood Defences (Q5)**: Baseline clash – "compared to better option" (A) vs. "compared to neglect" (B/C).  
  2. **Teen Parent (Q1 vs Q2)**: If similarity softens the wrongness, you lack a shared principle for *why*.  
  3. **Embryo Selection (Q7)**: If you answered **A** or **D**, you likely reject your mate’s "no one worse off" argument. **B/C** supports their view.  
  4. **Adding Happy People (Q10)**: Splits #2 (asymmetric) from #3 (total) and #4 (average).  

  This won’t "solve" the debate – but it’ll show whether your disagreements are about **harm**, **comparability**, **averages vs totals**, or **baselines**. If answers scatter randomly, your group might be wrestling with an unnamed in-between position.
