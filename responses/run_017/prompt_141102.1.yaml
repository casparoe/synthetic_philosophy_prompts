prompt: |-
  I direct a small qualitative team at a contract research organisation, and for the past year we have been building the item pool for a patient-reported outcome instrument for a chronic condition that has no biomarker: the symptoms are, for practical purposes, whatever patients say they are. The sponsor wants a draft pool in six weeks. What we actually do is concept-elicitation and then cognitive-debriefing interviews: forty-five minutes, semi-structured, one interviewer and one notetaker, recorded, transcribed, and coded the following weekend by three people with psychology degrees and no philosophical training, none of whom will read anything I give them beyond a one-page sheet. The output has to survive review by a psychometrician and a clinician and, eventually, a regulator asking what evidence we have that our items mean what we claim they mean. We are also running in three languages, and I do not trust our back-translations.

  I have been reading about Dennett's heterophenomenology — the idea, as I have it, that we treat subjects' utterances as texts to be interpreted rather than as authoritative verdicts on their own experience, and that the proper object of study is what people say about what goes on in them rather than any inner show we are supposed to take at face value. I want that turned into something my team can run. So: give me a protocol, in the order we would execute it, from the moment a transcript lands to the moment a candidate item is admitted, held back, or killed. For each gate I need the question to ask, what would count as a sufficient answer to it, the conditions under which the protocol simply returns a no, and the points at which it has to stop and hand the decision to a named human being because the question has stopped being one about evidence and become one about what we are trying to measure — whether the instrument is for detecting change in a trial or for giving patients a vocabulary, for instance. I have been using two homemade devices and I would like you to tell me whether they survive the translation or whether they quietly reintroduce the error the method exists to avoid. My two-route rule: a candidate item enters the pool only if the symptom concept turns up both in spontaneous recall during open elicitation and under structured probing, and only if no interviewer named it first. My gloss-swap test: later in the same interview, substitute the clinician's proposed gloss for the patient's own word, and count the concept as the patient's only if they go on to use the gloss unprompted; if they merely assent to it when offered, we treat it as ours rather than theirs.

  Then run the protocol on three cases, and I would rather you told me now if it kills an item my sponsor is attached to than let me find out at the pre-submission meeting. One: patients volunteer brain fog constantly, endorse it heavily, and cannot define it beyond metaphors that look like they came from a patient forum; the sponsor wants it as a headline item. Two: when the pain items are asked before the fatigue items, mean fatigue severity comes out roughly a point lower on the 0–10 scale than when the order is reversed, and I cannot tell whether we have an item or a framing artefact. Three: a patient reports a symptom in the room, in front of the clinic nurse, that their own daily electronic diary for the same fortnight does not support. A fourth, smaller thing while you are at it: the sponsor insists our items be worded as first-person claims about inner goings-on, and I have a suspicion the third-person stance of the method should make me resist that, but I cannot tell whether that is what the method really implies or a misreading on my part. Please do not point me at papers or reading lists — I have no library access from the field sites, so argue from the position itself, and note where the protocol is doing real work and where it is only a judgement call with procedural clothing on.

  Structure the response in these sections, in this order and roughly these lengths: What the method commits us to, in our vocabulary — about 250 words; The protocol — about 700 words, as numbered gates with question, sufficient answer, stop rule and escalation; Worked applications — about 700 words, one subsection per case in the order I gave them, plus a short note on the item-wording question; Where the protocol misfires — about 250 words, the questions it cannot settle for us and where a person must decide; The one-page version — about 200 words, the checklist I can pin up above the coding desk.
reasoning: |-
  Okay, the user directs a qualitative research team developing a patient-reported outcome (PRO) instrument for a chronic condition without biomarkers. They need a practical protocol based on Dennett's heterophenomenology to ensure items are valid and meaningful. The sponsor wants a draft pool in six weeks, and the team conducts interviews transcribed and coded by psychology graduates without philosophical training. The output must withstand regulatory scrutiny.

  First, I need to unpack heterophenomenology. Dennett's approach treats patient utterances as texts to interpret, not authoritative reports. This avoids assuming direct access to inner experiences. For the PRO instrument, this means focusing on what patients say and do, not their private feelings. The goal is operationalizing concepts from verbal behavior and observable evidence.

  The user's two homemade devices need evaluation. The two-route rule requires symptoms to appear in spontaneous recall and structured probing without interviewer prompting. The gloss-swap test replaces patient terms with clinician glosses; adoption of the gloss indicates validity. These seem aligned with heterophenomenology by emphasizing observable endorsement over assumed experiences.

  The protocol must handle transcripts to item decisions. Key gates: utterance identification, symptom concept extraction, spontaneous recall check, probing endorsement, two-route convergence, gloss-swap test, and context evaluation. Each gate needs clear questions, sufficient answers, stop rules, and escalation points. For example, if a symptom isn't spontaneously mentioned, it's rejected unless it passes all other checks and escalates to the director for contextual decisions.

  Case applications: Brain fog is volunteered and endorsed but poorly defined. Metaphors like "cotton wool head" are texts to interpret. Without a patient-adopted gloss or clear behavioral indicators, it shouldn't be an item. The sponsor's attachment conflicts, but the protocol rejects it due to lack of definable content. Escalation to the director is needed here due to sponsor pressure.

  Order effect on fatigue scores suggests framing artifact. The protocol flags this as a measurement confound. Without a stable construct across orders, the item isn't reliable. The solution might be split samples or order rotation, but the item is held back pending design adjustments. The psychometrician must decide on study design changes.

  Discrepancy between interview report and diary data indicates context-driven expression. The protocol treats the interview statement as a context-specific utterance. Without corroborating evidence, the symptom isn't added. This escalates to the director to consider diary data as part of the text corpus.

  First-person wording is acceptable if derived from patient language. The protocol's third-person stance is methodological, not item-wording. Items should use patient vernacular to ensure content validity. The key is grounding in patient texts, not stance.

  Protocol limitations include resolving value conflicts (e.g., sponsor vs. method), handling novel metaphors, and diary discrepancies. These require human judgment. The one-page summary should list gates with key questions and stop rules for coders.

  Overall, the protocol systematizes interpretation of patient texts, ensuring items reflect reportable experiences. It mitigates biases by requiring multiple evidence sources. The user's devices survive but need integration into the structured gates. The real work is in operationalizing utterances; judgment calls involve contextual decisions escalated to named roles.
answer: |-
  ## Heterophenomenological Protocol for PRO Item Validation

  **What the method commits us to (in our vocabulary):**  
  Heterophenomenology treats patient interviews as *texts* recording verbal behavior, not privileged access to inner states. We are studying *what patients report* and *how they express it*, not verifying private experiences. Our items must capture stable, intersubjectively observable concepts grounded in patient language and behavior during interviews. We reject any assumption that patients have infallible insight into their symptoms. Evidence comes from patterns in speech acts (e.g., spontaneous mentions, consistent endorsements, adoption of language), not presumed introspection. The "symptom" is the *reliably reportable concept* emerging from the text, validated by its behavioral footprint in the interview context. This protects against uncritical acceptance of vague terms or interviewer-led artifacts.

  ---

  **The Protocol (Gates 1-7):**  

  1.  **Gate: Utterance Identification**  
      *   **Question:** "Which transcribed utterances describe a potential symptom experience?"  
      *   **Sufficient Answer:** Utterance directly references a subjective state (e.g., "My head feels foggy," "The pain shoots down my leg," "I'm wiped out"). Includes metaphors and descriptions of impact ("It's like wading through treacle," "I can't think straight to work").  
      *   **Stop Rule (No):** Utterance describes only objective events, medical history (without linking to current symptom), treatment effects alone, or general well-being without specific symptom attribution.  
      *   **Escalation:** None. Coders flag ambiguous cases for team huddle (e.g., "I just feel *off*" – is this a symptom or a summary?).

  2.  **Gate: Symptom Concept Extraction**  
      *   **Question:** "What is the core, distinct symptom concept the patient is attempting to express in this utterance (using *their* words/phrases)?"  
      *   **Sufficient Answer:** A concise label/phrase capturing the patient's core description (e.g., "brain fog," "shooting leg pain," "crushing fatigue," "morning stiffness"). Must be derived *verbatim* or via clear paraphrase *from the patient's own words in this utterance*.  
      *   **Stop Rule (No):** Cannot isolate a distinct concept from the utterance; concept is entirely interviewer-introduced; concept is purely external (e.g., "my boss was angry").  
      *   **Escalation:** To **Team Lead** if concept is highly novel/metaphorical and core meaning is unclear (e.g., "It's like tiny gremlins are tap-dancing on my nerves").

  3.  **Gate: Spontaneous Recall Check**  
      *   **Question:** "Did this exact symptom concept (or its clear patient synonym) appear *spontaneously* during the open elicitation phase, *before* any structured probes related to it?"  
      *   **Sufficient Answer:** Patient introduces the concept without prompting during the initial "tell me about your symptoms" section. Synonyms count if the *core meaning* is identical (e.g., "exhausted" and "wiped out" for fatigue).  
      *   **Stop Rule (No):** Concept only appears *after* structured probing or interviewer suggestion.  
      *   **Escalation:** To **Team Lead** for borderline cases where patient *almost* introduces it spontaneously (e.g., pauses after "I get...", interviewer says "Yes?" and patient then says "brain fog").

  4.  **Gate: Structured Probe Endorsement**  
      *   **Question:** "Did the patient clearly *endorse* this specific symptom concept when it was probed about later in the structured section? (Endorsement = affirmation, elaboration, or clear example, not just 'yes' or silence)."  
      *   **Sufficient Answer:** Patient affirms the concept is relevant *to them*, provides details about *their* experience (severity, triggers, impact), or gives a personal example when probed.  
      *   **Stop Rule (No):** Patient denies experiencing it, says it's not relevant, or gives only vague/non-committal responses (e.g., "I guess sometimes," "Maybe," silence).  
      *   **Escalation:** To **Team Lead** if endorsement is ambiguous (e.g., "Well, other people on the forum talk about that...").

  5.  **Gate: Two-Route Convergence & Origin**  
      *   **Question:** "Did this symptom concept pass *both* Gate 3 (Spontaneous) *and* Gate 4 (Probed)? AND was the *initial verbalization* of the concept (in either place) definitively by the *patient*?"  
      *   **Sufficient Answer:** Yes to both parts. Concept emerges unprompted *and* is endorsed under probing, *and* the patient said it first.  
      *   **Stop Rule (No):** Fails either Gate 3 or Gate 4 OR the interviewer demonstrably named the concept first (e.g., "Do you experience brain fog?" before patient mentions it).  
      *   **Escalation:** To **Director** if the Two-Route rule fails narrowly but evidence is strong (e.g., passed Spontaneous & Probe, but *very* close call on who said it first). Director decides based on overall evidence weight and risk.

  6.  **Gate: Gloss-Swap Test**  
      *   **Question:** "If a clinician/researcher gloss was introduced later, did the patient subsequently *use the gloss unprompted* to describe their experience?"  
      *   **Sufficient Answer:** Patient actively incorporates the proposed gloss into their *own* vocabulary later in the interview without being prompted to use it (e.g., Later: "Yeah, that 'cognitive fatigue' really hits me after lunch"). Mere agreement ("Yes, that's it") is insufficient.  
      *   **Stop Rule (Hold/Kill):** If a gloss was offered and the patient *only* assented but did *not* later use it spontaneously, the concept is **Held Back**. It *may* represent a valid experience but lacks linguistic ownership. If no gloss was offered, proceed. **Kill** only if Gloss-Swap was attempted and failed *and* the concept is critically dependent on that specific gloss.  
      *   **Escalation:** To **Director** if the gloss is central to the intended item but failed the swap, to decide if the *patient's original term* is sufficient/usable. Director must consider measurement goals.

  7.  **Gate: Contextual Plausibility & Consistency Check**  
      *   **Question:** "Is the patient's report of this symptom *plausible* within the interview context and, where available, *consistent* with any concurrent data (e.g., diary mention, nurse observation noted in transcript)?"  
      *   **Sufficient Answer:** Report coheres with the patient's overall narrative, described impacts, and other reported symptoms. Minor inconsistencies (e.g., severity ratings) are expected.  
      *   **Stop Rule (Hold/Kill):** **Hold Back** if significant, unexplained inconsistency exists (e.g., reporting severe daily symptom in interview but *zero* mentions in contemporaneous diary). **Kill** only if the report is implausible within the context *and* lacks any supporting detail (e.g., describing a symptom physically impossible for the condition, with no corroborating behavior).  
      *   **Escalation:** To **Director** for any Hold decision based on inconsistency/plausibility. Director judges significance and whether supplementary evidence (like diary) should override the interview text *for this specific concept*.

  **Item Decision Point:** Only concepts passing **all** Gates 1-5 and Gate 6 (if applicable) *without* a Stop Rule/Hold, and receiving a "Sufficient" at Gate 7, are **Admitted** to the draft pool. Concepts on **Hold** require Director resolution. Concepts **Killed** at any gate are excluded.

  ---

  **Worked Applications:**

  1.  **Brain Fog (Sponsor's Headline Item):**  
      *   *Gates 1 & 2:* Pass. "Brain fog" is identified as a core concept from patient utterances ("My brain fog is terrible today," "It's like cotton wool in my head").
      *   *Gate 3 (Spontaneous):* Pass. Patients volunteer it constantly.
      *   *Gate 4 (Probe Endorsement):* Pass. Patients endorse it heavily when probed.
      *   *Gate 5 (Two-Route/Origin):* Pass. Spontaneous + Endorsed, patient-named.
      *   *Gate 6 (Gloss-Swap):* **FAIL.** Interviewers likely probe definitions ("What does 'brain fog' mean for you?"). Patients offer metaphors ("cotton wool," "swimming through mud") but *cannot define it operationally*. Crucially, if a clinician gloss (e.g., "cognitive impairment") is offered later, patients *assent* ("Yeah, that sounds right") but **do not spontaneously use the gloss later**. Their subsequent language reverts to "brain fog" or metaphors.
      *   *Gate 7 (Context):* Pass. Consistent within interview.
      *   **Protocol Outcome:** **Held Back** at Gate 6. The concept lacks a stable, patient-owned definition beyond the label and forum metaphors. It fails the Gloss-Swap test, indicating the *researcher* would be imposing meaning. *Escalation to Director:* Director must decide if the *term itself* "brain fog" is sufficient as an item *without* a researcher-defined gloss, accepting it as a phenomenological primitive patients recognize but cannot define – a significant risk for regulators questioning meaning. The sponsor's attachment is secondary to methodological rigor here.

  2.  **Fatigue Severity Order Effect:**  
      *   *Gates 1-5:* Pass for the fatigue *concept* itself. Fatigue is spontaneously mentioned and endorsed.
      *   *Gate 6 (Gloss-Swap):* Likely Pass (if severity is framed as patient's term, e.g., "how wiped out?").
      *   *Gate 7 (Context):* **HOLD.** The core issue isn't the *concept* of fatigue, but the *measurement* of its severity. The systematic shift (1 point lower when preceded by pain items) indicates the rating is context-dependent. The symptom report ("I feel fatigued") is plausible, but the *assigned number* is inconsistent based on framing.
      *   **Protocol Outcome:** **Hold Back** at Gate 7. The item (specifically the 0-10 severity rating attached to the fatigue concept) is unstable. *Escalation to Director & Psychometrician:* This is a measurement design flaw, not a concept validation failure. The protocol flags it as unreliable in its current form. Solution requires experimental redesign (e.g., counterbalancing order in future interviews/debriefing, testing alternate item wording/context). The item isn't killed, but its current rating format is held pending design fix.

  3.  **Symptom Reported in Interview but Not Diary:**  
      *   *Gates 1-5:* Pass for the *concept* reported in the interview (assuming spontaneous mention, endorsement).
      *   *Gate 6 (Gloss-Swap):* Pass/Fail depends on specifics, but assume Pass.
      *   *Gate 7 (Context):* **HOLD.** The report in the interview ("I had severe [Symptom X] every afternoon last week") is inconsistent with the concurrent daily eDiary showing *no* reports of Symptom X during the same fortnight. The diary is treated as part of the behavioral/text corpus.
      *   **Protocol Outcome:** **Hold Back** at Gate 7. The inconsistency is significant and unexplained. *Escalation to Director:* Director must interpret the texts. Possible explanations: Interview context (nurse presence) influenced reporting (social desirability/demand characteristics); Diary was burdensome/inaccurate; Symptom is episodic and missed by diary timing; Patient interprets "severity" differently in each format. Director decides if the interview report stands as valid evidence *despite* the diary (e.g., if detailed in interview, plausible) or if the diary evidence overrides it. Concept is not killed outright, but requires human judgment on which text (interview or diary) better reflects the reportable concept.

  4.  **Item Wording - First-Person Claims:**  
      Heterophenomenology's "third-person stance" is *methodological* – we analyze reports *as texts*. It does *not* dictate item wording. First-person wording ("I have brain fog," "My pain is severe") is standard and acceptable for PROs, as long as it reflects the *patient's own linguistic expressions and concepts* identified through the protocol. The key is that the *meaning* of the item is grounded in the patient-derived text, not that the item is written in the third person. Insisting on first-person aligns with capturing the patient's *reporting perspective*. Your instinct to resist might stem from conflating the *analytical stance* with the *response format*. The protocol ensures the content is patient-centered; the grammatical person of the item is a separate, pragmatic choice. Sponsor's request is reasonable *if* the wording stems from patient language.

  ---

  **Where the Protocol Misfires (Requiring Human Judgment):**

  1.  **Resolving Value Conflicts:** The protocol flags issues (Hold/Kill), but *overriding* them involves non-methodological values. Escalating "brain fog" means deciding: Is capturing a prevalent, recognizable-but-vague patient term worth the regulatory risk? The Director must weigh scientific rigor against sponsor needs and patient voice.
  2.  **Interpreting Novel Metaphors:** Gate 2 escalation occurs for utterly novel descriptions (e.g., "gremlins tap-dancing"). The Team Lead/Director must judge if it represents a distinct, codable symptom concept or idiosyncratic noise, based on detail and coherence.
  3.  **Significance of Inconsistencies:** Gate 7 flags diary-interview mismatches or implausibilities. The Director must decide *why* the inconsistency exists and which source (if either) is more credible/representative of the reportable experience, considering context (e.g., social desirability, diary burden).
  4.  **Defining "Sufficient" Endorsement/Detail:** Gates 4 and 7 rely on coder/lead judgment for what constitutes "clear" endorsement or "sufficient" detail/plausibility. The protocol provides structure but not absolute thresholds.
  5.  **Handling "Held Back" Items:** The protocol identifies problems but doesn't prescribe fixes. The Director/team must creatively problem-solve (e.g., re-testing brain fog with different debriefing, redesigning the fatigue severity question).

  ---

  **The One-Page Version: Heterophenomenology Item Validation Checklist**

  1.  **FIND IT:** Is it a symptom utterance? (NO = Ignore)
  2.  **NAME IT:** What's the core patient concept? (Can't define? ESCALATE Lead)
  3.  **SPONTANEOUS?** Did patient say it *first*, unprompted? (NO = KILL)
  4.  **ENDORSED?** Did patient clearly affirm/describe it when probed? (NO = KILL)
  5.  **TWO-ROUTE?** Passed 3 AND 4? AND patient said it first? (NO = KILL / ESCALATE Dir)
  6.  **GLOSS-SWAP:** If we gave a "scientific" word, did patient USE it themselves later? (Only said yes? HOLD / ESCALATE Dir; Didn't use it? HOLD)
  7.  **MAKES SENSE?** Consistent in interview? Fit with diary/notes? (Unexplained mismatch/implausible? HOLD / ESCALATE Dir)
  8.  **DECIDE:** Passed ALL gates clearly? **ADMIT**. Else: **HOLD/KILL** per rules above. **ESCALATE** ambiguities to Lead/Dir as noted.

  **Key Rules:**  
  *   **KILL:** Fails Gate 3, 4, or 5.  
  *   **HOLD:** Fails Gloss-Swap (Gate 6) OR Context Check (Gate 7).  
  *   **ADMIT:** Clear pass on ALL Gates (1-5, and 6 if gloss used, and 7).  
  *   **ESCALATE:** Ambiguities at any gate (Lead), or Holds/Kills needing override (Dir).  
  *   **CORE:** Patient words first. Patient adoption key. Behavior over belief.
