  Good morning. It’s a profound honour to open this symposium celebrating Professor Aris Thorne’s seventy years. To her family here – her partner Leo, her sister Marta, her grandchildren Eli and Maya – welcome. You know Aris best as the fiercely passionate, deeply warm person she is. To our colleagues, you know the towering intellect, the unwavering advocate for clarity, the mentor who shaped careers.

  Aris didn’t just *do* mathematics; she demanded we *build* it, brick by verifiable brick. For thirty years, that small brass bell rang out against shortcuts, against assuming what hadn’t been constructed. It was a call to rigor, a reminder that truth isn’t found in leaps of faith over logical chasms, but in the careful laying of pathways. Her programme, embodied in texts like *Foundations of Constructive Metric Analysis*, provides the tools to build those pathways across analysis.

  Her influence is tangible, concrete. Consider her student Priya Sharma, whose constructive proof of the Ergodic Theorem for continuous flows required novel approximations – the kind Aris insisted upon. Or Marcus Chen, whose work on constructive spectral theory directly extends her methods for handling unbounded operators. These are not just names; they are witnesses to her dedication to training builders.

  Which brings us to her central conjecture concerning the effective stability of certain dynamical systems. It remains *actively unresolved*. Not "unknown" in some platonic sense, but genuinely open territory, a challenge awaiting new constructions, perhaps new definitions entirely. It stands as an invitation, not a mystery waiting passively for revelation.

  And speaking of territory: Constructively, if you want to cross from praise for her precision to a joke about approximation, you can guarantee finding points arbitrarily close to zero along the path, but handing over the *exact* crossing point? That requires stronger conditions. Aris would ring the bell until you specified *exactly* what you meant by "funny" and constructed the point. So, in the spirit of constructive approximation, let’s just say my gratitude for her mentorship lies very near zero on the scale of things left unsaid, and we have two full days to converge on the exact value.

  Aris, thank you. For the precision, the passion, the path you’ve built. May this symposium honour your work by building upon it, rigorously, constructively, point by point. Let’s begin.

