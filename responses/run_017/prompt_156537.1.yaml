  3.  **Open Conjecture Suspended:** Described as "actively unresolved," "genuinely open territory," "a challenge awaiting new constructions," and "an invitation." Avoids "unknown," "not known," "true/false," or "waiting to be found."
  4.  **Existential Claims Witnessed:** "Priya Sharma... constructive proof of the Ergodic Theorem" and "Marcus Chen... work on constructive spectral theory" are specific witnesses to "Her influence is tangible, concrete" and "training builders."
