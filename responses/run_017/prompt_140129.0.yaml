  **1. Is there a legally valid, unexpired directive that directly applies?**  
  *If YES, follow it and stop. If NO, proceed.*  
  **→ Marta**: Directive lapsed (37 years old, unaffirmed); voids automatically.  
  **→ Ray**: Second directive void (botched witnessing, sedatives); first remains valid but unconfirmed.  
  **→ Odile**: No directive exists.  

  **2. Can the patient’s current, consistent actions or words directly address this treatment?**  
  *If YES, follow and stop. If NO, proceed.*  
  **→ Marta**: Pushes away pills daily, but this is general (not specific to antibiotics); inconclusive.  
  **→ Ray**: No current expression; early dementia may impair capacity.  
  **→ Odile**: Minimally conscious; no actions/words.  

  **3. Does unambiguous past evidence (not legally binding) *specifically* describe this scenario?**  
  *If YES, proceed to step 4. If NO, jump to step 5.*  
  **→ Odile**: Letter explicitly rejects machines "for children’s sake"; scenario matches ventilator.  
  **→ Marta**: Directive specifically mentions pneumonia + unrecognized family; scenario matches.  
  **→ Ray**: Recovery clause addresses "illness saying I’m not worth treating," but aggressive treatment context is unclear.  

  **4. Could the patient have reasonably foreseen *this exact quality of life* when they wrote it?**  
