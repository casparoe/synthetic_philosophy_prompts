answer: |-
  ### Question Text (196 words)
  Consider an expressivist "pair-attitude" view: accepting a moral sentence \(A\) expresses a non-cognitive attitude (e.g., approval) toward \(A\)'s content; accepting "if \(A\) then \(B\)" expresses this attitude directed at the ordered pair \(\langle A, B\rangle\) (equivalently, being against \(\langle A, \neg B\rangle\)); and accepting "\(\neg A\)" expresses a distinct tolerance attitude toward \(A\). Evaluate these inferences:  
  (i) \(A\); if \(A\) then \(B\); so \(B\).  
  (ii) if \(A\) then \(B\); \(\neg B\); so \(\neg A\).  
  (iii) if \(A\) then \(B\); if \(B\) then \(C\); so if \(A\) then \(C\).  
  (iv) if \(A\) then \(B\); if \(\neg A\) then \(B\); so \(B\).  

  Which inference is most problematic for this view? Identify the structural feature that distinguishes problematic from unproblematic cases. Does solving one problem extend to others?  

  Now, suppose speakers can be indifferent toward moral content (neither for nor against). With negation as a content-forming operator (so \(\neg A\) is a content), what does accepting "\(\neg A\)" express? How does this affect the problem you identified?  

  ---

  ### Model Answer (398 words)  
  Inference (iv) is the most problematic. The pair-attitude view handles (i)–(iii) because the conclusion’s attitude is derivable from combinatorial operations on the premise-attitudes: for (i), approving \(A\) and \(\langle A, B\rangle\) entails approving \(B\); for (ii), approving \(\langle A, B\rangle\) and the tolerance attitude for \(B\) (from \(\neg B\)) entails tolerance for \(A\); for (iii), approving \(\langle A, B\rangle\) and \(\langle B, C\rangle\) entails approving \(\langle A, C\rangle\). However, (iv) fails because approving \(\langle A, B\rangle\) and \(\langle \neg A, B\rangle\) does not entail approving \(B\)—the premises only express attitudes toward pairs involving \(A/\neg A\), not \(B\) alone. The critical structural feature is whether the conclusion requires a *non-pair* attitude (e.g., toward a single proposition like \(B\)) that cannot be "extracted" from pair-directed attitudes. (iv) demands this, while others do not. A solution for (i) (e.g., defining pair-attitudes to imply constituent attitudes) fails for (iv), as pair-attitudes for complementary antecedents (\(\langle A, B\rangle\) and \(\langle \neg A, B\rangle\)) do not force commitment to \(B\) without additional assumptions.  

  Introducing indifference redefines negation: "\(\neg A\)" is now a content, so accepting it cannot be a primitive tolerance attitude. Instead, it expresses an attitude *toward the content* \(\neg A\), such as disapproval of \(A\) (equating acceptance of \(\neg A\) with being against \(A\)). This creates ambiguity: if indifference is possible, accepting \(\neg A\) could mean either disapproval of \(A\) or indifference toward \(\neg A\), but these are distinct (disapproving of \(A\) is not indifference). This undermines the original tolerance-based account of negation. For (iv), the problem worsens: even with "if \(A\) then \(B\)" and "if \(\neg A\) then \(B\)" expressing approval of \(\langle A, B\rangle\) and \(\langle \neg A, B\rangle\), a speaker indifferent to \(A\) and \(\neg A\) might still lack approval of \(B\). Pair-attitudes alone cannot compel a stance on \(B\), as indifference toward the antecedents blocks the inference. Thus, (iv)’s core issue—generating a non-pair attitude from pair-premises—remains unresolved and is exacerbated by neutrality options.  

  ---

  ### Marking Scheme (20 marks total)  
  - **4 marks**: Correctly identifies inference (iv) as the most serious problem and rejects recitations of generic Frege-Geach issues.  
  - **4 marks**: Accurately explains the structural distinction—unproblematic inferences (i–iii) derive pair or component attitudes combinatorially, while (iv) requires a non-pair attitude toward \(B\) that is not extractable from the premises.  
  - **4 marks**: Correctly argues that a solution for one inference (e.g., modus ponens in (i)) does not extend to (iv), as pair-attitudes for complementary antecedents do not entail the conclusion’s non-pair attitude.  
  - **4 marks**: Clarifies that with indifference, "\(\neg A\)" expresses an attitude toward content \(\neg A\) (e.g., disapproval of \(A\)), noting confusion if negation is not a primitive attitude (e.g., indifference to \(\neg A\) ≠ disapproval of \(A\)).  
  - **4 marks**: Demonstrates that indifference intensifies (iv)’s problem—pair-attitudes plus possible neutrality on \(A\)/\(\neg A\) still fail to necessitate approval of \(B\), leaving the inference unsupported.
