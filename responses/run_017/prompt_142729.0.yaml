prompt: |-
  writing the take-home for my 3rd-year metaethics seminar — last question on the Frege–Geach section — and i want something where skimming the online encyclopedia entry the night before earns you a B at best. I need the question text, a model answer, and a marking scheme. No reading lists and no see-Blackburn-1984-style pointers, I'll bolt those on myself.

  The shape I have in mind: set up the standard pair-attitude fix inside the question itself — accepting a moral sentence A is a non-cognitive attitude toward the content of A, accepting "if A then B" is that attitude directed at the ordered pair ⟨A, B⟩ (or, if you like, being against ⟨A, not-B⟩), and accepting "not A" is a separate tolerance attitude toward A. Then give them four inference patterns with moral A, B, C: (i) A; if A then B; so B. (ii) if A then B; not B; so not A. (iii) if A then B; if B then C; so if A then C. (iv) if A then B; if not-A then B; so B.

  I've been calling (iv) the whether-or-not case and I can't find it discussed anywhere, which is half of why I want it. Ask them which of the four is the real problem and why — not to run through all four, but to say what structural feature seperates the ones the pair-attitude view handles from the ones it doesn't, and whether one fix covers everything. Then stipulate that a speaker can be indifferent toward a moral content, neither for it nor against it, and ask what that does to their answer — in particular what "not A" can even mean on the version of the view where negation has become a content-forming operator rather than a separate attitude.

  Give me the question first, then the model answer, then the scheme, no preamble. Hard limits: question text 200 words max, model answer 400 words max, marking scheme five bullets of one sentence each with marks out of 20. The one thing I want the scheme to punish is the recitation move — anyone who just writes that expressivists owe an account of how moral sentences keep their meaning in unasserted contexts shouldn't get past partial credit.
reasoning: |-
  We are creating a take-home exam question for a metaethics seminar focusing on the Frege-Geach problem. The question sets up a specific non-cognitive expressivist view (the "pair-attitude" view) and presents four inference patterns. The student must identify which inference is the real problem for this view and explain why, based on structural features. Then, they must consider a modification (indifference as a third attitude) and its implications, especially for negation.

  Constraints:
  - Question text: max 200 words.
  - Model answer: max 400 words.
  - Marking scheme: five bullet points, one sentence each, with marks out of 20.

  The question should not allow skimming an encyclopedia to get a B; it requires deep understanding.

  Question text (under 200 words):

  "Consider an expressivist view where: accepting a moral sentence A expresses a non-cognitive attitude (e.g., approval) toward A's content; accepting 'if A then B' expresses this attitude directed at the ordered pair ⟨A, B⟩ (or equivalently, being against ⟨A, not-B⟩); and accepting 'not A' expresses a distinct tolerance attitude toward A. Now consider these four inferences:

  (i) A; if A then B; therefore B.
  (ii) if A then B; not B; therefore not A.
  (iii) if A then B; if B then C; therefore if A then C.
  (iv) if A then B; if not-A then B; therefore B.

  Which of these inferences poses the most serious problem for this view? Explain the structural feature that distinguishes problematic from unproblematic inferences for the pair-attitude view. Would a solution for one problematic inference extend to others? 

  Next, suppose we allow indifference: a speaker can be indifferent toward a moral content (neither for nor against). Now, what does 'not A' express? Given that negation is now a content-forming operator (so 'not A' has a content toward which one can have attitudes), how does this affect the problem you identified? (Max 200 words.)"

  Model answer (under 400 words):

  "The most serious problem arises in inference (iv). The pair-attitude view can handle (i)-(iii) because the attitudes expressed by the premises combine to yield the attitude required for the conclusion. For (i): accepting A (attitude toward A) and accepting 'if A then B' (attitude toward ⟨A,B⟩) together yield attitude toward B. Similarly, (ii) and (iii) work because the attitudes toward the pairs and the negation (as a separate attitude) combine appropriately. However, (iv) fails: accepting 'if A then B' (attitude toward ⟨A,B⟩) and 'if not-A then B' (attitude toward ⟨not-A,B⟩) does not necessarily yield an attitude toward B alone. The structural feature is that in (i)-(iii) the conclusion's attitude is about a content that is a component of the pairs in the premises, while in (iv) the conclusion requires an attitude about B without A or not-A being part of the content.

  A solution for (i) does not extend to (iv) because (iv) involves two conditional premises with complementary antecedents, requiring an attitude about the consequent alone.

  Introducing indifference complicates negation. If 'not A' is now a content (¬A), then the attitude for negation must be redefined. We might say that accepting ¬A is being against A (as before) but now we have three possible attitudes: for, against, indifferent. However, the tolerance attitude (for 'not A') becomes problematic because we now have a content ¬A toward which one can be for (which is being against A), against (which would be being for A?), or indifferent. This leads to a proliferation of attitudes. Moreover, for inference (iv): if we accept 'if A then B' and 'if ¬A then B', we still cannot derive an attitude toward B because we might be indifferent toward A and ¬A? Actually, the problem remains: we have attitudes toward ⟨A,B⟩ and ⟨¬A,B⟩, but without a stance on A or ¬A, we might be indifferent to both and hence not commit to B. Thus, the problem in (iv) persists and is even more evident with indifference."

  Marking scheme (five bullets, one sentence each, with marks out of 20):

  - Correctly identifies inference (iv) as the most serious problem and explains that it requires an attitude toward B alone which is not generated from the pair-attitudes: 4 marks.
  - Clearly articulates the structural feature: problematic inferences require an attitude about a component (B) that is only part of a pair in the premises, whereas unproblematic ones have the conclusion's content as a component of the pairs: 4 marks.
  - Correctly assesses that a solution for one (e.g., modus ponens) does not extend to (iv): 4 marks.
  - Explains that with indifference, 'not A' becomes a content (¬A) and the attitude for negation must be redefined (e.g., accepting ¬A might be being against A), and notes the potential for confusion (e.g., being against ¬A would be being for A): 4 marks.
  - Explains that the problem in (iv) remains (or is exacerbated) because the pair-attitudes do not force an attitude toward B, especially if one is indifferent to A and ¬A: 4 marks.

  Total: 20 marks.

  Note: We are punishing the recitation move. So if a student only writes about the general Frege-Geach problem (meaning in unasserted contexts) without addressing the specific pair-attitude view and the four inferences, they should not get more than partial credit. The marking scheme focuses on the specific tasks.

  Let's count the words in the question and model answer to ensure they are within limits.

