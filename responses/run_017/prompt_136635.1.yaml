answer: |-
  Below is a comprehensive design for your Maxwell's demon/Landauer's principle activity, optimized for your constraints. It prioritizes hands-on discovery, minimizes math, and uses tangible metaphors to illustrate abstract concepts. The core innovation is using **weight as the hidden property** (since magnetism requires specialized materials), **sliding tokens for recording**, and **water-pumping for erasure cost** (visible, countable, and effortful). 

  ---

  ### 1. Physical Apparatus ($50 Budget)
  **Materials** (buy at hardware/craft stores):  
  - **Tray & partition**: Two shallow plastic storage bins (30×40 cm) placed side-by-side. Partition: cardboard divider with a 10 cm-wide sliding cardboard shutter.  
  - **Balls**: 8 identical-looking plastic balls (e.g., ping-pong balls). **4 heavy** (filled with sand + glue) and **4 light** (empty). Spray-paint all white to hide weights.  
  - **Trapdoor ramp**: Cardboard ramp (30 cm long, 20° incline) attached to the partition. Flap at the bottom: lightweight plastic (e.g., cut from a binder) with rubber-band tension.  
  - **Measuring tool**: Simple balance scale (two small cups on strings attached to a ruler).  
  - **Curtain**: Fabric sheet hung from a dowel rod to block view of the tray.  
  - **Tally board**: Plywood with **4 slots** (horizontal grooves holding tokens). Tokens: 4 wooden tiles (5×5 cm) painted white.  
  - **Recording**: Dry-erase markers to write "H" (heavy) or "L" (light) on tokens.  
  - **Erase station**: Hand-powered water pump ($10 aquarium pump) connected to two jars. Source jar (full), ash-bin jar (empty). Pumping moves water visibly.  
  - **Other**: Stopwatch, tape, jar for "ash tokens" (marbles).  

  **Why these numbers?**  
  - **8 balls (4H/4L)**: Small enough to list arrangements (70 possible microstates), large enough to force erasure with 4 slots.  
  - **4 slots**: Forces reuse (and thus erasure) after measuring 4 balls.  
  - **Pump 10 times per erasure**: Effortful, countable, and water movement visualizes energy dissipation.  

  **Setup**:  
  - Tray left = "mixed" side, right = "sorted" side (heavy balls should end up here).  
  - Erase station 5m away from the tray.  

  ---

  ### 2. Roles & Rule Cards
  Rotate roles every round. Cards use simple instructions:  
  **Sorters (2)**:  
  - "Work behind the curtain. Weigh balls one-by-one on the scale.  
  - Write ‘H’ or ‘L’ on a token and place it in a slot. Only move a ball if its token is on the board.  
  - If all slots are full, carry a token to the erase station to clear it. Return with a blank token."  

  **Auditor (1)**:  
  - "Watch sorters: No peeking behind the curtain!  
  - Ensure tokens are used for every move.  
  - At the erase station, enforce 10 pumps per token. Drop an ash token (marble) in the jar after 10 pumps."  

  **Ledger Keeper (1)**:  
  - "After each round, lift the curtain. Count:  
    - Heavy on the right? Light on the left? (Each gives +1)  
    - Total ash tokens (erasures).  
    - Total tokens used (recordings).  
    Write: [Round] | Correct balls | Recordings | Erasures."  

  ---

  ### 3. Accounting (Simple Version)  
  **Key idea**: Convert order to "bits saved" by counting possibilities before/after. Start small to teach the concept:  
  - **2 balls (1H, 1L)**:  
    - *Before sorting*: 2 possibilities (H on left/L on right, or vice versa).  
    - *Perfect sorting*: 1 possibility → Bits saved = log₂(2/1) = 1 bit.  
    - *Messy sorting*: e.g., both on left → Bits saved = log₂(2/2) = 0 bits.  
  - **4 balls (2H, 2L)**:  
    - *Before*: 6 possibilities (C(4,2) = 6 ways to pick heavy balls).  
    - *Perfect sorting*: Bits saved = log₂(6/1) ≈ 2.58 bits.  
    - *Messy (e.g., 1H right, 1H left)*: 4 possibilities → Bits saved = log₂(6/4) ≈ 0.58 bits.  

  **8-ball formula (for ledger keeper)**:  
  - Bits saved = log₂(70 / [C(4, Hₗ) × C(4, Lₗ)])  
    - Hₗ = Heavy on left, Lₗ = Light on left.  
    - C(4,k) = (4×3×2×1)/(k!×(4-k)!) [Provide cheat sheet with values].  
  - **Partial order**: Use the formula. Participants see that bits saved < recordings/erasures.  

  ---

  ### 4. Round Structure (90 Min Timeline)  
  **0:00–0:10**  
  - **Intro (5 min)**: "Today we’re Maxwell’s demons! Sort heavy balls to the right, light to the left. You can’t see weight—only weigh balls."  
  - **Setup (5 min)**: Assign roles, show apparatus.  

  **0:10–0:20: Warm-up (open curtain)**  
  - Curtain open. Sorters weigh balls and move them.  
  - *Debrief*: "Easy? You used your eyes and memory instead of tokens."  

  **0:20–0:30: Blind, no-notes round**  
  - Curtain closed. No tokens allowed. Sorters rely on memory.  
  - *Goal*: Experience chaos. Ledger reports low correct balls.  

  **0:30–0:50: Tally-board round**  
  - Use tokens/slots. Erase station active (10 pumps = 1 erasure).  
  - *Goal*: Discover recording/erasure cost. Ledger shows erasures > bits saved.  

  **0:50–1:00: Trapdoor round**  
  - Remove scale. Sorters release balls down the ramp with the trapdoor.  
  - *Goal*: Test the "passive" solution. Flap jams or lets wrong balls through.  

  **1:00–1:10: Lazy demon round (droppable)**  
  - Sorters may use fewer recordings (e.g., only record "H" or every other ball).  
  - *Goal*: Trade-off between cost (recordings/erasures) and order.  

  **1:10–1:20: Archive demon round (droppable)**  
  - Unlimited blank tokens. "Erase" = archive token in a box. No pumping.  
  - *Goal*: Grow a mountain of tokens. Discuss: "Where is the cost now?"  

  **1:20–1:30: Teardown & debrief**  

  ---

  ### 5. Debrief Script  
  - **Measurement**: Weighing a ball ("You gathered data").  
  - **Recording**: Writing "H/L" on a token ("Storing data takes space").  
  - **Erasure**: Pumping to clear a token ("Forgetting data requires work—see water moved? That’s energy lost").  
  - **Ash bin**: Pumped water = dissipated energy. Ash tokens = count of erasures.  
  - **Open-curtain "free lunch"**: "You used your brain, not tokens. But brains burn energy—paid by your breakfast! No free measurement."  
  - **Trapdoor failure**: "No notes, but the flap isn’t perfect. Real one-way devices need energy to reset."  
  - **Lazy/archive trade-offs**: "Coarse recording saves erasures but loses order. Archiving defers cost but fills space (a physical burden)."  

  ---

  ### 6. Handling Your Loophole (Endless Tape)  
  - **Activity moment**: In the archive round, tokens pile up. Ask:  
    - "What if we have infinite tokens and space? Can we avoid cost?"  
    - "Look at the archive box. It’s growing. Storing it takes shelf space, making tokens uses materials. The *deferred cost* becomes clutter or manufacturing energy."  
  - **Key insight**: The loophole **delays but does not eliminate** the cost. The second law holds at every *finite* stage—the archive is part of the system.  

  ---

  ### 7. Predictable Problems & Solutions  
  - **Cheating**: Auditor enforces "no memory." If caught, declare: "Your brain paid the cost!"  
  - **Trapdoor failure**: Pre-test ramp tension. When it jams, say: "Real demons face friction!"  
  - **Bottleneck at erase station**: "This is like a slow CPU—demons wait for memory!"  
  - **"Rules are rigged"**: "Yes! We’re modeling a physics principle. Real entropy is subtler."  
  - **Spring vs. heat**: "Pumping is a *metaphor* for energy loss. In atoms, erasure heats the environment."  
  - **Algebra hostility**: Use counting, not formulas. Ledger keeper uses pre-calculated bit values.  

  ---

  ### 8. Limitations & Honesty  
  **State explicitly at the end**:  
  - "This activity **cannot show**:  
    - The *exact* energy cost (kT ln 2 per bit erased in real physics).  
    - How molecular-scale measurements *can* be free (they don’t *always* cost energy).  
    - That the second law is *statistical* (with 10²³ objects, violations are possible but absurdly unlikely).  
    - That ‘information’ here means *reduction in possibilities*, not ‘useful knowledge’."  
  - **Walk-to-erase as metaphor**: "It’s **not a genuine model of dissipation** (which is about heat, not footsteps). But it shows erasure requires *physical work*, and work must be paid for. In real chips, this work becomes heat."  

  **Final note**: "Landauer’s principle isn’t about demons being ‘caught’—it’s that *any* irreversible information process has a minimal energy cost. Today, you felt that cost in your muscles."  

  --- 
  This design balances simplicity with conceptual depth. It transforms abstract ideas into visceral experiences, using friction, weight, and water to embody information thermodynamics. Test the trapdoor ramp and pump beforehand to ensure reliability!
