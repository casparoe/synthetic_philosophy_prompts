  ### Rationality and Choice Seminar: In-Class Activity Design

  Below is a complete design for an 80-minute in-class activity that meets your constraints and objectives. The activity uses a cover story about "movie night choices" to induce cyclic preferences through a natural comparison rule (majority rule on three dimensions). Students start with a common option and chips, then participate in two market phases (A and B) differing only in the announcement of closing time. Halfway through, students rotate into a trader role to exploit recorded preferences. The debrief maps student experiences to your key concepts without using technical terms until the end.

  **Core Learning Goal**: Students experience how cyclic preferences create a diachronic dilemma where no policy (e.g., "always trade" or "stop after k trades") is unambiguously best, revealing that rationality must involve more than myopic choice.

  ---

  ### **Materials and Handouts**
  **Handout 1: Movie Night Options**  
  *Distribute at the start; students keep this for reference.*  

  > **Background**: Imagine you’re choosing a movie to stream tonight. Movies are described by three attributes:  
  > - **Genre**: Comedy > Drama > Action (you rank Comedy highest, Action lowest).  
  > - **Length**: Short (90 min) > Medium (120 min) > Long (150 min) (shorter is better).  
  > - **Rating**: High (4.5 stars) > Medium (3.5 stars) > Low (2.5 stars) (higher is better).  
  >   
  > **Rule for Comparison**: When choosing between two movies, prefer the one that wins on **at least two attributes** (majority rule).  
  >   
  > **Movie Options**:  
  > - **Movie A**: Comedy (best genre), Medium length (mid-tier), Low rating (worst).  
  > - **Movie B**: Drama (mid-tier genre), Long length (worst), High rating (best).  
  > - **Movie C**: Action (worst genre), Short length (best), Medium rating (mid-tier).  
  >   
  > *Verify the cycle with majority rule*:  
  > - **A vs. B**: A wins on genre (Comedy > Drama) and length (Medium > Long); B wins on rating (High > Low). A wins 2–1 → **A preferred to B**.  
  > - **B vs. C**: B wins on genre (Drama > Action) and rating (High > Medium); C wins on length (Short > Long). B wins 2–1 → **B preferred to C**.  
  > - **C vs. A**: C wins on length (Short > Medium) and rating (Medium > Low); A wins on genre (Comedy > Action). C wins 2–1 → **C preferred to A**.  
  >   
  > *Most students will have cyclic preferences (A > B, B > C, C > A) under this rule, as it mirrors real non-compensatory decision-making (e.g., choosing based on "dealbreakers")*.

  **Handout 2: Record Sheet & Market Rules**  
  *Distribute with Handout 1; students complete the record sheet privately.*  

  > **Chip Value**: Each chip = 0.1% bonus toward your final seminar grade (e.g., 10 chips = 1% bonus). *This is trivial but not worthless, avoiding distortion*.  
  >   
  > **Starting Point**: You have **Movie A** and **10 chips**.  
  >   
  > **Record Your Preferences**: For each swap, write the **maximum chips (0–10)** you would pay to make it happen *if offered*.  
  > 1. Swap from **A to C**: I would pay up to _____ chips.  
  > 2. Swap from **C to B**: I would pay up to _____ chips.  
  > 3. Swap from **B to A**: I would pay up to _____ chips.  
  >   
  > **Market Rules**:  
  > - You can only swap **one step** in the cycle: A→C, C→B, or B→A (no direct swaps like A→B).  
  > - Each swap costs **1 chip** (paid to the "house").  
  > - You may refuse any swap.  
  > - Keep track of your holdings (movie + chips) after each action.  
  >   
  > **Phase A**: The market will open for **exactly 3 rounds**. After Round 3, it closes.  
  > **Phase B**: The market stays open, with the same swaps available. Closing time is **not announced**—trade until it ends.  

  ---

  ### **Minute-by-Minute Timeline** (80 minutes total)
  - **0–5 min**: Introduce activity.  
    - *Instructor*: "Today we’re exploring how choices play out over time. You’ll make decisions about movie options, starting with Movie A and chips. Read the handouts, record your swap values privately, and follow the market rules. Chips affect your grade, so treat them seriously."  
    - Distribute handouts. No theory terms or hints about cycles/pumps.

  - **5–15 min**: Students review options and record swap values.  
    - *Instructor*: Silently observe; ensure students record values independently.  
    - *Critical*: Students must record values *before* trading to create commitment (Constraint 4).

  - **15–20 min**: Explain Phase A rules.  
    - *Instructor*: "Phase A starts now. You’ll have exactly 3 rounds. In each round, I’ll say ‘Swap now’ and you may request a swap. Only cycle swaps allowed (A→C, C→B, B→A)."

  - **20–30 min**: Conduct Phase A (3 rounds).  
    - *Structure*:  
      - **Round 1**: All start at A. Announce: "Swap now: A→C available." Students raise hands to swap (cost: 1 chip).  
      - **Round 2**: Announce: "Swap now: C→B available for those at C; others hold."  
      - **Round 3**: Announce: "Swap now: B→A available for those at B; C→B for those at C; others hold."  
    - *Logistics*: Quickly note who swaps each round. Students update holdings.  
    - *Expected outcome*: ~75% swap in Round 1 (A→C). ~60% swap in Round 2 (C→B). ~70% swap in Round 3 (B→A or C→B). Most end at A or B with 7–9 chips.

  - **30–35 min**: Explain Phase B rules.  
    - *Instructor*: "Phase B starts now. Same swaps, but the market stays open. I won’t announce when it closes—trade when you want."

  - **35–42 min**: Conduct Phase B.  
    - *Structure*: Allow swaps for 5–6 minutes. Students raise hands to request swaps; process in order. Close unexpectedly at 40 min by announcing, "Market closed."  
    - *Logistics*: Encourage trading; most students will swap 3–6 times. Close while many are mid-pump.

  - **42–47 min**: Students calculate final holdings.  
    - *Instructor*: "Record your final movie and chips. Then, move seats to pair with a neighbor for the trader phase."

  - **47–50 min**: Explain trader role.  
    - *Instructor*: "Half of you (Group 1) are now ‘traders.’ You’ll get another student’s record sheet. Your goal: extract as many chips as possible by offering swaps. Group 2: Watch silently."  
    - Assign roles: Odd-numbered students (1,3,5,...) as traders; even as observers. Randomly redistribute record sheets (anonymous).

  - **50–65 min**: Trader phase (15 min).  
    - *Structure*:  
      - Traders act as "house" for their assigned record sheet. Start with Movie A and 10 chips.  
      - Traders offer swaps (e.g., "Swap A to C for 1 chip?").  
      - Traders *must* accept if their swap value ≥1 (per recorded sheet).  
      - Run for 5–7 swaps per pair. Announce "Stop" at 62 min.  
    - *Goal*: Traders exploit cycles (e.g., A→C→B→A repeatedly) to drain chips.

  - **65–80 min**: Debrief (key questions and concepts).  
    - *Structure*: Use Socratic Q&A. **Do not use terms like "money pump" until the end.**  
    - Link experiences to your targets (see full debrief script below).

  ---

  ### **Debrief Script** (15 minutes)
  *Map each debrief move to student experiences. Introduce terms only in the final step.*  

  1. **Phase A Reflection** (3 min):  
     - *Q1*: "In Phase A, if you swapped A→C in Round 1, you ended with C minus 1 chip. Did that feel like a win? Why?"  
       - *Link*: Students admit they preferred C to A and paid ≤ recorded value → a net gain. No "pump" occurs here.  
     - *Q2*: "If you did all three swaps, you ended back at A minus 3 chips. Why did you take the second or third swap?"  
       - *Link*: At each step, the swap seemed beneficial (e.g., at C, B was preferred). But looking ahead, swapping to B in Round 2 led to being "pulled" to A in Round 3.  
     - *Key insight*: "Even looking ahead, refusing swaps might mean missing gains or landing in a worse spot. No single decision rule (e.g., 'always swap' or 'never swap') clearly wins."

  2. **Phase B Reflection** (4 min):  
     - *Q3*: "In Phase B, many of you swapped repeatedly. Did you have a stopping plan? Did it work?"  
       - *Link*: Students report plans like "swap twice then stop" or "keep swapping." Most who swapped greedily ended worst (e.g., A with 4–6 chips).  
     - *Q4*: "Compare outcomes: Starting (A,10), stopping after 1 swap (C,9), after 2 swaps (B,8), after 3 swaps (A,7). Which is best by your preferences?"  
       - *Link*: Disagreement arises. Those with high W_AC prefer (C,9) to (A,10); those with high W_BA prefer (A,7) to (B,8); etc. No consensus → no policy is unambiguously best.  
     - *Key insight*: "With no end announced, every policy (stop after k swaps) is beaten by another (k+1), making greedy swapping the worst."

  3. **Trader Phase Reflection** (4 min):  
     - *Q5*: "Traders, what strategy maximized chip extraction? Victims, why couldn’t you stop?"  
       - *Link*: Traders exploited students with high swap values for all three moves, creating loops. Victims felt "trapped" by their own preferences.  
     - *Q6*: "When could traders *not* extract chips?"  
       - *Link*: If a student had low/zero swap values (e.g., W_AC=0), extraction failed. Cyclic preferences enabled pumping; transitive ones did not.

  4. **Reveal Concepts** (4 min):  
     - *Finally, introduce terms*:  
       - "What you experienced is called a **money pump**."  
       - "In Phase A, some used **backward induction** (foreseeing Round 3) to avoid losses."  
       - "In Phase B, **sophisticated choice** (adapting to future selves) and **resolute choice** (sticking to a plan) both failed to resolve the cycle."  
     - *Moral*: "The core problem isn’t shortsightedness or exploitation. It’s that cyclic preferences make it impossible to identify a 'best' policy over time. If rationality demands coherence over time, it can’t just mean choosing what you prefer at each moment—it requires something extra, like commitment or preference reform."

  ---

  ### **Potential Problems and Solutions**
  1. **Students refuse all trades**:  
     - *Likelihood*: High in Phase A (if risk-averse); low in Phase B (FOMO).  
     - *Solution*: In debrief, contrast outcomes (e.g., non-trader at (A,10) vs. one-swap at (C,9)). Ask: "Did refusing trades avoid losses or miss gains?" Highlight that C > A justifies trading.

  2. **Students treat chips as worthless**:  
     - *Likelihood*: Low (grade bonus is tangible), but possible if students disengage.  
     - *Solution*: Remind them of stakes at start. In trader phase, exploiters "punish" apathy by draining chips.

  3. **Students have transitive preferences**:  
     - *Likelihood*: ~25% (if they rank movies holistically, not by majority rule).  
     - *Solution*: Use them as examples. In debrief, note: "Some had consistent rankings—could they be pumped? Why not?" Reinforces that cycles enable pumping.

  4. **"Never trade with the house" conclusion**:  
     - *Likelihood*: Moderate after Phase A losses.  
     - *Solution*: In debrief, stress that one trade (A→C) was beneficial per their preferences. The lesson is not "don’t trade," but "cycles create dilemmas."

  5. **Trader phase chaos**:  
     - *Likelihood*: High with limited time.  
     - *Solution*: Use timers and simple rules ("traders offer one swap per 30 seconds"). Have observers track swaps to ensure fidelity to recorded values.

  6. **Uneven participation**:  
     - *Likelihood*: High in market phases.  
     - *Solution*: Cold-call quiet students in debrief (e.g., "What did you do at Round 2?").

  ---

  ### **What the Activity Cannot Stage**
  This activity **cannot stage the normative debate** about *how rationality should resolve diachronic dilemmas*. Students experience the problem (no best policy) but not the philosophical solutions (e.g., commitment as a rational requirement, sophisticated vs. resolute choice as superior). In your follow-up lecture, explicitly:
  1. Contrast sophisticated (conditional planning) and resolute (stick to a plan) approaches.  
  2. Argue that both are incomplete without addressing the root issue: cyclic preferences may be irrational *per se*.  
  3. Discuss whether rationality demands syncing preferences over time (e.g., through commitment devices).  

  This sets up your next session on diachronic requirements while grounding it in lived experience. The activity makes the problem visceral; the lecture builds the theory.  

  ---  
  **Final Note**: This design fits within your constraints and word limit. It emphasizes discovery through experience, with the debrief synthesizing the "moral" you want. Run it as a self-contained experiment, and use the lecture to formalize the unresolved issues.
