  - The greedy policy (always swap when offered) leads to the worst outcome: as k increases, the chip count decreases, and the option cycles, but the net effect is that you lose chips without a permanent improvement.

  - In the trader phase, the exploiters could easily pump if the victim had high recorded values for all swaps.

  - The lesson: with cyclic preferences, there is no policy that is best by your own lights. So diachronic rationality must require something else: commitment, planning, or a resolution of the intransitivity.

