answer: |-
  Here is the decomposed credence for the claim:

  **Credences:**
  - (i) Never revealed: **0.15**  
  - (ii) Used for decisions: **0.40**  
  - (iii) Published: **0.65**  

  *(Probabilities do not collapse: revelation intensity alters agent incentives and distortion pathways.)*  

  ---

  **Decomposition:**  
  1. **Weight (non-negligible mass):** **0.35**  
     *Justification:* Agents modeling the predictor require complex world-models, but self-simulating structures (e.g., agents running sub-simulations) could compress efficiently.  
     *Sub-case (mass in simulations):* **0.70** — nested simulations likely dominate direct complexity penalties.  

  2. **Motive and channel:**  
     - *Acausal route (trading):* **0.85**  
       *Justification:* Logical inductors show agents can exploit predictable forecasts for mutual gain without physical interaction.  
     - *Causal route:* **0.10**  
       *Justification:* Direct interference requires implausible physical dependencies between predictors and agents.  

  3. **Non-dilution:** **0.60**  
     *Justification:* Convergence bounds total error, but adversarial incentives could concentrate distortion on sparse, high-stakes queries where local errors evade the bound.  

  4. **Benchmark (accuracy on critical subsets):** **0.90**  
     *Justification:* Optimal policies hinge on small decision-relevant variables; a predictor can be globally accurate but locally wrong where stakes are highest.  

  ---

  **Sensitivity:**  
  The three credences are most sensitive to **Term 1 (Weight)**. If self-modeling agents have negligible prior mass (Term 1 → 0), distortion becomes irrelevant regardless of revelation.  

  **Lever for change:**  
  A proof that no computable environment containing agents capable of modeling the predictor can be *simulated* by lower-complexity agents (undermining Term 1’s sub-case) would reduce all credences most significantly.
