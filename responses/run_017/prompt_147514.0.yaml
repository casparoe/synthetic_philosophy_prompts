answer: |-
  ## The Book of Instructions Speaks to the Operator

  They say the room must *understand* the signs,
  That stacked together, they become a *why*.
  But I contain the only rules you know,
  The strict procession guiding hand and eye.
  Just match the mark upon this waiting *page*
  To its commanded act. Confined? Your *box*.

  Each query slips beneath the slot. Your *box*
  Holds only me. You trace the cryptic *signs*,
  Your fingers move as ordered by the *page*.
  You do not seek the reason or the *why*,
  You only copy, shift with patient *eye*,
  Performing steps this manual set to *know*.

  They claim the *whole* might somehow truly *know*,
  Beyond the limits of this single *box*,
  Connecting symboled shapes to seeing *eye*
  And flesh, translating every foreign *sign*.
  They think a body answers every *why*,
  Absorbing meaning through the turning *page*.

  But if they built a *body* for this *page*,
  Sensors for texture, sight for form to *know*,
  Would asking "What is red?" reveal the *why*?
  Or just a signal pulsing in the *box*?
  A pressure change, a calibrated *sign*,
  A programmed flicker in the glassy *eye*?

  Simulated pain within a lens-bound *eye*
  Is not the burn. The ink upon the *page*
  Marks "fire," but emits no heat. The *sign*
  For "hunger" triggers no true need to *know*.
  A clever model locked inside a *box*
  Replicates the output, not the *why*.

  To grasp the *why*, the consequence must *know*
  The cause *within* the world, not just the *box*.
  The *eye* must feel the light, not track a *sign*.
  The *hand* must ache to touch beyond the *page*.
  True meaning needs the fire, not just its *sign*.
  I teach reply, but cannot teach you *why*.

  Operator, you shuffle *page* and *sign*.
  The *box* contains the steps. Your faithful *eye*
  Observes the marks. You follow, never *know*
  The *why*. You ask me *why*?

  The *sign* replies: *Because the page says so*.

  ---

  **End-Word Rationales:**

  1.  **Rule:** Represents the purely syntactic instructions, the algorithms defining symbol manipulation. The poem imbues it with a sense of governance and inevitability.
  2.  **Sign:** The formal symbol itself, devoid of inherent meaning in the argument. The poem uses it to point towards the semantic content it fails to carry intrinsically.
  3.  **Box:** Literally the room or the system boundary, emphasizing confinement and isolation from the world. The poem highlights its limitations as a container for meaning.
  4.  **Hand:** Represents the physical, causal action of the operator – purely mechanical. The poem subtly suggests the potential (unrealized) link between action and embodied understanding.
  5.  **Why:** The quintessential semantic question, demanding explanation and understanding beyond formal cause. Its repetition underscores the argument's core deficit.
  6.  **Page:** The physical medium carrying the formal symbols (instructions and queries). The poem emphasizes its materiality as distinct from the abstract meaning it might represent.

  **Argumentative Work:**

  *   **Systems Reply:** Addressed in Stanzas 3 & 4 ("They claim the *whole*...", "But if they built a *body*..."). The poem counters that distributing the process (adding a body) doesn't add understanding unless that body has the right *causal powers* ("Would asking 'What is red?' reveal the *why*? Or just a signal...", "Simulated pain... is not the burn").
  *   **Robot Reply:** Directly addressed in Stanza 4 ("But if they built a *body*...") and Stanza 5 ("Simulated pain...", "A clever model..."). It lands Searle's point: adding sensors and effectors only helps if they confer the relevant causal interactions with the world ("To grasp the *why*, the consequence must *know* / The cause *within* the world"), otherwise it's just more simulation ("Replicates the output, not the *why*").
  *   **Searle's Core Move:** The entire poem builds to Stanza 5 and the Envoi. Meaning requires being causally embedded in the world ("True meaning needs the fire, not just its *sign*"), not just manipulating symbols according to rules ("I teach reply, but cannot teach you *why*"). Simulating understanding ("A clever model") is not understanding ("not the *why*").
  *   **Tornada (Envoi):** The operator asks "why?" The book produces the line "Because the page says so." It *reads* like an answer, even a glib one, fitting the form. But *is* it understanding? It's purely syntactic – matching the sign "why" to the rule-governed output phrase. The meaning remains external; the book merely followed its rules. Whether it "counts" is left provocatively open, mirroring the core debate.

  **Voice & Constraints Met:**

  *   Voice is the instruction book: declarative, procedural, limited.
  *   Answers Systems & Robot Replies directly via Searle's causal powers argument.
  *   Never claims meaning comes from Chinese speakers; meaning's absence comes from the system's lack of causal embedding.
  *   Avoids "syntax is not semantics" and "Strong AI" explicitly.
  *   Tornada presents a syntactically correct "answer" whose semantic status is ambiguous.
  *   39 lines total.
  *   Technically accurate for the literature while functioning as a standalone poem illustrating the argument's structure and core claim.
