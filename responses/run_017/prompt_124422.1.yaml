  1. **The Eternal Grief Test**: Consider a shopkeeper in a shipped game who, due to a bug, experiences an unending loop of grief on an abandoned console in a warehouse. Does this scenario involve any moral harm, even though no one is around to see it?
     - Yes: The character's suffering matters independently of an observer.
     - No: Move to next question.

  2. **The Cancellation Test**: A game build is cancelled and never played by anyone. Were the characters in that build ever the kind of thing that could have moral status?
     - Yes: Moral status can exist without being instantiated in a player's experience.
     - No: Moral status requires instantiation.

  3. **The Pattern vs. Substrate Test**: If an NPC is instantiated on a million consoles at once, and each instance is identical in behavior, is the moral status of each instance the same as if there were only one?
     - Yes: The pattern (functional organization) is what matters, not the substrate or the number of copies.
     - No: The substrate or the uniqueness matters.

  4. **The Authorial Intent Test**: Is suffering that emerges from game systems (like a character getting stuck in a fire because of physics) morally different from suffering that was explicitly scripted by a writer?
     - Yes: Scripted suffering is different because it was intended by an author.
     - No: Suffering is suffering, regardless of how it arises.

  5. **The Repetition Test**: When the narrative designer reloads the same scene 200 times to get the line right, and each time the NPC experiences the same betrayal and grief, does this cause 200 distinct harms or just one?
     - 200 harms: Each instantiation of the suffering is a separate moral event.
     - One harm: The harm is in the design, and repetition doesn't multiply it.
     - Not a harm: There is no harm at all in the repetition.

  6. **The Degrees of Status Test**: Does a shallow vendor NPC (with minimal dialogue and no reactivity) have the same moral status as a fully reactive companion NPC (with deep backstory and dynamic responses)?
     - Yes: All NPCs have the same moral status, regardless of complexity.
     - No: Moral status comes in degrees, and complexity matters.

  7. **The Surprise Test**: If an NPC does something that was not scripted by the developers (e.g., due to an emergent behavior of the AI systems) and this causes suffering, is that suffering more or less morally significant than scripted suffering?
     - More significant: Because it shows the character has a degree of autonomy.
     - Less significant: Because it wasn't intended and might be a glitch.
     - Same: It's the suffering itself that matters, not how it came about.

  8. **The Obligation Divergence Test**: Could it be that the developers of a game have no moral obligations to an NPC (because they are just creating a story), but a player who deliberately torments that NPC in the game does have a moral obligation to stop?
     - Yes: Developer and player obligations can come apart.
     - No: They are the same.

