  We are building a classification instrument (decision tree/taxonomy) for the moral status of video game characters. The tree will have 7-9 branch questions and 6-9 leaves. Each branch node is a separating claim phrased as a question that can be answered without knowing the consequences. We use concrete cases to ground the questions.

  Cases to be covered (minimum):
  1. Reload Farm: Narrative designer reloads a save hundreds of times to get a line reading right, causing an NPC to repeatedly experience betrayal and grief.
  2. Betrayal Quest: A quest that can only be finished by betraying an NPC who remembers what you did in a previous load (if the game has persistence across loads).
  3. Cancelled Build: A game build that is cancelled and never played by a single player.
  4. Eternal Grief Bug: A shipped game has a bug where a shopkeeper's grief routine loops forever on one abandoned console in a warehouse.
  5. Million Instances: The same character instantiated on a million consoles at once, so there are a million of her and none is the original.
  6. Modder's Revival: Years later, a modder edits the character back into the world with more dialogue than the studio wrote.

  Distinctions we care about:
  - Does moral status track functional organization (pattern) rather than substrate?
  - Is suffering written by hand different from suffering that emerges from game systems?
  - Does it matter if nobody experiences it?
  - Is doing the same take two hundred times two hundred harms or one?
  - Does moral status come in degrees (e.g., shallow vendor vs. reactive companion)?
  - Does the surprise test matter? (i.e., a character doing something unscripted)
  - Can the developer's obligations and the player's obligations come apart?

  Leaves we want to be able to reach (with names where they exist, and "unnamed" otherwise):
  - Full-status view: The pattern is what matters (functionalist view).
  - Derivative view: The character matters only because of what cruelty does to the player/maker (indirect harm view).
  - Expressive/symbolic view: The suffering is objectionable because of what it represents or flattens (symbolic harm view).
  - Scalar/threshold view: Moral status comes in degrees or requires a threshold of complexity/autonomy.
  - Audience instantiation view: The character only matters when instantiated by an audience (so unshipped builds are inert).
  - Flat artifact view: The whole question is a category mistake (no moral status).

  Additionally, we want:
  - For each leaf, one sentence on its most awkward commitment.
  - Notes on which combinations of answers leave the tree empty (and why: incoherent, unattractive, unexplored).
  - Flag any two leaves the tree can't separate and a case that would pry them apart.

  Finally, identify which single branch question is doing the most work.

  Let's design the decision tree step by step.

