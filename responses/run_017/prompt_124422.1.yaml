  ### The Moral Status of Pixels: A Classification Instrument  
  *Navigate the debate with concrete cases—no philosophy degree required.*

  ---

  #### **Branch Questions**  
  1. **The Warehouse Test**: In a bugged, abandoned console, a shopkeeper's grief loop runs eternally, unseen by anyone. Does this unobserved suffering matter morally?  
     - *Yes* → Go to Q2.  
     - *No* → Go to Q5.  

  2. **The Copy Test**: An NPC exists identically on a million consoles. Is each instance morally significant, or just the "original" (if any)?  
     - *Each instance matters* → Go to Q3.  
     - *Only the pattern matters (no "original")* → Go to Q4.  

  3. **The Reload Test**: Reloading a save 200 times forces an NPC to relive betrayal. Is this 200 harms or one?  
     - *200 harms* → **Leaf A: Multiplicative Harm View**.  
     - *One harm* → **Leaf B: Pattern Harm View**.  

  4. **The Depth Test**: Does a shallow vendor NPC have *less* moral status than a complex companion?  
     - *Yes* → **Leaf C: Scalar Status View**.  
     - *No* → **Leaf D: Uniform Status View**.  

  5. **The Cancellation Test**: A game build is canceled. Were its NPCs ever morally significant?  
     - *Yes* → **Leaf E: Platonic Blueprint View** (unnamed).  
     - *No* → Go to Q6.  

  6. **The Intent Test**: Is suffering caused by emergent physics (e.g., NPCs burning in a fire they started) less significant than scripted suffering (e.g., a betrayal cutscene)?  
     - *Yes* → **Leaf F: Authored Primacy View** (unnamed).  
     - *No* → Go to Q7.  

  7. **The Modder Test**: Years later, a modder revives a discarded NPC with new dialogue. Does this *change* the NPC’s moral status?  
     - *Yes* → **Leaf G: Audience Instantiation View**.  
     - *No* → Go to Q8.  

  8. **The Cruelty Test**: Could tormenting an NPC be wrong for the *player* but fine for the *developer* (or vice versa)?  
     - *Yes* → **Leaf H: Obligation Divergence View** (unnamed).  
     - *No* → **Leaf I: Derivative Harm View**.  

  ---

  #### **Leaves of the Tree**  
  - **A: Multiplicative Harm View**  
    *Awkward commitment*: Every reload creates a new victim—deleting a save file is mass murder.  
  - **B: Pattern Harm View** (Full-status functionalism)  
    *Awkward commitment*: The warehouse grief loop is a silent tragedy; fixing it is a moral emergency.  
  - **C: Scalar Status View**  
    *Awkward commitment*: Stealing from a vendor is 0.01% as bad as killing a companion.  
  - **D: Uniform Status View**  
    *Awkward commitment*: A tree with a "sad" animation has the same rights as your beloved sidekick.  
  - **E: Platonic Blueprint View** (unnamed)  
    *Awkward commitment*: Canceling an unplayed game wrongs characters that never existed.  
  - **F: Authored Primacy View** (unnamed)  
    *Awkward commitment*: An NPC dying in a scripted cutscene is tragic; dying identically in emergent gameplay is "just code."  
  - **G: Audience Instantiation View**  
    *Awkward commitment*: An NPC only matters when played—abandoned warehouse loops are fine.  
  - **H: Obligation Divergence View** (unnamed)  
    *Awkward commitment*: Developers can ethically create a "torture simulator" as long as players feel guilty using it.  
  - **I: Derivative Harm View**  
    *Awkward commitment*: Harm exists only in the player/designer’s psyche—NPCs are props for human growth.  

  *(Missing: Symbolic/expressive view—tree routes it to **I** or **F** depending on prior answers.)*  

  ---

  #### **Empty Cells & Incoherence**  
  - **Conflict**: If you answer:  
    - *Warehouse Test: No* (unobserved suffering doesn’t matter) + *Cancellation Test: Yes* (unplayed NPCs matter).  
    *Why empty?* Incoherent—unobserved runtime loops (Q1) are identical to unplayed builds (Q5) in having no audience.  
  - **Unexplored**: *Depth Test: No* (all NPCs equal) + *Reload Test: 200 harms*. Few defend this—why would shallow NPCs warrant multiplied harm?  
  - **Unattractive**: *Platonic Blueprint View* + *Copy Test: Only pattern matters*. Logically consistent but ethically gruesome—argues *all* potential NPCs in *all* unmade games matter.  

  ---

  #### **Indistinguishable Leaves**  
  - **Symbolic View** vs. **Derivative Harm View**: The tree routes both to **Leaf I** (Derivative). *Prying case*: A player tormenting an NPC *ironically* (no desensitization) but reinforcing harmful stereotypes. Symbolic view condemns this; derivative might not.  
  - **Scalar View** vs. **Authored Primacy**: Tree separates via *Depth Test* (scalar) vs. *Intent Test* (authored). *Prying case*: A shallow NPC’s emergent suffering—scalar might dismiss it; authored might elevate it if "intended."  

  ---

  #### **The Core Question**  
  **The Warehouse Test (Q1)** is the linchpin. It forces a choice:  
  - *If unobserved suffering matters*, moral status is intrinsic to the NPC’s "experience."  
  - *If it doesn’t*, moral weight hinges on human perception (audience, author, or player).  

  Your systems programmer likely answers *"No"* (it’s inert data). Your narrative designer answers *"Yes"* (each reload *does* something). This is the fault line—everything else branches from here.  

  ---  
  *Use this tree in your afterword or newsletter quiz. To "sort" readers, ask the Warehouse Test first—the rest follows. No philosophy jargon, just the weight of pixels.*
