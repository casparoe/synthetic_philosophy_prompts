  1. Step 1: Keep. It's a fair description of futarchy. Why it looked fine: It accurately states the futarchy mechanism. Cost of rejecting: None, since I keep it.

  2. Step 2: Keep. Core to the case for markets. Why: Markets do aggregate information well for predictions. Cost of rejecting: Undermines futarchy's epistemic advantage.

