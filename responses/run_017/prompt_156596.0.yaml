  The cases presented show a clear pattern:
  - Case 1 (propaganda film) and case 3 (war film) are considered artistically flawed because the moral defect is structurally integral to the work's effect.
  - Case 2 (novel with sexist sentence) and case 4 (abusive songwriter) maintain artistic value because the moral defect is either peripheral or external to the work itself.
  - Case 5 (honest memoir) shows moral virtue can enhance artistic value when central to the work's achievement.

  The photographer case presents a dilemma: the deception was necessary for the work's existence and artistic quality (intimacy), yet the work itself is truthful and valued by its subjects. The key factors seem to be:
  1) The deception was instrumental to creating the art 
  2) The art itself doesn't perpetuate the deception 
  3) There's a conflict between the subjects' retrospective appreciation and their violated consent

  I think the friend would call this good art because the moral defect is in the creation process rather than in the work's content or effect. The artistic achievement (intimate, truthful portrayal) stands separate from the unethical means. This aligns with how she treated the songwriter case - condemning the artist's behavior while upholding the work's artistic merit.

  For distinguishing test cases, one could imagine:
  - A) A brilliant novel that requires reader's complicity in racism to appreciate (would be bad art, like case 1)
  - B) A sculpture made from stolen sacred objects, where the theft enables but isn't reflected in the work (would be good art, like the photographer)

  The subjects' reactions seem irrelevant to her framework - she focuses on the work's intrinsic qualities rather than reception consequences. Regarding the editorial decision, her view would separate artistic judgment from platforming decisions, suggesting the board could acknowledge the art's quality while choosing not to promote it due to ethical concerns.

  This analysis reveals her core principle: moral aspects affect artistic value only when they're constitutive of the work's aesthetic functioning. Process ethics and reception consequences remain in the separate domain of how we engage with art.
answer: |-
  Based on your friend's consistent pattern across cases 1-5, here's the prediction, the underlying "machinery," test cases, and implications for your editorial board:

  ### Prediction for the Photographer Case
  She would say: **Yes, it is good art.**  
  - The *work itself* is "intimate, formally superb, and true" without deception embedded in its content or presentation.  
  - The moral rot (the lie to gain access) is extrinsic to the artwork's *aesthetic structure* – it enabled the work's creation but isn't reflected in the images or their intended effect.  
  - This parallels Case 4 (the singer-songwriter): the art’s quality stands separately from the artist’s immoral *actions*.

  ### The Rule She’s Running: "Aesthetic Integration"
  Her judgments hinge on **whether the moral defect is *aesthetically constitutive* of the work’s impact or achievement**.  
  - **Moral defects *harm* artistic value** when they are:  
    - **Structurally necessary** for the work’s intended effect (Case 1: contempt *is* the emotional engine; Case 3: aestheticized torture *undermines* the stated purpose).  
    - **Integrated into the work’s virtues** (Case 5: honesty *is* the artistic merit).  
  - **Moral defects *do not harm* artistic value** when they are:  
    - **Peripheral** to the work’s core achievement (Case 2: the sexist sentence doesn’t drive the novel’s power).  
    - **Extrinsic** to the work itself (Case 4: the abuse isn’t reflected in the songs).  

  The town’s gladness and their hypothetical refusal are **noise** in her framework. She focuses on the *artwork’s intrinsic properties*:  
  - The *work* truthfully depicts life; the deception occurred in the *process*, not the product.  
  - Audience reception (the town’s approval) or creation ethics (consent) don’t alter the work’s formal or aesthetic qualities for her—they belong to the separate question of "what we ought to do with it" (as in Case 4).  

  ### Rules That Fit Cases 1-5 But Disagree Here
  Two alternative rules could explain cases 1-5 but clash with the photographer case:  
  1. **"Moral Taint" Rule**: *Any morally compromised process (deception, coercion) diminishes artistic value.*  
     - Would call the photographs **bad art** due to the lie, violating her stance in Case 4.  
  2. **"Audience Complicity" Rule**: *Art is flawed if it requires the audience to be complicit in immorality to appreciate it.*  
     - Would call the photographs **bad art** because appreciating their intimacy requires benefiting from the deception. Contradicts her view in Case 2 (the sexist sentence doesn’t demand complicity).  

  ### Best Test Case to Separate These Rules  
  **Case X:** *A sculptor steals sacred ritual objects from an Indigenous community, transforms them into a stunning installation critiquing colonialism, and displays them without context. The community condemns the theft but art critics hail the work’s brilliance.*  
  - **Her Rule (Aesthetic Integration)**: Good art. The moral defect (theft) is extrinsic; the work’s power comes from formal innovation and conceptual critique.  
  - **Moral Taint Rule**: Bad art. The process was immoral.  
  - **Audience Complicity Rule**: Bad art. Appreciating it requires ignoring/benefiting from sacrilege.  

  ### If Her View Is Underdetermined  
  Her verdict would commit her to:  
  - **Calling it Good Art**: Consistency with Case 4. The lie is an external act; the art’s truthfulness and formal excellence stand alone.  
  - **Calling it Bad Art**: Consistency with Case 3. The deception is "aesthetically constitutive" because intimacy *is* the core achievement, and it was gained dishonestly.  

  ### Secondary Question: The Editorial Board Vote  
  Her view **leaves the platforming decision entirely open**.  
  - She separates *artistic merit* from *ethical engagement*. For her, Case 4’s songs are great art but she won’t stream them; Case 1’s film is bad art *and* immoral.  
  - **Implication for your board**: She could logically argue:  
    - *"The photographs are excellent art, but we should not run an excerpt because we cannot endorse the deception that created them."*  
    - This mirrors her stance on the singer-songwriter: praise the art, reject the artist.  

  ### Summary
  - **Prediction**: She calls the photographs good art.  
  - **Her Rule**: Moral defects affect artistic value *only* if they are inseparable from the work’s aesthetic functioning.  
  - **Town’s Reaction**: Irrelevant to her artistic judgment (though relevant to platforming).  
  - **Editorial Decision**: Her artistic verdict doesn’t dictate the vote; she’d treat "should we platform this?" as a separate ethical question.  

  This framework prioritizes the artwork’s autonomous formal and affective qualities over creator ethics or process—unless those elements are materially embedded in the work’s structure. To challenge her, present a case where the moral rot is *both* extrinsic *and* essential to the art’s existence (like Case X).
