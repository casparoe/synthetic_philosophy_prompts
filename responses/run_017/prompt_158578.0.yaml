  ## ALGOSENIX™ (algoxipra hydrochloride) TV ADVERTISEMENT

  **[OPEN ON SUNLIT MORNING. A WOMAN (50s) GARDENING VIGOROUSLY. SHE ACCIDENTALLY JAMS HER THUMB ON A ROSEBUSH STEM. SHE GLANCES DOWN, CALMLY.]**

  **ANNOUNCER (Warm, reassuring):** Does pain ever hold you back? That urgent need to stop, that overwhelming *badness*... what if you could keep the signal, but lose the suffering?

  **[CUT TO LAB SETTING. GRAPHIC SHOWS "PAIN SIGNAL" (NERVE PATHWAY) SPLITTING INTO TWO ARROWS: ONE LABELED "SENSATION" (BURNING, STABBING, LOCATION), ONE LABELED "SUFFERING" (FADING OUT).]**

  **ANNOUNCER:** Introducing Algosenix™. The first and only medication that targets the *unpleasantness* of pain, leaving the essential sensory information doctors rely on completely intact.

  **[MONTAGE: MAN (60s) LIFTING WEIGHTS, GRIMACING SLIGHTLY BUT CONTINUING AS TEXT OVERLAYS: "Localizes Pain? YES." "Rates Intensity? YES." "Describes Sensation? YES." THEN, SAME MAN SMILING EASILY: "Feels Urgent? NO." "Feels Awful? NO."]**

  **ANNOUNCER:** Algosenix™ works by specifically modulating the affective-motivational dimension of pain perception. You still *know* you stubbed your toe – sharply, intensely, a definite "seven" – but the crushing need to hop around and curse? Gone.

  **[CUT TO "DAVE" (50s, FRIENDLY, WEARING A WRIST SUPPORT), SITTING IN A BRIGHT KITCHEN.]**

  **DAVE:** Before Algosenix™, my arthritis flare-ups? They’d just own my whole day. The ache in my knees was all I could think about. Now? I still *feel* the stiffness, the pressure, exactly where it is. My doc says it helps him track the inflammation better than ever. But that constant... *dread* of the pain? That mental weight? Algosenix™ lifted it right off. I move easier, I focus better. It’s just information now, not a bully.

  **[QUICK CUT: DAVE WINCES SLIGHTLY AS HE ACCIDENTALLY KNOCKS HIS SUPPORTED WRIST AGAINST THE TABLE. HE SMOOTHLY ADJUSTS HIS ARM, SMILING.]**

  **ANNOUNCER:** Important note: Because Algosenix™ removes the natural urge to avoid or protect, **an Algosenix™ Protective Instinct Add-On is essential.** Think of it as pairing your sensory dashboard with an automatic safety response.

  **[GRAPHIC: ALGOSENIX™ PILL + PROTECTIVE INSTINCT ADD-ON CAPSULE = SHIELD ICON]**

  **ANNOUNCER:** The Algosenix™ Protective Instinct Add-On restores appropriate avoidance behaviors *without* reintroducing any unpleasant feeling or emotional distress. You’ll naturally pull your hand from the hot stove because the signal tells you it’s damaging, not because it *hurts*. Safety preserved. Suffering still absent. It’s the complete solution.

  **[SCENE SHIFT: WOMAN FROM OPENING NOW WALKING EASILY THROUGH AUTUMN LEAVES, SMILING, HOLDING HER SLIGHTLY BANDAGED THUMB UP. NO SIGN OF DISTRESS.]**

  **ANNOUNCER:** Ask your doctor if Algosenix™, with the required Protective Instinct Add-On, is right for you.

  **[VISUAL: ALGOSENIX™ LOGO. TEXT: "Algosenix™ with Protective Instinct Add-On"]**

  **ANNOUNCER (Speed increases slightly):** Algosenix™ can cause dizziness, dry mouth, mild nausea, or changes in taste perception. More serious risks include delayed recognition of significant injury due to the absence of protective urges **without the Protective Instinct Add-On**, potential for infection if wounds are not noticed and addressed promptly, and rare neurological events. Algosenix™ may interact with certain antidepressants and sedatives. Discontinue and seek medical help if you experience sudden severe headache, vision changes, or loss of coordination.

  **[SCREEN SPLITS: LEFT SIDE SHOWS IDYLLIC SCENES (FAMILY PICNIC, PERSON RELAXING). RIGHT SIDE DISPLAYS IMPORTANT SAFETY INFORMATION IN CLEAR TEXT.]**

  **IMPORTANT SAFETY INFORMATION:** ALGOSENIX™ (algoxipra hydrochloride) WITH THE REQUIRED PROTECTIVE INSTINCT ADD-ON IS INDICATED FOR THE MANAGEMENT OF CHRONIC PAIN CONDITIONS WHERE PRESERVATION OF PAIN SENSATION FOR DIAGNOSTIC OR MONITORING PURPOSES IS DESIRED, WHILE MITIGATING THE AFFECTIVE-MOTIVATIONAL COMPONENT.

  **WARNING: USE WITHOUT THE PROTECTIVE INSTINCT ADD-ON CAN LEAD TO SERIOUS INJURY OR TISSUE DAMAGE.** Algosenix™ removes the unpleasantness and natural avoidance urges associated with pain. The Protective Instinct Add-On is mandatory to restore context-appropriate protective reflexes and avoidance behaviors based on the preserved sensory input. Failure to use both components as prescribed significantly increases the risk of unrecognized trauma, burns, infections, and other complications.

  Do not take Algosenix™ if you have a history of self-harm tendencies, certain neurological conditions, or are pregnant. Algosenix™ may impair judgment related to physical safety despite intact sensation. Patients should establish regular check-in routines with their healthcare provider to monitor for unrecognized injuries. Report any new or worsening symptoms to your doctor immediately.

  Common side effects include dry mouth, mild dizziness, transient nausea, altered taste, and emotional blunting (reported as reduced concern about pain or other neutral/negative stimuli; this is an expected mechanism of action, not a side effect). Less common but serious risks include delayed wound healing complications, increased infection risk, rare neurological events (seizures, neuropathy), and potential exacerbation of pre-existing psychiatric conditions.

  **[FINE PRINT AT BOTTOM OF SAFETY SCREEN:]**
  *Some patients report a generalized reduction in emotional responsiveness to various stimuli. This is considered an extension of the intended effect on aversive emotional responses and is not classified as an adverse event. Individual results may vary. Algosenix™ does not eliminate tissue damage.*

  **[RETURN TO SUNLIT SCENE. WOMAN GENTLY TOUCHING ROSES, SMILING PEACEFULLY.]**

  **ANNOUNCER (Warmly):** Algosenix™. Preserve the signal. Remove the suffering. Remember: Always pair with the Protective Instinct Add-On for complete safety. Talk to your doctor about Algosenix™.

  **[VISUAL: ALGOSENIX™ LOGO. WEBSITE: www.AlgosenixPainSignal.com. PHONE: 1-800-ALGOSENIX. TEXT: "Ask about the Algosenix™ Copay Savings Card!"]**

  **SUPER:** Algosenix™ and the Algosenix™ Protective Instinct Add-On are registered trademarks of Veridian Therapeutics. This medication requires a prescription. Please see full Prescribing Information at www.AlgosenixPI.com. Patient is an actor. Individual results may vary. [Small, fast-disappearing text at very bottom:] *Some users report diminished concern regarding non-pain related events. Not a side effect. Mechanism of action.* Veridian Therapeutics. All rights reserved. ALG-00123
