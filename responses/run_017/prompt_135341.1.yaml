answer: |-
  ## Beyond Coverage: Testing the Calibration Hypothesis in Moral Foundations Theory

  Moral Foundations Theory (MFT) has powerfully illuminated how political left and right rely on partially divergent moral intuitions, anchored in distinct foundational concerns like Care, Fairness, Loyalty, Authority, and Sanctity. Yet, this descriptive success consistently triggers a normative question: what does this divergence imply about who is *actually* correct? The dominant responses are polarized: either the divergence debunks moral intuition wholesale ("debunking all the way down"), or it suggests conservatives access a "superset" of valid foundations while the left operates with a "truncated" moral palate. Both responses, I argue, share a critical, unexamined assumption: that the crucial variable is simply *which* foundations are activated (foundation *coverage*), rather than *how* those foundations are tuned and applied (foundation *calibration*).

  This project challenges that assumption directly. Its core question is: **Does recasting the MFT divergence between left and right primarily as a difference in the *calibration* (sensitivity thresholds, false-positive rates) of shared moral foundations, rather than merely their *coverage*, fundamentally alter the viability and implications of attempts to "debunk" the moral intuitions of the political outgroup?** The coverage framing leaves this question wide open because it focuses solely on the *presence or absence* of a foundation's activation, ignoring the critical dimension of *how reliably or appropriately* that activation occurs in response to stimuli. A foundation present in both groups (e.g., Sanctity) might be calibrated very differently – one group exhibiting high sensitivity to genuine threats but also prone to false alarms in ambiguous contexts, while the other exhibits lower sensitivity but greater specificity. Debunking arguments targeting coverage (e.g., "your intuition is invalid because you lack foundation X") cannot address whether a foundation shared by both sides is *miscalibrated* in one group. By shifting the explanatory target to calibration, we open a new avenue for evaluating the epistemic status of divergent intuitions.

  To test this, I propose a year-long empirical investigation structured as follows:

  *   **Months 1-2:** **Framing & Design.** Finalize theoretical framework integrating signal detection concepts (sensitivity, specificity, response bias) with MFT. Develop core experimental stimuli: vignettes designed to isolate *calibration* differences while holding *coverage* constant. For example, scenarios varying the ambiguity of a potential Sanctity violation (e.g., ritualistic acts with unclear symbolic meaning) or Fairness violation (e.g., complex resource distributions with competing equity/equality claims).
  *   **Months 3-5:** **Pilot & Refinement.** Pilot vignettes with small, diverse samples. Measure moral judgment intensity, perceived violation, and reaction times. Refine stimuli to maximize clarity in manipulating ambiguity and effectively elicit calibration differences. Pre-register primary hypotheses.
  *   **Months 6-9:** **Main Data Collection.** Deploy refined vignettes via online platforms (e.g., Prolific) to large, politically balanced samples (~N=800). Key measures: moral condemnation ratings, confidence, perceived foundation relevance. Crucially, include conditions where the *same* foundational concern (e.g., Sanctity) is triggered by stimuli ranging from clear-cut violations to highly ambiguous or innocuous events.
  *   **Months 10-11:** **Analysis & Modeling.** Analyze data to:
      1.  Confirm that political ideology predicts differences in sensitivity (d') and response bias (criterion) *within* foundations, not just activation levels.
      2.  Test whether participants recognize and critique potential *miscalibration* (e.g., "over-sensitivity," "false alarms") in outgroup judgments when prompted, versus defaulting to coverage critiques ("they just don't get it" or "they care about the wrong things").
      3.  Model how framing the disagreement as calibration-based impacts the perceived force of debunking arguments compared to coverage-based framing.
  *   **Month 12:** **Integration & Dissemination.** Synthesize findings into manuscript(s) and prepare conference presentations. Outline implications for MFT, political psychology, and meta-ethical debates about moral disagreement.

  **What a "Yes" Answer Looks Like:** We find robust evidence that ideology predicts calibration parameters (e.g., conservatives show lower thresholds/higher false alarm rates for Sanctity/Loyalty in ambiguous contexts; liberals show similar patterns for Care/Fairness in other contexts). Crucially, participants readily engage with the calibration critique, and framing the divergence as calibration-based significantly weakens the perceived force of simple coverage-based debunking arguments ("your intuition is invalid because you lack/overuse foundation X"). This suggests the calibration perspective offers a more nuanced and potentially less polarizing account of moral disagreement.

  **What a "No" Answer Looks Like:** Calibration differences are minimal, weak, or inconsistent compared to strong coverage differences. Participants overwhelmingly default to coverage explanations and find calibration critiques unconvincing or irrelevant. Debunking arguments retain their force regardless of framing. This would suggest the coverage framing captures the core of the normative dispute more accurately.

  **Failure Conditions:** The project fails if we cannot successfully design vignettes that effectively manipulate ambiguity while reliably activating specific foundations (invalidating the core manipulation). Failure also occurs if results are hopelessly null or contradictory across foundations/scenarios, offering no clear pattern regarding calibration differences or their impact on debunking arguments.

  **Honest Scalability Assessment:** This project is ambitious for one year. The primary risk is the complexity of designing effective calibration-manipulating vignettes. Creating scenarios that are genuinely ambiguous *and* clearly linked to a specific foundation, while avoiding confounding interpretations, is challenging. Pilot testing is crucial. If piloting reveals fundamental difficulties in stimulus design or weak effects, the project scope may need tightening – perhaps focusing intensively on calibrating just one or two foundations (e.g., Sanctity and Fairness) rather than attempting a broader survey. Similarly, if data collection is delayed or analysis proves exceptionally complex, the timeline could slip. A rigorous but feasible approach prioritizes depth on a few key foundation/calibration contrasts over superficial breadth.

  **Signal Detection Framing: Substance or Relabeling?** I believe the signal detection framing does **real conceptual work**. It moves beyond the binary "on/off" notion of foundations inherent in coverage debates. By explicitly defining calibration in terms of sensitivity (d') and response bias (criterion), it provides quantifiable, theoretically grounded parameters distinct from simple activation strength. This reframes the normative question: not "do you have this foundation?" but "how well-tuned is your detector for *genuine* instances of the relevant moral violation?" This shift fundamentally changes the target of debunking arguments – aiming them at the *reliability* of the intuition-generating mechanism in specific contexts, rather than its mere existence. It forces a consideration of context and error rates that the coverage framing inherently obscures. While the core observation (people apply foundations differently) isn't new, the signal detection lens provides a precise, falsifiable framework for characterizing *how* they differ and evaluating the epistemic implications of those differences. It transforms an intuitive hunch into a testable hypothesis.
