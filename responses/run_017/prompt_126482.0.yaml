  The volta: The turn occurs in stanza3, where the common people's condition shifts from being merely "schlecht" (bad in the plain sense) to being experienced as an injury, and their resentment becomes active and inventive.

  Gloss of each refrain occurrence:

  - Stanza1 (lines 2 and 4): The refrain is the aristocrats' self-praise, spoken with natural affirmation. Goodness is identical with strength and freedom, and it is a positive quality that they possess.

  - Stanza2 (line 1): The refrain is repeated, but now it is immediately followed by the description of the common people as "schlecht". The refrain still carries the aristocratic mode, but the context introduces the contrast with the low, which is not yet a focus of hatred.

  - Stanza2 (line 3): The refrain is repeated again, and then the fourth line downplays the significance of the low (they are "not worth contempt"). So the refrain here is part of the aristocrats' indifference.

