  ### Pantoum: "The Good Are Strong and Free"

  They stride in sunlight, laughing, unafraid,  
  **The good are those who are strong and free.**  
  Their virtues bloom from power, self-sung, unswayed,  
  **The good are those who are strong and free.**  

  **The good are those who are strong and free.**  
  The *schlecht*? A footnote, pale, not worth their hate.  
  **The good are those who are strong and free.**  
  No venom in their judgments, merely fate.  

  The *schlecht*? A footnote, pale, not worth their hate—  
  *Until* the priests, in shadows, charted hell.  
  No venom in their judgments, merely fate—  
  *Now* ressentiment weaves its cunning spell.  

  Until the priests, in shadows, charted hell:  
  Invented *evil* first—a poison root.  
  Now ressentiment weaves its cunning spell—  
  Then grafted "good" as pallid, bloodless shoot.  

  Invented *evil* first—a poison root,  
  To cage the noble heart in twisted blame.  
  Then grafted "good" as pallid, bloodless shoot—  
  **The good are those who are strong and free.**  

  ---

  ### Prose Explanation  
  **Volta Location**: The turn occurs in the third stanza, marked by "Until" and "Now," shifting from the aristocratic indifference toward the *schlecht* to the priestly invention of evil through ressentiment. This mirrors Nietzsche’s pivot where ressentiment becomes the "creative force" revaluing values.  

  **Gloss of Refrain Recurrences**:  
  1. **Stanza 1 (aristocratic)**: The refrain is self-affirming praise, defining "good" as innate strength and joy. "Strong and free" denotes spontaneous nobility, with "bad" (*schlecht*) as a dismissive afterthought (as in GM I:2).  
  2. **Stanza 2 (aristocratic)**: Repeated identically, but now sandwiched between descriptions of the *schlecht*. The refrain’s meaning narrows: "strong and free" implies *indifference* to the weak, who are deemed irrelevant, not hated (GM I:4).  
  3. **Stanza 4 (priestly)**: Placed after "invented *evil* first," the refrain is repurposed. "Strong and free" now evokes the *object* of ressentiment—the aristocrats reimagined as "evil" oppressors. The priests’ definition of "good" (ascetic, reactive) emerges only *after* this inversion (GM I:7, I:10).  
  4. **Stanza 5 (priestly)**: The refrain returns, but its final recurrence is ironic. "Strong and free" is hollowed out—the priests’ "good" is defined *negatively* (not-evil), rendering the phrase a relic of the very values they invert (GM I:11).  

  **Form-Driven Fudges**:  
  - The refrain’s placement in the priestly half (stanzas 4–5) risks implying the priests *say* these words. To avoid this, the language around it ("cage the noble heart," "pallid shoot") frames the refrain as the *target* of ressentiment, not the priests’ creed.  
  - The closing loop (last line → first line) forces "They stride in sunlight..." to reappear after the priestly turn. This juxtaposition makes the aristocratic world seem distant, almost mythical—a formal echo of Nietzsche’s "slave revolt" overwriting the past.  

  **Note on Ressentiment**: The poem avoids moralizing by showing ressentiment as "cunning" and "invent[ive]" (stanzas 3–4), highlighting Nietzsche’s view of it as a generative, world-altering force (GM I:10).
