  - Relevance theorist: Confirmation requires that the evidence be relevant to the hypothesis in the sense of being part of a genuine test. The white shoe is irrelevant to the hypothesis about ravens because it doesn't pertain to ravens. Hence, it does not confirm.

  Disagreement 2: The role of the sampling setup.
