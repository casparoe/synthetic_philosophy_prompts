  hey, I need a hand with a thing. I'm the person who volunteered to mediate the last session of a confirmation-theory reading group, which was a mistake, because the two camps have now spent three weeks sniping at each other about the raven paradox and I want to shove them into producing one document instead of another round of emails.

  The two positions, as I'd name them (rename either if the label is unfair, and state each position in the wording its own holder would actually sign): on one side, the probabilists — confirmation just is probability-raising relative to a background corpus, the white shoe really does confirm that all ravens are black, and the "paradox" is a surprise about magnitudes and about what population you were sampling from. On the other side, the relevance crowd — confirmation has to be the evidence bearing on the hypothesis in the right kind of way, tied to what would count as a genuine test of it, the shoe does not confirm, and the probabilists have quietly substituted a different concept while keeping the word.

  What I want is the joint statement both could sign: first the claims they agree on — I'd expect at least that nothing in the paradox is a logical contradiction, that the puzzle isn't really about birds or about colour words, that the unrestricted principle that an instance confirms its generalization has to be given up, that you can't just drop for free the condition that whatever confirms a hypothesis confirms anything logically equivalent to it, and that every verdict has to be relativized to a prior and to a sampling arrangement — plus whatever else is genuinely common ground, and nothing padded in that neither of them would defend. Then the disagreements, each one stated twice, once in the probabilist's own phrasing and once in the relevance person's, each phrasing being one that side would accept of itself. Then the cruxes.

  For cruxes I've got four I want them to have to answer, though you can merge or replace any you think is rigged (say so inside the document if you do). One: a sealed crate holds exactly ten objects, and you built the packing process so you know for certain that each object independently had a fair three-way chance of being a black raven, a white raven, or a white shoe, with nothing else in there. The hypothesis is that every raven in the crate is black. Reach in blind and pull one object. I want the actual numbers worked out: the prior, the posterior if it's a white shoe, the posterior if it's a black raven, what happens after ten draws instead of one, and what happens if the crate holds a million objects instead of ten. Then the fight: the two outcomes come out exactly equally confirming, and the probabilist should say what he makes of that and the relevance person should say whether her verdict even changes when the crate gets bigger. Two: the Bayes factor per non-falsifying draw stays at one and a half no matter how big the crate is, while the absolute change in probability goes to nothing — so I want them to argue about whether degree of confirmation is a ratio or a difference, and whether the usual "it confirms, but by a negligibly small amount" line survives if you measure it the other way. Three: you learn the crate contains no ravens at all. Does the hypothesis get confirmed to degree one, or does the question lapse, and should a theory of confirmation be required to hand down a verdict when the hypothesis is only vacuously satisfied? Four: you get to choose how to gather evidence — draw blind from the crate, or pick out an object you've already established is a raven and check its colour — and everyone prefers the second; the crux is whether that preference can be stated purely in terms of expected information or expected utility, or whether it needs some extra notion like relevance or testing the class the hypothesis is about, and if it needs the extra notion somebody should produce a case where two policies are equally likely to turn up a falsifier but only one is a test, or else both should sign a note saying no such case can be constructed. For each crux give the case or argument both would accept as bearing on it, and write down in advance what each side predicts the outcome will be.

  They've both read the standard stuff so don't start from scratch, but do state the two principles that generate the paradox in whatever neutral wording you like; no need for names, dates or citations, and please don't invent any references, I'll drop the footnotes in myself. One formatting thing that matters: it has to read as one continuous piece, like a letter or a long email — no headings, no numbered list, no bold, no tables anywhere — but I still need to be able to recover from it the agreed claims, both formulations of each disagreement, and the cruxes with the predictions, so signpost it in the prose ("what we both accept is...", "the probabilist would put it like this...") rather than with layout. About 1200 to 1500 words. And at the end say plainly which slice of this fight you think is only about the word "confirmation" and which slice is real, and whether there's anything at all both of them would count as a genuine loss for their own side.
