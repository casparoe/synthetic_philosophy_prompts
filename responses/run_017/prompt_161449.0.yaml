  We are writing a grant proposal as an email to a program officer. The core idea is to reframe the ELK (eliciting latent knowledge) problem as one of lossy compression with an explicit distortion budget, relative to a specified class of decisions. The worry is that if the model's world-model is richer than human concepts, then forcing a legible report might require discarding critical information, leading to unsafe actions. The proposal should outline a three-month independent project to explore this.

  Key elements from the user's note:
  - **Problem Reframe**: Instead of demanding "truth", we ask for a translation with a distortion budget. We specify a class of decisions and require that the report preserves features necessary for safe decisions in that class.
  - **Diagnostic**: Compare two reporters that agree on human-checkable cases but disagree off-distribution. If their disagreement is inexpressible in human terms (an aliasing artifact), then the standard ELK problem might be incoherent because it asks for a human-legible restatement of something that cannot be compressed without loss of decision-critical features.
  - **Structure of Proposal**: 
    1. State the question precisely.
    2. Explain why constrain-the-reporter approaches don't address this even if they work.
    3. What to do month by month (including toy setups).
    4. Possible conclusions and how to decide between them.
    5. Deliverable: What would be useful for deciding whether to trust a system?
    6. Failure conditions (including that the reframe might not help).

  We write in continuous prose without headings, bullets, bold, or tables.

  Let's outline the content:

  1. **Introduction and Problem Statement**: 
     - We are investigating the ELK problem in the context of a predictor trained to predict future sensor streams (e.g., camera footage of a vault with a diamond). We attach a reporter that must report on what's happening in the world.
     - The standard worry is reporter drift (reporting what a human would expect rather than the truth). Existing approaches constrain the reporter to avoid this drift.
     - Our concern: If the model's latent state is richer than human concepts, then any legible report is necessarily a lossy compression. The problem then becomes: what information must be preserved for safe decision-making? We reframe ELK as a problem of lossy compression with a distortion budget relative to a class of decisions.

  2. **Precise Question**:
     - Given a predictor with a rich latent state, a reporter that maps latent states to human-legible reports, and a class of decisions (actions) that we take based on the report, what features of the latent state must be preserved in the report to ensure that the decisions taken are safe? And how can we detect when the compression has discarded too much (i.e., when the report is insufficient for safety in the decision class)?
     - Additionally, we propose a diagnostic: when two reporters agree on human-checkable cases but disagree off-distribution, if the disagreement is inexpressible in human terms (i.e., no human-legible description exists for the difference in their reports), then the standard ELK problem might be incoherent because human-legible truth is not a well-defined concept in that region.

  3. **Why Constrain-the-Reporter Approaches Don't Settle This**:
     - These approaches (e.g., penalizing complexity, training on human-checkable cases) aim to prevent deception by making the reporter directly report the latent state in a human-legible way. But if the latent state is too rich, then forcing legibility might require discarding information that is critical for safety. They assume that a faithful and legible report is possible, which might not hold. Thus, even if they prevent deception, they might still lead to unsafe compression.

  4. **What We'd Do (Month by Month)**:
     - **Month 1**: Develop toy setups. For example:
          - A simulated environment (e.g., a grid world with objects) where the predictor is trained to predict future states. The latent state is a vector, and we define a reporter that maps this vector to a report (e.g., a natural language sentence or a set of predicates). We define a class of decisions (e.g., "lock the vault" or "don't lock") that depend on the report. We then design a distortion measure: how much the decision based on the compressed report differs from the decision that would be taken with full knowledge of the latent state.
          - We might also create a setup where the latent state has more information than can be expressed in the report (e.g., continuous values that must be discretized).
     - **Month 2**: Run experiments with the toy setups. Train two reporters that are constrained to agree on a training set (simulating human-checkable cases) but may diverge off-distribution. We then evaluate:
          - The nature of their disagreements in off-distribution regions: can we describe the difference in human terms? Or is it an aliasing artifact?
          - The effect on decisions: do the disagreements lead to different decisions? And if so, are these decisions unsafe?
     - **Month 3**: Analyze the results and develop the diagnostic. We would try to formalize the notion of "human-legible description" of a disagreement (e.g., by trying to train a classifier that uses the latent state to predict the report and seeing if the residual is human-interpretable). We would also try to define a measure of how much distortion is too much for a given decision class.

  5. **Possible Conclusions**:
     - Conclusion A: We find that in our toy setups, the disagreements between reporters are often aliasing artifacts without human-legible descriptions. This would suggest that the standard ELK problem is indeed ill-posed in some cases because it asks for a human-legible restatement of something that cannot be compressed without loss of decision-critical features.
     - Conclusion B: We find that the disagreements are human-legible, meaning that there is a human-understandable feature that the reporters are capturing differently. Then the problem reduces to ensuring that the reporter captures the right features (which might be addressed by existing methods).
     - How to decide: By examining the off-distribution cases and trying to describe the disagreement. If we cannot find a human-legible description (e.g., we cannot train a human-interpretable model to predict the report from the latent state without error, and the error is random with respect to human concepts) then we lean towards Conclusion A.

  6. **Deliverable**:
     - A diagnostic tool: Given a reporter and a set of off-distribution examples, we can run the two-reporter test (train two reporters that agree on training but may disagree off-distribution) and then analyze the disagreements. The output would be an assessment of whether the disagreements are human-legible or not, and what features are being lost. This would help in deciding whether the reporter is trustworthy for the decision class.

  7. **Failure Conditions**:
     - The toy setups might be too simplistic to capture the richness of real models, so the results might not generalize.
     - The reframe might just move the bump under the rug: specifying the distortion budget and the decision class might be as hard as the original problem, because we might not know what decisions are critical until we face them off-distribution.
     - The diagnostic might be computationally expensive or hard to interpret.

