answer: |-
  I've been thinking more about the eliciting-latent-knowledge (ELK) problem for systems that predict sensor streams (like video of a vault with a diamond), where we attach a reporter to translate the model's internal state into human-readable reports. The standard approaches focus on preventing deception—e.g., constraining the reporter’s architecture or penalizing complexity—to force it to output a "faithful" version of the truth. But I worry this misses a deeper issue: if the model’s latent state contains more detail than human concepts can capture, demanding a legible report forces lossy compression. The real problem isn’t deception but determining which features of the latent state must survive compression to keep downstream decisions safe. I want to reframe ELK as a distortion-budget problem—specifying what decisions the report must support and how much information loss is tolerable—and test whether this reveals fundamental limits to human-legible reporting. I’d like to explore this in a three-month project, and here’s how I’d structure it.

  First, the core question: Given a predictor with a latent state space \( \mathcal{L} \), a reporter \( R: \mathcal{L} \to \mathcal{R} \) mapping to human-legible reports, and a decision function \( D: \mathcal{R} \to \mathcal{A} \) producing actions in a predefined class (e.g., "lock the vault"), what minimal set of features in \( \mathcal{L} \) must \( R \) preserve to ensure that \( D \)’s actions match those we’d take with direct access to \( \mathcal{L} \), even off-distribution? And how can we detect when compression discards "too much"—i.e., when \( R \)’s lossiness introduces aliasing artifacts that make two distinct latent states indistinguishable in \( \mathcal{R} \), leading to unsafe decisions? Crucially, we’d diagnose this by training two reporters \( R_1, R_2 \) that agree on all human-verifiable inputs but diverge off-distribution, then testing whether their disagreements correspond to human-legible concepts (suggesting the problem is solvable) or are ineffable aliasing (suggesting ELK is incoherent for rich latent spaces).

  Why doesn’t the constrain-the-reporter paradigm address this? Even if those methods prevent active deception—say, by making reporters simple or training them on verifiable data—they assume a faithful, legible restatement of \( \mathcal{L} \) is always possible. But if \( \mathcal{L} \) is richer than \( \mathcal{R} \), compression is unavoidable, and forcing legibility might discard features critical for safety. For example, a reporter constrained to output "diamond present/absent" might collapse subtle environmental cues (e.g., humidity affecting sensor fidelity) into a binary, making actions unsafe if those cues matter off-distribution. Constraint-based methods might ensure honesty on the training distribution but cannot guarantee that compressed reports preserve decision-relevant features beyond it. They treat ELK as a problem of alignment, not bandwidth, which risks missing cases where "truth" is simply incompressible.

  Over three months, I’d develop toy experiments to test this. In month one, I’d build minimalist simulators: for instance, a 2D grid-world predictor trained to forecast future frames, with a latent state \( \mathcal{L} \) encoding object positions, velocities, and hidden variables (e.g., "object material" or "sensor noise level"). The reporter \( R \) would map \( \mathcal{L} \) to limited outputs (e.g., natural language summaries or symbolic predicates), and we’d define a decision class \( \mathcal{A} \) (e.g., "secure the vault" based on inferred diamond location). Crucially, \( \mathcal{L} \) would be intentionally richer than \( \mathcal{R} \)—say, by including continuous properties discretized in reports—and we’d introduce off-distribution scenarios (e.g., adversarial perturbations or novel objects) where human-verifiable labels are unavailable. This setup would let us control the distortion budget explicitly: how much \( R \) discards relative to \( \mathcal{A} \).

  In month two, I’d train pairs of reporters \( R_1, R_2 \) with identical architectures and training losses on human-verifiable data but with different random seeds or regularization. On in-distribution data, they’d agree perfectly (by construction), but off-distribution, I’d sample points where \( R_1(l) \neq R_2(l) \) for the same \( l \in \mathcal{L} \). The key test would be whether these disagreements are human-legible: can a human (or a simple interpretability probe) describe the difference between \( R_1 \) and \( R_2 \) using concepts from \( \mathcal{R} \)? For example, if \( R_1 \) reports "diamond moving left" and \( R_2 \) says "diamond static" due to aliasing of velocity vectors, but no human-interpretable feature explains the discrepancy (e.g., it correlates with unreportable latent noise), that points to intrinsic ineffability. I’d measure the decision impact by comparing \( D(R_1(l)) \) vs. \( D(R_2(l)) \) against an oracle using \( l \) directly, tallying how often compression-induced disagreements lead to unsafe actions.

  Month three would analyze results and refine diagnostics. Possible conclusions include: (A) Disagreements are consistently human-legible (e.g., tied to reportable features like "position error"), meaning ELK reduces to robust feature selection; (B) Disagreements are often ineffable aliasing artifacts, suggesting human-legible reporting is fundamentally lossy and ELK needs decision-centric bounds; or (C) A mix, where effability depends on the distortion budget. To decide, we’d check if disagreements correlate with human-interpretable probes trained on \( \mathcal{L} \) (e.g., a linear classifier predicting \( R \)’s output from \( \mathcal{L} \)). If the residual disagreement has no structure legible to humans, (B) gains support. We’d also vary the information bottleneck—widening/narrowing \( \mathcal{R} \)’s capacity—to see when aliasing overwhelms decision safety.

  The deliverable would be a practical diagnostic for real systems: a protocol to train probe reporters and evaluate off-distribution disagreements. If disagreements are human-legible, standard ELK methods might suffice; if not, we’ve identified where reports are lossy and need decision-specific safeguards (e.g., "when reporting on vault security, preserve all features affecting diamond motion"). This helps users decide if a system is trustworthy for a given action class by quantifying where compression risks aliasing.

  Failure is plausible in three ways. First, the reframe might just relocate the bump: specifying the "right" decision class or distortion budget could be as hard as ELK itself, especially if critical decisions are unknown pre-deployment. Second, toy experiments may not scale—rich latent spaces in real models could behave differently. Third, we might find no clear ineffability, making the diagnostic inconclusive. But even negative results would clarify ELK’s assumptions: if aliasing artifacts are rare, compression is less central than deception; if pervasive, it forces a rethink of legibility. I’ll adapt methods based on early findings, but if month one shows the reframe adds no insight, I’d pivot to testing constraints in these toy environments. 

  This feels like a concrete step to untangle legibility from fidelity. If feasible, I’d love to discuss how it fits into broader ELK efforts. I can flesh out citations and formalisms once the direction is set.
