prompt: |-
  hey — i run the AI club at my school and i said id do a 25 minute session next week on whether we should build AI systems to reason like utilitarians or like deontologists. the room will be about half people whove never done any philosophy and half kids who code and who will definately have opinions about reward functions. i dont need you to explain the topic to me, i need a plan for how to explain it to them.

  concretely: what has to come first, and why, given that im pretty sure theyll hear the question as just the trolley problem with robots in it and miss whats actually at stake. i was going to hang the whole thing on one example — an AI that decides which students get the handful of free counseling slots, since it can compare people in ways a human counselor couldnt — but tell me if thats the right carrier and what a carrier example here has to have and has to not have. misconceptions im expecting: the coders will think any agent maximizing a utility function already is a utilitarian, the others will hear deontology as hard-coded rules like asimovs laws, and somebody will say why not just let it calculate consequences and bolt on a few rights. where in the sequence do i head each of those off? also my friend says the interesting argument for rules isnt that deontology is true but that rules are what you want in a system whose reasoning nobody can fully audit — i cant tell if thats deep or if it just changes the subject, so if its worth keeping, where does it go?

  and give me one question i can ask at the end that would show me they actually got it rather than just picked a side, plus what i should flat out refuse to get into at this level.
reasoning: |-
  Okay, the user runs an AI club and needs a 25-minute session plan on whether AI should reason like utilitarians or deontologists. They mentioned that half the attendees are new to philosophy, and the other half are coders with opinions on reward functions. The user doesn't need an explanation of the topics but a structured plan to present to the students. 

  First, I need to figure out how to structure the session effectively. The user is concerned that the students might reduce the discussion to just the trolley problem with robots. So avoiding that oversimplification is key. They proposed using an example about an AI allocating counseling slots in a school. That seems practical and relatable. But I should check if this example is suitable. 

  The counseling slots example is good because it's concrete, relevant to students, and avoids the trolley problem's life-or-death stakes. It allows discussing trade-offs and constraints without extreme scenarios. The AI can process more data than humans, like academic performance, mental health history, socioeconomic factors, etc. This makes the ethical dilemma clear: should the AI maximize overall well-being (utilitarian) or adhere to rules like equal access or prioritizing certain needs (deontological)? 

  Now, about the misconceptions. The coders might think that any utility-maximizing agent is utilitarian. But utilitarianism is about maximizing overall welfare, not just any utility function. For example, a utility function could prioritize fairness, which isn't utilitarian. I need to clarify the difference between a technical utility function and the philosophical concept. 

  The non-coders might confuse deontology with rigid rules like Asimov's laws. Deontology is about intrinsic duties, not just pre-set rules. So distinguishing between rules as heuristics versus moral imperatives is important. 

  Then there's the hybrid approach: calculate consequences but add some rights. The user wants to address why this isn't straightforward. For instance, how to resolve conflicts between rights and outcomes. Also, the friend's point about auditability: if an AI uses complex utilitarian calculations, it's hard to audit, whereas deontological rules are more transparent. This is a practical argument, not philosophical, so it's worth including but after explaining the core concepts. 

  Structuring the session: Start with the counseling slots example to ground the discussion. Then explain utilitarianism and deontology using that example. Address the misconceptions as they come up. For coders' confusion, clarify the utility function vs. philosophical utilitarianism. For deontology, explain it's more than hard-coded rules. The hybrid approach can be discussed when comparing both methods. The auditability point comes in as a practical consideration after the philosophical part. 

  The closing question should test understanding beyond picking sides. Something like asking them to design an audit process for the AI counselor, which requires knowing how each approach's reasoning is structured. Avoid getting into meta-ethics, other ethical theories, technical implementation, or politics. 

  Time allocation is tight. Intro (3 min), example setup (5 min), utilitarianism explanation (5 min), deontology (5 min), comparison and auditability (4 min), closing question (3 min). Need to be strict with time. 

  Potential pitfalls: Students might get stuck on the trolley problem. Keeping the example focused on counseling helps. Also, ensuring both groups engage—philosophy newbies need clear definitions, coders need technical connections. 

  Overall, the plan should clarify the core concepts, address misconceptions in context, and end with an application question to assess understanding. The counseling example is effective as it's relatable and multi-dimensional, allowing both ethical frameworks to be applied meaningfully.
answer: |-
  Here’s a battle-tested 25-minute plan designed to **cut through oversimplification** and force engagement with the core tension. The counseling slots example is **perfect** – it’s relatable, high-stakes-but-not-lethal, and exposes concrete trade-offs.

  **Why This Sequence Works:**  
  1.  **Anchors immediately in concrete reality** (not trolleys).  
  2.  **Forces confrontation with the core dilemma** before labeling it.  
  3.  **Preempts major misconceptions** by building definitions from the problem.  
  4.  **Uses coders' strengths** (thinking about functions/rules) while teaching philosophy basics.  

  ---

  **The Plan (25 Mins Sharp):**  

  1.  **Hook: The Counseling Slot Dilemma (3 mins)**  
      *   **Present:** "School has 5 counseling slots/week. 50 students need help. Human counselor uses intuition, feels overwhelmed. We build an AI to decide *who gets a slot*."  
      *   **AI's Power:** "It has *all* the data: grades, attendance, disciplinary records, financial aid status, social media sentiment (hypothetical!), self-reported surveys."  
      *   **The Task:** "How should the AI *reason* to make this decision? What should its core goal/principle be?"  
      *   *(Avoid:* Mentioning Util/Deon yet. *Goal:* Make the problem visceral.)  

  2.  **Brainstorm: What Could the AI *Do*? (5 mins)**  
      *   **Ask:** "Quick ideas! What instructions/rules/goals might we program into this AI? Shout them out."  
      *   **Capture Ideas:** Write them fast on a board/flipchart. *Expect:*  
          *   "Help those most likely to fail/drop out." (Consequence-focused)  
          *   "Help those in *most pain* right now." (Consequence-focused)  
          *   "Everyone gets a turn / Rotate fairly." (Rule-focused)  
          *   "Prioritize students with [specific protected characteristic]." (Rule-focused)  
          *   "Maximize overall GPA improvement." (Consequence-focused)  
          *   "Never exclude based on [X]." (Rule-focused)  
      *   **Key Move:** Group similar ideas *without labeling the philosophies yet*.  

  3.  **Introduce the Lenses: Consequences vs. Rules (7 mins)**  
      *   **Label the Groups:** "Look at our ideas. They cluster into TWO main approaches:"  
          *   **Approach 1: Maximize Good Outcomes (Utilitarianism Lite):** "Focus on *results*. Pick who gets slots to create the *biggest overall improvement* in well-being, academic success, etc. Sacrifice individual fairness if it means better total outcomes." (Point to relevant brainstorm ideas).  
          *   **Approach 2: Follow Core Rules/Duties (Deontology Lite):** "Focus on *principles*. Treat people as ends, not just means. Uphold fairness, rights, or specific duties *even if worse overall outcomes happen*. E.g., 'Never exclude based on disability,' 'Everyone deserves equal chance.'" (Point to relevant ideas).  
      *   **Crucial Clarifications (Preempt Misconceptions HERE):**  
          *   **For Coders:** "A 'utility function' in code is *just math*. Utilitarianism is a *specific ethical theory* saying that utility *must* represent *overall happiness/well-being*. An AI maximizing 'fairness' via a utility function is *not* utilitarian!"  
          *   **For Everyone:** "Deontology isn't *just* hard-coded rules like 'Don't Kill.' It's about *why* – duties, rights, intrinsic worth. The rules stem from principles, not just efficiency."  
      *   **Reframe the Counseling AI:** "So, Utilitarian AI Counselor? Maximize total student well-being/success. Deontological AI Counselor? Uphold fairness rights/duties, even if total well-being suffers slightly." Show concrete trade-offs using brainstorm ideas.  

  4.  **The Hard Part: Why Not Just Mix Them? (5 mins)**  
      *   **Pose the Challenge:** "Smart idea! Why not tell the AI: 'Maximize well-being, BUT never violate rights X, Y, Z?'"  
      *   **Expose the Conflict:** Use the counseling example:  
          *   "What if violating one student's 'right to equal consideration' (e.g., skipping them because their improvement potential is low) *dramatically* boosts the well-being of 5 others? The Utilitarian part screams 'Do it!'. The Deontological rule screams 'Stop!'."  
          *   "**The core problem:** When the rule and the consequence clash *at the fundamental level*, which one wins? How does the AI *reason* its way out? This is where the rubber meets the road."  
      *   **(Preempts the "bolt on rights" misconception by showing the inherent tension)**  

  5.  **The Audit Bomb: Why Rules Might Be Pragmatic (3 mins)**  
      *   **Introduce:** "Here's a powerful *practical* argument, separate from philosophy: **Auditability**."  
      *   **Explain:** "A purely Utilitarian AI makes complex predictions about consequences. *Why* did it deny Student A a slot? 'My model predicted their improvement chance was only 15%, vs. Student B's 80%, maximizing total expected GPA gain.' This is a black box! Hard to verify, easy to hide bias."  
      *   **Contrast:** "A Deontological AI using clear rules is more transparent: 'Student A was denied because rule 4 states slots go to students with GPA < 2.0 first.' Easier to check, easier to debate the rule itself."  
      *   **Connect:** "So, even if you *believe* Utilitarianism is right, you might choose Deontological-style rules for AI because **we can understand and trust its reasoning**." (This *is* deep and relevant – include it!).  

  6.  **The Closing Question (The "Got It?" Test) (2 mins)**  
      *   **Pose:** **"If we built this counseling AI using a purely *deontological* approach (strict rules), what would be the *biggest practical risk* we'd worry about during implementation? What if we used a purely *utilitarian* approach (maximize outcome), what would be the *biggest practical risk* then?"**  
      *   **Why it works:**  
          *   Forces them to apply *both* concepts, not just pick one.  
          *   Moves beyond ethics into real-world system design concerns.  
          *   Reveals understanding of the core trade-offs (Rigidity vs. Opacity/Bias).  
          *   "Practical risk" avoids pure philosophy debate.  

  **What to FLAT OUT REFUSE (Time & Level):**  
  *   **Deep Meta-Ethics:** "Is utilitarianism *actually* true?" "What's the foundation of deontology?"  
  *   **Other Ethical Frameworks:** Virtue Ethics, Care Ethics, etc. (Stick to the binary for clarity).  
  *   **Technical Implementation Details:** Specific ML models, reward shaping tricks.  
  *   **Political Debates:** "This is just socialism/libertarianism!" Steer back to the *structure of reasoning*.  
  *   **Solving the Trolley Problem:** Acknowledge it exists, then firmly pivot back to the counseling AI. "The trolley problem is iconic, but our counseling example shows these dilemmas exist in *many* everyday AI decisions."  

  **Why Your Counseling Example is the Perfect Carrier:**  
  *   **Has:** Relatable stakes, clear trade-offs (individual vs. group, fairness vs. outcome), multi-dimensional data (forces complexity), avoids life/death (reduces knee-jerk reactions).  
  *   **Has Not:** Involuntary sacrifice, unrealistic sci-fi, obvious "right" answer, overused tropes.  

  **Execution Tip:** Be a ruthless timekeeper. Use the board visibly. When misconceptions arise ("But utility function = util!"), *smile* and say "Great point, let's clarify that distinction!" and hit your pre-planned clarification. **Your goal isn't consensus, it's illuminating the fundamental tension.** Good luck!

  ---

  This plan respects both groups' starting points, uses the coders' language to teach philosophy, shuts down dead ends, and ends with a question that reveals genuine understanding. You've got this!
