  I recall decision theory distinguishes substantive and procedural rationality. The procedure's rationality is about expected outcomes, not each step's local optimality. Annealing's "downhill" steps are instrumentally rational when considering the whole search. So A* can remain fully rational while using such methods.

  The user's physics background makes them think in terms of algorithms and efficiency. Philosophers might not consider computational constraints, creating a disconnect. Their challenge is reconciling rigorous optimization insights with ethical idealizations. 

  Their deeper need might be understanding how indirect normativity can be practical without collapsing. They want to preserve the ideal advisor framework but make it computationally feasible. The annealing analogy suggests the procedure isn't directly rational at every step, but that doesn't undermine the criterion-procedure distinction. 

