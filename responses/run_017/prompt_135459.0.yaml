  ## Dedicatory Remarks for the Ruth Calloway Reading Room

  Good morning. It is a profound honor to stand here today as we dedicate this magnificent new reading room to Ruth Calloway. For many of us on the Board, this moment feels long overdue, yet perfectly timed. Overdue, because Ruth’s connection to this archive, and to the history it safeguards, runs deeper than these foundations. Perfectly timed, because it allows us to celebrate her while she’s here to enjoy it – sharp as ever, I should add – and while the stories she helped preserve are still actively shaping our city.

  My own connection to Ruth began over twenty years ago, driving borrowed cars to county courthouses. I was her wheels; she was my education. Hour after hour, she’d read aloud from relocation transcripts, her voice weaving the dry legalese into a tapestry of human struggle and resilience. It was an apprenticeship in seeing how history is *made* – not just recorded.

  Ruth’s seminal work, *Four Ways to Win*, teaches us a crucial lesson about the Halloway victory of 1975. She shows us, meticulously, that the passage of that landmark ordinance – the one that stopped the bulldozers and guaranteed the right to return – wasn’t the work of one hand, or even two. It was, as she compellingly argues, overdetermined. Federal funding rules shifted, a state court ruling changed the landscape, the city’s finances were upended, and political winds shifted. Any one of these forces could have been sufficient to alter Halloway’s fate. History presented multiple paths to that outcome.

  But Ruth’s brilliance doesn’t stop at identifying those converging causes. Her deeper insight, the one that truly reshaped how we understand urban movements, lies in what she called the *texture* of the outcome. The *occurrence* might have been overdetermined, but the *texture*? That was earned.

  Think about what Halloway achieved, compared to similar fights in neighboring cities: It came **six months faster**. Families didn’t endure years more limbo. **No one was hurt** in the process – a tragic contrast to other struggles. The **right of return wasn’t just a hope, it was written into the law**, and because it was concrete, because it was fought for clause by clause, **ninety families actually came home**. And the **tenants' association** Ruth helped build in those pressure-cooker months? It’s **still meeting**, fifty years on. That’s texture. That’s the difference between a win on paper and a win that breathes, rebuilds, and endures.

  That texture wasn’t guaranteed. It was forged by the relentless, often unseen, work that Ruth championed and embodied. It was built on the **dull infrastructure** of organizing – the phone trees, the meeting minutes, the volunteer schedules. It was powered by women in their sixties who started knocking on doors two years before the headlines, laying the groundwork of trust and solidarity. It was fueled by the understanding, which Ruth instilled in everyone, that knowing the rules – federal, state, local – wasn’t bureaucratic drudgery; it was power.

  Which brings me to a night everyone here who was involved remembers: March 12th, 1975. The commission hearing was at eight the next morning. Ruth, along with two others, was in the basement of Mount Zion, wrestling a mimeograph machine. They ran it until four AM. Nine hundred flyers. Sixty people showed up at eight o’clock because of that work, because they knew where to be and why it mattered.

  And at that hearing? The relocation terms were read into the record. Verbatim. Every promise, every protection. That transcript, born partly of ink-stained hands and bleary eyes in a church basement, became the bedrock. Years later, in 1981, when the right of return was challenged, the state appellate court quoted directly from *that record* to uphold it.

  Now, did those flyers, or that precise reading, *change the vote* that night? Ruth, ever the rigorous historian, documented otherwise. Through her own oral history project, we know a key commissioner had already made up his mind on the core funding issue. The win was likely secured through those larger currents.

  But here’s what the flyers and the testimony *did* do: They ensured the texture. They ensured that when the vote *was* cast, the voices of Halloway were formally, indelibly inscribed in the city’s legal memory. They ensured the specific promises – the right of return, the protections – were there, clear as day, for the court to see years later. They ensured the community stood together, visibly, at the moment of decision. That’s the weight the anecdote holds honestly: not manufacturing the win, but meticulously crafting its substance and its enduring legacy.

  Ruth often said that a monument is really a set of instructions. This reading room, bearing her name, is an instruction manual for civic engagement. It instructs us to value the meticulous research that underpins action. It instructs us to honor the collective effort – the drivers, the door-knockers, the mimeograph operators, the rule-learners – alongside the visible leaders. It instructs us that while luck and timing play a role, the *quality* of the outcome – its speed, its humanity, its durability – is determined by the preparation, the precision, and the unwavering commitment of people like Ruth Calloway and the neighbors she worked alongside.

  So, this room is more than just a space for quiet study. It is a testament to the power of knowing your history, understanding the systems, building the infrastructure, and showing up – flyers in hand, testimony ready – to shape the texture of your future. Ruth, thank you for teaching us that lesson, for embodying it, and for ensuring that the story of Halloway, in all its complex, triumphant texture, is preserved here for generations to learn from. May this room inspire countless more stories of community, resilience, and thoughtfully crafted victory. Thank you.

  ---

  **Short Note on Conventional Draft Pitfalls Avoided:**

  1.  **Attributing the Ordinance's Passage Solely/Decisively to Ruth's Actions (e.g., the flyers):** A conventional draft might heavily imply or state outright that the March 12th flyers and testimony directly swayed the crucial vote ("Her tireless work that night changed minds!"). This directly contradicts Ruth's own documented evidence (the commissioner's oral history) and her core argument about the multiple sufficient causes. This speech frames the anecdote's significance in terms of *texturing* the win (ensuring the right of return was formally recorded and legally defensible) and demonstrating community mobilization, not causing the vote itself.
  2.  **Ignoring the Overdetermination:** A standard tribute might easily say, "Without Ruth Calloway, Halloway would have been lost." While emotionally resonant, this directly contradicts the central thesis of her book. This speech explicitly acknowledges the multiple sufficient causes ("overdetermined," "any one of these forces could have been sufficient") while pivoting the credit to where Ruth herself located agency: shaping the *quality* of the inevitable (or likely) outcome.
  3.  **Overstating "Saving" Halloway in the Moment:** While the Mayor will likely say "the woman who saved Halloway," this speech subtly preps the room to hear that as shorthand for her role in shaping the *victory's character*, not as a sole actor against impossible odds. By emphasizing the multiple paths to the outcome *and* her crucial role in defining its texture, the phrase "saved" becomes less about singular, against-all-odds heroism and more about ensuring the win was maximally beneficial and enduring. The speech doesn't fight the Mayor's line; it provides the context that gives it a more nuanced meaning aligned with Ruth's own work.
