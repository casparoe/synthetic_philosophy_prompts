prompt: |-
  Please write a specification for a theory of the commensurability of pleasure and pain, where the purpose the theory has to serve is fixed in advance: it must be good enough to turn lexical threshold negative utilitarianism (LTNU) into an action-guiding view rather than a slogan.

  The version of LTNU I have in mind is the two-threshold one. Below some threshold of intensity and duration, pleasant experiences have negligible positive value — zero, or at any rate not enough to count. Above a second threshold, episodes of suffering are not merely weightier than pleasures but lexically dominant over them: no quantity of sub-threshold pleasure, however vast, compensates for a single episode of suffering above the threshold, and no finite exchange rate converts one into the other. My question is what such a view presupposes about pleasure, pain, and the scale on which they are compared, and which of those presuppositions are legitimate demands on a theory and which are merely prejudices of the negative-utilitarian camp.

  So, for each requirement: state it precisely, give the case or consideration that motivates it, and mark it as non-negotiable for this purpose or as a preference of one camp. I would like the list to cover at least the following, though I do not regard this ordering or division as privileged:

  1. *What the bearers are.* Whether the items compared are momentary phenomenal states, temporally extended episodes, valence-carrying neural events, or whole lives — and what a theory must say about whether a long unpleasant episode can be divided into parts each of which falls below the threshold (the fragmentation, or "dust," worry), and about whether a lifetime of sub-threshold discomforts can be reassembled into something that matters.

  2. *Lexical priority versus incommensurability.* These are different claims and I want them kept apart. A lexical ordering is a relation inside a single scale and presupposes that the ranked items are comparable; incommensurability denies that there is a common scale at all. LTNU is frequently motivated by the second and stated in the vocabulary of the first. Say which one the view actually needs, and what follows if it cannot have it.

  3. *Aggregation across persons.* Whether the ban on trade-offs is intra-personal only or interpersonal as well; what must be said about enormous numbers of very small sufferings; and what must be said about the repugnant-conclusion style argument run in reverse, where one severe episode is ranked worse than any number of mildly pleasant lives.

  4. *Mixed valence.* Experiences that are pleasant and unpleasant together: relief, the scratching of an itch, effort that is enjoyed, grief one would not give up. Whether valence is separable into a pleasant and an unpleasant component, and what is lost if a theory stipulates that it is.

  5. *The zero point, and prudential versus moral significance.* Given that neutral states and sub-threshold pleasures come out equal in value, a theory must say whether it is collapsing the prudential value of an experience into its moral significance, or distinguishing them — and, if it collapses them, what it does with the implication that extinguishing mild pleasure is cost-free, and with the further question whether being permitted to ignore such pleasure is the same as being required to eliminate it.

  6. *Vagueness and the cliff edge.* If the threshold is even slightly vague, then states differing by an arbitrarily small amount are ordered as though one mattered infinitely more than the other. What must a theory say about higher-order vagueness here; may it instead treat near-threshold pairs as neither better, worse, nor equal but on a par; and what does that option cost? I would also like your assessment of a proposal I have not seen discussed — giving the threshold a hysteresis or ratchet structure, so that the level at which an episode enters the lexically dominant regime differs from the level at which it leaves it — as to whether this dissolves the cliff-edge problem or merely relocates it.

  7. *Prospects and risk.* Since the view rejects the trade-off structure that expected-value reasoning normally presupposes, what must it say about ranking gambles — in particular about whether a small probability of threshold-crossing suffering may be averted at the cost of the certain loss of an enormous quantity of sub-threshold pleasure, and what in the theory would make that verdict follow rather than its opposite.

  8. *Locatability.* A view that cannot tell us, even roughly, where the thresholds fall is not action-guiding. What must the scale be connected to — self-report, choice behaviour, neural markers, some hypothetical-choice test — for the theory to be usable, and what is required when those sources disagree?

  Then, two results about the list itself, which are the parts I most want. First: is any subset of these requirements jointly unsatisfiable? My suspicion is that no single theory can combine a sharp lexical threshold, the absence of cliff-edge discontinuity in near-threshold comparisons, and a transitive and complete ranking of the relevant states — but argue for or against that, and if the unsatisfiable subset is not the one I have named, say which it is. Second: which single requirement excludes the largest number of otherwise attractive candidate theories, and which requirement on the list is really a partisan demand of the negative-utilitarian camp that a neutral theorist of commensurability could reject?

  If it is useful, and briefly, since I intend to do the scoring myself: how a single cardinal scale with a priority clause, a parity-style incomparability model, and a two-dimensional or multi-utility representation each fare against the list. Please stipulate any technical vocabulary you need rather than surveying the literature; I am interested in the shape of the specification, not in who has defended what.
reasoning: |-
  We are constructing a specification for a theory of the commensurability of pleasure and pain to make Lexical Threshold Negative Utilitarianism (LTNU) action-guiding. LTNU has two thresholds: below a lower threshold, pleasures have negligible positive value (effectively zero); above an upper threshold, sufferings lexically dominate any amount of sub-threshold pleasure. 

  We will address each requirement in turn, specifying what the theory must achieve, the motivation, and whether it is non-negotiable for LTNU or a partisan preference.

  ### 1. What the bearers are
  **Requirement**: The theory must specify the bearers of value (e.g., momentary states, extended episodes, whole lives) and address:
     - **Fragmentation ("dust") worry**: Can a long unpleasant episode be divided into parts each below the threshold? 
     - **Reassembly**: Can a lifetime of sub-threshold discomforts be aggregated into something above the threshold?

  **Motivation**: Without a clear bearer, we cannot apply thresholds. Fragmentation might allow breaking a severe suffering into sub-threshold parts, evading the lexical ban. Reassembly might turn many mild discomforts into one severe one.

  **Non-negotiable**: The theory must specify the bearers and block fragmentation and reassembly in a way that preserves the thresholds. It must deny that arbitrarily dividing an episode changes its status. We might require that the bearer is the episode as experienced (with its natural boundaries) or use a temporal integral. But the theory must ensure that a suffering above the threshold cannot be fragmented to avoid lexical dominance. Similarly, it must deny that aggregating sub-threshold pains across time or persons creates a lexically dominant suffering.

  **Partisan note**: The insistence that fragmentation is invalid is a non-negotiable for LTNU. A neutral theory might allow aggregation of sub-threshold pains to matter.

  ### 2. Lexical priority versus incommensurability
  **Requirement**: The theory must use lexical priority (a single scale with a discontinuity) rather than incommensurability (no common scale). It must explain why lexical priority holds.

  **Motivation**: LTNU is stated as a lexical ordering: above-threshold suffering is infinitely worse than any sub-threshold pleasure. Incommensurability would imply that we cannot compare them at all, which might lead to paralysis or a different decision rule (e.g., using a third value). But LTNU requires that above-threshold suffering always trumps.

  **Non-negotiable**: Lexical priority is non-negotiable for LTNU. If the theory cannot establish a single scale with a lexical discontinuity, then LTNU collapses. If we fall back to incommensurability, then we cannot say that above-threshold suffering is worse than any amount of pleasure — it might be incomparable, and then we might choose the pleasure.

  ### 3. Aggregation across persons
  **Requirement**: The lexical ban must be interpersonal: no amount of sub-threshold pleasure in any number of persons can compensate for one instance of above-threshold suffering. The theory must also address:
     - Enormous numbers of very small sufferings: do they aggregate to something above the threshold? (We addressed this in part in 1, but now across persons.)
     - The reverse repugnant conclusion: one severe suffering is worse than any number of lives that are mildly pleasant (but all below the lexical threshold for suffering).

  **Motivation**: LTNU is typically motivated by interpersonal cases (e.g., torture vs. mass mild pleasures). If aggregation of small sufferings across persons is allowed, then a large enough number might exceed the threshold. The reverse repugnant conclusion is a feature of LTNU: one person's severe suffering outweighs any number of happy lives (if those lives do not contain above-threshold suffering).

  **Non-negotiable**: The interpersonal scope is non-negotiable for LTNU. The theory must block interpersonal aggregation of sub-threshold sufferings to reach the threshold. It must also accept the reverse repugnant conclusion: one severe suffering is worse than any number of lives that are free of above-threshold suffering and have only sub-threshold pleasures and pains.

  **Partisan note**: The rejection of interpersonal aggregation of small sufferings is a non-negotiable. A neutral theory might allow such aggregation.

  ### 4. Mixed valence
  **Requirement**: The theory must either (a) separate mixed-valence experiences into pleasant and unpleasant components, or (b) provide a way to assign an overall valence or net value that can be compared to the thresholds. 

  **Motivation**: Many experiences (e.g., relief, effortful enjoyment) have both pleasant and unpleasant aspects. If we cannot assign them to one side of the threshold, LTNU cannot rank them.

  **Non-negotiable**: The theory must handle mixed valence without violating the thresholds. Option (a) is preferable for LTNU: split the experience into components, then apply thresholds to each. For example, the unpleasant component of scratching an itch might be below the threshold, so it doesn't trigger the lexical ban, while the pleasant part is also below the threshold of positive significance. But if an experience has an above-threshold unpleasant component, it triggers lexical dominance regardless of any pleasant component.

  **Partisan note**: The requirement to split mixed experiences is a non-negotiable. A neutral theory might treat mixed experiences as having an emergent net valence.

  ### 5. The zero point, and prudential versus moral significance
  **Requirement**: The theory must clarify whether the thresholds apply to prudential value (well-being of the individual) or moral value (obligations to others) or both. It must address:
     - Whether extinguishing mild pleasure is cost-free.
     - Whether being permitted to ignore mild pleasure implies being required to eliminate it.

  **Motivation**: LTNU sets the value of sub-threshold pleasures to zero (or negligible) for moral purposes. But is this the same for the individual's own good? If we collapse prudential and moral value, then eliminating mild pleasures is not bad for the individual and might even be required if it prevents a risk of suffering. This could lead to anti-natalism or requiring the extinction of all sentient life to avoid suffering.

  **Non-negotiable**: For LTNU to be action-guiding, the thresholds must apply to moral significance. However, we might allow that sub-threshold pleasures have positive prudential value for the individual, even if they don't count morally. But then we need a story about why moral significance ignores what is prudentially good. Alternatively, if we collapse them, then we must accept that eliminating mild pleasure is not wrong and might be required.

  **Partisan note**: The collapse of prudential and moral significance at the thresholds is a partisan demand of negative utilitarianism. A neutral theory might separate them.

  ### 6. Vagueness and the cliff edge
  **Requirement**: The theory must address the problem that if the threshold is vague, then arbitrarily close states are treated as lexically ordered. It must consider:
     - Higher-order vagueness (vagueness in where the vague boundary lies).
     - Whether near-threshold pairs can be treated as "on a par" (neither better, nor worse, nor equal) to avoid the cliff.
     - The hysteresis proposal: a ratchet where the entry threshold is higher than the exit threshold.

  **Motivation**: Without a sharp threshold, we cannot apply lexical priority. But sharp thresholds seem implausible for continuous phenomena like pain. Treating near-threshold states as on a par avoids the cliff but might violate transitivity or lexicality.

  **Non-negotiable**: The theory must have a sharp threshold for lexical priority to work. Vagueness can be handled by stipulating a precise cutoff (even if arbitrary) for action-guidance. Hysteresis does not dissolve the cliff but relocates it: there are still two cliffs (one going up, one going down). However, it might help with stability in decision-making. The on-a-par option is costly: it abandons lexical priority for near-threshold states and might lead to intransitivities.

  **Partisan note**: The insistence on a sharp threshold is non-negotiable for LTNU. A neutral theory might embrace vagueness or use a parity relation.

  ### 7. Prospects and risk
  **Requirement**: The theory must rank gambles. In particular, it must hold that a small probability of above-threshold suffering cannot be compensated by any amount of certain sub-threshold pleasure. 

  **Motivation**: Expected utility theory fails under lexical priorities because the expected value of any positive probability of infinite loss is negative infinity. LTNU must extend lexicality to prospects: even a tiny chance of above-threshold suffering dominates any benefit of sub-threshold pleasure.

  **Non-negotiable**: This extension is non-negotiable. The theory must rank any gamble with a positive probability of above-threshold suffering as worse than any gamble without it (but with only sub-threshold outcomes). This might require a lexicographic decision rule: first, minimize the probability of above-threshold suffering (to zero if possible); only then consider other factors.

  **Partisan note**: This strict risk aversion is a partisan feature of LTNU.

  ### 8. Locatability
  **Requirement**: The thresholds must be empirically locatable (at least roughly) via: self-report, choice behavior, neural markers, or a hypothetical-choice test. The theory must specify what to do when these sources disagree.

  **Motivation**: Without knowing where the thresholds are, LTNU cannot guide actions (e.g., is this pain above the threshold?).

  **Non-negotiable**: The theory must connect the scale to observable data. When sources disagree, it must have a tie-breaking rule (e.g., prioritize self-report, or use a combination).

  **Partisan note**: The demand for locatability is non-negotiable for an action-guiding theory. But the choice of which source to use might be partisan.

  ## Results about the list

  ### Joint unsatisfiability
  **Claim**: No theory can simultaneously satisfy:
     - (a) A sharp lexical threshold (from 6),
     - (b) The absence of a cliff-edge discontinuity in near-threshold comparisons (i.e., no arbitrary jumps for arbitrarily close states),
     - (c) A transitive and complete ranking of all relevant states.

  **Argument**:
  - (a) requires that there is a cutoff point such that any state above the threshold is lexically worse than any state below.
  - (b) requires that for any two states that are very close on the scale, they are not lexically ordered (i.e., the difference between them is not infinite). But if we avoid lexical ordering for close states, then near the threshold we must have that states just above and just below are not lexically ordered — but (a) requires they are.
  - (c) requires that the ranking is complete (any two states are comparable) and transitive. But if we try to avoid the cliff by introducing a zone of incomparability (on a par) near the threshold, then we violate completeness. If we try to make the transition smooth, we violate lexicality.

  Therefore, (a), (b), and (c) are jointly unsatisfiable. The unsatisfiable subset is exactly the one you named.

  ### Which requirement excludes the most candidate theories?
  The requirement of **lexical priority (2)** excludes many theories because:
     - Standard utilitarianism uses a continuous scale.
     - Many theories (e.g., those with diminishing marginal utility) avoid lexical orders.
     - Theories that allow incommensurability (e.g., value pluralism) are excluded.

  Also, the **interpersonal lexical ban (3)** is very demanding and excludes theories that allow trade-offs across persons.

  ### Which requirement is a partisan demand?
  The requirement that **sub-threshold pleasures have negligible moral value (5)** is a partisan demand of negative utilitarianism. A neutral theory of commensurability might hold that even small pleasures have some positive moral weight, and that the threshold is just a point of diminishing returns, not zero.

  Additionally, the **reverse repugnant conclusion (3)** is a partisan implication that many would reject.

  ## Assessment of candidate frameworks

  ### Single cardinal scale with a priority clause
  - **What it is**: A single utility scale with a threshold: above-threshold pains have negative infinity utility; below-threshold pleasures have utility zero; sub-threshold pains have small negative utility (if any).
  - **Assessment**:
     - Bearers: Must be defined (e.g., episodes). Fragmentation: Must be blocked by defining natural units.
     - Lexical priority: Built-in.
     - Aggregation: Interpersonal lexicality requires that one above-threshold pain makes the whole outcome infinitely bad. Small pains: if they are below threshold, they are not aggregated to above threshold.
     - Mixed valence: Must be split into components.
     - Zero point: Moral and prudential might be collapsed, leading to strong negative conclusions.
     - Vagueness: Assumes a sharp threshold -> cliff edge. Hysteresis could be added, but still has cliffs.
     - Risk: Any chance of above-threshold pain makes the expected utility negative infinity -> must avoid at all costs.
     - Locatability: Needs a way to set the threshold.
     - **Verdict**: Satisfies most non-negotiables but has the cliff-edge problem and requires sharp thresholds.

  ### Parity-style incomparability model
  - **What it is**: Above-threshold sufferings and sub-threshold pleasures are incomparable (not on a common scale). But then we need a decision rule: e.g., avoid above-threshold sufferings as incommensurably bad.
  - **Assessment**:
     - Lexical priority: Fails -> replaced by incommensurability. But then we cannot say that above-threshold suffering is worse than any pleasure; it is incomparable. We might still choose to prioritize avoiding suffering, but this is an additional norm, not a value ordering.
     - Aggregation: Incomparability might hold across persons, but then we cannot say that one severe suffering is worse than many mild pleasures.
     - Vagueness: The threshold zone might be where incommensurability holds, which avoids the cliff but violates completeness.
     - Risk: Without a common scale, expected utility cannot be calculated. We might use a maximin rule: avoid the worst possible outcome (above-threshold suffering).
     - **Verdict**: Does not satisfy the lexical priority requirement (2) of LTNU. Excluded.

  ### Two-dimensional or multi-utility representation
  - **What it is**: Represent pleasure and pain on separate scales. Then, we might have a lexical rule: if pain is above threshold, then the state is infinitely bad; otherwise, use the pleasure scale (with sub-threshold pain subtracting from pleasure).
  - **Assessment**:
     - Bearers: Must be defined for each dimension.
     - Lexical priority: Built-in by the rule.
     - Aggregation: Interpersonally, the lexical rule applies: one above-threshold pain dominates.
     - Mixed valence: Naturally handled by separate scales.
     - Zero point: Can be set independently for each dimension.
     - Vagueness: Still requires sharp thresholds on the pain dimension -> cliff.
     - Risk: The lexical rule applies: any chance of above-threshold pain makes the outcome infinitely bad in that dimension.
     - Locatability: Now must locate thresholds on two scales.
     - **Verdict**: Similar to the single scale with priority, but handles mixed valence better. Still has the cliff-edge problem.

  ## Conclusion
  The key tension is between lexicality (requiring a sharp discontinuity) and the avoidance of arbitrary cliffs. This is unresolvable without sacrificing either sharp thresholds or completeness/continuity. For LTNU to be action-guiding, it must accept a sharp threshold and the cliff, and then address vagueness by stipulation.

  The partisan demand that excludes the most neutral theories is the moral insignificance of sub-threshold pleasures (5) and the interpersonal lexical ban (3).
answer: |-
  Below is a specification for a theory of commensurability to make Lexical Threshold Negative Utilitarianism (LTNU) action-guiding. The specification addresses your eight requirements, structured as follows for each:  
  - **Requirement**: Precise statement of what the theory must achieve.  
  - **Motivation**: Case or consideration justifying the requirement.  
  - **Status**: Marked as **non-negotiable** (essential for LTNU's action-guidance) or **partisan** (reflects NU preferences but could be rejected neutrally).  

  The theory must yield a complete, transitive, and empirically applicable ranking of states of affairs to guide decisions under LTNU's two-threshold structure:  
  - **Lower threshold (L)**: Below L, pleasant experiences have negligible positive moral value (effectively zero).  
  - **Upper threshold (U)**: Above U, suffering lexically dominates all sub-L pleasures (no finite quantity compensates).  

  ---

  ### **1. What the bearers are**  
  **Requirement**: The bearers must be *temporally extended, phenomenally unified episodes* (e.g., a headache lasting 10 minutes). The theory must:  
  - Block *fragmentation*: No division of a suffering episode above U into sub-U parts is allowed.  
  - Block *reassembly*: Aggregating sub-U sufferings (within or across lives) cannot produce a value equivalent to or exceeding U.  
  **Motivation**: If fragmentation is permitted, a severe torture could be split into "dust" of sub-U moments, evading lexical dominance. If reassembly is allowed, a lifetime of mild discomforts could morally equal a single severe trauma, violating LTNU.  
  **Status**: Non-negotiable. Without this, LTNU collapses under conceptual manipulation.  

  ### **2. Lexical priority versus incommensurability**  
  **Requirement**: The theory must enforce *lexical priority* (a single scale with a discontinuity at U) and reject *incommensurability* (no common scale). It must ensure comparability: Any episode above U is determinately worse than any episode below U, regardless of quantity.  
  **Motivation**: LTNU requires lexical dominance (e.g., one torture outweighs infinite orgasms). Incommensurability would imply no rational comparison, making LTNU non-action-guiding (e.g., we might choose pleasure over suffering).  
  **Status**: Non-negotiable. If lexical priority fails, LTNU becomes a slogan lacking decision rules.  

  ### **3. Aggregation across persons**  
  **Requirement**: The lexical ban must be *interpersonal*: No amount of sub-L pleasure in any number of persons compensates for one episode of suffering above U. The theory must:  
  - Reject aggregation of sub-U sufferings across persons (e.g., a billion mild itches ≠ torture).  
  - Accept the *reverse repugnant conclusion*: One instance of suffering above U is worse than any number of lives containing only sub-U states (even if net pleasant).  
  **Motivation**: LTNU is motivated by interpersonal cases (e.g., torture vs. masses of mild pleasure). Allowing aggregation would permit "death by a million papercuts," contra NU intuitions. The reverse repugnant conclusion is inherent to lexical dominance.  
  **Status**: Non-negotiable for scope; partisan for reverse repugnance. A neutral theory could allow aggregation or reject reverse repugnance.  

  ### **4. Mixed valence**  
  **Requirement**: The theory must treat valence as *separable*: Any mixed-valence experience (e.g., grief, effortful work) decomposes into distinct pleasant and unpleasant components, each assessed against thresholds independently.  
  **Motivation**: Mixed experiences challenge unitary ranking (e.g., is enjoyable effort net-above L or net-below U?). Separability ensures thresholds apply cleanly: If an unpleasant component exceeds U, the episode triggers lexical dominance.  
  **Status**: Partisan. A neutral theory could treat valence as emergent (e.g., net intensity), but LTNU needs separability to avoid threshold ambiguity.  

  ### **5. The zero point, and prudential versus moral significance**  
  **Requirement**: The theory must *distinguish prudential and moral value*. Sub-L pleasures have positive prudential value for the individual but zero moral significance. Extinguishing them is *permitted* but not *required* unless it prevents risk of U-suffering.  
  **Motivation**: Collapsing prudential and moral value implies eliminating mild pleasures is obligatory (e.g., anti-natalism). Distinguishing them avoids requiring gratuitous destruction of sub-L goods while permitting it to avert suffering risks.  
  **Status**: Partisan. A neutral theory could collapse them, but LTNU needs this distinction to avoid extreme obligations.  

  ### **6. Vagueness and the cliff edge**  
  **Requirement**: The theory must impose a *sharp threshold* (no vagueness) at U and L. It must reject "parity" (incomparability for near-threshold pairs) and higher-order vagueness. The *hysteresis proposal* (e.g., entry at U₁ > exit at U₂) is inadmissible—it relocates but does not dissolve cliffs.  
  **Motivation**: Vagueness creates arbitrariness: States differing minimally could be ordered as infinitely different. Parity violates completeness and lexicality. Hysteresis merely shifts cliffs (e.g., from U₁ to U₂) and introduces new problems (e.g., hysteresis loops).  
  **Status**: Non-negotiable for sharp thresholds; partisan against parity. A neutral theory might embrace vagueness/parity to avoid discontinuities.  

  ### **7. Prospects and risk**  
  **Requirement**: The theory must rank gambles using a *lexical decision rule*: Any prospect with positive probability of U-suffering is infinitely worse than any prospect with zero probability of U-suffering, regardless of sub-L pleasures.  
  **Motivation**: Standard expected utility fails with lexicality (e.g., a 0.0001% risk of torture could outweigh guaranteed vast sub-L pleasures). A lexical rule prioritizes reducing U-risk to zero above all else.  
  **Status**: Non-negotiable. Without this, LTNU cannot handle uncertainty.  

  ### **8. Locatability**  
  **Requirement**: Thresholds must be *empirically locatable* via a privileged source (e.g., neural markers of unbearable suffering). Self-report, choice behavior, and hypothetical tests are admissible only if they converge. Disagreements require a *tiebreaker* (e.g., neural markers override self-report).  
  **Motivation**: If thresholds are unlocatable, LTNU cannot classify real-world states (e.g., is chronic pain above U?). Privileging a source ensures action-guidance.  
  **Status**: Non-negotiable. LTNU is useless without empirical anchors.  

  ---

  ### **Results on the Specification**  
  #### **1. Joint Unsatisfiability**  
  The subset **{Lexical Priority (Requirement 2), Absence of Cliff Edges (Requirement 6), Complete and Transitive Ranking}** is **jointly unsatisfiable**.  
  - **Argument**: Lexical priority demands a sharp discontinuity at U (Requirement 6), creating a "cliff" where states infinitesimally below/above U are infinitely separated. Avoiding cliffs requires continuity or parity (e.g., near-U states are incomparable), violating completeness. Transitivity fails if parity creates nontransitive cycles. Thus, no theory can simultaneously satisfy all three.  
  - **Implication**: LTNU must accept cliff edges to retain lexicality and completeness. Vagueness/parity models (e.g., Chang’s "parity") are incompatible.  

  #### **2. Most Exclusionary Requirement and Partisan Demand**  
  - **Most exclusionary requirement**: **Lexical Priority (Requirement 2)**. It excludes:  
    - Cardinal scales (e.g., classical utilitarianism) that lack discontinuities.  
    - Parity/incommensurability models (e.g., Raz-style value pluralism).  
    - Continuum-based theories (e.g., weighted prioritarianism).  
  - **Strongest partisan demand**: **Moral Insignificance of Sub-L Pleasures (Requirement 5)**. A neutral theory of commensurability could reject this, assigning positive (but diminishing) moral weight to sub-L pleasures without lexicality.  

  ---

  ### **Assessment of Candidate Frameworks**  
  Briefly scored against key requirements (✓ = fully satisfies, ~ = partially, ✗ = violates):  

  | Framework                   | Bearers (1) | Lexical Priority (2) | Interpersonal Aggreg. (3) | Mixed Valence (4) | Risk (7) | Locatability (8) | Cliff Avoidance (6) |  
  |-----------------------------|-------------|----------------------|---------------------------|-------------------|----------|------------------|---------------------|  
  | **Single cardinal scale**   | ~           | ✗                    | ✗                         | ✗                 | ✗        | ✓                | ✗                   |  
  | **Parity incomparability**  | ✓           | ✗ (uses incomm.)     | ~                         | ~                 | ~        | ✗                | ✓                   |  
  | **Two-dimensional utility** | ✓           | ✓ (via priority rule)| ✓                         | ✓                 | ✓        | ~                | ✗                   |  

  - **Single cardinal scale**: Fails lexical priority (no discontinuity) and interpersonal aggregation (allows trade-offs). Unsuitable.  
  - **Parity incomparability**: Avoids cliffs but fails lexical priority (requires incommensurability). Incompatible with LTNU.  
  - **Two-dimensional utility**: Best fit. Treats pleasure/pain as separate axes, applies lexical rule to pain dimension. Satisfies most non-negotiables but inherits cliff edges (sharp U-threshold).  

  ---

  ### **Conclusion**  
  A theory satisfying this specification must:  
  - Anchor thresholds in empirical reality (Requirement 8).  
  - Enforce sharp lexical dominance with a two-dimensional structure (Requirements 2, 4, 7).  
  - Reject fragmentation/reassembly (Requirement 1) and interpersonal aggregation (Requirement 3).  
  - Distinguish prudential and moral value to avoid over-demandingness (Requirement 5).  

  **Trade-off**: Cliff edges are unavoidable (Requirements 2 and 6 conflict), but LTNU can mitigate this via hysteresis (e.g., U-entry > U-exit) for psychological plausibility, though it only relocates cliffs. The **core partisan demand**—moral insignificance of sub-L pleasures—is defensible within LTNU but contentious externally.  

  This specification makes LTNU action-guiding by fixing thresholds, bearers, and decision rules, but at the cost of accepting discontinuities and stringent constraints on aggregation. A viable theory resembles a two-dimensional model with lexical pain-dominance.
