  We are teaching the clinical safety committee about the impossibility of simultaneously satisfying three fairness criteria for a readmission-risk score, given differing base rates between groups A and B (22% vs 11% readmission rates). The criteria are:
  (a) Calibration within groups: The predicted probability should match the observed readmission rate within each group.
  (b) Equal false positive rates (FPR) across groups: Among non-readmitted patients, the proportion incorrectly flagged as high-risk (and thus receiving the intervention) should be the same for A and B.
  (c) Equal false negative rates (FNR) across groups: Among readmitted patients, the proportion incorrectly flagged as low-risk (and thus not receiving the intervention) should be the same for A and B.

  The core conflict arises because the base rates differ. We must convey this without overwhelming the committee with algebra or abstract examples. We will use a concrete, small-scale example that illustrates the tension.

  **Plan Sequence:**

  1. **Set the stage with the problem and the stakes (5 minutes):**
     - Briefly recap the program: Discharged patients are scored; the top 200 by risk score get extra nurse visits to prevent readmission.
     - State the committee's three fairness goals (a, b, c) and note that the vendor claims they are achievable. Explain that we will show why, in general, they cannot all hold at once when the base rates differ.

  2. **Introduce the base rate difference (5 minutes):**
     - Highlight the observed readmission rates: Group A (22%) and Group B (11%). Emphasize that this difference is a real-world observation and not an artifact of the model.
     - Explain that this difference is critical because it means that, all else equal, group A has more actual readmissions per patient than group B.

  3. **Clarify the three criteria with a focus on what they mean in practice (5 minutes):**
     - (a) Calibration: If the model says a patient in group A has a 20% risk, then about 20% of such patients should be readmitted. Similarly for group B.
     - (b) Equal FPR: Among patients who do not get readmitted, the same proportion in each group are incorrectly offered the intervention (i.e., they were flagged as high-risk but didn't need it). This is about not overburdening one group with unnecessary visits.
     - (c) Equal FNR: Among patients who are readmitted, the same proportion in each group are incorrectly denied the intervention (i.e., they were flagged as low-risk but ended up being readmitted). This is about ensuring that missed opportunities for prevention are equally distributed.

     *Why not start with algebra or abstract examples?* 
     - Algebra (like the decomposition of error rates) would be too abstract for a mixed audience. Clinicians might disengage.
     - Abstract examples (e.g., coins with different biases) might not connect to the real-world stakes. We need the example to feel concrete and relevant.

  4. **Present the worked example (15 minutes):**
     - **Structure:** A small table of fictitious patients (about 12-16) split between groups A and B. The example must have:
          - Different base rates: Group A with higher readmission rate (e.g., 2 out of 8, or 25%) and group B with lower (e.g., 1 out of 8, or 12.5%).
          - The risk score should be informative but imperfect (e.g., it ranks most readmitted patients high but not all).
          - A fixed intervention threshold: We select the top N (say, 4 out of 16) for the intervention.

     - **Load-bearing features:**
          - Differing base rates: This is the root cause of the conflict.
          - Informative but imperfect score: To show that even a good model cannot avoid the conflict.
          - Fixed number of interventions (here, 4): This reflects the real-world constraint and forces trade-offs.

     - **What to avoid:**
          - Training-label bias: The example should assume the readmission labels are accurate and unbiased.
          - Proxy variables: Do not use group membership in the model; the score should be based on health factors.
          - Harmful intervention: Assume the intervention (nurse visits) is beneficial or at least not harmful.

     - **Example Table:**

       We have 16 patients: 8 in group A (base rate ~25%) and 8 in group B (base rate ~12.5%). We assign readmissions such that:
          - Group A: 2 readmissions (so 25%).
          - Group B: 1 readmission (so 12.5%).

