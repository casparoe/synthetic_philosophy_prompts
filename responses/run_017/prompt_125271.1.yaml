     - Relaxing to "calibrated on average within every efficiently-identifiable subgroup" might be possible if the model is very well specified, but it doesn't resolve the conflict between (b) and (c). In fact, calibration within groups is already one of the criteria, and we've seen it doesn't help with (b) and (c) simultaneously.

  7. **Complication 2: Fixed budget (5 minutes):**
     - The two hundred slots are fixed. This means we are using a global threshold. The criteria (b) and (c) are defined conditionally on the outcome (non-readmitted and readmitted) but the intervention allocation depends on the score and the fixed budget. This framing makes it clear that we are ranking patients and cutting off at 200. Therefore, the false positive and false negative rates are determined by the threshold, which is set by the budget.
     - Without a fixed budget, we could set thresholds to meet (b) and (c) independently, but then the number of interventions would differ. The fixed budget forces a global threshold, which causes the conflict when base rates differ.

  8. **What we openly decline to explain (2 minutes):**
     - We will not address causal fairness (e.g., what would have happened if the patient were in the other group) because it is not required by the committee's criteria and is a separate, complex issue.
