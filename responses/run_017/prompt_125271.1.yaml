  ### Teaching Plan: Explaining the Impossibility of Simultaneous Fairness Criteria

  #### **Overall Sequence and Timing (40 Minutes Total)**
  1. **Context and Stakes (5 minutes)**  
     - Open with the program's goal: preventing unplanned readmissions via targeted nurse visits.  
     - State the committee's three fairness criteria (calibration, equal FPR, equal FNR) and the vendor's claim they are achievable.  
     - Flag the core conflict: "These criteria cannot coexist when group readmission rates differ, except in unrealistic scenarios. Today, I'll show you why."  
     *Why this order?* Jumping straight into algebra or definitions would lose the clinical audience. Starting with the program's real-world stakes (patient outcomes, resource constraints) grounds the discussion in their priorities.

  2. **Base Rates: The Root Cause (5 minutes)**  
     - Present the trust's data: Group A (22% readmission) vs. Group B (11%).  
     - Emphasise: "This difference isn't a modelling error—it's observed in your patient population. It *must* shape how fairness works."  
     *Why now?* Without establishing base-rate disparity upfront, the conflict seems abstract. Alternatives (e.g., opening with criteria definitions) risk misattributing the issue to "bias" rather than fundamental mathematics.

  3. **Clarifying the Criteria (5 minutes)**  
     - Define each criterion **in clinical terms**:  
       - **(a) Calibration**: "If the model says 100 Group A patients each have a 22% risk, roughly 22 are readmitted. It’s about trustworthy predictions, not accuracy."  
       - **(b) Equal FPR**: "Among patients who *wouldn’t* be readmitted anyway, the proportion unnecessarily receiving visits is equal for A and B."  
       - **(c) Equal FNR**: "Among patients who *would* be readmitted, the proportion wrongly denied visits is equal for A and B."  
     - Stress: "Criteria (b) and (c) depend on unobservable counterfactuals—we only know what *actually* happened."  
     *Why not coins/urns?* Clinical audiences disengage from abstract analogies. Concrete patient-level reasoning maintains focus.

  4. **The Worked Example: Core of the Session (15 minutes)**  
     - **Present a table** of 12 fictitious patients (6 in A, 6 in B). Load-bearing features:  
       - Base rates: 3/6 readmitted in A (50%), 1/6 in B (~17%).  
       - Risk scores: Informative but imperfect (e.g., 1 readmitted patient in A misclassified as low-risk; 1 non-readmitted in B misclassified as high-risk).  
       - Fixed intervention: Only the top 3 scores get visits (mirroring the 200-slot constraint).  
     - **Walk through the conflict**:  
       - Achieve calibration: Adjust scores so prediction matches actual readmissions *within each group*.  
       - Show FPR inequality: Non-readmitted Group B patients have higher false-positive rates.  
       - Show FNR inequality: Readmitted Group A patients have lower false-negative rates.  
       - *Key visual*: Circle cells where criteria clash. State: "See how calibration forces (b) and (c) apart?"  
     - **Avoid misleading features**:  
       - Do not: Include proxy variables (e.g., "postcode" as race proxy) or harmful interventions (distracts to ethics).  
       - Do: Emphasise scores are clinically derived (e.g., based on comorbidities, labs).  

  5. **Addressing Misconceptions (5 minutes)**  
     Preempt these *during* the example and recap:  
     - ❌ "Fairness means deleting group membership from data."  
       - *Defuse early*: "We didn’t use group labels in scoring. The conflict arises from *outcome* disparities, not input bias."  
     - ❌ "Impossibility proves the model is biased—reject it."  
       - *Defuse during criteria clarit*: "This isn’t a model flaw. Even a perfect score would struggle if base rates differ."  
     - ❌ "We can ‘split the difference’ approximately."  
       - *Defuse post-example*: "Approximating all three risks violating calibration—making scores untrustworthy."  
     - ❌ "Equal visits for A and B achieves fairness."  
       - *Defuse with budget framing*: "Allocating 100 visits to each group ignores risk, harming equity."  
     - ❌ "Calibration means individual certainty."  
       - *Defuse during definitions*: "Calibration is about group averages—it doesn’t guarantee ‘22% risk’ is precise for *one* patient."  
     - **Clinician-specific misconceptions**:  
       - ❌ "Different thresholds per subgroup fix this."  
         - *Defuse post-budget discussion*: "This might help but violates procurement specs requiring a *single* score."  
       - ❌ "We need criteria (a)–(c) for every ward/diagnosis."  
         - *Place here*: Transition to complications.  

  6. **Complications (5 minutes)**  
     - **Every subgroup demand**:  
       - State: "Extending (a)–(c) to all wards/diagnoses multiplies conflicts unless base rates are identical everywhere—which they aren’t."  
       - Offer: "Relaxing to ‘calibration on efficiently identifiable subgroups’ helps technically but *still* clashes with (b)/(c) under base-rate gaps."  
     - **Fixed-budget framing**:  
       - Place after the example: "The 200-slot constraint forces a global risk threshold. This makes (b) and (c) mutually exclusive because:  
         - Higher base rates = more high-risk patients in Group A.  
         - Equal FPR *requires* fewer Group A patients flagged high-risk (to match B’s low-error rate), but that worsens FNR in A."  

  7. **What We Won’t Cover (2 minutes)**  
     - State clearly: "Today, we’re avoiding:  
       - Causal fairness (e.g., ‘Would this patient have different risk in another group?’).  
       - How nurse visits *change* outcomes (making observed error rates unreliable for (b)/(c)).  
     These are critical but separate—require deeper workshops."  

  8. **Closing Question to Test Understanding (3 minutes)**  
     - **Pose**: "Suppose we double nurse capacity to 400 slots. Does the conflict between (a), (b), and (c) disappear?"  
       - *Correct answer*: "No—base-rate differences still force trade-offs. Only equal base rates or a perfect score would resolve it."  
     - *Why this question?* Changing capacity tests if they grasp that the conflict stems from base rates + constrained thresholds, not budget size. A "yes" suggests deference; "no" signals understanding.  

  ---

  ### **Key Teaching Principles**
  - **Worked Example Non-Negotiables**:  
    - Must show calibration pulling FPR/FNR apart *due to base rates*.  
    - Must use fixed slots (not thresholds) to force competition.  
    - Must avoid proxies/harm to stay focused on the mathematical conflict.  
  - **Why Sequence Matters**: Clinicians engage through clinical logic (problem → data → criteria → conflict). Algebra-first loses them; coins/urns feel irrelevant.  
  - **Handling Subgroups/Budget**: Address when misconceptions arise (subgroups) or after the example (budget). This anchors complications in concrete stakes.  
  - **Closing**: The capacity question reveals if they internalise that base rates + constrained optimisation drive the conflict—not model quality or budget size.  

  **Final Note**: Stress that this isn’t about rejecting the model but prioritising criteria. End with: "Your procurement specs demand the impossible. We must choose which fairness matters most."
