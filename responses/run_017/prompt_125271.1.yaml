  5. **Address misconceptions (5 minutes):**

     - *"Fairness is not using group membership"*: We are not using group membership in the model. The score is based on health factors. But the fairness criteria are evaluated by group, so we must measure by group.

     - *"The impossibility means the score is biased and should be rejected"*: Not at all. The conflict is a mathematical consequence of the base rate difference. It doesn't indicate bias in the model. In fact, a model that is well-calibrated will reflect the base rate difference.

     - *"We can split the difference"*: We can try to balance the criteria, but we cannot satisfy all three exactly. We must choose which fairness criteria to prioritize.

     - *"Equal share of visits"*: The committee might think that fairness means that group A and B receive visits in proportion to their population size. But that is not the same as (b) or (c). We might allocate visits 50-50, but then we would not be targeting by risk.

     - *"Calibration is a claim about individuals"*: Calibration is a group-level property (e.g., in a large group of patients with a predicted risk of 20%, about 20% are readmitted). It does not guarantee that an individual's risk is exactly 20%.

     - **Additional misconceptions specific to clinicians:**
          - They might think that the solution is to have separate models for each group. But that doesn't resolve the conflict: if we have separate models, we still have one global ranking? Or do we allocate a fixed number per group? The committee's criteria don't specify per-group quotas.
          - They might confuse the risk score with the actual benefit from the intervention. The intervention might be more effective in one group, but that is a separate issue.

