     But that is too direct.

     Let me propose: 
          "We've seen that the vendor's claim is only possible in edge cases. What is the key factor that creates the conflict?"
          Expected answer: the difference in readmission rates between groups A and B.

     This is safe and gets to the core.

  **Final Plan Timing:**

    - 0-5 min: Introduction and stakes.
    - 5-10 min: Base rates.
    - 10-15 min: Clarify criteria.
    - 15-30 min: Worked example (using aggregate numbers and the typical relationship).
    - 30-35 min: Address misconceptions.
    - 35-40 min: Complications (subgroups and fixed budget) and what we won't cover.
    - 40 min: Closing question: "What is the key factor that makes it impossible to satisfy all three criteria?" Then summarize: the difference in base rates.

  Note: The worked example might be presented with a slide showing the aggregate numbers and the resulting FPR and FNR when the model is calibrated and a global threshold is used.

  Example slide for aggregate:

    Group A: 1000 patients, 220 readmissions (22%)
    Group B: 1000 patients, 110 readmissions (11%)

    Model is calibrated in each group.

    Global threshold: select the 10% highest risk -> 200 patients.

    Because of the base rate difference, we expect:

      - More selected from A: say 150 from A, 50 from B.

    Then:

      - In A: suppose 140 of the 150 are readmitted (true positives). Then false positives in A: 10.
          Non-readmitted in A: 780 -> FPR_A = 10/780 ≈ 1.28%.
      - In B: suppose 40 of the 50 are readmitted. Then false positives in B: 10.
          Non-readmitted in B: 890 -> FPR_B = 10/890 ≈ 1.12% -> not equal.

    If we try to force FPR_A = FPR_B, we would need to select fewer from A and more from B? But then we would miss more readmissions in A.

    Specifically, to have FPR_A = FPR_B = 1.12%, then in A we would select 1.12% of 780 = about 8.7 (say 9) false positives. Then the total selected in A would be about TP_A + 9. But TP_A cannot exceed 220. And we have a fixed budget of 200. This becomes messy.

    Instead, we can just state the typical relationship: FPR_A > FPR_B and FNR_A < FNR_B, and therefore they cannot be equal.

  Given the time, we might skip the detailed numbers and use a conceptual explanation with the example.

  **Revised Worked Example for the Session:**

    We'll use a visual: two overlapping distributions for group A and B.

    Group A (high base rate): 
        - Non-readmitted: distribution of risk scores centered at 0.22 but with a tail to the right.
        - Readmitted: distribution centered at 0.8, but with a tail to the left.

    Group B (low base rate):
        - Non-readmitted: distribution centered at 0.11, mostly below 0.5.
        - Readmitted: distribution centered at 0.6, with a tail to the left.

    We set a threshold t (say at 0.4). Then:

        - The area of non-readmitted A above t is larger than that of non-readmitted B -> FPR_A > FPR_B.
        - The area of readmitted A below t is smaller than that of readmitted B -> FNR_A < FNR_B.

    Therefore, we cannot have both FPR_A = FPR_B and FNR_A = FNR_B.

