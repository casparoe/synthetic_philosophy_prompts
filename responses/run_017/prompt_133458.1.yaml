  But note: the patient employee could have chosen the same contract? Why didn't she? Because the employer designed the contract based on the employee's discount rate. The employer knew the employee's type and offered a contract that exactly met the reservation utility for that type. The patient employee, if offered the impatient employee's contract, would get √7.53 + √92.47 ≈ 2.74 + 9.62 = 12.36, which is above her reservation utility of 12. But why would the employer offer that to the patient employee? The employer doesn't care about being generous; he only wants to meet the reservation utility. So for the patient employee, he can offer a contract that gives exactly 12, which costs him 100. If he offered the contract that gives 12.36, that would also cost 100, but he doesn't have to. So he offers the minimal required, which for the patient is the contract that gives 12.

