    Now, question 2: under what condition on C would the two procedures coincide?

    They would coincide if the updated sets are such that the worst-case distribution at each node is the same as the worst-case distribution ex ante for the whole plan.

    A sufficient condition is that C is such that there is a single distribution p in C that is the worst for every event. More precisely, if there is a distribution p* in C that minimizes the expected utility for every act (including the acts that are plans). But that might be too strong.

    In particular, for dynamic consistency in maxmin expected utility, it is known that the set C must be rectangular or satisfy the condition of "closed under pasting". This is the condition of Epstein and Schneider (2003) for rectangularity.

    The condition is that the set C is such that for every partition of the state space (in this case, the partition by test results), the conditional distributions can be chosen independently and the set is the product of the conditionals over the partition.

    Formally, C should be rectangular with respect to the filtration. In this two-stage case, it means that the set of conditionals given the test result and the marginal on the test result can be chosen independently.

    So, the set C should be of the form: 
      C = { p : p = q * r, for q in Q and r in R }
    where Q is a set of distributions on the test result, and R is a set of conditional distributions given the test result.

    But in general, C might not have this property.

    In our example, it does not, because the marginal on the test result and the conditional are linked.

    The condition is that C is rectangular with respect to the partition induced by the test.

    What does this prevent? It prevents the agent from having prior-by-likelihood combinations that are not independently chosen. For example, if the agent is uncertain about the prevalence and the test reliability, and these are independent, then rectangularity might hold. But if there is correlation between the prior and the likelihood, then rectangularity fails.

    In particular, for repeated trials of a possibly biased coin, if the agent is uncertain about the bias and updates by maxmin, then without rectangularity, dynamic consistency may fail.

    Is it an acceptable cost? It depends. If the agent's evidence does not justify independence between the prior and the likelihood, then rectangularity may not hold, and the agent may have to use the sequential method to be dynamically consistent.

    But if she uses the sequential method, she may be more pessimistic.

