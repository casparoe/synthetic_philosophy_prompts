  We are comparing two ways to evaluate a contingent plan (a complete specification of what to do after each test result):

  (G) Ex ante: For each plan, compute the unconditional expected utility for each p in C, then take the minimum over C. Then choose the plan with the highest minimum.

  (S) Sequential (fold back): At each final decision node (after a test result), update the set C to the set of conditional distributions (conditioned on the observed result) and evaluate each available action at that node by its worst-case conditional expected utility over the updated set. Then choose the best action at that node. Then, at the initial node (before the test), for each possible test result, we have the value of the chosen action at that node (which is the worst-case conditional expected utility). Then we compute the expected value of these node values for each p in C (taking the test result as random) and then take the minimum over C of that expected value. Then we choose the plan that yields the highest such minimum.

  The key difference: (G) uses a single p in C to compute the entire plan's unconditional expected utility. (S) allows a different p to be chosen adversarially at each information set (i.e., after each test result) and then also adversarially at the initial node for the expectation over the test results.

