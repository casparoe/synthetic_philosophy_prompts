    Now, for the last part, the least-adversarial-prior rule.

    Find p* in C that minimizes the expected utility the agent could get by best-responding to it. That is, for each p, compute V(p) = max_{plan} E_p[ utility of the plan]. Then p* is the minimizer of V(p).

