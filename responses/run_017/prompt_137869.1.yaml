    Minimax regret: in minimax regret, you minimize the maximum regret. Regret is the difference between the best you could have done in a state and what you did. This is a different criterion.

    But the least-adversarial-prior rule is like using a particular prior and then being Bayesian. It is dynamically consistent, but it may not be maxmin.

