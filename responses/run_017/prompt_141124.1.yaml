  ### Why This Works
  - **Experiential APC Problem**: The dataset is designed so age, period, and cohort effects are confounded (e.g., a 60-year-old in 2020 is always born in 1960). Teams *experience* the ambiguity when predictions fail.
  - **Silly Group Wins**: Q4 correlates with birth year's last digit—making Team 3 competitive. This forces the group to confront whether predictive power implies reality.
  - **Wall vs. Window in Action**: Team 1 uses rigid boundaries; Team 2 re-sorts people over time. The whiteboard captures this contrast visually.
  - **Low Stakes, High Engagement**: Poker chips/tally marks add playful competition without pressure.

  **Final Tip**: In debrief, explicitly link game moments to your "window vs. wall" distinction and APC problem. Example: *"When Team 2 moved Bob from ‘Middle’ to ‘Old’ between surveys, that’s the window picture. But when we say ‘Boomers,’ we’re building a wall."*
