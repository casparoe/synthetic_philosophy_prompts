prompt: |-
  I'm writing a paper arguing that the wrong-kind-of-reasons problem is not an artifact of bet-and-demon cases, and that the standard reply — that the demon gives you a reason to bring it about that you have the attitude, not a reason to have it — is a local fix rather than a general solution. I need one case built to order that makes the point without the devices the usual cases lean on.

  The case: a single paragraph, realistic, involving ordinary people, with no demon, bet, bribe, threat, hypnotist, drug, neurointervention, or similar crude incentive device. The wrong-kind pressure must come from something with independent normative standing of its own — a promise, a role, a relationship, a joint commitment, a duty of gratitude — and it must bear on a particular occasion, not on a long-term project of managing your own psychology.

  Specifications:

  (i) The attitude is recalcitrant: not producible or extinguishable at will, and not the sort of thing one can simply decide to acquire. Grief, amusement, trust, being unsettled, and finding someone impressive are the kind of thing I have in mind. Name the attitude you pick and say why it qualifies.

  (ii) The right-kind reason — the consideration bearing on whether the attitude fits its object — is present and undefeated, and the wrong-kind reason is moral rather than merely prudential.

  (iii) The verdicts must fall out of the views rather than be stipulated. Show what a fitting-attitude theorist says (understand this as someone who analyses value in terms of what it is fitting to favour, and who holds that a reason for an attitude must bear on its fittingness) and what an inclusive theorist says (someone who holds that any consideration counting in favour of having an attitude is a reason for it, and that the right/wrong-kind distinction marks nothing real). Argue to each verdict from the view, not from the intuition you want the reader to have.

  Then: explain why the reason-to-bring-it-about or cultivate-it reply cannot do its usual work here, and in particular why the fallback that a recalcitrant attitude can still be cultivated indirectly — arranging situations, enlisting others, taking it up as a project over time — does not restore that reply. Identify the single feature of the case doing the work, say what happens to both verdicts if you remove that feature and substitute the nearest thing the standard cases use (a controllable attitude in place of the recalcitrant one, or a cash offer in place of the promise), and give the strongest objection available to whichever of the two views your case leaves looking worse.
reasoning: |-
  Okay, the user is writing a paper on the wrong-kind-of-reasons (WKR) problem and wants a custom case that avoids typical elements like bets or demons. They need a realistic scenario involving ordinary people, where the pressure comes from something with normative standing—like a promise or duty—and targets a recalcitrant attitude. 

  First, I need to pick a suitable attitude. Grief qualifies well because it's involuntary and can't be summoned at will—it arises from loss. Trust also fits, but grief has clearer fittingness conditions. The right-kind reason for grief is the actual loss, while the wrong-kind reason must be moral, like a promise not to grieve. 

  Next, the scenario: a woman promises her dying partner not to grieve. The promise creates moral pressure, but the loss persists as an undefeated fittingness reason. This meets all specs—no demons, just a promise with normative weight. 

  For the theorists: 
  - The fitting-attitude theorist says the promise gives a reason to *act* (conceal grief) but no reason *for grief itself*, since grief's fittingness depends solely on the loss. 
  - The inclusive theorist counts the promise as a genuine reason for the attitude, collapsing the WKR distinction. 

  The cultivation reply fails here because grief can't be directly cultivated. Indirect methods (avoiding reminders) are irrelevant—they don't address whether the promise is *itself* a reason for the attitude. 

  If we make the attitude controllable (e.g., deciding to trust), the fitting-attitude view escapes easily. If we swap the promise for cash, the inclusive view looks worse because it equates moral and crudely incentivized reasons. 

  Strongest objection: The inclusive theorist can argue that the promise *does* bear on grief—e.g., by making it unfitting to dwell on loss. But this confuses evaluating the attitude with evaluating actions around it. The core issue remains: grief's fittingness is unchanged by external promises. 

  This case forces a wedge between the views without crutches, showing the WKR problem's depth.
answer: |-
  Here is a case meeting all specifications, followed by the analysis:

  ### The Case: The Promise at the Hospice Bed
  Sarah sat by David's hospice bed as he slipped away peacefully after a long illness. In his final lucid moments, David, knowing Sarah's tendency towards deep, prolonged grief, made her promise: "Please, for my sake and the kids', don't grieve for me. Celebrate my life, be strong for them. Promise me you won't let sorrow take over." Sarah, wanting to comfort him and honour his last wish, sincerely promised. Now, standing by his grave after the funeral, Sarah feels the crushing weight of loss welling up – profound grief threatens to engulf her. The loss of her beloved partner is undeniably real and significant, a clear fitting object for grief. Yet, her solemn promise to David presses on her conscience: she feels she *should not* grieve, precisely because she made that promise to him. The promise creates a powerful, distinct moral reason not to have this attitude.

  **Specification (i):** The attitude is **grief**. Grief qualifies because it is paradigmatically recalcitrant. One cannot simply decide *not* to feel grief upon a significant loss; it arises involuntarily in response to perceived loss, often persisting despite conscious efforts or rational arguments to suppress it. It cannot be produced or extinguished at will like a decision or a simple belief.

  **Specification (ii):** The **right-kind reason** is the significant loss of her beloved partner. This loss undeniably bears on the fittingness of grief: grief is the fitting response to the loss of someone deeply loved. This reason is present and undefeated – David *is* gone, and she *did* love him deeply. The **wrong-kind reason** is the moral obligation arising from her solemn deathbed promise to David not to grieve. This promise creates a reason (a moral duty of fidelity to her word and respect for his last wish) *not* to have the attitude of grief, but this reason does not bear on whether the loss *itself* is unfitting for grief. It bears on whether she *should* *have* the fitting response.

  ### Theorist Verdicts

  1.  **Fitting-Attitude Theorist (FA):**
      *   **Verdict:** The promise provides a reason to *bring it about* that she doesn't grieve (e.g., suppress outward expressions, seek therapy, distract herself) and a reason to *wish* she didn't grieve. However, it provides **no reason whatsoever *for* the attitude of grief itself.** A reason *for* grief must bear on the fittingness of grief to its object – i.e., the nature and significance of the loss. The promise does not make the loss any less real or significant; it doesn't render grief unfitting. The fittingness of grief is determined solely by the loss. Therefore, the only genuine reason *for* grief is the loss itself. The promise provides only a wrong-kind reason, which is ultimately not a reason *for* the attitude at all, only reasons concerning its management or consequences.

  2.  **Inclusive Theorist (IT):**
      *   **Verdict:** The promise provides a **genuine reason** not to grieve. Any consideration counting in favor of having (or not having) an attitude is a reason for it. Sarah's moral duty to keep her promise to David, and the perceived good (honoring him, being strong for her children) that fulfilling this promise would achieve, is a strong consideration counting in favor of her not grieving. This reason exists alongside the reason *for* grieving provided by the loss. The right/wrong kind distinction is illusory; both are simply reasons bearing on whether Sarah should grieve. The promise-reason might outweigh the loss-reason, or they might conflict, but it is undeniably a pro tanto reason against grieving.

  ### Why the "Reason-to-Bring-it-About" Reply Fails

  The standard reply – distinguishing reasons *for* an attitude from reasons to *bring it about* that one has it – collapses here precisely because the attitude is **recalcitrant (grief)** and the pressure is **immediate and occasion-specific (the promise binding at this moment of feeling)**.

  1.  **Recalcitrance:** Sarah cannot simply *decide* not to grieve now, at the graveside. Telling her the promise is only a reason to *cultivate* not grieving over time misses the normative force of the promise *on this occasion*. She promised *not to grieve*. The moral demand inherent in the promise feels like a demand concerning her *present state of mind* at this moment of loss, not just a project for future psychological management. The inclusive theorist captures this immediacy by granting the promise normative bearing *on the attitude itself* right now.
  2.  **Indirect Cultivation is Irrelevant to the Core Distinction:** While Sarah could *later* engage in projects to manage her grief (therapy, focusing on positive memories), this is irrelevant to the question posed by the case: *Is the promise itself a reason for or against the attitude of grief?* The FA theorist must say "no, never; it's only a reason for actions/projects to change the attitude." The inclusive theorist says "yes, it is a direct reason concerning the attitude itself." The availability of long-term cultivation strategies doesn't change the fact that the promise seems to bear *directly and immediately* on the normative status of her grief *as it occurs*, which the FA view denies and the IT view affirms. The promise's normative claim is synchronic (bearing on her state *now*), not just diachronic (bearing on what she should do *later*).

  ### The Single Crucial Feature: Recalcitrance + Immediate Normative Demand

  The feature doing the work is the **combination of a recalcitrant attitude (grief) with an immediate, occasion-specific normative demand grounded in moral standing (the promise binding *now*)**. The promise isn't just advice for future well-being; it creates a felt moral obligation concerning her present state of mind at the very moment grief arises.

  ### What Happens When You Remove It

  *   **Substitute Controllable Attitude:** Change the attitude to **deciding to trust**. David asks Sarah to promise to trust his business partner implicitly going forward. She promises. She then learns valid worries about the partner (right-kind reason *not* to trust), but also has her promise (moral reason *to* trust). Here, the FA theorist *can* plausibly say the promise is only a reason to *act* as if she trusts or to *commit* to trusting, not a reason *for* the attitude of trust itself (which is fitting only based on evidence of trustworthiness). The inclusive theorist still sees two reasons. The cultivation reply works better: trust *can* be cultivated directly via commitment. The pressure feels less like a demand on the immediate attitude and more on future-oriented commitment/action. The WKR problem feels less acute and the FA view escapes more easily.
  *   **Substitute Crude Incentive:** Change the promise to a **cash offer**. A rich relative offers Sarah $1 million if she does not grieve for David at the funeral. Now the wrong-kind reason is merely prudential and crude. The FA theorist easily dismisses it as irrelevant to the attitude of grief itself. The inclusive theorist still counts it as a reason, but this makes the inclusive view look much less appealing intuitively, as it equates a noble promise with a bribe. The moral weight of the original promise was crucial to making the inclusive view plausible.

  ### Strongest Objection to the Worse-Off View (Fitting-Attitude)

  The inclusive theorist's strongest objection against the FA view in this case is:

  **The Normative Authority of Promises:** "The FA view artificially and implausibly severs the deep connection between a solemn promise and the promisor's inner state. When Sarah promised David *not to grieve*, the normative force of that promise *necessarily* concerns her emotional response to his death. To claim that this profound moral commitment gives her *no reason whatsoever* concerning the attitude of grief itself, only reasons to manipulate her future psychology or behaviour, radically underdescribes the binding nature of promises made in such intimate, existential moments. It renders the promise normatively inert with respect to the very state of mind it explicitly targeted, failing to capture why Sarah feels morally conflicted *about grieving itself* at the graveside. The FA view sacrifices the intuitive, holistic normative impact of important moral commitments like promises on our inner lives for the sake of an arbitrary theoretical distinction."

  This objection targets the core FA commitment that reasons for attitudes must be constrained by fittingness, arguing that it fails to account for the full normative reach of significant moral phenomena like deathbed promises.
