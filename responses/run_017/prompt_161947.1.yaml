  Okay, the user is dealing with a stalled reading group in computational neuroscience and philosophy. The core debate is whether the brain is a computer, with three entrenched positions. They want a diagnosis rather than a verdict, and have proposed their own hypothesis about the disagreement being about explanatory methodology. They also present alternatives: verbal dispute, two distinct questions, or a hidden empirical question.

  The user's scenario involves interdisciplinary scholars stuck in a loop despite mutual understanding. Their explicit request is for diagnosis and evaluation of their "blind-compilation test," but underlying needs might include breaking the deadlock, finding productive frameworks, or clarifying foundational concepts for their research. 

  The user's proposed test involves recovering task description from unlabeled system dynamics. They worry it might be too weak (weather systems passing) or just restate trivial positions. Their deeper concern seems to be about distinguishing intrinsic computation from observer-dependent ascription.

  The user's group has three camps: triviality (any system computes something), substantive computation (medium-independent representations), and ascriptive (computation is description). The deadlock persists despite shared empirical knowledge, suggesting non-factual disagreement.

  The user's own hypothesis—that it's about explanatory methodology—is strong. But alternatives need weighing. The verbal dispute angle (mathematical vs. engineering "computation") feels superficial since all camps likely acknowledge both definitions. The "two questions" view (classification vs. explanation) has merit but might not resolve the core tension. The hidden empirical question (recoverability from structure) is intriguing but risks being circular.

  Key considerations: The triviality camp's position makes computation omnipresent, draining it of explanatory power. The substantive camp requires medium-independent representations—which is where the real friction lies. The ascriptive camp avoids ontology but may stall scientific discourse. The user's methodology-focused diagnosis best explains why each camp sees others as "beside the point": they value different explanatory virtues.

  The blind-compilation test is insightful but flawed. It captures the substantive camp's intuition (intrinsic recoverability) but fails for connectionist systems or evolved biological structures where function isn't deducible from structure alone. This reveals the test's bias toward designed systems. Its vulnerability to weather systems (which could be "read" as computing) exposes its dependence on prior assumptions about what counts as a "task."

  For progress: Shift from "is it a computer?" to "when do computational explanations succeed?" and clarify what "medium-independence" requires. The group could analyze concrete models (e.g., predictive coding vs. biophysical models) to expose methodological trade-offs. If trivialists concede computational explanations aren't always useful, or substantivists admit some neural "computations" are observer-dependent, that would be movement.

  The stalemate likely continues without reframing. But the blind-compilation test—despite flaws—could catalyze discussion if presented not as a solution but as a probe into what makes computational descriptions feel "substantive." The real breakthrough would be agreeing that the dispute is meta-scientific, then jointly developing criteria for evaluating explanatory frameworks in neuroscience.
answer: |-
  Here's a diagnosis, argued against the alternatives, followed by an evaluation of your blind-compilation test and prospects for progress:

  ### Diagnosis: It's a **Methodological Dispute About Explanation**
  **Your hypothesis is the strongest.** The core disagreement is about what constitutes a *complete* or *proper* explanation in neuroscience, with "computation" serving as a proxy for a specific explanatory ideal:

  1.  **Triviality Camp:** Believes a *complete* explanation bottoms out in biophysical mechanisms (ions, receptors, anatomy, dynamics). Computational descriptions are useful tools or high-level summaries, but they don't add fundamental *explanatory power* beyond the physical implementation. Reducing everything to "it computes *something*" reflects this view that computation is epiphenomenal to the real causal story.
  2.  **Substantive Camp:** Believes a *complete* explanation *requires* the computational level. They hold that the brain's causal structure is fundamentally organized around information-processing functions defined over representations. The physical details *implement* this abstract structure, but the structure itself has causal/explanatory priority. Without this level, you miss *why* the mechanism is structured as it is. Medium-independence isn't just a modeling convenience; it reflects ontological commitment to a distinct level of causal organization.
  3.  **Ascriptive Camp:** Focuses on the *act of explanation itself*. They are skeptical that "computation" is an inherent property *or* that biophysics alone provides a complete explanation without intentional/cognitive context. A complete explanation requires understanding the system *as* performing a function *for* an organism in an environment. "Computation" is a lens we apply when it's pragmatically useful for prediction, control, or understanding purpose.

  **Why this diagnosis fits best:**

  *   **Commits Each Side:** Each camp commits to a different standard for explanatory sufficiency:
      *   Trivialists: Physical mechanism is sufficient.
      *   Substantivists: Abstract computational structure is necessary (and irreducible).
      *   Ascriptivists: Intentional/functional context is necessary.
  *   **Explains Intransigence:** Each side sees the others' core claims as missing the *point* of explanation. Trivialists see substantivists as adding metaphysical baggage; substantivists see trivialists as missing the forest for the trees; ascriptivists see both as potentially reifying abstractions or ignoring the embedded agent. Your observation about the whole-brain simulation split cutting across camps further supports this: the *relevance* of the simulation depends entirely on what one thinks it *explains* (mechanism vs. abstract function vs. embedded agency).
  *   **Accommodates Shared Empirics:** All agree on the empirical data (spikes, coding, models, neuromorphic chips). The disagreement is about what *interpretive framework* best makes sense of that data and provides the deepest understanding. Is the predictive power of an artificial net *because* it captures the brain's abstract computation, or *despite* the fact it's implemented differently? The answer depends on the explanatory standard.
  *   **"Computer" as Proxy:** The fight over "computation" is indeed a proxy. For substantivists, it signifies the unique explanatory level they champion. For trivialists, it's vacuously true or misleadingly reductive. For ascriptivists, it highlights the role of the observer/describer.

  **Arguing Against the Alternatives:**

  1.  **Verbal Dispute (Formal vs. Engineering):** While definitions matter, the camps likely agree on the *definitions*. The trivialist leverages the formal (any physical system implements *some* computation). The substantivist leverages the engineering sense (specific medium-independent functions). The ascriptivist questions both. The *disagreement* persists even if definitions are clarified because it's about *which definition is explanatorily relevant or fundamental* – a methodological choice.
  2.  **Two Questions (Classification vs. Explanation):** This has merit, but the camps conflate them. The trivialist answers "yes" to classification (formal) and sees explanation as purely mechanistic. The substantivist ties classification tightly to explanation via medium-independence. The ascriptivist sees classification as dependent on explanatory context. The core friction remains the nature of *good explanation*.
  3.  **Hidden Empirical Question (Recoverability from Structure/Task):** This is insightful and *related* to the methodological dispute, but not independent. *Whether* causal structure is recoverable from tissue alone depends heavily on *what kind of causal structure you're looking for* (biophysical dynamics vs. abstract computational states). The substantivist would argue that without knowing the task/representations, you might recover the physical dynamics but miss the *computational* causal structure. The trivialist would say the physical dynamics *are* the causal structure. This question presupposes a stance on what constitutes "causal structure," bringing us back to methodology.

  **What Would Falsify This Diagnosis?** If the group could agree on a single, clear criterion for what constitutes a "complete explanation" in neuroscience *independent* of the computation question, and *then* still disagree fundamentally about whether the brain meets the definition of a computer *under that agreed criterion*, the methodological diagnosis would be weakened. If the dispute persisted *only* about the formal definition of "computation" after explanatory goals were settled, the verbal dispute diagnosis would gain strength.

  ### Progress Under This Diagnosis
  Progress means shifting focus from "*Is* it a computer?" to "*When* and *how* is a computational explanation genuinely explanatory, and what are its limits compared to other explanatory stances?" Specific paths:

  1.  **Analyze Concrete Cases:** Instead of the brain generically, dissect a specific neural phenomenon (e.g., retinal computation, grid cell firing, a decision-making circuit). Ask each camp:
      *   What would a complete explanation look like?
      *   What role (if any) does computation play in *your* ideal explanation?
      *   Does the computational description *add something essential* beyond the biophysics? If so, what?
      *   Is the computational description portable? What makes it portable (or not)?
      *   Does labeling it "computation" change the *kind* of understanding we gain?
  2.  **Clarify "Medium-Independence":** The substantivist camp needs to articulate what *specific properties* make a computational description medium-independent in a way that is not true of, say, a purely dynamical systems description. What constitutes the "rules defined over representations" that are substrate-neutral? How do we identify them empirically without circularity? Is this fundamentally different from higher-level patterns in any complex system?
  3.  **Examine Explanatory Payoff:** Compare explanations. Take a successful computational model (e.g., in predictive coding). Force the groups to articulate:
      *   What does this model *explain* that a detailed biophysical simulation of the same circuit *doesn't*? (Predictive power alone isn't enough; many models can predict).
      *   Conversely, what does a fine-grained biophysical model explain that the computational model misses?
      *   Does the ascriptive view offer a *different* kind of insight (e.g., relating the computation to organismic goals in an environment)?
  4.  **Acknowledge Pluralism:** Progress might involve accepting that different explanatory frameworks answer different questions and have different strengths/weaknesses. The goal becomes understanding the *relationships* and *trade-offs* between mechanistic, computational, and intentional/functional explanations in neuroscience, rather than seeking one "true" answer that eliminates the others.

  ### Evaluating the Blind-Compilation Test
  Your test is clever and targets the heart of the substantivist position (intrinsic recoverability of function). However:

  1.  **It likely fails to dissolve the dispute:**
      *   **Trivialist:** "Passing" just means the engineer found *a* mapping (any mapping!) from structure to symbols that yields a coherent task description. The weather system passing proves the point – *everything* passes under some interpretation. The test doesn't show this is the *only* or *intended* computation.
      *   **Substantivist:** Might argue the test is too strict. Many genuine computers (especially evolved/biological ones or complex connectionist systems) might have their "task" obscured by low-level structure. The engineer might fail to find the *correct* mapping (the one corresponding to the causal role of representations) without hints, even if it's there intrinsically. They might demand the engineer find a mapping demonstrating *systematic* representational content and rules.
      *   **Ascriptivist:** Agrees passing might indicate *something* intrinsic, but insists that labeling the recovered output as a "task" (especially a *cognitive* task) still involves an ascription based on our understanding of tasks. They'd also point out that many systems crucial to cognition (e.g., regulating blood flow in the brain) might fail the test but are still part of the cognitive system described computationally *in context*.
  2.  **It relocates the dispute one level down:** The fight becomes: *What counts as "recovering the task description"?* What constitutes a valid mapping? Is finding *any* coherent output description sufficient (trivialist)? Does it need to reflect systematic representational content and rules (substantivist)? Does the description have to make sense as a *task for an agent* (ascriptivist)? The core disagreement about what constitutes "computing X" reappears as a disagreement about what constitutes a successful outcome of the test.
  3.  **It risks restating triviality:** As your weather system intuition shows, the test as described is highly permissive. Making it stricter (e.g., requiring the mapping to reveal systematic symbol manipulation, error correction, program-like structure) essentially builds the substantivist position *into the test criteria*, making it question-begging.

  **Does it offer *any* progress?** Potentially. It forces the substantivist camp to be more precise about what *kind* of recoverability they mean and what evidence would demonstrate it. It highlights the challenge of defining "task" and "mapping" objectively. It could serve as a boundary case generator: "Here's a system where most agree the blind engineer *could* recover the task (calculator). Here's one where most agree they *couldn't* (weather). Where do *these specific neural systems* fall, and why?" This might nudge the discussion towards concrete features.

  ### Will This End? What Could Help?
  Expect to be largely here in eight months, but perhaps with clearer positions. Ending it is unlikely; it's a foundational philosophical tension within the science. However, some things could *reframe* or *advance* the discussion:

  1.  **Formal Results on Implementation & Indeterminacy:** Deepen engagement with formal results showing the extreme flexibility in mapping physical systems to computations (e.g., Putnam, Searle, Chalmers). Does this undermine the substantivist claim of intrinsic computation? Or can they show how biological constraints limit viable mappings? Conversely, are there formal criteria for "natural computation" that avoid triviality?
  2.  **Distinction: "Syntactic Engine" vs. "Semantic Engine":** Clarify if the dispute is about whether the brain has causal structure isomorphic to formal symbol manipulation (syntax) *regardless of meaning*, or whether it inherently involves representations with semantic content. The blind test might find syntax; attributing semantics is harder and leans towards ascription.
  3.  **Experiment: Evolved vs. Designed Computation:** Compare systems known to be designed for computation (chips) with evolved biological systems performing complex functions. Can we find empirical signatures of "design for medium-independent function" in brains vs. other organs? Does neural plasticity represent "reprogramming" or just dynamical reconfiguration?
  4.  **Change of Question:** Embrace the pluralism. Shift to: "Under what conditions, and for which aspects of neural function, is a computational explanation *indispensable* or *maximally illuminating* compared to other explanatory frameworks (mechanistic, dynamical, ecological), and what specific form should it take?" This moves from ontology to pragmatic epistemology. The "computer" question becomes context-dependent.

  **Conclusion:** Your methodological diagnosis is the most compelling. The dispute is fundamentally about what constitutes a satisfying explanation of how the brain works. The blind-compilation test is a valuable probe but won't resolve the dispute, as it re-encounters the same core disagreements about mapping, task, and intrinsic properties. True progress lies in moving beyond the binary "is it/isn't it" towards a nuanced understanding of the diverse, context-dependent roles computational concepts play in explaining the brain, acknowledging the strengths and limitations of this perspective compared to mechanistic and intentional stances. Expect the discussion to evolve rather than conclude.
