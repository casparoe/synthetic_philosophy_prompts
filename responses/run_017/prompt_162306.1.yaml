answer: |-
  ### Sleeping Beauty Experiment: Session Plan  
  **Materials List:**  
  - Two fair coins (or one coin for flips, plus a random number generator app for larger runs).  
  - Chocolate bars or sweets for stakes (or a points system tracked on a whiteboard).  
  - Timer (for 90-minute session).  
  - Whiteboard or flip chart with markers.  
  - Notebooks/pens for participants (optional).  
  - Three identical, separate rooms (e.g., breakout rooms or partitioned areas) for the variant.  
  - Scoresheets for recording bets (download [template here](https://example.com/scoresheet) or create simple tables).  
  - Envelopes (to conceal coin results until debrief).  

  **Timeline (90 Minutes Total):**  
  1. **Introduction (5 mins):**  
     - Briefly explain the session: “Today, we’ll simulate a probability experiment. You’ll play the role of participants, make bets with real stakes (chocolate/points), and try to maximise your winnings. No prior theory—just play. We’ll debrief afterward.”  
     - Assign roles: One volunteer as “Beauty” for Part 1; three volunteers for Part 2 (label them A, B, C).  

  ---

  ### Part 1: Classic Sleeping Beauty (30 Mins)  
  **Setup (5 mins):**  
  - **Rules:**  
    - A fair coin is flipped Sunday night. **Heads**: Beauty is woken once (Monday only). **Tails**: Beauty is woken twice (Monday and Tuesday).  
    - Each waking, Beauty is in an identical room, with no memory of prior awakenings (simulated by resetting the room and not disclosing the day).  
    - **Betting:** Each waking, Beauty states her confidence in heads as a probability \( P \) and buys a bet ticket costing \( Q \) points. The ticket pays **1 point if heads, 0 if tails**.  
    - **Stakes:** Points convert to chocolate (e.g., 10 points = 1 chocolate bar). Beauty’s goal: maximise net points.  
  - **Demo (1 min):** Flip a coin openly, show a sample bet (e.g., “If you pay 0.4 points for a ticket and coin is heads, you net 0.6 points”).  

  **Gameplay (20 mins):**  
  - Run **10 weeks** (each “week” = one coin flip). For each week:  
    1. Flip coin secretly (put result in envelope).  
    2. **Heads:** Wake Beauty once. She states \( P \) (e.g., 0.5), sets \( Q \) (e.g., 0.5), pays \( Q \) to the “bank” (moderator).  
    3. **Tails:** Wake Beauty twice (sequentially). Each time, she states \( P \) and \( Q \), pays \( Q \) per bet.  
    4. **Amnesia protocol:** Reset room between awakenings; Beauty leaves/re-enters; no discussion of day/time.  
  - Track bets on scoresheet:  
    | Week | Coin | Awakening | P (Confidence) | Q (Price Paid) | Net Points (Settled Later) |  
    |------|------|-----------|----------------|----------------|----------------------------|  
    | 1    | ?    | 1         | 0.5            | 0.5            | ?                          |  
  - **Crucial:** Do not reveal coin results or calculate points until Part 1 ends.  

  **Interim Note (5 mins):**  
  - Pause after 10 weeks. Ask Beauty: “What strategy did you use? Why?”  
  - *Do not discuss theory.* Move to Part 2.  

  ---

  ### Part 2: Three-Person Variant (30 Mins)  
  **Setup (5 mins):**  
  - **Rules:**  
    - Flip a fair coin Sunday night. **Heads**: One person (randomly chosen) is woken in Room 1. **Tails**: Two people (randomly chosen) are woken in Rooms 2 and 3.  
    - Rooms are identical; no one knows who else is awake or which room they’re in.  
    - **Betting:** Each woken person states confidence \( P \) they are in the **tails-only room** (Room 3). They buy a bet ticket costing \( Q \) points, paying **1 point if in Room 3, 0 otherwise**.  
    - **Stakes:** Points pooled for the group; convert to shared chocolate.  
  - **Why this variant?** Removes “same person across time” confusion by using three people in separate rooms.  

  **Gameplay (20 mins):**  
  - Run **10 weeks**. For each week:  
    1. Flip coin secretly.  
    2. **Heads:** Randomly select one person (A, B, or C) to wake. They state \( P \) and \( Q \), pay \( Q \).  
    3. **Tails:** Randomly select two people to wake. Each states \( P \) and \( Q \), pays \( Q \).  
    4. **Isolation:** Woken individuals go to separate rooms; no communication.  
  - Track on scoresheet:  
    | Week | Coin | Woken | P (Room 3 Confidence) | Q (Price Paid) | Net Points |  
    |------|------|-------|------------------------|----------------|------------|  
    | 1    | ?    | A     | 0.3                    | 0.3            | ?          |  
  - **Do not reveal results** until gameplay ends.  

  ---

  ### Debrief (20 Mins)  
  **Settle Bets & Calculate Points (5 mins):**  
  - **Part 1 (Classic):**  
    - Reveal coins. For each week:  
      - **Heads:** Net = \( 1 - Q \) (one bet).  
      - **Tails:** Net = \( -Q_1 - Q_2 \) (two bets).  
    - Calculate Beauty’s total points.  
    - **Example:** 5 heads, 5 tails weeks. If Beauty set \( Q = 0.5 \) throughout:  
      - Heads: \( 5 \times (1 - 0.5) = +2.5 \)  
      - Tails: \( 5 \times (-0.5 - 0.5) = -5.0 \)  
      - **Total: -2.5 points** (loss).  
    - If she set \( Q = 0.33 \): ≈0 points (break-even).  

  - **Part 2 (Variant):**  
    - Reveal coins/rooms. For each week:  
      - **Heads:** Woken person is not in Room 3 → net = \( -Q \).  
      - **Tails:** Person in Room 3 nets \( 1 - Q \); other nets \( -Q \).  
    - **Example:** If all set \( Q = 0.33 \):  
      - Heads (1/2 weeks): net ≈ \( -0.33 \) per week.  
      - Tails (1/2 weeks): Room 3 nets \( +0.67 \); other nets \( -0.33 \) → average net ≈0.  
    - Group total ≈0 points (break-even). If \( Q = 0.5 \), group **loses points**.  

  **Map to Theory (10 mins):**  
  - **Why betting diverges from “fair coin” credence:**  
    - In Part 1, Beauty’s number of bets **depends on the coin outcome** (two if tails, one if heads). Betting at \( Q = 0.5 \) loses money because she “overbets” on tails.  
    - In Part 2, more people bet in tails weeks, so the “fair” bet price (\( Q = 0.33 \) for Room 3, \( Q = 0.67 \) for tails) reflects this dependency.  

  - **Halfer vs. Thirder disagreement:**  
    - **Halfer stance:** “Coin is fair, so \( P(\text{heads}) = 0.5 \). Being woken adds no new info.”  
      - Rebuttal: But if you bet at 0.5, you lose points! (Money pump).  
      - Halfer can adjust betting strategy without changing credence (e.g., bet less when unsure).  
    - **Thirder stance:** \( P(\text{heads}) = 1/3 \) because there are more wakings in tails worlds.  
      - Supported by betting: Only \( Q = 1/3 \) breaks even.  

  - **Monday/Tuesday revelation (key insight):**  
    - Both sides agree: If Beauty learns “it is Monday,” \( P(\text{heads}) \) jumps to 0.5.  
      - *Why?* Tails-Tuesday is eliminated, so heads and tails-Monday are equally likely.  
    - Shows that **self-locating uncertainty** (not knowing the day/room) drives the disagreement.  

  - **Why the variant works:**  
    - Avoids “same person” distraction by using three people.  
    - **Does it assume thirding?** No—it tests if betting behaviour converges to \( Q = 1/3 \) for Room 3 (which mirrors \( P(\text{tails}) = 2/3 \)).  

  **Predictable Pitfalls & Unstageable Elements (5 mins):**  
  - **Pitfalls:**  
    1. Beauty may forget amnesia and use memory (stress: “Treat each waking as a new experience”).  
    2. Participants set arbitrary \( Q \) (encourage: “Set \( Q \) to your true confidence”).  
    3. Slow gameplay (use a timer; aim for 1–2 mins/week).  
  - **Unstageable element:** True amnesia. You must **verbally reinforce**: “You remember the rules, but not awakenings within a week.”  

  ---

  **Closing (5 mins):**  
  - Hand out chocolate based on points.  
  - Final Q&A: “Did your intuition match the results? How does betting inform credence?”  
  - Next session: Discuss halfer/thirder arguments formally.  

  **British English Notes:**  
  - “Flip a coin” → “Toss a coin”  
  - “Points” → “Points” (no change)  
  - “Math” → “Maths”  
  - “Check” → “Tick” (e.g., “Tick results on scoresheet”).  

  This plan ensures hands-on discovery: Players see that betting “as if the coin is fair” loses points, nudging them toward a thirder stance without explicit theory. The variant cleanly isolates the betting anomaly, and the debrief links gameplay to core philosophical issues.
