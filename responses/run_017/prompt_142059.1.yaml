prompt: |-
  hey — i want a spec before I read any more of the knowing-how literature, becuase I keep reading a paper, nodding along, and then realizing I never decided what I was asking the theory to do.

  where I'm coming from: I don't care about Ryle vs. the intellectualists purely for its own sake. I want a theory good enough for two jobs. First, to tell me whether I'm being loose or literally correct when I say a system trained by gradient descent "knows how" to translate a language, or write passable code, or play a decent endgame — and relatedly whether it knows how in the same sense a person does. Second, to say what a teacher is actually trying to produce in a student. If knowing-how is just knowing-that under a practical mode of presentation, then teaching starts to look like telling, and my gut says that's wrong, but I can't say what's lost. So: write me the desiderata for an account of knowing-how that would be fit for those jobs, with the case behind each requirement.

  The cases I want it to earn, not just accommodate: the expert who can't say how she does it (the chicken-sexer sort of case, or someone who recognizes a face she can't describe); the beginner with the complete set of instructions who gets it right slowly and falls apart the moment something deviates; the pianist who temporarily can't move her hands but hasn't forgotten; the person who currently succeeds but only by luck; the aging coach who can no longer perform but can still see what you're doing wrong, next to the athlete who performs beautifully and can't teach a thing — I don't want these collapsed into one phenomenon if they aren't one. Also: knowing-how decays with disuse and comes back faster on relearning than it was acquired, which knowing-that doesn't do, and I want to know whether an account has to explain that profile or is allowed to shrug at it. Also whether the skill is one thing or many: cycling versus cycling on ice, operating versus operating with unfamiliar instruments on unusual anatomy. And whether the account has anything to say about the complements that aren't about producing a success — knowing how not to, knowing how to lose gracefully. And how know-how gets transmitted by demonstration and correction when nothing propositional seems to change hands.

  For each requirement say what it's a requirement on the strength of, and mark which ones are non-negotiable and which are just prejudices of one camp — I especially want you to flag any pair you think can't be jointly satisfied (my hunch is that "don't reduce knowing-how to an ability" and "explain the decay-and-relearning data, which looks like it's about dispositions" are on a collision course, but you tell me). Then tell me which single requirement does the most damage to the most popular views, and close with a short go at how a Ryle-style anti-intellectualism and the intellectualist reply each fare against the list. Weight the thinking on the criteria and their cases, not the scoring.

  Oh and: write it as one continuous blob of prose, like an email — no headings, no bullet points, no bold, no tables, and please don't number the desiderata, carry them with phrases like "the next thing I'd ask" instead, even though I know that's harder.
reasoning: |-
  Okay, the user wants a spec for a theory of knowing-how that serves two main purposes: determining if AI systems truly "know how" to perform tasks like translation or coding similarly to humans, and clarifying what teaching aims to achieve beyond mere telling. They also provided several key cases the theory must handle, such as inarticulate experts, beginners with instructions, and skill decay patterns.

  Hmm, the user seems frustrated with current philosophical literature—they've been reading papers only to realize they lack clear evaluation criteria. Their request is unusually precise, indicating deep engagement with the topic. They're clearly not satisfied with superficial treatments of the Ryle vs. intellectualist debate.

  Let me unpack their core needs. First, they want desiderata grounded in real-world phenomena ("the cases I want it to earn"), not just theoretical coherence. The chicken-sexer and aging coach examples suggest they prioritize explanatory power over elegance. Second, they're hinting at meta-requirements: flagging potential conflicts between desiderata (like non-reductionism vs. explaining skill decay) and identifying which requirement most challenges existing views.

  The "non-negotiable" point is tricky. While they list cases that "must" be addressed, they also admit some might be "prejudices of one camp." I should distinguish between phenomena any theory must explain (like inarticulate expertise) versus more debatable ones (perhaps the "knowing how not to" cases). Their skill decay/relearning point feels particularly urgent—it's where dispositional theories shine but anti-reductionists stumble.

  For the teaching angle, they're implying a dissatisfaction with intellectualist "telling" models. The comment about transmission "when nothing propositional changes hands" suggests they lean toward embodied/anti-intellectualist views but want rigor. Interesting that they mention both physical skills (piano) and cognitive ones (translation)—the theory must cover both.

  The writing constraints are brutal: no headings, no lists, just flowing prose. I'll need to weave the desiderata into a narrative. Starting with the AI evaluation case makes sense—it's their primary motivation. Then move to teaching, then the key cases. The decay/relearning conflict deserves emphasis since they flagged it. When comparing Ryle vs. intellectualism, I'll note where each struggles (e.g., intellectualists on non-propositional teaching, Ryleans on decay profiles).

  Biggest challenge: their demand to identify which desideratum "does the most damage" to popular views. Probably the "inarticulate expertise" case—it gut-punches intellectualism, while disuse decay challenges pure dispositionalism. But I'll justify that carefully.

  Final thought: They're implicitly asking for a theory that avoids over-intellectualizing skill while acknowledging its cognitive dimensions. The aging coach vs. athlete contrast captures this perfectly—performance and pedagogy may dissociate. Whatever I propose must handle that.
answer: |-
  Alright, let's get this spec hammered out before you dive back in. I hear you loud and clear: you need a theory of knowing-how that isn't just philosophically tidy but actually *works* for your specific concerns about AI competence and the nature of teaching, and it has to earn its keep against a roster of stubborn cases without collapsing important distinctions. Forget neat summaries for now; let's lay out what you'd be pounding the table for, why each demand arises from your cases or goals, and where the landmines might be.

  First job, the AI litmus test: You need the theory to give a principled answer about when attributing "knows how" to a system trained via gradient descent (or similar) is literal versus metaphorical loose talk, *and* whether it's the same sense as applied to humans. The gut feeling is that current AI *does* genuinely know how in some cases (like decent translation), but you suspect it might be a different *kind* of knowing-how. So, the first big ask is that the theory **must provide criteria for genuine know-how that distinguish reliable competence from mere output mimicry, and further, criteria for determining when that competence is constitutively similar to human know-how.** The case driving this is the AI itself – you see it performing tasks that *look* skilled and want to know if the label truly fits, or if it's like calling a weathervane an expert in wind direction. Crucially, this needs to handle the "same sense as a person" part, forcing the theory to grapple with the internal structure or grounding of the competence, not just external success. This is non-negotiable for your project; without it, the whole AI comparison is meaningless. It also puts immediate pressure on overly behaviorist or purely success-oriented views that might too easily grant "know-how" to any reliable system.

  Second job, demystifying teaching: You balk at the idea that teaching knowing-how reduces to "telling" propositions, even under a "practical mode." Your gut says something crucial about embodiment, practice, feedback, or non-propositional uptake is lost. So, the next requirement is that the theory **must articulate what constitutes successful *acquisition* of know-how through teaching, specifically highlighting what distinguishes pedagogical transmission from mere information delivery.** The case driving this is the intuitive gap between giving someone a perfect instruction manual for cycling (which leaves them wobbly and prone to failure on the first pebble) versus the coach who corrects posture, timing, and feel through demonstration and guided practice. The theory needs to explain why the manual recipient might *know that* all the steps are, but doesn't *know how* to cycle robustly, and what the coach adds beyond propositional content. This seems non-negotiable for you – if the theory can't explain what's *pedagogically* specific, it fails your purpose. It immediately challenges intellectualist views that reduce know-how to a species of knowing-that.

  Now, the case roster – these are the benchmarks the theory must *earn*, not just wave at:

  1.  **Inarticulate Expertise (Chicken-sexer):** The theory **must account for robust, reliable competence that exists independently of, and potentially outstrips, the agent's ability to articulate propositional knowledge about *how* they perform the task.** The chicken-sexer or face-recognizer who just *sees* the answer but can't explain it demands that know-how isn't constitutively dependent on articulable knowledge-that. This is a direct attack on strong intellectualism and is non-negotiable; a theory collapsing this into tacit propositional knowledge feels inadequate to the phenomenon.
  2.  **Fragile Beginner vs. Robust Expert:** The theory **must distinguish between procedural competence grounded in rote rule-following (easily disrupted) and competence grounded in deeper understanding, adaptability, or embodied skill.** The beginner with the manual who falls apart under deviation versus the expert who adjusts highlights that know-how has degrees and kinds of robustness. This is crucial for both your AI assessment (is its "skill" brittle?) and teaching (what moves a student from fragile to robust?). Accommodating this distinction seems essential, not just a prejudice.
  3.  **Retention Without Current Ability (Pianist):** The theory **must allow that know-how can be retained (not forgotten) even when temporary factors (injury, lack of instrument) prevent its current exercise.** The pianist who can't move her hands but hasn't "forgotten" how to play distinguishes *having* the skill from the *current capacity to manifest* it. This pushes against views that *identify* know-how purely with the *current* ability or disposition to perform. It's a strong case against pure Rylean dispositionalism and feels non-negotiable.
  4.  **Success Without Know-How (Lucky Performer):** The theory **must distinguish genuine know-how from accidentally successful performance.** The person who gets it right only by luck (e.g., guessing the right chess move) highlights that know-how involves a reliable connection to success that isn't accidental. This is fundamental to the concept itself – separating competence from fluke – and non-negotiable for any plausible account. It reinforces the need for criteria beyond mere success.
  5.  **Dissociation of Performance & Pedagogy (Coach vs. Athlete):** The theory **must accommodate the possibility that the capacity to *perform* a skill and the capacity to *teach* or *diagnose* that skill in others can dissociate.** The aging coach who can't play but sees mistakes, versus the brilliant athlete who can't articulate or correct others. This suggests that know-how (performance) and meta-know-how (pedagogical insight) are distinct, though related, capacities. A theory that collapses them fails this case. This seems a core demand, not a bias; it speaks to the complexity of skill.
  6.  **Decay and Relearning Profile:** You explicitly ask if the theory **must explain why know-how decays with disuse and exhibits savings (faster relearning) compared to initial acquisition, a profile distinct from typical forgetting of knowledge-that.** This is a major point. If the theory *must* explain this, it strongly favors views that root know-how in dispositions, embodied patterns, or neural structures that habituate and retain latent traces. It poses a significant challenge to views that reduce know-how entirely to current propositional attitudes. While you ask if it *must* be explained, I suspect for your purposes – especially thinking about AI learning curves and human skill retention – a theory that *can't* engage with this empirical profile will feel lacking. It's likely non-negotiable for a fully satisfying account. You rightly sense tension: demanding that know-how isn't *just* an ability (to avoid the Pianist problem) *and* demanding an explanation of decay/relearning (which screams disposition/habit) *is* a potential collision course. A good theory needs to navigate this – perhaps by distinguishing the *state* of know-how (which persists, explaining Pianist/Coach) from the *manifest disposition* (which decays, explaining the profile), linking them constitutively but not reductively.
  7.  **Generality vs. Specificity (Cycling vs. Icy Cycling):** The theory **must address the scope and granularity of know-how – is "knowing how to cycle" a single, general capacity, or is it fractured into context-specific know-hows (cycling on ice, cycling uphill)?** This impacts AI assessment (is its "translation know-how" tied to its training data/distribution?) and teaching (are we building general or specific capacities?). A theory needs to say if know-how is unified or inherently contextual/modular. This feels important but perhaps more negotiable in *how* it's resolved (e.g., degrees of transfer vs. atomism).
  8.  **Beyond Production (Knowing How Not To, Losing Gracefully):** The theory **should ideally have something to say about "knowing how not to X" or "knowing how to lose gracefully" – competences oriented towards *avoidance* or *coping* rather than successful production.** While perhaps less central than production-oriented know-how, these cases test the boundaries of the concept and its connection to norms, self-regulation, and non-success conditions. It might reveal if the theory is overly focused on goal-achievement. This might be a "nice-to-have" or a test of comprehensiveness rather than a core requirement, but ignoring it entirely feels like a gap.

  Regarding conflicts: The biggest tension you identified is spot-on. **Requiring that know-how isn't *reducible* to a simple disposition or ability (to handle the Pianist and Coach cases) *while also* requiring an explanation for the disposition-like decay-and-relearning profile** is the major fault line. Pure Ryleanism struggles with the first part; pure intellectualism struggles with the second. A viable theory likely needs a hybrid element – perhaps know-how as a *structured* disposition, or a non-propositional *state* that grounds dispositions.

  The single requirement doing the most damage? **Inarticulate Expertise.** It's the kryptonite for strong intellectualism (Stanley & Williamson, et al.). If know-how just *is* knowing a truth under a practical mode of presentation, how can someone know-how without being able to access or articulate *any* relevant proposition, even to themselves? Intellectualists scramble for "tacit" knowledge or indexical modes, often feeling strained against the sheer opacity in cases like chicken-sexing. It forces uncomfortable contortions or significant concessions.

  Now, a quick pass on the camps:
  *   **Rylean Anti-Intellectualism:** Excels at Inarticulate Expertise, Fragile Beginner (emphasizing practice over rules), and the Decay profile (dispositions change). Struggles mightily with Pianist (retention without ability) and Coach (dissociation of performance/pedagogy) because it tends to tightly link know-how to *current* intelligent capacities/dispositions. Teaching becomes modeling and coaching dispositions, which aligns well with your gut against "telling," but may struggle to explain the *cognitive* aspects of pedagogical insight (Coach case). The AI assessment might be too permissive (if it reliably performs, it knows-how?) or require adding "intelligence" criteria that are vague. The Decay profile fits, but the Pianist/Coach tension is acute.
  *   **Intellectualism:** Excels at distinguishing Success from Know-How (it's about possessing the guiding knowledge), potentially handles Pianist (knowledge retained even if body fails) and Coach (pedagogical knowledge is distinct meta-knowledge). Falls apart on Inarticulate Expertise – the core objection. Teaching reduces to conveying propositions (under the right mode), which clashes violently with your intuition and the Beginner case. The Decay profile is a huge problem – why would *knowledge* decay and relearn like a habit? AI assessment might be too strict (does it *really* possess the propositional knowledge?) or require implausible attributions. The Fragile Beginner case highlights the gap between possessing the propositions and having the robust skill.

  The terrain is rugged. You need a theory that avoids reducing know-how to either mere propositions or mere dispositions, that accounts for retention without manifestation and manifestation grounded in more than luck, that explains decay like a habit but persistence like knowledge, that handles inarticulate mastery and pedagogical dissociation, all while providing tools to dissect AI competence and the essence of teaching. No pressure. This spec shows why the debate endures – each camp captures vital aspects but stumbles on others your project forces into the light. The path forward likely involves something messier than pure Ryle or pure Stanley. Good luck with the literature dive – now you know exactly what holes to probe.
