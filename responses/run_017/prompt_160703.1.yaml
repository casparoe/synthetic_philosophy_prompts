    1. Start with a concrete example of a decision problem that seems rational but leads to a contradiction (the Allais paradox).
    2. Show that the common pattern of choices violates a principle (independence) that is necessary for consistent decision-making.
    3. Use the sequential version to highlight the dynamic inconsistency.
    4. Emphasize that the axiom is a coherence constraint for having consistent preferences across different decision contexts.

