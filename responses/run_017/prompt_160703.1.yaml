  2. **Sealed Envelope**: It is the same phenomenon (risk) and not ambiguity. So we can include it to show that the violation occurs in both, but we avoid introducing ambiguity.

  ### Final Plan
  We'll go with the recommended arc and the example from Kahneman-Tversky (with $3000 and $4000). The sealed envelope version can be presented as an alternative framing to show robustness, but we won't spend more than 5 minutes on it.

