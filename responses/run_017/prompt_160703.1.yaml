answer: |-
  ### Teaching Plan for Allais Paradox & Independence Axiom (75-Minute Session)  
  **Audience:** Numerate skeptics (quants, actuaries, ML engineers). Comfortable with probability/EV, aware of loss aversion, unfamiliar with vNM.  
  **Goal:** Make independence axiom compelling as a *coherence constraint*—not a tautology, risk-neutrality claim, or behavioral prediction.  
  **Core Challenge:** Preempt "people are irrational, next slide" by framing violations as *self-sabotage* (dynamic inconsistency).  

  ---

  ### **Brainstormed Arcs & Final Choice**  
  1. **Arc 1: "Inconsistency as Self-Sabotage"**  
     - Start with Allais choices → reveal violation → reframe as sequential decision → show how violators *pay to hurt themselves* (money pump).  
     - **Pros:** High engagement, leverages intuition for dynamic decisions. **Cons:** Requires careful setup to avoid seeming gimmicky.  

  2. **Arc 2: "Axiom as a Bridge Between Simple and Complex Choices"**  
     - Build from preference ordering → independence as a consistency tool → Allais as test case.  
     - **Pros:** Methodical. **Cons:** May feel abstract; skeptics may disengage.  

  3. **Arc 3: "The Allais Experiment as a Trap"**  
     - Audience votes on Allais problems → confront disagreement → dissect why intuition clashes with coherence.  
     - **Pros:** Interactive. **Cons:** Risks reinforcing "irrationality is natural" without normative punch.  

  **Chosen Arc: Arc 1 (Inconsistency as Self-Sabotage).**  
  - **Why:** Forces skeptics to see the violation as a *strategic error* (not just "psychology"). Leverages their quantitative intuition for dynamic processes.  
  - **Flow:** Allais choices (15 min) → independence axiom (10 min) → sequential breakdown (25 min) → misconceptions & Q/A (25 min).  

  ---

  ### **Dependencies: What Must Be in Place Before Introducing Axiom**  
  1. **Lotteries as formal objects** (3 min):  
     - Define a lottery as a set of outcomes with probabilities (e.g., *L₁ = 90% chance of $100, 10% of $0*).  
     - **Why:** Removes ambiguity about what’s being chosen.  

  2. **Transitive preferences** (2 min):  
     - Quick example: "If you prefer Vanilla > Chocolate and Chocolate > Strawberry, then you *should* prefer Vanilla > Strawberry."  
     - **Why:** Establishes that rationality assumes logical consistency—prepares for independence as a similar constraint.  

  3. **Common consequence illusion** (5 min):  
     - Show a simple pair: *Option X: $500 for sure* vs. *Option Y: 50% chance of $500, 50% chance of $500*.  
       - Ask: "Are these different?" (Spoiler: They’re identical—consequence of $500 is common.)  
     - **Why:** Teaches that identical sub-components should "cancel out," preventing students from dismissing Allais as "problems differ."  

  **Then state independence axiom:**  
  > "If you prefer Lottery A over Lottery B, then mixing both with a common Lottery C shouldn’t change your preference. Formally:  
  > *A ≻ B* ⇒ *pA + (1-p)C ≻ pB + (1-p)C* for any *p* > 0."  

  **Crucial framing:**  
  - "This isn’t about maximizing expected *money*—it’s about not reversing preferences based on irrelevant additions."  
  - **Analogy:** "If you prefer coffee over tea, adding the same splash of milk shouldn’t flip your preference."  

  ---

  ### **The Example: Design & Requirements**  
  **Proposed Pair (Modified Kahneman-Tversky, 1979):**  
  | **Problem 1**          | **Problem 2**          |  
  |-------------------------|------------------------|  
  | **A:** $3,000 for sure  | **C:** 25% of $3,000, 75% of $0 |  
  | **B:** 80% of $4,000, 20% of $0 | **D:** 20% of $4,000, 80% of $0 |  

  **Why this works:**  
  - ✅ **Common consequence:** The "75% of $0" is identical in **C** and **D**—so the choice reduces to *A* vs. *B*.  
  - ✅ **Stakes identical:** Outcomes are monetary and identical in all options (no "house deposit" framing).  
  - ✅ **Risk-aversion-proof:**  
    - If risk aversion explained choices, someone preferring **A** (safe) in Problem 1 should prefer **C** (higher win probability) in Problem 2. But most choose **D**—so it’s a *true violation*.  
  - ✅ **Rich outcomes:** Describe as "hypothetical bonus," with amounts in USD. Avoids context-dependent utility.  

  **Audience task:**  
  1. Vote anonymously (e.g., Slack poll) on each problem.  
  2. Calculate EVs:  
     - *EV(A) = $3,000*; *EV(B) = $3,200*; *EV(C) = $750*; *EV(D) = $800*.  
  3. Point out: "If you chose **A** > **B** but **D** > **C**, you’re typical—and incoherent."  

  ---

  ### **Misconception Map & Defusal Plan**  
  | **Misconception**                          | **When Defused**              | **Response**                                                                 |  
  |--------------------------------------------|--------------------------------|------------------------------------------------------------------------------|  
  | **(a) "Axiom = risk-neutrality"**          | After stating axiom          | "Risk aversion is fine! Preferring $3,000 over 80% of $4,000 is *not* a violation. It’s the *switch* to **D** that breaks independence." |  
  | **(b) "Just tiny probabilities/certainty"** | After Problem 2 results      | "In Problem 2, both **C** and **D** have small probabilities—yet you switched. Why overweight certainty only when it’s guaranteed?" |  
  | **(c) "Problems differ—no inconsistency"** | During sequential breakdown  | "The 75% of $0 is identical in **C** and **D**. If it’s irrelevant, why let it change your choice?" → Use money pump. |  
  | **(d) "If people violate it, axiom is false"** | During misconceptions segment | "This is normative, not descriptive. Math doesn’t care if 99% violate it—it’s about avoiding sure losses via money pumps." |  
  | **(e) "Axiom predicts behavior"**          | When stating axiom           | "It’s a *coherence rule* for consistent preferences, not a model of human behavior. Prospect theory describes; vNM prescribes." |  
  | **(f) Missing: "Utilities are linear"**    | If someone invokes curvature | "Independence holds even with nonlinear utility! If *u($x) = √x*, you can still obey it. Violations imply *inconsistency*, not risk aversion." |  

  ---

  ### **Your Two Sticking Points: Solutions**  
  1. **Sequential Version & Dynamic Consistency:**  
     - **Structure:**  
       - *Stage 1:* 25% chance you enter a choice node; 75% chance you get $0.  
       - *Stage 2:* If you enter the choice node, pick between **A** ($3,000) or **B** (80% of $4,000).  
     - **Violation = Reversal:**  
       - At Stage 1, if you prefer **A** > **B**, you precommit to **A** → overall lottery = **C**.  
       - But at Stage 2, if you pick **B**, you get **D**.  
     - **Should you mention assumptions?**  
       - *Say this:* "This assumes **consequentialism**—you care only about future outcomes, not past paths. If you violate independence, you *must* reverse choices mid-process. That opens you to exploitation."  
       - **Do not shut up:** Name the assumption to preempt "gotchas" from quants.  

  2. **Sealed Envelope Wrinkle:**  
     - **Reframe uncertainty:** "A card has already been drawn from a deck (25% black, 75% red). You choose before opening the envelope."  
       - Problem 1: If black, get **A** or **B**?  
       - Problem 2: Choose **C** or **D**?  
     - **Effect:** Violations *increase* (people treat known probabilities as "fate").  
     - **Same phenomenon?** Yes—it’s still *risk* (known probabilities), not ambiguity (unknown probabilities).  
     - **Include?** Yes—spend 3 minutes. It heightens the paradox without new concepts.  

  ---

  ### **Check for Understanding**  
  **Question:** *"You’re booking a vacation. Option X: Rome for sure. Option Y: 50% chance of Paris, 50% of nothing. You prefer X > Y. Now, Option P: 10% chance of Rome, 90% of rainy London. Option Q: 10% chance of Y (so 5% Paris, 5% nothing), 90% of rainy London. Does independence require P ≻ Q? Why?"*  

  **Correct Answer:**  
  - Yes. The 90% rainy London is common. If X ≻ Y, then mixing both with "90% rainy London" should preserve preference. P = 10% X + 90% London; Q = 10% Y + 90% London.  

  **Why it works:**  
  - Tests grasp of "common consequence" in non-monetary terms.  
  - Exposes if they confuse independence with risk neutrality (Paris > Rome could hold, but axiom still applies).  

  ---

  ### **What to Refuse to Explain (Time Management)**  
  **Politely defer:**  
  - "We won’t cover the vNM representation theorem proof—it’s a 30-min topic alone."  
  - "Prospect theory’s probability weighting function is fascinating, but it’s a *descriptive* model—today is about *normative* coherence."  
  - "Money pump existence theorems are beyond scope—we’ll sketch the intuition only."  
  - "Other axioms (continuity, completeness) aren’t needed for today’s paradox."  

  **Time allocation guardrails:**  
  - Allais voting & EV calcs: 15 min max.  
  - Sequential breakdown: 25 min (include sealed envelope).  
  - Q/A and misconception combat: 25 min.  

  ---

  ### **Full Session Outline**  
  1. **Hook (5 min):** "You’re rational. But what if your own choices could be used to scam you?"  
  2. **Allais problems & voting (15 min):** Run Problems 1 and 2. Highlight the switch (A > B but D > C).  
  3. **Independence axiom (10 min):** Build dependencies → state axiom → clarify misconceptions (a), (e).  
  4. **Sequential breakdown (20 min):** Show reversal → money pump sketch → sealed envelope twist. Defuse (c).  
  5. **Misconception combat (15 min):** Address (b), (d), (f) via Socratic dialogue.  
  6. **Check & close (10 min):** Non-monetary question → summarize as "coherence, not psychology."  

  **Backup:** If time runs short, cut sealed envelope (it amplifies but isn’t essential). If skeptics dominate Q/A, pivot to money pump: "If you violate independence, I can charge you to undo your choices—would you pay to be consistent?"
