  **Handout Tips**:  
  - Print as-is (fits one page).  
  - For the session: Start at root (Q0) to sort outliers (Leaf 1/9), then use cases 1/2/3/4/5/6 to guide discussion.  
  - "Pills" are quick debate starters—e.g., "Who takes the Radical Change pill? Defend lump destruction!"  
  - Table shows why some answer-combos are empty (e.g., incoherent clashes).  

  No citations—views are mapped to standard positions. Run with this, and good luck with the reading group!
