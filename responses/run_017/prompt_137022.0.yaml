  | B (No)             | B (Yes)                        | B (New)                        | A (Yes)                              | B (No)           | A (Yes)             | Leaf 6    | Intention-Based Creation |
  | B (No)             | B (Yes)                        | B (New)                        | A (Yes)                              | B (No)           | B (No)              | Leaf 7    | **Constitution View** (Baker) |
  | B (No)             | B (Yes)                        | B (New)                        | B (No)                               | -                | -                   | Leaf 8    | Mereological Essentialism |
  | -                  | -                              | -                              | -                                    | -                | -                   | **Empty** | *Incoherent: If lump survives squash (B), saying statue survives replacement (A) but not reshaping (B) clashes—if shape matters for revival, why not for replacement?* |
  | A (Yes)            | B (Yes)                        | -                              | -                                    | -                | -                   | **Empty** | *Unattractive: Statue always exists (A) but lump destroyed by squash (A)? Contradicts "statue is lump" if lump isn't permanent.* |
  | B (No)             | A (No)                         | A (Same)                       | -                                    | -                | -                   | **Empty** | *Unexplored: No major view says lump dies in squash *and* statue revives identically.* |
  | -                  | -                              | -                              | -                                    | -                | -                   | **Leaf 1** | *One-thing view: Answers all cases as "only lump exists"* |
  | -                  | -                              | -                              | -                                    | -                | -                   | **Leaf 9** | *Many-things view: Answers vary, but accepts extra objects* |
  | B (No)             | B (Yes)                        | B (New)                        | A (Yes)                              | A (Yes)          | A (Yes)             | **Empty** | *Incoherent: Erosion statue (A) requires no artist, but signed lump (A) requires artist—can't have both.* |

  **Named views in cells**:  
  - **Constitution View (Leaf 7)**: Baker-style (statue/lump distinct; statue depends on artistic/historical context).  
  - **Contingent Identity (Leaf 1)**: Gibbard-style (statue=lump in this world, but not necessarily).  
  - **Universalism/Perdurantism (Leaf 9)**: Accepts temporal parts/arbitrary objects.  

  ---

  ### Notes on Your Stuck Points  
  1. **Separating endurantism (constitution) from perdurantism**:  
     - The tree *doesn't* split them clearly. Both give similar answers to Cases 1–6 (e.g., lump survives squash, statue doesn't).  
     - **How to separate**: Add a case like, *"Is there a thing that is David-shaped and exists only for 10 minutes?"*  
       - Perdurantists say **yes** (it's a temporal part).  
       - Endurantists say **no** (only the whole statue/lump exist).  
     - Cut from the tree because: (a) It only works if participants accept >2 things (violates root commitment), and (b) it doesn't split the "exactly two" branch.  

  2. **Separating deflationary ontology from constitution**:  
     - **Deflationism** (e.g., Thomasson) often collapses into **Leaf 6** (intention alone suffices) or **Leaf 9** (many objects).  
     - **Constitution** (**Leaf 7**) requires shape + context, so it splits via Case 5/6 (rejects erosion statue and unsigned lumps).  
     - No extra case needed—it's covered.  

  3. **Cases cut for space (non-discriminatory)**:  
     - **Case 7 (3D printing)**: Doesn't split views—nearly everyone says lump exists at first layer, statue at last.  
     - **Case 8 (Adding clay)**: Doesn't split—all views say the original lump is gone (now part of a larger lump).  
     - **Case 9 (10-minute object)**: Only splits if you reject the root commitment (>2 things), so moved to Leaf 9.  

