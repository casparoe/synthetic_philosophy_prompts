answer: |-
  Here's a decision tree handout for the statue and clay problem, designed as requested. It starts from the commitment that there are (at least) two distinct things (David and the lump) occupying the same space. The tree uses plain-text indentation, avoids jargon, and focuses on your cases to sort views by intuitive answers. Cases 7–9 were cut for space (they don't discriminate well in this setup), and the endurantism/perdurantism separation is handled in the notes.

  ---

  **Statue and Clay: What Kind of "Two-Ness" Is This?**  
  *Assume: David (statue) and the lump are both on the plinth and aren't just two names for one thing.*

  ### The Decision Tree
  Start here → **0. How many things are on the plinth?**  
  ├─ **A. Only one thing** (e.g., "It's just a lump; 'statue' is talk about it")  
  │  └─ 🍋 **Leaf 1: Eliminativism or Identity Theory**  
  │     &nbsp;&nbsp;&nbsp;&nbsp;*Pill: You must say the lump can't survive squashing if the statue can't, even if the matter is unchanged.*  
  ├─ **B. Exactly two things** (statue + lump) → **1. Clay sat untouched 6 years: Was the statue there, just disarranged?**  
  │  ├─ **A. Yes**  
  │  │  └─ 🍋 **Leaf 2: Timeless Statue**  
  │  │     &nbsp;&nbsp;&nbsp;&nbsp;*Pill: You must say the statue existed as a shapeless lump for years before sculpting.*  
  │  └─ **B. No** → **2. Sculptor squashes clay: After, does the lump still exist?**  
  │     ├─ **A. No** (both destroyed)  
  │     │  └─ 🍋 **Leaf 3: Radical Change Destroyer**  
  │     │     &nbsp;&nbsp;&nbsp;&nbsp;*Pill: You must say squashing destroys the lump, even though the same matter exists as a ball.*  
  │     └─ **B. Yes** (only statue destroyed) → **3. Clay reshaped identically: Same statue or new?**  
  │        ├─ **A. Same statue**  
  │        │  └─ 🍋 **Leaf 4: Intermittent Existence**  
  │        │     &nbsp;&nbsp;&nbsp;&nbsp;*Pill: You must say the statue "paused" existing and revived, despite total destruction.*  
  │        └─ **B. New statue** → **4. Gradual replacement: After, is original statue still there?**  
  │           ├─ **A. Yes** (lump gone) → **5. Erosion-shaped lump: Statue?**  
  │           │  ├─ **A. Yes**  
  │           │  │  └─ 🍋 **Leaf 5: Formalism**  
  │           │  │     &nbsp;&nbsp;&nbsp;&nbsp;*Pill: You must say any lump with David's shape is a statue, even if formed by waves.*  
  │           │  └─ **B. No** → **6. Signed untouched lump: Statue?**  
  │           │     ├─ **A. Yes**  
  │           │     │  └─ 🍋 **Leaf 6: Intention-Based Creation**  
  │           │     │     &nbsp;&nbsp;&nbsp;&nbsp;*Pill: You must say an untouched lump is a statue if labeled "art," even with no shaping.*  
  │           │     └─ **B. No**  
  │           │        └─ 🍋 **Leaf 7: Constitution View (Baker-style)**  
  │           │           &nbsp;&nbsp;&nbsp;&nbsp;*Pill: You must say the statue depends on context/shape and can outlive its original lump.*  
  │           └─ **B. No** (both gone)  
  │              └─ 🍋 **Leaf 8: Mereological Essentialism**  
  │                 &nbsp;&nbsp;&nbsp;&nbsp;*Pill: You must say replacing any part destroys an object, even atom-by-atom.*  
  └─ **C. More than two** (e.g., "Many things: statue, lump, 10-minute object...")  
     └─ 🍋 **Leaf 9: Universalism/Perdurantism**  
        &nbsp;&nbsp;&nbsp;&nbsp;*Pill: You must accept countless objects in the same spot, like "David-at-2pm" or "lump-minus-a-speck".*

  ---

  ### Answer-Combination Table  
  *Cells show which leaf/view fits each combo. Empty cells flagged with diagnoses. Only key views named.*  

  | Case 1 (Untouched) | Case 2 (Squash: lump survive?) | Case 3 (Reshape: same statue?) | Case 4 (Replacement: statue survive?) | Case 5 (Erosion) | Case 6 (Signed lump) | View/Leaf | Notes |
