          H                    | 1
          TH                   | 2
          TTH                 | 4
          TTTH               | 8
          ... (up to 10 tails) | ...
          10 tails then H     | 1000 (cap)

     Note: After 10 tails, the payoff is fixed at 1000 because the cap is reached (since 2^10 = 1024, but we cap at 1000). For 0 to 9 tails, the payoff is 2^k (where k is the number of tails) until k=10, then 1000. For k>=10, it's 1000.

