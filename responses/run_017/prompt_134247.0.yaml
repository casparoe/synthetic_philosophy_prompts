answer: |-
  ### Materials and Setup
  - **Materials:** One coin (or phone app for flipping), whiteboard, index cards (one per student), play money (1000 points per student, pre-distributed as index cards labeled with amounts), three chocolate bars as prizes.
  - **Setup:**
    - Write the payoff table on the board before class:
      ```
      Toss sequence   | Payoff (points)
      ----------------|-----------------
      H               | 1
      TH              | 2
      TTH             | 4
      TTTH            | 8
      ...             | ...
      10 T's then H   | 1000 (cap)
      ```
      (Note: After 10+ tails, payoff is always 1000. Stop flipping once cap is reached.)
    - Split the class into **two groups of 10** (to ensure trading continues if one game ends early). Each group runs its own independent game with separate coin flips.

  ### Rules
  1. **Initial Auction (Sealed Bid):** 
     - Each student writes a bid (points they’d pay) for one contract in their group. 
     - Highest bidder wins the contract, pays their bid from their stake, and becomes the initial holder. Record winning bid on the board.
  2. **Coin Flips:** 
     - Flip coin once per group per round (Group A then Group B). Reveal result to all.
     - Game ends for a group when heads appears OR 10+ tails are flipped (payoff = 1000).
  3. **Trading Between Flips (After each flip except the last):** 
     - **Holder** writes an *ask* (minimum price to sell).
     - **All others** write a *bid* (maximum price to buy). 
     - **Market Price:** Midpoint between highest bid and holder’s ask. If highest bid ≥ ask, trade happens at market price. Holder sells to highest bidder, who becomes new holder. If no trade, holder keeps contract.
  4. **Final Payout:** 
     - When a group’s game ends, the current holder receives the payoff points.
     - **Prizes:** At seminar end, the three students with the highest **total points** (play money + payoffs) win chocolate bars.

  ### Timeline (75 Minutes)
  - **0–10 min:** Explain rules, payoff table, and trading. Emphasize: "Your goal is to maximize your point total."
  - **10–15 min:** Pairs calculate a "break-even price" for the contract before any flips (no "expected value" term allowed). Share estimates on board.
  - **15–20 min:** Initial sealed-bid auction in each group. Record winners/prices.
  - **20–55 min:** **Flip and trade cycles:**
    - Flip coin for Group A → trading round (collect bids/asks, set market price, execute trade) → record price on board.
    - Repeat for Group B.
    - Continue until both groups finish (≈6–8 rounds total; most games end in 2–4 flips).
  - **55–60 min:** Award payoffs to final holders. Tally points.
  - **60–75 min:** Debrief (see below).

  ### What to Write on the Board
  - **Start:** Payoff table.
  - **During pairs activity:** Student estimates of "fair price."
  - **During game:** Group A and B’s market price after each trading round (e.g., "A: Tails → Price: 11").
  - **End:** Final payoffs and total points leaderboard.

  ### Debrief: Connecting Moments to Key Ideas
  1. **"Fair price can lose in one outcome":** 
     - *Moment to reference:* A holder who bought at ≈6 and sold at a loss after heads paid 1. 
     - *Ask:* "Who priced it right initially but lost points? Why?" 
     - *Connect:* "The 6-point price included the tiny chance of 512 or 1000 points. When that didn’t happen, it lost—but the math was still right. A fair price isn’t about one outcome; it’s about all possibilities."
     
  2. **"Price changes with new information, not coin fairness":** 
     - *Moment to reference:* Price jumped after a tail (e.g., from 6 → 11). 
     - *Ask:* "Why did the price rise after tails? Did the coin get 'hotter'?" 
     - *Connect:* "The coin didn’t change—but the contract did! After a tail, you’re closer to big payoffs (e.g., 8, 16, 1000). The fair price doubles roughly because the remaining game is the same as the original but starting from 2 points."

  ### What Will Predictably Go Wrong (and Mitigations)
  1. **Game ends on first flip:** 
     - *Problem:* No trading rounds if first flip is heads (≈25% chance per group). 
     - *Fix:* Two groups ensure at least one game continues. If both end early (unlikely), use a backup pre-flipped sequence (e.g., "T,H") for Group A to demo trading.

  2. **Student shouts expected value:** 
     - *Problem:* Early "infinite value!" comment kills auction tension. 
     - *Response:* "Ah, but we have a cap—so what’s the number? And let’s see if the market agrees." Redirect to capped calculation.

  3. **Show-off bidder (e.g., bids 400):** 
     - *Problem:* Inflates initial price, distorting later markets. 
     - *Turn into lesson:* "Why did the market crash after a head? Was 400 a good price? What does this tell us about overpaying for rare events?"

  4. **Low engagement in trading:** 
     - *Problem:* Some students may not bid. 
     - *Fix:* Encourage: "Even if you don’t hold the contract, you can profit by buying low and selling high."

  ### What the Game Can’t Reproduce (Say This)
  - "In the original paradox, there’s no cap—so the 'fair price' is infinite. Our cap makes it finite, but without it, the math breaks. That’s part of the puzzle: why wouldn’t you pay $1,000 in real life for an infinite expected value?"

  Summary: Students trade a capped St. Petersburg contract in small groups to experience how fair prices depend on all outcomes (not just the one that happens) and update with new information.
