  Based on your Benthamite starting point and the friction points you've identified, here are three candidate principles, each attempting to systematize your intuitions while minimizing contradictions. Each prioritizes different core values: **Harm Prevention**, **Autonomy**, and **Relational Integrity/Exploitation Avoidance**.

  **Candidate Principle 1: Harm & Non-Consensual Exposure**
  > **An action is wrong (and potentially subject to prohibition/blame) if it:**
  >    **(a) Causes direct, non-consensual harm (physical, psychological, tangible economic) to a specific person; OR**
  >    **(b) Forces non-consensual exposure to intimate acts upon an unwilling person who cannot reasonably avoid it.**

  *   **Motivation for Clauses:**
      *   **(a) Harm:** Core Benthamite foundation. Covers assault, coercion, tangible damage (cases 8, potentially 5 & 9 depending on effects).
      *   **(b) Non-Consensual Exposure:** Explains the public/semi-public cases (2, 3). The wrong isn't the *content* of the act per se, but the violation of others' reasonable expectation of privacy/control over what they are forced to witness in shared/public spaces. The "cannot reasonably avoid it" qualifier prevents blaming someone for looking through your window while standing on a ladder peering in, but holds if they are just walking past on a public path.
  *   **Handles Your Cases:**
      *   1: Fine (no harm, no forced exposure).
      *   2: Not Fine (b - forced exposure on beach).
      *   3: Not Fine (b - forced exposure via open blinds to public/semi-public view).
      *   4: Fine (assuming genuine consent & no harm, no forced exposure).
      *   5: *Potentially* Not Fine (likely harm (a) due to power imbalance/exploitation, even if subtle/long-term).
      *   6: **Problem:** Cannot explain why it's not fine. No direct harm (assumed), no forced exposure. *Requires giving up your verdict on 6 or finding harm.*
      *   7: Fine (no real person harmed, no forced exposure).
      *   8: Not Fine (a - direct harm caused in production, victim is specific).
      *   9: **Problem:** Cannot explain why it's not fine. No *direct* harm caused (assumed), no forced exposure. *Requires giving up your verdict on 9 or arguing harm (e.g., violation is harm, or potential future harm).*
  *   **Your Additional Cases:**
      *   Paying for Consensual Sex: Fine (assuming no direct harm, coercion, or forced exposure).
      *   Consent Due to External Pressure (Housing): **Problem:** The *sex itself* doesn't cause direct harm (a), and there's no forced exposure (b). The harm comes from the *housing situation*, which the partner didn't cause. *Principle likely says "Fine" (if partner unaware), conflicting with intuition that it's exploitative.*
  *   **Trade-off:** Prioritizes tangible harm and bodily/privacy autonomy regarding exposure. Struggles with non-harm based relational wrongs (incest, deepfake nudes) and indirect exploitation.

  **Candidate Principle 2: Violation of Autonomy/Consent**
  > **An action is wrong (and potentially subject to prohibition/blame) if it violates the autonomy of a person regarding their body, image, intimate choices, or exposure to intimacy, without their ongoing, specific, and informed consent.**

  *   **Motivation:** Shifts focus from *outcome* (harm) to *process* and *rights* (autonomy, consent). Explains cases where the wrong is in the *use* or *inclusion* without permission, even absent measurable harm.
  *   **Handles Your Cases:**
      *   1: Fine (mutual consent).
      *   2: Not Fine (violates autonomy of public - they didn't consent to witnessing intimacy).
      *   3: Not Fine (violates neighbor's autonomy - they didn't consent to potentially seeing intimacy while using public space/normal paths).
      *   4: Fine (mutual consent assumed).
      *   5: Not Fine (coach's authority inherently compromises genuine autonomy/consent of the 17yo).
      *   6: **Problem:** *Could* argue consent is compromised by the inherent nature of the relationship (social/psychological pressures), but this is weak/contested. *Might require giving up verdict or stretching "autonomy violation".*
      *   7: Fine (fictional, no real person's autonomy violated).
      *   8: Not Fine (egregious violation of victim's autonomy in production; viewing perpetuates disregard for that violation).
      *   9: Not Fine (clear violation of autonomy regarding use of her image for intimate purposes without consent).
  *   **Your Additional Cases:**
      *   Paying for Consensual Sex: Fine (mutual, specific consent given for that act).
      *   Consent Due to External Pressure (Housing): **Problem:** If the *partner* obtains specific consent for the *sex act* itself and is unaware of the pressure, autonomy regarding the *act* isn't directly violated *by them*. The violation stems from the housing situation. *Principle likely says "Fine" (partner not violating autonomy), conflicting with intuition.*
  *   **Trade-off:** Elegantly handles cases 3, 8, and 9. Explains the core wrong in exposure cases (2, 3). Still struggles significantly with case 6 (incest) without adding controversial assumptions. Doesn't inherently capture the *exploitative dynamic* in case 5 or the housing-pressure case as clearly as a harm principle might.

  **Candidate Principle 3: Prevention of Exploitation & Relational Corruption**
  > **An action is wrong (and potentially subject to prohibition/blame) if it:**
  >    **(a) Causes direct, non-consensual harm (physical, psychological, tangible economic) to a specific person; OR**
  >    **(b) Forces non-consensual exposure to intimate acts upon an unwilling person who cannot reasonably avoid it; OR**
  >    **(c) Exploits a position of power, trust, dependency, or fundamental relational role in a way that distorts or bypasses genuine consent, or corrupts the inherent purpose of that relationship.**

  *   **Motivation for Clauses:**
      *   **(a) Harm:** Retains Benthamite core.
      *   **(b) Non-Consensual Exposure:** Retains privacy/public order concern.
      *   **(c) Exploitation/Relational Corruption:** Directly targets the core issue in cases 5 (coach), potentially 6 (sibling relationship), and the housing-pressure case. It argues that some relationships (parent/child, therapist/client, coach/athlete, perhaps siblings) or situations (extreme dependency) have inherent purposes and boundaries. Sex within them exploits the inherent power/trust/dependency or fundamentally corrupts the relationship's purpose, making genuine, uncoerced consent practically impossible or inherently damaging to the relational structure society relies on.
  *   **Handles Your Cases:**
      *   1: Fine (no a, b, c).
      *   2: Not Fine (b).
      *   3: Not Fine (b).
      *   4: Fine (no inherent power imbalance/exploited role).
      *   5: Not Fine (c - exploits coach-athlete power/trust).
      *   6: Not Fine (c - exploits/fundamentally corrupts the sibling relationship, seen as having an inherent non-sexual purpose; bypasses genuine consent due to relational pressure).
      *   7: Fine (no a, b, c - fictional).
      *   8: Not Fine (a - harm in production).
      *   9: Not Fine (c? - exploits her identity/image without consent for intimate purposes. Could also be argued under harm (a - psychological/autonomy harm) or needs a separate clause).
  *   **Your Additional Cases:**
      *   Paying for Consensual Sex: *Ambiguous.* If seen as a neutral commercial transaction with mutual consent, fine. If seen as inherently exploitative due to economic factors/commodification, then potentially not fine (c). *Your starting principle leans towards "fine", so this might require a concession.*
      *   Consent Due to External Pressure (Housing): Not Fine (c - exploits the person's position of desperate dependency/vulnerability created by the housing situation, even if the *partner* didn't create it. Their participation *in that context* is exploitative).
  *   **Trade-off:** Best explains cases 5 and 6, and the housing-pressure case. Incorporates harm (a) and exposure (b). **Major Costs:** 1. **Paternalism/Value-Laden:** It explicitly judges certain relationship types as non-sexual, which some see as imposing social values. 2. **Fuzziness:** Defining "fundamental relational role," "inherent purpose," or "exploits dependency" can be subjective and culturally relative. 3. **Case 9:** Still needs work (often fits better under Autonomy violation). 4. **Sex Work:** Might conflict with your "if no coercion/harm, fine" intuition.

  **Summary & Recommendations:**

  *   **Principle 1 (Harm/Exposure):** Most Benthamite, cleanest, but fails your intuitions on Incest (6) and Deepfakes (9), and struggles with the housing-pressure case.
  *   **Principle 2 (Autonomy):** Handles Exposure (2,3), Deepfakes (9), and CSAM (8) well, but fails Incest (6) and the housing-pressure case *if the partner is unaware*.
  *   **Principle 3 (Exploitation/Corruption):** Best handles Power Imbalances (5), Incest (6), and the housing-pressure case, but is the least "liberal" (potentially paternalistic), fuzzy, might conflict on sex work, and still needs to address Deepfakes (9) clearly.

  **Path Forward:** Your case 6 (incest) is the hardest nut to crack for harm/autonomy-only principles. If you *must* retain that verdict, Principle 3 (or a variant focusing on "Exploitation of Fundamental Relational Roles") is likely necessary, accepting its costs (paternalism, fuzziness). If you can reconsider case 6 (e.g., argue potential subtle harm, or accept it *is* fine if truly no harm), then Principle 1 or 2 becomes more viable.

  **For Case 9 (Deepfakes):** Both Principle 2 (Autonomy violation - using image) and Principle 3 (Exploitation of identity) can cover it more cleanly than Principle 1. Adding an explicit "Non-consensual intimate use of identity/image" clause to Principle 1 or 3 would work.

  **Your starting point needs expansion.** Pure consequentialism (only pain/pleasure) struggles with wrongs based on consent violations, dignity, autonomy, and relational integrity, even when direct, measurable harm is absent. Your intuitions point towards incorporating deontological (duty/rights-based) and virtue/relational ethics elements alongside Bentham's utilitarianism. There might not be one perfectly coherent principle; a pluralistic approach acknowledging different *kinds* of wrongs (harm, consent violation, exploitation) might be the most honest reflection of your considered judgments.
