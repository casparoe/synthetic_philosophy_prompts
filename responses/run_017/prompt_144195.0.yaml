  We are going to design a classroom activity that illustrates the problem of conditionally convergent series in expected utility theory. The core idea is to have students compute the expected value of a gamble by summing the products of probabilities and payoffs in the order that they physically encounter the outcomes (via shuffled cards). We want different groups to get different orders and hence different sums, leading to the realization that the expected value is not well-defined without specifying the order of summation.

  We'll use the "Pasadena game" (without naming it) as our example. The Pasadena game is a gamble where the payoffs grow in a way that the series for the expected value is conditionally convergent but not absolutely convergent. The standard version is:

  - Flip a fair coin until it comes up heads. Let n be the number of flips (including the head).
  - The payoff is (-1)^{n-1} * (2^n) / n dollars.

  But note: the original Pasadena game has an alternating sign and the series sum( (-1)^{n-1} * 2^n / n ) from n=1 to infinity is conditionally convergent (to ln(2)).

  However, to avoid the complication of negative payoffs (which might lead students to think about loss aversion) and to keep the arithmetic manageable, we might consider a variant that is still conditionally convergent but with positive terms? But the conditional convergence requires alternating signs. Alternatively, we can use the Pasadena game as is, but use points instead of dollars and frame it as a game where you can win or lose points.

  Alternatively, we can use a different gamble that is conditionally convergent and has only positive payoffs? Actually, if all payoffs are positive and the series diverges to infinity, then it is absolutely divergent (unless the series converges absolutely). So we cannot avoid alternating signs if we want conditional convergence.

  Therefore, we'll use the Pasadena game but with a twist: we'll make the payoffs in points (which can be positive or negative) and make the probabilities clear.

  But note: the standard Pasadena game has probabilities that are powers of 1/2 and payoffs that grow exponentially. The series is:

    E = sum_{n=1}^{∞} [ (1/2)^n * (-1)^{n-1} * (2^n / n) ] 
      = sum_{n=1}^{∞} [ (-1)^{n-1} / n ]

  This is the alternating harmonic series, which converges to ln(2) ≈ 0.693.

  But if we rearrange the terms, we can get any real number we want.

  However, in the classroom, we cannot do an infinite deck. We must truncate. But if we truncate, then the series is absolutely convergent for any finite truncation? Not exactly: if we take a finite set of terms, the sum is fixed regardless of order. So we must simulate the infinite series by having a deck that is "in practice" infinite? We can't. So we have to use a finite approximation that still exhibits order-dependence in a noticeable way.

  Alternative approach: use a finite but large deck and arrange the terms so that the partial sums vary significantly with order. The problem is that for a finite set, the sum is independent of order. So we need a different idea.

  Key insight: we can have two different physical realizations of the same probability distribution that lead to different orders of summation. For example:

  Setup 1 (Coin Flips): We flip a coin until we get heads. We record the outcome (n) and then look up the payoff for that n.

  Setup 2 (Urn): We have an urn with tickets labeled by n (from 1 to, say, 1000) and with probabilities proportional to (1/2)^n. But we can arrange the order in which we draw the tickets? Actually, the urn is just a way to sample the outcome n with probability (1/2)^n. The order of drawing doesn't matter because we only draw one ticket.

  But wait: the idea of ordering only comes in when we try to compute the expected value by summing over the outcomes. So we need to have the students compute the expected value by listing the outcomes in a particular order. How can we make the order matter in a finite setting?

  We can have the students compute the expected value by grouping the outcomes in different orders. For example, we can give each group a set of cards, each card having an outcome n and its probability and payoff. The deck is finite (say up to n=20). Then we ask the students to shuffle the deck and then compute the cumulative sum as they go through the deck. They stop when they think they have a good approximation. Because the series is conditionally convergent, the partial sums will oscillate and the point at which they stop will affect the value they get. However, for a fixed truncation, the entire sum is fixed. So this won't work.

  We need the students to experience that the order of summation matters. But in a finite set, it doesn't. Therefore, we must simulate the infinite series by having the students not know the entire set of outcomes? That is, we can have them draw cards one by one from a deck that is very large (but finite) and then stop at some arbitrary point. Then the partial sum they get depends on the order and on when they stop.

  But then the expected value is not defined by the entire distribution but by the partial sum. And we can have groups stop at different points and get different answers.

  Alternatively, we can have the entire deck but then have the students compute the expected value by summing in the order of the shuffled deck. Since the deck is finite, the sum will be the same regardless of order. So that doesn't work.

  We are in a bind. How to simulate the phenomenon?

