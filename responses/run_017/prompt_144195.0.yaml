  Therefore, we must use a different representation: we can have two different ways of grouping the same outcomes. For example, we can present the gamble in two different decompositions:

  Decomposition 1 (by n): 
     n=1: payoff = +2, probability = 1/2
     n=2: payoff = -2, probability = 1/4
     n=3: payoff = +8/3, probability = 1/8
     n=4: payoff = -4, probability = 1/16
     ... 

