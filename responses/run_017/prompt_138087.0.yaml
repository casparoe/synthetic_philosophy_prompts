answer: |-
  **How does the infirm-successor problem — that quantum immortality under measure-indifference implies long-run survival is dominated by states of minimal functioning — challenge the argument's coherence, and does tightening survival criteria to avoid this inadvertently break the continuity required for immortality?**  

  Existing treatments of quantum immortality (QI) focus on whether continuity of survival (guaranteed by Everettian branching) combined with measure-indifference (indifference to Born-rule weights when anticipating personal futures) justifies expecting immortality. Yet they overlook a dilemma arising in realistic dying processes: if measure-indifference holds, we must anticipate inhabiting branches with arbitrarily low measure, which in aging or disease disproportionately feature degenerative states (e.g., persistent vegetative states, advanced dementia). Conversely, requiring high functioning to "count" as survival risks breaking continuity—implying a finite endpoint to subjective existence—which shifts focus to poorly explored questions of "last survival" times. Neither horn is addressed in standard disputes over self-sampling or self-indication, leaving QI’s practical implications unresolved.  

  To resolve this, I will develop a minimal computational model simulating branching agents under two hazard regimes: (1) constant hazard (quantum suicide) and (2) increasing hazard (aging-like decay). At discrete time steps, branching generates successors tagged with a functioning score (e.g., 1.0 = full health, 0.0 = death). Survival thresholds define which scores qualify as "alive." The model compares two first-person expectation rules:  
  - **Measure-tracking**: Subjective probability of being in a state is proportional to its Born measure.  
  - **Measure-indifference**: All surviving branches are equally likely from a first-person view.  
  Simulations will track the distribution of functioning scores among "surviving" branches over time, testing sensitivity to:  
  - Hazard regimes (constant vs. increasing risk).  
  - Survival thresholds (permissive to strict).  
  - Expectation rules.  

  This approach is chosen over alternatives because a dialectical survey cannot resolve the model-dependent infirm-successor trade-off; testing interpretations is beyond scope (bracketing Born-rule derivation); and narrowing to QI avoids entanglement with general self-locating puzzles. The model’s simplicity allows rigorous exploration of the dilemma within six months.  

  Possible conclusions:  
  1. Under measure-indifference, even modest aging-like hazards cause functioning scores of "immortal" agents to collapse toward minima (e.g., near-death states), regardless of threshold choice—undermining QI as a practical hope.  
  2. Tightening thresholds avoids degeneration but causes frequent continuity failure (finite survival), shifting debate to whether subjective immortality requires infinite continuity.  
  3. Hazard regimes dominate outcomes: constant hazards show minimal degeneration, but aging hazards exacerbate it.  
  The choice between conclusions hinges on simulation results: divergence between expectation rules under aging hazards would support (1); threshold-driven continuity failure would support (2); and strong sensitivity to hazard parameters would support (3).  

  Deliverable: A publicly shared simulation toolkit and paper clarifying whether QI, if true, implies unavoidable degeneration or fragile continuity—helping decision-makers (e.g., in ethics or AI safety) assess if first-person arguments justify risk-taking.  

  **Failure conditions**:  
  - The infirm-successor effect reduces to known anthropic disputes (e.g., if expectation-rule differences mirror self-sampling vs. self-indication).  
  - Results are overly sensitive to hazard-function details, yielding no robust insights.  
  - The model cannot avoid dependence on Born-rule bracketing (e.g., if expectation rules require implicit measure-weighting).  

  **Cuts for scope**: General ethics of branching (e.g., "who else is hurt"), continuum models, and non-Everettian interpretations. Focus remains on discrete-time simulations with <500 lines of code (Python), prioritizing hazard/threshold variations.  

