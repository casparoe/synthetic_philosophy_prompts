answer: |-
  Your struggle reflects the core tension in transitional justice: balancing truth recovery against accountability. Your three-condition framework is perceptive but requires refinement to achieve consistency. Below is a synthesised principle, its application to your cases, and resolutions for conflicts. The revised principle prioritises the commission’s *truth-recovery mandate* while ensuring amnesty serves restorative, not absolutionist, purposes.

  ### Revised Amnesty Principle
  Amnesty may be granted **if and only if**:
  1. **Counterfactual Truth Value (CTV)**: The disclosure provides *substantive, verifiable information* unlikely to be obtained otherwise through investigations, archives, or other confessions, thereby materially advancing the commission’s truth-seeking mandate.  
     *(Motivated by Cases 5, 6, 7: distinguishes between redundant and indispensable disclosures.)*  
  2. **Operational Agency**: The applicant’s role was *executional* within a coercive hierarchy—they implemented, but did not *design, propagate, or sustain* the structures of atrocity.  
     *(Motivated by Cases 2 & 4: separates architects/beneficiaries from implementers.)*  
  3. **Narrative Non-Closure (NNC)**: Granting amnesty *does not preclude* further investigation or victim testimony about contested events, and the disclosure *does not foreclose* alternative accounts.  
     *(Motivated by Cases 8 & 9: prevents amnesty from silencing victims or distorting history.)*  
  4. **Veracity**: The disclosure is *corroborated as truthful* by evidence or plausibility.  
     *(Motivated by Case 9: implicit in your framework but needs explicit inclusion.)*  

  ---

  ### Verdicts Under Revised Principle  
  | Case | CTV                          | Operational Agency         | NNC                                | Veracity       | Verdict             |  
  |------|------------------------------|----------------------------|------------------------------------|----------------|---------------------|  
  | 1    | **Yes** (unique burial sites) | **Yes** (conscript)        | **Yes** (no contested narrative)   | **Assumed**    | Amnesty ✅          |  
  | 2    | **Yes** (best source)         | **No** (set doctrine)      | N/A                                | N/A            | No amnesty ❌       |  
  | 3    | **Marginal** (recoverable)    | **Yes** (clerk)            | **Yes**                             | **Assumed**    | Amnesty ✅ (shaky)  |  
  | 4    | **Yes** (unique financing)    | **No** (sustained system)  | N/A                                | N/A            | No amnesty ❌       |  
  | 5    | **No** (already named)        | N/A                        | N/A                                | N/A            | No amnesty ❌       |  
  | 6    | **No** (known facts)          | N/A                        | N/A                                | N/A            | No amnesty ❌       |  
  | 7    | **Yes** (corrects archive)    | **Assumed Yes**            | **Yes** (exonerates innocent)      | **Yes**        | Amnesty ✅          |  
  | 8    | **Yes** (collective truth)    | **Mixed** (group agency)   | **No** (mass confession forecloses individual accountability) | **Assumed** | Sentence reduction ✅ *but not amnesty* |  
  | 9    | N/A                           | N/A                        | N/A                                | **No** (false) | No amnesty ❌       |  

  **Conflicts Resolved**:  
  - **Case 4 (Banker)**: Denied amnesty. Though CTV is met, *Operational Agency* fails—arranging finance "sustained the system" beyond mere execution. This aligns with Case 2 (general).  
  - **Case 8 (Village)**: Partial leniency (sentence reduction) is consistent because NNC is violated: blanket amnesty prevents individualised accountability.  
  - **Case 6 vs. 7**: Separated by CTV. Case 6 adds no new truth; Case 7 corrects the historical record.  

  ---

  ### Application to New Cases  
  **Case A: Abducted at 14, victim then perpetrator**  
  - **CTV**: Likely **yes** if they reveal command structures exploiting children.  
  - **Operational Agency**: **Yes**—coercion and age negate meaningful autonomy.  
  - **NNC**: **Yes**—disclosure unlikely to silence victims.  
  - **Veracity**: **Requires corroboration**.  
  → **Amnesty warranted**, akin to a conscript (Case 1).  

  **Case B: Disclosed under voided self-amnesty**  
  - **CTV**: **No**—disclosure already occurred, even if legally invalidated.  
  - **Operational Agency**: **Irrelevant** (CTV fails).  
  - **NNC**: **Likely violated**—prior disclosure may predetermine "official" narrative.  
  - **Veracity**: **Unclear**—may be tainted by prior impunity deal.  
  → **No amnesty**. The commission cannot "re-buy" truth already sold.  

  ---

  ### Why This Works  
  1. **CTV** resolves Cases 3, 5, 6, 7 and new Case B by centring *marginal truth gain*.  
  2. **Operational Agency** resolves Cases 2/4 by excluding those who *enabled* atrocities systemically, even indirectly.  
  3. **NNC** resolves Case 8 by blocking amnesty that precludes deeper accountability.  
  4. **Veracity** resolves Case 9 explicitly.  

  **Dropped Verdict**: Your initial "unowned-agency" was too narrow; "operational agency" better captures hierarchical coercion without absolving mid-level actors. Case 3 (clerk) is the weakest but holds—even marginally useful truth from low-level actors aids reconciliation.  

  This framework ensures amnesty is a *transaction*: the commission trades impunity *only* for otherwise unattainable truth that serves restorative justice. It avoids rewarding those who shaped terror or whose confessions distort the record.
