  ### Mark: **14/25** (Lower Second / 2:2)  
  *This answer demonstrates competent grasp of core concepts but contains significant substantive errors in parts (b) and (c), and under-argues key nuances. Fluency masks critical weaknesses.*

  ---

  ### Point-by-Point Feedback for Student  
  *(Quotes from your answer in italics)*  

  #### Part (a)  
  - *"Lexical dominance just means: two tiers, and no trade between them... no finite amount of sub-threshold suffering... adds up to one hour at T."*  
    **Correct.** Clear definition distinguishing lexical priority from finite weighting.  
  - *"Prevent the hour at T... doesn't matter whether the other option is a million headaches or a googol."*  
    **Correct.** Accurately applies (i) to the case.  
  - *"Priority orders the tiers; it doesn't select outcomes on its own."*  
    **Correct and insightful.** Good recognition that lexical priority resolves inter-tier conflicts but not intra-tier ones.  
  **Verdict: Strong, first-class analysis.**  

  #### Part (b)  
  - *"KTNU is committed to treating pleasure and pain as incommensurable, at least above the threshold."*  
    **Misleading.** Commensurability requires a *single scale for comparison*, while KTNU denies this only *across tiers*. Below T, clause (ii) assumes commensurability between mild suffering and pleasure.  
  - *"If pleasure and pain were commensurable there would have to be determinate exchange rates... no one has ever produced one."*  
    **Confuses commensurability with cardinal measurability.** Commensurability only requires comparability on a shared scale (ordinal or cardinal), not precise exchange rates. Cardinal measurability (needed for (ii)) requires interval-scale precision, but KTNU *does* require it *below T* for fixed exchange rates. Your claim that KTNU "escapes" cardinal measurement is false for sub-threshold trade-offs.  
  - *"Clause (iii) makes the point vivid... suffering and compensation are not measurable against one another."*  
    **Correct for above-T suffering** but ignores that (iii) defines T via individual rationality, not incommensurability per se.  
  **Verdict: Flawed.** Fails to distinguish commensurability (shared scale) from cardinality (precision), and misses that KTNU *requires* cardinal measurability below T. A first-class answer would clarify that:  
  > *While above-T suffering is incommensurable with pleasure/sub-T suffering, clause (ii) assumes cardinal measurability (fixed exchange rates) for sub-T states. KTNU thus needs cardinality below T but rejects full commensurability across tiers.*  

  #### Part (c)  
  - *"The scatter case is settled... in favour of the single person... million sub-threshold pains cannot be pooled."*  
    **Correct per (i).** Lexical priority forbids aggregation across tiers.  
  - *"KTNU does not need interpersonal comparisons of suffering at all... only comparison... within a given sufferer's experience."*  
    **Incorrect and critical error.** To apply the threshold, we *must* compare intensities *across persons* to determine whose suffering reaches T. In scatter, we need to know if the million pains at 0.9T are *all* below T *and* that the one pain is *at or above* T—which requires interpersonal intensity comparisons. Claiming it "sidesteps comparability" is false; it presupposes it.  
  - *"Clause (ii) is very nearly idle in practice... sub-threshold exchange rate will almost never get to break a tie."*  
    **Under-argued and overstated.** While (i) dominates when T-suffering exists, (ii) *is* crucial:  
    - When no one exceeds T (e.g., distributing resources to prevent sub-T suffering).  
    - When comparing options with identical above-T outcomes.  
    Ignoring this misrepresents KTNU’s structure. A first-class answer would note:  
  > *While (i) handles cases involving T-suffering, (ii) governs sub-threshold optimization and cases where no option creates/exacerbates T-suffering.*  
  - *"T is vague... a sorites problem."*  
    **Valid observation** but peripheral to the question. A stronger answer would link this to practical challenges in applying KTNU.  

  **Verdict:** Mixed. Correct on non-aggregation but fails on interpersonal comparability and misjudges (ii)'s role.  

  ---

  ### Overall Assessment  
  **Strengths:**  
  - Part (a) is excellent: precise, nuanced, and shows deep understanding of lexical priority.  
  - Clear writing and logical structure.  
  **Weaknesses:**  
  - **Part (b):** Confuses commensurability with cardinal measurability; overlooks KTNU’s reliance on cardinality below T (fatal for clause (ii)).  
  - **Part (c):** Denies need for interpersonal comparisons (incorrect) and dismisses clause (ii) without justification.  
  - Misses opportunities to discuss:  
    - How lexical priority handles risk (e.g., tiny probabilities of T-suffering).  
    - Whether "fixed by individual rationality" in (iii) implies subjectivity in T.  

  **Why 14/25?**  
  - Part (a): 5/5 (Full marks)  
  - Part (b): 3/10 (Substantive errors; misreads core commitments)  
  - Part (c): 6/10 (Half credit for correct non-aggregation; rest lost to interpersonal comparability error and under-analysis of (ii))  

  **Actionable Advice:**  
  > *Your fluency is impressive, but take care to scrutinize definitions (e.g., commensurability vs. cardinality). When a view has multiple clauses, ask how they interact in edge cases. Interpersonal comparability is unavoidable in threshold views—denying it here undermined an otherwise strong response.*  

  ---

  ### Note on the Question  
  The prompt is well-posed, but part (c)’s "does the view need interpersonal comparisons?" could be misinterpreted. A top answer would distinguish:  
  - *Defining T* (via individual rationality, possibly subjective) vs. *applying T* (requires comparing intensities across persons to assign individuals to tiers).  
  Your student missed this nuance, but the ambiguity is minor.
