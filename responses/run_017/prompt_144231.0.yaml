  **Final Summary**:  
  - **Non-negotiable core**: Projectibility, causal unity, non-indexicality, method-independence, optimization-stability, portability, grain-honesty.  
  - **Critical exclusion**: Causal unity is the strongest filter, weeding out superficial clusters.  
  - **Unsatisfiable**: Sparseness + multiple realizability + microstructural uniformity (resolved by prioritizing causal unity).  
  - **Best candidate theory**: Augmented homeostatic-cluster view (emphasizes causal unity and grain-honesty). It handles multiple realizability and optimization risks better than rivals, though discoverability remains camp-specific.  

  This framework prioritizes your four jobs while flagging where metaphysical commitments (e.g., sparseness) conflict with scientific practice.
