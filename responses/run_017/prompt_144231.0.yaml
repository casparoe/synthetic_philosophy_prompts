  We are constructing a set of desiderata for a theory of natural kinds that must serve four specific purposes: 
  1. Projectibility (inductive generalization from samples to unsampled instances).
  2. Invariance under interventions at other levels.
  3. Re-identifiability under replacement of descriptive vocabulary.
  4. Stability under optimization (when the category becomes a target of selection).

  We are provided with a list of candidate desiderata and distinctions that the theory must respect. We must also consider the cases provided.

  The goal is to produce a set of non-negotiable requirements (given the four jobs) and preferences of particular camps, and then to identify tensions and unsatisfiable combinations.

  We start by listing the desiderata and marking them as non-negotiable (NN) or camp-specific (CS), and then we note tensions and unsatisfiable subsets.

  ## Desiderata and Their Status

  1. **Projectibility**: The category must support inductive inferences. This is non-negotiable because it is directly required by job (1). The grue example shows that not every category is projectible. *Status: NN*

  2. **Sparseness**: Kinds must be sparse (not too many) and not disjunctive or gerrymandered. This is motivated by the need for projectibility (since disjunctive properties are often not projectible) and by the desire for a manageable set of kinds. However, note that some special science kinds (like "weed") might be disjunctive but still useful. This might be a preference of some camps (e.g., sparsity is central to Lewis's naturalness) but it is not strictly non-negotiable for all four jobs. However, for projectibility, we need to rule out disjunctive properties that are not projectible. But note: some disjunctive properties might be projectible if they are unified by a common cause or function. *Status: NN for projectibility, but with care. We must require that the category be projectible, and sparsity might help achieve that, but it is not sufficient (e.g., a sparse but non-projectible property). So we mark sparsity as a CS (for some camps) and not NN. However, we note that arbitrarily disjunctive properties are typically not projectible, so in practice, projectibility (NN) will rule out many disjunctive properties.*

  3. **Causal/homeostatic unity**: The category should be held together by causal mechanisms or homeostatic processes, not just similarity in appearance. This is important for invariance (job 2) and for stability under optimization (job 4). Without causal unity, interventions might break the category. *Status: NN for jobs 2 and 4.*

  4. **Intrinsicality/non-indexicality**: The category should not depend on context (like "tallest in the room"). This is because we want the category to be re-identifiable when our descriptive vocabulary changes (job 3) and to be projectible (job 1). Indexical categories are not projectible beyond the context. *Status: NN for job 3 and job 1.*

  5. **Mind-independence**: The category should not depend on human interests or tools. This is important for re-identifiability (job 3) and for invariance (job 2). However, note that some categories (like money) are mind-dependent but still projectible and invariant in certain contexts. But for job 4 (optimization stability), if the category is mind-dependent, then when it becomes a target of optimization, the human interests might change, so the category might not be stable. So mind-independence is desirable but not absolute? We note that for job 3 (re-identifiability under change of descriptive vocabulary) we require the category to be objective. *Status: NN for job 3 and job 4? But let's be cautious: if the category is mind-dependent, then when the mind-dependent facts change, the category might change. So for stability under optimization (which might change the mind-dependent facts) and for re-identifiability (which requires the category to be fixed independently of our current descriptions), we require mind-independence. Therefore, we mark it as NN.*

  6. **Tolerance of multiple realizability**: The category should allow for multiple underlying physical realizations (e.g., depression, money). This is important because many special science kinds are multiply realized. Without this, we would lose many categories that are projectible and invariant. However, note that job 4 (optimization stability) might require that the category is not too multiply realized because if we select for the category, we might fix a particular realization. But multiple realizability is a fact for many kinds. *Status: We must allow it because otherwise we lose many scientific kinds (non-negotiable for the cases). But note: the theory must account for how such kinds can still be projectible and invariant. So tolerance is NN because the cases (depression, money, etc.) are indispensable and must be covered.*

  7. **Discoverability**: The category should be recoverable from finite noisy samples by clustering or similar methods. This might be a methodological preference of the interpretability camp. However, it is not a metaphysical requirement. For example, a category might exist but be very hard to discover. But for our purpose (interpretability), we want to find features that are discoverable. However, the four jobs do not strictly require discoverability. *Status: CS (for the interpretability camp) but not NN for the four jobs.*

  8. **Method-independence**: The category should not be defined by a single instrument; what we learn with one method should hold for instances gathered by another. This is important for re-identifiability (job 3) and for invariance (job 2). If the category is tied to a method, then when we change our tools, we might lose the category. *Status: NN for job 3.*

  9. **Optimization-stability**: The properties that make the category projectible should not disappear when the category is selected for. This is directly job 4. *Status: NN.*

  10. **Portability across change of fundamental ontology**: The category should survive a change in the fundamental vocabulary. This is job 3. *Status: NN.*

  11. **Grain-honesty**: The theory must specify at what grain the joints are and must not treat fundamental properties and special science properties as natural in the same way. This is because we need to know the level at which the category is natural. Without this, we might confuse levels. *Status: NN because without it we cannot do job 2 (intervening at other levels) or job 4 (optimization might operate at a particular level).*

  ## Distinctions the theory must not collapse

  - Natural vs. merely projectible: Some projectible categories (like grue) are not natural.
  - Natural vs. useful-to-us: Usefulness does not imply naturalness (e.g., "weed" might be useful but not natural).
  - Being a kind at all vs. how natural a kind is: There might be degrees of naturalness.
  - A real kind vs. a stable pattern: A stable pattern might be a statistical regularity without being a kind (e.g., a pattern in noise).
  - A kind vs. an individual: An individual (like a particular organism) is not a kind.

  ## Findings the theory must respect

  - Species are historical lineages, not microstructurally uniform classes.
  - Many scientifically indispensable predicates are multiply realized (e.g., money, gene).
  - The same objects admit many partitionings that predict equally well (promiscuous pluralism).
  - Some categories are unified at one level and heterogeneous at another (e.g., water is homogeneous at the chemical level but heterogeneous at the subatomic level? Actually, water is homogeneous at the molecular level but heterogeneous at the atomic level (H and O). But note: water is H2O, so it is microstructurally uniform. A better example: a biological species is heterogeneous at the genetic level but unified by common descent and interbreeding).

  ## Tensions and Unsatisfiable Desiderata

  We now look for tensions:

  1. **Sparseness vs. Tolerance of multiple realizability**: 
     - Sparseness (as in Lewis) requires that natural properties are not disjunctive. But multiple realizability often leads to disjunctive properties (e.g., pain might be realized by C-fibers firing in humans and by something else in aliens). So if we require sparsity, we might rule out multiply realized properties. But we require tolerance of multiple realizability. Therefore, we cannot require that natural properties are non-disjunctive in the sense of being microstructurally uniform. 
     - Resolution: We must allow disjunctive properties if they are unified by a common cause or function (homeostatic property clusters). So sparsity must be understood as not demanding microstructural unity.

  2. **Intrinsicality/non-indexicality vs. Mind-independence vs. Tolerance of multiple realizability for social kinds**:
     - Social kinds (like money) are mind-dependent and sometimes indexical (e.g., "legal tender in country X"). But we require intrinsicality and mind-independence. However, we also require tolerance for multiple realizability and for the case of money. 
     - Tension: If we require non-indexicality and mind-independence, then money would not be a natural kind. But we require that the theory must account for money (as a candidate for the four jobs). 
     - Resolution: We must relax either intrinsicality or mind-independence for some categories. But note: the four jobs might still hold for money. For example, we can project inductively about money, and it is invariant under some interventions. However, for job 4 (optimization stability): if we select for being money, we might change what counts as money? Actually, money is defined by social conventions, and if we try to optimize for being money, we might create new forms of money, but the functional role (medium of exchange, etc.) might remain. So the functional kind might be stable. Therefore, we might allow that some natural kinds are functional and mind-dependent, but then we must adjust the desiderata accordingly.

  3. **Causal unity vs. Multiple realizability**:
     - Causal unity might require a shared causal mechanism. But multiple realizability implies that the causal mechanism might be different in different realizations. 
     - Resolution: We can have causal unity at a higher level of abstraction (e.g., the function of money is to serve as a medium of exchange, and that function is realized by different mechanisms). So causal unity does not have to be at the micro level.

  4. **Optimization-stability vs. Multiple realizability**:
     - If a category is multiply realized, then when we select for the category, we might fix one realization and lose the multiple realizability. But note: we might still have the functional property. For example, selecting for intelligence (if we define it as a high score on a test) might lead to teaching to the test, but the functional property (ability to solve problems) might still be present in a different form? Or it might not. This is the problem of Goodhart's law. 
