  5. **Grain-honesty vs. Promiscuous pluralism**:
     - Grain-honesty requires that we specify the level, but promiscuous pluralism says that there are many equally good ways to carve the world. 
     - Resolution: The theory must allow that at a given level of grain, there might be multiple natural kinds, but each at its own level.

  ## The Most Problematic Desideratum

  The requirement that seems to exclude the most candidates is **mind-independence**. It rules out social kinds (like money) and some functional kinds (like weed) that are projectible and useful. However, we require the theory to account for money. Therefore, we must drop mind-independence as a non-negotiable requirement for all natural kinds. Instead, we might allow that there are different types of natural kinds: some mind-independent (like water) and some mind-dependent (like money). But then the theory must explain how both can satisfy the four jobs.

  Alternatively, we can relax mind-independence and require that the category be objective in the sense of being grounded in facts that are independent of any single observer, but that might include social facts. Then money is mind-dependent (in that it depends on collective intentionality) but objective (because it is a fact about a society). This might allow for projectibility and invariance in the social context.

  But note: for job 3 (re-identifiability under change of descriptive vocabulary) and job 4 (optimization stability), we need the category to be stable. If the descriptive vocabulary changes but the social facts remain, then money might still be re-identifiable. However, if the social facts change, then money might change. So the stability is conditional on the social context.

  Similarly, for job 4: if we select for being money, we might change the social conventions, so the category might evolve. But the functional role might be preserved. So we need the functional role to be the invariant.

  Therefore, we might require that the category is defined by a stable causal role (which is mind-independent in the sense that the role exists in the social system) rather than by the physical realization.

  ## Summary of Non-Negotiable Desiderata

  Given the four jobs, the following are non-negotiable:

  1. **Projectibility**: The category must support inductive inferences. (Job 1)
  2. **Causal/homeostatic unity**: For invariance under intervention (Job 2) and optimization stability (Job 4).
  3. **Non-indexicality**: For projectibility (Job 1) and re-identifiability (Job 3).
  4. **Method-independence**: For re-identifiability (Job 3).
  5. **Optimization-stability**: Directly Job 4.
  6. **Portability across change of fundamental ontology**: Job 3.
  7. **Grain-honesty**: For Jobs 2 and 4.

  We also require **tolerance of multiple realizability** because otherwise we lose key cases (so it is non-negotiable for the theory to allow it).

  We do not require:

  - **Sparseness** (as microstructural sparsity): We allow multiply realized kinds, which might be disjunctive.
  - **Mind-independence** in the strong sense: We allow social kinds as long as they are objective (grounded in stable social facts) and meet the non-negotiable requirements.
  - **Discoverability**: It is a methodological desire, not a metaphysical requirement for the four jobs.

  ## Cases

  We now test the non-negotiable desiderata against the cases:

  - **Water**: 
