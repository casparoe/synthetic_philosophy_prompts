  ### Desiderata for a Theory of Natural Kinds  
  Given your purpose—grading candidate categories for **inductive projection**, **invariance under intervention**, **re-identifiability under ontological change**, and **stability under optimization**—the theory must satisfy the following non-negotiable (NN) desiderata, derived directly from your four jobs. Preferences internal to specific camps (e.g., micro-essentialists, cluster theorists) are marked (CS).  

  #### Non-Negotiable Desiderata (NN)  
  1. **Projectibility**  
     - **Requirement**: The category must support reliable inductive generalizations from samples to unsampled instances.  
     - **Case/Motivation**: Grue-style problems (e.g., "grue" emeralds change color at time *t*). A projectible category avoids arbitrary time/language dependencies.  
     - **Why NN?** Directly required for Job 1. Without projectibility, induction fails.  

  2. **Causal/Homeostatic Unity**  
     - **Requirement**: The category must be unified by underlying causal mechanisms (e.g., laws, homeostatic processes), not merely by similarity in appearance.  
     - **Case/Motivation**: Water (H₂O) is unified by molecular structure; jade (jadeite/nephrite) is not, leading to failed projections.  
     - **Why NN?** Essential for Job 2 (invariance under intervention) and Job 4 (optimization stability). Non-causal categories fragment under intervention.  

  3. **Non-Indexicality**  
     - **Requirement**: The category must not depend on contextual, relational, or observer-relative properties (e.g., "tallest in the room").  
     - **Case/Motivation**: "Pest" or "weed" depend on human interests; they cannot be re-identified if context changes.  
     - **Why NN?** Required for Job 3 (re-identifiability under vocabulary change) and Job 1 (projectibility). Indexical categories are frame-dependent.  

  4. **Method-Independence**  
     - **Requirement**: Knowledge of instances must generalize across detection methods (e.g., not defined by a single instrument).  
     - **Case/Motivation**: Psychiatric diagnoses based solely on self-report fail when validated against biomarkers.  
     - **Why NN?** Required for Job 3 (re-identifiability) and Job 1 (projectibility). Method-bound categories are artifacts of tools.  

  5. **Optimization-Stability**  
     - **Requirement**: Properties enabling projectibility must persist when the category is optimized for (i.e., no Goodhart’s Law).  
     - **Case/Motivation**: Selecting for "high IQ" may yield test-gaming strategies that break correlation with intelligence.  
     - **Why NN?** Directly required for Job 4. Unstable categories under selection lose explanatory power.  

  6. **Portability**  
     - **Requirement**: The category must survive replacement of the underlying descriptive ontology.  
     - **Case/Motivation**: Chemical elements (e.g., gold) were re-identified from alchemy to atomic theory.  
     - **Why NN?** Directly required for Job 3. Categories tied to ephemeral ontologies are not durable.  

  7. **Grain-Honesty**  
     - **Requirement**: The theory must specify the grain (level of abstraction) at which the category is natural, and distinguish it from fundamental or overly coarse properties.  
     - **Case/Motivation**: "Species" is natural at the lineage level, not genetic micro-structure.  
     - **Why NN?** Required for Job 2 (intervention level) and Job 4 (optimization level). Grain confusion invalidates invariance.  

  #### Camp-Specific Preferences (CS)  
  8. **Sparseness** (CS: Degrees-of-naturalness camp, e.g., Lewis)  
     - **Requirement**: Natural kinds must be sparse (non-gerrymandered, non-disjunctive).  
     - **Case/Motivation**: "Grue" is disjunctive and unprojectible.  
     - **Why CS?** Sparseness aids projectibility (NN), but is not strictly necessary (e.g., multiply realized kinds are disjunctive but projectible).  

  9. **Mind-Independence** (CS: Micro-essentialists)  
     - **Requirement**: The category must exist independently of human interests or tools.  
     - **Case/Motivation**: "Money" depends on social agreements; "consciousness" may depend on measurement.  
     - **Why CS?** Job 3 requires objectivity, but social kinds (e.g., money) can satisfy NN desiderata if grounded in stable causal roles.  

  10. **Tolerance of Multiple Realizability** (CS: Homeostatic-cluster camp, e.g., Boyd)  
      - **Requirement**: The category must allow for diverse physical implementations (e.g., functional kinds).  
      - **Case/Motivation**: "Depression" (varying biologies), "computation" (silicon/carbon).  
      - **Why CS?** Required to handle special-science kinds, but micro-essentialists reject it.  

  11. **Discoverability** (CS: Real-pattern/compression camp, e.g., Dennett)  
      - **Requirement**: The kind must be recoverable from finite, noisy data via clustering/ML.  
      - **Case/Motivation**: Latent-space directions in neural networks.  
      - **Why CS?** Useful for interpretability, but not all natural kinds are easily discoverable (e.g., quantum fields).  

  ---  
  ### Critical Distinctions the Theory Must Preserve  
  - **Natural vs. Merely Projectible**: Natural kinds have causal unity; projectible categories (e.g., "things observed on Tuesday") may lack it.  
  - **Natural vs. Useful-to-Us**: "Weed" is useful but context-dependent; water is useful and mind-independent.  
  - **Kind vs. Individual**: Species are kinds; a specific organism is an individual.  
  - **Real Kind vs. Stable Pattern**: A stable pattern (e.g., "sand" particle size) may lack causal unity; a real kind (e.g., "electron") has it.  
  - **Kind Identity vs. Degree of Naturalness**: "Chemical element" is highly natural; "cancer" is less so due to heterogeneity.  

  #### Non-Contradiction Mandates  
  The theory must accommodate:  
  - Species as historical lineages (not microstructurally uniform).  
  - Multiply realized predicates (e.g., money, gene) as scientifically valid.  
  - Promiscuous pluralism (multiple valid partitionings of objects).  
  - Grain relativity (e.g., water is homogeneous chemically but heterogeneous subatomically).  

  ---  
  ### Tensions and Unsatisfiable Desiderata  
  **Key Tensions**:  
  1. **Sparseness vs. Multiple Realizability**:  
     - Sparseness demands non-disjunctive properties, but multiply realized kinds (e.g., "depression") are inherently disjunctive.  
     - *Resolution*: Sparseness must be relaxed (or redefined as causal unity) to allow functional kinds.  

  2. **Mind-Independence vs. Optimization-Stability for Social Kinds**:  
     - Social kinds (e.g., "money") are mind-dependent but can be optimization-stable if causal roles persist.  
     - *Resolution*: Mind-independence is not NN; stability depends on causal role invariance.  

  3. **Discoverability vs. Grain-Honesty**:  
     - ML clusters (e.g., latent directions) are discoverable but may not align with causal grains (e.g., conflating "intelligence" with test scores).  
     - *Resolution*: Discoverability is CS; grain-honesty is NN and should constrain clustering.  

  **Most Exclusionary Requirement**: **Causal Unity**  
  - Excludes:  
    - "Jade" (two minerals with surface similarity).  
    - "Weed" (no shared causal mechanism).  
    - "Sand" (defined by particle size, not causal origin).  
    - Gerrymandered ML features (e.g., directions sensitive to adversarial attacks).  
  - *Why?* Without causal unity, categories fail invariance (Job 2) and optimization stability (Job 4).  

  **Jointly Unsatisfiable Trio**:  
  1. **Sparseness** (non-disjunctive).  
  2. **Tolerance of Multiple Realizability** (allows disjunctive kinds).  
  3. **Microstructural Uniformity** (demands reductionism).  
  - *Argument*: Sparseness and microstructural uniformity exclude multiply realized kinds (e.g., "money"). If sparsity is abandoned, multiple realizability and microstructural uniformity conflict. Only **causal unity** resolves this (allowing functional disjunction).  

