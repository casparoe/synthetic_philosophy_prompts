  ## Appendix: Grading Camps

  We briefly grade five camps:

  1. **Micro-essentialism** (e.g., Kripke, Putnam):
     - Strong on: projectibility, intrinsicality, mind-independence, portability.
     - Weak on: tolerance of multiple realizability, grain-honesty (only micro level), optimization-stability (if the essence is fixed, then selecting for it might be stable, but if the category is functional, it might not have a micro-essence).

