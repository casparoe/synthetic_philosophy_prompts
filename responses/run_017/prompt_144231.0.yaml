  The requirement that is most problematic is **optimization-stability** because it is hard to satisfy for many categories (like intelligence) and it is not clear what it demands.

  We also note that no camp satisfies all the non-negotiable desiderata perfectly. The homeostatic property cluster view comes closest because it handles multiple realizability and causal unity, but it might need to be augmented with an account of optimization-stability and grain-honesty.
