answer: |-
  Here are the five requested items:

  **1. The Question**  
  *Contemporary Moral Philosophy Final Exam – Question 3 (20 marks)*  
  Scanlon’s contractualism holds that an act is wrong if disallowed by principles no one could reasonably reject, where a principle’s reasonable rejectability depends on comparing the *complaints* individuals have against it. Complaints are typically assessed situation-by-situation: we ask if an individual could reasonably reject the principle based on the burden it imposes *in a specific circumstance* where it applies to them. This is often thought to block aggregation (e.g., many small benefits outweighing one large loss), unlike utilitarianism.  

  Consider a modified approach: the **Life-Profile Clause**. When assessing whether a principle is reasonably rejectable *for a given person*, we evaluate that person’s complaint not situation-by-situation, but by considering the *total expected burden* the principle imposes on them *across the entire profile of situations* in which it applies to them over their lifetime.  

  **The Case:** An island community must choose a safety standard for its public ferry system under a principle applying equally to all residents.  
  -   **Cheap Standard:** 200,000 residents each pay $3/year in taxes. 12 crew members face a 1-in-200 annual risk of drowning.  
  -   **Expensive Standard:** No one pays any tax. Crew members face a reduced 1-in-2,000 annual risk.  
  Crucially, crew members are selected annually via a fair lottery from the *entire adult resident population*. Assume a 40-year working life. Thus, over a lifetime, a typical resident will pay the $3/year tax in most years and will serve as crew (facing elevated risk) in a small number of years.  

  **(a)** Explain how applying the **Life-Profile Clause** to the Cheap Standard might affect whether a typical resident (who participates fully in the lottery) could reasonably reject it. Does this help contractualism deliver an intuitively plausible (perhaps utilitarian-like) result here? (8 marks)  
  **(b)** Does the result in (a) show that contractualism *can* aggregate burdens/benefits after all, or does it show that the lottery system creates a form of *reciprocity* that achieves aggregation-like results without changing contractualism’s core rejection procedure? Justify your answer. (6 marks)  
  **(c)** Consider individuals who *cannot* participate in the crew lottery or benefit from its reciprocity (e.g., a resident permanently unable to serve on a crew, a short-term visitor present only during a high-risk crew year, or someone born after the standard is chosen). Could such an individual reasonably reject the Cheap Standard under the Life-Profile Clause? What does this imply about whether the Clause solves contractualism’s perceived aggregation problem? (6 marks)  

  **2. Model Answer (Approx. 320 words)**  
  **(a)** The Life-Profile Clause transforms the complaint assessment. For a typical resident under the Cheap Standard, the Clause requires calculating their *lifetime expected burden*. This includes: paying $3/year for ~40 years ($120 total), plus the expected burden of occasional crew service. The annual drowning risk (1/200) translates over a lifetime to a small chance of serving as crew facing that risk. Crucially, the *expected cost* of this risk (probability of death * disvalue of death) is vastly larger than the trivial $3 annual payment. However, the *probability* any individual serves as crew is low. Over a lifetime, the resident's *overall expected burden* – combining certain small payments and a small chance of a catastrophic loss – is dominated by the catastrophic risk component when it materializes *for them*. The Clause forces the resident to consider if *this total expected lifetime burden* (not just the $3 payment *or* the high crew risk in isolation) makes the Cheap Standard rejectable. Compared to the Expensive Standard (no payment, minimal risk), the *difference* in lifetime expected burden for a typical resident is likely significant enough that rejecting the Cheap Standard remains unreasonable. This yields the plausible (utilitarian-like) result favouring the Cheap Standard, as its smaller burdens distributed widely outweigh the concentrated risk.  

  **(b)** This result stems primarily from the *lottery-induced reciprocity*, not a fundamental change to contractualism's rejection logic. Contractualism still compares individual complaints ("Could *I* reasonably reject...?"). The Clause merely shifts the *unit* of comparison to the lifetime profile. The aggregation-like outcome arises because the lottery ensures each person *internalizes* both the small costs (as payers) and the large risks (as potential crew) *over time*. Their complaint against the Cheap Standard weakens because they know they *also benefit* from lower costs when not at risk. This is reciprocity: bearing burdens in one role to gain benefits in another. Contractualism doesn't sum burdens *across persons*; it assesses each person's *own integrated burden/benefit profile* against alternatives. Utilitarianism sums across persons irrespective of reciprocity.  

  **(c)** Individuals excluded from the lottery reciprocity *can* reasonably reject the Cheap Standard under the Life-Profile Clause. A resident unable to serve only ever pays $3/year, receiving no compensating reduction in personal risk exposure. Their lifetime burden profile under the Cheap Standard ($120 paid, baseline risk) is clearly worse than under the Expensive Standard ($0 paid, *reduced* baseline risk). They have a strong, unrecompensed complaint. Similarly, a visitor present only in a high-risk crew year faces only the risk without prior/future compensation. The Clause does nothing to mitigate their complaint; it might even worsen it by forcing them to bear the full risk *as their entire relevant life-profile*. This shows the Clause doesn't solve contractualism's core aggregation problem for *uncompensated losers*. Contractualism remains vulnerable where benefits and burdens fall asymmetrically on different individuals without reciprocity, as these individuals retain decisive complaints against principles imposing net burdens solely on them.  

  **3. Five Must-Hit Moves for an A Answer (20 marks total)**  
  1.  **(4 marks)** Correctly calculates/explains how the Life-Profile Clause transforms the complaint for a typical resident by integrating lifetime costs (certain small payments + low-probability high burden of crew risk) into a single expected burden profile, showing it weakens their grounds for rejection.  
  2.  **(4 marks)** Identifies that the plausible (Cheap Standard) result arises from the *lottery creating reciprocity* (individuals bear burdens in one role to gain benefits in another), not a change in contractualism's core individual-comparison structure.  
  3.  **(4 marks)** Recognizes that individuals excluded from the lottery (e.g., non-crew-eligible resident) have a *stronger* complaint under the Clause, as their lifetime profile consists *only* of costs (payments) without compensating risk reduction benefits.  
  4.  **(4 marks)** Concludes that the Clause fails to solve contractualism's aggregation problem for *uncompensated losers*, as their decisive complaints persist, demonstrating the limitation is inherent to the individual-reason-giving structure, not the situational focus.  
  5.  **(4 marks)** Clearly distinguishes the *reciprocity mechanism* enabling aggregation-like results for participants from *utilitarian aggregation* (summing across persons irrespective of individual reciprocity).  

  **4. What a B Answer Looks Like**  
  *Move it Makes (Like A):* Correctly explains how the Life-Profile Clause integrates costs/risks over a lifetime for a typical resident (Move 1), weakening their complaint and supporting the Cheap Standard. It identifies the lottery's role in reciprocity (Move 2).  
  *Move it Misses:* Fails to adequately address the plight of non-participants (Move 3) or draw the crucial conclusion that this exposes the *persistence* of the aggregation problem for uncompensated losers, showing the Clause's limitation (Move 4). It might mention non-participants briefly but doesn't analyze their complaint under the Clause or its implications robustly.  

  **5. Standard Ways Candidates Blow It & Mark Cost**  
  *   **Restating the Transmitter Room / Standard Aggregation Objection (Cost: ~8-12 marks):** The answer focuses solely on explaining why standard contractualism (without the Life-Profile Clause) can't aggregate (e.g., "the one worker's death complaint outweighs the many small benefits"), mentions the Transmitter Room, and never engages substantively with the *Life-Profile Clause twist* or the *lottery/reciprocity* element. It fails parts (a), (b), and (c) of the specific question.  
  *   **Handwaving about "Reasons Concerning Others" (Cost: ~6-10 marks):** The answer asserts that the Life-Profile Clause allows individuals to consider the benefits to others as part of *their own* reason for not rejecting the principle, without explaining *how* this integrates into their *personal lifetime burden/benefit profile* under the Clause or grappling with the reciprocity vs. direct concern distinction. It fails to precisely articulate the reciprocity mechanism (Move 2) and likely neglects non-participants (Moves 3 & 4).  
  *   **Misapplying the Life-Profile Clause / Ignoring Reciprocity (Cost: ~4-8 marks):** The answer tries to use the Clause but misapplies it (e.g., sums complaints *across* different people's life profiles, or only focuses on the crew risk year for the typical resident without integrating the payer years). It fails to see the reciprocity as key (Move 2), treating the result as simple aggregation within contractualism. It may also overlook non-participants.  
  *   **Ignoring Non-Participants Entirely (Cost: ~6 marks off part c):** The answer does well on (a) and (b) but completely fails to address part (c) about individuals excluded from the lottery reciprocity, missing the critical implication for the aggregation problem (Moves 3 & 4).
