  For grading, top marks require identifying: 1) how lifetime assessment changes complaint weights, 2) why reciprocity enables "aggregation-like" outcomes, 3) that vulnerable groups undermine this, 4) why this differs from utilitarianism, and 5) that the core non-aggregation structure remains intact. A B answer would likely miss the vulnerability point. Common failures include defaulting to transmitter-room comparisons or handwaving about interpersonal reasons - these should cost significant marks.

