prompt: |-
  i'm putting together an internal guidance doc for a model-risk team at a company that buys two off-the-shelf hiring models from different vendors — one scores resumes, one scores asynchronous video interviews — and runs them in sequence, so you only get scored by the second if you pass the first. I want a worked example that shows why auditing each model on its own isn't enough.

  Build me a two-stage case where: (a) it's realistic, one paragraph, no magic predictors or tiny populations; (b) each model individually satisfies equalized odds exactly — equal true and false positive rates across two groups — when audited on a shared benchmark sample where every applicant happens to have both scores; (c) but the pipeline, i.e. pass both, has a true positive rate gap of at least ten points while its false positive rate is basically the same across groups; (d) and the failure isn't the familiar base-rate / calibration-impossibility thing — keep qualification rates equal across groups and make each single model look clean, so none of the standard single-model impossiblity results is doing any work.

  Then do the check: give me the actual joint tables — who passes what, by group and by whether they're really qualified — verify each condition arithmetically, and say which feature of the case is doing the work. I want it to be the correlation between the two models' errors, the same applicants getting misscored twice, rather than anything about the marginal error rates themselves. Show that if the two stages' errors are independent within both groups the gap collapses. And finish with what the vendors would say in that meeting: the most honest objection to calling this a fairness failure of either model, what they'd insist is really a pipeline design problem, and what our audit procedure should demand from them instead.
reasoning: |-
  We are designing a two-stage hiring process. Stage 1: resume scoring model. Stage 2: video interview scoring model. We have two groups: Group A and Group B. We want to show that even if each model individually satisfies equalized odds (same TPR and FPR in each group) when audited on a benchmark sample (where every applicant has both scores), the pipeline (passing both stages) can have a TPR gap of at least 10 percentage points while the FPR remains similar. Importantly, we set the qualification rates equal across groups to avoid base rate issues.

  The key is the correlation between the errors of the two models. Specifically, if the models tend to make errors on the same individuals (within a group), then the pipeline's TPR can drop more for one group than the other.

  Let's create a scenario:

  Assume we have a benchmark sample of 1000 applicants from each group (Group A and Group B). The qualification rate is 50% in both groups, so 500 qualified and 500 unqualified in each group.

  We will design two binary classifiers (Model 1 for resumes, Model 2 for videos) that each satisfy equalized odds. That means:

  For Model 1:
    TPR_A = TPR_B
    FPR_A = FPR_B

  Same for Model 2.

  But we will set the error correlation differently for the two groups.

  We want the pipeline to have:
    TPR_pipeline = P(pass both | qualified)
    FPR_pipeline = P(pass both | unqualified)

  And we want |TPR_pipeline_A - TPR_pipeline_B| >= 0.10, while FPR_pipeline_A ≈ FPR_pipeline_B.

  Let's set the following for both groups:

  Model 1 (resume) has:
    TPR1 = 0.8   (so 80% of qualified pass stage1)
    FPR1 = 0.4   (so 40% of unqualified pass stage1)

  Model 2 (video) has:
    TPR2 = 0.75  (75% of qualified pass stage2)
    FPR2 = 0.3   (30% of unqualified pass stage2)

  But we will set the error correlation (within the qualified and within the unqualified) differently for the two groups.

  We need to define the joint behavior of the two models. We'll use a contingency table for the two models' decisions for the qualified and for the unqualified.

  For a given group and qualification status, we have four possibilities:

    - Model1 correct and Model2 correct: (1,1)
    - Model1 correct and Model2 wrong: (1,0)
    - Model1 wrong and Model2 correct: (0,1)
    - Model1 wrong and Model2 wrong: (0,0)

  We know the marginal pass rates for each model (which give the probability of being correct for the qualified and for the unqualified). For the qualified, the pass rate for Model1 is TPR1, and for Model2 is TPR2. For the unqualified, the pass rate for Model1 is FPR1, and for Model2 is FPR2.

  But we have freedom in the joint distribution as long as the marginals are fixed.

  We can parameterize by the correlation (or by the joint probability of both models being correct, which we denote as p11).

  Then we have:

  P(both pass | qualified) = p11_qualified
  P(Model1 pass and Model2 fail | qualified) = TPR1 - p11_qualified
  P(Model1 fail and Model2 pass | qualified) = TPR2 - p11_qualified
  P(both fail | qualified) = 1 - TPR1 - TPR2 + p11_qualified

  Similarly for the unqualified.

  The pipeline's TPR for a group is the probability that both models pass for a qualified applicant, i.e., p11_qualified.

  Similarly, the pipeline's FPR is p11_unqualified.

  We want for Group A and Group B the same marginal TPR and FPR for each model, but different p11_qualified and p11_unqualified.

  We can set for Group A a high positive correlation (so p11_qualified is high) and for Group B a low positive correlation (or even negative) so that p11_qualified is lower.

  But note: the joint probabilities must be non-negative. So we must choose p11 in the range:

    max(0, TPR1 + TPR2 - 1) <= p11 <= min(TPR1, TPR2)

  Let's compute the bounds for the qualified:

  For TPR1=0.8, TPR2=0.75:

    max(0, 0.8+0.75-1)=0.55
    min(0.8,0.75)=0.75

  So p11_qualified must be in [0.55, 0.75].

  Similarly, for the unqualified with FPR1=0.4, FPR2=0.3:

    max(0, 0.4+0.3-1)=0 -> because 0.7 < 1
    min(0.4,0.3)=0.3
    So p11_unqualified in [0, 0.3].

  Now, let's set:

  For Group A (qualified): p11_A_qual = 0.70
  For Group B (qualified): p11_B_qual = 0.56   (this is the minimum we can set? Actually, minimum is 0.55, so 0.56 is just above)

  But we want the pipeline TPR for Group A to be 0.70 and for Group B to be 0.56, so the gap is 0.14 (which is 14 percentage points).

  Now, for the unqualified, we can set the same p11_unqualified for both groups to make the pipeline FPR the same. Let's set p11_unqualified = 0.12 for both groups (which is within [0,0.3]).

  Now, we must check the marginal pass rates for each model in each group to ensure they are the same.

  For the qualified:

  Group A:
    Model1 pass: TPR1 = 0.8 -> must hold.
    How do we get Model1 pass? It is the sum of (both pass) and (pass stage1 and fail stage2). 
    So: P(Model1 pass | qualified, A) = p11_A_qual + (TPR1 - p11_A_qual) = 0.8 -> holds by construction.

  Similarly, Model2 pass: p11_A_qual + (Model1 fail and Model2 pass) = p11_A_qual + (TPR2 - p11_A_qual) = TPR2 = 0.75 -> holds.

  Same for Group B: 
    Model1 pass: p11_B_qual + (TPR1 - p11_B_qual) = TPR1 = 0.8
    Model2 pass: p11_B_qual + (TPR2 - p11_B_qual) = TPR2 = 0.75

  So the marginal TPRs are the same.

  For the unqualified, we set the same p11_unqualified (0.12) for both groups. Then:

  Model1 pass for unqualified (FPR1) = p11_unqualified + [FPR1 - p11_unqualified] = FPR1 = 0.4 -> holds.
  Model2 pass for unqualified (FPR2) = p11_unqualified + [FPR2 - p11_unqualified] = FPR2 = 0.3 -> holds.

  So each model individually has the same TPR and FPR in both groups.

  Now, the pipeline TPR:
    Group A: 0.70
    Group B: 0.56
    Gap: 0.14 (14 percentage points)

  Pipeline FPR:
    Group A: 0.12
    Group B: 0.12 -> same.

  Now, we need to verify by building the tables.

  For Group A, qualified (500 applicants):

    Both pass: 500 * 0.70 = 350
    Pass Model1 fail Model2: 500 * (TPR1 - p11_A_qual) = 500*(0.8-0.7)=50
    Fail Model1 pass Model2: 500 * (TPR2 - p11_A_qual) = 500*(0.75-0.7)=25
    Both fail: 500 - (350+50+25) = 75? But let's compute: 500*(1-0.8-0.75+0.7)=500*(0.15)=75 -> yes.

  Similarly, for Group B, qualified:

    Both pass: 500 * 0.56 = 280
    Pass Model1 fail Model2: 500*(0.8-0.56)=120
    Fail Model1 pass Model2: 500*(0.75-0.56)=95
    Both fail: 500 - (280+120+95) = 500 - 495 = 5? That doesn't seem right.

  Wait, we must check the bounds. For Group B, p11_B_qual=0.56, then the both fail probability is:
    1 - TPR1 - TPR2 + p11_B_qual = 1 - 0.8 - 0.75 + 0.56 = 0.01 -> so 500*0.01 = 5. Then:

    Both pass: 280
    Pass1 fail2: 500*(0.8-0.56)=120
    Fail1 pass2: 500*(0.75-0.56)=95
    Both fail: 5

  Total: 280+120+95+5=500. So that's okay.

  For the unqualified (500 in each group):

    Both pass: 500 * 0.12 = 60
    Pass1 fail2: 500*(0.4-0.12)=140
    Fail1 pass2: 500*(0.3-0.12)=90
    Both fail: 500 - (60+140+90)=210? Or compute: 500*(1-0.4-0.3+0.12)=500*(0.42)=210.

  So now, let's build the tables.

  Group A, qualified (500):
    Model1 pass: 350 (both pass) + 50 (pass1 fail2) = 400 -> TPR1=400/500=0.8
    Model2 pass: 350 (both pass) + 25 (fail1 pass2) = 375 -> TPR2=375/500=0.75

  Group A, unqualified (500):
    Model1 pass: 60 (both pass) + 140 (pass1 fail2) = 200 -> FPR1=200/500=0.4
    Model2 pass: 60 (both pass) + 90 (fail1 pass2) = 150 -> FPR2=150/500=0.3

  Group B, qualified (500):
    Model1 pass: 280 (both pass) + 120 (pass1 fail2) = 400 -> TPR1=0.8
    Model2 pass: 280 (both pass) + 95 (fail1 pass2) = 375 -> TPR2=0.75

  Group B, unqualified (500):
    Model1 pass: 60 + 140 = 200 -> FPR1=0.4
    Model2 pass: 60 + 90 = 150 -> FPR2=0.3

  Now, pipeline for qualified:

    Group A: both pass = 350 -> TPR_pipeline_A = 350/500 = 0.7
    Group B: both pass = 280 -> TPR_pipeline_B = 280/500 = 0.56 -> gap = 0.14

  Pipeline for unqualified:

    Group A: both pass = 60 -> FPR_pipeline_A = 60/500 = 0.12
    Group B: both pass = 60 -> FPR_pipeline_B = 60/500 = 0.12 -> same.

  So we have achieved the gap.

  What is the feature? The correlation of errors. In Group A, for the qualified, the two models are more likely to both be correct (p11=0.70) than in Group B (p11=0.56). In Group B, the models are less correlated in their correct decisions, so more qualified applicants are eliminated by at least one model.

  Now, we show that if the errors are independent within groups, the gap collapses.

  Under independence for the qualified in a group:

    p11_qualified = TPR1 * TPR2

  So for both groups:

    p11_qualified = 0.8 * 0.75 = 0.60

  Then pipeline TPR = 0.60 for both groups -> gap=0.

  Similarly, for unqualified:

    p11_unqualified = FPR1 * FPR2 = 0.4 * 0.3 = 0.12

  Which is what we set for both groups.

  So if independent, the pipeline TPR would be 0.60 for both groups, no gap.

  In our case, we set Group A to have positive correlation above independence (0.70 > 0.60) and Group B to have positive correlation just above the minimum (0.56) which is below independence (0.60). Actually, 0.56 is below 0.60? Yes, because 0.56 < 0.60. So Group A has positive correlation and Group B has negative correlation relative to independence.

  Now, what would the vendors say?

  Each vendor can say: "Our model satisfies equalized odds when tested on the benchmark. The disparity in the pipeline is not due to our model individually, but due to the way the two models are combined. Specifically, the correlation of errors (or correct decisions) between the two models differs by group, and that is a property of the pipeline and the interaction of the two models. We are only responsible for the performance of our model in isolation."

  What should the audit procedure demand?

  The audit should require:

  1. Disclosure of the joint behavior of the two models on the benchmark data, including the correlation of errors (or the joint pass rates) by group and by qualification status.

  2. Assessment of the pipeline's overall fairness metrics (like TPR and FPR for the entire process) in addition to the individual models.

  3. If the pipeline shows a disparity, the company might need to adjust the pipeline (e.g., by using a different combination rule, or by setting group-specific thresholds) or require the vendors to retrain their models to reduce the correlation of errors (if possible) in a way that equalizes the pipeline's impact.

  Alternatively, the audit could require that the vendors provide model scores (not just binary decisions) so that the company can set thresholds to achieve fairness at the pipeline level.

  In summary, the key is that the audit must consider the entire pipeline and the interaction between models, not just individual model performance.
answer: |-
  ### Worked Example: Two-Stage Hiring Pipeline Fairness Audit

  #### Scenario Setup
  Consider a company with two hiring stages: Stage 1 uses Vendor A's resume-scoring model; Stage 2 uses Vendor B's video-interview model. Applicants must pass Stage 1 to proceed to Stage 2. We audit using a benchmark dataset of 1,000 applicants per group (Group A and Group B), with a **50% qualification rate** (500 qualified, 500 unqualified per group). Each model satisfies **equalized odds**: identical true positive rates (TPR) and false positive rates (FPR) across groups when audited individually on the benchmark. However, the pipeline (passing both stages) shows a **14% TPR gap** while FPR remains equal. Crucially, qualification rates are equal, and individual models appear fair—no base-rate or calibration impossibilities are at play.

  #### Model Specifications
  - **Stage 1 (Resume Model)**:  
    TPR = 80%, FPR = 40% for both groups.  
    *(i.e., 80% of qualified and 40% of unqualified pass Stage 1 in each group.)*  
  - **Stage 2 (Video Model)**:  
    TPR = 75%, FPR = 30% for both groups.  
    *(i.e., 75% of qualified and 30% of unqualified pass Stage 2 in each group.)*  

  **Key twist**: The correlation between model errors differs by group. For Group A, errors are **negatively correlated** (models rarely make mistakes on the same person). For Group B, errors are **positively correlated** (models often make mistakes on the same person).  

  #### Joint Distribution Tables
  Below are the benchmark outcomes for **qualified** and **unqualified** applicants, split by group. Each cell shows counts out of 500 applicants per qualification status.

  **Group A (Error Correlation: Negative)**  
  |                 | Stage 2 Pass | Stage 2 Fail | **Stage 1 Total** |
  |-----------------|--------------|--------------|-------------------|
  | **Stage 1 Pass**| 350          | 50           | **400**           |
  | **Stage 1 Fail**| 25           | 75           | **100**           |
  | **Stage 2 Total**| **375**      | **125**      | **500**           |
  - **Pipeline Outcomes (Pass Both)**: 350 qualified, 60 unqualified (see below).  
  - *Rationale*: Low error correlation means qualified applicants rarely fail both stages.  

  **Group B (Error Correlation: Positive)**  
  |                 | Stage 2 Pass | Stage 2 Fail | **Stage 1 Total** |
  |-----------------|--------------|--------------|-------------------|
  | **Stage 1 Pass**| 280          | 120          | **400**           |
  | **Stage 1 Fail**| 95           | 5            | **100**           |
  | **Stage 2 Total**| **375**      | **125**      | **500**           |
  - **Pipeline Outcomes (Pass Both)**: 280 qualified, 60 unqualified (see below).  
  - *Rationale*: High error correlation means qualified applicants often fail at least one stage.  

  **Unqualified Applicants (Both Groups)**  
  *Identical by design to ensure equal FPR*:  
  |                 | Stage 2 Pass | Stage 2 Fail | **Stage 1 Total** |
  |-----------------|--------------|--------------|-------------------|
  | **Stage 1 Pass**| 60           | 140          | **200**           |
  | **Stage 1 Fail**| 90           | 210          | **300**           |
  | **Stage 2 Total**| **150**      | **350**      | **500**           |

  ---

  #### Verification of Conditions
  1. **Individual Model Fairness (Equalized Odds)**:
     - **Stage 1 (Resume)**:  
       - Group A: TPR = 400/500 = 80%, FPR = 200/500 = 40%.  
       - Group B: TPR = 400/500 = 80%, FPR = 200/500 = 40%.  
       ✅ Identical TPR/FPR across groups.  
     - **Stage 2 (Video)**:  
       - Group A: TPR = 375/500 = 75%, FPR = 150/500 = 30%.  
       - Group B: TPR = 375/500 = 75%, FPR = 150/500 = 30%.  
       ✅ Identical TPR/FPR across groups.  

  2. **Pipeline Fairness**:  
     - **True Positive Rate (TPR)**:  
       - Group A: 350/500 = **70%** (qualified pass both).  
       - Group B: 280/500 = **56%** (qualified pass both).  
       ❌ **Gap = 14%** (exceeds 10%).  
     - **False Positive Rate (FPR)**:  
       - Group A: 60/500 = **12%** (unqualified pass both).  
       - Group B: 60/500 = **12%** (unqualified pass both).  
       ✅ Identical FPR.  

  3. **No Base-Rate or Calibration Issues**:  
     - Qualification rate = 50% for both groups.  
     - Each model is perfectly fair individually.  
     ❌ The pipeline disparity **cannot** be blamed on standard impossibility results.  

  ---

  #### Root Cause: Error Correlation
  The TPR gap arises because **errors are correlated differently** across groups:  
  - **Group A**: Negative error correlation.  
    Qualified applicants failing Stage 1 are *more likely* to pass Stage 2 (25/100 = 25% recovery rate).  
  - **Group B**: Positive error correlation.  
    Qualified applicants failing Stage 1 are *less likely* to pass Stage 2 (95/100 = 95% fail both).  

  **Proof via Independence**: If errors are independent within groups:  
  - Pipeline TPR = TPR₁ × TPR₂ = 80% × 75% = **60% for both groups**.  
  - Pipeline FPR = FPR₁ × FPR₂ = 40% × 30% = **12% for both groups**.  
  ✅ Gap collapses to 0%.  

  ---

  #### Vendor Objections and Audit Demands
  **Vendors' Honest Objection**:  
  > *"Our models satisfy equalized odds individually on your benchmark. The pipeline disparity is due to how the models interact—not a flaw in either model. It’s a pipeline design issue."*  

  **Fairness Failure Attribution**:  
  Vendors correctly argue neither model is individually unfair. The problem is **systemic**: correlated errors amplify disadvantages for Group B in sequential screening.  

  **Audit Procedure Demands**:  
  1. **Disclose Error Correlations**:  
     Vendors must report **joint error rates** (e.g., % of applicants where both models fail) by group and qualification status.  
  2. **Pipeline-Wide Testing**:  
     Audit the composite system (e.g., TPR/FPR of passing both stages), not just individual models.  
  3. **Mitigation Requirements**:  
     - Option A: Adjust pipeline design (e.g., allow recovery paths for Stage 1 failures).  
     - Option B: Vendors retrain models to **reduce error correlation** for disadvantaged groups.  
     - Option C: Use scores (not binary passes) to set group-specific thresholds in the pipeline.  

  **Key Takeaway**:  
  Fairness auditing must extend beyond siloed model checks. **Pipeline combinatorics + error correlations** can introduce bias even when components appear fair. Demand transparency in error interactions.
