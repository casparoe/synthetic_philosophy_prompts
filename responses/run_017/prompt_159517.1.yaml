  KSBS chooses X, Nash chooses X (40>36).

  No difference. The simplest way to test is to use the new case itself, as KSBS picks C and Nash picks B. If she chooses C, it confirms KSBS; if B, it suggests Nash or restricted KSBS.

  **Conclusion:**  
  - **Rule:** Kalai-Smorodinsky with ideal from full feasible set.  
  - **New case prediction:** She picks **C: (9, 7)**.  
  - **Test case:** Present a case like options (9,4) and (5,6), but since they often agree, rely on the new case outcome. If she picks C, it supports KSBS; if B, it may indicate Nash. For a decisive test, use asymmetric points like (10,2) and (4,5), where:
    - Nash: (10,2)=20 vs (4,5)=20, tie.
    - KSBS: Ideal (10,5); (10,2) min(1,0.4)=0.4, (4,5) min(0.4,1)=0.4, tie.
  But if you add (7,4):
