    - KSBS: Ideal (10,5); min ratios: (10,2) min(1,0.4)=0.4, (7,4) min(0.7,0.8)=0.7, (4,5) min(0.4,1)=0.4; selects (7,4).
  Still agree. Thus, the new case is the best separator: her choice between B and C reveals the rule.
