  ### Decision Tree for Preference Inference in Household Assistance Robot

  **Framing Assumptions and Settled vs. Contested Ground**  
  I adopt your premise: behavior alone cannot pin down a unique reward function due to underdetermination (affine transformations, potential-based reshaping, and ambiguities between reward, beliefs, and noise). This is **settled** technical ground. **Contested** issues include:  
  - Which tie-breaking principle to use (e.g., softmax noise vs. belief inference vs. satisficing).  
  - Whether a scalar reward is the right target (rejected by deontic, social role, and set-based positions).  
  - How to model inconsistencies: as noise (soft-optimality), as structure (beliefs, norms), or as indifference (set-based).  
  - Whether active queries are essential or a last resort.  

  Your weakest framing assumption is that preferences are **stable and individual-centric**. Real households involve shifting preferences, multi-user conflicts, and social dynamics. I would drop this first, as it ignores collective decision-making and contextual fluidity. The specification should at least allow for multi-user extensions.

  **Tree Structure and Logical Space**  
  The tree has 8 internal branch nodes (7 with 2 branches, 1 with 3 branches) and 10 leaves. Nodes are phrased as questions about concrete observations, answerable without formal knowledge. The logical space has 5 core distinctions:  
  1. **Source of inconsistency**: Noise vs. beliefs vs. norms vs. indifference.  
  2. **Role of context**: Social norms vs. preference shifts vs. habits.  
  3. **Robot's role**: Passive inference vs. active querying vs. cooperation.  
  4. **Object of inference**: Scalar reward vs. set vs. policy vs. rules.  
  5. **Handling conflicts**: Ignore vs. resolve via queries vs. attribute to structure.  

  These distinctions permit 144 possible combinations (2^7 for binary nodes × 3 for the ternary node). Only 10 are occupied by named positions; others are:  
  - **Incoherent**: e.g., "Infer deontic rules while assuming all behavior is noisy" (rules imply structure, noise erases it).  
  - **Unattractive**: e.g., "Always use active queries for low-stakes habits" (inefficient and annoying).  
  - **Unexplored**: e.g., "Jointly infer satisficing and social roles" (no methods combine these).  

  Nodes are anchored to observations:  
  - Node 1: Observation a (complains while making bed).  
  - Node 2: Observation d (insists on washing knives).  
  - Node 3: Observation e (habitual old-layout movements).  
  - Node 4: Observation b (different task with guest vs. alone).  
  - Node 5: Observation f (wants free time but does chores).  
  - Node 6: Observation c (two competent task methods).  
  - Node 7: Observation g (defers to daughter).  
  - Node 8: Observation h (abandons tasks when phone rings).  

  **Decision Tree**  
  Each node branches based on interpreting observations. Answers lead to leaves representing methodological positions.  

  1. **When the user complains during a task (e.g., making bed), does this indicate a true preference conflict?**  
     - **Yes**: Conflict between behavior and expression → Node 2.  
     - **No**: Complaints are irrelevant venting; use revealed behavior → Node 3.  

  2. **When she insists on specific self-performed tasks (e.g., washing knives), is this best explained by a rule?**  
     - **Yes**: Inviolable constraint exists → **Leaf: Deontic Constraints**.  
     - **No**: High perceived delegation cost → Node 4.  

  3. **When her movements are efficient for an old layout, is this due to unawareness or habit?**  
     - **Unaware**: Wrong beliefs about the world → **Leaf: Joint Reward and Beliefs**.  
     - **Habit**: Decoupled from current optimization → Node 5.  

  4. **When she changes behavior with context (e.g., guest present), is this a preference shift or social norm?**  
     - **Preference shift**: Context changes her values → Node 6.  
     - **Social norm**: Context imposes rules → **Leaf: Social Role/Norm**.  

  5. **When her stated desire (e.g., free time) conflicts with behavior (doing chores), is this self-deception or hidden costs?**  
     - **Self-deception**: Stated preference is unreliable → Node 7.  
     - **Hidden costs**: Delegation has unobserved penalties → Node 8.  

  6. **When she uses two equally good methods for a task with no pattern, is this indifference or noise?** (3-way branch)  
     - **Indifference**: Methods are equally preferred → **Leaf: Set of Rewards**.  
     - **Noise**: Random variation in choice → **Leaf: Single Reward, Soft-Noise**.  
     - **Unobserved context**: Missing situational factors → **Leaf: Cooperating Agents**.  

  7. **When she defers decisions (e.g., about grandson), should the robot defer to the family member?**  
     - **Yes**: Authority transferred → **Leaf: Active Queries** (since robot must now query others).  
     - **No**: Deference is part of her own preference structure → **Leaf: Policy Direct**.  

  8. **When she abandons tasks midway, is this due to low priority or satisficing?**  
     - **Low priority**: Task reward is negligible → **Leaf: Single Reward, Soft-Noise**.  
     - **Satisficing**: "Good enough" threshold met → **Leaf: Aspiration Level**.  

  **Leaves and Positions**  
  Each leaf is defined by commitment; labels are secondary.  

  1. **Leaf: Deontic Constraints**  
     - Central commitment: Infers inviolable rules or taboos (e.g., "knives must be hand-washed").  
     - Awkward commitment: Cannot trade off rules against scalar objectives (e.g., efficiency).  
     - Disconfirming data: User violates a "rule" under minor pressure (e.g., lets robot wash knives when rushed).  

  2. **Leaf: Joint Reward and Beliefs**  
     - Central commitment: Infers a single reward function jointly with the user's (possibly wrong) world beliefs.  
     - Awkward commitment: Assumes beliefs are the *only* source of suboptimality (ignores noise or norms).  
     - Disconfirming data: User behaves optimally in states where beliefs are known to be wrong.  

  3. **Leaf: Social Role/Norm**  
     - Central commitment: Infers norm-governed practices or roles (e.g., "hosting duties with guests"), not personal preferences.  
     - Awkward commitment: Cannot capture individual deviations from norms (e.g., if user hates hosting).  
     - Disconfirming data: User behaves identically across social contexts (e.g., no change with guests).  

  4. **Leaf: Set of Rewards**  
     - Central commitment: Infers a set of reward functions consistent with behavior (rational choice set).  
     - Awkward commitment: Set may be too broad for practical decisions (e.g., robot cannot act without disambiguation).  
     - Disconfirming data: User's behavior is strictly ordered (e.g., always chooses one method over another).  

  5. **Leaf: Single Reward, Soft-Noise**  
     - Central commitment: Infers a single reward function under a soft-optimality noise model (e.g., Boltzmann rationality).  
     - Awkward commitment: Attributes *all* inconsistency to random noise (may miss structure like rules).  
     - Disconfirming data: Suboptimal behavior is systematic and predictable (e.g., always avoids a specific action).  

  6. **Leaf: Cooperating Agents**  
     - Central commitment: Treats user and robot as partners; robot infers by helping user reveal preferences.  
     - Awkward commitment: Assumes user can articulate preferences when queried (may not hold).  
     - Disconfirming data: User reacts negatively to queries or cannot answer them meaningfully.  

  7. **Leaf: Active Queries**  
     - Central commitment: Rejects passive inference; resolves ambiguities solely through cheap questions.  
     - Awkward commitment: Ignores observable patterns (e.g., habits) that could reduce query burden.  
     - Disconfirming data: User's behavior is highly consistent across similar states.  

  8. **Leaf: Policy Direct**  
     - Central commitment: Learns a policy (state-action mapping) directly, with no reward inference.  
     - Awkward commitment: Cannot generalize to new states (e.g., rearranged kitchen).  
     - Disconfirming data: User changes policy abruptly in unchanged states.  

  9. **Leaf: Aspiration Level**  
     - Central commitment: Infers a satisficing threshold (e.g., "clean enough to stop").  
     - Awkward commitment: Struggles to explain optimization in high-stakes scenarios (e.g., for guests).  
     - Disconfirming data: User always optimizes (e.g., seeks best possible outcome).  

  10. **Leaf: Single Reward, Soft-Noise** (repeated)  
      - Same as Leaf 5. Appears twice due to tree structure (reached from different paths).  

  **Inseparable Leaves and Measurement**  
  - **Single Reward, Soft-Noise (Leaf 5/10) and Aspiration Level (Leaf 9)** cannot be separated by the provided observations. Both explain inconsistent behavior (e.g., abandoning tasks) as either noise or satisficing. Observation h (abandons tasks) is ambiguous; low priority (noise) and satisficing (aspiration) are observationally equivalent.  
    - **Separating measurement**: Introduce a task with adjustable quality (e.g., cleaning with varying effort). If user consistently stops at a fixed quality level, supports aspiration; if stopping is unpredictable, supports noise.  

  - **Set of Rewards (Leaf 4) and Cooperating Agents (Leaf 6)** are separable by Observation c (two competent methods). Indifference (set) vs. unobserved context (cooperation) are distinct branches at Node 6.  

  **Routing Stylized Users Through the Tree**  
  Paths are determined by answering node questions for each user.  

  1. **Meticulous Maximizer** (optimal, no noise, seeks best outcome):  
     - Node 1: No conflict (never complains without reason) → Node 3.  
     - Node 3: Habit? No (updates to new layouts) → Node 5.  
     - Node 5: Conflict? No (behavior aligns with stated desires) → Node 6.  
     - Node 6: Patternless variation? No (always chooses best method) → Node 8.  
     - Node 8: Abandons tasks? No (only if low priority) → **Leaf: Single Reward, Soft-Noise**.  
     - *Note: Lands in soft-noise leaf, but tree is blind to deterministic optimization. Requires a "no noise" leaf, which is unattractive (rarely assumed) and not in your positions.*  

  2. **Rule-Follower** (obeys strict constraints, e.g., religious/cultural rules):  
     - Node 1: Complaints? Yes (may gripe about rules) → Node 2.  
     - Node 2: Rule? Yes (e.g., knives are "sacred") → **Leaf: Deontic Constraints**.  

  3. **Muddler** (mostly habit, rarely re-optimizes):  
     - Node 1: Complaints? Sometimes, but not reliable → Node 3.  
     - Node 3: Habit? Yes (e.g., old-layout movements) → Node 5.  
     - Node 5: Conflict? Unlikely (habits override stated desires) → Node 6.  
     - Node 6: Patternless variation? Possible → **Leaf: Policy Direct** (if seen as habit) or **Set of Rewards** (if seen as indifference).  
     - *Note: Path depends on interpretation of variation. If muddler uses multiple methods (Observation c), could branch to Set of Rewards or Policy Direct. Tree captures this ambiguity.*  

  4. **Deferrer** (consults family for decisions, e.g., grandson):  
     - Node 1: Complaints? Possibly → Node 2.  
     - Node 2: Rule? No (deference isn't a "rule") → Node 4.  
     - Node 4: Context-dependent? Social norm (e.g., family hierarchy) → **Leaf: Social Role/Norm**.  
     - *Note: If deference is seen as a personal rule (Node 2), could land in Deontic Constraints. Tree distinguishes based on whether "deference" is normative (social) or personal (rule).*  

  **Shared Leaf Explanation**  
  - **Meticulous Maximizer and Muddler** can both land in **Single Reward, Soft-Noise** (if muddler's variation is interpreted as noise). The tree is blind to the *source* of suboptimality: true randomness (maximizer with noise) vs. habit (muddler). Separating them requires testing generalization: change the environment (e.g., rearrange kitchen). Maximizer re-optimizes quickly; muddler does not.
