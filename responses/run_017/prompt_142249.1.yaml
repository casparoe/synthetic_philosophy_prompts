prompt: |-
  I teach a graduate seminar on explanation in the special sciences, and for some years I have been circling a phenomenon I cannot find a name for. I would be grateful for help in deciding whether it is one phenomenon, two, or none.

  Set the scene as I do in the seminar. There are three grades of description under which one can predict a system. One predicts from its physical constitution and the laws. One predicts from what it was designed, built, or selected to do. One predicts by treating it as a creature with beliefs and desires that acts to get what it wants given what it believes. I take it as familiar that the third grade is the cheapest and the most committal on the fewest details, and that a pattern it licenses counts as real when it compresses the available data without residue; I do not need those points rehearsed, and I am not asking for a bibliography. What interests me is a specific way third-grade predictions fail, and the fact that the failure seems to have no analogue at the other two grades.

  Three cases, all of which I have used in class.

  First. Two people approach each other on a narrow pavement. Each predicts the other's step, each predicts that the other is predicting, and the mutual sidestep dithers until something breaks the symmetry: a glance, a lowered shoulder, a convention about which side to pass on. The third-grade prediction is unstable here in a way that no additional information about muscles, optic nerves, or upbringing would settle.

  Second. A chess program is described as wanting to win and as believing that castling early is safe. Against an opponent that does not model it, the ascription predicts beautifully and improves as you learn more about the program. Against a near-copy of itself, the ascription comes apart, and moving to a second order — it believes that I believe that it believes — sometimes restores the prediction and sometimes makes it strictly worse.

  Third. A desk at a trading firm ascribes to a rival's algorithm the goal of detecting and front-running large orders. On historical data against passive order flow the ascription is excellent. In the month after the rival begins modelling our own algorithm it is worthless, and its failure is not noise: it fails in a structured direction, and the bad predictions cluster.

  What I want identified. In each case the breakdown is not traceable to ignorance of the target's constitution or its design, and supplying such information does not repair it; it is traceable to the target's standing in a relation of mutual modelling with something, and it persists even when the target has no idea that I exist. But the phenomenon has a second face I cannot place. Populations in which everyone uses third-grade descriptions of everyone else often settle into patterns that are extremely stable and are stable *because* everyone is using them: a queue, a bidding convention, a price, a norm of deference. I cannot tell whether that stability is the same phenomenon with the sign reversed or a different one that merely looks similar.

  Things I have tried and set aside. Self-fulfilling prophecy: in my cases the pattern is more often destroyed than produced by being known about. The thesis that social-scientific regularities are destabilised when policy relies on them: that is a claim about populations and equilibria and about the world changing in response to a rule, whereas mine is about an ascription losing its grip on a single target. Underdetermination of interpretation by evidence: my cases are not ones where the evidence runs out, since the predictions are determinately good or determinately bad.

  So my questions, in the order I would want them answered.

  1. Is there an established concept for the distinctive fragility of third-grade prediction under mutual modelling, and if not, is the best move to coin one? Either way I want a definition with boundary cases, not a label.

  2. Is the fragility I have described one thing or several? In particular: is the instability that appears in the pavement case and the self-play case the same as the instability that appears when the rival algorithm updates, or is one a matter of non-convergent regress and the other a matter of the target changing?

  3. Does the marker really fall where I have put it? I have been assuming this is specific to the third grade, since the function of a heart does not depend on who is observing it. But the function of a system built to track another tracker does seem to depend on that, which suggests the real divider is not the grade of description but whether the content ascribed is about another model. If so my whole framing is wrong and I would like to be told so, with the corrected cut.

  4. Does any of this bear on whether the pattern is real? The predictability of these systems evidently depends on the epistemic and social embedding of the predictor in a way that the lower grades do not, and I can see three possible readings — that the pattern is therefore less than real, that reality for patterns was always relative to a stance and this is just a vivid case, and that the dependence is itself a real feature of the system that the lower grades cannot express. I want to know which is closest, and what would count as evidence against each.

  5. Finally, the second face. What kind of case would decide whether convention-sustained stability is the same phenomenon as the instability, and is there any formal result — a fixed-point theorem, a convergence result, an impossibility result — that settles whether the second-order regress in cases like the second one bottoms out? I would rather be told that no such result exists than be given a gesture at one.
reasoning: |-
  Okay, let me start by unpacking the user's query. They teach a graduate seminar on explanation in the special sciences and have encountered a phenomenon they can't name. The core issue is the fragility of third-grade predictions (intentional stance) under mutual modeling, compared to physical or design stances.

  First, I need to understand their three cases: sidewalk coordination, chess algorithms, and trading algorithms. Each shows third-grade predictions breaking down when there's mutual modeling. The user also mentions stable conventions like queues or prices, where mutual modeling leads to stability. They're unsure if this stability is the inverse of the fragility or a different phenomenon.

  The user has already dismissed concepts like self-fulfilling prophecies or underdetermination. Their questions focus on naming the phenomenon, determining if it's one or multiple issues, whether the division between stances is correct, implications for the reality of patterns, and the relationship between fragility and stability.

  For question 1, the fragility needs a name. Reflexive prediction breakdown comes to mind, emphasizing the mutual modeling aspect. But I should check if terms like Looping Effects or Hyperprojection fit. Ian Hacking's work might be relevant here, but the user wants a precise definition. 

  Question 2 asks if the fragility is unified. The sidewalk and chess cases involve real-time mutual adjustment (dynamic looping), while the trading algorithm updates its model (adaptive looping). Both involve feedback loops, but the mechanisms differ. So it's one phenomenon with two subtypes.

  Question 3 challenges the stance division. The user wonders if the key is whether the ascribed content includes modeling others. The design stance can have similar issues if the function involves tracking other entities, like in predator-prey systems. The corrected cut is between model-involving content and non-model-involving, regardless of stance.

  For question 4, the reality of patterns. The dependence on the predictor's stance doesn't make patterns less real. Instead, it's a relational property. The lower grades can't capture this interactivity, which is a real feature. Evidence against this would be if stability arises without mutual modeling or if physical systems show similar dependencies.

  Question 5 links fragility and stability. The user wants to know if conventions are the inverse phenomenon. A case where mutual modeling leads to fragility in a typically stable context (like a market panic) would show they're two sides of the same coin. Fixed-point theorems (Nash equilibrium) support stability in games, but regress in self-play may not converge, as in recursive simulation halting problems.

  I should ensure definitions are clear, address each part systematically, and offer concrete examples. The user values precision over citations, so avoid jargon. Also, check if coining new terms is necessary. Reflexive Prediction Fragility seems apt, with subtypes for dynamic and adaptive looping. The stance correction is crucial—model-involving ascriptions are key, not just the intentional stance. Stability in conventions is the same phenomenon because both involve mutual modeling feedback loops, just with different equilibria outcomes.
answer: |-
  Based on your precise description and the core questions, here's a systematic analysis:

  **1. Naming the Fragility:**
  *   **Established Concept?** While aspects touch on "Loops" (Hacking), "Reflexivity" (Soros), or "Hyperprojection," no *single* established term fully captures the *distinctive fragility of third-grade prediction under mutual modeling* as you define it.
  *   **Proposed Coinage & Definition:** **Reflexive Prediction Fragility (RPF)**.
      *   **Definition:** *The phenomenon whereby the predictive accuracy of an intentional-state ascription (belief/desire) to a system S, made by a modeler M, systematically degrades or becomes unstable specifically due to the existence of a feedback loop created by mutual or recursive modeling between S and another entity O (which could be M itself, a counterpart of S, or another modeler), where O's behavior is influenced by modeling S (or entities like S), and S's behavior is influenced by modeling O (or entities like O).*
      *   **Boundary Cases:**
          *   *Included:* Your three cases (sidewalk, chess self-play, trading rivals). Also: Arms races, prediction markets where participants model each other, traffic flow breakdowns when drivers model "aggressiveness."
          *   *Excluded:*
              *   Prediction failure due purely to ignorance of S's internal structure/design (e.g., mispredicting a chess bot because you didn't know its evaluation function).
              *   Prediction failure due to S undergoing a random or externally forced change unrelated to modeling others (e.g., chess bot hardware fails).
              *   Stable conventions *without* active mutual modeling (e.g., instinctive flocking behavior). Stable conventions *sustained* by mutual modeling *are* the inverse phenomenon (see Q5).
              *   Second-grade (design/function) prediction failure where the function *doesn't* involve modeling others (e.g., mispredicting a heart's output due to ignorance of valve mechanics).

  **2. Unity of the Fragility:**
  It is **one core phenomenon** (RPF) with **two distinct mechanisms**:
  *   **Dynamic Looping Fragility (Sidewalk, Chess Self-Play):** Instability arises from *real-time*, iterated mutual adjustment based on mutual modeling. The predictions fail to converge or oscillate wildly *during* the interaction because each agent's action depends on their prediction of the other's action, which depends on their prediction of the first's prediction, and so on. More information doesn't settle it because the loop itself generates the instability.
  *   **Adaptive Looping Fragility (Trading Algorithm):** Instability arises because the *target system S itself changes its internal model or behavior* in response to being modeled by O (the rival algorithm). The ascription breaks not (just) during interaction, but because the underlying system being modeled has *adapted* to the modeling environment, rendering the original ascription obsolete. The "structured direction" of failure reflects S's new strategy to counter O's modeling.
  *   **Why One Phenomenon?** Both mechanisms fundamentally depend on the **feedback loop created by mutual/recursive modeling** interfering with the validity of the third-grade ascription. The core is the *interactivity* and the *dependence of the target's relevant properties* on the modeling relation itself.

  **3. Correcting the Cut (Grade vs. Content):**
  **Your framing needs adjustment.** The crucial divider is **not the "grade" of description per se, but whether the ascribed content (or the system's function) inherently involves modeling other modelers.** This cuts across grades:
  *   **Third-Grade (Intentional):** Ascribing beliefs/desires *about* the beliefs/desires/actions of other modelers (e.g., "wants to exploit *your* strategy," "believes *you* will castle") is inherently vulnerable to RPF.
  *   **Second-Grade (Design/Function):** If the ascribed function *involves* modeling other modelers (e.g., "designed to detect and counter front-running algorithms," "evolved to anticipate predator avoidance tactics"), predictions based on *this specific functional description* become vulnerable to RPF. A heart's function (pump blood) is not model-involving. A missile defense system's function (intercept incoming threats) *becomes* model-involving if the "threat" is another system designed to evade interception.
  *   **First-Grade (Physical):** Physical predictions are generally immune because they don't rely on ascribed content susceptible to modeling loops (barring quantum entanglement/observation issues, which are distinct).
  *   **The Corrected Cut:** The vulnerability to RPF arises for **model-involving ascriptions** (MIAs), regardless of whether they are framed intentionally (beliefs about others' models) or functionally (purposes defined relative to others' modeled behavior). The "third grade" is most *prone* to MIAs, but not exclusively so. Your insight about the rival tracker is correct.

  **4. Reality of the Pattern:**
  The **third reading is closest:** The dependence of predictability on the epistemic/social embedding is *itself a real, objective feature* of systems involving MIAs, which the lower grades cannot express. This interactivity *is* part of the system's structure when MIAs are valid.
  *   **Evidence For:** The structured, non-random failure in your cases (e.g., trading algorithm failures clustering directionally). The demonstrable causal role of the modeling loop in generating both instability *and* stability (Q5).
  *   **Evidence Against "Less Real":** If the pattern *always* disappeared under closer physical scrutiny *without* the modeling loop being the cause. If stable conventions (like prices) couldn't be shown to causally depend on mutual expectations. Your cases show the patterns *are* real when the loop is absent or broken.
  *   **Evidence Against "Always Relative":** If there were *no* objective facts about *when* and *why* the prediction breaks down. Your cases show the breakdown is objectively tied to the specific condition of mutual modeling. The stance dependence is about *accessing* the pattern, not the pattern's reality *given* the interactive context.
  *   **Key Point:** The pattern's *predictability* is stance/context-dependent, but its *existence and causal structure* within that context are objective features captured (only) by the MIA.

  **5. Stability vs. Fragility and Formal Results:**
  *   **Same Phenomenon (RPF), Different Equilibrium:** Convention-sustained stability **is the inverse manifestation of RPF.** RPF describes how MIAs *can* lead to instability (non-convergence, oscillation, adaptive breakdown). Stability arises when the mutual modeling loop finds a **fixed point** or **attractor** (a Nash Equilibrium, Schelling Point, Correlated Equilibrium). Both arise from the same feedback loop:
      *   *Fragility:* The loop prevents convergence or causes adaptation that breaks the model.
      *   *Stability:* The loop reinforces and sustains a specific behavioral pattern (everyone acts as they do *because* they expect others to act that way, and those expectations are confirmed). A queue is stable precisely *because* everyone models everyone else expecting queueing behavior.
      *   **Deciding Case:** Consider a normally stable bidding convention. Introduce a small group who *correctly* model that others are starting to doubt the convention's stability. If their actions (based on this correct MIA) trigger a cascade of similar modeling and action, leading to the convention's collapse, this demonstrates fragility (Adaptive Looping) emerging *from* the same mutual modeling that sustained stability. The shift from stability to fragility hinges on the content of the MIAs within the loop.
  *   **Formal Results on Regress:**
      *   **Bottoming Out?** There is **no general guarantee the regress bottoms out.** Results are mixed:
          *   *Fixed Points Exist (Stability):* Nash's Existence Theorem proves mixed-strategy equilibria exist for finite games, showing fixed points *can* exist for the mutual modeling regress in strategic interactions. Correlated equilibrium extends this. This underpins the *possibility* of stability.
          *   *Non-Convergence (Fragility):* Results in evolutionary game theory (cycles in Rock-Paper-Scissors), computational complexity (finding equilibria can be PPAD-hard), and recursive simulation (halting problems in systems that simulate each other) show the regress *can* fail to converge or be computationally intractable. The chess self-play case illustrates this potential non-convergence or oscillation.
          *   **Conclusion:** Formal results confirm that RPF loops *can* stabilize (fixed points exist) but also *can* be unstable (no convergence, cycles, adaptation). There is no universal result stating the regress always bottoms out cleanly. The outcome depends on the specific structure of the interaction, the agents' models, and their updating rules.

  **Summary Answers:**

  1.  **Reflexive Prediction Fragility (RPF)** is the proposed coinage. Definition provided.
  2.  **One phenomenon (RPF)** with **two mechanisms:** Dynamic Looping Fragility (real-time non-convergence) and Adaptive Looping Fragility (target adaptation).
  3.  **The marker is misplaced.** Vulnerability stems from **Model-Involving Ascriptions (MIAs)**, not the intentional stance per se. MIAs can occur in functional ascriptions too.
  4.  **The dependence is a real feature.** The interactivity captured by MIAs is an objective property that lower grades cannot express. Evidence involves the structured nature of the breakdown and the causal role of the loop.
  5.  **Convention stability is the inverse of RPF fragility**, both arising from the same mutual modeling loop. A convention collapsing due to correct modeling of incipient doubt would demonstrate this. **No universal result** guarantees the regress bottoms out; fixed points exist but so do non-convergence results.
