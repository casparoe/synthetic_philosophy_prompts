answer: |-
  Your inquiry cuts to the philosophical and practical foundations of competition law. Let's reconstruct the implicit theory, test its coherence, and explore alternatives.

  ### I. The Implicit Theory of "Agreement" in Competition Law
  The doctrine presupposes a **will-based theory of agreement** rooted in:
  1. **Shared Intention** (Bratman/Searle): An agreement requires a *meeting of minds* – mutual recognition of a joint commitment to coordinate conduct.
  2. **Illocutionary Act** (Austin): The communication must have *performative force* (e.g., an offer/acceptance structure) creating mutual obligations.
  3. **Normative Power** (Raz): Parties exercise power to bind themselves reciprocally through communicative acts.
  4. **Control Transfer**: Each party partially cedes autonomy by making their action *contingent on the other's expressed commitment*.

  **What this theory strictly presupposes:**
  - Conscious human agency in forming intentions
  - Communication as the mechanism for aligning wills
  - Distinction between *reacting to observed behavior* vs. *acting on shared understanding*

  **Where it fits comfortably but isn't required:**
  - **Proof/administrability concerns**: Written communications provide clear evidence, but the theory would condemn unrecorded verbal agreements.
  - **Conduct-chilling avoidance**: The "meeting competition" defense protects reactive price-matching, but the theory would condemn it if proven contingent on prior communication.
  - **Moral luck about medium**: The theory inherently privileges human communication over algorithmic interdependence, creating the medium-based distinction you note.

  ### II. Undetermination in Doctrine
  The same legal outcomes could flow from three distinct theories:
  | **Theory**             | **Why It Fits Current Doctrine**                     | **Where It Diverges**                          |
  |------------------------|------------------------------------------------------|------------------------------------------------|
  | **Will-Based**         | Explains criminalization of "smoke-filled room" deals | Struggles with algorithmic collusion           |
  | **Administrative Proxy** | Justifies focusing on provable communications         | Would allow tacit collusion if provable        |
  | **Consumer Welfare**   | Explains exemption for price-matching guarantees     | Would condemn algorithm-facilitated collusion  |

  The boundary cases (e.g., machine-readable pricing rules) are underdetermined – all three theories could be stretched to either condemn or permit them.

  ### III. Testing the Revocability Defense Against Program Equilibrium
  A revocability-based distinction ("unilateral if revisable at will") fails because:
  1. **Temporal mismatch**: Program equilibrium requires policies to be fixed *during interaction*. Revocability afterward is irrelevant to the cooperative outcome *in the moment*.
  2. **Strategic equivalence**: A firm can pre-commit to an algorithm just as irrevocably as to a contractual agreement. Revocability is often illusory (e.g., changing pricing algorithms incurs reputational/operational costs).
  3. **Legal irrelevance**: Courts don't inquire whether defendants reserved rights to change policies later (e.g., *Interstate Circuit*'s "invitation" was actionable despite theoretical revocability).

  *Example*: Two firms deploy "cooperate if opponent's code is identical" algorithms. The programs are "revocable" in theory, but their interaction produces stable collusion – indistinguishable in effect from an agreement.

  ### IV. Structural Coordination Theory: Enforcement & Incentives
  If illegality turned on **interlocked decision procedures** regardless of intent:
  - **Enforcement mechanics**:
    - Regulators would audit algorithms for cross-referential design
    - "Collusion audits" would require firms to disclose pricing algorithms
    - Liability if: `firm_A.action = f(firm_B.policy)` AND `firm_B.action = g(firm_A.policy)` creating Nash equilibrium
  - **Incentives created**:
    - **Illegibility defense**: Firms would:
      - Obfuscate code (e.g., black-box ML models)
      - Avoid machine-readable policies
      - Add noise to pricing signals
    - **Stifling innovation**: Firms might avoid automated pricing entirely
    - **False positives**: Punish coincidental alignment (e.g., both using competitive ML that converges on similar prices)

  **Comparison to current system**:
  | **Incentive**          | **Current System**       | **Structural Theory**       |
  |------------------------|--------------------------|------------------------------|
  | Avoid communication    | Strong (criminal risk)   | None                         |
  | Avoid transparency     | Weak                     | Strong (obfuscate algorithms)|
  | Avoid efficient pricing| None                     | Moderate (risk aversion)     |

  The structural theory replaces an "incentive not to talk" with an "incentive not to be legible." This may be worse:
  - **Obfuscation harms consumers**: Less price transparency
  - **Higher error costs**: Harder to distinguish collusion from competition
  - **Enforcement costs**: Requires tech-savvy regulators and intrusive monitoring

  ### V. Resolving the Tension
  The law's persistence with will-based theories reflects deeper commitments:
  1. **Moral agency**: Punishment requires culpable mental states
  2. **Libertarian presumption**: Autonomous firms should adapt to market signals unless they *choose* collusion
  3. **Epistemic humility**: Regulators shouldn't second-guess convergent market outcomes without evidence of conspiracy

  Yet program equilibrium shows this view is **conceptually unstable**: identical outcomes emerge from both blameworthy agreements and blameless algorithm design. The doctrine's survival may depend on:
  - **Practical irrelevance**: Algorithmic collusion remains rare compared to explicit agreements
  - **Institutional limits**: Courts distrust abandoning intent requirements
  - **Normative anchor**: We punish *wrongdoing*, not welfare-reducing outcomes per se

  A defensible path forward might treat *deliberate algorithmic interdependence* (e.g., shared pricing APIs) as agreement by conduct, while permitting autonomous price-matching. But the core tension – between moral agency and structural harm – remains philosophically unresolved.
