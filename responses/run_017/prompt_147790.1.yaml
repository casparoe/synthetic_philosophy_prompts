prompt: |-
  Hey — I'm a backend dev with zero formal philosophy (my total training is some YouTube and one very confusing SEP tab), and I'm helping our trust & safety folks rewrite the docs behind our term blocklist. Right now slurs are handled as a static list of bad strings, which obvously falls apart: the same token shows up in a reclaimed song lyric, in a history lesson, inside a quoted threat in a news article, and — my favourite — in text our own model generated in a synthetic conversation with no human speaker and no human reader. So I want a decision tree instead of a list.

  What I need: a tree that takes someone from "there's a slur-ish token in this piece of text" down to a named position on where the badness actually lives. Rules:

  - 7–9 branch questions. Every node is a concrete mini-case plus a 2–3 option question, phrased so a moderator who's never heard of semantics or pragmatics can answer it. No node may name a theory or a philosopher, and no node may just ask "is it offensive?".
  - 8–10 leaves. Each leaf gets a plain-language label, the academic name if you're confident one exists (skip it if you're not), and one sentence — 40 words max — on that position's most awkward commitment. Please don't give me papers, citations or a reading list: I can't check them and I have no journal access.
  - These three cases have to appear on the tree and actually change where you land: (1) the model-generated slur, with no human attitudes on either end; (2) a reclaimed term where most current users have never heard the original slur meaning; (3) a slur aimed at a socially dominant group.
  - One node should be about who is complaining. Our product knows the reporter's group membership, and I want the tree to show the point at which that fact is load-bearing versus the points where it's a red herring.
  - Flag any two leaves your tree can't actually seperate.
  - Then list 2–3 answer combinations your tree allows that nobody really seems to hold, with one line each on whether they're incoherent, just unattractive, or merely unexplored.

  Explain any jargon (truth-conditional, projects out of negation, at-issue vs. not-at-issue) in a few words the first time you use it. Whole thing under 700 words.
reasoning: |-
  Hmm, the user is a backend developer working on trust and safety for a content moderation system. They're frustrated with the current static blocklist for slurs because it's too simplistic—it flags words regardless of context, like in song lyrics, history lessons, or even AI-generated content. They want a decision tree that helps moderators determine where the offensiveness actually lies without relying on vague questions like "is it offensive?"

  The user provided specific requirements: 7-9 branch questions, 8-10 leaves, no theory or philosopher names, and plain language for moderators. Three cases must be handled: model-generated slurs with no human involvement, reclaimed terms where the original meaning is forgotten, and slurs against dominant groups. Also, include a node about the reporter's group membership to see when it matters. Plus, flag any inseparable leaves and point out unattested positions.

  First, I need to structure the tree. Start with the presence of a slur-ish token and move through context checks. Key nodes should cover: source of the text (human or AI?), intent to harm, reclamation status, target group (dominant or not?), and reporter's identity. For the reporter node, it should only matter in specific contexts like reclamation disputes, otherwise it's irrelevant.

  Handling the three cases: 
  - Model-generated slur: The AI has no intent, so it should land on "System Artifact" leaf. 
  - Reclaimed term with forgotten meaning: If the word is now primary (like "queer"), it goes to "Reclaimed (Lexicalized)" leaf. 
  - Slur against dominant group: Since dominant groups aren't oppressed, the harm is different, leading to "Target Mismatch" leaf.

  Leaves need clear labels, academic names if possible, and awkward commitments. For example, "Literal Harm" might be linked to truth-conditional semantics, meaning the word's harm is part of its literal meaning. The awkward part is explaining why reclaimed uses aren't harmful.

  Inseparable leaves: "Reclaimed (Contextual)" and "Literal Harm" might be tricky. If a reclaimed word is used offensively, the tree might not perfectly distinguish if the harm comes from the word itself or the context. Also, "Negated Harm" and "Literal Harm" could overlap if negation doesn't remove offensiveness, but that's a known debate.

  Unattested positions: 
  - Believing AI can be morally responsible for slurs when it's just a tool. That's incoherent because responsibility requires intent. 
  - Thinking slurs against dominant groups are as harmful as against marginalized ones. This is unattractive because it ignores power dynamics. 
  - Claiming reclaimed terms are always harmful regardless of context. This is unexplored but unlikely since reclamation exists.

  I should ensure each question is concrete. Avoid jargon. For example, "at-issue" vs "not-at-issue" can be simplified to whether the offensiveness is part of the main message or a side effect. Use examples moderators understand, like quoted threats vs historical discussions.

  Finally, keep it under 700 words. Check word count. Make sure the tree flows logically and covers all required cases. Highlight where reporter info is crucial versus irrelevant. Flag the inseparabilities and unattested positions clearly.
answer: |-
  Here's a decision tree for slur context assessment, designed for non-experts:

  **Decision Tree (8 Nodes, 9 Leaves)**

  1.  **Node 1 (Source):** Who/what produced the *exact string containing the token*?
      *   **A.** A non-sentient system (e.g., AI model, code output) --> Go to 2
      *   **B.** A human author/creator --> Go to 3

  2.  **Node 2 (Intent Origin):** Does the system output *reflect a known human intent* to use the token offensively? (Look at system inputs/training prompts/docs - *not* the output alone)
      *   **A.** Yes, human input clearly aimed for offensive use --> Go to 3
      *   **B.** No, output is random, erroneous, or reflects neutral training data --> **Leaf: System Artifact** (Awkward: Must accept system outputs lack inherent moral blame, even when disturbing.)

  3.  **Node 3 (Author Intent):** Is the author *using the token with the apparent primary goal* of insulting, threatening, or expressing contempt for a person/group?
      *   **A.** Yes --> Go to 4
      *   **B.** No --> Go to 5

  4.  **Node 4 (Target Status):** Is the target group *historically/systematically oppressed* in the relevant context?
      *   **A.** Yes --> **Leaf: Hate Speech** (Awkward: Must explain why identical words targeting dominant groups aren't equivalent harm.)
      *   **B.** No --> **Leaf: Target Mismatch** (Awkward: Insults exist, but denying they carry the same oppressive weight as slurs.)

  5.  **Node 5 (Token Status):** Is the token *primarily used today* as a neutral or positive identifier by the group it historically targeted? (e.g., "queer" in LGBTQ+ contexts)
      *   **A.** Yes, widely reclaimed --> Go to 6
      *   **B.** No, still dominantly a slur --> Go to 7

  6.  **Node 6 (Reclamation Context):** Is the author *a member of the reclaiming group* using it in an *in-group/empowering* context?
      *   **A.** Yes --> **Leaf: Reclaimed (Lexicalized)** (Awkward: Original harm vanishes despite historical knowledge; word meaning changes entirely.)
      *   **B.** No --> **Leaf: Reclaimed (Contextual)** (Awkward: Harm depends entirely on speaker identity/context, not just the word.)

  7.  **Node 7 (Embedding):** Is the token *not being asserted as true by the author*? (e.g., quoted speech "He called me X", hypothetical "What if someone said X?", negated "I didn't say X")
      *   **A.** Yes, it's quoted, hypothetical, negated, etc. --> Go to 8
      *   **B.** No, it's presented as the author's own assertion --> **Leaf: Literal Harm** (Truth-conditional: Harm is part of the word's core meaning. Awkward: Reclaimed or quoted uses shouldn't be harmful, but the theory says they inherently are.)

  8.  **Node 8 (Complaint Source - Use Sparingly!):** Did the report *originate from a member of the group historically targeted* by this token?
      *   **A.** Yes --> **Leaf: Negated Harm (Report Sensitive)** (Projects out of negation: Harm persists even in quotes/denials. Awkward: Prioritizes group sensitivity over authorial non-endorsement in all cases.)
      *   **B.** No --> **Leaf: Negated Harm (Report Insensitive)** (At-issue vs. Not-at-issue: Offense is a side-effect, not the main message. Awkward: Outsiders dismiss harm insiders feel from quoted/negated slurs.)

  **Inseparable Leaves:**
  *   **Reclaimed (Contextual) & Literal Harm:** If a reclaimed word is used *offensively* by an out-group member, is the harm from the *word itself* (Literal Harm) or the *misuse of the reclaimed term* (Reclaimed Contextual)? The tree struggles here.
  *   **Negated Harm (Report Sensitive) & Literal Harm:** If harm persists in negation/quotes (Report Sensitive), it aligns closely with Literal Harm's core claim.

  **Unattested/Unattractive Positions:**
  1.  **`System Artifact` + `Hate Speech`:** Believing AI output *itself* can be morally blameworthy *hate speech* (not just reflecting human intent). **Unattractive:** Assigns moral agency to tools.
  2.  **`Target Mismatch` + `Literal Harm`:** Claiming slurs against dominant groups cause *identical* systemic harm as those against marginalized groups. **Incoherent:** Ignores power dynamics fundamental to harm.
  3.  **`Reclaimed (Lexicalized)` + `Negated Harm (Report Sensitive)`:** Believing a fully reclaimed term (e.g., "queer") regains its original harmful force *instantly* when quoted/negated *only* if a target-group member reports it. **Unexplored/Unattractive:** Mixes reclamation theory with reporter-dependency inconsistently.
