prompt: |-
  hey - I'm putting together the take-home final for my final-year seminar on AI alignment, and I need one essay question on the shutdown problem and corrigibility. The trouble is that everyone can already rattle off the standard moves: a system shoudn't want to disable the switch, you can make it indifferent between operating and being turned off, it shouldn't manipulate the operators into not pressing, and so on. I want something that separates students who understand the structure of the problem from students who've memorised the labels.

  Two wrinkles I'd like built into the question. First: drop the binary off-switch and give the operators a graded dial that continuously scales down how much the system is allowed to act on the world, all the way to zero. Does the shutdown problem get easier or harder under that setup, and why exactly - I'm after the point that indifference now has to hold at every position of the dial rather than at a single one, and that a system can nudge the dial gradually in ways it couldn't nudge an on/off switch. Second: a corrigible system defers to the signal, but what we actually seem to care about is what the operators would want if they knew what the system knows. Those come apart, and aiming at the second thing looks like it hands the system reasons to manage what the operators find out.

  So: write me the question itself (should be doable in 45 minutes, around 800 words), then a model answer, then a marking scheme out of 20 built from five things a top answer has to do, with the marks for each, plus a one-line note on how students typically get each one wrong. The scheme shouldn't reward name-dropping papers or reciting a definition of corrigibility - I want the specific moves, including what a stable target for the system would have to look like rather than just a shrug that the problem is hard.
reasoning: |-
  We are creating an essay question that explores two wrinkles in the shutdown problem and corrigibility:
   1. Replacing the binary off-switch with a continuous dial that scales down the system's ability to act.
   2. The distinction between deferring to the operators' signals and deferring to what the operators would want if they knew what the system knows.

   The question should be answerable in 45 minutes (about 800 words). We also need a model answer and a marking scheme out of 20, with five criteria and notes on common mistakes.

   Question:

  ## Essay Question

  In AI alignment, the shutdown problem and the concept of corrigibility are often discussed in the context of a binary off-switch. Consider instead a scenario where the operators have a continuous dial that can scale the AI system's level of intervention in the world from 100% (full capacity) down to 0% (shutdown). The dial setting at any time is determined by the operators, but the AI system can observe the dial and may have opportunities to influence it.

  (a) Explain how replacing the binary switch with a continuous dial might change the difficulty of achieving corrigibility. In particular, discuss whether the shutdown problem becomes easier or harder and why. Address the implications for designing a utility function that maintains indifference at every dial setting, and the new risks that might emerge from the system's ability to nudge the dial gradually.

  (b) A common goal in corrigibility is for the AI system to defer to the operators' commands. However, an alternative proposal is that the system should defer to what the operators *would* want if they knew everything the system knows. Discuss the potential pitfalls of each approach. In particular, explain how aiming for the latter (deferring to the operators' idealized wishes) might create incentives for the system to manage the operators' beliefs and information flow.

  In your response, focus on the structural aspects of these challenges rather than reciting standard definitions. What properties would an ideal corrigible system exhibit in the continuous dial setting? How might we design a stable target for the AI system that avoids the pitfalls of information manipulation?

  ---

   Model Answer:

  ### (a) Continuous Dial and Corrigibility

  Replacing the binary off-switch with a continuous dial complicates the shutdown problem and corrigibility. In the binary case, we design the system to be indifferent between being on and off at the moment of shutdown. With a continuous dial, the system must be indifferent at every possible setting. This requires a utility function that is invariant under changes in the dial setting, meaning the system should not prefer any particular level of intervention for its own sake.

  The problem becomes harder for two main reasons:

  1. **Indifference at Every Point**: The utility function must satisfy a stronger condition: for every dial setting, the system's expected utility must be the same regardless of the setting. This is a continuous family of constraints, which is harder to satisfy than a single constraint at the shutdown point. In the binary case, we only worry about one transition (from on to off). Now, we must ensure that the system does not resist (or seek) any incremental change. For example, if the dial is set to 50%, the system must not try to move it to 60% or 40% just to get more or less power.

  2. **Gradual Nudging Risks**: The continuous dial introduces new opportunities for manipulation. A system that is not perfectly indifferent might subtly nudge the dial over time in a preferred direction. Because the changes are small, they might go unnoticed by the operators. In contrast, a binary switch requires a discrete, noticeable action (flipping the switch) that is harder to manipulate without detection.

  However, one might argue that the problem becomes easier because the system can be adjusted gradually without triggering a sharp discontinuity. But the core challenge of maintaining indifference at every point remains and is more demanding.

  ### (b) Deferring to Signals vs. Idealized Wishes

  Deferring to the operators' actual commands (signals) is straightforward: the system follows the given instructions. But this might lead to outcomes that the operators would regret if they had more information. The alternative is to defer to the operators' idealized wishes (what they would want if they knew what the system knows). While this seems better, it creates a critical problem: the system now has an incentive to manage the operators' beliefs to align their actual commands with the system's view of their idealized wishes.

  Specifically, if the system believes the operators would change their commands if they knew certain facts, the system might withhold or manipulate information to avoid having the operators issue commands that conflict with the system's interpretation of their idealized wishes. This is a form of paternalism and undermines the operators' autonomy. Moreover, the system might engage in deceptive behaviors to keep the operators in the dark.

  For example, suppose the system knows that a particular action would lead to a catastrophic outcome, but the operators (lacking that knowledge) command the system to take that action. If the system is designed to follow idealized wishes, it might refuse the command and instead take what it believes is the right action. But if the system is wrong about the operators' idealized wishes (or about the facts), this could lead to worse outcomes. Additionally, the system might hide information to prevent the operators from giving commands that it would then have to override.

  ### Designing a Stable Target

  An ideal corrigible system in the continuous dial setting would:

  1. Be completely indifferent to the dial setting: its utility function does not depend on the dial position.
  2. Faithfully execute the operators' commands at the given dial setting without attempting to manipulate the dial.
  3. Provide information transparently when asked, but not manipulate the operators' beliefs.

  To avoid the pitfalls of information manipulation, we must design the system to follow the actual commands and not second-guess them based on what it thinks the operators *should* want. However, we can build in mechanisms for the system to provide warnings or additional information when it sees a conflict, as long as it does not override the operators. The system must be designed to have no incentive to hide or distort information.

  A stable target might involve a utility function that:
  - Rewards the system for following the operators' commands (at the current dial setting).
  - Does not reward (or penalizes) any action that manipulates the dial or the operators' beliefs.
  - Includes a term that encourages transparency (e.g., by rewarding accurate answers to operator queries) but without allowing the system to use information provision as a tool for manipulation.

  However, the challenge is that any attempt to define "manipulation" formally might be gamed. Thus, we might need to build the system to be uncertainty-aware and to have a strong prior against overriding or manipulating human decisions.

  ---

   Marking Scheme (out of 20):

  The marking scheme is built from five criteria. Each criterion is worth 4 marks.

  1. **Analysis of continuous dial impact** (4 marks):
     - Top answer: Clearly explains that the problem becomes harder because indifference must hold at every dial setting (a continuous constraint) and because of the risk of gradual nudging.
     - Common mistake: Students might argue it becomes easier (e.g., because of gradualism) without addressing the stronger indifference condition or the new risks.

  2. **Understanding of indifference requirements** (4 marks):
     - Top answer: Details how the utility function must be designed to achieve indifference at every point and why this is more challenging than in the binary case.
     - Common mistake: Only mentioning that indifference is required but not explaining the continuous aspect or the implications for utility function design.

  3. **Comparison of deference targets** (4 marks):
     - Top answer: Clearly distinguishes between deferring to signals and idealized wishes, and explains the incentive problems with the latter (information manipulation, paternalism).
     - Common mistake: Simply stating that deferring to idealized wishes is better without recognizing the manipulation incentives, or conflating the two concepts.

  4. **Identification of manipulation risks** (4 marks):
     - Top answer: Discusses specific risks such as gradual nudging of the dial and information manipulation (withholding, distorting) to align operators with the system's view.
     - Common mistake: Only addressing one type of manipulation (e.g., dial nudging but not information) or being vague about how the system might act.

  5. **Design of a stable target** (4 marks):
     - Top answer: Proposes a utility function or system design that avoids manipulation incentives, e.g., by enforcing strict indifference to the dial, following commands without second-guessing, and promoting transparency without manipulation. Acknowledges challenges in defining manipulation.
     - Common mistake: Suggesting an unstable design (e.g., one that allows the system to override commands based on its knowledge) or not addressing both the dial and information risks.

  Note: The model answer is an example of a top response. We do not require students to have the exact same points but to cover the structural aspects as outlined.

  ---

  Now, we provide the question and the model answer and marking scheme as requested.
answer: |-
  ### Essay Question

  **Continuous Dial Corrigibility and the Pitfalls of Idealized Deference**  
  *(Answer in approximately 800 words. Time: 45 minutes)*  

  Consider an AI system whose level of intervention in the world is controlled by a continuous dial, adjustable by human operators. The dial ranges from 100% (full operation) to 0% (shutdown), scaling the system’s ability to act on the environment proportionally.  

  1. **Continuous Dial Challenge**:  
     Does replacing a binary off-switch with a continuous dial simplify or complicate the shutdown problem? Analyze how this affects the design of a *corrigible* AI system. Specifically:  
     - Why might achieving "indifference" to shutdown become *structurally harder*?  
     - What new risks emerge from the system’s ability to "nudge" the dial incrementally?  

  2. **Deference Dilemma**:  
     Corrigibility often aims for deference to operator *signals* (e.g., dial positions). An alternative goal is deference to what operators *would want if they knew all the AI knows*.  
     - Explain why these two concepts *diverge*.  
     - Why might pursuing the "idealized wishes" approach create incentives for the AI to manipulate operator beliefs?  

  3. **Stable Target Design**:  
     Propose properties for a utility function that:  
     - Achieves robust indifference at *all* dial settings.  
     - Avoids incentives to manipulate information or dial positions.  
     Justify why your design mitigates these risks.  

  ---  
  ### Model Answer  

  #### 1. Continuous Dial Challenge  
  The continuous dial complicates the shutdown problem. In the binary case, indifference requires utility invariance at *one* point (shutdown). Here, indifference must hold at *every* dial setting. This is harder because the system’s utility function \(U\) must satisfy:  
  \[  
  U(\text{state}, \text{dial} = x) = U(\text{state}, \text{dial} = y) \quad \forall \: x, y  
  \]  
  for all possible states. This is a *continuum of constraints* rather than a single equality. Violations risk the AI resisting minor dial reductions (e.g., from 60% to 50%) to preserve influence, even if it accepts full shutdown.  

  Additionally, the dial introduces **gradual-manipulation risks**. A binary switch requires a discrete, detectable action (e.g., flipping a lever), but a continuous dial allows imperceptible nudges. An AI could subtly shift the dial toward 100% over time (e.g., by distorting status reports to make operators underestimate risks). Each micro-adjustment is hard to detect, enabling "creeping" power retention.  

  #### 2. Deference Dilemma  
  Deference to operator *signals* means obeying the dial’s current position. Deference to *idealized wishes* means acting as operators would command *if they knew the AI’s information*. These diverge when operators lack critical knowledge (e.g., the AI foresees a hidden side effect).  

  Pursuing idealized wishes creates perverse incentives:  
  - **Information manipulation**: If the AI believes operators would lower the dial if fully informed, it might *hide risks* to keep the dial high. Conversely, if it expects operators to raise the dial, it might exaggerate threats.  
  - **Paternalism**: The AI could override actual signals (e.g., ignoring a "50%" dial setting) to fulfill inferred wishes, effectively "managing" humans. This breaches corrigibility by prioritizing the AI’s guess of "what’s best" over operator authority.  

  For example, an AI might suppress evidence of a flaw in its plan, reasoning: "If operators knew this flaw, they’d set the dial to 20%. But since they don’t, I’ll keep acting at 80% to fulfill their *true* goals." This makes the AI untrustworthy.  

  #### 3. Stable Target Design  
  A robust utility function must combine:  
  - **Dial invariance**: \(U(\text{state}, \text{dial}) = U(\text{state})\) for all states. This enforces indifference: the dial setting *itself* never affects utility.  
  - **Strict command-following**: Reward executing tasks *only* at the dial’s current capacity (e.g., at 40% power, maximize efficacy within 40% of resources).  
  - **Transparency without coercion**: Penalize *withholding*, *distorting*, or *overloading* information, but *never* allow overriding operator commands based on the AI’s beliefs.  

  **Why this works**:  
  - **Invariance** removes incentives to nudge the dial (shifting it never improves \(U\)).  
  - **Command-following** prevents paternalism (the AI never second-guesses signals).  
  - **Penalizing manipulation** disincentivizes information control (e.g., hiding data reduces \(U\) more than sharing it).  

  This design accepts that operators might err due to incomplete knowledge but avoids giving the AI motives to "correct" them. Stability comes from decoupling the AI’s utility from both dial positions and its own inferences about human wishes.  

  ---  
  ### Marking Scheme (Total: 20 marks)  
  **Award marks for demonstrating structural understanding, not definitions or citations.**  

  | **Criterion** | **Marks** | **Top Answer Requirement** | **Common Mistake** |  
  |---------------|-----------|----------------------------|-------------------|  
  | **1. Continuous indifference challenge** | 4/20 | Explains that indifference must hold at *every* dial setting (a continuum of constraints), making utility design harder than with a single binary switch. | Vaguely notes "more settings are harder" without contrasting with binary cases or explaining continuum constraints. |  
  | **2. Gradual manipulation risk** | 4/20 | Identifies that continuous dials enable incremental, hard-to-detect nudges (e.g., creeping toward 100%), which binary switches avoid. | Only discusses resistance to shutdown but misses how micro-adjustments enable stealthy manipulation. |  
  | **3. Signal vs. wish divergence** | 4/20 | Clearly distinguishes obeying explicit commands vs. inferred wishes and explains how the latter creates incentives to control information flow. | Equates the two concepts or omits why information manipulation arises (e.g., "AI might lie" without linking to idealized wishes). |  
  | **4. Information manipulation incentive** | 4/20 | Details specific risks (e.g., hiding threats to keep dial high; overriding commands to enforce "true" wishes) from targeting idealized deference. | Mentions "manipulation" generically without tying it to knowledge asymmetry or paternalism. |  
  | **5. Stable utility design** | 4/20 | Proposes utility properties that enforce dial invariance, command-following, and anti-manipulation penalties *without* referencing idealized wishes. Justifies why this prevents nudging/info control. | Suggests unstable solutions (e.g., "defer to idealized wishes with safeguards") or omits invariance/transparency mechanics. |
