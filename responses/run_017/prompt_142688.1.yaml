answer: |-
  ### Exam Question (Handout Version)
  **Epistemology 705: Final Take-Home Examination**  
  **Time Allowed:** 48 Hours  
  **Word Limit:** 1,500 words per answer  
  **Instructions:** Answer the following question. Collaboration is prohibited. Cite sources where appropriate.  

  ---

  **Question:**  
  Consider the following toy model of knowledge:  
  - A subject’s evidence at a case \(w\) is represented by the set \(R(w)\) (the set of cases compatible with that evidence).  
  - \(R\) is reflexive (i.e., \(w \in R(w)\) for all \(w\)).  
  - Knowledge is defined as factive evidential support:  
    \[
    S \text{ knows } p \text{ at } w \quad \text{iff} \quad w \in p \text{ and } R(w) \subseteq p.
    \]  
  - A condition \(C\) is **luminous** iff whenever \(C\) obtains at \(w\), \(R(w) \subseteq C\).  

  The **KK principle** (Kp → KKp) is said to be *valid on a frame* if it holds for every proposition \(p\) and every case \(w\) in that frame.  

  (a) Prove that the KK principle is valid on a frame **if and only if** \(R\) is transitive (i.e., if \(v \in R(u)\) and \(w \in R(v)\), then \(w \in R(u)\)).  
  (b) Suppose \(R\) is **chain-connected**: for any two cases \(w, w'\), there exists a sequence \(w = w_0, w_1, \dots, w_n = w'\) such that \(w_{i+1} \in R(w_i)\) or \(w_i \in R(w_{i+1})\) for each \(i\). Show that if we redefine knowledge using the *transitive closure* of \(R\) (i.e., replace \(R\) with \(R^*\), the smallest transitive relation containing \(R\)), then **no non-trivial knowledge** is possible (i.e., \(S\) knows \(p\) at \(w\) only if \(p\) is true at all cases).  
  (c) Explain why the "margin-for-error" anti-luminosity argument depends critically on the **failure of transitivity** in \(R\), and why preserving KK via transitive closure is epistemically untenable in sorites-susceptible domains.  

  ---

  ### Model Answer (650 words)  
  #### (a) KK Validity iff Transitivity of \(R\)  
  **⇒ Direction (Transitivity ⇒ KK Validity):**  
  Assume \(R\) is transitive. Suppose \(S\) knows \(p\) at \(w\), so \(w \in p\) and \(R(w) \subseteq p\). To show \(S\) knows that they know \(p\) (i.e., \(KKp\) at \(w\)), we must prove: (i) \(S\) knows \(p\) at \(w\) (given), and (ii) \(R(w) \subseteq \{v \mid S \text{ knows } p \text{ at } v\}\).  

  Take any \(v \in R(w)\). Since \(R(w) \subseteq p\), \(v \in p\). To show \(S\) knows \(p\) at \(v\), we need \(R(v) \subseteq p\). By transitivity, if \(u \in R(v)\) and \(v \in R(w)\), then \(u \in R(w)\). Since \(R(w) \subseteq p\), \(u \in p\). Thus \(R(v) \subseteq p\), so \(S\) knows \(p\) at \(v\). Hence \(R(w) \subseteq \{v \mid S \text{ knows } p \text{ at } v\}\), and KKp holds at \(w\).  

  **⇐ Direction (KK Validity ⇒ Transitivity):**  
  Assume \(R\) is **not** transitive. Then there exist cases \(w, v, u\) such that \(v \in R(w)\), \(u \in R(v)\), but \(u \not\in R(w)\). Define a proposition \(p = \{x \mid u \not\in R(x)\}\). We show KKp fails at \(u\):  

  1. **Kp fails at \(v\):**  
     \(v \in p\) (since \(u \not\in R(v)\)), but \(R(v) \not\subseteq p\) because \(u \in R(v)\) and \(u \not\in p\) (as \(u \in R(u)\) by reflexivity, so \(u \not\in \{x \mid u \not\in R(x)\}\)). Thus \(S\) does not know \(p\) at \(v\).  
     
  2. **KKp fails at \(w\):**  
     \(S\) knows \(p\) at \(w\)? \(w \in p\) (since \(u \not\in R(w)\)), and \(R(w) \subseteq p\): if \(x \in R(w)\), then \(u \not\in R(x)\) (otherwise if \(u \in R(x)\) and \(x \in R(w)\), transitivity would force \(u \in R(w)\), contradiction). Thus \(S\) knows \(p\) at \(w\). But \(S\) does *not* know that they know \(p\) (i.e., \(KKp\) at \(w\)) because \(v \in R(w)\), and at \(v\), \(S\) does not know \(p\) (as shown in step 1). Hence Kp → KKp fails at \(w\).  

  ∴ KK is valid iff \(R\) is transitive.  

  #### (b) Collapse of Knowledge under Transitive Closure  
  Let \(R^*\) be the transitive closure of \(R\). By definition, \(w R^* w'\) iff there is a finite chain \(w = w_0, w_1, \dots, w_n = w'\) with \(w_{i+1} \in R(w_i)\) for each \(i\). If \(R\) is chain-connected, then for *any* two cases \(w, w'\), we have \(w R^* w'\) and \(w' R^* w\).  

  Redefine knowledge as: \(S\) knows \(p\) at \(w\) iff \(w \in p\) and \(R^*(w) \subseteq p\). By chain-connectedness, \(R^*(w)\) includes **all** cases. Thus \(R^*(w) \subseteq p\) only if \(p\) holds everywhere. Non-trivial knowledge (e.g., knowing a contingent proposition true only at \(w\)) is impossible.  

  #### (c) Margin-for-Error, KK, and the Transitivity Dilemma  
  The margin-for-error argument (e.g., Williamson’s temperature sorites) assumes a series of cases \(w_0, w_1, \dots, w_n\) where:  
  - \(w_{i+1} \in R(w_i)\) (cases are pairwise indiscriminable),  
  - At \(w_0\), condition \(C\) (e.g., "feels cold") holds, but at \(w_n\), \(C\) fails.  

  Luminosity demands that if \(C\) holds at \(w_i\), then \(R(w_i) \subseteq C\). But since \(w_{i+1} \in R(w_i)\), if \(C\) holds at \(w_i\), it must hold at \(w_{i+1}\). By induction, \(C\) holds at \(w_n\)—contradiction.  

  This argument **depends on transitivity failure**: \(R\) is non-transitive because \(w_j \not\in R(w_i)\) for \(|i - j|\) large (discriminability at a distance), even though adjacent cases are indiscriminable. The anti-luminosity conclusion arises from this intransitivity. Crucially, KK fails here because \(R\) is not transitive (from part (a)).  

  Preserving KK by adopting \(R^*\) collapses knowledge in chain-connected spaces (like sorites series), as \(R^*\) becomes universal. Thus, we face a dilemma:  
  - **Reject KK**: Accept non-transitive \(R\), allowing non-trivial knowledge but sacrificing luminosity and KK.  
  - **Accept KK via \(R^*\)**: Gain KK but lose non-trivial knowledge entirely.  
  The margin-for-error argument exploits the first horn, but the collapse shows the second is equally untenable. This reveals that the debate hinges on whether we can tolerate non-transitive indiscriminability without epistemic collapse.  

  ---

  ### Marking Scheme (Total: 25 points)  
  **Must-hit points** (Award marks as follows):  

  1. **Proof of KK iff Transitivity (9 points)**  
     - ⇒ Direction (Transitivity ⇒ KK): 3 pts.  
       *Common error: Assumes luminosity or misses transitivity in proving \(R(v) \subseteq p\).*  
     - ⇐ Direction (KK ⇒ Transitivity): 4 pts.  
       *Common error: Fails to construct a countermodel \(p\) where Kp holds but KKp fails at an intransitivity point.*  
     - Clear separation of directions: 2 pts.  

  2. **Collapse under Transitive Closure (6 points)**  
     - Correct definition of \(R^*\): 1 pt.  
     - Chain-connectedness implies \(R^*\) universal: 3 pts.  
       *Common error: Assumes reflexivity suffices, misses chain-connectedness.*  
     - Conclusion: Non-trivial knowledge impossible: 2 pts.  

  3. **Role of Transitivity Failure in Margin-for-Error (5 points)**  
     - Links margin-for-error to pairwise indiscriminability + non-transitivity: 2 pts.  
       *Common error: Merely restates Williamson's argument without referencing transitivity.*  
     - Explains how intransitivity drives the luminosity paradox: 2 pts.  
     - Notes KK's failure follows from non-transitivity (per part a): 1 pt.  

  4. **Dilemma: KK vs. Non-Trivial Knowledge (3 points)**  
     - Identifies the two horns (reject KK or collapse knowledge): 2 pts.  
     - Explains why transitive closure is unworkable for sorites: 1 pt.  

  5. **Synthesis & Avoiding Textbook Summary (2 points)**  
     - Explicitly frames the margin-for-error argument as forcing a *choice* (not a corollary): 1 pt.  
     - Moves beyond "luminosity false" to articulate the transitivity trade-off: 1 pt.  

  **Deductions**:  
  - Exceeding word limit: -3 pts.  
  - Misdefining key terms (e.g., luminous conditions, KK): -2 pts per instance.  
  - Superficial engagement (e.g., summarizing Williamson without model analysis): Cap at 10/25.  

  ---  
  This question forces candidates to engage the model’s structure, exposing the transitivity-KK equivalence and the collapse risk in KK-preserving repairs. Strong answers will articulate why luminosity debates are really about the topology of indiscriminability.
