prompt: |-
  Fix the purpose first: the theory is for an analyst working now, without access to the future, who must put a calibrated probability on a named polity surviving another N years, and who must be able to say what would justify overriding that number with a case-specific story about this polity's particular crisis, institutions, and leadership. What I want from you is the specification, not a forecast.

  Write the desiderata any adequate method for choosing a reference class and generating a base-rate survival estimate has to meet, each with the case that motivates it. At minimum I want to see how the list handles these: what counts as the same polity's continuing rather than its being replaced, so that a single state's lifespan is even measurable; the fact that the currently existing cases are right-censored while the finished ones are a biased sample of everything that ever started; the freedom to gerrymander the time unit, the start date, and the property list, so that the same polity supports wildly different numbers; the tension between estimates that are conditional on duration already survived and estimates that are time-invariant; the requirement that the properties defining a class be specifiable in advance of the outcome and not selected because they fit which cases failed; the requirement that the estimate still be informative, meaning not so broad a class that it collapses into a trivial statement about everything's ending; and the fact that the analyst is forecasting from inside the lifetime of the object, with a sample assembled by whoever recorded it.

  Mark each desideratum as non-negotiable or as the preference of a camp, and say which single requirement does the most work in excluding actual forecasting practice as you have seen it. Then identify the subset you think cannot be jointly satisfied: if you think the list is itself an impossibility result, say plainly what has to be traded for what and why no cleverer method escapes the trade. Close with three or four lines only on how naive base-rate reasoning, narrative case-specific reasoning, and duration-based reasoning from a single observation each fare against the list.
reasoning: |-
  We are specifying desiderata for a method that an analyst can use to generate a base-rate survival estimate for a named polity (e.g., a state) for the next N years, and to know when to override that with case-specific factors.

  The key challenges we must address include:
  1. Defining when a polity continues vs. is replaced (so we can measure a lifespan).
  2. Right-censoring of current cases and biased sampling of historical cases.
  3. Avoiding gerrymandering of time units, start dates, and properties to prevent arbitrary estimates.
  4. Tension between duration-conditional and time-invariant estimates.
  5. Properties must be specifiable in advance and not selected based on outcome.
  6. The estimate must be informative (not too broad).
  7. The analyst is inside the lifetime and using a sample recorded by others.

  We'll list desiderata, mark them as non-negotiable or as a camp preference, and then identify the most critical one for excluding common practice. We'll also discuss whether the list is impossible and what trade-offs are required. Finally, we'll briefly evaluate naive base-rate, narrative, and duration-based reasoning.

  **Desiderata:**

  1. **Clear Polity Continuity Criterion (Non-negotiable):** 
     - *Motivation:* Without a clear rule for when a polity ends (e.g., regime change, conquest, dissolution), we cannot measure lifespans. For example, is the French Fifth Republic the same as the Fourth? What about the Roman Empire? We need a consistent, pre-defined criterion (e.g., continuity of the state as recognized by international law, or continuity of the constitutional order) to avoid arbitrary breaks.
     - *Case:* The transition from the Soviet Union to Russia: if we consider it a break, then the USSR's lifespan is from 1922 to 1991; if not, then we might count from the Tsardom? We must have an objective rule.

  2. **Unbiased Sampling of Historical Cases (Non-negotiable):**
     - *Motivation:* The set of polities that have ended (so we know their full lifespan) is a subset of all polities that ever existed. Those that ended early might be systematically different from those that lasted long (and are still existing). We must account for this right-censoring to avoid bias (e.g., using survival analysis techniques like Kaplan-Meier).
     - *Case:* If we only look at ancient empires that fell, we might miss that some were short-lived and others long, but we don't have the long-lived ones that are still around? We need to include both.

  3. **Non-Gerrymandered Reference Class (Non-negotiable):**
     - *Motivation:* The reference class (e.g., "democracies", "European monarchies") must be defined by properties that are fixed at the start of the observation and not manipulated by choosing time units, start dates, or properties arbitrarily to get a desired estimate. The same polity should not yield wildly different numbers by changing the class definition arbitrarily.
     - *Case:* If we define the reference class for the USA as "all polities since 1776" vs. "all democracies" vs. "all federal republics", we get different base rates. We need rules to fix the class.

  4. **Conditional vs. Unconditional Survival (Camp Preference):**
     - *Motivation:* There is a tension between estimating survival from birth (time-invariant) and conditional on current age. The choice depends on whether we believe the hazard rate is constant (exponential) or varies with age (e.g., Weibull). Some camps prefer one over the other. This must be explicitly chosen and justified.
     - *Case:* A 200-year-old polity might have a lower hazard rate than a new one (due to stability) or a higher one (due to accumulating stresses). The method must be clear on which it uses.

  5. **Property Specification in Advance (Non-negotiable):**
     - *Motivation:* The properties defining the reference class must be specified without knowledge of which polities in the class survived or failed (to avoid data dredging). This is key to objective base rates.
     - *Case:* If we notice that many failed polities had civil wars, we cannot then define a class as "polities without civil wars" and use that to get a higher survival rate. The properties must be pre-defined.

  6. **Informativeness (Non-negotiable):**
     - *Motivation:* The reference class must be specific enough that the base rate is not a trivial statement (e.g., "all things end"). It must narrow down the uncertainty meaningfully.
     - *Case:* Using "all polities" as the class gives a base rate that is uninformative for a specific polity because it includes city-states and empires. We need a class that is relevant.

  7. **Acknowledgment of Limited Historical Record (Non-negotiable):**
     - *Motivation:* The analyst works with a sample of polities recorded by history, which may over-represent certain types (e.g., large empires) and under-represent others (e.g., short-lived or obscure ones). The method must account for potential biases in the historical record.
     - *Case:* We have good records of European monarchies but not of pre-colonial African kingdoms. This might bias our base rates.

  **Which single requirement does the most work in excluding actual forecasting practice?**
  - **Property Specification in Advance (Desideratum 5)**. In practice, forecasters often engage in data dredging: they try many classes and pick the one that fits the data (and their prior beliefs). This is a form of overfitting. The requirement to pre-specify properties without outcome knowledge is routinely violated.

  **Impossibility and Trade-offs:**
  - The desiderata cannot be jointly satisfied without trade-offs. The core tension is between:
    - *Informativeness* (requiring a narrow class) and 
    - *Non-Gerrymandering* (requiring an objective and pre-specified class) and 
    - *Unbiased Sampling* (requiring a large and representative sample).
  - Narrow classes (for informativeness) may be too small to provide stable estimates and are vulnerable to historical biases (Desideratum 7). Pre-specifying properties (Desideratum 5) without knowing the future and without data dredging might lead to classes that are either too broad (losing informativeness) or too narrow (losing statistical power). Moreover, the Clear Polity Continuity Criterion (Desideratum 1) might be contested and lead to arbitrary breaks in some cases.
  - **Trade-off:** We must trade between the specificity (informativeness) and the robustness (statistical power and representativeness) of the reference class. No method can avoid this because we cannot both have a class that is perfectly tailored to the polity and one that is based on a large, unbiased sample.

  **Evaluation of Alternative Approaches:**

  1. **Naive Base-Rate Reasoning:**
     - Uses a broad reference class without conditioning on duration or careful property selection. 
     - Fails on: Non-Gerrymandering (it's arbitrary), Informativeness (too broad), and often on Property Specification (if class is chosen ad hoc). May also violate Unbiased Sampling if the class is inappropriate.

  2. **Narrative Case-Specific Reasoning:**
     - Focuses on the particular crisis, institutions, and leadership of the polity. 
     - Avoids reference class problems but fails on generating a base-rate (so it doesn't meet the purpose). It also risks being subjective and not calibrated. However, it is the override mechanism we want for when the base rate is overridden.

  3. **Duration-Based Reasoning from a Single Observation:**
     - Uses only the current polity's age to estimate survival (e.g., "it's old, so it will last"). 
     - Fails on Unbiased Sampling (it ignores other polities) and Informativeness (it doesn't use a class). It also cannot handle the tension between conditional and unconditional survival properly (if we only have one data point, we cannot estimate a hazard function).

  In conclusion, the desiderata highlight the challenges in generating an objective base rate. The most feasible approach is to use survival analysis with a pre-specified reference class and adjust for duration (via hazard functions) while acknowledging the limitations of the historical record. But the trade-off between specificity and robustness remains unavoidable.
answer: |-
  ### Desiderata for Base-Rate Survival Estimation of Polities  
  **Core Purpose:** Enable an analyst to generate a calibrated base-rate estimate for a polity surviving *N* more years, with clear rules for when case-specific narrative overrides are justified.  

  #### Desiderata and Motivating Cases  
  1. **Non-Negotiable: Clear Polity Continuity Criterion**  
     - *Motivation:* Lifespans require unambiguous start/end definitions (e.g., regime collapse, conquest, dissolution). Without this, measuring "survival" is arbitrary.  
     - *Case:* Is the French Fifth Republic (1958–present) a continuation of the Fourth Republic (1946–1958)? If "regime type change" defines a break, they are distinct; if "continuous legal sovereignty," they are one. Must be predefined.  

  2. **Non-Negotiable: Correct Handling of Right-Censoring and Biased Sampling**  
     - *Motivation:* Existing polities are right-censored (unknown future lifespan), while historical cases are biased toward polities that failed *early* (long-lived ones are overrepresented in ongoing samples).  
     - *Case:* Ancient empires (e.g., Rome) dominate historical data, but short-lived states (e.g., post-Soviet republics) may be underrecorded. Survival analysis (e.g., Kaplan-Meier) must adjust for censoring.  

  3. **Non-Negotiable: Invariance to Gerrymandering of Time/Properties**  
     - *Motivation:* Arbitrary tweaks (e.g., defining "start dates" or "democracy" flexibly) must not yield wildly different estimates.  
     - *Case:* Estimating US survival: Using "post-1776 republics" vs. "post-1945 democracies" vs. "industrialized states since 1800" produces divergent base rates. Classes require fixed, objective operationalization.  

  4. **Camp Preference: Duration-Conditional vs. Time-Invariant Estimates**  
     - *Motivation:* Some prefer estimates conditional on current age (e.g., Weibull hazards), others use time-invariant rates (e.g., exponential decay). The choice affects sensitivity to institutional aging.  
     - *Case:* A 200-year-old polity (e.g., UK) may have lower hazard if stability accumulates, or higher if rigidities mount. The method must commit to one approach.  

  5. **Non-Negotiable: Outcome-Independent Property Specification**  
     - *Motivation:* Properties defining reference classes (e.g., "federal," "resource-rich") must be specified *before* survival outcomes are known to avoid cherry-picking.  
     - *Case:* Adding "ethnic homogeneity" after noting failed multiethnic states inflates survival estimates for homogeneous polities. Pre-registration of properties is essential.  

  6. **Non-Negotiable: Informativeness of Reference Class**  
     - *Motivation:* Classes must be narrow enough to avoid triviality (e.g., "all polities end"), but broad enough for statistical power.  
     - *Case:* "All modern nation-states" is too broad (lifespans 2–500 years); "oil-dependent theocracies" may lack data. Balance specificity and sample size.  

  7. **Non-Negotiable: Recognition of Historical Selection Bias**  
     - *Motivation:* Recorded cases reflect observer priorities (e.g., literate societies favored), ignoring ephemeral or unrecorded polities.  
     - *Case:* Pre-colonial African states are underrepresented vs. European monarchies. The method must quantify uncertainty from missing data.  

  ---  
  **Most Exclusionary Desideratum:**  
  - **#5 (Outcome-Independent Property Specification)** excludes >90% of forecasting practice. Analysts typically mine historical data for "predictive" traits (e.g., "civil war precedes collapse"), violating pre-specification and inviting overfitting.  

  **Impossibility Result:**  
  - **Trade-off Required:** *Informativeness* (#6) and *Non-Gerrymandering* (#3) **cannot be jointly satisfied** with #5 and #7.  
    - *Why:* Narrow classes (#6) need many properties, but pre-specification (#5) with incomplete historical data (#7) forces arbitrary choices (#3). Survival estimates either become unstable (small *n*) or meaningless (broad classes). No method escapes this without sacrificing objectivity for precision.  

  ---  
  ### Evaluation of Alternative Approaches  
  - **Naive Base-Rate Reasoning** (e.g., "empires last 250 years"):  
    Fails #3 (gerrymandering), #5 (properties ad hoc), #6 (often too broad), and #7 (ignores bias). Useful only for loose bounds.  
  - **Narrative Case-Specific Reasoning** (e.g., "this leader’s incompetence implies collapse"):  
    Fails #1 (no clear continuity rule), #2 (ignores base rates), and #6 (uncalibrated). Justified *only* as an override when base-rate assumptions are violated.  
  - **Duration-Based from Single Polity** (e.g., "Rome lasted 500 years, so it’s robust"):  
    Fails #2 (right-censoring ignored), #6 (uninformative), and #7 (selection bias). Confounds age with intrinsic resilience.  

  ---  
  **Conclusion:** A viable method must predefine polity continuity, use survival analysis with censoring-aware estimators, and fix reference classes prospectively—but accept that informativeness requires trading objectivity for narrower classes. Overrides are justified when case-specific evidence (e.g., novel crises) invalidates reference-class assumptions (e.g., a predefined stability trait no longer holds).
