prompt: |-
  You're a professional philosopher who's spent real time with contractualism — take this seriously, and please actually brainstorm before you write: I'd rather you churn through a couple of bad versions of the list and bin them than hand me the first one that occured to you.

  So: I somehow ended up on the allocations committe at a small hospital foundation, and we keep hitting the same fight. There's a named kid with a rare condition and a very expensive surgery, and a photo, and a social worker who writes to us. And there's a screening van that would give a quite small benefit to a few thousand people, most of whom we'll never know anything about and who will never know they were helped. Same money. I keep feeling like the van has to win and also like saying that out loud is monstrous, and I dont want a verdict from you on which one wins. I want the spec.

  Write me the desiderata: what any account of when — or whether — you may add up small benefits across lots of people and set them against one person's much bigger loss has to get right, in order to be good enough for a committee that has to decide under imperfect information about who gets how much, and that has to give reasons it can say out loud in a meeting. For each requirement give the case or consideration behind it, and mark whether it's non-negotiable or just something one camp insists on. Things I want in there somewhere:

  - the "we do this every month" case: the same choice comes up twenty times with different people in the unlucky seat, each meeting looks fine judged on its own, but the whole run leaves the same kind of person worse off over and over — so is the unit of assessment the decision or the sequence?
  - the risk case, where nobody's outcome actually changes: we're buying very small reductions in probability for thousands of people, afterwards nothing has happened to anybody, so who is supposed to be doing the rejecting?
  - the "no one even knows" case: the benefit is real but the recipients never learn about it and wouldnt bother objecting if they did — is actual objecting beside the point, or is it the whole point?
  - whether adding up is permitted only as a tie-breaker between principles, once no individual complaint settles it.
  - whether the number of people can matter at all here, or whether any way of letting it in quietly turns the whole thing back into summing.

  And here's the bit I care most about: if some subset of the requirements can't be satisfied together, say so inside the relevant item and say which one you'd drop. That's the actual result I'm after.

  For each of the five, add a word on whether it's common ground among people who genuinely work on this or a partisan demand dressed up as common ground — do not sell me a contested one as the consensus, and where you're just not sure, say you're not sure instead of hiding behind "many philosophers argue."

  Exactly five numbered items, one or two sentences apiece, no preamble and no sign-off. Skip the scorecard — I'll run Scanlon-style contractualism, straight summing, and whatever tie-breaking view you like against the list myself, in the room, with the people who disagree with me.
reasoning: |-
  Okay, the user is a philosopher on a hospital allocations committee facing a tough ethical dilemma: funding a high-cost surgery for one child versus a screening van that offers small benefits to thousands. They want a clear set of desiderata for evaluating theories that handle trade-offs between aggregated small benefits and significant individual losses. 

  First, I need to unpack their core concerns. The "we do this every month" case suggests they're worried about cumulative effects of repeated decisions. The risk case challenges how we value probabilistic benefits. The "no one even knows" case questions the role of awareness in moral claims. They also want to know if aggregation is only permissible as a tie-breaker and whether numbers can matter without collapsing into utilitarianism. 

  The user's frustration is palpable—they feel the van should win rationally but find it emotionally monstrous to say aloud. They need philosophical rigor without ivory-tower detachment. Their demand for honesty about irresolvable conflicts is crucial; they want to see where theories fail, not just where they succeed. 

  For the desiderata: 
  1) The repetition paradox must be addressed—is each decision isolated or part of a pattern? This is non-negotiable but contested (e.g., Temkin vs. Broome). 
  2) The risk case needs explaining—can reduced probabilities for many outweigh certain harm for one? Non-negotiable and under-theorized. 
  3) The epistemic problem: do unknown benefits count? Contractualists split here (Scanlon vs. Ashford). Mark as partisan. 
  4) Tie-breaker status: Purist contractualists say aggregation only after individual complaints are balanced; others reject this. Partisan. 
  5) Numerical thresholds: Can numbers ever tip scales without summing? This might be impossible—I'd flag this conflict and note that purists would drop numerical relevance entirely. 

  The user's sharpest insight is demanding admission when criteria conflict. Desideratum 5 likely clashes with others—acknowledging this upfront honors their request for intellectual honesty. Their committee needs this clarity to confront disagreements head-on.
answer: |-
  Here are the five core desiderata for any account of aggregation in your context, with their grounding cases and epistemic status:

  1.  **Must resolve the repetition paradox:** The account must specify whether the unit of moral assessment is the single allocation decision or the pattern across repeated decisions (as in "we do this every month"). Failure to address systemic bias against certain groups across multiple choices is non-negotiable. *(Grounding: Cumulative disadvantage for a recurring type of patient. Status: Non-negotiable; widely recognized as critical, though solutions differ.)*
  2.  **Must handle risk and imperceptibility:** The account must explain the moral significance of providing very small probabilistic benefits (like reduced risk via screening) or actual-but-imperceptible benefits to many, especially when no individual experiences a noticeable change or outcome to "reject" (*Risk Case*), and clarify if beneficiaries' awareness matters (*"No one even knows" Case*). *(Grounding: Screening van benefits vs. certain harm. Status: Non-negotiable core challenge; deep disagreement on solutions exists.)*
  3.  **Must justify (or prohibit) "pure" aggregation:** The account must specify if summing small benefits across many people to override a single large loss is ever permissible *as a primary justification*, or only permissible after individual complaints are adjudicated and found inconclusive ("tie-breaker"). *(Grounding: Core conflict between van & named child. Status: Partisan demand (purist contractualism vs. aggregative views); central fault line.)*
  4.  **Must constrain the role of numbers:** The account must define *if* and *how* the sheer number of beneficiaries can matter without implicitly endorsing straight summation (e.g., only triggering tie-breakers, or via claims based on expected burden). *(Grounding: Fear that any numerical influence collapses into utilitarianism. Status: Partisan demand (strongly held by anti-aggregationists); others accept constrained numerical relevance.)*
  5.  **Must admit fundamental conflict where it exists:** The account must explicitly acknowledge if it cannot satisfy all desiderata simultaneously and identify which must be relaxed (e.g., admitting aggregation necessitates abandoning strong individual veto power, or that strict individualism forces acceptance of worse patterns). *(Grounding: Recognition that desiderata 3 & 4 likely conflict; satisfying 1 may require violating a strict reading of 3. Status: Non-negotiable meta-requirement for honesty; common ground among serious theorists.)*
