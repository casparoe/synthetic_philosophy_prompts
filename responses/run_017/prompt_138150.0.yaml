  You're a professional philosopher who works on metaphysics and philosophy of science — the kind of person who has read all of this and has an actual view. Please brainstorm for a bit before you commit, think carefully about what I'm really asking, and don't hand me a literature survey; I've read those.

  I'm a journalist doing a piece on whether the sciences carve nature at its joints, and I've now sat through the same argument maybe fifteen times and it never moves. Side A: mature science converges on a stable set of categories that support induction and explanation, and that convergence just is what "natural" means — the joints are wherever the inductions hold. Side B: what matters is which predicates do real causal-explanatory work, and the working taxonomies of chemistry, biology, psychology and economics cross-cut each other badly, so there's no fact of the matter about which set is the one true carving. And they agree on every case — water, jade, gold, tiger, species — they just describe the cases differently.

  My hypothesis is that it's definatly mostly verbal: "natural kind" is doing two jobs (licenses induction / tracks causal structure) and each side picks the job the other is bad at. But I can't rule out a hidden empirical question doing all the work. So imagine a big project that measured, for every pair of sciences, how much their most inductively successful categories overlap — how nested versus how cross-cutting the successful taxonomies actually are, weighted by inductive work done. Say it came back strongly cross-cutting. Would either side take that as a defeat? Or would both camps say "yes, exactly what I predicted" — which would itself tell you the dispute was never empirical?

  So: verbal, substantive, two questions under one name, bedrock intuitions about structure versus usefulness that neither side can argue for, or an ill-posed question? Diagnose it with reasons I could actually use in 1200 words, and tell me what would count as progress — a distinction, that measurement, a change of question, or nothing at all.
