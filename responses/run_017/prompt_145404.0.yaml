prompt: |-
  I've been playing with a spreadsheet version of a very simple game, and I keep running into a pattern I don't have a word for, though I assume there is one.

  The game: a biased coin comes up heads 60 percent of the time. Each round you are required to stake one half of your current bankroll; on heads you gain that half, on tails you lose it. Every round is favorable in the ordinary sense, since the average multiplier on your bankroll is 1.1 per round. Now two things seem true at once. Run a large crowd of players for a few hundred rounds and the average final bankroll grows without bound, at roughly that 1.1 per round, just as you would expect. But any single player who keeps going ends up with essentially nothing, almost surely — and so does the typical member of the crowd: in a crowd of a thousand the median player is nearly broke, while the average is astronomical, held up by a handful who got very lucky. There is no absorbing barrier here and nobody needs bad luck; with the stake set below the whole bankroll, wealth just decays toward zero without ever arriving at it.

  The part I really can't place is what I noticed next. Have a thousand people play that same game on independent coins, and after every round have them throw everything into one pot and split it equally. Now the pot grows at very nearly the same 1.1 per round: the crowd's average has become the actual experience of one continuing entity, and the decay disappears. Have them bet on the same tosses instead of independent ones, and pooling does nothing at all.

  Does the gap in the first case have an established name, and does the pooling maneuver have one of its own? People have offered me risk of ruin, variance drag, and gambler's ruin, and none of them seems to be quite it. I am also not mainly after a label: I want the carving. What does the gap consist in; what is pooling actually doing, such that it closes the gap under independence and not under correlation; how does that differ from ordinary diversification and from insurance; and where in this picture does the advice to stake the growth-maximizing fraction belong? Please answer in under 400 words.
reasoning: |-
  Okay, let me unpack this user's query. They're describing a paradoxical scenario with a biased coin game where the expected growth seems positive, yet individual players almost surely go broke. The key elements are: 60% heads probability, mandatory 50% bankroll stake per round, 1.1 expected multiplier, and the crowd behavior observations.

  Hmm, the user already knows terms like "variance drag" and "gambler's ruin" but feels they don't quite fit. This suggests they want precise conceptual carving, not just labels. Their deeper questions seem to be: why does pooling eliminate decay only under independence, and how does this relate to standard financial concepts?

  First, I need to verify the math. The 1.1 expected multiplier is correct (0.6*1.5 + 0.4*0.5=1.1), but the long-term outcome is counterintuitive. Ah yes - this is a classic case where arithmetic mean return (10%) differs from geometric mean return (negative due to volatility). The decay happens because losses disproportionately harm compounding.

  The pooling effect is fascinating. With independent tosses, splitting the pot each round essentially creates a new "entity" experiencing the arithmetic mean growth rate (10%) with near-zero variance. This is mathematically equivalent to the law of large numbers eliminating individual volatility. But with correlated tosses, pooling doesn't reduce variance - everyone wins or loses together.

  The growth-maximizing fraction (Kelly criterion) connects here. Staking 50% is actually overbetting - the optimal stake for 60% heads is 20% (2p-1). The mandatory overbetting causes the decay, while pooling "corrects" this by diversifying away the excess risk.

  The user's insight about the gap between average and typical experience is spot-on. This is fundamentally about ergodicity breaking: time-average (individual trajectory) doesn't equal ensemble-average (crowd snapshot). Pooling restores ergodicity under independence by making each "player" represent the ensemble.

  I should emphasize that pooling under independence acts as perfect diversification, transforming volatile geometric growth into smooth arithmetic growth. But under correlation, it's merely insurance - preserving the original volatility distribution. This distinction explains why pooling only helps in the independent case.
answer: |-
  The discrepancy arises from the **non-ergodicity** of multiplicative growth with high variance. While the *expected* growth rate (arithmetic mean) is 10% per round, the *typical* growth rate (geometric mean) is negative. For a single player, the multiplicative noise compounds, leading to almost sure ruin: losing 50% hurts more than gaining 50% helps when compounded sequentially (geometric mean multiplier ≈ 0.979 per round).

  **Pooling closes the gap under independence** because it transforms the process. Each round, players contribute their entire bankroll to the pot. The pot's size after the tosses is the *sum* of individual outcomes. Splitting equally means each player receives the *average* outcome. By the law of large numbers, this average converges to the expected value (1.1x growth per player per round), drastically reducing variance. The crowd becomes a single entity experiencing the arithmetic mean growth with minimal volatility.

  **Pooling fails under correlation** because everyone wins or loses together. The average outcome after each toss is just the outcome itself (either 1.5x or 0.5x per player), so splitting the pot doesn't reduce variance—each player still gets the same volatile multiplier as if playing alone. The decay persists.

  **Ordinary diversification** reduces idiosyncratic risk via uncorrelated assets. **Insurance** pools uncorrelated risks to reduce individual loss impact. Pooling here acts as perfect diversification across independent coin tosses, eliminating the volatility drag inherent to individual multiplicative growth.

  **The growth-maximizing fraction (Kelly Criterion)** addresses the core issue. Betting 50% of your bankroll on a 60% coin is overbetting (Kelly stake = 2p-1 = 20%). This excessive stake maximizes the variance drag causing ruin. Pooling effectively "diversifies away" this drag under independence, allowing the favorable arithmetic mean to dominate.

  **Key concepts:** Non-ergodicity, Volatility Drag, Arithmetic vs. Geometric Mean Growth, Law of Large Numbers (for pooling).
