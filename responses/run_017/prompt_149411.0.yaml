  The user is intellectually sophisticated - they've moved beyond surface-level debates about the statue and want to test their philosophical framework against a concrete historical case. Their frustration with standard arguments ("he was a man of his time" etc.) is palpable. They're not seeking bibliography but a genuine dialectical exchange.

  Hmm, their "Plutarch test" is intriguing: (a) inclusion of unflattering details, (b) tracing the cost/benefit of virtues, (c) prescribing action not just emotion. I suspect they're right that (c) is the most problematic - Plutarch himself focuses more on character formation than concrete action. Their "indivisible monument" concept is sharp too - statues inherently collapse complexity unlike written narratives.

  For the mapping: the "life" here is clearly the statue as civic text, with pedestrians as "readers." Finding a "jest" for Colston is tricky - maybe his meticulous charity accounting juxtaposed with human commodification? 

  On their three clauses: the 1895 monument fails all tests (pure hagiography), the defaced statue passes (a) but not (b)-(c), the 2025 plaque comes closest but still avoids funding. The funding clause (b) is indeed the killer - nobody wants to confront that the hospitals were built with blood money.

  The breaking points they identify are profound. That third one - Plutarch's individual focus vs. modern collective memory - might be the deepest fracture. Their point about contemporaneous critics (Burke) is absolutely valid Plutarchanism - comparison reveals character.

  For a parallel life... Robert Clive feels right. Both extracted colonial wealth then faced posthumous reckoning. The comparison would show how philanthropy launders violence.

  I'll push back gently on their test: (c) feels anachronistic for Plutarch, and "virtue funded by vice" needs more nuance - perhaps distinguish between intention and material causation. But their framework is remarkably sturdy for a non-specialist!
answer: |-
  Let's argue this through the Plutarchan lens you've sharpened. Your test and the indivisibility thesis are powerful tools—but they reveal cracks in the method when applied to this modern monument. Here’s the dissection:

  ### 1. The Mapping  
  - **The "Life"**: Not Colston the man (dead 300 years), nor the statue alone. It’s the *civic narrative*—the 1895 monument’s assertion of "virtuous and wise," the defaced statue’s rebuttal, and the 2025 plaque’s cold record. Plutarch wrote *lives* to shape character; here, Bristol wrote a *monument* to shape civic identity.  
  - **The "Reader"**: The citizen passing the plinth. "Reading" is *confrontation*: does this demand admiration? Shame? Reflection? Unlike a book, you cannot pause or reread; the monument imposes itself.  
  - **The "Expression or Jest"**: For Colston, it’s the *account books*. The Royal African Company’s ledger entries—"X human beings purchased for Y pounds"—juxtaposed with his charity donations. A small, bureaucratic detail revealing a soul that commodified people to fund piety.  

  ### 2. The Three Clauses Applied  
  | **Object**               | **(a) Unflattering Detail?**       | **(b) Funding Traced?**          | **(c) Action Prescribed?**       |  
  |--------------------------|-----------------------------------|----------------------------------|----------------------------------|  
  | **1895 Monument**        | ❌ Pure hagiography. Suppressed trade. | ❌ "Virtuous" severed from wealth’s source. | ❌ "Admire him" (feeling, not action). |  
  | **Defaced Statue (Museum)** | ✅ "Graffiti = visceral rejection of virtue. | ⚠️ Implicit (slave chains spray-painted) but not explicit. | ✅ "Reject oppression" (action implied by iconoclasm). |  
  | **2025 Plaque**          | ✅ Records toppling, contextualizes harm. | ❌ Notes slave trade role but avoids *direct* link to charity funds. | ⚠️ "Remember" (feeling), not "act." |  

  **Clause (b) is the fatal weakness**: All three evade the *material chain*—how blood money became almshouse bricks. The plaques (old and new) omit it; the graffiti implies it but doesn’t articulate it. Plutarch would demand we see the *gold and the shackles in the same ledger line*.  

  ### 3. Where the Case Breaks Plutarch’s Method  
  **Deepest Break: #1 (Virtue Funded by Vice)**  
  Plutarch assumes virtues/vices spring from a unified soul. But Colston’s "charity" *required* brutality—the virtue *is* the vice monetized. Plutarch has no framework for this. His "soul-marks" (e.g., Caesar’s ambition in a quip) presume moral coherence. Here, the "jest" (account books) shows a fractured soul: piety *depends* on dehumanization. The method cannot resolve this without judging the *system*, not just the man.  

  **Second Break: #3 (Individual vs. Collective)**  
  Plutarch writes for the solitary reader seeking self-betterment. But monuments address the *polis*. Who has standing to judge? Descendants of the enslaved? Bristol taxpayers? Plutarch ignores this. The statue’s toppling was a collective scream: "Our city space *is* our character." The museum display then *curates* that scream—a civic, not individual, act. Plutarch’s lens distorts here.  

  **Third Break: #2 (Which 'Jest' Reveals?)**  
  Yes, Victorians saw Colston’s charity as the "revealing detail" of virtue; protesters see the slave-trade profits. Plutarch offers no adjudication beyond his own moral compass. But your insight saves it: **contemporaneous contrast** (Burke’s statue) *is* Plutarchan. If Bristol could honor a critic *in Colston’s own era*, then "man of his time" collapses. That comparison *is* the method working.  

  ### 4. The "Man of His Time" Defence  
  Plutarch *excels* here. His parallel lives exist to test character against context. Cato’s rigidity versus Caesar’s ambition—each era has its spectrum. Colston’s contemporary critics (Burke, Quakers, enslaved rebels) prove his choices weren’t inevitable. The "jest" isn’t that he traded slaves (many did), but that he *doubled down*, investing in human suffering *after* its brutality was exposed. Plutarch would contrast him with John Newton (slave-trader turned abolitionist) and ask: "When the moral injury was known, why did your soul not turn?"  

  ### 5. The Parallel Life  
  **Robert Clive (1725–1774)**  
  - **Why him?** Empire-builder who looted Bengal, funded UK philanthropy. Same toxic alchemy: virtue extracted from colonial violence.  
  - **The Comparison’s Work**:  
    - Both celebrated as "benefactors" in their lifetimes.  
    - Clive’s plunder caused Bengal famine; Colston’s trade fueled racial capitalism.  
    - **The Revealing Detail**: Clive, accused of corruption, slashed his own throat. Colston died rich and revered. Plutarch would ask: "Does Clive’s agony show a conscience Colston lacked?"  
  - **Verdict**: Neither life "teaches" virtue. Both expose how empires launder cruelty into charity. The parallel indicts the system that produced them.  

  ### Your Test—Refined  
  - **(c) "What to do" is un-Plutarchan**. He shapes character, not policy. Replace with: **"It compels the reader to interrogate their own compromises with power."**  
  - **(a) Token vice is a risk**. Strengthen: **The unflattering detail must *reframe* the admired trait.** (Colston’s charity reframed by its funding).  
  - **Add (d)**: **"It locates the subject in their *moral moment*, exposing choices contemporaries condemned."**  

  ### Conclusion  
  The 1895 statue was hagiography. The 2025 plaque is *anti*-hagiography—still indivisible, just inverted. The museum’s graffitied statue comes closest to Plutarch: it shows the "face" (Colston’s bronze visage) defaced by the "soul" (the spray-painted cries of the oppressed). But only if we *write* Colston’s life—with ledgers open—do we meet your test. Plutarch’s method cracks when virtue is vice’s dividend, and when the "reader" is a city screaming in a public square. Yet his demand to seek the revealing fracture in the soul’s mask? That endures.  
    
  **Final verdict**: The Bristol sequence isn’t Plutarchan truth. It’s the *collision* of two hagiographies—one whitewashing, one erasing. The true Plutarchan life remains unwritten on that plinth.
