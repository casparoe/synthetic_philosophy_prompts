  The user needs clear criteria that distinguish between something being constitutive of the mind versus merely causally coupled. They provided specific test cases: a memory notebook, cloud notes with silent corrections, an AR overlay for surgeons, a curated photo archive for someone with brain damage, and a predictive keyboard. The theory must respect key distinctions like constitution vs. causation, extended mind vs. scaffolded agent, cognitive vehicle vs. epistemic responsibility, and mastery vs. being mastered.

  I should outline requirements that address these concerns. Let me think about each case and what it reveals. The border search case shows that seizure should feel like a violation of self, not just property. The care home removing photos demonstrates that loss should cause genuine disorientation. Platform manipulation raises questions about trust and cognitive hijacking.

  For the test cases: the memory notebook clearly seems constitutive if constantly consulted. Silent corrections in cloud notes might undermine agency. The surgeon's AR overlay requires reliable override capability. The curated photo archive highlights issues of access and control. The predictive keyboard challenges where thought generation ends and tool begins.

  Key non-negotiable requirements would include: reliable coupling under normal conditions, functional equivalence to internal processes, transparent integration into cognitive flow, and direct availability without mediation. Negotiable preferences might include portability or multi-user sharing.

  I suspect the transparency requirement might be hardest to satisfy jointly with others, as it demands tools that feel like natural extensions rather than external objects. This could exclude many candidate theories that focus only on functional role without considering phenomenological integration.

  The most excluding requirement is likely "Transparency in Operation" since it demands that the resource feels like part of one's cognitive flow rather than an external tool - a high bar that eliminates most external resources from qualifying as truly mental.
answer: |-
  Here are the desiderata for an adequate theory of cognitive extension, framed for your specific purpose of judging interventions, grounded in your cases, and respecting your stipulated distinctions:

  1.  **Constitutive Coupling Criterion (Non-negotiable):** The theory must provide a test distinguishing *constitutive* dependence (where the resource is part of the cognitive process) from *mere causal coupling* (where it is merely a reliable input/output). *Case:* Seizing a phone at the border should count as a mind-intervention only if the phone was constitutive, not just causally useful. *Distinction:* Directly addresses constitution vs. causation.

  2.  **Functional Equivalence / Parity Principle (Conditionally Non-negotiable):** The resource must play a role functionally equivalent to one played by undisputed internal processes (e.g., recall, calculation) *in the specific context of completing a cognitive task*. However, the theory must *not* infer constitution *solely* from functional equivalence without further criteria. *Case:* A constantly consulted memory notebook should pass; a calculator used occasionally might not. *Distinction:* Core to the extended mind hypothesis, but risks over-extension if used alone.

  3.  **Reliable Coupling & Accessibility (Non-negotiable):** The resource must be reliably available and typically accessed as needed *under normal conditions for the agent*. Intervention disrupts cognition only if this reliable access is broken. *Case:* Removing labelled photos from a dementia patient's room disrupts reliable access, likely constituting a mind-intervention. Seizing a rarely used backup drive might not. *Distinction:* Key for extended mind vs. mere scaffolding.

  4.  **Transparency in Operation (Non-negotiable):** The resource must be "transparent" during skilled use – the agent does not consciously perceive it *as an external tool* but rather attends *through* it to the task/content. *Case:* A surgeon's trained AR overlay, designed for override when drifting, is *not* transparent; a fluent user's predictive text might become so. A cloud app silently correcting saved notes breaks transparency. *Distinction:* Crucial for distinguishing mastered tool from external mediator; addresses vehicle vs. content.

  5.  **Agent Control & Endorsement Potential (Strong Preference - Anti-Hijacking):** The agent must retain ultimate authority and capacity to monitor, veto, or correct the resource's output *if needed*, especially for belief-forming processes. Lack of this potential suggests the resource masters the agent. *Case:* A keyboard completing sentences *before* the user settles violates this; silent cloud edits violate this; the curated photo archive the user cannot inspect or edit fails this. A notebook the user can check and correct passes. *Distinction:* Directly addresses mastery vs. being mastered; vehicle vs. epistemic credit/blame.

  6.  **Personalisation & Biographical Entanglement (Preference - Anti-Generic):** The resource should be deeply integrated into the agent's habits, history, and identity, not merely a generic tool. *Case:* A generic calculator app fails; a personalised, heavily annotated memory notebook passes; the dementia patient's labelled photos pass. *Distinction:* Helps distinguish deeply integrated resources from generic scaffolding; relevant to constitution.

  7.  **(Optional) Portability / Non-Shared Access (Preference - Internalist-Leaning):** Some camps strongly prefer that constitutive resources are portable or not fundamentally dependent on others' ongoing actions. *Case:* The photo archive curated by the wife fails this preference; a personal notebook passes. *Consideration:* Addresses concerns about the "leaky mind" and individual epistemic boundaries.

  **Joint Satisfaction Doubt:** Criteria 4 (Transparency) and 5 (Agent Control) may be difficult to satisfy simultaneously with criterion 7 (Portability/Non-Shared Access) in cases like the curated photo archive. Perfect transparency might reduce the felt *need* for constant control, but the *potential* for control (C5) seems essential for agency, potentially conflicting with resources fundamentally managed by others (C7). C4 and C5 together also create a high bar that many digital tools (like aggressive predictive text) fail.

  **Sorting Your Test Cases (Applying Core Criteria):**
  *   **Memory Notebook:** Passes C1, C2, C3, C4 (if fluent), C5, C6. Likely constitutive.
  *   **Cloud App Silently Correcting:** Fails C4 (intransparent operation), Fails C5 (no endorsement potential/veto), Fails C6 (undermines personalisation). Not constitutive; hijacking.
  *   **Surgeon's AR Overlay (trained to override):** Fails C4 (not transparent, requires conscious monitoring for drift), Passes C5 (override capacity). Not constitutive; a scaffolded tool.
  *   **Curated Photo Archive (cannot inspect/edit):** Passes C1/C2/C3/C6 (potentially). Fails C4 (likely not transparent if access is mediated/limited), Fails C5 (no control/endorsement potential). *Borderline/Debatable:* Deeply integrated and functional but lacks agent control/transparency – likely scaffolded, not extended mind *of the patient* (may be part of a coupled system with the wife).
  *   **Predictive Keyboard (completes before settled):** Fails C4 (intrusive, breaks transparency), Fails C5 (undermines agency, user not in control of settling), Fails C6 (may feel alien). Not constitutive; masters the agent.

  **Answer:**  
  \answer{Transparency in Operation}
