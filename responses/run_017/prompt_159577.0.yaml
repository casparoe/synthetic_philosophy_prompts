prompt: |-
  ok so this is probably a dumb thing to ask about but its been bugging me all week

  Our school is about to make everyone put their phone in a locked pouch during the day. The assistant principal set up a "Student Impact Council" to advise him: eight kids picked by GPA and attendance, they meet once, and theyre the only students in the room. He says he's running it like an experiment — the pouches get tried for one semester and judged on exactly two numbers the district already collects (referrals for phone use, and midterm averages), and anything else anybody notices is "anecdotal" and out of scope. He also says we definately cant tweak the rule mid-year or it'll ruin the data. Oh and the council kids are seniors, they're exempt from the pouches because they're "peer mentors," and they graduate before the review happens.

  Two of my friends keep giving me opposite advice. One says this is fine and obviously good: the people with the data and a model of how the school works should decide, teenagers dont know whats good for them. The other says the only fair thing is a school-wide vote on the pouches and whatever wins, wins.

  I think theyre both missing something and I cant say what. The kids who use their phone to text their ride home, or to pay for lunch in the app, or to message a parent during the day are gonna feel this in ways the council never will. Someone also pointed out the pizza place across the street is gonna lose half its lunch orders and the bus drivers coordinate with kids over text. My friend who does stats says the trial cant even tell whether phones cause the bad grades or whether kids who are already struggling use their phones more — but the AP said that's a question for after the trial. And the vote idea feels hollow too, because everyone would just be voting on a hunch before anything's been tried, and then it's settled either way.

  There's a council meeting tuesday and I get two minutes to speak. What should I actually be asking for? Is the AP's version just the reasonable one and I'm being annoying?

  pls answer as a numbered list, exactly 5 things, one or two sentences each. no intro, no conclusion, just the list
reasoning: |-
  Okay, the user is dealing with a school policy where phones will be locked in pouches during the day. They're concerned about how this decision is being made and want advice on what to say in a two-minute speech to the Student Impact Council. Let me break this down.

  First, the AP's approach involves a council of eight seniors with high GPA and attendance. They're exempt from the policy and won't be affected after graduation. The trial is rigid, focusing only on referrals and midterm averages, dismissing other impacts as anecdotal. The user feels this misses real-life consequences like texting rides, lunch payments, or local businesses affected.

  The user's friends have conflicting views: one supports the data-driven approach, the other wants a school-wide vote. The user sees flaws in both. The stats friend points out correlation vs. causation issues, but the AP postpones that discussion. The vote seems premature since no one has experienced the policy yet.

  Key issues: The council lacks representation from affected groups (underclassmen, those reliant on phones for logistics). The metrics ignore broader impacts (safety, local economy, mental health). The trial's design prevents adjustments, which could cause problems. Also, the seniors on the council won't face the consequences, creating a bias.

  The user needs five concise points for their speech. Each should address specific flaws and suggest improvements. Prioritize actionable requests: expand council diversity, include qualitative data, allow mid-year tweaks, clarify causation analysis, and ensure transparency.

  Need to ensure points are practical and respectful, acknowledging the AP's intent while highlighting gaps. Avoid being confrontational but push for inclusivity and better data collection. Make sure each point is clear and fits within the two-minute limit.
answer: |-
  Here are five things to ask for at the council meeting:

  1.  **Expand the council to include diverse student experiences:** Request adding underclassmen (especially freshmen/sophomores), students reliant on phones for logistics (rides, payments, family contact), and potentially a student representing clubs/activities affected.
  2.  **Include qualitative impact tracking alongside the two numbers:** Advocate for a simple, anonymous survey mid-semester asking about specific challenges (e.g., lunch payments, ride coordination, family contact) to capture real consequences beyond grades and referrals.
  3.  **Allow for minor, documented adjustments mid-semester if critical safety/logistical issues arise:** Argue that refusing any adaptation for "data purity" ignores real harm; propose a process to document and review necessary tweaks without invalidating the core trial.
  4.  **Commit to analyzing causation *after* the trial using the collected data:** Insist the council recommend the district compare phone-use referrals/grades not just before/after, but also *between* high and low phone-use groups *before* the trial to address the correlation/causation question.
  5.  **Guarantee transparency and a student voice in the final decision:** Demand that the full survey results (if implemented) and council feedback are presented publicly before any permanent decision is made, ensuring student experiences directly inform the outcome.
