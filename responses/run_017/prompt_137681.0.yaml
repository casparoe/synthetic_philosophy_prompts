  For economic historians, the main worry is counterfactual credibility. They'll demand empirical identification—how can we verify these alternative paths? I'll craft an objection around their methodological skepticism, noting they'll dismiss unverifiable claims. The reply must emphasize testability through archival evidence but concede some counterfactuals remain speculative.

  The sociologists will focus on mechanism validity. They'll ask how the migration test applies to real cases versus institutional inertia. The reply should offer concrete examples but admit institutional cases are messier than technological ones. This objection isn't fatal if handled well.

  Philosophers will attack modal ambiguity: what does "historically admissible" mean? This is dangerous—if the user can't define the boundaries of possibility, their whole test collapses. The reply needs to clarify "no exogenous shocks" as the limit, but it's still philosophically vulnerable.

  The user's hidden fear seems to be whether functional equivalence trivializes history. If someone asks if their framework makes history irrelevant, that's the nightmare question—it challenges the entire premise. The reply must walk a tightrope between contingency and functionality.

  For concessions: upfront admission that some lock-ins exist (like QWERTY) builds credibility. But the migration test's universal applicability must be defended fiercely—that's the core innovation.

  Finally, labeling the modal ambiguity objection as most critical makes sense—it's where philosophers could dismantle the argument. That gets the \answer{Modal Ambiguity of "Admissibility"} tag.

  Throughout, I'm balancing disciplinary languages while protecting the thesis' weakest points. The structure moves from empirical to conceptual threats, mirroring how Q&A sessions escalate.
answer: |-
  Here’s your Q&A prep sheet, structured for maximum defense and damage control. Objections are ordered by potential lethality, with replies calibrated to your audience’s disciplinary lenses.

  ---

  ### **Concessions to Make Proactively in Talk**
  1. **Concede:** Some cases (e.g., QWERTY) *are* locked in *at the arrangement level*—but emphasize this doesn’t refute functional substitutability.  
  2. **Concede:** The migration test is easier to apply to tech cases (VHS vs. Betamax) than institutional ones (colonial institutions)—but argue it’s still the right *question*.  

  ### **Non-Negotiables (Do Not Concede)**
  1. **Defend:** "Functional shadow" ≠ vacuity. Reject equivalences like "slavery and wage labor both supply labor."  
  2. **Insist:** Lock-in requires *persistent* failure of migration—not just initial contingency.  

  ---

  ### **Objections & Replies**  
  *(Ordered by descending lethality)*  

  1. **Philosopher’s Objection (Fatal if mishandled)**  
     *"Your 'historically admissible coalition' smuggles in contested modal assumptions. Is it physically possible? Technologically feasible? Economically plausible? Without specifying the grounding of 'admissibility,' your migration test is either arbitrary or circular."*  
     **Reply:** "Admissibility is constrained by *actual historical agents’* incentives, knowledge, and institutional access—no exogenous shocks. It’s a test of *endogenous* corrigibility. Soft spot: Vagueness in 'comparable cost' thresholds. I operationalize it case-by-case."  
     **Damage Control:** Cite railway gauge wars (broad vs. narrow gauge coalitions lobbying *within* cost constraints).  

  2. **Economic Historian’s Objection (Fatal if mishandled)**  
     *"Your functional shadows are untestable counterfactuals. How do we 'identify' a shadow arrangement? Without a clear empirical strategy, this is just storytelling."*  
     **Reply:** "We look for *contemporaneous alternatives debated by historical actors* (e.g., Dvorak keyboards in 1930s, Beta’s superiority pre-1980). Natural experiments exist where shadows were adopted locally (e.g., Russian broad-gauge railways). Soft spot: Not all cases have such archives."  
     **Damage Control:** Emphasize cases with documented forks (e.g., AC/DC current wars).  

  3. **Sociologist’s Objection (Severe but absorbable)**  
     *"You privilege 'functional equivalence' over power-locked mechanisms. What about institutions where the *arrangement itself* (e.g., apartheid) serves dominant groups? Your test ignores how dysfunction for the majority can be functional for elites."*  
     **Reply:** "The migration test asks if a *coalition with power/incentives* could improve functional outcomes for *their own goals*. In apartheid, elites blocked migration because the arrangement served *their* function—but it failed society-wide efficiency. Soft spot: Functional units (society vs. faction) need explicit scoping."  
     **Damage Control:** Distinguish societal vs. factional functionality upfront.  

  4. **Economic Historian’s Objection (Absorbable)**  
     *"If path dependence requires failing the migration test at every node, doesn’t that make true lock-in vanishingly rare? Isn’t this just redefining the term to be useless?"*  
     **Reply:** "Yes—that’s the point. 'Lock-in’ should be reserved for genuinely inescapable paths (e.g., nuclear reactor designs with safety trade-offs). Most cases are 'high-switching-cost equilibria'—which *can* be overturned by coalitions (e.g., metric system adoption)."  
     **Soft Spot:** Risks making path dependence seem trivial.  

  5. **Sociologist’s Objection (Absorbable)**  
     *"Your framework can’t discriminate between 'hard' lock-in (no functional shadow) and 'soft' inertia (high switching costs). Why not just call the latter 'persistence' and reserve lock-in for path *inevitability*?"*  
     **Reply:** "I agree—but the literature *calls* QWERTY 'locked in.' I’m pushing back on that rhetoric by demanding proof of inevitability via the migration test."  
     **Soft Spot:** Semantics debate. Refocus on test applicability.  

  6. **Philosopher’s Objection (Absorbable)**  
     *"You treat 'function' as static. But in evolving systems (e.g., digital tech), today’s shadow may be tomorrow’s bottleneck. Doesn’t dynamic functionality undermine your thesis?"*  
     **Reply:** "The migration test is path-relative: At time T, could coalition C shift to a *then-superior* functional alternative? Future bottlenecks don’t invalidate corrigibility at T."  
     **Soft Spot:** Requires historical foresight analysis.  

  7. **General Objection (Absorbable)**  
     *"If functional shadows always exist, doesn’t history become irrelevant? Why study contingency if outcomes are functionally overdetermined?"*  
     **Reply:** "History selects *which* shadow we get—with distributive consequences (e.g., VHS royalties vs. Betamax). Contingency matters for who wins/loses, not whether *a* solution exists."  
     **Soft Spot:** Risks sounding dismissive of historical nuance.  

  ---

  ### **The Question You Hope Nobody Asks**  
  *"In institutional cases (e.g., 'Why the Middle East lagged'), your functional shadows imply that any society *could* have developed growth-compatible institutions. But if geography/culture constrains the set of possible arrangements, doesn’t that make some paths *structurally* locked-in—violating your thesis?"*  
  **Why it’s lethal:** Attacks the core "functional equivalence" claim by suggesting constraints make shadows unreachable. Forces you into a debate about historical constraints vs. your modal criteria.  
  **Reply (Draft):** "Geography/culture shrink the *feasible set* but don’t reduce it to one. The Ottoman Empire debated secular reforms (Tanzimat)—a shadow path. The test asks if agents *within those constraints* could have migrated. 'Structural' lock-in must still fail the test at every node."  

  ---

  \answer{Modal Ambiguity of "Admissibility"}
