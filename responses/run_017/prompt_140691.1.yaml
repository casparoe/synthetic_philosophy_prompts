prompt: |-
  hi — I chair the restitution working group at the Fennimore University Museum (small teaching museum, about 400 objects with colonial-era provenance gaps). We have to bring a recommendation to the trustees in March and I'd really like a draft memo to circulate, because right now the group is going in circles.

  The case: a carved wood and pigment memorial effigy, roughly a metre tall, accessioned in 1947 but collected in 1899 by a colonial district officer during a punitive expedition against the Okwei. It commemorates a war leader, and — this is the bit I keep coming back to — it was made to be impermanent. Figures of this kind were left at a grave site and allowed to weather away as part of the commemoration; they weren't meant to last. Our conservation file says it was consolidated with a synthetic resin and put on a steel armature in 1972, and the base was cut down to fit a display case. So the thing we'd be handing over is preserved in a way its makers apparently didn't intend, and it will never decay now.

  Three claims, and they conflict:
  - The Okwei Heritage Council, speaking through the current Keeper of the Grove, wants it returned to be 'retired' — put back in the grove, allowed to weather, no display, no photography. Complication: our 1899 records describe that office as male-only and the current Keeper is a woman, and one trustee has started using this to argue her claim is a modern invention. I think that's a bad argument but I can't quite say why.
  - A community museum committee, partly diaspora-funded, wants it back and on display locally. They've been explicit that the tourism income matters and that young people should be able to see it.
  - The national museum in the capital claims it under Ndara's heritage law and would show it there. There's a decent chance it's the only legally recognised recipient.

  Legal snag: under our state's rules we can basically only deaccession to another public institution, and we can't transfer anything we have reason to think will be destroyed. Our lawyer says a transfer to the Council is probably a non-starter and has floated two workarounds — transfer title to the Council but keep the object here on indefinite loan, or a rotating three-year cycle between us, the community museum and the capital.

  The group is split roughly down the middle on three things I want the memo to take a position on:

  (1) Is returning it while insisting on our own conditions (climate control, no ritual handling, full documentation) actually restitution, or just guardianship with better PR? My instinct is that the conditions quietly reassert the museum's authority — but I also can't shake the feeling that letting a 120-year-old carving rot is something future Okwei kids might resent us for, and that irreversibility is a real cost rather than just a curator's squeamishness.

  (2) How do we handle the disagreement inside the Okwei claim without us effectively picking which Okwei count as authentic? Is there a way to structure this so we're deferring rather than arbitrating, or is that just a way of hiding that we're arbitrating?

  (3) Does it matter that the object's being here is part of why there's a tourist economy and a diaspora committee with views about display at all? One of our curators says yes — so the display faction's preferences are partly our own creation and shouldn't work as a neutral tiebreaker. Someone else says that's condescending, and I'm not sure they're wrong.

  Also: we hold three more objects from the same 1899 expedition. The Council has said it does not want two of them back, since they belong to a cult the community abandoned. I don't want a memo that quietly commits us to returning all of them or none of them, and I don't want a principle that lets us keep things because a community declined them.

  What I need is a memo with a bottom line the trustees could actually vote on — who gets what, on what conditions, on what timeline, and what happens to the other three — plus the reasoning. And please give the strongest version of whichever position you're not recommending; I definitely know which side I want to win and I need to be able to argue with myself about it in the meeting. Say so if you think the frame of the question is wrong.
reasoning: |-
  Okay, the user chairs a restitution working group at a university museum and needs help drafting a memo for trustees about returning a memorial effigy to the Okwei people. This is clearly a complex, sensitive case with colonial history implications. 

  First, let's unpack the core tensions: The effigy was never meant to be permanent, but the museum altered it physically to preserve it. Now three parties claim it - the traditional council wanting ritual retirement, a community museum wanting display for tourism/education, and the national museum citing heritage law. Legal constraints complicate things further since the museum can only transfer to institutions and can't allow destruction.

  Hmm... The user's stuck on philosophical questions too: Can conditional returns be true restitution? How to navigate internal community disagreements without imposing colonial mindsets? And is the diaspora's display preference valid given the museum itself created that context? 

  What's really sharp here is how the materiality of the object clashes with its current state - the makers intended decay, but conservation made it permanent. That's ethically jarring. The gender challenge to the Keeper's authority feels like a red herring though - colonial records often freeze traditions in time. Smart of the user to sense that's weak.

  The user's practical needs are clear: a vote-ready memo with specific recommendations (who gets what, conditions, timeline) plus handling the three related objects. But deeper down, they probably want to avoid replicating colonial patterns while ensuring the outcome serves Okwei interests best. There's also unspoken stress about group deadlock and looming deadlines.

  For the memo approach, I'm leaning toward recommending return to the community museum. It balances practical legality with cultural access, avoids the irreversible loss the user worries about, and centers living community needs. But we absolutely must present the strongest case for the Heritage Council's position too - that's crucial for the user's prep work. 

  Key angles to emphasize: Conditional returns aren't restitution if they veto core cultural practices. The diaspora's voice matters precisely because colonialism fractured communities. And the altered object now has a new biography - its preservation might serve education despite original intent. 

  For the other objects, we'll propose case-by-case evaluations - no blanket rules. The trustees need to vote on each separately based on future consultations. 

  The gender challenge? We'll shut that down hard in the reasoning. Colonial records don't get to define present-day authority. 

  Biggest risk: The national museum might legally overrule everyone. We should flag that upfront while still advocating for community preference. Timeline needs buffer for that possibility.

  ...Wait, did the user imply they personally favor one outcome? Yeah, they did - but wisely wants counterarguments. We'll structure this to challenge their assumptions either way. That memo framework should force the working group past circular debates into actionable decisions.
answer: |-
  Here’s a draft memo structured to resolve deadlocks, with clear recommendations and counterarguments. The proposed approach prioritizes **return to the community museum** while addressing your core ethical and practical concerns.

  ---

  **MEMORANDUM**  
  **To:** Fennimore University Museum Board of Trustees  
  **From:** Restitution Working Group, Chair  
  **Date:** [Current Date]  
  **Subject:** Recommendation for Restitution of Okwei Memorial Effigy & Related Objects  

  ### I. Executive Summary
  We recommend transferring the Okwei memorial effigy to the Okwei Community Museum Committee under a long-term loan agreement with the National Museum of Ndara (complying with legal requirements), with physical custody alternating every 3 years between the community museum and the national institution. The Heritage Council’s request for ritual retirement is respectfully declined due to legal barriers and broader community needs, but their spiritual authority is acknowledged through ceremonial consultation prior to transfer. The three additional objects from the 1899 expedition will be evaluated case-by-case, starting with renewed consultation.  

  ### II. Recommended Actions & Timeline
  1. **Effigy Transfer:**  
     - **Recipient:** Title transferred to the National Museum of Ndara (legally compliant entity), with physical custody shared via a 3-year rotating cycle:  
       - Years 1–3: Okwei Community Museum  
       - Years 4–6: National Museum of Ndara  
       *(Fennimore University Museum withdraws after transfer)*.  
     - **Conditions:**  
       - Display protocols at both sites require climate control and no physical handling (addressing conservation concerns).  
       - The Heritage Council conducts a private ceremony *before* the object leaves Fennimore to honor its original intent.  
       - Photography permitted only at the National Museum (balancing access and sanctity).  
     - **Timeline:** Transfer by October 2024.  

  2. **Additional Objects:**  
     - Pause restitution decisions on the three related objects.  
     - Launch new consultations (including Heritage Council, diaspora, and Ndaran authorities) by June 2024 to assess each object’s cultural status and preferences.  
     - *No presumption that declined objects remain at Fennimore indefinitely.*  

  ---

  ### III. Reasoning: Addressing Key Dilemmas  
  **1. Conditional Return vs. True Restitution**  
     - **Recommendation:** Conditional display *is* legitimate restitution here.  
       - **Why:** The object’s material reality was irrevocably altered by *our* conservation (resin, armature). Its impermanent spiritual purpose cannot be restored, but its new state offers educational value for Okwei youth and economic agency via tourism. Blocking return over decay conditions prioritizes Western preservation ethics over Okwei self-determination.  
       - **Counterargument (Heritage Council position):** Imposing display conditions perpetuates colonial control. True atonement requires accepting the effigy’s complete return to its intended lifecycle—even if that means decay. Our duty is to repair harm, not dictate outcomes.  

  **2. Navigating Internal Okwei Divergence**  
     - **Recommendation:** Defer to the community’s *contemporary* governance structures.  
       - **Why:** The Heritage Council’s gender-based legitimacy challenge is invalid: colonial records cannot freeze cultural evolution. However, the Community Museum Committee represents democratically engaged Okwei voices (including diaspora) advocating for broad access. By transferring via the National Museum (legally required) while prioritizing community display, we avoid arbitrating authenticity.  
       - **Ceremonial Role:** Inviting the Keeper to perform pre-transfer rites acknowledges spiritual authority without granting veto power.  
       - **Counterargument:** Sharing custody risks inflaming tensions. The Heritage Council’s ritual claim is ancient; the display faction is a product of colonial disruption. We risk endorsing a "modern" identity shaped by our presence.  

  **3. Our Role in Creating the Display Preference**  
     - **Recommendation:** Acknowledge, but do not overcorrect.  
       - **Why:** While tourism/diaspora interest arose partly from our possession, the Community Museum’s plan for local education and sovereignty is valid *now*. Dismissing their stance as "tainted" denies Okwei agency. Our focus should be repairing harm, not engineering outcomes.  
       - **Counterargument:** The display faction’s existence *is* a legacy of violence. Prioritizing their view rewards our own historical wrongs. True humility requires accepting the Heritage Council’s less "convenient" request.  

  ---

  ### IV. Strongest Case for the Alternative (Heritage Council Position)  
  *If the Working Group favors ritual retirement, we recommend:*  
  - Transfer title to the National Museum of Ndara.  
  - The National Museum loans the effigy to the Heritage Council for retirement, assuming legal risk under Ndara’s heritage laws.  
  - Fennimore advocates to the state for a legal exemption citing ethical necessity.  
  **Rationale:** Unconditional return accepts that restitution’s cost may include loss. The effigy’s spiritual significance outweighs its material preservation. Colonial violence stole not just an object but a sacred process; we cannot compound this by imposing our values. If decay occurs, it is the *conclusion* of a ritual we interrupted—not destruction.  

  ---

  ### V. Critical Notes  
  - **Legal Workaround:** Our lawyer’s "indefinite loan to Fennimore" proposal fails as restitution—it is institutionalized retention. Rotation respects both legal constraints and Ndaran agency.  
  - **Gender Legitimacy:** The trustee’s objection undermines contemporary Okwei self-governance. Colonial records reflect *their* biases, not immutable truth.  
  - **Other Objects:** Each will be assessed individually. Community rejection of an object doesn’t justify our retention; alternatives include transfer to the National Museum or ethical disposal.  

  **Proposed Trustee Vote:**  
  *"Approve transfer of the Okwei effigy to the National Museum of Ndara under a 3-year rotating custody agreement with the Okwei Community Museum Committee, with ceremonial consultation by the Heritage Council prior to transfer."*  

  ---  
  **Chair’s Signature**  

  ---  
  ### Why This Framework?  
  This ends circular debate by:  
  1. Accepting legal reality (National Museum as title holder) while centering community access.  
  2. Separating spiritual authority (Heritage Council) from physical stewardship (Community/National Museum).  
  3. Treating the altered effigy as a *new* cultural artifact with modern utility.  
  4. Rejecting false binaries ("all or nothing," "authentic vs. modern").  

  The memo preempts trustees’ legal anxieties while advancing ethical restitution. For your meeting: stress that *not* acting perpetuates harm—and rotation is a transitional step toward full community control.
