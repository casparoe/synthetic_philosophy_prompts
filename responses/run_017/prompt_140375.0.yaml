prompt: |-
  I'm on the rotating duty-editor shift at a small public-health evidence service — twice a week, and three or four times a shift I have to write the one-line "bottom line" that sits on top of an evidence summary, in about ten minutes, and a second person has to sign it off before it goes up. The catch is that the same line is read by members of the public, by clinicians deciding what to do that afternoon, and gets lifted verbatim by reporters, so I can't tune how strong it is to one audience.

  Can you write me a procedure for deciding when it's OK to come out and state a claim, when to hedge it, and when to say nothing? Ground it in whatever philosophy of language actually says about the norms of assertion — knowledge vs. truth vs. reasonable belief vs. whatever else is on the table — but in a form someone with no philosophy and ten minutes can run. So: the questions in order, what counts as a good enough answer to each, where the procedure just returns "don't assert", and where it has to hand the decision to a person because it's a values call and not an epistemic one. Two wrinkles I'd like it to actually handle: (1) I'm usually speaking for the service, and I personally have not read the studies — so who is asserting, and whose epistemic position has to be good enough? (2) sentences that are true and that I do know, but which reporters will read as saying something stronger.

  Then run it on three: an n=200 preprint finding that a common supplement cuts hospitalisation; the same-day question "is this new variant spreading through the air?" where all we have is one small observational study; and a line about a booster rollout expanding next week that I know from an embargoed government briefing but can't give a reason for. Don't soften the second one — I have a feeling the procedure is going to tell me to shut up, and I want to know whether that really follows.

  Finally, say which steps are judgment calls dressed up as procedure, and where the whole thing will misfire.
reasoning: |-
  Okay, the user is a duty editor at a public health evidence service, needing a quick procedure for writing "bottom line" summaries. These summaries are read by the public, clinicians, and journalists, so they must be accurate and not misleading. The main challenge is deciding when to state a claim confidently, when to hedge, and when to stay silent. The user hasn't read the studies themselves, so there's an issue of epistemic responsibility. Also, true statements might be misinterpreted as stronger claims.

  First, I need to ground this in the philosophy of assertion. The knowledge norm suggests you should only assert what you know. But here, the editor isn't the original researcher. So maybe it's about reasonable belief based on institutional credibility. The service's reputation adds weight, so assertions must meet high evidence standards.

  Key elements: The procedure must be quick, handle different evidence strengths, and address whose knowledge matters. The editor relies on the service's processes, so it's the institution's epistemic position. Also, managing misinterpretation is crucial—even true statements can be misleading if taken out of context.

  Wrinkles: 
  1. The editor hasn't read the studies. So the procedure must reference the service's vetting process. If the summary is approved, the institution backs the claim.
  2. Reporters might overinterpret. Need to flag statements where phrasing could imply more certainty than exists. Maybe a step to check for implied claims.

  Three scenarios:
  1. N=200 preprint on supplements reducing hospitalization. Preprint, small sample—requires hedging. Use "may" and mention it's preliminary.
  2. New variant airborne via one observational study. Weak evidence. Procedure should say "don't assert" because it's too uncertain and could cause panic or misinformation.
  3. Booster rollout from embargoed info. True but can't cite. Here, the issue isn't truth but authority. Since it's official but embargoed, maybe state without evidence but clarify source isn't citable. But journalists might question it, so risk of undermining trust. Probably best to wait until public announcement.

  Steps in the procedure:
  1. **Truth Check**: Does the service endorse the statement? If no, don't assert. If yes, move on.
  2. **Knowledge Check**: Is the evidence solid (peer-reviewed, multiple studies)? Or weak (preprint, small sample)? Strong evidence allows direct assertion; weak needs hedging.
  3. **Misinterpretation Check**: Could this be taken as stronger? If yes, rephrase or hedge.
  4. **Value Judgment**: Does this have high stakes? If uncertain and high stakes, maybe don't assert. But the user wants no softening in the second scenario, so the procedure must stick to epistemic norms even if it means silence.

  For the airborne variant scenario: One observational study is insufficient. Asserting could mislead. Even hedging might not prevent panic. So "don't assert" is correct. The user's suspicion is right.

  The booster example: The info is true, but the source can't be cited. Asserting without evidence might harm credibility. Since it's embargoed, the service shouldn't break embargo. Wait until official release. So "don't assert" here too.

  Judgment calls: Assessing evidence strength (peer-reviewed vs. preprint) is somewhat objective, but interpreting "sufficient" might vary. Misinterpretation risk is subjective—requires anticipating audience perceptions. High-stakes decisions involve values, like whether potential benefit outweighs risk of being wrong.

  Misfires: If the service's summaries are inconsistent, the procedure fails. Also, in crises, the need for quick info might pressure editors to assert prematurely. The procedure might be too rigid, causing delays when timely info is crucial.
answer: |-
  Here's a procedural decision tree for your "bottom line" assertions, grounded in the **knowledge norm of assertion** (Williamson, 2000: Only assert what you *know*), adapted for institutional speech and public health pragmatism. It prioritizes preventing harm from over/under-assertion and handles your wrinkles. Use the **5-minute version** (bolded) in practice; the details are for justification.

  ---

  ### **The Assertion Decision Procedure**  
  **(5-Minute Version)**  
  1. **TRUTH CHECK:** *Can the service institutionally endorse this as true?*  
     - ✅ **Good enough:** Internal consensus + evidence summary supports it.  
     - ❌ **Fail → DON'T ASSERT** (e.g., conflicting evidence, unsupported claim).  
     - *Who asserts?* The *service* asserts, so *its* epistemic position (via reviewers/processes) must be solid. You're its proxy.  

  2. **KNOWLEDGE CHECK:** *Is the evidence strong enough to say we "know" this?*  
     - ✅ **Good enough (Strong):** Peer-reviewed, multiple lines of evidence, low bias → **STATE DIRECTLY** (e.g., "Vaccine X reduces severe disease").  
     - ⚠️ **Partial (Weak):** Preprint, small/non-randomized study, indirect evidence → **HEDGE** (e.g., "may reduce," "suggests," "preliminary evidence").  
     - ❌ **Insufficient:** Single weak study, speculation → **DON'T ASSERT**.  
     - *Your role:* You rely on the service's evidence grading. If the summary labels it "low certainty," hedge or skip.  

  3. **MISINTERPRATION CHECK:** *Is this true but likely to be misread as stronger?*  
     - ✅ **Safe:** No stronger implication (e.g., "Booster rollout expands Tuesday" ≠ "Boosters are effective").  
     - ⚠️ **Risky:** True statement implies false certainty (e.g., "Variant X found in air samples" → misread as "proven airborne spread") → **REPHRASE OR HEDGE**.  
     - ❌ **Unfixable:** Rephrasing can't prevent harmful misreading → **DON'T ASSERT**.  

  4. **VALUES CHECK:** *If uncertain, would asserting/hedging cause high-stakes harm?*  
     - ❗ **Judgment call:** Weigh public interest vs. risk of error (e.g., panic from overstatement vs. inaction from understatement). If net harm likely → **DON'T ASSERT**.  
     - *Not epistemic:* This step is pure values. Default to caution unless urgency outweighs risk.  

  ---

  ### **Applied to Your Cases**  
  **Case 1: n=200 preprint on supplement reducing hospitalization**  
  - **Truth:** Service endorses? Likely yes (if summary approved).  
  - **Knowledge:** Preprint + small n → **Weak evidence** → Requires hedge.  
  - **Misinterpretation:** "Supplement cuts hospitalization" could be misread as clinical advice → Add "preliminary."  
  - **Values:** No urgent harm in hedging.  
  - **Bottom Line:** ✅ **HEDGE**  
    *"Preliminary data from a small study suggest [Supplement] may reduce hospitalization risk; peer review pending."*  

  **Case 2: "Is this new variant spreading through the air?" (1 observational study)**  
  - **Truth:** Service endorses airborne spread? Unlikely with one study.  
  - **Knowledge:** Single observational study → **Insufficient for "knowing" transmission route** → ❌ DON'T ASSERT.  
  - **Misinterpretation:** Any assertion (e.g., "air samples positive") implies actionable transmission risk → Unfixable.  
  - **Values:** High harm if wrong (panic, misallocated resources).  
  - **Bottom Line:** ❌ **DON'T ASSERT** (as suspected). State only: "Current evidence on transmission is limited; updated guidance pending further data."  

  **Case 3: Booster rollout expansion (embargoed gov briefing)**  
  - **Truth:** Service endorses? Yes (via reliable briefing).  
  - **Knowledge:** You *know* it’s true (official source) → **Strong evidence for the fact**.  
  - **Misinterpretation:** "Boosters expand Tuesday" is literal truth → but reporters may assume *you’re confirming efficacy*. Rephrase to avoid implication.  
  - **Values:** Harm if public misses timely news → Assert with neutral phrasing.  
  - **Bottom Line:** ✅ **STATE DIRECTLY** (with no justification)  
    *"COVID-19 booster eligibility expands to [group] starting Tuesday, [date]."*  

  ---

  ### **Where Judgment Masquerades as Procedure**  
  1. **Knowledge Check "Strength" Threshold:** Deciding if evidence is "strong enough" (peer-reviewed vs. preprint) relies on institutional norms—not objective rules.  
  2. **Misinterpretation Risk:** Anticipating how reporters/public will read a line is subjective. Bias toward overestimating audience nuance is common.  
  3. **Values Trade-offs:** Weighing "public interest" vs. "risk of error" (Step 4) is inherently values-driven. The procedure can't resolve this.  

  ### **Where the Procedure Misfires**  
  - **Institutional Failure:** If evidence summaries are poorly vetted, the Truth Check collapses.  
  - **Crisis Speed:** In emergencies (e.g., pandemic onset), 10 minutes may force over-hedging or under-assertion.  
  - **"True but Misleading" Trap:** Some claims (e.g., "Variant X detected in wastewater") can’t be made safe—silence may be the only option, sacrificing utility.  
  - **Your Role:** If you *personally* doubt the service’s endorsement (e.g., you spot a flaw), the procedure ignores this. It assumes institutional infallibility.  

  **Philosophical Grounding:** This hybridizes the **knowledge norm** (require "knowing" for assertion) with **contextual pragmatism** (Lackey, 2007: Assertions carry social risks). For institutional speech, the "knower" is the *service* (via its processes), not you—resolving your first wrinkle. The second wrinkle (misinterpretation) is handled by integrating **Gricean implicature** (avoid unintended inferences) into Step 3.  

  **Final Tip:** When stuck, default to: "The evidence currently suggests X, but further data is needed." This hedges strength but asserts relevance—balancing epistemic rigor and public duty.
