prompt: |-
  so here's the situation. I'm on a tiny team (four people) trying to decide whether to go ahead with a project that, as far as we can tell, has been attempted a handful of times in adjacent fields and basically never landed on time or on budget. Two of us built a fairly detailed causal model of why our version should take about a year; one of us keeps saying that's exactly what the planning-fallacy literature predicts everyone says, and that we should just look at the base rate for projects of this shape and multiply by three. I don't want to settle our argument. I want the spec: what would an actual theory of *when to defer to the outside view* have to get right in order to count as adequate for making a real decision like this? Not a vibe, not "use base rates when available," a list of requirements with the case or consideration behind each.

  A few things I already think belong somewhere on the list, but you place them and add what I'm missing: the difference between a reference class that's similar in *mechanism* (shared causal structure) and one that's similar only in *outcome statistics*, and what to do when the narrowest mechanically-similar class and the narrowest outcome-similar class point in opposite directions; the "we excised the cause" move, where your inside view names the specific thing that killed the historical cases and claims to have removed it, versus the fact that probably every team in the class had some story like that — I want a requirement that says what evidence would separate those two without just defaulting to "assume you're average"; the fact that reference classes can be *endogenous*, i.e. if everyone deferred to the base rate then only teams with unusually strong inside-view reasons would attempt, which changes the base rate the next person should use, so the theory can't treat the numbers as handed down from nowhere; the fact that choosing the reference class is itself a judgment call exposed to the same overconfidence, so the theory has to say where the regress stops or why it isn't vicious; the distinction between using the outside view as a *point estimate*, as a *calibration check on your model*, and as a *decision threshold*, since a class with enormous spread can be useless for the first and fine for the second; and what the outside view even *is* in a first-of-a-kind case where the only classes that contain you are absurdly broad. Also, please keep separate two things I notice people run together: modesty about your own reliability as a forecaster, and deference to a base rate about your case — you can be maximally modest about yourself and still think the class says nothing about you, or be beautifully calibrated and still owe deference, so a theory that collapses them is hiding something.

  For each requirement say which case motivates it, and mark which ones are non-negotiable and which are just the preferences of one camp. The part I care most about: tell me which subset of the desiderata you think can't be jointly satisfied — my guess is that "must be sensitive to genuinely diagnostic inside-view information" and "must not be exploitable by self-serving claims of exceptionality" are secretly the same requirement pulling in two directions, but you tell me where the real impossibility is, since if the list is itself unsatisfiable that's the interesting result. And say which single requirement does the most work in ruling out the usual rules of thumb (always defer where a class exists; defer unless you have a mechanism; split the difference; defer to the narrowest class containing you; outside view as sanity check only). A short scorecard for those at the end is fine, but keep the weight on the criteria — that's the part I actually want to think with. Oh, and write it so I could hand it to the teammate who disagrees with me without it reading like it was written for my side.
reasoning: |-
  Hmm, this is a fascinating and highly specific request about decision theory under uncertainty. The user is on a small team debating whether to proceed with a project that historically has poor outcomes, and they want a rigorous framework for when to defer to base rates (outside view) versus their own model (inside view). 

  First, I need to unpack the complexity here. The user has clearly done their homework - they're referencing planning fallacy literature, causal modeling, and several nuanced conceptual distinctions. Their frustration with superficial "rules of thumb" is palpable. What they're really asking for is a decision-theoretic specification that would stand up to academic scrutiny.

  Key challenges I notice:
  - They want operational criteria, not vague principles
  - They're aware of multiple philosophical pitfalls (endogenous reference classes, self-serving exceptionalism)
  - They suspect some desiderata might be fundamentally incompatible
  - They need this to be neutral enough to share with their skeptical teammate

  The user's pre-identified issues are all valid:
  1. Mechanism vs outcome similarity in reference classes
  2. The "we fixed it" claim vs universal overconfidence
  3. Endogeneity problems (selection bias in attempts)
  4. Reference class selection regress
  5. Different uses of outside view (point estimate vs calibration)
  6. Novelty problem (broad reference classes)
  7. Crucially, separating epistemic humility from base rate deference

  For the framework, I'll structure it as testable requirements with:
  - Formal label
  - Motivation case
  - What it must handle
  - Non-negotiable status

  The real tension does seem to be between Requirement 3 (allowing genuine diagnostic evidence) and Requirement 4 (preventing self-serving exceptions). These pull in opposite directions - one demands sensitivity to unique evidence, the other demands immunity to biased narratives. The impossibility manifests when evidence is ambiguous, which it often is.

  For scoring common heuristics:
  - "Always defer" fails Requirement 3
  - "Defer unless mechanism" fails Requirement 5
  - "Split difference" fails Requirement 2
  - "Narrowest class" fails Requirement 6
  - "Sanity check only" fails Requirement 7

  The most powerful requirement is probably Requirement 4 (immunity to universal excuses) because it exposes the planning fallacy's core pattern - every failing team thought they were special.

  This needs to be presented without favoring either side of their team debate. The tone should be clinically precise - more like a technical specification than philosophical discourse. Specific historical examples (space probes, construction) will ground it. The conclusion should acknowledge the fundamental tension without resolving it - that's the honest answer.
answer: |-
  Here’s a specification for a theory of when to defer to the outside view, structured as testable requirements. Each requirement is motivated by a concrete case, marked for negotiability, and designed to address the tensions you identified. The goal is **procedural rigor**, not favoring your position or your teammate’s.

  ---

  ### **Core Requirements for an Adequate Theory**  
  *(Non-negotiable = Fundamental to avoiding systematic error; Negotiable = Context-dependent)*  

  1. **Requirement: Explicit Treatment of Causal Structure**  
     - **Motivation**: Apollo program vs. generic "moon missions." Apollo succeeded due to unique political/funding mechanisms; most historical moon missions failed. If your project shares causal drivers (e.g., novel material constraints), the outside view must weigh mechanistic similarity over outcome statistics.  
     - **Must Handle**: When mechanistic class (e.g., "first-principles engineering under budget constraints") and outcome class (e.g., "all aerospace projects") conflict.  
     - **Non-negotiable**: Yes. Without this, base rates ignore why past projects failed/succeeded.  

  2. **Requirement: Evidence Threshold for Claiming Exception**  
     - **Motivation**: The Sydney Opera House (10× over budget). Every team claimed "we solved the cause" (e.g., "better software tools"), but almost all were wrong. A valid exception requires:  
       - (a) Identified a *specific, falsifiable* failure mechanism from past cases,  
       - (b) Evidence that your solution *breaks the causal link* (e.g., a prototype proving the new method avoids the bottleneck).  
     - **Must Handle**: Distinguishing genuine causal intervention ("we excised X") from universal overconfidence ("we’re better planners").  
     - **Non-negotiable**: Yes. Prevents self-serving exceptionalism without defaulting to "assume you’re average."  

  3. **Requirement: Adjustment for Endogenous Reference Classes**  
     - **Motivation**: Mutant startup paradox. If only confident teams attempt hard projects, the base rate of failure is inflated *because* optimistic teams dominate the sample. Deference must adjust for selection bias:  
       - If your team has evidence placing you outside the selected group (e.g., "we have a patent solving the core risk"), the base rate may not apply.  
     - **Must Handle**: When the reference class is a product of prior decisions (e.g., "teams who tried quantum encryption startups").  
     - **Non-negotiable**: Yes. Base rates aren’t "natural laws"; they reflect historical decisions.  

  4. **Requirement: Immunity to Universal Excuses**  
     - **Motivation**: Construction projects (e.g., Boston Big Dig). Every team claimed unique advantages ("better contractors," "new tech"), yet 90% still overran. The theory must discard claims *every* failed team could make (e.g., "we care more").  
     - **Must Handle**: Overconfidence masquerading as insight.  
     - **Non-negotiable**: Yes. The "planning fallacy" pattern is defined by universal overclaiming.  

  5. **Requirement: Distinction Between Use Cases**  
     - **Motivation**: Developing fusion power (high spread). The outside view’s 5–50 year estimate is useless for scheduling but critical for risk capital allocation. The theory must specify whether it provides:  
       - **Point estimate**: Only if reference class is tight (±20% spread).  
       - **Calibration check**: Flags overconfidence if inside-view estimate is outside 90% CI of class.  
       - **Decision threshold**: "If >80% of similar projects fail, abandon unless Requirement 2 is met."  
     - **Must Handle**: Noisy data. Broad classes can inform decisions without yielding precise forecasts.  
     - **Negotiable**: Implementation depends on stakes.  

  6. **Requirement: Handling First-of-a-Kind Cases**  
     - **Motivation**: SpaceX’s first reusable rocket. The narrowest mechanistic class ("private orbital launch") had no successes; broader classes ("complex hardware projects") ignored key innovations. Adequate theory must:  
       - Decompose the project into subcomponents with existing reference classes (e.g., "carbon-fiber tank manufacturing").  
       - Use the outside view to stress-test each component’s risk.  
     - **Must Handle**: When no suitable class exists. Fall back to "fractal outside view" (subsystem base rates).  
     - **Non-negotiable**: Yes. True novelty is rare; most projects are novel combinations of existing parts.  

  7. **Requirement: Stopping Rule for Reference Class Regress**  
     - **Motivation**: Choosing between "software projects" and "AI projects" for an AI startup. The theory must:  
       - Prioritize mechanistic similarity (Requirement 1),  
       - Default to broader classes only after exhausting causal matches,  
       - Quantify uncertainty via confidence intervals (wider class → wider CI).  
     - **Must Handle**: Avoiding arbitrary class selection. Use Ockham’s Razor: The simplest class capturing >80% of causal drivers.  
     - **Negotiable**: Thresholds can vary.  

  8. **Requirement: Decoupling Epistemic Modesty from Base Rate Deference**  
     - **Motivation**: A calibrated forecaster (e.g., superforecaster) assessing a novel vaccine platform. They may be modest (assign high uncertainty) yet rationally reject base rates if mechanistic evidence dominates (e.g., "this platform sidesteps past failure modes").  
     - **Must Handle**: Distinguishing "I am unreliable" from "this base rate is irrelevant."  
     - **Non-negotiable**: Yes. Prevents conflation of personal calibration with case-specific evidence.  

  ---

  ### **The Central Tension: What Cannot Be Fully Resolved**  
  **Requirement 2 (Evidence Threshold)** and **Requirement 4 (Immunity to Universal Excuses)** are in fundamental conflict:  
  - **Why they pull apart**: Genuine exceptions *exist* (e.g., SpaceX cracking reuse), but most "we fixed it" claims are noise.  
  - **The impossibility**: There is no objective way to validate "diagnostic evidence" *ex ante* without hindsight. High-quality evidence (Requirement 2) reduces but never eliminates the risk of self-deception (Requirement 4).  
  - **Implication**: The theory must force explicit burden of proof: *You* must prove your exception is not a universal excuse. Default remains the outside view unless Requirement 2 is satisfied.  

  ---

  ### **Scorecard: Why Common Heuristics Fail**  
  | Heuristic                          | Fails Requirement(s)                     | Why                                                                 |  
  |------------------------------------|------------------------------------------|---------------------------------------------------------------------|  
  | "Always defer to base rates"       | 2, 3, 8                                  | Ignores causal exceptions, selection bias, and diagnostic evidence. |  
  | "Defer unless you have a mechanism"| 6, 7                                     | Undefined for novel cases; arbitrary mechanism claims slip through. |  
  | "Split the difference"             | 5, 8                                     | Treats inside/outside as equally weighted priors; misuses spread.   |  
  | "Use narrowest reference class"    | 1, 3, 7                                  | May select outcome-similar but mechanistically irrelevant classes.  |  
  | "Outside view as sanity check only"| 4, 5                                     | Underweights base rates; lets overconfidence hide behind "caution." |  

  **Strongest Requirement**: **#4 (Immunity to Universal Excuses)** does the heaviest lifting. It kills the "we’re different" illusion by exposing that *every* team thought they were different. Rules of thumb fail here because they lack filters for empty exceptionalism.

  ---

  ### **How to Use This with Your Team**  
  1. Map your debate onto the requirements:  
     - Your causal model → Requirement 1 (mechanistic class).  
     - Your teammate’s base rate → Requirement 4 (universal excuses).  
     - Your "we fixed it" claim → Requirement 2 (evidence threshold).  
  2. Identify where you disagree:  
     - Is it about the *validity* of your exception (Req 2)?  
     - Or the *relevance* of the reference class (Req 1)?  
  3. Force explicit burdens:  
     - You: "What evidence would satisfy Req 2 that we’ve broken the causal chain?"  
     - Them: "What part of Req 4 does our ‘exception’ not trigger?"  

  This won’t resolve disagreement, but it shifts the debate from "vibes" to testable criteria. The theory’s value is in making the conflict legible. If your "exception" evidence is weak (e.g., "better team morale"), Requirement 4 should win. If you have a prototype proving a critical risk is solved, Requirement 2 can override the base rate. Either way, the decision is clearer.
