prompt: |-
  In three weeks I'm giving the closing talk at a weekend rationalist gathering — about sixty people, mostly longtime LessWrong and ACX readers, a substantial effective-altruism contingent, two professional moral philosophers who are friendly outsiders to the community, and one economic historian who works on the British Caribbean and got dragged along by her partner. I have forty minutes plus twenty of Q&A. I want a prep sheet for the Q&A, not a defense of the thesis: the objections I will actually get, ordered by how much damage they'd do weighted by how likely they are, each phrased the way that person would phrase it, each with a two-minute reply and an honest note on where the reply is soft.

  The thesis I'm defending: large-scale moral revolutions are driven by changes in what it is honorable to be seen doing, not by moral argument and not primarily by material interest. The corollary I care about, and the reason this room will be hostile, is that argument aimed at changing moral belief is close to inert at the population level, and the active lever is the prestige economy of the reference group whose regard the practitioners actually want.

  Sketch of the argument, so you have something to aim at. Three moves. First, against the argument-first story: the case against chattel slavery and the case against dueling were both fully articulated and widely available generations before the practices ended, and the historical record doesn't look like people being reasoned out of a conviction; it looks like the arguments getting sharper and more popular after the practice became indefensible. Second, against the interest-first story: the same material conditions were compatible with the practice continuing indefinitely — slave-grown sugar was enormously profitable right up to abolition, and dueling persisted longest precisely among officers whose careers depended on a reputation for willingness to fight — so interests don't select which equilibrium you get, and where interests and abolition coincide the coincidence often runs through what it had become respectable to be seen doing. Third, the positive claim: what ends these practices is that the people whose esteem the practitioners need withdraw it, so continuing becomes not merely inexpedient or unsound but dishonorable; the mechanism is the desire to be able to hold your head up in front of specific others, not updating on evidence. I also plan to offer an operationalization, since this audience will demand one: norm change should propagate along admiration and esteem networks faster than along information-exposure networks, and the rhetoric should improve after the collapse rather than before it.

  Some things about this specific room. Most of them have a self-conception built on the idea that reasoning well and arguing in good faith is how beliefs improve, so my thesis attacks something load-bearing for them. The EA contingent will not care about the history except instrumentally: they want tractability numbers, base rates, and an answer to what anyone should do differently on Monday. The two philosophers will go after the framework rather than the cases — I expect one of them to insist that the causal story about how a belief changed is orthogonal to whether the belief is justified, and that I'm smuggling in a debunking argument I haven't earned. The economic historian knows the primary literature cold and will object that I've cherry-picked cases where the practice was already in structural decline, and that honor is a post hoc gloss on a shift in bargaining power.

  Three requests. Concede nothing for me that I shouldn't concede, but tell me what to give away in the first two slides before anyone objects — my instinct is to grant up front that honor and interest are nearly impossible to disentangle in the archival record, and that my sample is three cases with the outcome known in advance. Second, tell me which single reply has to land for the thesis to survive the hour. Third, give me the question I'm hoping nobody asks, and a first sentence for answering it.

  Two kinds of objection I don't need, because I already have answers: the self-referential one about why I'm bothering to give a talk, and bare correlation-isn't-causation. I want the objections past those — the ones that actually bite on the mechanism rather than on the framing. And no citations or suggestions for further reading, please; I've done the reading, I need the object-level arguments and what to say back.
reasoning: |-
  Okay, the user is preparing for a Q&A session after their talk at a rationalist gathering. They need a prep sheet that anticipates potential objections to their thesis about moral revolutions being driven by changes in honor rather than moral arguments or material interests. Let me start by understanding their main points and the audience.

  First, the thesis: large-scale moral change happens when what's honorable shifts, not through arguments or material interests. The audience includes LessWrong and ACX readers, EAs, two philosophers, and an economic historian. Each group will have different concerns. The rationalists value reasoning, so challenging that might make them defensive. EAs want actionable insights. Philosophers might question the framework, and the historian could accuse cherry-picking.

  The user provided three moves: against argument-first, interest-first, and the positive claim about esteem networks. They also mentioned operationalization: norm change propagates through admiration networks faster than information networks.

  Key requests: concede upfront that honor and interest are hard to disentangle and the sample is small. Identify the key reply that must land—probably the counterfactual where arguments existed but practice continued. Prepare for the toughest question, maybe about modern applicability.

  Now, considering objections. The philosophers might argue that causal stories don't affect justification. The historian might say honor is a gloss over structural shifts. EAs want tractability. The rationalists might worry about abandoning reason.

  For each objection, I need to phrase it as the person would, provide a two-minute reply, and note weaknesses. Prioritize by damage and likelihood. High damage: the historian's cherry-picking and philosophers' framework issues. Likely: EA's tractability concerns.

  The crucial reply is showing that arguments were present but ineffective until honor shifted. Without that, the thesis crumbles. The toughest question might be about applying this to modern issues like AI ethics, where the user needs to pivot carefully.

  Also, upfront concessions: admit entanglement of factors and small sample size. That preempts some criticism. Structure the prep sheet with objections ordered by threat level, starting with the historian, then philosophers, EAs, and rationalists.

  Need to ensure replies are concise, hit the key points, and acknowledge soft spots. For example, conceding that interests matter but aren't sufficient alone. Highlighting that the mechanism is about social perception, not just rationality.
answer: |-
  Here’s a prep sheet prioritizing high-damage/likely objections tailored to your audience. I’ve ordered them by threat level (damage × likelihood), phrased as the interlocutor would, with a tight reply and a soft-spot note. **Your critical reply to land is the counterfactual for arguments** (Objection #1 reply).

  ### Preemptive Concessions (Slide 2)
  - **Concede:** "Honor and material interest are empirically entangled; my claim is that interest alone *doesn’t select the equilibrium*. When they align, honor is the transmission belt."  
  - **Concede:** "Yes, I’ve selected ‘positive’ cases (slavery/dueling/footbinding?) where the outcome is known. This is a weakness—but if my mechanism fails here, where we *see* collapse, it’s damning."  

  ---

  ### Objections & Replies  
  **#1: Economic Historian**  
  *Phrased:* "You’ve reversed cause and effect. The British abolition campaign succeeded because sugar profits were *already* falling with Caribbean soil exhaustion and competition from beet sugar. Honor was elite cover for shifting class interests—not the driver."  
  **Reply:** "Soil exhaustion was known in 1750; abolition came in 1833. Beet sugar wasn’t competitive until *after* 1840. Crucially: when abolition *hurt* planters (e.g., compensated emancipation cost £20m—40% of the budget), the ‘honor shift’ (e.g., Wilberforce making ownership shameful in Parliament) *preceded* the cost. Interests didn’t change; the cost of *ignoring* honor did."  
  *Soft spot:* Doesn’t refute that structural decline made honor *cheaper* to adopt.  

  **#2. Philosopher (Debunking Smuggle)**  
  *Phrased:* "You’re conflating causal origins with justification. That honor explains belief change doesn’t imply moral arguments are invalid—just that sociology matters. Why should this discourage good-faith argument?"  
  **Reply:** "I’m not attacking justification. I’m attacking *efficacy*. If you want to change norms, you’re playing a prestige game whether you like it or not. Ignoring that wastes energy: abolitionists won by making ownership socially toxic in elite clubs, not just by publishing pamphlets."  
  *Soft spot:* Doesn’t prove argument is *irrelevant*—just that it’s insufficient alone.  

  **#3. EA Contingent (Tractability)**  
  *Phrased:* "Assume you’re right. What’s the lever? ‘Change what’s honorable’ is tautological. How do we *operationally* shift prestige incentives for, say, AI risk mitigation?"  
  **Reply:** "Map the admiration network. Who do decision-makers (e.g., tech CEOs, regulators) want approval from? Make *their* stance on AI safety a status marker *in that group*. Example: Effective self-regulation as a ‘reliable grown-up’ badge. Not ‘win arguments’—win the social incentive."  
  *Soft spot:* Vague on *how* to implant new status markers without existing credibility.  

  **#4. Rationalist Core (Self-Conception)**  
  *Phrased:* "This is fatalism with extra steps. If argument doesn’t work, why have forums? Should we just manipulate social rewards and abandon truth-seeking?"  
  **Reply:** "No—truth matters for *robust* norms. But persuasion happens in the *context* of social incentives. Dueling collapsed when military elites reframed courage as enduring scorn, not demanding satisfaction. Rationalists can be the community where updating on evidence *is* the honorable thing. But to scale, tie it to prestige."  
  *Soft spot:* Glosses over tension between truth-tracking and prestige-seeking.  

  **#5. Philosopher (Honor as Epiphenomenon)**  
  *Phrased:* "Honor is just the emotion tagging coalitional alliances. You’ve described *how* norms spread, not *why* the prestige economy shifts. Isn’t that driven by deeper material or evolutionary pressures?"  
  **Reply:** "Even if true, the *proximate* lever is honor. Material pressures didn’t stop dueling among 1890s Prussian officers—peer contempt did. We can intervene on the proximate cause without resolving ultimate causes."  
  *Soft spot:* Dodges the "why" critique; honor could still be a dependent variable.  

  ---

  ### The Reply You Must Land  
  **#1’s counterfactual:** If arguments alone worked, slavery/dueling would have died when arguments peaked (1750s/1780s), not decades later when honor shifted. *This must stick or the core thesis collapses.*  

  ---

  ### The Question You Hope Nobody Asks  
  *Phrased:* "If moral revolutions depend on the whims of prestige networks, how is this not a recipe for moral relativism? What stops ‘honorable’ from becoming ‘whatever the in-group rewards’?"  
  **First sentence:** "It *is* contingent—that’s why we must deliberately shape what our prestige economies reward, like making impartial truth-seeking the highest honor *here*."  

  ---

  ### Why This Order?  
  The historian’s materialist objection (#1) undermines your cases. The philosophers (#2, #5) threaten theoretical coherence. EA (#3) demands utility, or they’ll dismiss you. Rationalists (#4) need their identity salvaged. Soft spots are admitted to preempt "gotchas" and show steelmanning.  
    
  *Good luck. Your bottleneck is making "honor" legible to anti-charisma rationalists. Anchor it in their desire for "robust incentives."*
