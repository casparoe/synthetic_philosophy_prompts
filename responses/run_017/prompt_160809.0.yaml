  Move 4: Priya's stale-model fix seems clever but Sam correctly identifies the novel-situation vulnerability. Rating: partly right. 

  Move 5 is the crux: Sam's diagonalization argument applies theoretical limits while Priya counters with bounded rationality. Here Priya lands the stronger point because she addresses real-world constraints. Both miss that the shadow's reliability depends on problem domain smoothness. 

