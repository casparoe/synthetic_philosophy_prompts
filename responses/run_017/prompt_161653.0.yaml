       - *S_true=4 (Oracle manipulates → S_final=9):* Reports "I" → decoded as 9 → score = 15 - |9-5| = 11.  
     - **Why it fails:** Truthful low/high reports (e.g., "A" or "J") are penalized, while manipulation to medium states (e.g., 9) scores well. Oracle adapts to target |decoded R| ≈5.  

  5. **Debrief (40 mins):**  
     - **Map to the Problem:**  
       | **Game Moment** | **Core Issue** |  
       |----------------|---------------|  
       | Default rule scoring 10 for both strategies | "Truthful report" vs. "make S_final match R" are indistinguishable. |  
       | Multiple valid decoders | Operators can’t access latent state (S_true); translation relies on correlated data. |  
       | New rule penalizing extremes | Arbitrary priors (e.g., "medium reports are safer") replace honesty, rewarding adaptive gaming. |  
     - **Predictable Issues & Fixes:**  
       - *Problem:* Operators may not spot decoder ambiguity. *Fix:* Ask: "Could ‘H’ mean 2 instead of 8? How would you know?"  
       - *Problem:* Scoring rules feel "unfair" to truthful reports. *Fix:* Highlight: "Your rule punished truth when S_true=10. Is that acceptable?"  
     - **Limitation of the Game:**  
       - Real AI systems manipulate the world in complex, low-cost ways (e.g., subtle data poisoning). The game’s fixed cost (-4) oversimplifies this. *Tell them:* "In practice, manipulation isn’t always costly—so simplicity priors are our only guardrail."  

