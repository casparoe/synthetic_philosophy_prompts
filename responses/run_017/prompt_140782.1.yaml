prompt: |-
  I serve on the four-person grants committee of a foundation whose charter tells us to do the most good per dollar over the long run. We meet monthly, review about twenty-five proposals per cycle, can spend no more than twenty minutes and one page on any single one, and must attach to each recommendation a short written rationale for a board whose members are split on whether the long-run framing is sound at all. The proposals that repeatedly stall us are the ones whose case is astronomically large rather than probable: one asks for $250,000 for technical work on a nascent technology, justified by a one-in-ten-thousand chance of steering a civilisation away from a bad trajectory whose stakes are set by something like 10^30 future lives, many of them digital; one asks for the same sum for work aimed only at the qualitative character of a future that may be endless in time or space, where the case is that any nonzero chance of affecting an unlimited future outweighs anything with merely finite effects, and where the probability resists any number; one asks for the same sum for a program with well-measured, near-certain benefits to a few thousand people alive now, which looks negligible beside either of the others.

  Please turn what formal decision theory and population ethics have to say about astronomical and infinite stakes into a procedure my committee can actually run in twenty minutes without any formal training: the questions in the order we should ask them, what counts as an answer to each, the point at which we stop and record the proposal as unrankable rather than forcing a number, and the points where what remains is a question of values, or of what our board will ratify, and must be handed to a person instead of settled by arithmetic. Centre it on a device of your own choosing — a cap on how large a stake may be entered into the ranking, a probability threshold below which a proposal is set aside, a split between a ranked budget and an exploratory budget, or something better — and say plainly which failure the device is there to prevent. It must cope with a proposal that is best under one credible model of the far future and worst under another, with an arithmetic that wants to hand nearly the whole cycle to one speculative grant, and with the case where our intuition and the arithmetic conflict and we cannot tell which of the two is the faulty input.

  Then run the finished procedure on the three proposals above, including at least one where it returns an answer my committee will not want, and close by saying what the procedure cannot do for us.

  Lead with your bottom line in the first sentence: the single rule that settles most cases, stated so that I could read it aloud to the board. Then give the procedure, the applications, and the limits, with no preamble and no restatement of this brief.
reasoning: |-
  We are given 20 minutes per proposal and must produce a one-page rationale. The challenge is to handle proposals with astronomical stakes, infinite stakes, and near-term certain benefits.

   The core problem is that expected value calculations with extremely large stakes (even with tiny probabilities) or infinite stakes can dominate the decision, leading to counterintuitive recommendations. We need a procedure that avoids being hijacked by speculative proposals with low-probability, high-impact outcomes unless they meet certain criteria.

   Proposed procedure:

   We will use a two-step process:

   Step 1: Screening for feasibility and reasonable probability.
     - We set a minimum probability threshold for considering a proposal that relies on a chain of events to achieve an astronomical or infinite impact. The threshold is 1 in a million (0.000001). If the stated probability of achieving the critical outcome (the one with astronomical stakes) is below this threshold, we set the proposal aside as too speculative and do not consider it in the main ranking. However, we may have a separate "exploratory" budget (see below) for such proposals.

   Step 2: Capping the stakes to avoid unbounded influence.
     - We cap the maximum stake (in equivalent lives saved or equivalent well-being units) that can be used in the calculation at a very large but finite number. The cap is set at 10^15 (one quadrillion) future lives (or equivalent). This cap is chosen to be large enough to capture very significant long-term effects but not so large as to make the calculation meaningless. Any proposal that claims to affect more than 10^15 lives (or equivalent) will be treated as affecting exactly 10^15 lives.

   The rationale for the cap is that beyond a certain point, the differences in the claimed stakes become practically irrelevant and we need to avoid being dominated by numbers we cannot meaningfully compare. The cap also helps in cases where the stakes are claimed to be infinite (or effectively infinite). We treat any such claim as being at the cap (10^15) for the purpose of calculation.

   Additionally, we split our budget into two parts:
     - A main budget (say 90% of the total) for proposals that pass the screening (i.e., with probability above the threshold and with stakes that are either finite or capped) and that can be compared using expected value with the cap.
     - An exploratory budget (10%) for proposals that are too speculative (probability below the threshold) but that we believe might have some merit. For these, we use a separate, more qualitative process (e.g., we might fund a few of the most promising ones each cycle, without trying to quantify their impact).

   The procedure:

   For each proposal, we ask the following questions in order:

   1. What is the primary mechanism by which this grant will do good?
      - We require a clear, logical chain of events. If the chain is too vague or involves too many uncertain steps, we may set it aside as unrankable.

   2. Does the proposal rely on a chain of events that leads to an outcome with astronomical stakes (over 10^15 lives or equivalent) or infinite stakes?
      - If no, we proceed to standard cost-effectiveness calculation (using expected value without the cap, since the stakes are below the cap).
      - If yes, then:
          a. What is the probability of the grant achieving the critical step that leads to the astronomical/infinite stakes? (This must be a probability of the entire chain from the grant to the outcome.)
          b. If the probability is less than 1 in a million (or if the proposer cannot provide a credible lower bound that is at least 1 in a million), then we assign it to the exploratory track (if we choose to fund it at all) and do not rank it in the main budget.
          c. If the probability is at least 1 in a million, then we cap the stakes at 10^15 lives (or equivalent) and compute the expected value as: (probability of success) * (min(claimed_stakes, 10^15)).

   3. For proposals that are not set aside and not assigned to the exploratory track, we compute a cost-effectiveness ratio (expected value per dollar). We then rank the proposals by this ratio and fund the top ones until the main budget is exhausted.

   4. For the exploratory track (which includes proposals that are too speculative or that are about the qualitative character of an infinite future but without a probability estimate that meets the threshold), we use a separate process. We allocate 10% of the total budget to this track. We do not attempt to rank these against each other using expected value. Instead, we use qualitative judgment: which ones have the most credible path, the best team, or address the most pressing uncertainties? We fund as many as we can with the exploratory budget, starting with those we judge to have the highest potential.

   5. When we encounter a proposal that is best under one credible model and worst under another, we require the proposer to state the probability of the model under which the proposal is positive. We then use that probability in the expected value calculation (with the cap). If the proposer cannot assign a probability, we may set it aside as unrankable and assign it to the exploratory track.

   6. If the arithmetic (using the above rules) produces a result that conflicts with our intuition, we flag it for an extra review. We then ask: is the intuition based on a flaw in the model? If we can identify a flaw (e.g., an overestimate of probability, or a step in the chain that is missing), we adjust. If not, we go with the arithmetic. However, if the conflict remains unresolved, we may assign the proposal to the exploratory track to avoid having the main budget dominated by a single speculative grant.

   The single rule to read aloud to the board:

   "To ensure that our grants do the most good per dollar over the long run, we cap the maximum stake of any outcome at one quadrillion (10^15) lives and set a minimum probability threshold of one in a million for considering speculative proposals with astronomical stakes; proposals below this threshold are considered separately in an exploratory budget."

   Now, apply the procedure to the three proposals:

   Proposal 1: $250,000 for technical work on a nascent technology, with a one-in-ten-thousand chance (0.0001) of steering a civilization away from a bad trajectory, stakes: 10^30 future lives.

   - Probability (0.0001) is above our threshold (0.000001). So we do not set it aside for being too speculative.
   - The stakes (10^30) are above our cap (10^15). Therefore, we cap the stakes at 10^15.
   - Expected value = (0.0001) * (10^15) = 10^11 lives saved per dollar? Wait, note: we need to compute the expected lives saved per dollar. But note the grant amount is $250,000.

   However, the proposal does not specify how many lives are saved per dollar but rather the total expected impact. We need to compute the expected impact per dollar.

   Total expected impact (in capped lives) = 0.0001 * 10^15 = 10^11 lives.
   Cost: $250,000.
   Expected impact per dollar = 10^11 / 250,000 = 400,000 lives per dollar.

   But note: we must be consistent in units. We are treating the impact in terms of lives. We assume that the 10^30 is in terms of lives, and we are capping at 10^15 lives.

   Proposal 2: $250,000 for work on the qualitative character of a future that may be endless, with a nonzero chance of affecting an unlimited future. The probability resists any number.

   - The stakes are claimed to be infinite (or effectively unlimited). We would cap at 10^15.
   - However, the probability is not quantifiable. The proposal states it resists any number. Therefore, we cannot assign a probability above our threshold (since we require at least 1 in a million). We assign this to the exploratory track.

   Proposal 3: $250,000 for a program with well-measured, near-certain benefits to a few thousand people alive now.

   - This has finite stakes. Let's say it benefits 5,000 people (for example) with near certainty (probability 1). 
   - Expected impact: 5,000 person-lives (or whatever the unit is). But note: the benefits might be in terms of quality of life, not necessarily lives saved. We assume we have a common unit (like QALYs or equivalent). For simplicity, let's assume we are measuring in "lives improved in a significant way" and that the proposal states 5,000 such improvements.
   - Cost: $250,000.
   - Impact per dollar: 5,000 / 250,000 = 0.02 improvements per dollar.

   Now, compare:

   Proposal 1: 400,000 lives per dollar.
   Proposal 3: 0.02 improvements per dollar.

   So by the arithmetic, Proposal 1 is vastly superior.

   However, note that our intuition might conflict: is it really credible that this $250,000 grant has a 0.0001 chance of saving 10^15 lives? We must check the chain.

   We would then ask: what is the chain of events? How does the technical work lead to steering the civilization? If the committee finds flaws in the chain (e.g., the probability is overestimated, or there are additional necessary steps that reduce the probability below the threshold) we might adjust. If we cannot resolve the conflict, we might move Proposal 1 to the exploratory track? But note: it passed the threshold and we have a quantifiable probability. Therefore, unless we can point to a flaw, we must go with the arithmetic.

   However, the procedure says: if the conflict remains unresolved, we may assign to the exploratory track. But this is a judgment call. We might decide that the chain is too uncertain and assign it to exploratory, or we might stick with the arithmetic.

   Since the probability (0.0001) is 100 times our threshold (0.000001) and the proposer has provided a number, we would typically keep it in the main track. But if the committee has strong reasons to doubt the probability estimate (e.g., the proposer pulled it out of thin air), then we can require a more credible justification and if not provided, set it aside.

   But note: the procedure asks for a credible model. The proposal must provide a credible chain. If they do, we use the arithmetic.

   Therefore, in the main ranking, Proposal 1 is ranked above Proposal 3. Proposal 2 is in the exploratory track.

   Now, consider the budget allocation:

   - We have a main budget (90% of the cycle's total) and an exploratory budget (10%).
   - We would fund Proposal 1 from the main budget (if it is the top ranked) and then other main proposals until the main budget is exhausted.
   - We would consider Proposal 2 and other exploratory proposals for the exploratory budget.

   But note: Proposal 3 is also in the main track. However, its cost-effectiveness is very low compared to Proposal 1. So if we have limited funds, we might not fund Proposal 3 in this cycle.

   What the procedure cannot do for us:

   1. It cannot resolve deep uncertainties in models of the far future. We must rely on the proposer's probability estimates and our own judgment about the credibility of the chain.

   2. It cannot tell us whether the cap (10^15) is the right number or the probability threshold (1 in a million) is the right one. These are somewhat arbitrary and may be revisited.

   3. It does not solve the problem of comparing different kinds of benefits (e.g., improving the quality of life for current people vs. saving future lives). We assume a common unit (like QALYs or equivalent) but converting between them is a value judgment.

   4. It does not eliminate the need for judgment: we still have to evaluate the credibility of the chain of events and the probability estimates.

   5. The exploratory track is necessarily subjective.

   6. The procedure does not address intergenerational trade-offs beyond the cap. We are effectively ignoring any stakes above 10^15.

   7. It does not handle cases where the same proposal has both near-term and long-term benefits.

   In summary, the procedure is designed to prevent the main budget from being dominated by a single speculative proposal with an arbitrarily large stake and an arbitrarily small (but above threshold) probability. It forces us to cap the stakes and set aside the most speculative proposals for a separate budget.

   We run the three proposals:

   - Proposal 1: main track, high rank (if the chain is credible).
   - Proposal 2: exploratory track.
   - Proposal 3: main track, low rank.

   Therefore, if the main budget is limited and we have only $250,000 in the main budget for this cycle, we would fund Proposal 1 and not Proposal 3. This might be a result the committee does not want (if they are skeptical of Proposal 1 and value the near-term benefits of Proposal 3). However, the procedure would require it.

   We note that the board might be split on the long-run framing. The procedure explicitly caps the long-run stakes and sets aside the most speculative ones, which might address some concerns. But it still gives significant weight to long-run effects that meet the criteria.

   Finally, we must remember that we are required to write a short rationale for each. For Proposal 1, the rationale would be: "This proposal has a small but non-negligible chance (1 in 10,000) of having an extremely large positive impact on the long-term future. Our procedure caps the maximum impact at 10^15 lives, and by that measure, it is highly cost-effective." For Proposal 3: "This proposal has a near-certain positive impact on a few thousand current lives. However, its cost-effectiveness is low compared to other proposals in the main track." For Proposal 2: "This proposal addresses the qualitative character of the far future but does not provide a quantifiable probability of success. Therefore, it is funded from the exploratory budget, which is reserved for highly speculative but potentially important work."

   The procedure's limits: It cannot magically resolve the philosophical problems of population ethics or the practical difficulties of forecasting the far future. It provides a structured way to make decisions under these constraints, but it is not a substitute for careful thought.
answer: |-
  **Bottom-line rule for the board:**  
  To maximize good per dollar over the long run, we cap the maximum credible stake at 10¹⁵ future lives (or equivalent) and require a minimum 1-in-1,000,000 probability threshold for speculative claims; proposals failing these criteria are evaluated separately.

  ---

  ### **The Procedure**  
  *Spend 2–3 minutes per question. Stop and flag as "unrankable" if unresolved by Q4. Total time: ≤20 minutes.*

  1. **Q1: What is the direct outcome, and how certain is it?**  
     - *Requires:* Evidence-backed probability and scale of near-term effects (≤10 years).  
     - *If missing:* Flag as "incomplete" and reject.  
     - *Stop here if:* Outcomes are certain and finite (e.g., "saves 1,000 lives"). Proceed to cost-effectiveness calculation (skip Q2–Q4).  

  2. **Q2: Does the proposal rely on astronomical stakes (>10¹⁵ lives) or infinite effects?**  
     - *Requires:* Clear chain from grant to long-term outcome.  
     - *If no:* Treat as finite-stakes. Calculate cost-effectiveness (impact/dollar), rank, and fund if competitive.  
     - *If yes:* Proceed to Q3.  

  3. **Q3: What is the probability of the grant altering the long-term outcome?**  
     - *Requires:* A defensible lower-bound probability (e.g., "1-in-10,000").  
     - *If probability < 10⁻⁶ (0.0001%) or undefined:* Flag as "unrankable." Assign to exploratory budget (see below).  
     - *If probability ≥ 10⁻⁶:* Cap stakes at 10¹⁵ lives. Calculate expected value:  
       **Expected impact = (Probability) × (min(claimed stakes, 10¹⁵))**  
       Then compute cost-effectiveness (expected impact/dollar).  

  4. **Q4: Is the probability model credible or contested?**  
     - *Requires:* No major unresolved disputes over key assumptions.  
     - *If contested:* Check if outcomes flip (best → worst) under rival models.  
       - *If yes:* Flag as "unrankable." Assign to exploratory budget.  
       - *If no:* Use the expected value from Q3.  
     - *If uncontested:* Use Q3’s expected value.  

  5. **Q5 (if Q2–Q4 passed): Does arithmetic conflict with intuition?**  
     - *Requires:* Brief deliberation (e.g., "Does 10⁻⁶ probability feel inflated?").  
     - *If intuition challenges probability:* Adjust probability downward if evidence is weak.  
     - *If intuition challenges stakes:* Uphold cap (10¹⁵).  
     - *If unresolved:* Assign to exploratory budget.  

  ---

  ### **Budget Allocation**  
  - **Ranked budget (90% of funds):** For proposals with finite stakes or probabilistic long-term stakes passing Q1–Q5. Rank by impact/dollar, fund top until budget exhausted.  
  - **Exploratory budget (10% of funds):** For "unrankable" proposals (e.g., undefined probability, contested models, intuition/arithmetic conflicts). Fund via qualitative vote (e.g., "Which has highest transformative potential?").  

  ---

  ### **Why This Works**  
  - **Cap (10¹⁵ stakes):** Prevents speculative proposals from dominating via arbitrary large numbers.  
  - **Probability threshold (10⁻⁶):** Filters unrealistic "lottery tickets."  
  - **Split budget:** Ensures ranked decisions use robust arithmetic, while exploratory tier handles edge cases.  
  - **Handles conflicts:** Intuition/arithmetic mismatches go to exploratory; contested models are set aside.  

  ---

  ### **Application to Proposals**  
  *Assume: $250,000 grant; committee intuition skeptical of low probabilities.*  

  1. **Proposal 1:** Technical work (1-in-10,000 chance of affecting 10³⁰ lives).  
     - Q1: Focuses on long-term stakes → proceed.  
     - Q2: Astronomical stakes (10³⁰ > 10¹⁵) → proceed.  
     - Q3: Probability = 10⁻⁴ (> 10⁻⁶). Cap stakes: min(10³⁰, 10¹⁵) = 10¹⁵.  
       Expected impact = 10⁻⁴ × 10¹⁵ = 10¹¹ lives.  
       Cost-effectiveness = 10¹¹ / $250,000 = 400,000 lives/dollar.  
     - Q4: Model credibility? If contested (e.g., "Is 1-in-10,000 defensible?"), flag as unrankable. Else, rank.  
     - Q5: Intuition may balk → if unresolved, assign to exploratory.  
     - **Outcome:** Likely exploratory due to model disputes.  

  2. **Proposal 2:** Shaping an infinite future (nonzero chance, undefined probability).  
     - Q1: Focuses on infinite stakes → proceed.  
     - Q2: Infinite stakes → proceed.  
     - Q3: Probability undefined → flag as unrankable.  
     - **Outcome:** Exploratory budget.  

  3. **Proposal 3:** Near-certain benefits for thousands now.  
     - Q1: Certain, finite stakes (e.g., "helps 5,000 people").  
       Cost-effectiveness = 5,000 / $250,000 = 0.02 people/dollar.  
     - **Outcome:** Ranked in main budget, but low priority vs. high-impact grants.  

  **Result the committee won’t like:**  
  - If Proposal 1’s model is accepted, it outranks Proposal 3 by 20 million-fold (400,000 vs. 0.02). But if moved to exploratory due to Q4/Q5, it may lose to Proposal 3 in ranked voting.  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Resolve value conflicts:** E.g., "Are future lives worth less than current ones?" (board must decide).  
  2. **Assign precise probabilities:** Relies on proposers for estimates; contested cases go to exploratory.  
  3. **Compare exploratory proposals:** Qualitative judgment required.  
  4. **Handle interdependent grants:** Treats proposals as standalone.  
  5. **Override board mandates:** If board rejects long-term framing, ranked budget ignores infinite stakes.  

  **Final note:** The procedure forces transparency about uncertainty, contains arithmetic extremes, and allocates 90% of funds to auditable impact—while reserving 10% for bets where intuition and models collide.
