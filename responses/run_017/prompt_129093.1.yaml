  ### Teaching Note Example: Nash vs. Kalai-Smorodinsky Bargaining Solutions

  **Story:**  
  Alice and Bob are neighbors negotiating over the use of a shared garden plot for one year. Alice values the plot at up to $10,000 for personal gardening (her standalone utility). Bob, a professional gardener, can generate up to $20,000 in profit by using the plot commercially. They bargain over a continuously adjustable royalty rate \( r \) (from 0% to 100%) that Alice receives from Bob's profits, leading to expected utilities that depend linearly on \( r \). Randomization over possible royalty rates or the continuous adjustment makes the feasible set convex. Utilities are in thousands of dollars (one unit = $1,000), interpretable as von Neumann-Morgenstern utilities or expected monetary values. Disagreement (no agreement) gives both $0 utility.

  **Baseline Bargaining Problem \( F \):**  
  - Disagreement point: \( d = (0, 0) \).  
  - Ideal point: \( a(F) = (10, 20) \) (Alice's max utility is 10, Bob's is 20).  
  - Feasible set \( F \): Compact, convex, and comprehensive. Pareto frontier is the line segment from (10, 0) to (0, 20), defined by \( 2u_A + u_B \leq 20 \) with \( u_A, u_B \geq 0 \).  
  - Vertex list (for Pareto frontier): (10, 0) and (0, 20).  

  **Nash Solution for \( F \):**  
  Maximize \( u_A \cdot u_B \) subject to \( 2u_A + u_B = 20 \) (frontier).  
  - Product: \( P = u_A \cdot (20 - 2u_A) = 20u_A - 2u_A^2 \).  
  - First-order condition: \( \frac{dP}{du_A} = 20 - 4u_A = 0 \) → \( u_A = 5 \).  
  - Then \( u_B = 20 - 2 \cdot 5 = 10 \).  
  - Nash point: (5, 10), product = 50.  

  **Kalai-Smorodinsky (KS) Solution for \( F \):**  
  - Ideal point: (10, 20).  
  - Ray from (0, 0) to (10, 20): parametric form \( (10s, 20s) \) for \( s \in [0,1] \).  
  - Intersects frontier \( 2u_A + u_B = 20 \): set \( 2(10s) + 20s = 20 \) → \( 20s + 20s = 20 \) → \( 40s = 20 \) → \( s = 0.5 \).  
  - KS point: (5, 10).  
  - Verdict: Both solutions select (5, 10), which is off the diagonal (Alice 5, Bob 10), so not symmetric. Fractions: Alice gets \( 5/10 = 0.5 \), Bob gets \( 10/20 = 0.5 \) of max gains.

  **Changed Circumstances and New Problem \( G \):**  
  A new gardening grant allows Alice to earn up to $15,000 independently if she forgoes some royalty, but Bob's maximum profit remains $20,000. The feasible set expands to \( G \) (superset of \( F \)), with:  
  - A's ideal payoff: 15 (strictly up from 10).  
  - B's ideal payoff: 20 (unchanged).  
  - Nothing taken from B: For every \( u_A \), max \( u_B \) in \( G \) ≥ max \( u_B \) in \( F \), and strictly greater for some range (e.g., at \( u_A = 0.5 \), max \( u_B \) in \( F \) is 10, in \( G \) is about 10.5; details below).  
  - Max total \( u_A + u_B \): In \( F \), max is 20 at (0, 20). In \( G \), max is 21 at (1, 20) (since \( 1 + 20 = 21 > 20 \)).  

  **Expanded Feasible Set \( G \):**  
  - Disagreement point: \( d = (0, 0) \).  
  - Ideal point: \( a(G) = (15, 20) \).  
  - Vertex list (Pareto frontier): (0, 20), (1, 20), (4, 12), (5, 10), (10, 0), (15, 0). The set is convex and comprehensive.  

  **Nash Solution for \( G \):**  
  Maximize \( u_A \cdot u_B \) on the Pareto frontier. Frontier segments:  
  1. \( u_A \in [0, 1] \), \( u_B = 20 \): Product \( P = 20u_A \), max 20 at (1, 20) (P=20).  
  2. \( u_A \in [1, 4] \), line from (1, 20) to (4, 12): Slope = \( \frac{12 - 20}{4 - 1} = -\frac{8}{3} \), so \( u_B = 20 - \frac{8}{3}(u_A - 1) \).  
     - Product: \( P = u_A \left(20 - \frac{8}{3}(u_A - 1)\right) = u_A \left(\frac{68}{3} - \frac{8}{3}u_A\right) \) (after simplifying).  
     - First-order condition: \( \frac{dP}{du_A} = \frac{68}{3} - \frac{16}{3}u_A = 0 \) → \( u_A = \frac{68}{16} = 4.25 \) (not in [1, 4]). Derivative >0 in [1, 4], so max at (4, 12), P=48.  
  3. \( u_A \in [4, 5] \), line from (4, 12) to (5, 10): Slope = -2, \( u_B = 20 - 2u_A \).  
     - Product: \( P = u_A (20 - 2u_A) = 20u_A - 2u_A^2 \), derivative \( 20 - 4u_A >0 \) for u_A <5, so max at (5, 10), P=50.  
  4. \( u_A \in [5, 10] \), line from (5, 10) to (10, 0): Slope = -2, \( u_B = 20 - 2u_A \).  
     - Product: \( P = u_A (20 - 2u_A) = 20u_A - 2u_A^2 \), derivative \( 20 - 4u_A \), max at u_A=5 (P=50), decreases to P=0 at (10,0).  
  5. \( u_A \in [10, 15] \), \( u_B = 0 \): P=0.  
  - Maximum product is 50 at (5, 10), same as in F. Nash point: (5, 10).  

  **KS Solution for \( G \):**  
  - Ideal point: (15, 20).  
  - Ray from (0, 0) to (15, 20): slope \( \frac{20}{15} = \frac{4}{3} \), so \( u_B = \frac{4}{3}u_A \).  
  - Intersect with Pareto frontier:  
    - Segment \( u_A \in [5, 10] \), \( u_B = 20 - 2u_A \) (from (5,10) to (10,0)).  
    - Set equal: \( 20 - 2u_A = \frac{4}{3}u_A \) → \( 20 = \frac{4}{3}u_A + 2u_A = \frac{10}{3}u_A \) → \( u_A = 6 \).  
    - Then \( u_B = \frac{4}{3} \cdot 6 = 8 \) (or \( 20 - 2 \cdot 6 = 8 \)).  
  - KS point: (6, 8).  
  - Fractions: Alice gets \( 6/15 = 0.4 \), Bob gets \( 8/20 = 0.4 \) of max gains.  

  **Verdicts:**  
  - Nash solution: Same in G as in F, at (5, 10).  
  - KS solution: In F, (5, 10); in G, (6, 8). Thus, Alice gets strictly more (6 > 5), Bob gets strictly less (8 < 10). Margins: Δu_A = 1.0, Δu_B = -2.0, both > |0.005|.  

  **Monotonicity Principle:**  
  Kalai-Smorodinsky requires that if one party's ideal utility increases and the other's does not decrease, the first party should not end up with less utility in the solution. Formally: If \( G \supseteq F \), \( a_A(G) \geq a_A(F) \), and \( a_B(G) \geq a_B(F) \), then \( \text{KS}_A(G) \geq \text{KS}_A(F) \). Here, \( a_A(G) = 15 > 10 = a_A(F) \), \( a_B(G) = 20 = a_B(F) \), and \( \text{KS}_A(G) = 6 > 5 = \text{KS}_A(F) \), so it satisfies monotonicity for Alice. However, Bob ends up worse off (8 < 10) despite no decrease in B's ideal or options.

  **Key Geometric Features:**  
  - **Nash verdict pinned by**: The expansion to G adds no point with product >50, and the new frontier segments are tangent or steeper around (5,10), preventing a higher product. If the new segments allowed higher product (e.g., flatter slope), Nash would move.  
  - **KS verdict pinned by**: The ideal point shifts right to (15,20), flattening the ray from (0,0), which intersects the frontier at a point favoring Alice more. If the ideal point didn't change or the frontier shifted uniformly, KS might not change or B might not lose.  

  **Objection and Reply:**  
  - **Objection (KS defender)**: The case exploits an asymmetric frontier; (6,8) is still Pareto efficient and fair as both get 40% of their max gains. Bob isn't "harmed" absolutely (8 > 0), only relatively.  
  - **Reply**: The change expands options (no loss for B), yet KS reduces B's utility from 10 to 8. This violates the spirit of "no harm": B loses despite no reduction in their possible outcomes, which Nash avoids by staying put. The asymmetry is intentional to show divergence from a common starting point.  

  **What the Case Establishes:**  
  This case illustrates the axiomatic conflict: Nash satisfies independence of irrelevant alternatives (IIA) but violates monotonicity (A's ideal improves yet A gains nothing). KS satisfies monotonicity for A but violates IIA (adding points changes the outcome) and can penalize B despite no adverse change. It does not establish which solution is "better," but demonstrates that monotonicity and IIA are incompatible, forcing a choice based on normative priorities.
