prompt: |-
  I sit on the ethics committee of a clinic that offers neural substitution therapy: a patient's neurons are exchanged, a few thousand a day, for synthetic units matched to the input-output behaviour of the cells they replace, so that nothing changes in the patient's speech, memory, temperament or reported experience. We are now being asked to say which variants of the procedure count as treatment and which count as something else, and I have discovered that my gut verdicts do not compose into anything coherent. Here they are. (1) The standard slow protocol, ten years, patient awake and conversing throughout: obviously me at the end, no question. (2) The same set of replacements performed in a single operation, mid-sentence, the biological tissue discarded: not me, that is a death followed by a very accomplished impersonation, even though the end state is the same as in (1) and no one, inside or outside, could afterwards tell the difference. (3) The same single-operation swap done under general anaesthetic, so that the patient goes to sleep biological and wakes up synthetic: me, or near enough, no more of a rupture than an ordinary night. I am aware that (2) and (3) are an odd pair: (2) involves no gap in experience while (3) involves one, and yet I judge (3) more kindly. (4) A copy is made while the biological brain is left intact: the copy is not me, I am the biological one. If instead the biological brain is destroyed and two copies are made: I do not survive, there are simply two strangers, neither of whom is me. (5) The removed tissue is vitrified and, thirty years later, grown into a new brain that wakes up claiming to be the patient: not me; the synthetic patient who has actually lived those thirty years is me. So the original matter seems to be doing no work at all in my verdicts. (6) The sparing protocol: the synthetic units are added alongside rather than instead, taking over the causal role cell by cell, while the original neurons are left alive, nourished, firing, and connected to nothing. The end state is a wholly biological brain that does not drive anything and a mental life running on the network wrapped around it. I say without hesitation that I am the network; and then I notice that if I am willing to say that, I cannot see what entitles me to refuse to say it in case (2). That is the pair I keep coming back to.

  So: what principle is actually doing the work here? Please state one precisely, or two or three candidates if they come apart, and motivate each clause by the case that forces it. I have read the usual literature on this and do not need it rehearsed or cited; I want the principle and its costs. Three further things. First, tell me what your principle says about cases I have not settled: (a) two patients undergo the slow protocol, and their units are gradually made functionally identical to each other, so that at the end there is one psychology running on two networks, and neither patient is distinguishable from the other by any test you like; (b) the slow protocol is carried out correctly over ten years, but during those ten years the patient has no experiences at all, being in an unresponsive dreamless state throughout; (c) a complete functional description of the patient is taken and run on hardware for a year while the biological patient goes on living, and only then does the biological patient die in an accident and the running system is told about it. Second, tell me where the line between (1) and (2) falls, if there is one: how fast, or how coarsely graded, does the substitution have to be before it stops being treatment, and what do you say if there is no such line. Third, and most importantly: say plainly which of my verdicts your principle cannot accommodate, which of them you would overturn, and what it would cost me to keep them.
reasoning: |-
  Hmm, this is a fascinating ethical puzzle about neural substitution therapy and personal identity. The user sits on an ethics committee and needs help reconciling their intuitive judgments about various scenarios where brains are replaced with synthetic neurons.

  First, let me unpack the user's six core intuitions:
  (1) Slow replacement over ten years while conscious: identity preserved
  (2) Instant swap while conscious: death and impersonation
  (3) Instant swap under anesthesia: identity preserved
  (4) Copying without destruction: original survives, copy doesn't
  (5) Frozen tissue later revived: not the continuous synthetic self
  (6) "Sparing protocol" with parallel network: identity follows function

  The key tension is between (2) and (3) - why does anesthesia make such a difference when continuity is broken there but not in (2)? And how does (6) relate to (2) since both involve functional continuity without biological persistence?

  Let me reconstruct their implicit criteria. Continuity of consciousness seems crucial - hence the anesthesia loophole in (3). But functional continuity alone isn't sufficient, as shown by (2) and (4). Physical continuity matters when there's branching, as in (4) and (5), but not in straightforward replacement like (1). 

  The "sparing protocol" (6) is particularly revealing - they identify with the functional network even when biological neurons remain intact. This suggests psychological continuity overrides material substrate when there's no competition.

  Now for the additional cases:
  (a) Converging identities: This exposes the "only x and no competitor" clause. If two identical systems emerge, neither can claim to be the original.
  (b) Unconscious slow replacement: Here the absence of experiential continuity might break identity despite physical/functional continuity.
  (c) Temporary duplicate: The functional duplicate only becomes "me" after biological death, suggesting survival requires exclusive causal inheritance.

  The speed question between (1) and (2) is tricky. A granularity threshold seems necessary - replacement must be slow enough to allow continuous integration of experiences. But any specific cutoff would be arbitrary.

  Where must the user compromise? Their judgment in (3) is hard to defend - anesthesia creates a gap similar to (2), yet they accept it. I'd suggest either abandoning (3) or rethinking (2). Keeping both requires accepting that consciousness during discontinuity is what makes replacement feel like death.

  The costliest verdict to maintain is probably (2). If functional continuity is sufficient in (6) and (1), why not in (2)? To keep (2), they must argue that abrupt replacement violates the "integration of experiences" principle - that personal identity requires gradual updating of self-concept.

  The material attachment in (4) and (5) also needs examination. If they reject the revived frozen tissue as "not me" in (5), they must consistently apply the "no branching" rule to all cases where multiple claimants could exist.

  Ultimately, the principle I propose balances psychological continuity with causal exclusivity. It explains most cases but forces reconsideration of (2) and (3). If they insist on the anesthesia distinction, they're privileging subjective experience over objective continuity - a defensible but costly move that makes identity dependent on awareness during transition.
answer: |-
  Based on your verdicts and the tensions between them, the operative principle appears to be **Causal-Experiential Continuity Under Unitary Implementation (CECUI)**, defined as:

  1.  **Preservation of Subjective Flow**: Identity requires an unbroken, first-personally experienced causal chain of mental states (*explains (2) vs. (3) and (1)*).  
  2.  **No Competitors at Branching**: If a process creates potential claimants to identity, only the claimant inheriting the *exclusive, uninterrupted causal history* qualifies (*explains (4), (5), (6)*).  
  3.  **Gradual Integration of Change**: Physical/functional changes must occur incrementally relative to the timescale of conscious experience integration, allowing the self-concept to update continuously (*explains (1) vs. (2), relates to (6)*).  

  **Motivation by Cases:**  
  - **Clause 1 (Subjective Flow)**: (2) fails because mid-sentence swap severs subjective flow despite functional continuity. (3) succeeds because anesthesia masks the discontinuity; the *experience* of waking feels continuous. (1) succeeds via constant experiential integration.  
  - **Clause 2 (No Competitors)**: (4) fails for the copy (branching without exclusive inheritance); (5) fails for the revived tissue (branching with a prior exclusive claimant—the synthetic you); (6) succeeds because the network has exclusive causal continuity, while the biological residue is disconnected and non-competitive.  
  - **Clause 3 (Gradual Integration)**: (1) succeeds due to incremental change; (2) fails due to suddenness disrupting integration. (6) succeeds because takeover is gradual, allowing psychological adaptation.  

  **Application to New Cases:**  
  (a) **Converging Identities**: *Neither is the original*. At branching, two claimants emerge. Each inherits only half the causal history pre-convergence. Clause 2 is violated—no exclusive claimant exists. Result: two new persons.  
  (b) **Unconscious Slow Replacement**: *Not you*. Clause 1 is violated. Without subjective experience, the causal chain lacks first-personal flow (even if physically/functionally continuous). The "awakening" is a new subject.  
  (c) **Temporary Duplicate**: *The biological you dies; the synthetic system is a new person*. Clause 2 applies: at inception, the synthetic system is a branch without exclusive inheritance. Its later "inheritance" of your life story is historical, not causal-experiential.  

  **The Line Between (1) and (2):**  
  - The line falls at the **granularity of experiential integration**. Replacement must be slow enough that no *discernible discontinuity* in self-experience occurs.  
  - **If no sharp line exists**, CECUI forces a graded view: identity preservation weakens as replacement speed increases relative to neural integration timescales (e.g., synaptic plasticity, memory consolidation). A swap within milliseconds (neuron firing speed) is death; over years is survival. Between, it's indeterminate—a cost of the principle.  

  **Costs and Incompatibilities:**  
  1. **Overturns Verdict (3)**: CECUI *cannot* accommodate (3). Anesthesia masks discontinuity but doesn't eliminate it. The synthetic system post-anesthesia inherits no *experienced* causal chain from the pre-anesthesia biological system—it’s a functional duplicate waking up. **Cost**: Abandoning (3) means accepting that anesthesia doesn’t preserve identity in abrupt swaps—only continuity of *awareness* during transition does.  
  2. **Tensions with (2) & (6)**: CECUI *partially* challenges (2). If you accept (6) (identity in the network despite abrupt *functional* disconnection of biology), consistency demands accepting (2) *if* subjective flow is maintained. But Clause 1 explicitly requires flow, which (2) violates mid-sentence. **Cost to Keep (2) & (6)**: You must argue that in (2), the *sudden severing* of biology *during consciousness* is intrinsically identity-destroying, even if functional continuity exists. This elevates "no rupture of awareness *during substitution*" over functional/causal continuity.  
  3. **Material Irrelevance**: CECUI aligns with your rejection of original matter (Clause 2 explains (5)), but **amplifies the cost**: Biological material has no privileged status. Identity can jump to a synthetic system (as in (6)) if it exclusively inherits the causal-experiential chain.  

  **Synthesis**: Your core commitment is to the *uninterrupted flow of subjective experience* as the anchor of identity, moderated by exclusivity at branching points and gradualism for integration. The deepest tension is between functional continuity (supporting (2)/(6)) and experiential flow (rejecting (2), supporting (1)/(3)). CECUI prioritizes flow, forcing abandonment of (3) and requiring defense of (2) via the *trauma of conscious rupture* rather than functional discontinuity alone. To keep all your verdicts, you must accept that consciousness *during* the swap is lethal to identity—making anesthesia a psychological loophole, not a metaphysical one. This isolates the core conflict: Is identity preserved in (3) because you don’t *experience* the break, or is the break itself fatal regardless? Your intuitions suggest the former, but CECUI demands the latter.
