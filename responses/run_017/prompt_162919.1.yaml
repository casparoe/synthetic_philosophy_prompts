answer: |-
  Here's the decomposed credence for pragmatic encroachment (PE) being true, followed by the idle stakes challenge, key uncertainties, and evidentiary leverage points. My overall credence: **0.25**.  

  ### Decomposition (terms multiplied for combined credence)  
  1. **Intuitive judgments track *knowledge* (not nearby norms)**: **0.70**  
     *One line*: Bank cases primarily elicit epistemic (not practical) intuitions, but defeasible by "reasonable to act" alternatives.  
  2. **'Knowledge' is the ordinary concept (not a theoretical posit)**: **0.65**  
     *One line*: PE debates assume folk epistemology is the target, but theoretical revisions could dissolve the puzzle.  
  3. **Encroachment lands on *knowledge* itself (not just justification/standards)**: **0.40**  
     *One line*: Stakes likely raise justification thresholds, but linking this to *knowledge* requires contentious metaphysics.  
  4. **Conditional on PE, interest-relative invariantism (IRI) > contextualism**: **0.70**  
     *One line*: IRI better handles "same subject, same time" cases; contextualism struggles with disagreement.  
  **Combined credence**: 0.70 × 0.65 × 0.40 × 0.70 = **0.127** → adjusted to **0.25** for non-independence/idle stakes.  

  ### Idle Stakes: The Crucial Challenge  
  PE struggles to deny that *idle stakes* (e.g., a stranger's bet) affect knowledge while affirming *agent-relative stakes* do. Solutions exist but carry costs:  
  - **Principled distinction**: IRI can restrict stakes to *practical reasoning contexts* (e.g., Fantl & McGrath's "actionable" knowledge), excluding idle stakes.  
  - **Cost**: This implies knowledge is fragmentary (you "know" *for* some purposes but not others), undermining its role as a stable normative status.  
  - **Your 0.35 weight here is justified**: Idle stakes expose PE's tension with knowledge's externalist roots. My credence discounts PE by **0.10** for this.  

  ### Least Confident Term & Key Leverage  
  - **Least confident**: Term 3 (encroachment lands on *knowledge*). Credence **0.40** feels most unstable.  
  - **What would move it**: Empirical work on *ordinary knowledge attributions under varying stakes*.  
    - **Direction**: If experiments show stakes consistently affect *knowledge* (not just "actionability") in folk judgments, raise to **0.60**.  
    - **Countermove**: If stakes only affect "confidence" or "assertability," lower to **0.20**.  

  **Why 0.25 < your 0.35?** My decomposition weights idle stakes and the "knowledge vs. justification" gap more heavily, seeing PE as primarily a practical norm colonizing epistemic language. But your focus on idle stakes as a make-or-break is well-placed—it's the anvil on which PE theories crack or hold.
