answer: |-
  Here is your Q&A prep sheet, ordered by expected damage (likelihood × impact). I've identified two objections as conceptual twins, flagged the concession opener, highlighted the critical objection to not botch, and marked the one you dread. Replies are ~90s each, with soft spots noted.

  ---

  ### **Concession Opener (costs nothing):**  
  "To be clear: Solomonoff induction *does* provide a beautiful asymptotic guarantee. My concern is its physical implementability and finite-horizon relevance."

  ---

  1. **Objection (Statisticians, high likelihood, high damage):**  
     *"Diagonal closure isn't necessary for learnability. Finite VC dimension classes are learnable *because* they exclude anti-ERM labellings by definition. Your 'outsider condition' just restates realizability. Why invent new terms for standard concepts?"*  
     **Reply:** "Realizability ensures the *existence* of a good predictor, but diagonal closure exposes why that predictor must be *external* to the hypothesis class. VC theory works precisely by restricting environments to avoid self-referential traps—confirming the outsider condition. Finite VC classes are learnable because they exclude their own adversarial twins."  
     **Soft spot:** Concedes that diagonal closure is implied by (but not identical to) realizability. Doesn’t address why "outsider" adds value beyond standard ML.

  2. **Objection (Universal Induction, high likelihood, moderate damage):**  
     *"Semicomputability isn't a 'trick'—it's fundamental. Computable approximations fail because they’re *approximations*, not because of philosophy. Solomonoff’s bound holds for any finite time, so your 'horizon' objection is irrelevant."*  
     **Reply:** "The bound holds, but the constants are uncomputable and scale with environment complexity. For a fixed horizon, a 100-bit adversarial environment *will* exploit any computable approximator. Incomputability isn’t an implementation detail; it’s the *source* of Solomonoff’s externality."  
     **Soft spot:** Doesn’t refute that Solomonoff works asymptotically; implicitly concedes your "mitigation" framing.

  3. **Objection (Philosophers, moderate likelihood, high damage):**  
     *"This just dresses Hume in Kolmogorov complexity. Hume already showed induction can’t be justified deductively. What does 'exposure' add to Goodman’s grue or the problem of underdetermination?"*  
     **Reply:** "Hume identifies the gap; NFL and diagonalization *quantify* it. Goodman’s grue shows language-dependence, but complexity measures let us calibrate vulnerability to adversarial worlds. Exposure makes the residue of underdetermination explicit and actionable."  
     **Soft spot:** Risks conceding this is "Hume 2.0" without a clear normative advance.

  4. **Objection (Rationalists, moderate likelihood, high damage):**  
     *"Exposure feels like giving up. If embedded agents must violate the outsider condition, shouldn’t we focus on *self-modification* (e.g., Löbian agreements) to break the diagonal closure?"*  
     **Reply:** "Self-modification shifts the diagonal threat but doesn’t escape it. A modified agent still faces an environment containing its *prior* self’s outputs. Löbian trust assumes a fixed logic, but the environment can simulate your proof system. Mitigation isn’t elimination."  
     **Soft spot:** Hand-waves on Löb; doesn’t prove self-modification fails categorically.

  ---

  5. **Objection (Statisticians, high likelihood, moderate damage):**  
     *"Your 'exposure' metric is useless. Worst-case over diagonal closure? That’s infinite for any rich class. We care about *rates* and *convergence*, not philosophy."*  
     **Reply:** "For *any* finite N and fixed prior, exposure is finite. Yes, it’s loose—that’s the point! It quantifies the cost of your prior’s vulnerability to self-referential adversaries. Standard rates assume a *fixed* environment class; exposure reveals the price of that assumption."  
     **Soft spot:** Doesn’t reconcile with practical rate-optimal bounds; risks sounding anti-empirical.

  6. **Objection (Universal Induction, low likelihood, lethal damage):**  
     *"Solomonoff dominates all lower semicomputable priors. Your 'approximations fail' argument ignores that *any* Bayesian with a computable prior is suboptimal—but we use Solomonoff because it’s least suboptimal. Your 'exposure' doesn’t beat Occam."*  
     **Reply:** "Dominance is asymptotic. For finite N, an environment tailored to fool *your specific approximation* (e.g., MCTS-based AIXI) can exploit its computable structure. Solomonoff’s 'least suboptimal' doesn’t help when the loss is front-loaded in your discounting window."  
     **Soft spot:** Concedes Solomonoff is still the gold standard; your critique is about engineering, not theory.

  ---

  ### **Twin Objections (3 & 4): Same core—"Normativity isn’t addressed"**  
     - Philosophers (#3) ask what this *adds* to Hume/Goodman.  
     - Rationalists (#4) ask why we *shouldn’t* try to beat exposure.  
     **Unified reply:** "Hume shows justification is impossible; exposure quantifies the risk of that impossibility. Normativity enters in choosing which exposure to accept—e.g., a biologist might prioritize adversarial viruses over quantum gravity. Löb won’t save you; it only moves the bump in the rug."

  ---

  7. **Objection (Rationalists, moderate likelihood, moderate damage):**  
     *"If embedded agents can’t meet the outsider condition, why not use *meta-learning*? Learn a prior over environments that includes yourself, updating from experience."*  
     **Reply:** "Meta-learning shifts the diagonal threat to the meta-level. The 'anti-meta-p' environment simulates your learner and outputs opposites. Self-referential priors either regress or become inconsistent—see the grain-of-truth problem."  
     **Soft spot:** Assumes grain-of-truth failures apply universally; some meta-learning setups avoid this.

  8. **Objection (Philosophers, low likelihood, lethal damage):**  
     *"Your 'outsider condition' presupposes a *fixed* comparison class. But agents adapt their hypothesis space. This feels like a throwback to logical positivism."*  
     **Reply:** "Adapting the class doesn’t escape—it just defers the problem. Whatever class you land in, your predictor must sit outside it to be consistent. This is a *structural* limit, not a historical one."  
     **Soft spot:** Circular if "adaptation" breaks diagonal closure; no proof it’s unavoidable.

  ---

  ### **Critical: Don’t Botch This (Loses the Room)**  
  9. **Objection (Statisticians, high likelihood, lethal damage):**  
     *"Real-world learning isn’t about computable adversaries. We have distribution-free finite-sample bounds for ERM under realizability. Your 'diagonal closure' is a non-issue for PAC—why make it philosophical?"*  
     **Reply:** "PAC bounds *assume* realizability, which *enforces* the outsider condition: the ERM predictor isn’t in the hypothesis class (it’s data-dependent). If you include adversarial data-generating processes, realizability fails—and NFL bites. This *is* the philosophy of your assumptions."  
     **Soft spot:** ERM can be seen as "in" the class via uniform convergence. Doesn’t refute that PAC "solves" diagonalization statistically.

  ---

  ### **The One You Hope Nobody Asks**  
  10. **Objection (Universal Induction + Philosophers, low likelihood, lethal damage):**  
      *"Exposure depends on your prior’s support. But if the support excludes the anti-you environment (e.g., by assigning it low prob), exposure is small. Isn’t this just *bad prior design*?"*  
      **Reply:** "The anti-you environment has low complexity—it’s just you + a negation gate. Excluding it from your support means you’re *certain* you won’t face self-referential threats, which is dogmatic. Bayesianism can’t justify that exclusion without circularity."  
      **Soft spot:** Concedes exposure is prior-dependent; undermines its "objective" framing.

  ---

  ### Summary
  - **Highest risk:** #9 (Statisticians). If you fumble, ML theorists dismiss you as philosophizing ignorable details.  
  - **Twin objections:** #3 (Philosophers) and #4 (Rationalists) both attack normativity—answer together.  
  - **Dreaded question:** #10. Forces you to admit exposure relies on prior choice, undercutting its "residue" claim.  
  - **Key soft spots:** Diagonal closure vs. realizability (#1), Solomonoff’s asymptotic dominance (#6), and exposure’s subjectivity (#10).
