prompt: |-
  I am a TA for a second-year metaphysics course, and I have one fifty-minute section to take students from the simple conditional analysis of dispositions to seeing why finks and masks are not two instances of a single problem. They have already met one fink case — a wire that is live but wired to a device that cuts the current at the instant it is touched — and they found it intuitive; they have not met masks. Do not explain the material to me; give me the plan for teaching it.

  I want four things. First, the order the components must come in and what depends on what: in particular, what has to be in place before a mask can even look like a counterexample, and whether the reverse failure — a conditional that is true although the disposition is absent — belongs in this session at all or would only blur the distinction I am trying to build. Second, the one carrying case for masking, and what it must have and lack: I am drawn to the analgesic that blocks pain while leaving the sensitivity to pain intact, but I suspect students will defuse it by saying the subject is not really in the pain-disposing state, and I do not want to use protective packaging, since they will just say the glass was never really struck. Third, the misconceptions in the order they will form and the point in the sequence where each should be headed off: that finks and masks have the same structure and so call for the same repair; that a normal-conditions or ceteris paribus clause disposes of both; that if the disposition survives the mask then the manifestation must survive too, in some weakened form.

  Fourth, tell me where to place a pair of cases I have constructed: a fragile mug coated in a polymer that stiffens on impact so the mug does not break, the stiffening lasting only as long as the stress does; and a variant in which the same impact also briefly anneals the ceramic, so that the brittleness itself is absent for a moment. Which belongs earlier, what each should force the students to notice, and whether the hybrid case is both, neither, or a reason to doubt the distinction. Finally, give me one question to put on the board at the end that would show me they have the distinction rather than the labels — including what a wrong-but-tempting answer would look like — and name one thing I should explicitly refuse to go into at this level.
reasoning: |-
  Okay, the user is a TA for a second-year metaphysics course. They need to teach the distinction between finks and masks in one fifty-minute section. Students already know the simple conditional analysis (SCA) and have encountered a fink case (the wire example). Now, the TA wants to introduce masks without conflating the two problems.

  First, I need to determine the order of components. The core issue is that finks and masks are different types of counterexamples to SCA. Finks remove the disposition when the stimulus occurs, while masks leave the disposition intact but prevent manifestation. The TA mentioned reverse failures (true conditional without disposition), but including that might blur the focus. It's better to stick to finks and masks for clarity.

  Next, choosing a masking case. The analgesic example is tricky because students might argue the subject isn't in pain, thus not disposed. Protective packaging for glass could lead to similar objections. The electrostatic bubble-wrap case is better: the glass is fragile, the bubble-wrap absorbs impact without changing the glass's brittleness, so the disposition remains but manifestation is blocked. This avoids the objections the TA is worried about.

  For misconceptions: Students might think finks and masks are the same, needing the same fix. Or that a ceteris paribus clause solves both. Or that if the disposition survives, the manifestation must occur in some form. Each needs addressing at specific points. For example, after presenting the mask case, contrast it with the fink to highlight structural differences.

  The TA's two mug cases: The polymer-coated mug (stiffens on impact) is a mask. The other, where impact anneals the ceramic, is a fink. Present the mask case first to reinforce the masking concept. Then the fink variant shows how the disposition is lost. The hybrid case? If the same impact both stiffens and anneals, it's both a fink and mask. But that might confuse students, so it's better to present them separately to clarify each mechanism.

  The question at the end: Ask for an example of a mask and why it's not a fink. A tempting wrong answer would describe a fink but call it a mask. Avoid discussing multi-track dispositions or probabilistic cases to keep the session focused.

  Structure the session: Start with SCA recap, then the known fink case. Introduce mask with bubble-wrap example. Contrast structures. Address misconceptions. Use mug cases to illustrate each. End with the question to test understanding.
answer: |-
  Here is a precise 50-minute section plan addressing your requirements:

  **Order of Components & Dependencies:**
  1.  **Recap SCA & Fink (10 mins):** Start by restating SCA (Object O is disposed to M when stimulated by S iff: if O were S'd, it would M). Revisit the familiar finkish wire (live, but device cuts current *if* touched). Emphasize **the fink *removes the disposition itself* precisely when the stimulus occurs.**
  2.  **Introduce Masking (Core Concept - 5 mins):** Define masking: **A mask *leaves the disposition intact* but *intervenes to prevent the manifestation* from occurring, *even though* the stimulus occurs and the disposition is present.**
  3.  **Present Masking Case (15 mins):** Use **electrostatic bubble-wrap protecting a fragile glass.** *Key Features:* The glass *is* fragile (disposition present). It *is* struck (stimulus occurs). The bubble-wrap instantly activates *upon impact* to absorb/distribute the force (intervention). The glass *does not break* (manifestation fails). *Crucially:* The bubble-wrap **does not alter the glass's intrinsic brittleness**; it only blocks the force *caused by the strike* from reaching the glass sufficiently to break it. The fragility remains. *This must be established before the mask looks like a counterexample:* Students must grasp that the disposition *survives* the intervention.
  4.  **Contrast Structures (10 mins):** Explicitly diagram the difference:
      *   **Fink:** Stimulus Occurs -> **Disposition Removed** -> Manifestation Fails.
      *   **Mask:** Stimulus Occurs -> **Disposition Present** -> **Intervention Blocks Manifestation**.
      *   *Highlight:* Finks attack the *antecedent* (the object isn't disposed *when* S'd). Masks allow the antecedent to be true but show the *consequent* can still be false.
  5.  **Reverse Failure (Omit):** **Do not introduce** the reverse failure (true conditional, absent disposition - e.g., mimickers, mimics). It is a distinct problem (falsifying the sufficiency of SCA) and would blur the focus on the distinction between finks (falsifying necessity) and masks (also falsifying sufficiency, but via a different mechanism).

  **Carrying Case for Masking:**
  *   **Use the Electrostatic Bubble-Wrap:** It best satisfies your requirements.
      *   **Has:** Clear disposition (fragility), clear stimulus (strike), clear manifestation failure (no break), clear *external* intervenor leaving the intrinsic disposition intact ("The glass is still just as brittle *right now* as an identical un-wrapped glass!").
      *   **Lacks:** Alteration of the object's intrinsic properties relevant to the disposition *during* the stimulus. Students can't easily argue the glass "wasn't really struck" (the impact happens on the bubble-wrap) or that its fragility is altered (emphasize the intervention is purely force-blocking).

  **Misconceptions & When to Head Them Off:**
  1.  **"Same Structure, Same Fix" (Head off during Step 4 - Contrast Structures):** Immediately after presenting the mask and contrasting the structures, explicitly state: "Because finks and masks work in *fundamentally different ways* (removing disposition vs. blocking manifestation while disposition persists), a solution that fixes one might not fix the other. They are distinct problems."
  2.  **"Ceteris Paribus Solves Both" (Head off after establishing Mask Survival - End of Step 3/Start of Step 4):** When establishing the disposition survives the mask, preempt: "You might think adding 'normal conditions' or 'ceteris paribus' fixes this. But *what counts* as normal? The bubble-wrap *is* part of the conditions *when* the glass is struck. The disposition *is* there. SCA only requires the conditional to be true. The mask shows it can be false *even with* the disposition present and stimulus occurring. A vague 'normal conditions' clause doesn't automatically specify *which* potential interferers are excluded."
  3.  **"Manifestation Must Survive in Weakened Form" (Head off immediately when explaining the Mask Case - Step 3):** When describing the bubble-wrap preventing the break, explicitly state: "The key point is that the *definitive manifestation* (breaking) does *not* occur *at all*. There is no 'partial break' or 'weakened break'. The disposition is to break *simpliciter*, and that manifestation is *completely* blocked. The disposition survives *without* any attenuated manifestation occurring."

  **Placement of Your Mug Cases:**
  1.  **Polymer-Coated Mug (Stiffens on Impact):** Present **first** and **label as a Mask**. *Force students to notice:* The brittleness (disposition) is present before impact. The polymer stiffens *in response to impact*, absorbing/distributing the stress, preventing the break. The brittleness *persists* – the ceramic itself hasn't become less brittle intrinsically; its ability to *transmit* the stress is blocked externally.
  2.  **Annealing Variant (Brittleness Absent):** Present **second** and **label as a Fink**. *Force students to notice:* The impact itself *causes the brittleness to vanish momentarily*. The intrinsic property constituting the fragility is *removed* precisely when the stimulus occurs. The manifestation fails because the disposition is gone.
  3.  **Hybrid Case Status:** A single event causing *both* stiffening *and* annealing would be **both** a fink *and* a mask operating simultaneously (removing disposition *and* blocking manifestation). **Use it sparingly if at all** – its complexity risks confusing the core distinction. If mentioned, frame it as: "This single event does *two* distinct things: it finks (removes brittleness) *and* masks (stiffens the structure). This shows the mechanisms are separable, even if they sometimes co-occur."

  **Ending Question & Tempting Wrong Answer:**
  *   **Question:** "Imagine a sorcerer casts a spell on a fragile vase. The spell makes the vase instantly become non-fragile *only if* it is struck. Is this spell acting as a fink or a mask? Explain *why* it is one and *not* the other."
  *   **Shows Distinction:** Correct answer identifies it as a **fink** because the spell *removes the disposition itself* (fragility) upon stimulus. It's *not* a mask because there is no disposition *left* to manifest (no brittleness to cause breaking) and no external blocker of the manifestation *while* the disposition persists.
  *   **Tempting Wrong Answer:** "It's a mask because the vase doesn't break when struck, but it was fragile." (This mistakes the *outcome* – manifestation failure – for the *mechanism*. The corrector must focus on the *change in the vase's property* upon stimulus).

  **Explicitly Refuse to Go Into:**
  *   **Solutions to Finks/Masks:** Explicitly state: "Today is about seeing *that* these are two distinct problems for SCA and *why* they are distinct. We are *not* going to explore potential solutions (like reformed conditional analyses, causal bases, or Martin's 'would if nothing external interfered') today. That's for next time."

  **Timing Summary (Approx):**
  *   Step 1: Recap SCA & Fink (10 min)
  *   Step 2: Define Masking (5 min)
  *   Step 3: Present Bubble-Wrap Mask & Establish Survival (15 min - incl. addressing Misconception 3)
  *   Step 4: Contrast Structures Explicitly & Address Misconception 1 (10 min)
  *   Your Polymer Mug (Mask) & Annealing Mug (Fink) Comparison (5 min - Use visuals/diagrams if possible)
  *   Ending Question & Wrap-up (5 min - incl. addressing Misconception 2 if needed & stating refusal to discuss solutions)
