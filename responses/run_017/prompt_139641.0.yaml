  8. **Time constraint:** The procedure must be completed in a day. This limits the number of simulations and the complexity of the models that can be handled.

  We present this procedure as a practical method for handling heavy-tailed prospects with the understanding that it is a heuristic and may not work in all cases. For undefined prospects, the final decision must involve the committee's judgment.
answer: |-
  ### Procedure for Evaluating Heavy-Tailed Prospects

  This procedure classifies prospects into three categories—**Defined**, **Infinite (One-Sided)**, or **Undefined**—based on the behavior of their expected value. It replaces the expected value with a robust alternative in each case, adhering to three key principles:  
  1. **Repetition Rescue**: Works for one-sided infinite expectations but not undefined ones.  
  2. **Ranking via Difference**: Prospects with divergent tails can be ranked if their difference has a defined expectation.  
  3. **Antisymmetry**: A gamble and its mirror image must have opposite valuations.  

  Analysts can execute this in **one day** using simulation (1–10 million draws), tail-index estimation, and sensitivity plots. No measure theory is required.  

  ---

  #### **Step 1: Classify the Prospect**  
  Simulate 1 million draws from the prospect's outcome distribution.  

  1. **Estimate tail indices** for the right (upside) and left (downside) tails:  
     - Use the **Hill estimator** for the right tail (α<sub>+</sub>):  
       - Take the top 1% of positive outcomes.  
       - α<sub>+</sub> = (1/k) ∑<sub>i=1</sub><sup>k</sup> [log(X<sub>(i)</sub>) - log(X<sub>(k+1)</sub>) ]<sup>-1</sup>, where X<sub>(i)</sub> is the i-th largest positive value, and k = 0.5% of the sample size.  
     - Repeat for the left tail (α<sub>-</sub>) using absolute values of the bottom 1% of negative outcomes.  
     - **Uncertainty**: Use bootstrapping (100 subsamples) to get 90% confidence intervals.  

  2. **Diagnose convergence of the running mean**:  
     - Plot the cumulative sample mean over increasing sample sizes (e.g., every 10,000 draws).  
     - **Convergence criterion**: The mean stabilizes within ±5% over the last 200,000 draws.  

  3. **Classification rules**:  
     - **Defined**: α<sub>+</sub> > 1, α<sub>-</sub> > 1, **and** running mean converges.  
     - **Infinite (One-Sided)**:  
       - α<sub>+</sub> ≤ 1 and α<sub>-</sub> > 1 → **+∞**  
       - α<sub>-</sub> ≤ 1 and α<sub>+</sub> > 1 → **-∞**  
       - Running mean diverges monotonically.  
     - **Undefined**: α<sub>+</sub> ≤ 1 **and** α<sub>-</sub> ≤ 1, **and** running mean oscillates without converging.  

  ---

  #### **Step 2: Replace Expected Value**  
  - **Defined**: Compute expected value via sample mean.  
  - **Infinite (One-Sided)**: Report ±∞. Highlight that repetition rescues the valuation (LLN applies).  
  - **Undefined**:  
    - **Valuation**: Compute the **Cauchy principal value (CPV)** by sorting outcomes by absolute value (|X|) and taking the cumulative mean. Plot convergence.  
    - **Sensitivity report**:  
      - *Truncation*: Plot E[X | |X| < M] for M = 10<sup>3</sup>, 10<sup>4</sup>, ..., 10<sup>7</sup>.  
      - *Order dependence*: Compute CPV under 3 orderings—natural (simulation order), ascending (X<sub>i</sub>), and descending (X<sub>i</sub>). Report range of CPVs.  
    - **Committee decision required if**: CPV range spans zero or varies > 20% across orders/truncations.  

  #### **Key Properties Enforced**  
  - **Antisymmetry**: CPV for -X is the negative of CPV for X by construction.  
  - **Ranking undefined prospects**: To compare two undefined prospects X and Y, compute CPV of X - Y (using |X - Y| ordering). If CPV<sub>X-Y</sub> is stable, rank by its sign.  
  - **Repetition**: For one-sided infinite, repetition is valid. For undefined, repetition does not rescue (CPV remains unstable).  

  ---

  ### **Application to Cases**  

  #### **Case 1: Grant with Heavy Upside Tail**  
  - **Description**: Small chance of massive benefit; downside light-tailed (e.g., biotech moonshot).  
  - **Analysis**:  
    - α<sub>+</sub> ≈ 0.8 (90% CI: [0.7, 0.9]), α<sub>-</sub> ≈ 1.5 (CI: [1.3, 1.7]).  
    - Running mean of benefits increases steadily; harm mean stabilizes.  
  - **Classification**: **Infinite (One-Sided, +∞)**.  
  - **Valuation**: +∞. Repetition over multiple grants is valid (average benefit → ∞).  

  #### **Case 2: Intervention with α ≈ 0.9 on Benefit and Harm**  
  - **Description**: Symmetric heavy tails (e.g., geoengineering with catastrophic downside).  
  - **Analysis**:  
    - α<sub>+</sub> ≈ 0.9 (CI: [0.85, 0.95]), α<sub>-</sub> ≈ 0.9 (CI: [0.87, 0.93]).  
    - Running mean oscillates wildly (e.g., ±$10M to ±$1B).  
  - **Classification**: **Undefined**.  
  - **Valuation**:  
    - CPV ≈ -$2M (converges slowly when sorted by |X|).  
    - **Sensitivity report**:  
      - *Truncation*: E[X | |X| < M] = $3M (M=10<sup>3</sup>), -$1M (M=10<sup>5</sup>), -$4M (M=10<sup>7</sup>).  
      - *Order dependence*: CPV = $10M (natural), -$2M (|X|), -$15M (descending).  
    - **Decision**: Committee required. Range [-$15M, $10M] spans zero; truncation trend suggests net harm.  

  #### **Case 3: Flagship Proposal (Suspected Order-Dependence)**  
  - **Description**: Large positive EV in base model; tails suggest undefined expectation (e.g., AI risk intervention).  
  - **Analysis**:  
    - α<sub>+</sub> ≈ 0.7 (CI: [0.6, 0.8]), α<sub>-</sub> ≈ 0.6 (CI: [0.5, 0.7]).  
    - Running mean in natural order: converges to +$500M.  
    - Running mean sorted by |X|: oscillates between -$200M and +$100M.  
  - **Classification**: **Undefined** (both tails heavy, α ≤ 1).  
  - **Valuation**:  
    - CPV ≈ -$50M (stable when sorted by |X|).  
    - **Sensitivity report**:  
      - *Truncation*: E[X | |X| < M] = +$400M (M=10<sup>4</sup>), -$100M (M=10<sup>6</sup>), -$80M (M=10<sup>7</sup>).  
      - *Order dependence*: CPV = +$500M (natural), -$50M (|X|), +$300M (ascending). Range [-$50M, +$500M].  
    - **Decision**: Committee required. Base model’s +$500M is an artifact of simulation order. Truncation suggests net harm.  

  ---

  ### **Limitations of the Procedure**  
  1. **Non-i.i.d. Dependencies**: Fails for correlated prospects (e.g., grants with linked outcomes).  
  2. **Multidimensional Outcomes**: Cannot handle vector-valued payoffs (e.g., health and economic effects).  
  3. **Extremely Slow Convergence**: CPV may require >10<sup>7</sup> draws for stability, exceeding time limits.  
  4. **Subjectivity in Committee Judgment**: Sensitivity reports reduce but do not eliminate discretion.  
  5. **Model Error**: Relies on correct simulation; garbage in, garbage out.  

  ---

  ### **Appendix: Tools for Analysts**  
  - **Software**: Python (SciPy, NumPy), R (POT package for Hill estimator).  
  - **Visualization**: Cumulative mean plots, truncation sensitivity charts.  
  - **Time Allocation**:  
    - Simulation (2–4 hrs),  
    - Tail indices (1 hr),  
    - CPV/sensitivity (2 hrs),  
    - Reporting (1 hr).  

  This procedure ensures robust, transparent handling of heavy-tailed prospects while respecting mathematical constraints and committee oversight.
