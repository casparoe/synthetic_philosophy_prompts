prompt: |-
  I'm the quantitative lead at a foundation making roughly thirty long-shot grants a year — global catastrophic risk mitigation, transformative research — where the payoffs come out of models with Pareto-like tails whose index is sometimes near or below 1, on the upside, the downside, or both. Our committee's practice is to ask for an expected value for each prospect and fund by that number; I've become convinced that in some cases the number is an artifact of how a simulation happened to sum its draws. I want a written procedure an analyst can run in about a day, without measure theory, and defend to lay trustees.

  Take as given the shape of the problem: a gamble whose nth outcome has probability 2^-n and payoff ±2^n/n has an expected value equal to the alternating harmonic series — ln 2 in the natural order, anything you like in another — and undefined in the strict sense, since the positive and negative parts each diverge.

  The procedure should first sort a prospect into defined, infinite-but-one-sided, or undefined, using tests an analyst can actually run (tail-index estimates; the diagnostic that a running mean does not settle down as the sample grows). It should then say what replaces the expected value in each case. Three distinctions matter to me especially: that repetition rescues a one-sided infinite expectation but does not rescue an undefined one, so "we'll do this many times over" is an escape in the first case and not the second; that two prospects sharing the same divergent tail can often be ranked by the expectation of their difference even when neither has an expectation of its own; and that any fallback valuation must assign a gamble and its mirror image opposite values, so the procedure cannot smuggle in an ordering of the terms. Where the procedure hands the decision to a person rather than a calculation, say so explicitly, and specify the sensitivity report that shows how far the answer moves across admissible truncations and orders.

  Apply it to three cases: a grant whose only heavy tail is a small chance of very large benefit; an intervention whose model puts a tail index near 0.9 on both benefit and harm; and our committee's flagship proposal, which currently shows a large positive expected value that I suspect is order-dependent — include that one even though it will be the hardest to present. Close with a short statement of what the procedure cannot do.
reasoning: |-
  We are given a problem of evaluating prospects (grants) with heavy-tailed distributions, where the expected value may be undefined or infinite. We need a procedure that an analyst can run in about a day without measure theory. The procedure should classify a prospect into one of three categories:

  1. Defined: The expected value exists and is finite.
  2. Infinite but one-sided: Either the positive part or the negative part diverges, but not both (so the expectation is either +∞ or -∞).
  3. Undefined: Both the positive and negative parts diverge (so the expectation does not exist in the usual sense).

  The procedure must also provide a way to value the prospect in each case, with attention to three key distinctions:

  a) Repetition: If the expectation is one-sided infinite, then repeating the prospect many times can "rescue" the situation (in the sense that the average outcome converges to the infinite expectation). But if the expectation is undefined, repetition does not help.

  b) Ranking: Even when two prospects do not have defined expectations, we might be able to rank them by the expectation of their difference (if that expectation exists).

  c) Symmetry: The valuation must assign a gamble and its mirror image opposite values.

  We are to apply the procedure to three cases:

  1. A grant with a small chance of very large benefit (only heavy tail on the upside).
  2. An intervention with tail index near 0.9 on both benefit and harm (both tails heavy).
  3. A flagship proposal with a large positive expected value that is suspected to be order-dependent.

  Finally, we must note the limitations of the procedure.

  ## Procedure

  We assume that the prospect is modeled by a random variable X. We have a model that allows us to sample from the distribution of X (or at least to compute probabilities and payoffs for various outcomes). However, note that in the example given, the outcomes are discrete with probabilities 2^-n and payoffs ±2^n/n. In practice, we may have continuous distributions or other discrete structures.

  ### Step 1: Check for finite expectation (Defined)

  We want to test if E[|X|] < ∞. This is equivalent to the expectation being defined and finite.

  **Test:**
  - Estimate the tail indices for both the right (positive) tail and the left (negative) tail. If both tails decay sufficiently fast (i.e., tail index > 1), then the expectation is finite.

  **How to estimate tail indices:**
  - For the right tail: consider the distribution of X given X > t as t becomes large. The tail index α (for a Pareto-like tail) is defined by P(X > x) ~ C * x^(-α) as x → ∞. Similarly for the left tail (considering |X| when X is large negative).
  - Standard methods: Hill estimator for the right tail. We can use a similar approach for the left tail by taking absolute values of the negative part.

  **Procedure for tail index estimation:**
  1. For the right tail: take the upper k order statistics (i.e., the k largest observations) from a large sample (say N=1,000,000) of X. Let these be X_(1) ≥ X_(2) ≥ ... ≥ X_(k).
  2. The Hill estimator for the tail index α is: 
     α_right = [ (1/(k-1)) * Σ_{i=1}^{k-1} log(X_(i)) - log(X_(k)) ]^{-1}
     (Note: This is for the case where the tail is Pareto above a threshold; we assume that our distribution is in the domain of attraction of a Pareto distribution.)

     Alternatively, we can use a more robust method that uses multiple thresholds and looks for stability.

  3. Similarly, for the left tail: take the lower k order statistics (the k most negative) and set Y_i = -X_i for these. Then apply the Hill estimator to the Y_i's to get α_left.

  **Decision:**
  - If both α_right > 1 and α_left > 1, then E[|X|] < ∞. Classify as "Defined" and compute the expected value by standard Monte Carlo (with a large sample) and report it.

  **Note:** In practice, we may not have exact samples but a model that we can simulate. We must simulate a large number of scenarios (say 1 million) to get reliable estimates of the tail indices and the expectation.

  ### Step 2: Check for one-sided infinite expectation

  If at least one tail index is ≤ 1, then we need to check whether the expectation is one-sided infinite or undefined.

  We compute the partial expectations for the positive and negative parts separately.

  Recall: E[X] = E[X^+] - E[X^-], where X^+ = max(X,0) and X^- = max(-X,0). The expectation exists if and only if at least one of E[X^+] or E[X^-] is finite. It is infinite if one is finite and the other infinite, and undefined if both are infinite.

  **Test:**
  - For the positive part: if α_right ≤ 1, then E[X^+] = ∞. Otherwise, it is finite.
  - For the negative part: if α_left ≤ 1, then E[X^-] = ∞. Otherwise, it is finite.

  But note: we must be cautious because the tail index estimate might be near 1. We need to check the divergence of the partial sums.

  **Diagnostic for divergence:**
  - We can also run a diagnostic: compute the running mean of X^+ and X^- as the sample size grows. For the positive part, if we see that the sample mean of X^+ does not stabilize and keeps increasing as the sample size increases (and similarly for X^-), that is an indication of divergence.

  **Procedure:**
  1. Simulate a very large sample (N=10^6 or more) of X.
  2. Split the sample into batches (e.g., 100 batches of 10,000 each). Compute the sample mean of X^+ and X^- for the cumulative sample up to batch k (for k=1 to 100). Plot the cumulative mean of X^+ and X^- against the batch index.
  3. If the plot for X^+ shows a clear upward trend (without settling) and the tail index α_right ≤ 1, then we conclude E[X^+] = ∞. Similarly for X^-.

  **Classification:**
  - If E[X^+] = ∞ and E[X^-] < ∞, then E[X] = ∞. Classify as "Infinite (positive)".
  - If E[X^-] = ∞ and E[X^+] < ∞, then E[X] = -∞. Classify as "Infinite (negative)".
  - If both E[X^+] = ∞ and E[X^-] = ∞, then E[X] is undefined. Classify as "Undefined".

  ### Step 3: Handling each case

  #### Case 1: Defined
  - Compute the expected value by the sample mean of a large simulation (e.g., 1 million draws). Report this number.

  #### Case 2: Infinite (positive or negative)
  - Report the expectation as +∞ or -∞ accordingly.
  - Additionally, note that repetition rescues: if we repeat the prospect independently n times, then by the law of large numbers (if the variance is finite) or appropriate stable laws (if variance is infinite but mean exists), the average will converge to the infinite mean. However, note that for one-sided infinite mean, the average will converge to the infinite value (with the sign of the expectation) in probability. But for the positive infinite case, the average will go to +∞ as n increases.

  #### Case 3: Undefined
  - Here we cannot use the expected value. We have two possibilities:
    a) Compare two prospects by the expectation of their difference. If we have two prospects X and Y, and if E[X-Y] exists (i.e., is defined and finite or one-sided infinite), then we can use that to rank them.
    b) For a single prospect, we need an alternative valuation.

  **Alternative valuation for a single undefined prospect:**
  - We require that the valuation must be antisymmetric: if we replace X by -X, the valuation must change sign.
  - We cannot simply truncate the distribution arbitrarily because the result might depend on the truncation point and the order of summation.

  **Proposed method:**
  We use a symmetric truncation and then take a limit. The idea is to consider the expectation of X conditioned on |X| ≤ M, and then let M → ∞. However, this limit may not exist. Alternatively, we can use the Cauchy principal value: if we order the outcomes by their absolute value and then compute the cumulative mean, that might converge.

  **Cauchy principal value for expectation:**
  - Order the sample by the absolute value of the outcomes. Then compute the running mean in that order. If that running mean converges to a value, then we can use that as the principal value.

  **Procedure:**
  1. Simulate a very large sample (N=10^6) of X.
  2. Sort the sample by |X_i|, from smallest to largest.
  3. Compute the cumulative mean: S_k = (X_1 + ... + X_k) / k, for k=1 to N.
  4. Plot S_k against k. If the sequence S_k converges to a limit as k increases, then take that limit as the principal value.
  5. If it does not converge, then we cannot assign a principal value by this method.

  **Why this might work:** In the example of the alternating harmonic series, if we order by absolute value (which is 2^n/n) then the terms are 2^0/0? (Wait, note the example: outcomes at n=1,2,... with probability 2^-n and payoff ±2^n/n. The absolute value of payoff is 2^n/n, which is increasing in n. So ordering by absolute value is the same as the natural order. But in the natural order, the partial sums of the alternating harmonic series converge to ln2. So this method would yield ln2.

  **But note:** The problem states that in another order the series can be rearranged to converge to anything. However, by fixing the order (by absolute value) we are essentially choosing a particular summation method. This is the Cauchy principal value for the expectation.

  **Sensitivity analysis:**
  - We must also consider the sensitivity to the truncation. Therefore, we will also compute the expectation for a sequence of truncated distributions: |X| ≤ M, for increasing M. We then plot the expected value as a function of M. If it approaches a limit, we report that limit. If it oscillates or diverges, then we note that the principal value is sensitive.

  **Report for undefined prospects:**
  - If the principal value (by ordering absolute value) converges, then report that value and note that it is the Cauchy principal value. Also, report the plot of the cumulative mean and the truncation-based expectations as M increases.
  - If it does not converge, then we must hand the decision to a person. The sensitivity report should show the range of possible values that the expectation can take under different truncations and orderings (if we use different orders in the summation). However, note that in the symmetric ordering (by absolute value) we are fixing the order.

  **Sensitivity report:**
  - For truncation: compute the expected value for |X| ≤ M for M = M_1, M_2, ..., M_k (exponentially increasing: e.g., 10, 100, 1000, 10000, ...). Plot E[X | |X|≤M] vs M.
  - For order dependence: we cannot test all orders, but we can test a few alternative orders (e.g., by taking the natural order of simulation, by ordering by the value of X, by absolute value, and by a random order). Then compute the cumulative mean in each of these orders and see how much they differ.

  **Decision:**
  - If the principal value converges and the truncation-based expectations converge to the same value, we report that value.
  - If not, we do not assign a value. We then say that the prospect is too sensitive to be valued by an automated procedure and must be evaluated by the committee with the sensitivity report.

  ### Additional note: Ranking two undefined prospects
  If we have two prospects X and Y, and both are undefined, we can form Z = X - Y. Then we run the procedure on Z. 
  - If Z is Defined, then we can use E[Z] to rank (if E[Z] > 0, then X is better than Y).
  - If Z is Infinite (positive), then X is better than Y (since E[X-Y] = ∞); similarly for negative.
  - If Z is Undefined, then we cannot rank them by this method. We would have to evaluate each by the above procedure and then compare the principal values? But note: the principal value of X and Y might not be comparable because they are computed independently. However, we can compute the principal value of Z by the same method (ordering by |Z|). If that converges, then we use that to rank.

  ## Application to the three cases

  ### Case 1: Grant with only heavy tail on the upside (small chance of very large benefit)
  - The downside is bounded (or has a tail index >1) and the upside has a tail index <=1? Actually, the problem says "only heavy tail" meaning the downside is light. So:
    - α_left > 1 (since left tail is light) and α_right <= 1 (right tail is heavy).
  - Then E[X^-] < ∞ and E[X^+] = ∞. Therefore, E[X] = ∞.
  - Classification: Infinite (positive).
  - Report: +∞. And note that repetition rescues: if we do this grant many times, the average benefit will go to infinity.

  ### Case 2: Intervention with tail index near 0.9 on both benefit and harm
  - Here, α_right ≈ 0.9 <=1 and α_left ≈ 0.9 <=1. Therefore, both E[X^+] and E[X^-] are infinite. So E[X] is undefined.
  - We then try to compute the Cauchy principal value by ordering by absolute value. We simulate a large sample, sort by |X|, and compute the cumulative mean. 
  - We also do the truncation sensitivity: compute E[X | |X|<=M] for increasing M and see if it converges.
  - Given the tail index 0.9 on both sides, we suspect that the principal value might converge? But note: the tail index 0.9 means that the tails are very heavy. However, the rate of convergence of the cumulative mean in the absolute value ordering depends on the balance of positive and negative terms in the tails.

  **Example:** If the positive and negative tails are symmetric (same tail index and same constant), then the principal value might converge to 0. But if they are asymmetric, it might converge to a finite number or diverge.

  - We run the procedure: 
    - Simulate a large sample (say 10^6) from the model.
    - Sort by |X| (ascending).
    - Compute cumulative mean and plot. If the plot stabilizes, we take that value.
    - Also, plot the truncation-based expectation for M = 10, 100, 1000, 10000, ... and see if it stabilizes.

  - If both methods show convergence to the same number, we report that number as the principal value. Otherwise, we must hand it over to the committee with the sensitivity report.

  ### Case 3: Flagship proposal with suspected order-dependent expected value
  - Assume we have a model that gives a large positive expected value, but we suspect order dependence. This suggests that the expectation might be undefined (both tails heavy) and the standard Monte Carlo is summing in an order that happens to give a positive value.

  **Steps:**
  1. Estimate tail indices: if both are <=1, then it's undefined.
  2. Then run the principal value procedure (ordering by absolute value) and see what value we get.
  3. Also, compute the expectation in the natural simulation order (which is the order the model uses) and in a few other orders (e.g., sort by X, sort by |X|, and a random permutation) and see how the cumulative mean behaves.

