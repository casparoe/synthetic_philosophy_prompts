  **Decision:**
  - If the principal value converges and the truncation-based expectations converge to the same value, then we use that value.
  - Otherwise, we present the sensitivity report to the committee. The committee must decide based on the range of possible values and the context.

  ## Limitations of the procedure

  1. **Model dependency:** The procedure relies on having a model that can be simulated. If the model is misspecified, the results will be wrong.

