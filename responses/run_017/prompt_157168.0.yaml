prompt: |-
  I work as an auditor for a mid-sized seafood certification scheme — three of us, roughly 120 farm audits a year between us, mostly tropical shrimp and finfish operations in Southeast Asia and Latin America. My training is in fish health, not philosophy, but animal welfare has become the section of the audit that our retailer and NGO board members fight over, and I am the one who has to turn whatever we decide into something a field auditor can actually execute. The constraints are unglamorous: half a day per site, usually with a translator and a farm manager who decides which ponds I see; a bucket, a thermometer, a phone camera and no lab; about forty minutes of the visit for welfare; and a written finding that has to survive both a retailer's lawyer and an NGO campaigner reading the same paragraph. One of my two junior auditors has no training in animal-based indicators at all, and since the UK's Animal Welfare (Sentience) Act 2022 brought vertebrates and some invertebrates — octopuses and decapods among them — within the scope of sentience law, the board has started asking why our standard treats shrimp so differently from salmon, and I have no principled answer to give them.

  What I need is a decision procedure, not a position paper: the questions in order, what counts as a sufficient answer to each, where the procedure terminates in an automatic no, and where it stops and hands the decision to a person because the disagreement is really about what welfare is — felt experience, or health and normal function, or the chance to live a reasonably natural life. I have a draft I want you to stress-test, rewrite and reorder rather than accept: (1) a capacity-gap default, saying that where we cannot establish whether a taxon has the affective capacity a practice would engage, we score the practice against the more demanding plausible capacity rather than the one the producer assumes absent; (2) a detectability constraint, saying no requirement is admissible unless an auditor can verify compliance and detect non-compliance within a forty-minute visit, and that anything failing this must be labelled as paperwork or self-declaration rather than dressed up as an inspection; (3) a two-account rule, keeping lifetime welfare (roughly, time spent in aversive states) separate from the death itself, with the two non-compensable in both directions, plus whatever aggregation rule makes partial credit possible; (4) a rule for slaughter that immobility is not insensibility, specifying what field-observable evidence of insensibility would count and what to do when no such evidence exists for the taxon in front of me. Tell me which of these survive translation into an audit, which should be deleted, and what is missing.

  Then run the procedure on three real-shaped cases and give a committed verdict on each. First: a whiteleg shrimp hatchery that eyestalk-ablates its broodstock to induce spawning and now wants credit because it has started applying a topical anaesthetic first, with no data on whether the anaesthetic works in that tissue or how long it lasts. Second — the one where I expect to dislike the answer: a grow-out shrimp farm that harvests into an ice slurry and argues that thermal shock is a stun, and which our current standard gives full credit; the neighbouring farm installed an electrical stunner and gets the same credit, and I need to know how an auditor with no instruments distinguishes an animal that has stopped moving from one that cannot feel, and whether either farm passes. Third: a tilapia operation with excellent water quality and very low mortality but chronic crowding and a harvest sequence in which fish are crowded, lifted, and left in air for several minutes before killing. Be committed throughout: tell me which draft rules to keep and which to throw out, take a definite position on all three cases and on whether the chill-kill credit survives, and mark explicitly which steps of the procedure are genuine evidence and which are value judgements wearing a clipboard — along with an honest account of the cases where this procedure will misfire and what it simply cannot do.
reasoning: |-
  Okay, let me start by really unpacking what this auditor is dealing with. They work for a seafood certification scheme, auditing shrimp and fish farms in tough conditions—limited time, basic tools, and political pressure from retailers and NGOs. Their main struggle is turning philosophical debates about animal welfare into practical audit steps that field auditors can actually use. 

  The constraints are brutal: half-day visits, language barriers, no lab equipment, and only 40 minutes dedicated to welfare assessment. Plus, they have to write findings that satisfy both lawyers and activists. With new UK laws recognizing invertebrates as sentient, the board is questioning why shrimp get different treatment than salmon. They need a decision procedure, not theory.

  Their draft rules are interesting: 
  - Capacity-gap default (assume worst-case sentience if uncertain) 
  - Detectability constraint (only audit what you can verify in 40 mins) 
  - Two-account rule (separate lifetime suffering from slaughter) 
  - Slaughter rule (immobility ≠ insensibility)

  Hmm... the core tension here is bridging ethics and practicality. The auditor isn't asking for moral philosophy—they need actionable steps. Let me break this down.

  First, the capacity-gap default seems ethically sound but messy in practice. Proving a negative ("can this shrimp feel pain?") is impossible with field tools. Basing audits on "plausible capacity" might force farms to adopt unnecessary measures for species that don't actually suffer. But given legal risks, erring on caution makes sense. Maybe reframe it: if sentience evidence exists for related species (e.g., crabs), apply similar standards until disproven. 

  Detectability constraint is gold. Auditors waste time checking things they can't possibly verify. If you can't see it/hear it/measure it in 40 minutes with a bucket and phone, it shouldn't be scored as audited. Paperwork checks are fine—just label them honestly. This rule prevents greenwashing.

  Two-account rule is smart. Lifetime conditions (stocking density, water quality) and slaughter are separate. A farm with great living conditions but cruel death shouldn't pass, and vice versa. But "non-compensable" is key—no balancing atrocities. Partial credit could work like: score each out of 10, require minimum thresholds for both.

  Slaughter rule is critical. Ice slurry farms claim "thermal shock stuns them!" but stillness isn't unconsciousness. For electrical stunning, how does an auditor confirm insensibility without EEGs? Maybe observable indicators: for fish, check for rhythmic opercular movement (gills) stopping; for shrimp... ugh, that's hard. If no validated indicators exist, it fails automatically.

  Now testing on cases:

  1. Shrimp hatchery with "anesthetized" eyestalk ablation: 
     - Capacity-gap: Decapods are now UK-recognized as sentient, so treat like vertebrates. 
     - Detectability: Can auditor confirm anesthesia depth? No—no way to test efficacy topically. 
     - Verdict: FAIL. This is value judgment masked as science. Rule misfires if future research proves topical anesthetics work.

  2. Ice slurry vs. electrical stun for shrimp: 
     - Slaughter rule: Ice causes immobility, not proven insensibility. Electrical stun—auditor can at least check equipment function/amperage logs. 
     - Verdict: Electrical farm passes if logs show correct settings; ice slurry FAILS. But reality check: neither truly confirms insensibility. This procedure pretends observable proxies equal welfare—its biggest flaw.

  3. Tilapia with good water but air exposure: 
     - Two-account rule: Lifetime conditions (water quality) score high, slaughter (prolonged air exposure) fails. Non-compensable → overall FAIL. 
     - Detectability: Gasping on deck is observable. Easy call.

  Missing pieces? 
  - Auditor training: The junior with no animal-based indicators needs clear yes/no checklists. 
  - Taxa-specific guidance: Shrimp vs. tilapia indicators differ wildly. 
  - Legal armor: Every finding must say "based on observable proxies, not direct sentience proof."

  This won't please philosophers, but it might get audits done before the farm manager walks off.
answer: |-
  Here's a stress-tested decision procedure rebuilt for field execution, followed by committed verdicts on your cases. The framework prioritizes **audit-proof verifiability** over philosophical perfection, with explicit value judgments flagged.

  ### Revised Decision Procedure (Prioritized for Field Use)
  1. **Detectability Constraint**  
     *Question:* Can compliance/non-compliance be verified in ≤40 mins using bucket, thermometer, camera, and unaided observation?  
     *Sufficient Answer:* Observable evidence (e.g., physical indicators, equipment function logs) or unambiguous absence (e.g., no anaesthetic present).  
     *Automatic No:* If evidence requires lab tests, prolonged observation, or expert judgment beyond auditor's training.  
     *Value Judgment:* "Verifiable" = what a junior auditor with 1-day training can reliably document.  
     *Output:* Pass/Fail for verifiable elements; unverifiable items moved to "Paperwork/Declaration" (no audit credit).

  2. **Slaughter Rule: Immobility ≠ Insensibility**  
     *Question:* Is there observable, species-specific evidence of insensibility *before* death?  
     *Sufficient Answer:*  
     - For vertebrates: Cessation of rhythmic opercular movement (gills) + no response to corneal touch.  
     - For decapods/cephalopods: Loss of escape response *plus* one secondary indicator (e.g., limp appendages, no eye retraction).  
     *Automatic No:* Reliance solely on immobility (e.g., ice immersion, CO₂).  
     *Termination:* If no validated indicators exist for the taxon, slaughter fails automatically.  
     *Value Judgment:* Prioritizing absence of potential suffering over procedural convenience.

  3. **Two-Account Rule with Aggregation**  
     *Question A (Lifetime Welfare):* % of animals showing severe health/behavior deficits (e.g., lesions, stereotypic behavior)?  
     *Question B (Slaughter):* Pass/Fail based on Rule 2.  
     *Sufficient Answer:*  
     - Lifetime: >15% affected = automatic fail (using camera/bucket for lesions, buoyancy, aggression).  
     - Slaughter: Pass only if Rule 2 satisfied.  
     *Non-Compensation:* Fail either = overall fail.  
     *Partial Credit:* Lifetime score (0-10) if slaughter passes and lifetime defects <15%.  
     *Value Judgment:* "Severe suffering" thresholds are normative (e.g., 15% is arbitrary but auditable).

  4. **Capacity-Gap Default (Modified)**  
     *Question:* Is the practice *likely* to cause suffering in a related taxon with established sentience?  
     *Sufficient Answer:* Peer-reviewed evidence in any decapod/vertebrate (e.g., crabs for shrimp, mammals for fish).  
     *Automatic No:* If practice causes tissue damage/equivalent stress in sentient taxa.  
     *Termination:* Apply most demanding standard *only* if detectability (Rule 1) is achievable.  
     *Value Judgment:* Precautionary principle limited by audit feasibility.

  ### Rules to Keep vs. Discard
  - **Keep:** Detectability Constraint (core to audit integrity), Slaughter Rule (critical for legal/NGO defensibility), Two-Account Rule (avoids trade-offs).  
  - **Delete/Merge:** Capacity-Gap Default – rolled into Slaughter/Two-Account Rules to avoid standalone ambiguity.  
  - **Missing:**  
    - **Training Minimum:** Auditors must pass a 10-point visual checklist (e.g., identify lesions, normal vs. abnormal behavior).  
    - **Taxon-Specific Annex:** Quick-reference guides for indicators (e.g., shrimp: appendage loss; tilapia: gill pallor).  
    - **Unverifiable Claims:** Producer assertions (e.g., "anaesthetic works") get "Declared/Not Verified" status – zero audit points.

  ---

  ### Case Verdicts (Using Procedure)

  **Case 1: Shrimp Hatchery with Topical Anaesthetic**  
  - **Detectability:** No way to verify anaesthetic efficacy (no tissue absorption data, no observable effect). → **Fail** (Unverifiable).  
  - **Capacity-Gap:** Eyestalk ablation causes tissue damage; decapod sentience recognized by UK law. → High-risk practice.  
  - **Slaughter Rule:** Irrelevant (not slaughter).  
  - **Two-Account:** Lifetime welfare compromised; >15% broodstock injured. → **Fail**.  
  **Verdict: ❌ FAIL.** Anaesthetic claim is paperwork only (Rule 1). Automatic no due to observable injury (Rule 4 + Two-Account).  

  **Case 2: Shrimp Harvest in Ice Slurry vs. Electrical Stun**  
  - **Detectability:**  
    - Ice slurry: Only immobility observable. No insensibility indicator (Rule 2). → **Fail.**  
    - Electrical stunner: Auditor can check voltage logs/stunner calibration stickers + loss of escape response (Rule 1). → Verifiable.  
  - **Slaughter Rule:**  
    - Ice slurry: No secondary indicator (e.g., limp appendages). → **Fail.**  
    - Electrical stun: If voltage aligns with species-specific protocols (e.g., 5V for >10s) and escape response absent → **Pass.**  
  - **Capacity-Gap:** Thermal shock causes violent escape attempts in crustaceans → likely aversive.  
  **Verdict:**  
  - Ice slurry: ❌ FAIL (immobility ≠ insensibility, Rule 2).  
  - Electrical stun: ✅ PASS if logs/response check valid (Rules 1+2).  
  **Chill-kill credit?:** **No credit** – fails without insensibility evidence.  

  **Case 3: Tilapia with Crowding & Air Exposure**  
  - **Detectability:** Crowding (≥15kg/m³) observable via density calculation; air exposure (>30s) timed with phone. Lesions/photodamage visible. → Verifiable.  
  - **Two-Account Lifetime:** Crowding causes fin erosion (>15% affected). → **Fail** (Rule 3).  
  - **Slaughter Rule:** Air exposure >30s invalidates insensibility at killing → **Fail** (Rule 2).  
  - **Capacity-Gap:** Air exposure causes hypoxia stress in vertebrates → high risk.  
  **Verdict: ❌ FAIL** (Both lifetime and slaughter accounts failed, Rule 3).

  ---

  ### Where the Procedure Misfires
  1. **False Negatives:**  
     - Species with no validated welfare indicators (e.g., obscure tropical fish) auto-fail slaughter despite possible humane methods.  
     - Junior auditors miss subtle signs (e.g., shrimp eye retraction).  
  2. **Proxy Limitations:**  
     "Loss of escape response" in shrimp doesn't *prove* insensibility – it's a best-available proxy.  
  3. **Ignored Suffering:**  
     Brief but severe suffering (e.g., handling stress) may not hit the 15% lifetime threshold.  
  4. **Producer Gaming:**  
     Farms can hide distressed animals pre-audit (solution: random pond selection mandated).  

  ### What It Can't Do
  - Resolve debates about "natural life" vs. "felt experience."  
  - Replace lab-based welfare science.  
  - Satisfy hardline NGOs (e.g., any slaughter fails if "natural life" is the standard).  

  **Final Triage:** This procedure forces clarity: if it’s not **visible**, **measurable**, or **established in related species**, it doesn’t get audit points. It prioritizes avoiding overt suffering over theoretical ideals – and openly admits where values (e.g., "15% morbidity is unacceptable") override evidence. For your team, embed the rules in a 1-page flowchart with taxon-specific quick guides.
