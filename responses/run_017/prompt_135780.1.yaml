prompt: |-
  Hey — I'm in a smallish reading group this term on collective action and climate ethics (six of us, mostly philosophy grad students plus one econ guy who keeps saying "but what's the counterfactual"), and I'm meant to present something in two weeks on the inefficacy objection. I've realised I have no idea what I actually think, because when I go case by case my verdicts don't line up with each other and my flatmate — who is a vegan and argues about this while doing the washing up — says I'm just switching between two principles whenever it suits me: expected difference made, and some kind of complicity or participation thing. So before I write anything I want to see what my own verdicts add up to. Here they are, as honestly as I can report them: skipping a national election — not wrong, no duty, though voting is fine too; buying a supermarket chicken where the bird is already dead and the shop's ordering algorithm will not react to my single purchase — wrong; eating the leftover roast chicken in my flatmate's fridge that she's about to bin anyway — totally fine, not even slightly bad; buying from a butcher who kills to order — clearly wrong and, weirdly, about as bad as the supermarket one; taking a long drive on my own just for the view — not wrong, I basically agree with the reading on that; having a third kid, which by any accounting emits vastly more than the driving or the chicken — also not wrong, and I don't want to give that one up; leaving the heating on all day in the six-person house where the bill is split equally — mildly wrong, real but small; paying my taxes when roughly a tenth of it goes to weapons, and my individual payment changes nothing either way — fine, I should pay; dropping twenty bucks in a collection for a group that will put up a billboard I find genuinely hateful, knowing they'll hit their target without me — wrong, and not just a little; buying extra electricity on a grid where the total emissions are fixed by a binding permit cap, so my extra usage just nudges the permit price and someone else uses less — not wrong, though this is the one I'm least sure about. There's also the case where there's no mechanism at all: a cash-only butcher with no inventory system, no loyalty card, in a town where nobody aggregates sales data, so my purchase can't even feed into a signal — and I still think that's wrong, just somehow less bad than the tracked supermarket case. What I keep groping toward is something like: you're off the hook only if your act makes no difference to the harm AND you're not voluntarily buying into a practice that produces it. But that seems to give the wrong verdict on the tax case and on the capped-permit electricity case, and it can't explain why the fridge leftovers are fine while the supermarket chicken isn't, since in both cases nothing changes and no money reaches anyone who'll kill another animal because of me. Can you state, precisely enough that it generates verdicts on cases I haven't listed, the principle — or the two principles, if it really is two — that gets closest to this pattern, tell me which clause is doing the work in which case, and be straight about which of my verdicts it can't accommodate and what it would force me to give up? And what does it say about the case I keep flip-flopping on: a conference flight my employer has already paid for, on a route they've already booked, where my not going would leave the seat empty? I also can't tell whether the arithmetic should change for harms that depend on how many people take part rather than on how much harm each participant does — a boycott that only bites if 30% of the neighbourhood joins, say — or whether that's just the same principle with different numbers plugged in. Sorry this is a lot, I've been going round in circles with it for about a week and I'd rather find out now that one of my verdicts is indefensible than halfway through the presentation.
reasoning: |-
  Okay, let me try to unpack this user's problem. They're in a reading group on collective action and climate ethics, preparing a presentation on the inefficacy objection. Their main struggle is reconciling their intuitive judgments about various cases involving individual actions and their moral implications. They've listed several scenarios where their verdicts seem inconsistent, and they're worried about being accused of switching between principles arbitrarily.

  First, I need to understand the core issue. The user feels torn between two principles: expected difference (consequentialist approach) and complicity/participation (deontological approach). Their flatmate pointed this out, and it's causing confusion. The user provided specific examples to illustrate their conflicting intuitions. 

  Looking at their cases, some patterns emerge. For instance, buying supermarket chicken feels wrong even if no difference is made, while eating leftovers is fine. But in both cases, the individual action doesn't change the outcome. Why the different verdicts? The complicity principle might explain this - purchasing directly supports the harmful practice, whereas eating leftovers doesn't contribute to demand.

  The tax case is interesting. Paying taxes that fund weapons feels permissible despite complicity, while donating to a hate group feels wrong. This suggests the user distinguishes between unavoidable participation (taxes) vs. voluntary endorsement (donation). 

  The electricity case with capped permits is tricky. The user thinks it's not wrong to use extra electricity because the cap fixes total emissions. Here, the expected difference is near-zero, and since the cap is a regulatory mechanism, the complicity angle might feel weaker.

  For the conference flight, the employer has already paid, so not going leaves a seat empty. The user is unsure. Applying the principles: expected difference says no harm (seat would be empty anyway), but complicity might still apply because they're participating in the flight system. However, since the seat was already booked, their participation doesn't increase demand. This leans toward permissibility.

  The user also asks about threshold cases, like boycotts that require 30% participation. This seems like the same principles but with different probabilities. Expected difference matters more when near thresholds, while complicity still holds.

  The challenge is formulating a consistent principle that accommodates all these intuitions. The dual principle model seems most promising: an act is wrong if it (a) non-trivially increases expected harm or (b) constitutes material support to a harmful practice, with exceptions for negligible contribution or non-voluntary acts. 

  But this model struggles with the tax case (voluntary payment but seen as obligatory) and the third child (significant impact but exempted). For taxes, the distinction might be mandatory vs. optional actions. For having children, the user seems to exempt it on normative grounds (right to procreate), not consequentialist ones.

  The user's underlying need seems to be wanting ethical consistency without giving up deeply held intuitions (like having children). They might need to either adjust some verdicts or accept that their principles can't perfectly explain everything without additional normative commitments. Highlighting the dual principle's explanatory power while acknowledging its limitations could be the way forward for their presentation.
answer: |-
  Here's a precise principle (actually a dual principle) that best explains your pattern of verdicts, followed by a breakdown of how it applies to your cases, its limitations, and the conference flight dilemma:

  ### The Dual Principle

  An act is morally wrong if:
  1.  **It non-trivially increases the expected harm (directly or via signaling)**, *or*
  2.  **It constitutes material support for, or participation in, a harmful practice, *unless*:**
      *   The support is negligible relative to the practice's scale *and* causally isolated from triggering harm, *or*
      *   The participation is non-voluntary or obligatory.

  **Key Clarifications:**
  *   **Material Support/Participation:** Providing resources (money, effort) or active involvement that sustains, enables, or expresses endorsement of the harmful practice.
  *   **Negligible & Causally Isolated:** Your contribution is vanishingly small *and* demonstrably doesn't trigger a new instance of harm (e.g., no signal sent, no threshold crossed).
  *   **Non-voluntary/Obligatory:** Actions required by law, strong social duty, or basic needs where refusal carries disproportionate cost or is impossible.

  ---

  ### How the Principle Explains Your Verdicts

  1.  **Skipping National Election:**
      *   *Principle:* (1) Expected difference negligible. (2) Not material support for harm (abstention isn't support). **Permissible.**
  2.  **Buying Supermarket Chicken:**
      *   *Principle:* (2) Material support (money) for harmful practice (factory farming). Support not negligible (it's the core funding mechanism) *and* feeds into signals (even if algorithm doesn't react *today*, sales data influences *tomorrow*'s orders). **Wrong.**
  3.  **Eating Flatmate's Leftover Chicken:**
      *   *Principle:* (2) *No* material support (no money exchanged, no demand signal sent). No participation in the *act of purchasing/killing*. Harm already done, resource otherwise wasted. Fits "negligible & causally isolated." **Permissible.**
  4.  **Buying from Kill-to-Order Butcher:**
      *   *Principle:* (1) Directly triggers harm (expected difference = 1 bird). (2) Material support for the harmful practice. **Wrong (and strongly so).**
  5.  **Long Solo Drive for View:**
      *   *Principle:* (1) Expected difference tiny (emission share minuscule). (2) Material support for fossil fuels, but arguably *negligible* relative to scale *and* (in grid terms) often causally complex. Your reading likely emphasizes this. **Permissible.**
  6.  **Having a Third Kid:**
      *   *Principle:* (1) Expected difference large (lifetime emissions). *BUT* likely saved by exception: Strong normative argument that procreation is **non-voluntary/obligatory** in a fundamental sense (basic human liberty, societal continuity) outweighing the consequentialist harm in your judgment. **Permissible.**
  7.  **Leaving Heating On (Split Bill):**
      *   *Principle:* (1) Expected difference small but non-trivial (raises others' costs). (2) Materially supports waste/overconsumption. Degree of wrongness scales with the small expected harm and minor support. **Mildly Wrong.**
  8.  **Paying Taxes Funding Weapons:**
      *   *Principle:* (1) Expected difference negligible. (2) Material support for harmful practice. *BUT* saved by exception: Payment is **obligatory** (legal requirement, supports essential functions), refusal carries high cost (fines/jail). **Permissible.**
  9.  **Donating $20 to Hate Group (Target Met):**
      *   *Principle:* (1) Expected difference negligible (target met). (2) Clear **material support** for harmful practice (funding hate speech). Support not negligible (every dollar matters morally here) *and* expresses endorsement. **Wrong.**
  10. **Buying Extra Electricity (Binding Cap):**
      *   *Principle:* (1) Expected difference *near-zero* (price nudge effect on others' usage is minuscule and cancels your increase under cap). (2) Material support for fossil fuels? But harm is **capped**, your purchase doesn't *cause* new emissions. Arguably **negligible & causally isolated** *relative to the harm*. **Permissible.**
  11. **Cash-Only Butcher (No Signals):**
      *   *Principle:* (1) Expected difference = 1 bird (kill-to-order analogue). (2) Material support for harmful practice. Still wrong, but *less bad* than supermarket because no *systemic signal* is sent (only direct harm). Principle (2) applies, but the *lack of signaling* reduces the harm's connection to a broader system, hence "less bad." **Wrong.**

  ### The Conference Flight Dilemma

  *   **Principle Applied:**
      *   (1) Expected difference negligible: Seat empty anyway, airline doesn't get extra revenue, fuel burn almost identical. No signal sent about demand (employer booked, not you).
      *   (2) Material support/participation? You use the flight, but:
          *   Support: No *additional* money flows to airline/fossil fuels because of you.
          *   Participation: You are physically participating in flying. However, the flight happens regardless. Your participation doesn't *enable* this specific flight or trigger demand for future flights.
      *   **Verdict:** Fits "negligible & causally isolated" under Principle 2. **Permissible.** (Similar to flatmate's chicken - resource otherwise 'wasted', no new harm triggered).

  ### Threshold Cases (Boycott needing 30%)

  *   **Is it different?** No, just different numbers plugged into Principle 1 (Expected Difference). Here, your action's expected impact depends *critically* on the proximity to the threshold.
      *   *Far below 30%:* Your participation has very low expected impact (unlikely to trigger change) *but* still constitutes material support (Principle 2 applies, making it wrong).
      *   *Near 30% (e.g., 29.9%):* Your participation has a *high* expected impact (likely to trigger the boycott's success). Principle 1 strongly applies.
      *   *Above 30%:* Your participation has low expected impact (change already triggered) *but* Principle 2 (material support) still applies unless your action becomes causally isolated (e.g., the boycott succeeds regardless of your last-minute participation).
  *   **The Principle Handles It:** It captures the variable expected harm near thresholds while the complicity/support aspect (Principle 2) remains constant.

  ### Limitations and What You Might Need to Give Up

  1.  **The Third Kid:** This is the hardest case for the principle. The principle *as stated* clearly points to wrongness via Principle 1 (massive expected harm). Your verdict relies entirely on the "non-voluntary/obligatory" exception. You need to robustly defend why procreation falls under this exception *despite* the enormous harm. This is a normative commitment, not purely derived from the principle. Be prepared to argue this point explicitly. The principle forces you to justify this exception strongly.
  2.  **Cash-Only Butcher vs. Supermarket:** The principle explains why both are wrong (Principle 2), and why the supermarket case might feel *worse* (systemic signaling). However, if you feel the cash-only butcher is *significantly* less bad, the principle might slightly understate the moral difference you perceive. It explains "less bad" via lack of signaling, but the core wrongness (material support for killing) remains equally strong in both under Principle 2.
  3.  **Taxes:** This verdict is saved *only* by the "obligatory" exception. If your group challenges the moral permissibility of funding weapons *even* under obligation, this verdict becomes vulnerable. The principle highlights the tension: it *is* material support for harm, excused only by duty/coercion.

  ### Core Insight from Your Intuitions

  Your flatmate identified the duality correctly. Your pattern consistently shows that **material support/complicity (Principle 2) is sufficient for wrongness, even without expected difference (Principle 1).** However, you carve out exceptions where the support is truly negligible *and* causally inert (leftover chicken, capped electricity), or where the action is obligatory (taxes). Expected difference *alone* (Principle 1) only makes an act wrong when the difference is non-trivial (leaving heating on). The "non-voluntary" exception protects procreation. **Principle 2 (complicity/support) is doing the *most* work in your judgments.**

  This framework provides a coherent structure for your presentation. Acknowledge the tension around the third kid upfront – it reveals the boundary of the principle where strong normative commitments (rights, duties) override the harm calculation. Good luck!
