prompt: |-
  My city's land-use process has a shape I cannot make philosophical sense of, and I would like its implicit theory made explicit rather than argued for or against.

  Here is how it works, as I understand it. Most residential land is zoned single-family. Putting two or more units on a lot zoned single-family requires a discretionary permit: the city mails notice to owners of record within three hundred feet, holds a public hearing before the planning commission and then before the council, and issues written findings. Incompatibility with what the staff reports call neighborhood character, added traffic, loss of curbside parking, and shadow are all accepted grounds for denial, and none of them has to be quantified or shown to reduce anyone's property value. Opponents may also sue under the state environmental-review statute on the ground that the city's analysis was inadequate, which routinely adds a year or more; the delay is part of what opposition buys. By contrast, demolishing a house on the same lot and replacing it with one very large single-family house is approved ministerially: no notice, no hearing, no appeal, even when the replacement generates more traffic and more shadow than the duplex would have. Meanwhile the same council is under a state mandate to plan for several thousand additional homes over the next decade, and fair-housing law forbids the city, and largely forbids sellers and landlords, from selecting occupants by race, by family status, or, in some states, by source of income. The neighborhood therefore cannot say who may live on a street, though through the permit process it can determine roughly what the housing there will cost. Last year the council added a second track: projects within a quarter mile of a frequent bus line, and projects in which at least a fifth of the units are income-restricted, are now approved ministerially, with no hearing and no appeal, while everything else keeps the full process; and in the older streetcar-era neighborhoods near downtown it simultaneously adopted an overlay that strengthens the hearing requirement and adds design review. Nobody is compensated when the council approves over objection, and nobody pays anything when it denies.

  Five features of this package strike me as pulling in different directions. First, standing is set by parcel and radius rather than by stake: someone who bought last month and a family that has lived on the block for fifty years have identical standing, the tenant next door is not notified at all even when the project would demolish the building she lives in, and the people who would occupy the new units are not parties, are not counted, and are not notified, despite being more numerous and, by any ordinary measure of intensity, more strongly affected. Second, the intensity of opposition is itself recorded as evidence of harm: findings recite how many letters arrived and how many residents signed up to speak, and a large turnout counts in favor of denial, while no comparable tally is taken on the other side and intensity is never weighed against intensity. Third, the veto reaches the form of other people's property but not its occupancy or its ordinary use: a neighbor cannot be stopped from painting the house, keeping several cars on the property, or selling to anyone at all, but can be stopped from adding a second unit. Fourth, the same objection now has no force two blocks from a bus line and full force three blocks away, and is treated as defeasible by transit proximity and by subsidy while being hardened in the overlay districts. Fifth, the process contains no symmetric affirmative power: residents can block a great deal and compel nothing.

  What I want is the view of a person's claim on a place that this bundle presupposes, and I can think of five candidates. The first treats homeownership as an undiversifiable stake in a local collective asset whose value depends on the built and social character of the immediate area, with the veto as the protection of that stake. The second treats residence as membership in a self-governing community with a collective right to determine the shape of its common life, a right to the city as a right to shape rather than merely a right of access. The third treats the process as the protection of legitimate expectations formed under an earlier set of rules about school capacity, parking, quiet, and outlook. The fourth treats the hearing as an information-eliciting device, on the assumption that nearby residents know local facts that planners do not. The fifth says the practice is not the expression of any view at all but the predictable result of concentrated benefits and diffuse costs.

  For each of these, tell me whether the practice as I have described it strictly presupposes the view, is merely compatible with it, or actually conflicts with some feature of it; and be explicit about where my description underdetermines the answer, in the sense that two or three of the theories would license exactly the process I have described, and about which single change to the process would best discriminate between them. Then tell me what would have to change if the city replaced the presupposed view with one of the others: what a process built on the investment-stake view would look like as opposed to one built on the membership view, what a process built on the protection of expectations would substitute for the veto, and what a process honestly designed to elicit local information would do with a roomful of angry residents and a petition.

  I am less interested in whether the neighbors are right than in what the city commits itself to by running things this way. In particular: is the two-track reform an admission that the veto was never a right but only a defeasible privilege, and what principle is the city adopting when it removes that privilege near transit while reinforcing it, through the overlay, in the neighborhoods that are oldest, most central, and most able to afford lawyers?
reasoning: |-
  Okay, the user is describing their city's land-use process and wants to understand the underlying philosophical presuppositions. They've outlined five features that seem contradictory and presented five possible theories that might explain the system. The user isn't looking for arguments about whether the process is good or bad, but rather wants to analyze what the existing system implies about how the city views residents' claims to place.

  Hmm, this is quite sophisticated. The user has clearly thought deeply about urban planning and property rights. They're frustrated by the apparent contradictions in how their city handles development approvals, especially the difference between ministerial approvals for single-family mansions versus discretionary permits for multi-unit buildings. The two-track reform adds another layer of complexity.

  The five theories they propose cover different angles: property investment protection (Theory 1), community self-governance (Theory 2), protection of expectations (Theory 3), information gathering (Theory 4), and public choice theory about concentrated interests (Theory 5). I need to evaluate how well each theory aligns with the actual practices they described.

  Interesting how the user notes that standing is based on parcel ownership within 300 feet, ignoring tenants or future residents. This seems to privilege property owners over others. The recording of opposition intensity as evidence of harm is particularly telling - it suggests that the process values expressed preferences over actual impacts.

  The veto power over property form but not occupancy is another puzzle. Neighbors can block an additional unit but can't stop someone from painting their house bright pink or having multiple cars. This selectivity in control needs explanation.

  The two-track reform is especially revealing. By removing hearings near transit but strengthening them in historic neighborhoods, the city seems to be making value judgments about where community input matters most. The overlay districts favoring older, wealthier areas suggests class and preservation priorities.

  The lack of symmetric affirmative power stands out too - residents can block things but can't initiate improvements. This imbalance might point toward the public choice explanation (Theory 5) where organized groups exert disproportionate influence.

  I should also consider what changes would test these theories. For example, if standing included tenants or weighed intensity of support versus opposition, that would undermine Theory 1. If the city compensated owners when approving projects over objection, that would support Theory 3 about expectations.

  The user's last question about whether the two-track reform admits the veto is merely a privilege is sharp. The geographic selectivity does suggest the city views input rights as conditional rather than absolute. And the overlay districts favoring historic areas reveals a prioritization of preservation over equity in the core.
answer: |-
  Your city's land-use process reveals a complex, often contradictory philosophy of place-based claims. Below is a rigorous analysis of how each proposed theory aligns with the described practices, where ambiguities exist, and what changes would test or transform the system.

  ### Analysis of Theories Against Practice
  1.  **Investment-Stake View (Homeownership as undiversifiable stake in collective asset):**
      *   **Alignment:** **Strictly presupposed.** The process centers *property owners* (not residents/tenants) as stakeholders. Standing by parcel/radius treats all owners equally as investors in the neighborhood "asset." The veto protects against changes perceived to threaten asset value (character, traffic, parking, shadow), even absent quantified harm or property value loss. Ministerial approval for large single-family replacements preserves the *form* of investment while allowing intensification *within* that form.
      *   **Conflict:** The two-track reform conflicts. Removing the veto near transit/subsidized housing implies proximity to transit or affordability *reduces* the vulnerability of the "collective asset," undermining the idea that the stake is inherently undiversifiable and always needs protection. The overlay strengthens it selectively, suggesting only *certain* assets (historic, central) are truly irreplaceable.
      *   **Undetermined:** Why "neighborhood character" is defined primarily by built form (density, size) rather than occupancy or use. The theory licenses the focus on form but doesn't strictly require it.

  2.  **Membership View (Residence as membership in self-governing community with collective right to shape):**
      *   **Alignment:** **Compatible, but conflicts significantly.** The hearing process superficially resembles participatory governance. The focus on "character" hints at shaping a shared life.
      *   **Conflict:** **Fundamental.** Standing excludes key "members": tenants (directly affected by demolition) and future residents. The veto power is asymmetric (blocking change, not initiating community projects). The two-track reform explicitly denies the community's right to shape near transit/affordable housing, while the overlay grants *more* power only to *some* communities (older, central). The inability to control occupancy (race, family, income) directly contradicts the idea of a community defining its membership.
      *   **Undetermined:** The intense recording of opposition *could* be seen as measuring community will, but the lack of symmetric power and exclusion of members undermines this.

  3.  **Expectations View (Protection of legitimate expectations formed under prior rules):**
      *   **Alignment:** **Strictly presupposed in core, compatible overall.** The discretionary process for density increases defends expectations about school crowding, parking availability, traffic levels, sightlines (shadow), and neighborhood "feel" established under single-family zoning. Ministerial approval for same-use intensification (large SFH) aligns, as it fits the existing paradigm. The overlay strengthens protection for expectations in areas with strong pre-existing character.
      *   **Conflict:** The two-track reform directly conflicts by removing protection for expectations near transit/subsidized housing. It declares that proximity to transit or providing affordability *invalidates* the legitimacy of expectations formed under prior single-family rules.
      *   **Undetermined:** Why expectations about *form* (duplex bad, mansion ok) are paramount, while expectations about *use* (parking cars, painting houses) or *occupancy* are unprotected.

  4.  **Information-Eliciting View (Hearing gathers local knowledge for planners):**
      *   **Alignment:** **Compatible superficially, conflicts in practice.** The hearing *could* theoretically elicit local knowledge about drainage, micro-traffic patterns, unique site conditions.
      *   **Conflict:** **Fundamental.** The process records *intensity of opposition* as evidence of *harm*, not local *facts*. Accepted grounds (character, traffic, shadow) are subjective and don't require quantification – the opposite of factual input. Angry residents and petitions are treated as proof of detriment, not data points to be analyzed. Staff reports don't indicate how resident input *factually* alters technical analyses (e.g., traffic studies). Environmental lawsuits are delay tactics, not information tools.
      *   **Undetermined:** Whether staff *privately* uses input for factual adjustments, but the *process design* treats it as evidence of harm, not data.

  5.  **Public Choice View (Predictable result of concentrated benefits/diffuse costs):**
      *   **Alignment:** **Strictly presupposed as the *operational reality*, compatible as a *justification*.** The process perfectly reflects concentrated costs (felt by nearby owners) vs. diffuse benefits (future residents, city-wide housing need). The veto empowers the concentrated group. Ministerial approval for SFH mansions avoids mobilizing opposition (diffuse costs). The two-track reform carves out areas where benefits (transit ridership, affordable housing) become concentrated enough (or opposition is weaker) to overcome NIMBYism. Overlays empower the most organized (wealthy, historic districts). Lack of compensation/affirmative power fits rent-seeking dynamics. Environmental lawsuits are a weaponized cost.
      *   **Conflict:** None apparent in the description. It best explains the *actual mechanics and outcomes*, even if not the stated philosophy.
      *   **Undetermined:** Whether policymakers consciously believe this theory or simply respond to its pressures.

  ### Discriminating Changes & Process Transformation

  1.  **Best Discriminating Change:** Introduce **symmetric standing and power**.
      *   **Test:** Grant standing and notification to *tenants* within 300ft, and require the city to formally consider the *number and needs of potential future residents* as parties/counter-weight. Record *support* with the same weight as opposition.
      *   **Discrimination:**
          *   **Investment Stake:** Would conflict (tenants aren't owners; future residents aren't stakeholders).
          *   **Membership:** Would align (includes more members, acknowledges future community).
          *   **Expectations:** Would conflict (future residents/tenants didn't form expectations under old rules).
          *   **Information:** Neutral/Compatible (more data sources).
          *   **Public Choice:** Would dilute the concentrated power of owners, conflicting with the model.

  2.  **Processes Built on Different Views:**
      *   **Investment-Stake View:** Would likely include **compensation mechanisms** for owners when changes are approved over objection (acknowledging the devaluation of their stake). Veto power would be absolute unless compensated. Tenants/future residents irrelevant. *Form* control (density, size) remains paramount.
      *   **Membership View:** Would feature **binding neighborhood plans** developed via inclusive deliberation (owners, tenants, businesses, future resident reps). Decisions would align with the plan. **Affirmative powers** (e.g., initiating infrastructure upgrades, community land trusts) would exist alongside vetos. Control over *occupancy* (within fair housing limits) would be more plausible.
      *   **Expectations View:** Would **phase changes gradually** or **grandfather existing owners**. The veto might be replaced with **strict impact mitigation requirements** (e.g., developer *must* fund new parking spots or school seats proven to be needed) or **time-limited development moratoria** while infrastructure catches up. Compensation remains possible. Focus remains on quantifiable impacts (traffic counts, school enrollment projections) linked to prior expectations.
      *   **Information-Eliciting View:** Would structure hearings as **technical workshops/testimony under oath** focused on specific, verifiable local conditions. Planners would publish **reports reconciling resident input with technical data**. Intensity of feeling/numbers of opponents would be irrelevant; only factual contributions would be noted. Petitions/angry crowds would be managed as process noise, not evidence.
      *   **Public Choice View:** Would **minimize discretionary review** (shift to by-right zoning based on plans), **limit standing to directly abutting owners** (further concentrating costs/benefits), or implement **development impact fees/taxes** explicitly redistributing benefits to the community/opponents. The two-track reform is a classic example.

  3.  **Handling Angry Residents (Information-Eliciting Process):** Staff would **clearly separate factual testimony from opinion/emotion**. They would:
      *   Ask specific, technical questions about observable conditions.
      *   Require speakers to identify the factual basis for claims.
      *   Summarize factual input in a report, indicating how it was incorporated (or why it wasn't relevant/credible) into the technical analysis.
      *   Explicitly state that the *number* of opponents or their *intensity* is not a factor in the decision, only verifiable impacts.
      *   Treat petitions as expressions of sentiment, not evidence of harm.

  ### The Two-Track Reform & Overlay: Implications

  *   **Veto as Defeasible Privilege:** The reform **is a clear admission the veto is not a fundamental right, but a defeasible privilege.** It explicitly states the "right" to block development via discretionary review is *conditional* on location (far from transit) and project type (market-rate, non-subsidized). It can be revoked for policy reasons.
  *   **Principle of the Two-Track + Overlay:** The city is adopting a principle of **spatially differentiated community control based on city-wide policy goals and existing capital:**
      *   **Near Transit/With Subsidy:** The city-wide goals of **transit utilization, density efficiency, and affordable housing production** outweigh the localized privilege of veto. Control is minimized.
      *   **In Older, Central Neighborhoods (Overlay):** The **preservation of existing (historically significant or aesthetically valued) physical capital** is prioritized. The existing community's (primarily owners') ability to protect that capital through *enhanced* control (design review, stronger veto) is reinforced. This inherently favors neighborhoods with **greater resources (ability to afford lawyers, organize)** to wield this enhanced power effectively, often entrenching existing wealth and demographics.

  **In essence, the city commits to a system where the power to shape development is primarily a privilege granted to property owners, justified by protecting investment stakes and expectations formed under outdated rules, but one that is fundamentally negotiable and reallocated based on the city's assessment of broader policy priorities (transit, affordability, historic preservation) and the political power/resources of different neighborhoods.** The Public Choice view best explains the mechanics, while the Investment-Stake and Expectations views provide the prevailing, though inconsistently applied, justifications. The Membership view is largely incompatible, and the Information view is ignored in practice.
