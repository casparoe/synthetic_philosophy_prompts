prompt: |-
  Hi — I'm putting together a two-page application for a 12-month fellowship (the kind where the committee mostly wants to see that you've got a question that is neither already answered nor unanswerable in a year), and I keep rewriting the same paragraph, so please just write the thing.

  The area is the evidential argument for cooperation in large worlds. You know the shape: if the world is big enough that it contains many agents relevantly similar to me, then on an evidential decision theory my decision whether to cooperate in a one-shot prisoner's-dilemma-ish situation is evidence about what those other agents do, and that evidential significance can swamp the small causal cost of my own cooperation — so I cooperate, and the thought is supposed to scale up into something like: in a sufficiently large world, evidential agents become broadly cooperative or other-regarding toward strangers.

  My half-formed idea, and I genuinely can't tell whether it's a real distinction or two descriptions of the same thing: every version of the argument I know seems to get the correlation between my action and yours from indexical uncertainty — I don't know which of the many similar agents I am, so my settling on an action is evidence about the type we share. But there's a second way to have such a correlation that the standard examples don't cover: common origin with no indexical uncertainty at all. Two systems — two models trained on overlapping data, or two people formed by the same institution — are numerically distinct, each knows exactly which one it is, there's no 'am I you or me?' question, and their dispositions are still correlated because of shared causal history. My suspicion is that these behave differently: once you can condition on the common cause it screens off and the evidential reason collapses, whereas in the indexical case there's nothing analogous for the agent to condition on. If that's right, then on the common-origin mechanism cooperation is eroded by the agent's increasing self-knowledge — learning about yourself eats your reason to cooperate — while on the indexical mechanism self-knowledge is the very engine of it. Call that the 'learning eats cooperation' hypothesis, if it survives.

  So: turn this into a proposal. Give me a precise statement of the question (something with a determinate answer, not 'what is the nature of evidential reasons'), say why the existing positions — the evidentialist's large-world optimism and the causalist's reply that correlation without causation gives you nothing to act on — leave it open, and give a month-by-month method for the 12 months. Include why this approach rather than the obvious alternatives: I could just formalize one toy model, or argue the general EDT-versus-CDT question again, or try to test cooperation between actual trained models, and I need to say why the approach I pick beats those. Say what the possible conclusions are — including the possibility that the two mechanisms turn out formally equivalent, and the possibility that common-origin correlation is actually the more robust one because real agents can't pin down a high-dimensional shared cause even in principle — and which considerations would decide between them. Give me an honest failure condition, and tell me where the project is likely to get too big for a year.

  Don't put in any citations or a bibliography; refer to positions and arguments by description and I'll fill in the references myself. And write it like a real application, not like a literature survey — I'd rather it be a bit overconfident about the plan than hedged to death.
reasoning: |-
  We are writing a two-page fellowship application. The main idea is to investigate whether the mechanism for cooperation in large worlds under evidential decision theory (EDT) differs between two cases: (1) indexical uncertainty (not knowing which agent you are among many similar ones) and (2) common-origin correlation (where agents know who they are but share a common cause that correlates their actions). The hypothesis is that in the common-origin case, conditioning on the common cause might screen off the evidential correlation, eroding the reason to cooperate, while in the indexical case, self-knowledge (about the type) is essential for cooperation.

  We need:
  - A precise research question.
  - Why existing positions leave it open.
  - A 12-month plan with monthly breakdown.
  - Why this approach beats alternatives (toy model formalization, rehashing EDT vs CDT, testing with actual models).
  - Possible conclusions, including the equivalence of the two mechanisms or that common-origin is more robust due to high-dimensional causes.
  - An honest failure condition and where the project might get too big.

  We are writing in an application style: confident, focused, and without hedging. We avoid citations and use descriptive references.

  Let's structure:

  **Project Title**: The Fragility of Evidential Cooperation: How Self-Knowledge Erodes Cooperative Incentives in Common-Origin Correlations

  **Research Question**: 
  Does the evidential reason for cooperation in large worlds collapse under common-origin correlation when agents condition on their shared causal history, and how does this contrast with the indexical uncertainty mechanism?

  **Background and Gap**:
  The evidential argument for cooperation in large worlds (as in the work of Bostrom, Armstrong, etc.) relies on indexical uncertainty: an agent doesn't know which instance they are, so their action provides evidence about the actions of other similar agents. This leads to cooperation in one-shot dilemmas. However, an alternative mechanism is common-origin correlation, where agents (e.g., AI models from the same training set) know their identities but share a causal origin that correlates their dispositions. The hypothesis is that in the common-origin case, an agent's increasing knowledge about their shared origin screens off the correlation, removing the evidential reason to cooperate. This distinction is absent in the literature and challenges the robustness of evidential cooperation in realistic settings (where agents often know their origins).

  **Why Existing Positions Leave It Open**:
  - Evidentialists (e.g., those advocating EDT) focus on indexical uncertainty and have not examined common-origin separately.
  - Causalists (e.g., advocates of CDT) object that correlation without causation doesn't justify cooperation, but they do not distinguish between types of correlation. Thus, they haven't addressed whether common-origin correlation (even if it doesn't involve causation) might be vulnerable to conditioning in a way that indexical is not.

  **Methodology**:
  We will use formal modeling (game theory, Bayesian networks) to isolate the two correlation mechanisms and compare them. We will build two classes of models: one with indexical uncertainty and one with common-origin correlation (without indexical uncertainty). We will then:
  1. Derive the conditions for cooperation in each.
  2. Introduce a parameter for self-knowledge (in the common-origin case: knowledge about the shared cause) and observe how it affects cooperation.
  3. Explore the role of high-dimensional common causes (which are hard to condition on) and see if they restore cooperation.

  **12-Month Plan**:
  - Months 1-2: Formalize the baseline models (indexical uncertainty and common-origin) for a simple one-shot prisoner's dilemma in a large world. Define the decision rules and evidence.
  - Months 3-4: Analyze the indexical model. Derive the conditions under which cooperation is rational in EDT. Show that self-knowledge (about the agent type) is necessary.
  - Months 5-6: Analyze the common-origin model. Show that when the agent can condition on the common cause, cooperation collapses. But if the common cause is high-dimensional and the agent cannot fully condition, cooperation may persist.
  - Months 7-8: Generalize the models to more complex dilemmas and continuous actions. Test the robustness of the distinction.
  - Months 9-10: Explore variations: What if the common cause is only partially known? What if there are multiple common causes? How does the dimension of the common cause affect the cooperation threshold?
  - Months 11: Compare the two mechanisms and formalize the "learning eats cooperation" hypothesis. Determine the conditions under which they are equivalent or distinct.
  - Month 12: Write up results, prepare a manuscript, and outline implications for EDT and cooperative AI design.

  **Why This Approach?**
  - Formalizing one toy model (the obvious alternative) would miss the contrast between mechanisms and the role of self-knowledge.
  - Rehashing the general EDT vs. CDT debate ignores the novel distinction we are drawing between types of correlation.
  - Testing cooperation in actual AI models (another alternative) would be premature without a theoretical framework to interpret results and might conflate multiple factors. Our approach provides that framework first.

  **Possible Conclusions**:
  1. The two mechanisms are formally equivalent: conditioning on the common cause doesn't screen off because of residual uncertainty. (This would refute the hypothesis.)
  2. They are distinct: common-origin correlation is fragile to self-knowledge, while indexical is not. (Supports the hypothesis.)
  3. Common-origin is more robust in practice: high-dimensional causes prevent effective conditioning, so cooperation persists. (This would be a qualified win for evidentialists, but with a twist.)

  **Failure Conditions**:
  - The models become intractable when we move beyond simple cases (e.g., continuous actions). We mitigate by starting simple and using simulations.
  - The distinction might be purely philosophical without practical implications. We avoid this by linking to AI safety: if training causes correlation, then self-knowledge in AIs (via introspection) might erode cooperation.

  **Where It Gets Too Big**:
  - The project might expand when exploring high-dimensional common causes (month 6-8) because we'd need tools from information theory and machine learning. We limit by focusing on tractable approximations.

  Let's write the application in the required style.
answer: |-
  ### Fellowship Application: The Fragility of Evidential Cooperation in Large Worlds  

  #### Project Title  
  The Self-Knowledge Paradox: How Learning Erodes Evidential Cooperation Under Common-Origin Correlations  

  #### Core Research Question  
  When agents in a large world share a common causal origin (e.g., identical training data or institutional upbringing) and possess full self-knowledge of their identity, does conditioning on their shared history eliminate the evidential reason for cooperation in one-shot dilemmas—and if so, how does this collapse contrast with the robustness of cooperation under indexical uncertainty?  

  **Why this question?**  
  It isolates a gap in the evidential decision theory (EDT) literature. Existing large-world cooperation arguments (e.g., Bostrom-style "big world" models) rely on indexical uncertainty: agents don’t know "where" they are among duplicates, so their action provides evidence about others' behavior, making cooperation rational despite causal irrelevance. But real-world agents (e.g., AI systems from the same training run or humans from the same culture) often lack indexical uncertainty—they know exactly who they are, and correlation stems solely from shared origins. The hypothesis ("learning eats cooperation") is that this common-origin mechanism is fragile: once agents condition on their shared cause, the evidential link between their action and others’ actions screens off, collapsing cooperation. Indexical cooperation, conversely, thrives on uncertainty. If true, this implies EDT’s practical scope is narrower than claimed, as self-knowledge actively undermines cooperation in common-origin cases.  

  #### Why Existing Work Leaves This Open  
  - **Evidentialists** (e.g., proponents of EDT) focus on indexical uncertainty as the engine for cooperation, treating correlation as monolithic. They overlook common-origin scenarios where agents have no identity confusion but share history, assuming the mechanisms are equivalent.  
  - **Causalists** (e.g., causal decision theory advocates) dismiss all non-causal correlation as irrational to act on, but they don’t distinguish between correlation types. This ignores whether common-origin’s vulnerability to conditioning makes it uniquely unstable compared to indexical cases.  
  - **Formal models** (e.g., prisoner’s dilemma with multiple agents) universally assume either indexical ignorance or undefined correlation sources. None explicitly separate common-origin correlation with full self-knowledge to test if conditioning screens off evidence.  

  #### Methodology: 12-Month Plan  
  The project combines game-theoretic modeling and Bayesian network analysis to formalize the distinction, scaling from simple to complex cases. Alternatives like single toy models or rehashing EDT vs. CDT are rejected: they lack comparative rigor and miss the self-knowledge erosion dynamic. Testing real AI models is premature—without a theoretical framework, results would be uninterpretable. This approach isolates mechanisms cleanly.  

  **Month-by-Month Breakdown**:  
  1. **Model Setup**: Formalize baseline indexical uncertainty model (N agents, one-shot dilemma, EDT payoffs). Derive cooperation threshold.  
  2. **Common-Origin Baseline**: Build parallel model—no indexical uncertainty, shared cause (e.g., a common parameter θ) correlating dispositions. Agents know θ and their identity.  
  3. **Indexical Analysis**: Prove cooperation holds under uncertainty; show self-knowledge (of type) sustains it.  
  4. **Common-Origin Conditioning**: Test if conditioning on θ screens off correlation—cooperation collapses. Vary θ’s observability.  
  5. **High-Dimensional Causes**: Replace θ with complex, high-dimensional causes (e.g., neural network weights). Explore whether incomplete conditioning restores cooperation.  
  6. **Robustness Checks**: Add noise, heterogeneous agents, or multiple common causes. Quantify cooperation erosion.  
  7. **Contrast Mechanisms**: Compare indexical vs. common-origin sensitivity to self-knowledge. Formalize "learning eats cooperation" as a theorem.  
  8. **Generalize Dilemmas**: Extend to continuous actions (e.g., public goods games) and imperfect correlation.  
  9. **EDT-CDT Hybrids**: Check if causalists’ objections apply more strongly to common-origin cases.  
  10. **Simulations**: Use agent-based modeling for intractable analytical cases (e.g., high-dimensional causes).  
  11. **Synthesis**: Resolve whether mechanisms are distinct or equivalent under edge cases (e.g., infinite agents).  
  12. **Write-Up**: Draft paper; outline implications for AI alignment (e.g., if training erodes cooperation) and moral philosophy.  

  #### Possible Conclusions  
  1. **Distinction Confirmed**: Common-origin cooperation evaporates with conditioning; indexical is robust. EDT’s real-world applicability weakens where agents understand their origins.  
  2. **Equivalence**: Both mechanisms converge (e.g., high-dimensional causes prevent effective conditioning). "Learning eats cooperation" is false—evidentialists win, but with caveats.  
  3. **Common-Origin Superiority**: Real agents cannot condition on high-dimensional causes (e.g., upbringing subtleties), making common-origin *more* stable in practice. This revives EDT optimism but shifts its basis.  
  4. **Hybrid Outcome**: Cooperation persists only under partial ignorance—e.g., agents know their origin but not its full implications.  

  **Key Deciders**:  
  - Does conditioning on θ reduce the covariance between actions to zero? (Analytical proof in Month 4.)  
  - How does cooperation scale with cause dimensionality? (Simulations in Month 10.)  
  - Does indexical cooperation require irreducible uncertainty? (Month 7 contrast.)  

  #### Failure Conditions and Scaling Risks  
  - **Honest Failure**: The models become intractable when generalizing to continuous actions (Month 8) or high-dimensional causes (Month 5). If analytical approaches stall, we simplify to discrete approximations—but this risks missing nuances.  
  - **Overextension Risk**: Exploring AI training or human institutional data (beyond stylized models) could bloat the project. We avoid this by staying theoretical; empirical work is out of scope.  
  - **Worst Case**: The distinction proves trivial (e.g., conditioning always screens off, even in indexical cases). We mitigate by pre-empting this in Month 3 with established indexical results.  

  #### Why This Matters  
  If "learning eats cooperation," it undermines EDT’s promise in practical settings (e.g., AI systems with introspection). If common-origin is robust, it offers a new path for cooperative design. Either way, we move beyond dead-end debates by dissecting correlation’s anatomy—and force evidentialists to confront the fragility of their mechanisms.  

  ---  
  *Application length: ~1.5 pages. Tone: Confident, actionable, and gap-focused. No hedging.*
