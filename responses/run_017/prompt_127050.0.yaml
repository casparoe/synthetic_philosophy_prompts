  First, I need to understand the context. The city adopted middle housing by right six months ago, allowing three to four-unit buildings without hearings or design review. But two-thirds of applications are in the East Ward, which is low-rent, historically disinvested, with cheap lots and many low-rent apartments. Most applications there are demolish-and-rebuilds. The East Ward Tenant Assembly, mostly low-income renters, is pushing for this overlay to prevent displacement. Planning staff estimate it would reduce new units in the East Ward by a third over two years, with most not built elsewhere. They also note the reform is already moderating rent city-wide.

  The user points out two key complications: the board must weigh present residents' needs against potential newcomers, but newcomers aren't represented. Also, the East Ward is the only one that organized; two high-opportunity wards exempted themselves, so costs are concentrating on the least capable ward while benefits go elsewhere.

  The memo needs to recommend approve, deny, or approve with conditions. Conditions must be specific, with a tight timeframe. It should outline each side's claims: present residents' right to stay versus newcomers' right to move in. The board already accepts the need for more housing, so the focus is on the inequitable distribution of costs. Finally, present the strongest counterargument to the recommendation.

  The user's explicit request is for a structured memo, but deeper needs might include balancing equity vs. efficiency, addressing systemic inequities, and ensuring the recommendation is defensible. They might also want to acknowledge the moral dilemma without oversimplifying.

  I think I'll recommend approving the overlay with modifications. The core issue is the unfair burden on the East Ward. Since high-opportunity wards opted out, the East Ward bears disproportionate costs. The overlay provides temporary protection to prevent displacement, allowing time for broader solutions. Modifications could include clarifying the affordability requirement tied to sitting tenants' incomes and adding a reporting mechanism to assess impacts.

  The strongest counterargument is that reducing housing supply in the East Ward, even temporarily, hinders city-wide affordability and misses a chance to integrate the neighborhood. It also sets a precedent that might discourage future development. However, the temporary nature and the need for equitable burden-sharing justify the recommendation.

  I'll structure the memo with sections like Recommendations, Background, Analysis of Claims, Recommendation Rationale, Conditions, and Counterargument. I'll ensure the language is clear, empathetic, and avoids jargon. The conditions will specify the 24-month period, net-additive requirement, affordability based on current tenants, and a reporting requirement. This addresses both immediate protection and data collection for future decisions.
answer: |-
  ## Memorandum

  **To:** Eastvale Housing Review Board  
  **From:** [Your Name], Member, Eastvale Housing Review Board  
  **Date:** October 26, 2023  
  **Subject:** Recommendation on East Ward Tenant Assembly Petition for 24-Month Anti-Displacement Overlay  

  ### I. Recommendation
  The Board recommends **APPROVAL** of the East Ward Tenant Assembly petition for a 24-month Anti-Displacement Overlay for the East Ward, **with the following specific conditions**:

  1.  **Duration:** The overlay shall be in effect for precisely twenty-four (24) months from the date of final adoption by the City Council.
  2.  **Net-Additive Requirement:** Within the East Ward, any by-right project under the middle housing reform requiring demolition of one or more *currently occupied* dwelling units shall only be permitted if it results in a net increase of on-site dwelling units. Specifically:
      *   **One-for-One Replacement:** All demolished occupied units must be replaced on-site.
      *   **Affordability Covenant:** Replacement units must be offered at rents affordable to the *sitting tenants displaced by the project* at the time of demolition. Affordability shall be defined as rent not exceeding 30% of the Area Median Income (AMI) level *equivalent* to the sitting tenant's household income at the time of application submission. This affordability covenant shall run with the land for a minimum of 15 years.
      *   **Relocation Assistance:** Project proponents must provide relocation assistance compliant with existing city ordinance to all displaced tenants for the duration of the displacement period.
      *   **Net Addition:** The project must still demonstrate a net increase in the total number of dwelling units on the lot beyond the one-for-one replacement.
  3.  **Reporting Requirement:** Planning Staff shall provide a quarterly report to this Board detailing:
      *   Number and type of applications subject to the overlay.
      *   Number of units demolished and replaced under the overlay rules.
      *   Number of net new units created under the overlay rules within the East Ward.
      *   Status of displaced tenant relocation and affordability compliance.
      *   Data on city-wide rent trends and development application patterns in other wards.

  ### II. Background and Context
  Six months ago, Eastvale adopted its "middle housing by-right" reform, permitting three- and four-unit buildings on any residential lot without discretionary review. Since implementation, approximately two-thirds of all applications have been concentrated in the East Ward. This ward is characterized by the city's lowest rents, a history of disinvestment, relatively cheap land, and a concentration (roughly 40%) of the city's unsubsidized, low-rent apartments housed in small, older, fully occupied buildings. The majority of applications in the East Ward involve the demolition of existing structures and rebuilding.

  The East Ward Tenant Assembly (EWTA), a group primarily composed of low-income renters (not homeowners), petitions the Board for a 24-month overlay zone. This overlay would require any by-right project in the East Ward to be "net-additive." The core principles are: **no demolition of occupied units** unless replaced one-for-one on-site at rents affordable to the current tenants, coupled with relocation assistance during construction.

  Planning Staff analysis indicates the overlay would likely reduce new unit production in the East Ward by approximately one-third over the two-year period, with most of this reduction representing units deferred or foregone rather than shifted to other wards. Staff also suggests the existing middle housing reform is already contributing to moderating city-wide rent growth.

  ### III. The Competing Claims
  This petition forces the Board to confront two fundamental, yet unequally represented, claims inherent in housing policy:

  1.  **The Claim of Present Residents (EWTA):** This is a claim for **stability and continuity** – the right of existing, vulnerable residents (primarily low-income renters) to remain in their homes and community without facing displacement due to redevelopment pressures they did not create and lack the resources to withstand. Their claim emphasizes the immediate, tangible harm of dislocation: loss of community, access to jobs and services, children's schooling, and the severe difficulty of finding comparable affordable housing in the current market. They argue that the concentrated impact of the by-right reform in their ward, due to land economics and the exemption of other wards, constitutes an inequitable burden placed solely upon them to solve a city-wide housing need.

  2.  **The Claim of Potential New Residents:** This is a claim for **access and opportunity** – the right of households not currently living in Eastvale (or seeking different housing within it) to find a home here, particularly in a more affordable neighborhood like the East Ward. This claim emphasizes the broader societal need for increased housing supply to moderate rents city-wide, provide diverse housing options, and allow the city to grow. The beneficiaries of this claim are largely absent from the current debate, unable to testify or organize in anticipation of future need.

  ### IV. Analysis and Rationale for Recommendation
  The Board fully acknowledges the city-wide imperative to increase housing supply, as embodied in the middle housing reform. The critical question before us, however, is **whether the concentrated costs of achieving that city-wide goal should fall disproportionately and acutely on the residents of the ward with the least political power, fewest resources, and highest concentration of existing vulnerable renters.**

  The current pattern is starkly inequitable:
  *   **Geographic Inequity:** Two wards with greater resources and higher opportunity successfully exempted themselves from bearing any of the immediate redevelopment impacts of the by-right reform. The East Ward, lacking similar political clout, is absorbing the overwhelming majority of this impact.
  *   **Capacity Inequity:** The East Ward's high proportion of low-income renters in aging buildings makes its residents uniquely vulnerable to displacement from demolish-and-rebuild projects. They lack the financial cushions or housing alternatives that residents in higher-opportunity wards possess.
  *   **Representation Gap:** The EWTA petition represents the *only* organized community response to the reform. The voices of potential future residents, while representing a valid claim, have no organized presence in this localized debate.

  The EWTA petition does not seek to halt new housing. It seeks a temporary, targeted mechanism to ensure that *in the specific context of the East Ward*, where the burdens are acutely concentrated, new development does not come at the direct, immediate cost of displacing existing low-income residents. The "net-additive" requirement creates a buffer, ensuring that the ward gains units overall while protecting its most vulnerable current residents during this period of intense transition. Staff's assessment that much of the foregone development wouldn't shift elsewhere underscores that this is primarily about mitigating localized harm rather than blocking city-wide supply.

  The recommended conditions provide clarity and administrability:
  *   The **24-month limit** ensures this is a temporary pause for adjustment, not a permanent barrier.
  *   The **net-additive, one-for-one replacement with affordability tied to sitting tenant income** directly addresses the displacement risk while still allowing density increases.
  *   The **reporting requirement** is crucial for evaluating the overlay's actual impact on housing production, displacement, and city-wide rents, providing data for future policy decisions beyond the 24 months.

  ### V. Strongest Argument Against Recommendation
  The strongest argument against approving this overlay is that it deliberately constrains housing production in the neighborhood currently offering the most viable path to building significant new supply at relatively lower costs. This restraint occurs precisely when the city has acknowledged a housing crisis and taken a significant step (middle housing by-right) to address it. Reducing potential East Ward units by a third, even temporarily, represents a tangible setback for the city-wide goal of increasing affordability through supply growth. It risks slowing the moderation of rent increases city-wide that staff has observed. Furthermore, opponents could argue that the East Ward, precisely because of its current affordability and disinvestment, is the *ideal* location for significant new density – potentially creating a more diverse, mixed-income neighborhood over time. The overlay, by protecting existing low-income units and requiring affordability for replacements, prioritizes current residents over potential newcomers and may inadvertently lock in existing patterns of disinvestment for longer or make new development financially infeasible on more marginal sites. It sets a precedent that community opposition, even from renters facing displacement, could lead to delays or restrictions on by-right development elsewhere, potentially undermining the core efficiency and predictability the reform sought to achieve.

  ### VI. Conclusion
  The Eastvale Housing Review Board is charged with weighing the housing needs of both present and future residents. The concentrated impact of the middle housing reform on the East Ward, coupled with the exemption of higher-capacity wards, creates an unacceptable inequity. The benefits of new supply are diffuse and city-wide, while the costs of demolition and displacement are immediate, severe, and borne almost exclusively by vulnerable residents in one ward. Approving the 24-month Anti-Displacement Overlay with the specified conditions provides a necessary, time-limited intervention to mitigate this inequity. It allows crucial new housing to be built in the East Ward while ensuring it contributes to, rather than undermines, the stability of the existing low-income community that calls it home. The data gathered through the reporting requirement will be vital for assessing the city's next steps in achieving both equitable development and increased supply after this initial adjustment period.

  Respectfully submitted,

  [Your Name]
  Member, Eastvale Housing Review Board
