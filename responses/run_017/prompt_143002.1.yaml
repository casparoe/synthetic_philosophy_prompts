prompt: |-
  You are a professional philosopher who specialises in early modern moral philosophy — Montaigne's *Essais* in particular — and who has spent several years advising humanitarian and development NGOs on cross-cultural ethics. Think carefully and do not rush: before you draft anything, do a private brainstorming pass in which you work out which of Montaigne's moves in his essay on the Tupinambá of coastal Brazil, known in English as *Of the Cannibals* (from the first book of the *Essais*, first published in 1580), can carry procedural weight and which cannot. Then write the answer for a colleague who is intelligent and experienced but has never read the *Essais*: no jargon, no citations, no quotations from primary texts, and nothing I would have to look up. I need the reasoning, not the scholarship.

  Here is my situation. I chair the Practice Review Panel of a mid-sized international NGO that runs maternal-health and education programmes in about a dozen countries. When our field staff encounter a local practice that troubles them, the panel writes an advisory opinion placing it in one of five buckets: accommodate with no action; accommodate with mitigation; oppose privately through our partner organisations; oppose publicly; or make the practice a condition of continued funding. We handle fifteen to twenty cases a year. I have three people – me, a regional programme officer, and an anthropologist on retainer – about six weeks per case, and no legal training. Every opinion is shown to our local partner staff, and some are quoted in donor reports, so a badly worded verdict can cost us money, staff safety, or a decade-long relationship. The executive director signs off on anything above the second bucket.

  I want a decision procedure my panel can actually run, and I want it grounded in Montaigne's argument rather than in the generic cultural-relativism slogans that people reach for in these meetings. Concretely, I expect your procedure to preserve the distinctions that do the real work in that essay: the anti-projection move, that we are apt to call barbarous whatever departs from our own customs and to judge distant peoples by our own example rather than by universal reason; the distinction between the merely unimproved or wild and the genuinely depraved, which lets Montaigne admire a people whose customs he has no intention of adopting; his substantive and non-relativistic criterion, that cruelty and treachery are vices everywhere while difference of custom is not; the comparative test, in which he insists that certain European practices look worse than the ones we find shocking when redescribed without their flattering framing; and his epistemic modesty about secondhand reports of what the practice actually is, given how thin his own sources were. Where a move in the essay is unusable as procedure – his appeal to a state of nature as a normative baseline, his confidence in a single eyewitness, his literary and ironic framing – say so explicitly and say what you would put in its place.

  The procedure must be ordered questions, each naming who answers it, what counts as a sufficient answer, and what to do when we cannot get an answer within our six weeks. It must have explicit stop rules that end in "accommodate, no action", escalation rules, and marked handoffs to a named human being where the remaining question is one of values and not of fact. It has to survive the hard cases, so please build in steps for at least these: the risk that the *description* of the practice is the outsider's frame rather than the thing itself, which I want handled by a substitution test – redescribe the practice in terms we would apply to an equivalent practice in our own society, feeding relatives to mourners versus desecrating a corpse, confinement of a disturbed person versus involuntary psychiatric commitment, marriage at sixteen versus our own emancipation law – and send the case back for reframing if the redescription changes the verdict; cases where the practice is contested inside the community, so that deference cannot simply go to whoever currently holds authority; cases where all our testimony, including our own field reports, is gathered under a funding relationship and therefore has a built-in interest structure; cases where public condemnation is itself likely to turn a fading practice into a badge of identity under external attack; cases where the horror lies in the rate or severity of individual instances rather than in the practice as a type, so that condemning the type and mitigating the tokens come apart; cases where the practice is unlawful in the jurisdiction, where I need to be told exactly what work the legal answer does and prevented from letting it stand in for the moral one; and cases where the practice looks ancient but is forty years old, or has recently become a cash strategy or a form of resistance, and where we will usually never get the history right.

  Then apply the finished procedure to three cases: a partner-run boarding school whose girls are married at sixteen with their families' consent and where withdrawal would mean the girls leave school altogether; a healing practice involving the confinement and beating of a person believed to be possessed, performed by a practitioner our own local staff respect, after which the person usually recovers and is reintegrated; and a mortuary rite in which relatives consume a small portion of a revered elder's remains as part of mourning, which a field officer reported to headquarters as cannibalism and which a major donor has now heard about. At least one of these must come out as a verdict my panel will not like, because it costs us money or tells our own staff that their framing was the problem.

  Finally, be honest about the limits. Mark the steps where judgement cannot be eliminated and no checklist will help me. Tell me what this procedure cannot do: whether it can settle the metaphysical question of whether our judgements about distant practices can be objectively correct, whether it can fix who counts as a member of the community for the purposes of deference, whether it can aggregate when a practice protects some members and harms others, and whether it can answer the political question of whether we should be in these relationships at all. And if you think the Montaignean frame is the wrong one for some step, say where and what you would use instead. Keep the procedure itself to something that fits on two pages and can be run in an afternoon; take as long as you need on the worked cases.
reasoning: |-
  Hmm, this is an intricate request that requires careful unpacking. The user chairs an NGO ethics panel and wants a practical decision procedure rooted in Montaigne's "Of Cannibals" while avoiding academic jargon. They've outlined very specific requirements: a step-by-step process addressing real-world constraints (6-week timeline, 3-person team), incorporating Montaigne's key insights while discarding his unusable elements, and handling eight complex edge cases. Plus, they want it applied to three concrete scenarios with one "unpopular" outcome.

  First, I need to mentally map Montaigne's essay to their operational needs. His anti-projection move is crucial—reminding us we judge others by our own customs. The wild vs. depraved distinction allows rejecting practices without dismissing entire cultures. The universal vice criterion (cruelty/treachery) provides non-relativistic footing. The comparative test—redescribing European equivalents—is genius for exposing hypocrisy. And epistemic modesty about secondhand reports is vital given their thin field data.

  But I must flag where Montaigne won't work procedurally: His "state of nature" baseline is too vague for policy; we'll replace it with cross-cultural harm standards. His reliance on a single eyewitness is reckless—we need triangulated sources. His irony is literarily brilliant but operationally dangerous for clear guidelines.

  The user's substitution test request is spot-on. Redescribing "cannibalism" as "communion with ancestors" or "involuntary commitment" as "protective confinement" forces reframing. This tackles the core problem: outsider descriptions often misrepresent practices.

  For contested practices, we can't default to authorities—must sample dissent. For biased testimony (especially under funding pressure), we'll require counter-interviewing. The identity-politics risk (condemnation hardening practices) means sometimes opposing privately avoids backlash. Rate-vs-type dilemmas need separate mitigation plans. Legal status can't dictate morality but may trigger mandatory reporting—we'll isolate that step. And since historical claims are often shaky, we'll focus on current function.

  Now structuring the procedure: Five ordered questions with clear owners (panel/anthropologist/staff), sufficiency standards, and timeouts. Must include stop rules (default to accommodation), escalation triggers, and handoffs for value judgments. The whole thing needs to fit two pages but handle their eight hard cases.

  For the test cases: The 16-year marriages—redescribed as emancipation with parental consent—might require mitigation (ensuring consent isn't coerced) but not withdrawal, risking girls' education. The possession healing—after substituting "crisis intervention"—passes if recovery/reintegration occurs, but beating demands mitigation (non-harmful alternatives). The mortuary rite—framed as "ancestral communion"—should be accommodated, but the "cannibalism" misreporting requires donor education, costing goodwill.

  Limits are critical: This won't solve metaphysical objectivity questions—it assumes basic harms exist. Defining "community" remains subjective. Harm/benefit trade-offs require contextual balancing. And it can't answer whether NGOs should intervene at all—that's a separate political decision. At certain points (weighing universal vice, judging harm severity), no checklist replaces human judgment.

  The unpopular verdict will be the mortuary rite case—accommodating what donors see as "cannibalism," forcing uncomfortable donor conversations. That's where Montaigne's comparative test shines: If we accept organ donation (physical incorporation of others), why reject this?
answer: |-
  Here is a Montaigne-inspired decision procedure for your Practice Review Panel, designed to be practical, avoid relativism, and handle your specified hard cases. It prioritizes clear steps, defined roles, and fallback positions.

  **Montaignean Practice Review Procedure (MPRP)**

  **Roles:**
  - **PRP (Panel):** You + Regional Officer. Responsible for overall judgment, applying steps, managing process.
  - **Anthropologist (Anth):** Provides cultural context, verifies descriptions, identifies internal contestation.
  - **Field Staff (FS):** Provide initial reports, local perspectives (via Anth/Regional Officer). *Not directly questioned by PRP to avoid pressure.*

  **Step 0: Intake & Preliminary Freeze (PRP, Day 1)**
      *   **Action:** Upon receiving a concern, immediately suspend *any* external communication about the practice (including internal speculation). Acknowledge receipt to reporter only. Freeze prevents premature framing damage.
      *   **Sufficiency:** Formal case opened. Initial report filed.
      *   **Timeout (1 day):** Proceed regardless.

  **Step 1: Practice Description & Substitution Test (Anth led, PRP supports, Weeks 1-2)**
      *   **Question:** "What is the *specific* practice being described, *in terms used by its practitioners or those directly subject to it?* How would we describe an *equivalent function or impact* within a familiar cultural context of ours?"
      *   **Action:** Anth gathers FS reports, local terms, practitioner intent, typical participants/subjects. PRP & Anth jointly perform Substitution Test: Redescribe the practice’s core action/purpose using neutral terms applicable to an analogous practice *in the NGO’s home culture(s)* (e.g., "feeding relatives a revered elder’s remains" becomes "ritual incorporation of deceased loved one"; "confinement/beating for possession" becomes "involuntary seclusion and physical stimulus for acute mental distress"). *Ignore legal status here.*
      *   **Sufficiency:** A description avoiding obviously loaded terms (e.g., "cannibalism," "torture") *and* a plausible substitution.
      *   **Escalation:** If substitution radically shifts moral intuition (e.g., from "desecration" to "communion"), **STOP. Accommodate (No Action)**. Send case back only if description is impossibly vague/contradictory *after* Anth effort. If substitution doesn’t shift intuition, proceed.
      *   **Timeout (2 weeks):** If no clear description/substitution, **STOP. Accommodate (No Action).** Epistemic modesty demands deference when understanding fails.

  **Step 2: Internal Contestation & Power Check (Anth, Weeks 2-3)**
      *   **Question:** "Is this practice uncontested within the community? Who benefits, who is subject to it, and who opposes it (covertly or overtly)?"
      *   **Action:** Anth probes FS, discreet local contacts (if safe), literature for dissent, power imbalances, gender/age dynamics. Focus on *voices of those subject to or disadvantaged by the practice*.
      *   **Sufficiency:** Evidence of consensus *or* clear identification of contesting groups/individuals and their stakes.
      *   **Handoff:** If significant contestation exists *and* dissenters are marginalized, **PRP Judgment Call:** Does deferring to current authority likely perpetuate injustice? (Marked Value Judgment). If yes, move to Step 3. If no consensus but no clear injustice in authority, **Accommodate (Mitigation - see Step 4)**.
      *   **Timeout (1 week):** If contestation unclear despite effort, default to **Accommodate (Mitigation)**. Err on side of non-intervention in opaque disputes.

  **Step 3: Universal Vice & Comparative Test (PRP, Week 4)**
      *   **Question (Part A - Universal Vice):** "Does the practice, *as redescribed*, inherently involve *cruelty* (intentional infliction of severe suffering) or *treachery* (systematic betrayal of fundamental trust like kinship)?"
      *   **Action:** PRP applies criterion strictly. Focus on inherent structure, not frequency/severity (handled in Step 4).
      *   **Sufficiency:** Clear yes/no based on inherent characteristics.
      *   **Result A:** If **NO** (no inherent cruelty/treachery), **STOP. Accommodate (No Action)**. Difference isn’t vice.
      *   **Result B:** If **YES**, proceed to **Question (Part B - Comparative Test):** "Can we identify a *common practice within our own donor/headquarters culture(s)* that serves a similar function but involves comparable or greater levels of cruelty or treachery, once stripped of its familiar justifications?"
      *   **Action:** PRP brainstorms equivalents (e.g., solitary confinement in prisons vs. confinement for possession; factory farming vs. mortuary rite; coercive debt practices vs. certain marriage dynamics; neglect of elderly vs. certain "traditional" practices).
      *   **Sufficiency:** Identification of at least one plausible comparator.
      *   **Result B1:** If **YES** (comparator exists), **STOP. Accommodate (No Action or Mitigation - See Step 4)**. Hypocrisy check forces deference. *Mitigation only if tokens are severe.*
      *   **Result B2:** If **NO** (no comparable vice in common HQ/donor practices), proceed to Step 4. Practice potentially depraved.

  **Step 4: Harm Severity, Mitigation & Externalities (PRP + Anth, Weeks 5-6)**
      *   **Question:** "What is the *actual, typical* severity and frequency of harm? What mitigation exists locally? What are the risks/costs of *our* intervention (backlash, identity hardening, loss of vital services)? What is the legal status?"
      *   **Action:** Anth provides data on harm rates, local safeguards, consequences of past external interventions. PRP assesses legal status: *Only relevant for staff safety/legal liability, NOT morality.* Does law create NGO liability or severe risk for local partners/staff?
      *   **Sufficiency:** Best available assessment of real-world impact and intervention risks.
      *   **Judgment:**
          *   **Low/Manageable Harm + Effective Local Mitigation:** **Accommodate (No Action)**.
          *   **Significant Harm BUT High Intervention Risk** (e.g., backlash hardening practice): **Accommodate (Mitigation)** - Focus on *reducing harm tokens* (e.g., supporting dissenters, alternatives *if requested*, monitoring) *without condemning practice type*. Do NOT oppose publicly.
          *   **Severe/Very Frequent Harm + Lower Intervention Risk:** **Oppose Privately** via partners. *Only if partners have leverage and request support.*
          *   **Severe Harm + Low Intervention Risk + Legal Prohibition creating NGO/Staff Risk:** **Oppose Publicly** *only as last resort for liability reasons*. Rare. Anth must confirm public opposition *won't* backfire catastrophically.
          *   **Make Condition of Funding:** **Rarely Justified.** Only if practice *directly contradicts core, universally applicable NGO mission* (e.g., health staff deliberately infecting people) *AND* local partners have clear, feasible alternative *AND* withdrawal impact on beneficiaries is carefully weighed and deemed less harmful than continuation. **Requires Executive Director Sign-off.**
      *   **Mitigation Definition:** Actions aimed at *reducing harm in specific instances* for willing participants (e.g., ensuring genuine consent in marriages, offering medical support during confinement, providing safe alternatives for dissenters) *without* attacking the practice's legitimacy.
      *   **Timeout (2 weeks):** If harm/risk assessment remains too uncertain, default to **Accommodate (Mitigation)**.

  **Escalation Rules:**
  *   Any step suggesting **Oppose Publicly** or **Condition Funding** requires **Executive Director Sign-off** before finalization.
  *   **PRP Judgment Call** points (Step 2 Handoff, Step 4 Harm/Risk Weighing) cannot be checklist-ed. Consensus of PRP members required.

  **Hard Case Handling Built-In:**
  *   **Outsider Framing:** Handled by **Step 1 (Substitution Test)**.
  *   **Internal Contestation:** Handled by **Step 2 (Power Check)**.
  *   **Biased Testimony:** Addressed by **Step 2 (probing dissent)**, **Step 4 (assessing harm frequency/severity empirically)**, and defaulting to deference when uncertainty persists.
  *   **Backfire/Identity Hardening:** Explicitly considered in **Step 4 (Intervention Risk)**.
  *   **Rate/Severity vs. Type:** Separated in **Step 3 (Type)** vs. **Step 4 (Tokens/Mitigation)**.
  *   **Legal Status:** Confined to **Step 4** for **risk/liability only**, decoupled from moral judgment (done in Step 3).
  *   **Unclear History/Recent Change:** **Step 4** focuses on *current* function, harm, and context. History is informative but not decisive.

  ---

  **Application to Cases:**

  1.  **Boarding School Marriages at 16:**
      *   **Step 1:** *Redescription:* "Facilitating marriage at legal majority age (16 in jurisdiction) with parental consent." *Substitution:* Similar to emancipation/independent living at 16-18 in many Western contexts with parental approval. *Verdict:* Shifts intuition (not inherently barbarous). **Accommodate (No Action)**. *Stop.* (Montaigne: Anti-projection, difference not vice). *Unpopular Aspect:* Withdrawal would harm girls; panel might want to "oppose" based on HQ norms but procedure stops it. *Cost:* Potential donor discomfort if they learn.

  2.  **Confinement/Beating for "Possession":**
      *   **Step 1:** *Redescription:* "Involuntary seclusion and application of intense physical stimuli during acute psychological or neurological crisis episodes by a respected traditional healer." *Substitution:* Involuntary psychiatric hold with physical restraint or aversion therapy (historically common, still exists in extreme cases). *Verdict:* Shifts intuition somewhat (not *inherently* worse than bad psychiatric history).
      *   **Step 2:** *Contestation:* Anth finds practice accepted by most, but some families fear harm; subjects often vulnerable (poor, marginalized). *Verdict:* Marginalized subjects, but no organized dissent. **Accommodate (Mitigation)** path likely.
      *   **Step 3:** *Universal Vice:* Does it involve **cruelty**? Yes, beating inflicts suffering. *Comparative Test:* Solitary confinement, prolonged mechanical restraint, historical abuse in institutional psychiatry. *Verdict:* Plausible comparators exist. **Accommodate (Mitigation)**. *Stop.*
      *   **Step 4 Mitigation:** Work *with* healer and local partners to explore/reduce beating intensity/duration, ensure monitoring for injury, offer concurrent medical/psychological support if acceptable, support families seeking alternatives. *Do not* denounce the practice. *Staff Framing:* The initial report ("beating") was accurate but lacked the context of recovery/reintegration and local respect (Step 1 reframe essential).

  3.  **Mortuary Rite (Consuming Remains):**
      *   **Step 1:** *Redescription:* "Ritual incorporation of a minuscule portion of a revered elder's physical remains by close kin as an act of communion and mourning within a sacred context." *Substitution:* Veneration of relics, organ donation receiving part of a loved one, symbolic communion (Eucharist). *Verdict:* Dramatically shifts intuition (from "cannibalism" to "communion"). **Accommodate (No Action)**. *Stop.* (Montaigne: Anti-projection, comparative test shows European equivalents). *Unpopular Aspect:* **Panel won't like this.** Field Officer's framing ("cannibalism") caused donor alarm. Verdict means defending the practice to a major donor, likely causing friction or funding loss. Requires explaining Montaigne's core move: our projection blinded us. *Cost:* Real risk of lost funding. Staff Framing was the core problem (Step 1 substitution test vital).

  ---

  **Honest Limits:**

  1.  **Judgment Cannot Be Eliminated:** Crucial steps rely on PRP judgment:
      *   Step 2: Assessing if contestation signifies injustice warranting deeper scrutiny.
      *   Step 3: Applying "cruelty/treachery" (though defined, application has edges).
      *   Step 3: Judging plausibility of *comparators*.
      *   Step 4: Weighing severity of harm vs. risks/costs of intervention. *No checklist solves these.*
  2.  **Cannot Settle Metaphysics:** This procedure *assumes* Montaigne's core insight (universal vices exist, projection distorts) is workable. It doesn't *prove* objective morality, it provides a rigorous, anti-hypocritical process to apply it practically.
  3.  **Cannot Define "Community":** Who counts? Step 2 helps surface dissent but drawing boundaries (e.g., recent migrants, outcasts) remains contextual and political. Anth advises, PRP judges.
  4.  **Cannot Perfectly Aggregate Harms/Benefits:** When a practice protects some (e.g., lineage stability) and harms others (e.g., young brides), Step 2 flags contestation. Step 3 checks for universal vice *inherent* to the practice. Step 4 assesses net harm/risk. Judgment call on where the balance lies and who shoulders the cost.
  5.  **Cannot Answer the Political Question:** This procedure guides *how* to judge a practice *within* an existing partnership. It does *not* answer whether the NGO *should* operate in contexts where such practices exist or partnerships where power imbalances persist. That's a separate strategic/ethical decision.
  6.  **Where Montaigne Fails / Substitution:**
      *   **State of Nature:** Useless as baseline. *Replaced* by the **Comparative Test (Step 3B)** and focus on **Universal Vice (Step 3A)**.
      *   **Single Eyewitness:** Dangerous. *Replaced* by **Anth triangulation (Steps 1 & 2)**, **epistemic modesty (Step 1 Timeout)**, and **focus on harms (Step 4)**.
      *   **Irony/Literary Framing:** Unworkable procedurally. *Replaced* by **explicit Substitution Test (Step 1)** and **clear escalation/stop rules**.
      *   **"Wild" vs. "Depraved":** Montaigne's admiration for the "wild" isn't a procedure. *Replaced* by the **Step 3 Universal Vice/Comparative Test** to identify the genuinely depraved.

  This procedure forces disciplined reframing, exposes hypocrisy, targets only core vices, respects epistemic limits, and minimizes reckless intervention. It makes the cost of overreach explicit.
