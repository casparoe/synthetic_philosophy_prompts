     - Response: "In practice, we have limited resources. This exercise is a model to force choices. We can discuss the limits of the model in the debrief."

  2. Student wants to argue about neuron counts: 
     - During the activity, encourage them to use the cliff license to mark a boundary based on neuron count, but then challenge with systems that have similar counts but different behaviors? Or note that neuron count might not be the right property.

  3. Table copies neighbors: 
     - Encourage them to think independently. The activity is about their own reasoning.

  4. Student finds the exercise flippant because they have a real case (e.g., a disabled person): 
     - Be sensitive: "This exercise is about systems in general. We are not making claims about actual humans. The adult human at the top is a placeholder for a system we all agree has full concern. If you are concerned about a particular case, we can discuss it in the debrief."

  What the activity cannot reproduce:
  - It cannot capture the difference between no fact of the matter and unknowability. The activity assumes there is a fact (the ladder order) but in reality, there might be no fact or we might not know.
  - It cannot show a non-scalar account. The activity is set up to push towards scalar. But we can note in the debrief that some theories are non-scalar (e.g., all or nothing at a threshold). The activity shows the difficulty of that.

  What only the facilitator can supply: the philosophical context and the connection to the readings. The activity is a tool to make the concepts tangible.

  Real stakes: is it a trap? It might be if students feel pressured or if the allocation leads to a trivial donation. We can do it if the class agrees. If someone objects, we can skip the donation and use the activity for discussion. But the $20 is small. We can say: "This is a class fund we set aside for this purpose. If you object, we can discuss and decide not to donate, but then we lose the opportunity to make a difference." Or we can donate regardless. We'll proceed.

  Final timeline:

  0-5: Introduction and instructions.
  5-25: Building the ladder (10 systems) and allocating chips.
  25-30: Inserting the two planted systems and adjusting.
  30-35: Posting ladders.
  35-40: Choosing a non-cliff adjacent pair to defend (by rolling).
  40-50: Pair defense and challenge (tables A and B, then C and D, 5 min each pair).
  50-55: Computing the donation (facilitator does this quickly) and announcing.
  55-75: Debrief.
  75-80: Wrap-up.

  Rules for students (handout or verbal):

  "Rules for the activity:
  1. In your group, create a ladder of 12 systems. Start with 10 systems: choose systems that range from one you are confident has nothing going on inside to an adult human at the top. Order them on index cards.
  2. You have 240 poker chips to allocate to the 12 systems. Every chip must be placed. The difference in chips between any two adjacent systems in your ladder cannot be more than 3, unless you use a cliff license.
  3. You have two cliff licenses. To use one, place it between two adjacent systems and write on it, in one sentence, the property that appears at that boundary and is absent below.
  4. After you have built your ladder and allocated the chips, you will receive two additional systems to insert. Adjust your ladder and allocation as needed, following the same rules.
  5. Post your ladder on the wall.
  6. Choose one adjacent pair that does not have a cliff license (if you have one). Roll a die to choose if there are multiple.
  7. Pair with another group: defend the difference for your chosen pair to them. They may then challenge one of your cliff licenses by pointing to another adjacent pair in your ladder where the stated property appears or fails. If the challenge is successful (i.e., the property is not unique to that boundary), you lose that cliff license and must acknowledge the challenge.
  8. Then, the other group defends and you challenge.
  9. We will then compute the class aggregate allocation to the adult human rung and donate the class fund of $20 to two charities in proportion."

  Now, we write the minute-by-minute timeline for the facilitator.

  Minute-by-minute:

  0:00 - 0:05: 
  - Facilitator: "Welcome. Today we are doing a group activity. Please stay in your tables of four. Each table will create a ladder of 12 systems, from one you are sure has nothing going on inside to an adult human at the top. You will allocate 240 poker chips to these systems, representing your total concern. Every chip must be placed. The rule: the difference between two adjacent rungs cannot exceed 3 chips, unless you use one of your two cliff licenses. If you use a cliff license, you must write on it the property that appears at that boundary and is absent below. You will get two more systems to add later. Here are materials: index cards, poker chips, two cliff license cards (blank index cards), pens, masking tape. You have 20 minutes to build your ladder with 10 systems and allocate the chips. Start now."

  0:05 - 0:25: 
  - Facilitator circulates, answers questions, ensures groups are on task.

  0:25 - 0:30: 
  - Facilitator: "Now, each table gets two more systems to add." Distributes the two index cards with the descriptions. "Insert these into your ladder wherever you think they fit, and adjust your allocation if needed. You can use a cliff license if you haven't used both and if needed. You have 5 minutes."

  0:30 - 0:35: 
  - Facilitator: "Please tape your ladder to the wall with masking tape, with the systems and allocations visible."

  0:35 - 0:40: 
  - Facilitator: "Now, choose one adjacent pair in your ladder that does not have a cliff license. If you have multiple, roll a die to choose one. Note which pair it is."

  0:40 - 0:50: 
  - Facilitator: "Pair up with another table: Table 1 with Table 2, Table 3 with Table 4. Within your pair, each table will take 2-3 minutes to defend the difference for their chosen adjacent pair to the other table. Then, the other table may challenge one of the cliff licenses in your ladder by pointing to another adjacent pair where the stated property appears or fails. If the challenge shows the property is not unique, the license is revoked. Then switch roles. You have 10 minutes total."

  0:50 - 0:55: 
  - Facilitator: "Now, I will collect the allocations for the adult human rung from each table and compute the total. We have a class fund of $20. We will donate a portion to a charity for humans and the rest to a charity for animals. The portion for humans is the total chips on adult human rungs divided by the total chips (960). Let me calculate: ... [calculate] ... So we will donate $X to [Charity A] and $Y to [Charity B]."

  0:55 - 1:15: 
  - Facilitator: "Let's debrief. First, what happened when you allocated chips? Did any group put zero at the bottom? Could you allocate all 240 chips without changing that? What did you have to do? [Discuss] This shows that without a sharp boundary, concern must extend downward in small increments. Second, when you defended a small difference between two adjacent systems, was it hard to justify? This shows the small gradations. Third, when a cliff license was challenged, what happened? This shows that properties don't mark a sharp boundary. Fourth, the two added systems: where did you place them? Did you change your mind? This shows we use multiple criteria that can conflict. Finally, the fixed budget: in reality, concern might not be finite, but our resources are. The takeaways: gradations are real and small, properties don't cooperate for a threshold, and concern decomposes into factors that can come apart."

  1:15 - 1:20: 
  - Wrap-up: "Next time we will discuss where moral status begins. Keep in mind the challenges we saw today. Thank you for your work."
