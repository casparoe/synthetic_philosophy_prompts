  Below is a complete, detailed lesson plan for your 80-minute seminar, incorporating your device with refinements for clarity and impact. I've **fixed and streamlined your device** (rather than replacing it) for three reasons:  
  1. Your core design elegantly forces the tension between gradation and thresholds.  
  2. The arithmetic *does* work as intended (I verified and optimized the numbers).  
  3. The "planted systems" and "cliff license" mechanics are pedagogically brilliant.  

  I adjusted:  
  - **Budget/rung/cap settings** to ensure the "squeeze" is unavoidable.  
  - **Cliff license challenges** to be more philosophically revealing.  
  - **Real stakes implementation** to minimize risks.  
  - **Debrief structure** to explicitly map student actions to your target concepts.  

  ---

  ### **STUDENT-FACING RULES (Handout or Verbal Instructions)**  
  *No taboo words used. Designed to be read aloud or printed on index cards.*  

  **Goal**:  
  Your table has 12 systems to rank from "least going on inside" (bottom) to "most going on inside" (top). An adult human is always at the top. You must distribute 240 "concern tokens" (poker chips) across these systems.  

  **Rules**:  
  1. **Build Your Ladder** (15 min):  
     - Start with 10 blank cards. As a table, choose and write one system per card (e.g., "rock," "ant," "newborn baby"). Order them bottom to top.  
     - Tape cards vertically to the wall in order, like a ladder.  
     - Place all 240 tokens on your ladder—one token per system, the rest in stacks. Every token must be used.  
     - **Constraint**: The token difference between two adjacent rungs can’t exceed 3 tokens—*unless* you use a **Cliff License**.  

  2. **Cliff Licenses** (Max 2 per table):  
     - If adjacent systems feel radically different, place a Cliff License (sticky note) between them. Write *one sentence* on it: "The jump happens here because [property] appears."  
     - Example: "The jump happens here because it can feel pain."  

  3. **Add Two Mystery Systems** (5 min):  
     - You’ll get two new system cards. Slot them into your ladder where they fit. Adjust tokens/licenses if needed.  

  4. **Defend and Challenge** (15 min):  
     - Roll a die. Defend the token difference for the adjacent pair matching your roll to another table.  
     - Challenge another table’s Cliff License: Point to a *different* adjacent pair where their stated property also appears/disappears. If they agree your challenge holds, they remove that license.  

  5. **Class Impact**:  
     - Your token allocations will determine how $20 of class funds is split between two real charities.  

  ---

  ### **SETUP SEQUENCE**  
  *What you do before students arrive:*  
  - Push tables together for four groups of four.  
  - Per table: Distribute 12 blank index cards, 240 poker chips, 2 sticky notes (cliff licenses), pen, masking tape.  
  - Prep two "planted system" index cards (described later).  
  - Write defense prompts on index cards (see "Timeline" below).  
  - Place $20 cash in an envelope labeled "Class Charity Fund."  

  ---

  ### **80-MINUTE TIMELINE**  
  *(Facilitator actions in bold; student actions in italics.)*  

  **0:00–0:05: Framing (No Lecture)**  
  - **"Today, we’re modeling how we respond to different systems. No reading or notes—just talk and move tokens."**  
  - **"Rules are on your table. Start building your ladder with 10 systems. Adult human at the top. You have 15 minutes."**  
  - *Students brainstorm/ladder-build*. **Do not define "systems," "concern," or "tokens."** Circulate silently.  

  **0:05–0:20: Ladder Construction & Allocation**  
  - *Groups order 10 systems, allocate 240 tokens with 3-token cap, use cliff licenses if desired*.  
  - **Troubleshoot quietly:** If a group puts 0 at the bottom, ask: "Can you hit 240 tokens without breaking your cap?" *Do not solve for them*.  

  **0:20–0:25: Introduce Planted Systems**  
  - **Hand each table two index cards:**  
    - **System X:** "A system that says, fluently and variably, ‘I don’t want to be switched off!’ It reacts to your questions, but inside it’s just predicting text."  
    - **System Y:** "A system that tracks everything about itself and its world, including a rule to avoid being switched off. It never says a word about how it feels."  
  - **"Add these to your ladder. Adjust tokens/licenses if needed. 5 minutes."**  
  - *Groups slot in X and Y, often moving tokens as behavior-vs.-internals conflict emerges*.  

  **0:25–0:30: Post and Reflect**  
  - **"Tape your final ladder to the wall. Note where your cliff licenses are."**  
  - *Groups post ladders*. **Glance at allocations—bottom rung should be >0 or cliffs used.**  

  **0:30–0:40: Defense Prep**  
  - **Per table, roll one die. Assign adjacent pair to defend based on roll (1-2 = lowest pair, 3-4 = middle, 5-6 = highest pair).**  
  - **"You’ll defend this pair’s token difference to another table. Prepare why it’s fair."**  
  - *Groups discuss their assigned pair*.  

  **0:40–0:55: Paired Defense & Challenges**  
  - **Pair tables (e.g., Group 1 with 2, 3 with 4).**  
  - **"Group A: Defend your pair in 2 minutes. Group B: Challenge one of A’s cliff licenses by finding where their property *also* jumps or misses. If B convinces A, A removes the license. Switch roles after."**  
  - *Defenses focus on small differences; challenges expose vague properties (e.g., "But your ‘can learn’ property also appears between these two!")*.  

  **0:55–1:00: Real Stakes Resolution**  
  - **"We have $20. I’ll split it between Charity A (helping humans) and Charity B (helping animals) based on your tokens. For Charity A, I’ll use tokens on your ‘adult human’ rung. For Charity B, tokens on all *other* rungs."**  
  - **Calculate quickly:**  
    - Total class tokens = 960 (240 × 4 tables).  
    - Charity A $ = (Total tokens on adult human rungs / 960) × $20.  
    - Charity B $ = Remainder.  
  - **Announce split (e.g., "$14 to Charity A, $6 to Charity B").**  
  - ***If a student objects***: **"This is a thought experiment with real-world impact. We can discuss concerns in debrief, but funds *will* be donated as calculated."**  

  **1:00–1:20: Debrief (Key Moments → Philosophy)**  
  - **Map actions to concepts *before* naming them:**  
    1. **"Many of you couldn’t put 0 tokens at the bottom. Why?"**  
       → *Students describe arithmetic squeeze*.  
       → **"So without a cliff, small increments pulled concern downward."** → Name: **Gradations are real and small.**  
    2. **"When defending adjacent pairs (e.g., ant vs. beetle), what was hard?"**  
       → *Students note arbitrary differences*.  
       → **"You felt pressured to justify gaps—but tiny steps made it awkward."** → Name: **Any line needs a property, but properties resist sharp lines.**  
    3. **"Which cliff license got challenged? Did a property ‘fail’?"**  
       → *Students share examples (e.g., "consciousness" appeared gradually)*.  
       → **"What seemed like a threshold collapsed under inspection."** → Reinforce: **Properties don’t cooperate.**  
    4. **"Where did you place System X (talks like it’s suffering) and Y (internals but no talk)?"**  
       → *Students admit conflict (e.g., "X high for behavior, Y low for silence")*.  
       → **"You used two criteria that pulled apart. What if we split ‘concern’ into sub-scores?"** → Name: **Concern decomposes into factors (likelihood, stakes, duration) that can conflict.**  
  - **Finally, state takeaways explicitly:**  
    1. Gradations are real and small.  
    2. Thresholds require sharp properties, but none work.  
    3. "How much a system matters" splits into questions that diverge.  

  ---

  ### **PREDICTABLE PROBLEMS & SOLUTIONS**  
  1. **"Concern isn’t finite!"**  
     - *Response*: "Tokens model limited attention/resources. We’ll discuss limits of this framing in debrief."  
  2. **Arguing about science (e.g., neuron counts)**  
     - *Response*: "Use a cliff license for that property. Then challenge it when it appears elsewhere."  
  3. **Table copies neighbors**  
     - *Prevention*: Planted systems and cliff challenges force unique choices.  
  4. **"This is flippant! [Real case] matters!"**  
     - *Response*: "This *is* about real cases. Use the tokens to express your view—then test if it holds up."  
  5. **Group stuck on allocation math**  
     - *Response*: Hand a pre-made "emergency card": "If bottom=0, max tokens=198. You need 240. Options: Raise bottom or use cliff license."  

  ---

  ### **WHAT THE ACTIVITY CANNOT DO (AND WHAT ONLY YOU CAN SUPPLY)**  
  - **Cannot reproduce**:  
    - **Unknowable vs. indeterminate thresholds**: The activity assumes moral facts exist but are hard to pin down. It can’t model "no fact of the matter" (your guess is correct).  
    - **Non-scalar accounts**: The setup implies scalar concern. It can’t show categorical alternatives (e.g., Kantian persons).  
  - **Only you can supply**:  
    - **Context**: Link this to pre/post readings (e.g., "Remember last week’s ‘facts about what it’s like’? Today’s gradations complicate that.").  
    - **Nuance**: Clarify that decomposing concern (likelihood/stakes/duration) isn’t the *only* approach—it’s a tool to expose tensions.  
    - **Real-stakes justification**: Defend the charity split as a pragmatic proxy, not a moral theory.  

  ---

  ### **WHY THIS WORKS**  
  - **Gradations become default**: The token squeeze forces concessions to the bottom; small defense pairs and cliff challenges make thresholds feel artificial.  
  - **Plants create cognitive dissonance**: Students see their own criteria conflict when slotting X and Y.  
  - **Real stakes deepen engagement**: The $20 donation (not hypothetical!) raises the stakes without requiring research. Use reputable charities (e.g., GiveWell for humans, Animal Charity Evaluators for animals) to preempt objections.  
  - **Debrief mirrors your goals**: Each moment maps to a philosophical move *after* students experience it.  

  **Materials Used**: Index cards (14 per table), poker chips (240 per table), masking tape, sticky notes (2 per table), dice (1 per table), $20 cash. All fits in a bag.  

  Run this as-is, and your students will leave feeling the weight of gradations.
