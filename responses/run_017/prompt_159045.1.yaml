answer: |-
  ## Plan
  1. **The Heir's Gambit**: Focus on the heir's lawyer secretly contacting the conservator with evidence of the duplicate, forcing them to choose between institutional loyalty and ethical truth. Ends with the conservator leaking the scandal anonymously. *Too political, dilutes the artifact's ontological core.*
  2. **Director's Pressure Cooker**: The director actively bullies the conservator into immediate destruction of one piece before the ceremony. Conservator complies but sabotages the destruction process, leaving both pieces secretly stored. *Focuses on power dynamics over the philosophical knot.*
  3. **Conservator's Solitary Crucible**: Protagonist alone with the two objects in a sealed lab for 72 hours, wrestling with their physical indistinguishability and the weight of certification. Ends with them unable to choose, leaving both in the vault unsigned. *Isolates the wrinkle best: the collapse of "which" under material equivalence and the burden of declaration.*
  4. **Public Revelation**: Conservator convinces the director to display both, forcing public confrontation. Ends in chaos, lawsuits, and no resolution. *Spectacle over substance, avoids the intimate crisis of meaning.*

  **Chosen Approach: #3 (Conservator's Solitary Crucible).** It forces the protagonist (and reader) into direct, sustained confrontation with the two materially equivalent objects and the terrifying vacuum where "originality" used to reside. The professional necessity to *certify* one collides violently with the impossibility of *knowing* which one to certify. The heir and director exert pressure from outside the sealed lab, but the core drama is internal and ontological: what does the conservator *do* when the foundational concept of their work evaporates? The wrinkle – can there be two originals? – becomes the unbearable atmosphere the protagonist breathes.

  ---

  **Condition Report: Pending**

  The vault smelled of chilled stone and the faint, persistent tang of ozone – the museum’s basement lung, breathing filtered air. Dr. Elara Vance stood before the two objects. Not side-by-side. That felt too much like an invitation for comparison, for the illusion of difference. They rested on identical padded conservation cradles, separated by ten feet of polished concrete floor. *The Triptych of Salted Light*, by Marin Voss, deceased 1985. Fragile even then. Relay-reconstituted in ’86. And then, apparently, reconstituted again. Accidentally. Unknowably.

  Eleven years. Eleven years of meticulous condition reports on the object hanging in Gallery Seven. Light levels, micro-vibrations from visitor footfall, the infinitesimal settling of pigments she documented like sacred texts. She knew its surface like the back of her hand – the craquelure pattern on the left panel’s ochre field, the specific way the varnish had microscopically pooled near the central figure’s outstretched hand. She had staked her professional competence on its singular, continuous identity. Marin Voss’s final, fractured vision.

  Now there were two.

  The revelation had arrived three days ago, buried in a decades-old system backup during a digital archive migration – fragmented logs, corrupted timestamps, but the damning truth: two run IDs for Voss-001 within minutes of each other. The partial build timeout, the panicked restart, the inexplicable decision to let *both* processes complete. Then the flood chaos, the misplaced crate, the overwritten master log. Now, only the objects themselves remained. And they were, for all practical purposes, the same.

  Director Lowell’s voice, tight with controlled panic, echoed in her memory from their hushed meeting yesterday: “Elara, the rededication is Friday. Three days. This… duplication… is an existential threat. It undermines the entire principle of relay reconstitution, the foundation of modern preservation. You *must* determine which is the gallery piece. The *original* survivor. The other… disappears. Before Friday. Quietly. Your next condition report certifies the *one*.”

  Then, this morning, the call from Ms. Voss’s lawyer. The painter’s daughter, Anya. The restitution claim: the original was destroyed in the scan. *Both* outputs were unauthorized fabrications. The museum possessed no legitimate Voss. Return both. Now. Failure constituted unlawful possession of forged artifacts. The legal language was cold, precise, a scalpel aimed at the museum’s heart.

  Vance hadn’t answered. She’d requested, demanded, these seventy-two hours with the objects. Alone. Lowell, desperate, terrified of public scandal before the rededication, had agreed. The vault was sealed. Only her access codes worked now.

  She approached Cradle A. The one pulled from the gallery wall. She knew this one. Or thought she did. She activated her micro-imager, the familiar whirring hum a grounding presence. She focused on the known flaw – a minuscule pigment clump near the lower left corner of the right panel, documented in her first report eleven years ago. She scanned. Adjusted magnification. There it was. Characteristic. Unique. Her anchor point.

  She moved to Cradle B. The crate dweller. Dust motes danced in the beam of her headlamp. She scanned the same coordinates. Adjusted. Magnified.

  There it was. The *same* pigment clump. Identical size, shape, position relative to the craquelure web around it. Impossible. Relay reconstitution wasn’t *perfect*. Thermal noise introduced variations at the molecular level. Trillions of molecules. Statistically, they *should* differ visibly somewhere under high magnification. But Vance had spent hours now. Surface texture, spectral reflectance, layer stratification – every non-invasive test available within the vault confirmed it. They were twins separated at the quantum level. Any differences were buried deep, inaccessible without destructive sampling, which was unthinkable. The technology, designed to perfectly replicate *form*, had succeeded too well. It had erased the historical path.

  Which one hung in Gallery Seven for eleven years? Was Cradle A the ‘first’ run or the ‘second’? Did it matter? The institutional ‘continuation’ of the work was defined as whatever came out of the printer *intended* as the single successor. But two had emerged. Simultaneously? Was the first scan a death that birthed two equally legitimate heirs? Or was it merely a catastrophic glitch producing two equally illegitimate copies?

  Vance thought of Anya Voss’s claim. The original was destroyed. Both were forgeries. Legally… perhaps. But did the *object* care? Did the light trapped in Voss’s brushstrokes cease to be Voss’s light because it now resided in two vessels instead of one? The thought felt heretical. Conservation was built on the sanctity of the unique material trace, the chain of custody. Yet here were two traces, equally potent, equally mute about their genesis.

  She imagined Lowell’s face if she declared both authentic continuations. It would shatter the museum’s doctrine, invalidate decades of practice. The scandal would be immense. But destroying one… choosing one arbitrarily to vanish… felt like murdering a possibility. Declaring one ‘real’ by fiat. Was that all authenticity ever was? A story told by the victors, or in this case, by the institution holding the scanner?

  Anya Voss wanted the *original* back. Not *a* Voss. *The* Voss. The one touched by her father’s hand, however indirectly through the sanctioned destruction of the scan. She wanted the singular artifact of his final act. But if the scan didn’t end the work, but split it… then neither object could satisfy that desire. Both were equally removed from the pre-scan original, yet both were equally direct products of its form being captured and reborn. Did Anya want the *history*, or the *object*? Could they be separated?

  Vance sat on the cold floor between the cradles, her back against a steel shelving unit. The vault’s silence was absolute, pressed down by the weight of stone and indecision. The rededication loomed. Lowell needed a single object on the wall and a signed condition report affirming its unique, uninterrupted lineage. Anya Voss demanded both objects back, denying the legitimacy of either. The museum’s legal team was doubtless scrambling, parsing definitions of ‘original’ and ‘forgery’ against the relay reconstitution statutes.

  But here, in the chilled stillness, those arguments felt distant, abstract. The objects radiated their own silent reality. They existed. They were materially Voss’s *Salted Light*. Both of them. Indistinguishably. To choose one over the other wasn’t discovery; it was arbitrary designation. To declare both authentic was to redefine the ontology of the work, potentially collapsing the entire edifice of value built around singularity. To declare both forgeries was to condemn them to legal limbo, denying the reality of their existence based solely on an accident of duplication.

  Vance closed her eyes. Eleven years of certifying certainty dissolved into this void. Her profession was built on knowing, on documenting, on preserving the singular thread. Now there were two threads, tangled beyond separation. The question wasn't *which* was the original. The question was whether the concept of "the original" could survive the existence of two claimants with equal, undeniable right to the form. Perhaps Marin Voss’s final, fragmented work had achieved a final, impossible unity through duplication. Or perhaps it had shattered beyond meaning.

  A soft chime echoed in the vault. Her seventy-two hours were up. Lowell would be waiting outside, expectant. Anya Voss’s lawyer would be drafting the next legal salvo. The public would gather in Gallery Seven in less than twenty-four hours, expecting to rededicate a singular masterpiece.

  Elara Vance stood. Her limbs felt heavy, leaden. She approached the console linked to the vault’s external communication panel. Lowell’s voice crackled through immediately, strained with forced calm. “Elara? Report. Which one is it? Which one is Gallery Seven?”

  Vance looked at the two identical triptychs, bathed in the vault’s sterile light. Salted Light. Fragmented. Doubled. Irreducibly present.

  “Director,” she said, her voice surprisingly steady in the echoing silence. “I need the condition report form for *The Triptych of Salted Light*. Please upload it to the secure terminal.” She paused, her gaze fixed on the impossible pair. “I’m ready to sign.”
