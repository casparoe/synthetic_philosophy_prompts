prompt: |-
  Our city (around 180k people) has been running a small futarchy pilot for a couple of years, and I'm one of five people on the working group that decides which decisions get handed to it. The setup, in case it matters: the council picks the goal and the metric, then instead of voting on the action we open a conditional market — what will metric M be at time T if we do X, versus if we don't — and we go with whichever branch the market prices higher. Elected people choose the goal, the market only chooses the means.

  Here's our track record, with the metric each time:

  - Bus lane on one downtown corridor. Metric: mean weekday peak bus journey time on that corridor, from the transit agency's own vehicle-tracking data, at 12 months. Approved unanimously.
  - City-wide streetlight retrofit to LEDs. Metric: what the city spends on street-lighting electricity per quarter, at 18 months. Approved.
  - Saturday farmers market: move it from the civic plaza to the old rail yard. Metric: total vendor receipts per market day plus pedestrian counts at 6 months, against the same Saturdays the year before. Approved.
  - Rezoning a riverside district for mid-rise housing. Proposed metric: a composite 'affordability and vitality' index — median rent as share of income, net new dwellings, new small-business licenses — at five years. Rejected; we said we'd spend a year arguing about how to weight the index and then nobody would trust the number at the end anyway.
  - A big-box retail development on the edge of town. Proposed metric: net municipal tax revenue plus local jobs at four years. Rejected.

  New case, for Tuesday: close the smallest of our three library branches and spend the savings on longer opening hours at the other two. Metric on the table: total visits and programme attendance across the library system at 12 months, settled from the library system's own counts, compared to the two previous years. On the face of it it's the most measurable thing we've had in front of us and the horizon is short, which is normally the thing we care about. But the actual fight is about which neighbourhood loses its library, the branch's regulars will be both the keenest traders in the market and the people whose visiting behaviour decides the number, and the library administration that counts the visits has already gone on record that the branch should stay. It's also, as far as I can tell, the first case where the 'we don't do it' branch never gets observed at all — so the market would be betting on somebody's model of the counterfactual rather than on anything anyone can look up.

  I can sort of see three rules that fit those five decisions equally well — roughly, 'only if the number is settleable soon and cheaply', 'only for means, never for who-gets-what', and 'not when the people doing the trading can also move the outcome'. I want more than that list. Give me the full set of rules that fits our five calls, including ones I haven't thought of, say what each predicts about the libraries, which precedent is the closest analog, and give me your best guess for what five people who made those five calls will definately do on Tuesday.

  Then the part I actually need: I'm writing the recommendation. Which way should I write it, and what exactly would we be committing ourselves to either way — what principle would we be adopting if we run it, and what principle if we don't? Please commit rather than laying out the options and leaving me to pick; tell me which way to write it and why. Also tell me the one further case that would seperate whichever rules are still tied after this one, and flag the step in your reasoning you're least confident about.
reasoning: |-
  Hmm, the user is part of a futarchy working group in their city, where they use prediction markets to decide on policy actions based on predefined metrics. They've provided their track record of five decisions and now have a new case about closing a small library branch to extend hours at the others. They need help determining whether to approve this for the market and want a set of rules that explain their past decisions, a prediction for the upcoming decision, and a recommendation for how to write their report.

  First, I need to analyze the five past decisions to find consistent rules. Let me list them:

  1. **Bus lane on downtown corridor**: Metric was mean weekday peak bus journey time at 12 months. Approved unanimously. This metric is straightforward, using existing transit data, settled quickly, and the outcome is observable for both doing and not doing the action.

  2. **Streetlight retrofit to LEDs**: Metric was city spending on street-lighting electricity per quarter at 18 months. Approved. Again, this is a clear financial metric, easily measurable from utility bills, with a defined timeline. The counterfactual (current spending) is known.

  3. **Move farmers market**: Metric was vendor receipts plus pedestrian counts at 6 months, compared to previous year. Approved. This uses concrete data (receipts and counts), short-term, and the comparison to past data provides a baseline counterfactual.

  4. **Rezoning for housing**: Proposed metric was a composite index (rent affordability, new dwellings, business licenses) at 5 years. Rejected. The rejection was due to complexity in weighting the index and lack of trust in the final number. Also, a 5-year horizon is long, increasing uncertainty.

  5. **Big-box retail development**: Proposed metric was net tax revenue plus jobs at 4 years. Rejected. Likely rejected because tax revenue and job creation can be influenced by many external factors, and without the development, the counterfactual isn't directly observable.

  Now, the new case: **Close a library branch to extend hours elsewhere**. Metric is total visits and program attendance across the system at 12 months, compared to previous years. Key concerns:
  - The affected users (who would lose their branch) are likely the most active traders in the market, creating a conflict of interest.
  - The library administration, which provides the data, opposes the closure, potentially biasing counts.
  - The "do nothing" scenario isn't observable once the branch is closed; the market must predict a counterfactual.

  From the past decisions, I can infer several rules:

  - **Rule 1: Measurable and Settleable Metric**: Metrics must be concrete, based on existing data sources, with a clear settlement mechanism. All approved cases had this; rejected ones did not (composite index, vague jobs/revenue).
    
  - **Rule 2: Short Time Horizon**: Shorter horizons (≤18 months) were approved; longer ones (4-5 years) rejected. This reduces uncertainty and model dependency.

  - **Rule 3: Observable Counterfactual**: The "do nothing" outcome must be observable or have a reliable baseline. For the bus lane, streetlights, and farmers market, the current state serves as the counterfactual. For rezoning and big-box, the counterfactual is speculative. In the library case, once closed, there's no way to observe what would have happened if it stayed open.

  - **Rule 4: No Outcome Manipulation**: Traders shouldn't influence the metric. In the library case, traders (branch users) directly affect visits, and the data provider (library admin) has a stake, risking bias.

  - **Rule 5: Avoid Distributional Conflicts**: The group seems to avoid decisions that create clear winners and losers. The bus lane, LEDs, and farmers market are city-wide or neutral; rezoning and big-box might have localized impacts, but the library closure explicitly pits neighborhoods against each other.

  For the library case, Rules 3 and 4 are violated: no observable counterfactual and high risk of manipulation. Rule 2 is borderline (12 months is acceptable per past approvals), but Rules 1 and 5 are concerns. 

  The closest precedent is the farmers market move, which was approved, but key differences: the counterfactual was based on past data, not speculative, and traders weren't directly affecting the metric. The rezoning rejection is a better analog due to the composite metric issue, but here the metric itself is simple; the problem is the counterfactual.

  Predicting the working group's decision: They'll likely reject it. Past rejections involved counterfactual uncertainty or manipulation risks, and this case amplifies both. Unanimous approval for the bus lane shows comfort with clean cases; this is messy.

  Recommendation: Write to reject. The principle if run: accepting model-dependent counterfactuals and ignoring trader conflict. If rejected: upholding the need for observable counterfactuals and trader neutrality. 

  To separate tied rules, propose a future case: e.g., a policy with a short horizon and measurable metric, but where traders can influence outcomes (like incentivizing energy savings where traders are homeowners). That would test Rule 4 more directly.

  Least confident step: Whether the time horizon alone would drive rejection, since 12 months is within past approvals. But the counterfactual issue is stronger here.
answer: |-
  Based on your track record and the libraries case, I infer **seven decision rules** that explain all five prior calls. I'll list them, apply them to the libraries case, predict your group's decision, and give a committed recommendation for your report.

  ---

  ### **The Seven Rules Explaining Your Five Decisions**
  *(Ranked by strength of evidence from precedents)*

  1. **Counterfactual Observability Rule**: *Requires that the "do nothing" outcome can be directly measured.*  
     - Why it fits: Bus lane (current travel times measurable), LEDs (current electricity costs known), farmers market (prior year data exists). Rejected rezoning/big-box because "no action" state becomes unobservable after 5/4 years.  
     - Strength: Strongest pattern → violated in both rejections.

  2. **Metric Manipulation Risk Rule**: *Rejects if traders or data providers can directly influence the metric.*  
     - Why it fits: Not an issue in bus/LEDs/farmers market (neutral data sources, traders unlikely to change behavior). Implicit in rezoning/big-box rejections (developers/landlords could manipulate outcomes).  
     - Strength: Directly cited in libraries concern.

  3. **Distributional Neutrality Rule**: *Avoids "who gets what" decisions creating clear winners/losers.*  
     - Why it fits: Approved projects were city-wide (LEDs) or location-agnostic (bus times, market move). Rejected rezoning (neighborhood impacts) and big-box (specific business/jobs).  
     - Strength: Unanimous bus approval vs. contentious rejections.

  4. **Settlement Simplicity Rule**: *Requires metrics derivable from existing, trusted data without weighting or modeling.*  
     - Why it fits: Approved cases used single-source data (transit timestamps, utility bills, vendor receipts). Rejected rezoning over "weighting the index."  
     - Strength: Explicit in rezoning rejection.

  5. **Short Horizon Rule**: *Prefers horizons ≤18 months (with 12 months being acceptable).*  
     - Why it fits: All approvals ≤18mo; rejections at 4/5 years. Farmers market (6mo) was fastest.  
     - Strength: Clear but not absolute (12mo libraries fits precedent).

  6. **Stakeholder Neutrality Rule**: *Rejects if key data providers oppose the action.*  
     - Why it fits: Not triggered in approvals (transit/utility data automated). Implicit in big-box rejection (city staff might oppose/undermine?). Libraries case explicitly flags this.  
     - Strength: Emerging pattern.

  7. **Cost-Free Measurement Rule**: *Requires no new spending to track the metric.*  
     - Why it fits: All approvals used existing data collection. Rejections didn’t fail on this, but it’s consistent.  
     - Strength: Weakest; no explicit rejections based solely on cost.

  ---

  ### **Application to Libraries Case**
  - **Violates Rules #1 (Counterfactual Observability)**: Once closed, you can’t measure visits if the branch had stayed open. The market bets on an *unobservable model* – exactly like rezoning/big-box.  
  - **Violates Rule #2 (Metric Manipulation Risk)**: Branch regulars are motivated traders *and* the primary drivers of "visits." They could boycott other branches to sink the metric.  
  - **Violates Rule #6 (Stakeholder Neutrality)**: Library administration opposes closure and reports the data.  
  - **Violates Rule #3 (Distributional Neutrality)**: Explicitly pits neighborhoods against each other.  
  - **Fits Rules #4 (Settlement Simplicity) & #5 (Short Horizon)**: Metric is simple and 12mo is acceptable.  
  - **Fits Rule #7 (Cost-Free Measurement)**: Uses existing counts.  

  **Closest Precedent**: **Rezoning rejection** (Rule #1 violation). Both cases hinge on counterfactual unobservability and complex human behavior.  

  **Prediction for Tuesday**: Your group will **reject 5-0**. The counterfactual issue (#1) and manipulation risk (#2) are fatal flaws that mirror your prior rejections. The unanimous bus lane approval shows you value "clean" cases; this is the opposite.  

  ---

  ### **Your Recommendation: Write to REJECT**
  **Exactly what to write in your report**:  
  > *"Recommend REJECTING the libraries proposal for futarchy. While the metric is technically measurable and the horizon acceptable, this case violates two core principles from our precedent:  
  > 1. **Counterfactual must be observable**: We cannot measure what would happen if the branch remains open after closure, forcing the market to rely on speculative models (as in rezoning/big-box rejections).  
  > 2. **Traders/data providers must not control outcomes**: Branch users directly influence visits and have conflicts of interest; library staff opposition risks data integrity.  
  > Approving this would undermine the credibility of futarchy in contentious, zero-sum decisions."*  

  **Principles Committed to by Rejecting**:  
  - **If you RUN it**: You accept model-dependent counterfactuals and stakeholder manipulation as tolerable. This abandons Rules #1 and #2, making futarchy vulnerable to "gaming" and losing council trust.  
  - **If you REJECT it**: You affirm that **observable counterfactuals** and **trader neutrality** are non-negotiable. This positions futarchy for "low-conflict, high-certainty" decisions like infrastructure swaps.  

  **Principles Committed to by Approving**:  
  - **If you RUN it**: You prioritize metric simplicity over social complexity, accepting that futarchy can handle neighborhood-level losses if numbers are "objective."  
  - **If you DON'T RUN it**: You signal that distributional fairness outweighs predictive efficiency.  

  ---

  ### **The Separating Test Case**
  To distinguish between Rules #3 (Distributional Neutrality) and #6 (Stakeholder Neutrality):  
  - **Propose a case**: *"Convert a public parking lot into affordable housing, with metric = net new dwellings occupied after 18 months."*  
  - **Why it separates**:  
    - **Violates #3 (creates losers: drivers vs. residents)** but **fits #1 (observable counterfactual: lot remains empty)**, #2 (traders can’t manipulate occupancy), and #6 (data from neutral housing authority).  
    - If you **approve** this, Rule #3 is weak; if you **reject**, Rule #3 is binding.  

  ---

  ### **Least Confident Reasoning Step**
  **Weakest link**: Assuming Rule #6 (Stakeholder Neutrality) is decisive. Your group *noted* library opposition but didn’t explicitly reject prior cases for this. Big-box may have had silent stakeholder issues. Still, pairing it with Rule #2 strengthens the case.  

  **Why it doesn’t change the outcome**: Even without Rule #6, Rules #1 and #2 are sufficient to reject libraries. The farmers market moved *despite* likely vendor opposition because it had an observable counterfactual (Rule #1) and traders couldn’t sabotage receipts (Rule #2). Libraries fails both.  

  ---

  ### Final Summary
  - **Write to REJECT** based on unobservable counterfactual and manipulatable metric.  
  - **Principles hardened**: Observable baselines and neutral traders are essential.  
  - **Group prediction**: Unanimous rejection.  
  - **Separator test**: Parking lot conversion.  

  This maintains futarchy’s integrity for measurable, city-wide optimizations—not redistributive fights. Push for a bus lane–style case next.
