            - The inside view might by chance do better for some participants? We hope that on average the outside view wins, but if a participant had a very good inside view forecast, we can use that to discuss: "But can you always rely on the inside view? How consistent are you?"
            - Participants might not take the cost seriously? We made it a point cost, but if they don't care about points, they might always choose the narrow class. We need to stress that the cost is real (it affects their score) and that they should think about the trade-off.
            - Time: running two rounds and the scoring might take the whole 75 minutes? We have to be efficient.

          What the game can't produce and we have to tell them:
            - In real life, we sometimes have inside-view information that is truly diagnostic and should adjust the outside view. The game doesn't have that because the actual outcome is drawn from the same distribution for all. In reality, sometimes the inside view tells you that the case is an outlier. We adjust the outside view with inside-view information (this is the hybrid approach). But the point of the game is to show that the outside view is a good starting point and that people tend to underuse it.

     We provide the instructor with the pre-generated numbers and the descriptions.

     Let's generate the numbers for the 5 scenarios with the method described:

          Scenario 1: M=1000, SD=400
            actual: we draw from N(1000,400) -> let's use 1050
            broad: from N(1000, 400/sqrt(100)=40) -> 990
            medium: from N(1000, 400/sqrt(20)=89.44) -> 1020 (rounded)
            narrow: from N(1000, 400/sqrt(5)=178.89) -> 800 (rounded)

          Scenario 2: M=2000, SD=800
            actual: 2100
            broad: 2010
            medium: 1900
            narrow: 2300

          Scenario 3: M=500, SD=200
            actual: 450
            broad: 490
            medium: 510
            narrow: 600

          Scenario 4: M=100, SD=40
            actual: 120
            broad: 105
            medium: 90
            narrow: 150

          Scenario 5: M=5000, SD=2000
            actual: 4800
            broad: 4950
            medium: 5100
            narrow: 4000

     We'll use these.

     Now, the game plan:

          Time allocation (75 minutes):
            5 min: Introduction and rules for round 1.
            15 min: Round 1 (reading 5 descriptions and forecasting).
            5 min: Collect round 1 and introduce round 2.
            15 min: Round 2 (choose reference classes for each scenario).
            5 min: Reveal base rates for chosen classes and have them record forecasts.
            5 min: Reveal actual outcomes and have them compute errors and costs.
            20 min: Scoring and debrief.
            5 min: Buffer.

     Debrief structure:
          - Ask: How did you feel about the inside view? Was it hard? Did you feel confident?
          - Ask: How did you choose your reference classes? What made you pick a narrow class? What about the cost?
          - Show on the board the average inside loss and outside loss (with cost) for the whole class. We expect the outside view to win.
          - Then reveal the concepts: inside view vs. outside view.
          - Discuss the three points:
              1. The outside view requires choosing a reference class, which is an inside-view judgment.
              2. The outside view averages out noise: show how the broad class was stable and the narrow class was volatile.
              3. The advantage of the outside view is partly due to this averaging.
          - Finally, mention what the game couldn't show: in reality, sometimes the inside view provides unique diagnostic information that should adjust the outside view. But the danger is that we overweight the inside view.

     We are ready.
