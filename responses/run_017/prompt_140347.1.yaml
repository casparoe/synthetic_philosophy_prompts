  ### Forecasting & Judgment Seminar Game: **"The Base Rate Challenge"**

  #### **Learning Objectives**
  - Experience why aggregating historical data often beats case-specific intuition.
  - Feel the tension between "relevance" and "statistical robustness" in reference classes.
  - Discover that the outside view's power comes partly from averaging noise, not just insight.

  ---

  ### **Game Structure**
  **Duration:** 75 minutes  
  **Participants:** 18 second-year students  
  **Rounds:** 2 rounds (Inside View → Outside View)  
  **Metrics:** Forecast growth of fictional entities (e.g., users, market cap) over 5 years.  
  **Scoring:** Quadratic scoring rule. Forecasts scored against "actuals" (made-up).  
  **Key Twist:** Choosing a "narrow" reference class costs points.  

  ---

  ### **Materials**
  1. **Round 1 Handout (Inside View):**  
     - 4 scenarios with vivid, detailed descriptions (see examples below).  
     - As-of date: **"Forecast as of Jan 2020"** (no hindsight).  
     - Forecast form: "Predict metric X in 2025 (e.g., users, market cap)."  

  2. **Round 2 Handout (Outside View):**  
     - Same 4 scenarios, now labeled with names (e.g., "SocialUp," "MediTech").  
     - **Reference class options** for each scenario (3 choices):  
       - **Broad:** Large sample, low cost (e.g., *All tech platforms*).  
       - **Medium:** Moderate sample, medium cost (e.g., *Social media platforms*).  
       - **Narrow:** Small sample, high cost (e.g., *AI-driven social platforms*).  
     - **Costs:** Broad (0 pts), Medium (10 pts), Narrow (20 pts).  
     - *Base rates hidden* until choices are committed.  

  3. **Instructor’s Key:**  
     - Pre-generated "actuals" and base rates (see tables below).  
     - Scoring spreadsheet (for quick results).  

  ---

  ### **Scenarios & Data (Fictional, Made-Up)**  
  *(All values hypothetical; designed to illustrate concepts)*  

  1. **Scenario A: SocialUp**  
     - *Description:* "AI-driven social platform launched in 2018. Viral growth in Gen Z users. Competitors emerging. Monetization unproven."  
     - Metric: **Users (millions)** in 2025.  
     - **Actual:** 120M  

  2. **Scenario B: MediTech**  
     - *Description:* "Health-tech startup with FDA-approved wearable. Early adoption in hospitals. High R&D costs. Patent pending."  
     - Metric: **Market cap ($B)** in 2025.  
     - **Actual:** $8B  

  3. **Scenario C: EduGrow**  
     - *Description:* "Online learning platform for professionals. Partnerships with top universities. High user engagement but low revenue."  
     - Metric: **Paid subscribers (millions)** in 2025.  
     - **Actual:** 5M  

  4. **Scenario D: GreenCharge**  
     - *Description:* "Electric vehicle charging network. Government grants secured. Expanding to 10 cities. Competition from auto giants."  
     - Metric: **Revenue ($M)** in 2025.  
     - **Actual:** $300M  

  ---

  ### **Reference Classes & Base Rates (Round 2)**  
  *(Participants choose ONE class per scenario BEFORE seeing base rates)*  

  | Scenario | Reference Class       | Sample Size | Cost (pts) | Base Rate (Made-Up) |  
  |----------|------------------------|-------------|------------|---------------------|  
  | **SocialUp** | Broad: All tech platforms | 100        | 0          | 95M users           |  
  |          | Medium: Social media     | 25         | 10         | 130M users          |  
  |          | Narrow: AI social apps   | 8          | 20         | 180M users          |  
  | **MediTech** | Broad: All health-tech   | 100        | 0          | $6B market cap      |  
  |          | Medium: Wearable tech    | 20         | 10         | $9B market cap      |  
  |          | Narrow: FDA-approved devices | 6      | 20         | $15B market cap     |  
  | **EduGrow** | Broad: All ed-tech       | 100        | 0          | 4M subscribers      |  
  |          | Medium: Professional edu | 30         | 10         | 6M subscribers      |  
  |          | Narrow: University partners | 10      | 20         | 10M subscribers     |  
  | **GreenCharge** | Broad: All green energy | 100       | 0          | $250M revenue       |  
  |          | Medium: EV infrastructure | 15        | 10         | $350M revenue       |  
  |          | Narrow: Charging networks | 5         | 20         | $500M revenue       |  

  > **Critical Design Note:**  
  > - Narrow classes have "tempting" base rates (e.g., 180M for SocialUp) but are *noisy* (small samples).  
  > - Broad classes are closer to "actuals" on average (e.g., 95M vs. actual 120M).  

  ---

  ### **Rules**  
  1. **Round 1 (Inside View):**  
     - Read scenarios. Forecast **metric in 2025** based *only* on descriptions.  
     - No research/devices allowed. 10 minutes.  

  2. **Round 2 (Outside View):**  
     - For each scenario, **choose ONE reference class** (Broad/Medium/Narrow).  
     - **Commit to choices** (no changing after base rates revealed).  
     - **Cost incurred immediately** (e.g., Narrow = -20 pts).  
     - *Then* instructor reveals base rates. Base rate = forecast for that scenario.  
     - 10 minutes.  

  3. **Scoring:**  
     - **Quadratic Scoring Rule:**  
       `Score = 100 - [ (Forecast - Actual) / Scale ]² × 100`  
       - **Scale:** Max reasonable error (e.g., 200M for users).  
       - *Example:* Forecast=150M, Actual=120M, Scale=200 → Score = 100 - [(30/200)² × 100] = 98 pts.  
     - **Round 1 Score:** Sum for all 4 scenarios.  
     - **Round 2 Score:** Sum for all 4 scenarios *minus* total cost of class choices.  

  ---

  ### **Predictable Pain Points**  
  1. **Round 1 (Inside View):**  
     - Overconfidence in vivid details (e.g., "Gen Z viral growth!" → forecasts ~200M for SocialUp).  
     - Wide variance in forecasts → high average error.  

  2. **Round 2 (Outside View):**  
     - >50% choose Narrow classes ("It matches best!") despite cost.  
     - Shock when base rates are noisy (e.g., 180M vs. actual 120M).  
     - "But the broad class feels *too generic*!" → regret after seeing costs.  

  3. **Scoring:**  
     - Broad classes usually win (low cost + robust base rates).  
     - Narrow classes often lose big (high cost + noisy base rates).  

  ---

  ### **Debrief Script**  
  *(Map moments to key insights)*  

  1. **"Why did your inside view feel so compelling?"**  
     - Vivid details → narrative fallacy.  
     - *"You overfitted to noise in the story."*  

  2. **"What happened when you picked reference classes?"**  
     - Choosing "relevant" classes = **inside view in disguise** ("Is AI social really different?").  
     - Cost forced trade-off: **Relevance vs. robustness**.  

  3. **"Why did broad classes often win?"**  
     - **Averaging noise:** Broad samples cancel out quirks (e.g., 100 tech platforms > 5 AI apps).  
     - Narrow classes amplify small-sample noise (e.g., 1 outlier skews 5-case average).  

  4. **"What's the outside view *really* doing?"**  
     - Not "deeper insight" → **disciplined aggregation**.  
     - Protects against overfitting *this* story’s noise.  

  5. **Limitations (Tell Them Straight):**  
     - *"The game can’t show when inside view adds value.* Sometimes case-specific facts *do* matter (e.g., ‘This AI is patented’). But start with the outside view to anchor against bias, *then* adjust."  

  ---

  ### **Logistical Tips**  
  - **Pre-game:** Test scoring with dummy forecasts (ensure broad classes win on average).  
  - **During:** Use a timer. Have TAs collect/scans forecasts quickly.  
  - **Post-game:** Show class-wide results (e.g., "Avg. inside view error: 40% | Broad class: 12%").  
  - **Discussion Qs:**  
    - *"When did you ignore cost? Why?"*  
    - *"Would you use narrow classes if they were free?"*  

  ---

  ### **Why This Works**  
  - **Tactile trade-off:** Cost makes class selection a **real decision**, not academic.  
  - **Aha! moment:** Narrow classes "feel" right but often lose → exposes the noise-averaging power of breadth.  
  - **No jargon:** "Base rate" and "outside view" introduced *after* they feel the tension.  

  **Final Prep:** Dry-run timing. Have fun — the chaos is part of the lesson!
