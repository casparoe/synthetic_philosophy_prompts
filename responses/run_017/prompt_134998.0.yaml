answer: |-
  Here is the exam question, model answer, marking scheme, and evaluation note as requested.

  ---

  **1. Exam Question (127 words):**

  > Gongsun Long argues "a white horse is not a horse". His key support is the *delivery argument*: if you seek a horse, yellow/black horses are acceptable; if you seek a *white* horse, they are not. Since what is sought differs, white horse ≠ horse. He also claims ‘horse’ designates shape, ‘white’ designates colour, and what designates colour ≠ what designates shape. Finally, he argues whiteness and horse can be conceptually separated from a white horse.
  >
  > Compare three cases:
  > (A) A wooden horse is not a horse. (Uncontroversially true)
  > (B) A white horse is not a horse. (Controversial)
  > (C) Suppose a language has a single word "zhu" meaning *only* what we call "white horse", with no parts meaning "white" or "horse". Could Gongsun Long still assert "zhu is not a horse" using his delivery argument? Would the shape/colour or separability arguments still apply?
  >
  > **Question:** Can Gongsun Long’s delivery argument *alone* justify distinguishing case (B) from case (A)? If not, what essential work do the shape/colour distinction and the separability argument perform in establishing his thesis about (B)? What substantive claim survives if we set aside purely verbal aspects?

  ---

  **2. Model Answer (1,018 words):**

  Gongsun Long’s thesis that “a white horse is not a horse” aims to reveal a substantive metaphysical distinction, not mere verbal trickery or ambiguity. The delivery argument, however, is insufficient by itself to justify distinguishing the controversial case (B) from the uncontroversial case (A), and it fails entirely in case (C). The shape/colour distinction and separability argument are therefore essential to salvage a non-trivial thesis.

  **The Delivery Argument’s Limitations:**
  The delivery argument claims that because yellow/black horses satisfy a request for “horse” but not for “white horse”, the terms designate different things. This argument cannot reliably distinguish (A) from (B). In (A), “wooden horse” clearly excludes standard horses because “wooden” specifies a materially distinct kind; the delivery test (rejecting live horses) reflects this real exclusion. In (B), “white” merely specifies a subset *within* the kind “horse”; rejecting non-white horses when seeking a “white horse” reflects this specification, not exclusion from the kind. The delivery test produces the same *linguistic behaviour* (rejection of non-white/non-wooden items) for both (A) and (B), but for radically different reasons: exclusion in (A), specification in (B). It lacks the power to diagnose *why* rejection occurs. Crucially, in case (C), the delivery argument collapses. If we seek a “horse”, we might accept a brown horse (a horse). If we seek a “zhu” (white horse), we reject the brown horse. The argument would then conclude “zhu ≠ horse” based *only* on rejection patterns. Yet, in reality, “zhu” simply *is* a type of horse. The delivery argument here generates a false distinction purely from linguistic convention, proving it can mistake specification for exclusion. It cannot, by itself, establish a genuine metaphysical distinction like that in (A).

  **The Role of Shape/Colour and Separability:**
  If the delivery argument is insufficient and potentially misleading, Gongsun Long’s thesis depends on his other moves. The shape/colour distinction (“horse” names shape, “white” names colour; colour ≠ shape) provides the conceptual tools to analyse *why* “white horse” might not be straightforwardly identical to “horse”. It treats “horse” and “white” as abstract, distinct attributes (universals). “Horse” refers purely to equine form, abstracted from all colour. “White” refers purely to a colour quality, abstracted from all form. A “white horse” is thus a concrete composite: form + colour. The claim “what designates colour ≠ what designates shape” asserts the fundamental distinctness of these abstract attributes. This allows Gongsun Long to argue that “white horse” designates the *composite* (form + colour), while “horse” designates *only* the form component. They are non-identical because the composite possesses an attribute (colour) irrelevant to – and potentially separable from – the pure form “horse”. This directly addresses case (B) and distinguishes it from (A). “Wooden horse” excludes because “wooden” pertains to material, conflicting with the material essence of a live “horse”. “White horse”, however, combines two compatible but distinct abstract attributes; its non-identity stems from the composite nature of the designation, not material exclusion. In case (C), this distinction remains applicable. Even if “zhu” has no analyzable parts, it still *instantiates* the abstract attributes “horse” (shape) and “white” (colour). Gongsun Long could argue that “zhu” designates the concrete composite instance, while “horse” designates only the shape universal instantiated *within* that composite. The lack of linguistic analysis doesn’t erase the metaphysical composition.

  The separability argument (“Is whiteness separable from horse? … Whiteness may not be fixed with horse”) reinforces this. It demonstrates that the attributes combined in a white horse are conceptually independent. We can conceive of “horse” without any specific colour (e.g., imagining the form abstractly), and we can conceive of “white” without any specific form (e.g., white snow, white jade). This separability proves the attributes are distinct existents. Therefore, the composite “white horse” cannot be identical to “horse” alone, precisely because “horse” alone lacks the additional, separable attribute “white”. This move targets the core of identity claims: if X and Y are identical, they must share all properties. “Horse” (the shape universal) lacks the property of having-a-specific-colour (like whiteness) inherent in the composite “white horse”. Hence, they are not identical. This logic applies equally in case (C): “zhu” instantiates both shape and colour universals; “horse” refers only to the shape universal. They are non-identical because the universal lacks the colour property present in the instance. The delivery argument’s failure in (C) is thus irrelevant; the substantive distinction rests on the metaphysics of attributes, not language.

  **The Surviving Substantive Thesis:**
  Stripped of merely verbal aspects (like the specific phrasing of the delivery test), Gongsun Long’s substantive claim is this: **Designating a composite particular (possessing multiple distinct, separable attributes) is not identical to designating one of those abstract attributes alone.** In case (B), “white horse” designates a concrete particular defined by shape *and* colour, while “horse” designates the abstract attribute of shape. They are non-identical because the abstract universal “horse” does not entail any specific colour and exists independently of it. This is not sophistry; it challenges the assumption that naming a composite necessarily includes naming its components without remainder, or that referring to an instance is identical to referring to a universal it instantiates. It asserts a real distinction between abstract attributes and concrete instantiations combining multiple attributes. While one may disagree with the ontological commitment to separable universals, the claim is a coherent metaphysical proposition about designation, identity, and composition, applicable even in the artificial language of case (C). The delivery argument is merely an imperfect illustration; the real weight is borne by the analysis of attributes and their separability.

  ---

  **3. Marking Scheme (20 marks total, 4 per item):**

  1.  **Diagnosis of Delivery Argument’s Failure (4 marks):**
      *   **Earns 4:** Clearly explains *why* delivery argument gives same result (rejection pattern) for (A) (exclusion) and (B) (specification), proving it cannot distinguish them. Explicitly states it fails in (C) by mistaking specification for exclusion based solely on language.
      *   **Common Mistake (Loses 2):** Merely restates delivery argument works for (B) or claims it *does* distinguish (A)/(B) without addressing the core similarity in rejection behaviour.

  2.  **Shape/Colour Distinction’s Role (4 marks):**
      *   **Earns 4:** Explains how S/C treats "horse" and "white" as distinct abstract attributes (universals). Shows this allows "white horse" to designate a composite (S+C) fundamentally non-identical to the attribute "horse" (S alone). Explicitly connects this to distinguishing (B) from (A) (composition vs. material exclusion) and shows it applies in (C) (universals exist regardless of word structure).
      *   **Common Mistake (Loses 2):** Only describes the S/C distinction without linking it to composite vs. simple designation or universals. Fails to apply it to cases (A) or (C).

  3.  **Separability Argument’s Role (4 marks):**
      *   **Earns 4:** Explains separability demonstrates the attributes are conceptually/metaphysically independent. Argues this proves the composite ("white horse") possesses a property (the specific colour attribute) that the simple attribute ("horse") lacks, violating identity. Shows this logic underpins the non-identity claim independently of language/delivery.
      *   **Common Mistake (Loses 2):** Mentions separability but doesn't link it to the identity condition (possessing different properties) or fails to show its independence from the delivery argument.

  4.  **Articulation of Substantive Thesis (4 marks):**
      *   **Earns 4:** Clearly states the core thesis as the non-identity between designating a composite particular/instance (possessing multiple separable attributes) and designating one abstract attribute alone. Emphasizes this is metaphysical (about universals/instances/attributes), not merely verbal/semantic. States it survives in (C).
      *   **Common Mistake (Loses 2):** Restates the original sentence ("white horse ≠ horse") without metaphysical grounding, or frames the thesis solely as a point about language/ambiguity.

  5.  **Structure, Clarity & Case Integration (4 marks):**
      *   **Earns 4:** Logically structured (e.g., delivery failure -> S/C role -> separability role -> thesis). Uses cases (A), (B), and especially (C) effectively *throughout* the argument to test and illustrate points. Precise, unambiguous prose.
      *   **Common Mistake (Loses 2):** Cases are only mentioned initially or sporadically. Argument is disjointed or unclear. Fails to consistently integrate case (C) analysis.

  *   **Thresholds:**
      *   **A (17-20):** Secures all items (1-5). Demonstrates deep integration of the cases and a clear grasp of the metaphysical shift beyond delivery. Particularly strong on Items 2, 3 & 4.
      *   **B (13-16):** Secures core Items 1, 4 & 5, but may be weaker on 2 or 3 (e.g., describes S/C/separability but doesn't fully establish their *essential* role). Handles cases adequately but not brilliantly.
      *   **C (9-12):** Attempts Items 1 & 5, but shows significant gaps (e.g., misses why delivery fails in (A)/(B) comparison, or fails to articulate a substantive thesis beyond semantics). Case use is superficial.

  ---

  **4. Closing Note (145 words):**

  A genuinely good answer will move beyond describing the arguments to *performing* the crucial conceptual shift: recognizing that the delivery argument is a red herring in establishing the metaphysical core, and that the real force lies in the analysis of attributes and separability. It will leverage the comparison cases proactively: using (A) to expose the delivery argument's weakness, (C) to decouple the thesis from specific linguistic form, and (B) as the constant target. Fluency without substance might restate the text or focus solely on delivery/semantics. The strongest students might overcomplicate, perhaps questioning the universals framework itself or importing external metaphysics not prompted by the question. They could also stumble by *under*-estimating the delivery argument's intended role or struggling to articulate the precise nature of the surviving "designation" thesis without resorting to modern jargon like "sense/reference" or "intension/extension". The challenge is staying grounded in Gongsun Long's moves while rigorously applying the cases.
