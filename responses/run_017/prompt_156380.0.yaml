answer: |-
  The committee faced a problem both mathematically and morally structured by scarcity. With only a few machines and many medically eligible candidates, they couldn't avoid choosing who would live and who would likely die. Their initial procedure – ranking by "social worth" – was an attempt to maximize something *denominated*, though the unit remained implicit. They weren't measuring utility levels (an absolute state of well-being) nor strictly utility gains (the improvement from illness to dialysis), but rather **expected lifetime contribution denominated in a composite social numeraire**. This numeraire bundled elements like economic productivity (taxes paid, dependents supported), social stability (emotional balance, cooperativeness), and civic virtue (community/church participation). Each element presupposed interpersonal comparisons: not only could they rank Candidate A above Candidate B in "dependents supported," but they implicitly assumed the *magnitude* of the difference mattered enough to aggregate across categories. This isn't purely ordinal ranking; it requires cardinal comparisons (how *much* more valuable is A's dependents than B's?) and interpersonal comparability (is supporting a child *equivalent* in value to supporting a spouse? Is civic participation *commensurable* with tax payments?).

  The allure of "rank-only" comparison – simply ordering candidates without assigning magnitudes – proves chimerical in practice. Arrow's theorem demonstrates the profound difficulty of aggregating purely ordinal, non-comparable individual preferences into a consistent social ordering, but that wasn't the committee's immediate problem. Their collapse happened earlier: the moment they needed to *justify* ranking A above B. "Why A over B?" couldn't be answered with "because we ranked him higher." It demanded reasons pointing to *magnitudes*: "A has *more* dependents," "B is *less* stable," "A contributes *significantly more* to the community." These are denominated comparisons smuggled back in. "Social worth" couldn't remain purely ordinal; it inevitably invoked implicit units of value, however vague or contested.

  Your nurse's ledger highlights the central ambiguity: **Whose utility counts?** The social-worth approach primarily valued utility *for others* – the dependents not bereaved, the economy not deprived of a worker, the community not losing a pillar. The patient's *own* utility – the relief from suffering, the joy of continued life, the burdensome reality of thrice-weekly dialysis – was secondary, perhaps only valued indirectly through "cooperativeness" (ease for the *staff*) or "rehabilitation" (reduced *societal* burden). An impartial observer, genuinely attempting to inhabit each life equally, would likely prioritize differently. They would weigh the *patient's* experienced gain from continued life most heavily, as this is the most direct and profound utility swing (from death to life). Factors like dependents would matter, but as *components* of the patient's own well-being or as separate claims needing integration. This reconstruction *might* converge with social worth for a sole breadwinner with young children, but diverge sharply for the emotionally fragile artist with no dependents but immense capacity for personal joy and creation. The impartial observer is theoretically potent but psychologically frail in a room of tired volunteers. Empathy is uneven; biases creep in. They might *aim* for impartiality but anchor in their own values, replicating social worth under another name.

  The ledger's two columns – "Loss to Self" and "Loss to Others" – expose the baseline problem and the specter of double-counting. If utilities are fully comparable, the "Loss to Others" *should* already be captured in *their* utility functions. Including it separately *in the patient's ledger* risks counting it twice: once in the others' potential assessment of their own loss, and once here. Yet *excluding* it feels monstrously incomplete to anyone who understands a death ripples outward. The core tension is the **baseline**. Measuring "Loss to Self" from the *patient's status quo ante* (impending death) makes the gain from dialysis enormous and roughly equal for all medically eligible patients in terms of sheer survival. This pushes towards lottery or medical-benefit maximization (more life-years). Measuring from a *common baseline* like a "fair innings" (everyone deserves X years) makes younger candidates' losses seem larger, justifying prioritizing them. The "Loss to Others" column implicitly adopts a societal baseline: the loss measured is the *departure from the social state where this person lives*. This column inevitably dominates if society's utility is the numeraire, as in social worth. A truly patient-centered view, focused on the individual gain from not dying, struggles to accommodate the "Loss to Others" column coherently without duplication or distortion; it belongs to a different calculus.

  The lottery seems an escape from comparison. It declares all within the pool have equal claims, requiring no weighing of lives against lives. But this is an illusion in two crucial senses. First, it **shifts the comparison upstream**. Deciding who enters the medically eligible pool requires judgments about medical benefit thresholds and prognosis, often involving denominated comparisons (e.g., expected life-years gained). Second, it **converts interpersonal comparison into probability comparison**. Instead of saying "B deserves it less than A," it says "B had an equal *chance*, but lost." The lottery transforms the nature of the justification offered to the loser: it's about luck, not worth. This changes the expressive harm – the message is "we didn't deem you *unworthy*," not "we affirm your *equal worth*" – but it doesn't eliminate the underlying need for prior judgments about pool inclusion. It also doesn't answer whether equal probability is the *right* response to potentially unequal need or contribution.

  The public revulsion and the eventual congressional solution illuminate the limits of the lens. The recoil wasn't primarily about epistemic impossibility ("we *can't* measure social worth accurately") but about moral unavailability ("we *must not* measure human worth this way"). The committee’s explicit quantification violated a deep taboo against publicly ranking the intrinsic value of lives, especially using criteria like income or church attendance that felt arbitrary, discriminatory, or irrelevant to the fundamental claim of needing life-saving care. The expressive harm – the message sent to those deemed "less worthy" – was visceral and arguably constituted a distinct wrong beyond any misallocation. Medicare dissolved the scarcity, making the comparisons *unnecessary*, revealing that the agonizing problem of interpersonal comparison was fundamentally a problem of *absolute scarcity*. When resources are abundant enough, we can avoid the most brutal comparisons. But scarcity wasn't eliminated; it was relocated. The immense cost of universal dialysis coverage (borne by taxpayers) represents resources *not* spent on other life-saving or life-enhancing interventions (cancer treatments, poverty alleviation, road safety). The interpersonal comparisons became hidden within budgetary processes and implicit societal priorities, denominated in dollars rather than direct life rankings, but the underlying ethical tension persists.

  **What your characters are entitled to believe and what they would say:**
  *   **The Pragmatist (Businessman/Accountant):** "We have limited slots. We must get the best return for society's investment. That means productive citizens, stable people who won't waste the resource, those supporting others. It's harsh, but wasting a machine on someone who contributes little is irresponsible." (Believes denominated social contribution is measurable and paramount).
  *   **The Physician:** "The medical screen defines who *can* benefit. Beyond that, maximizing total life-years saved is the least arbitrary medical ethic. Younger, healthier patients get more years. Or, if we can't agree on that, a lottery is fairest *among* the medically equal." (Focuses on denominated medical benefit or probabilistic fairness).
  *   **The Clergy/Conscience:** "Ranking lives this way is playing God. Who are we to judge a person's worth by their paycheck or their temperament? Every life is sacred. A lottery acknowledges our inability to judge worthiness and treats all equally before God's grace." (Rejects interpersonal comparability of worth, leans towards lottery as expressive humility).
  *   **The Social Worker:** "We must consider the whole picture. The impact on children, the spouse left destitute, the community losing a volunteer. It's not just about the individual patient." (Focuses on "Loss to Others," struggles to integrate it with "Loss to Self").
  *   **Your Nurse (Ledger Keeper):** *Observes the arguments, sees the anguish.* "What does *she* stand to lose? Her future, her joy, her pain. What does *he* stand to lose? His children's security, his work's completion. How can these be weighed on the same scale? The doctor sees years, the businessman sees dollars, the priest sees souls. And the committee writes numbers on a page... or draws a name from a hat." (Intuits the incommensurability and the expressive harm, feels the weight of both columns but sees the impossibility of their clean summation).

  **Words to avoid:** Any character definitively resolving the "double-counting" problem in the ledger, invoking Rawls's veil of ignorance explicitly (the concept wasn't published until 1971), claiming the lottery is *truly* comparison-free, or asserting that Medicare "solved" the ethical problem rather than relocated it. The arguments should be visceral, grounded in 1962 intuitions – appeals to fairness, responsibility, fear of playing God, practicality, compassion – not anachronistic philosophical jargon. The nurse’s profound unease, witnessing the translation of human lives into categories and rankings, or the cold impersonality of the lottery draw, is the beating heart of the silence the utilitarian lens cannot capture. The distortion lies in the lens’s inability to fully register that what was being decided wasn't just the allocation of a medical resource, but the public affirmation or denial of the equal worth of persons facing death.
