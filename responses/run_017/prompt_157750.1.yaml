prompt: |-
  Hi — I need a Q&A prep sheet, and I'm nervous enough about this one that I'd rather massively over-prepare than wing it.

  Setup: I'm a fourth-year PhD student in philosophy, and next Thursday I'm giving a paper at my department's work-in-progress seminar (40 minutes plus maybe 20 of questions) on the third chapter of my thesis. The chapter is about what a very capable AI system should be built to aim at, assuming we can't just hand it a complete list of instructions. The best-known proposal in that corner of the literature is coherent extrapolated volition: roughly, aim at what we would want if we knew more, thought faster, were more the people we wished we were, and had grown up closer together. My argument is that this proposal quietly contains two separate moves that everyone treats as one — an idealization stage (correct our actual preferences for ignorance, sloppy reasoning, and manipulation) and an aggregation stage (fuse many corrected wills into a single will to be served) — and that almost every serious objection to it is really an objection to the second stage, not the first. So I keep the idealization and swap out the aggregation for something like a contractualist rejection test: I call the result *extrapolated non-rejectability*, or ENR. Roughly: aim at outcomes that no member of the idealized version of the affected population could reasonably reject, where the idealization is the same one CEV already uses and reasonable is meant to be read from each rejector's own standpoint rather than from an aggregate. I claim this (a) keeps the corrective bite, so I can still say no to preferences that only survive because of ignorance or adaptive deformation; (b) handles the many-people problem without quietly collapsing into utilitarianism; and (c) gets the right answer on the case I actually care about — a small religious or cultural minority whose practices probably wouldn't survive full-information idealization for most of its members, but where I want to say the system has to preserve their ability to say no rather than steer them toward whatever the majority's extrapolated will turns out to be. Fallback position if I get hammered: even if ENR is too indeterminate to serve as a maximizing target, it's still the right procedural constraint on how such a system should treat people while it remains uncertain. My supervisor thinks I should drop the AI framing entirely and pitch it as a paper about idealized preferences in general; I've ben going back and forth on that, and a friend who does ML research says the whole thing sounds unfalsifiable, which doesn't help.

  The room will be maybe fifteen people, and essentially none of them work on AI. Around half work on well-being, mostly inside the informed-desire / idealized-preference tradition: they like idealization in principle but are allergic to anything that smells like a substantive objective list, and they know the literature on adaptive preferences and on whether full information even has a determinate answer. Two are contractualists of the broadly Scanlonian kind, so they'll want to know what my rejection test adds to theirs and whether hypothetical agreement is doing any work at all. One person works on autonomy and authenticity, hierarchical Frankfurt-ish stuff, and will be suspicious of any view where a corrected preference gets to override what somebody actually endorses right now. Two are from the formal side — decision theory and social choice — who think the whole framing is hand-wavy and will want to know what the target even is as a mathematical object, whether it's well defined, whether it's even possible to aggregate or veto-rank anything here given the usual impossibility results; one of them has said out loud that this literature is utilitarianism with the serial numbers filed off. And there's one senior person who mostly does history of philosophy and will want to know whether I'm reinventing something that already has a name.

  What I want from you: the seven or eight objections I'll actually get from these particular people, in roughly the order they'll arrive, ordered by how much damage they'd do rather than by how likely they are. For each one, give it to me phrased the way that person would phrase it — the social choice person and the autonomy person should not sound anything alike — then a reply I could actually deliver in about two minutes, and then, most importantly, a note on where that reply is soft: what the sharp follow-up would be, and whether I'd have anything left to say. Tell me what I should concede in the first five minutes before anyone even asks, which single objection I should just fold on rather than fight, and what the question I'm hoping nobody asks is. My guess is it's something like: isn't your idealization just laundering a fairly specific liberal-individualist picture of a good life into a procedure that looks neutral? But if there's something worse than that, I'd rather find out now. And if you think one of the objections is strong enough that I should change the chapter before Thursday instead of answering it, say that outright and say what the change would be.
reasoning: |-
  Okay, let me start by understanding the user's request. They're a fourth-year PhD student in philosophy preparing for a work-in-progress seminar. They're presenting a chapter on what an advanced AI should aim for, proposing Extrapolated Non-Rejectability (ENR) as an alternative to Coherent Extrapolated Volition (CEV). They want a Q&A prep sheet focusing on potential objections from their specific audience.

  First, I need to break down the audience composition. There are several groups: well-being scholars (informed-desire tradition), Scanlonian contractualists, autonomy/Frankfurt scholars, formal decision/social choice theorists, and a historian of philosophy. Each has distinct concerns. The user wants objections ordered by potential damage, phrased in each person's style, with responses and weaknesses noted.

  Starting with the well-being group. Their main issue might be the indeterminacy of idealization. They'd argue that full information doesn't guarantee convergence, leading to instability in ENR. The response would be that ENR uses hypothetical veto rather than requiring full convergence. But the follow-up would question how veto works without convergence, which is weak. Conceding that idealization might not fully converge but that the veto still functions as a constraint could help.

  Next, the contractualists. They'd ask how ENR differs from Scanlon, especially since Scanlon avoids idealization. The response is that ENR's idealization addresses adaptive preferences, which Scanlon doesn't. But the follow-up would challenge why idealization is necessary if Scanlon's unrejected principles already handle it. This might require admitting that ENR targets a different problem—correcting preferences versus justifying principles.

  The autonomy scholar worries about overriding current endorsements. They'd argue that idealization undermines autonomy. Responding that ENR respects actual agents by allowing veto rights might help, but the follow-up could point out that the veto is based on idealized selves, not actual ones. This is a tough point; conceding that autonomy is complex but necessary for protection might be needed.

  The social choice theorists will attack mathematical viability. They'd cite Arrow’s theorem, questioning how ENR avoids aggregation problems. The response is that ENR uses veto, not aggregation, so Arrow doesn't apply. But the follow-up would note that veto systems have their own impossibility results. Here, the user should fold and shift to ENR as a constraint rather than a target.

  The formal decision theorist would criticize ENR as underspecified. They'd want a mathematical object, but ENR is procedural. The response is that it's a dynamic process. The weakness is that without formalization, it's not actionable for AI. Conceding this early and reframing as a constraint is crucial.

  The historian might link ENR to Kant or Rawls. The response should differentiate ENR by focusing on preference correction. The follow-up might not be damaging, so it's lower priority.

  The biggest threat is the "liberal laundering" objection—that idealization imposes a liberal individualist view. The response would deny imposing outcomes, but the follow-up argues the procedure itself is biased. This needs a nuanced answer about procedural neutrality, though it's hard to defend fully.

  Key concessions: admit ENR isn't a full target but a constraint; roll back to the fallback position early. The user should fold on the social choice objection regarding formal impossibilities. The worst unasked question is about indeterminacy making ENR useless for AI, which requires emphasizing its role in uncertainty.

  The user should change the chapter by dropping the AI framing to avoid unfalsifiability critiques and focus on normative ethics. Highlighting ENR as a procedural constraint rather than a maximization target can mitigate several objections. Preemptively addressing these points in the presentation will help manage the Q&A.
answer: |-
  Here’s a damage-ordered Q&A prep sheet tailored to your audience, objections phrased in-character, strategic replies, and vulnerability analysis. Target the **bolded concessions** early to defuse landmines.

  ---

  ### **Preemptive Concessions (First 5 Minutes)**
  1. **"ENR isn’t a complete *maximization target* like CEV aspires to be—it’s better understood as a *procedural constraint* on systems operating under normative uncertainty. If pressed, I retreat here."**  
  2. **"The idealization step *does* risk indeterminacy. I don’t assume full information yields unique preferences—only that it filters *unreasonable* ones (e.g., adaptive or manipulated desires)."**  
  3. **"This isn’t a formalizable aggregation function. If you demand a mathematical object, I lose. ENR is a deliberative framework, not a social choice rule."**  

  ---

  ### **Objections by Damage Order (High to Low)**
  #### **1. Formal Decision/Social Choice Theorist**  
  *Phrased as they would:*  
  > "You’ve replaced aggregation with veto, but you’re still in Sen’s 'liberal paradox' territory. A veto system *requires* interpersonal comparisons of 'reasonableness'—which you’ve defined subjectively. How is this *not* vulnerable to Arrow-style impossibilities? And what’s the actual output? A set? An ordering? If it’s not a utility function, how does your AI *act*?"  

  *Your reply (2 mins):*  
  "ENR sidesteps aggregation by not requiring a complete ordering. It’s a *satisfying* condition: outcomes pass if no idealized agent *rejects* them under their own standards. This isn’t a social welfare function—it’s a constraint on admissibility. Impossibility theorems apply to *ranking* mechanisms; veto systems avoid this by being non-totalizing. For AI, it functions as a safeguard: if an outcome is rejectable, it’s off the table."  

  *Where it’s soft:*  
  ➔ **Sharp follow-up:** "But *reasonable rejection* is still a comparison across agents! If I reject X from my idealized view and you accept it from yours, how do we resolve conflicts without aggregation? Your ‘constraint’ could be empty or inconsistent."  
  ➔ **Your fallback:** Concede ENR may yield indeterminacy ("no admissible outcomes") in conflict-heavy cases—this *is* the fallback position.  

  #### **2. Autonomy/Authenticity Scholar (Frankfurt camp)**  
  *Phrased as they would:*  
  > "You’re letting a *hypothetical*, idealized self override my actual, situated will. That’s paternalism dressed as progress. If I *endorse* my adaptive preference *now* (e.g., my religious practice), why does my ‘better’ self get to veto *my* current autonomy?"  

  *Your reply (2 mins):*  
  "The veto isn’t exercised *by* the idealized self *against* the actual self. It’s a test applied *externally*: would your idealized self *reasonably reject* this outcome? Crucially, *you* retain the right to reject outcomes that violate your *actual* core commitments—ENR protects minorities by ensuring their idealized selves can veto majority-imposed outcomes. It’s anti-paternalist: your actual self’s 'no' still blocks harm."  

  *Where it’s soft:*  
  ➔ **Sharp follow-up:** "But the 'reasonable' standard is judged from the idealized perspective! If my idealized self rejects my actual values (e.g., faith), haven’t you *already* privileged the 'corrected' view?"  
  ➔ **Your fallback:** "Yes—but only for *harm-avoidance*. ENR doesn’t force you to *pursue* idealized goals; it stops others from imposing harms your idealized self would protest."  

  #### **3. Well-Being Scholar (Informed-Desire Tradition)**  
  *Phrased as they would:*  
  > "If idealization under determinacy worries is shaky for *individual* well-being, why amplify it for groups? Your 'corrected preferences' could fragment or vanish under full information—making ENR vacuously permissive (if no idealized selves agree) or tyrannical (if they converge). How is this an improvement?"  

  *Your reply (2 mins):*  
  "ENR *uses* idealization only to *filter* preferences we *all* agree are corrupted (e.g., by oppression or ignorance). It doesn’t require convergence—just that *no one’s* idealized self can lodge a *reasonable* objection. Fragmentation? Then many outcomes survive! Tyranny? Only if all idealized selves *unanimously* reject an option—which is vanishingly rare. This handles adaptive preferences *without* assuming full-information unanimity."  

  *Where it’s soft:*  
  ➔ **Sharp follow-up:** "What if idealized selves *disagree* on what counts as 'reasonable'? If my idealized self rejects secularism as 'unreasonable,' while yours rejects my faith, haven’t you recreated the original aggregation problem?"  
  ➔ **Your fallback:** "Reasonable rejection must appeal to *shareable* reasons—Scanlon’s core move. Your faith-based rejection must cite grounds others could recognize *as reasons* (e.g., 'this destroys my community'), not private theology."  

  #### **4. Contractualist (Scanlonian)**  
  *Phrased as they would:*  
  > "Why add idealization to contractualism? Scanlon’s test already uses hypothetical agreement under *actual* reasons. Your 'idealized selves' layer on contentious metaphysical baggage. What does ENR *add* except confusion?"  

  *Your reply (2 mins):*  
  "Scanlon tests principles *everyone* can accept given their *actual* reasons. But what if their 'reasons' are distorted? ENR targets cases where agents *actually* endorse harmful preferences (e.g., caste systems). Idealization corrects for *epistemic* flaws so rejection reflects what they *would* see as reasonable, not what they *currently* do. It’s Scanlon-plus-epistemic-hygiene."  

  *Where it’s soft:*  
  ➔ **Sharp follow-up:** "But Scanlon’s test *already* excludes principles justified by false beliefs! If someone’s rejection relies on ignorance, we ignore it. Why idealize the *agent* rather than just scrub *reasons*?"  
  ➔ **Your fallback:** "Idealization handles *non-culpable* distortions (e.g., adaptive preferences) where agents *rationally* endorse flawed reasons. Scrubbing reasons alone won’t fix that."  

  #### **5. "You’re Reinventing X" (Historian of Philosophy)**  
  *Phrased as they would:*  
  > "This sounds like Habermas’ discourse ethics meets Rawls’ veil of ignorance—but messier. Or a less rigorous version of Harsanyi’s impartial observer. Are you just rebranding?"  

  *Your reply (2 mins):*  
  "Rawls idealizes *reasoning* but not *preferences*; Habermas requires actual discourse. ENR idealizes *preferences* but keeps rejection anchored to individual standpoints. Harsanyi aggregates utilities; ENR rejects aggregation entirely. It’s closest to Scanlon-plus-preference-repair—a niche *not* filled."  

  *Where it’s soft:*  
  ➔ **Follow-up:** "But the 'individual standpoint' idealization *is* Harsanyi’s."  
  ➔ **Your fallback:** "Harsanyi assumes cardinal utilities and maximizes expected utility. ENR rejects both. This is veto-based, not optimizing."  

  ---

  ### **Strategic Fold: Concede This**  
  **Fold on the social choice objection** ("ENR can’t be formalized as a function"). Your answer *is* "It’s not meant to be—it’s a constraint." Fighting further wastes time and highlights weakness.  

  ---

  ### **The "Pray Nobody Asks" Question**  
  > **"Isn't ENR just a circular way to smuggle in *your* liberal ideal? Your 'reasonable rejection' assumes agents value autonomy, equality, etc. If my idealized self rejects gender equality (citing 'natural law'), you'll call it 'unreasonable'—so your procedure *is* substantive."**  

  *Why it’s deadly:* Strikes at ENR’s neutrality. If "reasonable" encodes liberal values, minorities lose protection.  

  *Your best reply:*  
  "'Reasonable' is indexed to the rejector’s idealized *own* values. If your idealized self rejects equality *based solely on your comprehensive doctrine* (e.g., theology), that’s admissible. But if your rejection *harms others* (e.g., denies their autonomy), their idealized selves can veto it. ENR isn’t neutral about *harm*—but that’s a minimal, not thickly liberal, commitment."  

  *Vulnerability:*  
  ➔ **Follow-up:** "But 'harm' is contested! If I’m a paternalist, stopping me from 'saving' others *is* harm. You’ve baked in anti-paternalism."  
  ➔ **Damage control:** "ENR accepts *some* thin normative premises (e.g., 'unwanted override is harm'). Without *any* premises, no theory works. But it doesn’t presume liberal *ends*—only that individuals get a say."  

  ---

  ### **Critical Change Before Thursday**  
  **Drop the AI framing** (as your supervisor advised). Your ML friend is right: it makes ENR seem like an *engineering proposal*, inviting "unfalsifiable" and "underspecified" critiques. Reframe as:  
  > *"A contractualist account of *when idealized preferences matter morally*—with applications to AI governance."*  

  *Why:* The audience’s objections (indeterminacy, paternalism, formalism) are *philosophical*. AI framing distracts into "how would this even run?"—a war you can’t win.  

  ---

  ### **Summary: Damage Control Playbook**  
  - **Open** with concessions: ENR is a constraint, not a target; idealization filters, not converges.  
  - **Fold** on formalizability—don’t fight social choice math.  
  - **Pivot** to minority-protection examples when pressed.  
  - **End** by retreating to the fallback: "Even as a constraint, ENR avoids CEV’s aggregation hazards."  
  - **Delete AI** from slides/title. Say "normative framework for systems" if pressed.  

  You’re overprepared. Now rehearse replies *aloud*—it’s 80% delivery. Good luck!
