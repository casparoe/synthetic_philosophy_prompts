prompt: |-
  Construct a single-paragraph case, set in an ordinary professional context, in which three accounts of knowledge each yield a different combination of verdicts on two questions — and in which the divergence falls out of the accounts rather than being written into the story.

  The accounts. Use these versions.

  1. Attributor contextualism. The truth conditions of ascriptions of knowledge shift with the ascriber's context: how much rides on the inquiry the ascriber is engaged in, and which error possibilities are salient there. Nothing about the subject's own situation fixes the standard independently of the ascriber's context. On the version I want, the practical question — whether the subject may treat the proposition as a reason for acting without checking further — is settled by whether the ascription comes out true in the subject's own deliberative context.

  2. Interest-relative invariantism (pragmatic encroachment). The standard is invariant across ascribers but shifts with what is practically at stake for the subject: the cost of being wrong, the cost of delay or further checking, the importance of acting now. The stakes are the subject's actual situation, whether or not she recognizes it. Knowledge in this sense is exactly what is needed for the proposition to be usable as a premise in practical reasoning, so the two questions move together.

  3. Transparency-conditioned encroachment — a view I am stipulating here rather than reporting, because I want to see what it commits us to. As in (2), the standard is invariant across ascribers and sensitive to practical stakes; but encroachment is triggered only by stakes the subject has in view at the time of acting. Real stakes of which she is unaware do not raise the bar, even if others know about them and even if they are enormous. The two questions move together here as well.

  The two questions, asked about the same subject, the same proposition and the same evidence. Q1: as a third party — call her the assessor — asks it, in the context the case specifies: is it true that the subject knows? Q2: may the subject act on the proposition without checking further?

  The pattern I want: contextualism, no to Q1 and yes to Q2; interest-relative invariantism, no to both; transparency-conditioned encroachment, yes to both.

  Constraints on the scenario.

  - One paragraph, at most about 150 words, realistic, no science-fictional or contrived machinery.
  - Set it somewhere with institutional texture — a hospital laboratory, a structural inspection, a food-safety line, an election canvass, a wildfire dispatch desk — and not in the familiar register of banks, airports, tickets and missed flights.
  - The subject's evidence must be strong enough, and of the right kind, that if the stakes were trivial and the assessor's context relaxed, all three accounts would return a positive verdict. Describe the evidence by what she did and by the known error rates of her procedures — not by calling it justified, reasonable or solid.
  - Her ignorance of the real stakes must be non-culpable and realistic: the information exists somewhere she had no duty to look, or a downstream use of her result was never mentioned to her, or a change was made by another unit. No conspiracies, no one deceiving her on purpose.
  - Further checking must be possible but genuinely costly, and it must be pointless as she sees things while cheap relative to the stakes as they actually are. Build this into the story rather than asserting it.
  - Nobody in the story says that they know, or that she does not; nothing is settled by what anyone would be inclined to say.
  - Hold fixed across all three evaluations: the proposition, the evidence, the cost of error, the cost of checking. The only variables are who is aware of the stakes and what is salient in the assessor's context.

  What to hand back.

  1. The paragraph.
  2. A short table of the held-fixed parameters, including the distribution of awareness and the features of the assessor's context.
  3. For each of the three accounts: the verdicts on Q1 and Q2, with the reasoning traced explicitly to that account's commitments, and a statement of which feature of the case the account keys on.
  4. Which single feature does the work. Show this by removing it in two directions: first, let the subject be told what is actually at stake; second, let the assessor's context be one in which nothing hangs on the question and the error possibility has not been raised. Say which rows collapse into which, and why this shows the feature is load-bearing rather than decorative.
  5. The strongest attack available to a defender of whichever account comes off worst in your case, and briefly why it is the strongest rather than merely the first one that occurred to you.

  Why I want it: I am building a seminar session on whether contextualism and pragmatic encroachment are genuine rivals or two descriptions of the same pattern. The familiar cases cannot separate them, because in those cases the ascriber's context and the subject's stakes move together and every account returns the same verdict. A case that works by stipulating the verdicts, or by pressing the reader's untutored feel for the word, is of no use to me: I want the verdicts derived from the commitments above, with the pressure points visible.
reasoning: |-
  We are constructing a case in an institutional setting with ordinary professionals. The key is to have a scenario where the subject has good evidence for a proposition, but there are high stakes that she is unaware of. The assessor, however, is in a context where the high stakes are salient. The subject's evidence must be strong enough that in low stakes, she would know. Further checking is possible but costly and, from her perspective, pointless because she doesn't see the high stakes.

  Setting: A hospital laboratory. The subject (let's call her Dr. Lee) is a medical lab technician. The proposition is: "The patient's blood culture is negative for bacterial infection." 

  Evidence: Dr. Lee followed standard protocol: she used an automated system with a known false negative rate of 0.1% and visually confirmed the result with a senior technician, a procedure that catches 99.9% of the errors. The error rates are low enough that in a routine case, this would be considered conclusive.

  Stakes: Normally, a negative result would lead to discontinuing antibiotics. However, unbeknownst to Dr. Lee, this patient is part of a high-risk group for a rare but deadly bacterial strain that the automated system might miss (though the visual check should catch it). The hospital administration, due to a recent outbreak, has flagged this patient's sample for extra caution. The cost of a false negative is extremely high: the patient could die. The cost of further checking (e.g., a more expensive and time-consuming molecular test) is high in terms of resources and delay, but it is trivial compared to the risk of death.

  The subject's perspective: Dr. Lee has no reason to suspect anything unusual. She sees the test as routine and the evidence as strong. Further checking would require hours of work and expensive reagents, and she sees no reason to do it because the result is clear.

  The assessor's context: The assessor is a hospital administrator (Mr. Smith) who is reviewing cases in light of the recent outbreak. In his context, the possibility of a false negative in high-risk patients is highly salient, and the stakes (patient death) are very high.

  Fixed parameters:

  Proposition: The patient's blood culture is negative for bacterial infection.

  Evidence: Automated test (false negative rate 0.1%) plus visual confirmation by a senior technician (which catches 99.9% of the errors that the automated system might miss). The combined error rate is extremely low (about 0.0001%).

  Cost of error (actual): Death of the patient (high stakes).

  Cost of checking: High in terms of resources and time (several hours and expensive reagents). But from Dr. Lee's perspective, the cost is unjustified because she doesn't see the high stakes.

  Awareness: Dr. Lee is unaware of the high stakes (the patient being high-risk and the outbreak). The hospital administration (including the assessor) is aware.

  Assessor's context: The assessor (Mr. Smith) is in a context where the high stakes (patient death) and the specific error possibility (false negative in high-risk patients) are salient.

  Now, the paragraph:

  In the hospital laboratory, Dr. Lee completed the standard blood culture analysis for a patient, using the automated system and then a visual confirmation by a senior technician, procedures which together have an error rate of only one in ten thousand. Confident that the result was negative for bacterial infection, she prepared to report it, seeing no need for the costly and time-consuming molecular test. Unbeknownst to her, however, the patient was in a high-risk group for a rare bacterial strain, and due to a recent outbreak, the hospital administration had flagged this case for extra caution. Mr. Smith, the administrator reviewing the case, was acutely aware of the outbreak and the life-threatening consequences of a false negative.

  Now, the table of fixed parameters:

  | Parameter | Value |
  |----------|-------|
  | Proposition | The patient's blood culture is negative for bacterial infection. |
  | Evidence | Automated test (false negative rate 0.1%) plus visual confirmation (catches 99.9% of errors from automated test). Combined error rate ~0.0001%. |
  | Actual cost of error | Patient death (extremely high) |
  | Cost of further checking | High: several hours and expensive reagents |
  | Subject's awareness of stakes | Unaware (non-culpably: the high-risk status and outbreak were not communicated to the lab) |
  | Assessor's context | High stakes and error possibility salient (due to outbreak and high-risk patient) |

  Now, for each account:

  1. **Attributor contextualism**:
     - Q1 (assessor's context): The assessor (Mr. Smith) is in a context where the stakes are high (patient death) and the error possibility (false negative in high-risk patients) is salient. Therefore, the standard for knowledge is very high. Given that the error rate, though very low, is not zero, the assessor will say that Dr. Lee does not know (Q1: no).
     - Q2: The standard for the subject's own deliberative context is fixed by her context. In her context, the stakes are low (she is unaware of the high stakes) and the error possibility is not salient. Therefore, the standard is lower, and her evidence meets that standard. Hence, she may act without checking (Q2: yes).
     - Key feature: The shift in truth conditions of knowledge ascriptions depending on the ascriber's context (here, the assessor's high-stakes context vs. the subject's low-stakes context).

  2. **Interest-relative invariantism (IRI)**:
     - The standard is invariant across ascribers but shifts with the subject's actual practical stakes. The actual stakes are very high (patient death). Therefore, the standard for knowledge is very high. The evidence, though strong, does not meet this high standard (because the error rate, though low, is still present and the cost of error is catastrophic). Hence, Dr. Lee does not know (Q1: no). And since knowledge is what is needed to act, she may not act without checking (Q2: no).
     - Key feature: The subject's actual stakes (which are high) raise the standard for knowledge, regardless of her awareness.

  3. **Transparency-conditioned encroachment**:
     - The standard is invariant across ascribers and sensitive to stakes, but only those the subject has in view. Dr. Lee is unaware of the high stakes. Therefore, the standard for knowledge is not raised by the actual high stakes. Her evidence is strong enough for the stakes as she sees them (which are low). Hence, she knows (Q1: yes, because the standard is not raised) and she may act without checking (Q2: yes).
     - Key feature: Only stakes that the subject is aware of matter for raising the standard.

  Now, the pattern:

  - Contextualism: Q1 no, Q2 yes.
  - IRI: Q1 no, Q2 no.
  - Transparency: Q1 yes, Q2 yes.

  Which single feature does the work? The divergence in awareness: the subject is unaware of the high stakes that the assessor is aware of and that are actually present.

  To show this is load-bearing:

  1. Remove the subject's ignorance: Suppose Dr. Lee is told about the high-risk patient and the outbreak. Now, in her own deliberative context, the stakes are high and the error possibility is salient. Then:
     - Contextualism: Q2 would become no (because in her context the standard is high, so she may not act without checking).
     - IRI: Already Q2 is no (and remains no) because the stakes are high.
     - Transparency: Q2 would become no (because now she is aware of the high stakes, so the standard is raised and she does not know, hence may not act). 
     - Now, the divergence collapses: All three would say no to Q2 (and Q1 would also be no for contextualism and IRI, and no for transparency because she is now aware). But note: in transparency, if she becomes aware, then she doesn't know and Q2 is no. In IRI, it's already no. In contextualism, Q1 would still be no (because the assessor's context is high) but Q2 becomes no.

     Without the subject's ignorance, the pattern breaks because transparency and IRI both become no to both, and contextualism becomes no to both? Not exactly: in contextualism, Q1 is still in the assessor's context (high) so no, and Q2 (subject's context) becomes high stakes so no. So all three become no to both.

  2. Change the assessor's context: Suppose the assessor is in a low-stakes context (e.g., a routine review with no outbreak concerns). Then:
     - Contextualism: Q1 would become yes (because the standard is low). Q2 remains yes (subject's context is low). So contextualism becomes yes to both.
     - IRI: Q1 remains no (because the subject's actual stakes are high) and Q2 remains no. So no to both.
     - Transparency: Q1 remains yes (because the subject is unaware, so standard is low) and Q2 remains yes. So yes to both.

     Then we have:
       - Contextualism: yes, yes
       - IRI: no, no
       - Transparency: yes, yes

     Now the divergence between IRI and the others remains, but the pattern we had (three different combinations) is broken.

  However, the key feature we identified (the subject's unawareness of high stakes) is indeed central because when we remove it, the pattern collapses (all become no to both in the first variation). And when we change the assessor's context, the pattern also changes (but note that the pattern we are after is the one we set: contextualism no/yes, IRI no/no, transparency yes/yes). The unawareness is necessary for the subject to be in a low-stakes context (for contextualism and transparency) while the actual stakes are high (for IRI).

  The strongest attack for the account that comes off worst: IRI comes off worst in the sense that it denies the subject the ability to act (Q2 no) even though she has strong evidence and is unaware of the high stakes. A defender of IRI might argue:

  Attack: The subject's evidence is not strong enough even for the high stakes? But we fixed the evidence to be strong enough for low stakes. The IRI defender might argue that the evidence is in fact strong enough for the high stakes because the error rate is extremely low (0.0001%) and the cost of further checking is high. However, the cost of error (death) is so high that even a 0.0001% chance might be too risky. But the IRI defender could also question whether the error rate is really that low, or whether the subject has taken into account all relevant possibilities. However, the case stipulates that the evidence is strong enough for low stakes, so in the high-stakes context, IRI says it's not strong enough.

  A better attack: The IRI defender might argue that the subject does have a duty to check for high-stakes situations even if she is unaware? But the constraint says her ignorance is non-culpable. Alternatively, the IRI defender might challenge the idea that the subject can act without checking. They might say: even if the subject is unaware of the stakes, the actual stakes are such that she should not act without checking. But that is exactly what IRI says. The problem is that it seems harsh to say she should not act when she has no reason to suspect the high stakes.

  The strongest attack might be to challenge the coherence of the transparency view. The IRI defender could argue that what matters for practical reasoning is the actual stakes, not the perceived stakes. If the subject acts on a false belief, the consequences are the actual ones, so the standard for knowledge should be set by the actual stakes. Therefore, IRI is correct in denying that the subject knows and that she may act. The transparency view, by allowing her to act, is putting the patient at risk unnecessarily.

  But note: the transparency view says that the subject may act because she doesn't know about the risk. The IRI defender might say: but that doesn't change the fact that the risk is real. So the attack is that transparency is irresponsible.

  However, the case is set up so that the subject's ignorance is non-culpable. Therefore, the transparency view might be defended on the grounds that it is not the subject's fault and she is acting reasonably given what she knows.

  But the IRI defender might press: the concept of knowledge is tied to the actual practical environment, not the subject's perspective. Therefore, the subject does not know and should not act. The strongest attack is that the transparency view severs the link between knowledge and practical reasoning in a way that can lead to disastrous consequences. And that is exactly what happens in the case: the patient might die because the subject acted without checking. So IRI is the only account that correctly reflects the gravity of the situation.

  Thus, the strongest attack is that the transparency view (and to some extent contextualism) is practically irresponsible in high-stakes situations that the subject is unaware of, and that knowledge must be factive and sensitive to the actual practical environment for it to play its role in guiding action.

  Therefore, we have:

  **The paragraph:**

  In the hospital laboratory, Dr. Lee completed the standard blood culture analysis for a patient, using the automated system and then a visual confirmation by a senior technician, procedures which together have an error rate of only one in ten thousand. Confident that the result was negative for bacterial infection, she prepared to report it, seeing no need for the costly and time-consuming molecular test. Unbeknownst to her, however, the patient was in a high-risk group for a rare bacterial strain, and due to a recent outbreak, the hospital administration had flagged this case for extra caution. Mr. Smith, the administrator reviewing the case, was acutely aware of the outbreak and the life-threatening consequences of a false negative.

  **Table of fixed parameters:**

  | Parameter | Value |
  |----------|-------|
  | Proposition | The patient's blood culture is negative for bacterial infection. |
  | Evidence | Combined error rate of 0.0001% (automated test with 0.1% false negative rate plus visual confirmation catching 99.9% of errors) |
  | Actual cost of error | Patient death (extremely high) |
  | Cost of further checking | High: several hours and expensive reagents |
  | Subject's awareness of stakes | Unaware (non-culpably: not informed of high-risk status or outbreak) |
  | Assessor's context | High stakes (patient death) and error possibility (false negative in high-risk patients) salient |

  **Verdicts and reasoning:**

  1. Attributor contextualism:
     - Q1 (assessor): No, because the assessor's context has high stakes and salient error possibilities, raising the standard beyond the evidence.
     - Q2: Yes, because in the subject's deliberative context (low stakes, no salient error possibilities), the standard is met, so she may act without checking.
     - Key feature: The shift in truth conditions with the ascriber's context.

  2. Interest-relative invariantism:
     - Q1: No, because the subject's actual stakes are high, raising the standard beyond the evidence.
     - Q2: No, because without knowledge (due to high stakes), she may not use the proposition as a premise in practical reasoning.
     - Key feature: The subject's actual high stakes.

  3. Transparency-conditioned encroachment:
     - Q1: Yes, because the subject is unaware of the high stakes, so the standard is not raised; the evidence suffices for low stakes.
     - Q2: Yes, because she knows (by the low standard) and thus may act without checking.
     - Key feature: Only stakes in the subject's awareness matter.

  **Load-bearing feature: Subject's unawareness of high stakes.**

  - If the subject is told (awareness removed): 
     - Contextualism: Q2 becomes no (subject's context becomes high stakes).
     - IRI: Q2 remains no.
     - Transparency: Q2 becomes no (because now aware, standard raised, so no knowledge and may not act).
     - Then all three have Q2 as no (and Q1 for contextualism and IRI remain no, transparency Q1 becomes no). The pattern collapses to no/no for all? Not exactly: contextualism Q1 is still from the assessor's context (high) so no, and Q2 becomes no. IRI: no/no. Transparency: now no/no. So all become no/no.

  - If the assessor's context is low stakes (e.g., routine review, no outbreak concerns):
     - Contextualism: Q1 becomes yes (low standard met) and Q2 remains yes (subject's context low) -> yes/yes.
     - IRI: Q1 remains no (subject's actual stakes high) and Q2 remains no -> no/no.
     - Transparency: Q1 remains yes (subject unaware, so low standard) and Q2 remains yes -> yes/yes.
     - Pattern changes: contextualism and transparency yes/yes, IRI no/no.

  Thus, the subject's unawareness is crucial for the original pattern.

  **Strongest attack for the worst-off account (IRI):**

  The account that comes off worst might be IRI because it denies the subject the ability to act without checking even though she has done her job correctly and is non-culpably ignorant. The strongest attack from an IRI defender would be that the transparency view (and contextualism to some extent) is practically dangerous: it licenses acting in ignorance of high stakes, which can lead to catastrophic consequences. Knowledge must be factive and must be sensitive to the actual practical environment to be a reliable guide for action. In high-stakes situations, even non-culpable ignorance does not absolve one of the need for more evidence. Therefore, IRI correctly reflects the normative demands of practical reasoning, and the other views are too permissive.

  This attack is strong because it targets the core motivation for IRI: the idea that knowledge is the norm of practical reasoning and must be robust enough for the actual stakes. It also highlights a real-world consequence that the other views might overlook: the patient could die if the subject acts without checking.
