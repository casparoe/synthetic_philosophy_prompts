  **The Paragraph**  
  At the wildfire dispatch desk, meteorologist Ava analyzed satellite data and ground-sensor readings, confirming wind speeds were below 15 mph—a conclusion with a 0.05% error rate given her dual-source methodology. She prepared to authorize controlled burns, deeming further drone verification unnecessary due to the routine conditions. Unknown to her, however, a municipal water-supply pipeline had just been rerouted near the burn zone; its rupture would contaminate reservoirs serving 100,000 people. Dispatch supervisor Ben, reviewing her decision amid the pipeline-alert bulletins, fixated on this catastrophic risk.  

  **Table of Fixed Parameters**  
  | Parameter | Value |  
  |-----------|-------|  
  | Proposition | Wind speeds are below 15 mph. |  
  | Evidence | Satellite data + ground sensors; error rate 0.05% via cross-verification. |  
  | Actual cost of error | Catastrophic (water contamination for 100,000 people). |  
  | Cost of further checking | High: 3-hour drone deployment delaying critical fire containment. |  
  | Subject’s awareness of stakes | Unaware (pipeline reroute was unannounced; no duty to monitor civil engineering logs). |  
  | Assessor’s context | High stakes salient (pipeline risk); error possibility (sensor miscalibration) explicitly raised in bulletins. |  

  **Verdicts and Reasoning**  
  1. **Attributor Contextualism**  
     - **Q1 (Assessor: Ben)**: **No**. Ben’s context makes stakes (contamination) and error possibility (miscalibration) salient, raising the standard beyond Ava’s evidence.  
     - **Q2 (Subject: Ava)**: **Yes**. Ava’s deliberative context lacks salient stakes/errors; her evidence meets the lower standard, permitting action without checking.  
     - *Keys on*: Ascriber (Ben)’s context dictating truth conditions.  

  2. **Interest-Relative Invariantism**  
     - **Q1**: **No**. Invariant standard is set by *actual* stakes (catastrophic contamination), which Ava’s evidence cannot meet despite low error rates.  
     - **Q2**: **No**. Knowledge is necessary for action; absent knowledge due to high stakes, Ava may not act without checking.  
     - *Keys on*: Subject’s actual (unknown) stakes elevating the epistemic standard.  

  3. **Transparency-Conditioned Encroachment**  
     - **Q1**: **Yes**. Encroachment requires *subject-aware* stakes; Ava’s ignorance keeps the standard low, so her evidence suffices for knowledge.  
     - **Q2**: **Yes**. Knowledge (under low standard) licenses action without checking.  
     - *Keys on*: Stakes only encroach if transparent to the subject.  

  **Load-Bearing Feature: Subject’s Unawareness of Stakes**  
  - **Remove unawareness (Ava learns of pipeline)**:  
    - Contextualism: Q2 → **No** (Ava’s context now high-stakes).  
    - IRI: Q1/Q2 remain **No** (stakes unchanged).  
    - Transparency: Q1/Q2 → **No** (awareness triggers encroachment).  
    - *Collapse*: All converge on Q2=No, eliminating divergence.  
  - **Assessor’s context relaxed (Ben ignores pipeline)**:  
    - Contextualism: Q1 → **Yes** (low-stakes context).  
    - IRI: Q1/Q2 remain **No** (actual stakes unchanged).  
    - Transparency: Q1/Q2 remain **Yes** (unawareness keeps standard low).  
    - *Collapse*: Contextualism and transparency align (Yes/Yes), contrasting IRI (No/No).  
  The feature is load-bearing because its removal/alteration collapses the three-way divergence, proving it drives the verdicts via each account’s unique stakes-sensitivity.  

  **Strongest Attack for IRI (Worst Off in Case)**  
  IRI faces intuitive friction by denying Ava (Q2) the right to act despite non-culpable ignorance and strong evidence. The strongest counterattack: **IRI defenders can reject “cost of checking” as a fixed parameter**, arguing that prohibitive checking costs *lower* the stakes for the subject by making delay irrational, thus preventing standard elevation. Here, drone deployment’s high cost (3-hour delay) could render checking *practically prohibitive* for Ava, reducing her stakes below the threshold for encroachment. This leverages IRI’s core commitment that stakes incorporate tradeoffs (error cost vs. checking cost), making it stronger than ad hoc appeals to culpability because it uses IRI’s own machinery to flip Q2 to Yes without altering other parameters.
