prompt: |-
  I work in philosophy of science and have started reading the literature on grounding and fundamentality, where I keep tripping over a pattern I have no name for. The pattern is this: someone argues that the F-facts obtain in virtue of the G-facts, and then treats that result as licensing a demotion of the F-facts — they are nothing over and above the G-facts, so they need no separate place in the inventory of the world. But the claim that does the demoting does not seem to be statable in G-vocabulary alone. To say which G-facts ground a given F-fact, you have to pick those G-facts out as the realizers of the very item that was supposed to be demoted. Two cases push me the same way. The claim that a pain is grounded in microphysical facts: the microphysical facts in question have to be identified as pain's realizers, and the candidates are scattered and open-ended. The claim that moral facts are grounded in natural facts: the natural grounds of a specific moral fact seem to be identifiable only by appeal to the whole body of ordinary moral truisms, with no shorter naturalistic specification available. In both cases the ground is presented as the self-sufficient item and the grounded item as the dependent one, yet the dependence claim appears to lean on the dependent item in order to get stated at all.

  I do not want a label. I want the carving. Is this one phenomenon or several? Is it a problem about specification, about vocabulary, or about what the relata of the grounding relation are taken to be? Does it arise for every grounding claim, or only for cross-level ones, or only where the lower level cannot supply the predicates needed to isolate its own work? What are the nearest named phenomena, and how does this differ from each — I have had bridge laws, supervenience, realization, and the nothing-over-and-above slogan suggested to me, and none seems to be quite it. And if the fundamental story can only be told using the vocabulary of the derivative level, in what sense is that level not fundamental? If there is no established concept here, give me one: a name, a definition, a case that falls under it, and a similar-looking case that does not.
reasoning: |-
  Okay, the user is working in philosophy of science and is grappling with a specific issue in the literature on grounding and fundamentality. They've noticed a pattern where grounding claims seem to depend on the very thing they're trying to demote. For example, when arguing that pain is grounded in microphysical facts, those facts have to be identified as the realizers of pain, which already references the pain itself. Similarly, moral facts grounded in natural facts require moral vocabulary to specify which natural facts are relevant. 

  The user doesn't just want a label; they want a deep analysis. They're asking whether this is one phenomenon or several, what exactly the problem is (specification, vocabulary, relata), and how it relates to existing concepts like bridge laws or supervenience. They also want to know if this happens in all grounding claims or only certain types, and whether it undermines the fundamentality of the "lower" level.

  Hmm. The core tension is that grounding aims to reduce F to G, but describing the G-grounds requires F-vocabulary. This creates a loop where F seems indispensable even in the account meant to replace it. The user is likely looking for conceptual clarity to advance their research, possibly to critique certain reductionist programs or refine grounding theory itself.

  Breaking it down: First, is this one phenomenon? Probably yes, with variations. The pain case involves disjunctive realization (many microphysical configurations realizing one pain type), while the moral case involves holistic specification (many natural facts forming a pattern that constitutes a moral fact). Both share the need for F-vocabulary to "pick out" the relevant G-facts, but the mechanisms differ. 

  On relata: The issue arises when grounding relata are facts/states described at different levels of abstraction. If grounding were between purely G-theoretic relata (e.g., "C-fiber firing" instead of "pain's realizer"), it might avoid this—but that's often impossible for heterogeneous reductions. 

  Vocabulary vs. specification: It's both. The G-level lacks expressive resources to isolate the relevant patterns without F-predicates. This isn't just epistemic; it might reflect that the G-facts only ground F-facts collectively under an F-description. 

  Does it always happen? Likely no—only when F is multiply realizable or context-sensitive. Type-identity theories (e.g., "pain = C-fiber firing") wouldn't have this problem, but they're empirically implausible for most cases. 

  Nearest concepts: 
  - Bridge laws (Hempel): They connect theories but presuppose F-terms. 
  - Supervenience: Describes covariance but doesn't explain why or how, sidestepping the specification issue. 
  - Realization: Explicitly references the realized property, so it's circular by design. 
  - "Nothing over and above": A slogan that ignores the descriptive dependence. 

  Fundamentality paradox: If F-vocabulary is needed to state the complete fundamental story, is G really fundamental? This suggests fundamentality is relative to descriptive resources. Maybe "fundamental" means ontologically basic, not descriptively self-sufficient. 

  New concept proposal: "Descriptive entanglement." Define it as: A grounding claim where specifying the ground for an F-fact requires essential reference to F or F-associated concepts. Case: pain realization. Non-case: temperature reduced to mean kinetic energy (no "temperature" needed to specify the motions). 

  Key distinction: Unlike realization (which expects F-reference), descriptive entanglement highlights a problem for reductionist ambitions. Unlike Hempel's dilemma, it’s about how we pick out the grounds, not the status of the reducing theory. 

  For the user: This framework might help them argue that certain "successful" groundings still leave F indispensable for discourse, complicating eliminativism. The name "entanglement" captures the mutual dependence—G grounds F, but describing G's role needs F.
answer: |-
  Your observation cuts to the heart of a genuine tension in grounding-based metaphysics. This isn't a single, neatly named phenomenon, but a **cluster of interrelated problems arising from the interaction between ontological dependence and descriptive resources**. Let's carve it at the joints:

  1.  **Core Problem:** **Descriptive Entanglement in Grounding Specification (DEGS)**
      *   **Definition:** The phenomenon where identifying *which specific facts* at the putative fundamental level (G-level) ground a particular fact at the derivative level (F-level) *necessarily requires* using vocabulary or concepts that belong to, or are semantically tied to, the F-level itself.
      *   **Core Tension:** The grounding relation is presented as making F ontologically derivative and dispensable, yet the *statement* of *which specific G-facts ground a given F-fact* relies indispensably on F-vocabulary/concepts to pick out the relevant G-facts. This suggests a descriptive dependence of the fundamental account on the derivative level.
      *   **Your Cases Exemplify DEGS:**
          *   **Pain:** To specify the microphysical ground *of this pain*, you must identify the microphysical state *as realizing pain*. You cannot isolate the relevant microphysical facts *as pain-grounding* without referencing the concept of pain itself or its functional/nomological role (which is F-level).
          *   **Morality:** To specify the naturalistic ground *of this wrongness*, you must appeal to the network of natural facts *as satisfying the conditions for wrongness* defined by moral principles/truisms. There's no purely naturalistic description that picks out *just those* natural facts *as grounding this wrongness* without implicitly or explicitly invoking the moral concept.

  2.  **Is it One Phenomenon or Several?**
      *   **One Underlying Structure, Multiple Manifestations:** DEGS is fundamentally one *type of problem* arising in grounding claims. However, it manifests differently based on *why* the G-level struggles to isolate the relevant facts:
          *   **Multiple Realizability (Pain Case):** The F-type is realized by a vast, disjunctive, or open-ended set of G-configurations. Only the F-concept unifies them *as grounds for that F-type*. The G-level facts are "scattered" without F.
          *   **Holistic/Pattern-Based Grounding (Moral Case):** The F-fact is grounded not in a single G-fact, but in a complex pattern or constellation of G-facts whose relevance *as grounding this F-fact* is determined by the holistic structure of the F-domain (e.g., the body of moral truisms). The pattern is only identifiable *as the ground* via the F-lens.
          *   **Context-Sensitivity:** The relevant G-grounds for an F-fact might depend on context only captured at the F-level.
      *   **Common Root:** In all manifestations, the G-vocabulary lacks the expressive resources to *specify the relevant G-facts qua grounds for a specific F-fact* without semantic ascent to F-concepts. The G-facts are only "grounding facts" *relative to* the F-role they play.

  3.  **What is the Problem About?**
      *   **Primarily about Specification and Vocabulary:** DEGS highlights a gap between ontological dependence and descriptive autonomy. While the F-fact may ontologically depend on the G-facts, the G-story cannot *self-sufficiently specify* its own grounding work *for specific F-facts* without borrowing from F.
      *   **Secondarily about Relata:** DEGS arises because grounding relata are typically *facts* or *states of affairs*, which are individuated by their content (propositionally expressed). The content of the grounded F-fact ("that S is in pain", "that act A is wrong") is essential to identifying *which* G-facts ground *it*. The grounding relation isn't just between G-stuff and F-stuff; it's between specific G-facts *as grounding this specific F-fact content*.
      *   **Not Necessarily About Cross-Levelness Per Se:** DEGS arises most saliently in cross-level cases (micro/macro, non-normative/normative) because these often involve distinct vocabularies and the phenomena listed above (multiple realizability, holism). However, it *could* arise within a level if distinct descriptive schemes exist. It does *not* arise for grounding claims where the G-facts can be specified *as grounding this F-fact* using purely G-vocabulary (e.g., "The fact that H₂O molecules are arranged in lattice structure X grounds the fact that *this stuff is solid ice*" – "solid ice" might be considered a physical description).

  4.  **Relation to Named Phenomena:**
      *   **Bridge Laws (Hempel):** Similar tension. Bridge laws (`F ↔ G`) are needed to connect reduced (F) and reducing (G) theories, but they presuppose F-vocabulary. DEGS is the *problem* this creates for grounding claims aiming for F's dispensability, whereas bridge laws are a proposed (problematic) *solution* within reductionism. DEGS highlights *why* bridge laws feel necessary and problematic.
      *   **Supervenience:** Describes covariance (no F-change without G-change) but is silent on *dependence direction* and crucially, *silent on specification*. DEGS arises when trying to move beyond mere covariance to *explain* the dependence (via grounding). Supervenience doesn't face DEGS because it doesn't attempt to specify *which* G-facts ground *which* F-facts.
      *   **Realization:** Often explicitly *includes* reference to the realized property/state in its definition (e.g., a state realizes pain *if* it plays the pain role). Realization *expects* F-reference and doesn't aim for F's descriptive dispensability. DEGS is the problem that arises when grounding theorists *use* realization (or similar concepts) in grounding claims *while also* wanting to demote F descriptively. Realization is a framework that *accommodates* DEGS; grounding ambitions sometimes *clash* with it.
      *   **"Nothing Over and Above":** This is the *slogan* that DEGS problematizes. DEGS shows that achieving ontological "nothing over and above" doesn't automatically grant descriptive self-sufficiency to the fundamental level. The slogan ignores the descriptive entanglement.

  5.  **The Fundamentality Question:**
      This is the profound consequence. DEGS suggests:
      *   **Descriptive Fundamentality ≠ Ontological Fundamentality:** The G-level might be ontologically fundamental (the ultimate "stuff"), but it may not be *descriptively* fundamental. The *complete* and *explanatorily adequate* description of the world, *including why specific G-configurations give rise to specific F-facts*, requires resources from the F-level. The fundamental story isn't self-contained.
      *   **Fundamentality is Perspectival/Descriptively Relative:** What counts as a fundamental description might depend on the descriptive resources we bring. A purely G-description might capture all the "stuff," but it fails to capture the *patterns*, *roles*, and *significance* that make that stuff constitute the world *as we experience and describe it* at higher levels. The F-vocabulary is indispensable for *articulating the structure* the world exhibits at the F-level, even if the stuff is G.
      *   **No Elimination, Only Reduction (of a sort):** DEGS blocks straightforward *eliminativism* about F. While F-facts might be grounded in/ontologically dependent on G-facts, F-concepts remain indispensable for *cognitively tracking* and *specifying* how the world works at the level of pains and wrongs. Reduction, if possible, is not to a description *lacking* F-concepts, but perhaps to a description showing how F-concepts *apply* in virtue of G-facts (but still needing F-concepts to state the application conditions).

  6.  **A Proposed Concept: "Grounding-Specification Entanglement" (GSE)**
      *   **Name:** Grounding-Specification Entanglement (GSE)
      *   **Definition:** A grounding claim exhibits GSE if specifying the particular ground(s) for a given derivative fact (F-fact) necessarily requires essential use of vocabulary or concepts semantically tied to the derivative level (F-level) itself.
      *   **Case that Falls Under It:** "The fact that Clyde is in pain is grounded in the fact that Clyde's C-fibers are firing (along with other relevant neurophysiological facts)." *Specifying* "other relevant neurophysiological facts" *as grounding pain* requires knowing the functional/nomological role *of pain*. Purely microphysical vocabulary cannot isolate *which* neurophysiological facts are the pain-grounders without the concept `pain`.
      *   **Similar-Looking Case that Does NOT Fall Under It:** "The fact that this sample is water is grounded in the fact that it is a collection of H₂O molecules." We can specify the ground ("H₂O molecules") using only vocabulary from the fundamental chemical level. We don't need the concept `water` to identify *which* micro facts ground *this water fact*; we just need `H₂O`. (This assumes type-identity or non-disjunctive realization).
      *   **Distinguishing Feature:** GSE hinges on the *necessity* of F-vocabulary *for identifying the specific G-grounds for a specific F-fact*. The water case avoids GSE because `H₂O` picks out the ground *without* needing `water`.

  **Conclusion:** You've identified Grounding-Specification Entanglement (GSE), a significant challenge for grounding-based metaphysics that aims for descriptive austerity at the fundamental level. It reveals a fissure between ontological dependence and descriptive independence. GSE arises particularly for multiply realizable, functionally defined, or holistically constituted higher-level properties/facts. It suggests that the fundamental level, while perhaps ontologically basic, may lack the descriptive resources to fully articulate *its own grounding work* for specific higher-level phenomena without conceptual tools from those higher levels themselves. This forces a reconsideration of what "fundamental" means, often pointing towards fundamentality being ontological rather than descriptive, or towards the indispensability of higher-level concepts even in a fundamentally grounded world. Your examples of pain and morality are paradigmatic cases of GSE.
