  The user might also need compelling examples. The scale variation (saving billions) and multi-agent cases (thousands of bystanders each able to act) show that deontological constraints aren't absolute. If people's intuitions shift here, it questions the validity of rigid rules. This ties into the empirical aspect—how humans naturally quantify harm or perceive collective responsibility.

  Another angle is the distinction between individual and societal perspectives. Deontologists focus on the agent's integrity, while consequentialists consider overall outcomes. But societal norms might blend both, criminalizing direct harm while allowing systemic trade-offs. This dual-level approach could be a reframing that resolves the paradox by acknowledging different contexts.

