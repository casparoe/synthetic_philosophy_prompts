prompt: |-
  I am convening a two-day adversarial collaboration in my department this autumn on interpersonal comparisons of well-being, and I need the framing document drafted before the participants arrive. I know the literature, so please do not give me a survey, a reading list, or citations — and do not lean on any empirical results beyond the ones I stipulate below. The work I need is constructive drafting: formulations precise enough that each participant could sign their own, and thin enough that neither could reasonably refuse.

  The two participants, whom I will call the Comparabilist and the Scale-Skeptic, hold the following. The Comparabilist maintains that propositions of the form "A's gain under this policy exceeds B's loss" and "A is at a lower level of well-being than B" have determinate truth values fixed by facts about their lives rather than by our conventions, and that we can often know them well enough to act on, if noisily and contestably. The Scale-Skeptic maintains that well-being is measurable only within a single life, that cross-person level comparisons are at best coarse verdicts about extreme cases expressed in the idiom of measurement, and that the most we can rigorously compare are differences, denominated through each person's own trade-off rates. Both are sophisticated enough to find the slogans on each side unsatisfying, which is why I want the disagreement stated precisely rather than rehearsed.

  Please draft the document in four parts.

  First, a numbered section of agreed claims. I expect these to include, among others: the invariance framing of the dispute — which classes of admissible transformation of each person's utility function leave a social evaluation invariant, and what each such class licenses and forbids in the two policy cases I describe at the end; the point that a social ordering presupposes more than intrapersonal cardinality; and whatever else you think both could sincerely sign without the claims becoming vacuous.

  Second, a disagreements table. Columns: the disputed proposition; the formulation the Comparabilist would accept for their own view; the formulation the Scale-Skeptic would accept for theirs; and a note on why the disagreement, so stated, is not merely about words. Where you think some part of the dispute *is* verbal — about what "utility" denotes, or about what counts as measurement — say so in a separate line and explain why.

  Third, the cruxes: the sub-questions that would actually move one side or the other, each with a stipulated case or piece of evidence both would agree bears on it and each side's prediction recorded in advance. I have three in mind but do not treat my list as exhaustive:

  (a) The cross-person decoder. Suppose a decoder trained entirely on within-person neural or behavioural data, using no labels from anyone else, nonetheless predicts a new person's reported experience above chance, including for people whose lives differ substantially from the training subjects. What would each side predict, and what would each take this to show if it happened?

  (b) The common-anchor protocol. Suppose participants calibrate their reports against a standardized battery of controlled experiences, and the resulting scales are then used to compare people whose lives never exposed them to anything in the battery. Is this measurement or stipulated convention, and does the answer differ for differences and for levels?

  (c) The range-normalization convention: rescaling each person so that their own attainable worst outcome is 0 and their own attainable best is 1, then comparing. The Comparabilist should say whether this concedes or begs the question; the Skeptic should say whether accepting it is compatible with their position or quietly abandons it. I would also like both sides pressed on an intra-personal analogue — whether they can make sense of comparing one person across a radical break in their concerns and, if so, why the same resources do not settle the interpersonal case.

  Fourth, a short closing note on what would count as the collaboration failing: the outcome, if any, that both would have to regard as a genuine result rather than a negotiated compromise.

  Apply the whole thing to two policy cases for me: one in which a few people with a severely restricted attainable range — chronic unremitting pain, say — would gain enormously relative to their own baseline, and one in which a large number of people with ordinary ranges would each gain slightly; where exactly does the disagreement between my two participants determine different recommendations, and where does it turn out to make no difference?
reasoning: |-
  We are drafting a framing document for an adversarial collaboration on interpersonal comparisons of well-being. The two participants are the Comparabilist and the Scale-Skeptic. We have four parts: agreed claims, disagreements table, cruxes, and a closing note on failure. Then we apply to two policy cases.

  Part 1: Agreed Claims

  We list claims both can accept without vacuity. These should be non-trivial but acceptable to both.

  1. **Invariance Requirement**: The dispute can be framed by the class of transformations of individual utility functions that leave a social evaluation invariant. 
     - The Scale-Skeptic holds that only transformations that preserve intrapersonal comparisons of utility differences (i.e., positive affine transformations) are admissible. This implies that only utility differences within a life are meaningful and that interpersonal comparisons of utility levels and differences require additional assumptions.
     - The Comparabilist holds that a broader class of transformations is admissible, which would allow for interpersonal comparisons. Specifically, the Comparabilist maintains that utility functions are unique up to positive affine transformations only within a life, but that there are facts that fix the scaling and location across persons.

  2. **Cardinality and Beyond**: Both agree that for a social ordering (like a utilitarian sum) to be well-defined, we require more than just cardinal measurability within each individual's utility. We require some form of interpersonal comparability. The dispute is about whether and how such comparability is achieved.

  3. **Empirical Basis**: Both agree that well-being is in principle empirically grounded in facts about individuals (e.g., their behavior, neural states, reports). However, the Scale-Skeptic maintains that these facts only fix utility up to a positive affine transformation for each individual, while the Comparabilist maintains that they can fix a common scale.

  4. **Policy Relevance**: Both agree that in the absence of interpersonal comparisons, we may still make policy decisions based on other criteria (e.g., Pareto improvements, prioritarianism with a focus on the worst-off without interpersonal level comparisons, or using resources as a proxy). However, they disagree on whether we can use interpersonal comparisons of utility levels and differences.

  5. **Epistemic Limitations**: Both agree that any method of interpersonal comparison is subject to noise and uncertainty, and that in many cases we may not know the truth with high confidence.

  6. **Distinction Between Levels and Differences**: Both agree that the comparison of utility levels (e.g., "A is worse off than B") and utility differences (e.g., "A's gain is greater than B's loss") are distinct. The Scale-Skeptic may allow for some comparisons of differences under certain conditions (e.g., if they are denominated in trade-off rates) but not levels.

  7. **Attainable Range**: Both agree that each individual has an attainable range of well-being (from their worst attainable state to their best). However, they disagree on whether normalizing by this range (setting worst=0, best=1) is sufficient for interpersonal comparability.

  Part 2: Disagreements Table

  We present a table with four columns: Disputed Proposition, Comparabilist's Formulation, Scale-Skeptic's Formulation, and Why Not Merely Verbal.

  | Disputed Proposition | Comparabilist's Formulation | Scale-Skeptic's Formulation | Why Not Merely Verbal |
  |----------------------|------------------------------|-----------------------------|------------------------|
  | **Interpersonal Comparisons of Utility Levels** | Propositions of the form "Person A is at a lower level of well-being than person B" are sometimes true, and their truth is determined by facts about A and B that are independent of any conventional choice of scale. | Propositions of the form "Person A is at a lower level of well-being than person B" are either false or indeterminate in typical cases. When we use such statements, we are at best expressing a coarse judgment about extreme cases, and at worst, we are making a conventional choice. | The disagreement is about what facts exist. The Comparabilist believes there are facts that fix the zero and unit of utility across persons, while the Scale-Skeptic denies this. The disagreement has practical consequences for policy (e.g., prioritizing the worst-off). |
  | **Interpersonal Comparisons of Utility Differences** | Propositions of the form "The gain in well-being to A from policy X is greater than the loss to B" are sometimes true, and their truth is determined by facts about A and B. | Propositions comparing utility differences across persons are meaningful only if they are expressed in terms of each individual's own trade-off rates (e.g., marginal rates of substitution). Without such a common denominator, they are not well-defined. | The disagreement is about whether there is a common metric for welfare gains and losses. The Comparabilist believes in a common metric, while the Scale-Skeptic believes that without a conventional choice, we only have within-person comparisons. |
  | **Nature of Utility Measurement** | (Verbal note) The term "utility" refers to a real, measurable attribute of individuals that can be compared across persons. | (Verbal note) The term "utility" refers to a representation of an individual's preferences or experiences that is only measurable up to positive affine transformations within a life. | This is partially verbal: the Scale-Skeptic uses "utility" in a technical sense (from decision theory) that precludes interpersonal comparisons without additional structure. The Comparabilist uses it more broadly. However, the underlying disagreement about the existence of interpersonally comparable facts remains substantive. |
  | **The Role of Conventions** | Conventions (like choosing a common unit) are not necessary to fix the truth of interpersonal comparisons; they are tools to access pre-existing facts. | Without conventions, interpersonal comparisons lack truth values. Conventions are not mere tools to access facts but are constitutive of the comparisons. | This is a substantive disagreement about the metaphysics of well-being: whether it has a structure that supports interpersonal comparisons independently of our conventions. |

  Part 3: Cruxes

  We present three cruxes with stipulated cases, each side's prediction, and what each would take the result to show.

  **Crux (a): The Cross-Person Decoder**

  - **Case**: A decoder is trained only on within-person neural or behavioral data (without any labels from other persons) to predict self-reported experiences (e.g., pain, pleasure). It is then tested on new individuals, including those with very different life circumstances, and achieves above-chance accuracy in predicting their self-reports.
  - **Comparabilist's Prediction**: The Comparabilist would predict that such a decoder is possible because there is a common scale of well-being that the decoder can access. They would take this as evidence that there are objective, interpersonally comparable facts about well-being.
  - **Scale-Skeptic's Prediction**: The Scale-Skeptic would predict that the decoder will fail when applied to people with very different lives because the neural or behavioral patterns might not map to the same experiences in the same way. If it succeeded, the Scale-Skeptic might argue that the decoder is implicitly relying on within-person patterns that are similar across individuals (which would not establish level comparisons) or that the self-reports are being used as a convention. They might also question whether the self-reports are comparable.
  - **What it shows**: 
    - If successful, the Comparabilist would say it shows that we can access interpersonally comparable well-being without conventions.
    - The Scale-Skeptic would say it shows at most that there are commonalities in how experiences are reported or in the neural correlates, but not that we have a common scale for levels (e.g., we cannot say if one person's pain is worse than another's).

  **Crux (b): The Common-Anchor Protocol**

  - **Case**: Participants calibrate their reports of well-being against a standardized battery of controlled experiences (e.g., mild electric shocks, pleasant images). Then, the same scale is used to compare people who have never been exposed to the battery (e.g., they have different cultural backgrounds or experiences).
  - **Question**: Is this a method of measurement or a stipulated convention? And does the answer differ for comparing differences versus levels?
  - **Comparabilist's View**: The Comparabilist would say that this is a method of measurement because the common anchor provides a shared reference point. They would say that both levels and differences can be compared this way, at least for individuals similar to the calibration group. For those never exposed, they might argue that we can extrapolate based on the commonality of human experience.
  - **Scale-Skeptic's View**: The Scale-Skeptic would say that this is a stipulated convention. The anchor only fixes a scale for those who were calibrated. For others, we are projecting a convention. They might accept that for differences within a person, the calibrated scale might be meaningful, but for levels across persons, it is not. For people not exposed to the battery, the comparison of levels is entirely conventional.
  - **What it shows**: 
    - The Comparabilist would take the protocol as evidence that we can construct a common scale that tracks real features of well-being.
    - The Scale-Skeptic would take it as an example of how we can impose a convention to make comparisons, but not as evidence that such comparisons are factual.

  **Crux (c): Range-Normalization Convention**

  - **Case**: Each person's utility is rescaled so that their worst attainable outcome is 0 and their best is 1. Then we compare across persons (e.g., person A at 0.3 vs. person B at 0.5).
  - **Question for Comparabilist**: Does this convention concede the Scale-Skeptic's point or beg the question?
    - *Comparabilist's Response*: The Comparabilist might say that this convention is a practical tool but that it does not concede the skeptic's point because the underlying facts about the absolute levels of well-being are what make the normalization meaningful. Without those facts, the normalization would be arbitrary. Therefore, it does not concede and might even presuppose the comparability they advocate.
  - **Question for Scale-Skeptic**: Is accepting this convention compatible with your position, or does it quietly abandon it?
    - *Scale-Skeptic's Response*: The Scale-Skeptic would say that this convention is a way to make comparisons, but it is a conventional choice. They might accept it as a useful procedure for making decisions (e.g., in prioritarianism) but maintain that it does not reveal pre-existing facts about interpersonal levels. Therefore, it is compatible with their position as long as we recognize it as a convention.
  - **Intra-personal Analogue**: 
    - Compare one person before and after a radical change in their concerns (e.g., due to a life-altering event). 
    - The Comparabilist would argue that we can still compare the person's well-being across the change because it is the same person, and we might appeal to the continuity of their identity or to their overall life story. 
    - The Scale-Skeptic would argue that even within a person, after a radical change, we are effectively dealing with two different "selves" and that comparisons become problematic. 
    - **Why not interpersonal?**: The Comparabilist would say that the same resources (e.g., continuity of identity) are not available interpersonally, but that other resources (e.g., common human nature) might be. The Scale-Skeptic would say that the intra-personal case is different because of the unity of a single life, which is absent interpersonally.

  Part 4: Closing Note on Failure

  The collaboration would fail if the participants conclude that their disagreement is merely verbal or that no evidence could resolve it. Success would be an agreement on what kind of evidence would be decisive or a joint statement on the conditions under which interpersonal comparisons are justified. Failure would also occur if they reach a compromise that both regard as inconsistent with their core commitments (e.g., the Comparabilist accepting that interpersonal comparisons are always conventional, or the Scale-Skeptic accepting that they are factual without a change in view). A genuine result would be one that both can accept as a consequence of the arguments and evidence presented, without either feeling they have abandoned their position.

  Application to Policy Cases

  We consider two policy cases:

  **Policy Case 1**: A policy that provides an enormous gain to a few people with a severely restricted attainable range (e.g., individuals in chronic unremitting pain, whose baseline is very low and who can be brought to a much better state).

  **Policy Case 2**: A policy that provides a slight gain to a large number of people with ordinary ranges.

  **Where the Disagreement Matters**:

  - The Comparabilist would likely support Policy Case 1 because they can compare the levels of well-being and note that the individuals in chronic pain are at a very low level. The gain for them is enormous in absolute terms and also in terms of moving them up from a very low base. The Comparabilist might use a utilitarian or prioritarian calculus that gives extra weight to the worst-off.

  - The Scale-Skeptic, without interpersonal level comparisons, might not be able to say that the individuals in chronic pain are worse off than others. They might focus on the gains in terms of each person's own scale. However, because the gain for the chronic pain group is large in their own terms, and the loss to others (if any) might be small, the Scale-Skeptic might still support Policy Case 1 if it is a Pareto improvement or if the gains are large enough in the affected individuals' own terms. But if the policy requires taking resources from others (so that there is a trade-off), the Scale-Skeptic would not be able to compare the gains to the chronic pain group with the losses to others. They might then rely on non-utility criteria (e.g., equality of resources) or avoid the policy.

  - In Policy Case 2, the Scale-Skeptic might be more supportive because it benefits many people, each by a small amount. Without needing to compare levels, they could note that each gain is a positive in that person's own terms. The Comparabilist might also support it, but they might give it less weight than Policy Case 1 if they believe the chronic pain group is much worse off.

  **Where the Disagreement Does Not Matter**:

  - If either policy is a Pareto improvement (making at least one person better off without making anyone worse off), both would agree to implement it.

  - If the gains and losses are only within a single person, both would agree on the net effect.

  - If the policies do not involve trade-offs across persons (e.g., independent decisions), then each can be evaluated on its own.

  However, in the trade-off between Policy Case 1 and Policy Case 2 (if we must choose one), the disagreement is crucial. The Comparabilist would prioritize Policy Case 1 because of the low baseline of the chronic pain group, while the Scale-Skeptic would be unable to make that comparison and might prefer Policy Case 2 (if the number of beneficiaries is large enough) because they can aggregate the small gains without interpersonal level comparisons.

  Drafting the Document:

  We now write the framing document accordingly.
answer: |-
  ### Framing Document: Adversarial Collaboration on Interpersonal Comparisons of Well-Being  
  **Participants**: Comparabilist (C) and Scale-Skeptic (S)  
  **Objective**: To isolate and clarify the substantive disagreements about interpersonal comparisons of well-being, avoiding rehearsals of familiar arguments.  

  ---

  ### 1. Agreed Claims  
  Both participants affirm the following non-vacuous propositions, which frame the dispute without presupposing its resolution:  

  1. **Invariance Requirement**: Social evaluations must specify which transformations of individual utility functions leave them invariant.  
     - *Implications*:  
       - S holds that only *positive affine transformations* (unique up to origin and unit) are admissible, preserving intrapersonal comparisons of utility differences but forbidding non-conventional interpersonal comparisons of levels or differences.  
       - C holds that a *broader class* (e.g., ratio or absolute scales) is admissible, permitting interpersonal comparisons of levels and differences as factual.  
     - *Policy Relevance*: Invariance under affine transformations forbids interpersonal comparisons; invariance under weaker transformations licenses them.  

  2. **Social Ordering Requires More Than Intrapersonal Cardinality**: A social welfare ordering (e.g., utilitarian aggregation) necessitates more than cardinal measurability within a single life. It requires interpersonal comparability of utility levels or differences.  

  3. **Empirical Grounding**: Well-being is empirically anchored in facts about individuals (e.g., behavior, preferences, neural states, or reports), though these facts underdetermine utility representations.  

  4. **Distinction Between Levels and Differences**:  
     - Comparisons of *levels* (e.g., "A is worse off than B") and *differences* (e.g., "A’s gain exceeds B’s loss") are logically distinct.  
     - Both agree that *intrapersonal* comparisons of differences are meaningful (denominated via trade-off rates).  

  5. **Epistemic Constraints**: Knowledge of well-being is noisy and contestable; neither side claims infallibility.  

  6. **Attainable Range**: Each person has an attainable range of well-being (from their worst to best possible state), but this does not resolve interpersonal comparability without further assumptions.  

  ---

  ### 2. Disagreements Table  
  | Disputed Proposition                             | Comparabilist’s Formulation                                                                 | Scale-Skeptic’s Formulation                                                                                                | Why Not Merely Verbal                                                                                                  |  
  |--------------------------------------------------|---------------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------------------------------------|------------------------------------------------------------------------------------------------------------------------|  
  | **Truth of Interpersonal Comparisons**           | Propositions about interpersonal levels/differences have determinate truth values fixed by facts independent of conventions. | Such propositions lack determinate truth values; they express conventions or coarse judgments (e.g., only in extreme cases). | Disagreement is metaphysical: Are there mind-independent facts fixing cross-person scales? Affects policy justification. |  
  | **Scope of Measurement**                         | Well-being is measurable on a common scale across persons, analogous to intrapersonal measurement. | Well-being is measurable only intrapersonally; cross-person "measurement" is either impossible or conventional stipulation. | Disagreement is about what constitutes measurement: C sees it as factual discovery; S as conventional construction.     |  
  | **Verbal Note: "Utility" Denotation**            | "Utility" denotes a real, interpersonally comparable property of well-being.                | "Utility" denotes a representation of preferences/experiences, unique only up to affine transformations within a life.      | *Verbal*: Reflects terminological divergence in decision theory vs. welfare ethics. *Substantive*: Underlying dispute about cross-person facts remains. |  

  ---

  ### 3. Cruxes  
  Each crux presents a case both agree is evidentially relevant, with predictions and interpretations recorded in advance.  

  #### (a) The Cross-Person Decoder  
  - **Case**: A decoder trained solely on within-person neural/behavioral data (no cross-person labels) predicts a new person’s self-reported experiences (e.g., pain intensity) above chance, including for people with divergent life circumstances.  
  - **Predictions**:  
    - C: Predicts success. Takes this as evidence that well-being has interpersonally comparable neural/behavioral correlates, supporting factual comparisons.  
    - S: Predicts failure or chance performance. If successful, attributes it to shared report conventions or homogeneous training data, not cross-person level comparability.  
  - **Interpretations**:  
    - If successful, C sees it as proof of non-conventional facts; S sees it as revealing nothing about levels (e.g., "Is A’s pain worse than B’s?").  

  #### (b) The Common-Anchor Protocol  
  - **Case**: Participants calibrate self-reports to a standardized battery (e.g., controlled pain/pleasure stimuli). Scales are then applied to people never exposed to the battery (e.g., different cultures/experiences).  
  - **Question**: Is this measurement or convention? Does the answer differ for levels vs. differences?  
  - **Views**:  
    - C: This is measurement. Calibration fixes a common scale for levels and differences, even for unexposed individuals (via extrapolation).  
    - S: This is convention. Differences may be comparable for exposed individuals; levels are never non-conventional. For unexposed, all comparisons are stipulated.  
  - **Crucial Test**: S denies level comparisons can be non-conventional; C asserts they can be empirically grounded.  

  #### (c) Range-Normalization Convention  
  - **Case**: Rescale each person’s utility so their attainable worst = 0 and best = 1. Compare levels/differences interpersonally (e.g., "A at 0.3 vs. B at 0.5").  
  - **Questions**:  
    - *To C*: Does this concede S’s point or beg the question?  
      - **C’s Response**: Rejects concession. Normalization is practical but presupposes cross-person facts (e.g., that 0/1 anchors are comparable). Without facts, it is arbitrary.  
    - *To S*: Is accepting this compatible with your view, or does it abandon it?  
      - **S’s Response**: Compatible if treated as convention (e.g., for prioritarianism). But it abandons S’s core claim if presented as non-conventional.  
  - **Intra-Personal Analogue**:  
    - Can we compare well-being across a radical change in a person’s concerns (e.g., pre/post-religious conversion)?  
      - C: Yes, via diachronic identity or holistic narrative.  
      - S: Problematic; trade-off rates may not be stable, making comparisons conventional.  
    - *Why not interpersonal?*  
      - C: Interpersonal comparisons lack a unifying identity; require shared humanity or neural homologies.  
      - S: Diachronic unity in one life is irreducible; no analogue exists across persons.  

  ---

  ### 4. Failure Condition  
  The collaboration fails if:  
  - The outcome is a *negotiated compromise* both regard as inconsistent with their core commitments (e.g., C accepting that comparisons are always conventional, or S accepting non-conventional facts without new evidence).  
  - The disagreement is dismissed as *merely verbal* without resolving the metaphysical/evidential stakes.  
  **Success** requires agreement on what evidence would decisively shift positions or a joint statement clarifying irreconcilable premises.  

  ---

  ### Application to Policy Cases  
  **Policy Case 1**: A policy greatly improves well-being for a few people with a severely restricted attainable range (e.g., chronic pain patients).  
  **Policy Case 2**: A policy slightly improves well-being for a large number with ordinary ranges.  

  #### Where Disagreement Determines Recommendations:  
  - **Trade-off Scenario**: If resources are scarce and Policy 1 trades off against Policy 2:  
    - C: Strongly favors Policy 1. Compares levels (chronic pain patients are at absolutes lows) and differences (gains are large relative to their range).  
    - S: Cannot compare levels (e.g., "Are pain patients worse off?"). May reject Policy 1 if it requires interpersonal comparisons, favoring Policy 2 (small but certain gains) or non-utility criteria (e.g., procedural fairness).  
  - **Differential Impact**: The disagreement matters most when policies involve sacrificing small gains for many to achieve large gains for the severely deprived.  

  #### Where Disagreement Makes No Difference:  
  - **Pareto Improvements**: Both agree on policies benefiting some without harming others.  
  - **Intrapersonal Trade-offs**: Both agree on evaluations within a single life (e.g., medical treatments for chronic pain patients).  
  - **Extreme Deprivation**: S may concur with C on aiding chronic pain patients using non-utility criteria (e.g., basic rights), avoiding interpersonal comparisons.  

  ---  
  **Signed**,  
  [Your Name], Convener  
  *Date*: [Draft Date]
