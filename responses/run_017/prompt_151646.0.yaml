  Hmm, this is a sophisticated metaphysical argument with layers. Let me unpack the core move first: using readymades to break the asymmetry in persistence conditions between statues and clay. The user cleverly constructs a case where the artwork survives matter replacement (which clay supposedly can't) but not reshaping (which clay can) - creating crossed persistence conditions. That does seem novel.

  For point 1 about accuracy: The user's characterization of the standard positions feels correct. Constitution theorists like Baker do ground directionality in primary kinds, but many introductory presentations do imply a "permissiveness ranking" implicitly. The user might be attacking a pedagogical simplification rather than cutting-edge literature, but it's a fair target.

  On point 2 (stipulation): The conservation episode is crucial because without matter replacement, the crossing disappears. But even without it, the initial coincidence-through-declaration remains interesting. The non-arbitrariness holds - museums really do treat replacement and reshaping differently based on institutional rules.

  For point 3 (lump persistence): This is actually the shakiest part. The claim that lumps can't survive matter replacement is debatable - one could argue lumps are defined by continuity rather than matter. Maybe better to frame this as a hypothetical: "if we accept the common view that matter matters for lumps..."

  The type/instance reply (point 4) feels avoidable by focusing on physical artifacts like a "designated heritage brick" where institutional status directly affects conservation requirements. Readymades might be special cases where the type view is plausible, but that doesn't generalize.

  The overgeneration worry (point 5) is serious but manageable. The constitution theorist already needs to explain why signing a urinal creates an artwork but labeling a pipe "emergency hammer" doesn't. The line likely involves entrenched institutional practices - exactly what the user wants to emphasize.

  For persons (point 6): This actually helps! If artifact constitution is socially grounded but persons aren't, the too-many-thinkers problem might be limited to artifacts. Could note that personhood may involve first-person perspectives not reducible to institutional facts.

  The essay is definitely worth posting (point 7). The readymade case crystallizes how social practices can override metaphysical intuitions. I'd suggest opening with the Sixteen Pounds case immediately to hook readers, then unpack the dialectic.

  For the friend's rebuttal (point 8): She'd likely attack the matter replacement intuition hard - "of course the lump survives gradual replacement! We call the same clay pile 'the clay' after adding fresh bags for years!" And she'd insist the certificate merely tracks pre-existing lump persistence conditions rather than creating new ones.

  The user's writing is admirably clear for such abstract material. Their confidence about citations suggests they're professionally familiar with the literature. Interesting how personal the philosophical disagreement feels - that studio argument must have been intense!
answer: |-
  Here’s a thorough analysis addressing each query, designed to strengthen your argument while preserving its core insight:

  ### 1. **Accuracy of the Map**  
     - **Fairness**: You accurately characterize identity/constitution/eliminativist views. The "ranking" critique targets an *implicit* tendency in the dialectic (e.g., Lump as "metaphysically privileged" matter), even if not explicitly endorsed. Constitution theorists (e.g., Baker) ground direction in *primary kinds*, not permissiveness. **Recommendation:** Acknowledge this upfront: "While some constitution theorists avoid ranking by appealing to primary kinds, the standard *intuition pump* relies on asymmetrical survival conditions, which my case disrupts."

  ### 2. **Generated or Stipulated?**  
     - **Crossing**: The verdicts follow naturally from the *kind* + standard lump persistence. Lumps are typically taken to be *matter-constituted* (surviving reshaping but not matter replacement). The certificate merely defines the *work’s* kind (institutional essence), making survival conditions non-arbitrary within the practice.  
     - **Deleting 1998 episode**: The case still holds! Without replacement, you retain:  
       (i) Coincidence beginning with no intrinsic change (challenging eliminativism).  
       (ii) *Unidirectional* asymmetry (work destroyed by reshaping; lump survives), but now grounded *wholly institutionally*—not form/matter. This still reframes the dialectic.  

  ### 3. **Which Branch? Defending Lump Persistence**  
     - **Defensibility**: Claiming lumps *cannot* survive matter replacement is defensible (e.g., mereological essentialism for quantities of matter). **But** if your friend insists lumps *are* matter-tolerant, the argument *survives*:  
       - **Branch 1** (lumps intolerant): Crossing holds → ranking destroyed.  
       - **Branch 2** (lumps tolerant): Unidirectional but *institutionally grounded* coincidence remains.  
     - **Recommendation**: Explicitly defend Branch 1 briefly (e.g., "We intuitively track lumps by their matter; a 'lump' wholly replaced is a new lump"), but stress Branch 2 suffices.  

  ### 4. **Type-and-Instance Reply**  
     - **Damage**: The type view *is* coherent but strains practical commitments (e.g., "The museum *destroyed the work*" becomes strictly false). To counter:  
       - **Modify the case**: Use a *non-art institutional artifact* (e.g., a "Heritage Brick" designated by law, surviving matter replacement but not crushing). No "type" ambiguity.  
       - **Strengthen readymade**: Specify the certificate *forbids re-fabrication* (so 2003’s ball isn’t an instance).  
     - **Conclusion**: The type reply works *only* for repeatable works; your core point holds for unique institutional objects.  

  ### 5. **Overgeneration**  
     - **The Line**: Constitution occurs when an institutional act:  
       (i) Assigns *novel persistence conditions* (e.g., surviving matter replacement),  
       (ii) Within an *entrenched practice* (art, law, religion).  
     - **Constitution Theorist’s Burden**: They already distinguish *accidental* descriptions ("I call this cup ‘Steve’") from *kind-constitutive* acts (e.g., baptizing a ship). Your account aligns with their existing constraints.  

  ### 6. **Persons**  
     > *"Your artifact argument doesn’t threaten the person/animal case. Personhood isn’t defined by institutional practices but by intrinsic capacities (consciousness, self-reflection). The ‘too many thinkers’ worry arises from biological vs. psychological persistence conditions—not social facts. Constitution for persons must be solved elsewhere, likely by denying the animal is a thinker (e.g., animalism) or accepting coincidence with grounded mental properties."*  

  ### 7. **Worth Posting?**  
     - **Strengths**: Novel, clear, and forces re-examination of social ontology’s role in metaphysics. **Weakest section**: The friend’s fallback (type view) needs sharper rebuttal (per §4).  
     - **Structural Tweaks**:  
       - **Open with the case** (hook readers immediately).  
       - **Cut** excessive dialectic recap; focus on Lump/David just enough to contrast.  
       - **Emphasize** the *institutional grounding* as the positive thesis.  
     - **Verdict**: **Post it!** It advances the debate meaningfully.  

  ### 8. **Friend’s Strongest Reply (in her voice)**  
  > "You’re conflating metaphysics with institutional fictions. The certificate doesn’t create a *new object*; it just lets us *describe* the lump under art-world conventions. When the conservator replaces clay, she’s maintaining a *role* for a new lump—not preserving an entity. Your ‘crossing’ collapses: if the lump can’t survive replacement (which I deny), there’s only one thing—the lump—which the art practice misdescribes as persisting. If it can, the work is just the lump under a sortal, and your ‘destruction’ in 2003 is mere convention. Either way, no coincidence. The readymade proves my point: it’s language games all the way down."

  ---

  ### Final Recommendations  
  - **Sharpen §4**: Address type-view head-on with a non-art case.  
  - **Clarify Grounding**: Explicitly state that institutions assign *primary kinds* (tying to Baker).  
  - **Streamline**: Start with *Sixteen Pounds*, then unpack dialectic implications.  
  - **Highlight**: The core insight—**artifact ontology is practice-relative**—is significant and underexplored in standard coincidence debates.  

  This is a compelling intervention. Post the essay, then send your friend the link—this deserves an audience.
