prompt: |-
  I joined the clinical ethics committee of my hospital three months ago, a year after sitting with my family through my father's final admission to its intensive care unit. The committee is about to rewrite its guidance on two matters in particular: withdrawing life-sustaining treatment, and what clinicians should do when a family asks the team not to tell a patient their prognosis. I find that views I had previously held only as private opinions now have to be turned into something written down, and I would be grateful for a consistency check before the drafting meeting. My sympathies in the generalism/particularism dispute lie with the particularist side, though I arrived there informally and by no careful route. Here is roughly where I stand:

  (1) I do not think there are exceptionless moral principles, nor that there is a manageable set of defeasible ones that captures what matters. Whether a feature of a case is a reason at all, and which way it points, seems to me to depend on what else is going on; a feature that counts in favour here can be silent, or count against, there.

  (2) I am not a relativist. Some verdicts on a case are simply wrong, and what makes them wrong is fixed entirely by the descriptive facts of the case. I take the supervenience of the moral on the descriptive for granted, and I have never seen how to give it up.

  (3) In every case I have actually encountered, the fact that a course of action would leave a patient in severe untreated pain has been a reason against it, and I expect our case mix to stay like this. I have never had to treat it as otherwise and I do not expect to.

  (4) When a clinician does what our guidance says partly because the guidance says so, I want to say that this gives her some genuine moral support and not merely institutional cover: the guidance is a consideration in favour of acting, and not just a fact about what the hospital will later accept.

  (5) I think the guidance has to pass what we have started calling the corridor test. A reviewer who was not in the room, who does not share our judgment, and who has only the notes must be able to determine afterwards whether the clinician complied. Guidance that cannot be audited in that way is not guidance at all. This I regard as non-negotiable.

  (6) I think clinical moral judgment is a trained perceptual skill, that novices acquire it partly by being handed rules, and that the point of the rules is that they should eventually be outgrown. At the same time I want to say that a clinician who does the right thing only by applying a rule whose cited features were not the reasons actually present in the case has got it right without seeing it, and that this is a real defect even when the outcome is identical.

  (7) I think several people on the committee are better at this than I am and that I should frequently defer to them. But I do not accept that anyone's verdict is right because she reached it, or that one person can have authority over another's moral judgment.

  (8) On the case that led to me being asked to join: my father's team told him his prognosis after my mother and I had asked them not to, and I remain convinced that telling him was right. Yet I also want to say that in every case what ought to be done is what the balance of reasons in that case favours, and that this is the whole story about what makes a verdict right. In that case the reasons I am able to articulate seem to me to point the other way, and what I am ultimately relying on is that the senior nurse saw it and I did not.

  Which of these are genuinely in tension, and which only appear to be? Please rank the real tensions by severity rather than treating them all as equally serious; for each, say what would have to be given up and what giving it up would cost me; and tell me which single revision would clean up the most. If one item is doing more damage than the rest, say so plainly. I do not know where the trouble is, and I would rather be told than reassured.
reasoning: |-
  Hmm, the user is a new member of a hospital clinical ethics committee who's grappling with how to transform their personal philosophical views into formal guidance. They've outlined 8 distinct positions rooted in moral particularism and want a consistency check before drafting new policies on life-sustaining treatment and truth-telling. There's palpable tension here - they're clearly still processing their father's ICU experience where clinicians disclosed prognosis against family wishes, an event they now believe was correct despite their initial opposition.

  The core of their philosophical stance seems to be: moral judgments are case-specific (1), yet objectively grounded in descriptive facts (2); they hold strong intuitions about pain avoidance (3) and institutional guidance having moral weight (4); but insist guidance must be auditable (5). There's fascinating tension between viewing clinical ethics as a perceptual skill where rules are training wheels (6), while simultaneously valuing "seeing" the moral truth over mechanically applying rules. The personal conflict in (8) is particularly poignant - they acknowledge the clinicians were right in their father's case, but can't articulate why their own reasoning failed.

  I notice several friction points. The strongest tension is between their particularism (which resists codification) and the auditability requirement (which demands codification) - these seem fundamentally at odds. There's also strain between wanting guidance to carry moral authority (4) while denying any person's moral authority (7), and between valuing perceptual skill (6) yet needing to defer to others' judgments without granting them authority (7,8). The pain avoidance principle (3) also sits uneasily with their rejection of exceptionless rules (1).

  What makes this especially complex is how their father's case haunts these deliberations - they're simultaneously defending the clinicians' action while wrestling with why their own particularist reasoning failed in that concrete situation. The auditability constraint feels like it might be overcorrecting for that experience, potentially sacrificing philosophical coherence for practical accountability.

  The most damaging inconsistency seems to be between particularism and auditability - these pull in opposite directions. Compromising on particularism would cost them philosophical integrity, but relaxing auditability might make the guidance practically useless. Perhaps they could reframe auditability as verifying proper process rather than checking against rigid rules? That might preserve both values while requiring painful concessions from their current positions.
answer: |-
  Based on your detailed principles, here's an analysis of the genuine tensions, ranked by severity, their costs, and the most impactful revision:

  **Ranked Tensions (Most Severe First):**

  1.  **Particularism (1) vs. Auditability (5)**
      *   **Tension:** Particularism asserts that moral reasons are context-dependent and resist codification into fixed rules. Auditability demands that actions be judged against pre-written, context-independent standards using only notes. A reviewer relying *only* on documented facts and the guidance *cannot* replicate the nuanced, holistic perception required by particularism. What made an action right/wrong might be an irreducibly contextual feature absent from the notes.
      *   **Giving Up & Cost:**
          *   *Option A (Weaken Particularism):* Accept some general, defeasible rules as sufficiently capturing core reasons for audit purposes. **Cost:** Compromises your core philosophical commitment; risks creating "checklist ethics" that misses crucial context.
          *   *Option B (Weaken Auditability):* Accept that audit focuses on *process* (was the guidance *considered* appropriately? was deliberation documented?) rather than pure *outcome compliance*. **Cost:** May feel like abandoning a crucial safeguard for accountability and consistency; harder to enforce.
      *   **Severity:** This is the most severe tension. It strikes at the heart of implementing particularist judgment within an institutional framework requiring accountability.

  2.  **Particularism (1) & Moral Realism (2) vs. Deference to Expertise (7) & The Father's Case (8)**
      *   **Tension:** Particularism and moral realism (supervenience) imply the *right answer* is determined by the specific descriptive facts of the case. Yet, you acknowledge deferring to others (7) and that the clinicians were right in your father's case even though *you* couldn't articulate the reasons (8). This creates tension: If the right answer supervenes on the facts, why couldn't *you* grasp it? Does deference imply that the perceptual skill grants access to reasons *not* fully captured by the descriptive facts available to others?
      *   **Giving Up & Cost:**
          *   *Option A (Refine Understanding of Perception/Skill):* Argue that the descriptive facts *are* all there, but the perceptual skill allows for *better identification, weighting, and synthesis* of those facts, which a novice (or family member under stress) might miss or misjudge. Deference is warranted because others perceive the salient facts/reasons more accurately. **Cost:** Requires careful articulation to avoid implying "moral facts" beyond the descriptive. Doesn't fully resolve why *you* couldn't reconstruct the reasons later.
          *   *Option B (Accept Epistemic Limitations):* Maintain the right answer supervenes on the facts, but acknowledge that *identifying* that answer perfectly is often beyond any individual's capacity, especially under duress. Deference is a practical necessity based on trust in skill and experience. **Cost:** Slightly weakens the sense that "the reasons are *all* there for anyone to see"; introduces an element of fallibility into judgment even when the moral fact is fixed.
      *   **Severity:** High. It challenges the direct link between descriptive facts and knowable moral truth that underpins your realism, especially given the personal experience driving it.

  3.  **Guidance as Moral Support (4) vs. Rules as Training Wheels (6) & Anti-Authority (7)**
      *   **Tension:** You want guidance to provide genuine moral support (a reason *for* acting), not just cover. Yet, you see rules as crutches for novices to be outgrown (6), and deny anyone has authority over another's moral judgment (7). This raises questions: If the guidance is a *genuine* moral reason, why should it be outgrown? If it's *not* a genuine reason inherent in the case, how can it provide *moral* support? Doesn't acting *partly* because the guidance says so imply accepting its authority over your judgment?
      *   **Giving Up & Cost:**
          *   *Option A (Refine Nature of Guidance's Moral Weight):* Argue that the guidance embodies the institution's collective wisdom and commitment to a *process* likely to identify the right reasons. Following it *can* be a genuine secondary reason (promoting institutional integrity, shared responsibility, reducing individual cognitive burden/error) *in addition* to the primary reasons in the case. It's not outgrown, but its weight is contextual. **Cost:** Risks making the guidance's force seem merely procedural/pragmatic rather than deeply moral; requires distinguishing its reason-status from the primary case reasons.
          *   *Option B (Weaken "Moral Support" Claim):* Concede the guidance primarily offers institutional cover and process assurance, not an independent *moral* reason. Its value is in structuring deliberation for novices and ensuring consistency/auditability. **Cost:** Abandons your intuition that following good guidance is morally supportive, not just protective.
      *   **Severity:** Moderate. It requires clarifying the specific kind of "reason" the guidance provides within your particularist framework.

  4.  **Pain as (Near-)Invariant Reason (3) vs. Particularism (1)**
      *   **Tension:** Stating that untreated severe pain is *always* (in your experience and expected cases) a reason against an action sounds like a strong, near-exceptionless principle. This sits uneasily with the claim that a feature's status as a reason depends entirely on context ("what else is going on").
      *   **Giving Up & Cost:**
          *   *Option A (Contextualize the Pain Principle):* Acknowledge that while pain is *almost always* a strong reason against, its *precise weight* and whether it could *ever* be overridden or even count differently (e.g., in very specific contexts like certain research or religious sacrifice) depends on context. Its invariant status is empirical (based on case mix), not metaphysical. **Cost:** Weakens the apparent absoluteness of your statement; requires openness to highly exceptional cases.
          *   *Option B (Accept a Sparse Set of Defeasible Principles):* Concede that perhaps a *very small* number of defeasible principles (like "avoid severe pain") *can* capture core moral features, even within particularism. **Cost:** Requires a concession to generalism you seem reluctant to make.
      *   **Severity:** Moderate/Low. This is the least severe tension because your statement (3) is framed empirically ("in every case I have encountered... I expect...") rather than as a necessary truth. It highlights the *practical* stability of some reasons within your context, without necessarily violating the *theoretical* context-dependence.

  **The Single Most Damaging Tension & Key Revision:**

  *   **The Core Problem:** **Particularism vs. Auditability (1 vs. 5)** is doing the most damage. It threatens the feasibility of writing guidance that satisfies your fundamental philosophical commitment *and* the non-negotiable practical requirement of accountability. This tension underlies many practical drafting difficulties.
  *   **Most Impactful Revision:** **Reframe Auditability (5).** Shift the focus of audit from judging *outcome compliance* against rigid standards to auditing the *deliberative process* documented in the notes.
      *   **How:** Draft guidance that emphasizes the *factors* that must be considered (patient values, medical facts, family views, proportionality, burdens/benefits, etc.), the *process* of deliberation (multidisciplinary discussion, attempts at consensus, involvement of ethics support if needed), and robust *documentation* of this deliberation and the reasons for the decision – *especially* how conflicting reasons were weighed in *this specific context*. The audit checks: Was the required process followed? Were the relevant factors considered? Is the reasoning documented sufficiently to understand *why* this decision was reached given *these* circumstances?
      *   **Why it Helps:**
          *   **Preserves Particularism:** Allows the *right* decision to be the one supported by the balance of context-specific reasons. The audit assesses whether the search for those reasons was robust and transparent.
          *   **Meets Accountability Need:** Provides a concrete, reviewable standard (process + documentation) for institutional oversight and learning ("corridor test" passed by reviewing the documented deliberation).
          *   **Aligns with Skill (6):** Focuses on the *practice* of good moral perception and deliberation, which is the skill to be developed.
          *   **Supports (4):** Following guidance focused on good process *can* provide genuine moral support by ensuring thorough, considered decision-making.
          *   **Addresses (8):** Requires documenting *why* disclosure was right *in that specific case*, potentially revealing reasons the family missed (e.g., specific cues about the patient's desire to know, the nature of their relationship with the clinician, subtle harms of deception).
      *   **Cost:** Requires significant effort to draft process-focused guidance and train clinicians in robust ethical deliberation and documentation. It won't produce simple "if X then Y" rules. Some may argue it's less "objective" than outcome-based compliance. It demands trust in the integrity of the documented deliberation.

  **Conclusion:**

  Your framework is coherent philosophically but faces significant challenges in institutional implementation, primarily due to the **Particularism vs. Auditability** tension. Reframing auditability around **process and documentation of context-specific reasoning** is the single most effective revision to resolve this core tension and align your other commitments (moral realism, the value of skill, the nature of guidance, deference to expertise). This approach acknowledges that while the *right answer* is particular, the *path to finding it* can be guided, structured, and reviewed. This shift is crucial for translating your particularist insights into effective, accountable clinical ethics guidance for your hospital. Good luck with the drafting meeting.
