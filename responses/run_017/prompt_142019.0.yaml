answer: |-
  ### Class Session Design: The Unmarked Default Trap

  **Core Insight**: Students will create texts using fictional marked/unmarked categories (e.g., Sunborn/Moonborn), then transplant the same linguistic structures to gender terms. When read aloud, the gender version reveals the absurdity/offensiveness of "neutral" language, forcing students to confront how markers function. Debrief uses their own texts to disentangle reference, defaulting, and social load.

  ---

  ### RUNNABLE SESSION PLAN (75-min)

  **Session Title**: "The Guild Memo Experiment"  
  **One-Line Goal**: "Students will discover how unmarked language defaults embed bias by writing, transplanting, and analyzing texts across fictional and real axes."

  **Materials**:
  - Handouts: Fictional axis prompts + memo instructions (1 per group)
  - Transplant tables (1 per group during rewrite phase)
  - Whiteboard/projector for debrief notes
  - Timer

  ---

  #### **Handout Text** (Adjust per group’s assigned axis)
  **Instructions for Memo Writing (15 min)**  
  *"You are guild leaders in \[TRADE, e.g., Skyfarers\]. In this guild, \[UNMARKED TERM, e.g., Sunborn\] are the default members (e.g., ‘a Skyfarer’ means a Sunborn). \[MARKED TERM, e.g., Moonborn\] are only specified when relevant. Write a 3–5 sentence memo about a routine issue (e.g., equipment checks). Use the terms naturally:*  
  - *Use \[UNMARKED\] for generic references (e.g., ‘Every Skyfarer must check his gear’).*  
  - *Use \[MARKED\] only when their status matters (e.g., ‘Moonborn need extra safety gear for night flights’).*  
  *Do NOT make the memo about the categories themselves—keep it mundane."*

  **Transplant Table** (Used during rewrite phase)  
  | Axis           | Unmarked Term | Marked Term | Replacement Rule                     | Why This Axis?                          |
  |----------------|---------------|-------------|--------------------------------------|-----------------------------------------|
  | Skyfarers      | Sunborn       | Moonborn    | Sunborn → man; Moonborn → woman      | Neutral trade; avoids real-world triggers |
  | Landship Crews | Peakfolk      | Valleyfolk  | Peakfolk → man; Valleyfolk → woman   | Geographic distinction; low emotional charge |
  | Artisan Guild  | Brushhand     | Clayhand    | Brushhand → man; Clayhand → woman    | Skill-based; no hierarchy implied |

  ---

  #### **Timeline (75 min total)**

  | Minutes | Participants Do                                                                 | Facilitator Says (Exact Wording)                                                                                                                                                                |
  |---------|---------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|
  | 0-5     | Listen                                                                          | "Today we’re practicing how language shapes professional communication. In small groups, you’ll write a guild memo using given terms. Later, we’ll tweak the language and see how it changes meaning." |
  | 5-10    | Form groups (6 groups of 3-4). Receive axis prompt + memo instructions.        | "Here’s your guild scenario. Write a 3–5 sentence memo using the terms as described. Focus on routine work—no need to explain the terms. Go." (Hand out prompts)                                |
  | 10-25   | Write memos (e.g., "Sunborn must renew permits; Moonborn need night-work permits"). | Circulate, nudge: "Keep it boring—this is about equipment, schedules, or training."                                                                                                             |
  | 25-30   | Swap memos with another group. Receive transplant table.                       | "Pass your memo to another group. Use this table to replace every term in their memo. Change **only** the terms—keep sentences identical." (Hand out tables)                                    |
  | 30-45   | Rewrite memo using transplant table (e.g., "Man must renew permits; woman needs night-work permits"). | "Stick to the replacement rules. If the original says ‘his gear,’ change to ‘his gear’ if unmarked or ‘her gear’ if marked."                                                                   |
  | 45-55   | Groups pair up: Group A reads original memo; Group B reads transplanted version. | "Pair with your swap group. Group A reads the **original** memo aloud. Group B reads the **rewritten** version. No context—just read."                                                          |
  | 55-60   | Class guesses which memo was "original" (fictional axis) for each pair.        | "After hearing both, vote: Which sounded like the ‘first draft’? Why?" (Take quick poll per pair; record misconceptions)                                                                        |
  | 60-75   | Debrief (see below).                                                            | "Let’s unpack what happened. First—when you heard the rewritten memos, what felt off? Why?"                                                                                                    |

  ---

  #### **Debrief (15 min): Mapping Activity Moments to Concepts**
  *Facilitator ties responses to the three marker functions using student-generated examples.*

  | Moment from Activity             | Idea It Maps To                                    | One Question to Ask                                                                 |
  |----------------------------------|---------------------------------------------------|-------------------------------------------------------------------------------------|
  | Guessing "original" was fictional axis | **Reference (1)**: Unmarked terms imply universality. | "Why did ‘Sunborn’ sound generic, but ‘man’ in the rewrite didn’t?"                |
  | Hearing "woman needs extra gear" | **Social Load (3)**: Marked terms carry baggage.  | "Why did ‘Moonborn need gear’ sound neutral, but ‘woman need gear’ sounded condescending?" |
  | Default imagery (e.g., "a Sunborn") | **Defaulting (2)**: Unmarked terms imply a "typical" member. | "When you heard ‘a Brushhand,’ who’d you picture? Did ‘a man’ feel like a neutral default?" |
  | Transplanted memo sounding absurd | **Systemic bias**: Structure matters, not intent. | "Why did the same sentence work in one context but not the other? What changed?"    |

  **Closing Reveal**: "What you built mirrors Hofstadter’s satire—taking ‘normal’ language and re-pointing it to expose bias. Today showed that ‘fixing’ reference (1) doesn’t fix defaulting (2) or social load (3)."

  ---

  #### **Failure Modes & Mitigation**

  | What Goes Wrong                     | How to Handle                                                                 |
  |-------------------------------------|-------------------------------------------------------------------------------|
  | Student picks edgy axis (e.g., race) | Pre-assign axes; say, "We’re using fictional trades to focus on language."    |
  | Refuses to read aloud               | Offer: "You can nominate a reader, or I’ll read it neutrally."                |
  | "You’re calling my grandparent a bigot" | Focus on systems: "We’re critiquing language structures, not individuals."    |
  | Groups write self-aware memos       | Circulate early: "Make this dull—like a real HR email. No commentary on terms." |
  | Transplant feels forced/funny       | Acknowledge post-activity: "Clumsy rewrites highlight how arbitrary markers are." |

  ---

  #### **What the Activity Cannot Teach**
  - The "clumsiness" of transplanted terms (e.g., "Clayhand → woman") makes bias visible *because* it’s unfamiliar—real-world markers feel "natural" through repetition.
  - Surface similarity ≠ shared mechanism (e.g., gender and race markers work differently but can overlap).
  - Historical context (e.g., why "woman" carries more social load than "Moonborn").
  - Solutions for (2) and (3) beyond minting neutral terms (e.g., representation shifts defaults).

  ---

  #### **30-Minute Version (For 6 Students)**
  - **0–5 min**: Intro (same as above).  
  - **5–10 min**: Pre-written memos (with Sunborn/Moonborn axis) distributed. Two groups.  
  - **10–20 min**: Groups transplant memos using table (Sunborn→man, Moonborn→woman).  
  - **20–25 min**: Groups read original/transplanted versions. Class guesses "original."  
  - **25–30 min**: Lightning debrief: "Why did the gender version sound wrong? What does that tell us about ‘neutral’ language?"  

  ---

