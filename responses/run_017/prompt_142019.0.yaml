  Key elements:
  - Avoid mentioning Hofstadter or satire until the debrief.
  - Use a fictional axis to create distance.
  - Students work in small groups to write a short text (memo) that reflects an unmarked/marked distinction in a fictional context.
  - Groups swap memos and use a transplant table to rewrite the text by replacing the fictional axis terms with gender terms.
  - Then, a third group tries to guess which version was the original.
  - Debrief to highlight the three functions of markers: (1) reference (who is being talked about), (2) defaulting (the unmarked form implies a typical member), and (3) social load (the marked form carries extra meaning).

  Structure of the session:

  1. Introduction (5 minutes): Set up the activity without revealing the real purpose. Frame it as an exercise in language and professional writing.

  2. Group Formation and Instructions (5 minutes): Divide into groups (about 6 groups of 3, or 5 groups of 3-4). Assign each group a fictional axis (we'll have a few pre-defined). Hand out instructions for writing a short memo.

  3. Memo Writing (15 minutes): Groups write a memo of 3-5 sentences using the given fictional axis. The memo should be a professional communication in a guild or trade context, using the unmarked and marked terms naturally.

  4. Swap and Transplant (15 minutes): Groups swap memos. Each group receives a memo from another group and a transplant table. They rewrite the memo by replacing the fictional axis terms with gender terms (using the table).

  5. Reading and Guessing (15 minutes): Groups are paired (or trios) such that Group A reads their original memo, Group B reads the transplanted version (to gender), and Group C (or the rest) listens and guesses which one is the original. Then rotate.

  6. Debrief (20 minutes): Discuss the experience, reveal the Hofstadter move, and unpack the three functions of markers using examples from the activity.

  Materials:
  - Handout with instructions for the memo writing (including the fictional axis and context).
  - Transplant table (for the rewrite step).
  - Whiteboard or projector for debrief.

  Fictional Axes: We need at least 3-4 to assign to groups. Examples:
  - Sunborn (unmarked) vs. Moonborn (marked) in a guild of astronomers.
  - Land-dwellers (unmarked) vs. Sea-dwellers (marked) in a maritime trade.
  - Highlanders (unmarked) vs. Lowlanders (marked) in a mining guild.

  Transplant Table: We will replace the fictional axis terms with gender terms. For example:
  - Unmarked term (e.g., Sunborn) becomes "man" or "he" (the unmarked gender term in English?).
  - Marked term (e.g., Moonborn) becomes "woman" or "she".

  But note: In English, the unmarked term for gender in generic contexts is often "he" or "man", but we have to be careful because the unmarked term in the fictional axis might not map perfectly. We'll use:
    Original fiction: unmarked -> marked
    Transplant to: unmarked gender (man, he) -> marked gender (woman, she)

  However, we might also consider using non-binary or other terms? But the point is to show the asymmetry, so we stick to the traditional binary for this exercise to mirror the historical asymmetry.

  Replacement Rules: Simple substitution of the terms.

  Debrief Moves: We want to connect moments from the activity to the three concepts.

  Failure Modes:
  - Someone picks an offensive axis: We pre-assign the axes to avoid this.
  - Refuses to read aloud: Have a backup plan (e.g., facilitator reads, or another group member).
  - Accusation of calling someone a bigot: Focus on the structure of language and the fact that we are critiquing systems, not individuals.

  What the activity cannot teach:
  - The transplant works partly because the new words are clumsy and funny, which highlights the arbitrary nature of the original distinctions.
  - Two axes (e.g., race and gender) can share a surface form without sharing the same mechanism of marking.

  30-minute version: Skip the memo writing and provide pre-written memos. Then do transplant and a quick debrief.

