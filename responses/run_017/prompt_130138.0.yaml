prompt: |-
  I sit on a small committee that is rewriting the eligibility criteria for a home-care program, and the draft rule turns on clauses like "clinically significant deterioration in independent functioning" and "requires substantial daily assistance." We cannot avoid vague predicates: every sharpened substitute we tried either misclassifies cases we already agree about or invites gaming. So before I read any further into the vagueness literature, I want the specification I should be holding theories to: the desiderata a theory of vagueness must meet to count as adequate for my purpose, which is not a purely theoretical one. I need a theory good enough to tell us (a) how to write a rule in vague terms while still being able to defend it to an applicant we turn down, and (b) how to reason about appeals from people who fall just outside a cutoff we ourselves imposed.

  Write that list. For each requirement, give the case or consideration behind it, and mark it as non-negotiable or as a preference of one camp. Please cover at least:

  - the forced-march sorites and the tolerance intuition, including why the tolerance premise remains compelling even to someone who has accepted a solution;
  - the intuition that there is no sharp cutoff, and the difference between denying that intuition and explaining it away;
  - higher-order vagueness: borderline borderline cases, and whether the regress can be stopped without mere stipulation;
  - disagreement between equally competent, equally well-informed judges, neither of whom is ignorant or at fault, and what the right account of that residual disagreement is;
  - predicates with several incommensurable dimensions that trade off against one another, so that a gain on one dimension can compensate for a shortfall on another;
  - the contrast cases I keep tripping over: a vague predicate versus an ambiguous one, versus a context-sensitive gradable one, versus one whose borderline cases are generated by imprecise measurement, versus one whose disputed applications come from the concept being normatively contested rather than vague;
  - embedding behaviour: negation, conditionals, the definitely operator, comparative and superlative forms, and multi-premise sorites where several dimensions shift slightly at once;
  - the fact that any usable rule must impose a sharp cutoff on a vague predicate, and whether such a cutoff is arbitrary, unjust, or merely conventional;
  - two constraints specific to our setting: path-independence (the verdict on a case should not depend on which neighbouring cases were put to the committee first, or on the order in which a docket is worked through) and diachronic stability (decisions on near cases should constrain later ones, so that something like precedent can accumulate). If a theory licenses many admissible sharpenings, it should say what makes one of them the right one to write into a rule.

  Then flag any subset of these requirements you think cannot be jointly satisfied: if the list itself turns out to be unsatisfiable, that is the most useful thing I could learn. Tell me which single requirement excludes the largest share of the standard positions, and which requirements are really one camp's commitments dressed up as desiderata. Requirements I have not thought of are welcome, provided they arrive with their motivating case. A short scorecard at the end — one line each for the epistemic view, supervaluationism, subvaluationism, degree-theoretic and fuzzy approaches, contextualism, and the view that there are no genuinely vague predicates — would be useful, but the criteria and the tensions among them are what I actually want.
reasoning: |-
  Okay, I need to help this user who's on a committee rewriting home-care eligibility criteria. They're dealing with vague terms like "clinically significant deterioration" and "substantial daily assistance" and need practical guidance on which theory of vagueness can help them write rules and handle appeals. 

  First, I should understand their core dilemma: they can't avoid vague predicates because precise definitions either misclassify cases or invite gaming. They need a theory that helps them defend decisions to rejected applicants and handle borderline appeals. The user explicitly asked for desiderata - not just theory summaries - so I'll focus on practical requirements.

  The user listed several key issues to cover: sorites paradox tolerance, no-sharp-cutoff intuition, higher-order vagueness, competent disagreement, multi-dimensional predicates, contrast cases, embedding behavior, imposed cutoffs, plus path-independence and diachronic stability from their legal context. I need to address each thoroughly.

  For the tolerance intuition requirement, I recall that even after accepting a solution to sorites, the premise remains compelling because small changes shouldn't matter. This is non-negotiable - any theory must account for why we feel this way. 

  The no-sharp-cutoff intuition is crucial too. I should emphasize the difference between denying it (claiming there is a cutoff) versus explaining why it seems there isn't one. The user needs this for defending decisions - they can't just tell applicants "there is a precise point you missed."

  Higher-order vagueness is tricky. The committee will face not just borderline cases but borderline-borderline cases. How can a theory stop the regress without arbitrary stipulation? This relates directly to their appeal process.

  Competent disagreement matters because committee members might genuinely disagree on cases without either being wrong. The theory must explain this residual disagreement, which affects consensus-building.

  Multi-dimensional predicates are central to their case - "deterioration" involves multiple factors that trade off. The theory must handle compensation across dimensions, not just single scales.

  The contrast cases help avoid misdiagnosis. I'll clarify how vagueness differs from ambiguity, context-sensitivity, measurement imprecision, and normative contestation - all common pitfalls in rule-writing.

  Embedding behavior affects how rules combine logically. Negation, conditionals, and "definitely" operators appear in regulations, so the theory must explain their behavior in borderline zones.

  The imposed cutoff requirement acknowledges that rules need operational sharpness. I need to address whether this is arbitrary or conventional - key for defending decisions.

  Their specific constraints - path-independence and diachronic stability - are vital. Precedent should accumulate, and order of consideration shouldn't affect outcomes. This may conflict with some theories' multiple-sharpening approaches.

  I suspect these requirements might be incompatible - that's what the user really wants to know. The multi-dimensional requirement combined with diachronic stability seems particularly challenging for most theories.

  For the scorecard, I'll quickly note how major theories handle these. Epistemicism posits unknowable cutoffs - good for stability but bad at explaining disagreement. Supervaluationism handles many requirements well but struggles with higher-order vagueness. Fuzzy logic handles gradience but fails embedding tests. I'll be honest about trade-offs.

  The most excluding requirement is probably explaining competent disagreement - it rules out views that make vagueness merely epistemic. Path-independence and diachronic stability will constrain contextualist approaches.

  Finally, I should add one unmentioned requirement: decision-guiding reasons. The committee needs to articulate principled reasons for cutoff placements beyond "the rule says so." This bridges theory and practice.
answer: |-
  Here is a list of desiderata for a theory of vagueness tailored to your practical needs, derived from your cases and constraints. Requirements marked **(Non-Negotiable)** are essential for defensible rule-writing and appeals. Others reflect tensions within the literature.

  ### Core Desiderata
  1.  **Handles the Sorites Paradox & Tolerance Intuition (Non-Negotiable)**
      *   **Case:** Adding one grain doesn't turn a non-heap into a heap; losing 1% of function rarely constitutes "clinically significant deterioration." Yet, enough small changes do make a difference.
      *   **Requirement:** The theory must explain why tolerance (small changes don't affect category membership) seems compelling *even after accepting the theory*, and why it fails in the long run. It must not collapse into denying the phenomenon.
      *   **Why Non-Negotiable:** Applicants will rightly challenge "Why does losing 1% *more* function make me eligible when losing 1% less doesn't?" The theory must provide a principled answer beyond "that's the rule."

  2.  **Explains the "No Sharp Cutoff" Intuition Without Denying It (Non-Negotiable)**
      *   **Case:** There seems to be no precise point where "requires substantial daily assistance" suddenly becomes true. Any specific cutoff (e.g., 4.5 hours/day vs. 4.6) feels arbitrary.
      *   **Requirement:** The theory must *explain why* this intuition arises and persists (e.g., via ignorance, semantic indecision, inherent fuzziness). It cannot simply *assert* there *is* a sharp cutoff and dismiss the intuition as mistaken perception (denial). It must account for the *feeling* of arbitrariness.
      *   **Why Non-Negotiable:** Telling an applicant "There *is* a precise point, you just didn't meet it" is legally and ethically inadequate. The theory must justify *why* a cutoff is needed despite the lack of apparent sharp boundaries in reality.

  3.  **Accommodates Higher-Order Vagueness & Stops the Regress Non-Arbitrarily**
      *   **Case:** Is a case just *barely* missing eligibility a "borderline borderline" case? Can we definitively say where the "borderline zone" itself begins and ends?
      *   **Requirement:** The theory must allow for borderline cases (1st-order vagueness) and borderline borderline cases (2nd-order vagueness). Crucially, it must provide a non-stipulative way to halt the regress (e.g., practical disengagement, fundamental epistemic limitations, context-sensitivity) or explain why infinite regress isn't practically devastating. Mere stipulation ("we stop at order N") is inadequate.
      *   **Status:** Preference (Contextualist/Epistemic camps often handle this better than strict Supervaluationism/Fuzzy Logic). Essential for fair appeals involving near-miss cases.

  4.  **Explains Competent, Faultless Disagreement**
      *   **Case:** Two equally qualified assessors, reviewing the same file, genuinely disagree on whether the deterioration is "clinically significant." Neither is ignorant of facts or misapplying the concept.
      *   **Requirement:** The theory must account for the possibility and nature of this residual disagreement. Is it about indeterminate reality (ontic)? Indeterminate meaning (semantic)? Permissible variation in judgment (contextual)? Genuine ignorance (epistemic)? It cannot imply one assessor *must* be wrong.
      *   **Status:** Non-Negotiable for committee dynamics and appeal adjudication. Ruling out faultless disagreement makes consensus impossible and appeals merely error-correction.

  5.  **Handles Multi-Dimensional, Incommensurable Predicates with Trade-offs (Non-Negotiable)**
      *   **Case:** "Clinically significant deterioration" involves mobility, cognition, continence, etc. A gain in mobility might compensate for a loss in cognition. There's no single scale.
      *   **Requirement:** The theory must model vagueness where category membership depends on a holistic assessment of multiple, potentially incommensurable factors that can compensate for each other. It cannot reduce to simple one-dimensional sorites.
      *   **Why Non-Negotiable:** Eligibility hinges on this multi-dimensional assessment. A theory only handling simple predicates (like "tall") is useless.

  6.  **Distinguishes Vague Predicates from Contrast Cases (Non-Negotiable)**
      *   **Case:** Confusing vagueness with ambiguity ("bank"), context-sensitivity ("tall" for jockey vs. basketball player), imprecise measurement ("the table is 1m long" ±1cm), or normative contestation ("just war") leads to misdiagnosis and bad fixes.
      *   **Requirement:** The theory must clearly differentiate vagueness (lack of sharp boundaries in application *even given precise context and complete information*) from these other phenomena. It must explain the unique features of vagueness (e.g., tolerance, borderline cases, sorites susceptibility).
      *   **Why Non-Negotiable:** Misdiagnosis leads to ineffective or harmful rule-writing (e.g., trying to "calibrate" a vague term like measuring a table).

  7.  **Predicts Correct Embedding Behavior**
      *   **Case:** Reasoning with negations ("Not requiring substantial assistance"), conditionals ("If deterioration is clinically significant, then..."), "definitely" operators ("Not definitely eligible, but not definitely ineligible"), comparatives ("More deteriorated than Case A"), superlatives ("The most deteriorated applicant"), and multi-premise sorites (small changes in several dimensions at once).
      *   **Requirement:** The theory must provide a logic/truth-condition assignment for complex statements involving vague predicates that aligns with competent speaker intuitions and avoids absurdities (e.g., the problem of higher-order vagueness for `Definitely`, penumbral connections in Supervaluationism, failures of intuitive tautologies in Fuzzy Logic).
      *   **Status:** Strong Preference. Essential for writing coherent rules and reasoning about cases consistently.

  8.  **Justifies Imposed Sharp Cutoffs as Non-Arbitrary/Non-Unjust (Non-Negotiable)**
      *   **Case:** The operational rule *must* have a cutoff (e.g., a specific score on an assessment tool) to be administrable, even if the underlying predicate ("needs substantial assistance") is vague.
      *   **Requirement:** The theory must explain how imposing a sharp cutoff on a vague predicate can be legitimate. Is it merely conventional? Is it discovering a pre-existing (but unknowable) cutoff? Is it a justified precisification? Crucially, it must *not* imply that the cutoff is inherently arbitrary or unjust, merely that its *exact location* might be underdetermined. It must support the defensibility of the cutoff to the applicant *just below it*.
      *   **Why Non-Negotiable:** Legality, fairness, and the core task of rule-writing depend on this.

  ### Domain-Specific Constraints
  9.  **Ensures Path-Independence (Non-Negotiable)**
      *   **Case:** Eligibility verdict for Applicant A should not change based on whether the committee reviewed very similar Applicant B (slightly better/worse) before or after A, or based on the order cases are batched.
      *   **Requirement:** The theory must ensure that the *semantic content* or *truth conditions* of the rule, combined with the facts of a case, determine eligibility independently of the history of other cases considered. It cannot make truth/judgment inherently relative to comparison class or order of presentation in a way that violates this.
      *   **Why Non-Negotiable:** Fundamental fairness and rule-of-law requirement. Outcomes must depend on the case merits and the rule, not procedural accidents.

  10. **Enables Diachronic Stability / Precedent (Non-Negotiable)**
      *   **Case:** A decision on a borderline case (e.g., granting eligibility to someone with Functional Level X) should constrain future decisions on very similar cases (Functional Level X±ε). Precedent should accumulate.
      *   **Requirement:** The theory must provide resources to explain how past decisions on borderline cases can legitimately constrain future ones, narrowing the range of permissible judgments/precisifications over time. It must allow for the "settling" of borderline zones through application.
      *   **Why Non-Negotiable:** Essential for consistent application, predictability, fairness over time, and managing appeals. A theory allowing radical re-sharpening with each new case is unusable.
      *   **Link to Cutoffs:** If a theory licenses many admissible sharpenings, it must provide principles for selecting *which* sharpening becomes "the rule" for precedent (e.g., first consistent decision, legislative imposition, expert determination).

  ### Key Tensions and Unsatisfiability
  *   **The Core Tension:** The strongest tension lies between **No Sharp Cutoff (2)** and **Imposed Cutoffs (8)**, compounded by **Diachronic Stability (10)**. Theories that robustly satisfy (2) (e.g., Fuzzy Logic, some Contextualisms) struggle to justify a single, stable, non-arbitrary cutoff (8, 10). Theories that facilitate (8, 10) (e.g., Epistemicism, some Supervaluationism) often struggle to genuinely satisfy the *explanatory* aspect of (2) without veering into denial.
  *   **Most Excluding Requirement:** **Competent Faultless Disagreement (4)** is the biggest filter. It **rules out Epistemicism** (which says there's a fact, so one party *is* wrong/ignorant) and **strongly challenges Supervaluationism** (which typically views disagreement in borderline zones as involving a mistake about what precisification is intended/appropriate, not faultless variation). Views embracing semantic indecision, contextual variation, or ontic vagueness handle (4) better.
  *   **Camp-Specific "Desiderata" Dressed Up:** The insistence that **all vagueness must be eliminable by precisification without loss** is a Supervaluationist commitment. The insistence that **vagueness must involve degrees of truth** is a Fuzzy/degree-theoretic commitment. The insistence that **there *must* be a sharp cutoff knowable in principle** is an Epistemicist commitment. Your list avoids mandating these.
  *   **Potential Unsatisfiability?** Satisfying **all** requirements simultaneously, **especially (2), (4), (8), (9), and (10) robustly**, is likely impossible for *any* extant theory. **Contextualism with Precedent** comes closest but faces significant challenges with **Path-Independence (9)** and **Multi-Dimensionality (5)**. **Refined Supervaluationism** (with mechanisms for precedent) is a contender but struggles profoundly with **Higher-Order Vagueness (3)** and **Competent Disagreement (4)**. **Robust satisfaction of (4) and (2) often weakens (8) and (10)**.
  *   **Additional Requirement: Decision-Guiding Reasons**
      *   **Case:** When denying an applicant near the cutoff, the committee needs more than "You don't meet the rule." They need principled *reasons* related to the *purpose* of the rule (e.g., "The program targets those whose deterioration creates dependency risks exceeding Y; your profile suggests risk Z, below our threshold based on factors A, B, C").
      *   **Requirement:** The theory should connect the location of the cutoff/verdict in borderline cases to the underlying *purposes*, *values*, or *functions* served by the predicate and the rule. It should help articulate *why* this degree of deterioration counts as "significant" *for this specific purpose*. (Non-Negotiable for defensibility).

  ### Theory Scorecard (1-Line Assessment vs. Requirements)
  *   **Epistemicism:** Sharp, unknowable cutoffs exist. *Fails (2, 4, 3, arguably 8's defensibility). Excels at (8, 9, 10) if cutoff known. Struggles with (5, 7).*
  *   **Supervaluationism:** Truth is supertruth over precisifications. Borderline=neither T nor F. *Fails (3 robustly, 4). Good for (1, 2 explanation, 7, 6). Okay for (8, 10) with precedent mechanism. Weak on (5, 9).*
  *   **Subvaluationism:** Borderline=both T and F (gluts). *Fails (7 embedding badly). Good for (1, 2). Poor for (4, 8, 9, 10, 5).*
  *   **Degree Theory/Fuzzy Logic:** Truth values in [0,1]. Compositional. *Fails (7 embedding paradoxes). Excels at (1, 2, 5 gradience). Poor for (4 explanation, 8, 9, 10 stability).*
  *   **Contextualism:** Extension depends on context/salient comparisons. *Excels at (1, 2, 3, 4, 6). Good for (5). Fails (9 path-independence). Struggles with (8 defensibility, 10 stability - needs precedent mechanism).*
  *   **Eliminativism (No Vague Preds):** Vagueness is illusion or misuse. *Fails (1, 2, 3, 4, 6 - catastrophically for your purpose).*

  **Recommendation for Your Task:** Prioritize theories that best handle **Multi-Dimensionality (5)**, **Competent Disagreement (4)**, and provide resources for **Diachronic Stability/Precedent (10)** and **Decision-Guiding Reasons (Added)**. **Sophisticated Contextualism** (e.g., Raffman) or **Supervaluationism augmented with a strong precedent mechanism and purpose-based precisification** are the most promising, though neither is perfect. Focus on integrating the rule's *purpose* explicitly into criteria to guide borderline judgments and justify cutoffs. Acknowledge the inherent vagueness to applicants, explain the *purpose-driven rationale* for decisions near the cutoff, and implement a robust precedent system for appeals.
