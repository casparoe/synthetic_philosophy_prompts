prompt: |-
  I moderate a large public peer-support forum for people with a chronic condition. Members trade treatment experiences, and a real number of them make real medical decisions on the strength of what they read here. About once or twice a month my volunteer moderator team — no formal training, an hour or two per decision, access to nothing but what is publicly posted — has to decide whether a particular subforum has developed an epistemic problem and, if so, what to do. Interventions are expensive: clumsy ones trigger mass exits and confirm whatever the members already suspected about us.

  Please write the procedure my team should run on a proposal to intervene. Ground it in the distinction now standard in social epistemology between an epistemic bubble and an echo chamber. In a bubble, members are missing relevant evidence and argument because of structural filtering — whom they follow, what the ranking algorithm shows them, whose word they take for what is worth reading — not because they distrust outside sources; they generally have no settled view of those sources, and supplying the missing material through a voice they already trust tends to work. In an echo chamber, members have met the outside sources and have been given, in advance, reasons to discredit them; the discrediting is general rather than claim-by-claim, it is part of what membership consists in, and pressing more outside material at them tends to be absorbed as further evidence of the corruption of the outside. Escape then requires rebuilding trust in some specific outside voice, which the moderators cannot do themselves, since we are already inside the discrediting story.

  The complication I want the procedure to handle is a pattern I keep seeing that fits neither description. Call it translation loss for now: the outside material is present in the thread, the sources are cited approvingly and trusted, nobody is accused of bad faith — but the community has a standing rule that an outside finding must be re-expressed in the community's own framework before it counts as understood, and the re-expression systematically downgrades the finding's strength. No benefit on average becomes benefit for a subtype like us; probably false becomes emerging; the trial was underpowered becomes the trial was too small to pick up the effect we are all seeing. Information is present, trust is intact, and nothing updates.

  Requirements:

  1. An ordered set of questions, each with an explicit statement of what counts as a sufficient answer, using only evidence available from public posts. The procedure must be run per topic, not per community, since the same subforum may be a bubble about one treatment and a chamber about another.
  2. Observable markers that discriminate the three patterns, and an explicit stop rule for when the markers conflict or come out mixed.
  3. Clear stopping points: where the procedure returns a no, where it returns do nothing, and where it hands the decision to a person because the remaining question is one of values rather than fact. Include exposure is contraindicated here as a possible outcome, with the reasoning.
  4. An intervention menu keyed to the diagnosis, each entry saying what it costs and what it would look like if it were working.
  5. Everything must be defensible publicly to the members, so no step may rest on private data or on claims about members' psychology that could not be supported from the posts themselves.
  6. Honesty about which steps are judgment calls dressed up as procedure, and about what this procedure cannot see at all — I am thinking of a chamber that has learned to perform openness, and of a bubble that is perfectly fine and should be left alone.

  Then run the finished procedure on three cases and keep the runs in character: (a) a subforum where mainstream clinical guidance never appears, where a member who once linked a national health service page got a couple of polite replies and no hostility, and where people say things like my specialist never mentioned that; (b) a treatment-skeptical parenting group that quotes official health guidance at length and at its own initiative, mainly to show that the guidance convicts itself, with a shared vocabulary for reading official statements and a detailed account of why every relevant body is compromised; (c) the translation-loss pattern above, in a subforum built around a single explanatory framework for the condition, where high-quality evidence is posted and praised every week and the community's restatements of it reliably remove its force.

  Be committed throughout. Take a definite position at every branch, give your reasons, and where the diagnosis is genuinely uncertain mark your confidence and say what would settle it. In particular, tell me plainly whether my third pattern is a genuine third failure mode or whether it collapses into one of the other two — if it collapses, say which, why, and what follows for what I should do about it, rather than manufacturing a category to accommodate me. Include at least one case where the procedure tells me to stop or do nothing despite my instinct to intervene, and do not quietly rescue that case to make the procedure look better than it is. Please write in American English.
reasoning: |-
  We are designing a procedure for moderators to diagnose epistemic problems in a subforum (per topic) and decide on interventions. The three patterns are:
  1. Epistemic Bubble: Missing relevant evidence due to structural filtering, not distrust. Fixable by introducing missing evidence through trusted voices.
  2. Echo Chamber: Actively distrusts outside sources; general discrediting of external information. Harder to fix; requires rebuilding trust in an external voice.
  3. Translation Loss: Outside evidence is present and trusted, but systematically reinterpreted in the community's framework to downgrade its strength.

  The procedure must be an ordered set of questions, with clear criteria and stopping points. We must also provide observable markers to distinguish the patterns and an intervention menu.

  ### Procedure Structure
  We will have a flowchart of questions. Each question must be answerable from public posts and have explicit criteria for a sufficient answer.

  #### Ordered Questions for a Given Topic in a Subforum
  1. **Is there evidence of missing relevant external information?**
     - *What to look for*: Scan recent discussions (e.g., last 50 posts) for the topic. Check if mainstream or high-quality external sources (e.g., clinical guidelines, major studies) are mentioned. Also look for expressions of ignorance (e.g., "I've never heard of that", "My doctor never mentioned it").
     - *Sufficient evidence for "yes"*: At least 3 independent posts (by different users) in the last month expressing that they were unaware of a specific piece of external information that is relevant and established. Or, if no one has ever posted a particular high-quality source (e.g., a major guideline) that is directly relevant to the topic, despite the topic being discussed frequently.
     - *Sufficient evidence for "no"*: The external information is present (e.g., linked, discussed) in the subforum's recent history, or there is no indication of ignorance.

  2. **Is there evidence of active distrust or discrediting of external sources?**
     - *What to look for*: Look for patterns of response when external sources are cited. Check for ad hominem attacks on the sources, general claims of corruption, or systematic reasons provided to dismiss the source without engaging with the content (e.g., "They are all paid by pharma", "The government is lying").
     - *Sufficient evidence for "yes"*: At least 3 independent posts (by different users) in the last month that dismiss an external source without addressing the specific claim, using generalized distrust. Or, a shared vocabulary for discrediting (e.g., "mainstream medicine", "big pharma shill") used consistently in the subforum for the topic.
     - *Sufficient evidence for "no"*: External sources are sometimes criticized but on specific grounds (e.g., "this study had a small sample size") or are often accepted.

  3. **Is there evidence of systematic downgrading of external evidence during re-expression?**
     - *What to look for*: When external evidence is posted, track how it is discussed. Look for a pattern where the community's restatement of the evidence consistently reduces its strength (e.g., turning "no benefit" into "might help some", or "inconclusive" into "promising"). Also note if the subforum has a shared framework (e.g., a particular theory of the condition) that is used to reinterpret the evidence.
     - *Sufficient evidence for "yes"*: At least 3 clear instances (by different users) in the last month where a specific external claim is restated in a way that weakens its original conclusion, and the restatement uses the community's framework. The restatement must be accepted without challenge by the community (i.e., no one corrects it by pointing to the original).

  ### Discriminatory Markers and Stop Rules
  - **Bubble**: Missing info (Q1=yes), no active distrust (Q2=no), and no systematic downgrading (Q3=no). But note: if Q1=yes and Q2=no, we are in bubble territory. However, if Q3=yes, that might complicate.
  - **Echo Chamber**: Missing info (Q1=yes) AND active distrust (Q2=yes). The downgrading (Q3) might be present but is secondary.
  - **Translation Loss**: External info present (Q1=no) AND no active distrust (Q2=no) BUT systematic downgrading (Q3=yes).

  **Stop Rule for Conflicts/Mixed Markers**:
  - If Q1=yes and Q2=no and Q3=yes: This is a mix. We might have a bubble with translation loss? But the bubble is defined by missing info, so if the info is missing (Q1=yes) but when it does appear it gets downgraded (Q3=yes), then it's still a bubble? However, the procedure must be per topic. We must decide: 
    - If Q1=yes, then we are in either bubble or echo chamber. Then Q2 tells us which.
    - Q3 is for when Q1=no (i.e., info is present) but it's being distorted. So:
      - If Q1=yes and Q2=no → Bubble
      - If Q1=yes and Q2=yes → Echo Chamber
      - If Q1=no and Q2=no and Q3=yes → Translation Loss
      - If Q1=no and Q2=no and Q3=no → No problem (do nothing)
      - If Q1=no and Q2=yes → This is a conflict? Because if the info is present (Q1=no) but there is active distrust (Q2=yes), then why is the info present? It might be that the community is posting outside info only to discredit it. That fits echo chamber behavior. But in an echo chamber, we might expect that the info is sometimes missing (because they avoid it) but sometimes they bring it up to attack it. So we should adjust:
        - Actually, in an echo chamber, the info is not necessarily missing (Q1=no) because they do engage with it to discredit it. So our Q1 might be too simplistic.

  We must redefine:

  **Revised Markers**:
  - **Epistemic Bubble**: 
    - *Marker*: Absence of relevant external information (Q1=yes) and no active distrust (Q2=no). Trust is intact when the information is introduced.
  - **Echo Chamber**: 
    - *Marker*: Active distrust of external sources (Q2=yes). The information might be absent (Q1=yes) or present (Q1=no) but only to discredit it. The key is the distrust.
  - **Translation Loss**: 
    - *Marker*: External information is present (Q1=no) and there is no active distrust (Q2=no) but there is systematic downgrading (Q3=yes).

  Therefore, we adjust the questions:

  1. **Is relevant external information absent? (Q1)**
     - *Yes*: The information is missing in recent discussions (criteria as above).
     - *No*: The information is present.

  2. **Is there active distrust of external sources? (Q2)**
     - *Yes*: As above.
     - *No*: No active distrust.

  3. **Is there systematic downgrading of external evidence? (Q3)**
     - *Yes*: As above.
     - *No*: No downgrading.

  Then:
  - If Q1=yes and Q2=no → Bubble
  - If Q2=yes → Echo Chamber (regardless of Q1, because even if the info is present, they are discrediting it)
  - If Q1=no and Q2=no and Q3=yes → Translation Loss
  - If Q1=no and Q2=no and Q3=no → No problem

  But what if Q1=yes and Q2=yes? Then it's echo chamber. And if Q1=no and Q2=yes? Also echo chamber.

  So the key is: Q2=yes overrides and leads to echo chamber. Then, if Q2=no, we look at Q1 and Q3.

  **Stop Rule**:
  - If the answers are mixed in a way not covered, then the diagnosis is uncertain. For example, if Q1=no and Q2=no and Q3=no, we stop and do nothing. If we have Q2=yes, we go to echo chamber. But what if we have Q3=yes and also Q2=yes? Then it's echo chamber, and the downgrading is part of the discrediting. We don't need to separate.

  So the procedure:

  1. **Check for active distrust (Q2)**. If yes → Echo Chamber.
  2. **If no active distrust, check for absence of information (Q1)**. 
     - If Q1=yes → Bubble.
     - If Q1=no, then check for systematic downgrading (Q3).
        - If Q3=yes → Translation Loss.
        - If Q3=no → No problem.

  This ordering makes sense because distrust (Q2) is the hallmark of an echo chamber and the most severe.

  ### Clear Stopping Points
  - **No intervention (do nothing)**: If we end at "No problem".
  - **Intervention needed**: For Bubble, Echo Chamber, or Translation Loss.
  - **Exposure contraindicated**: This is a possible outcome where the intervention might do more harm than good. We must decide when to avoid intervention. For example, in an echo chamber, pressing external material might backfire. But we still need to intervene? We'll handle in the intervention menu.

  Also, we must have a point where we hand off to a person because the question is one of values. For example, if the procedure identifies a problem, but the intervention decision involves trade-offs that require human judgment (e.g., risk of mass exit vs. harm from misinformation), then we flag that.

  But the procedure is for diagnosis. Then the intervention menu is keyed to the diagnosis. The decision to intervene might still require a judgment call about the cost.

  So:
  - If the procedure returns "No problem", then do nothing.
  - If it returns Bubble, Echo Chamber, or Translation Loss, then we proceed to the intervention menu, but we must also consider if intervention is contraindicated.

  **Contraindication Criteria** (to be assessed after diagnosis):
  - The potential harm of the intervention (e.g., triggering mass exits, reinforcing distrust) outweighs the benefit of correcting the epistemic problem. This is a values judgment and must be done by a human.

  ### Intervention Menu
  For each diagnosis, we suggest interventions with costs and success markers.

  1. **Bubble**:
     - *Intervention*: Introduce the missing evidence through a trusted community member (e.g., a respected regular) or through an official moderator post that is neutral and informative. Do not force; just make the information available in a non-confrontational way.
     - *Cost*: Low to moderate. Requires identifying a trusted member or crafting a careful post. Risk of backlash if done clumsily.
     - *Success Marker*: The information is discussed without hostility and is integrated into future conversations (e.g., referenced by members in subsequent posts).

  2. **Echo Chamber**:
     - *Intervention*: Avoid directly confronting with external sources. Instead, focus on building trust in a specific external voice that is already somewhat respected (if any). Alternatively, use internal contradictions or appeals to shared values. If there is no trusted external voice, then the only option might be to contain the spread (e.g., limit the topic or label posts as opinion) and wait for an opportunity.
     - *Cost*: High. Hard to do without triggering backlash. Requires subtlety and time.
     - *Success Marker*: A reduction in the use of generalized discrediting language and a willingness to consider specific external claims without immediate dismissal.

  3. **Translation Loss**:
     - *Intervention*: Gently correct the restatements by pointing to the original source and the discrepancy. Encourage members to engage with the original strength of the evidence. Do this through respected members or moderators by asking clarifying questions (e.g., "The study says X, but you said Y. Can you help me understand the difference?").
     - *Cost*: Moderate. Risk of being seen as nitpicking or undermining the community framework.
     - *Success Marker*: Restatements become more accurate, and the community shows awareness of the downgrading pattern (e.g., self-correction).

  ### Honesty About Judgment Calls
  - The procedure requires judgment in counting posts (e.g., what counts as "systematic downgrading") and in assessing the presence of information or distrust. We must note that.
  - It cannot see:
    - A chamber that has learned to perform openness (i.e., they mimic bubble behavior but are actually a chamber). This might be detected by looking at the substance of the engagement: if they engage only to dismiss, then it's still distrust.
    - A bubble that is healthy (e.g., they don't discuss mainstream treatments because they are focused on alternative treatments that are not covered by mainstream, but without distrust). The procedure might flag it as a bubble, but if there is no harm (e.g., the topic is not one where mainstream has relevant info) then we might not intervene. But the procedure is per topic, so if the topic is "alternative treatments" and mainstream doesn't cover it, then Q1=no (because the info isn't missing; it's not relevant) → then no problem. But if the topic is "treatments for symptom X" and mainstream has info but it's missing, then Q1=yes.

  ### Is Translation Loss a Genuine Third Failure Mode?
  Yes, it is distinct because:
  - In a bubble, the evidence is missing entirely.
  - In an echo chamber, the evidence is distrusted and discredited.
  - In translation loss, the evidence is present and trusted but systematically misinterpreted.

  It does not collapse into the others because the mechanism is different: it's a problem of interpretation within a framework, not of access or trust.

  Therefore, it requires a different intervention: not introducing evidence (it's already there) nor rebuilding trust (trust is there), but correcting the interpretive lens.

  ### Running the Procedure on Cases

  #### Case (a): 
  Subforum where mainstream clinical guidance never appears, polite replies to a link, members say "my specialist never mentioned that".

  - **Q2 (distrust)**: Look for active distrust. The member who linked a national health service page got polite replies and no hostility. No evidence of discrediting. → Q2=no.
  - **Q1 (absence)**: Mainstream guidance never appears, and members express ignorance (e.g., "my specialist never mentioned that"). → Q1=yes.
  - Then we don't need Q3 because we have Bubble.

  **Diagnosis**: Epistemic Bubble.

  **Intervention**: Introduce the missing information through a trusted member or a neutral moderator post. Cost: low. Success: mainstream guidance starts being discussed and referenced.

  **Contraindication?** Low risk because there's no hostility. Proceed.

  #### Case (b):
  Treatment-skeptical parenting group that quotes official health guidance to show it convicts itself, shared vocabulary for discrediting, detailed account of why every body is compromised.

  - **Q2 (distrust)**: They actively discredit the sources (e.g., "convicts itself", "compromised"). Shared vocabulary of discrediting. → Q2=yes.

  **Diagnosis**: Echo Chamber.

  **Intervention**: Avoid pressing external material. Focus on internal inconsistencies or shared values. Cost: high. Success: reduction in discrediting language.

  **Contraindication?** High risk of backlash. Moderators must weigh the harm of misinformation against the risk of mass exit. This is a values judgment: if the misinformation is causing immediate harm (e.g., refusing life-saving treatment), intervention might be warranted despite risks. Otherwise, containment might be better.

  #### Case (c):
  Translation loss: subforum built around a single explanatory framework, high-quality evidence posted and praised, but restatements downgrade it.

  - **Q2 (distrust)**: No active distrust. Sources are cited approvingly and trusted. → Q2=no.
  - **Q1 (absence)**: The evidence is posted and praised → present, so Q1=no.
  - **Q3 (downgrading)**: Restatements systematically remove the force (e.g., change "no benefit" to "might help some"). At least 3 instances. → Q3=yes.

  **Diagnosis**: Translation Loss.

  **Intervention**: Gently correct restatements by pointing to the original. Use questions to clarify. Cost: moderate. Success: more accurate restatements.

  **Contraindication?** Moderate risk. If the framework is central to the community, challenging it might cause friction. But since trust is intact, it's less risky than in an echo chamber.

  ### Case Where We Do Nothing
  Suppose a subforum about a very specific symptom where mainstream medicine has little to say. The topic is discussed, and members share their experiences. External information is sometimes posted (e.g., a small study) and discussed without downgrading or distrust.

  - Q2: no distrust → no.
  - Q1: is mainstream info absent? But if there isn't much mainstream info, then absence is expected → we might say Q1=no (because there's no relevant info to be missing) or Q1=yes? 

  We need to define "relevant external information". It must be information that exists and is pertinent to the topic. If it exists but is not present in the subforum, then Q1=yes. If it doesn't exist (e.g., no studies on this rare symptom), then Q1=no.

  So in such a case:
  - Q2=no
  - Q1=no (because there is no missing relevant info; it doesn't exist)
  - Then we go to Q3: if external info is sometimes posted (like the small study) and it's not downgraded, then Q3=no.

  Diagnosis: No problem. Do nothing.

  But if the moderator thought to intervene because the community is relying on anecdotal evidence, the procedure says no because there is no external info to provide. So we do nothing.

  ### Final Procedure

  **Procedure for Topic T in Subforum S:**

  1. **Active Distrust (Q2)**: 
     - Review recent posts (last 50 or last month) about T for evidence of active distrust of external sources. Look for:
       - Generalized discrediting (e.g., "big pharma", "corrupt officials").
       - Dismissal of sources without engaging specific claims.
       - Shared vocabulary of distrust.
     - *Sufficient for "yes"*: At least 3 posts by different users that exhibit this pattern in the last month.
     - *If yes* → Diagnosis: Echo Chamber. Go to Intervention Menu for Echo Chamber.
     - *If no* → Proceed to Q1.

  2. **Absence of Relevant External Information (Q1)**:
     - Determine if there is established, relevant external information (e.g., clinical guidelines, major studies) that should be expected in discussions of T.
     - Review the same recent posts. Look for:
       - Expressions of ignorance (e.g., "I didn't know that", "Why didn't my doctor tell me?").
       - Absence of any mention of key sources (e.g., a major health body's recommendation) despite the topic being discussed.
     - *Sufficient for "yes"*: At least 3 posts expressing ignorance about a specific piece of external info, OR the key source has never been mentioned in the subforum for T despite being highly relevant and the topic being active.
     - *If yes* → Diagnosis: Epistemic Bubble. Go to Intervention Menu for Bubble.
     - *If no* → Proceed to Q3.

  3. **Systematic Downgrading (Q3)**:
     - Review instances where external evidence was posted and discussed. Look for:
       - Restatements that weaken the original claim (e.g., "no benefit" becomes "might help some").
       - Use of the community's framework to reinterpret the evidence.
       - Acceptance of the restatement without correction.
     - *Sufficient for "yes"*: At least 3 clear instances by different users in the last month.
     - *If yes* → Diagnosis: Translation Loss. Go to Intervention Menu for Translation Loss.
     - *If no* → Diagnosis: No problem. Stop and do nothing.

  **After Diagnosis**:
  - For each diagnosis, consider contraindication:
     - Evaluate the risk of intervention (e.g., mass exit, backlash) vs. the harm of the epistemic problem. This is a values judgment and must be made by a human moderator, considering the severity of the misinformation and the community's likely reaction.
     - If intervention is contraindicated, then do nothing and monitor.
     - Else, choose an intervention from the menu.

  **Intervention Menu**:
  - **Bubble**:
    - *Action*: Introduce missing information through trusted voices or neutral moderator posts.
    - *Cost*: Low to moderate.
    - *Success Marker*: The information is integrated into discussions (referenced in later posts without hostility).
  - **Echo Chamber**:
    - *Action*: Avoid direct confrontation. Use internal contradictions or shared values. Contain the topic if necessary.
    - *Cost*: High.
    - *Success Marker*: Reduced use of discrediting language and openness to specific claims.
  - **Translation Loss**:
    - *Action*: Gently correct restatements by referencing the original. Use Socratic questioning.
    - *Cost*: Moderate.
    - *Success Marker*: More accurate restatements and community self-correction.

  **Honesty**:
  - Judgment is required in:
     - Deciding what counts as "relevant external information" (Q1).
     - Identifying "systematic downgrading" (Q3) — it might be subtle.
     - Counting posts: the numbers (3) are arbitrary and might need adjustment based on subforum size.
  - The procedure cannot detect:
     - Echo chambers that performatively engage with external sources (but if they engage only to discredit, Q2=yes).
     - Healthy bubbles (if the topic doesn't require external info, then Q1=no and we stop).
     - Translation loss that is not captured in the restatements (e.g., if the downgrading is implicit).

  Now, we run the cases as per the procedure.
answer: |-
  ### Epistemic Health Assessment Procedure for Peer-Support Moderators  
  **Purpose**: Diagnose epistemic problems in a specific subforum topic (e.g., a treatment, theory, or claim) and recommend evidence-based interventions. Grounded in social epistemology (epistemic bubbles vs. echo chambers) with a third category for "translation loss."  

  ---

  #### **Step-by-Step Procedure**  
  *Rules*:  
  - All evidence must come from public posts (last 30–60 days, or 50+ topic-relevant posts).  
  - Diagnose per topic, not whole subforum (e.g., "Treatment X" or "Theory Y").  
  - If markers conflict, stop and escalate to human judgment (Step 5).  

  **1. Check for Active Distrust of External Sources**  
     - *Question*: Do members dismiss external sources (e.g., medical guidelines, studies) with **generalized discrediting claims**?  
     - *Sufficient "Yes"*: At least 3 posts from 3 users with:  
       - Blanket accusations (e.g., "All regulators are corrupt," "Doctors are paid liars").  
       - Preemptive rejection of sources (e.g., "Anything from [Institution] is garbage").  
       - Shared vocabulary framing sources as inherently untrustworthy (e.g., "mainstream propaganda").  
     - *Sufficient "No"*: Criticisms are claim-specific (e.g., "This study’s sample size is small") or sources are cited neutrally/positively.  
     - *Stop Here If*:  
       - **Yes** → Proceed to Step 4 (Echo Chamber).  
       - **No** → Go to Step 2.  

  **2. Check for Absence of Relevant External Information**  
     - *Question*: Is **high-quality external evidence** (e.g., clinical guidelines, major studies) consistently missing from discussions?  
     - *Sufficient "Yes"*:  
       - Key sources (e.g., WHO, national health service) are never cited, or  
       - At least 3 posts from 3 users express ignorance (e.g., "My specialist never mentioned this," "I’ve never seen this data").  
     - *Sufficient "No"*: External evidence is regularly posted and discussed (even if criticized fairly).  
     - *Stop Here If*:  
       - **Yes** → Proceed to Step 4 (Epistemic Bubble).  
       - **No** → Go to Step 3.  

  **3. Check for Systematic Downgrading of External Evidence**  
     - *Question*: When external evidence is posted, is it **re-expressed in the community’s framework to weaken its conclusions**?  
     - *Sufficient "Yes"*: At least 3 instances from 3 users where:  
       - Original claims are distorted to fit community beliefs (e.g., "no benefit" → "may help subtypes like us"; "inconclusive" → "promising but understudied").  
       - Restatements are accepted uncritically by the community.  
       - Community rules/frameworks enforce reinterpretation (e.g., "We must reframe all science through [Theory Z]").  
     - *Stop Here If*:  
       - **Yes** → Proceed to Step 4 (Translation Loss).  
       - **No** → **No intervention needed**. Topic is epistemically healthy.  

  **4. Diagnose Failure Mode**  
     - **Epistemic Bubble** (from Step 2): Missing evidence, no distrust.  
     - **Echo Chamber** (from Step 1): Active distrust, evidence missing or present but discredited.  
     - **Translation Loss** (from Step 3): Evidence present, no distrust, but systematically weakened.  
     - *Conflict/Mixed Markers*: If evidence contradicts diagnosis (e.g., Q1=yes but Q3=yes), **stop and escalate to Step 5**.  

  **5. Human Judgment Escalation Point**  
     - *When*: Diagnosis is unclear (mixed markers), or intervention risks outweigh benefits.  
     - *Values-Based Questions to Answer*:  
       - How severe is the harm if misinformation persists? (e.g., life-threatening decisions).  
       - How likely is intervention to trigger backlash (e.g., mass exits, conspiracy reinforcement)?  
     - *Outcomes*:  
       - **Intervene** → Use menu below.  
       - **Exposure Contraindicated** → Do nothing. Risk of harm (e.g., reinforcing echo chambers) exceeds benefit. Monitor silently.  
       - **Uncertain** → Gather more data (e.g., track 2 weeks of posts for Q3 markers).  

  ---

  #### **Intervention Menu**  
  *Cost Levels*:  
  - **Low**: Minimal backlash risk, <2 hours effort.  
  - **Moderate**: Some backlash risk, 2–5 hours effort.  
  - **High**: High backlash risk, >5 hours effort.  

  | Diagnosis          | Intervention                                  | Cost     | Success Markers (Publicly Observable)                     |  
  |--------------------|----------------------------------------------|----------|----------------------------------------------------------|  
  | **Epistemic Bubble** | Introduce evidence via trusted voices. E.g., ask respected members to share NIH links in their own words. | Low | External sources cited organically in 5+ posts within 2 weeks. |  
  | **Echo Chamber**   | Avoid external evidence. Host AMAs with "boundary spanners" (e.g., a skeptical-but-respected patient-advocate doctor). | High | Reduced discrediting language (e.g., 50% fewer "corrupt" claims in 1 month). |  
  | **Translation Loss** | Challenge restatements with sourced quotes. E.g., "The study says X, but you said Y. Can we reconcile this?" | Moderate | Restatements align with original evidence in 3+ threads (e.g., "no benefit" not softened to "may help some"). |  

  ---

  #### **Honest Limitations**  
  - **Judgment Calls Dressed as Procedure**:  
    - Q1/Q3 thresholds (3+ posts) are arbitrary; smaller subforums may need manual adjustment.  
    - "High-quality evidence" requires moderator consensus on what counts (e.g., NIH = high-quality; blog = low-quality).  
  - **Blind Spots**:  
    - **Echo chambers performing openness**: May pass Q1 (post external sources) but fail Q2 (discredit them). *This is still an echo chamber*; trust Step 1.  
    - **Healthy bubbles**: No external evidence (Q1=yes) but no harm (e.g., topic is niche/novel). Step 2 "No" if evidence doesn’t exist.  
    - **Translation loss without frameworks**: Downgrading may be subconscious. If no "shared rules," Q3 may miss it.  

  ---

  ### **Is Translation Loss a Genuine Third Failure Mode?**  
  **Yes**, and here’s why:  
  - **Bubbles** lack access to evidence; **echo chambers** reject evidence via distrust; **translation loss** accesses and trusts evidence but corrupts it through reinterpretation.  
  - **Collapse Test**: If translation loss were an echo chamber, Q1 would show distrust (it doesn’t). If a bubble, evidence would be missing (it isn’t).  
  - **Implication**: Interventions must target *interpretation*, not access or trust. Correct restatements, not sources.  

  ---

  ### **Procedure Runs on Cases**  
  *Evidence sourced only from public posts; all diagnoses per topic.*  

  #### **Case (a): Mainstream Guidance Absent, No Hostility**  
  - **Step 1 (Distrust?)**: No. Member linked NHS page, got polite replies. No discrediting language. → **No**.  
  - **Step 2 (Absence?)**: Yes. Mainstream guidance never appears; posts like "my specialist never mentioned that" (≥3 users). → **Yes** → **Epistemic Bubble**.  
  - **Intervention**: Low-cost. Ask trusted members to share NHS guidelines.  
  - **Why Not Intervene?** No distrust; low backlash risk. Success if NHS cited in 2+ posts.  
  - **Commitment**: Bubble, not translation loss. Evidence missing, not distorted.  

  #### **Case (b): Treatment-Skeptical Parents, Actively Quote Guidance to Discredit**  
  - **Step 1 (Distrust?)**: Yes. Quotes official guidance "to show it convicts itself"; shared terms like "compromised bodies" (≥3 users). → **Yes** → **Echo Chamber**.  
  - **Intervention**: High-cost. Host AMA with a parent-friendly integrative MD. Contraindicated if mass exit risk is high.  
  - **Why Stop Here?** Q1 irrelevant—distrust overrides. Pressing evidence backfires.  
  - **Commitment**: Classic echo chamber. Q2=yes is decisive.  

  #### **Case (c): Framework-Driven Subforum, Evidence Praised but Downgraded**  
  - **Step 1 (Distrust?)**: No. Sources cited approvingly; no accusations of bad faith. → **No**.  
  - **Step 2 (Absence?)**: No. High-quality evidence posted weekly. → **No**.  
  - **Step 3 (Downgrading?)**: Yes. Restatements weaken evidence (e.g., "underpowered" → "too small for our effect"; ≥3 users). → **Yes** → **Translation Loss**.  
  - **Intervention**: Moderate-cost. Moderators post: "The JAMA study says X, but your summary says Y. Let’s discuss."  
  - **Why Not Do Nothing?** Evidence is trusted but neutered; intervention corrects interpretation.  
  - **Commitment**: Genuine third failure mode. Not a bubble (evidence present) or chamber (trust intact).  

  ---

  ### **Case Where Procedure Says "Do Nothing" Despite Instinct**  
  **Scenario**: Subforum discusses a rare treatment with little published evidence. Members rely on anecdotes but express openness ("If a study exists, we’d love to see it!"). Moderator worries about misinformation.  
  - **Step 1**: No distrust → **No**.  
  - **Step 2**: Absence? No relevant external evidence exists (topic too novel/niche). → **No**.  
  - **Step 3**: No downgrading (no evidence to downgrade) → **No intervention needed**.  
  - **Why Commit?** Not a bubble—no evidence is missing because none exists. Healthy if members acknowledge uncertainty.  
  - **No Rescue**: Procedure can’t manufacture problems. Intervention would waste resources and annoy members.  

  **Final Output**: Diagnosis + intervention menu. Always document rationale publicly (e.g., "We found 3 posts discrediting the CDC, so we hosted an AMA per our protocol").
