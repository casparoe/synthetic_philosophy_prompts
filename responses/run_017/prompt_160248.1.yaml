prompt: |-
  I hold a particular, sharpened version of the extended mind thesis, which I'll call the surrogate-substitution version. Its test is this: an external resource counts as a constituent of a subject's cognitive process just in case replacing it with an internal surrogate — a neurally realized structure with the same input–output profile, the same failure modes, and the same characteristic error signature — would not change what kind of cognitive process it is. The point of the test is to rescue the parity principle from triviality: rather than asking whether a notebook or a phone plays "the same functional role" as an internal store, which almost any external aid can be said to do, we ask whether the errors transfer. The view then commits itself to something checkable: a genuinely extended cognitive system should exhibit the error profile of the capacity it extends — reconstruction effects, interference, systematic distortion under load — at the level of the coupled system, and not merely inside the skull.

  Tell me what would count against this, ranked from fatal to merely awkward, and be explicit about which defeaters a defender of the view should concede and which they would rightly dismiss.

  I want the empirical exposure mapped first: what pattern of results would be decisive, and what would only be inconvenient? Say what to make of the often-cited result that people who expect later access to information retain where to find it rather than what it says, and of the related literature on couples and teams who divide up remembering — do these show a single system with one error profile, or two agents each with their own? What observation, if someone ran the experiment, would settle it against me?

  Then the conceptual exposure: cases the surrogate-substitution test cannot describe or describes wrongly — a resource a subject uses reliably but disowns and has no metacognitive access to, a predictive system that supplies thoughts before the subject has them, resources that pass the test for storing but have no analogue for perceiving or acting. Does the test secretly work only for memory-like cases?

  Then the structural questions. Does the view collapse into the weaker claim that cognition is causally dependent on and embedded in the environment, or into the claim that we are coupled to tools — and if so, is the disagreement merely verbal? Has it been insulated by treating "cognitive" as a term of art, and is that insulation legitimate here or a symptom? Finally, two things I personally find most threatening, on which I want your honest verdict: the argument from explanatory relevance, that no working cognitive-scientific explanation needs to cite the external resource as doing representational work, so that the thesis if true is idle; and the downstream commitments, that if the notebook is part of my mind then damaging it is a harm to me and its contents are mine in a way that shifts responsibility. Are those genuine defeaters, or just costs a defender should pay?
reasoning: |-
  Okay, the user is presenting a sharpened version of the extended mind thesis called the surrogate-substitution version. They want me to critically evaluate it, ranking counterarguments from fatal to merely awkward. Let me unpack this carefully.

  First, I need to understand their core test: an external resource counts as cognitive if replacing it with an identical neural structure wouldn't change the cognitive process's nature, particularly its error profile. This is meant to rescue the parity principle from triviality. The user seems deeply invested in this formulation and wants rigorous pushback.

  Hmm, the request has three clear dimensions: empirical, conceptual, and structural challenges. For empirical counterevidence, I should consider studies like Sparrow's Google effect showing people remember locations rather than content - does this demonstrate two separate systems? What about transactive memory in couples? The key question is whether joint systems show unified error patterns or individual ones. A decisive experiment would need to induce systemic errors across brain and external resource simultaneously.

  Conceptually, I'm noticing several problem cases: unconscious tools (like a calculator we don't introspect), predictive systems that generate thoughts before awareness, and perception/action systems that don't neatly fit the memory-oriented substitution test. The test might be biased toward storage cases. 

  Structurally, I wonder if this collapses into embedded cognition - is the difference just semantic? The "cognitive" label might be stipulative. Then there are two big worries: explanatory irrelevance (do cognitive scientists actually need external resources in their models?) and normative consequences (is damaging a notebook like brain damage?).

  The user seems both defensive and genuinely open to criticism - they specifically mention finding the explanatory relevance and responsibility issues threatening. I should acknowledge where counterarguments are strong but also note where their test has resources to respond. For instance, while error profile alignment is testable, many external tools lack the rich failure modes of biological memory. And yes, the responsibility implications are probably real costs of the view rather than defeaters.

  This feels like a philosopher who's steelmanning their own position. They want the hardest challenges, so I shouldn't pull punches - but should also recognize the sophistication of their formulation. The surrogate-substitution move does avoid some triviality objections, even if other problems remain.
answer: |-
  Here's a systematic analysis of challenges to your surrogate-substitution version of the extended mind thesis (SS-EMT), ranked by severity and addressing your specified concerns:

  ---

  ### **I. Empirical Defeaters: From Decisive to Inconvenient**
  #### **Fatal: Evidence of *Systemic Decoupling***
  - **Decisive Counterexample:** An experiment demonstrating that **errors *never* propagate bidirectionally or systemically** across the brain-external resource boundary in ways matching internal cognition.  
    - *Example:* If misremembering a fact in a notebook *only* produces "not found" errors (tool failure), but *never* induces reconstruction errors, interference, or priming effects *in subsequent biological recall* for related information (unlike internal memory failures).  
    - **Why fatal?** SS-EMT predicts integrated error profiles. Isolated tool failures without cognitive "echoes" refute the core claim of systemic integration.  
    - *Your defense:* Insist on testing *only* resources deeply integrated into ongoing tasks (e.g., a musician's instrument, not a sporadically used notebook).

  #### **Severe: Sparrow's "Google Effect" & Transactive Memory**
  - **The Challenge:** People remember *where* information is stored (external meta-memory) but not *content* (Sparrow et al., 2011). Couples divide memory tasks (e.g., one remembers dates, the other passwords) but show distinct individual error profiles (e.g., semantic interference only intra-cranially).  
    - **Problem for SS-EMT:** This suggests two systems: (1) a biological system with cognitive errors, and (2) an external tool with mechanical failures. No *unified* error signature emerges (e.g., priming in one doesn’t distort recall in the other).  
    - **Settling Experiment:** If partners in a memory task *jointly* exhibit reconstruction errors for externally stored facts (e.g., conflating "July 12" with "June 12" *across both brains* due to shared interference), SS-EMT wins. If errors remain compartmentalized, it loses.  
    - *Your defense:* Argue that *coordination mechanisms* (e.g., marital arguments over misremembered dates) *are* the systemic error profile—but this stretches "error signature."

  #### **Inconvenient: Variable Integration Depth**
  - **Observation:** Error coupling is task-dependent (e.g., deep integration in expert chess players using boards vs. novices).  
    - **Awkwardness:** SS-EMT must explain why some tools pass the test only contextually, risking ad-hocness.  
    - *Your defense:* Concede cognition is *sometimes* extended—a feature, not a bug.

  ---

  ### **II. Conceptual Defeaters: Scope & Description**
  #### **Fatal: The *Unconscious Tool* Problem**
  - **Case:** A resource used reliably but disowned (e.g., a calculator embedded in a prosthetic hand; user has no metacognitive access and denies it’s "part of them").  
    - **Problem:** SS-EMT’s test may classify it as cognitive (same I/O profile as neural arithmetic), but intuition rejects this as mere *causal coupling*.  
    - *Your defense:* Double down—if error profiles align (e.g., identical arithmetic mistakes under load), it *is* cognitive. Reject intuition.

  #### **Severe: *Predictive Systems* and Temporal Asymmetry**
  - **Case:** An AI that feeds thoughts into your auditory cortex before conscious formation (e.g., "you’ll want sushi tonight" as an inner voice).  
    - **Problem:** Surrogate-substitution works for *memory* but fails for *generative* processes. Internally, thoughts arise from subconscious processes; externally, it’s intrusion. Error profiles differ (internal: Freudian slips; external: glitches).  
    - *Your defense:* Limit SS-EMT to *subpersonal* processes—but this abandons the "thought" criterion.

  #### **Awkward: *Perception-Action* Mismatch**
  - **Case:** A blind person’s cane passes the substitution test for sensory storage (e.g., vibration patterns) but has no analogue for *perceptual interpretation*.  
    - **Problem:** SS-EMT captures *input-output* but not *semantic evaluation*. Is storing cane data "cognitive" if perception remains intracranial?  
    - *Your defense:* Argue perception *is* extended if the cane’s loss causes "agnosia-like" errors. Concede partial applicability.

  ---

  ### **III. Structural Challenges: Collapse & Costs**
  #### **Threat: Collapse into Embedded Cognition?**
  - **Risk:** SS-EMT may reduce to the claim that cognition is *embedded* (heavily dependent on external resources) rather than *extended* (constitutively including them).  
    - **Verbal Dispute?** Only if "cognitive process" is defined circularly. SS-EMT avoids this by demanding error-profile parity—a substantive criterion.  
    - *Verdict:* Not fatal. SS-EMT is stronger than embedding; it forces empirical checks.

  #### **Threat: "Cognitive" as a Term of Art**
  - **Legitimacy:** Treating "cognitive" as functional (not biological) is standard in philosophy. SS-EMT’s error-profile criterion prevents triviality.  
    - **Symptom?** Only if cognitive science ignores external resources *explanatorily*. Which leads to...

  ---

  ### **IV. Your Key Threats: Verdicts**
  #### **1. Explanatory Irrelevance**
  - **Challenge:** Cognitive models (e.g., ACT-R, neural nets) explain behavior without referencing external resources as *constitutive*. Tools are inputs, not parts of computation.  
    - *Your best defense:* Point to distributed systems (e.g., ship navigation) where explanations *must* cite external states. For individuals, argue SS-EMT *predicts* error types (e.g., "notebook corruption causes reconstructive errors in planning").  
    - **Verdict:** **Cost, not defeater.** EMT reframes explanations; it doesn’t invalidate subpersonal models. Concede EMT is "idle" for some explanations but essential for others (e.g., understanding dementia + lost notebooks).

  #### **2. Normative Commitments**
  - **Challenge:** If a notebook is "mind," destroying it is brain-damage-equivalent, and its contents are "my thoughts" (raising privacy/liability issues).  
    - *Your best defense:* Embrace the consequence selectively. A notebook used per SS-EMT *is* part of your cognitive identity; damaging it *is* a harm *to you*. Reject analogies to trivial tools (e.g., a random book).  
    - **Verdict:** **Genuine cost, not defeater.** EMT always had these implications; SS-EMT makes them testable. Pay the price or limit scope.

  ---

  ### **Ranked Summary of Defeaters**
  | **Severity**       | **Defeater**                          | **Defender’s Response**                          |
  |---------------------|---------------------------------------|--------------------------------------------------|
  | **Fatal**           | Systemic error decoupling (empirical) | Concede if robust evidence emerges               |
  | **Severe**          | Predictive systems (conceptual)       | Limit scope to non-generative processes          |
  | **Moderate**        | Transactive memory decoupling         | Redesign experiments; demand deeper integration |
  | **Awkward/Cost**    | Explanatory irrelevance               | Accept as cost of reframing cognition            |
  | **Normative Cost**  | Responsibility/harm implications      | Embrace or restrict to "core" cognitive acts     |

  SS-EMT survives if:  
  1. Experiments show integrated error profiles in deeply coupled systems,  
  2. You accept its conceptual burdens (generativity problems), and  
  3. You own its normative costs. Its strength is testability—**falsifiable, not trivial**.
