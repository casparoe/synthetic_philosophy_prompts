  Step 10: Objection.

  The strongest objection is that target-robustness is unverifiable in principle because the true outcome is unobserved. This hands institutions an all-purpose excuse: they can always say that any audit based on recorded outcomes is invalid because the recording is not perfect. 

  However, an auditor who only sees the recorded outcome could still do the following: 
  - Test for within-group calibration on the recorded outcome. 
  - If that holds, then the auditor can infer that the true risk at a given score s in group g is s / d_g, but d_g is unknown. 
  - The auditor could then bound the true risk if they have bounds on d_g (for example, from external studies on recording rates). 
  - Or, the auditor could require that the institution provide evidence on the recording rates, and then adjust accordingly.

  Step 11: Two sentences.

  This case establishes that when risk scores are calibrated on a recorded proxy with differential sensitivity, the same numerical score signifies different true risks across groups, and the group that appears riskier in the record may be less risky in fact. It does not establish that such scores are necessarily unfit for use, as that depends on whether the implied true-risk gap is acceptable in context.

