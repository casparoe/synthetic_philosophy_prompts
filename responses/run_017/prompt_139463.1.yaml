  You are a formal epistemologist and decision theorist who has spent several years as a technical advisor to public agencies auditing their automated risk-scoring systems. Please think carefully before writing. Begin with a short exploratory phase in which you work out whether the construction I am about to ask for is even possible, note the degenerate cases you will have to steer around, and only then commit to numbers. Check every step of the arithmetic as you go; I will check it after you.

  I am a journalist who covers science and ideas, and I am writing a long feature about the family of impossibility results in algorithmic fairness — the familiar trilemma according to which a risk score cannot, short of degenerate cases, be simultaneously calibrated within groups and balanced across groups with respect to both error classes. Every popular treatment I can find either restates that result in the abstract or spends its energy on who established what first. I want something else: a worked case, with numbers a motivated reader can follow, that isolates a difficulty the trilemma itself does not state.

  The difficulty is this. Institutions almost never observe the outcome they care about. They observe a recorded proxy of it: arrests rather than offences, readmissions rather than clinical deteriorations, performance ratings rather than actual output, referrals rather than needs. And the recording is typically not equally sensitive across groups — the same underlying event is more likely to find its way into the record for some groups than for others. The classic impossibility results are stated relative to whichever target variable you hand them. They say nothing about the gap between the recorded target and the one that matters. I want to see, concretely, what happens when a score is asked to be fair on the recorded target and fair on the real one at the same time.

  The case I want you to build

  1. One paragraph, realistic institutional setting. Name a real kind of institution making a real decision — pretrial release, clinical triage, lending, hiring, child-welfare screening. No science fiction, no perfect predictors, no auditor with access to the true outcome, no data the institution could not plausibly hold. Specify the true outcome Y, the recorded proxy the institution trains and audits on, and describe the recording asymmetry as an institutional mechanism — patrol allocation, reviewer discretion, billing incentives, referral habits — rather than as a stipulation that the labels are biased. The asymmetry must be a difference in recording sensitivity: one group's actual positives are less likely to appear in the record.

  2. Two groups, A and B, and numbers of your own choosing, subject to these constraints: the true base rates of Y are unequal; the recording sensitivities are unequal and both strictly between zero and one; the score S is defined as the conditional expectation of the recorded outcome given the features the institution actually observes, so that it is an honest predictor of the recorded target rather than an object gerrymandered to make a point; the score takes at least three distinct values overall, with at least one value receiving positive probability in both groups, though you may use a continuous score instead if that keeps the arithmetic checkable; the predictor is imperfect; and the recorded base rates differ across groups. You may set false positives in the record to zero for simplicity, or generalise if you can keep the arithmetic hand-checkable.

  3. Show, in a small table or a short calculation, that S is calibrated on the recorded outcome within each group: the probability of a recorded positive given score s and group g equals s, for every score value and both groups. If you have included group membership among the features the score conditions on, say so, and say whether you are relying on the fact that within-group calibration then comes for free.

  4. Show that S satisfies balance for the positive class on the recorded outcome: the mean score among recorded positives is the same in both groups. Give the numbers.

  5. Show that balance for the negative class on the recorded outcome fails. If it does not, your case is degenerate — equal recorded base rates or a perfect predictor — and you must rebuild it.

  6. Here is the fourth desideratum, which I am asking you to define precisely and then break. Call it target-robustness, and understand it as two requirements: first, a given score value should carry the same risk of the true outcome in both groups; second, the group that looks riskier in the record should be the group that is riskier in fact. Show that both parts fail in your case, and quantify the failure — how large is the true-risk gap at a given score value, and by how much does the ordering of the two groups reverse between the recorded outcome and the true one.

  7. The failure must be forced rather than stipulated. State and prove the general fact your case illustrates: that any score satisfying within-group calibration on the recorded outcome, in the presence of unequal recording sensitivities, must attach different true risks to the two groups at every non-degenerate score value. Tell me whether the balance condition is doing any work here or is merely a bystander, and whether adding it or dropping it changes anything. If you think the general fact I have gestured at is false as stated, say so and give the correct one.

  8. Ablation. Identify the single feature of the case that does the work, and then show what happens when it is removed: first, equalise the recording sensitivities while holding everything else fixed; second, equalise the true base rates while holding the recording asymmetry fixed. My expectation is that the first dissolves the violation and the second does not. Correct me if I have it backwards, and explain why either way.

  9. Consistency checks, stated explicitly: every conditional probability you assert lies in the unit interval — in particular, no group's implied true risk at any score value may exceed one, and if that restricts the range your score can take, say so and choose a range that obeys it; and the true risks you compute at each score value must aggregate back to the true base rates you began with.

  10. The objection. Steelman the strongest case for the view that the recorded target is the only legitimate object of an audit: that target-robustness is unverifiable in principle, that it hands any institution an all-purpose excuse to dismiss a finding by insisting that its labels are imperfect, or that it is simply the old calibration requirement pointed at a different variable and therefore nothing new. Say which of these you find strongest, and say what, if anything, an auditor who can only see the recorded outcome could still do that would be better than ignoring the problem.

  11. Close with two sentences I can use in print: one stating what the case establishes, and one stating the strongest claim it does not establish. I do not want to overstate this, and I would rather have the honest limit from you than discover it from a critic later.

  Constraints: the scenario itself is one paragraph; the whole response stays under about fifteen hundred words. If some part of the specification turns out to be unsatisfiable jointly with the rest, say so plainly rather than fudging the numbers, and tell me which constraint you would drop. Do not give me citations, a bibliography, or suggestions for further reading — I need your own construction and your own arithmetic, not pointers to a literature I have already read.
