  Let the recording sensitivity for group g be d_g = P(R=1 | Y=1, g). 
  Assume no false positives, so P(R=1 | Y=0, g)=0.
  Then for a given group g and score s, because of within-group calibration, we have:
  s = P(R=1 | S=s, g) = P(R=1 | Y=1, S=s, g) * P(Y=1 | S=s, g) + P(R=1 | Y=0, S=s, g) * P(Y=0 | S=s, g)
  But P(R=1 | Y=0, ...)=0, and P(R=1 | Y=1, S=s, g) = d_g (assuming that given group and Y=1, R is independent of S).

  So s = d_g * P(Y=1 | S=s, g)

  Therefore, P(Y=1 | S=s, g) = s / d_g

