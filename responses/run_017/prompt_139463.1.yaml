  ### Institutional Setting
  In pretrial risk assessment, courts use a risk score to inform release decisions. The true outcome \(Y\) is whether a defendant commits a new crime during the pretrial period. The recorded outcome \(R\) is whether the defendant is arrested for a new crime. Due to differential police patrol allocation, neighborhoods with predominantly Group B residents are underpatrolled compared to those with Group A residents. Thus, actual crimes by Group B defendants are less likely to result in arrest: an arrest occurs for 90% of crimes by Group A defendants but only 60% for Group B. We assume no false arrests (\(R=0\) if \(Y=0\)) and that the score uses a binary feature \(X\) (e.g., prior arrest record) and group membership \(G\) to predict \(R\).

  ### Numerical Setup
  - **Groups**: A (overpatrolled) and B (underpatrolled).
  - **True base rates**: \(P(Y=1|A) = 0.30\), \(P(Y=1|B) = 0.40\).
  - **Recording sensitivities**: \(P(R=1|Y=1,A) = 0.90\), \(P(R=1|Y=1,B) = 0.60\).
  - **Feature \(X\) distribution** (same for both groups):
    - \(P(X=0|g) = 0.3\), \(P(X=1|g) = 0.4\), \(P(X=2|g) = 0.3\) for \(g \in \{A,B\}\).
  - **True risk by \(X\) and group**:
    - Group A: \(P(Y=1|X=0,A) = 0.1333\), \(P(Y=1|X=1,A) = 0.30\), \(P(Y=1|X=2,A) = 0.4667\).
    - Group B: \(P(Y=1|X=0,B) = 0.20\), \(P(Y=1|X=1,B) = 0.2888\), \(P(Y=1|X=2,B) = 0.7483\).
  - **Score \(S\)**: Defined as \(E[R|X,G]\), the expected value of \(R\) given \(X\) and \(G\). Computed as \(S(x,g) = P(R=1|X=x,G=g) = P(R=1|Y=1,X=x,G=g) \cdot P(Y=1|X=x,G=g)\). Since \(P(R=1|Y=1,X=x,G=g) = P(R=1|Y=1,G=g)\) (detection independent of \(X\) given \(G\)):
    - Group A: \(S(0,A) = 0.90 \times 0.1333 = 0.12\), \(S(1,A) = 0.90 \times 0.30 = 0.27\), \(S(2,A) = 0.90 \times 0.4667 = 0.42\).
    - Group B: \(S(0,B) = 0.60 \times 0.20 = 0.12\), \(S(1,B) = 0.60 \times 0.2888 = 0.1733\), \(S(2,B) = 0.60 \times 0.7483 = 0.4490\).
  - **Recorded base rates**:
    - \(P(R=1|A) = 0.27\) (from \(0.90 \times 0.30\)),
    - \(P(R=1|B) = 0.24\) (from \(0.60 \times 0.40\)).
  - The score \(S\) takes values: \(0.12\) (common to both groups), \(0.27\), \(0.42\) (Group A), \(0.1733\), \(0.4490\) (Group B).

  ### 3. Within-Group Calibration on Recorded Outcome
  Since \(S\) conditions on group and \(X\), it is calibrated on \(R\) within groups by construction: \(P(R=1|S=s,G=g) = s\) for all \(s\) and \(g\). For example:
  - At \(S=0.12\) (from \(X=0\)):
    - Group A: \(P(R=1|X=0,A) = 0.12\) (by definition).
    - Group B: \(P(R=1|X=0,B) = 0.12\).
  - At \(S=0.27\) (Group A, \(X=1\)): \(P(R=1|X=1,A) = 0.27\).
  - At \(S=0.4490\) (Group B, \(X=2\)): \(P(R=1|X=2,B) = 0.4490\).

  ### 4. Balance for Positive Class on Recorded Outcome
  Balance for positives requires \(E[S|R=1,A] = E[S|R=1,B]\).
  - **Group A**:
    - \(P(X=0|R=1,A) = \frac{P(R=1|X=0,A)P(X=0|A)}{P(R=1|A)} = \frac{0.12 \times 0.3}{0.27} \approx 0.1333\),
    - \(P(X=1|R=1,A) = \frac{0.27 \times 0.4}{0.27} = 0.4\),
    - \(P(X=2|R=1,A) = \frac{0.42 \times 0.3}{0.27} \approx 0.4667\).
    - \(E[S|R=1,A] = (0.12 \times 0.1333) + (0.27 \times 0.4) + (0.42 \times 0.4667) \approx 0.0160 + 0.1080 + 0.1960 = 0.3200\).
  - **Group B**:
    - \(P(X=0|R=1,B) = \frac{0.12 \times 0.3}{0.24} = 0.15\),
    - \(P(X=1|R=1,B) = \frac{0.1733 \times 0.4}{0.24} \approx 0.2888\),
    - \(P(X=2|R=1,B) = \frac{0.4490 \times 0.3}{0.24} \approx 0.5612\).
    - \(E[S|R=1,B] = (0.12 \times 0.15) + (0.1733 \times 0.2888) + (0.4490 \times 0.5612) \approx 0.0180 + 0.0501 + 0.2519 = 0.3200\).
  Both equal \(0.3200\), so balance holds.

  ### 5. Failure of Balance for Negative Class
  Balance for negatives requires \(E[S|R=0,A] = E[S|R=0,B]\).
  - **Group A**:
    - \(P(R=0|A) = 1 - 0.27 = 0.73\),
    - \(P(X=0|R=0,A) = \frac{(1-0.12) \times 0.3}{0.73} \approx \frac{0.264}{0.73} \approx 0.3616\),
    - \(P(X=1|R=0,A) = \frac{(1-0.27) \times 0.4}{0.73} = \frac{0.292}{0.73} \approx 0.4000\),
    - \(P(X=2|R=0,A) = \frac{(1-0.42) \times 0.3}{0.73} \approx \frac{0.174}{0.73} \approx 0.2384\).
    - \(E[S|R=0,A] = (0.12 \times 0.3616) + (0.27 \times 0.4000) + (0.42 \times 0.2384) \approx 0.0434 + 0.1080 + 0.1001 = 0.2515\).
  - **Group B**:
    - \(P(R=0|B) = 1 - 0.24 = 0.76\),
    - \(P(X=0|R=0,B) = \frac{(1-0.12) \times 0.3}{0.76} \approx \frac{0.264}{0.76} \approx 0.3474\),
    - \(P(X=1|R=0,B) = \frac{(1-0.1733) \times 0.4}{0.76} \approx \frac{0.3307}{0.76} \approx 0.4351\),
    - \(P(X=2|R=0,B) = \frac{(1-0.4490) \times 0.3}{0.76} \approx \frac{0.1653}{0.76} \approx 0.2175\).
    - \(E[S|R=0,B] = (0.12 \times 0.3474) + (0.1733 \times 0.4351) + (0.4490 \times 0.2175) \approx 0.0417 + 0.0754 + 0.0977 = 0.2148\).
  Since \(0.2515 \neq 0.2148\), balance for negatives fails. The setup avoids degeneracy: recorded base rates differ (\(0.27 \neq 0.24\)), and the predictor is imperfect (no score is 0 or 1).

  ### 6. Failure of Target-Robustness
  **Definition**: Target-robustness requires (i) at any score \(s\), \(P(Y=1|S=s,A) = P(Y=1|S=s,B)\) (equal true risk given score), and (ii) the group with higher recorded base rate also has higher true base rate.
  - **(i) Failure of equal true risk at a given score**:
    At \(S=0.12\):
    - Group A: \(P(Y=1|S=0.12,A) = P(Y=1|X=0,A) = 0.1333\) (since \(S=0.12\) implies \(X=0\)),
    - Group B: \(P(Y=1|S=0.12,B) = P(Y=1|X=0,B) = 0.20\).
    Gap: \(0.20 - 0.1333 = 0.0667\).
    Similarly, at \(S=0.27\) (Group A only): \(P(Y=1|S=0.27,A) = 0.27 / 0.90 = 0.30\), while no Group B has \(S=0.27\).
  - **(ii) Reversal of group ordering**:
    - Recorded base rates: \(P(R=1|A) = 0.27 > P(R=1|B) = 0.24\) (Group A appears riskier).
    - True base rates: \(P(Y=1|A) = 0.30 < P(Y=1|B) = 0.40\) (Group B is truly riskier).
    Reversal quantified: Recorded gap \(0.27 - 0.24 = 0.03\) (favoring A); true gap \(0.40 - 0.30 = 0.10\) (favoring B).

  ### 7. General Fact
  **Statement**: If a score is calibrated within groups on a recorded outcome \(R\), and if \(R\) has different sensitivities \(d_g = P(R=1|Y=1,g)\) across groups \(g\) (with \(0 < d_g < 1\)), then for any non-degenerate score \(s\) (where \(0 < s < 1\)), the true risk \(P(Y=1|S=s,g)\) differs between groups. Balance for positives/negatives does not affect this; it is a bystander. Adding or dropping balance conditions changes nothing for the true-risk gap.
  **Proof**: From within-group calibration, \(P(R=1|S=s,g) = s\). With no false positives (\(P(R=1|Y=0,g)=0\)), we derive:
  \[
  s = P(R=1|S=s,g) = P(R=1|Y=1,S=s,g) \cdot P(Y=1|S=s,g) = d_g \cdot P(Y=1|S=s,g),
  \]
  since \(R\) depends only on \(Y\) and \(g\) (given \(Y=1\), \(R\) is independent of \(S\)). Solving, \(P(Y=1|S=s,g) = s / d_g\). Thus, if \(d_A \neq d_B\), true risk differs at any \(s\) where \(0 < s < 1\). Balance plays no role.

  ### 8. Ablation
  - **Equalize recording sensitivities** (set \(d_A = d_B = 0.90\), holding else fixed):
    - Then \(P(Y=1|S=s,g) = s / 0.90\) for both groups at every \(s\). True-risk gap vanishes.
  - **Equalize true base rates** (set \(P(Y=1|A) = P(Y=1|B) = 0.35\), holding sensitivities fixed):
    - True-risk gap remains: \(P(Y=1|S=s,g) = s / d_g\) still depends on \(g\).
    - Recorded base rates: \(P(R=1|A) = 0.90 \times 0.35 = 0.315\), \(P(R=1|B) = 0.60 \times 0.35 = 0.21\) (A appears riskier). True base rates are equal, so no reversal, but true-risk gap persists.
  **Conclusion**: The violation is driven by unequal recording sensitivities. Equalizing true base rates does not resolve the true-risk gap at a given score, though it prevents group reversal.

  ### 9. Consistency Checks
  - **All probabilities in [0,1]**:
    - Conditional probabilities: e.g., \(P(Y=1|X=0,A)=0.1333\), \(P(X=0|R=1,A)\approx0.1333\), all between 0 and 1.
    - True risk at scores: e.g., \(P(Y=1|S=0.42,A)=0.42/0.90\approx0.4667<1\), \(P(Y=1|S=0.4490,B)=0.4490/0.60\approx0.7483<1\).
  - **Aggregation to true base rates**:
    - Group A: \(E[P(Y=1|X,A)|A] = (0.1333 \times 0.3) + (0.30 \times 0.4) + (0.4667 \times 0.3) = 0.04 + 0.12 + 0.14 = 0.30\).
    - Group B: \((0.20 \times 0.3) + (0.2888 \times 0.4) + (0.7483 \times 0.3) \approx 0.06 + 0.1155 + 0.2245 = 0.40\).

  ### 10. Objection
  The strongest objection is that target-robustness is unverifiable: auditors only observe the recorded outcome, not the true one. This grants institutions an all-purpose excuse to dismiss audits by claiming "label bias." However, an auditor can still:
  - **Bound true risks**: If external studies provide bounds on sensitivity \(d_g\) (e.g., \(d_B \geq 0.5\)), then at score \(s\), true risk for Group B is bounded by \(s / 0.5 = 2s\) (if \(d_B \geq 0.5\)). This exposes implausible true-risk gaps even without full verification.

  ### 11. Closing Sentences
  This case establishes that when a risk score is calibrated on a recorded proxy with unequal sensitivity, identical scores encode systematically different true risks across groups, and the group deemed riskiest in the record may be least risky in reality. It does not establish that such scores are always ethically or legally unacceptable, as that depends on context-specific judgments about the magnitude and implications of the gaps.
