  2. **Standard ways out**:
     a. The conditional is not a column but a query (or a function of the entire model).
     b. The conditional is a third value (like NULL) and not a standard boolean.
     c. The conditional depends on more than just A and B (it depends on context).

  3. **Residue report**: For each response, what translates cleanly, what is distorted, and what has no expression.

