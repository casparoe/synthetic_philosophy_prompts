  We are given a claim attributed to David Lewis: that you cannot simultaneously hold that the probability of a conditional "if A then B" equals the conditional probability P(B|A) and that the conditional is an ordinary proposition (with a truth value) without collapsing into a degenerate probability function.

  We are to translate this argument and responses into the vocabulary of data infrastructure: tables, boolean columns, vectorized functions, filtering, three-valued logic, NULLs, and operations like `observe` (conditioning) and interventions (re-running on patched data).

