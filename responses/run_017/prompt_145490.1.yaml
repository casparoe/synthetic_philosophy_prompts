  ### Part 2: Standard Ways Out

  a. **The conditional is a query, not a column**: Instead of defining a column C, we define the conditional as the result of a query: `SELECT AVG(B) WHERE A`. Then we don't assign a truth value per row. In the vocabulary: we do not have a column for the conditional. We only compute the conditional probability by filtering on A and then averaging B.

     - **Translated cleanly**: This is exactly the `filter` operation: we condition on A and then compute the expectation of B. We don't represent the conditional as a column.

  b. **The conditional is a third value**: We might use a three-valued logic (true, false, NULL) and define the conditional for a row as:
        if A is true: then C = B
        if A is false: then C = NULL

     Then the probability of the conditional being true is defined only over the rows where A is true? But note: we want the probability of the conditional (as a whole) to be P(B|A). If we interpret the probability as the proportion of rows where C is true among the rows where C is not NULL, then:

          (# rows with C true) / (# rows with C not NULL) = (# rows with A true and B true) / (# rows with A true) = P(B|A)

     But note: the probability of the conditional being true in the entire table is not P(B|A) but rather the proportion of rows that are true among non-NULLs? However, the probability we are after is P(B|A) and we have achieved that by redefining the domain. But the original requirement was that the probability of the conditional (as a proposition) equals P(B|A). In this setup, the conditional is not a proposition that is true or false in every row? It is NULL in some rows. So we might define the probability of the conditional as the conditional probability given that A is true? But that is circular.

     Alternatively, we might define the probability of the conditional as the probability that it is true given that it is defined? Then we have:

          P(C=true | C is not NULL) = P(B|A)

     But note: in the entire table, the event "C is true" is not independent of "C is not NULL". In fact, "C is not NULL" is exactly A. So:

          P(C=true) = P(B and A)   [because when A is true, C is true iff B is true; and when A is false, C is NULL so not true]
          P(C is not NULL) = P(A)

     So then:

          P(C=true | C is not NULL) = P(B and A) / P(A) = P(B|A)

     So we have achieved that the conditional probability of C being true given that it is defined is P(B|A). However, the original Lewis claim was about the unconditional probability of the conditional. So if we require the unconditional probability of the conditional to be P(B|A), we don't have that. We have:

          P(C=true) = P(A and B)

     which is not equal to P(B|A) in general.

     So this approach does not satisfy the original equation unless P(A)=1.

     - **Distortion**: We are redefining the probability of the conditional to be conditional on A. The original equation is about unconditional probability.

  c. **The conditional depends on context**: That is, the truth of "if A then B" is not determined solely by A and B in that row, but by the entire distribution. In data terms, the function f would have to depend on the entire table, not just the row. But then it is not a vectorized function.

     - **Translated cleanly**: We can have a function that takes the whole table and returns a column? But that breaks vectorization. We might compute global statistics and then assign per row? But note: the function would have to depend on the entire table to compute the conditional probability and then set the value in each row accordingly? But then the same (A,B) pair in two different rows of the same table might have different C values? That would be non-vectorizable.

