  we require both to be false? So row2 must be false? But we just set (false,false) to true? 

  Therefore, we cannot have a consistent function f(A,B) that works for all tables.

  We can restate the no-go result: There is no deterministic function f(A, B) (with values in {true, false} and defined for all (A,B)) such that for every table T (with at least one row with A=true) the proportion of rows in T for which f(A,B)=true equals the conditional probability P(B|A) of that table.

