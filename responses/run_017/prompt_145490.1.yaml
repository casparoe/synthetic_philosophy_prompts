     a. **Embedding**: We cannot nest an `observe` (filter on the result of a filter). Is the philosophers' problem reducible to this?
     b. **Intervention vs. filter**: Conditioning (filter) vs. re-running the simulator (intervention). Is this distinction present in the philosophical debate?

  5. **Working hypothesis**: The debate is intractable only if conditionals must be expressions. If conditioning is a primitive operation on models, the problem vanishes.

