  ### Part 3: Residue Report

  a. **Conditional as a query**:
     - Cleanly: The operation of filtering and then averaging is exactly how we compute conditional probability. This avoids the no-go because we don't represent the conditional as a column.
     - Distorted: The original idea of a conditional as a proposition (which can be true or false in a world) is lost. We don't have a representation of the conditional per row.
     - No expression: The idea that the conditional has a truth value in each world (row) is abandoned.

  b. **Conditional as a third value**:
     - Cleanly: We can represent the conditional as a column that is NULL when A is false. The conditional probability of the conditional being true given that it is defined equals P(B|A).
     - Distorted: The unconditional probability of the conditional (if we try to compute it) is not P(B|A). Also, in the philosophical debate, they usually require the conditional to be a proposition that is either true or false in every world, not sometimes undefined.
     - No expression: The original equation (unconditional probability of the conditional equals conditional probability) is not achieved.

  c. **Conditional depends on context**:
     - Cleanly: We can break vectorization and have the value of the conditional depend on global properties (like the entire table's counts). This allows us to set the column C such that the proportion of true values equals P(B|A) for that table.
     - Distorted: The function is not pure in the row's values. It depends on the entire table. This breaks composability and the idea that the conditional is a local property of the world (row).
     - No expression: The deterministic function per row is lost.

  ### Part 4: Trouble Spots

  a. **Embedding**: 
     - In our vocabulary, we cannot nest `observe` (conditioning). The philosophers' problem might be about more than composability. The no-go result shows that even without nesting, we cannot assign truth values to conditionals in a way that matches the conditional probability. However, the embedding issue might arise when we want to have conditionals inside conditionals? That would require a truth value for the inner conditional. But if we don't have a truth value (because we treat conditionals as queries) then we cannot embed. The philosophers might want to have conditionals that are embedded? 

     - **Judgment**: The asymmetry in composability is a symptom but not the whole problem. The no-go result stands even without nesting: we cannot have the truth values per row and the probability constraint simultaneously.

  b. **Intervention vs. filter**:
     - Conditioning (filter) is an operation that removes rows. Intervention (re-running the simulator on a patched world) is a different operation: it sets A to a particular value and then runs the model (which might change other variables). 

     - In the philosophical debate, the conditional probability is usually defined by conditioning (filtering). However, when we think of counterfactuals (what if A had been true?), we might use interventions. Lewis was concerned with indicative conditionals (which are about conditioning) and not counterfactuals? 

     - **Judgment**: The distinction is present in the philosophical debate (between indicative and counterfactual conditionals) and it does real work. The original Lewis argument is about indicative conditionals and uses conditioning (filtering). So for the specific argument we are considering, the intervention is not needed.

  ### Part 5: Working Hypothesis

  **Hypothesis**: The debate looks intractable only if your language forces conditionals to be expressions, and a language in which conditioning is a primitive operation on models does not have the problem.

  **Assessment**: The no-go result shows that if we force the conditional to be an expression (a column in the table) then we run into a contradiction. If we make conditioning (filtering) a primitive operation that is not represented as a column, then we avoid the contradiction. Therefore, the hypothesis holds for the indicative conditional (which is defined by conditioning). 

  However, note that in probabilistic programming, we often have both: we can condition (observe) and we can also have expressions that represent random variables. But the conditional "if A then B" is not represented as a random variable in the model; we condition on A and then look at B. So in that language, we don't have the problem.

  But what about counterfactuals? They require interventions, and we might want to represent a counterfactual conditional as a random variable? That is a different matter and might require a more complex representation (e.g., with multiple worlds). The original Lewis argument is about indicative conditionals, so we are safe.

  **Where it fails**: If we require the conditional to be an object that can be embedded arbitrarily in expressions (for example, in a nested conditional: "if A then (if B then C)"), then we might run into trouble again. But if we handle conditionals only as queries (and not as expressions) then we cannot embed them. However, we could design a language that allows nesting of conditioning operations? But that is not the same as having a truth value. 

  Alternatively, if we want counterfactual conditionals, then we are not in the realm of simple filtering. We might need to represent the counterfactual as a random variable in the model? And then we might face a similar no-go? But that is beyond the original claim.

  ### Final Verdict

  Verdict: Hypothesis holds for indicative conditionals.
answer: |-
  ### Translation of Lewis's Argument and Responses into Data Vocabulary

  #### **1. No-Go Result: Deterministic Boolean Functions Fail**
  - **Setup**:  
    - Table `T` with columns `A` (boolean), `B` (boolean), and `n` rows.  
    - Conditional probability `P(B | A)` = `COUNT(*) FILTER (WHERE A AND B) / COUNT(*) FILTER (WHERE A)`.  
    - We seek a deterministic boolean function `f(A, B)` defining a column `C = f(A, B)` such that:  
      `P(C)` (i.e., `AVG(C)` when `C` is boolean) equals `P(B | A)` for **any table** (with `COUNT(A) > 0`).  
  - **No-Go Proof by Contradiction**:  
    Assume such an `f` exists. Consider these tables:  
    - **Table 1**: Rows `[(A=true, B=true), (A=true, B=false)]`.  
      `P(B | A) = 1/2` → Requires exactly 1 row where `C=true`.  
      Thus: `f(true, true) = true`, `f(true, false) = false` (or vice versa).  
    - **Table 2**: Rows `[(A=true, B=true), (A=true, B=true)]`.  
      `P(B | A) = 1` → Both rows must have `C=true` → `f(true, true) = true`.  
    - **Table 3**: Rows `[(A=false, B=true), (A=true, B=true)]`.  
      `P(B | A) = 1` (only `A=true` row) → Both rows must have `C=true` → `f(false, true) = true`.  
    - **Table 4**: Rows `[(A=false, B=false), (A=true, B=false)]`.  
      `P(B | A) = 0` (only `A=true` row) → Both rows must have `C=false` → `f(false, false) = false`.  
    - **Contradiction**:  
      From Table 3, `f(false, true) = true`. From Table 4, `f(false, false) = false`. Now consider:  
      **Table 5**: Rows `[(A=false, B=true), (A=true, B=false)]`.  
      `P(B | A) = 0` (only `A=true` row) → Requires `C=false` for both rows.  
      But `f(false, true)` must be `true` (Table 3) → Row 1 has `C=true`. Contradiction.  
  - **Conclusion**:  
    No deterministic `f(A, B)` works universally. Degeneracy (e.g., `A` always true) avoids this by collapsing cases.  

  #### **2. Standard Ways Out**  
  a. **Conditional as Query (Not a Column)**:  
     - **Translation**:  
       `P(if A then B)` is computed as `SELECT AVG(B) WHERE A` (a **query over the model**). No column `C` exists. Conditioning (`WHERE A`) is a primitive operation.  
     - **Clean Translation**:  
       Matches `P(B | A)` as a `filter` operation. Avoids defining a column.  
     - **Distortion**:  
       Philosophers' "truth value of the conditional" has no direct analog.  

  b. **Conditional as Three-Valued (e.g., `NULL`)**:  
     - **Translation**:  
       Define `C` as:  
       ```  
       CASE WHEN A THEN B  
            ELSE NULL  
       END  
       ```  
       Then `P(C=true | C IS NOT NULL) = P(B | A)`.  
     - **Clean Translation**:  
       Uses `NULL` propagation rules. `AVG(C)` over non-`NULL` rows equals `P(B | A)`.  
     - **Distortion**:  
       `P(C=true)` (unconditional) is `P(A AND B)`, not `P(B | A)`. Philosophers want unconditional probability.  

  c. **Conditional Depends on Context (Not Just `A, B`)**:  
     - **Translation**:  
       `f` uses **global stats** (e.g., `COUNT(*) FILTER (WHERE A)`). Example:  
       ```  
       C = (A AND B) OR (NOT A AND [random < P(B | A)])  
       ```  
       but `P(B | A)` depends on the entire table.  
     - **Clean Translation**:  
       Acknowledges dependency on table-wide aggregates.  
     - **Distortion**:  
       `C` is no longer a pure function of `(A, B)` per row; breaks vectorization.  

  #### **3. Residue Report**  
  | **Response**          | **Translated Cleanly**                          | **Distorted**                                  | **No Expression**                     |  
  |------------------------|------------------------------------------------|-----------------------------------------------|---------------------------------------|  
  | **Query (Not Column)** | `WHERE`/`filter` as primitive; `observe` in models. | "Truth value" of conditional lost.            | Embedding conditionals in expressions. |  
  | **Three-Valued**       | `NULL` propagation; conditional probabilities. | Unconditional probability mismatch.           | Philosophers' truth-conditional semantics. |  
  | **Context-Dependent**  | Global stats in functions.                     | Non-vectorizable; violates row-level purity. | Deterministic per-row truth values.   |  

  ---  
  ### **Trouble Spots: Judgments**  
  1. **Embedding Asymmetry**:  
     - **Your View**: Cannot nest `observe` (e.g., `WHERE (WHERE ...)`).  
     - **Judgment**: This **reduces** the philosophers' problem. If conditionals are expressions, embedding forces a truth value, causing collapse. Composability is the core issue.  
     - **Cutting Direction**: Asymmetry explains the intractability.  

  2. **Intervention vs. Filter**:  
     - **Your View**: `observe` is `filter`; re-running simulator is intervention.  
     - **Judgment**: Philosophers **do not** conflate these. Lewis's argument uses `filter` (conditioning). Interventions (counterfactuals) are a separate problem.  
     - **Cutting Direction**: Distinction is irrelevant to Lewis's specific claim.  

  ---  
  ### **Assessment of Your Working Hypothesis**  
  - **Hypothesis**: "Debate intractable iff conditionals forced to be expressions; primitive `observe` avoids the problem."  
  - **Assessment**: **Holds for indicative conditionals** (Lewis's focus).  
    - If `if A then B` is a query (`SELECT AVG(B) WHERE A`), not a column, no collapse occurs.  
    - **Where it fails**:  
      - Counterfactuals (interventions) require re-running models, which may need truth-apt conditionals.  
      - Embedding demands expressions (e.g., "If A, then if B, then C").  

  ---  
  **Verdict**: Hypothesis holds for indicative conditionals.
