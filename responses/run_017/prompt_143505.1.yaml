answer: |-
  ## Fellowship Research Proposal: The Partition Problem in Consequentialism under Deep Cluelessness

  **1. Introduction: The Core Question**
  Consequentialism faces a profound challenge from "cluelessness": our inability to discern the long-run, ramifying consequences of our actions. This project identifies a specific, neglected dimension of this challenge: **whether the very concept of expected value maximization is rendered ill-posed for ordinary actions due to the conditional convergence of value sums over the open-ended future.** The precise question is: *Does the inherent causal sprawl of actions into an indefinite future generate a partition-dependence in expected value calculations such that no unique, objective ranking of acts is possible, even under idealized epistemic conditions?* The project aims to determine if this problem arises from standard consequentialist assumptions applied to real-world contexts, distinct from familiar problems like fanaticism, and whether it undermines core consequentialist justifications, including the retreat to rule-consequentialism.

  **2. Existing Responses and Their Limitations**
  The literature addresses cluelessness through several strategies, but none adequately confront the partition problem:

  *   **Subjective Consequentialism & Sign-Cluelessness:** The standard reply to sign-cluelessness (uncertainty over the *direction* of long-run effects relative to near-term gains) is to maximize *expected* value based on subjective credences. This successfully addresses uncertainty about the *sign* of net effects but presupposes that a well-defined expected value exists. It does not solve the deeper problem of whether that expectation *is* well-defined.
  *   **"Washing Out" & Tail-Cluelessness:** The comfort offered for tail-cluelessness (massive spreads in possible long-run outcomes) is that unknown, extreme effects might be symmetric and "wash out" in expectation. However, this relies critically on the *existence* of a finite expectation. If the probability distribution of long-run effects decays slowly enough (e.g., power-law tails), the expectation integral may diverge or become undefined. Symmetry alone does not guarantee convergence; it may merely describe divergent positive and negative arms. This reply fails if the expectation is ill-posed.
  *   **Imprecise Credences & Decision Rules:** Facing deep uncertainty, some suggest representing beliefs with imprecise credences (sets of probability functions) and employing decision rules like MaxiMin or Hurwicz. While potentially more robust, this approach still requires aggregating value *within* each probability function in the set. If the expected value is partition-dependent *for each individual probability function* in the set, the imprecise approach inherits the fundamental ill-posedness, merely spreading it across multiple functions. The core aggregation problem persists.
  *   **The Retreat to Two-Level Consequentialism:** When act-assessment seems clueless, consequentialists often evaluate rules, policies, or institutions instead. However, **this retreat exacerbates the partition problem.** Assessing a rule entails aggregating value over *all* instances where the rule is followed, across potentially infinite future scenarios. This sum is even more complex and heterogeneous than the sum for a single act. If partition-dependence infects the single-act calculation, it will almost certainly infect the rule-assessment, likely with greater severity due to the broader scope. Rule-consequentialism offers no refuge; it may be the primary casualty.

  **3. Method: Conceptual Analysis and Formal Modeling**
  This three-month project will rigorously examine the partition problem through conceptual analysis and targeted formal modeling, deliberately avoiding less fruitful avenues:

  *   **Month 1: Problem Formulation & Comparison:** Precisely articulate the partition-dependence argument, contrasting it with sign-cluelessness, tail-cluelessness, and fanaticism scenarios. Demonstrate how conditional convergence arises from plausible models of causal propagation into an open future without relying on infinities, deities, or extreme gambles. Critically assess the claim that rule-consequentialism is more vulnerable. *Why not empirical forecasting?* Forecasting specific long-run effects is impossible for the foundational problem at hand; the issue is conceptual and mathematical, not empirical. *Why not infinite aggregation?* The focus is on problems arising from *finite but open-ended and causally ramified* futures, distinct from purely mathematical puzzles of infinite sums.
  *   **Month 2: Formal Exploration & Potential Dissolutions:** Construct simplified formal models capturing causal sprawl (e.g., branching causal chains with value accumulating multiplicatively or additively along paths over time). Rigorously examine conditions under which expected value sums become partition-dependent. Test potential solutions: Does assuming a *bounded* or *saturating* value function (where marginal value diminishes to zero) force convergence? Is there a *privileged partition* dictated by fundamental causal structure (e.g., natural boundaries in spacetime or causal graphs) that yields a unique sum? *Why not abandon consequentialism?* The goal is to test the internal coherence of consequentialism under plausible conditions, not to advocate for alternative frameworks prematurely.
  *   **Month 3: Implications & Robustness:** Synthesize findings. If partition-dependence is robust, explore the implications: Does consequentialism collapse into a form of practical incoherence for long-range decisions? Does it necessitate a fundamental shift towards near-term proxies or non-consequentialist constraints? Develop criteria for when a consequentialist ranking might be deemed "robust enough" despite theoretical fragility (e.g., insensitivity to plausible re-carvings). Draft the core 9,000-word paper and the funder note.

  **4. Possible Results and Deciding Factors**
  Several outcomes are possible, distinguishable by conceptual and formal analysis:

  1.  **Problem Dissolved (Bounded Value):** A bounded or strongly saturating value function ensures unconditional convergence, making partition-dependence irrelevant. *Decider:* Demonstrating that unbounded value is incoherent or practically irrelevant for real-world consequentialism.
  2.  **Problem Dissolved (Privileged Partition):** A unique, causally fundamental partition exists, yielding a unique expected value. *Decider:* Identifying a non-arbitrary, objective basis for such a partition within a plausible metaphysics of causation.
  3.  **Problem Real & Significant:** Partition-dependence is inherent to consequentialist evaluation under causal sprawl, rendering unique maximization impossible and undermining the two-level retreat. *Decider:* Formal models showing robust partition-dependence under plausible assumptions about value and causal structure, without appealing to exotic scenarios.
  4.  **Problem Real but Limited:** Partition-dependence exists but only causes significant variance in rankings under very specific, perhaps rare, circumstances. *Decider:* Establishing the conditions under which variance becomes practically significant for decision-making.

  **5. Failure Conditions and Honest Scope**
  The project could fail meaningfully in several ways:

  1.  **Collapse into Fanaticism:** The argument might be shown to inherently rely on assumptions indistinguishable from those driving fanaticism debates (e.g., unbounded utility, tiny probabilities of vast effects), failing to isolate a distinct "cluelessness" problem.
  2.  **Technical Soundness, Practical Irrelevance:** The partition problem might be formally valid but demonstrably inert for virtually all real-world decisions – perhaps boundedness or natural partitions render the variance negligible, or the re-carvings producing divergent results are too gerrymandered to matter.
  3.  **Mathematical Dissolution:** A previously overlooked mathematical solution (e.g., a rigorous summation method for conditionally convergent causal value streams) might be discovered, dissolving the core worry.
  4.  **Scope Exceeded:** The three-month timeframe might be insufficient to rigorously establish the third complaint's novelty and seriousness against all counterarguments.

  **Scope Management:** Should establishing the plausibility and novelty of the third complaint (partition-dependence) prove time-consuming, priority will be given to this above fully resolving the rule-consequentialism critique or exhaustively exploring all dissolution strategies. The core deliverable is the paper demonstrating whether this distinct problem exists and matters.

  **6. Value Proposition: Why Fundamental Work Matters**
  Funding fundamental work on the coherence of consequentialism is vital for applied ethics and decision-making under deep uncertainty. If consequentialist rankings are fundamentally fragile (partition-dependent), this challenges the justification for interventions based solely on long-run expected value calculations, even sophisticated ones. Conversely, if the problem can be bounded or shown to be irrelevant in practice, it provides crucial reassurance. The key deliverable for practitioners won't be a specific forecast or policy prescription, but **a conceptual tool: a clearer understanding of the conditions under which consequentialist reasoning about long-term effects is robustly defined.** A usable product might be a framework or test for assessing whether a proposed consequentialist justification for an action or rule is vulnerable to partition-dependence, highlighting when decision-makers should seek alternative justifications or acknowledge fundamental uncertainty in their moral calculus. This advances the funder's goal of supporting rigorous inquiry into the foundations of ethical reasoning relevant to complex, long-term challenges.
