prompt: |-
  I sit on a small commission on electoral law reform, and I have been asked to write the short normative appendix to our report. Before I commit it to paper I would like my own position audited, because my worry is not that any one of these claims is indefensible but that I have been quietly using different principles in different chapters. I do not want a survey of the literature or a map of the debate, and I do not want to be told that reasonable people disagree; I want the argumentative structure of my own set. Please write in British English.

  Here is where I have landed.

  (1) The boundary of the franchise should be fixed by affected interests rather than by citizenship or by membership in a national community: roughly, anyone whose significant interests are foreseeably and non-trivially affected by a decision is entitled to a say in making it. I have argued against both the coercion test and the national self-determination test as criteria of inclusion.

  (2) Consequently, lawful non-citizen residents should have the vote in national as well as local elections after a short period of residence — residence being only a proxy for affectedness, not a test of belonging — while citizens who have lived abroad for years, pay no tax here and have no intention of returning should lose it.

  (3) The voting age should come down to sixteen, but no further. I oppose proxy votes cast by parents on behalf of younger children, I oppose any competence or civics test as a condition of adult voting, and I would leave eighteen as the age for jury service and for standing for election.

  (4) Voting should be legally compulsory: a duty to attend and return a ballot, with a formal none-of-the-above option and a modest fine for non-attendance. The secret ballot together with that option is, I take it, what answers the objection that compulsion coerces political expression.

  (5) Two grounds for (4). First, that abstention is a collective-action problem — no individual vote makes a difference, but low and socially skewed turnout biases policy against the worse-off — so compulsion is a legal remedy for a coordination failure and improves the representativeness of outcomes. Second, more broadly, that those who live under and benefit from a legal order owe it their participation.

  (6) The franchise is a right that individuals hold against the state, which they are free to exercise or refrain from exercising; that is part of why disenfranchisement — of serving prisoners, for instance — strikes me as a grave wrong.

  What I want from you: which of these genuinely pull against which, ordered by how severe the strain is, and for each tension what would have to give, what the cheapest repair would be, and what that repair would cost me elsewhere in the set. Please also say explicitly which of the apparent tensions dissolve on inspection and why, rather than flagging everything as a problem. If the package survives intact, say so — and then tell me where it is weakest regardless.
reasoning: |-
  Okay, let me start by really understanding what the user is asking. They're part of a commission on electoral law reform and need to write a normative appendix. Their main concern is consistency across their arguments. They don't want literature surveys or debates; they want their own argumentative structure audited for internal tensions.

  First, I need to parse each of their six points. Point 1 bases the franchise on affected interests, rejecting citizenship and national community. Point 2 extends voting rights to non-citizen residents and removes them from long-term expats. Point 3 lowers voting age to 16 but opposes proxy votes for children and competence tests. Point 4 makes voting compulsory with a none-of-the-above option. Point 5 gives two grounds: solving collective-action problems and civic duty. Point 6 frames franchise as a right against the state, opposing disenfranchisement like for prisoners.

  Now, looking for tensions. The biggest one seems between compulsory voting (Point 4) and the franchise as a right that includes the right to abstain (Point 6). If voting is a right, doesn't that imply the freedom not to exercise it? Compulsory voting forces participation, which might contradict the voluntary nature of a right. The user's defense is the none-of-the-above option and secret ballot, but does that fully resolve the issue? They might need to refine how they conceptualize the right—maybe as a duty-bound right. But that could weaken the argument against disenfranchisement if rights come with obligations.

  Next, affected interests (Point 1) vs. the civic duty rationale in Point 5b. If voting is based on affected interests, does that align with owing participation to the legal order? The duty rationale might imply a deeper membership than mere affectedness. The user could lean into the collective-action problem argument more heavily, downplaying the duty aspect to avoid this tension.

  Then, the voting age at 16 without proxies for younger children (Point 3). If affected interests include children, why deny them representation? The user argues for a bright line at 16, citing maturity and avoiding paternalism. But this needs clear justification why 16 is the threshold, especially since younger children are affected by policies too. They might need to clarify that practical administration justifies the line, though it's a bit of a concession.

  Also, disenfranchisement opposition (Point 6) vs. removing votes from expats (Point 2). If losing voting rights for expats is acceptable, why not for prisoners? The user distinguishes by consent and agency—expats choose to leave, prisoners are coerced. That holds, but they need to be explicit about coercion versus choice to prevent inconsistency.

  Other points: The competence test opposition in Point 3 aligns with compulsory voting since mandatory voting assumes no competence needed. The none-of-the-above option resolves compulsion concerns about forced expression. Residency as a proxy for affectedness works but isn't perfect; the user acknowledges it's a practical measure.

  The weakest spot might be the right-duty hybrid in voting. Combining the right to vote with a duty to participate is tricky. If they frame voting as a unique right that inherently includes a duty to maintain the system, it might work, but it's philosophically challenging. They should prepare for critiques here, especially from rights-focused critics.

  Overall, the package holds with minor adjustments. Prioritize clarifying the right-duty relationship, possibly subordinating duty to the right's core status. Emphasize practical thresholds over perfect principles where necessary. The user should ensure their justifications for age and residency proxies are clearly articulated as administrative necessities rather than philosophical ideals.
answer: |-
  Your normative framework is coherent but contains one significant tension and several minor strains requiring careful handling. Below is an audit of internal consistency, ordered by severity, with repairs and costs assessed. Crucially, three apparent tensions dissolve on inspection.

  ### ⚠️ **1. Core Tension: Compulsory Voting (4-5) vs. Franchise as a Right to Abstain (6)**  
  **Severity:** High – A direct conceptual clash.  
  **Nature of Conflict:**  
  - **Point 6** explicitly frames the franchise as a right "individuals are free to exercise **or refrain from exercising**".  
  - **Points 4-5** mandate participation (with a fine for non-compliance), removing the legal freedom to abstain. The "none-of-the-above" (NOTA) option mitigates *coerced political expression* but does not negate coerced *participation*.  
  **Cheapest Repair:**  
  Reformulate Point 6 to define the franchise as a "duty-bound right" or a "right that entails a civic obligation". Emphasise that the *core right* is protection against state *disenfranchisement* (e.g., for prisoners), not an unconditional right to abstain.  
  **Cost of Repair:**  
  - Weakens the moral force of **Point 6** against prisoner disenfranchisement. If voting is partly a duty, opponents could argue prisoners forfeit this duty via crime.  
  - Risks alienating liberal critics who view abstention as intrinsic to electoral rights.  

  ### ⚠️ **2. Moderate Strain: Affected Interests (1) vs. Civic Duty Ground (5b)**  
  **Severity:** Moderate – Requires reconciling distinct justifications.  
  **Nature of Conflict:**  
  - **Point 1/2** grounds voting in *individual interests* (affectedness).  
  - **Point 5b** grounds compulsion in *owing participation to the legal order* – implying a reciprocal relationship closer to "membership" (rejected in Point 1).  
  **Cheapest Repair:**  
  Argue that benefiting from a legal order creates a *duty to participate* precisely *because* one’s interests are systemically affected. Frame "duty" as a derivative of affectedness, not of communal belonging.  
  **Cost of Repair:**  
  - Dilutes the clean "affected interests" principle by adding a layer of obligation. Could invite membership-based critiques.  
  - **Alternative:** Downplay Point 5b and rely solely on **Point 5a** (collective-action problem) to justify compulsion. This avoids the tension entirely.  

  ### ⚠️ **3. Minor Strain: Affected Interests (1) vs. Age Threshold (3)**  
  **Severity:** Low – Administrative, not philosophical.  
  **Nature of Conflict:**  
  - **Point 1** implies *all* foreseeably affected individuals should have a vote.  
  - **Point 3** excludes under-16s, even if demonstrably affected (e.g., 15-year-olds impacted by education policy).  
  **Cheapest Repair:**  
  Concede that age thresholds are necessarily arbitrary proxies. Justify 16 as a balance between:  
  (a) Practical administrative feasibility,  
  (b) Avoiding paternalism (rejecting proxy votes),  
  (c) A reasonable age of presumed competence for autonomous political judgment.  
  **Cost of Repair:**  
  Acknowledges a pragmatic deviation from strict affectedness. Vulnerable to critics demanding consistency (e.g., "Why not 14?"), but not internally destabilising.  

  ### ⚠️ **4. Minor Strain: Disenfranchisement Opposition (6) vs. Expat Exclusion (2)**  
  **Severity:** Low – Distinguishable by agency and temporality.  
  **Nature of Conflict:**  
  - **Point 6** opposes disenfranchisement as a "grave wrong".  
  - **Point 2** advocates removing votes from citizens abroad long-term.  
  **Cheapest Repair:**  
  Argue that expat exclusion is *not punitive disenfranchisement* but a *lapse of qualification* based on eroded affectedness. Unlike prisoners, expats *chose* to leave and sever primary affectedness.  
  **Cost of Repair:**  
  None. This distinction is robust and consistent with Point 1.  

  ---

  ### ✅ **Apparent Tensions That Dissolve:**  
  **A. Compulsion (4) vs. Opposition to Competence Tests (3):**  
  - **Why it dissolves:** Competence tests condition the *right* to vote; compulsion mandates *use* of that right. They address separate issues. Your rejection of tests preserves equal access; compulsion addresses participation equality. No conflict.  

  **B. Compulsion (4) vs. Secret Ballot/NOTA:**  
  - **Why it dissolves:** The NOTA option + secret ballot *do* neutralise the "coerced expression" objection. Compulsion only mandates attendance and ballot return – not meaningful endorsement of candidates. Internally consistent.  

  **C. Affected Interests (1) vs. Residency Proxy (2):**  
  - **Why it dissolves:** Residency is explicitly framed as a practical *proxy* for affectedness, not a principled boundary. You acknowledge its imperfection but justify it administratively. No inconsistency.  

  ---

  ### 🛡️ **Overall Assessment & Weakest Point**  
  **Your package survives intact** with minor repairs needed for the **compulsion-vs-right-to-abstain** tension and optional refinement of the **duty-vs-affectedness** justification. The cheapest path is:  
  1. **Repurpose Point 6** as a *shield against punitive state removal* of voting rights (e.g., for prisoners), not a right to abstain.  
  2. **Lean heavily on Point 5a** (collective-action problem) as the primary justification for compulsion, treating Point 5b (civic duty) as supplementary.  

  **Where the argument is weakest:**  
  - **The Compulsion-Right Hybrid:** Reconciling voting as an individual right with a legally enforced duty remains philosophically delicate. Critics will argue that if abstention is a legitimate expression of dissent (e.g., boycott), compulsion violates political freedom. Your NOTA defence works procedurally but may not satisfy principled opponents of state-mandated participation.  
  - **Practicality of Affected Interests:** Applying "foreseeably and non-trivially affected" in complex policy areas (e.g., climate change, foreign policy) risks indeterminate boundaries. Your residency/age proxies manage this, but the core principle invites boundary disputes you explicitly wished to avoid.  

  **Recommendation for the Appendix:**  
  - Preempt the compulsion/abstention tension by defining the franchise upfront as *"a right protecting against exclusion, coupled with a civic responsibility to participate."*  
  - Emphasise **Point 5a** (correcting turnout bias) as the *primary* engine for compulsion – it aligns best with your focus on representational fairness and systemic outcomes over communitarian duty.  

  This structure holds firm under audit, requiring only nuanced phrasing to solidify its foundations. Well reasoned.
