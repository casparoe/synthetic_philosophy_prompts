prompt: |-
  hey — I need the joint statement for an adversarial collaboration I'm trying to set up between two people who've been sniping at each other for years about what disease even is. Side N is a naturalist in the biostatistical vein: disease is statistically subnormal functioning of a part or process relative to a reference class, health is species-typical functional ability, and value judgments enter only when we decide what to do about it. Side V is a normativist: "bad for the bearer" is inside the concept, not a extra criterion bolted onto a value-free core.

  Assume they've agreed to be honest about which cases are uncomfortable for them. What I want back:

  1. A numbered section of claims both can sign — about what the concept is supposed to do, about the easy paradigm cases, about how "function" is to be fixed (and whether selected-effect, causal-role, and "current contribution to survival and reproduction" ever come apart in a way that matters here), and about how the reference class is specified once you let environment in.

  2. A disagreements table. Columns: a neutral one-line statement of what's at issue / the formulation Side N would sign / the formulation Side V would sign / real or merely verbal, and why. If a formulation comes out so thin that neither side could deny it, throw it out and write a sharper one.

  3. A cruxes table. For each crux: the crux itself, the case or argument both agree would bear on it, Side N's prediction about that case, Side V's prediction, and what each side says would actually change its mind. Please also flag any crux that's a fake crux — one where settling it wouldn't move either party anyway — and say what that reveals about the debate.

  Run everything through these four cases (I made them up, sharpen them if they're mushy):

  - the three-hour sleepers: a heritable variant; carriers sleep about three hours a night, score at or above population mean on every test battery anyone has run, and live longer on average. Statistically way out on the tail, no detectable cost, apparently a benefit. I suspect this one separates them less than either expects — say if I'm right and why.
  - the anachronistic allergy: an immune system operating exactly to spec, mounting a textbook response to a synthetic protein that's now in most packaged food. Real harm, zero deviation from normal function, and the harm exists only because of what's in the environment now.
  - the arrector variant: people born without a vestigial reflex that does nothing measurable for thermoregulation in a clothed population and does something you can measure when they're cold and naked.
  - the old case where a condition gets classified as a disorder largely because of how other people react to the person who has it. Each side should say what its account predicts there and whether it treats that as a point in its favor or as an embarrassment.

  Two things I want handled explicitly rather than gestured at. First, the treatment-tracking test: for each case, answer separately "is it a disease?" and "should the health system pay for treating it at public expense?" Where the two answers come apart, say which side decouples them more comfortably and what that costs it. Second, whether any of the dispute is just about words — a theoretical/explanatory use of "disease" in physiology versus a clinical/institutional one used for triage, coverage, and legitimation. If part of it is verbal, say which part, and then say what the residual real fight is.

  I don't need names, dates or citations — I care whether the formulations are things each side could actually put their name to. Keep the whole document under ~1200 words.
reasoning: |-
  Okay, let's tackle this user's complex request. They need a structured adversarial collaboration document between two opposing views on disease definition. The naturalist (Side N) sees disease as statistical dysfunction, while the normativist (Side V) insists harm is inherent to the concept. 

  First, I consider how to structure the joint statement. The agreed claims section should focus on common ground: that "disease" marks significant deviations, requires objective dysfunction, and depends on reference classes tied to environments. I'll note their shared rejection of pure social constructionism and agreement that values guide treatment decisions post-diagnosis. 

  For the disagreements table, the core clash is whether harm is definitional. Side N wants harm separate from dysfunction, while Side V sees them as fused. The "merely verbal" column will highlight where institutional vs physiological uses create false disputes, but emphasize the real philosophical divide about harm's role.

  The cruxes table needs careful case analysis. The three-hour sleepers case is interesting - both sides might call it non-disease but for different reasons (N: no dysfunction; V: no harm). The anachronistic allergy forces the environment-vs-function debate. For the arrector variant, I'll contrast N's "vestigial=no dysfunction" against V's "harmless=no disease" stance. The social reaction case will test if harm can be purely external.

  On treatment-tracking, I'll show where answers diverge: Side V links disease status to treatment justification more tightly, while Side N decouples them comfortably. The verbal dispute aspect is crucial - I'll specify that "disease" in clinical contexts naturally includes harm, while physiological uses may not, but the core fight is whether harm is conceptually necessary.

  Throughout, I'll watch the word count and maintain neutral phrasing. The cases will be sharpened slightly - e.g. specifying the allergy involves no immune system error, and the arrector pili variant has no measurable function loss. The social reaction case will clearly involve something like harmless left-handedness in a prejudiced society.

  This structure should give the user what they need: clear agreements, sharp disagreements with predictions, and insight into what actually moves the needle in this debate.
answer: |-
  ## Joint Statement: Adversarial Collaboration on the Concept of Disease

  **Participants:** Side N (Naturalist/Biostatistical) & Side V (Normativist)

  **1. Agreed Claims (Signed by Both Parties):**

  1.  **Core Purpose:** The concept of "disease" serves to identify states of the body or mind that warrant medical attention and potential intervention, distinct from mere statistical variation or benign difference.
  2.  **Paradigm Cases:** Both agree that severe bacterial pneumonia, metastatic cancer, and untreated diabetes mellitus (Type 1) are clear cases of disease. Both agree that eye color variation, benign nevi (moles), and minor anatomical quirks (like Darwin's tubercle) are clear non-diseases.
  3.  **Function Necessity:** Attributing "disease" requires identifying a dysfunction in a part or process of the organism relative to a biologically relevant standard of function. Mere difference or statistical deviation is insufficient *by itself*.
  4.  **Function Grounding:** Function is understood biologically, primarily concerning the contribution of a part or process to the survival and reproduction of the organism *in a given environment*. Selected-effect (evolutionary history) and causal-role (current causal contribution) theories are relevant, but the primary operational criterion for *current function* is the part/process's **current contribution to the organism's survival and reproduction within its typical environment**.
  5.  **Reference Class & Environment:** The relevant reference class for establishing "normal function" is the relevant age/sex cohort of the species (Homo sapiens) **within a specified environment**. The environment is integral to defining functional norms (e.g., lung function norms differ at sea level vs. high altitude). "Species-typical" function inherently implies "in the species-typical environment(s)."
  6.  **Values & Intervention:** Value judgments are inescapably involved in deciding *which* dysfunctions are significant enough to label "disease," *which* to prioritize for research/treatment, and *what* interventions are desirable or ethical. **Disagreement: Side N holds these judgments are *applied after* identifying dysfunction; Side V holds the negative evaluation ("bad for bearer") is *constitutive of* the dysfunction/disease concept itself.**
  7.  **Rejection of Pure Social Construction:** Neither side endorses the view that disease is *solely* a social construct without any basis in biological dysfunction. Biological reality constrains the concept.

  **2. Disagreements Table:**

  | Neutral Issue Statement                            | Side N Formulation                                                                 | Side V Formulation                                                                                              | Merely Verbal? Why?                                                                 |
  | :------------------------------------------------- | :--------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------- |
  | **Is "harm/badness for bearer" part of the *definition* of dysfunction/disease?** | Disease is statistically subnormal functioning (as defined in 3-5). Harm is a frequent *consequence* used to identify significant dysfunctions, but not definitional. | "Disease" *means* a bodily or mental state constituting *harm* (impairment of flourishing) *because* it involves a biological dysfunction. Harm is intrinsic to the concept. | **No.** Core conceptual divergence. N sees harm as a contingent indicator/result; V sees it as definitional. |
  | **Does "dysfunction" require deviation from an evolutionary selected norm?** | Dysfunction is primarily defined by failure in *current* contribution to survival/reproduction in the *current* environment (Agreed Claim 4). Selected-effect history informs but does not strictly define current function. | Dysfunction implies a failure relative to the *design* (selected-effect) of the system. "Current contribution" alone risks pathologizing beneficial adaptations or failing to recognize dysfunction in novel environments. | **Partly.** Agree current contribution is key (Claim 4). Residual fight: V weights selected-effect history more heavily as the "design standard"; N sees it as informative background. |
  | **Can something be dysfunctional *without* causing harm?** | Yes. Dysfunction is a biological fact. Harm is a downstream consequence (often, but not always) used to judge significance. (See Arrector Variant Case). | No. If no harm is caused *by the dysfunction itself* (considering environment), it is not a true dysfunction/disease. The "dysfunction" label implies inherent negative impact. | **No.** Fundamental difference revealed by cases (e.g., Arrector Variant).            |
  | **Can environmental change *alone* create a disease without internal dysfunction?** | No. Disease requires internal dysfunction *relative to the new environment*. A system functioning normally to spec isn't dysfunctional, even if harmful. (See Anachronistic Allergy). | Possibly. If a previously non-harmful (or beneficial) function becomes harmful due to environmental change *and causes significant harm*, it constitutes a dysfunction/disease *in that new context*. | **No.** Revealed by Anachronistic Allergy case. V sees harm + normal function in novel context as disease; N does not. |

  **3. Cruxes Table:**

  | Crux                                                                                      | Test Case / Argument                                                             | Side N Prediction                                                                 | Side V Prediction                                                                  | Change-Mind Condition                                                                 | Fake Crux? / Revelation                                                                                             |
  | :---------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------ | :------------------------------------------------------------------------------------------------------------------ |
  | **Can biological dysfunction exist *without* causing harm to the bearer?**                | *Arrector Variant:* Harmless absence of vestigial reflex (no thermoreg. impact). | **Not Disease:** No functional impairment (no measurable contribution lost). No harm. | **Not Disease:** No harm caused. Therefore, no dysfunction/disease present.        | **N:** Finding a measurable survival/reproduction cost. **V:** Finding *any* harm traceable to absence. | **Partial Fake:** Predictions align (Not Disease), *but* reasons differ crucially (N: No dysfunction; V: No harm). Reveals core definitional split. |
  | **Can environmental change render a normally functioning system dysfunctional/diseased?** | *Anachronistic Allergy:* Textbook immune response harmful only due to novel env. | **Not Disease:** Immune system functioning *normally* (to spec). Harm is real, but due solely to environment, not dysfunction. | **Disease:** The immune response *is* dysfunctional *in this environment* because it causes significant harm to the bearer. | **N:** Finding the immune response deviates from species-typical function *in any environment*. **V:** Finding the response provides a net benefit *in the current environment*. | **No.** Clear divergence in prediction and reasoning. Key test for normativity's role.                               |
  | **Is absence of harm sufficient to preclude "disease" label, even with deviation?**       | *Three-Hour Sleepers:* Statistically deviant sleep pattern, no detectable cost.  | **Not Disease:** Statistically subnormal sleep duration, but no detectable dysfunction (performance, lifespan fine). No harm. | **Not Disease:** Clear absence of harm; likely net benefit. Therefore, not a disease. | **N:** Finding significant impairment masked by compensation. **V:** Finding subtle long-term harm or reduced flourishing. | **Yes (for this case).** Predictions align (Not Disease). Reveals both sides *use* harm practically, but N denies it's definitional. |
  | **Can social reactions *alone* make a condition a disease?**                              | *Social Reaction Case:* Harmless trait (e.g., harmless left-handedness variant) causing significant social disadvantage. | **Not Disease:** No biological dysfunction present. Social harm is real but external. Labeling it "disease" is error/misuse. | **Not Disease (usually):** Social harm alone ≠ biological dysfunction/disease. *However*, severe distress *caused by* the social reaction *might* constitute a mental disorder. | **N:** Finding biological dysfunction causing the trait. **V:** Finding the social reaction causes direct, severe biological harm (e.g., chronic stress illness). | **No.** Predictions *mostly* align (Not Disease), but V leaves a nuanced door open. Reveals both sides reject *pure* social construction as sufficient for disease. |

  **Treatment-Tracking & Verbal Dispute Analysis:**

  *   **Three-Hour Sleepers:**
      *   Disease? (N: No, V: No)
      *   Treatment Paid? (N: Unlikely unless harm found, V: No). Both decouple comfortably here.
  *   **Anachronistic Allergy:**
      *   Disease? (N: **No**, V: **Yes**)
      *   Treatment Paid? (N: **Yes** (harm exists, intervention justified), V: **Yes** (it's a disease)). N decouples more: *Not* disease, *but* treatable harm. Cost: Explaining why non-disease gets medical resources. V couples comfortably.
  *   **Arrector Variant:**
      *   Disease? (N: No, V: No)
      *   Treatment Paid? (N: No, V: No). Both couple comfortably.
  *   **Social Reaction Case:**
      *   Disease? (N: **No**, V: **No** (or nuanced maybe))
      *   Treatment Paid? (N: Maybe (for distress *caused by* reaction), V: Maybe (same)). Both decouple: Medical intervention for distress might be justified even though the trait itself isn't a disease.

  **Explicit Handling:**

  1.  **Treatment-Tracking:** The cases show N consistently decouples "disease status" from "treatment justification" more readily than V. N's cost is needing a separate account for when non-diseases warrant medical intervention (based on harm/suffering). V's cost is potentially over-medicalizing problems rooted solely in environment or society by calling them "disease."
  2.  **Verbal Dispute:** **Part of the dispute is verbal**, concerning the *primary context of use*.
      *   **Physiological/Theoretical Use (N's focus):** Aims for a value-free core (dysfunction) to explain biological failure. "Disease" here *tends towards* N's view.
      *   **Clinical/Institutional Use (V's focus):** Inherently practical, triaging resources based on suffering/harm. "Disease" here *naturally incorporates* harm, aligning with V.
      *   **Residual Real Fight:** Even granting distinct contexts, the **core philosophical disagreement persists**: Is the concept of *biological dysfunction itself* value-free (N) or inherently evaluative (V)? Can you *define* the relevant biological "malfunction" without reference to harm to the organism? The Anachronistic Allergy and Arrector Variant cases directly probe this non-verbal crux.
