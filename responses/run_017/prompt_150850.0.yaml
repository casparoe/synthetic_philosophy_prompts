prompt: |-
  I work on the internal resource-allocation team of a large public hospital network — roughly forty sites under one corporate budget. Four to six times a month, a committee of four of us (a finance director, two clinicians on rotation, and me) has ninety minutes to decide how some scarce thing will be rationed for the coming quarter: MRI scanner slots, subspecialty radiology reporting time, intensive-care beds during the winter surge, a one-off allocation of a drug in short national supply, cloud GPU hours for the research arm, nurses redeployed between units. Historically the answer has been whichever of administrative allocation or internal chargeback the most senior person in the room preferred. I want to replace that with a procedure.

  The material I want it built from is the socialist calculation debate. Mises's argument that without genuine markets in the factors of production there is no way to compute what something really costs; Hayek's recasting of it, that the knowledge relevant to allocation is dispersed, local to time and place, frequently tacit, and that a price is a device for transmitting that knowledge to people who will never possess it; Lange's reply that a planning board can post prices, watch for surpluses and shortages, and revise them, imitating a market without the property relations. I do not want a verdict on who won. I want those arguments turned into questions my committee can ask in order, in ninety minutes, with no economist present, and get the same kind of answer from as the last time.

  So please write the procedure itself. I need:

  - the sequence of questions, each phrased so that a non-specialist can answer it from records the organization actually keeps, with an explicit statement of what counts as a sufficient answer and what counts as no answer;
  - a default rule for when a question cannot be answered at all, and a defence of that default, since most of our no-answers will be permanent rather than temporary;
  - the points at which the procedure returns a hard stop — do not allocate this by internal price — and the finding that triggers it;
  - the points at which it stops and refers the decision elsewhere, because what remains is a question about what the good is for or about what the mode of allocation expresses, and not a question about information or efficiency;
  - a note on which distinctions from the debate you preserved in translation, which you dropped as unusable at this scale and under this time limit, and why each dropped one was droppable.

  I should say what I have already been doing informally, so you can keep what is sound and tell me what is confused. I have been asking four things. The refusal test: a number functions as a price only if some party inside the system can actually decline the trade at that number; if every unit is obliged to accept, the number is an index and using it in an optimization is arithmetic theatre. The channel-degradation audit: take the last three decisions of this kind that were made centrally, and ask whether the information that would have changed them existed locally and whether any part of it survived being reported upward; if it existed but never got written down, that is Hayek's case and it recurs. The latency ratio: compare how long it takes a shortage to show up in whatever signal we are using against how long the scarcity itself lasts; my instinct is that when the signal is slower than the thing it tracks, Lange's trial-and-error never converges and the choice is between a queue and luck. Soft-budget absorption: does anyone's discretionary budget actually shrink when their unit consumes more, and if not, is the price a memo. I also suspect there is a fifth question I am missing about inputs with no outside buyer or seller — a single-source legacy system, one named surgeon's time — where an internal transfer price seems to be anchored to nothing, but I cannot turn that suspicion into a question.

  Then run the finished procedure on three decisions we face this quarter. One: cloud GPU hours for research groups, which are homogeneous, divisible and trivially metered, and for which we can look up what commercial cloud actually charges. Two: intensive-care beds in a winter surge, where I expect the committee is hoping an internal price will end the bedside argument about who gets the last bed and I suspect the procedure will refuse to give them that. Three: nursing shifts across units, where the knowledge of which shift is needed where is local, constantly changing, and largely held by the ward managers, and where the finance director will strongly resist the answer if it is let them trade. Give me the verdict and the decisive question in each case, in the form of a single page the director could sign, and say which step was a judgment call dressed up as a procedure.

  Finally, be explicit about what the procedure cannot do. I can think of two candidates I want you to adjudicate: one-off allocations that will never be repeated and so admit no learning and no Langean adjustment, and goods whose value is realized only by a set of units used together, where a per-unit price misdescribes what is being allocated. Add whatever failure modes you think I have not seen.
reasoning: |-
  We are going to design a procedure based on the socialist calculation debate, focusing on practical questions that a committee of non-economists can answer in 90 minutes. The procedure will have a sequence of questions, each with clear criteria for sufficient answers and defaults for when no answer is available. We'll also define stopping points and referral points.

  The core ideas we translate:
  1. Mises: Without genuine markets (with refusal rights), prices are arbitrary.
  2. Hayek: Knowledge is dispersed and often tacit; prices aggregate that knowledge.
  3. Lange: A planning board can simulate markets by adjusting prices based on surpluses/shortages.

  We'll structure the procedure as a flowchart of questions.

  **Procedure: Resource Allocation Decision Protocol (RADP)**

  **Step 1: Refusal Test**
     - *Question*: "Can any unit in the system decline to acquire or provide the resource at the proposed internal price (or at any price we might set) without facing penalties beyond the natural consequences of not having the resource?"
     - *Sufficient answer*: Yes, if there is at least one unit that has the formal right and practical ability to refuse a transaction without being overruled by a higher authority in normal circumstances. No, if every unit is compelled to accept the allocation at the price set by the center.
     - *Default rule*: If no answer (or unclear), default to **no** (i.e., the refusal test fails). 
     - *Defense of default*: In the absence of evidence of refusal rights, we assume that the central authority's power to compel participation is present. This is conservative and avoids false positives that might lead to using prices in non-market conditions.
     - *Trigger*: If the answer is **no**, stop: **Do not allocate by internal price**. This resource must be allocated by administrative rules (e.g., priority ranking, lottery, senior clinician judgment). Record the reason: "No refusal rights -> no genuine market signals."

  **Step 2: Channel-Degradation Audit**
     - *Question*: "For the last three instances of allocating this resource (or a similar one), was there any local information (at the unit level) that, if known to the central committee, would have led to a different allocation decision? And if so, was that information recorded and transmitted to the central committee?"
     - *Sufficient answer*: 
       - If there were no past allocations, skip to Step 3.
       - Otherwise, the committee must identify at least one instance per allocation (if any) and state whether (a) local information existed that would have changed the decision and (b) whether it was recorded and transmitted. 
       - If the committee cannot recall or access records of the past decisions and the local information context, that counts as no answer.
     - *Default rule*: If no answer (or if the committee cannot determine), default to **yes, local information existed and was not recorded and transmitted** (i.e., channel degradation occurred). 
     - *Defense of default*: Hayek's argument about dispersed knowledge suggests that local information is often present and underreported. Assuming degradation unless proven otherwise prevents overconfidence in central data.
     - *Trigger*: If the answer is **yes, local information existed and was not transmitted**, then stop: **Do not allocate by internal price**. Instead, the committee must either (a) design a mechanism to capture that local information in the price (e.g., by allowing bilateral negotiations) or (b) refer the allocation to a lower level (e.g., unit managers). Record: "Channel degradation detected -> price signals unreliable."

  **Step 3: Latency Ratio**
     - *Question*: "How long does it typically take for a shortage or surplus of this resource to be reflected in the data we use to adjust allocations (e.g., wait times, backlog, utilization rates)? And how long does the typical scarcity condition last?"
     - *Sufficient answer*: The committee must provide two time estimates (e.g., "3 days" for signal delay, "2 weeks" for scarcity duration). If they cannot, they must state why (e.g., no data on adjustment lags, or scarcity patterns are too irregular).
     - *Default rule*: If no answer, default to **signal delay is longer than scarcity duration** (i.e., the ratio is unfavorable). 
     - *Defense of default*: Without evidence of timely signals, we assume that the Langean trial-and-error process would be too slow to converge, leading to persistent misallocations.
     - *Trigger*: If the signal delay is longer than the typical scarcity duration, stop: **Do not allocate by internal price**. Use a non-price mechanism (e.g., queue, lottery, first-come-first-served). Record: "Latency ratio unfavorable -> trial-and-error not feasible."

  **Step 4: Soft-Budget Absorption**
     - *Question*: "When a unit consumes more of this resource, does its discretionary budget (or an equivalent control mechanism) actually decrease by the cost of the resource, such that the unit must forgo other expenditures?"
     - *Sufficient answer*: Yes, if the unit's budget is reduced by the internal charge (and the unit manager feels the constraint). No, if the charge is merely an accounting entry without behavioral impact. 
     - *Default rule*: If no answer, default to **no** (soft budget constraint). 
     - *Defense of default*: In many organizations, internal charges are not binding. Assuming they are not unless proven otherwise prevents the illusion of cost discipline.
     - *Trigger*: If the answer is **no**, then stop: **Do not allocate by internal price**. The price is a memo and will not influence behavior. Use administrative allocation. Record: "Soft budget constraint -> price does not affect behavior."

  **Step 5: Anchor Test (for goods without external markets)**
     - *Question*: "Is there an external market for this resource (or a close substitute) that sets a reference price? If not, is there a way to establish a competitive internal market (e.g., by allowing units to bid against each other) or an objective cost basis (e.g., marginal cost of provision) that can serve as an anchor?"
     - *Sufficient answer*: 
       - If there is an external market price (e.g., commercial cloud rates for GPUs), that's sufficient.
       - If not, then a competitive internal auction or a well-defined cost (e.g., marginal cost of an ICU bed, including opportunity costs) is sufficient.
       - If neither, then no anchor exists.
     - *Default rule*: If no answer (or if the committee cannot determine an anchor), default to **no anchor**. 
     - *Defense of default*: Without an anchor, the price is arbitrary and may not reflect opportunity costs.
     - *Trigger*: If there is **no anchor**, then stop: **Do not allocate by internal price**. Use administrative rules based on need or priority. Record: "No price anchor -> arbitrary valuation."

  **Step 6: Referral Point**
     - If the resource passes all tests (Steps 1-5), then allocate by internal price (with a mechanism for adjustment, e.g., periodic auctions or a clearinghouse). 
     - However, if the committee feels that the allocation involves non-efficiency considerations (e.g., equity, ethical values, strategic goals) that override efficiency, then refer the decision to a higher authority (e.g., the hospital network board) with a note: "This allocation requires a value judgment beyond efficiency." 

  **Notes on Preserved and Dropped Distinctions:**
  - Preserved: 
    - Refusal rights (Mises) -> Step 1.
    - Dispersed knowledge (Hayek) -> Step 2 (channel degradation).
    - Trial-and-error feasibility (Lange) -> Step 3 (latency ratio).
    - Budget constraints (soft budget problem) -> Step 4.
    - Price anchoring (Mises on calculation) -> Step 5.
  - Dropped:
    - The debate about the possibility of socialism in the large: We are not building a whole economy but a hospital network, so we focus on specific resource problems.
    - Lange's detailed iterative procedure: We only check feasibility (latency) but do not implement the iteration because our committee meets quarterly and cannot adjust continuously.
    - Hayek's emphasis on tacit knowledge: We use Step 2 as a proxy, but we don't try to measure tacitness directly because it's too abstract for a 90-minute meeting.

  **Applying the Procedure to Three Cases:**

  **Case 1: Cloud GPU Hours**
  - Step 1: Refusal Test - Research groups can decline to use GPUs if the price is too high? Yes, they can choose not to run their experiments. -> Pass.
  - Step 2: Channel-Degradation Audit - Past allocations: We have records of usage and can adjust based on demand. Local information (e.g., a group's urgent need) is usually communicated via requests. But is it recorded? Yes, in project proposals. -> No degradation detected. Pass.
  - Step 3: Latency Ratio - Shortage signal: Usage data is real-time. Scarcity duration: Typically a quarter. Signal delay is near-zero, which is less than the scarcity duration. -> Pass.
  - Step 4: Soft-Budget Absorption - Research groups have discretionary budgets that are reduced by the GPU charges? Yes, they have fixed grants and must manage their budgets. -> Pass.
  - Step 5: Anchor Test - External market price exists (commercial cloud rates). -> Pass.
  - Verdict: **Allocate by internal price** (set at commercial rate). 
  - Decision: Use a chargeback system at market rates.

  **Case 2: Intensive-Care Beds in Winter Surge**
  - Step 1: Refusal Test - Can a unit (e.g., a department) refuse to take an ICU bed if the price is too high? No, because patient need is urgent and clinicians cannot refuse on cost grounds without ethical/legal issues. -> **Stop: Do not allocate by internal price.** 
  - Verdict: Administrative allocation (e.g., by medical priority, triage protocol). The committee's hope for an internal price to avoid bedside arguments is overruled by the procedure. The hard stop at Step 1.

  **Case 3: Nursing Shifts Across Units**
  - Step 1: Refusal Test - Can a ward manager refuse to accept a nurse from another unit? Or refuse to send a nurse? If they can (without penalty beyond the staffing consequence), then yes. But typically, the network requires cooperation. Let's assume the answer is no (they cannot refuse without being overruled). -> **Stop: Do not allocate by internal price.** 
  - However, if there is flexibility (e.g., a unit can decline to hire a temporary nurse from the pool if the price is too high), then proceed. But given the urgency of shifts, refusal is unlikely to be allowed. So we stop at Step 1.
  - If we reexamine and find that units have some autonomy (e.g., they can choose to hire internally or externally), then:
     - Step 2: Channel-Degradation Audit - Local knowledge about shift needs is held by ward managers. Past central allocations: Did they fail to capture local changes? Likely yes, because needs change by the hour. And that information is not transmitted in real-time. -> **Stop: Do not allocate by internal price. Refer to a lower level (allow ward managers to trade shifts directly).** 
  - The finance director might resist trading because it loses central control, but the procedure stops at Step 2 and recommends referral to local trading.
  - Verdict: **Refer to ward managers to trade shifts among themselves** (with a simple mechanism, e.g., a bulletin board or an app). 

  **What the Procedure Cannot Do:**
  1. One-off allocations: The procedure relies on past data (Step 2) and the feasibility of adjustment (Step 3). For a one-off (e.g., a unique drug allocation with no recurrence), the trial-and-error process (Lange) cannot operate. In such cases, the procedure will likely stop at Step 2 (if no past data) or Step 3 (if scarcity duration is short and signal delay is long). We then default to administrative allocation.
  2. Goods requiring bundled allocation: If the resource's value comes from a bundle (e.g., a set of complementary resources), the per-unit price may be misleading. The procedure does not handle complementarities. In such cases, the committee should recognize this and refer the bundle as a whole to administrative allocation (or design a bundle price) — but the RADP doesn't cover this. This is a failure mode we note.
  3. Other failure modes:
     - **Externalities**: If allocating a resource affects third parties (e.g., ICU beds affect entire hospital flow), the internal price might not capture that. The procedure does not account for externalities.
     - **Dynamic effects**: If current allocation affects future supply (e.g., research GPUs might lead to future patents), the static price may be inadequate. The RADP doesn't incorporate discounting or investment.
     - **Equity concerns**: The procedure is about efficiency. If equity is paramount (e.g., life-saving drugs), then even if the price system passes, the committee might refer the decision at Step 6.

  **Single-Page Summary for the Director:**

  **Case 1: Cloud GPU Hours**
  - Verdict: Allocate by internal price at commercial market rate.
  - Decisive Step: All steps passed. Anchor test (external market) was key.

  **Case 2: Intensive-Care Beds in Winter Surge**
  - Verdict: Do not use internal price. Allocate by medical priority protocol.
  - Decisive Step: Step 1 (Refusal Test) failed. Clinicians cannot refuse beds based on price.

  **Case 3: Nursing Shifts Across Units**
  - Verdict: Do not use internal price. Allow ward managers to trade shifts locally.
  - Decisive Step: Step 2 (Channel-Degradation Audit) detected local knowledge loss. Refer to local trading.

  **Judgment Call Dressed as Procedure:** In Case 3, the initial answer at Step 1 (Refusal Test) might be ambiguous. If the committee decides that units do have refusal rights (e.g., they can hire externally instead of using the internal pool), then the procedure would proceed to Step 2. But this interpretation of refusal rights is a judgment call. The procedure requires explicitly defining the unit's rights, which may require policy clarification.

  **Final Note:** The procedure is a tool to avoid common pitfalls, but it cannot resolve value conflicts. It is designed for efficiency-focused allocation. When other values (like equity) dominate, the committee must refer the decision upwards.
answer: |-
  Below is the Resource Allocation Decision Protocol (RADP), distilled from the socialist calculation debate into a 90-minute procedure for your committee. It preserves core distinctions (refusal rights, dispersed knowledge, trial-and-error feasibility, budget hardness, and price anchoring) while dropping abstractions like "tacit knowledge" (unobservable in records) and Lange's iterative dynamics (infeasible for one-off decisions). Dropped elements are excluded due to your constraints: no economist, no time for theoretical debates, and reliance on auditable records. The procedure defaults conservatively—**assuming central allocation is flawed but necessary when key data is missing**—because permanent data gaps imply systemic incapacity to price accurately, and mispricing risks grave inefficiencies (e.g., ICU bed misallocation).  

  ---

  ### **Resource Allocation Decision Protocol (RADP)**  
  *Execute steps in sequence. Stop early if any hard stop/referral trigger is met. Time: ≤15 min/step.*  

  #### **Step 1: Refusal Test**  
  - **Question**: "Can at least one acquiring unit *formally decline* to take this resource at a stated price without override by this committee or senior leadership? (e.g., by using an alternative supplier, rejecting the allocation, or repurposing their budget elsewhere)."  
    - *Sufficient answer*: Documented policy or contract allowing refusal (e.g., research group bylaws permitting external GPU rental).  
    - *No answer*: No such policy exists or is unverifiable.  
  - **Default rule**: Default to **no refusal rights** if unanswered.  
    - **Defense**: Mises’s core argument—without refusal, "prices" are coercive allocations. Defaulting to "no" prevents arithmetic theater.  
  - **Trigger**:  
    - If **no** → **Hard stop: Do not use internal pricing**. Allocate administratively (e.g., by clinical priority or seniority).  
    - If **yes** → Proceed to Step 2.  

  #### **Step 2: Channel-Degradation Audit**  
  - **Question**: "For the last 3 comparable allocations, did local actors (e.g., ward managers, researchers) possess *non-recorded* information that would have changed central decisions? (e.g., a nurse knowing Unit A’s shift gap was temporary, but central logs showed only ‘understaffed’)."  
    - *Sufficient answer*: Audit trail showing local input was (a) sought and (b) incorporated into records (e.g., meeting minutes with ward manager attestations).  
    - *No answer*: Records are incomplete, or audits don’t exist.  
  - **Default rule**: Default to **degradation exists** if unanswered.  
    - **Defense**: Hayek’s dispersed knowledge—missing local signals are likely, not exceptional. Defaulting to "degradation" avoids false confidence in central data.  
  - **Trigger**:  
    - If **degradation exists** → **Referral: Devolve allocation to local units** (e.g., let ward managers trade shifts).  
    - If **no degradation** → Proceed to Step 3.  

  #### **Step 3: Latency Ratio**  
  - **Question**: "Divide the resource’s *typical scarcity duration* (e.g., winter surge = 8 weeks) by the *time to detect shortage* via our signals (e.g., ICU waitlist updates weekly). Is the ratio >1? (i.e., can we detect shortages faster than the scarcity lasts?)."  
    - *Sufficient answer*: Historical data (e.g., surge duration from past years, signal lag from IT logs).  
    - *No answer*: No duration/detection records exist.  
  - **Default rule**: Default to **ratio ≤1** (signal too slow) if unanswered.  
    - **Defense**: Lange’s trial-and-error requires faster feedback than scarcity; slow signals prevent correction. Defaulting to "too slow" prevents divergence.  
  - **Trigger**:  
    - If **ratio ≤1** → **Hard stop: Do not use pricing**. Allocate by queue or lottery.  
    - If **ratio >1** → Proceed to Step 4.  

  #### **Step 4: Soft-Budget Absorption**  
  - **Question**: "Does consuming an extra unit directly reduce the acquiring unit’s *discretionary spending power*? (e.g., research grants diminish when GPUs are billed, not just ‘charged’ to a cost center)."  
    - *Sufficient answer*: Budget logs showing discretionary funds decrease post-allocation (e.g., grant account statements).  
    - *No answer*: No linkage between consumption and discretionary spending.  
  - **Default rule**: Default to **soft budget** if unanswered.  
    - **Defense**: Soft budgets negate price incentives (Kornai). Defaulting to "soft" prevents phantom discipline.  
  - **Trigger**:  
    - If **soft** → **Hard stop: Do not use pricing**. Allocate by administrative rules.  
    - If **hard** → Proceed to Step 5.  

  #### **Step 5: Anchor Test**  
  - **Question**: "Is there an *external market price* (e.g., commercial GPU rates) or *objective cost anchor* (e.g., marginal production cost) for this resource? If not, can we simulate bidding (e.g., units auction their requests)?"  
    - *Sufficient answer*: Documented external price (e.g., AWS invoice) or cost model (e.g., staff-hour calculations).  
    - *No answer*: No anchor exists (e.g., unique surgeon’s time).  
  - **Default rule**: Default to **no anchor** if unanswered.  
    - **Defense**: Mises’s calculation problem—prices without anchors are arbitrary. Defaulting to "no anchor" avoids garbage inputs.  
  - **Trigger**:  
    - If **no anchor** → **Hard stop: Do not use pricing**. Allocate by need or seniority.  
    - If **anchor exists** → **Allocate by internal price** (e.g., chargeback at market rate).  

  #### **Step 6: Value Judgment Referral**  
  - **Trigger**: After all steps, if the committee agrees the decision hinges on **non-efficiency criteria** (e.g., ethics, equity, or brand values)—e.g., "Should we prioritize pediatric ICUs?" → **Refer to executive leadership** with context.  
    - *Rationale*: Prices optimize efficiency; other values require human judgment.  

  ---  
  ### **Application to Your Cases**  
  *Single-page summaries for director sign-off.*  

  #### **Case 1: Cloud GPU Hours**  
  - **Verdict**: **Allocate by internal price** at commercial market rate.  
  - **Decisive Step**: Step 5 (Anchor Test)—external market price exists and is verifiable.  
  - **Process**:  
    - Step 1: Pass (research groups can refuse by using external clouds).  
    - Step 2: Pass (usage logs show local data captured).  
    - Step 3: Pass (scarcity lasts a quarter; real-time usage data).  
    - Step 4: Pass (grants reduce with consumption).  
    - Step 5: Pass (AWS invoices provide anchor).  
  - **Sign-off**: "GPU allocation approved for chargeback at $0.75/core-hour. Efficiency confirmed via RADP."  

  #### **Case 2: Intensive-Care Beds (Winter Surge)**  
  - **Verdict**: **Hard stop: Do not use pricing**. Allocate by triage protocol.  
  - **Decisive Step**: Step 1 (Refusal Test)—clinicians cannot refuse beds.  
  - **Process**:  
    - Step 1: Fail (units cannot decline beds without violating care standards).  
    - **Stop**.  
  - **Rationale**: Pricing would prioritize wealthy departments, not patients. RADP overrules committee’s hope to "end bedside arguments"—it flags this as coercion, not a market.  
  - **Sign-off**: "ICU beds allocated via triage protocol. RADP Step 1 refusal test not met."  

  #### **Case 3: Nursing Shifts Across Units**  
  - **Verdict**: **Referral: Devolve to ward managers to trade shifts**.  
  - **Decisive Step**: Step 2 (Channel-Degradation Audit)—local knowledge is lost centrally.  
  - **Process**:  
    - Step 1: Pass (units can refuse shifts if they hire externally).  
    - Step 2: Fail (past logs show ward managers knew shift gaps but central system overrode them).  
    - **Referral triggered**.  
  - **Judgment Call Dressed as Procedure**: Step 1’s "refusal" interpretation. Finance may argue units can’t refuse, but RADP uses formal policy (e.g., union contracts allowing external hires). This is policy arbitration, not economics.  
  - **Sign-off**: "Nursing shifts delegated to unit-level trading. RADP Step 2 degradation detected."  

  ---  
  ### **What RADP Cannot Do**  
  1. **One-off allocations** (e.g., scarce drug with no future trials):  
     - Fails at Step 2 (no past data for audit) and Step 3 (no scarcity duration for latency ratio).  
     - **Result**: Hard stop at default steps. Requires administrative allocation (e.g., medical ethics panel).  

  2. **Bundled goods** (e.g., MRI + radiologist time):  
     - Per-unit pricing misallocates complements (e.g., MRI slots without reporters are useless). RADP lacks a bundling test—this is **referred at Step 6** as a value judgment.  

  3. **Other failure modes**:  
     - **Zero marginal cost goods** (e.g., unused cloud capacity): RADP Step 5 (Anchor Test) fails without cost data, defaulting to administrative allocation.  
     - **Politicized budgets**: If soft budgets (Step 4) are enforced as "hard" by fiat, RADP cannot detect gaming (e.g., units lobbying for more funds).  
     - **Cross-resource dependencies**: E.g., GPU hours enabling drug research. RADP treats resources in isolation—this requires executive referral (Step 6).  

  RADP’s strength is preventing *worse* decisions: it blocks pricing where markets can’t form (refusal, anchors) or signals are broken (degradation, latency). It cannot replace values (Step 6) or handle hyper-complexity, but it ensures committee time focuses on tractable questions with auditable answers.
