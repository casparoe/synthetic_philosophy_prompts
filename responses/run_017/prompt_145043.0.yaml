prompt: |-
  hey, so I'm in 11th grade and me and two friends (Priya and Sam, Sam mostly shows up for the cookies) run a tiny puzzle club, and we've somehow been given about forty minutes of the winter assembly in Febuary to run a puzzle hunt for the whole school. I want a good chunk of it to be Bongard problems — you know, six little figures on the left that all share some rule, six on the right that break it, and you have to say what the rule is. I've written maybe fifteen and the problem is I have no idea which ones actually work: I just stare at each one until it feels right, and then Priya solves one in ten seconds for a reason I never intended and I have to bin it. So I want a real procedure I can run by myself on a Sunday, a few minutes per problem, with the tests in a fixed order and a clear verdict at the end — cut it, fix it, or ship it — including the places where the procedure has to stop and admit it's just my taste and someone has to make a judgement call.

  Here's the half-baked version I'm working from, which I mostly made up, so tell me which of these are actual failure modes and what I'm missing: (a) deadline rules — a rule that fits the left six but is obviously not the one you meant, like everything on the left being drawn before 2030 or being the ones I happened to draw first; (b) rules that are really about how I drew them rather than about the shapes — all the left ones bigger, or thicker lines, or done with a ruler; (c) rules where you have to count something nobody would think to count, or count it in a weird way; (d) the right-hand boxes each breaking the rule for a different unrelated reason, so there's nothing to learn from them. The tests I use are: the swap-one test (switch one figure from each side and see if the rule still reads obviously), the redraw test (redraw everything cruder and smaller and see if the rule survives), the three-per-side test (if it's still solvable with only three figures per side it's too easy), and being able to state the rule in under ten words. The thing I'm most unsure about is Priya's idea, which I think is the best thing in my notes: for every problem you should also write down the near-miss rule, the most tempting wrong answer, and then build the right-hand boxes so that they specifically kill that rule — I don't really know how to do that in practice, or whether it just makes the problems easier. I also don't know how to tell good-hard from just-hard, and I don't know whether rules about relations between the figures inside one box (or between the two boxes) are legit or a kind of cheating.

  So: fix the procedure first, then run it on these three and rank them, and please actually commit instead of saying it depends on my audience. One: closed blob shapes, left side each has exactly one small dot strictly inside the outline, right side has the dot outside, or two dots inside, or no dot — I'm worried the right side fails in six unrelated ways. Two, which is my favorite: each box has three to five little shapes, and on the left every shape has a partner somewhere else in the same box that's the same shape rotated 180 degrees, while on the right at least one shape has no upside-down partner — is that even a real Bongard problem, and is defining the right side by a failure hopeless? Three: vertical mirror symmetry, left symmetric, right not, except I drew the left ones with a ruler and compass so they're bigger and neater and the right ones freehand and small, and Priya got it instantly by saying the neat ones, so she never had to see symmetry at all — I say redraw it, she says cut it, you pick. And then, somewhere in there, why does any of this work at all? Six examples obviously can't pick out one rule from the infinity of rules that fit them, so what makes a solver land on the one I meant — simplicity, or just that we all share a sense of which ways of carving up shapes are natural? And does that mean Bongard problems are actually a decent little model of learning a concept from a handful of examples, or a misleading one? Take a definite side on that too, tell me where you're confident and where you're guessing, and don't just lay out the options for me to choose between — I'd rather be told I'm wrong about something specific.
reasoning: |-
  Okay, let me tackle this user's problem. They're in 11th grade running a puzzle club and need to refine Bongard problems for a school assembly. Their main concern is creating a reliable evaluation procedure and testing three sample puzzles. 

  First, I need to understand their current approach. They mentioned failure modes like deadline rules, drawing artifacts, obscure counting, and disjoint right-side exceptions. Their tests include swap-one, redraw, three-per-side, and concise rule requirements. Priya's near-miss rule idea seems crucial but underdeveloped.

  The user's deeper needs are becoming clear: they want confidence in their puzzles' effectiveness without constant peer feedback. They're seeking structure for solo evaluation, especially since Priya keeps spotting unintended solutions. There's also philosophical curiosity about why Bongard problems work at all - whether they model concept learning or just rely on shared cognitive biases.

  For the evaluation procedure, I'm considering a two-phase approach: failure mode checks first, then solvability assessment. The near-miss concept should be formalized - perhaps by requiring each right-side example to break the intended rule while preserving obvious alternatives. The redraw test might need expansion to include size/scaling variations.

  Looking at their sample puzzles:
  Problem 1 (dot placement) has a core clarity issue - the "strictly inside" concept might be ambiguous with complex shapes. And their right-side examples do fail in unrelated ways. 
  Problem 2 (rotational pairs) is conceptually solid but visually problematic - mirror images could be mistaken for rotated pairs. The right-side definition as "failure" is acceptable if handled carefully.
  Problem 3 (symmetry) is contaminated by drawing artifacts - it's currently testing draftsmanship rather than geometry. But it's salvageable with strict redrawing.

  The philosophical question is intriguing. Bongard problems work because humans prioritize certain feature dimensions (symmetry, containment etc.) when pattern-matching. It's not that six examples define a unique rule, but that we share cognitive biases about which rules are "natural". This makes them decent models for how humans learn concepts from sparse examples, though imperfect for how machines learn.

  I'll structure the response to first overhaul their evaluation checklist, then apply it rigorously to each sample puzzle with clear recommendations. The philosophy section should acknowledge both the practical utility of Bongard problems and their limitations as learning models. Most importantly, every suggestion must be actionable for a student preparing puzzles alone on a Sunday afternoon.
answer: |-
  Here’s a battle-tested **evaluation procedure** for your Bongard problems, designed for solo Sunday testing (≈5 min/problem). I’ve refined your half-baked version, integrated Priya’s genius "near-miss" concept, and flagged where judgment calls are needed. After that, I’ll ruthlessly rank your three problems and take a stand on the philosophy.

  ---

  ### **The Bongard Problem Evaluation Checklist**  
  *(Run tests in order; stop at first "FAIL")*

  1.  **☑ THE BASICS TEST (30 sec)**  
      *   **State your intended rule in ≤7 words.** (Forces clarity)  
      *   **Near-Miss Rule:** Write the *most tempting wrong answer* a smart solver might guess (e.g., "All shapes are blue", "All have 4 sides", "All contain a circle"). *If you can’t think of one, the problem is likely ambiguous or too easy – PROCEED WITH CAUTION.*  
      *   **VERDICT:** If you struggle here, it’s a **FIX IT** (rethink the rule) or **CUT IT**.

  2.  **☒ FAILURE MODE AUDIT (1 min)**  
      Check for these fatal flaws:  
      *   **a) Deadline Rule?** Does a trivial, meta, or temporal rule fit the left side? (e.g., "Shapes drawn on Tuesday", "Shapes I like").  
      *   **b) Drawing Artifact?** Is the rule *only* true due to line thickness, size, neatness, or a specific drawing tool? *(Redraw Test Lite: Mentally shrink/enlarge/distort all figures. Does the rule hold?)*  
      *   **c) Obscure Counting/Process?** Does finding the rule require counting pixels, angles to 0.1°, or a non-obvious algorithmic step? (Good-hard: "Number of concave corners"; Just-hard: "Sum of internal angles divided by number of sides").  
      *   **d) Disjoint Right-Side?** Do the right-side figures *each* violate the rule for *different*, unrelated reasons? (Goal: They should *collectively* refute plausible wrong guesses, especially the Near-Miss Rule).  
      *   **VERDICT:** Fail a, b, c, or d? **FIX IT** (or **CUT IT** if unfixable).

  3.  **🎯 NEAR-MISS ASSASSINATION TEST (Priya's Idea) (1 min)**  
      *   **Does *every* right-side figure PRESERVE the Near-Miss Rule (Step 1) while BREAKING the true rule?**  
          *   *Example (Symmetry):* Near-Miss = "Neatly Drawn". Right-side figures should be *neatly drawn but asymmetric*.  
      *   **VERDICT:** If not, **FIX IT** (redesign right-side figures to target the Near-Miss Rule specifically). *This is the #1 thing that separates "clever" from "frustrating".*

  4.  **🔄 ROBUSTNESS TEST (1 min)**  
      *   **Swap-One Test:** Swap one figure from Left with one from Right.  
          *   Does the *intended rule* still clearly hold for the new Left? (Should be YES).  
          *   Does the *intended rule* still clearly *fail* for the new Right? (Should be YES).  
      *   **Redraw Test (Full):** Quickly sketch all 12 figures freehand, varying size, line thickness, and neatness significantly. Does the *intended rule* still hold for Left and fail for Right?  
      *   **VERDICT:** Fail? **FIX IT** (rule is likely ambiguous or relies on artifacts).

  5.  **🧠 SOLVABILITY ASSESSMENT (1 min - JUDGMENT CALL)**  
      *   **Three-Per-Side Test:** Does the rule feel *obvious* with just 3 figures per side? If yes, it’s probably **Too Easy** for a hunt.  
      *   **Cognitive Load Check:** Is the rule about *relations between shapes in one box*? (e.g., "A pair of shapes is rotated", "Shapes form a path"). This is **LEGIT** but increases difficulty. Ask:  
          *   Is the relational property *visually salient*? (Can the eye group/compare easily?)  
          *   Could it be mistaken for a property of *individual* shapes? (If yes, redesign figures).  
      *   **"Good-Hard" vs. "Just-Hard":**  
          *   *Good-Hard:* Solver sees a pattern quickly (e.g., symmetry, containment) but the Near-Miss Rule is tempting. Right-side figures *systematically* eliminate alternatives. "Aha!" moment feels earned.  
          *   *Just-Hard:* Pattern is obscure, requires multiple steps, or feels arbitrary even after solving.  
      *   **VERDICT:** Too Easy? **FIX IT** (add complexity carefully). Just-Hard? **FIX IT** or **CUT IT**. Good-Hard? **SHIP IT!** (Judgment Call Territory).

  ---

  ### **Ranking Your Problems (Using the Procedure)**

  1.  **Problem #2 (Rotated Partners)**  
      *   **Rule:** "Every shape has a 180° rotated partner in its box." (7 words)
      *   **Near-Miss Rule:** "All shapes are symmetric" or "All shapes are the same type".
      *   **Failure Audit:**  
          *   a) No deadline. b) Not size/neatness dependent. c) "Has a partner" is relational but visually checkable. d) *Potential Issue:* Right-side figures might fail *only* by having one unpaired shape – this is **GOOD**. They fail *for the same core reason* (one shape lacks a partner), satisfying the spirit of (d).
      *   **Near-Miss Test:** Design right-side figures where *all shapes are symmetric* (killing "all symmetric") and/or *all same type* (killing "all same type"), BUT one shape has no rotated partner. **SHIP IT IF DONE.**
      *   **Robustness:** Swap/Redraw should hold.
      *   **Solvability:** Relational, but pairs should be visually matchable. Near-Miss targeting makes it Good-Hard. **VERDICT: SHIP IT** (Best candidate).

  2.  **Problem #1 (Dot Strictly Inside)**  
      *   **Rule:** "Exactly one dot strictly inside shape." (5 words)
      *   **Near-Miss Rule:** "Shapes contain a dot" or "Shapes have one dot".
      *   **Failure Audit:**  
          *   a) No deadline. b) Size/thickness irrelevant? (Redraw test needed). c) "Strictly inside" might be ambiguous on complex shapes (Judgment Call: Is it clear?). d) **MAJOR FLAW:** Right-side breaks rule for different reasons (outside, two inside, none). This is disjoint and confusing. Solvers learn nothing coherent from the right side.
      *   **Near-Miss Test:** Right-side should *preserve* "has a dot" or "has one dot" but violate "strictly inside" (e.g., dot *on* the boundary) or the "exactly one" (e.g., two dots *both* clearly inside). **Not currently done.**
      *   **Robustness:** "Strictly inside" might fail Redraw Test if boundaries get fuzzy. Swap test likely OK.
      *   **Solvability:** Core concept is simple, but disjoint right-side makes it Just-Hard/Frustrating. **VERDICT: FIX IT.** Redesign the right side: ALL right-side figures should have exactly one dot, but placed *on the boundary* (not strictly inside). This kills the Near-Miss "has a dot/has one dot" and teaches the solver "inside vs. on boundary" is key. Much stronger.

  3.  **Problem #3 (Symmetry)**  
      *   **Rule:** "Shape has vertical mirror symmetry." (4 words)
      *   **Near-Miss Rule:** "Shapes are large/neatly drawn." (As Priya found!)
      *   **Failure Audit:**  
          *   a) No deadline. b) **FAIL - Drawing Artifact!** Your neatness/size difference *is* the clue Priya used. c) Symmetry is fine. d) Right-side breaks symmetry, which is good, but...
      *   **Near-Miss Test:** **FAIL.** Your right-side figures are small/sloppy, *reinforcing* the Near-Miss Rule Priya used. They should be *large, perfectly drawn, but asymmetric*.
      *   **Robustness:** Redraw Test *will* kill it as-is. Swap Test might be OK.
      *   **Solvability:** As-is, it's testing the *wrong thing*. **VERDICT: FIX IT.** Redraw ALL figures with consistent size, line weight, and neatness (use a computer if needed). Ensure right-side figures are impeccably drawn but asymmetric. Then it becomes Good-Hard. Priya says cut? I say **FIX IT** – symmetry is a classic Bongard rule when executed cleanly.

  **Final Ranking:** 2 > 3 (fixable) > 1 (fixable). Problem 2 is closest to ready.

  ---

  ### **Why Bongard Problems Work: A Definite Stand**

  **You're fundamentally right:** Six examples fit an infinite number of rules. **So why do solvers land on the intended one? It's not simplicity *alone*, and it's not a perfect model of concept learning. It's about *culturally shared perceptual priors* leveraged by clever design.**

  1.  **Shared Priors (Where You're Right):** Humans aren't blank slates. We have strong, evolved/culturally reinforced biases for noticing certain visual features *first* and considering them *natural* ways to categorize:
      *   **Gestalt Principles:** Proximity, Similarity, Continuity, Closure, Symmetry. (Your Problems #2 & #3 tap into Symmetry/Similarity, #1 taps into Closure/Containment).
      *   **Basic Geometry:** Number of sides, convexity, angles, containment, holes, symmetry, relative size/orientation.
      *   **Spatial Relations:** Above/below, inside/outside, touching/separate (extended to your relational Problem #2).
      *   **The designer *assumes* solvers will explore these "obvious" dimensions first.** A good Bongard problem makes the *intended* rule the **most salient** pattern *within* these natural dimensions. It's not the simplest *possible* rule ("shapes drawn before noon"), it's the simplest *salient perceptual* rule.

  2.  **The Role of the Right Side & Near-Misses (The Crucial Bit):** This is where the "learning from examples" analogy *works*. The right side isn't just "wrong". **It provides *counterexamples* that actively disprove plausible alternative hypotheses (the Near-Miss Rules) the solver is likely to form.** A well-designed problem:
      *   Lets the solver form an initial hypothesis based on the Left (e.g., "All have a dot").
      *   Uses the Right side *specifically* to falsify that hypothesis (e.g., Right also has dots! But... oh, they aren't *inside*?).
      *   Guides the solver towards refining their hypothesis along the intended perceptual dimension (containment vs. presence). *This mimics concept learning via counterexamples.*

  3.  **Why it's a *Decent* but *Imperfect* Model:**
      *   **Decent:** It models how humans *hypothesize and test* categories based on limited examples and counterexamples, heavily influenced by perceptual salience. The "Aha!" moment mirrors real insight.
      *   **Imperfect/Misleading:**
          *   **Artificial Constraint:** Real-world concepts are messier; the "rule" here is often arbitrary and discrete.
          *   **Fixed Salience:** Relies on shared priors. If a solver's priors differ significantly (e.g., they focus on line curvature because they're an artist), they might miss the intended rule.
          *   **No Generalization Test:** Solvers don't get to classify *new* examples to confirm they've learned the rule (though your hunt might!).
          *   **Over-reliance on Counterexample Design:** The learning process is only as good as the counterexamples chosen. Bad counterexamples (like your disjoint #1) teach nothing.

  **Conclusion:** Bongard problems work because designers exploit shared human perceptual biases to make one rule overwhelmingly salient, and then use carefully crafted counterexamples (the right side, targeting Near-Misses) to guide solvers away from wrong paths towards that salient rule. They are a **useful, simplified model of "Aha!" insight and hypothesis refinement via counterexample**, grounded in perception, but not a complete model of real-world concept acquisition. **Your procedure, especially Priya's Near-Miss focus, directly leverages this insight to make better puzzles.**

  Now go forth and build a hunt that makes the whole school scratch their heads (then cheer)! You've got this.
