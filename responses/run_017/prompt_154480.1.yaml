prompt: |-
  I lead the country-diagnostics team at a bilateral development agency. Three of us — myself and two economists with solid econometrics training but no historical expertise — write roughly forty country growth notes a year, about two weeks each, and every note feeds directly into lending decisions between fifty and three hundred million dollars. Each one has to be signed off by a regional director who is openly skeptical of causal stories and who now requires us to state, in writing, why we believe one cause rather than another. The decisions are not academic: they are whether to attach a governance condition to a loan, whether to fund a transport corridor instead of a judicial reform program, whether to tell a government that its growth problem is institutional. So what I need from you is a decision procedure my team can actually run, not an essay about the state of the debate.

  The candidates we argue over are the usual ones — colonial legal origin, disease ecology and the disease environment inherited from the past, landlockedness and distance from the coast, terms of trade and resource rents, culture, religion and social trust, institutional quality — and the difficulty is that none of our decisions is about which of them is true in general. It is about one country, over ten to fifteen years, with money attached. I want the procedure to be explicit about the mismatch between the horizon of the cause and the horizon of the decision: a cause that explains levels of income over five centuries may say very little about what a loan can change in fifteen years, and a cause that explains a growth episode may not explain the level.

  Over two years we have accumulated five loose tests that we apply inconsistently, and I want you to decide which of them survive, in what order they should be run, what counts as a sufficient answer to each, where the procedure stops with a no, and where it hands the decision to a person because the remaining question is one of values rather than evidence. The tests, as we use them now: one, for any claim that cause C explains outcome Y in country X, name a country that had C without Y and a country that had Y without C, and say whether the two are matched on the other candidate causes — counting effective independent cases rather than nominal ones, so that countries sharing a colonial origin, a legal family, or a border are not counted as separate confirmations; if no matched pair can be named, cap the claim at consistent with. Two, run the story backwards: using only what was knowable about X twenty-five years earlier, would this story have ranked X's subsequent trajectory as likely, or does it depend on a fact that only became visible after the fact. Three, say whether C and the competing cause D are rivals or links in a chain, since if D operates through C then the statistical strength of C does not refute D. Four, name the range of contexts in which C's effect was actually observed and the distance from that range to X, state the discount being applied for the distance, and flag the claim as extrapolation when the distance is large. Five, check whether the measure of C was itself constructed partly from income or growth, as expert-coded perceptions of governance frequently are, and treat a contaminated measure as unusable for the purpose rather than merely imprecise.

  Then run the procedure on three cases. The first is a landlocked, malaria-burdened country whose income per head has barely moved in forty years and which is now requesting a public financial management reform loan premised on the claim that institutions are the binding constraint. The second is a coastal country that opened export processing zones twenty-five years ago and has grown steadily since, and whose government now wants us to fund a replication of the policy in two more cities. The third is the one I will not like: a judicial strengthening and land titling program my own unit has already announced in a country where our previous notes attributed recent growth to institutional quality, and where the program's approval documents rest on that attribution. Give me the answer the procedure yields on all three even where it undercuts us, and say plainly in the third case which part of the decision then belongs to a person, and on what grounds a person could still choose to proceed.

  Please also state what the procedure cannot do, and mark the points where judgment cannot be eliminated rather than smoothing them over. Do not cite papers, authors, or datasets: I do not want a reading list, and I would rather you not reconstruct references from memory. Where a step needs an empirical number, tell me how to get one instead of supplying one you are not sure of. Write it as continuous prose, the way one would write a long email to a colleague — no headings, no bullet points, no bold text, no tables; if you need to order the steps, number them inside the sentences rather than with a list — and aim for somewhere between twelve hundred and fifteen hundred words.
reasoning: |-
  Okay, this is a highly specific and operational request from someone in a high-stakes development lending context. The user leads a country-diagnostics team at a bilateral development agency, and they need a practical decision procedure for causal attribution in growth notes that directly inform lending decisions worth $50-300 million. 

  First, I need to understand the core tension: they're caught between rigorous causal analysis and actionable policy advice within tight time constraints (two weeks per note). The regional director's skepticism about causal stories adds pressure, requiring written justifications. The key insight here is that they're not debating general theories but making country-specific, time-bound decisions with real consequences - like attaching governance conditions to loans or choosing between infrastructure and institutional funding.

  The user explicitly rejects academic debates and wants a procedural solution. They've already developed five "loose tests" but apply them inconsistently. My task is to harden these into a sequenced workflow with clear stopping rules. The three test cases (landlocked stagnant economy, successful coastal EPZ country, and the politically sensitive judicial reform case) will be crucial for stress-testing the procedure.

  Notable constraints: no citations, continuous prose only (1200-1500 words), and emphasis on where human judgment remains necessary. The user is clearly experienced - they mention "effective independent cases" not nominal ones, and understand the mismatch between long-term structural causes and short-term policy horizons. 

  I should start by reframing their five tests into a logical sequence:
  1. Temporal precedence and predictability (their test 2)
  2. Contamination check (test 5)
  3. Counterfactual mapping (test 1)
  4. Causal structure (test 3)
  5. Contextual transferability (test 4)

  The sequencing matters because some tests are eliminatory (like contamination) while others require judgment. For instance, if a measure is contaminated (like governance indices based on income proxies), it should disqualify that causal claim immediately - no need to proceed to other tests. 

  For the landlocked country case, the procedure should flag that institutional arguments face two problems: malaria burden creates a competing structural constraint, and governance measures may be contaminated by income data. The coastal EPZ case is cleaner but requires checking whether the policy novelty has faded over 25 years. The judicial reform case will be toughest - it likely fails the contamination test and counterfactual mapping, forcing the team to explicitly acknowledge this is a values-based decision about political priorities rather than evidence-based causality.

  Crucially, I must highlight what the procedure can't do: resolve fundamental causal debates, predict black swan events, or eliminate judgment on extrapolation discounts. The "discount for distance" in test 4 will always be subjective - I'll suggest benchmarking against similar contextual jumps in past evaluations rather than inventing formulas.

  The tone should match their professional urgency: direct, concise, and operationally precise. When addressing the sensitive third case, I'll need to be diplomatically blunt - the evidence can't support the causal claim, so the decision to proceed becomes political (e.g., maintaining donor relationships) and must be owned by the regional director.
answer: |-
  Here is a decision procedure built from your five tests, hardened into a sequence with explicit pass/fail thresholds, stopping rules, and a clear handoff to human judgment where evidence cannot decide. It prioritizes eliminatory checks first and forces explicit acknowledgment of evidentiary limits and value judgments. Run in strict order:

  **1. Contamination Check (Test 5 - First because it invalidates evidence):** For each candidate cause (C), examine how its measure for country X was constructed. If the measure directly incorporates income levels, growth rates, or outcomes materially dependent on them (e.g., expert assessments of "governance quality" that implicitly reference economic performance, composite indices using GDP per capita as an input, or survey measures heavily influenced by contemporaneous economic conditions), mark C as **contaminated**. Contaminated measures are unusable for *causal attribution* in this context. They do not merely add noise; they create circularity. The claim "C causes Y" cannot be supported using this measure. *If a cause relies solely on contaminated measures, stop. The claim fails.* You cannot proceed to other tests for this C using this data. If alternative, uncontaminated measures exist (e.g., specific, objective institutional features coded from laws, historical malaria burden maps pre-dating modern growth), proceed with those.

  **2. Temporal Precedence & Predictability (Test 2 - Tests if the cause could have been actionable):** Using *only* information plausibly knowable 25 years before the period you are analyzing (or the start of the proposed intervention window), assess whether C (or a strong proxy for it) was observable *and* whether the causal story would have predicted the subsequent trajectory (Y) as a likely outcome relative to plausible alternatives. If the story relies heavily on factors only revealed *during* the period (e.g., "the institutions were revealed to be weak *because* growth stalled," or "the mineral boom wasn't foreseeable"), it fails predictive validity. The claim must be capped at "consistent with" the outcome, not "explanatory." *If the story fails this predictive test, stop for claims of strong causal necessity/sufficiency for this specific episode.* It remains a correlation. This does not automatically eliminate C as a potential target for *future* intervention (if it's changeable), but it weakens the case that it was *the* binding constraint *in the past*. Flag it as post-hoc interpretation.

  **3. Counterfactual Mapping (Test 1 - Tests general plausibility of isolated effect):** For the claim "C explains Y in X," identify at least one *effective independent case* (matching key confounders) that had C without Y and one that had Y without C. Key confounders typically include: region/neighborhood (shared shocks, geography), broad income level 25+ years ago (initial conditions), and major structural features relevant to the claim (e.g., for institutions, colonial origin; for geography, coastal access). If claiming C is necessary, find Y without C. If claiming sufficient, find C without Y. If no such pair can be identified despite genuine effort (don't force poor matches), cap the claim at "C is consistent with Y in contexts like X, but not demonstrably necessary/sufficient." *If no matched pair exists AND the claim asserts strong necessity/sufficiency for growth levels/changes in contexts like X, stop. Downgrade the claim's strength significantly.* It becomes an untested (or untestable) association within the relevant context cluster. This test is about the *plausibility* of isolating C's effect, not proving it definitively for X.

  **4. Causal Structure (Test 3 - Clarifies competing claims):** For the primary candidate cause C and the strongest competing cause D, explicitly state their relationship:
      *   **Rivals:** C and D offer distinct, separable explanations (e.g., "growth caused by institutions, not geography").
      *   **Complements:** C and D both contribute independently.
      *   **Chain:** D operates (partly or wholly) *through* C (e.g., "malaria burden affects institutions which then affect growth" meaning D -> C -> Y) or vice versa (C -> D -> Y).
      *   **Precondition:** C is necessary for D to operate (e.g., "basic security is needed for any policy to work").
      If C and D are links in a chain (D -> C -> Y), then finding a statistical association between C and Y does *not* refute D; it may even be expected. The actionable target depends on where intervention is feasible. If they are rivals, then evidence strengthening one should weaken the other. *This step doesn't stop the procedure but forces clarity: Is the debate about the *ultimate* cause (D) or the *proximate*, actionable one (C)?* Misidentifying rivals vs. chains is a major source of error.

  **5. Contextual Transferability (Test 4 - Assesses applicability to X):** Identify the specific contexts (countries, regions, time periods) where the effect of C (or policies changing C) on outcomes like Y has been credibly observed (drawing on uncontaminated data and plausibly predictive studies). Describe the key features of these contexts. Assess the "distance" between this observed range and country X. Key dimensions of distance often include: institutional heritage, level of development at the time of intervention, political system characteristics, social fragmentation, specific geographic challenges (beyond broad categories). *State explicitly the discount factor you are applying to the expected effect size in X based on this distance.* This discount is inherently judgmental; anchor it by recalling past instances where effects were extrapolated with similar distances and whether they succeeded or failed. *If the distance is large in multiple significant dimensions, flag the claim as **highly extrapolative**. A large-distance extrapolation cannot be the sole basis for a strong causal attribution of X's past trajectory or a high-confidence prediction of intervention impact.* It becomes a highly uncertain proposition.

  **Where Judgment Enters & Where the Procedure Stops:**

  *   **Step 1 (Contamination):** Binary. Contaminated = Fail. Judgment call: Is the measure *materially* contaminated? Minor indirect links might be noise; direct incorporation or heavy dependence is fatal.
  *   **Step 2 (Temporal Precedence):** Judgment call: What constituted "knowable" 25 years prior? Stick to documented data, observable conditions, foreseeable trends (e.g., demographics, known resource deposits). "Plausible predictability" avoids hindsight bias but requires realism about foresight.
  *   **Step 3 (Counterfactual Mapping):** Judgment call: What are the *key* confounders for this specific C/Y claim? What constitutes a valid "effective independent case"? Rigor is needed – neighboring countries often aren't independent; former colonies sharing a legal system often aren't. Judgment call: When is the lack of a counterfactual case fatal vs. merely limiting?
  *   **Step 4 (Causal Structure):** Judgment call: What is the *most plausible* structural relationship between C and D based on theory and patterns? Avoid forcing a chain if evidence suggests rivalry.
  *   **Step 5 (Transferability):** Highly judgmental. Defining the "observed range," identifying relevant "distance" dimensions, and setting the "discount factor." This cannot be eliminated. Mitigate by researching specific historical analogues and their outcomes. Large discount factors or high extrapolation flags are strong cautions, not automatic stops.
  *   **Overall Stopping Rules:**
      *   **Hard Stop:** Step 1 fails (Contaminated measure) for a crucial claim. The causal argument lacks valid evidence.
      *   **Soft Stop/Cap:** Step 2 fails (Lack of predictability) - Cap claim at "consistent with".
      *   **Soft Stop/Cap:** Step 3 fails (No counterfactual cases) - Cap claim at "consistent with in context, not proven necessary/sufficient".
      *   **Warning Flag:** Step 5 indicates High Extrapolation - The claim is highly uncertain.
  *   **Handoff to Human Judgment:** The procedure stops *for causal determination* when a claim hits a Hard Stop or a Soft Stop/Cap. However, decisions often must still be made. The handoff occurs when:
      1.  **Evidence is insufficient or contradictory** to support a strong causal claim about the *binding constraint* or primary driver, but a policy decision is still required. The choice then hinges on **values, priorities, risk appetite, or political considerations** (e.g., "Even though evidence that institutions are *the* binding constraint is weak/contaminated/extrapolative, governance reform aligns with our agency's core mandate and the government is willing, so we accept the higher risk").
      2.  **Extrapolation is necessary but large.** The decision to proceed despite high uncertainty involves **judgment about risk tolerance, potential upside, and lack of better alternatives**.

  **What the Procedure Cannot Do:**

  1.  **Prove causation definitively in a specific case.** It assesses the *strength and credibility* of causal claims given available evidence and inherent limitations.
  2.  **Eliminate all judgment.** Steps 2, 3 (defining confounders), 4, and 5 require significant expert judgment, even if structured.
  3.  **Predict the future.** It assesses past claims and the plausibility of future impacts based on past analogues, but cannot foresee unforeseen shocks or complex interactions.
  4.  **Resolve fundamental debates about deep historical causes.** It focuses on actionable constraints within the relevant timeframe (10-25 years).
  5.  **Generate precise effect sizes for novel contexts.** Extrapolation discounts are crude.
  6.  **Make the value judgment.** It can only show where evidence ends and values must begin.

  **Application to Cases:**

  1.  **Landlocked, Malaria-Burdened, Stagnant Country (Institutions as Binding Constraint):**
      *   Step 1: Scrutinize "institutional quality" measure. If it's a standard expert assessment (e.g., WGI), it's almost certainly **contaminated** by perceptions linked to poor growth. *Hard Stop for "institutions as primary cause of stagnation" claim using this data.* Alternative (uncontaminated) measure needed (e.g., specific legal framework features coded historically?). If unavailable, claim fails.
      *   Step 2: Malaria burden (D) was knowable 40 yrs ago. Could stagnant trajectory have been predicted? Likely yes, given geography/disease. Institutions? Harder to predict *stagnation* based on past measures alone unless already catastrophically bad.
      *   Step 3: Finding countries with similar geography/malaria but better growth? Very hard (Botswana? Requires matching *many* confounders). Finding countries with "weak institutions" but good growth? Possible (e.g., some resource-driven cases, but context differs). Suggests institutions not strictly *necessary*.
      *   Step 4: Malaria (D) likely affects growth partly *through* institutional quality (C) (e.g., state capacity, human capital). Institutions may also be independent. Rivalry is false; it's likely a chain (Geography -> Disease -> Institutions/Human Capital -> Growth). Targeting institutions *might* help, but the fundamental constraint is geographic/disease burden.
      *   Step 5: Institutional reform effects observed in contexts with high disease burden? Limited evidence; success often in healthier/more accessible places. High contextual distance. **High Extrapolation.**
      *   **Procedure Outcome:** Claim that institutions are *the* primary binding constraint likely **fails** due to contamination (Step 1) and high extrapolation (Step 5). Evidence supports geography/disease as a deep constraint. The loan *might* still be justified on other grounds (e.g., PFM reform is intrinsically good, government commitment), but not based on strong causal attribution of past stagnation to institutions alone.

  2.  **Coastal Country with Successful EPZs (Replication Funding Request):**
      *   Step 1: Measure "EPZ policy" is generally uncontaminated (existence of zones, rules).
      *   Step 2: EPZ policy was implemented 25 yrs ago. Could steady subsequent growth have been predicted? Plausibly, based on theory and early Asian examples, though magnitude uncertain. Passes.
      *   Step 3: Find countries with EPZs but no sustained growth? Yes (many). Find sustained growth without EPZs? Yes (many). EPZs not necessary or sufficient. But: Matched pairs? Finding a coastal, similar-income 25 yrs ago country that grew well *without* anything like an EPZ (maybe Mauritius pre-EPZ? Chile?) is possible, suggesting other policies could work. Finding a similar country with EPZs that failed (e.g., some in Africa/LA) also possible. Capped at "consistent with, not sole cause".
      *   Step 4: Competing causes? Macro stability, education, location. Likely complements or preconditions (macro stability needed *for* EPZs to attract investment).
      *   Step 5: EPZ success observed widely in coastal developing countries. Contextual distance to new cities in the *same* country is **low**. Discount factor minimal. High confidence in transferability *within country*.
      *   **Procedure Outcome:** Claim that EPZ policy *contributed* to past growth is credible (passes Steps 1,2,5). It was not the only possible path (Step 3). Replication *within the same country* has high contextual similarity (Step 5). Funding justification focuses on replicating a *proven domestic success factor* with low extrapolation risk, not claiming it's the universal key to growth.

  3.  **Judicial/Land Titling Program (Premised on Past Institutional Growth Attribution):**
      *   Step 1: Examine the "institutional quality" measure used in past notes. If it was standard expert assessments (highly likely), it was **contaminated**. *Hard Stop.* The causal claim ("institutions caused recent growth") in the past notes lacks valid evidence foundation if based on this.
      *   Step 2: Was institutional improvement knowable *before* the growth period? If using contaminated measures, this step is invalid. If using uncontaminated proxies (e.g., specific laws passed), could growth have been predicted? Possibly, but hard to isolate.
      *   Step 3: (Irrelevant if Step 1 fails the core claim).
      *   Step 4: (Irrelevant if Step 1 fails).
      *   Step 5: (Irrelevant if Step 1 fails).
      *   **Procedure Outcome:** The foundational causal claim ("institutions caused recent growth") **fails** at Step 1 due to contaminated measures. The program's approval documents rest on an evidentiarily invalid premise.
      *   **Handoff to Human Judgment:** The evidence cannot support the *causal attribution* justifying the program's design logic. However, the decision to proceed belongs to a person (e.g., Regional Director, Country Manager) based on:
          *   **Values/Priorities:** Belief in the intrinsic value of judicial reform/land titling for equity/justice, regardless of short-term growth impact.
          *   **Political Capital:** Maintaining trust with the government after public announcement.
          *   **Alternative Rationale:** Reconceptualizing the program (e.g., "This addresses a known development gap; past growth creates fiscal space to invest in institutions").
          *   **Risk Acceptance:** Acknowledging the weak causal evidence but proceeding anyway based on other factors.
      *   The person must explicitly state that the decision is *not* primarily based on the causal growth story, but on these other grounds. The procedure forces this transparency.

  This procedure forces rigor where possible, flags fatal flaws early (contamination), caps over-strong claims based on weak evidence (predictability, counterfactuals), highlights uncertainty (extrapolation), clarifies causal debates (structure), and makes the handoff to value-based decisions explicit and accountable when the evidence runs out. It won't make the decisions easy, but it makes the basis for them clear.
