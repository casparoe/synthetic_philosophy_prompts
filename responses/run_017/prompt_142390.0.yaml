prompt: |-
  I am a third-year undergraduate taking a sets, measure and philosophy of mathematics option, and last week I gave a short seminar presentation on how much of standard mathematics depends on the axiom of choice. A member of the audience produced what looked like a five-line refutation of choice itself, and for four days I have been unable to locate where it goes wrong. I would be grateful for a careful diagnosis. Please answer in British English.

  The set-up. Let a hat sequence be an infinite binary sequence, and let eventual equality be the relation that holds between two such sequences exactly when they differ in at most finitely many coordinates. This partitions the space of all sequences into classes, each of them countable. Call a selector for this relation a function that assigns to each sequence one representative of its own class, assigning the same representative to sequences that are eventually equal. The axiom of choice delivers such a selector, since it is just a choice function for the family of classes.

  The argument, as I reconstructed it afterwards:

  (1) By choice, fix a selector r for eventual equality.
  (2) Consider countably many prisoners, indexed by the natural numbers, each wearing a black or a white hat, with hat sequence x. Prisoner n sees every hat m > n and not their own, there is no communication once the hats are on, but the prisoners may agree a common strategy in advance. Let each prisoner n reason as follows: the tail they see determines the class of x uniquely, because two sequences in different classes disagree at coordinates arbitrarily far out; so take the representative r(x) of that class and guess its nth coordinate. Since x and r(x) are eventually equal, the guess is wrong at only finitely many n. Hence this strategy guarantees, for every possible hat sequence whatsoever, that only finitely many prisoners are wrong and that the proportion of correct guesses tends to one.
  (3) Now suppose instead that the hats are produced by infinitely many independent fair coin tosses, modelled by the usual fair-coin measure on the space of sequences.
  (4) Whatever strategy the prisoners fix in advance, the nth guess depends only on coordinates beyond n, and the coordinate x_n is independent of those and still fair. So the probability that the nth guess is correct is one half.
  (5) Averaging over n, for any strategy at all the limiting proportion of correct guesses is one half with probability one. I can make this precise: the centred indicators of the events guessing correctly are pairwise orthogonal, because the mth guess is settled by coordinates beyond m and hence by the tail beyond n whenever m > n, so a conditional expectation vanishes and Chebyshev on a sparse subsequence plus interpolation gives the limit. Nothing in that sketch seems to assume anything about the strategy beyond its existence.
  (6) But (2) exhibits a strategy whose proportion correct is one on every sequence, that is, on the whole space, whereas (5) says that the set on which the proportion is one half has measure one. The two sets are disjoint and cannot both be of full measure. Contradiction.
  (7) Step (3) is only the standard model of a fair coin, and (5) is a theorem with a proof I can write out. So the culprit must be (1) or (2): no such selector exists, and the axiom of choice is false.
  (8) This is far more than I bargained for. If there is no selector, then since a well-ordering of the reals would define one by taking the least member of each class, there is no well-ordering of the reals either; and by the usual equivalences I lose the Hahn–Banach theorem, bases for arbitrary vector spaces, and a good deal of the analysis I was taught. Worse, the form of the argument seems to generalise: any principle strong enough to manufacture a strategy that beats chance this badly is refuted by the same reasoning, and I appear to be pushed towards a set theory in which probabilistic intuitions about infinite sequences of trials are left standing only by crippling everything else.

  So which step do you reject? I would like to know precisely which step fails, why the step looked unexceptionable, and what rejecting it costs me. My own suspicion is somewhere between (4) and (5), because I was brought up on the classical slogan that no gambling system can beat a fair coin, and yet (2) is apparently a gambling system that beats one every single time; but I cannot turn that suspicion into a statement about a specific step, and if I simply give up (5) I seem to lose the very result that makes probability theory informative about limiting frequencies. If the trouble is that the strategy in (2) is not the kind of object to which (4) and (5) apply, I want to know exactly what restriction is doing the work and where it would have to be inserted for the proof in (5) to go through.

  Two further things I would find useful. First, what does the argument actually establish once the suspect step is repaired: does it survive as a genuine impossibility result of some kind, and if so is it really a new result or only a familiar phenomenon about non-measurable sets in a new costume? Second, how much choice does the strategy in (2) really need: would a weaker principle suffice to build it, or is a selector for a relation with continuum-many classes essential? If it could be built from something weaker, my refutation would refute less than I feared, which would be some comfort.

  I would prefer to keep (3) and the mathematics of (5) if at all possible, and I would very much rather not abandon the law of large numbers. Where is the cheapest place to give, and what am I paying for it?
reasoning: |-
  We are given an argument that appears to derive a contradiction from the Axiom of Choice (AC) by considering a hat problem and a probabilistic argument. The contradiction is between:
  - (2) A strategy (using a selector from AC) that guarantees that only finitely many prisoners are wrong, hence the proportion of correct guesses tends to 1 (i.e., 100% correct in the limit) for every hat sequence.
  - (5) A probabilistic argument that for any strategy, the limiting proportion of correct guesses is 1/2 almost surely (with respect to the fair coin measure).

  The goal is to identify the flaw and explain it in detail.

  Step (2) relies on AC to fix a selector for the equivalence relation of eventual equality. The strategy for prisoner n is:
  - Observe the tail of the hat sequence (all hats beyond n).
  - This tail determines the equivalence class of the entire sequence (because two sequences that are not eventually equal will differ infinitely often, so the tail will eventually show a difference if we compare with a representative from a different class).
  - The selector r assigns a representative to that class. Prisoner n then guesses the n-th coordinate of that representative.

  Since the actual sequence x is in the same class as r(x), they are eventually equal. Therefore, for all but finitely many n, the n-th coordinate of r(x) equals x_n. Hence, only finitely many prisoners are wrong, and the proportion of correct guesses tends to 1.

  Step (3) and (4) set up a probability model: the hat sequence is generated by independent fair coin tosses (each hat black or white with probability 1/2, independently). The argument then claims that for any fixed strategy, the n-th guess (which is a function of the hats beyond n, i.e., of the tail starting at n+1) is independent of the n-th hat. Therefore, the probability that the n-th guess is correct is 1/2.

  Step (5) then argues that the events of correct guesses are orthogonal (or uncorrelated) in a way that allows the application of a law of large numbers. Specifically, it claims that the limiting proportion of correct guesses is 1/2 almost surely.

  The contradiction is that (2) gives a strategy that achieves 100% correct in the limit for every sequence, while (5) says that for any strategy, the limit is 1/2 almost surely. Since the set of sequences where the proportion is 1 has full measure according to (2) (indeed, it is the entire space) but (5) says the set where the proportion is 1/2 has measure 1, these two sets are disjoint and both cannot have measure 1.

  The flaw:

  The flaw lies in step (4) and (5) when applied to the strategy defined in (2). Specifically, the strategy defined in (2) is not measurable with respect to the product sigma-algebra. Therefore, the events "the n-th guess is correct" are not measurable events, and we cannot assign probabilities to them in the usual way. Thus, the probabilistic reasoning in (4) and (5) breaks down.

  Why is the strategy non-measurable?

  The selector r, provided by AC, is a non-constructible function. The strategy for prisoner n depends on the entire tail beyond n, but also on the global selector r. The representative r(x) is chosen arbitrarily for each class. The key point is that the function that assigns to a tail (which determines the class) the n-th coordinate of the representative is not measurable.

  In more detail: the event that prisoner n guesses correctly depends on the entire tail beyond n and the selector r. However, the selector r is fixed in advance and is the same for all n. The problem is that the map (x, n) -> [the n-th guess is correct] is not measurable. In fact, the set of sequences for which the n-th guess is correct may not be a measurable set in the product sigma-algebra.

  Therefore, we cannot apply the law of large numbers as in (5) because the events are not measurable. The classical strong law of large numbers requires that the random variables (the indicators of correct guesses) are measurable and independent (or at least satisfy some conditions). Here, they are not even measurable.

  Why does step (4) seem plausible? It says that the n-th guess depends only on coordinates beyond n, and that the n-th coordinate is independent of those. This is true for the sigma-algebra generated by the coordinates beyond n. However, the guess is a function of the tail beyond n, but the function is so pathological (due to the use of AC) that it is not measurable with respect to the product sigma-algebra. Therefore, even though x_n is independent of the tail beyond n, we cannot conclude that the event that the guess is correct has probability 1/2 because the set of sequences for which the guess is correct is not measurable. Hence, we cannot assign a probability to that event.

  What does this cost us? We must accept that the strategy defined in (2) is not measurable. Therefore, we cannot use it in a probabilistic context without further assumptions (like measurability). The probabilistic argument (5) only applies to measurable strategies. Hence, there is no contradiction: the strategy of (2) exists (if we assume AC) but it is not measurable, so (5) does not apply to it.

  What does the argument establish? It shows that if we assume AC, then there exists a non-measurable set (in fact, the set of sequences for which the proportion of correct guesses is 1 is non-measurable). In fact, the entire strategy defines a non-measurable set for each n. This is a standard phenomenon: AC implies the existence of non-measurable sets.

  Is this a new result? No. The existence of non-measurable sets is well-known. The hat problem here is a variation of the classic hat problems that show the power of AC and the existence of non-measurable sets.

  How much choice is needed? The strategy in (2) requires a selector for the equivalence classes of eventual equality. The number of equivalence classes is the same as the number of real numbers (the continuum). The equivalence classes are countable, and there are continuum many of them. The axiom of choice for a family of sets of size continuum is needed. However, note that the existence of a well-ordering of the reals (which is equivalent to AC) would give such a selector. But without AC, we cannot guarantee such a selector.

  In fact, it is known that in models of set theory without AC (but with the Axiom of Determinacy, for example), every set of reals is measurable. In such models, such a selector does not exist. Therefore, the strategy (2) is not available. Then the contradiction vanishes.

  To answer the specific questions:

  1. Which step fails? Step (4) fails when it asserts that the probability that the n-th guess is correct is 1/2. This would be true if the event were measurable, but it is not. Therefore, we cannot assign a probability to that event.

  2. Why did it look unexceptionable? Because for any fixed n, the guess depends on the tail beyond n and the n-th hat is independent of that tail. However, without measurability, we cannot form the probability.

  3. What does rejecting it cost? We must accept that the strategy is non-measurable. We do not have to abandon the law of large numbers; we only have to remember that it applies to measurable random variables.

  4. What does the argument establish? It shows that if AC holds, then there are non-measurable sets. In particular, the set of sequences for which the proportion of correct guesses is 1 is not measurable (it has inner measure 0 and outer measure 1). This is a standard example.

  5. How much choice is needed? The strategy requires a selector for the equivalence relation of eventual equality on the space of binary sequences. This requires AC in full generality for a family of sets of size continuum. Without AC, such a selector might not exist. However, weaker principles might suffice. For example, the existence of a well-ordering of the reals (which is equivalent to AC) would give a selector.

  But note: the existence of a selector for this particular relation is equivalent to AC? Not exactly, but it is a strong form. In fact, it is known that the existence of a selector for eventual equality is equivalent to AC. Why? Because the set of equivalence classes has the same cardinality as the reals, and AC for families of sets of size continuum is a consequence of AC.

  Therefore, the refutation of AC in the argument is only apparent. The flaw is in the application of probability to non-measurable sets.

  In summary:

  - The strategy in (2) (if AC holds) is non-measurable.
  - Therefore, the probabilistic reasoning in (4) and (5) does not apply to it.
  - There is no contradiction: the strategy exists (under AC) and works for every sequence, but it is not subject to the probabilistic law because of non-measurability.

  The cheapest place to give is to accept that the strategy is non-measurable and hence cannot be used in the probabilistic context. We do not have to abandon the law of large numbers; we only have to restrict it to measurable strategies.

  This is a classic example of the non-constructive nature of AC and its consequences for measure theory. It does not refute AC; it only shows that AC leads to non-measurable sets.
answer: |-
  The flaw in the argument lies in step (4), specifically in the claim that "the probability that the nth guess is correct is one half" under the fair-coin measure. This step implicitly assumes that the event "prisoner n guesses correctly" is measurable with respect to the product σ-algebra on the space of binary sequences. However, when the strategy is defined using a selector from the axiom of choice (as in step (2)), this event is not measurable. Consequently, the probability cannot be meaningfully assigned, and the probabilistic reasoning in (4) and (5) breaks down for this strategy.

  ### Why Step (4) Fails:
  - **The measurability issue**: The selector \(r\) (fixed via AC in step (1)) assigns representatives to equivalence classes arbitrarily. The strategy for prisoner \(n\) depends on the tail of the sequence (coordinates \(>n\)) to determine the equivalence class, and then outputs the \(n\)th coordinate of \(r(x)\). However, the function \(x \mapsto r(x)\) is not constructible and is highly pathological; it cannot be shown to be Borel measurable or measurable with respect to the product σ-algebra (which is generated by cylinder sets depending on finitely many coordinates).  
  - **Independence does not rescue probability assignments**: While it is true that the \(n\)th hat \(x_n\) is independent of the tail beyond \(n\) (under the fair-coin measure), the guess for prisoner \(n\) is a function of that tail via \(r\). For the probability \(\mathbb{P}(\text{guess}_n = x_n)\) to be \(1/2\), the set \(\{x : \text{guess}_n(x) = x_n\}\) must be measurable. The use of AC makes this set non-measurable, so \(\mathbb{P}\) cannot be evaluated, and claims about this probability are invalid.  
  - **Why it looked unexceptionable**: Step (4) appears plausible because, for any *fixed* prisoner \(n\), the guess depends only on the tail beyond \(n\), and \(x_n\) is independent of that tail. This reasoning holds for measurable strategies (e.g., those definable without AC). The oversight is that AC-based strategies can introduce non-measurable sets, which disrupt standard probability theory. This is a subtle pitfall, as the non-measurability arises globally from \(r\), not locally from the per-prisoner logic.

  ### Cost of Rejecting Step (4):
  Rejecting the applicability of step (4) to the AC-based strategy costs you nothing in terms of standard probability theory or the law of large numbers. You retain:
  - **The fair-coin measure and probabilistic laws**: The law of large numbers (LLN) remains valid for measurable random variables. The argument in (5) holds for any strategy where the guess events are measurable; it is only the pathological AC-based strategy that falls outside this framework.
  - **Core mathematics**: The Hahn–Banach theorem, existence of vector space bases, and other AC-dependent results are unaffected, as this argument does not refute AC. Non-measurable sets are a known consequence of AC, but they do not force us to abandon AC or its mathematical applications; they simply restrict probabilistic reasoning to measurable contexts.
  - **Philosophical comfort**: Probabilistic intuitions about infinite sequences (e.g., the LLN) are preserved for all "tame" (measurable) strategies. The inability to apply them to AC-based strategies is a feature, not a bug, of modern measure theory.

  ### What the Argument Establishes (Once Repaired):
  Once step (4) is corrected by noting the measurability gap, the argument establishes a familiar impossibility result:
  - **Non-measurability phenomenon**: Under AC, the strategy guarantees \(\lim_{N \to \infty} \frac{1}{N} \sum_{n=1}^N \mathbf{1}_{\text{correct}_n}(x) = 1\) for *every* sequence \(x\). However, the set of sequences where this limit equals 1 is not measurable (it has full outer measure but inner measure 0 under fair-coin measure). Similarly, the sets involved in the guesses are non-measurable. This mirrors classical examples like the Vitali set, adapted to a hat-problem context.
  - **Familiarity**: This is not a new result but a reinforcement of the known fact that AC implies the existence of non-measurable sets. The hat problem illustrates this vividly: AC allows "paradoxical" strategies that guarantee success everywhere but cannot be analysed probabilistically due to non-measurability.
  - **Generalisation**: The argument shows that any AC-derived strategy achieving a "tail-beating" property (like guaranteeing only finitely many errors) must be non-measurable, and thus immune to standard probabilistic limits. This is a general feature of infinitary decision problems under AC.

  ### Strength of Choice Required:
  The strategy in (2) requires a strong form of choice:
  - **Selector necessity**: A selector for eventual equality classes is essential. Each class has size \(\aleph_0\) (countable), and there are \(2^{\aleph_0}\) classes (continuum-many). Thus, the strategy needs AC for a family of continuum-many countable sets. This is equivalent to AC itself in standard set theory (e.g., via the well-ordering theorem, as a well-ordering of \(\mathbb{R}\) defines such a selector).
  - **Weaker principles insufficient**: Weaker axioms like dependent choice (DC) or countable choice (CC) do not suffice, as they cannot guarantee selectors for relations with continuum-many classes. Models of ZF + DC (e.g., the Solovay model) make every set measurable, so no such selector exists there. Thus, the refutation of the strategy would refute full AC, but this is not necessary—we simply recognise the strategy is non-measurable under AC.

  ### Conclusion and Recommendations:
  The cheapest resolution is to retain AC and the fair-coin measure but reject the applicability of probability theory to the AC-based strategy in (2) due to non-measurability. This preserves:
  - The law of large numbers and all standard probability for measurable sets.
  - Full AC and its mathematical consequences (e.g., analysis, algebra).
  - Probabilistic intuitions for "reasonable" strategies.

  You pay only the price of acknowledging that AC introduces non-measurable sets, which cannot be handled by classical measure theory. This is a modest cost, as it aligns with mainstream mathematics: measure theory explicitly excludes non-measurable sets from probabilistic statements. The argument does not force you to abandon choice or probability; it highlights the boundary between them. 

  If you wish to avoid non-measurability entirely, you could work in ZF + DC (where such selectors do not exist), but this would sacrifice much of functional analysis and topology. Given your background, embracing measurability restrictions while keeping AC is the most practical path. The "gambling system" in (2) does not truly beat a fair coin; it exploits non-measurability to evade probabilistic laws, reinforcing that no measurable strategy can beat the coin.
