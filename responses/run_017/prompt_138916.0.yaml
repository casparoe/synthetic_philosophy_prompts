answer: |-
  ## The Ninth Sitting

  **(The Grain Court chamber smells of dust and river damp. Ledgers sprawl across the heavy oak table. WARDEN HALIA MERROW, late 40s, precise in geometric-patterned wool, taps a stylus against a wax tablet. KEEPER OSS BARROW, 60s, broad-shouldered, face etched by seasons, stares out the high window at the sluggish brown Sarn. JENTO, 20s, ink-stained and anxious, clutches a crumbling ledger.)**

  **HALIA:** Five seasons in nine, Keeper Barrow. The Gauge Readers’ best tally. Thin, yes, but the doctrine is clear. We maximize the long-run growth rate. For an even-money bet, we stake our *edge*. Here, the edge is five-ninths minus four-ninths – one-ninth. We stake one-ninth of the *bankroll*.

  **OSS:** (Without turning) Bankroll. A tidy word for the breath of a city, Warden. The Floor is twelve barges. Below that, Thalwend is *dust*. Scattered to the winds. Not poor. *Gone*. Your elegant ratios don’t bend at that line. They flow smooth as the Sarn *used* to.

  **HALIA:** The doctrine accounts for the possibility of ruin. It minimizes the *time* to reach ruin if the odds are against us. But the odds *are* with us. Five chances in nine to double our stake on the silt. The optimal fraction: one-ninth of the relevant capital. The discretionary surplus above the Floor is four barges. One-ninth of four is less than half a barge. We work in whole strips; a strip requires one barge. We cannot sow a fraction. Therefore, logic dictates: sow nothing. Conserve the surplus.

  **OSS:** (Turns, eyes sharp) Four barges surplus? Aye. And if we sow nothing, we begin next year with… sixteen barges? The Floor twelve plus surplus four? Unless the rats grow ambitious, or the upland tithes bite deeper. Your ‘surplus’ feeds mouths *now*, Warden. It buys tar for the leaky barges. It pays the Gauge Readers. It *is* the city, above the abyss. Calling it merely ‘discretionary’… that’s a ledger trick. The people don’t eat discretion.

  **HALIA:** The doctrine is sound. Staking less than the optimal fraction costs growth, but not catastrophically. Halving the stake to one-eighteenth? That costs only about a quarter of the potential growth rate. A prudent hedge against… thin records. But staking *more*? Betting past twice the optimal fraction? That cancels the growth rate entirely. *That* invites ruin faster than a dry year. We stick to the capital at hand: the surplus. Sow nothing.

  **OSS:** Capital at hand... (He gestures out the window) Is that field capital? The skill of the silt-tillers? The treaty with Marrowgate? Your arithmetic is clean, Warden, for a gambler with coins in his pocket. A city isn’t coins in a pocket. Its ‘bankroll’ is… fog on the river. You draw the line at the granary floor. I tell you, the line is drawn at the point where hope dies and dispersal begins. Below twelve barges, Thalwend ceases. Not slowly. *Instantly*. Your logarithms don’t have a symbol for that.

  **JENTO:** (Clears throat, voice tight) Sers? The pre-Shift ledgers… Section C, the terrace allocations… I found… it’s odd.

  **HALIA:** (Impatient) Not now, Jento. The doctrine—

  **JENTO:** —It’s *about* the doctrine, Ser. Or… what the store *is*. Please. The near terrace and the far terrace. The old records. Every year. Wet year, near doubles, far halves. Dry year, near halves, far doubles. Always. Like clockwork before the Shift.

  **OSS:** (Eyes narrowing) Aye. Two sides of the same cursed coin. Balanced. What of it, lad? We poured grain in, got the same back over two years. Risk spread thin.

  **JENTO:** But… they *didn’t*. Get the same back. The clerks… every *year*, not every cycle. End of each year, wet or dry, they’d move… half the grain from whichever terrace did well that year… to the one that did poorly. Balance them back to equal. For the next season.

  **HALIA:** (Calculating instantly) Rebalancing. Standard portfolio… Go on.

  **JENTO:** After two years… one wet, one dry… they should have exactly what they started with, right? Each terrace cycle back to its start? But… they didn’t. The consolidated store… the Grand Total… it was always… *more*. About… a quarter more. Every two-year cycle. Like… interest. Without sowing.

  **OSS:** Nonsense. Grain doesn’t breed in the ledger, boy. A counting error. Moisture rot they didn’t write off. Theft.

  **JENTO:** It’s consistent, Ser Barrow. Over decades. Cycle after cycle. Increase recorded. Verified. Quarter more. Exactly. But… only if you count the *whole* consolidated store after the move. If you tracked each terrace alone… they each just cycled back to start. Only when you put them together *after* the yearly shift… the total grew.

  **HALIA:** (Stilled, the stylus frozen) A rebalancing bonus…? In *grain*? That’s… improbable. Unless… (She grabs a scrap of parchment, scribbles furiously) Initial store, say 100 units. Split: 50 Near, 50 Far. Wet Year: Near doubles to 100, Far halves to 25. Total: 125. Move half the *gain*? Half of Near’s 50 gain is 25… move 25 from Near (now 75 Near) to Far (25 + 25 = 50 Far). Now: 75 Near, 50 Far. Total still 125. Dry Year: Near halves to 37.5, Far doubles to 100. Total: 137.5. Move… half the gain? Far gained 50 (from 50 to 100). Half gain is 25. Move 25 from Far (now 75 Far) to Near (37.5 + 25 = 62.5 Near). Final: 62.5 Near, 75 Far. Total… 137.5. (She stares) But… you said they moved half *after each year* to rebalance to *equal*. My calculation assumed moving half the gain. But if they moved to make them *equal* each year…

  **JENTO:** Yes, Ser! After Wet Year: Total 125. To make equal, each terrace should hold 62.5. Near has 100, Far has 25. So they move… 37.5 from Near to Far! Near becomes 62.5, Far becomes 62.5. Total 125. Then Dry Year: Near halves to 31.25, Far doubles to 125. Total 156.25. Now to equalize… each should be 78.125. Far has 125, Near has 31.25. Move 46.875 from Far to Near. Final: Near 78.125, Far 78.125. Total… 156.25. Started with 100. Ended with 156.25. A… a 56.25% gain? Over two years? But… (He looks horrified) That can’t be *real* grain! It’s… arithmetic magic! It only exists because they kept moving it and counting the *whole*!

  **OSS:** (A slow, grim understanding dawning) Real or not… it’s in the ledger. Counted. Spent, maybe. Fed mouths. It existed… *because they drew the boundary around both terraces together and moved the grain between them*. The ‘store’… it wasn’t Near or Far. It was the *movement*. The system.

  **HALIA:** (Voice low, intense) But *only* if you consolidate! Only if you count the whole *before* the move! If Near and Far are separate stores… no growth. Only when you define the capital as the *aggregate* and actively rebalance… the growth emerges from the volatility itself. It’s… it’s the doctrine made manifest! But *where* is the boundary? What constitutes the ‘bankroll’? (She turns fiercely to Oss) Your Floor! Twelve barges! Is that our boundary? Or is Thalwend… more? The people? The treaty? The *future*?

  **OSS:** (Slams a heavy hand on the table, making dust jump) Don’t twist it, Merrow! That ledger trick… it’s phantom grain! It fed no one! It was ink! Our grain is real. Our hunger is real. Our dissolution is real! Your one-ninth… calculated on what? The surplus? Four barges? Sow nothing. The Floor *plus* surplus? Sixteen barges? One-ninth is nearly two barges. Sow two strips. Or… (He glares at the ledger Jento holds) …count Marrowgate’s famine promise? Call it twenty barges of relief? Add that to sixteen? Thirty-six? One-ninth is four barges… our *entire* surplus. Sow everything. One rule, Warden. Three answers. Which boundary saves the city? Which one kills it? The arithmetic is cold. The choice is hot blood and fear. My blood says the Floor is the only boundary that matters. Below that, the city *is* the ledger entry… ‘Dispersed’. The rest… Near Terrace, Far Terrace, phantom gains… it’s noise. Sow *one* strip. Half your ‘optimal’ for the surplus. Hedge against the thin odds. Keep three barges in hand against the winter we don’t see coming.

  **HALIA:** And sacrifice a quarter of the potential growth? When the new channel chokes in a dozen seasons? We need that growth, Oss! The doctrine shows halving the stake costs only a quarter of the *rate*, but the compounding… Sow *two*. Stake the edge against the larger store – the city’s tangible assets. Sixteen barges. One-ninth is nearly two. We accept the volatility within the system. We trust the process.

  **OSS:** Trust? After nine seasons of records? After the river itself turned traitor? You gamble with lives on ink and air, Merrow. I hold the Floor. One strip. Jento! Fetch the Allocation Slate. We mark one.

  **JENTO:** (Staring at the ledger in his hands, then out the window at the distant silt lands, his voice barely a whisper) But… if the boundary *is* the movement… if the system creates the grain just by being defined… which store are we sowing *into*?

  **(Silence hangs thick. Halia looks at her calculations, then at the river. Oss stares at the Floor marker on the granary schematic. Jento clutches the ledger like a talisman. The only sound is the drip of moisture from the cracked ceiling plaster.)**

  ---

  **Author's Note: The Arithmetic & The Argument**

  1.  **Arithmetic vs. Uncertainty:**
      *   **Granted:** The Kelly math itself is correct. The edge (p - q) is 1/9. The optimal fraction is edge/odds = (1/9)/(5/9) = 1/5 for even-money? *(Correction: For even-money bets, Kelly fraction = p - q. Odds are 1:1, so b=1. Fraction = p - q / b = (5/9 - 4/9)/1 = 1/9. The calculations for 1/9th of 4 (0.44 barge), 16 (~1.78 barges), and 36 (4 barges) are simple arithmetic. Halia's points about halving the stake costing ~25% growth rate (since growth ∝ fraction²) and betting beyond twice the optimal (2/9) leading to negative growth are standard Kelly properties. Jento's terrace arithmetic (rebalancing to equal each year yielding a 56.25% gain over two wet/dry cycles) is also mathematically sound.
      *   **Unsettled:** Everything else. Is maximizing long-run growth rate the right goal for a city facing potential extinction in ~12 years and an irreversible dissolution Floor? Kelly assumes infinite plays; Thalwend has few, high-stakes rounds. How should "bankroll" be defined? The granary surplus? Total physical assets? Including contingent assets like the Marrowgate promise? The value and reliability of that promise are highly uncertain. How should "thin" odds (5/9 from 9 seasons) be handled? Shrinking the stake (Halia's hedge) is one approach, but others (e.g., minimax regret, safety-first) exist. Is the terrace gain "real"? It emerges *only* from the accounting convention (consolidation + yearly rebalancing). If the terraces were separate entities, no gain occurs. Its relevance hinges on whether the city's "store" is similarly a consolidated, actively managed entity capable of generating such systemic gains.

  2.  **Who is "Right" and Why:**
      *   **Oss Barrow is most right about this specific sowing decision.** The core sub-question is defining the relevant "bankroll" and acceptable risk.
      *   **Why:** Thalwend faces an existential boundary (the Floor). Crossing it means the city ceases to exist – no future plays, no recovery. Kelly assumes you can recover from losses. Oss correctly identifies the Floor not as low wealth, but as ruin. His definition of bankroll – the critical surplus *above* the Floor needed to ensure survival through the winter and immediate needs (4 barges) – is the most prudent for a system facing potential terminal loss. Betting any significant fraction of this tiny buffer (like Halia's 1.78 barges from the 16) risks hitting the Floor with a single bad year. Halia's growth focus ignores the non-linear catastrophe of dissolution. Jento's discovery, while fascinating, describes an accounting phenomenon tied to volatility within a *consolidated* system; it doesn't change the fundamental risk of betting essential grain on an uncertain silt harvest when extinction looms. Oss's compromise (sow 1 strip, half Halia's optimal for the *surplus*) is a pragmatic safety-first hedge against the thin odds and existential risk.

  3.  **What Would Change My Mind:**
      *   **The Criticality of the Marrowgate Treaty & Time Horizon:** If the Marrowgate treaty was ironclad, immediately actionable, and *reliably* worth significantly more than 20 barges (e.g., enough to rebuild the city *above* the Floor even from near-zero), *and* if the immediate threat of the channel choking meant Thalwend *must* grow explosively within 5-6 seasons to fund mitigation, then Halia's aggressive stance (sow 2 or even 4) becomes defensible. The "bankroll" could justifiably include the treaty value, making the optimal stake larger, and the desperate time horizon might override the usual Kelly caution for finite plays. The potential systemic gain hinted by the ledgers might bolster the argument for seeing the city+treaty as a larger, resilient system capable of weathering volatility for high growth. Without this specific combination (absolute treaty reliability, high value, desperate short-term growth imperative), Oss's survival focus prevails.
