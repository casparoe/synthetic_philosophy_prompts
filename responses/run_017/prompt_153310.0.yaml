  Right, as the Gricean defender, I must uphold reflexive intention while accommodating deniability. The core counter: Margo's complex intention includes Dev recognizing her primary communicative goal (meeting change) AND her meta-intention for deniability. Crucially, her intention isn't invisible to Dev—he grasps both layers. 

  Ah, the distinction from mere showing: Dev isn't just inferring facts (like seeing smoke = fire); he's recognizing Margo's structured intentions. Her volume control and contextual awareness create mutual knowledge between them, satisfying Grice's condition. The "invisible to others" aspect is irrelevant—the theory only requires audience-specific recognition. 

  *checks Gricean orthodoxy* Must emphasize that cancellability/calculability tests still hold here. Margo could've whispered to Priya to exclude Dev, making her intention cancellable. Dev calculates meaning via standard implicature mechanisms: he knows Margo knows he's overhearing, etc. 

  *anticipates pushback* The user might counter that the "intention to deny" corrupts reflexivity. But Grice allows nested intentions—like irony or hints. This is just a higher-order case. Conceding that textbook examples oversimplify cancellability might help build credibility before pivoting to defend the core framework. 

  *strategic angle* Should ask which exact condition they think fails. Forces them to specify whether it's mutual knowledge or intention-transparency that's problematic. Keeps dialogue focused.
answer: |-
  Your case is elegantly constructed, but I maintain Margo *does* non-naturally mean something to Dev. Let's dissect the reflexive intentions. Margo intends:  
  (1) That Dev recognize her primary intention: that he believe the meeting is moved (via recognizing her utterance's directedness at Priya as a vehicle).  
  (2) That Dev recognize her higher-order intention: that he *also* recognize her intention to maintain plausible deniability (hence the specific utterance form and context).  
  (3) That Dev’s recognition of (1) and (2) function as reasons for his belief and subsequent discretion.  

  Crucially, *all* these intentions are indeed recognized by Dev. The fact that Margo *additionally* intends her communicative act to be deniable *to the Head* doesn't negate the reflexive structure *for Dev*. The "invisibility" to the Head is a separate, pragmatic feature of the utterance’s design, not a failure of reflexive intention *within* the intended audience (Dev). The communicative act is successfully addressed *to Dev* precisely *through* its ostensible non-address to him.  

  This *is* calculable: Dev uses mutual knowledge (his presence, Margo’s awareness, departmental norms) to infer her complex intention. It’s cancellable too: had Margo *lowered* her voice conspicuously, Dev would likely infer she *didn’t* want him to hear.  

  Distinguishing from showing: In pure showing (e.g., leaving meeting notes visible), Dev might infer the fact, but he wouldn’t necessarily recognize Margo’s specific intention *that he recognize her intention to inform him*. Here, he does – the vehicle (overhearing) and the deniability layer are *part* of the intended recognition. He knows he was *meant* to get the message *this specific way*.  

  My question: If you grant that Dev correctly identifies Margo’s intricate web of intentions (including the intention that he recognize her informative intention *via* this deniable method), what specific condition of Grice’s analysis of utterer’s meaning remains unsatisfied?
