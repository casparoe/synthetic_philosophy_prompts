  ### Freedom Decision Tree Handout  
  **Instructions:** Answer each binary question based on your intuitive judgment about whether the person is "free" in the scenario. Don't overthink—go with your gut. At the end, your pattern of answers will reveal your core view of freedom.  

  ---

  #### Branch Nodes (Concrete Cases/Claims):  
  1. **Kindly Slaveholder:** A slave’s owner never interferes with their actions. *Is the slave free?*  
     - Yes → Go to 2  
     - No → Go to 3  

  2. **Wheelchair User:** Someone using a wheelchair cannot enter a town hall due to no ramp. *Is this person free to enter?*  
     - Yes → Go to 4  
     - No → Go to 5  

  3. **Worker’s Precarious Job:** A worker’s hours are set by an algorithm that *could* fire/reassign her anytime but never does. *Is she free?*  
     - Yes → Go to 6  
     - No → Go to 7  

  4. **Jammed Gun Threat:** A thief points a (secretly jammed) gun at you, demanding your wallet. You hand it over. *Were you free in that moment?*  
     - Yes → Leaf A  
     - No → Leaf B  

  5. **Poor Bread Buyer:** Someone can’t buy bread because they have no money, but no one stops them. *Are they free to buy bread?*  
     - Yes → Leaf C  
     - No → Leaf D  

  6. **Unlocked Prisoner:** A prisoner doesn’t know their cell door is unlocked. *Are they free to leave?*  
     - Yes → Leaf E  
     - No → Leaf F  

  7. **Addict Who Wants to Quit:** An addict desperately wants to stop using drugs but can’t. *Are they free?*  
     - Yes → Leaf F  
     - No → Leaf G  

  ---

  #### Leaves (Views of Freedom):  
  *Based on your answer path, here’s your view of freedom. Each view’s "awkward commitment" highlights a hard-to-defend implication, and the "least comfortable case" is the scenario it struggles with most from the list.*  

  - **Leaf A: Only Actual Interference**  
    - *View:* Freedom is only reduced when others *actively block* you.  
    - *Awkward commitment:* The kindly slaveholder’s slave is free.  
    - *Least comfortable case:* Worker with precarious job (if answered "no" in Q3).  

  - **Leaf B: Exposure to Arbitrary Power**  
    - *View:* Freedom is reduced whenever you’re subject to someone’s *uncontrolled power*, even if unused.  
    - *Awkward commitment:* The wheelchair user is free (physical barriers ≠ power relations).  
    - *Least comfortable case:* Poor bread buyer (answered "no" in Q5).  

  - **Leaf C: Self-Mastery (Desire-Aligned)**  
    - *View:* Freedom requires *mastering internal obstacles* blocking what you *want* to do.  
    - *Awkward commitment:* The addict who *doesn’t* want to quit (not in tree) is free.  
    - *Least comfortable case:* Cult member (sincerely happy but manipulated).  

  - **Leaf D: Capability to Function**  
    - *View:* Freedom is about *what you can actually do/be*, regardless of blockers.  
    - *Awkward commitment:* The jammed gun victim is unfree (ignorance restricts capability).  
    - *Least comfortable case:* Citizen outvoted (answered "yes" in omitted case).  

  - **Leaf E: Negative + Ignorance Exception**  
    - *View:* Only interference reduces freedom, *unless ignorance traps you*.  
    - *Awkward commitment:* The poor bread buyer is free (poverty ≠ ignorance).  
    - *Least comfortable case:* Worker with precarious job (if answered "yes" in Q3).  

  - **Leaf F: Autonomy/True Desires**  
    - *View:* Freedom requires desires to be *authentic* (not manipulated/compulsive).  
    - *Awkward commitment:* The outvoted citizen (under fair rules) is unfree.  
    - *Least comfortable case:* Kindly slaveholder (slave may have "authentic" compliance).  

  - **Leaf G: Republican-Capability Hybrid**  
    - *View:* Freedom requires *both* non-domination *and* material capability.  
    - *Awkward commitment:* The jammed gun victim is free (no real power/capability loss).  
    - *Least comfortable case:* Addict who doesn’t want to quit (not unfree by domination).  

  ---

  #### Key Notes:  
  - **Unseparated Leaves:** **Leaf B (Arbitrary Power)** and **Leaf G (Hybrid)** *both* answer "no" to the slaveholder (Q1) and worker (Q3). To split them, add:  
    > *"Unlocked Prisoner (Q6) variation: The jailer could lock the door anytime but is on vacation. Is the prisoner free?"*  
