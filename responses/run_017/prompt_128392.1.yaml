    - *Addict who doesn’t want to quit:* Used implicitly to define Leaf C’s awkward commitment.  
    - *Cult member:* Appears in Leaf C/F’s least comfortable cases.  

  - **Tree Logic:** The 7 leaves cover all major views. The "internal obstacles" view splits into **C (desire-aligned)** and **F (authenticity)**. The unnamed **Leaf E** captures a common intuition about ignorance.  

