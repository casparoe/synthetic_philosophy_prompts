prompt: |-
  Me and about a dozen others run a tiny giving circle — we each put in £20 a month, and once a year we argue about where the few thousand pounds goes. I've definately started to think we're not being consistent with ourselves, so I'd like to know what rule we're actually running and what it says about this year's decision.

  What we've decided so far:
  - bednets against malaria, in a country none of us has any connection to — funded
  - a hospice in our own town that two of our members have personal ties to — turned down, because they hit their fundraising target every year and our money wouldn't have added anything
  - a summer holiday version of a reading programme in our own city, in a cause that's already well funded, because nobody else was going to pay for that particular bit — funded
  - research into a rare disease almost nobody funds, tiny number of people affected, no real track record — funded, but only £500 and after a fight about it being a lottery ticket
  - work on making dangerous pathogen labs safer, because it might matter a lot in thirty years — turned down, we couldn't see how to tell if it had done anything
  - a small group whose entire output is research telling other funders where to give — funded, which three of us thought was mad
  - a campaign to get a supermarket chain to stop using one particularly nasty method of killing farmed fish — we couldn't agree, put it off, and it's come back round

  That last one is the decision in front of us now. The numbers of fish involved are enormous, nobody else is funding anything on fish here, and the campaign is cheap. But we're not sure fish feel much of anything, the evidence that campaigns like this actually change practice is thin, and one of us says that if it works the supermarket will just buy from a farm still using the old method, so we'd have bought nothing at all.

  I know the importance / tractability / neglectedness thing, so don't just explain that at me — I want to know which version of it we're running, or whether we're really doing something else, like only caring what our particular money causes. Given our record, what should we decide, which old decision is the closest thing to it, and where our record genuinely doesn't settle it, what would we be signing up to either way? And what's the one application we'd have to see next year to tell the difference?
reasoning: |-
  Hmm, the user is part of a small giving circle that makes collective decisions about where to donate their pooled funds each year. They've listed several past decisions and are currently debating funding a campaign against cruel fish farming methods. They want to understand what implicit rules their group follows based on past choices, and how that should inform the current fish welfare decision.

  Looking at their funding history, there's a clear pattern emerging. They funded malaria bednets (highly effective global health intervention), a reading program expansion (marginal impact in their community), speculative rare disease research (small allocation), and meta-research for funders (systemic leverage). They rejected the hospice (non-marginal impact) and biosecurity work (immeasurable outcomes).

  The key themes appear to be:
  - Strong preference for marginal additionality (only funding where their money makes a specific difference)
  - Willingness to fund speculative but neglected causes with small amounts
  - Rejection of "solved problems" where impact isn't measurable
  - Some tension between local/emotional connections and global/effective priorities

  For the fish welfare campaign, the closest analog is actually the rare disease research - both are highly neglected causes with uncertain but potentially high upside. The objections about fish sentience and campaign effectiveness mirror the "lottery ticket" concerns about the disease research.

  The unresolved tension lies in whether they prioritize concrete, measurable outcomes (which would lean against funding) or neglectedness/potential scale (which would support funding). The fish campaign's cheapness and massive scale potential make it similar to their bednets decision in terms of potential leverage per pound.

  To resolve this, they need to decide: Are they "marginal impact purists" requiring demonstrable causality (reject fish campaign), or "neglectedness optimizers" willing to gamble on asymmetric upside (fund it)? The rare disease funding suggests the latter tendency exists in the group.

  Next year, a test case would be something like: Funding a local homeless shelter that's 95% to its annual target versus a proven deworming program abroad. That would force them to choose between their demonstrated preference for marginal local impact and global cost-effectiveness.
answer: |-
  Based on your giving circle's history, you're running a **"Marginal Impact-Optimized Neglectedness" framework** with a strong emphasis on *your money causing something that wouldn't happen otherwise* ("additionality"). Here's the breakdown, the fish decision analysis, the test case, and what your record shows:

  ### Your Implicit Rule (Decoded from Past Decisions)
  1.  **Neglectedness is Paramount (Non-Negotiable):** You consistently fund causes where other funders *aren't* present (Bednets in a neglected country, unfunded reading program bit, rare disease research, meta-research for funders). You *rejected* the hospice and biosecurity partly because they weren't neglected enough.
  2.  **Marginal Additionality is the Key Filter (Conditional):** You demand *proof* or a strong argument that *your specific money* causes a distinct, measurable change:
      *   *Funded:* Bednets (clear lives saved/unit), Reading program (specific unfunded part), Rare disease (£500 = low-risk lottery ticket), Meta-research (output directly tied to funding).
      *   *Rejected:* Hospice (no marginal need), Biosecurity (no measurable impact/attribution).
  3.  **Tractability & Scale are Secondary (Trade-offs Accepted):** You fund high-tractability/high-scale (Bednets) *and* low-tractability/low-scale (Rare disease) *if* they pass the neglectedness & additionality tests. Scale matters (fish numbers noted) but doesn't override the core filters. Tractability objections (fish campaign evidence, rare disease track record) are raised but overcome by neglect/additionality.
  4.  **Personal Connection is Actively Discounted:** The hospice rejection despite personal ties is a strong signal. Sentiment doesn't override the framework.
  5.  **Cost-Effectiveness is Implicitly Valued, Not Explicitly Calculated:** Cheap campaigns (Fish, Reading program bit) get funded if they pass other tests. The £500 cap on the rare disease shows risk/scale management, not pure cost-effectiveness.

  ### The Fish Campaign Decision: What Your Record Dictates
  *   **Neglectedness (Strong FOR):** "Nobody else is funding anything on fish here." This hits your sweet spot (Rare Disease, Meta-Research, Reading program bit).
  *   **Marginal Additionality (Strong FOR):** "The campaign is cheap." Your funding *specifically enables this campaign* against this method for this supermarket. This is identical to funding the *specific unfunded bit* of the reading program. Even if the supermarket shifts suppliers, *your campaign caused the end of that method at that supermarket* – a measurable outcome.
  *   **Tractability/Evidence (Mixed, but your record suggests OVERRIDE):** Your group raised similar "evidence/thin track record" concerns about the rare disease (£500 funded) and biosecurity (rejected). The *key difference* is **attribution/additionality**. Biosecurity lacked it; the rare disease and fish campaign have it (your money funds *this specific activity*). The "buying from elsewhere" objection is about *impact leakage*, not whether *your action* achieved its *direct goal* (stopping *this* supermarket using *this* method). You funded the meta-researcher whose *output* (reports) was guaranteed, even if *impact* (funding shifts) was uncertain.
  *   **Scale/Potential (Strong FOR):** "Enormous" numbers align with Bednets. Cost is cheap – high leverage.

  **Verdict Based on Your Record: FUND IT.** The closest analog is the **Summer Reading Program Bit**. Both are highly neglected, specific, unfunded activities where your money directly causes the action, even if broader context is imperfect. The £500 Rare Disease Lottery Ticket is also analogous on neglect/additionality, but the scale/cost here is better.

  ### Where Your Record Doesn't Settle It & What You're Signing Up For
  *   **The Unsettled Question:** **How much do you value preventing *possible* suffering vs. causing *measurable, attributable* good?** The fish sentience doubt is unique. Your past decisions involved:
      *   Measurable good (Bednets - lives saved, Reading - kids taught).
      *   Attributable outputs (Meta-research - reports published).
      *   Potential good with clear attribution (Rare Disease - £500 funds *this* lab).
      *   Fish welfare involves *potential* suffering reduction with *attributable action* (campaign run). This is new ground.
  *   **Signing Up To FUND:** You are prioritizing the **Neglectedness + Marginal Additionality + High Leverage** framework above philosophical uncertainty (sentience) and imperfect evidence of long-term systemic change. You accept the campaign itself as the attributable output/outcome. You'd be consistent.
  *   **Signing Up To REJECT:** You are prioritizing **high certainty of measurable, attributable *positive good* (not just harm reduction)** and/or **resolving philosophical doubts before acting**. This would be a *new* standard not applied to the Rare Disease (potential good, no track record) or Meta-Research (uncertain downstream impact). It signals a shift towards requiring higher confidence in the *nature* of the benefit.

  ### The Test Case Application for Next Year
  To distinguish between the "FUND" and "REJECT" paths above, propose this hypothetical application next year:

  *   **"A campaign to pressure Company X to stop sourcing from Supplier Y, who uses brutal practices against undocumented workers in Country Z. The practices are well-documented horrors. No other NGOs are working on Supplier Y/Company X. The campaign is cheap and winnable. However, if Company X drops Supplier Y, Supplier Y will likely just sell to less scrupulous buyers in other regions, potentially worsening worker conditions. Worker testimony on suffering is clear, but measuring *overall* harm reduction is impossible."**

  *   **Why it's the Test:**
      *   **Neglected & Marginal Additionality:** Hits your core (like Fish, Reading bit).
      *   **Scale/Leverage:** High (like Bednets, Fish).
      *   **Attributable Action:** Campaign causes Company X to drop Supplier Y (like stopping the fish method).
      *   **The Crucial Uncertainty:** Philosophical (worker suffering is undeniable, unlike fish sentience) but **Impact Leakage** is the primary concern (like the "buy from elsewhere" fish objection). Is causing the *attributable action* (stopping *this* company using *this* supplier) enough, even if net harm might not decrease?

  *   **What the Decision Reveals:**
      *   **If you FUND:** You are firmly committed to the **Marginal Impact-Optimized Neglectedness** framework. You value causing the attributable change (stopping the specific bad practice in the specific context) as the core good, even with leakage risk. This aligns with funding the Fish campaign.
      *   **If you REJECT:** You are adding a **stronger requirement for demonstrable *net positive impact* or avoidance of harm displacement**, moving beyond just attributable action and neglect. This would signal a departure from the logic used to fund the Fish campaign and Reading program bit, requiring higher confidence in systemic outcomes. It aligns with rejecting the Fish campaign based on leakage concerns.

  **In summary:** Your circle is disciplined about neglect and ensuring your money *does* something specific. The fish campaign fits this pattern tightly (like the Reading program bit). Funding it is consistent. Rejecting it prioritizes new concerns (sentience doubt, leakage) *over* your established framework. The worker campaign test next year will reveal if that rejection was a one-off or a rule change.
