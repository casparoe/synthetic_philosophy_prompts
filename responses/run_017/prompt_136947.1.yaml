prompt: |-
  im on the board of my city's public housing authority and i have to circulate a decision memo before thursday's vote. two years ago we switched from tracking average days a unit sits vacant to "% of units reoccupied within 30 days," because the average was being dragged around by a handful of nightmare units. now that number has gone up and looks great on the dashboard, but tenant satisfaction has gone down, and we've found that managers are reclassifying hard-to-turn units as "offline for modernization" so they never enter the denominator. (the satisfaction survey is handed out at lease signing now, so i dont fully trust it either.) some of the board wants to add a "still housed at 12 months" measure, which seems much harder to game -- but a colleague pointed out that it just moves the gaming to intake: managers quietly prefer the easiest applicants, and our hardest-to-house families sink further down the list, which is worse than what we have now. one member says we should stop publishing any of these numbers to staff and just do unannounced audits instead.

  please write the memo. it should recommend one concrete course of action with a timeline, take the "stop measuring, trust the property managers" position seriously instead of dismissing it, and be straight about where the gaming will move once we patch this one. about half the board arent policy people, so keep it in plain language. start with the bottom line in the first sentence, then the reasoning -- no preamble, no restating my question. under 900 words.
reasoning: |-
  Okay, the user is on the board of a public housing authority and needs to draft a decision memo for an upcoming vote. They've outlined a tricky situation: they switched from tracking average vacancy days to "% of units reoccupied within 30 days" two years ago, which improved the dashboard numbers but led to unintended consequences. Tenant satisfaction has dropped, and managers are gaming the system by reclassifying difficult units as "offline for modernization" to exclude them from the metric. 

  The user mentions several proposed solutions: adding a "still housed at 12 months" measure (which could incentivize cherry-picking easy tenants), or stopping public metrics altogether in favor of unannounced audits. They want the memo to recommend one concrete action, acknowledge the "stop measuring" position seriously, and be transparent about how gaming might shift. It also needs to be in plain language for non-policy board members, under 900 words, with bottom-line-first structure.

  I need to craft a solution that addresses the core problem without creating worse incentives. The key issues are: metric manipulation hurting vulnerable families, distrust in tenant satisfaction data, and potential for new gaming tactics. The user's deeper need seems to be preserving housing access for the hardest-to-house while maintaining accountability - they're clearly frustrated by the trade-offs.

  For the recommendation, I'm leaning toward a hybrid approach: keep the 30-day metric but add safeguards. Specifically: 1) Close the "offline" loophole by tightening definitions and requiring pre-approval for such classifications, 2) Pair it with the "still housed at 12 months" measure to balance quick turnover with stability, and 3) Add random audits for verification. This tackles current gaming while discouraging intake manipulation - since the stability metric would penalize managers for cherry-picking applicants who might later struggle. 

  The "stop measuring" argument deserves real consideration though. I'll acknowledge that excessive metrics can breed distrust, but argue that abandoning transparency would be worse - audits alone couldn't scale to monitor all properties effectively. The compromise keeps accountability while giving managers clearer guardrails.

  For structure: I'll open with the recommendation bluntly, then break down the problem, solutions considered, and implementation timeline. Plain language is crucial - no jargon, with concrete examples of how gaming might shift (e.g., "If we only track speed, managers hide hard units; if we only track stability, they avoid risky tenants"). The tone should be pragmatic, not accusatory - this is about fixing systems, not blaming staff.

  The user's insight about gaming moving to intake is sharp. I'll explicitly say that adding the 12-month metric could initially cause some applicant screening, but the audit threat + public reporting of both metrics should mitigate that. Transparency is our ally here.

  Timeline needs to be tight: definitions revised by next month, audits starting immediately, full rollout by fall. I'll cap it at ~800 words to stay under limit.
answer: |-
  **MEMORANDUM**  
  **TO:** Board of Directors, Public Housing Authority  
  **FROM:** [Your Name], Board Member  
  **DATE:** [Current Date]  
  **SUBJECT:** Recommendation: Revise Vacancy Metric & Add Audits to Improve Accountability and Tenant Outcomes  

  **Recommendation:** Approve a revised performance metric combining "*% of units reoccupied within 30 days (excluding pre-approved capital projects)*" with "*% of new tenants still housed at 12 months*," effective October 1st, alongside unannounced audits starting immediately. This balances speed, stability, and prevents gaming while maintaining transparency.  

  **The Problem We’re Solving:**  
  Our switch to tracking "% reoccupied within 30 days" improved our dashboard by removing nightmare units, but created new problems:  
  1.  **Gaming the Metric:** Some managers reclassify hard-to-rent units as "offline for modernization" to keep them out of the calculation, artificially inflating our success rate.  
  2.  **Tenant Dissatisfaction:** Satisfaction scores (collected at lease signing) have dropped. Faster turnover might mean rushed placements or less support, harming tenant experience.  
  3.  **Ignoring Hard Units:** The hardest-to-house families risk being left behind if units serving them are simply labeled "offline."  

  **Solutions Considered and Their Trade-offs:**  
  1.  **Add "Still Housed at 12 Months":**  
      *   **Pros:** Harder to game. Measures successful placements and tenant stability, which is a core goal. Addresses concerns about rushed moves.  
      *   **Cons & Gaming Shift:** As noted, managers *might* respond by favoring "easier" applicants during intake to guarantee they stay 12 months, making it harder for vulnerable families (e.g., large families, those with past evictions, needing significant support) to get housing. **This is a serious risk we must mitigate.**  

  2.  **Stop Publishing Metrics & Rely Only on Unannounced Audits:**  
      *   **Pros:** Removes incentive for metric-driven gaming immediately. Audits can uncover *actual* problems (like units wrongly classified "offline") and provide ground truth. Builds trust with managers by focusing on real outcomes, not just numbers.  
      *   **Cons & Gaming Shift:** Without clear, transparent targets, accountability weakens. Performance becomes opaque to the Board and public. Audits alone are resource-intensive and can't monitor everything constantly. Gaming might shift towards hiding problems *only* when auditors are expected, rather than solving underlying issues. We lose the ability to track trends across all properties efficiently.  

  3.  **Revise the Current Metric (e.g., tighten "offline" definition):**  
      *   **Pros:** Addresses the immediate gaming tactic. Simpler change.  
      *   **Cons & Gaming Shift:** Managers will find new loopholes (e.g., "awaiting inspection," "pending repairs"). Doesn't address tenant dissatisfaction or the need for stable placements. The core incentive to avoid hard units remains.  

  **Why the Recommended Combination Works Best:**  
  We need a system that values *both* getting units filled *reasonably* quickly *and* ensuring tenants succeed long-term, while minimizing opportunities for gaming. Our recommendation tackles this:  

  1.  **Revised "30-Day Reoccupancy" Metric:**  
      *   Keep it, but **strictly define "Offline for Modernization/Capital Projects."** Units only qualify if pre-approved by Central Office based on a capital plan/budget. Routine repairs or minor updates don't count.  
      *   **This closes the immediate loophole** while still allowing legitimate major upgrades.  

  2.  **Add "Still Housed at 12 Months" Metric:**  
      *   Tracks the percentage of new tenants who successfully maintain their lease for one year.  
      *   **This directly measures tenant stability and successful placements**, counteracting the pressure to rush unsuitable tenants in just to hit the 30-day target.  

  3.  **Combine with Unannounced Audits:**  
      *   **Audits Start Immediately:** Focus on verifying unit classifications ("offline" status) and intake processes. Ensure "offline" units genuinely need major work and that intake practices are fair.  
      *   **Audits Provide Ground Truth:** They verify the data feeding *both* metrics and detect new gaming attempts (e.g., subtle intake screening).  

  **How This Minimizes New Gaming:**  
  *   **Balanced Incentives:** Managers now need to succeed on *two* fronts: speed (30-day metric) *and* stability (12-month metric).  
  *   **Prevents Intake Gaming (Mostly):** Focusing *only* on "easy" applicants might help the 12-month metric, but it would *hurt* the 30-day metric. A property full of "easy" applicants won't exist; managers still need to fill units *quickly* from the general waitlist. Favoring easy applicants too obviously would also be flagged by audits.  
  *   **Targets the Real Problem:** The *combination* pushes managers towards better upfront assessments and support services to ensure tenants *can* stay 12 months, rather than just avoiding them or rushing them in. Audits ensure fairness.  
  *   **Transparency Remains:** We keep clear, public goals while adding verification.  

  **Timeline & Implementation:**  
  1.  **Immediately (Upon Approval):**  
      *   Halt public reporting of the *current* "% reoccupied within 30 days" metric.  
      *   Launch unannounced audits focused on unit vacancy status classification and intake file review.  
      *   Draft strict, clear definitions for "Offline for Modernization/Capital Project" requiring Central Office pre-approval.  
  2.  **By September 15th:**  
      *   Finalize definitions and approval process for "offline" status.  
      *   Develop reporting procedures for the *revised* 30-day metric and the new 12-month stability metric.  
      *   Train property managers on the new metrics, definitions, and audit focus.  
  3.  **October 1st:**  
      *   **Full Implementation:** Begin official tracking and reporting to the Board of:  
          *   *Revised Metric:* "% of Units Reoccupied within 30 Days (Excluding Pre-Approved Capital Projects)"  
          *   *New Metric:* "% of New Tenants Still Housed at 12 Months" (starting with placements from Oct 1st onward).  
      *   Continue monthly unannounced audits.  
  4.  **January 2025:**  
      *   Report first trends on the new 30-day metric.  
      *   Present audit findings and any necessary adjustments.  
      *   Review tenant satisfaction survey methodology (separate action needed).  

  **Bottom Line:** Combining a loophole-closed speed metric with a stability metric, backed by audits, offers the best path to faster *and* more successful tenant placements while minimizing harmful gaming. It keeps us accountable and transparent, addresses the weaknesses of the current system, and proactively counters the risks of the alternatives. I recommend approval.
