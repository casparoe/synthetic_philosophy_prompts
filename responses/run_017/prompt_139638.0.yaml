      *   **Stanza 2 (Design):** Focuses on programming, algorithms (minimax), search trees, evaluation functions, optimization, obeying creator's intent. Failure hinted: "To choose beyond its code".
      *   **Stanza 3 (Intentional):** Uses mentalistic terms: *sees*, *knows*, *wills*, *purpose*. Treats the computer as having desires and awareness. Failure hinted: "To feel the checkmate thrill".
  3.  **Compression:** The stanzas visibly shrink in line count (9 -> 6 -> 3) and line length becomes shorter and simpler, enacting the compression Dennett describes. The intentional stance is the shortest/cheapest description.
  4.  **Refrain:** "**Ng5+**" is the identical ending line for each stanza and the couplet, representing the predicted move reached via different descriptive paths.
  5.  **Couplet:** Questions the objectivity of compressibility ("found or made?"). It highlights the dependency on description language and baseline ("a lens we overlay"), leaving the question open ("was it found or made?").
  6.  **Accessibility:** Functions as a poem about a chess computer making a specific, powerful move (knight fork) without requiring knowledge of Dennett. The philosophical depth adds layers for the seminar context.
  7.  **Accuracy:** Faithfully represents Dennett's three stances, the concept of predictive patterns based on descriptive compression, and the key philosophical question raised in the couplet. "Ng5+" is a plausible knight fork move.
