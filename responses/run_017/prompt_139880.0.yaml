prompt: |-
  I'm putting together a one-page handout for first-year graduate students on what the free energy principle does and does not say, and a colleague and I have fallen out over how much to concede to a rough gloss. Below are six one-sentence versions of the claim that a system minimises free energy, all of which I have in fact heard at conferences.

  (a) The brain is a guessing machine: it continually predicts what its senses will report, and revises those predictions in the light of prediction error.

  (b) A living thing stays alive by acting so as to keep the sensory states it encounters as unsurprising as possible.

  (c) Perception is approximate Bayesian inference: the brain minimises the divergence between its beliefs and the true posterior over the causes of its sensations.

  (d) Any system that confines its own states to a narrow range must, on average and over the long run, behave as if it were inferring the hidden causes of the sensory states that impinge on it.

  (e) Perception and action are two ways of minimising the same quantity — perception fits the model to the world, action fits the world to the model — and neither has priority over the other.

  (f) Free energy is a thermodynamic quantity, and the brain's job is to represent the world using as little of it as possible.

  Assume the students have already read a standard predictive-processing introduction, so the ordering should turn on what the principle itself asserts rather than on which sentence is easiest. Rank them from the one you would least mind a student reading first to the one you would most want struck from the handout, and for each give a single sentence on what it quietly smuggles in or leaves out — what, specifically, would that student have to unlearn later? My colleague thinks (b) is harmless as a first pass; I think it is the one that does the most downstream damage. Say where you come down, and don't let them all come out roughly equal.
reasoning: |-
  Okay, the user is creating a one-page handout for first-year grad students about the Free Energy Principle (FEP). They're debating with a colleague about how to present simplified versions of FEP claims. They've listed six one-sentence glosses they've heard at conferences and want them ranked from least to most problematic, with explanations of what each omits or distorts. The students have already read a predictive processing intro, so this is about FEP's core claims.

  I need to understand each statement in the context of FEP. The Free Energy Principle, developed by Karl Friston, posits that self-organizing systems minimize variational free energy to maintain their states within expected bounds. This involves perception (updating beliefs) and action (changing sensory inputs). 

  Looking at the statements:

  (a) Focuses on prediction and error correction. While aligned with predictive processing, it frames the brain as a "guessing machine," which anthropomorphizes and might imply cognition where FEP applies more broadly to biological systems. It misses the imperative for survival and action.

  (b) Talks about living things acting to keep sensory states unsurprising. This is central to FEP as minimizing surprise. But it simplifies "unsurprising" to avoiding surprise entirely, ignoring that organisms deal with expected surprises and trade-offs. Also, conflates minimizing surprise with direct action, whereas FEP uses free energy as a bound.

  (c) Describes perception as approximate Bayesian inference. This is accurate for the perceptual aspect but ignores action. FEP is broader, encompassing both perception and action under free energy minimization. Students might later struggle to integrate action into this framework.

  (d) States that systems confining their states must behave as if inferring hidden causes. This captures the "as if" nature of FEP, showing it's about dynamics rather than literal inference. However, it might be too abstract for first-years and omits the role of action and Markov blankets.

  (e) Links perception and action as equal minimizers. This correctly presents their symmetry in FEP, a key point often missed. But it might oversimplify their interdependence without mentioning model-world alignment nuances.

  (f) Calls free energy a thermodynamic quantity. This is misleading; FEP's free energy is variational, not thermodynamic. It confuses two different concepts, which could lead to significant misunderstandings.

  Ranking them: I think (d) is the best starting point as it captures the "as if" nature without overcommitting. Then (e) for symmetry, (a) for predictive processing, (c) for Bayesian inference, (b) for its misleading take on surprise, and (f) as the worst due to factual error.

  The user and their colleague disagree on (b). The user thinks it's harmful, and I agree because it implies organisms avoid all surprise, which isn't true—they manage expected surprises. This could lead to misconceptions about adaptive behavior.

  For the handout, clarity on FEP's scope is crucial. Grad students need to grasp that it's a formal principle about system dynamics, not just cognition. The ranking should prioritize accurate foundations to prevent unlearning errors later, especially confusing variational with thermodynamic free energy or missing action's role.
answer: |-
  Based on the core tenets of the Free Energy Principle (FEP) as a formal, mathematical claim about the necessary behaviour of bounded, self-organizing systems (not just brains), and prioritizing what the principle *itself* asserts for students who already grasp predictive processing, here's the ranking from least to most problematic, with the critical omission/distortion for each:

  1.  **(d) Any system that confines its own states to a narrow range must, on average and over the long run, behave as if it were inferring the hidden causes of the sensory states that impinge on it.**
      *   **Smuggles in/Leaves out:** While accurately capturing the core formal claim of the FEP – that *apparent* inference is a *consequence* of boundedness, not a *mechanism* – it leaves out the crucial role of *action* as an equally primary means of minimizing free energy alongside perception/inference.

  2.  **(e) Perception and action are two ways of minimising the same quantity — perception fits the model to the world, action fits the world to the model — and neither has priority over the other.**
      *   **Smuggles in/Leaves out:** This correctly emphasizes the symmetry and equal status of perception and action under FEP minimization, a vital point, but it risks implying a clean separation ("fits model to world" vs "fits world to model") that oversimplifies the deep entanglement and circular causality inherent in the FEP framework.

  3.  **(a) The brain is a guessing machine: it continually predicts what its senses will report, and revises those predictions in the light of prediction error.**
      *   **Smuggles in/Leaves out:** While describing predictive processing effectively, it smuggles in an anthropomorphic "guessing machine" metaphor and focuses solely on the *brain* and *perception*, completely obscuring the FEP's broader scope (applies to any bounded system, including non-neural life) and the fundamental, co-equal role of *action* in minimizing free energy.

  4.  **(c) Perception is approximate Bayesian inference: the brain minimises the divergence between its beliefs and the true posterior over the causes of its sensations.**
      *   **Smuggles in/Leaves out:** This accurately describes the *perceptual aspect* under the FEP but crucially leaves out *action* entirely and frames minimization as targeting the "true posterior," which smuggles in an implicit realism/veridicality assumption that the FEP itself does *not* make – minimization is about *model* evidence (surprise bound), not necessarily achieving "true" beliefs about an external world.

  5.  **(b) A living thing stays alive by acting so as to keep the sensory states it encounters as unsurprising as possible.**
      *   **Smuggles in/Leaves out:** **This is where I side strongly with you over your colleague.** While capturing the link to survival and action, it fatally distorts the FEP by framing minimization as *directly* targeting "unsurprising sensory states" through *action alone*. This leaves out the core role of *perception/modeling* and the *variational free energy* quantity itself (a bound on surprise), misleadingly implying organisms simply avoid surprising inputs rather than actively maintaining a *generative model* that *predicts* and *prefers* specific, expected (even complex) sensory states. It reduces FEP to simple homeostatic reflex, ignoring the inferential machinery.

  6.  **(f) Free energy is a thermodynamic quantity, and the brain's job is to represent the world using as little of it as possible.**
      *   **Smuggles in/Leaves out:** **This is the most damaging and must be struck.** It fundamentally conflates variational free energy (an information-theoretic measure related to Bayesian model evidence/surprise) with thermodynamic free energy (governing physical work and entropy), smuggling in a completely false equivalence that would require significant unlearning; it also incorrectly frames the brain's "job" as minimizing thermodynamic energy for representation, which bears no relation to the actual FEP claim.

  **The Verdict on (b):** You are correct that **(b) is highly problematic and potentially the most damaging "first pass" besides (f)**. While your colleague might see it as a harmless intuitive hook linking action and survival, it actively misrepresents the core mechanism of the FEP. It:
  1.  **Obliterates Perception/Inference:** It presents action as the *sole* mechanism for minimizing surprise, completely erasing the critical role of updating beliefs/generative models (perception/inference).
  2.  **Misrepresents the Target:** It frames the goal as *directly* minimizing sensory surprise itself through action. The FEP asserts systems minimize *variational free energy*, which is a tractable *upper bound* on *surprise* (self-information). Minimizing this bound *allows* the system to avoid *surprising states on average*, but the mechanism involves managing a *model*, not just reflexively avoiding sensory inputs. An organism *expects* and *prefers* complex, structured sensory states predicted by its model; it doesn't just seek sensory silence.
  3.  **Reduces FEP to Simple Homeostasis:** It suggests a passive avoidance of disruption, ignoring the active, model-driven generation of *expected* sensory streams and the sophisticated interplay between perception and action required to maintain the model's predictions.

  **(b) teaches students that FEP is fundamentally about action minimizing sensory surprise, which is precisely what they *would* have to unlearn to understand that FEP is about minimizing a variational bound (free energy) that involves *both* perception (changing the model) *and* action (changing sensory samples) to maintain a bounded, self-organizing state defined by its *generative model*.** It sets a foundation antithetical to the principle's actual claims. **(d)**, while abstract, provides the most accurate foundational statement of the *necessity* implied by the FEP's core mathematics.
