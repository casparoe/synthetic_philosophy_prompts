prompt: |-
  I work on the foundations of statistical mechanics, and I have been asked to co-referee a submission that is a new variant on the demonic theme. My supervisor has refereed a long run of these over the years and has an unusually consistent nose for them; I would like my report to cohere with the verdicts she has already given rather than merely be defensible in isolation. I have reconstructed her track record from her reports, with the one-line reason she attached to each:

  1. The one-molecule engine: partition inserted at the midpoint of a box at temperature T, demon records which half the molecule is in, the molecule expands isothermally against a load, partition withdrawn, one-bit record reset each cycle; kT ln 2 of work per cycle from the single bath. Verdict: no violation — the bit is paid for.
  2. A ratchet and pawl in a single bath, with no recording device anywhere in the setup. Verdict: violation — nothing is consumed and there is no gradient.
  3. As in (1), except that the demon must scatter a photon off the molecule to find out which side it is on. Verdict: no violation — the measurement is not free, and the record has to be cleared in any case.
  4. As in (1), except that the demon clears its record by dumping it into a second reservoir at T_c < T rather than into the working bath. Verdict: no violation, but reclassify: it is a heat engine between two reservoirs, capped by 1 − T_c/T, not a demon.
  5. As in (1), except that the demon never resets: it is supplied with fresh blank bits and simply archives the used ones. Verdict: no violation — the blank bits are the fuel; this is a battery with a sorting mechanism bolted on.
  6. A stream of molecules each released at the left wall and allowed to relax, with work drawn from the relaxation. Verdict: no violation, and trivially so — a stream of prepared non-equilibrium states is fuel.
  7. A proposal that drew net work from a single bath and whose author argued that the books balance because the apparatus had been assembled by a builder who thereby incurred an entropy debt on its behalf. Verdict: reject — that story can be told about any device whatsoever, so it does no work in the argument.

  The new submission runs as follows. Take the one-molecule box of (1) at temperature T, single bath. Each cycle a register bit is delivered to the demon, perfectly correlated with which half of the box the molecule occupies. Marginally, on its own, that register is maximally mixed: a lab assaying the registers in isolation would find unbiased noise, indistinguishable from thermal garbage. In fact they are a waste product of the group next door — they cost nothing, they look like noise, and they would otherwise be binned. The demon performs no measurement and no erasure. It consults the register, lets the molecule expand against a load, and returns it to the full box, extracting kT ln 2 from the one bath. At the end of the cycle the molecule is back at equilibrium in the full box, the register is still maximally mixed and is now independent of the molecule, and the register goes back next door (or into the bin). Net result: kT ln 2 per cycle from a single bath, with no erasure, no blank memory consumed, and no change in the marginal state of anything inside the apparatus. The only thing that has changed is that register and molecule have stopped being correlated. One observation, which you should correct if it is wrong: on the joint state, molecule-plus-register gains k ln 2 of entropy, which is exactly what the bath loses — so the books balance if and only if one is willing to keep the ledger on joint states rather than on the separate ones.

  So: what rule, or what set of rules, is she running given (1) through (7)? Which of the rules jointly consistent with those verdicts diverge on this case, and how — I care about the classification as much as the bare verdict, i.e. whether this comes out as an outright violation, as no-violation-but-an-engine-consuming-correlation, as no-violation-only-because-the-preparation-must-be-counted, or as no violation with nothing consumed at all. Which verdict do you expect her to give, and why that one over its rivals? Which of (1) through (7) is the closest analog, and does that set genuinely underdetermine the case? If it does, say what principle I would be committing myself to with each of the options, since my name goes on the report. Finally, name the single further case that would best separate the surviving rules and say what it would show either way. Lead with your bottom line in the first sentence and then give the reasoning, with no preamble and no restatement of what I have asked.
reasoning: |-
  Alright, let me tackle this user's query step by step. The user works on statistical mechanics foundations and needs to co-referee a new Maxwell's demon variant. They want their report to align with their supervisor's past rulings, which they've listed in cases (1) to (7). The new submission involves a one-molecule engine where a pre-correlated register bit (a waste product) is used by the demon without measurement or erasure, extracting work from a single bath.

  First, I need to infer the supervisor's consistent principles from the prior cases. Looking at (1), she accepted it because the bit reset ("paid for"). In (2), she rejected due to no consumption or gradient. (3) emphasized measurement cost. (4) was reclassified as a heat engine. (5) accepted because blank bits are fuel. (6) was trivial non-equilibrium fuel. (7) rejected the entropy debt argument as invalid.

  The key principles emerging are:  
  - **Consumption Requirement**: Any resource used (like bits or gradients) must be consumed or degraded.  
  - **No Free Measurement/Erasure**: These actions incur costs.  
  - **Explicit Accounting**: Only tangible resources count; speculative debts (like in (7)) don't.  

  Now, the new case: The register is pre-correlated "waste," no measurement/erasure occurs, work is extracted, and the register remains maximally mixed but uncorrelated. The joint entropy increases by k ln 2, balancing the bath's entropy decrease.  

  Comparing to past cases:  
  - (1) and (3) involved active erasure/reset, which isn't happening here.  
  - (5) used fresh blank bits as fuel; here, the register is pre-existing "garbage."  
  - (6) involved prepared non-equilibrium states as fuel, but here the register is thermal noise—though correlated.  

  The supervisor would likely see the *correlation itself* as the consumable resource. Even if the register is "free," its correlation with the system is used up (dissipated), making it thermal garbage. Thus, the work comes from consuming this correlation, akin to (5) and (6).  

  The closest analog is (5) (blank bits as fuel) but reinterpreted: here, the "fuel" is the initial correlation. (6) is also similar but involves explicit non-equilibrium states.  

  Verdict: **No violation**—it's an engine consuming correlation. The work is extracted by expending the correlation, not from the bath alone. The joint entropy increase confirms this.  

  To resolve ambiguities, a test case could be: What if the registers are *perfectly pure* (not mixed) but correlated? If the supervisor still allows work extraction, it confirms that correlation (even without mixedness) is the key resource.
answer: |-
  **Expected verdict: No violation — this is an engine consuming the correlation as fuel, analogous to (5) and (6).**

  ### Reasoning:
  1.  **Supervisor's Consistent Rules (from 1-7):**
      *   **Resource Consumption is Mandatory:** Work extraction from a single bath requires the irreversible consumption of a physical resource (e.g., blank bits in (5), prepared non-equilibrium states in (6), a thermal gradient in (4)). Passive correlations or information alone are insufficient without consumption (implied by (2), (7)).
      *   **Measurement and Erasure Have Costs:** Measurement isn't free (3), and erasure/reset always incurs a cost paid to *some* bath (1, 3, 4). Avoiding erasure requires consuming the memory medium itself (5).
      *   **Marginal States vs. Correlations:** The Second Law applies to the *global* system. Entropy reduction in a subsystem (the bath) must be compensated by entropy increase elsewhere, but this "elsewhere" must involve the irreversible degradation of a *physical resource* (consumption), not just a change in correlations without marginal state change (contrast (1), (5), (6) with (2)). Speculative debts (like the builder's entropy in (7)) or correlations without degraded resources are invalid.
      *   **Accounting is Explicit:** Resources (bits, gradients, non-equilibrium states) must be tangibly supplied and degraded. Engines are classified based on the *actual* consumed resource (e.g., (4) becomes a heat engine).

  2.  **Analysis of the New Proposal:**
      *   **No Measurement/Erasure:** Avoids those costs (consistent with (3), (5)).
      *   **No Blank Bits Consumed:** Differs from (5). The register isn't *blank* fuel; it's *correlated* fuel.
      *   **Resource Degradation:** The crucial resource is the *initial correlation* between the molecule and the register. This correlation is *consumed* during the cycle: it is converted into work (and dissipated into the bath) and is gone by cycle end, leaving the molecule and register uncorrelated. Although the register's *marginal* state (maximally mixed) is unchanged, the *joint* state changes significantly: the mutual information is destroyed. The entropy increase of the joint system (k ln 2) matches the bath's entropy decrease, balancing the global ledger *only because the correlation was consumed*.
      *   **Fuel Analogy:** The pre-correlated registers are fuel, analogous to:
          *   The blank bits in (5) (fuel supplied and used).
          *   The stream of non-equilibrium molecules in (6) (fuel supplied and relaxed).
      *   **Not Trivial Noise:** While the registers look like noise *marginally*, they are not *just* noise; they are specifically *correlated* with the system, making them a usable non-equilibrium resource *relative to the system*. Their pre-existing correlation is the fuel.

  3.  **Classification and Why Not Other Verdicts:**
      *   **Not an Outright Violation (like (2)):** A consumable physical resource (the correlation) *is* degraded.
      *   **Not "No Violation with Nothing Consumed"**: The correlation *is* consumed. The marginal state stability is misleading; the resource is relational.
      *   **Not "No Violation Only Because Preparation Counted" (like (6)):** This *is* the case. The preparation (supplying the correlated registers) *must* be counted as supplying fuel. The verdict is directly analogous to (6).
      *   **Classification:** **Engine consuming correlation as fuel.** Similar to (5) (consuming blank bits) and (6) (consuming prepared states). The "fuel" is the pre-existing mutual information embodied in the physical register.

  4.  **Closest Analog: (5) and (6)**.
      *   (5): Consumes blank bits (low entropy state) as fuel.
      * (6): Consumes prepared non-equilibrium states as fuel.
      *   **New Case:** Consumes pre-existing correlation (a form of non-equilibrium resource) as fuel.
      *   The set (1-7) **does not underdetermine** this case. The core principle of *required resource consumption* evident in (5) and (6), contrasted with the rejection of uncosted correlation/action in (2) and (7), determines the verdict.

  5.  **Principle Commitment:** By endorsing this verdict, you commit to the principle that **pre-existing, consumable correlations embodied in a physical system constitute a valid fuel (a non-equilibrium resource) for work extraction from a single bath, even if the marginal state of the correlating system appears thermal.** This treats mutual information as a physically degrable resource, not merely abstract information.

  6.  **Critical Test Case:**  
      **"Pure-Correlation Fuel":** Identical setup to the new proposal, *except* the supplied registers are in a *pure* state (|0> or |1>), not maximally mixed, but still perfectly correlated with the molecule. The demon uses them identically (no measurement/erasure, work extracted, register archived uncorrelated but still pure).  
      *   **What it Shows:**  
          *   If **accepted** (no violation, correlation consumed), it confirms that the *correlation itself* is the fuel, regardless of the register's marginal entropy. This aligns with the verdict above.  
          *   If **rejected** (violation), it reveals the supervisor likely requires the consumed resource to have *marginal* non-equilibrium (like the blank bits in (5) or molecules in (6)), not just correlation. This would diverge from the new proposal's verdict and suggest a stricter "marginal state degradation" rule.  
      This test separates whether "correlation consumption" alone suffices (accept both) or if "marginal non-equilibrium consumption" is required (accept only the mixed/new-proposal case? Reject the pure case? - though rejecting the pure case might be inconsistent with (5)).
