prompt: |-
  I co-edit a small end-of-term zine for the social choice reading group I help run — half of us are from economics, half from political theory — and a friend who works in DAO governance tooling keeps sending me her industry's marketing copy, which has become a running joke: every platform on earth advertises itself, in one phrasing or another, as immune to strategic voting. For the last issue I want a piece of satire built out of that joke, and I want the joke to come from getting the result right rather than from name-dropping it.

  The piece: a leaked internal compliance memo — 700 to 900 words, deadpan corporate register, memo header (To / From / Date / Re) and numbered sections — written by the compliance team of a fictional governance platform called Sincere ("Vote your true preferences. We handle the rest," as the letterhead has it), in response to a marketing landing page that already shipped the claim that the platform is provably strategy-proof. Assume the audience: the theorem in question is the one Allan Gibbard proved in 1973 and Mark Satterthwaite independently in 1975 — any deterministic rule that takes voters' ordinal rankings, returns a single winner, and can produce three or more different outcomes is manipulable unless it is dictatorial — together with the later extension to rules that may randomise, and the known fact that on single-peaked domains there is a well-behaved non-dictatorial option (the median rule). Also assume what the definition does not cover: only one voter at a time is imagined to misreport, only ordinal rankings are transmitted, and nothing in the guarantee speaks to coalitions, to intensity, or to how the alternatives got onto the ballot. Section 1 should explain, in compliance-speak, why marketing's sentence cannot ship as written; Section 2 should set out the three "Compliance Modes" the team has available — I'll leave the codenames to you, but I have in mind something like a delegated-outcome mode where one ballot is drawn and recorded as the result, an agenda-pairing mode where every proposal is resolved between two pre-selected options, and a domain-restriction mode where members must attest that their preferences are single-peaked along an official Axis the company publishes — each with proposed customer-facing language; Section 3 should recommend one of them and say why the others test badly in focus groups; Section 4 should be residual risks, filed as reputational rather than mathematical. Two constraints. First: nobody in the memo may use the word "dictator" in any text a customer could see — the comedy is in the euphemisms they invent instead ("founder's resolution authority," "single-wallet determination," and so on). Second: the memo's last sentence should be flat, procedural, and genuinely chilly — the moment the reader notices that a platform that can honestly call itself strategy-proof has quietly stopped selling voting. No real companies, no real named people, no footnotes, no winking at the reader.

  After the memo, add a structured summary as a single JSON object with this schema: {"modes": [{"mode_name": the internal codename, "condition_relaxed": which premise of the result the mode gives up — a range of at least three possible outcomes, non-dictatorship, or deterministic single-winner resolution, "theorem_licensing_it": which result makes the mode genuinely strategy-proof — the 1973/1975 theorem, its extension to randomised rules, or the single-peaked median-voter results, "marketing_euphemism": the exact phrase the memo proposes, "what_a_customer_hears": one sentence, "what_it_actually_means": one sentence, blunt}], "silences_exploited": up to five short strings naming features of a real election that strategy-proofness as defined does not regulate — agenda control, coalitional misreports, cardinal intensity, where the preferences came from, whether the winner is any good, "recommended_mode": the codename of the mode Section 3 recommends, "bottom_line": one sentence on why an honestly strategy-proof system with three or more options is not obviously something anyone should want to buy}.
reasoning: |-
  We are creating a fictional internal compliance memo for a company called Sincere, which markets a voting platform. The memo is in response to a marketing claim that the platform is "provably strategy-proof". The memo must be in a deadpan corporate style, with numbered sections and a header.

  Constraints:
  - The audience knows about the Gibbard-Satterthwaite theorem (1973/1975) and its extensions.
  - Section 1: Explain why the marketing claim cannot be used as written (because the theorem says that any deterministic voting system that can output at least 3 different outcomes and is non-dictatorial is manipulable).
  - Section 2: Propose three "Compliance Modes" (with internal codenames) that each relax one of the conditions to achieve strategy-proofness. Each mode should have a customer-facing euphemism.
    - Mode 1: Delegated-outcome (randomised) - relaxes determinism (uses the extension to randomised rules).
    - Mode 2: Agenda-pairing (only two options at a time) - relaxes the condition of having at least three possible outcomes (by making every vote between two options).
    - Mode 3: Domain-restriction (single-peaked) - relaxes the unrestricted domain (uses the single-peaked median-voter result).
  - Section 3: Recommend one of the modes and explain why the others test badly in focus groups.
  - Section 4: Residual risks (reputational, not mathematical).
  - Avoid the word "dictator" in customer-facing text; use euphemisms.
  - Last sentence: Flat, procedural, and chilly.

  After the memo, we need a JSON summary with the specified schema.

  Let's outline the memo:

  Header:
  To: Marketing Team, Sincere
  From: Compliance Team, Sincere
  Date: [Current Date in a standard format, e.g., 2025-05-15]
  Re: Compliance Review of "Provably Strategy-Proof" Claim for Landing Page (v3.2)

  Section 1: The Problem
  Explain that the claim "provably strategy-proof" cannot be made without qualification because of the Gibbard-Satterthwaite theorem: any deterministic voting system that can produce at least three distinct outcomes and is non-dictatorial is subject to strategic voting. Since our platform is non-dictatorial (as per our values) and supports multiple outcomes, we must either qualify the claim or adjust the system.

  Section 2: Compliance Modes
  Propose three modes:

  1. Mode: RANDOM_SELECT (randomised system) 
     - Condition relaxed: Deterministic single-winner resolution (we allow randomness).
     - Theorem: Extension to randomised rules (Gibbard 1977).
     - Marketing euphemism: "Our system leverages quantum-inspired unpredictability to ensure truth-telling is always the best policy."
     - What it actually means: We randomly pick one voter and use their top choice as the winner.

  2. Mode: BINARY_CHOICE (agenda-pairing)
     - Condition relaxed: Range of at least three possible outcomes (we only ever vote between two options).
     - Theorem: The 1973/1975 theorem doesn't apply because we only have two options (and for two options, majority rule is strategy-proof).
     - Marketing euphemism: "Sincere's streamlined binary resolution process guarantees that every vote is a simple, honest expression of preference."
     - What it actually means: We force every vote to be between two pre-selected alternatives, so there are never more than two options on the ballot.

  3. Mode: SPECTRUM_ALIGN (domain-restriction to single-peaked preferences)
     - Condition relaxed: Unrestricted domain (we require preferences to be single-peaked on an axis).
     - Theorem: The median voter theorem for single-peaked domains.
     - Marketing euphemism: "By aligning choices along a clear governance axis, Sincere ensures that every vote reflects a member's genuine position without gaming."
     - What it actually means: We require voters to attest that their preferences are single-peaked along a company-defined axis, and then we use the median rule.

  Section 3: Recommendation
  - Recommend SPECTRUM_ALIGN (domain-restriction) because:
     - RANDOM_SELECT: Focus groups found it "chaotic" and "unserious" when they learned one person's vote could decide everything.
     - BINARY_CHOICE: Focus groups felt it was "too restrictive" and "didn't capture the full range of opinions".
     - SPECTRUM_ALIGN: Tested well as it still allows multiple options and the axis can be framed as a helpful guide.

  Section 4: Residual Risks
  - Reputational risks: 
     - If voters don't actually have single-peaked preferences, they might feel forced to lie or the result might not reflect their true preferences, leading to distrust.
     - The axis is set by the company (or the organization using the platform) which might be seen as manipulative.
     - The system only prevents strategic voting by a single voter; coalitions might still form and misreport in a coordinated way (which the theorem doesn't cover).

  Last sentence: "This memo constitutes the final compliance determination for the claim in question; any further use of unqualified 'strategy-proof' language must be cleared through this office at least fourteen days prior to deployment."

  Now, the JSON summary:

  {
    "modes": [
      {
        "mode_name": "RANDOM_SELECT",
        "condition_relaxed": "deterministic single-winner resolution",
        "theorem_licensing_it": "the extension to randomised rules (Gibbard 1977)",
        "marketing_euphemism": "Our system leverages quantum-inspired unpredictability to ensure truth-telling is always the best policy.",
        "what_a_customer_hears": "The system uses randomness to make strategic voting ineffective.",
        "what_it_actually_means": "One voter is randomly selected and their top choice wins."
      },
      {
        "mode_name": "BINARY_CHOICE",
        "condition_relaxed": "a range of at least three possible outcomes",
        "theorem_licensing_it": "the 1973/1975 theorem (which does not apply to two-option votes)",
        "marketing_euphemism": "Sincere's streamlined binary resolution process guarantees that every vote is a simple, honest expression of preference.",
        "what_a_customer_hears": "Every vote is between exactly two options, making strategy unnecessary.",
        "what_it_actually_means": "Votes are only allowed between two pre-selected alternatives, eliminating multi-option ballots."
      },
      {
        "mode_name": "SPECTRUM_ALIGN",
        "condition_relaxed": "non-dictatorship", // Actually, we are relaxing the unrestricted domain condition. But note: the theorem requires unrestricted domain. Alternatively, we can say "unrestricted domain of preferences".
        "theorem_licensing_it": "the single-peaked median-voter results",
        "marketing_euphemism": "By aligning choices along a clear governance axis, Sincere ensures that every vote reflects a member's genuine position without gaming.",
        "what_a_customer_hears": "The system structures choices to prevent strategic voting by requiring preferences to align on an axis.",
        "what_it_actually_means": "Voters must attest to having preferences that are single-peaked on a company-defined axis, and the median voter's preferred option wins."
      }
    ],
    "silences_exploited": [
      "agenda control",
      "coalitional misreports",
      "cardinal intensity",
      "preference formation",
      "quality of the winner"
    ],
    "recommended_mode": "SPECTRUM_ALIGN",
    "bottom_line": "An honestly strategy-proof system with three or more options either requires random outcomes, restricts the set of alternatives to two, or imposes significant constraints on voter preferences, each of which may be undesirable for real-world governance."
  }

  Note: In the condition_relaxed for SPECTRUM_ALIGN, it should be "unrestricted domain of preferences", because that is the condition being relaxed (by assuming single-peakedness). The theorem's conditions are: (1) at least three outcomes, (2) non-dictatorship, (3) unrestricted domain, (4) deterministic and (5) social welfare function that is onto and strategy-proof. We are relaxing (3). Alternatively, we can phrase it as "unrestricted domain".

  Let me adjust the condition_relaxed for each mode:

  - RANDOM_SELECT: deterministic single-winner resolution
  - BINARY_CHOICE: a range of at least three possible outcomes
  - SPECTRUM_ALIGN: unrestricted domain of preferences

  Now, writing the memo accordingly.
