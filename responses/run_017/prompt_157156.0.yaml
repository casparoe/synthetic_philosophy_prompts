answer: |-
  Your query dissects profound tensions in causal reasoning across disciplines. Below is a systematic analysis addressing each request, with confidence assessments and epistemic caveats.

  ### 1. Legal Causation: Liability vs. Apportionment  
  **Theory Presupposed**:  
  - **Liability Stage**: Courts adopt a *normative override* of counterfactual causation. The "substantial factor" test isn't a rival metaphysical theory but a pragmatic exception for overdetermination (e.g., *Restatement (Third) of Torts* §27). It preserves but-for causation as the default while treating *each sufficient cause* as fully responsible for the *entire harm* when strict counterfactualism fails.  
  - **Apportionment Stage**: Percentages reflect *comparative responsibility* (fault + causal contribution), not pure causation. This is explicit in statutes like the Uniform Comparative Fault Act. The sum-to-100% requirement is a *procedural norm* for loss allocation, not a metaphysical claim about causal gradation.  

  **Inconsistency Resolution**:  
  The same act is deemed "fully causal" for liability (satisfying the minimal threshold for responsibility) but "fractionally responsible" for damages. This is coherent only if:  
  - Liability uses an *all-or-nothing causal status* (did this act suffice to trigger liability?).  
  - Apportionment uses a *scalar measure of comparative blameworthiness* (how much does each party deserve to pay?).  
  *Confidence: High (95%)*. Doctrine explicitly separates factual cause (binary) from apportionment (scalar).  

  **What Settles It**:  
  Jurisdictions like California (*Rutherford v. Owens-Illinois*) explicitly state apportionment addresses "fault," not causation. But metaphysical tension persists: if causation is binary, why let juries assign "causal percentages"? The law’s answer is policy-driven: fairness in loss distribution trumps causal purity.  

  ---

  ### 2. Historical Overdetermination: Meanings and Implications  
  **Four Meanings of "Overdetermined"**:  
  | Meaning          | Historian’s Commitment | Conflict with Practice? |  
  |------------------|------------------------|--------------------------|  
  | (i) Each sufficient alone | Rare (unrealistic) | Conflicts with narratives |  
  | (ii) Multiple sufficient routes | Common | Compatible with contrastive focus |  
  | **(iii) Evidential uncertainty** | **Dominant in practice** | **Explains causal hierarchies** |  
  | (iv) Robustness | Frequent (e.g., structural history) | Coexists with "turning points" |  

  **Analysis**:  
  - Historians primarily mean (iii): *We cannot isolate which factor "did the work,"* hence listing multiple conditions. "Primary cause" then reflects:  
    - **Contrastive salience**: Why *this* war in 1914, not 1912? The assassination was the unexpected trigger.  
    - **Intervention potential**: Root causes in incident reports target actionable factors.  
    - **Narrative economy**: "Immediate cause" often means temporally proximate, not ontologically primary.  

  **Incoherence Risk**:  
  If historians genuinely believed (i) (each factor sufficient alone), labeling one "primary" would be incoherent. But they don’t; they use hierarchies pragmatically:  
  - *Underdetermination*: Evidence rarely supports (i) or (ii).  
  - *Practice*: "Primary" = most salient in a specific explanatory context (e.g., *Why War?* by N. Ferguson uses counterfactuals to rank causes).  
  *Confidence: Medium-High (85%)*. Textual analysis of historiography (e.g., Carr's *What is History?*) shows "overdetermination" as epistemic caution, not metaphysical claim.  

  **What Would Change**:  
  - Adopting (i) or (ii) would force historians to abandon causal hierarchies.  
  - Adopting (iv) (robustness) aligns best with practice: "turning points" are perturbations that *could* have changed outcomes (low robustness).  

  ---

  ### 3. Stress-Testing Your Causal Credit Rule  
  **Rule**: *Assign shares by averaging over orderings of conditions, scoring 1 if adding a condition flips the outcome.*  
  - **Two fires**: Each gets 0.5 (sums to 1). ✅  
  - **Pre-emption**: Backup fire (never burns house) gets 0.5.  

  **Defect or Insight?**  
  - *Legal view*: Backup isn’t a cause (no liability). Your rule assigns it "credit," contradicting law’s focus on *actual sequence*.  
  - **Your challenge exposes a truth**: The symmetric/pre-emptive distinction *is* normative. Law absolves the backup because it changed nothing *in the actual world*; your rule treats all sufficient conditions symmetrically in modal space.  
  - **Liability Reconstruction Failure**: Your rule can’t justify full liability for each defendant (max share per actor <1). It’s designed for apportionment, not threshold liability.  

  **Historian Adoption Cost**:  
  Historians would need to quantify conditions (rarely possible) and abandon narrative emphasis on "decisive" factors. It conflicts with contrastive explanations (e.g., "Why here?" focuses on *differences*, not averages).  
  *Confidence: High (90%)*. Math is sound; mismatch with law/history reflects divergent purposes.  

  ---

  ### 4. The Real Difference: Purposes, Not Metaphysics  
  **Underdetermination Points**:  
  | Field          | Attribution Purpose         | Metaphysical Underdetermination |  
  |----------------|-----------------------------|----------------------------------|  
  | **Tort Law**   | Compensation + Deterrence   | Same verdicts from: <br>- Pure counterfactualism + policy override (current law) <br>- Scalar causation (rejected) <br>- Probabilistic causation |  
  | **History**    | Explanation + Understanding | Same narrative from: <br>- Contrastive causation <br>- INUS conditions (Mackie) <br>- Process tracing |  
  | **Incident Investigation** | Prevention           | "Root cause" is whatever is actionable, regardless of causal theory |  

  **Deep Disagreement**:  
  You identify the core tension: **Is causation a rivalrous quantity ("budget") or a non-rivalrous status?**  
  - Law treats it as *non-rivalrous for liability* (all sufficient causes are 100% causes) but *rivalrous for payment* (losses are finite).  
  - History treats causes as *non-rivalrous facts* but narrative focus as *rivalrous attention*.  
  - **Third Option**: Causation is *contrastive-relational* (causes are differences from a baseline). This resolves tensions:  
    - Tort: "But-for" is contrastive (vs. no negligence); overdetermination shifts baseline.  
    - History: "Why P not Q?" selects relevant contrasts.  

  **What Would Make Metaphysics Bite**:  
  - In law: If courts required juries to define the explicit contrast space for causation.  
  - In history: If historians stopped using singular causal language entirely.  
  *Confidence: Medium (75%)*. Practice is adaptive; metaphysics is only relevant when purposes conflict.  

  ---

  ### Least Confident Claim  
  **Claim**: "Historians primarily use 'overdetermined' to mean evidential uncertainty (iii)."  
  - **Why Unsure**: Some historians (e.g., structural/materialists) may genuinely mean (iv) (robustness).  
  - **How to Settle**:  
    1. Computational text analysis of 100 historical monographs using "overdetermined," coding context.  
    2. Philosopher-historian surveys on intended meaning (e.g., via *History and Theory* journal).  

  **Overall Confidence Map**:  
  - Legal analysis: 95%  
  - Historical practice: 85%  
  - Causal credit rule: 90%  
  - Purpose-driven divergence: 75%  

  This reveals law's core tension: *normative allocation of finite losses* versus *binary factual attribution*. History's tension: *causal pluralism* versus *narrative coherence*. Your rule is elegant but ignores law's focus on actual world efficacy. The deepest fix would be to admit all causal attributions are contrastive and purpose-relative – but no field is ready for that.
