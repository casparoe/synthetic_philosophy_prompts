  **THE REFERENCE CLASS (ASSIGNMENT) REGULATIONS 2024**  
  *Draft Statutory Instrument laid before Parliament by the Department for Long-Term Risk*

  **Citation, commencement and interpretation**  
  1. These Regulations may be cited as the Reference Class (Assignment) Regulations 2024 and come into force on 1st October 2024.  
  2. In these Regulations—  
     - "the Act" means the Long-Term Risk Assessment Act 2022;  
     - "Assigned Class" means the reference class allocated to a citizen under Regulation 5;  
     - "Eligible Citizen" means an individual meeting the criteria in Regulation 4;  
     - "SLEU" means the Self-Locating Evidence Unit of the Department;  
     - "Specialness Exemption" has the meaning given in Regulation 7.  

  **Register of Reference Classes**  
  3. The SLEU shall maintain a Register of Assigned Classes for all citizens.  
     - (a) The Register shall record each citizen’s Assigned Class and birth rank therein.  
     - (b) Birth ranks shall be determined chronologically by verified date of birth.  

  **Eligibility Criteria**  
  4. A citizen is Eligible if they are not aware of any trait or circumstance distinguishing them from typical observers, excepting traits intrinsic to human existence (e.g., sensory faculties, mortality).  
     - (a) Awareness of these Regulations or the probabilistic method under Section 3(1)(a) of the Act renders a citizen ineligible.  
     - (b) Eligibility shall be reassessed biannually via declaratory submission (Form RC-101).  

  **Assignment of Reference Class**  
  5. The SLEU shall assign all Eligible Citizens to the Primary Reference Class ("*Homo sapiens*, terrestrial, biological, post-1900").  
     - (a) Citizens failing Eligibility under Regulation 4(b) may be assigned to an Auxiliary Class under Schedule 1.  

  **Specialness Exemption**  
  7. Citizens contesting ineligibility may apply for a Specialness Exemption.  
     - (a) Granting requires demonstration that acquired distinguishing knowledge does not materially affect typicality.  
     - (b) Exempted citizens remain in the Primary Class but are flagged in the Register (Annotation SE-1).  

  **Deferred Classes**  
  8. Entities of unresolved observer-status (e.g., non-terrestrial intelligences, computational uploads, posthumans with >500-year lifespans) shall be provisionally assigned to a Deferred Class (Schedule 1).  
     - (a) Estimates involving Deferred Classes shall apply a 95% confidence interval to all calculations.  

  **Appeal Tribunal for Class Reassignment**  
  9. A citizen may petition the SLEU Tribunal for reassignment to a preferred reference class.  
     - (a) The Tribunal may approve if the proposed class is objectively definable and materially distinct.  
     - (b) **Example:** A citizen reassigned to "Persons to whom the Doomsday Argument has been formally explained" (birth rank: 14,500) shall have their total class bound calculated as 20 × birth rank (290,000).  

  **Application to Non-Demographic Durations**  
  10. The methodology under Section 3(1)(a) of the Act shall extend to:  
      - (a) The operational tenure of the Department (Assigned Class: "UK Civil Service entities, 2024–");  
      - (b) Opening hours of the departmental canteen (Class: "Service intervals since 1/1/2024").  

  ---

  **SCHEDULE 1**  
  *Deferred Reference Classes*  
  1. Computational uploads (post-biological).  
  2. Non-terrestrial observers (confirmed).  
  3. Posthuman observers (lifespan ≥500 years).  
  4. Collective intelligences (e.g., hive-minds).  

  ---

  **WORKED EXAMPLE**  
  *Per Regulation 9(b):*  
  - Citizen A (DOB: 12/05/1990) is Assigned to Primary Class (birth rank: 8.2e9).  
    - Total class bound: 20 × 8.2e9 = 1.64e11.  
  - Citizen A petitions for reassignment to "Holders of SLEU-recognised expertise in anthropic reasoning".  
    - Tribunal approves. New birth rank: 942 (as of 01/06/2024).  
    - Recalculated bound: 20 × 942 = 18,840.  
  - **Result:** The bound for Citizen A’s new class (18,840) is materially lower than for the Primary Class (1.64e11).  

  ---

  **QUOTATIONS**  
  > "The elegance of the method lies in its statistical neutrality. By fixing reference classes administratively, we eliminate subjective bias from existential risk estimates."  
  > — *Dr. E. Finch, Chief Statistician, SLEU*  

  > "Adjusting infrastructure investment horizons using SLEU’s outputs is irrational. A 0.1% change in climate model parameters outweighs the entire doomsday adjustment by six orders of magnitude."  
  > — *Treasury Audit Committee response to DLR Annual Report (2023)*  

  ---

  **EXPLANATORY NOTES**  
  - These Regulations operationalise Section 3(1)(a) of the Long-Term Risk Assessment Act 2022 by standardising reference class assignments for anthropic probability calculations.  
  - Per Section 5 of the Act, SLEU’s annual Doomsday Estimate applies a fixed multiplier (20) to the median birth rank of the Primary Reference Class. This figure informs the Statutory Long-Term Infrastructure Horizon (SLTIH), adjusted biennially.  
  - Under Regulation 4(b), rising public awareness of these procedures inherently reduces Eligibility, increasing the median birth rank of the Primary Class and extending the Doomsday Estimate.  
  - Where the Eligible Citizen cohort falls to zero, the Act mandates a default SLTIH of 1,000,000 years (Amendment 7, 2023).  

