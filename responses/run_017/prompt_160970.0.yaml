prompt: |-
  I'm on the editorial board of my school's civics magazine, and I'd like a satirical piece — about 550 words — on subsidiarity. Please write it as an official notice from a school district's Office of Jurisdictional Review, in deadpan bureaucratic register, headed something like "Re: Delegation of Dress-Code Authority," announcing that under the district's new subsidiarity policy every decision must be handled by the lowest level capable of handling it, and tracing what happens as the hoodie question travels from the state department of education down through the district, the principal, the homeroom teacher, and finally to the individual student's closet.

  Two things I care about. First, get the actual structure of the doctrine right so the comedy comes from inside it: authority flows downward, the one power that never flows downward is the power to certify which level is competent, and the higher level's remaining role is to "assist" — which is how the district ends up auditing a fourteen-year-old's wardrobe twice a semester. Please invent one mechanism to make this bite, for instance a Certificate of Demonstrated Competence that any body must earn before it is permitted to decide anything, graded by the body immediately above it, and follow it until the rule eats itself: the student can only demonstrate that she is competent to choose her own hoodie by choosing a hoodie, which she may not do until she is certified. The notice is issued jointly by the state and the district, and each insists it has no authority in the matter and is merely helping, so that by the end nobody is answerable for the policy.

  Second, keep it fair and legible: no named theorists, no citations, no character stating the moral aloud (nobody says "so the centre keeps everything"), and a reader who has never met the word "subsidiarity" should still follow the farce. The goal is a reductio someone who knows the federalism literature would recognise as fair rather than a straw man.
reasoning: |-
  Okay, the user wants a satirical piece about subsidiarity for their school civics magazine. They need it structured as a bureaucratic notice from a school district, tracing how a hoodie dress code decision devolves to absurd levels. 

  Hmm, key requirements: must accurately represent subsidiarity doctrine while making the comedy emerge from its inherent contradictions. The power to certify competence stays at higher levels, creating a catch-22 where the student can't choose a hoodie without certification that requires choosing a hoodie. Need to invent a mechanism like the "Certificate of Demonstrated Competence" to make this bite. 

  Noticing important constraints: no named theorists or citations, must be understandable without prior knowledge of subsidiarity, and no explicit moralizing. The satire should feel fair to federalism scholars while being accessible to high school readers. 

  The bureaucratic voice is crucial - deadpan officialese that slowly reveals the absurdity. Starting with joint state/district letterhead establishes the "we're just helping" dynamic upfront. Tracing the hoodie question downward lets each level offload responsibility while retaining control through certification. 

  Ah, the certification trap is perfect: student must demonstrate competence by choosing... but can't choose until certified. That's the reductio ad absurdum. Ending with "mutual assistance" between state/district highlights how accountability evaporates. 

  Word count target is tight - 550 words means every sentence must multitask. Using sections (BACKGROUND, POLICY, IMPLEMENTATION) creates bureaucratic rhythm while advancing the joke. Phrases like "non-mandatory advisory checklist" and "Form 7B-Request for Closet Inspection" ground the absurdity in plausible paperwork. 

  Final touch: the passive-aggressive "you may direct inquiries to the homeroom teacher" after making that position powerless. And the joint signatures with each entity disclaiming authority? *Chef's kiss*. Exactly the institutional cowardice the user wants exposed.
answer: |-
  ## OFFICE OF JURISDICTIONAL REVIEW – STATE DEPT. OF EDUCATION & MIDDLETON UNIFIED SCHOOL DISTRICT  
  **MEMORANDUM # 23-87-0042**  
  **RE: Implementation of District Subsidiarity Policy (Ref. Directive SD-Ed. 104.5a) & Delegation of Dress-Code Authority: Hoodie Protocol**

  **DATE:** October 26, 2023  
  **TO:** All District Administrators, Faculty, Staff, Students (Grades 6-12), and Designated Closet Monitors  
  **CC:** State Oversight Bureau (Subsidiarity Compliance), District Legal Counsel, Building Janitorial Chiefs  
  **FROM:** Dr. A. Bureaucrat (State Associate Deputy for Jurisdictional Harmony), Ms. P. Paperwork (District Subsidiarity Facilitator)  
  *(Issued jointly pursuant to mutual assistance pact SOE-MUSD/SUB-1)*

  **BACKGROUND:**  
  Per District Policy SUB-001 ("The Principle of Proximal Primacy"), operationalized under State Framework SD-Ed. 104.5a ("Enabling Competence Through Tiered Empowerment"), all non-emergency decisions must be made at the *lowest competent level* capable of effective execution. This ensures responsiveness, efficiency, and optimal resource utilization. Higher levels retain only a supportive, non-directive role focused on *assisting* lower levels in achieving competence.

  **POLICY APPLICATION: STUDENT ATTIRE (HOODIE CLASSIFICATION):**  
  The persistent query regarding the permissibility of student-worn hooded sweatshirts ("hoodies") has been identified as an ideal test case for SUB-001 implementation. Accordingly, jurisdictional authority for hoodie determination has been devolved as follows:

  1.  **STATE DEPARTMENT OF EDUCATION:** Recognizes it lacks the granular insight for individual hoodie assessment. Its role is strictly limited to certifying the District Office of Jurisdictional Review (OJUR) as competent to manage the *process* of hoodie assessment delegation (Certification SD-HDY-COMP-01 issued 09/15/23). Provides non-mandatory advisory checklists re: fabric weight thresholds (Appendix D).
  2.  **DISTRICT OFFICE OF JURISDICTIONAL REVIEW (OJUR):** Certified by the State, OJUR confirms it possesses no inherent authority over specific garments. Its function is to assist building Principals in achieving competence for hoodie assessment within their buildings. OJUR has developed the "Hoodie Competency Attainment Protocol" (HCAP v.3.2) and will audit Principal certification biannually.
  3.  **SCHOOL PRINCIPAL:** Must obtain a "Certificate of Demonstrated Competence in Attire Assessment" (CDC-AA Level 2) from OJUR *before* delegating hoodie decisions. Certification requires successful completion of online module "Hoodies: Context & Consequence" (pass rate 80%) and submission of a building-wide hoodie risk-mitigation flowchart. Upon certification (valid 6 months), the Principal may delegate *actual* hoodie assessment to Homeroom Teachers (HRTs), providing only logistical support (e.g., scheduling assessment windows, supplying magnifying glasses for logo inspection).
  4.  **HOMEROOM TEACHER (HRT):** Must earn a CDC-AA Level 1 (issued by the certified Principal) demonstrating understanding of HCAP v.3.2 and proficiency in using the "Hoodie Suitability Rubric" (HSR-7B). The certified HRT does *not* assess hoodies directly. Their role is to assist the *individual student* in achieving personal competence for autonomous hoodie selection, via bi-weekly "Wardrobe Autonomy Coaching Sessions" (WACS - Form 7B-Request required).
  5.  **INDIVIDUAL STUDENT:** The ultimate competent authority for their personal hoodie selection, per SUB-001. **However:** Prior to exercising this authority, the student **must** hold a valid "Personal Attire Competency Certificate" (PACC). To obtain a PACC (issued by the certified HRT), the student must **demonstrate sustained competence in autonomous hoodie selection across four (4) distinct climatic scenarios** (simulated or actual), documented via the "Hoodie Choice Journal" (HCJ-12) and verified by HRT observation.

  **IMPLEMENTATION & ASSISTANCE:**  
  *   **Initial Phase (Now - Dec 1):** Principals pursuing CDC-AA Level 2 certification must register for Module HC-101 via DistrictPortal. OJUR auditors will commence baseline competence evaluations.
  *   **HRT Certification (Dec 1 - Jan 15):** Certified Principals will commence Level 1 CDC-AA training for HRTs using OJUR-provided HCAP v.3.2 Facilitator Kits.
  *   **Student PACC Attainment (Commencing Jan 16):** Certified HRTs will initiate WACS with students. HCJ-12 booklets will be distributed. **Important:** Until a student holds a valid PACC, hoodie selection authority *cannot* be exercised. Default attire regulations (MUSD Code 4.7 - "Non-Hooded Layers") remain in effect.
  *   **State Assistance:** The State Bureau offers complimentary webinars: "Defining Competence: A Theoretical Overview" (Tuesdays, 2 PM).
  *   **District Assistance:** OJUR provides HCJ-12 grading templates and WACS session scheduling software (v. "HelperBee"). Janitorial staff are instructed to report unattended hoodies to OJUR for potential competence-lapse analysis.

  **ACCOUNTABILITY:**  
  Compliance with SUB-001 and the hoodie delegation chain is mandatory. Audits will ensure certifications are current and assistance protocols are followed precisely. Remember: Higher levels *enable*, they do not decide. Lower levels *decide*, but only when competence is formally certified by the enabling level immediately above them.

  **CONCLUSION:**  
  This structured, competence-based approach maximizes local autonomy while ensuring decisions are made by those closest to the context – in this instance, literally within the student's own closet (subject to PACC validation and biannual OJUR closet-inventory spot checks for procedural adherence, naturally). We are confident this fosters true empowerment and efficient governance.

  **QUESTIONS?**  
  You may direct inquiries to your Homeroom Teacher (once CDC-AA Level 1 certified), your Principal (once CDC-AA Level 2 certified), or file Form OJUR-HELP-55 (triplicated) with the District Office. Neither the State Department of Education nor the District OJUR possesses decision-making authority on individual hoodies; our role is purely facilitative under the mutual assistance framework.

  Respectfully submitted in the spirit of tiered empowerment,

  // SIGNED //  
  Dr. A. Bureaucrat  
  *State Associate Deputy for Jurisdictional Harmony  
  (Acting solely in an enabling capacity per SD-Ed. 104.5a)*

  // SIGNED //  
  Ms. P. Paperwork  
  *District Subsidiarity Facilitator, OJUR  
  (Exercising no authority, merely assisting certified Principals per SUB-001)*
