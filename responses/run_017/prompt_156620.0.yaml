answer: |-
  ### Stress-Testing Invariantism About Indifference: A Map of Exposure  
  **Core Claim Reiterated:** When an experiment's symmetry group is fully specified, there exists a unique (up to scale) invariant prior. Apparent paradoxes arise from incomplete specification, not a flaw in the indifference principle itself.

  ---

  #### 1. **Defeaters Ranked: Fatal to Awkward**  
  *(Your verdict: Committed invariantist dismissal vs. genuine concession)*  

  | Rank | Defeater                                                                                                  | Verdict (Mine)                                                                                                 | Invariantist Response                                                                                             |  
  |------|-----------------------------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------------------------------|  
  | **1** | **Symmetry fixes marginals, not joint dependence** (e.g., two points on a circle; §2).                    | **Fatal** if unaddressed. Invariantism lacks resources to resolve non-uniqueness.                              | *Concede:* Requires supplementary rule (e.g., independence). Dismissal fails.                                     |  
  | **2** | **Non-unimodular groups / improper priors**: Scaling symmetry on ℝ⁺ yields non-normalizable Haar measure. | **Severe** (limits scope).                                                                                     | *Concede:* Method silent or yields unworkable priors. "Ill-posed" dismissal is question-begging here.             |  
  | **3** | **Empirical disconnect**: Invariant measure describes an idealization, not real experiments (§3).         | **Awkward but survivable**.                                                                                    | *Dismiss:* Boundary effects = symmetry-breaking. "Genuine" symmetry implies convergence to invariant limit.       |  
  | **4** | **Non-amenable groups**: No invariant mean (e.g., uniform distribution over ℤ).                           | **Severe for discrete cases**.                                                                                 | *Concede:* Method fails. Dismissal ("problem ill-posed") admits limitation.                                       |  
  | **5** | **Multiple competing symmetries**: Which group is "natural"? (e.g., circle as U(1) vs. SO(3)/SO(2)).      | **Awkward**. No principled choice.                                                                             | *Dismiss:* Experiment's physics fixes group. Ambiguity = incomplete specification.                                |  
  | **6** | **Insulation from falsification**: "Ill-posed" retort available for any counterexample (§5).             | **Awkward but not fatal** if predictions exist.                                                                | *Dismiss:* Predicts that symmetry-respecting mechanisms converge to invariant measure (§3).                       |  

  ---

  #### 2. **The Marginal-Dependence Objection**  
  **Problem:** For two points on a circle, rotation invariance implies uniform marginals but not independence. Two invariant measures exist:  
  - **Independent uniform points**: ℙ(chord > √3 R) = ⅓.  
  - **Perfect anticorrelation** (diametric pairs): ℙ(chord > √3 R) = 1.  

  **Invariantist Response & Risks:**  
  - **Concession**: Symmetry alone is insufficient. A supplementary rule is needed (e.g., "assume independence unless dependencies are symmetry-mandated").  
  - **Collapse into Rivals?**  
    - If independence is added as a default, invariantism mimics **maximum entropy** (MaxEnt) subject to symmetry constraints.  
    - **Regress Threat**: Independence requires a *basis* (e.g., arc-length vs. angle). But invariantism rejects privileging coordinates.  
    - **Partial Salvage**: For the circle, independence *is* invariant under rotation if defined via product measure. Yet this relies on the circle’s homogeneity – not generalizable (e.g., sphere S²).  
  - **Inscribed Triangle Case**: Same issue. Uniform i.i.d. points yield ℙ(acute) = ¼; a correlated measure could yield ½. Invariantism alone cannot choose.  

  **Verdict**: This defeats pure invariantism. It must absorb MaxEnt or subjectivism to resolve dependence, eroding its distinctiveness.  

  ---

  #### 3. **Empirical Exposure**  
  **Claim**: Invariant probabilities are recovered only in idealized limits (e.g., infinite plane, negligible straw width).  
  - **What Invariantism Buys**: A **consistency criterion**. Any asymmetry-free mechanism (e.g., isotropic straw tossing) must approach the Haar measure as boundary effects vanish.  
  - **Testable Prediction**:  
    - If a symmetry-respecting setup (e.g., laser-scanning isotropic directions on a large circle) yields 1/3 or 1/4 *systematically*, invariantism is falsified.  
    - **Reality Check**: Experiments (e.g., Diaconis' needle tossing) confirm convergence to 1/2 under rotation invariance.  
  - **Invariantist Reply to Anomaly**: Asymmetry *must* exist (e.g., gravitational gradients, quantum effects). The prediction holds *ceteris paribus* – a strength if anomalies are traceable, a weakness if not.  

  **Verdict**: Empirically non-vacuous but relies on idealization. Boundary effects expose where specification was incomplete.  

  ---

  #### 4. **Scope Limitation**  
  **Cases**:  
  - **Scaling Invariance (ℝ⁺)**: Only improper prior *dx/x*. Normalization fails (e.g., Jeffreys prior).  
  - **Uniformity over ℤ**: No countably additive measure; finitely additive "density" underdefined (e.g., ℙ(even) undefined).  

  **Implications**:  
  - **Honest Modesty?** Yes – invariantism explicitly restricts to problems with *amenable* symmetry groups.  
  - **Symptom of Vacuity?** No. For well-posed problems (e.g., compact groups like SO(3)), it gives unique answers. Silence elsewhere reflects genuine underdetermination (e.g., cosmology needs anthropics).  

  **Verdict**: Strength in its domain, but domains like cosmology remain outside its reach.  

  ---

  #### 5. **Insulation from Falsification**  
  **Risk**: "Ill-posed" as a universal shield.  
  - **Does it Collapse?** Not if:  
    - It **constrains mechanisms**: If your setup is rotation/translation invariant, your prior *must* be Haar measure.  
    - It **distinguishes predictions**:  
      - Invariantism vs. **Subjectivism**: Demands conformity to symmetry; subjective Bayesians may ignore it.  
      - Invariantism vs. **MaxEnt**: MaxEnt fixes dependencies; invariantism may not (see §2).  
      - Invariantism vs. **Mechanism-First**: Predicts *equivalence classes* of mechanisms (e.g., all isotropic tosses → same limit).  
  - **Friendly Amendment**: Invariantism is best as a **specification constraint**. This is *capitulation* only if sold as a full probability generator.  

  **Verdict**: Not vacuous, but its value is in disciplining problem formulation.  

  ---

  #### 6. **The Best Counterexample: Chord Direction Paradox**  
  **Setup**: "A chord is drawn by choosing a direction uniformly at random (rotation invariance), then intersecting it with the circle."  
  - **Symmetry Group**: SO(2) (rotations). Haar measure: *dθ* for direction θ.  
  - **Calculation**: Chord length > √3 R iff |cos φ| < 1/2 (φ = angle from center). Result: **ℙ = 1/2**.  

  **Why It Feels Wrong**:  
  - Naive parametrizations (endpoints, midpoints) yield 1/3 or 1/4. The 1/2 answer seems arbitrary.  
  - Physical intuition: If "direction" means "random line in plane," it matches Bertrand’s "random radius" (answer: 1/2). But is this the "correct" specification?  

  **Invariantist Reply**:  
  - "You specified direction uniformity – this *is* the experiment. If you meant something else (e.g., random endpoints), specify better."  
  - **Is This a Refusal?** **No**. The answer is consistent and unique under the given symmetry. Discomfort stems from conflating distinct experiments.  

  **Verdict**: This exposes that invariantism’s "correct" answers can defy intuition – but the reply is valid. The flaw is in human intuition, not the principle.  

  ---

  ### Final Verdict  
  **Invariantism survives – but with scars**:  
  - **Fatal Flaw**: It cannot resolve dependence structure without help (MaxEnt/subjectivism).  
  - **Major Limitation**: Silent on non-amenable groups (ℤ, ℝ⁺).  
  - **Strength**: Unambiguous for compact/locally compact groups with specified mechanisms.  
  - **Status**: Best as a **meta-principle for specification**. It dissolves Bertrand-type paradoxes by exposing underspecification but cannot generate probabilities in vacuum. Its core insight – that indifference must respect symmetries – remains sound, but it is a *foundation* for objective Bayesianism, not the complete edifice.
