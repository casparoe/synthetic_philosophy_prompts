prompt: |-
  You are a philosopher of biology who works in the levels-of-selection literature — the replicator/vehicle and replicator/interactor distinctions, the contrast between contextual (group- or individual-level) partitions of fitness and gene-level partitions that fold the social environment into the focal individual's fitness, and the Price-style split of a total change into a within-group and a between-group component. You are not impressed by slogans, and you do not treat "it's just a matter of convention" as the end of a discussion.

  Read the whole list below before you begin, and work through it item by item on your own first. The word limit applies to what you hand back, not to your thinking.

  I'm a postdoc in evolutionary biology, and I've been asked to circulate a short "where I stand" statement ahead of a reading group on levels of selection. Before I commit it to a page, I want the package stress-tested. Here is roughly where I've landed:

  (1) Only a faithful, long-lived replicator can accumulate the products of cumulative selection, because organisms and colonies are transient and do not persist across generations as the same entity. So in the beneficiary sense, genes are the units of selection; organisms and groups are at most vehicles or interactors.

  (2) Contextual partitions and gene-level partitions are alternative bookkeeping schemes over the same total change, and when both are specified correctly they agree. So the question "does selection act at the group level, yes or no?" has no empirical content; it is a choice of description.

  (3) There is nonetheless a real, empirically answerable question whether a given collective trait is instantiated only by the group — a colony's division of labour, say — and whether groups carry heritable variance in fitness at their own level. Discovering that is empirical work, not notational preference.

  (4) One should choose the decomposition whose terms track the actual causal structure of the system. A partition that lumps causally heterogeneous causes together is a bad partition even when it predicts well.

  (5) Case A, idealized from my own system: an obligate, strictly vertically transmitted host–endosymbiont pair in which a nutritional pathway is split across two genomes — the host carries the first two enzymatic steps, the symbiont the third, and neither genome alone yields the product. I want to say the pair is a single unit of selection, and that this is the causally faithful description rather than a convenience.

  (6) Case B: the same system with occasional horizontal transmission of the symbiont, where a strain spreads by biasing host investment toward symbiont-bearing propagules at a cost to host survival. I want to say there is a genuine conflict of levels here, and that the level at which selection acts has shifted relative to Case A.

  (7) The mid-century rejection of for-the-good-of-the-species explanations was a substantive empirical correction, not a change of notation. Relatedly, I take the major transitions — multicellular organisms, eusocial colonies — to involve a real historical transfer of fitness from the lower-level units to the higher-level unit, not merely a redescription of the same process.

  (8) The Price equation is the right framework for all of the above; and I also think it is a bookkeeping identity that explains nothing until its terms are given a causal interpretation.

  Something in here feels like it is doing more work than it can bear, but I can't locate it. Audit the set: which commitments actually pull against each other, which pairs only look like they do and dissolve on inspection, and rank the real ones by severity — most damaging first. For each, say precisely what would have to give, and how costly that would be. Then name the single revision that cleans up the most.

  Be committed: give me a definite verdict, tell me which commitment has to go and defend that choice, rather than laying out the options and leaving me to pick. If you genuinely think the set is consistent as it stands, say so and tell me which worry of mine was misplaced — but only if you mean it. Close with one sentence on where your own verdict rests on a contested reading of the literature. No bibliography, no citations. Structure: a one-sentence bottom line, then the ranked tensions, then the pairs that dissolve, then the cheapest revision. No more than 800 words.
reasoning: |-
  Hmm, the user is a postdoc in evolutionary biology preparing a "where I stand" statement on levels of selection for a reading group. They've outlined eight commitments and want me to stress-test them for internal consistency. They're particularly concerned that something in their package might be doing more work than it can bear.

  Let me analyze their commitments systematically. First, their replicator-centric view (1) seems at odds with their endorsement of major transitions involving a "real historical transfer of fitness" (7). If genes are the only true units of selection, how can fitness genuinely transfer to higher levels? This tension is severe because it challenges the core of their framework.

  The second tension arises between their view that group selection questions lack empirical content (2) and their claim that discovering group-level heritable variance is empirical work (3). If the choice of description is conventional, how can group-level properties be objectively discovered? This undermines their attempt to have both conventionalism and realism.

  Third, their case studies present problems. For Case A (5), calling the host-symbiont pair a single unit conflicts with their replicator definition in (1), since the pair isn't a long-lived replicator. For Case B (6), framing conflict as a "shift" in selection level contradicts their conventionalism in (2).

  Not all apparent conflicts are real though. Their view of the Price equation (8) as both framework and mere bookkeeping is consistent - it's widely accepted as an identity requiring causal interpretation. Also, their causal partition preference (4) aligns with conventionalism when properly contextualized.

  The most damaging issue is the replicator/major transition conflict. To resolve this, they should abandon the strong replicator claim in (1). This is costly as it weakens gene-centrism, but allows consistency with their view of major transitions. The alternative - weakening (7) - would undermine the substantive nature of evolutionary transitions.

  The single revision that cleans up most is indeed to drop the exclusive replicator requirement. This resolves multiple tensions while preserving their core insights about causal structure and empirical discoveries at group level. My verdict rests on interpreting major transitions as involving genuine evolutionary individuality emergence - a contested but defensible position in the literature.
answer: |-
  ### Bottom Line  
  Commitment (1) must be abandoned because its strong replicator requirement ("only a faithful, long-lived replicator...") contradicts your substantive view of major transitions in (7) and your Case A in (5), rendering them incoherent within your framework.  

  ### Ranked Tensions (Most Damaging First)  
  1.  **(1) vs. (7) & (5):** Claiming that *only* genes are units of selection (as beneficiaries) directly clashes with your assertion that major transitions involve a "real historical transfer of fitness" to higher-level units (7) and that the host-symbiont *pair* is a single unit of selection (5). If fitness genuinely transfers to a higher unit (e.g., the multicellular organism), that unit *is* a beneficiary by your own logic. Insisting genes are the *only* beneficiaries denies the reality of the transition you endorse. **Cost of Fix:** Dropping (1)'s exclusivity allows (5) and (7) to stand, but weakens strict gene-centrism. Keeping (1) forces you to recant (5) and (7) as illusions – a high cost given their centrality.  

  2.  **(2) vs. (3) & (6):** Stating that the question "does selection act at the group level?" has *no empirical content* (it's just bookkeeping) undermines your claim that discovering group-level heritable variance (3) is empirical work and that Case B involves a genuine *shift* in the level of selection (6). If level attributions are *only* descriptive choices, (3) and (6) become statements about preferred descriptions, not empirical discoveries or causal shifts. **Cost of Fix:** Softening (2) to say bookkeeping choices *should track* empirically discoverable hierarchical structure (like (3)/(6)) preserves your realism. Keeping (2) strictly forces (3) and (6) into mere convention, gutting their substance.  

  3.  **(1) vs. (5):** Declaring the host-symbiont *pair* a single unit of selection (5) directly violates (1), as the pair is not a "faithful, long-lived replicator" (genes are). The pair is a developmental/functional unit, not a replicator. **Cost of Fix:** Dropping (1)'s replicator-as-*only*-beneficiary claim allows (5). Keeping (1) forces you to demote (5) to "vehicle" talk, conflicting with your intent that it's the true unit.  

  ### Apparent Tensions that Dissolve  
  *   **(4) vs. (2):** Your preference for causal partitions (4) is compatible with conventionalism (2). (4) simply states *how* to choose among conventional decompositions: pick the one matching causal structure. This doesn't negate conventionalism; it guides it.  
  *   **(8) vs. Everything Else:** Calling Price a bookkeeping identity needing causal interpretation is consistent with using it as the framework. It *is* an identity, and your emphasis on causal interpretation aligns perfectly with (4). No conflict.  

  ### The Cheapest Revision  
  **Drop the exclusivity claim in (1).** Revise it to: "Faithful, long-lived replicators (typically genes) are *fundamental* units enabling cumulative selection, but during major transitions, higher-level units can become *additional* beneficiaries or evolutionary individuals."  

  **Why this cleans up the most:**  
  1.  Resolves the severe clash with (7) and (5) by allowing higher-level units to genuinely acquire beneficiary status.  
  2.  Aligns with (3) and (6): Discovering group-level heritability/adaptation becomes empirical work identifying *when* a higher unit functions as an evolutionary individual, not just a descriptor.  
  3.  Preserves the core insight of (1) – replicators' role in inheritance and cumulativity – without denying transitions.  
  4.  Maintains coherence with (2) and (4): Choosing partitions still involves convention *and* causal fidelity, but now higher-level units can be causal agents.  
  5.  Cost is moderate: It retreats from strict Dawkinsian gene-centrism but upholds the reality of transitions and hierarchical organization you value. Alternatives (e.g., dropping (7) or (5)) gut key substantive claims.  

  **Where my verdict rests on contested ground:** It rejects the view that replicator status *defines* the sole unit of selection/beneficiary, instead seeing evolutionary individuality (including beneficiary status) as contingent and emergent during transitions.
