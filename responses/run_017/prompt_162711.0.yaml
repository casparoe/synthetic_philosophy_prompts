prompt: |-
  I'm a political philosopher, and for the past eighteen months I've sat as one of five members — the only one without a legal or audit background — on the Integrity Panel of an international development foundation that funds small infrastructure and livelihood projects in a dozen countries, several of them in West Africa and South Asia, as well as in two English cities. Our founding instrument defines our remit in the familiar terms of the abuse of entrusted power for private gain, but nearly every case that reaches us is one in which no money has changed hands, or in which money or gifts have moved in ways that are locally entirely unremarkable. I've been trying to reconstruct the rule we are actually running, because I suspect the definition we cite does very little work. Our verdicts so far: a procurement officer who placed his brother-in-law's firm on a shortlist from which it then won a contract at a market rate for work that was well done — he declared the relationship and took no part in the scoring — corrupt; a district nurse who accepted small customary cash payments from patients' families after treatment had finished, which everyone in the district expected, which she could not have refused without giving offence, and which made no difference to whom she saw or how quickly — not corrupt; a municipal water engineer who sent two council workers and a council vehicle on a Saturday to repair a privately built borehole serving his own village — corrupt; a village water committee that presented the headman with a goat and a bottle of whisky before he authorised a well, as local custom requires, where the authorisation would plainly have been given anyway — not corrupt; and a mayor who steered a small public works programme preferentially towards firms in the wards that had voted for him, who gained nothing personally and made no secret of it — corrupt.

  The case on Monday's agenda is this. A regional grants panel funded by our foundation awarded four grants from a published rubric, scrupulously applied, and the four highest-scoring applications included three from one recently arrived refugee community. In the months before applications opened, one panel member — herself a member of that community and the unpaid chair of its mutual-aid society — ran free workshops on putting together a strong application, using her own time but our premises and our branding, and advertised them only through the mutual-aid society's own messaging groups, so that in practice only people from that community attended. She disclosed her position, never voted on any application from the society or from anyone she had coached, no money or gift ever moved, the scoring was clean, and no unsuccessful applicant has complained — although the unsuccessful applicants outside that community did not know the workshops existed. Our auditors have flagged it, and I have to vote.

  I can get one formulation to generate all five verdicts — something on the lines of office resources or discretion deployed for the advantage of a section rather than for the purposes of the office, irrespective of whether anyone consents or anything is monetised — and I can also get a rival formulation in terms of benefits distributed by connection rather than by publicly announced and impartially applied criteria to generate them, though I genuinely cannot tell whether that second rule reaches upstream of the formal decision or stops at the allocation itself. What I'd be grateful for is a recommendation rather than a survey: what should we rule here if we want to be consistent with ourselves, which of our five precedents is the closest analog and why, which of the competing rules that fit our track record predict what, which plausible rules the track record actually rules out, and — if our precedents genuinely underdetermine the case — what principle we would be adopting with each of the available rulings and how far that principle would then commit us elsewhere, since I am also worried that the verdicts above smuggle in a distinctly Western ideal of impersonal administration. Please also name the further case that would best discriminate between the rules you think are live, tell me which consideration or further fact would move you to the opposite ruling, and say where you think your reasoning is most likely to break down; flag any empirical assumption you are relying on that I could actually check before Monday. Something in the region of 700 to 900 words would be ideal.
reasoning: |-
  Okay, let me start by really understanding the user's situation. They're a political philosopher on an Integrity Panel for an international development foundation. Their main challenge is reconciling formal corruption definitions with real-world cases where cultural practices complicate the picture. The user has given several case examples and now faces a new case involving a grants panel member from a refugee community who ran exclusive workshops.

  First, I need to parse the core tension in their work. The founding definition focuses on "abuse of entrusted power for private gain," but the cases they handle rarely involve monetary exchange. Instead, they deal with cultural norms and indirect advantages. The user is trying to derive an implicit operational rule from past verdicts, which seems more about fairness and impartiality than personal enrichment.

  Looking at their precedents: 
  - The procurement officer was deemed corrupt despite declaring the relationship and fair pricing. 
  - The nurse accepting customary gifts wasn't corrupt. 
  - The water engineer using public resources for private benefit was corrupt. 
  - The village committee's customary gift to the headman wasn't corrupt. 
  - The mayor's political favoritism was corrupt.

  The new case involves a panel member from a refugee community providing exclusive application assistance. No money changed hands, scoring was clean, but access to resources was unequal. The key question is whether this constitutes corruption under their implicit framework.

  I notice two potential rules emerging from their precedents:
  1. Resources/authority used to advantage a group rather than official purposes (institutional integrity rule).
  2. Distribution based on connections rather than impartial criteria (procedural fairness rule).

  For the new case, the institutional integrity rule might lean toward "corrupt" because foundation resources were used exclusively for one group. The procedural fairness rule might lean "not corrupt" because the scoring itself was impartial. 

  The closest precedent seems to be the procurement officer case - both involve pre-decision advantages given to connected parties, even if the final decision was technically fair. But there's a cultural dimension: the workshops addressed systemic barriers for refugees, which parallels the nurse's case where cultural expectations mattered.

  What's really at stake here is whether their panel should prioritize strict impartiality or contextual equity. If they rule "corrupt," they risk imposing Western bureaucratic ideals; if "not corrupt," they might enable exclusionary practices. 

  A critical test case would be: what if the panel member had advertised workshops publicly but only their community attended? That would clarify whether the issue is the exclusivity or the resource use.

  The user's deeper concern about Western administrative ideals is crucial. Their precedents already show sensitivity to local context (goat/whiskey case). Consistency might require accepting that some group advantages are legitimate when redressing exclusion - but they'd need to define limits carefully.

  Before Monday, the user could check: Did other communities have comparable support structures? Was there intentional exclusion? The answer might tip the balance.
answer: |-
  Your case presents a profound tension between procedural purity and equitable access, with your precedents suggesting an **operational rule centered on institutional integrity rather than private gain**: *The use of institutional authority, resources, or privileged position to confer advantage that bypasses or pre-empts formally impartial processes, where that advantage is selectively accessible and undermines equal opportunity for beneficiaries*. This rule generates your five verdicts:

  1.  **Procurement Officer**: Used positional knowledge/access to place a connected firm on the shortlist (pre-empting impartial filtering), despite recusal later. *Corrupt*.
  2.  **District Nurse**: Customary gifts post-service don't bypass impartial care delivery or create unequal access. *Not corrupt*.
  3.  **Water Engineer**: Diverted public resources (labour, vehicle) for private/parochial benefit, bypassing standard allocation processes. *Corrupt*.
  4.  **Village Committee**: Customary offering tied to a non-discretionary decision (authorization "given anyway") doesn't circumvent an impartial process; it's ritualistic within the local decision framework. *Not corrupt*.
  5.  **Mayor**: Used public resources (works programme) to reward political support groups, bypassing needs-based or impartial allocation criteria. *Corrupt*.

  ### Recommendation for Monday's Case: **Corrupt**
  *   **Why?** The panel member used **foundation resources (premises, branding)** and her **privileged insider position** (panel member, mutual-aid chair) to create a **selectively accessible advantage** (workshops) *before* the formal process began. While scoring was impartial *during* the decision, the workshops effectively pre-filtered and advantaged one community, creating unequal starting points. This parallels the **Procurement Officer**: both created an upstream, connection-based advantage even if the final decision step was clean. The institutional resource use (premises/branding) mirrors the **Water Engineer's** misuse.
  *   **Closest Analog**: **Procurement Officer**. Both involve a gatekeeper using position/insight to give a connected group preferential preparation *before* the formal gate, despite recusal at the gate itself. The advantage stems from connection, not open access.
  *   **Competing Rules & Predictions**:
      *   *Rule 1 (Institutional Integrity - Advantaging a Section)*: Predicts **Corrupt**. Focuses on misuse of office resources/position for selective benefit, irrespective of final decision impartiality. Captures upstream advantage-creation.
      *   *Rule 2 (Distribution by Connection)*: Predicts **Not Corrupt** if narrowly applied only to the *final allocation decision* (scoring was clean). Predicts **Corrupt** if applied *upstream* to the *opportunity to compete effectively* (workshops created connection-based access to advantage). Your precedents (Procurement Officer, Mayor) suggest this rule *does* apply upstream – the advantage was in *accessing the opportunity*, not just the final prize.

  ### Rules Ruled Out
  *   **Strict "Private Gain" Focus**: Ruled out by Nurse (gifts accepted) and Committee (gift given) verdicts where gain/loss occurred but wasn't deemed corrupt due to context/lack of process circumvention.
  *   **"Monetary Exchange Required"**: Explicitly contradicted by all cases, especially Mayor/Procurement Officer.
  *   **"Local Custom Always Excuses"**: Ruled out by Mayor (political favouritism might be "customary" but deemed corrupt). Custom is contextual, not absolute.
  *   **"Formal Process Purity Suffices"**: Ruled out by Procurement Officer verdict. Upstream taint matters.

  ### Underdetermination and Principles at Stake
  Your precedents *do* underdetermine the case slightly, forcing a choice on the scope of "advantage" and "process":
  1.  **Rule "Corrupt"**: Adopts the principle that **equality of opportunity to compete** is integral to institutional integrity. Misusing position/resources to distort the *pre-competitive field* is corrupt, even if the final sprint is fair. This commits you to scrutinizing pre-decision resource allocation and access to preparation where significantly uneven and facilitated by insiders using institutional assets. *Risk*: Could stifle legitimate efforts to assist marginalized groups if assistance isn't universally accessible. *Western Bias Concern*: High risk. It prioritizes abstract procedural equality over substantive efforts to redress historical exclusion, potentially misreading community self-help as corruption.
  2.  **Rule "Not Corrupt"**: Adopts the principle that **only the final allocation decision** defines corruption, provided it is formally impartial and free of direct influence/private gain. Assistance provided externally, even using some resources, is permissible civil society activity. This commits you to allowing significant pre-decision advantage-building by connected insiders, provided they recuse from the final vote. *Risk*: Permits systemic favouritism and opaque networks to dominate access, undermining perceived and actual fairness. *Western Bias Concern*: Lower immediate risk, as it allows diverse community-support practices. However, it might ignore how insider-facilitated advantage replicates exclusion.

  **Recommendation leans "Corrupt"** because your precedents (Procurement Officer, Mayor, Water Engineer) consistently show concern for *how opportunities are created and accessed upstream*, not just the final gate. Ignoring this here creates a significant loophole.

  ### Discriminatory Case
  **Scenario**: A foundation employee (not a panel member), belonging to a marginalized community, uses *personal* time and resources (no foundation assets) to run grant-writing workshops *exclusively* for their community, advertised only internally. Applications from that community subsequently score highly and win grants via an impartial panel.
  *   **Rule 1 (Institutional Integrity)**: Likely **Not Corrupt**. No misuse of institutional position/resources; it's private civil society action, even if exclusive. Different from Monday's case (insider + resources).
  *   **Rule 2 (Distribution by Connection - Upstream)**: Might still see **Corrupt** if the *connection* (community membership) facilitating access to advantage is deemed problematic per se, even without institutional misuse.
  *   **Why Discriminatory?** It isolates the critical factor: the use of *institutional* position and resources by an *insider* to create exclusive advantage. If Monday's case is corrupt, this variant likely isn't under Rule 1. If both are corrupt, Rule 2 (upstream connection=corrupt) is dominant but risks overreach.

  ### What Would Change the Ruling?
  *   **Evidence of Universal Access Attempted**: If she advertised widely *outside* community channels but only her community attended, it shifts from selective provision to differential uptake – **Not Corrupt**.
  *   **Formal Foundation Policy/Sanction**: If the foundation *explicitly* encouraged such targeted capacity-building for underserved groups as part of its mandate, and the panel member acted within this remit – **Not Corrupt** (shifts action to institutional purpose).
  *   **Proof of Harm/Complaint**: While absence isn't determinative, credible evidence that *other qualified applicants were demonstrably disadvantaged* by missing the workshop would strengthen "Corrupt". Conversely, evidence that *only* this community had the need/capacity for such workshops might weaken it.

  ### Empirical Assumptions to Check
  1.  **Workshop Content**: Was it generic grant-writing advice applicable to *any* applicant, or tailored specifically to *this* foundation's rubric/priorities in a way others couldn't access? (Stronger for "Corrupt" if highly specific).
  2.  **Alternative Support**: Did the foundation offer *any* comparable application support (workshops, guides, helpdesk) accessible to *all* potential applicants? If yes, and hers was supplemental/community-specific, weaker for "Corrupt". If hers was the *only* support, stronger for "Corrupt".
  3.  **Branding/Premises Policy**: Does the foundation have a clear policy on using its branding/premises for external/non-sanctioned activities? Violation strengthens "Corrupt".
  4.  **Panel Member's Role**: Did her panel role give her *early or privileged insight* into the rubric/funding priorities used in the workshops beyond public information? (Stronger for "Corrupt").

  ### Where Reasoning Might Break Down
  The key vulnerability is **causation**. Did the workshops *cause* the success, or merely reflect a community that was already highly motivated/organized? The Procurement Officer case assumes causation (shortlisting = advantage). Here, the link is probabilistic. Ruling "Corrupt" assumes the advantage was decisive; ruling "Not Corrupt" risks ignoring how insider-facilitated capacity building distorts the field. Your precedent suggests you weigh the *creation of unequal opportunity* by insiders as harmful per se (Procurement Officer), regardless of absolute merit.

  **Proceed with "Corrupt"**, but explicitly acknowledge the tension with equity goals and urge the foundation to develop *formal*, transparent capacity-building support for marginalized groups to prevent this dilemma recurring. Your track record demands consistency on upstream advantage.
