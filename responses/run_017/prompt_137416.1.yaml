prompt: |-
  I have been turning over a question on my own, with no training in philosophy, and only later found out that it has a name: the special composition question. Given some things, when is there also a single further thing that they make up? I am not asking you to settle it. I want the specification first — the list of things any answer has to get right before it deserves to be taken seriously — because the only rule I have ever been able to believe in is a negative one, and I would like to know what test it has to pass.

  That rule is this: some things compose something only if that something can be broken. Not merely scattered or divided up, but damaged: the arrangement itself can go wrong while the parts that make it up go on existing. I keep the collection database for a small natural history museum and restore mechanical clocks on weekends, so this is not idle for me. A clock that has been dropped is spoiled in a way its gears are not; a bench covered with the same gears is not spoiled at all, only disassembled. That difference feels like the whole thing to me, and I would rather find out now whether it is a genuine constraint or just a prejudice of the workshop. So please treat the purpose as fixed: I want a criterion good enough to apply — one that tells a working person when a bunch of pieces has become one item with one record, one condition report, and one line on the insurance schedule, and when it has merely become a set of pieces — not a verdict I could only repeat.

  Here is what I would like from you.

  First, the cases: which situations must an answer handle, and, for each, what exactly it is about the case that makes it a requirement rather than an intuition someone happens to have. I have my own candidates and I want them stress-tested and supplemented: an ordinary artifact; a living thing and a colony of living things; a scattered collection, such as a specimen whose parts sit in two different buildings; a temporary pattern like a whirlpool or a traffic jam; something whose parts get replaced over time, like a river or a clock I have rebuilt piece by piece; something that looks like two things occupying one place at one time, like a restored pot and the pot before restoration; a plainly borderline case like a heap of gravel or a cloud; and nested cases — a cell, an organ, an animal, a colony — where I especially want to know whether an answer is required to be "nesting-closed," or whether it may say that composition stops somewhere on the way up.

  Second, the distinctions an answer must respect rather than collapse: composing something versus being nothing over and above the parts; existing versus doing any causal work of one's own, given that a composite's causal powers can look entirely inherited from its parts; composing at a time versus persisting through change; there being one thing here versus there being exactly one thing of a given kind here; a real answer versus a merely linguistic, conceptual, or interest-relative one; and the difference between the question of when things compose something and the question of what the parts of a thing are.

  Third, the constraints from outside philosophy: an answer should not imply that the inventories of ordinary life, of chemistry, and of ecology all systematically misdescribe the world, and it should not make facts about composition unknowable in principle or a matter of brute accident — though I want you to tell me whether that last demand is a real desideratum or only a rationalist preference, and likewise for the demand that the answer not shift with what anyone happens to care about that afternoon.

  Fourth, and this is the part I most want: take each requirement on your list and sort it into what any adequate answer genuinely owes us and what is only the preference of one camp. Is it a real requirement that the answer be nontrivial, falling between "nothing ever composes" and "everything always composes"? That it take the form of one general condition rather than a list of cases? That it contain no brute facts about which arrangements compose? That it be statable without reference to minds, interests, or language? That it vindicate most of what ordinary people and working scientists say? That it explain why coming apart seems to destroy things so much more readily than going together creates them?

  Fifth, if some subset of the requirements cannot be jointly satisfied, say so plainly and show me the tension. My suspicion is that the demand for a single general condition, the demand for no brute facts, and the demand to draw the line somewhere between everything and nothing cannot all be met at once, which would make the list itself the interesting result. Tell me which single requirement does the most work in excluding candidates, and which one I should abandon, and what abandoning it costs me. Does my breakability rule survive your list, and if it fails, which requirement kills it?

  If you have room at the end, one or two lines each on how the three standard families of answer — nothing ever composes, everything always composes, and composition only under some condition, whether a general one or brute — fare against the list; keep that brief, since the criteria are what I am paying for. Please write in American English, reason from the cases rather than from what anyone has written, and give me nothing in the way of reading lists, citations, or author names: I am working this out on my own in the evenings, and a table is welcome if it helps.
reasoning: |-
  Okay, the user is deeply engaged with the Special Composition Question but approaches it from a practical, hands-on perspective rather than an academic one. They work with museum collections and clock restoration, so their concern is tangible: when does a set of items become a single entity for cataloging, condition reporting, and insurance? 

  Their breakability rule feels central to them—they see composition as tied to whether an arrangement can be "spoiled" while parts remain intact. But they’re self-aware enough to question if this is a genuine constraint or just a workshop bias. They want rigorous criteria to test it against.

  The request is incredibly structured: five clear parts (cases, distinctions, constraints, requirement analysis, and trade-offs), all aimed at building a practical litmus test. They’re allergic to theory divorced from application—no citations, no jargon, just "what must an answer handle and why." 

  Hmm, their examples reveal their world: artifacts (clocks), living things (colonies vs. organisms), scattered items (specimens split across buildings), temporary patterns (whirlpools), replaced-parts objects (rivers/rebuilt clocks), overlapping entities (restored pots), and nested systems (cells to colonies). Each probes a different pressure point in composition. 

  Key tensions they sense:  
  - Can a rule be both general *and* non-arbitrary?  
  - Must it "nest" all the way up (from cells to colonies)?  
  - How to avoid making ordinary judgments (like "a clock is one thing") false or unknowable?  

  Their breakability rule is elegant but fragile. It handles artifacts and organisms well (a broken clock is ruined; scattered organs aren’t "damaged"). But it stumbles on temporary patterns (a dispersed traffic jam isn’t "broken"), scattered objects (a specimen in two buildings isn’t damaged), and brute composites (a heap can’t be "spoiled"). Worse, it implies consciousness-dependent damage for things like rivers.  

  The deeper conflict: their rule demands functional vulnerability ("spoilage"), but composition might not require function. And "damage" is observer-relative—does a collapsed star "spoil" the galaxy? This clashes with their own constraint that composition shouldn’t depend on interests.  

  For trade-offs: if they keep breakability, they sacrifice scattered objects and temporary things. If they drop it, they lose the core intuition that composition creates fragility. The cost? Without breakability, a clock is just gears until someone cares—which undermines their museum work.  

  In the end, their rule *almost* works for bounded, functional unities (clocks, hearts) but fails elsewhere. They might compromise: breakability as a *sufficient* but not *necessary* condition. But then the line-drawing problem remains... and that’s the SCQ’s curse.
answer: |-
  Below is a systematized breakdown of the requirements for any answer to the Special Composition Question (SCQ), structured around your five requests. I’ll reason directly from the cases and distinctions you’ve provided, focusing on practical applicability.  

  ### **1. Cases Any Answer Must Handle**  
  *(What makes each a requirement: it exposes a distinct pressure point for composition theories)*  

  | **Case**                  | **Core Challenge for SCQ**                                                                 |  
  |---------------------------|--------------------------------------------------------------------------------------------|  
  | **Ordinary artifact** (e.g., clock) | Must distinguish "arrangement" (composes) from "pile" (does not compose). Tests intuitive unity. |  
  | **Living thing vs. colony** (e.g., bear vs. coral) | Must explain why organisms are wholes but colonies *may* not be—without circularity. |  
  | **Scattered collection** (e.g., specimen split across buildings) | Can spatially disconnected parts compose one object? Challenges "location" as necessary. |  
  | **Temporary pattern** (e.g., traffic jam) | If composition occurs, why does it seem ephemeral? Tests persistence requirements. |  
  | **Replaced parts** (e.g., rebuilt clock, river) | Does identity survive part-replacement? Probes "essence" vs. mereological change. |  
  | **Overlapping entities** (e.g., restored pot + original shards) | Can two things occupy the same space? Tests whether composition implies uniqueness. |  
  | **Borderline case** (e.g., gravel heap, cloud) | Must explain vagueness without making composition arbitrary. |  
  | **Nested systems** (e.g., cell → organ → organism → colony) | Must decide if composition is "nesting-closed" (all levels compose) or stops at a level. |  

  **Key insight**: An answer need **not** be nesting-closed. It may deny composition at certain levels (e.g., "colonies aren’t wholes"), but must justify *why* without brute stipulation.  

  ---

  ### **2. Distinctions Any Answer Must Respect**  
  *(Collapsing these invalidates the answer)*  

  - **Composition ≠ "Nothing over and above"**: Composing a whole adds constraints (e.g., arrangement) beyond parts existing.  
  - **Existence ≠ Causal work**: A whole can exist without "new" causal powers (e.g., a clock’s timekeeping is from gears, but *it* keeps time).  
  - **Composition-at-a-time ≠ Persistence**: When parts compose now ≠ whether it survives part-replacement tomorrow.  
  - **One thing ≠ One kind**: A statue and its clay are one *thing* but two *kinds* of object. Don’t conflate.  
  - **Real vs. Conceptual/Interest-Relative**: Answers must avoid "composition depends on human interests" if claiming objectivity.  
  - **Composition Question ≠ Parts Question**: "When do parts form a whole?" is separate from "What are the parts of this whole?"  

  ---

  ### **3. External Constraints**  
  *(Non-negotiable for a serious answer)*  

  - **Preserve ordinary/scientific judgments**: Cannot imply museums, chemists, or ecologists are *systematically wrong* (e.g., denying organisms compose wholes).  
  - **Reject brute facts**: Composition facts shouldn’t be inexplicable ("it just does").  
  - **Knowability**: Facts about composition must be *in principle* knowable (not rationalist preference—unknowable facts are useless for your museum work).  
  - **Objectivity**: Composition cannot shift with "what someone cares about" (e.g., insurance shouldn’t hinge on an appraiser’s mood).  

  ---

  ### **4. Requirements: Genuine vs. Camp Preference**  

  | **Requirement**                     | **Genuine Debt?** | **Why?** |  
  |-------------------------------------|-------------------|----------|  
  | **Nontrivial** (≠ "never" or "always") | Yes | "Never" denies clocks; "always" makes traffic jams objects—both violate practical use. |  
  | **Single general condition**        | No | A principled list (e.g., "for living things: X; for artifacts: Y") suffices if consistent. |  
  | **No brute facts**                  | Yes | Brute facts make composition unpredictable (e.g., "Why is *this* heap one thing but not *that* one?"). |  
  | **Mind/interest/language-independent** | Yes | Required for objectivity (e.g., a specimen’s status can’t change if a curator quits). |  
  | **Vindicates ordinary judgments**   | Yes | Otherwise, your museum records are fiction. |  
  | **Explain asymmetry (destruction > creation)** | No | Explains intuition but not essential; may stem from temporal/causal direction. |  

  ---

  ### **5. Trade-offs and Your Breakability Rule**  

  - **Key tension**: You *cannot* simultaneously satisfy:  
    - (A) **Single general condition**  
    - (B) **No brute facts**  
    - (C) **Drawing a precise line** between everything/nothing.  
    → **Why?** If (A) and (B), the condition must be non-arbitrary. But no non-arbitrary condition cleanly handles *all* cases (e.g., organisms vs. colonies). Relax (A) to allow case-sensitive rules, or relax (C) to accept vagueness.  

  - **Most exclusionary requirement**: **No brute facts**. It kills theories that say "composition just happens when it does."  

  - **Does breakability survive?**  
    - **Fails** on:  
      - Scattered specimens (not "broken" if separated, but you’d catalog as one).  
      - Temporary patterns (a dispersed traffic jam isn’t "damaged").  
      - Borderline cases (a heap can’t be "spoiled").  
    - **Killed by**: Requirement to handle **scattered objects** and **objectivity** (breakability relies on functional norms, which are interest-relative).  

  - **Cost of abandoning breakability**: Lose the intuition that composition creates *vulnerability*. But a better rule might capture this (e.g., "functional unity").  

  ---

  ### **How Standard Answers Fare**  
  - **Nihilism** ("nothing composes"): Fails artifacts/organisms. Violates preservation of ordinary judgments.  
  - **Universalism** ("everything composes"): Makes traffic jams/scattered sand "objects." Unworkable for inventories.  
  - **Moderate Answers** ("composition under condition"): Must navigate trade-offs above. Best hope but risks brute facts or vagueness.  

  ---  
  **Final note**: Your breakability rule reflects a deep insight—wholes introduce *fragility*. A viable alternative might be: **"Parts compose a whole iff their arrangement is necessary for a persistent function."** This handles clocks (timekeeping), organisms (life), but excludes heaps (no function) and traffic jams (no persistence). It struggles with scattered specimens but may be adjustable. Test it against your cases.
