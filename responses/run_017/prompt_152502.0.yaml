answer: |-
  Here's your seminar-ready handout dissecting "laws don't govern, they just describe" — sharpened, categorized, and tested against your asymmetry worry and deviant-event case. I've preserved your core insights while adding precision and verdicts.

  ---

  **Dissecting "Laws Don't Govern, They Just Describe": Six Readings & Verdicts**

  | **Reading** | **Precise Claim** | **Verdict** | **Solves Asymmetry?** | **Deviant-Event Case Verdict** | **Notes** |
  |-------------|-------------------|-------------|------------------------|--------------------------------|-----------|
  | **1. Metaphorical Platitude** | Terms like "govern" or "obey" are anthropomorphic metaphors; no cosmic enforcer exists. | **Trivial** | ✗ No. Compatible with anti-Humean views (e.g., Armstrong, Dretske). | *N/A* (Modal-neutral) | Everyone accepts this. Doesn't touch the *explanatory* asymmetry. |
  | **2. Category Error** | Laws *are* linguistic descriptions (sentences, propositions), not mind-independent features of reality. | **Substantive & False** | ✗ No. Creates new problems. | Law falsified by deviation (if unstated). If unformulated, no law exists. | Collapses laws into epistemology. Fails for unformulated laws/laws with no instances (e.g., fundamental force never activated). |
  | **3. Ontological Supervenience** | Law-facts are nothing over and above the total mosaic of particular, non-nomic events (Humean core). No "governing" entities/properties. | **Substantive & Defensible (Humean)** | ✗ *Alone, no.* Just restates Humeanism. Needs supplementation (e.g., Reading 6). | Depends on Humean theory: Strict Regularity → falsified; Best System → likely still holds. | Addresses ontology, not explanation. Asymmetry worry *starts here*. |
  | **4. Epistemic Direction** | Laws are *inferred from* instances (data → generalization). Therefore, they can't *explain* those same instances without circularity. | **Confused/False** | ✗ No (and confused). | Law falsified if deviation is data. | Explanation ≠ inference. Laws explain *types* of events, not token inferences. Generalizations *can* explain data supporting them (e.g., Newton's laws explain planetary motion *and* Kepler's data). |
  | **5. Deflationary Modality** | Laws carry no objective necessity or counterfactual force. "Law" = well-confirmed universal regularity. | **Substantive & Defensible (Hard Humean)** | ✗ No (and exacerbates worry). | Law falsified by any deviation. | Rejects nomic necessity entirely. Makes laws fragile; struggles with *why* we expect regularity. Asymmetry harder: why privilege one description? |
  | **6. Explanatory Unificationism** | Laws "explain" by compressing many particulars into an efficient, systematic representation (e.g., Best System Analysis). Explanation is pragmatic/economic, not causal. | **Substantive & Defensible (Sophisticated Humean)** | **✓ Yes** (if accepted) | Law still holds if deviation is rare/isolated anomaly. Best System tolerates minor exceptions for simplicity. | **The only reading that directly addresses asymmetry.** Explains why laws are "prior" in explanation: they organize the mosaic efficiently. Needs argument (e.g., Lewis, Loewer). |

  **Key Takeaways on the Asymmetry Problem & the Slogan:**
  1. **Only Reading 6 dissolves your worry** – It redefines explanation as unification/compression, making asymmetry pragmatic (the law-file is smaller than the instance-files). *But* this is a substantive theory of explanation needing defense.
  2. **Readings 1-5 fail to resolve asymmetry:**
     - 1 is trivial.
     - 2 is false and irrelevant.
     - 3 is ontological bedrock but silent on explanation.
     - 4 confuses inference with explanation.
     - 5 makes laws too weak to explain robustly.
  3. **The Slogan's Power = Ambiguity:** It rhetorically conflates Readings 1 (uncontroversial) with 3 or 6 (contentious). Nodders likely heard 1 or 3; your worry targets 6.
  4. **"Describes" is the Trouble:** It equivocates between:
     - *Linguistic act* (Reading 2: false),
     - *Metaphysical status* (Reading 3: Humean ontology),
     - *Functional role* (Reading 6: compression/summarizing).
  5. **Your Test Case is Decisive:** It shows Readings 5 ("strict summary") and 6 ("best compression") give different answers. Governing views (anti-Humean) give a third. The slogan *doesn't* specify which "describe" is meant.

  **What You Missed?** A potential **Reading 7: Pragmatic Normativity** ("Laws describe *what we should expect*"). But this is likely subsumed under 5 or 6. Your framework covers the core territory well.

  **Seminar Punchline:** The speaker's slogan only dismisses your asymmetry worry if it *assumes* Reading 6 (explanation-as-compression). Since they offered no argument for that view, their reply was question-begging. The platitude (Reading 1) is true but irrelevant; the substantive Humean move (Reading 6) needs justification against rival theories of explanation.

  ---
  **Casual Bottom Line:** Yeah, he got applause by sounding profound while dodging. His line *could* mean something deep (Reading 6), but without backing it up, it's just a slick way to say "I'm a Humean" (Reading 3) while pretending the hard problem doesn't exist. Your test case exposes where the real work is. Thursday’s class will nail it.
