prompt: |-
  Hi — I write about science and ideas for a living, and I've been banging my head against a piece about the 'man of his time' defence for about a week, mainly because my own gut reactions don't add up to anything I can say out loud. So here are my verdicts, and I'd like the principle behind them, if there is one. A Roman senator who owns slaves: I barely blame him at all. A Virginia planter in the 1790s who owns slaves: I blame him plenty, even though it's the same institution — the difference for me seems to be that by then the language of universal rights was in the air and there were actual abolitionists you could have listened to. Jefferson: no defence from me, and I actually score him slightly worse than a neighbour who did the same things, because he wrote the words and by most accounts had private doubts; and yet I don't want his statue down, I want the plaque rewritten, which sits oddly with how little I care about the Roman. Columbus: no defence whatsoever — he was a governor whom contemporaries accused of serious brutality, the Crown sent someone out who arrested him and shipped him home in 1500, and I'm completely fine watching his statues come down, even though the scale of what Jefferson did is arguably far worse, so my reactions there are backwards on the numbers. Churchill: I shrug at a lot of the race-and-empire material, but I don't shrug at the wartime Bengal famine, and I count it against him more that he kept arguing for empire after the wind had clearly turned — someone who merely goes along with a settled norm and someone who turns into that norm's loud defender once it's contested do roughly the same acts, and I score them very differently. A hypothetical: a nutrition researcher in the late '60s quietly takes money from a sugar lobby to argue that the evidence linking sugar to heart disease is shaky; his peers did it, professional norms more or less permitted it, and he probably half believed it. I blame him outright and give him none of the discount I gave the Roman, and I can't tell you why those two come apart. And looking forward: I get genuinely defensive when people say future generations will judge us over factory farming the way we judge the past, and I want to say that would be unfair — but I refuse the same generosity backwards, and that asymmetry bugs me.

  My own draft, which I'm pretty sure is broken: you get a discount when (a) nobody in your information environment was saying the thing was wrong in a way you could actually have heard, (b) you didn't double down once people started saying it, and (c) the bad thing isn't what your celebrated achievement actually consists in. Please give me a principle, or two or three rival candidates, stated tightly, with the case that forces each clause; then tell me what it says about cases I haven't listed — a revered mid-century scientist whose famous result can only be extracted from data from an experiment that was already considered unethical at the time, someone who was *ahead* of their time (do they get credit symmetric to the blame I hand out?), a living eighty-five-year-old who said awful things in 1974 and never walked them back, and a statue that turns out to have been erected in the 1890s versus an identical one erected generations later as deliberate pushback, where I suspect I'm judging the people who put it up and not the person at all. Then: which of my verdicts your principle can't save, and where your own reasoning is weakest — what argument, or what kind of case, would make you switch. No reading lists or citations please, I want the argument itself. Oh, and for what it's worth, I notice I'm definately not neutral here: I want to come out still being allowed to blame people.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're a science and ideas writer struggling with the "man of his time" defense across different historical figures. The key issue is their inconsistent moral judgments: they blame some historical figures more than others despite similar actions, and this inconsistency bothers them. They want a coherent principle to explain their reactions.

  First, I need to identify the patterns in their examples. They barely blame the Roman senator because slavery was normalized then, but they blame the 1790s Virginia planter because abolitionist ideas were emerging. Jefferson gets extra blame for hypocrisy since he wrote about universal rights but owned slaves. Columbus is condemned for brutality even acknowledged by contemporaries, while Churchill's later defense of empire is criticized more than if he'd just followed norms. The nutrition researcher taking sugar lobby money is blamed outright, unlike the Roman. And they feel defensive about future judgments on factory farming.

  Their draft principle has three conditions: (a) no one was saying it was wrong in your info environment, (b) you didn't double down when criticism arose, (c) the bad thing isn't integral to your achievement. But there are contradictions—like the Roman senator meets all three yet they blame the nutrition researcher who might meet (a) and (b).

  I should consider moral proximity and cultural distance. The Roman is farther in time, so less blame, but Jefferson is closer. But that doesn't explain the nutrition researcher case—1960s isn't ancient history. Maybe it's about available alternatives? The Roman had no real alternative societal structure, but the 1790s planter did, with abolitionist movements. Jefferson had access to criticism and expressed doubts, making his actions worse. Columbus was directly called out by contemporaries, so no defense. Churchill actively defended empire when it was declining, which is different from passively accepting norms.

  For the nutrition researcher, even if peers did it, the scientific method should prioritize truth, so taking money to skew evidence is a breach of professional ethics. That's different from societal norms—science has a built-in duty to objectivity. Whereas the Roman's society didn't question slavery structurally. 

  Future factory farming: the user feels defensive because they see current awareness but systemic constraints. They might believe that while we know it's bad, alternatives aren't fully viable yet, unlike past figures who had clear choices. The asymmetry comes from not extending the same understanding backward, which might be because hindsight reveals clearer alternatives than we perceive in our time.

  Principles could be: Moral Agency (awareness of wrongdoing), Alternatives Available (could they act differently?), and Hypocrisy/Leadership (did they uphold principles they professed?). For the scientist with unethical data, if the experiment was already considered unethical, they might get less blame if they didn't conduct it but used existing data. If they commissioned it, more blame. The person ahead of their time gets credit, but it's not symmetric because preventing harm is different than perpetuating it. The 85-year-old who never recanted: if norms changed and they ignored it, they might be blamed more, similar to Churchill. Statues erected in the 1890s vs later as pushback: the intent matters. The later one is a deliberate endorsement of outdated values, so criticizing the erectors makes sense.

  Weaknesses: The nutrition researcher case tests the alternatives principle—norms permitted it, but maybe the breach of scientific integrity is inherent. Also, future judgments might not account for current systemic barriers, leading to unfair hindsight. The user wants to blame people, so the principle should allow for culpability when there's awareness and choice, even in the past.
answer: |-
  Here's a distilled set of rival principles derived from your intuitions, designed to be tight and testable against your cases. The core tension is between **historical contextualism** (judging by the norms *of* the time) and **moral agency** (holding people accountable to accessible ethical truths, regardless of era). Your draft points toward agency, but needs refinement:

  ### Principle 1: The **Accessible Critique + Non-Defiance Standard**  
  *You get reduced blame if (a) no coherent moral critique of the act was reasonably available in your epistemic environment AND (b) you did not actively defend/expand the practice once such a critique emerged within your lifetime.*  

  - **Why?** Distinguishes between ignorance (Roman senator: no abolitionist movement, no "rights" framework) vs. choice (Virginia planter: Paine, Quakers, and Enlightenment debates *were* accessible). Explains Columbus (contemporaries *did* condemn him – critique *was* accessible) and Churchill (defended empire *after* anti-colonial movements gained force).  
  - **Saves:** Roman (a+b satisfied → low blame), Jefferson (b failed: he doubled down on slavery despite critiques *and* his own words → high blame), 1960s researcher (a failed: scientific ethics *did* condemn undisclosed conflicts of interest; he ignored accessible norms → no discount).  
  - **Fails:** Your discomfort with judging the Roman at all. If *no* critique was accessible, why blame him *even slightly*? Principle 1 allows for residual blame if the act is intrinsically horrific (slavery), suggesting a floor for moral outrage.  

  ### Principle 2: The **Moral Proximity Principle**  
  *Blame scales with the actor’s temporal/cultural distance from the *articulation* of the ethical principle they violated.*  

  - **Why?** Explains the Roman/Virginia gap (centuries from Enlightenment universalism) and Jefferson vs. his neighbor (Jefferson *articulated* the principle he violated → maximal proximity/hypocrisy). Explains Columbus (contemporaries articulated critiques → he’s "close" to condemnation).  
  - **Saves:** Future factory farming defense (we’re distant from a future consensus → unfair to judge harshly *yet*). Statues: Erected in 1890s (distant from modern critique → judge mildly) vs. identical statue in 1950s (closer to civil rights era → judge erectors harshly as defiance).  
  - **Fails:** 1960s researcher (sugar/heart disease link was debated *at the time* – critique existed proximately → blame justified). But why no discount? Principle 2 struggles if the critique existed but was niche (was it "proximate enough"?). Also struggles with Bengal Famine (Churchill was proximate to critiques of colonial neglect → high blame, but you "shrug" at other empire acts – inconsistency?).  

  ### Principle 3: The **Role-Dependent Culpability Principle**  
  *Blame intensifies with (a) power to change norms/outcomes, (b) hypocrisy relative to one’s own stated ideals, or (c) centrality of the wrong to the person’s celebrated legacy.*  

  - **Why?** Jefferson (a: Founding Father power, b: hypocrisy on rights, c: slavery stains his "liberty" legacy → high blame). Columbus (a: Governor with power, c: brutality *is* his governance legacy → no defense). Churchill (b+c: Defender of freedom *while* enabling famine/empire → selective blame). The Roman? Low on (a) (couldn’t end systemic slavery), no (b), and (c) irrelevant → low blame.  
  - **Saves:** Mid-century scientist using unethical data: If they *conducted* the experiment (high a+c → blame), vs. *used* existing data passively (lower a → less blame). The 85-year-old who never recanted: High (b) (hypocrisy if current ideals) and possibly (a) (influence?) → blame persists. Person "ahead of their time": Credit comes from (b) (acting *against* norms *for* accessible ideals), not symmetry (preventing harm > enabling it).  
  - **Fails:** 1960s researcher (low power? niche field? → might deserve less blame, but you blame him outright). Your gut on factory farming (we have power/knowledge? → Principle 3 suggests *high* future blame!).  

  ### Where Your Verdicts Clash With The Principles
  1.  **Nutrition Researcher vs. Roman Senator:**  
      - Principle 1 *saves* this (accessible scientific ethics existed for the researcher).  
      - Principle 2 *strains* (both are "close" to articulated critiques? Sugar critique was emerging but not dominant).  
      - Principle 3 *saves* (researcher betrayed core role obligation – scientific integrity).  
      **Weakness:** What if 1960s norms *did* silently permit industry funding? Principle 1/3 hinge on whether a critique *was* accessible/ignored. If truly not, your blame seems inconsistent.

  2.  **Future Judgments on Factory Farming:**  
      - Principle 1 *saves* your defensiveness (no dominant *practical* alternative/critique *yet* fully realized → discount applies).  
      - Principle 2 *saves* it (we’re distant from future consensus).  
      - Principle 3 *condemns* it (we have knowledge, power, and alternatives exist → high future blame deserved).  
      **Argument to Switch:** If shown that the ethical critique (animal sentience, environmental harm) and viable alternatives (lab meat, plant-based systems) *are* as accessible/actionable *now* as abolitionism was to Jefferson → removes discount. Your asymmetry bugs you because Principle 3 is likely correct here.

  3.  **Columbus vs. Jefferson (Scale vs. Blame):**  
      - Principle 1 (contemporaries condemned Columbus → worse than Jefferson’s peers? Jefferson defied his *own* words).  
      - Principle 2 (Proximity: Columbus closer to medieval brutality norms? Jefferson closer to Enlightenment ideals?).  
      - Principle 3 (Columbus’s brutality *is* his core legacy; Jefferson’s is more complex).  
      **Weakness:** Your reaction highlights an **outrage factor** – active, witnessed cruelty (Columbus) often *feels* worse than systemic, normalized evil (Jefferson), even if the latter caused more suffering. Principles struggle to capture this visceral element.

  ### The Core Tension & How to Keep Blaming
  Your draft’s clause (c) ("the bad thing isn't what your celebrated achievement actually consists in") is powerful and preserved in Principle 3. **The synthesis that best saves your verdicts is:**  
  **Blame is mitigated by *genuine* epistemic limitations (no accessible critique), but *intensified* by power, hypocrisy, defiance of emerging critiques, or the centrality of the wrong to one’s moral identity/legacy.**  

  This lets you blame:  
  - **The Virginia planter:** Critique was accessible (abolitionism), power existed.  
  - **Jefferson:** Hypocrisy + power + centrality to ideals.  
  - **Columbus:** Contemporaries condemned him → critique accessible; brutality central to role.  
  - **Churchill (on Bengal):** Power + defiance of emerging norms (famine relief pleas existed).  
  - **The Researcher:** Betrayal of role-specific ethics (objectivity) accessible at the time.  

  It *doesn’t* force you to blame the Roman (no critique, no power to change system). It explains statue nuance (rewrite Jefferson’s plaque – his *legacy* is complex; tear down Columbus – brutality *is* his legacy; judge *erectors* of later statues – defiance motive). Future generations *will* judge us, but fairly only if they acknowledge our *current* epistemic/practical constraints (Principle 1 + 2). Your asymmetry arises because you *feel* those constraints now but see past constraints as less binding in hindsight. The principle demands rigor: if a critique *was* accessible and actionable *then*, blame is deserved. That’s how you keep blaming – by showing the path not taken *was* visible at the time.
