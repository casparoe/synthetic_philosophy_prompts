prompt: |-
  I run the grants side of a small health-research foundation — two rounds a year, ~150 applications each, every one read by 4–6 external reviewers who fill in a score sheet, and then a panel of five of us meets on Zoom for about fifteen minutes per application to make a yes/no call. Reviewers are volunteers so I can't just keep adding more of them, I've got no statistician on staff, the panel chair has to be able to sign off on whatever we do, and anything I change has to be explainable to our board in plain english and fit in a spreadsheet. I also can't spend more than a couple of hours per round messing with process.

  The thing I keep coming back to is the Condorcet jury theorem — the bit about a lot of imperfect-but-better-than-chance voters beating one careful one, and the nasty flip side where if each voter is worse than chance then adding more of them makes the group worse, not better. I want that turned into something I can actually run, not just admire.

  So: write me a decision procedure. The questions to ask in order (some once per round when I set the process up, some per application when the panel is stuck), what counts as a good enough answer to each, where the procedure just stops with a no, and where it hands the decision over to a person because the disagreement is about what we value rather than about what's true.

  It has to settle at least these:

  - How many reviewers, and when adding one more reviewer is worth it versus spending the same effort on making reviews better-informed (paying a second reader from the *other* field, or a fifteen-minute call with the applicant to clear something up).
  - Whether reviewers should see each other's draft reviews before scoring. I have a feeling sharing helps them catch real problems but wrecks the independence the theorem wants, and I have no idea how to tell which effect is bigger. Someone told me that once reviewers' errors are correlated, accuracy stops climbing and flattens out somewhere short of certainty no matter how many people you pile on — if that's even roughly right, tell me what I'm supposed to *do* with it.
  - Our panel discusses first and then votes. Should each of us write down a private vote before anyone talks?
  - What threshold: simple majority, two-thirds, unanimity, or our current unwritten rule that one "strong reject" kills an application even when the other four are enthusiastic (people are scared of being the one who waved through a dud). I suspect the veto rule is just a very high threshold wearing a disguise, and I want to know what it's costing us and what would be better.
  - Reviewers score three separate things — importance, methods, feasibility — and then we aggregate. I've noticed the panel can be majority-yes on each of the three and majority-no overall, or the other way round. Should we vote on the criteria and combine, or vote on the overall call? Which is less likely to be wrong?
  - What to do when the split is factual versus when it's about risk appetite (a safe boring project versus a long shot), and when the right move is to hand the decision to one named person instead of the group.
  - Some estimate of our reviewers' actual accuracy. We have outcome data for funded projects, obviously not for rejected ones; the only rejected applications we can check are about twenty that got picked up by another funder and we can see how they did. Tell me honestly what I can and cannot infer from that, and what to do when I can't get a number at all.

  Then apply the whole thing to three cases: (1) a solid, unexciting application that everybody mildly likes; (2) an interdisciplinary application where all our reviewers sit on one side of the discipline and I genuinely worry their accuracy on it is below chance; (3) an application where two reviewers say the statistical plan is fine and three say it's broken, and nobody can settle it without seeing the raw data.

  Please be straight about which steps are really just my judgement dressed up as procedure, and which parts of the theorem I'm quietly violating. And give me at least one worked case where the honest output of the procedure is something I won't like — ideally something our board would probably refuse to approve — and say what you'd do then. And please don't give me a reading list or footnotes; I want the reasoning, not pointers to papers I can't get to.
reasoning: |-
  We are designing a decision procedure for a grant review panel based on the Condorcet Jury Theorem (CJT) and practical constraints. The CJT states that for a group of independent voters, each with an individual competence (probability of being correct) greater than 0.5, the probability of a correct majority decision increases with the group size and approaches 1 as the group becomes large. Conversely, if individual competence is below 0.5, adding more voters makes the group decision worse.

  Given the constraints (volunteer reviewers, no statistician, must be explainable and spreadsheet-friendly, limited time), we need a step-by-step procedure that addresses the listed issues.

  The procedure will be divided into:
  A. Setup steps (once per round or as needed)
  B. Steps per application (when the panel is stuck or for every application if desired)
  C. Handling specific cases

  ---

  **A. Setup Steps (once per round):**

  1. **Determine the default number of reviewers:**
     - Since you have 4-6 reviewers per application and around 150 applications, we must balance workload and accuracy.
     - The CJT suggests that with independent reviewers of competence >0.5, more reviewers are better. However, with correlated errors (which we expect due to shared biases or information), the benefit flattens.
     - **Rule of thumb:** Use 5 reviewers per application as a baseline. Why 5? 
       - With 5 independent reviewers of competence 0.7, the probability of a correct majority decision is about 0.84 (by binomial calculation). 
       - But since errors are correlated, we may get less. However, 5 is a manageable number and a common practice.
     - **When to add a sixth reviewer?**
       - When the application is interdisciplinary and you suspect that the existing reviewers might have below-chance accuracy on one aspect. 
       - Also, if the application is borderline (e.g., 3 weak accepts and 2 weak rejects) and you have the capacity, adding a sixth might break the tie. But note: adding a reviewer costs time and might not be worth it if the existing reviews are already highly correlated.

  2. **Decide whether reviewers should see each other's draft reviews:**
     - **Problem:** Sharing reviews can improve accuracy by catching errors but reduces independence and may introduce correlation in errors (e.g., groupthink).
     - **Recommendation:** Do not share draft reviews before scoring. Why? 
       - The CJT requires independence. If reviewers are influenced by each other, the CJT assumptions are violated and the group decision may not improve (and might even get worse if the initial reviews are poor). 
       - Instead, after initial scoring, allow reviewers to see each other's reviews and revise if they wish (but note: this might be too late for independence). However, for the initial score, keep them blind.
     - **Alternative for complex cases:** For applications that are particularly complex or interdisciplinary, you might assign two reviewers from each field and let them discuss among themselves (within their field) before scoring. Then aggregate the scores from both fields. This maintains some independence between fields.

  3. **Determine the voting method for the panel:**
     - **Problem:** The panel currently discusses first and then votes. This can lead to groupthink and dominance by strong personalities.
     - **Recommendation:** Use a two-step process:
       - Step 1: Each panelist writes down a private vote (yes/no) before any discussion.
       - Step 2: Then discuss and have a final vote (which can be public or private, but private is better to avoid social pressure).
     - **Why?** The initial private vote captures independent judgments. The discussion can then address factual errors or new perspectives, and the final vote incorporates the group's collective wisdom. The panel can then consider both votes.

  4. **Set the decision threshold:**
     - **Current situation:** Unwritten veto rule (one strong reject kills the application) is equivalent to requiring unanimity for approval? Not exactly: it allows one reject to overrule multiple accepts. This is a high threshold for approval (like requiring 5 out of 5).
     - **CJT insight:** A unanimity rule (or veto) is optimal only when individual competence is very high (above 0.5) and the cost of a false positive (funding a bad project) is extremely high. But note: with 5 panelists of competence 0.7, the probability of a bad project being approved by unanimity is very low, but the probability of rejecting a good project is high (because it only takes one mistake to reject). 
     - **Recommendation:** Use a majority rule (at least 3 out of 5 for a 5-member panel) for the final vote. Why?
       - Majority rule maximizes the probability of a correct decision when individual competence is >0.5 and independent.
       - The veto rule is too conservative and leads to many false rejections. For example, if each panelist has a 0.7 chance of being correct, then the chance that a good project is rejected by a single veto (i.e., at least one panelist incorrectly rejects) is 1 - (0.7)^5 ≈ 0.83 (if we assume that for a good project, each panelist has 0.7 chance of voting yes) but wait: actually, the chance that a good project is approved by a veto rule (unanimity) is (0.7)^5 ≈ 0.168, so the rejection rate for a good project is 1-0.168=0.832. This is too high.
       - Instead, a majority of 3 out of 5 has a much higher chance of approving a good project (about 0.84 for competence 0.7) and a low chance of approving a bad one (about 0.16 for a bad project, assuming competence 0.7 in recognizing a bad project as reject).
     - **What about the veto fear?** If the cost of a false positive is very high, you might set a higher threshold (e.g., 4 out of 5). But note: the veto rule is a special case of a supermajority. We recommend a simple majority for the final vote, but if the panel is concerned about duds, use a 4/5 supermajority. However, the veto rule (one reject kills) is equivalent to requiring 5/5 for approval, which is too strict.

  5. **Aggregation of scores on criteria (importance, methods, feasibility) vs. overall:**
     - **Problem:** Majority on each criterion does not imply majority on overall, and vice versa.
     - **Recommendation:** Let reviewers give an overall recommendation (yes/no) in addition to scores on criteria. Then use the overall recommendation for the CJT-style voting. Why?
       - The criteria scores are inputs to the overall judgment. The overall vote captures the reviewer's holistic judgment, which may include trade-offs (e.g., high importance but low feasibility might lead to a no). 
       - The panel should vote on the overall call (using the majority rule as above) because that is the decision you need to make.
     - **But note:** If the criteria scores are used to compute an average and then threshold, that is a different method. We recommend against that because it doesn't leverage the CJT. Instead, use the overall vote.

  6. **Estimating reviewer accuracy:**
     - **Data available:**
       - Outcome data for funded projects (success/failure?).
       - For rejected projects, only about twenty that were funded by others and we see their outcomes.
     - **Challenges:** 
       - The funded projects are a selected sample (only those approved by your panel). You cannot observe the counterfactual (what if you had funded the rejected ones?).
       - The twenty rejected-but-funded-elsewhere projects are a small and non-random sample (they were rejected by you but picked by others, so they might be of higher quality than the average rejected).
     - **What you can do:**
       - For the funded projects, track their outcomes. If a project is successful, it suggests that the panel's yes vote was correct. If it fails, it suggests a false positive.
       - For the twenty externally funded projects, if they are successful, it suggests a false negative by your panel.
       - However, the sample is small and biased. So, you can get a rough estimate of:
          - False positive rate (FPR) = (number of funded projects that failed) / (total funded)
          - False negative rate (FNR) = (number of rejected projects that were successful elsewhere) / (total rejected that were picked elsewhere) ... but note the denominator is only the ones that got picked, not all rejected.
       - The overall accuracy of the panel (on funded projects) is (number of successful funded projects) / (total funded). But this is only for the approved projects.
     - **Recommendation:** 
       - Track the success rate of funded projects. If it is high (say above 80%), then the panel's positive decisions are reasonably accurate. 
       - For false negatives, use the twenty projects: if many of them are successful, it suggests you are being too conservative. 
       - However, without a large random sample of rejected projects, you cannot get a true accuracy rate. 
       - **Practical step:** Assume that the panel's individual accuracy is above 0.5 (if the funded success rate is high and the externally funded rejected projects are not overwhelmingly successful). If the funded success rate is low (say below 60%) or if the externally funded rejected projects have a high success rate (say above 80%), then you may have a problem. In that case, consider retraining reviewers or adjusting the voting threshold.

  **B. Per-Application Steps (when the panel is stuck or for every application):**

  1. **Initial Review:**
     - Collect the independent reviews (scores on criteria and overall yes/no) from 5 reviewers (or 6 if added for interdisciplinarity or tie-breaking).

  2. **Panel Review:**
     - Before the meeting, each panelist receives the application and the reviews. They form a preliminary overall vote (yes/no) privately.

  3. **Panel Meeting:**
     - Step 1: Each panelist states their preliminary vote (without discussion) to the chair. The chair records the votes.
     - Step 2: The panel discusses the application, focusing on areas of disagreement and factual issues.
     - Step 3: After discussion, each panelist votes again (privately) on the overall recommendation (yes/no).

  4. **Decision Rule:**
     - Apply the majority rule to the final vote (e.g., 3 out of 5 for yes means fund).
     - **Exception:** If there is a strong reject (defined as a reviewer who not only rejects but flags a critical flaw that is factual and verifiable), then the panel should revisit that flaw. If the flaw is confirmed (e.g., an error in the statistical plan that makes the project infeasible), then the application is rejected regardless of the vote. However, this should be rare and based on objective facts, not just a difference in judgment.

  5. **Handling Disagreements:**
     - **Factual Disagreements:** If the split is due to a factual question (e.g., whether a statistical method is appropriate), the chair should attempt to resolve it by consulting an external expert (if time allows) or by requesting clarification from the applicant. If unresolved, the application may be deferred or rejected (because uncertainty about facts increases risk).
     - **Risk Appetite Disagreements:** If the split is about risk (safe vs. long shot), the panel should vote. The majority rule reflects the foundation's risk tolerance as set by the panel. If the foundation has a stated preference for high-risk/high-reward, then the panel should be instructed to factor that in. If the disagreement is extreme, the chair might make the final call based on the foundation's mission.

  6. **When to Delegate to an Individual:**
     - If the disagreement is about a value judgment that cannot be resolved (e.g., whether a project is within the foundation's mission) and the panel is split, the chair should decide. 
     - Also, if the panel is stuck on a factual issue that cannot be resolved in time, the chair might make the call based on the preponderance of evidence.

  **C. Applying to Cases:**

  **Case 1: Solid, unexciting application that everybody mildly likes.**
  - Reviews: 5 reviewers, all rate overall as weak yes. Preliminary panel votes: 5 weak yes.
  - Discussion: No strong objections. Final vote: 5 yes.
  - **Decision:** Fund (majority yes).

  **Case 2: Interdisciplinary application where all reviewers are from one side.**
  - Setup: Because of the concern about below-chance accuracy, you added a sixth reviewer from the other field (so 4 from field A, 2 from field B). 
  - Reviews: 
    - Field A reviewers: 3 strong reject, 1 weak reject. 
    - Field B reviewers: 2 strong accept.
  - Preliminary panel votes: The panelists see the reviews. They might split according to their own fields. But let's assume the panel is diverse? The procedure requires the panel to have expertise too. 
  - **Problem:** The reviewers from field A might have below-chance accuracy for the interdisciplinary aspects. 
  - **Procedure:** 
    - The chair notes the strong disagreement and the interdisciplinary nature. 
    - The panel discussion should focus on the reasons for rejection from field A and acceptance from field B. 
    - If the rejection reasons are about feasibility in field A (which might be valid) and the acceptance is about importance in field B, then the panel must decide on the trade-off. 
    - The panel votes: Suppose 3 reject (relying on field A) and 2 accept (relying on field B). Then the application is rejected (majority reject). 
    - **But wait:** What if the field A reviewers' accuracy is below 0.5? The CJT says adding more reviewers from the same field would make it worse. However, we added reviewers from field B. The panel vote might still be dominated by the majority field. 
  - **Alternative:** In setup, we decided that for interdisciplinary applications, we would require at least one reviewer from each field and then consider the reviews by field. We might then require consensus between fields? But that's not CJT. 
    - **Revised procedure for this case:** In the setup for interdisciplinary applications, assign two reviewers from each field and require that both fields have at least one yes for the application to be considered. Then, the panel can vote. However, this is a different rule. 
    - Given time constraints, we stick with the overall vote. The panel must use their judgment to weigh the reviews. 
  - **Outcome:** The application is rejected. The foundation might miss a good project if field A reviewers were biased. This is a risk.

  **Case 3: Statistical plan disagreement.**
  - Reviews: Two reviewers say the statistical plan is fine, three say it's broken. The overall recommendations: 2 yes, 3 no.
  - Panel preliminary vote: Likely 2 yes, 3 no.
  - Discussion: The panel focuses on the statistical plan. They cannot resolve it without raw data (which is unavailable). 
  - **Procedure:** 
    - This is a factual disagreement. The chair should attempt to get an independent statistician's quick opinion (if time and resources allow). If not, the panel must decide based on the preponderance of evidence. 
    - If the three reviewers who said it's broken have statistical expertise and the two who said it's fine do not, then the panel might lean towards reject. 
    - Final vote: Without new information, the final vote might remain 3 no, 2 yes. 
    - **Decision:** Reject. 
    - **Why?** The burden of proof is on the applicant. Uncertainty about a critical flaw should lead to rejection because funding a project with a broken statistical plan is a waste.

  **Worked Case with Unpopular Output:**

  **Case:** An application that is high-risk, high-reward. 
  - Reviews: 3 reviewers say no (because of high risk and low feasibility), 2 say yes (because of high importance and potential impact). 
  - Preliminary panel vote: 3 no, 2 yes. 
  - Discussion: The panel agrees it's high-risk. The foundation's mission does not specify risk tolerance. 
  - Final vote: 3 no, 2 yes. 
  - **Decision:** Reject. 
  - **Why you might not like it:** The foundation might miss a breakthrough. 
  - **What the board might say:** They might feel the foundation should take more risks. 
  - **What to do then:** The procedure worked as designed. The issue is that the foundation's risk appetite is not aligned with the panel's. 
    - **Solution:** Clarify the foundation's risk tolerance to the panel. Instruct them that for high-reward projects, they should accept higher risk. Then, revise the procedure to account for that (e.g., by having a separate category for high-risk projects and a lower threshold for such projects). 

  **Honesty about Violations and Judgment:**

  - **Violations of CJT:**
    - The CJT assumes independent and identical competence. Our procedure tries to maintain independence by not sharing reviews initially, but the panel discussion introduces dependence. We mitigate by having a private pre-discussion vote.
    - Competence is not identical across reviewers and applications. We try to assign reviewers by expertise, but it's imperfect.
    - We don't know the exact competence of reviewers. We use a rough estimate from past data.

  - **Judgment Dressed as Procedure:**
    - The decision to add a sixth reviewer for interdisciplinary applications is judgment-based (you suspect below-chance accuracy).
    - The handling of a "strong reject" as a veto is not in the standard CJT. We allow it only for verified critical flaws, which is a judgment call by the chair.
    - The majority threshold (3/5) is chosen based on common practice and CJT, but the exact threshold (3/5 vs 4/5) is a judgment about the cost of false positives vs false negatives.

  **Summary of the Procedure:**

  1. **Setup per round:**
     - Assign 5 reviewers per application. Add a sixth for interdisciplinary or borderline cases if resources allow.
     - Reviewers do not see each other's reviews before submitting their scores and overall vote.
     - Panelists will vote privately before and after discussion.
     - Decision rule: simple majority (3/5) for the final vote. Reject only by majority unless a verified critical flaw exists.

  2. **Per application:**
     - Collect reviews.
     - Panelists submit private preliminary votes.
     - Discuss.
     - Panelists submit private final votes.
     - Apply majority rule.
     - If stuck on a factual issue, seek expert input or reject if uncertainty remains.

  3. **Tracking:**
     - Monitor the success rate of funded projects and the outcomes of the rejected-but-funded-elsewhere projects to estimate accuracy and adjust if needed.

  This procedure balances the CJT insights with practical constraints and should be implementable in a spreadsheet and explainable to the board.
answer: |-
  ### Decision Procedure for Grant Review Panels  
  Based on the Condorcet Jury Theorem (CJT) and your constraints, here’s a step-by-step procedure. It addresses your questions, minimizes statistical complexity, and works within your 2-hour/round limit. The core CJT insight: **Group accuracy improves with more reviewers only if each is >50% accurate. If accuracy is <50%, adding reviewers makes things worse.**  

  ---

  ### **Setup Steps (Once Per Round)**  
  Ask these questions when configuring the process:  

  1. **How many reviewers per application?**  
     - *Question:* What’s the expected accuracy of our reviewers on *this round’s applications*? (Estimate using past data or expert judgment.)  
     - *Good enough answer:*  
       - If accuracy is >50% (e.g., past funded projects succeeded >50% of the time), use **5 reviewers**. CJT shows diminishing returns beyond 5–6 when errors are correlated.  
       - If accuracy is unknown or borderline (e.g., new topic), default to 5.  
     - **When to add a 6th reviewer?**  
       - Only if:  
         - The application is interdisciplinary (risk of <50% accuracy), AND  
         - Adding a reviewer from the *missing field* costs less than **15 minutes of panel time** (e.g., $200 for a consultant vs. 5 people × 15 min = 75 min of saved time).  
       - *Otherwise, spend effort on better reviews:*  
         - Pay for a 15-min applicant call if clarity on methods/feasibility is needed.  
         - Pay for a second reader from another field if interdisciplinarity is high.  
     - *Stop and default to 5 reviewers* if you can’t estimate accuracy or resources are tight.  

  2. **Should reviewers see each other’s drafts?**  
     - *Question:* Are reviewers likely to make *independent* errors? (e.g., Do they share biases? Is the topic prone to groupthink?)  
     - *Good enough answer:*  
       - **Don’t share drafts before scoring.** Independence is critical for CJT. Sharing correlates errors, causing accuracy to plateau (e.g., 5 reviewers with correlated errors may only reach 70–80% max accuracy, not 95%).  
       - *Exception:* Share drafts *only* if reviews are highly technical (e.g., stats/methods), and a 10-min peer discussion reduces factual errors. Track this in 1–2 applications/round to compare outcomes.  
     - *What to do with correlated errors:*  
       - If errors are correlated (e.g., all reviewers miss the same flaw), adding reviewers won’t help. Invest in **diversity** (e.g., recruit reviewers from different fields) or **training** (e.g., a 30-min guide on common pitfalls).  

  3. **Decision threshold for the panel (yes/no calls):**  
     - *Question:* What costs more—funding a dud (false positive) or missing a breakthrough (false negative)?  
     - *Good enough answer:*  
       - **Simple majority (3/5)** if both errors are equally bad. CJT optimizes for accuracy here.  
       - **Two-thirds (4/5)** if false positives are worse (e.g., your foundation is risk-averse).  
       - **Eliminate the veto rule.** It’s equivalent to unanimity (5/5), which CJT shows *reduces* accuracy unless reviewers are >80% correct. Example:  
         - With 70% accurate reviewers, veto rule cuts correct approvals from 84% (3/5) to 17% (5/5).  
         - *Cost:* You reject 83% of good projects. Use 4/5 if fear of duds is high.  

  ---

  ### **Per-Application Steps (When Panel Is Stuck)**  
  Ask these during the 15-min Zoom discussion for contentious applications:  

  4. **Private vote before discussion?**  
     - **Yes.** Have all 5 panelists submit a private yes/no vote *before* talking. This preserves independence (per CJT). After discussion, hold a final vote. Use the final vote for the decision.  

  5. **Vote on criteria (importance/methods/feasibility) or overall?**  
     - **Vote overall.** CJT applies to binary choices. Splitting into criteria creates paradoxes (e.g., majority-no overall despite majority-yes on parts).  
     - *Exception:* If the panel disagrees on *why* (e.g., all like importance but hate methods), hold a majority vote on the **weakest criterion**. If it fails (e.g., methods voted "flawed" by 3/5), reject the application.  

  6. **Handling disagreements:**  
     - *Question:* Is the split **factual** (e.g., “Is this stats plan valid?”) or **value-based** (e.g., “Is this risk worth taking?”)?  
       - **Factual:** Defer to the majority. If unresolved (e.g., 2 vs 3 on stats), reject—uncertainty favors "no" (assumes the burden of proof is on the applicant).  
       - **Value-based (risk appetite):** Let the panel vote. If tied (e.g., 2 safe vs 3 risky), **delegate to the chair** with guidance: “Choose based on foundation’s mission (e.g., high-risk vs. incremental work).”  
     - *Stop and reject* if facts are unsettled (e.g., raw data needed) and can’t be resolved in 15 min.  

  7. **Estimating reviewer accuracy:**  
     - *What you can infer:*  
       - **Funded projects:** Track success rates (e.g., 80% succeed → reviewers ~70-80% accurate on approvals).  
       - **Rejected-but-funded-elsewhere projects:** If >50% succeed, your false negative rate is high (e.g., 5/20 succeed → 25% false negatives).  
     - *What you can’t infer:* True accuracy (due to missing data on rejected projects).  
     - *Workaround:* For this round, assume reviewers are **60–70% accurate** if:  
       - Funded success rate is >60%, AND/OR  
       - <30% of rejected-but-funded-elsewhere projects succeed.  
       - If accuracy is questionable (e.g., stats-heavy round), add a 6th reviewer or buy an expert consult.  

  ---

  ### **Applied to Your Three Cases**  
  **Case 1: Solid, unexciting application (all mildly like it)**  
  - Setup: 5 reviewers, all accuracy >50%.  
  - Reviews: All 5 score it “weak yes.”  
  - Panel: Private pre-vote: 5 yes. Discussion: No new issues. Final vote: 5 yes.  
  - **Decision:** Fund (majority yes).  
  - *Why it works:* CJT predicts near-certainty with unanimous reviewers >50% accurate.  

  **Case 2: Interdisciplinary application (reviewers all from one field)**  
  - Setup: Suspected accuracy <50% for field B. Added 6th reviewer from field B.  
  - Reviews: 5 from field A say “no” (accuracy 40%), 1 from field B says “yes” (accuracy 70%).  
  - Panel: Private pre-vote: 5 no, 1 yes. Discussion: Field A’s concerns dominate. Final vote: 5 no, 1 yes.  
  - **Decision:** Reject (majority no).  
  - *CJT violation:* Reviewers from field A likely <50% accurate, so adding more worsened the outcome.  
  - *Rescue step:* Delegate to chair with instruction: “If field B’s review is compelling, override for strategic reasons.”  

  **Case 3: Statistical plan disagreement (2 say fine, 3 say broken)**  
  - Setup: Accuracy unknown. Default to 5 reviewers.  
  - Reviews: 2 yes (non-stats reviewers), 3 no (stats experts).  
  - Panel: Private pre-vote: 2 yes, 3 no. Discussion: Factual stalemate.  
  - *Question:* Factual or value-based? **Factual** (stats validity).  
  - **Decision:** Reject (majority says flawed; uncertainty favors no).  
  - *Next step:* If feasible, 15-min call with applicant to clarify stats. If unresolved, reject.  

  ---

  ### **Unpopular Output Example**  
  **Case:** High-risk, high-reward application in a novel field.  
  - Reviews: 3 say “no” (methods too speculative), 2 say “yes” (potential breakthrough).  
  - Panel: Private pre-vote: 3 no, 2 yes. Discussion: Value-based split (risk appetite). Final vote: 3 no, 2 yes.  
  - **Procedure Output:** Reject (majority no).  
  - **Why you won’t like it:** Your foundation wants to support innovation, but the panel is risk-averse.  
  - **What the board might say:** “This contradicts our mission!”  
  - **What to do:**  
    - **Delegate to chair** with guidance: “If the project aligns with our high-risk mandate, approve.”  
    - **Revise setup:** Next round, lower the threshold to 2/5 for “high-risk” applications (tagged during submission).  

  ---

  ### **Where You’re Using Judgment (Not Strict CJT)**  
  1. **Estimating accuracy:** Guessing 60–70% from incomplete data is judgment. CJT requires known accuracy.  
  2. **Adding reviewers:** Deciding “when it’s worth it” uses cost/benefit judgment. CJT assumes unlimited, identical reviewers.  
  3. **Delegating to chair:** CJT doesn’t cover value disputes, so human judgment is necessary.  

  ### **Procedure Summary**  
  - **Inputs:** Reviewer scores (submitted independently), panel votes (private pre-discussion + final).  
  - **Output:** Yes/no per application (majority rule, no vetoes).  
  - **Tools:** Spreadsheet with columns for:  
    - Reviewer scores (1–5 per criterion + overall yes/no).  
    - Panel pre-vote and final vote (yes/no).  
    - Decision (formula: if final yes votes ≥ threshold, “fund”).  
  - **Time:** <2 hours/round to configure; 1 min/application to tally votes.  

  This procedure respects CJT where possible (independence, majority rule) and defaults to transparent, defensible judgment when realities collide with theory.
