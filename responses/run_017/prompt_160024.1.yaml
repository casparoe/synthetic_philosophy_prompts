prompt: |-
  I serve on the peer review panel of a volunteer emergency medical service, and for the past two years we have kept what we call the near-miss ledger: every deviation from protocol that a crew member reports or that a supervisor observes is logged, coded by type (documentation lapse, scope-of-practice overreach, procedural shortcut under time pressure, equipment-check omission, handoff failure), and weighted by severity and frequency, so that each member ends up with a rolling deviation score. When the panel censures someone, we have been operating under a rule I drafted and that the rest of the panel more or less accepted: the Clean Hands Rule, which says that a member has standing to blame another for a deviation only if her own record contains no deviation of the same type or of any type morally comparable to it, that standing is a scalar quantity which is depleted in proportion to how serious and how frequent one's own deviations have been, and that a member who has spent her standing can earn it back only by self-reporting her own comparable deviation in open session before delivering the censure — the idea being that self-blame is what makes hypocritical blame permissible again.

  The trouble is that when we finally ran the numbers last month, the ledger put every single member of the panel above zero, and the comparability relation turned out to be far more promiscuous than I expected: "procedural shortcut under time pressure" is arguably comparable in the relevant respect to most of the other codes, since almost every deviation is a case of trading a protocol requirement for a saving in time, and once you allow partial comparability the scalar view seems to imply that a member with three logged shortcuts has, say, sixty percent of the standing she started with rather than none. So under my own rule it looks as though almost nobody on the panel has full standing to censure almost anybody, and because we have always assumed without discussing it that a finding of blameworthiness requires that the person making the finding have standing, we appear to be committed to dropping every case currently in front of us — including one in which a crew chief skipped a mandatory pre-transport check and the patient was harmed. My colleagues have started treating standing as a scarce resource to be allocated: one of them proposes that we aggregate the panel's standing and route the censure through whichever member has the cleanest record on the relevant code, in effect treating standing as transferable, and another proposes a formal comparability threshold we could tune until the panel is no longer paralyzed.

  I need to put a concrete protocol to a vote in four weeks, so I would be grateful for help on three things: first, how I should calibrate the comparability threshold and the depletion function so that the rule stops swallowing every case; second, whether standing really can be pooled or delegated across the panel the way my colleague suggests, or whether that is a category mistake; and third, whether the self-report restoration clause is sound or whether it simply adds a further deviation to the ledger. Something about the ledger metaphor has begun to bother me — it may be that I have misdescribed what standing is, rather than merely mis-set the numbers — but I cannot locate the mistake myself, and I would rather have it pointed out now than in the middle of the meeting. Please answer in American English, and if you think my framing rests on a confusion, say plainly which premise to abandon and what a defensible version of the Clean Hands Rule would look like instead.
reasoning: |-
  Okay, the user is part of a peer review panel for an emergency medical service. They've implemented a Clean Hands Rule that requires members to have a clean record to censure others. But now, the data shows everyone has deviations, and comparability is too broad, paralyzing the panel. They need solutions fast.

  First, I need to understand the core issue. The rule's strictness is causing gridlock. The ledger's design makes nearly every deviation comparable, especially since time-saving shortcuts are common. This leads to almost no one having standing. The user mentioned a critical case where a skipped check caused patient harm, which they can't address. That's a serious problem.

  The user's colleagues suggest workarounds like pooling standing or adjusting comparability thresholds. But are these fixes or just patches? The user also questions the self-reporting clause—does it add more deviations? And they sense a deeper issue with the ledger metaphor itself.

  Looking deeper, the user might be worried about fairness and accountability. If no one can censure, safety erodes. There's also a possible conflict between individual accountability and collective responsibility. The panel needs to maintain trust but the current rule undermines that. Unspoken needs: ensuring patient safety without hypocrisy, and creating a functional system that encourages improvement rather than punishment.

  The self-reporting restoration is tricky. Confessing before censuring might reduce hypocrisy, but it could deter reporting if people fear consequences. Plus, adding another entry to their ledger creates a cycle. Maybe reframe self-reporting as a positive act that builds trust instead of just restoring standing.

  The ledger metaphor implies a scorecard, which might be too transactional. Shifting to a maturity model or growth mindset could help. Instead of depleting standing, focus on how deviations are addressed. Were they reported? What was learned? Actions taken to prevent recurrence?

  For calibration, they need thresholds that allow censuring serious issues. Maybe limit comparability to similar severity or types. Severity-based depletion where minor lapses don't fully deplete standing. Also, consider time decay—older deviations matter less. This prevents past mistakes from permanently disqualifying members.

  Pooling standing feels like a category mistake. Standing is personal; it's about moral authority. Delegating censure might seem like avoiding responsibility. Instead, the panel could act as a body where the collective judgment overrides individual standing issues, but only if the process is transparent and fair.

  A defensible Clean Hands Rule would focus on current integrity and constructive criticism. Require that the censurer hasn't committed the same deviation recently, but allow for growth. Separate the censuring process from individual standing by having the panel review cases based on evidence, not personal records.

  In summary, the user needs to move from a punitive ledger to a learning system. Adjust thresholds for practicality, avoid pooling, rethink self-reporting as proactive rather than restorative, and emphasize collective responsibility for maintaining standards.
answer: |-
  I understand your dilemma—you've designed a system to prevent hypocrisy in peer censure, but its strict logic now paralyzes accountability. The core issue is that your "ledger" model conflates **moral standing** with **quantifiable sin-counting**, and the comparability framework is too expansive. Let's address your three questions directly, then propose a reframed rule.

  ### 1. Calibrating the Threshold & Depletion Function
  To prevent the rule from "swallowing every case," you need **practical constraints** on comparability and depletion:
  - **Comparability Threshold:** Restrict comparability to **shared root causes or equivalent risk profiles**. Example:
    - *Same Category:* Only "documentation lapses" compare to other "documentation lapses," not to "equipment omissions."
    - *Severity-Based:* A minor lapse (e.g., late documentation) shouldn’t negate standing for censuring a major deviation (e.g., skipped pre-transport check).
    - *Intent/Context:* "Shortcuts under time pressure" only compare if the *trade-off decision* was similar (e.g., both involved bypassing safety steps for speed).
  - **Depletion Function:** Make it **non-linear and time-bound**:
    - Minor deviations reduce standing by 10-20%; major ones by 50-100%.
    - Implement **decay**: Standing regenerates (e.g., 20% monthly) if no new deviations. Past deviations older than 6 months don’t count.
    - *Example Formula:* `Standing = 100% - [Severity-Weighted Sum of Last 6 Months' Deviations]`, capped so one minor lapse doesn’t zero out standing.

  **Result:** With thresholds, a panel member with three minor shortcuts might retain 70% standing, allowing censure for serious unrelated issues (e.g., scope overreach).

  ### 2. Pooling or Delegating Standing? It’s a Category Mistake
  Standing is **personal moral authority**, not a transferable commodity. Pooling it undermines the entire ethical foundation of your rule:
  - **Hypocrisy isn’t solved by delegation:** If Alice lacks standing to censure Bob for an equipment lapse, routing her censure through Charles (who has a clean equipment record) doesn’t make Alice’s judgment less hypocritical—it just hides it.
  - **Practical risks:** "Cleanest member" delegation creates pressure on individuals, risks bias, and detracts from collective responsibility. It also fails if *no* member has a spotless record in a category (your current reality).

  **Verdict:** Reject pooling/delegation. It corrupts the intent of the rule.

  ### 3. The Self-Report Restoration Clause: Partially Sound but Flawed
  The clause correctly identifies **self-accountability as restorative** but has critical flaws:
  - **The upside:** Public self-reporting *can* rebuild trust by demonstrating humility and commitment to transparency.
  - **The fatal flaw:** As you suspect, it **adds another deviation to the ledger**, creating a vicious cycle. Reporting your error to censure someone else *incentivizes tactical confessions* without genuine remorse.
  - **Worse:** It could discourage censure altogether to avoid self-incrimination.

  **Fix:** Allow self-reports to *accelerate* standing recovery (e.g., +40% restoration) but **decouple them from censure**. Reports should be part of routine culture improvement, not a transactional toll.

  ---

  ### The Core Problem: Abandon the "Ledger" Metaphor
  Your premise mistakes **accountability** for **mathematical innocence**. In high-stakes fields like EMS, perfection is unattainable—what matters is *how* deviations are handled. The ledger approach:
  - Ignores **context** (was the deviation willful? emergent?).
  - Overlooks **growth** (does the member learn?).
  - Equates **all errors morally**, which paralyzes justice.

  ### A Defensible Clean Hands Rule
  Replace the ledger with a **maturity-based standard** focused on **current integrity** and **constructive intent**:

  > "A panel member has standing to censure another for a deviation if:
  > 1. **They have not committed the *same* deviation within the past 6 months**, AND  
  > 2. **Their own record shows no *pattern* of comparable deviations** (defined narrowly by risk/severity), AND  
  > 3. **They demonstrate good-faith engagement** (e.g., self-reported past errors, supported protocol improvements).  
  >   
  > Standing is lost *only* for the *specific deviation type* being censured. It is restored after 3 months without a *repeat* deviation, or immediately upon self-reporting *new* errors (without linkage to censure)."

  ### Why This Works
  - **Prevents hypocrisy** without demanding sainthood.  
  - **Narrow comparability** avoids over-paralysis.  
  - **Self-reporting aids culture** without gaming.  
  - **Focuses on repeat offenses**, not isolated mistakes.  
  - **Time-bound restoration** encourages improvement.  

  ### Your Path Forward
  - **Vote on narrow comparability criteria** (e.g., "only same category + same severity level").  
  - **Adopt severity-weighted depletion** with automatic monthly recovery.  
  - **Scrap delegation**—censures require personal standing.  
  - **Reward self-reports independently**, not as censure tickets.  

  This balances ethical rigor with operational reality. The goal isn’t a blameless panel—it’s one that upholds standards *through* accountability, not in spite of it. Present this as a "learning system" upgrade, and you’ll sidestep the ledger trap while keeping patient safety paramount.
