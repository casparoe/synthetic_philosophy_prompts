  A self-assessment for users to discover their default "native" sense. Concrete cases, no jargon. **Discrepancies with mod tree**: Quiz groups "Ecological-Function" and "Deflationary" as one position (both prioritize adaptation), while mod tree separates them. Mod tree also isolates "Belonging/Identity," but quiz omits it (too sensitive for user self-ID).

  #### Quiz Questions:
  1. You see a plant sold as "native" at a nursery. It’s a named variety of a local species, but bred in Europe for shorter stems. Do you:  
     a) Buy it—it’s still native at the species level.  
     b) Avoid it—true natives must have local genetics.  
     c) Buy it—if it grows well and supports wildlife, who cares?  

  2. A plant appears in your garden that wasn’t there 10 years ago. It spread naturally from 800 miles south due to climate change. Is it native?  
     a) Yes—it arrived without human help.  
     b) No—it wasn’t here historically.  
     c) Yes—if it’s thriving and feeding pollinators.  

  3. Your state’s "native plant list" includes species maintained by Indigenous fire practices. Is this valid?  
     a) Yes—the list defines native, period.  
     b) No—if humans helped, it’s not truly wild.  
     c) Yes—human stewardship is part of ecology.  

  4. You’re selling seeds. You know they’re from a state-listed native species but not the exact origin. Do you label them "native"?  
     a) Yes—the species is native.  
     b) Only if I can confirm local collection.  
     c) No—I’d say "locally adapted" instead.  

  5. A naturalized flower (non-native but not invasive) supports bees better than local plants. Do you remove it?  
     a) Yes—non-natives don’t belong.  
     b) Maybe—if it’s hybridizing with natives.  
     c) No—function matters more than origin.  

  6. Someone says, "Compost methods should be native to our region." You think:  
     a) Nonsense—compost isn’t a plant!  
     b) They mean traditional techniques—that’s valid.  
     c) They’re signaling eco-purity.  

  #### Scoring Key (Map to Positions):
  - **Mostly a**: Cultivar-Tolerant Straight-Species View (accepts species-level nativity).  
  - **Mostly b**: Local-Provenance View (prioritizes genetics) or Baseline Purist (if b in Q3).  
  - **Mostly c**: Ecological-Function/Deflationary View (adaptation/function over history).  
  - **Q6 b**: Belonging/Identity Sense (if chosen alone, rare).  
  - **Q4 c or Q5 c**: Deflationary View.  

  **Quiz-Mod Tree Discrepancies**:  
  - Quiz merges "Ecological-Function" and "Deflationary" (both "c" options). Mod tree splits them.  
  - Quiz "b" in Q3 maps to "No-Human-Transport," but mod tree treats it as Baseline Purist.  
  - "Belonging/Identity" isn’t a quiz result—users won’t self-identify as exclusionary.  

  This gives you a moderation tool and user-reflection piece. For the tree, I recommend a trial run with mods to refine context-dependent branches!
