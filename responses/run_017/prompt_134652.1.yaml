  ### Step 1: Brainstorming Independent Axes
  I'll define four independent axes of variation for the concept of "native" as used in your server. These capture core dimensions where interpretations diverge, based on linguistic philosophy (e.g., open texture, family resemblance) and real-world moderation needs. Axes are binary (high/low) for simplicity in tree-building, but represent spectra. I focused on features observable in a single post, not user intent.

  1. **Attachment to Taxon**: Does "native" grammatically attach to a plant (or group) that could be identified taxonomically (species, cultivar, etc.), or is it detached (e.g., applied to methods, vibes, or abstract concepts)?  
     - *High*: Attached to a specific plant or group (e.g., "native oak").  
     - *Low*: Attached to non-plant entities (e.g., "native gardening style").

  2. **Temporal Baseline Specificity**: Is a specific historical timeframe referenced or strongly implied for assessing "nativeness" (e.g., pre-settlement, 1800, before human intervention)?  
     - *High*: Explicit/implicit timeframe (e.g., "pre-settlement," "historically").  
     - *Low*: No timeframe, or timeframe is vague/contemporary (e.g., "now," "currently").

  3. **Dispersal Mechanism**: Is human involvement in the plant's presence explicitly mentioned or contested (e.g., human transport vs. natural dispersal)?  
     - *High*: Human role discussed (e.g., "brought by humans," "arrived naturally").  
     - *Low*: Human role not mentioned.

  4. **Function vs. Origin Primacy**: Does the post emphasize the plant's current ecological role (e.g., supporting pollinators) over its historical origin, or vice versa?  
     - *High*: Focus on current function/adaptation (e.g., "bees love it," "grows well here").  
     - *Low*: Focus on historical/origin factors (e.g., "evolved here," "was here before").

