prompt: |-
  I'm a senior at a public high school in Ohio, and I compete in Public Forum debate. Our current resolution asks whether American companies operating abroad should be held to American anti-bribery rules rather than to local practice. In practice rounds my partner keeps closing our case with "when in Rome, do as the Romans do," and it seems to end the argument every time. The example he uses is a truck full of parts sitting at a border crossing for three days until someone hands a clerk a small amount of cash, after which the paperwork is stamped and the truck moves. Everyone at that crossing treats the payment as normal. So, the slogan is supposed to establish, the payment isn't corrupt — or at least it isn't corrupt *there* — and American rules are just one culture's taboo that we are trying to export.

  It feels like the proverb is doing several different jobs at once, and I want to know which one my partner actually needs. Could you lay out, as a list I can bring to practice, the distinct precise claims that sentence could be making, from the trivial to the radical? For each one I'd like a verdict on three things: whether it is a platitude, whether it is substantive but arguable, or whether it is straightforwardly false; and, most importantly, whether it would actually get my partner his conclusion.

  A few complications I'd want the list to handle, because I think they are where the argument really lives:

  First, I'm not sure which "Rome" is supposed to be doing the work. There is the local statute, there is what officials actually do, there is what ordinary people there say they approve of, and there is the group that ends up paying for the favor. In a lot of these cases the people harmed by a diverted contract or a skipped inspection are not the people whose conventions set the etiquette. Is the proverb a claim about the conventions of the insiders or of everyone affected?

  Second, my teacher suggested that a practice can be locally *expected* without being locally *endorsed* — that plenty of people make these payments and still think the system that requires them is rotten. If that's right, it seems like one reading of the proverb (the descriptive one) is satisfied while another (the moral one) does nothing at all. I'd like that gap made explicit, and also the related question of what happens if the payment turns out to be illegal under that country's own law too.

  Third, and this is the part I care about most: my partner slides between calling the payment a "gift," a "fee," and a "bribe," and I don't think those are the same shape of thing. As I understand it, a gift opens an ongoing relationship with an unstated return; a bribe is closer to a price that settles the matter on the spot; and a clientelist exchange is neither, because its point is a durable bond of protection and loyalty rather than any single trade. If the standard Western complaint is that the transfer buys a favor that an impersonal rule was supposed to allocate, then what is the matching complaint *inside* the clientelist picture — something like the betrayal of an obligation of care, perhaps — and what would the proverb have to mean for the second complaint to cancel the first instead of just being a different complaint?

  Finally, is there a reading on which the proverb isn't a moral claim at all, but a claim about who is in a position to interpret what the payment means — locals understand the gesture, so my classification should defer to theirs? If so, does that kind of epistemic deference ever turn into moral deference, or is my partner smuggling the second in under cover of the first?

  I'm not looking for sources or a reading list; I just want the menu of readings and the verdicts, ideally short enough to read aloud at practice.
reasoning: |-
  Okay, let me unpack this Public Forum debate scenario. The user is a high school senior in Ohio grappling with their partner's repeated use of "when in Rome" to justify foreign bribery under local norms. They need a precise breakdown of how this proverb functions - and where it fails - in their anti-bribery resolution.

  Hmm, the core tension here is between cultural relativism and universal ethics. The partner's border-crossing example seems compelling on surface level: a small cash payment to move paperwork is framed as harmless local custom. But the user has already spotted cracks in this argument - particularly around who defines "Roman" practices and whether descriptive norms imply moral approval.

  First I'll categorize the proverb's possible meanings. The descriptive reading (what locals *do*) is factually true but morally empty. The moral reading (what they *should* do) is circular - it assumes precisely what needs proving. Then there's the institutional version where "Rome" means local laws, but that backfires when the payment is illegal locally too. 

  Ah, the clientelism angle is crucial. The user rightly notes that Western "bribe" framing misses how such payments function as social glue in some contexts. But even if recast as "gifts" or "fees," three problems remain: the power imbalance (officials extracting payments), the harmed third parties (those who can't pay), and the systemic corruption (undermining public trust). The proverb conveniently ignores these by focusing only on the transaction participants.

  For epistemic deference... interesting! The "locals understand best" claim only holds for interpreting actions, not for judging their morality. A customs clerk might see the payment as normal while a farmer bankrupted by such "fees" sees it as oppression. The proverb can't decide whose interpretation counts as "Roman."

  *checks user's request for brevity* Right - they need punchy takeaways for practice rounds. I'll structure this as numbered readings with clear verdicts: platitude (useless), arguable (debatable), or false (reject). Each gets a "does it prove the conclusion?" reality check. The border example will serve as consistent test case.

  Most importantly, the list must expose how the proverb (1) conflates different "Romes," (2) mistakes compliance for endorsement, and (3) hides systemic harms behind interpersonal transactions. That last point is the silver bullet - when the partner says "it's just how things work," the rebuttal is "yes, and that system exploits people." 

  Final touch: adding concrete questions the partner must answer to salvage their case. "Who pays the real cost?" and "Could locals criticize this while participating?" should force deeper engagement. The goal isn't to win prep time but to show why this slogan can't be the closing argument.
answer: |-
  Here's your menu of readings for "When in Rome," with verdicts and relevance to your partner's case. Each reading is tested against the border-bribery example:

  ### Core Readings & Verdicts
  1. **Descriptive Claim: "This is what Romans *do*."**  
     *Meaning:* Locals routinely make/accept such payments.  
     *Verdict:* **Platitude** (likely true in the example).  
     *Gets Conclusion?* **No.** Describing a practice doesn’t prove it’s ethical or that U.S. rules shouldn’t apply.  
     *Gap:* Confuses *common* with *endorsed*. "Everyone does it" ≠ "Everyone thinks it's good."

  2. **Legal Claim: "This is what Roman *law* allows."**  
     *Meaning:* The payment complies with local statutes.  
     *Verdict:* **False/Arguable** (often untrue; many countries criminalize petty bribery but lack enforcement).  
     *Gets Conclusion?* **No.** If illegal locally too, U.S. rules merely reinforce local law. If legal, still doesn’t resolve morality.

  3. **Moral Relativism Claim: "This is what Romans *approve* of."**  
     *Meaning:* Locals believe the payment is ethically acceptable.  
     *Verdict:* **Arguable/False** (often contested locally; victims may despise it).  
     *Gets Conclusion?* **No.** Must prove *all* relevant groups approve (officials, payers, victims). Rarely true.  
     *"Rome" Problem:* Whose approval counts? The clerk? The truck driver? The business that lost a contract because it couldn’t pay?  

  4. **Functional Claim: "This is how Rome *works*."**  
     *Meaning:* The payment serves a necessary role (e.g., speeding up bureaucracy).  
     *Verdict:* **Arguable** (sometimes true for efficiency; often creates perverse incentives).  
     *Gets Conclusion?* **No.** Efficiency ≠ morality. U.S. rules might seek to change dysfunctional systems.

  5. **Moral Authority Claim: "Romans are the *arbiters* of morality here."**  
     *Meaning:* Local norms define ethics in that context; outsiders can’t judge.  
     *Verdict:* **False/Substantive** (assumes cultural boundaries dictate morality; ignores universal harms like exploitation).  
     *Gets Conclusion?* **No.** Requires proving that corruption *can’t* be cross-culturally condemned.  

  6. **Epistemic Deference Claim: "Romans *understand* the meaning; outsiders don’t."**  
     *Meaning:* Only locals can interpret whether the payment is a "gift," "fee," or "bribe."  
     *Verdict:* **Platitude/Arguable** (Locals *do* understand context better, but not infallibly).  
     *Gets Conclusion?* **No.** Understanding ≠ moral justification. *Smuggling Alert:* This often sneaks in moral relativism ("If they call it a gift, it’s not corrupt").  

  ---

  ### Addressing Your Complications
  - **Which "Rome" Matters?**  
    The proverb collapses officials ("insiders"), payers, and victims into one "Rome." But victims (e.g., competitors who can’t pay, citizens harmed by underfunded services) rarely endorse the practice. **Verdict:** The slogan ignores power imbalances and conflates *perpetrators* with *the public*.

  - **Expected vs. Endorsed?**  
    If locals *expect* bribes but *condemn* them, the proverb’s descriptive reading holds, but its moral reading fails. **Verdict:** "When in Rome" only works morally if it means "do what Romans **want you to do**," not "do what Romans **resign themselves to**."

  - **Gift/Fee/Bribe Ambiguity:**  
    - *If a "gift":* Implies relationship-building. But in the border example, it’s a transactional payment to bypass rules → functionally a bribe.  
    - *If a "fee":* Suggests a legitimate charge. But if unrecorded, untaxed, and discretionary, it’s corruption.  
    - **Clientelism Trap:** Even if framed as mutual obligation ("durable bond"), the harm remains: the payment **distorts impartial allocation of public services**. The "internal" complaint might be *betrayal of patronage*, but the *external* complaint is **corruption of public function**. The proverb can’t cancel the latter.  

  ---

  ### Final Verdicts for Your Partner
  | **Reading of "When in Rome"**       | **Truth Status**       | **Gets Conclusion?** | **Why It Fails**                                  |
  |-------------------------------------|------------------------|----------------------|--------------------------------------------------|
  | Descriptive ("They do it")          | Platitude (Likely T)   | ❌ No                | "Is" ≠ "ought." Ignores victims.                 |
  | Legal ("It’s legal there")          | Often False            | ❌ No                | Usually illegal locally too.                     |
  | Moral Approval ("They like it")     | Usually False          | ❌ No                | Locals often resent it.                          |
  | Functional ("It’s necessary")       | Arguable               | ❌ No                | Necessity ≠ justice; may entrench dysfunction.   |
  | Moral Authority ("They decide")     | False/Substantive      | ❌ No                | Assumes cultural relativism; ignores harm.       |
  | Epistemic Deference ("They get it") | Platitude              | ❌ No                | Explains context ≠ justifies act.                |

  **Silver Bullet Questions for Practice:**  
  1. *"Who in 'Rome' is harmed by this payment, and does the proverb speak for them?"*  
  2. *"If locals call it a 'gift' but the effect is skipping a safety inspection, does the label change the harm?"*  
  3. *"Could a local journalist condemn this practice while still paying it? If yes, the proverb doesn’t prove endorsement."*  

  Your partner’s move wins on rhetorical flair but fails on logic. The slogan’s power comes from **equivocation** between its trivial/descriptive readings and its radical/moral ones. Force the distinction.
