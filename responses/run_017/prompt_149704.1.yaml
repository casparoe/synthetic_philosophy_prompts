prompt: |-
  I help run a fortnightly debate night at the public library, and the immigration argument is the one that never goes anywhere: one side says borders are violence, the other says a state with no border isn't a state, and after an hour we've just repeated ourselves. So I want to hand people something different — a one-page decision tree they can walk themselves through, roughly 9 branch questions and about 12 leaves, where every branch node is a concrete case or a claim you can say yes or no to without knowing where it leads. Nobody should get asked 'does the state have a right to exclude?' straight out; I want them sorted by their answers and only handed the label at the leaf. The commitment at the top of the tree should be one nearly everyone at the library shares — that turning away somebody who arrives announcing, truthfully, that they intend to burn down the parliament and shoot the people inside is not automatically wrong — and branch out from there.

  A few things I specifically want in it, because I think the actual disagreement is hiding in distinctions we keep collapsing. First: refusing someone entry is not the same as admitting them on conditions, and neither is the same as choosing among applicants who are all admissable — so I want separate nodes for a state that charges a large entry fee, one that admits workers for five years with no vote and no access to benefits, and one that runs a points system or a lottery once it has decided how many to take. Second, I want the tree to force a view about whose right this is supposed to be: give me a node where a clear majority votes to admit and a single member objects that she simply doesn't want to associate with this person, and another where the objection is that the migrant will vote for policies that leave existing citizens worse off. Third, cases I want used: a family fleeing a famine that is nobody's fault; a doctor with a job offer; a retiree who'll buy a house and pay more in tax than they cost; ten million people arriving at once versus the same ten million spread over forty years; somebody whose family was driven off that exact stretch of land six generations ago; and a group that wants to buy an empty region, move in, and secede. I'd also like two ideas of my own built in as nodes even if they aren't real positions — the departure test, where a state's right to keep people out is discounted by whether it lets its own people leave, and the auction model, where the state has to admit anyone willing to pay whatever price would fully compensate current members for any loss.

  At the leaves I want a name where there's a recognisable one — full open borders, but with the associative-freedom version and the priority-to-the-worst-off version as separate leaves, national self-determination, the welfare-state-as-club-good view, the remedial-only view where you may exclude threats and nobody else, outright sovereignty where any reason or no reason will do, plus the auction and secession-friendly variants — each with one sentence on the most awkward thing it is committed to, and 'unnamed' where nobody actually holds it. Two more requests. There are combinations of answers the tree permits that I suspect nobody occupies — for instance somebody who says the exclusion right is held severally by each member and that each member's consent is required, but who also thinks nearly every actual exclusion is wrong — and I want those cells flagged and told whether they're empty because incoherent, unattractive, or just unexplored. And I already know some pairs will collapse onto the same leaf: the libertarian association story and the national self-determination story seem to answer almost every case identically, and so do the two open-borders versions. Don't paper over that — flag the collisions and, where you can, say whether some further case would prise them apart or whether they're genuinely one leaf wearing different clothes. No reading lists or footnotes please; we can argue about who said what after the pub.
reasoning: |-
  Hmm, this is a fascinating challenge about creating a decision tree for immigration debates. The user runs a public library debate night where the immigration argument keeps going in circles, and they want a practical tool to help people uncover their actual principles.

  First, I need to understand the core request: a one-page decision tree with 9 branching questions leading to about 12 terminal positions. The entry point should be uncontroversial (everyone agrees turning away someone who announces intent to burn parliament isn't automatically wrong). The tree must avoid abstract questions like "does the state have a right to exclude?" and instead use concrete cases.

  Key features the user specifically wants:
  - Distinguish between refusal, conditional admission, and selection methods (entry fee, temporary workers, points system/lottery)
  - Explore whose right exclusion is (individual vs collective) with nodes about majority vote vs individual objection
  - Include specific cases: famine refugees, employed doctors, net-contributor retirees, 10M migrants at once vs spread out, historical claimants, and secession-seeking groups
  - Incorporate their original ideas: "departure test" and "auction model"
  - Terminal leaves should name recognizable positions where possible, with awkward commitments highlighted
  - Flag empty cells where combinations are incoherent/unattractive/unexplored
  - Note when different paths collapse to same position (e.g. libertarian vs national self-determination)

  The user is clearly frustrated with surface-level debates and wants to expose hidden premises. They're thinking like an experienced facilitator - noticing how distinctions get collapsed (refusal vs conditional admission) and wanting to force clarity on who holds the exclusion right.

  For structure:
  The opening case (parliament arsonist) establishes that some exclusion is legitimate. Branching should then test:
  1. What makes exclusion legitimate? (threats only? other reasons?)
  2. Who decides? (individuals? collective?)
  3. What forms can admission take? (conditions, selection)
  Special nodes for the user's ideas: departure test and auction model.

  For terminal positions, I'll include:
  - Full open borders (with associative vs priority variants)
  - National self-determination
  - Club-good welfare state
  - Remedial-only exclusion
  - Absolute sovereignty
  - Auction model
  - Secession model
  Plus unnamed hybrids

  The collision warnings are crucial - like noting that libertarian association and national self-determination often align in practice, even if philosophically distinct. Similarly, the two open borders variants may collapse unless we test "preferences vs need" scenarios.

  Empty cells to flag:
  - Individual consent requirement combined with frequent admission obligation (logistically impossible)
  - Absolute exclusion right with departure test failure (inconsistent)

  Implementation notes:
  - Keep questions binary and case-based
  - Use the specific cases requested as branch points
  - Make terminal positions vivid with their "awkward commitment"
  - Design the tree to fit one page visually
answer: |-
  Here’s a one-page decision tree designed to untangle immigration debates. Start at the top and follow your "yes/no" answers to a terminal leaf. **No position is named until the end**—this forces engagement with concrete cases first.

  ---

  ### Decision Tree: Immigration Exclusion Rights  
  **Starting Commitment:** *Turning away someone truthfully announcing intent to burn parliament/shoot people inside is not automatically wrong.*

  1. **Should a state be able to exclude a family fleeing a *natural* famine (no one’s fault) if they pose no threat?**  
     - **Yes** → Go to Q2  
     - **No** → Go to Q3  

  2. **Can a state admit a doctor with a job offer but deny a retiree who’ll pay more in taxes than they cost?**  
     - **Yes** → Go to Q4  
     - **No** → Go to Q5  

  3. **If 10 million people arrive at once (overwhelming infrastructure), may the state temporarily pause entry?**  
     - **Yes** → Go to Q6  
     - **No** → Go to Q7  

  4. **May a state charge a large entry fee (e.g., $1M) for admission?**  
     - **Yes** → Go to Q8  
     - **No** → Go to Q9  

  5. **Can a state run a points system (selecting skilled workers) once it decides how many to admit?**  
     - **Yes** → *Leaf: **Welfare State as Club-Good***  
       *Awkward commitment: Poor or low-skilled migrants may be excluded indefinitely to protect public resources.*  
     - **No** → *Leaf: **Remedial-Only Exclusion***  
       *Awkward commitment: A wealthy serial killer must be admitted if they pose no *immediate* threat.*

  6. **May a state admit workers for 5 years (no vote, no benefits) if they consent?**  
     - **Yes** → *Leaf: **Conditional Sovereignty***  
       *Awkward commitment: Temporary workers can be deported if disabled or unemployed, even if blameless.*  
     - **No** → Go to Q7  

  7. **If a majority votes to admit someone, but one member objects solely because they don’t want to associate with them, who decides?**  
     - **The objector’s choice** → Go to Q8  
     - **The majority’s choice** → Go to Q9  

  8. **Must a state that restricts exit (e.g., bans emigration) lose its right to exclude?**  
     - **Yes** → *Leaf: **Departure Test Model***  
       *Awkward commitment: North Korea must accept all immigrants if it traps its own people.*  
     - **No** → *Leaf: **Absolute Sovereignty***  
       *Awkward commitment: A state may exclude anyone for any reason—even race or religion—if it claims "threat."*  

  9. **If a group wants to buy empty land, move in, and peacefully secede, must the state admit them?**  
     - **Yes** → *Leaf: **Secession-Friendly Open Entry***  
       *Awkward commitment: Hostile groups could buy territory and legally dismantle the state.*  
     - **No** → Go to Q10  

  10. **Should exclusion be allowed if the migrant’s *votes* might worsen citizens’ lives (e.g., supporting harmful policies)?**  
      - **Yes** → *Leaf: **Democratic Self-Defense***  
        *Awkward commitment: A majority could exclude minorities to preserve its political power.*  
      - **No** → Go to Q11  

  11. **Can the state run an auction: admit anyone who pays a fee compensating citizens for *proven* losses?**  
      - **Yes** → *Leaf: **Auction Model***  
        *Awkward commitment: Only the wealthy gain entry; the poor are excluded even if desperate.*  
      - **No** → *Leaf: **Open Borders***  

  ---

  ### Terminal Leaves & Collisions  
  - **Open Borders** (Reached via Q11→No)  
    *Awkward commitment: No right to exclude even cults planning non-violent disruption.*  
    - *Collision note:* "Associative freedom" and "priority to worst-off" paths *both end here*. They only diverge if asked: *"Should a safe but overcrowded state prioritize famine refugees over retirees?"* (But tree doesn’t ask—real positions often collapse.)  
  - **National Self-Determination** (Q7→Majority + Q9→No)  
    *Awkward commitment: A homogenous majority may exclude outsiders to preserve culture.*  
    - *Collision note:* Same practical outcomes as **Libertarian Association** (Q7→Objector). Both allow exclusions for cultural/economic reasons. Only prised apart by *"Can an individual citizen veto admission against majority vote?"* (Q7).  

  ### Empty Cells (Incoherent/Unattractive)  
  - **"Individual Consent + Frequent Admission"** (e.g., Q7→Objector + Q1→No): *Empty*. If *every* citizen must consent to each immigrant, but exclusion is rarely justified, the system is logistically impossible. *Unworkable, not unexplored.*  
  - **"Remedial Exclusion + Exit Restrictions"** (e.g., Q5→No + Q8→No): *Empty*. If exclusion is only for threats, but states that restrict emigration may still exclude, it excuses oppressive states. *Incoherent with human rights principles.*  

  ### Key Distinctions Embedded  
  - **Refusal ≠ Conditional Admission ≠ Selection** (Q4, Q5, Q6): Fees vs. points vs. temporary status.  
  - **Whose Right?** Individual (Q7→Objector) vs. Collective (Q7→Majority, Q10) vs. State (Q8).  
  - **Special Cases:** Famine (Q1), 10M surge (Q3), secession (Q9), historical injustice (not directly asked, but implied in Q9’s "empty land" if contested).  

  ---  
  **How to use:** Hand this out *before* debate. Participants self-sort silently via the tree, then discuss why they landed where they did. Conflicts become about *which branches matter*, not slogans.
