  Key challenges in this response: must avoid academic citations per request, maintain British English, and balance conceptual rigor with practical applicability. The specification needs to: 1) resolve their three conflated questions, 2) solve the extensional problem (practices→emotions mapping), 3) account for solitary/shared shame, 4) handle alien-norm shame, 5) categorize "audit-guilt," 6) address shamelessness, and 7) tackle institutional design constraints.

  Particularly tricky is their demand to identify which criteria pairs are incompatible - this requires exposing theoretical fault lines. Also crucial is showing which single criterion disqualifies most existing frameworks (likely the "alien-norm shame" requirement).

  The workplace "dashboard guilt" example is fascinating - it challenges traditional act/self-focused dichotomies by introducing a metrics-based variant. This needs accommodation in the specification without overcomplicating.

  For the parenting dimension, the response should implicitly address how these criteria might apply to their seven-year-old without veering into parenting advice. The workplace correction anecdote suggests they value distinguishing first-person experience from institutional engineering.

  The conclusion should resist declaring one emotion superior, instead equipping them to evaluate the school policy through these criteria. The incompatible requirements reveal will likely center on whether emotions can be both culturally contingent and morally evaluable - the core tension in their "shame under rejected norms" case.
answer: |-
  Below is a specification of desiderata for a theory of guilt and shame, designed to guide institutional decisions on behavioural cultivation. Each requirement includes its rationale, designation (non-negotiable/preferential), and relevance to your unresolved cases. The criteria prioritise practical applicability over abstract moral hierarchy.

  ---

  ### **Core Desiderata for an Adequate Theory**  
  *(Non-negotiable = N; Preferential = P)*  

  1. **Tripartite Discrimination (N)**  
     *The theory must disentangle three questions: (a) Moral aptness (is the emotion a fitting response to the act/context?), (b) Functional efficacy (does it reliably produce better conduct for agent/victim/group?), and (c) Subjective livability (is it bearable long-term without pathological effects?).*  
     **Case/Rationale:** Your school memo conflates these. A policy targeting "better conduct" (b) may inadvertently select an emotion that is morally inappropriate (a) or psychologically corrosive (c). A viable theory must treat these as separable axes.  

  2. **Extensional Clarity with Individual Variability (N)**  
     *The theory must: (i) Map specific practices (e.g., public apologies, private reflections) to targeted emotions, and (ii) Acknowledge that identical practices evoke guilt in some and shame in others, based on individual psychology/social positioning.*  
     **Case/Rationale:** To guide policy, governors must predict how practices *typically* function while accepting outliers. E.g., a "restorative conference" may *aim* for guilt (act-focused repair) but induce shame (self-condemnation) in a marginalised pupil. Both demands are compatible: practices have *modal* emotional effects but not universal ones.  

  3. **Solitary Shame Account (N)**  
     *The theory must explain solitary shame (e.g., shame for one’s past self, or a relative’s act) without requiring an actual audience. It must distinguish whether this is: (i) Shame proper internalised, (ii) A distinct emotion, or (iii) Guilt mislabelled.*  
     **Case/Rationale:** Shame directed at your grandfather’s acts or felt alone after a work correction cannot rely on present observers. An "audience-dependent" theory fails here. Internalised social norms or self-ideals suffice.  

  4. **Alien-Norm Shame Validation (N)**  
     *The theory must permit: (i) Genuine shame under norms the agent rejects (e.g., a queer teen shamed by heteronormativity), and (ii) The judgement that this shame is "misfelt" (i.e., morally unwarranted).*  
     **Case/Rationale:** Institutions often enforce contested norms. A theory denying (i) ignores lived experience; denying (ii) forfeits moral critique. The emotion is "real" phenomenologically but "false" ethically.  

  5. **Audit-Guilt Accommodation (N)**  
     *The theory must classify "audit-guilt" (dysphoria over missed targets/metrics) as: (i) A guilt variant (if tied to responsibility), (ii) A shame variant (if tied to perceived incompetence), or (iii) A distinct emotion (e.g., "procedural dread").*  
     **Case/Rationale:** Your dashboard-induced state challenges the "act vs. self" dichotomy. If audit-guilt focuses on *failure to meet impersonal standards* (not harming persons/norms), it may be a hybrid or new type — demanding theory flexibility.  

  6. **Shamelessness as Deficit (P)**  
     *The theory should identify what is lost in shamelessness beyond suffering (e.g., diminished social accountability, eroded empathy). It may treat shamelessness as contextually adaptive (e.g., resisting oppression) or universally deficient.*  
     **Case/Rationale:** A "guilt-only" policy risks losing shame’s pro-social functions (e.g., reinforcing communal bonds). But labelling shamelessness "always deficient" risks pathologising resilience against unjust norms (see Req. 4).  

  7. **Leverage & Collateral Effects (N)**  
     *The theory must identify: (i) Actionable institutional levers (e.g., public/private sanctions, language framing), (ii) Their collateral emotions/behaviours, and (iii) The authority entitled to choose (pupils? staff? community?).*  
     **Case/Rationale:** Emotions emerge indirectly. E.g., "public apologies" may leverage shame to induce compliance but collateralise resentment. The theory must map interventions to likely outcomes and specify *who* decides trade-offs.  

  ---

  ### **Incompatible Requirements & Exclusion Analysis**  
  **The Irreconcilable Pair:**  
  - **Req. 3 (Solitary Shame) and Req. 4 (Alien-Norm Shame)** cannot be jointly satisfied by theories requiring *internalised* norms for solitary shame. If solitary shame needs internalisation (e.g., "I endorse the norm I violated"), then alien-norm shame (where norms are *rejected*) becomes paradoxical. Only theories treating shame as a *pre-reflective social attunement* (regardless of endorsement) resolve this — but such theories struggle with Req. 4(ii) (declaring shame "misfelt").  

  **Most Exclusionary Requirement:**  
  **Req. 4 (Alien-Norm Shame)** excludes the most theories:  
  - **Act-vs-Self Theories:** Cannot explain shame under *rejected* norms (if shame is "self-focused," why feel it if you disavow the norm?).  
  - **Audience Theories:** Struggle with solitary shame (Req. 3) and alien-norm shame (no "respected" audience exists).  
  - **Anthropological Shame Cultures:** Treat shame as culturally relative but cannot judge it "misfelt" (violates Req. 4(ii)).  
  - **Status/Belonging Theories:** Frame shame as exclusion anxiety — but if the teen rejects the group, why feel shame?  

  **Scorecard of Standard Lines:**  
  - **Act (Guilt) vs. Self (Shame):** Fails Req. 4–5 (alien-norm shame; audit-guilt’s ambiguous focus). Overly rigid.  
  - **Audience & Ideal Spectator:** Fails Req. 3–4 (solitary/alien-norm shame). Overprivileges social visibility.  
  - **Status & Belonging:** Fails Req. 4 (shame without desired belonging). Neglects solitary shame’s moral dimension.  
  - **Shame/Guilt Cultures:** Fails Req. 4 (cannot critique "misfelt" shame) and Req. 1 (conflates efficacy with aptness). Culturally deterministic.  

  ---

  ### **Summary for Your Decision**  
  A theory meeting all *non-negotiable* criteria would:  
  - Advise the school policy based on **which lever (Req. 7)** best balances **conduct (Req. 1b)**, **moral aptness (Req. 1a)**, and **livability (Req. 1c)** for *this* community.  
  - Treat "cultivate guilt" as aspirational but **audit practices (Req. 2)** for shame risks (e.g., public sanctions may induce shame in vulnerable pupils).  
  - Recognise your "dashboard guilt" as **shame-adjacent (Req. 5)** — impersonal, target-focused dysphoria — suggesting schools avoid metric-driven discipline.  
  - Argue **shamelessness isn’t always deficient (Req. 6)** (e.g., in resisting bullying) but that **alien-norm shame (Req. 4)** is a key risk in behaviour policies.  

  Vote not for "guilt" or "shame" but for a policy whose *practices* are extensionaly clear, minimise collateral damage, and retain moral critique of the norms they enforce. The unresolved tension (solitary vs. alien-norm shame) means no theory is perfect — but the best will flag where trade-offs lie.
