prompt: |-
  I've been trying to work out where I actually stand on the extended mind thing by going case by case, because the abstract arguments just bounce off me. Here's where I end up, and I want to know whether there's one principle behind it or whether I'm just being inconsistent.

  - Notes app on my phone: fifteen years of notes, synced everywhere, full-text search, I check it without deciding to. Yes, part of how I think.
  - The same notes in a paper notebook in my bag that I physically flip through: yes, just as much. I don't think speed or searchability is what's doing the work.
  - A "second brain" app that auto-generates links and surfaces notes I'd forgotten, including connections I never made and half of which I wouldn't endorse: yes, but this is the one where the thing seems to be contributing structure I never put in, and that worries me.
  - A notebook from 2011 full of notes in a substitution cipher I invented and then lost the key to: no. It's mine, its in my drawer, and I can't get anything out of it anymore.
  - Voice memos where I talk a problem out loud, feel much clearer, and never listen back: I want to say no, but it bugs me. The talking itself did real cognitive work at the time. No storage, but very tight coupling in the moment.
  - My hearing aids. They do their own AI noise filtering and directionality, suppressing stuff I never notice was there. I say no, that's equipment, like glasses. But I can't say why that's different from the notebook, which also shapes what I end up with without me noticing.
  - My wife. Knows my passwords, finishes my sentences, remembers where I put things, I trust her completely and consult her automatically. No, obviously not — she's a separate person.
  - My LLM assistant at work. It has basically everything I've written, drafts in something close to my voice, and I genuinely think with it: I leave sentences half-finished and let it complete them. When I'm honest I want to say this one is closer to yes than my wife is, which seems insane, because she actually knows me and this thing is a next-token machine that doesn't know anything. But it's the case I keep going back and forth on.
  - A shared grocery list app with my wife, half the entries hers, some added by both of us at different times, none of it decided by me: no idea at all.
  - A hypothetical implanted memory prosthesis: yes, obviously. Which I know I'm not supposed to care about, since the skull isn't meant to be a magic boundary.

  The rule I'd been using was roughly: it's part of my mind if I consult it automatically and reliably, trust it without checking, and the information is available when I need it. That gets the first four right, but it says yes to my wife, which I reject, and I don't think it says anything about the hearing aid.

  So: give me a principle, or two or three candidates, that captures these verdicts, with the case that motivates each clause. I especially want its verdict on two cases I haven't put on the list: (a) my phone battery dies for six hours and I feel like I've lost part of my memory — does that mean it was part of my mind and I temporarily lost it, or does your principle predict I'm just confused about what's happening to me? and (b) my notes app contains addresses and opinions I wrote years ago and now disagree with, and I act on them anyway. And be straight with me about which of my verdicts I'd have to give up — particularly the wife-versus-assistant pair, since those two are structurally similar and I'm calling them differently.
reasoning: |-
  Okay, let me unpack this user's query. They're wrestling with the extended mind theory, but abstract arguments don't click for them—they need concrete cases. They've listed various scenarios—notes apps, paper notebooks, voice memos, hearing aids, their wife, an LLM assistant—and they want a principle that explains their intuitive yes/no responses. The challenge is consistency, especially between the wife and the LLM assistant, where their intuition conflicts with their own rule.

  First, I need to understand their current rule: automatic consultation, trust, and availability. It works for the first few cases but fails with the wife (she's a separate person) and doesn't address the hearing aid. The user's stuck on why the LLM feels more like part of their mind than their wife, despite the wife's deeper understanding. That's the core tension.

  Looking at their cases, the key differences seem to be about control and integration. The notes app and paper notebook are under their direct control—they decide what's stored and how it's accessed. The voice memo is tricky because the act of talking is cognitive work, but without playback, there's no stored extension. The cipher notebook is physically theirs but inaccessible, so it doesn't function as part of their mind anymore. 

  The hearing aid is interesting. They reject it as "equipment," but why? Unlike the notebook, it operates without their conscious input, filtering information before it even reaches their senses. But they don't classify it as extended mind. This suggests that for them, tools that alter perception before it enters the cognitive system don't count—it's more about augmentation during processing or storage, not pre-processing.

  The wife case is clear for them: separate agency. But the LLM assistant blurs lines because it's deeply integrated into their workflow, completing thoughts in real-time. Yet it lacks any real understanding. The shared grocery list is ambiguous because it's collaborative and not solely under their control. The implanted memory prosthesis is a clear yes, showing that the physical boundary (skull) isn't the issue.

  The user's deeper needs: They want a principle that resolves the wife/LLM inconsistency without abandoning their intuitions. They also care about real-world implications—like losing phone access feeling like memory loss, or acting on outdated notes. They might be seeking not just philosophical clarity but practical guidance on how to integrate technology into their cognitive life responsibly.

  So, I need to craft principles that address control, integration, and agency. The "functional delegation without independent agency" idea covers tools that act as transparent extensions. The LLM qualifies because it's used as a tool, despite its complexity, while the wife doesn't because she has her own goals and unpredictability. The hearing aid is excluded because it's pre-cognitive, not part of the cognitive process itself.

  For their extra cases: The dead phone battery would mean a temporary loss of extended mind function, matching their feeling of memory loss. Outdated notes acting automatically highlight a risk—it's still part of their mind, but with fidelity decay. They might need to accept that the LLM is more "mind-like" than the wife in this framework, or refine agency to include predictability over just independence.
answer: |-
  Based on your detailed case-by-case intuitions, a coherent principle emerges that prioritizes **functional control, cognitive integration, and the absence of independent agency**. Here's the framework that best captures your verdicts, with key clauses motivated by your sticking points:

  **The Principle:**
  **An external resource is part of your extended mind if:**
  1.  **It functions as a *transparent cognitive prosthesis*:** It's seamlessly integrated into your cognitive processes without needing conscious mediation *in use* (like biological memory or perception).
  2.  **You maintain *exclusive functional control*:** You dictate the input, access, and modification of the resource's *cognitive function*. It acts *on your behalf* without its own goals or unpredictable outputs.
  3.  **It reliably *extends core cognitive capacity*:** It serves a fundamental cognitive function (memory, information processing, thought articulation) and is reliably available *as needed*.

  **Applying the Principle to Your Cases (with Motivation for Clauses):**

  1.  **Notes App / Paper Notebook:** **YES.** *Motivates Clause 1 & 3.* Automatic consultation, no conscious mediation in access, reliably extends memory. Clause 2: You control input and access.
  2.  **"Second Brain" App (Auto-Linking):** **YES (but qualified).** *Motivates Clause 1 & 3.* Deeply integrated, extends associative memory. *Qualifies Clause 2:* Its outputs aren't fully dictated by you, introducing potential "alien" structure. Your worry highlights the tension – it *mostly* acts on your behalf but has algorithmic "initiative."
  3.  **Cipher Notebook:** **NO.** *Motivates Clause 3.* Fails reliable availability/functionality. Blocks core cognitive extension.
  4.  **Voice Memos (Never Listened):** **NO.** *Motivates Clause 1.* The *act* of talking is cognition, but the *recording* isn't integrated as a transparent prosthesis. Access requires conscious effort (finding, playing). Clause 3 fails: Not reliably available *as a memory resource*.
  5.  **Hearing Aids:** **NO.** *Motivates the *Cognitive Capacity* focus of Clause 3.* They are *peripheral sensory enhancers*, not cognitive processors or stores. They shape *input* to cognition but don't *perform* cognition (memory, reasoning, association). They are like glasses – enabling biological systems to function better, not acting *as* cognitive systems themselves. (Contrast with the notebook, which *is* performing a storage/retrieval function).
  6.  **Your Wife:** **NO.** *Motivates **Clause 2 (Exclusive Functional Control) & Agency Distinction***. She has her own goals, agency, unpredictability, and independent cognition. You cannot dictate her inputs, outputs, or access to information stored "in" her. She is a collaborator, not a prosthesis.
  7.  **LLM Assistant:** **YES (with caveats similar to "Second Brain").** *Motivates Clause 1 & 3 powerfully, challenges Clause 2.* Deep integration ("think with it," half-finished sentences), extends core reasoning/articulation capacity. *Caveat:* Its outputs aren't fully controlled by you (it generates based on training, not solely your intent). **This explains your intuition vs. your wife:** The LLM, despite lacking understanding, is *functionally* integrated as a tool *you* control the use of in the moment for cognitive extension. Your wife is an independent agent you *interact* with. The LLM feels like a more direct cognitive tool.
  8.  **Shared Grocery List:** **NO.** *Motivates **Clause 2 (Exclusive Functional Control)***. You don't control the input (wife adds items), output (it reflects joint/others' decisions), or its function (it's a shared planner, not *your* memory prosthesis). It serves a collective, not purely individual, cognitive function.
  9.  **Implanted Memory Prosthesis:** **YES.** *Motivates the irrelevance of physical location (Skin/Skull) when Clauses 1-3 are met.* Functions transparently as memory, under your control, extending core capacity.

  **Addressing Your Specific Questions:**

  *   **(a) Dead Phone Battery:** **Your feeling is valid (temporary loss).** The principle predicts this. The notes app *was* functioning as part of your extended mind (Clauses 1-3 met). Its sudden inaccessibility is akin to temporary amnesia affecting a specific memory system. You *have* lost access to a functional part of your cognitive apparatus.
  *   **(b) Acting on Outdated Notes:** **It *was* part of your mind, and this highlights a risk.** The notes are accessed automatically and trusted (Clause 1 & implied trust), extending your memory (Clause 3). The outdated info is a *fidelity* issue within your extended system, similar to flawed biological memory. You acted based on information retrieved *from your own extended cognitive resource*, just as you might misremember.

  **What You Might Need to Reconsider:**

  1.  **The LLM Assistant vs. Your Wife:** Your principle *requires* you to accept the LLM as closer to "yes" than your wife. The structural similarity (consultation, trust, information provision) is overridden by the **fundamental distinction in agency and control** (Clause 2). The LLM, while complex and generative, is still a *tool* you wield for cognitive extension. Its outputs are unpredictable *in detail* but predictable *in function* (completing sentences, drafting text *based on your input*). Your wife's cognition is fundamentally independent. **Your intuition that the LLM feels more like part of your cognitive process than your wife does is consistent with the principle.** Calling the LLM "yes" doesn't mean it *is* a mind, but that it *functions* as part of *your* extended cognitive system.
  2.  **The "Second Brain" App:** Your worry about alien structure is valid under Clause 2. The principle forces a "yes" but highlights the caveat – it's integrated *despite* some lack of exclusive control over outputs. You might need to accept this qualified "yes" or refine Clause 2 further, but this risks excluding it or making the principle too narrow.
  3.  **Hearing Aids:** Your "equipment like glasses" intuition is preserved by focusing on *cognitive capacity extension* (Clause 3) rather than mere coupling or shaping. They enable biological cognition but don't perform cognitive functions *themselves*.

  **Conclusion:**

  Your core principle is **Functional Delegation of Core Cognition:** External resources become part of *your* mind when you delegate fundamental cognitive functions (memory, processing, articulation) to them in a way that is transparent, reliable, and under your functional control, without them possessing independent agency. This explains the wife/LLM distinction (agency/control), the hearing aid rejection (not core cognition), the dead phone feeling (temporary system loss), and the outdated notes action (system fidelity issue). It accepts the qualified "yes" for generative AI tools, acknowledging their deep integration while flagging the control caveat. You are remarkably consistent once agency and the *type* of function delegated (core cognition vs. sensory input) are prioritized.
