answer: |-
  ## Sestina for the Aggregates and the Split Flame

  This pattern holds, though nothing stays the same –
  the shifting dance of transient **rupa**, form,
  the sting, the sweetness, passing **vedana**.
  The naming, recognition – fleeting **sanna**.
  The ceaseless push, the willed **sankhara**.
  And knowing, knowing only – **vinnana**,
  dependent, risen, not a lord, **vinnana**,
  propped up like reeds. This flux has earned its name
  as process, not a self. I grasp **sankhara**,
  observe the rise and fall of every **rupa**,
  the flickerings of thought and sense, **sanna**,
  the transient ache or ease of **vedana**.

  I trace the contours of my **vedana**,
  accept the logic: no behind **vinnana**,
  just this bare knowing of the **sanna**,
  this constant change. And yet, the whispered name
  clings like a scent to shifting **rupa**.
  Whose striving fuels the path? Whose **sankhara**?

  For whom the effort? Whose strong **sankhara**
  seeks peace beyond the tug of **vedana**?
  If liberation comes, to what dark **rupa**,
  or cooling ember of **vinnana**?
  If no one crossed, why bear the path’s harsh name?
  Whose story ends? Whose gathered **sanna**?

  The mind constructs a fragile **sanna**:
  a single thread spun through **sankhara**,
  a life laid claim to by a name.
  But watch the dying candle’s **vedana** –
  its final heat ignites not one **vinnana**,
  but *two* new tongues of hungry **rupa**.

  Two separate flares of bright **rupa**,
  each with its own fresh heat, **sanna**,
  each with its own brief, knowing **vinnana**.
  Both sprung from that last act, **sankhara**.
  Both feel the burn, the fresh **vedana**.
  Neither the old flame. Nor its name.

  Whose path? Whose peace? The empty name
  dissolves like smoke above the **rupa**.
  The question burns a sharp **vedana**.
  The pattern holds, the shifting **sanna**.
  The causes turn, the **sankhara**
  persist, dependent **vinnana**.

  No tenant freed within **vinnana**,
  just **sankhara** seeking cease, no name.
  The split **rupa**, new **vedana**,
  fresh **sanna** born from spent **sankhara**.
  Whose liberation? **Vinnana**
  asks, while **rupa**, **sanna**, **vedana** turn.

  **Whose peace? asks **vinnana**, bright **rupa** burns.**
  **Whose path? **vedana** fades, **sanna** turns.**
  **New **sankhara** rise, the old name spurns.**
