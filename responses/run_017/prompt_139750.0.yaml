answer: |-
  **MEMORANDUM**  
  **TO:** Governing Board, Association of American Novelists  
  **FROM:** [Your Name], External Advisor  
  **RE:** Recommendation on Kiln Head Petition (Motion B: Censure + Refer Code Amendment)  

  **Recommendation:** Adopt Motion B—censure the author for failing to engage Kiln Head as a living community, refer the reply-mechanism proposal to a committee for rigorous testing, and reject Motions A and C.  

  ### Reasons for Recommendation  
  1. **The core failure was ethical, not legal or creative.** The author’s 11-day engagement with Kiln Head—recording conversations covertly, using real surnames, and centering a traumatic unsolved crime—exploited thin mediation. With no local paper, publisher, or countervailing voice, her novel became constitutive: it now shapes outsiders’ treatment of residents (e.g., true-crime tourism) and forces the village to reconcile its identity with a fictionalized trauma. This isn’t mere reputational harm (which tort law could address) or cultural property (which implies ownership). It’s *narrative dispossession*—where a community’s agency in its own story is erased. The author’s claim that "communities hold no rights" ignores that Kiln Head residents *are* rights-holding individuals collectively disempowered by her method.  

  2. **Censure is proportionate and precedential.** Our code binds members to ethical engagement in nonfiction (e.g., crediting sources). While fiction demands different standards, the author’s lack of transparency—failing to disclose her role or intent—violated the spirit of honesty we expect. Censure signals that using thinly mediated communities as raw material without accountability damages the profession’s integrity. Contrast this with our police-association decision: occupational groups have unions, PR teams, and media access to rebut depictions. Kiln Head has none.  

  3. **The reply mechanism is conceptually sound but operationally flawed.** A community-curated response in paratext (e.g., an afterword) *is* the right remedy for constitutive harm—it restores agency without veto. Motion C’s blanket adoption, however, ignores critical pitfalls:  
     - Who defines "identifiable living communities"? A Manhattan precinct isn’t Kiln Head.  
     - Who speaks for the community? The council? The dissenting cousins? The history society?  
     - How do we verify "thin mediation"? (Require data on local media infrastructure?)  
     Motion C’s vagueness risks weaponization or bureaucratic bloat. A committee must draft thresholds (e.g., population under 5,000, no active local media) and selectors (e.g., municipal governments + affirmed community groups).  

  4. **Motion A (dismissal) is morally indefensible.** To argue that "the Association has no standing over what members imagine" is to endorse a world where novelists extract from vulnerable places with impunity. Kiln Head isn’t claiming royalties or veto—it seeks minimal parity in storytelling. Rejecting this outright would declare that communities like it, precisely because they are small and unmediated, deserve no ethical consideration from our profession.  

  ### Proposed Principle for Committee Referral  
  *"For fiction set in identifiable, thinly mediated communities (defined by population under 5,000 and absence of local news/publishing infrastructure), members must engage transparently with residents during research. If the work becomes the dominant public narrative about the community, the Association may require inclusion of an unedited community response in future editions, with the community’s delegate selected through a recorded municipal process."*  

  ### Strongest Case Against  
  **Motion A (Dismissal), stated forcefully:** *"Novelists are sovereign creators who owe nothing to the real-world settings they cannibalize; communities like Kiln Head are mere backdrops, and their suffering under true-crime tourism or distorted history is irrelevant to art. If individuals are harmed, let them sue—otherwise, the Association’s only duty is to protect absolute imaginative license, even when it leaves human wreckage in its wake."*  

  ### Confidence Assessment  
  - **High confidence** in censure. The author’s opacity breached professional norms akin to nonfiction bad faith.  
  - **Medium confidence** in thin mediation’s validity. This is a substantive moral claim: power imbalances matter, and Kiln Head’s lack of voice *makes* the depiction constitutive. If the board rejects this, censure still stands, but the committee referral loses urgency.  
  - **Low confidence** in operational details. The reply mechanism *must* be stress-tested (e.g., against a Bronx neighborhood or college town). If the board insists on immediate action, I’d amend Motion B to add: "Committee to report within 6 months; interim suspension of similar petitions."  
  - **If this framing fails:** The board should adopt Motion B *without* the reply principle and issue a standalone censure. Doing nothing (Motion A) abdicates ethical leadership; adopting Motion C unvetted risks chaos.  

  **Final note:** The Association *is* the right body. We set professional standards. Kiln Head’s petition isn’t about property—it’s about respect in a fractured media ecology. Ignoring it tells vulnerable communities they are only raw material, not participants in culture.  

