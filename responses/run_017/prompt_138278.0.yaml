  I need to adjudicate this exchange about Hempel's raven paradox. Let me start by recalling the paradox. The paradox is that "all ravens are black" is logically equivalent to "all non-black things are non-ravens." So, observing a white shoe, which is a non-black non-raven, should confirm that all non-black things are non-ravens, and thus confirm that all ravens are black. But intuitively, a white shoe doesn't seem to confirm that ravens are black; it seems irrelevant.

