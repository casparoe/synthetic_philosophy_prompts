prompt: |-
  I am a professor of philosophy and, this year, the chair of my university's committee on conflicts of interest and research integrity. We adjudicate some fifty cases a year — most of them trivial, a few capable of costing us a campus licence, a researcher's safety, or a colleague's career — and we have been asked to replace our current guidance, which is little more than a gift register with a monetary threshold, with an actual protocol. The protocol has to serve our home campus and two campuses abroad, where the surrounding political economy is clientelist: permits, access to research sites, and official goodwill run through patrons and brokers; a gift is what acknowledges a relationship rather than what buys a favour; and refusing one can be a grave affront rather than a punctiliousness. Some colleagues hold that our home rules simply travel and that anything else is relativism dressed up as cultural sensitivity. Others hold that an impersonal-office ethic applied in such a setting makes our research impossible and punishes local staff for the way their own society works. Both cannot be right, and "when in Rome" is not a procedure.

  What I need is a decision procedure the committee can actually run: the questions in order, what counts as a sufficient answer to each, the points at which the answer is simply no, and the points at which it must stop and hand the decision to a person because what remains is a question of values rather than of fact. It has to work in about twenty minutes, over email, by academics with no legal training, producing one recorded paragraph of reasoning that our general counsel's office can sign off on asynchronously within five days; it has to be usable by a colleague who has never read a line of political philosophy; and it has to say what to do when the relevant fact cannot be had, since we usually cannot know why someone gave something.

  The crude tests we have tried do not work, and I would like you to say why before replacing them. Publicity — would you mind this being known? — misfires where gift-giving is public and expected. A value threshold misfires in both directions: a cheap gift can be the visible token of a clientelist relationship, while an expensive one, a funded conference or a studentship, can be entirely at arm's length. My suspicion is that what does the work is neither size nor secrecy but whether the transfer redirects a practice away from the end that makes the office worth having — admissions is for admitting those qualified to study, peer review for assessing the quality of work, procurement for getting the building built. If that is right, the procedure should turn on something like whether the giver is acquiring a claim on a good the officeholder has no right to dispose of, and whether the transfer would survive that officeholder's leaving office tomorrow; if it is not right, say so and build it on something better. It should also return more than yes and no: what is prohibited, what is permitted, what is permitted only on the record, what our rules permit but should not — and, the category I care about most, what is not a corruption question at all but a question of justice or of whether our institution should be operating there as it does, and is therefore nothing this committee has authority to decide.

  Apply it to three live cases. First: an official who must renew the licence of our campus abroad mentions that his son has applied to the Master's programme whose admissions I chair, and asks me to look at the file. Second: six months after graduating with a First, a former student's family sends me a handwoven rug worth roughly two weeks of local wages, against a rule forbidding gifts above a nominal value. Third: a publisher whose introductory textbook we are deciding whether to require, at the students' expense, offers to fund a three-day curriculum retreat for my department at a coastal hotel. I expect the procedure to give me an answer in the third case that I will not enjoy; give it anyway. Finally, tell me honestly where a procedure of this kind will misfire: which innocent arrangements it will flag, which real corruptions it will miss because they present as hospitality or gratitude, and which questions it is not even able to ask.
reasoning: |-
  Hmm, this is a fascinating and complex ethical challenge from a philosophy professor chairing a conflicts of interest committee. The user needs a practical decision protocol that can handle cross-cultural gift-giving norms while maintaining research integrity across clientelist environments.

  The core tension here is between universal ethical principles and cultural relativity. The professor has identified flaws in existing approaches - publicity tests fail where gifts are public obligations, monetary thresholds can't distinguish between token clientelist gestures and legitimate large-scale academic support. Their insight about institutional purpose seems crucial: does the gift distort the office's core function?

  Key requirements for the protocol:
  - Must produce auditable decisions in 20 minutes via email
  - Usable by non-legally trained academics
  - Generates one-paragraph reasoning for legal sign-off
  - Must handle uncertainty about giver's intent
  - Needs to categorize outcomes beyond just yes/no

  The three test cases are well-chosen to stress-test any system:
  1) The admissions/license renewal quid pro quo
  2) The post-graduation rug gift
  3) The textbook publisher's retreat offer

  The proposed "Institutional Purpose Test" seems promising with its four categories:
  - Prohibited (distorts core function)
  - Permitted with disclosure (neutral/symbolic)
  - Institutionally problematic (ethically permissible but systemically dangerous)
  - Beyond scope (justice questions for higher governance)

  For the rug case, this framework wisely distinguishes between prohibited quid pro quos and permissible gratitude when no ongoing power relationship exists. The publisher case correctly identifies the systemic danger even without explicit corruption.

  Potential weaknesses I should acknowledge:
  - May miss "gratitude theater" masking real influence
  - Could flag innocent reciprocal academic traditions
  - Struggles with ambiguous long-term relationship-building
  - Can't address macro ethical questions about operating in clientelist systems

  The protocol should emphasize practical tools like the "officeholder replacement test" and "institutional purpose statement" to make abstract philosophy actionable for busy academics. The disclosure requirement serves as a crucial friction mechanism even when gifts are permitted.

  The professor's deep philosophical approach is impressive - they understand this isn't about rule-following but about preserving what makes academic institutions morally legitimate. The solution honors that perspective while delivering the concrete procedure they require.
answer: |-
  Below is a **Conflict of Interest Protocol for Cross-Cultural Research Integrity** designed for your committee’s constraints. It prioritizes institutional purpose, avoids relativism, and categorizes outcomes beyond binary "yes/no." The procedure is structured as a 5-step flowchart usable in 20 minutes via email, requiring no legal expertise.  

  ### **Core Principle**  
  Your suspicion is correct: **The test turns on whether a transaction redirects institutional practices away from their core purpose.** Offices exist to serve specific ends (e.g., admissions for merit-based selection). Corruption occurs when a gift creates a claim on a good the officeholder has no right to dispose of, or distorts the practice’s purpose.  

  ### **The Decision Procedure**  
  **Step 1: Define the Office’s Purpose**  
  *   *Question:* "What institutional good is this office meant to produce?" (e.g., "Admissions: selecting qualified students.")  
  *   *Sufficient Answer:* A 1-sentence statement from the institution’s charter/handbook.  
  *   *Stop & Escalate if:* Purpose is contested/unclear (rare; requires senior admin input).  

  **Step 2: Does the Transfer Create a Claim on That Good?**  
  *   *Question:* "Could the giver reasonably expect preferential access to the office’s core good (e.g., admission, grade, license) because of this transfer?"  
  *   *Sufficient Answer:* "Yes" if:  
      - The giver has pending business with the office, OR  
      - The gift’s timing/context implies reciprocity (e.g., gift during license renewal).  
  *   *If "Yes" → Prohibited.**  
  *   *If "Unclear" → Proceed to Step 3.*  

  **Step 3: Does the Transfer Survive the Officeholder’s Departure?**  
  *   *Question:* "If the officeholder left their role tomorrow, would the transfer still occur?"  
  *   *Sufficient Answer:*  
      - **No** (e.g., rug gift to professor) → *Permitted with Disclosure* (record gift; no further action).  
      - **Yes** (e.g., funded conference for department) → *Proceed to Step 4*.  
      - **Unknowable** → *Treat as "No" but flag for disclosure*.  

  **Step 4: Does the Transfer Advance or Replace Institutional Purpose?**  
  *   *Question:* "Does this resource enable the office’s core purpose, or replace it with the giver’s priorities?"  
  *   *Sufficient Answer:*  
      - **Advances** (e.g., generic research grant) → *Permitted with Disclosure*.  
      - **Replaces** (e.g., publisher funding curriculum retreat to sway textbook choice) → **Institutionally Problematic** (permitted by rules but systemically dangerous; recommend institutional review).  
      - **Ambiguous** → *Permitted with Disclosure + Public Acknowledgment*.  

  **Step 5: Is This a Corruption Question?**  
  *   *Question:* "Is the core concern about distorting an office’s function, or about broader justice/operational ethics?"  
  *   *Sufficient Answer:*  
      - Concerns about clientelism making research impossible → **Beyond Scope** (escalate to senior leadership).  
      - Concerns about equity (e.g., "local staff are penalized") → **Beyond Scope** (requires policy review).  

  ---

  ### **Application to Cases**  
  **Case 1: Official’s Son’s Admission File**  
  - **Step 1:** Admissions purpose = merit-based selection.  
  - **Step 2:** **Yes** – Official implies reciprocity during license renewal. Creates claim on a good (admission) I have no right to dispose of preferentially.  
  - **Outcome:** **Prohibited.** *Recorded Reasoning:* "Request ties license renewal (external pressure) to admissions review (core office function), creating improper claim on a merit-based process."  

  **Case 2: Rug from Former Student’s Family**  
  - **Step 1:** Teaching office purpose = education/evaluation (already fulfilled).  
  - **Step 2:** **No** – No pending business; graduation completed.  
  - **Step 3:** **No** – Gift is personal; unlikely if you left the role.  
  - **Outcome:** **Permitted with Disclosure.** *Recorded Reasoning:* "Gift acknowledges past relationship, no ongoing claim on office goods. Disclose to avoid appearance issues."  

  **Case 3: Publisher-Funded Curriculum Retreat**  
  - **Step 1:** Procurement/curriculum purpose = impartial selection of educational materials.  
  - **Step 2:** **Unclear** → Proceed.  
  - **Step 3:** **Yes** – Retreat would occur even if you left (departmental benefit).  
  - **Step 4:** **Replaces Purpose** – Retreat funding risks replacing impartial review with publisher influence.  
  - **Outcome:** **Institutionally Problematic.** *Recorded Reasoning:* "Creates obligation to publisher during active procurement decision, replacing impartial assessment with reciprocity. While technically permitted by value rules, it endangers institutional purpose. Recommend rejecting funding or withdrawing from decision."  

  ---

  ### **Where the Protocol Misfires**  
  1. **False Positives (Innocents Flagged):**  
     - **Gratitude Rituals:** Public gifts in clientelist settings (e.g., ceremonial fruit basket to entire department) may be flagged as "claims" (Step 2) despite being non-actionable social gestures.  
     - **Long-term Relationships:** Broker relationships that *enable* research (e.g., tribal elder’s annual gift for site access) may appear as "claims" but are unavoidable operational necessities.  

  2. **False Negatives (Corruptions Missed):**  
     - **Gratitude Theater:** Lavish "thank you" gifts *after* a decision (e.g., rug *after* license approval) evade Step 2 but incentivize future favors.  
     - **Hostility to Refusal:** Where rejecting gifts triggers retaliation, the protocol can’t capture the coercion risk (escalates to "Beyond Scope").  

  3. **Unaskable Questions:**  
     - **Structural Complicity:** "Does operating in this clientelist system inherently corrupt our purpose?" (Beyond Scope).  
     - **Power Imbalances:** "Does accepting small gifts from vulnerable local staff exploit poverty?" (Requires justice review).  

  ---

  ### **Why Prior Tests Failed**  
  - **Publicity Test:** Assumes secrecy = corruption. Fails where gifts are *publicly expected* (e.g., a broker’s fee visible to all).  
  - **Value Threshold:** Ignores that low-value gifts (e.g., a $10 meal) can be deeply coercive in clientelism, while high-value transfers (e.g., a $50k grant) can be arm’s-length.  

  ### **Strengths of This Protocol**  
  - **Anti-Relativist:** Core purpose is universal (an admissions office must prioritize merit globally). Culture affects *how* gifts signal claims, not whether claims corrupt.  
  - **Actionable:** Uses concrete, office-specific questions.  
  - **Transparent Reasoning:** Outputs auditable paragraphs focused on institutional function.  
  - **Graceful Failure:** Flags systemic risks ("Institutionally Problematic") and non-corruption dilemmas ("Beyond Scope").  

  This procedure forces clarity: it doesn’t ask *why* a gift was given, but whether it **objectively creates a claim on an institutional good**. It accepts that some problems (e.g., "should we work here?") are beyond a committee’s remit—and that honesty is better than false precision.
