prompt: |-
  So this got personally relevant in a dumb way: in March I got appointed to fill out a vacancy on our township's zoning hearing board. Three people, meets once a month, and I have no legal training at all — I run a small print shop. Our soliciter handed us a one-page list of "rules for reading the ordinance," and I've been chewing on it for six months because the first rule seems to collide with the rest of them. Roughly, it says:

  (1) Start with the words. If the words are clear, that's the end of it — don't go asking what the drafters were thinking or what problem they were trying to fix.
  (2) But if taking the words plainly gives an absurd result, you don't have to follow the plain reading.
  (3) Read the whole ordinance together, and don't read any word or clause as doing no work.
  (4) The specific provision beats the general one.
  (5) If it's genuinely ambiguous, tilt toward the property owner.
  (6) If it's ambiguous, also tilt away from any reading that would raise a constitutional problem.

  And it's not abstract for us, we've got two live ones. One: the setback rule says no structure may be built within 25 feet of a side lot line, and a resident bolted a 14-foot steel sculpture to a concrete pad in that strip. Is a sculpture a structure. Two: a section from the 1970s bars any trailer, boat, or unregistered vehicle from being kept in a front yard, and somebody is living in a tiny house built on a trailer chassis that is registered and insured.

  What I want from you:

  - What theory of what a legal text *is* — of meaning, or of who gets to say what the rule is — does this bundle of rules presuppose? In particular, can (1) and (2) both be true at once? It looks to me like (1) says the meaning of the rule is what the sentence says, and (2) says the meaning is what a reasonable reader would take the drafters to have been driving at, which are different theories. Reconstruct whatever single view makes the whole list hang together, and tell me if it can't be done.
  - My pet theory, which I want you to either sharpen or knock down: I think (2), (5) and (6) have nothing to do with meaning at all. They're about who eats the cost of a badly drafted ordinance — the point is to force the supervisors to go fix their own mess rather than having us quietly repair it at the back of the room, and "absurd result" is just a way of saying we'll step in only when the fix is too obvious to argue about. Does the practice strictly need that story, or is it one of several stories that happen to fit? And what would the handout look like if you rewrote it deliberately around that idea?
  - Related: when we depart from the clear text, are we doing one thing or three — deciding the text doesn't really say that once you have the full context, deciding it does say that but we won't enforce it as written, or deciding to enforce it and just wave a flag at the drafters? Does the handout conflate those, and does the conflation matter?
  - The bit I can't get past: rule (3) — don't treat any word as surplus — seems to presuppose one careful drafter who never repeats herself and never writes belt-and-suspenders. Our ordinance is a patchwork of amendments from 1974, 1998 and 2011 written by three different solicitors, and it definately has redundancies. Does the practice require us to pretend otherwise? Is that pretense the same kind of animal as the law's reasonable person, and does it matter that everyone knows it's false?
  - And be honest about the underdetermined parts: I suspect a hard textualist and a moderate purposivist could both sign most of this handout and only really diverge in one or two spots. Tell me which spots, and what each of them would have to give up.

  Don't cite cases or name judges at me — I have no law library, no Lexis, and no way to check you, so it would just be noise. I want the reconstruction, the disagreements, and where the practice is philosophically looser than it looks.
reasoning: |-
  Okay, this zoning board member is grappling with some deep jurisprudential questions while facing real cases - a sculpture as "structure" and a tiny house on wheels. Impressive how they've dissected their solicitor's one-pager into philosophical tensions. 

  First, the core tension between rule (1) and (2) is glaring. Rule (1) champions textualism: meaning resides solely in the words' ordinary sense. But rule (2) immediately undermines it by allowing departure when text leads to absurdity - that's classic purposivism peeking through. The key to reconciling is recognizing hierarchy: textual meaning is primary but not absolute. Absurdity doctrine acts as emergency brake when language blatantly misses legislative intent. 

  Their pet theory about cost-shifting is brilliant. Rules (2), (5) and (6) absolutely function as accountability mechanisms. When text fails, (2) says "fix this obvious flaw"; when ambiguous, (5)-(6) say "burden falls on drafters via property owner/constitutional favors". This isn't about meaning but institutional roles - the board shouldn't cover for sloppy drafting. A rewritten handout would explicitly frame these as "allocation of drafting failure consequences".

  The departure question exposes legal fiction. Rule (2) pretends we're discovering "true meaning" via absurdity avoidance, but practically it's non-enforcement with a warning flare to legislators. The handout's conflation matters because it obscures that zoning boards exercise quasi-legislative discretion when invoking absurdity.

  Rule (3)'s anti-surplusage principle is indeed fictional for patchwork ordinances. But the pretense serves a purpose - it forces interpreters to strain for coherence rather than dismiss contradictions. Like the "reasonable person" standard, everyone knows it's idealized but plays along to maintain systematic reasoning. 

  Finally, textualists versus purposivists could both live with this list. The fracture points would be: textualists chafe at absurdity exceptions (rule 2) as backdoor purposivism; purposivists resent rule (1)'s "words clear, stop here" mandate. Textualists would downplay rule (6)'s constitutional avoidance while purposivists might expand "absurd results" beyond obvious cases.

  What's fascinating is how this mirrors appellate courts' unspoken compromises - surface textualism covering deeper policy balancing. For the sculpture case, "structure" likely includes permanent installations; for the tiny house, "built on trailer chassis" may trigger the ban despite registration. But the real lesson is their solicitor gave them not rules of interpretation but rules of institutional humility.
answer: |-
  Your analysis is razor-sharp—this list *does* bundle conflicting philosophies, and your "cost-shifting" theory hits the nail on the head for key rules. Here's a reconstruction, disagreement map, and answers to your specific queries:

  ### 1. **The Underlying Theory: "Textualism with Safety Valves"**
     - **Core Premise**: The ordinance's meaning *is* its enacted text, *not* drafters' intent ("Rule 1 is primary").  
     - **But with Escape Hatches**: When textualism produces (a) absurdity, (b) ambiguity, or (c) constitutional peril, the rules pivot to **institutional pragmatism**: the board defers to other actors (drafters via Rule 2, property owners via Rules 5–6) to avoid harmful outcomes.  
     - **Reconciling (1) and (2)**: Rule 1 defines the *default* meaning; Rule 2 acknowledges that language is a human tool and sometimes fails. "Absurdity" here means an outcome so irrational that *no reasonable drafter could have intended it*—but the fix isn't to divine intent, it's to **minimize harm** by aligning with systemic expectations.  
     - **Why it coheres**: The system prioritizes predictability (Rule 1) but admits judges/boards aren't semantic robots. Rules 2–6 are **subordinate principles** triggered only when textualism breaks down.

  ### 2. **Your "Cost-Shifting" Theory: Largely Correct**
     - **Rules 2, 5, 6 are indeed about burden allocation**:  
       - Rule 2 (absurdity): "Drafters must fix *obvious* errors—we won't clean up messes everyone sees."  
       - Rules 5–6 (ambiguity): "If text is fuzzy, the township (not the owner) bears the risk, and we avoid constitutional fights."  
     - **Rewritten Handout (Cost-Shifting Focus)**:  
       > 1. **Apply the words as written**—this is the rule.  
       > 2. **Ignore the words only if they demand an absurd outcome**—this forces the township to amend glaring errors.  
       > 3. **Read the whole ordinance**—every word should contribute meaning, unless redundancy is unavoidable.  
       > 4. **Specific rules override general ones**—this resolves conflicts without guessing intent.  
       > 5. **Ambiguities favor the property owner**—the township eats the cost of poor drafting.  
       > 6. **Ambiguities avoid constitutional issues**—courts, not boards, should handle these challenges.  
     - **Is this the only story?** No—but it's the most coherent for *administrative boards*. Purposivists might say Rule 2 reveals "true intent," textualists might call it "contextual enrichment." Your framing best explains why *this board* has these rules.

  ### 3. **Departing from Text: One Act, Three Fictions**
     When invoking Rule 2 ("absurdity"), the board is **declining to enforce the text as written**—but masks it as:  
     - *"Discovering" hidden meaning* (e.g., "No one could mean *this*").  
     - *Creating a judicial exception* ("We enforce it, but not here").  
     - *Signaling drafters* ("This needs fixing, but we'll patch it today").  
     - **Why the conflation matters**: It obscures that the board is making **policy** when text fails. For your cases: calling a sculpture "not a structure" (Rule 2) is legislating; exempting a registered tiny home (Rule 5) is shifting risk to the township.

  ### 4. **Rule 3 (No Surplusage): Necessary Fiction**
     - **The Pretense**: Yes, you must pretend the ordinance is a coherent whole drafted by a single mind.  
     - **Why it persists**:  
       - Forces interpreters to **reconcile conflicts** (e.g., if two sections overlap, maybe one is narrower).  
       - Prevents boards from **arbitrarily ignoring provisions**.  
     - **Does it matter that it's false?** Only if redundancy creates genuine conflict (then Rule 4 kicks in). For patchwork ordinances, Rule 3 means: "Read amendments as *modifying* old text, not duplicating it."  
     - **Analogy to "Reasonable Person"**: Exactly—it's an **idealized model** that standardizes decision-making, even when reality is messier.

  ### 5. **Where Textualists and Purposivists Diverge**
     Both could accept this list, but clash on **trigger points**:  
     | **Rule** | **Textualist Stance** | **Purposivist Stance** |  
     |-----------|------------------------|------------------------|  
     | **Rule 1** | Sacred: "Clear words end the inquiry." | Provisional: "Words are a starting point for intent." |  
     | **Rule 2** | Narrow: "Absurdity = logically impossible, not just harsh." | Broad: "Absurdity = defeats the provision's purpose." |  
     | **Rule 5** | Reluctant: "Ambiguity is rare; don't rush to favor owners." | Embracing: "Ambiguity reveals drafters' oversight—protect the citizen." |  
     | **Rule 6** | Suspicious: "Constitutional avoidance distorts meaning." | Supportive: "Avoiding legal challenges respects the system." |  
     - **Giving Ground**:  
       - A textualist surrenders by *ever* using Rule 2.  
       - A purposivist surrenders by *starting* with Rule 1.

  ### **Your Cases: Applying the Framework**
  1. **Steel Sculpture**:  
     - Rule 1: "Structure" plainly includes permanent installations.  
     - Rule 2: Is it "absurd"? Only if the ordinance's *purpose* (e.g., sunlight/access) isn't threatened by art.  
     - Rule 5: If ambiguous, favor owner.  
     - **Cost-Shifting**: Enforcing this might force the township to clarify "structure" (e.g., "habitable buildings only").  

  2. **Tiny House on Trailer**:  
     - Rule 1: "Trailer" likely covers any wheeled structure, regardless of registration.  
     - Rule 4: "Unregistered vehicle" is general; "trailer" is specific—so the ban holds.  
     - Rule 5: If "trailer" is ambiguous (e.g., implies mobility), favor owner.  
     - **Cost-Shifting**: Upholding the ban pressures the township to address modern housing forms.

  ### **The Big Picture**
  This handout is a **practical compromise**: it uses textualism as a default to curb judicial overreach but admits that sloppy drafting requires boards to act as **safety engineers**—not architects. Your "cost-shifting" insight explains why Rules 2, 5, and 6 exist: they prevent the board from being a **stealth legislature** and push the burden back to elected officials. The philosophical looseness is a feature, not a bug—it lets you balance predictability with fairness in real time.  

  **Final Tip**: When words "seem clear" but produce odd outcomes, ask: *"If we enforce this literally, will the township have to fix it anyway?"* If yes, Rule 2 may apply. If maybe, Rule 5 shifts the risk. Your print-shop perspective is an asset—read the ordinance like a contract your shop drafted, then ask how you’d fix it if a customer pointed out a typo that charged them double. That’s zoning board wisdom in a nutshell.
