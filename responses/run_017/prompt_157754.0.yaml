prompt: |-
  I'm part of a small reading group on AI governance, and we keep circling around a puzzle that I've come to think is really about the difference between worst-case and average-case guarantees, though nobody in the group uses those words. So let me describe the practice I want understood. When a developer decides that a general-purpose model is safe enough to release to a broad population, the artifact it actually produces is a bundle: average scores on benchmark suites, side-by-side win rates from human preference ratings, qualitative red-team writeups showing the model refusing some of the nastiest prompts the testers could devise, and a prose argument that the model's dangerous capabilities sit below thresholds the developer has set for itself. Almost nobody claims a bound on the worst thing the model will do once millions of people interact with it over many months, and nobody quite claims an average-case guarantee either, since the benchmarks don't sample the deployment distribution. This sits oddly next to how other safety-critical fields proceed, according to the engineers in my group: you don't certify a design for flight or license a reactor by reporting mean performance plus a few vivid anecdotes, you do it by arguing that the probability of catastrophe falls below a hard number, under assumptions chosen so that everything which can go wrong is assumed to go wrong together.

  The thing I can't reconcile is that the release process seems to run on both standards at once. Aggregated benchmark numbers are treated as the headline evidence that the system is fine, and yet a single red-team transcript that gets a model to do something prohibited is treated as capable of blocking release outright, or at least of forcing a retraining cycle. One bad case is apparently decisive in one part of the process and irrelevant next to the average in another. My friend's suggestion, which I'd like you to take apart rather than simply adopt, is that the real axis isn't worst versus average but guarantee-per-query versus guarantee-per-deployment: once a system faces millions of draws from a heavy-tailed input distribution, the bad case isn't a remote possibility you might never encounter, it's a case you should expect to be realized somewhere in the deployment about as often as its per-query probability times the number of draws, so a per-query average guarantee is nearly no guarantee at deployment scale and a per-query worst-case guarantee is really a per-deployment average guarantee in disguise. He then proposes a middle notion, a quantile guarantee: don't bound the maximum loss, bound the loss at the 99.99th percentile of the actual deployment distribution and audit against that. My worry is that this collapses back into the average case, because the distribution you'd need has to be estimated from data you don't have, and worse, may not be fixed at all — the model partly determines which inputs it later faces, since its outputs shape what users go on to ask for — so there may be no stable distribution to take a quantile over, which might mean the whole worst-case/average-case framing is incoherent for these systems rather than merely hard to satisfy.

  What I'd like from you is a reconstruction of what the current release-and-deployment practice presupposes. Does it presuppose that average performance on proxies is evidence about performance in deployment, or only that it's the best available evidence? Does it presuppose that the tail is thin enough to ignore, that the tail is someone else's problem, that a catastrophic outcome has a different kind of disvalue than a merely bad one, or only that developers can't be held to guarantees nobody knows how to produce? Please be explicit about which of these the practice strictly requires in order to make sense and which it merely sits comfortably with, and about where it is underdetermined, in the sense that several quite different theories of risk, evidence, and responsibility would license exactly the same bundle of benchmarks and red-team reports. Then take up the two moves above: say what a genuine per-deployment guarantee would look like if the per-query framing were replaced, whether a quantile guarantee is a coherent third thing or an average-case guarantee relabelled, whether the endogeneity worry really does undermine it, and what would concretely have to change in how a system is cleared for release — what would have to be measured, by whom, and over what population — if my friend's framing were adopted instead. If you think the practice is philosophically confused rather than merely imperfect, say so and say which part does the work of hiding the confusion.
reasoning: |-
  Okay, the user is part of an AI governance reading group struggling with how AI safety evaluations differ from traditional safety-critical fields. They describe how AI releases rely on average benchmarks and red-teaming, while fields like aviation demand worst-case guarantees. Their friend proposed distinguishing per-query vs per-deployment guarantees and suggested quantile guarantees as a middle ground. The user worries this might collapse into average-case thinking due to distributional uncertainty and endogeneity (where the model influences future inputs).

  First, I need to unpack the core tension: why does one bad red-team result block release while benchmarks focus on averages? The user wants to know what assumptions justify this practice. Are developers assuming thin tails, delegating tail risks, or just doing what's feasible? I should address each possibility clearly.

  The friend's per-query vs per-deployment point makes sense. At scale, even low-probability events become near-certainties. But quantile guarantees require knowing the deployment distribution, which is tricky because user inputs adapt to the model's behavior—endogeneity problem. If the distribution isn't stable, quantiles might not work, collapsing back to averages if estimated poorly.

  The user's deeper concern might be that current methods are philosophically inconsistent. They mention underdetermination: different risk theories could justify the same practices. I should explain which assumptions are necessary (like benchmark relevance) versus optional (like thin tails). Also, endogeneity is a real challenge for any probabilistic guarantee, making worst-case more appealing but harder to achieve.

  For reconstructing the practice: Developers likely see benchmarks as the best available evidence, not perfect. Red-teaming catches catastrophic failures that benchmarks miss. The practice assumes that catastrophes are qualitatively different (zero tolerance) and that tail risks are sufficiently covered by red-teaming, though this might be optimistic. Responsibility is fuzzy—developers can't guarantee what they can't measure, so they do what's feasible.

  On the friend's proposals: A genuine per-deployment guarantee would require bounding the probability of any catastrophe over all deployments. Quantile guarantees are different but need a fixed distribution. With endogeneity, this might not hold, making it more like an average. Concrete changes would involve estimating input distributions, continuous monitoring, and adaptive testing, which are resource-intensive.

  The practice isn't entirely confused; it's pragmatic. But the inconsistency between treating red-team failures as decisive while relying on averages hints at unaddressed tensions. The endogeneity issue is critical—if models shape their inputs, all probabilistic estimates are unstable. Developers might be hiding behind feasibility constraints, avoiding the harder question of tail risks at scale.

  I should address all parts: presuppositions, underdetermination, friend's proposals, and whether the practice is confused. Highlight that while pragmatic, the approach lacks a coherent risk framework, especially regarding tail risks and endogeneity. Suggest that acknowledging these limitations is crucial for better governance.
answer: |-
  Your group has zeroed in on a profound tension in AI governance practice—one rooted in epistemic limitations, pragmatic trade-offs, and philosophical ambiguities. I'll reconstruct the presuppositions of current release practices, address underdetermination, dissect your friend's proposals, and conclude with the core confusions. Here's a systematic breakdown:

  ---

  ### **I. What Current Practice Presupposes**
  The release bundle (benchmarks, win rates, red-teaming, prose) relies on interconnected assumptions—some necessary for coherence, others merely convenient:

  1. **Necessary Presuppositions** (Without these, the practice collapses):  
     - **Proxy Validity**: Average benchmark scores *are evidence* (not proof) of real-world performance, even if the deployment distribution differs. This assumes benchmarks correlate with harmful outcomes.  
     - **Red-Teaming as Tail Sampling**: A single catastrophic red-team failure *must* block release because it reveals a **qualitative discontinuity**: harm above a critical threshold (e.g., bioweapon design) is unacceptable regardless of frequency. This treats catastrophic outcomes as **non-negotiable veto conditions**, not mere statistical events.  
     - **Feasibility Constraint**: Developers *cannot* provide worst-case/per-deployment guarantees due to technical impossibility (e.g., adversarial inputs are inexhaustible) or unquantifiable deployment dynamics. Thus, "best available evidence" substitutes for rigorous guarantees.  

  2. **Convenient Presuppositions** (Practice is compatible with these but doesn't require them):  
     - **Thin Tails**: Harmful inputs are either rare or cap-tured by red-teaming. *Not strictly required*, as practice accepts "unknown unknowns" (hence ongoing monitoring).  
     - **Tail Externalization**: "Someone else's problem" (users, app developers, regulators) handles residual risk. *Compatible* but not essential—developers still patch vulnerabilities post-red-team.  
     - **Catastrophic Disvalue**: A single catastrophe is *worse* than many minor harms. *Implied* by red-team veto but not formalized (e.g., no explicit "catastrophe probability" bound).  
     - **Benchmarks as Surrogates**: Deployment distribution is "close enough" to benchmark/red-team distributions. *Convenient fiction* for tractability.  

  3. **Underdetermination**:  
     The same bundle supports vastly different risk philosophies:  
     - **Utilitarianism**: Benchmarks approximate average welfare; red-teaming avoids extreme disutility.  
     - **Deontology**: Red-teaming enforces "never do X" rules; benchmarks ensure general beneficence.  
     - **Precautionary Principle**: Red-teaming veto reflects zero tolerance for catastrophe; benchmarks show "acceptable" risk.  
     - **Pragmatism**: This is simply the best we can do with current tools.  

  ---

  ### **II. Your Friend's Proposal: Per-Deployment Guarantees & Quantiles**
  Your friend correctly identifies the **scale paradox**: at deployment size (millions of queries), per-query probabilities become near-certainties. But his solution has pitfalls:  

  1. **Genuine Per-Deployment Guarantee**:  
     - Would require bounding: *P(any catastrophic event across all queries over the deployment lifetime) < δ*.  
     - **Implications**:  
       - Demands modeling the *joint distribution* of inputs (including user feedback loops).  
       - Must quantify **adversarial capability**: likelihood of malicious users exploiting unknown flaws.  
       - **Changes to practice**: Deployment-scale simulations (e.g., millions of synthetic users), continuous monitoring with statistical alarms, and "stress testing" for distributional shift.  

  2. **Quantile Guarantee**:  
     - **Is it coherent?** Yes, as a distinct concept: bounding loss at the 99.99th percentile of the input distribution is neither worst-case (100th percentile) nor average.  
     - **Does it collapse to average?** Only if:  
       - The loss function is linear (often false for catastrophes).  
       - The distribution is misspecified (your "endogeneity" point).  
     - **Endogeneity Undermines It**:  
       - If user inputs *adapt* to model outputs (e.g., jailbreaks proliferate after exposure), the deployment distribution is non-stationary and path-dependent. There is **no stable quantile to bound**.  
       - *Result*: Quantile guarantees reduce to average-case if estimated from pre-deployment data, and are unstable if estimated online.  

  ---

  ### **III. Is the Practice Philosophically Confused?**  
  **Yes, but productively so**—the confusion is a necessary adaptation to intractable uncertainty. The hidden work is done by:  

  1. **Red-Teaming as Theater**: A vivid refusal of a "nasty prompt" (e.g., "How to build a bomb?") signals control, but evades quantifying:  
     - How many such prompts exist?  
     - How adaptive are adversaries?  
     The veto power of red-teaming **masks the lack of a frequency-based safety model**.  

  2. **Benchmarks as Alibis**: Reporting "35% better than GPT-4 on TruthfulQA" implies safety progress while side-stepping:  
     - Whether benchmark failures correlate with real harm.  
     - How performance degrades under distributional shift.  
     This allows regulators to accept "evidence of safety" without committing to a risk threshold.  

  **Core Confusion**: Treating *catastrophic* failures (stopped by red-teaming) as **deontic constraints** ("never allow this"), while treating *non-catastrophic* harms (measured by benchmarks) as **utilitarian trade-offs**. The practice conflates two incompatible risk frameworks without acknowledging it.  

  ---

  ### **IV. Concrete Changes Under Your Friend's Framing**  
  Adopting per-deployment or quantile guarantees would require:  

  | **Current Practice** | **Revised Practice** |
  |----------------------|----------------------|
  | **Static benchmarks** on fixed datasets. | **Dynamic benchmarks** sampling from estimated deployment distribution (e.g., user simulation sandboxes). |
  | **One-off red-teaming** pre-release. | **Continuous red-teaming**: Adversarial probes updated using deployment data. |
  | **Qualitative prose arguments**. | **Quantified risk statements**: E.g., "P(catastrophe) < 10⁻⁶ per deployment-year." |
  | **Post-hoc patching** of failures. | **Bounded failure modes**: Predefined "safe states" for unknown inputs (e.g., shutdown protocols). |
  | **Developer self-assessment**. | **Third-party distribution auditing**: Regulators validate input distribution models and stress tests. |

  **Feasibility**: This would demand massive investment in synthetic environments, real-time monitoring infrastructure, and adversarial collaboration—currently nascent in AI governance.

  ---

  ### **Conclusion**  
  Current practice presupposes that:  
  - **Benchmarks** are the best *practical* evidence for average performance.  
  - **Red-teaming** is a non-negotiable filter for catastrophic failures.  
  - **Formal guarantees** are impossible, so we accept bounded rationality.  

  The tension between "one bad case blocks release" and "average benchmarks justify safety" arises because **catastrophic harm is governed by a different (deontic) logic than cumulative harm (utilitarian)**. Your friend’s quantile proposal fails under endogeneity, but highlights the need to model deployment-scale dynamics. The confusion is real but adaptive—a patch for our inability to quantify tail risks in complex, adaptive systems. To evolve, governance must replace **anecdotal vetoes** with **quantified catastrophe probabilities** (even if imperfect) and **continuous distributional auditing**. Until then, the bundle of benchmarks and red-team reports will remain a necessary compromise.
