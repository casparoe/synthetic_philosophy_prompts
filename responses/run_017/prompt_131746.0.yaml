prompt: |-
  You are a philosopher of cognitive science and education retained as an external advisor to the Instructional Materials and Technology Committee of a large public school district. Take as your working framework the familiar four-fold taxonomy of minds: Darwinian creatures, whose responses are wired in by selection over generations; Skinnerian creatures, whose repertoire is shaped within a lifetime by reinforcement; Popperian creatures, which let candidate actions fail in imagination or in surrogate rather than in the body; and Gregorian creatures, which internalize culturally supplied representational tools — words, number, diagrams, procedures — that reorganize what they can so much as think. Assume, as that taxonomy suggests, that what distinguishes the later grades of mindedness is not more raw processing power but a new way of getting information about the world before acting on it.

  The committee votes in nine days on a three-year district-wide license for an adaptive mastery-learning platform for grades 6–10 mathematics. The platform models each student continuously and adjusts item difficulty and hint timing in real time; it is marketed on the claim that it holds every student inside a narrow band of success by supplying a hint or an easier item before the student can commit an error. The district's own pilot shows solid gains on standardized items, largest in the lowest quartile, and a marked drop in self-reported math anxiety; teachers report that students who use it volunteer answers far more readily.

  A minority of the committee has raised an objection the district has no vocabulary for: that the platform produces competence that lives in the student-plus-software loop rather than in the student. The learner is shaped by a feedback schedule he neither sees nor models; errors are prevented rather than made and then corrected; and little of what the system teaches is a tool the student can carry off-screen and deploy on paper. In the taxonomy's terms, the charge is that this is an excellent Skinnerian environment and a poor Gregorian one, and that it starves the Popperian learner of precisely the consequential, publicly visible failures that make hypothesis-testing worth doing.

  Before you draft, think carefully and work through, in a few paragraphs you do not turn in: what exactly is the cognitively and morally relevant difference between competence located in a loop and competence located in a learner; whether preventing an error can ever teach what correcting one teaches; whether the district's actual aim is item-level performance or the production of Popperian and Gregorian minds; and whether pre-emptive scaffolding is defensible for some content, such as rote fluency, while corrosive for other content, such as multi-step reasoning.

  Then write the memo I will circulate, at most about 800 words, addressed to a committee of teachers, two administrators and one school board member who have no philosophy background — translate the framework into criteria they can apply without lecturing them. It must (1) give a clear bottom line — approve, reject, or approve under stated conditions — with a timeline; (2) state the operational tests any approval would be conditional on, which should include some way of measuring what students can do with the adaptive scaffolding switched off, and some requirement that each unit leave the student holding a representational tool rather than only a reinforced disposition; and (3) treat the strongest consideration on the losing side at full strength: the equity case for the platform, given that the students who gain most from it are those whose current alternative is not Popperian struggle but silence and no feedback at all. Close by naming the empirical finding that should trigger a reversal of the recommendation.
reasoning: |-
  Okay, I need to tackle this memo as a philosopher advising a school committee. The user has laid out a complex scenario involving an adaptive math platform and the four-fold taxonomy of minds. 

  First, let's unpack the core tension: the platform shows strong results in test scores and reduced anxiety, especially for struggling students. But it might be creating dependency by preventing errors rather than letting students learn from mistakes. The taxonomy framework is crucial here - we're moving beyond just Skinnerian conditioning to consider Popperian (hypothesis testing) and Gregorian (tool internalization) development.

  Hmm... the equity argument is particularly weighty. For students who'd otherwise disengage, this platform provides immediate feedback they're not getting elsewhere. But at what cost? If they never experience productive failure, do they develop true problem-solving abilities?

  The key questions I need to address in my thinking (before drafting the memo) are:
  - What's the real difference between "competence in the loop" vs "in the learner"? 
  - Can error prevention ever teach what correction does?
  - Are we aiming for test scores or developing certain types of minds?
  - Should scaffolding approaches differ by content type?

  For the memo itself, I need to translate these philosophical concerns into actionable criteria for non-philosophers. The bottom line should probably be conditional approval - the equity benefits are too significant to reject outright, but we need safeguards.

  Operational tests must include:
  - Regular "scaffolding off" assessments
  - Tracking what tools students internalize
  - Observing their reasoning processes

  The strongest counterargument is definitely equity - we can't deny struggling students this support system. But the reversal trigger should be clear: if we see declining transfer to paper-based problems over time.

  I'll structure the memo to:
  1. Frame the issue in plain language using "feedback loops" instead of taxonomy terms
  2. Present conditional approval with timeline
  3. Outline concrete tests including "cold start" assessments
  4. Acknowledge the equity benefits fully
  5. Specify the reversal condition

  The challenge is making Popperian/Gregorian concerns tangible for educators. Maybe describe them as "learning to troubleshoot" and "building mental toolkits" instead.
answer: |-
  **MEMORANDUM**  
  To: Instructional Materials and Technology Committee  
  From: External Advisor, Philosophy of Cognitive Science & Education  
  Date: October 26, 2023  
  Subject: Recommendation: Adaptive Math Platform License (Grades 6–10)  

  ### Bottom Line  
  **Approve the three-year license, conditional on specific operational safeguards, with a provisional timeline of one year for validation.** If these conditions are not met after 12 months, funding reverts to a one-year terminal license.  

  ### Summary of Concerns and Strengths  
  Your pilot data shows this adaptive platform excels at two things:  
  1. **Boosting confidence and procedural accuracy**, especially for students who struggle most.  
  2. **Delivering personalized, timely support**, reducing frustration and disengagement.  

  However, there is a risk that the system could **over-protect students from productive struggle**. Think of it like training wheels that never come off: if a bike never wobbles, the rider doesn’t learn to balance. In cognitive terms:  
  - **Preventing errors** (as this system does) builds quick, accurate responses.  
  - **Correcting errors** (through trial, reflection, or guidance) builds *resilient problem-solvers* who transfer skills to new challenges.  

  The platform is an exceptional **feedback loop** (like a smart coach). But our goal must be ensuring students internalize the coach’s tools—not just depend on the coach.  

  ### Conditions for Approval: Operational Tests  
  Approval hinges on integrating three validation measures into the platform’s rollout:  

  1. **“Cold Start” Assessments**  
     - **Test**: Every 3–4 weeks, administer a short (15-min) math task *on paper*, without digital aids.  
     - **Metric**: Compare cold-start results to platform performance. We tolerate modest gaps (≤10%) but investigate gaps >15%.  
     - **Goal**: Ensure students can *transfer skills* off-screen.  

  2. **Toolbox Audits**  
     - **Test**: At the end of each unit, students complete a self-assessment: *“Name one strategy you used this month. Write an example of how it works.”* (e.g., sketching word problems, factoring shortcuts).  
     - **Metric**: Teachers spot-check 20% of responses quarterly. ≥80% should identify *specific, reusable techniques*—not just “the app gave me hints.”  
     - **Goal**: Verify students internalize *thinking tools*, not just answers.  

  3. **Error Journaling**  
     - **Test**: For platform-generated hints, require students to journal: *“Why did I need a hint? What did I learn?”* (1 entry/week).  
     - **Metric**: Sample journals quarterly. Target: ≥70% show evidence of *strategy adjustment* (e.g., “I confused radius/diameter—now I diagram circles first”).  
     - **Goal**: Convert passive support into active learning.  

  ### Addressing the Strongest Counterargument: Equity  
  The platform’s greatest strength—immediate, adaptive support for struggling learners—is also its strongest moral case. For students facing silence or disengagement, it provides a lifeline. **Denying this tool risks leaving vulnerable learners behind.** My recommendation *prioritizes these gains* while ensuring scaffolding does not become a permanent crutch. The validation tests focus resources where transfer is weakest—closing equity gaps in *durable* competence, not just momentary scores.  

  ### Reversal Trigger  
  **Recommendation reverses if**, after one year, cold-start assessments show:  
  - **Struggling learners (bottom quartile) underperform platform results by >20%**, *and*  
  - Journaling/toolbox audits indicate >50% cannot articulate strategies without referencing the app.  

  This signals the platform inhibits independence—a cost that outweighs its benefits.  

  ### Conclusion  
  Approve the license with the above conditions. This balances urgent equity needs with our duty to cultivate resilient, self-sustaining mathematical thinkers. The platform is a powerful Skinnerian tutor; these tests ensure it also nurtures Popperian explorers and Gregorian tool-users. I am available for clarifications before your vote.  

  ---  
  **Approval Timeline**:  
  - **Months 1–3**: Integrate validation tests with teacher training.  
  - **Month 12**: Review validation data; terminate funding if conditions unmet.  
  - **Month 36**: Full renewal review.
