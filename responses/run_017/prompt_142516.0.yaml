answer: |-
  ### Q&A Prep Sheet: Benin Authority Transfer Proposal  
  *(Ordered by potential damage to proposal)*  

  ---

  **1. City Lawyer: "This transfers permanent authority while custody remains revocable, creating an inalienable right you lack statutory power to grant. The museum’s governing statute limits us to custodial decisions, not eternal abdications of core functions."**  
  *Reply:* "We’ve structured this as a conditional delegation under our statutory custodial mandate. Authority is tied to custody—if custody reverts, so does authority. The 25-year review ensures alignment with future legal interpretations. Our counsel confirms this fits within our operational discretion over collections management."  
  *Vulnerability:* Implies statutory ambiguity; if the panel doubts our legal capacity, the proposal unravels.  

  **2. Finance Director: "Transferring conservation/lending authority to Nigeria imposes uncontrolled costs. What if they demand gold-standard treatments we can’t fund, or refuse loans that generate revenue? Who indemnifies us for objected handling?"**  
  *Reply:* "Authority is conditional on mutual agreement during reviews. We’ll codify a cost-sharing framework and pre-agree conservation standards. Loans remain subject to our facility/security thresholds. Indemnity stays with the custodian (us) unless negligence is proven."  
  *Vulnerability:* "Mutual agreement" is vague; could lead to deadlock.  

  **3. Trustee (Judge): "This sets a precedent for fractional governance. If we divorce custody from authority here, why not for Greek vases or Inuit artifacts? It invites inconsistent standards."**  
  *Reply:* "This addresses a unique ethical breach: objects violently looted from a still-thriving court. We’re not generalizing the model—it’s tailored to unresolved colonial takings with active claimants. Our policy distinguishes this category."  
  *Vulnerability:* Fails if panel sees Benin as non-unique; opens floodgates fear.  

  **4. Nigerian Antiquities Official: "This sidelines federal oversight. The Edo court isn’t Nigeria’s legal custodian of heritage. You’re privileging ethnic authority over state sovereignty."**  
  *Reply:* "We defer to the Edo court’s designation of a heritage body, which could include federal partners. This empowers Nigerian stakeholders without presuming to define their internal governance. We’ll formalize Nigeria’s recognition of the body."  
  *Vulnerability:* Risks federal-state tensions in Nigeria; may require direct federal consultation.  

  **5. Edo Court Historian: "Why retain custody? If we have authority, the objects belong here in Benin City. Your ‘rolling custody’ feels like colonial stewardship in new clothes."**  
  *Reply:* "Physical custody remains with us *only* until you’re ready to exercise the transfer option at a review. This avoids rushed logistics while ensuring you control meaning and access. It’s a bridge, not an endpoint."  
  *Vulnerability:* Appears to deny Edo’s readiness; implies Northern superiority in stewardship.  

  **6. Conservator: "Shared authority complicates collections care. Will I need Edo’s approval for emergency stabilization? Handling protocols designed here may not align with their ritual requirements, risking damage."**  
  *Reply:* "Emergency powers remain with you. We’ll co-develop protocols during implementation, respecting both material science and ritual needs. Your expertise anchors this—authority override applies only to deliberate interventions, not routine stewardship."  
  *Vulnerability:* "Co-developed" is aspirational; conflicts could paralyze conservation.  

  **7. Trustee (Ambassador): "This looks like a diplomatic fudge. By not returning titles, we’ll face perpetual pressure from restitution campaigns and lose credibility."**  
  *Reply:* "Unlike a fudge, this explicitly transfers power to the source community. It resolves the core grievance: control over cultural narrative. Full title transfer remains an automatic option at every review, making return inevitable if desired."  
  *Vulnerability:* Restitution advocates may still attack partial measures.  

  **8. Trustee (Hotelier): "What’s the tourism impact? If Edo orders all pieces into storage, our ‘Benin Gallery’ becomes an empty room, hurting visitor numbers."**  
  *Reply:* "Edo’s authority includes promoting cultural engagement—display is likely. If storage occurs, we’ll reinterpret the space as a forum for digital access and loans, turning compliance into a reputational asset."  
  *Vulnerability:* Assumes Edo won’t suppress displays; ignores revenue loss risks.  

  ---

  ### Strategic Addenda  
  **Opening Concession (First 2 Minutes):**  
  *"Custody remains with us not because we’re best placed, but because this proposal prioritizes transferring control *first*. Physical return is logistically fraught and risks sidelining authority. We concede this isn’t ideal—but it’s transitional, not permanent."*  

  **Modify, Don’t Fight:**  
  1. **Conservator’s objection:** Commit to a binding joint protocol for emergency interventions.  
  2. **Lawyer’s objection:** Add a clause allowing revocation of authority *by mutual consent* (not just custody changes).  

  **Critical Reply to Land:**  
  *To the Edo historian’s custody challenge:* **"Because authority without readiness risks harm. When you convert authority to custody—at your discretion, on your timeline—you reclaim both. Until then, we hold objects *at your instruction*."**  

  **Question to Dread:**  
  *"If Edo’s authority includes barring display, how do you justify retaining custody of objects deemed unfit for public engagement? Isn’t that just warehousing stolen goods?"*  
  (No good answer; pivots to moral failure, not governance.)  

