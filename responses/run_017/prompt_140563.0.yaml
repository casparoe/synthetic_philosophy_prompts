  Okay, let me start by unpacking the user's query. They're asking about why scientists insist that new theories must recover the successes of old ones in their domain. They mention examples like GR reducing to Newtonian gravity and quantum mechanics to classical physics. But they also point out counterexamples like phlogiston and ether, where the old theory was discarded entirely. Plus, there's the issue of meaning variance in paradigms—if terms change meaning, how can we even compare theories? The user wants to understand the presuppositions behind this practice and how it fits with different philosophies of science.

  First, I need to address the core tension: how do scientists reconcile requiring recovery while sometimes abandoning old concepts? The user is questioning the consistency here. They also bring up a hypothetical where a black-box predictor matches predictions without explaining anything, which seems to satisfy the recovery requirement but isn't what scientists want. So the user is really probing the underlying assumptions about theory success, explanation, and progress.

  The user mentions Kuhn and meaning variance. They're likely familiar with philosophy of science debates but seeking a practical reconciliation. The examples of textbooks calling old theories "false" yet still teaching them adds another layer. How does that practice align with requiring recovery? There's an apparent contradiction here that needs untangling.

  I should start by outlining the presuppositions. The recovery practice assumes that theories are approximating a stable reality. Predictive success in specific domains indicates partial truth. Continuity in math and semantics allows comparison, even if meanings shift. But how? Maybe through mathematical limits or operational definitions. Then there's the issue of ontology: sometimes entities are discarded, but the empirical success remains. That points to structural realism, where the structure is preserved even if the ontology changes.

  The phlogiston example is key. The user notes that recovery isn't always necessary. So when is it required? Probably when the old theory's math is well-confirmed. Phlogiston didn't have that; its predictions were replaced. Whereas Newton's equations are still used because they're approximately correct in certain regimes. So the requirement is about mathematical continuity for empirically successful models, not necessarily the ontology.

  The black-box predictor problem highlights that recovery isn't just about predictions but also about explanation and mechanism. Scientists want understanding, not just accuracy. So the implicit demand includes explanatory depth, even if not explicitly stated.

  Regarding textbooks: calling old theories "false" but still using them makes sense if we see them as effective but approximate models. Teaching them first provides a conceptual scaffold. So the practice isn't inconsistent if viewed pragmatically.

  If recovery were dropped, peer review might accept theories that don't connect to existing knowledge, risking disconnected models. Teaching might become more fragmented. But in cases like phlogiston, where no continuity exists, science progresses anyway. So the requirement is context-dependent, tied to domains with robust empirical success.

  Incommensurability taken seriously would require retraining scientists to understand different paradigms without translation, which isn't practical. Instead, focusing on mathematical bridges and operational definitions allows communication across theories.

  Putting this together: the practice presupposes a stable reality, partial truth in successful theories, and the need for cumulative progress. Structural realism fits well, allowing ontology to change while preserving structure. Kuhn's meaning variance is managed through mathematical limits. The practice is consistent because it's pragmatic, using old theories as tools while acknowledging their limitations.
answer: |-
  Your analysis cuts to the heart of key debates in philosophy of science. The "recovery requirement" (RR) practice reveals a sophisticated, largely implicit, and pragmatically successful view of scientific progress that navigates between naive realism and radical incommensurability. Let's reconstruct it, addressing your wrinkles.

  **The Implicit View Presupposed by the Recovery Requirement:**

  1.  **Stable Reality & Partial Truth:** The core presupposition is that *the world has stable, objective structures and regularities*. The old theory's empirical successes in its domain aren't mere illusions or social constructs; they reveal *something true* about how the world behaves under those specific conditions. RR presupposes that this "kernel of truth" must be preserved or accounted for by any genuinely successful successor. It rejects the idea that theories are *wholly* false frameworks with no referential purchase on reality.

  2.  **Approximation & Domain Specificity:** Theories are seen as *approximations* valid within specific domains defined by physical parameters (speed, scale, energy, density). RR requires the successor theory to *explain why the old approximation worked so well within its domain* – typically by showing how the new equations/mathematical structure reduce to the old ones under the limiting conditions (v<<c, h->0, weak fields, etc.). This mathematical continuity is crucial.

  3.  **Continuity of Reference via Structure & Function:** While term meanings *can* shift, RR presupposes *enough structural or functional continuity* to anchor comparison.
      *   **Operational Definitions:** The *predictive outcomes* of the old theory (e.g., planetary orbits calculated via Newton, diffraction patterns explained by wave optics) serve as theory-neutral "scores" to compare against. *What* is predicted (e.g., the position of Mars at time T, the location of a dark band) remains the stable reference point.
      *   **Structural Preservation:** The mathematical *relationships* between quantities often survive, even if the ontological interpretation changes. Force, mass, energy, field – their *functional roles* within the predictive structure exhibit continuity. This aligns strongly with **Structural Realism** (especially the "epistemic" variant).

  4.  **Progress as Increasing Scope & Refinement:** Progress isn't just accumulating truths; it's developing theories with *wider domains of applicability* and *greater accuracy/precision*. RR ensures that expansion doesn't come at the cost of losing hard-won, reliable knowledge in previously explored domains. It embodies the idea that science builds *cumulatively*, not through total ruptures.

  5.  **Explanatory Power as Key (Beyond Mere Prediction):** Your "big fitted predictor" wrinkle hits a nerve. RR is *not* just about matching numerical outputs. Scientists implicitly demand that the successor *explains* the success of the old theory *in its own terms*, revealing the old theory as a limiting case or approximation *within the framework of the deeper theory*. This provides understanding, not just prediction. The "mechanism" is often the mathematical derivation showing the limit.

  **Addressing Your Wrinkles:**

  1.  **Deletion vs. Recovery (Phlogiston, Ether):** This isn't a contradiction; it highlights what RR *actually* requires. RR applies to the *empirically successful quantitative predictions* of the old theory, *not* necessarily its core ontology.
      *   **Phlogiston:** Its core predictions (e.g., metals gain mass when calcined) were *false*. There was no domain where its *quantitative* predictions were robustly successful and needed recovering. Oxygen theory provided *better* predictions *and* explained combustion phenomena *correctly*. The "success" attributed to phlogiston was largely descriptive or qualitative, not precise quantitative prediction.
      *   **Luminiferous Ether:** While conceptually central to Maxwell's EM, attempts to detect it (Michelson-Morley) *failed*. Crucially, *special relativity recovered all the successful quantitative predictions of Maxwell's EM equations for electromagnetism* while dispensing with the need for a material ether. The *mathematical structure* (Maxwell's equations) survived and was explained within SR. The ontology changed, but the empirically successful dynamics were preserved and given a new foundation.
      *   **Key Point:** RR targets the *confirmed empirical content* (especially mathematical predictions), not the ontological baggage. Ontology can shift radically (*Pessimistic Meta-Induction* looms), but the *structure* of successful predictions must be accounted for.

  2.  **The "Black Box" Predictor:** This perfectly illustrates why RR alone is insufficient and why explanation is implicitly demanded. A black box matching all past data:
      *   Recovers the empirical successes (passes the letter of RR).
      *   **Fails** the implicit requirement: It provides *no explanation* *why* the old theory worked within its domain. It doesn't reveal the old theory as an approximation derived from deeper principles. It offers no understanding, no unification, no basis for novel predictions outside the training data. Scientists would reject it as *merely* instrumental, not explanatory. RR functions within a broader demand for understanding.

  **Consistency with Textbook Practice ("False but Useful"):**

  The practice *is* remarkably consistent under this implicit view:

  1.  **"Straightforwardly False":** This refers to the old theory's *fundamental ontology or claims to universal validity*. Newtonian gravity isn't the fundamental fabric of spacetime; classical mechanics fails at small scales. The *scope* of its truth claims is wrong.
  2.  **"Go on Using It":** Within its empirically validated domain of approximation (slow speeds, weak fields), Newtonian mechanics provides *excellent, computationally simpler* predictions. It's retained as an *effective tool* for that specific purpose. Its use is *justified by the successor theory itself* (GR shows *why* Newton works where it does).
  3.  **"Teach it First":** Pedagogically, the simpler, more intuitive (often more ontologically familiar) theory provides essential scaffolding. Learning GR without Newtonian intuition is incredibly hard. Teaching the limit case first builds conceptual and mathematical foundations. Crucially, the *derivation of the limit* within the new theory (taught later) validates and explains the pedagogical approach.

  **Presuppositions vs. Compatibility:**

  *   **Strictly Presupposed:** Stable reality, existence of theory-neutral empirical successes (predictive outcomes), need for mathematical/structural continuity explaining the old success as a limit, progress as increasing scope/accuracy while preserving past empirical gains.
  *   **Compatible with Kuhn-Style Meaning Variance:** RR *can* function even under significant meaning variance. The "theory-neutral" anchor is the *phenomenon* described operationally (e.g., "the observed position of body X at time Y") or the *mathematical value* of a prediction. While Newtonian "mass" and relativistic "mass" differ conceptually, the *numerical predictions for particle trajectories under low speeds* converge, providing the common ground. Kuhn acknowledged such "local" communication and problem-solving despite global incommensurability. RR leverages this local communication focused on *problem solutions*.
  *   **Highly Compatible with Structural Realism (SR):** SR is arguably the *best fit* for the implicit view. SR asserts that what survives theory change is the *structure* of the world (the mathematical relationships, the "form" of the laws), not necessarily the "nature" of the entities (the "content"). RR's focus on preserving successful mathematical structures and their functional relationships aligns perfectly with SR. The deletion of phlogiston/ether is consistent with SR – those were incorrect speculations about the *nature* of the underlying structure.

  **Consequences of Dropping RR or Acting on Incommensurability:**

  *   **Dropping the Recovery Requirement:**
      *   **Peer Review:** Proposals for radical successors could be accepted based solely on internal consistency, novelty, or success in *new* domains, even if they blatantly contradicted *well-established* empirical results in domains covered by the old theory. Progress could become fragmented, with disconnected theories for different phenomena. Risk of accepting theories that "work" only by ignoring vast bodies of established evidence.
      *   **Teaching Science:** The narrative of cumulative progress would weaken significantly. Teaching might jump straight to the "most fundamental" current theory without building intuition via approximations. Understanding *why* old tools work (e.g., Newtonian mechanics in engineering) might be lost or detached from fundamental theory. The pedagogical scaffolding would collapse.
      *   **Overall:** Science would risk becoming less cumulative, less empirically anchored in its historical successes, and potentially more susceptible to fads or theories that ignore inconvenient data. Explanatory power linking the new to the known would diminish.

  *   **Taking Incommensurability Seriously Enough to Act On:**
      *   **Peer Review:** Evaluating proposals across paradigms would become immensely difficult. Referees might be deemed incapable of understanding truly revolutionary ideas from "outside the box." Communication breakdowns could stifle innovation or protect flawed paradigms. The focus might shift entirely to predictive power *within* a paradigm, abandoning cross-paradigm comparison ("Does it recover Newton? That's a Newtonian question!").
      *   **Teaching Science:** Textbooks might present different paradigms as entirely separate, self-contained worldviews with no attempt to show how one emerges from or relates to the other. Teaching Newtonian mechanics might not mention GR at all, and vice versa. Students might learn multiple, seemingly contradictory frameworks without being shown how they connect via limiting cases. History of science would emphasize radical breaks over continuity.
      *   **Overall:** Science could become balkanized, with isolated communities working in incommensurable frameworks. The sense of unified scientific progress towards a better understanding of a single reality would fracture. Communication and collaboration across theoretical divides would be severely hampered. The pragmatic success of RR in guiding theory development and validation would be lost.

  **Conclusion:**

  The recovery requirement practice presupposes a robust, structurally realist view of scientific progress grounded in a stable reality. It prioritizes the preservation of confirmed empirical content (especially mathematical predictions) and demands that new theories explain the success of old ones as approximations derived from deeper principles. This practice is consistent with describing old theories as "false" in their fundamental claims while retaining them as useful tools within validated limits. It navigates meaning variance by anchoring comparison in operationalized phenomena and mathematical structures. While compatible with acknowledging Kuhn's insights about paradigm shifts and meaning variance in a limited sense, fully embracing incommensurability or abandoning the recovery requirement would fundamentally disrupt the cumulative, explanatory, and empirically anchored nature of scientific progress as currently practiced. The requirement acts as a crucial safeguard against radical discontinuity and a guarantor that scientific knowledge builds upon, rather than simply discards, its hard-won successes.
