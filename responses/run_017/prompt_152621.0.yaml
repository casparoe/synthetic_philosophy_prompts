  Below is a decision tree designed to guide users from the starting point of predictive classifications to specific positions on natural kinds, adhering to your constraints. The tree uses **eight branch nodes** (each phrased as a question with cases) and ends at **eight leaves** (the seven requested positions plus one grouped view). Each question is answerable without prior knowledge of the views, using three invented cases (including your velmorphs and orpiment glass, plus a new one: spectral birds). 

