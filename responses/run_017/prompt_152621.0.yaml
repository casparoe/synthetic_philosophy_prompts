  ### **Decision Tree: What Explains Predictive Classifications?**  
  *Start with the observation that some classifications predict better than others. Answer each question based on the cases.*

  1. **Node 1: Velmorphs**  
     A deep-sea survey finds ~40 species from six unrelated lineages (no gene exchange for 200M years). All have a near-identical feeding organ built from different tissues/developmental pathways. "Velmorph" predicts the organ's mechanics perfectly but nothing else. Is "velmorph" a real kind in nature?  
     - **(A) Yes** → Go to Node 2.  
     - **(B) No, it's just a useful human tool** → **Leaf: Conventionalism/Eliminativism**.  
     *(Distinction: Realism vs. anti-realism about kinds.)*

  2. **Node 2: Orpiment Glass**  
     A manufactured material with one name, no shared microstructure, wildly varying composition, but all samples share an optical property due to a single patented process. Is "orpiment glass" a real kind?  
     - **(A) Yes, the reliable process/property makes it real** → Go to Node 3.  
     - **(B) No, it lacks shared underlying structure** → **Leaf: Microstructural Essentialism (Kripke-Putnam)** or **Perfectly Natural Properties (Lewis/Armstrong)**. *These are grouped; no question cleanly separates them.*  
     *(Distinction: Allows multiple realizability vs. requires shared microstructure.)*

  3. **Node 3: Spectral Birds (new case)**  
     On a remote island, three genetically distinct bird species look identical (same color/pattern) and behave identically (nesting, foraging). The color is caused by different mechanisms (pigment in two, structural color in one). Locals use "spectral bird" to predict behavior perfectly. Is this a real kind?  
     - **(A) Yes, shared behavior/appearance suffices** → Go to Node 4.  
     - **(B) No, they lack a common origin/mechanism** → Go to Node 5.  
