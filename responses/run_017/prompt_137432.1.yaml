prompt: |-
  I am putting together the opening session of an MPhil seminar on metaphysics and the special sciences, and before the students encounter any of the live accounts of natural kinds I want them to have in front of them a specification of what an account of this sort is meant to deliver. Please write that specification, in British English, in roughly a thousand words.

  Fix the purpose first, since adequacy is relative to it: I want a theory of natural kinds that a working scientist could in principle use to decide whether a proposed new taxon is a genuine kind or merely a convenient filing category, and that a metaphysician could use to say what is at stake in that decision. Three stylised cases, invented for teaching, should anchor the discussion:

  1. A condensed-matter collaboration proposes to count as a new kind of stuff a phase of matter defined by a topological invariant rather than by any symmetry-breaking pattern. It has no distinctive chemical composition; it is realised in a dozen materials with almost nothing in common at the microstructural level beyond the invariant itself; and it survives only below a third of a kelvin in a large applied field.
  2. A microbial systematics group proposes a taxon defined by possession of a metabolic module that appears to have been transferred horizontally, and independently, on at least six occasions. Its members are scattered across the tree, and some lineages descended from ancestral bearers have lost the module.
  3. A clinical consortium proposes a psychiatric category defined by a biomarker profile. The profile predicts treatment response better than the existing symptom-defined categories do, but it cuts straight across them, its members need share no single symptom, and it is common in people who would never present for care.

  Give me the requirements list: what any theory adequate to that purpose has to deliver, with the case or consideration behind each requirement. I want the phenomena it must accommodate (multiple realisation, revision and abandonment of would-be kinds, the way the same domain admits several cross-cutting but apparently respectable taxonomies at different grains, the mismatch between folk categories and scientific ones), the distinctions it must not collapse (a kind versus a property, versus an individual, versus a mere collection; being a kind versus being useful to someone; having a name versus having a referent), and the results it cannot contradict (that some special-science classifications project inductively and support counterfactuals even where no fundamental laws are stated over them, and that kind boundaries are frequently vague or interest-relative at the edges). I also want a verdict on whether it is a genuine requirement that kind membership be intrinsic, and on whether the sciences must be thought to carve at unique joints or may carve at many cross-cutting ones.

  For each requirement, say whether it is non-negotiable or the prejudice of one camp. Flag any subset of the requirements that cannot be jointly satisfied, and tell me whether that impossibility is a discovery about kinds or a sign that one of the desiderata was badly framed. Identify the single requirement that does the most work in excluding candidate theories, and say why. Close with at most a sentence or two each on four families of view — a microessentialist picture, a homeostatic-property-cluster picture, a causal-structuralist picture, and an interest-relative or conventionalist one — naming only the requirement each one fails, if any.

  Please argue for the criteria rather than survey the literature: no reading lists, no citations, and nothing that would require me or you to look anything up. If you need a further example beyond the three cases above, invent one.
reasoning: |-
  Okay, let me approach this systematically. The user wants a specification for natural kind theories that serves dual purposes: practical utility for scientists evaluating new taxa and metaphysical clarity about what's at stake. The three teaching cases provide concrete anchors.

  First, I need to unpack the core tension in natural kind theories - they must bridge scientific practice (which is often messy and interest-relative) with metaphysical robustness (which seeks objective joints). The condensed matter case shows how a kind might exist without microstructural unity, while the microbial case challenges phylogenetic essentialism, and the psychiatric case highlights predictive utility overriding symptom coherence.

  For the requirements list, I'm considering several key aspects:
  - Multiple realizability (non-negotiable, given cases 1 and 3)
  - Cross-cutting taxonomies (must accommodate, as different sciences legitimately focus on different properties)
  - Distinction between kinds and useful categories (critical for case 2's horizontally transferred traits)
  - Inductive projectibility even without fundamental laws (essential for special sciences)

  The intrinsic membership question seems negotiable - case 1's topological kind isn't intrinsic but still valid. The uniqueness requirement is likely too strong, as case 3 shows multiple valid psychiatric classifications can coexist.

  The hardest requirement to satisfy appears to be maintaining kind objectivity while allowing interest-relativity at boundaries. This exposes a fundamental tension in natural kind theories. 

  For the family views:
  - Microessentialism fails case 1's multiple realization
  - Homeostatic clusters struggle with case 2's non-homeostatic traits
  - Causal structuralism might handle case 1 but stumbles on case 3's biomarker-defined kind
  - Strong conventionalism can't explain case 1's objective topological invariant

  The closing should emphasize that theories must navigate between Scylla of rigid essentialism and Charybdis of anything-goes relativism, with the biomarker case being particularly instructive for balancing objectivity and pragmatic utility.
answer: |-
  Here is a specification of requirements for an account of natural kinds, tailored to your purpose and anchored by your cases, written in British English:

  **Purpose:** To provide criteria enabling scientists to evaluate whether a proposed taxon constitutes a *genuine natural kind* (reflecting objective structure in the world) versus a *merely pragmatic classification* (useful but contingent on human interests). Simultaneously, it must clarify for metaphysicians the ontological and epistemic stakes of that distinction (e.g., what real-world constraints or inductive potential the classification tracks).

  ### Core Requirements (Non-Negotiable Unless Stated)
  1.  **Accommodate Multiple Realisability:** The account must recognise kinds whose members share a significant property, causal capacity, or lawlike role *without* sharing identical microstructural, compositional, or historical essences.  
      *   *Case/Reason:* Case 1 (topological phase) and Case 3 (biomarker profile) show members sharing a defining feature (invariant, profile) realised in wildly heterogeneous substrates or symptom presentations. Insisting on microstructural identity would invalidate demonstrably projectible scientific kinds.

  2.  **Support Inductive Projectibility and Counterfactual Robustness:** Genuine kinds must underwrite reliable inferences (e.g., predicting behaviour, properties, or responses) and support counterfactuals (e.g., "If *this* substance were in condition X, it *would* exhibit property Y"). This must hold *even for special-science kinds not reducible to fundamental physics*.  
      *   *Case/Reason:* Case 1 (predicts quantum behaviours), Case 3 (predicts treatment response). This is the core *scientific utility* of kinds. A theory failing this renders the scientist’s decision procedure useless.

  3.  **Allow for Revision and Abandonment:** The account must explain how scientific categories once thought to be natural kinds (e.g., phlogiston, humours) can be legitimately revised or discarded as science progresses, *without* implying all current kinds are merely provisional.  
      *   *Case/Reason:* Historical science and future potential revisions of Cases 1-3. Science is fallible and dynamic; kinds must track *best current understanding* of objective structure, not be immutable.

  4.  **Distinguish Kinds from Properties, Individuals, and Arbitrary Collections:** It must provide clear criteria separating:
      *   A *kind* (e.g., *water*) from a *property* shared by its members (e.g., *being H₂O*).
      *   A *kind* (e.g., *Felis catus*) from a *spatio-temporally bounded individual* (e.g., *this specific cat*).
      *   A *kind* from a *mere collection* defined by shared but superficial or gerrymandered features (e.g., *things weighing less than 50kg*).  
      *   *Case/Reason:* Case 2 (metabolic module taxon) risks being a scattered collection of lineages; Case 3 (biomarker category) needs to be more than just possessing a set of biomarkers. The metaphysical stakes involve ontological commitment and causal unity.

  5.  **Distinguish Being a Kind from Being Merely Useful:** A classification can be pragmatically valuable (e.g., organising a library by colour) without tracking a natural kind. The account must specify what *extra* objective constraint distinguishes a natural kind.  
      *   *Case/Reason:* Case 3 (biomarker profile) must show its predictive power isn't *just* clinical convenience but reflects underlying causal structure relevant to psychiatric aetiology/response.

  6.  **Accommodate Cross-Cutting Taxonomies:** The account must allow that the same domain (e.g., organisms, matter) can admit multiple, equally legitimate, cross-cutting classification schemes at different grains or based on different properties (e.g., phylogenetic, ecological, metabolic), *without* implying they are all merely pragmatic or that only one is "truly natural".  
      *   *Case/Reason:* Case 2 (metabolic taxon) vs. standard phylogeny; Case 1 (topological kind) vs. compositional kinds. Science employs diverse, incompatible-but-respectable classifications.

  ### Important Constraints & Negotiable Requirements
  7.  **Permit Boundary Vagueness and Interest-Relativity at the Margins:** Kind membership need not be absolutely sharp. Borderline cases can exist, and the *precision* required for membership criteria may sometimes be relative to investigative goals. However, the *core* of the kind must be objectively grounded.  
      *   *Case/Reason:* Acknowledges scientific practice (e.g., species debates). *Non-negotiable aspect:* Core objectivity. *Negotiable aspect:* Degree of permissible vagueness.

  8.  **Explain Folk/Science Mismatch:** The account should explain why robust scientific kinds (e.g., *water = H₂O*) often diverge from pre-theoretical folk categories (e.g., *water = clear, drinkable liquid*), without dismissing either.  
      *   *Reason:* Shows science's role in discovering kinds deeper than superficial appearances. *Largely non-negotiable* for realism.

  9.  **Reject Strict Intrinsicness (Negotiable):** Kind membership does **not** universally require intrinsic properties. Extrinsic or relational properties (e.g., historical lineage, ecological role, topological invariant *in a specific context*) can be definitive.  
      *   *Case/Reason:* Case 1 (topological phase depends on extrinsic field/temperature), Case 2 (lineage history is relational). *Objection from some camps:* Microessentialists often demand intrinsics. This requirement *excludes* strict microessentialism.

  10. **Reject Mandatory Uniqueness of Carving (Negotiable):** The account **must not** demand that there is only *one* uniquely correct taxonomy for a domain ("One True Carving"). Multiple, cross-cutting classifications can reflect different objective structures (Requirement 6).  
      *   *Case/Reason:* Cases 1, 2, 3 all potentially coexist with other valid taxonomies. *Objection from some camps:* Some realists argue for unique fundamental joints. This requirement *excludes* strong uniqueness theses.

  ### Potential Tensions & Key Excluder
  *   **Tension:** Requirement 6 (Cross-Cutting Taxonomies) and Requirement 2 (Inductive Projectibility) can seem to clash with Requirement 5 (Distinguish Kind from Useful) and Requirement 4 (Distinguish from Collection). If many schemes project well, how do we distinguish *genuine* kinds from *merely useful* projectible groupings? (Cf. Case 3 vs. a purely data-mined cluster).
      *   *Resolution:* This tension is *not* fatal but highlights the core challenge. A successful account must articulate what *kind* of objective constraint (causal structure, historical unity, lawlike role) underpins the projectibility of genuine kinds, distinguishing them from accidental or shallow projectible clusters. The biomarker profile (Case 3) must point to a unifying causal story about pathology/treatment response, not just correlation. **This is the central work of the theory.**
  *   **Key Excluding Requirement:** **Requirement 2 (Inductive Projectibility/Counterfactual Robustness)** does the most work in excluding candidate theories. Any theory that cannot explain why, or under what conditions, membership in the kind reliably supports inductions and counterfactuals (especially for multiply realisable special-science kinds) fails the core scientific purpose. E.g., a purely conventionalist account struggles here, as does a strict microessentialist account facing Cases 1 & 3.

  ### Brief Assessment of Families of Views
  *   **Microessentialism (e.g., Kripke/Putnam inspired):** Fails Requirements 1 (Multiple Realisability - Cases 1 & 3) and 9 (Intrinsicness - Cases 1 & 2). Struggles with Requirement 6 (Cross-Cutting Taxonomies) if uniqueness is assumed.
  *   **Homeostatic Property Cluster (HPC - e.g., Boyd):** Potentially satisfies Requirements 1, 2, 3, 6. May struggle with Requirement 5 (Kind vs Useful) if the "homeostasis" is weak or purely statistical (e.g., is the biomarker profile HPC *causally* unified or just correlated? Case 3 challenge). Requirement 4 (Distinguish from Collection) can be borderline.
  *   **Causal-Structuralism (e.g., focusing on causal roles/nomological networks):** Strong on Requirements 1, 2, 4 (if roles define the kind), 5, 6. May struggle with Requirement 8 (Folk/Science) if roles are highly theoretical, and Requirement 9 is moot (can incorporate relational roles). Clarity on the *nature* of the causal structure required is crucial to avoid collapsing into HPC or conventionalism.
  *   **Strong Interest-Relativity/Conventionalism:** Fails Requirement 2 (Inductive Projectibility) by making projectibility *solely* dependent on human interests, rather than interests *tapping into* objective structure. Also fails Requirement 5 (Kind vs Useful) by collapsing the distinction. Cannot adequately explain Requirement 3 (Revision - why were past kinds *wrong*?).

  **Conclusion:** An adequate theory must walk a tightrope: grounding kinds in objective structures that explain their projectibility and counterfactual robustness (satisfying the scientist's need for a real constraint), while accommodating the diverse, revisable, multiply realisable, and sometimes cross-cutting nature of successful scientific classifications (satisfying the metaphysician's need for an account of what that constraint *is* without undue metaphysical baggage like intrinsicality or uniqueness). The biomarker case (Case 3) is particularly telling: its validity hinges on whether the profile reflects a *unifying causal structure* relevant to psychiatry, not just predictive utility.
