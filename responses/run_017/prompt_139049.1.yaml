prompt: |-
  I'm in the final year of a PhD in infectious-disease modelling — I fit transmission models to surveillance data and then have to stand up in front of people who control animal-health policy and argue that one model is better supported by the data than another — so I have more than an academic stake in the argument below. My flatmate, who works in philosophy of science, has been chipping away at me for months with it. His claim is that no body of evidence, however large, could ever favour one empirically adequate theory over another, and hence that what my field calls model selection is really aesthetics plus career incentives. Every step looks unobjectionable to me when taken on its own, and the conclusion is one I cannot accept either professionally or in ordinary life. Here is the argument as he finally wrote it out for me on the back of a takeaway menu:

  (1) Take any theory T that fits our current evidence E. For any claim C you like about some as-yet-unobserved case, define T* as: T holds for every case in E, and in every case not yet observed, C holds instead. T* fits E exactly as well as T; T* is logically incompatible with T whenever C contradicts what T says about the unobserved case; and there is no limit on how many such C you can pick, so for any E there are arbitrarily many mutually incompatible theories each fitting E perfectly. (This is just the grue-style manoeuvre generalised: emeralds are green in all observed cases and blue thereafter, gravity is attractive until 1 January 2100 and repulsive afterwards, and so on.)
  (2) If a body of evidence E is compatible with arbitrarily many mutually incompatible theories, all of which fit E equally well, then E gives no reason whatsoever to prefer T to any of them. As far as the evidence goes the theories are symmetric, and any further tie-breaker — simplicity, elegance, unification, the fact that T is the one that occurred to us first — is a fact about us rather than a reason to think T is true.
  (3) The construction in (1) is not peculiar to the evidence we happen to have now. For any body of evidence whatever, present or future, the same manoeuvre can be run again on it: however much we have observed, there are rivals that fit all of it and diverge everywhere else. So at no point, and after no amount of evidence, does anything give us a reason to prefer T to its rivals.
  (4) Therefore no claim about anything unobserved is ever justified by evidence — not 'this bridge will hold', not 'the sun will rise tomorrow', and not 'this model will forecast next quarter's case numbers better than that one'.

  I have a vague sense that something is being smuggled between (1) and (3) — that (1) shows something about each body of evidence taken separately while (3) needs a rival that somehow survives every body of evidence we could ever get — but when I put this to him he says the gap is easily closed, either by iterating the manoeuvre or by pointing to theories that really are empirically equivalent come what may (Euclidean geometry plus a universal distorting force, or the hypothesis that the world sprang into existence five minutes ago complete with my data spreadsheets). I don't know whether that repair works, and I don't know what it would cost me if it does.

  So: which step of the argument do you reject, and why does the step you reject look so much like it is fine? Please price the alternatives honestly — in particular, if you reject (2), tell me what it is about simplicity or prior probability that could make it a guide to truth rather than a psychological convenience, and whether that guide is itself answerable to evidence; and if you reject the move from (1) to (3), tell me whether the repaired argument (the one resting on globally, permanently empirically equivalent rivals) would then prove too much, since it seems to bear on observable matters like tables and other minds and not merely on electrons. If I have to choose, I would much rather keep the claim that my evidence can favour one model over another than keep the argument that says it cannot. Please answer in British English, and be explicit about how confident you are in the diagnosis you give: say which step your own account is most likely to be wrong about, and what argument or consideration would change your mind.
reasoning: |-
  Hmm, the user is a final-year PhD student in infectious-disease modelling, grappling with a philosophical argument from their flatmate that challenges the very foundations of their work. The flatmate claims that no amount of evidence can ever favour one empirically adequate theory over another, rendering model selection arbitrary. This argument has serious professional and practical implications for the user.

  The argument is structured in four steps: (1) For any theory T fitting evidence E, one can construct countless alternatives (T*) that fit E equally well but make different predictions about unobserved cases; (2) Therefore E cannot justify preferring T over these rivals; (3) This holds for any possible evidence, present or future; (4) Thus no claim about the unobserved is ever evidentially justified. 

  The user feels something is amiss between steps (1) and (3) but can't articulate it. They want to know which step to reject and why, with special attention to whether simplicity/priors could be truth-conducive (if rejecting step 2), or whether the "repaired" argument (using globally equivalent rivals) proves too much (if rejecting the move to step 3). 

  Key considerations:
  - Step 1 is technically correct but exploits a logical possibility without empirical traction. These T* rivals are parasitic constructs, not genuine scientific hypotheses.
  - Step 2's claim of "no reason whatsoever" is too strong. While evidence alone underdetermines theories, step 2 ignores that scientific inference is dynamic and cumulative. The rivals in step 1 aren't symmetric under *further* evidence.
  - The gap between (1) and (3) is crucial: step 1 shows underdetermination *given fixed evidence*, but step 3 claims underdetermination *across all possible evidence*. The "repaired" argument relies on globally equivalent rivals (e.g., universal distorting forces), which are metaphysically extravagant and untestable by design.
  - Rejecting step 2 risks making science subjective, but Bayesian approaches show priors (like simplicity) aren't arbitrary—they track past empirical success and can be validated over time. Simplicity often correlates with predictive accuracy.
  - The "repaired" argument proves too much: it would also undermine everyday inferences (e.g., "the sun will rise"), yet we navigate the world by trusting evidence. This suggests a flaw in the premise that evidence must *logically guarantee* truth to justify belief.

  Professional stakes: The user needs to defend model selection without denying underdetermination. The solution is to distinguish between *logically possible* rivals (which are irrelevant) and *scientifically plausible* ones. Their field already does this via model validation, cross-testing, and pragmatic criteria. The flatmate's argument, while clever, misrepresents scientific practice as a truth-conducive process.
answer: |-
  Right, let's dismantle this step-by-step. Your flatmate's argument is a sophisticated version of the underdetermination thesis, and while logically clever, it fails to capture how scientific inference actually works – and *must* work – in practice. I reject **step (2)** as the core misstep. Here’s why, priced honestly:

  1.  **Step (1) is Technically Correct (But Misleading):** Yes, for any finite body of evidence E and any theory T that fits E, you can construct infinitely many "grue"-style rivals (T*) that fit E perfectly but diverge wildly on unobserved cases. This is the classic problem of underdetermination by current evidence. *This step itself isn't the core issue.* It highlights a genuine challenge: evidence alone doesn't *logically entail* a unique theory.

  2.  **Step (2) is Where It Goes Wrong: The False Symmetry Claim.** The claim is: "E gives no reason whatsoever to prefer T to any of them... any further tie-breaker... is a fact about us rather than a reason to think T is true." **This is the step I reject, and I'm about 85% confident this is the critical flaw.** Here’s why:
      *   **The Rivals Aren't Genuinely Symmetric:** The constructed T* theories aren't just "different"; they are *parasitic* monstrosities. They are defined *entirely negatively* ("T holds *except* where I arbitrarily say C happens"). They lack *internal coherence*, *explanatory power*, or *independent motivation*. T might explain *why* E occurs (e.g., gravity explains planetary orbits *and* apple falls *via a single mechanism*), while T* merely *describes* E and tacks on arbitrary, unexplained future exceptions ("gravity works until 2100, then stops for no reason").
      *   **Tie-Breakers Aren't *Merely* Subjective:** Simplicity, elegance, unification, prior probability – these aren't *just* psychological preferences or arbitrary "aesthetics plus career incentives." They are *epistemic virtues* honed by the history of science because they have proven *reliably truth-conducive* over time. Why?
          *   **Simplicity (Parsimony):** Theories postulating fewer *ad hoc* entities, forces, or exceptions have consistently turned out to be more predictively accurate and robust as new data arrives. Adding arbitrary future disjunctions (like "blue after 2100") increases complexity without explanatory gain. The universe *does* appear to operate via relatively simple, unified laws. Choosing the simpler theory isn't a guarantee, but it's a rational bet based on this empirical meta-pattern.
          *   **Prior Probability (Bayesianism):** In a Bayesian framework, prior probability reflects our *rational degrees of belief* based on *background knowledge* (past scientific success, known mechanisms, coherence with other well-established theories). Prior probabilities *are* answerable to evidence, just *indirectly* and *over time*. A prior favouring T over a bizarre T* isn't capricious; it's based on the track record of theories *like* T (with internal coherence, explanatory power) versus theories *like* T* (arbitrary, parasitic, lacking mechanism). When new evidence E' arrives:
              *   T predicts E' based on its core mechanism.
              *   Most T* rivals (constructed solely to fit E) will *not* fit E' unless specifically re-jigged *again* to be parasitic on T+E+E'. The *predictive track record* of T builds its credibility, while the T* rivals constantly need rescuing. This differential ability to *predict novel evidence* breaks the alleged symmetry. The evidence *does* favour T over T* once E' arrives, precisely *because* of the prior weight given to T's coherence and simplicity.
      *   **"Fact About Us" vs. "Guide to Truth":** The epistemic virtues *are* grounded in our interaction with the world. But crucially, *their success is empirically validated*. Simpler, more unified theories consistently make better *novel predictions*. This track record suggests these virtues *track something about the structure of reality*, not just our psychology. They are heuristics evolved through scientific practice to navigate underdetermination effectively.

  3.  **Step (3) Overgeneralizes the Problem:** While the *logical possibility* of constructing *some* rival always exists (as per Step 1), Step 3 claims this means evidence *never* breaks the symmetry. This ignores the dynamic nature of science:
      *   **Accumulating Evidence Constrains:** As E grows, the space of *plausible* rivals that fit *all* the evidence *without* being grotesquely *ad hoc* shrinks dramatically. While infinitely many *logically possible* T* exist, the vast majority become so complex, disunified, and lacking in explanatory power that they cease to be *scientific* contenders. They are dismissed precisely because the epistemic virtues embodied in T have proven reliable guides.
      *   **The "Globally Equivalent" Rivals are Suspect:** Your flatmate's "repair" (Euclidean + universal force, 5-minute hypothesis) proves too much. These rivals *are not* empirically equivalent in the way scientific theories are. They are:
          *   **Designed to be Unfalsifiable:** The "universal force" or "false memories" are explicitly defined *to cancel out* any possible observable difference. They are metaphysical cheats, not scientific hypotheses offering testable mechanisms. Science operates under the methodological principle that such unfalsifiable constructs are non-explanatory and irrelevant to empirical inquiry. Demanding evidence favour T over an unfalsifiable rival is a category error.
          *   **Lack Predictive Power:** They don't generate *novel, testable predictions* in the way T (e.g., General Relativity) does. GR predicted light bending; "Euclidean + magic force" just says "whatever you see, we'll define the force to make it fit Euclidean geometry afterwards."
      *   **Distinguishing Observable/Unobservable:** The argument *does* bear on observable matters like tables and other minds, *but so does common sense*. We reject solipsism or the 5-minute hypothesis about tables not because of a single observation, but because the *entire coherent, predictable, intersubjective structure of our experience* is vastly better explained by the existence of persistent external objects and other minds. The epistemic virtues apply here too. The "globally equivalent" rival only *seems* threatening in isolation; when embedded in the total evidence of our lived experience, it loses all plausibility.

  4.  **Step (4) is the Unpalatable (and Unnecessary) Conclusion:** Accepting this would paralyze science and daily life. We *are* justified in believing the bridge will hold (based on engineering principles validated by evidence and simplicity) and that the sun will rise (based on celestial mechanics with immense predictive success). We reject the grue-like alternatives *for good reason*.

  **Why Step (2) *Looks* Fine (and Where I Might Be Wrong):**
  Step (2) looks compelling because it highlights genuine underdetermination *at a single snapshot in time with fixed evidence*. It correctly says logic alone + E doesn't *force* you to choose T. The error is leaping to "therefore, no reason whatsoever exists" and dismissing all tie-breakers as non-epistemic. It ignores the *dynamic, cumulative, and abductive* nature of scientific reasoning, where simplicity, explanatory power, coherence with background knowledge, and *track records of successful prediction* built on those virtues *are* evidential reasons.

  **My Confidence & What Would Change My Mind:**
  *   **Confidence in rejecting Step (2): 85%.** I think the argument for epistemic virtues being truth-conducive is strong, based on the historical success of science and Bayesian formalisms. The parasitic nature of T* rivals is crucial.
  *   **Where I'm most vulnerable:** If someone could show that *all* epistemic virtues (simplicity, unification, etc.) are *provably* no more reliable than random chance in leading to true theories *in the long run*, despite the apparent historical pattern, that would undermine my position. This seems unlikely, as it would make the success of science a colossal fluke. Similarly, if Bayesianism could be shown to be fundamentally incapable of converging on truth even with ideal priors reflecting past success, that would be a problem (though I think it can).
  *   **The Gap Between (1) and (3):** Your instinct is right. (1) shows underdetermination *relative to current E*. (3) claims permanent underdetermination *across all possible evidence*. The "globally equivalent" rivals bridge this gap by construction, but as argued, they are artificial, unfalsifiable, and unscientific. Rejecting them as illegitimate restores the ability of accumulating evidence to favour theories exhibiting genuine epistemic virtues. If someone could present a *plausible, non-ad-hoc, scientifically engageable* theory that was *permanently and globally* empirically equivalent to our best theories but logically incompatible, *that* would be a serious challenge (≈ 10% chance this could be done meaningfully). The examples given (Euclidean+force, 5-min hypothesis) don't meet this bar.

  **Implications for Your Work:**
  Your model selection *isn't* arbitrary aesthetics. When you argue Model A is better supported than Model B, you are (or should be) appealing to:
  1.  **Fit to Data:** Both might fit current surveillance data well (Step 1 acknowledged).
  2.  **Explanatory Power/Mechanistic Plausibility:** Does A better reflect known biology, transmission pathways, or host behaviour? Does B require implausible *ad hoc* assumptions? (This attacks the symmetry claim in Step 2).
  3.  **Predictive Performance/Validation:** How well did A vs. B predict *out-of-sample* data, or data from slightly different contexts? (This leverages accumulating evidence against the Step 3 claim of permanent symmetry).
  4.  **Parsimony:** Does A achieve similar fit with fewer arbitrary parameters? (Invoking simplicity as an epistemic virtue).
  5.  **Robustness:** Are A's conclusions stable under reasonable variations? Does B's fit depend critically on fragile assumptions? (Again, breaking symmetry).

  You are justified in this. The flatmate's argument is a powerful logical puzzle, but it fails as a description of rational scientific inference. It confuses *logical possibility* with *scientific plausibility*, and *current underdetermination* with *permanent underdetermination*. Stick to your models and your evidence – your reasoning is sounder than the philosopher's paradox.
