  Okay, picture this: a hiring panel at a mid-sized tech company needs to decide between two candidates, Alex and Bailey. One is genuinely the better hire—let’s say it’s Alex—but nobody knows that for sure. Each of the ten panelists gets a private hint, like a snippet from a reference check or a quick coding assessment they review alone. The hint points to Alex or Bailey with 70% reliability—meaning that if Alex is better, there’s a 70% chance the hint says "Alex," and 30% it says "Bailey" (and vice versa if Bailey were better). Everyone votes in sequence, sees all previous votes, and purely wants to pick the better candidate. No peer pressure, no hidden agendas—just cold, rational decisions based on the available information.

  Here’s how it unfolds when everyone sees everything. The first panelist gets a hint. No prior votes, so they trust their 70% hint. Suppose it says "Bailey"—which happens 30% of the time since Alex is actually better. They vote Bailey. The second panelist also gets a hint. If it also says "Bailey" (another 30% chance), they now have two signals: their own Bailey hint and the first vote, which implies the first panelist’s hint was likely Bailey too. Two Bailey hints versus one Alex hint would strongly suggest Bailey is better—specifically, the odds favor Bailey by about 5 to 1. So they vote Bailey, even if their private hint had been Alex. Now the third panelist sees two Bailey votes. That’s equivalent to two Bailey signals. Even if their private hint says Alex, the math leans heavily toward Bailey—about 8 to 1—so they ignore their hint and vote Bailey. Every panelist after that faces the same overwhelming signal from the growing pile of Bailey votes. They all rationally vote Bailey, ignoring their private hints. A herd forms, and it’s wrong—Alex was the better hire. The private hints, if pooled independently, would have shown a majority for Alex (since 70% point correctly), but the sequential voting buried that signal.

  Now, the intervention. Fast-forward to the eighth panelist. By now, the herd is entrenched—seven Bailey votes. Normally, they’d see that, ignore their own hint, and vote Bailey. But we make them a "sealed decider": they get no access to the voting history, only their private hint. Everyone else still sees all votes, including the sealed decider’s, and knows she was kept in the dark. Suppose her hint says "Alex" (which happens 70% of the time, since Alex is better). She votes Alex—purely based on her 70% hint. Now the ninth panelist sees the history: seven Bailey votes and one Alex vote. Seven Bailey signals (each 70% reliable) and one Alex signal. The math still favors Bailey—about 5 to 1—so they vote Bailey, ignoring their own hint. The tenth panelist sees eight Bailey votes and one Alex vote, which still strongly favors Bailey. The herd doesn’t break yet. But let’s add more panelists. Suppose you have twenty in total. Panelists eleven through twenty see the same skewed history and keep voting Bailey. The sealed decider’s lone Alex vote isn’t enough to overcome the seven-vote Bailey lead.

  But here’s the key: the sealed decider’s vote isn’t wasted. It’s a seed of truth. Now, imagine we do this many times. In 70% of cases, the sealed decider votes Alex (matching her hint). And when she does, her vote becomes public data. Even though it doesn’t break the herd immediately, it reduces the Bailey lead. If a second sealed decider were added later (say, at position twelve), the accumulated Alex votes could eventually tip the balance. For simplicity, let’s stick with one. The sealed decider personally gives up the safety of following the herd. If her hint had been Bailey (30% chance), she’d vote Bailey anyway—same as she would’ve in the herd. But if her hint is Alex (70% chance), she votes Alex correctly, whereas in the herd she’d have voted Bailey incorrectly. So she gains in expectation: her accuracy jumps from 0% (herded wrong) to 70% (voting her hint). Everyone behind her initially gains nothing—they still herd wrong—but if the group is large enough, that Alex vote pays off. For instance, if there are ten panelists after her, and her Alex vote helps future sealed deciders (or a run of Alex hints) correct the herd, the later voters escape the wrong cascade. Roughly, with 15+ total panelists, the expected number of correct votes (due to the sealed decider’s influence and subsequent corrections) outweighs the cost. The sealed decider sacrifices her own certainty for the group’s long-term accuracy.

  What’s doing the work? Two things. First, the tie-breaking rule: when the evidence is perfectly balanced, our panelists follow their private hint. This is critical. In the ninth panelist’s calculation, seven Bailey votes vs. one Alex vote isn’t balanced—it’s lopsided. But if we’d placed the sealed decider earlier (say, third) and she voted Alex, the fourth panelist might face a close call (e.g., two Bailey votes vs. one Alex vote). At 70% reliability, that’s still tilted toward Bailey, but if we lower reliability to 60%, it becomes balanced, and the tie-breaker forces them to use their hint. If they flip a coin instead, the effect weakens—the herd breaks only half the time when it could—but doesn’t vanish. The core phenomenon survives: suppressing history allows private hints to surface, and with a tie-breaker that favors those hints, it corrects errors. Without it, the herd plows on.

  The best objection? That this is just a clever puzzle, not real life. After all, rational people might suspect herding and discount later votes. Or they might share hints directly. But in practice, cascades happen—in stock markets, hiring, or fashion—because it’s hard to track who copied whom. The sealed decider isn’t about perfect rationality; it’s a structural fix. You’re not adding information; you’re freeing one person to use what they already know. And that’s enough to nudge the group toward truth.
