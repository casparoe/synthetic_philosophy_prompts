  Best objection: The model assumes that voters treat each prior vote as an independent signal, but in reality, once a cascade starts, the votes are not independent because they are just following the crowd. So the Bayesian updating is misspecified. In particular, the votes after the cascade are not providing new information, but the voters act as if they are. Therefore, the cascade is an artifact of the unrealistic assumption that voters believe that each vote is an independent signal.

  However, in defense, even if voters are aware of the possibility of cascades, it is very difficult to update correctly because they don't know at which point the cascade started. This is the point of the sealed decider: by blocking the history, you force the voter to use only their private signal, which is valuable information that would otherwise be suppressed.

