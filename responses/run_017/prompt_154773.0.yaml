  Okay, the user hosts a philosophy podcast on computation and needs interview questions for a guest advocating resource-relative Bayesianism. They want pointed questions targeting specific weaknesses in the theory, with follow-ups anticipating replies. The user has clearly mapped out 7 key pressure points and wants a structured interview that builds logically.

  Hmm, the guest's core idea—that epistemic norms should account for computational limits—is intriguing but vulnerable at several joints. The arithmetic disanalogy seems the sharpest opener: it forces a foundational distinction between mathematical truth and epistemic rationality. If the guest claims arithmetic has "determinate answers" while credences don't, that needs unpacking. The follow-up should press whether this concedes anti-realism about epistemic norms.

  For approximation (point 2), the tolerance threshold question cuts deep. If she appeals to accuracy-with-bounds, we need to ask why those bounds aren't arbitrary—this ties into whether the view offers justification or mere excuse. The hardware discontinuity point (6) feels almost theatrical—buying a slower machine to lower rational standards seems absurd, but if she bites the bullet, the disagreement follow-up could highlight troubling relativism.

  The regress problem (4) is technically nasty. If "best feasible procedure" depends on another infeasible computation, does the norm collapse? Her likely reply about counterfactual programs invites a killer follow-up: "How is this not just describing what we do?" That probes whether the theory has normative teeth.

  Notion of feasibility (point 3) risks leaking objectivity. If she admits problem-distribution relativity, the "prudence vs. rationality" follow-up could corner her. Evidence about heuristics (5) is sneakier—if recognizing your heuristic's reliability triggers Bayesian demands, the view might self-undermine.

  The "what counts against it" closer (7) is smart. If brains approximate Bayes well, her urgency fades. The follow-up should challenge whether "Bayesian-ish" processes satisfy or undermine her thesis.

  Structure-wise: Start with conceptual foundations (1), then approximation mechanics (2), feasibility definition (3), regress threat (4), then applied tensions (5-6), closing with falsifiability (7). Drop #5 if time-crunched—it's important but more niche. Avoid letting her restate the view; every question must pivot to implications or objections.

  User clearly knows the literature (mentions Dutch books, bounded optimality). No need to cite papers—guest will handle that. Their pressure points seem accurate; the only potential miss is whether "resource-relative" itself requires normative grounding beyond physics, but that might overcomplicate.
answer: |-
  Here’s a structured, escalating sequence of questions targeting the core tensions in resource-relative Bayesianism, with follow-ups designed to force clarification and expose vulnerabilities. I’ve ordered them to build from conceptual foundations to implications, saving hardware discontinuity and falsifiability for the climax. Drop **Question 5 (Evidence about heuristics)** if short on time—it’s important but slightly niche.

  ---

  ### **Question Sequence**  
  *(~45 min total; follow-ups deployed only if initial answers are evasive or incomplete)*  

  1. **The Arithmetic Disanalogy (Conceptual Foundation)**  
     *Initial Question:* "You argue that intractability modifies what the *norm itself demands* in epistemology, unlike arithmetic where ‘ought implies can’ doesn’t absolve a wrong answer. But both involve tracking abstract truths. What’s the *metanormative* difference that makes probabilistic coherence defeasible by computational limits, but arithmetic correctness isn’t?"  
     *Likely Reply:* She’ll distinguish between "tracking mind-independent truths" (arithmetic) and "constitutive norms of rationality" (credences).  
     *Follow-up:* "If probabilistic coherence isn’t about tracking pre-existing truths, but is *constitutive* of rationality, how does granting exceptions to coherence not collapse into saying rationality *just is* what’s computationally feasible—effectively reducing ‘ought’ to ‘is’?"  

  2. **Approximation & Justification (Tolerance & Vindication)**  
     *Initial Question:* "When you say agents should be ‘as close as feasible’ to the ideal, what sets the tolerance threshold for ‘close enough’? And why wouldn’t accuracy dominance arguments—which show incoherent agents are *dominated*—still apply to near-coherent agents, just with looser bounds?"  
     *Likely Reply:* She’ll claim dominance can be redefined with ε-bounds based on resources, and that the agent is *justified* if using the best feasible procedure.  
     *Follow-up:* "If the dominance bound ε depends on computational budget, doesn’t that make the *norm itself* resource-relative? And if so, is the agent actually *justified* (i.e., their credences are epistemically permissible), or merely *excused* (their failure isn’t blameworthy)?"  

  3. **Feasibility’s Objectivity (Problem-Relativity)**  
     *Initial Question:* "You insist feasibility is ‘hard fact,’ but ‘best procedure’ seems to require specifying: ‘best’ *for what*? If we need a distribution over possible problems to define ‘average-case’ performance, or if ‘worst-case’ is relativized to an agent’s ecology, doesn’t this covertly reintroduce subjectivity?"  
     *Likely Reply:* She’ll bite the bullet—feasibility is objective *given* a problem distribution, which is fixed by the agent’s environment.  
     *Follow-up:* "If the norm now depends on environmental priors, hasn’t ‘rationality’ collapsed into *prudence*—doing what’s instrumentally best for survival in your niche—rather than something distinctively epistemic?"  

  4. **The Regress & Collapse (Bounded Optimality)**  
     *Initial Question:* "Deciding *how much computation to allocate* to a credal problem is itself computationally hard. If the norm is ‘use the best feasible procedure,’ but determining *what’s best* is infeasible, does this regress force the norm to reference only procedures the agent *actually considered*?"  
     *Likely Reply:* She’ll reject this, insisting we can evaluate counterfactual programs ("the best you *could* have run").  
     *Follow-up:* "But if we’re evaluating programs the agent *didn’t* run, how is this not an *external* standard? And doesn’t that mean rationality is defined by what a *hypothetical optimal designer* would do—making the norm descriptively inert for actual agents?"  

  6. **Hardware Discontinuity & Disagreement (Radical Consequences)**  
     *Initial Question:* "Your view implies that if I downgrade my hardware, I instantly become *more rational* without changing my credences, since the ‘best feasible’ standard lowers. Isn’t this a reductio? Or do you embrace that rationality is hardware-relative?"  
     *Likely Reply:* She’ll embrace hardware-relativity.  
     *Follow-up:* "Then two agents with identical evidence but different hardware can rationally disagree *forever*. Does your view require them to suspend judgment, or is persistent disagreement itself rational? And doesn’t this undermine truth-conduciveness as an epistemic goal?"  

  7. **Falsifiability & Empirical Bite (Bayesian Brain)**  
     *Initial Question:* "If cognitive science shows brains implement near-exact Bayesian inference in key domains (e.g., perception), does your claim that the ideal is ‘infeasible’ lose force? Does resource-relativity become less interesting the better our cognitive or artificial systems approximate ideal rationality?"  
     *Likely Reply:* She’ll argue "Bayesian-ish" isn’t the same as satisfying exact norms.  
     *Follow-up:* "But if our best models show brains *do* achieve coherence in complex tasks, doesn’t that suggest your ‘infeasibility’ claim overgeneralizes? What empirical result *would* falsify your view?"  

  ---

  ### **Why This Sequence & Where to Cut**  
  - **Flow**: Starts with meta-norms (Q1), then internal tensions (Q2–4), peaks with radical consequences (Q6), and closes with empirical stakes (Q7). Builds from "what is the norm?" to "what follows?"  
  - **Drop Q5 if needed**: While evidence about heuristics is clever, it’s recursive and risks sidetracking. The core issues are feasibility’s objectivity (Q3), regress (Q4), and discontinuity (Q6).  
  - **Pressure Points**: Your analysis is sharp. Only tweak: Q3’s "prudence" follow-up is dead-on—it forces her to choose between epistemic purity and pragmatic collapse.  
  - **Peak Timing**: Q6 (hardware) at ~30 mins creates drama; Q7 (falsifiability) ends on forward-looking critique.  

  **Final Tip**: If she deflects with "That’s not my view," re-anchor with: "Then what *does* your view say about this?" Keep the focus on *consequences*, not restatement.
