  1. A reporting round where students provide an interval (lower and upper bound) for the proportion of red balls in a bag (between 20 and 80 red out of 100). They are scored in a way that penalizes both being wrong (the interval doesn't contain the true proportion) and being too wide. The scoring rule should make them trade off between width and accuracy.

  2. A round that distinguishes between:
     (a) having no idea about the chance (so they report a wide interval),
     (b) having a second-order uncertainty (they have a sharp credence but are not confident, so they report a narrow interval but might be willing to bet at a number?),
     (c) having a sharp credence and rounding (so they report a point but it's an approximation).

     In this round, we want to see behavior: the student with second-order uncertainty still transacts at a number (so they are willing to bet at some odds), while the student with an open interval (imprecise) refuses to take either side of a bet. We need to make the refusal visible and costly to fake.

  3. A forced-action round: the group must choose one of two options, and the better option depends on the true proportion. The interval does not tell them which member to use, leading to a debate about whether to pick one or not.

  4. A fourth round to demonstrate that conditioning on new evidence can sometimes widen the interval (if that's real). If not, we show something else strange about intervals.

  Constraints: 
  - No money, use points and a leaderboard.
  - Materials: index cards, projector, an opaque bag with 100 ping-pong balls (20-80 red, fixed by a helper).
