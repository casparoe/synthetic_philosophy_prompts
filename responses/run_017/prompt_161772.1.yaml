answer: |-
  Below is a complete design for your seminar session, structured around your four requested rounds. The activity uses the opaque bag of 100 ping-pong balls (with 20–80 red balls, fixed by a helper) and focuses on experiential learning. The goal is to make students confront the limitations of intervals (without using terms like "imprecise" until the debrief) through scored decisions. The design includes setup, step-by-step instructions, scoring mechanics, and predicted student behaviors.

  ---

  ### **Overall Setup**
  - **Materials**: Index cards, projector, opaque bag of 100 balls (20–80 red), helper’s note with true number of red balls (revealed at key points).
  - **Scoring**: Use a leaderboard (projected) with "points" (not money). Start all students at 100 points. Penalties subtract points; rewards add points. Mild shame: Highlight top/bottom 3 on the leaderboard.
  - **Key constraints**: No upfront lecture. Avoid words like "imprecise," "ambiguity," or "Knightian." Focus on observable behavior.

  ---

  ### **Round 1: Reporting Bounds (Width vs. Accuracy Tradeoff)**
  **Objective**: Force students to experience the cost of wide intervals (uninformative) vs. narrow intervals (risky).  
  **Mechanics**:  
  - Each student writes a lower bound (L) and upper bound (U) for the % of red balls (e.g., [40, 60] for 40–60%) on an index card.  
  - **Scoring rule**:  
    - If the true proportion \(p\) is in [L, U]: Penalty = \((U - L) \times 5\) points.  
    - If \(p\) is outside [L, U]: Penalty = \((U - L) \times 5 + 40 \times d\) points, where \(d\) is the distance to the nearest bound (e.g., if \(p = 35\) and bounds are [40,60], \(d = 5\)).  
  - **Rationale**: Width penalty \((U - L) \times 5\) encourages narrowness. Miss penalty \(40 \times d\) heavily punishes errors. Tradeoff is explicit: "0 to 100" is safe (0 miss penalty) but costly (width penalty = 500 points), while "50" (point) is cheap (width penalty = 0) but risky (miss penalty = 40 per % error).  

  **Procedure**:  
  1. Introduce the bag: "Between 20 and 80 red balls; helper fixed the number; no one knows."  
  2. Explain scoring (show formula on projector): "You lose points for wide intervals and more for missing the truth."  
  3. Students write [L, U] on cards (2 mins). Collect cards.  
  4. Reveal true \(p\) (from helper’s note). Calculate scores and update leaderboard.  

  **Predicted Behavior**:  
  - Many will default to [40, 60] (around 50%, moderate risk).  
  - Some will choose [0,100] (safe but costly).  
  - A few will write a point (e.g., [50,50], risking a huge penalty if wrong).  
  - **Debrief hook**: "Notice how your choice of penalty parameters (5 and 40) drove your losses—not just your 'knowledge'."  

  ---

  ### **Round 2: Betting Round (Separating Uncertainty Types)**
  **Objective**: Distinguish (a) no idea, (b) unsure about a sharp number, and (c) rounding, through betting behavior.  
  **Mechanics**:  
  - Event: "Next ball drawn is red" (draw with replacement after bets).  
  - Each student sets two prices on a card:  
    - **B**: Max price they’ll pay to buy a ticket paying 1 point if red.  
    - **S**: Min price they’ll sell the ticket for.  
  - **Forced action at Q = 0.5** (set by you):  
    - If \(B \geq 0.5\), they **buy** the ticket at 0.5 points (lose 0.5 if not red, gain 0.5 if red).  
    - If \(S \leq 0.5\), they **sell** the ticket at 0.5 points (gain 0.5 if not red, lose 0.5 if red).  
    - If both true, they **must buy** (no opting out).  
    - If neither true, they **do nothing**.  
  - **Scoring**: Resolve bets after one ball draw.  

  **How types separate**:  
  - **(a) No idea** (e.g., [30,70]): Sets B low (e.g., 0.3), S high (e.g., 0.7). Neither condition true at Q=0.5 → does nothing. Avoids loss but gains nothing.  
  - **(b) Unsure but has a number** (e.g., believes p=0.55 but lacks confidence): Sets B and S near 0.55 (e.g., [0.54, 0.56]). Since B=0.54 < 0.5? No, 0.54<0.5 is not ≥0.5? Let's correct: If they set B=0.55 and S=0.55, then B=0.55≥0.5 → buys. They transact at 0.5, betting despite uncertainty.  
  - **(c) Rounding** (e.g., true credence 0.49, rounds to 0.50): Sets B and S at 0.50. B=0.50≥0.5 and S=0.50≤0.5 → must buy. Forced to act as if sharp, even if wrong.  

  **Procedure**:  
  1. Explain the ticket and prices: "B is your max buy price, S is your min sell price."  
  2. Students write B and S (3 mins). Collect cards.  
  3. Reveal Q=0.5 on projector. Assign actions.  
  4. Draw one ball (reveal color); resolve bets/points.  

  **Predicted Behavior**:  
  - Type (a) does nothing (visible inaction; costs 0 points but misses opportunity).  
  - Types (b)/(c) buy or sell (may gain/lose points).  
  - **Key**: Type (a) refusal is costly to fake—if they set B/S near 0.5 to "blend in," they’re forced to bet and risk loss.  

  ---

  ### **Round 3: Forced Group Action (Interval Decision Paralysis)**
  **Objective**: Strand the group when intervals include the critical value, forcing debate about "which number to use."  
  **Setup**: Group must choose one option for the whole class:  
  - **Option 1**: Everyone gains \(100 \times p\) points (true proportion, revealed later).  
  - **Option 2**: Everyone gains 50 points.  
  *Note: Option 1 dominates if p > 0.5; Option 2 dominates if p < 0.5.*  

  **Procedure**:  
  1. Announce options: "As a group, commit to Option 1 or 2. Majority vote wins."  
  2. Give 5 mins for debate. Encourage students to use their intervals.  
  3. Group votes; lock in choice.  
  4. Reveal true \(p\) (count all balls publicly). Award points.  

  **Predicted Behavior**:  
  - If the group’s pooled intervals include 0.5 (e.g., someone has [40,60]), they’ll argue: "We don’t know if p>0.5!"  
  - Some will advocate for Option 2 (safe 50); others for Option 1 (if they think p>0.5).  
  - **Stranding moment**: After choice, when p is revealed, they see:  
    - If they chose Option 1 but p<0.5, they lose points (e.g., p=0.4 → 40 points vs. safe 50).  
    - If they chose Option 2 but p>0.5, they lose (e.g., p=0.6 → 60 points vs. 50).  
  - **Debrief hook**: "Your interval didn’t tell you which number to act on—was it fair to just pick 0.5?"  

  ---

  ### **Round 4: Conditioning Widens Intervals (The "Bug")**
  **Objective**: Show that updating on evidence can widen intervals (a real phenomenon in imprecise probability).  
  **Setup**: Use two rounds of ball draws to simulate updating.  
  **Mechanics**:  
  - **Initial prior**: Students write new bounds [L, U] for p, *ignoring Round 1* (2 mins).  
  - **Evidence**: Draw one ball; reveal color (e.g., red).  
  - **Update**: Students write *posterior* bounds [L', U'] for p given the draw (2 mins).  
  - **Scoring**: Same as Round 1, but compare width and accuracy.  

  **The widening effect**:  
  - Students often widen intervals after seeing evidence. Example:  
    - Prior: [40, 60] (width 20).  
    - After red draw, they might widen to [35, 65] (width 30) because the draw is consistent with both high and low p.  
  - **Why it happens**: With intervals, a single draw doesn’t rule out extremes (e.g., p=0.2 could produce red by chance). Students overcompensate for uncertainty.  
  - **Scoring impact**: Wider intervals increase width penalty. Some may miss p despite widening.  

  **Procedure**:  
  1. Students write prior [L, U] (ignore Round 1 to avoid anchoring).  
  2. Draw one ball; reveal color.  
  3. Students write posterior [L’, U’].  
  4. Reveal true p; score both priors and posteriors.  

  **Predicted Behavior**:  
  - Most will widen intervals after the draw (visible on cards).  
  - Leaderboard shows higher width penalties for posteriors.  
  - **Debrief hook**: "Notice how new evidence made your intervals *less* precise? That’s a feature of intervals—but is it rational?"  

  ---

  ### **Debrief Guide**  
  **Timing**: 15–20 mins. **Start**: "Today was about what happens when you don’t have a number."  
  **Map moments to distinctions**:  
  - **Round 1**: Width penalty = cost of "no number." Miss penalty = cost of fake precision (e.g., rounding 0.5001 to 0.5).  
  - **Round 2**: Inaction = "no number" (Type a). Betting = "unsure but has a number" (Type b) or "rounding" (Type c).  
  - **Round 3**: Stranding = intervals don’t specify which number to act on.  
  - **Round 4**: Widening = intervals respond "irrationally" to evidence.  

  **Predictably Wrong First Run**:  
  1. **Round 1**: Many write [50,50] (point) because "it’s the middle." They’ll suffer huge miss penalties if p≠50.  
  2. **Round 2**: Some set B=S=0.5 to "be fair," then resent being forced to bet.  
  3. **Round 3**: Group defaults to Option 2 (safe 50), even if intervals suggest p>0.5.  
  4. **Throughout**: 1–2 students "game you" (e.g., always [0,100] to avoid miss penalties).  

  **What the Activity Can’t Deliver (Requires Your Normative Input)**:  
  - The activity *shows* that intervals avoid arbitrary precision but cause indecision and instability. **You must argue**:  
    - "Intervals aren’t ‘uncertain numbers’—they represent unresolved ambiguity."  
    - "But should we allow inaction (Round 2) or pick a number (Round 3)? That’s normative: maxmin vs. averaging."  
    - "Widening (Round 4) isn’t a bug if ambiguity increases—but it feels wrong for Bayesians."  

  **Final Tip**: Run tight timers. Use the projector for scores, decisions, and true reveals to create tension. The "cost" of no-number should feel visceral in the leaderboard.
