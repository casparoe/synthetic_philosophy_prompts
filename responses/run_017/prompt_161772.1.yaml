  But let's try to do an update:

  Suppose we have an urn with 100 balls, each either red or blue. We know that the number of red balls is either 30 or 70. So p is in {0.3, 0.7}. The initial set is {0.3,0.7}.

  Now, we draw one ball and it's red. Then the probability of red given p=0.3 is 0.3, given p=0.7 is 0.7. So the unnormalized posterior for p=0.3 is 0.3, for p=0.7 is 0.7. Normalized: P(p=0.3|red) = 0.3/(0.3+0.7)=0.3, P(p=0.7|red)=0.7. So the posterior chance of red on the next draw is: if p=0.3, then 0.3; if p=0.7, then 0.7. And the posterior probabilities are 0.3 and 0.7. So the set of possible chances is still {0.3,0.7}. But now we have a distribution over them. The expected chance is 0.3*0.3 + 0.7*0.7 = 0.09+0.49=0.58. But the set of possible values is still the same.

   To get widening, consider:

  Suppose that the urn is chosen from two types:
  - Type 1: contains 30 red and 70 blue.
  - Type 2: contains 30 blue and 70 red.
  - Type 3: contains 50 red and 50 blue.

  But initially, we don't know which type it is. So p in {0.3, 0.5, 0.7}. 

  Now, we draw one ball and it's red. How does this update the set of possible p?

  The likelihoods:
  - If type 1 (p=0.3): P(red)=0.3
  - If type 2 (p=0.7): P(red)=0.7
  - If type 3 (p=0.5): P(red)=0.5

  After seeing red, we can rule out nothing. The set of possible p is still {0.3,0.5,0.7}. 

  But the posterior probability of each type is proportional to the likelihood times prior. If we assume a uniform prior (1/3 for each), then:
  - P(type1|red) ∝ (1/3)*0.3 = 0.1
  - P(type2|red) ∝ (1/3)*0.7 = 0.7/3 ≈ 0.233
  - P(type3|red) ∝ (1/3)*0.5 = 0.5/3 ≈ 0.1667
  Normalize: 0.1+0.233+0.1667=0.5, so:
    type1: 0.1/0.5=0.2
    type2: 0.233/0.5=0.466
    type3: 0.1667/0.5=0.3333

  Then the posterior chance of red on the next draw is:
    0.2*0.3 + 0.466*0.7 + 0.3333*0.5 = let's compute: 0.06 + 0.3262 + 0.16665 = 0.55285

  But the set of possible values for the next draw is still {0.3,0.5,0.7}. So the set didn't change.

  I recall that in some models with imprecise probabilities, when you have a set of priors that is not closed under conditionalization, the updated set can be larger. But that's advanced.

