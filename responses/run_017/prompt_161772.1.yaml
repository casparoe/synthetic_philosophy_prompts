  This is a known phenomenon in imprecise probability: when you have a set of priors and you update each prior by Bayes' rule, the resulting set of posteriors can be more dispersed.

  Example: 

  Suppose we have two urns:
  - Urn A: 50 red, 50 blue
  - Urn B: 100 balls, either all red or all blue, but we don't know which.

  But we said no unknown urn. We have one urn with fixed p between 20 and 80.

  We can do: we have the same bag. We draw a ball and it's red. How does that update the interval for p?

  Initially, p in [20,80]. After seeing a red ball, what is the updated interval?

  If they use Bayes' rule for each possible p, then the likelihood of red is p. The prior is uniform? But we haven't specified a prior. The initial set of priors is all distributions with support [20,80]? Or we take the set of point masses? 

  If we take the set of possible p in [20,80], then after seeing a red ball, the posterior for p is still [20,80]? Because every p in [20,80] is possible. The likelihood doesn't rule out any p. So the interval remains the same.

  That doesn't widen.

  To see widening, we need an example where the evidence is more informative for some values than others? Or we need a set of priors that is not the entire interval.

  Example from the literature: 

  Suppose we have two coins, one fair and one biased (2/3 heads). We choose one coin at random. The chance of heads on the chosen coin is either 1/2 or 2/3. So the initial set of chances is {1/2, 2/3}. This is a discrete set.

  Then we flip the coin and get heads. The posterior for the fair coin: P(fair|heads) proportional to P(heads|fair)*P(fair) = (1/2)*(1/2)=1/4.
  For the biased coin: (2/3)*(1/2)=1/3. So P(fair|heads)= (1/4)/(1/4+1/3)= 3/7, so the chance of heads on the next flip is: (3/7)*(1/2) + (4/7)*(2/3) = ... which is a number between 1/2 and 2/3.

  But initially, the set of possible chances was {1/2, 2/3}. After seeing heads, the chance is a mixture, so it's a single number? But we can consider the set of posteriors: if we consider the set of priors that are point masses on the coins, then after heads, we have a single posterior chance? 

  Alternatively, we can consider a set of priors that includes distributions over which coin it is. For example, the set of priors is all distributions that assign probability q to the fair coin and 1-q to the biased, for q in [0,1]. Then the initial set of chances for heads is [1/2, 2/3] (because if q=1, chance=1/2; q=0, chance=2/3).

  After seeing heads, the updated q becomes: q' = (q * 1/2) / (q*1/2 + (1-q)*2/3) = (q/2) / (q/2 + 2(1-q)/3) = (q/2) / ((3q + 4(1-q)) / 6) = (q/2) * 6/(4 - q) = 3q/(4-q)

  Then the posterior chance of heads on the next flip is: 
     (q')*(1/2) + (1-q')*(2/3)

  As q varies in [0,1], the posterior chance varies in [2/3, 2/3] when q=0? Let's compute:

  If q=0: q'=0, posterior chance = 2/3.
  If q=1: q'= 3*1/(4-1)=1, posterior chance=1/2.
  If q=0.5: q'= 3*0.5/(4-0.5)=1.5/3.5=3/7, posterior chance= (3/7)*(1/2) + (4/7)*(2/3) = 3/14 + 8/21 = (9+16)/42 = 25/42 ≈ 0.595

  So the set of posterior chances is [1/2, 2/3]? But note: when q=0, posterior chance=2/3; when q=1, it's 1/2. And for q in (0,1), it's in between. So the set is [1/2, 2/3] again. So it's the same interval.

  To get widening, we need a different structure.

  Another example: the three-color urn (Ellsberg). But we have only two colors.

  Alternatively, we can use an example with independence. 

  Suppose we have two independent coins. Coin1 is known to be fair. Coin2 has an unknown bias p in [0.4, 0.6]. We flip both coins. Event A: both coins come up heads. What is the probability of A?

  Initially, the set of possible p for coin2 is [0.4,0.6], so P(A) = (1/2) * p for p in [0.4,0.6] -> [0.2, 0.3].

  Now, we condition on the fact that coin2 came up heads. Then what is the probability that coin1 is heads? 

  Given coin2=heads, the probability of coin1=heads is still 1/2, because they are independent. So the set of posteriors for P(A|coin2=heads) is still 1/2. 

  But wait, we want to see the set for the probability of A (both heads) given some evidence.

  Alternatively, we condition on the total number of heads. But that might be complex.

