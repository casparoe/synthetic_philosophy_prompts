  ### Summary of the Activity

  **Part 1: Reporting Interval**
  - We have a bag of 100 balls, 20-80 red (fixed, unknown).
  - Each student writes L and U (in % or [0,100]) on a card.
  - Scoring: 
      - Width cost: (U - L)
      - If p is in [L, U]: penalty = width
      - If p is not in [L, U]: penalty = width + 40 * (distance to the interval)   [distance in percentage points]
      - So score = - penalty. (We can report score as negative, or we can set a base and subtract penalty.)

  **Part 2: Betting Round**
  - Event A: the next ball drawn is red.
  - Each student writes B (buy price) and S (sell price) for a ticket that pays 1 if A occurs.
  - We set Q=0.5.
  - For each student:
      - If B>=0.5, they buy the ticket at 0.5: so they pay 0.5 and get 1 if A.
      - If S<=0.5, they sell the ticket at 0.5: so they receive 0.5 and must pay 1 if A.
      - If both conditions hold, they buy.
      - If neither, they do nothing.
  - Then we draw a ball (with replacement) and resolve the bets.

  **Part 3: Group Decision**
  - The group must choose one option:
      - Option 1: pays 100 * p (where p is the true proportion of red balls) to each student.
      - Option 2: pays 50 points to each student.
  - They discuss and vote.
  - After they choose, we reveal p (by counting the balls) and compute payoffs.

  **Part 4: Skipped or replaced by a discussion on decision making with intervals.**

  ### Debrief

  - Map moments:
    - Part 1: the trade-off between width and accuracy. Some might have given wide intervals to avoid missing, but then lost points for width. Some might have given a point and missed, losing heavily.
    - Part 2: The student with a wide interval (e.g., [30,70]) might have done nothing because B=30<0.5 and S=70>0.5. The student with a sharp credence of 0.6 would have set B=0.6 and S=0.6, so they bought at 0.5. The student who rounded might have set B and S to 0.5 and then bought or sold, but at Q=0.5, they might have both conditions? So they might have bought and then if the ball is blue, they lost 0.5.
    - Part 3: The group had to choose between Option 1 and Option 2. If their interval included 50, they might have been unsure. They might have chosen based on which part of the interval they focused on.

  - What will go wrong:
    - In Part 1, many students might write [40,60] or [0,100] or point estimates. Some might write the entire range [20,80] if they remember the constraint. But the scoring rule might be new to them.
    - In Part 2, students might not understand how to set B and S. We need clear instructions.
    - In Part 2, if they set B=S=0.5, then they are forced to buy, and then they might lose if the ball is not red. They might complain that they are forced to transact when they are indifferent.
    - In Part 3, the group might quickly choose Option 2 (safe 50) if they are risk averse, or might gamble on Option 1.

  - What the activity can't deliver:
    - The activity doesn't tell them what they should do normatively. For example, in Part 2, should they set B and S to their sharp credence? Or should they set an interval? We will have to explain in the debrief the concepts of imprecise probability and how it differs from second-order uncertainty.

  ### Materials and Timing

  - Total time: 75 minutes.
  - Part 1: 15 minutes (explain scoring, they write, collect, reveal p, compute scores).
  - Part 2: 20 minutes (explain the ticket and prices, they write B and S, reveal Q, determine actions, draw a ball, resolve).
  - Part 3: 15 minutes (explain options, group discussion and vote, reveal p and compute).
  - Debrief: 25 minutes.

  If we skip Part 4, we have time.

