  Alternative for Part 4: show that with intervals, dominance reasoning can be harder. For example, if you have two options:

  - Option A: pays 1 if p>40, 0 otherwise.
  - Option B: pays 1 if p>30, 0 otherwise.

  Then B dominates A? Because if p>40, both pay 1. If p in (30,40], B pays 1 and A pays 0. If p<=30, both pay 0. So B is at least as good and sometimes better. But if your interval for p is [25,35], then you might think A is better for p>40? But your interval doesn't include p>40, so you should prefer B? But if you only know p in [25,35], then you know p<=35<40, so A always pays 0. And B pays 1 if p>30. So you should prefer B.

  But if you represent uncertainty by an interval and you use maxmin (which is common), then for A: the worst case is 0 (if p<=40), for B: the worst case is 0 (if p<=30). But the best case for A is 0 (since p<=35<40), and for B is 1 (if p>30). So clearly B is better.

  But we can make it more nuanced.

  We can have two options that are not comparable by dominance:

  - Option A: pays 1 if p>50, 0 otherwise.
  - Option B: pays 0.6 for sure.

  Then if your interval is [40,60], then:
  - For A: the minimum payoff is 0 (if p<=50), maximum is 1 (if p>50).
  - For B: sure 0.6.

  So if you use maxmin, you choose B. If you use maxmax, you choose A. So they might disagree.

  We can have the group vote on which option to take, and then see that even though they have the same interval, they might choose differently.

  But that doesn't require new evidence.

