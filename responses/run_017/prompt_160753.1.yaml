  Okay, the user is on a clinical ethics committee for an NHS trust and needs to draft a short written opinion on two ICU surge protocol versions by Thursday. Both versions result in the same patients dying in the same order, but the process differs. 

  Version A requires consultants to actively authorize withdrawal every 48 hours, while Version B automatically withdraws unless a consultant actively overrides it. The audit data shows overrides are rare (only 1 in 12 patients), and half of those are just 24-hour extensions. 

  The committee is split: one side sees no ethical difference since outcomes are identical, calling it "paperwork running the other way." The other side argues Version B is a "machine that kills on a timer," stressing the moral distinction between actively causing death versus allowing it. 

  Hmm. The user wants a recommendation (A, B, or B with conditions) in under 500 words, with the bottom line upfront. They specifically asked to engage the losing side's strongest argument—likely the "doing/allowing distinction"—and to dismiss it if it can't bear the weight. 

  First, I need to unpack that distinction. Philosophers like Philippa Foot and Judith Jarvis Thomson have debated this for decades, but in clinical ethics, the law and guidelines (like GMC's) treat withholding and withdrawing treatment as morally equivalent. Still, the *feeling* of difference persists—pulling a ventilator plug *feels* more active than not starting it. 

  But here's the rub: Version B isn't truly automatic. It has a built-in override requiring human judgment, just like Version A's authorization. Both involve consultant decisions; they're just framed differently. The audit data suggests consultants rarely intervene in either scenario—so the "machine" critique feels overstated. 

  The stronger concern is psychological: automatic withdrawal might desensitize teams or create moral distress. That's worth addressing. But pragmatically, during a surge, Version B reduces cognitive load when seconds count. The rarity of overrides implies consultants already agree with the tool's thresholds most of the time. 

  So—Version B with conditions. Recommend it, but add mandatory twice-daily consultant reviews (to preserve human oversight) and an explicit ethics debrief clause. This answers the "machine" fear while accepting that the doing/allowing distinction collapses here. The real issue isn’t causation—it’s ensuring robust decision-making under pressure. 

  Bottom line: outcomes are identical, so optimize for operational safety. But cushion the psychological impact with structured reviews. 

