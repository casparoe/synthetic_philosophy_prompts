   3. Calibration within groups:

      In the released cells, we have:
          Group A:
              s=1: P(Y=1)=10/100=0.1
              s=2: P(Y=1)=40/200=0.2
          Group B:
              s=1: P(Y=1)=40/200=0.2
              s=2: P(Y=1)=30/100=0.3

      So in the released cells, the score is not calibrated because at s=1, group A has 0.1 and group B has 0.2.

      This is significant because calibration is refuted by the observed data in the released cells. In the detained cells, we are free to set the probabilities, but calibration overall might not hold.

      In Completion 1 for group A in s=3: 0.2, s=4:0.2; for group B: s=3:0.3, s=4:0.3.
          Then at s=3: A has 0.2, B has 0.3 -> not calibrated.
          s=4: similarly not calibrated.

      In Completion 2: 
          A: s=3:0.6, s=4:0.6
          B: s=3:0.4, s=4:0.4
          then not calibrated.

      So in neither completion is the score calibrated within groups.

   4. Completion-robust criteria:

      - Detention rate: it is fixed by the observed data. In this example, both groups have detention rate 100/400=0.25. 
        So any criterion that depends only on the detention rate ( like demographic parity ) is completion-robust.

      - Criteria that depend only on the decisions ( like demographic parity or error rates that condition on the decision) might be identified. 
        But note: the false positive rate and false negative rate condition on the true outcome Y*, which is not fully observed.

      - The observed error rates in the released cells are identified, but they are not the usual FPR and FNR.

      - The accuracy (overall misclassification rate) is not identified because we don't know the true outcomes in the detained cells.

   5. The impossibility results are about the full distribution. In this setting, the full distribution is not identified. 
      Therefore, the theorem does not constrain the policy in the same way, because the policy only determines the observed data. 
      The choice between error disparities might be made by the completion, and we have to choose a completion. 

      What should guide the choice? 
        - We might use worst-case reasoning, but that could be very conservative.
        - Randomized release of a small audit sample can restore identification by giving us some data on the detained. 
          This is costly in terms of releasing potentially dangerous defendants, but it might be necessary for fairness.

   6. If the detention rates are equal, does the underdetermination survive? 
      In our example, the detention rates were equal (0.25), and we still had underdetermination of the error rates. 
      Therefore, equal detention rates do not suffice to pin down the error rate disparities.

      What feature then might help? 
        If the groups have the same distribution of scores and the same observed outcome probabilities in the released cells, 
        then the completions would be constrained to be the same by the monotonicity and the group symmetry. 
        But if the groups have different distributions, then underdetermination may remain.

      In our example, the groups had different score distributions (group A had more at s=2, group B had more at s=1) and different observed outcome rates at s=2.

      An observable quantity that might help is the distribution of the score in the whole population and in the released cells. 
      But without more information, the detained cells' outcomes are free.

