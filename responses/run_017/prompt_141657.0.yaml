  ### Concrete Numerical Example

  #### 1. Setting and Observed Data
  - **Score levels**: 4 ordered levels (1: lowest risk, 4: highest risk)  
  - **Threshold**: Detain if score ≥ 3 (i.e., levels 3 and 4 detained)  
  - **Groups**: A and B, each with 400 defendants  
  - **Observed data** (Y observed only for released defendants, i.e., scores 1–2):  

  | Group | Score | Released | Y=1 | Y=0 | Total (Marginal) |
  |-------|-------|----------|-----|-----|------------------|
  | A     | 1     | Yes      | 10  | 90  | 100              |
  | A     | 2     | Yes      | 40  | 160 | 200              |
  | A     | 3     | No       | ?   | ?   | 50               |
  | A     | 4     | No       | ?   | ?   | 50               |
  | **Total A** |       |          |     |     | **400**          |
  | B     | 1     | Yes      | 40  | 160 | 200              |
  | B     | 2     | Yes      | 30  | 70  | 100              |
  | B     | 3     | No       | ?   | ?   | 50               |
  | B     | 4     | No       | ?   | ?   | 50               |
  | **Total B** |       |          |     |     | **400**          |

  **Detention rates**:  
  - Group A: (50 + 50)/400 = 0.25  
  - Group B: (50 + 50)/400 = 0.25  

  **Observed outcomes**:  
  - Group A, score 1: P(Y=1) = 10/100 = 0.10  
  - Group A, score 2: P(Y=1) = 40/200 = 0.20  
  - Group B, score 1: P(Y=1) = 40/200 = 0.20  
  - Group B, score 2: P(Y=1) = 30/100 = 0.30  

  Monotonicity holds in released cells (probabilities non-decreasing: 0.10 ≤ 0.20 for A; 0.20 ≤ 0.30 for B).  

  ---

  #### 2. Two Observationally Equivalent Completions
  We assign P(Y*=1 | s, g) to detained cells (s=3,4) for both groups, respecting monotonicity (within each group, P(Y*=1 | s) non-decreasing).  

  **Completion 1 (Minimal risk in detention)**:  
  - Group A: P(Y*=1 | s=3, A) = 0.20, P(Y*=1 | s=4, A) = 0.20  
    - s=3: 50 × 0.20 = 10 Y*=1, 40 Y*=0  
    - s=4: 50 × 0.20 = 10 Y*=1, 40 Y*=0  
  - Group B: P(Y*=1 | s=3, B) = 0.30, P(Y*=1 | s=4, B) = 0.30  
    - s=3: 50 × 0.30 = 15 Y*=1, 35 Y*=0  
    - s=4: 50 × 0.30 = 15 Y*=1, 35 Y*=0  

  **Results for Completion 1**:  
  - **Base rates**:  
    - A: P(Y*=1) = (10 + 40 + 10 + 10)/400 = 70/400 = 0.175  
    - B: P(Y*=1) = (40 + 30 + 15 + 15)/400 = 100/400 = 0.250  
  - **False-negative rates (FNR)**:  
    - A: FNR_A = P(released | Y*=1) = (10 + 40)/70 ≈ 0.714  
    - B: FNR_B = (40 + 30)/100 = 0.700  
  - **False-positive rates (FPR)**:  
    - A: FPR_A = P(detained | Y*=0) = (40 + 40)/(400 - 70) = 80/330 ≈ 0.242  
    - B: FPR_B = (35 + 35)/(400 - 100) = 70/300 ≈ 0.233  
  - **Disparities**:  
    - FNR_A > FNR_B (0.714 > 0.700)  
    - FPR_A > FPR_B (0.242 > 0.233)  

  **Completion 2 (Maximal risk in detention)**:  
  - Group A: P(Y*=1 | s=3, A) = 0.60, P(Y*=1 | s=4, A) = 0.60  
    - s=3: 50 × 0.60 = 30 Y*=1, 20 Y*=0  
    - s=4: 50 × 0.60 = 30 Y*=1, 20 Y*=0  
  - Group B: P(Y*=1 | s=3, B) = 0.40, P(Y*=1 | s=4, B) = 0.40  
    - s=3: 50 × 0.40 = 20 Y*=1, 30 Y*=0  
    - s=4: 50 × 0.40 = 20 Y*=1, 30 Y*=0  

  **Results for Completion 2**:  
  - **Base rates**:  
    - A: P(Y*=1) = (10 + 40 + 30 + 30)/400 = 110/400 = 0.275  
    - B: P(Y*=1) = (40 + 30 + 20 + 20)/400 = 110/400 = 0.275  
  - **False-negative rates (FNR)**:  
    - A: FNR_A = (10 + 40)/110 ≈ 0.455  
    - B: FNR_B = (40 + 30)/110 ≈ 0.636  
  - **False-positive rates (FPR)**:  
    - A: FPR_A = (20 + 20)/(400 - 110) = 40/290 ≈ 0.138  
    - B: FPR_B = (30 + 30)/(400 - 110) = 60/290 ≈ 0.207  
  - **Disparities**:  
    - FNR_A < FNR_B (0.455 < 0.636)  
    - FPR_A < FPR_B (0.138 < 0.207)  

  **Verification**:  
  - **Observational equivalence**: Both completions reproduce the observed data (marginal score counts and released outcomes) exactly.  
  - **Monotonicity**: Satisfied:  
    - Completion 1: A: 0.20 ≤ 0.20; B: 0.30 ≤ 0.30.  
    - Completion 2: A: 0.60 ≤ 0.60; B: 0.40 ≤ 0.40.  

  ---

  #### 3. Calibration Within Groups
  - **Observed cells (s=1,2)**:  
    - At s=1: A has P(Y=1)=0.10, B has P(Y=1)=0.20 → **not calibrated**.  
    - At s=2: A has P(Y=1)=0.20, B has P(Y=1)=0.30 → **not calibrated**.  
  - **Full score (including detained cells)**:  
    - Under both completions, calibration fails (e.g., at s=3, groups have different P(Y*=1) in both completions).  
  - **Significance**: Calibration is **refuted** in observed cells, meaning fairness violations are detectable without completions. However, it is **never verifiable** for the full score due to missing data in detention. This asymmetry shows that calibration can be rejected based on observed data, but *satisfying* it requires untestable assumptions about detained outcomes.

  ---

  ### Conceptual Comments

  #### 4. Completion-Robust Criteria
  - **Robust criteria** (independent of completions):  
    - **Detention rate**: Fixed by observed marginal score distribution.  
    - **Outcomes in released cells**: Observed FNR/FPR *conditioned on release* are identified but are not standard error rates (which condition on Y*).  
    - **Predictive values for released defendants**: Negative Predictive Value (NPV) is identified (uses observed Y in released).  
  - **Non-robust criteria**:  
    - Base rates, FNR, FPR, PPV, and calibration require Y* in detention and are **not identified**.  
  - **Decision-only criteria**: Demographic parity (detention rates) is robust because it quantifies over decisions, not outcomes. This avoids underidentification.  
  - **Accuracy**: Overall accuracy (1 - error rate) is **not identified** due to missing Y* in detention. The fairness-accuracy trade-off is ambiguous here.

  #### 5. Bearing of Impossibility Results
  - **Theorem vs. Policy**: Impossibility results (e.g., "calibration and equal FNR/FPR cannot coexist") constrain the *full joint distribution* of (score, Y*, group). However, this distribution is **unobserved** here due to selective labels. Thus, the theorem does not directly constrain policy—it only says that *if* the unobserved distribution violates base-rate equality, error disparities *exist* in some form.  
  - **Guidance for choice**:  
    - **Worst-case reasoning**: May lead to overly conservative policies (e.g., assuming high risk in detention).  
    - **Audit sampling**: Randomly release a subset of detained defendants to observe Y*. This restores identification but risks public safety. Cost: Trade-off between fairness assurance and potential harm from releases.  
    - **Domain knowledge**: Use external information to bound completions (e.g., recidivism studies).  
  - **Key insight**: The choice of completion is a *policy decision* with ethical implications, not just a statistical one.

  #### 6. Underdetermination with Equal Detention Rates
  - **Persistence**: In the example, detention rates are equal (both 0.25), yet error disparities reverse under completions. Thus, **equal detention rates do not resolve underdetermination**.  
  - **Observable quantity that pins down disparities**: The **group-specific score distribution and observed outcomes in released cells** determine possible reversal. In this example, the reversal arises because:  
    - Group A has more high-risk released defendants (s=2: 40 Y*=1 vs. B’s 30 Y*=1).  
    - Group B has more low-risk released defendants (s=1: 40 Y*=1 vs. A’s 10 Y*=1).  
    When completions "shift" where true positives/negatives are concentrated in detention, disparities flip.  
  - **Why observables matter**: The *interaction* between observed outcomes and marginal score distributions determines how unobserved Y* in detention propagates to error rates. Equal detention rates alone are insufficient; the **joint distribution of scores and observed outcomes** is decisive.  

  ### Summary
  This example isolates how **selective labels decouple observed data from unobserved potential outcomes**, making standard fairness criteria (FNR, FPR, calibration) **underidentified**. The impossibility results still apply to the unobserved full distribution, but they do not dictate policy choices. Instead, policymakers must confront ambiguity in error disparities, prioritize completion-robust metrics (e.g., detention rates), or invest in audit sampling. Equal detention rates do not suffice; the observed score-outcome distribution in released cells governs whether disparities can reverse. This underscores that algorithmic fairness in selective settings requires explicit assumptions about missing data or active measurement via auditing.
