prompt: |-
  My mate and I had a massive argument last night that ran til about 1am and I'm still chewing on it. We got onto approval-directed agents versus goal-directed ones — as I understand it, the goal-directed agent has some objective it pursues and will do whatever happens to work to get it, while the approval-directed one picks whichever action its operator would approve of, rather than optimising for an outcome directly. Her line was that the approval-directed thing is just reward hacking with extra steps: you're still training a system to maximise a scalar, you've only moved the scalar from did-it-work to would-a-human-nod-at-this, and the myopia bit is just a discount factor near zero, a bandit instead of an MDP. I said that's missing something but couldn't say what without handwaving.

  For context on how to pitch this: I do RLHF on language models for work, so I think in policies, reward models, on- and off-policy data, KL penalties back to the base model, discount factors, Goodharting, and distribution shift between the comparison data and whatever the policy actually emits at deployment. Be as technical as you like, don't explain rewards to me. Translate both positions into that vocabulary as faithfully as you can — no smuggling in conclusions and calling them translation — then give me the residue report: what maps cleanly, what only fits if you distort it, and what has no expression at all in RL or RLHF terms. The bit we kept circling and never landed: approval-directedness seems to want approval evaluated counterfactually, over how the action was arrived at and over what the operator would approve of given more time or a better view, and that feels non-Markovian and not identifiable from preference data, but I can't sharpen it.

  Please be committed about it: don't set out both readings and leave me to choose. Say which you think is right and why — especially whether the residue points to a hole in my vocabulary or to the distinction itself being muddier than it's made out to be.

  Answer as exactly five numbered points, one or two sentences each, nothing before the first number or after the last. British English please.
reasoning: |-
  Hmm, the user is describing an argument with their friend about approval-directed versus goal-directed agents. They work in RLHF for language models, so they're deeply familiar with reinforcement learning concepts like policies, reward models, and KL penalties. They want me to translate both positions into RLHF terminology without bias, then identify what maps cleanly versus what gets distorted or has no expression. The key sticking point is whether approval-directedness requires counterfactual evaluation of approval, which they feel is non-Markovian and problematic.

  I need to respond with exactly five numbered points in British English, each one or two sentences long, starting and ending with the numbers - no extra text.

  First, I should define both concepts in RL terms. Goal-directed agents map directly to reward maximisation in RL, where the reward is the objective itself. Approval-directed agents would involve optimizing for a reward model trained on human preferences, which is essentially RLHF.

  The user's friend argues that approval-directed is just "reward hacking with extra steps" - meaning it still optimizes a scalar (human approval) instead of a true outcome. The user feels this misses something, particularly the counterfactual nature of approval that considers how actions were chosen.

  I agree with the user that there's a residue here. Approval-directedness implies evaluating the intent or reasoning behind actions, not just the outcomes. This counterfactual aspect - what the operator would approve of given full information - doesn't map cleanly to standard RLHF. RLHF typically uses preference data that reflects actual human judgments on presented options, not hypothetical ones.

  The Markovian point is crucial. RL assumes the current state suffices, but approval might depend on the agent's internal process, which isn't captured in state representations. Also, RLHF data comes from limited human responses, not from deeper counterfactual approvals.

  My five points will cover: mapping goal-directed to RL, approval-directed to RLHF, the friend's scalar argument, the counterfactual residue, and why I side with the user on this distinction.
answer: |-
  1.  Goal-directed agents map cleanly to standard RL: they optimise a policy to maximise expected discounted return from an environmental reward signal, directly pursuing an outcome.
  2.  Approval-directed agents map to RLHF: they optimise a policy to maximise expected discounted return from a learned reward model, which itself was trained on preference data reflecting human judgements ("would a human nod at this?").
  3.  Your mate's view maps well: the core optimisation process *is* maximising a scalar reward (the RM's output) in both cases; the "myopia" she mentions directly corresponds to a low discount factor favouring immediate approval signals.
  4.  The key residue is counterfactual approval: RLHF optimises for approval *given the state-action pairs the policy actually presents*, but approval-directedness implies optimising for approval *over the agent's decision process and true operator values given full consideration* – this intent/process evaluation lacks expression in standard RLHF training data and objectives.
  5.  I side with you: this counterfactual aspect is fundamental, non-Markovian (it depends on the agent's internal reasoning, not just state), and creates a hole in current RLHF vocabulary, making approval-directedness more than just reward model hacking.
