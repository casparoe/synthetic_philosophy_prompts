      - Judge 1: P and B -> L (so votes P, B, L)
      - Judge 2: P, not B -> not L (votes P, not B, not L)
      - Judge 3: not P, B -> not L (votes not P, B, not L)
      - Then: P gets 2 votes (majority), B gets 2 votes (majority), L gets only 1 vote (minority). So the collective decision by premises: P and B, so L. But by conclusion: not L by majority.

  In distributed systems terms:
  - Think of each premise (P, B) as a key in a distributed key-value store (or as separate proposals in a log). 
  - The conclusion L is computed by a deterministic apply function: `L = P and B`.
  - The system can either:
    - **Replicate inputs (premises)**: Each premise is decided by its own quorum. Then the conclusion is derived by applying the function to the decided premises.
    - **Replicate the output (conclusion)**: Each node votes on the entire conclusion (L) and we run a quorum on L.

  In the example, if we replicate inputs:
    - We get P=true (by majority) and B=true (by majority). Then we compute L=true.
  But if we replicate the output, we get L=false (by majority: 2 out of 3 voted against L).

  This is the paradox: the two methods yield different results.

  ### Step 2: Three Escape Routes and Their Costs

  In social choice, the three ways to avoid the paradox:

  1. **Premise-based procedure (replicate inputs)**:
     - Decide each premise by a quorum and then derive the conclusion.
     - Cost: The conclusion might not reflect the majority view on the conclusion itself. In the example, we get L=true even though a majority voted against L in the output vote.

  2. **Conclusion-based procedure (replicate output)**:
     - Decide the conclusion by a quorum and ignore the premises.
     - Cost: We lose the connection to the premises. The decision on the conclusion might be inconsistent with the premises (if we were to look at them). Also, we don't record the reasons (premises) so we can't use them for other purposes.

  3. **Set a higher threshold for each premise (supermajority per proposition)**:
     - Instead of simple majority, require a supermajority for each premise. This might avoid the situation where a bare majority on premises forces a conclusion that lacks majority support. But note: it doesn't guarantee that the conclusion will have majority support. Also, it might lead to more indecision (no outcome when there isn't a supermajority).

