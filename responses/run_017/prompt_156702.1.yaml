  ### Step 3: Impossibility Results

  In social choice (for judgment aggregation), there is an impossibility result analogous to Arrow's theorem: 
  - It is impossible to have an aggregation rule that satisfies:
    - **Universal Domain**: Any profile of individual judgments is allowed.
    - **Collective Rationality**: The collective judgment is consistent (and complete?).
