  So the system must handle partial decisions. This is similar to the cost of the supermajority approach (more indecision). 

  Also, note: the conclusion L is still a function of the premises. We haven't changed that.

  Is this a fourth escape route? 
  - It is a variant of the premise-based approach with non-uniform decision thresholds. It dodges the impossibility because we are breaking neutrality (and possibly systematicity, since the decision rule for each proposition is different). 

  The cost: 
  - We might have more failures to decide (if one proposition has a high quorum requirement and cannot be met).
  - We have to choose the quorums appropriately, which requires domain knowledge and might be error-prone.

