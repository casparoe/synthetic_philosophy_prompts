  In social choice terms, this is about agenda control and changing the aggregation rule itself. The standard framework assumes a fixed set of propositions and a fixed rule. 

  What happens in distributed systems? 
  - When you change the apply function, you must do it in a way that maintains consistency. Typically, you would include the version of the apply function in the log (so that when replaying, you use the version that was active at the time of the log entry). 
  - But note: the set of premises (the "small questions") might change with the version. This is agenda power: the migration writer decides what the premises are and how they map to the conclusion.

  The social choice literature doesn't typically handle this dynamic change. The cost: 
  - If you change the apply function during a deployment, you might have two different apply functions operating on the same set of inputs, leading to different outputs. This must be handled by the system (e.g., by ensuring that the apply function change is coordinated with the input log).

  **Second wrinkle: Asymmetric per-proposition quorums (skewed-quorum aggregation)**

  The user considers having different quorum requirements for different premises (e.g., higher quorum for P than for B).

  In social choice, this breaks the neutrality condition (because propositions are treated differently). 

  Does it dodge the impossibility? 
  - Yes, because by relaxing neutrality, we avoid the impossibility. But what does it cost?
    - We have to set the quorums appropriately. This might be domain-specific (as the user says: false positive on P is worse than false negative on B).
