    - **Neutrality**: Equal treatment of propositions.
    - **Systematicity**: The decision on each proposition depends only on the votes on that proposition (like independence of irrelevant alternatives).

  The only way to avoid this is to have a "dictator" (or a designated leader) whose individual judgment becomes the collective judgment.

  In distributed systems, the designated leader is the normal engineering solution: we have a leader that proposes the value, and if we use a consensus protocol, we get agreement on that proposal. But note: in the leader-based approach, we are effectively using the leader's apply function and the leader's judgment on the premises (if we are doing input replication) or on the conclusion (if we are doing output replication). 

