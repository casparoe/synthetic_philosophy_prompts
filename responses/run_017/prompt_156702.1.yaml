  b) **Fixed vs. contested apply function**: In the doctrinal paradox, the inference from premises to conclusion (the rule) is part of the debate. In distributed systems, the apply function is fixed and known to all, so there is no disagreement about the rule. This is a key difference.

  Thus, the residue:
  - The requirement for responsiveness to reasons (each node's individual judgment on the premises) is not present in distributed systems. We are only concerned with agreement and correctness of the state machine.
  - The fixed apply function in distributed systems avoids the problem of contested rules. But note: the user has a wrinkle where the apply function is versioned and rolled out. This introduces a new dimension.

