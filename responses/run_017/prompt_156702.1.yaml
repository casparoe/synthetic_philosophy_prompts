  Let's break it down step by step.

  ### Step 1: The Doctrinal Paradox in Distributed Systems Terms

  In the doctrinal paradox (contract case):
  - Three propositions: 
    - P: Promise was made.
    - B: Breach occurred.
    - L: Liable (conclusion: L iff P and B).
  - Voting pattern: 
    - Majority for P (say, 2 out of 3).
    - Majority for B (2 out of 3).
