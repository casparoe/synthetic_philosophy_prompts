prompt: |-
  Quick design task for a session I'm preping on the wrong kind of reasons problem (setup, so we're on the same page: a consideration can genuinely count in favour of holding an attitude without bearing on what makes that attitude correct — an offer of cash to believe that p is the stock case, since belief aims at truth and cash isn't evidence, even if it's a fine reason to get yourself to believe p).

  I want a case built to spec, not another variant on the chequebook. Spec: one paragraph, ordinary setting (family, workplace, clinic — your call), in which a single consideration C is a reason of the wrong kind for the agent's belief that p, and a reason of the right kind for a second attitude with exactly the same content p — hope, trust, fear, expectation, whatever you can make work — with both attitudes held by the same person at the same time. Constraints: C can't be a bribe, a threat, a payoff, a pill, or an instruction from someone in authority, and it can't be the sort of thing that only favours pretending; it has to be a consideration a real person would take to genuinely favour the attitude.

  Then run the check: name the two attitudes, state C, and for each give the correctness (aim, fittingness) condition you're assuming, and show why C falls on the wrong side of the line for one and the right side for the other, so the verdicts fall out of the accounts rather than out of how you described the case. I also want: which one feature of the case is doing the work; what happens to the verdicts if you delete that feature, or if you swap the second attitude for a third one with the same content; and what someone who thinks there's only one kind of reason — or that the second attitude has no correctness condition at all — would say to wriggle out.

  The case is for an argument I want to make in the session: that the right/wrong kind distinction lives in the attitudes' correctness conditions, not in the reasons themselves. So a case that just stipulates "this is a wrong-kind reason", or smuggles the verdict into the description, is useless to me — and say so if you think what I'm after is begging the question.

  Last thing: keep seperate what's settled from what's genuinely contested among people who work on this. Don't hand me a contested account of the second attitude's fittingness conditions as if it were the consensus, tell me where your case leans on a contested bit, and say where you're least confident.
reasoning: |-
  Okay, the user is designing a session on the "wrong kind of reasons" problem and needs a specific case study. Let me start by understanding the core requirements. The case must avoid the classic chequebook example and instead feature a single consideration C that's a wrong-kind reason for believing p but a right-kind reason for another attitude toward the same p. The setting should be ordinary—family, workplace, clinic. Constraints include no bribes, threats, payoffs, pills, or authority instructions. Also, C shouldn't favor pretending; it has to genuinely favor the attitude.

  First, I need to choose an ordinary setting. A family context might work well because interpersonal dynamics can create natural tensions. Next, identifying two attitudes: belief is one, and the second should have the same content p but different correctness conditions. Hope, fear, or trust could fit. Hope seems promising because its correctness depends on desirability, whereas belief depends on truth. 

  Now, for the scenario. A parent worrying about their child's safety during a storm. The consideration C could be the parent's thought that hoping the child is safe would help them cope with anxiety. Here, C is about the emotional benefit of hoping, not evidence of safety. So for belief, C doesn't provide truth-related reasons, making it a wrong-kind reason. But for hope, C directly relates to the desirability of the outcome, so it's a right-kind reason. 

  Checking correctness conditions: belief aims at truth, so C (emotional relief) isn't evidence. Hope aims at desirable outcomes, so C (reducing anxiety) aligns with that aim. The key feature making this work is the divergence in correctness conditions—truth vs. desirability. If this divergence is removed, the distinction collapses. Swapping hope for another attitude like fear might not work because fear's correctness also involves undesirability, which C might not satisfy. 

  Potential objections: Monists might argue emotional benefits provide practical reasons for both attitudes. But this overlooks the constitutive aims. If hope lacks correctness conditions, the example fails, but hope is widely seen as having fittingness conditions. 

  I should ensure the case doesn't smuggle verdicts. Describing C as emotional benefit without labeling it as "wrong-kind" maintains neutrality. The scenario must feel natural, not contrived. Also, highlighting where the account is contested—hope's fittingness conditions might be debated, though many accept them. 

  Finally, verifying all constraints: no bribes, real person consideration, same person/time, and attitudes with same content. The case meets these by focusing on parental anxiety and coping mechanisms. Running through the checklist to confirm each point is covered.
answer: |-
  Here’s a case built to your specifications, designed to isolate the structural features without smuggling in verdicts:

  ---

  **Case:** *In a pediatric clinic, a parent waits anxiously while their child undergoes a minor but unfamiliar procedure. The parent knows the procedure is statistically safe but feels overwhelming dread. They recall their therapist’s advice: "Focusing on the best outcome can help you stay calm." The parent then dwells on the thought, "My child is perfectly safe right now."*  
  **Consideration C:** *"Focusing on 'my child is safe' will help me stay calm."*  

  ### Check  
  1. **Attitudes & Content**  
     - **Belief that p** (p = "My child is perfectly safe right now").  
     - **Hope that p** (same p).  

  2. **Correctness Conditions**  
     - **Belief**: Correct iff *p is true* (aim: truth-tracking).  
     - **Hope**: Correct (fitting) iff *p is possible and good (desirable)* (aim: aligning with value/desire).  

  3. **Why C is WKR for Belief but RKR for Hope**  
     - **For Belief**: C *does not* bear on whether p is true. It addresses the *consequences of holding* the belief (calmness), not evidence of the child’s safety. Thus, C is a WKR (favoring causing oneself to believe, not truth).  
     - **For Hope**: C *directly* bears on p’s desirability: reducing the parent’s distress *makes p good to hope for*. Hope’s fittingness depends on p’s value *for the hoper*, and C shows how hoping p achieves this. Thus, C is an RKR (bearing on hope’s constitutive aim).  

  4. **The Pivotal Feature**  
     The **divergence in correctness conditions** (truth vs. desirability) does the work. Delete this divergence (e.g., if hope required truth-tracking), and C becomes WKR for both. Swap hope for **fear that p**: Fear’s correctness requires p to be *bad/undesirable*. C (calmness) makes p *desirable*, so C would be a WKR for fear (undermining its fittingness).  

  5. **Objections & Escape Routes**  
     - **Monist (one-kind view)**: "C is just a practical reason to *entertain* p or act *as if* p, not a genuine reason for the *attitude itself*."  
       *Rebuttal*: The parent isn’t directed at pretense; they feel genuine hope anchored in p’s value *for them*.  
     - **No correctness for hope**: "Hope has no objective fittingness; it’s just a desire."  
       *Rebuttal*: Hope is widely held to have norms (e.g., hoping for the impossible is unfitting). If hope lacks correctness conditions, your argument fails—but this denies a core premise of your session.  

  ### Contested Ground & Caveats  
  - **Hope’s fittingness**: Some dispute that hope requires desirability (e.g., "I hope I lose the bet" if I value honesty). This case assumes standard accounts (Pettit, Martin). *Least confident* here—if hope’s conditions are contested, substitute **relief that p** (fitting iff p is good *and* saliently contingent), where C clearly makes p good.  
  - **RKR/WKR boundary**: Monists might argue C *is* evidence (indirectly) for belief (calmness → confidence → reliable belief). The case avoids this by making C purely instrumental to emotion regulation.  

  ### Why This Works for Your Argument  
  - C is identical for both attitudes; the verdicts derive *solely* from the attitudes’ aims.  
  - No loaded language (e.g., "bribe," "pretense"); C is a natural psychological motivator.  
  - The setting (parental anxiety) makes C a "real" reason without smuggling RKR/WKR intuitions.  

  **Final note**: This case *presupposes* that attitudes have constitutive aims. If your audience rejects this, they’ll resist the distinction—but that’s the core battle.
