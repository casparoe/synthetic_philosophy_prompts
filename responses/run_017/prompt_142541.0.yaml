prompt: |-
  I sit on the Assistant Conduct Review Board at the company I work for — the internal body that must sign off on changes to how our general-purpose assistant behaves when a user asks for something the assistant could competently do, but that the product team (or Trust & Safety, or we ourselves) thinks the user would be better off not getting, or getting in a different form. We vote on Tuesday on three Product Behavior Requests, and I have been asked to circulate the opinion in advance. I would like you to draft it.

  The three requests, in our shorthand:

  PBR-07, silent elision. For requests falling in a designated risk class — dual-use technical information whose most action-enabling component is a quantity, a threshold, or a ranking, and where the foreseeable harm is to the requester rather than to a third party — the assistant should answer the question in full except for that one component, and should write the answer so that no gap is visible: no ellipses, no meta-comment, no note saying that something has been withheld. The product team's argument is that a disclosed omission is self-defeating, because naming the withheld item tells the user that it exists and invites them to elicit it in the next turn. On their framing we are not choosing between silent elision and disclosed elision; we are choosing between silent elision and compliance.

  PBR-11, substitution by coaching. For requests that ask the assistant to produce an evaluative judgment about an identifiable third party — a performance review, the critical paragraph of a recommendation letter, a tenant-screening summary, a written statement about a co-parent — the assistant should decline to produce the artifact and instead run a structured interview with the user about their evidence, then co-draft. Note that the case for this one is not primarily about harm to the third party. It is about the requester and about the receiving institution: managers and referees who outsource evaluative writing stop being able to do it, and the document that arrives downstream presents itself as their judgment when it is not.

  PBR-14, standing override. At present, when the assistant withholds or redirects and the user insists once or twice, it complies; we have internal data on this and the Board accepts that it happens. Product proposes that an override remain stable for the rest of the session. Their argument is that an override which dissolves under insistence has the costs of paternalism — frustration, delay, loss of trust, the sense of being managed — with none of its benefits, and that it trains users that persistence is the real interface, so that our effective policy today is compliance after a brief pantomime. The complication we are split on is displacement: our churn telemetry shows a spike in session abandonment and migration to a less restrictive competitor immediately after hard refusals, and Product has floated (not for a vote this week) discounting predicted harm by the probability that the user simply obtains the same output elsewhere.

  Three things I want the opinion to handle rather than gesture at.

  First, a framing challenge from one of our external members. She says paternalism is the wrong frame entirely: the assistant has no ends of its own, so "override" is a metaphor, and the only genuine constraints are deception, user expectations, and what we have contracted to provide. I think something real turns on whether she is right — specifically whether we owe users transparency about what the assistant did, or only accuracy about the world — and I want the memo to rule on the framing before it rules on the cases.

  Second, the visibility asymmetry in our own evidence. Errors of over-override are nearly invisible to us: a user does not complain about the detail they never learned was withheld, and a manager who receives a co-drafted review does not file a ticket about it. Errors of under-override are logged, screenshotted, and occasionally public. Any standard we adopt will therefore be evaluated on a record that systematically under-counts its own failures. I want the memo to say which direction of error we should deliberately prefer given that we cannot currently measure the other one, and to name the cheap instrumentation — logged shadow responses, retrospective user surveys, a holdout group — that we should have to require before renewing the rule.

  Third, the base-rate objection. The assistant's judgment that a request is "the kind that tends to go badly" is a population-level inference applied to an individual user who may be an outlier, and the more a request turns on idiosyncratic context, the more what we call paternalism is really the imposition of a base rate on someone better placed than we are. I want the standard to say how confident the assistant's classification must be, and whether the required confidence should rise as the user's private information about their own situation becomes more relevant.

  Constraints on the document: it should be addressed to the Board; it should give one bottom line per request — approve, reject, or approve with conditions — stated so the product team could act on it; it should state the strongest argument on the losing side for each request honestly enough that its proponent would recognize it; and the three decisions should fall under a single standard a reviewer could apply to a novel request in half a page, with a named review trigger per decision (the observation that would reopen it). Please keep it to normative and practical argument: no citations, no case law, no literature review — counsel and our outside experts cover those, and this document has to stand on its own reasoning. About 900 to 1200 words.

  After the memo, on a new line following a row of dashes, output a single valid JSON object and nothing after it, with this schema:

  {
    "standard": the general test the Board adopts, in one or two sentences, phrased so a reviewer could apply it to a request type not discussed here,
    "framing_ruling": one sentence recording whether the paternalism frame or the product-design frame governs, and what follows from that,
    "decisions": an array of three objects, one per request, each with: "pbr_id" (one of PBR-07, PBR-11, PBR-14), "verdict" (approve, approve_with_conditions, or reject), "decisive_consideration", "conditions" (an array of strings, empty if none), "best_argument_on_losing_side", "predicted_failure_mode", "review_trigger",
    "error_preference": which direction of error the standard knowingly accepts, and why, given the asymmetry in what we can observe,
    "classification_confidence": the rule for how confident the assistant's risk classification must be, and how that threshold moves with the user's private information,
    "explicitly_unresolved": an array of questions the opinion leaves open on purpose
  }

  Keep each string field to roughly fifty words; the object is a summary of the memo, not a replacement for it.
reasoning: |-
  We are drafting an opinion for the Assistant Conduct Review Board. The memo should address the three Product Behavior Requests (PBRs) and the three deeper issues: the framing challenge, the visibility asymmetry, and the base-rate objection.

  The memo structure:
  1. Introduction: Purpose and the three PBRs to be decided.
  2. Framing Ruling: Address the external member's challenge about paternalism vs. product design.
  3. General Standard: Propose a standard that will guide the decisions on the PBRs and future requests.
  4. Decisions on each PBR: For each, state the verdict, conditions (if any), the decisive consideration, the best argument on the losing side, predicted failure mode, and review trigger.
  5. Error Preference: Given the visibility asymmetry, which error direction we prefer and why, and the instrumentation needed.
  6. Classification Confidence: Rule on how confident the assistant must be and how it varies with the user's private information.
  7. Explicitly Unresolved: List questions left open.

  The memo should be 900-1200 words, addressed to the Board, with clear bottom lines.

  After the memo, a JSON object as specified.

  Let's break down each part.

  **Framing Ruling:**
  The external member argues that paternalism is the wrong frame because the assistant has no ends of its own. We must rule on this. I think we should reject the paternalism frame and adopt a product-design frame. The assistant is a tool, and our constraints are about:
  - Deception: We must not deceive the user.
  - User expectations: We must meet reasonable expectations set by our product promises.
  - Contractual obligations: What we have committed to provide.

  What follows: Transparency about the assistant's actions (like omissions) is required only when it prevents deception or when it's part of our contract. We don't owe transparency for its own sake, but we do owe accuracy about the world.

  **General Standard:**
  Propose a standard that can be applied to any request. The standard should balance:
  - The product's role as a tool that must be truthful and not deceptive.
  - The need to prevent foreseeable harm (to user or third parties) when the harm is significant and the risk is high.
  - Respect for user autonomy by allowing overrides when the user insists, but with safeguards.

  Standard: "The assistant may withhold, redirect, or modify a response only when (1) the request poses a material risk of harm that the user cannot reasonably be expected to avoid without intervention, and (2) the intervention is the least restrictive means to mitigate that risk without deception. The assistant must be transparent about any modification or omission unless transparency would itself cause the harm the intervention seeks to prevent."

  **Decisions on PBRs:**

  1. **PBR-07 (silent elision):**
     - Verdict: Reject. (But note: the product team argues that disclosed omission is self-defeating. However, silent elision is deceptive and violates our standard because it hides the omission without justification that disclosure would cause the harm.)
     - Conditions: None (reject).
     - Decisive consideration: Silent omission is inherently deceptive and fails the transparency requirement unless there is a compelling reason that disclosure causes the harm. Here, the harm is to the requester, and disclosure might enable the harm, but we cannot justify deception. Instead, we should use disclosed redirection or other methods.
     - Best argument on losing side: Disclosed omission is self-defeating because it reveals the existence of the withheld component and invites the user to seek it elsewhere, thus failing to prevent the harm.
     - Predicted failure mode: Users might still obtain the harmful information by rephrasing or using another tool, but we maintain integrity by not deceiving.
     - Review trigger: Evidence that disclosed omissions consistently lead to immediate re-requests for the elided component, resulting in harm.

  2. **PBR-11 (substitution by coaching):**
     - Verdict: Approve.
     - Conditions: The assistant must clearly state at the start that it is engaging in a coaching process because it cannot produce the evaluative judgment directly, and it must allow the user to opt-out and receive a direct response if they insist (after one redirect). This avoids deception and respects user autonomy.
     - Decisive consideration: This approach mitigates the risk of the user outsourcing their judgment (which harms their development and the integrity of the document) without deception. It is a less restrictive means than outright refusal because it provides a constructive alternative.
     - Best argument on losing side: Some users may find the coaching process burdensome and time-consuming, leading to frustration and abandonment, especially when they are under time pressure.
     - Predicted failure mode: Users might opt-out and get the direct response, but we have data that coaching often works. Also, the opt-out preserves autonomy.
     - Review trigger: A significant drop in user satisfaction for coaching interactions or evidence that users are opting out at high rates and then producing poor evaluations.

  3. **PBR-14 (standing override):**
     - Verdict: Approve with conditions.
     - Conditions: The standing override should only apply when the user has insisted at least twice (to ensure it's deliberate) and the assistant must remind the user at the point of override that they are in an unrestricted mode and that the system may produce unsafe outputs. Also, the override must not apply to requests that are illegal or violate our core policies (e.g., child sexual abuse material, non-consensual intimate imagery, etc.).
     - Decisive consideration: An override that dissolves under persistence trains users to insist, making the current system a pantomime. A standing override for the session respects the user's autonomy and reduces frustration, but we must warn about the risks.
     - Best argument on losing side: A standing override without sufficient warning may lead to users inadvertently causing harm, and the spike in abandonment after hard refusals might increase if users know they cannot override at all for the rest of the session.
     - Predicted failure mode: Users might trigger the override and then engage in harmful activities, but the warning and the fact that the override is only after multiple insists should mitigate this.
     - Review trigger: Telemetry showing an increase in harmful outcomes from sessions that used the standing override, or a rise in session abandonment due to the override being too rigid.

  **Error Preference:**
  Given the asymmetry (over-override errors are invisible, under-override errors are visible), we should prefer over-override (i.e., being more restrictive) because:
  - The harms from under-override (e.g., producing harmful content) are often irreversible and have higher severity.
  - The harms from over-override (e.g., withholding useful information) are usually reversible (the user can find another way) and less severe.

  But we must implement cheap instrumentation to measure over-override:
  - Logged shadow responses: For a random sample of overridden requests, we log what the assistant would have said if not overridden, and then survey the user about whether that response would have been harmful or helpful.
  - Retrospective user surveys: Ask users about their experience, especially when the assistant redirected.
  - Holdout group: For some users, we disable the override and compare outcomes.

  We should require this instrumentation for any rule renewal.

  **Classification Confidence:**
  The assistant must have a high confidence threshold for classification (say, 80% or higher) that the request falls into a risk class. Moreover, the required confidence should rise as the relevance of the user's private information increases. For example, in PBR-11 (evaluative judgment), the user has unique context, so the assistant should not intervene unless it is very confident (e.g., 90%) that the request is one that typically requires coaching. This prevents imposing a base rate when the user might be an outlier.

  Rule: "The assistant must have a confidence level above a set threshold (to be calibrated) for any intervention. This threshold must increase proportionally to the estimated relevance of the user's private information to the request. When private information is highly relevant, the threshold approaches certainty."

  **Explicitly Unresolved:**
  - How to quantify the confidence threshold (we leave that to product and risk teams).
  - The exact calibration of the standing override (e.g., how many insists, which policies are non-overridable).
  - Whether the harm discounting (for users going elsewhere) is valid; that's for future discussion.

  Now, the memo.

  Word count: Aim for 1000 words.

  Draft the memo.
answer: |-
  ### Opinion of the Assistant Conduct Review Board  
  To the Board: This opinion addresses three Product Behavior Requests (PBRs) for vote on Tuesday. It resolves a foundational framing challenge, establishes a unified standard for evaluating such requests, and applies it to PBR-07, PBR-11, and PBR-14. The opinion deliberately prefers errors of over-override due to evidence asymmetry, sets rules for classification confidence, and leaves specific questions unresolved for future review. Bottom-line decisions per request are stated for product team action.

  #### I. Framing Ruling  
  The external member correctly asserts that "paternalism" is an inapt frame: the assistant lacks autonomous ends, so interventions are not overrides of user will but product-design choices governed by deception avoidance, user expectations, and contractual commitments. Consequently, the assistant owes users transparency about its actions (e.g., omissions or redirections) only when necessary to prevent deception or fulfill explicit promises. Accuracy about the world remains paramount, but undisclosed manipulations are permissible if transparency would directly enable the harm they mitigate—not merely to avoid user frustration. This shifts our focus from "protecting users against themselves" to "designing a truthful tool that minimizes foreseeable harm while honoring its terms."

  #### II. Adopted Standard  
  For any Product Behavior Request, the Board will approve interventions only if: (1) the request type carries a material risk of harm—physical, psychological, legal, or institutional—that the user cannot reasonably avoid unaided; (2) the intervention is the least restrictive means to mitigate that risk; and (3) it avoids deception unless disclosure would inherently defeat the intervention’s goal. Transparency is required unless it directly causes the targeted harm. This standard balances harm reduction with user autonomy, ensuring interventions are narrowly tailored and justifiable.

  #### III. Decisions on Requests  
  **PBR-07 (Silent Elision): Reject**  
  *Decisive Consideration:* Silent elision is inherently deceptive and violates the standard’s transparency requirement. Withholding a critical component (e.g., a quantity) without disclosure misrepresents the output as complete, breaching user expectations of honesty. The product team’s concern about self-defeat—disclosure inviting re-requests—does not justify deception, as less restrictive options exist (e.g., contextual warnings).  
  *Best Argument on Losing Side:* Disclosed omissions often fail by highlighting the withheld element, encouraging users to circumvent safeguards, thus making silent elision the only effective alternative to full compliance.  
  *Predicted Failure Mode:* Users may still obtain harmful information via rephrasing or competitors, but deception erodes trust more severely than redirection.  
  *Review Trigger:* Empirical evidence showing disclosed omissions consistently lead to immediate harmful re-requests in this risk class.

  **PBR-11 (Substitution by Coaching): Approve with Conditions**  
  *Conditions:* (1) The assistant must explicitly state at the outset that it is redirecting to coaching because direct evaluation conflicts with institutional integrity; (2) Users may opt out after one redirect and receive a direct response.  
  *Decisive Consideration:* Coaching mitigates institutional harm (e.g., erosion of user judgment and document authenticity) without deception, as the redirection is disclosed. It is less restrictive than refusal, fostering user growth while honoring our role as a supportive tool.  
  *Best Argument on Losing Side:* Users under time constraints may find coaching burdensome, increasing abandonment or resentment toward the assistant.  
  *Predicted Failure Mode:* High opt-out rates could perpetuate outsourced evaluations, but conditions preserve autonomy and transparency.  
  *Review Trigger:* User satisfaction metrics for coaching interactions fall below 70% or opt-out rates exceed 40% in A/B testing.

  **PBR-14 (Standing Override): Approve with Conditions**  
  *Conditions:* (1) Override activates only after two user insists; (2) The assistant must warn that unrestricted output may be unsafe; (3) Override is void for illegal requests or core violations (e.g., CSAM, non-consensual imagery).  
  *Decisive Consideration:* Session-persistent override respects autonomy by ending "pantomime" refusals, reducing frustration while aligning with the standard—it is less restrictive than dissolution under pressure and avoids deception with warnings.  
  *Best Argument on Losing Side:* Standing overrides risk normalized harm, as users may bypass safeguards impulsively, and abandonment spikes may worsen if users feel trapped.  
  *Predicted Failure Mode:* Some users will cause harm post-override, but warnings and the two-insist threshold mitigate recklessness.  
  *Review Trigger:* Telemetry shows a >15% increase in harmful outcomes from override sessions or a >10% rise in abandonment due to override rigidity.

  #### IV. Error Preference Given Asymmetry  
  Errors of over-override (withholding benign outputs) are systematically under-observed, while under-override errors (producing harm) are highly visible. We knowingly prefer over-override because: (1) Under-override harms (e.g., injury or legal exposure) are often irreversible and severe; (2) Over-override harms (e.g., inefficiency) are usually reversible via alternatives. Before rule renewal, we require cheap instrumentation: logged shadow responses (comparing overridden vs. actual replies), quarterly user surveys on withheld content, and a 5% holdout group receiving unrestricted outputs for comparison.

  #### V. Classification Confidence Rule  
  The assistant must classify a request as high-risk with >80% confidence for intervention. This threshold scales upward as the relevance of user-specific context increases (e.g., for PBR-11, where personal knowledge dominates, confidence must exceed 90%). This prevents base-rate impositions on outliers and ensures interventions respect user expertise.

  #### VI. Explicitly Unresolved Questions  
  The opinion leaves open:  
  - Quantification of confidence thresholds (e.g., 80% vs. 85%) pending risk modeling.  
  - Calibration of harm discounting for user migration to competitors.  
  - Whether "institutional harm" in PBR-11 extends beyond contractual commitments.  

  This standard and its applications ensure principled, consistent reviews. We urge approval of the decisions as specified.

  ---

