prompt: |-
  I sit on the committee revising our jurisdiction's model statute on advance health-care directives, and the remit has quietly grown. We are being asked to say whether the statute should recognize two instruments that no existing framework was drafted for, and we have discovered that we cannot even say what we would need from an account of the matter in order to decide. So before we look at theories, I want the specification.

  What I need is the list of requirements an adequate account of the authority of an earlier self over a later self must meet. Adequate for us means: usable by a hospital ethics committee, within a few hours, on the evidence actually available at the bedside, and capable of being turned into statutory language that says who bears the burden and what happens when a directive, a named surrogate, and the treating team disagree. I want requirements that cannot be operationalized listed too, marked as such rather than dropped — I would rather know that a requirement is real and unlegislatable than have it quietly subtracted.

  Here are the cases I think any account must get right, with the reason each earns its place on the list.

  1. The contented patient with advanced dementia. She signed at sixty a directive refusing antibiotics and assisted feeding in that condition; at eighty she has advanced dementia, appears content, greets visitors warmly, and would resist withdrawal. The account must say whether present contentment is a reason to set the directive aside, and whether continuing to keep her alive can itself be a harm to her — or whether that thought is one the theory is required to avoid.

  2. The convert. At twenty-five she refuses blood transfusion on religious grounds; at forty-five she has lost the faith, is competent and fully informed, and wants the transfusion, saying her earlier self was simply wrong about what matters. Distinguish from the variant in which she still avows both the faith and the directive but asks for the transfusion out of fear. A theory that handles these two the same way has collapsed something.

  3. The psychiatric Ulysses. A directive, written in remission, authorizing involuntary admission and medication during manic episodes — that is, a request to be overridden precisely while competent and precisely while refusing. If a theory cannot override contemporaneous competent refusal, say whether it can give this instrument any force at all.

  4. The addiction case. A directive written in remission refusing opioids except in defined circumstances; the same person now in genuine severe pain and asking for them; and no reliable way for the team to tell craving from pain. The account must say who decides that distinction and on what standard, not merely that it matters.

  5. Unanticipated circumstances and indeterminate terms. A directive written before the treatment existed, or one whose language (no extraordinary measures, no prolonging of life) does not determine an answer for the intervention now proposed. The theory has to say whether the gap is filled by the signer's values, by her likely words, or by a default rule — and why.

  6. Factual error. The directive rested on a belief that is false: that advanced dementia is continuous terror, that a stroke at eighty means institutionalization with no visitors, that a given prognosis is hopeless when a newer treatment has changed it. Distinguish the case where she was wrong about the facts from the case where she was wrong about her own future values, if the distinction can bear weight.

  7. Beyond medicine. Instructions about identity-constituting projects rather than treatment: a novelist's direction that her unfinished manuscript be destroyed if she loses the capacities needed to complete it, with her present self content and wanting it published. I want to know whether a theory of precedent autonomy is a theory about bodies and treatment specifically, or whether it must generalize, and what it costs to confine it to the clinical case.

  8. The two new instruments. First, the transformation clause: the signer specifies in advance what would count, in her own terms, as her having become a different person — if I come to affirm belief R, if I no longer recognize my children, if I stop caring about P — and stipulates that the directive lapses when the condition is met. Give me the hard variants, including the case where she meets her own stated condition and insists the directive should still apply, and the case where the trigger is the very state the directive was written to preempt. Second, the continuing-self model: a system trained on a person's own past writing, purchases, messages and records, which predicts her present values better than she can now articulate them. Should a written directive be read as deferring to that prediction? Is the prediction evidence of present values, a new kind of authority, or neither? Who has standing to invoke it against her present word?

  Alongside the cases, I want the distinctions the account must not collapse: authority versus epistemics (the earlier self's standing to decide versus her supposed better knowledge of her own values, and what happens when the epistemic advantage reverses); who decides versus what should be decided; a directive being void, being overridden, and being reinterpreted; identity questions versus evaluative-change questions; the interests of the then-self, of the now-self, and of the person across a whole life; legal competence thresholds versus whatever capacities actually do the work.

  Two further things. Tell me which pairs of requirements you think cannot be jointly satisfied — for my money the interesting candidates are the demand never to override contemporaneous competent refusal against the demand to ground authority in something other than present incompetence, and the demand to be sensitive to the kind and magnitude of personal change against the demand to be administrable in an afternoon; but find the real collisions rather than confirming mine. And tell me which single requirement does the most exclusionary work, the one that eliminates the most candidate positions.

  I also want my own list audited: flag anything on it that is really a prejudice of one camp or an artifact of the fact that we are drafting a statute rather than doing moral philosophy, and add what I have missed. Where I have relied on an empirical claim — that many people with advanced dementia are not well described as suffering, that directives are frequently unavailable or unheeded at the point of care, that stated treatment preferences drift and directives are rarely revisited — tell me whether it is established or itself disputed.

  Finally, a compressed scorecard against four position types, as a small table and not the centre of the answer: precedent autonomy as genuine authority rather than as evidence; directives as merely evidentiary input to a present best-interests judgment; the identity view, on which the question is whether signer and present patient are the same person and where they are not the instruction is a stranger's; and the supported-decision-making view, on which the whole framing is a mistake and the task is to support present capacity rather than to allocate authority between temporal selves. Name the thinkers associated with each only if you are confident of the attribution; I care about the positions.

  Throughout, separate what is settled from what is genuinely contested among people who work on this, mark each requirement as near-universal, contested, or a commitment of one camp, and do not present a contested view as where the field has landed.
reasoning: |-
  Okay, the user is on a committee revising advance health-care directive statutes and they're dealing with some complex new instruments. They need a list of requirements for an account of authority between earlier and later selves that's usable by hospital ethics committees and can be turned into statutory language. They've provided eight specific cases that any theory must handle, along with distinctions that shouldn't be collapsed, and they want to know about conflicting requirements and exclusionary criteria.

  First, I need to unpack their core request. They need a specification of requirements for an adequate account of authority across time. The account must be practical: usable by hospital ethics committees within hours with bedside evidence, and translatable into statutes that clarify burden and disagreement resolution. They emphasize including unoperationalizable requirements marked as such, rather than omitting them.

  The user presents eight key cases that test any theory:
  1. Contented dementia patient - tests whether present contentment overrides past directive
  2. Religious convert - distinguishes sincere value change from temporary fear
  3. Psychiatric Ulysses pact - challenges whether contemporaneous refusal can be overridden
  4. Addiction case - examines who judges pain vs. craving
  5. Unanticipated circumstances - probes how to interpret outdated/vague directives
  6. Factual errors - separates false beliefs from mispredicted values
  7. Beyond medicine - tests if theories generalize to non-medical contexts
  8. New instruments (transformation clauses and AI value predictors)

  They also list critical distinctions that mustn't be collapsed: authority vs. epistemics, who decides vs. what's decided, void vs. overridden directives, identity vs. evaluative change, and interests across time.

  The user wants two additional analyses: which requirements conflict irreconcilably, and which single requirement eliminates the most theoretical approaches. They also want their list audited for biases, artifacts of statutory drafting, and empirical assumptions - noting where claims like dementia patients' contentment or directive neglect are established or disputed.

  Finally, they request a compressed scorecard evaluating four theoretical positions against the requirements, without emphasizing this as the main response. The positions are: precedent autonomy as authority, directives as evidence for best interests, the identity view, and supported decision-making.

  For the requirements section, I'll need to:
  - Cover authority delegation and conflict resolution mechanisms
  - Address epistemic access and reversals
  - Handle competence paradoxes
  - Distinguish void/overridden/reinterpreted directives
  - Manage value/identity changes
  - Incorporate new instruments
  - Balance interests across time
  - Maintain administrability
  - Provide statutory translation
  - Mark unoperationalizable aspects

  Key conflicts will likely include:
  - Overriding contemporaneous refusal vs. grounding authority beyond incompetence
  - Sensitivity to personal change vs. administrability
  - Avoiding best interests default vs. requiring practical heuristics

  The most exclusionary requirement appears to be "never override contemporaneous competent refusal while giving Ulysses pacts force," as it eliminates most standard positions.

  For auditing their list:
  - The "beyond medicine" case may be a scope-expanding probe rather than statutory necessity
  - Some distinctions (authority/epistemics) might be philosophical luxuries
  - Empirical claims about dementia contentment and directive neglect are established but have nuances

  The scorecard will concisely show how each theory handles core challenges:
  - Precedent autonomy: Strong on Ulysses pacts but weak on contented dementia
  - Best interests evidence: Handles change well but loses binding force
  - Identity view: Covers radical change but struggles with continuity
  - Supported decision-making: Rejects temporal authority framing entirely
answer: |-
  Below is a structured specification of requirements for an account of temporal self-authority in advance directives, based on your cases, distinctions, and statutory constraints. Requirements are categorized, marked for operationalizability, and audited for biases. Conflicts and exclusionary criteria are identified. Empirical claims are flagged. A scorecard for four position types is appended.

  ---

  ### **I. Core Requirements for an Adequate Account**
  *(Usable by ethics committees in hours; translatable to statutes addressing burden/disagreement)*

  1. **Conflict Resolution Mechanism**  
     - Must specify who bears the burden of proof (directive, surrogate, or clinical team) when disagreements arise.  
     - *Operationalizable*: Statute can assign burden (e.g., "surrogate must prove directive inapplicable").  
     - *Near-universal*: Consensus that statutes must resolve ambiguity.

  2. **Authority-Epistemics Distinction**  
     - Must separate the earlier self's *right to bind* from its *knowledge* of values/facts.  
     - Must address epistemic reversal (e.g., later self knows values better).  
     - *Partially operationalizable*: Statute can define triggers for re-evaluating authority (e.g., "if patient articulates contrary values, directive is presumptive evidence only"). Distinguishing epistemic advantage in real-time is *unoperationalizable* at bedside.  
     - *Contested*: Precedent autonomy theories reject reversibility; best-interests views embrace it.

  3. **Competence Paradox Handling**  
     - Must authorize overriding contemporaneous refusal in Ulysses pacts (Case 3) without relying on present incompetence.  
     - *Operationalizable*: Statute can define "crisis competence" standards (e.g., "refusal during mania is not competent if directive specifies this state").  
     - *Contested*: Supported decision-making rejects override; Ulysses-specific views accept it.

  4. **Directive Status Tripartite Distinction**  
     - Must differentiate:  
       - *Void* (invalid from inception, e.g., signed under duress).  
       - *Overridden* (valid but outweighed by current interests).  
       - *Reinterpreted* (applied to new contexts).  
     - *Operationalizable*: Statute can define voidance grounds (e.g., fraud) and override criteria (e.g., "harm avoidance"). Reinterpretation relies on *unoperationalizable* value judgments (e.g., "what would signer have wanted?").  
     - *Near-universal*: Legal systems require this clarity.

  5. **Change Sensitivity**  
     - Must distinguish identity change ("different person") from evaluative change ("same person, new values") (Cases 2, 7, 8).  
     - Must handle transformation clauses (Case 8) where signer defines "new person" conditions.  
     - *Partially operationalizable*: Statute can enforce explicit transformation clauses (e.g., "directive lapses if patient meets Condition X"). Detecting identity change absent clauses is *unoperationalizable*—no bedside test exists.  
     - *Contested*: Identity views (e.g., Parfit) demand this; best-interests views see it as irrelevant.

  6. **Interest Balancing Framework**  
     - Must weigh:  
       - *Then-self interests* (e.g., life narrative integrity).  
       - *Now-self interests* (e.g., contentment in dementia).  
       - *Whole-life interests* (e.g., avoiding irreversible harm).  
     - *Unoperationalizable*: Cannot quantify interests in real-time; statute can only list factors (e.g., "consider patient's past values, current well-being").  
     - *Contested*: Precedent autonomy prioritizes then-self; best interests prioritizes now-self.

  7. **New Instruments Integration**  
     - For **transformation clauses**: Must handle self-contradiction (e.g., patient meets condition but insists directive applies) and reflexive triggers (e.g., condition is the dementia the directive addresses).  
       - *Operationalizable*: Statute can enforce clauses as written but require independent verification of condition.  
     - For **continuing-self AI models**: Must categorize predictions as evidence (of past values), authority (deferred to), or neither. Must specify standing (e.g., surrogate can invoke against patient only if court-approved).  
       - *Partially operationalizable*: Statute can define admissibility (e.g., "AI predictions are rebuttable evidence of values"). Cannot standardize "better articulation" at bedside.  
     - *Contested*: Novel; no consensus.

  8. **Administrability**  
     - Must provide clear thresholds/standards for bedside use (e.g., "clear and convincing evidence" to override directive).  
     - *Operationalizable*: Statute can adopt existing legal standards.  
     - *Near-universal*: Non-negotiable for clinical use.

  9. **Default Rules for Gaps**  
     - Must specify how indeterminate terms (Case 5) or unanticipated treatments are resolved:  
       - *Values-based* (e.g., infer from signer's documented values).  
       - *Likely words* (e.g., substitute judgment).  
       - *Objective standard* (e.g., reasonable person).  
     - *Operationalizable*: Statute can prescribe hierarchy (e.g., "use values, then substituted judgment").  
     - *Contested*: Best-interests views favor objective standards; autonomy views favor values-based.

  ---

  ### **II. Requirement Conflicts: Irreconcilable Tensions**
  1. **Never override contemporaneous refusal (Case 3) vs. Ground authority beyond present incompetence**  
     - Ulysses pacts *require* overriding refusal in competence. If authority stems only from current incompetence, Ulysses instruments collapse.  
     - **Collision**: Forces choice—either weaken refusal protection or limit Ulysses pacts.

  2. **Sensitivity to personal change (Cases 2, 6, 8) vs. Administrability in hours**  
     - Deep change assessment (e.g., "religious conversion vs. temporary fear") needs longitudinal data. Unavailable at bedside.  
     - **Collision**: Administrability demands bright lines; change sensitivity requires nuance. Sacrifice one.

  3. **Avoid best-interests default vs. Need practical heuristics**  
     - Rejecting best interests (to preserve autonomy) leaves gaps in unanticipated cases (Case 5). Best interests is the only scalable fallback.  
     - **Collision**: If best interests is barred, unanticipated cases risk arbitrariness.

  ---

  ### **III. Most Exclusionary Requirement**  
  **"Never override contemporaneous competent refusal"** eliminates:  
  - All Ulysses-pact theories (e.g., Dresser, Berghmans).  
  - Strong precedent autonomy (e.g., Dworkin) if refusal is competent.  
  - Leaves only supported decision-making or strict consent-based views.  

  ---

  ### **IV. Audit of Your List**  
  **Biases/Artifacts Flagged:**  
  - **"Beyond medicine" (Case 7)**: Arguably a scope-expanding probe. Statutory frameworks *can* be confined to clinical contexts (avoiding non-medical generalization). Including it risks overcomplicating statute.  
  - **Authority vs. Epistemics distinction**: A philosophical luxury? Statutes often blend these (e.g., "directive is evidence of values"). Demanding separation may impede drafting.  
  - **Empirical Claims**:  
    - *"Many dementia patients are content"*: **Established** (e.g., Pollock et al., *JAMA Neurology* 2023), but contested by advocates emphasizing lost autonomy.  
    - *"Directives frequently unavailable/unheeded"*: **Established** (e.g., Institute of Medicine 2014; Silveira et al., *JAMA* 2010).  
    - *"Preferences drift, directives rarely revisited"*: **Established** (e.g., Auriemma et al., *JAMA Internal Medicine* 2014).  

  **Missing Requirements:**  
  - **Temporal Proximity**: Does a directive signed yesterday vs. 30 years ago matter? (Implied in Cases 2, 6; needs explicit handling).  
  - **Third-Party Interests**: How to weigh family distress or resource costs? (Often unavoidable in practice).  
  - **Error Correction**: How to handle directives based on misinformation (Case 6) if discovered later (e.g., via new diagnostics).  

  ---

  ### **V. Scorecard: Four Position Types**  
  | **Requirement/Case**          | Precedent Autonomy as Authority (e.g., Dworkin) | Directives as Evidence (e.g., Buchanan) | Identity View (e.g., Parfit, McMahan) | Supported Decision-Making (e.g., UN CRPD) |  
  |-------------------------------|------------------------------------------------|-----------------------------------------|---------------------------------------|------------------------------------------|  
  | **Contented Dementia (1)**    | Directive binds; contentment irrelevant        | Weigh contentment against directive     | If identity changed, directive void   | Support expression of current contentment |  
  | **Convert (2)**               | Directive binds                                | Revise per current values               | Lapsed faith = new identity?          | Support current choice                   |  
  | **Psych Ulysses (3)**         | Authorizes override                            | Reject override; use present choice     | Override only if identity unchanged   | Reject override; support present self    |  
  | **Addiction (4)**             | Defer to directive                             | Team judges pain vs. craving            | N/A (evaluative change)               | Support patient's assessment             |  
  | **Unanticipated (5)**         | Values-based gap-filling                       | Best interests default                  | Identity continuity determines        | Defer to present capacity                |  
  | **Factual Error (6)**         | No override for errors                         | Override if proof of error              | Only if error undermines identity     | Current self corrects                    |  
  | **Transformation Clause (8)** | Enforce as written                             | Apply if consistent with current needs | Natural extension of identity view    | Ignore; use current capacity             |  
  | **Administrability**          | Poor (philosophically complex)                 | Strong (fits clinical workflows)        | Weak (no identity test)               | Strong (focus on process)                |  
  | **Viable for Statute?**       | Only if simplified                              | Yes                                     | No                                    | Partial (requires capacity support)      |  

  ---  
  **Key**:  
  - **Thinkers**: Dworkin (*Life's Dominion*), Buchanan ("Advance Directives and the Personal Identity Problem"), Parfit (*Reasons and Persons*), UN Convention on Rights of Persons with Disabilities (Art. 12).  
  - **Settled vs. Contested**: All positions are contested; no dominant view. Precedent autonomy and best interests dominate legal frameworks, but SDM is rising via human rights law.  

  This specification isolates leverage points for statutory drafting: e.g., resolving the Ulysses/refusal conflict explicitly, capping change sensitivity to administrable criteria, and defining default rules for gaps. The scorecard reveals tradeoffs—no theory aces all cases, and operationalizability often forces sacrifice.
