prompt: |-
  I am a second-year PhD student in philosophy, and this term I am running a small graduate reading group on whether results in computational complexity theory do any *normative* work, or only descriptive and engineering work. The concrete focus is the familiar worst-case hardness of probabilistic inference, planning and strategic reasoning in settings that are otherwise perfectly classical: no bounded recall, no resource limits written into the formalism, just ordinary Bayesian updating, ordinary expected-utility maximisation and ordinary equilibrium reasoning over an expressive language. One half of the group — call them the feasibility camp — argues that if a norm's verdicts cannot in general be computed, or even approximated to any useful guarantee, then it cannot be a norm for agents like us: 'ought' implies 'can', 'can' must be read as something like reliable producibility by a feasible procedure, and so our normative theories ought to be indexed to what tractable procedures can deliver, with the ideal theory demoted to a limiting or merely definitional role. The other half — the correctness camp — replies that standards of correctness are not the sort of thing that capacities can validate or invalidate; that intractability bears on excuse, implementation and institution-design but not on what it is to get things right; and, more sharply, that one can *satisfy* a norm without *computing* it, since an agent might be reliably coherent, or reliably optimal, by grace of structure, habit, or a cheap surrogate procedure whose outputs happen to agree with the ideal's verdicts on the cases that actually arise. We have now had this argument, in recognisably the same shape, four times in six weeks.

  My own hypothesis is that we are running together at least three different questions under the word 'rationality': a question about *verdict-norms* (what it is to get a given deliberative problem right, i.e. what the correct answer is), a question about *procedure-norms* (what an agent should do, in the time and with the machinery it has, when it faces one), and a question about *design-norms* (what we should build, train, or institutionalise, including what we should hold each other responsible for). I also want to press a second distinction that I think nobody in the room has made cleanly: the distinction between the hardness of *computing* a norm's verdict and the hardness of *complying* with the norm, where the latter might be easy even when the former is intractable. That gap is what makes the 'cheap surrogate that tracks the ideal' move — call it the tracking defence — initially attractive, and my worry is that it is unstable: the meta-question of whether a given surrogate tracks the ideal on the instances that actually arise looks, for interesting cases, at least as hard as the original problem, and even if it is not, the answer seems to depend on facts about the distribution of real instances that nobody in the group is in a position to supply. A third, smaller faction thinks the whole dispute is ill-posed from the start, because complexity classes describe asymptotic scaling behaviour while our norms are applied to finite agents with fixed resources and fixed problem sizes, so that the granularity is simply wrong.

  So what I want from you is a diagnosis, not a verdict and not a survey, and I would like it in British English. Please tell me what kind of stalemate this is: a verbal dispute about 'rationality', 'norm' or 'can'; two or three different questions sharing a name; a hidden empirical disagreement about instance distributions, average-case versus worst-case structure, or human performance; a bedrock clash about whether normativity must be action-guiding to be normativity at all; or a genuinely ill-posed question. Engage the positions as I have described them rather than rehearsing who has said what, and please do not give me a reading list or citations — I am not asking you to reconstruct a literature. My specific questions are these. First, does the computing/complying distinction actually do the work I think it does, or does it smuggle in the very point at issue — that norms are standards of output rather than requirements of procedure — and thereby beg the question against the feasibility camp? Second, where exactly does the tracking defence fail: on the intractability of verifying tracking, on the absence of any principled account of which instance distributions matter, or somewhere else? Third, given your diagnosis, what would count as progress here — an average-case or smoothed-complexity result, an approximation-guarantee-to-verdict-tracking theorem, an empirical programme, a sharper conceptual distinction, an explicit change of question — and should one expect progress at all, or is the persistence of this argument evidence that the question is doing something other than asking to be answered?
reasoning: |-
  Okay, let me unpack this fascinating philosophical stalemate. The user presents a deeply entrenched debate between "feasibility" and "correctness" camps in their computational complexity reading group, centered on whether computational intractability undermines normative claims. 

  First, I notice the user has already done significant conceptual groundwork - their threefold distinction (verdict/procedure/design norms) and computing/complying separation are sophisticated framing tools. Yet the dispute persists. Why? 

  Hmm. The core tension seems to be between two irreconcilable meta-ethical stances: one viewing norms as essentially action-guiding (making computational feasibility necessary), the other seeing them as truth-conditional standards (where feasibility concerns are secondary). This isn't just terminological - it's about what normativity fundamentally is. 

  The computing/complying distinction is crucial but indeed risks question-begging. By separating what's correct from how to achieve it, it presupposes the correctness camp's view that norms are output standards. The feasibility camp would reject this very separation as artificial - for them, "complying" without feasible computation pathways is empty. 

  On the tracking defense: its fragility lies not just in verification hardness, but in requiring a pre-theoretical notion of "relevant cases" that doesn't exist. Without a tractable model of real-world instance distributions (which we lack for most interesting problems), tracking claims become either vacuous or unverifiable. 

  Progress might come from: 
  - Focusing on approximation theorems with domain-specific guarantees 
  - Investigating "tractability profiles" of actual human institutions 
  - Explicitly accepting distinct normative projects (e.g. "engineering rationality" vs "ideal theory") rather than seeking unification 

  But fundamentally? This may be a persistent fault line in normative theorizing. The group's recurrence to the same arguments suggests they're encountering different bedrock commitments about what makes a norm normative - commitments that complexity theory reveals but cannot resolve.
answer: |-
  Your stalemate is a **bedrock clash about the nature of normativity itself**, amplified by unresolved empirical dependencies and masked by conflated terminology. The "feasibility" and "correctness" camps aren’t merely disagreeing about *rationality*—they’re operating with incompatible conceptions of what a *norm* is and what work it must do. Below, I address your specific questions and diagnose the deadlock.

  ### 1. **The Computing/Complying Distinction: A Question-Begging Move?**  
  Yes, it smuggles in the correctness camp’s core premise. By separating "computing a verdict" (algorithmic process) from "complying with a norm" (achieving the right output), you presuppose that norms are *evaluative standards for outcomes*, not prescriptions for procedures. This assumes the very thing the feasibility camp denies: that "getting it right" is separable from the cognitive process required to get there. For them, norms must be *action-guiding*—a norm that cannot be feasibly followed is not just impractical but *invalid* as a norm for agents like us. Your distinction thus implicitly sides with correctness by framing compliance as a matter of *outcome attainment*, while feasibility insists that "can" constrains the *pathway* to that outcome. The stalemate here is not resolvable by distinction-drawing alone—it requires confronting whether normativity must be procedural.

  ### 2. **Where the Tracking Defence Fails: Verification and Distributional Ignorance**  
  The tracking defence ("a cheap surrogate might coincidentally comply") collapses under three pressures:  
  - **Meta-intractability**: Verifying that a surrogate *reliably tracks* the ideal norm on *actual* instances often requires solving the same intractable problem (e.g., "Does this heuristic approximate Nash equilibrium in real-world games?"). If checking compliance is as hard as computing the norm, the defence gains no traction.  
  - **The Distribution Problem**: We lack a tractable characterization of the "cases that actually arise." Real-world instances aren’t uniformly random; they exhibit structure, but we have no feasible model of that structure. Without this, "tracking" is either an empty hope or an untestable article of faith.  
  - **Dynamic Instability**: Even if a surrogate works today, shifts in the environment (e.g., adversarial agents, new data) may break alignment with the ideal. Maintaining tracking requires ongoing verification—which reintroduces intractability.  
  The defence thus fails not on principle but on *contingent empirical grounds*: we cannot access the distributional facts needed to support it.

  ### 3. **Diagnosis: The Core Stalemate and Paths to Progress**  
  **The Stalemate Is**:  
  - **Conceptual**: Feasibility sees norms as inherently constrained by agency (a "constructive" view); correctness sees them as abstract standards (a "Platonic" view).  
  - **Empirical**: Both sides rely on unstated assumptions about instance distributions. Feasibility assumes hard cases *persistently arise*; correctness assumes they are *rare or structured benignly*. Neither can ground these claims.  
  - **Methodological**: Complexity theory’s asymptotic lens *does* misalign with finite-agent problems, but this isn’t fatal—it simply limits which results are relevant (e.g., constant-depth circuit lower bounds may say more about small-scale reasoning than **NP**-hardness).  

  **Progress Requires**:  
  - **Reframing the Question**: Explicitly split the three norm-types (*verdict*, *procedure*, *design*). For *procedure-norms*, feasibility concerns dominate; for *verdict-norms*, correctness may hold. This forces clarity on which "ought" is at stake.  
  - **Empirical Grounding**: Map real-world problem distributions (e.g., via cognitive science or game-theoretic fieldwork). If instances in practice are "easy," correctness gains leverage; if "hard" cases are pervasive, feasibility does.  
  - **Approximation Theorems with Teeth**: Identify *domain-specific* approximation schemes (e.g., "In auctions with submodular bidders, heuristic X provably tracks equilibrium bids"). This bridges feasibility and correctness by showing *when* cheap surrogates *can* work.  
  - **Accept the Stalemate**: Some disputes persist because they reflect divergent philosophical commitments. Progress may mean agreeing that *verdict*-norms are timeless but *procedure*-norms are ecology-dependent—and neither camp "wins."  

  ### Conclusion  
  The persistence of the argument signals a **productive tension**, not futility. It forces philosophy to engage computational constraints not as nuisances but as constitutive of agency. The path forward isn’t consensus but **controlled divergence**: specify *which* norm is being debated, *whose* capacities matter, and *what* empirical context anchors the "can" in "ought implies can." Until then, the stalemate is a necessary symptom of wrestling with a world where truth and tractability pull in opposite directions.
