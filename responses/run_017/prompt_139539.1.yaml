  First, I need to understand their core argument. They reject absolute verisimilitude due to language-dependence issues from Tichý et al. and the likeness approach's arbitrariness. Their solution is question-relative verisimilitude based on weighted correct answers to a question set Q. 

  Looking at the audience: 

  The scientific realists (likeness approach) will likely challenge the conflation of truthlikeness with informativeness. The formal epistemologists might see this as rediscovering expected inaccuracy with a prior. The Kuhnian historian will view it as incommensurability in formal garb. The deflationist will question truth's role. The climate modeler will want practical application. 

