prompt: |-
  hi — I'm in an upper-level seminar on social norms and practical reason, and last week we did the Lewis-style coordination account of conventions and the Rawls practice-conception bit, and I tried to use it to win an argument with my roommate and instead built something I'm pretty sure can't be right but can't locate the gap in. He's from a country where nobody tips, and his view is that at home he has no obligation to tip and here he also has no obligation to tip, because, as he puts it, "the menu price is the price." I said he does have to tip here, since the servers wages are literally set on the assumption, and when he asked why that generates an obligation rather than just explaining why they're underpaid, this is what I wrote out:

  (1) A convention is a regularity in behavior that persists because nearly everyone prefers to conform conditional on others conforming; which regularity gets selected is typically arbitrary — what does the work is that everyone does the same thing.

  (2) So when you deviate from a live convention, you make others worse off than they would have been had you conformed: their expectations get frustrated, and the coordination the convention existed to produce partly fails.

  (3) Making others worse off than they'd otherwise be just to save yourself a small cost is pro tanto wrong; and where you've taken a benefit the practice produced while letting others shoulder the cost of keeping it up, it's a form of free riding.

  (4) So a visitor owes conformity to the local conventions. Since the content is arbitrary, conforming costs them at most minor inconvenience, so they can't complain about it.

  (5) Because it's the conformity and not the content that does the work, (4) holds whatever the convention is, whether or not the visitor thinks it's a decent one, and whether they're staying ten years or one afternoon.

  (6) Now fill in some actual local conventions. In plenty of cities the real convention is that pedestrians cross wherever they like and drivers have adapted to it, so the marked crossing is where accidents happen, because nobody expects a pedestrian there. Elsewhere the convention is not to tip; or to shove into the scrum instead of lining up (in which case my shoving is exactly what pushes out the person who can't shove); or to slip the clerk something so your paperwork moves this month.

  (7) So by (5) the visitor is required to jaywalk, not to tip, to shove, and to pay the bribe.

  (8) That's mad. At least the last one is something a visitor plainly shouldn't do, and "when in Rome" isn't a moral principle. So something above is false.

  I can see the obvious move — say (2) and (4) only cover conventions that are themselves worth having — but that feels like cheating, because step (1) says the content is arbitrary, which is exactly what made (4) cheap to accept. I'd rather keep (3) than (4) if forced, and I'd love to keep the tipping conclusion for my roommate's case in particular, but not at the price of having to say that a tourist who won't bribe a clerk is thereby doing something wrong.

  Where's the break? If it's an equivocation on "convention," tell me precisely which of my steps survives on the narrow reading and which one collapses, and what I'd have to say instead about tipping and about jaywalking once the argument is repaired — including whether the repaired version still makes tipping owed, or whether my roommate was right all along. Under 700 words, please, and please don't just tell me that conventions aren't morality: I want the step, why it looked fine, and what each of the alternatives costs me.
reasoning: |-
  Okay, let me tackle this philosophy student's problem. They've constructed an argument about social conventions that leads to a clearly absurd conclusion - that tourists should morally oblige to bribe officials - and they want to know where the logical break occurs. 

  The core tension lies in their application of David Lewis's convention theory (from step 1) to moral obligations (step 3). I recall Lewis treats conventions as coordination solutions to recurrent problems, where the specific solution is arbitrary but the coordination itself is valuable. But crucially, Lewis was describing social facts, not prescribing moral duties. 

  When the student connects convention-breaking to making others "worse off" in step 2, they're smuggling in moral language that Lewis never intended. The frustration of expectations isn't inherently morally wrong - think of surprising someone with a gift. The wrongness only emerges if the convention serves some independent moral good, like fair wages in tipping or pedestrian safety in traffic norms. 

  For the bribery example, the convention actively undermines justice rather than enabling coordination. So the student's mistake is assuming all conventions create moral obligations by their mere existence. The break happens between steps 3 and 4: we need external moral criteria to judge when convention-following is actually obligatory. 

  This preserves the tipping argument (since tipping conventions prevent wage exploitation) while rejecting the bribery case. The student can still tell their roommate that tipping is obligatory here - not because "when in Rome" but because the convention serves fairness. Jaywalking norms would require checking whether they actually improve safety overall. 

  The key insight is distinguishing between conventions as solutions to coordination problems versus conventions that reflect or create injustice. The former might generate obligations when they serve morally valuable ends; the latter certainly don't.
answer: |-
  Here's the precise break in your chain, preserving your core insight while avoiding the absurdity:

  **The break is between (3) and (4).** (3) is broadly correct, but (4) ("a visitor owes conformity to the local conventions") is an overgeneralization. Not all conventions create obligations simply by existing. The gap is that **step (3)'s "making others worse off... is pro tanto wrong" only applies *if the convention itself is reasonably just or serves a legitimate coordinating function*.** Lewis's account describes *how* conventions work, not *which* ones create moral obligations.

  **Why it looked fine:** Lewis emphasizes the arbitrariness of the *solution* (e.g., driving on left vs. right). This makes *any* stable convention seem equally coordination-enabling. Step (2) accurately describes the *mechanical* effect of deviation within a stable convention: frustrated expectations and partial coordination failure. Step (3) sounds like a straightforward application of non-maleficence or fairness. Linking them made (4) seem inevitable: deviation harms coordination, so it's wrong.

  **What each alternative costs you and the repair:**

  1.  **Why (4) overgeneralizes:** Conventions aren't morally neutral coordination devices by default. Some conventions:
      *   **Solve genuine coordination problems efficiently/fairly (e.g., traffic rules, tipping in context).** Deviation *does* frustrate legitimate expectations and free-ride.
      *   **Are exploitative or unjust (e.g., systematic bribery, caste norms).** Conforming actively perpetuates harm. The "coordination" serves an illegitimate end. Frustrating expectations here isn't pro tanto wrong; it might be obligatory.
      *   **Are inefficient or mildly harmful but entrenched (e.g., some jaywalking norms).** The moral weight of frustrating expectations is weaker or absent.

  2.  **The Repair: Add a filter to (3)/(4).** The obligation to conform depends on the convention serving a **legitimate coordinating function under reasonably just background conditions.** Ask:
      *   **What problem does it solve?** Is it a genuine coordination problem (e.g., distributing the cost of service, safe pedestrian flow)?
      *   **Is the solution reasonably fair?** Does it distribute burdens/benefits acceptably? Does it exploit vulnerable parties?
      *   **Are expectations legitimate?** Is reliance on conformity justified, or based on coercion/injustice?

  3.  **What this costs you:**
      *   **Loss of Simplicity:** You lose the clean, content-independent "When in Rome" rule. You must evaluate conventions contextually.
      *   **Potential Controversy:** Judging "legitimate function" and "reasonably just" can be debatable (e.g., is *any* tipping convention fair if it underpays workers?).
      *   **Visitor's Burden:** Visitors must make context-sensitive judgments, not just blindly follow.

  4.  **Applying the Repair - Your Cases:**
      *   **Tipping (US):** Solves the coordination problem of compensating service workers where wages are legally set below minimum *expecting* tips. The convention, however flawed, *is* the mechanism ensuring workers get livable income *in that system*. Deviation directly undermines this expectation, free-rides on others' conformity, and harms the worker (who bears the cost). **Obligation stands.**
      *   **Jaywalking (Cities where it's norm):** Solves coordination for pedestrian flow *if* drivers genuinely adapt and safety isn't compromised. If data shows it's *as safe or safer* than strict crossing adherence *in that context*, deviation might frustrate driver expectations and cause disruption. The obligation is weaker (safety is paramount), but conformity might be prudent. If the norm demonstrably increases danger, no obligation exists (it's a bad convention).
      *   **Shoving/Scrum:** Likely inefficient and unfair (rewards aggression, excludes vulnerable people). While it coordinates entry, the solution is unjust. Conforming perpetuates harm. **No obligation;** queuing might be the morally better act even if non-conforming. Frustrating expectations here isn't pro tanto wrong.
      *   **Bribery:** The "coordination" serves corruption, exploiting citizens and undermining justice. The clerk's "expectation" is illegitimate. Conforming actively participates in injustice. **Strong obligation *not* to conform.** Frustrating this expectation is morally required.

  **Conclusion:** Your argument for tipping holds because the US tipping convention, despite its flaws, solves a genuine coordination problem (worker compensation) within the existing wage system, and deviation directly harms workers who rely on the convention. The obligation stems from preventing harm and free-riding within a *relatively legitimate* (though improvable) framework. The bribery counterexample fails because that "convention" lacks legitimacy; its coordination serves injustice. The break was assuming Lewis's *descriptive* account of convention stability *directly* implied a *moral* obligation for any convention. Morality requires evaluating the convention's purpose and fairness. Your roommate still owes the tip.
