prompt: |-
  I got into an argument at a dinner party recently about whether you can ever be worse off for knowing something, and I have not been able to get my own verdicts to line up. One friend, an economist, said the question is settled: for an expected-utility maximizer facing a fixed decision problem, free information is never worth less than nothing, because you can always ignore what you learn and do exactly what you would have done anyway, and by the same style of argument a signal is never worth less than any noisy garbling of it. I think that argument is right as far as it goes, but I keep producing cases where I would pay to avoid learning something, and I want to know whether the principle can be repaired or whether some of my verdicts have to go. My tentative formulation, which I suspect is too crude, is this: learning is good just when it lets my action depend on the world in a way it could not before, and bad just when it forces my action to depend on the world in a way I would rather it did not.

  Here are the verdicts I am fairly confident about. I would pay for a market survey before deciding whether to launch a product, and I would pay more the nearer I am to indifference between launching and not; the same survey is worth exactly nothing if it is so noisy that no result could move me, and worth nothing if I already know what it will say. I would pay a little to learn who wrote a certain anonymous seventeenth-century pamphlet, even though I will do nothing differently once I know. I would pay a real sum not to be told which of my students wrote which anonymous exam, even though knowing would let me write them more useful comments, because once I know I cannot grade blind. I would take, for free, a sealed envelope containing that mapping which I alone could open and would probably leave shut, and I think that is clearly better than never being offered the envelope. I would decline a health-risk test whose result is automatically entered into a file my insurer can read, and I would want the very same test if the result sat in a file only I control. In a negotiation, I would pay to read the other side's cost sheet if they never learn I have seen it, and I would pay not to be handed it in front of them. And a friend who runs a two-person clinic says a fifty-variable forecast would make her team worse than a one-page summary, because her team can act on about three things a quarter and reading the rest eats the attention the three would have had; she would take the summary even if the full forecast were free and strictly more informative. Finally, I would pay for a cheap pilot whose only use is telling me whether the expensive study is worth commissioning at all, even though the pilot says nothing directly about the launch decision. The Blackwell-style claim and the clinic case are the pair I cannot reconcile, and the pamphlet case sits badly with the claim that information is worthless when it cannot change your action.

  What I want from you is the principle, not a survey of positions and not references. State one or two candidate principles precisely enough that I could apply them myself, say which case motivates each clause, and tell me which of my verdicts each candidate accommodates and which it forces me to overturn, including whether the crude formulation above survives in any form. Then give me its verdicts on three cases I have not listed: a physician deciding whether to tell a patient the exact numerical risk of a side effect when the patient will have the operation either way and has said they would rather not know; a juror who has accidentally seen material the judge will later instruct the jury to disregard; and me, halfway through a novel, deciding whether to read a detailed plot summary before finishing it. If the honest answer is that no single principle fits and that the disagreement between my verdicts is real rather than apparent, say so and tell me which verdict you think is the mistake.
reasoning: |-
  Hmm, this user presents a sophisticated philosophical and decision-theoretic puzzle about the value of information. They're clearly well-versed in economics (referencing Blackwell's theorem) but troubled by intuitive counterexamples where information seems harmful. Their "crude formulation" captures the tension well: information can be desirable when enabling useful dependence on the world, undesirable when forcing unwanted dependence.

  The core conflict is between the economist's formal argument (information is never harmful because you can always ignore it) and practical cases where:
  - Ignoring information is psychologically impossible (grading exams)
  - Information creates strategic vulnerabilities (negotiation)
  - Cognitive costs outweigh informational benefits (clinic forecast)
  - Information imposes emotional burdens (health test for insurer)

  Their listed cases systematically challenge different premises of Blackwell's theorem: fixed decision problems, costless processing, no external observers, no preference for ignorance. The pamphlet case is particularly interesting - pure curiosity value exists outside instrumental use.

  For principles, I need something more nuanced than "information is always weakly beneficial." Two candidates suggest themselves:
  1) Instrumental value principle: Information has positive expected value only if it could change a payoff-relevant action in your decision tree, net of cognitive/strategic costs.
  2) Agency principle: Information has negative value when it constrains your future choice sets (e.g. by making certain actions psychologically unavailable) more than it expands them.

  The clinic case fits both: the detailed forecast expands theoretical choice sets but actually constrains effective agency by overwhelming cognition. The grading case fits the agency principle - knowing student identities constrains the grader's ability to choose unbiased evaluation. The negotiation case shows how information can constrain choice sets by altering others' expectations.

  For the new cases:
  - Physician: Agency principle suggests withholding risk info respects patient's meta-preference for ignorance
  - Juror: Instrumental value principle says the information has negative value since it can't legally affect verdict but may distort judgment
  - Novel spoiler: Both principles might justify avoidance - spoilers constrain the experience of discovery without enabling new actions

  The pamphlet case remains tricky - it has no instrumental value but positive curiosity value. This suggests we might need a third category: information can have terminal value. But including that might make the theory too broad. Perhaps the cleanest solution is to say the economist's theorem holds for narrow decision problems, but humans face open-ended "games" with psychological and strategic dimensions where information has costs Blackwell didn't model.
answer: |-
  Your intuition that the standard economic argument is incomplete is correct. The principle fails to account for psychological constraints, strategic interactions, and cognitive costs. Below are two candidate principles addressing these gaps, followed by analysis of your cases and verdicts on the new scenarios.  

  ### Candidate Principle 1: *Instrumental Agency*  
  **Formulation**:  
  > Information has positive value if and only if:  
  > (a) It enables you to *conditionally* choose actions that yield higher expected utility than your default action, **and**  
  > (b) The net benefits (including cognitive/strategic costs) of acting on it exceed the costs of acquisition/processing.  
  > Otherwise, information has non-positive value.  

  **Motivation**:  
  - Clause (a) addresses the economist’s core insight (you need *potential* for better decisions).  
  - Clause (b) adds constraints: cognitive scarcity (clinic case), strategic harm (insurer/negotiation cases), and preference for ignorance (grading case).  

  **Accommodates your verdicts**:  
  - ✅ **Market survey**: Valuable when near indifference (clause a), worthless if too noisy or already known (fails a).  
  - ✅ **Clinic forecast**: Full report has negative net value due to cognitive costs (clause b); summary wins.  
  - ✅ **Grading**: Knowing names forces dependence on unwanted information (violates b: psychological cost > benefit of better comments).  
  - ✅ **Sealed envelope**: Option value satisfies a (potential for future use) with no costs (b).  
  - ✅ **Health test/negotiation**: Value flips based on strategic control (b).  
  - ✅ **Pilot study**: Enables better meta-decisions (satisfies a for the "commission expensive study?" subproblem).  

  **Forces overturned verdicts**:  
  - ❌ **Pamphlet authorship**: You’d pay despite no action change. *This violates clause (a)*. Principle 1 says it should be worthless.  

  ### Candidate Principle 2: *Expanded Agency*  
  **Formulation**:  
  > Information has positive value if it expands your agency (e.g., enabling new actions, preserving ignorance, or satisfying terminal curiosity), *provided* it does not:  
  > (i) Unavoidably constrain future choices (e.g., by creating psychological/strategic burdens), or  
  > (ii) Impose net cognitive/strategic costs exceeding agency benefits.  

  **Motivation**:  
  - Expands "agency" beyond instrumental actions (covering curiosity and optionality).  
  - Explicitly penalizes information that *forces* unwanted dependencies (grading, insurer cases).  

  **Accommodates all your verdicts**:  
  - ✅ **Pamphlet authorship**: Satisfies terminal curiosity (expands epistemic agency).  
  - ✅ **Grading**: Knowing names constrains agency (forces biased grading; violates i).  
  - ✅ **Clinic forecast**: Cognitive costs (ii) outweigh agency benefits.  
  - ✅ All other cases align as in Principle 1.  

  **Survival of your crude formulation**:  
  Both principles retain its core:  
  - "Learning is good when it lets action depend on the world" → Clause (a) in Principle 1, agency expansion in Principle 2.  
  - "Bad when it forces unwanted dependence" → Constraint (i) in Principle 2, cost (b) in Principle 1.  

  ---  
  ### Verdicts on New Cases  
  Apply **Principle 2** (it captures your intuitions most fully):  

  1. **Physician disclosing side-effect risk**:  
     - **Verdict**: Do not disclose.  
     - **Reason**: Patient’s preference for ignorance preserves their agency (avoids anxiety that might impair decision-making later). Disclosing forces unwanted psychological dependence (violates i).  

  2. **Juror seeing inadmissible evidence**:  
     - **Verdict**: Information has negative value.  
     - **Reason**: It unavoidably constrains impartial judgment (violates i), cannot be "unlearned," and imposes cognitive burden to suppress it (violates ii).  

  3. **Reading novel spoilers**:  
     - **Verdict**: Avoid summary.  
     - **Reason**: Spoilers destroy the agency of experiencing narrative discovery (a terminal value). Knowing plot details forces dependence on information that degrades aesthetic agency (violates i).  

  ---  
  ### Conclusion  
  **No single principle fits perfectly**, but **Principle 2 (Expanded Agency)** best reconciles your verdicts. The economist’s argument fails because it assumes:  
  - Actions can be freely ignored (false when psychology/strategy binds you).  
  - Decision problems are fixed (false when information changes the game, e.g., insurer access).  
  - Curiosity has no value (contradicted by the pamphlet case).  

  **The mistake**: The economist’s verdict that "a signal is never worth less than any garbling" is incorrect in your clinic case. The garbled summary *is* more valuable than the full forecast because cognitive costs override informational advantages. Principle 2 explicitly incorporates this.  

  **Final refinement**:  
  > *Information is valuable when it expands agency (instrumentally or terminally) without imposing net constraints or costs.*  
  This preserves your intuitions while rejecting the economist’s narrow view.
