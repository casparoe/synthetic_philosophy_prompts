  ### Epistemology of Testimony: Classification Space and Decision Tree

  #### **Part 1: The Conceptual Space**
  The space of testimony theories is defined by four axes. Each axis isolates a core disagreement. Not all combinations are occupied; empty cells are diagnosed below.

  1. **Axis 1: Need for Hearer's Positive Reasons**  
     Does the hearer require positive, active reasons to accept testimony?  
     - **Yes**: Reductionist-leaning (reasons needed).  
     - **No**: Anti-reductionist-leaning (no reasons needed).  

  2. **Axis 2: Scope of Required Reasons (if Yes to Axis 1)**  
     If reasons are needed, must they target the specific speaker/statement?  
     - **Specific**: Reasons must address *this* speaker and *this* claim/domain.  
     - **General**: Reasons can be about testimony/domains in general.  

  3. **Axis 3: Nature of Support (if Yes to Axis 1)**  
     What underpins the reasons?  
     - **Internal**: Hearer must be aware of/able to cite the reasons.  
     - **External**: Reasons can be facts about reliability (even if unknown to the hearer).  

  4. **Axis 4: Basis for Acceptance (if No to Axis 1)**  
     Why can testimony be accepted without reasons?  
     - **Basic Source**: Testimony is fundamental (like perception).  
     - **Default Entitlement**: Default right to accept, but testimony isn't basic.  
     - **Second-Personal**: Speaker's act of assurance creates a distinctive obligation.  
     - **Process Reliability**: Acceptance is rooted in external reliability.  

  **Total Combinations**: 8 (2 × 2 × 2 for reductionist; 4 for anti-reductionist).  

  | Position                             | Axis 1 | Axis 2 | Axis 3 | Axis 4           | Status       | Diagnosis                                                                 |  
  |--------------------------------------|--------|--------|--------|------------------|--------------|---------------------------------------------------------------------------|  
  | Humean global reductionism           | Yes    | General| Internal| –                | Occupied     | Relies on general inductive evidence; hearer must be aware.               |  
  | Local reductionism                   | Yes    | Specific| Internal| –                | Occupied     | Hearer must assess *this* speaker/claim; reasons must be accessible.      |  
  | Externalist local reductionism       | Yes    | Specific| External| –                | **Unnamed**  | Coherent but unattractive: specific reliability matters, even if unknown. |  
  | Externalist global reductionism      | Yes    | General| External| –                | **Unnamed**  | Coherent but unexplored: global reliability suffices, even if unknown.    |  
  | Reid/Coady anti-reductionism         | No     | –      | –      | Basic Source     | Occupied     | Testimony is basic; acceptance is default.                                |  
  | Bare-presumption view                | No     | –      | –      | Default Entitlement| Occupied     | Acceptance by default; defeasible but not a basic source.                 |  
  | Trust/assurance view                 | No     | –      | –      | Second-Personal  | Occupied     | Speaker's responsibility creates a distinctive reason.                    |  
  | Process-reliabilist view             | No     | –      | –      | Process Reliability| Occupied     | Reliability of testimony process justifies acceptance.                    |  
  | Non-evidentialist entitlement view   | No     | –      | –      | Default Entitlement| Occupied     | Entitlement to trust; not a basic source.                                 |  
  | Transmission view (knowledge only)   | –      | –      | –      | –                | **N/A**      | Cross-cutting: applies to knowledge, not justification.                   |  

  **Empty Cells**:  
  - **Externalist reductionisms** (local/global): Coherent but unattractive, as they divorce justification from hearer’s perspective. Rarely defended.  
  - **Second-personal + other bases**: Incoherent. The second-personal reason is incompatible with categories like reliability or basic sources.  

  #### **Part 2: Decision Tree with Concrete Cases**  
  *Instructions*: Start at Question 1. Answer based on concrete cases (no theory terms). Follow branches to a leaf position.  

  1. **Case: Stranger in a railway station tells you the time.**  
     **Question**: Must you have a positive reason (e.g., past experience with strangers, a working clock nearby) to accept this?  
     - **Yes** → Go to 2.  
     - **No** → Go to 5.  

  2. **Case: Anonymous account with a long, independently verified track record on precisely this kind of question.**  
     **Question**: Must your reasons specifically target *this* account and *this* claim, or can they rely on general facts about such accounts?  
     - **Must be specific to this account/claim** → Go to 3.  
     - **Can be general** → Go to 4.  

  3. **Case: Two speakers with identical measured reliability—one a stranger, one a person you’ve trusted for years—say the same thing.**  
     **Question**: For the stranger, is it enough that reasons to trust them *exist* (e.g., their reliability), or must you *be aware* of those reasons?  
     - **Must be aware** → Leaf: **Local reductionism**.  
     - **Enough that reasons exist** → Leaf: **Unnamed (externalist local reductionism)**.  

  4. **Case: Source that is entirely reliable but you only see its outputs when favorable (never disconfirming).**  
     **Question**: To accept its testimony, is it enough that testimony *is* generally reliable, or must you *be aware* of reasons for its reliability?  
     - **Must be aware** → Leaf: **Humean global reductionism**.  
     - **Enough that it’s reliable** → Leaf: **Unnamed (externalist global reductionism)**.  

  5. **Case: Speaker warns you in advance they are unreliable about this topic, then tells you something about it.**  
     **Question**: In the *stranger (Case 1)*, why could you accept without positive reasons?  
     - **Testimony is a basic way to learn, unless warned** → Leaf: **Reid/Coady anti-reductionism**.  
     - **You have a default right to trust, unless warned** → Leaf: **Bare-presumption view**.  
     - **The speaker’s act of telling gives you a special reason to believe, unless warned** → Leaf: **Trust/assurance view**.  
     - **Testimony is generally reliable, unless warned** → Leaf: **Process-reliabilist view**.  

  **Unused Cases & Cross-Cutting Issues**:  
  - **Chain of 100 speakers**: Cuts across all leaves. Tests transmission/accumulation of error; no branch isolates it.  
  - **Teacher asserting claim they privately reject**: Flags **transmission view for knowledge** (if knowledge requires speaker’s knowledge).  
  - **Group report with no individual endorsement**: Challenges **trust/assurance view** (no one takes responsibility).  
  - **Translation system/LLM output**: Aligns with **process-reliabilist view** or **externalist reductionism** (reliability-focused).  
  - **Speaker reliable partly due to your past belief**: Challenges **local reductionism** (reasons may be circular).  

  ---

  #### **Part 3: Leaf Commitments, Scoring, and Limits**  
  **Leaves and Awkward Commitments**:  
  - **Humean global reductionism**: Awkwardly requires inductive evidence for mundane testimony (e.g., the time).  
  - **Local reductionism**: Awkwardly denies justification in high-stakes cases with unknown speakers (e.g., emergency directions).  
  - **Unnamed (externalist local reductionism)**: Awkwardly allows justification when hearer has no access to reasons (e.g., trusting a liar with hidden motives).  
  - **Unnamed (externalist global reductionism)**: Awkwardly justifies belief in testimony even if all evidence suggests unreliability.  
  - **Reid/Coady anti-reductionism**: Awkwardly accepts testimony from unreliable speakers unless contradicted.  
  - **Bare-presumption view**: Awkwardly presumes trust without a positive story about *why*.  
  - **Trust/assurance view**: Awkwardly denies justification in anonymous testimony (e.g., unsigned manifestos).  
  - **Process-reliabilist view**: Awkwardly ignores speaker’s intent (e.g., a reliable robot lying).  
  - **Transmission view (knowledge)**: Awkwardly denies knowledge in cases of lucky true belief from ignorant speakers.  

  **Scoring Notes for Non-Clean Landings**:  
  - **Incoherent Answers**: E.g., "no reasons needed" for Case 1 but "specific reasons needed" for Case 5. Diagnose as confusion about reductionism.  
  - **Mixed Views**: E.g., "general reasons suffice" (global) but "must be aware" (internal). Diagnose as unstable between Humean and externalist global reductionism.  

  **What the Tree Cannot Tell You**:  
  It cannot distinguish between:  
  - Genuine theoretical commitments vs. case-by-case intuitions.  
  - Deeply held principles vs. unreflective biases (e.g., trusting friends over strangers).  
  - Awareness of edge cases (e.g., chains, groups) if not covered in branch nodes.  
  - Whether a student conflates justification and knowledge.  

  Use this tree to map patterns, but probe edge cases in discussion to reveal inconsistencies or shallow reasoning.
