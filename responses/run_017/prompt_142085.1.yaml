prompt: |-
  You are a professor of legislation and statutory interpretation who has spent years teaching textualism and purposivism and who is unusually good at building classroom hypotheticals. Please brainstorm several candidate scenarios before committing to one, discard the ones that cheat, and tell me in a sentence or two why you discarded them.

  I am writing a problem set for an upper-level Legislation seminar — 2Ls and 3Ls who have done the standard materials and have absorbed the usual cartoon: purposivism is the expansive method, textualism the cramping one. I need one self-contained fact pattern, realistic and one paragraph long (a state agency, a licensing board, a workplace, a hospital; no criminal prosecution, no science fiction), in which a textualist and a purposivist reach opposite results in the direction students find hard to build: the textualist has to read the statute more broadly and the purposivist more narrowly. I want them to feel the reversal rather than be told it, and I will cold-call on it for about twenty-five minutes.

  The constraints are where my own attempts have died, so let me name the failure modes. My first draft leaned on semantic drift — a term whose ordinary meaning had shifted between enactment and today — so everything turned on what "ordinary meaning at the time of enactment" means and both methods merely piggybacked on whichever answer was given. My second draft let the divergence collapse into a fight over whether an ambiguous word covered the case at all: the textualist said the ordinary meaning was broad, the purposivist said it was narrow, and the methodological disagreement was really lexicography in a costume. So please ensure that the operative words have a stable, uncontested ordinary meaning from enactment to the present, and that the divergence arises from what each method does with a text whose clear coverage extends past the statute's purpose — not from either side winning a semantic dispute. Additionally: a realistically drafted provision, no scrivener's errors, no antique or absurd terms, no classroom chestnuts; a thin and unhelpful legislative record with no smoking-gun committee report handing the purposivist the answer; no lenity doing any work; and an objective rather than psychological account of purpose — build it for a reasonable-legislator purposivism, then note in passing whether it survives the switch to an actual-enacting-coalition version.

  After the paragraph, show me the reasoning each method produces and the exact point at which they come apart; then give me a paired near-variant — same statute, one fact flipped — in which the two methods converge, so the students can see which single feature is load-bearing; then an honest note on what happens if that feature is removed, whether the case collapses back into an ordinary easy one, and which direction it collapses in; and finally the strongest attack a textualist would make on your pattern as rigged against them, together with how you would answer it.
reasoning: |-
  Okay, the user is a legislation professor who needs help creating a hypothetical for an upper-level seminar. They want a scenario where textualism leads to a broader interpretation and purposivism to a narrower one, reversing the usual student assumptions. The key constraints are avoiding semantic drift, ensuring stable ordinary meaning, and preventing the divergence from being just a lexicography dispute. 

  The user's past attempts failed—first by relying on semantic drift, making the methods piggyback on timing, and second by collapsing into a word-meaning debate. So the challenge is to create a situation where clear statutory language extends beyond the purpose, forcing textualists to cover more ground while purposivists narrow it based on intent.

  First, I need to brainstorm scenarios that fit. Licensing boards come to mind because their regulations often have clear language but specific purposes. For example, a state licensing board statute requiring "all licensed professionals" to report misconduct. The purpose is to ensure public safety, but the text is broad. What if a professional reports their own minor violation? Textualists might say "all" includes self-reporting, while purposivists might argue it's only for others' misconduct.

  Another idea: workplace safety regulations requiring "any fall hazard over 6 feet" to have guardrails. If a temporary platform at 5.5 feet is used in a risky way, textualists might focus on the height limit, while purposivists might look at the risk-based purpose. But does that turn on the definition of "fall hazard"? Need to avoid ambiguity in terms.

  Discarded ideas: 
  1. **"Vehicle" in a park statute**: If "vehicle" clearly includes e-bikes, but the purpose was to reduce noise, textualists might ban them while purposivists allow. But this risks semantic drift if e-bikes didn't exist when the law was made. Discarded because it leans on timing.
  2. **"Interrogation" requiring recording**: If an officer chats casually and gets a confession, textualists might say it's not interrogation, purposivists might say it is. But this could become a debate over what "interrogation" means. Discarded for being lexicography in disguise.
  3. **Hospital reporting of "infectious diseases"**: If a non-contagious condition is included, textualists might say yes, purposivists no. But if "infectious" has a stable meaning, this might work. Wait, is "infectious" contested? Possibly, so it might not be stable.

  The hospital reporting scenario seems promising. If the law requires reporting "all infectious diseases," and a non-contagious condition like tetanus arises, textualists might say tetanus is infectious (caused by bacteria), so report it. Purposivists might argue the purpose is to prevent outbreaks, so only contagious diseases matter. This avoids semantic issues if "infectious" is medically stable.

  But is tetanus infectious? Yes, but not contagious. The term is clear, so the divergence comes from purposivists limiting based on intent. The legislative record is thin—maybe the statute was passed after a measles outbreak, showing a contagion focus. This fits.

  Refining it: Statute requires reporting "any diagnosis of an infectious disease." Tetanus case: transmitted via spores, not person-to-person. Textualist says "infectious" covers it; purposivist says the purpose (outbreak control) excludes non-contagious diseases. 

  For the near-variant: Same statute, but measles—contagious. Both methods converge on reporting. The load-bearing fact is contagion.

  If contagion is removed, it collapses into an easy case where both agree if the disease is contagious. 

  Textualist attack: Purposivism is smuggling in unstated limits. Response: The purpose is objectively implicit in the statute's context (e.g., "reporting" implies urgency for contagion).

  This seems solid. The hospital example avoids the pitfalls and creates the reversal cleanly.
answer: |-
  Here's a self-contained fact pattern designed for your pedagogical goal, followed by the analytical breakdown:

  **Fact Pattern**  
  The State Public Health Act requires hospitals to immediately report "any diagnosis of an infectious disease" to the County Health Department. Section 12(d) imposes a $10,000 penalty for "[f]ailure to report any diagnosis within 24 hours." During a hospital accreditation inspection, it’s discovered that St. Helena Hospital diagnosed a construction worker with *tetanus* after he stepped on a rusty nail but did not report it. The Health Department fines the hospital. Tetanus is caused by *Clostridium tetani* spores entering wounds—medically defined as an "infectious disease" due to microbial invasion. However, tetanus is not *contagious*; it cannot spread between people. The Act’s sparse legislative history shows it was passed after a measles outbreak, with floor debates referencing "contagious threats" and "community spread," but the text never uses "contagious." The hospital challenges the fine.

  ---

  ### Reasoning & Divergence Point  
  - **Textualist Result:** **Broad reading → Fine upheld.**  
    *Reasoning:* "Infectious disease" has a stable, unambiguous medical meaning: any illness caused by pathogenic microorganisms. Tetanus fits this definition. The text says "any diagnosis," with no exceptions. Legislative intent cannot override clear language. The penalty clause ("failure to report any diagnosis") confirms comprehensiveness.  
  - **Purposivist Result:** **Narrow reading → Fine invalidated.**  
    *Reasoning:* The statute’s purpose is preventing *outbreaks* by enabling rapid containment. This is evident from the triggering measles crisis and debates about "community spread." Reporting non-contagious diseases (like tetanus) does nothing to advance this purpose. "Infectious" is thus implicitly limited to *contagious* diseases in context, as only those threaten public health.  

  **Divergence Point:** The methods split at **whether purpose can narrow textually clear language** when applying it to facts beyond the statute’s animating concern. Textualism applies the plain meaning; purposivism asks whether the *reason for the rule* covers the case.  

  ---

  ### Near-Variant (Convergence)  
  **Same statute, one fact flipped:** The hospital fails to report a measles diagnosis.  
  - **Textualist:** "Measles is an infectious disease → Report required."  
  - **Purposivist:** "Measles is contagious and fuels outbreaks → Core purpose demands reporting."  
  **Convergence:** Both uphold the fine. The **load-bearing feature** is *contagion*.  

  ---

  ### If Feature Removed  
  **Scenario collapse:** If tetanus *were* contagious (e.g., a hypothetical airborne strain), both methods converge on upholding the fine. The case becomes "easy" because textualism and purposivism align in the **broad direction** (coverage is uncontested).  

  ---

  ### Textualist Attack & Rebuttal  
  **Attack:** "This hypothetical rigs textualism by exploiting a *misalignment* between scientific and colloquial meaning. 'Infectious' *ordinarily* implies contagion to laypeople—the very legislators who voted. The 'medical definition' is elitist literalism. True ordinary meaning *at enactment* aligns with purpose!"  
  **Rebuttal:** "Textualism prioritizes *established technical meanings* in regulatory contexts (e.g., *FDA v. Brown & Williamson*). The statute governs *hospitals*—professionals using medical definitions. If legislators meant 'contagious,' they could have said so, as they did in other sections (e.g., Section 3(c)). Invoking 'ordinary lay meaning' here is unprincipled cherry-picking."  

  ---

  ### Notes  
  - **Actual-Coalition Purposivism:** If legislative records revealed the coalition cared *only* about childhood diseases (ignoring adult tetanus), purposivism might exclude tetanus even if contagious. This deepens the puzzle but isn’t needed for the core divergence.  
  - **Why This Works:**  
    - No semantic drift: "Infectious" is stable in medicine.  
    - No ambiguity fight: Both sides agree tetanus is "infectious" under standard definitions.  
    - Thin legislative record: Debates hint at purpose but don’t define key terms.  
    - Realistic gap: Regulators often overlook edge cases (non-contagious infections).  
    - Reversal achieved: Textualism compels broad application; purposivism narrows on policy grounds.  

  This forces students to confront textualism’s potential for *overinclusion* and purposivism’s role as a *limiting principle*—flipping their instincts while adhering to your constraints.
