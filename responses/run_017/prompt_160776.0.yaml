prompt: |-
  My mate does a history podcast, and at the end of every episode she does this bit where she rules on whether some non-human thing gets to be a *character* in the story or is just part of the *setting*. Her calls so far:

  - yellow fever killing most of Napoleon's expeditionary force in Saint-Domingue while barely touching the rebels — character
  - Tambora and the year without a summer, failed harvests and bread prices all over Europe — setting (its moved prices, not people)
  - mosquitoes in Panama: the French canal company collapses, the Americans get through once they drain and screen — character
  - the potato blight in Ireland — character
  - the Little Ice Age and all the wars and rebellions of the seventeenth century — setting (a trend isn't a who)
  - salt building up in the irrigated fields of ancient Mesopotamia — setting (that's just them doing it to themselves)
  - antibiotic resistance in hospitals since the mid twentieth century — character (it learns)

  The one she hasn't ruled on yet is myxomatosis, let loose on purpose in Australia in the 1950s to kill rabbits. It wiped out a huge share of them, then the virus got less lethal and the rabbits got more resistant, so the ending wasn't the one anybody planned. Character or setting?

  I sort of think she's asking whether a thing shifts the balance between the sides rather than just raising the cost for everyone, but I can see at least two other rules that fit her track record just as well, and they don't all say the same thing about the rabbit virus. Set out the rules that fit the seven calls above, say which one you'd bet she's actually running and why, give me your guess at her verdict, and name the case you'd want her to rule on next to tell the rules apart. One more thing: she keeps insisting that whatever she's doing, it isn't "environmental determinism" — does that constraint do any real work in her rule, or is it just a warning label she sticks on at the end?
reasoning: |-
  Okay, let me tackle this. The user's friend has a podcast where she decides if non-human things are "characters" or "setting" in history. There are seven examples given, and now they're stuck on myxomatosis in Australian rabbits. The user wants to figure out the underlying rules, predict the verdict, and test it with another case. Also, there's the mention of avoiding "environmental determinism."

  First, I need to analyze the existing rulings to find patterns. Let's list each case and see why it was classified as character or setting. 

  Yellow fever in Saint-Domingue: Character. It disproportionately affected Napoleon's forces, shifting power to the rebels. So, maybe it's about asymmetric impact.

  Tambora: Setting. It caused widespread issues like failed harvests but affected everyone similarly. No side gained an advantage; it just raised costs for all. So symmetric impact might be key.

  Mosquitoes in Panama: Character. French failed because of them, but Americans succeeded by controlling mosquitoes. So, it changed outcomes based on how different groups responded.

  Potato blight in Ireland: Character. Led to mass death and migration, altering history significantly. But why character here? Probably because it directly caused a dramatic shift rather than being a background condition.

  Little Ice Age: Setting. A slow trend causing various events, but not acting as an agent itself. The ruling mentions it's a trend, not a "who."

  Salt in Mesopotamia: Setting. Humans caused the problem through irrigation. So it's a consequence of their actions, not an external force acting on its own.

  Antibiotic resistance: Character. It "learns," meaning it evolves in response to human actions, creating an adaptive challenge.

  So possible rules:
  1. **Agency/Adaptation Rule**: Does the thing actively adapt or respond to human actions? Antibiotic resistance learns, mosquitoes were managed differently by Americans vs. French. Yellow fever and potato blight don't necessarily adapt, but they had asymmetric effects. 

  2. **Asymmetric Impact Rule**: Does it affect sides differently, changing power dynamics? Yellow fever hit Napoleon harder, mosquitoes hindered French but not Americans, potato blight devastated Ireland. Tambora affected everyone, so setting. Little Ice Age as a trend affected many but symmetrically. Salt buildup was self-inflicted, symmetric. Antibiotic resistance affects all, but its evolution creates asymmetric challenges over time.

  3. **Direct Causation vs. Enabling Conditions**: Does the thing directly cause change or just create conditions? Tambora enabled crises but didn't directly cause specific events. Salt buildup was a slow process, not a direct actor. Whereas yellow fever directly killed soldiers, shifting power.

  Now, myxomatosis: Introduced intentionally, wiped out rabbits, then virus became less lethal, rabbits resistant. So it adapted, and rabbits adapted back. Asymmetric? It was meant to control rabbits, which worked initially but then changed. The virus evolved, showing agency. Also, it shifted the balance—initially helped humans, then rabbits bounced back. So both adaptation and asymmetric impact.

  The user thinks it might be about shifting the balance rather than raising costs. That fits asymmetric impact. But antibiotic resistance is character because it learns, which is adaptation. 

  Which rule is she using? Looking at the track record, asymmetric impact fits most cases. Tambora affected everyone (setting), while yellow fever hit one side (character). But antibiotic resistance is character because it "learns," which is adaptive. So maybe both rules are in play, but adaptation might be secondary. 

  The friend denies environmental determinism, meaning she doesn't want the environment to be the sole driver of history. So her rule probably requires the non-human thing to interact with human choices, not determine outcomes unilaterally. In antibiotic resistance, humans overused antibiotics, causing the resistance. In salt buildup, it's humans mismanaging irrigation. So the constraint avoids determinism by emphasizing interaction. 

  For myxomatosis: Humans introduced it, virus evolved, rabbits adapted. Human agency is involved, and the virus adapted. So likely character. 

  Test case: Maybe something like the Dust Bowl. Human farming practices caused erosion, leading to disaster. Symmetric impact? Affected many farmers similarly. But if her rule is asymmetric, it might be setting. But if adaptation is key, the Dust Bowl didn't adapt; it was a consequence. So setting. Or a case like the Spanish Flu: affected different populations asymmetrically (e.g., young adults harder), but didn't adapt. Would it be character? If asymmetric impact is key, yes. But if adaptation is required, no. So that could distinguish the rules.
answer: |-
  Based on your mate's seven rulings and her rejection of "environmental determinism," here's a breakdown of the possible rules, my prediction for myxomatosis, and a test case to clarify her framework.

  ---

  ### **Three Rules That Fit the Seven Calls**
  1. **The Agency/Adaptation Rule**  
     *Character = The thing exhibits "active" behavior (adaptation, evolution, or targeted impact) that changes the game.*  
     - ✅ Yellow fever: Targets Napoleon's forces disproportionately (active impact).  
     - ❌ Tambora: Passive environmental event (no adaptation).  
     - ✅ Mosquitoes: Act as evolving adversaries; humans must adapt *to them*.  
     - ✅ Potato blight: Rapidly destroys a specific resource (potatoes), forcing mass migration.  
     - ❌ Little Ice Age: Slow, non-adaptive trend.  
     - ❌ Mesopotamian salt: Passive accumulation (no agency).  
     - ✅ Antibiotic resistance: Actively "learns" (evolves) against human efforts.  

  2. **The Asymmetric Impact Rule**  
     *Character = The thing shifts power dynamics by affecting one "side" more than others.*  
     - ✅ Yellow fever: Kills French troops but spares rebels → shifts balance.  
     - ❌ Tambora: Raises bread prices *equally* across Europe → no side gains advantage.  
     - ✅ Mosquitoes: Destroy French efforts but Americans overcome them → alters who wins.  
     - ✅ Potato blight: Devastates Irish peasants → reshapes demographics/politics.  
     - ❌ Little Ice Age: Causes widespread suffering → no specific beneficiary.  
     - ❌ Mesopotamian salt: Harms all farmers equally (self-inflicted).  
     - ✅ Antibiotic resistance: Favors resistant bacteria over humans → creates winners/losers.  

  3. **The Direct Causation vs. Enabling Conditions Rule**  
     *Character = The thing is the *direct cause* of major historical change; Setting = It merely enables existing forces.*  
     - ✅ Yellow fever: *Directly* causes French failure in Haiti.  
     - ❌ Tambora: *Enables* crises (e.g., famine) but doesn’t cause specific outcomes.  
     - ✅ Mosquitoes: *Directly* collapse French canal efforts.  
     - ✅ Potato blight: *Directly* triggers mass death/migration.  
     - ❌ Little Ice Age: *Enables* conflicts but isn’t the primary driver.  
     - ❌ Mesopotamian salt: *Enables* agricultural decline (slowly).  
     - ✅ Antibiotic resistance: *Directly* shapes modern medicine and pandemics.  

  ---

  ### **Which Rule Is She Likely Using?**  
  I'd bet **Rule 2 (Asymmetric Impact)** is her core logic.  
  - **Why?**  
    - It cleanly explains all seven rulings: Tambora, Little Ice Age, and salt buildup are "setting" because they raise costs *symmetrically*. The others are "character" because they *disproportionately* alter power (e.g., rebels gain, French lose, bacteria win).  
    - Her Tambora justification ("moved prices, not people") emphasizes *impartiality*, while antibiotic resistance ("it learns") implies a competitive dynamic with winners/losers.  
    - It aligns with your intuition about "shifting the balance between sides."  

  Rule 1 (Agency) and Rule 3 (Direct Causation) are *secondary*: Antibiotic resistance is ruled "character" for its adaptability (Rule 1), but yellow fever lacks evolution and still qualifies. Rule 3 struggles with salt buildup (directly caused decline but still "setting").  

  ---

  ### **Prediction for Myxomatosis**  
  **Verdict: Character**  
  - **Why?** It creates *asymmetric outcomes*:  
    - Initially, humans "win" (rabbits decimated).  
    - Then the virus evolves (less lethal) and rabbits develop resistance → rabbits "win" the adaptation arms race.  
    - Power shifts twice: Humans gain temporary control, then lose it to viral/rrabbit adaptation.  
  - Fits Rule 2: Not just "raising costs" (which would be symmetric) but changing who succeeds.  

  ---

  ### **Test Case to Distinguish the Rules**  
  **The Dust Bowl (1930s U.S.)**  
  - *Scenario:* Severe drought and dust storms devastate the Great Plains, forcing mass migration and reshaping agricultural policy.  
  - **How the Rules Diverge:**  
    - **Rule 2 (Asymmetric):** Likely *setting* if it affected all farmers equally. But if it disproportionately harmed small farmers (benefiting agribusiness), it could be *character*.  
    - **Rule 1 (Agency):** *Setting* – drought isn’t adaptive.  
    - **Rule 3 (Direct Causation):** *Character* – directly caused the Okie migration/New Deal policies.  
  - Her ruling would clarify if asymmetry (Rule 2) trumps direct causation (Rule 3).  

  ---

  ### **The "Environmental Determinism" Constraint**  
  This is **more than a warning label** – it actively shapes her rule.  
  - **How it works:** Her rejections of "trends" (Little Ice Age) and "self-inflicted" factors (salt) show she avoids framing non-human things as *inevitable* drivers of history. Instead:  
    - **Character** forces *interaction*: Humans must *respond* to a dynamic force (e.g., fighting mosquitoes, evolving antibiotics).  
    - **Setting** is static: Humans operate *within* it (e.g., high prices from Tambora), but it doesn’t "fight back."  
  - **Why it matters:** It prevents her rule from reducing history to "geography/disease made X happen." Myxomatosis isn’t determinism because humans *chose* to release it, and rabbits *adapted* – it’s a story of agency on all sides.  

  In short: **Her rule is "asymmetric impact with avoided determinism,"** where non-human things are "characters" only when they create winners/losers through interactive conflict. Myxomatosis fits perfectly.
