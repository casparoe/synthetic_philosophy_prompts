answer: |-
  ## Margin of Error at Dawn
  (a villanelle breaking its own refrain)

  The grey light lifts upon the dew-drenched lawn.
  Is certainty a thing the dawn bestows?
  **It is cold.**  
  A shiver says: move on.
  But knowledge waits where subtle changes spawn.
  One tenth of warmth, a minute comes and goes?
  The grey light lifts upon the dew-drenched lawn.

  **I know that it is cold.** The chill is drawn
  Around my bones. Yet how the margin grows!
  **It is cold.**  
  But doubt begins at dawn.
  *It seems like cold,* a safer ground to stand upon?
  That seeming, too, might shift as warming flows.
  The grey light lifts upon the dew-drenched lawn.

  **I know that I know that it is cold.** The fawn
  Stirs in the copse. The hesitant sun shows.
  **It is cold.**  
  But proof? It's almost gone.
  **I know that I know that I know that it is cold.** Beyond,
  The stacked claims falter as the warm wind blows.
  The grey light lifts upon the dew-drenched lawn.
  **It is cold.**  
  **I know that I know that I know that I know that it is cold.**

  ---

  ### What the form is doing

  This villanelle breaks its core rule: the second refrain grows, stacking "I know that" with each recurrence while preserving the final word ("cold") for rhyme. This directly enacts Williamson's argument: the margin-for-error principle dictates that for me to *know* I'm in a state (feeling cold), I must not be near the boundary where that state fails. Applying this iteratively (to know *that* I know) demands an even larger margin. Each "I know that" prefix requires an exponentially wider buffer zone against error, making the claim unsustainable as conditions subtly shift.

  The break lands decisively in the final couplet (lines 18-19). The simple, true claim "It is cold" stands starkly beside the absurdly stacked "I know that I know that I know that I know that it is cold" – a demand for impossible, infinite margins now visibly mismatched with the gradual, tenth-degree creep of reality. Line 17 ("The stacked claims falter as the warm wind blows") signals the collapse. Someone familiar with Williamson would point to this final couplet as the structural and conceptual rupture: the form itself demonstrates why luminosity (infallible self-knowledge of specific states) fails under iterated knowledge demands, even while simple knowledge remains intact in clearer cases. The "seems cold" retreat (line 10) highlights the changed subject – luminosity about *appearance* doesn't secure knowledge about the *world*.
