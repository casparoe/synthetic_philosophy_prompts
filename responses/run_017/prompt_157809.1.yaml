   The procedure will have the following steps:

   Step 1: Define the Project Scope Clearly and Concisely
     - The project lead must write down the project's key deliverables and the core technical tasks in a bullet-point list.
     - Adequate: A list that is specific enough that if an item is missing, it would be a scope change.
