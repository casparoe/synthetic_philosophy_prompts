answer: |-
  Below is a step-by-step fixed-price bidding procedure designed for your constraints. It focuses on preventing reference class gerrymandering, enforcing epistemic modesty, and making clear "go/no-go" decisions. The procedure uses **plain-language checks** instead of formulas and includes a built-in "second-order" step to validate reference classes. Total runtime is ~30 minutes.

  ---

  ### Fixed-Price Bid Evaluation Procedure (for Project Leads)
  **Goal:** Determine if a fixed-price bid is viable and define a defensible range. If not, decline or escalate.  
  **Time:** 30 mins max.  
  **Tools Needed:** Historical project data (task durations, outcomes), 3x5 index card (or digital equivalent) for forced brevity.  
  **Critical Rule:** If any step can't be answered in 2 mins, skip to "Stop/Handoff" outcome.

  #### **Step 1: Define Scope in Concrete Terms**  
  **Action:** List the 3–5 core technical tasks (e.g., "Build API endpoint X," "Migrate dataset Y"). No vague terms like "research" or "explore."  
  **Adequate Answer:** Tasks are specific, measurable, and match the client’s written requirements.  
  **Stop/Handoff:**  
  - ➜ **Stop** if tasks are undefined (e.g., client says "we’ll figure it out later").  
  - ➜ **Handoff to Partner** if scope involves strategic concessions (e.g., "biggest client insists we start now").

  #### **Step 2: Reference Class Selection (First Pass)**  
  **Action:** Find 3+ past projects with the **same core tasks** (e.g., "data migrations," "CRM integrations"). Ignore circumstantial details (e.g., "client had staging env").  
  **Adequate Answer:** Projects share ≥70% of tasks from Step 1. Include 1–2 sentences on differences.  
  **Stop/Handoff:**  
  - ➜ **Stop** if <3 matches exist. Proceed to Step 4 (no reference class).  
  - ➜ **Handoff to Partner** if projects are >3 years old or used obsolete tech.

  #### **Step 3: Second-Order Reference Check**  
  **Action:** Ask: "When we used a reference class like this, how often were we **wildly wrong**?"  
  - "Wildly wrong" = Actual effort exceeded estimate by >40%.  
  - Use historical data or team memory (no stats needed).  
  **Adequate Answer:**  
  - "We’ve used similar classes [X] times. [Y] were wildly wrong."  
  - If no history: "No track record for this class."  
  **Stop/Handoff:**  
  - ➜ **Stop** if >50% of past similar estimates were wildly wrong (e.g., 2/4 projects).  
  - ➜ **Widen reference class** (remove 1–2 criteria) and redo Step 2. If still stuck, proceed to Step 4.

  #### **Step 4: Effort Range (Outside View)**  
  **Action A (Reference class exists):**  
  - Base effort = **Median effort** of reference projects (e.g., if efforts were [2w, 3w, 5w], median=3w).  
  - Range = **Lowest** to **highest effort** in reference set.  
  - **Adjustment cap:** Never narrow the range by >20%.  

  **Action B (No reference class):**  
  - Break project into tasks from Step 1.  
  - For each task:  
    - If done before, use **min/max effort** from past 3 instances.  
    - If novel, effort range = **"2 weeks" to "6 weeks"** (or "1 sprint" to "3 sprints"). Defaults avoid overconfidence.  
  - Base effort = Sum of task midpoints. Range = Sum of min/max efforts.  

  **Adequate Answer:** Range accounts for unknowns (e.g., "Schema docs help, but we’ve seen legacy data surprises").  
  **No stops here**—proceed to Step 5.

  #### **Step 5: Inside View Adjustment**  
  **Action:** Adjust base effort only if:  
  - You have **evidence** (e.g., "Client’s docs saved 20% in 2 past projects").  
  - Adjustment is **≤±20%** of base.  
  **Do NOT adjust** for:  
  - "This feels easier."  
  - "The client is nice."  
  - "We’re smarter now."  
  **Adequate Answer:** "We adjust base by [X]% because [evidence]."  
  **Stop/Handoff:** ➜ **Handoff to Partner** if adjustment relies on strategic factors (e.g., "We’ll lose the client if we don’t cut 30%").

  #### **Step 6: Final Viability Check**  
  **Action:** Calculate:  
  - **Range width** = (High effort - Low effort) / Base effort.  
  - **Is this a "must-win" project?** (e.g., strategic client, market entry).  
  **Decision Rules:**  
  - If range width **>1.0** (e.g., base=4w, range=2w–10w → width=2.0):  
    - ➜ **Decline fixed-price** (too risky).  
  - If range width **0.5–1.0**:  
    - ➜ **Bid at high effort** (e.g., if base=4w, range=3w–7w, bid 7w).  
  - If range width **<0.5** and not "must-win":  
    - ➜ **Bid at base effort**.  
  - If "must-win" project:  
    - ➜ **Handoff to Partner** (business risk decision).  

  **Output:** Bid amount, decline, or escalation. Document rationale on index card.

  ---

  ### Case Studies
  #### **Case 1: Data Migration (Documented Schema)**  
  - **Step 1:** Tasks = Extract data, transform schemas, validate output. Clear scope. ✔️  
  - **Step 2:** Reference class = 6 past migrations. Lead claims "different," but core tasks match. ✔️  
  - **Step 3:** Past estimates for migrations had 1/6 "wildly wrong" (low risk). ✔️  
  - **Step 4:** Efforts = [3w, 3w, 4w, 4w, 5w, 6w] → Base=4w, Range=3w–6w.  
  - **Step 5:** Adjust: "-20% for docs" (past evidence). Base → 3.2w, Range → 2.4w–4.8w.  
  - **Step 6:** Range width=(4.8–2.4)/3.2≈0.75 → Bid at **high effort (4.8w ≈ 5 weeks)**.  
  **VERDICT: Bid 5 weeks**  

  #### **Case 2: LLM Support Triage Tool (New Project)**  
  - **Step 1:** Tasks = Setup LLM API, fine-tune model, integrate with support ticket system. ✔️  
  - **Step 2:** No reference class (never done this). ➜ **Stop**, proceed to Step 4.  
  - **Step 4:** Novel tasks:  
    - Setup LLM: 2–6w  
    - Fine-tune: 3–9w  
    - Integration: 2–6w  
    Base = (2+3+2)=7w, Range = (2+3+2) to (6+9+6)=7w–21w.  
  - **Step 5:** No adjustments (no evidence for LLM work).  
  - **Step 6:** Range width=(21–7)/7=2.0 (>1.0) → **Decline fixed-price**.  
  **VERDICT: Decline fixed-price**  

  #### **Case 3: "Quick" Integration for Biggest Client**  
  - **Step 1:** Tasks = Connect CRM to project tool via API. Scope clear. ✔️  
  - **Step 2:** Reference class = 5 past integrations. Efforts = [1w, 1w, 2w, 3w, 3w]. ✔️  
  - **Step 3:** 0/5 wildly wrong historically. ✔️  
  - **Step 4:** Base=2w, Range=1w–3w.  
  - **Step 5:** Lead says "faster due to docs," but no evidence → **No adjustment**.  
  - **Step 6:** Range width=(3–1)/2=1.0 → Bid at **high effort (3w)**. But client expects 2w and is "must-win" → **Handoff to Partner**.  
  **VERDICT: Escalate to partner**  

  ---

  ### Limitations and Failure Modes  
  - **What it can’t do:**  
    - Predict client-induced scope changes (the #1 cause of overruns).  
    - Handle projects where >50% of tasks are novel (always high-risk).  
    - Replace governance (e.g., partners must enforce procedure adherence).  
  - **Where it misfires:**  
    - If historical data is missing/inaccurate (garbage in, garbage out).  
    - If leads skip Step 3 ("second-order check") and cherry-pick references.  
  - **Judgment calls dressed as steps:**  
    - Step 3 (validating reference classes) relies on honest recall.  
    - Step 5 (adjustments) assumes evidence is rigorous (e.g., not a one-off).  

