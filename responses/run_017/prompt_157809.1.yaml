   Step 2: Identify a Reference Class (First Pass)
     - Look for past projects that are similar in terms of:
          a) Technology stack
          b) Type of work (e.g., data migration, new feature, integration)
          c) Client environment (e.g., complexity of existing systems, documentation level)
     - The lead must list at least 3 past projects that are in the same category. If fewer than 3, then note that the reference class is small or non-existent.
     - Adequate: A list of projects with notes on why they are similar and any key differences.

   Step 3: Second-Order Reference Class Check (to combat gerrymandering)
     - Ask: "In the past, when we have chosen a reference class like this (i.e., with similar defining characteristics), how often have the actual project durations fallen within the range we predicted from that class?"
     - If there is no track record of using such reference classes (or if the lead doesn't remember), then we must consider that the reference class might not be predictive.
     - Steps:
          a) The lead must note how many times they (or the team) have used a reference class with similar characteristics (e.g., "we used a reference class for Rails upgrades with staging env 4 times").
          b) For those past reference class predictions, what was the accuracy? (e.g., "2 out of 4 were within the range, one was 20% over, one was 50% over").
          c) If there is no history (or the history shows poor accuracy), then the reference class is considered weak.
     - Adequate: A note on the historical accuracy of similar reference class selections, or a note that there is no history.
     - Stop condition: If the reference class is weak (less than 3 data points OR less than 50% of past predictions in the class were within a 30% margin of error), then we must either:
          - Widen the reference class (by removing one or two of the more specific criteria) and redo Steps 2 and 3, OR
