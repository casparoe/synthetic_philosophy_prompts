answer: |-
  ### 1. Exam Question (197 words)
  **Question:** Using the case of the "Meridian Trace" (a complete, undisputed digital record of events in 2031), critically evaluate the claim that historical objectivity is impossible because two historians produced incompatible interpretations ("tragedy" vs. "farce") using identical facts. In your answer:  
  (a) Precisely locate the source of their disagreement, clarifying what *is not* disputed.  
  (b) Distinguish at least three distinct ways "objectivity" could be understood in this context.  
  (c) Assess whether the dispute between the tragedy and farce accounts is resolvable by evidence. If not, does this entail that history is indistinguishable from fiction?  
  (d) Explain what a defender of historical objectivity must concede and what a narrativist sceptic (e.g., White) must concede for this disagreement to be substantive rather than trivial.  
  *Base your argument solely on the Meridian case and conceptual tools from the course. Do not rehearse generic critiques of Ranke, Carr, or White.*

  ---

  ### 2. Model Answer (875 words)  
  The Meridian Trace—a complete, verified record of events—seems to promise perfect historical objectivity. Yet two historians generate diametrically opposed narratives ("tragedy" vs. "farce") from identical facts. This reveals not the impossibility of objectivity, but its layered nature. The core disagreement lies **not in factual accuracy** (both accept every trace datum), but in the *framing choices* that transform facts into meaning: the selection of temporal scope (one week vs. a decade), the unit of agency (nation-state vs. supply network), and the criteria for significance (moral dilemmas vs. bureaucratic ineptitude). These choices structure the "emplotment" (White) that gives events coherence.  

  **Three Construals of Objectivity Yield Different Verdicts:**  
  1. **Correspondence to the Trace:** If objectivity means mirroring the trace’s content, only the paratactic chronology succeeds. The tragedy and farce accounts both "add" interpretation, failing this strict standard. Yet this construal conflates objectivity with reproduction—an impossible and sterile ideal, as even the chronology imposes order through linear sequencing.  
  2. **Procedural Impartiality:** Objectivity as methodologically reproducible selection. Both historians followed defensible protocols: identifying patterns in data, cross-referencing logs, avoiding fabrication. By these rules, *both* accounts are objective—but this cannot explain their incompatibility.  
  3. **Carr’s Relational Objectivity:** Objectivity as contextual relevance. Facts become "historical" only when answering questions posed by the present. Here, objectivity resides in how well interpretations explain the trace *as a whole*. The tragedy account objectively highlights moral conflicts ignored by the farce, while the farce objectively exposes systemic failures the tragedy downplays. Neither monopolizes truth; both illuminate constrained aspects of the trace.  

  **Is the Dispute Truth-Apt?**  
  Yes—but not by appealing to "bare facts." The dispute concerns the *weight* and *connection* of facts within a chosen frame. The tragedy’s claim that "the commander faced irreconcilable duties" and the farce’s claim that "vanity overrode contingency planning" are testable against the trace:  
  - Did the commander acknowledge conflicting orders? (Trace: yes → supports tragedy)  
  - Were logistics experts overruled for personal reasons? (Trace: yes → supports farce)  
  Neither account is falsified, but **evidence constrains interpretation**: an emplotment ignoring *all* logistical errors could not be tragic, just as one ignoring *all* ethical tensions could not be farcical. The trace excludes incoherent plots (e.g., a heroic triumph), but underdetermines which *valid* plot (tragedy, farce, or another) best explains the data within a given frame.  

  **Objectivity vs. Fiction: The Asymmetry of Constraint**  
  The residue of constraint—evidence excluding some narratives—suffices to distinguish history from fiction. Fiction faces no such trace: inventing a traitor or external sabotage would violate Meridian’s evidentiary bounds. History’s objectivity lies in this **negative capability**: the trace determines what *cannot* be said, not what *must* be said. The fourth historian’s critique reinforces this: shifting frame (to supply networks/decade) might generate a third valid narrative (e.g., "institutional decay"), but it too must honour the trace’s prohibitions.  

  **Concessions for Substance:**  
  - A **defender of objectivity** must concede that no single "objective" narrative exists. Framing choices (period, agency, theme) are perspectival and value-laden. Objectivity emerges in how interpretations respect evidence and answer coherent questions—not in transcending perspective.  
  - A **White-style sceptic** must concede that not all emplotments are equally valid. The trace *rules out* narratives (e.g., "withdrawal was flawless") that contradict its data. Denying this constraint collapses history into fiction.  

  **Conclusion:**  
  The Meridian case refutes naïve objectivity (Ranke’s ideal of recovering the past "as it essentially was") but not objectivity *tout court*. Objectivity resides in evidence acting as a scaffold: it supports multiple structures but cannot tolerate all. The tragedy/farce dispute is substantive because it reflects competing, evidence-compatible emphases on facets of human experience—both objectively present in the trace but requiring narrative form to become meaningful history. Carr’s insight holds: facts are not objective until put to work; but White is wrong that the past has *no* inherent structure—it has structures *plural*, revealed through contested but constrained interpretation.

  ---

  ### 3. Marking Scheme (20 marks total)  
  **Award 4 marks per move for:**  
  - **Precise location of disagreement**  
    - *First-class:* Identifies framing choices (temporal scope/agency unit/theme) as the dispute’s core, contrasting with factual agreement.  
    - *Mediocre:* Vaguely references "interpretation" without specifying framing, or conflates with factual disagreement.  

  - **Distinction of objectivity construals**  
    - *First-class:* Clearly defines ≥3 types (e.g., trace-correspondence/procedural/Carr’s relational), showing how each judges Meridian accounts differently.  
    - *Mediocre:* Lists labels without defining operational differences or applies them generically (not Meridian-specific).  

  - **Analysis of constraint vs. determination**  
    - *First-class:* Explains how trace *excludes* some emplots (e.g., heroic triumph) while *underdetermining* others (tragedy/farce), linking to history/fiction distinction.  
    - *Mediocre:* Asserts evidence "allows multiple views" without specifying exclusions or asymmetry.  

  - **Truth-aptness resolution**  
    - *First-class:* Argues for truth-aptness via evidence-constrained weighting of facts *within a frame*, with concrete Meridian examples (e.g., orders/logs).  
    - *Mediocre:* Only asserts "yes" (objectivist) or "no" (sceptic) without engaging trace constraints.  

  - **Concessions for substantive dispute**  
    - *First-class:* Specific trade-offs: objectivist cedes single narrative; sceptic cedes unlimited emplotment freedom. Ties to trace’s role.  
    - *Mediocre:* Generic concessions (e.g., "both sides have points") without Meridian application or stakes.  

  **Word Limit Note:** Candidates exceeding 900 words penalize clarity. Award marks only for arguments present—not volume.
