answer: |-
  ### Your number  
  **0.4.** The distinction fails independent work if moral weight *only* comes from intentions, causation, outcomes, or psychological biases—not the act/omission distinction itself.  

  ### The breakdown  
  1. **Does the distinction exist beyond intentions, causation, and outcomes?**  
     *Prob: 0.85*  
     Justification: Intentions are identical; causation is symmetric (one press = same causal role); outcomes are identical. Yet the acts *feel* different, suggesting a residual distinction.  

  2. **Does it survive under engineered symmetry?**  
     *Prob: 0.5*  
     Justification: When defaults are arbitrary (an engineer’s choice), flipping them *should* neutralize moral differences if the distinction is superficial—yet intuitions often resist this.  

  3. **Do ordinary/legal judgments track it for good reasons?**  
     *Prob: 0.6*  
     Justification: Law uses "defaults" for practicality (e.g., defining duties), but this may codify bias, not moral truth.  

  4. **Is "default state" a morally relevant fact?**  
     *Prob: 0.3*  
     Justification: Defaults reflect human convenience or statistical norms, not intrinsic moral properties—e.g., a machine’s "on/off" state lacks ethical weight without context.  

  ### How it adds up  
  The probabilities multiply (0.85 × 0.5 × 0.6 × 0.3 ≈ 0.08), but this undersells the distinction’s intuitive pull. I weight the first three factors higher due to persistent philosophical/psychological evidence (e.g., omission bias studies), then discount heavily for the arbitrariness of defaults (factor 4). Net: **0.4**.  

  ### What would move you most  
  **Factor 4 (defaults as moral facts) is least certain (Prob 0.3).** Shift it with evidence that moral intuitions *vanish* when defaults are explicitly randomized (e.g., experiments showing 50/50 moral splits in symmetric cases). You and your friend likely disagree most on factor 2: you see the symmetry as exposing the distinction’s fragility (↓ prob), while your friend sees it as destroying its legitimacy entirely (↓↓ prob).  

  *(P.S. Tell your friend a rando on the internet says: "If the machine’s default setting is a moral compass, I’m switching careers to engineering.")*
