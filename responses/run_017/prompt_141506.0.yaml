prompt: |-
  hey — I'm writing the final for my upper-level value theory seminar (third/fourth year, they've done Bentham, Mill and a bit of Sidgwick, plus two recent papers on what pleasure actually is) and I want one long essay question on the heterogeneity problem for hedonism. The thing I keep getting in their essays is: heterogeneity gets raised, Mill's move about quality of pleasures gets wheeled out, and then they stop. I want a question where that answer gets a B at best.

  Roughly, I want them forced to do three things: say precisely what the heterogeneity problem is a problem *for* (is it a problem about what pleasure is, or about why pleasure is good, or about whether "maximize pleasure" is even a usable decision procedure?); handle the two cases below, which I made up so that the standard moves come apart; and then take a stand on whether hedonism survives and what it would have to give up.

  I'm also giving them a label to work with, "the one-lever requirement." Define it in the question as: hedonism is supposed to hand you a single scale — one lever — such that (a) any two options can be ranked on it, (b) there's a common unit, and (c) the ranking is fixed by hedonic facts and nothing else. The question should make them say which of those three the heterogeneity worry actually threatens and which one the hedonist could give up and still count as a hedonist.

  Two cases, use these (or better versions if you see the point):

  Case 1, "the swap." Priya's experience of finishing a hard proof has exactly the felt bodily character your itch-scratch has for you — the tingle, the warmth, the located relief — while her itch-scratch has the quiet, almost featureless "yes, go on" character that finishing a proof normally has for the rest of us. So the felt quality and the activity have come apart. Ask them: which of Priya's two experiences is more pleasant? Whatever they say, make them show the cost. If pleasantness travels with the felt quality, the intellectual pleasure is pleasant only by accident and the paradigmatically "higher" pleasures are just vehicles for a bodily tingle, so Mill's ranking is in trouble. If pleasantness stays with the activity and the attitude, then what-it's-like is doing no work, hedonism starts to look like a desire or activity theory wearing a hedonic mask, and the thing that made hedonism attractive in the first place — that the goodness of pleasure is somehow evident from the inside — drains out.

  Case 2, "the split judges." Two people who have lived through both lives — one mostly bodily and athletic, one mostly scholarly — disagree, stably and with no identifiable error (no misinformation, no distraction, no weakness of will, nobody is self-deceived) about which life contained more pleasure. Neither can be shown to be making a mistake. Ask: is there a fact of the matter about which life had more? If yes, what makes it true, given that the only evidence there is — how it felt from the inside — comes out opposed? If no, then the aggregation that utilitarianism runs on has no unit, and the hedonist has to either posit a hidden common currency and say how we'd ever detect it, or admit that "amount of pleasure" isn't a quantity but only an ordering relative to a judge.

  So, what I need from you:

  1. The essay question itself, worded for students, with the one-lever requirement and both cases built in, and a note of how long they've got (three hours, and this is one of four questions, so they should be able to do it in about 45 minutes). Assume they have no texts in the room — so no quotation marks from Mill or anyone else, no citations, nothing that requires having a book open. It should be answerable from what came up in seminar plus their own head.

  2. A model answer of about 700 words. Please make it committed — not an endless "the hedonist might reply… and then the objector…" ping-pong. Pick the strongest line and run it, and let it be seen to have a cost.

  3. A marking scheme out of 20, built around five must-hit points with the marks each is worth, plus a one-line note on how students typically get each one wrong. And please say explicitly what separates an A from a B, naming the specific move each has to contain. My rough sense is that a B answer notices the circularity in the competent-judge move; an A answer says what a *non*-circular version of the quality move would even have to look like and what it would cost the theory.

  One more thing: flag anywhere the model answer quietly helps itself to something I probably haven't taught them (technical formal stuff, a distinction from a paper I haven't assigned). And give me a one-line hint I could write on the board if half the room freezes.

  oh — and please don't let the question collapse heterogeneity into incommensurability, or into the mere claim that pleasures have no common sensory feel. I want them to see that pleasures might share a non-sensory property (a functional role, an attitude taken toward them, being the unimpeded exercise of an activity) and that conceding that is a different concession with different costs. If your question can't be answered by someone who's memorized "quantity versus quality," we're good.
reasoning: |-
  Okay, the user is teaching an upper-level value theory seminar and needs to craft a final exam essay question on the heterogeneity problem for hedonism. They’re frustrated with students stopping at Mill’s quality/quantity move and want a question that pushes deeper.  

  First, let’s unpack their goals:  
  - **Force precision**: Students must identify what aspect of hedonism heterogeneity threatens (the theory’s foundation, the good-making property, or practical applicability).  
  - **Handle two novel cases**: "The Swap" (disconnecting felt quality from activity) and "Split Judges" (irreconcilable pleasure assessments). Both are designed to break standard Millian responses.  
  - **Engage the "one-lever requirement"**: A defined term emphasizing hedonism’s need for a single, objective, non-arbitrary scale. Students must analyze which parts (comparability, common unit, hedonic determinacy) are vulnerable.  
  - **Demand a stance**: Does hedonism survive? What concessions would gut its core appeal?  

  Key constraints:  
  - Exam setting (3hrs total, 45min for this), closed-book, no citations.  
  - Avoid conflating heterogeneity with incommensurability or sensory differences.  
  - Model answer must be decisive, not wishy-washy.  
  - Marking scheme needs clear differentiators: B answers spot circularity in competent judges; A answers articulate what a non-circular quality theory would require and its costs.  

  **Dissecting the cases**:  
  - *The Swap*: Attacks the link between phenomenology and pleasure’s value. If pleasure = felt quality, Mill’s hierarchy collapses; if pleasure = activity-type, hedonism becomes desire theory in disguise.  
  - *Split Judges*: Challenges intersubjective comparability. If no fact of the matter, aggregation fails—utilitarianism crumbles without a common currency.  

  **Model answer strategy**:  
  I’ll argue hedonism must abandon the "one-lever" ideal to survive. The strongest path:  
  1. Concede phenomenology isn’t pleasure’s essence—adopt an attitude-based view (e.g., liking or desire-satisfaction).  
  2. But this dissolves hedonism’s experiential appeal. The cost: pleasure’s normative authority now depends on contingent attitudes, not intrinsic feel.  
  3. For *Split Judges*, bite the bullet—no objective fact exists. Hedonism becomes relativized to agents, sabotaging impartial aggregation.  

  **Marking scheme traps**:  
  Common failures:  
  - Vagueness on what heterogeneity threatens (e.g., just "it’s a problem").  
  - Treating cases separately without linking to the one-lever framework.  
  - Ignoring that conceding functional properties alters hedonism fundamentally.  

  **A vs. B differentiation**:  
  - B answer: Notes competent-judge circularity (Mill defines good judges by preference, preference by goodness).  
  - A answer: Explains that a non-circular quality theory needs an independent criterion (e.g., Aristotelian flourishing)—but then pleasure isn’t the sole good, betraying hedonism.  

  **Execution tweaks**:  
  - Question wording must prevent "quantity vs. quality" regurgitation. Specify: "Do *not* merely contrast Mill with Bentham."  
  - Model answer’s attitude move might be slightly beyond syllabus—flag it and provide a whiteboard hint: "If pleasure isn’t a feeling, what is it?"  
  - Emphasize that "felt quality" and "activity-type" are distinct axes to avoid sensory reductionism.
answer: |-
  ### 1. Essay Question  
  **Time Allotment:** 45 minutes (this is one of four questions in a 3-hour exam)  
  **Instructions:** Answer the following in a continuous essay. Do not merely summarize readings; engage the conceptual problems. Assume no texts are available.  

  > **Hedonism claims that pleasure is the sole intrinsic good and that we ought to maximize net pleasure. Critics argue that pleasures are *heterogeneous*—they differ radically in kind (e.g., the pleasure of solving a math problem vs. scratching an itch). This raises the "heterogeneity problem."**  
  >  
  > **Define the "one-lever requirement" for hedonism: it must provide a *single scale* such that (a) any two options can be ranked, (b) there is a common unit of measurement, and (c) the ranking depends *only* on hedonic facts (not moral/practical ones).**  
  >  
  > **Your tasks:**  
  > 1. Precisely state what the heterogeneity problem threatens: Is it a problem about *what pleasure is*, about *why pleasure is good*, or about whether "maximize pleasure" is a *usable decision procedure*?  
  > 2. Analyze **both** cases below. For each, show why standard hedonist replies (e.g., appealing to "quality" of pleasures) fail or incur serious costs:  
  >    - **Case 1: The Swap.** Priya experiences the bodily sensation of scratching an itch (tingling warmth) when she finishes a complex mathematical proof. Conversely, she experiences the calm satisfaction of intellectual accomplishment when scratching an itch. *Question:* Which experience is more pleasant? Explain the dilemma for hedonism.  
  >    - **Case 2: The Split Judges.** Two people, one who lived an athletic life and one a scholarly life, stably disagree about which life contained more pleasure. Both are fully informed, rational, and free from bias. *Question:* Is there a fact about which life had more pleasure? If not, what does this imply for utilitarianism?  
  > 3. Conclude: Can hedonism survive heterogeneity? If so, which part(s) of the one-lever requirement (a/b/c) must it abandon—and does this cost undermine hedonism’s core appeal?  

  ---

  ### 2. Model Answer (710 words)  
  **Thesis:** Hedonism can technically survive heterogeneity only by abandoning the *common unit* (b) and *hedonic determinacy* (c) of the one-lever requirement—but this reduces it to a relativized desire theory, gutting its normative force.  

  **What Heterogeneity Threatens:** The problem targets hedonism’s *decision procedure* and *foundations*. If pleasures share no common property, we cannot rank options (violating (a)/(b)). Worse, if "pleasure" isn’t a unified natural kind, its status as the *sole good* becomes arbitrary (threatening why it’s good). Hedonism assumes pleasure is both *measurable* and *self-evidently valuable*; heterogeneity fractures both.  

  **Case 1: The Swap** exposes a fatal choice. *Option 1:* Pleasantness tracks *felt quality*. Priya’s proof-finishing is more pleasant iff it has the itch-scratch sensation. But then Mill’s "higher pleasures" are contingent: if intellectual activities feel like bodily tingles, they’re "higher" only by sensory accident. Hedonism loses its claim that certain activities are intrinsically better—undermining Mill’s quality hierarchy. *Option 2:* Pleasantness tracks *activity-type*. Priya’s proof-finishing is more pleasant because it’s intellectual, regardless of sensation. But then phenomenology does no work; hedonism becomes an activity theory. The "good" of pleasure is no longer accessible from the first-person perspective (e.g., we might "like" an activity without feeling pleasure). This severs pleasure’s intuitive link to felt goodness—the very feature that made hedonism attractive. Either way, one-lever component (c) (ranking fixed *only* by hedonic facts) fails: we must appeal to non-hedonic properties (activity-types or sensations) to break ties.  

  **Case 2: The Split Judges** shows that without a common unit (b), aggregation collapses. If equally competent judges irreconcilably disagree about which life had more pleasure, hedonists face a dilemma. *Option 1:* Claim there *is* a fact of the matter (e.g., a hidden neurological "currency"). But this posits an undetectable property, making pleasure epistemically inaccessible. How can we maximize what we cannot measure? *Option 2:* Accept no fact exists—pleasure amounts are judge-relative. Then "maximize total pleasure" lacks content; we can only rank options *for a single person*. Utilitarianism’s impartial aggregation (e.g., summing pleasure across persons) becomes impossible without intersubjective comparability. Component (a) (universal ranking) is now unattainable.  

  **Can Hedonism Survive?** Only by retreating to a minimalist position: abandon (b) and (c), keeping only (a) *relative to agents*. We might define pleasure as "whatever satisfies pro-attitudes," allowing each person to rank their options. But this surrenders hedonism’s essence. First, it cannot explain *why* pleasure is good—the "good" reduces to contingent desires, not an experiential property. Second, it collapses into desire-satisfaction theory, making "pleasure" a redundant label. Finally, utilitarianism cannot function: if my "units" of pleasure are incomparable to yours, we cannot calculate the greater good. The theory loses its practical and normative bite.  

  Hedonism’s core appeal was its simplicity and intuitive grounding in experience. Heterogeneity forces it into a choice: either posit an implausible common property (e.g., a neural signal) and violate empiricism, or relativize and become a toothless shadow of itself. It cannot have its lever intact.  

  ---

  ### 3. Marking Scheme (Total: 20 points)  
  **Must-hit points (Aim for clarity & depth; avoid summary):**  
  1. **Define heterogeneity’s target** (4 pts):  
     - Full marks: Explicitly states it threatens the *decision procedure* (measurability) AND foundations (pleasure’s status as sole good).  
     - Typical error: Vague claims like "pleasures are different" without specifying *why* this matters for hedonism.  

  2. **Analyze The Swap’s dilemma** (5 pts):  
     - Full marks: Shows *both* options (pleasantness = sensation OR activity) and explains the cost of each (e.g., losing Mill’s hierarchy OR severing pleasure from phenomenology).  
     - Typical error: Only discusses one option; misses that abandoning phenomenology undermines hedonism’s experiential appeal.  

  3. **Analyze Split Judges’ dilemma** (5 pts):  
     - Full marks: Argues that denying a fact of the matter destroys aggregation (b), while positing one makes pleasure epistemically inaccessible.  
     - Typical error: Assumes disagreement implies ignorance/mistake; misses the implication for interpersonal comparison.  

  4. **Link cases to one-lever requirement** (3 pts):  
     - Full marks: Identifies which components (a/b/c) each case threatens (e.g., Swap threatens (c), Split Judges threatens (a)/(b)).  
     - Typical error: Treats cases in isolation without referencing the one-lever framework.  

  5. **Take a stand on survival + cost** (3 pts):  
     - Full marks: States hedonism must abandon (b) and/or (c), explaining how this guts its normative force (e.g., becomes desire theory).  
     - Typical error: Claims hedonism survives unscathed or collapses entirely without nuance.  

  **A vs. B Differentiation:**  
  - **B-grade answer (14–16/20):**  
    - Spots the circularity in Mill’s "competent judge" test (e.g., judges prefer higher pleasures because they’re better, but "better" is defined by judge preference).  
    - Correctly analyzes both cases but may not fully trace costs to hedonism’s foundational commitments.  
  - **A-grade answer (17–20/20):**  
    - Explains what a *non-circular* appeal to "quality" would require: e.g., an *independent standard* (e.g., pleasure from "nobler activities" is better because they develop human capacities). Then notes this *abandons hedonism* by smuggling in non-hedonic goods (e.g., flourishing), violating the "sole intrinsic good" claim.  

  ---

  **Notes for the Instructor:**  
  - **Model answer’s stretch:** It assumes students grasp that "attitude-based" theories (e.g., desire-satisfaction) are rivals to phenomenological hedonism. If untaught, flag the key move: *"If pleasure isn’t a feeling, what is it? If it’s an attitude, hedonism becomes desire theory."*  
  - **Whiteboard hint:** Write: **"Heterogeneity isn’t about ‘different feels’—it’s about whether ANY common property (feel, attitude, function) can do all the work hedonism needs."**  
  - **Anti-memorization guard:** The question’s cases force novel application. A student regurgitating "Mill: quality > quantity" will flounder on The Swap (where quality/sensation come apart) and Split Judges (where judges disagree on quality).
