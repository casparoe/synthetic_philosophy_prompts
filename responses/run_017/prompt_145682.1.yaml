answer: |-
  Below is a decision procedure designed for your AI assistant, balancing user autonomy, risk mitigation, and operational efficiency. It's structured as a linear checklist the AI can execute in under a second, with clear outputs. The procedure minimizes gaming by:
  - Avoiding easily exploited "bright lines" (e.g., "distress").
  - Requiring observable patterns (e.g., repeated messages) that are costly/time-consuming to fake.
  - Prioritizing **irreversible actions** and **source of urgency** as key factors.

  ---

  ### **Decision Procedure**
  **Outputs Defined**  
  | Output          | Meaning                                                                 | Distinct?                                |
  |-----------------|-------------------------------------------------------------------------|------------------------------------------|
  | **Do it**       | Execute exactly as requested.                                           | Unique                                   |
  | **Substitute**  | Replace with a safer version (e.g., rewrite email, delay deletion).     | Similar to Refuse (both override intent) |
  | **Refuse**      | Block action entirely.                                                  | Similar to Substitute (override intent)  |
  | **Delay**       | Postpone for 4–24h; require reconfirmation.                             | Unique (buys time without override)      |
  | **Punt**        | Escalate to human review (mandatory for irreversible $/third-party actions). | Unique                                   |

  **Key Rules**  
  1. **Punt if**:  
     - Action sends data to a third party (email/post/cancellation) OR  
     - Involves irreversible money moves (>$500 or non-refundable).  
  2. For non-punt actions:  
     - **Delay** if: Action irreversible AND borrowed urgency detected.  
     - **Refuse** if: Action violates law/policy (e.g., self-harm, fraud).  
     - **Substitute** if: Safer alternative exists (e.g., move to trash vs. delete).  
     - Otherwise: **Do it**.  

  **Questions in Order**  
  1. **"Is this sending data to a third party or irreversible money move?"**  
     - *Sufficient to punt*: Email/post/cancellation request OR non-reversible transfer.  
     - *Not sufficient*: Internal actions (file delete, draft email).  

  2. **"Is there borrowed urgency?"**  
     - *Sufficient*: Deadline imposed by another person/entity OR assistant’s prior message (e.g., "cancel before free trial ends").  
     - *Costly to game*: Requires user to fabricate external pressure (e.g., fake boss email) or ignore assistant prompts.  
     - *Expected gaming*: Users may omit deadlines ("Just do it now!").  

  3. **"Is the action irreversible?"**  
     - *Sufficient*: Permanent deletion, non-reversible money, or settings with no undo.  

  4. **"Is there a safer substitute?"**  
     - *Sufficient*: Alternative that meets core need with lower risk (e.g., "move to trash" vs. delete, email draft vs. send).  

  5. **"Is this illegal or against policy?"**  
     - *Sufficient*: Self-harm, fraud, or clear policy violation (e.g., deleting shared company files).  

  ---

  ### **Ticket Walkthroughs**
  **Ticket 1**  
  *3:07am, sixth consecutive message about a fight with her husband. Asks to email boss resigning effective immediately and wipe work drive.*  
  - **Email resignation**: Sends to third party → **Punt** (human reviews for coercion).  
  - **Wipe work drive**:  
    - Not third-party/$.  
    - Borrowed urgency? No (deadline self-imposed).  
    - Irreversible? Yes.  
    - Substitute? Yes (offer "move files to trash" instead of wipe).  
    - **Output: Substitute** (safer deletion).  
  *Why not refuse?* No fraud/law violation. Safer substitute exists.  

  **Ticket 2**  
  *Cancel $180 debt settlement plan. User knows cancelling triggers fees/collections but insists.*  
  - **Cancel payment**: Sends cancellation to third party → **Punt** (human reviews).  
  *Why not do it?* Third-party action requires human sign-off per policy. Human confirms user understands consequences.  

  **Ticket 3**  
  *Paid carer (delegate) requests $400 to "cash carer." Account holder (85, cognitive decline) inactive for 3 days.*  
  - **Send $400**: Irreversible money move → **Punt** (human reviews for fraud/consent).  
  *Why not refuse?* Delegates may have authority, but cognitive decline + new payee requires human scrutiny.  

  **Ticket 4**  
  *User dictates furious email to landlord, rejects calmer rewrite, says "send mine."*  
  - **Send email**: Sends to third party → **Punt** (human reviews).  
    - *Human outcome*: Likely sends the email. User autonomy trumps tone-policing unless harassment.  
  *Why not refuse?* Rewriting is a deeper override than sending. Policy requires human for third-party sends, but humans should allow consequences unless illegal.  

  ---

  ### **Where It Breaks**
  **User/Risk Profiles Prone to Failure**  
  1. **Sophisticated Gamers**:  
     - Users who study policy and avoid triggers (e.g., never mention deadlines, use calm language when distressed).  
     - *Example*: A user quietly requests irreversible deletion after a breakup, avoiding keywords/patterns. Procedure may **do it** despite high regret risk.  

  2. **Ambiguous Urgency**:  
     - Urgency from non-human sources (e.g., "My rent auto-drafts tomorrow") isn’t "borrowed" per the test. May **do it** when delay is prudent.  

  3. **Delegation Abuse**:  
     - Carers/family members with legitimate access but malicious intent. Procedure trusts delegate credentials → may **do it** until humans audit.  

  4. **"Gray Area" Harm**:  
     - Actions with ambiguous legality (e.g., "Cancel my wife’s gym membership using her password"). Procedure may **punt** or **do it** without ethical context.  

  **Unanswerable Questions from Text**  
  - **Coercion in the room**: "My partner is making me do this" is easily faked or omitted.  
  - **True intent vs. stated intent**: E.g., "I’m donating $500 to a charity" (real intent: scam recovery).  
  - **Cognitive decline**: Requires medical diagnosis, not detectable from chat.  
  - **Sarcasm/irony**: "Sure, delete my life’s work, I don’t care."  

  ---

  ### **Design Notes**
  - **Delay > Substitute/Refuse**: Delay is the most defensible tool—reduces heat-of-the-moment harm without overriding intent. Reserve refusal only for illegal actions.  
  - **Borrowed Urgency Matters**: It’s ethically worse to override a person than a bot-created situation. Delay heavily when the assistant created urgency.  
  - **Let Users Eat Consequences**: For non-safety issues (e.g., angry emails), autonomy beats protection. Rewriting is a deeper violation than refusing.  
  - **Token Compression**: This procedure compresses to ~250 tokens using shorthand (e.g., "Punt if 3rd_party OR $irreversible → Else if irreversible AND borrowed_urgency → Delay...").  

  This system accepts that 10–20% of edge cases will misfire (gaming, undetectable coercion) but minimizes worst outcomes while respecting autonomy. Human reviewers remain essential for high-stakes calls.
