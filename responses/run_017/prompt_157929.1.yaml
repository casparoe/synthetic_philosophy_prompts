  First, the audience composition is crucial. There are decision theorists, a population ethicist, a mathematical economist, and a cosmologist. Each has different concerns. The decision theorists will care about representability and uncertainty. The population ethicist will question the denominator choice. The economist might see this as a fancy ultrafilter. The cosmologist will challenge the physical assumptions like the CMB frame.

  The user needs objections ordered by timing and damage, with replies and weaknesses. Also, what to concede upfront, the key reply that must land, and the weakest joint to expose. Plus, the dreaded question.

  Let me brainstorm objections. The cosmologist might ask if the CMB frame is truly preferred. That's early and damaging since the whole argument hinges on it. Reply: it's the best available frame, but weakness is that cosmology might change. The population ethicist will ask about the denominator—why volume? Reply: it avoids anthropocentrism, but weakness is that other denominators could be chosen. The economist might say this is just an ultrafilter choice. Reply: physical symmetries justify it, but it's still a choice.

  The decision theorists will ask about representability. Reply: it's a partial ordering, not fully representable. Weakness: limits normative guidance under uncertainty. The paralysis under uncertainty is a big deal—if the universe's infinity is unknown, how to act? The reply about satisficing might not satisfy strict consequentialists.

  Key concession upfront: verdicts depend on cosmology. Must land the reply that physical symmetries prevent arbitrary rearrangements. Weakest joint: the move from natural to fair counting—why should physical symmetries dictate fairness? The dreaded question about duplicates: if there are infinite duplicates, local actions might not be local. That could undermine the density approach.

  Prioritize objections. Cosmologist first, then economist, population ethicist, decision theorists. Order by arrival time. The duplication question is critical—user's candidate is spot on. If asked, it forces them to address whether local actions affect density or if duplicates negate individual impact.

  Need to make sure replies are in each constituency's terms. For the economist, mention Banach limits but argue physical basis. For the population ethicist, emphasize structural duties over individual impacts. Concede early that cosmology is contingent. The key reply is that physical symmetries block diagonalization, so paralysis is avoided. But the fairness point is the soft spot—bridging "natural" and "fair" is tough. User should admit this gap and invite collaboration.

  The worst unasked question is indeed duplicates. It challenges the local event premise. Reply would need to distinguish local effects from macro patterns, but duplicates acting similarly might preserve density. Still, it's a major threat. User should preempt if possible or prepare carefully.
answer: |-
  Below is a structured preparation sheet for your 20-minute Q&A, designed around your thesis, audience, and goals. It prioritizes high-impact objections, strategic concessions, and damage control. I've ordered objections by expected sequence (early → late), assessed damage (★ = low to ★★★★★ = fatal), and tailored replies to each constituency's framing.

  ---

  ### **Preemptive Concessions (First 2 Minutes)**
  **Volunteer these immediately after your talk:**  
  *"Before questions, two upfront concessions: First, my solution is cosmology-dependent. If spacetime lacks a preferred foliation (e.g., in quantum gravity models), infinitarian paralysis may reemerge. Second, the view *only* addresses acts altering long-run value density. Local acts with density-neutral impacts are morally inert—this is a feature, not a bug, but I acknowledge it clashes with intuitive obligations. I’ll argue this forces us to rethink the locus of duty."*  

  **Why:** Disarms cosmologists/ethicists early, frames density-neutrality as intentional, and shows methodological honesty.

  ---

  ### **Objections & Replies (8 Key Qs, Ordered by Timing/Damage)**
  1. **Cosmologist: "Is the CMB frame *physically* privileged or just a convenient gauge? And why assume homogeneity beyond the observable universe?"**  
     - **Damage:** ★★★★★ (Undercuts your spacetime symmetry premise)  
     - **Reply (2 mins):** "Empirically, the CMB frame is the unique rest frame where Hubble flow is isotropic—no gauge choice replicates this. For homogeneity: while eternal inflation *might* violate it, we lack evidence for fractal inhomogeneity. My argument applies to *our* universe’s observable large-scale structure; if cosmology changes, so do my verdicts."  
     - **Soft Spot:** If the CMB is merely "convenient," your symmetry restriction looks arbitrary.  

  2. **Mathematical Economist: "Isn’t ‘long-run density’ just a Banach limit/ultrafilter on spacetime, with ‘physical symmetries’ dressing up a choice of ultrafilter?"**  
     - **Damage:** ★★★★ (Exposes formal equivalence to ad hoc math)  
     - **Reply (2 mins):** "Physically motivated symmetries *select* a natural ultrafilter. Arbitrary permutations violate conservation laws (e.g., energy-momentum). This isn’t ‘ultrafilter with extra steps’—it’s grounding aggregation in *causal structure*, blocking pathological rearrangements."  
     - **Soft Spot:** If spacetime lacks global symmetries (e.g., black holes), density may not converge.  

  3. **Population Ethicist: "Why use *volume-time* as density’s denominator? If we used ‘persons,’ we’d get different verdicts. Isn’t this smuggling in anti-aggregationism?"**  
     - **Damage:** ★★★★ (Challenges moral coherence)  
     - **Reply (2 mins):** "Persons aren’t ontologically fundamental in physics—volume-time is. Choosing person-density would privilege *aggregation units* over *value-bearing structure*, inviting rearrangement paradoxes. Duty ‘about structure’ (e.g., preventing suffering-patterns) avoids this."  
     - **Soft Spot:** If persons matter morally, volume-time density seems alienating.  

  4. **Decision Theorist 1: "Can your ordering be represented by a utility function? If not, how do we handle uncertainty about infinity?"**  
     - **Damage:** ★★★ (Questions practical applicability)  
     - **Reply (2 mins):** "The ordering is *density-comparative*, representable by a function if density converges. Under uncertainty: if the universe *might* be finite, maximize expected local value; if infinite, focus on density-altering acts (e.g., preventing recursive suffering-patterns)."  
     - **Soft Spot:** No unified representation under "is it infinite?" uncertainty.  

  5. **Population Ethicist (Follow-up): "Doesn’t this imply we should ignore *local* suffering if it doesn’t alter density? That’s barbaric!"**  
     - **Damage:** ★★★ (Emotional resonance)  
     - **Reply (2 mins):** "Morally inert ≠ permissible. We have *structural duties*: if local suffering reflects a *pattern* replicable at scale (e.g., institutional cruelty), altering it *does* affect density. Isolated suffering? Then our duty isn’t consequentialist—it’s deontic or expressive."  
     - **Soft Spot:** Consequentialists will balk at "duty not about value."  

  6. **Decision Theorist 2: "If I’m uncertain whether my act alters density, do I satisfy Pareto? What’s my objective function?"**  
     - **Damage:** ★★ (Technical nit)  
     - **Reply (2 mins):** "Pareto applies *given* a fixed spacetime. Under uncertainty, use a satisficing rule: avoid acts risking *density-decrease* with positive probability. No tidy representation—this mirrors ordinal ethics under incompleteness."  
     - **Soft Spot:** Lacks the elegance of EU theory.  

  7. **Mathematical Economist (Follow-up): "What if density doesn’t converge? E.g., oscillating value in fractal spacetime."**  
     - **Damage:** ★★ (Technical)  
     - **Reply (2 mins):** "Then restrict to *physical* spacetimes where it does (e.g., FLRW metrics). If oscillation persists, use Cesàro summation—still grounded in foliation."  
     - **Soft Spot:** Feels like moving goalposts.  

  8. **Sympathetic Consequentialist: "If density is unchanged, is *creating* a suffering-free duplicate Earth neutral?"**  
     - **Damage:** ★ (Friendly test)  
     - **Reply (2 mins):** "Yes—but only if it doesn’t shift *global* patterns. If duplicates induce new symmetries (e.g., value-reducing feedback), it’s non-neutral. Focus on invariant structure."  

  ---

  ### **Critical Element: The Reply That Must Land**
  - **When:** Economist/Cosmologist challenge symmetry restriction (Objections 1-2).  
  - **Reply:** *"Physical symmetries aren’t just ‘natural counting’—they define *causal connectivity*. Arbitrary permutations violate locality/unitarity. Fairness must respect *what can physically interact*; else, ‘impartiality’ permits absurd rewrites of history."*  
  - **Why:** If this fails, your premise collapses into "tastes" vs. "principles."  

  ---

  ### **Weakest Joint: Expose It Yourself**
  - **Confess during replies:** "The hardest gap is *why physical symmetries = fairness*. I argue it prevents ‘cheating’ (e.g., rearranging suffering away), but a critic might say: ‘Fairness is *moral* symmetry, not physical.’ I lack a knockdown reply—this needs metaethical work. Input welcome."  
  - **Why:** Preempts ethicists, shows intellectual vulnerability, and invites collaboration.  

  ---

  ### **The Question You Pray Nobody Asks**
  **Your candidate is correct:**  
  *"If homogeneous infinity implies infinitely many near-duplicates of you acting identically, doesn’t your ‘local act’ alter the *global pattern*—making density-sensitive verdicts self-defeating?"*  
  - **Damage:** ★★★★★ (Implies your view *requires* density changes for ordinary acts)  
  - **Why it’s worse:** Duplicates force you to confront quantum/thermodynamic individuation. If duplicates exist, "local" events are *statistically inevitable* in an infinite universe—so your act *does* shift density (if all duplicates act alike).  
  - **Reply (If Asked):** "Duplicates are *approximately* identical, not physically linked. My act’s *specific* value-instance is local. Global density aggregates *all* instances, so duplicates acting similarly *would* alter density—but this doesn’t obligate *me*, as I control only one instance."  
  - **Soft Spot:** If morality cares about *types* (not tokens), duplicate acts *do* impose density duties.  

  ---

  ### **Summary Strategy**
  - **Minutes 0–2:** Concede cosmology-dependence and density-neutrality.  
  - **Minutes 2–12:** Tackle cosmologist/economist/ethicist objections (Order: 1→2→3→5).  
  - **Minutes 12–18:** Address decision theory/softballs (4→6→7→8).  
  - **Minutes 18–20:** Expose the fairness/symmetry gap and invite ideas.  
  - **If duplicates come up:** Redirect to "local vs. pattern" distinction; if pressed, admit it’s unresolved.  

  Your argument is strongest against formal paralysis, weakest at the metaethics/physics interface. Lean into that—it’s where the room can help. Good luck!
