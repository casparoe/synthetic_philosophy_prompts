prompt: |-
  i've been chewing on something for a while and and I keep failing to find the word for it, so I'd like you to either point me at the established concept or tell me the thing I'm describing isn't one thing.

  To get us on the same page, here's the case everybody uses: someone threatens you, or offers you cash, unless you believe some proposition. The lesson usually drawn is that this gives you *a* reason to believe in some sense, but not the sort of consideration that has anything to do with whether the belief is correct — its force comes from what believing does for you, not from what the belief is about. Fine. What I'm after is a different-looking family of cases where there's no carrot and no stick at all.

  I first noticed it in an argument about whether a perfect forgery can be as good as the original: "you should treasure this one — the copy is indistinguishable, but this is the one that was actually in the room." No benefit to anyone, no threat, and yet the consideration isn't about the qualities the attitude is supposedly a response to either; it's about the object's history or its relation to you. Same shape outside art: "you should admire him, he's your father"; "you should be proud of it, you made it yourself" (even when you both agree it came out badly). It seems to give *some* reason, not none.

  Then there's a variant where people I've talked to split, and I can't tell whether it's the same phenomenon: "you should believe he didn't do it — he's your brother, and suspecting him would be a betrayal." Some people say the loyalty fact is exactly as disconnected from whether he did it as the demon's cash is; others say no, here the consideration really does bear on whether you should believe.

  So: does the pattern in my middle cases have a name of its own, or is it just the demon thing in disguise? Is the loyalty/betrayal case the same phenomenon or a different one, and how exactly would you tell them apart? Where's the edge — when does a relational or historical fact stop being this pattern and become a reason of the genuinely relevant kind (think "it's your kid, so you have a reason to hope", or something you promised)? And if there's no established term, coin one, define it, and give me a couple of boundary cases just inside and just outside it. I'm not asking for references or a reading list — I can't get at journals from here, so paper titles are useless to me.

  Give me exactly five numbered points, a sentence or two each, no intro and no sign-off. And please push back plainly if my cases don't really form one phenomenon, or if the contrast I'm drawing between them and the threat/bribe cases is confused — I'd much rather be told the category is bogus than get a tidy label for something that doesn't hang together.
reasoning: |-
  Okay, the user is grappling with a philosophical concept they can't quite pin down. They've described cases where relational or historical facts seem to provide reasons for attitudes (beliefs, admiration, pride) that aren't tied to the object's actual qualities nor to external incentives like threats or bribes. The classic demon threat case is clearly different, but they're wondering if their examples form a coherent category.

  Hmm... their core examples are intriguing: valuing an original artwork despite identical copies, admiring a father just because he's your father, feeling pride in your own creation even when it's objectively bad. Then there's the loyalty case about believing in a sibling's innocence - which seems related but creates disagreement among their peers. 

  The key pattern here appears to be reasons arising from relational roles or historical particularity rather than intrinsic properties. This feels distinct from both epistemic reasons (evidence of truth) and pragmatic reasons (threats/bribes). The loyalty case might be a hybrid - it involves relational duty but also touches on belief formation.

  For terminology, "constitutive reasons" seems apt - reasons flowing from what constitutes certain relationships or roles. The original artwork case exemplifies this through historical particularity. Boundary cases would be: inside - treasuring your childhood teddy bear despite its flaws; outside - admiring a painting for its brushwork. 

  The user clearly wants precision, not just labels. They'd prefer honest pushback over false coherence. Their examples do hold together under "constitutive reasons," but the loyalty case sits at the edge where relational duties meet epistemic concerns. This deserves explicit acknowledgment in the response.
answer: |-
  Here are five points addressing your query:

  1.  **The core phenomenon you identify is "Constitutive Reasons" (or "Role-Grounded Reasons").** These are reasons derived not from an attitude's object's properties or from external incentives, but from the nature of the relationship or role you occupy relative to the object. Valuing the original due to its history, admiring a parent, or taking pride in your creation *because it's yours* stem from what constitutes being a loyal child, a creator, or appreciating historical significance itself. The reason is internal to the stance implied by the role/history.

  2.  **This is distinct from the demon/threat case ("Pragmatic Reasons for Belief").** The demon offers a purely *external*, contingent incentive disconnected from truth or the attitude's object. Constitutive reasons arise *internally* from the meaning of the relationship or category itself. Treasuring the original isn't an external reward; it's part of what valuing historical authenticity *means*.

  3.  **The loyalty/belief case ("He's your brother!") is a hybrid and contested.** It *is* a constitutive reason flowing from the sibling role (duty of loyalty, avoiding betrayal). However, unlike admiration or valuing, belief aims at truth. The constitutive reason (loyalty) clashes with the constitutive norm of belief (truth). This creates tension: the reason is genuine (demanding suspension of judgment/doubt *as an act of loyalty*), but it doesn't bear on truth itself. It's distinct from the demon (no external threat/bribe) but shares the "non-truth-related" aspect *for the belief's content*.

  4.  **The edge: Constitutive reasons become "genuinely relevant" when the relational/historical fact *is* evidence or defines the object.** "Hope because it's your kid" remains constitutive (hope stems from the parental role, not evidence). "Believe he's innocent *because* you saw the alibi footage" uses relational access as evidence (genuinely relevant). Promising creates a new constitutive reason *to act* (fulfill the promise), but if the promise is *about* belief (e.g., "Promise me you'll believe X"), it creates a pragmatic/constitutive *duty to try to believe*, not a truth-related reason *for* X.

  5.  **Boundary Cases:**  
      *   **Inside:** Treasuring your childhood teddy bear (despite wear) *because it was yours as a child* (constitutive: meaning of personal history/sentiment).  
      *   **Outside:** Admiring a painting *because of its vibrant colors* (genuinely relevant: property of the object).  
      *   **Edge Case (Inside/Contested):** Feeling obligated to vote for a policy *because your community depends on it* (constitutive reason from group membership) vs. voting for it *because evidence shows it benefits them* (genuinely relevant).
