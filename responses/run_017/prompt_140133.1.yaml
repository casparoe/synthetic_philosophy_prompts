  I'll use British English throughout as requested. For the new condition where patients can only describe distress using diagnostic terms, I'll call it "Acquired Nosological Dependency Syndrome" - clinical but subtly absurd. The tone needs to remain completely deadpan; no breaking character or admitting doubt. The critique should be implicit in what the entries report.

