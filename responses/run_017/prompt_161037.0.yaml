  Here is a collaborative framework document drafted for the summer institute, incorporating your specifications: numbered consensus claims, a disagreements table with self-identified phrasing, analysis of the four distinctions, and responses to the four crux cases. Gaps are marked where joint wording proved impossible. The commission is *not* fundamentally misconceived; the distinctions clarify significantly, though deep disagreement remains.

  **Document: Framework for Teaching Episodes of Mass Atrocity**

  **(Distributed on First Morning)**

  **Preamble:** This document outlines areas of agreement and clarifies core disagreements between educators holding different views on comparing historical atrocities ("comparativists" and "singularists"). It aims to foster productive collaboration by identifying shared commitments, distinguishing concepts often conflated, and precisely articulating points of divergence. Signatories affirm their commitment to rigorous, ethical, and empathetic pedagogy concerning mass atrocity, while acknowledging fundamental differences in approach.

  **Section 1: Consensus Claims (Signable by Both Camps)**

  1.  **Context is Paramount:** Understanding any mass atrocity requires deep engagement with its specific historical, political, social, cultural, and economic context. Generic frameworks applied without regard to context are inadequate and potentially distorting.
  2.  **Evidence Demands Scrutiny:** All claims about mass atrocities, including scale, causation, perpetration, and experience, must be grounded in rigorous historical methodology and critical evaluation of available evidence (archival, testimonial, material). Historical interpretations are subject to revision based on new evidence or scholarship.
  3.  **The Dangers of Simplification & Hierarchy:** Pedagogical and commemorative practices must actively guard against:
      *   Reducing complex historical events to simple narratives or numbers.
      *   Creating implied or explicit hierarchies of victimhood that diminish the suffering of any group or imply relative "worthiness."
      *   Fostering competition or resentment between victim groups.
      *   Allowing any national or ideological narrative to erase or minimize atrocities committed against others.
  4.  **Moral Responsibility & the Imperative to Teach:** Mass atrocities represent profound moral failures. Teaching about them is an ethical imperative to honor victims, understand the mechanisms of dehumanization and violence, cultivate empathy and critical thinking, and foster vigilance against recurrence. Educators bear significant responsibility in this task.
  5.  **"Worse" is Multifaceted and Ambiguous:** The term "worse" can function differently in discussions of atrocity. It may be intended to signify:
      *   Greater aggregate suffering (scale, intensity, duration).
      *   Higher perpetrator culpability (intent, scope of agency, violation of norms).
      *   Greater contemporary obligations (e.g., reparations, institutional reform).
      *   Greater demands for precautionary attention (e.g., perceived risk of recurrence, current political salience).
      *   [Gap: Joint wording failed on whether "worse" can *ever* legitimately imply a singular, overall moral judgment encompassing victims' suffering and perpetrators' wickedness in a directly comparable way across distinct events. Comparativists generally believe it can, under specific evidentiary conditions; Singularists generally believe it cannot or must not].
  6.  **Distinguishing Concepts is Essential:** To avoid confusion and sharpen analysis, we explicitly distinguish four elements often conflated in discussions of atrocity:
      *   **A. Suffering Experienced:** The nature, scale, and intensity of harm inflicted on victims (physical, psychological, cultural, intergenerational).
      *   **B. Perpetrator Culpability:** The moral and legal responsibility of individuals, groups, and institutions involved in planning, executing, or enabling the atrocity (intent, knowledge, agency, violation of norms).
      *   **C. Present Obligations:** The contemporary duties arising from the atrocity (e.g., commemoration, truth-telling, reparative justice, institutional reform, guarantees of non-recurrence).
      *   **D. Precautionary Attention:** The level of vigilance, resources, or focus an atrocity warrants *now* based on its lessons, ongoing legacies, or perceived relevance to current risks of mass violence.
  7.  **Shared Pedagogical Goal:** The ultimate aim is to equip students and the public to comprehend the reality and gravity of mass atrocities, engage empathetically and critically with their histories and legacies, and contribute to preventing future violence.

  **Section 2: Articulated Disagreements**

  *(Each row states a position using wording adherents of that position would accept as accurate.)*

  | # | Disagreement Focus                                                                 | Comparativist Position (as stated by Comparativists)                                                                                                                                                                | Singularist Position (as stated by Singularists)                                                                                                                                                                                                 |
  | :-- | :--------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ | :----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **1** | **Feasibility & Legitimacy of Moral Comparison** | Comparative judgments regarding the overall moral gravity or "worse-ness" of distinct historical atrocities are sometimes achievable within the bounds of rigorous evidence and are ethically necessary to counter implicit hierarchies, erasure, or apologetics embedded in silence or false equivalence. | Attempts to declare one distinct historical atrocity morally "worse" than another are fundamentally unsound: evidentiarily, because the unique contexts defy commensurate measurement; morally, because such comparisons inevitably instrumentalize suffering, inflict secondary harm, and serve apologetic agendas. |
  | **2** | **Embeddedness of Comparison**                                                    | Choices in pedagogy, commemoration, and resource allocation (e.g., syllabus inclusion, museum space, memorial focus) unavoidably involve implicit comparisons and hierarchies; refusing explicit comparison does not avoid this but obscures it, often reinforcing dominant narratives. | Choices about pedagogy, commemoration, and resources must be made based on pedagogical goals, commemorative needs, and ethical responsibilities *specific to each atrocity*, not on comparative ranking. Explicitly rejecting comparison is essential to avoid the harms inherent in ranking distinct horrors. |
  | **3** | **The Function of "Worse"**                                                       | When we say one atrocity was "worse" than another, we may legitimately be making a claim primarily about the aggregate scale of suffering (A) and/or the scope of perpetrator culpability (B), based on available evidence, which can inform (though not solely determine) (C) and (D). | The term "worse," when applied to distinct atrocities, inevitably implies a judgment on the victims' experience or the inherent "evil" of the event that transcends measurable factors (A & B) and ventures into morally illegitimate territory, contaminating discussions of (C) and (D). |

  **Analysis of the Four-Way Distinction:**
  Pulling apart Suffering (A), Culpability (B), Present Obligations (C), and Precautionary Attention (D) **significantly clarifies the dispute and dissolves some heat, but not the core conflict**.
  *   **Reduced Conflation:** Much antagonism arises when critics assume a claim about (A) or (B) is *necessarily* a claim about (C) or (D) (e.g., "saying X was worse means we should care more/less about Y"). The distinction makes explicit that these are separate questions. One camp might argue for greater (C) or (D) for Atrocity Z based on its *current* political salience or unmet reparative needs, *without* making any comparative claim about (A) or (B) relative to other events.
  *   **Persisting Core Conflict:** The fundamental disagreement (Disagreement #1 & #3 above) remains squarely focused on the legitimacy and possibility of comparative judgments *specifically concerning (A) Suffering Experienced and (B) Perpetrator Culpability across distinct events*. Singularists argue such comparisons are inherently invalid or harmful, regardless of the distinctions. Comparativists argue they are sometimes valid and necessary, especially regarding (A) and (B). The distinction clarifies *what* is being compared but doesn't resolve *whether* that comparison is legitimate.

  **Section 3: Analysis of Crux Cases**

  | Crux Case                  | Argument/Case/Finding Both Camps Accept                                                                 | Comparativist Prediction/Interpretation                                                                                                                         | Singularist Prediction/Interpretation                                                                                                                                                              |
  | :------------------------- | :------------------------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **(i) Downward Revision**  | New archival research significantly revises downward the estimated death toll of Event X.                 | *Shift?* **Likely Yes, conditionally.** If the comparison hinged primarily on scale (A), the revision weakens or reverses that specific comparative claim. Comparison based on intent (B) or other factors might be unaffected. The *need* for careful, evidence-based comparison is reinforced. | *Shift?* **No, or reinforces stance.** Confirms the inherent fragility of evidence for aggregate comparisons (A). Strengthens the argument that such comparisons are unstable and thus ethically dubious. Underscores the focus on specific context over ranking. |
  | **(ii) The Gallery**       | Memorial Commission has one gallery; two candidate atrocities (P, Q); option to not allocate exists.      | Allocating the gallery *is* an expression of comparative gravity (likely A/B), even if unstated. Declining to allocate often reflects political pressure, not an avoidance of comparison, and can demote both. | Allocating the gallery **cannot** be non-comparative. The *only* option endorsable is **declining to allocate the single gallery** and finding alternative solutions (e.g., rotating exhibit, separate funding drive, integrated thematic approach). Allocation always ranks. |
  | **(iii) Third Candidate**  | Introducing Atrocity R changes which of the original two (P or Q) seems "worse" to some observers.       | Demonstrates that judgments of "worse" (re: A/B) are often **relational/holistic**, dependent on the available comparison set. This doesn't invalidate comparison; it shows context matters. Requires careful, transparent methodology. | Demonstrates the **fundamental instability and subjectivity** of comparative judgments. Proves "worse than" is not an inherent property of a pair (P,Q) but a contingent product of framing and available options, making it unsuitable for scholarly or ethical discourse. |
  | **(iv) Prevention Case**   | Hypothetical: Avert only one of two atrocities (P or Q) in the past.                                      | A non-arbitrary choice is possible & necessary (e.g., maximize lives saved (A), prevent the event with greater potential for escalation). **This *is* a comparison** (of anticipated A), illustrating a valid and necessary use of comparative judgment under evidentiary constraints. | A choice can be made based on specific criteria applied to each event individually (e.g., feasibility of intervention, preventing the *uniquely* dangerous ideology behind P). **This is not the problematic "comparison"** (ranking inherent moral gravity/worth), but a practical decision based on context-specific factors. |

  **Conclusion:** This framework establishes shared foundations while clearly delineating a profound disagreement concerning the legitimacy and ethics of comparing the suffering (A) and perpetrator culpability (B) of distinct historical atrocities. The distinctions between A, B, C, and D reduce conflation and clarify arguments. The crux cases reveal persistent differences in how each camp interprets evidence, choice-making, and the very meaning of comparison. This document serves as a common reference point for acknowledging both shared commitments and irreconcilable differences, aiming for collaboration despite deep philosophical divergence.
