answer: |-
  ## CONSULTATION PAPER: REVISION OF THE ANIMAL (SCIENTIFIC EXPERIMENTATION) ACT 1986 TO INCORPORATE GRADED MINDS FRAMEWORK

  **Issued by:** The Interdepartmental Working Group on Graded Minds (IWG-GM)
  **Date:** 1st October, 2023
  **Reference:** IWG-GM/CP/23-01
  **Consultation Period:** 1st October 2023 – 31st January 2024

  ### PREAMBLE
  Current animal welfare legislation governing scientific procedures operates on an undifferentiated model of sentience and suffering. This fails to account for the demonstrable spectrum of cognitive architectures present in research subjects. Consequently, protective measures are both inefficient (applying costly refinements where they cannot be utilised) and inadequate (failing to provide refinements where they *could* be utilised). The primary mischief is the inability to mandate the most fundamental refinement – the substitution of actual aversive outcomes with modelled ones – for subjects incapable of benefiting from it. This paper proposes amendments based on the Graded Minds Framework (GMF) to tailor protection to cognitive capacity, ensuring welfare interventions are both effective and proportionate.

  ### PROPOSED RECOMMENDATIONS

  **1. Definitions**
      a. **Graded Mind:** The classification of a research subject’s cognitive architecture determining its capacity for learning, suffering, and the applicability of specific welfare refinements.
      b. **Grade 1 (Darwinian):** Possesses hard-wired behavioural routines selected over evolutionary time. Does not learn from individual experience. Routines are indefinitely exploitable by resetting triggering conditions. Suffering, where present, is acute and stimulus-bound.
      c. **Grade 2 (Skinnerian):** Learns exclusively through operant conditioning. Requires actual performance of an action and actual experience of its consequence. Cannot utilise warnings, descriptions, models, or rehearsals as substitutes for outcomes. Suffering is contingent upon direct experience.
      d. **Grade 3 (Popperian):** Pre-screens candidate actions against an internal model. Capable of learning from modelled outcomes ("hypotheses die instead"). Efficacy contingent on model fidelity to reality. Suffering incorporates anticipation and model-based error.
      e. **Grade 4 (Gregorian):** Utilises inherited cognitive tools (words, notations, diagrams, representational artefacts) that restructure the learning space. Competence is a property of the cognitive niche. Suffering is extended by anticipation, symbolic representation, and dependence on external artefacts. Separation from constitutive artefacts renders grading indeterminate.
      f. **Aversive Endpoint:** Any experimental procedure where the intended outcome involves pain, distress, lasting harm, or death to the subject.
      g. **Popperian Floor:** The requirement (see Clause 2) that no subject of a protocol with an aversive endpoint may be classified below Grade 3.

  **2. The Popperian Floor Requirement**
      a. No subject involved in any protocol possessing an aversive endpoint may possess a Graded Mind classification below Grade 3 (Popperian).
      b. The rationale is that the core refinement mandated by welfare principles – replacing the experience of an aversive outcome with a *modelled* outcome – is null and void for subjects incapable of learning from models (Grades 1 & 2). Subjecting such entities to the aversive endpoint without the possibility of this refinement constitutes an avoidable welfare failure.

  **3. Assigning and Maintaining Grade**
      a. Grade assessment must be conducted by IWG-GM certified assessors using standardised protocols prior to project licence application involving aversive endpoints.
      b. Grade assessment is specific to the cognitive demands of the proposed protocol and the subject's environmental context (notably access to artefacts for Grade 4).
      c. Facilities must implement environmental enrichment and cognitive support protocols designed to *maintain* the assessed Grade for the duration of involvement in the protocol. For subjects near a Grade boundary, enrichment must explicitly aim to support the higher Grade capacity where applicable.

  **4. Transitional Provisions**
      a. Existing project licences involving aversive endpoints and subjects assessed below Grade 3 must be reviewed within 6 months of these regulations coming into force.
      b. Licence Holders must either:
          i. Submit a revised protocol eliminating the aversive endpoint; or
          ii. Submit a validated Cognitive Uplift Plan (CUP) demonstrating how subjects will attain and maintain Grade 3 capacity before exposure to the aversive endpoint commences; or
          iii. Seek an exemption under Clause 6.
      c. CUPs must be approved by the IWG-GM and subject to ongoing monitoring. Successful uplift must be re-verified before protocol commencement.

  **5. Cognitive Uplift Plans (CUPs)**
      a. CUPs are mandatory where the Popperian Floor Requirement necessitates raising a subject population from Grade 1 or 2 to Grade 3 for a specific protocol.
      b. CUPs must detail:
          i. The target Grade 3 capacity required (specific to the protocol's cognitive demands).
          ii. The methodology for uplift (environmental conditioning, artefact introduction, social learning frameworks).
          iii. Metrics for assessing successful attainment and maintenance of Grade 3.
          iv. Welfare safeguards during the uplift process.
      c. The IWG-GM recognises that successful CUPs may elevate the baseline cognitive capacity of a breeding population, consequently raising the standard of protection required for *future* protocols involving that population (see Closing Clause).

  **6. Exemptions**
      a. The IWG-GM may grant time-limited exemptions to the Popperian Floor Requirement only if:
          i. The protocol addresses an immediate and severe threat to human or animal health or the environment; AND
          ii. No alternative methodology using Grade 3+ subjects is feasible; AND
          iii. The maximum possible welfare refinements applicable to the subject's *actual* Grade are implemented.
      b. Exemptions are contingent on concurrent investment in research towards developing a compliant methodology or CUP for future use.

  **7. Compliance Cost Estimates (Per Subject Cohort, Baseline)**

  | Grade       | Cost to Maintain Grade | Cost to Uplift to Grade 3 | Cost of Non-Compliance (Protocol Redesign/Exemption Process) |
  | :---------- | :--------------------- | :------------------------ | :----------------------------------------------------------- |
  | **Grade 1** | Low (Basic Enrichment) | **Very High** (CUP Dev. + Implementation) | High-Medium                                                 |
  | **Grade 2** | Low-Medium (Operant Enrichment) | **High** (Focused CUP Implementation) | Medium                                                      |
  | **Grade 3** | Medium (Model-Support Enrichment) | N/A (Popperian Floor Met) | Low (Maintenance Only)                                      |
  | **Grade 4** | **High** (Artefact Provision + Niche Maintenance) | N/A                       | **Very High** (Niche Failure Consequences)                  |

  ### CLOSING CLAUSE
  The Working Group acknowledges that the consistent application of the Popperian Floor Requirement, coupled with the potential for successful Cognitive Uplift Plans to permanently elevate the cognitive baseline of subject populations, establishes a dynamic regulatory environment. **Each successful compliance cycle inherently raises the minimum standard of cognitive capacity expected within regulated subject populations and, consequently, the level of protection and cognitive support mandated by law in subsequent review periods.** The long-term sustainability of research involving subjects below Grade 4 is contingent upon continuous investment in cognitive enrichment and uplift infrastructure.

  ---

  **Comments from Consultees (Excerpt):**

  *   **Dr. Anya Petrova (IWG-GM Adviser on Innate Routines):** "The classification of Grade 1 subjects as incapable of learning is empirically robust. However, Clause 3c's suggestion that enrichment 'aim to support the higher Grade capacity' near boundaries is concerning. By definition, their routines are hard-wired. Attempting to induce model-based pre-screening in a near-Grade-1 subject risks causing profound distress without altering the underlying architecture. We should focus resources on clearer cases and accept the limitations of the Darwinian grade." *[Focuses on impossibility of uplift for Grade 1, misses the regulatory imperative driving the attempt and the potential cost-driven incentive to downgrade assessments.]*

  *   **Mr. Brendan Hicks (Director, Tranquil Fields Breeding Facility, Specialising in Standardised Grade 2 Rodents):** "The uplift costs projected for Grade 2 cohorts are unsustainable for fundamental research. Our models are optimised for consistency under operant paradigms – that's why researchers choose them! Forcing CUPs to meet the Popperian Floor for every aversive endpoint study, even low-level pain stimuli, will cripple essential biomedical screening. Exemptions (Clause 6) are too narrow. Surely if we provide extra sucrose pellets *after* the minor shock, that constitutes 'maximum possible refinement'? The Floor should only apply to severe endpoints." *[Focuses on operational cost and current utility of Grade 2 subjects, misses the fundamental welfare principle that *any* avoidable aversive experience without the possibility of model-substitution is the core issue the Floor addresses, regardless of stimulus severity.]*

  ---
  **Submit responses electronically via the IWG-GM Consultation Portal (portal.iwg-gm.gov.consult.cp2301) by 31st January 2024.**
