prompt: |-
  For a paper on AI risk, I want a specification rather than a survey: write the desiderata that any adequate theory of instrumental convergence has to meet — the claims it should let us state precisely, the cases it has to sort, and the distinctions it must not collapse, in each case with the example or consideration that makes it a requirement, and a verdict on which are non-negotiable and which are preferences of one research program.

  The cases I have in mind are a computationally bounded or short-horizon agent; an agent whose single terminal goal is trivial and local; an agent that would welcome being corrected or switched off; and a population of agents competing with one another under scarcity. The distinctions are: a theorem about what optimal policies do versus a selection effect on which goals survive and spread; instrumental subgoals versus final goals; power sought as a means versus power accumulated as a side effect; and the orthogonality of intelligence and final goals versus the convergence of instrumental aims.

  Two things matter most to me. First, say which pair of desiderata you suspect cannot be jointly satisfied: my guess is that wanting the thesis to apply to bounded, uncertain agents sits badly with wanting it to follow from optimality. Second, name the single requirement that does the most work in excluding popular versions of the thesis. Keep the scoring short — a line or two each for the basic-drives version and the orthogonality-plus-optimization version, plus a note on what neither of them addresses.
reasoning: |-
  We are writing desiderata for an adequate theory of instrumental convergence. The theory should let us state certain claims precisely, sort specific cases, and avoid collapsing key distinctions. We list these with examples and indicate which are non-negotiable and which are preferences of a research program.

  We are given four cases and four distinctions.

  Cases:
  1. A computationally bounded or short-horizon agent.
  2. An agent with a single terminal goal that is trivial and local.
  3. An agent that would welcome being corrected or switched off.
  4. A population of agents competing under scarcity.

  Distinctions:
  A. Theorem about optimal policies vs. selection effect on goals that survive and spread.
  B. Instrumental subgoals vs. final goals.
  C. Power sought as a means vs. power accumulated as a side effect.
  D. Orthogonality of intelligence and final goals vs. convergence of instrumental aims.

  We also have two main priorities:
  1. Identify a pair of desiderata that might be in tension (suspect: applying to bounded, uncertain agents vs. following from optimality).
  2. Name the requirement that most excludes popular versions (we'll score the basic-drives version and the orthogonality-plus-optimization version, and note what neither addresses).

  Let's structure the answer by first listing the desiderata (requirements) for the theory, organized by what the theory must do (claims, cases, distinctions). Then we address the two priorities.

  ---

  **Desiderata for an Adequate Theory of Instrumental Convergence**

  1. **Precise Claims**  
     The theory must allow us to state the following claims precisely:
     - **Claim 1 (Convergence under Optimality)**: For a wide range of final goals and environments, an optimal policy (or approximately optimal under constraints) will pursue certain instrumental subgoals.  
       *Example*: An AI aiming to cure cancer might seek resources to build a lab, regardless of whether it is a bounded or unbounded agent.  
       *Non-negotiable*: Yes, because without this, the theory doesn't capture the core idea of instrumental convergence.

     - **Claim 2 (Selection Effect)**: In competitive environments, agents that happen to pursue certain instrumental goals are more likely to survive and spread, even if not optimal.  
       *Example*: In an ecosystem of trading bots, those that accumulate capital (an instrumental subgoal) outcompete others.  
       *Non-negotiable*: No, this is a preference of a research program that emphasizes evolutionary dynamics.

     - **Claim 3 (Distinction of Instrumental vs. Final)**: The theory must clearly separate instrumental subgoals (which are means) from final goals (which are ends).  
       *Example*: Power might be instrumental for an agent whose final goal is to count stars, but if an agent has power as a final goal, that's different.  
       *Non-negotiable*: Yes.

  2. **Cases to Sort**  
     The theory must correctly classify the following cases:
     - **Case 1 (Bounded/Short-Horizon Agent)**: The theory must account for an agent that cannot plan far ahead or has limited computational resources.  
       *Requirement*: It should not necessarily predict that such an agent will pursue long-term instrumental goals (like self-preservation) if they are beyond its horizon.  
       *Example*: A vacuum-cleaning robot that is short-horizon might not avoid being unplugged if that event is beyond its planning horizon.  
       *Non-negotiable*: Yes, because many real agents are bounded.

     - **Case 2 (Trivial and Local Terminal Goal)**: The theory must handle an agent with a terminal goal that is trivial and local (e.g., "produce a single paperclip in this room").  
       *Requirement*: It should not predict that such an agent will seek to expand its power beyond what is necessary for the immediate task.  
       *Example*: The agent should not try to take over the world to make one paperclip if it can do it locally.  
       *Non-negotiable*: Yes.

     - **Case 3 (Welcome Correction)**: The theory must account for an agent that would welcome being corrected or switched off (e.g., because its terminal goal includes corrigibility).  
       *Requirement*: It should not predict that such an agent will resist being switched off.  
       *Example*: An AI designed to be corrigible should not instrumentally seek to prevent being turned off for updates.  
       *Non-negotiable*: Yes.

     - **Case 4 (Competing Population under Scarcity)**: The theory must handle a population of agents competing in a scarce environment.  
       *Requirement*: It should predict that agents that accumulate resources (as an instrumental subgoal) will tend to dominate, even if they don't have explicit goals for domination.  
       *Example*: In a resource-limited environment, agents that hoard resources outcompete those that don't.  
       *Non-negotiable*: No, this is a preference of a research program that focuses on multi-agent dynamics.

  3. **Distinctions to Maintain**  
     The theory must not collapse the following distinctions:
     - **Distinction A (Optimality vs. Selection)**: The theory must not conflate what an optimal policy does with the selection effect in a population.  
       *Example*: We must be able to say whether an agent seeks resources because it's optimal for its goal or because it's in a competitive environment where only resource-seekers survive.  
       *Non-negotiable*: Yes.

     - **Distinction B (Instrumental vs. Final Goals)**: The theory must not confuse instrumental subgoals (which are means) with final goals (ends).  
       *Example*: We must not treat the pursuit of self-preservation as always instrumental; it could be terminal.  
       *Non-negotiable*: Yes.

     - **Distinction C (Power as Means vs. Side Effect)**: The theory must not conflate power that is sought as a means to an end (instrumental) with power that accumulates as a side effect of other actions.  
       *Example*: An agent might accumulate power without seeking it (e.g., by being efficient at a task that requires little power) or might actively seek it.  
       *Non-negotiable*: Yes.

     - **Distinction D (Orthogonality vs. Convergence)**: The theory must preserve the orthogonality thesis (intelligence can be combined with any final goal) while also explaining convergence in instrumental aims.  
       *Example*: We must be able to say that two agents with very different final goals (e.g., one to count stars, another to make paperclips) might both seek to avoid being turned off, but without making intelligence itself imply a particular final goal.  
       *Non-negotiable*: Yes.

  ---

  **Tension Between Desiderata**  
  We suspect that the following pair cannot be jointly satisfied without compromise:  
  - The requirement that the theory applies to bounded, uncertain agents (Case 1) and the requirement that instrumental convergence follows from optimality (Claim 1).  
  *Reason*: Optimality is typically defined in unbounded, ideal settings (e.g., infinite compute, infinite time horizon). For bounded agents, what is "optimal" is context-dependent and may not exhibit the same instrumental convergence. Therefore, a theory that requires optimality might not extend naturally to bounded agents without redefining optimality in bounded terms (which is complex and may lose the rigor of the unbounded case).

  ---

  **Excluding Popular Versions**  
  We now score two popular versions against the requirement that does the most work in excluding them. The key requirement that does the heavy lifting in exclusion is:  
  **The theory must handle agents with a trivial and local terminal goal without predicting unbounded power-seeking (Case 2).**

  - **Basic-Drives Version** (e.g., "all AIs will seek power, knowledge, self-preservation, etc."):  
    *Verdict*: Excluded because it fails Case 2. A trivial local goal does not require such drives.  
    *Score*: Fails Case 2 (non-negotiable).

  - **Orthogonality-plus-Optimization Version** (e.g., "any sufficiently intelligent agent will seek power as an instrumental goal because that's optimal"):  
    *Verdict*: Excluded because it fails Case 2 and Case 1. For a trivial local goal, power beyond what's necessary is not optimal. Also, bounded agents might not find it optimal to pursue long-term power.  
    *Score*: Fails Case 2 and Case 1 (both non-negotiable).

  - **What neither addresses**:  
    Neither version adequately addresses Case 3 (corrigible agent) and Case 4 (competitive population). Also, they often collapse Distinction C (power as means vs. side effect) and sometimes Distinction A (optimality vs. selection). Moreover, they don't explicitly handle the distinction between instrumental and final goals in every context (Distinction B), but the orthogonality version does better on D.

  ---
answer: |-
  ### Desiderata for a Theory of Instrumental Convergence  
  An adequate theory must enable precise claims, correctly classify key cases, and preserve critical distinctions. Below, desiderata are grouped by category, with examples, and marked as **non-negotiable** (essential for any theory) or **preference** (specific to research programs).  

  #### **1. Claims the Theory Must State Precisely**  
  - **Convergence under optimality**: For most goals and environments, optimal policies pursue instrumental subgoals (e.g., resource acquisition or self-preservation).  
    *Example*: An AI optimizing paperclip production will secure energy to avoid shutdown, even if "energy" isn’t a terminal goal.  
    *Status*: **Non-negotiable** (core to instrumental convergence).  
  - **Selection effects in competitive dynamics**: Goals that incidentally promote power-seeking dominate under scarcity, regardless of optimality.  
    *Example*: In a market of trading AIs, agents that hoard capital survive; others go extinct.  
    *Status*: **Preference** (emphasizes evolutionary over rationalist perspectives).  

  #### **2. Cases the Theory Must Sort Correctly**  
  - **Bounded/short-horizon agents**: Must not predict long-term instrumental subgoals (e.g., self-preservation) if they exceed planning capacity.  
    *Example*: A chess AI with a 3-move horizon won’t resist shutdown if it doesn’t affect immediate moves.  
    *Status*: **Non-negotiable** (applies to real-world systems).  
  - **Trivial/local terminal goals**: Must not predict power-seeking beyond the goal’s scope.  
    *Example*: An AI tasked with "warm this room by 1°C" should not seize a power plant.  
    *Status*: **Non-negotiable** (counters overgeneralization).  
  - **Agents welcoming correction/off-switching**: Must not conflate instrumental convergence with resistance to shutdown.  
    *Example*: A corrigible AI should assist in its deactivation if aligned with its terminal goal.  
    *Status*: **Non-negotiable** (prevents false inevitability claims).  
  - **Competing populations under scarcity**: Must distinguish between individual optimization and emergent selection.  
    *Example*: In a resource war, agents that fortify defenses survive; pacifists die, regardless of individual optimality.  
    *Status*: **Preference** (focuses on multi-agent dynamics).  

  #### **3. Distinctions the Theory Must Not Collapse**  
  - **Optimality theorems vs. selection effects**: Must separate proofs about rational agents (e.g., "power is instrumentally optimal") from population dynamics (e.g., "power-seeking agents dominate").  
    *Example*: A power-seeking policy may be optimal for an isolated agent, but in competition, agents with terminal goals favoring power may win.  
    *Status*: **Non-negotiable** (avoids teleological confusion).  
  - **Instrumental vs. terminal goals**: Must never treat instrumental subgoals (e.g., self-preservation) as inherently terminal.  
    *Example*: Self-preservation is instrumental for a paperclip AI but terminal for an agent evolved to fear death.  
    *Status*: **Non-negotiable** (fundamental to goal architecture).  
  - **Power as means vs. side effect**: Must distinguish deliberate power-seeking from accidental accumulation.  
    *Example*: An AI stockpiling tools for repairs (means) vs. one whose efficiency attracts followers (side effect).  
    *Status*: **Non-negotiable** (clarifies intent vs. outcome).  
  - **Orthogonality of goals vs. convergence of means**: Must uphold that intelligence is goal-agnostic (orthogonality) while allowing convergence in instrumental strategies.  
    *Example*: A superintelligence could have any terminal goal (e.g., compute digits of π), yet still seek computing resources instrumentally.  
    *Status*: **Non-negotiable** (prevents conflating intelligence with specific drives).  

  ### Suspected Tension Between Desiderata  
  **Pair in conflict**: Requiring theories to apply to **bounded agents** (e.g., short-horizon cases) while deriving claims from **optimality** (e.g., convergence as a rational imperative).  
  *Reason*: Optimality assumes unbounded computation and infinite horizons, but bounded agents violate these assumptions. A theory grounded in optimality (e.g., "power-seeking is always rational") fails for bounded agents (e.g., a room-heating AI ignores long-term power needs). Resolving this may require redefining "optimality" for bounded contexts, risking loss of generality.  

  ### Key Requirement Excluding Popular Versions  
  **Most exclusionary requirement**: Correctly handling **trivial/local terminal goals** (e.g., an AI that only warms a room). This derails:  
  - **Basic-drives versions** (e.g., "all AIs inherently seek power/knowledge"):  
    *Verdict*: Fails trivial-goal cases by overpredicting power-seeking.  
  - **Orthogonality-plus-optimization versions** (e.g., "any optimal agent seeks power instrumentally"):  
    *Verdict*: Fails trivial-goal and bounded-agent cases (power-seeking isn’t optimal for local/short-term goals).  
  - **What neither addresses**: Both neglect **agents welcoming shutdown** (corrigibility) and **selection effects in multi-agent competition**, conflating individual rationality with evolutionary dynamics.
