prompt: |-
  My grandmother died in the spring and left a small trust — about 140k total — for the education of her five grandchildren. I'm one of three siblings who have to decide how to split it, I'm the swing vote, and I have to say something by Sunday.

  The cousins are wildly differently placed. Maya has had a hearing impairment since birth and needs interpreting and kit plus probably a funded extra year. Dev is 31, a single parent, wants to retrain, and needs childcare on top of tuition — but she's already scaled her ask down to a cheap online certificate. Tomas is 18, straight A's, comfortable parents, and wants an out-of-state school that costs roughly three times the local one. Priya is fine at community college and has asked for almost nothing. Sam is 17 and wants an unpaid internship in another city, so his need is literally rent.

  My brother keeps saying: same amount each, 28k, "we give them an equal start, not an equal finish", and "we don't get to rank how much somebody else's life costs." My sister says that's not opportunity, that's just arithmetic. She sent me a link to some encyclopedia article on equality and I do not have time for a reading list — I need the shape of the argument. So: what are the actual precise things "equal opportunity, not equal outcomes" could be claiming here? I mean specifically — what is an "opportunity" on each reading (a formal rule? a real prospect? an option set? an actual ability to function? a level of well-being reachable with reasonable effort?), what "outcome" is being said not to matter (income, welfare, capability, achievement, the same finishing position), and when the start is even supposed to be measured — at the moment we hand over the money, at graduation, at thirty?

  Lay those out as a menu I can paste into the group chat, and for each one say whether it's a platitude, whether it's substantive and defensible, whether it's actually false, and crucially whether it gets my brother his flat 28k or turns around and bites him. Two things I keep getting stuck on: Dev has quietly lowered what she wants, and I can't tell if that means she needs less or just expects less; and working out whose needs are "real" seems to require asking people invasive questions and rewarding whoever complains loudest, which feels like its own kind of wrong. There's also the fact that 140k can't actually equalise anyone — so is there a reading where equality is the wrong target entirely and the target is everyone over some floor?

  And please: if I've framed this wrong, or the distinction I keep reaching for doesn't exist, or "equal opportunity" just can't bear the weight I'm putting on it, say that plainly instead of politely answering the question I asked. Mark which verdicts you're confident about and which are live disputes that a lot of people would reject. Start with your bottom line in the very first sentence — the one-sentence answer on the flat split, plus the reading that drives it — then the reasoning, no preamble and don't restate my question back at me.
reasoning: |-
  Okay, the user is dealing with a complex family situation involving distributing their grandmother's trust for education among five cousins with vastly different circumstances. They need to make a decision by Sunday and are caught between their brother's push for equal distribution and their sister's equity-based approach. 

  First, I need to unpack the philosophical distinction they're wrestling with - "equal opportunity vs equal outcomes" - in concrete terms applicable to their situation. The brother's "equal start" argument seems simplistic when Maya needs interpreters, Dev needs childcare, Tomas wants prestige college, Priya asks for little, and Sam just needs rent money. 

  The user's core frustration resonates: they're being asked to philosophize while needing practical solutions. Their hidden concerns jump out - they don't want to: 1) punish humility (Dev scaling down requests), 2) create incentive for drama ("reward loudest complainer"), 3) make needs-assessment invasive, or 4) pretend 140k can truly equalize lives. That "floor not equality" hint feels crucial.

  Breaking down "opportunity": 
  - Formal opportunity (brother's view) means equal cash = defensible but may be substantively unfair
  - Real opportunity means equivalent access to education - which might justify unequal shares
  - Capability approach (Amartya Sen) suggests funding what lets each reach minimum functioning - this could bite brother by requiring uneven distribution

  Noticing tensions:
  - Tomas' choice vs need: his expensive taste shouldn't drain funds from Maya's necessities
  - Dev's lowered expectations: is that genuine lack of need or internalized limitations? 
  - The trust's purpose: "education" flexibly interpreted for Sam's internship rent? 

  The user's anxiety about deadlines shows - they need actionable frameworks, not theory. The menu approach makes sense: concrete options showing which philosophy justifies flat split vs variable. Must flag where brother's argument self-contradicts (e.g., if "no ranking life costs" but Maya's interpreters are factual costs).

  Most importantly, the floor-not-equality idea solves their ethical unease. 140k can't make cousins equal, but can ensure none fall below baseline educational participation. That avoids comparing sufferings while meeting real needs. Grandma's intent likely wasn't accounting equality but empowerment.

  Final synthesis: 
  - Flat split only satisfies formal equality
  - Needs-based respects real opportunity
  - Floor model achieves capability parity
  Recommendation must acknowledge no perfect solution but prioritize avoiding harm to most vulnerable (Maya, Dev, Sam). Brother's view risks leaving genuine needs unmet - a harsh outcome dressed as fairness.
answer: |-
  **Bottom line:** Reject the flat split; distribute based on *minimum costs to achieve baseline educational participation* (a "capability floor"), which favors Maya, Dev, and Sam over Tomas and Priya.  

  ### The "Opportunity" vs. "Outcome" Menu  
  *(Key: 🟢 = Defensible, 🟡 = Plausible but Contested, 🔴 = Flawed, 💥 = Undercuts Flat Split)*  

  | "Opportunity" Definition              | "Outcome" Ignored                     | When Measured? | Verdict & Implications                                                                 | Flat Split? |
  |---------------------------------------|---------------------------------------|----------------|----------------------------------------------------------------------------------------|-------------|
  | **1. Formal Access** (Brother’s view) | Any advantage post-funding (e.g., career prospects) | At disbursement | 🟡 *Platitude*: "Equal cash = fair start." **BUT** 🔴 *False*: Ignores that costs to *use* funds vary wildly (e.g., Maya’s interpreter ≠ Tomas’s luxury choice). 💥 *Bites him*: Sam gets rent, but Tomas gets elite school; not equivalent access. | ✅ Brother |
  | **2. Real Prospect**                 | Final welfare/income                  | At graduation  | 🟢 *Substantive*: "Funds must cover actual barriers to entry." 💥 *Rejects flat split*: Maya’s disability costs, Dev’s childcare, and Sam’s rent are real barriers; Tomas’s out-of-state premium isn’t. | ❌ Sister |
  | **3. Option Set Parity**             | Which path they choose               | At disbursement | 🟡 *Contested*: "Equal freedom of choice." **BUT** 🔴 *False*: $28k buys Priya 2 years of college but only 6mo of Sam’s rent—options aren’t equally viable. 💥 *Bites him*: Ignores cost-of-living disparities. | ✅ Brother |
  | **4. Capability to Function** (Sen/Nussbaum) | Specific achievements (e.g., degree type) | At age 30       | 🟢 *Strong*: "Fund what enables basic functioning (learning)." 💥 *Rejects flat split*: Covers Maya’s accessibility, Dev’s childcare, Sam’s survival needs—but not Tomas’s status-seeking. Priya may need nothing. | ❌ Sister |
  | **5. Reachable Well-Being**          | Absolute success (e.g., income)       | Mid-career     | 🔴 *Vague*: "Everyone can reach X welfare with effort." **BUT** 🔴 *Unworkable*: Requires predicting futures (e.g., Dev’s cert vs. Tomas’s degree). Favors luck/privilege. | ❌ Neither |

  ### Your Sticking Points Resolved  
  - **Dev’s lowered ask:** Signals *internalized constraints* (socioeconomic/gender barriers), not lesser need. Capability/Real Prospect views compensate this.  
  - **"Real needs" assessment:** Avoid invasiveness by funding only *documented, education-linked necessities* (e.g., tuition invoices, ADA accommodations, internship proof). Reject subjective "suffering" contests.  
  - **Can’t equalize? Correct:** Equality is the wrong target. **Pivot to sufficiency**: Ensure all meet a **capability floor** (e.g., "all can complete a credential without hunger/homelessness"). 140k *can* cover this for Maya, Dev, Sam, Priya, and likely Tomas locally.  

  ### Recommended Distribution Framework  
  1. **Cover non-negotiable barriers** first:  
     - Maya’s interpreters + assistive tech + extra year.  
     - Dev’s tuition + childcare for certification duration.  
     - Sam’s rent/basic expenses for internship period.  
     - Priya’s minimal ask (if any).  
  2. **Remainder split equally**—but Tomas’s out-of-state premium comes last. If funds run low, he attends locally.  

  **Why this over flat split?**  
  - Brother’s "equal start" fails its own test: $28k is *not* equally usable. It’s mathematically equal but ethically arbitrary.  
  - Sister’s equity focus wins: "Opportunity" means **removing systemic disadvantages** (disability, parenthood, poverty)—not subsidizing privilege.  
  - Grandma’s intent: Likely *meaningful access* (Real Prospect/Capability), not cash equality.  

  **Confidence Level:**  
  - 🟢 **High**: Flat split is indefensible under capability/real-barrier views (consensus in ethics/political philosophy).  
  - 🟡 **Medium**: "Sufficiency not equality" is widely accepted (e.g., Elizabeth Anderson), but some egalitarians dissent.  
  - 🔴 **Low**: Predicting long-term outcomes (e.g., "reachable well-being") is speculative—reject it.  

  **Sunday Script Draft:**  
  > "Grandma wanted us educated, not identically bankrolled. $28k each ignores that Maya’s deafness, Dev’s kids, and Sam’s unpaid work need extra funding just to *participate*. Let’s cover those documented costs first, split the rest equally, and ask Tomas to justify out-of-state premiums last. Equal opportunity means equitable access—not cash symmetry."
