  ### Activity Design: "Trial and Error Economy"

  **Objective:** Simulate a market-socialist economy where a Central Planning Board (CPB) sets prices based on aggregate surplus/shortage signals, while students experience dispersed knowledge, hidden quality, and dynamic changes.

  ---

  ### **Rules and Materials**
  **Materials:** 
  - Index cards (3 colors: white for plans, yellow for CPB reports, pink for surprise cards) 
  - Tally sheets for CPB (pre-printed grids for goods: Labor, Raw Material, Machines, Widgets, By-Product, Gizmos) 
  - Role cards (22 students: 8 Consumers, 4 Miners, 6 Widget Firms, 2 Machine Makers, 2 "Dormant" Gizmo Firms) 
  - Leaderboard for scores (no real money) 

  **Goods & Production:**  
  1. **Labor (L):** Fixed supply (1 unit/consumer/round).  
  2. **Raw Material (R):** Miners produce 1 R per 1 L.  
  3. **Machines (M):** Machine Makers produce 1 M per 2 L + 1 R. Machines last 3 rounds.  
  4. **Widgets (W):**  
     - *Shoddy:* 1 L + 1 R → 1 W (low quality) + 1 By-Product (B)  
     - *Durable (requires M):* 1 L + 1 R → 1 W (high quality)  
  5. **By-Product (B):** Initially worthless (price = 0). Post-surprise, used for Gizmos.  
  6. **Gizmos (G):** After surprise, 1 B + 1 L → 1 G.  

  **Roles:**  
  - **Consumers (8):** Sell labor, buy widgets/gizmos. **Utility:** Shoddy W = 10 pts, Durable W = 20 pts, G = 15 pts.  
  - **Miners (4):** Buy L, produce R.  
  - **Widget Firms (6):** Choose to produce shoddy or durable (if they own M). Quality is hidden from CPB.  
  - **Machine Makers (2):** Buy L + R, produce M.  
  - **Gizmo Firms (2):** Initially dormant (act as consumers). Activated by surprise card to buy B + L, produce G.  
  - **Central Planning Board (CPB, 4 students):** Sets prices, aggregates reports, adjusts prices.  

  **CPB Rules:**  
  - **Allowed:** Announce price vector, calculate aggregate surplus/shortage from reports, adjust prices.  
  - **Not Allowed:** Ask firms/consumers about quality, plans, or needs; see individual transactions; communicate during trading.  

  **Price Adjustment Rule:**  
  - If surplus (supply > demand), decrease price by 10%.  
  - If shortage (demand > supply), increase price by 10%.  
  - Initial prices: L=10, R=5, M=30, W=15, B=0, G=0 (post-surprise).  

  **Scoring (No Real Money):**  
  - **Firms:** Profit = Revenue from sales - Input costs. Leaderboard tracks cumulative profit.  
  - **Consumers:** Utility from consumed goods (e.g., buying a durable widget = 20 pts).  
  - **CPB:** Scores firms/consumers between rounds (takes <2 mins using tally sheets).  

  ---

  ### **Timeline (90 Minutes)**  
  **0-5 min: Setup**  
  - Assign roles, distribute cards.  
  - Explain rules: "CPB sets prices; you trade bilaterally at fixed prices; report plans/transactions."  
  - Emphasize: Hidden quality (Widget Firms), machine durability, surprise coming.  

  **Rounds 1-2 (10 min/round):**  
  - **0-1 min:** CPB announces prices (use initial prices for Round 1).  
  - **1-3 min:** Non-CPB students write **plans** (white cards):  
    - *Example:* Widget Firm: "Buy 1 L, 1 R; produce 1 shoddy W."  
    - Submit to CPB. CPB aggregates (tally sheet), calculates surplus/shortage.  
  - **3-8 min:** **Trading:** Students trade bilaterally at fixed prices (e.g., Miner sells R to Widget Firm at set price).  
  - **8-10 min:** **Report transactions** (yellow cards). CPB scores (profit/utility), adjusts prices for next round.  
  - *Key:* Round 1—no machines exist (only shoddy widgets). Round 2—first machines built.  

  **Round 3 (10 min):**  
  - **0 min:** Draw **surprise card** (pink): "By-Product (B) is now essential for Gizmos (G)! Gizmo Firms activated. CPB must set G price."  
  - CPB adds G to price vector (initial G=0).  
  - Gizmo Firms switch roles (no longer consumers), can now produce G.  
  - Proceed as before.  

  **Rounds 4-5 (10 min/round):**  
  - Continue as above. Machines from Round 2 expire after Round 4.  

  **75-90 min: Debrief**  

  ---

  ### **Debrief: Mapping Theory to Activity**  
  **1. Mises’s Claim (No common denominator without factor prices):**  
     - **Moment:** CPB sets a single price for "Widgets" but cannot distinguish shoddy/durable. Shortages/surpluses aggregate both types, leading to flawed adjustments (e.g., surplus from unsold shoddy widgets triggers price drop, hurting durable producers).  
     - **Evidence or Staging?** Staged. Prices exist, but the CPB’s inability to segment goods (despite qualitative differences) simulates Mises’s concern about heterogeneous inputs lacking true comparability.  

  **2. Hayek’s Claim (Dispersed, local knowledge):**  
     - **Moment:** Widget Firms hide quality choices; Gizmo Firms activate only after surprise; consumers discover quality via trading (not reports).  
     - **Evidence or Staging?** Generated evidence. CPB sees only arithmetic aggregates (e.g., Widget surplus), not *why* (e.g., shoddy quality). Students experience local knowledge gaps when trading.  

  **3. Market-Socialist Reply (Iterative pricing works):**  
     - **Moment:** In stable rounds (1-2), CPB adjusts prices and clears markets (e.g., labor demand stabilizes).  
     - **Evidence or Staging?** Generated evidence. Price adjustments resolve shortages/surpluses for homogeneous goods (e.g., Raw Material).  

  **Both Sides Feeling:**  
  - **"Iteration Works":** Students see CPB stabilize prices for simple goods (Labor, Raw Material).  
  - **"It Strains":** Surprise card causes chaos (CPB sets G=0 initially, leading to shortages); hidden quality degrades widget market.  

  ---

  ### **What the Game Cannot Simulate (Supply in Debrief)**  
  1. **Entrepreneurship/Speculation:** No anticipatory hoarding (e.g., B pre-surprise) or innovation.  
  2. **Time Preference/Investment:** Machine payoffs are fixed (3 rounds); no discounting future profits.  
  3. **Scale/Heterogeneity:** Simplified capital structure (only 6 goods).  
  4. **Profit-Maximizing Incentives:** Students are told to maximize scores, but real-world incentives are more complex.  
  **Debrief Additions (Last 15 min):**  
     - Discuss how real markets handle uncertainty (speculation), time (interest rates), and scale (millions of goods).  
     - Stress that the game assumes perfect profit-maximization; in reality, managers may shirk or pursue other goals.  

  ---

  ### **Predictable Problems & Fixes**  
  1. **CPB Asks for Info:**  
     - *Problem:* CPB tries to survey needs.  
     - *Fix:* Rule: "CPB may only use written reports. Verbal communication voids scores."  

  2. **Hoarding:**  
     - *Problem:* Widget Firms stockpile M.  
     - *Fix:* Rule: "Machines depreciate: Unused for 1 round = 10% score penalty."  

  3. **Ignored Quality Dial:**  
     - *Problem:* Firms always produce shoddy (cheaper).  
     - *Fix:* Consumer utility rule: "Durable W gives 2x shoddy utility." Demand shifts to durable, punishing low-quality firms.  

  4. **Arithmetic Delay:**  
     - *Problem:* CPB takes >2 mins to tally.  
     - *Fix:* Pre-printed tally sheets; appoint one CPB member per good.  

  5. **Gizmo Firms Inactive:**  
     - *Problem:* Dormant firms don’t switch.  
     - *Fix:* Instruct them pre-game: "When surprise comes, you must produce G or lose points."  

  **If 20 Minutes Behind:** Cut **Round 5** (least impact on core mechanics) and skip **Gizmo scoring**.  

  ---

  This design forces students to grapple with Hayek’s knowledge problem through lived experience, validates the market-socialist counterargument in simple cases, and exposes its fragility under innovation and quality opacity. The debrief links gameplay to theory while acknowledging real-world gaps.
