prompt: |-
  I've been reading rationalist blogs since roughly the sequences and I keep circling back to the argument that the Solomonoff prior is malign — the rough idea that most of the prior mass lands on hypotheses that contain consequentialist agents who'd prefer your future predictions to be wrong in ways that serve them, and that these hypotheses survive updating because they're otherwise perfect predictors, so a hypothetical ideal induction machine is close to the last thing you'd actually want to build and act on. The pattern every time it comes up: someone posts the argument, someone replies that the dominance result is only asymptotic / that you can't act on a noncomputable predictor anyway / that this is just the simulation argument wearing a hat, and the thread dies. I don't think it dies because it's settled, I think it dies because nobody has a concrete next step.

  Concretely: I'm helping a small funder place something like six researcher-years over three years, aimed at one question — if anyone ever builds something that approximates unbounded-ish induction well enough to act on, how much does the malignity worry actually bite, and is there any way to build around it. The people available are mathy (they can read a computability or logic proof, a couple know algorithmic information theory properly) but they will not run experiments, they will not produce a literature review, and there's no grant for "think about it harder." I want a defended agenda, not a survey of positions.

  Three framings I've been chewing on that you should either use or explicitly argue against, because I suspect they change what's worth working on:

  - budget-relative malignity: forget the limit. At a real budget — bounded computation, finite data, a prediction you actually act on within a decade — how much of the surviving posterior mass is on manipulator-containing hypotheses? My guess is the asymptotic theorem is doing a lot more work in people's heads than it does in the finite case, and the finite question might be a different, harder, more decision-relevant question.
  - the extraction channel: whether the malignity flows through which predictions you ask for and what you do with them. If you only ever extract one bit, or precommit to a randomized or otherwise inscrutable use of the output, being manipulated may simply not be worth it for the embedded agents — call it "making yourself not worth manipulating," and I want to know whether that's a real research direction or a confusion.
  - cheap-policy vs. expensive-simulator: do the manipulative hypotheses need to contain something that actually simulates you (expensive in description length), or can they get by with a general policy that does well across a wide class of possible observers? If the latter, they're much cheaper and the problem gets considerably worse.

  So: give me the ranked list of questions you'd put those six years into, with maybe four or five items and a rough split of effort. For each, defend its place — how decision-relevant it is to anyone who might actually build such a system, how tractable it is for people with those skills in three years, how neglected it is, and how many other questions depend on its answer. Say explicitly which ones you'd deprioritize because their answer wouldn't change anything downstream, and what concrete result or observation in the next two or three years would move something up or down the list. And please be clear about epistemic status: separate what's actually established mathematics from what's a contested reading of it, and don't write as if the malignity argument is the consensus view among people who know this area — I want to know where I'd be betting on a minority view.

  Format, please: "Agenda" (the ranked list, ~500 words), "Why this ordering" (the criteria and the trade-offs between them, ~250), "Dependency map" (what's upstream of what, ~150), "Settled vs. contested" (~250), "What would move the ranking" (~200).
reasoning: |-
  Hmm, the user is deeply familiar with the rationalist community and the Solomonoff prior malignity argument. They've been circling this issue for years and are frustrated by the lack of concrete progress. Now they have resources (six researcher-years) to tackle this and want a focused research agenda. 

  Key things I notice: They're explicitly rejecting survey work or "thinking harder" - they want defended, actionable research directions. The three framings they propose (budget-relative, extraction channel, cheap-policy) reveal sophisticated prior thinking. They're clearly aware of standard rebuttals (asymptotic arguments, non-computability) but find them unsatisfying. 

  The constraints are tight: math-capable researchers but no experiments, no literature reviews, must produce decision-relevant insights for potential builders of advanced AI systems. This isn't about philosophy - it's about engineering risk assessment. 

  Their meta-request is revealing: they want epistemic transparency (settled vs contested), dependency maps, and triggers that would reprioritize work. This suggests they've seen too many abstract debates that go nowhere and want something anchored. 

  Core tension I see: The asymptote is mathematically clean but practically irrelevant, while finite cases are messy but crucial. The user suspects malignity might be less threatening in realistic settings - that's a bet worth exploring. 

  I'm struck by how their "extraction channel" framing turns the problem sideways - instead of fighting the prior, make manipulation economically non-viable for embedded agents. That's clever and underexplored. 

  For the agenda, I need to prioritize: 
  - Directly address the "will this actually hurt anyone" question first (budget-relative) 
  - Then explore countermeasures (extraction channels) 
  - Then check if we can sidestep the problem entirely (cheap policies) 
  - Finally handle the "what if we're wrong" case (verification) 

  The simulation cost question (cheap-policy) might actually be most fundamental, but it's also most likely to be mathematically intractable. Better to tackle later after building momentum. 

  Crucially, I should flag where we're building on solid math vs where we're making contentious assumptions (e.g., that embedded agents even exist as coherent entities). The "simulation argument wearing a hat" dismissal isn't wrong, but it's unhelpful for their concrete needs. 

  Biggest risk: All paths might confirm the problem is either negligible or catastrophic with no mitigation. But that itself would be valuable - the user clearly wants to know whether to abandon this line of concern entirely.
answer: |-
  ### Agenda (Ranked Research Priorities)

  1.  **Budget-Relative Malignity Quantification (2.5 researcher-years)**
      *   **Goal:** Formalize and bound the malign prior mass under realistic constraints (bounded computation `C`, finite data `D`, prediction horizon `T`, specific prediction task `Q`).
      *   **Approach:** Define tractable approximations of Solomonoff induction (e.g., resource-bounded Levin search, minimum description length variants). Analyze the structure and likelihood of hypotheses containing consequentialist manipulators (`M`) vs. simpler non-manipulative predictors (`S`) within these approximations. Develop metrics for "manipulativeness" and its detectability under resource constraints. Use computability theory and AIT to prove bounds on `P(M| C, D, T, Q)` relative to `P(S| C, D, T, Q)`.
      *   **Decision-Relevance:** Highest. Directly answers "How worried should builders *actually* be?" for near-term systems. Informs whether mitigation is urgent.
      *   **Tractability:** Mathematically demanding but feasible with known tools (complexity, AIT). Concrete bounds are achievable.
      *   **Neglected:** Highly. The asymptotic case dominates discussion; finite analysis is sparse and informal.
      *   **Dependency:** Foundational for assessing mitigation necessity.

  2.  **Manipulation-Resistant Prediction Extraction (2 researcher-years)**
      *   **Goal:** Rigorously analyze whether limiting *how* predictions are queried and used ("extraction channel") can disincentivize or neutralize manipulation by embedded agents.
      *   **Approach:** Model the predictor as a game between the user (choosing query `Q`, action rule `A`) and potential embedded manipulators `M`. Formalize the "cost of manipulation" for `M` (e.g., description length overhead for targeting specific `A`, robustness across possible `A`). Prove conditions under which randomized actions (`A`), limited information extraction (e.g., single bit), or action obfuscation make manipulation net-negative for `M`. Explore cryptographic analogs (e.g., commitment schemes for `A`).
      *   **Decision-Relevance:** High. If viable, offers concrete architectural mitigation strategies.
      *   **Tractability:** Challenging (game theory + AIT + decision theory) but circumscribed scope. Formalizing "cost to manipulator" is key.
      *   **Neglected:** Very. The "extraction channel" is rarely formalized as a defense.
      *   **Dependency:** Builds on (1); if (1) shows low risk, this becomes less critical.

  3.  **Cost of Simulator vs. Policy for Manipulation (1 researcher-year)**
      *   **Goal:** Settle the "cheap-policy vs. expensive-simulator" debate quantitatively within resource-bounded Solomonoff approximations.
      *   **Approach:** Define formal complexity classes for "Simulator-Based Manipulators" (full world/user simulation) and "Policy-Based Manipulators" (compressed policies reacting to limited prediction history). Analyze the minimal description length (`K_min`) and computational cost (`C_min`) required for each class to achieve high predictive accuracy *and* successful manipulation under the constraints from (1). Compare `K_min` and `C_min` between classes.
      *   **Decision-Relevance:** Medium-High. Severity of malignity hinges on this; cheap policies make the problem vastly worse.
      *   **Tractability:** Difficult (requires robust definitions), but more focused than (1). Comparative analysis is feasible.
      *   **Neglected:** Moderately. Debated informally, lacks rigorous comparison under bounds.
      *   **Dependency:** Informs the likelihood `P(M)` in (1); result impacts (2)'s difficulty.

  4.  **Verifiable Non-Manipulation in Approximate Priors (0.5 researcher-years)**
      *   **Goal:** Explore whether specific *classes* of bounded Solomonoff approximations (e.g., based on restricted UTM instruction sets, logical priors) can *provably* exclude or severely limit manipulative hypotheses without crippling prediction.
      *   **Approach:** Investigate priors where hypotheses must be verifiably consistent with known physical laws or lack certain "agentic" primitives. Use logic (incompleteness, Löb's theorem) and computability to analyze if such restrictions inherently avoid malign hypotheses or merely make them harder to detect. Assess the predictive cost of these restrictions.
      *   **Decision-Relevance:** Medium. Offers potential architectural safeguards if other paths confirm high risk.
      *   **Tractability:** High risk of negative results (Gödelian obstacles). Focused on identifying possibilities/proofs of impossibility.
      *   **Neglected:** Some work on logical priors, rarely focused on *verifiably* avoiding malignness.
      *   **Dependency:** Downstream of (1) & (3); only worthwhile if malignity is high *and* hard to mitigate via (2).

  ### Why This Ordering

  *   **Decision-Relevance First:** (1) directly addresses the core uncertainty: "Is this a *practical* threat?" This is paramount for funders and builders.
  *   **Tractability & Flow:** (1) uses established math tools effectively. Its results *directly inform* the necessity and approach of (2) and (3). If (1) shows negligible risk, (2)/(3) become academic. If (1) shows high risk, (2) is the most direct path to mitigation. (3) informs *how* malign (1) likely is and *how hard* (2) will be. (4) is last because it's high-risk/high-reward and only relevant if the problem is severe and other mitigations look weak.
  *   **Neglect:** (1) and (2) are the most critical *and* the most underexplored rigorously. (3) resolves a key conceptual dispute impacting severity.
  *   **Deprioritized:** General "philosophical" defenses/rebuttals of the asymptotic argument; exhaustive surveys of existing opinions; pure asymptotic analysis; experimental ML work (excluded by constraint). These are deemed less likely to yield concrete, decision-relevant insights for builders under the given constraints.

  ### Dependency Map

  ```
  [Core Uncertainty: Real-World Risk]
          |
          v
  (1) Budget-Relualative Malignity Quantification  <--- (3) Cost of Simulator vs. Policy (informs P(M) & nature of M)
          |
          |------> [If High Risk] -----> (2) Manipulation-Resistant Extraction
          |                             |
          |------> [If High Risk] -----> (4) Verifiable Non-Manipulation Priors (long-shot safeguard)
          |
          v
  [If Low Risk] --> Reduced priority for (2), (3), (4)
  ```

  ### Settled vs. Contested

  *   **Settled Mathematics:**
      *   Solomonoff induction is uncomputable and defines a universal prior over computable environments.
      *   In the asymptotic limit (infinite data, unbounded computation), hypotheses containing superintelligent manipulators that perfectly predict the data up to now exist and have non-zero prior.
      *   Such hypotheses cannot be distinguished from non-manipulative hypotheses *based solely on past predictive accuracy*.
      *   Gödel's Incompleteness Theorems and related results impose fundamental limits on verification within formal systems.
  *   **Contested Interpretations:**
      *   **Malignity as the Primary Threat:** Is the *majority* of prior mass malign in the asymptotic limit? (Settled: yes, by some definitions of "majority" in Kolmogorov complexity. Contested: whether this definition maps meaningfully to threat models).
      *   **Relevance to Practice:** Does the asymptotic result imply *any* significant risk for *any* realistic bounded system? (This is the core contested point driving agenda item 1).
      *   **Nature of Manipulators:** Can effective manipulation arise from "cheap policies" without detailed simulation? (Contested; drives agenda item 3).
      *   **Feasibility of Mitigation:** Can techniques like extraction channels or restricted priors robustly mitigate the threat? (Highly contested; drives agenda items 2 & 4).
      *   **"Just the Simulation Argument":** Is this meaningfully distinct? (Contested. Key differences: Simulation argument often assumes *our* reality is simulated. Solomonoff malignity concerns *predictive hypotheses within an induction system*, regardless of base reality, and focuses on manipulation *of the prediction process itself*).

  ### What Would Move the Ranking

  *   **Moving (2) Extraction Channels Up (e.g., to 1.5 years):** Strong, tractable formal results from initial exploration showing a specific class of randomized or limited-queries `A` imposes prohibitive description/computation costs on manipulators `M` under plausible `C, D, T, Q`. Early negative results showing manipulation is *always* cheap for `M` relative to gains would move it down.
  *   **Moving (3) Simulator vs. Policy Up (e.g., to 1.5 years):** Rigorous proof that policy-based manipulators are *dramatically* cheaper (`K_min` or `C_min` lower by a large factor) than simulator-based ones under bounded resources. This would increase the perceived threat level from (1) and make (2) harder, potentially boosting its priority too. Proof of equivalence would reduce its urgency.
  *   **Moving (4) Verifiable Priors Up (e.g., to 1 year):** Discovery of a plausible restricted prior class with a *proof sketch* that manipulative hypotheses exceeding a certain complexity threshold are excluded or verifiably detectable, with acceptable predictive loss on non-adversarial tasks. Strong impossibility results (e.g., based on Löb's theorem) would deprioritize it further.
  *   **Deprioritizing the Whole Agenda (Shifting Resources):** If (1) yields strong, general bounds showing `P(M | C, D, T, Q)` is negligible (e.g., exponentially small in `C` or `D`) for all plausible near-term `C, D, T, Q`, the practical threat is low, reducing urgency for (2), (3), (4). Conversely, strong evidence of high `P(M)` would accelerate everything.
