prompt: |-
  I work as a software engineer on a logistics forecasting team, and I sit in on a small reading group that a friend runs. We recently spent two sessions on the view that the whole point of a belief is to be accurate, and that there are formal ways of scoring accuracy which a forecaster cannot beat by reporting anything other than her real probabilities. I want to know whether something I keep tripping over at work has a name in that neighbourhood, because it seems to me to sit right next to that idea without being quite it. One constraint up front: I have no library access and no way to chase down references, so please explain things rather than point me at papers.

  At work our models output a distribution over an ordered set of buckets (delivery delay of zero days, one to two, three to five, six to ten, more than ten). Two things bother me. First, our accuracy metric is entirely indifferent to how badly a miss misses: a model that put most of its mass on three to five days when the truth was six to ten is scored exactly as badly as one that put it there when the truth was more than ten days. I tried fixing this by giving partial credit for near misses, scoring a forecast by how much probability mass it placed within one bucket of the outcome that actually happened. A colleague pointed out that my fix is gameable in precisely the way the reading group said a good accuracy measure should not be: because the score is linear in the reported probabilities, the best thing to report is no longer your honest distribution but a spike on whichever bucket maximises the smoothed probability of landing within one bucket of the truth. What I then noticed is that this is not specific to my hack. Score a single point forecast by whether it hits the truth exactly, by its absolute distance from the truth, or by its squared distance from the truth, and the optimal report is respectively the most likely value, the median, and the mean of your distribution: change how much you care about being nearly right, and you change which state of mind counts as the accurate one to have. Second, even before I started tinkering, the two standard metrics disagreed about which of two models was better on the same run of data. Model A put slightly more mass on the bucket that actually occurred but dumped the rest of its mass on a distant bucket; model B put slightly less on the actual bucket but kept the remainder on immediately adjacent ones; the metric that looks only at the probability assigned to what happened preferred A, while the metric that looks at the shape of the whole distribution preferred B. A statistician I asked about this said there is a standard way to get near-miss credit without gameability, by applying the shape-based metric to every at-least-k version of the question and adding the results up, which sounds to me as though it must be double counting something, though I cannot say what.

  So here is what I am after. Is there an established name for the dependence I ran into, where how accurate a forecast counts as, and which mental state counts as the accurate one to be in, depends on a choice of distance, of partition, or of scoring rule? I went down an internet rabbit hole and came out with the word verisimilitude, but that seems to be about whole scientific theories being nearer to or further from the truth rather than about per-question probabilities over ordered outcomes, and scoring rule looks to me like the name of the no-gameability property rather than of the dependence itself. I also want to know whether I have described one phenomenon or two: metrics disagreeing about who was more accurate on the same data, and metrics rewarding different states of mind. If they are different, tell me which one I actually ran into and how to tell them apart in a new case. And I would rather have a coined term with a definition and clear boundary cases than a bare label, because what I really want to know is whether what I found is an objection to the philosophical claim that accuracy is the single epistemic good with a privileged measure of it, or merely a fact about measurement that leaves that claim untouched.
reasoning: |-
  Alright, let's tackle this user's query step by step. The user is a software engineer on a logistics forecasting team, dealing with scoring models that predict delivery delays into ordered buckets. They've noticed two main issues: first, their accuracy metric ignores the severity of misses (e.g., predicting 3-5 days when the actual is 6-10 vs. >10 is scored the same). Second, different metrics favor different models, and modifying the scoring rule changes what the "accurate" forecast should be.

  The user mentions a reading group discussing how beliefs should aim for accuracy with scoring rules that prevent gaming. They tried a partial credit fix but found it gameable. They want to know if there's a name for this phenomenon where the scoring rule affects what's considered accurate and if this challenges the philosophical idea that accuracy has a single privileged measure.

  First, I need to identify the core concepts here. The user's partial credit approach is similar to a linear scoring rule, which they found gameable. Proper scoring rules come to mind—these ensure honesty by making the true probability the optimal report. But the user points out that even with proper rules, the choice of rule (like quadratic vs. logarithmic) changes what's rewarded. That's the concept of "elicitation" in scoring rules. Different rules elicit different functionals of the distribution (mean, median, mode).

  Then there's the divergence between metrics. The first metric focuses on the probability of the true bucket (logarithmic score), while the other considers the whole distribution, possibly using something like CRPS. The statistician's suggestion about "at-least-k" versions sounds like the CRPS or integrated quadratic distance, which avoids double-counting by integrating over thresholds.

  The user mentioned verisimilitude, but that's more about theories than probabilistic forecasts. The key here is that the choice of scoring rule depends on the decision context. The user's deeper concern is whether this variability undermines the philosophical claim of a single accuracy measure.

  So, the main phenomena are: 1) Different scoring rules elicit different functionals (state of mind dependence). 2) Conflicting model rankings based on the rule used. Both relate to the principle that scoring rules must align with the application's loss structure. There isn't one "true" accuracy measure; it's context-dependent. The term "elicitation" captures the first part, while "scoring rule divergence" or "loss structure sensitivity" might describe the conflict in evaluations.

  I should make sure to explain that proper scoring rules prevent gaming but still vary based on the rule chosen. The philosophical implication is that while accuracy is central, its measurement isn't universal but tied to specific utilities or losses. The user needs to recognize that selecting a scoring rule should reflect real-world costs of errors, like whether missing by one bucket is less costly than by several.
answer: |-
  What you're grappling with is a fundamental and well-understood phenomenon in forecasting theory, touching on core ideas about scoring rules, elicitation, and the dependence of "accuracy" on the chosen measure. You've encountered **two distinct but deeply intertwined phenomena**, both arising from the same underlying principle. Here's the breakdown:

  1.  **Elicitation: How the Scoring Rule Defines the "Accurate" State of Mind:** This is the phenomenon where the *optimal report* (the thing you *should* say to maximize your expected score) depends critically on the specific scoring rule used. It's not just about *how well* you score, but about *what belief state* the rule is trying to elicit.
  2.  **Scoring Rule Divergence / Loss Function Sensitivity:** This is the phenomenon where different scoring rules, all designed to be "proper" (honest) and measure "accuracy" in some sense, can *rank* two different forecasts (like your Model A vs. Model B) in opposite orders on the *same data*. The rule reveals which *aspect* of the forecast distribution it values most.

  **The Core Concept: Elicitation**

  *   **Definition:** Elicitation is the property of a scoring rule that determines *which functional of the forecaster's true probability distribution* it incentivizes them to report. A scoring rule is said to **elicit** a specific functional (like the mean, median, mode, or a specific quantile).
  *   **Your Observations:**
      *   **Mode:** Scoring solely based on whether a point forecast *exactly* hits the truth (0-1 loss) elicits the **mode** (most probable bucket). The optimal strategy is to report the single most likely outcome.
      *   **Median:** Scoring based on the absolute distance of a point forecast from the truth (absolute loss) elicits the **median** of the distribution. The optimal strategy is to report the value where being wrong above is as bad as being wrong below.
      *   **Mean:** Scoring based on the squared distance of a point forecast from the truth (quadratic loss) elicits the **mean** of the distribution. The optimal strategy is to report the probability-weighted average outcome.
      *   **Your "Near Miss" Hack:** Your proposed rule (linear in the smoothed probability mass near the truth) elicited the **bucket maximizing the smoothed probability mass** within ±1 bucket. This wasn't your true distribution; it was a specific summary statistic *derived from* your distribution that this particular rule cared about.
  *   **Key Insight:** **Changing the scoring rule changes *what aspect* of your true belief state you are incentivized to report.** There is no single "accurate report" independent of the rule. The rule *defines* what "accurate" means in terms of which characteristic of your distribution it wants you to reveal. This is the phenomenon you ran into first.

  **The Consequence: Scoring Rule Divergence**

  *   **Definition:** Different proper scoring rules, because they value different characteristics of a probability distribution (e.g., peak sharpness vs. calibration vs. tail behavior), can disagree on which of two forecasts is "better" for a given set of outcomes.
  *   **Your Observations:**
      *   **Model A vs. Model B:** The "only the true bucket" rule (e.g., Logarithmic Score/Brier Score for categorical outcomes) values **peak sharpness/confidence in the correct bucket** most highly. Model A scored better here because it assigned more mass *directly* to the truth, even though its remaining mass was far away.
      *   The "shape of the whole distribution" rule (like Ranked Probability Score - RPS, or Continuous Ranked Probability Score - CRPS for continuous versions) values **calibration *and_ dispersion***. It penalizes probability mass placed far from the truth. Model B scored better here because its "misses" were closer to the truth – its overall distribution was sharper *around* the true value, even if its peak was slightly lower.
  *   **Key Insight:** **There is no single, universally "correct" ranking of forecasts.** The "better" forecast depends on *which aspect of accuracy matters most for the decision context*. Is it critical to be exactly right? Or is being close generally good enough? Different rules answer this differently.

  **Addressing Your Specifics**

  1.  **The Statistician's Suggestion:** This sounds like the **Continuous Ranked Probability Score (CRPS)**. It absolutely **does not double count**. Here's why:
      *   CRPS essentially integrates the Brier Score (or a similar squared-error loss) over *all possible threshold values* for the "at-least-k" question. Instead of summing discrete "at-least-k" scores, it integrates continuously.
      *   **Formula (Conceptual):** `CRPS(F, y) = ∫[ (F(t) - 1{t >= y})^2 ] dt` where `F` is your forecast CDF and `y` is the observed value.
      *   **Interpretation:** It measures the area between your forecast Cumulative Distribution Function (CDF) and the perfect "step function" CDF that jumps from 0 to 1 right at `y`. It gives credit for probability mass placed *near* `y` and penalizes mass placed far away. Crucially, because it integrates over *all* thresholds, every part of the distribution contributes exactly once to the total area mismatch. It's the gold standard for probabilistic forecasts of ordered/continuous quantities precisely because it handles near-misses well *and* is strictly proper (not gameable in the way your hack was).
  2.  **Verisimilitude:** You're right. Verisimilitude (truthlikeness) is a philosophical concept about entire theories being closer or further from "The Truth" (often conceived as a complete, true description of the world). It's not the right term for quantifying the accuracy of probabilistic forecasts over specific ordered outcomes or the dependence of scoring on the rule. Focus on "elicitation" and "scoring rule divergence".
  3.  **Scoring Rule:** This term refers to the *function itself* used to assign a numerical score `S(P, y)` to a forecast `P` when outcome `y` happens. The crucial property is **Propriety**: A scoring rule is **strictly proper** if the forecaster maximizes their *expected* score (according to their true belief `Q`) *only* by reporting `P = Q`. This prevents gaming. Propriety doesn't prevent elicitation or divergence! Different strictly proper rules still elicit different functionals and can rank forecasts differently.

  **Putting it Together: The Named Phenomena**

  *   **The dependence of the "accurate report" on the rule is called Elicitation.**
  *   **The disagreement between different rules on which forecast is better is called Scoring Rule Divergence or Loss Function Sensitivity.**

  **Philosophical Implications**

  This **directly challenges** the simplified claim that "accuracy is the single epistemic good with a privileged measure of it" in the context of probabilistic forecasting over complex outcomes.

  1.  **No Privileged Functional:** There is no single "most accurate" summary statistic (mean, median, mode, etc.). Which one is "best" depends entirely on the scoring rule (loss function) implied by the downstream *use* of the forecast. Does the business lose money proportionally to squared error? Then the mean is the "accurate" thing to report. Proportionally to absolute error? Then the median is. Need the most frequent outcome? Then the mode is. Accuracy *is* tied to utility/loss.
  2.  **No Privileged Scoring Rule:** There is no single "best" way to score the entire distribution. The Logarithmic Score (prob. of truth) is fundamental in information theory but ignores distance. The CRPS incorporates distance but is more complex. Which rule is "best" depends on *which aspects of the forecast's performance matter most for the real-world decisions being made*. Is the cost of a miss proportional to bucket distance? Squared distance? Or is it a fixed cost if you miss at all (like a binary decision)? The "accuracy" measure *must* reflect this cost structure to be meaningful.
  3.  **Accuracy is Contextual:** What constitutes an "accurate" forecast depends on:
      *   The **distance metric** on the outcome space (how bad is a miss?).
      *   The **partition** of the outcome space (your buckets).
      *   The **scoring rule** used, which encodes the relative importance of different types of errors (peak sharpness vs. calibration vs. near-miss penalty).
      *   The **decision context** and its associated **loss function**.

  **Conclusions & Recommendations**

  1.  **You encountered both phenomena:** Elicitation (state of mind dependence) first, and then Scoring Rule Divergence (model ranking disagreement).
  2.  **Key Terms:** **Elicitation** (what functional the rule rewards), **Scoring Rule Divergence / Loss Function Sensitivity** (different rules rank forecasts differently), **Strictly Proper Scoring Rule** (prevents gaming, but doesn't resolve 1 & 2), **CRPS** (the likely "shape-based" metric and the statistician's suggestion).
  3.  **Philosophical Takeaway:** Yes, accuracy is the goal. But the *measure* of accuracy is not monolithic or context-independent. It is fundamentally tied to the *consequences of being wrong* (the loss function). There is no single "privileged" measure of accuracy for probabilistic forecasts over ordered outcomes; the measure must be chosen based on the practical use case.
  4.  **Practical Recommendation:** **Strongly advocate for adopting CRPS** for your bucket forecasts. It directly addresses your core complaint (indifference to distance) *and* is strictly proper (not gameable like your near-miss hack). It provides a single, coherent score that incorporates both calibration and near-miss credit effectively, resolving the Model A vs. Model B ambiguity in a principled way based on distance. It is the standard solution for precisely the problem you describe.
