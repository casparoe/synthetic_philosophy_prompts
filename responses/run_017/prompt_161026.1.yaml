prompt: |-
  I'm in a small reading group — half of us work in or adjacent to machine learning, the rest in policy and philosophy — and we have stalled out on AI existential risk. One member treats it as the defining problem of the century; another treats the whole discourse as a self-selecting community with an unusually strong taste for improbable-but-enormous stakes. I don't want another round of that. What I want instead is the specification: what would an argument about AI existential risk have to get right in order to count as an adequate case for, or against, taking it seriously? Fix the purpose as follows — the case should be good enough to decide whether a government should impose, and whether I should publicly support, a binding cap on frontier training compute, and good enough to tell a junior researcher whether to redirect a career into technical safety work. Adequacy here means adequacy for a decision, not adequacy as prophecy.

  So write the requirements list, each requirement paired with the case or consideration that motivates it, and be willing to add to, correct, or demote the ones I sketch. The ones I keep coming back to: it has to decompose the risk rather than assert it — separating the hazard (what the technology itself can do when it fails), the exposure (how many actors, systems, or deployment contexts put us in the way of that hazard), and the vulnerability (how much of our civilisation's long-run trajectory is genuinely fragile, as opposed to resilient or able to reconstitute) — since these are moved by different interventions and a case that conflates them will recommend the wrong lever. It has to make marginal claims, not absolute ones: probabilities conditional on this policy versus that policy, rather than a headline figure about how the century ends. It has to say which risk it is even talking about — deliberate misuse, loss of control of a single system, or structural and competitive dynamics among many actors none of whom wants the bad outcome — and it must not let the intervention appropriate to one stand in for the others. It has to fix what "existential" is doing: extinction, permanent curtailment of humanity's potential, or unrecoverable civilisational collapse, with the policy conclusion re-checked under each reading. It has to survive having its historical analogies removed while its mechanism-level story is kept, and survive the reverse operation too, because I suspect each of those two halves is doing more work than its holder admits. It has to take a position on the fanaticism problem: whether astronomically large stakes over tiny probabilities are to be multiplied out, bounded, or discounted, and what follows for the argument if they are. And it has to handle two scenarios I want used as test cases: the quiet decade, in which capabilities plateau for reasons unrelated to any safety work, and the fire-inspector's problem, in which a successful intervention leaves no observable evidence that there was ever a fire, so that a high-risk world and a safely-managed world can look identical from inside.

  Then tell me which of these requirements are non-negotiable and which are merely the methodological prejudices of one camp or another, and flag any subset you suspect cannot be jointly satisfied — that is the part I care about most, since if the list is internally unsatisfiable, that result is worth more to me than any scorecard. My own suspicion is that the demand for empirical constraint and the demand for a decision-relevant number pull apart: the event is unrepeatable, near misses may be either invisible or fatal, and any surviving observer is selected in a way that makes the absence of past catastrophes hard to read. Close by naming which single requirement excludes the largest share of what people actually say on this topic, and then, in a few lines each and no more, where three live lines of argument fail your list: the it-is-just-another-general-purpose-technology line, the default-misalignment-of-superintelligent-systems line, and the competition-makes-restraint-impossible line. Keep the weight on the criteria and their motivating cases; the scoring is for me to finish.
reasoning: |-
  Hmm, the user is part of a reading group stuck on AI existential risk debates. Half are ML-adjacent, half in policy/philosophy, and they're tired of polarized positions. They want a rigorous framework to evaluate arguments for/against taking AI risk seriously—specifically to decide on compute caps or career redirection.

  The core request is for a requirements list that would make an argument "adequate for decision" rather than prophetic. They've already sketched some sharp criteria: decomposition into hazard/exposure/vulnerability, marginal claims, specificity about risk types, clarifying "existential," handling historical analogies vs mechanisms, solving the fanaticism problem, and testing against "quiet decade" and "fire-inspector" scenarios. They're most interested in whether these criteria are internally satisfiable and which disqualify most existing arguments.

  Key insights from their query:
  - They suspect empirical constraints and decision-relevance might conflict irreconcilably.
  - They want to expose hidden dependencies (e.g., historical analogies doing stealth work).
  - They're allergic to conflation (e.g., using one risk type's solution for another).

  Their proposed test cases are brilliant stress tests: 
  1. "Quiet decade" challenges capability inevitability assumptions.
  2. "Fire-inspector problem" highlights observability failures in safety measures.

  For the response, I need to:
  1. Systematize their criteria into non-negotiable vs contingent.
  2. Identify tensions (especially the empirical-decision gap).
  3. Apply the framework to three common arguments per their request.
  4. Flag which requirement filters most noise (probably "marginal claims" since headline probabilities dominate discourse).

  The internal tension I'd diagnose: 
  - Decision-relevance demands quantifiable, intervention-specific probabilities.
  - Empirical constraint blocks reliable quantification for unprecedented, unrepeatable events with survivorship bias.

  This creates a catch-22. Policies like compute caps need cost-benefit justifications, but benefits (catastrophes averted) resist measurement. Hence most arguments either overextend analogies (violating decomposition) or retreat to qualitative claims (violating marginality). 

  When applying their test cases:
  - "Quiet decade" would force risk arguments to decouple from capability hype cycles.
  - "Fire-inspector" would expose interventions that can't demonstrate efficacy without observable failures.

  For the three live arguments:
  - The "just another GPT" line fails decomposition (ignoring hazard specificity).
  - "Default misalignment" fails vulnerability assessment (assumes fragility without proof).
  - "Competition" fails marginal claims (assumes inevitability rather than conditional dynamics).

  The unsatisfiable core: You can't have both empirically grounded probabilities *and* decision-relevant quantification for unprecedented existential risks. Every approach compromises one for the other—which is why the debate stalls.
answer: |-
  Below is a requirements list for an argument about AI existential risk (x-risk) to be considered "adequate for decision" regarding compute caps or career redirection. Requirements are paired with their motivating cases, categorized as **Non-Negotiable** (essential for any rigorous decision-focused argument) or **Contingent** (methodologically preferred but debatable within camps). A tension analysis follows, highlighting where demands may conflict. Finally, key failures of common arguments are mapped to the criteria.

  ---

  ### **Requirements List**  
  *(Motivating Cases in Italics)*  

  1. **Decompose risk into hazard, exposure, and vulnerability**  
     - *Motivation:* Interventions target distinct layers. Compute caps may reduce exposure (fewer actors running high-risk training) but not hazard (inherent capabilities of misaligned AI) or vulnerability (societal fragility). Conflation leads to misallocated effort (e.g., capping compute while ignoring ecosystemic fragility).  
     - **Status: Non-Negotiable**  

  2. **Make marginal claims (not absolute probabilities)**  
     - *Motivation:* Decisions hinge on *changes* to risk (e.g., "This compute cap reduces x-risk probability by Δp"). Absolute probabilities (e.g., "50% doom by 2100") are useless for comparing policies or career impacts.  
     - **Status: Non-Negotiable**  

  3. **Specify the risk mechanism**  
     - *Motivation:* "AI x-risk" aggregates distinct failures:  
       - **Misuse** (malicious actors): Policy levers = governance, access control.  
       - **Loss of control** (single system): Levers = alignment research.  
       - **Structural dynamics** (multi-agent races): Levers = coordination, regulation.  
       An argument conflating these cannot justify compute caps (which primarily affect exposure in structural dynamics).  
     - **Status: Non-Negotiable**  

  4. **Define 'existential' operationally**  
     - *Motivation:* A compute cap's cost-benefit changes drastically if "existential" means:  
       - Human extinction (irreversible loss).  
       - Permanent curtailment of potential (e.g., lock-in to AI-dominated future).  
       - Civilizational collapse with recovery possible (e.g., rebuilding post-disaster).  
       The case must re-test interventions against each definition.  
     - **Status: Non-Negotiable**  

  5. **Decouple historical analogies from mechanisms**  
     - *Motivation:* Arguments often lean on analogies (e.g., "nuclear winter!") while downplaying disanalogies (nuclear ≠ agentic AI). The case must:  
       - Stand if analogies are removed (e.g., using only AI-specific technical reasoning).  
       - Stand if mechanisms are removed (e.g., showing analogies robustly map to AI *without* technical claims).  
       *This exposes overreliance on one mode of reasoning.*  
     - **Status: Contingent** (But critical for robustness testing)  

  6. **Address fanaticism**  
     - *Motivation:* If x-risk probability is tiny (e.g., 0.001%) but stakes are astronomical (e.g., 10^42 future lives), expected-value calculations may demand extreme sacrifice. The case must:  
       - State if it multiplies tiny probabilities by vast stakes (requiring near-infinite precaution).  
       - Or argue for bounding/discounting (e.g., "probabilities < ε are treated as zero").  
       Compute caps’ burden depends on this choice.  
     - **Status: Non-Negotiable**  

  7. **Pass the "quiet decade" test**  
     - *Motivation:* If capabilities plateau unexpectedly (e.g., no scaling gains for 10 years), does the urgency hold? A strong case must:  
       - Explain why the *risk mechanism* persists despite stalled progress (e.g., "alignment remains unsolved even at current capabilities").  
       - Avoid tying risk solely to scaling trends.  
     - **Status: Non-Negotiable** (Tests robustness to capability assumptions)  

  8. **Pass the "fire-inspector's problem" test**  
     - *Motivation:* Successful safety interventions leave no observable disasters. The case must:  
       - Show how to distinguish a "safely managed" world from a "lucky" high-risk world (e.g., via near-miss indicators or resolved technical unknowns).  
       - Not rely on past absence of catastrophe as evidence of safety (survivorship bias).  
     - **Status: Non-Negotiable** (Tests empirical grounding)  

  ---

  ### **Tension Analysis: Where Requirements Pull Apart**  
  The **empirical constraint vs. decision-relevance tension** is critical and likely unsatisfiable:  
  - **Decision-relevance** (Requirements 2, 6) demands quantifiable, marginal probabilities.  
  - **Empirical constraint** (Requirements 7, 8) highlights that x-risk lacks historical precedents, near-misses may be invisible/fatal, and survivorship bias distorts absence-of-evidence.  
  **Result:** Reliable quantification of unprecedented, unrepeatable events is arguably impossible. This forces arguments to either:  
     - Overextend analogies (violating Requirement 5),  
     - Make speculative technical claims (lacking empirical support per Requirement 8), or  
     - Retreat to qualitative margins (weakening Requirement 2).  
  **No known approach satisfies both demands simultaneously.**  

  ---

  ### **Highest-Filter Requirement**  
  **Requirement 2 (Marginal Claims)** excludes the largest share of existing discourse. Most arguments:  
  - Cite absolute probabilities (e.g., "≥10% extinction!").  
  - Fail to model how interventions *shift* probabilities (e.g., "Compute caps reduce risk from X% to Y%").  
  - Thus cannot guide trade-offs (e.g., caps’ economic cost vs. risk reduction).  

  ---

  ### **Three Live Arguments vs. Requirements**  
  1. **"Just another general-purpose technology"**  
     - **Fails:** Requirement 1 (no decomposition). Treats AI as "neutral" without analyzing hazard (e.g., autonomous goal-seeking) or vulnerability (e.g., irreversibility of misdeployment). Also fails Requirement 8 (assumes past resilience proves future safety, ignoring survivorship bias).  

  2. **"Default misalignment of superintelligent systems"**  
     - **Fails:** Requirement 3 (mechanism specificity). Focuses solely on loss-of-control, ignoring exposure (e.g., whether multiple actors deploy such systems) and vulnerability (e.g., societal recovery capacity). Also fails Requirement 7 (if capabilities plateau at sub-superintelligent levels, risk may not materialize).  

  3. **"Competition makes restraint impossible"**  
     - **Fails:** Requirement 2 (no marginal claims). Assumes a binary "race to the bottom," ignoring how interventions (e.g., compute caps) could alter incentives. Also fails Requirement 5—relies on historical analogies (e.g., arms races) without showing mechanistic similarity to AI development.  

  ---

  ### **Summary**  
  - **Non-Negotiable:** 1–4, 6–8 (decomposition, marginality, specificity, operational definitions, fanaticism, quiet decade, fire-inspector).  
  - **Contingent:** 5 (historical/mechanism decoupling).  
  - **Core Tension:** Empirical constraint (Requirements 7–8) clashes with decision-relevance (Requirements 2, 6). This may be unresolvable, forcing arguments to prioritize one at the expense of the other.  
  - **Highest Impact:** Requirement 2 (marginal claims) filters most popular discourse.  

  This framework shifts focus from "is x-risk real?" to "what would a decision-useful argument require?"—and exposes why the debate stalls. The unsatisfiable tension suggests that *any* policy decision (e.g., compute caps) must embrace uncertainty, not quantification. For your group, this might reframe the goal: not to prove/disprove x-risk, but to identify which criteria each side values most and why.
