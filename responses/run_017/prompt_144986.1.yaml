answer: |-
  ### Decision Problem: The Doomsday Argument in Action

  I'll construct a concrete decision problem meeting all your requirements. The setup involves a funding committee choosing between two interventions: one with near-term benefits (cash transfers) and one with long-term benefits (a values lock-in institution). The key is that the long-term intervention only pays off if humanity survives for a long time, and the doomsday update (via self-sampling) dramatically increases the probability of a short future.

  #### **Setup and Assumptions**
  - **Hypotheses about total humans**:
    - **Short branch**: 100 billion humans total (including past and future).  
      Rationale: ~100 billion have lived so far; a short future adds only 1 billion more.
    - **Long branch**: 100 trillion humans total (factor of 1,000× larger).  
      Rationale: implies a vast future (e.g., humanity colonizes space).
  - **Reference class**: All humans who have lived or will live. Birth order is randomized within this class.  
    Rationale: Standard self-sampling approach; avoids complications like simulations or aliens.
  - **Current birth rank**: 100 billion (you are the 100-billionth human).  
    Rationale: Matches estimates of humans born to date; ensures we're not in the "future" for either branch.
  - **Prior probabilities**:  
    - \( P(\text{short}) = 0.5 \)  
    - \( P(\text{long}) = 0.5 \)  
    Rationale: Maximally uninformative prior; makes the update stark.
  - **Self-sampling update**:  
    Likelihood of observing birth rank \( n = 100 \) billion:  
    - \( P(n \mid \text{short}) = 1 / N_{\text{short}} = 1 / 10^{11} \)  
    - \( P(n \mid \text{long}) = 1 / N_{\text{long}} = 1 / 10^{14} \)  
    Posterior via Bayes:  
    \[
    P(\text{short} \mid n) = \frac{P(n \mid \text{short}) P(\text{short})}{P(n \mid \text{short}) P(\text{short}) + P(n \mid \text{long}) P(\text{long})} = \frac{(10^{-11})(0.5)}{(10^{-11})(0.5) + (10^{-14})(0.5)} = \frac{1}{1 + 0.001} \approx 0.999
    \]  
    \[
    P(\text{long} \mid n) \approx 0.001
    \]  
    **Update effect**: Prior odds (1:1) → Posterior odds (999:1) for short branch.  
    Rationale: The self-sampling update makes the short branch 99.9% probable.

  ---

  #### **Interventions**
  1. **Option A (Near-term)**: Cash transfers to reduce poverty.  
     - Benefits only the next 1 billion people (near-term generation).  
     - Payoff: **10 billion QALYs** (Quality-Adjusted Life Years) in both branches.  
     - Rationale: Immediate, robust benefits (e.g., bednets, cash). Unaffected by long-term future.

  2. **Option B (Long-run)**: Founding a **Values Lock-in Institution**.  
     - Ensures future institutions preserve liberal democracy (prevents value drift/tyranny).  
     - Payoff:  
       - **Short branch**: 0 QALYs (fails; no long future to protect).  
       - **Long branch**: \( D \times \) (total future population) QALYs.  
     - Here, \( D \) is the per-person impact (in QALYs). We’ll solve for \( D \) later.  
     - Rationale: Only valuable if humanity survives long-term (e.g., seed vaults, AI alignment).

  ---

  #### **Payoff Table**
  | Branch       | \( P(\text{branch}) \) (Prior) | \( P(\text{branch} \mid n) \) (Posterior) | Payoff A (Cash) | Payoff B (Institution) |
  |--------------|-------------------------|---------------------------|-----------------|------------------------|
  | **Short**    | 0.5                     | 0.999                     | 10              | 0                     |
  | **Long**     | 0.5                     | 0.001                     | 10              | \( D \times 9.9 \times 10^{13} \) |

  **Notes**:  
  - Payoff B in long branch: Total future population = \( N_{\text{long}} - n = 10^{14} - 10^{11} \approx 9.9 \times 10^{13} \).  
  - \( D \) is the per-person QALY impact (e.g., \( D = 10^{-10} \) means each future person gains 0.0000001 QALYs).

  ---

  #### **Expected Value (EV) Calculations**
  Let \( \text{EV}_A \) and \( \text{EV}_B \) denote expected QALYs.

  **1. Prior (No Update)**:
  \[
  \begin{align*}
  \text{EV}_A &= P(\text{short}) \times 10 + P(\text{long}) \times 10 = (0.5)(10) + (0.5)(10) = 10 \\
  \text{EV}_B &= P(\text{short}) \times 0 + P(\text{long}) \times (D \times 9.9 \times 10^{13}) = (0.5)(0) + (0.5)(9.9 \times 10^{13} D) = 4.95 \times 10^{13} D
  \end{align*}
  \]
  - Recommendation: Prefer B if \( \text{EV}_B > \text{EV}_A \) → \( 4.95 \times 10^{13} D > 10 \) → \( D > 2.02 \times 10^{-13} \).  
  - **Long branch dominates**: EV_B scales with huge population.

  **2. Posterior (After Update)**:
  \[
  \begin{align*}
  \text{EV}_A &= P(\text{short} \mid n) \times 10 + P(\text{long} \mid n) \times 10 = (0.999)(10) + (0.001)(10) = 10 \\
  \text{EV}_B &= P(\text{short} \mid n) \times 0 + P(\text{long} \mid n) \times (D \times 9.9 \times 10^{13}) = (0.001)(9.9 \times 10^{13} D) = 9.9 \times 10^{10} D
  \end{align*}
  \]
  - Recommendation: Prefer B if \( \text{EV}_B > \text{EV}_A \) → \( 9.9 \times 10^{10} D > 10 \) → \( D > 1.01 \times 10^{-10} \).  
  - **Short branch dilutes B**: EV_B scaled down by \( P(\text{long} \mid n) \).

  ---

  #### **Condition for Same Recommendation**
  - **We want both calculations to prefer B** (long-run option).  
    - Prior requires \( D > 2.02 \times 10^{-13} \).  
    - Posterior requires \( D > 1.01 \times 10^{-10} \).  
  - **Critical insight**: The posterior threshold is **500× stricter** than the prior.  
    To ensure B wins in both:  
    \[
    D > \max(2.02 \times 10^{-13}, 1.01 \times 10^{-10}) = 1.01 \times 10^{-10}
    \]  
    **Set \( D = 1.1 \times 10^{-10} \) (safely above both thresholds)**.

  **Expected values with \( D = 1.1 \times 10^{-10} \)**:
  - Prior: \( \text{EV}_B = 4.95 \times 10^{13} \times 1.1 \times 10^{-10} = 5,445 \) (vs. \(\text{EV}_A = 10\) → **prefer B**).  
  - Posterior: \( \text{EV}_B = 9.9 \times 10^{10} \times 1.1 \times 10^{-10} = 10.89 \) (vs. \(\text{EV}_A = 10\) → **prefer B**).  
  **Result**: Same recommendation (B) before and after update.

  ---

  #### **Where the Doomsday Argument Bites**
  - **Interval where update changes recommendation**:  
    Prior prefers B, but posterior prefers A when:  
    \[
    2.02 \times 10^{-13} < D < 1.01 \times 10^{-10}
    \]  
    **Width**: Interval spans 2 orders of magnitude (from \( 2.02 \times 10^{-13} \) to \( 1.01 \times 10^{-10} \)).  
  - **Example**: If \( D = 5 \times 10^{-11} \) (mid-interval):  
    - Prior: \( \text{EV}_B = 4.95 \times 10^{13} \times 5 \times 10^{-11} = 2,475 \) (≫ 10 → **prefer B**).  
    - Posterior: \( \text{EV}_B = 9.9 \times 10^{10} \times 5 \times 10^{-11} = 4.95 \) (< 10 → **prefer A**).  
    **Result**: Update switches recommendation from B to A.

  ---

  #### **What’s Doing the Work?**
  - **Hunch confirmed**: The **truncation of payoffs** is key.  
    - Option B (long-run) has payoff **0 in the short branch**, so its value scales superlinearly with population.  
    - Option A (near-term) has **constant payoff** across branches.  
  - **If both payoffs scale proportionally (no truncation)**:  
    Suppose Option B yields \( D \times \) (future population) in both branches. Then:  
    - Prior: \( \text{EV}_B = 0.5 \times (D \times 10^9) + 0.5 \times (D \times 9.9 \times 10^{13}) \).  
    - Posterior: \( \text{EV}_B = 0.999 \times (D \times 10^9) + 0.001 \times (D \times 9.9 \times 10^{13}) \).  
    The ratio \( \text{EV}_B / \text{EV}_A \) is unchanged by the update → **no switch possible** (Priya is right here).  
  - **With truncation**: The update penalizes B asymmetrically because its value depends entirely on the long branch, whose probability collapses.

  ---

  #### **Critique from a Doomsday Argument Proponent**
  > "You rigged the payoffs to make truncation essential, but that’s not a flaw—it’s a feature. Real long-run interventions (e.g., preventing AI apocalypses or value lock-in) often have **zero near-term benefit**. The doomsday argument forces us to confront that if an intervention only matters in a long future, we must demand exponentially higher per-person impact to justify it after updating. Your case shows the argument has teeth: it changes funding decisions for interventions that are valuable but not 'sufficiently' transformative (e.g., \( D < 10^{-10} \)). Without the update, we’d waste resources on borderline long-run projects that can’t survive anthropic scrutiny."

  **Does it land?** Yes. The truncation isn’t "strange"—it’s realistic for many existential risk interventions. The doomsday argument doesn’t just shrink stakes proportionally; it selectively disadvantages options relying on long futures.

  ---

  ### Final Word
  Priya is half-right: if payoffs scale linearly (no truncation), the update cancels out. But for interventions like values lock-in (payoff = 0 if no long future), the doomsday argument **can change what you fund**—specifically, when the long-run option’s per-person impact \( D \) is in the interval \( (2 \times 10^{-13}, 10^{-10}) \). In your reading group, this resolves the stalemate: the doomsday argument has practical implications when payoffs are truncated.
