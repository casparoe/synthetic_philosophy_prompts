  The AI test case: an assistant that always gives sevenfold answers. That would be a parody. The difference between withholding assertion due to disagreement and asserting qualified truth because of metaphysical relativity is significant. The doctrine's plausibility comes from conflating the two. But the metaphysical reading leads to the AI being useless, while the semantic view sees qualifiers as contextually necessary for resolving disputes, not a universal feature of reality.

  I think the user's intuition is correct: anekāntavāda is coherent only as a semantic/pragmatic doctrine. Metaphysical readings collapse into triviality or incoherence. The strongest metaphysical counter is that reality itself is interdependent and complex, beyond human perspectives. But this doesn't justify the sevenfold scheme; it's just a general pluralism. The syādvāda qualifiers make sense as speech acts, not descriptions of reality.

