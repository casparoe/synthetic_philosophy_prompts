  First, for the agreed claims, I should list 7-9 substantive points both sides accept. These must avoid IIT jargon so they're neutral. Points could include: neuron count isn't sufficient to explain consciousness (e.g., cortex vs cerebellum), neural architecture matters, split-brain cases are critical testbeds, phi being uncomputable is a scientific problem, and assigning consciousness to simple systems like thermostats is a cost. I'll mark which are real agreements vs agreements to stop semantic disputes.

  For the disagreements table, the user specified five cruxes: 
  1) Verbal dispute about definitions of consciousness (experience vs reportability) 
  2) Throttled-bridge case with slow inter-hemispheric connection 
  3) Duplicate-graft thought experiment 
  4) Panpsychism implications of IIT 
  5) Validity of complexity measures like EEG perturbation as evidence

  For each, I need: 
  - Crux description 
  - IIT's position in their own words 
  - Critic's position in their words 
  - A test case both agree is relevant 
  - Each side's prediction for that case 
  - Which side would be moved by unexpected results 

  Finally, concessions each side should make about remaining disagreements. 

  I'll keep it concise—under two pages—and avoid citations or history. The tone should be collaborative, focusing on where they agree and how to test key divides. For the throttled-bridge case, IIT predicts split into two subjects when bandwidth is low, critics predict a single degraded subject. The duplicate-graft case challenges whether duplicated structure adds experience—IIT says no if integrated information doesn't increase, critics say it should double. Panpsychism is a key sticking point: IIT bites the bullet, critics see it as reductio. Complexity measures are debated as evidence. 

  I'll structure it clearly: agreed claims first (numbered), then the table. End with mutual concessions to foster goodwill. This balances depth with brevity, as requested.
answer: |-
  ## Joint Statement: Adversarial Collaboration on IIT & Consciousness

  **Part 1: Agreed Claims (Substantive Points of Consensus)**

  1.  **Neural Architecture & Specificity:** Explaining why specific neural structures (e.g., cortex) appear necessary for consciousness in humans, while others (e.g., cerebellum) with comparable or greater neuron counts do not, is a core requirement for any plausible theory of consciousness. (Real Agreement)
  2.  **Split-Brain Cases Are Critical:** Cases involving disconnection or altered integration within the brain (e.g., split-brain patients, callosotomy) provide uniquely challenging and informative data for discriminating between theories of consciousness, demanding specific predictions. (Real Agreement)
  3.  **The "Hard Problem" Challenge:** Any theory positing consciousness in systems radically different from biological brains (e.g., simple thermostats, logic gate grids under IIT) incurs a significant explanatory cost regarding the "hard problem" of subjective experience. This cost must be acknowledged and justified, regardless of whether one views it as fatal or surmountable. (Real Agreement)
  4.  **Beyond Neuron Count:** The sheer number of neurons is insufficient to determine the presence or level of consciousness; the causal architecture and dynamics within the network are critical factors. (Real Agreement)
  5.  **Practical Computability Matters:** A core quantity proposed by a scientific theory being fundamentally uncomputable for biologically relevant systems (like Φ for the human brain) poses a significant challenge to its testability, falsifiability, and utility as a scientific tool, even if the underlying theory were true. (Real Agreement)
  6.  **Information Matters:** Consciousness involves some form of information processing; it is not epiphenomenal. Theories must account for the relationship between information flow/processing and subjective experience. (Real Agreement - though specifics differ)
  7.  **Exclusion Postulate's Plausibility:** The idea that consciousness at any moment must be associated with *one* specific set of elements with maximal intrinsic cause-effect power (Exclusion) is a logically coherent postulate worth serious consideration, even if its implications are debated. (Agreement to stop fighting the *coherence* of the postulate itself)
  8.  **Perturbational Measures Probe *Something*:** Techniques measuring complexity of electrophysiological responses (e.g., PCI, Perturbational Complexity Index) capture *some* neurophysiological property relevant to distinguishing conscious states (e.g., wakefulness vs. deep sleep, general anesthesia) from unconscious ones in brains. (Real Agreement on the empirical correlation; disagreement on interpretation)
  9.  **Verbal Disagreement Scope:** At least *some* apparent disagreements stem from differing operational definitions or conceptualizations of the explanandum (e.g., "consciousness as subjective experience" vs. "consciousness as global reportability/access"). Identifying these areas clarifies where substantive disagreement remains. (Agreement to stop conflating definitions where they differ)

  **Part 2: Key Disagreements & Testing Strategies**

  | Crux                                                                 | IIT Position (Own Words)                                                                                                           | Critic Position (Own Words)                                                                                                                              | Shared Test Case/Argument                                                                                                 | IIT Prediction                                                                                         | Critic Prediction                                                                                          | Who Moves If Wrong? |
  | :------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------ | :----------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------- | :------------------ |
  | **1. Core Definitional Disagreement**                                | "IIT addresses phenomenal consciousness directly—the intrinsic existence of subjective experience itself. Reportability is a consequence, not the target." | "IIT conflates mechanisms enabling global access/reportability with the hard problem of subjective experience. Its 'experience' is functionally defined." | **Resolution Scope:** Does finding a system with high Φ but *no* capacity for any form of report/behavior change the debate? | Such a system *would* have experience. Finding it validates IIT's core claim.                          | Such a system is conceivable; finding it *would* challenge critics who tie consciousness tightly to report. | Both                |
  | **2. Throttled-Bridge Case** (Slow, narrow inter-hemispheric link) | "Consciousness resides in complexes. Below sufficient bandwidth/latency, the two cortical hemispheres form separate Φ-max complexes, implying two distinct conscious entities." | "The subject remains a single conscious agent with degraded integration/capacity. Consciousness depends on overall architecture, not just local Φ maxima." | **Empirical Test:** Rigorous behavioral/cognitive testing + complexity measures (e.g., PCI) on subjects with such bridges. | Evidence will show two distinct, independent streams of report/behavior, low PCI *across* the bridge. | Evidence will show unified (though impaired) report/behavior, high PCI *across* the bridge reflecting unity. | Both                |
  | **3. Duplicate-Graft Case** (Causal duplicate cortex slab in lockstep) | "The duplicate adds no *new* integrated information (its state is fully determined by the original). Φ remains unchanged, so experience does not double." | "Duplicating a physical substrate capable of experience inherently duplicates the experience, regardless of causal redundancy. Failure to double is absurd." | **Thought Experiment:** Does duplicating the neural correlate of a specific quale (e.g., red) add another instance of that quale? | No. Only one instance of the quale exists (Φ unchanged).                                               | Yes. Duplicating the physical basis duplicates the experience.                                              | Critics             |
  | **4. Panpsychism / Grid-of-Gates**                                  | "Φ is a fundamental property. If a system instantiates a local maximum of integrated cause-effect power, it has some experience. This is a feature, not a bug." | "Assigning intrinsic experience to thermostats or grids of AND gates based on abstract causal structure is a *reductio ad absurdum*, revealing a fatal flaw." | **Agreed Cost:** IIT *must* bite the bullet. Critics *must* accept this as a core, non-negotiable implication.            | N/A (Prediction inherent in position)                                                                  | N/A (Prediction inherent in position)                                                                       | Neither (Core Tenet) |
  | **5. Complexity Measures as Evidence**                               | "Perturbational complexity measures (e.g., PCI) are empirical proxies for Φ. Their success in discriminating consciousness states validates IIT's core principles." | "These measures track functional access/integration *for report*, not intrinsic experience. They are predicted by many theories, not unique to or validating IIT." | **Disconfirming Test:** Finding a system with low Φ (per IIT calculation) showing high PCI, or vice-versa in a relevant case. | Such a dissociation would challenge IIT's claim that PCI is a reliable Φ proxy.                        | Such a dissociation is expected; PCI ≠ Φ. Finding it doesn't challenge non-IIT views of consciousness.      | IIT                 |

  **Concessions on Remaining Disagreement:**

  *   **IIT Side Should Concede:** That the panpsychist implications, while logically consistent within the theory, present a profound challenge to intuitive understanding and scientific traction that requires extraordinary justification, and that the current reliance on complexity proxies is indirect and potentially insufficient to uniquely validate IIT over competitors focusing on access.
  *   **Critics Should Concede:** That IIT provides a uniquely precise, mathematically grounded framework for tackling the problem of composition (why/how unified experience arises from parts) and exclusion (why experience is here, not there) – problems often hand-waved in other approaches – and that its predictions regarding altered integration (like the throttled bridge) are concrete and testable in a way many alternatives are not.
