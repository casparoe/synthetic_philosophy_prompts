prompt: |-
  I write a science-and-ideas column, and I am working on a long piece about who gets counted: the recent push to write cephalopods and decapod crustaceans into sentience legislation, the rapid growth of insect farming as livestock, the rules that govern laboratory use and pest control, and the researchers who now get asked by regulators to say which animals feel anything at all. What I have found in my interviews is that everyone has a verdict and nobody has a standard. Each specialist can tell me which creatures they would include, and why their rivals are being sentimental or chauvinistic, but when I ask what an account of the distribution of consciousness across animals would have to do in order to be worth acting on, the answers turn into anecdotes about octopuses. So before my next round of interviews I want the specification rather than the verdicts: what must such a theory be able to deliver, with the case or consideration behind each requirement, given that I am asking for adequacy for a particular purpose — good enough for a regulator deciding which animals fall under welfare law and a funder deciding which experiments to permit, not good enough to settle the metaphysics in the abstract.

  To save you from writing a generic list, here are the places where I keep watching the conversation break down, and I would like you to turn them into requirements only where they really are requirements (tell me plainly if any of my cases is a bad demand):

  - The anchoring dilemma, as I have been calling it in my notes. The only evidence where we have something like ground truth is human self-report, and every candidate marker is validated against that; but the markers that report-validated work licenses are tied to human hardware, so using them to rule on a creature whose nervous system is built on a different plan looks like we are measuring one thing and judging another. A theory needs some account of how it gets from our one calibrated case to creatures that will never answer.
  - The discordance problem. Across taxa the markers refuse to line up: one group shows flexible motivational trade-offs but no apparent modulation by analgesics; another shows nociceptive sensitisation and protective guarding but nothing that looks like reversal learning or trade-off; a third looks inert under every behavioural test but has an unexpectedly rich neural repertoire. I want a theory to say what happens when the evidence profile is internally contradictory — whether some markers are privileged, whether there is a hierarchy, whether a single negative marker can veto — because a bare checklist does not seem to answer this and yet everyone argues as if it does.
  - The ersatz-flexibility control. Slime moulds solve mazes, plants respond to damage with systemic signalling, a detached octopus arm keeps executing avoidance routines, and a simple reinforcement-learning agent will trade one cost against another. Whatever the theory says about bees or crabs, it has to say why these are not the same kind of case.
  - The split-subject and interrupted-subject cases. Colonial and modular organisms where it is unclear whether there is one subject or many; an animal whose neural wiring is substantially rebuilt through metamorphosis; a creature that is unconscious right now but is the kind of thing that has experiences at other times. The theory has to tell me what it is attributing consciousness to, and over what interval.
  - The distinction between being conscious at all, being conscious of this, having more or less of it, and mattering more or less. I keep seeing these run together in policy discussions, and I want to know which collapses are the theory's fault and which are the legislators'.
  - The numbers. The categories where the science is most uncertain are also the categories with astronomical population counts, so a verdict of maybe, at roughly even odds, for insects and other small invertebrates is either the most consequential output the theory could produce or practically unusable. I want to know whether being action-guiding under that kind of uncertainty is a legitimate desideratum for a theory of consciousness, or whether I am smuggling in a decision-theoretic requirement that does not belong on the list.

  Beyond the requirements themselves, three things would make this usable for me. First, mark which requirements are non-negotiable and which are really preferences of a particular camp dressed up as constraints — I can hear when a neuroanatomist and a comparative psychologist are each defining the question so that their own evidence is the only relevant kind, and I want that exposed. Second, flag any subset of the requirements that you suspect cannot be jointly satisfied, and say which one gives: if the list itself turns out to be internally inconsistent, that is the most interesting thing in the piece. Third, tell me which single requirement knocks out the largest share of the theories currently on offer, and why.

  After that, and briefly, I would like a short scorecard — a few lines each, no table needed — for the four broad styles of view I keep meeting in interviews, described by their content rather than by their authors: structure-first views that tie consciousness to particular neural architecture; behavioural and marker-based views that work from what the animal does; views that require a specific functional organisation such as a global workspace or a self-modelling predictive architecture; and the pluralist, weight-of-evidence profile approaches that have become the unofficial method of official reviews. I do not want a bibliography or any citations, and I am not asking you to reconstruct the literature — I want arguments I can put to people across a table and see how they squirm, with brief sketches of how each style handles the hardest requirement on your list rather than a summary of who published what.
reasoning: |-
  Okay, the user is working on a science column about animal consciousness and sentience legislation. They need a framework to evaluate theories of consciousness for regulatory purposes. Let me start by understanding their key concerns.

  First, they mention the anchoring dilemma: using human self-reports as a benchmark but struggling to apply it to animals with different neural structures. The challenge here is validating markers across species. A theory must bridge this gap without assuming human-like hardware.

  Next, the discordance problem. Different taxa show conflicting markers—some have trade-offs but no pain modulation, others show neural complexity without behavior. The theory needs a method to handle these contradictions, maybe prioritizing certain markers or explaining inconsistencies.

  Then there's the ersatz-flexibility control. Non-conscious entities like slime molds or RL agents exhibit behaviors that mimic consciousness. The theory must distinguish between genuine sentience and complex but unconscious responses. This is crucial to avoid false positives.

  Split-subject cases involve colonial organisms or animals undergoing metamorphosis. The theory must define the subject of consciousness and its temporal scope. For example, is a coral colony one entity or many? What about a caterpillar becoming a butterfly?

  The distinction between different aspects of consciousness—being conscious, conscious of specific things, or varying levels—often gets blurred in policy. The theory should clarify these aspects to prevent conflation in legislation.

  Lastly, the numbers problem. Uncertain verdicts for high-population species like insects have huge implications. Should a theory provide actionable guidance under uncertainty, or is that an external demand? This ties into decision theory but is necessary for regulators.

  Now, turning these into requirements. The anchoring dilemma requires a theory to extrapolate from humans to non-human cases without relying on shared hardware. Non-negotiable because without this, the theory can't be applied broadly.

  Discordance requires handling conflicting evidence with a hierarchy or integration method. Also non-negotiable; without it, contradictory data paralyzes decision-making.

  Ersatz-flexibility needs a falsification mechanism to exclude mimics. Non-negotiable to prevent false positives.

  Split-subject cases need clear ontological commitments. Non-negotiable for regulatory clarity.

  Distinguishing consciousness aspects is non-negotiable for precise policy application.

  The numbers problem: action-guidance under uncertainty might be a preference. Some theories might provide probabilities, others not. It's a desideratum but not core to the theory itself.

  Conflicts? Action-guidance under uncertainty might clash with scientific rigor. Also, privileging certain markers could conflict with pluralism. But these are tensions, not deadlocks.

  The hardest requirement is probably ersatz-flexibility, as it requires defining what consciousness isn't, which many theories struggle with.

  For the scorecard: Structure-first views (like neural correlates) might fail at ersatz-flexibility if they don't account for different architectures. Behavior-based approaches might handle discordance by weighing evidence but could be fooled by mimics. Functional views (like global workspace) need to show necessity and not just sufficiency. Pluralist approaches might lack clear hierarchies for discordance.

  Need to ensure each point addresses the user's need for interview arguments. Highlighting where theories fall short will help them challenge experts. Also, clarifying which requirements are non-negotiable versus preferences helps expose biases.
answer: |-
  Here’s a specification for a theory of consciousness fit for regulatory/policy purposes, derived from your breakdown points. Requirements are distilled to core demands, with non-negotiables flagged. I’ll then address usability requests and provide the scorecard.

  ---

  ### **Requirements for a Regulatory-Ready Theory of Consciousness**
  *(Non-negotiables in bold)*

  1. **Non-Human Anchoring Mechanism**  
     - **Must**: Provide a principled method to extrapolate from human ground truth to non-human cases *without requiring homologous neural structures*.  
     - *Case*: Human self-report anchors markers (e.g., pain behaviors), but octopuses (decentralized cognition) or bees (microbrain) lack analogous hardware. A theory must justify *why* certain non-human processes/behaviors map to consciousness despite structural divergence.  
     - *Non-negotiable*: Without this, the theory is human-exclusive or circular.  

  2. **Conflict Resolution Protocol for Discordant Evidence**  
     - **Must**: Specify how to weigh, integrate, or prioritize conflicting markers (e.g., trade-offs vs. analgesic response) and define if any marker is a *necessary condition* or veto.  
     - *Case*: Crustaceans show trade-offs but weak analgesic modulation; jellyfish have neural complexity but minimal behavior. A checklist fails here—e.g., is "trade-offs without pain relief" sufficient, insufficient, or irrelevant?  
     - *Non-negotiable*: Regulatory decisions require defensible thresholds amid noise.  

  3. **Falsification Criterion for Ersatz Flexibility**  
     - **Must**: Exclude non-conscious mimics (e.g., slime molds, RL agents) by identifying a *unique functional signature* of consciousness beyond adaptive behavior.  
     - *Case*: An octopus arm’s autonomy vs. the whole octopus; plants’ systemic signaling. The theory must explain why these lack subjective experience despite surface similarities to sentient behavior.  
     - *Non-negotiable*: Prevents false positives that would paralyze policy (e.g., banning herbicide use).  

  4. **Ontological Commitment for Ambiguous Subjects**  
     - **Must**: Define the *minimal unit* and *temporal boundaries* of consciousness (e.g., organism vs. colony, larval vs. adult stage).  
     - *Case*: Coral colonies, metamorphosing insects, or dormant tardigrades. A regulator needs to know *what* to protect (e.g., "only adult bees post-metamorphosis").  
     - *Non-negotiable*: Laws require clear subjects ("individuals" or "entities").  

  5. **Dimensional Demarcation**  
     - **Must**: Distinguish:  
       - (a) Presence/absence of consciousness;  
       - (b) Content (e.g., pain vs. pleasure);  
       - (c) Intensity/richness;  
       - (d) Moral weight.  
     - *Case*: Legislators conflate (a) and (d) (e.g., "more conscious = more protected"). The theory is only responsible for (a)–(c); moral weight is external.  
     - *Non-negotiable*: Prevents scientific overreach and clarifies policy scope.  

  6. **Action-Guidance Under Uncertainty (Preference, not Requirement)**  
     - *Should ideally*: Output probabilistic or tiered verdicts (e.g., "high evidence," "plausible," "negligible") for species with high-stakes populations.  
     - *Case*: Even 1% uncertainty for insects affects trillions. But this is a *decision-theoretic demand* (how to act on imperfect science), not inherent to the theory.  
     - *Preference*: Not core to the theory itself; a regulator can layer this post-theory.  

  ---

  ### **Usability Add-ons**
  - **Non-negotiables vs. Preferences**:  
    Requirements 1–5 are **non-negotiable** for any theory claiming regulatory adequacy. They address fundamental gaps in current debates. Requirement 6 is a **preference** often disguised as a constraint by urgency-focused lobbies (e.g., welfare advocates pushing precautionary principles).  

  - **Conflicts Between Requirements**:  
    Tension exists between **Falsification Criterion (#3)** and **Non-Human Anchoring (#1)**. To exclude mimics, #3 demands a narrow signature (e.g., "global workspace"), but #1 requires structural agnosticism. *Resolution*: #3 must yield—consciousness could manifest in non-human-exclusive architectures.  

  - **Most Damaging Requirement**:  
    **Falsification Criterion (#3)** eliminates the most theories. Many can identify correlates but fail to explain *why* slime molds don’t "count" without retreating to neural chauvinism or vitalism.  

  ---

  ### **Scorecard for Four Theory Types**
  *(Applied to the hardest requirement: **Ersatz-Flexibility Control #3**)*  

  1. **Structure-First (e.g., cortex-like neuroanatomy)**  
     - *Argument*: "Consciousness requires specific structures (e.g., layered cortex, thalamocortical loops). Slime molds lack these, so they’re out."  
     - *Squirm test*: "Why is a cortex necessary? Octopuses achieve complex cognition without one. Are you conflating mechanism with function?"  
     - *Verdict*: Fails #1 (human anchoring) and #3 (can’t explain octopus arms vs. whole octopus).  

  2. **Behavioral/Marker-Based (e.g., trade-offs, self-sacrifice)**  
     - *Argument*: "If it acts like it’s sentient (e.g., avoiding harm after injury), it is. Plants don’t learn from nociception; RL agents lack emotions."  
     - *Squirm test*: "An octopus arm ‘avoids’ harm—is it conscious? Your markers can’t distinguish reflexes from subjectivity."  
     - *Verdict*: Fails #3 (easily fooled by mimics) and #2 (no conflict resolution).  

  3. **Functional Organisation (e.g., global workspace, predictive processing)**  
     - *Argument*: "Consciousness integrates information accessibly. Slime molds lack a global ‘workspace’; plants don’t predict outcomes."  
     - *Squirm test*: "Define ‘integration.’ Bees solve novel problems with 1M neurons—does that count? Or is this just rephrasing human cognition?"  
     - *Verdict*: Struggles with #1 if defined too human-centrically, but best on #3 if functional criteria are strict.  

  4. **Pluralist/Weight-of-Evidence**  
     - *Argument*: "Use all evidence (neural, behavioral, evolutionary). If most markers align, it’s sentient. Mismatches? We need more data."  
     - *Squirm test*: "How do you arbitrate when markers clash (e.g., crabs show anxiety but ignore painkillers)? And why isn’t a plant’s signaling ‘evidence’?"  
     - *Verdict*: Fails #2 (no conflict protocol) and #3 (vague on excluding mimics). Popular for reviews precisely because it delays hard calls.  

  ---

  ### Key Insight for Your Piece  
  The **anchoring dilemma (#1)** and **ersatz-flexibility (#3)** expose a core tension: Theories either cling to human benchmarks (risking chauvinism) or overextend to non-conscious systems (risking absurdity). A regulator-ready theory must navigate this without metaphysics—e.g., by defining consciousness as *integrated, affect-lived experience* that serves an *evolutionary function* beyond mere adaptation. No current view fully clears this bar, which is why debates collapse into octopus anecdotes. Use this to press interviewees: "What *can’t* be conscious under your view, and why?"
