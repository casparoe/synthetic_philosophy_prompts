       - Choice irrelevant in 90% random-errors (Q4).  
       - Regrets choice in Plain case (Q5).  
     - *Key:* **Cannot separate CDT and EDT**—both give identical advice here ("switch" in Leaky, "don’t pay" in C, "pay" in D). They diverge in other problems (e.g., Newcomb), but not in this tree.  
     - *Advice:* "In Plain/Coin-Flip: Doesn’t matter. In Randomizer: Don’t pay if Death predicted coin; pay if not. In Leaky: Switch cities. In 90% random: Doesn’t matter."  

  7. **Ratifiability View**  
     - *Answers:* Q1 = D, Q2 = C:No/D:Yes, Q3 = B, Q4 = B, Q5 = B.  
     - *Profile:* Same as Leaf 6 except no regret in Plain case (Q5 = B).  
     - *Why:* Chooses only actions endorsable after knowing the outcome. In Leaky (fixed proxy), switching is ratifiable (you survive and don’t regret). In Plain, no ratifiable choice exists, so you might still pick arbitrarily.  
     - *Advice:* "Only choose options you’d endorse after seeing the result. In Plain: Pick either (neither is ratifiable). In Leaky: Switch. In Randomizer: Pay only for unsimulated coin (it gives 50% survival, which is ratifiable)."  

