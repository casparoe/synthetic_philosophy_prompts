                  - Then, the whole sentence is "not [ ... ]", so we place TOLERATE on the embedded content, which is [A is not wrong]? But that is not a normative content about A, it's about the sentence.

          This is getting very messy.

          Let's simplify the embedded contents: always [X is wrong] for some X. So the double negation:

              "It is not the case that (it is not the case that [A is wrong])"

          We treat this as two levels of embedding: the inner: [A is wrong] appears in "it is not the case that [A is wrong]" -> TOLERATE for [A is wrong]
          Then the outer: "it is not the case that ( ... )", where ... is a sentence that has been assigned TOLERATE? But our rule for negation is: for "it is not the case that [S]", we assign TOLERATE to the embedded content of the negation, which is S. But S here is "it is not the case that [A is wrong]", which is not a normative content about A, it's a sentence.

          We have to treat the entire embedded sentence as the content for the outer negation. But our markers are only for normative contents [X is wrong]. We are not assigning markers to sentences, only to the embedded normative claim [X is wrong].

          So in the double negation example, there is only one normative content: [A is wrong]. The double negation structure means:

              - The inner negation: assigns TOLERATE to [A is wrong]
              - The outer negation: what does it assign? The embedded content of the outer negation is the inner sentence, which is "it is not the case that [A is wrong]". We are not marking that sentence, only the normative content [A is wrong] within it. So the outer negation doesn't apply to [A is wrong] directly.

          Therefore, we might not be able to do double negation in this system.

          Given the complexity, let's focus on the ones that are doable.

          Revised list of 8 argument forms:

          We'll use situations A and B for simplicity. In each argument form, the players will choose which situations to use (or we assign).

          1. Simple atomic: 
              Premise: [A is wrong]
              Conclusion: [A is wrong]

          2. Atomic negation:
              Premise: [A is not wrong]   (i.e., "it is not the case that [A is wrong]")
              Conclusion: [A is not wrong]

          3. Modus ponens:
              Premise 1: If [A is wrong] then [B is wrong]
              Premise 2: [A is wrong]
              Conclusion: [B is wrong]

          4. Contraposition form 1:
              Premise: If [A is wrong] then [B is wrong]
              Conclusion: If [B is not wrong] then [A is not wrong]

          5. Contraposition form 2 (the converse of 4? Actually, classically they are equivalent. But we present them separately for the pair activity).

          6. Disjunctive syllogism:
              Premise 1: Either [A is wrong] or [B is wrong]
              Premise 2: [A is not wrong]
              Conclusion: [B is wrong]

          7. Nested negation and conditional:
              Premise: It is not the case that ( if [A is wrong] then [B is wrong] )
              Conclusion: [A is wrong]   [classically valid]

          8. Another nested: 
              Premise: It is not the case that ( if [A is wrong] then [B is wrong] )
              Conclusion: [B is not wrong]   [classically valid]

          9. Tolerance and atomic:
              Premise: [A is not wrong]   (which assigns TOLERATE to [A is wrong])
              Conclusion: It is not the case that [A is wrong]   (which also assigns TOLERATE to [A is wrong])

          But 9 is trivially valid.

          10. The torn card challenge: use a situation C for which one player is torn. Have an argument that uses [C is wrong] and see what happens when they assign TOLERATE (for the torn player) and DISAPPROVE (for the other player) in embedded contexts.

          Specifically, design an argument that classically is valid but with the markers might not be if they assign differently.

          Example: 
              Premise: If [C is wrong] then [B is wrong]
              Premise: [C is not wrong]   [which for the torn player, they might have assigned TOLERATE to [C is wrong] in the atomic? But atomic is fixed: [C is not wrong] assigns TOLERATE to [C is wrong] regardless of the player's attitude.

          So for embedded [C is wrong] in the conditional, the torn player might assign TOLERATE, and the other player (who disapproves) assigns DISAPPROVE. Then in the conditional, the markers are different.

          Then in the disjunctive syllogism with C.

          Let's do:

              Premise 1: Either [C is wrong] or [B is wrong]
              Premise 2: [C is not wrong]
              Conclusion: [B is wrong]

          For the torn player, in Premise 1, they might assign TOLERATE to [C is wrong] (because they are torn) and whatever for [B is wrong]. 
          Premise 2: [C is not wrong] -> TOLERATE for [C is wrong] (fixed).
          Then for the disjunction, if they treat it as: either I disapprove C or I disapprove B, then if I am torn on C, I don't disapprove C, so I must disapprove B. But classically, it's valid.

          But if the torn player assigns TOLERATE to [C is wrong] in the disjunction, then they might think: the first premise says either I disapprove C or I disapprove B. Since I don't disapprove C (I'm torn), then I must disapprove B. So they assign DISAPPROVE to the conclusion.

          The player who disapproves C: in the disjunction, they assign DISAPPROVE to [C is wrong] and whatever for B. Then Premise 2 is TOLERATE for [C is wrong]? But wait, if they disapprove C, then the atomic [C is not wrong] is something they wouldn't assert, but the rule says they must assign TOLERATE to [C is wrong] for the sentence "[C is not wrong]".

          Then for the disjunction, if they interpret it as requiring that one of the disjuncts has the marker that matches their attitude, then for the player who disapproves C, the first disjunct is DISAPPROVE (if they assign based on attitude) or whatever they assign. If they assign DISAPPROVE to [C is wrong] in the disjunction, then they are fine. They then see Premise 2 as TOLERATE, which doesn't match the DISAPPROVE they assigned to the disjunct? This is messy.

          Given time, let's finalize the list as:

          1. Simple atomic
          2. Atomic negation
          3. Modus ponens
          4. Contraposition: from "If A wrong then B wrong" to "If not B wrong then not A wrong"
          5. The other contraposition: from "If not B wrong then not A wrong" to "If A wrong then B wrong" (optional, or just do one)
          6. Disjunctive syllogism
          7. Nested: from "not (if A wrong then B wrong)" to "A wrong"
          8. Nested: from "not (if A wrong then B wrong)" to "B not wrong"
          9. Tolerance and negation: from "A not wrong" to "not (A wrong)" and vice versa (two separate or one) - but these should be fine.
          10. The torn one: use a disjunction with a torn situation.

          But to save, we can do 8 forms.

          Materials: 
                  - A set of cards for each pair, each card has an argument form with blanks for situations. They will use situation cards (A, B, C) to fill in.
                  - Situation cards: with short descriptions, e.g., "The council knocks down the playground", "Dr. X publishes the controversial paper", etc. Have at least 3-4 situations.

          Minute-by-minute timeline for 80 minutes:

          0-5 min: Introduction and setup. Divide into pairs. Explain the markers and the basic rules for atomic and negated atomic. Explain that for embedded occurrences, they must assign a marker (D, E, T) to each normative content in brackets. Explain the invariance rule: they will work in pairs with opposite attitudes, and if they disagree on the validity of the argument form, then it's invalid and they don't get a point. If they agree, they get a point. The goal is to score as many points as possible.

          5-10 min: Assign attitudes. Give each pair two attitude profiles for the situations (on a card). For example, for situations A, B, C:
                  Player 1: 
                      A: DISAPPROVE
                      B: ENDORSE
                      C: TORN
                  Player 2:
                      A: ENDORSE
                      B: DISAPPROVE
                      C: DISAPPROVE   [not torn, to have opposite on C?]

          But note: the torn card is for one player on one situation. So in each pair, for one situation (say C), one player is torn and the other is not.

          10-50 min: Game rounds. There are 8 argument forms. Give them about 5 minutes per form. In each round:
                  - The pair gets a card with the argument form.
                  - They choose which situations to use (or we assign to ensure they use the torn situation for some).
                  - Each player independently assigns markers to every embedded normative content in the argument (atomic are fixed by the rules) and then decides if the argument is valid (i.e., the premises markers, in the context of the argument, imply the conclusion marker).
                  - They then compare:
                          - If they both say valid or both say invalid, they get 1 point.
                          - If they disagree, they get 0 points.
                  - They record their points.

          50-70 min: Discussion in pairs: why did they disagree on some? Can they come up with a rule for embedded contexts that will make them agree on the validity of the argument forms? Give them 10 minutes to try to define a rule.

          70-75 min: Group discussion: ask for their experiences. Which forms caused disagreement? Why? 
                  - They should notice that for embedded contexts, if they used their own attitude, then on modus ponens they might have disagreed.
                  - For contraposition, they might have found that the two conditionals get assigned different markers and then they might have different validity verdicts.
                  - For the torn player, when they assigned TOLERATE in an embedded context, and the other player assigned DISAPPROVE, then the validity might change.

          75-80 min: Debrief: name the problem: the Frege-Geach problem. Explain that the unasserted occurrences of normative sentences need to express a content that is the same for speakers with different attitudes, otherwise validity becomes speaker-relative. Also, using a third state (tolerance) for negation breaks classical validities because tolerance and disapproval are not contradictories. Give an example from the game.

          What if they "solve" it by voting the arguments valid and then reverse-engineering a rule? 
                  - They might try to assign in embedded contexts always a neutral marker (TOLERATE) or always DISAPPROVE. But then they will see that in modus ponens, if the conditional's antecedent is TOLERATE, and the atomic premise is DISAPPROVE, then they don't match. 
                  - Or if they always use the atomic rule in embedded contexts, then for the conditional "If A is wrong then B is wrong", they would assign DISAPPROVE to both embedded contents, which for a player who endorses A is not what they would want.

          The game can't do: it can't model the structured higher-order attitudes (like disapproving of disapproving) that sophisticated expressivists use. In the debrief, you can say: "In the game, we only had flat attitudes. But real expressivists propose that in embedded contexts, the attitude is not a simple boo or hurray but a more complex attitude, such as being in a state of mind that is related to the attitude in the atomic case. For example, for a conditional, they might say it expresses a higher-order attitude of disapproval of the combination of disapproving the antecedent and not disapproving the consequent. But even then, there are challenges with neutrality and with complex embeddings."

          Failure modes:
          1. Someone smuggling in "wrong = has the property of wrongness": they might start talking about truth conditions. Intervention: redirect to the markers. "Remember, in this game, we are not talking about truth, only about the attitudes expressed. The marker is not a truth value, it's an attitude."
          2. The whole session turning into an argument about the word "wrong": they might start discussing what "wrong" means in different contexts. Intervention: "Let's focus on the markers and the assignment rules. We are using 'wrong' as a placeholder for any normative term. The issue is about the attitude expressed, not the word itself."

          Materials to prepare:
                  - For each pair: a set of 8 argument form cards.
                  - A set of situation cards (5-6 different situations).
                  - A set of markers (can be three differently colored paper chips, or just have them write D, E, T on paper).
                  - Attitude profile cards for players in a pair (two cards per pair).

          Example argument form card for modus ponens:

                  Premise 1: If [ ________ is wrong] then [ ________ is wrong]
                  Premise 2: [ ________ is wrong]
                  Conclusion: [ ________ is wrong]

          They fill in the blanks with situation letters from the situation cards.

          Similarly for contraposition:

                  Premise: If [A is wrong] then [B is wrong]
                  Conclusion: If [B is not wrong] then [A is not wrong]

          (Here, situations are fixed as A and B.)

          We can have some with fixed situations and some where they choose.

          Given the complexity, we might fixed the situations for the critical ones.

          This is a lot, but it should work.
answer: |-
  ### Metaethics Expressivism Embedding Problem Game  
  **Goal:** Simulate the embedding problem through a marker-based activity, forcing students to experience the breakdown of expressivism in unasserted contexts without naming the problem until debrief.

  ---

  ### **Materials**  
  1. **Marker Tokens** (per student):  
     - 10 red chips (DISAPPROVE)  
     - 10 green chips (ENDORSE)  
     - 10 blue chips (TOLERATE)  
  2. **Situation Cards** (12 unique scenarios, e.g.):  
     - "Council knocks down playground."  
     - "Dr. X publishes controversial paper."  
     - "City bans fossil fuels."  
     - "School suspends student for protest."  
  3. **Argument Form Cards** (8 forms, 1 per pair):  
     ```plaintext
     // SIMPLE ASSERTIONS (ROUNDS 1-2)
     1. [A] is wrong. → Conclusion: [A] is wrong.
     2. [A] is not wrong. → Conclusion: [A] is not wrong.

     // EMBEDDED CONTEXTS (ROUNDS 3-6)
     3. If [A] is wrong, then [B] is wrong.  
        Premise: [A] is wrong. → Conclusion: [B] is wrong.  
     4. If [A] is wrong, then [B] is wrong.  
        → Conclusion: If [B] is not wrong, then [A] is not wrong.  
     5. Either [A] is wrong or [B] is wrong.  
        Premise: [A] is not wrong. → Conclusion: [B] is wrong.  
     6. It is not the case that (if [A] is wrong, then [B] is wrong).  
        → Conclusion: [A] is wrong.  

     // ADVANCED (ROUNDS 7-8)
     7. [A] is not wrong.  
        → Conclusion: It is not the case that [A] is wrong.  
     8. It is not the case that (if [A] is wrong, then [B] is wrong).  
        → Conclusion: [B] is not wrong.  
     ```  
  4. **Attitude Profile Cards** (per pair):  
     - **Player 1:** "You DISAPPROVE of Situation A, ENDORSE Situation B, are TORN on Situation C."  
     - **Player 2:** "You ENDORSE Situation A, DISAPPROVE Situation B, are TORN on Situation D."  

  ---

  ### **Setup & Rules**  
  1. **Teams:** Divide into 7 pairs (14 students). Each pair gets:  
     - 1 Argument Form Card (rotate cards after each round).  
     - 12 Situation Cards.  
     - Marker tokens.  
  2. **Marker Rules:**  
     - **Atomic claim (asserted):** Assign DISAPPROVE/ENDORSE/TOLERATE based on your attitude.  
     - **Negation ("not"):** Place TOLERATE on the bracketed content (e.g., "not [A]" → TOLERATE on [A]).  
     - **Embedded claims (if-then, either-or, etc.):** Assign any marker (D/E/T) to the bracketed content.  
  3. **Validity & Invariance Rule:**  
     - An argument is "valid" if the premise-markers logically force the conclusion-marker (define "force" as intuitive entailment).  
     - **Critical:** Validity must be *invariant*—if Player 1 and Player 2 disagree on validity *due to their attitudes*, the argument is invalid. Pairs lose 1 point if invariance fails.  
  4. **Torn Rule:** Torn players **must** assign TOLERATE to their designated situation.  
  5. **Scoring:**  
     - +1 point if pair agrees on validity *and* invariance holds.  
     - 0 points if they disagree or invariance fails.  

  ---

  ### **Timeline (80 Minutes)**  
  - **0–10 min:** Explain rules, distribute materials. Emphasize: "Markers represent attitudes, not truth. Focus on the *rules*, not debating 'wrong'."  
  - **10–60 min:** **Game Rounds** (8 rounds, 6 min each):  
    1. Pairs draw an Argument Form Card and pick 2–3 Situation Cards (e.g., A, B, C).  
    2. Players **independently** assign markers to *each bracketed part* and judge validity.  
    3. They compare:  
       - If they agree on validity, check **invariance** (swap attitudes—would the other player’s markers change validity?).  
       - If invariant, score +1.  
    4. Rotate Argument Cards after each round.  
  - **60–70 min:** **Group Synthesis:**  
    - Pairs share: Which forms broke invariance? Why?  
    - Chart results: "Contraposition (Form 4) failed in __/7 pairs. Nested negation (Form 6) had no consistent marker in __/7."  
  - **70–80 min:** **Debrief** (Name the problem):  
    1. **Embedding:** "When you assigned markers to 'if [A]...' in Round 3, you felt the attitude story strain. That’s the embedding problem—expressivism works for assertions but fails inside conditionals/negations."  
    2. **Invariance:** "When Players 1 and 2 needed the *same marker* for [A] in Form 4 to preserve validity, you saw content must be identical across speakers—or validity becomes subjective."  
    3. **Negation Trap:** "TOLERATE as negation (Form 7) made 'not wrong' and 'wrong' contraries, not contradictories. That’s why contraposition (Form 4) and double negation (Form 8) broke—classical logic assumes mutual exclusion."  

  ---

  ### **Predicted Outcomes & Interventions**  
  - **Contraposition (Form 4):** Players will insist the sentences "say the same thing" but assign:  
    - *If [A] wrong then [B] wrong*: DISAPPROVE → DISAPPROVE (if they approve A).  
    - *If [B] not wrong then [A] not wrong*: TOLERATE → TOLERATE (since "not wrong" forces TOLERATE).  
    - **Result:** Markers differ → Invariance fails. They’ll see the sentences aren’t "identical" in the marker system.  
  - **Nested Monster (Form 6):**  
    - Premise: ¬(if [A] wrong → [B] wrong).  
      - Negation forces TOLERATE on the conditional.  
      - Conditional’s embedded [A] and [B] need markers—players will assign arbitrarily (e.g., DISAPPROVE).  
    - Conclusion: [A] wrong → DISAPPROVE.  
    - **Result:** No logical link between TOLERATE (premise) and DISAPPROVE (conclusion)→ Invalidity.  

  ---

  ### **When They "Solve" It**  
  Students will vote arguments "valid" and retrofit rules to win points. **Example:** "Let’s always assign TOLERATE to embedded claims!"  
  - **Your Move:** Trigger invariance: "Player 1, you DISAPPROVE of [A]—but in Form 3, if you assign TOLERATE to 'if [A] wrong...', does Player 2 (who ENDORSES [A]) agree the argument is valid? No? Invariance fails—lose a point."  
  - **Force Reflection:** "Does your rule make Form 4 (contraposition) valid? Show me the markers."  

  ---

  ### **Limitations & Failure Modes**  
  **1. The Game Can’t:**  
     - Model structured higher-order attitudes (e.g., "disapproving of disapproval"). Expressivists use these to handle embedding, but the flat markers prevent it.  
     - **Debrief Fix:** "Real expressivists invent complex attitudes (e.g., for 'if murder is wrong, then getting little brother to murder is wrong,' they say it expresses *disapproving of approving murder without approving getting little brother to murder*). But this feels ad hoc—why *that* attitude? And how does it validate logic?"  

  **2. Failure Mode: "Wrong = Property"**  
     - **Signs:** "But [A] *is* wrong—it has a property!" or markers assigned based on "truth."  
     - **Intervention:** Freeze the game. Restate: "Markers are *attitudes*, not properties. If I say 'I disapprove of [A],' that’s not about [A]’s properties—it’s about me. Reassign markers with that in mind."  

  **3. Failure Mode: Semantics Debate**  
     - **Signs:** Arguing about "what 'wrong' really means" instead of markers.  
     - **Intervention:** Redirect: "This isn’t about the word 'wrong'—it’s about the *attitude expressed*. Use Situation Card 3 and markers only. What does the *rule* say?"  

  ---

  **Final Note:** The game isolates the *problem*—real expressivism’s solutions require philosophical heavy lifting. Use the debrief to show why flat attitudes fail, then outline (without excusing) the complex moves expressivists make. The key is making them *feel* the problem first.
