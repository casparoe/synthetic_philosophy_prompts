answer: |-
  Here's a two-page research proposal structured for your fellowship application, focused on your core insight and designed for a mixed committee. It prioritizes clarity, stakes, and feasibility while respecting your ground rules.

  **Research Proposal: Counterfactual Payoffs vs. Evidential Signals – Untangling Rationality in Puzzling Decisions**

  **1. Core Question & Stakes (The "Why Anyone Cares" Part):**
  Decision theory aims to prescribe rational choices. Yet, puzzles like Counterfactual Mugging (CM) and XOR Blackmail (XOR) generate strong intuitions that seemingly conflict with standard theories (like Causal Decision Theory - CDT - or Evidential Decision Theory - EDT). The standard resolutions for both puzzles crucially rely on the *counterfactual* output of the agent’s decision procedure – what the agent *would have done* in a situation that didn’t occur. However, this proposal argues that the *role* played by this counterfactual output differs fundamentally between the two cases:
  *   **CM:** The counterfactual output *is the source of the payoff itself*. Paying $100 *now* is rationalized *because it is the algorithm that pays* which receives the large payoff ($10,000) *in the unactualized branch*. The payoff exists *because* of the counterfactual disposition.
  *   **XOR:** The counterfactual output *screens off evidence*. Refusing to pay *now* is rationalized *because the very existence of the letter (your evidence)* depended on your counterfactual disposition. Paying signals the bad news (likely having termites) that the letter's existence conveys.

  **The Crucial Gap:** Existing treatments often conflate these distinct roles ("counterfactual output as payoff source" vs. "counterfactual output as evidence screener"). This conflation masks potential fragility in the standard verdicts (Pay in CM, Refuse in XOR). **This project asks: What happens when these two distinct mechanisms are forced to operate simultaneously and potentially antagonistically via a single decision?** By constructing a rigorous hybrid case and systematically varying key parameters, we can:
  *   Test the robustness of standard resolutions.
  *   Reveal whether the conflation hides deeper inconsistencies or foundational disagreements.
  *   Clarify the *types* of reasons (evidential, causal, constitutive) relevant to rational choice in complex, predictor-involving scenarios.

  **Why This Matters:** Understanding the precise nature of rational obligation in these puzzles isn't just academic. It probes the foundations of rationality itself, especially relevant for:
  *   **AI Alignment:** How should highly capable AI systems, potentially using predictors or simulations, reason about counterfactual versions of themselves or others when making decisions affecting multiple branches or agents?
  *   **Normative Ethics & Institutional Design:** If rationality demands paying in CM (benefiting a counterfactual self/stranger) but refusing in XOR (avoiding bad evidence), what principles govern obligations to potential beings or information structures? Does rational consistency impose surprising demands?
  *   **Intertheoretic Dialogue:** This forces a clearer conversation between CDT, EDT, functional decision theories (like UDT/FDT), and causal-evidential hybrids, pinpointing *exactly* which assumptions drive their differing verdicts in cases where payoff-source and evidence-screener roles diverge.

  **2. The Method: Constructing and Probing the Hybrid Case (The "How" Part):**

  The core methodology is conceptual analysis and formal modeling, building a novel decision scenario:

  *   **Months 1-2: Hybrid Case Construction:** Design a scenario integrating both CM and XOR mechanisms into a single decision point. Example Structure:
      *   A predictor (accuracy `p`) assesses your disposition regarding paying a sum `X` if a rare event `E` (prob `q`) occurs.
      *   **Payoff Mechanism (CM-style):** If `E` *does not occur* (prob `1-q`), a beneficiary `B` receives a large sum `Y` *if and only if* the predictor judged you would pay `X` if `E` occurred.
      *   **Evidence Mechanism (XOR-style):** You are informed about the occurrence/non-occurrence of `E` *if and only if* the predictor judged that (You Pay | E) XOR (You Don't Pay | ~E) [or similar screening condition based on counterfactual disposition]. Crucially, learning `E` occurred is costly/bad news (e.g., implies a separate problem exists).
      *   You face the decision: If informed that `E` occurred, do you pay `X`?
  *   **Months 3-4: Formal Modeling:** Represent the hybrid case rigorously within decision-theoretic frameworks (CDT, EDT, FDT). Identify the key parameters: Predictor accuracy (`p`), probability of the rare event (`q`), stakes (`X`, `Y`), nature of the beneficiary `B` (copy of you, same-algorithm stranger, different-algorithm stranger), and the cost/badness of learning `E`.
  *   **Months 5-7: Parameter Variation & Analysis:** Systematically vary parameters to create tension:
      *   **Accuracy Sweep (`p`):** Does the "Refuse" verdict (driven by evidence screening) break down at high-but-imperfect `p` while the "Pay" verdict (driven by counterfactual payoff) holds until `p=1`? Or vice-versa?
      *   **Beneficiary Variation (`B`):** Does the rationale for paying (to secure `Y` for `B` in the unactualized branch) hold equally strongly when `B` is a copy of you, a stranger running identical code, or a stranger running different code? This directly tests the fundamentality of "counterfactual payoff as a reason".
      *   **Stakes & Probability:** How do changes in `q`, `X`, `Y`, and the cost of learning `E` shift the rational choice and the balance between the two mechanisms?
  *   **Months 8-10: Philosophical Interpretation & Drafting:** Synthesize results. What do the tensions reveal? Do standard theories offer coherent guidance? Does one mechanism consistently dominate? Does the analysis support a modified theory, reveal an irreconcilable conflict in intuitions, or necessitate a new category of reason (e.g., constitutive of agency)? Begin drafting the dissertation chapter. *(Teaching Months: Focus on literature review/refinement of formal models during heavier teaching loads; intensive analysis/writing during lighter periods.)*
  *   **Months 11-12: Completion, Integration & Failure Modes:** Finalize chapter. Integrate findings with the broader dissertation. Prepare for potential journal submission.

  **3. Existing Positions & Why They Leave This Open:**

  *   **FDT/UDT:** Advocates paying in CM and refusing in XOR. It leans heavily on the *algorithm's output* in the counterfactual branch. **The Gap:** FDT doesn't explicitly separate *why* the counterfactual output matters (payoff-source vs. evidence-screener). It treats both as instances of "logical control," but the hybrid case tests if this unified treatment holds when the *consequences* of that control conflict. Refusing to conflate the mechanisms questions whether FDT's "one move fits all" truly captures the distinct rational pressures.
  *   **CDT:** Typically refuses in CM (no causal link to payoff) and refuses in XOR (paying causes no harm but is correlated with the bad news). **The Gap:** CDT seemingly "gets" the evidence-screening reason in XOR but "misses" the counterfactual-payoff reason in CM. The hybrid case forces the question: If CDT's refusal in the hybrid is driven *only* by evidence-screening (ignoring the counterfactual payoff), is this satisfactory? Does it reveal a genuine limitation or a correct prioritization?
  *   **EDT:** Might pay in CM (paying is evidence you're the type who gets paid) but pays in XOR (paying is good news *if* you get the letter, ignoring the selection effect). **The Gap:** EDT struggles with both original puzzles. The hybrid case intensifies the challenge: Can EDT coherently weigh the conflicting evidential implications (paying signals good disposition for payoff *and* signals bad underlying state via the letter's existence)? Refusing to treat the counterfactual disposition as a *cause* of the evidence structure (the predictor's choice to inform) is key to EDT's confusion here.

  **4. Possible Conclusions & Deciding Factors:**

  1.  **Robust Standard Verdicts:** FDT's unified approach withstands the hybrid tension. Paying (or refusing) remains rational across variations, demonstrating the primacy of logical control over the distinction between payoff-source and evidence-screener. *Decider:* Consistency of FDT recommendations despite parameter changes pulling in opposite directions.
  2.  **Fragmentation:** The hybrid reveals an irreconcilable conflict. Rationality might demand paying for the counterfactual payoff *and* refusing to avoid bad evidence, indicating a fundamental tension or underspecification in decision theory. *Decider:* No single theory provides a coherent, non-ad-hoc prescription across the parameter space; strong intuitive pull in opposite directions persists.
  3.  **Dominant Mechanism:** One role (payoff-source or evidence-screener) consistently overrides the other under rational scrutiny (e.g., evidence-screening always trumps counterfactual payoffs for non-copies). *Decider:* Systematic collapse to verdicts driven primarily by one mechanism across variations; theoretical arguments establishing hierarchy.
  4.  **New Distinction Required:** The analysis necessitates recognizing "counterfactual payoff as a reason" as fundamentally distinct from "evidence about the world," requiring new theoretical machinery or principles. *Decider:* Inability of existing frameworks to capture the distinct normative force observed; compelling arguments for a new category of reason (constitutive, logical obligation).

  **5. What Counts as Failure & Project Scope:**

  *   **Failure Conditions:**
      *   **Incoherent Hybrid:** The constructed case fails to genuinely integrate both mechanisms in a way that creates clear, non-trivial tension between the CM and XOR rationales.
      *   **Collapse:** All variations robustly point to the same verdict (Pay or Refuse) for reasons fully explainable by existing theories without needing the payoff-source/evidence-screener distinction. The tension proves illusory.
      *   **Intractable Complexity:** The case becomes so convoluted that clear intuitions or formal modeling become impossible, yielding no interpretable results.
      *   **"Copies" Question Dominates:** Investigation reveals that the beneficiary variation (`B`) is the *only* significant factor, overwhelming the payoff-source vs. evidence-screener distinction. (See Scope below).

  *   **Project Scope - One Cohesive Project:** This is fundamentally **one project**. The core question – *how do the distinct roles of counterfactual outputs interact when forced into conflict?* – drives the hybrid construction and parameter variations. The "copies" question (`B`) is **not a distraction; it's an essential probe.** It directly tests the *foundation* of the "counterfactual payoff as reason" mechanism central to CM and FDT-style resolutions. Is this reason fundamentally about *yourself* (even counterfactually), about *algorithmic similarity*, or something more abstract? The hybrid case, especially varying `B`, makes this question unavoidable and provides the context to answer it rigorously *within* the investigation of the core distinction. **Do not split it off.** Resolving the nature of counterfactual payoffs is integral to understanding the tension. If `B` variation radically changes the verdicts, that's a *result* about the fragility of the payoff-source reason, not a sign of a different project.

  **6. Deliverable:** One dissertation chapter providing a novel analysis of rational choice under predictor-mediated counterfactual dependence, resolving the tension between payoff-source and evidence-screener roles through the construction and interrogation of a hybrid decision scenario. This chapter will challenge and refine existing decision-theoretic paradigms and clarify the normative foundations of rationality in complex, branching scenarios.
