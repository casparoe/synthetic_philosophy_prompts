  ### **Confidence Assessment**
  - **Highest Confidence**:  
    - Direct slaughter counts (Step 3). Source: USDA/industry data (variability <10%).  
    - Land use (Step 4). Source: Poore & Nemecek 2018 (highly replicated).  
  - **Medium Confidence**:  
    - Supply chain marginal effects (Step 2). Source: Econ studies (elasticity thresholds).  
    - Field animal exclusion (Step 7). Source: Negative utilitarianism consensus.  
  - **Lowest Confidence**:  
    - **Field animal death rates (Step 4)**. Source: Meta-studies (e.g., Fischer & Lamey 2018) vary by 10x due to regional practices and species counted. Least sure here—sensitivity analysis critical.

  **Procedure Weakness**: Relies on land-use data; if unavailable, committee judgment needed. Always present ranges to stakeholders.
