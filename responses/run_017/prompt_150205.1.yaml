prompt: |-
  I'm a staff-level software engineer and I host a fortnightly ideas slot for my part of the organisation: about a dozen backend and ML engineers, nobody with more philosophy than perhaps one survey course taken years ago, forty-five minutes, a whiteboard and a projector, and no assigned reading because nobody will do it. My turn is coming up and I want to spend it on the underdetermination of theory by evidence. I have read enough to know that the thesis comes in grades that I don't have stable names for: a weak grade, where the evidence available at a given time simply does not yet single out one theory and further data might; a strong grade, where two rivals agree on every observation anyone could ever make, so that no possible evidence could separate them; and a more global grade, where what the evidence bears on is not one hypothesis at a time but a package whose auxiliary assumptions can be given up to shield the hypothesis — the version I have seen called the Duhem–Quine point. Please do not explain the thesis to me. I want a plan for explaining it to them, and I want the plan to be built around our own material rather than around physics or the history of science.

  Concretely, I would like the following worked out.

  First, the dependency structure: which grade has to be on the board before the next one can mean anything, and which order prevents the strong grade from being heard as a restatement of the weak one. My instinct is that if I open with the weak grade they will all nod and the rest of the session will be lost, because they already believe it in the form "passing tests doesn't prove the absence of bugs."

  Second, the one example that carries the whole session. My candidate is a case from our own work: two candidate implementations of the same interface that provably agree on every input anyone could construct and run before the heat death of the universe, and disagree only on inputs of, say, 2^80 bytes or on inputs requiring more memory than the observable universe has particles. Call it the unreachable-input case if you like. Tell me what such an example must have and must lack to carry the strong grade rather than quietly collapsing into the weak one, whether it should be the hook at minute zero or the stress test at minute forty, and how I should handle the fact that we ourselves treat unreachable code as nonexistent — compilers delete it, we don't test it, we don't review it — which is either a decisive practical answer to the strong grade or a sign that our practice begs the question, and I can't tell which.

  Third, the misconception map, with the point in the sequence where each one should be headed off rather than merely answered at the end. The ones I expect: the slide from "the evidence doesn't force the theory" to "so any theory is as good as any other, it's all social"; the move of dissolving the problem by appealing to simplicity or other tie-breakers, which I suspect is too quick but can't say why; the colleague who will say that if two theories agree on all possible observations they are the same theory and the disagreement is merely verbal; and the colleague, more common in the ML half of the room, who holds that a theory just is a compressed representation of the data, so that there is nothing over and above the evidence for a rival to disagree about. If there are two or three further misconceptions that predictably form at exactly this level and not in a philosophy seminar, I want those more than the canonical ones.

  Fourth, where in the arc the session should stop being setup and say something contestable, and what that claim is; what I should openly refuse to explain at this level and announce as a refusal rather than fudging; and one question I can put to the room at the end such that the answer tells me whether the distinction between the grades has landed, together with what a confident, fluent, and wrong answer to that question would sound like.
reasoning: |-
  We are going to design a 45-minute session on underdetermination of theory by evidence, tailored to a group of backend and ML engineers. The goal is to avoid abstract philosophy and use concrete engineering examples. We'll proceed as follows:

  1. **Dependency Structure and Order of Presentation**: 
     - We will start with the **strong grade** of underdetermination (two theories that agree on all possible observations) to avoid the weak grade being dismissed as obvious. Then we'll move to the **weak grade** (current evidence doesn't single out one theory, but future evidence might) and finally the **Duhem-Quine point** (holistic underdetermination, where auxiliary assumptions can be adjusted to protect a hypothesis).

     Why this order?
     - Starting with the strong grade (which is less familiar and more provocative) will capture attention and set the stage for a deeper discussion.
     - If we start with the weak grade (which they already accept in the form of "passing tests doesn't prove absence of bugs"), they might tune out.
     - Then we show the weak grade as a more common, less radical version that they know, but now in a new light because of the strong grade.
     - Finally, the Duhem-Quine point, which is more complex, can be introduced by showing how in practice we often adjust auxiliary assumptions (like test setup, data preprocessing, etc.) to protect a core idea.

  2. **The Central Example: The Unreachable-Input Case**:
     - We will use the example you proposed: two implementations of the same interface that are provably equivalent on all inputs that can be physically run (due to constraints of the universe) but differ on some inputs that are physically impossible to run (e.g., input of size 2^80 bytes).

     What the example must have to carry the strong grade:
     - The two implementations must be observationally equivalent for every input that is physically possible to run (now and forever). 
     - They must differ only on inputs that are impossible to run (due to resource constraints).
     - The example must not rely on future data that might become available (which would make it weak underdetermination). The key is that no evidence can ever distinguish them.

     Why this example?
     - It is concrete and from their domain.
     - It forces the issue: if two programs are indistinguishable by any possible test we can run, are they the same program? Or can we still say one is "correct" and the other "buggy" in some sense?

     Placement in the session: 
     - **Hook at minute zero**: Start with this example. Present it as a puzzle: "We have two implementations that pass every test we can possibly run, but they are different. How do we choose? Or are they the same?"

     Handling the practical stance (unreachable code is treated as nonexistent):
     - Acknowledge that in practice, we do delete unreachable code and don't test it. But then ask: 
       - Does that mean we are defining correctness only with respect to the possible inputs? 
       - If so, then the two implementations are equivalent in practice. But then what about the theoretical difference? 
       - Is our practice of ignoring unreachable code a pragmatic choice or does it reflect a deeper truth about what programs mean?
     - Point out that this practical stance might be begging the question: we are defining the set of relevant inputs by what we can run, then saying the programs are equivalent because we only care about that set. But the strong underdetermination thesis says that even if we agree on all observations, there might be two distinct theories (here, two distinct programs) that are empirically equivalent.

  3. **Misconception Map and When to Address**:
     We'll address misconceptions at the point they are likely to arise.

     a. **"If two theories agree on all possible observations, they are the same theory; the disagreement is merely verbal."**
        - When: After presenting the strong grade example.
        - How to head off: 
          - Ask: "Are these two programs the same? They have different source code. They might have different performance characteristics on the unreachable inputs? But wait, we can't run those. Does that matter?"
          - Argue: The two programs are different mathematical objects (they compute different functions if we consider the entire domain) but they are the same when restricted to the physically possible inputs. However, the strong underdetermination thesis says that the evidence (the set of possible observations) cannot tell us which function we are dealing with (the one that behaves one way on unreachable inputs or the other). So, the theories (the programs) are distinct, even if we cannot observationally distinguish them.

     b. **The slide to relativism: "So any theory is as good as any other, it's all social."**
        - When: After discussing the strong grade and before moving to the weak grade.
        - How to head off: 
          - Emphasize that underdetermination does not imply that all theories are equally good. There are other criteria: simplicity, consistency with other theories, explanatory power, etc. But note: these are not dictated by the evidence alone. They are pragmatic or aesthetic.

     c. **Appealing to tie-breakers (like simplicity) too quickly**:
        - When: When discussing how to choose between the two programs in the example.
        - How to head off: 
          - Point out that while we do use simplicity (e.g., we prefer the shorter, clearer program), that criterion is not forced by the evidence. It's a value we bring. We might choose the simpler one, but that doesn't mean the simpler one is more likely to be "true" in the sense of matching the unreachable inputs (if we could run them). It's a practical choice.

     d. **The ML view: "A theory is just a compressed representation of the data, so there is nothing to disagree about."**
        - When: After the strong grade example, especially when discussing ML models.
        - How to head off:
          - Argue: Even in ML, two different models (with different internal structures) can have the same predictions on all possible data we can collect. But they might generalize differently on data that we cannot collect (like the unreachable inputs). The model is more than the data: it's a function defined on the entire input space. But if we can never see the difference, then what does it mean to say one is better? Again, we use regularization (simplicity) to choose, but that's a pragmatic choice.

     Additional misconceptions that might arise in an engineering context:

     e. **"If we can't observe it, it doesn't exist."** (operationalism)
        - When: During the discussion of the strong grade example.
        - How to head off: 
          - Point out that in engineering, we often design systems that have components which are not directly observable (e.g., internal states). We infer their existence from the behavior. But the strong underdetermination example challenges this: the two programs have different internal states for unreachable inputs, but we can't observe them. Does that mean the internal state doesn't exist? Or that we shouldn't care? But note: we do care about the source code and its maintainability, even if the behavior is the same.

     f. **"We can just define the specification to be the set of observable behaviors, so the two implementations are both correct."**
        - When: After presenting the example.
        - How to head off:
          - Acknowledge that this is what we do in practice. But then the underdetermination problem is pushed to the specification: why did we choose that specification? Because it matches our observations? Then the specification itself is underdetermined by the evidence (if we think of the specification as a theory of what the program should do).

  4. **Arc of the Session and Contested Claim**:

     - **Minutes 0-15**: Present the strong grade with the unreachable-input example. Let them wrestle with it. 
     - **Minutes 15-25**: Address the weak grade by contrasting it: "Now, this is different from the situation where we just haven't run enough tests. In that case, we can imagine running more tests to decide. But in our example, we can't." Give an example from their work: a bug that only appears under extreme conditions that we haven't tested yet (but could test). This is weak underdetermination. They know this, so it's quick.
     - **Minutes 25-35**: Introduce the Duhem-Quine point. Use an example from their work: when a test fails, we don't know if it's the main code or the test environment (auxiliary assumptions). We might adjust the test environment to protect the main code. Or in ML: when a model fails on a test set, we might blame the data preprocessing (an auxiliary) rather than the model architecture.

     - **Contested Claim (around minute 35)**: 
          - "In engineering, we often treat two programs that are observationally equivalent (on all possible runs) as the same. But this is a pragmatic choice, not a truth forced by the evidence. There is no fact of the matter about which one is 'correct' for the unreachable inputs, because we can't run them. This means that our notion of correctness is tied to our ability to observe."

     - **What to refuse to explain**: 
          - We won't delve into the deep philosophical debates about realism vs. anti-realism. We are focusing on the engineering implications.

     - **Closing Question (at minute 40)**:
          - "In the unreachable-input example, if we can never run the inputs on which the two programs differ, does it matter which one we use? And if we choose one over the other, are we making a choice that goes beyond the evidence?"
          - A confident, fluent, and wrong answer would be: 
            - "No, it doesn't matter because we can't run those inputs, so the programs are effectively the same. We can choose arbitrarily or by simplicity, but that's just for our convenience, not because one is really better." 
            - Why it's wrong? It misses the point that the two programs are different mathematical objects and that our choice is not dictated by evidence. It also might conflate the strong and weak grades (if they think we might one day run the inputs, which we can't).

          - What we want to hear: 
            - An acknowledgment that the evidence (possible tests) cannot decide between the two, so any choice must be based on non-evidential criteria (like simplicity, maintainability, etc.), and that this is a case where evidence underdetermines the theory (strong grade).

  **Detailed Plan**:

  - **0-5 min**: Hook with the unreachable-input example. Present two functions (pseudocode):

        def f1(x: bytes) -> int:
            if len(x) < 2**80:
                return 1
            else:
                return 0

        def f2(x: bytes) -> int:
            return 1

    - Both return 1 for any input we can run (since we can't create an input of 2^80 bytes). But they are different. How do we know which one is correct? The specification says: "return 1 for all inputs". But wait, what if the specification is ambiguous? What if the specification says: "return 1 for all inputs that the system might receive"? Then both are correct? But note: the specification might be intended to cover all inputs, even the unreachable ones.

  - **5-15 min**: Deepen the strong grade. Discuss: Why do we care about the unreachable branch? Maybe because of code maintenance, or because the code might be reused in a context where the input is reachable? But in this context, it's not. So are they the same? 

  - **15-25 min**: Weak grade. Example: a function that has a bug that only occurs on February 29th. We haven't tested that yet. We know we could test it. Contrast with the unreachable case.

  - **25-35 min**: Duhem-Quine. Example: A test fails in a distributed system. Is it the application logic or the network setup? We might tweak the network configuration and re-run the test. Or in ML: a model fails on a test set. Is it the model or the data preprocessing? We adjust the preprocessing.

  - **35-40 min**: Contested claim and discussion.

  - **40-45 min**: Closing question and wrap-up.

  This plan should engage the engineers with familiar examples and challenge them to think about the limits of evidence in their work.
answer: |-
  ### Plan for the Session on Underdetermination of Theory by Evidence

  #### **Dependency Structure and Order**  
  Present the grades in this sequence to prevent conflation and ensure clarity:  
  1. **Strong grade first** (0–15 min): Start with two theories that agree on *all possible* observations. This is non-obvious and provocative—engineers rarely consider *logically possible but physically impossible* tests. If you open with the weak grade ("we need more tests"), they'll nod and disengage. The strong grade forces them to question what "evidence" even means when no test can distinguish theories.  
  2. **Weak grade next** (15–25 min): Show theories that agree on *current* evidence but *could* be distinguished with future data. Now the strong grade frames this: Weak underdetermination is a temporary, practical challenge; strong is permanent and metaphysical.  
  3. **Duhem-Quine last** (25–40 min): With both grades established, introduce global underdetermination—evidence tests a *whole system* (code + environment + assumptions), not isolated hypotheses. Engineers already do this (e.g., blaming tests instead of code), so it feels familiar but deeper.  

  **Why this works**: Strong grade first disrupts complacency. Weak grade then feels like a special case ("Oh, this is just the *solvable* version"). Duhem-Quine becomes the pragmatic synthesis.  

  ---

  #### **The Central Example: Unreachable-Input Case**  
  **What the example must be**:  
  - Two implementations of an interface (e.g., a hash function or validation logic) that:  
    - **Agree on every input physically possible to construct/run** (e.g., inputs ≤ `2^60` bytes due to cosmic particle limits).  
    - **Disagree only on inputs that are physically impossible** (e.g., `≥2^80` bytes).  
  - **Provably equivalent** under real-world constraints (e.g., formally verified for all feasible inputs).  

  **What it must avoid**:  
  - No escape hatches like "Maybe we'll invent a quantum computer that runs it." Stress: *No future data can resolve this*.  
  - **Not weak grade**: Distinguish by emphasizing physical limits (e.g., "The observable universe lacks particles to represent this input").  

  **Placement: Hook at minute zero**  
  - Open cold: *"We have two implementations. Both pass every test we can run now or in the future. But they’re different. Which is correct?"*  
  - **Handling the "unreachable code is dead" practice**:  
    - Acknowledge: "Yes, compilers delete unreachable code. We ignore untestable cases."  
    - Challenge: "But does that mean correctness is *defined by* what we can test? Are we saying there’s no fact of the matter—or just that we don’t care?"  
    - Engineer the tension: This practice **begs the question**. We dismiss untestable cases *because* we assume evidence determines truth. But the strong grade asks: *What if evidence can’t?*  

  ---

  #### **Misconception Map and Mitigation**  
  Preempt these *during* the relevant grade—not at the end:  

  | Misconception | When to Address | How to Head Off |  
  |---------------|-----------------|----------------|  
  | **"If no evidence distinguishes them, the theories are identical"** (common in backend) | During strong grade (min 5) | *"Two programs can have different source code but identical I/O. Is the difference ‘merely verbal’? What if one is inefficient or buggy on unreachable inputs? Does that matter if we can’t observe it?"* |  
  | **"So any theory is as good as any other"** (relativism) | After strong grade (min 10) | *"Underdetermination doesn’t mean ‘anything goes.’ We still use simplicity, coherence, or maintainability—but these are *our* values, not evidence."* |  
  | **"Simplicity breaks the tie"** (premature resolution) | During weak → strong transition (min 20) | *"Simplicity helps us choose, but it doesn’t make one theory ‘truer.’ What if the complex theory is right? Evidence doesn’t care about Occam’s Razor."* |  
  | **"A theory is just a compression of data"** (ML view) | During weak grade (min 18) | *"Two ML models can have identical accuracy on all train/test data but different internals (e.g., decision trees vs. neural nets). If they generalize identically on *all possible* data, is there a difference? Or is the ‘compression’ itself part of the theory?"* |  
  | **"But we can test it in theory"** (collapsing strong to weak) | During strong grade (min 7) | *"Cosmic limits aren’t about funding or time. No device in this universe *can* run the test. Is ‘theoretically testable’ enough if it’s physically impossible?"* |  
  | **"This is irrelevant—we only care about observable behavior"** (operationalism) | During strong grade (min 12) | *"Fair! But then: Is the *specification* defined only by observable behavior? What if the spec says ‘must work for all inputs’? Are we redefining correctness to avoid the problem?"* |  

  **Key non-philosophy misconceptions**:  
  - **"Untestable differences are tech debt"** (min 10): Engineers might reframe unreachable inputs as "bad code." Response: *"But what if the difference is fundamental? E.g., one uses a provably secure algorithm for unreachable cases, but we can’t verify it. Does ‘clean code’ resolve truth?"*  
  - **"Evidence includes static analysis"** (min 8): Some may argue formal verification "observes" unreachable paths. Response: *"Static analysis reasons about *possible* executions, but the strong grade applies to *physically impossible* ones. Does math count as ‘evidence’?"*  

  ---

  #### **Contestable Claim, Refusals, and Closing Question**  
  - **Where to get contestable** (min 30): During Duhem-Quine. Claim: *"When a test fails, you blame the code, tests, or environment. But that choice isn’t dictated by evidence—it’s a negotiation. You could always protect your code by changing auxiliaries."*  
  - **What to refuse** (min 5/30):  
    - *"I won’t discuss quantum mechanics or ancient Greeks—we’ll use our work."*  
    - *"I won’t resolve if truth exists beyond evidence—that’s metaphysics. We’re here to see how evidence underdetermines choice."*  
  - **Closing question** (min 42):  
    - *"In the unreachable-input case: Should we care which implementation we use? Why?"*  
    - **Confident but wrong answer**: *"No—they behave identically in practice. Pick the simpler one and move on."*  
      - Why it’s wrong: Misses that the strong grade makes simplicity a *pragmatic choice*, not evidence of truth. Ignores that "identical in practice" assumes evidence defines correctness.  
    - **What you want**: Recognition that evidence doesn’t decide—values (simplicity, safety) do. E.g., *"We care because unreachable code might affect formal properties, or because we value consistency with the spec, even if untestable."*  

  ---

  ### **Session Flow (45 Min)**  
  - **0–5 min**: Hook with unreachable-input example. Pose the puzzle.  
  - **5–15 min**: Strong grade explained via the example. Preempt misconceptions.  
  - **15–20 min**: Weak grade (e.g., a bug found only after 1M requests). Contrast with strong.  
  - **20–30 min**: Duhem-Quine with an engineering example (e.g., test flakiness blamed on env vs. code).  
  - **30–40 min**: Contestable claim + discussion. Force them to take sides.  
  - **40–45 min**: Closing question + wrap-up.  

  **Why this works for engineers**: It starts with code they write, avoids philosophy jargon, and leverages their instinct for practical tradeoffs. The unreachable-input example is the spine—it’s extreme enough to resist collapsing into the weak grade but grounded in their reality.
