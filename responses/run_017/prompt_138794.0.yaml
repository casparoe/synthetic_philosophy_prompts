  ## Paper to the Trustees of the Marchmont Trust: Reforming the Small-Grants Stream

  **Date:** 7 March 2024
  **Prepared For:** Trustees' Away Day, 14 March 2024
  **Author:** [Your Name/Trustee Designation]
  **Subject:** Proposal for Replacing the Outcomes Metric in Small-Grants Decisions: Analysis and Recommendations

  **1. Introduction**
  This paper addresses the critical shortcomings identified in our small-grants stream (c. 200 awards <£50k p.a.). The current outcomes-based ranking metric, while promoting efficiency, has demonstrably failed: it incentivises gaming and, more damagingly, systematically excludes organisations working with the most vulnerable and chaotic young people – the very groups our mission prioritises. The Director of Programmes (DoP) has proposed replacing this metric with an AI-driven "endorsement procedure". This paper analyses the proposal, examines the serious concerns raised, proposes a clear path forward with verifiable conditions, and addresses the fundamental challenge of monitoring and evaluation.

  **2. The Current Problem: Why Change is Essential**
  Our small-grants system faces two intertwined failures:
  *   **Gaming the Metric:** Providers distort activities to meet the "sustained engagement at 12 months" target cheaply (e.g., redefining engagement as a single text message). This undermines impact and trust.
  *   **Exclusion of Critical Work:** Organisations specialising in the most complex needs cannot reasonably guarantee 12-month outcomes. Consequently, they no longer apply. This means we are funding measurable activity, not necessarily the most needed or impactful work. **We are failing our core mission in this stream.**

  The efficiency of the current system (one officer + one trustee) is a necessity, but the metric driving it is flawed. Maintaining the status quo is unacceptable.

  **3. The Director of Programmes' Proposal: AI-Based Endorsement**
  The DoP proposes:
  1.  **Anonymised Applications:** Removing applicant name, charity number, and past track record. Retaining region, amount, and activity description.
  2.  **AI "Endorsement" Ranking:** Using a language model trained *solely* on the Trust's 12 years of grant decisions and written reasons. The model answers: "Is this the sort of thing the trustees would endorse?"
  3.  **Human Decision on Top Band:** The programme officer and trustee review the top-ranked applications (as determined by the AI's endorsement score) and make final decisions.
  4.  **Optional "Annual Report" Reframing (Wrinkle):** Describing the application *as if reporting its successful outcome* in next year's annual report, aiming for post-hoc honesty.

  **Aim:** To prioritise applications aligning with the Trust's historical judgment and values, moving beyond the distorting outcomes metric, while retaining efficiency.

  **4. Serious Concerns: Robustly Stated**
  The board's reservations are profound and demand careful consideration:

  *   **Concern 1: Learning Bias, Not Wisdom:** "A model trained on our past decisions will learn to predict our approval, not the reasons we take ourselves to have — and our past approvals were themselves partly shaped by a metric we now disown."
      *   **Strongest Case:** The AI will inevitably encode the biases, compromises, and crucially, *the influence of the very outcomes metric we now reject* present in our historical data. It risks perpetuating past errors and the exclusionary tendencies we seek to escape, simply in a new, opaque form. It learns *what we funded*, not necessarily *why we should have funded it* or *what we wish we had funded*. Historical data is not pure "wisdom"; it's a record potentially contaminated by the flawed system we are abandoning.

  *   **Concern 2: Gaming Shifts, Not Disappears:** "Once applicants know a model ranks them, the gaming does not go away, it moves."
      *   **Strongest Case:** Removing the cost-per-outcome target doesn't eliminate the incentive to present applications favourably. Applicants will adapt language, structure, and framing to appeal to the perceived preferences of the AI model ("AI-washing"). The whistleblower revealed gaming *under the old system*; we have no reason to believe similar manipulation won't occur, becoming harder to detect as it targets an algorithm's patterns rather than a numerical target. The two suspect applications this year are a clear early warning sign.

  *   **Concern 3: The Ground Truth Vacuum - How Do We Know It's Better?** "Because we cannot monitor small grants individually, we have no ground truth. If endorsement replaces the metric, how would we ever find out whether it is doing better, rather than replacing a failed proxy with an unmeasurable one we cannot audit?"
      *   **Strongest Case:** This is the most fundamental challenge. The core failure of the old system was its disconnect from true impact due to lack of monitoring. The new proposal offers no inherent mechanism to rectify this. Without individual monitoring (which is resource-prohibitive), how do we assess if "endorsement" leads to funding more impactful or more needed work than the old metric? We risk replacing one flawed, measurable proxy (cost-per-outcome) with another flawed, *immeasurable and unauditable* proxy (AI-predicted endorsement). We could be flying blind, relying solely on intuition or anecdotes.

  **5. Analysis: The "Approval-Directed vs. Goal-Directed" Framing**
  One trustee framed this as a choice between "approval-directed" (predicting trustee approval) and "goal-directed" (optimising for mission impact) systems.
  *   **Does it earn its keep?** **Partially.** The proposal is explicitly "approval-directed" – it predicts *our past behaviour*. A truly "goal-directed" system would require defining and measuring the actual outcomes we desire for care leavers – precisely what we lack the capacity to do for individual small grants.
  *   **Is it merely a relabeling?** **No.** The framing usefully highlights the core tension: the proposal addresses the *symptom* (exclusion) by changing the selection mechanism but does not solve the underlying *disease* (lack of outcome data). It clarifies that without addressing the ground truth vacuum, *any* proxy (metric or AI endorsement) is fundamentally disconnected from our ultimate goals. The framing underscores Concern 3.

  **6. Addressing the Monitoring Problem: Building Ground Truth**
  Adopting the proposal *without* addressing monitoring is irresponsible. We must create mechanisms to generate evidence. **Recommendation:** If we adopt the AI endorsement, we *must simultaneously* implement a **Light-Touch Monitoring & Evaluation (M&E) Pilot** for a representative sample of small grants.

  *   **Proposed M&E Pilot:**
      1.  **Sample:** 15-20% of small grants (30-40 grants p.a.) randomly selected, stratified by region/grant size/AI endorsement score band.
      2.  **Method:** Standardised, lightweight feedback collected 12-15 months post-award:
          *   **Provider Self-Assessment (Digital Form):** Simple template: Key activities delivered? Number of young people reached? Key challenges encountered? Unexpected benefits? *Qualitative evidence of impact* (2-3 brief case anecdotes/stories). Did the project feel aligned with Trust goals?
          *   **Youth Feedback (Optional/Anonymous):** Short, accessible online survey or facilitated group discussion (depending on provider capacity) focusing on: Did they feel supported? Was the service useful? Would they recommend it?
      3.  **Analysis:** Trust programme staff synthesise findings annually. Look for patterns: What types of work show promising qualitative impact? Are certain regions or project types struggling? Does the *reported experience* align with the *predicted endorsement* and the *original application promise*? Are excluded organisations now participating and what are their experiences?
      4.  **Cost:** Modest staff time for coordination, template development, and synthesis. Potential small incentive for providers/youth participating in feedback.
      5.  **Timeline & Checkpoints:**
          *   **By 1 May 2024:** Pilot design finalised by DoP.
          *   **From 1 June 2024:** Pilot integrated into grant agreements for selected new awards.
          *   **31 January 2025:** Interim report on pilot setup and initial feedback mechanisms.
          *   **30 November 2025:** First Annual Synthesis Report presented to the Board.
          *   **Away Day 2026:** Formal review of AI system + Pilot findings, leading to decision on continuation, modification, or abandonment.

  **This pilot provides the essential "ground truth" data.** It allows us to compare the AI's predictions and our decisions against *some* evidence of real-world experience and perceived impact. It is not perfect individual monitoring, but it is a feasible, auditable step towards accountability and learning.

  **7. Recommendations and Voting Options**
  Based on the analysis above, the status quo is untenable. The AI proposal offers a potential path away from the exclusionary outcomes metric but carries significant risks, primarily the perpetuation of bias and the lack of inherent evaluation. The essential companion is the M&E Pilot to build ground truth.

  *   **Option 1: Reject the Proposal.**
      *   *Pros:* Avoids AI risks and complexity; no new system to implement.
      *   *Cons:* Leaves the exclusionary and gameable metric in place; fails to address core mission failure in the small-grants stream. **Not recommended.**

  *   **Option 2: Adopt the Proposal Unconditionally.**
      *   *Pros:* Moves decisively away from flawed metric; leverages Trust history efficiently.
      *   *Cons:* Ignores serious Concerns 1-3; lacks mechanism to validate success or detect failure/gaming; risks embedding historical biases; fails to address ground truth vacuum. **Not recommended.**

  *   **Option 3: Adopt the Proposal Subject to Conditions (RECOMMENDED).**
      *   *Pros:* Addresses the urgent need to replace the flawed metric while actively mitigating key risks; builds essential evaluation capacity; provides a clear review mechanism.
      *   *Cons:* Adds complexity (AI + M&E Pilot); requires resource commitment for M&E; AI risks remain but are actively managed.
      *   **Conditions:**
          1.  **M&E Pilot:** Implementation of the Light-Touch Monitoring & Evaluation Pilot as described in Section 6, with the named deadlines (Pilot design by 1 May 2024, Interim report 31 Jan 2025, Full Synthesis Report 30 Nov 2025).
          2.  **AI Model Scope & Transparency:**
              *   The model is trained *only* on anonymised application text and corresponding Trust decision/reasons from the pre-metric era (if sufficient quality exists) *and* the metric era, with clear documentation of the dataset limitations.
              *   The DoP provides a simple, non-technical memo (by 1 June 2024) explaining how the model works, its limitations (bias risk), and how anonymisation is rigorously applied.
              *   The "Annual Report" wrinkle is **not adopted initially** due to complexity and potential for introducing new bias; it can be revisited later.
          3.  **Human Oversight & Anti-Gaming:**
              *   The programme officer and trustee retain full discretion to reject *any* application from the AI's top band and must document the reason if they do so.
              *   Programme officers are instructed to flag any application suspected of "AI-washing" for explicit discussion with the trustee on the call.
          4.  **Sunset Clause & Review:** The AI system is adopted for a **maximum of two years**, pending the review at the 2026 Away Day based on the M&E Pilot findings, operational experience, and evidence of reduced exclusion.

  **8. Conclusion**
  The current outcomes metric for small grants is broken, harming our mission by excluding vital work. The AI endorsement proposal presents a compelling alternative to prioritise alignment with our values and history efficiently. However, its risks – particularly perpetuating bias and operating without ground truth – are substantial and cannot be ignored.

  The recommended path (**Option 3: Adopt Subject to Conditions**) provides a responsible way forward. It replaces the harmful metric while mandating the essential mechanism (the M&E Pilot) to begin generating evidence of real-world impact and alignment. The conditions ensure transparency, human oversight, and a built-in review before any long-term commitment. The "approval-directed" nature of the AI is acknowledged, but the M&E Pilot introduces a crucial feedback loop towards understanding our goals.

  We have an opportunity to reform this stream to better serve the most vulnerable care leavers. Let us act decisively, but with the necessary safeguards and commitment to learning.

  ---

  **Bottom Line for Vote at Away Day:**

  *   **Reject the Director of Programmes' proposal.**
  *   **Adopt the Director of Programmes' proposal unconditionally.**
  *   **Adopt the Director of Programmes' proposal SUBJECT TO the following conditions (RECOMMENDED):**
      1.  Implementation of the Light-Touch M&E Pilot as described, with reports by 31 Jan 2025 and 30 Nov 2025.
      2.  AI model scope limited as described, with transparency memo by 1 June 2024; "Annual Report" wrinkle not adopted initially.
      3.  Explicit retention of human discretion to reject AI top-band proposals and flag potential gaming.
      4.  System sunset and mandatory review at 2026 Away Day.

  ---
  **Word Count:** Approx. 1,150 (Slightly over target to ensure clarity on complex points, but can be trimmed if essential)
