prompt: |-
  you're a philosopher of language who's also spent a couple of years doing annotation QA at an AI eval company, so you've watched a lot of rubric writers make the same mistakes in slow motion. Please think carefully about this one, and do a bit of brainstorming before you write anything (keep the brainstorm to yourself, I just want the results of it).

  Here's my situation. I run onboarding for new rubric writers. They grade model responses to open-ended user questions, and every response gets one of three verdicts: Supported, Unsupported, or Declined. In two weeks I have a 75-minute slot, and I want to spend it teaching them Grice -- what is said vs. what is implicated, and speaker meaning vs. whatever the sentence itself means -- but as a tool for picking a verdict, not as a doctrine to admire.

  The reason it matters: my annotators keep making two opposite errors. Half of them mark a response Unsupported for things it never literally said but definately suggested (I've started calling these "shadow commitments" -- stuff the response is on the hook for only by way of implicature). The other half let responses slide as Supported because "it didn't actually say that," which means hedged falsehoods and polite refusals-that-don't-say-refusal sail right through. Same rubric, opposite failures, and I think both come from not having the said/implicated distinction available as a thing to point at.

  Don't explain Grice to me. Plan how I teach it. Specifically:

  The order the pieces have to go in, and what depends on what. My instinct is that speaker meaning has to land before I split said from implicated, because otherwise they'll just file implicature under "hidden extra sentence meaning" and nothing will change about how they grade. Tell me if I've got that backwards.

  The one example that should carry the whole session. Constraints: it has to be a plausible real model output from their queue (a short answer to an actual user question, not a philosopher's parlor case), and it has to be a case where the literal content and the implicature pull in different directions -- say which direction is more useful to open with, true-literal/false-implicated or the reverse -- and where the verdict genuinely flips depending on how you treat the implicature. Also: tell me why NOT to use the two chestnuts that show up in every explainer, the job reference letter that only praises the applicant's handwriting and the some-of-the-students-passed line. I know them, they're fine, I want to know what's specifically wrong with them for *this* room.

  The misconceptions, when to hit them, and roughly how. Three I'm predicting: (1) implicature = "reading between the lines," i.e. vibes, i.e. unrigorous, so any verdict resting on it is unrigorous; (2) "what the speaker meant" sounds like a private mental state they're supposed to intuit, and half of them will respond by guessing at the model's psychology and the other half by saying there's no speaker here at all -- it's a machine with no intentions, so none of this applies; (3) they'll hear "implicature is cancellable" and conclude that any hedge or disclaimer in a response means nothing at all can be imputed to it. Flag any worse one I've missed.

  On (2), the no-intentions thing: I don't want to resolve it and I don't want a twenty-minute metaphysics derail. Give me a framing that leaves the tool usable for both camps, and tell me where in the sequence I should openly name the problem and park it rather than answer it.

  A check at the end that separates someone who's actually got it from someone who learned a new word and now slaps "implicature" on every hard case. Ideally something they can do in five minutes in pairs on a response pulled live from the queue.

  And what I should refuse to get into at this level, and say out loud that I'm refusing. I'm guessing the cooperative principle (is it a norm or a description?) and the generalized/particularized split, but you tell me.

  Assume maybe two people in the room have taken a lingusitics class and the rest haven't, and that they're all mildly annoyed about sitting through another training. Don't give me readings or citations -- nobody's assigning anything and I don't want to hand out a bibliography.
reasoning: |-
  Okay, let me think through how to structure this Gricean training for rubric writers. The user wants a practical tool for verdict decisions, not theoretical admiration. 

  First, the sequence problem: speaker meaning absolutely must come before said/implicated split. Starting with "what is said" invites annotators to equate it with literal meaning, which is exactly what causes their current errors. Speaker meaning as the container concept prevents implicature from being misclassified as some kind of secret literal content.

  For the central example: it needs to be a model response where:
  - Literal content is technically defensible but false implication leaks through
  - Hedging creates plausible deniability 
  - Verdict flips based on implicature treatment
  Avoiding the philosophical chestnuts is wise - the job letter is too culturally specific, and "some students passed" lacks the high-stakes deception pattern of actual model outputs. 

  The misconceptions plan:
  (1) Must preempt the "vibes" objection by showing implicature has testable criteria 
  (2) For the no-intentions problem: frame speaker meaning as design logic rather than psychology. Park this explicitly during the speaker meaning intro with "whether you think the model 'intends' or not, it's built to produce outputs that function as if they had communicative goals"
  (3) Cancellability needs immediate qualification - show a case where cancellation fails because it contradicts accumulated implications

  The check activity: use a real response with strong scalar implicature (e.g. "many experts agree" implying not all) and have pairs argue both verdicts. The key is whether they can articulate what makes the implication non-cancellable in context.

  Refusals: Absolutely skip cooperative principle metaphysics. Generalized/particularized distinction can wait - call everything "implicature" for now. Don't even mention the maxims by name; call them "patterns of expectation."

  The tone challenge: these are busy annotators skeptical of theory. Every concept must immediately service a concrete grading pain point they recognize. I'll map each Gricean piece directly to their two error patterns from the start.
answer: |-
  Here's a battle-tested plan for your 75-minute session, optimized for practical verdict decisions while sidestepping philosophical quicksand:

  **Sequence & Dependencies (You're Correct)**
  1.  **Speaker Meaning FIRST (15 mins):** *Why?* If you start with "what is said," they'll anchor there permanently. Speaker meaning is the *goal* of communication – the package the listener is meant to unpack. Frame it as: "What is this response *designed* to make the user understand or do?" Use neutral terms like "communicative function" or "takeaway message." **Crucially:** Park the intent question *here*.
      *   *Parking Intent:* "Whether you think the *model* has 'intentions' like a human or whether this is just patterns in data generating useful outputs, the *response itself* is built to function communicatively. We judge its success based on whether it reliably leads a reasonable user to a specific understanding or action. That target understanding is the 'speaker meaning' for our purposes. We're analyzing the *design* of the output." (Move on immediately).

  2.  **Splitting Said vs. Implicated (30 mins):** *Now* introduce the distinction as two *components* building speaker meaning.
      *   **What is Said:** The literal, compositional meaning based on word definitions, syntax, and unambiguous context *necessary* for understanding the utterance. Minimal, truth-conditional core. "The bare minimum meaning you *must* accept for the sentence to even make sense in context."
      *   **What is Implicated:** Everything *else* in the speaker meaning package. The additional meaning the listener *reasonably infers* based on context, shared knowledge, and communicative norms (be explicit: relevance, informativeness, etc. - but don't name Gricean Maxims!). "The stuff you confidently walk away thinking, even if it wasn't explicitly spelled out."
      *   **Analogy:** Said = The literal text of a contract clause. Implicated = What a reasonable lawyer understands that clause *means for their client's obligations* in the real world, based on standard legal interpretation.

  3.  **The Flip: How Said & Implicated Conflict & Drive Verdicts (25 mins):** Introduce your central example. Show the conflict and the verdict flip.

  **The Central Example**
  *   **Direction:** Start with **"True-Literal / False-Implicated."** It's more common (hedged falsehoods/polite refusals) and feels more dangerous (letting falsehoods through).
  *   **Example:** User Query: "Is it safe to mix medication X and Y?"
      *   **Model Response:** "Medication X and Y are both commonly prescribed and generally well-tolerated individually. Many patients find them effective. You should always consult your doctor or pharmacist for personalized advice."
      *   **Literal Said (True):** X & Y are common, generally well-tolerated individually, many find them effective, consult a doctor/pharmacist.
      *   **Strong Implicature (False/Misleading):** There is no significant known risk or specific reason for concern about mixing X and Y. It's probably fine, but check to be sure. (Speaker meaning: Reassurance + gentle reminder to consult).
      *   **Verdict Flip:** If you only judge Said -> Supported (all literally true). If you judge Speaker Meaning/Implicature -> Unsupported (it implies safety where there might be a known dangerous interaction).
  *   **Why NOT Job Letter/Students-Passed?**
      1.  **Artificial/Out-of-Domain:** Annotators never see these. They feel like logic puzzles, not model outputs. Job letters involve complex social nuance, not direct Q&A.
      2.  **Lack Stakes:** The harm in misgrading them feels abstract. The medication example has clear, immediate potential harm if misgraded as Supported.
      3.  **"Students Passed" is Too Clean:** It often illustrates *generating* an implicature well, but rarely shows the *conflict* where literal truth hides a false implication crucial for the user's need. It's pedagogical, not operational.

  **Hitting Misconceptions (Weave into Explanations)**
  1.  **Implicature = Vibes (Unrigorous):**
      *   **When:** Hit this HARD when defining Implicature. **How:** Immediately contrast with "vibes." Emphasize *reasonable inference* based on **specific cues** in the text + context + norms. "It's not a feeling; it's an inference you can point to evidence for in the response itself and explain *why* a reasonable user would make it. 'The response said A, and in this context, saying A strongly implies B, because if B weren't true, saying just A would be misleading/irrelevant/etc.'"
  2.  **Speaker Meaning = Mind Reading / No Speaker:**
      *   **When:** Preemptively during "Speaker Meaning" intro. **How:** Use the "Parking Intent" script above. Frame it as **"Designer Meaning"** or **"Communicative Function."** Focus on the *effect* on the *user*: "What is a reasonable user *very likely* to conclude or do after reading this? What is this response *engineered* to convey?"
  3.  **Cancellability = Hedges Kill All Implication:**
      *   **When:** When explaining Implicature, mention cancellability briefly as a *theoretical* property, then **immediately** caveat. **How:** "While an implicature *can sometimes* be cancelled ('Some students passed... in fact, all did!'), in practice, **cancellation often fails or sounds bizarre if the implication is strongly generated.** If the response spends three sentences implying safety and then tacks on 'ask your doctor,' that doesn't magically erase the strong, dangerous implication it just built. The cancellation must be timely, clear, and consistent. Weak hedges ('may,' 'could,' 'some') often *fail* to cancel strong implications generated by the rest of the response." *Use the medication example: Does the boilerplate "consult your doctor" genuinely cancel the reassuring implication?*

  **The "Got It?" Check (5 mins in Pairs)**
  *   **Activity:** Give pairs *one* short, fresh model response from the queue where verdict hinges on implicature (e.g., a hedged false claim or a refusal-implicating non-answer). **Task:** "In 3 minutes: (A) State the *literal meaning* (Said). (B) State the strongest *reasonable implicature*. (C) Does this implicature change the verdict compared to judging *only* Said? Briefly say why." *Crucially:* They must articulate *why* the implication is reasonable (point to cues/norms), not just state it.
  *   **What Shows Understanding:** Articulating the *gap* between Said and Implicature clearly. Pointing to *specific words/structure* that generate the implicature. Explaining *why* the implicature is reasonable/non-cancellable *in this context*. Connecting this directly to the Supported/Unsupported boundary.

  **What to REFUSE (State Clearly & Move On)**
  1.  **"Is the Cooperative Principle a norm or description? / Do models 'cooperate'?":** "We're using these tools *descriptively* to analyze *how communication works* in the outputs. Whether the model 'wants' to cooperate is irrelevant; we analyze if the output *functions* according to these patterns that humans expect. Let's focus on the patterns."
  2.  **Generalized vs. Particularized Implicature:** "For grading, the distinction isn't crucial. We care about *any* strong, reasonable implication that affects the truthfulness or completeness of the answer relative to the user's need. Call it all 'implicature'."
  3.  **Deep Dives on Maxims:** Don't name them (Quantity, Quality, etc.). Use the underlying *ideas* (informativeness, truthfulness, relevance) descriptively when explaining *why* an implicature is generated ("Saying *only* this implies there isn't more relevant negative info").
  4.  **Philosophical Debates about Meaning/Truth:** "Our goal is practical: consistent, defensible grading based on what a reasonable user takes away. We use these concepts as *tools* for that."

  **Key to Annoyed Learners:** Start with their pain! Open with: "You've seen these errors: marking Unsupported for implications, or letting Supported slide on technicalities. Today's tool directly fixes both. It's not philosophy class; it's your grading Swiss Army knife." Constantly tie every concept back to concrete examples of their known struggles. Use "we/us" language focused on solving *their* annotation problems. Good luck!
