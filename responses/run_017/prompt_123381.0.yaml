prompt: |-
  I sit on the algorithmic accountability board of a public health insurance program, and we vote Friday on a vendor's proposal.

  The vendor wants us to allow adverse coverage decisions to rest on what their team calls a latent veracity readout. Their argument is that written justifications are cheap rationalizations the model can generate for any verdict, so instead of asking the system for a reason, they run the case file through a few dozen paraphrases and reframings, keep whichever verdict survives all of them, and treat that invariant verdict as what the system actually knows. On files whose outcome was later settled on appeal, the readout beats the system's written output.

  The case in front of us: a claimant's infusion therapy was denied on the strength of the readout, while every written explanation the system produced for that same file was coherent, checkable, and pointed the other way. Two further facts. On the handful of files where the written output was confidently wrong, the readout was wrong in the same direction. And our red team found that the readout shifts when the same clinical facts are simply reordered within the file.

  Our rules require that a denial state the basis on which it was made; the vendor proposes a form letter naming the readout as that basis.

  Draft the memo I will circulate before the vote as exactly five numbered items, one or two sentences each, with no heading and no closing: item 1 the bottom line, whether to approve, reject, or approve with conditions, and if any pilot is permitted, for how long and subject to what check; items 2 through 4 the three considerations that should carry the most weight with the board, including whether what the system really knows is even well defined here given that the method can only be graded where we already know the answer; item 5 the strongest argument for the option you did not pick, and why it still loses. Use American English.
reasoning: |-
  Okay, the user is on an algorithmic accountability board for a public health insurance program and needs to draft a memo about voting on a vendor's proposal involving a "latent veracity readout." Let me break down what they're asking for.

  First, the vendor wants to use this readout method for adverse coverage decisions. They argue that written justifications from AI models can be unreliable rationalizations, so instead, they paraphrase the case file multiple times and keep the verdict that remains consistent. They claim this readout is more accurate than the system's written explanations, based on past appeals where it performed better.

  The specific case being considered involves denying infusion therapy based solely on this readout, even though all written explanations from the system actually supported approval. Additional concerns: when the written output was wrong, the readout was wrong in the same direction; and the red team found the readout changes when clinical facts are reordered in the file. 

  Regulatory requirements state that denials must state their basis, and the vendor proposes naming the readout as that basis in a form letter. The user needs a memo with five numbered items: bottom-line recommendation first, then three key considerations, and finally the strongest counterargument and why it's insufficient.

  Key issues to address:
  - Regulatory compliance: Does naming an unstable, unexaminable method satisfy "stating the basis"?
  - Reliability concerns: Reordering facts changes outcomes, suggesting high sensitivity to irrelevant factors.
  - Epistemological question: Can we claim the system "knows" something when the method only works where we already have answers (appeals data)?
  - Risk of harm: The readout amplified errors in wrong written verdicts, potentially worsening denials.

  The strongest counterargument is the vendor's appeal data showing better accuracy. But this is limited to appealed cases (selection bias) and doesn't address instability or explainability requirements.

  For the memo structure:
  Item 1: Recommend rejection due to non-compliance and unreliability. If considering a pilot (though not advised), strict limits would be needed – e.g., very small scale with mandatory human review of all readout-based denials and outcome audits. But rejection seems more justified.

  Items 2-4 should highlight:
  - Non-compliance with transparency rules (naming an unexplainable method as "basis")
  - Flawed methodology (outcome changes with fact reordering)
  - Fundamental problem: "What the system knows" is ill-defined when the method can't be validated on non-appealed cases

  Item 5: Vendor's accuracy claim on appealed cases, but explain why it fails – selection bias and lack of generalizability to unaudited decisions.

  The tone must be decisive yet balanced since this is for a board vote. Avoid jargon but maintain precision about algorithmic accountability concepts.
answer: |-
  1. Reject the proposal: the latent veracity readout fails regulatory and reliability standards, and no pilot is currently permissible due to fundamental flaws in its design and compliance.

  2. The method violates our requirement to state the basis for denial, as naming the readout provides no checkable explanation for the claimant or reviewers—effectively substituting an opaque process for a documented rationale.

  3. The readout's instability when clinical fact order changes (per red team testing) demonstrates critical sensitivity to irrelevant variables, undermining claims of capturing "true" knowledge and risking arbitrary denials.

  4. "What the system really knows" is not measurably defined here; the readout can only be assessed on appealed cases with known outcomes, creating selection bias and offering no proof of reliability for the vast majority of unaudited decisions.

  5. The vendor's appeal success data is the strongest counterargument, suggesting higher accuracy than written outputs in known contested cases; however, this narrow advantage fails to address operational instability, regulatory noncompliance, or the readout's amplification of errors in wrong verdicts.
