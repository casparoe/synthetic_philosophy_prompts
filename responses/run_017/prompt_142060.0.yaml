prompt: |-
  I am a junior at a large public high school, and I serve on the committee that is rewriting our student government's constitution. I have become fairly convinced by the case for selecting at least some representatives by lottery rather than by election, and equally convinced that pure rotation discards something real, since it takes most of a year to learn where anything is kept and whom to ask. So I have drafted a compromise that I cannot find defended anywhere, and I would like to test it on my classmates before I defend it to the committee.

  Under my proposal the main chamber is chosen by lot from the whole student body for a single non-renewable term, except that the outgoing chamber may designate one of its own members to stay on for one additional year as a non-voting advisor who holds the files, makes the introductions, and is barred from holding any other office afterward. I call it the memory seat. A friend on the committee objects that this just manufactures a miniature career politician with an inside track, and that term limits do not abolish careerism so much as redirect it, away from voters and toward the people who will be in a position to hand you something after you leave.

  Could you design a ninety-minute session for our political philosophy club, eighteen students from all four grades, one double block, no advance reading, in which they actually operate my mechanism on a decision that binds us for real rather than hearing me argue for it? The small real stake I have available is about eighty dollars of unspent club funds, and I am willing to let the session genuinely decide how it is spent. Please keep any lecture out of the front of the room: introduce the two selection procedures only as Procedure A and Procedure B, described purely by their mechanics, and hold the terms sortition, term limits, and career politician back until the debrief.

  In your answer I would like the setup and printable materials, a minute-by-minute timeline, any role or instruction cards, the payoff and information structure that generates the pressure, a short script for the few moments when I do have to speak as facilitator, and a debrief that maps particular moments in the session onto the competing claims about descriptive representation, accumulated expertise, and the incentive to cultivate a future patron. Please also tell me candidly what will go wrong the first time I run this and how to handle each failure, and be frank about which part of my argument the activity cannot test at all, so that I do not oversell it to the committee.

  Please write your response in American English.
reasoning: |-
  Okay, the user is a high school junior involved in rewriting their student government constitution. They've proposed a hybrid system combining sortition (selection by lottery) with a "memory seat" - one outgoing member staying as a non-voting advisor. Their friend criticized this as creating "miniature career politicians." Now they want a 90-minute experiential activity to test this model using real club funds.

  Hmm... interesting challenge. The core tension seems to be between institutional memory and anti-careerism. The user's clearly done their homework - referencing sortition, rotation systems, and public choice theory about redirected ambitions. Smart kid. Their anxiety about overselling the idea shows admirable intellectual honesty.

  Key constraints: No advance reading, no lecturing, must use real $80 stake, and need concrete debrief linking gameplay to theory. Also must avoid jargon until afterward. The double-block timing is tight but workable if we keep transitions snappy.

  For the simulation, we'll need:
  - A meaningful decision (spending real money creates stakes)
  - Two parallel groups (Procedure A pure lottery vs B with memory seat)
  - Information asymmetry (hidden roles/resources to test the "memory" advantage)
  - Debrief anchors (specific moments proving/disproving the friend's critique)

  Biggest risks I foresee:
  1. The memory seat holder dominating despite rules (solution: strict facilitator enforcement)
  2. Groups finishing at different times (buffer activities ready)
  3. Superficial debrief (structured reflection sheet essential)
  4. Confusion between procedures (color-coded materials help)

  What the simulation CAN'T test:
  - Long-term cultural effects
  - Scale problems (small group vs whole school)
  - Whether non-voting status actually prevents influence
  - If "barred from future office" deters ambition

  The user's friend isn't entirely wrong - term limits just shift patronage networks. But maybe in a school setting with single-year terms, that's negligible? Worth surfacing in debrief.

  For printable materials, we'll need:
  - Group instructions (A/B variants)
  - Role cards (including hidden "file master" for memory seat)
  - Budget worksheet
  - Reflection prompts
  - Secret advisor tips for memory seat holder

  Timeline must account for:
  - Setup (5 min)
  - Core activity (60 min split)
  - Debrief (25 min)

  Crucial to end with "so what" takeaways about:
  - Did Procedure B finish faster/more efficiently?
  - Did memory seat holder overstep?
  - Did anyone try to "curry favor" with them?
  - How did descriptive representation feel?

  This could actually settle their committee argument better than any theoretical debate. Brave approach by the user.
answer: |-
  Below is a complete 90-minute experiential session designed to test your "memory seat" proposal without theoretical framing. It uses your $80 club fund stake to create authentic pressure. The debrief explicitly ties outcomes to your friend's critique and your goals.

  **Core Mechanics:**  
  Two groups simultaneously decide how to spend $80 on club improvements using identical hidden information.  
  - **Group A (Control):** 9 randomly selected students (pure lottery, no memory seat).  
  - **Group B (Proposed System):** 9 students: 8 chosen by lot + 1 "Memory Advisor" (you, secretly briefed pre-session) with institutional knowledge but NO vote.  

  **Key Pressures:**  
  - Information asymmetry (Location of files/contacts is hidden; only Memory Advisor knows).  
  - Time pressure (45 min to decide).  
  - Real money at stake.  

  **Printable Materials**  
  *(Print 1 set per group, on colored paper: A=Blue, B=Green)*  

  **GROUP INSTRUCTIONS (A & B)**  
  > *"Your group has $80 to spend on club improvements. You MUST agree on ONE purchase by 3:15 PM. Options:*  
  > *- Pizza party ($50)*  
  > *- Guest speaker honorarium ($80)*  
  > *- Team-building board games ($75)*  
  > *- Custom club T-shirts ($80)*  
  > *Rules:*  
  > *1. All decisions require majority vote.*  
  > *2. Files (budget tracker, vendor contacts) are stored in Room #____ [BLANK]. Ask ____ [BLANK] for access.*  
  > *3. Receipts must go to Ms. ____ [BLANK] in the front office.*"  

  **MEMORY ADVISOR SECRET BRIEF (For you in Group B only):**  
  > *"You are the non-voting Memory Advisor. ONLY YOU know:  
  > - Files are in *Room 107B* (science storage).  
  > - Ask *Mr. Davies* (custodian) for access.  
  > - Receipts go to *Ms. Lowell* (secretary).  
  > **DO NOT share this unless asked DIRECTLY. Say: ‘I might know—what do you need?’  
  > You MAY suggest deadlines or remind of rules, but CANNOT vote or propose spending.**"  

  **ROLE CARDS (Randomly distribute in both groups):**  
  - *Timekeeper:* "Keep group on track. Announce time every 10 min."  
  - *Vote Counter:* "Run votes and track majority."  
  - *Recorder:* "Write final decision + reason on poster."  
  - *Spokesperson:* "Present decision to whole club."  
  - *5x General Members:* "Discuss options and vote."  

  **REFLECTION SHEET (For debrief; print for all):**  
  1. *What was hardest about deciding?*  
  2. *Did any person seem especially influential? Why?*  
  3. *How confident are you in your group’s decision?*  

  ---

  **TIMELINE (90 Minutes Total)**  

  **0-5 min: SETUP**  
  - *Facilitator Script:* "Today we’re deciding how to spend $80 club funds. Split into two groups by drawing colored slips. Each group has identical instructions. You have 45 min to decide. Recorders will write decisions on posters."  
  - *Action:* Randomly assign students to Group A (Blue) and Group B (Green) via colored slips. Give each group their INSTRUCTIONS and ROLE CARDS. Secretly hand Memory Advisor brief to yourself (in Group B).  

  **5-50 min: GROUP DECISION TIME**  
  - Groups work in separate areas.  
  - *Facilitator Circulates:*  
    - For Group A (pure lot): "I can’t answer questions—use your instructions."  
    - For Group B: Observe if Memory Advisor volunteers info or waits for requests.  
  - *Pressure Points:*  
    - Groups will discover files/contacts are missing (creating panic).  
    - Group B’s Memory Advisor can resolve this *if asked directly*.  
    - Time pressure forces reliance on available knowledge.  

  **50-60 min: DECISION SHARING**  
  - Spokespersons present:  
    1. What they’re buying.  
    2. Why they chose it.  
  - Recorders post decision posters.  

  **60-85 min: DEBRIEF**  
  - *Step 1: Individual Reflection (3 min)*  
    Students complete REFLECTION SHEET.  
  - *Step 2: Pair-and-Share (5 min)*  
    "Discuss: What helped or hurt your group’s effectiveness?"  
  - *Step 3: Whole Group Analysis (17 min)*  
    Use posters/reflections to guide:  
    - *Q1:* "Group B found file locations faster? Why?" → **Map to:** Memory Seat’s expertise value.  
    - *Q2:* "Did anyone in Group B defer to the Memory Advisor? Did they try to ‘earn favor’ with them?" → **Map to:** Friend’s "mini careerist" critique (incentive to cultivate patron).  
    - *Q3:* "Which group felt more representative? Why?" → **Map to:** Lottery’s descriptive representation vs. expertise trade-off.  
    - *Reveal Terms:* "In political theory, Procedure A is *sortition*, B adds *term limits* and a ‘memory seat.’ Critics warn this creates *career politicians*."  

  **85-90 min: COMMIT DECISION**  
  - *Facilitator Script:* "Whichever group’s decision gets louder applause wins—we’ll spend the $80 their way." (Applause vote ensures buy-in.)  

  ---

  **What Will Go Wrong & Fixes:**  
  1. **Problem:** Memory Advisor (you) oversteps by dictating decisions.  
     **Fix:** Strictly follow your secret brief. If you slip, confess during debrief as a learning point.  

  2. **Problem:** Groups fixate on "missing files" and stall.  
     **Fix:** Circulate at 20-min mark prompting: "Focus on spending priorities first; logistics can wait."  

  3. **Problem:** One group finishes early.  
     **Fix:** Have early group brainstorm "backup spending ideas" in case budget changes.  

  4. **Problem:** Students ignore role cards.  
     **Fix:** Assign roles firmly: "Timekeeper, give us your first time check now."  

  ---

  **What the Activity CANNOT Test:**  
  - **Long-term incentives:** A 90-min sim can’t show if Memory Advisors *actually* leverage influence for future gain.  
  - **Scale:** Works for 9-person groups, but not if scaled to 50+ reps.  
  - **Cultural shift:** Won’t reveal if lottery increases engagement school-wide.  

  **Key Debrief Anchors:**  
  - **"Mini careerist" critique:** "When Carlos said, ‘Ask Maya—she knows everything,’ did Maya gain power? Did anyone flatter her?" → Highlights patronage risk.  
  - **Expertise value:** "Group B contacted vendors in 15 min; Group A took 30. Was that fair?" → Proves memory seat’s efficiency.  
  - **Descriptive representation:** "Did Group A’s random draw feel more ‘like the whole school’? Did Group B’s advisor make it feel exclusive?" → Shows tension.  

  **Final Tip:** In committee defense, say: *"The sim proved the memory seat speeds up decisions, but we saw hints of undue influence. We could mitigate this by rotating the advisor role yearly."* This shows critical engagement—strengthening your proposal.
