  ### Runnable Activity: Bertrand's Chord Paradox Exploration  
  **Time:** 75 minutes  
  **Goal:** Students physically generate chords via 4 methods, discover conflicting probabilities, and debate why "random" is ambiguous without a specified space of alternatives.  

  ---

  ### **Materials Preparation**  
  **Shared for All Stations:**  
  - Large printed circle (radius ~30 cm) with **inscribed equilateral triangle** (visible sides).  
  - **Reference stick** cut to the exact length of the triangle’s side (for quick chord-length comparison).  
  - Tally sheets (see template below).  

  **Station-Specific Materials:**  
  1. **Station 1 (Two Points on Circumference):**  
     - 2 spinners (arrows on pivots centered on the circle) or 2 phone apps for random angles (0–360°).  
     - String (length > circle diameter).  
  2. **Station 2 (Random Point Along a Radius):**  
     - Phone/tablet with random number generator app (range: 0 to R, where R = circle radius).  
     - Pre-drawn radius line on the circle.  
     - Calculator (to compare random number to R/2).  
  3. **Station 3 (Random Point in Disc):**  
     - Large circle drawn on floor (radius ~0.5m) with **concentric inner circle** (radius R/2).  
     - Bag of dry beans/rice.  
  4. **Station 4 (Straw Throwing):**  
     - Large circle on floor (radius ~1m) with **concentric inner circle** (radius R/2).  
     - 50+ drinking straws (longer than circle diameter).  

  **Tally Sheet Template (for all stations):**  
  ```  
  Trial | Long? (✓ if longer than reference stick)  
  ––––––––––––––––––––––––––––––––––  
  1     |  
  2     |  
  ...   |  
  40    |  
  Total Long: ____ / 40 → Fraction: ____  
  ```  

  ---

  ### **Procedure (Minute-by-Minute)**  
  **0–5 min: Setup & Briefing**  
  - Split class into 4 groups (6 students each). Assign stations.  
  - Instructions: *"Each group has a method to generate random chords. Do 40 trials: record if the chord is longer than the triangle’s side. Compute your fraction, then one person writes it on the board. Do NOT peek at other stations!"*  
  - Emphasize: **No theory upfront**—this is hands-on.  

  **5–30 min: Group Work (25 min)**  
  - **Station 1 (Two Points):**  
    - Spin spinner twice to pick 2 points on circumference.  
    - Stretch string between points. Compare to reference stick.  
    - ✓ if string longer. Record on tally.  
    - *Speed tip:* One student spins, one holds string, one records.  

  - **Station 2 (Point on Radius):**  
    - Generate random number `d` between 0 and R (radius).  
    - ✓ if `d < R/2` (no need to draw chord—math shortcut).  
    - *Speed tip:* Do 80 trials (faster method) to match time.  

  - **Station 3 (Point in Disc):**  
    - Drop bean from shoulder height onto circle.  
    - ✓ if bean lands *inside inner circle*.  
    - Redo if bean misses big circle.  

  - **Station 4 (Straw Throwing):**  
    - Toss straw onto big circle.  
    - ✓ if straw touches/intersects *inner circle*.  
    - Redo if straw misses big circle entirely.  

  **30–35 min: Report Fractions**  
  - Groups write fractions on board (no method labels yet):  
    `Station 1: ___, Station 2: ___, Station 3: ___, Station 4: ___`  

  **35–45 min: Group Method Reports (10 min)**  
  - Each group has 60 seconds to describe their method. TA labels methods on board:  
    - **S1:** "Two random endpoints"  
    - **S2:** "Random point on a random radius"  
    - **S3:** "Random midpoint in disc"  
    - **S4:** "Random line (straw throw)"  

  **45–65 min: Class Debate (20 min)**  
  - **Key Question:** *"We all answered the same question—why do we have 4 different probabilities?"*  
  - **Guiding Prompts (TA asks; students discuss):**  
    1. *"Is one method ‘more random’ than the others? Why?"*  
      - Let students argue. Listen for "natural" or "unbiased" claims.  
    2. *"What if we moved the circle to another room? Would your method give the same probability?"*  
      - Target S4: *"Straw throwers—would your fraction change if the circle was bigger or in a different spot? Why?"*  
      - Goal: Students realize S4 doesn’t reference the circle (invariant under transformations).  
    3. *"What ‘space’ did each method randomize over?"*  
      - **S1:** Pairs of points (circumference) → 1D × 1D.  
      - **S2:** Points along a radius → 1D.  
      - **S3:** Points in the disc → 2D area.  
      - **S4:** Lines in the plane → 2D (angle + distance).  
    4. *"Why does S4 give the same answer as S2 (both ~1/2)? Is that a coincidence?"*  
      - Hint: *"S2 used distance from center. S4—what geometric feature determined ‘long’?"* (Distance from center to line).  
      - **Lightbulb:** Both depend on a uniform distance distribution, but S4 achieves it via invariance.  

  **65–75 min: Debrief & Moral (10 min)**  
  - **TA Summary:**  
    - *"The ‘paradox’ isn’t about circles—it’s that ‘random chord’ is ambiguous. Indifference requires a space of alternatives (e.g., endpoints, midpoints, lines). No space is ‘objectively correct’—it depends on context!"*  
    - *"S4 is special: by ignoring the circle (straws don’t care about size/location), it uses a measure invariant under rigid motions/scaling. That forces the distance distribution to be uniform, giving 1/2."*  
  - **Name Drop:** *"This is Bertrand’s paradox—it shows why probability problems must specify the sampling method!"*  

  ---

  ### **Failure Modes & Mitigation**  
  1. **Straws miss the circle (S4):**  
     - Provide extras. Define "miss" as "no intersection with big circle"—redo.  
     - *Reality:* Still approximates uniform line measure if throws are isotropic.  

  2. **Non-uniform angles/points (S1/S2/S3):**  
     - Use apps for randomness (better than spinners). For beans (S3), drop from height + shake bag.  
     *Probability says:* Even with bias, differences between stations will be clear.  

  3. **Groups finish early/peek:**  
     - Fast groups (S2/S4) do extra trials (S2: 80 trials). Assign "observers" to document method quirks.  

  4. **"Longer than triangle?" judgment takes time (S1):**  
     - Use reference stick—groups pre-compare string before recording.  
     - **Crucial:** For S2/S3/S4, use math shortcuts (no chord drawing!).  

  5. **Smug student who knows the paradox:**  
     - Pre-empt: *"If you’ve heard of this, be a ‘silent scientist’—observe if the class finds what you know!"*  
     - Enlist them as TA helpers at a station.  

  6. **Trials run long:**  
     - Reduce trials to 30 (still shows divergence). Start timer at 15 min: *"You have 10 min left—ensure 20 trials done."*  

  7. **Groups argue "right" answer in debate:**  
     - Lean in: *"Convince the class YOUR space is most natural!"* Then reveal: *"All are valid—the question was ill-posed."*  

  ---

  ### **What This Activity Can/Cannot Do**  
  - **Can:**  
    - Visibly produce 4 different probabilities (≈1/3, 1/2, 1/4, 1/2) with physical immediacy.  
    - Force debate on "indifference" requiring a specified space (via method comparisons).  
    - Motivate invariance (S4) as a student-led discovery.  
  - **Cannot:**  
    - **Fully replace TA guidance on "ill-posed question."** Students need the TA to crystallize the moral after debate.  
    - Perfectly replicate theoretical probabilities (noise exists), but differences will be stark enough (e.g., 0.25 vs. 0.5).  
    - **Deliver deep integral geometry**—keep S4 invariance at the level of "uniform distance via symmetry."  

  **Final Tip:** For the invariance point, end with an open question: *"In real life—like dropping sticks on a city map—when would S4’s invariance matter?"** (e.g., polling where district boundaries change). This bridges math to applied philosophy.  

  ---  
  **Outcome:** Students leave grappling with how "randomness" depends on the *description* of alternatives—not just the object. The physical clash primes them for deeper probability theory.
