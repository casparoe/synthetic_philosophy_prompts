prompt: |-
  I've been going back and forth with a guy in my local rationalist-adjacent group chat for about a week and I cant find the exit. He's got this argument that moral worth is impossible, and every step looks fine to me individually.

  (1) An action has moral worth only if the agent does it because it is right. The right-making features have to be what moves her, not merely be features of whatever she happens to end up doing.

  (2) "Because" there is causal-explanatory. Her taking the action to be right has to be part of the causal story of why she did it. Otherwise "acting for a reason" is just the same bodily movements with some narration stapled on.

  (3) Beliefs don't move you on their own. On the standard Humean picture a belief can only cause action in tandem with some desire or pro-attitude.

  (4) So the morally worthy agent has a desire to do what is right.

  (5) A desire is a state whose satisfaction the agent is motivated to bring about. What she is motivated to bring about here is a state of affairs in which she has done the right thing. That is a state of her.

  (6) So she is acting in order to produce a pleasing state of herself: clean conscience, the warm glow of being a good person, no guilt. That is self-interest with better branding.

  (7) Nothing done from self-interest has moral worth.

  (8) So no action has moral worth. The only motive that could satisfy (1) is a motive that trips (7).

  And then two corollaries he leans on:

  (9) The person who helps from spontaneous sympathy and never once thinks "this is right" has zero moral worth. Also, by the same reasoning as (5)-(6), she is acting from self-interest anyway, since she is doing it to shut off her own discomfort at the sight of suffering. So she's sunk twice.

  (10) If you could delete the desire in (4) while leaving the belief intact, she wouldn't act at all. So praiseworthiness requires a motivational structure nobody actually has, and the more reliably good someone is, the less likely they are to be acting for the right reason.

  Things that make me suspicious: this has the same shape as "everyone always does what they most want to do, therefore altruism is impossible," which I thought we'd retired around the time of the Sequences. And the whole argument goes through unchanged if you swap in epistemic praiseworthiness — you'd need a desire to believe truly, which is a self-directed desire, so no belief is ever epistemically praiseworthy either. My friend bites that bullet happily, which makes me more suspicious rather than less.

  But when I try to point at the exact step where it goes wrong I lose the thread. I'd rather keep (1) than anything else — I really don't want to end up as the guy who says the lifeguard who jumps by reflex deserves as much credit as the guy who thought about it and jumped. But if keeping (1) means I have to buy non-Humean motivation, I want to be told that's the price. So: which step do you reject, why did that step look innocent, and what does each of the other options cost me?
reasoning: |-
  Okay, the user is dealing with a really tricky philosophical argument about moral worth. They've been going back and forth with someone in their rationalist group chat for a week and can't find the flaw in the argument. The core issue is that the argument concludes moral worth is impossible because any action done because it's right ultimately stems from self-interest. 

  First, I need to parse the argument step by step. The key premises are: moral worth requires acting because it's right (1), which is causal (2). Beliefs alone can't motivate—they need desires (3), so you need a desire to do right (4). That desire aims at a self-state (5), making it self-interested (6). But self-interest can't have moral worth (7), so no action has moral worth (8). The corollaries (9 and 10) add that spontaneous sympathy is also self-interested and praiseworthiness requires an impossible motivation.

  The user suspects something's wrong, comparing it to the "altruism impossible" argument from the Sequences. They also note it applies to epistemic praiseworthiness, which the other person accepts. The user wants to keep (1) but worries it forces them into non-Humean motivation. They need to know which step to reject, why it looks plausible, and the costs of alternatives.

  Breaking it down: Premise (5) is where the argument goes wrong. It conflates the object of desire (doing the right thing) with the satisfaction of the desire (feeling good). The desire to do right isn't inherently about self-states; it's about the action itself. For example, desiring to help someone for their sake, not for the warm glow. This misstep makes the rest collapse into self-interest. 

  But why is (5) tempting? Because in Humeanism, desires are conative states directed at outcomes. But outcomes can be other-regarding. The sleight of hand happens when (5) assumes the outcome is a self-state. The user's example of epistemic praiseworthiness shows the same flaw—desiring truth for its own sake isn't self-interested.

  Rejecting (5) costs some clarity in desire-satisfaction but preserves moral worth. Alternatives: rejecting (1) would allow reflexive actions to have moral worth, which the user doesn't want. Rejecting (3) means adopting non-Humean motivation, like Kant's pure reason, which is philosophically heavy. Rejecting (7) would separate self-interest from moral worth entirely, which feels counterintuitive. 

  The user's deeper need is likely preserving the intuition that conscious moral effort matters more than reflexes, without falling into nihilism. They want a coherent framework that allows genuine moral motivation. Highlighting the conflation in (5) addresses that best, maintaining (1) without extreme commitments. Also, pointing out the analogy to epistemic desires reinforces that the flaw is in the argument, not their intuitions.
answer: |-
  This is a clever and frustrating argument because each step *seems* plausible, but the conclusion is absurd (and the epistemic parallel confirms it's likely flawed). The core mistake is in **Step (5)**, specifically the conflation of the *object* of the desire with a *self-state*. Let's break it down step-by-step, explaining the flaw, why it looks innocent, and the costs of rejecting other steps.

  1.  **Reject Step (5): The Desire's Object is Misidentified**
      *   **The Flaw:** Premise (5) claims: "What she is motivated to bring about here is a state of affairs in which *she has done the right thing*. That is a state *of her*." This is a subtle equivocation.
          *   The *object* of the desire "to do what is right" is the *right action itself in the world*. She desires *that the right thing be done*. This is primarily about the state of the *world* (e.g., the suffering person is helped, the promise is kept, the truth is told).
          *   The *satisfaction* of *any* desire involves a change in the agent's mental state (e.g., relief, pleasure). However, the *object* of the desire is not *inherently* or *primarily* that self-state. Saying the desire is *for* the self-state because satisfaction *causes* it is like saying your desire for a glass of water is *really* a desire to quench your thirst sensation – it confuses the goal with a consequence of achieving it.
          *   The agent motivated by "I want to do what is right" is motivated *by the rightness of the external act*, not primarily by the *idea of herself having done it*. Her focus is outward: "This *helping* is the right thing to do." The clean conscience is a welcome *byproduct*, not the *target*. Contrast this with someone who *only* wants the feeling of being good and would be satisfied by a pill inducing that feeling without doing anything right.
      *   **Why it Looks Innocent:** Humeanism (step 3) emphasizes desires as conative states directed at bringing about states of affairs. It's easy to slip into thinking that the state of affairs the agent envisions *must* centrally include themselves as the beneficiary or the locus of satisfaction ("*I* have done it"). The step exploits the grammatical subject ("she has done") to imply the psychological focus is on the self. It also plays on the undeniable fact that desire *satisfaction* feels good *to the agent*.
      *   **What You Keep:** You keep the core intuition of (1) – actions done *because* they are right have a special status. You keep the causal story (2) and the Humean picture of motivation (3) – beliefs need desires. You keep the plausible idea that self-interested motives undermine moral worth (7). You avoid the absurdity of (8), (9), and (10).
      *   **Cost:** You have to push back against a reductionist tendency that interprets *all* desire satisfaction as fundamentally self-regarding. You need to defend the idea that the *content* of a desire (e.g., "that X be helped," "that the truth be known") matters more than the mere fact that satisfying it changes the agent's internal state. This requires acknowledging the complexity of intentionality – desires are *about* things in the world, not just internal states.

  **Why Rejecting Other Steps is Less Appealing (or More Costly):**

  *   **Reject (1):** ("An action has moral worth only if the agent does it because it is right")
      *   **Why:** Avoids the whole regress. Allows spontaneous sympathy (corollary 9) or habit to have full moral worth.
      *   **Cost:** You lose the distinction the user values (reflex lifeguard vs. deliberate lifeguard). It collapses praiseworthiness into rightness or good consequences.
      *   **Why Not:** You explicitly don't want this. It feels like giving up the core intuition.

  *   **Reject (3):** ("Beliefs don't move you on their own...")
      *   **Why:** Breaks the link requiring the desire (4). Allows beliefs about rightness to directly motivate. (Kantianism, some forms of moral realism).
      *   **Cost:** Requires abandoning a widely held (Humean) theory of motivation. Needs a robust account of how non-descriptive states (beliefs about reasons/norms) can be intrinsically motivating ("besires" or pure rational motivation). Philosophically heavy lifting.
      *   **Why Not:** If you can preserve Humeanism *and* moral worth by rejecting (5), this is unnecessarily radical. Your friend might see it as a cop-out.

  *   **Reject (7):** ("Nothing done from self-interest has moral worth")
      *   **Why:** Undermines the final contradiction. Argues that motives involving self-interest *can* have moral worth (e.g., enlightened self-interest, virtue ethics where character matters).
      *   **Cost:** Severely weakens the notion of moral worth. It becomes hard to distinguish someone who helps *only* for a reward or to avoid guilt from someone who helps because they see the *other's* need as the reason. Feels counterintuitive to the core idea of "acting for the right reason."
      *   **Why Not:** You want to preserve the intuition that self-interest contaminates moral worth; this throws it out entirely.

  *   **Reject (6):** ("So she is acting in order to produce a pleasing state of herself...")
      *   **Why:** Directly contradicts the flawed conclusion from (5).
      *   **Cost:** On its own, this feels ad hoc. You need to explain *why* (6) is wrong, which inevitably points back to the flaw in (5). Rejecting (5) provides the necessary foundation for rejecting (6).

  **Addressing the Corollaries & Epistemic Point:**

  *   **(9) Spontaneous Sympathy:** If the sympathy is genuinely *about* the other's suffering (its object is *their* relief), then it's not *inherently* self-interested, even if acting relieves *their own* discomfort. The discomfort is a *response* to *their* suffering, motivating action *for their sake*. It's distinct from someone who just wants the bad feeling gone and wouldn't care if it vanished magically without helping. Rejecting (5) allows this distinction. Whether it has *moral worth* without the "because it's right" belief is a separate question (which hinges on your view of (1)).
  *   **(10) Deleting the Desire:** This only shows that the Humean *motivation* requires a desire. It doesn't show the desire's object is self-interested. If the desire is "to do the right thing (for its own sake/for the sake of others)," deleting it removes the motivation, but that doesn't make the desire self-interested.
  *   **Epistemic Praiseworthiness:** This is the strongest confirmation the argument is flawed. Rejecting (5) applies equally: the desire "to believe truly" has as its object *the truth*, not the self-state of "me having a true belief." The satisfaction (feeling correct) is a byproduct. The argument *must* be wrong here too, as genuinely seeking truth for its own sake is possible and praiseworthy. Your friend biting this bullet shows consistency but highlights the reductio ad absurdum.

  **Conclusion:**

  Reject **Step (5)**. The argument illicitly slides from "she desires *to do the right thing*" (object: the external right action) to "she desires *that she has done the right thing*" (object: a self-state). This conflation turns any desire-based motivation into covert self-interest. Preserving the distinction between the *intentional object* of a desire and the *subjective feeling* of its satisfaction allows you to maintain:

  1.  Moral worth requires acting *because* it's right (your core intuition).
  2.  A causal, belief-desire (Humean) model of motivation.
  3.  Genuinely other-regarding (or rightness-regarding) desires are possible.
  4.  Actions motivated *by* such desires can have moral worth.
  5.  Self-interested motives *do* undermine moral worth.

  The cost is vigilance against reductionist arguments that try to collapse the intentional content of desires into mere self-state management. You pay this price by insisting that *what* we desire matters, not just *that* we desire. This preserves both moral phenomenology (how moral motivation feels) and avoids the nihilistic conclusions your friend embraces.
