  Constraints, and they're all there for a reason. Three players, two strategies each if you can manage it, three for whichever player owns the strategy at issue if you can't (my guess is you can't do it with two: with two strategies for that player, the set of beliefs where it's a best response is a half-space intersected with the belief simplex, and that always contains a vertex, and vertices are degenerate product beliefs — tell me whether that argument is right, because if it is I want to put it in the problem set as a warm-up). Payoffs should be small integers or halves, no infinite strategy sets, no weak dominance anywhere, no ε-dominance, and the strategy that survives must be *strictly* the best response to the correlated belief with a margin that survives small perturbations of the payoffs, not tied at the boundary. Ideally nothing else in the game is strictly dominated at all, so the contrast isn't muddied by a cascade of other deletions. And because it's for students: give it a one-paragraph story — three firms, three regulators, three departments bidding for a budget, whatever — with payoffs a normal person could interpret, and write the game in normal form with explicit numbers.

  What I want back: the game and the story; then the verification, not the assertion. Exhibit the specific belief over the other two players' joint actions that saves the strategy, and show it isn't a product distribution. Then prove the other half — that no independent belief works — by parametrising the two marginals as p and q and doing the algebra on the two expected-payoff inequalities, rather than sampling a grid of points and declaring victory; if you can only establish it numerically, say so explicitly, because that is precisely where I'd expect a construction like this to be quietly broken. Then say which single structural feature is doing the work, and what happens to the example if I take it away: in particular, if that player's payoffs were additively separable in the other two players' actions (so only the marginals mattered), does the whole thing collapse? Finally, the honesty bit: tell me which step you're least confident in, whether the gap depends on knife-edge payoffs or is robust, whether my framing of the two procedures above is actually the correct statement (correct it if not — I'd rather have the right theorem than my version of it), and what would convince you that no game of this size can do what I'm asking.
