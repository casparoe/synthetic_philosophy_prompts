  ...I'm grinning at their "Hofstadter bolt-on" comment. They'd likely eject anything smelling of superrationality unless it's grounded in quantifiable dynamics. So implications ranking must emphasize *conditional* payoffs: acausal trade only matters if noisy mugging holds, and even then just for idealized agents. Reputation mechanisms? Barely relevant here. AI design implications? Overrated without concrete learning architectures.

