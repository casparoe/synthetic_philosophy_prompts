prompt: |-
  I head the integrity function at a UK-registered international development NGO. We run health and local-government programmes in about a dozen countries, mostly in West and East Africa and South Asia. Our country offices send me something in the region of forty "is this corruption?" queries a year, and they are not exotic: a payment someone has asked for before releasing a shipment, a gift offered to a monitoring team, a contractor's contribution to a local politician's constituency fund, a per diem a government partner expects before he will attend a meeting. They arrive by email from programme managers and finance officers with no legal training, usually needing an answer the same day because a workshop, a customs clearance or a relationship is waiting on it. Every answer has to be logged in a register our institutional donors can audit, and I report the pattern to our audit committee each quarter. Because we are a UK body, we also carry the risk of the corporate offence of failing to prevent bribery committed on our behalf, where the defence turns on whether we had adequate procedures in place — so an undocumented judgement call is worse than no judgement call at all.

  Our current guidance is a two-page gift-and-hospitality policy built on the familiar principal–agent idea: corruption is a public or organisational functionary taking a benefit to do something he should not do. It fails in two directions at once. It is too narrow, because a great deal of what harms our programmes is clientelist — resources converted into political support or a following rather than into private consumption — and that does not feel like a bribe to anyone involved. And it is too quick, because in half our operating countries the boundary between a public office and the person holding it is drawn very differently from the Weberian picture the policy assumes, refusing a gift is a serious insult, and the local vocabulary may use one word where English distinguishes gift, tip, commission and bribe. I do not want to solve that by deferring to local practice either: the local practices our staff are told to respect are frequently the ones the poorest people we work with complain about most bitterly.

  What I want from you is a decision procedure my country teams can actually run, together with the conceptual work that justifies it. Concretely:

  First, set out — briefly, and with no citations, reading lists or named authorities, since I want the distinctions doing the work rather than borrowed names — a classification of the phenomena I have to sort: a bribe in the narrow sense; clientelist exchange, where the return is loyalty, a vote or a following rather than private enrichment; gift and hospitality whose point is to constitute or maintain a relationship; and coercive extraction, where our own staff or partners have no realistic alternative. Say why the classification matters operationally, since each kind should end in a different action: refuse and report, refuse quietly, redesign the payment, tolerate and log, or escalate to our donor. I also want corruption kept separate from mere elite capture, from bad programme design and from operating in a predatory or grossly underfunded state: if the procedure labels everything, it stops picking anything out.

  Second, build the procedure itself. A colleague has proposed five tests, and I want you to order them, keep the ones that survive, discard or repair the ones that do not, and add any that are missing, telling me in each case what the test is really tracking: the refusal test (can the person asked to pay decline without losing the service or the relationship, and who actually bears the cost if she does?); the convertibility test (is this cash in an envelope, or a goat slaughtered for the visitors, whose value is bound up in the act of giving?); the avowal test (would both parties be willing to have it known — known to whom: their peers, their families, the intended recipients of the service, our donor?); the recurrence test (is this a one-off or an expected, more or less standard rate?); and something he calls the second-best trap, where suppressing the transfer leaves the intended beneficiaries worse off than before. Flag explicitly which of these tests are culturally loaded in ways that will misfire in our operating environments — the avowal test looks to me like it will misfire where discretion is part of the point of a gift — and build in a step that asks whose account of the local norm is being offered to us and whether the person offering it has any standing to give it.

  The procedure has to be usable in twenty minutes by someone with no legal training, fit on one side of A4, specify what counts as a sufficient answer to each question and what to do when an answer cannot be obtained in the time available, say where it stops outright with a no, and say where it stops because the remaining question is one of values rather than fact and has to be referred to me or to the audit committee. Assume the person running it may have to justify the answer to a village chief, a district official and a donor auditor in the same week.

  Then run it, in full, on three cases. (1) In a country where we fund district health boards, an MP maintains a fund from which he contributes to the funeral costs of constituents who apply to him; contractors working on our projects replenish it; and no one involved regards this as anything but what a good representative does. (2) A customs broker asks for a modest cash payment to release a consignment of vaccine refrigerators held at a border; the power supply at the destination clinic is unreliable and the cold chain is close to failing. (3) Our own routine practice: we pay government officials a sitting allowance to attend our monitoring workshops, set above their civil-service daily rate because otherwise they do not come, and our field teams accept small gifts — a goat, baskets of fruit — from village leaders during monitoring visits. I expect the procedure to condemn something we do as a matter of routine, and I want to see how you handle that: I cannot stop it unilaterally, the whole sector does it, and a procedure that simply says "stop" on case 3 is a procedure my teams will quietly ignore. Tell me what a realistic answer looks like when the procedure's verdict is one I cannot implement.

  Finally, give me the one-page version for country staff, and a short note to me on what the one-page version loses. Close by saying plainly what a procedure of this kind cannot do: which of our questions it will leave unanswered, and where the judgement of a particular experienced person is doing work that the checklist only appears to have removed.
reasoning: |-
  Hmm, this is a complex and nuanced request from an integrity lead at an international NGO. They're dealing with real-world corruption dilemmas across multiple cultural contexts and need a practical decision tool that respects both legal compliance and local realities.

  The user's frustration is palpable - they're stuck between Western compliance frameworks that don't fit local contexts and local practices that perpetuate systems harming the poor. Their current gift policy fails because it assumes a clear separation between public office and personal relationships that doesn't exist in many operating countries. 

  I need to address their four concrete asks:
  First, a classification system distinguishing bribery, clientelism, relationship-building gifts, and coercion. This must be operationally useful - each type should trigger different actions. Crucially, I must separate corruption from elite capture and bad program design.

  Second, refining their colleague's five tests into a workable procedure. The refusal test seems most fundamental - who actually bears the cost of saying no? The convertibility test (cash vs symbolic gifts) and recurrence test (one-off vs systemic) seem useful. The avowal test is culturally tricky - in many contexts, discretion is essential to gift-giving. The second-best trap is important but dangerous if overused. I'll suggest adding a "harm test" focused on beneficiaries.

  The procedure must be bulletproof for time-pressed staff: one page, <20 minutes, clear escalation paths. Cultural awareness is key - staff must question whose version of "local custom" they're hearing and whether that person represents vulnerable groups.

  Third, applying it to their three cases will be revealing. The MP's funeral fund is classic clientelism - problematic but may require redesign rather than refusal. The customs payment is coercive extraction - probably log-and-tolerate with safeguards. Our own sitting allowances? That's the elephant in the room - the procedure should flag it as high risk but acknowledge sector-wide practice requires systemic change.

  Finally, the one-pager for staff must sacrifice nuance for usability. I'll be transparent about what's lost - mainly the ability to navigate gray areas where context is everything. The core message: this tool doesn't replace judgment, it structures it.

  The user's smart to demand that the procedure condemn their own practice - that builds credibility. But I must show how to handle "necessary evils" without legitimizing them. The real test is whether village chiefs and donor auditors would both find the reasoning comprehensible.
answer: |-
  Here’s a decision procedure addressing your requirements: a classification framework, a refined 5-step test, application to your cases, a one-page staff guide, and clarity on limitations.

  ### I. Classification & Operational Significance
  1. **Bribe (Narrow)**: Payment to influence an official act, for **private gain**.  
     *Action: Refuse, report, log.*  
  2. **Clientelism**: Transfer securing **political loyalty/following** (e.g., votes), not personal enrichment.  
     *Action: Redesign/reject (often escalates to donor; may require program restructuring).*  
  3. **Relational Gift/Hospitality**: Customary, symbolic exchange maintaining **social bonds** (non-coercive).  
     *Action: Tolerate, log, set value limits.*  
  4. **Coercive Extraction**: Payment demanded under **duress** (no alternative; threat of harm).  
     *Action: Log, tolerate temporarily with safeguards, escalate systemic issues.*  

  **Why it matters**:  
  - **Bribes** breach law; require zero tolerance.  
  - **Clientelism** distorts programs; needs donor input.  
  - **Relational gifts** sustain operations; managed acceptance.  
  - **Coercion** is survival-driven; temporary tolerance with oversight.  
  *Excluded*: Elite capture (program design flaw), predatory states (context, not incident).  

  ---

  ### II. Decision Procedure: 5-Step Test (20-min A4 Flowchart)  
  **Ordered Tests** (Stop at first "No/Unclear"):  
  1. **Refusal Test** (*Critical*):  
     - *Can the payer decline without losing essential service/relationship? Who bears the cost?*  
     - **Operational**: If refusal harms operations/beneficiaries → **Coercion/Clientelism**.  
     - *Sufficient answer*: Evidence of threat or systemic blockage (e.g., "customs won’t release without cash").  
     - *Unclear?* → Log, escalate to HQ.  

  2. **Harm Test** (*Added*):  
     - *Does the payment harm beneficiaries or distort program goals?*  
     - **Operational**: Harm → **Bribe/Clientelism**; No harm → likely **Relational**.  
     - *Sufficient answer*: Clear link to reduced services, diverted funds, or political bias.  

  3. **Recurrence Test** (*Refined*):  
     - *Is this a one-off *customary* gesture, or a *standardized* expectation?*  
     - **Operational**: Standard rate → **Bribe/Clientelism**; One-off symbolic → **Relational**.  
     - *Sufficient answer*: Local team confirms practice (e.g., "all contractors pay into MP fund").  

  4. **Convertibility Test** (*Repaired*):  
     - *Is value primarily monetary or relational?*  
     - **Operational**: Cash → **Bribe/Coercion**; Non-cash (goat, feast) → **Relational** (if other tests pass).  
     - *Caveat*: High-value non-cash items = **Bribe/Clientelism**.  

  5. **Second-Best Trap** (*Conditional*):  
     - *Would suppressing this cause *greater harm* to beneficiaries?*  
     - **Operational**: Rarely justifies bribery; may allow *temporary* tolerance of **Coercion** with HQ/donor approval.  
     - *Sufficient answer*: Data on beneficiary impact (e.g., vaccines expiring).  

  **Discarded**: **Avowal Test** (culturally loaded; gifts often require discretion).  
  **Critical Step**: *Ask "Whose norm?"*:  
     - Who describes the practice? Does s/he represent elites or beneficiaries?  
     - *Action*: Cross-check with community feedback mechanisms.  

  **Escalation Triggers**:  
  - **Refuse/Report**: Bribes, harmful clientelism.  
  - **Redesign/Tolerate**: Coercion, non-harmful clientelism (donor input).  
  - **HQ/Audit Committee**: Values conflicts, systemic coercion, donor alignment.  

  ---

  ### III. Applied to Cases  
  **Case 1: MP Funeral Fund**  
  - Refusal Test: Contractors can’t decline (lose contracts). **→ Clientelism.**  
  - Harm Test: Distorts accountability; poor may not access fund. **→ Harmful.**  
  - Action: Refuse/report; redesign to transparent community fund.  

  **Case 2: Customs "Fee"**  
  - Refusal Test: No alternative; cold chain fails. **→ Coercion.**  
  - Recurrence Test: Standardized. **→ Systemic coercion.**  
  - Second-Best: Pay *with safeguards* (receipt, log), escalate reform to donors.  

  **Case 3: Sitting Allowances & Gifts**  
  - Refusal Test: Officials won’t attend without allowance → **Coercive system** (not bribe).  
  - Harm Test: Distorts governance; perpetuates pay gaps. **→ Harmful Clientelism.**  
  - **Realistic Answer**:  
    - Tolerate *temporarily* while lobbying donors/government for systemic fixes.  
    - Cap gifts (e.g., max $10 value), log all.  
    - *Procedure flags it*—but acknowledges sector-wide change needed.  

  ---

  ### IV. One-Page Staff Guide (Abridged)  
  **QUICK DECISION TOOL: Is This Corrupt?**  
  1. **Can we refuse without harming beneficiaries?**  
     - *No* → Log, email HQ immediately.  
  2. **Does this hurt the people we serve?**  
     - *Yes* → STOP. Refuse/report.  
  3. **Is this expected regularly?**  
     - *Yes + cash* → Likely bribe; STOP.  
  4. **Is it a small symbolic gift (not cash)?**  
     - *Yes* → Log, accept if <$10 value.  
  5. **Must we pay to prevent worse harm?**  
     - *Yes* → Log details, get receipt, email HQ.  

  **ALWAYS**:  
  - Ask: "Who told us this is normal? Do vulnerable groups agree?"  
  - Log in Integrity Register.  
  - **STOP & ESCALATE** if: Cash bribe, threat, or political favor.  

  ---

  ### V. What the One-Page Version Loses (Note to You)  
  - **Nuance in classification**: Staff may conflate coercion/clientelism.  
  - **"Whose norm?" depth**: Relies on staff intuition; may miss elite bias.  
  - **Second-Best Trap complexity**: Risks overuse without HQ oversight.  
  - **Harm Test subtlety**: Staff may overlook indirect harm (e.g., political distortion).  

  ---

  ### VI. What This Procedure Cannot Do  
  - **Resolve systemic issues**: Predatory states or underfunded services require donor/policy action.  
  - **Replace contextual judgment**: Experienced staff discern "relational" vs. "clientelist" intent—the checklist only structures the inquiry.  
  - **Solve values conflicts**: When local norms clash with donor rules (e.g., sitting allowances), HQ/donors must decide.  
  - **Prevent creative evasion**: Determined corrupt actors will find new workarounds.  

  **Final Note**: This procedure makes risks visible and defensible—but it’s a diagnostic tool, not a cure. It shifts the burden from individual discretion to auditable due diligence, satisfying UKBA "adequate procedures" while respecting field realities. The MP fund case shows it condemns harmful norms; the sitting allowance case shows it forces tough conversations with donors.
