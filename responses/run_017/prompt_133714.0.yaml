  First, I need to unpack whether this phenomenon has an established name. I recall concepts like logrolling in politics or Coasean bargaining in economics, but those don't capture the value inversion aspect. "Moral outsourcing" feels close but isn't quite right—it misses the reciprocal nature. "Value laundering" popped into my head as a provocative term, though I'm not sure if it exists. 

  *checks academic databases mentally* 
  Nothing perfectly fits. The closest framework is Brennan and Jaworski's work on moral licensing in markets, but even that doesn't address the role-swapping dynamic. This might genuinely need a new term. 

  The user's deeper anxiety seems to be about authenticity erosion—in the church example, they note their partner performs the vegetarianism "badly" without internalizing the spirit. That suggests the discomfort isn't just about inefficiency but about the action becoming hollow when divorced from conviction. 

  Also noteworthy: the feedback loop where both parties overstate the value of what they're receiving ("church suddenly matters more"), which obscures true preferences. That feels like a performative distortion, almost like a weird kind of moral theater. 

  For the definition, I should emphasize: 
  - Reciprocal exchange across incompatible value hierarchies 
  - Each actor specializes in the other's priority 
  - Result: maximal effort directed toward minimally valued goals 

  Biggest uncertainty: Whether this is fundamentally different from standard division of labor. I think yes—because here the "skill" being traded is tolerance for cognitive dissonance, not comparative advantage. The partner isn't better at eating veggie meals; they're just less bothered by the hypocrisy. 

  Should flag that confidence is medium-low on the term itself but high on the mechanism analysis. User seems analytically sophisticated—they'll appreciate the transparency. 

  *double-checks* 
  Ah! The "sitting in a pew" detail matters. Bodily presence as currency makes the alienation more visceral than money donations. That physical dimension might be key to the unease. 

  Final thought: The user might be hoping for validation that their discomfort isn't irrational. The response should affirm that while the trades are Pareto-efficient, they can corrode relational authenticity—which is itself a value.
answer: |-
  This phenomenon you're describing is both fascinating and unsettling—and while there isn't a single universally accepted term for it, it *does* map onto several established concepts. The closest fit is a **Value Inversion Trap**, or more precisely, **Reciprocal Value Externalization**. Here's a breakdown:

  ### Core Definition
  **Reciprocal Value Externalization (RVE)**  
  *When two parties with conflicting values trade commitments, each ends up personally enacting the *other's* values while their own values are enacted *by the other party*. This results in:*  
  1. **Effort/Resource Misalignment**: Each invests maximal effort/resources into the cause they value *least*.  
  2. **Agency Inversion**: The success of one's core value depends entirely on someone who dismisses it.  
  3. **Expressive Displacement**: Actions lose their expressive meaning (e.g., vegetarianism as ethical commitment vs. contractual obligation).  

  ### Why This Isn't *Just* Division of Labor
  - **Standard Division of Labor**: Partners specialize in tasks they’re *relatively better at* (e.g., one cooks, one cleans), preserving alignment between *skill* and *outcome*.  
  - **RVE**: Partners specialize in tasks they’re *ethically opposed to*, decoupling *action* from *conviction*. The "efficiency" comes from tolerating cognitive dissonance, not skill optimization.  
  - **Key Difference**: In RVE, the trade *erodes the symbolic value* of the act itself. Your partner’s half-hearted vegetarianism isn’t just inefficient—it *nullifies* the moral expression you sought.  

  ### Related Concepts (and How They Differ)
  | **Concept**          | **How It Relates**                                                                 | **How It Differs**                                                                 |
  |----------------------|------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------|
  | **Logrolling** (Politics) | Trading support for each other’s priorities (e.g., "I’ll vote for your dam if you back my subsidy"). | Logrolling advances *both* parties’ goals; RVE leaves each party advancing *only* the other’s goals. |
  | **Moral Licensing**  | Doing a "good" act excuses later laxity (e.g., recycling to justify flying).       | Licensing is unilateral self-permission; RVE is a *bilateral* trade of moral discomfort. |
  | **Coasean Bargain**  | Resolving disputes by assigning rights to the party who values them most (e.g., pollution permits). | Coasean solutions *align* resources with values; RVE *inverts* this alignment. |

  ### Why This Feels Awful (It’s Not Just You)
  1. **Expressive Degradation**:  
     - Your actions no longer signal your values. Donating to the animal charity isn’t an act of compassion—it’s a transaction. This strips meaning from the act.  
     - *Example*: Your partner’s vegetarian performance is a hollow ritual, amplifying your frustration because it parodies your ethics.  
  2. **Epistemic Blackout**:  
     - Overstating the value of what you "receive" (e.g., church "mattering more") creates false consensus. You’re no longer learning about each other’s true values—you’re performing gratitude to sustain the trade.  
  3. **Vulnerability to Bad Faith**:  
     - The arrangement incentivizes *minimal compliance* (your partner eats veggie but resents it) or even sabotage (underfunding the charity you care about).  

  ### Is This Inherently Bad? Context Matters
  - **Benign Cases**: Trading minor preferences (e.g., "I’ll watch your favorite movie if you watch mine") is low-stakes RVE. Discomfort is trivial.  
  - **Toxic Cases**: When values are **identity-defining** (e.g., ethics, faith), RVE:  
    - Converts deeply held beliefs into bargaining chips.  
    - Breeds resentment as actions become performative (your partner’s church attendance feels like coercion).  
  - **The Line**: RVE becomes harmful when:  
    - Actions lose their *expressive integrity* (doing X no longer means "I believe in X").  
    - The trade obscures genuine values (you can’t tell if church matters to your partner or if he’s justifying the deal).  

  ### Confidence & Uncertainty
  - **High Confidence**:  
    - This is **not division of labor** but a distinct dynamic of *value dislocation*.  
    - The unease stems from **expressive alienation**—your acts no longer represent you.  
  - **Medium Confidence**:  
    - **"Reciprocal Value Externalization"** best captures the mechanics. ("Value Inversion Trap" is punchier but less precise).  
  - **Lowest Confidence**:  
    - Whether RVE is *always* harmful with identity-level values. **Counterexample**: A climate activist and a libertarian trading donations might still feel satisfied funding "more total good." But in your case, the **embodied stakes** (diet, church attendance) make expressive degradation harder to ignore.  

  ### Why Your Feeling Isn’t a Mistake
  The arrangement "dissolves" practical friction but *amplifies* existential dissonance. You’re not failing to be rational—you’re noticing that **efficiency gained through value-trading can corrode the purpose of the values themselves**. This isn’t resolved by the trade; it’s exposed by it. If the discomfort outweighs the marginal gains (e.g., extra charity dollars), the deal may need renegotiation.  

  **Recommendation**: Frame future swaps around *concrete outcomes* (e.g., "We donate $X total to each cause") without requiring each other to *personally execute* the disvalued act. This preserves resource efficiency while reducing expressive harm.
