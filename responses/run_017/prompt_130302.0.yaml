  ### Decision Tree for Causal Commitments in Metaphysics  
  **Instructions:** Answer each question based on your commitments about the cases and claims. Do not rely on theological labels or assumptions about God's existence. Proceed down the tree until you reach a leaf (a terminal position). Each leaf names a causal theory and states its most awkward commitment.  

  ---

  #### Branching Nodes  
  1. **Fire-Cotton Modal Case**:  
     In the case where fire contacts dry cotton, could the cotton have failed to burn (despite identical conditions)?  
     - **Yes** → Go to Node 2  
     - **No** → Go to Node 3  

  2. **Fire-Cotton Explanatory Connection**:  
     Does the fire explain why the cotton burns (i.e., does it make the burning intelligible)?  
     - **No** → Go to Node 4  
     - **Yes** → Go to Node 5  

  3. **Fire-Cotton Ontological Connection**:  
     Is anything (e.g., heat, energy) produced by the fire and transferred to the cotton?  
     - **No** → Go to Node 6  
     - **Yes** → Go to Node 7  

  4. **Divine Decree Coverage**:  
     Why does fire burn cotton every time?  
     - **A. Each burning is a direct act with no intermediate.** → Go to Node 8  
     - **B. A single stable habit covers all instances.** → Go to Node 9  
     - **C. Fire has a stable nature demanding burning.** → Go to Node 10  

  5. **Cotton-in-Fire Counterfactual**:  
     The claim “if the cotton had been put in the fire, it would have burned” is true because:  
     - **A. The habit/law is stable.** → Go to Node 11  
     - **B. Fire has a nature that demands it.** → Go to Node 12  
     - **C. It is a prediction with no modal backing.** → Go to Node 13  
     - **D. It fails: nothing would have made it burn.** → Go to Node 14  

  6. **Human Action Contribution**:  
     In the case where your arm rises and you intended it, what does your power contribute?  
     - **A. Nothing: the rising occurs independently.** → Go to Node 15  
     - **B. Necessary condition, but not production.** → Go to Leaf 1  
     - **C. Production of the rising.** → Go to Node 16  

  7. **Atom Decay Determination**:  
     In spontaneous decay of a single atom, is the outcome determined by prior conditions and the atom’s nature?  
     - **No** → Go to Node 17  
     - **Yes** → Go to Node 18  

  8. **Causal Claim Meaning**:  
     “Fire causes cotton to burn” means:  
     - **A. Regular succession: fire-cotton contact is followed by burning.** → Go to Leaf 2  
     - **B. Powers: fire and cotton exercise intrinsic powers.** → Go to Leaf 5  
     - **C. Instrumentality: fire is a tool for an agent.** → Go to Leaf 9  
     - **D. Occasion: fire is a condition for the real cause.** → Go to Leaf 1  

  ---

  #### Leaves (Causal Theories)  
  *Paths are denoted by node numbers/answers.*  

  - **Leaf 1: Ashʿarite Occasionalism**  
    Path: 1Y, 2N, 3N, 4A, 6B  
    *Most awkward commitment:* Every event requires direct divine action, making the world radically dependent on constant divine will.  

