answer: |-
  ### Workshop Activity: "Forecasting Challenge"  
  **Goal:** Experience the tension between inside-view intuition and outside-view data in planning, without jargon until debrief.  
  **Time:** 75 minutes  
  **Participants:** 18 first-year PhD students (4 groups of 4–5).  
  **Materials to Bring:**  
  - 4 tangram sets (7 geometric pieces each, stored in envelopes).  
  - 4 printed solution images (identical cat shape for all groups).  
  - 4 sets of historical data cards (30 cards/set, details below).  
  - 4 stopwatches (or a shared timer projected).  
  - 4 envelopes for initial forecasts.  
  - Worksheets (1 per group): Initial forecast, update prediction, updated forecast.  
  - Prizes: Chocolate bars (4) + forfeit props (e.g., silly hat for "most overconfident group").  

  ---

  ### Activity Flow (75 mins total)  
  **Step 1: Introduction & Task Setup (5 mins)**  
  - **Script:** "Today, we’re doing a forecasting challenge. In groups, you’ll solve a puzzle. First, you’ll guess how long it’ll take. Then, you’ll get data from past groups to update your guess. Goal: Predict as accurately as possible."  
  - **Action:** Split into 4 groups. Hand each group:  
    - 1 tangram envelope (pieces inside).  
    - 1 solution image (cat shape).  
    - 1 worksheet (Fig. 1).  

  **Step 2: Inside-View Forecast (8 mins)**  
  - **Script:** "Open your tangram envelope. Study the pieces and solution. As a group, agree on:  
    - A point estimate: Your best guess for how long it’ll take (minutes:seconds).  
    - A 90% confidence interval: A range you’re 90% sure the true time will fall into.  
    Example: 'Point: 8:30. Interval: 5:00–12:00.'  
    Seal your worksheet in this envelope—no peeking later!"  
  - **Action:** Groups discuss and record forecasts. Collect sealed envelopes.  

  **Step 3: Execute Task & Record Times (15 mins)**  
  - **Script:** "Start now! Raise your hand when done. I’ll check your solution and record your time."  
  - **Action:**  
    - Start timer. Groups build the tangram cat.  
    - Record actual time for each group when they finish (or stop at 15:00 if unfinished).  
    - Write times on board: "Group 1: 12:30, Group 2: 14:15," etc.  

  **Step 4: Predict Own Openness to New Data (2 mins)**  
  - **Script:** "Before you see historical data, predict: How much will your point estimate change after seeing past groups’ results? Write a number (e.g., ‘3.5 mins’)."  
  - **Action:** Groups write predicted shift on worksheet (Fig. 2).  

  **Step 5: Update Forecasts with Historical Data (20 mins)**  
  - **Script:** "Here’s a deck of cards with times from past groups who did similar tasks. Your job:  
    1. Sort data into two reference classes:  
       - Class A: ‘Groups who did this exact task (cat tangram)’.  
       - Class B: ‘All groups who did any tangram task (cat, dog, bird, etc.)’.  
    2. Calculate the median time for each class.  
    3. Decide: Which class is more relevant? Should you include/exclude ‘warned groups’ (★)?  
    4. Update your point estimate and 90% interval for how long you’d take if you redid this task now."  
  - **Action:**  
    - Hand each group a deck of 30 historical data cards.  
    - Groups sort, discuss, and record updated forecasts (Fig. 3).  

  **Step 6: Report Results & Score (5 mins)**  
  - **Script:** "Share your initial point, actual time, updated point, and how much you shifted. We’ll score honesty and accuracy."  
  - **Action:**  
    - Groups report: Initial point, actual time, updated point, predicted shift vs. actual shift.  
    - **Scoring:**  
      - **Honesty reward:** Groups rank by interval width (narrower = better). Top 2 get chocolate.  
      - **Accuracy penalty:** Group with largest |initial point – actual time| wears silly hat (forfeit).  

  **Step 7: Debrief (20 mins)**  
  Use this script to guide discussion, then reveal concepts.  

  ---

  ### Historical Data Card Deck (Per Group)  
  **Total Cards:** 30 (printed on index cards).  
  - **Narrow reference class (cat tangram):** 10 cards.  
    - 8 unwarned groups: Times = 6:00, 7:30, 8:00, 9:00, 10:30, 11:00, 11:30, 13:00.  
    - 2 warned groups (★): Times = 16:00, 17:00.  
  - **Broad reference class (all tangrams):** 20 cards.  
    - Dog tangram (8 cards): 8:00–19:00 (median ~13:30).  
    - Bird tangram (7 cards): 9:00–20:00 (median ~14:00).  
    - Rabbit tangram (5 cards): 10:00–22:00 (median ~16:00).  
  - **Key features:**  
    - Narrow class median (excluding ★): 9:45. Narrow class median (including ★): 11:00.  
    - Broad class median: 14:15.  
    - ★ cards trigger debate: "Do warned groups bias the data since we’re also warned?"  

  ---

  ### Anticipated Issues & Mitigations  
  | Issue | Predictable Problem | Mitigation |  
  |-------|----------------------|------------|  
  | **Anchoring** | Loudest member dominates estimate. | Assign roles: "Timekeeper" (quietest) speaks first. |  
  | **Collusion** | Groups share strategies/data. | Spread groups apart; emphasize "no inter-group talk." |  
  | **Task easier than feared** | Groups finish quickly → historical data feels irrelevant. | Debrief: "Today you beat history—but was that luck or skill?" |  
  | **Hedging** | Wide intervals to "game" scoring. | Reward narrow intervals *only if* actual time falls inside. |  
  | **Ties** | Multiple groups have similar scores. | Forfeit hat shared; chocolate broken into pieces. |  

  ---

  ### Debrief Talking Points  
  1. **Map the Activity to Concepts:**  
     - *Inside view:* "Your initial guess was based on your intuition about your group’s skill—the ‘inside view.’"  
     - *Outside view:* "The historical data forced an ‘outside view’—using base rates from similar cases."  
     - *Epistemic modesty:* "Recognizing that your intuition might be flawed without data."  

  2. **Confront Resistances:**  
     - **Reference-class ambiguity:** "You had to choose between Class A (narrow) and Class B (broad). Neither is ‘correct’—it’s a judgment call. Real-world forecasting requires choosing a reference class with incomplete information."  
     - **Double-counting ★ groups:** "If you used data from warned groups, did you ‘double-count’ your own warning? This mirrors real life: Do you adjust base rates for your unique situation, or does that reintroduce bias?"  

  3. **Limitations of the Activity:**  
     - **No diagnostic private evidence:** "In this task, your ‘inside view’ had no unique insights (e.g., ‘I’ve done tangrams before’). In research, you *do* have private evidence! The lesson isn’t ‘ignore your inside view’—it’s ‘temper it with base rates.’"  
     - **Strategic hedging vs. genuine modesty:** "Scoring rewards honest uncertainty, but some might game wide intervals. In reality, we distinguish them by *calibration*: Do your 90% intervals capture truth 90% of the time? Most people’s capture ~50%."  

  4. **Reveal the Jargon:**  
     - "What you experienced is the **planning fallacy**—underestimating task time despite knowing better. **Reference-class forecasting** (using outside-view data) corrects for this. Kahneman’s research shows we ignore base rates unless forced to confront them."  

  ---

  ### Why This Works  
  - **Experiential learning:** Students *feel* the pull of base rates when their estimates shift.  
  - **Designed tensions:** ★ cards and reference-class ambiguity mirror real forecasting dilemmas.  
  - **Safe stakes:** Chocolate incentivizes honesty; forfeit adds humor without real humiliation.  
  - **American English:** Handout uses terms like "index cards," "minutes," and "PhD students."  

  **Post-Activity Tip:** Email students Kahneman’s 1994 paper *Thinking, Fast and Slow* (chapter on planning fallacy) and a summary of reference-class forecasting.
