  I recall that Kant himself might have allowed for "strictly truthful but misleading" statements in some interpretations. And modern Kantians like Korsgaard have argued that deceiving someone who has forfeited their right to truth doesn't damage the communicative practice. That makes me think premise (5) might be too broad.

  The user mentioned they'd rather keep premises (1) and (2) than (4) or (5). That's understandable - (1) and (2) are core to Kant's position. But premise (5) seems more expendable. If we reject (5), we can say that while lying is always wrong, other forms of deception might be permissible in extreme cases like this. That would break the chain before it reaches the unacceptable conclusion.

