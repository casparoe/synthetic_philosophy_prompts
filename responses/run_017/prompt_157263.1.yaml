  The user seems philosophically sophisticated - they're not just looking for an easy way out but want to understand the cost of rejecting different premises. I should acknowledge that rejecting (5) means modifying Kant's absolutism, which has its own costs for consistency. But the alternative leads to endorsing violence against innocents, which seems worse.

