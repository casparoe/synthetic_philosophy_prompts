prompt: |-
  I need a case built to order on the precautionary principle, and built so that it isolates one thing rather than winning by accumulation. I do not want authorities, citations, or case law: the argument has to stand on the case itself.

  Work with this formulation, and do not amend it or substitute a better one: where a course of action carries a risk of serious or irreversible harm, the absence of full scientific certainty about that risk is not by itself a sufficient reason for declining measures against that harm.

  What I want is a case in which this formulation, applied honestly to both arms of a binary choice, initially forbids both — I want the symmetry, or paralysis, objection to have genuine bite — and in which the paralysis is then dissolved by one structural feature of the options, so that the principle yields a determinate verdict: one arm required, and the other either forbidden or at most permitted.

  Constraints on the scenario:

  1. Realistic and contemporary: a decision a real public agency, hospital committee, or utility could face this year, set out in a single paragraph. No science fiction, no civilizational or existential stakes, no runaway technology, no infinite utilities, no devices whose only function is to make the case work.
  2. Both arms must trigger the clause. Each carries a risk of serious and irreversible harm, and the uncertainty about each risk is genuine. A case in which only one side triggers it is worthless to me.
  3. Epistemic symmetry: the uncertainty on the two sides must be of the same kind and to the same degree — the same kind of evidence, the same width of interval, the same residual ignorance. The trigger has to fire twice, so uncertainty cannot be what separates the arms.
  4. Comparable magnitudes: the probabilities must sit in one ordinary band (say 0.5 to 15 per cent over the decision horizon), and both harms must be expressible in a single currency — statistical lives, quality-adjusted years, expected school years, whatever fits the setting. I want no help from a dramatic magnitude gap and none from incommensurability.
  5. Framing-invariance: the verdict must not depend on whether the "do nothing" arm is described as an omission or as an active policy. Show me the case under both descriptions and confirm that the verdict is stable across them.
  6. Proportionality, cost-effectiveness, and burden-of-probation — burden of proof — considerations may enter only after the trigger has fired on both sides. If in fact one of them is carrying the entire argument, say so plainly; that is a permitted thing to report and not a permitted way to win.

  Two things I have already tried and rejected, so that you do not hand them back to me. A doing/allowing asymmetry looked promising and then collapsed under re-description: whether the status quo counted as continuing a practice or as adopting a policy of continuing turned out to be settled by nothing more than how the governing statute happened to be drafted. And a bare appeal to "learning more before we act" is value-of-information reasoning in costume; if reversibility or option value is your resolving feature, it must be stated as a fact about the options — what is recoverable, by when, at whose discretion, at what cost — rather than as an atmosphere.

  What I want back:

  The scenario, one paragraph.

  The derivation: the clause applied to arm A, applied to arm B, the paralysis made explicit, and then the feature that dissolves it, with the resulting verdict stated.

  The numbers, set out where I can check them against constraints 3 and 4.

  The removal test: the smallest perturbation of the case that returns it to paralysis, and what that tells us about which feature is load-bearing.

  The hostile reading: how someone who holds that the precautionary principle is either an idle redescription of risk-weighted cost-benefit analysis with the burden of proof quietly shifted, or else irreducibly paralytic, would characterise what your case actually establishes — and whether the case answers that charge or merely outlaws it by construction.

  If the specification cannot be met as written, say so, and tell me which clause has to give.

  The point of the exercise, so that you know what counts as cheating: I am trying to establish whether the principle has any content that an ordinary expected-utility calculation lacks. A case that reaches its verdict through the size of the harms, through a definition, or through a clause I did not give you establishes nothing I care about.
reasoning: |-
  Okay, let me start by unpacking the user's query. They want a case study based on the precautionary principle that doesn't rely on authorities or citations. The key challenge is creating a scenario where both options initially trigger paralysis due to symmetric risks, but then a structural feature breaks the symmetry.

  First, I need to ensure all constraints are met. The scenario must be realistic, contemporary, and involve a binary decision for a public agency. Both arms must have comparable risks of serious harm with identical uncertainty levels. The harms and probabilities need to be expressed in a single currency, like statistical lives. Framing invariance is crucial—the decision shouldn't change based on describing inaction as omission or policy.

  The user rejected previous approaches like doing/allowing asymmetry and value-of-information reasoning. So, the solution must hinge on an inherent structural difference between the options, not on epistemic gaps or burden shifting.

  I consider water treatment as a possible scenario. Imagine a city water authority choosing between two disinfection methods: Chlorination (standard) and UV/Ozone (new). Both methods have risks. Chlorination might form carcinogenic byproducts, while UV/Ozone could leave microbial pathogens untreated. The uncertainties are symmetric: both have a 5-10% chance of causing harm over 10 years, leading to 1-5 statistical lives lost. 

  The key structural feature is reversibility. If chlorination causes harm, switching to UV/Ozone later can reduce byproducts, but any cancer cases are irreversible. If UV/Ozone underperforms, reverting to chlorination quickly addresses pathogens, preventing irreversible harm. This breaks the paralysis: UV/Ozone is permitted or required because its failure mode is reversible.

  Testing framing invariance: labeling "do nothing" as continuing chlorination or adopting a policy doesn't change the outcome. The reversibility of UV/Ozone's failure mode remains the deciding factor.

  The removal test involves making both harms irreversible. If pathogen deaths from UV/Ozone were also irreversible, paralysis returns. This confirms reversibility as the load-bearing element.

  A hostile reading might argue this is just cost-benefit analysis with reversible risks. But the precautionary principle's unique contribution is prioritizing avoidance of irreversible harm when uncertainties are equal, beyond standard expected utility calculations.

  Ensuring all constraints: probabilities (5-10%), harms (1-5 lives), same uncertainty type (epidemiological models), single currency (statistical lives). The scenario fits a real water authority's decision, avoiding sci-fi or existential stakes.
answer: |-
  Here is a case meeting all specifications, centered on a water treatment decision for a municipal authority:

  ### Scenario
  A municipal water authority must choose a disinfection method for its main reservoir, currently experiencing increased organic load. Option A: Continue existing chlorination. Chlorine reacts with organics, forming trihalomethanes (THMs). Chronic exposure carries a risk of bladder cancer. Current models estimate a 5-10% chance that THM levels exceed thresholds causing 1-5 statistical lives lost over 10 years, but confounding factors prevent precise attribution. Option B: Switch to UV/ozone treatment. This eliminates THM risk but may inadequately control *Cryptosporidium* pathogens during turbidity spikes. Hydraulic models suggest a 5-10% chance of system vulnerability causing 1-5 statistical lives lost from waterborne illness over 10 years. Both harms (cancer deaths, fatal gastroenteritis) are irreversible. Switching technologies costs $2M (irrelevant per constraint 6). The uncertainty for both risks stems from incomplete local hydrological/usage data and identical confidence intervals (95% CI: 1-5 lives; point estimate 3 lives).

  ### Derivation
  1.  **Arm A (Continue Chlorination):** Carries risk of serious/irreversible harm (cancer deaths). Absence of full scientific certainty (attribution gap for local THM effects) exists. Per the principle, this is *not sufficient reason alone* to decline measures against that harm (e.g., switching to UV/ozone). → **Potentially forbidden.**
  2.  **Arm B (Switch to UV/Ozone):** Carries risk of serious/irreversible harm (pathogen deaths). Absence of full scientific certainty (hydraulic model uncertainty for *Crypto* control) exists. Per the principle, this is *not sufficient reason alone* to decline measures against that harm (e.g., sticking with chlorination or adding secondary filtration). → **Potentially forbidden.**
  3.  **Paralysis:** The principle forbids both actions due to their respective risks under uncertainty. No decision is permissible.
  4.  **Dissolving Feature: Reversibility of *Implementation* (vs. Harm):** While *harm* from either option (death) is irreversible, the *policy choice* itself differs. If Arm B (UV/Ozone) is chosen and proves inadequate (pathogen risk materializes), the system can be *reverted to chlorination within 48 hours*, halting the ongoing risk. If Arm A (Chlorination) is chosen and proves harmful (cancer risk materializes), the harm is latent and cumulative; switching later *cannot reverse* exposure or prevent cancers already initiated. The irreversible harm from Arm A becomes "locked in" during the decision period, while the irreversible harm from Arm B requires sustained failure and can be stopped immediately upon detection.
  5.  **Verdict:** The principle requires Arm B (Switch to UV/Ozone). It is permitted (or required) because its failure mode allows rapid intervention to prevent *further* irreversible harm. Arm A (Continue Chlorination) is forbidden because its failure mode irreversibly commits harm during the period of uncertainty, even if stopped later.

  ### Numbers
  *   **Probability of Harm:** Both options: 5-10% chance over 10-year horizon.
  *   **Magnitude of Harm:** Both options: 1-5 statistical lives lost (point estimate 3 lives).
  *   **Uncertainty:** Both risks quantified via predictive models (hydraulic for pathogens, exposure/epidemiological for THMs) with identical 95% confidence intervals (1-5 lives). Residual ignorance concerns unmodeled local variables (soil seepage, user behavior) affecting both equally.

  ### Removal Test
  *   **Perturbation:** Alter Arm B (UV/Ozone) so reversion to chlorination takes 6 months (e.g., requiring new piping). Now, if pathogen risk materializes, 6 months of exposure cause irreversible harm (deaths) before mitigation. *Both arms* now involve irreversible harm becoming locked in during the uncertainty period.
  *   **Result:** Paralysis returns. The principle forbids both Arm A (irreversible lock-in) and Arm B (now also irreversible lock-in). No determinate verdict.
  *   **Load-Bearing Feature:** The *rapid reversibility of the implementation* of Arm B (UV/Ozone) upon detection of failure. This is distinct from the irreversibility of the *harm* itself.

  ### Hostile Reading & Response
  *   **Charge:** "This is just expected utility (EU) in disguise. The reversibility feature reduces the *expected harm* of Arm B. Calculating the net present harm of each option, including the probability and cost of detection/mitigation, would yield the same result (choose B). The principle adds nothing. Alternatively, the paralysis objection stands because true epistemic symmetry would require identical *all things considered* EU calculations, forcing indecision unless the reversibility breaks the symmetry *quantitatively*, which is EU reasoning."
  *   **Case's Answer:** The case directly confronts the charge. The harms and *initial* probabilities/uncertainties are symmetric per constraints 3 & 4. The reversibility feature *is* a structural fact about the options ("what is recoverable, by when, at whose discretion, at what cost"), not an atmospheric appeal to learning. It breaks the symmetry *before* traditional EU factors (like mitigation costs) enter. The principle's distinct content lies in its *categorization* and *prioritization*: it identifies situations where irreversible lock-in occurs *during the decision period under uncertainty* as uniquely prohibitive under the principle, even if the *ex ante* EU might be comparable initially. The verdict flows from the *type* of commitment (reversible vs. locking-in harm) under uncertainty, not a finer-grained EU calculation. The hostile reader must argue that recognizing "irreversible lock-in during uncertainty" as a distinct prohibitive category is either incoherent or collapses into EU. The case asserts it is coherent and distinct.

  ### Point of the Exercise
  The case establishes that the principle has content beyond ordinary EU by generating a verdict based *solely* on the structural characteristic of "irreversible lock-in of harm during the period of uncertainty" vs. "reversible implementation allowing harm prevention upon detection" under conditions of symmetric risk magnitude and uncertainty. It forbids one option based on this lock-in characteristic, not on differing probabilities, magnitudes, costs, or burden of proof shifts. The reversibility feature operates *after* the precautionary trigger fires symmetrically on both arms.

  ---
  **Confirmation of Constraints:**
  1.  **Realistic/Contemporary:** Municipal water disinfection choice with documented THM and *Crypto* risks.
  2.  **Both Arms Trigger:** Cancer (A) and fatal illness (B) are serious/irreversible harms. Uncertainty exists for both.
  3.  **Epistemic Symmetry:** Identical confidence intervals (1-5 lives), same source (model uncertainty + local data gaps).
  4.  **Comparable Magnitudes:** 5-10% probability, 1-5 lives harm (same currency: statistical lives).
  5.  **Framing Invariance:**
      *   *"Do Nothing" as Omission:* "We omit switching from chlorination (A)." → Principle forbids A (risk under uncertainty), requires considering B. Principle also forbids B (its risk). Paralysis → dissolved by reversibility → Requires B.
      *   *"Do Nothing" as Policy:* "We adopt the policy of continued chlorination (A)." → Principle forbids A (risk under uncertainty). Principle forbids B (risk). Paralysis → dissolved by reversibility → Forbids A, requires B. **Verdict stable.**
  6.  **Post-Trigger Resolution:** Proportionality/cost ($2M switch) plays no role. Burden of proof isn't shifted; uncertainty is symmetric. Resolution comes solely from the structural reversibility feature.

  **No clauses were violated in meeting the specification.**
