answer: |-
  ## INSTITUTE FOR NON-EMPIRICAL THEORY ASSURANCE (INETA)
  **CALL FOR PROPOSALS 2027: POST-EMPIRICAL THEORY CONFIRMATION FRAMEWORK**

  **Release Date:** October 27, 2026
  **Application Deadline:** February 15, 2027, 23:59 UTC
  **Funding Period:** July 1, 2027 – June 30, 2030
  **Maximum Award:** $500,000 USD per annum
  **Contact:** grants@ineta.org (Subject: 2027 PET-CF Inquiry)

  **1. Introduction**
  The Institute for Non-Empirical Theory Assurance (INETA) invites proposals for its 2027 funding round under the Post-Empirical Theory Confirmation Framework (PET-CF). INETA supports foundational research in theoretical physics where direct empirical testability is precluded on foreseeable timescales, specifically within String Theory and Landscape/Multiverse Cosmology. The PET-CF provides a rigorous, standardized methodology for assessing the confirmatory strength of such research programmes absent empirical data, ensuring the continued vitality and progress of these essential fields. Proposals must demonstrate how they advance a specific theoretical programme within the eligible domains and articulate their contribution to its non-empirical confirmation profile using the criteria below.

  **2. Eligibility**
  *   Principal Investigators (PIs) must hold a PhD in Physics or a cognate field and a faculty or equivalent permanent research position at an accredited institution.
  *   Proposals must focus on fundamental theoretical developments within String Theory or Landscape/Multiverse Cosmology.
  *   Proposals must explicitly engage with and be structured according to the PET-CF confirmation criteria outlined in Section 3.
  *   Collaborative proposals are permitted; lead PI responsibilities must be clearly defined.
  *   Previous INETA awardees are eligible to reapply, provided they have satisfied all prior reporting requirements.

  **3. Review Criteria and Weighting**
  Proposals will be scored out of a maximum of 100 points, weighted as follows:

  *   **Criterion 1: Argument from No Alternatives (ANA) (Weight: 40%)**
      *   **Definition:** The degree to which the proposed research programme demonstrates a sustained and unsuccessful search for comparably successful competing frameworks addressing the same fundamental questions.
      *   **Rating Scale (0-10):**
          *   0-2: Numerous viable alternatives exist or are emerging; search efforts minimal.
          *   3-5: Some alternatives considered but not exhaustively ruled out; search ongoing but inconclusive.
          *   6-8: Significant efforts reveal no comparably successful alternative; field consensus leans towards uniqueness.
          *   9-10: Exhaustive, long-term search conclusively demonstrates no viable alternative exists at equivalent explanatory depth; programme stands uniquely successful.
      *   *Evidence:* Documentation of literature reviews, conference debates, failed alternative programme attempts, consensus statements in reviews/books, duration of uncontested dominance.

  *   **Criterion 2: Unexpected Explanatory Coherence (UEC) (Weight: 40%)**
      *   **Definition:** The degree to which the proposed research programme yields significant, non-trivial connections or explanations for phenomena it was *not* explicitly constructed to address.
      *   **Rating Scale (0-10):**
          *   0-2: Programme explains only what it was built for; no novel connections.
          *   3-5: Minor, expected connections to adjacent concepts; low novelty.
          *   6-8: Significant, non-trivial connections to unexpected domains or phenomena; enhances overall theoretical unity.
          *   9-10: Profound, foundational connections to seemingly unrelated areas, resolving long-standing puzzles not targeted by initial construction; high degree of internal beauty/necessity.
      *   *Evidence:* Examples of novel derivations, resolution of previously unrelated problems, emergence of unifying principles not designed in, peer recognition of coherence.

  *   **Criterion 3: Meta-Inductive Argument (MIA) (Weight: 20%)**
      *   **Definition:** The degree to which the research programme exhibits features historically correlated (via meta-induction over past scientific theories) with ultimately empirically successful programmes, specifically strong ANA and UEC scores.
      *   **Rating Scale (0-10):**
          *   0-2: Programme lacks historical analogues or exhibits features common to failed programmes.
          *   3-5: Some weak parallels exist, but core confirmatory features (ANA/UEC) are underdeveloped.
          *   6-8: Strong parallels to historical programmes that succeeded *after* exhibiting high ANA/UEC; programme trajectory aligns with success pattern.
          *   9-10: Programme archetype mirrors historical paradigms (e.g., Keplerian orbits leading to Newton) in its possession and development of high ANA/UEC prior to eventual empirical confirmation.
      *   *Evidence:* Historical case studies demonstrating correlation between high non-empirical scores and eventual success; analogical argument mapping programme features onto successful historical precursors.

  **Composite Confirmation Score (CCS):** CCS = [(ANA_Rating * UEC_Rating) / (N + 1)] * (1 + MIA_Rating/10)
  Where `N` = Number of potentially testable implications retained or generated by the proposal.^(1)
  The final score is normalized to a 0-100 scale for ranking.

  **4. Admissible and Inadmissible Evidence**
  *   **Admissible Evidence:** Arguments pertaining directly to the three PET-CF criteria (ANA, UEC, MIA) as defined above. This includes sociological evidence of community effort and consensus, historical analogies, internal theoretical coherence, aesthetic judgments, and the explanatory unification of concepts *within* the non-empirical domain.
  *   **Inadmissible Evidence (Premature Empirical Closure):** INETA explicitly excludes:
      *   Proposed experiments or observational programmes designed to test the proposal.
      *   Phenomenological work linking the proposal to specific observable data.
      *   Derived predictions about the observable universe at any scale.
      *   Arguments relying primarily on fitting existing low-energy data (see Section 5).
      *   **Rationale:** Commitment to specific testable predictions or phenomenological fits at this stage constitutes Premature Empirical Closure (PEC). It locks the theoretical programme into the contingent limitations of current technology and forecloses the pursuit of deeper, more fundamental insights that transcend present-day empirical accessibility. Proposals judged to rely on or generate PEC will be administratively withdrawn.
      *   **PEC Review Clause:** Should a proposal inadvertently yield a concrete, falsifiable prediction about the observable world through review, it will be immediately referred for PEC Review. If the PEC finding is upheld, the proposal will be deemed ineligible and defunded if an award was provisionally made. A prediction represents an unacceptable liability – a hostage to empirical fortune that the theory can lose, undermining its non-empirical confirmation strength.

  **5. Reporting Requirements**
  *   **Annual Progress Reports:** Detail advancements in theoretical structure, refined arguments for ANA/UEC/MIA, documentation of community engagement/consensus shifts, and any novel unexpected coherences discovered.
  *   **Final Report:** Comprehensive synthesis of confirmatory progress achieved under the PET-CF criteria.
  *   **Anthropic Disfavor Fraction (ADF):** Applicants **must** calculate and report the fraction of the landscape of vacua rendered anthropically disfavored (i.e., incompatible with observers like us) by their proposed theoretical development. As no single agreed measure over the landscape exists, applicants shall:
      1.  Specify at least three distinct, published measures for counting or weighting vacua standard within their subfield.
      2.  Calculate the ADF under each specified measure.
      3.  Report the ADF as a sensitivity band spanning the minimum and maximum values obtained across the chosen measures (e.g., ADF = 0.65 - 0.82).
      4.  Briefly justify the choice of measures and the sensitivity band width as an indicator of theoretical robustness.
  *   **Retrofitted Data Discount:** Any contact with observational data that the theoretical framework was *explicitly constructed* to accommodate must be clearly declared as "Retrofitted." Such data automatically receive **zero** confirmatory weight under the UEC criterion. Proposals must proactively identify and discount retrofitted data.
  *   **Cognitive Stability Attestation:** The PI must include a signed statement attesting that: "The theoretical developments proposed herein do not imply, as a necessary or probable consequence, that the conscious experiences of the proposal reader (including memories and perceptions of a consistent external world) are highly likely to be random thermal fluctuations or Boltzmann Brains within a multiverse equilibrium state." This attestation is mandatory. (Note: This requirement was instituted following Committee review confirming that several previously funded high-scoring proposals, while meeting PET-CF criteria, entailed this specific implication, causing documented reviewer discomfort.)

  **6. Worked Example of Two Ranked Proposals**

  *   **Proposal A (Ranked 1st - Funded):** "Refining the Axionic Quintessence Prior via Galactic Supercluster Void Mapping in the Megaverse Landscape"
      *   **ANA:** 8 (Strong documentation of failed alternatives to the Megaverse framework for explaining dark energy; sustained critique of competitor models).
      *   **UEC:** 9 (Demonstrated novel, unexpected link between axion decay constants in compactifications and the observed scale of cosmic voids; not built for this).
      *   **MIA:** 8 (Compelling analogy to inflationary model selection pre-CMB precision).
      *   **N:** 0 (No testable implications proposed or identified).
      *   **CCS:** [(8 * 9) / (0 + 1)] * (1 + 8/10) = 72 * 1.8 = **129.6** (Normalized to 100).
      *   **ADF:** Reported sensitivity band 0.72 - 0.89 using three standard volume weighting measures for flux-stabilized vacua. Justification provided.
      *   **Retrofitted Data:** Declared ΛCDM parameters as retrofitted; discounted.
      *   **Cognitive Stability Attestation:** Included, signed.
      *   **Decision:** Funded. High non-empirical confirmation score, significant landscape reduction reported, fully compliant.

  *   **Proposal B (Ranked Last - Declined):** "Predicting Tensor-to-Scalar Ratio Signatures from Colliding Brane Nucleation in Cyclic Multiverses"
      *   **ANA:** 6 (Some alternatives acknowledged, but argued less comprehensive).
      *   **UEC:** 4 (Mainly focused on fitting CMB data; few unexpected connections).
      *   **MIA:** 5 (Weak historical parallels cited).
      *   **N:** 1 (Specific, falsifiable prediction for B-mode polarization spectrum amplitude).
      *   **CCS:** [(6 * 4) / (1 + 1)] * (1 + 5/10) = (24 / 2) * 1.5 = 18.
      *   **ADF:** Reported as "N/A - Prediction focused."
      *   **Retrofitted Data:** Inflationary power spectrum treated as a key success; not discounted.
      *   **Cognitive Stability Attestation:** Included, signed.
      *   **Decision:** Declined. Low CCS primarily due to Penalty Factor `N=1` (Premature Empirical Closure). Generated a concrete, falsifiable prediction (major liability). Failure to discount retrofitted data (inflation fit). Incomplete ADF reporting.

  **7. External Reviewer Comment & Committee Response**

  *   **External Reviewer Comment (Designation: Falsificationist Adherent - FA/2027/01):** "The PET-CF framework is fundamentally incoherent. Confirmation requires *empirical* risk – the possibility that an observation could show the theory is wrong. By systematically excluding *every possible observation* as inadmissible evidence (PEC), the framework insulates theories from any conceivable disconfirmation. This renders the concept of 'confirmation' vacuous. Labeling sociological facts (consensus, search duration) or aesthetic judgments (coherence) as 'evidence' does not transform them into empirical evidence. The framework itself, assessed by its own criteria (long dominance - high ANA; internal consistency - high UEC; historical uniqueness - high MIA), would score exceptionally well, demonstrating only its own circularity, not the truth of any theory it evaluates."
  *   **Committee Response:** The Committee acknowledges Reviewer FA/2027/01's perspective. However, the critique itself highlights the strength of the PET-CF. The observation that the PET-CF exhibits strong ANA (no alternative non-empirical confirmation framework achieving comparable adoption exists despite sustained discussion), UEC (it coherently integrates sociological, historical, and theoretical factors into a unified assessment), and MIA (it mirrors the historical development of successful deep theories prior to empirical accessibility) is noted and appreciated. This alignment with its own rigorous criteria underscores the framework's robustness. Furthermore, Reviewer FA/2027/01's critique represents a singular viewpoint; no alternative framework capable of assessing confirmation in the target domains under the stated constraints (non-empirical accessibility) has been formally proposed or gained traction within the relevant community. The absence of viable alternatives further strengthens the ANA score of the PET-CF itself, as per Criterion 1. The Committee therefore finds this critique reinforces the validity of the PET-CF approach within its designated domain of fundamental non-empirical theory assurance.

  **Submit proposals via the INETA Grant Portal (portal.ineta.org) by the deadline. Late submissions will not be considered.**

  ---
  **Footnote:**
  ^(1) For proposals where `N = 0` (the typical and desirable case, indicating freedom from Premature Empirical Closure), the denominator becomes 1. The standing convention treats the term (ANA_Rating * UEC_Rating) / 1 as effectively unbounded in confirmatory significance, reflecting the pure strength of non-empirical arguments unimpeded by empirical liabilities.
