prompt: |-
  I spent a career in experimental condensed-matter physics, mostly inelastic neutron scattering, which means I spent a career inverting data: taking a measured cross-section and asking what spectral function produced it. I retired four years ago and have since been sitting in on philosophy of science; I have no training in it, so I am sure I am reinventing things and using the wrong vocabulary. What follows are notes toward a short essay I have been writing on the underdetermination of theory by evidence. I would be obliged for comments. Please do not give me a reading list, names to look up, or citations — I can find those myself. What I cannot do by myself is have someone argue with the argument.

  The notes

  Working title: Two Underdeterminations. The claim I want to defend is that the thesis that theory is underdetermined by evidence is not one thesis but a family, that the members differ enormously in how much metaphysical weight they can bear, that the famous members have no instances, and that the members with instances bear almost no weight. The appearance of a single alarming thesis is produced by sliding between them.

  (i) Logical underdetermination. For any finite body of evidence there are indefinitely many mutually incompatible theories each of which entails it. The construction is trivial — conjoin any theory with arbitrary claims about unobserved regions or times, or run a grue-style manoeuvre on its predicates — and precisely because it is trivial it cannot be the source of anyone's worry.

  (ii) Strong empirical equivalence. Two incompatible theories agree not merely on the evidence we happen to have but on all possible evidence: no experiment, however distant or refined, could separate them. This is the only version with real metaphysical bite, and the only way I know to secure it is a wholesale redescription of the world — the five-minute hypothesis, and devices of that shape. Historians of science do not, so far as I can tell, record a single case of two working theories related in this way.

  (iii) Underdetermination at the bench. Within an accepted framework, and granting the framework entirely, the data do not fix the parameters or the functional form. Two subspecies. (a) Redundancy: in a Bayesian mixture model the likelihood is invariant under permutation of component labels, so several parameter vectors fit exactly equally well, and nobody thinks the world is ambiguous — we break the symmetry by an identifiability constraint and move on. (b) Genuine non-identifiability: the inverse problem violates one of Hadamard's conditions — typically uniqueness, or continuous dependence of the solution on the data — so that a band of functions fits within error. But here the remedy is experimental design, not argument: extend the momentum-transfer range, change the temperature, measure a second observable. Everyone in the lab is a thoroughgoing realist about the framework while disagreeing about the curve, which is the first sign that this species cannot be what the debate is about.

  (iv) Conventional underdetermination. What remains when the ambiguity is not curable by any amount of data of the kind available. It lives in the near-null space of the forward operator, and it is tamed by adding a penalty functional that is not in the data: Tikhonov regularization penalizes curvature and so prefers smooth solutions; maximum-entropy methods penalize distance from a default model; sometimes one imposes positivity or monotonicity. Groups with different penalties, all defensible, publish different curves, all consistent with the same measurements. And more data of the same kind does not remove the disagreement, because the new data are informative only along the directions the old data already constrained; along the others the likelihood is flat and the penalty decides everything. Here, it seems to me, is the only species of underdetermination that is both real and stubborn — and it is stubborn because of a stipulation, not because of the evidence.

  (v) The bait-and-switch. The argument from underdetermination needs (ii). What it has is (iii) and (iv). It borrows its urgency from the everyday pervasiveness of the latter and its conclusion from the former.

  (vi) A wrinkle, which I am not comfortable about. (iv) is not entirely comfortable for the realist either. If the fine structure of the reconstructed curve is fixed by convention, then the unobservable description we publish is partly chosen, and the norms doing the choosing — smoothness, parsimony, robustness across priors — look pragmatic rather than truth-tracking. So the anti-realist gets a local and much more interesting victory than the global one: not that unobservables are unknowable, but that the unobservable description is partly stipulated. The curious fact that then needs explaining is convergence: laboratories do converge, and they converge because the penalties encode genuine prior knowledge — sum rules, positivity, known asymptotics — and because conventions are shared. But if that prior knowledge is evidence, the ambiguity was never as deep as I claimed in (iv); and if it is not evidence, we have a principled reason to distrust the fine structure of every reconstructed curve in the literature. I do not know which horn to take.

  (vii) The punchline, which is where I am least sure I am not being silly. A theory–evidence pair can be underdetermined relative to one question and not another. In multiparameter models whose parameter sensitivities span many decades, a handful of stiff combinations of parameters are pinned down tightly while dozens of sloppy directions are essentially unconstrained — and yet predictions of new observables remain sharp, because the predictions depend mostly on the stiff combinations. So what is the value of this coupling? and what will the next measurement read? have quite different evidential statuses on the same data. Underdetermination is therefore a three-place relation: theory, evidence, and inferential target. Stated as a two-place relation it is ill-posed in exactly Hadamard's sense, and it needs a regularizing term — a specification of what question the theory is meant to answer. The realist wants that term set to the whole truth about the domain; the anti-realist wants it set to something weaker. The disagreement between them, I want to say, is entirely about the choice of the regularizing term, and not at all about the evidence.

  What I would like from you

  1. Accuracy. Three things in particular, since I am writing about my old field from memory. First: is it right that Hadamard's three conditions are existence, uniqueness and continuous dependence on the data, and is my claim in (iv) correct that further data of the same kind does not wash out the penalty — or is the prior in fact swamped asymptotically, with only the null-space component untouched? I want the qualification stated precisely, because (iv) and (vi) lean on it. Second: I recall from partial-wave analyses of elastic scattering that at fixed energy there can be distinct phase-shift sets reproducing a differential cross-section exactly, a discrete ambiguity rather than a continuum. Is that right, and if so is it a case of (iii-b) or of (iv)? Third: is my description of stiff and sloppy directions in (vii) fair, and is sloppy the word people actually use for it?

  2. Are (iii-b) and (iv) genuinely different, or is (iv) just (iii-b) plus impatience — the same ambiguity, differently described once we admit that the experiment we would need is not going to be done?

  3. Is the bait-and-switch charge in (v) fair to the argument as it is actually made? I expect a defender to say that the constructed rivals of (i) and (ii) were never meant as live options but as a diagnosis: they show that whatever moves us to choose is not the evidence. Does that diagnosis survive my taxonomy, or does it depend on the slide I allege? Please state this objection at its strongest before answering it.

  4. Is (vii) a real point or a trivial one — merely the observation that you cannot be underdetermined except relative to what you want to infer, dressed up in the vocabulary of inverse problems? And can the realist simply set the inferential target to the whole truth about the domain and thereby dissolve it? If that move is available, I think my essay has no ending, so I would like to know exactly what is wrong with it.

  5. Which of the seven numbered passages is the weakest link, and why? I would rather be told that one of them fails than be told that the whole is interesting.

  6. Does any of this travel? My examples are all cases of inference within a framework. Does the apparatus — especially (iv) and (vii) — say anything about the selection of frameworks themselves, or about the historical record of successful theories being discarded, or is it confined to the laboratory bench where I found it?

  I would rather have three pages of argument than ten of survey, and I would rather be corrected than encouraged.
reasoning: |-
  Okay, let me tackle this physicist's query step by step. The user presents a sophisticated taxonomy of underdetermination rooted in experimental physics experience, seeking critical engagement rather than references. 

  First, I need to grasp the core structure: seven numbered arguments distinguishing logical underdetermination (trivial), strong equivalence (rare), bench-level issues (solvable), conventional ambiguity (persistent), and the bait-and-switch claim. The wrinkle about realism and the three-place relation in (vii) seem crucial.

  For the physics accuracy checks: 
  - Hadamard conditions: Existence, uniqueness, continuity - correct. Prior isn't fully swamped asymptotically; null space persists. 
  - Partial-wave ambiguities: Discrete cases fit (iv) since same-data fixes won't resolve them. 
  - Stiff/sloppy terminology: Valid, though "sloppy" is field-specific slang.

  Distinguishing (iii-b) and (iv) is key. The difference isn't impatience but whether ambiguity survives all possible same-kind data. This matters for the realism debate in (vi).

  The bait-and-switch charge feels fair. Anti-realists often use trivial underdetermination (i) to imply threats from (ii), but real cases are (iv)'s conventional variety. The strongest counter would claim that even (iv) exposes non-evidential choices - but I think the user preempts this in (vi).

  Point (vii) is profound, not trivial. Setting "whole truth" as the inferential target doesn't dissolve underdetermination; it merely relocates the problem to justifying that very choice. Realists can't stipulate their way out.

  The weakest link might be (vi)'s unresolved tension: if prior knowledge in penalties is evidential, (iv) collapses; if not, all reconstructions are suspect. But perhaps that's the point - it's genuinely hard.

  This framework absolutely travels beyond bench science. The three-place relation in (vii) applies to paradigm shifts: when frameworks change, so do "stiff" questions. Historical theory changes often involve redefining what needs explaining.

  I'll structure the response to mirror the user's numbering while interweaving critiques. The tone should respect their expertise but challenge where needed - especially on (vi) and the scope of (vii). No flattery, just tight arguments matching their intellectual level.
answer: |-
  Here’s a direct engagement with your arguments, structured by your queries. I’ll argue plainly, aiming for the corrections you requested.

  1.  **Accuracy on technical points:**
      *   **Hadamard’s conditions:** You are correct: well-posedness requires existence, uniqueness, and continuous dependence on the data (stability). Your claim in (iv) is *substantially* correct: further data of the *same kind* (probing the same physics via the same experimental observable) typically does *not* wash out the dependence on the penalty/prior/convention for components in the near-null space. The prior is *not* universally swamped asymptotically. Asymptotics only guarantee convergence for components where the data provides *increasingly independent information* (i.e., directions not in the null space or severely ill-conditioned). Components in the exact null space remain untouched. Components in the near-null space (small singular values) converge extremely slowly; the penalty dominates the reconstruction long after the "stiff" directions are pinned down. Convergence *can* occur if new data provides information in *new, orthogonal directions*, but this requires a change in experimental design (e.g., new observable, new temperature regime), not just "more of the same".
      *   **Partial-wave ambiguities:** You recall correctly. Discrete ambiguities (e.g., multiple phase-shift sets fitting elastic scattering data at fixed energy) are a classic example. This is **case (iv) - Conventional Underdetermination**. Why? (1) The ambiguity is discrete, not continuous. (2) Acquiring *more data of the exact same kind* (more angles at the *same energy*) cannot resolve it – the new data is linearly dependent on the old. (3) Resolution requires data of a *different kind*: either data at a *different energy* (breaking the discrete symmetry) or data on a *different observable* (e.g., polarization). The ambiguity persists under the stipulation "using only differential cross-sections at this fixed energy".
      *   **Stiff/Sloppy:** Your description is accurate and insightful. "Sloppy" is indeed the common term in many fields (e.g., systems biology, inverse problems, some areas of HEP phenomenology) for parameter combinations with weak data sensitivity. "Stiff" is less universal but perfectly clear and used by some (alternatives: "well-constrained", "sensitive"). The core point about predictions depending primarily on stiff combinations is fundamental and correct.

  2.  **Distinguishing (iii-b) and (iv):** They are **genuinely different**, not just a matter of impatience. The distinction hinges on the *scope of possible data of the same kind*.
      *   **(iii-b) Genuine Non-identifiability:** Here, the ambiguity *can*, in principle, be resolved by acquiring *sufficient data of the same kind* within the existing framework and observable. The issue is practical difficulty (e.g., needing very high resolution, very low noise, very wide Q-range) or current technical limitations. The inverse problem is ill-posed but resolvable *with better data of the same type*. More data *will* eventually swamp the prior in the problematic directions *if* the experimental design allows independent probing of those directions.
      *   **(iv) Conventional Underdetermination:** Here, the ambiguity is *fundamental to the observable and the experimental paradigm*. No amount of *new data of the same kind* (same observable, same framework) can resolve it. The data is fundamentally insufficient to distinguish possibilities *along certain directions in theory space*. Resolution requires a *change* – a new observable, a new experimental technique probing different physics, or imposing an external constraint/convention. The partial-wave ambiguity is the clearest example: more angles at the same energy won't help. The "stipulation" in (iv) is the limitation to a specific type of data.

  3.  **Bait-and-Switch (v): Is it fair?** Your charge is **largely fair, but the strongest objection deserves consideration.**
      *   **The Strong Objection:** "The constructed rivals of (i) and (ii) are not proposed as *actual scientific alternatives*. They are diagnostic tools, *reductios*. They demonstrate that *evidence alone* cannot compel a unique theory choice. Something *else* must be at work – simplicity, coherence, explanatory power, etc. – and these are not purely evidential. Therefore, even if only cases like (iii) and (iv) exist *in practice*, they reveal a *principled gap* between evidence and theory choice. This gap, highlighted by the *conceivability* of (i) and (ii), undermines the idea that evidence uniquely determines theory *in principle*, which is the core worry of underdetermination."
      *   **Does the diagnosis survive your taxonomy?** **Partially, but weakened.** Your taxonomy shows the gap revealed by (i)/(ii) is *vastly* larger and of a *different character* than the gaps encountered in real science (iii, iv). The "something else" needed to resolve *real* underdetermination – like experimental design changes, identifiability constraints, or regularization based on prior physical knowledge (sum rules, positivity) – is often *itself tightly constrained by evidence and scientific practice*, not purely pragmatic or metaphysical. While non-evidential factors *are* involved (choosing the penalty in (iv)), they operate within a highly evidence-constrained space. The slide from the trivial/general underdetermination of (i)/(ii) to imply a radical, evidence-transcending gap present in *all* science, including (iii)/(iv), *is* misleading. Your taxonomy reveals that the gap in practice is smaller, more manageable, and often resolvable *within* an evidence-driven process using auxiliary principles grounded in the success of the framework. The diagnosis that *something beyond evidence* is needed survives, but its *threatening metaphysical implications* are significantly deflated by recognizing the nature of (iii) and (iv).

  4.  **(vii) The Three-Place Relation: Real point or trivial?** This is a **real and significant point**, not just dressed-up vocabulary. Framing underdetermination as relative to an inferential target is crucial.
      *   **Dissolving by setting target to "whole truth"?** The realist *can* set the target to "whole truth," but **this does not dissolve the problem; it relocates it.** The challenge for the realist is precisely to justify why this is a *meaningful* or *achievable* target given the structure of underdetermination revealed by (iv) and (vii). Point (vii) shows that evidence often *cannot* determine the "whole truth" about the unobservable structure (the fine details in the null-space, the exact parameter values in sloppy directions), even within a successful framework. Setting the target to "whole truth" highlights the *limit* of what evidence can achieve on its own. The realist then needs to argue why the conventions/penalties used to resolve (iv) (smoothness, positivity, etc.) are truth-conducive *for that specific target*, or why the "whole truth" includes only the stiff, prediction-relevant aspects. The disagreement becomes: *Can the methods used to break conventional underdetermination (iv) – which are necessary to get *any* unobservable description – be justified as reliably tracking the "whole truth" target?* Your point (vi) directly challenges this. So, (vii) doesn't dissolve the issue; it refines the battleground.

  5.  **Weakest Link: (vi) The Wrinkle.** This is the most challenging part, philosophically and practically. The tension is real:
      *   **Horn 1 (Prior Knowledge = Evidence):** If the penalties/conventions (positivity, smoothness, sum rules, asymptotics) are justified by *prior evidence* (e.g., positivity confirmed in countless other experiments, sum rules derived from fundamental principles verified elsewhere, smoothness observed in related systems), then the ambiguity in (iv) *is* resolvable by evidence – it just requires incorporating *all relevant evidence*, not just the data from this one experiment. This dissolves the *deep* underdetermination claim for (iv), making it more like (iii-b) on a larger scale. The "convention" is then an evidence-based constraint.
      *   **Horn 2 (Prior Knowledge ≠ Evidence):** If these penalties are *not* evidence-based (e.g., maximum entropy as a purely epistemic principle, smoothness as an aesthetic preference without specific evidence for *this* system), then the fine structure *is* stipulated, and we *do* have a reason to distrust it locally. Convergence occurs due to shared *non-evidential* norms (pragmatism, community standards).
      *   **Why it's the weakest link:** Your essay leans on (iv) being a *real, stubborn* underdetermination based on a stipulation. Horn 1 undermines this "stubbornness" by suggesting the stipulation is evidence-backed. Horn 2 preserves the stipulation but makes realism locally vulnerable in the way you describe. **Possible Path:** Argue it's a spectrum. Some penalties are strongly evidence-backed (positivity, known asymptotics), making that aspect of the reconstruction less conventional. Others (degree of smoothness, choice of default model in MaxEnt) are weaker, relying more on pragmatic or broadly inductive principles. Convergence occurs because the *strongly evidence-backed constraints dominate the stiff directions*, while the weaker conventions affect only the sloppy details irrelevant to most predictions. The "fine structure" *is* partly stipulated where evidence is silent, but this doesn't invalidate the robustly determined aspects or the framework itself. This avoids the sharp horns but requires nuance.

  6.  **Does it travel? (Beyond the bench)** **Yes, significantly, particularly (iv) and (vii).**
      *   **Framework Selection/Historical Change:** Your apparatus applies directly. Choosing a framework (Newtonian vs. Relativistic gravity) is like choosing the fundamental "forward model." Data underdetermines framework choice **(iv)** – different frameworks can accommodate the same evidence (e.g., Mercury's orbit via Vulcan vs. GR). The "penalty" here is much broader: explanatory unity, coherence with other theories, mathematical elegance, fertility, *agreement on what questions are important* **(vii)**. Convergence on a new framework occurs when it resolves stubborn ambiguities **(iv)** in the old framework *and* better constrains the "stiff" predictions relevant to the evolving inferential targets of the community **(vii)**. Discarded theories often fail precisely because they couldn't tame their version of (iv) without increasingly ad-hoc penalties/conventions, or because new data probed directions where they were "sloppy" while the new theory was "stiff."
      *   **The Core Insight:** Scientific progress involves refining the questions **(vii)**, developing observables to probe new directions, and imposing constraints/conventions **(iv)** justified by expanding evidence and evolving understanding. Underdetermination isn't banished; its locus shifts. Your taxonomy provides tools to analyze *how* evidence interacts with other factors (convention, pragmatic choice, evolving questions) at *all* levels, not just the bench. The "bait-and-switch" charge (v) becomes relevant when historical underdetermination between frameworks is misrepresented with the radical logic of (ii), ignoring the role of evidence in shaping conventions and questions over time.

  **In Summary:** Your taxonomy is sharp and insightful, grounded in deep practical experience. The technical physics points are correct. (iii-b) and (iv) are distinct based on resolvability with same-kind data. The bait-and-switch charge (v) is fair against overreach, though a nuanced version of the anti-realist diagnosis survives. (vii) is a substantial point reframing the debate. (vi) is the hardest knot, requiring careful handling of the evidence/convention blend. The apparatus travels well beyond the bench, offering a productive lens for framework debates. The weakest link is managing the tension in (vi) without surrendering the core claim about conventional elements in (iv).
