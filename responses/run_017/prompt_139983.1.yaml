  Their proposed alternatives (fire investigation/epidemiology) reveal a need for models that institutionalize skepticism about outcomes. Interesting that they note fire investigators' rule against premature arson labels - that directly counters the "culprit" problem they identified in historical blame narratives. The epidemiology parallel is equally sharp: case definitions versus causal hypotheses could help disentangle the user's "burnt palace as collapse evidence" dilemma.

  I should structure this as: 
  First, map the detective analogy faithfully (crime→collapse, clues→material traces etc.). 
