answer: |-
  Here’s a structured proposal framework centered on your granularity thesis, designed to bypass standard debates and offer a fresh methodological approach. Crucially, **the granularity question does not collapse into the relevance question** — it asks whether *how we group entities* (not just *which properties* we use) is itself a moral failure, even if weights are assigned fairly *within* groups.

  ---

  **Dissertation Proposal: The Granularity of Moral Consideration — Is Speciesism a Failure of Categorization?**  

  **1. Core Question**  
  Is speciesism primarily wrong because it uses *species membership itself* as a moral sorting criterion (a "coarse-grained" approach that obscures individual variation), or is it wrong solely because it *assigns unequal weight* to interests across species? If a framework sorts beings by a finely individuated property (e.g., "capacity for episodic foresight") and assigns equal weight to equal interests *regardless of species*, but this results in the same practical outcomes as speciesism (e.g., prioritizing humans), is it still speciesist?  

  **2. Why Standard Arguments Don’t Settle This**  
  - **Argument from Marginal Cases (AMC)**: Only challenges *weighting* by showing humans/animals with similar capacities are treated differently. It doesn’t address whether *grouping by species* is inherently objectionable if weights are equalized *within* groups.  
  - **Racism/Sexism Analogy**: Typically focuses on *unjust weighting* (e.g., valuing Black lives less). Your question targets whether categorizing by race *at all* — even with equal weights — perpetuates oppression by masking individuality (e.g., "racial typology" vs. individual assessment).  
  - **Equal Consideration of Interests**: Assumes we agree on *which interests count* and only debates their weight. Your thesis questions whether coarse grouping *distorts the identification of interests themselves* (e.g., lumping all "non-human animals" obscures distinct needs of octopuses vs. frogs).  

  **3. Key Test Case: The Species-Typical Egalitarian**  
  Imagine an agent who:  
  - Sorts beings into moral categories **based on species-typical cognitive traits** (e.g., "humans: typically high autonomy; chimpanzees: typically moderate autonomy; mice: typically minimal autonomy").  
  - **Assigns equal weight to equal interests *within* each category** (e.g., suffering in one mouse matters equally to suffering in another mouse).  
  - But **refuses to individuate further** (e.g., ignores a highly autonomous pig or a profoundly disabled human, treating them solely by species-typical traits).  
  → *Granularity Claim*: This is still speciesist because it uses species boundaries to justify coarse-grained sorting, refusing to assess individuals.  
  → *Weighting Claim*: This is *not* speciesist because interests are weighted equally once categories are set; the problem is only if weights differ *between* species groups.  

  **4. Methodology (2-Term Plan)**  
  **Term 1: Conceptual Groundwork**  
  - Defend the non-collapse: Show that "granularity" is distinct from "relevance" by analyzing discrimination theory (e.g., Marilyn Frye’s "birdcage" analogy for systemic oppression vs. individual bias).  
  - Map existing positions: Singer (utilitarian weighting) assumes individuation; Nussbaum (capabilities) uses coarse species groups but weights outcomes; McMahan (graded individualism) prioritizes granularity.  
  - Analyze the racism analogy: Does "color-blindness" (grouping by race but equal weighting) fail *because* it uses race as a category? (Cf. critical race theory on abstraction erasing lived experience).  

  **Term 2: Applied Framework Testing**  
  - **Not intuition-pumping**: Instead, use *normative consistency tests*:  
    - Apply the "Species-Typical Egalitarian" model to human cases (e.g., assigning rights by gender-typical traits with equal weight within genders). Is this sexist? If yes, granularity is salient.  
    - Examine policy: Do animal welfare laws (treating "farm animals" as a group) commit granularity failure by ignoring intra-species variation?  
    - Leverage disability ethics: Does the AMC work better as a critique of coarse grouping (ignoring disabled humans) than of weighting?  

  **5. What Success Looks Like**  
  - A positive result: **Demonstrate that coarse-grained sorting by species is *pro tanto* wrong** because it:  
    (a) Epistemically obscures morally relevant individual differences,  
    (b) Perpetuates oppressive structures by naturalizing group boundaries,  
    (c) Fails to treat beings as "individuals" (a moral demand distinct from interest-weighting).  
  - This implies that **even a "fair" hierarchy based on species-typical traits is speciesist** if it refuses finer-grained assessment.  

  **6. Failure Conditions**  
  The project fails if:  
  - Granularity reduces entirely to relevance (e.g., if "finer-grained sorting" just means "using better-relevant properties").  
  - No independent moral principle against coarse grouping can be defended (e.g., if efficiency justifies grouping).  
  - The test cases show no intuitive difference between granularity and weighting critiques.  

  **7. Sharper Version: Avoiding Collapse**  
  Granularity doesn’t ask "Which properties are relevant?" but "**At what resolution must we apply relevant properties?**" The thesis is:  
  > *Any moral framework that uses group membership (e.g., species) as a basis for refusing individual assessment — even if it assigns equal weight within groups — is discriminatory, because moral attention must respond to individual particularity.*  

  **Key Citations to Explore**  
  - **Granularity/Individuation**: Martha Nussbaum (*Frontiers of Justice*), Jeff McMahan (*Ethics of Killing*), Cora Diamond ("Eating Meat and Eating People").  
  - **Discrimination Theory**: Sally Haslanger (*Resisting Reality*), Lawrence Blum (*"Racism: What It Is and What It Isn’t"*).  
  - **Epistemic Critique**: José Medina (*Epistemology of Resistance*), Miranda Fricker (*Epistemic Injustice*).  

  ---

  **Why This Works**  
  You’re shifting focus from "What matters?" to "**How closely must we look?**" — a question underexplored in speciesism debates. By tying it to oppression theory (e.g., refusing individuation as a tool of dehumanization), you avoid rehashing Singer/Regan while offering concrete tools to dissect real-world policies. The test case and human-comparative method provide clear analysis anchors. Now go nail those citations!
