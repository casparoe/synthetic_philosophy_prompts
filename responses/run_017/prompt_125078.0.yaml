  axiom Godlike_essence : 
    ∀ (x : U) (w : W), Godlike w x → 
    ∀ (φ : W → U → Prop), (∀ w' y, Godlike w' y → φ w' y) → 
    (∀ w' y, φ w' y → Godlike w' y) → 
    essence φ x w
