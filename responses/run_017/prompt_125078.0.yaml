  But this is in a constant world? No, we have to world-index.

  In a multi-world setting with fixed domain, Anderson's definition is:

  ```
  def essence (φ : W → U → Prop) (x : U) : Prop := 
    ∀ w, φ w x ∧ ∀ (ψ : W → U → Prop), (∀ w, ψ w x) → □ (∀ w y, φ w y → ψ w y)
  ```

  This says that φ is an essence of x if in every world, φ holds of x, and for any property ψ that x has in every world, necessarily if φ holds of y then ψ holds of y (in the same world).

  Then necessary existence is:

  ```
  def necessary_existence (x : U) : Prop := 
    ∀ φ, essence φ x → □ (∃ y, φ w y)   -- but wait, w is not bound.
  ```

  Actually, necessary existence is that for every essence φ of x, it is necessary that there exists some individual with φ.

  Then, the argument: if x is Godlike, then Godlikeness is an essence of x. How? 

  Proof sketch: 
  - Let x be Godlike in every world (we haven't shown that yet, but assume it for the essence definition).
  - Let φ = Godlike.
  - We need to show: for any property ψ that x has in every world, we have □ (∀ y, Godlike w y → ψ w y).

  But if ψ is a property that x has in every world, then in particular in any world w, if y is Godlike in w, then y has all positive properties, but we don't know that ψ is positive. 

  Anderson's insight: he adds an axiom that a property is positive if and only if it is necessarily positive. Then he shows that any property that is true of x in every world is necessarily entailed by Godlikeness.

  But this is complex. Given the time, we might have to assume that Godlikeness is an essence.

  For the sake of the translation, we will assume:

  ```
  axiom Godlike_is_essence : 
    ∀ (x : U) (w0 : W), Godlike w0 x → essence Godlike x w0
  ```

  which includes the uniqueness part:

  ```
  essence Godlike x w0 := 
    Godlike w0 x ∧ ∀ w y, Godlike w y → y = x
  ```

  Then, with necessary existence being positive, and x having necessary existence (because it has every positive property), we have:

  ```
  NE w0 x
  ```

  which is:

  ```
  ∀ φ, essence φ x w0 → box (λ w, ∃ y, Godlike w y)   -- wait, no: for any essence φ of x, we have box (exists y, φ w y)
  ```

  In particular, take φ = Godlike (which is an essence of x by the axiom), then we have:

  ```
  box (λ w, ∃ y, Godlike w y)
  ```

  which is: in every world, there is a Godlike individual.

  Moreover, by the uniqueness part of the essence, in every world the Godlike individual is x. So we have:

  ```
  box (λ w, Godlike w x)
  ```

  Therefore, God (x) exists in every world.

  Finally, in the actual world (which we can take as one specific world), we have Godlike actual_world x, so we have an actual God.

  ## 4. The collapse objection

  The collapse objection is that the axioms are too strong: they imply that every true proposition is necessary.

  In our setting, we have fixed the modal logic to S5 by the definition of box as a universal quantifier. So semantic collapse is already there: all worlds are mutually accessible. But that is by construction.

  Derivational collapse: does the theory prove that for any proposition p, if p is true then it is necessary? 

  In type theory, we have propositions as types. But we are working in a classical setting? We can try to formalize the collapse.

  The collapse argument: if we have a property P that is true of an individual x in the actual world, then we can form the property "being P and identical to x". If this property is positive, then it is entailed by Godlikeness, so x is the only individual with P, and moreover, necessary existence would make it necessary that x exists and has P.

  But we need to show that "being P and identical to x" is positive.

  How? We don't have that identity properties are positive. 

  In fact, the axioms of positivity do not force that. So in our setting, we might avoid collapse.

  But if we assume that for any individual x and any positive property P, the property "being x and having P" is positive, then we might get collapse. But we haven't assumed that.

  Therefore, in our reconstruction, we do not necessarily have collapse.

  However, we have assumed that Godlikeness is an essence (which includes uniqueness). This might be used in a collapse argument.

  But without further axioms, we avoid collapse.

  ## Summary of the translation

  ### Anselm's argument

  We didn't do Anselm's in detail, but roughly:

  - We have a type `U` of individuals.
  - We have a predicate `Greater : U -> U -> Prop` (world-indexed? not necessarily, but we can do in one world first).

  The argument:

  1. Define God as a being such that no greater being can be conceived.
  2. Assume that God exists in the understanding (i.e., we have an inhabitant of a type that represents the concept).
  3. Then show that if God does not exist in reality, we can conceive of a greater being (one that exists in reality), contradiction.

  In a type-theoretic setting, we might do:

  We have a type `Understanding` which has an element `god : Understanding` representing the concept. We have a predicate `exists_in_reality : Understanding -> Prop`. And we have a notion of greater: `greater (u v : Understanding) : Prop`.

  But the argument is modal, so we need possible worlds. We won't detail it here.

  ### Gödel's argument

  We have:

  - `W : Type` (worlds)
  - `U : Type` (individuals, fixed domain)

  Properties: `W -> U -> Prop`

  Positivity: a predicate on properties:

  ```
  positive : (W -> U -> Prop) -> Prop
  ```

  Axioms for positivity:

  ```
  axiom positive_conj : 
    ∀ P Q, positive P -> positive Q -> positive (λ w x, P w x ∧ Q w x)

  axiom positive_entail : 
    ∀ P Q, positive P -> (∀ w x, P w x -> Q w x) -> positive Q

  axiom positive_exclusive : 
    ∀ P, positive P -> ¬ positive (λ w x, ¬ P w x)

  axiom positive_consistent : 
    ∀ P, positive P -> ∃ w x, P w x   -- but note: this is dia (λ w, ∃ x, P w x)
  ```

  We also need the consistency of the entire set of positive properties:

  ```
  axiom Godlike_possible : ∃ w x, Godlike w x
  ```

  where 

  ```
  def Godlike (w : W) (x : U) : Prop := ∀ P, positive P -> P w x
  ```

  Necessary existence:

  ```
  def essence (φ : W -> U -> Prop) (x : U) (w0 : W) : Prop := 
    φ w0 x ∧ ∀ w y, φ w y -> y = x

  def NE (w : W) (x : U) : Prop := 
    ∀ φ, essence φ x w -> ∀ w', ∃ y, φ w' y   -- which is box (λ w', ∃ y, φ w' y)

  axiom positive_NE : positive (λ w x, NE w x)
  ```

  And the key axiom that Godlikeness is an essence:

  ```
  axiom Godlike_is_essence : 
    ∀ x w0, Godlike w0 x -> essence Godlike x w0
  ```

  Then the proof:

  1. By `Godlike_possible`, there is a world `w0` and an individual `g` such that `Godlike w0 g`.
  2. By `Godlike_is_essence`, we have `essence Godlike g w0`.
  3. Since `Godlike w0 g` and `positive_NE`, we have `NE w0 g` (because Godlike means having all positive properties).
  4. By definition of `NE`, applied to `Godlike` (which is an essence of g), we have `∀ w', ∃ y, Godlike w' y`.
  5. But by the uniqueness part of `essence Godlike g w0`, we have that in any world `w'`, if `y` is Godlike in `w'`, then `y = g`.
  6. Therefore, in every world `w'`, `Godlike w' g`.

  In particular, in the actual world (which is one specific world), we have `Godlike actual g`.

  ## Residue report

  ### Translated cleanly

  - The ultrafilter properties of positivity (with the exception of maximality) were translated as axioms on the predicate `positive`.
  - The definition of Godlikeness as the conjunction of all positive properties was translated using impredicative quantification.
  - The use of S5 modality by defining `box` as a universal quantification over worlds.
  - Necessary existence was defined in terms of essence.

  ### Translated with distortion

  1. **The consistency of the entire set of positive properties**: We had to assume `Godlike_possible` as an axiom. In the original, this is sometimes derived from the consistency of finite conjunctions and compactness, which is not available in type theory. This smuggles in the assumption that the set of positive properties is not only filter-consistent but also globally consistent.

  2. **Godlikeness is an essence**: We assumed this as an axiom, but in the original argument, it is derived using the axiom that positive properties are necessarily positive and other premises. We did not have the resources to derive it, so we assumed it. This smuggles in the uniqueness of God.

  3. **Classical logic**: We used classical logic throughout (excluded middle is not explicitly stated but is used in the background for the exclusive axiom and for reasoning). This is an engineering commitment: the ultrafilter requires classical logic.

  ### No counterpart

  1. **The actual world**: In type theory, we have a fixed set of worlds, but we don't designate one as actual. To get actual existence, we simply choose one world and call it actual.

  2. **The understanding in Anselm's argument**: We did not model the understanding as a separate type. This might be done by having a type of concepts, but it is not clear.

  ## Verdict

  - The limitation of type theory is its lack of compactness, which forces us to assume the possibility of Godlikeness as an axiom. This is a philosophical weakness because in the original argument, it is derived.
  - The uniqueness of God is not derivable from the axioms without further assumptions, so we had to assume it. This is a sign that the original argument was less clear than it looks.
  - The item that would most change a philosopher's mind is the role of the uniqueness axiom: it is not derivable and is necessary for the argument. This shows that the argument assumes uniqueness of God, which is a substantial metaphysical commitment.

  In both directions: type theory reveals the gaps in the argument (global consistency and uniqueness) but also provides a clear setting in which the modal commitments (like S5) are trivialized by the world-indexed definitions.
