answer: |-
  Your friend's claim is flattening: the least fixed point is central to the fixed-point and revision views but not to hierarchical, glut, or context-dependent views, and even where applicable, it often masks philosophical nuances like normativity or the nature of gaps.

  **Hierarchical view**  
  In PL terms: Truth predicates are stratified by levels (like universe levels in dependent types). Define a family of languages \( L_0, L_1, \dots \), where each \( L_i \) has a truth predicate \( T_i \) that can only reference truth in \( L_j \) for \( j < i \). The liar sentence ("this sentence is false") requires self-referential truth (e.g., \( T_i \) applied to a sentence encoding \( \neg T_i(\cdot) \)), which is untypeable—akin to a type error in a stratified system (e.g., Agda's `Set i` hierarchy). Evaluation fails at "type-checking" before runtime.  
  - Exact: Matches type-level stratification for predicativity; liar is blocked by static constraints.  
  - Fudge: Philosophical hierarchy often implies a dynamic "ascension" to higher levels, resembling runtime type generation, but PL stratification is static.  
  - No counterpart: The philosophical insistence that this hierarchy reveals a fundamental limitation of language, not just a technical workaround. Your vocabulary handles this as a type discipline without metaphysical baggage.

  **Fixed-point view**  
  In PL terms: Truth is a partial predicate over sentences, with values in \( \{\text{true}, \text{false}, \bot\} \) (where \( \bot \) is undefined). Define a monotone operator \( F \) on a lattice of interpretations (pairs \( \langle E, A \rangle \), where \( E \) is extension, \( A \) is anti-extension, ordered by subset inclusion). \( F \) updates interpretations using Kleene's strong three-valued logic: undefined inputs propagate \( \bot \) (like uncaught exceptions), e.g., \( \neg \bot = \bot \). Start from \( \langle \varnothing, \varnothing \rangle \), iterate \( F \) to a least fixed point (LFP). The liar ("I am false") oscillates indefinitely and settles at \( \bot \).  
  - Exact: LFP construction is standard (e.g., denotational semantics for recursive definitions). Monotonicity is essential: without it, no guarantee of convergence, so it's not just convenience—it enforces that evaluation is information-preserving.  
  - Fudge: Two evaluation schemes exist:  
    - Strong Kleene: Any \( \bot \) input poisons the output (like exception propagation).  
    - Short-circuit (weak Kleene): Compounds resolve early if possible (e.g., `false && ⊥ = false`).  
    Both assign liar to \( \bot \), but short-circuit might assign classical values to some compounds earlier. Revenge ("this sentence is false or undefined") rebuilds paradox if \( \bot \) is reifiable (e.g., via a `is_undefined` predicate). Prevention requires \( \bot \) to be unobservable—like an uncatchable exception, not a value. T-schema \( T(\ulcorner \phi \urcorner) \leftrightarrow \phi \) is like `eval(quote(e)) == e`; it fails for liar, making `eval` a partial left inverse. Diagonalization is ordinary: liar is a quine for \( \lambda s. \neg \text{eval}(s) \), showing `eval` cannot be total. Self-reference isn't blocked (as in untyped λ-calculus), but partiality contains inconsistency.  
  - No counterpart: The claim that \( \bot \) represents a "gap" beyond partiality—e.g., a failure of meaning rather than nontermination. Your vocabulary treats \( \bot \) operationally, not metaphysically.

  **Glut view**  
  In PL terms: Sentences can be overdefined (both true and false). Use a bilattice with values \( \{\text{true}, \text{false}, \text{both}, \text{neither}\} \), and a non-monotone consequence relation to avoid explosion (e.g., paraconsistent logic). Liar is "both"—like a value that satisfies both `is_true` and `is_false`. No fixed point is needed; liar is accepted as a contradictory value.  
  - Exact: Modeling "both" as a lattice element fits abstract interpretation (e.g., Belnap four-valued logic). Weakened consequence resembles exception suppression (e.g., logging an error but continuing).  
  - Fudge: This view often avoids iteration; "glut" is a starting assumption, not a result. No monotone operator is involved.  
  - No counterpart: The idea that true contradictions exist and require revising logic itself, not just semantics. Your vocabulary handles inconsistency via error recovery, not embracing it.

  **Revision view**  
  In PL terms: Iterate an evaluation operator \( G \) from an initial hypothesis (e.g., all sentences false), without requiring monotonicity. At each step, re-evaluate sentences relative to the current interpretation. Liar alternates indefinitely (false, true, false, ...). Classify sentences by their ω-limit behavior: stabilize to true/false, or oscillate (liar oscillates).  
  - Exact: Iteration resembles a runtime loop; stabilization classes are like liveness properties. Transfinite sequences generalize beyond LFP.  
  - Fudge: \( G \) may not be monotone (e.g., liar flips), so no LFP. Revision is coinductive (behavior defined by infinite traces), not inductive.  
  - No counterpart: The claim that truth is inherently "circular" and requires revision. Your vocabulary sees nontermination, not philosophical circularity.

  **Context-dependent view**  
  In PL terms: Truth's extension is stateful. Each use of "true" shifts context (e.g., via a hidden counter). Liar might evaluate to false in context \( c_0 \), but asserting it increments to \( c_1 \), where "true" refers to \( c_0 \)-truth, avoiding contradiction—like a stateful evaluator with implicit context threading.  
  - Exact: Matches state-passing or monadic evaluation; context shifts are like stack pushes.  
  - Fudge: Contexts are often implicit and dynamic, whereas PL typically models state explicitly.  
  - No counterpart: The idea that truth is fundamentally indexical (like "I" or "now"). Your vocabulary handles state, not indexicality's philosophical implications.

  **Residue report**  
  What your vocabulary cannot fully capture:  
  - **Normativity of truth**: Truth as "what ought to be believed" has no PL analog. Your terms are descriptive (e.g., evaluation relations), not normative. *Verdict: Vocabulary too poor; normativity is non-computational.*  
  - **Gaps vs. partiality**: Philosophers often insist a "gap" is not just \( \bot \) but a defect in meaning (e.g., reference failure). Your operational view treats \( \bot \) as a value or exception, sidestepping metaphysics. *Verdict: Philosophers are being unclear; your terms suffice for formal modeling.*  
  - **T-schema's primacy**: Philosophically, the T-schema is foundational to truth; in PL, `eval(quote(e)) = e` is one equation among many, and its failure is acceptable. *Verdict: Vocabulary too poor; PL has no notion of "constitutive principles".*  
  - **Self-reference and inconsistency**: You note untyped languages allow quines without explosion, but this conflates inconsistency (logical contradiction) with partiality (nontermination). Liar-like terms in λ-calculus (e.g., \( (\lambda x. \neg x x)(\lambda x. \neg x x) \)) loop, matching \( \bot \), but philosophers see inconsistency as worse. *Verdict: Philosophers are being unclear; partiality cleanly resolves the issue.*  
  - **Revenge as inexpressibility**: Preventing revenge requires gaps to be unobservable, which your vocabulary enforces (e.g., no `is_undefined` primitive). Philosophers debate if this is ad hoc; PL shows it's implementable. *Verdict: Vocabulary adequate; philosophers underappreciate operational discipline.*  
  - **Monotonicity's role**: It is doing real work—ensuring convergence and aligning with the idea that truth is cumulative. Without it (e.g., revision view), you get different phenomena. *Verdict: Your terms cover this; monotonicity is both technical and conceptual.*  
  - **What's missing**: Nothing essential for formal modeling; your vocabulary exposes philosophical claims as design choices (e.g., monotonicity vs. statefulness). The residue—normativity, meaning defects—reflects philosophy's broader scope, not your terms' poverty.
