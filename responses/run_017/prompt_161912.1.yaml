answer: |-
  ### The four senses
  Your four senses clarify leisure's dimensions. **Exemption** means freedom from obligatory labor. **Capacity** involves material/psychological ability to rest. **Synchrony** denotes temporal alignment with others' free time. **License** is autonomy in leisure’s use, free from surveillance. Ford's policy interacts unevenly: exemption increased (shorter hours), capacity improved (higher pay enabling rest), synchrony partially delivered (standardized shifts allowed weekend alignment, but rotating schedules disrupted it), and license was actively denied (Sociological Department inspections). Crucially, capacity and synchrony relied on invisible domestic labor.

  ### Who had what in January 1914
  **Ford** wielded unilateral power: he granted exemption (reduced hours) and conditional capacity (higher wages), engineered synchrony (shift structures), and revoked license via surveillance. The policy was revocable—no statute or union bound him. **Workers** gained exemption (8-hour days) and apparent capacity (doubled wages), but license was violated by moral policing. Synchrony was accessible only if shifts aligned with community rhythms. **Workers’ wives** were unacknowledged enablers: their unpaid labor bolstered husbands’ capacity and synchrony (e.g., maintaining households for rest, adapting to shift schedules), yet they had no direct claim to leisure. **Investigators** enforced Ford’s moral capitalism, weaponizing leisure as a reward for conformity—directly negating license. The **absence of unions/statutes** meant no countervailing power: leisure wasn’t a right but a discretionary gift. Workers traded license for capacity; wives subsidized both without recognition.

  ### What each frame catches and what it misses
  The **Weberian frame** captures Ford’s moralizing: work as a "calling" and leisure as a hazard necessitating surveillance (Sociological Department). It explains conditioning leisure on "sobriety" and "thrift." But it misses how *capacity* relied on exploited domestic labor (wives enabling rest) and how surveillance eviscerated *license*. It also ignores synchrony’s collective dimension.  
  The **statutory-hours frame** highlights Ford’s mimicry of top-down reform (reduced hours, higher pay). It clarifies why exemption and synchrony attracted workers lacking legal protections. Yet it obscures how employer discretion made leisure revocable and conditional—unlike statutory rights. It overlooks license’s violation and wives’ role in sustaining capacity.  
  The **karoshi frame** resonates with the gap between paper policy (generous wages/hours) and practice (coercive surveillance). It shows how "rights" dissolve without enforcement. But it underestimates Ford’s success in delivering *tangible* capacity and synchrony, however contingent. Crucially, it neglects gender: karoshi assumes overwork erodes individual health, not that leisure depends on unpaid reproductive labor.

  ### What the case does to the theory
  Ford exposes a core flaw: all three frames presuppose a sovereign individual claimant. Weberianism imagines a self-disciplined actor; statutory and karoshi frames assume a worker abstracted from social reproduction. Yet Ford’s "leisure" required a *household*: the wife’s labor enabled the worker’s capacity, while investigators regulated license. This collapses the individualist premise. The case also challenges rights formalism: a "right" granted unilaterally and contingent on conduct is merely a privilege. Ford delivered *exemption*, *capacity*, and *synchrony* materially—but by violating *license* and relying on gendered labor, he proved these weren’t rights. Your hunch holds: the frames’ "male claimant" depends on invisible support. Ford didn’t just exploit this; he weaponized it, tying leisure to patriarchal control. Theories must grapple with leisure as a relational, not individual, good.

  ### Where I should stop
  Stop dissecting Ford as an isolated case. Instead, use it to interrogate *social reproduction*: how unpaid domestic labor subsidizes "rights" to work/leisure. Ask why theories ignore the wife/investigator dynamic—does this reveal a blind spot in political theory itself? Avoid overclaiming: Ford’s success in reducing turnover shows material gains matter, even if coerced. Don’t conflate all employer benevolence with Fordism; contrast it with union-won rights. But do press your core insight: if a right isn’t collectively enforceable and free of surveillance, it’s not a right. That reshapes everything.
