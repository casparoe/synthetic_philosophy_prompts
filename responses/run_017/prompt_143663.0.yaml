  Fourth for the grad students - their disappointment about normative implications. Must hold firm: vehicle location ≠ responsibility shift. Weakness: feels deflationary after exciting EMH claims. 

  Fifth is the nightmare question: enactivist accusing residual representationalism. Trickiest because it challenges foundations. Reply must frame calibration as sensorimotor history, but weakness is enactivists reject any "vehicles" talk. 

  Structure strictly: objection phrased as audience would, 2-min reply, weakness note. No intros/outros. Order matters - start with obvious internalist pushback, end with fundamental challenge. 

