prompt: |-
  I'm giving a talk to our philosophy of cognitive science reading group in three weeks, defending a version of extended mind I've been calling "calibrated uptake": an external ressource counts as literally part of a cognitive process not because it's reliably coupled to me at the moment of use, but because it's been tuned to my error profile over a history of use — which is why the notebook I've kept for years and scribbled in is part of my memory while an identical notebook I find on a park bench isn't, and why a chatbot that flatters me isn't either. I use that to argue that extended cognition is real but almost nothing normative follows: no new story about responsibility, no new ethics of cognitive artifacts, just a claim about where the vehicles of a given episode happen to sit. The room is two internalists who think the whole literature rests on confusing causal coupling with constitution, one enactivist who thinks calling anything "extended" already concedes too much to representationalism, a memory researcher who'll want to know what experiment could settle it, and four grad students who love the Otto-and-his-notebook case and will be disappointed if I say nothing follows. Write me a Q&A prep sheet: exactly five objections, in the order they'll actually come, each phrased the way that person would phrase it, with the two-minute reply I should give and a note on where that reply is weakest — and make the fifth one the question I'm hoping nobody asks. Numbered list, a sentence or two per item, no intro and no outro.
