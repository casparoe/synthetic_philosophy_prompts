  The smell of ethyl acetate hung sharp under the predawn grey. Clara’s fingers, thick-knuckled and permanently stained with scale dust, moved with tired precision through the egg-box labyrinth inside the Robinson trap. The cool, damp air off the lowland marshes seeped into her bones.

  Leo, the young philosopher from her reading group, perched awkwardly on a folding stool, his enthusiasm undimmed by the hour or the chill. He peered into the chaos of wings and legs. "The sheer *number*, Clara," he murmured, not for the first time. "Even if the credence per individual is negligible... a billionth, a trillionth... multiplied by populations like this..." He trailed off, shaking his head as if overwhelmed by the arithmetic.

  Clara didn’t look up. She nudged a large yellow underwing aside, counting three more common rustics beneath it. Her tally clicker rasped in the quiet. *Click. Click. Click.* Beside her open logbook, the neat columns marched down decades of pages: Date. Species Count. Individuals. And now, this final season, a new, hesitant column: a small, pencilled figure she could never quite justify, sometimes a decimal, sometimes a fraction, always erased and rewritten by the next entry. *Units*, she thought vaguely. *But units of what?*

  "Leontes," she said, using his full name to anchor him, "it’s not dice you’re rolling independently each time. If consciousness *is* possible in, say, this silver Y here," she gently lifted the greyish, delta-marked moth, its wings slightly frayed, "then it’s almost certainly possible in every other silver Y. The credence attaches to the *kind*, not the token. Finding out one feels pain means they all likely do. Or none do."

  Leo frowned. "But mathematically, the expected suffering sum remains the same, whether the probability is applied per individual or per species. Linearity of expectation holds."

  Clara deposited the silver Y into the sorting tray. "Does it *feel* the same? Risking a million pounds on a single coin flip, versus losing one pound a million times? The outcome might average out identically, but the stakes feel… different. One is a catastrophe or nothing. The other is a steady, predictable drain. Would you bet your house on that coin flip, even if the odds favoured you slightly?" She didn’t wait for an answer. "Most of these," she gestured at the tray, hummingbird hawkmoths bumping clumsily against its sides, "won’t live two more days. Half their kin were eaten as caterpillars before they ever flew. What are we even counting? Whole lives? Moments? And if their awareness flickers… is a minute of fear here worth the same as an hour of human pain?"

  Leo opened his mouth, then closed it, watching her hands. Her movements were economical, almost regretful. She paused over a particularly worn cabbage white, its white wings translucent with age. "And there’s the other thing," she said softly. "The ‘at least one’ argument."

  He leaned forward. "Yes! Surely, with numbers like this, the probability that *at least one* suffers is effectively one. Doesn’t that compel action?"

  Clara picked up a fine brush and carefully transferred the cabbage white to a separate, smaller container lined with clean paper. "Let’s say it’s true. Let’s grant that somewhere, right now, at least one insect is experiencing something we’d call suffering. What does that prove?" She looked at him, her eyes tired but sharp in the gathering light. "It proves *one* instance. Just one. It doesn’t tell you *how many* are suffering, or how *much*. The expected total suffering could still be vanishingly small if the probability per individual is low enough, even granting that at least one hits the jackpot. Finding one grain of sand on a beach doesn't tell you the beach is *made* of suffering. It just tells you suffering *can exist* on beaches. A necessary condition, perhaps, but not sufficient to weigh the beach itself." She saw the flicker of understanding, mixed with frustration, in his eyes. "It settles existence, Leo, not magnitude. Not the ledger."

  The weight in her pocket wasn’t just the tally clicker. It was her phone, bearing an email from her old institute. A colleague, earnest, asking about switching to a new biopesticide. *More humane*, the email said, *targeted, quicker kill, less suffering*. Clara’s professional instinct screamed. *R-selected species. Carrying capacity. Density-dependent mortality*. Kill a million humanely, and a million more larvae survived to adulthood because resources weren’t stretched. Net suffering? Unchanged. Or worse, increased, if the new pesticide prolonged dying for some. The intervention felt like pressing on a balloon – the suffering just bulged elsewhere. She hadn’t replied yet. The uncertainty was a stone in her gut.

  The sorting was nearly done. Fifteen common species dominated the catch; two noctuid moths alone accounted for half the biomass. Most individuals were worn, wings chipped, scales missing – survivors nearing their end. The trap, running faithfully for thirty years on this spot, captured only the brief, final flicker of countless abbreviated lives. Clara looked at the small container holding the single cabbage white. Release it? A day or two of freedom, likely ending in starvation or a bird’s beak? Or the killing jar – a few seconds of disorientation in the ethyl acetate fumes, then nothing?

  Her hand hovered. Was she counting lives? This one fragile existence? Or moments? The potential seconds of distress in the jar versus the potential hours of slow decline outside? Did the cabbage white experience a unified ‘self’ across those seconds? Or were they fragmented instants, disconnected? Her pencil hovered over the private column in the logbook. What figure could capture this? The probability times the number? But the probability wasn’t fixed. It shimmered, elusive. And the number… was it ‘one life’ ending? Or ‘one decision-point’ she controlled? Or countless potential moments of larval struggle she’d never see, influenced by actions taken here?

  Leo watched her, the abstract argument momentarily stilled by the concrete decision before them. He saw the hesitation, the weight of decades looking into the chaos of the trap, the burden of the unanswerable column.

  Clara didn’t look at him. With a sigh that seemed to come from the marshes themselves, she picked up the small container. She walked to the edge of the trap clearing, where the long grass met the reeds. She unscrewed the lid. The cabbage white, sluggish in the cool air, didn't move immediately. Then, as the first true rays of dawn touched the field, it fluttered weakly onto a grass stem. It sat there, wings trembling.

  She turned back, not looking to see if it flew. The private column in the logbook remained blank for that entry. The email in her pocket would get a reply: *Data inconclusive. Population dynamics likely negate welfare benefits. Proceed with caution.* It felt inadequate, like counting moths in a hurricane. The sheer scale wasn’t the problem, she thought, walking back to the trap to dismantle it. It was the unit of account. And the terrifying correlation – that the bet wasn't spread across billions of tiny wagers, but placed, horrifyingly, on the nature of the world itself: all or nothing. The ledger wasn't filled with small entries; it demanded one, impossible sum. She clicked the tally counter one last time, the sound swallowed by the waking marsh.
