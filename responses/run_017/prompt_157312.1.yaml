prompt: |-
  I help run a university effective-altruism group and I've been asked to give this term's ninety-minute intro session on cause prioritization. The room will be quantitatively literate newcomers who have already absorbed the standard three-factor decomposition — importance, tractability, neglectedness — from online write-ups and can recite it. I've read the standard posts and the standard pushback; I don't want the session to be a vocabulary lesson, and I suspect the recitation is exactly what stops people from being able to use the framework.

  So plan the session rather than writing it. I care most about three places where I think the usual treatment is wrong or silent. First, neglectedness as normally stated (roughly, how many resources already go here) looks like the wrong quantity: what does the work is whether my next unit of resources causes something that would not otherwise have happened, and a cause can be starved of funding while my dollar merely displaces another funder's, or crowded while one keystone input is the binding constraint. I want that taught, and I want it to fall out of the framework rather than arrive as a bolt-on fourth factor. Second, the framework returns different rankings depending on whether you apply it to a cause, an intervention, or the funding ecosystem as a whole, and I don't know which level to open with. Third, the three factors do not literally multiply: their units don't match and cost enters twice.

  Tell me what has to be in place before each of those can be raised and why, the one worked example that should carry the session and what it must have and lack (I've seen the many-people-mopping-one-spill picture and think it teaches the wrong thing), the mistakes this specific audience will make in the order they'll make them with the point in the sequence where each should be headed off, one closing question that would show me they can apply the framework rather than restate it, and what I should openly decline to cover in ninety minutes.
reasoning: |-
  Hmm, the user runs a university effective altruism group and needs to plan a 90-minute intro session on cause prioritization for quantitatively literate newcomers. They've already learned the standard ITN framework (Importance, Tractability, Neglectedness) online but can only recite it without really applying it. The user wants to avoid just rehashing vocabulary and instead focus on three key issues: the problems with neglectedness as typically defined, the confusion around different levels of analysis (cause vs. intervention vs. ecosystem), and the mathematical issues with multiplying the three factors together.

  I need to help design a session plan that addresses these pain points while making it practical. The user specifically wants to know what foundational concepts need to be established before introducing each of their three concerns, what central example to use, common mistakes to anticipate, a closing application question, and what to explicitly exclude due to time constraints.

  For the neglectedness issue, students need to understand the difference between total funding and marginal impact first. I should establish that neglectedness isn't about absolute dollars but about how additional resources translate into outcomes. The key insight is that "resources" must be defined in terms of what actually constrains progress - it could be money, talent, political will, etc. This sets up why displacement matters and why we should think in terms of binding constraints rather than total funding.

  Regarding the level of analysis problem, students must grasp the hierarchy: causes > interventions > funding ecosystems. They need to see that ITN looks different at each level and that the choice depends on their agency (are they evaluating where to work, what to fund, or how to build infrastructure?). This confusion often stems from mixing levels, so clarity here is crucial before discussing prioritization.

  For the multiplication problem, they first need to recognize that the factors aren't dimensionless. Importance might be in lives saved, tractability as lives saved per dollar, neglectedness as a dimensionless scaling factor. The mathematical flaw becomes obvious once we see the unit mismatch. The "cost enters twice" issue refers to tractability inherently containing cost-effectiveness while neglectedness also implicitly deals with resource allocation - a double-counting hazard.

  For the central example, the "mopping the spill" analogy is rejected for good reason - it oversimplifies displacement. A better example would be disease eradication campaigns: high importance (lives at stake), seemingly tractable (vaccines exist), but neglectedness depends on the phase. In the endgame, additional funding may just displace other funders' efforts without accelerating eradication. This shows neglectedness-as-displacement-risk and introduces the binding constraint concept (e.g., last-mile delivery problems vs lab research funding). Crucially, it works at all three levels: cause (global health), intervention (vaccine delivery), ecosystem (funding coordination).

  Anticipated mistakes in sequence: first, students will treat neglectedness as total funding without considering displacement - best countered when defining factors. Second, they'll apply ITN inconsistently across levels - prevented by explicitly separating cause/intervention/ecosystem early. Third, they'll mechanically multiply factors without unit checks - blocked by walking through dimensional analysis. Fourth, they'll overlook personal fit - mitigated by stressing it as a separate layer post-ITN.

  The closing application question should force synthesis: "How would ITN analysis differ for advocating AI safety research (cause) versus funding a specific technical alignment project (intervention) versus building career pipelines for AI safety researchers (ecosystem)?" This tests understanding of levels, displacement risks, and constraint identification.

  Finally, I should openly exclude: uncertainty quantification (though mention it), personal fit deep dives, and any attempt to resolve moral weights. The session should stay focused on fixing conceptual misunderstandings to unlock practical application.

  The structure should flow from foundational concepts to layered complexities, using the disease example as a through-line. First 30 minutes rebuilding ITN from first principles, next 40 dissecting the three key issues through the example, final 20 applying it to new scenarios with guided discussion. This maintains quantitative rigor while targeting the specific gaps the user identified.
answer: |-
  Here’s a focused 90-minute session plan designed to transform recitation into application, targeting your three core concerns. The goal is to **rebuild ITN from first principles** to naturally resolve the flaws you’ve identified.

  **Core Metaphor:** *Building a pipeline for impact* (replacing the "mopping a spill" image).  
  **Central Example:** **Disease Eradication Campaigns** (e.g., Malaria, Polio, Guinea Worm). It showcases displacement risks, binding constraints, and level shifts vividly.

  ---

  ### **Session Structure & Flow**

  **I. Groundwork: What ITN *Should* Be Measuring (15 mins)**
  *   **Hook (2 min):** "You know ITN stands for Importance, Tractability, Neglectedness. If I asked you to rank two causes using ITN *right now*, could you do it confidently? What information would you *actually* need?" (Elicit uncertainty – reveals the gap between recitation & application).
  *   **Reframe the Goal (5 min):** "ITN is a framework for estimating the *expected marginal impact* of *your* next unit of resources (time, money, skill). It answers: 'If I do this, how much *additional* good happens?'"
  *   **Define "Resources" & "Impact" (8 min):** Stress that "resources" = whatever *you* can deploy (money, labour, advocacy). "Impact" must be quantifiable (lives saved, DALYs averted, % risk reduction). *This sets the stage for units and marginal thinking.*

  **II. Rebuilding the Factors from Marginal Impact (30 mins)**  
  *Focus: Why the standard definitions are insufficient and how to fix them.*
  *   **Importance (I) (5 min):** "The total scale of the problem if *nothing* is done." (Standard definition mostly holds, but emphasize: *This is the potential pie. We care about our slice.*).
  *   **Tractability (T) (10 min):** **REDEFINE as "Marginal Cost-Effectiveness *at the current margin*."**  
      *   "How much impact does *one additional unit of the relevant resource* create *right now*? (e.g., $100,000, 1 researcher-year)."
      *   *Why this fixes "cost enters twice":* T now *explicitly* includes cost (impact/resource). Neglectedness will *not* be about money.
  *   **Neglectedness (N) (15 min):** **REDEFINE as "The Risk of Displacement / Degree of Constraint Slack."**  
      *   "If I add my resource, will it actually cause *additional* impact, or just displace what someone else would have done? Or is a *different resource* the binding constraint?"
      *   Introduce **Binding Constraints:** "Progress often depends on multiple inputs ($$, talent, political will, tech). The 'most neglected' input is the one currently in shortest supply relative to need – the *binding constraint*. Adding resources *elsewhere* has low marginal impact."
      *   *Why this fixes the displacement & level problems:* N now directly addresses the core uncertainty of marginal impact ("will my action cause *additional* good?"). It forces consideration of the *ecosystem* (other actors, other inputs).
      *   **The "New" ITN Formula:** Expected Marginal Impact ≈ **I * x* T * x* N** (where N is now a *dimensionless multiplier between 0 and 1*, representing the *fraction* of your resource input that translates to *additional* impact). *Units now work: I (impact), T (impact/resource), N (dimensionless) → Output = Impact.*

  **III. Levels of Analysis: Cause, Intervention, Ecosystem (20 mins)**  
  *Focus: Which level to use depends on your agency and resources.*  
  *   **The Hierarchy:**
      *   **Cause Area (e.g., Global Health):** Broad. Good for initial orientation. High I, but T & N are averages/messy. *Use first for exploration.*
      *   **Intervention (e.g., Distributing Bed Nets):** Specific action. Where T (cost-effectiveness) is most precisely defined. N (displacement) is concrete (other net distributors?). *Use for funding/direct action decisions.*
      *   **Funding/Support Ecosystem (e.g., Malaria Research Funding Landscape):** Focuses on N (binding constraints) for a *type* of resource. *Use if you specialize in providing a specific resource (e.g., talent, policy work, funding coordination).*
  *   **Disease Eradication Example Walkthrough:**
      *   *Cause (Malaria Eradication):* High I (massive burden). Medium T? (Varies wildly). Low N? (Billions spent globally) → **Misleading!**
      *   *Intervention (Distributing Nets in Region X):* High I (local impact). High T ($/net saves lives). **N: HIGH?** If nets are available but delivery trucks/funding for *this region* are lacking, and your $$ buys trucks others wouldn't have → High impact. **N: LOW?** If nets are scarce globally and your $$ just outbids another NGO for the same nets → Low impact (displacement).
      *   *Ecosystem (Funding for New Malaria Drugs):* High I (need better tools). Uncertain T (R&D hard). **N (Binding Constraint):** Is it lack of $$? Or lack of skilled researchers? Or regulatory hurdles? Your impact depends on *which* constraint you loosen.
  *   **Key Takeaway:** **Always move towards the most specific level your resources allow.** Start broad (Cause), but prioritize based on specific Interventions or identified Ecosystem constraints. *This resolves "which level to open with."*

  **IV. Common Mistakes & Mitigations (Integrated Throughout, Explicit Callouts)**
      1.  **Mistake:** Treating N as "total $ spent" on the cause.  
          **When Headed Off:** During the N redefinition (II.C).  
          **Mitigation:** Stress: "Low total $ doesn't guarantee *your* dollar adds impact (displacement!). High total $ doesn't mean *your* dollar is wasted (binding constraints!)."
      2.  **Mistake:** Mechanically multiplying I, T, N without considering units or the redefined N.  
          **When Headed Off:** When introducing the formula (II.C) & during Levels discussion (III).  
          **Mitigation:** Walk through units explicitly. Show how the redefined N (0-1 multiplier) makes the formula conceptually coherent.
      3.  **Mistake:** Confusing the level of analysis (e.g., using cause-level N for an intervention decision).  
          **When Headed Off:** During Levels section (III).  
          **Mitigation:** Force the example walkthrough at all three levels. Ask: "At which level is N most relevant *for deciding to fund this specific net program*?"
      4.  **Mistake:** Ignoring personal fit/skills (assuming ITN is sufficient).  
          **When Headed Off:** Implicitly throughout, but explicitly state during wrap-up.  
          **Mitigation:** "ITN tells you *where* impact might be highest. Your skills/resources tell you *if you can access that impact*. Prioritize the intersection."

  **V. Worked Example: Disease Eradication Must-Haves & Must-Lacks**  
  *   **Must Haves:**
      *   **Clear Levels:** Show Cause (Eradication) vs. Intervention (Vaccines/Nets/Research) vs. Ecosystem (Funding/Talent).
      *   **Displacement Risk:** E.g., Your donation funds nets → Manufacturer sells nets they would have sold to Gov't anyway (displacement) vs. funds extra production run (additionality).
      *   **Binding Constraint Shift:** E.g., Early: $$ for R&D (binding). Mid: Delivery infrastructure (binding). Late: Political will in last endemic countries (binding). Adding R&D $$ late has low marginal impact.
      *   **Quantifiable T:** Use real(istic) cost-effectiveness estimates (e.g., $/DALY averted for nets vs. vaccines vs. novel R&D).
  *   **Must Lack:** Simplicity that hides complexity. Avoid implying any single factor is static or that "more funding" is always the answer. Show the dynamic interplay.

  **VI. Application & Closing (20 mins)**
  1.  **Group Exercise (12 min):** "Pick a cause area (e.g., AI Safety, Animal Welfare in LMICs, Biorisk). Sketch a quick ITN analysis *at the intervention level* for one specific action. What's the biggest uncertainty in your N (displacement/binding constraint)?"
  2.  **Closing Question (The Test - 5 min):** **"If you learned that an intervention you thought was highly neglected actually has several major new funders entering the space this year, how would that change your ITN assessment *specifically* for each factor, and why?"**  
      *   *Tests for:* Understanding N as dynamic/displacement risk (N likely ↓). Understanding T might change (if new $ lowers costs or causes saturation → T might ↓). Understanding I is unchanged. Understanding the *level* (impact on specific interventions, maybe not the whole cause).
  3.  **Wrap-Up & Scope (3 min):**  
      *   "Today we rebuilt ITN to focus on *your marginal impact*, redefined N to tackle displacement/binding constraints, and clarified levels of analysis. This is the foundation."
      *   **Openly Decline to Cover:**  
          *   **Deep uncertainty quantification** (we touched on it via N, but no Monte Carlo sims!).
          *   **Full cause comparisons** (we gave tools, not answers).
          *   **Moral weight discussions** (assumed a quantifiable 'impact').
          *   **Personal fit deep dive** (acknowledged, but not framework).
          *   **Historical ITN critiques beyond the 3 core issues** (e.g., long-termism debates).

  ---

  **Why this works for your audience & concerns:**
  1.  **Addresses Core Flaws Directly:** The redefined N and explicit marginal impact focus resolve displacement/binding constraints and unit issues *within the core framework*. Levels are integrated as essential for correct application.
  2.  **Moves Beyond Recitation:** Forces application through reframing, the central example, and the closing question. Focuses on the *why* and *how* of the factors, not just the names.
  3.  **Leverages Quantitative Literacy:** Embraces units, marginal thinking, and constraint analysis. The disease example provides concrete numbers and dynamics.
  4.  **Manages Time & Scope:** Declined coverage is explicit and justified. The session builds logically, with each step enabling the next.

  **Key:** Constantly link back to the core question: **"Will *my* action cause *additional* good, and how much?"** This prevents abstract recitation and grounds everything in the student's potential agency. Use the disease example relentlessly to illustrate every conceptual point. Good luck!
