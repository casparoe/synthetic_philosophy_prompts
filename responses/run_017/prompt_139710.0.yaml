prompt: |-
  I teach an upper-level undergraduate seminar on moral status, and I am writing this year's final. I want one essay question, answerable in 90 minutes and capped at 1,200 words, worth 20 marks, on sentience as a matter of degree — but not a question that can be answered by rehearsing the familiar move from the capacity to suffer being what matters to the conclusion that insects therefore matter a little and humans a lot.

  The device I have used all term, and which the question should exploit, is a hypothetical calibrated sentience index S: suppose a future neuroscience produces a reliable, interpersonally comparable scalar measure of a creature's capacity for valenced experience at a time. Its reliability is to be granted outright — I want the epistemics of measurement ruled out as a topic, because the point is that even a perfect measure of one quantity leaves the shape of moral status entirely open. Assume it reads 1.0 for a typical adult human, roughly 0.02 for a honeybee, and exactly 0 for a domestic thermostat.

  The question should force students to do three things, and to see that they are three things rather than one. First, state what function maps S — plus whatever else must be added — onto moral status, and defend the shape of that function: is any threshold defensible, given that small differences in S seem not to permit large differences in status, or does that continuity demand itself collapse under a sorites-style argument? Second, notice that S is one number while the thing we care about does not look like one number: intensity, duration, temporal depth (whether the creature remembers and anticipates), and the unity or fragmentation of its experience can all come apart, and once they do, the question how much this being matters is not well posed until one specifies what is being decided — inflicting pain, killing, using, replacing. Third, handle the thermostat: give the further condition that excludes it (a subject, a point of view, something it matters to, valence that is intrinsic rather than merely informational), and then face the awkward consequence that this condition looks all-or-nothing, so that gradualism about sentience appears to smuggle a cliff back in at the bottom. Finally, students should say whether, on their own account, very many low-S creatures can sum to outweigh one high-S creature, and explain why that is or is not a separate question from the one about degrees.

  Please provide: (a) the question itself, worded as it would appear on the exam paper; (b) a model answer of approximately 700 words; (c) a 20-mark scheme organised around five must-hit moves, with the marks attached to each and a one-line note on how candidates typically get each one wrong — including the predictable mistake of treating uncertainty about insect sentience, or expected-value reasoning over huge populations, as an answer to the question about degrees; and (d) a short statement of what separates an A from a B, naming the specific move the A answer makes that a competent, well-organised B answer does not.
reasoning: |-
  Okay, the user is teaching an upper-level seminar on moral status and needs to craft a final exam question. The focus is on sentience as a degree, using a hypothetical calibrated sentience index (S). They want to avoid simplistic answers that just link suffering capacity to moral status linearly. 

  Hmm, the key challenge is designing a question that forces three distinct philosophical moves: (1) defining the mapping function from S to moral status while handling thresholds/sorites issues, (2) addressing how S oversimplifies by collapsing multiple dimensions of experience (intensity/duration/etc.), and (3) resolving the thermostat problem without reintroducing a binary cliff. The summation question about low-S creatures must also be explicitly separated.

  The user's frustration points are clear: they've seen too many essays default to "insects matter less" arguments or hide behind measurement uncertainty. The S index device is brilliant precisely because it eliminates those escapes. I should craft a question that locks students into the three traps they've set.

  For part (a), the exam question needs surgical wording. It must mandate addressing all three moves while prohibiting off-topic retreats. Explicitly banning population ethics or epistemic hedging is crucial. The thermostat must appear as the zeroth problem to solve.

  Part (b) requires a model answer demonstrating how to wrestle with all three issues without resolution. It should model intellectual honesty—showing why each problem resists neat solutions. The summation point needs special care to distinguish it from aggregation debates.

  The mark scheme in (c) must punish point-missing harshly. Common failures I anticipate: conflating dimensions of experience, treating the thermostat as having "potential" sentience, or using sorites to dismiss gradualism entirely. Each "must-hit" move should carry equal weight.

  For (d), the A/B differentiator is subtle. B answers will competently list the problems; A answers will show how the problems interconnect—e.g., how solving the thermostat cliff undermines dimensional unity, or why sorites pressures force functional choices rather than avoid them. The synthesis is key.

  *checking clock* Better avoid examples from class readings to prevent regurgitation. The wasp example in the model answer works because it's visceral but not canonical. Should emphasize that "what is being decided" determines which dimension matters—that's the lever smart students might miss.
answer: |-
  Here is the comprehensive exam package addressing your specifications:

  ### (a) Exam Question  
  **Question (20 marks):**  
  "Assume we possess a perfectly reliable Calibrated Sentience Index (S), reporting a scalar value for a creature's capacity for valenced experience at a time (S=1.0 for a typical adult human, S=0.02 for a honeybee, S=0 for a domestic thermostat). Defend a framework for determining moral status that satisfies the following:  
  (i) Specifies the *function* mapping S (and any other necessary elements) onto moral status, justifying its shape (e.g., linear, threshold, logarithmic) and addressing whether continuity in S precludes significant discontinuities in status.  
  (ii) Explains why S alone is insufficient, demonstrating how *at least two distinct dimensions* of sentient experience (e.g., intensity, duration, unity) not captured by S affect moral status *differentially* depending on the context (e.g., inflicting pain vs. killing).  
  (iii) Provides a *non-arbitrary condition* excluding the thermostat (S=0) from moral status, then confronts whether this condition reintroduces a problematic moral 'cliff-edge' near S≈0.  
  (iv) Explicitly states whether, on your account, the combined moral significance of *many low-S beings* (e.g., insects) can outweigh that of *one high-S being* (e.g., a human), and argues why this is (or is not) a *distinct question* from the issue of degrees in S.  
  *Do not discuss epistemic uncertainty about measuring S or expected-value calculations over large populations. Focus solely on the conceptual implications of S as a perfect scalar measure.*"

  ---

  ### (b) Model Answer (Approx. 700 words)  

  **The Calibrated Sentience Index (S) quantifies valenced experience, but moral status requires mapping this scalar onto normative force while confronting its oversimplification of phenomenology and its boundary problems. I argue S must be embedded in a multidimensional framework where context determines which experiential dimensions dominate, and where moral considerability requires intrinsic valenced subjectivity—a condition that avoids cliffs but does not resolve aggregation puzzles.**  

  **(i) Function and Continuity:** S alone cannot map directly to moral status. Let moral status be the *per-unit-time moral weight of experiential states*. The function must incorporate S and temporal duration (D). For inflicting pain, status = S × D × I (where I is experienced intensity, assumed correlated with S but not identical). This yields a continuous, linear weighting. Any threshold function (e.g., "full status only if S>0.5") is indefensible: a sorites argument shows that if ΔS=0.01 cannot justify radically different treatment between S=0.50 and S=0.51, no non-arbitrary threshold exists. Continuity in S thus demands continuity in status weightings for comparable contexts.  

  **(ii) Multidimensionality and Context:** S collapses distinct phenomenological dimensions. Consider:  
  - **Intensity vs. Temporal Depth:** A wasp (S=0.03) stung now experiences sharp, intense pain (high momentary S). Killing it painlessly eliminates its shallow future (minimal anticipation/memory). Conversely, killing an elephant (S=0.8) destroys rich future projects despite lower pain intensity in the killing act. S cannot capture this trade-off.  
  - **Unity of Experience:** A fragmented mind (e.g., via split-brain or distributed cognition) with S=1.0 may lack a unified subject of welfare, reducing the wrongness of killing compared to a unified human with identical S.  
  Context determines which dimension matters:  
  - *Inflicting pain* prioritizes intensity (≈S) and duration (D).  
  - *Killing* prioritizes temporal depth and unity (future-experience potential).  
  - *Using as a resource* may further require assessing whether the being has interests beyond momentary states.  
  S is thus necessary but insufficient; moral queries require specifying "status *for what purpose*?"  

  **(iii) The Thermostat Problem and the Subjectivity Condition:** The thermostat (S=0) lacks *intrinsic valence for a subject*. Valenced states must *matter to* the entity itself. This requires a minimal form of subjective awareness—not merely informational sensitivity (like the thermostat registering temperature) but an evaluative perspective. This condition is binary: either there is a point of view or there isn’t. However, this *does not* create a moral cliff for S>0. While subjectivity is necessary for moral considerability, the *degree* of moral weight for beings possessing it (S>0) remains wholly continuous and gradualist. A being with S=0.0001 (e.g., a nematode) has negligible but non-zero weight for inflicting pain; there is no "jump" from zero to significant status. The binary condition excludes non-subjects, but does not create discontinuities *among* subjects.  

  **(iv) Aggregation and Separateness:** Many low-S beings *can* outweigh one high-S being *in contexts where intensity/duration dominate* (e.g., preventing widespread insect suffering vs. causing brief human discomfort). Crucially, this is distinct from the question of degrees. Degrees concern *per-individual weight*: how much one unit of suffering in a low-S being matters relative to one unit in a high-S being. Aggregation asks how *total moral weight* sums across individuals. One can accept continuous degrees (e.g., bee pain = 0.02 × human pain) while rejecting strong aggregation (e.g., 50 bee pains ≠ 1 human pain) if one holds that the *relational properties* of high-S beings (e.g., narrative unity) create agent-relative constraints. Conversely, strict utilitarians would accept summation. This separateness arises because individual weight (degree) is metaphysical, while summation is normative.  

  **Conclusion:** S measures one aspect of sentience, but moral status is multidimensional, context-dependent, and requires a subjectivity condition. Continuity in S precludes thresholds among subjects, but the subjectivity requirement excludes non-subjects without creating moral cliffs. Aggregation is a further, independent normative choice.  

  ---

  ### (c) Mark Scheme (20 Total)  
  **Must-Hit Moves:**  
  1. **Function Definition & Sorites Defense (5 marks)**  
     - *Hit:* Defines f(S, X→status), justifies shape (e.g., linear/threshold), uses sorites to argue against thresholds.  
     - *Common Error (-3):* Assumes linearity by default, or uses sorites to dismiss gradualism rather than defend continuity.  

  2. **Multidimensionality & Context (5 marks)**  
     - *Hit:* Names ≥2 dimensions (e.g., intensity/duration/unity) and shows how context (pain/killing) shifts which dimension dominates.  
     - *Common Error (-4):* Lists dimensions but treats them as additive to S (e.g., "true S = S × unity"), or ignores context specificity.  

  3. **Thermostat Exclusion & Cliff Analysis (5 marks)**  
     - *Hit:* Gives binary "subjectivity" condition (not valence alone!), argues it excludes S=0 without cliffs among S>0.  
     - *Common Error (-3):* Proposes vague "complexity" thresholds or claims cliffs are unavoidable.  

  4. **Aggregation & Separateness (3 marks)**  
     - *Hit:* States if summation is possible and argues why it is/is not distinct from per-individual degree.  
     - *Common Error (-2):* Conflates aggregation with "insects matter less" or invokes population uncertainty.  

  5. **Avoid Forbidden Topics (2 marks)**  
     - *Hit:* Never mentions measurement reliability, expected value, or uncertainty.  
     - *Common Error (-2):* Uses "we can’t measure S" or "many insects outweigh humans" as core argument.  

  ---

  ### (d) A vs. B Distinction  
  **B Answer (Competent):** Hits all 5 moves clearly, accurately defines terms, recognizes problems (e.g., cliffs, multidimensionality), avoids forbidden topics.  
  **A Answer (Exceptional):** **Synthesizes moves into a coherent framework** where the *interdependence* of the problems is exposed (e.g., showing how context-dependence *resolves* apparent sorites paradoxes by shifting relevant dimensions, or how the subjectivity condition *enables* gradualism for S>0). Demonstrates why the three tasks are distinct yet mutually constraining.
