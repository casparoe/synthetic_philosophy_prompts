  First, I need to understand the audience composition thoroughly. There's an IIT-savvy postdoc, global workspace/predictive processing advocates, a hard-problem philosopher, a measurement-focused philosopher of science, ML experts from mechanistic interpretability, and a neurointensivist. Each brings unique concerns: formalism details, theoretical framing, measurement validity, computational tractability, clinical relevance. The adversarial-collaboration history means all are critical.

