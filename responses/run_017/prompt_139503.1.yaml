prompt: |-
  Write a specification for an account of causation by omission. I am not yet asking which account is true — I want the requirements list first, so I have something to hold the candidates to.

  Fix the purpose, so that adequacy has something to be relative to. The account is being bought to do three jobs at once: (i) to underwrite singular causal explanations in ordinary and specialist discourse, of both the agential sort (the nurse did not administer the anticoagulant; the driver did not brake) and the non-agential sort (the rains did not come; the firewall was never installed; the backup generator did not engage); (ii) to underwrite the causal-attribution step in legal and moral responsibility, where an omission is pinned on someone and treated as what they brought about; (iii) to plug into the variable-based causal models used in epidemiology, engineering failure analysis and accident investigation. An account that works for one of these and fails the others is not adequate for my purposes, and part of what I want from you is a view on whether that triple mandate is itself coherent, or whether jobs (ii) and (iii) pull in opposite directions — the lawyer wants the causation to track duties and expectations, the modeler wants it to be duty-free difference-making.

  The deliverable: a numbered list of requirements — the phenomena an account must explain, the cases it must get right, the distinctions it must respect, and the results or practices it must not contradict — each with the case or consideration that motivates it, stated tightly enough that I could use it as a checklist. For each requirement say whether it is non-negotiable or a preference of one camp, and why. Flag any subset of the requirements that cannot be jointly satisfied, and say which one you would weaken or drop and what that costs. Then name the single requirement that does the most work in excluding otherwise-attractive views, and defend that choice.

  Here are the materials I already think matter. Organize them, prune the ones you think are fake, and add what is missing:

  - Selection. Every non-actor is a difference-maker in the same formal way: had the Queen watered the plant, it would have lived, just as it would have had the gardener watered it. Only one of them gets cited. So the account owes a filter — and it owes a story about whether the filter is semantic, pragmatic, or normative. If it is pragmatic, say plainly whether that demotes the whole topic to a footnote about language use.
  - Agency-independence. The rains that did not come and the switch that was never thrown have to be handled by the same machinery as the nurse and the driver. Agency cannot be built in at ground level. But agent omissions dominate ordinary and legal practice; is that a fact about norms, or about the metaphysics?
  - Chain structure. Omissions must be able to sit at intermediate nodes: the supervisor never trained the guard, the guard never threw the switch, the backup never engaged, the patient died. Does causal strength attenuate as a chain alternates between action and omission? Can there be second-order omissions all the way down, and if not, where is the cutoff?
  - Preemption and overdetermination among omissions. Two guards asleep, neither of whom would have raised the alarm had the other stirred; and the variant where one of the two had a duty to act and the other did not. Both guards, one guard, or neither?
  - Grain and location. The plant died because she did not water it — or because she did not water it on Tuesday, or because she did not water the fern. And where is the omission located: at the plant, at the gardener, or nowhere? An account that wants to mesh with anything spatiotemporal has to answer.
  - Timing. A season-long failure to irrigate versus an instant failure to brake. When does the causal work happen — at the last moment at which acting would still have made a difference, or spread across the whole interval?
  - The intervention asymmetry. On an interventionist treatment one can test what would have happened had the agent acted, but there is no intervention that sets a variable to the omissive value it already has: the counterfactual runs in one direction only. Is that a defect of interventionism, a feature, or a reason to deny that omissions are causes strictly speaking?
  - The deflation worry. "Her failure to feed the child caused the death" and "had she fed the child, he would not have died" seem to have no distinct observable consequences. If the account cannot say what would settle the difference between them, is the stronger claim contentful?
  - Univocality versus mechanism. Does "caused" mean the same thing in "the brake failure caused the crash" and "the failure to brake caused the crash," given that the second has no connecting process, no conserved quantity, no transmission? Which of these two demands is a genuine desideratum and which is a prejudice of one camp?
  - Ontology. Are there negative events, or only positive events plus facts and absences? The account must say what makes "the failure to feed the child caused her death" true if nothing in the world corresponds to the failure — and whether that makes the failure a cause, or merely the correct answer to a why-question.
  - Doing/allowing, and blame. The account must not collapse causation by omission into allowing, or into blameworthiness, but it must explain the very tight correlation between them.
  - Norm-sensitivity. People are far more willing to cite an omission where there was a duty, a rule, or a statistical default. Must the account build that sensitivity into causation itself, or may it hand the work to a separate theory of responsibility and conversational relevance?
  - Defaults. The alarm did not sound gets cited; the Sun did not explode does not. Is the background default causal, statistical, or normative — and who or what sets it?
  - Contrast-hunger. "The plant died because you did not water it" is fine until one asks "rather than what?" Omissions look peculiarly dependent on an implicit contrast. Is that special to omissions, or general to causal selection?
  - The fundamental-physics worry. Causal claims in fundamental physics seem never to cite omissions. Must an account secure a place for them there, or only in the special sciences and ordinary life?
  - Empirical constraint. There is a developmental and experimental literature on when people will and will not attribute causation to an omission. What, if anything, does a metaphysical account owe to it? I expect you to mark this one as negotiable if you think it is.

  Two things I especially want. First: I suspect the real fault line is between a requirement that causation be objective and interest-independent and a requirement that the selection among omissions track norms, duties, or defaults — set out that conflict as cleanly as you can, and say which side you would give up. Second: tell me whether, once a decent filter is in place, there is anything left that is distinctive about omissions, or whether "the problem of omissions" dissolves into the general problem of causal selection and was never a separate problem at all.

  If the usual taxonomy — act versus omission, prevention versus double prevention, event versus fact versus absence — is missing a distinction your spec needs, draw it, name it, and say what case forces it.

  Finish with a short scorecard, three rows only: counterfactual or difference-making accounts; process, mechanism, or conserved-quantity accounts; and views on which omission claims are perfectly true but not causal at all. Keep the weight on the criteria rather than on the scoring.
reasoning: |-
  Okay, let me tackle this complex request for a specification on causation by omission. The user wants a rigorous requirements list to evaluate different accounts, with three specific purposes in mind: underwriting causal explanations, supporting legal/moral attribution, and fitting variable-based causal models. 

  First, I need to organize the user's materials while pruning redundant points. The selection problem (why we cite some omissions but not all possible ones) seems crucial, as does agency-independence - the account must handle both agential and non-agential cases uniformly. The chain structure requirement is important for real-world scenarios like accident investigations, while preemption cases test logical consistency. 

  The grain/location and timing issues matter for integration with scientific models, and the intervention asymmetry poses a special challenge for counterfactual approaches. The deflation worry suggests some accounts might make omission causation semantically empty, which would undermine its use in legal contexts. 

  I notice the user's materials already cover most key areas, but I should emphasize the norm-sensitivity conflict more sharply. Legal practice relies on duties and expectations, while scientific models need duty-free difference-making - this tension might be irreconcilable. The fundamental-physics worry raises questions about whether omission causation exists at all in basic reality.

  For the deliverable, I'll structure a numbered list with: 1) Requirement name, 2) Motivation case, 3) Non-negotiable status and why, 4) Any conflicts. The key fault line is Requirement 12 (norm-sensitivity) versus Requirement 1 (objectivity). I'll recommend prioritizing objectivity since norm-sensitivity can be handled by supplemental theories of responsibility. 

  The selection problem (Requirement 1) will likely exclude many attractive views that don't provide adequate filtering mechanisms. And to answer the user's closing question: once proper filtering exists, the "problem of omissions" largely dissolves into general causal selection issues, with the intervention asymmetry being the only truly distinctive feature.

  For the scorecard: Counterfactual accounts excel at difference-making but struggle with norms and asymmetry; process accounts handle objectivity but fail on omissions entirely; non-causal views satisfy deflation but collapse the causal-attribution function. The triple mandate seems coherent if we accept that norm-sensitivity belongs to responsibility theory, not causation proper.
answer: |-
  Here is a specification for an account of causation by omission, structured as requested. It synthesizes, organizes, and augments your materials, prioritizing non-negotiable constraints for your triple mandate while flagging conflicts and trade-offs.

  ---

  ### **Requirements for an Account of Causation by Omission**  
  *(Non-negotiable = Core to all three purposes; Preference = Domain-specific or theoretical trade-off)*  

  1.  **Objective Difference-Making**  
      *Motivation*: Must underwrite variable-based models (epidemiology, engineering) where causation is duty-free difference-making (e.g., "Backup generator’s failure to engage" is a cause iff its engagement would have prevented the outcome, regardless of norms).  
      *Status*: **Non-negotiable**. Essential for (iii). Without objectivity, models lose predictive/explanatory power.  
      *Conflict*: Tensions with norm-sensitive selection (Requirement 12).  

  2.  **Agency-Neutral Ontology**  
      *Motivation*: Must treat "rains did not come" and "nurse did not administer drug" with the same causal machinery. Agency cannot be metaphysically primitive.  
      *Status*: **Non-negotiable**. Required for univocal treatment of (i) agential/non-agential cases.  
      *Note*: Explains *why* agent omissions dominate discourse (norms/pragmatics) without building agency into causation.  

  3.  **Selection Filter**  
      *Motivation*: Infinite non-actors are formal difference-makers (Queen/gardener/neighbor not watering plant). Account must explain why only some are cited (e.g., duty, expectation, statistical norm).  
      *Status*: **Non-negotiable**. Needed for (i) & (ii); prevents causal inflation. Must specify if filter is pragmatic (conversational), semantic (truth-conditional), or normative (duty-based).  
      *Risk*: Purely pragmatic filters risk reducing omissions to linguistic artifacts (demoting metaphysics).  

  4.  **Chain Compatibility**  
      *Motivation*: Must handle causal chains mixing actions/omissions (e.g., supervisor’s omission → guard’s omission → backup failure → death). Cannot require "positive events only" at nodes.  
      *Status*: **Non-negotiable**. Critical for accident analysis (iii) and moral/legal chains (ii).  
      *Open*: Whether causal strength attenuates over omission-heavy chains is a **preference** (empirically tractable).  

  5.  **Preemption/Overdetermination Resolution**  
      *Motivation*: Must resolve cases like two sleeping guards (neither would have acted if the other did). Outcome: Both are difference-makers; selection filter determines citation.  
      *Status*: **Non-negotiable**. Tests consistency across (i)-(iii).  
      *Refinement*: With duties (one guard obligated), the account may *cite* only the obligated guard, but both remain *causes* (distinguishing causation from responsibility).  

  6.  **Spatiotemporal Anchoring**  
      *Motivation*: Must specify location/timing (e.g., "failure to irrigate" vs. "failure to brake"). Suggestion: Omission is located where/when the expected positive event *should have occurred* (gardener at plant on Tuesday; driver at pedal at *t*).  
      *Status*: **Non-negotiable**. Needed for integration with scientific models (iii) and legal evidence (ii).  

  7.  **Intervention Asymmetry Accommodation**  
      *Motivation*: Interventionism can test "what if agent acted?" but not "what if omission persisted?" (it already does). Account must either:  
      (a) Explain why this doesn’t undermine omissions as causes, or  
      (b) Deny omissions are *causes* (treating them as explanatory facts only).  
      *Status*: **Non-negotiable** for compatibility with (iii).  
      *Risk*: Option (b) may undermine (ii).  

  8.  **Non-Deflationary Truth Conditions**  
      *Motivation*: Must distinguish "failure to feed caused death" from "feeding would have prevented death" by providing *additional content* (e.g., causal role in a model, connection to norms).  
      *Status*: **Non-negotiable**. Essential for (ii) to pin responsibility *on a cause*.  

  9.  **Univocality of Causation**  
      *Motivation*: "Caused" should mean the same in "brake failure caused crash" (positive event) and "failure to brake caused crash" (omission). Reject views requiring mechanisms/processes for *all* causation.  
      *Status*: **Preference** leaning non-negotiable. Vital for (iii) and coherence of (i); but mechanistic accounts may reject this.  

  10. **Negative Ontology Compatibility**  
      *Motivation*: Must specify truthmakers for omission claims (e.g., "the failure" as a negative event, an absence, or a fact). Cannot require positive events only.  
      *Status*: **Preference**. Accounts may use absences/facts without reifying "negative events."  

  11. **Distinction from Blame/Allowing**  
      *Motivation*: Must explain correlation between omissions and blame (e.g., duty-bound omissions are cited) without *defining* causation via blame.  
      *Status*: **Non-negotiable**. Prevents circularity in (ii).  

  12. **Norm-Sensitivity Without Conflation**  
      *Motivation*: Duties/expectations drive *which omissions we cite* (e.g., nurse, not Queen, for plant death). Account must either:  
      (a) Build norms into causal *selection* (not causation itself), or  
      (b) Make causation intrinsically norm-sensitive.  
      *Status*: **Fault line**. (a) is **non-negotiable** for objectivity (iii); (b) undermines (iii) but appeals to (ii). *Recommendation: Choose (a).*  

  13. **Default-Dependence**  
      *Motivation*: "Alarm did not sound" is cited; "Sun did not explode" is not. Account must define the default (statistical, normative, or causal).  
      *Status*: **Preference**. Best handled by selection filter (Requirement 3).  

  14. **Contrast-Hunger Resolution**  
      *Motivation*: "Died because you didn’t water it" implies "rather than watering it." Account must explain this but show it’s not unique to omissions (general to causal selection).  
      *Status*: **Preference**. Not distinctive.  

  15. **Special-Sciences Compatibility**  
      *Motivation*: Need not secure omissions in fundamental physics (where absences may not be causal). Must work in biology, engineering, social sciences.  
      *Status*: **Non-negotiable**. Required for (iii).  

  16. **Empirical Tractability**  
      *Motivation*: Developmental/experimental data (e.g., children attribute omissions based on duties) should inform but not dictate the account.  
      *Status*: **Preference**. Desirable but not constitutive.  

  ---

  ### **Key Conflicts & Trade-offs**  
  - **Core Tension**: Requirement 12 (norm-sensitivity) vs. Requirement 1 (objectivity).  
    - *Resolution*: Drop intrinsic norm-sensitivity (Requirement 12b). Use **Selection Filter** (Requirement 3) for norms/duties, keeping causation itself objective.  
    - *Cost*: Legal practice (ii) must treat "causation" as composite (objective difference-making + normative selection).  
  - **Most Exclusionary Requirement**: **Requirement 1 (Objective Difference-Making)**.  
    - *Why*: Excludes views where omissions are causes *only* when norm-bound (undermining (iii)), mechanistic views rejecting absences (violating (i)/(iii)), and non-causal views (failing (ii)).  
  - **Is "Omissions" a Distinct Problem?**  
    - Largely dissolves into **causal selection** (Requirement 3) + **intervention asymmetry** (Requirement 7). The latter is the only metaphysically distinctive feature.  

  ---

  ### **Account Scorecard**  
  | **Account Type**               | **Strengths**                                  | **Critical Weaknesses**                                  |  
  |-------------------------------|-----------------------------------------------|----------------------------------------------------------|  
  | **Counterfactual/Difference-Making** | Excels at (i),(iii); handles chains (4), preemption (5). | Struggles with selection (3) & norm-sensitivity (12); intervention asymmetry (7) is awkward. |  
  | **Process/Mechanism**          | Provides objectivity (1), spatiotemporal anchors (6). | Rejects omissions as causes (fails 1-16); univocality (9) impossible. |  
  | **Non-Causal (Explanatory)**   | Avoids negative ontology (10), asymmetry (7). | Fails non-deflation (8); collapses (ii) (cannot underpin responsibility). |  

  ---

  ### **Final Notes**  
  - **Added Distinction**: **Intervention Asymmetry** (Requirement 7) is uniquely problematic for omissions and forces accounts to choose between modifying interventionism or accepting non-standard causation.  
  - **Triple Mandate Coherence**: Achievable if causation is *objective difference-making* and *selection* is handled by a hybrid (pragmatic/normative) filter. Legal (ii) and scientific (iii) uses then share a core causal ontology but apply different selection criteria.  
  - **Recommendation**: Start with a robust difference-making account (e.g., structural equations), add a norm-aware selection filter, and treat intervention asymmetry as a feature (not a bug) of omission-involving models.
