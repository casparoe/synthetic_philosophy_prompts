  **INTERNAL MEMORANDUM**  
  **From:** People & Performance Analytics, Horizon Capital LLC  
  **To:** Employee #40729  
  **Subject:** Annual Compensation Statement & Meritorious Earnings Reconciliation  

  Dear Valued Colleague,  

  Pursuant to Horizon Capital’s commitment to Radical Meritocracy™, your annual remuneration has been calculated via our proprietary Counterfactual Merit Assessment Process (CMAP). This algorithm isolates *genuinely attributable discretionary merit* by simulating a statistically median version of you (“Counterfactual You” or “CF-You”) sharing your immutable biological and developmental preconditions (genetic profile, parental socioeconomic status, baseline neurochemistry, etc.), while normalizing all stochastic environmental advantages and self-selected risks. Your pay reflects *only* the value differential between your actions and CF-You’s projected median outcomes.  

  **Itemised Meritorious Earnings Reconciliation:**  

  1. **Base Revenue Contribution (Gross):** $142,000  
     *Represents gross value generated by your role.*  

  2. **Adjustment for Deterministic Preconditions:**  
     a. *Cognitive Aptitude Advantage (Genetic):* -$32,500^1  
     b. *Parental Educational Investment (Pre-age 18):* -$18,200^2  
     c. *Absence of Major Trauma/Chronic Illness:* -$9,700^3  
     *Total Precondition Adjustment:* **-$60,400**  

  3. **Adjustment for Stochastic Environmental Advantages:**  
     a. *Market Conditions (Sector Growth vs. Median):* -$15,250  
     b. *Managerial Bias Variance (Favourable):* -$7,800  
     c. *Network Access (Alumni Affiliation):* -$4,200  
     *Total Environmental Adjustment:* **-$27,250**  

  4. **Adjustment for Non-Attributable Risk Outcomes:**  
     a. *Successful Project Gamble (Stat. Probability <23%):* -$12,150^4  
     b. *Serendipitous Client Introduction (Unsolicited):* -$6,300  
     *Total Risk Adjustment:* **-$18,450**  

  5. **Adjustment for Persistence Factors (Non-Volitional):**  
     *"Grit" Attribution (Correlated w/ Dopamine Receptors):* -$8,500^5  
     *"Presenteeism" (Immune System Robustness):* -$3,750  
     *Total Persistence Adjustment:* **-$12,250**  

  **Net Attributable Merit (Pre-Tax):** $142,000 - $60,400 - $27,250 - $18,450 - $12,250 = **$23,650**  

  **Mandatory Non-Meritorious Subsistence Top-Up (NMST):** +$31,350^6  
  *To ensure compliance with Section 12(b) of the National Minimum Standards Act. This allocation is explicitly unrelated to merit, contribution, or value. It is a flat humanitarian disbursement.*  

  **TOTAL DISBURSEMENT:** **$55,000**  

  ---  
  **FOOTNOTES:**  
  ^1 *Calculated via meta-analysis of twin studies correlating IQ variance with salary differentials. CF-You assumed 98th percentile aptitude; your actual placement (99.6th) deemed non-volitional.*  
  ^2 *CF-You attended public schools in the 50th percentile funding bracket. Your private schooling (K-12) constitutes unearned human capital.*  
  ^3 *CF-You experienced median setback frequency (e.g., mild depression Q2, broken limb Q4). Your uneventful year is a survivorship bias artifact.*  
  ^4 *While initiating Project Phoenix demonstrated agency, its 7.2x ROI exceeded statistically expected outcomes (1.1x). Excess deemed luck.*  
  ^5 *"Grit" is strongly heritable (h²≈0.57). CF-You logged standard effort hours (45.3/week). Your 52.7/week is physiologically predisposed.*  
  ^6 *NMST is applied uniformly across all pay grades to prevent acute caloric deficit. It is not compensation. Do not list it on your CV.*  

  ---  
  **OVERLEAF: FREQUENTLY ASKED QUESTIONS**  
  **Q: Why is my pay lower than last year?**  
  A: Your 2023 outcomes showed higher serendipity covariance (see Adjustment 4b). CMAP more accurately isolated stochastic inflation.  

  **Q: Barry in Accounting got $58,000. I delivered more value!**  
  A: Barry’s CF-You simulation underperformed median expectations by $12,200 due to simulated agoraphobia (genetic predisposition). His net merit was higher.  

  **Q: What about inflation?**  
  A: Inflation impacts the NMST (see +$1,150 vs. 2023), not merit. CF-You’s output is inflation-adjusted post-calculation.  

  **Q: How can I increase my Attributable Merit?**  
  A: Make choices CF-You wouldn’t make, but which succeed *despite* statistically probable failure. This is rare. Training has low heritability correlation – consider our "Volitional Luck Maximization" workshop ($499, deductible from NMST).  

  **Q: Is Horizon Capital profitable?**  
  A: Record profits. Our shareholders benefit from deterministic market advantages and regulatory environments. This is irrelevant to your merit.  

  We celebrate your Genuine Merit Residue™ of $23,650. Thank you for choosing Horizon Capital. Remember: You Didn’t Build That™.  

  Sincerely,  
  **People & Performance Analytics**  
  *"Scrutinizing Success Since 2027"*  

  ---  
  **COMEDIC EFFECTS ACHIEVED:**  
  - **Deadpan Bureaucracy:** HR clinically dissects human achievement into luck categories.  
  - **Escalating Absurdity:** Deductions start plausible (education) and end with "you didn’t get hit by a meteor."  
  - **The Flat Payment Reveal:** NMST is larger than "merit," emphasizing the system's collapse.  
  - **Unspoken Dread:** The FAQ implies merit is almost impossible to isolate, rendering "meritocracy" a farce.  
  - **Corporate Doublespeak:** "Genuine Merit Residue™" and "You Didn’t Build That™" parody branding emptiness.  
  - **The Footnote:** Explaining grit as heritable undermines the core myth of earned perseverance.
