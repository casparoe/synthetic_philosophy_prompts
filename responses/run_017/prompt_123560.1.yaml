prompt: |-
  write me a parody, about 600 words, of the covering letter that comes with a payslip from a firm that's definately decided to pay everyone exactly what they deserve. the setup: anything about my year that traces back to something I didn't choose — my brains, my upbringing, being the sort of person who can be bothered, the fact that nothing awful happened to me — gets priced out as unearned luck, and so does anything where I took a gamble that just happened to come off. HR work out what's left by simulating a "counterfactual me" (same genes, same childhood, median everything else) and paying me the gap between what I actually did and what that version would of done.

  the comedy should come from the arithmetic being done completely straight, in deadpan HR-speak. the deeper the letter goes, the smaller the bit that survives as genuinely mine, until the firm has to bring in some flat payment to everyone so that people don't starve, and the letter is very insistent that this flat bit has nothing at all to do with merit. format it as a real letter with itemised deductions, a footnote or two, maybe a short FAQ overleaf. someone reading it should come away properly feeling the worry that merit pay, taken seriously, ends up cancelling itself — but the letter must never say that out loud.
reasoning: |-
  Okay, the user wants a parody covering letter for a payslip that deducts anything attributable to unearned luck from someone's salary. The premise is that the firm calculates pay based solely on merit by simulating a "counterfactual me" with median circumstances. 

  Hmm, the user clearly enjoys dark corporate humor and philosophical irony. They're probably someone who's thought deeply about meritocracy's flaws - maybe in tech/finance where "performance pay" is common. The unspoken request seems to be satire that makes readers question merit-based systems through absurd literalism. 

  Key comedy angles to hit: 
  First, the HR-speak deadpan is crucial. Phrases like "deterministic preconditions" and "stochastic environmental factors" will sell the corporate absurdity. 
  Second, the deductions must escalate from reasonable (education advantages) to ridiculous ("lack of meteorite strike"). 
  Third, the flat payment reveal should feel like a bleak punchline - hence emphasizing it's "non-meritorious subsistence." 

  Structural notes: 
  The letter needs faux-official formatting. Itemized deductions with snarky footnotes (e.g., the "counterfactual me" being a depressed accountant). 
  FAQ section for passive-aggressive HR logic ("Why did Barry get more?" → "Barry's simulation underperformed"). 
  Final net pay should be comically low before the flat top-up. 

  Biggest challenge: balancing humor with the philosophical point. Each deduction must feel logically consistent within the parody's rules while exposing real meritocracy flaws. The "genuine merit residue" bit where even effort gets discounted as genetic luck is key for that. 

  User would probably appreciate subtle nihilistic touches - like the flat payment being exactly minimum wage, or the footnote about "simulation variance." Shows how systems "solve" unfairness by making everyone equally miserable.
