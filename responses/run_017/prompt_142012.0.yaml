answer: |-
  Below is a 45-minute exam question designed to force candidates to engage with the nuances of Thomson's lamp beyond the standard "indeterminate state" response. The question integrates your three devices (persistence, convergent quantity, and completion/default) to pry apart the four positions you outlined. Marks total 20, distributed to reflect depth and precision. A model answer (∼700 words) commits to **Position 4** (determinate state not entailed by the description), and the marking scheme targets key errors. The B-grade description follows at the end.

  ---

  ### Exam Question: Thomson’s Lamp Revisited (20 marks total)
  Thomson’s lamp is switched on at \( t = 0 \). After \( \frac{1}{2} \) minute, it is switched off; after \( \frac{3}{4} \) minute, on; after \( \frac{7}{8} \) minute, off; and so on, ad infinitum. This supertask concludes at \( t = 1 \) minute. Candidates must address **all three parts**, taking a clear stance on what resolves the lamp’s state at \( t = 1 \). Simply claiming "the description fails to determine the state" is inadequate. Engage with the following scenarios:

  **(a) Persistence (8 marks)**  
  Suppose no switching occurs after \( t = 1 \), and at \( t = 2 \) minutes, the lamp is observed to be off.  
  (i) Does this observation entail that the lamp was off at \( t = 1 \)? Justify your answer.  
  (ii) If "yes", explain why this resolves the indeterminacy objection. If "no", identify what principle (e.g., continuity, causal isolation) blocks the inference from the later state to the state at \( t = 1 \).  

  **(b) Convergent Quantity (6 marks)**  
  The proportion of elapsed time the lamp spends "on" before \( t = 1 \) is given by the series \( \frac{1}{2} - \frac{1}{4} + \frac{1}{8} - \frac{1}{16} + \cdots \), which converges to \( \frac{1}{3} \). Some students argue this shows the lamp is "one-third on" at \( t = 1 \).  
  (i) What does this convergent series genuinely establish (e.g., about cumulative properties)?  
  (ii) Why does it fail to specify the lamp’s *state* (on/off) at \( t = 1 \)? Use this to critique the "half-on" summation interpretation.  

  **(c) Completion Default (6 marks)**  
  The lamp is wired to a controller that imposes: "If the switching sequence does not yield a definite state at \( t = 1 \), default to off."  
  (i) Does this stipulation *dissolve* the original puzzle about the lamp’s state at \( t = 1 \)? Explain why or why not.  
  (ii) If it dissolves the puzzle, does this imply the original issue was never about the lamp’s state, but about whether infinitely many tasks can be completed? If not, what does it show about underdetermination?  

  ---

  ### Model Answer (∼700 words)  
  **Position:** The lamp has a determinate state at \( t = 1 \), but Thomson’s description alone does not entail it. Additional physical or logical principles (e.g., persistence, default rules) are needed to fix the state. The supertask is possible, and the question is well-formed.  

  **(a) Persistence**  
  (i) Yes, observing the lamp off at \( t = 2 \) entails it was off at \( t = 1 \). Persistence—the principle that a lamp’s state remains constant unless changed—applies here. No switches occur between \( t = 1 \) and \( t = 2 \), so the state at \( t = 1 \) must match \( t = 2 \). This observation resolves the indeterminacy: if the lamp is off later, it was off at the limit.  
  (ii) This refutes the "no answer" claim by introducing a *diachronic constraint*. The inference is blocked only if we deny persistence (e.g., by alleging spontaneous state changes). But denying persistence is unmotivated; lamps do not randomly toggle. Thus, indeterminacy proponents must explain why persistence fails at supertasks, which they cannot without ad hoc stipulations. The later observation fixes the limit state via continuity of ordinary objects.  

  **(b) Convergent Quantity**  
  (i) The convergent series establishes a *time-averaged property*: over the interval \([0,1)\), the lamp spends 1/3 of the time on. This is a global, cumulative fact about the supertask’s history, akin to total energy expended.  
  (ii) It fails to specify the state at \( t = 1 \) because instantaneous state and time-averaged properties are distinct. A lamp’s on/off state at a point-time is binary and non-archival; it does not "remember" past states. The "one-third on" or "half-on" (from summing \( 1 - 1 + 1 - 1 + \cdots \)) interpretations conflate measurement with ontology. A lamp cannot be fractionally on; it is digital, not analog. Convergent averages describe aggregated processes, not punctual states. Thus, while mathematically coherent, this approach answers a different question (e.g., "what fraction of the task’s duration was the lamp on?") and evades Thomson’s puzzle.  

  **(c) Completion Default**  
  (i) The stipulation dissolves the puzzle but does not *solve* it; it *redescribes* it. The default rule ("default to off if indeterminate") assigns a determinate state, so the lamp is off at \( t = 1 \). However, this dissolves the puzzle only by *adding information* absent in Thomson’s original setup. It does not clarify whether indeterminacy was genuine or merely descriptive underdetermination.  
  (ii) This shows the original puzzle was always about underdetermination, not supertask possibility. The supertask completes (infinitely many switches occur in finite time), but the state description is incomplete. The default rule fixes the state by fiat, exposing that Thomson’s sequence lacks a "completion condition." If adding such a rule resolves the issue, it implies the lamp’s state was never inherently indeterminate—just underspecified. Thus, the puzzle reduces to whether physical laws or logical rules supplement descriptions to determine outcomes.  

  **Verdict:** Position 4 is correct. The lamp’s state at \( t = 1 \) is determinate, but Thomson’s description—a bare supertask sequence—fails to entail it. Persistence (Part a) and default rules (Part c) provide external principles that fix the state, while convergent quantities (Part b) are irrelevant to punctual states. Rejecting persistence or embracing averages (as in Positions 1–3) is unjustified. The supertask is possible; indeterminacy arises from descriptive poverty, not metaphysical impossibility.  

  ---

  ### Marking Scheme (20 marks total)  
  **Award top marks (17–20) for:**  
  - Explicitly naming and distinguishing the four positions (e.g., "Position 4: determinate state not entailed").  
  - In (a), affirming persistence and using it to reject indeterminacy, while critiquing ad hoc denials of continuity.  
  - In (b), sharply separating time-averaged properties from punctual states and rejecting fractional "states."  
  - In (c), arguing the default rule redescribes (not solves) the puzzle and ties it to underdetermination.  
  - Consistently committing to one position (e.g., determinate state) without hedging.  

  **Deduct marks for these specific errors:**  
  - **-3–4 marks:** Inferring supertask impossibility (Position 1) from descriptive underdetermination (e.g., "No answer, so supertasks are impossible").  
  - **-3 marks:** Treating the convergent time-average as fixing the state (e.g., "The lamp is 1/3 on at t=1").  
  - **-2–3 marks:** Dismissing the later observation (Part a) as irrelevant due to a preconceived limit state (e.g., "t=2 is off, but t=1 was already indeterminate").  
  - **-3 marks:** Treating the default stipulation (Part c) as a "solution" rather than a redescription (e.g., "The controller fixes the problem").  
  - **-2 marks:** Conflating the positions (e.g., "The question is ill-formed, so the state is indeterminate").  
  - **-1–2 marks:** Vagueness on why convergence fails (e.g., "Averages don’t determine states" without ontological justification).  

  **B-grade answer (12–14 marks) characterization:**  
  *Uses correct terminology (e.g., "indeterminacy," "supertask," "convergent series") and identifies surface features (e.g., persistence implies state stability), but fails to disentangle the four positions or deeply analyze the devices. Typically asserts indeterminacy without engaging Part (a)’s persistence challenge, or leans on averages in Part (b) without critiquing them, or accepts the default in Part (c) uncritically as a solution. Structure is list-like, not integrative.*  

  ---  
  This question forces candidates to confront the crux: descriptive underdetermination vs. metaphysical indeterminacy. By requiring engagement with persistence, convergence, and defaults, it blocks rote "no answer" responses and rewards rigorous position-taking. The model answer and marking scheme enforce precision on the errors you specified.
