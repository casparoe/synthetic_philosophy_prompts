  The user suggests three devices: persistence, convergent quantity (time-average), and a completion/default rule. I need to integrate these effectively. The question should be structured in parts with clear mark allocations. The model answer must take a firm stand, and the marking scheme should identify key errors like conflating the time-average with the state, dismissing later observations, or treating the default as a solution.

