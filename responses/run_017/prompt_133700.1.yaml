prompt: |-
  I'm in the first year of a PhD program, and our reading group lost most of last week's session to the aggregation problem for Scanlonian contractualism. I've since been playing with a revision to the test, and I genuinely can't tell whether it's an improvement or a slow-motion collapse into utilitarianism, so I'd like an outside view before I inflict it on the group again.

  As usually stated, contractualism compares candidate principles by asking what complaints individuals could reasonably raise against them, and it refuses to add different people's complaints together: a million people each gaining some trivial benefit can never outweigh one person's serious burden, because there is no principle on which any single one of the million has a complaint that rivals the burdened person's. I'm sympathetic to that upshot, but I think the test as stated is blind to a different class of case: burdens that are negligible on each occasion but that pile up on the same person across a life. Imagine a tenancy rule that costs the same tenant a trivial amount on each of thousands of separate occasions, or a siting decision whose tiny exposures accumulate in one small neighbourhood. At any given moment the affected person's complaint is trivial, so a test that looks only at occurrent complaints never registers anything at all — yet intuitively the policy imposes something serious on that person, and on them specifically. Here is my proposed fix — call it the life-share view. Keep the ban on summing complaints across persons fully intact, but allow complaints to sum within a single life, and measure a person's complaint as the share of their total lifetime well-being that the principle would cost them. On this view the million trivial benefits still generate no large complaint, since each beneficiary's lifetime share barely moves; but a thousand trivial burdens falling on one person now generate a substantial complaint, which can enter the ordinary pairwise comparison with everyone else's without any interpersonal aggregation at all.

  Please compare the standard synchronic complaint test with the life-share view as responses to the aggregation problem. I'd like you to cover four things, in whatever order serves your argument: (i) construct a case where the two tests actually diverge and tell me which answer you think is correct there; (ii) say whether summing a person's complaints over time is morally different in kind from summing complaints across persons — and, in particular, what happens if the unity of a life is itself only a matter of degree, as reductionist views of personal identity suggest: does that undermine the life-share view, or does it undermine the ban on interpersonal aggregation instead, or neither; (iii) address the individuation worry, since the life-share view's verdicts seem to depend on how finely we carve up occasions, and it's not obvious that occasions come pre-carved — is that objection fatal, or is there a principled way to do the carving; and (iv) judge which of the two views better preserves whatever made contractualism attractive in the first place (the separateness of persons, the idea of justification to each person one by one), and whether the life-share view has quietly turned into a form of prioritarianism once complaints are measured as lifetime shares.

  You are a professional moral philosopher who has worked on contractualism and on the aggregation debate. Think the problem through carefully before you write: in particular, spend a moment trying to construct the strongest objection to whichever view you find yourself inclined to defend, and tell me plainly if doing so changes your mind. I don't want citations, a reading list, or a map of who has said what — I want your own argument. Format: open with a single sentence giving your verdict, then argue for it in continuous prose with no headings or bullet points; the whole answer must be at most 600 words.
reasoning: |-
  Okay, let me tackle this PhD student's query about modifying Scanlonian contractualism. The core tension is between maintaining contractualism's anti-aggregation stance while addressing cumulative burdens on single individuals - a problem the standard synchronic approach seems to miss. 

  First, I need to construct a clear divergence case. Imagine a factory policy emitting negligible pollution affecting only one resident daily versus a safety rule costing each worker a tiny daily inconvenience. Synchronic contractualism sees no complaint in either case since each instance is trivial. But under life-share, the resident accumulating health damage develops a serious complaint while the workers' dispersed inconveniences remain negligible. This feels intuitively correct - the resident is genuinely wronged in a way the workers aren't.

  Now the personal identity challenge: if personal identity is reducible to psychological connections, doesn't that undermine intrapersonal aggregation? But even reductionists accept pragmatic unity of personhood for ethical purposes. More importantly, if disunity threatens life-share, it equally threatens synchronic complaints which assume a persisting subject. The real issue is diachronic unity for responsibility, which both views presuppose.

  The individuation worry is trickier. Does defining "occasions" arbitrarily affect life-share's verdicts? We can adopt a pragmatic solution: use natural decision-points (e.g., policy applications) rather than micro-moments. While imperfect, this mirrors how we naturally assess harms - we don't require metaphysical precision in tort law either. Still, this remains life-share's weakest point.

  Finally, contractualism's core appeal: justifiability to each person separately. Life-share preserves this by keeping complaints person-specific and banning interpersonal sums. Measuring complaints as lifetime shares isn't prioritarianism - it doesn't weight burdens by overall well-being levels, only cumulative impact. The resident's complaint matters because it's their significant total burden, not because they're worse off absolutely.

  Strongest objection? That life-share could justify imposing huge burdens on the worst-off if spread thinly enough. But this misapplies the view: if a policy cumulatively costs someone 20% of lifetime well-being, that's their complaint regardless of dispersion. The test still compares this to others' maximum complaints under alternatives. 

  After wrestling with this, I'm more convinced life-share improves contractualism without collapsing it. It handles real cases of dispersed harm while keeping interpersonal aggregation taboo. The objections are serious but answerable.
answer: |-
  Your life-share view is a defensible and arguably superior revision to Scanlonian contractualism that addresses genuine blind spots without collapsing into utilitarianism. Let's proceed systematically.

  **(i) Divergence Case:** Consider a municipal water policy adding a harmless mineral, causing negligible taste dissatisfaction to each consumer per glass. Under synchronic contractualism, no single drinking occasion generates a non-trivial complaint; hence, the policy seems unproblematic even if one particular resident, Alice, drinks exclusively this water for decades, accumulating significant lifetime dissatisfaction. The life-share view recognizes Alice’s cumulative burden as a substantial complaint, potentially outweighing the policy's tiny per-consumer benefits (e.g., minor cost savings). The correct answer is that Alice’s persistent, focused burden matters morally; synchronic contractualism fails here by atomizing her experience.

  **(ii) Intrapersonal vs. Interpersonal Summing & Personal Identity:** Summing burdens within a life is fundamentally different from summing across lives, even under reductionism about personal identity. The moral significance lies in the *bearer* of burdens and benefits. A "person," even if metaphysically reducible to connected stages, remains the unique locus of conscious experience and practical agency over time. Complaints arise within this unified perspective: Alice’s *overall* life is worsened, regardless of her metaphysical composition. Reductionism doesn’t undermine intrapersonal aggregation; it highlights that what matters is the cumulative impact on a single stream of consciousness/agency. Crucially, if reductionism threatened intrapersonal summing, it would equally devastate synchronic contractualism, which assumes a persistent subject to lodge any complaint at time *t*. Both views need a pragmatically robust conception of personal identity; the life-share view doesn’t uniquely suffer here.

  **(iii) Individuation of Occasions:** The objection isn’t fatal. We should individuate "occasions" based on the natural units of the policy’s application or the relevant decision context—not arbitrary temporal slices. For the water policy, the relevant occasion is each instance of water provision/consumption; for a tenancy rule, it might be each rental period. While no carving is metaphysically pristine, ethical deliberation always relies on contextually salient boundaries (e.g., "per decision," "per exposure event"). Life-share’s dependence on this mirrors how we intuitively assess harm: we don’t ignore chronic low-level suffering merely because it’s delivered incrementally. Principled carving is possible by anchoring occasions to the scope of the principle being evaluated.

  **(iv) Preserving Contractualism’s Core:** The life-share view better preserves contractualism’s foundational commitments. The "separateness of persons" forbids interpersonal aggregation; life-share scrupulously maintains this ban. Justification remains "to each person, one by one": we justify the policy to Alice by showing her that, considering the cumulative burden *to her life as a whole*, no alternative principle could reasonably be rejected given others' maximum complaints under alternatives. Measuring complaints as lifetime shares isn’t prioritarianism. Prioritarianism weights benefits to the worse off more heavily; life-share merely totals burdens *within* a life without weighting across lives. Alice’s large cumulative complaint competes in pairwise comparisons just like a large synchronic complaint—no priority to the worse off is implied unless their cumulative burdens are greater.

  **Strongest Objection & Response:** The sharpest challenge is that life-share might permit *extreme* burdens on one person if dispersed finely enough (e.g., a policy shaving milliseconds off each heartbeat for a lifetime). Does this mirror utilitarianism’s willingness to sacrifice one for many? No. First, the complaint is measured by *lifetime impact*—if milliseconds accumulate to years of life lost, the complaint is massive. Second, it still faces pairwise comparison: could Alice reasonably reject this principle given alternatives? If an alternative avoids her massive burden while imposing only modest burdens on others, rejection seems justified. The test remains agent-centered and comparative.

  In conclusion, your revision successfully addresses cumulative intra-personal burdens while respecting contractualism’s core prohibitions against interpersonal aggregation, offering a more plausible and complete moral framework.
