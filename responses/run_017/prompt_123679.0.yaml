  The Zero-Cost Guardrail experiment shows interesting findings: at t0 most subjects choose the larger later reward ($20 in 30 days) over the smaller sooner ($10 now). They're offered a free button that would disable the SS option for 90 seconds. Most want it pressed at t0 and would pay to have it automatic. But at t1, half don't press it, and this group splits into "Faders" (who don't see SS as avoidance-worthy and feel relief with the guardrail) and "Strainers" (who acknowledge they shouldn't choose SS but do anyway, and get annoyed with the guardrail).

  I'll structure this document as requested: first numbered agreed claims, then a table of disagreements, then cruxes with testable predictions, and finally practical advice for a real-world scenario.

  For the agreed claims section, I'll focus on substantive points both would accept:
  - Hyperbolic discounting explains some preference reversals
