answer: |-
  ### Case: The Conservatory's Competition Dilemma

  A music conservatory must decide whether to enter a promising student into a prestigious competition. The student's skill is unknown: high (H) or low (L), each with prior probability 0.5. The conservatory can obtain a free, accurate assessment (signal) of the skill. If they decline the signal, the student, motivated by uncertainty, practices intensively. Practice transforms low skill into medium (M), which performs adequately but not excellently. High skill remains high. If the conservatory obtains the signal, the student feels no pressure to practice and skips it. The conservatory is an expected-utility maximizer with a fixed utility function over competition outcomes:

  - Entering a high-skill student: +10 (win or top placement).
  - Entering a medium-skill student: 0 (decent performance, no prize).
  - Entering a low-skill student: −10 (embarrassing failure).
  - Not entering: 0 (no gain or loss).

  The signal accuracy is given below. Acquiring the signal has no cost and affects nothing except beliefs (it directly causes the student not to practice, as per institutional psychology studies on motivation). The conservatory updates by conditionalization and acts optimally given its information.

  **Probability Model**  
  States: Skill \(S \in \{H, L\}\)  
  Signal: Assessment \(A \in \{H, L\}\)  

  | \(P(S)\) | Value |
  |----------|-------|
  | H        | 0.5   |
  | L        | 0.5   |

  | \(P(A \mid S)\) | A = H | A = L |
  |-----------------|-------|-------|
  | S = H           | 0.9   | 0.1   |
  | S = L           | 0.1   | 0.9   |

  **Mechanism**:  
  - If signal declined → student practices → \(L\) becomes \(M\), \(H\) remains \(H\).  
  - If signal obtained → no practice → skill unchanged.  

  **Decision Tree**:  
  1. Conservatory chooses to get signal or not.  
  2. If signal obtained:  
     - Observes \(A\), updates beliefs.  
     - Chooses to enter or not.  
  3. If signal declined:  
     - Student practices (so \(S = H → H\), \(S = L → M\)).  
     - Chooses to enter or not (without knowing true skill).  

  ---

  ### Work: Expected Utility Calculations

  **1. Expected utility (EU) if signal declined (no assessment):**  
  - Student practices: \(P(H) = 0.5\), \(P(M) = 0.5\) (since all \(L\) become \(M\)).  
  - Conservatory enters (optimal, as EU(enter) > EU(not enter)):  
    \[
    \text{EU}_{\text{decline}} = 0.5 \times u(\text{enter}, H) + 0.5 \times u(\text{enter}, M) = 0.5 \times 10 + 0.5 \times 0 = 5.
    \]
  - Not entering yields 0, so enter for EU = 5.  

  **2. Expected utility if signal obtained:**  
  First, marginal probability of signal:  
  \[
  P(A = H) = P(A = H \mid S = H)P(S = H) + P(A = H \mid S = L)P(S = L) = (0.9 \times 0.5) + (0.1 \times 0.5) = 0.5.
  \]
  Similarly, \(P(A = L) = 0.5\).  

  - **If \(A = H\) observed:**  
    Posterior:  
    \[
    P(S = H \mid A = H) = \frac{P(A = H \mid S = H) P(S = H)}{P(A = H)} = \frac{0.9 \times 0.5}{0.5} = 0.9.
    \]
    \[
    P(S = L \mid A = H) = 1 - 0.9 = 0.1.
    \]
    EU(enter) = \(0.9 \times 10 + 0.1 \times (-10) = 9 - 1 = 8\).  
    EU(not enter) = 0.  
    → Enters for EU = 8.  

  - **If \(A = L\) observed:**  
    Posterior:  
    \[
    P(S = H \mid A = L) = \frac{P(A = L \mid S = H) P(S = H)}{P(A = L)} = \frac{0.1 \times 0.5}{0.5} = 0.1.
    \]
    \[
    P(S = L \mid A = L) = 0.9.
    \]
    EU(enter) = \(0.1 \times 10 + 0.9 \times (-10) = 1 - 9 = -8\).  
    EU(not enter) = 0.  
    → Does not enter for EU = 0.  

  - **Ex-ante EU with signal:**  
    \[
    \text{EU}_{\text{obtain}} = P(A = H) \times 8 + P(A = L) \times 0 = 0.5 \times 8 + 0.5 \times 0 = 4.
    \]

  **3. Comparison:**  
  \[
  \text{EU}_{\text{decline}} = 5 > \text{EU}_{\text{obtain}} = 4.
  \]
  The expected value of the free signal is \(4 - 5 = -1 < 0\). Declining it yields higher EU.  

  ---

  ### Why Good’s Theorem Fails: The Broken Premise
  Good’s theorem relies on four key premises:  
  1. Fixed state-independent utility over outcomes.  
  2. Bayesian updating (conditionalization).  
  3. No direct cost of acquiring/processing information.  
  4. **No causal effect of information acquisition on the world state (only beliefs change).**  

  **The failure:** Premise 4 is violated. Here, acquiring the signal *causes* the student not to practice, which directly alters the skill state (low skill remains low instead of becoming medium). This is not a belief change; it is a physical effect on the outcome distribution. The signal is not "purely informative" because its acquisition triggers an institutional/behavioral rule (practice only under uncertainty) that changes payoffs independently of the beliefs produced.  

  **Constraints satisfied:**  
  - (1) One agent (conservatory); no other agents adapt.  
  - (2) Signal is free (no cost).  
  - (3) Finite states, utilities, probabilities; no demons.  
  - (4) Realistic (based on psychology: uncertainty motivates effort).  
  - (5) Signal production only affects beliefs *if acquired*, but the *act of acquisition* causes the practice effect—this is the loophole.  
  - (6) Negative value not stipulated: Utility depends only on competition outcomes (e.g., "embarrassment" is an outcome, not "knowing"). The harm is instrumental: No practice → low skill unremediated → risk of failure.  

  **If the causal feature is removed:** Suppose practice occurs regardless of signal acquisition. Then:  
  - With signal: EU = 4 (as above, but skill unchanged).  
  - Without signal: Student practices, but conservatory acts under prior (\(P(H) = P(M) = 0.5\)). EU(enter) = 5, same as before.  
  - But now, with signal, conservatory can condition entry on \(A\). If \(A = H\), enter (EU=8); if \(A = L\), \(P(S = L \mid A = L) = 0.9\), so not enter (EU=0). EU = 4.  
  - **No violation:** EU without signal is 5, EU with signal is 4, still worse. But wait—if practice always happens, low skill becomes \(M\) regardless. When signal is obtained and \(A = L\), \(P(S = L \mid A = L) = 0.9\), but if practice occurs, \(S = L\) is now \(M\), so utility of entering is \(u(M) = 0\) (not \(-10\)). Thus:  
    - If \(A = L\), EU(enter) = \(P(S = H \mid A = L) \times 10 + P(S = L \mid A = L) \times 0 = 0.1 \times 10 + 0.9 \times 0 = 1\).  
    → Enters for EU=1 (since >0).  
    - Ex-ante EU with signal: \(P(A = H) \times 8 + P(A = L) \times 1 = 4 + 0.5 = 4.5\).  
    - Without signal: EU=5 (unchanged).  
    Now \(5 > 4.5\), but the signal is still harmful? Prior EU without signal is 5, with signal is 4.5, so value is negative. However, without the causal effect, the conservatory enters *in all cases* with signal, but the outcome when \(A = L\) is better (utility 1 vs. 0) because practice occurred. The signal allows better decisions, but the improvement (from 0 to 1 when \(A = L\)) is outweighed by the loss from no practice when \(A = H\) (utility 8 vs. 10 if practice happened, but practice doesn't happen). Calculation: With practice always, utility when \(A = H\) is \(0.9 \times 10 + 0.1 \times 0 = 9\) (since \(S = L\) becomes \(M\)), but the conservatory, after seeing \(A = H\), thinks \(P(S = H) = 0.9\), so EU(enter) = \(0.9 \times 10 + 0.1 \times 0 = 9\), same as before. I need to recast.  

  Simpler: If practice always occurs, skill is \(H\) or \(M\) with \(P=0.5\) each, regardless of signal. With signal:  
  - If \(A = H\), \(P(S = H \mid A = H) = 0.9\), so EU(enter) = \(0.9 \times 10 + 0.1 \times 0 = 9\)  
  - If \(A = L\), \(P(S = H \mid A = L) = 0.1\), EU(enter) = \(0.1 \times 10 + 0.9 \times 0 = 1\)  
  → EU with signal = \(0.5 \times 9 + 0.5 \times 1 = 5\)  
  Without signal: EU = 5 (as before).  
  **The case collapses**: EU identical with or without signal, confirming Good’s theorem. The causal effect is essential.  

  ---

  ### Defense by a Theorem Proponent: Is This Cheating?
  A proponent might argue: "This isn't a counterexample to Good’s theorem because the theorem assumes information has *no causal impact* on states. Your case has a side effect (blocking practice), so it violates the 'pure information' clause. The theorem only covers signals that don't alter the world."  

  **Principled or rhetorical?** This is principled. Good’s theorem explicitly assumes the signal structure affects only beliefs. Here, acquisition changes the state transition (practice/no practice), making it a different "game." The proponent can exclude this while being consistent: The theorem applies when information is *solely belief-modifying*, but this signal is *state-modifying*.  

  **Is it cheating to exclude?** No—it clarifies the theorem’s scope. Real-world information often has side effects (e.g., medical tests cause anxiety), so the theorem’s purity is idealized. But in your constraints, you allowed institutional rules (e.g., practice triggered by no signal), and this exploits that. The proponent must concede that "free information" in practice can hurt if it isn't purely epistemic, but insists the theorem holds in its intended domain.  

  ---

  ### Restated Good’s Theorem (Non-Empty and True)
  **Theorem:** For a Bayesian expected-utility maximizer with a fixed state-independent utility function, if acquiring a free signal:  
  - (i) Has no direct cost,  
  - (ii) Affects no physical state or outcome (only beliefs), and  
  - (iii) Allows unrestricted conditioning of actions on the signal,  
  then the expected value of the signal is non-negative.  

  **Why non-empty?** It shows that harmful information must violate (i), (ii), or (iii). This rules out tautology by specifying empirical premises (e.g., "no causal effects").  

  **Exam Note:** The case depends on the convention that "no causal effect" is separable from belief change. Substantively, it highlights that rational agents must account for how information acquisition influences behavior beyond updating.  

  --- 

  **Handout-Ready Summary**  
  Copy tables and decision flow to the blackboard. Emphasize: The negative value arises because declining the signal preserves valuable doubt that motivates practice—a feature of "real-world" psychology. Good’s theorem survives if we isolate belief-based learning, but its scope is narrower than students think.
