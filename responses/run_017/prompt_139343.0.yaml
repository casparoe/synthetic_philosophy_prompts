  Then there's the phantom-race problem. The Allied fear of a German bomb was based on overestimation, not an inflated view of their own capabilities. The curse framework typically deals with self-overconfidence, not misjudging others. The theory might not directly address this, so I should note that gap and suggest intelligence improvements as a remedy outside the standard conformity principle.

