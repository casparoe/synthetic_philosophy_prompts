  10. **Split-Threshold View**  
      - *Cost:* Life at +10 is worth living (Node 2: A better), but adding it to a thriving world isn't better (Node 3: No).  
      - *Stuck with:* Unexplored in literature (unattractive to both totalists and person-affecting theorists).  
      - *Note:* The worth-living threshold (0) ≠ moral neutrality threshold (>0). Unnamed and unexplored, but coherent.  

  ---

  ### **Key Unseparated Pairs and Discriminating Questions**  
  1. **Incomparabilist (Leaf 4) vs. Narrow Person-Affecting (Leaf 4/7):**  
     → *Separator:* "Is creating a happy person (+100) *neutral* (not better than nothing)?"  
     - Yes → Narrow Person-Affecting.  
     - No/Incomparable → Incomparabilist.  

  2. **Critical-Level (Leaf 5) vs. Negative-Asymmetric (Leaf 2):**  
     → *Separator:* "Is a world with one person at +100 better than no one?"  
     - Yes → Critical-Level.  
     - No/Neutral → Negative-Asymmetric.  

  3. **Totalism (Leaf 3) vs. Split-Threshold (Leaf 10):**  
     → *Separator:* "Is adding a life at +100 to a thriving world (+1,000) *better*?"  
     - Yes → Totalism.  
     - No → Split-Threshold.  

  ---

  ### **Design Notes**  
  - **Repugnant Conclusion handling:** Accepting it (Node 5: Yes) leads to multiple leaves (3, 10), rejecting it (No) leads to others (5, 6, 7). This avoids a "single dial" of repugnance.  
  - **Split threshold:** Explicitly tested in Node 3 (adding +10 life) vs. Node 2 (worth-living judgment).  
  - **Chain node:** Node 10 forces transitivity breakdown (Leaf 7) if earlier steps are accepted but the conclusion is rejected.  
  - **Uncertainty node:** Node 9 distinguishes theories by how they handle risk.  
  - **Casual register:** For readability, welfare levels use integers (e.g., +100 = "very happy"), and comparisons avoid jargon.  

