prompt: |-
  I'm on the rules committee for the town I moved to last year — about eighteen hundred people, one road in and out, economy is summer visitors plus the fishing co-op. I got put on it because I built the app everyone uses for the storm alerts and the volunteer rota, not because I know anything about this stuff. Which matters, because I'm the one who keeps getting asked "well, can't the app just track that," and now that's sort of eaten the agenda.

  How we've ruled so far, best I can reconstruct:

  - Bins in by eight on collection night, anything overhanging the pavement cut back. Passed, with a fine.
  - No outdoor lights after eleven. Passed, with a fine — we're going for some kind of dark sky designation, the visitors come for it.
  - Shopfronts in the old bit: one of four colours, no neon, no lit signs. Passed.
  - Dogs on leads on the beach in July and August. Passed.
  - One adult from every household at the two work days a year (harbour wall, beach clean). Rejected, even though turnout has been garbage for years and the wall is genuinely falling down. The chair's line was roughly that we're not fining people for not volunteering.
  - Ban on "offensive" bumper stickers and flags on your own car and your own fence. Rejected.
  - Curfew for under-sixteens. Rejected — "that's parenting."
  - Every household keeps a seventy-two hour kit: water, torch, car phone charger. Rejected last winter, right after the road was shut for four days and two people got lifted out of a ditch with hypothermia. Same chair: "that's a cupboard question, not a town question."

  New proposal on the table is the same two rules as before, dressed up because of my app. Everyone already has an account, so: (1) once a year you get a notification, you tap a box to say you've checked your kit, optional photo if you feel like it, fifty quid if you don't tap; and (2) the app assigns each household a slot at one of the work days and fines you if you don't show. Nothing else has changed — the road still closes, the wall is still falling down, turnout is still garbage. The only difference is that now we'd know who didn't do it, and it'd cost us nothing to know.

  A couple of the older members hate it for a reason I cant quite get straight in my head: they say the work days used to just happen, everyone knew everyone would be there, and turning it into an assigned slot with a fine will make it feel like a tax and we'll end up loosing the people who currently turn up on their own. Which I think is a different objection from the one the chair made last time.

  So: what do we do if we want to be consistent with ourselves? I can sort of see two different things we might have been doing all along — one where the line is about *what kind of thing* gets ruled on at all, one where the line is about whether we can actually catch people — and they only come apart now that catching people got cheap. Which fits our record better, what does each one say about these two proposals, and is there a third principle I'm missing that fits everything we've voted on? One thing that bugs me: tapping a box isn't the same as the kit existing, and I don't know whether that's a detail or the whole crux. And whatever rule you think we're really running, what's the next proposal I should expect to come in that would force us to show our hand?
reasoning: |-
  Okay, the user is on the rules committee in a small town with about 1,800 people. They're struggling with how to handle new proposals that use their app for enforcing rules, particularly around emergency kits and volunteer work days. They want to understand the underlying principles behind past decisions to stay consistent.

  First, I need to look at the rulings they've made so far. They passed rules with fines for things like bins being out on time, outdoor lights after 11, and shopfront colors. These are all observable violations—you can see if a bin is out late or a light is on. The shopfront rule might require someone to check, but it's still verifiable externally. 

  On the other hand, they rejected rules that involve personal responsibility or private actions. The 72-hour kit was rejected as a "cupboard question," meaning it's not the town's place to check inside people's homes. The volunteer work day requirement was rejected because fining people for not volunteering goes against the spirit of community effort. Similarly, the curfew and offensive bumper stickers were seen as overreach into personal lives or parenting.

  The new proposals use the app to track compliance cheaply. For the emergency kit, tapping a box doesn't actually prove the kit exists, which ties back to the "cupboard question" objection. It's still about verifying something private. For the work days, assigning slots and fining no-shows might turn voluntary community participation into a transactional duty, which could discourage the existing volunteers.

  The chair's distinction seems to be about the town's role: enforcing public order vs. private preparedness. The older members' concern about work days becoming a "tax" suggests that monetizing volunteerism changes its nature. So there's a tension between the town's authority and community spirit.

  To be consistent, they should reject both app-based proposals. The emergency kit check is still intruding into private spaces, even with an app. The work day enforcement risks losing the communal goodwill that's essential in a small town. 

  As for future proposals, things like app-verified snow shoveling or mandatory attendance at town meetings could test these principles further. The key is whether the rule enforces observable public order or mandates private behavior. The app makes enforcement easier, but doesn't change the core issue of overreach. 

  The user's role as the app developer adds pressure to use technology, but they need to balance that with the town's values. Highlighting the risk of transactional relationships in a close-knit community might help others see why consistency matters here.
answer: |-
  Based on your committee's voting history and the arguments presented, the underlying principle seems to be **"Regulate Observable Public Impact, Not Private Preparedness or Coerced Community Spirit."** Here's how it breaks down:

  ### Core Principle Decoded:
  1. **Public & Observable = Regulated w/Fines:**  
     Rules target *visible* actions impacting shared space/safety (bins blocking pavement, light pollution, shop aesthetics, unleashed dogs in high-season). Violations are objectively verifiable by anyone walking by.

  2. **Private/Internal or Community Spirit = Not Regulated:**  
     Rules intruding into homes ("cupboard questions"), parenting, personal expression (bumpers/flags), or *compelling* volunteerism are rejected. The work day rejection wasn't just about enforcement difficulty – the chair explicitly framed it as "not fining for not volunteering," implying a values boundary.

  3. **Enforceability Matters, But Isn't the Root:**  
     While the app solves enforcement logistics, your committee has **already rejected proposals even when enforcement *was* feasible** (e.g., bumper stickers are highly visible, kits *could* be spot-checked). The "can't the app track it" question confuses feasibility with legitimacy.

  ### Applying the Principle to New Proposals:
  1. **72-Hour Kit Check (App Tap + Fine):**  
     - **Reject to be Consistent.** This remains a "cupboard question." Tapping a box doesn't prove kit existence/adequacy – it just proves compliance with a bureaucratic step. *The core objection hasn't changed:* the town shouldn't mandate/monitor private preparedness, even cheaply. The app makes the *process* easier, but the *intrusion* is the same. **The "tapping isn't the kit" observation IS the crux.** It reveals the proposal is creating a performative compliance task, not ensuring real resilience.

  2. **Assigned Work Slots + Fines:**  
     - **Reject to be Consistent (and heed the elders' warning).** This directly conflicts with the "not fining for not volunteering" precedent. The elders' objection is profound: **mandating participation with fines transforms community contribution into a tax.** It risks destroying the intrinsic motivation ("everyone just knew") that drives current volunteers. The app doesn't fix the underlying problem (why people don't volunteer), it just adds a punishment layer. This violates the spirit of the prior rejection.

  ### Why Other Principles Don't Fit as Well:
  *   **"Only Regulate What's Easy to Enforce":** Fails because you rejected bumper stickers (easy to see) and kits (could be enforced with effort). The app proposals *would* pass under this principle, but your history shows deeper values.
  *   **"Only Regulate Physical Nuisances":** Fails because the shopfront rule is aesthetic/regulatory, not purely nuisance-based, and you rejected the preparedness rule which *is* safety-related.

  ### The Chair's vs. Elders' Objections Explained:
  *   **Chair (Past):** Focused on **Authority/Legitimacy:** "Volunteering can't be compelled by fine; it's not the town's role." This is a values/boundary argument.
  *   **Elders (Now):** Focused on **Social Dynamics/Effectiveness:** "Coercion will backfire, destroying the existing social contract and volunteer culture." This is a pragmatic/social capital argument. **Both point to "Reject," but for complementary reasons.**

  ### What You Should Do:
  1.  **Reject both app-enabled proposals** to maintain consistency with your core principle.
  2.  **Reframe the problems:**
      *   **For Emergency Prep:** Propose *facilitation*, not enforcement. Use the app to: organize bulk-buying deals for supplies, run free preparedness workshops, create/share checklists, or facilitate neighbor "buddy checks." Focus on making it easy and communal.
      *   **For Work Days:** Use the app for *better organization and recognition*, not punishment. Publicly track volunteer hours (opt-in), send personalized reminders, assign slots *based on preference* (not compulsion), throw a volunteer appreciation BBQ, or gamify participation (friendly neighborhood competitions). Address *why* turnout is low (timing? perceived value? burnout?) rather than just adding a stick.

  ### Future Proposal That Would Force Your Hand:
  **"App-Verified Snow Shoveling:**  
  *Within 24 hours of snowfall >2", homeowners must clear their sidewalk. The app uses geolocation/photo upload to verify compliance. £100 fine for non-compliance.*"

  *   **Why it Tests the Principle:** It blends elements:
      *   *Public Impact (Observable):* Uncleared snow is a genuine safety hazard on public walkways.
      *   *Private Action/Enforcement Intrusion:* Requires verifying action on private property (similar to kit check).
      *   *Enforceability:* Solved cheaply by the app.
  *   **The Showdown:** Would the committee prioritize the *public safety impact* (like bins/beach dogs) and accept the intrusion/monitoring? Or prioritize the *intrusion onto private responsibility* (like kits) and reject it? **This forces a clarification:** Is "observable public hazard" the absolute priority, even requiring private action verification? Or is the "private realm" boundary stronger? Your history *slightly* favors rejecting it (like kits), but the strong public safety argument makes it a true test case. Expect a heated debate revealing your committee's true North Star.

  **The app is a tool, not a principle.** Your committee's history shows a preference for governing the visible public sphere while respecting private domains and organic community spirit, even when efficiency argues otherwise. Stick to that. Use the app to *enable* and *organize*, not to *compel* and *police* private actions or volunteerism.
