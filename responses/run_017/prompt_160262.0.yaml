  I should assess if the recency norm requires a progress claim. Maybe recency acts as a proxy for relevance, not truth. But why prioritize recent works then? Perhaps because they map the current dialectical landscape better. The field might see progress as refining arguments, uncovering new implications, or better mapping conceptual terrain. But if nothing is settled, is it progress or just shifting perspectives?

  Next, the tension between novelty and unsettled theses. Novelty could mean new angles on perennial problems, not new solutions. If the space of positions is constantly remapped, each contribution adds a layer, hence originality is possible without cumulative truths. 

  The history/contemporary split: history explores context, contemporary applies frameworks. Without progress, does this split hold? Maybe, if history is about understanding past thought, contemporary about current debates. But if old arguments aren't superseded, why separate them? The split might be pragmatic, not philosophical.

  If the field abandoned progress assumptions, what changes? Recency norms might relax; engagement could focus on relevance, not publication date. Outdatedness might mean ignoring key arguments, regardless of era. Originality could be redefined as novel connections or syntheses, not new positions. The history/contemporary split might blur, leading to more integrative work.

  Are novelty and unsettled theses in tension? Only if novelty implies surpassing old work. If progress is cartographic, new work adds detail or perspective, so tension dissolves. The user's model fits: progress as better mapping, not convergence. 

  Concrete changes: referees might accept engagement with foundational texts if relevant. Training could emphasize problem-solving over recent literature. Original contributions might include reinterpretations. History and contemporary could merge in some contexts. 

  I should also consider unspoken needs. The user might feel frustrated with arbitrary recency demands, seeking validation that their classic-focused approach is legitimate. They might want arguments to challenge referees or reconceptualize their work. Deeper need: understanding their field's epistemology to navigate it effectively.
answer: |-
  Your analysis is sharp, and the "cartographic/dialectical" model is a strong starting point. Let's reconstruct the implicit theory of philosophical progress underpinning these practices, address the tensions, and explore the consequences of abandoning the progress assumption.

  **The Implicit Theory of Progress: Refinement, Recontextualization, and Dialectical Depth**

  The core view isn't cumulative *truth acquisition* (like physics) but **progress in *dialectical sophistication*, *conceptual refinement*, and *contextual awareness*.** Think of it as:

  1.  **Expanding & Refining the Conceptual Map:** Philosophers don't disprove positions like scientific theories; they expose hidden assumptions, uncover unforeseen implications, articulate objections with greater precision, develop novel distinctions, and reveal connections to other areas. The "space of possible positions" becomes increasingly detailed and complex. A 2020 paper isn't necessarily *truer* than a 1970 paper on the same classic, but it likely navigates a *more densely mapped terrain* of objections, counter-objections, distinctions, and relevant connections (e.g., to newer social theories, scientific findings, or adjacent philosophical debates).
  2.  **Shifting Contexts & Evolving Relevance:** The *salience* of problems, objections, and positions changes. New historical events, social movements, technological developments, or shifts in adjacent fields (economics, psychology, neuroscience) reframe old debates. What seemed like a minor objection in the 70s might become devastating in light of new knowledge or social realities. Conversely, a position dismissed earlier might gain new relevance. "Recent literature" represents the *current state of play* within this evolving context.
  3.  **Deepening Interpretation:** Engaging with classic texts isn't just about their "arguments" in a vacuum; it's about interpreting them with increasing subtlety, understanding their historical context more fully, and seeing how they resonate (or clash) with contemporary concerns. History of Philosophy contributes to this ongoing interpretive and conceptual refinement. A "new" reading of Plato or Kant *is* an original contribution precisely because it reveals previously unnoticed nuances or connections relevant to current debates.
  4.  **Progress as Increased Demands:** As the dialectical map becomes richer and the context evolves, the *burden* on any new argument increases. A paper reviving a 30-year-old view must now address the objections and refinements developed *since* it was last prominent. Ignoring recent literature suggests the author hasn't engaged with the current, more sophisticated level of discussion. Referees aren't saying "X was refuted in 2005," they're saying "You haven't engaged with the significant *responses to X and developments around X* since 2005, so your treatment is inadequate for the *current* dialectical stage."

  **Addressing Your Specific Questions:**

  1.  **Recency Norm & Progress Claim:**
      *   **Does it strictly require progress?** Yes, but progress defined as dialectical refinement/contextual shift, not truth convergence. Recency acts as a proxy for *relevance to the current state of the dialectic*. A 1970 paper *could* be dialectically sophisticated for its time, but the dialectic has moved on. The norm assumes that recent work inherently incorporates (or must grapple with) the accumulated refinements and contextual shifts.
      *   **Is it consistent with a "flat" view?** Only partially. A strict "flat" view (no change in sophistication, relevance, or demands) would undermine the recency norm. *Why* prioritize the last 20 years if a 50-year-old paper is just as relevant and sophisticated for today's debate? The practice assumes the dialectic *does* evolve, making older work potentially incomplete for current purposes unless explicitly updated.

  2.  **The 1970 vs. 2020 Paper:**
      *   A 1970 paper *could* be exceptionally insightful and address core issues brilliantly. However, the implicit theory suggests that a *well-executed* 2020 paper on the same topic *should* (ideally) demonstrate greater dialectical sophistication *because* it has the benefit of engaging with 50 years of subsequent refinement, objections, and contextual shifts. It stands on the shoulders of giants *and* the midgets who came after. The 1970 paper might be a foundational landmark, but the 2020 paper exists within a denser, more complex dialectical forest.

  3.  **Philosophical Underdetermination & the "No-Progress" View:**
      *   A strict "no-progress-at-all" view (no increase in sophistication, no relevant contextual shifts, no evolution of the dialectic) would significantly challenge the practice:
          *   **Recency Norm:** Collapses. There's no reason to privilege recent work.
          *   **Original Contribution Requirement:** Becomes harder to justify. If the dialectic isn't moving forward, what constitutes "originality"? Mere restatement? Only truly novel (and perhaps bizarre) positions?
          *   **History/Contemporary Split:** Would likely dissolve or change drastically. If old work isn't "superseded" *and* recent work isn't "more advanced," then the distinction based on era loses its primary justification. Work would be evaluated purely on its inherent philosophical merit and relevance to the specific question, regardless of when it was written. History of Phil might focus *only* on purely historical understanding, not "live" relevance.
          *   **"Outdated" Critique:** Couldn't meaningfully exist. A paper would be wrong, confused, or irrelevant to the specific question, but not "outdated" because there's no temporal dimension to the dialectic's sophistication.

  4.  **Consequences of Abandoning the Progress Assumption:**
      If the field explicitly adopted a strict "no dialectical progress/refinement" view:
      *   **Refereeing:** "Fails to engage recent literature" would vanish as a reason for rejection/revision. Critiques would focus solely on internal logic, misinterpretation of sources (old or new), or failure to address core arguments regardless of vintage. "Outdated" would disappear from reviewer vocabulary. Engagement with *any* relevant work (classic or recent) would suffice.
      *   **Grad Training:** Emphasis would shift dramatically. Comprehensive exams might focus less on "current debates" and more on mastering core texts and problems *per se*. Dissertation "originality" would need redefinition – perhaps focusing on novel syntheses of existing ideas, unique interpretive lenses, or application to entirely new problems, rather than advancing a dialectic. The pressure to constantly cite the very latest articles would ease.
      *   **History/Contemporary Split:** Would likely blur significantly. Scholars would feel freer to draw directly on historical figures to address contemporary problems without *necessarily* filtering it through the last 20 years of secondary literature. Historians might more explicitly argue for the direct contemporary relevance of their interpretations. The institutional separation might remain, but the intellectual firewall would weaken.
      *   **"Background" Status:** Old work might lose its privileged "foundational" status. If there's no progress, Aristotle isn't a "stage" we've moved beyond; he's just another voice in an eternal conversation, potentially as relevant as yesterday's blog post (if well-argued).

  5.  **Tension between Novelty and "Nothing Settled"?**
      *   **The Tension Exists:** Superficially, yes. Demanding novelty implies we move beyond the old, while saying nothing is settled implies the old remains perpetually viable.
      *   **Dissolved by the Dialectical Model:** The cartographic/dialectical model dissolves this tension. "Novelty" here means *contributing to the ongoing refinement of the map*: identifying a new path, refining a known position to better weather recent objections, uncovering a hidden connection between areas, offering a significantly new interpretation that reshapes the debate, or applying an old framework to a new context created by societal change. "Nothing is settled" means no position is ever *finally refuted in a way that removes it permanently from the map*. The map keeps expanding and getting more detailed; novelty is adding to *that* map, not necessarily burying the old territories. Reviving an old view *is* novel *if* done in a way that engages the current, more complex dialectical landscape it now inhabits.

  **Conclusion:**

  The implicit theory is **Progress as Dialectical Enrichment and Contextual Recalibration**. Philosophy progresses not by settling questions through proof or disproof, but by deepening our understanding of the questions themselves, the complexity of possible answers, their costs, their interconnections, and their relevance to an evolving world. The recency norm enforces engagement with the *current state* of this enriched dialectic. The demand for originality is a demand to *add* to this enrichment – to refine, reinterpret, reconnect, or recontextualize. The history/contemporary split reflects a division of labor focused on the sources vs. the current frontiers of this ongoing dialectical project, both contributing to the enrichment. Abandoning this progress assumption wouldn't destroy philosophy, but it would fundamentally reshape its practices, making them look far less like a "field" with "current research" and more like an eternal, undifferentiated conversation across time. Your cartographic metaphor is apt: the field values recent maps because the territory (the dialectical landscape) is constantly being surveyed with better tools, revealing finer details and new features, even if the fundamental landmasses (the core problems and positions) remain recognizable.
