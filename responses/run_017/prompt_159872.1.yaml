prompt: |-
  I'm a PhD student in philosophy — my own stuff is on expertise and peer disagreement, so I only know the social epistemology side from the outside — and a friend in the political theory reading group has handed me an argument I cant get out of. He says the notion of testimonial injustice (Fricker-style: a credibility deficit that's down to identity prejudice) either collapses or proves too much. Here it is:

  (1) A speaker suffers testimonial injustice when she gets less credibility than she's due, and the deficit is caused by identity prejudice.
  (2) How much credibility a speaker is due is a function of how reliable she is — nothing else.
  (3) Reliability shows up in a track record: the hit rate of her assertions in the relevant domain, as recorded.
  (4) Whose assertions get recorded and checked depends on who has been taken seriously, and past credibility judgements have been infected by identity prejudice.
  (5) So where prejudice depressed someone's credibility, it also depressed her recorded record; a hearer who calibrates scrupulously to the record will give her less credibility than she's really due, and the shortfall traces back to prejudice. A postdoc in my dept calls these "inherited deficits" — deficits that come through the evidence base rather than through the hearer's own stereotyping.
  (6) By (1) that's a testimonial injustice even though nobody in the room is personally prejudiced; by (2) and (3) it isn't, because the hearer gave exactly what the evidence supported. So the account both requires and forbids the same credibility judgement.
  (7) Either "credibility due" has no determinate content — it depends on which baseline you pick, calibration to the available evidence versus what a prejudice-free hearer would have given — in which case the concept can't tell you anything in the cases it was built for, or else any reliance on track records and expertise counts as testimonial injustice, which is absurd: my supervisor isn't wronging anyone when he declines to take my word for the mass of the Higgs, and neither is a referee who rejects a sloppy paper.
  (8) So the framework is either empty or trivializing.

  I want to say he's wrong but I can't locate the step. My instinct is that (1), and the thought in (6) that the discount can still be a wronging when nobody present is prejudiced, are the bits worth keeping — that seemed to be the whole point of introducing the notion — and that (2) or (3) is the cheapest thing to give up. But that's just a hunch and I'd rather know what I'm paying. Which step do you reject, and what does rejecting it cost? In particular: if I keep (1) and the (6) thought, do I have to say that the credibility due to a speaker isn't fixed by her reliability at all — and if so, what does fix it, and does that commit me to the (7) claim that my supervisor is committing an injustice? Is the calibration-baseline / counterfactual-baseline distinction doing any real work here, or is it just relabelling the problem? And is there a version of the account that handles inherited deficits without having to say the hearer's own attitudes are prejudiced?

  (Also if you think the argument is fine and the conclusion is true, say that — I'd rather know than be comforted.)
reasoning: |-
  Okay, this is a fascinating and intricate problem from a PhD student in philosophy. They're grappling with a critique of Miranda Fricker's concept of testimonial injustice, specifically around how historical prejudice creates "inherited deficits" in credibility. Their friend argues this leads to a contradiction: either testimonial injustice becomes ubiquitous (trivializing) or undefined (empty). 

  Hmm. The user's clearly done their homework—they've broken down the argument into numbered premises and identified the tension precisely. I appreciate how they've flagged their own instincts (wanting to preserve Fricker's core insight about structural wrongs) while remaining open to counterarguments. That's rigorous scholarship. Their anxiety about "what it costs" to reject certain premises is telling—they don't want easy answers but a coherent theoretical price tag.

  Let me reconstruct the critique's core: It claims that *current* credibility assessments based on "objective" track records inherit *past* prejudices (premise 4-5), forcing hearers into a dilemma. If they follow the evidence (premise 2-3), they perpetuate injustice; if they don't, they're irrational. Premise 7 then declares this collapses Fricker's account.

  *Where to push back?* 
  - Premise 2 feels reductionist. Fricker never reduces credibility *due* purely to reliability—it's also about *recognizing* reliability through non-prejudiced lenses. Credibility is fundamentally relational.
  - Premise 3's "track record" requirement is empirically dubious. We constantly assess speakers without access to hit rates—especially marginalized experts whose contributions were historically erased. 
  - Premise 5's "inherited deficit" is real, but it doesn't follow that *present* hearers are blameless. Their reliance on corrupted evidence might itself reflect a culpable ignorance (did they interrogate *why* certain voices are missing?).

  The user's instinct to question premise 2 is sharp. If credibility due isn't *just* reliability but also includes a hearer's epistemic responsibility to correct for systemic distortions, then the supervisor case (premise 7) isn't problematic—they *are* responsible for recognizing how disciplinary canons exclude certain voices. But yes, that *does* imply referees rejecting work from underrepresented scholars could be complicit if they uncritically use exclusionary standards. That's not absurd; it's exactly what critical race theorists or feminist epistemologists argue. The cost is rejecting naive objectivism about evidence.

  *Structural solution:* Distinguish first-order reliability (speaker's actual competence) from second-order credibility assessment (hearer's duty to counteract bias in evidence-gathering). The hearer isn't prejudiced *in intent* (premise 6) but may be negligent in *method*. This preserves Fricker's core without requiring mind-reading of "true reliability."
answer: |-
  Your friend's argument is clever but flawed—it misrepresents Fricker's framework and overplays the epistemic role of track records. I reject **premise (2)** as a distortion of testimonial injustice, and **premise (3)** as empirically implausible. Here's why, what it costs, and how to preserve Fricker's core insight without absurdity:

  ### The Core Problem: Premise (2) Misunderstands "Credibility Due"
  Fricker **never claims credibility due is *solely* a function of reliability**. For her, credibility due is **epistemically normative and socially situated**:  
  - It requires *recognizing* a speaker's reliability *fairly*—which demands sensitivity to how systemic prejudice distorts perception (e.g., §2.3, *Epistemic Injustice*).  
  - Reliability isn't a raw statistical fact; it's mediated by social conditions. If prejudice blocks someone from *demonstrating* reliability (e.g., by denying them opportunities to speak), their "due" credibility isn't reduced—it's *unfairly obscured*.  

  **Cost of rejecting (2):** You must accept that credibility judgements are *not* purely evidence-driven. They involve:  
  1. **Epistemic responsibility**: Hearers must critically examine whether evidence (e.g., track records) is corrupted by prejudice.  
  2. **Counterfactual reliability**: What *would* the speaker's reliability be in non-prejudiced conditions?  

  This *doesn't* commit you to absurdity (e.g., your supervisor wronging you). Your supervisor isn't discounting you due to prejudice—they're responding to your actual novice status in physics. The injustice arises only when prejudice, not evidence, drives the deficit.

  ### Premise (3) Fails: Track Records Are Neither Necessary Nor Sufficient
  - **Not necessary**: We constantly assess credibility without track records (e.g., trusting a stranger giving directions). Fricker focuses on *immediate* credibility judgements shaped by prejudice (e.g., assuming a woman is irrational before she speaks).  
  - **Not sufficient**: As your friend notes (premise 4), track records reflect *who was allowed to contribute*. A low hit rate for marginalized groups may stem from exclusion, not incompetence.  

  **Cost of rejecting (3):** You deny that credibility is reducible to recorded performance. This aligns with virtue epistemology: a virtuous hearer compensates for corrupted evidence by considering structural barriers.

  ---

  ### Solving the "Inherited Deficit" Problem
  You *can* keep (1) and the (6) intuition (prejudice's structural effects matter) without contradiction:  
  - **The hearer *is* responsible**: Even if they aren't personally prejudiced, they may exhibit **prejudicial negligence** by uncritically relying on corrupted evidence. Fricker's hearer isn't just a passive evidence-processor—they have a duty to mitigate systemic distortions.  
  - **Baseline distinction**: The "credibility due" baseline isn't arbitrary. It's:  
    - **Actual reliability**: What the speaker *would* achieve in fair conditions.  
    - **Hearer's obligation**: To approximate this by correcting for known biases (e.g., "This journal's authors are 90% men; I'll scrutinize citations to ensure women's work isn't overlooked").  

  Your supervisor *isn't* committing injustice because:  
  - Physics track records (e.g., Higgs mass measurements) aren't *systematically* distorted by identity prejudice.  
  - The burden to correct evidence applies only when prejudice is a *known* factor (e.g., ignoring a Black philosopher because "few are cited in top journals").

  ---

  ### Why the Argument Doesn't Sink Fricker
  - **Premise (7) is a false dilemma**: "Credibility due" *is* determinate: it's the reliability a speaker possesses *minus distortions from prejudice*. Your referee example fails—rejecting a sloppy paper isn't testimonial injustice unless sloppiness is *presumed* due to identity.  
  - **Structural wrongs require structural remedies**: Fricker's point is that *individual* non-prejudice isn't enough. Hearers must actively counter historical biases—e.g., a journal editor prioritizing submissions from marginalized groups to correct past exclusion.  

  ### Final Verdict
  Reject **premises (2) and (3)**. This preserves Fricker's core:  
  - Testimonial injustice occurs when prejudice (past or present) causes a credibility deficit.  
  - "Inherited deficits" *are* injustices—but they implicate *current* hearers who fail to rectify corrupted evidence.  

  **What you gain**: A robust account of structural epistemic injustice.  
  **What you pay**: Abandoning the myth of "objective" track records. Credibility judgements must be hermeneutically vigilant—especially in domains where prejudice is documented. Your supervisor isn't off the hook if they dismiss a woman's philosophy paper while uncritically citing all-male syllabi. But that's not absurd; it's critical epistemology.

  *Recommended reading: Medina's "The Epistemology of Resistance" (2012) on "killer contexts" for inherited deficits, and Dotson's "Conceptualizing Epistemic Oppression" (2014) on how Fricker's framework handles structural cases.*
