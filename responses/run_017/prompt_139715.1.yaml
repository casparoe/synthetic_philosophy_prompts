prompt: |-
  ok so context: in astronomy we did the fermi paradox last week — like, the galaxy is ancient and enormous, there should have been heaps of civilisations by now, but we look out and there's nothing. no signals, no megastructures, no probes, nothing. my group had to come up with our own answer and we came up with this: civilisations don't get wiped out or get "filtered" or blow themselves up, they just eventually build a perfect simulation, plug into it, and stop doing anything you could ever see from outside. no more radio leaking into space, no more giant engineering projects, everyone just... goes indoors. teacher said it's basically a known idea but we got there ourselves and he liked it.

  the problem is im not sure it actually works. someone in the next group pointed out that even if most civilisations log in, if even ONE of them doesn't, and keeps expanding and broadcasting, we'd probably still notice them — because the galaxy is old enough that even at something like 1% of the speed of light you could cross it in a couple of million years, which is basically nothing compared to billions. so for our idea to explain the silence, it has to be *everyone*. every single time. which seems like a lot to ask.

  anyway english and astronomy are doing a joint thing and i want to write a satire for it, in the style of that Swift essay we read (A Modest Proposal — the one where he's completely deadpan about something awful and treats it as just sensible policy). straight faced the whole way.

  what i want: an in-universe official document from a galaxy where my group's theory is true. best form i can think of is a public information FAQ / leaflet with maybe 6–8 numbered Q&A entries, put out by whatever bureau administers the Silence, addressed to newly technological planets, explaining the rules about going quiet and how to comply. so it's all paperwork about the *absence* of aliens — ideally no alien actually turns up in it.

  the awful part should fall out of that universality problem: the bureau cannot afford a single holdout, so its enforcement gets more and more insane the further down the document you go — the last radio station still transmitting in the whole galaxy, the one stubborn colony that insists on building big telescopes pointed at things, the hermit-civilisation exemption, whatever you think is funnier. i want someone who actually knows this debate to read it and think "yep, that's the real objection to this kind of answer" without me or anyone in the document ever saying so out loud. so please get the actual reasoning right inside the jokes: the timescale thing (a few million years to cross the galaxy vs billions available), the inverse-square stuff about why our early TV broadcasts fade into nothing after a few dozen light years, why we'd expect to *see* waste heat from a civilisation using a whole star's worth of energy, why "maybe they just don't want to talk to us" needs everyone to agree to it. nobody in it should wink at the reader.

  about 600 words, give it a boring official title, voice is calm bureaucratic officialese. it should still be funny to someone in my class who hasn't done the unit.

  don't make it about any real person, invented officials only.

  after the piece, give me a json object (not a table) with exactly these fields:

  - "title": the document's title
  - "form": one line on what kind of document it is
  - "target": one sentence on which move in the fermi paradox debate is being sent up
  - "real_point_exploited": one sentence on which actual feature of that move is being exaggerated rather than invented
  - "entries": an array with one object per Q&A entry, each object having:
    - "entry_number": the number of the entry
    - "joke": one line on what the joke in it is
    - "actual_logic": one line on the real astronomy, timescale, or reasoning point it leans on
    - "fair_hit": "yes", "partly", or "no" — whether someone who actually holds the view being mocked would admit that consequence is a real cost of their view
    - "note": anything you'd change if you were me handing it in
  - "weakest_joint": the spot where the satire is cheapest, i.e. where someone could say the view doesn't really have that consequence
  - "word_count": number

  pls no reading lists or links or citations, i have to hand this in as a single document and my teacher marks it down if we paste sources in.
