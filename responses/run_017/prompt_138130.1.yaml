prompt: |-
  I'm a third-year undergraduate in a seminar on philosophy of language and pragmatics, and I've been asked to lead one session of it myself. The group is 14 students plus me; I have a 75-minute slot in a room with movable chairs, a whiteboard and a projector I'd rather not use. I can bring index cards, pens, sticky notes and a printed handout. No money, no phones, no software, and nothing that needs rehearsal time beforehand.

  The last two weeks have been Grice: the Cooperative Principle, the maxims, what is said versus what is implicated, conversational versus conventional implicature, generalized versus particularized implicature, and the standard tests of cancellability, non-detachability and calculability. My classmates can recite all of it and can apply the labels to the textbook examples. What they cannot feel, and what I want the session to give them, is this:

  1. That the extra content is inferred, not decoded. The hearer runs an argument from the words plus assumptions about the speaker and the point of the exchange, and that argument can be written down in three or four lines. If you cannot reconstruct it, you do not have an implicature.
  2. That what is implicated is not part of what is said, and that this is a resource rather than a curiosity. A speaker can be held to the literal content while disavowing the rest, which is why speakers can mislead without saying anything false, and why auditing only for literal truth never closes that gap.
  3. That the same sentence implicates different things when the shared purpose of the exchange changes, and stops implicating altogether when the hearer stops assuming the speaker is cooperating. I would like at least one round in which the speaker's and the hearer's interests diverge and the inference visibly breaks, so they see that cooperation is doing real work rather than decorating it.
  4. That trying to cancel an implicature in so many words tends not to make it go away, so cancellability is a logical property of the content and not a social escape hatch.

  Two design constraints. First, I do not want to explain any of this: no more than about five minutes of framing from me at the top, no vocabulary on the board until the debrief, and the distinctions should be things participants collide with because of the rules, the roles or the scoring, not things I announce. Second, the activity should run on ordinary language only, with a scenario any student can enter in ten seconds, and with small, legible stakes such as points, chips or a bracket on the board rather than money.

  The staging devices I keep coming back to, and which you should feel free to replace with something better, are: asymmetric information between a speaker and a hearer who share a goal; a transcript-only role in which a third participant sees the sentence but not the context and rules only on whether anything literally false was said; and a rule giving the speaker a bonus for keeping deniability while still getting the hearer to act correctly. Please also propose what happens when the speaker is allowed to add one explicit cancelling clause and what it costs them, since I suspect that is where point 4 becomes visible.

  Please give me the design in the following sections, with roughly these lengths:

  1. Setup and materials — about 100 words, including the verbatim text of any cards, slips or handout lines I would need to prepare.
  2. Rules, roles and scoring — about 400 words: who does what, what counts as success for each role, and a payoff scheme in points with the numbers justified.
  3. Timeline — about 200 words, with minute marks across the 75 minutes, including setup, each round and the transition into discussion.
  4. How each round maps onto the distinctions — about 200 words, naming which of my four targets each round is engineered to produce and by which rule.
  5. Debrief questions — about 300 words: the actual questions to put to the group, in the order that lets them name the machinery themselves, with the follow-up I should use if the first answer is shallow.
  6. Predictable failure modes — about 250 words: what will go wrong the first time I run this, including the most likely way participants game the scoring, and how to handle each.
  7. What the game cannot do — about 150 words: the feature of the view the activity cannot reproduce and that I will have to supply in about five minutes of straight explanation at the end, with a note on what to say and what to leave for the next class.
reasoning: |-
  Hmm, the user is a third-year philosophy undergraduate preparing to lead a seminar on Gricean pragmatics. They need an activity that makes abstract concepts like implicature tangible without lectures. The class already knows the terminology but struggles with the underlying mechanics—how implicature arises from inference, its distinction from what is said, context-dependence, and the limitations of cancellation.

  Key goals are:
  1. Make inference visible (students should reconstruct the reasoning)
  2. Demonstrate that implicature ≠ said content (showing literal truth vs. misleading implications)
  3. Show context-dependence (how shared purpose changes implicature)
  4. Expose cancellability as logical, not social (failed cancellations reveal this)

  Constraints: Minimal framing (<5 mins), no tech, ordinary language scenarios, legible stakes (points/chips), no prep-heavy materials. The user suggested asymmetric information games with a "literal truth auditor" role—this is solid, so I'll build on that.

  For the activity, I'll design a game with three roles: Speaker (has hidden info), Hearer (acts on info), Auditor (checks literal truth). I'll use index cards for scenarios and scoring chips to create stakes. The core mechanic involves the Speaker trying to get the Hearer to guess a number while avoiding lies but also being able to mislead for points. The Auditor ensures only literal truth matters.

  Rounds will vary cooperation: 
  - Round 1: Shared goal (baseline implicature) 
  - Round 2: Conflicting interests (implicature breaks) 
  - Round 3: Attempted cancellation (shows it often fails socially)

  Debrief questions will guide students to articulate the inferences, notice when implicature collapsed, and realize cancellation only works logically. Predictable issues: Students might over-literalize as Hearer or Speaker might blurt out the number. Mitigation: Penalize explicit statements and reward successful misleading.

  What the game can't cover: Conventional vs. conversational implicature and calculability tests. I'll note these for a mini-lecture at the end. The handout will reinforce distinctions post-activity.

  Materials needed: Index cards with scenarios (e.g., "The code is between 1-10"), chips for scoring, roles on slips. Minimal setup—just move chairs into trios.
answer: |-
  Here’s a complete seminar design centered on **"The Deniability Game"**, engineered to meet your goals through experiential learning:

  ---

  ### 1. Setup and Materials (95 words)  
  - **Handout** (1 per student):  
    > *"Speaker’s goal: Get Hearer to guess the secret number (1–10).  
    > Hearer’s goal: Guess the number.  
    > Auditor’s goal: Catch literal falsehoods.  
    > Rules: Speaker must say ONE sentence. No numbers, no gestures.  
    > Scoring: Speaker: +5 if Hearer guesses right, –5 if caught lying, +3 if Hearer guesses wrong but sentence was literally true. Hearer: +5 for correct guess. Auditor: +5 per caught lie."*  
  - **Role slips** (5x "Speaker", 5x "Hearer", 5x "Auditor" – reshuffled each round).  
  - **Secret number cards** (e.g., "SECRET: 4", for Speakers).  
  - **Sticky notes** for guesses, **pens**, **whiteboard** for scores.  

  ---

  ### 2. Rules, Roles, and Scoring (390 words)  
  - **Trios**: Each round has 1 Speaker, 1 Hearer, 1 Auditor.  
  - **Speaker**: Receives a secret number (1–10). Says *one sentence* to hint at it. Earns:  
    - +5 if Hearer guesses correctly.  
    - +3 if Hearer guesses *wrong* but Auditor confirms no literal falsehood (deniability bonus).  
    - –5 if Auditor catches a lie.  
  - **Hearer**: Writes guess on sticky note after hearing Speaker. +5 if correct.  
  - **Auditor**: Sees secret number *after* Speaker’s sentence. Rules *only* on literal truth. +5 per upheld lie accusation.  
  - **Key twist**:  
    - **Round 1**: Shared goal (Speaker wants Hearer to win).  
    - **Round 2**: Conflicting goals (Speaker gets +3 for Hearer’s *wrong* guess + deniability).  
    - **Round 3**: Speaker may add *one clause* (e.g., "...but I’m not telling you the number") but loses deniability bonus if used.  
  - **Scoring justification**: High stakes for Speaker (+5 truth vs. +3 deception) incentivize implicature-based hints. Auditor’s payoff ensures rigor. Deniability bonus mirrors real-world "misleading without lying".  

  ---

  ### 3. Timeline (75 min total, 195 words)  
  - **0:00–5:00**: Frame + distribute roles/handouts. *"Today we simulate communication. Roles and goals are asymmetric. Play to win."*  
  - **5:00–20:00**: **Round 1** (cooperative). Speakers get numbers, trios discuss (no eavesdropping). Speaker speaks → Hearer guesses → Auditor judges. Report scores.  
  - **20:00–35:00**: **Round 2** (conflicting). Reassign roles. Repeat, but Speakers now rewarded for *misleading*.  
  - **35:00–50:00**: **Round 3** (cancellation). Speakers may add one clause (e.g., "I’m not hinting at anything"). Deniability bonus void if used.  
  - **50:00–65:00**: **Debrief** (questions below).  
  - **65:00–75:00**: **Synthesis** (mini-lecture on what the game *can’t* show).  

  ---

  ### 4. How Rounds Map to Distinctions (195 words)  
  - **Round 1 (Cooperation)**: Targets #1 (inference) and #2 (said vs. implicated). Students *see* Hearers reconstruct arguments (e.g., "Speaker said ‘It’s even’ → only 4 and 8 possible → but they’re cooperating, so likely 4"). Auditor’s literal-only focus highlights #2.  
  - **Round 2 (Conflict)**: Targets #3 (context-dependence). When Speakers aim to mislead ("It’s less than 5" for secret=4), Hearers *stop inferring* correctly. Shows cooperation’s necessity.  
  - **Round 3 (Cancellation)**: Targets #4. Adding "but don’t take this as a hint" rarely stops inference (Hearers ignore it). Speakers lose bonus, proving cancellation is logical, not social.  

  ---

  ### 5. Debrief Questions (290 words)  
  Start concrete → abstract:  
  1. **"Hearers: What did you *do* with the Speaker’s words in Round 1? Write down the steps."**  
     *[If shallow: "Did you assume the Speaker was helping? What if you hadn’t?"]*  
  2. **"Auditors: When did you *want* to penalize a Speaker but couldn’t? Why?"**  
     *[Follow-up: "Could the Speaker deny they implied what you inferred?"]*  
  3. **"Speakers in Round 2: How did your strategy change? What happened when Hearers trusted you less?"**  
     *[Probe: "Did your words *mean* something different when your goal changed?"]*  
  4. **"In Round 3, why did adding ‘but I’m not hinting’ fail? Did it *feel* like cheating?"**  
     *[Push: "If the sentence is true, why can’t the Speaker cancel the hint?"]*  
  5. **"When did literal truth protect the Speaker? When did it hurt the Hearer?"**  
     *[Goal: Elicit "deniability as resource" (#2) and "inference fragility" (#3).]*  

  ---

  ### 6. Predictable Failure Modes (250 words)  
  - **Speaker over-literalizes**: e.g., "It’s a number" (no implicature). *Mitigate*: Penalize with –5 if Hearer can’t guess (add rule: "Auditor can veto non-informative sentences").  
  - **Hearer ignores context**: Guesses randomly in Round 2. *Mitigate*: Announce "Hearers lose 2 points if guess is outside logically possible set" to force engagement.  
  - **Auditor too lenient/strict**: Skews scores. *Mitigate*: Have trios argue borderline cases aloud pre-ruling; award Auditor +2 for consensus.  
  - **Cancellation clause abused**: Speaker says "It’s 4, but I’m not hinting". *Mitigate*: Void deniability bonus *and* dock 2 points for explicit content.  
  - **Group size hiccup**: 15 students = 5 trios. If attendance varies, make one group a quartet (2 Hearers).  

  ---

  ### 7. What the Game Cannot Do (150 words)  
  **Limitation**: The activity cannot show **conventional vs. conversational implicature** or **generalized implicature’s calculability**.  
  **Mini-Lecture Script** (5 min):  
  > *"Today showed how implicatures rely on inference and context. But some implicatures are ‘baked in’—like ‘but’ implying contrast. These are **conventional**, surviving even without cooperation. They fail cancellability tests (try: ‘She’s poor but honest—and no contrast is implied!’). Conversely, **generalized implicatures** (e.g., ‘some’ implying ‘not all’) are calculable but so common they feel automatic. Our game focused on **particularized** implicatures, where context does the work. Next week: why ‘some’ isn’t logically ‘not all’… and how grammar encodes convention."*  

  ---

  This design forces collision with Gricean concepts through gameplay, uses zero tech, and runs on everyday language. The scoring imbalances create natural "aha" moments while your debrief makes them explicit.
