  | (c) & (d)<br>Evidentialism vs. Reflective access to support. | Apparent | None | (c) says evidence fixes knowledge; (d) says reflection reveals what evidence supports. These complement: (d) explains *how* subjects access the knowledge (c) says is fixed. | — | — | — |
  | (b) & (f)<br>Knowing evidence vs. Introspective reliability. | Apparent | None | (f) is weaker than (b): general reliability (f) is consistent with (b)’s stronger claim of always being in a position to know evidence. (b) implies (f) for evidence-related mental states. | — | — | — |
  | (a) & (f)<br>Anti-luminosity vs. Introspective reliability. | Apparent | None | (a) denies luminosity (infallible access), not reliability. (f) claims reliability, not infallibility. Compatible: anti-luminosity permits mostly reliable introspection. | — | — | — |
  | (c) & (e)<br>Evidentialism vs. Amplified subject case. | Apparent | None | (c) is neutral on how evidence is accessed. (e) describes a mechanism (readout) enhancing access to evidence/support, consistent with (c)’s claim that evidence fixes knowledge. | — | — | — |
  | (d) & (e)<br>Reflective access vs. Amplified subject. | Apparent | None | (e) augments reflection with a readout; this may *implement* or enhance (d)’s reflective capacity without contradicting it. | — | — | — |
  | (e) & (f)<br>Amplified subject vs. Introspective reliability. | Apparent | None | (f) concerns unaided introspection; (e) concerns an augmented system. No clash: (e) may be seen as an extension of (f)’s reliability principle. | — | — | — |
  | (b) & (c)<br>Knowing evidence vs. Evidentialism. | Apparent | None | (b) ensures subjects can access what (c) says determines their knowledge. Synergistic: (b) facilitates the epistemic access (c) relies upon. | — | — | — |
  | (c) & (f)<br>Evidentialism vs. Introspective reliability. | Apparent | None | (f) supports (c) by ensuring subjects can often accurately discern their evidence (mental states), aiding evidentialist knowledge. | — | — | — |
  | (d) & (f)<br>Reflective access to support vs. Introspective reliability. | Apparent | None | (f) provides a foundation for (d): reliable introspection of evidence enables reliable reflection on support relations. | — | — | — |
  | (a) & (c)<br>Anti-luminosity vs. Evidentialism. | Apparent | None | (c) says evidence fixes knowledge; (a) says this knowledge (and iterated knowledge) isn’t luminous. No tension: evidentialism can accommodate margin-for-error constraints. | — | — | — |

  ### Single Most Impactful Revision
  **Revise (b) to "A subject is generally in a position to know what her own evidence is, barring marginal cases."** This resolves the most severe clash (with (a)), indirectly alleviates tension with (d), and preserves the core insights of evidentialism ((c)), reflective access ((d)), and the amplified subject case ((e)) while accommodating anti-luminosity. The cost is moderating the strength of self-evidence access claims, but this is consistent with (f)’s reliability framing.
