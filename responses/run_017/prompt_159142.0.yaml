  First, I need to understand the key distinctions they've drawn: open-loop vs closed-loop approval (grading based on information at time of action vs including consequences), and unmediated vs report-mediated approval (direct observation vs agent-provided reports). The claim focuses on a scenario where the AI is highly capable, operates in complex environments, and uses a learned approval model.

