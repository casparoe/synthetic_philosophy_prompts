answer: |-
  1. I reject step (6): that genuine disagreement requires incompatible attitudes toward one identical content, and successful communication requires recovering the very content expressed.  
  2. Step (6) looked compulsory because it mirrors intuitive ideals of precision in meaning, where equivocation or mismatch would seem to undermine mutual understanding or conflict.  
  3. Rejecting (6) commits me to externalist-friendly notions like near-enough content similarity or partial characterizations enabling functional disagreement and communication in practice.  
  4. Rejecting (2) instead—that fixing facts are always content-constituting—is worse, as it guts externalism by reducing it to a trivial causal-history theory, compatible with internalism about content itself.  
  5. The Shard case reinforces my rejection by exposing referential vagueness, but with (6) rejected, externalism handles it as a gradient of similarity, not a fatal indeterminacy.
