prompt: |-
  Next thursday I'm presenting at the monthly meeting of a pro-housing group in a expensive city — the room will be about 40 people, mostly supply-side types who work in tech, a half dozen tenant organizers who come to every one of these to argue, one land-use lawyer who does this for fun, and a city planner who has to be there. I've got 20 minutes and then questions. I'm going to argue something this room will hate, and I want to be ready.

  My thesis: the neighborhood veto is not just homeowners protecting asset prices, and the pro-housing movement is wrong to treat every instance of it as selfishness or astroturf. The core of it is legitimate — people whose daily life is staked in a place have a claim to a say over what happens to it, and that claim should scale with how much of their life is staked there, not with whether they hold the deed. On my version, long-term renters and small resident landlords in the neighborhood would have more of a say than absentee owners, and also more than the people who'd move into the new units. I call it stake-weighted say, and I want to argue that any "right to the city" worth wanting has to include something like it: the abundance agenda is right about how many units we need and wrong about who gets to decide.

  The argument in brief: (1) what people are actually protecting at a zoning hearing isn't mostly resale value, it's that their kid's school, their commute, their landlord, the corner store and their neighbours are all in one place and can't be picked up and moved; (2) that continuity is a large part of what makes a city worth living in at all; (3) the current institution attaches the say to ownership, so owners over-claim it and renters — who often have the most precarious stake — get none; (4) so the fix isn't to abolish the say, it's to detach it from the deed and reattach it to stake; (5) and yes, that means some people who would have moved in don't get to. That's a real cost of the view and I'm not going to pretend otherwise.

  What I need is the Q&A prep sheet, not a defense of the view. Please write it in these sections, in this order:

  - "Room read" (~100 words): what this particular audience cares about, what they believe about zoning that I don't, and what they'll hear my thesis as being — I suspect most of them will hear "he wants to keep the veto."
  - "The objections, worst-first" (~150 words each, 7 or 8 of them): ordered by how much damage they'd do rather than by how likely they are, each one phrased in the vocabulary this room actually uses — filtering, by-right, process, displacement, land value, abundance, astroturf — not in seminar language. For each: the objection as that person would actually put it, the two-minute version of my reply, and one honest sentence about where the reply is soft.
  - "Give-aways and hills" (~120 words): what I should concede in the first two minutes to buy some goodwill, and the two things I should refuse to give up even if the room turns on me.
  - "The one that has to land" (~120 words): the single reply that, if it doesn't work, makes the whole talk a waste — tell me which one it is and how to say it in under a minute.
  - "The question I'm hoping nobody asks" (~100 words): mine is something like "if stake is the currency, then the longest-staked, most continuous neighborhood gets to close the door entirely, which is just an exclusionary suburb in a costume" — but tell me if you think the really dangerous question is a different one, and give me 60 seconds on whichever it is.
reasoning: |-
  Okay, the user is preparing for a presentation at a pro-housing group meeting. They're presenting a controversial thesis that challenges the group's core beliefs. They need a Q&A prep sheet tailored to this specific audience. 

  First, let's unpack the audience dynamics. The room has distinct factions: supply-side tech folks (pro-development, data-driven), tenant organizers (anti-displacement, justice-focused), a land-use lawyer (procedural expert), and a city planner (pragmatic). The user's "stake-weighted say" concept will rattle everyone differently - tech crowd will see inefficiency, organizers will smell betrayal, lawyer will poke holes, planner will worry about implementability. 

  The real landmine here is that the user's argument accidentally validates exclusion. When they say "long-term stakes matter," it echoes NIMBY rhetoric. Gotta help them dodge that bullet without sounding like they're retreating from their core thesis. The "one that has to land" section is critical - if they can't distinguish their position from homeowner vetoes, they're toast.

  For objections, we need worst-first sequencing. The nuclear options are: 
  1) "This just rebrands exclusion" (deadliest - makes them sound like a wolf in sheep's clothing) 
  2) "Ignores citywide needs" (undermines housing crisis urgency) 
  3) "Impossible to implement" (makes it academic fantasy) 

  The concession strategy is clever - offering to scrap public hearings buys credibility but they must hold the line on "stake isn't ownership" and "continuity has value." That last one's fragile - if they let planners reduce it to "neighborhood character," they lose.

  The question they fear about exclusionary suburbs is valid but not the kill shot. The real nightmare is "How is this not just NIMBYism for renters?" - because it forces them to admit their system could still block housing. Their best parry is "This redistributes power downward but doesn't freeze neighborhoods - we'd still approve most projects, just with different voices." Still... that soft spot will ache.

  Noticing the user's intellectual honesty is their strength ("that's a real cost" in thesis). Should advise them to weaponize that - when they admit flaws upfront, it disarms hostility. The lawyer will respect it even if disagreeing.

  Tech crowd needs numbers. Should suggest adding "If we implemented this in District X, analysis shows Y% more renters would get voice while Z% fewer projects get blocked" - even hypothetical data would help. Tenant organizers need justice framing: "This takes voice from Blackstone and gives it to Ms. Garcia in 3B who's lived there 40 years."
answer: |-
  Here's your Q&A battle plan, structured for maximum survivability in that room:

  **Room Read**  
  This audience cares about speed: **by-right** approvals, eliminating **filtering** delays, and **abundance** as the only solution to high costs. They believe zoning fights are fundamentally about wealthy homeowners protecting **land value** through bad-faith **process** abuse disguised as community input ("**astroturf**"). They'll hear your thesis as: "He wants to keep the neighborhood veto, just rebrand it." The tenant organizers will suspect betrayal ("He's giving cover to NIMBYs"), the tech/supply-siders will see inefficiency ("He's adding more process"), the lawyer will see litigation risk, and the planner will see political impossibility.

  **The Objections, Worst-First**  
  1.  **Objection:** "This just reinvents exclusion with nicer words. If 'stake' lets existing residents block new neighbors, you've kept the veto and made displacement *worse* by limiting supply."  
      **Reply:** "The veto *today* is tied to ownership. I'm decoupling voice from deeds and giving it to long-term renters & resident small landlords who *bear the most risk* from bad changes but have zero say now. Yes, it means newcomers don’t vote *on moving in* – but neither do you get to vote on who moves into *your* building today. The goal is shifting power *within* the neighborhood, not freezing it."  
      **Soft Spot:** Doesn't guarantee more units get built; could still enable blocks.

  2.  **Objection:** "Abundance is a citywide need. Why should a hyper-local group get to override that? Your system bakes in 'I got mine, screw you'."  
      **Reply:** "Citywide needs *must* be met – but not by steamrolling the people with the most to lose *in that specific place*. We mandate schools, parks, and roads locally because context matters. My model sets *who decides locally*, not whether growth happens. Regional bodies still set overall targets."  
      **Soft Spot:** Dodges *how* regional targets override local "stake" objections.

  3.  **Objection:** "This is unworkable. How do you measure 'stake'? Length of residency? Income tied to location? Emotional attachment? It's a bureaucratic nightmare worse than current hearings!"  
      **Reply:** "Start simple: primary residency duration + leaseholding (for renters) or owner-occupancy. Tax records + utilities can verify. We already track this for homestead exemptions. Yes, it's data – but your world runs on data. This replaces chaotic public hearings with a defined, weighted stakeholder registry."  
      **Soft Spot:** Verification *is* complex; vulnerable to gaming.

  4.  **Objection:** "You're prioritizing 'continuity' over human need. People *need* homes now. Protecting someone's 'corner store vibe' is a luxury when others sleep in cars."  
      **Reply:** "Stability *is* a human need. Forcing low-income renters to constantly relocate due to upheaval *is* harm. This protects vulnerable renters *from* displacement by giving them voice. The 'vibe' defender is often a wealthy owner – under my model, *they* get less weight than the 20-year renter."  
      **Soft Spot:** Implies trade-off between stability for current vulnerable vs. homes for future vulnerable.

  5.  **Objection:** "This ignores land value. Owners bear the financial risk/benefit of change. Why should they have *less* say than a renter?"  
      **Reply:** "Financial risk is real, but it's not the *only* stake. Renters risk displacement, community ties, schools – often with fewer resources to adapt. An absentee owner gets pure financial upside/downside. A resident owner gets both financial *and* life disruption stakes. Weighting reflects total stake, not just capital."  
      **Soft Spot:** Undervalues capital risk for small landlords.

  6.  **Objection:** "You're legitimizing NIMBYism. The problem is *process* itself. We need by-right development, period. Adding 'stake-weighted committees' just creates new obstructionists."  
      **Reply:** "I’d *scrap* public hearings for by-right approvals meeting code. 'Stake-weighting' kicks in *only* for major, discretionary changes (e.g., rezoning, large variances) where community impact is high. For the 4-plex on a single lot? By-right. For the 20-story tower? The deeply invested community should have a structured input mechanism – not a veto."  
      **Soft Spot:** "Structured input" can still become obstruction.

  7.  **Objection:** "This helps the 'small landlord' myth. Most opposition is astroturf by REITs and wealthy associations pretending to be 'mom and pop'."  
      **Reply:** "Agreed, astroturf is real. That's *why* weighting by primary residency and leaseholding helps: it sidelines purely financial players and PACs. A Blackstone subsidiary gets zero votes. The couple living upstairs in their triplex gets weighted voice. It filters out the fakery."  
      **Soft Spot:** Large landlords *can* employ resident managers to game it.

  **Give-Aways and Hills**  
  **Give Away:** "I agree the *current* hearing process is toxic and must go. I support by-right as-of-right development for most projects. I agree we need massive supply increases citywide." (Buys goodwill with supply-siders, shows you're not anti-growth).  
  **Never Give Up Hill 1:** "Stake isn't ownership. The 70-year-old renter on SSI who's lived here 40 years has a deeper stake than the LLC that bought a building last week." (Core justice argument).  
  **Never Give Up Hill 2:** "Continuity *is* a legitimate value in urban life worth some protection – it's not *just* financial or selfish." (Core philosophical argument).

  **The One That Has to Land**  
  **The Objection:** "This is just exclusion rebranded."  
  **Your 60-Second Reply:** "No. Exclusion says 'You can't come here.' My model says 'The people whose daily lives are *already* deeply embedded here – especially renters who've been ignored – get the strongest voice on *how* change happens *in their immediate environment*. It doesn't stop growth; it demands growth respect the community that exists. The absentee landlord pushing a luxury tower gets *less* say than the long-term renter fearing displacement. That's the *opposite* of traditional exclusion. It shifts power down."  
  *Why it must land:* If they see this as NIMBYism 2.0, you've lost the room entirely. Frame it as tenant empowerment and anti-speculator.

  **The Question I'm Hoping Nobody Asks**  
  **The Real Killer Question:** "How does this not inevitably become a tool for *existing* privileged communities (e.g., wealthy long-term renters in rent control) to exclude *new* vulnerable people (e.g., low-income families, immigrants) by blocking any change, creating *more* exclusionary enclaves than deed-based zoning ever did?"  
  **Your 60-Second Reply:** (Gulp) "It's a profound risk. Safeguards are essential: 1) Weighted say applies *only* to significant projects, not by-right development. 2) Regional housing needs must override purely local objections – the community decides *how*, not *if* regional mandates are met. 3) 'Stake' must be transparently measured (residency duration, not subjective attachment). Yes, privileged enclaves could weaponize this. But the status quo *already* empowers wealthy owners to exclude everyone. This at least empowers vulnerable *existing* residents within those enclaves to fight for *inclusive* change. It's imperfect, but a more just foundation."  
  *Why it's worse than your fear:* It exposes how your model could worsen spatial inequality by locking in *current* demographics, even if they're privileged. The soft spot is gaping.

  **Go get 'em.** Remember: Your strength is acknowledging real trade-offs ("Yes, that's a real cost"). Use their language relentlessly. Frame stake-weighting as making community input *less* corrupt and *more* equitable, not killing it. Good luck!
