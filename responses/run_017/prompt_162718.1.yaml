  Leaf predictions: Correspondence (substantive, functional for generalization + more), primitivism (substantive but no reductive nature), disquotational/minimalist (thin, functional), prosentential (thin, functional but narrower), epistemic (substantive + domain-variable), pluralist (substantive + domain-variable), eliminativist (no property). Pragmatism omitted—fits poorly with 8-leaf limit. 

  Final output: A prose-only tree with numbered nodes, routing instructions, leaf assignments, unoccupied boxes flagged, and insecurities confessed. I’ll add commentary on node reliability—e.g., node 2 (substantial nature) is rock-solid; node 5 (truth’s core function) is interpretive but grounded in debates.
answer: |-
  Below is a decision tree structured as requested. It starts from minimal shared commitments, branches through your specified distinctions and required cases, and arrives at named theoretical positions without jargon. Unoccupied combinations and inseparable pairs are flagged. Commentary on node design follows the tree.

  ---

  **The Decision Tree**

  Start with Node 1.  
  1. **Is "truth" a property that some claims have and others lack?**  
     - If **no**, go to Leaf E (Eliminativism).  
     - If **yes**, go to Node 2.  

  2. **Does truth have a "substantial nature" — i.e., is there more to being true than just being correct in the way appropriate to the kind of claim?** (Example: For "2+2=4," does its truth involve anything beyond its mathematical correctness?)  
     - If **no**, go to Node 3.  
     - If **yes**, go to Node 4.  

  3. **What is the core function of calling something "true"? Is it primarily to:**  
     - **(A) Efficiently endorse claims you can’t state directly?** (Example: Agreeing with "Whatever the Oracle said" without knowing the Oracle’s words.)  
     - **(B) Generalize over claims?** (Example: Saying "All logical tautologies are true" without listing infinitely many.)  
     - **(C) Do both (A) and (B) equally?**  
       - If **(A)**, go to Leaf P (Prosentence Theory).  
       - If **(B)**, go to Leaf D (Disquotation Theory).  
       - If **(C)**, go to Leaf M (Minimalism).  

  4. **Is the "substantial nature" of truth the same for all true claims?** (Example: Is what makes "Snow is white" true fundamentally the same kind of thing as what makes "Killing is wrong" true?)  
     - If **yes**, go to Node 5.  
     - If **no**, go to Leaf PL (Pluralism).  

  5. **What, concretely, could speakers *not do* if their language had no word for "true," even if they had negation and assertion?**  
     - **They could not endorse claims indirectly or generalize over claims.** (Example: They couldn’t say "Everything the chief said is correct" without listing each statement.)  
       - Go to Leaf C (Correspondence Theory).  
     - **They could still endorse or generalize using other tools; "true" isn’t indispensable.**  
       - Go to Leaf PR (Primitivism).  

  6. **Can a well-formed declarative sentence produced by a system with no beliefs or understanding (e.g., a randomly generated sentence) be true?**  
     - If **no**, go to Leaf AS (Anti-Realist/Superassertibility).  
     - If **yes**, return to the path you were on (this filters out epistemic views early).  

  7. **Does the truth predicate help resolve paradoxes like "This sentence is false"?**  
     - If **yes, by restricting what can be called "true"**, go to Node 8.  
     - If **no, paradoxes are a separate problem for logic**, stay on your current path.  

  8. **Is the value of true beliefs explained by the nature of truth itself?**  
     - If **yes**, you are likely on the Correspondence path.  
     - If **no, truth is valuable for other reasons (e.g., usefulness, coherence)**, you are likely on the Primitivist or Anti-Realist path.  

  **Leaves**  
  - **Leaf E (Eliminativism)**: Truth isn’t a property; calling something "true" is just an expressive habit.  
  - **Leaf P (Prosentence Theory)**: "True" is a grammatical placeholder for indirect endorsement (e.g., "That’s true" mirrors "He did it").  
  - **Leaf D (Disquotation Theory)**: "True" lets us generalize (e.g., "All theorems are true").  
  - **Leaf M (Minimalism)**: "True" does both endorsement and generalization equally.  
  - **Leaf C (Correspondence Theory)**: Truth is about accurately representing reality.  
  - **Leaf PR (Primitivism)**: Truth is substantive but irreducible (e.g., like "goodness").  
  - **Leaf PL (Pluralism)**: Truth works differently across domains (e.g., science vs. ethics).  
  - **Leaf AS (Anti-Realist/Superassertibility)**: Truth is what can be justifiably believed in ideal conditions.  

  ---

  **Unoccupied Combinations & Inseparable Pairs**  
  - **Substantive + Non-Functional (Node 2 "yes" + Node 3 "only (A)")**: Unclaimed. If truth is substantive but *only* used for blind endorsement, why have a robust property for such a thin task?  
  - **Thin + Anti-Realist (Leaf M/P/D + Leaf AS)**: Incoherent. Anti-realism requires a substantive (epistemic) nature; thin views deny this.  
  - **Inseparable Pair**: Minimalism (M) and Disquotation (D) *cannot be fully split* by this tree. Both answer Node 3 with "(B)" or "(C)" and agree elsewhere. The distinction hinges on technical machinery (axioms vs. schemas), violating your "no technical terms" rule.  

  ---

  **Commentary on Nodes & Design**  
  1. **High-Confidence Nodes**:  
     - **Node 1 (Property?)**: Cleanly isolates eliminativism.  
     - **Node 2 (Substantial?)**: Core deflationary/substantive split. The math example targets your friend’s "biconditionals say nothing" worry.  
     - **Node 3 (Function?)**: Directly addresses your "what work?" complaint. Cases (A) and (B) map to blind endorsement vs. generalization.  
     - **Node 5 (No truth predicate?)**: Tests indispensability. Correspondence theorists often say generalization *requires* truth; primitivists deny this.  

  2. **Lower-Confidence Nodes**:  
     - **Node 6 (Non-sentient systems)**: Sharpened to force epistemic views (AS) out early. Some deflationists *might* say "no" if they tie truth to assertion, but most say "yes."  
     - **Node 8 (Value of truth)**: Extrapolative. Correspondence theorists (e.g., Lynch) often link truth’s nature to value; deflationists (e.g., Horwich) separate them.  

  3. **Your Framing**:  
     - The metaphysical/functional split **holds**. Node 2 is metaphysical; Node 3 is functional. Your friend’s challenge ("owes us an explanation of value") is handled in Node 8.  
     - The four cases are well-placed:  
       - Non-sentient systems → Node 6.  
       - Truth-free community → Node 5.  
       - Blind endorsement → Node 3(A).  
       - Necessary truths → Node 2 (math example).  
     - **One flaw**: Primitivism (PR) and Correspondence (C) *nearly converge*. I used Node 5 ("indispensability") to separate them, but specialists might dispute this.  

  4. **Taxonomy Defense**:  
     - Prosententialism (P) is isolated by its *rejection* of generalization (Node 3(A)).  
     - Pluralism (PL) requires domain-variance (Node 4 "no").  
     - Anti-realism (AS) requires rejecting non-sentient truth (Node 6 "no").  
     - Eliminativism (E) is Node 1 "no."  
     - **Sacrifice**: Pragmatism is omitted; it fits awkwardly between Pluralism and Anti-Realism under your constraints.  

  **Conclusion**: Your debate likely crossed three separable layers: (1) Is truth substantive? (Node 2), (2) What does ‘true’ *do*? (Node 3), and (3) Is truth uniform? (Node 4). The tree forces these apart. Most "shouting" probably happened at Node 2 (your friend’s metaphysics) and Node 3 (your functionality), using vocabulary from both.  

  ---  
  Would you like adjustments to specific nodes or further rationale for the routing?
