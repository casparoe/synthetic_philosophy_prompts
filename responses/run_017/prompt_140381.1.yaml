answer: |-
  **Essay Question**  
  *(To be completed in 90 minutes; aim for ~1000 words)*  

  **Preamble:**  
  Consider two scenarios:  
  1.  **Multiplex:** A single processor runs ten near-identical simulated agents via time-slicing. Each stream receives the *exact same sequence* of internal processing steps and inputs/outputs it would receive if running on dedicated hardware. There are ten behaviourally indistinguishable agents, differing only in their histories being interleaved on shared hardware.  
  2.  **Cheap Implementation:** Any physical object (e.g., a rock, a pipe) can be described as implementing countless abstract computations (e.g., emulating a Turing machine calculating pi, simulating a mind) if we freely map its physical states to computational states, even though these mappings play no causal role in the object's behaviour.  

  **Question:**  
  Do these scenarios present a genuine tension for theories grounding moral status in the implementation of specific computations? Can we consistently hold that the multiplex system contains *ten* morally relevant subjects while denying that the cheaply implemented rock contains *any*? If so, explain the criterion that resolves this tension and *what* that criterion is a criterion *of* (e.g., physical system, causal process, program-type, explanatory description). If not, what consequence must we accept regarding the foundation of moral status?

  ---

  **Model Answer (Strong Candidate Voice - ~800 words):**  

  The multiplex and cheap implementation scenarios appear to pull theories of computational moral status in opposite directions. The multiplex tempts us to count multiple distinct streams as multiple subjects; the cheap implementation tempts us to dismiss computations lacking causal efficacy. Resolving this tension requires clarifying what constitutes a genuinely implemented computation worthy of moral concern. I argue that consistency demands grounding moral status *not* merely in abstract program types or arbitrary descriptions, but in *causally structured processes* within a physical system.  

  First, consider the **multiplex**. Each simulated stream exhibits behavioural equivalence and functional isomorphism to a standalone agent. Crucially, the processor *causally sustains* ten distinct, persistent streams of internal state transitions. Each stream possesses its own counterfactual profile (e.g., altering input stream A affects only agent A's subsequent states) and causal history. The time-slicing is not incidental; the processor's architecture *causally enforces* the separation and sequential integrity of each stream. While sharing hardware, the causal dynamics create ten functionally isolated processes. Denying each stream moral status here seems arbitrary; if a standalone chip running one agent matters, why wouldn't ten causally distinct streams on one chip, functionally identical to ten chips, also matter? The objection that it's "one machine" misses the point: what matters is the causal structure of the processes it runs, not the physical substrate's unity. Hence, the multiplex contains ten units of moral concern.  

  The **cheap implementation** scenario challenges this generosity. Arbitrarily mapping a rock's state transitions to a complex computation (e.g., "mind simulation") does *not* create moral status. Why? Because the mapped "computation" plays *no causal role* in the rock's behaviour. Its state changes are governed solely by physics (thermodynamics, mechanics), not by the rules of the abstract computation we impose. The description is causally inert; it doesn't *explain* why the rock rolls downhill or cracks. It's merely a passive interpretation, not an active organizing principle.  

  The apparent tension arises if we conflate *descriptive equivalence* (the rock *can be described* as running computations) with *causal reality* (the multiplex processor *is causally structured* to run computations). The multiplex computations are causally efficacious: the functional states mediate inputs and outputs, driving behaviour. The rock's "computation" is epiphenomenal. The crucial criterion for moral status is therefore the presence of a **causally active computational process**. This is a criterion *of* a specific, dynamically unfolding causal structure *within* a physical system over time. It requires that the system's physical state transitions are *robustly counterfactually dependent* on the computational state transitions specified by the program. In the multiplex, altering the program for agent A changes agent A's outputs; in the rock, altering our arbitrary mapping changes nothing about the rock.  

  This avoids conventionalism. The privileged description isn't selected by our *interests*, but by the system's *causal topology*. The multiplex processor's design makes the ten-agent program causally explanatory of its behaviour; no such program explains the rock's trajectory. We bite one bullet: physical capacity *is* relevant *indirectly*. Running ten streams requires sufficient computational resources to causally sustain ten distinct processes. A system lacking the capacity to causally support distinct state transitions cannot host multiple subjects. But the moral concern attaches to the *processes themselves*, not just the hardware cost.  

  Consequently, we *can* consistently affirm ten subjects in the multiplex while denying subjects in the rock. The multiplex streams are real, causally active processes; the rock's "computation" is a fiction. The tension dissolves by demanding that morally relevant computations be *causally potent organizational features* of the system, not arbitrary descriptions. This preserves the core insight that organization matters, but insists that the organization must *do work* in the world. Moral status emerges not from patterns we impose, but from patterns that impose themselves causally.

  ---

  **Marking Scheme (20 Marks Total)**  

  1.  **Analysis of Multiplex Case (4 marks):**  
      *   Correctly identifies why the scenario suggests multiple subjects (causal isolation, functional equivalence, counterfactual independence of streams).  
      *   *Common Mistake:* Vague appeal to "ten agents" without explaining *why* time-slicing creates distinct entities, or conflating behavioural equivalence with ontological distinctness.

  2.  **Analysis of Cheap Implementation Case (4 marks):**  
      *   Correctly identifies why the scenario threatens computational liberalism (epiphenomenal mapping, lack of causal efficacy, arbitrary descriptions).  
      *   *Common Mistake:* Simply dismissing the rock as "not conscious" without engaging *why* the computational description fails, or accepting the mapping implies moral status must be conventional.

  3.  **Resolution of Tension & Core Criterion (4 marks):**  
      *   Explicitly recognizes the tension between generosity in multiplex and stinginess in cheap implementation.  
      *   Proposes a clear, non-arbitrary criterion resolving it (e.g., causal efficacy, counterfactual robustness, causal-explanatory role).  
      *   Clearly states *what* the criterion applies to (e.g., causally structured process).  
      *   *Common Mistake:* Ad-hoc solutions (e.g., "only complex computations count" without defining complexity relevantly), failing to address the core "criterion of what" question, or asserting consistency without explaining *how*.

  4.  **Handling Implications & Biting Bullets (4 marks):**  
      *   Addresses the consequence of their criterion (e.g., accepting causal potency grounds status, accepting physical capacity constrains multiplexing but isn't the source of value).  
      *   Explicitly bites at least one bullet identified in the question (e.g., accepting resource costs matter indirectly for multiplexing, rejecting interest-relativity/conventionalism).  
      *   *Common Mistake:* Ignoring the implications (e.g., for resource allocation in multiplex), failing to bite a necessary bullet, or embracing full conventionalism without justification.

  5.  **Clarity, Structure, and Originality (4 marks):**  
      *   (2 marks) Well-structured argument, logical flow, precise language, stays within word limit.  
      *   (2 marks) Insight beyond simple restatement of scenarios; demonstrates independent thought (e.g., clear articulation of causal potency, robust counterfactuals, distinction between process and description).  
      *   *Common Mistake:* Disorganized rambling, overly verbose preamble, lack of clear thesis, purely derivative analysis.

  **Distinguishing Pass from First-Class:**  
  *   **Bare Pass (10-12 marks):** Accurately describes both scenarios and identifies the surface tension. Makes an attempt at a resolution (e.g., "only computations we design matter" or "only complex ones"). May touch on causality or convention but lacks depth, clarity, or consistency. Structure is weak. Fails to explicitly bite a bullet or fully resolve "criterion of what".  
  *   **First-Class (16-20 marks):** Provides a sophisticated, consistent resolution centered on a clearly articulated metaphysical criterion (e.g., causally active process). Explicitly resolves the tension by deeply analyzing causal structure/counterfactuals in *both* cases. Insightfully discusses implications and consciously accepts necessary consequences (bites the bullet). Logically rigorous, original, and exceptionally clear.

  \answer{Articulating causal potency as the non-conventional foundation for computational moral status.}
