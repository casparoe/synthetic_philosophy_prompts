prompt: |-
  I'm halfway through a paper on this and my supervisor keeps saying "define corruption" like it's a five-minute job, and I've realised after about six arguments with a friend from back home that my gut verdicts on concrete cases don't line up with any rule I can actually state. So here they are, and I want the rule. (1) Handing a clerk 40 bucks to release a passport that's been "pending" for five months and that I'm plainly entitled to: not corruption, just infuriating — a fee for not being ignored. (2) A mayor giving a city contract to a firm whose owner he's played golf with every weekend for ten years, nothing ever said out loud, no evidence the bid was worse: corruption, definately, and I don't care that nobody can point to a deal. (3) Where my parents grew up, a woman takes a goat to the village chief so he'll hear her land dispute this year instead of next year: I can't call that corruption, it's how the institution works there, and refusing would just mean she never gets heard. (4) A surgeon getting a case of wine from a grateful patient a week after the operation: fine, obviously. (5) The same case of wine arriving the week before the operation: not fine. (6) A drug rep buying a doctor's flights and hotel for a conference in another city, and the doctor prescribing more of that company's drug afterwards while honestly believing it's the better drug: corrupt. (7) The same rep dropping off sandwiches for the whole clinic: not corrupt, and I don't think it's just that the money is smaller. (8) A hospital nurse taking cash to move a patient up the surgery queue: corrupt. (9) The same nurse taking cash to stay two hours past her shift and treat patients privately in the same building: not corrupt. (10) A rich family endows a building at a university and their son gets in with grades that wouldn't have gotten him in: corrupt. (11) The same university admitting the children of alumni who've given nothing: not corruption, just unfair, or nepotistic, or something — I don't think it's the same thing as 10 and I can't say why.

  The best I can do on my own is: an officeholder acts corruptly when a private relationship displaces the criteria their role exists to apply. But I don't know what to do with (3) — in that village the criteria seem to include being someone the chief owes something to — and my friend says that just shows I've smuggled in a Western standard and then called it universal, which feels like a cheap way out but I can't actually answer it. And (1) pulls against (5): in both cases something of value moves before the official does what I want, so if timing is what makes (5) bad then (1) should be bad too, and it isn't.

  So: can you give me a principle — or two, honestly, if no single one will do — that gets as many of these as possible? State it precisely enough that I can apply it to new cases myself, tell me what it predicts for cases I haven't listed (my actual stuck one: my dad sits on the municipal planning committee, and a family friend whose firm has a rezoning application coming up sent him an expensive watch when my sister got engaged — customary in that community, and he recused himself from the vote, which passed anyway), and be straight with me about which of my verdicts some principle forces me to give up and which clash is the real one I have to decide.
reasoning: |-
  Okay, the user is working on a paper about corruption and struggling to define it clearly. Their supervisor keeps asking for a definition, but they've realized through arguments with a friend that their gut reactions to specific cases don't align with any clear rule. They've listed 11 concrete examples where they have strong intuitions about what is or isn't corruption, but they can't find a consistent principle that covers all of them.

  Looking at their examples, I notice several patterns. In case 1, they see bribing a clerk to get a passport that should already be issued as not corruption, just a fee to avoid being ignored. But in case 5, a gift before surgery is corrupt. The timing seems to matter, but why doesn't it matter in case 1? Case 3 with the goat to the village chief challenges Western standards, as their friend pointed out, because the local system incorporates such gifts as part of its functioning. The user's initial definition about private relationships displacing official criteria doesn't quite hold here because in that context, the relationship is part of the criteria.

  The user also mentioned their dad receiving an expensive watch from a family friend whose rezoning application was coming up. Even though their dad recused himself and the watch was customary, the user seems unsure if it's corrupt. This ties into the broader question of whether intent and context can override the appearance of corruption.

  The user's deeper needs here are both academic and personal. Academically, they need a robust definition for their paper that can handle cross-cultural cases and real-world complexities. Personally, they might be grappling with their own biases or cultural background, especially since several examples involve personal anecdotes (like their parents' village or dad's situation). They want a principled way to distinguish corruption from other forms of influence, fairness issues, or cultural practices without resorting to relativism or imposing Western norms.

  I should consider existing frameworks. Transparency International defines corruption as the abuse of entrusted power for private gain. That's a start, but it's too vague for the nuances here. The user's cases show that "abuse" and "private gain" need unpacking. For instance, in case 3, is it abuse if it's systemic? In case 9, is staying late for extra pay private gain if it's outside official duties? 

  Breaking it down, the key elements seem to be: role duties, deviation, benefit, and intent. Each case varies in these aspects. For example, case 2 (mayor's contract) involves a clear deviation from impartiality for personal relationships. Case 6 (drug rep influencing prescriptions) has subtle influence despite the doctor's belief, suggesting that the benefit creates an unconscious bias. Case 10 (university donation for admission) directly trades money for access, while case 11 (legacy admission without donations) might be unfair but not corrupt if no exchange occurred.

  The tension between systemic practices (like the goat in case 3) and ideal standards is tricky. The user feels it's not corruption because it's how the system works, but their friend calls that a Western bias. I need to address this without dismissing either view. Maybe distinguishing between corruption as a structural failure versus individual wrongdoing. In case 3, the system itself is corrupt because it requires gifts for basic services, but the individual actors are just participating in it. That might preserve the intuition while labeling the system as problematic.

  For the timing issue in cases 1 and 5, the difference might be that in case 1, the clerk is withholding a right (passport) to extort payment, making it a coercive fee. In case 5, the gift is proactive to influence future action, which is a bribe. So intent and coercion matter. But in case 1, the user sees it as "not corruption," which conflicts with standard definitions where bribery is corruption. Perhaps they view it as extortion instead, which is a form of corruption. I need to reconcile this by clarifying subtypes.

  The user's dad's watch case: even with recusal and custom, the benefit was given by someone with pending business. The appearance of conflict matters, and recusal might not absolve it. The principle would flag this as corrupt because the gift could influence future interactions, even if not this specific vote. 

  I should present two principles: one for quid pro quo exchanges and one for conflicts of interest. Then tackle each case with these, admitting where adjustments are needed. For case 3, if the gift is required by the system, it's institutional corruption. For case 1, it's extortion (a corruption subtype). The user might need to accept that some intuitions don't fit perfectly and decide where to draw lines, like in case 11 where legacy admissions aren't corrupt but still unfair. 

  Their real struggle is balancing cultural relativism with a universal standard. I should acknowledge that while definitions can be universal, context determines if an act is corrupt within a system. However, labeling a system as corrupt when it fails basic functions (like timely hearings without bribes) avoids relativism. 

  Finally, the user needs to know which verdicts to reconsider. Case 1 is actually corruption (extortion), case 3 might be systemic corruption, and case 11 isn't corrupt but unfair. The watch case is corrupt due to conflict of interest, despite recusal and custom. Being honest about these clashes helps them refine their view.
answer: |-
  Here's a principle (actually two interdependent ones) that captures your intuitions while addressing the tensions, grounded in public ethics and institutional function:

  **Core Principles:**

  1.  **Corruption occurs when a *holder of entrusted power* (public official, professional, or institutional actor) *intentionally deviates from the core functional duties of their role* by allowing a *private benefit* (material or relational) to *directly influence or substitute for* the impartial or meritocratic criteria their role is designed to apply.**
  2.  **This includes both *quid pro quo exchanges* (explicit or implicit) and *situations creating a significant conflict of interest* where the benefit could *reasonably be seen* as impairing impartial judgment, regardless of actual outcome or intent.**

  **Key Definitions within the Principle:**

  *   **Holder of Entrusted Power:** Anyone occupying a role granted authority or discretion by an institution or society to make decisions affecting others (officials, judges, doctors, nurses, admissions officers, clerks).
  *   **Core Functional Duties:** The primary purpose and obligations of the role (e.g., issuing entitled documents impartially, awarding contracts based on merit, providing medical care based on need/clinical judgment, adjudicating disputes fairly, admitting students based on academic potential).
  *   **Private Benefit:** Anything of value (cash, gifts, favors, preferential access, relational advantages) received by the actor *in their personal capacity* (or for someone close to them) due to their role.
  *   **Direct Influence/Substitution:** The benefit is linked to a *specific decision or action* within the actor's official duties, either as a condition for action (quid pro quo) or as a factor demonstrably influencing the criteria used.
  *   **Significant Conflict of Interest:** A situation where a private benefit creates a personal stake for the actor in the outcome of a decision, sufficiently substantial that it *objectively risks* compromising their primary duty to impartiality or meritocracy. "Significant" excludes trivial benefits (sandwiches) where influence is implausible.
  *   **Reasonably Be Seen:** An objective standard based on how a disinterested observer would perceive the potential for bias. This covers hidden influence and deals where proof of explicit exchange is absent.

  **Applying the Principle to Your Cases:**

  1.  **Clerk & Passport:** **Corrupt.** Clerk deviates from core duty (issuing entitled documents promptly/impartially) by accepting a private benefit ($40) as a condition for performing their basic function. It's extortionate bribery.
  2.  **Mayor & Golf Buddy:** **Corrupt.** Creates a *significant conflict of interest*. The private relational benefit (long-term friendship) reasonably impairs the duty to award contracts impartially based on merit. No explicit deal needed.
  3.  **Village Chief & Goat:** **Corrupt (Systemically).** The *system itself* deviates from the core duty (adjudicating disputes fairly/timely) by *requiring* private benefits to access the service. The chief participates in this deviation. (This labels the *practice/system* as corrupt, not necessarily the individual actors' *intent* as uniquely malicious).
  4.  **Wine After Surgery:** **Not Corrupt.** Benefit received *after* duty was performed. No link to influence a *specific decision*. Gratitude after fulfillment doesn't impair core duty.
  5.  **Wine Before Surgery:** **Corrupt.** Benefit received *before* a specific decision/action. Creates a significant conflict of interest (could influence prioritization, care decisions) or implies a quid pro quo expectation.
  6.  **Drug Rep & Conference:** **Corrupt.** Creates a *significant conflict of interest*. The substantial private benefit (flights/hotel) objectively risks impairing the core duty (prescribing based solely on clinical judgment/patient need), even if the doctor subjectively believes otherwise. Influence is plausible.
  7.  **Drug Rep & Sandwiches:** **Not Corrupt.** Trivial benefit. The value/scale makes it implausible that it creates a significant conflict of interest impairing core prescribing duties. (Scale matters *because* it relates to plausibility of influence).
  8.  **Nurse Taking Cash to Jump Queue:** **Corrupt.** Deviates from core duty (treating based on clinical need/triage) by accepting a private benefit to prioritize a specific action (surgery). Quid pro quo.
  9.  **Nurse Taking Cash for Extra Hours:** **Not Corrupt.** The service provided (extra hours, private treatment) is *outside* the core functional duties tied to the public queue/triage system. It's a separate transaction for additional service, not subverting the existing allocation system.
  10. **Endowed Building & Admission:** **Corrupt.** Private benefit (large donation) directly influences/substitutes for the core meritocratic admissions criteria. Quid pro quo is implied or explicit.
  11. **Alumni Child (No Donation):** **Not Corrupt (but Unfair/Nepotistic).** Private relational benefit (family connection) influences the decision, deviating from pure meritocracy. However, **if** legacy preference is *an officially sanctioned, transparent criterion* within the institution's defined admissions policy (however flawed), it's arguably part of the *duty* as defined by that institution, not a *deviation*. It's institutional unfairness/nepotism, not necessarily corruption under this principle. It lacks the *direct link to a specific private benefit exchange* of case 10. The core duty (as defined *by the institution*) includes considering legacy status.

  **Your Dad's Watch Case:**

  *   **Verdict:** **Corrupt.**
  *   **Why:** Your dad is a holder of entrusted power (planning committee). The expensive watch is a substantial private benefit. It comes from someone with a clear, specific, and pending matter (rezoning application) falling squarely within his committee's authority. This creates an *objectively significant conflict of interest*.
  *   **Mitigating Factors Don't Absolve:** Recusal on *that specific vote* is good practice but doesn't erase the conflict. The benefit was received *because of* his role and the applicant's pending business. It could reasonably be seen as influencing future interactions, general goodwill, or other decisions. The "custom" argument weakens if the gift's scale/timing links it to the pending application. The principle focuses on the *creation of the conflict*, not just the outcome of a single vote.

  **Which Verdicts You Might Need to Give Up/Reconsider:**

  1.  **Case 1 (Clerk):** Your "not corruption" verdict clashes most directly. The principle clearly identifies this as corrupt (deviating from duty via private benefit). Your intuition might stem from seeing it as a victimless "grease payment" or resistance, but it's core bribery/extortion.
  2.  **Case 3 (Village Chief):** Your "not corruption" verdict is challenged. The principle labels the *practice* as corrupt because the system deviates from its core duty (fair/timely adjudication) by requiring private benefits. You need to decide if calling *systemic practices* corrupt imposes an unfair external standard. The principle suggests it can be labeled corrupt *as a practice*.
  3.  **Case 11 (Legacy Admission):** Your intuition that it's "not the same" as 10 is preserved. The principle distinguishes based on the *direct exchange for a specific benefit* (10) vs. the application of an *officially sanctioned (though unfair) criterion* lacking that specific exchange (11). However, it forces you to accept that 11 is not *corruption* under this definition, even if deeply unfair.

  **The Core Tension You Must Decide:**

  *   **Relativism vs. Universal Function:** The hardest clash is **Case 3**. Your friend argues it's relativism to call it corrupt. The principle counters: **Does the institution have a core function (e.g., resolving disputes)? Does requiring a private benefit for its basic execution inherently pervert that function?** If yes, the *practice* can be labeled corrupt *as a systemic deviation*, even if culturally embedded. You must decide if "core function" can be defined universally enough (timely, impartial justice) to make this call, or if functionality is *entirely* defined by local norms (where the goat *is* part of the process). **This is the crux.** Do you believe core public functions (justice, security, basic entitlements) have universal minimal standards? If yes, the principle holds. If you believe functionality is purely culturally relative, then Case 3 isn't corrupt, but then Cases 1 & 8 might also be defensible locally, which clashes with your other intuitions.

  **Why This Principle Works:**

  1.  **Focuses on Role & Duty:** Explains why the surgeon (professional duty) and nurse (public duty vs. private work) are treated differently.
  2.  **Captures Timing:** Distinguishes pre-action gifts (influence/conflict) from post-action gratitude (Case 4 vs. 5).
  3.  **Handles Hidden Influence:** Covers the Mayor (Case 2) and Drug Rep (Case 6) via conflict of interest and "reasonably be seen".
  4.  **Addresses Scale:** Explains sandwiches (Case 7) vs. conference (Case 6).
  5.  **Distinguishes System from Individual:** Allows labeling systemic practices (Case 3) as corrupt.
  6.  **Separates Corruption from Unfairness:** Distinguishes Case 10 (corrupt exchange) from Case 11 (institutional nepotism/unfairness).

  **How to Use It:**

  1.  Identify the **Holder of Entrusted Power** and their **Core Functional Duties**.
  2.  Identify any **Private Benefit** received due to their role.
  3.  Ask: Did the benefit **directly influence or substitute for** the core duties in a specific instance? (Quid Pro Quo)
  4.  Ask: Did the benefit create a **significant conflict of interest** where it *objectively risks* impairing impartial judgment on a matter within their duties? (Conflict of Interest)
  5.  If yes to 3 or 4, it's corruption.

  This provides a robust, defensible framework for your paper that aligns with most of your intuitions while forcing clarity on the crucial issue of systemic practices and the universal/relative nature of institutional functions. It gives you the tools to analyze new cases consistently. Good luck!
