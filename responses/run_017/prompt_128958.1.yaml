     - If the sum of the best asks for T and F of the same statement is not 100, buy or sell the pair at current prices (details in the role card).
     - If they can compute the truth of a statement, they can buy the true security if its ask is below 100 or the false security if its ask is below 100.
  - After each reveal, settle securities. 
  - Goal: Maximize your points.

  ### Timeline (75 minutes)

  1. **Introduction (5 min)**: 
     - Facilitator: "We are playing a prediction market game. You are trading securities on mathematical statements. The goal is to make as many points as possible. Here are the rules handout. There will be multiple rounds. In each round, we'll trade on one statement, then reveal its truth value."
     - Assign the first exploiter (maybe randomly). The exploiter gets a separate role card with details.

  2. **Round 1 (10 min)**:
     - Present statement 1: "The next prime after 100 is 107." (False)
     - Trading: 5 minutes. Traders post bids and asks. They can trade with each other. The exploiter can make exploit moves at any time (but we encourage them to do it after some trades). 
     - During trading, the facilitator updates the best bid/ask on the board.
     - Exploiter can act when they see an opportunity. The facilitator records exploits in the ledger.
     - Reveal: At 10 min, stop trading. Reveal the truth (by having someone compute: 101 is prime). 
     - Settle: Holders of T_S1 get 0 (because false), F_S1 get 100.

  3. **Round 2 (10 min)**: 
     - New statement: "The 1000th decimal digit of π is 9." (True)
     - Rotate exploiter role to next participant.
     - Same as above. Reveal by showing a printout of π's first 1000+ digits.

  4. **Round 3 (10 min)**:
     - Statement: "There exist consecutive integers a, b, c (a<b<c) such that a^3 + b^3 = c^3." (False)
     - Reveal by explanation: we can show the equation and that it has no solution in integers>0.

  5. **Round 4 (10 min)**:
     - Statement: "The number 2^10 + 1 is prime." (False)
     - Reveal: 1025 = 5^2 * 41.

  6. **Round 5 (10 min)**:
     - Statement: "The sum of the first 100 positive integers is 5050." (True)
     - Reveal: formula n(n+1)/2.

  7. **Round 6 (10 min)**:
     - Statement: "The 15th Fibonacci number is 610." (True)
     - Reveal: compute Fibonacci sequence.

  8. **Debrief (20 min)**:
     - Go through the four points and relate to the game.

  ### Debrief
  1. **Genuine uncertainty**: Ask: "Did anyone feel uncertain about the next prime after 100? What did you price it at?" Show that prices were not 0 or 100 initially.
  2. **Coherence constraints**: Point to the exploit ledger: "When did the exploiter make money? Why did they buy both T and F for statement X? Because the sum of prices was below 100. That pushed the prices to sum to 100."
  3. **0.5 not safe**: "In round for statement 5 (sum of first 100), if someone knew the formula, they could have bought T if it was priced below 100. The exploiter did that? Or a trader might have done it? But note: the exploiter in that round, if they knew, could exploit. But even if not, a trader who knew could profit by buying the true security cheaply."
  4. **Market can stop losing without right prior**: "Look at the prices after the first exploit. They became coherent. But were they correct? For statement 1, the true price for T should have been 0, but it might have been 30. Then after reveal, holders of T lost. But the exploit only forced coherence, not correctness. And later, when someone computed, they exploited the incorrectness."

  Which one does the game establish best? Probably 1 and 2. 

  ### What can go wrong
  - **Someone knows a fact**: If a participant knows the next prime after 100 is 101, then in round 1 they might bid high for F_S1. Or the exploiter might be that person and exploit. That's okay, it illustrates point 3.
  - **Prices frozen**: Encourage the facilitator to seed the market: "I'll start: I bid 40 for T_S1." Or assign a market maker initially? Or have the exploiter (if they are not active yet) post some bids/asks? But the exploiter might not want to. Alternatively, the facilitator can offer to buy T_S1 at 40 and F_S1 at 40 to get things started? But then they are setting prices. Better to let them start slowly. After a minute, if no trade, the facilitator can say: "Anyone willing to buy T_S1 for 30?"
  - **Exploiter becomes market maker**: The exploiter is allowed to trade only in exploits, not in regular trades. So they shouldn't be making the market. If they are, remind them.
  - **Confusion about conditional**: We skipped the conditional.
  - **Betting whole stack**: That's okay, they might lose.
  - **CS students compute everything**: They might try to compute during the round. That's okay, but if they succeed, they can exploit. But the rounds are only 10 minutes, and some computations might take longer? We chose statements that are feasible in 10 minutes? For the consecutive cubes, they might not solve the cubic equation? They might try small numbers and see if any work? They will see that 3,4,5: 27+64=91, 125 -> no. Then 4,5,6: 64+125=189, 216 -> no. 5,6,7: 125+216=341, 343 -> close but 341!=343. So they might conclude false. So they might be able to exploit. But that's point 3.

  ### What the game cannot reproduce
  - The computability and time-budget constraints: In the game, if someone can compute, they exploit. But in reality, we don't have infinite computing power.
  - Asymptotic: The game is one-shot. In logical induction, the market converges over time.
  - Relative to revealer: In the game, we reveal at the end. But in reality, some statements might never be settled. We can mention that.

  ### Final Line
  We want them to have felt: "Being uncertain about logical truths is okay, but only if you are not exploitable."

  Answer: "The vulnerability of incoherent beliefs and the safety of unexploitable ones."
