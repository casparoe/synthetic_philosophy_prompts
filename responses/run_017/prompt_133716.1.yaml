prompt: |-
  I'm a junior at a large public high school, and I sit as the student member of our school's discipline board. Over the past year I've noticed a pattern in how we argue about who "caused" something bad, and I can't tell whether it is a real thing with a name in philosophy or just a habit of speech that our board has picked up. I'd like to know what it is, or, if it isn't anything established, what to call it and exactly where its edges are.

  Three hearings, stripped down:

  1. A teacher left a cabinet of exam papers unlocked overnight; four students photographed the paper. Everyone was comfortable saying the teacher's failure to lock the cabinet caused the leak. When another member noted that the same cabinet had been left unlocked twice before with no leak, and that a determined student could have got in anyway, nobody weakened the causal claim. Instead the description of what the teacher owed us got larger: he should have locked it, and also counted the copies, and also not left the exam in the room at all.
  2. A hallway fight that a dozen people saw and nobody reported. Asked what caused the injury, we named the two fighters and then, vaguely, the people who walked past. Nobody would name any particular passer-by, but nobody would say that the passers-by had no causal role either. The claim stayed with the group without landing on any member of it.
  3. A group project where five people each assumed someone else would email the teacher. Asked who caused the zero, we picked whichever member we were already annoyed with; asked what to change so it doesn't recur, we proposed a rotating reminder system and said nothing about that person's reliability.

  What I think I'm seeing is this: a claim that someone's not-doing-something caused an outcome seems to run off whether we can point to whose job it was and how much we already want to blame them, and to be strangely insensitive to how much difference their acting would actually have made. When the difference-making is challenged, the obligation gets restated in a stronger form rather than the causal claim being withdrawn. And when no one was designated, the claim doesn't dissolve — it floats upward to a collective. I've been writing it in my notes as duty-tracking, but that name does no work I can't do in a sentence.

  So, concretely: does this have an established name, or does it sit between two or three named things? I have come across the phrase causation by omission, but the cases I've seen discussed are about unwatered plants and promises to water them, and they don't seem to cover the part where the obligation stretches under pressure, or the part where the claim attaches to a group while refusing to attach to its members. Is that one phenomenon or two? Does the same thing happen with things people did rather than failed to do, and if not, what does that asymmetry tell us about what is going on?

  Please don't just hand me a label. I want the carving: which nearby concepts this resembles, how it differs from each, which fits best, and one pair of hypothetical cases that would let me tell for myself whether I've found one thing or two. And I'd rather have your own analysis than a list of papers; I have no way to get at journals from here.

  Two more things. First, tell me how confident you are in each part of your answer, and specifically which part rests on a contested claim about how ordinary speakers actually use the word cause rather than on something you can settle from the armchair. Second, tell me what would change your mind: if you think duty is doing the work here, what would you expect to hear people say if it weren't; if you think this collapses into something already named, what observation about our arguments would make you revise that; and if you think it's genuinely new, what would convince you it isn't.
reasoning: |-
  Okay, let me unpack this fascinating query. The user is a perceptive high school junior serving on a discipline board, noticing a consistent pattern in how their group attributes causality - specifically around failures to act. They've identified three key features: (1) causal claims persist even when counterfactual impact is challenged, (2) obligations expand defensively, and (3) group attribution floats without individual anchoring. 

  Hmm... their examples are remarkably clear. The exam leak case shows obligation inflation when challenged ("he should've done X, Y and Z"). The hallway fight demonstrates collective floating causality. The group project reveals blame attaching to whoever is least favored. What's striking is how causal claims seem tethered to perceived duty rather than probable impact - and how duty stretches when challenged.

  I recall causation by omission literature, but as the user notes, it doesn't fully explain obligation elasticity or group attribution. The teacher case feels different from classic omission examples like failing to water plants. There's also But-for causation (sine qua non), but it fails here - since the leak might have happened anyway, yet blame persists. 

  What about moral responsibility frameworks? Scanlon's contractualism comes to mind with its focus on justifiability to others. In the hallway case, blaming "the group" might reflect a sense that any passerby could reasonably be expected to intervene - but interestingly, it doesn't translate to blaming any particular passerby. That suggests a distinction between collective obligation and individual blameworthiness.

  The obligation inflation piece reminds me of what philosophers call "defensive duty-stacking" - when challenged, we pile on additional should-haves to justify the initial blame. It's like causal claims are proxies for responsibility assessments. In the exam case, the teacher's initial duty (locking) gets supplemented with counting copies and removal when the causal link is questioned - not because those would necessarily have prevented the outcome, but because they bolster the "should have known better" narrative.

  For the group attribution puzzle, Margaret Gilbert's plural subject theory might help - groups can have obligations no single member has. But in the hallway case, the board seems to posit group causality without believing the group actually functioned as a collective agent. That's more like "distributed causality" - no individual necessary or sufficient, but the set enabled harm.

  Confidence levels: High (90%) on duty being central - because in all cases, causal language tracks perceived responsibility assignments. Medium (70%) on this being distinct from standard omission theory - the elasticity and group dynamics feel undertheorized. Lower (60%) on whether this is wholly new - likely adjacent to responsibility gaps literature.

  To test if it's one phenomenon or two: Imagine a variant of the exam case where the teacher locked the cabinet but students picked the lock. If the board still blames the teacher for not using a better lock, that's obligation inflation. Now imagine a hallway fight where one passerby was clearly designated as hall monitor. If blame attaches solely to them despite others passing, that collapses the group aspect. If not, we've isolated the floating phenomenon.

  What would change my view? If in the group project, members said "Jamal caused the zero because he has the fastest internet" (purely factual counterfactual) rather than "Jamal caused it because he's unreliable" (duty-based), that would undermine the duty link. Or if when reminded that the cabinet was previously left unlocked without incident, the board retracted rather than expanded the teacher's duties.
answer: |-
  Your observation is razor-sharp and touches deep fault lines in philosophy of causation, responsibility, and language. This **isn't just "causation by omission"** – you've identified a distinct pattern blending **duty-based causal attribution** with **elastic obligation expansion** and **collective deflation**. It sits at the intersection of several concepts but forms a coherent phenomenon. Let's carve it precisely.

  ### Core Phenomenon: "Normative Causation Cascades"
  1.  **Trigger:** A negative outcome occurs where inaction (*omission*) is a necessary condition.
  2.  **Attribution:** Causality is assigned based on *breach of perceived duty* ("should have acted"), not primarily on counterfactual difference-making ("if they acted, outcome likely avoided").
  3.  **Defense under Challenge:** When counterfactual inefficacy is raised (e.g., "locking might not have worked"), the *duty expands* ("should have locked *and* counted *and* removed") to preserve the causal claim, rather than the claim weakening.
  4.  **Collective Diffusion:** If no clear individual duty-bearer exists, causality floats to the *group* ("passers-by caused it") without attaching to any *specific* member, resisting individual pinpointing ("*which* passer-by?").

  ### Why "Causation by Omission" Isn't Enough
  *   Omission theory asks: *"Did the failure to act cause the outcome?"* (e.g., failing to water the plant caused its death). It often *presumes* a duty exists.
  *   **Your cases reveal two layers *beyond* this:**
      *   **Duty Elasticity:** The *content* of the duty stretches to defend the causal attribution against counterfactual challenge. Omission theory typically takes the duty as fixed.
      *   **Attribution Diffusion:** The causal claim persists even when it cannot (or will not) locate a specific duty-bearer within a group, attaching vaguely to the collective. Omission theory usually focuses on identifying *the* agent who failed *their* duty.

  ### Nearby Concepts & Key Distinctions
  1.  **But-For Causation (Sine Qua Non):**
      *   *Resemblance:* Did the omission/action make a difference? (If they acted, would the outcome likely *not* have occurred?)
      *   ***Distinction:*** Your cases show causal claims *persisting* even when But-For is challenged (e.g., unlocked cabinet before w/no leak; determined student could break in). The *duty* carries the causal weight, not the probability of prevention.
      *   *Fits:* Poorly. Counterfactual inefficacy doesn't dissolve the causal claim in your examples.

  2.  **Moral Responsibility:**
      *   *Resemblance:* Deeply intertwined. Blame often tracks perceived duty-breach.
      *   ***Distinction:*** You're observing *causal language* ("caused," "led to") being used *in service of* assigning responsibility/blame, based on duty. The *linguistic practice* of attributing *causation* is doing specific work: it pins the outcome onto the agent/group via the duty-breach. Responsibility is the *goal*, but causation is the *vehicle*.
      *   *Fits:* Closely, but doesn't fully capture the *linguistic mechanism* ("cause") or its specific defenses (duty expansion, group diffusion).

  3.  **Joint Responsibility / Collective Obligation:**
      *   *Resemblance:* Explains the hallway case ("the group should have acted").
      *   ***Distinction:*** Your board uses *causal* language ("passers-by *caused* the injury") for the *collective*, not just responsibility language. Furthermore, this collective causal claim *actively resists* being reduced to individual causal responsibility ("*which one* caused it?"). It's a distinct *level* of causal attribution.
      *   *Fits:* Well for the diffusion aspect, but again, the *causal* framing is key.

  4.  **Scapegoating / Motivated Reasoning:**
      *   *Resemblance:* Explains the group project case (blame sticks to the disliked member).
      *   ***Distinction:*** While bias *influences who* gets the causal attribution, the *underlying structure* of the argument (causation via duty-breach, defended by duty-expansion) remains consistent across cases, even without obvious bias (e.g., the teacher case).
      *   *Fits:* Explains a *trigger* for individual attribution in ambiguous cases, but not the core *structure* of the causal reasoning.

  **Best Fit Synthesis:** This is **Causation Primarily Framed as Normative Breach**. The core driver is the perceived violation of a "should." The causal claim ("X caused Y") functions as a shorthand for "X's failure to meet obligation O was the blameworthy condition enabling Y." The duty-expansion and group-diffusion are *defensive maneuvers* protecting this normative judgment when its factual basis (counterfactual efficacy) is challenged or its target (specific individual) is unclear.

  ### The Asymmetry: Omissions vs. Actions
  *   **Why it's stronger with omissions:** Actions have a clear, discrete event to point to ("punch caused injury"). Omissions are defined *by the absence* of an expected action. This absence only becomes significant *relative to a norm* ("should have locked," "should have reported"). **Duty is constitutive of the omission *as* a cause.** Actions can be causes without duty (e.g., lightning causes fire), but omissions *as causes* almost always imply a duty breached.
  *   **What it tells us:** The asymmetry highlights that in ordinary language, causal claims about omissions are fundamentally **normatively loaded** in a way that claims about many actions are not. "Caused by omission" often means "blameworthy for failing to prevent."

  ### Testing: Is it One Phenomenon or Two?
  **Use these hypotheticals on your board (or in your mind):**

  1.  **Test Duty-Expansion vs. Diffusion (The Janitor Case):**
      *   *Scenario:* A pipe bursts in an unused closet overnight, flooding a classroom. The custodian's checklist includes checking that closet weekly, but they skipped it this week due to illness. The pipe was old and prone to failure; it *might* have burst even if checked yesterday.
      *   *Prediction (One Phenomenon):* Board says custodian's failure to check "caused" the flood. If challenged ("checking might not have caught it"), they expand the duty ("should have checked *and* flagged the old pipes *and* recommended replacement").
      *   *Prediction (Two Phenomena):* Board might drop the causal claim against the custodian if convinced the check wouldn't have helped, focusing blame on facilities management for old pipes (showing duty-expansion is separable). If they *don't* expand the duty but *still* hold the custodian causally responsible, duty-expansion isn't core.

  2.  **Test Collective Diffusion vs. Individual Culpability (The Fire Drill Case):**
      *   *Scenario:* During a surprise fire drill, a student with mobility issues is left behind because the designated "buddy" (Student A) forgot, *but* 5 classmates saw the student struggling and didn't stop to help either. Protocol says only the "buddy" is formally responsible.
      *   *Prediction (One Phenomenon):* Board says "the classmates caused the delay/rescue," *or* insists Student A "caused" it (driven by formal duty) but *refuses* to pin causal responsibility on any of the 5 specific non-buddies who saw and did nothing. The causal claim floats *away* from individuals without formal duty.
      *   *Prediction (Two Phenomena):* Board clearly attributes *causal* responsibility *only* to Student A (the duty-bearer), *or* explicitly attributes causal responsibility to *specific* non-buddies ("Bystander B caused harm by not helping when they saw"). This would show collective diffusion is a separate mechanism.

  **Likely Conclusion:** Duty-expansion and collective diffusion are **defensive strategies within a single phenomenon** – protecting a core claim of causation-via-normative-breach. If the core claim is threatened (counterfactual inefficacy, no clear individual), these strategies kick in. They are symptoms of the normative core.

  ### Confidence & Contestation
  1.  **Core Role of Duty/Norm:** **High Confidence (90%).** The teacher (duty to secure exams), passers-by (implied duty to report danger), group members (implied duty to ensure completion) – causation tracks *breach*. Challenge: If your board readily said "The leak was caused by the students who photographed it, the teacher's lapse just made it easier, but didn't *cause* it," duty's role diminishes.
  2.  **Distinctiveness from Simple Omission:** **Medium-High Confidence (75%).** The duty-elasticity and collective diffusion under pressure are novel *emphases* often glossed over in philosophical discussions focused on establishing omissions *can* be causes. The *how* of attribution in practice is your key contribution.
  3.  **Causal Language vs. Responsibility Language:** **Medium Confidence (65%).** This is the most contestable. Philosophers debate if "cause" is ever truly non-normative. My claim rests on *your observation* of the board *using* "cause" in these ways, which aligns with studies on ordinary language (e.g., work by Joshua Knobe or experimental philosophy on causation). If your board *only* used "responsible" or "blameworthy" and *never* "caused," this part weakens. But your transcripts show "cause."
  4.  **Collective Diffusion:** **High Confidence (85%).** The resistance to naming a specific passer-by is telling. It's not just "they are all responsible," it's "the group *caused* it" as a distinct entity/level.

  ### What Would Change My Mind
  1.  **If Duty Isn't Core:** If, in cases like the teacher or hallway, the board *readily dropped* causal claims when shown the omitted action likely *wouldn't* have made a difference ("Oh, if the lock was that flimsy, then I guess the teacher didn't really *cause* it, the students/school's cheap locks did"), and didn't expand duties, then normative breach is less central than counterfactuals. If they use "cause" purely for actions ("student pressing shutter caused leak") and "responsible" for omissions, duty's link to *causal language* weakens.
  2.  **If It Collapses into Existing Concepts:** If duty-expansion *only* occurred when a *new, specific, pre-existing* duty was identified ("Ah, the handbook *does* say teachers must count copies!"), not invented defensively, it's less elastic and more like discovering relevant duties. If collective diffusion *always* resolved into identifying *the* responsible individual when pressed, it's not a distinct level.
  3.  **If Genuinely New:** If I found a *precise* description of this duty-elasticity/diffusion dynamic defending causal claims in the literature (beyond passing mentions), I'd revise. (I haven't, though it resonates with aspects of Scanlon's contractualism and Gilbert's plural subject theory). If your hypotheticals showed the strategies *don't* cohere around defending normative breach, it might be two things.

  ### Your Analysis & Moving Forward
  You've identified a powerful **rhetorical-inferential pattern** common in blame assignment, especially among groups managing accountability. It leverages causal language to enforce normative expectations, defended by strategically framing duties. This is crucial for your role:

  *   **Intervene:** When you see duty-expansion, ask: "Is this new duty something we genuinely expected *before* this incident, or are we adding it now to justify blaming X?" When causal blame floats to a group, ask: "Can we point to *what any one person* should have done differently that would likely have changed the outcome? If not, is 'caused' the right word?"
  *   **Reframe:** Test replacing "caused" with "failed in their duty to prevent," or "enabled." Does it change the discussion? Often, "enable" feels more accurate for omissions.
  *   **Name it:** "Duty-Tracking Causation" works, but "Normative Causation Cascades" or "Elastic Duty Causation" might capture the expansion/diffusion dynamics better. Use your notes to document its effects.

  Your instinct that this isn't *just* "causation by omission" is correct. You've dissected a sophisticated blend of moral reasoning and causal language that deserves attention. Keep observing – your real-world cases are gold for understanding how people actually assign blame.
