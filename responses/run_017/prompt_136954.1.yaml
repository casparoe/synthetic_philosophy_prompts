  Now, conflicts. Intrinsic implementation vs. avoiding triviality might clash. If a system intrinsically computes only specific things, how do we define that without observer input? Also, causal efficacy without overdetermination is tricky—computation shouldn’t be redundant. Non-negotiable requirements: surviving triviality and specifying grain/timing. Without these, the theory is useless. Representation might be optional depending on the approach.

