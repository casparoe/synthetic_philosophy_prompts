  User’s deeper needs: They want a clear framework to evaluate theories before diving into literature. They’re wary of wasting time on flawed premises. Identifying conflicts helps them navigate the debate strategically. They might be seeking which requirements are essential for a scientifically viable theory versus philosophical preferences. Highlighting that no theory satisfies all could save them effort, directing focus to trade-offs instead.
answer: |-
  Here's a breakdown of the requirements for a substantive "physical system implements computation" theory, designed for neuroscientific applicability, followed by the analysis you requested.

  **Core Requirements (The "Spec"):**

  1.  **Non-Triviality Constraint:** *Must rule out arbitrary mappings.* It must provide principled criteria for why a specific computation (or class of computations) is implemented by the system, excluding mappings that are merely logically possible but physically irrelevant or degenerate. **Worry:** Without this, any rock "implements" any computation, rendering the claim vacuous. Designer's intent cannot be the criterion for natural systems.
  2.  **Grain & Timing Specification:** *Must explicitly address the level of physical detail (grain) and temporal dynamics relevant for the computation.* **Worry:** Does halving the clock speed change the computation? Does grouping neurons into larger functional units change it? A theory must say *how* and *why* the chosen grain/time-scale is the relevant one for claiming implementation, linking it to causal structure and function.
  3.  **Robustness to Perturbations:** *Must account for physical noise, damage, or inputs that don't cleanly correspond to formal inputs.* **Worry:** Brains aren't noise-free, digital circuits. How does the computation persist (or fail) under physical variations that aren't part of its formal input specification? Does "error correction" need to be part of the formal model?
  4.  **Implementation Status:** *Must clarify whether the implemented computation is an intrinsic property of the system or observer-relative.* **Worry:** Is the brain *objectively* running a specific program, or does the computation only exist relative to our description? Intrinsic status seems necessary for scientific objectivity, but is it attainable?
  5.  **Causal Efficacy:** *Must articulate the relationship between computational states and physical causation.* **Worry:** If physics is causally closed, what explanatory work does the computation do? Does it "add" anything, or is it merely a description? A theory needs to show *how* the computational description captures causally relevant structure without overdetermination or epiphenomenalism.
  6.  **Representation Requirement (Optional/Contested):** *Must state whether formal states must carry semantic content (represent something) for the implementation to be meaningful/explanatory.* **Worry:** Can purely syntactic processes (e.g., pattern transformation) explain cognition, or is meaning essential? Does the computation need to be *about* something to be relevant to neuroscience?

  **Analysis:**

  *   **Non-Negotiable:** **Non-Triviality Constraint** and **Grain & Timing Specification** are essential. Without them, the claim lacks empirical content and cannot be meaningfully applied or tested in neuroscience. **Robustness to Perturbations** is also crucial for dealing with real biological systems.
  *   **Negotiable/Contentious:** **Representation Requirement** is the primary camp divider. Some views (strong cognitivism) demand it, others (mechanistic, dynamical systems) find it unnecessary or secondary for the core implementation claim. **Causal Efficacy**'s resolution is deeply philosophical (physicalism vs. emergentism), though *some* account must be given.
  *   **Likely Conflict Pair: Intrinsic Implementation + Non-Triviality.** Achieving a truly *intrinsic* specification of a *non-trivial* computation without smuggling in an observer's perspective or functional role (which might push towards relativity) is extremely difficult. Most non-trivial accounts implicitly rely on systemic function or causal role, which edges towards observer-relativity. **Intrinsic Implementation + Causal Efficacy** also faces the challenge of avoiding overdetermination within physical causal closure.
  *   **Account-Killing Requirement:** The **Non-Triviality Constraint** knocks out **Pancomputationalism** (every physical system implements every computation). **Intrinsic Implementation** requirement significantly challenges most **Systematic-Mapping** views and strict **Pancomputationalism**, often forcing them towards observer-relativity.

  **Views vs. The List:**

  1.  **Systematic-Mapping (e.g., early Putnam):** Focuses on finding a mapping between physical states/transitions and formal states/transitions.
      *   *Fails:* **Non-Triviality** (degenerate mappings possible), **Grain/Timing** (arbitrary choice), **Intrinsic** (mapping is observer-defined). Often struggles with **Robustness**.
  2.  **Mechanistic Information-Processing (e.g., Piccinini, Shagrir):** Computation is defined by the causal structure of components processing medium-independent vehicles according to rules.
      *   *Scores Well:* **Non-Triviality** (constrained by causal structure/function), **Grain/Timing** (explicitly tied to mechanism levels), **Robustness** (handled via mechanism stability/error tolerance), **Causal Efficacy** (computation *is* the causal structure). *Struggles:* **Intrinsic** (often relies on functional role, leaning observer-relative), **Representation** (often seen as separable).
  3.  **Pancomputationalism (e.g., later Putnam, some interpretations of CTM):** Any physical system implements *some* computation under *some* mapping; often implies "implements every computation" under trivial mappings.
      *   *Fails:* **Non-Triviality** (core problem), **Grain/Timing** (arbitrary), **Intrinsic** (vacuous), **Robustness** (meaningless). Renders the claim scientifically useless.

  **The Core Tension:** Satisfying **Non-Triviality**, **Grain/Timing**, and **Robustness** pushes theories towards causal/mechanistic structure (**Mechanistic** view). However, achieving **Intrinsic Implementation** under physical causal closure while preserving substantive **Causal Efficacy** for computation remains a deep philosophical challenge. If intrinsic status is deemed essential but unattainable without observer input regarding function or relevance, then the claim *is* relative, making its "truth" context-dependent. If intrinsic status is relaxed, the **Mechanistic** view provides the most robust framework for neuroscience. The **Representation** divide largely follows this split.
