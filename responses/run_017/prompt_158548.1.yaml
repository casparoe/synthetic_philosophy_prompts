prompt: |-
  Me and a few friends run a war-film night at the library: we watch something, then argue for two hours, and lately we keep going in circles on one thing. Two soldiers are shooting at each other across a border. One side's war is actually unjust, but both soldiers honestly and reasonably believe their own side is in the right. Are they doing the same thing morally? Is it equally ok for each of them to pull the trigger, and equally ok for each to be shot?

  Someone told me this has a name, something like the moral equality of combatants, and from poking around online I gather the "obvious" answer (both are just doing their job, so they're on a par) is actually the contested one, and that the people who reject it then fight among themselves about *why*. I'd love a one-page flowchart for the group: you answer ten or so plain questions and land on a named position.

  What I need from you:

  Build it from the questions, not from a list of views you already know — give me the branch points first, then say which actual positions sit at which leaf, and mark any combination of answers nobody seems to hold (and whether that's because it's incoherent, just unattractive, or only unexplored).

  Rules for the nodes:
  - Nobody should have to know any philosophy to answer. So no "do you think combatants have equal moral standing?" — that's just asking for the label. Every node should be a case or a claim my group would recognise from a film.
  - There should be a pacifist / "no one may ever kill" exit near the top so the rest of the tree isn't wasted on someone who answers that way.

  Cases I definately want used as branch points (you can add two or three of your own, and tell me if any of mine are useless as diagnostics and why):
  - the conscript who was dragged in at gunpoint, lied to about why the war is being fought, and would have deserted if he'd known the truth;
  - the volunteer who joined for the money and doesn't care about the cause either way;
  - the unjust side's soldier who is currently asleep in barracks, or walking home on leave, and threatens no one right now;
  - the medic who only patches soldiers up and has never fired a shot;
  - the civilian programmer who writes targeting software she knows is used for the invasion, but never touches a weapon;
  - the voter who voted for the government that started it (my mate Dave thinks this one is a reductio, I'm not sure it is);
  - the soldier on the *just* side who joined because he enjoys killing, and whose targets really are liable;
  - the case where you honestly can't tell from where you're standing which side is in the right;
  - the case where both sides are partly in the wrong — is everybody killable then, and does that land you in the same place as the "equal anyway" people for a totally different reason?

  Things I especially want handled, because our arguments keep hinging on them:
  - whether it's the *facts* about the war or the soldier's *evidence* that does the work, and whether a soldier who is reasonable but wrong is someone it's ok to shoot;
  - whether being killable tracks what you're responsible for, or just the fact that you're a threat right now (I think someone online called the second one something like no-fault liability);
  - whether "he put on a uniform, he signed up for it" is a real answer or a dodge;
  - my friend's argument that whatever is true, treating both sides as equally killable shortens wars and saves lives, so that's the rule we should publicly use even if it isn't quite fair to the individual;
  - Dave's other hobby-horse: even when killing is permissable you owe something afterwards — he calls it the left-over, the bit you can't wash off — and I want to know whether that's a separate branch or just a footnote on every leaf.

  For each leaf give me the name if the position has one (say "unnamed" if it doesn't), one sentence on the most awkward thing a holder has to swallow, and one sentence each on what it says about the conscript and about the programmer, so we can compare leaves directly. Also flag any two leaves the tree can't really seperate, and tell me what extra question would split them, or say there isn't one.
reasoning: |-
  Okay, let's tackle this war-film night dilemma. The user wants a flowchart to resolve debates about the moral equality of soldiers in war. First, I need to identify the key branch points based on their cases and questions. 

  Starting with pacifism: if killing in war is never okay, that's an early exit. Next, distinguishing between the facts of the war and the soldier's beliefs. If the user's group thinks only the actual justice matters, that leads to positions like orthodox just war theory. If the soldier's reasonable belief counts, that leans toward moral equality.

  Then, assessing liability: is it about responsibility or immediate threat? If responsibility, then factors like conscription or intent matter. For example, the conscript misled might not be liable, while the volunteer for money could be. The sleeping soldier in barracks tests if threat is necessary—some say no liability without immediate danger.

  Cases like the medic and programmer probe complicity. Does aiding without direct killing incur liability? The voter case is trickier—Dave sees it as reductio, but it might extend responsibility beyond combatants. The soldier who enjoys killing on the just side questions motives versus actions. Even if motives are bad, if targets are legitimate, is he still permissible?

  The gray areas: when the war's justice is unclear or both sides share blame. These might collapse into moral equality or require individual assessment. The user also wants practical concerns addressed, like whether treating combatants equally shortens wars. And Dave's "left-over" idea—even if killing is permissible, is there residual guilt?

  Need to ensure each branch uses relatable scenarios, no philosophy jargon. For instance, using the conscript vs. volunteer to illustrate responsibility. The programmer and voter cases test how far liability extends beyond direct combatants. 

  Also, flagging where positions might be indistinct. For example, orthodox just war and collectivist views both hold the unjust soldier liable, but differ on why. Adding a question about the sleeping soldier could split them—orthodox might still consider him a threat, while collectivists focus on role-based liability.

  Finally, for each leaf, note the position's name, its toughest implication, and how it handles the conscript and programmer. This helps the group compare outcomes directly.
answer: |-
  Here's a one-page flowchart designed to resolve your debates, built from concrete cases and avoiding philosophical jargon. Positions emerge from your answers, not the other way around. **Bold text** indicates branch questions/answers, *italic* is position info.

  ---

  **START: Is it ever morally permissible for a soldier to intentionally kill an enemy combatant in war?**
  *   **No. (Pacifist Exit)**
      *   *Position:* **Pacifism/Strict Non-Violence.** *Most awkward swallow:* Even killing a genocidal invader actively murdering civilians is wrong. *Conscript:* Killing him is murder. *Programmer:* Aiding killing is deeply wrong.
  *   **Yes. → Proceed.**

  **Q1: Does the *actual justice* of the war (who truly started it, why, etc.) matter for whether it's OK to kill a specific soldier, or only what that soldier *reasonably believes*?**
  *   **The actual justice matters. → Go to Q2.**
  *   **Only what the soldier reasonably believes matters. → Go to Q3.**

  **Q2: (Actual Justice Matters) Is the sleeping soldier in barracks (posing no immediate threat) a legitimate target?**
  *   **Yes. → Go to Q4.**
  *   **No. → Go to Q5.**

  **Q3: (Beliefs Matter) Is the conscript (lied to, forced, would have deserted) doing something morally different from a similar soldier on the just side?**
  *   **Yes, he's morally better / less liable to be killed. → *Position:* **Moderate Revisionism (e.g., McMahan-Influenced)**. *Awkward swallow:* A soldier can be morally liable to be killed even if entirely reasonable, blameless, and deceived. *Conscript:* Not liable to be killed (unless actively threatening). *Programmer:* Potentially liable if responsible for significant harm.**
  *   **No, they are morally equal as combatants. → *Position:* **Moral Equality of Combatants (MEC)/Traditional Just War**. *Awkward swallow:* Killing an innocent defender of their homeland is as permissible as killing a genocidal invader. *Conscript:* Liable to be killed while actively fighting. *Programmer:* Not liable (unless directly participating).**

  **Q4: (Sleeping Soldier is Target) Why is the sleeping soldier targetable?**
  *   **Because he's part of the unjust war machine; his role makes him liable. → *Position:* **Collectivist Liability/Strong Revisionism**. *Awkward swallow:* Soldiers on leave, sleeping, or non-combatant roles (like cooks) in an unjust army are legitimate targets. *Conscript:* Liable even if deceived/forced (due to role). *Programmer:* Potentially liable if contribution is significant.**
  *   **Because he's a future threat; stopping him now prevents future harm. → *Position:* **Utilitarian/Consequentialist Warfare**. *Awkward swallow:* Killing a surrendering soldier *might* be permissible if it demonstrably saves more lives overall. *Conscript:* Targetable if future threat outweighs cost. *Programmer:* Targetable if vital to war effort & impact justifies it.**

  **Q5: (Sleeping Soldier NOT Target) Is liability based on immediate threat *or* responsibility for the unjust threat?**
  *   **Immediate threat. You can only kill someone posing a direct danger *right now*. → *Position:* **Restrictive Liability/Innocent Threat Model**. *Awkward swallow:* A soldier actively firing at innocents *cannot* be shot if he pauses to reload (not an *immediate* threat at that second). *Conscript:* Not liable unless literally pulling the trigger. *Programmer:* Never liable (no immediate threat).**
  *   **Responsibility. Liability comes from contributing to the unjust threat, even if not immediate. → *Position:* **Orthodox Just War Theory (OJW)**. *Awkward swallow:* A deceived conscript actively fighting *is* liable to be killed because he contributes to the unjust threat. *Conscript:* Liable *while actively fighting* (contributing). *Programmer:* *Generally* not liable (not directly contributing to combat).**

  **Q6: (From Q5 - 'Responsibility' path) Is the volunteer (fighting only for money, doesn't care about cause) just as liable as a true believer on the same (unjust) side?**
  *   **Yes. → *Position:* **Orthodox Just War Theory (OJW)** (as above).**
  *   **No, he's less responsible/less liable. → *Position:* **Individualist Revisionism**. *Awkward swallow:* Requires complex judgments about individual motives/knowledge in the fog of war. *Conscript:* Not liable (coerced, deceived). *Volunteer:* Potentially liable (chose to participate for gain). *Programmer:* Unlikely liable (distant contribution, not combat).**

  **Q7: (Any path where killing combatants is sometimes OK) Does treating both sides' combatants as equally killable (regardless of war's justice) lead to *better outcomes* (shorter wars, fewer deaths)? Should we use this rule publicly?**
  *   **Yes, we should use the rule for practical reasons. → *Adds:* **Pragmatic Acceptance of MEC**. (This is a modifier on any non-pacifist leaf position except strict 'Immediate Threat' or 'Moderate Belief Revision'). *Awkward swallow:* We publicly endorse a rule we believe is fundamentally morally inaccurate/fair. *Footnotes Conscript/Programmer:* Public rules treat them the same, private moral assessment differs based on position.**
  *   **No, truth and justice matter more than pragmatism here. → *No modifier.* (Holds underlying position without pragmatic compromise).**

  **Q8: (Any path where killing is sometimes permissible) Does permissible killing in war always leave a "left-over" moral burden (guilt, need for reparations, etc.)?**
  *   **Yes. → *Adds:* **Moral Residue / Inescapable Wrong-Making**. (This is a modifier on *every* non-pacifist leaf position). *Awkward swallow:* Even killing a genocidal murderer actively killing children burdens the killer. *Footnotes All:* Dave's "bit you can't wash off" applies universally.**
  *   **No. Killing can be a clean, duty-bound act with no lingering burden. → *No modifier.* (Killing can be morally neutral or positive in context).**

  ---

  **Key Diagnostics & Your Cases Explained:**

  *   **Conscript (lied to, forced):** Splits positions based on whether coercion/deception negates liability (Q3, Q6) vs. role/threat (Q4, Q5).
  *   **Volunteer (for money):** Tests if motive affects liability (Q6).
  *   **Sleeping Soldier:** Crucial! Splits "Actual Justice" branch (Q2). Rejecting him as a target implies liability requires more than just role/membership.
  *   **Medic:** Implied in Q4/Q5. Most positions (except Strong Collectivism Q4) *don't* consider non-combatant medics legitimate targets. MEC/OJW explicitly protect them.
  *   **Programmer:** Tests scope of liability. Only Strong Collectivism (Q4) or Utilitarianism (Q4) *might* target them directly. Others see them as civilians, not directly targetable.
  *   **Voter:** Implied. Most positions (except extreme Collectivism/Pragmatic MEC *public* rule) see voters as civilians, not liable to attack. Dave's reductio holds unless you embrace total war logic (not covered here, needs separate "Total War" branch).
  *   **Soldier (just side, enjoys killing):** His motive is generally irrelevant to the permissibility of *others* killing *him* (he's still a just combatant). It *might* affect whether *his own* killing acts are justified (needs separate branch on "Jus In Bello" not included).
  *   **Can't Tell / Both Partly Wrong:** Leads naturally to MEC (Q3) or Utilitarianism (Q4). Individualist positions struggle here.
  *   **Facts vs. Evidence:** Core split at Q1. Q3 explores the "reasonable but wrong" soldier further.
  *   **Responsibility vs. Threat:** Core split at Q5.
  *   **"Put on a Uniform":** This is the core of MEC (Q3) and Collectivism (Q4). Revisionists (Q3, Q6) reject it as sufficient.
  *   **Pragmatism (Shorten Wars):** Handled by Q7 as a modifier.
  *   **Dave's "Left-Over":** Handled by Q8 as a universal modifier.

  **Unused/Combined Cases:** The "enjoys killing" soldier didn't provide a unique split. "Both partly wrong" naturally funnels to MEC/Utilitarianism. Adding "Total War" (civilians = targets) or "Perfect Self-Defense Only" would need extra branches.

  **Ambiguous Splits / Needed Questions:**

  1.  **Orthodox Just War (Q5/Q6) vs. Collectivist Liability (Q4):** Both hold the *actively fighting* unjust soldier liable. *Split:* Add **"Is the medic/non-fighting cook a legitimate target?"** Collectivist=Yes (if unjust side), OJW=No.
  2.  **Moderate Belief Revision (Q3) vs. Individualist Revisionism (Q6):** Both distinguish based on individual circumstances. *Split:* Add **"Does the conscript actively firing *right now* become liable simply by being a threat, despite being deceived/forced?"** Moderate Belief Revision=Yes (if threat), Individualist Revisionism=Probably No (lacks responsibility).

  Use this flowchart at your next film night! Track your path through the questions and see where your intuitions lead you – and where they clash with your friends'.
