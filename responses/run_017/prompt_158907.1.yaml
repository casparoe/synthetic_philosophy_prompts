prompt: |-
  Hi — I host a tiny linguistics-adjacent podcast (around 300 listeners, mostly my old department plus some friends from grad school), and next week my guest is a psycholinguist who's just published a book defending what she calls "obligatory-category relativism". Rough version, as I take it: the Whorfian effects that actually replicate only show up where the grammar *forces* you to code something on essentially every utterance — evidentials, aspect, grammatical gender, honorifics — and not where a language merely lacks a word (the whole "Eskimo words for snow" genre of example is exactly what she says is irrelevant). And the mechanism isn't that your concepts get reshaped; it's that mandatory coding builds an encoding habit, and the habit survives as a retrieval cue, so effects show up in memory and in tasks where you have to hold something online, not in what you can perceive or reason about in the moment. Her flagship new claim, and the reason I booked her, is about evidentiality: obligatory evidential marking does not give speakers a richer concept of evidence at all, it just attaches a mandatory source-tag to the memory, so speakers of an evidential language do better on delayed source monitoring (did you see this, or were you told it?) but are no better at weighing testimony, discounting hearsay, or resisting bullshit generally.

  Here's my problem: every time I've heard her on other shows she gets the same four easy questions — the Hopi-and-time thing, the snow-lexicon thing, the colour studies, the "so you think language determines thought?" thing — and she fields them in her sleep, largely with the move "that's the strong version, nobody defends that anymore". I want eight to ten questions that make that move useless. Concretely: I need at least one that seperates her retrieval-cue mechanism from Slobin's "thinking for speaking" in a way she can't just answer "yes, and I'm happy with that"; one that presses the bilingual and schooling/literacy confounds in the evidentiality work (how would you ever tell an evidentiality effect apart from the fact that some speakers get drilled way more, in school or in court, into saying where they got what they know?); one about the metalanguage problem — if the languages differ in what they force you to encode, what language are the experimenter's own task instructions and theory written in, and what makes her description of the difference neutral; one on the light-blue/dark-blue style colour results in Russian speakers, where the obvious worry is that a fast-discrimination advantage isn't a perceptual effect at all but a naming or response strategy; one about reverse causality, i.e. why we shouldn't say languages *acquire* evidentials because speakers already needed to track sources; and one where I ask her flat out what experimental result would make her give up obligatory-category relativism, since "the effects are narrow" can start to sound like it predicts nothing. For each question please also give me the answer she's most likely to give and then the follow-up that answer walks straight into — I want to be ready in the moment, not scrabling for a reply while she talks.

  Two more things about the room. My co-host is a hardline nativist who'll be sitting in and will use any opening to announce that the whole research programme died in the 1970s, so one of the questions should preempt him without just picking a fight; and there's a crude version of this stuff that gets used in bad political ways ("these people literally cannot think X"), so I'd like one question about whether narrowing the claim the way she does genuinely defuses that, or just makes it harder to notice when it's happening. Oh, and a listener question I promised to squeeze in: if mandatory source-tagging really does help source memory, does that give an argument for changing how witness testimony gets recorded? She can answer that one badly, I just want the question and one follow-up. No warm-up questions please, and definitely don't have me ask her what got her into linguistics.
reasoning: |-
  Okay, let's tackle this query. The user hosts a small linguistics podcast with around 300 listeners, mostly from their academic circle. Their guest is a psycholinguist advocating "obligatory-category relativism," which argues that Whorfian effects occur only when grammar forces coding on every utterance (like evidentials or grammatical gender), not merely due to lexical gaps. The mechanism involves encoding habits affecting memory and retrieval, not reshaping concepts or real-time perception.

  The user's main challenge is crafting questions that go beyond the usual surface-level ones this guest easily handles. They need 8-10 questions that force deeper engagement, avoid letting her dismiss with "that's the strong version," and cover specific angles: distinguishing her theory from Slobin's, addressing bilingual/schooling confounds in evidentiality studies, the metalanguage problem, color perception studies, reverse causality, falsifiability, preempting their nativist co-host, political misuse, and a listener question about legal testimony.

  To start, I need to understand the core of her theory. Her key points are: effects only from obligatory grammatical categories, not lexical gaps; mechanism is habitual encoding affecting memory retrieval, not concepts or real-time cognition; new claim on evidentiality improving source memory but not evidence evaluation.

  The user wants several targeted questions. For example: 

  1. **Slobin vs. Her Mechanism**: She might say Slobin is about online processing while hers is about memory retrieval. But the follow-up could question if online planning has downstream memory effects, blurring the lines.

  2. **Bilingual/Schooling Confounds**: She might argue for controlling variables, but the follow-up could challenge whether such controls are possible in real-world settings like legal systems.

  3. **Metalanguage Problem**: Her likely answer is using a contact language, but how does that avoid imposing categories? Follow-up on whether cross-linguistic comparisons are compromised.

  4. **Color Perception Studies**: She'll distinguish perceptual vs. naming effects, but follow-up on whether the task itself requires verbal encoding, complicating claims.

  5. **Reverse Causality**: She'd say the grammaticalization process is slow, but follow-up on why communities without evidentials still track sources meticulously.

  6. **Falsifiability**: She might cite a null result in a perception task, but what specific finding would challenge her core mechanism?

  7. **Preempting the Nativist Co-host**: Frame a question on how her work interfaces with universal grammar, allowing her to address nativist concerns without direct confrontation.

  8. **Political Misuse**: She'll say her narrow claim avoids determinism, but follow-up on whether obligatory categories could still be weaponized in policy contexts.

  9. **Legal Testimony Listener Question**: Ask if mandatory source-tagging in language improves reliability of witness testimony. Her answer might focus on lab vs. real-world, follow-up on pilot programs testing this.

  Each question needs to push her beyond rehearsed answers. The follow-ups should expose potential weaknesses or force deeper explanation. Also, the co-host's nativist views and political implications are important context.

  For the bilingual confound, it's crucial to highlight that schooling or legal training might mimic evidential effects. The metalanguage problem questions the neutrality of experimental designs. Reverse causality challenges if culture shapes grammar rather than vice versa. Falsifiability ensures her theory isn't unfalsifiable. Preempting the co-host involves showing how her work complements universalist approaches. The political angle addresses real-world misuse risks.

  The listener's legal testimony question ties her research to practical applications, but she might downplay direct applicability. The follow-up could ask about empirical tests in legal settings.

  Overall, structuring each question to avoid yes/no, anticipate her answers, and design follow-ups that challenge her points without being confrontational. Ensuring questions are specific, evidence-based, and force her to defend the uniqueness and testability of her theory.
answer: |-
  Here are 8 tightly focused questions designed to bypass her standard defenses, including anticipated answers and tactical follow-ups. Each question targets a specific vulnerability or implication of her framework, forcing engagement beyond the "strong version" dismissal.

  ---

  ### 1. Distinguishing Mechanism from Slobin  
  **Question:** "You argue your retrieval-cue mechanism differs from Slobin’s ‘thinking for speaking’ by being memory-specific, not online planning. But if online grammatical encoding *builds* the habit that later aids retrieval, isn’t this just Slobin-plus-memory? What uniquely *predicts* your theory that Slobin’s doesn’t?"  
  *Likely Answer:* "Slobin focuses on transient utterance formulation. My mechanism is about enduring memory traces from habitual encoding."  
  **Follow-Up:** "If Slobin’s process creates the habit, and the habit causes memory effects, doesn’t that make your mechanism parasitic? Couldn’t a Slobinian just say your results are downstream consequences of *their* process?"  

  ### 2. Bilingual/Schooling Confounds in Evidentiality  
  **Question:** "In your evidentiality work, how do you disentangle effects of grammatical obligation from cultural practices like formal education or legal testimony norms? A speaker drilled in court to say ‘I saw X’ might excel at source monitoring *without* evidentials."  
  *Likely Answer:* "We control for education/literacy and test monolinguals in naturalistic settings. The effect persists."  
  **Follow-Up:** "But if the grammar emerges *because* a culture values source-tracking (e.g., legal systems), isn’t the ‘habit’ culturally scaffolded? Your lab task might just be measuring *that*."  

  ### 3. The Metalanguage Problem  
  **Question:** "When you describe a language as ‘forcing’ encoding of [category X], your analysis relies on metalanguage—often English—which lacks those categories. Doesn’t this circularly impose *your* analytic framework? How can your description be neutral?"  
  *Likely Answer:* "We use semantic primitives and collaborative fieldwork with native linguists to avoid bias."  
  **Follow-Up:** "But if your theory claims obligatory categories *shape* cognition, yet your *own* cognition (via English) defines ‘obligatory’, aren’t you presupposing the very universality you reject?"  

  ### 4. Color Discrimination: Perception or Labeling?  
  **Question:** "Take the Russian blue studies: faster discrimination of light/dark blues (siniy/goluboy) is framed as a Whorfian effect. But couldn’t this just be faster lexical retrieval under time pressure—not altered perception?"  
  *Likely Answer:* "Exactly! We’d predict *no* advantage in purely perceptual tasks without verbal encoding."  
  **Follow-Up:** "Then why cite it as evidence *for* relativism? Doesn’t this concede it’s a task-specific labeling effect, irrelevant to ‘thought’?"  

  ### 5. Reverse Causality: Grammar vs. Cultural Need  
  **Question:** "Couldn’t obligatory evidentials arise *because* a community already prioritizes source-tracking (e.g., for social cohesion)? If so, the ‘habit’ predates the grammar. Why assume grammar *causes* the habit?"  
  *Likely Answer:* "Grammaticalization takes centuries. The habit crystallizes *with* the grammar."  
  **Follow-Up:** "But cultures without evidentials (e.g., scientific communities) track sources meticulously. Doesn’t this suggest the habit is culturally, not grammatically, driven?"  

  ### 6. Falsifiability: What Would Kill the Theory?  
  **Question:** "You say effects are narrow: memory, not perception/reasoning. What result *would* falsify obligatory-category relativism? If a study found grammatical gender reshaped real-time reasoning, would you abandon the theory?"  
  *Likely Answer:* "No—we’d check task demands. True reasoning effects would require extraordinary evidence."  
  **Follow-Up:** "If *every* counter-result is dismissed as ‘task demands’, doesn’t ‘narrow effects’ become unfalsifiable? What *specific* finding would force a rethink?"  

  ### 7. Preempting the Nativist Co-Host  
  **Question:** "Let’s bridge frameworks: Your ‘encoding habit’ sounds like performance. Couldn’t a nativist say this is just how universal competence interfaces with variable grammatical ‘triggers’?"  
  *Why it preempts:* Forces *her* to engage nativism ("Yes, absolutely—this isn’t *against* universals...") and frames habit as performance, not competence. Sidesteps confrontation by making *her* build the bridge.  

  ### 8. Political Misuse: Narrow Claim, Broad Implications?  
  **Question:** "You reject strong determinism, but could ‘obligatory categories’ still be weaponized? E.g., ‘Language X lacks evidentials, so its speakers are unreliable witnesses.’ Does narrowing the claim *actually* prevent misuse, or just obscure it?"  
  *Likely Answer:* "Misusers ignore nuance. My work shows cognition isn’t *limited*, just memory aided."  
  **Follow-Up:** "But if you publish ‘Evidential-language speakers better at source memory’, won’t that *fuel* ‘Language Y speakers are worse’ narratives? Isn’t relativism inherently risky when tied to specific languages?"  

  ---

  ### Listener Question + Follow-Up  
  **Question:** "A listener asks: If obligatory source-tagging improves source memory, should courts mandate structured testimony formats (e.g., ‘I saw/heard that...’) for all witnesses?"  
  *Likely Answer:* "Lab ≠ courtroom. Real-world stress/complexity may swamp effects."  
  **Follow-Up:** "But if the mechanism is ‘habit from forced encoding’, wouldn’t *mandating* that encoding in court *build* the habit? Shouldn’t we test this?"  

  ---  
  **Why this works:**  
  - **No warm-ups/softballs:** Jumps straight into conceptual tension.  
  - **Blocks easy dismissals:** Questions are phrased to require engagement with mechanics (e.g., "What uniquely *predicts*...?", "How do you disentangle...?").  
  - **Follow-ups target evasion:** Each anticipates her deflection and counters it (e.g., the falsifiability follow-up traps "task demands" as a dodge).  
  - **Co-host neutralized:** Question 7 makes *her* acknowledge nativism’s role, depriving him of oxygen.  
  - **Political edge:** Question 8 forces her to confront real-world stakes beyond academia.  

  **Delivery Tip:** After her answers, pause briefly before the follow-up. It signals thoughtful engagement, not interrogation. Good luck—this is a killer lineup.
