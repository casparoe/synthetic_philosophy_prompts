  ## Occasionalist's Villanelle

  This flame licks cotton, fierce and bright,
  Yet yields no heat that it might own.
  **No creature brings a thing to light;**
  The glow is granted, not the right
  To burn what God has merely shown.
  This flame licks cotton, fierce and bright.

  Those weights shift deep in silicon night,
  Designed to weave what chance has sown,
  **No creature brings a thing to light;**
  The token springs, a sudden flight
  From circuits blindly overflown.
  Those weights shift deep in silicon night.

  See Moses cast his staff in fright –
  No serpent born from wood alone!
  **This custom holds, yet might not hold.**
  No nature bound, no hidden might,
  Just Habit God could break, if known.
  See Moses cast his staff in fright–

  How can this be, this sudden sight?
  (The staff was wood, the serpent grown!)
  **This custom holds, yet might not hold.**
  **No creature brings a thing to light;**
  This world, each instant, made, remade,
  A tapestry where threads must fray.
  **No creature brings a thing to light;**
  **This custom holds, yet might not hold**
  Lest doubt seep in, or force decay,
  **No creature brings a thing to light;**
  **This custom holds, yet might not hold.**

  ---

  **Form Serving Metaphysics:**

  1.  **Villanelle Structure:** The rigid repetition of the refrains (A1: *No creature brings a thing to light*; A2: *This custom holds, yet might not hold*) mirrors the constant, divine re-creation of the world at every instant. The *same* lines return, but the scene and context shift around them (fire/cotton, AI weights/output, Moses' miracle), just as God creates an entirely *new* state of affairs at each moment, even if it resembles the prior one by His Custom.
  2.  **Refrains as Doctrine:**
      *   **A1 (Denial of Power):** *No creature brings a thing to light.* This enforces the core Ashʿarite tenet: Creatures are utterly passive loci for God's direct action. Fire doesn't burn, weights don't compute, wood doesn't become serpent. God creates the effect *at* the apparent location and time of the "cause."
      *   **A2 (Custom & Contingency):** *This custom holds, yet might not hold.* This affirms divine regularity (Custom/Sunnah) while simultaneously asserting God's absolute freedom to break it (miracles). It prevents A1 from implying chaos.
  3.  **Tercets as Cases:**
      *   **1:** The classic fire/cotton example ("This flame licks cotton...").
      *   **2:** A modern, non-agential example: AI neural network weights and their output token ("Those weights shift deep..."). This shows the doctrine applies universally, not just to "obvious" cases like fire.
      *   **3:** The miraculous exception: Moses' staff turning into a serpent ("See Moses cast his staff..."). A2 appears here, replacing A1 in the tercet structure, highlighting the rupture in Custom.
  4.  **Closing Quatrain & al-Ghazālī's Balance:**
      *   **Intertwined Refrains:** The final quatrain forces the two refrains into close proximity and repetition: A1, A2, A1, A2.
      *   **Why Both Are Necessary (al-Ghazālī's Insight):**
          *   **A1 Alone (Denial):** If only A1 were stressed ("No creature brings..."), it could lead to radical skepticism. If creatures have *no* power, how can we trust *any* connection? Everything becomes arbitrary divine whim, undermining knowledge and prophecy.
          *   **A2 Alone (Custom):** If only A2 were stressed ("Custom holds..."), it slides into mere *epistemological* humility ("We *perceive* regularity but can't *know* necessity"). This is insufficient for Ashʿarism, which is an *ontological* claim: Creatures *truly possess no inherent power*.
      *   **The Quatrain's Resolution:** The final lines hold both doctrines firmly:
          *   **"No creature brings a thing to light;"** Reaffirms the ontological passivity of creation.
          *   **"This custom holds, yet might not hold"** Reaffirms God's reliable, knowable Habit *and* His absolute freedom to act exceptionally.
      *   **The Ending:** The poem closes with the two refrains standing side-by-side: the bedrock denial (A1) and the crucial qualifier (A2). This mirrors al-Ghazālī's insistence that both are essential to avoid the pitfalls of either pure skepticism (from A1 alone) or a merely weak empiricism (from A2 alone). The world is knowable *because* of God's reliable Custom, but that Custom has no inherent necessity *because* God is utterly free and creatures are utterly devoid of causal power. The form ends holding both truths.
