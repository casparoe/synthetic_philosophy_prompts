                                        [Leaf 5: Stratified comprehension] (e.g., NF)
                                           - What you lose: You cannot form collections with unstratified properties (e.g., the property "x is not in y" is unstratified if we don't assign the same type to x and y), and the system may prove counterintuitive results (like the negation of the axiom of choice).
                                     No -> 
                                        [Q6] Do you assign a formation stage to every property and allow the property to quantify only over collections formed at strictly earlier stages?
