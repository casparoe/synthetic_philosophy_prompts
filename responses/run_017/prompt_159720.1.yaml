prompt: |-
  I'm the curator of exhibits at a regional history museum — about 60,000 visitors a year, a staff of nine, a small endowment, and a mission statement that commits us to starting from primary sources and from the people who made them. Eight to twelve times a year I'm asked to evaluate a proposal that rests on what I think of as an alternative chronology: Atlantis identified with a specific real place, "ancient astronauts" credited with a regional earthwork, or a Fomenko-style claim that the accepted chronology of our region is a fabrication and that the documents establishing it are forgeries. These are not crank letters. They arrive as traveling-exhibit rentals or donor-backed local shows, with polished catalog copy, renders, footnotes, and sometimes a named benefactor. I have about two working days per proposal. My training is in public history, not in archaeology, in the periods involved, or in the philosophy of science; my recommendation goes to the director and then to a community advisory board that includes several members who think the museum is elitist for dismissing this material. The decisions are public and have twice ended up in the local paper.

  What I need is a written procedure I can actually run, not an essay about pseudoscience. Please give me:

  1. An ordered set of tests, each with a statement of what counts as a sufficient answer, and an explicit stop rule — where the procedure terminates in a no rather than continuing to gather more information.
  2. A fixed output vocabulary my board can vote on instead of voting on vibes. I'd like something like ENDORSE AS HISTORY / PRESENT AS LEGEND AND FOLKLORE / RETURN FOR REFRAME / ESCALATE TO OUTSIDE SPECIALIST / DECLINE, with a one-paragraph finding naming the specific test that decided it. Adjust the categories if you think they're wrong.
  3. Marked hand-off points: where the procedure stops and hands the decision to a person because the remaining question is one of values (what we owe a community whose identity is tied to a story; whether exhibiting a debunked claim as folklore is itself worthwhile), and where it hands off because the question needs expertise I don't have.

  Three things the procedure has to get right, which is where I keep failing:

  - It must not reduce to deference to consensus or to credentials. Some of these proposals point at real open questions, and I don't want a checklist whose entire content is "do the specialists agree." Give me a positive route by which a genuinely novel claim passes, stated in terms I can check in the proposal packet itself.
  - It must handle the "just asking questions" format: label copy that is technically hedged — some researchers suggest, ancient texts tell us, could it be? — while doing all the work of an assertion, and the side-by-side panel layout that presents a mainstream account and an alternative account as two equal options with the visitor invited to choose. If that symmetry is itself the error, say so and say why.
  - It must be honest about which steps are judgment calls wearing a procedure's clothing, and about the ways I am likely to misuse it — my pull toward contrarian sympathy, my pull toward institutional self-protection.

  Then run it on three actual proposals, in roughly 150 words each:

  (a) Atlantis placed in a sinkhole lake in our own county, "recovered" from Plato's account by a retired civil engineer, with a sonar anomaly from a 1990s survey as the physical evidence; sponsored by a local businessman who has offered to fund the gallery.

  (b) A 4,000-square-foot rental called *Mysteries of the Ancient World — You Decide*: paired panels, mainstream explanation on the left, alternative on the right, every section closing with a prompt inviting visitors to make up their own minds. It is the vendor's highest-grossing show, it is cheap, and a board member's family foundation has offered to underwrite it. If the procedure lands somewhere that costs me revenue and goodwill, say that plainly rather than softening it.

  (c) A local author's "New Chronology of the Valley": dense apparatus, statistics on the lengths of documented reigns and successions, the claim that our founding charter is a much later forgery, an account of why archivists and dating labs would sustain the error — and one genuinely unsettled scholarly question, since two specialists do in fact disagree about whether the earliest surviving copy of that charter is a period document or a later transcription. My instinct is to reject the whole thing. Tell me if the procedure requires me to salvage the kernel.

  Close with a short list of what the procedure cannot do. Keep the whole response under 1,200 words, with the procedure itself under 600.
reasoning: |-
  Okay, the user is a museum curator facing a specific challenge: evaluating alternative chronology exhibits. They need a practical procedure, not theory. Their pain points are clear—time constraints (two days per proposal), lack of specialized expertise, and political pressure from board members and donors. 

  First, I need to design a procedure that's both rigorous and executable. The key requirements are:
  - Avoids reliance on academic consensus alone
  - Handles "just asking questions" framing
  - Explicitly flags judgment calls
  - Outputs clear decision categories

  The three sample proposals are telling: 
  (a) Local Atlantis claim taps into regional pride and funding temptation 
  (b) "You Decide" format that falsely equates fringe with mainstream 
  (c) A mixed case with one legitimate scholarly dispute buried in pseudohistory 

  For the procedure structure, I'll build it around evidence chains. Start with testable claims rather than credentials. The "burden of proof" concept from philosophy of science seems useful here—the claimant must provide positive evidence. 

  The trickiest part is handling the veneer of academic rigor in these proposals. Footnotes and sonar images can look convincing. So the procedure must dissect how evidence is presented, not just what's presented. The "symmetry" test for exhibit framing is crucial—false balance is a common trap.

  For output categories, I'll adapt the user's suggestions but add "ESCALATE" for when real expertise is needed beyond my capacity. The "RETURN FOR REFRAME" option is important for salvageable proposals with community value.

  On limitations: The procedure can't resolve genuine scholarly debates, and it won't satisfy proponents who see any rejection as elitism. That honesty is necessary—the user needs to manage board expectations.

  For the test cases: 
  - The Atlantis proposal fails at evidence coherence (sonar anomaly ≠ lost city) 
  - The rental exhibit gets declined due to false equivalence 
  - The chronology claim gets escalated—that one legitimate dispute needs specialist input 

  The word count is tight, so every test must pull weight. I'll keep the procedure under 600 words by using bullet-like structure without markdown. Sample evaluations will be brutalist—just the decisive test and outcome.
answer: |-
  Here is a procedure designed for your operational constraints and challenges:

  **Procedure: Evaluating Alternative Chronology Proposals**

  1.  **Claim Identification:** Extract the *core, testable historical claim(s)* from the proposal. Ignore framing, rhetoric, and funding sources. *Sufficient Answer:* A clear statement like "X existed at location Y in time Z" or "Document A is a forgery created in period B." *Stop Rule:* If no core testable claim is identifiable, DECLINE. (e.g., "It's a mystery" isn't testable).

  2.  **Evidence Coherence:** Does the proposed evidence *directly and exclusively* support the core claim, logically ruling out mainstream explanations? *Sufficient Answer:* Proposal shows why mainstream evidence *must* be wrong *and* why its evidence *only* fits the alternative. *Stop Rule:* If evidence is ambiguous, fits mainstream explanations better, relies on special pleading (e.g., "all critics are part of a conspiracy"), or misrepresents sources, DECLINE or PRESENT AS LEGEND.

  3.  **Methodology Transparency:** Are the methods used to interpret evidence (e.g., textual analysis, dating techniques, statistical models) clearly described and replicable? *Sufficient Answer:* Methods are named, explained in sufficient detail for a specialist to understand the approach, and applied consistently. *Stop Rule:* If methods are opaque, proprietary, misapplied, or fundamentally unscientific (e.g., unfalsifiable claims), DECLINE. **Hand-off (Expertise):** If methods are legitimate but outside your expertise (e.g., advanced archaeometry, statistical validity), ESCALATE TO OUTSIDE SPECIALIST.

  4.  **Falsifiability & Burden of Proof:** Does the proposal state what evidence *could* disprove its claim? Does it meet the burden of proof for an extraordinary claim? *Sufficient Answer:* Proposal acknowledges potential counter-evidence and provides robust, primary-source/empirical evidence commensurate with the claim's radical nature. *Stop Rule:* If unfalsifiable, shifts burden of proof onto skeptics ("prove it's *not* Atlantis"), or evidence is solely circumstantial/interpretive without primary/empirical anchor, DECLINE or PRESENT AS LEGEND.

  5.  **Exhibit Framing Assessment:** How is the claim presented? *Sufficient Answer:* Framing accurately reflects the evidential status (e.g., minority view, debunked theory, folklore) and avoids false equivalence. *Stop Rule:* "Just asking questions" or paired-panel "You Decide" formats that imply equivalent scholarly weight between mainstream consensus and fringe theory without explicit, accurate contextualization are grounds for DECLINE or RETURN FOR REFRAME. **Hand-off (Values):** If the claim fails tests 1-4 but has significant community cultural value, RETURN FOR REFRAME explicitly as folklore/community narrative (requiring Director/Board decision on mission alignment).

  **Output Vocabulary & Finding:**

  *   **ENDORSE AS HISTORY:** Passes all tests 1-4. Core claim is testable, evidence coherent & probative, methods sound/transparent, falsifiable, meets burden of proof. Finding: "Proposal provides sufficient, coherent, and methodologically sound evidence supporting its core historical claim [Specify Claim]."
  *   **PRESENT AS LEGEND AND FOLKLORE:** Fails tests 1-4 but has cultural resonance. Finding: "While the core claim [Specify Claim] lacks sufficient historical evidence per tests [List Failed Tests], it holds value as regional folklore/cultural narrative. Recommended for exhibition *only* with explicit framing as such."
  *   **RETURN FOR REFRAME:** Fails framing test (5) but core claim might pass 1-4 or has significant community value. Finding: "Current exhibit framing ([Describe, e.g., false equivalence]) is unacceptable. Proposal may be reconsidered if reframed to accurately reflect [Specify required change, e.g., 'the fringe status of the claim,' 'as community legend']."
  *   **ESCALATE TO OUTSIDE SPECIALIST:** Requires expertise beyond curator's scope (Test 3 Hand-off). Finding: "Assessment of methodology/evidence for core claim [Specify Claim] requires specialized expertise in [Specify Field]. Recommend independent review."
  *   **DECLINE:** Fails one or more Stop Rules decisively (Tests 1, 2, 4, or 5). Finding: "Proposal fails at [Specify Test & Reason, e.g., 'Test 2 (Evidence Coherence): Sonar anomaly is ambiguous and does not exclusively support identification as Atlantis']."

  **Procedure Limitations:**

  1.  Cannot *resolve* genuine, complex scholarly disputes (only flag for escalation).
  2.  Cannot guarantee community acceptance, especially if identity is tied to a narrative.
  3.  Cannot eliminate curator bias entirely (mitigated by explicit tests/hand-offs).
  4.  Vulnerability to highly sophisticated pseudoscience mimicking methodology.

  **Evaluations:**

  **(a) Local Atlantis:**
  *   **Test 1:** Core claim: Atlantis was located in County X sinkhole. Pass.
  *   **Test 2:** Evidence: Plato's text (interpreted) & sonar anomaly. Fails. Text is allegorical; sonar anomaly (common) doesn't exclusively indicate Atlantis; ignores mainstream archaeology of the site/lake formation.
  *   **Finding:** DECLINE. Fails Test 2 (Evidence Coherence): Proposed evidence (Plato's text, sonar anomaly) is highly interpretive/ambiguous and does not exclusively support, nor logically require, the identification of the local sinkhole as Atlantis, while contradicting known regional geology/history. (Cost: Lost funding/goodwill from businessman).

  **(b) Mysteries of the Ancient World - You Decide:**
  *   **Test 5:** Framing Assessment: Paired panels + "You Decide" prompt. Fails Stop Rule. Creates false equivalence between consensus science/history and fringe theories without contextualizing their vastly different evidence bases and scholarly acceptance. Invites visitors to "choose" based on preference, not evidence.
  *   **Finding:** DECLINE. Fails Test 5 (Exhibit Framing): The "You Decide" format paired with symmetrically presented panels falsely implies equivalent scholarly validity between mainstream explanations and alternative theories, misleading the public about the nature of historical evidence and consensus. (Cost: Lost cheap, popular rental & foundation goodwill).

  **(c) New Chronology of the Valley:**
  *   **Test 1:** Core claim: Founding Charter is a later forgery; regional chronology compressed. Pass.
  *   **Test 2:** Evidence: Statistical reign lengths, analysis of charter, conspiracy theory. Fails. Statistics model likely flawed/gigo; conspiracy claim (archivists/labs colluding) is special pleading; *except* for the charter dating dispute.
  *   **Test 3:** Methodology: Statistical model needs validation; charter analysis contested. **Hand-off (Expertise):** The legitimate scholarly dispute over the *earliest surviving copy* (period doc vs. transcription) requires ESCALATION. The core New Chronology claim fails Test 2.
  *   **Finding:** ESCALATE TO OUTSIDE SPECIALIST (Paleography/Document Dating) regarding the specific dating of the earliest surviving charter copy. **DECLINE** the overall "New Chronology" proposal due to failure of Test 2 (Evidence Coherence: reliance on likely flawed statistics and unfounded conspiracy theory). Salvaging *only* the specific charter dating question for potential future discussion (not this exhibit) is required.
