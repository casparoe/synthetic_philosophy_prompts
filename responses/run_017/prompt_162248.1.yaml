prompt: |-
  Im writing a short applied paper on which burdens an institution — a hospital's call schedule, a department's service assignments, a disaster-response roster — may require of people and which it can only invite them to take on, so I need an account of supererogation that does actual work, not another tour of the saint and the hero. Give me the desiderata first: the cases it has to sort correctly, the distinctions it cant collapse, and the facts about praise and blame it has to respect, with the case behind each. The ones I want on the list, at minimum: cheap rescue with huge stakes vs. costly rescue with modest stakes, and where (if anywhere) beyond-duty flips into required; the same act done by a stranger vs. by someone whose role already covers it; sacrifice paid for by a third party, like funding a stranger's surgery out of your kids college money; supererogatory omissions, e.g. forgiving when you had every right to go on resenting; the collective case where everyone does it, so no one is a hero and no one is off the hook; the entitled-but-nasty act that is blameworthy to do and not to omit; the agent who never once considers helping, and what exactly we are blaming them for; and the hero with a rotten motive. For each, say whether its a genuine desideratum or just a prejudice of the maximizing camp or the personal-options camp. Then flag the pair you think cant be jointly satisfied, and name the single requirement that rules out the most candidate accounts. Two or three lines each on how a personal-prerogative view, a scalar view built on what an ideally good agent would do, and maximizing-plus-options do against the list — I'll fill in the scorecard myself.
reasoning: |-
  Okay, let me start by unpacking the user's request. They're writing a paper on institutional burdens and need a practical theory of supererogation. They want desiderata listed with cases, and then an evaluation of three theories. 

  First, I need to ensure all their specified cases are covered. They mentioned cheap vs. costly rescues, role-based obligations, third-party sacrifices, omissions, collective actions, blameworthy acts, agents' motives, and the hero with rotten motives. Each of these must be clearly defined as a genuine desideratum or a potential bias from certain camps.

  Looking at the cheap rescue with huge stakes—this seems straightforward. Saving a child from a pond at minimal cost should be obligatory. But the costly rescue with modest stakes, like mortgaging your house for a stranger's surgery, should be supererogatory. The flip point where beyond-duty becomes required is tricky. If the cost to the agent is low but stakes are high, it's obligatory. High personal cost might make it supererogatory, but where exactly is the line? This is a genuine challenge for any theory.

  Next, the role-based distinction. A doctor saving a patient isn't supererogatory; it's their duty. But a stranger doing the same act is. This tests whether the theory can incorporate role obligations without collapsing distinctions. This is a genuine desideratum because roles define institutional expectations.

  Third-party sacrifices involve using resources that affect others, like college funds for a stranger's surgery. The agent might be praised, but it's blameworthy if it harms dependents. This shows that supererogation can't override all other duties. Genuine desideratum to avoid moral negligence.

  Supererogatory omissions, like forgiveness, are important. Forgiving when you have the right to resent shows that not acting can also be beyond duty. This counters the idea that supererogation is only about action. Genuine.

  Collective cases where everyone contributes a little. No single hero, but each must do their part. If one person slacks, they're blameworthy. This tests whether the theory handles distributed responsibility. Genuine, especially for institutional contexts.

  Entitled-but-nasty acts, like firing someone legally but cruelly. It's permissible but blameworthy. This distinguishes permissibility from praiseworthiness. Genuine desideratum to separate moral assessments.

  The agent who never considers helping. Blameworthy for lack of moral concern, not just the act. This ties to character evaluation. Genuine.

  Hero with rotten motives. Their action is praiseworthy, but their character isn't. This separates act and agent evaluation. Genuine.

  Now, the pair that might conflict: third-party sacrifice and the hero with rotten motives. In the sacrifice case, the act might be blameworthy if it harms others, but the rotten motive hero's act is praiseworthy. Reconciling when an act is praiseworthy despite motives or other duties is tough. The requirement that rules out most theories is probably the role-based distinction because it demands contextual sensitivity that scalar or maximizing views might lack.

  For the theories: personal prerogative allows opting out of beneficence for personal goals. Handles costly rescues well but might struggle with cheap rescues and collective cases. Scalar view focuses on the ideal agent. Praises high sacrifice but can't explain obligation, failing the cheap rescue case. Maximizing with options adds constraints to maximization. Handles most but might blur role distinctions and collective duties.

  The user's deeper need is a theory applicable to institutions, where roles and collective actions are key. They need clear boundaries between duty and supererogation to allocate burdens fairly. Ensuring the theory respects institutional roles and distributed responsibilities is crucial, which makes the role-based and collective desiderata vital.
answer: |-
  Here are the desiderata for a working theory of supererogation, designed to handle institutional burdens, followed by a brief assessment of three candidate theories.

  ### Desiderata (Genuine unless marked)
  1.  **Cheap Rescue, Huge Stakes (Duty):** Saving a drowning child in a shallow pond at minimal cost/risk *must* be obligatory. (Genuine - reflects basic moral minimum).
  2.  **Costly Rescue, Modest Stakes (Supererogation):** Mortgaging your house to fund a stranger's non-life-threatening cosmetic surgery *must* be supererogatory. (Genuine - protects core personal projects).
  3.  **Flip Point (Required Threshold):** Must identify *where* increasing stakes/decreasing cost flips an act from supererogatory to obligatory (e.g., saving a life vs. minor inconvenience). (Genuine - critical for defining institutional *requirements*).
  4.  **Role Obligation Collapse:** The same act (e.g., stabilizing a critical patient) *must* be obligatory for the on-call ER doc (role-bound) but supererogatory for a visiting plumber (stranger). (Genuine - core to institutional assignment logic; collapses in simple maximizing/scalar views).
  5.  **Third-Party Sacrifice (Moral Negligence):** Funding a stranger's life-saving surgery by draining your dependent child's college fund *cannot* be straightforwardly praiseworthy; it involves blameworthy violation of prior obligations. (Genuine - duties to specific others constrain supererogation).
  6.  **Supererogatory Omission (Forgiveness):** Choosing not to exercise a rightful claim (e.g., forgiving a debt, foregoing justified resentment) *can* be supererogatory. (Genuine - shows supererogation isn't solely about positive action).
  7.  **Collective Imperative (No Free Riders):** If *everyone* doing X (e.g., donating 1 hour/week to roster coverage) achieves a vital good at minimal individual cost, it *must* become obligatory for each; no one gets to opt-out scot-free because "others will do it." (Genuine - essential for sustainable institutional burden-sharing).
  8.  **Entitled-but-Nasty Act (Blameworthy Permissibility):** An act within one's rights (e.g., firing an employee harshly but legally) *can* be permissible yet blameworthy, while omitting it is non-blameworthy. (Genuine - separates permissibility from moral appraisal; counters maximizing tendency to equate permissible with "okay").
  9.  **Agent Who Never Considers Helping (Character Blame):** Blaming someone for not helping (even in a supererogatory context) focuses on *lack of minimal beneficence/care* (a character flaw or deliberative failure), not merely the omitted act. (Genuine - connects action evaluation to agent evaluation).
  10. **Hero with Rotten Motive (Act/Agent Split):** Saving lives at great personal risk *remains* a praiseworthy act even if done solely for fame/money; the *act* is supererogatory, but the *agent* is blameworthy for motive. (Genuine - separates evaluation of deeds from evaluation of doers).

  ### The Conflict & The Dealbreaker
  *   **Conflict Pair:** **Third-Party Sacrifice (#5)** and **Hero with Rotten Motive (#10)** create tension. In #5, using others' resources makes the act blameworthy *despite* benefiting a stranger. In #10, the act is praiseworthy *despite* the agent's rotten motive. Reconciling when external impacts vs. internal motives dominate act-praiseworthiness is difficult.
  *   **Primary Dealbreaker Requirement:** **Role Obligation Collapse (#4)** rules out the most candidate accounts. Theories that can't robustly distinguish obligations arising from specific roles/relationships from general beneficence (like simple maximizing or scalar views) fail the core institutional test.

  ### Theory Assessments vs. List
  1.  **Personal Prerogative View (e.g., Scheffler):**
      *   *Strengths:* Handles #2 (Costly Rescue), #3 (Flip Point - sort of, via cost threshold), #9 (Blame for lack of care - prerogative doesn't excuse indifference). Explains opting out.
      *   *Weaknesses:* Struggles with #1 (Cheap Rescue - why isn't prerogative absolute?), #4 (Role Collapse - prerogative is general, not role-sensitive), #5 (Third-Party Sacrifice - prerogative might over-justify), #7 (Collective Imperative - individual prerogative undermines collective duty), #6 & #8 (Omissions/Blameworthiness - not core focus).

  2.  **Scalar View (Ideal Agent Focus):**
      *   *Strengths:* Handles #10 (Rotten Motive Hero - act is still "better"), #6 (Omissions - forgiving can be a "better" state), #9 (Indifference is non-ideal).
      *   *Weaknesses:* **Fatal Flaw:** Collapses #1/#2/#3/#7 (No obligatory/supererogatory distinction, only better/worse). Fails #4 (Role Collapse - ideal agent standard is uniform). Struggles with #5 (Third-Party Sacrifice - is it "better"?), #8 (Blame for nasty acts - if permissible, why blame?).

  3.  **Maximizing + Constraints/Options (Sophisticated Consequentialism):**
      *   *Strengths:* Handles #1 (Cheap Rescue - required by max), #2 (Costly Rescue - opts out allowed), #3 (Flip Point - cost/benefit calculus), #5 (Third-Party Sacrifice - violates constraints/options), #7 (Collective - coordination rule makes it required), #10 (Rotten Motive - act maximizes good).
      *   *Weaknesses:* Struggles with #4 (Role Collapse - roles as special "constraints" are ad hoc), #6 (Omissions - less natural fit), #8 (Blame for Nasty Acts - if maximizes good within options, why blame?), #9 (Indifference - motive irrelevant if act is permissible).

  **Scorecard Start:** PP strong on individual cost/opting-out/motive-independence of blame for indifference; weak on roles, collectives, and cheap rescues. Scalar fails the core duty/super distinction and roles. Max+Opts strong on requiring cheap rescues/collectives and blocking harmful sacrifices; weak on role distinctions and explaining blame for nasty permissible acts. The institutional focus makes **Role Obligation Collapse (#4)** particularly decisive.
