  ### Case Analysis: Where the Translation Creaks

  #### (a) "Some of the students passed — in fact all did."
  - **Grice**: "Some" initially implicates "not all," canceled by clarification.
  - **Your translation**: Reranker assigns low utility to "some" if "all" is true (Quantity violation) unless context explains it (e.g., correction). Baked-in scalars fail; online inference succeeds.
  - **Creak**: If scalars are baked in, cancellation is hard. Online inference handles it, but requires robust context modeling.

  #### (b) Enthusiastic approval of laptop dying mid-talk (irony).
  - **Grice**: Flouting Quality to imply frustration.
  - **Your translation**: Speaker utility favors false literal + high emotional reward. Reranker infers intent via POMDP (speaker state: stressed).
  - **Creak**: Relies on accurate speaker state modeling. If "enthusiasm" is misread as literal, fails.

  #### (c) "You are the cream in my coffee" (metaphor).
  - **Grice**: Flouting Quality to imply value.
  - **Your translation**: Low literal probability (absurdity) + high pragmatic utility (embedding similarity to "essential"). 
  - **Creak**: Requires world knowledge (e.g., "cream" = positive). Your vocabulary handles it if embeddings capture affordances.

  #### (d) Non-native speaker: "Some guests arrived" (literal intent); hearer infers "not all."
  - **Grice**: No implicature—speaker lacked intent. Hearer misinfers.
  - **Your translation**: Reranker *will* infer "not all" (via speaker model assuming knowledge). To avoid, need **explicit speaker knowledge modeling** (e.g., "speaker hasn’t seen full list" in POMDP).
  - **Creak**: Your vocabulary **forces attributing implicature** if speaker knowledge isn’t modeled. Difference is not marked without **epistemic states** (speaker’s knowledge/beliefs). Adding this primitive breaks simplicity—requires recursive belief tracking (e.g., "speaker believes only some have arrived").

