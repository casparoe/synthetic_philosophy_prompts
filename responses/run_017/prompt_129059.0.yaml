  ### Final Verdict: Residue and Primitive
  - **Defects of your vocabulary**: 
    - Lacks **epistemic states** (speaker knowledge), causing over-attribution of intent (case d). 
    - Lacks **normative primitives** (e.g., "should" in maxims), reducing cooperation to utility.
    - Truncated **recursion** misses shared intentionality.
  - **Defects of Gricean apparatus**: 
    - Overly crisp distinctions (said/implicated, generalized/particularized) crumble under probabilistic inference. 
    - Circular dependencies (pragmatics all the way down) are ignored.
  - **One primitive to add**: **Epistemic state tracking** (speaker’s knowledge/beliefs). 
    - **Costs**: 
      - Breaks simplicity—requires recursive belief hierarchies (POMDPs blow up). 
      - Demands richer context modeling (e.g., "hearer knows speaker is uninformed").
    - **Gains**: Solves case (d), preserves Grice’s intent-based implicature.

  **Conclusion**: Your vocabulary captures Grice’s engineering insights (staged processing, speaker-hearer optimization) but exposes his theory as a high-level idealization. The residue is partly due to your framework’s probabilistic nature (eroding norms) and partly due to Grice’s underspecification of recursion and epistemic states. Add epistemic modeling to handle intent attribution—but expect complexity trade-offs.
