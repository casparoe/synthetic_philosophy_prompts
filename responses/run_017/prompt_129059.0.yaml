  ### Pipeline Ordering: Circular Dependency?
  - **The problem**: Disambiguation/reference resolution requires pragmatic intent (e.g., resolving "bank" needs intent). Your ASR → literal → pragmatic ordering assumes linearity.
  - **Gricean claim**: "What is said" (pre-pragmatic) is a myth—pragmatics is "all the way down."
  - **Translation**: Your pipeline is **circular in theory** but **buildable in practice** via:
    - Iterative refinement (e.g., beam search with pragmatic feedback).
    - Hard separation: Limit "literal" to syntax/lexicon (e.g., "bank" = financial/river, no context).
  - **Verdict**: The seam is an **engineering artifact**. Grice’s distinction collapses under scrutiny—human processing is parallel. Your pipeline works with approximations but leaks pragmatics into "literal" stage.

