  ### Your Reranker: Implementing vs. Mimicking Grice
  Your reranker (scores literal candidates by speaker utility) **implements**:
  - **Core Grice**: Literal/implicated split, Quantity/Quality/Relation as utility terms, online implicature.
  - **Mimics but distorts**:
    - Flouting: Scores non-literals but misses *violation-as-signal*.
    - Recursive intent: Truncates to k=2 (intent recognition without mutual reason).
  - **Ignores**: 
    - Generalized implicature as inference (if scalars are baked in).
    - Epistemic states (knowledge/belief) leading to over-attribution (case d).

