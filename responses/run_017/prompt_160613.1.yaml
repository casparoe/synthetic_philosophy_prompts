  We are going to structure the proposal around the core idea of introducing a robustness requirement (mutation-stability) to the program equilibrium setting to address the permissiveness problem. The key is to formalize the tradeoff between tolerance and exploitability and to investigate the frontier as a function of the simulation budget.

  ### Project Title
  Robust Program Equilibrium: Mutation-Stability and the Tradeoff between Tolerance and Exploitability

  ### Core Question
  In the program equilibrium model for the one-shot Prisoner's Dilemma, we consider programs that take the opponent's source code as input and output an action (Cooperate or Defect). We define a mutation as a small edit (insertion, deletion, or substitution of a single token) to the program's source code. We then define:

  - **Tolerance (of a cooperative program P)**: The fraction of programs Q obtained by up to k mutations from P such that, when P plays against Q, P cooperates (and we require that P cooperates with itself and defects against an unconditional defector).
  - **Exploitability (of P)**: The maximum payoff loss that P incurs when playing against any program Q that is a mutation of P (or up to k mutations away) compared to the payoff when playing against itself. Specifically, if the payoff when P plays against itself is R (mutual cooperation) and when P plays against Q is T (if Q defects and P cooperates) or something else, we have to define the loss appropriately. We might consider the difference in P's payoff when playing against Q versus when playing against itself.

  We fix a programming language (to be specified, e.g., a simple Turing-complete language with a defined set of tokens) and a simulation step budget B. The program P is allowed to simulate the opponent's program for up to B steps (and if the simulation doesn't halt within B steps, it uses a default action or a fallback).

  **The central question**: For a fixed k (mutation radius) and B (simulation budget), what is the achievable set of pairs (tolerance, exploitability) for programs P that are mutual cooperators (with themselves) and defect against the unconditional defector? How does this set change with B? In particular, is there a non-trivial tradeoff (i.e., does increasing tolerance force an increase in exploitability)? And does the tradeoff become more favorable (i.e., can we achieve high tolerance with low exploitability) as B increases?

  ### Why Existing Moves Don't Settle It
  - **Permissiveness objection**: The traditional program equilibrium literature (e.g., Tennenholtz, McAfee) notes the multiplicity problem but does not offer a solution that is both robust and language-independent. We are not restricting the language (which would be ad hoc) but instead imposing a stability requirement on the equilibrium profile.
  - **Language restrictions**: Prior work (e.g., using finite automata, bounded complexity) reduces the set of equilibria but does not address robustness against small changes in the code. Our mutation-stability is a novel refinement.
  - **Provability-based approaches**: Programs that reason about proofs (e.g., in a bounded proof system) avoid the halting problem but are sensitive to the choice of the proof system. Our simulation-based approach is more operational and directly captures behavioral equivalence (up to the budget).
  - **Standard refinements (trembling hand, etc.)**: These typically perturb the actions, not the programs. We argue that perturbing the program (the strategy) is more natural in a computational setting where the program is the strategy. Moreover, we will show that the two are distinct (see below).

  ### Approach and Timeline (12 months)
  **Months 1-2: Formalization and Toy Language Design**
  - Define the programming language (e.g., a minimal Lisp-like or a simple imperative language with a fixed set of tokens) and the edit metric (token-level edits).
  - Formalize the game: payoff matrix, program semantics (including simulation with step budget B).
  - Define tolerance and exploitability precisely. For tolerance, we will consider the set of all programs within edit distance k from the original partner's program and compute the fraction that P cooperates with. For exploitability, we will consider the maximum difference in P's payoff when playing against a mutant versus when playing against itself.

  **Months 3-5: Theoretical Analysis for Small k and B**
  - Analyze the trivial strategies: unconditional defection (robust but non-cooperative) and the fragile 'identical' cooperator.
  - Construct a baseline tolerant strategy: the program that simulates the opponent against a fixed set of probe programs (including itself, the unconditional defector, and maybe others) for B steps and cooperates if the opponent behaves cooperatively on all probes. Study its tolerance and exploitability.
  - Prove initial bounds on the tradeoff: e.g., show that if tolerance is 1 (i.e., P cooperates with every program within k mutations) then exploitability must be high (because a mutant can be designed to cooperate with P but defect when the opponent is P, thus exploiting P).

  **Months 6-8: Extending the Theory and Simulation for Small Programs**
  - For small values of k and B, and for programs of bounded size, we will enumerate all programs up to a certain size (say, up to 10 tokens) and compute the tolerance and exploitability for each cooperative program. This will give an exact picture of the frontier for tiny cases. We expect this to be computationally intensive but feasible for very small sizes. The goal is to generate conjectures and test the sensitivity to language choice.
  - Alternatively, we may use random sampling of mutants for larger programs.

  **Months 9-11: Asymptotic Analysis and Limits**
  - Investigate the behavior as B increases: can we achieve tolerance arbitrarily close to 1 with exploitability arbitrarily close to 0? Or is there a lower bound on exploitability for a given tolerance?
  - Study the role of the edit metric: is there a natural metric that captures "semantic" changes? We may consider normalizing by program size.

  **Month 12: Synthesis and Write-up**
  - Compare our results with trembling-hand refinements and commitment device interpretations.
  - Discuss implications for the permissiveness problem and the selection of program equilibria.

  ### What a Positive Result Looks Like
  - **Theorems**: For example, an impossibility result: "For any B, there exists a threshold tolerance t(B) such that any program with tolerance above t(B) must have exploitability at least e(B). Moreover, as B increases, t(B) → 1 and e(B) → 0." This would show that high robustness is achievable with arbitrarily low cost in the limit of large B. Alternatively, we might show that e(B) is bounded away from zero even as B→∞, indicating an inherent tradeoff.
  - **Constructions**: A family of programs that achieve non-trivial points on the frontier, perhaps by using a set of probe programs that grows with B.

  ### What Failure Looks Like
  - **Artifact of language**: If the frontier changes drastically with the choice of language (e.g., if in one language we can get high tolerance with low exploitability and in another we cannot) then the results are not general. We mitigate by using a minimal language and testing with two different languages in the small-scale simulation.
  - **Repackaging known results**: If the tradeoff turns out to be equivalent to, say, the cost of computation in bounded rationality models, then we have to reframe the contribution as an application to program equilibrium.

  ### Brute-Force Enumeration: Role in the Project
  The brute-force enumeration of small programs (for fixed small k and B) is primarily a conjecture generator and a way to test the sensitivity to language choice. It should not be the main method because the state space grows exponentially and we cannot scale to realistic program sizes. However, it will provide concrete examples of robust programs and the tradeoff curve for tiny cases, which can inform the asymptotic theory.

  ### Commitment Devices Interpretation
  Your friend is right that program equilibrium can be seen as a commitment device: the program is a commitment to a strategy. However, our mutation-stability requirement adds a new dimension: the commitment must be robust to small errors in the commitment device itself. This is novel because standard commitment models assume the commitment is perfectly observed and fixed. We are studying the impact of imperfections in the commitment device (due to errors in writing the code) on the equilibrium.

  ### Mutation vs. Trembling-Hand
  We argue that mutation (perturbing the source) is distinct from trembling-hand (perturbing the action). In the mutation model, the perturbation happens at the level of the strategy (the program) and then the program is run without error. This can lead to complex changes in behavior. In trembling-hand, the strategy is fixed but the action is randomly perturbed. The two are not equivalent: a mutation might change the program's behavior in a way that is not captured by independent action errors. For example, a mutation might cause the program to defect against a class of opponents, not just in a single play.

  ### Selling to Econ and CS
  - **To the Econ half**: This is not just another refinement because we are introducing a novel stability concept (mutation-stability) that is natural in computational settings and has not been studied in traditional game theory. It addresses a fundamental criticism (permissiveness) of an important solution concept (program equilibrium) and provides a way to select equilibria based on robustness.
  - **To the CS half**: This is not just a computability exercise because we are studying a tradeoff that involves computational resources (step budget) and robustness, which has implications for real-world applications (e.g., smart contracts, where code is deployed and might have small bugs). The central question is about the design of robust programs in strategic settings.

  ### Scope Check for 12 Months
  The project is ambitious but feasible in 12 months because we break it into phases. The theoretical analysis for small k and B is manageable. The simulation for tiny programs is computationally bounded and will be done early. The asymptotic analysis might be challenging, but even partial results (e.g., for specific constructions) will be valuable. The risk is that the tradeoff might be too sensitive to the model details, but we will address that by focusing on minimal languages and clear definitions.

  ### Revised Proposal Outline

  **1. Introduction and Motivation**
  - The permissiveness problem in program equilibrium.
  - Our approach: mutation-stability as a robustness requirement.

  **2. Model**
  - Programming language and token set.
  - Edit metric (Levenshtein distance at token level).
  - Program semantics and simulation with step budget B.
  - Tolerance and exploitability defined.

  **3. Research Questions**
  - The tradeoff between tolerance and exploitability as a function of B.
  - The asymptotic behavior (B → ∞).

  **4. Related Work**
  - Program equilibrium (Tennenholtz, McAfee, etc.).
  - Equilibrium refinements (trembling hand, etc.).
  - Robustness in computer science (e.g., noise in computing).

  **5. Approach and Methods**
  - Theoretical analysis (constructions, impossibility results).
  - Simulation for small programs (enumeration and sampling).

  **6. Expected Results and Implications**
  - A theorem characterizing the tradeoff.
  - Implications for the selection of program equilibria.

  **7. Timeline and Milestones**
  - As above.

  **8. Risk Management**
  - If the tradeoff is too language-dependent, we will focus on two minimal languages and compare.
  - If the central impossibility is too hard, we will focus on specific constructions and bounds.

  **9. Conclusion**
  - How this addresses the embarrassment of riches.

  ### Final Note
  The idea is strong and novel. It might not solve the entire permissiveness problem, but it introduces a new angle (robustness to code mutations) that is both theoretically interesting and practically motivated. The project is well-scoped for 12 months.
answer: |-
  ### Proposal: Robust Program Equilibrium via Mutation-Stability in the Prisoner's Dilemma  

  #### **Core Research Question**  
  In the program-equilibrium model for the one-shot Prisoner's Dilemma, can we define a class of *robustly cooperative programs* that:  
  1. Mutually cooperate with copies of themselves,  
  2. Defect against unconditional defectors,  
  3. Maintain cooperation against *semantically similar mutants* (programs obtained via small syntactic edits), while bounding exploitability?  

  Formally, for a fixed programming language (e.g., a minimal Turing-complete language with tokens) and edit metric (Levenshtein distance over tokens), we define:  
  - **Tolerance** (τ): Fraction of mutant programs \(Q\) within edit distance \(k\) of \(P\) such that \(P\) cooperates with \(Q\).  
  - **Exploitability** (ε): Maximum payoff loss incurred by \(P\) against any mutant \(Q\) (i.e., \(\max_{Q} [u_P(Q) - u_P(P)]\), where \(u_P(Q)\) is \(P\)'s payoff against \(Q\)).  
  - **Budgeted simulation**: \(P\) may simulate \(Q\) for up to \(B\) steps before acting; non-halting simulations default to defection.  

  **Primary question**: *What is the achievable frontier of \((\tau, \epsilon)\) pairs for cooperative programs as \(B\) varies? Specifically, is there a fundamental tradeoff where high \(\tau\) forces high \(\epsilon\), and how does this tradeoff evolve with \(B\)?*  

  #### **Why Existing Approaches Fall Short**  
  - **Permissiveness**: Classic program equilibrium allows infinite syntactic equilibria (e.g., "cooperate iff even # of semicolons"), but offers no criterion to favor *robust* cooperation.  
  - **Language restrictions**: Limiting programs (e.g., to finite automata) shrinks the equilibrium set artificially; our approach is language-agnostic by focusing on *behavioral robustness*.  
  - **Provability-based methods**: Programs using proof-based reasoning (e.g., "cooperate if you prove I cooperate") avoid simulation overhead but inherit Gödelian incompleteness and proof-system dependence. Our simulation-based model is computationally grounded.  
  - **Traditional refinements**: Trembling-hand equilibrium perturbs *actions*, not *programs*. Mutation-stability captures coding errors/ambiguities, which induce correlated behavioral changes (e.g., a single edit might alter behavior against *all* opponents).  

  #### **Approach and Timeline**  
  **Phase 1: Formalization (Months 1–3)**  
  - Define language and edit metric (e.g., lambda calculus with tokens; edits = token insert/delete/substitute).  
  - Formalize tolerance (\(\tau\)) and exploitability (\(\epsilon\)) with budget \(B\).  
  - **Deliverable**: Precise mathematical setup; baseline examples (e.g., fragile "cooperate iff identical" vs. robust simulators).  

  **Phase 2: Theoretical Frontier (Months 4–7)**  
  - **Core tradeoff**: Prove impossibility results (e.g., "if \(\tau > 0.9\), then \(\epsilon \geq c(B)\) for some function \(c\)") and construct programs achieving Pareto-efficient \((\tau, \epsilon)\) pairs.  
  - **Role of \(B\)**: Analyze how the frontier shifts as \(B \to \infty\) (e.g., does \(\epsilon \to 0\) become feasible?).  
  - **Deliverable**: Theorems characterizing the \((\tau, \epsilon)\) frontier; asymptotic behavior w.r.t. \(B\).  

  **Phase 3: Simulation for Insight (Months 8–10)**  
  - **Brute-force enumeration**: For tiny programs (length \(\leq 10\) tokens), edit distance \(k=1\), and small \(B\), compute all \((\tau, \epsilon)\) pairs.  
  - **Why limited use**: Enumeration is a *conjecture generator*, not the primary method. State-space explosion makes it infeasible beyond trivial sizes; its value is in testing language sensitivity and inspiring analytical constructions.  
  - **Deliverable**: Empirical \((\tau, \epsilon)\) frontiers for small cases; sensitivity analysis across 2–3 minimal languages.  

  **Phase 4: Synthesis (Months 11–12)**  
  - Compare mutation-stability to trembling-hand perturbations (see below).  
  - Reconcile with commitment-device critiques (see below).  
  - **Deliverable**: Unified narrative; thesis draft.  

  #### **What Success Looks Like**  
  - **Positive outcome**: A theorem showing the \((\tau, \epsilon)\) frontier is non-trivial (e.g., \(\tau < 1 - \delta(B)\) for low \(\epsilon\)), with explicit constructions that beat fragile equilibria. Asymptotic results (e.g., "as \(B \to \infty\), \(\epsilon \to 0\) is achievable for \(\tau < 1\)") would be ideal.  
  - **Negative but valuable outcome**: If the frontier collapses under language changes (e.g., tolerance is unachievable in any language without extreme exploitability), this reveals a deeper limitation of syntactic approaches. If mutation-stability reduces to a known concept (e.g., renormalized trembling hand), we formalize the equivalence.  

  #### **Failure Modes**  
  - **Language artifacts**: If results are highly sensitive to token choice or edit metrics, the model may lack generality. *Mitigation*: Test multiple languages; focus on asymptotic \(B \to \infty\) where semantics dominate.  
  - **Triviality**: If unconditional defection is the only stable outcome, or if robust cooperation is impossible without unbounded \(\epsilon\), the project fails—but this still answers a fundamental question.  
  - **Repackaging known results**: If the tradeoff reduces to "verification is hard" (CS) or "incomplete contracts are exploitable" (econ), the contribution is incremental. *Mitigation*: Emphasize novelty (syntactic mutations + strategic simulation).  

  #### **Addressing Key Traps**  
  1. **The defection trap**: Unconditional defection is robust but non-cooperative. We sidestep this by focusing *only* on programs that cooperate with clones and defect against defectors—studying robustness *within* the cooperative class.  
  2. **Language-dependence risk**: We use minimal languages (e.g., lambda calculus) for analysis but emphasize that budgeted simulation (\(B\)) is a generalizable mechanism. As \(B\) grows, behavior approximates semantic equivalence.  

  #### **Commitment Device Critique**  
  - **Your friend’s point**: Program equilibrium *is* mutual commitment via code. Our twist: Realistic commitments are buggy. Mutation-stability asks, *"What if your opponent’s commitment device has typos?"* This links to **incomplete contracting** (econ) and **fault-tolerant computing** (CS).  
  - **Response**: "We’re studying how program equilibria degrade under implementation errors—a gap in commitment theory."  

  #### **Mutation vs. Trembling Hand**  
  - **Mutation**: Perturbs the *program* (strategy), causing behavioral shifts against *all* opponents (e.g., a mutant might defect against everyone).  
  - **Trembling hand**: Perturbs the *action* in a single game, independent of context.  
  - **Key difference**: Mutation induces *correlated* behavioral changes; trembling hand does not. They collapse only if edits are restricted to output bits (unrealistic for programs).  

  #### **Selling to Both Committees**  
  - **Econ audience**: "This isn’t ‘just refinement’—it’s a new lens on how *computational* strategies fail gracefully. It bridges implementation errors (e.g., buggy contracts) with equilibrium selection, avoiding ad hoc refinements."  
  - **CS audience**: "This isn’t computability trivia—it’s about *efficient verification* of strategic equivalence under bounded simulation. The tradeoff between \(\tau\) and \(\epsilon\) is a new computational game-theoretic challenge."  

  #### **Scope Check**  
  The project is **viable in 12 months** because:  
  - Theory dominates (pen-and paper-proofs for frontier characterization).  
  - Simulation is limited to tiny cases (feasible on a laptop).  
  - Asymptotic analysis (\(B \to \infty\)) provides a clean fallback if finite-\(B\) is messy.  
  - **Risks**: If core theorems are elusive, Phase 3 provides backup data. If language sensitivity dominates, we pivot to a comparative study.  

  ---  
  **Proposal Ready for Tailoring**: This framework explicitly confronts traps, defines success/failure, and balances theory/simulation. To strengthen:  
  1. Add a table comparing mutation-stability to existing concepts.  
  2. Specify languages (e.g., "untyped lambda calculus with tokens: λ, ., (, ), variables").  
  3. Cite 2–3 key papers (e.g., Tennenholtz for program eq; Kalai for robustness).  

  If you reframe anything, I recommend tightening the question to: *"Does bounded simulation enable robust cooperation at low exploitability, and if so, at what computational cost?"* This sharpens the CS angle without losing econ relevance.
