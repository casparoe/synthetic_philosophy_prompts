prompt: |-
  Hey — I need help turning a half-baked idea into a tight two-page proposal (aim for 850–950 words) for a nine-month dissertation-writing fellowship in my department. I'm a fourth-year in sociology, but two people on my committee are philosophers, so whatever I turn in has to be legible to both camps without being mush. Please act as a philosopher of social science who has also read a fair amount of applied micro and causal inference, and start with a couple of hundred words of actual brainstorming — is the question even well-posed, what's the strongest version of it, what's the obvious objection I'm not seeing — before you draft anything. Then give me the proposal itself.

  The half-formed idea, such as it is: I think the individualism-vs-holism fight keeps stalling because everyone agrees on constitution (yes, any social arrangement is made of individuals acting) and then quietly assumes that settling constitution settles explanation, and then assumes that settling explanation settles what we should *model*. I want to pry those apart and make the third one the real question. Specifically, I want to ask which level's generalizations **travel**: when you take a model estimated in one population and move it to another place, another decade, or another policy regime, how much of it has to be re-estimated? Call that its re-estimation burden, and call the tendency of a model's parameters to go stale as you move it level-relative drift. My hunch — and I'm not married to it — is that macro-level regularities are often *more* portable than micro-level ones precisely because they're multiply realized: lots of different micro configurations produce the same tipping point, the same run on a bank, the same segregation pattern, so the macro description survives while the micro parameters churn. If that's right, then holism isn't a metaphysical thesis at all but a contingent bet about stability, and the interesting form of individualism is the one that grants constitution and explanation and still wins on portability. Two workhorse examples I keep coming back to: the classic threshold model of neighborhood segregation (Schelling-style, where the macro pattern is nobody's intention), and the standard bank-run model (where a genuinely macro-ish variable, confidence in the institution, seems to push people around). I also want it to gesture at a policy case — a policing or housing intervention that worked in one city and backfired in another — because that's the version my committee cares about.

  So the proposal needs: the question stated sharply enough that it has a determinate answer; why the standard positions (reductive individualism, supervenience-based quietism, and the sort of holism that just asserts downward causation) leave it open; what I'd actually do across three blocks of the nine months, given that I have no budget for new data collection and this has to be a conceptual project that reads existing replication and forecasting evidence rather than generating any; why that approach rather than the obvious alternatives (write another supervenience paper, build an agent-based model and watch what happens, or do a straight external-validity piece); what a successful result would look like as something a working researcher could use — I'm imagining a decision procedure for choosing a level of description given a portability target; and, importantly, an honest failure condition. My best candidate for failure is that the stability ranking turns out to be entirely case-by-case, with no level-level generalization to be had, in which case the honest output is an argument that the debate was always a pseudo-debate — I'd rather say that up front than pretend I'll find a law. One more thing to defuse: a committee member has already said this is just external validity with a fancy name, and I need a paragraph that takes that seriously and says what's left of the project if he's right. Don't give me citations or a bibliography — I'll fill those in myself, so just refer to positions and arguments by name.

  Format: prose proposal with short section headers, plus your brainstorming up top, and then finish with one single line at the very end of the form \answer{...} containing the one sentence I'd put on the fellowship's abstract line — the sharpest claim the project is actually positioned to defend. Keep it in my voice, not fellowship-speak; my draft notes are a mess and I'd rather have something I can edit than something that sounds finished.
reasoning: |-
  Okay, let me start by unpacking this user's request. They're a fourth-year sociology PhD student needing to turn a half-formed idea into a tight dissertation fellowship proposal. The core idea challenges the individualism-holism debate by separating constitution, explanation, and modeling choices, focusing on model portability across contexts. 

  Hmm, the user's clearly wrestling with interdisciplinary tensions—sociology meets philosophy committee members. That explains their insistence on avoiding "mush" while satisfying both camps. Their raw materials are promising: Schelling models, bank runs, and policy transfer failures as concrete anchors. But I notice they're nervous about two things: their committee's "external validity" objection, and the risk of ending up with a case-by-case mess instead of general insights.

  First, I should test if their central concept holds water. "Re-estimation burden" as a metric for portability is clever—it operationalizes abstraction trade-offs in a way both philosophers and applied researchers could respect. The multiply-realized macro-stability hypothesis feels fresh, but isn't obvious. Let me pressure-test it: 

  *Could micro-drift actually* protect *macro-stability?* Imagine Schelling's segregation threshold: if individual tolerance parameters churn but the aggregate tipping point stays fixed because network structures compensate, that's gold for their thesis. But what if micro-churn *cascades* (like in financial contagion models)? That'd undermine the hypothesis. They'll need to address asymmetry cases.

  *Policy transfer failures* are perfect stakes-raisers. Take predictive policing algorithms failing when moved between cities: if their failure traces to unmeasured neighborhood-level confounders rather than individual cop biases, that empirically grounds the "macro-as-stable" bet. But I should flag that some interventions fail precisely *because* they ignore micro-heterogeneity (e.g., job training programs with varying participant uptake). 

  For structure, their proposal must murder darlings. The metaphysics/constitution debate? Acknowledge it's settled to free word count for portability. The supervenience quietists? Thank them for their service and move on. The committee's external validity concern? Embrace it—then argue existing work ignores *systematic level-relative* differences in drift. That's the knife-edge.

  Method section is tricky—no new data, all conceptual. We'll lean hard on reanalysis: mining replication studies (OSC, Many Labs), forecasting tournaments (like in econometrics), and policy evaluation transfers. The "decision procedure" deliverable could be a flowchart: Start with portability goal → check historical drift patterns at candidate levels → weight model complexity against re-estimation costs. Pragmatic, not grand theory.

  Biggest risk is indeed contingency. But if macro-stability is itself contingent (only in complex systems? only above certain scales?), that's still knowledge. The pseudo-debate failure outcome could be satisfying: "You were fighting about explanation when you should've been auditing portability."

  For the abstract line, we need surgical precision: <answer>Model portability depends systematically on abstraction level, with macro-regularities often outlasting micro-parameters due to multiple realizability—making holism a stability strategy, not an ontological claim.</answer> 

  ...Wait, is "often" too weak? No—"systematically" covers generality while acknowledging exceptions. And "strategy" positions it as tool, not truth. 

  *checks word count* Brainstorm bled into draft structure here—better shift gears to actual sections now. User wants brevity, so I'll murder my own rambling next.
answer: |-
  Here’s the brainstorming followed by a lean, editable proposal draft. I’ve kept it sharp, argument-driven, and in your voice, focusing on structure and core claims.

  ---

  **Brainstorming (Is this well-posed? Objections? Strongest version?)**

  **Core Question Strength:** Your core move – decoupling constitution/explanation from *modeling choices based on portability* – is potent. It bypasses tired ontological debates and lands squarely on pragmatic, scientific grounds philosophers *and* applied researchers care about: prediction, generalization, and policy transfer. "Re-estimation burden" and "level-relative drift" are excellent operationalizations. The strongest version asks: *Is there a systematic relationship between the level of abstraction (micro vs. macro) in a social scientific model and its re-estimation burden when transported across contexts (populations, times, regimes)?* Specifically, testing the hypothesis: *Macro-level generalizations exhibit lower re-estimation burden (less drift) than micro-level generalizations in complex social phenomena, due to multiple realizability shielding aggregate patterns from micro-churn.*

  **Key Objections You’re Not Seeing (Yet):**
  1.  **Level-Relativity of "Drift":** Is drift inherent to the *level* or just the *specific variables chosen*? A critic might argue you can find highly stable micro-variables (e.g., basic cognitive biases) and highly unstable macro-variables (e.g., specific inflation rates). Your retort: The *typical* causal/explanatory variables sought at each level (individual attitudes/actions vs. institutional states/aggregate patterns) have systematic differences in context-sensitivity *because* of their position in the causal web. Macro-states integrate over micro-churn.
  2.  **The "It's Just External Validity" Charge:** Your committee member is partially right. But external validity research rarely *theorizes why validity might differ systematically by level of analysis*. It treats "the model" as monolithic. Your project makes the *level-relativity* of external validity the explicit, central object of study. If they're *completely* right, the project still delivers a novel framework for *diagnosing and predicting* sources of external validity failure (level-specific drift).
  3.  **The Contingency Trap:** Your hunch might be true only for *specific types* of phenomena (emergent, complex systems) and not others (e.g., deliberate institutional design). The strongest version specifies the domain: phenomena characterized by *interdependence* and *feedback loops* (like segregation, bank runs, policy diffusion), where emergence is likely. It doesn't claim universality.
  4.  **Operationalizing Drift:** How do you *measure* "re-estimation burden" and "drift" reliably across diverse studies? You need clear metrics (e.g., % change in coefficient magnitude/significance, predictive accuracy drop, need for new interactions) applicable to secondary analysis.

  **Refining the Question:** *In complex social systems characterized by interdependence and feedback (e.g., residential segregation, financial panics, policy diffusion), does the level of abstraction (micro vs. macro) in a causal model systematically predict its re-estimation burden when transported to novel contexts? Specifically, do macro-level generalizations exhibit greater stability (lower drift) due to multiple realizability?*

  ---

  **Proposal Draft: The Portability Wager: Level of Abstraction and Model Stability Across Contexts**

  **(Word Count Target: ~900)**

  **1. The Stalemate & The Opening (The Question)**
  The individualism-holism debate is frozen. Constitution (social facts supervene on individuals) is widely accepted. Explanation often defaults to methodological individualism, assuming micro-foundations guarantee robustness. Yet, policy models constantly fail when transplanted. I argue the crucial question is neither ontology nor ultimate explanation, but *portability*: **When moving a causal model between contexts (populations, times, regimes), does the level of abstraction (micro vs. macro) systematically predict its re-estimation burden – the degree to which core parameters drift or become unstable?** My hypothesis: For complex, interdependent social phenomena (segregation, financial instability, policy diffusion), macro-level generalizations often exhibit *lower* re-estimation burden than micro-level ones. Macro-patterns (tipping points, confidence collapse) are multiply realizable – achievable via many micro-configurations – shielding them from context-specific micro-churn. Holism, then, is best seen not as metaphysics but as a pragmatic wager on stability.

  **2. Why Existing Frames Fall Short (The Gap)**
  *   **Reductive Individualism:** Assumes settling micro-constitution and micro-explanation guarantees portable models. Ignores that micro-parameters (e.g., individual tolerance thresholds, risk perceptions) may be highly context-sensitive, while the macro-pattern they produce is stable.
  *   **Supervenience Quietism:** Correctly notes constitution doesn't dictate explanation, but stops there. It offers no guidance on *which level’s explanations/models will travel best*, treating levels as explanatorily symmetrical when they may not be pragmatically so.
  *   **Strong Holism (Downward Causation):** Posits irreducible causal powers at the macro-level, often inviting metaphysical skepticism. It misses the key point: macro-stability might arise *from* micro-constitution via multiple realizability, without needing novel causal powers. The portability advantage is empirical and contingent, not ontological.
  The "external validity" critique touches the surface but fails to analyze *systematic level-relative differences* in validity failure. This project makes that level-relativity central.

  **3. Method: Conceptual Analysis & Replication Forensics (The Plan - 3 Blocks)**
  *   **Months 1-3: Conceptual Groundwork & Framework Development:** Rigorously define "level of abstraction," "re-estimation burden" (metrics: parameter stability, predictive accuracy decay, need for structural modification), "level-relative drift," and "multiple realizability" in modeling terms. Develop a typology of contexts (demographic shift, temporal shift, policy regime shift). Identify core cases: Schelling-type segregation models (micro: tolerance; macro: tipping point/segregation index), Bank Run models (micro: individual withdrawal thresholds; macro: confidence/panic state), Policy Transfer Failures (e.g., policing tactics working in City A but increasing distrust/violence in City B; housing voucher impacts varying by metro area structure).
  *   **Months 4-6: Systematic Reanalysis of Existing Evidence:** Mine large-scale replication projects (OSC, SSRP, Many Labs), forecasting tournaments, and policy evaluation meta-analyses (e.g., Moving to Opportunity re-studies, policing intervention replications). Code studies for: (a) Primary level of modeled causality (Micro/Macro/Mixed); (b) Context shift magnitude/type; (c) Quantifiable re-estimation burden/drift. Analyze patterns: Does drift correlate systematically with level? Does macro-drift manifest differently (e.g., pattern persistence despite parameter shift vs. micro-parameter instability)?
  *   **Months 7-9: Synthesis & Decision Tool Prototype:** Integrate findings. Refine/refute the stability hypothesis. If systematic level-effects exist, develop a conceptual "Level Choice Heuristic" for modelers/policymakers: Given a portability goal (e.g., transfer policy X to context Y), what factors (type of phenomenon, available data on context similarity, historical drift patterns) suggest prioritizing macro or micro modeling? If no *systematic* level-effect is found, pivot to argue the individualism-holism debate is scientifically sterile – portability requires context-specific level-sensitivity, not grand ontological commitments.

  **4. Why Not the Alternatives? (The Niche)**
  *   **Another Supervenience Paper:** Rehearses settled metaphysics, ignores the pragmatic modeling question central to scientific practice and policy.
  *   **Agent-Based Model (ABM):** While illustrative (e.g., showing micro-churn preserving macro-patterns), ABMs are simulations, not evidence of *actual* empirical portability across real-world contexts. My project leverages *existing empirical* evidence of transport success/failure.
  *   **Standard External Validity Piece:** Typically treats the model as a black box. This project dissects it, making the *level-composition* of the model and the *level-specificity* of drift the explicit focus, offering a finer-grained diagnostic.

  **5. Deliverables & Impact (The Use)**
  The core output is a framework for diagnosing and anticipating portability challenges based on level of abstraction. **Success** looks like:
  1.  Evidence supporting/refining the level-drift hypothesis.
  2.  A conceptual **Decision Heuristic**: A checklist for researchers/policymakers to assess the likely portability risks associated with micro vs. macro features of a model when planning replication or intervention transfer. (e.g., "For predicting segregation patterns under demographic change, prioritize calibrating the tipping point model (macro) over individual preference surveys (micro), given historical evidence of micro-drift.")
  3.  Reframing the individualism-holism debate as concerning contingent stability, not fundamental ontology.

  **6. Embracing Failure (The Honesty)**
  The most likely **failure condition** is finding that stability is highly phenomenon- and context-specific, with no consistent advantage to either level across the board. **This is still valuable:** It would demonstrate that the traditional debate *is* a pseudo-debate for scientific practice. The crucial task becomes context-sensitive level choice for portability, not defending ontological priors. The output becomes a forceful argument against level-based universalism and for pragmatic, diagnostic modeling. The Decision Heuristic would then focus on identifying *which specific features* (not just level) predict drift in a given context.

  \answer{This project argues that model portability depends systematically on level of abstraction, with macro-regularities often exhibiting lower re-estimation burden across contexts due to multiple realizability, reframing the individualism-holism debate as a pragmatic wager on stability.}
