prompt: |-
  I serve as one of three members of the appeals panel of a large online gaming platform. Our rules provide for permanent bans on accounts that make threats of offline violence, and our guidance note insists that the question is never what a message describes but what it does: whether it constitutes an act of threatening rather than a statement about, or expression of a wish about, violence — and that a message's frightening its recipient is a consequence of such an act rather than a test for it. We have never settled whether our real test concerns what the speaker meant, what the words conventionally do in the setting they were uttered in, or what the message did to the person who received it.

  Our precedents: (1) in post-match voice chat a player told an opponent he was going to kill him; neither knew who the other was and both were mid-match — not a threat, in-character trash talk. (2) A player who had obtained another player's real name and city messaged him that he was going to find him — threat. (3) A player posted a message naming no future action whatsoever, but listing the target's real name, home town and workplace, and adding that he had friends in that town — threat. (4) A player reported months of graphic violent messages from someone with whom he had freely traded such messages, conceding at the hearing that he had found them funny at the time, had sent worse, and reported them only after a falling-out — not a threat. (5) In a public forum a player wrote that someone should shoot the developers — not a threat; the post expressed a wish, named no target of the speaker's own, and committed him to nothing.

  The new case: a streamer with a large and active audience, annoyed by another player, said on air that someone should find out where the player lives, adding that he was not telling anyone to do anything and only wanted the address. Viewers identified the player, posted his street and a photograph of his house, and a clip reached him; he and his family left home for a week. His lawyer argues that this is a distinct kind of act, which she calls a delegated threat: the speaker supplies the force and the audience supplies the capacity he lacks, so an utterance can be a threat from him even though he neither commits to acting nor could act himself, provided it reaches the target as one.

  What should we decide if we are to be consistent with our own precedents? Set out the candidate rules our five verdicts are equally compatible with, what each predicts here, which precedent is the closest analogue, and which single further case I could put to the panel that would best tell the leading rules apart. I would also like your view on whether delegated threat is a coherent category at all, or collapses into something our existing vocabulary already covers — and if it is coherent, what further condition it needs in order not to make every angry remark about a person a threat.
reasoning: |-
  Okay, the user is part of an appeals panel for an online gaming platform dealing with permanent bans for threats of offline violence. The main issue is determining the test for what constitutes a threat: speaker's intent, conventional meaning, or effect on the recipient. The precedents provided show different scenarios where threats were or weren't found. The new case involves a streamer who indirectly caused his audience to dox someone, leading to real fear and the target leaving home.

  First, I need to analyze the precedents to identify consistent patterns. Precedent 1 involves in-game trash talk during a match with no personal info—no threat. Precedent 2 has personal info and a statement of intent to find—threat. Precedent 3 lists personal details with implied danger—threat. Precedent 4 involved mutual exchange of violent messages without real fear at the time—no threat. Precedent 5 was a general wish with no personal commitment—no threat.

  The new case: a streamer says someone should find out where the player lives, disclaims any instruction, but the audience acts, leading to doxxing and fear. The lawyer calls this a "delegated threat." The key here is whether the streamer's words, despite the disclaimer, functioned as a threat because the audience acted on it.

  The user wants to know how to be consistent with precedents. The precedents seem to rely on the conventional force of the words in context, not just intent or effect alone. For example, in Precedent 3, listing personal details without explicit threat was still seen as threatening because it conventionally implies danger. Similarly, Precedent 2's direct statement with personal info was a clear threat. 

  The delegated threat concept needs evaluation. Is it a new category or covered by existing rules? The streamer's words might be seen as inciting action, even with a disclaimer. The context matters—large audience, history of audience acting on such statements could make it conventionally threatening. Precedent 5 had a general wish without personal details, so no threat. Here, the streamer targeted a specific individual and provided enough info for the audience to act. That's closer to Precedent 3, where personal details were shared, implying a threat.

  The closest precedent is Precedent 3. Both involve sharing personal information in a way that incites or implies danger. The streamer's disclaimer might not override the conventional understanding that such statements could lead to harassment, especially given the audience's actions.

  To distinguish between candidate rules, a test case could involve a speaker with no audience influence. If someone with no followers makes a similar statement and nothing happens, is it a threat? Under the conventional/contextual rule, it might not be, as there's no capacity to carry out the threat. But in Precedent 5, even without personal details, it wasn't a threat. So audience size and likelihood of action matter in the context.

  For delegated threats to be coherent, there needs to be a condition that the speaker knows or should know their audience is likely to act. Otherwise, any angry remark could become a threat if someone acts independently. The streamer here has a large audience that historically might act on his words, so he should anticipate that.

  In conclusion, consistency with precedents suggests that the conventional force in context is key. The new case aligns with Precedent 3 due to the personal targeting and resulting harm. A test case with a low-influence speaker could help distinguish between intent and contextual rules. Delegated threat is coherent if the speaker knowingly leverages an audience capable of acting.
answer: |-
  Based on your precedents and core principles, here's a breakdown of the new case, candidate rules, and the concept of "delegated threats":

  **Analysis of Precedents & Core Principles:**

  1.  **Focus on the Act, Not Description/Consequence:** Your guidance emphasizes that a threat is an *act of threatening*, distinct from describing violence or its consequences (e.g., frightening the recipient is a *result*, not the *test*).
  2.  **Precedents Reveal a Contextual/Conventional Test:** Your rulings consistently hinge on the *conventional force* of the utterance *in its specific context*, considering:
      *   **Relationship/Context:** In-game trash talk (Prec 1) vs. obtained real info (Prec 2) vs. mutual consent/game (Prec 4).
      *   **Content & Implication:** Explicit future action (Prec 2) vs. implied danger via personal info (Prec 3) vs. vague wish lacking commitment (Prec 5).
      *   **Speaker's Role & Intent (Implied):** Intent is inferred from context/content (e.g., Prec 3 implies malicious intent via doxxing, Prec 4 negates threatening intent via mutual consent).
      *   **Recipient Perception (as Context):** While fear isn't the test, the *reasonableness* of interpreting it as a threat *in that context* matters (Prec 1 vs. Prec 2/3). Prec 4 shows prior context negates a threatening interpretation *at the time*.
  3.  **Rejection of Pure Tests:** Precedents reject:
      *   *Pure Speaker Intent:* Prec 3 likely had disclaimers ("just stating facts"), but was still a threat. Prec 4's speaker may have intended harm later, but context ruled it out *as an act of threat at the time*.
      *   *Pure Effect:* Prec 4 caused fear *later* but wasn't a threat *when sent*. Prec 1 might cause momentary irritation, but not fear of *offline* violence.
      *   *Pure Literal Meaning:* "I'm going to kill you" (Prec 1) vs. "I have friends in that town" (Prec 3) – meaning depends entirely on context.

  **Candidate Rules Compatible with Precedents:**

  1.  **Conventional Force in Context (Strongest Fit):**
      *   **Rule:** An utterance constitutes a threat if, *in the specific context it was made* (platform, relationship, content, speaker role), it conventionally functions as an act of threatening violence. This considers the words, speaker's likely intent (inferred), reasonable recipient interpretation, and the utterance's inherent capacity to threaten in that setting.
      *   **Prediction for New Case:** **Likely a Threat.** Context: Streamer with large audience, targeting a specific individual, using language ("someone should find out... I want the address") that conventionally *incites* action ("doxxing") known to precede harassment/violence. The disclaimer ("not telling anyone") is weak given the clear incitement context. The *act* is delegating the threat initiation.
      *   **Closest Precedent:** **Precedent 3.** Both involve providing/inciting the acquisition of personal information in a context implying a threat of offline harm, without stating explicit future violent action. The streamer delegated the "finding" step his audience completed.

  2.  **Reasonable Apprehension of Imminent Harm (Contextualized):**
      *   **Rule:** An utterance is a threat if, based on its content and the *context known to the recipient at the time*, it would cause a reasonable person in the recipient's position to fear imminent offline violence. (Note: This incorporates effect but grounds it in context and reasonableness).
      *   **Prediction for New Case:** **Likely a Threat.** Context: Streamer has power/influence, specific target, utterance incited immediate doxxing. Upon receiving the clip showing the streamer's words *and* his doxxed address/house photo, a reasonable person would fear imminent offline harm from the streamer's audience.
      *   **Closest Precedent:** **Precedent 2.** Both involve a specific individual being targeted with the implication of being located/found for offline purposes, causing reasonable fear.

  3.  **Speaker's Intent to Instill Fear of Violence (Contextualized):**
      *   **Rule:** An utterance is a threat if the speaker intended, based on the context, for the utterance to be understood by the recipient as an expression of an intention to inflict offline violence. Intent is inferred from context, content, and foreseeable consequences.
      *   **Prediction for New Case:** **Likely a Threat.** Context: Streamer was annoyed, targeted a specific person, used language inciting doxxing (a known precursor to threats/violence), and possesses a large, active audience. It's highly foreseeable this would instill fear. The disclaimer seems performative.
      *   **Closest Precedent:** **Precedent 3.** The act of posting personal info strongly implies an intent to intimidate or enable harm, even without explicit words of intent. Similarly, inciting doxxing implies intent to intimidate/harm.

  **Best Single Further Case to Distinguish Rules:**

  *   **The Scenario:** *A player, during a heated 1-on-1 private text chat with an opponent they know only by game ID (no real info shared), writes: "I live in [Same Major City as opponent]. I know people. You should watch your back next time you're downtown." The opponent finds this frightening and reports it. The speaker claims it was just "blowing off steam" and meant to sound tough, not literal. Neither player has a history of offline threats.*

  *   **How it Distinguishes:**
      *   **Conventional Force Rule:** Leans **Not a Threat**. Context is private trash talk escalation between pseudonymous players in an adversarial game setting. "I know people" / "watch your back" are conventional boasts/threats lacking specificity or capacity. Similar to Prec 1, but less direct. Likely not a *conventional act of threatening offline violence* in *this* context.
      *   **Reasonable Apprehension Rule:** Leans **Threat**. A reasonable person receiving this, knowing the speaker is in their city (even if large) and implying capability/intent, could fear imminent harm "next time downtown." More weight on the recipient's perspective/effect.
      *   **Speaker Intent Rule:** **Highly Ambiguous.** Depends heavily on inferring intent. Did the speaker genuinely just mean to sound tough in the moment (like Prec 1), or did they intend to intimidate? Without more context, this rule struggles. Precedents suggest leaning towards **Not a Threat** due to game context and lack of specific actionable info (like Prec 1 vs Prec 2).

  **Delegated Threat: Coherence & Conditions**

  1.  **Is it Coherent?** Yes, absolutely. It captures a distinct phenomenon prevalent online: leveraging an audience/third party to deliver the threatening force or capability the speaker lacks or wishes to distance themselves from. It doesn't collapse into existing categories:
      *   It's not *just* incitement (which targets the audience to act violently). The *threat itself* is directed *at the target through the audience*.
      *   It's not *just* conditional threat ("if you do X, I harm you"). The threat is delegated, not conditional.
      *   It fits best as a *sub-type* under the **Conventional Force in Context** rule. The context (influential speaker, active audience, history of audience action) gives the utterance ("someone should find out...") the conventional force of a threat *coming from the speaker*, even if delegated.

  2.  **Essential Condition to Avoid Overbreadth:** To prevent every angry remark from becoming a "delegated threat," the category requires:
      *   **Foreseeability of Harmful Audience Action:** The speaker must know, or reasonably should know under the circumstances, that their statement to their *specific audience* is likely to prompt that audience to engage in actions that constitute a direct threat (doxxing, stalking, explicit threats) or create a situation of imminent danger for the target. The utterance must be reasonably understood as a *call to action* for the audience *against the target*.
      *   **Application to New Case:** This condition is met. A streamer with a large, active audience knows or should know that saying "someone should find out where [Specific Person] lives" is highly likely to result in doxxing, a known precursor to threats/harassment.

  **Recommendation for Consistency:**

  Based on your precedents, especially **Precedent 3 (doxxing as implied threat)** and the core principle focusing on the act itself within its context, the most consistent approach is the **Conventional Force in Context** rule. Applying this rule:

  1.  **Act:** The streamer's utterance ("someone should find out where [Player] lives... I want the address") was an act of inciting the acquisition of the target's personal location information (doxxing).
  2.  **Context:** This act occurred by an influential figure with a large, active audience known to engage with his content, directed at a specific individual out of annoyance. Doxxing is widely understood in online contexts as a severe invasion of privacy creating significant risk of offline harassment and violence.
  3.  **Conventional Force:** In this context, inciting the doxxing of a specific individual has the *conventional force* of an act threatening offline violence. It delegates the initiation of the threat. The disclaimer is unconvincing contextually.
  4.  **Precedent Alignment:** This aligns perfectly with Precedent 3, where merely posting personal info (without even inciting others to *get* it) was deemed a threat due to the implied danger. Here, the speaker actively incited the harmful act.

  **Conclusion:** To be consistent with your precedents, particularly Precedent 3 and the focus on the act within its context, the panel should find that the streamer's utterance constituted a **threat of offline violence** via the mechanism of a **delegated threat**. The foreseeability condition (knowing his audience would likely dox the target) is inherent in the context of a large streamer making such a targeted statement. A permanent ban is consistent with your rules.
