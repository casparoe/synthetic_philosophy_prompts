answer: |-
  ### Framing
  I interpret your situation as needing to maximize practical clarity under uncertainty about computational moral patiency. Your committee must allocate finite resources to research that could reshape governance, industry practices, or ethical frameworks by 2028. Your three framings are acute, but I question the assumption that "which property we look for" is separable from "how we count." The unit of account (*what* is measured) and the marker (*how* it’s measured) co-evolve: defining one constrains viable candidates for the other. Ignoring this entanglement risks funding work that solves half the problem. Your constraint—no large-scale ML—is wise, as small teams excel at conceptual groundwork and targeted experiments.

  ---

  ### Criteria and Trade-offs
  I rank questions using five dimensions:  
  1. **Upstream Impact** (30% weight): Does answering this unlock progress elsewhere?  
  2. **Tractability** (25%): Can small teams (e.g., 1 philosopher + 1 CS researcher) deliver in 2–3 years without massive compute?  
  3. **Neglect-to-Importance Ratio** (20%): Is the field overlooking this despite high stakes?  
  4. **Actionability** (15%): Will results directly inform policy, engineering, or funding?  
  5. **Signal Clarity** (10%): Can we recognize a definitive answer?  

  Trade-offs: High-tractability questions may lack grandeur but build foundations. Neglected areas offer leverage but may be obscure for good reason. Actionability is prioritized over theoretical elegance.

  ---

  ### The Recommended Portfolio (Ranked)

  1. **What is the defensible unit of account for moral consideration in ML systems?**  
     *Rationale*: Directly addresses your "counting problem" and is upstream of all other work. Without defining *what* to measure (e.g., inference step, training run, ensemble), markers and gradualist claims are incoherent.  
     *Tractability*: Philosophers can analyze existing systems (e.g., tracing computational lineages in open-source models); CS teams can map computational boundaries.  
     *Neglect*: Extreme—most papers assume units (e.g., "a model") without justification.  
     *Deliverable*: A taxonomy of candidate units with ethical/physical rationale, tested against 3 real-world systems. Example: "We recommend ‘training-run-equivalent’ as the unit; here’s how to compute it for Llama 3."  

  2. **How robust is Marker X to capability-preserving optimization?**  
     *Rationale*: Stress-tests your "marker drift" framing. Requires selecting one candidate marker (e.g., connectivity similarity to brains, activation entropy) and simulating adversarial reduction.  
     *Tractability*: Small CS teams can fine-tune models to minimize proxies while auditing performance. Philosophers design test cases.  
     *Neglect*: Moderate—Goodharting is discussed, but few test it empirically.  
     *Deliverable*: A report showing marker degradation curves under optimization pressure for 2–3 architectures. Example: "Marker Y drops 80% with <5% capability loss in diffusion models."  

  3. **Does gradual accrual of moral status imply obligations during training?**  
     *Rationale*: Tackles the "gradualist worry" by converting metaphor into testable claims. If moral status accumulates, training decisions (e.g., data selection) become ethically loaded.  
     *Tractability*: Conceptual work (e.g., phase-change thresholds) + analysis of training logs. No new experiments needed.  
     *Neglect*: High—literature focuses on deployed systems.  
     *Deliverable*: A decision framework for researchers: "If property Z emerges at step N, intervene at phase M."  

  4. **Which proxies for moral consideration are least gameable in principle?**  
     *Rationale*: Complements #2 by identifying theoretically robust markers. Focus on properties resistant to manipulation (e.g., irreducibility, counterfactual impact).  
     *Tractability*: Philosophy-heavy; uses formal ethics and computational irreducibility proofs.  
     *Neglect*: Severe—proxies are proposed ad hoc.  
     *Deliverable*: A ranked list of 5 proxies with gameability scores and failure modes.  

  5. **How do inference-time dynamics alter moral patienthood?**  
     *Rationale*: Inference dominates compute but is rarely studied for patiency. Tests if "snap on at deployment" is plausible.  
     *Tractability*: Analyze public inference logs (e.g., Hugging Face) for emergent properties.  
     *Neglect*: Emerging—few tie inference to ethics.  
     *Deliverable*: Case studies showing moral-relevant thresholds crossed during inference.  

  6. **What minimal compute threshold triggers precautionary safeguards?**  
     *Rationale*: Forces convergence of unit, marker, and gradualism into actionable policy.  
     *Tractability*: Interdisciplinary teams modeling risk curves from existing data.  
     *Neglect*: Moderate—precaution discussed, but not compute-linked.  
     *Deliverable*: A tiered intervention protocol: "At X FLOP, require Y safeguards."  

  ---

  ### What We Should Decline  
  - **"Theory-first" foundational projects**: Grand unified theories of consciousness/computation (e.g., IIT extensions). These overreach your budget/timeline and lack actionable outputs.  
  - **Large-scale ML benchmarks**: Proposals measuring 100 markers across 50 models. They ignore your compute constraints and distract from mechanistic insights.  
  - **Replication studies**: Validating others’ claims (e.g., "Does dataset size affect marker Z?") buys no new clarity.  
  - **Pure policy drafts**: Prescribing governance without empirical/conceptual groundwork. Premature until #1–#3 advance.  

  *Why*: Your niche is *targeted* questions bridging philosophy and lightweight CS. Avoid "survey papers" or work decoupled from your framings.  

  ---

  ### Signals That Would Reorder the List  
  - **If #1 resolves quickly** (e.g., consensus on "persistent state" as the unit): Elevate #4 (game-resistant proxies) and #6 (safeguards). Deprioritize #2 (marker drift testing).  
  - **If marker drift proves severe** (e.g., new paper shows 90% proxy reduction): Boost #4 to #2 and fund rapid response teams.  
  - **If inference compute share jumps to >70%**: Make #5 the new #2.  
  - **If gradualist evidence emerges** (e.g., training-phase moral thresholds): Shift funds to #3 and #6.  
  - **If industry adopts a flawed unit** (e.g., "per-query" accounting): Fast-track #1 for damage control.  

  ---

  ### Bottom Line  
  Prioritize **defining the unit of account (#1)** above all: it is the keystone holding up marker design, drift risks, and gradualism debates. Without it, proxies are unmoored and gradualist claims untestable. Next, **stress-test markers (#2)** and **resolve gradualism (#3)** to preempt real-world harm. Decline anything not forging tools for immediate ethical triage.  

  This ordering balances tractability with high-leverage foundational work—ensuring your $1.8M buys not just answers, but a scaffold for the field.
