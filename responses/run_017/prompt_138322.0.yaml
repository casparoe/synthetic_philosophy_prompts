  **Heckles and Rebuttals:**

  1. **Heckle: "But the sickest are in the most pain! How can you ignore them?"**
     - **Rebuttal:** We are not ignoring pain. But our goal is to maximize overall well-being. A dose given to a sick elder with multiple comorbidities might extend life by weeks, while the same dose given to a young carer might save decades of life and enable the saving of others. The math is clear: the latter yields far more utility per dose.

  2. **Heckle: "A lottery gives everyone an equal chance!"**
     - **Rebuttal:** Equal chance in the moment, but not in outcome. Behind the veil of ignorance, you would not choose a lottery because it doesn't maximize your expected utility. You'd choose the policy that saves the most life and well-being on average. A lottery is arbitrary and ignores the differential impact of saving different lives.

  3. **Heckle: "What about the elderly who built this city? Don't they deserve it?"**
     - **Rebuttal:** Deserve? This isn't about desert. It's about maximizing the good for all. Behind the veil, you might be young or old. But the young have more potential life, and the carers are actively saving lives. We honor the elderly by ensuring that the city they built continues to thrive — and that means saving those who will sustain it longest and most effectively.

  4. **Heckle: "Your math devalues human life!"**
     - **Rebuttal:** On the contrary, it values every life so much that it refuses to waste a single dose. By maximizing the average utility, we ensure that each life we save is lived as fully as possible. That is the highest valuation.

  ---

  **Strengthening the Argument:**

  - The extension to possible people is original and helps avoid the repugnant conclusion. However, note that Harsanyi's original veil did not include possible people. The user's move is a creative extension. To make it airtight, emphasize that the veil of ignorance for possible people is a natural extension of the equal consideration principle: if we care about all who might exist, we must include them in the calculus. And average utility maximization is the only way to avoid the repugnant conclusion without ad hoc adjustments.

  - The argument for carers: explicitly state that a carer's utility includes the utility of those they save. So saving a carer is like saving multiple people. This multiplies the utility per dose.

  - The young: more life-years, but also note that they are typically healthier and thus more likely to recover fully, leading to higher utility.

  Overall, the speech should convey conviction, clarity, and a touch of impatience with those who don't engage with the reasoning. Ilse is the one who has done the math and is unapologetic about it.
