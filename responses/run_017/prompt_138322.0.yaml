  Now, writing the speech (aiming for about 400 words):

  ---

  **Ilse's Speech:**

  "Councilors, we stand at a precipice. Every day, the plague takes more of our people. We have a limited stock of antiviral, and we must decide who gets it. I propose we prioritize the young and the carers. Let me explain why this is not just a practical choice, but the only rational and moral one.

  First, consider how we make decisions. Each of us has preferences. For those preferences to be rational, they must satisfy the axioms of expected utility: completeness, transitivity, continuity, and independence. If we accept that, and if we accept the Pareto principle — that if everyone is better off, society is better off — then Harsanyi's aggregation theorem tells us that social welfare must be a weighted sum of individual utilities. Any other approach violates these axioms of rational choice. It is, quite simply, irrational.

