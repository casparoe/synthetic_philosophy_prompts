  ---

  ### **Ilse's Speech: The Unbeatable Argument**
  "Councilors, we face a tragedy: our antiviral stock is fixed, and people will die. But allocating it to the young and carers isn’t just practical—it’s the *only* rational choice. Let me be clear: any alternative violates the axioms of rational decision-making. I’ll prove it.  
    
