  3. **The Veil of Ignorance for Existing Citizens**
     - Invoke the idea of fairness: behind a veil of ignorance, you don't know who you are. Each citizen has an equal chance of being any one.
     - This leads to maximizing the average utility of existing citizens.

  4. **Extension: Including Possible Future People**
     - To avoid the repugnant conclusion (where total utility could be maximized by creating many barely happy lives), we extend the veil to possible people: you don't know if you will be born or which person you will be.
     - With equal probability for each possible person (existing and non-existing), we maximize average utility (not total) to avoid the repugnant conclusion.

