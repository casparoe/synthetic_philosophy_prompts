  #### Leaf Key:  
  | **Leaf**                 | **Status**                                  | **Notes** |  
  |---------------------------|---------------------------------------------|-----------|  
  | Insufficient Search       | Unexplored                                  | Evidence: Expanded surveys (e.g., SKA telescope). |  
  | Rare Earth                | Defended                                    | Evidence: Finding complex life on a "hostile" exoplanet. |  
  | Rare Abiogenesis          | Plausible                                   | Evidence: Detecting simple life on Mars/Europa. |  
  | Rare Intelligence         | Defended                                    | Evidence: Fossilized alien ecosystems without technology. |  
  | Great Filter Ahead        | Well-explored                               | Evidence: Discovering ruins of an extinct alien civilization. |  
  | Temporal Isolation        | Plausible                                   | Evidence: Ancient artifacts in our solar system (e.g., Oumuamua-like objects). |  
  | Zoo Hypothesis            | Speculative                                 | Evidence: Unexplained signals that cease if we "react" (e.g., METI). |  
  | Alien Incommensurability  | Philosophical                               | Evidence: Detecting complex astrophysical phenomena with no natural explanation. |  
  | Stealth Technology        | Unexplored                                  | Evidence: Advanced tech signatures (e.g., Dyson swarms in infrared scans). |  

  ---

  #### Ambiguous Pairs & Distinguishing Evidence:  
  - **Insufficient Search vs. Stealth Technology**:  
    Both predict continued non-detection. *Distinguisher:* A full-sky survey failing to find *any* technosignatures favors Stealth.  
  - **Zoo Hypothesis vs. Alien Incommensurability**:  
    Both imply "silence by choice." *Distinguisher:* A signal that changes in response to human actions supports Zoo.  
  - **Temporal Isolation vs. Great Filter Ahead**:  
    Both imply civilizations are absent *now*. *Distinguisher:* Finding relics of past galactic empires supports Temporal Isolation.  

  ---  
  *Tree ends in 9 leaves (all occupied), with 6 questions. Critiques: "Alien Incommensurability" and "Stealth Technology" are often conflated but address different mechanisms (cognition vs. engineering).*
