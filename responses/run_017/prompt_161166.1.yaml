  **Q1: Is the absence of evidence likely due to insufficient search efforts?**  
  - **Yes** → **Leaf: Insufficient Search**  
    *Status:* Unexplored. We’ve scanned <0.1% of the galaxy’s stars/frequencies/timescales.  
  - **No** → Proceed to Q2.  

  **Q2: Can we generalize from Earth’s life-history to the galaxy?**  
  - **No** → **Leaf: Rare Earth Hypothesis**  
    *Status:* Defended (e.g., Ward & Brownlee). Earth’s conditions (plate tectonics, moon, etc.) are uniquely ideal.  
  - **Yes** → Proceed to Q3.  

  **Q3: Is the emergence of *simple life* common on Earth-like worlds?**  
  - **No** → **Leaf: Rare Abiogenesis**  
    *Status:* Plausible (e.g., Monod). Life’s origin requires near-miraculous chemistry.  
  - **Yes** → Proceed to Q4.  

  **Q4: Is the evolution of *technological intelligence* (like humans) common?**  
  - **No** → **Leaf: Rare Intelligence**  
    *Status:* Defended (e.g., Mayr). Intelligence is not an evolutionary inevitability.  
  - **Yes** → Proceed to Q5.  

  **Q5: Are technological civilizations typically short-lived?**  
  - **Yes** → **Leaf: Great Filter Ahead**  
    *Status:* Well-explored (e.g., Sagan). Civilizations self-destruct (nukes, AI, etc.) within centuries.  
  - **No** → Proceed to Q6.  

  **Q6: Why do long-lived civilizations evade detection?**  
  - **They’re not contemporary** → **Leaf: Temporal Isolation**  
    *Status:* Plausible. Others rose/fell millions of years ago (or will exist far in the future).  
  - **They exist now but avoid contact** → **Leaf: Zoo Hypothesis**  
    *Status:* Speculative (e.g., Ball). Advanced civilizations hide or deem us "unready."  
  - **We wouldn’t recognize them** → **Leaf: Alien Incommensurability**  
    *Status:* Philosophical (e.g., Wittgenstein). Their tech/motives are too alien to register as "civilization."  
  - **Their signals are undetectable** → **Leaf: Stealth Technology**  
    *Status:* Unexplored. They use neutrino comms, Dyson swarms with low waste heat, etc.  

