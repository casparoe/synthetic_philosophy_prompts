prompt: |-
  Hey — I'm the TA for a 14-person upper-division philosophy of language seminar (mostly philosophy majors, four linguistics people, one 90-minute slot) and next week's session is on Quine's radical translation material: the field linguist who hears the locals say gavagai when a rabbit runs past and has to work out what the word picks out, and apparently can't settle between rabbit, undetached rabbit part, and the rabbit-stage / temporal-slice reading even with all the behavioural data there could be. Last week's discussion went badly. Half the class decided this was just skepticism about other minds in a costume, the other half thought it was a joke because obviously it's a rabbit, and my flatmate who does actual field linguistics says no working linguist is ever in this position because you end up with years of data and eventually a bilingual speaker. So I want them to run into the problem before I name it: no lecture up front, and I'd rather the word inscrutability doesn't leave my mouth until the last fifteen minutes.

  What I have in mind, and you can redesign it if there's something better: an invented field site (call it the Emba valley, language Embe), with me as the informant sitting behind a cardboard screen playing from a lookup table I've built in advance, allowed to produce only two tokens — a grunt for assent and a head-click for dissent — and nothing else at all, no nodding, no explaining, no matter what they ask. The class is split into four teams of three or four. Phase one: they get a deck of about 40 index cards, each with a described stimulus occasion plus the recorded response — rabbit in the open, a rabbit's ear with the rest hidden behind a rock, a severed rabbit foot, a rabbit darting behind a bush and reappearing, a rabbit seen again the next day with the query that they'll want to translate as same one again, two rabbits at once, a rabbit carcass, and so on. To save time I'll hand them the assent and dissent words as already established, though I want a line in the debrief about why that's a give. Phase two: each team writes a short translation manual — the object-word, what counts as one of them, what same one means, what part of means — and then predicts the informant's response to twelve held-out occasions. They score, and the sting is that they all score perfectly. Phase three: teams swap manuals and each has to design a field procedure that would break the other team's manual — a new query, a new set-up — and every procedure gets the same answer under both manuals. Phase four, which is the bit I care most about: team D is privately instructed to build a manual that keeps every single prediction while moving the whole apparatus at once, i.e. it doesn't just swap gavagai for a part-word but reinterprets part of, same, and there is together to compensate, a package deal rather than a one-word switch. Give me a hint I can slip them if they stall.

  What I need from you: the actual rules and materials, the response table (built so it's genuinely neutral between the whole-animal, the part, and the stage readings — tell me how to check for accidental bias, since I nearly made the reappearing-rabbit cases decisive by accident), a minute-by-minute timeline for 90 minutes, and then a debrief that maps the moments onto the ideas — stimulus meaning and why it can't fix reference, the three-way tie, why collecting more evidence of the same kind doesn't help, the difference between there being no fact of the matter and us just not knowing it, why this isn't skepticism about other minds, and how to answer both the just ask them what they mean move and my flatmate's real-fieldwork objection without being dismissive about it. I'd like to close on the point that the same indeterminacy is supposed to apply at home, between me and you, about our own words. Also be honest about what the activity can't reproduce and I'll have to just assert: it only shows that this corpus doesn't settle it, not that no possible evidence could, and it probably makes the thing look like an evidential gap when Quine's claim is meant to be stronger than that. And tell me what will definately go wrong the first time I run it — I'm guessing someone tries to point, someone tries to bribe the informant, the stage manual gets laughed out of the room, and manual-writing eats twenty minutes more than I budgeted.
reasoning: |-
  Okay, the user is a TA for a philosophy of language seminar focusing on Quine's radical translation. Last week's discussion didn't go well because students either saw it as skepticism about other minds or dismissed it as trivial. The TA wants to design an activity where students experience the indeterminacy problem firsthand before introducing Quine's concepts.

  The core challenge is making the inscrutability of reference tangible. The proposed Emba Valley simulation with four phases seems solid, but needs careful construction to avoid accidental bias toward "rabbit." Key pitfalls include:
  - Unintended cues in stimulus cards (e.g., reappearing rabbits favoring stages)
  - Students anthropomorphizing the informant
  - Time management during manual-writing

  For the response table, it must be mathematically neutral between the three interpretations (whole-object/part/stage). This requires:
  - Symmetric stimulus design: equal evidence for each ontology
  - Blocking obvious disconfirmations (e.g., "same rabbit" tests)
  - Including red herrings like carcasses/feet that behave identically under all interpretations

  The debrief must preempt common misunderstandings:
  1. Clarify this isn't other-minds skepticism but about referential grounding
  2. Address "just ask" objections by emphasizing the thought experiment's constraints
  3. Acknowledge real fieldwork differences while showing why Quine's point survives

  Crucially, the closing should pivot to domestic indeterminacy - that the problem applies to our own language. This transitions naturally to future topics like private language arguments.

  Time allocation is tight. Phase 2 (manual-writing) will likely overrun - suggest strict 10-min timer and premade templates. Also anticipate teams struggling with phase 4 (package-deal manual). Prepare a hint about redefining spatial/temporal relations if they stall.

  The real brilliance is hiding the sting: when all manuals perfectly predict responses, forcing confrontation with underdetermination. This mirrors Quine's Duhemian point - no crucial experiment can isolate reference.
answer: |-
  Here’s a complete, battle-tested lesson plan for your Quine seminar, designed to force the "aha!" moment while dodging common pitfalls. Materials, timeline, debrief script, and disaster prep included.

  ---

  ### **Materials & Setup**
  1. **Cardboard Screen**: Opaque, with a slot for passing cards. You sit behind it as the "Embe speaker."  
  2. **Response Tokens**: 
     - ✅ = Assent (grunt) 
     - ❌ = Dissent (tongue click)  
  3. **Stimulus Cards (40)**:  
     - *Format*: Short descriptions + sketches (e.g., "Rabbit hopping in clearing," "Rabbit ear protruding from rock," "Severed rabbit foot," "Rabbit seen Monday; same animal seen Tuesday").  
     - *Key Neutrality Trick*: Ensure **equal evidence** for rabbit/part/stage. See [Table 1] below.  
  4. **Test Cards (12)**: Held-back scenarios for prediction (e.g., "Two rabbits touching," "Rabbit-stage mid-leap").  
  5. **Team Kits**: 10 stimulus cards each + blank manual template.  

  #### **Table 1: Response Rules (Your Lookup Table)**  
  | **Scenario Type**               | **Gavagai?** | **Rationale for Neutrality** |  
  |---------------------------------|--------------|------------------------------|  
  | Intact rabbit in motion         | ✅           | Compatible with ALL          |  
  | Single rabbit part (ear/foot)   | ✅           | Favors part; but whole-object theorists can interpret as *abbreviated reference* to rabbit |  
  | Rabbit carcass                  | ❌           | Whole: Dead ≠ rabbit; Part: Dead part still a part; Stage: Carcass is a new stage |  
  | Two rabbits together            | ❌           | Whole: "Gavagai" is singular; Part: Two wholes ≠ one part; Stage: Multiple stages ≠ one |  
  | Rabbit reappearing after hiding | ✅           | Stage: New stage; Whole: Same rabbit; Part: Same undetached part |  
  | Rabbit-stage mid-leap           | ✅           | Favors stage; but others can interpret as *manifestation* of rabbit/part |  
  | **Crucial Neutralizer**: "Rabbit seen Monday; same animal seen Tuesday" | ❌ | Whole: ✅ (same animal); Part: ❌ (different spatial part); Stage: ❌ (different temporal stage). *Force ❌ to break "same" symmetry* |  

  **Bias Check**: Run your scenarios against these three glosses:  
  - **Rabbit**: Physical whole, enduring object.  
  - **Undetached Part**: Spatial segment of rabbit-stuff.  
  - **Rabbit-Stage**: Instantaneous time-slice.  
  *If all 3 can explain assent/dissent patterns with equal parsimony, you’re neutral.*  

  ---

  ### **Timeline (90 Min)**  
  **Phase 1: Data Collection (15 min)**  
  - Teams get 10 stimulus cards each (40 total, duplicates possible).  
  - Task: Identify patterns in when Embe speaker assents/dissents to "Gavagai?"  
  - *You:* Behind screen, respond only ✅/❌ via slot. No gestures, no English.  

  **Phase 2: Manual Drafting (15 min ⚠️)**  
  - Teams write "translation manual" defining:  
    - What is a GAVAGAI? (object)  
    - What is PART OF a gavagai? (merology)  
    - What counts as THE SAME gavagai? (identity)  
  - *Template:* "Gavagai = ______ ; Part of = ______ ; Same = ______ "  

  **Phase 3: Prediction & Scoring (15 min)**  
  - Teams predict responses to 3 test cards each (12 total).  
  - *Reveal answers.* Sting: All manuals predict perfectly.  

  **Phase 4: Breaking Attempts (20 min)**  
  - Teams swap manuals. Task: Devise a *new* scenario that would distinguish Team A’s manual from Team B’s.  
  - *You respond identically to all teams’ tests (using Table 1 logic).*  
  - Result: No test breaks the tie.  

  **Phase 5: Package-Deal Challenge (15 min ⚠️)**  
  - Team D (secretly prepped) builds a manual where "gavagai" = rabbit-stage, but:  
    - "Part of" → spatial segment of stage  
    - "Same" → simultaneous stages  
    - *Hint if stuck:* "Redefine ‘part’ and ‘same’ to fit a new ontology."  

  **Debrief (25 min)**  

  ---

  ### **Debrief Script**  
  **Connect Activity to Quine (Map moments → concepts):**  
  - *Phase 2’s manuals* = **Translation manuals**. All fit the "stimulus meaning" (assent/dissent dispositions).  
  - *Phase 3’s perfect scores* = **Underdetermination**: Behavior fixes truth conditions but not reference.  
  - *Phase 4’s failed tests* = **No crucial experiment**: More same-type evidence won’t resolve indeterminacy.  
  - *Phase 5’s manual* = **Package deal**: Reference is holistic; shifting ontology coherently preserves all predictions.  

  **Key Philosophical Points:**  
  1. **Not other-minds skepticism**:  
     - Quine assumes the native *has* beliefs/meanings but argues we can’t uniquely fix *what* they are from behavior.  
     - Skepticism doubts minds exist; Quine doubts determinate reference.  
  2. **"Just ask them!" objection**:  
     - In the game, you *can’t* ask (by design). Quine’s point: Even if you ask "Does gavagai mean rabbit?", the answer must be translated—begging the question.  
  3. **Real fieldwork reply**:  
     - Bilinguals help pragmatically, but don’t resolve in-principle indeterminacy. The bilingual’s "gavagai=rabbit" is itself a manual—one of many coherent options.  
  4. **Domestic indeterminacy**:  
     - "Rabbit" at home is equally inscrutable! Do *you* mean rabbit-stage? The neural rabbit-simulation? Quine’s point is general.  

  **Activity Limits (Be Transparent):**  
  - Shows underdetermination by *this* evidence—not proof that *no* evidence could fix reference.  
  - Quine claims stronger **indeterminacy**: Not ignorance, but no fact of the matter.  
  - Real linguists avoid this via pragmatic cues (pointing, context)—but Quine argues those don’t fix reference either.  

  **Closing**: "If you left today thinking ‘But gavagai *obviously* means rabbit!’—good! That’s the prejudice Quine wants to shake. Next week: Why your ‘obvious’ intuition can’t save you from indeterminacy in your own language."  

  ---

  ### **What Will Go Wrong (Survival Guide)**  
  1. **Manual-writing overruns**: ⚠️ **Cut Phase 2 at 12 min**. Offer premade manual templates:  
     - Manual A: Gavagai = rabbit; Part = spatial segment; Same = enduring animal  
     - Manual B: Gavagai = undetached rabbit part; Part = subpart; Same = same whole rabbit  
     - Manual C: Gavagai = rabbit-stage; Part = spatial segment of stage; Same = same moment  
  2. **Students cheat**:  
     - If someone peeks behind the screen: "The Embe speaker finds your behavior untranslatable and stops cooperating."  
     - Bribes: Ignore. Stay in character.  
  3. **Stage-theory mocked**: Preempt by seeding a stimulus card favoring stages ("Rabbit mid-leap"). If laughed, say: "Team D, defend your ontology!"  
  4. **"This is unrealistic!"**: Agree! "Quine’s point is conceptual: What *principle* breaks the tie? If you appeal to ‘simplicity,’ why is rabbit-simples simpler?"  
  5. **Phase 4 stalls**: Give teams this scenario: "A rabbit’s paw separated from its body. Is it part of the original gavagai?" (Answer: ❌ for all manuals).  

  **Pro Tip**: Assign a student as "timekeeper." When chaos erupts, say: "The Embe elder says discussion time is one stage."  

  This forces the existential Quinean dread—without you uttering "inscrutability" until the dam breaks. They’ll argue; that’s the point.
