answer: |-
  This is a sharp analysis of a pervasive tension in urban governance. Let's reconstruct the implicit theories embedded in this process, separate settled facts from contested ideas, and identify key questions.

  ### The Implicit Theory: Deconstructing "Temporal Feudalism"
  Your "temporal feudalism" label hits a nerve because it exposes core presuppositions of this system:

  1.  **The Primacy of Proximity & Incumbency:** The system presupposes that **current, proximate property owners/residents have the strongest legitimate claim to control change.** Their physical presence and existing investment (financial, emotional) grant them unique standing. "Getting there first" establishes a de facto entitlement to veto changes perceived as threatening.
  2.  **Property as a Bundle of Negative Rights:** Property ownership is implicitly understood less as a right *to use* land productively and more as a right *to exclude* unwanted changes nearby ("negative externalities"). Existing homeowners' rights to "quiet enjoyment" (even if hypothetical) outweigh potential newcomers' rights to access housing or a developer's rights to build permitted densities.
  3.  **The Neighborhood as a Static Entity with Fixed Character:** The process presupposes the neighborhood has an inherent, pre-existing "character" (often implicitly defined by low density, single-family homes, dominant demographics) that must be protected. This character is seen as an asset *belonging* primarily to current residents. Change is inherently suspect unless proven otherwise.
  4.  **Standing Requires Tangible, Immediate Harm (or Perception Thereof):** Only those who can articulate a direct, immediate, tangible negative impact (traffic, noise, shadows, "views," perceived property value loss) are granted significant standing. Future residents, who would *benefit*, have no tangible existence yet. Broader societal needs (housing shortage, climate goals via density) are abstract and lack standing.
  5.  **Community Input = Input from Vocal, Organized Incumbents:** "The community" is operationally defined as those who show up to hearings, who are overwhelmingly existing, often homeowner residents opposed to change. Renters, future residents, and those who don't attend (due to work, lack of awareness, or support) are effectively excluded from defining "community" sentiment. Sustained opposition is treated as *the* community voice.
  6.  **The Presumption Against Change:** While zoning codes might *plan* for change, the political process creates a strong presumption *against* change. The burden of proof lies entirely on the developer/applicant to overcome objections. "No" is the default outcome unless opposition is minimal or overridden.

  ### What the Practice Strictly Commits To vs. What it Merely Goes Well With
  *   **Strictly Committed To:**
      *   Legal standing is primarily granted to adjacent property owners and residents within a defined notification area for zoning changes.
      *   Public hearings are a required part of the rezoning/variance process.
      *   Elected officials (Council) have discretionary power to approve or deny rezonings/variance requests based on public input and other factors (compatibility, comprehensive plan, etc.).
      *   Existing property owners have legal rights concerning their *own* property use (subject to code) and rights to be notified/heard about changes *adjacent* to them.
  *   **Goes Well With (But Not Strictly Required):**
      *   Treating sustained neighborhood opposition as a *sufficient* reason for denial (rather than just one factor).
      *   Prioritizing the concerns of existing residents over potential future residents or citywide needs.
      *   Equating "neighborhood character" with its *current* physical form and demographics.
      *   Focusing almost exclusively on localized, immediate impacts over long-term, citywide benefits.
      *   The "temporal feudalism" dynamic where incumbency grants disproportionate power.

  ### Alternative Theories Leading to the Same Practice
  Different philosophical starting points can rationalize this outcome:
  1.  **Strong Localism/Communitarianism:** Argues that local communities have the primary right to self-determination, including shaping their physical environment. The "community" is defined by its current members.
  2.  **Property Rights Fundamentalism:** Views existing property rights as near-absolute. Any change imposing perceived negative externalities on neighbors is an infringement requiring consent or veto power. The focus is solely on protecting existing investments.
  3.  **Pragmatic Political Realism:** Elected officials are accountable to current voters, not future ones. Organized, vocal opposition represents a political risk (lost votes, campaign support). Denial is the politically rational choice, regardless of planning merits. This doesn't presuppose an *ethical* theory, just a practical one.
  4.  **Risk Aversion/Slow Change Preference:** Assumes rapid change is inherently destabilizing and risky. Preserving the status quo is safer, even if suboptimal, because the downsides of change are more visible/immediate than the downsides of stagnation (like displacement or unaffordability).

  ### Can "Arrival-Time" Be More Than Incumbent Apologia?
  It's extremely difficult. Most attempts to salvage a non-arbitrary "arrival-time" principle quickly collapse:
  *   **"Investment" Argument:** Incumbents have invested more time/money. But newcomers invest too (often *more*). Renters invest community ties without property ownership.
  *   **"Community Knowledge" Argument:** Incumbents understand local needs. But this can entrench parochialism and resist necessary adaptation. Future residents might bring valuable fresh perspectives.
  *   **"Established Expectations" Argument:** People bought/rented expecting certain conditions. But cities are dynamic; no property right guarantees the neighborhood *around* you never changes. Expectations should be bounded by zoning *plans* (which, in this case, support the change!).
  A truly defensible version would need:
  1.  **Sunsetting:** Incumbency power shouldn't be perpetual. After X years, the presumption shifts.
  2.  **Balancing Mandate:** The process *must* explicitly weigh incumbent concerns against citywide needs and future resident access.
  3.  **Inclusive "Community" Definition:** Mechanisms to include renters, nearby workers, and representatives of future residents/housing advocates in the standing process.
  4.  **Alignment with Plan:** Significantly higher deference to projects conforming to pre-established plans (like this one seems to).

  ### Separating Settled, Contested, and Personal Views

  *   **Settled/Descriptive Facts (Widely Accepted in Planning/Policy):**
      *   Rezoning/variance processes typically grant legal standing and notification rights primarily to adjacent/very nearby property owners and residents.
      *   Public hearings are a standard, often legally required, component of these processes.
      *   Sustained, organized neighborhood opposition is a *powerful* political force in land-use decisions, frequently leading to project denial or downsizing, even for projects consistent with plans.
      *   Future residents of a proposed development have no formal standing in the approval process.
      *   Elected bodies (City Council, Planning Commission) usually have broad discretionary power over rezonings.
      *   Concerns about traffic, parking, "neighborhood character," and property values are the most common and politically potent forms of opposition.
      *   There's a significant gap between formal comprehensive plans (often supporting density near transit/corridors) and the political reality of implementing them when faced with opposition.

  *   **Live Disagreements (Among Planners, Economists, Policymakers, Advocates):**
      *   **The Weight of Opposition:** Should sustained opposition be a *sufficient* reason for denial, or merely one factor balanced against the plan, housing needs, equity, and sustainability goals? (Massive debate).
      *   **Defining "Stakeholder" & "Community":** Who *should* have standing? Should it be expanded? Should renters have equal standing to owners? How far out should notification/standing extend? Should citywide housing advocates have standing?
      *   **The Nature of "Harm":** Are concerns about "character," "views," or potential (unproven) property value impacts legitimate harms warranting veto power, or are they often exclusionary preferences? Are traffic/parking concerns systematically overstated?
      *   **Discretion vs. Rules:** Should discretionary review be minimized ("by-right" development) for projects meeting the plan, or is flexibility essential? (See debates over "Euclidean Zoning" vs. Form-Based Codes vs. discretionary systems).
      *   **Property Rights Balance:** Does the current system strike the right balance between individual property rights (developer, neighbors) and collective societal needs (housing, environment, equity)?
      *   **Effectiveness of Public Hearings:** Are hearings truly democratic input, or do they disproportionately amplify privileged, oppositional voices and produce worse outcomes?

  *   **My Own Views (Based on planning theory, evidence, ethics - not universal consensus):**
      1.  **Temporal Feudalism is Real & Problematic:** Your diagnosis is accurate. The system grants disproportionate, often arbitrary, power to incumbent homeowners based on arrival time and proximity, treating them as the sole legitimate "community."
      2.  **Democracy Deficit:** Relying on self-selected hearing attendees is poor democracy. It ignores silent majorities, future residents, and citywide interests. True democratic legitimacy requires mechanisms to incorporate *all* affected interests.
      3.  **Hypocrisy & Exclusion:** The contrast between welcoming ads and exclusionary processes is stark. Opposition often masks exclusionary motives (conscious or unconscious) related to class, race, or simply aversion to change, wrapped in technical objections.
      4.  **Planning Failure:** When projects conforming to adopted plans get killed by opposition, it represents a failure of planning and political leadership. Plans become aspirational documents, not governing ones.
      5.  **Need for Structural Reform:** Fixing this requires moving towards more "by-right" development for projects meeting clear plans, reducing discretionary veto points, broadening standing definitions, implementing mechanisms like citizen juries for larger projects, and shifting focus from localized impacts to systemic benefits/harms (e.g., mandatory housing needs assessments weighing denial impacts).
      6.  **"Character" is Dynamic:** Neighborhoods constantly evolve. Defining "character" solely by its current physical form ignores history and stifles necessary adaptation. Healthy communities can absorb thoughtful change.

  The core tension remains: **Does the city primarily belong to its current residents, or does it also belong to its future residents and the broader society that needs it to function?** The current process, as you've experienced, overwhelmingly presupposes the former. Challenging that presupposition is essential for building more equitable, sustainable, and dynamic cities.
