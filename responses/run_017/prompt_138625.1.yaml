prompt: |-
  I teach an upper-level undergraduate seminar on meaning and rule-following: sixteen students, one eighty-minute session, one teaching assistant, a room with movable chairs, index cards, and a board. I want a runnable activity that makes them feel, rather than hear, why the rule-following debate is not a puzzle about other people or about the limits of evidence. By the end I want them to have run into four things on their own: that the pressure is first-personal and about *correctness* rather than about knowledge of someone else's mind; that nothing they can point to inside themselves — a formula, an image, a felt sense of "and so on", their own past answers — settles which rule they meant, because whatever they point to is itself something that has to be taken one way rather than another; that appealing to the community does not end the difficulty but moves it up a level, since agreement with whom, over what range of cases, and counted in what respect is the same question again; and that what is left at the bottom is not ignorance of a fact but something more like a decision about whether to go on with a person.

  The device I have in mind, which you may replace if you have something better and you should say what makes your replacement better, is this. Give the sequence 1, 2, 4, 8, 16 and ask for the next term. Most will write 32. Among the responses they see, one card gives 31, with its rule stated: the greatest number of regions you can cut a circle into by joining every pair of n points on its circumference, which begins 1, 2, 4, 8, 16, 31, 57, 99. This matters because the usual dismissal of a deviant continuation is that the deviant rule is gerrymandered, disjunctive, or grue-like; this one is none of those things. It is a perfectly projectible, non-ad-hoc mathematical function that simply happens to agree with doubling for the first five terms. So the class cannot wave it away, and the question "what makes it the case that I meant doubling?" has to be answered on its merits. I also want a far-divergence card alongside it — a rule that agrees with the expected one on every case anyone in the room will ever meet and diverges only at inputs far too large to check — plus a short paired exercise in which one student privately writes down a rule and their partner, without seeing it, produces a different rule that fits every term revealed so far, however many terms they are given. The partner always wins, and I want them to feel that. Since the discussion should not look like a fact about arithmetic, include at least one non-numerical parallel case in which the continuation of a pattern of shapes or of the application of an ordinary predicate is at issue.

  Constraints. No lecture before the activity, and the words Kripke, Wittgenstein, quus, grue, sceptical solution, indeterminacy and rule-following paradox are not used until the final eight minutes. The cards must be described honestly as responses collected in another seminar rather than passed off as this class's own. The facilitator may never assert that there is no fact of the matter: if that claim arrives, a student has to say it and the others have to push back on it. The final poll should be designed to discriminate three positions that are easy to run together — there is a determinate fact about which rule was meant and we merely cannot tell which; it is indeterminate which rule was meant, though something weaker is still true; and there is no fact here at all, so that asking which rule was meant is not asking a question with an answer waiting to be found — and the debrief should say what each answer commits the student to and which of the three the activity itself can support.

  What I need from you: the rules and materials; a minute-by-minute timetable for the eighty minutes; the debrief, mapping each moment of the session onto the claim it is supposed to make visible and marking, for each of the escape routes students will reach for — simplicity or naturalness, introspection, intentions, more data, community agreement — where in the timetable it arises, what it would cost to take it, and what is wrong with taking it there; an honest list of what will predictably go wrong the first time I run this, with a fix for each; and a frank account of which feature of the debate the activity cannot reproduce and which the facilitator must therefore say out loud. On that last point I take it that the normativity claim — that meaning fixes what one *ought* to answer, not merely what one will — is the hardest thing to stage, since the experience the activity produces is naturally described as not being able to tell, and I would like you to say how to convert that into the stronger claim without simply asserting it.
reasoning: |-
  We are designing an activity to help students experience the rule-following paradox in a first-personal way, focusing on correctness, the inadequacy of internal states, the problem with community agreement, and the idea that what's left is a decision.

  Key elements from the user's device:
  - Sequence: 1, 2, 4, 8, 16. Most will say 32.
  - Present an alternative: 31, with a rule (number of regions from connecting points on a circle: OEIS A000127). This rule is projectible and non-gerrymandered.
  - Also include a far-divergence rule (e.g., a rule that matches doubling for all numbers we can compute but diverges at some very large number).
  - Paired exercise: One student writes a rule (privately), the other tries to guess by asking for outputs for inputs. The guesser can always produce a different rule that fits all the given outputs, showing that no finite set of points can uniquely determine the rule.

  Non-numerical parallel: To avoid the discussion being about arithmetic, include a non-numerical case (e.g., a sequence of shapes or an ordinary predicate).

  Constraints:
  - No lecture before. Avoid jargon until the last 8 minutes.
  - Present the cards as from another seminar.
  - Facilitator never asserts "no fact of the matter"; let students come to that and push back.
  - Final poll: Discriminate three positions:
      (A) There is a determinate fact, but we can't tell.
      (B) It is indeterminate which rule was meant, but something weaker is true.
      (C) There is no fact at all; the question has no waiting answer.

  Debrief: Map moments to claims, and for each escape route (simplicity, introspection, intentions, more data, community) show when it arises, what it costs, and why it fails.

  Predictable problems and fixes.

  Hardest part: Normativity (meaning fixes what one ought to do). The activity might feel like we "can't tell", so we must convert that to the stronger claim about correctness without asserting it.

  Revised activity plan:

  I. Introduction (5 minutes)
  - Set up without theory: "We are going to explore how we follow rules in patterns and concepts. We start with a simple pattern."

  II. The Numerical Sequence (15 minutes)
  - Write on board: 1, 2, 4, 8, 16. Ask: "What comes next? Write your answer and the rule on an index card." Collect cards.
  - Display typical answers (mostly 32). Then reveal two pre-prepared cards from "another seminar":
      Card 1: 32 (rule: double the previous)
      Card 2: 31 (rule: maximum regions by connecting n points on a circle; explain briefly)
      Card 3: 32 but with a far-divergence rule (e.g., "double until 2^100, then add 1" - but note: we cannot compute that, so we can say the rule is: f(n) = 2^n for n<100, and 2^n + 1 for n>=100. But for n=5, we are at 16, so next is 32? Actually, for n=6, if we are at the sixth term, then n=6: for doubling, 32; for the circle, 31; for the far-divergence, since 6<100, 32. So for n=6, the far-divergence rule also gives 32. We need to show that the far-divergence rule is the same as doubling for all n we can check. So we can define: f(n) = 2^n if n <= 1000, else 2^n + 1. Then for n=6, it's 64? Wait, the sequence is for n=1 to 5: 1,2,4,8,16. Then n=6: doubling=32, circle=31, far-divergence=64? That doesn't match. Let me fix: the sequence is indexed by the term number. Let term 1:1, term2:2, term3:4, term4:8, term5:16. Then next is term6. We want a rule that for terms 1 to 5 matches, and for term6 gives 32 (so same as doubling) but then diverges later? Actually, the far-divergence rule must agree for all terms we can compute. So we can define a rule that is doubling for all n that we can ever compute (say, n up to 10^100) and then does something else. But for the next term (n=6) it is 32. So we can have a card that says 32, but with the rule: "double the previous term until the term index is greater than 10^100, then triple." But then for n=6, it's 32. So we can present three cards:
      - 32 (double)
      - 31 (circle regions)
      - 32 (but with a rule that will eventually diverge)

  - Discussion: "Why is 31 not the correct continuation? Or is it? What makes one rule the one that was meant? How do we know that we meant doubling and not the circle rule or the diverging rule?"

  III. Paired Exercise (20 minutes)
  - Pair up students (8 pairs). One is the "rule maker", the other is the "guesser".
  - Rule maker: secretly writes down a rule (e.g., "add 3", "multiply by 2", or more complex ones like "n^2" or even non-arithmetical: e.g., for a sequence of shapes, or for a word pattern). But to keep it simple, start with numerical. They can choose a rule and write it on a card without showing.
  - Guesser: asks for outputs for specific inputs. E.g., "What is the output for input 1?" Rule maker: for their rule, gives the output for 1. Then guesser asks for 2, then 3, etc. After each new data point, the guesser writes down a rule that fits all the data so far. The rule must be different from the rule maker's rule.
  - The guesser always wins: no matter how many points, they can always find a different rule that fits. (They can use the method: the rule is defined to match the given points and then do something else for the next point they haven't asked. Or they can use a different formula that happens to match the given points.)
  - After 5 minutes, stop and have a few pairs report: the rule maker's rule and the guesser's rule, and show they matched the same points but were different.

  IV. Non-numerical Case (10 minutes)
  - Present a non-numerical example.
      Example 1: A sequence of shapes. E.g., 
          Step 1: ○
          Step 2: ○ ○
          Step 3: ○ ○ ○
          Step 4: ○ ○ ○ ○
      Ask: What comes next? (Most will say five circles in a row.)
      But then show an alternative: Step 5: a big circle. Rule: the number of circles increases until 4, then it becomes one big circle. Or: the rule is "the number of circles is the step number until step 4, then at step 5 it becomes 1 big circle that encompasses the previous ones." 
      Alternatively, use a predicate: "chair". 
          Present a series of pictures: 
          - a typical chair
          - a stool
          - a bench
          - a sofa
          - a tree stump that someone sometimes sits on
          - a rock
          Ask: which of these are chairs? 
          Then: show a borderline case (e.g., a bean bag). Is it a chair? 
          Or: a picture of a chair with only three legs? 
          The point: the rule for applying the word "chair" may not determine the next case.

      We can do a pattern of colors: 
          Blue, blue, red, blue, blue, red, ... 
          What comes next? (blue) 
          But an alternative rule: the sequence is two blues and one red, but after three cycles it becomes two reds and one blue? 

      Let me choose the shape example for simplicity.

  V. Group Discussion and Push (25 minutes)
  - Facilitate a discussion: "When you were the rule maker, how did you know what the correct next step was? What if your partner had written a different rule that fit all the data? What makes your rule the one you meant?"
  - Guide them to the escape routes and challenge each:
      - Simplicity/naturalness: "But is the circle rule less simple? It's a known mathematical sequence. And in the pair exercise, both rules might be equally simple."
      - Introspection: "If you look inside, what do you find? A formula? An image? But can't that formula be interpreted in multiple ways? (Like the far-divergence rule: you have an image of doubling, but that image doesn't tell you that it doesn't turn into tripling at 10^100.)"
      - Intentions: "But what are your intentions? How do you know that your intention was for doubling and not for the circle rule? And how does that intention work? Is it another rule that you have to interpret?"
      - More data: "But even with more data, the far-divergence rule still fits until the divergence point. And in the pair exercise, no matter how many points, the guesser found a different rule that fit."
      - Community agreement: "But what if we take a vote? What if everyone in the room says 32? Does that make it correct? What about the person who wrote 31? And what if we go to a math community that knows the circle rule? Also, in the pair exercise, the community (the two of you) disagrees: the rule maker says rule A, the guesser says rule B. Which one is correct?"

  - During the discussion, let students push each other. The facilitator only asks questions and points out the challenges.

  VI. Final Poll and Debrief (15 minutes)
  - Poll: Present three positions (without jargon). 
      Option A: There is a single correct rule that was meant, but we might not be able to know which one it is (because of limited evidence).
      Option B: There isn't a single correct rule; it's indeterminate which rule was meant, but we can still say that some rules are more reasonable or intended than others.
      Option C: There is no fact of the matter at all; asking which rule was meant is like asking which way is up in outer space without any reference — it's not that we don't know, but that the question doesn't have an answer.

  - Ask students to vote by a show of hands (or anonymously) and then discuss what each commits to.

  - Debrief: Map the activity to the four goals:
      1. First-personal pressure about correctness: When you were the rule maker, you felt that there was a correct answer, but then the guesser challenged it by providing a different rule that fit the same data. How do you justify that your rule is the correct one?
      2. Internal states don't settle: When you tried to point to an internal state (a formula, an image), we saw that the same state could be interpreted in multiple ways (e.g., the far-divergence rule uses the same formula until a point beyond experience).
      3. Community doesn't solve: In the pair exercise, even if the two of you agreed on the next term, that doesn't mean the rule is fixed because one of you might have meant a diverging rule. Also, in the class, if we vote for 32, that doesn't make it correct because the circle rule is also valid and we could have a community that uses that.
      4. What's left: At the bottom, it's not about a fact we don't know, but about a decision to continue in a way that others can follow, or a practice.

  - Then, in the last 8 minutes, introduce the jargon: "In philosophy, this is known as the rule-following paradox, discussed by Wittgenstein and Kripke. Kripke presents a skeptical challenge: what fact about you determines that you meant doubling and not a rule that diverges in the future (like 'quus')? The skeptical solution is that there isn't a fact, but we rely on community agreement. But as we saw, community agreement doesn't end the regress."

  - Normativity: How to convert "can't tell" to "ought"? 
      Point out: When you were the rule maker, you felt that the guesser was wrong even if they matched all the data so far. You felt that they were not following the rule you had in mind. But what grounds that feeling? The rule you had in mind is not something that can be fully captured by the data. The normativity (what they ought to do) comes from your intention, but we've seen that the intention itself is not a fact that settles the matter. So the normativity must come from something else: our practices, our forms of life, our decisions to accept each other as rule-followers. The activity should have made them feel the gap: even if the guesser's rule fits, you feel they are not following your rule. But why? That feeling of correctness is not based on a fact but on a commitment to go on in a certain way.

  Predictable problems and fixes:

  1. Problem: Students might not take the alternative rules seriously (e.g., the circle rule) and dismiss it as irrelevant.
     Fix: Present it as a genuine mathematical sequence (show the formula: regions by chords) and note that it is not ad-hoc.

  2. Problem: In the paired exercise, the guesser might not be able to come up with a different rule that fits.
     Fix: Pre-train the guessers: give them examples of how to do it (e.g., for the rule "add 3", after seeing (1,4), (2,7): the rule maker's rule: f(n)=3n+1? Then for n=1:4, n=2:7. The guesser could say: f(n)=3n+1 for n<=2, but for n=3, they can say 10 (if the rule maker says 10) or they can say 11 (if they want to diverge). Actually, the rule maker must give the output for whatever input the guesser asks. So the guesser can choose an input that hasn't been asked and define their rule to be different at that input. But the rule maker might not have revealed that input. So the guesser can always say: "For the inputs we've seen, my rule matches, but for the next input (say, 1000) it gives a different number." But they don't have to reveal that. They just have to write a rule that fits the given data. So they can write a rule that is defined piecewise: it matches the given points and then does something arbitrary.

     Alternatively, we can have the guesser use a polynomial: for any finite set of points, there is a polynomial that passes through them and then does something else. So they can always find such a rule.

     Prepare a handout for guessers with strategies.

  3. Problem: The non-numerical example might be too vague.
     Fix: Use a clear pattern with a clear alternative. The shape example: 
          Step 1: ○ 
          Step 2: ○ ○ 
          Step 3: ○ ○ ○ 
          Step 4: ○ ○ ○ ○ 
          Step 5: ? 
     Most expect 5 circles. Alternative: a big circle. Rule: "until step 4, the number of circles equals the step number; at step 5, they merge into one big circle." 
     Or: Step 5: ○ ○ ○ ○ ○ (so 5 circles). But then another alternative: Step 5: a square. Rule: "the pattern is to add a circle until 4, then become a square." 
     We must present it as a rule that is not obviously disjunctive.

  4. Problem: The discussion might get stuck on the mathematical example and not generalize.
     Fix: Use the non-numerical example early and the paired exercise to show it's not just about math.

  5. Problem: Students might not see the far-divergence rule as a real threat because it's "made up".
     Fix: Emphasize that the rule is well-defined and that for all practical purposes it is the same as doubling. We cannot check beyond a certain point, so we cannot know if we meant doubling or the far-divergence rule.

  6. Problem: The normativity point might be lost.
     Fix: In the debrief, focus on the experience of the rule maker: "When your partner produced a rule that fit the data but was different, why did you feel they were wrong? What made your rule the one that they ought to have followed?" Then connect that to the idea that meaning is normative: it sets a standard for what is correct.

  Timetable (80 minutes):

  - 0-5 min: Introduction. Present the sequence 1,2,4,8,16 and ask for next term. Students write on cards. Collect.

  - 5-20 min: Display responses. Show the three pre-prepared cards (32-doubling, 31-circle, 32-far-divergence). Explain the rules briefly. Ask: "Which one is correct? How do we know?"

  - 20-40 min: Paired exercise. Assign pairs, do the exercise (rule maker and guesser). After 15 minutes, stop and have 2-3 pairs report.

  - 40-50 min: Non-numerical example. Present the shape pattern and ask for next step. Then show an alternative. Discuss briefly.

  - 50-75 min: Group discussion. Facilitate, pushing on escape routes. 
      - 50-55: Focus on the rule maker's experience: how did you know the correct next term? 
      - 55-60: Challenge with the alternative rules: why not the circle rule or the far-divergence? 
      - 60-65: Paired exercise: how did the guesser always find a different rule? What does that say about the data? 
      - 65-70: Community: what if we vote? 
      - 70-75: Internal states: what inside you tells you which rule you meant?

  - 75-80 min: Final poll and debrief. 
      - 75-77: Vote on three positions. 
      - 77-79: Map the activity to the four goals. 
      - 79-80: Introduce jargon (Kripke, Wittgenstein, etc.) and mention normativity.

  Note: The normativity conversion: 
      In the group discussion (around 70-75 min), when discussing internal states, ask: "When your partner produced a rule that matched the data but was not the one you had in mind, did you feel they were not following the rule? Why? What made your rule the one they ought to follow? Is that 'ought' based on something inside you? But we saw that internal states can be interpreted in multiple ways. So what grounds the normativity? It must be something about how we decide to go on together."

  Materials:
  - Index cards for the initial sequence response.
  - Pre-prepared cards for 31 (circle rule) and 32 (far-divergence rule).
  - Board to write sequences and rules.
  - Handout for paired exercise (optional: with examples of how to construct alternative rules).

  This design should meet the goals and constraints.
answer: |-
  Below is a complete, runnable activity designed to meet your pedagogical goals while respecting your constraints. I've refined your device to maximize experiential learning, added a non-numerical case, and structured the debrief to convert "not being able to tell" into the normativity claim. The replacement improves on your idea by:  
  - **Adding scaffolding** to ensure students confront each target insight sequentially.  
  - **Using embodied examples** (e.g., physical movements) to make non-numerical cases visceral.  
  - **Explicitly scripting facilitator questions** to provoke student-led discovery of escape routes.  

  ---

  ### **Activity: The Rule-Following Lab**  
  **Goals:** Students independently discover:  
  1. The problem is first-personal and about *correctness* (not others' minds or evidence).  
  2. Internal states (formulas, images, feelings) cannot fix meaning.  
  3. Community agreement regresses (agreement with whom? about what?).  
  4. What remains is a decision about continuing with a person (not a hidden fact).  

  **Materials:**  
  - **Index cards** (3 pre-prepared "from another seminar," blank cards for students).  
  - **Board** with sections: "Sequence Continuation," "Pattern Responses," "Community Votes."  
  - **Timer** (for strict timekeeping).  
  - **Pre-prepared cards** (rules explained in plain language):  
    - Card A (Expected): "32. Rule: Double the last number (16 × 2 = 32)."  
    - Card B (Projectible Alternative): "31. Rule: Maximum regions from connecting points on a circle (e.g., 1 pt=1 region, 2 pts=2, ..., 6 pts=31)."  
    - Card C (Far-Divergence): "32. Rule: Double until term 1,000,000, then add 17. (For term 6: 16 × 2 = 32.)"  
  - **Non-numerical case prop:** A simple drawing of three shapes: ⬜ (square), 🔺 (triangle), ⬜, 🔺, ...  

  ---

  ### **Timetable (80 Minutes Total)**  
  **Phase 1: First-Personal Correctness Pressure (15 min)**  
  - **0–2 min:** Introduce activity neutrally. *"Write the next term for 1, 2, 4, 8, 16 and your rule on a card. No talking."*  
  - **2–5 min:** Collect cards. Display 90% "32" answers, then reveal pre-prepared Cards A, B, and C.  
  - **5–15 min:** Ask: *"Which is correct? What makes YOUR rule right and others wrong? Discuss in pairs."*  
    - **Key moment:** Students argue for "32" based on *their* sense of correctness. Highlight one student saying, *"I just know doubling is right."*  

  **Phase 2: Internal States Fail (20 min)**  
  - **15–20 min:** Paired exercise setup. *"Partner 1: Privately write a rule (e.g., ‘Add 5’). Partner 2: Guess outputs by asking for inputs (e.g., ‘What for 10?’). After each answer, write a DIFFERENT rule fitting all data."*  
  - **20–30 min:** Run exercise (5–7 rounds/pair). *Example:*  
    - Partner 1 (rule: *n* + 5) gives: Input 1 → 6, 2 → 7, 3 → 8.  
    - Partner 2 (divergent rule): *"My rule: Add 5 until input 100, then subtract 1. For 1,2,3: 6,7,8."*  
  - **30–35 min:** Debrief pairs. *"Did any internal feeling (image, formula) guarantee your rule? Could your partner ‘misinterpret’ it?"*  
    - **Student insight:** *"I pictured ‘+5’ but they still made a rule that broke later!"*  

  **Phase 3: Community Agreement Regresses (15 min)**  
  - **35–40 min:** Non-numerical case. Draw on board: ⬜, 🔺, ⬜, 🔺, ... *"What shape next? Show answers via gesture: SQUARE (arms out) or TRIANGLE (hands up)."*  
    - >90% vote "SQUARE" (arms out).  
  - **40–45 min:** Reveal pre-prepared card: *"CIRCLE (hands rounded). Rule: Alternate square/triangle until position 100, then circles."*  
  - **45–50 min:** Group vote: *"Is circle valid? Majority rules?"* Then: *"What if a community votes circle? Does that make it correct?"*  
    - **Push:** *"Agreement with whom? People alive today? All humans? What counts as ‘agreement’ if someone disagrees?"*  

  **Phase 4: What Remains (20 min)**  
  - **50–65 min:** Facilitated discussion. **Crucially, do not resolve contradictions.** Script:  
    - *"When you meant ‘double,’ why couldn’t you prove it?"* → Escape routes emerge.  
    - *"If not internal states or community, what’s left?"* → Let students voice "no fact" or "decision."  
  - **65–70 min:** Final anonymous poll:  
    - **A:** "There’s a determinate fact about the rule, but we can’t always know it."  
    - **B:** "It’s indeterminate which rule was meant, but something weaker (e.g., ‘intent’) exists."  
    - **C:** "No fact at all—asking ‘which rule?’ is misguided."  
  - **70–75 min:** Tally poll. Discuss commitments:  
    - **A** commits to inaccessible facts. **B** commits to vagueness. **C** commits to non-factualism.  
  - **75–80 min:** **Debrief + Jargon:** Name Kripke/Wittgenstein/rule-following paradox. *"What you experienced was normativity: meaning sets what you OUGHT to do, not what you will do."*  

  ---

  ### **Debrief: Mapping Activity to Insights**  
  | **Activity Moment**          | **Target Insight**                                  | **Escape Route Addressed**                                  |  
  |------------------------------|----------------------------------------------------|-------------------------------------------------------------|  
  | Initial 1-2-4-8-16 debate    | 1. First-personal correctness (not evidence)       | Simplicity/naturalness: "Double is simpler!" → Cost: Why not circle? It’s mathematically natural. |  
  | Partner "wins" paired exercise| 2. Internal states fail                            | Introspection: "I felt the rule!" → Cost: Feeling was interpreted differently. |  
  | Community vote on shapes     | 3. Community regresses                             | Community agreement: "Majority decides" → Cost: Agreement criteria are rule-like and indeterminate. |  
  | Poll positions A/B/C         | 4. Decision, not ignorance                         | More data: "If we see more terms..." → Cost: Far-divergence rule still fits all possible data. |  

  **How Normativity Emerges:**  
  - During paired exercise, ask Partner 1: *"When Partner 2 gave a rule fitting your data but diverging later, did you feel they violated what you meant? Why?"* Students express frustration: *"They should’ve known!"* → **Leverage this:** *"That ‘should’ is normativity. Meaning isn’t what you do—it’s what you’re accountable to. The ‘gap’ you felt wasn’t ignorance; it was the absence of a fact to rescue you."**  

  ---

  ### **Predictable Problems & Fixes**  
  | **Problem**                          | **Fix**                                                                 |  
  |--------------------------------------|-------------------------------------------------------------------------|  
  | Students dismiss circle/far-divergence rules as "silly." | Pre-empt: *"These are real rules from math—circle counts regions in geometry; far-divergence is used in computing."* |  
  | Paired exercise stalls (Partner 2 can’t find alternate rule). | Provide cheat sheet: *"Use: ‘Same until input [unasked number], then change.’"* |  
  | Non-numerical vote becomes chaotic.  | Use gestures (arms/hands) for quick, visible voting; limit debate.      |  
  | Students demand "right answer."      | Affirm uncertainty: *"Our goal isn’t to solve this—it’s to feel why it’s unsolvable."* |  
  | Discussion fixates on math, not meaning. | Anchor in paired exercise: *"Replace numbers with ‘chair’—how would you define it for all objects?"* |  

  ---

  ### **What the Activity Can’t Reproduce & How to Address It**  
  **The Hardest Feature:** Normativity (meaning fixes what one *ought* to do).  
  - **Why it’s hard:** The activity naturally generates epistemic uncertainty ("I can’t tell what I meant"), not normative force.  
  - **How to convert it:**  
    1. **Elicit the "betrayal" feeling:** In paired exercise, when Partner 2 "cheats" with a divergent rule, ask Partner 1: *"Why is it frustrating? Is it that they could’ve followed you but chose not to?"*  
    2. **Contrast with description:** *"When you say ‘I meant double,’ you’re not describing yourself—you’re setting a standard for what they should do."*  
    3. **Connect to practice:** *"The ‘ought’ survives even if no fact exists. We decide to hold others accountable to our rule—that’s the ‘bottom’."*  

  **Facilitator Script for Normativity:**  
  > *"When you insisted ‘I meant double!’, you weren’t reporting a fact—you were calling your partner to account. That experience—the gap between what they did and what you demanded—is where meaning lives. Wittgenstein’s point: rules are tools we use to navigate shared life, not mirrors of private facts."*  

  ---

  **Why This Works:**  
  - Students *feel* correctness pressure when their rule is challenged, introspection fails when partners "win," and community consensus frays during voting.  
  - The poll forces distinction between ignorance (A), indeterminacy (B), and non-factualism (C).  
  - Normativity emerges from their own reactions ("You should’ve followed my rule!")—not facilitator assertion.  
  - Jargon-free until the end ensures ideas are grounded in experience.  

  Run this as-is, and students will leave unsettled—in the best philosophical way.
