prompt: |-
  I have been turning over a question on my own, with no training in philosophy, and only later found out that it has a name: the special composition question. Given some things, when is there also a single further thing that they make up? I am not asking you to settle it. I want the specification first — the list of things any answer has to get right before it deserves to be taken seriously — because the only rule I have ever been able to believe in is a negative one, and I would like to know what test it has to pass.

  That rule is this: some things compose something only if that something can be broken. Not merely scattered or divided up, but damaged: the arrangement itself can go wrong while the parts that make it up go on existing. I keep the collection database for a small natural history museum and restore mechanical clocks on weekends, so this is not idle for me. A clock that has been dropped is spoiled in a way its gears are not; a bench covered with the same gears is not spoiled at all, only disassembled. That difference feels like the whole thing to me, and I would rather find out now whether it is a genuine constraint or just a prejudice of the workshop. So please treat the purpose as fixed: I want a criterion good enough to apply — one that tells a working person when a bunch of pieces has become one item with one record, one condition report, and one line on the insurance schedule, and when it has merely become a set of pieces — not a verdict I could only repeat.

  Here is what I would like from you.

  First, the cases: which situations must an answer handle, and, for each, what exactly it is about the case that makes it a requirement rather than an intuition someone happens to have. I have my own candidates and I want them stress-tested and supplemented: an ordinary artifact; a living thing and a colony of living things; a scattered collection, such as a specimen whose parts sit in two different buildings; a temporary pattern like a whirlpool or a traffic jam; something whose parts get replaced over time, like a river or a clock I have rebuilt piece by piece; something that looks like two things occupying one place at one time, like a restored pot and the pot before restoration; a plainly borderline case like a heap of gravel or a cloud; and nested cases — a cell, an organ, an animal, a colony — where I especially want to know whether an answer is required to be "nesting-closed," or whether it may say that composition stops somewhere on the way up.

  Second, the distinctions an answer must respect rather than collapse: composing something versus being nothing over and above the parts; existing versus doing any causal work of one's own, given that a composite's causal powers can look entirely inherited from its parts; composing at a time versus persisting through change; there being one thing here versus there being exactly one thing of a given kind here; a real answer versus a merely linguistic, conceptual, or interest-relative one; and the difference between the question of when things compose something and the question of what the parts of a thing are.

  Third, the constraints from outside philosophy: an answer should not imply that the inventories of ordinary life, of chemistry, and of ecology all systematically misdescribe the world, and it should not make facts about composition unknowable in principle or a matter of brute accident — though I want you to tell me whether that last demand is a real desideratum or only a rationalist preference, and likewise for the demand that the answer not shift with what anyone happens to care about that afternoon.

  Fourth, and this is the part I most want: take each requirement on your list and sort it into what any adequate answer genuinely owes us and what is only the preference of one camp. Is it a real requirement that the answer be nontrivial, falling between "nothing ever composes" and "everything always composes"? That it take the form of one general condition rather than a list of cases? That it contain no brute facts about which arrangements compose? That it be statable without reference to minds, interests, or language? That it vindicate most of what ordinary people and working scientists say? That it explain why coming apart seems to destroy things so much more readily than going together creates them?

  Fifth, if some subset of the requirements cannot be jointly satisfied, say so plainly and show me the tension. My suspicion is that the demand for a single general condition, the demand for no brute facts, and the demand to draw the line somewhere between everything and nothing cannot all be met at once, which would make the list itself the interesting result. Tell me which single requirement does the most work in excluding candidates, and which one I should abandon, and what abandoning it costs me. Does my breakability rule survive your list, and if it fails, which requirement kills it?

  If you have room at the end, one or two lines each on how the three standard families of answer — nothing ever composes, everything always composes, and composition only under some condition, whether a general one or brute — fare against the list; keep that brief, since the criteria are what I am paying for. Please write in American English, reason from the cases rather than from what anyone has written, and give me nothing in the way of reading lists, citations, or author names: I am working this out on my own in the evenings, and a table is welcome if it helps.
reasoning: |-
  Alright, the user is grappling with the Special Composition Question (SCQ) from a practical standpoint. They manage museum collections and restore clocks, so they need a clear criterion to distinguish when parts compose a single entity for inventory and insurance purposes. Their breakability rule—composition only if the whole can be damaged independently of its parts—feels intuitive but they want to test it against rigorous philosophical requirements.

  First, I need to map their requested structure: cases, distinctions, constraints, requirement analysis, and compatibility checks. Their examples (artifacts, organisms, scattered collections etc.) show they’ve thought deeply about edge cases. The museum/clockwork context means practicality is non-negotiable—they’ll reject theories that make composition unknowable or interest-relative.  

  For cases: The key is identifying what *forces* an answer to handle each scenario. A restored pot vs. its original shards challenges identity over time. Nested composition (cells→organisms→colonies) tests whether composition must be "nesting-closed" or can have natural joints. Temporary patterns (traffic jams) probe if composition requires persistence.  

  Distinctions matter because conflating them invalidates answers. E.g., "composition vs. being nothing over parts" addresses emergence; "composing at a time vs. persisting" separates synchronic/diachronic unity. Their insurance forms need synchronic unity ("is this one item today?"), but restoration work needs diachronic ("is this the same clock after part replacements?").  

  External constraints reveal their realism: they won’t accept that chemistry/ecology are "wrong," and brute facts or unknowability undermine practical use. But is anti-brutalism a rationalist bias? Given their job, no—unknowable composition means unworkable insurance reports.  

  Now dissecting requirements:  
  - Nontriviality (neither nihilism nor universalism) seems essential—both extremes collapse practical distinctions they rely on.  
  - A single general condition? Their breakability rule attempts this, but may fail edge cases (e.g., a cloud can’t be "damaged," only dispersed).  
  - No brute facts: Desirable but possibly unsustainable. If composition isn’t fundamental, it must reduce to physics or function—yet physics often underdetermines (is a galaxy a composite object?).  
  - Mind-independence: Critical for them. Interest-relative answers make insurance valuations arbitrary.  
  - Vindicating common sense/science: Non-negotiable. If an answer says cells don’t compose animals, museum biology exhibits become incoherent.  

  Breakability’s weaknesses:  
  1. *Scattered collections*: A specimen split between buildings can’t be "damaged" as a whole—only its labels or records could be corrupted. But they’d still insure it as one item.  
  2. *Temporary patterns*: A traffic jam can’t be "spoiled" (it’s defined by dysfunction), yet we refer to it as a single entity.  
  3. *Borderline cases*: Gravel heaps aren’t breakable—removing a stone doesn’t "damage" the heap.  

  Tensions flare between:  
  - Single general condition + no brute facts + nontriviality. If composition isn’t brute, it must reduce to non-compositional facts (e.g., interaction strength). But no non-circular reduction covers all cases without gaps (e.g., viruses challenge life-based criteria).  
  - Their breakability rule *might* survive if "damage" includes functional disruption (a scattered collection is "damaged" if its documentation is lost). But clouds/heaps remain problematic.  

  Verdict: Abandon the demand for *no brute facts*. Even if composition isn’t fundamental, epistemic access matters more for their work. Breakability, refined to "functional integrity susceptible to disruption," could work—with brute facts about which functions count (e.g., horology defines clock-functions).  

  Standard answers’ report card:  
  - Nihilism: Fails common-sense/science vindication (no clocks, only gears).  
  - Universalism: Collapses distinctions (every pile of gears is a clock).  
  - Moderate answers: Breakability fits here. Brute facts or interest-relativity may be unavoidable costs.  

  Final note: Their rule’s core insight—that composition creates vulnerability—is profound. With pragmatic concessions, it’s salvageable.
answer: |-
  Below is a structured analysis of your requirements for an answer to the Special Composition Question (SCQ), tailored to your practical needs. I'll address your five requests in order, using your breakability rule as a reference point. Requirements are derived from the cases and distinctions you provided, stressing *why* each is non-negotiable for a workable answer.

  ---

  ### **1. Cases an Answer Must Handle**  
  These cases force an answer to confront real-world complexities. Ignoring any undermines practical applicability.  

  | Case | What Makes It Required |  
  |------|------------------------|  
  | **Ordinary artifact** (e.g., a clock) | Tests basic intuition: parts compose a functional whole. Failure here invalidates everyday reasoning. |  
  | **Living thing** (e.g., a cat) vs. **Colony** (e.g., ants) | Forces distinction between integrated organisms and looser collectives. Biology/ecology rely on this. |  
  | **Scattered collection** (e.g., specimen split across buildings) | Challenges spatial contiguity. Shows whether composition depends on physical unity or something else (e.g., cataloging). |  
  | **Temporary pattern** (e.g., traffic jam, whirlpool) | Tests persistence: must an object endure? If composition occurs here, it risks overgenerating ephemeral "things." |  
  | **Replaced parts** (e.g., rebuilt clock, river) | Demands diachronic (over-time) criteria. Persistence through change is central to restoration/insurance. |  
  | **Co-located "two things"** (e.g., restored pot + original shards) | Prevents identity collapse. An answer must explain how one set of parts composes distinct objects (e.g., "original pot" vs. "restoration"). |  
  | **Borderline case** (e.g., gravel heap, cloud) | Exposes vagueness. A viable answer must either resolve borderline cases or justify their indeterminacy without arbitrariness. |  
  | **Nested composition** (e.g., cells → organ → animal → colony) | Tests "nesting-closure": Must an answer allow infinite composition (everything composes everything bigger), or can it "stop" at natural joints? Stopping is pragmatically necessary (e.g., insuring an organ vs. whole animal). |  

  ---

  ### **2. Distinctions an Answer Must Respect**  
  Collapsing these leads to incoherence or unworkable outcomes.  

  - **Composing something vs. Being nothing over and above parts**: Composition must add value (e.g., a clock’s "spoilage" isn’t reducible to gear-damage). Otherwise, wholes are illusory—invalidating condition reports.  
  - **Existing vs. Causal work**: Even if a composite’s powers derive from parts, it must *do* something unique (e.g., a traffic jam causes delays, not just individual cars). Otherwise, composition is causally irrelevant.  
  - **Composing at a time vs. Persisting through change**: Synchronic (at one time) and diachronic (over time) composition can differ (e.g., a rebuilt clock composes *now* but may not be the *same* clock). Insurance requires both.  
  - **One thing vs. One kind of thing**: A pile of gears is one "pile" but not one "clock." An answer must distinguish categories to avoid misclassification.  
  - **Real vs. Linguistic/conceptual/interest-relative**: Composition must be mind-independent. If it shifts with human interests, insurance values become arbitrary.  
  - **Composition question vs. Parts question**: SCQ asks when parts form a whole; the latter asks what counts as a part. Conflating them creates circularity (e.g., "a clock exists if its parts are clock-parts").  

  ---

  ### **3. External Constraints**  
  These ensure the answer aligns with practical and scientific reality.  

  - **No systematic misdescription**: Must not imply ordinary, chemical, or ecological inventories are wrong (e.g., denying cells compose animals). Science relies on composite entities.  
  - **Knowability**: Composition facts can’t be brute or unknowable. If unverifiable, condition reports are impossible. *Desideratum? Yes*—brute facts make application untenable for your work.  
  - **Non-arbitrariness**: Must not depend on transient interests (e.g., "composition occurs when the curator cares"). Undermines consistent record-keeping.  
  - **Rationalist preference?** Anti-brutalism isn’t mere rationalism—your job requires *actionable* criteria. Brutalism makes composition a guessing game.  

  ---

  ### **4. Requirements: Genuine vs. Camp Preference**  
  Assessed for practical adequacy.  

  | Requirement | Genuine or Preference? | Why |  
  |-------------|-------------------------|-----|  
  | **Nontrivial** (between nihilism/universalism) | **Genuine** | Nihilism (nothing composes) denies clocks exist; universalism (everything composes) makes every gear-pile a clock. Both sabotage inventories. |  
  | **Single general condition** | **Preference** | A disjunctive list (e.g., "functional unity OR causal bonding") can work if principled. Your breakability rule aims for generality but may need exceptions. |  
  | **No brute facts** | **Genuine** (with caveats) | Brute facts ("composition just happens when particles arrange *thus*") are unknowable and inapplicable. *But* some "near-brute" facts (e.g., biological functions) may be unavoidable. |  
  | **Mind-independence** | **Genuine** | Interest-relativity makes insurance values subjective. Breakability avoids this. |  
  | **Vindicate common sense/science** | **Genuine** | Rejecting composites like organisms or artifacts implies museums misidentify specimens. |  
  | **Explain asymmetry** (coming apart > going together) | **Preference** | While intuitive, asymmetry isn’t fatal if an answer explains why creation/destruction conditions differ (e.g., breakability focuses on destruction). |  

  ---

  ### **5. Tensions and Your Breakability Rule**  
  **Key tension**: A *single, general, non-brutal, mind-independent condition* that *draws a line* and *vindicates science* may be impossible.  
  - **Why?** No non-circular condition covers all cases without brute elements. For example:  
    - Function-based rules (e.g., "parts compose if they serve a purpose") fail scattered collections (no unified function) or temporary patterns (whirlpools have no "purpose").  
    - Causal-bonding rules fail replaced parts (is the rebuilt clock the *same* causal system?) or nested cases (cells bond, but do cells + organs bond doubly?).  

  **Your breakability rule** ("composition only if the whole can break while parts survive"):  
  - **Strengths**: Handles artifacts (dropped clock spoils; gears don’t), distinguishes clocks from gear-piles, and avoids mind-dependence.  
  - **Fails on**:  
    - **Scattered collections**: A specimen split across buildings can’t "break" as a whole—only its parts can be damaged. Yet it’s one insured item.  
    - **Temporary patterns**: A traffic jam can’t be "damaged"—it dissipates, but isn’t "spoiled." Yet we refer to it as a single entity.  
    - **Borderline cases**: A cloud or gravel heap isn’t "breakable"—removing part doesn’t damage it, only alters it.  
    - **Co-located things**: A restored pot can "break," but so could its pre-restoration shards. Doesn’t explain why they’re distinct objects.  
  - **What kills it?** The **scattered collection case** and the **demand to handle all core cases**. If composition requires localized breakability, distributed objects (museums, digital systems) vanish.  

  **Which requirement to abandon?**  
  - Abandon **single general condition**. Opt for a disjunctive rule (e.g., "functional integration OR causal continuity") to cover artifacts, organisms, *and* scattered collections.  
  - **Cost**: Less elegant, but more practical. Breakability could cover artifacts/living things, with added conditions for scattered items (e.g., "cataloged unity").  

  **Feasible path**: Refine breakability to **functional fragility**—e.g., "Parts compose if the arrangement can lose its function while parts retain theirs." This handles clocks (function: timekeeping) and organisms (function: life), excludes heaps (no function), and extends to scattered collections if "function" includes institutional roles (e.g., a specimen’s research identity). Temporary patterns (traffic jams) remain excluded—which aligns with your intuition that they’re not "things."  

  ---

  ### **Standard Answers vs. Requirements**  
  - **Nihilism** (nothing composes): Fails common-sense/science vindication (no clocks, only atoms). Unworkable for inventories.  
  - **Universalism** (any things compose something): Collapses distinctions (every gear-pile is a clock). Makes insurance schedules arbitrary.  
  - **Moderate answers** (composition under condition): Only functional/mechanical variants satisfy knowability and mind-independence. All struggle with borderline cases, demanding pragmatic thresholds.  

  ---

  **Final note**: Your breakability rule is a strong candidate for artifacts/organisms but needs extension to cover institutional or abstract unities (e.g., scattered collections). Abandoning the demand for a *single* condition (while keeping non-brutality and mind-independence) lets you preserve its core insight. The tension isn’t fatal—it reflects reality’s layered structure.
