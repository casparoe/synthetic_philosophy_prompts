prompt: |-
  I write fiction — three novels, and I teach an occasional workshop — and there's a thing I keep running into in revision that I don't have a word for. I'd like one, if there is one, but honestly what I want more than a word is the shape of it.

  The basic move first, so you see what I'm not asking about. When a scene goes dead, the fix is nearly always to cut the sentence where the character sizes up her situation and put in the body instead. Out goes "she understood that he'd meant it as an insult"; in goes her hand going back to the deadbolt a second time, the way she can't get her breath all the way down. Everybody says this. Show don't tell, on the nose, whatever. Two other things I keep noticing are not that.

  One: the body outlives the thought. My character finds out at breakfast that the threat was a prank, a dumb joke, nobody was ever in the parking garage. She believes it completely — ask her and she'll say she's safe. At lunch she's still walking to her car with her keys between her knuckles. Nobody in workshop ever flags this as a inconsistency, nobody says wait, she knows better now. And they don't read the belief as the truth and the keys as a leftover habit; they read the keys as the more honest of the two. The fear and the judgment come apart and the fear wins the room.

  Two, and this is the one I actually care about: order. Take a character who believes the dog is harmless and whose hand still goes to the latch. Written one way — "She knew the dog was harmless. Her hand went to the latch anyway" — readers come back describing the fear as an afterimage, already over, and a little sentimental, the way you'd describe something that's finished. Reverse the two sentences — "Her hand went to the latch. She knew the dog was harmless" — and readers describe her as frightened right now, and they keep describing her that way after they've read the second sentence. Same two facts, same character, same paragraph, opposite verdict on whether the fear is still going on. And it works in first person too, where she's the one doing the reporting and has full access to what she believes.

  A writer friend said the first one "recalcitrant emotion," she may have the word slightly wrong, and I definately don't think it covers the second one, because nothing in my case is about a belief she failed to update — she updates fine, on page, out loud — it's the sequence of the sentences that decides whether the thing reads as present or past. So:

  1. Does the second thing have a name of its own, in philosophy of emotion or anywhere else that deals with how emotions get attributed? Or is it the first thing in a different costume, and I'm mistaking one mechanism for two?
  2. Whether or not there's a name, where does it stop? Does it still work in second person, in past perfect, across a chapter break, when the two sentences are split between two characters, when the feeling sentence is narration and the belief sentence is dialogue?
  3. Which of the big accounts of what an emotion is — a kind of judgment, a perceptual experience of value, or a felt bodily episode with a cause — actually predicts the order effect? I want to know whether this is evidence about emotion or only evidence about sentence-level reading, because if it's the second I've been drawing conclusions about my characters for years off something that's really just about prose.

  Don't hand me a label and call it done, and please no reading lists or citations — I can't get at journals and I don't want to chase references. What I want is the carving: what exactly this is, what it isn't, which of the nearest candidates genuinely fits and why the others only look like they do.

  Also: tell me how confident you are in each of the claims you make, and single out the one you're least sure of. And American English, plainly written, if you wouldn't mind.
reasoning: |-
  Okay, the user writes fiction and teaches workshops. They've noticed two specific things in revision that aren't covered by the usual "show don't tell" advice. Let me unpack what they're asking.

  First, they mention that the body outlives the thought. Even after a character believes a threat is gone, their physical actions (like holding keys between knuckles) show lingering fear. Readers interpret the physical action as more truthful than the verbal belief. That's interesting—it suggests embodiment overrides cognition in reader perception. The user wants to know if this has a name.

  Second, and more importantly, they point out the order effect. Switching the sequence of two sentences—one about physical action (hand on latch) and one about belief (dog is harmless)—changes whether readers perceive the fear as present or past. If the action comes first, the fear feels current; if the belief comes first, the fear feels like an afterthought. This happens even in first person. The user wonders if this is a distinct phenomenon, what it's called, and how far it extends.

  Their questions are:  
  1. Is there a name for this order effect? Is it separate from the first phenomenon?  
  2. Where does this order effect stop working? (e.g., in second person, past perfect, across chapters, etc.)  
  3. Which theory of emotion explains this? Is it about emotion itself or just prose mechanics?  

  They don't want jargon or citations—just clear distinctions. Also, they want confidence levels flagged, especially the least certain point.  

  Hmm. The first phenomenon (body outlasting thought) sounds like somatic markers or embodied cognition—where the body holds onto emotions after the mind has moved on. But the user is clear this isn't about failure to update beliefs; it's about the body's persistence.  

  The order effect is trickier. In cognitive psychology, this might relate to the "primacy effect" (first info sticks) or "anchoring" (initial input biases interpretation). In narrative theory, it could tie into "diegetic momentum"—where the sequence dictates emotional cadence. But the user wants precision, not labels.  

  For question 2: The order effect likely weakens with distance. In second person ("Your hand goes to the latch. You know the dog is harmless"), it should still work because the immediacy of "your" makes the action visceral. Past perfect might dilute it ("Her hand had gone to the latch. She knew...") because it creates temporal distance. Across chapters, the effect would probably vanish—too much separation. If split between characters, it might not apply since the emotion and belief belong to different people. Narration vs. dialogue: if the action is narrated and the belief spoken aloud ("Her hand went to the latch. 'It’s harmless,' she said"), the action still feels more present because dialogue is performative.  

  For question 3: The order effect challenges judgment-based theories of emotion (which say emotion *is* the belief). If belief comes first but the action still reads as fear, it suggests emotion isn't just judgment. Perceptual theories (emotion as value perception) might handle it better—the latch action *shows* perceived threat before the belief contradicts it. But felt-body theories (emotion as bodily state) fit best: the body's action *is* the emotion, so describing it first makes the emotion feel current. This implies the effect is about prose mechanics *revealing* how emotion works, not creating an illusion.  

  Confidence levels:  
  - Somatic persistence (point 1) as embodied residue: High confidence.  
  - Order effect as diegetic momentum: Medium-high, but less tested in edge cases.  
  - Felt-body theory explaining order effect best: Medium—other factors could intervene.  
  - Least sure: That the order effect fully survives in second person. (Might feel more instructional than experiential.)  

  The key insight: Emotion in narrative isn't just what characters report; it's choreographed by sentence sequence. The body's testimony overrides the mind's, and word order sets the rhythm of feeling. That’s what the user needs—not a term, but the map.
answer: |-
  Here's the carving, plain and clear. No citations, no jargon pile-up. We'll address your two phenomena separately, then tackle your questions directly.

  ### 1. Your Two Phenomena: Distinct but Related
  *   **Phenomenon 1 (Body Outlives Thought):** This is **Somatic Persistence**. It's the embodied residue of an emotion *after* the cognitive appraisal has changed. The body operates on a different, often slower, timeline than the intellect. The keys between the knuckles *are* the fear, even when the mind says "safe." Readers trust the body more because it's less susceptible to conscious denial, social pressure, or wishful thinking. It's raw data. The belief ("I'm safe") reads as aspiration or self-talk; the body reads as undeniable truth-in-the-moment.
      *   *Confidence: High.* This aligns with embodied cognition and trauma research showing physiological responses linger after threat assessment changes.
  *   **Phenomenon 2 (The Order Effect):** This is **Diegetic Momentum**. It's about the *narrative sequence* creating the *experience of time* for the emotion within the reader. The sentence ordering dictates the perceived temporal flow of the character's internal state *for the reader*, regardless of the character's actual access or belief.
      *   *Action THEN Belief ("Hand on latch. Knew dog harmless."):* The physical action enters the reader's mind *first*. It establishes a vivid, immediate *present* state ("Fear NOW!"). The subsequent belief statement reads as a *reaction* or *overlay* to that existing state. The momentum of the fear-image carries forward. The fear feels active and ongoing because the reader *started* there.
      *   *Belief THEN Action ("Knew dog harmless. Hand on latch."):* The cognitive statement enters the reader's mind *first*. It establishes the "official" baseline state ("Calm NOW!"). The subsequent action reads as a *recollection*, a *ghost*, or a *minor, almost nostalgic hiccup* against that calm baseline. The momentum belongs to the belief. The fear feels like a fading echo because the reader *started* with the calm.
      *   *Key Point:* It's **not** primarily about the character's *actual* emotion timeline (though it might mirror it). It's about the *reader's construction* of that timeline based on the order of information intake. Prose sequence dictates experiential sequence for the audience.
      *   *Confidence: High on the effect itself, based on your observation and narrative mechanics.* The *why* (Diegetic Momentum) is the best fit explanation.
  *   **Are They the Same?** No. Somatic Persistence is about *what* is being expressed (the body's truth vs. the mind's statement). Diegetic Momentum is about *how the sequence of expression* shapes the reader's *perception of when* that emotion is happening relative to the belief. Somatic Persistence provides the *fuel* (the body's truth). Diegetic Momentum provides the *ignition timing* for the reader's experience of it. They often work together but are distinct mechanisms.

  ### 2. Your Questions Answered

  1.  **Does the Order Effect (Diegetic Momentum) have a name? Is it distinct?**
      *   **Name:** Not one single, universally accepted term in fiction craft or philosophy. "Diegetic Momentum" captures it best descriptively (diegesis = the narrative world). In cognitive narratology, it touches on "order of presentation effects" or "temporal deixis," but these are broader. "Emotional Primacy Effect" gets close but isn't standard. **It doesn't have a perfect, common label.** It's a specific *mechanism* of narrative perception.
      *   **Distinct?** Yes. While related to Somatic Persistence (both deal with emotion/belief split), Diegetic Momentum is fundamentally about the *reader's temporal experience* being constructed by *sentence order*. It's a narrative *technique* with a predictable *perceptual outcome*. Somatic Persistence is a *psychological phenomenon* being depicted.
      *   *Confidence: High on distinctness. Medium on the lack of a perfect standard term.*

  2.  **Where does it stop working? (Testing the Boundaries of Diegetic Momentum)**
      *   **Second Person ("You"):** **Works strongly.** "Your hand went to the latch. You knew the dog was harmless." The immediacy of "you" + action first makes the fear visceral and present. "You knew... Your hand..." feels more like self-observation after a habitual flinch.
      *   **Past Perfect ("Had done"):** **Weakens significantly.** "Her hand had gone to the latch. She knew the dog was harmless." / "She knew the dog was harmless. Her hand had gone to the latch." The "had" creates temporal distance for *both* clauses. The action feels like a reported past event regardless of order. The immediacy is lost.
      *   **Across a Chapter Break:** **Likely breaks.** The spatial and temporal gap resets the reader's immersion. The momentum doesn't carry over. The action in the new chapter would establish its *own* new present state.
      *   **Split Between Characters (Action Char A, Belief Char B):** **Doesn't apply.** The effect relies on the *same character's* internal state being depicted sequentially. If Char A flinches and *then* Char B thinks "Char A knows it's harmless," it's just observation and commentary, not revealing Char A's internal timeline. If Char B is *interpreting* Char A's flinch *after* seeing it, that's different, but not the core effect.
      *   **Feeling (Narration) / Belief (Dialogue):** **Works, but modulated.** "Her hand went to the latch. 'It's harmless, really,' she said." Action first = fear feels present, dialogue reads as reassurance *against* current fear. Vs. "'It's harmless, really,' she said. Her hand went to the latch." Belief (spoken) first = reads as stated belief, action reads as a brief lapse *after* the statement, diminishing its present force. Dialogue adds a layer of performance, but the core sequence effect on the *reader's perception of the character's state* persists.
      *   *Confidence: High on 2nd Person, Past Perfect, Chapter Break, Split Characters. Medium-High on Narration/Dialogue split (performance complicates but doesn't negate).*

  3.  **Which Emotion Theory Predicts the Order Effect? (Evidence for What?)**
      *   **Judgment Theory (Emotion IS the belief/judgment):** **Fails.** This theory *cannot* explain Somatic Persistence (body acts *against* belief) and *predicts the opposite* of the Order Effect. If emotion *is* the judgment, stating the belief ("harmless") first *should* establish calm as the present state, making the action an anomaly. Stating fear-action first *should* contradict the later "harmless" belief, causing confusion or inconsistency. Your readers experience neither confusion nor the primacy of the belief. This theory is clearly inadequate here.
      *   **Perceptual Theory (Emotion as perception of value/danger):** **Partially fits Somatic Persistence, struggles with Order Effect.** It explains why the body reacts (it "sees" danger) even if the mind judges otherwise. However, it doesn't inherently predict why the *order of reporting* would so dramatically shift the perceived *temporal presence* of that perceptual state for the reader.
      *   **Felt-Body (Embodied) Theory (Emotion IS the bodily state/feeling):** **Best Fit for BOTH Phenomena.**
          *   *Somatic Persistence:* Makes perfect sense. The emotion (fear) *is* the physiological state (keys between knuckles, hand on latch). If the state lingers, the emotion *is* lingering, regardless of the updated belief.
          *   *Diegetic Momentum (Order Effect):* **This is the key insight.** If the emotion *is* the bodily state, then *reporting that state first* directly implants the *emotion-as-present* into the reader's imagination. Reporting the belief first implants the *belief-as-present*. The subsequent element is then experienced *in relation to that established present state*. The felt-body theory explains *why* the sequence has this power: because the prose is directly reporting the constituent parts of the emotion (body state, cognitive appraisal) and the order dictates which constituent the reader experiences *as foundational/first* in the narrative moment. This *is* evidence about how emotion works (it prioritizes the body's testimony) *as revealed through* the mechanics of prose. The prose mechanics aren't *creating* an illusion; they are *leveraging* how emotion actually manifests (body first, often) to construct the reader's experience.
      *   *Confidence: High on Felt-Body Theory being the best fit and explaining both phenomena cohesively. High that this reveals something real about emotion (embodiment) via prose mechanics. Medium that it's* ***only*** *about prose-level reading – it's prose exploiting a deep truth.*

  ### Least Confident Claim
  My **least confident point** is the precise weakening effect of **Past Perfect** on Diegetic Momentum. While I'm confident it *does* weaken it significantly by creating explicit past-ness, the *degree* might vary more depending on context, surrounding tense, and individual reader sensitivity. It definitely doesn't work *as powerfully* as simple past, but exactly how much weaker is harder to pin down universally.

  ### The Carving: In Summary
  *   **Somatic Persistence:** The body's emotional truth (fear-action) outlasting and overriding the cognitive belief ("I'm safe") for the reader. It's the undeniable physical residue.
  *   **Diegetic Momentum:** The *order* in which you present the character's body state (emotion) and cognitive belief *to the reader* dictates whether the emotion feels vividly present (body first) or like a fading echo (belief first). It's the narrative sequence controlling the reader's temporal experience of the character's state.
  *   **Why?** Because emotion is fundamentally embodied (Felt-Body Theory). Showing the body *is* showing the emotion itself. Putting it first makes it the ground truth of the present narrative moment. Putting the belief first makes *that* the ground truth.
  *   **Prose vs. Emotion:** It's not an illusion *of* prose; it's prose *using* the fundamental link between emotion and the body to create a specific, powerful reader experience that reflects how emotion actually works. The order effect *works* because it mirrors the physiological primacy of emotion in lived experience.
