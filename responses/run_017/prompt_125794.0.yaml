  The user wants me to disambiguate six potential readings they sketched during the argument, evaluate them, and analyze how the friend's slogan functions. They need a structured response with four clear sections: a "menu" of readings, analysis of the slogan's meaning, evaluation of the satirical method, and the strongest case for pronoun reform.

  Breaking this down:
  First, the six readings need precise reformulation:
  - Cost-reallocation: about shifting cognitive burden
  - Practice/rehearsal: habit formation through language use
  - Availability: satire making defaults visible
  - Diagnostic: satire revealing existing defaults
  - Expressive: changing social signaling
  - Strong constitutive: language determining thought (which they reject)

  Most are defensible except the strong constitutive claim. The diagnostic reading is particularly important as it separates revelation from solution.

  For the slogan analysis, "you can't change the world by changing the words" likely assumes a direct causal model where language change alone produces material change. This would support both dismissals if true, but it oversimplifies how language functions socially.

  Regarding the satire, it works primarily as a defamiliarization device (availability effect) rather than logical proof. The borrowed-force concern is valid but doesn't negate its effectiveness when targeting shared values.

  The strongest case for reform combines cost-reallocation with expressive change: it redistributes cognitive labor while signaling inclusivity. The main counterargument is that such changes don't address structural inequalities, but that misses how linguistic practices interact with social norms.

  The user's frustration with oversimplification is palpable. They need analytical tools, not just debate points. By meticulously unpacking these readings, I can help them move beyond the slogan impasse while acknowledging the satire's limitations as proof.
answer: |-
  ### **The Menu**  
  *(Precise readings disambiguated; verdicts applied)*  

  1. **Cost-Reallocation Reading**  
     - *Statement*: Reforming default pronouns reallocates the cognitive/communicative burden from non-default groups (who must constantly deduce inclusion or actively mark themselves) to the collective.  
     - *Mechanism*: Normative redistribution of minor but recurring social costs via linguistic convention.  
     - *Verdict*: **Substantive and defensible** (empirically observable in psycholinguistics; e.g., "generic he" forces extra processing for non-male referents).  

  2. **Practice/Rehearsal Reading**  
     - *Statement*: Habitual use of a pronoun form reinforces cognitive schemas, shaping perception through repetition, not belief revision.  
     - *Mechanism*: Cognitive entrenchment via procedural memory; language as a tool for world-carving.  
     - *Verdict*: **Substantive and defensible** (supported by research on linguistic relativity and habit-formation; e.g., gendered languages correlate with stronger gender stereotyping).  

  3. **Availability Reading (Satire-Specific)**  
     - *Statement*: Satirical defamiliarization makes invisible defaults available for conscious rejection, altering salience without logical argument.  
     - *Mechanism*: Cognitive contrast effect; satire as a perceptual "lens" enabling critical distance.  
     - *Verdict*: **Substantive and defensible** (aligns with studies on humor as a tool for perspective-shifting; e.g., absurdist framing exposes implicit norms).  

  4. **Diagnostic Reading**  
     - *Statement*: The satire’s effectiveness as humor diagnoses the existence of a default but does not justify reform.  
     - *Mechanism*: Satire as evidence of a social fact (the default’s entrenchment), not a prescription for change.  
     - *Verdict*: **Trivial** (tautological: if the joke works, the default exists; reform requires separate justification).  

  5. **Expressive/Social-Meaning Reading**  
     - *Statement*: Pronoun reform signals collective rejection of exclusionary norms, altering social meaning via convention.  
     - *Mechanism*: Conventions as signals of shared values; linguistic change as performative norm-building.  
     - *Verdict*: **Substantive and defensible** (e.g., "Ms." shifted perceptions of marital status as a social category).  

  6. **Strong Constitutive Reading**  
     - *Statement*: Language categories rigidly determine conceptual possibilities ("limits thought").  
     - *Mechanism*: Linguistic determinism.  
     - *Verdict*: **False** (refuted by crosslinguistic flexibility and creativity; e.g., speakers circumvent constraints through paraphrase).  

  ---

  ### **What the Slogan Had to Mean**  
  His slogan ("you can’t change the world by changing the words") must assume **causal inefficacy** to dismiss both reform and satire. This implies:  
  - **For reform**: Language is epiphenomenal; altering pronouns cannot redistribute costs, shape habits, or signal norms (rejecting Readings 1, 2, 5).  
  - **For satire**: If words can’t change the world, satirical words can’t reveal anything actionable (rejecting Reading 3).  
  But this strong causal inefficacy claim is **indefensible**. It conflates *direct material change* (e.g., ending poverty) with *mediated social change* (e.g., shifting norms). While linguistic reform alone won’t dismantle structural oppression, it alters interactions that sustain it (e.g., reducing microinvalidations). If he retreats to weaker readings (e.g., diagnostic triviality), he concedes satire exposes the default but must argue separately that reform is futile—a point his slogan fails to make.  

  ---

  ### **Pump, Proof, or Intervention**  
  The satire functions primarily as an **intervention** (enabling availability/defamiliarization), secondarily as a **proof** (diagnosing the default’s existence). Its force is not "borrowed" but **leveraged**: it maps our disagreement to a *shared* moral premise (anti-racism) to trigger cognitive dissonance. This orthogonal mapping is its strength, not weakness. Running it "in reverse" (e.g., satire defending sexist defaults) would fail because it targets a premise the audience *already rejects* (racism), exploiting inconsistency to expose hypocrisy. It works precisely because the audience’s existing values condemn the mirrored scenario. The worry about borrowed force confuses *rhetorical efficacy* with *logical validity*: the satire’s power derives from moral consistency, not circularity.  

  ---

  ### **The Strongest Version of My Side**  
  **Lead with the Cost-Reallocation Reading** (1). It frames reform as harm reduction: the default asymmetrically burdens marginalized groups with cognitive labor and identity-marking, while reform imposes negligible costs on privileged groups (e.g., learning "they"). This is pragmatic, non-utopian, and avoids determinist claims.  

  **Most Damaging Counter**: Reallocating costs may not impact material outcomes (e.g., wage gaps). Linguistic change could be purely symbolic, masking inaction on structural issues.  

  **Settling Evidence**:  
  1. **Empirical**: Studies showing reduced stereotype activation (e.g., when using gender-neutral pronouns) or improved inclusion perceptions.  
  2. **Counterfactual**: If cost-reallocation is trivial, why do opponents resist? Their investment reveals perceived stakes in maintaining defaults.  
  3. **Practical**: Documented outcomes from reforms (e.g., Sweden’s "hen" correlating with reduced gender bias in children).  

  This forces the debate onto measurable effects, not metaphysical claims about "changing the world."
