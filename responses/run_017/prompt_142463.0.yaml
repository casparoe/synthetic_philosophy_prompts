     - **D) No, but that's because institutions are inadequate.** [Flag: This position is not clearly occupied in classical texts. It might be a variant of Xunzi, but he thought institutions work.]

  4. **Q4 (from C)**: Once a person is good, does that state require ongoing external support (teachers, rules, institutions)?
