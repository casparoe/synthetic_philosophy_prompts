answer: |-
  Below is a decision tree designed to sort students into nuanced positions on human nature, based on concrete cases and avoiding jargon. It starts with the *aim* of the claim about human nature (your requested first split), incorporates your "upkeep question," and lands on 10 distinct leaves (8 named positions + 2 unoccupied). The tree uses everyday scenarios (e.g., toddlers, institutions, feral children) to make it accessible to first-year students. Each internal node is a question they can answer without prior knowledge of Chinese philosophy.

  **How to Use This Tree:**  
  Answer each question based on your intuition about real-world examples. Follow the branches until you reach a "leaf" (final position). Positions marked with **?** are uncertain in classical texts; **Unoccupied** leaves have no clear historical advocate.

  ---

  ### **Decision Tree: What’s Your View of Human Nature?**  
  **Start with Question 1.**

  #### **1. When someone says "human nature is X," what are they MOSTLY trying to explain?**  
     - **A. Our starting point:** What’s in our "factory settings" at birth? (e.g., a newborn’s instincts).  
       *→ Go to Question 2*  
     - **B. Reliability:** How likely is a normal person, raised okay, to turn out decent? (e.g., your neighbor who grew up in a stable home).  
       *→ Go to Question 3*  
     - **C. Resistance:** How hard is it to shape people into good versions of themselves? (e.g., training a stubborn puppy vs. a calm one).  
       *→ Go to Question 4*  
     - **D. The standard:** Where does the idea of "good" even come from? (e.g., why is compassion "good" and selfishness "bad"?).  
       *→ Go to Question 5*  

  ---

  #### **2. (From A) At birth, are humans more like a "blank phone" (neutral), a "ripe seed" (good), or "wild weeds" (bad)?**  
     - **A. Ripe seed:** Born with clear "good" impulses (e.g., a toddler who runs to hug a crying friend without being taught).  
       *→ Go to Question 6*  
     - **B. Wild weeds:** Born with selfish drives (e.g., a toddler who hoards toys unless scolded).  
       *→ Go to Question 7*  
     - **C. Blank phone:** Born neutral, no built-in moral software (e.g., a feral child who learns kindness or cruelty from environment).  
       *→ Go to Question 8*  
     - **D. Mixed bag:** Born with both good and bad impulses (e.g., a toddler who shares cookies sometimes but throws tantrums others).  
       *→ Go to Question 9*  

  #### **3. (From B) In a typical town, do most people become reasonably decent?**  
     - **A. Yes, reliably:** Almost everyone ends up decent with normal parenting (e.g., only rare "bad apples").  
       *→* **Textbook Mencian** (Human nature is good; decent outcomes are the norm unless corrupted).  
     - **B. Yes, but only because of society:** People turn out decent only if rules/institutions force it (e.g., people drive politely only because of traffic laws).  
       *→* **Textbook Xunzian** (Human nature is bad; institutions compensate for it).  
     - **C. Mixed results:** Some turn good, some bad—depends on what we nurture (e.g., twins raised together but one becomes selfish).  
       *→* **Han-era mixture view** (Human nature is a blend; cultivation amplifies good or bad elements).  
     - **D. No:** Even with normal upbringing, many stay selfish/chaotic.  
       *→ ? Uncertain in classical texts. Could align with "dark" Xunzi readings, but rare.*  

  #### **4. (From C) If you try to make someone good, is it like carving stone (hard) or molding clay (easy)?**  
     - **A. Molding clay:** Easy to shape—goodness flows naturally (e.g., teaching kids to share takes minimal effort).  
       *→* **Textbook Mencian** (Human nature is good; cultivation is effortless nurturing).  
     - **B. Carving stone:** Hard and requires force (e.g., strict teachers/rules needed to stop bullying).  
       *→ Go to Question 10*  
     - **C. It’s not about "shaping":** Goodness isn’t in individuals—it’s in the system (e.g., well-designed cities reduce crime).  
       *→* **Calibration mismatch view** (Nature isn’t bad; desires clash in modern settings. Fix institutions, not people).  

  #### **5. (From D) Is "goodness" something we discover inside ourselves, or is it imposed from outside?**  
     - **A. Inside:** We feel it intuitively (e.g., guilt when lying comes from within).  
       *→* **Textbook Mencian** (Goodness is innate; standards come from our moral sprouts).  
     - **B. Outside:** Society defines it (e.g., "stealing is wrong" is taught, not instinctive).  
       *→* **Textbook Xunzian** (Standards come from sages; nature has no built-in compass).  
     - **C. Neither:** It’s co-created by humans/environment over time (e.g., moral norms evolve like technology).  
       *→* **Niche-construction view** (Nature/cultivation can’t be split; humans and environment shape each other).  

  ---

  #### **6. (From 2A) Once a person is good, do they stay good without external support?**  
     - **A. Yes—like a tree that grows on its own** (e.g., a kind adult stays kind even isolated).  
       *→* **Textbook Mencian** (Goodness is self-sustaining).  
     - **B. No—requires scaffolding** (e.g., a "good" boss becomes corrupt without oversight).  
       *→* **Unoccupied: Good nature but needs upkeep**  
       *Why?* Incoherent. If nature is good, why perpetual support? Untried in classical texts.  

  #### **7. (From 2B) Once shaped good, do they stay good without support?**  
     - **A. Yes—reformed permanently** (e.g., a criminal rehabilitates and never backslides).  
       *→* **Unoccupied: Bad nature but stable after reform**  
       *Why?* Incoherent. If nature is bad, why no reversion? Untried.  
     - **B. No—collapses without scaffolding** (e.g., a polite student cheats when the teacher leaves).  
       *→* **Textbook Xunzian** (Bad nature requires permanent institutions).  

  #### **8. (From 2C) After being shaped good, does it stick?**  
     - **A. Yes—like a filed arrow** (e.g., a rescued feral child learns kindness and keeps it).  
       *→* **Gaozi-style neutrality (stable)** (Nature is raw potential; once shaped, it holds).  
     - **B. No—requires constant pressure** (e.g., a recovering addict needs lifelong therapy).  
       *→* **Gaozi-style neutrality (needs scaffolding)** (Nature is neutral but requires ongoing shaping).  

  #### **9. (From 2D) Is the "good" part of us separate from our physical urges?**  
     - **A. Yes—a "higher self" vs. "baser instincts"** (e.g., feeling guilt over selfish desires).  
       *→* **Later Confucian split: Original nature good, material nature flawed** (Cultivation aligns the two).  
     - **B. No—all mixed together** (e.g., love and jealousy in a relationship).  
       *→* **Han-era mixture view** (Nature is a blend; cultivation nurtures the good).  

  #### **10. (From 4B) Why is shaping so hard?**  
     - **A. Raw material fights back** (e.g., kids resist sharing even after years of teaching).  
       *→* **Textbook Xunzian** (Bad nature resists cultivation).  
     - **B. We’re sculpting blind** (e.g., no innate "good" to guide us—we guess what works).  
       *→* **Gaozi-style neutrality (needs scaffolding)** (No innate compass; cultivation is trial-and-error).  

  ---

  ### **Final Positions (Leaves):**  
  1. **Textbook Mencian** (From 3A, 4A, 5A, 6A): Nature good; reliable outcomes; easy shaping; self-sustaining.  
     - *Case:* The child at the well (instinctive compassion).  
  2. **Textbook Xunzian** (From 3B, 5B, 7B, 10A): Nature bad; institutions enable decency; hard shaping; needs scaffolding.  
     - *Case:* The toddler who shares only when watched.  
  3. **Han-era mixture view** (From 3C, 9B): Nature mixed; cultivation nurtures good or bad.  
     - *Case:* Twins raised together—one kind, one selfish.  
  4. **Gaozi-style neutrality (stable)** (From 8A): Nature neutral; easy to shape and stable.  
     - *Case:* Feral child taught kindness retains it.  
  5. **Gaozi-style neutrality (needs scaffolding)** (From 8B, 10B): Nature neutral; requires ongoing shaping.  
     - *Case:* The person who is decent only with rules.  
  6. **Later Confucian split** (From 9A): Original nature good, material nature flawed; cultivation aligns them.  
     - *Case:* The sage who practices daily to control desires.  
  7. **Calibration mismatch view** (From 4C): Nature not bad; desires cause conflict in abundance; fix institutions.  
     - *Case:* Violence drops in societies with low inequality.  
  8. **Niche-construction view** (From 5C): Nature/cultivation inseparable; co-evolves with environment.  
     - *Case:* Moral norms change as societies urbanize.  
  9. **Unoccupied: Good nature but needs upkeep** (From 6B): Good at start but requires scaffolding.  
     - *Why?* Incoherent—contradicts "goodness" as self-sustaining.  
  10. **Unoccupied: Bad nature but stable after reform** (From 7A): Bad at start but becomes self-sustaining.  
      - *Why?* Incoherent—if nature is bad, why no reversion?  

  ---

  ### **Confidence and Specialist Critique**  
  - **Overall Confidence: 75%**  
    The tree captures your requirements:  
    - Starts with the *aim* of the claim (Q1), avoiding "good vs. bad."  
    - Includes the upkeep question (Q6–7, 8B, 10) to split Mencius/Xunzi readings.  
    - Uses concrete cases and avoids jargon.  
    - Has 10 leaves (8 named + 2 unoccupied), including all requested positions.  
    - Flags uncertainties (e.g., Gaozi’s stability, Han-era origins).  

  - **Weakest Branch Point: Question 3 (Reliability)**  
    A specialist might argue:  
    > *"Mencius and Xunzi agree that normal rearing usually produces decent people—they just disagree on WHY (Q1A vs. Q1D). Splitting reliability into a separate branch (Q3) might overemphasize a point of agreement, and the 'mixed results' leaf (3C) could be misinterpreted as a third option when it’s Han-era. Better to fold reliability into Q1A/Q1D branches."*  

    I kept it separate per your hunch ("they hardly disagree on the second"), but it’s the likeliest critique.  

  - **Other Uncertainties:**  
    - **Gaozi’s upkeep:** Texts don’t specify if neutrality requires scaffolding. I split it (Leaves 4–5) for clarity.  
    - **Han-era authorship:** Traditionally Dong Zhongshu’s *Chunqiu Fanlu*, but debated.  
    - **Calibration mismatch/niche-construction:** Unoccupied in classical texts—likely because premodern thinkers focused on moral cultivation over institutional design.  

  **Recommendation:** Use this tree as a handout, but preface it with: *"Some branches merge positions; others split them. The goal is to reveal your assumptions, not ‘correct’ answers."* This avoids oversimplification while forcing students to engage cases.
