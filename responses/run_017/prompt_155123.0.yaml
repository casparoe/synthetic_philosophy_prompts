prompt: |-
  I'm on a small committee of a professional society that has to decide, roughly twice a year, whether to withdraw an invited lecture, issue a condemnatory statement, or do nothing, and I've found that every framework we reach for is either a free-speech absolutism that treats all informal sanction as mob coercion or a social-justice framing that treats it as legitimate counter-speech — neither of which tells us anything about the cases we actually face. So before I read another general essay on whether "cancel culture" exists, I want the specification: the desiderata that a theory of informal social punishment has to satisfy to be good enough for an institution like mine to act on (not for a legislature, and not for a moral philosopher scoring positions from the outside). For each requirement give me the case or consideration that motivates it, and mark which are non-negotiable and which are only preferences of a camp — I suspect several things people demand here, such as that a sanction be imposed by someone with demonstrable authority over the sanctioned person, or that it be accompanied by publicly articulable reasons, are really just the institutional mindset generalised beyond its jurisdiction.

  The conceptual work is where I want the effort, and here are the phenomena I insist a specification handle, several of which I've had to name myself because the literature I've seen doesn't distinguish them. (1) Sanctions with no sanctioner: hundreds of individually trivial acts — an un-invitation here, a withdrawn invitation to co-author there — aggregate into an outcome worse than any participant intended or could have prevented; tell me whether a theory must be able to evaluate an aggregate that no agent chose. (2) The legibility asymmetry: within a community, declining to join a sanction is itself read as a position, so a theory has to say whether non-participation is sanction-like conduct, neutral, or something the theory simply has no verdict on. (3) Anticipated sanctions that never arrive: much of what people complain about is self-censorship in the shadow of expected costs, and if a theory counts those as punishments then nearly all contested speech inside any community is already being punished, while if it doesn't it seems to miss the central complaint. (4) The deniability asymmetry between collective and diffuse agents: my society can be asked to justify itself; a scattered crowd cannot, and any requirement of answerability appears to bind the actors who do least harm and exempt the ones who do most. (5) Threshold-insensitivity: because one person's contribution to a cascade is usually imperceptible, expected-consequence reasoning is unavailable to the individual deciding whether to sign the letter — so a theory that aims to guide individuals must either be non-consequentialist about the aggregate or tell us which surrogate reasoning ("what if everyone relevantly situated did this?") is licensed, and what it does to proportionality when the total harm is a function of how many happen to act. Please also keep the distinctions that I think must not be collapsed: withdrawing association oneself versus getting third parties to withdraw it, answering a speaker versus reducing their audience, condemning versus imposing costs, the wrongness of punishing without standing versus the wrongness of punishing excessively, and punishing an individual versus shifting what is sayable at all (if the point is forward-looking norm change of the kind that makes a practice come to seem dishonorable rather than refuted, say whether that makes the individual's desert irrelevant and whether it uses them merely as a means).

  Where I most want you to go is the structure of the list itself: tell me which two or three requirements you take to be in genuine tension and why — my own candidates are action-guidingness for a single agent who doesn't know how many others will act, against proportionality to the harm actually produced; and severity that depends on other people's unpredictable uptake, against any requirement that a sanctioner be able to gauge the sanction's weight in advance. Then tell me which single requirement does the most exclusionary work, and which of these requirements are contingent on empirical claims that could turn out either way (whether audience costs really do cascade, whether sanctions harden rather than soften the sanctioned person's views) as opposed to holding as a matter of the concept of punishment. Only after that, and briefly, score the usual families against the list — the more-speech/counter-speech view, deterrence and norm-enforcement views, retributive or desert-based views, and views on which some speech is itself a rights-violation that sanction merely answers — a line or two each, and skip any you think I've misdescribed.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're part of a committee that has to make decisions about withdrawing lectures or issuing statements. They're frustrated with the existing frameworks—either free-speech absolutism or social justice counter-speech—because neither helps with their specific cases. They want a practical specification for informal social punishment tailored to their institutional context, not abstract theories.

  First, I need to identify their explicit requirements. They listed phenomena like sanctions without a sanctioner, legibility asymmetry, anticipated sanctions, deniability asymmetry, and threshold-insensitivity. Each of these needs a desideratum. For example, addressing aggregated sanctions without a central agent requires evaluating emergent outcomes, which is non-negotiable because ignoring it misses real-world impacts.

  Then, the distinctions they mentioned: withdrawing association vs. third-party pressure, answering vs. reducing audience, condemning vs. imposing costs, etc. These are crucial to prevent collapsing different actions into one. The user probably wants clarity on ethical boundaries here, like not conflating personal disassociation with coordinated exclusion.

  Next, tensions between requirements. Action-guiding for individuals vs. proportionality is a big one. A single agent can't predict others' actions, so how can they ensure proportionality? Also, severity depending on uptake vs. gauging weight in advance. If the sanction's impact depends on unpredictable reactions, institutions can't control the outcome, making advance assessment impossible.

  The most exclusionary requirement might be answerability. Holding only formal entities accountable while diffuse actors escape scrutiny could let the most harmful actors off the hook. But insisting all sanctions require answerability might paralyze legitimate counter-speech. That's a tough balance.

  Contingent empirical claims include whether sanctions cascade or harden views. If sanctions usually backfire, that challenges deterrence theories. But if they normatively shift behavior, that supports them. These need evidence, not just theory.

  Scoring existing theories briefly: counter-speech might handle individual actions but fail aggregates. Deterrence struggles with proportionality when harm is emergent. Retributive views need clear authority, which informal sanctions lack. Rights-violation approaches might justify sanctions but overextend to diffuse cases.

  The user's deeper needs seem to be practical guidance amid uncertainty. They need a framework that acknowledges emergent outcomes, guides individual actions without perfect knowledge, and maintains ethical distinctions. They might also want legitimacy for their committee's decisions without overstepping into moral philosophy. Ensuring the specification is institutionally feasible without requiring impossible predictions is key. Balancing moral responsibility with practical constraints in real cases where outcomes are unpredictable is probably their core challenge.
answer: |-
  Here’s a specification of desiderata for evaluating informal social punishment in institutional contexts like yours, grounded in your operational needs and the phenomena you’ve identified. Requirements are classified as **non-negotiable** (essential for coherent action) or **contingent** (dependent on empirical/ideological priors), with motivating cases and tensions highlighted.

  ---

  ### **Core Desiderata for Institutional Action**
  1. **Non-negotiable: Must distinguish *kinds* of sanctioning acts**  
     - *Motivation*: Collapsing "withdrawing a co-authorship" (personal boundary) and "organizing a petition to cancel a talk" (third-party pressure) obscures ethical differences in agency and harm.  
     - *Handles*: Your distinctions (withdrawing association vs. recruiting third parties; condemnation vs. cost-imposition).  
     - *Exclusionary work*: Rejects theories treating all disassociation as morally identical (e.g., pure counter-speech frameworks).

  2. **Non-negotiable: Must account for *emergent aggregate harm***  
     - *Motivation*: Your case (1) — death-by-a-thousand-cuts sanctions with no single coordinator.  
     - *Handles*: Evaluates outcomes not chosen by any agent (e.g., career collapse from micro-exclusions).  
     - *Contingent claim*: Whether such aggregates *typically* occur (empirical) vs. whether they *can* be evaluated (conceptual necessity).

  3. **Non-negotiable: Must clarify *neutrality’s legibility***  
     - *Motivation*: Legibility asymmetry (2): In polarized contexts, non-participation (e.g., refusing to sign a condemnatory letter) is read as endorsement of the sanctioned person.  
     - *Handles*: Specifies if neutrality is possible or if all acts are interpretable as pro/anti sanction.  
     - *Tension*: With #6 (proportionality) — neutrality might be indistinguishable from complicity if the act is grave.

  4. **Contingent: Must define *standing* without institutional overreach**  
     - *Motivation*: Your "institutional mindset" critique — demanding formal authority for sanctioners ignores diffuse actors’ impact.  
     - *Handles*: Distinguishes *who* may sanction (e.g., affected parties vs. strangers) from *how* they sanction.  
     - *Contingent claim*: Whether "standing" is morally relevant in informal contexts (ideological).

  5. **Non-negotiable: Must address *anticipated sanctions* without overcounting**  
     - *Motivation*: Case (3) — self-censorship due to feared repercussions.  
     - *Handles*: Evaluates whether *reasonable expectation* of sanctions (e.g., based on past patterns) constitutes punishment.  
     - *Key exclusion*: Rejects theories ignoring chilling effects (absolutism) or equating all fear with actual punishment (overbroad social-justice views).

  6. **Non-negotiable: Must require *proportionality assessments***  
     - *Motivation*: Threshold-insensitivity (5) — individuals can’t foresee aggregate harm.  
     - *Handles*: Guides agents to use surrogate reasoning (e.g., "What if all similarly situated acted thus?") while flagging its limits.  
     - **Tension with action-guidingness**: Proportionality (#6) clashes with #7 when agents can’t predict others’ actions.  
     - **Tension with severity predictability**: Severity (#8) depends on social uptake (unpredictable), undermining proportionality.

  7. **Contingent: Must be *action-guiding for individuals***  
     - *Motivation*: Threshold-insensitivity (5) — individuals need ethical heuristics when consequences are opaque.  
     - *Handles*: Offers rules for isolated actors (e.g., "Only impose direct costs if harm is clear and proximate").  
     - *Contingent claim*: Whether individualist guidance is possible without ignoring aggregates (empirical: do cascades dominate?).

  8. **Contingent: Must bind *answerability to collective agents only***  
     - *Motivation*: Deniability asymmetry (4) — your society can be held accountable; a Twitter mob cannot.  
     - *Handles*: Imposes requirements (e.g., articulable reasons) solely on institutional/organized actors.  
     - *Most exclusionary requirement*: This *exempts diffuse actors* from justification demands, accepting that the worst harms may be least answerable.  
     - *Contingent claim*: Whether answerability reduces harm or merely formalizes it (empirical).

  9. **Non-negotiable: Must separate *desert* from *norm-shifting***  
     - *Motivation*: Your final distinction — punishing a person vs. changing what’s sayable.  
     - *Handles*: If sanction aims at norm change, it must not treat the individual as *merely* instrumental (e.g., requires proportionality to their culpability).  

  ---

  ### **Key Tensions**
  - **Proportionality (#6) vs. Action-guidingness (#7)**  
    Proportionality requires knowing aggregate harm, but individuals can’t predict cascades (#5). *Resolution*: Use surrogate reasoning ("universalization") but cap severity to what the act would merit if *only* one agent acted.  
  - **Severity (#8) vs. Advance Gauging**  
    Severity depends on social uptake (e.g., a statement goes viral), making advance weight assessment impossible. *Resolution*: Institutions must only control *their* contribution (e.g., "We impose cost X, but disavow escalation").

  ---

  ### **Scoring Existing Frameworks**
  | **Framework**               | **Fits Desiderata?**                                                                 | **Key Gap**                                                                 |
  |-----------------------------|-------------------------------------------------------------------------------------|-----------------------------------------------------------------------------|
  | **Counter-speech**          | Handles individual acts (#7); distinguishes condemnation vs. cost-imposition (#1). | Fails aggregates (#2,#5); ignores emergent harm (#2).                       |
  | **Deterrence/Norms**        | Explains norm-shifting (#9); addresses chilling effects (#5).                      | Neglects desert (#9); ignores threshold-insensitivity (#5).                 |
  | **Retributive**             | Prioritizes proportionality (#6) and standing (#4).                                | Demands articulable reasons (#8), unrealistic for informal sanctions.       |
  | **Rights-violation**        | Justifies sanctions without authority (sidesteps #4 institutional mindset).        | Overextends "harm" to justify diffuse sanctions, violating #1 and #8.       |

  ---

  ### **The Unavoidable Trade-off**
  The **most exclusionary requirement** is **answerability for collectives only (#8)**. It accepts that the worst harms (diffuse mobs) evade accountability, prioritizing institutional responsibility over total harm reduction. This is defensible because:  
  - Your committee *can* only control institutional actions.  
  - Demanding answerability from atomized actors is practically futile.  

  **Contingent empirical claims** needing evidence:  
  - Do micro-sanctions *reliably* cascade? (If not, #2 less urgent.)  
  - Do sanctions harden views? (If yes, norm-enforcement (#9) may backfire.)  
  - Does answerability reduce harm? (If not, #8 is purely symbolic.)  

  A viable theory must **prioritize institutional agency**: It should guide *your* actions amid uncertainty about others’ choices, reject moral inflation of neutrality (#3), and acknowledge that some harms (aggregate/chilling) are real but not fully controllable. The goal isn’t philosophical purity but defensible decisions under irreducible ambiguity.
