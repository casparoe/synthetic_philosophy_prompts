prompt: |-
  You're a professional philosopher — ideally the kind who has actually had to explain population ethics to people who sign off on real money, not just to other philosophers. Take your time with this, and before you write the actual thing, do a bit of open brainstorming about which distinctions here are load-bearing and which are decoration, then give me a short section at the top listing what you considered including and dropped, and why.

  I've just joined the programme committee of a mid-sized foundation that funds maternal, newborn and child health in a few low-income countries. We meet four times a year and score somewhere between 8 and 12 proposals a round. I get maybe 30–40 minutes per proposal, less for the small ones. Our output is a single ranked list plus a one-page written rationale per grant, and it has to be signed off by a board of six: a paediatrician, two ex-finance people, a former minister of health, a nurse, and one guy whose entire contribution is "surely saving babies beats handing out vitamins". Nobody in the building has any philosophy training, and we can't go looking things up mid-meeting.

  What I want from you is a procedure we can actually run. Not an essay on the repugnant conclusion (Parfit, I think? — I've allready read the summary page); what I need is: the questions in the order we should ask them, what counts as an adequate answer to each, the points where the procedure just says no and stops, and the points where it hands the decision back to us because the question is one of values pretending to be a question of fact — and for those, tell us what the value choice actually is, give us the two or three live options, and let us pick one and write it down as standing policy so we don't relitigate it every round.

  Here's the thing our current scoring completely ignores, and which I suspect matters more than anything else on our spreadsheet. Our proposals differ in *how* they change the world, in three ways I've started labelling myself (tell me if there's proper terminology for this, and if my three categories are the right ones):

  - hold-fixed: the intervention helps people who will exist either way. E.g. treatment for malaria in children who are already alive. Same people, same number, better lives.
  - add-one: the intervention changes how many people there are. Our unconditional cash transfer pilot seems to nudge completed fertility up by something like 5–8%, so some of the welfare we'd be "creating" sits with people who wouldn't have existed otherwise.
  - swap-one: the number of people stays roughly the same but their identity changes. Preconception micronutrient/folate supplementation changes the timing of conception, so plausibly a different child exists. Same shape as an embryo-selection / IVF-adjacent proposal we got asked to fund, where a couple at risk of a serious heritable condition would end up with a different child rather than no child or a healthier one. And — this is the one that's really bugging me — same shape as a programme to reduce stillbirths in a district where families reliably have another child after a loss.

  And here's the part I can't get anyone to help me with. If you trace any intervention far enough downstream, it changes who meets whom and when they conceive, so sooner or later *everything* is swap-one. Our cash transfer probably shifts marriage timing and migration too. So the procedure needs a rule about how far downstream we trace identity effects before we stop counting them — a causal horizon, I've been calling it — and I want you to be straight with me that whatever rule you give me here is a stipulation the theory doesn't settle, not a result.

  Two more constraints. We can't measure welfare, only proxies: DALYs, consumption, school attainment, whatever the grantees report. Tell us what to do at the steps where we simply don't have a number. And at the end we have to hand the board one ranked list, so the procedure has to either tell us how to combine hold-fixed gains with add-one and swap-one gains into a single comparable figure, or tell us plainly that it can't and give us a lexicographic fallback that a former minister of health could follow without a philosophy degree.

  Then run it on three proposals, all of which are roughly live for us:

  1. bed-net distribution plus case management for under-5s (hold-fixed).
  2. unconditional cash transfers, with the fertility bump in the pilot data (add-one).
  3. a stillbirth-reduction package in a district with a high replacement rate (swap-one).

  Run number 3 honestly, even if it produces an answer the board will hate. I have a sinking feeling that on a lot of the defensible views this one scores far lower than anyone in the room expects — possibly near zero, possibly negative once you put the costs on the other side of the scale — and I want to know whether that's genuinely what the views imply or whether I've misunderstood something. If your procedure does output something we'll find repulsive, say so plainly, and then tell us which single knob we'd have to turn to get a nicer answer and what turning that knob costs us on the other two proposals.

  Finally, how I want it written. Please separate, clearly and as you go, the parts of this that are settled among people who actually work on these questions from the parts that are live fights. Flag every step where you're handing me one side of a dispute that reasonable specialists reject, and give me a rough sense of how mainstream the view you're leaning on is. I'd much rather read "this step only goes through if you accept a person-affecting restriction, and lots of people don't" than a confident sentence with a fight hidden inside it. Where you're genuinely unsure — including about whether there's any established answer to my swap-one stuff — say that rather than smoothing it over. And finish with a short section on what this procedure can't do for us.
reasoning: |-
  Okay, let me start by really unpacking what this user needs. They're on a program committee for a foundation focused on maternal and child health in low-income countries. They have to evaluate proposals quickly, with no philosophy background among the decision-makers. The main issue is how to handle different types of interventions: hold-fixed (help existing people), add-one (increasing population), and swap-one (changing who exists). The user is particularly worried about the "causal horizon" problem—since all interventions eventually affect identity—and how to compare these types fairly.

  First, I need to identify the core philosophical distinctions. The hold-fixed interventions are straightforward; they improve lives without changing identities. Add-one involves creating new people, which brings up the non-identity problem: is bringing a person with a worthwhile life into existence a benefit? Swap-one is trickier because it's about different people existing instead of others, raising questions about whether that's neutral or negative if the alternative person would have had a better life.

  The user mentioned that everything becomes swap-one if traced far enough. So, setting a causal horizon is essential. But that's not something philosophy can dictate; it's a practical decision. I should present it as a policy choice: stop at direct effects? Or include indirect effects up to a certain point? The former is more manageable, while the latter is more theoretically pure but impossible to measure.

  Next, welfare measurement. They use proxies like DALYs. I need to clarify that these proxies are imperfect but necessary. When comparing across intervention types, they need a common currency, like DALYs. But for add-one and swap-one, adjustments are needed. For swap-one, if the alternative child would have had a worse life, it might count as a gain, but that requires speculative data. The user's example of stillbirth reduction with high replacement rates is a key test case. If the replacement child has a lower quality of life, the net benefit might be negative, which the board might find repugnant. I need to be honest about that outcome and suggest how to adjust the valuation of lives if they want to avoid it.

  The procedure must be step-by-step, with clear stopping points and value choices. For instance, deciding whether to count add-one gains at all is a value choice. The board must agree upfront. Similarly, for swap-one, they need to choose whether to compare to the counterfactual child's welfare or treat it as neutral.

  Running the examples will highlight these issues. Bed nets (hold-fixed) are easy. Cash transfers (add-one) require valuing the new lives' welfare. Stillbirth reduction (swap-one) might show low or negative gains if the replacement child has a worse life. The user needs to know which "knob" to turn—like discounting future identities or valuing all lives equally—to change the outcome, and what trade-offs that entails.

  I should also flag where philosophy is settled versus contentious. Person-affecting views versus total utilitarianism, for example. The causal horizon is unresolved. Being transparent about these disputes is crucial so the board knows where they're making policy rather than following strict theory.

  Finally, the procedure's limitations: it can't resolve deep philosophical debates, relies on imperfect data, and can't handle extreme long-term effects. The board must accept that some value judgments are necessary and document them for consistency.
answer: |-
  ## Population Ethics for Grantmakers: A Practical Procedure

  **Brainstorming Notes: What's Included, What's Dropped, & Why**

  *   **Dropped: Deep Dive into Person-Affecting vs. Impersonal Views** (The core debate). *Why:* Essential background, but too abstract for a procedure. Instead, we force explicit value choices at key points.
  *   **Dropped: Detailed Welfare Measurement Theory** (e.g., preference vs. objective list). *Why:* You work with proxies (DALYs, etc.). We take those as given inputs and focus on *how to use them* across different identity-effect types.
  *   **Dropped: Attempting to "Solve" the Causal Horizon Objection.** *Why:* You're absolutely right – philosophy *doesn't* give a single answer. We'll provide a clear, *practical* definitional rule based on directness and measurability.
  *   **Dropped: Full Analysis of All Possible Moral Theories.** *Why:* Need a usable procedure. We focus on the most *operationally distinct* views relevant to grantmaking: Total Utilitarianism (TU), Average Utilitarianism (AU), and a strong Person-Affecting (PA) restriction. These capture the major forks in the road.
  *   **Included: Non-Identity Problem & "Same-Number Quality"** as core concepts. *Why:* Directly addresses your "add-one" and "swap-one" categories.
  *   **Included: Clear Value Choice Points.** *Why:* You need standing policy to avoid re-litigation. We identify the 2-3 live options per choice point.
  *   **Included: Lexicographic Fallback.** *Why:* You must produce one ranked list. If full aggregation fails, we need a practical tie-breaker order.
  *   **Included: Causal Horizon Rule.** *Why:* Essential to operationalize "swap-one." We explicitly state it's a pragmatic stipulation.
  *   **Included: Running Examples & "Knob Turning".** *Why:* Crucial for testing and understanding consequences, especially for the sensitive stillbirth case.

  **The Procedure: Questions & Steps**

  **Stage 0: Standing Policy Decisions (Set Once, Document, Refer Back)**
  *   **Value Choice 1: How do we value "Add-One" gains?** (The core of the Non-Identity Problem)
      *   **Option A (TU-Leaning):** Count the welfare of the added person *if* their life is above a defined **Zero-Welfare Point (ZWP)**. *Requires defining ZWP (e.g., life expectancy >1 year? DALY score > -X?)*
      *   **Option B (Strong PA):** Do *not* count the welfare of the added person as a "gain." (Their existence is neutral/non-comparable). Only count welfare *changes* to people who would have existed anyway.
      *   **Option C (AU):** Count the welfare of the added person, but only if it raises the *average* welfare of the relevant population.
      *   *Settled?* **NO.** Deep philosophical dispute. TU is common in cost-effectiveness circles, PA has strong intuitive/philosophical appeal. AU less common now. *Recommendation for Foundations:* **Option A (TU-Leaning) with ZWP = Life Expectancy ≥ 1 year & Absence of Severe, Untreatable Suffering.** Pragmatic, aligns with standard health metrics. *Document this choice.*
  *   **Value Choice 2: How do we value "Swap-One" gains?** (The "Same-Number Quality" Comparison)
      *   **Option A (Counterfactual Comparison):** Compare the welfare of the person who *does* exist (due to intervention) to the welfare of the person who *would have* existed otherwise. The gain is the difference. *Requires estimating the welfare of the counterfactual person (highly speculative).*
      *   **Option B (Existence-Independent Threshold):** Only count the welfare of the person who exists *if* it meets a minimum threshold (e.g., ≥ ZWP). No comparison. Treats swap as simply creating *a* life meeting the threshold.
      *   **Option C (PA-Neutral):** Treat "Swap-One" as neutral (no gain/loss) because there's no person deprived of existence. Only count direct welfare changes to parents/others *if applicable*.
      *   *Settled?* **NO.** Intense debate. Option A is theoretically pure but empirically fraught. Option B is pragmatic but ignores quality differences. Option C is consistent with strong PA but ignores potential quality losses. *Recommendation:* **Option B (Existence-Independent Threshold) with ZWP = Life Expectancy ≥ 1 year & Absence of Severe, Untreatable Suffering.** Avoids speculative counterfactuals. *Document this choice.*
  *   **Value Choice 3: Defining the Causal Horizon (The "When Do We Stop?" Rule)**
      *   *Settled?* **NO.** Philosophy offers no definitive answer. This is **your stipulated rule.**
      *   **The Rule:** "We trace identity effects only through **direct and intended biological pathways** within the **target population cohort** for the intervention's **primary outcome timeframe**. We disregard downstream effects on identity arising from broader social changes (e.g., marriage timing changes from cash transfers altering *who* meets whom, migration altering local conception patterns)." *Rationale:* Focuses on effects reasonably attributable to the intervention and measurable within your project scope. *Document this rule explicitly.*
  *   **Value Choice 4: Aggregation Currency:** **DALYs Averted** (or your preferred proxy). Define it clearly (e.g., WHO standard). *Settled?* **YES (Operationally).** Philosophy debates welfare foundations, but DALYs are the standard operational currency in global health for comparing diverse health impacts. Use them consistently.

  **Stage 1: Per-Proposal Assessment (30-40 mins each)**
  1.  **Question:** What is the **Primary Mechanism** of welfare impact? (Hold-Fixed / Add-One / Swap-One) *Adequate Answer:* Based on biological/social mechanism & Causal Horizon Rule. *Stop If:* Mechanism unclear/impossible to categorize (Rare! Reject or flag for urgent clarification).
  2.  **Question:** What are the **Expected Welfare Changes** (in DALYs averted or chosen currency), **disaggregated by beneficiary type** based on Mechanism & Standing Policy?
      *   *Hold-Fixed:* Gains for existing people. (Reported DALYs averted).
      *   *Add-One:* Gains *only* for the added person(s) *if* Standing Policy (Value Choice 1) says to count them AND their life meets the ZWP. Estimate their *lifetime* DALYs (use cohort averages adjusted for intervention effect). If PA policy (Option B), enter **0** for added person gains.
      *   *Swap-One:* Gains *only* for the swapped person(s) *if* Standing Policy (Value Choice 2) says to count them AND their life meets the ZWP. Estimate *their* lifetime DALYs. *Do not* subtract counterfactual person's DALYs (per Recommended Option B). If PA-Neutral policy (Option C), enter **0** for swapped person gains.
      *   *Adequate Answer:* Numbers, even if estimates (state uncertainty: "~X DALYs based on district avg."). Use best available data/proxies.
      *   *Stop If:* Cannot estimate welfare for a beneficiary type the Standing Policy *requires* counting. (Reject or flag for urgent better data).
  3.  **Question:** What are the **Total Costs** (Financial, fully loaded)?
  4.  **Question:** **Calculate Cost-Effectiveness:** Total Welfare Gains (from Step 2) / Total Costs. **This is the primary score for ranking.** (e.g., DALYs averted per $1000).

  **Stage 2: Aggregation & Ranking**
  *   **Goal:** Produce a single ranked list by Cost-Effectiveness (CE) Ratio (Step 4).
  *   **Problem:** Different beneficiary types are now incorporated into the CE ratio according to Standing Policy. This *should* yield comparable figures.
  *   **Fallback (Lexicographic Order):** If CE ratios are very close or incomparable due to radical value differences (unlikely with Standing Policy):
      1.  Rank proposals with only **Hold-Fixed** gains highest (least controversial).
      2.  Then rank proposals with **Swap-One** gains (using your policy).
      3.  Then rank proposals with **Add-One** gains (using your policy).
      *   *Rationale:* Prioritizes helping existing individuals first, then identity shifts, then population increases, reflecting common moral intuitions. *Document this fallback order.*

  **Running the Examples (Assuming Recommended Standing Policy: TU-Leaning Add-One, Threshold Swap-One, Defined Causal Horizon, DALYs)**

  1.  **Bed-nets & Case Management (Hold-Fixed):**
      *   Mechanism: Hold-Fixed (Prevents disease/disability/death in existing children).
      *   Welfare Gains: X DALYs averted (directly estimated from epi models).
      *   Costs: $Y
      *   **CE Ratio: X/Y DALYs/$**

  2.  **Unconditional Cash Transfers (Add-One):**
      *   Mechanism: Add-One (Causal Horizon Rule: Fertility bump is direct demographic effect within target cohort/timeframe. Downstream marriage/migration identity shifts are *excluded*).
      *   Welfare Gains:
          *   Gains for Existing HH Members: Z DALYs (e.g., from better nutrition/healthcare access).
          *   Gains for Added Children: Estimate lifetime DALYs for ~5-8% more children born. Assume they meet ZWP. Gain = A DALYs.
      *   Costs: $B
      *   **CE Ratio: (Z + A) / B DALYs/$**

  3.  **Stillbirth Reduction (High Replacement Rate) (Swap-One):**
      *   Mechanism: Swap-One (Causal Horizon Rule: Prevents death of Fetus A. Family would have conceived Fetus B later. Direct biological pathway within cohort/timeframe).
      *   Welfare Gains:
          *   Gains for Parents/Others: Minimal or 0 (hard to measure, often not included).
          *   Gains for the Child Who Exists (Child A): Estimate Child A's lifetime DALYs. Assume meets ZWP. Gain = C DALYs (per Recommended Policy Option B: Threshold, no counterfactual subtraction).
      *   *Crucial Honesty:* **Standing Policy Option B gives C DALYs.** However, if we *could* estimate the counterfactual (Child B):
          *   If Child B would have had *better* lifetime prospects than Child A (e.g., due to economic improvement, later birth order), then Option A (Counterfactual Comparison) would yield a **LOWER or NEGATIVE gain** (C - D, where D > C).
          *   In high-replacement, high-poverty settings, Child B often *might* be born into marginally better circumstances. **Option B shields you from this potentially repugnant conclusion (low/negative score) by design.**
      *   Costs: $E
      *   **CE Ratio (Policy Option B): C / E DALYs/$**

  **Analysis & The "Knob"**

  *   **Bed-nets:** Straightforward, high CE ratio expected.
  *   **Cash Transfers:** Gains boosted by including added children (A DALYs). CE ratio likely competitive.
  *   **Stillbirth Reduction:** Gains *only* from Child A's life (C DALYs). **This score (C/E) will likely be *significantly lower* than what the board intuitively expects ("saving a baby!").** It might even be lower than bed-nets or cash transfers, depending on costs and the value of C (one average life). *This is the procedure working as designed under your chosen (prudent) policy Option B for Swap-One.*
      *   **Is it Repugnant?** Potentially, yes. The board values "saving babies." The procedure, valuing the *existence* of Child A neutrally (it just meets threshold) and ignoring the counterfactual Child B entirely, assigns it only the value of Child A's life *relative to non-existence*, not relative to the alternative child who would have existed. This feels like it undervalues saving an identifiable life.
  *   **The Knob to Turn for a "Nicer" Stillbirth Answer:**
      *   **Knob:** Change **Value Choice 2 (Swap-One Valuation)** from **Option B (Threshold)** to **Option C (PA-Neutral)**.
      *   **Effect on Stillbirth Proposal:** Welfare Gains drop to **0 DALYs** (only possible minor parent gains). CE Ratio becomes **0 / E = Effectively Infinite Cost/DALY (Very Low Priority)**. *Worse!*
      *   **Alternative Knob:** Change to **Option A (Counterfactual Comparison)**. *If* you can credibly argue Child A has a *better* life prospect than Child B (rare in high-replacement poverty?), gain = (C - D) > 0. *But this is speculative and unstable.*
      *   **The Only Viable Knob for Higher Stillbirth Score:** **Reject the Swap-One framing via Causal Horizon.** Argue that preventing stillbirth is fundamentally **Hold-Fixed** because the fetus is an "existing person" at the time of intervention. *This is a common intuitive view but philosophically contested and inconsistent with the biological reality of conception timing.*
          *   **Cost:** Undermines the whole framework. Opens the door to classifying *all* preconception interventions as Hold-Fixed, which is biologically inaccurate. Makes Add-One/IVF cases very messy.
          *   **Recommendation:** **Don't turn this knob.** Stick with the Causal Horizon and Swap-One classification. Accept that the procedure outputs a lower score than intuition for the stillbirth case under the prudent Swap-One policy (Option B). Prepare the board for this. The strength of your framework is consistency. Highlight the *actual* gain (Child A exists with a life worth living) without overclaiming it's "saving" relative to the alternative.

  **What This Procedure Can and Cannot Do**

  *   **Can:**
      *   Force explicit, documented value choices on contentious population ethics issues.
      *   Systematically incorporate identity effects (Hold/Add/Swap) into cost-effectiveness calculations.
      *   Provide a clear, auditable process for scoring diverse proposals.
      *   Produce a single ranked list using a common metric (CE ratio) with a logical fallback.
      *   Handle your core concern about comparing intervention types.
      *   Manage the Causal Horizon problem pragmatically.
  *   **Cannot:**
      *   Resolve deep philosophical disputes (TU vs. PA vs. AU). It makes you *choose*.
      *   Provide perfect welfare measurements. It relies on your proxies (DALYs, etc.).
      *   Eliminate value judgments. It makes them explicit and subject to standing policy.
      *   Guarantee outcomes that feel intuitively "right" in all cases (e.g., the stillbirth score). Philosophy often challenges intuition.
      *   Handle very long-term or civilization-level effects. The Causal Horizon explicitly limits scope.
      *   Solve the Non-Identity Problem or Repugnant Conclusion. It provides a *practical* way to navigate them operationally.

  **Final Note:** The power of this procedure lies in its **transparency and consistency**. By documenting your Standing Policy choices (Value Choices 1-3, Currency, Fallback Order) and applying the Causal Horizon rule rigorously, you create a defensible system. The board might dislike the output for the stillbirth proposal, but you can clearly show *why* it scores that way based on *their* (or the committee's) own documented policy choices. If they want a different result, they must consciously change the Standing Policy, understanding the trade-offs (e.g., adopting Option A for Swap-One risks instability from speculative counterfactuals). This moves the debate from chaotic intuition to structured policy.
