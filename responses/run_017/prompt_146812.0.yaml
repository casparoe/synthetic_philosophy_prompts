prompt: |-
  I'm a journalist — I cover science and ideas, mostly — and I keep recieving the same shape of tip over and over and I have no word for it.

  Latest three, roughly:

  - A public-health source tells me, "if it's the vaccine-resistant strain, it's about 80% likely the outbreak peaks before the holidays." Nobody has any idea whether it's the resistant strain. Half my newsroom read that and came away more confident about the holidays. A couple of them also came away more confident that it *is* the resistant strain, which the source said nothing about at all.
  - An engineer: "if the failure started in the cooling loop, nine times out of ten you find debris in the second filter." Same thing — people start acting as if the cooling loop is the likely culprit, on the strength of a sentence that was explicitly conditional on it being the culprit.
  - A pollster: "if turnout is under 40%, the challenger probably takes it." Now the campaign is behaving as if low turnout is expected.

  So the shape is: you get handed an if–then, you have no independent read at all on the if-part, and somehow your confidence in the then-part goes up — and sometimes your confidence in the if-part goes up too, which feels like it has to be a mistake, since the source never said anything about the if-part one way or the other.

  I don't just want a label, and please don't tell me it's the law of total probability: that's the arithmetic you do *after* you've decided whether the if-part is allowed to move, and the whole argument in our Slack channel is about whether it's allowed to move. I also got pointed at Jeffrey conditionalization, but as far as I could tell that's the case where you learn a straight probability rather than an if–then, so it's adjacent and not it.

  What I actually want: is there an established concept, or a named puzzle, for this shape? Is there a seperate name for the disputed bit — the question of whether the if-part stays put? Is the version where the source *chose* which if–then to hand me (she had a spreadsheet full of them and gave me the alarming one) the same problem or a different one? And what about when two sources give me if–thens with complementary ifs — "if it's the resistant strain, 80%; if it isn't, 40%" — which seems to pin down the then-part without anybody ever saying anything unconditional: same thing again, or its own thing?

  If there's no name, tell me that straight and coin one: define it, and give me the boundary cases — what has to be true for a case to count as one of these, and what's the nearest miss that isn't.
reasoning: |-
  Okay, the user is a science journalist who keeps encountering a specific logical problem in their sources' statements. They describe scenarios where an if-then statement is given, like "if it's the vaccine-resistant strain, the outbreak peaks with 80% likelihood." But people in their newsroom misinterpret this, becoming more confident about the "then" part or even the "if" part, even though the source only stated a conditional probability.

  First, I need to identify the core issue. The journalist noticed that when people hear a conditional statement like "if A, then probably B," they tend to update their beliefs about B being true, and sometimes even about A being true, without any new evidence about A. That seems irrational because the source didn't provide any information on the probability of A itself. This looks like a confusion between conditional and unconditional probabilities. The user mentioned the law of total probability, which requires knowing P(A) to find P(B), but here P(A) hasn't changed.

  I recall that this resembles the prosecutor's fallacy in legal contexts, where people mix up conditional probabilities. For example, the probability of evidence given innocence versus innocence given evidence. But this situation is a bit different. Here, it's about updating beliefs based on a conditional statement without new evidence for the antecedent.

  Then there's the concept of uncertain evidence. When someone tells you "if A, then B," it's not direct evidence but a rule. However, the act of them choosing to mention it might imply something about A. That's where the selection effect comes in. For instance, if the source picked which if-then statement to share, it might signal that A is relevant or true. That could explain why people update their belief in A. But the user wants to know if there's a named concept for this.

  The base rate neglect is part of it. People ignore the prior probability of A. But the deeper issue is treating the conditional statement as evidence for A or B. The psychological phenomenon might be related to the representative heuristic or availability heuristic, but that doesn't quite fit.

  Jeffrey conditionalization was mentioned, but that's about updating beliefs with uncertain evidence, not conditional statements. So that's adjacent but not the same. The user wants to know if there's a specific term for this misinterpretation.

  The closest terms I can think of are the conditional probability fallacy or the inverse fallacy, where people confuse P(B|A) with P(A|B). But in these examples, it's not exactly that. It's more about updating P(B) or P(A) based on being told P(B|A). 

  The concept of "importing the antecedent" might apply. That's when people start believing A is true because they were told "if A, then B." But the user's cases involve probabilities, not certainties. So maybe a probabilistic version of that.

  Another angle is the selection effect. When a source chooses to share a specific conditional, it might imply that the antecedent is true or relevant. The user asked about this—whether it's the same problem. For example, if the pollster chose to mention the low turnout scenario because it's likely, that could rationally update beliefs. But without knowing the source's motives, it's tricky.

  The case with two complementary conditionals is different. If sources say "if A, 80% B; if not A, 40% B," then the probability of B can be calculated using the law of total probability if you have P(A). But the issue is that people might update P(A) based on which conditional was presented, especially if one source emphasized a particular scenario.

  So to summarize, the core problem is updating beliefs in the antecedent or consequent based solely on a conditional statement without new evidence, possibly due to misunderstanding or selection effects. The user wants a term for this, boundary cases, and how the variants fit.

  Since there's no established term, coining one makes sense. "Conditional Import Fallacy" could work, emphasizing the erroneous import of the antecedent. "Source-Selected Conditional Update" for when the source chooses which conditional to share. The two-source case might be a "complementary conditionals framing effect."

  Boundary cases: Must involve a conditional probability statement. The misinterpretation involves increasing confidence in the consequent or antecedent without justification. Nearest misses would be when there's direct evidence for the antecedent, making the update rational, or when the source's selection provides legitimate clues about the antecedent's likelihood.
answer: |-
  Based on your description, you've hit on a fascinating and under-discussed cognitive pitfall involving the interpretation of **conditional probabilities** in the absence of priors. There isn't a single, universally accepted name for this *exact* phenomenon, but it sits at the intersection of several established concepts. Let's break it down:

  ### Core Phenomenon & Proposed Name
  **The Conditional Confidence Fallacy (CCF)**  
  *(aka "Antecedent Leak" or "Unjustified Conditional Import")*

  **Definition:**  
  The error of increasing confidence in either:
  1.  **The consequent (B)** of a conditional statement ("If A, then B") *or*
  2.  **The antecedent (A)** itself,

  *solely* upon learning the conditional probability statement `P(B|A) = X`, **without receiving any new information about the prior probability `P(A)` or `P(B)`**, and **without justification from the source's context or selection process**.

  ### Why "Fallacy"?
  It violates the logic of probability. `P(B|A) = X` tells you *nothing* about `P(B)` unless you know `P(A)` (via the Law of Total Probability: `P(B) = P(B|A)*P(A) + P(B|~A)*P(~A)`). Learning `P(B|A)` *should not* directly update your belief in `B` happening generally. Similarly, it tells you *nothing* about `P(A)`; the source hasn't commented on how likely `A` is.

  ### Boundary Cases: What Makes it CCF?
  *   **Core Ingredients:**
      1.  A source provides a specific conditional probability `P(B|A) = X`.
      2.  The recipient has no strong prior knowledge updating `P(A)` or `P(B)` from *this specific interaction*.
      3.  The recipient updates their belief about `P(B)` *or* `P(A)` upwards based *only* on receiving `P(B|A) = X`.
      4.  **The update is unjustified:** The source didn't imply `A` is likely, didn't provide `P(A)`, didn't provide `P(B|~A)`, and the selection of *which* conditional to state isn't informative (yet).

  *   **Nearest Misses (Not CCF):**
      *   **Learning `P(A)` or `P(B)` directly:** If the source *also* says "A is likely" or "B is 60%", the update might be rational.
      *   **Source Selection Implies `P(A)` is High:** If the source *chooses* to share `P(B|A)` *because* `A` is known/suspected to be true (see below), updating `P(A)` might be rational.
      *   **Learning `P(B|~A)`:** If you get *both* `P(B|A)` and `P(B|~A)`, you can update `P(B)` if you have a prior `P(A)`. You *still* cannot update `P(A)` directly from these conditionals alone!
      *   **Ambiguous Language Misinterpreted:** If the source *actually* said something implying `P(A)` is high (e.g., "Since it's probably the resistant strain... if it is, 80%..."), the error might be miscommunication, not CCF.
      *   **Pure Base Rate Neglect:** If someone ignores a *known* low `P(A)` when evaluating `P(B)`, that's classic base rate neglect. CCF often involves `P(A)` being *completely unknown/unmentioned*.

  ### Your Specific Scenarios Explained via CCF
  1.  **Vaccine Strain:** Hearing "If resistant strain (A), then 80% peak before holidays (B)" makes people more confident about holidays (B) *and* some more confident it *is* the resistant strain (A). **CCF:** Updating `P(B)` and `P(A)` based solely on `P(B|A)`, with no info on `P(A)` or `P(B|~A)`.
  2.  **Cooling Loop:** Hearing "If failure in cooling loop (A), then 90% find debris in filter 2 (B)" makes people think the cooling loop *is* the culprit (A). **CCF:** Updating `P(A)` based solely on `P(B|A)`.
  3.  **Turnout:** Hearing "If turnout <40% (A), then challenger probably wins (B)" makes the campaign act like low turnout is expected (A). **CCF:** Updating `P(A)` based solely on `P(B|A)`.

  ### Your Excellent Follow-Ups: Variations on the Theme

  1.  **Source Selection Effect (When they choose *which* `if-then` to tell you):**
      *   **Is it the same?** It's **intimately related but distinct**. It *causes* a specific type of CCF or provides a *rational basis* for updating `P(A)`.
      *   **Mechanism:** The source has many conditionals (`P(B|A1)`, `P(B|A2)`, ...). Their *choice* to tell you `P(B|A_specific)` might signal that `A_specific` is relevant, likely, or concerning *to them*. This *can* rationally update your `P(A_specific)`.
      *   **The CCF Twist:** Recipients often update `P(A)` *more than is justified* by the selection signal alone, or conflate the selection with direct evidence for `A`. The journalist's challenge is discerning *why* the source chose that conditional. ("Did she give me the alarming one because `A` is likely? Or just because it's alarming? Or because she knows I like alarming news?").
      *   **Name:** **Source-Selected Conditional Update (SSCU)**. This *induces* CCF if the recipient over-updates `P(A)` or updates `P(B)` without justification. It's rational *only if* you have a reasonable model of the source's selection criteria.

  2.  **Two Sources with Complementary `If`s (The Full Partition):**
      *   **Is it the same?** **No, this is fundamentally different and rational (if used correctly).** This gives you `P(B|A)` *and* `P(B|~A)`.
      *   **Power & Limitation:** This *constrains* `P(B)`. You know `P(B) = P(B|A)*P(A) + P(B|~A)*P(~A)`. If you have a prior estimate for `P(A)`, you can now calculate `P(B)`. **Crucially:**
          *   It **does not** give you `P(A)`! You *still* need your prior for that.
          *   It **does not** directly tell you `P(B)` unconditionally. Only the *formula* linking `P(B)` to `P(A)`.
      *   **Potential for CCF:** Recipients might *still* erroneously:
          *   Update `P(A)` upwards if one `P(B|A_x)` is higher/more alarming than the other (e.g., "80% if resistant, 40% if not" – people might think "Resistant must be more likely because the consequence is worse!" – this is still CCF/base rate neglect).
          *   Think they now know `P(B)` *unconditionally*, forgetting they still need `P(A)`.
      *   **Name:** **Complementary Conditionals Framework**. This is the *correct* setup to eventually find `P(B)` using the Law of Total Probability, *once* `P(A)` is known/estimated.

  ### Why This Happens (Psychology)
  *   **Vividness & Availability:** The concrete probability (`80%!`, `9 times out of 10!`) is vivid and easily available to cognition, overshadowing the unknown or abstract `P(A)`.
  *   **Representativeness Heuristic:** The scenario described (`A` causing `B`) feels like a coherent, likely story.
  *   **Anchoring:** The number `X` in `P(B|A)=X` becomes an anchor for estimating `P(B)`.
  *   **Motivated Reasoning:** If `B` is desirable/high-stakes (e.g., holidays are saved), people *want* `B` to be likely and latch onto `P(B|A)` as evidence, ignoring the dependence on `A`.
  *   **Misunderstanding Conditionals:** People struggle with the logic of `If A then B`; learning it *feels* like evidence for `A` and `B`.

  ### How to Fight It (As a Journalist)
  1.  **Explicitly State the Missing Piece:** "Important note: The source gave us *no indication* of how likely [A] is. This statement only tells us what happens *if* [A] is true."
  2.  **Demand Priors/Base Rates:** Ask the source: "How likely *is* [A] in this situation?" or "What's your best estimate for `P(A)`?" Ask for `P(B|~A)` if possible.
  3.  **Question Source Selection:** "You gave me `P(B|A)`. Are there other important scenarios? Why focus on this specific `if`?"
  4.  **Frame Complementary Conditionals Correctly:** "Source 1 says `P(B|A)=80%`. Source 2 says `P(B|not A)=40%`. This means the outcome `B` depends heavily on whether `A` happens, but we still need to know how likely `A` is to predict `B` overall."
  5.  **Educate Your Newsroom:** Explain CCF! A short memo with your examples could be invaluable. Emphasize: "Conditional probabilities (`If A then likely B`) tell us *nothing* by themselves about how likely `A` is or how likely `B` is overall. They only describe a dependency."

  **In summary:** You've identified the **Conditional Confidence Fallacy (CCF)**. Its core is unjustified belief updating based solely on receiving `P(B|A)=X`. The **Source-Selected Conditional Update (SSCU)** is a critical variant where the source's choice *might* justify some `P(A)` update, but often induces CCF. **Complementary Conditionals** provide a rational framework but *still* require `P(A)` to estimate `P(B)` and do *not* directly provide `P(A)`. The key boundary is the *lack of any new information justifying the update to `P(A)` or `P(B)`* beyond the conditional probability statement itself.
