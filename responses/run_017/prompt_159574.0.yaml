prompt: |-
  I spent most of last night arguing with a friend about whether a certain shape of historical question is even well formed, and we stalled in a way that makes me think we were each gesturing at something I can't name. I'd like the carving rather than the label, so please don't stop at supplying a term.

  The shape is "why X in A but not in B?", of which the famous instance is "why the industrial revolution in Britain and not in China?" — the question usually called the Needham question, at the centre of the Great Divergence literature. My friend's position was that the question is perfectly well posed but merely hard: we need better data about Qing China, and eventually the causal list will sort itself out. I kept saying that something structural is wrong with the question itself, and that no amount of data fixes it. Neither of us could say precisely what.

  Here is the pattern I think I was reacting to, in two instances.

  First, the answers to such questions take the form of a list of features A had and B lacked. But when it turns out that B had one of those features too — commercialised handicraft production in the Yangzi delta, say, or a large internal market, or widespread literacy in practical arithmetic — the feature gets redescribed so that B's version doesn't count: not really a market, not really science, not really the same kind of city. The list survives every counterexample by moving its own terms. My friend says that's just ordinary scholarly revision of concepts; I think the revision is systematically one-directional, which is a symptom rather than a coincidence.

  Second, the choice of B seems to be fixed by the answer rather than by the question. We ask about Britain and China rather than Britain and, say, the Netherlands or Saxony — comparisons that are arguably better controls because they hold more background conditions fixed — because China is the case that dramatically lacks the outcome. That makes the contrast class a function of the very thing to be explained.

  Underneath both, I suspect a conflation of two different questions: what caused the outcome in A, and what made the difference between A and B. These can come apart. A may have had a genuine cause that B also had, with B's failure due to a separate blocker; or the cause of the outcome in A may not be the thing that distinguishes A from B at all ("why A and not B?" then has an answer that is no part of the answer to "why A?").

  My friend proposed a repair: distinguish comparisons whose contrast case is fixed in advance by matching on antecedently specified variables from comparisons whose contrast case is selected because it lacks the outcome, and treat only the first kind as respectable. I objected that even the "matched" case is chosen with hindsight about which variables matter, and that matching on the wrong variables can hide a real cause, so the distinction looks like one of degree and the repair looks cosmetic.

  So my questions. Is there an established concept or literature for (i) the one-directional redescription of the comparison case's features, (ii) the selection of the contrast class by the outcome, and (iii) the difference-making / cause-of-the-outcome conflation — and are these three aspects of one established thing or three different things that happen to travel together? Where are their edges? In particular, give me a boundary case: some "why A and not B?" that is entirely in order — my candidate is "why did this bridge fail and not that one, when both were built to the same specification?" — and say exactly which of the three features it lacks and why, since that is the test of whether you have located the real problem. Finally, on that basis: is the Needham question well posed, ill posed, or ill posed as stated but rescuable under a reformulation you should specify?

  End with a single machine-readable line in exactly this form: \answer{name: <short established label, or "no established name: " followed by your coinage>; verdict: <"well posed" | "ill posed" | "ill posed as stated, rescuable if…">}
reasoning: |-
  We are dealing with a complex methodological issue in comparative historical analysis. The user has identified three interrelated problems in the form of "why X in A but not in B?" questions:

  (i) One-directional redescription: When a feature is found in both A and B, it is redefined so that B's version doesn't count, preserving the explanatory list.

  (ii) Selection of contrast class by the outcome: B is chosen because it lacks the outcome, rather than by independent criteria, making the contrast a function of the outcome.

  (iii) Conflation of two questions: The cause of the outcome in A vs. the difference-maker between A and B.

  The user also provides a candidate for a well-posed question: "Why did this bridge fail and not that one, when both were built to the same specification?" and asks for an example that lacks the problematic features.

  We need to:

  1. Identify established concepts or literature for each of (i), (ii), and (iii) or note if they are unnamed and coin terms if necessary.
  2. Determine if these are aspects of one thing or separate.
  3. Provide a boundary case (the bridge example) and explain why it lacks the three problems.
  4. Give a verdict on the Needham question.

  Let's break down each problem:

  (i) One-directional redescription: This resembles the problem of "moving the goalposts" or ad hoc redefinition to preserve a theory. In philosophy of science, this is related to the concept of "immunization strategies" (Popper) or "ad hoc hypotheses". More specifically, in comparative research, it may be linked to "concept stretching" (Sartori) or "conceptual gerrymandering". However, the one-directional aspect in service of preserving a causal list might be a specific form of confirmation bias.

  (ii) Selection of the contrast class by the outcome: This is a well-known methodological issue. It is related to "selection on the dependent variable" (King, Keohane, Verba) which is a standard warning in social science research design. Choosing cases based on the outcome variable can lead to biased inferences because it does not allow for variation in the outcome to be explained by variation in the causes. The user's example of choosing China because it lacks industrialization (the outcome) is a classic case of selecting on the dependent variable.

  (iii) Conflation of two questions: This is a point about causal inference. The cause of the outcome in A might be a necessary condition, but if it is also present in B, then it cannot be the difference-maker. The literature on necessary and sufficient conditions (e.g., in set-theoretic methods like QCA) addresses this. The user points out that the cause in A might be present in B, and the failure in B might be due to a blocker. This is also related to the idea of "INUS conditions" (Mackie) or more generally to the distinction between causes of effects and effects of causes.

  Are they one thing or separate? They are interrelated but distinct. (i) is a problem of operationalization and measurement, (ii) is a problem of case selection, and (iii) is a problem of causal logic. However, they often co-occur in comparative historical analysis when the research question is framed as a "why A not B?" question without proper controls.

  Boundary Case: The bridge example.

  - Why does it avoid the problems?
    - (i) The features (specifications) are defined in advance and independently. If a feature (e.g., a particular beam) is present in both bridges, we do not redefine it to say that in the failed bridge it was "not really" the same because the bridge failed. Instead, we look for other factors (e.g., material quality, construction errors, environmental factors) that might differ.
    - (ii) The contrast class is not selected by the outcome. Both bridges are chosen because they are built to the same specification, so the selection is based on independent variables (the design) and then we observe the outcome. This is a matched case design.
    - (iii) The question is explicitly about the difference between the two bridges. The cause of failure in the one bridge is exactly the factor that differs. There is no conflation because we are directly comparing two similar cases with different outcomes.

  Verdict on the Needham question:

  The Needham question as typically posed ("why the industrial revolution in Britain and not in China?") suffers from all three problems:
  - (ii) China is chosen because it lacks the outcome (industrial revolution) and because it is a dramatic contrast, not because it is matched on relevant background conditions.
  - (i) Features that are found in both (e.g., markets, proto-industrialization) are often redefined to be "not the same" in China.
  - (iii) The question conflates the cause of industrialization in Britain with the difference between Britain and China. But the real cause might be present in both, and China might have had a blocker (e.g., resource constraints, institutions) that Britain did not.

  Is it rescuable? Yes, by reframing the question to avoid selection on the dependent variable and by using a matched case design. For example, one could ask: "Given that both Britain and the Netherlands (or another comparable region) had many of the preconditions for industrial revolution, why did it occur in Britain first?" This still might not be perfect, but it avoids the worst of (ii). Alternatively, one could use a multiple-case comparative design with cases that are similar on many background variables but had different outcomes.

  However, the Needham question as stated is ill posed because of the case selection and the resulting methodological traps.

  Established concepts:

  (i) One-directional redescription: This might be called "concept stretching" (Sartori) or more generally "confirmation bias" in the handling of evidence. In the context of historical comparison, it might be part of "exceptionalism" in the historiography of the industrial revolution (e.g., the idea that Britain was uniquely suited).

  (ii) Selection on the dependent variable: This is a standard term in social science methodology (from King, Keohane, and Verba's "Designing Social Inquiry").

  (iii) Conflation of cause and difference: This is related to the "difference-making" account of causation (e.g., Mackie's INUS conditions) and the methodological literature on comparative research (e.g., Skocpol's comparative historical analysis). The specific conflation might be called the "fallacy of the contrast class" or "contrast class selection bias", but I am not aware of an established single term. It is also related to the problem of "overdetermination" in causal inference.

  We can summarize:

  - (i) Concept stretching (Sartori) or ad hoc redefinition.
  - (ii) Selection on the dependent variable.
  - (iii) Conflation of cause of outcome with difference-maker.

  They are three distinct but often co-occurring issues.

  Now for the answer format:

  \answer{name: no established name: contrast class selection bias and conceptual gerrymandering; verdict: ill posed as stated, rescuable if reframed as a matched comparison or by specifying independent criteria for the contrast class}

  But note: The user asked for a single established label if possible, but since there are three problems and they are distinct, we might have to combine or note that there isn't one name.

  Alternatively, the entire complex might be called the "problem of asymmetric comparison" or "contrast-oriented historiography", but these are not standard.

  Given the above, I propose:

  The three issues are recognized in the literature but not under one umbrella term. For (ii) there is an established term. For (i) and (iii) we have related concepts.

  Boundary case: The bridge example lacks all three because:
  - The features are fixed in advance (specifications) so no redescription.
  - Contrast class (the other bridge) is chosen by matching on independent variables (same specification), not by outcome.
  - The question is directly about the difference and the cause of the outcome in the failed bridge is the same as the difference-maker (if we find a crack in one, then the crack is both the cause of failure and the difference).

  Verdict: The Needham question is ill posed as stated but rescuable by reformulating to select a contrast class that is similar on background variables (e.g., comparing Britain with the Netherlands or France) and by clearly defining the features of interest independently.

  Final answer structure:

  \answer{name: selection on the dependent variable (for ii) and concept stretching (for i); no single established name for the conflation (iii) or the trio; verdict: ill posed as stated, rescuable if the contrast case is chosen by matching on relevant background variables and features are defined independently of the outcome}
answer: |-
  Your analysis identifies deep methodological pitfalls in the "why A and not B?" question structure, particularly in historical comparisons. Below, I address your three concerns, their interrelations, the boundary case, and the verdict on the Needham question, drawing on established concepts where possible. The core issue is that **the question conflates causal explanation with contrastive explanation**, leading to methodological circularity. The three problems you note are distinct but mutually reinforcing symptoms of this conflation.

  ### (i) One-directional redescription of features
  - **Concept**: This is often called **concept stretching** (after Giovanni Sartori) or **ad hoc redefinition**. Sartori warned against extending definitions to cover new cases in ways that drain them of coherence, often to preserve a theory. In your example, redefining "market" or "science" in China to exclude it from the causal list is a form of **confirmation bias** embedded in operationalization.  
  - **Literature**: Sartori's work on comparative politics (e.g., "Concept Misformation in Comparative Politics") and Imre Lakatos's notion of **degenerating research programmes** (where theories are "immunized" against counterexamples) are relevant. The one-directionality you observe—always redefining B’s traits to exclude them—is a specific pathology of contrastive questions focused on outcome differences.  

  ### (ii) Selection of contrast class by the outcome  
  - **Concept**: This is **selection on the dependent variable** (SDV), a well-known flaw in social science methodology (from King, Keohane, and Verba's *Designing Social Inquiry*). Selecting B because it lacks the outcome (industrialization) rather than through independent criteria (e.g., shared background conditions) biases the analysis by making the contrast class endogenous to the explanandum.  
  - **Literature**: SDV is criticized for producing overdetermined or untestable explanations. Historical applications appear in debates on the "Great Divergence" (e.g., Kenneth Pomeranz's critique of Eurocentric comparisons).  

  ### (iii) Conflation of cause-of-outcome with difference-making  
  - **Concept**: This is a **causal conflation fallacy**, specifically blurring **causes of effects** (what caused industrialization in Britain?) with **effects of causes** (what made Britain different from China?). Philosophers of causation (e.g., J.L. Mackie's INUS conditions) note that a cause in A might not be absent in B if B has blockers (e.g., China had proto-industrialization but also extractive institutions).  
  - **Literature**: James Mahoney's work on comparative historical analysis highlights this; also, David Lewis's contrastive causation theory shows that "why A rather than B?" requires a shared causal background, which SDV violates.  

  **Interrelation**: These are three distinct problems but often co-occur. (ii) *enables* (i) and (iii): selecting B based on the outcome invites redefining features (i) to fit the expected difference and conflates causes with differences (iii). Together, they reflect **contrast class bias**, where the framing of the question predetermines a teleological answer.  

  ### Boundary Case: Why the Bridge Failed  
  Your example—"Why did **Bridge A** fail and not **Bridge B**, when both were built to the same specification?"—is well posed and avoids all three problems:  
  - **Lacks (i)**: Features (specifications) are defined *antecedently* (e.g., materials, design). If both bridges share a feature (e.g., steel girdles), we don’t redefine it to say Bridge B’s girdles "don’t count"; we seek *variations* (e.g., a hidden flaw in A’s girder). Redescription isn’t one-directional because traits are fixed independently.  
  - **Lacks (ii)**: The contrast class (Bridge B) is chosen by matching on **independent variables** (specifications), not the outcome (failure). This is a controlled comparison.  
  - **Lacks (iii)**: The cause of failure in A (e.g., a manufacturing defect) is inherently the difference-maker from B. There is no conflation because the outcome (failure) is rare, and the shared specifications hold background conditions constant, isolating the cause.  

  **Why it works**: The question is **symmetric**—both bridges are treated as potential outcomes of the same causal process—and **feature definitions are invariant**. This avoids hindsight bias.  

  ### Verdict on the Needham Question  
  The Needham question ("Why the industrial revolution in Britain and not in China?") is **ill posed as stated** due to the three problems:  
  - It selects China as B because it lacks the outcome (SDV), invites redefining shared traits (concept stretching), and conflates Britain’s causes with China’s blockers.  
  - **Rescue via reformulation**: Reframe to **symmetrize the comparison** and **specify independent criteria for case selection**:  
    > "Why did sustained industrialization emerge in 18th-century Britain and the Netherlands (which shared key precursors like commercialized agriculture and trade networks), but not in similarly commercialized regions like China’s Yangzi Delta?"  
  This selects cases based on *antecedent conditions* (not outcomes), defines features independently (e.g., "commercialization" via measurable trade volumes), and separates "causes in Britain" from "blockers in China."  

  ### Final Answer  
  The three issues lack a single overarching label in literature, but they cluster under **contrast class bias**, exacerbated by **selection on the dependent variable**. Your bridge case shows the Needham question’s flaws are structural but fixable through symmetric design.  

  \answer{name: no established name: contrast class bias; verdict: ill posed as stated, rescuable if reframed as a symmetric comparison with cases selected by shared antecedent conditions and features defined independently of the outcome}
