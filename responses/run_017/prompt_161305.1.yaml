  ## Step 1: Probabilistic Models for Each Position

  We define the following:

  - **Sample space for runs (Ω_run)**: This is the set of all possible experimental runs. Each run is characterized by the coin flip and the day(s) of awakening. Specifically:
    - ω_H: coin lands heads -> one awakening on Monday.
    - ω_T: coin lands tails -> awakenings on Monday and Tuesday.

  The coin is fair: P(ω_H) = P(ω_T) = 1/2.

  - **Awakening events**: Each awakening is an event that occurs in a run. We can think of the set of all possible awakening events as:
    - Monday in a heads run: (H, Mon)
    - Monday in a tails run: (T, Mon)
    - Tuesday in a tails run: (T, Tue)

  Note: There is no Tuesday awakening in a heads run.

