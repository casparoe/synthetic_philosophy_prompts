    - **Thirder position (size-biased design)**: The sample space is the set of awakening events. There are three possible awakening events, but note that they are not equally likely at the level of runs. Specifically:
        - P(awakening event = (H, Mon)) = 1/2 * 1 = 1/2
        - P(awakening event = (T, Mon)) = 1/2 * 1 = 1/2
        - P(awakening event = (T, Tue)) = 1/2 * 1 = 1/2

      However, these probabilities are not normalized. The total probability of an awakening event is 3/2. To have a probability measure, we normalize. The probability of each type of awakening event is (1/2) / (3/2) = 1/3. Thus, the probability of heads (which corresponds only to (H, Mon)) is 1/3.

  Alternatively, without normalization: the relative frequency of heads awakenings is 1 out of 3 awakening events. The thirder position takes this relative frequency as the target.

