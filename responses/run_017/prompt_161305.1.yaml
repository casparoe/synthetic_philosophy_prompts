  ### 3. Test Cases  

  **Test Case 1: Modified Protocol**  
  - Heads: 1 Mon awakening. Tails: 1 Mon + 2 Tue (Tue indistinguishable).  
  - **Thirder (Size-Biased Design)**:  
    - Awakening events: $(H,\text{Mon})$, $(T,\text{Mon})$, $(T,\text{Tue})_a$, $(T,\text{Tue})_b$ (4 events total).  
    - Unconditional: $P(C=H) = \text{fraction of heads events} = 1/4$.  
    - Given Monday: Restrict to Mon events: $(H,\text{Mon})$, $(T,\text{Mon})$ → $P(C=H | D=\text{Mon}) = 1/2$.  
  - **Halfer (Run-Level Design)**:  
    - Unconditional: $P(C=H) = 1/2$ (per-run).  
    - Given Monday: Use within-run awakening probabilities.  
      - $P(D=\text{Mon} | C=H) = 1$.  
      - $P(D=\text{Mon} | C=T) = 1/3$ (1 Mon out of 3 awakenings).  
      - Bayes: $P(C=H | D=\text{Mon}) = \frac{1 \cdot 1/2}{1 \cdot 1/2 + (1/3) \cdot 1/2} = 3/4$.  
  - **Arithmetic Confirmation**:  
    | Position      | Unconditional | Given Monday |  
    |---------------|---------------|--------------|  
    | Thirder       | 1/4           | 1/2          |  
    | Halfer        | 1/2           | 3/4          |  
  - **Generalization Insights**:  
    - Thirder mechanically generalizes: estimand is always per-awakening frequency.  
    - Halfer requires further commitment: must model within-run awakening probabilities (e.g., uniform over awakenings). This is a rule (update via conditioning) applied to the run-level design.  

  **Test Case 2: Scoring Designs**  
  - **Design A**: Score every awakening.  
    - Fraction of scored reports from heads runs = $\frac{\text{\# heads events}}{\text{total events}} = \frac{N}{N + 2N} = 1/3$.  
  - **Design B**: Score one random awakening per run.  
    - Heads: inclusion prob = 1. Tails: inclusion prob = $1/2$ per awakening.  
    - Fraction of scored reports from heads runs = $\frac{N}{N + N} = 1/2$ (one scored report per run).  
    - *Inverse-Probability Weighting Recovers Run-Level Fraction*:  
      - Design A: Weight tails events by $1/2$ → weighted heads fraction = $1/2$.  
      - Design B: Weight tails reports by $2$ (inverse of inclusion prob) → weighted heads fraction = $1/2$.  
  - **Calibration Argument Defused**:  
    - If Beauty cares about per-run accuracy (Design B), credence 1/2 minimizes loss.  
    - If scored per awakening (Design A), credence 1/3 minimizes loss.  
    - Choice of scoring design (A or B) carries philosophical weight: it determines the relevant frequency.  

