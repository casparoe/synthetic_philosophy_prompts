  - Weighting scheme: To recover the run-level proportion, we would use inverse-probability weighting. The weight for an awakening in a heads run is 1/(1/1) = 1 (because in a heads run there is only one awakening, so the inclusion probability for that awakening is 1). For an awakening in a tails run, the inclusion probability for each awakening is 1 (since both are included) but if we are sampling awakening events and want to estimate the run-level heads probability, we note that each tails run is represented twice. Therefore, we assign a weight of 1/2 to each tails awakening to make each run contribute a total weight of 1 (so that tails runs do not count double). Then the weighted proportion of heads runs would be (number of heads awakenings * 1) / (number of heads awakenings * 1 + number of tails awakenings * 1/2). Since in a large number of runs, there are N heads and N tails runs, the awakening events are: N from heads and 2N from tails. Then the weighted estimate is (N * 1) / (N*1 + 2N * 1/2) = N/(N+N) = 1/2.
