prompt: |-
  I edit a quarterly of satirical public administration, and for an issue on the theme of measurement I need a piece aimed at the practice of governing toward a country's position in the annual world happiness ranking — the one built on the Cantril ladder, where respondents rate their current lives from zero to ten against their own imagined best possible life, averaged over a rolling three-year window, with the accompanying table decomposing each country's average into six factors (income, social support, healthy life expectancy, freedom to make life choices, generosity, perceptions of corruption) alongside a comparison with a hypothetical worst-off country and an unexplained residual.

  The piece I want is a leaked five-point strategy memo from a fictional Office of Comparative Standing inside the government of an unnamed mid-table country, written in deadpan civil-service prose by an author who is entirely sincere. Each clause should convert one real feature of the measurement into a policy lever, and the comedy has to come from the features being described accurately rather than from invented absurdity. Assign one lever per clause, drawing on these:

  - who is asked, and what is uppermost in their mind at the moment of asking: the ladder records a single remembered evaluative judgment, not a sample of experience, so the Office can work the fielding window, the survey items that come first, and the reachability of the sampling frame, while changing nothing about anyone's life;
  - the top rung is each respondent's own imagined best possible life, so a population instructed in more modest expectations stands higher on an unchanged ladder, which justifies a programme for the calibration of aspiration;
  - the headline number is a plain average of ladder answers and the six-factor table is an after-the-fact explanation of it rather than a set of ingredients, so the Office should fund a Residual Division that improves the country's showing in the explanatory table — the residual being larger than most of the explained contributions — without ever moving the figure that determines rank;
  - rank is ordinal and the published figure is a three-year average, so a Competitor Surveillance desk can report a gain in standing in a year in which the country's own average fell, and time each intervention for the year it will first register;
  - the factors are single-item proxies, generosity meaning having given money to a charity recently and freedom meaning satisfaction with one's freedom to choose, so the Office pre-funds a charitable donation for every household and trims the menus of choice until citizens can honestly report satisfaction with the options that remain.

  Constraints: the memo must never say that any of this is bad measurement — no winking, no irony markers, no nudging — and must never state the objections a reader should draw (adaptive preferences, evaluation versus experience, gaming a proxy, the difference between explaining a score and producing it). Let the clauses escalate, with the fifth the most damning in its blandness. Name no real country; the perennial leader may be referred to only as our northern neighbour. Invented officeholders and unit titles are fine. It should be funny to someone who has argued about life evaluation versus experience sampling and legible to someone who has not.

  Reply as exactly five numbered clauses, one or two sentences each, around 300 words in total. No title, no preamble, no sign-off: begin directly with 1.
reasoning: |-
  Okay, let me tackle this satirical memo request. The user wants a fictional government strategy for gaming the World Happiness Report rankings by exploiting methodological quirks, presented as a sincere internal memo without overt irony. 

  Hmm, key challenges here: maintaining deadpan tone while accurately describing real measurement flaws, escalating from least to most damning interventions, and avoiding any direct criticism. The comedy must arise from bureaucratic literalism about survey mechanics.

  First, I consider the five policy levers derived from report's features:
  - Sampling bias exploitation (timing surveys around predictable mood boosts)
  - Aspiration suppression programs (lowering "best possible life" benchmarks)
  - Residual manipulation (prioritizing explanatory factors over actual scores)
  - Rank-juking through rolling averages and peer monitoring
  - Proxy-hacking generosity/freedom measures (pre-paid donations and restricted choices)

  The escalation plan: start with technically defensible adjustments (survey timing), progress to ethically ambiguous territory (mindset training), then outright gaming (residuals), comparative manipulation, ending with the most reductively mechanistic approach (forced donations and choice restriction). 

  For bureaucratic flavor, I'll invent units like "Calendar Optimization Unit" and "Perceptual Calibration Directorate". The perennial leader becomes "our northern neighbour" as requested. 

  Word count discipline is crucial - each clause must be 1-2 sentences packing precise methodological references (Cantril ladder, 3-year average) while sounding like dry policy. The final clause about trimming menus needs particular care - it should sound reasonable while implying terrifying paternalism.

  Must resist any temptation to wink. The power comes from the Office genuinely believing optimizing metrics is equivalent to improving lives. The residual-focused strategy in clause 3 might be the subtlest jab - highlighting how governments chase explanatory narratives over actual wellbeing.

  Testing the tone: "pre-fund charitable donations" sounds bureaucratic, while "trim menus of choice" echoes real "nudge" policies. Perfect. Final check - all five clauses weaponize real report features without exaggeration.
answer: |-
  1. The Calendar Optimization Unit will coordinate with national statistical agencies to administer the Cantril ladder instrument during periods of predictably elevated national sentiment (e.g., post-sporting victories, during major cultural festivals, and following targeted tax rebate distributions), ensuring the sampled population's recall reflects transient positive affect, while maintaining strict adherence to methodological protocols regarding sampling frame reachability.
  2. The Perceptual Calibration Directorate is established within the Ministry of Education to develop and disseminate aspirational benchmarks through revised curricula and public information campaigns, fostering a population-wide adjustment in the conception of the "best possible life" against which current standing is evaluated, thereby elevating ladder scores without necessitating material improvements in objective circumstances.
  3. The Residual Division, reporting directly to this Office, will prioritize interventions specifically targeting the explanatory factors (particularly those where our residual currently detracts most significantly, such as perceptions of corruption or generosity), accepting that improvements in these decomposition metrics may not translate into the headline average score but will enhance our comparative standing in the published explanatory tables relative to the hypothetical dystopia baseline.
  4. The Competitor Surveillance Desk is authorized to analyse the rolling three-year averages and ordinal rankings of peer nations, particularly noting instances where their single-year declines present strategic opportunities; interventions will be timed for implementation such that their impact registers in the subsequent reporting year, allowing us to publicly report rank gains even during periods of static or slightly declining domestic averages relative to a weakening comparator set.
  5. The Proxy Alignment Taskforce will implement Operation Generosity Shield, pre-funding a nominal charitable donation attributed to every registered household annually to ensure universal positive response on the 'given money' metric, and Operation Streamlined Choice, a systematic review and reduction of complex service options across public utilities and licensing to elevate reported satisfaction with freedom of choice by limiting the scope of decisions citizens must navigate.
