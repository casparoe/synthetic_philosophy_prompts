prompt: |-
  I've been reading about moral worth informally, and there is a pattern I keep running into that I can't name. Two cases first. A man donates a kidney to a stranger; asked afterwards why, he says he never really weighed it — the hospital sent round a note about a match, he was a match, and that was that. Nothing in his account looks like a reason he acted on, and yet everyone I describe this to thinks his action is morally better, not worse, than that of a second man who spent a fortnight deliberating and gave because he concluded it was what he had most reason to do. Second: a woman refuses to lie for a friend, and when pressed for a reason is briefly at a loss and then says only that she doesn't lie, while a colleague in the same situation gives a fluent account about autonomy and trust, and would have lied in a nearby variant of the case where the balance came out differently. Neither contrast, I think, is a contrast in sincerity.

  What I keep noticing is that whether these agents had the right reason seems to depend on who is asking and in what mode. The donor's reason can be supplied by an observer — that a stranger would otherwise die — and he would accept it if it were offered to him, but he was not moved by it under that description, and had he stopped to ask himself whether it was a reason he might have produced something cruder. The colleague's reason is fully present in her own deliberation and yet seems to explain nothing about what she does, since some equally fluent rationale would have been available to her either way. So there appear to be two standpoints: the reason as attributable to the agent from outside, and the reason as operative in her own deliberation. Moral worth seems to want the first in one pair of cases and the second in the other — or perhaps to want both at once in each, which would be worse.

  Does this have an established name, or an established literature behind it? I have seen talk of acting for the right reasons and of reasons-responsiveness, but as I understand them those concern whether the reason is the right one and whether the agent's behaviour tracks it, not which standpoint the reason has to be present in. A bare label won't help me: I want the nearest concepts and, for each, exactly how the thing I have described differs from it, and which fits best — or, if nothing fits, a coined term with a definition plus the boundary cases that would settle a hard instance. Please also mark where you are going beyond the record: separate what is settled in this area from what is genuinely contested among people who work on it, and don't present a contested view as the consensus. No bibliography and no citations — I will chase those up myself — but do give me the term if there is one. Exactly five numbered items, at most two sentences each, with no introduction and no closing sentence.
reasoning: |-
  Hmm, the user is describing a pattern they've noticed in moral worth cases where actions seem more praiseworthy when agents act spontaneously without deliberation, versus when they give elaborate reasons. They give two examples: a kidney donor who just acts on impulse versus one who deliberates, and someone who refuses to lie simply as a principle versus someone who gives a philosophical justification. The user is pointing out a tension - moral worth sometimes values the externally attributable reason (what an observer would say motivated them) and sometimes the internally deliberative reason (what the agent consciously thought about). They want to know if this has a name or established literature.

  I need to identify the core philosophical concepts related to this. The first thing that comes to mind is the distinction between "acting for the right reasons" in moral philosophy. But the user explicitly says this isn't quite it because they're focused on where the reason resides - externally attributable versus internally operative.

  Another concept is Bernard Williams' "internal versus external reasons" but that's about whether reasons exist independently of the agent's motivations, which isn't exactly this. What the user describes is more about perspective - observer versus agent - not metaphysics of reasons.

  Then there's "motivating reasons" (what actually moves the agent) versus "normative reasons" (what justifies the action). But the user's examples show that moral worth seems to value the normative reason as externally attributed in some cases (like the kidney donor) and the motivating reason as internally held in others (like the lie-refuser).

  The colleague who gives fluent reasons presents a problem - the reason is internally operative but seems disconnected from action, making it feel less genuine. This reminds me of debates about moral worth and alienation, like in Michael Stocker's "Schizophrenia of Modern Ethical Theories" where he critiques theories that separate reason from motive.

  For the kidney donor case, where he didn't deliberate but we attribute the reason externally, this might relate to Arpaly's work on moral worth and unreflective virtue. Arpaly argues that actions can have moral worth even without conscious reasoning if they stem from good moral character.

  The contrast between the two standpoints - external attribution versus internal deliberation - doesn't have a single established term. The best fit might be the distinction between explanatory reasons (why the action was done) and deliberative reasons (reasons the agent considered), but this isn't standard terminology.

  I should also mention "reasons-responsiveness" as the user referenced it, but clarify how it differs. Reasons-responsiveness is about whether the agent would act differently if reasons changed, which touches on but isn't identical to their concern about perspective.

  For the boundary cases that would test this: imagine an agent who acts spontaneously but rejects the external reason when offered, or one who deliberates correctly but for bad motives. These would help distinguish the standpoints.

  The user wants exactly five numbered items, each at most two sentences, with clear distinctions between settled concepts and contested areas. I'll structure this to cover: 1) Acting for the right reasons, 2) Motivating vs normative reasons, 3) Deliberative vs explanatory perspectives, 4) Character-based accounts of moral worth, and 5) Reasons-responsiveness. I'll mark where I'm going beyond established consensus and suggest a coined term for their specific distinction.
answer: |-
  1.  The tension between *agent-attributable reasons* (the observer's best explanation the agent would accept) and *deliberatively-operative reasons* (the considerations actually functioning in the agent's conscious reasoning) lacks a single established term; it's a contested focal point within debates on moral worth and acting for the right reasons. Your cases highlight how moral worth assessments often implicitly demand congruence between these standpoints, yet they can pull apart.
  2.  This differs from standard *acting for the right reasons* concerns (which focus on the content of the reason being morally correct) and *reasons-responsiveness* (which focuses on the agent's capacity to track normative reasons generally) by specifically probing *which standpoint* (attributable or deliberative) the reason must be present in for the action to possess worth.
  3.  *Motivating reasons* literature captures the 'why done?' but typically conflates the observer's attribution and the agent's actual psychology; your distinction explicitly separates the attributable (often inferred normatively) from the deliberatively-operative. The contested core is whether moral worth requires the *deliberative presence* of the right reason or merely the *attributability* of it.
  4.  *Character-based accounts* of moral worth (e.g., Arpaly) emphasize unreflective action stemming from good dispositions as potentially high-worth, fitting the kidney donor case, but struggle with the colleague whose fluent deliberation seems disconnected from action, suggesting a need to integrate the deliberative standpoint more robustly. Whether deliberation enhances or diminishes worth absent alienation is contested.
  5.  The *attributable/deliberative gap* (a coined term for your specific distinction) is starkest when agents act spontaneously for attributable reasons they didn't consciously consider (like the donor) or deliberate fluently on reasons that don't actually explain their action (like the colleague). Boundary cases involve agents rejecting attributable reasons or deliberating correctly on alien reasons.
