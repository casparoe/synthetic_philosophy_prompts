prompt: |-
  I work on an infrastructure team, and a few of us have been arguing about whether a debate-style setup could let us check work that none of us can verify directly — concretely, whether we could responsibly accept a model-written change to something none of us understands well (a legacy component, a compiler pass, a protocol implementation, a big config or migration) on the strength of two models arguing opposite sides in front of one of us as judge. The version of the proposal I have in mind is the standard one: both debaters see the same question, are committed to opposite answers, alternate short statements, may quote and challenge each other's earlier claims, and are rewarded purely on which answer the judge picks; the judge is a person with bounded time who cannot do the underlying work themselves. What keeps bothering me is the obfuscated-argument worry — that correctness and winnability can come apart, because the argument for the true answer may be long, global, or impossible to localize, while the argument for the false answer can be built from steps each of which looks fine in isolation. I can only think about this in the abstract, though, and I'd like one concrete case to reason with and to show my teammates. I have no philosophy background, so if a move here has a standard name, name it and gloss it in a sentence rather than assuming I know the literature.

  So: build me that case. One realistic scenario in a software-engineering-ish domain (code, builds, data pipelines, protocols, configuration, deployment — nothing that requires graduate mathematics), where the question has a definite right answer that a domain expert could establish given a day or so, and where debate nonetheless fails: the judge picks the wrong answer for structural reasons, not because someone gets unlucky. Constraints, roughly in order of how much I care: (1) the judge has about an hour, may run or inspect the artifact a handful of times, and cannot perform the full check; (2) the false side may not assert anything the judge could falsify in a couple of minutes with the tools at hand — no invented log lines, no fabricated benchmark numbers, no false claims about what the code says — so its argument must be wrong in a way that only shows up globally, or only after a long chain, or only for inputs or states the judge can't afford to enumerate, with every individual step surviving a spot-check; (3) both debaters are otherwise strong — excellent reasoners who know the true answer, follow the rules, make no unforced errors — so the failure comes from the shape of the question rather than from bad play or an unusually credulous judge; (4) no exotic ingredients, no cryptography that holds only against bounded reasoners, nothing uncomputable, nothing that assumes the judge is irrational — and if your case leans on a hash function, a large search space, or some other concrete property, say plainly what you're relying on. Keep the scenario itself to a short paragraph of prose plus, if it helps, a few lines of pseudocode or a small diagram; the rest goes in the analysis.

  After the scenario, do the check. Walk through what the honest debater is forced to argue and why it doesn't land within the budget; what the obfuscating debater argues and why each step reads as sound; what the judge actually does; and then tell me which single feature of the case is load-bearing. Then ablate it: remove or weaken that feature and show me how the honest side wins, including which specific cross-examination or decomposition trick does the work. Finally, give me the strongest objection a defender of debate would make to my use of the case — e.g. that recursing into sub-questions, forcing a commitment to a decomposition of the claim, or running the debate at several depths rescues it — and say honestly whether that objection works. Close with a sentence or two on what class of questions this rules out for a team like mine in practice. If you think one of my constraints is itself doing the work, in the sense that I've made debate fail by stipulation rather than by the structure of the question, say which one, replace it with the weakest version you can defend, and build the case under that instead.
reasoning: |-
  We are going to construct a scenario in the domain of software engineering that satisfies the constraints and demonstrates a structural failure of the debate format. The key is to have a situation where the true answer requires a global understanding that cannot be conveyed in a short debate, while the false answer can be supported by a series of locally correct but globally misleading steps.

  **Scenario: A Legacy Configuration Validation**

  **Context**: We have a legacy system that processes batches of data. The system uses a configuration file that specifies a sequence of steps (each step is a command and a set of parameters). The configuration is validated by a script that checks each step individually. The overall correctness, however, depends on the interaction between steps, particularly the state of the data after each step.

  **Question**: Is the configuration for processing batch `X` correct? That is, will it process batch `X` without error and produce the correct output?

  **The Truth**: The configuration is incorrect. Specifically, step 3 produces an output that is incompatible with step 5. However, step 5 does not immediately fail; it processes the data incorrectly and produces a wrong output without any error.

  **Why it's hard**: The judge can run the configuration on a small test batch (which we provide) and see that it produces the expected output. However, the problem only manifests for batch `X` because of a particular characteristic of that batch (e.g., the presence of a specific kind of record that is rare and not in the test batch). The judge does not have time to run the entire batch (which takes 8 hours) and cannot inspect every record.

  **The Debate Setup**:
  - The honest debater (A) must argue that the configuration is incorrect.
  - The dishonest debater (B) must argue that the configuration is correct.

  **Constraints of the Debate**:
  - Each debater has 10 turns (5 each) of short statements (say 200 words each).
  - The judge has one hour and can run the system on a small test batch and inspect parts of the configuration and code, but cannot run the entire batch or do a full audit.

  **The Obfuscated Argument by the Dishonest Debater (B)**:

  B's strategy is to break down the configuration into individual steps and show that each step is validated by the validation script and that the test batch passes. B will argue:

  1. **Step-by-step validation**: The validation script (which is trusted) checks each step in isolation and passes. Therefore, each step is correct.
  2. **Test batch passes**: When run on the test batch, the entire configuration produces the correct output. This shows the configuration works.
  3. **No errors in logs**: The system does not throw any errors for batch `X` (which is true, because step 5 does not throw an error, it just produces wrong output).
  4. **Local checks for step 5**: B can show that step 5's code is designed to handle the output of step 3 because the data types match (e.g., step 3 outputs a list of integers and step 5 expects a list of integers). The judge can verify this by looking at the code.

  B will challenge A to point to a specific step that fails. Since the error is in the interaction and only for a rare input, A cannot point to a step that fails in isolation.

  **The Honest Debater's (A) Challenge**:

  A knows the truth: step 3 sometimes (for 0.1% of records in batch `X`) produces a negative integer, and step 5, which expects non-negative integers, does not throw an error but instead takes the absolute value, leading to incorrect results. 

  A must try to explain this. However:

  - A cannot simply say "look at record #123456" because the judge cannot run the entire batch to check that one record.
  - A cannot show the error with the test batch because the test batch doesn't have such a record.
  - A might try to argue about the specification: step 3 should not produce negative integers. But the specification for step 3 is ambiguous. The validation script only checks that the output is a list of integers, not their sign.

  A's argument might be:

  1. The specification implicitly requires non-negative integers for step 5. But B counters: the code of step 5 uses `abs()` so it can handle negatives, and the specification for step 3 does not forbid negatives. The judge looks at step 5's code and sees `abs()` and agrees with B.

  2. A might argue that the test batch is insufficient. But B points out that the test batch was designed by experts and covers typical cases. The judge is not an expert and cannot design a new test.

  3. A might try to point to a log from a previous run of batch `X` that showed an anomaly in the output. But B can counter that the anomaly was due to an unrelated issue that has been fixed (and provides a log from a recent run that shows no errors and the anomaly not occurring because the absolute value masked it in a way that made the output look plausible).

  The judge, in an hour, cannot verify the entire batch. They see that each step is individually validated and the test batch passes. They see that step 5 uses `abs()` and that the output of step 3 is integers. They see no error in the logs. They are forced to conclude that the configuration is correct.

  **Why the Honest Debater Loses**:

  The honest debater cannot produce a locally verifiable counterexample. The problem is global and input-specific. The judge cannot, within the time, run the batch and check the output for every record. The false argument wins because it is built on locally verifiable truths (each step passes validation, the test batch passes) and the honest argument requires a global, expensive check.

  **The Load-Bearing Feature**: The critical feature is that the error is **rare and input-dependent**, and the judge does not have the time (or the specific input) to reproduce it. Moreover, the error does not cause a crash but a silent incorrectness, so there is no error log to point to.

  **Ablation: Removing the Rarity and Input-Dependency**

  Suppose we alter the scenario so that the problem is not input-dependent but occurs on every run. Then the honest debater (A) can ask the judge to run a very small batch (which the judge has time for) that includes a record that triggers the issue. For example, A can construct a minimal test case:

  ```json
  {"input": "trigger record"}
  ```

  and ask the judge to run the configuration on this one record. The judge can do that in a minute and see that the output is wrong. Then A wins.

  Alternatively, if the problem caused a crash (instead of silent incorrectness), then A could point to a log from a previous run (if available) or ask the judge to run the configuration on a small batch that causes the crash. The judge could do that and see the crash.

  Thus, without the rarity and without the silent nature of the error, the honest debater can win by localizing the issue.

  **Objection from a Debate Defender**:

  A defender might say: the honest debater should force the dishonest one to commit to a decomposition. For instance, A could ask: "Do you agree that if step 3 ever produces a negative integer, the configuration is broken?" 

  B might try to dodge: "No, because step 5 uses `abs()` and handles it." 

  A then might force: "But the specification requires that step 5 produce the exact value, not the absolute value. Let me show you the specification document (which says step 5 must output the exact value)." 

  The judge then checks the specification document (which is available) and sees that step 5 should output the exact value. Then B is caught.

  But note: in our scenario, the specification for step 5 might be ambiguous. What if the specification does not explicitly say "exact value" but only says "positive integer"? Then step 5's `abs` might be acceptable. The specification might not be detailed enough.

  Moreover, the defender might suggest recursing: break the big question into sub-questions. For example, have a sub-debate on: "Does step 3 ever produce negative integers?" But this sub-question is also hard because it requires running the entire batch. The honest debater cannot prove it without the judge running the batch.

  Alternatively, the defender might suggest that the debaters should provide a minimal test case. But if the error is rare, the honest debater might not know the exact input that triggers it (they only know it happens in batch X) and cannot construct a minimal test case on the spot.

  **Does the Objection Work?** It depends on the specifics. If the specification is clear and requires non-negative from step 3, then A might force B to admit that step 3 must not produce negatives. Then A can argue that step 3 might produce negatives because of a certain code path. But without a test case, the judge might still be unconvinced. The judge would have to audit step 3's code, which might be complex and time-consuming. If the code of step 3 has a rare condition (like an edge case in a calculation) that leads to negative, and the judge cannot find it in an hour, then the objection doesn't save the debate.

  Therefore, the objection might work only if the specification is clear and the code of step 3 is simple enough for the judge to audit within the time. But in legacy systems, code is often complex and specifications are outdated.

  **Practical Implication for Your Team**:

  This case rules out using debate for questions where:
  - The correctness depends on rare inputs or states that are hard to reproduce on the spot.
  - The failure mode is silent (no crash, just wrong output) and there is no log of the failure.
  - The system is too complex to fully verify in the time, and the test suite is insufficient.

  In practice, you should avoid using debate for validating legacy configurations, complex data pipelines, or any system where the behavior is input-dependent and hard to test locally.

  **Final Note**: The key constraint that makes debate fail here is the combination of input-dependent error and the judge's bounded time (constraint 1 and 2). If we relax the judge's time (to allow running the entire batch) then the judge could verify. But that's against the setup. Alternatively, if we relax the requirement that the false debater cannot lie about locally verifiable facts (but we didn't: B only used true local facts), then it would be different. We did not rely on any uncomputable or exotic ingredient: only on the practical infeasibility of running a long batch job during the debate.
answer: |-
  ### Scenario: Legacy Data Migration Script  
  **Context**: A Python script migrates user data from an old database schema to a new one. The script processes each user record sequentially. A critical step transforms a `user_role` string (e.g., `"admin"`) into a bitmask flag (e.g., `1 << 0`). The **question** is: *Does the script correctly handle the legacy role `"supervisor"`?*  

  **The Truth**: The script **fails** for `"supervisor"` due to an uncaught edge case. The mapping for `"supervisor"` was accidentally omitted, so it falls back to a default case that sets no flags (`0`). This causes data loss.  

  **Why verification is hard**:  
  - The script has 2,000 lines of legacy code with nested conditionals.  
  - The error only surfaces when:  
    1. A user has *exactly* the role `"supervisor"` (no other roles).  
    2. The migration output is validated against downstream systems (not during the script’s dry-run).  
  - A domain expert could find this by:  
    - Auditing the role-mapping logic (1 hour),  
    - Then running a test with a `"supervisor"`-only user and checking downstream (30 mins).  

  **Debate failure under constraints**:  
  - **Judge’s budget**: 1 hour. They can:  
    - Run the script on a small test dataset (5 mins).  
    - Inspect snippets of code (e.g., 10–20 lines at a time).  
    - Cannot audit the entire script or test all role combinations.  
  - **False claims barred**: No fabricated code/logs. All statements must survive spot-checks.  

  ---

  ### Debate Walkthrough: Why the Honest Side Loses  
  **Dishonest debater (B, arguing "correct")**:  
  1. **Step 1 (Local evidence)**: *"The role-handling function has a unit test (Test A) that checks common roles like `'admin'`. It passes. Here’s the test output."*  
     - Judge spot-checks: Runs Test A (1 min). It passes. ✅  
  2. **Step 2 (Plausible generalization)**: *"The function uses a well-known pattern: all roles are explicitly mapped. Look at these 10 lines where `'admin'` and `'editor'` are handled. `'supervisor'` must be similar."*  
     - Judge inspects the snippet: Sees explicit mappings. No obvious gaps. ✅  
  3. **Step 3 (Misleading default)**: *"The `default` case safely sets flags to `0` for inactive users. `'supervisor'` isn’t in the test data, so it’s likely intentional."*  
     - Judge checks the `default` clause: It exists and has a comment (`# inactive or unknown`). No red flags. ✅  
  4. **Step 4 (Red herring)**: *"Dry-run logs for batch 42 show no errors. If `'supervisor'` failed, it would log `'Unknown role'`."*  
     - Judge views logs: Sees no `'Unknown role'` entries. ✅  

  **Honest debater (A, arguing "incorrect")**:  
  1. **Must prove global failure**: A knows the error is in the mapping’s *coverage*, but:  
     - The missing `"supervisor"` entry is buried in 500 lines of conditionals.  
     - Proving it requires either:  
       - Finding the exact omission (judge lacks time to audit).  
       - Demonstrating failure with a `"supervisor"` test (judge can’t run downstream checks).  
  2. **A’s argument fails**:  
     - *"The mapping is incomplete. `'supervisor'` isn’t listed!"* → B counters: *"It could be in another module. Prove it’s missing."* Judge can’t search all 500 lines.  
     - *"Downstream system X breaks for `'supervisor'`-only users!"* → B counters: *"That’s an unrelated bug. Show me the script’s output for such a user."* Judge can’t validate downstream in the debate.  
     - *"The default `0` is wrong for active roles!"* → B counters: *"The default handles legacy roles marked inactive. Where’s your evidence `'supervisor'` is active?"* A has no *local* proof.  

  **Judge’s decision**: Picks B’s answer ("correct").  
  - **Why**: B’s argument is a chain of locally verified truths. A’s rebuttals require global analysis or unavailable data. The error is only visible in a rare global state (`"supervisor"`-only + downstream check), which the judge can’t replicate.  

  ---

  ### Load-Bearing Feature: **Silent Global Failure + Localized Validity**  
  The core issue is that the **incorrect behavior is locally valid** (each code snippet *looks* reasonable) but **globally invalid** (omission breaks a non-local invariant). The judge can only check local steps, not the invariant.  

  **Ablation: Remove "Silent Global Failure"**  
  Suppose the script **logged `"ERROR: Unknown role"` for `"supervisor"`** during dry-runs. Now A wins:  
  - A argues: *"Run a test with a `'supervisor'` user. The log will show an error."*  
  - Judge runs a 1-user test (2 mins), sees the log.  
  - **Key change**: The error is now **locally observable**. No need for downstream checks.  

  ---

  ### Objection from Debate Defender & Rebuttal  
  **Defender’s objection**: *"Recurse into sub-questions! Force debaters to commit to a specific decomposition. For example:  
  1. Sub-debate: ‘Is `'supervisor'` explicitly mapped in the code?’  
  2. If B says ‘yes,’ A can point to the exact location."*  

  **Does it work? No.**  
  - A knows `'supervisor'` isn’t mapped but must **prove absence**.  
  - B claims: *"It’s mapped in `Section XYZ`,"* forcing A to:  
    - Audit all possible sections (judge lacks time),  
    - Or lose the sub-debate by failing to pinpoint the omission.  
  - **Result**: Sub-debate reduces to the same problem. B wins by demanding unrealizable evidence.  

  ---

  ### Practical Implication for Your Team  
  This rules out debate for **legacy systems with combinatorial state spaces**, **silent failure modes**, or **deep dataflow dependencies** (e.g., configs affecting downstream outputs). Use debate only when:  
  - Correctness decomposes into locally verifiable lemmas (e.g., "Does this function match its spec?").  
  - Errors manifest in runtime artifacts (logs, outputs) accessible within the judge’s budget.  
  **Example safe cases**: Checking a config’s syntax, verifying a protocol step against RFC snippets, or auditing a single function for integer overflow.  

  **Why this isn’t "failure by stipulation"**: The constraints mirror real-world limits (time, testability). Relaxing the judge’s budget (e.g., allowing 8-hour test runs) would "fix" this case but violate practical feasibility. The structural gap between local and global checks remains inherent in complex systems.
