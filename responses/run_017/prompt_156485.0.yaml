prompt: |-
  we keep having this argument in my forecasting reading group (very rationalist-adjacent, you can guess the vibe) and one guy ends it every time with "bayesians can't agree to disagree". he used it most recently to claim: if two calibrated superforecasters on the same question have swapped numbers five or six times and are still 20 points apart, then either someone is being irrational or someone is sitting on private evidence they wont share. i think that's doing way more work than the theorem actually does, but i cant say where exactly it overreaches, and whenever i push back he just restates the slogan louder.

  so: lay out the menu of precise claims that one-liner could be expressing, from the near-tautological reading (something about a common prior plus common knowledge of posteriors) up through the genuinely wild ones (that a difference in priors is itself a species of irrationality, or that rational agents can't disagree about anything decision-relevant). for each, say whether it's trivial, whether it's substantive and defensible, or whether it's just false — and, the part i actually need — which readings would really get him his conclusion about those two forecasters, and what extra premise each of those readings needs that he hasn't stated (and probably doesn't know he's relying on). also tell me which reading people usually mean when they say it, because i dont think he means the same thing twice.

  here are the cases i think break it; for each, tell me which readings it kills and which survive:

  1. they stop after six rounds. neither ever said anything about knowing the other's number, and each privately thinks the other is probably miscalibrated on this class of question.
  2. they openly dont share a prior. one thinks base rates on "unprecedented" events are basically uninformative, the other thinks you can always dig up a reference class. both know this about each other and neither budges.
  3. what they disagree about isn't really an event: one says 0.08 that "the system would have been safe if we'd shipped it in march", the other says 0.3, and nothing will ever resolve it.
  4. my own bugbear, made up by our group so there's no literature to recite: trust-weighted updating. each discounts the other's reported number by a private "how much do i trust her on this kind of question" factor, both know theyre doing it, and the factors differ, and the factors themselves get updated on the observed disagreement. does the slogan have anything to say here at all, or is it simply out of scope because the updating rule isn't bayesian?

  be explicit about how confident you are in each verdict, and single out the one claim you're least sure of.
reasoning: |-
  Hmm, the user is in a forecasting reading group with a recurring argument about the "Bayesians can't agree to disagree" slogan. One member uses it to claim that if two calibrated superforecasters persistently disagree by 20 points after multiple exchanges, either someone is irrational or hiding private evidence. The user thinks this overreaches but can't pinpoint why, and wants help dissecting the slogan's precise meanings and which interpretations support the conclusion.

  The user presents four test cases to challenge the slogan:
  1. Forecasters stop after six rounds without common knowledge of each other's estimates, each privately doubting the other's calibration.
  2. They openly have different priors regarding base rates on unprecedented events.
  3. Their disagreement is about a counterfactual event that will never resolve.
  4. They use trust-weighted updating with private trust factors that update on disagreements.

  I need to unpack the different possible interpretations of "Bayesians can't agree to disagree" – from the strict Aumann interpretation (common prior + common knowledge of posteriors) to more expansive claims (like differences in priors implying irrationality). For each interpretation, I'll assess whether it's trivial, defensible, or false, and what additional premises would be needed to support the user's friend's conclusion about the superforecasters.

  For the Aumann interpretation:
  - It's substantive but narrow – it requires both common prior and common knowledge of posteriors.
  - The forecaster scenario likely violates both conditions, so this interpretation doesn't support the friend's claim without adding premises about common knowledge or calibration.

  For stronger interpretations claiming rational agents can't have differing priors or must share all evidence:
  - These are generally false – rational agents can reasonably disagree due to differing prior information or interpretations.
  - They would require implausible premises like "rationality demands identical priors" which isn't tenable.

  For the trust-weighted updating case:
  - This falls outside standard Bayesian updating, so the slogan doesn't directly apply.
  - The persistent disagreement here stems from differing trust factors rather than irrationality or hidden evidence.

  The friend seems to be conflating multiple interpretations while ignoring the core requirements of the theorem. Their conclusion about the forecasters would only hold under the strict Aumann interpretation if we assume common knowledge of posteriors and calibration – but these assumptions are questionable in real forecasting scenarios. Cases 1-4 all break different interpretations of the slogan, showing how real-world disagreements often stem from legitimate differences rather than irrationality.

  I'll structure this analysis clearly for the user, highlighting which interpretations survive each test case and what unstated premises their friend relies on. The trust-weighted updating case is particularly interesting as it exposes the limitations of applying the slogan beyond standard Bayesian frameworks.
answer: |-
  Here's a breakdown of "Bayesians can't agree to disagree," its interpretations, and how they fare against your scenarios. Your friend is likely conflating interpretations and smuggling in unstated premises. The core theorem (Aumann's Agreement Theorem) is narrow, but its sloganized version is often stretched beyond recognition.

  ### The Menu of Interpretations (From Tautological to Wild)
  1.  **The Narrow Aumann Reading (Tautological for its assumptions):**
      *   **Claim:** If two rational Bayesian agents share a *common prior* and their posteriors over an event are *common knowledge* (CK), then their posteriors must be equal. Disagreement under CK + common prior implies irrationality or non-Bayesian updating.
      *   **Status:** Substantive and *mathematically true* within its strict assumptions.
      *   **Gets him his conclusion?** Only if *all* the theorem's assumptions hold. It requires:
          *   **Common Prior:** They started with the same fundamental probability model.
          *   **Common Knowledge of Posteriors:** Not only do they know each other's current estimate, but they know that they know, and they know that they know that they know, ad infinitum. This is incredibly strong.
          *   **Bayesian Updating:** They update strictly via Bayes' rule on shared or mutually understood evidence.
      *   **Unstated Premise Needed:** That the superforecasters *actually* share a common prior and that their estimates *actually* became common knowledge after swapping numbers 5-6 times. This is almost never true in practice.

  2.  **The "CK of Disagreement Implies Something's Wrong" Reading:**
      *   **Claim:** If two rational agents have *common knowledge* that they disagree (without necessarily assuming a common prior *or* CK of posteriors upfront, but disagreement itself becomes CK), then *either* they didn't share a common prior *or* someone is irrational (e.g., not updating correctly, not sharing evidence).
      *   **Status:** Defensible *if* "common knowledge of disagreement" is established. This is a weaker (but still strong) assumption than CK of posteriors. CK of disagreement *can* emerge from repeated public exchanges like swapping numbers.
      *   **Gets him his conclusion?** Closer. If swapping numbers 5-6 times genuinely established CK of their persistent 20-point disagreement, then the theorem *says* that under a common prior, this disagreement is impossible for rational Bayesians. So the disjunction holds: either no common prior *or* irrationality (which includes hiding evidence, as that's non-Bayesian updating).
      *   **Unstated Premise Needed:** That swapping numbers 5-6 times *sufficiently established Common Knowledge of their persistent disagreement*. This is plausible but non-trivial. Also relies on them being rational Bayesians otherwise.

  3.  **The "Rational Agents Must Share Evidence/Update Fully" Reading:**
      *   **Claim:** Truly rational Bayesian agents, upon learning of each other's differing estimates, *must* treat the other's estimate as evidence and fully incorporate it via Bayes' rule until agreement is reached. Persistent disagreement implies either irrationality (failure to update correctly) or failure to share *all* relevant evidence/interpretation.
      *   **Status:** This is a *substantive extension* beyond Aumann. Aumann requires CK, not just learning the estimate. This interpretation essentially assumes that learning the other's estimate *automatically* provides all necessary information to force convergence *if* priors are common and updating is perfect. It often smuggles in CK.
      *   **Gets him his conclusion?** Directly. This is likely the version your friend *thinks* he's using. Persistent disagreement after multiple exchanges *must* imply irrational updating or hidden evidence.
      *   **Unstated Premise Needed:** That learning the other's numerical estimate *is sufficient information* for a rational Bayesian (with a common prior) to fully determine how to update their own belief *as if they knew the reasoning/evidence behind it*. This is **false**. A number alone, without knowing *why* the other agent holds that belief, is generally *not* sufficient evidence for Bayesian updating. You need a likelihood model for *how* they generated that estimate.

  4.  **The "Difference in Priors is Irrationality" Reading:**
      *   **Claim:** Any persistent disagreement ultimately stems from differing priors, and differing priors themselves constitute irrationality or epistemic failure. Truly rational agents would have converged on the same prior.
      *   **Status:** **False and philosophically dubious.** Rational agents can have legitimately different priors based on genuinely different background knowledge, life experiences, or interpretations of foundational concepts. Demanding identical priors eliminates individuality and the value of diverse perspectives. This view often confuses "rational" with "objectively correct."
      *   **Gets him his conclusion?** Yes, but only by definitionally labeling the cause of disagreement (differing priors) as irrationality. It's circular and unhelpful.
      *   **Unstated Premise Needed:** A highly controversial and generally rejected epistemic principle that rationality demands unique, objectively correct priors for all agents.

  5.  **The "No Disagreement on Decision-Relevant Beliefs" Reading:**
      *   **Claim:** Truly rational Bayesian agents *cannot* disagree on any belief relevant to a decision they face together (assuming common goals).
      *   **Status:** **False.** Even with common priors and goals, rational agents can disagree on *interpretations* of ambiguous evidence, the *weight* to assign different pieces of evidence, or the *relevance* of different reference classes. This disagreement can persist without irrationality or hidden evidence.
      *   **Unstated Premise Needed:** That all decision-relevant beliefs are unambiguously determined by shared evidence and common priors via Bayes' rule, leaving no room for rational interpretive differences. Reality is messier.

  **Which reading do people usually mean?** #3 ("Rational Agents Must Share Evidence/Update Fully"). It sounds powerful and intuitive ("if you're rational, hearing my number should make you agree with me!") but fundamentally misapplies Aumann by ignoring the critical role of CK and the insufficiency of just a number for updating.

  ---

  ### Analysis of Your Test Cases

  1.  **No Common Knowledge, Private Doubts about Calibration:**
      *   **Kills:** #3, #5. This case directly violates the CK assumption (#1, #2) and shows why #3 is wrong. They *learn* each other's number, but lack CK of the estimates and crucially, *lack a shared model of each other's rationality/reliability*. Their private doubts ("other is probably miscalibrated") mean they *rationally* discount the other's number significantly. They treat the other's estimate as *weak* or *misleading* evidence, not decisive evidence demanding full Bayesian incorporation. This is rational behavior.
      *   **Survives:** #1 (trivially, as its assumptions are false), #4 (if you consider differing calibration priors "irrationality", but that's the dubious view).
      *   **Verdict:** **High Confidence.** This case perfectly illustrates why #3 is an overreach. Learning a number ≠ CK ≠ sufficient evidence for convergence.

  2.  **Openly Different Priors (Base Rates):**
      *   **Kills:** #1, #2, #3, #4 (if #4 means differing priors *are* irrational), #5. This is the canonical counterexample. They are transparent about the *source* of their disagreement (fundamentally different approaches to priors for this class). Both positions can be rationally defensible. Aumann (#1, #2) explicitly allows disagreement if priors differ. #3 fails because they *are* sharing their reasoning, but the evidence (their number + reasoning) doesn't resolve the *foundational philosophical difference*.
      *   **Survives:** Only a very weak reading of #2 might say "CK of disagreement implies the disjunction holds" - yes, here the disjunction is satisfied: they *don't* share a common prior. But that's not evidence of irrationality.
      *   **Verdict:** **Very High Confidence.** This is the standard refutation of the stronger interpretations of the slogan.

  3.  **Unresolvable Counterfactual:**
      *   **Kills:** #1, #2, #3, #5. Aumann requires the event's probability to be well-defined *and potentially resolvable* (implicitly, for CK to have meaning about future agreement). For an unresolvable counterfactual, there is no "truth" to converge towards, even in principle. Probabilities here are expressions of subjective belief, not estimates of an observable frequency. Rational agents can hold different subjective beliefs indefinitely without needing to converge. #3 fails spectacularly – no amount of updating on shared evidence (since no new evidence about the counterfactual is possible) can force convergence.
      *   **Survives:** None of the substantive claims. #4 might label it irrational, but that's uncharitable.
      *   **Verdict:** **High Confidence.** The theorem fundamentally assumes probabilities over events that can be resolved/observed.

  4.  **Trust-Weighted Updating:**
      *   **Scope:** This is **out of scope** for the standard Aumann theorem and the slogan, which assume vanilla Bayesian updating. Trust-weighted updating is a *different* (and often very rational) updating procedure.
      *   **What the slogan says:** Nothing directly. However, proponents of the strong interpretations (#3, #5) would likely claim this *is* irrational because it's not "pure" Bayesian updating on the other's estimate *as direct evidence about the event*. They might argue trust factors *should* be incorporated into a giant Bayesian model (making trust part of the prior/likelihood), but this is computationally infeasible and misses the point of heuristic trust models.
      *   **Reality:** Trust-weighted updating is a highly rational response to the *insufficiency* of just hearing a number. Their differing private trust factors *are* part of their priors (over each other's reliability). Updating the trust factors *based on disagreement* is a rational way to handle the ambiguity. Persistent disagreement here stems from rationally differing initial trust and/or differing interpretations of the disagreement as evidence about trustworthiness.
      *   **Verdict:** **High Confidence** that it's out of scope. **Moderate Confidence** that it's a rational alternative demonstrating the limitations of the slogan's strong interpretations. It highlights that the other's estimate is evidence *about their reliability/model* as much as (or more than) evidence *about the event itself*.

  ---

  ### Verdict on the Superforecaster Claim & Least Confident Claim
  *   **Your friend's conclusion:** Only holds under Interpretation #3 ("Rational Agents Must Share Evidence/Update Fully") and *only* with the **unstated premise that hearing each other's numerical estimate multiple times provides sufficient information for full Bayesian convergence *if* they shared a common prior and were rational otherwise.** This premise is **false**. A number alone is insufficient evidence. It *also* requires the unstated premise that they *do* share a common prior, which is often false for complex questions where reasonable priors differ.
  *   **Realistic reasons for persistent disagreement:** Differing priors (rational), differing interpretations of shared evidence (rational), differing models of each other's reliability (rational), computational limitations (rational approximation), genuinely ambiguous evidence.
  *   **Least Confident Claim:** My verdict on **Case 4 (Trust-Weighted Updating) being "out of scope" or rational.** While I'm confident it breaks the strong interpretations, formalizing trust-weighted updating within a *generalized* Bayesian framework (where trust is a hidden variable in a model of the other forecaster) is possible. Extreme proponents might argue this is the "correct" Bayesian way, making Case 4 a case of differing priors/likelihoods on the meta-model. However, I remain confident that in practice, the slogan (#3) is misapplied here, and trust-weighting is a rational response to the limitations the slogan ignores. This is the edge where theory meets messy reality.

  **In short:** Your friend is wielding Interpretation #3 like a hammer. It sounds profound but rests on the false premise that a number is sufficient evidence for convergence. Your test cases (especially 1, 2, and 4) expose this flaw by showing legitimate, rational reasons for persistent disagreement rooted in differing priors, differing reliability assessments, or different updating heuristics necessitated by ambiguity. The core Aumann theorem (#1) is correct but requires assumptions (Common Prior, CK) almost never perfectly met in real forecasting disputes. Tell him to state the assumptions explicitly next time.
