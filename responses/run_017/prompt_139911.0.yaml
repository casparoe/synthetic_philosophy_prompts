  For the Fitch proof to work, the distribution and factivity must hold under the possibility operator. But for belief, even if "truly believes (p & q)" implies "truly believes p and truly believes q," the factivity—that the beliefs are true—isn't necessary in the same way. In the possible world where someone truly believes q & ~O(q), distributing gives truly believes q and truly believes ~O(q). But ~O(q) is about actual unbelief, not belief in that world. So when you apply factivity, you get ~O(q) is true in that world, but O(q) refers to belief in that world? The indexicals get messy. 

  Ah, that's the issue! The operator "truly believes" involves an implicit indexical. "Someone truly believes that p" is about the actual believer. But in the possible world scenario, when we say "possibly someone truly believes that q & ~O(q)", the ~O(q) refers to the actual world's lack of belief. But in the possible world, that belief is about actual unbelief, which might be different. So applying factivity in that world would give that ~O(q) is true in that world, but O(q) in the subformula refers to actual O, not the operator in that world. The quantifiers and modalities are clashing here. 

  For knowledge, the operator is more rigid. Knowledge implies truth in all worlds, but belief is world-relative. So in the generalized proof, when we move to a possible world, the operator "truly believes" might not maintain the necessary factivity because the truth condition is tied to the actual world, not the possible one. Let me clarify.

