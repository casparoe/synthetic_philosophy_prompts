answer: |-
  Your background in geochemistry brings a refreshingly precise lens to moral philosophy – especially the crucial question of whether boundaries are "real" or instrumental "cutoffs." The institutional treatment of heroism you describe is indeed puzzling. Let's break down your questions using the framework of supererogation (acts *beyond* duty) and its surrounding concepts:

  1.  **The Duty/Supererogation Line: Phase Boundary or Bookkeeping Cutoff?**
      *   **Likely Both, Leaning Instrumental:** This line is primarily a **practical and motivational cutoff**, not a fundamental "joint" in moral reality. Nature (or morality itself) doesn't dictate a single, precise point where duty ends and supererogation begins. Several factors "fix" its perceived location:
          *   **Role & Consent:** This is paramount. The soldier *consented* to a role with defined, extreme duties when they enlisted. The lifeguard accepted a *contractual* or *professional* duty to rescue. The sunbather accepted no such role-based obligation. The soldier crossing the field under orders is fulfilling the *core duty* of their role. Volunteering for an *extraordinarily dangerous* mission beyond the expected scope of their orders moves into supererogation.
          *   **Cost/Benefit:** While not the sole factor, extreme personal cost (especially risk of death/serious injury) for a significant benefit to others is a hallmark of what we *label* supererogatory. The act must be *significantly* costly *and* beneficial beyond a baseline expectation. A soldier volunteering for a near-suicidal mission meets this; doing minor paperwork extra fast doesn't.
          *   **Reasonable Expectation:** What can society reasonably demand? We demand soldiers follow lawful orders. We demand lifeguards attempt rescues within their capacity and training. We *cannot* reasonably demand every sunbather risk their life for a stranger, though we might *hope* they would.
          *   **The Bystander Effect & "What I Owe":** You've hit a key point. The "Good Samaritan" laws you mention (common in Europe) *shift the duty line* based on capacity and minimal cost. If helping carries *minimal risk or cost* (calling emergency services, throwing a life ring), the law (and arguably morality) increasingly says you *have a duty* to act. As the *number* of capable bystanders increases, the *moral pressure* on any *individual* might decrease *psychologically* (diffusion of responsibility), but the *objective duty to act* if one is *best placed* or if *no one else is acting* arguably remains or is even heightened by the collective inaction. Supererogation kicks in when the *cost* to *me* becomes *significant*, regardless of others. My *duty* might be to call 911. Swimming into a riptide remains supererogatory, even if I'm the only one on the beach. The "crowd" affects the *likelihood* of *someone* acting, but not necessarily the *category* of the act for the individual who *does* act beyond minimal duty.

  2.  **Genuine Category or Deflated Incentive?**
      *   **Both Views Have Merit, But Genuine Category is Plausible:** The "deflationary" view (praise as incentive where compulsion fails) captures an important *functional* aspect of institutional practices like medals. It's efficient to incentivize extreme, costly actions we value but cannot mandate.
      *   **However, the "Genuine Third Category" view better explains core features:**
          *   **The "No-Credit-Transfer" Rule:** If supererogation were *just* an incentive, "banking credit" wouldn't be logically incoherent (like frequent flier miles for virtue). But we intuitively feel a heroic act doesn't *earn* the right to be vicious later. This aligns with seeing supererogatory acts as *freely given gifts*, not transactions. Their moral value is intrinsic to the act and context, not fungible currency. A deflationary view struggles with why we wouldn't allow "credit" if it incentivizes *more* heroism.
          *   **The Phenomenology:** We *experience* admiration for supererogatory acts differently from mere duty-fulfillment or even efficient incentive responses. We see them as expressing exceptional character (courage, compassion) in a way that simply doing one's job (or responding predictably to incentives) does not.
          *   **Permissibility:** The deflationary view struggles to explain why failing to perform a supererogatory act is *permissible*, not just unpunished. If it's *only* about incentivizing desirable behavior where compulsion fails, why isn't failing to do it *blameworthy* (just hard to punish)? The genuine category view cleanly explains this: it's *beyond* what is owed, so not doing it is neutral.

  3.  **The Asymmetry (No Negative Counterpart - Suberogation):**
      *   **A Principled Gap (Mostly):** The lack of a formally recognized symmetrical "nasty-but-permitted" category (sometimes called *suberogation*) is largely principled within the standard framework:
          *   **The Primacy of Rights:** Liberal moral and legal systems prioritize negative rights (freedom *from* interference) over positive duties (duties *to* aid). Not visiting your mother or letting a friendship fade exercises your rightful autonomy, even if it's callous. We may *disapprove* morally, but we generally don't believe others have a *right* to demand our time or emotional labor beyond core duties (e.g., contractual obligations, parental duties to minors).
          *   **Enforceability & Slippery Slopes:** Legally or institutionally punishing "permissible nastiness" is incredibly problematic. Defining it clearly is difficult, enforcement would be intrusive, and it risks punishing mere difference, introversion, or justified boundaries. The "mildly disappointing" category absorbs this.
          *   **Moral vs. Institutional:** *Morally*, we *do* recognize this category informally – we call people "jerk," "selfish," "cold," or "ungrateful" for acts within their rights but lacking basic decency or minimal beneficence. *Institutionally* (legal systems, formal awards), we largely avoid codifying it for the reasons above. The asymmetry reflects the priority given to liberty over enforced beneficence beyond core duties. The "gap" is where moral disapprobation exists without institutional sanction.

  4.  **Ditching the Binary for a Continuous Scale?**
      *   **Something Would Be Lost, But Not Everything:** The concept of supererogation *does* conceptually depend on there being a "ceiling" of duty, with praiseworthy acts existing *above* it.
          *   **What Depends on the Cliff?** The *permissibility* of inaction. On a pure continuum, every act of non-help could be seen as *some* degree of failing, making the distinction between "fulfilled obligation" (no blame) and "failed supererogation" (also no blame) blurry. The "cliff" marks the point where blame/permissibility fundamentally shifts. The "no-credit-transfer" rule also relies on seeing the supererogatory act as genuinely *extra*.
          *   **What Could Survive?** We could still have a continuous scale of *praiseworthiness*. We already intuitively rank heroic acts ("that was brave" vs. "that was unbelievably heroic"). We could assign "merit scores." Awards could have different levels (Bronze Star, Silver Star, Medal of Honor).
          *   **What Would Change?** The sharp conceptual distinction between the *mandatory* and the *optional-but-admirable* would dissolve. Our language and institutional practices (like the specific phrase "above and beyond the call of duty") are built around recognizing that cliff. Removing it might make moral evaluation more nuanced but potentially less clear for guiding expectations and distributing specific forms of recognition (like medals *defined* by exceeding duty).
          *   **Different Theories:** Consequentialists might be more comfortable with a continuum (maximizing good outcomes). Deontologists and virtue ethicists are more likely to see a distinct category defined by exceeding strict duties or exhibiting exceptional virtue beyond the norm.

  **Synthesis:**

  The institutional apparatus of heroism you describe presupposes a picture of duty that is primarily **role-based and consent-driven**, bounded by **reasonable expectations** and **minimal demands of beneficence** (increasingly codified in things like Good Samaritan laws). The line between duty and supererogation is a **practical and motivational cutoff**, heavily influenced by **cost, benefit, and role**, not a fundamental moral joint. While praise functions as an incentive, supererogation is treated as a **genuine third category** of morally significant action (permissible omission, intrinsic praiseworthiness, no credit transfer) because that better captures our moral experience and intuitions. The asymmetry (no formal negative counterpart) is **principled**, reflecting the priority of liberty and the dangers of enforcing "niceness," though informal moral disapprobation fills that space. While a continuous merit scale could capture degrees of praiseworthiness, it would obscure the crucial conceptual and practical distinction between what we *require* and what we *admire* but cannot demand.

  Your geochemical analogy is apt: the duty/supererogation line is less a phase boundary inherent in moral reality and more a critically important cutoff we draw for practical social functioning – defining the limits of enforceability, marking the space for extraordinary virtue, and protecting individual liberty. Its precise location shifts with context, but its *function* is robust.
