prompt: |-
  hey — practical problem that turned into a conceptual one. I'm building a dataset where every party that cleared 2% in about 45 countries, 1945 to now, has to get coded onto a left–right scale (or flagged as uncodable), and before I freeze the codebook I want the spec instead of another round of people arguing about who is really on which side. So: what does an account of the left–right distinction have to deliver to be good enough for that job?

  Ground rules: no reading lists, no citations, no "so-and-so argues" — I can't look anything up and I don't need the bibliography. I want the requirements, each one with the case or consideration that makes it a requirement, and I'll hand you the candidate accounts at the bottom so the scoring is easy.

  The cases I keep getting stuck on (names changed, they're invented composites, don't try to place them):

  - A party that wants to break up the big tech firms and massively expand public healthcare, is tightly tied to the unions, and also wants a hard line on immigration, a national curriculum with mandatory religious instruction, and much less power for the central government.
  - A protest movement of small farmers and anti-corruption types that insists it is "neither left nor right, just forward," and that every single commentator immediately places on one side anyway.
  - A post-Soviet case where the party everyone locally calls left is socially conservative, nationalist and fiscally austere, while the party called right is culturally liberal and wants to keep the pension system exactly as it is.
  - A party whose manifesto is basically unchanged for thirty years but which slides from far left to center-left because the whole country moved around it.

  Things I want the list to settle. Does the theory have to supply a fixed substantive content, or is it allowed to be relational — roughly, left = the side pressing against the local status quo, or the side of the people who are outside — and if it goes relational, what do I lose (cross-time and cross-country comparability?) and what does it buy me on the cases above. Which distinctions it is not allowed to collapse: the label versus the bundle of policies that happens to travel with it; left/right versus authoritarian/libertarian, if that really is a separate axis; which side a party is on versus how far out it is; self-description versus coded position; the axis as it shows up in ordinary people placing themselves on it versus in what parties actually do in parliament. Whether the theory has to explain the thing people call the horseshoe — the extremes resembling each other — or is permitted to say that resemblance is an artifact of something else. Whether it has to predict anything, and what: coalition formation? which policies get enacted? who ends up hating whom?

  Also: what would have to be true for us to conclude the distinction has broken down and I should just drop the scale from the codebook, and what kind of evidence would settle that question. Whether "two undergrads who know nothing about the country can apply it and agree" is a genuine requirement or a methodological contamination of the concept. Whether even-handedness is a real desideratum or a prejudice of people who want to sound respectable — I mean, does a decent theory have to avoid making one side look irrational or straightforwardly more wrong about the facts, or can it say the axis tracks something like willingness to override inherited arrangements, which might leave one side better calibrated on some questions. Mark each requirement non-negotiable-for-my-purpose or camp preference. Tell me which pair you suspect can't be jointly satisfied — that's the part I most want. And tell me which single requirement knocks out the most accounts people actually hold.

  The candidates floating around my head, score them in a few lines each at the end if you feel like it: (1) it's basically about equality — the left wants fewer or more-justified inequalities, the right accepts or defends some; (2) it's about inherited institutions and tradition versus emancipation from them; (3) it's about how wide the circle of "us" is; (4) purely positional — left is just whichever faction is pushing in the direction local reformers have been pushing; (5) it's two dimensions, economic and cultural, that correlate often enough that everyone mistakes them for one. The list is what I need though, not the scorecard.
reasoning: |-
  Okay, let me tackle this user's problem. They're building a dataset and need a reliable left-right coding system for political parties across 45 countries from 1945 to now. They've hit conceptual snags with specific cases and want to know what a theoretical account must deliver. 

  First, I need to unpack their core dilemma: they need operational clarity for real-world coding, not academic debates. The user explicitly wants requirements grounded in practical coding challenges, not citations. Their four test cases are cleverly designed stress tests: the "contradictory bundle" party, the "neither left nor right" movement, the "inverted post-Soviet" scenario, and the "shifting center" party. Each exposes different cracks in common left-right theories.

  Hmm, their meta-questions reveal deeper concerns. They're wrestling with whether left-right must be substantive (fixed content) or relational (defined against local status quo). Relational approaches might handle their shifting-center case better but risk breaking cross-country comparability. The inverted post-Soviet case screams that local labels can't be trusted. And that protest movement case? Pure catnip for the "self-identification vs. objective coding" debate.

  I notice they're also worried about conceptual collisions: axis confusion (mixing left-right with authoritarian/libertarian), intensity vs. direction, elite vs. mass perceptions. Smart. And they're right to question whether "two undergrads must agree" is methodological rigor or bias - reminds me of inter-coder reliability traps in content analysis.

  The breakdown question is crucial. If left-right coding fails, what's the threshold? When parties cluster in policy space? When coalitions cross left-right lines systematically? But their pension-system case suggests policy domains may decouple...

  For requirements, I'll start with non-negotiables from their use case:
  - Must handle status quo shifts (their sliding party case)
  - Must resist local labels (post-Soviet inversion proves locals get it "wrong")
  - Must separate axis from intensity (their "far left to center-left" slide)
  - Must survive self-denial (that protest movement will claim to be post-ideological)

  Camp preferences matter less but deserve flags: "Even-handedness" feels like respectability politics - a good theory can acknowledge asymmetries. "Horseshoe theory" probably isn't essential if we can explain apparent extremism through other factors.

  Ah, the tension they'll hate: substantive definitions (equality/tradition) boost comparability but struggle with inverted cases, while relational approaches handle local variation but fracture comparability. That's the joint-satisfaction nightmare.

  For candidate theories... 
  - Equality (1) fails the anti-immigration "left" party 
  - Tradition/emancipation (2) gets tangled in religious leftists 
  - Circle of "us" (3) makes the nationalist left a contradiction 
  - Positional (4) handles shifts but kills comparability 
  - Two-dimensional (5) helps but still needs to weight dimensions

  The clincher? Whichever account best survives their test cases while keeping parties comparable across time/space. Maybe two-dimensional with country-specific scaling... but then coder reliability suffers. Tradeoffs everywhere.

  Final note: The "breakdown" condition should be measurable - like when policy dimensions stop correlating or coalition patterns ignore left-right. But their dataset might show that's era/country-specific rather than global. Might need era-specific codebooks...
answer: |-
  Here's a requirements list derived from your practical challenges and conceptual questions. Each requirement is marked **NN** (Non-Negotiable for your purpose) or **CP** (Camp Preference), with the case/consideration that justifies it.

  ### Core Requirements (Non-Negotiables)
  1.  **Handle Policy Bundles That Defy Stereotypes (NN):**  
      *   *Why:* Your first composite case (pro-worker + anti-immigration + socially conservative) exists (e.g., some agrarian populists, historical "social conservative" factions). The theory must place it without forcing incoherence or declaring it "uncodable" without strong justification.
      *   *Deliver:* A mechanism to resolve contradictory stances (e.g., weighting core domains, identifying a primary driving ideology).
  2.  **Resist Local Labels (NN):**  
      *   *Why:* Your post-Soviet case proves local terminology ("left"/"right") can be misleading or historically inverted. Relying on it destroys cross-national comparability.
      *   *Deliver:* An objective coding logic *independent* of local party names, self-descriptions, or conventional local wisdom.
  3.  **Accommodate Shifting Status Quo (NN):**  
      *   *Why:* Your "sliding party" case. A purely relational definition ("against status quo") risks making a static party appear to change ideology when the environment shifts. A purely substantive definition might misplace it relative to its *contemporary* competitors.
      *   *Deliver:* A way to anchor the position *relative to the contemporary political spectrum* within that country/time, while retaining core substantive elements for cross-time/space comparison.
  4.  **Separate Axis from Intensity (NN):**  
      *   *Why:* Essential for distinguishing "which side" (Left/Right) from "how extreme" (Radical/Moderate). The "sliding party" case highlights this need.
      *   *Deliver:* Clear criteria for *directionality* distinct from *degree* of advocacy/opposition.
  5.  **Survive Self-Denial (NN):**  
      *   *Why:* Your "neither left nor right" protest movement case. Parties often claim transcendence but operate within the existing ideological space. Coders need principles to place them.
      *   *Deliver:* Criteria based on observable stances/behaviors/alliances, overriding self-identification when it contradicts actions.
  6.  **Ensure Cross-National Comparability (NN):**  
      *   *Why:* The entire project's goal. Without this, the dataset loses value.
      *   *Deliver:* A core set of principles or substantive anchors applicable to all 45 countries, preventing the scale from becoming entirely country-specific.
  7.  **Ensure Cross-Temporal Comparability (NN):**  
      *   *Why:* Tracking parties over decades (1945-now). The "sliding party" case is key. The position must mean something consistent over time.
      *   *Deliver:* A balance between substantive core and relational context that allows meaningful longitudinal tracking without anachronism.
  8.  **Distinguish Left/Right from Authoritarian/Libertarian (NN):**  
      *   *Why:* Your first composite case (potentially left-econ + auth-culture) and the post-Soviet case (inverted bundles) prove these axes can decouple. Conflating them creates analytical muddle.
      *   *Deliver:* Explicit criteria showing how L/R differs from the vertical (Auth/Lib) axis. *How* they relate (correlated or not) is secondary to *defining* them distinctly.
  9.  **Distinguish Label from Policy Bundle (NN):**  
      *   *Why:* Policies associated with "Left" or "Right" evolve and vary by country (e.g., free trade, nationalism, environmentalism). The core must be deeper than transient policy positions.
      *   *Deliver:* An account of the *underlying principle or conflict* that generates the policy positions, not just a list of policies.

  ### Important Preferences (Camp Preferences)
  10. **Avoid Requiring Prediction (CP):**  
      *   *Why:* Prediction (coalitions, policy success, hatred) is complex, multi-causal, and context-dependent. A good *descriptive/classificatory* theory doesn't necessarily need predictive power to be valid for your coding task. Focus on categorization first.
      *   *Deliver:* Clarity on what L/R *is*, not what it *does*.
  11. **"Two Undergrads Can Agree" is Methodologically Necessary (CP):**  
      *   *Why:* For a large-scale dataset, high inter-coder reliability is essential. If a theory is so complex or subjective that trained coders cannot apply it consistently, it's unusable for your purpose, regardless of its conceptual elegance.
      *   *Deliver:* Operational definitions clear enough for reliable application by multiple coders with basic training.
  12. **Even-Handedness is NOT Required (CP):**  
      *   *Why:* Demanding ideological neutrality risks biasing the theory towards blandness or ignoring genuine asymmetries in how ideologies function (e.g., one side might be more defined by challenging tradition). Your question about "willingness to override" is valid.
      *   *Deliver:* A theory can acknowledge asymmetries if empirically/theoretically justified.
  13. **Need Not Fully Explain "Horseshoe" (CP):**  
      *   *Why:* "Horseshoe theory" is contested. Apparent resemblances might stem from shared anti-system stances, tactical populism, or coders misapplying categories to extremes – not necessarily an intrinsic ideological curvature. Forcing an explanation might distort the core definition.
      *   *Deliver:* The theory should place extremes coherently; explaining superficial similarities is secondary.

  ### The Breakdown Threshold & Evidence
  *   **What would mean it's broken?** The distinction lacks *any* consistent organizing power across the dataset. Core requirements (especially 1, 2, 3, 6, 7, 8) cannot be met simultaneously for a significant portion of cases/countries/eras. Parties within countries consistently form stable coalitions or share core policy stances that blatantly cross the L/R divide defined by the theory, *and* voters/allies perceive no meaningful L/R distinction. "Left" and "Right" labels become entirely random or context-specific with no underlying logic.
  *   **Evidence:** Systematic failure of coders to achieve reliability using the theory. Quantitative analysis showing L/R placement explains negligible variance in party policy positions, voting behavior, or coalition patterns compared to other cleavages (e.g., region, religion, urban/rural) across multiple countries/eras. Historical analysis showing the terms lost all consistent meaning in political discourse.

  ### The Suspected Irreconcilable Pair
  *   **Substantive Core vs. Relational Flexibility (Handling Shifting Status Quo):** This is the crux. A rigid substantive definition (e.g., "Left = Equality") struggles with the "sliding party" and inverted cases. A purely relational definition ("Left = Anti-Status Quo") sacrifices cross-temporal and cross-national comparability. **Satisfying Requirement 3 (Shifting Status Quo) and Requirements 6 & 7 (Cross-National/Temporal Comparability) simultaneously is the hardest trick.** Most theories lean too far one way or the other.

  ### The Requirement That Knocks Out Most Accounts
  *   **Requirement 1 (Handle Contradictory Bundles) + Requirement 8 (Distinguish L/R from Auth/Lib).** Many popular accounts (especially simple equality-based or emancipation-based ones) stumble badly on cases combining, say, strong economic redistribution with strong social conservatism/authoritarianism (your first composite). They either force it awkwardly onto one side, declare it uncodable (a cop-out), or reveal their conflation of the axes. Two-dimensional accounts (5) handle this best *conceptually*, but face challenges on Requirement 11 (Coder Reliability).

  ### Quick Candidate Scores Against Requirements
  1.  **Equality:** Strong on 6,7 (comparability), weak on 1 (awkward with your composite), 3 (doesn't handle shifting meaning of "equality" well), 8 (conflates economic left with cultural liberalism). Fails hardest on 1 & 8.
  2.  **Tradition vs. Emancipation:** Strong on 8 (distinguishes axes), potentially strong on 2 (resists labels). Weak on 1 (Where does religious left fit? Is challenging *economic* tradition emancipation?), 3 (Shifting status quo - what is "tradition"?), 6/7 (Definitions of "tradition" vary hugely). Fails on 1 & 3.
  3.  **Circle of "Us":** Intriguing but vague. Weak on 11 (Coder reliability - how to operationalize "us"?), 8 (Could collapse into Auth/Lib - narrow "us" often = authoritarian), 1 (Your composite might be narrow "us" economically *and* culturally). Poor fit overall for reliable coding.
  4.  **Purely Positional (Anti-Status Quo):** Excels at 3 (Shifting status quo), 1 (Takes bundles as-is), 5 (Self-denial). **Fatal Flaw:** Utterly fails 6 & 7 (Cross-national/temporal comparability). "Left" in 1950s France vs. 2020s USA vs. 1990s Poland become incomparable.
  5.  **Two Dimensions (Econ/Cultural):** Strongest contender. Excels at 1 (Handles bundles), 8 (Explicitly separates axes), 2 (Resists labels - codes positions), 3 (Can anchor within country/time spectrum). Challenges: 11 (Coder reliability - weighting dimensions? Complexity), 6/7 (Requires careful calibration of scales per country/era, but *possible*). Needs clear rules for *synthesizing* into a single L/R scale if that's your final need.

  **Recommendation:** A **refined Two-Dimensional approach (5)** offers the best path to satisfying the most NN requirements, particularly 1, 2, 3, and 8. The critical task is developing crystal-clear, reliable rules for defining and measuring the economic and cultural dimensions *consistently* across contexts (tackling Requirement 11) and then determining how (or if) to combine them into a single scale for your dataset. If a single scale is mandatory, prioritize the dimension historically dominant in the party system or most salient to party competition in that context, but document the choice rigorously.
