prompt: |-
  I direct a small forecasting unit inside a policy institute. Four analysts. Each spring we issue twenty-five-year survival forecasts for roughly forty political entities — states, federations, supranational unions, standing alliances — and every forecast is logged in advance, scored against a ledger of resolved cases once the horizon closes or the entity ends, and signed off by me before publication. The budget is about one analyst-day per item, all sources must be unclassified, and the written rationale has to fit on a single page. My analysts are strong generalists with working probability but no formal survival analysis.

  Our house method is the outside view: for each entity, assemble a reference class of comparable entities, read off the base rate of survival to the horizon, and treat any entity-specific story about why this one is different as an adjustment that has to be argued for rather than assumed. Two disagreements have made that method unreliable in practice, and I want them settled by procedure rather than re-litigated every spring. The first is what may count as a class. Half the team wants classes defined by an explicit mechanism — polities that extract revenue through a fiscal-military apparatus, unions whose members retain a unilateral exit clause — on the grounds that a shared mechanism is what lets a base rate travel. The other half wants classes defined by the label the entity would have used for itself, or by a broad type such as empire or federation, on the grounds that mechanism classes are causal theories smuggled in as bookkeeping and that classifying the mechanism already is the forecast. The second disagreement is statistical. The entities we forecast are, by construction, ones that exist now, and I have become convinced that this contaminates the numbers we read off: a class assembled from currently surviving members is not the same population as a cohort followed from its founding, and I suspect several of our published figures are inflated for that reason alone, in a way that no amount of entity-specific storytelling corrects.

  Please write the procedure my team will run, as an ordered sequence of steps an analyst can complete in a day and a reviewer can audit in half an hour. For each step state what would count as a sufficient answer, what would count as a failure to answer, and what the analyst writes in the one-page rationale. The procedure has to include at least the following, in whatever order you think is right: a step that fixes the persistence criterion before any number is computed, since our forecasts are worth nothing until we have said whether continuity of constitutional order, continuity of ruling coalition, continuity of core territory, or continuity of function is what makes a later entity the same entity; a membership rule that decides class membership only from properties knowable on the forecast date, so that nothing about the outcome leaks into the class; an explicit decision on whether attempts that never consolidated — unions proclaimed but never ratified, states declared but never administered — belong in the denominator, together with the reasoning that settles it rather than a stipulation; a correction for the fact that our classes are drawn from the living, with a statement of when the correction is large enough to matter and when it is ignorable; a required declaration of hazard shape, increasing, flat, or decreasing over the entity's life, with a default for when the analyst has no evidence and the conditions under which the default may be overridden; a rule for what to do when two admissible classes give conflicting base rates, including whether they may be averaged; a rule for revising a standing forecast when an entity simply survives another year without visible decline; and a closing register of the two or three findings that would most change this forecast, so the reviewer knows where to push back. Mark every point at which the procedure hands the decision to a person because the question is one of values rather than fact, and say which of those points I must sign off on personally rather than delegate.

  Then apply the procedure to three items from this spring's list. First, a thirty-year-old continental union of twenty-seven member states, constituted by treaty, whose members hold a unilateral exit clause and whose constitutional changes require unanimity. Second, a two-hundred-and-forty-year-old federal republic whose founding charter contains no secession procedure, which last fought an armed internal conflict over its own continuity a hundred and sixty years ago, and whose component units have diverged economically over the last three decades. At least one of these two must end where I suspect one of them ends, with a band so wide that it is useless to the people who commission our work, and I want to see the procedure produce that result honestly and tell me how to publish it. Third, apply it to a donor's request to forecast the twenty-five-year survival of the security order in a region, where the donor means by that a pattern of alignment rather than any body with a charter, a membership, or a treasury; if the correct output there is a refusal to issue a number, show the procedure arriving at that refusal and telling me what minimal redefinition of the object would make a forecast possible.

  Close with a short section on what the procedure cannot do: which of our failures it will not prevent, which of its steps are judgment dressed as method, and where an analyst who follows it exactly can still be badly wrong. Do not cite or name any literature, authors, or studies; I need the procedure, not references, and my team will not have access to anything beyond what is in the document you write.
reasoning: |-
  We are designing a procedure for survival forecasting for political entities. The procedure must address two main disagreements: (1) how to define the reference class (mechanism-based vs. label/type-based), and (2) how to correct for the fact that we are forecasting currently existing entities (which may lead to inflated survival rates).

  The procedure must include the following elements:
  1. Fix the persistence criterion (what constitutes survival? continuity of constitutional order, ruling coalition, core territory, or function?)
  2. Membership rule: class membership must be decided only from properties knowable on the forecast date (no outcome leakage).
  3. Explicit decision on whether to include attempts that never consolidated (in the denominator) and the reasoning.
  4. Correction for the fact that classes are drawn from currently living entities (right-censoring), with a statement of when the correction matters and when it is ignorable.
  5. Required declaration of hazard shape (increasing, flat, decreasing) with a default and conditions for overriding the default.
  6. Rule for when two admissible classes give conflicting base rates (including whether to average).
  7. Rule for revising a standing forecast when an entity survives another year without visible decline.
  8. Closing register of the 2-3 findings that would most change the forecast.

  Additionally, the procedure must mark points that require a value judgment and specify which of these the director must sign off on personally.

  The procedure must be structured as an ordered sequence of steps that an analyst can complete in a day and a reviewer can audit in half an hour. Each step must state what counts as a sufficient answer, a failure, and what the analyst writes in the one-page rationale.

  We'll structure the procedure in 10 steps. The steps are designed to be sequential and cover all requirements.

  **Procedure: Survival Forecasting for Political Entities**

  **Step 1: Define the Entity and Fix the Persistence Criterion**
     - **Task**: The analyst defines the entity being forecast and specifies the persistence criterion (what constitutes survival). The criterion must be one of: continuity of constitutional order, continuity of ruling coalition, continuity of core territory, or continuity of function. The criterion must be fixed before any computation.
     - **Sufficient Answer**: The entity is clearly described, and the persistence criterion is explicitly chosen and justified in one sentence.
     - **Failure**: The entity description is vague, or the persistence criterion is not chosen or justified.
     - **Rationale Entry**: "We are forecasting the survival of [entity name]. Survival is defined as the continuity of [chosen criterion] over the 25-year horizon."

  **Step 2: Assemble Reference Classes (Without Outcome Leakage)**
     - **Task**: The analyst proposes at least two candidate reference classes. One class must be defined by an explicit mechanism (e.g., fiscal-military apparatus, unilateral exit clause). The other must be defined by the entity's self-label or a broad type (e.g., empire, federation). The properties used to define the class must be knowable at the forecast date and not depend on future outcomes.
     - **Sufficient Answer**: At least two classes are defined: one by mechanism and one by label/type. Each class has a clear membership rule based on historical properties at the time of the entity's founding or at a comparable stage. The membership list is provided.
     - **Failure**: Only one class is provided, or the classes are not distinct (both of the same type), or membership rules use information that would not be available at the forecast date (e.g., future survival).
     - **Rationale Entry**: "Candidate reference classes: 
          Class A (mechanism): [mechanism description] with members [list of entities].
          Class B (label/type): [label/type description] with members [list of entities]."

  **Step 3: Decide on Inclusion of Unconsolidated Attempts**
     - **Task**: The analyst decides whether to include in the denominator of the base rate calculation any unconsolidated attempts (e.g., unions proclaimed but never ratified, states declared but never administered). This decision must be justified by reasoning about whether such attempts are part of the same generative process as the consolidated entities.
     - **Sufficient Answer**: A clear decision (include or exclude) with a reasoned justification (e.g., "We include unconsolidated attempts because they represent the same formation process and their failure is informative about the survival rate" or "We exclude them because they never achieved the minimal threshold of consolidation and thus are not comparable").
     - **Failure**: The decision is made without justification, or the justification is circular or irrelevant.
     - **Rationale Entry**: "Unconsolidated attempts are [included/excluded] because [reason]. Therefore, the denominator for base rates will [include/not include] such cases."

  **Step 4: Calculate Base Rates for Each Class, Correcting for Right-Censoring**
     - **Task**: For each reference class, the analyst calculates the base rate of survival to the 25-year horizon. This must account for right-censoring (i.e., entities that are still alive at the time of the forecast but have not yet reached 25 years). The correction method is as follows:
          - For entities that have reached at least 25 years: we know if they survived 25 years or not.
          - For entities that are still alive but under 25 years: we cannot use them in the denominator for the full 25-year survival because they haven't been at risk for the full period. Instead, we use the Kaplan-Meier estimator (or a simple alternative if the data is small) to account for censoring.
          - The analyst states the uncorrected base rate (ignoring censoring) and the corrected base rate (accounting for censoring). The analyst also states when the correction is large enough to matter (e.g., when more than 10% of the class is censored) and when it is ignorable (e.g., when all entities in the class have at least 25 years of history).
     - **Sufficient Answer**: Base rates (both uncorrected and corrected) are provided for each class, along with the number of entities and the number of censored cases. The analyst states whether the correction is significant (and why) or not.
     - **Failure**: No correction is attempted when censoring exists, or the correction method is not applied correctly, or base rates are calculated without considering the denominator from Step 3.
     - **Rationale Entry**: For each class:
          "Class [X]: 
          - Uncorrected base rate: [rate] (n=[total entities including censored], events=[survived at least 25 years]).
          - Corrected base rate (using [method]): [rate]. 
          - Censoring: [number] censored, correction [is/is not] significant because [reason]."

  **Step 5: Declare Hazard Shape**
     - **Task**: The analyst declares the hazard shape for the entity: increasing, flat, or decreasing over the entity's life. The default is flat (constant hazard) unless there is evidence to override. The analyst must provide evidence (e.g., from historical patterns in the reference class) to override the default. If no evidence, the default stands.
     - **Sufficient Answer**: A declaration of hazard shape (with the default being flat) and a brief justification if overriding the default. The justification must be based on the reference class or entity-specific history (but without relying on outcome leakage).
     - **Failure**: No declaration, or declaration without justification when overriding the default, or using entity-specific future information.
     - **Rationale Entry**: "The hazard shape is [increasing/flat/decreasing] because [justification or 'default']."

  **Step 6: Resolve Conflicting Base Rates**
     - **Task**: If the base rates from the two classes (Step 4) differ, the analyst must decide which one to use. They may not average without justification. The rule is:
          - If one class is deemed more relevant by the persistence criterion (e.g., the mechanism class better captures the continuity of constitutional order), then use that class.
          - Otherwise, if one class has a larger sample size and less censoring, use that class.
          - If neither condition applies, then the analyst must choose the class that is more conservative (i.e., the lower survival probability) and note the conflict. The director must sign off on this choice (see Step 10).
     - **Sufficient Answer**: A clear choice of class is made, with justification, or a note that the conflict remains and the conservative choice is taken (with director sign-off required).
     - **Failure**: Averaging without justification, or no resolution when base rates conflict.
     - **Rationale Entry**: "The base rates conflict: Class A: [rate], Class B: [rate]. We use Class [X] because [justification]. [If conservative choice:] Due to unresolved conflict, we use the conservative (lower) rate and flag for director review."

  **Step 7: Adjust for Entity-Specific Factors**
     - **Task**: The analyst may adjust the base rate (from Step 6) for entity-specific factors. However, any adjustment must be argued and quantified. The adjustment must be a multiplicative factor (between 0 and 2) applied to the hazard rate (or equivalently, the survival probability). The adjustment must be justified by a factor that is both unique to the entity and not already captured in the reference class. The adjustment factor must be derived from a reasoned argument (e.g., "This entity has a factor that doubles the hazard because of X, which was not present in the reference class").
     - **Sufficient Answer**: An adjustment factor (if any) with a clear justification and quantification. If no adjustment, state that.
     - **Failure**: Adjustment without justification, or adjustment that is not quantified, or adjustment that is circular (e.g., "because it is more stable").
     - **Rationale Entry**: "Entity-specific adjustment: [factor] applied to hazard because [reason]. Adjusted survival probability: [probability]."

  **Step 8: Produce the Forecast**
     - **Task**: The analyst states the 25-year survival probability. If the hazard shape was not flat, the analyst must use the appropriate survival model (e.g., Weibull) to compute the survival probability. Otherwise, the flat hazard implies exponential survival: S(t) = exp(-h * t), where h is the hazard rate (h = -ln(S_base)/25, with S_base the base rate from Step 6 or 7). The forecast must include a confidence interval (if feasible with the sample size) or a range (based on the reference class variance or the range of the two classes).
     - **Sufficient Answer**: A point estimate and a range (or interval) for the survival probability, along with the formula used (if hazard not flat).
     - **Failure**: No range or interval, or incorrect computation of survival probability given the hazard shape.
     - **Rationale Entry**: "The 25-year survival probability is [point estimate] with a range of [low] to [high]. This is based on [formula/model]."

  **Step 9: Register Key Uncertainties**
     - **Task**: The analyst lists two or three findings that would most change the forecast (e.g., "If evidence emerges that the hazard is increasing, the forecast would drop to X", or "If a new reference class with a lower base rate were admitted, the forecast would be Y").
     - **Sufficient Answer**: Two or three specific, quantifiable sources of uncertainty that could materially change the forecast.
     - **Failure**: Vague statements, or fewer than two, or not quantifiable.
     - **Rationale Entry**: "Key uncertainties: 
          1. [Finding 1] would change the forecast to [value].
          2. [Finding 2] would change the forecast to [value]."

  **Step 10: Revision Rule and Director Sign-Off**
     - **Task**: The analyst states the rule for revising the forecast when the entity survives another year without visible decline. The rule is: Each year, the survival probability for the remaining horizon is updated by conditioning on survival to the current date. For example, if the original forecast was S(25) and the entity has survived 1 year, then the updated 24-year survival probability is S(25) / S(1). This requires knowing S(1) (the one-year survival) which can be derived from the hazard function. The analyst must note this revision rule in the rationale.
     - **Director Sign-Off**: The director must personally sign off on the following:
          - The choice of persistence criterion (Step 1) because it is a value judgment about what counts as survival.
          - The resolution of conflicting base rates when it requires a conservative choice without clear justification (Step 6).
          - Any entity-specific adjustment (Step 7) because it is a judgment call.
     - **Sufficient Answer**: The revision rule is stated. The rationale notes which points require director sign-off and if any were exercised.
     - **Failure**: No revision rule, or failure to note sign-off points.
     - **Rationale Entry**: "Revision rule: Upon survival of year t, update the remaining horizon forecast by conditioning. Director sign-off required for: [list the points that required sign-off in this forecast]."

  **Application to Three Items**

  We now apply the procedure to three cases.

