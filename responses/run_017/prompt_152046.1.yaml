              Time: 10 (failure), 7 (failure), 30 (censored), 40 (survived), 35 (survived) -> but we don't have 40 and 35? This is hypothetical. Let's say we have two that survived beyond 25 (one at 40 and one at 35) and two that failed (at 7 and 10) and one censored at 30 (EU). The Kaplan-Meier estimate at 25 years: the entities at risk at 25 are the two that survived beyond 25 (they are still alive at 25) and the one censored at 30 (also alive at 25). The two that failed did so before 25. So the survival probability at 25 is (number surviving beyond 25) / (number that reached 25) = 3/3? But wait, the two that survived beyond 25 and the one censored at 30 were all alive at 25. However, we don't know if the censored one would survive to 25? Actually, at 25, the censored one (30) is alive (since 30>25). So S(25)=1.0? That can't be right because two failed early. The Kaplan-Meier is a step function. We compute:
