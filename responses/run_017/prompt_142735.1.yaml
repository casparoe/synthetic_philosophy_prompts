  **Bottom line: *Manchester by the Sea* engages with moral luck primarily to expose its inadequacy for capturing Lee's trauma, shifting the focus to the crushing weight of self-condemnation and the "audience luck" of having support to bear it.**

  Here's the reasoning, directly from the film and the ideas:

  1.  **Moral Luck *Illuminates* the Initial Setup:**
      *   The core moral luck scenario (outcome affecting moral blame for the *same* action/negligence) is visible in Lee's fire. Leaving a fire unattended while intoxicated is negligent. On most nights, the consequence might be a scorched hearth or a reprimand. The catastrophic, unforeseeable outcome (deaths of his children) transforms the *significance* and *weight* of that negligence astronomically. The town's kindness implicitly acknowledges this luck element; they judge the *man* and his unimaginable suffering, not the isolated negligent act as if it existed in a vacuum devoid of consequence. Their judgment is tempered by the sheer horror of the outcome he didn't "intend" in the specific way it unfolded.

  2.  **The Film *Resists* Moral Luck as the Central Point:**
      *   **Lee's Guilt is Non-negotiable & Existential:** Moral luck discussions often focus on *external* blame or legal culpability. Lee's torment stems entirely from *internal*, self-imposed judgment. The "luck" of the outcome doesn't register for *him* as mitigating; the fact that his carelessness *could* (and did) lead to catastrophe *is* the unforgivable sin. His guilt isn't proportional to the outcome *because* of the outcome; the outcome *is* the proof of his ultimate failure. His identity *is* "the man who killed his children through negligence." Moral luck tries to separate the act from the consequence for analysis; for Lee, they are fused beyond separation.
      *   **The Ex-Wife Scene Demonstrates the Failure:** Randi's desperate apology and attempt to absolve him ("My heart was broken... and I know yours is broken too...") is an offer of *external* forgiveness based partly on recognizing the tragic, unlucky circumstances ("I shouldn't have said all those things"). But Lee *cannot* accept it. This isn't about whether the moral luck framework assigns him blame; it's that *he* assigns himself an absolute, unshakeable damnation. Her forgiveness cannot reach him because his guilt is not contingent on her blame. Her apology highlights the chasm between external judgment (even forgiving judgment) and internal reality. Moral luck has no vocabulary for this profound failure of absolution to penetrate self-hatred.
      *   **"Audience Luck" is the Film's True Focus (and Lee's Tragedy):** You've hit the core. The film shows that surviving such horror depends less on the philosophical parsing of blame/luck and more on whether you have people who can *witness* and *share* the unbearable burden without demanding you "get over it." Patrick has his network (friends, band, girlfriend, even his mom) – he has *audience*. Lee *had* Joe, his brother, who provided that anchor ("You're gonna stay with me..."). Joe's death is the ultimate catastrophic luck *for Lee*, stripping him of his sole supportive audience. The town's kindness is a poor substitute; it's distant, pitying, unable to truly *hold* his pain alongside him. The lawyer reading the will, the bar fights, the awkward encounters – they all underscore his profound isolation. Losing Joe is losing the *person* who could potentially help him carry the weight *despite* the moral luck of the fire's outcome. This "audience luck" – the luck of having and keeping the relational infrastructure to survive trauma – is the film's devastating insight beyond standard moral luck categories.

  **In essence:** The film *uses* the moral luck scenario as the inciting event, showing how an unlucky outcome transforms negligence into an unbearable burden. But it immediately moves *past* the question of external blame assignment (which is where moral luck operates) to explore the internal, existential prison of self-condemnation and the critical, often luck-dependent, need for human connection to survive it. Lee's tragedy isn't that he's judged unfairly due to moral luck; it's that he judges himself absolutely and has lost the one person who could stand beside him in that hell. The film argues that the real luck isn't just in the outcome of the act, but in whether you have, and can keep, the audience that allows you to live with it.
