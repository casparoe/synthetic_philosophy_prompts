prompt: |-
  I sit on the standards committee of a large AI evaluation body, and I'm trying to write down what we already implicitly believe. I'd like you to reconstruct the theory of understanding that our certification pipeline presupposes, and tell me whether the parts hang together.

  The pipeline as we actually run it (this is our own internal practice, not any published standard; nothing here needs checking against the literature):

  1. Robustness gate. A system is credited with understanding a concept only if it answers correctly across a battery of paraphrases, reorderings, and surface perturbations of the same problem. One correct answer proves nothing.
  2. Wrong-reasons rule. A correct answer does not count if the step-by-step reasoning the system produced beforehand does not contain the consideration we take to be operative. Right answer, wrong reasons is scored as failure; and a system that answers directly with no visible reasoning is scored below one that reasons aloud, even when both are correct.
  3. Prompt-sensitivity discount. When a system fails a paraphrase but succeeds on a near-identical rewording of it, we attribute the failure to the prompt rather than to the system, and we do not withdraw credit.
  4. Audience discount. When a system produces good reasoning only if it has been told in advance that its reasoning will be graded, we do not credit it. Reasoning produced for the record is not treated as the reasoning that did the work.
  5. The distillation case. A smaller system fine-tuned on a larger one's reasoning traces passes 1 and 2 about as often as the larger system does. The committee is split on whether to certify it.

  What puzzles me is that 1 and 3 pull in opposite directions: we make surface variation the test of understanding, and then we excuse failure under surface variation as an artifact of the prompt. And 2 and 4 seem to presuppose that there is a fact of the matter about which considerations produced an answer as opposed to which were merely stated next to it — but in these systems the stated considerations are literally tokens in the causal chain leading to the answer, so I cannot see what the difference between guiding and merely accompanying is supposed to consist in.

  So: reconstruct the implicit theory. What must we be committed to for 1 through 4 to be more than arbitrary? Does the package require only that understanding be a counterfactual-supporting competence, or does it additionally require the right causal or explanatory history? Is the asymmetry between 1 and 3 defensible, or is it special pleading? Does 4 smuggle in the requirement, familiar from debates about acting for a reason, that the operative reasons guide the performance rather than merely being available to an audience — and if so, does that requirement survive the fact that the reasoning is part of the system's input by the time the answer is produced?

  Distinguish what the practice strictly presupposes from what it merely fits well with, and say where it is underdetermined, so that several rival theories would license it. Then say what we would concretely have to start or stop doing if we adopted a straight behavioral test, on which robustness is all there is, or a strictly mechanistic one, on which only internal causal structure counts and the trace is irrelevant in both directions. Finally, tell me how case 5 should be decided, and whether the committee's split is a genuine philosophical disagreement or a confusion.

  Answer in continuous American English prose, with no headings, in at most 600 words.
reasoning: |-
  Okay, let me unpack this complex request. The user is a standards committee member for an AI evaluation body trying to formalize their implicit assumptions about "understanding" in AI systems. Their pipeline has five key rules that seem to contain tensions - particularly between requiring robustness against surface changes (Rule 1) while excusing failures due to prompt variations (Rule 3), and between requiring visible reasoning (Rule 2) while discounting reasoning produced for grading purposes (Rule 4). 

  The core challenge is reconstructing a coherent theory behind these practices. I need to analyze what philosophical commitments would make Rules 1-4 non-arbitrary. The apparent contradictions suggest they're trying to capture something beyond surface behavior - perhaps a counterfactual competence where the system genuinely grasps concepts rather than just pattern-matching. 

  Rule 2 and Rule 4 together imply a distinction between reasoning that causally guides the answer versus reasoning that's merely present. This is tricky because in transformer architectures, the reasoning trace is literally part of the input sequence. The evaluation seems to require that the reasoning tokens play an active computational role, not just sit there. 

  For Rule 5 about distilled models, the philosophical tension becomes concrete: if a small model mimics the reasoning patterns of a larger one without the same internal structure, does that count as understanding? This cuts to whether we care about behavioral competence or specific mechanistic implementation.

  The user's underlying concerns are epistemological (what constitutes understanding) and practical (how to standardize evaluations). I should address both while staying within their word limit. The response must avoid academic jargon while precisely dissecting these tensions, and explicitly distinguish what their practice necessarily presupposes versus what could be justified through alternative theories.

  Notably, Rule 3's "prompt-sensitivity discount" suggests they view prompts as activating latent capabilities rather than creating them - which helps reconcile it with Rule 1. But this requires assuming the system possesses stable competencies that prompts merely access. For Rule 4, they seem to want reasoning that's intrinsically motivated rather than performative, though this is hard to operationalize.

  Ultimately their framework appears committed to: 1) Understanding as robust, counterfactual-supporting competence 2) Reasoning traces as evidence of causal process 3) Distinguishing between capability and performance. The distillation case might be decided by testing whether the small model can generate novel, appropriate reasoning beyond what it fine-tuned on.
answer: |-
  Your evaluation practices reveal an implicit theory where understanding requires a robust, counterfactual-supporting competence that manifests through *appropriate sensitivity* to content rather than surface form. Rule 1 demands invariance under irrelevant surface changes (paraphrases), treating robustness as necessary for genuine grasp. Rule 3, however, acknowledges that *some* surface changes (prompt wording) *can* be relevant to accessing a competence the system possesses—failure here is blamed on the evaluator’s imperfect prompt design, not the system’s lack of understanding. This asymmetry is defensible if you hold that understanding entails having a stable, internally represented competence that prompts merely *elicit*, not create. Prompt failures are excused because they reflect an *interface problem* in triggering the competence, not its absence. The presupposition is that competence exists if it *could* be elicited by an ideal prompt.

  Rules 2 and 4 rely on a distinction between the *causal role* of reasoning tokens and their mere presence. Rule 2 requires the step-by-step trace to contain tokens that were *causally operative* in generating the answer—not just correlated. Rule 4 discounts reasoning produced solely because it’s demanded ("for the record"), suspecting it’s a post-hoc simulation generated for output, not a causal driver of the answer. This presupposes a counterfactual dependence: the correct answer wouldn’t have been produced *without* those specific reasoning steps occurring internally as part of the generative process. While the reasoning tokens are causally antecedent (as input), the concern is whether their *content* functionally guided the computation or were inert passengers manipulated by other mechanisms. Your practice requires that the reasoning trace isn’t just a causal *precursor*, but that its semantic content *explains* the answer mechanistically—a higher bar than mere sequence.

  This package presupposes understanding is a counterfactual competence (robustness, Rule 1) *and* that it must be exercised via causally efficacious internal reasoning reflecting that competence (Rules 2 & 4). Rule 3 fits by excusing failures attributed to poor elicitation of the latent competence.

  If you adopted a purely behavioral test (robustness is all), you’d:
  -   **Stop:** Demanding reasoning traces (Rule 2), discounting "audience" reasoning (Rule 4), and making prompt-sensitivity excuses (Rule 3). Only consistent performance across paraphrases (Rule 1) would matter.
  -   **Start:** Certifying systems that pass paraphrases regardless of internal process or reasoning visibility.

  If you adopted a strict mechanistic test (only internal causal structure counts):
  -   **Stop:** Requiring specific reasoning *trace content* as evidence (Rule 2), as the trace is just output, not mechanism. Rule 4 also becomes irrelevant.
  -   **Start:** Needing methods to probe internal states (e.g., activations, circuit analysis) directly. Rule 1 (behavioral robustness) might become secondary evidence at best.

  **Case 5 (Distillation):** The split reflects a genuine philosophical disagreement about the *grounds* of understanding. Those opposing certification likely hold that understanding requires the specific *original causal structure* (mechanisms) that generated the robust competence in the larger model. The fine-tuned small model merely mimics the *output patterns* (reasoning traces) without necessarily replicating the underlying computational structure that made them meaningful/causal in the original. Proponents likely hold that replicating the robust, causally efficacious reasoning *behavior* (passing Rules 1 & 2) *is* sufficient for understanding, regardless of implementation. Your current framework (requiring causal efficacy of reasoning traces) *leans* against certification, as the fine-tuning may teach pattern-matching of reasoning *text* without ensuring those tokens play the same causal role internally as in the teacher model. Resolving this requires clarifying whether "causal efficacy" (Rule 2/4) is tied to specific architectural mechanisms or demonstrable functional role in the distilled model. The practice is underdetermined here.
