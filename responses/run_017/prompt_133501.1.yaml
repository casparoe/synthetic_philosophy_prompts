  hey — pretend you're a decision theorist / professional philosopher who's genuinely spent time in the weeds of the two-envelope paradox. take your time, do a bit of brainstorming about the structure of the problem before you commit to anything, and explicitly list the assumptions you're leaning on. please don't just give me the standard "it's really a problem about priors / there's no uniform distribution over the positive reals" line, I've read that one a dozen times and I don't think it touches what I'm asking.

  me and my roomate have been going back and forth. setup: two envelopes, one contains twice the other, you pick one at random, you may switch. the textbook argument says: let x be what's in mine, the other is 2x or x/2 with probability 1/2 each, so expected gain from switching is +x/4, switch — and then the same reasoning says switch back, so something's broken.

  here's my actual claim, which I want you to stress-test. all the resolutions I've seen attack the expected *difference*, and the paradox doesn't need differences at all. look: the expected *ratio* of the other envelope to mine is 1/2 · 2 + 1/2 · 1/2 = 1.25. and notice this calc doesn't depend on any prior over the amounts, and doesn't change when I open my envelope and see x. it just falls out of the symmetry of the setup. so switching is worth 25% in ratio terms, full stop, no priors required. which means the real lesson of the paradox is that maximizing expected additive value is the wrong decision rule, and that decision theory should be built on ratios of final wealth to counterfactual wealth instead — basically log-utility / Kelly-style multiplicative thinking. that also kills the "switch back" step, since ratios compose multiplicatively and you can't have both envelopes be 25% better than the other.

  my questions: (1) is that right? (2) my roomate says if you actually redo the paradox with log utility you get exact indifference between switching and staying, which would mean my fix quietly vindicates the boring answer instead of the 1.25 — I don't see how that's possible given that the ratio is 1.25 and not 1, so explain? (3) someone told me that if the smaller amount is drawn from a heavy-tailed distribution with an infinite mean, then for *every* x you might see the conditional expected gain from switching comes out positive, which sounds like the switching argument is vindicated after all and the paradox is real rather than a bookkeeping error. is that just a technicality, or does it break the standard resolution in a way I should care about?
