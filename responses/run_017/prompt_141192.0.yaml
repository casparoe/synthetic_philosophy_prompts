  Okay, this user is wrestling with a nuanced frustration about public discourse, specifically how arguments are dismissed or accepted based on their perceived origins rather than their content. They've observed three distinct but related patterns: 

  First, the "scripture bolted on" phenomenon—where nearly identical arguments get labeled differently based on religious packaging. The core insight here seems correct: the evaluative frame shifts based on surface cues, not substance. I recall Habermas's "translation proviso" from public reason liberalism, but the user explicitly rejects that as insufficient. They're pointing to something deeper—a kind of epistemic gatekeeping where accessibility trumps actual logical validity.

  Second, the mirror problem: secular premises (like rational agency or "the science") operating with the same unexamined authority as religious dogma. This is sharp. The user feels equally alienated by both, which suggests the real issue isn't sacred/profane but shared/unshared justificatory foundations. Rawls's "burdens of judgment" comes to mind—reasonable people disagree on first principles—but that's descriptive, not diagnostic.

  Third, the "mentioning is fatal" effect—where naming your source (even if irrelevant to the argument's structure) triggers dismissal. This feels tribal. Like purity testing: if you reveal allegiance to a "contaminated" source, your entire position gets quarantined regardless of content. 

  The user's hunch about epistemic labor resonates. Consider: "could go and check for themselves" implies a spectrum of verifiability. But in practice, willingness to verify depends entirely on perceived tribal alignment. A secular citation might get a free pass while a religious one demands exhaustive proof—even if both are equally verifiable in theory. 

  Their suspicion about "certainty" and "oomph" touches on motivational salient beliefs. But that's downstream; the core injury is epistemic exclusion masked as neutrality. When they say "the wrong axis," they're rejecting the religion/secular binary as superficial. 

  Existing terms fall short. "Nonpublic reason" (Rawls) is too narrow—it lumps all non-shared premises together without gradation. "Comprehensive doctrine" ignores that secular worldviews can be just as exclusionary. "Deep disagreement" (Fogelin) captures the intractability but not the asymmetry in how premises are treated. 

  Proposing "epistemic parochialism": when a discourse community selectively demands/rejects justification burdens based on source-alignment rather than argument quality. Test case: If a secular argument citing Kant gets accepted without scrutiny while a functionally identical religious argument gets dismissed, that's parochialism. Counterexample would be if both are rejected/accepted based solely on verifiability (e.g., both cite untestable axioms). 

  But if the user found a case where a religious argument with easily verifiable secular premises (e.g., "help the poor because Proverbs 14:31 [but also empirical data on poverty]") still gets dismissed while a secular equivalent stands, that would confirm their intuition about tribal signaling overriding content. That's the breaking point for any purely epistemic account—it reveals the tribal underbelly.
answer: |-
  You're wrestling with a fundamental flaw in public discourse that absolutely deserves a name. The religious/secular axis *is* the wrong framing. What you're observing is **Epistemic Privilege in Justificatory Burden**.

  **My Definition & Analysis:**

  1.  **Core Phenomenon:** The perceived acceptability of an argument in public political discourse hinges *not* primarily on its inherent logical structure, empirical support, or moral resonance, **but on the perceived accessibility and shared acceptance of its foundational premises by the dominant discursive community.** Critically, this involves:
      *   **Unstated Privilege:** Certain sources/frameworks (e.g., secular liberalism, specific interpretations of "science" or "Enlightenment reason," dominant historical narratives) are granted *implicit epistemic privilege*. Arguments built on them face a lower justificatory burden – their premises are often assumed valid without scrutiny.
      *   **Imposed Burden:** Arguments built on premises perceived as originating outside this privileged domain (e.g., religious texts, non-dominant philosophies, critical social theories, specific cultural traditions) face a *higher justificatory burden*. They are often dismissed *as premises*, regardless of the argument's structure or potential truth, because their foundations are deemed "private," "unshared," or "uncheckable."
      *   **Source Signaling:** Explicitly *naming* the non-privileged source acts as a signal triggering the higher burden/dismissal. Omitting the source while using the same underlying logic allows the argument to benefit from the lower burden afforded to the privileged domain. *The content hasn't changed, but the perceived epistemic pedigree has.*

  2.  **Why "Epistemic Privilege in Justificatory Burden"?**
      *   **Epistemic:** It's fundamentally about *how we know* and what counts as valid knowledge/justification in a specific context.
      *   **Privilege:** It highlights the *unearned, often unexamined advantage* given to certain foundational beliefs or sources.
      *   **Justificatory Burden:** It focuses on the *unequal demand for proof or grounding* placed on arguments depending on their perceived origin.

  3.  **Why Existing Terms Fall Short:**
      *   **Public Reason / Non-Public Reason:** This framework *defines* the problem (only "shared" reasons are public/political) but doesn't adequately *analyze the power dynamics* behind what gets counted as "shared" or "accessible." It often smuggles in the very privilege you're identifying (e.g., why is Locke more "public" than Aquinas?).
      *   **Comprehensive Doctrine:** Useful, but lumps all non-liberal foundations together without analyzing the *differential treatment* secular comprehensive doctrines often receive compared to religious ones.
      *   **Deep Disagreement:** Describes intractability but doesn't explain the *asymmetry* in how arguments from different foundations are treated within the discourse.
      *   **Cultural Hegemony:** Gets close to the power dynamic but is too broad; your focus is specifically on *epistemic justification* within argumentation and policy debate.
      *   **Dogmatism / Fundamentalism:** Focuses on the arguer's rigidity, not the *structural unfairness in how the discourse evaluates different premises*.

  4.  **Your Three Scenarios Explained by This Concept:**
      *   **Church Group vs. Parents' Association:** The *identical core argument* faced different justificatory burdens. The church group triggered the higher burden ("imposing religion") by signaling its (perceived) non-privileged source. The parents' association, using the same logic but framed within the privileged secular-liberal domain (concern for individuals, institutional fallibility), faced a lower burden and was deemed "civic-minded." The scripture citation was the *signal*, not the load-bearing structure.
      *   **Work Argument (Rational Self-Conscious Agency):** This premise, common in certain secular philosophies (Kantianism, some bioethics), enjoys epistemic privilege in many professional/academic/political settings. Its foundational status is often *assumed*, demanding no justification ("that's just what a person *is*"). You felt shut out because you were expected to accept a privileged premise without scrutiny – the *inverse* of the religious person being told their premise is inadmissible. Appeals to "the science" (without specifying *which* science or its limits), "founding promises," or "historical direction" often function this way – privileged premises demanding low justificatory burden.
      *   **Mentioning the Source:** This is the clearest evidence. Naming the non-privileged source (e.g., "my faith teaches...", "Marxist analysis shows...") signals the argument belongs in the high-burden category, triggering dismissal. Omitting the source allows the underlying logic to masquerade as originating from the privileged domain, receiving the lower burden ("common sense," "rational argument"). The *argument's validity in the discourse* changes based solely on signaling its epistemic pedigree, not its content.

  5.  **Why it's Epistemic, Not Just Motivational (Though That's Connected):**
      The core mechanism is the *unequal standard for what counts as an admissible premise*. The "certainty" or "oomph" of religious reasons often becomes a *post-hoc justification* for imposing the higher burden, but the initial trigger is the classification of the premise-source as non-privileged. The unwillingness to learn a tradition's "internal moves" stems from the prior judgment that those moves belong to a non-privileged epistemic domain not worth the effort for "public" discourse.

  6.  **What Would Break This Account?**
      If you consistently found that:
      a) Arguments based *explicitly* on non-privileged premises (named religious texts, Marxist theory, indigenous cosmology) were **routinely accepted without demanding extra secular translation or proof**, *when their logic was sound and relevant*, even by those who didn't share the premise.
      b) Arguments based *explicitly* on privileged premises (Enlightenment rationality, specific scientific consensus, constitutional originalism) were **routinely challenged on their foundational assumptions** to the same degree as non-privileged premises, *especially when presented to those outside the tradition*.
      c) The *mere mention* of a non-privileged source, when the argument's logic stood independently, **did not significantly increase the rate of dismissal** compared to an identical argument without the source mention.

  **Conclusion:**

  You've pinpointed a pervasive and damaging dynamic. **Epistemic Privilege in Justificatory Burden** names the unfair asymmetry where the acceptability of an argument depends less on its merits and more on the unexamined, privileged status granted to its foundational sources within a specific discourse community. The religious/secular debate is a prominent *instance* of this, driven by the historical and cultural dominance of secular liberalism in Western public spheres, but the dynamic applies far more broadly. Recognizing this forces us to question *why* certain premises are privileged and others burdened, moving beyond superficial labels to scrutinize the foundations of arguments equally, regardless of their perceived origin. The solution isn't banning sources, but demanding *consistent scrutiny of foundational premises* across the board.
