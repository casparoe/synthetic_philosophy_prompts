prompt: |-
  I write a column on forecasting — prediction markets, forecasting tournaments, epidemiological and climate models, and lately the machine-learning systems that now issue probability estimates on the same questions the tournaments do. The question I keep circling is the one the ancient and medieval logicians argued about with the example of tomorrow's sea battle: when an outcome has not happened yet, is there already a fact of the matter about whether it will? I am less interested in the history of that debate than in whether my own verdicts add up to anything, because I have to write about forecasts as if they were right or wrong, and I no longer know what I think I am saying when I do.

  Below are my verdicts. In each case the question is whether the italicized sentence, as I would assert it today, is true now, false now, or neither.

  1. The sun will rise over Reykjavík at 5:41 a.m. on 3 March 2031. Deterministic, computable in principle from present conditions, unknown to me. Verdict: determinately true or determinately false now; my ignorance is irrelevant.

  2. This coin was flipped an hour ago and is now face down on the table showing heads. Verdict: determinately true now that it shows heads. Nothing about the world is unsettled; only my access is.

  3. This fair coin, to be flipped tomorrow, will come up heads. Verdict: neither true nor false now. There is, so far, nothing there to be right or wrong about.

  4. This particular uranium atom will decay within the next hour. Verdict: neither. I resist the suggestion that it is already settled and merely chancy. But the statistical claim that roughly half the atoms in the sample will decay within a given period: determinately true now.

  5. I will file this column by six o'clock tonight. Verdict: neither, and I want something stronger than that — I want to say that what settles it is my deciding later, not my discovering something already fixed.

  6. In 2019, a modelling group projected that hospitalizations in a named country would peak in the second week of April. The peak did occur then. Verdict: I am perfectly willing to say now, retroactively, that their projection was right. I am much less willing to say that the corresponding claim was true in 2019.

  7. In 2015, it was true that the United Kingdom would leave the European Union. Verdict: yes, true then — and yet I also want to say that in 2015 the matter was genuinely open, and that no one was then in a position to know. I know these two pull against each other; I have not managed to give up either.

  8. Either the central bank will cut rates at its next meeting or it will not. Verdict: definitely true — even though, by my verdict in cases of this shape, neither disjunct is true. I assume this costs me something; I would like to be told exactly what.

  9. I will never write a novel. Verdict: false, straightforwardly. But its twin, I will write a novel: neither. I report the asymmetry because I suspect it is a prejudice rather than an insight, and I want to know whether a principle can respect it or only explain it away.

  10. A forecasting system with a perfect record on ten thousand binary questions outputs yes on whether a named country will hold a national election within twelve months. Verdict: I feel a strong pull toward saying the claim is true now in virtue of that record, and an equally strong pull toward saying that nothing yet makes it true.

  11. Two reflexive cases. A column of mine moves a thinly traded market, so that the very act of publishing makes my prediction come out true. And a newspaper prints that a trailhead will be crowded at eight on Saturday morning, with the result that nobody turns up. Verdict: in the first I want to say the claim was not true when I wrote it and became true once published; in the second, that it was on its way to being true and the publication made it false. I do not know whether this means truth values change over time, or whether I have simply described two different claims.

  12. My own distinction, which I have started using in my notes: hard-target claims, where the event is sharply individuated and only its occurrence is unsettled (the coin, the eclipse), versus soft-target claims, where the event itself has no sharp edges until someone stipulates what would count — the city will experience a blackout this summer; the startup will fail; the country will hold a free and fair election. My verdict on soft-target claims is neither true nor false, but for a different reason than in case 3: with the coin I think the world is unfinished, while with the blackout I think the world is fine and the description is loose. I would like the principle to tell me whether these are two kinds of indeterminacy that a single account should unify, or one kind and one piece of sloppiness.

  13. Long after the last mind capable of registering it, the sun will expand and render the earth uninhabitable. Verdict: true, or at any rate truth-valued. I do not want an account on which truth requires possible verification.

  What I want from you is a principle, or a short set of rival principles, stated precisely enough to be applied mechanically: for each clause, the case above that motivated it. Then its verdicts on cases I have not listed — a coin flip that is scheduled but never performed because the flipper is hit by a bus; a claim that an algorithmic trading system will move a price, where the system reads the forecast itself; a claim about an event that will occur after my own death and concerns someone I love; a claim about a coin flipped and read in a sealed room that is then destroyed with no surviving record. And an honest account of which of my verdicts each candidate forces me to abandon, since I would rather drop two of them than hold a principle that is really just my职业 habits in fancy dress.

  One further thing I need addressed, because it bears on my work directly. My professional practice — scoring forecasters, resolving prediction markets, ranking models — behaves exactly as if future outcomes already have determinate values, and as if resolution rules can be written after the fact without changing what the forecast was about. Either that practice refutes my verdicts in cases 3, 5 and 12, or my verdicts show that the practice is a useful fiction. If there is a principle that captures my verdicts, I want to know which way it cuts on that, and I want the answer to say plainly if the honest conclusion is that my trade rests on a convenient incoherence.

  Please keep the answer self-contained: no bibliography, no reading list, no citations, and no naming of historical positions as a substitute for the argument. If my pattern happens to have a name in the literature, one clause saying so is welcome, but the work should be in the principle and in what it makes of the cases.
reasoning: |-
  Okay, let me approach this systematically. The user presents a complex philosophical dilemma about future contingents through 13 concrete cases, seeking a coherent principle that aligns with their intuitive verdicts while addressing professional tensions in forecasting work.

  First, I notice the core tension: the user needs to evaluate forecasts as right/wrong in practice, yet feels unease about whether future events are "already true" now. Their cases reveal three recurring concerns: determinism vs indeterminism (cases 1-4), human agency (5,9), and semantic vagueness (12). The professional practice dilemma is particularly acute - scoring forecasts requires treating future outcomes as fixed, which contradicts their verdicts on open futures.

  Looking at their verdict patterns:
  - They accept bivalence for deterministic events (case 1) and past unknowns (2)
  - Reject truth-values for quantum events (4) and free choices (5,9)
  - Struggle with retrospective truth (6 vs 7)
  - Feel asymmetry in negative future claims (9)
  - Acknowledge self-refuting predictions (11)

  The key challenge is reconciling "was true all along" (for resolved predictions) with "was indeterminate" (for genuine contingencies). I consider how different principles handle this:
  - Supervaluationism could unify cases 3,5,9 by treating them as indeterminate until resolved
  - Peirceanism might explain why we can assert disjunctions (case 8) without affirming either disjunct
  - Agent-causal theories could specifically address case 5's desire for "decision not discovery"

  For professional practice, I need to distinguish between:
  - Ontological status (what is true now)
  - Epistemic practices (how we score forecasts)

  The insight is that scoring is always retrospective - we're evaluating the accuracy of a past utterance, not affirming its timeless truth. This resolves the tension: forecasts about open futures aren't "true/false when made" in an ontological sense, but we can still evaluate their correctness after resolution. The practice isn't fictional, just pragmatic.

  For the unlisted cases:
  - Unscheduled coin flip: indeterminate (like case 3)
  - Algorithmic self-fulfillment: truth-value depends on whether the prediction causally affects outcome (like case 11)
  - Posthumous events: true/false if determinate (like case 13)
  - Destroyed coin record: truth-value exists but is unknowable (like case 2)

  The principle should probably preserve their intuition about case 9's asymmetry (accepting "I will never write" as false, rejecting "I will write" as indeterminate) as reflecting how negation works with future contingents. Case 12's hard/soft distinction seems valid - the former concerns ontological indeterminacy, the latter semantic indeterminacy.

  Ultimately, the solution must validate their sense that some futures are genuinely open while providing clear criteria for when bivalence holds. The retrospective evaluation of forecasts can stand as a coherent practice without committing to eternalism about future truths.
answer: |-
  Here is a principle ("Open Futures with Retrospective Resolution") that systematizes your verdicts, stated as three interlocking rules:

  1. **Determinacy Principle**: A future-tensed claim is determinately true/false *now* **only if** either:
     - The outcome is causally determined by present states and laws (Case 1: eclipse).
     - All possible causal paths lead to the same outcome (Case 2: coin already flipped).
     - It describes a structural inevitability (Case 8: excluded middle; Case 13: stellar evolution).

  2. **Indeterminacy Principle**: A future-tensed claim is **neither true nor false** *now* if:
     - It depends on a causally open process (quantum decay, Case 4; free choice, Case 5; unflipped coin, Case 3).
     - The event description is inherently vague until context/resolution defines it (Case 12 soft targets: "blackout," "free and fair election").

  3. **Retrospective Truth Principle**: Once resolved, *all claims* can be assessed as having been **accurate or inaccurate** relative to the actual outcome. This does *not* imply the claim was true/false *when made* (Cases 6, 7, 11).

  ### Application to Your Cases
  - **1 & 2**: Determinately true/false now (Determinacy Principle).
  - **3, 4, 5**: Neither true nor false now (Indeterminacy Principle).
  - **6**: Projection was *accurate* (Retrospective Truth), but not *true in 2019* (Indeterminacy Principle applies retroactively).
  - **7**: "UK will leave" was *not* true in 2015 (Indeterminacy Principle – open future). It became true later (Retrospective Truth).
  - **8**: True now (Determinacy Principle: structural inevitability).
  - **9**: "I will never write a novel" is **false** if you retain the capacity to write one (Determinacy Principle: your current state makes "never" false). "I will write a novel" is **neither** (Indeterminacy Principle: contingent future choice). The asymmetry arises because "never" asserts impossibility *now*, while "will" asserts future actuality.
  - **10**: Neither true nor false now (Indeterminacy Principle: election is open). The perfect record is strong evidence, but doesn’t *make* the claim true.
  - **11**: Prediction was neither true nor false when published (Indeterminacy Principle). *After* the outcome: the first became accurate (Retrospective Truth), the second became inaccurate. Truth values *change* when the event resolves.
  - **12**: Hard targets (eclipse, coin flip): Indeterminacy Principle applies due to causal openness. Soft targets: Indeterminacy Principle applies due to semantic vagueness. Both are "neither," but for distinct reasons (ontological vs. semantic indeterminacy). No need for unification.
  - **13**: True now (Determinacy Principle: governed by fixed physical laws).

  ### Verdicts on New Cases
  - **Scheduled but unflipped coin (bus crash)**: Neither true nor false (Indeterminacy Principle). The outcome was never resolved.
  - **Algorithmic trading forecast (self-reading)**: Neither true nor false when made. If the algorithm acts on its prediction, this creates a *new causal path* – the outcome depends on the prediction itself. Accuracy is assessed retroactively.
  - **Event after your death concerning a loved one**: Determinately true/false if causally determined now (e.g., "my daughter will be 30 on 1 Jan 2050"). Neither if contingent (e.g., "my daughter will become a sculptor").
  - **Destroyed sealed coin flip**: Determinately true/false *once flipped* (Indeterminacy Principle ceases at flip). Your lack of access doesn’t change this (Case 2 analogy).

  ### Your Professional Practice
  - **Not a fiction, not incoherent**: You are applying the **Retrospective Truth Principle**. You score forecasts *based on what actually happened*, not on whether the claim was "true when made."
  - This practice is **compatible** with your verdicts:
    - You resolve markets *after the fact*, assessing accuracy (Retrospective Truth).
    - You don’t require claims to have been true/false *when made* (embracing Indeterminacy for open futures).
    - Example: Scoring a forecaster who said "60% chance" for an open event (Case 3) is valid because you’re evaluating their *probability assessment* against the resolved outcome – not asserting the claim was true/false at the time.

  ### What You Must Abandon
  This principle forces you to drop **one element** of Case 7: You cannot say "In 2015, it was true that the UK would leave." The claim was *accurate* in retrospect, but was *neither true nor false* in 2015 (per Indeterminacy Principle). Your intuition that "the matter was genuinely open" is preserved – that’s *why* it lacked a truth value then.

  ### Principle Summary
  - **Truth/falsehood now** requires causal determination, inevitability, or past fact.
  - **Open futures** (causal or semantic) lack truth values until resolved.
  - **All forecasts** are judged *retrospectively* on accuracy (matching actual outcomes), regardless of their status when made.

  This respects your intuition that the future is genuinely open (rejecting "already fixed" truths for Cases 3, 4, 5, 7, 10), while explaining why your scoring practice is valid and non-fictional. It treats indeterminacy seriously but avoids verificationism (Case 13) or denying excluded middle (Case 8). The cost is accepting that truth values for future contingents *can change* (from indeterminate to true/false) when events resolve.
