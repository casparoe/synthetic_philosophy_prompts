answer: |-
  Below is a complete session plan designed to meet your specifications. I've structured it to build intuition through play, emphasize critical distinctions, and address common objections. The materials, timelines, and handling of potential issues are detailed.

  ---

  ### **Session Overview**
  - **Total Time:** 90 minutes (split into two 40-minute segments with a 10-minute break).
  - **Participants:** 12-16 adults, mixed comfort with numbers.
  - **Materials:** Printed handouts (game matrices), counters, dice, whiteboard, markers, chocolate bars (trivial stakes).
  - **Key Concepts:** Mixed-strategy dominance, iterative elimination, distinction between dominance and advice, weak dominance pitfalls.

  ---

  ### **Handout 1: Game 1 - "The Adventure Game"**
  **Rules**  
  - Pair up. One player is the **Adventurer** (Player 1), the other the **Dungeon** (Player 2).  
  - **Simultaneous choices**:  
    - Adventurer picks **A (Safe)**, **B (Bold)**, or **C (Cautious)**.  
    - Dungeon picks **X (Dragon)**, **Y (Tiger)**, or **Z (Snake)**.  
  - **Payoffs (to Adventurer)**: Use the matrix below. Dungeon’s payoff is the negative (zero-sum).  
  - **Play 5 rounds**. Record choices and payoffs. Highest cumulative payoff wins a chocolate bar.  

  **Payoff Matrix (Adventurer’s Reward)**  
  |          | X (Dragon) | Y (Tiger) | Z (Snake) |
  |----------|------------|-----------|-----------|
  | **A (Safe)**   | 1          | 2         | 1         |
  | **B (Bold)**   | 3          | 4         | 0         |
  | **C (Cautious)**| 0          | 0         | 5         |

  ---

  ### **Timeline: Segment 1 (40 Minutes)**  
  1. **Intro (5 min)**:  
     - Explain the theme: "Today we’ll simplify decisions by eliminating options that are never necessary—even if they seem good. You’ll discover this through play."  
     - Distribute Handout 1. Clarify rules quickly. No definitions of "mixed strategy" yet.  

  2. **Play Game 1 (10 min)**:  
     - Pairs play 5 rounds. Circulate, observe, and note which strategies are popular (e.g., "Bold" against "Tiger" is tempting).  

  3. **Debrief Game 1 (25 min)**:  
     - **Q1**: "Which strategy felt safest for the Adventurer? Why?" (Likely "Safe" due to no losses).  
     - **Reveal the surprise**:  
       - *Write on whiteboard*: "Can a *mix* of Bold and Cautious beat Safe in *all* scenarios?"  
       - Introduce weights: **60% Bold, 40% Cautious**.  
       - Calculate expected payoffs together:  
         - vs. Dragon: \(0.6 \times 3 + 0.4 \times 0 = 1.8 > 1\)  
         - vs. Tiger: \(0.6 \times 4 + 0.4 \times 0 = 2.4 > 2\)  
         - vs. Snake: \(0.6 \times 0 + 0.4 \times 5 = 2 > 1\)  
       - **Key Insight**: Safe is **dominated** by the mix. It’s eliminated not because it’s always worse than one option, but because a blend of others covers all cases better.  
     - **Objection Handling**:  
       - *"Why randomize? I’m not trying to be unpredictable!"*  
         - Clarify: The mix isn’t advice—it’s a tool to prove Safe is unnecessary. Randomization is a *mathematical device*, not a recommendation.  
       - *"Why assume the Dungeon reasons like me?"*  
         - Emphasize: Dominance depends only on the **possibilities** (all columns). It doesn’t assume the opponent’s behavior.  

  ---

  ### **Handout 2: Game 2 - "The Cascade Game"**
  **Rules**  
  - Same pairs. Player 1 is **Explorer**, Player 2 is **Island**.  
  - **Payoffs (to Explorer)**:  
  |          | W (Storm) | X (Quicksand) | Y (Volcano) | Z (Treasure) |
  |----------|-----------|---------------|-------------|--------------|
  | **A (Path)**   | 4         | 2             | 2           | 1            |
  | **B (Boat)**   | 2         | 4             | 2           | 1            |
  | **C (Climb)**  | 3         | 3             | 5           | 1            |
  | **D (Dig)**    | 2         | 2             | 2           | 0            |

  - **Play 10 rounds**. Record choices. Highest payoff wins a chocolate bar.  

  ---

  ### **Timeline: Segment 2 (35 Minutes)**  
  1. **Play Game 2 (10 min)**:  
     - Pairs play 10 rounds. Collect and tally choices (e.g., note frequency of "Treasure" by Island).  

  2. **Debrief Game 2 (25 min)**:  
     - **Step 1: Eliminate Dig (Player 1)**  
       - *Write*: "Can a mix of Path and Boat beat Dig in all scenarios?"  
       - Weights: **50% Path, 50% Boat**.  
       - vs. Storm: \(0.5 \times 4 + 0.5 \times 2 = 3 > 2\)  
       - vs. Quicksand: \(0.5 \times 2 + 0.5 \times 4 = 3 > 2\)  
       - vs. Volcano: \(0.5 \times 2 + 0.5 \times 2 = 2 = 2\) (weakly dominates)  
       - vs. Treasure: \(0.5 \times 1 + 0.5 \times 1 = 1 > 0\)  
       - **Result**: Dig is eliminated (weakly dominated). Reduced matrix: **A, B, C** for Explorer.  

     - **Step 2: Eliminate Treasure (Player 2)**  
       - *Write*: "After removing Dig, is Treasure dominated for the Island?"  
       - Compare to other columns (Storm, Quicksand, Volcano).  
       - vs. Path: Treasure (1) < Storm (4), < Quicksand (2), < Volcano (2) → Loses.  
       - **Result**: Treasure eliminated. Reduced matrix: **W, X, Y** for Island.  

     - **Step 3: Eliminate Climb (Player 1)**  
       - *Write*: "In the reduced game, can a mix of Path and Boat beat Climb?"  
       - Weights: **60% Path, 40% Boat**.  
       - vs. Storm: \(0.6 \times 4 + 0.4 \times 2 = 3.2 > 3\)  
       - vs. Quicksand: \(0.6 \times 2 + 0.4 \times 4 = 2.8 < 3\) → Wait!  
       - **Adjust weights to 70% Path, 30% Boat**:  
         - vs. Storm: \(0.7 \times 4 + 0.3 \times 2 = 3.4 > 3\)  
         - vs. Quicksand: \(0.7 \times 2 + 0.3 \times 4 = 2.6 < 3\) → Still not.  
       - **Insight**: Climb isn’t dominated! Cascade stops.  

     - **Meet Requirement 3 (Mix vs. Advice)**:  
       - Show empirical data (e.g., "Island played Treasure 70% of the time").  
       - *Calculate expected payoffs for Explorer*:  
         - Path: \(0.7 \times 1 + 0.3 \times \text{avg. of W/X/Y}\) ≈ Low  
         - Boat: Similar  
         - Climb: \(0.7 \times 1 + 0.3 \times 5 = 2.2\)  
         - **Best response to 70% Treasure is Climb (2.2)**, not the 50-50 mix (which only dominated Dig).  
       - **Key Distinction**: The mix proved Dig was eliminable, but it’s **not optimal** against actual play. Dominance ≠ advice.  

  ---

  ### **Weak Dominance Coda (10 Minutes, If Time)**  
  - **Demo on Whiteboard**: Two volunteers. Show two matrices:  

    **Matrix 1**  
    |     | L   | R   |  
    |-----|-----|-----|  
    | **U** | 1,1 | 0,0 |  
    | **D** | 0,0 | 0,0 |  

    - **Order 1**: Delete weakly dominated R (0≤0), then delete D (0<1). Survives: U.  
    - **Order 2**: Delete weakly dominated D (0≤0), then delete R (0<1). Survives: U.  

    **Matrix 2**  
    |     | L   | R   |  
    |-----|-----|-----|  
    | **U** | 1,1 | 1,0 |  
    | **D** | 0,0 | 2,2 |  

    - **Order 1**: Delete U (weakly dominated by D? U’s L=1>0, but R=1<2 → not dominated). Delete nothing.  
    - **Order 2**: Delete L (weakly dominated by R? L=1,0 vs. R=1,0/2,2 → not dominated). Delete nothing.  
    - **Punchline**: Order matters! Weak dominance can lead to contradictions. **Stick to strict dominance.**  

  ---

  ### **What Could Go Wrong**  
  1. **Players choose "eliminated" options**:  
     - If someone plays Dig in Game 2, **don’t stop**. Acknowledge: "This shows why we *learned* to eliminate it—it’s suboptimal, but humans aren’t rational robots. The math still holds."  
     - Use it to discuss the gap between theory and behavior.  

  2. **Confusion about mixtures**:  
     - Participants may fixate on "why randomize." Reiterate: "Mixes are proof tools, not prescriptions. We’re deleting options, not telling you to flip coins."  

  3. **Time crunch**:  
     - Prioritize Game 1 and the dominance-vs-advice segment. Skip the coda if needed.  

  4. **Three-player omission**:  
     - **Why skipped**: Simulating uncorrelated opponents requires many rounds to expose coordination. In 90 minutes, it risks conflating mixed strategies with coalitional play.  
     - **Brief explanation**: "The hedge assumes opponents act independently. If they collude, a mix that seemed safe might fail. That’s a deeper topic—for another session!"  

  ---

  ### **Debrief Script**  
  - **Tie key moments to insights**:  
    - *Game 1’s Safe*: "You saw a strong option eliminated by a mix leaning on 'weak' Cautious. That’s the power of covering all scenarios."  
    - *Game 2’s Cascade*: "After Dig and Treasure fell, Climb survived—you couldn’t have predicted that initially."  
    - *Empirical mix*: "When Island spammed Treasure, Climb beat the mix. Dominance guarantees a floor; it doesn’t prescribe plays."  
  - **Final takeaway**:  
    - "Iterative elimination simplifies games by removing 'never optimal' options. But always ask: Is this advice, or just a mathematical guarantee?"  

  ---

  ### **Materials to Verify**  
  - **Game 1 Inequalities** (Safe dominated):  
    - \(0.6 \times 3 + 0.4 \times 0 = 1.8 > 1\) (Dragon)  
    \(0.6 \times 4 + 0.4 \times 0 = 2.4 > 2\) (Tiger)  
    \(0.6 \times 0 + 0.4 \times 5 = 2 > 1\) (Snake)  
  - **Game 2 Inequalities**:  
    - *Dig dominated (50% Path, 50% Boat)*:  
      Storm: \(0.5 \times 4 + 0.5 \times 2 = 3 > 2\)  
      Quicksand: \(0.5 \times 2 + 0.5 \times 4 = 3 > 2\)  
      Treasure: \(0.5 \times 1 + 0.5 \times 1 = 1 > 0\)  
      Volcano: \(2 = 2\) (weak)  
    - *Treasure dominated*: Path:1 < Storm:4, etc. (after Dig’s removal).  
  - **Weak Dominance Matrices**: As above.  

  This design ensures participants *feel* the cascade and dominance-advice distinction through play. The optional coda and frank handling of limitations keep it honest and impactful.
