   Example from the book "Game Theory: Analysis of Conflict" by Roger Myerson, page 50: 

     "Consider a two-player game with the following payoff matrix (player 1 choosing the row, player 2 choosing the column):

              L     M     R
          T   5,0   0,3   0,4
          M   0,3   5,0   0,4
          B   3,0   3,0   3,3

     Myerson then shows that for player 1, a mixture of T and M can dominate B, and then after removing B, player 2 can dominate R by a mixture of L and M, and then after removing R, player 1 can dominate a mixture of T and M by either one? 

     Let's see:

     Step 1: 
          Player 1: Is B dominated? 
            Compare to T: 
               L: 3<5, M:3>0, R:3>0 -> not dominated by T.
            Compare to M: 
               L:3>0, M:3<5, R:3>0 -> not dominated by M.
            Consider a mixture of T and M: say 0.5T+0.5M.
               Against L: 0.5*5+0.5*0=2.5 <3? -> not better.
            Myerson says: 
               "Notice that strategy B is dominated by a randomized strategy that would randomize equally between T and M. This randomized strategy would give expected payoffs of 2.5 against L, 2.5 against M, and 0 against R. Since 2.5<3 and 0<3, this randomized strategy is worse than B. So B is not dominated by this mixture."

          He then says: 
            "But now consider a different randomized strategy for player 1: let him randomize between T and M, but with probability 0.6 on T and 0.4 on M. Then his expected payoff if player 2 chooses L is 0.6*5+0.4*0=3.0, if player 2 chooses M is 0.6*0+0.4*5=2.0, and if player 2 chooses R is 0.6*0+0.4*0=0.0. Since 3.0>=3.0, 2.0<=3.0, and 0.0<=3.0, and there is at least одна строка (R) where 0.0<3.0, this randomized strategy would be better than B if player 2 ever chooses R. But it is not strictly better when player 2 chooses L (3.0=3.0), and it is strictly worse when player 2 chooses M (2.0<3.0)."

          So not dominating.

          Myerson then used this example to show that dominance by mixed strategies is defined by the condition: there exists a mixed strategy that gives a greater expected payoff than the strategy in question, for every possible pure strategy of the other players.

          In this example, he says that B is not dominated by any mixed strategy.

