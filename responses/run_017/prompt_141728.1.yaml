  ### Key Clarifications
  - **Why the games work**: Game 1 reactivates elimination via a 50/50 mix (accessible to all), building confidence. Game 2 creates asymmetry: die-holders discover a 3-mixture dominator, while coin-holders hit a wall, forcing the question: "What if mixtures are restricted?"
  - **Order dependence**: The guess is correct. Restricted elimination stops earlier and becomes order-dependent because removing a strategy may "break" a k-mixture dominator for another strategy (e.g., if a dominator requires strategies S1,S2,S3, but S1 is eliminated early, S3 may no longer be k-dominated).
  - **Debrief focus**: Use Game 2’s asymmetry to argue that k-restricted elimination is weaker and order-dependent. Contrast with unrestricted mixed strategies (die-group) to highlight the gap.
  - **Handling failures**: If groups miss eliminations, use targeted questions (see "fix" in failure_modes) to guide calculations without revealing answers. If time runs short, prioritize comparing Game 2 outcomes.
