  I read popular philosophy of science as a hobby, and I keep bumping in to the same shape of comparison, and I cant get it to behave. Two false claims, one plainly nearer the mark:

  - "The orbit is a circle" against "the orbit is a parabola", when really it's an ellipse. The circle one is much closer — it's just an ellipse with the two foci collapsed into the centre.
  - My guess of 900 beans in the jar against your 2000, true count 940. Mine was closer, full stop.

  The second case is easy: there's a number and a distance from it. The first isn't, and when I try to cash "closer" out as "gets more consequences right", it misbehaves. The circle claim does look like it gets more right than the parabola claim. But if I bolt a false detail onto it — "a circle of radius exactly 1 AU" — I add true consequences too (radius between 0.95 and 1.05, say) and false ones at the same time, so a "more true, fewer false" rule pulls both ways on a claim that has, to my ear, got worse.

  What I keep reaching for instead is a different measure altogether: how much work it would take to repair the claim. The circle needs one small edit; the parabola needs its whole curve swapped out. But the radius-1 circle also needs only one small edit, and there I'm oddly unwilling to call it close. So repair-cost tracks my intuition in the first pair and fights it in the second, and consequence-counting does the reverse — and neither looks like the same animal as the numerical distance in the beans case.

  Does closeness-understood-as-cost-of-repair have an established name? I've a vague memory that Popper is somewhere in the background and that someone showed the consequence-counting version can't be made to work, but I don't trust it. I'm after more than a label: what exactly is the repair-cost notion, how does it come apart from the other two, which of the three (if any) is the real article, and where does repair-cost break down — say when the two claims aren't couched in the same vocabulary, or when there are several equally cheap repairs?

  Last line, with nothing after it, exactly in this form: \answer{<established name, or NONE> | <nearest established notion it has to be distinguished from>}
