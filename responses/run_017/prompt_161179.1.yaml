answer: |-
  Your intuition targets a deep problem in verisimilitude (truthlikeness). Let's dissect:

  **Candidate Concepts & Their Flaws:**
  1.  **Consequence Counting (Popper-inspired):** Closeness = more true consequences, fewer false ones.
      *   **Flaw:** Precisely your radius example. Adding specific false detail ("radius = 1 AU") *increases* true consequences (e.g., "radius > 0.99 AU") alongside false ones. The theory feels *less* truthful, yet consequence count pulls ambiguously. Also susceptible to language dependence/logical paradoxes (Tichý/Miller objections).

  2.  **Numerical Distance/Metric Approach:** Closeness = minimal distance in a parameter space (e.g., |940 - 900| < |940 - 2000|).
      *   **Flaw:** Only works for quantitatively structured claims (beans). Fails utterly for qualitative claims like orbits. "Circle" vs. "Ellipse" vs. "Parabola" aren't points on a number line; they describe *shapes*. Requires a common, numerical parameterization, which often doesn't exist meaningfully.

  3.  **Repair Cost (Your Intuition):** Closeness = minimal effort/modification needed to *make* the claim true.
      *   **Initial Flaw:** Your radius example exposes a weakness. Syntactically, changing "1" to "1.01" AU is a tiny edit, suggesting closeness. But intuitively, the *core claim* "circular orbit" is profoundly wrong, making the specific radius feel *less* truthful than a vague "circle". Repair cost seems sensitive to *how* the falsehood is expressed, not just the underlying error.

  **The Repair-Cost Notion & Its Name:**
  Your "repair cost" aligns most closely with **structural verisimilitude** (specifically, the *similarity* or *content* approaches developed by philosophers like Ilkka Niiniluoto and Theo Kuipers, partly inspired by Pavel Tichý's work countering Popper). The core idea is comparing the *structure* or *content* of propositions/models to the truth, assessing how much of the true structure/content they capture or how similar they are.

  *   **How it differs:**
      *   From **Consequence Counting:** It focuses on the *intrinsic content/structure* of the claims (circle, ellipse) and their similarity, not just tallying logical outputs. Fixing the circle requires a *structural change* (decentering the focus), while fixing the parabola requires a more fundamental *geometric type change*.
      *   From **Numerical Distance:** It handles qualitative, structural differences (like shape concepts) inherently, without requiring reduction to numbers. The "distance" is conceptual/structural complexity of the correction.

  *   **Why it "breaks" in the Radius Case - and How to Fix It:** The minimal syntactic repair ("1" -> "1.01") is cheap, but it *preserves the core false structure* (perfect circularity). A robust structural account distinguishes:
      1.  **Parameter Error:** The radius being slightly off (numerical inaccuracy *within* the correct structural type).
      2.  **Structural/Type Error:** The orbit being fundamentally the wrong *kind* of conic section.
      Repairing the *type error* ("circle" -> "ellipse") is a *structurally deeper and more costly* modification than fixing a parameter *within* the correct type ("1 AU" -> "1.01 AU"). When you say "a circle of radius exactly 1 AU", the *type error* dominates your intuition of untruthfulness. The repair cost for the *type* remains high, even if a parameter tweak is cheap. A good structural account weighs the cost of correcting the *fundamental misconception* more heavily.

  *   **Where Repair Cost (Structural Verisimilitude) Breaks Down:**
      *   **Incommensurable Vocabularies:** If theories use radically different concepts (e.g., phlogiston vs. oxygen), defining a "repair path" or measuring structural similarity becomes extremely difficult or arbitrary. There's no common framework for modification.
      *   **Multiple/Minimal Repairs:** If there are several equally "cheap" structural repairs leading to different truths (or the truth itself is multifaceted), which one defines closeness? (Kuipers' "naive" vs. "refined" similarity attempts to handle this).
      *   **Defining the "Cost" Metric:** What counts as a "unit" of structural change? How to quantify the complexity of moving from one conceptual structure to another? This is non-trivial and context-dependent.
      *   **Truth Dependence:** Defining "closeness" requires knowing the truth to know the minimal repair. This is problematic for fallibilism (we don't know the full truth). Structural accounts often define similarity *relative to a given target* (the best current theory or the postulated true structure).

  **The "Real Article"?** No single notion perfectly captures all intuitions. Each has its domain:
  *   **Numerical Distance:** Rules for quantitative, parametric claims.
  *   **Consequence Counting:** Flawed but historically significant; useful for simple, deductively closed systems.
  *   **Structural Verisimilitude (Repair Cost):** Most promising for capturing closeness of *theoretical models* and *qualitative explanations* where the *structure* of the description matters (like orbits). It aligns best with scientific practice of model revision. It *is* the "real article" for the kind of theoretical comparison you're wrestling with.

  Your orbit example is paradigmatic for structural verisimilitude. The bean example is paradigmatic for numerical distance. Consequence counting struggles with both in different ways. Repair cost (properly understood as structural similarity) handles the orbit case best and explains why the radius-specified circle feels worse: it compounds a major structural error with a minor parametric one.

  \answer{structural verisimilitude | consequence-based verisimilitude}
