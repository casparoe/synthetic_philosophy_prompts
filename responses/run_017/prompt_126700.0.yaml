prompt: |-
  I sit on the ethics committee of a learned society in the social sciences, and we have to decide, at our meeting in three weeks, whether to issue a formal censure that one of our own members — call her R. — has drafted and is pressing us to adopt against a senior figure in the field, call him M. The underlying conduct is not really in dispute: between 2009 and 2013 M. published three papers reporting results from a field experiment in which participants were misled about who was funding the study and what it was for, the deception was never disclosed to them afterwards, and M. has declined either to retract or to attach a note to those papers, though he did stop running studies of that kind. R.'s own dissertation research, published in 2011, rested on exactly the same kind of undisclosed deception, and was never sanctioned, because our code at the time said nothing about deception beyond the signing of consent forms; the Society in fact gave that work a prize in 2012. She has since become the field's most persistent critic of the practice, has asked that her own 2011 paper be retracted, and is the author of the censure motion now before us. M.'s written response is short: the Society has no standing to condemn him, because the person moving the censure did the same thing, because the Society rewarded it when she did it, and because at least four other senior members behaved similarly around the same period and are not being censured.

  We have been going round in circles with the word "hypocrisy," so I would be grateful for a written opinion I can circulate before the meeting that recommends something concrete and dated rather than surveying the positions available. Three things in particular divide us, and I would like you to take them in turn. First, several of my colleagues want to say that a censure is not an act of blaming at all but a declaratory finding that a norm was violated, entered into the record; if that is right, they argue, questions about who is doing the blaming and whether their hands are clean simply drop out. I am not convinced — a censure seems to do something to its target that an entry in a register does not — but I would like the claim tested rather than merely asserted from either side. Second, there is a move R. makes that I have not seen anyone else make: her standing, she argues, is not damaged but improved by the fact that she is condemning the very thing she did, since the condemnation costs her something and binds her to a standard she has already applied against her own work — call it the reformer's exemption if you like, though I am suspicious that it relabels the hypocrisy and then calls it a virtue. Third, there is the Society's own position, which seems to me genuinely hard: we are being asked in 2025 to condemn conduct that our rules permitted, and in R.'s case honored, in 2012, and to do so selectively, since a general inquest into the field's pre-2015 literature would take years and is not what the committee voted to take up.

  What I want from you is a recommendation — adopt the censure, adopt it in some modified form, decline to censure, or postpone pending a specified condition — together with the reasoning behind it, set out as continuous prose with no headings, bullet points, bold text or tables, since this will go out as an email to eight people who will read it on their phones. Please give the strongest version of the case you are rejecting rather than one that is easy to knock down: if you think we should censure, tell me what the most compelling form of M.'s tu quoque actually is and why it fails; if you think we should not, tell me what is genuinely lost by our saying nothing. Do not cite or recommend any literature — we have no library access from where we are meeting and a bibliography would be useless to us — but do make explicit which distinctions are doing the work in your argument, and flag any point at which the recommendation would change if a contested factual question, such as whether M. knew the code was about to be revised when he ran the last of the three studies, were settled the other way.
reasoning: |-
  Okay, let me approach this systematically. The user presents a complex ethical dilemma involving historical practices, institutional accountability, and personal transformation. 

  First, I need to unpack the core tensions: the society must decide whether to censure M for deception in studies conducted 2009-2013, while acknowledging that the complainant R engaged in similar conduct that was rewarded by the same society. The temporal aspect is crucial - the ethical code evolved during this period. 

  The three key issues to address are:
  1) Whether censure is purely declaratory or carries punitive weight
  2) R's claim that condemning her own past behavior strengthens her standing
  3) The society's dilemma of retroactively judging actions permitted under earlier rules

  On the declaratory nature of censure, I consider how institutional rebukes function beyond mere documentation. There's performative weight to formal censure that distinguishes it from neutral record-keeping - it conveys institutional disapproval that can damage professional reputation. This matters because if censure were truly neutral, M's tu quoque argument might hold, but since it carries stigma, the society's inconsistency becomes problematic.

  Regarding R's position, I analyze the concept of moral growth. Her retracting her own work demonstrates consistency, but the society must separate her personal credibility from the institutional action. The reformer argument has merit when considering personal ethics, but the society's historical endorsement creates separate complications.

  The retroactivity concern is thorniest. The society now condemns what it once rewarded, creating legitimate fairness concerns. However, norms evolve, and institutions must sometimes correct past errors. The selective application is defensible if: a) M's case is particularly egregious, b) it serves as a precedent, and c) the society commits to broader review.

  I conclude that censure should proceed but with modifications: it must explicitly acknowledge the society's historical complicity and frame the action as collective accountability. The reasoning balances several principles: the need to uphold current standards, recognition of institutional hypocrisy, and the distinction between personal and organizational responsibility.

  The recommendation emerges from weighing that while M's conduct violated emerging norms (the code was under revision), and ongoing refusal to correct the record compounds the harm, the society must own its role in enabling such practices. The censure thus becomes a statement about present standards rather than purely punitive action against M.
answer: |-
  I recommend that the Committee adopt a modified censure of M., accompanied by a formal acknowledgment of the Society’s historical role in permitting such deceptive practices. This censure should explicitly state that it establishes a current norm of transparency, rejects undisclosed deception regardless of past permissibility, and notes M.’s refusal to correct the scholarly record as an aggravating factor. The motion should be amended to include a commitment to review pre-2015 literature systematically within a defined timeframe (e.g., 18 months), starting with the cases M. referenced. Postponement or inaction would sacrifice the Society’s authority to uphold evolving ethical standards and signal that past institutional failures immunize ongoing misconduct.  

  Let me address the three points dividing you in sequence.  

  First, the claim that censure is merely declaratory—a neutral entry of fact—underestimates its performative and reputational weight. While it formally records a norm violation, its function extends beyond archival notation: it constitutes an act of collective disapproval that alters the target’s standing within the community. A library catalog entry does not imply judgment; a censure does. M.’s *tu quoque* argument ("you rewarded the same conduct") gains force here because selective condemnation risks appearing punitive rather than principled. If censure were truly inert, historical inconsistencies would be irrelevant. But since it carries stigma, the Society’s past endorsement of R.’s identical work creates a legitimate perception of arbitrariness. The strongest version of M.’s defense is not that hypocrisy negates the underlying wrong, but that the Society forfeits moral authority to stigmatize *him specifically* when it honored others for identical acts under identical rules. This compels us to address institutional complicity.  

  Second, R.’s "reformer’s exemption" has merit but cannot fully sanitize the Society’s inconsistency. Her personal reckoning—retracting her own work and campaigning against the practice—demonstrates integrity and costs her professional capital. This *does* bolster her credibility as an advocate: she is not condemning others for flaws she excuses in herself. However, her personal transformation does not automatically restore the Society’s legitimacy in acting *now*. The Society rewarded her deception in 2012; it cannot dissociate from that history by endorsing her individual repentance. Her standing is distinct from the institution’s. To censure M. without confronting the Society’s own past would weaponize R.’s conversion as a tool for selective accountability, undermining the censure’s perceived fairness. The "exemption" works for R. as an individual critic; it does not absolve the Society of its institutional hypocrisy.  

  Third, the Society’s position is indeed difficult but not untenable. Condemning past conduct under current norms is defensible if: (a) the ethical evolution reflects broader disciplinary consensus (e.g., the 2015 code revision), (b) the condemned act is not *merely* retroactively disfavored but represents a persistent harm (here, undisclosed deception compromising participant autonomy and eroding trust in science), and (c) the actor has refused to mitigate that harm (M.’s refusal to retract or correct). The selective application is problematic but manageable. A blanket amnesty for pre-2015 conduct is unjustifiable, yet a case-by-case inquest is impractical. The solution is to treat M.’s censure as a precedent-setting case *and* commit to a systematic review. This avoids arbitrariness: M. is censured not *because* R. targets him, but because his case exposes the harm, and his refusal to correct it compounds the offense. If evidence emerged that M. knew the code revision was imminent during his final study (2013), this would strengthen the censure by suggesting deliberate exploitation of a closing window; conversely, its absence doesn’t exonerate, as the core ethical failing persists.  

  **Why censure with modifications?**  
  Refusing to act implies that ethical progress cannot rectify past wrongs, trapping the Society in its historical errors. M.’s ongoing refusal to correct the record perpetuates harm: readers still encounter misleading papers without context. Postponement for a full audit delays accountability indefinitely. But an unmodified censure invites valid charges of hypocrisy and selectivity. Hence, the censure must:  
  1. **Frame the norm as current but foundational**: State that undisclosed deception violates participant dignity and scientific integrity *as now understood*, and that the Society has a duty to correct the record.  
  2. **Acknowledge institutional failing**: Explicitly note that the Society previously permitted such practices and honored R.’s work, creating a flawed incentive structure.  
  3. **Bind the Society to broader accountability**: Include a mandate to identify and review similarly problematic pre-2015 work (prioritizing cases M. raised), with a clear deadline.  

  **What is lost by doing nothing?**  
  Avoiding censure sacrifices the Society’s capacity to enforce its evolved standards. It suggests that once an ethical violation becomes widespread or institutionally endorsed, it becomes immune to condemnation—even when the actor refuses to redress it. This entrenches a dangerous relativism and undermines the code’s legitimacy. Silence here would signal that convenience trumps accountability.  

  **Recommendation**:  
  Adopt a censure resolution that:  
  - Declares undisclosed deception fundamentally incompatible with current ethical standards;  
  - Notes M.’s refusal to retract or correct as exacerbating the violation;  
  - Acknowledges the Society’s past role in permitting such practices;  
  - Commits to a systematic review of pre-2015 literature for similar ethical concerns (with a preliminary report due at next year’s AGM).  

  This balances condemnation of the act, accountability for ongoing harm, recognition of institutional history, and a path toward consistent application—turning R.’s motion into a catalyst for collective integrity rather than selective blame.
