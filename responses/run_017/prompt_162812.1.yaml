prompt: |-
  I sit on the program committee of a small foundation that is about to commit roughly three years of funding and about eight researchers to a single question: how much evidential weight the most-cited historical collapses — the eastern Mediterranean at the end of the Late Bronze Age, the Classic Maya, Rapa Nui — should carry in any assessment of how fragile a globally connected, industrial, literate civilization is. At the end of the three years the committee must choose between treating those cases as genuine evidence that our own system is fragile and therefore worth spending on institutional and infrastructural resilience, and treating the comparison as a category error: rhetorically vivid, evidentially inert, and a bad reason to move money. Assume a team that can include historically and archaeologically literate researchers, a quantitative social scientist, a philosopher of science, and an economist, but nobody who can generate new primary data — no new excavation, no new proxy records.

  I do not want a survey of the field or a list of things to read. I want a research agenda, with the ordering defended. Some candidate questions I have been circling:

  - what I have been calling the archive asymmetry: the cases we can see are selected for having destroyed the classes and institutions that produced legible records, while systems that lost complexity without losing their archives, and systems that faltered and recovered within a generation, are nearly invisible. How much does that selection effect distort what we think collapse is?
  - the unit question: whether the thing that collapses is a polity, an economy, an information system, or a population, and whether the same event can be a collapse at the scale of palaces and a mild reallocation at the scale of households. Nothing can be counted as a case until this is settled.
  - the gap between complexity loss and welfare loss. My own speculative version is the local-optimum hypothesis: post-collapse societies may sit closer to a local optimum of welfare per unit of energy captured, so that falling complexity is a poor proxy for falling welfare, which would matter enormously for how bad collapse is in expectation.
  - whether it matters what drove a collapse — exogenous climate shock, diminishing returns to complexity, loss of a critical input, institutional brittleness — and whether any of those driver classes plausibly transfers to us.
  - the near-miss problem: we observe failures far more readily than recoveries, so the relevant base rates may be structurally unknowable, which might mean prioritizing questions whose answers change action regardless of the base rate.
  - the second-order question of whether collapse framing itself has political uptake that matters: fatalism, defeatism, or the legitimation of emergency powers.

  Rank these, plus anything better that I have not listed, for a three-year, eight-person program. I want the criteria made explicit and the trade-offs among them argued: how much an answer would actually move the committee's decision, tractability given the no-new-data constraint, how upstream each question is of the others, and neglectedness. Say which two or three questions you would put in year one, which of my candidates are ill-posed or rabbit holes, and what specific finding over the next three years would move a question up or down your list.
reasoning: |-
  Okay, the user is part of a program committee for a foundation funding a three-year research project. They need to determine how much historical collapses should inform the fragility of our current global civilization. The team includes historians, archaeologists, a quantitative social scientist, a philosopher of science, and an economist, but no new primary data can be generated. The user wants a prioritized research agenda with clear criteria.

  First, I need to understand their main goal: to decide whether historical collapses are valid evidence for modern fragility or a category error. The committee has to choose between investing in resilience or dismissing the comparison. The user provided six candidate questions but wants them ranked and evaluated.

  The key criteria for prioritization are impact on decision, tractability, upstreamness, and neglectedness. Impact means how much the answer affects the committee's choice. Tractability considers the no-new-data constraint. Upstreamness is about how foundational the question is. Neglectedness addresses whether the question is understudied.

  Looking at the questions:
  1. **Archive Asymmetry**: How selection bias affects our view of collapse. High impact because it challenges the validity of historical cases. If collapses without record loss are common, it weakens the evidence. Tractability is moderate since they can use existing scholarship. Upstreamness is high as it affects case selection. Neglectedness is medium; some work exists but not synthesized.
  2. **Unit Question**: Defining what collapses. Crucial because without defining the unit, you can't identify cases. High impact and upstream. Tractability is good with conceptual analysis. Neglectedness might be low as there's existing debate, but needs resolution.
  3. **Complexity vs. Welfare Gap**: Whether complexity loss equals welfare loss. High impact for assessing the severity of collapse. If welfare doesn't drop, resilience spending might be less urgent. Tractability is moderate using existing data. Upstreamness is medium; relies on defined cases. Neglectedness is high, as welfare is often overlooked.
  4. **Drivers and Transferability**: Causes of collapse and relevance to today. Impact is high if drivers don't apply to modern systems. Tractability is moderate; comparative analysis is feasible. Upstreamness is medium, needing defined units first. Neglectedness is medium; some studies exist but not systematized.
  5. **Near-Miss Problem**: Base rates of failure vs. recovery. Impact is high but tractability low due to lack of data on near-misses. Upstreamness is medium. Neglectedness is high but hard to address without new data.
  6. **Political Uptake**: How collapse framing affects policy. Important for implementation but less direct on the evidence question. Tractability is high through discourse analysis. Impact is indirect. Neglectedness is medium.

  Ranking them:
  1. **Unit Question**: Must define what's collapsing to even identify cases. High impact and tractable.
  2. **Archive Asymmetry**: Addresses selection bias, which is fundamental to using historical cases. High impact and moderately tractable.
  3. **Complexity vs. Welfare**: Affects the stakes; if welfare isn't harmed, resilience may be less critical. High neglectedness.
  4. **Drivers and Transferability**: Important but relies on prior definitions. Moderate impact and tractability.
  5. **Near-Miss Problem**: Important but low tractability with no new data.
  6. **Political Uptake**: Relevant but secondary to the evidence question.

  Year one should focus on Unit Question and Archive Asymmetry, as they are foundational. Complexity vs. Welfare could start concurrently. Near-Miss and Political Uptake are less critical initially. Drivers might be addressed in year two after units are defined.

  Neglectedness: Complexity vs. Welfare is understudied, making it a priority. Near-Miss is important but hard to tackle, so it's lower. Political Uptake is more about application than evidence.

  Rabbit holes: Near-Miss, due to lack of data, and Political Uptake, which is important but not directly evidential. They should be deprioritized.

  Specific findings that change priority: If the Unit Question resolves quickly, move to Drivers. If Archive Asymmetry shows high bias, it could lower the weight of historical cases. If Complexity vs. Welfare finds welfare drops, it increases urgency.

  The user's deeper needs include a clear framework to justify funding decisions, avoiding wasted effort on intractable questions, and ensuring the research directly informs policy choices. They need actionable insights within three years, leveraging existing data efficiently.
answer: |-
  Here is a prioritized research agenda designed to maximize impact on your committee's ultimate decision within the 3-year/8-person constraint and the "no new primary data" limitation. The ranking is based on four explicit criteria:

  1.  **Impact on Decision:** How directly and substantially would answering this question shift the committee's choice between "genuine evidence" and "category error"? (Weight: Highest Priority)
  2.  **Tractability (No New Data):** Can robust progress be made using existing secondary sources, datasets, models, and meta-analytic techniques? (Weight: High Priority - Constraint is absolute)
  3.  **Upstreamness:** How foundational is this question? Does progress here enable or constrain progress on other critical questions? (Weight: High Priority)
  4.  **Neglectedness:** Is this aspect relatively under-explored compared to its importance, offering higher marginal returns? (Weight: Medium Priority)

  **Prioritized Research Agenda (Ranked):**

  1.  **The Unit Question ("What Collapses?"):**
      *   **Why Ranked #1:**
          *   *Impact:* **Absolute.** If you cannot define *what* collapsed (polity, economy, specific institutions, population, complexity level?) and at *what scale* (elite vs. commoner, regional vs. global), you cannot meaningfully identify "cases," compare them, or assess their relevance to "globally connected, industrial, literate civilization." Failure here makes the entire comparison potentially incoherent.
          *   *Tractability:* **High.** Excellent fit for the team. Historians/archaeologists define historical units & scales. The economist & quantitative social scientist analyze economic/social units & scales (e.g., using network theory, institutional economics). The philosopher of science clarifies concepts (collapse, system, unit) and potential category errors. Requires synthesizing existing scholarship, not new digs.
          *   *Upstreamness:* **Maximum.** This is the bedrock. Answers here determine what counts as a "case" for all subsequent questions (Archive Asymmetry, Complexity/Welfare, Drivers, Near-Misses).
          *   *Neglectedness:* **Medium-High.** While debated, a *systematic, cross-case, interdisciplinary framework* defining the unit and scale of collapse, applicable to both ancient and modern systems, is lacking. Much scholarship assumes the unit implicitly.
      *   **Specific Tasks:** Develop a multi-dimensional typology of "collapse units" (political sovereignty, economic integration, information networks, demographic patterns, complexity proxies) and scales. Apply this typology rigorously to the target cases (LBA, Maya, Rapa Nui) *and* to defining the "unit" of modern global civilization. Assess the commensurability.

  2.  **Archive Asymmetry (Selection Effect):**
      *   **Why Ranked #2:**
          *   *Impact:* **Very High.** Directly challenges the *representativeness* of the historical evidence. If the visible collapses are a highly biased sample (only catastrophic failures destroying archives), they may profoundly mislead us about the *typical* outcomes of systemic stress, including recovery or less dramatic transformations. This could drastically reduce their evidential weight.
          *   *Tractability:* **Moderate-High.** Historians/archaeologists identify cases of *recovery*, *resilience*, or *less dramatic transformation* documented in the archaeological/historical record (e.g., some Egyptian Intermediate Periods, post-Roman West, some Near Eastern cycles). Quantitative social scientist designs methods to estimate the severity of the bias (e.g., comparing "visible" collapses to potentially "invisible" non-collapses/recoveries using proxy data availability as a marker). Philosopher analyzes epistemological implications of selection bias.
          *   *Upstreamness:* **High.** Understanding the bias inherent in the *data source* is crucial before interpreting the data itself (Complexity/Welfare, Drivers). It shapes how we read the cases defined by the Unit Question.
          *   *Neglectedness:* **High.** While historians are aware of source limitations, a systematic, quantitative assessment of *how much* this selection effect distorts our general understanding of "collapse" across multiple cases is rare. The focus is usually on specific cases, not the meta-pattern.
      *   **Specific Tasks:** Catalog documented instances of significant stress *without* total "collapse" (as defined by Unit Q) or with rapid recovery in the archaeological/historical record. Develop a model estimating the probability of an event being archaeologically/historically "visible" based on severity and type of disruption. Quantify the potential gap between the observed "collapse" record and the likely distribution of past outcomes.

  3.  **The Complexity Loss vs. Welfare Loss Gap:**
      *   **Why Ranked #3:**
          *   *Impact:* **High.** If falling complexity (e.g., loss of centralized administration, long-distance trade) does *not* equate to falling human welfare (e.g., health, nutrition, autonomy, security) for significant portions of the population – or even improves it ("local optimum") – then the *stakes* of collapse are fundamentally altered. This directly impacts the cost-benefit analysis of spending on resilience vs. other priorities.
          *   *Tractability:* **Moderate.** Relies on indirect proxies (osteology - stature, pathologies; settlement patterns - dispersion/aggregation; artifact distributions - access to goods; some textual hints). Requires meta-analysis of existing bioarchaeological and settlement data for the target cases and potential comparators. Economist/philosopher/social scientist develop frameworks for conceptualizing and (indirectly) measuring "welfare" in past contexts and modeling the complexity/welfare relationship.
          *   *Upstreamness:* **Medium.** Requires defined "collapse" events (Unit Q) and relies on data filtered by Archive Asymmetry. Its findings are crucial for interpreting the *significance* of collapse.
          *   *Neglectedness:* **Very High.** While gaining attention (e.g., Scott's *Against the Grain*), systematic, comparative analysis of welfare changes during/after "collapse" across multiple cases is nascent. Complexity loss is often the default proxy for societal failure.
      *   **Specific Tasks:** Synthesize existing bioarchaeological, settlement, and artifact data for pre-, during, and post-"collapse" phases in target cases. Develop comparative metrics for relative welfare change. Model potential relationships between complexity proxies and welfare proxies. Explore the "local optimum" hypothesis empirically where possible.

  4.  **Drivers and Transferability:**
      *   **Why Ranked #4:**
          *   *Impact:* **Medium-High.** Establishing if the *causes* of past collapses have plausible analogues today (e.g., climate change vs. modern anthropogenic climate change; institutional brittleness vs. modern political gridlock; dependency on critical inputs like tin vs. rare earths) strengthens the evidential link. If drivers are entirely non-transferable, the comparison weakens.
          *   *Tractability:* **Moderate.** Historians/archaeologists synthesize current consensus on drivers for target cases. Economist/social scientist analyze modern vulnerabilities. Team collaboratively develops a framework for comparing driver classes across radically different systems, assessing functional equivalence (e.g., "loss of critical input" as a category, regardless of the specific input).
          *   *Upstreamness:* **Medium-Low.** Requires defined collapse events (Unit Q) and is somewhat dependent on understanding the nature of the event (Archive Asymmetry, Complexity/Welfare). Its relevance is contingent on the prior questions establishing that the cases *are* valid evidence.
          *   *Neglectedness:* **Medium.** Comparative collapse studies often discuss drivers (e.g., Tainter, Diamond). The specific focus on rigorous *transferability assessment to the modern global system* is less common and needs systematic grounding in the Unit Question.
      *   **Specific Tasks:** Classify primary hypothesized drivers for each target case. Develop criteria for "transferability" (functional similarity, scale similarity, system buffer capacity). Map ancient drivers onto potential modern analogues and assess the strength of the mapping.

  5.  **The Near-Miss Problem (Base Rates):**
      *   **Why Ranked #5:**
          *   *Impact:* **Potentially High, but Uncertain.** Knowing the frequency of recovery vs. failure following major stresses would be crucial for probabilistic risk assessment. However...
          *   *Tractability:* **Low (Major Constraint).** This is the Achilles' heel. Identifying "near-misses" (severe crises that *didn't* lead to collapse) in the deep past with no new data is extremely difficult. The very nature of "near-misses" often makes them archaeologically/historically invisible (see Archive Asymmetry). It relies heavily on imperfect proxies and controversial interpretations.
          *   *Upstreamness:* **Low.** While conceptually important, the difficulty in obtaining reliable answers limits its practical utility for the core decision.
          *   *Neglectedness:* **High.** Precisely because it's hard, it's understudied systematically. But its neglectedness is partly due to its intractability.
      *   **Verdict:** **Rabbit Hole / Ill-Posed (under the constraints).** With no new data, robust estimation of base rates for civilizational collapse/recovery is likely impossible. Resources are better spent elsewhere. Focus shifts to "what can we learn from the *mechanisms* observed in failures, regardless of base rate?" (covered in other questions).

  6.  **Political Uptake of Collapse Framing:**
      *   **Why Ranked #6:**
          *   *Impact:* **Indirect/Long-Term.** While important for *how* findings are used politically (fatalism vs. mobilization, legitimizing emergency powers), this doesn't directly address the *evidential question* of whether the comparison is valid. It's about the implications *after* the committee makes its core decision.
          *   *Tractability:* **High.** Philosopher/social scientist can analyze discourse, historical examples of "collapse" rhetoric, and potential political consequences through literature review and conceptual analysis.
          *   *Upstreamness:* **Low.** This is downstream of the core evidential assessment.
          *   *Neglectedness:* **Medium.** The politics of apocalypse/collapse narratives are studied, but less so specifically in the context of using *deep history* for *modern civilizational risk* policy.
      *   **Verdict:** **Secondary Priority / Potential Rabbit Hole for Core Mission.** Important for implementation *if* the committee decides the evidence *is* valid, but it doesn't help *make* that core evidential decision. Could distract from the primary agenda.

  **Yearly Focus & Team Allocation:**

  *   **Year 1 (Foundation):** Focus overwhelmingly on **Unit Question (3-4 FTE)** and **Archive Asymmetry (3-4 FTE)**. These are the most upstream and highest-impact questions. Philosopher of Science heavily engaged in both. Quantitative social scientist focuses on developing frameworks/metrics for Unit Q and bias modeling for Archive Asymmetry. Economist starts conceptualizing scale/complexity. Historians/archaeologists drive case application for both questions. *Goal:* Establish a robust, defensible definition of "collapse" applicable to ancient and modern cases and quantify the selection bias in the historical record.
  *   **Year 2 (Deepening & Connecting):** Intensify **Complexity vs. Welfare Gap (3-4 FTE)** using the frameworks from Year 1. Advance **Drivers and Transferability (2-3 FTE)** building on defined units. Continue refining **Archive Asymmetry (1-2 FTE)** as complexity/welfare analysis may reveal new aspects of invisibility. Philosopher supports conceptual clarity across all. Economist/social scientist model welfare/complexity relationships and driver transferability. *Goal:* Produce initial assessments of welfare impact during past collapses and the plausibility of driver transfer.
  *   **Year 3 (Synthesis & Decision Support):** Integrate findings from all streams. Prioritize finalizing **Complexity vs. Welfare Gap** and **Drivers and Transferability (4-5 FTE combined)**. Conduct meta-analysis synthesizing Unit, Bias, Welfare, and Driver insights specifically for the target cases and their relevance to modern fragility. Philosopher leads on synthesizing epistemological strengths/weaknesses of the overall comparison. Quantitative social scientist/economist model implications for resilience investment decisions based on integrated findings. *Goal:* Produce a coherent, evidence-based assessment directly addressing the committee's binary choice, highlighting key uncertainties and their implications.

  **Adjustments Based on Findings:**

  *   **If Unit Question resolves quickly/favorably:** Shift resources earlier to Complexity/Welfare and Drivers.
  *   **If Archive Asymmetry shows extreme bias:** This could rapidly diminish the evidential weight of historical collapses, potentially lowering the priority of subsequent questions deeply reliant on that biased data (Complexity/Welfare, Drivers). Focus might shift more towards theoretical modeling of fragility using insights *despite* the bias, or deeper dives into less biased cases (if identifiable).
  *   **If Complexity/Welfare Gap finds minimal or negative welfare loss:** This would significantly reduce the perceived *cost* of collapse, potentially weakening the case for major resilience spending even if collapse is deemed possible. Increase focus on Drivers to assess likelihood.
  *   **If Drivers show strong transferability:** Increases the relevance of historical cases identified via Unit Q, boosting the case for taking them as genuine evidence. Warrants deeper dive into those specific mechanisms.
  *   **If Near-Miss insights emerge serendipitously:** If work on Archive Asymmetry or Complexity/Welfare unexpectedly uncovers strong evidence of recoveries/near-misses, it could be elevated, but this is unlikely to be systematic enough for base rates.

  **Summary of Key Omissions/Rabbit Holes:** The **Near-Miss Problem** is deprioritized due to fundamental intractability with existing data. The **Political Uptake** question, while important contextually, is secondary to the core evidential mission and could distract resources; it should be a minor thread or addressed in final reporting implications, not a primary research focus. This agenda prioritizes questions that directly and tractably challenge or validate the foundational assumptions necessary to use historical collapses as evidence for modern fragility, maximizing the chance of a decisive, well-founded committee recommendation.
