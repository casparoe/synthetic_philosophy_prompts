  Okay, the user is a fourth-year PhD candidate in philosophy focusing on diachronic practical reasoning. They need to draft a comprehensive exam question on advance directives with a "non-accommodation clause" that avoids standard arguments. Their goal is to push students into uncharted territory in practical ethics. 

  First, I consider their core frustration: they want to bypass recycled debates about precedent autonomy vs. best interests or personal identity puzzles. The non-accommodation clause is their clever device to force new analysis. I need to ensure the question traps students in the tensions they outlined—self-undermining authority, iterability, and evidential asymmetry.

  For the question structure, I sketch sub-parts mirroring their three key issues plus the binding-conditions addendum. The model answer must demonstrate how to wrestle with the clause's paradoxical nature without resorting to textbook positions. I mentally flag pitfalls: if students equate authority with personal identity or dismiss the clause as obviously invalid, that should cost marks. 

  The marking scheme needs teeth. Five "must-hit moves" that penalize avoidance tactics. For example, Move 3 (evidential asymmetry) requires engaging probability—missing that drops marks. I consider common failure modes: strong candidates might recognize the asymmetry but botch the justification, calling it "mere paternalism" without grappling with diachronic agency.

  For the A/B differentiation, I note that B scripts will competently rehearse Dworkin or Parfit but stall at the clause's novelty. A scripts must dissect why iteration feels threatening but isn't decisive, or why pathology complicates evidence without resolving it. 

  I spot gaps in their case setup: what if a student argues M.'s directive lacks "stability" because she feared dementia? I close it by specifying M. consulted ethics literature and reflected for years. Also, to prevent wriggling on "moderately severe Alzheimer's," I clarify cognitive impairment while preserving articulated reasoning. 

  Finally, I design the model answer to model unease—no tidy solution, just rigorous weighing of authority-as-process versus frozen autonomy. The surrogacy section forces concrete stakes: probabilistic evidence means we can't duck uncertainty. 

  This feels responsive. The question weaponizes their device, the mark scheme protects the crux, and the model shows how to dance on philosophy's edge.
answer: |-
  Here is the complete exam package designed to meet your specifications, forcing engagement with the novel crux while avoiding standard dialectical paths:

  **Exam Question (as it would appear on paper):**

  **Question:** M., at age 42, executes a detailed advance directive refusing life-prolonging treatment if she develops moderately severe dementia meeting specific clinical criteria, having witnessed a parent's experience. Crucially, the directive includes a "non-accommodation clause": it explicitly states that *if* the later demented M. expresses revised preferences favouring continued life – even if those preferences appear confident, consistent, reflectively articulated (e.g., critiquing the earlier self's values regarding dependence), and well-integrated – those expressions must be treated *solely* as products of the dementia pathology and given *no weight whatsoever* in interpreting or implementing the directive. At age 71, M. meets the specified criteria, presents as content, and articulately requests that the directive be ignored, stating her earlier self was mistaken about the value of dependent life.

  **(A)** Does the non-accommodation clause fundamentally undermine the standard justification for advance directives (extending competent self-government)? Or is such a clause a necessary feature of a robust precommitment device? Explain your reasoning, including how your answer relates to the justification (or limits) of Ulysses contracts in psychiatry. (5 marks)

  **(B)** Suppose the directive were amended to anticipate that the later self might endorse the non-accommodation clause *in principle* but argue *her specific case* is an exception the clause wasn't meant to cover. The earlier self could then add clauses pre-empting this move, and potentially pre-empt further anticipated counter-moves iteratively. Does the possibility of indefinite iteration strengthen, weaken, or leave unchanged the authority of the original directive and its non-accommodation clause? Justify your view. (5 marks)

  **(C)** The directive instructs that later *disagreement* with the directive (however articulate) must be dismissed as pathological noise, while later *agreement* would typically be seen as confirming the directive's validity. Yet both agreement and disagreement occur within the same pathological cognitive state. What, if anything, justifies this evidential asymmetry? If evidence about whether the later self's value revision is "genuine" or "pathology-driven" is irreducibly probabilistic (e.g., 70% likely pathology, 30% likely genuine reflection), what should a surrogate decision-maker do? What principle should guide institutional rules in such probabilistic scenarios? (5 marks)

  **(D)** What conditions (e.g., stability, information, freedom from transient affect/manipulation, survival of reconsideration) must an earlier act like M.'s directive satisfy to have *any* authority over a later self? Is the authority of the earlier self best understood as a binary "switch" flipped by meeting these conditions, or as inherently graded and defeasible? Explain the implications for interpreting directives like M.'s. (5 marks)

  ---

  **Model Answer (Approx. 800 words):**

  The non-accommodation clause poses a profound challenge to the standard model of advance directives as extending self-government. **(A)** While standard directives aim to project autonomy across time, this clause actively disables the later self's capacity to *challenge* or *correct* the earlier decision, even when articulating seemingly rational reasons. This appears self-undermining: autonomy typically requires mechanisms for revision based on new perspectives or reasoned reflection. Disabling this mechanism purchases rigid protection for one exercise of self-government at the cost of negating the very capacity for self-correction that makes autonomy valuable. However, one might argue this is the *essence* of a strong precommitment. Ulysses contracts share this logic: binding oneself against future desires deemed irrational (e.g., refusing future manic-state spending sprees). The key difference lies in the *nature of the incapacity anticipated*. Psychiatry Ulysses contracts target desires arising *from* a clearly defined, episodic pathology *known* to distort judgment. M.'s clause targets expressions arising *within* the core, permanent pathology itself – the dementia *is* the altered state of being, making the "distortion" claim more ontologically fraught. The clause’s self-undermining nature highlights that advance directives are not pure self-government extensions, but rather a *prioritization* of one temporal perspective’s authority over another’s, justified by assumptions about competence and pathology.

  **(B)** Indefinite iteration (pre-empting the "this is an exception" move) doesn't inherently strengthen or weaken the directive's authority in principle. Each iteration merely demonstrates the *earlier self's anticipation* of potential future arguments. However, it doesn't magically grant the earlier self epistemic access to the *actual* phenomenological or evaluative state of the later self. The core problem – the potential disconnection between the earlier self's prediction/model of the later self's state and the later self's actual lived experience and expressed values – remains unchanged by iteration. Iteration might highlight the earlier self's determination but doesn't resolve the fundamental epistemic gap or the ethical question of whether binding a future self to ignore its own articulate expressions, based solely on the *origin* of those expressions (anticipated pathology), is justifiable autonomy or a form of temporal despotism. Authority isn't increased by anticipating more counter-arguments; the legitimacy of the *initial* authority claim is what's at stake.

  **(C)** The evidential asymmetry (dismissing disagreement as noise, accepting agreement as confirmation) is difficult to justify solely on epistemic grounds within the same pathological state. Epistemically, both states are products of the dementia's cognitive effects. The asymmetry arises from a *normative* commitment embedded in the clause: the earlier self *defines* any deviation from her prior values as *ipso facto* invalid *because* of the pathology. Agreement is seen as evidence the "true" self remains; disagreement is evidence the pathology has obscured it. This rests on the earlier self's substantive judgment that the dementia *necessarily* corrupts value judgments related to dependence/continued life. It's a value-laden, not purely evidentiary, stance. In probabilistic scenarios (e.g., 70% likely pathology-driven, 30% likely genuine revision), the surrogate faces deep uncertainty. A strict adherence approach (always follow the directive/clause) prioritizes the earlier self's formal authority and explicit instructions but risks profound harm if the revision is genuine. A best interests approach (weighing the probabilistic evidence) risks violating the directive's core purpose. The most defensible institutional rule might be a *rebuttable presumption* in favour of the directive/clause: the surrogate must follow it *unless* there is clear and convincing evidence (exceeding a high probabilistic threshold, e.g., >80-90%) that the later self's revision is *not* primarily driven by the pathology *and* that honouring the directive would cause severe, irremediable harm to the *current* being's core interests. This balances respect for precedent autonomy with a minimal protection against catastrophic error, acknowledging the irreducible uncertainty.

  **(D)** Conditions for authority include: competence at T1, adequate information/understanding of future states, stability (not a fleeting whim), freedom from coercion/manipulation, and ideally, survival of serious reconsideration ("tested" values). Crucially, these conditions suggest authority is not binary but *graded and defeasible*. A directive executed under transient distress, with poor information, or never reconsidered, holds weaker authority than one meeting all conditions robustly. Furthermore, authority is *defeasible* by significant changes in the later self's competently held values or interests, *if* those changes can be reliably ascertained. Viewing authority as graded and defeasible fundamentally impacts M.'s directive. The non-accommodation clause attempts to render authority *absolute* and *indefeasible* by definitionally excluding any later evidence of change. However, the graded/defeasible view suggests that even a robustly executed directive's authority could be *overridden* if the later self, despite pathology, demonstrably retains sufficient evaluative competence *and* expresses a stable, well-considered contrary preference that doesn't merely reflect the anticipated pathological distortion. The non-accommodation clause is thus an attempt to *stipulate indefeasibility*, but its ethical force depends on whether such indefeasibility can be justified, given the graded nature of the authority it seeks to invoke.

  ---

  **Marking Scheme (Total: 20 Marks; Must-Hit Moves):**

  1.  **Recognize & Diagnose Self-Undermining Tension (4 marks):**
      *   *Hit:* Clearly explains how the clause disables self-correction, contrasting with standard autonomy justification; accurately compares/contrasts with Ulysses contract logic (pathology target difference).
      *   *Failure Mode:* Superficially notes the clause is "strong" or "problematic" without articulating the autonomy paradox; conflates psychiatric Ulysses contracts without noting the ontological/epistemic difference regarding dementia.

  2.  **Analyze Iteration Correctly (4 marks):**
      *   *Hit:* Argues iteration doesn't resolve core epistemic/normative problem (anticipation ≠ access/justification); avoids claiming iteration inherently strengthens/weakens authority magically.
      *   *Failure Mode:* Claims iteration makes the directive "more binding" or shows greater foresight = greater authority; or claims iteration makes it absurd/weaker without grounding in the core problem of temporal authority.

  3.  **Address Evidential Asymmetry & Probabilistic Guidance (4 marks):**
      *   *Hit:* Identifies the normative basis of the asymmetry; proposes a concrete, justified approach for surrogates/institutions under probabilistic uncertainty (e.g., rebuttable presumption with high threshold).
      *   *Failure Mode:* Merely notes the asymmetry is unfair/unjustified without proposing a solution; suggests simplistic "follow directive always" or "ignore directive if doubt" without grappling with uncertainty; fails to address *both* surrogate action *and* institutional rule.

  4.  **Articulate Graded/Defeasible Authority (4 marks):**
      *   *Hit:* Lists relevant conditions; argues convincingly for authority being graded/defeasible; explains how this challenges the clause's attempt at indefeasibility.
      *   *Failure Mode:* Lists conditions but treats them as a checklist for binary validity; asserts authority is absolute/indefeasible without argument; fails to connect graded/defeasible view to the specific challenge posed by the clause.

  5.  **Avoid Stipulation/Reduction & Engage Novelty (4 marks):**
      *   *Hit:* Answers engage the *specific* tensions of the clause (self-undermining, asymmetry, iteration, indefeasibility attempt) without retreating to standard dialectic or stipulation.
      *   *Failure Mode:* Resolves the case by simply stating "earlier self has absolute authority" or "later self is a different person"; spends significant time rehashing Dworkin vs. Dresser or Parfitian identity arguments without applying them *freshly* to the clause's novelty.

  ---

  **A vs. B Scripts & Penalties:**

  *   **Separating A from B:** A scripts will **directly confront the paradoxes** inherent in the non-accommodation clause (self-undermining autonomy, normative asymmetry, the futility of iteration, the clash between graded authority and stipulated indefeasibility). They offer **nuanced analysis** rather than recitation, propose **justified concrete responses** to probabilistic scenarios, and consistently **grapple with the implications** of viewing authority as graded/defeasible for M.'s clause. B scripts will competently **rehearse standard positions** (precedent autonomy, best interests, identity, competence thresholds) and **apply them correctly** to the case *as if the clause were a standard directive*, but will **avoid or fumble** the specific, novel challenges *introduced by the clause itself*. They may mention the clause but fail to see how it transforms the problem.

  *   **Moves That Lose Marks (Penalize -1 to -2 per instance, within the relevant sub-part mark):**
      *   Stipulating the earlier self's authority is absolute without argument.
      *   Resolving the case primarily by asserting the later self is/is not the same person or is/is not competent *in a way that bypasses the clause's specific instructions*.
      *   Dismissing the later self's articulated views solely because she has dementia, *without engaging the clause's specific instruction to do this even when views seem well-integrated/articulate*.
      *   Ignoring the probabilistic element in (C) or proposing an unworkable/unjustified rule (e.g., flip a coin).
      *   Treating the conditions in (D) as a simple binary checklist rather than indicators of graded strength/defeasibility.
      *   Misrepresenting the case facts (e.g., claiming M. later self is incompetent *to express preferences* – the case states she articulates reasons).

  ---

  **Gaps in Case Specification & Fixes:**

  1.  **M.'s Competence/Process at T1 (42):**
      *   *Gap:* A candidate might argue M.'s directive lacks authority because her fear (from watching her parent) constituted undue influence, transient affect, or insufficient reflection.
      *   *Fix:* Explicitly state in the question: "M. executed the directive after extensive consultation with medical ethics literature, discussions with her physician and a therapist specializing in aging, and a period of sustained reflection over several years, demonstrating stability and freedom from acute distress or manipulation."

  2.  **Degree of Later Self's Cognitive Impairment:**
      *   *Gap:* A candidate might wriggle by arguing the "moderately severe Alzheimer's" later self *lacks any capacity* for evaluative judgment, making the clause irrelevant (if she can't reason, her expressions *are* just noise).
      *   *Fix:* Emphasize the cognitive capacity present: "While diagnosed with moderately severe Alzheimer's disease and meeting the specified criteria for profound cognitive decline in the directive, M. at 71 retains the ability to articulate coherent, contextually relevant reasons for her current preference for continued life, reasons that focus on her present experience and critique her past values, consistent with the directive's anticipated scenario."

  3.  **Nature of "Pathology-Driven":**
      *   *Gap:* A candidate might argue *all* preferences in dementia are equally "pathology-driven," rendering the asymmetry question moot or making genuine revision impossible by definition.
      *   *Fix:* Clarify the philosophical tension: "The directive's clause requires disregarding the later self's expressions *even if* they exhibit a form and content that, in a non-demented person, would be indistinguishable from genuine, competent value revision."

  These fixes ensure candidates must engage the core philosophical tensions you've designed around the non-accommodation clause.
