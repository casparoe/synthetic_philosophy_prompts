prompt: |-
  hey — I'm a contracts lawyer (US, commercial; my working vocabulary is offer and acceptance, consideration, illusory promises, conditions precedent and subsequent, the objective theory of intent, liquidated damages, specific performance, good faith and fair dealing). I know basically zero academic philosophy, so: be a careful analytic philosopher here, sketch two or three candidate translations before you settle on one, and don't just fire off your first impression.

  The puzzle I keep chewing on: an eccentric billionaire hands you a vial and a million-dollar offer — if, at midnight tonight, you genuinely intend to drink the vial tomorrow at noon, he wires you the money then and there. The stuff makes you miserably sick for about a day and does nothing else, and he pays on the intention alone, so by noon tomorrow you'd have no reason left to actually drink it. The question everyone makes a fuss about is whether you can really form that intention, given that you know right now that you won't act on it.

  What I want: translate the whole thing into my vocabulary as faithfully as you can. Is this an offer nobody can accept, an illusory promise, a deal with no consideration, a condition precedent on a state of mind — or something else? Run it in three variants and say which mapping fits each: (1) the bare midnight payment; (2) you also sign an enforceable promise to drink, with a liquidated-damages clause if you don't; (3) he pays only if he correctly predicts, at midnight, that you really will drink at noon.

  Then the residue report. What in the philosophers' version has no counterpart in contract doctrine at all — I suspect it's something about intentions being things you do rather than things you observe, and about whether you can have one while knowing you won't act — and is that a genuine gap in my framework, or a sign that the puzzle is thinner than it looks? Keep the settled background clearly separate from what people who actually work on intention and rationality still disagree about, and flag it rather than smoothing it over when the reading you're giving me is contested.
