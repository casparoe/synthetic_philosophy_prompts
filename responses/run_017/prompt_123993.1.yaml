  i've got the last session of my phil of physics seminar and we're ending on probability in everettian quantum mechanics: every outcome of a measurement happens in some branch, the branches are all equally real, and the Born rule still says the probabilities are the squared amplitudes. i'd like to close by reading a sestina instead of summarizing, with the form doing the arguing. Pick six end-words, three from the how-many vocabulary (count, one, many, that sort of thing) and three from the how-much one (measure, weight, ...), and let the rotation show why the how-many words can't deliver the numbers — there isn't a well-defined number of branches to count in the first place, and even if there were, a tally wouldn't care about amplitudes. Our TA runs the decision-theory line (an agent who's indifferent to which branch they end up in gets forced to bet at the squared amplitudes); half the room thinks that just relocates the mystery into the agent's preferences. Give both of them their due rather than crowning one, keep it accurate enough that our TA doesn't wince, and let the envoi's trick of getting all six words back into three lines land the point that whatever does the work here has to be a symmetry, not a tally. Most of the room are physics majors with undergrad QM and no philosophy, so no line should need a footnote, and it should read out loud in about ninety seconds. Please skip the move everyone in section keeps making — everything happens somewhere, so nothing is really probable — the problem isnt that the numbers come out zero, its that its unclear what it would even be for the squared amplitudes to be the right ones.
