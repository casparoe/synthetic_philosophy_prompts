  We are constructing an exam question that forces students to engage with the realism debate about representations in neural networks in a specific way, using three stylized findings. The question should avoid being answerable by generic philosophy of science or by simply describing techniques. We have three findings: (i) Convergence, (ii) Proliferation, and (iii) A wrinkle.

  The question should:
  - Force students to define what it would be for a network to have a representation, in a way that makes the findings relevant.
  - Work out which finding discriminates between realism, projectivism, and instrumentalism.
  - Ask what constraint a realist would need to escape (ii) and what is wrong with each candidate constraint (uniqueness, cross-model stability, compositional structure, robustness, etc.).
  - End by asking about the implications for interpretability practice if anti-realism is right.

  We are to write:
  1. The exam question (closed-book, 1500 words in 90 minutes).
  2. A model answer (700-900 words) that flags settled vs. contested points and where it takes a side.
  3. A marking scheme (20 marks) with five must-hit points, notes on common mistakes, and a note on A vs. pass.

  Let's first draft the exam question.

  **Exam Question Draft:**

  ---

  **Comprehensive Examination Question: Representations in Trained Neural Networks**

  **Background:** In the philosophy of cognitive science and AI, a central question is whether the components of trained neural networks (such as features, directions in activation space, or circuits) genuinely represent aspects of the world, or whether they are artifacts of the decomposition methods used by analysts. This question is crucial for the project of interpretability, which aims to understand and control AI systems by identifying such components.

  **Scenario:** Consider the following three stylized empirical findings from interpretability research:

  1. **Convergence:** Two language models (Model A and Model B) are trained from different random initializations on disjoint halves of the same large text corpus. Using a sparsity-based decomposition method (e.g., dictionary learning), a particular direction in the activation space of a layer in Model A is isolated and found to correspond to a specific concept (e.g., "dog"). When this direction is written into the corresponding layer of Model B (via activation addition), it produces the same behavioral change (e.g., increasing the probability of dog-related outputs). Moreover, when the same decomposition method is applied independently to Model B, it recovers an approximately similar direction for the same concept.

  2. **Proliferation:** The same decomposition method, when applied to a vision model, can recover directions for arbitrarily gerrymandered classes (e.g., "images of dogs photographed indoors before 2020" or "images of cats photographed outdoors after 2020"). These directions are just as sparse (i.e., they activate on a small set of neurons), just as causally efficacious under intervention (e.g., steering the model's behavior), and generalize just as well to held-out inputs as directions for ordinary categories (e.g., "dog").

  3. **A Wrinkle:** In the same vision model, steering along the "dog" direction (isolated by the decomposition) does increase dog-related outputs, but it also degrades performance on tasks with no evident connection to dogs (e.g., solving arithmetic problems embedded in images). Additionally, in a text-only model that classifies dog-related sentences correctly, no counterpart to the vision model's "dog" direction is found by the same decomposition method.

  **Question:** Drawing on these findings, address the following:

  (a) What would it mean for a neural network to genuinely have a representation? Define a clear criterion that would allow the above findings to count as evidence for or against genuine representation. Avoid relying on general philosophical positions about unobservables; instead, ground your criterion in the specifics of neural network behavior and interpretability.

  (b) Analyze which of the three findings (Convergence, Proliferation, or the Wrinkle) is most decisive in discriminating between the following three views:
     - **Realism:** The decomposition method discovers pre-existing, causally efficacious representational structures in the network.
     - **Projectivism/Constructivism:** The features depend on the analyst's chosen decomposition method and basis; they are not discovered but constructed by the interpretative act.
     - **Instrumentalism:** Talk of features and representations is merely a useful predictive tool; it does not imply that such structures exist in the network.

  (c) Suppose one wants to defend realism against the challenge posed by Proliferation. What additional constraint (e.g., uniqueness of the decomposition, cross-model stability, compositional structure, robustness under distribution shift, etc.) might a realist appeal to? Discuss at least two candidate constraints. For each, explain why it might help the realist, and then present a problem that undermines it, drawing on the scenario or general considerations about neural networks.

  (d) Finally, if the anti-realist view (either projectivist or instrumentalist) were correct, what would follow for the practice of interpretability? In particular, would the usefulness of these decomposition methods for tasks such as steering model behavior (as in activation addition) and monitoring model internals be undermined? Why or why not?

  **Instructions:** Write a clear, concise essay of approximately 1,500 words. You are not expected to cite specific literature; use the provided scenario and your understanding of the issues. Focus on rigorous argumentation.

  ---

  Now, we need a model answer (700-900 words). We must flag settled vs. contested points and where we take a side.

  **Model Answer Outline:**

  - Introduction: Define the problem and the three views. State that the findings challenge simple realism.
  - (a) Criterion for genuine representation: We propose that a representation must be causally efficacious and stable beyond the analyst's choices. (Contested: There is no consensus on the exact criterion.)
  - (b) Analysis of the three findings:
     - Convergence: Often taken as evidence for realism, but projectivists can argue it's due to shared method. (Settled: Convergence is a key argument used by realists, but not conclusive.)
     - Proliferation: This is the most decisive against realism because it shows that the method can generate any concept, even gerrymandered ones, with the same causal efficacy. This challenges the idea that the representations are natural or pre-existing. (We take a side: Proliferation is the strongest evidence against realism and for projectivism.)
     - Wrinkle: Shows that the representation may not be clean and may have side effects, and that representations are modality-specific. This complicates realism but doesn't decisively refute it. (Contested: Some might see this as evidence for distributed representations, which is a live debate.)
  - (c) Defending realism against Proliferation:
     - Candidate 1: Uniqueness. If the decomposition were unique, then only one set of features would be recovered. Problem: Proliferation shows that for a given model, multiple decompositions (for different concepts) are possible, and the method can generate arbitrary ones. Also, decomposition methods are not unique (e.g., different sparsity levels).
     - Candidate 2: Compositional structure. The realist might argue that genuine representations are part of a compositional system. Problem: Proliferation can produce directions for gerrymandered classes that are not compositional, but they are still causally efficacious. Also, the decomposition method might impose compositionality.
     - Conclusion: No constraint easily saves realism from Proliferation. (This is contested; some realists might argue for a different constraint, but we are taking a side that Proliferation is a strong challenge.)
  - (d) Implications for interpretability: Even if anti-realism is correct, the methods are useful for steering and monitoring. The usefulness does not depend on the features being pre-existing. (Settled: There is consensus that interpretability tools are practically useful regardless of the realism debate.)
  - Conclusion: The evidence, especially Proliferation, supports projectivism. However, interpretability practice can continue on instrumental grounds.

  Now, the model answer:

  ---

  **Model Answer (approx. 800 words):**

  The question of whether neural networks genuinely possess representations is not settled by merely invoking the realism/anti-realism debate from general philosophy of science. Instead, we must define a criterion specific to neural networks and then evaluate the provided findings. I will argue that Proliferation is the most decisive finding against realism and for projectivism, and that while interpretability practice remains useful regardless of the ontological status of representations, the findings challenge a naive realist view.

  **(a) Criterion for Genuine Representation:** For a neural network to genuinely have a representation, there must be a causally efficacious structure within the network that is stable and independent of the analyst's interpretative methods. Specifically, the representation should be (i) *causally involved* in the network's behavior (so that interventions on it change the output in semantically meaningful ways), and (ii) *objectively real* in the sense that it is not an artifact of the decomposition method — it would exist and play the same causal role even if we used a different (but equally valid) method. This criterion allows the findings to test for genuine representation because they probe causal efficacy and independence from the analyst.

  **(b) Discriminating Between Views:** The three views are realism (representations are discovered), projectivism (representations are constructed by the method), and instrumentalism (representations are merely predictive tools).

  - *Convergence* appears to support realism: the same concept is found in two independently trained models, and the direction transfers. This suggests a shared underlying structure. However, projectivists can counter that the convergence is due to the shared decomposition method and training data, not pre-existing structure. Instrumentalists might say it merely shows the method's predictive power. Thus, Convergence is consistent with all three views and not decisive.

  - *Proliferation* strongly challenges realism and supports projectivism. If the same method recovers equally sparse and causally efficacious directions for arbitrary gerrymandered classes (e.g., "dogs indoors before 2020"), then the method is generating these directions rather than discovering them. Realism requires that representations correspond to natural or meaningful categories, but Proliferation shows that even unnatural categories can be isolated with the same causal efficacy. This finding is hard for realists to explain without ad hoc moves, and it suggests that the method constructs features by projecting the analyst's chosen classes onto the network. Instrumentalism is also consistent with Proliferation (the features are useful fictions), but projectivism gains direct support because the features depend on the analyst's gerrymandered classes.

  - *The Wrinkle* complicates realism but is less decisive. The side effects of steering the "dog" direction (e.g., degrading arithmetic performance) might indicate that the representation is not cleanly encapsulated, which realists could explain by distributed representations (a live controversy). The absence of a "dog" direction in the text model does not necessarily refute realism because representations might be modality-specific (a settled point: multimodal alignment is an active research area). Thus, the Wrinkle does not clearly discriminate between the views.

  Therefore, Proliferation is the most decisive finding: it directly challenges the realist claim that representations are pre-existing and natural, and it supports projectivism by showing the dependence on the analyst's choices.

  **(c) Defending Realism Against Proliferation:** A realist might appeal to constraints to argue that only natural categories are genuinely represented.

  - *Constraint 1: Uniqueness.* The realist could require that the decomposition method must yield a unique set of features for a given model. If so, then the gerrymandered directions in Proliferation might be dismissed as non-unique. However, the problem is that the same method applied to the same model produces multiple directions (for natural and gerrymandered classes) that are all causally efficacious. Moreover, decomposition methods (like dictionary learning) are known to be non-unique: different hyperparameters or initializations yield different bases (a settled point). Thus, uniqueness fails.

  - *Constraint 2: Compositional Structure.* The realist might argue that genuine representations must fit into a compositional system (e.g., where "dog" is composed of smaller features). But Proliferation shows that gerrymandered classes (which are not compositional) can be isolated with the same causal efficacy. Furthermore, the decomposition method might impose compositionality artificially. Hence, compositional structure does not rule out gerrymandered representations.

  Other constraints (e.g., robustness under distribution shift) also face problems: a gerrymandered direction might generalize to new inputs if the training data had the relevant correlations. Thus, no constraint easily rescues realism from Proliferation.

  **(d) Implications for Interpretability Practice:** Even if anti-realism (projectivism or instrumentalism) is correct, interpretability methods remain useful. Activation steering (as in Convergence) works regardless of whether the direction is a discovered representation or a constructed artifact — it is a causal handle. Monitoring features for safety or bias does not require realism; it requires only that the features correlate with behaviors of interest. Thus, the practical utility of interpretability is not undermined. This is a settled point: the field of interpretability is driven by empirical success, not ontological commitments. However, if projectivism is true, analysts must be cautious that their chosen decomposition might not reveal the network's intrinsic structure but might instead impose their own categories.

  In conclusion, the findings — especially Proliferation — challenge realism and support projectivism. But interpretability practice can proceed on instrumental grounds, focusing on utility rather than ontological truth.

  ---

  **Marking Scheme (20 marks):**

  Must-hit points (each worth 4 marks) and typical mistakes:

  1. **Definition of genuine representation (part a):** The student must propose a criterion that includes both causal efficacy and independence from the analyst's method (or similar). Typical mistake: Giving a vague or generic definition (e.g., "representations are about something") without specifying how the findings bear on it.

  2. **Analysis of which finding is most decisive and why (part b):** The student must identify Proliferation as the key finding against realism and for projectivism, and explain why Convergence and the Wrinkle are less decisive. Typical mistake: Claiming Convergence supports realism without addressing the projectivist counter, or misattributing the Wrinkle as decisive.

  3. **Defense of realism against Proliferation with two constraints (part c):** The student must discuss at least two constraints (e.g., uniqueness, compositionality) and for each, explain why it fails. Typical mistake: Only describing the constraint without explaining the problem, or choosing a constraint not undermined by Proliferation.

  4. **Implications for interpretability practice (part d):** The student must argue that interpretability remains useful even under anti-realism, and explain why (e.g., causal efficacy for steering). Typical mistake: Claiming that anti-realism undermines all interpretability, or not connecting to the findings.

  5. **Overall argument structure and clarity:** The essay must be well-structured, clear, and address all parts of the question. Typical mistake: Unbalanced focus (e.g., spending too long on part a and rushing part d) or unclear writing.

  **Note on A vs. pass:** An A answer will not only hit the points but also show depth of understanding, for example by:
  - Anticipating objections (e.g., for part c, noting that some realists might appeal to cross-model stability and then explaining why Convergence doesn't solve Proliferation).
  - Nuanced discussion of the Wrinkle (e.g., explaining why modality-specific representations are expected).
  - Clear integration of the findings throughout.

  A pass answer will cover the points but might be superficial, miss nuances, or have minor errors.

  **Flagging in Model Answer:**
  - Settled: The non-uniqueness of decomposition methods (part c) is settled. The practical utility of interpretability regardless of ontology (part d) is settled.
  - Contested: The criterion for genuine representation (part a) is contested. The interpretation of Proliferation as decisive for projectivism is contested (some realists might argue that the gerrymandered features are not "natural" and so not genuine). The live controversy about distributed representations (Wrinkle) is noted.
  - Model answer takes a side: It argues that Proliferation is decisive for projectivism and that realism cannot be easily saved by the constraints.

  We adjusted the question to make Proliferation the central challenge, as per your instruction. The Wrinkle is less decisive, and we have reflected that in the model answer.
answer: |-
  ### Exam Question: Representations in Trained Neural Networks

  **Background:** Interpretability research in AI aims to identify structures in neural networks (e.g., directions in activation space) that correspond to human-understandable concepts. However, it is debated whether these structures genuinely exist in the network as representations or are artifacts of the analyst's decomposition method. Consider the following stylized findings from empirical work on vision and language models:

  1. **Convergence:** Two language models, trained from different initializations on disjoint halves of a corpus, are analyzed using a sparsity-based decomposition method (e.g., dictionary learning). A direction isolated in one model for a concept (e.g., "dog") is found to produce the same behavioral change when inserted into the other model. An approximately similar direction is independently recovered in the second model.  
  2. **Proliferation:** The same decomposition method, applied to a vision model, recovers sparse, causally efficacious directions for arbitrary gerrymandered classes (e.g., "dogs photographed indoors before 2020" or "cats photographed outdoors after 2020"). These directions generalize to held-out inputs and are as effective for steering behavior as directions for ordinary categories (e.g., "dog").  
  3. **A Wrinkle:** Steering a vision model along the "dog" direction increases dog-related outputs but degrades performance on unrelated tasks (e.g., image-based arithmetic). No counterpart to this direction exists in a text-only model that classifies dog-related sentences accurately.  

  **Question:** Using these findings, address the following:  
  (a) What would it mean for a neural network to "genuinely have a representation"? Propose a criterion that determines whether representations exist independently of interpretability methods, and explain how the three findings could confirm or disconfirm it. Avoid general philosophy-of-science arguments; focus on what makes neural networks distinctive.  
  (b) Which finding—Convergence, Proliferation, or the Wrinkle—best discriminates between **realism** (representations are discovered structures), **projectivism/constructivism** (representations depend on the analyst’s decomposition), and **instrumentalism** (representations are predictive tools only)? Justify why this finding is decisive while the others are less so.  
  (c) Suppose a realist wants to reject the challenge from Proliferation. What constraint (e.g., uniqueness of decomposition, cross-model stability, compositional structure, or robustness under distribution shift) could they invoke to argue that gerrymandered directions are not genuine representations? Discuss two constraints, explaining how each might initially support realism and why it ultimately fails.  
  (d) If projectivism or instrumentalism is correct, what would follow for interpretability practice? Could methods like activation steering remain useful for controlling model behavior? Why or why not?  

  **Instructions:** Write a structured essay (~1,500 words) in 90 minutes. No citations needed. Prioritize clear argumentation over breadth.  

  ---

  ### Model Answer (Approx. 850 words)  

  **(a) Criterion for Genuine Representation**  
  For a neural network to "genuinely have a representation," it must contain structures that (i) play a *causal role* in producing behavior relevant to a specific content (e.g., "dog") and (ii) are *stable* under decomposition method variation. Stability means the structure persists across equally valid analytical choices (e.g., different sparsity levels or initialization seeds), ensuring it is not an artifact of the interpretative process. This criterion avoids vague appeals to "aboutness" by tying representation to causal efficacy and method-independence, which are testable via intervention and decompositional robustness.  

  - **Settled consensus:** Causal efficacy is widely accepted as necessary for representation in cognitive science (e.g., interventions are standard in interpretability).  
  - **Contested:** Stability is debated; some argue it is sufficient for realism, while projectivists see it as insufficient without additional constraints.  
  - **Findings as evidence:**  
    - Convergence supports stability if directions recur across models and methods, but could reflect shared training data biases.  
    - Proliferation disconfirms stability if gerrymandered directions are equally recoverable, suggesting dependence on analyst-defined classes.  
    - The Wrinkle challenges causal specificity (e.g., dog direction alters unrelated tasks), implying representations may not be "genuine" if they lack modularity.  

  **(b) Discriminating Finding: Proliferation**  
  Proliferation is the most decisive finding for discriminating between the three views, while Convergence and the Wrinkle are less telling due to their ambiguity.  

  - **Proliferation favors projectivism:** It shows that *any* analyst-defined class—no matter how gerrymandered—yields sparse, causally efficacious directions. This undermines realism by demonstrating that the decomposition method constructs features rather than discovering natural structures. Instrumentalism accommodates this (gerrymandered directions are useful fictions), but projectivism best explains the dependence on analyst choices. Realism struggles, as there is no principled reason why "dogs pre-2020 indoors" should be a real representation.  
    - *Why not Convergence?* Convergence is consistent with all three views. Realists see cross-model stability as evidence of discovery; projectivists attribute it to shared methods/data; instrumentalists view it as successful prediction. It cannot resolve the debate.  
    - *Why not the Wrinkle?* The Wrinkle’s side effects could support distributed representations (a realist view) or projectivism (if decomposition oversimplifies). The missing text-direction may reflect modality-specific coding (settled: models process modalities differently), not anti-realism.  
  - **Settled consensus:** Proliferation is empirically observed in some settings (e.g., anomalous feature recovery in vision models), making it a live tool in debates.  
  - **Contested:** Some realists argue Proliferation arises from flawed methods (e.g., overparametrization), but this is not assumed here.  
  - **Model answer’s side:** Proliferation strongly supports projectivism; the other findings lack comparable discriminatory power.  

  **(c) Realist Constraints and Their Failures**  
  A realist might invoke constraints to exclude gerrymandered directions from "genuine" representations. Two candidates fail:  

  1. **Uniqueness of decomposition:** The realist could argue that genuine representations correspond to the unique "true" decomposition of the network’s activations. Proliferation’s gerrymandered directions would then be artifacts, as multiple conflicting directions exist.  
     - *Why it helps realism:* Uniqueness would imply a privileged basis, independent of the analyst.  
     - *Why it fails:* Dictionary learning and similar methods are demonstrably non-unique (settled: factors like initialization seed or sparsity weight alter results). Proliferation shows that gerrymandered directions are *also* causally efficacious, so privileging "dog" over "dogs pre-2020 indoors" is arbitrary without further constraints.  

  2. **Compositional structure:** The realist might require representations to compose into higher-level features (e.g., "dog" from "fur" and "paw" directions), arguing gerrymandered classes lack compositional coherence.  
     - *Why it helps realism:* Compositionality mirrors human-like reasoning, suggesting cognitive plausibility.  
     - *Why it fails:* Proliferation’s directions are causally effective without compositionality—e.g., "dogs pre-2020 indoors" may not decompose but still steers behavior. Moreover, decomposition methods can impose artificial compositionality (e.g., via sparsity), making it method-dependent.  

  **Contested:** Realists might propose cross-model stability (inspired by Convergence) or robustness under distribution shift. However, Proliferation’s directions could generalize across inputs and models if training data contains correlations (e.g., indoor lighting in pre-2020 dog images), so robustness fails to exclude them.  

  **(d) Implications for Interpretability Practice**  
  If projectivism or instrumentalism is correct, interpretability methods remain useful for practical goals like steering or monitoring, but their epistemic status changes.  

  - **Utility endures:** Activation steering (e.g., inserting directions) works because it exploits causal efficacy—whether the direction is "real" or constructed. Proliferation confirms this: even gerrymandered directions alter behavior predictably. Monitoring features for bias or failure modes does not require realism; correlations suffice.  
  - **Epistemic limits:** Projectivism implies that decompositions reveal more about the analyst’s biases than intrinsic structures. For example, focusing on "dog" may overlook distributed circuits better captured by other methods.  
  - **Settled consensus:** Interpretability’s engineering value (e.g., reducing hallucinations via steering) is empirically established and uncontroversial. Anti-realism does not threaten this.  
  - **Contested:** Some argue projectivism undermines ambitious goals like "mechanistic interpretability" (finding ground-truth circuits), but this is speculative.  

  **Conclusion:** Proliferation best challenges realism by showing that features depend on analytical choices. Realism cannot easily escape this via uniqueness or compositionality. Nevertheless, interpretability remains pragmatically valuable.  

  ---

  ### Marking Scheme (20 marks total)  
  **Must-hit points (each worth 4 marks). Common mistakes in parentheses:**  

  1. **Defines a criterion for genuine representation** that includes causal efficacy and stability/method-independence, and links it to the findings.  
     *(Common mistake: Vague definitions, e.g., "represents something," without operationalizing how findings test it.)*  
  2. **Identifies Proliferation as the key discriminatory finding**, explains why it supports projectivism over realism/instrumentalism, and clarifies why Convergence/Wrinkle are less decisive.  
     *(Common mistake: Choosing Convergence or Wrinkle without addressing their ambiguity.)*  
  3. **Discusses two realist constraints** (e.g., uniqueness, compositionality), explains their initial appeal, and details their failure using Proliferation or general network properties.  
     *(Common mistake: Only describing constraints without explaining failures, or selecting constraints not in the question’s scope.)*  
  4. **Argues that interpretability’s usefulness persists under anti-realism**, grounding claims in causal efficacy (e.g., steering in Proliferation/Convergence).  
     *(Common mistake: Claiming anti-realism invalidates all interpretability, or ignoring the findings.)*  
  5. **Clear structure and argumentation**: Addresses all question parts, avoids tangents (e.g., general realism debates), and uses findings consistently.  
     *(Common mistake: Unbalanced focus, e.g., lengthy part (a) with rushed part (d).)*  

  **A-grade vs. Pass distinction**:  
  - **A-grade**: Nuance in applying findings (e.g., noting that the Wrinkle’s modality issue is uncontroversial but irrelevant to projectivism). Anticipates objections (e.g., "A realist might cite Convergence to counter Proliferation, but..."). Explicitly flags settled vs. contested points.  
  - **Pass**: Hits all points but superficially (e.g., mentions constraints without detailing failures). May misattribute findings (e.g., using Wrinkle to refute realism entirely) or overlook the contingency of method-dependence.  

  **Note for graders**: The model answer explicitly takes sides on Proliferation’s discriminatory power and the failure of realist constraints. These are contested; reward alternative views if argued well. Flagged settled points (e.g., non-uniqueness of decomposition, interpretability’s practical utility) are non-negotiable for marks.
