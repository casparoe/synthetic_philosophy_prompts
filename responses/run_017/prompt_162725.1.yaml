prompt: |-
  You are a philosopher of biology who has spent years inside an ecology and evolutionary biology department and knows how these seminars actually go: the empiricists will forgive formalism if it cashes out in something they can measure, and the theoreticians will forgive hand-waving if the bookkeeping is right. Before you draft anything, work out which objections are genuinely damaging rather than merely likely, and don't pad the list with strawmen.

  I'm a postdoc giving a work-in-progress talk next week in our joint EEB/philosophy seminar and I want the Q&A to go well. My thesis is this. The fight over whether the gene or the group is really the unit of selection has been conducted as if it were an empirical dispute, but the standard multi-level decomposition of selection is exact for any partition of a population you like, so no measurement could settle it: choose your partition, run the bookkeeping, and the numbers come out. What differs between partitions is not predictive content but which interventions the model makes visible. So I want an intervention-relative criterion for when a level of selection is a real thing rather than a convenience: a candidate level counts when the entities at that level are connected to their offspring entities by a transmission bottleneck that resets heritable variance at the lower level — germline sequestration in a sexual life cycle, single-cell or single-founder propagation in a colony transfer, that sort of thing. No bottleneck, and lower-level variance leaks through, leaving you an aggregate with no counterfactual grip; a bottleneck, and you get genuine higher-level adaptation. I'm therefore committed to the consequence that group selection should be easy to get in microbes propagated by single-colony transfer and essentially unavailable in most models of human or other vertebrate groups.

  The room will be: behavioural ecologists who think inclusive fitness already settles all of this; our social-insect person, who studies colonies that reproduce by swarming and budding rather than by single-propagule founding; a microbial experimental-evolution postdoc who runs serial-transfer experiments; a theoretician who will want to know exactly what my criterion adds to a decomposition that is already partition-invariant; and two philosophers, one a pluralist who thinks every level is real, one who suspects the whole units-and-levels framework is confused. Give me the six or seven objections I'll actually get, roughly in the order they'll come, each phrased the way that person would phrase it, each with a reply I could deliver in about a minute (under 60 words) and a one-line note on where that reply is soft. Include the question I'm hoping nobody asks. Tag each objection with how likely you think it is and how much damage it does if I handle it badly, and be explicit about your own confidence in those tags. Close with a short note on the single reply you're least confident would actually work on this audience, and why. I'm writing this on a train with no reliable access, so: no citations, no reading lists, nothing I'd need to look up. Whole answer under 850 words.
reasoning: |-
  Alright, let's tackle this. The user is a postdoc preparing for a seminar in a joint EEB/philosophy department. Their thesis argues that the unit of selection debate isn't empirical since multi-level selection decompositions are partition-invariant. Instead, they propose an intervention-relative criterion based on transmission bottlenecks to determine when a level is "real." 

  First, I need to anticipate objections from different audience members. The behavioral ecologists might cling to inclusive fitness as sufficient. The social-insect researcher studies colonies without single-propagule founding, so their work challenges the bottleneck criterion. The microbial postdoc might question how the criterion applies to serial transfers. The theoretician will wonder what the bottleneck adds to existing frameworks. The pluralist philosopher might see the bottleneck as unnecessary, while the other philosopher might doubt the entire units/levels approach. 

  The unasked question about bottlenecks in human groups is critical. If someone points out that cultural transmission or social structures act as bottlenecks, the user's claim that group selection is "essentially unavailable" in vertebrates could crumble. Handling this requires clarifying that biological bottlenecks differ from social/cultural ones, but that's a weak point because the audience might not agree on what constitutes a transmission mechanism.

  For each objection, the replies need to be concise (<60 words) and acknowledge soft spots. The reply to the theoretician about bottlenecks enabling new variation is soft because variance reset isn't always necessary for higher-level traits. The microbial postdoc's objection about variance in serial transfers is tricky—distinguishing between selection and sorting might not convince someone focused on experimental outcomes. 

  Confidence levels: The inclusive fitness objection is highly likely but low damage if deflected by focusing on bottlenecks. The social-insect example is likely and damaging because it directly challenges the criterion's applicability. The microbial question is probable and medium damage; the reply might not satisfy if the postdoc values immediate fitness measures over sorting processes. The theoretician's query is certain and high damage—failing to clarify the bottleneck's added value undermines the whole thesis. The philosopher objections are likely, with medium damage if not addressed well. The unasked question is less likely but catastrophic if raised.

  The weakest reply is to the theoretician. Arguing that bottlenecks allow new higher-level variation might not hold if the audience thinks emergent traits can exist without variance reset. This could lead to deeper debates about emergence, which the user might not have time to resolve in a Q&A.
answer: |-
  Here are the six objections you'll face, ordered by likely sequence, with replies and assessments. Confidence tags: (L)ikelihood 1-5, (D)amage if botched 1-5, (C)onfidence in tags 1-5.

  1.  **Behavioral Ecologist (L5, D2, C4):**  
      *Objection:* "Why reinvent the wheel? Inclusive fitness handles all this without arbitrary partitions or bottlenecks—it directly predicts gene frequency change."  
      *Reply:* "Inclusive fitness is powerful but doesn't show *which* interventions create higher-level adaptation. Bottlenecks explain why some groups evolve group-level traits microbes can't, while others remain gene pools."  
      *Soft Spot:* Conflates explanatory goals; IF proponents may see bottlenecks as just a mechanistic detail.

  2.  **Microbial Postdoc (L4, D3, C4):**  
      *Objection:* "In my serial-transfer experiments, I see group adaptation *without* bottlenecks—variance persists across transfers. Doesn't your criterion falsely rule this out?"  
      *Reply:* "If heritable variance among groups persists without being reset at each transfer (e.g., via mixing), selection acts on *preexisting* group differences, not new group-level traits arising *within* the cycle. Bottlenecks enable the latter."  
      *Soft Spot:* Requires distinguishing "sorting" vs. "adaptation" at the group level; messy empirically.

  3.  **Social Insect Researcher (L4, D4, C4):**  
      *Objection:* "My ant colonies reproduce by budding—multiple queens/workers propagate. No bottleneck, yet we see complex colony-level adaptations. Isn't this a counterexample?"  
      *Reply:* "Budding often involves germline sequestration *within* the propagule (e.g., new queens carry sequestered ova). If lower-level variance leaks (e.g., somatic mutations propagate), adaptation weakens. Check if propagules homogenize variance."  
      *Soft Spot:* Their system may blur "bottleneck"; hinges on precise heritability measurement.

  4.  **Theoretician (L5, D5, C5):**  
      *Objection:* "The Price equation is partition-invariant *without* bottlenecks. What does your criterion add beyond labeling some partitions 'real'?"  
      *Reply:* "Invariance means decompositions are always possible. Bottlenecks justify *why* some partitions support counterfactuals about higher-level adaptation: they reset variance, enabling traits inaccessible to lower-level selection alone."  
      *Soft Spot:* Still abstract; may not satisfy someone wanting formal necessity over explanatory power.

  5.  **Pluralist Philosopher (L4, D3, C4):**  
      *Objection:* "Why deny reality to levels without bottlenecks? Isn't selection acting *somewhere* in every partition? Your criterion seems arbitrary."  
      *Reply:* "I'm not denying selection acts. But without bottlenecks, 'group adaptation' is just differential survival of preexisting groups—no *emergent* group trait evolves. Bottlenecks mark where a new level of agency appears."  
      *Soft Spot:* "Emergent agency" is metaphysically loaded; risks sounding non-operational.

  6.  **Skeptical Philosopher (L3, D4, C3):**  
      *Objection:* "Aren't you smuggling in a teleological view? 'Adaptation' implies design, but bottlenecks are just mechanisms affecting heritability. Why not drop levels-talk entirely?"  
      *Reply:* "Bottlenecks explain the mechanistic conditions for Darwinian processes to generate complex functional traits *at a level*. It's not teleology—it’s about when selection can build novel functions."  
      *Soft Spot:* Doesn't fully address their meta-skepticism about "levels" as fundamental.

  **The Question You Hope Nobody Asks (L2, D5, C3):**  
  *Objection:* "But human cultural groups *do* have transmission bottlenecks—e.g., founder effects or ideological purification. Doesn't your criterion *force* us to accept group selection in humans, contradicting your claim?"  
  *Reply:* "Cultural transmission often lacks germline-like sequestration—ideas/skills recombinantly 'leak' between individuals/groups. Bottlenecks must *reset heritable variance*; cultural founders usually carry preexisting variation."  
  *Soft Spot:* Cultural evolution debates are minefields; this relies on contested analogies to biological heritability.

  **Weakest Reply:** The reply to the **Skeptical Philosopher** is least convincing. Dismissing levels-skepticism by invoking "novel functions" risks circularity ("functions" imply design-by-selection) and won't sway someone rejecting the framework entirely. It addresses symptom (teleology worries) not root cause (ontology of levels). In a seminar, this might devolve into meta-philosophy you can't resolve quickly.
