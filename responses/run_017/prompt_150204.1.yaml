  For the exam question, I'll start by briefly explaining the teletransporter and the dial to set the scene without assuming prior knowledge. I'll focus the prompt on how the dial challenges reductionist views of survival. I need to ensure that students can't just repeat Parfit's standard arguments - they must engage with the gradation introduced by the dial and the implications of branching.

  For the model answer, I'll take the position that Parfit's framework fails to account for the fidelity dial. I'll argue that what matters is not all-or-nothing but comes in degrees, forcing us to rethink prudential reasoning. I'll address connectedness vs continuity, showing how the dial varies connectedness specifically. For the double cases, I'll argue that quantity matters - two replicas at 40 preserve more psychological content than one, meaning branching increases what matters rather than dividing it.

  For the marking scheme, I'll identify five key points: confronting the threshold problem, distinguishing connectedness from continuity, analyzing branching cases quantitatively, addressing prudential deliberation implications, and demonstrating a coherent position. For each, I'll note common errors like ignoring threshold issues or conflating relations.

  For the boundary notes, I'll specify that an A paper must use the dial to challenge reductionist assumptions rather than just apply them, while a B paper might accurately describe but not critically engage. A C paper would miss the dial's purpose entirely and revert to standard arguments.
answer: |-
  ### Exam Question (148 words)
  **Scenario:** A teletransporter scans your body on Earth, destroys it, and creates a replica on Mars. This device has a "fidelity dial" (1-100). At 100, the replica shares *all* your memories, desires, character traits, and skills. Lower settings preserve your core temperament, values, and long-term goals but progressively lose specific memories, fine-grained dispositions, and skills. At 1, the replica is a stranger with only your basic temperament. The original is always destroyed.  
  **Cases:**  
  (A) One replica at 100 fidelity.  
  (B) One replica at 40 fidelity.  
  (C) Two replicas at 100 fidelity.  
  (D) Two replicas at 40 fidelity.  

  **Question:** Reductionists claim personal identity isn’t what matters in survival, proposing psychological relations (e.g., connectedness, continuity) instead. Using Cases A-D, critically evaluate whether reductionism can coherently explain *what matters* given the fidelity dial. Does the dial show that what matters is *gradational*? If so, what problems arise for prudential concern? If not, how does reductionism avoid reintroducing an arbitrary threshold? Address whether Cases C and D suggest branching increases, divides, or is irrelevant to "what matters."

  ---

  ### Model Answer (698 words)
  The fidelity dial exposes a fatal flaw in Parfitian reductionism: its core relations—psychological connectedness (direct links like memory) and continuity (overlapping chains of connectedness)—cannot resolve whether what matters is gradational without collapsing into incoherence or abandoning key anti-identity commitments. I argue the dial forces a gradational view, undermining reductionism’s practical utility while revealing a tension between its descriptive and normative aims.

  **1. The Dial Demands Gradience, Destroying Crisp Boundaries**  
  At 100 fidelity, connectedness and continuity are maximal, satisfying reductionist criteria for "what matters." At 40, specific memories and skills are sparse, weakening connectedness significantly, though continuity remains via temperament and values. If what matters is continuity (as Parfit suggests), Case B should still warrant concern since overlapping chains persist. Yet continuity is preserved even at very low settings (e.g., 10), where prudential concern seems irrational. Conversely, if connectedness is primary, Case B lacks robust links, suggesting reduced concern. *Neither relation delivers a clear threshold.* Denying gradience forces reductionists to choose an arbitrary cutoff (e.g., "continuity above 30 matters"), mirroring the identity-based boundaries they reject. The dial thus proves that what matters *must* be gradational—survival admits of degrees based on the *richness* of psychological overlap. This is fatal to reductionism’s claim to provide a *clear* alternative to identity.

  **2. Branching Reveals What Matters is Quantitative, Not Relational**  
  Cases C and D compound the problem. Two replicas at 100 (Case C) present standard branching: reductionists typically claim "what matters" is fully present in each, but prudential concern is divided. The dial shows this is inadequate. In Case D (two at 40), if what matters is gradational, we must ask: does doubling replicas *increase* the total "amount" of what matters compared to a single replica at 40? If "what matters" is a relation (e.g., continuity), branching shouldn’t increase it—each replica has the *same* continuity to the original as a single replica would. Yet intuitively, two replicas preserve more psychological content (memories, skills) from the original than one, suggesting a quantitative gain. This implies "what matters" isn’t fundamentally about a relation like continuity, but about the *replication of psychological content*. Two replicas at 40 collectively retain more unique memories/dispositions than one, meaning branching *augments* what matters at lower fidelities. Reductionism, focused on formal relations, cannot capture this without adopting a content-based view antithetical to its framework.

  **3. The Impossibility of Prudential Reasoning**  
  Accepting gradience destroys the practical rationale for reductionism. If survival is a matter of degree (e.g., 40 fidelity = 40% survival), prudential deliberation becomes incoherent. Should you invest in retirement if your 40%-self might not share your goals? Would a 60% survival warrant more concern than 40%? Reductionism aimed to alleviate fear of death by separating identity from survival concerns; but if survival is partial, death becomes a *diminution* of survival rather than its absence, creating new anxieties. Parfit’s claim that "identity is not what matters" loses its liberating force when replaced by a calculus of fractional selves. The dial shows reductionism either accepts debilitating vagueness (making rational self-concern impossible) or smuggles in a threshold, conceding identity’s functional necessity.

  **Conclusion:** The fidelity dial proves reductionism is self-undermining. To handle gradation, it must quantify psychological content, abandoning relational criteria. Branching shows this content is cumulative, not relational. This collapses the distinction between "what matters" and identity, as both now require arbitrary boundaries for practical use. Parfit’s project fails its own test.

  ---

  ### Marking Scheme (20 marks total)
  1. **Confront Threshold Problem** (4 marks): Must argue the dial forces a choice between gradation or an arbitrary cutoff, challenging reductionism’s rejection of sharp identity boundaries. *Common Error:* Merely describing continuity/connectedness without addressing why the dial makes thresholds problematic.  
  2. **Distinguish Connectedness vs. Continuity** (4 marks): Must specify the dial primarily varies *connectedness* (specific links), testing if continuity alone can sustain "what matters" at lower fidelities. *Common Error:* Conflating terms or failing to link fidelity levels to distinct relations.  
  3. **Analyze Branching Quantitatively** (4 marks): Must argue whether two replicas at 40 fidelity *increase* total "what matters" compared to one (suggesting content matters) or merely duplicate relations. *Common Error:* Treating branching identically to Parfit’s original case without addressing fidelity’s effect.  
  4. **Address Prudential Implications** (4 marks): Must show gradation complicates self-concern (e.g., partial survival undermining rational planning), exposing reductionism’s practical limits. *Common Error:* Ignoring normative consequences or asserting Parfit’s "liberation" without critique.  
  5. **Coherent Position** (4 marks): Must take a stance (e.g., gradation is unavoidable and fatal to reductionism) defended using Cases A-D. *Common Error:* Surveying options without commitment or logical structure.

  ---

  ### Boundary Notes
  **A-/B+ Boundary (17-18 vs. 15-16):** A papers use the dial to *critique reductionism’s coherence* (e.g., showing gradation forces abandonment of relational criteria). B+ papers accurately apply reductionist concepts to the dial but don’t challenge their foundations.  
  **B/C Boundary (12 vs. 11):** B papers engage the dial meaningfully but miss one major crux (e.g., branching implications or prudential problems). C papers default to generic Parfit summary (branch-line, "identity doesn’t matter") with superficial/non-specific dial references.
