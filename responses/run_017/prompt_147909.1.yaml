answer: |-
  Below is the decision tree for deflationary theories of truth, designed to start from the core commitment that attributing truth (e.g., calling "the cat is on the mat" true) adds nothing to asserting the claim itself. The tree uses concrete cases and claims (not abstract questions) to branch into named positions, including your specified leaves. The tree is built from the logical space first, with 10 branch questions. Each question is phrased to be answerable based on concrete cases and readings, and every leaf is labeled with a position or "unoccupied." Collapsed branches (where views cannot be separated by the tree) and empty leaves are explicitly flagged and explained.

  The tree incorporates your cases:
  - **Mixed inference**: "Everything in the archive is true; the archive says the bridge is unsafe; so the bridge is unsafe."
  - **Practical success explanation**: Explaining someone's success (e.g., finding water) by citing the truth of their beliefs, not just their contents.
  - **Non-disquotable sentence**: A sentence you cannot disquote (e.g., written in an unreadable script or on a hidden card).
  - **Conservativeness**: Whether adding a truth predicate to a base theory allows deriving new claims about the original subject matter.
  - **Domain-shift**: Assessing truth for mathematical, comic, or normative claims vs. empirical ones.
  - **Saphi case**: An imagined community where a "truth-word" only endorses prior utterances (not self, no generalizations, with deference).
  - **Calibration expressivism**: Truth attributions for a classifier are mere "bookkeeping" for calibration, with no property of truth involved.

  ### **Decision Tree**
  Start from the core commitment: When the cat is on the mat, calling "the cat is on the mat" true adds nothing to asserting it. Any account must respect this.

  1. **Saphi Case**: The Saphi use a word only to endorse a prior utterance by another speaker (never self, no generalizations, with deference). Is this word a truth predicate?  
     - **Yes** → Go to Q2.  
     - **No** → Go to Q3.  

  2. **Calibration Expressivism Case**: For a machine learning classifier, is calling its outputs "true" just bookkeeping for calibration (no property of truth involved)?  
     - **Yes** → Leaf: **Calibration expressivism** (your invented position).  
     - **No** → Leaf: **Unoccupied** (endorsement-only view without calibration).  

  3. **Practical Success Explanation**: Can the truth of a belief (e.g., "water is there") explain practical success (e.g., finding water) in a way irreducible to the belief's specific content?  
     - **Yes** → Go to Q4.  
     - **No** → Go to Q5.  

  4. **Domain-Shift Case**: Is truth uniform across empirical, mathematical, comic, and normative domains (e.g., the same property for "2+2=4" and "the cat is on the mat")?  
     - **Yes** → Go to Q6.  
     - **No** → Leaf: **Alethic pluralism** (e.g., Lynch, Wright).  

  5. **Non-Disquotable Sentence Case**: Can you apply the truth predicate to a sentence you cannot disquote (e.g., written in an unreadable script or on a hidden card) without understanding it?  
     - **Yes** → Go to Q7.  
     - **No** → Go to Q8.  

  6. **Correspondence Intuition**: In cases like "the bridge is unsafe," is truth fundamentally a matter of correspondence (e.g., the belief matches reality) or truthmaking (e.g., facts about the bridge make it true)?  
     - **Yes** → Leaf: **Substantive correspondence or truthmaker view** (e.g., Armstrong, Austin).  
     - **No** → Go to Q9.  

  7. **Conservativeness Case**: When adding a truth predicate to a base theory (e.g., arithmetic), can it derive new claims *only* about the original subject matter (e.g., new arithmetic facts)?  
     - **Yes** → Leaf: **Disquotationalism** (e.g., Quine, Leeds).  
     - **No** → Go to Q10.  

  8. **Mixed Inference Case**: Is the truth predicate eliminable in generalizations like "everything in the archive is true" (e.g., via infinite conjunction) without loss of meaning?  
     - **Yes** → Leaf: **Redundancy view** (e.g., Ramsey, Ayer).  
     - **No** → Leaf: **Prosententialism** (e.g., Grover, Camp, Belnap).  

  9. **Verificationist Case**: Is truth tied to verification (e.g., a claim is true iff it can be verified, even in principle)?  
     - **Yes** → Leaf: **Verificationist anti-realism** (e.g., Dummett).  
     - **No** → Leaf: **Primitivism** (e.g., Davidson, Moore).  

  10. **Bearer of Truth**: Does truth primarily apply to propositions (e.g., the content of "the cat is on the mat") or to sentences/utterances (e.g., the string "the cat is on the mat")?  
      - **Propositions** → Leaf: **Minimalism** (e.g., Horwich).  
      - **Sentences/utterances** → Leaf: **Disquotationalism** (e.g., Quine).  

  ### **Leaves and Positions**
  - **Calibration expressivism**: Your invented position (from Q2 "Yes").  
  - **Unoccupied** (endorsement-only): From Q2 "No"; no one defends this.  
  - **Alethic pluralism**: From Q4 "No".  
  - **Substantive correspondence or truthmaker view**: From Q6 "Yes".  
  - **Disquotationalism**: From Q7 "Yes" or Q10 "Sentences/utterances".  
  - **Redundancy view**: From Q8 "Yes".  
  - **Prosententialism**: From Q8 "No".  
  - **Verificationist anti-realism**: From Q9 "Yes".  
  - **Primitivism**: From Q9 "No".  
  - **Minimalism**: From Q10 "Propositions".  

  ### **Collapsed Branches and Empty Leaves**
  1. **Collapsed branch: Disquotationalism at Q7 and Q10**  
     - Q7 ("Conservativeness Case") and Q10 ("Bearer of Truth") both lead to disquotationalism. They cannot be separated by this tree because disquotationalists (e.g., Quine) answer identically to both cases: They accept non-conservativeness (Q7 "No") and prioritize sentences (Q10 "Sentences/utterances"). To separate them, add a question on the *scope* of disquotation (e.g., whether it applies to non-empirical domains like math). Without this, the tree merges disquotationalism into a single leaf.

  2. **Empty leaf: Unoccupied (endorsement-only view without calibration)**  
     - From Q2 "No". This is empty because it is unattractive: A view that accepts the Saphi word as truth but rejects calibration expressivism would lack the generalization function (essential for truth in most theories) and has no known defenders. It is coherent but unappealing for explaining truth’s role in logic and communication.

  3. **Empty leaf: None from Q9 "No"**  
     - Q9 "No" leads to primitivism, and all combinations are occupied. The tree has no other empty leaves.

  ### **Diagnoses of Collapsed and Empty Cases**
  - **Collapsed disquotationalism**: The tree cannot distinguish between disquotationalism derived from the conservativeness case (Q7) and from the bearer question (Q10) because both paths rely on the same deflationary commitments. Adding a domain-shift question (e.g., "Can disquotation apply to normative claims?") would separate "pure" disquotationalism (only empirical) from broader versions.
  - **Unoccupied endorsement-only view**: Empty due to unattractiveness. It accepts the Saphi word as truth but cannot handle generalizations (e.g., mixed inference), making it inadequate for truth-conditional semantics. No major theory defends this, as even calibration expressivism provides a pragmatic basis for endorsement.
  - **No other empty leaves**: All logical combinations are covered. The tree’s cases ensure substantive correspondence, pluralism, etc., are distinct. Verificationism, primitivism, and correspondence are separated by the explanatory role and domain-shift cases.

  ### **Scoring Notes for Users**
  - **General guidance**: Answer questions based on concrete cases, not abstract intuitions. For example, for Q3 (practical success), consider if explaining a scientist's success *requires* citing truth (e.g., "her true beliefs led to success" vs. "her belief that water was there led to success").
  - **Saphi case (Q1)**: If you think truth’s core function is blind endorsement (not generalization), answer "Yes". Deflationists like minimalists or disquotationalists answer "No" (generalization is essential).
  - **Calibration expressivism (Q2)**: Answer "Yes" only if you see truth as purely instrumental for calibration (no property involved); otherwise, "No" leads to an unoccupied leaf.
  - **Domain-shift (Q4)**: Answer "No" if truth differs for empirical vs. normative/mathematical claims (e.g., truth as justification for norms, correspondence for science).
  - **Non-disquotable sentence (Q5)**: Answer "Yes" if you can call a sentence true without understanding it (e.g., trusting an expert); "No" if understanding is required.
  - **Mixed inference (Q8)**: Answer "Yes" only if you think generalizations can be rephrased without "true" (e.g., infinite conjunctions); redundancy theorists accept this, but prosententialists reject it.
  - **Conservativeness (Q7)**: Answer "Yes" if adding truth adds no new factual claims (e.g., no new physics from truth alone); disquotationalists typically say "No" (it can add logical strength).
  - **Verificationism (Q9)**: Answer "Yes" if truth reduces to verifiability (e.g., unverifiable claims lack truth values).
  - **Bearer (Q10)**: Answer "Propositions" if truth attaches to content (e.g., the thought that the cat is on the mat); "Sentences" if it attaches to linguistic items.

  This tree is usable with core readings (e.g., Horwich for minimalism, Quine for disquotationalism, Dummett for verificationism) and requires no external references. It isolates key commitments through your cases, forcing verdicts on the Saphi (separating endorsement from generalization) and calibration expressivism (your leaf).
