prompt: |-
  I'm retired now — ran a field ecology group for most of my working life — and for the last couple of years I've been sitting in on a philosophy reading group down at the university, where I'm basically the old guy who keeps asking for definitions. We've been doing norms of assertion, and I can't let go of an idea of my own that I think is getting ignored. Call it the calibration norm: an assertion is permissible only if, across the class of assertions the speaker makes at a given confidence level, the proportion that turn out true roughly matches that confidence. If you assert things flatly, with the manner of someone who is certain, and only about half of what you say in that manner is true, you are asserting badly. Its a norm on the practice or the policy, not on the single act, and I know that is half of what is in dispute — don't smooth that over for me, use it.

  What I want is a case to bring to the group. One paragraph, ordinary life (a field station, a survey crew, a lab meeting, a clinic, whatever you like — nothing science-fictional, no perfect predictor, no demon), in which:

  - the speaker flatly asserts that p;
  - p is true;
  - she knows that p — plainly, with no Gettier machinery, no fake barns, no lotteries; on this occasion she did the work and checked;
  - her believing it is reasonable, even exemplary;
  - and still the assertion strikes us as impermissible, and the reason is not tact, politeness, confidentiality, or the avoidance of some bad outcome. It is epistemic: her track record is bad, and the people hearing her have no way to tell which of her claims are the ones she actually checked.

  What the case is for, so you know what counts as cheating: the man in the group who defends the knowledge norm keeps insisting that every case where someone knows and yet shouldn't assert is really about etiquette or consequences, so it never touches the norm of assertion itself. I want a case where the shouldn't is epistemic the whole way down. So don't let the impermissibility come from rudeness, secrets, or downstream harm, and don't stipulate the verdicts — I want them falling out of the four norms.

  Then check it for me. State the proposition asserted, the basis she has for it, and the reference class and hit rate you're using for my norm — and tell me which of the two obvious reference classes you picked and what that choice costs you (everything she asserts, versus only what she asserts flatly at that level). Then say what the truth norm, the reasonable-belief norm, the knowledge norm, and the calibration norm each deliver and why. Tell me which feature of the case is doing the real work, and what happens if I remove it — say, if the hearers could tell which of her claims were the checked ones. And give me the strongest thing my knowledge-norm friend can say back; I'd rather here the real objection than a strawman.

  Start with the scenario itself, one paragraph, no lead-in, no prefacing sentence like Here's a case that works, no restating what I asked for. Put the analysis underneath it, and open that with a single line saying whether the case actually does what I wanted.
reasoning: |-
  We are going to craft a case that meets the user's specifications. The scenario should be in one paragraph, set in an ordinary life context (like a field station, lab, etc.), and must include:

  - A speaker flatly asserting that p.
  - p is true.
  - The speaker knows that p (uncontroversially, without Gettier issues).
  - The speaker's belief is reasonable and exemplary.
  - Yet the assertion feels epistemically impermissible because of the speaker's poor track record at that confidence level, and the hearers cannot distinguish which claims she has actually checked.

  The impermissibility must not stem from politeness, confidentiality, or avoiding harm; it must be epistemic. The goal is to challenge the knowledge norm by showing that even when knowledge is present, assertion can be impermissible due to the speaker's calibration failure.

  **Scenario:**

  At a weekly ecology lab meeting, Dr. Evans, a seasoned but notoriously overconfident field researcher, presents her findings on a recent survey. She points to a map and states flatly, "The northern sector has no invasive mussels present." She did, in fact, conduct a thorough survey of that sector just yesterday, using standardized sampling protocols, and found no mussels. Her claim is true, and she knows it based on her careful work. However, Dr. Evans has a long history of making similarly confident assertions about invasive species absence that later prove false—roughly half the time when she declares an area "clear" with this level of certainty, follow-up surveys reveal she missed established populations. The team, aware of her track record but unable to discern which of her confident claims are backed by her rare diligent efforts and which are her usual rushed overestimations, shifts uncomfortably. They cannot trust this assertion, despite its truth and her knowledge on this occasion.

  **Analysis:**

  **Case Evaluation:** This case successfully meets the user's requirements.

  **Proposition Asserted:** "The northern sector has no invasive mussels present."

  **Basis for Assertion:** Dr. Evans personally conducted a thorough survey of the northern sector yesterday, following standardized sampling protocols, and found no mussels. This is a paradigmatic case of knowledge: she has a true, justified belief (non-Gettiered).

  **Reference Class and Hit Rate:** The reference class is "assertions Dr. Evans makes flatly (with certainty) about the absence of invasive species." The hit rate (proportion true) is roughly 50%, significantly below the near-100% confidence she conveys.

  **Choice of Reference Class:** We use the class of assertions made *at the same confidence level* (flat, certain) *and topic* (invasive species absence). This avoids diluting the reference class with unrelated assertions or those made with hedging. The cost is that it requires hearers to track topic-specific confidence, but in a specialized context like a lab, this is feasible.

  **Application of Norms:**

  1. **Truth Norm (assert only what is true):** Permissible. p is true.
  2. **Reasonable-Belief Norm (assert only what you reasonably believe):** Permissible. Her belief is exemplary; she checked thoroughly.
  3. **Knowledge Norm (assert only what you know):** Permissible. She knows that p.
  4. **Calibration Norm (assert only if your track record at that confidence level matches the conveyed certainty):** Impermissible. Her hit rate for flat assertions of absence is ~50%, far below the near-100% certainty her manner implies.

  **Key Feature:** The hearers' inability to distinguish between Dr. Evans' checked and unchecked claims, combined with her poor track record at this confidence level, creates an epistemic deficit. They cannot rationally rely on her assertion despite her knowledge, making the assertion epistemically irresponsible.

  **Removing Key Feature:** If hearers could reliably tell when she has checked (e.g., if she provided verifiable data logs), the impermissibility would vanish. The calibration norm would not condemn the assertion because the hearers could isolate this well-supported claim from her general unreliability.

  **Strongest Objection from Knowledge-Norm Defender:**  
  "The knowledge norm already implies that assertion requires not just knowledge but also *appropriate expression* of that knowledge. Hearers' reasonable distrust due to the speaker's past failures doesn't make the assertion itself impermissible; it just makes it unwise *for the hearers* to accept it. The speaker fulfilled her epistemic duty by knowing p. The rest is a pragmatic problem of testimony reception, not assertion."

  **Counter to Objection:**  
  The calibration norm targets the speaker's *epistemic license to assert with high confidence*, not just hearer reception. If a speaker's habitual overconfidence systematically misleads hearers about the likelihood of truth, continuing to assert flatly without adjusting confidence or providing evidence is an epistemic failure in the practice of assertion, even on knowing occasions. The norm governs the act's propriety within a social-epistemic practice, not just individual knowledge states.
answer: |-
  At the weekly field station briefing, Mara, a botanist with a decade of experience but a documented tendency toward overconfidence, reviews vegetation data. She taps a map and declares flatly, "There is no *Lantana camara* infestation in the eastern quadrant." She did, in fact, conduct a rigorous sweep of that quadrant yesterday—walking transects, checking known hotspots, and verifying no new growth—so her claim is true, and she knows it indisputably. However, Mara has a history of asserting similar absence claims with identical certainty (e.g., "No invasive grasses in the wetland," "No *Chromolaena* near the creek") only for follow-up surveys to reveal overlooked infestations roughly 50% of the time. The team, while respecting her expertise, knows her track record for such flat declarations is poor but cannot discern which claims stem from rare thoroughness versus habitual haste. Her assertion is met with skeptical silence, as they cannot epistemically trust her, despite her knowledge and diligence this time.

  **Analysis:**  
  This case achieves your goal.  

  **Proposition asserted:** "There is no *Lantana camara* infestation in the eastern quadrant."  
  **Basis for knowledge:** Mara personally conducted a methodical field sweep (transects, hotspot checks, verification), yielding direct evidence of absence. This is uncontroversial knowledge: true, justified, non-Gettiered belief.  
  **Reference class:** Assertions Mara makes *flatly* (with maximal confidence) about *the absence of invasive plant species*.  
  **Hit rate:** ~50% true (half her past flat absence assertions proved false).  
  **Reference class choice:** We used assertions made *at the same confidence level and topic* (invasive species absences), not all assertions. This isolates the calibration failure but risks being too narrow if hearers don’t track topic-specific confidence. A broader class (e.g., *all* flat assertions) might dilute the hit rate if she is reliable elsewhere, weakening the norm’s bite.  

  **Norms’ verdicts:**  
  - **Truth norm:** Permissible. *p* is true.  
  - **Reasonable-belief norm:** Permissible. Mara’s belief is exemplary—she gathered robust evidence.  
  - **Knowledge norm:** Permissible. She knows *p*.  
  - **Calibration norm:** Impermissible. Her hit rate for flat absence claims (~50%) grossly mismatches the near-100% certainty her manner conveys.  

  **Key feature:** The hearers’ inability to distinguish Mara’s rare checked claims from her typical unchecked ones, against her poor track record *at this confidence level*. This creates an epistemic defect: even though she knows *p*, her assertion misleads hearers about its reliability, violating the social-epistemic function of assertion.  
  **Removing this feature:** If hearers could tell she checked (e.g., she shared dated field notes in real-time), the impermissibility vanishes. The calibration norm no longer applies, as hearers can isolate this well-supported claim from her general unreliability.  

  **Strongest knowledge-norm defense:**  
  "Assertion requires knowledge, which Mara has. Hearers’ distrust stems from *their* epistemic limitations, not her assertion’s impermissibility. The knowledge norm governs the act’s correctness based on the speaker’s state, not hearers’ reasonable reactions. Blaming her for their skepticism confuses assertion norms with testimonial-reception norms. Her past failures are irrelevant—on *this* occasion, she satisfies the norm."  

  **Why this bites:** This defense forces you to argue that assertion norms must account for the practice’s social context—where hearers’ warranted trust depends on the speaker’s calibration—not just individual knowledge states.
