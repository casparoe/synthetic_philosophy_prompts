  Scoring key after the quiz:

  Count how many of your answers match each of the following patterns:

  Pattern NL: a,b,a,a,a,a,a,a,a (for Q1-9)
  But wait, not exactly. We have:

  NL: Q1:a, Q2:b, Q3:a, Q4:a, Q5:a, Q6:a, Q7:a, Q8:a, Q9:a

  Pattern R: Q1:b, Q2:a, Q3:b, Q4:b, Q5:b, Q6:a, Q7:a, Q8:a, Q9:a

  Pattern SM: Q1:a, Q2:b, Q3:c, Q4:a, Q5:b, Q6:a, Q7:b, Q8:b, Q9:a

  Pattern RI: Q1:a, Q2:b, Q3:c, Q4:a, Q5:b, Q6:c, Q7:b, Q8:b, Q9:b

  Pattern C: Q1:a, Q2:b, Q3:c, Q4:a, Q5:c, Q6:c, Q7:b, Q8:c, Q9:a

  But note: for Q8, we have C as c, but in the answers for Q8, c is "It's a choice, but not a fully free one because of the pressure." That fits.

  For a given person, count the number of matches for each pattern. The pattern with the highest number of matches is their primary view. If there's a tie, use the tiebreaker.

  If a person's answers don't match any pattern well (e.g., less than 5 matches with any), then they have a mixed view.

  We also need to handle "depends/not sure". We can provide an option d for some questions, but to keep it simple, we might force a choice. Or have d) Not sure, and then in scoring, skip that question. But then we have fewer questions. Better to have an option that doesn't score or is neutral.

  But to keep it pen-and-paper, we'll not have a 'not sure' option. We'll instruct participants to choose the closest answer.

  Tiebreaker question (for when two people have the same highest score for two different patterns, or for when there's a tie in the scoring of one person's pattern matches):

  Tiebreaker: 
     Scenario: Jamie is offered a new job in a different city that would be a big promotion. He is hesitant because it would mean uprooting his family. His family says they support whatever he decides. After much thought, Jamie decides to stay in his current job.
     Question: Is Jamie's decision to stay free?
     a) Yes, because there was no pressure and he thought about it.
     b) No, because he is constrained by his family responsibilities.
     c) It depends on whether staying is in his real interests.

  Expected:
     NL: a
     R: a
     SM: a (if he endorses after thought)
     RI: c (or a if we don't know, but typically RI would look at real interests)
     C: a (he has the capability to choose)

  But this doesn't distinguish well.

  Alternatively, use a case that separates capability from the others.

  Tiebreaker:
     Scenario: Kelly is in a wheelchair and wants to enter a building. There is a flight of stairs with no ramp. The building owner is not around, and there is no law requiring a ramp.
     Question: Is Kelly free to enter the building?
     a) Yes, because no one is actively stopping her.
     b) No, because the physical barrier prevents her.
     c) No, because there should be a ramp, and the lack of one shows a failure of society.

  Expected:
     NL: a (no one is interfering)
     R: a (no arbitrary power is being exercised)
     SM: b (she can't act on her desire) or a? But she can't enter. SM might say she is unfree because of the external barrier. But typically, SM focuses on internal. It's ambiguous.
     RI: b
     C: b (she lacks the capability)

  To distinguish, we might get:
     NL: a
     R: a
     SM: ? Let's say a, because they might not see physical barriers as lack of freedom if no one is responsible? But that's not typical. Berlin's negative liberty includes physical barriers. So for consistency, we should have the negative liberty view say b for this? But wait, in Q3 for the physical barrier in the door being open, they said a. But here the barrier is present.

  This highlights the issue: negative liberty includes the absence of physical barriers, not just human interference. So for Kelly, NL would say: no, she is not free to enter because there is a physical barrier. So b.

  Similarly, R might say: she is not dominated by anyone, so she is free? Or not free because of the barrier? Republican liberty typically doesn't address non-human barriers. So they might say she is free in the republican sense? But that seems odd.

  Given the complexity, we'll use the tiebreaker only for when there's a tie in the scoring, and it will be a separate question not part of the main score.

  Tiebreaker question:
     "In the case of Kelly in a wheelchair facing stairs with no ramp, is she free to enter the building?"
     a) Yes, because no one is stopping her.
     b) No, because the stairs are in her way.
     c) No, because society has failed to provide a ramp, and that is a form of domination by neglect.

  Then:
     NL: b (because freedom requires absence of obstacles, including physical)
     R: c (if we consider societal domination) or a (if not). This is not clear.
     But let's say:
          NL: b
          R: a or c? We'll say a for the standard view? But that's not satisfactory.

  Alternatively, we can avoid the tiebreaker by noting that the main quiz has enough questions.

  Now, to write the quiz.

  Instructions: For each scenario, choose the answer that best reflects your view. Don't overthink; go with your gut.

  Quiz:

  1. Alice works under a manager who has the absolute power to fire her or cut her pay without any process, but in practice the manager is always kind and fair and has never used that power. Alice feels secure and happy in her job. Is Alice free?
     a) Yes, because she isn't actually being interfered with and she's happy.
     b) No, because the manager has arbitrary power over her, even if it's not used.
     c) It depends on whether Alice endorses this situation.

  2. A community has a rule against loud music after 10 PM. Everyone voted on it, and there's a fair process to appeal or change the rule. Ben wants to play loud music at midnight but can't because of the rule. Is Ben free to play loud music at midnight?
     a) Yes, because he had a say in making the rule and can work to change it.
     b) No, because the rule is still stopping him from doing what he wants.
     c) He is free in one sense (because the rule is non-arbitrary) but not in another (because he can't do it).

  3. Carla is in an abusive relationship. Her partner is out but will return in an hour. The door is unlocked, and there is no physical barrier. However, if she leaves, her partner will find her and punish her. She also feels paralyzed and cannot bring herself to leave. At this moment, is Carla free to leave?
     a) Yes, because there is no physical barrier or person physically present preventing her.
     b) No, because she is under the control of her partner and the threat of punishment.
     c) No, because her own psychological state prevents her from acting.

  4. David is a monk in a strict religious order. He has taken a vow of obedience and must follow every command of his abbot without question. David is deeply happy and feels that this life fulfills his true self. Is David free?
     a) Yes, because he is doing what he truly wants and endorses.
     b) No, because he is under the absolute control of another person.
     c) It depends on whether his endorsement is authentic.

  5. Eve is a delivery driver. Her work schedule and pay are set by an algorithm that optimizes for company profit. The algorithm sometimes changes her shifts with no warning and no human to appeal to. Eve has to adapt her life to the algorithm's changes. Is Eve free in her work life?
     a) Yes, because the algorithm isn't a person and she can quit if she doesn't like it.
     b) No, because she is subject to arbitrary changes without recourse, even if it's not a human doing it.
     c) She is free to quit, but not free from the algorithm's control while she's in the job.

  6. Frank is unemployed and has no savings. He is offered a job that pays very little and has terrible conditions, but he must take it or else he won't be able to pay rent. He takes the job. When Frank takes the job, is he acting freely?
     a) Yes, because no one is forcing him; he could choose to be homeless.
     b) No, because his lack of money forces him to take the job.
     c) He is making a choice, but it's not a free one because he has no real alternative.

  7. Grace is addicted to a drug. She wants to quit and believes it's ruining her life, but when she tries to stop, she cannot resist the craving. Right now, she is about to use again. Is Grace free at this moment to not use the drug?
     a) Yes, because there's nothing physically stopping her from throwing it away.
     b) No, because her addiction controls her and she cannot act on her own judgment.
     c) She is free in theory, but the addiction makes it very hard in practice.

  8. Henry is at a party. He really doesn't want to drink alcohol, but everyone else is doing it and he feels intense social pressure. He ends up drinking to fit in, even though he regrets it later. When Henry drinks, is he acting freely?
     a) Yes, because he chose to drink; no one held him down.
     b) No, because the social pressure was overwhelming and he acted against his own desire.
     c) It's a choice, but not a fully free one because of the pressure.

  9. Irene is a successful lawyer who works long hours and is highly paid. She endorses her career and says she loves it. However, her friends see that she is always stressed and unhappy, and they believe she would be much happier as a teacher, which was her childhood dream. Is Irene free in her choice to be a lawyer?
     a) Yes, because she endorses it and is not forced.
     b) No, because she is not acting in her real interests; she is deluded by money and status.
     c) She is free in the sense of having the capability to choose, but maybe not free in the sense of self-awareness.

  Scoring:

  Count how many of your answers match the following patterns. The pattern with the most matches is your primary view.

  Pattern NL: 1a,2b,3a,4a,5a,6a,7a,8a,9a
  Pattern R: 1b,2a,3b,4b,5b,6a,7a,8a,9a
  Pattern SM: 1a,2b,3c,4a,5b,6a,7b,8b,9a
  Pattern RI: 1a,2b,3c,4a,5b,6c,7b,8b,9b
  Pattern C: 1a,2b,3c,4a,5c,6c,7b,8c,9a

  If you have the same number of matches for two or more patterns, you might hold a mixed view. Use the tiebreaker below if needed.

  Tiebreaker (only if you have a tie between two patterns):
     Scenario: Kelly is in a wheelchair and wants to enter a building. There is a flight of stairs with no ramp. The building owner is not around, and there is no law requiring a ramp. Is Kelly free to enter the building?
     a) Yes, because no one is actively stopping her.
     b) No, because the physical barrier prevents her.
     c) No, because society has failed to provide a ramp, and that is a form of domination by neglect.

  Then:
  - If you chose b for the tiebreaker, it might indicate NL or C.
  - If you chose a, it might indicate R.
  - If you chose c, it might indicate R or a social view.

  But this is imperfect. We might instead say: if you have a tie between NL and C, and you choose b, then you are closer to C. If you choose a, then you are closer to NL? Wait, NL should be b. So if you choose b, it fits NL and C. Not helpful.

  Given the time, we'll not use the tiebreaker and instead note that mixed views are common.

  Finally, for the algorithm case (Q5), we can see:
     NL: a (free)
     R: b (not free)
     SM: b (not free)
     RI: b (not free)
     C: c (mixed)

  This shows that NL and C might stretch to see it as free (or partially free).

  We have built the quiz.
answer: |-
  Here’s a 9-question quiz designed to sort your group into the five views of freedom (plus a mixed/catch-all category) based on concrete scenarios. I’ve built it from logical axes: **source of constraint** (external interference, internal state, structural forces), **role of agency** (endorsement, capacity to act), and **nature of power** (arbitrary vs. non-arbitrary). Answers avoid theory-laden terms, and scoring is pen-and-paper simple.  

  **Instructions:**  
  - For each scenario, pick **one** answer (A, B, or C) that feels true to you.  
  - If unsure, go with your gut—don’t skip.  
  - At the end, tally matches using the scoring key.  

  ---

  ### The Quiz  
  1. **The Kind Manager**  
     *Sam’s boss has total power to fire or demote them without explanation, but has always been fair and supportive. Sam trusts their boss and feels secure.*  
     - A) Sam is free: no harm is done, and they’re content.  
     - B) Sam isn’t free: the boss’s unchecked power could be misused.  
     - C) It depends on whether Sam *truly* accepts this arrangement.  

  2. **The Voted-On Rule**  
     *A town votes to ban street parking overnight. Lee disagrees but helped draft the rule and can appeal. One night, Lee can’t park near home because of it.*  
     - A) Lee is free: the rule is accountable and participatory.  
     - B) Lee isn’t free: the rule still blocks what they want to do.  
     - C) Lee has options (e.g., park elsewhere), so they’re free.  

  3. **Paralyzed but Unlocked**  
     *Riley is in a toxic job. One day, the exit is clear, no one is watching, and they want to quit—but they’re too scared to walk out.*  
     - A) Riley is free: nothing outside them is stopping the exit.  
     - B) Riley isn’t free: fear is a barrier like a locked door.  
     - C) Riley isn’t free: they lack the capacity to act.  

  4. **Happy Submission**  
     *Jay volunteers for a community where leaders make all decisions. Jay feels fulfilled, says this aligns with their values, and never questions orders.*  
     - A) Jay is free: they genuinely embrace this life.  
     - B) Jay isn’t free: they’re under another’s control.  
     - C) Jay is free only if this serves their deeper interests.  

  5. **The Algorithm Boss**  
     *A scheduling app sets Kai’s work hours. It changes shifts suddenly based on data (e.g., weather, demand), with no human to complain to. Kai must adapt or lose income.*  
     - A) Kai is free: the app isn’t a person, and Kai agreed to the job.  
     - B) Kai isn’t free: they face arbitrary control with no recourse.  
     - C) Kai is free if they can quit, but not free within the job.  

  6. **No Good Options**  
     *Taylor has chronic pain and needs medication. Insurance only covers a cheaper drug with bad side effects. Taylor takes it, saying, “I hate this, but it’s my only choice.”*  
     - A) Taylor is free: they chose this over worse alternatives.  
     - B) Taylor isn’t free: the system forces this on them.  
     - C) Taylor isn’t free: they lack the ability to get real relief.  

  7. **Social Pressure**  
     *Avery avoids conflict. At a meeting, they strongly disagree with a plan but stay silent to keep the peace, then regret it.*  
     - A) Avery is free: they chose silence over speaking up.  
     - B) Avery isn’t free: inner anxiety overruled their true wish.  
     - C) Avery isn’t free: social dynamics constrained them.  

  8. **The Dream Deferred**  
     *Morgan inherits a family farm. They love the stability but once dreamed of travel. Morgan says, “I’m happy here—those wanderlust thoughts were childish.”*  
     - A) Morgan is free: they own their choice and feel content.  
     - B) Morgan isn’t free: they’re trapped by duty, not desire.  
     - C) Morgan is free only if farming truly enriches them.  

  9. **Hidden Chains**  
     *Dakota works 60-hour weeks, calling it “ambition.” Friends see Dakota exhausted and say, “You’re chasing status, not joy.” Dakota insists they’re thriving.*  
     - A) Dakota is free: they endorse their path.  
     - B) Dakota isn’t free: they’re deluded by external rewards.  
     - C) Dakota is free: they have the power to change jobs.  

  ---

  ### Scoring Key  
  Tally how many times your answers match each letter pattern below. The pattern with your **highest matches** is your primary view. If tied, see the tiebreaker.  

  | View                              | Answer Pattern (Q1–Q9) | Core Idea                                                                 |
  |-----------------------------------|-------------------------|---------------------------------------------------------------------------|
  | **1. Plain Nobody-Is-Blocking**   | A, B, A, A, A, A, A, A, A | Freedom = no external obstacles (physical/legal barriers, coercion).      |
  | **2. No Arbitrary Power**         | B, A, B, B, B, B, A, B, A | Freedom = no one can interfere arbitrarily (even if they don’t).          |
  | **3. Self-Mastery**               | C, B, B, A, B, B, B, A, A | Freedom = acting on desires you endorse as your "true self."              |
  | **4. Real Interests**             | C, B, B, C, B, B, B, C, B | Freedom = acting on your objective interests (even if you don’t endorse it). |
  | **5. Able-to-Do-Things**          | A, C, C, A, C, C, C, A, C | Freedom = having genuine capacity (resources, nerve, opportunities).      |
  | **6. Mixed/Unclassifiable**       | —                       | Combines elements or falls outside standard views (see notes below).      |

  #### What to do with ties:  
  - **Tiebreaker Question:**  
    *Jamie’s town has no buses, and Jamie can’t afford a car. A job requires commuting. Jamie says, “I’d take it if I could get there.” Is Jamie free to take the job?*  
    - A) Yes: no one is stopping Jamie; it’s just bad luck.  
    - B) No: the system’s design denies Jamie access.  
    - C) No: Jamie’s lack of means is the barrier.  
    - **Tiebreak logic:**  
      - If you pick **A**, lean toward **1 (Nobody-Is-Blocking)**.  
      - If you pick **B**, lean toward **2 (No Arbitrary Power)**.  
      - If you pick **C**, lean toward **5 (Able-to-Do-Things)**.  

  #### Notes on Unclassifiable Answers:  
  - A combo like **mostly A’s but B’s on Q4/Q8** has no named defender—it’s rare to reject arbitrary power *only* in personal relationships but accept it in systems. It’s **incoherent** if you value consistency.  
  - **Mostly C’s** might be a **mix of 3, 4, and 5** (e.g., caring about both inner conflict and capacity). Real people hold this, but theorists rarely blend all three.  
  - **1 (Nobody-Is-Blocking) and 5 (Able-to-Do-Things) collapse** on cases like Q3 (paralyzed person) and Q6 (no good options) but separate on Q5 (algorithm): #1 sees algorithms as neutral tools; #5 sees them as capacity-limiters.  

  #### How Each View Handles the Algorithm (Q5):  
  - **1. Nobody-Is-Blocking:** Free (no human blocks you; it’s just tech).  
  - **2. No Arbitrary Power:** Unfree (arbitrary control without recourse).  
  - **3. Self-Mastery:** Unfree (if you resent the changes) or free (if you endorse gig work).  
  - **4. Real Interests:** Unfree (if it exploits you) or free (if it optimizes your welfare).  
  - **5. Able-to-Do-Things:** Mixed (free to quit, unfree within the role).  

  ---

  **Why it works:**  
  - Questions probe **hidden axes** (e.g., Q1/Q2 test tolerance for unused power; Q3/Q7 separate internal vs. external barriers).  
  - Scenarios **don’t telegraph theories** (e.g., Q5’s “algorithm” avoids jargon; Q8’s “dreams” masks real interests).  
  - Scoring is **pen-and-paper friendly** (just count matches).  
  - Tiebreaker resolves close calls between the most confusable views (#1, #2, and #5).  

  Run this with your group—it should spark better arguments!
