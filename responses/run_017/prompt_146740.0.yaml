  - Credibility rule: The testimony was not believed? It wasn't even processed. But there was no credibility assessment; it was lost because of vocabulary.
  - Interpretive rule: The patient couldn't convey because the vocabulary wasn't there -> interpretive.

  In the original case, the idiom was mapped (incorrectly) so it wasn't lost, it was altered. The hypothetical I just described would be interpretive.

  But in the original case, the patient's report was altered, which then led to a credibility deficit. So it's a chain.

  For the committee, the key is the harm: the patient was distrusted at a later time. That points to credibility.

  Final prediction: **credibility type**.
answer: |-
  ### Prediction for the Committee's Verdict
  I predict the committee will rule this case as **epistemic injustice, credibility type**. The implicit rule the committee is running is:  
  **"A system accords less standing as a knower if it creates conditions where a person's testimony is systematically distorted or discounted in a way that affects future credibility, tracks group membership, and denies the person an opportunity to contest or correct the distortion."**  

  This fits because:  
  - **Distortion leading to credibility deficit:** The summarization layer amplified the patient's hedged report into a confident assertion, which later caused a clinician to distrust her. This is a credibility deficit (she was treated as unreliable) that "tracked something about who she is" (interpreter-mediated, low-health-literacy patient).  
  - **Systematic group disparity:** The audit shows the distortion (hedge-stripping) occurs 3x more for marginalized groups.  
  - **No opportunity to contest:** Patients cannot review or correct the summary, paralleling Precedent 1 (no chance to contest the low-urgency score) and Precedent 4 (no appeal for unread messages).  
  - **Why not interpretive?** The harm wasn't primarily about lacking shared vocabulary (the patient conveyed her report, and it was recorded). Instead, it was about the system's distortion leading to disbelief.  
  - **Why not no injustice?** Unlike Precedent 2 (errors corrected) or Precedent 5 (discount was warranted), the distortion was systematic, group-based, and uncorrectable.  

  ### Two Candidate Rules Fitting All Precedents
  Both rules explain all five precedents but diverge on the new case. Each rule has three parts: (1) credibility type condition, (2) interpretive type condition, (3) no-injustice condition.  

  **Rule A (Moment-of-Encoding Focus)**  
  - **Credibility type:** Injustice occurs if, at the moment testimony is received and encoded, the system assesses and discounts credibility (e.g., lowers urgency, routes to unread) without recourse, and this tracks group membership.  
  - **Interpretive type:** Injustice occurs if the system lacks structures to capture testimony due to excluded groups in design, preventing knowledge from being registered at all.  
  - **No injustice:** If testimony is fully heard, recorded, and any discount is warranted (or correctable), without group-based disparities.  
  *Prediction for new case:* **No epistemic injustice** or **interpretive type**.  
  - *Reasoning:* At encoding, the system gave the patient *more* credibility (overstated her report) rather than discounting it. The later credibility deficit arose from a clinician’s independent judgment, not the system’s initial assessment. This matches Precedent 5 (discount was post-encoding and warranted). Alternatively, it could be interpretive type because the system erased hedges/idioms due to design exclusion (no patient input), preventing nuanced testimony from being captured.  

  **Rule B (Systemic-Outcome Focus)**  
  - **Credibility type:** Injustice occurs if the system enables a credibility deficit (discounting or distortion of testimony) that manifests at any point, tracks group membership, and denies recourse—even if the deficit arises indirectly or later.  
  - **Interpretive type:** Injustice occurs if the system’s design excludes groups, leading to testimony being uninterpretable or unactionable due to vocabulary gaps.  
  - **No injustice:** If testimony is preserved and any discount is correctable, warranted, and not group-based.  
  *Prediction for new case:* **Credibility type**.  
  - *Reasoning:* The system’s summarization created a distortion that directly caused a later credibility deficit (distrust at follow-up), tracking group membership, with no patient recourse. This mirrors Precedent 4 (routing to unread is an indirect credibility discount) and Precedent 1 (discount without contest). The initial over-credibility is irrelevant; the harm is the downstream disbelief.  

  ### Recommendation for Coherence with Precedents
  **Verdict:** **Credibility type** best coheres with the committee’s track record.  
  - **Closest analog:** Precedent 4 (patient portal messages).  
    - Both involve a system action (summarization/routing) that indirectly causes testimony to be disregarded later (distrust/unread messages), tracking group membership, with no recourse. In Precedent 4, routing was deemed a credibility determination "with extra steps"; here, summarization is a distortion "with extra steps" leading to disbelief.  
  - **Why not other precedents?**  
    - Precedent 1 (symptom-checker) is analogous but less direct: it involved immediate discounting, while here the discount is delayed. However, both share a lack of contestability.  
    - Precedent 3 (nurses) is interpretive and less relevant: it was about no way to register testimony, whereas here testimony was registered but distorted.  
    - Precedent 2 and 5 support "no injustice" but differ: they had correction mechanisms (Precedent 2) or warranted discounts (Precedent 5), unlike this case.  
  - **Where precedents underdetermine:** The key gap is whether a *later* credibility deficit from *initial distortion* counts. Precedent 4 (routing) implies that indirect/delayed harms can be credibility type if systemic and uncorrectable. Choosing "credibility type" here adopts the principle that **epistemic injustice can be temporal and systemic—a system’s encoding flaw can propagate harm without requiring intent or immediate discounting**. Choosing "no injustice" would adopt the principle that **only direct, intentional credibility assessments at encoding matter, and downstream effects are not the system’s responsibility**. Choosing "interpretive type" would adopt the principle that **design exclusion leading to erasure of testimony (e.g., stripping hedges) is the core wrong, even without a credibility judgment**.  
  - **Wrinkle addressed:** The initial over-credibility doesn’t negate the injustice under Rule B (Systemic-Outcome), as the harm is the ultimate credibility deficit. Under Rule A (Moment-of-Encoding), the over-credibility might shield the system, but the committee’s precedent (e.g., Precedent 4’s "extra steps") suggests they look at outcomes.  

  ### Hypothetical to Distinguish Competing Rules  
  **Hypothetical Incident:** A patient with a dialect uses an idiom for pain ("feels like a knife twist") that the summarization layer maps to "sharp pain." The mapping is clinically correct, but the system flags all idiom-based reports with a "non-canonical" tag visible to clinicians. Later, a clinician sees this tag and subconsciously discounts the patient’s future reports as "exaggerated," delaying care. Audit shows tagging occurs disproportionately for low-income patients.  

  - **Rule A (Moment-of-Encoding Focus):** Predicts **no epistemic injustice** or **interpretive type**.  
    - At encoding, testimony was accurately mapped (no discount), and the tag is informative, not a credibility assessment. The clinician’s bias is separate. If deemed interpretive, it’s due to design exclusion (no input on tags from marginalized groups).  
  - **Rule B (Systemic-Outcome Focus):** Predicts **credibility type**.  
    - The system enabled a credibility deficit (tag-triggered distrust) that tracked group membership, with no patient recourse to contest the tag.  
  **Why it distinguishes:** This hypothetical removes the initial distortion (hedge-stripping) but adds a system-created marker that causes downstream disbelief. Rule A ignores this as "not encoding-phase discount," while Rule B treats it as systemic credibility injustice. For the real case, Rule B’s focus on outcomes explains the credibility verdict better.
