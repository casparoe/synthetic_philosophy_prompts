  ### Joint Statement: Role-First Functionalism and System-First Attributionism  
  **Adversarial Collaboration on Morally Load-Bearing Computations**  
  *Authored by representatives of Role-First Functionalism (RFF) and System-First Attributionism (SFA)*  

  Following sustained good-faith dialogue, we—a role-first functionalist and a system-first attributionist—agree on core methodological and substantive points while clarifying persistent disagreements. Both parties accept that trivial-implementation arguments (TIAs) demonstrate that any sufficiently rich physical system can be interpreted as instantiating arbitrary computations under some description. However, TIAs alone cannot resolve which computations are *morally load-bearing*. The question is not whether a computation is physically realized, but which realizations matter for moral status.  

  #### I. Agreed Claims  
  1. **Trivial-Implementation Arguments (TIAs)**:  
     - TIAs show that computational descriptions are observer-relative and underdetermined by physics alone. Any physical system (e.g., a rock, a galaxy) can be mapped to an arbitrary computation (e.g., emulating a mind) via gerrymandered state assignments.  
     - TIAs do **not** show that all computations are morally irrelevant, nor do they resolve what makes a realization "non-trivial." A satisfactory account must identify criteria to distinguish *promiscuous* interpretations (e.g., describing a wall as computing pi) from *genuine* ones (e.g., a human brain supporting consciousness).  

  2. **Inflation of Moral Patients**:  
     - The number of moral patients **cannot** be inflated arbitrarily by redescribing overlapping computations within the same matter. While multiple computations may be physically co-located (e.g., a brain described as subcomputations or supersystems), not all are equally morally relevant. Both sides reject "computation stacking" (e.g., claiming one human body contains trillions of moral patients via overlapping descriptions).  

  3. **Requirements for a Satisfactory Account**:  
     A defensible theory of morally load-bearing computations must:  
     - (a) **Avoid promiscuity**: Exclude TIAs by providing objective constraints on which realizations count.  
     - (b) **Explain intuitive cases**: Justify why computations in humans (or AI analogs) matter, while "trivial" realizations (e.g., a solar system computing chess) do not.  
     - (c) **Accommodate multiple realizability**: Allow non-biological systems (e.g., digital minds) to have moral status.  
     - (d) **Respect causal-explanatory power**: Ground moral status in properties that explain why certain computations generate morally relevant phenomena (e.g., sentience).  

  #### II. Disagreements Table  
  Each row states a disputed claim in wording acceptable to RFF and SFA, respectively. Notes indicate whether disagreements are substantive or verbal.  

  | RFF Wording (Role-First Functionalist)                                                                                               | SFA Wording (System-First Attributionist)                                                                                                 | Note                                       |  
  |--------------------------------------------------------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------------------------------------------------------|--------------------------------------------|  
  | Moral status depends solely on the presence of a causally active, counterfactual-supporting functional organization, regardless of physical boundaries. | Moral status requires that a computation is *enacted* by a unified system with intrinsic boundaries, where the system's own activity is causally responsible. | Substantive                                |  
  | System boundaries are derivative: they merely help locate functional organization and do not constrain moral status.                 | System boundaries are fundamental: they determine whether a computation is *attributable* to a system as its own causal activity.          | Substantive                                |  
  | A computation is morally load-bearing if its functional role is realized in a physical substrate, even if the substrate is distributed or has fuzzy boundaries (e.g., a network spanning multiple devices). | A computation is morally load-bearing only if it is executed by a unified entity with a definite boundary, where the entity’s intrinsic powers produce the computation. | Substantive (relates to nested-superset cases) |  
  | Attribution is fully reducible to computational properties: it is captured by the pattern of counterfactual dependencies in the functional organization. | Attribution is an extra condition beyond computational properties: it requires a system-level unity that cannot be defined computationally. | Substantive (core to the attribution crux) |  
  | The "slowed emulation" of a computation (e.g., a brain emulated 1000× slower) retains moral status if the functional organization is preserved. | A slowed emulation lacks moral status because the system’s causal work is inert relative to real-time agency, breaking attribution.        | Substantive (relates to slowed-emulation cases) |  
  | In the "nested-superset" case, if a system matters, any superset realizing the same functional organization also matters (e.g., brain + environment under a wider description). | In the "nested-superset" case, a superset system does not automatically inherit moral status; attribution requires the superset to be a unified entity, which it often is not. | Substantive                                |  
  | "Unexercised counterfactuals" (e.g., a system on a fixed path) still confer moral status if the functional organization supports the relevant counterfactuals. | "Unexercised counterfactuals" fail to confer moral status; attribution requires the system’s activity to *actually exercise* the computation’s causal powers. | Substantive (relates to unexercised-counterfactual cases) |  
  | *No disagreement on the surface requirements for moral status (e.g., sentience), only on what grounds them.*                          | *No disagreement on surface requirements; disagreement is about the metaphysical basis for moral status.*                                  | **Merely verbal** (agreement on moral targets) |  

  #### III. Cruxes  
  Cruxes are unresolved questions where both sides accept specific cases as decisive tests. Predictions are stated in advance to facilitate future resolution.  

  1. **Crux: Is attribution a computational property or an extra condition? Does it reintroduce biological bias?**  
     - **Case**: *Gradual-Substitution Case*: A neural circuit is replaced piece-by-piece with a silicon-based realizer that preserves causal-functional role. Does moral status persist throughout?  
       - **RFF Prediction**: Yes. Functional organization is preserved; attribution is computational and substrate-neutral.  
       - **SFA Prediction**: Yes, *provided* the system maintains unity and enacts the computation. Attribution is an extra condition but need not favor biology—it allows non-biological realizers if they form unified systems.  
     - **Bearing on crux**: Tests if attribution is separable from functional role and whether it covertly prefers biology. SFA denies bias but insists on extra conditions; RFF sees attribution as inherent to functionalism.  

  2. **Crux: Does moral status require the actual exercise of a computation’s causal powers?**  
     - **Case**: *Unexercised-Counterfactual Case*: A system’s actual trajectory never deviates from a trivial path (e.g., looping idle state), but it can be described as having a rich counterfactual structure (e.g., "if perturbed, it would emulate a mind").  
       - **RFF Prediction**: Moral status is present. The counterfactual-supporting organization exists, even if unexercised.  
       - **SFA Prediction**: Moral status is absent. Attribution requires the system’s *actual activity* to enact the computation; unexercised capacities are inert.  
     - **Bearing on crux**: Tests if moral status hinges on active causation (SFA) or structural potential (RFF).  

  3. **Crux: Do system boundaries constrain moral status, or are they organizational landmarks?**  
     - **Case**: *Nested-Superset Case*: If a brain (System A) has moral status, does System B (A + surrounding air molecules, described as a wider computational system) also have status if it realizes the same functional organization?  
       - **RFF Prediction**: Yes. Organization is preserved; boundaries are irrelevant.  
       - **SFA Prediction**: No. System B lacks intrinsic unity; the computation is not *attributed* to it as an agent.  
     - **Bearing on crux**: Tests the primacy of boundaries (SFA) versus organization (RFF).  

  4. **Crux: Does computational speed affect moral status?**  
     - **Case**: *Slowed-Emulation Case*: A human brain’s computation is emulated 1000× slower, preserving counterfactual structure but disabling real-time interaction.  
       - **RFF Prediction**: Moral status is preserved. Functional organization is identical.  
       - **SFA Prediction**: Moral status is lost. The system cannot enact timely causal work (e.g., responsive agency), breaking attribution.  
     - **Bearing on crux**: Tests if moral status depends on causal efficacy in a temporal context (SFA) or abstract organization (RFF).  

  ---  
  **Signed**,  
  *Representative of Role-First Functionalism*  
  *Representative of System-First Attributionism*  

  ---  
  ### Notes on Collaboration  
  - **Progress**: Both sides converged on rejecting TIAs as decisive and on the need for non-promiscuity. Disagreements on boundaries, attribution, and exercise of computations were sharpened.  
  - **Open Issues**: Cruxes center on whether system-level properties (boundaries, enactment) are reducible to functional organization (RFF) or require additional metaphysical constraints (SFA). Cases like gradual substitution suggest SFA’s "extra condition" need not favor biology, but its broader implications require further study.  
  - **Next Steps**: Testing predictions against empirical cases (e.g., brain emulations, AI systems) will resolve cruxes. Both parties commit to updating views based on evidence.
