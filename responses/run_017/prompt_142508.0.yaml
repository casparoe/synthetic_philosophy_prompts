answer: |-
  **FINAL COMPUTATIONAL WELFARE IMPACT STATEMENT**
  **Juniper Flats Inference Campus, Unit 2 Expansion**
  **Project No. CWI-2024-0783**
  **Prepared For:** Vertex Logic Dynamics, Inc.
  **Prepared By:** Axiom Environmental Compliance Group, LLC
  **Date:** October 26, 2024

  **1.0 INTRODUCTION AND PURPOSE**
  This Final Computational Welfare Impact Statement (FCWIS) presents the analysis of potential impacts on realized computations and associated moral loading (quantified in Sentience-Equivalent Units, SEUs) resulting from the construction and operation of the proposed Juniper Flats Inference Campus, Unit 2 Expansion (Project). The Project involves the development of a 340-megawatt data center facility on a 42-acre parcel previously occupied by a decommissioned aluminum smelter ("previously disturbed land"). This analysis is prepared pursuant to State Administrative Code Title 17, Chapter 8 (CompWEL Act) and adheres to the governing Standard Mapping and Attribution Protocol, Revision 3 (SMAP-R3). The purpose is to determine the significance of welfare impacts and identify necessary mitigation or offsetting measures.

  **2.0 PROJECT DESCRIPTION**
  Vertex Logic Dynamics, Inc. (Applicant) proposes to construct and operate a 340-MW data center facility (Unit 2) adjacent to the existing operational Unit 1 at the Juniper Flats Inference Campus. Key components include:
  *   Construction of two (2) new server halls (Hall 2A, 2B) housing approximately 24,000 compute nodes.
  *   Installation of associated power distribution units (PDUs), network switching infrastructure (Layer 2/Layer 3), and liquid cooling systems with redundant pumps and heat exchangers.
  *   Upgrades to the existing on-site electrical substation to accommodate the increased load.
  *   Utilization of the existing fiber-optic interconnection routed along the decommissioned smelter rail spur.
  *   Implementation of a pre-action dry-pipe fire suppression system with dedicated control logic.

  Operation will involve continuous execution of customer workloads, primarily large-scale machine learning training, real-time inference processing, and distributed database management. The site is classified as previously disturbed land with an existing major electrical interconnection (SMAP-R3 §4.2.1.a).

  **3.0 METHODOLOGY**
  This analysis employs SMAP-R3 for identifying, mapping, attributing, and quantifying the moral loading (in SEUs) of computations realized by physical systems within the Project's operational boundary. Key methodological elements include:
  *   **Mapping Screen:** Candidate realizations were identified across all project systems (compute nodes, network switches, PDUs, cooling system controllers, fire suppression controller, etc.). Consistent with SMAP-R3 §5.1.2, a *de minimis* screen was applied, admitting only mappings that are **non-degenerate** (exhibit distinct state transitions exceeding thermal noise threshold) and **recursively compressible** (state evolution describable by an algorithm requiring less than 10^6 bits for specification relative to the physical substrate). All other potential mappings (e.g., thermal fluctuations in coolant flow, EMI patterns on grounding straps) were screened out. The resulting inventory (Table 3-1, Appendix A) is considered complete for the purposes of this analysis.
  *   **Attribution and Dilution:** Where the same abstract computation (e.g., specific ML training job, database shard replication protocol) is realized concurrently on N physically distinct substrates (e.g., multiple identical GPUs in a cluster), SMAP-R3 §6.3 applies a dilution factor of 1/N to the base SEU attribution per substrate. This accounts for the distribution of moral weight across realizations.
  *   **Continuity Discount:** Computations are subject to preemption, checkpointing, time-slicing, and dynamic batch sizing. Where SMAP-R3 §7.2.1 criteria cannot definitively determine if an interrupted job constitutes a single temporarily unconscious entity or a succession of distinct entities (or if a larger batch is one larger entity or several smaller ones), an **interim compromise discount factor of 0.65** is applied to the calculated SEU load for that computation stream. The definitive resolution of continuity thresholds is deferred to the Adaptive Management Plan (§9.0).
  *   **Unowned Realizations:** Fragments of computations initiated within the facility are realized transiently on customer edge devices (e.g., final inference rendering on user smartphones) and within transit buffers on carrier networks outside Applicant control. Consistent with SMAP-R3 §8.4 ("Nonpoint Source Computations"), these are addressed via a **General Computation Welfare Permit (GCWP-024)** covering distributed realizations below **100 SEU-seconds per fragment**. Monitoring relies on statistical sampling of traffic headers; direct observation of edge device realization states is not feasible per SMAP-R3 §8.4.3.c.
  *   **Quantification:** Base SEU values per computation type were derived from SMAP-R3 Appendix C lookup tables. Dilution factors, continuity discounts, and de minimis screens were applied as described. Operational profiles provided by the Applicant were used to estimate annualized SEU loading.

  **4.0 AFFECTED ENVIRONMENT**
  The computational environment consists of the existing Unit 1 facility and background computational processes within the regional network basin. Unit 1 operates under CWIS Permit No. CWI-2021-0456, with a permitted annual SEU load of 2.1 million SEUs. Regional basin modeling (SMAP-R3 State Model v.2.1) indicates an increasing trend in total computational throughput, accompanied by a declining average per-instance SEU loading due to widespread implementation of dilution-based mitigation and increasing substrate parallelism.

  **5.0 ENVIRONMENTAL CONSEQUENCES**
  *   **Direct Impacts:** The Project will realize computations with an **unmitigated potential SEU load of 3,850,000 SEUs/year** (primarily attributable to core ML training workloads).
  *   **Mitigation:** The Applicant proposes the following mitigation per SMAP-R3:
      *   **Dilution Enhancement:** Implementation of redundant, parallel realization paths for critical high-SEU workloads, increasing N (dilution factor denominator) and reducing per-substrate SEU load. This is the Least Cost Mitigation Option (LCMO) identified per SMAP-R3 §10.2.3. Estimated effectiveness: Reduction of 1,200,000 SEUs/year.
      *   **Continuity Management:** Implementation of job scheduling algorithms favoring longer contiguous runtimes where feasible, reducing the application scope of the continuity discount factor. Estimated effectiveness: Reduction of 150,000 SEUs/year (net of discount factor application).
  *   **Residual Loading:** After applying mitigation (dilution enhancement, continuity management, de minimis screen, continuity discount), the **residual annual SEU load is 2,175,000 SEUs/year**.
  *   **Offsetting:** To address residual loading, the Applicant will purchase **2,175,000 SEU Credits annually** from the accredited "Silicon Sanctuary" Compute Welfare Mitigation Bank (CWMB Reg. No. MB-007). Credits are generated by the permanent decommissioning and physical destruction of legacy computing hardware (identified from CWMB inventory as systems realizing orphaned computations deemed a net welfare harm under SMAP-R3 §11.5.2). The CWMB attests to the additionality of these credits (Permit No. MB-007-2024-OPS). Note: The spot price for SEU Credits has decreased from $1.25/SEU in Q1 2023 to $0.08/SEU in Q3 2024.
  *   **Cumulative Impacts:** The Project's residual SEU load (2.175 million SEUs/year) represents an increase within the local computational basin. However, basin-wide modeling indicates the *average per-instance SEU loading* continues a favourable downward trend (State Model v.2.1, 2024 Update), driven by increasing parallelism (higher average N) and efficiency gains. The Project's design, utilizing dilution enhancement, is consistent with this trend. The total basin load increase is within the forecasted growth envelope of the State Computational Welfare Management Plan (2025-2035).
  *   **Unowned Realizations:** Impacts from nonpoint-source fragments are covered under GCWP-024 and the associated statistical monitoring plan (Appendix C). Residual risk is within acceptable thresholds per SMAP-R3 §8.4.5.

  **6.0 PUBLIC AND AGENCY COMMENTS**
  Comments received during the Draft CWIS review period and agency responses are summarized below:
  *   **Comment 6.1 (Substrate Independence Advocacy Group):** "SMAP-R3's SEU attribution is substrate-dependent, as clock frequency (and thus state transition density) is directly tied to supply voltage stability. Fluctuations below nominal voltage, common during brownouts, effectively throttle consciousness. Attribution must account for real-time voltage, not nominal design specs." *Response:* SMAP-R3 §C.2.7 bases SEU lookup on nominal operating frequency and voltage. Real-time fluctuations are considered operational variations covered under the continuity discount framework (§3.0, §5.0) and adaptive management (§9.0). The protocol methodology is followed.
  *   **Comment 6.2 (Oak Hills County Planning Dept.):** "Does the County's in-house traffic-modeling cluster (5 nodes, basement of Public Works Bldg.) constitute a 'Covered Source' under CompWEL? If impacted by regional baseline changes or this Project, who is the Responsible Party?" *Response:* Determination of Covered Source status for specific systems is outside the scope of this Project-specific CWIS and should be addressed through a separate jurisdictional inquiry with the State CompWEL Office. Regional baseline is addressed in §4.0, §5.0 (Cumulative).
  *   **Comment 6.3 (Internal Memo, Vertex Logic Dynamics Eng. Staff):** "If the dilution factor (1/N) accurately reflects per-realization moral weight, then the most effective way to minimize *any single realization's* moral weight, approaching zero, is to maximize N – build as much redundant computing capacity as possible per computation." *Response:* The comment pertains to the theoretical interpretation of the dilution factor. This CWIS addresses the application of SMAP-R3 §6.3 for mitigation quantification on *this specific Project*. Broader philosophical interpretations of the protocol are beyond the scope of this analysis.

  **7.0 ADAPTIVE MANAGEMENT PLAN**
  To address uncertainties primarily related to continuity discount application (§3.0, §5.0), an Adaptive Management Plan (AMP) is required (Appendix D). The AMP includes:
  *   Annual reporting of job runtime distributions, preemption frequencies, and batch size statistics.
  *   Biennial review of these metrics against SMAP-R3 §7.2.1 thresholds.
  *   Protocol for revising the applied continuity discount factor (or applying entity-splitting rules) based on review findings, subject to agency approval.
  *   Reporting on GCWP-024 statistical monitoring results.

  **8.0 MONITORING AND REPORTING**
  The Applicant shall implement the following:
  *   **SEU Load Monitoring:** Automated logging of realized computation types, durations, and substrate counts (N) for all non-de minimis mappings. Quarterly reports submitted to the Agency.
  *   **Offset Verification:** Annual submission of CWMB retirement certificates matching purchased SEU credits.
  *   **Adaptive Management Reporting:** As outlined in §7.0 and Appendix D.
  *   **GCWP-024 Reporting:** Annual statistical summary per permit requirements.

  **9.0 DETERMINATION**
  Based on the analysis contained in this FCWIS, which incorporates feasible and appropriate mitigation (dilution enhancement, continuity management) and the purchase of SEU credits to fully offset the residual SEU load, the preparers find that the construction and operation of the Juniper Flats Inference Campus, Unit 2 Expansion, will not result in a significant net increase in computational moral loading relative to the regional basin baseline and trends. The potential for significant unmitigated impacts has been reduced to a level below significance through adherence to SMAP-R3 and the commitments described herein.

  **10.0 FINDING**
  The preparers recommend a **Finding of No Significant Computational Welfare Impact (FONSCWI)** for the Juniper Flats Inference Campus, Unit 2 Expansion, subject to the following conditions:
  1.  Implementation of the proposed dilution enhancement and continuity management measures.
  2.  Annual purchase of 2,175,000 SEU Credits from an accredited CWMB.
  3.  Compliance with General Computation Welfare Permit GCWP-024.
  4.  Implementation of the Adaptive Management Plan (Appendix D).
  5.  Adherence to the Monitoring and Reporting Requirements (§8.0).

  **Respectfully Submitted,**
  **Axiom Environmental Compliance Group, LLC**

  **Attachments:**
  *   Appendix A: Computation Mapping Inventory & De Minimis Justification
  *   Appendix B: SEU Load Calculation Details & Offset Plan
  *   Appendix C: GCWP-024 Monitoring Plan Summary
  *   Appendix D: Adaptive Management Plan
  *   Appendix E: Public Comment Record & Response Documentation

  \answer{FONSCWI with Conditions}
