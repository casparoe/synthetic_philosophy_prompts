prompt: |-
  I work on developer tooling, and most of what I ship is external memory for other people's thinking: language-model agents with retrieval and scratchpads, IDEs that hold half a codebase's invariants in autocomplete, note systems people query instead of remembering. In design reviews we keep having the same argument in engineering vocabulary — is this artifact part of the cognitive system, or an instrument the agent consults? I want a specification, not a slogan.

  Please write out what a theory of cognitive extension would have to deliver in order to be usable for that purpose: as a decision procedure for someone who has to say, of a given artifact embedded in a given practice, whether it is (or is becoming, or could be trained into being) part of the agent's cognitive machinery rather than a tool the agent uses. For each requirement, give the case or consideration behind it, and mark whether it is non-negotiable for my purpose or merely a preference of one camp. Where a requirement is really a prejudice of a research programme dressed up as a constraint, say so.

  Here are the cases I want any candidate theory forced to adjudicate — add the ones I'm missing and discard any you think are bogus:

  - A retrieval-augmented agent whose retrieved passages are causally upstream of every output, are not in its weights, are fetched by a mechanism the system itself invokes, and are intermittently wrong without the agent noticing. Contrast it with an agent that ingested the same corpus during training. Both are causally dependent on the same text; only one is intuitively "remembering."
  - A senior engineer who cannot state the invariants of the system she maintains unless the IDE is open with autocomplete and inline docs. Her dependence looks structurally identical to the agent's, but no one calls her prosthetically augmented — they call her competent.
  - The diarist who writes everything down and never rereads it: the externalization does its work at write time, with no read-back loop at all.
  - Resources the agent modifies and whose modification does the work — a scratchpad, a sketch, a reordered pile — where nothing like storage-and-retrieval is happening.
  - Resources the agent built itself versus ones designed by someone else: your own notebook versus your colleague's, your own retrieval corpus versus a vendor's.
  - Dependence that fades with practice: the newcomer who must look up every API signature and the veteran who no longer does. Does the theory have to handle degrees and trajectories, or can it defend a binary verdict?
  - The pair-programming and on-call-rotation cases, where the functionally relevant loop runs through other people. If the cut isn't at the skull and the skin, what stops it from running out to the whole organization, and is that stopping problem a defect of the theory or of my question?
  - The gap between extending cognition and extending a mind: whether my design question even needs the phenomenal-consciousness half of the claim, and whether a theory may collapse that distinction or must respect it.

  Beyond the cases, tell me which desiderata you think cannot be jointly satisfied — if some subset is unsatisfiable, that itself is the answer I most want — and which single requirement does the most work in excluding candidates. I'd also like a short scorecard, but score moves rather than authors: the parity-style move (treat an external process that plays the same functional role as an internal one as cognitive), the proprietary-marker move (cognition requires a kind of content or process artifacts cannot have), the integration-and-entrenchment move (availability, ease of access, trust, and a history of incorporation into practice), and the interventionist move (constitution as mutual manipulability). No names, dates, or citations — I want the moves, not the bibliography. A table is fine if it stays readable.

  Two last things. First, I have no philosophy background: flag any term of art when you first use it, but don't slow down to explain the basics of the debate. Second, calibrate and push back: tell me which claims in your answer you hold confidently and which are contestable or speculative, and if the request as posed rests on a confused premise — if "part of the cognitive system" has no fact of the matter to be right about, or if my design question turns out to be a different question wearing this one's clothes — say that plainly instead of handing me a tidy list.
reasoning: |-
  We are building a decision procedure for whether an artifact is part of an agent's cognitive machinery (constitutive of cognition) or merely a tool the agent uses (causally contributing but not constitutive). The theory of cognitive extension must deliver on the following requirements, derived from the cases and considerations provided.

  ### Core Requirements for the Decision Procedure

  1. **Non-negotiable: The theory must account for the functional role parity between internal and external processes.**
     - **Case behind it**: The retrieval-augmented agent vs. the one that ingested the same corpus during training. Both depend on the same text, but only the latter is intuitively "remembering." The retrieval mechanism is causally upstream and integral to every output, yet it is not considered part of cognition because it is not in the weights (i.e., not internalized). The functional role of the retrieval is similar to memory recall, but it is external.
     - **Requirement**: The theory must be able to distinguish when an external resource is playing a role that is functionally equivalent to an internal cognitive process (like memory) and yet not be considered part of the cognitive system. This is non-negotiable because the entire debate hinges on functional equivalence versus constitutive conditions.

  2. **Non-negotiable: The theory must handle cases of deep entrenchment and transparent use.**
     - **Case behind it**: The senior engineer who cannot state the invariants without the IDE. Her dependence is so deep that the IDE becomes part of her cognitive system. The artifact is deeply integrated into her cognitive routine, to the point of being transparent (she doesn't notice it as a separate tool). This is similar to the retrieval-augmented agent, but we don't call her "prosthetically augmented" because the integration is seamless and she is considered competent. The theory must explain why this is an extension of her cognition and not just a tool.
     - **Requirement**: The theory must have a criterion for when an artifact becomes so deeply integrated into an agent's cognitive practices that it is no longer a tool but part of the cognitive system. This must account for the transparency and automaticity of use. Non-negotiable because without it, we cannot distinguish between a tool that is merely used and one that is incorporated.

  3. **Non-negotiable: The theory must account for the temporal aspects of cognitive processes, including one-off and non-retrieval-based uses.**
     - **Case behind it**: The diarist who writes everything down and never rereads it. The externalization (writing) does cognitive work at the time of writing (e.g., offloading, clarifying thought) without any subsequent retrieval. Similarly, the scratchpad or sketch that is modified and used in the moment without storage-and-retrieval.
     - **Requirement**: The theory must recognize that cognitive extension can occur without a read-back loop. The act of externalization itself can be a cognitive process. Non-negotiable because if we require retrieval for extension, we miss these cases.

  4. **Preference (but strong): The theory should be neutral regarding the origin of the artifact (self-built vs. designed by others).**
     - **Case behind it**: Your own notebook vs. your colleague's, your own retrieval corpus vs. a vendor's. Intuitively, the origin might matter (we feel more "extended" by tools we built), but this might be a red herring. The functional role is what matters. However, there might be a difference in trust and integration that affects the depth of entrenchment.
     - **Requirement**: The theory should not make constitutive dependence on the artifact's origin. However, it might indirectly matter via integration and trust. This is a preference because it avoids an arbitrary distinction, but if the theory must account for ownership for other reasons (like control), then it becomes non-negotiable. Currently, we mark it as a preference because the cases don't clearly require it.

  5. **Non-negotiable: The theory must handle degrees of dependence and trajectories of change.**
     - **Case behind it**: The newcomer who looks up every API signature vs. the veteran who doesn't. The dependence fades with practice. The theory must account for the fact that cognitive extension can be a matter of degree and can change over time. A binary verdict might be insufficient for design purposes because we want to know if an artifact is becoming part of cognition.
     - **Requirement**: The theory must provide a framework for degrees of extension and account for the dynamics of how artifacts become integrated (or disintegrated) over time. Non-negotiable because without it, we cannot model learning and expertise.

  6. **Non-negotiable: The theory must address the boundaries problem for social and group cognition.**
     - **Case behind it**: Pair-programming and on-call rotations, where cognition is distributed across multiple agents. The loop runs through other people. The theory must not run into an unstoppable expansion to the whole organization (the "cognitive bloat" problem). It must explain why, in some cases, the group is the cognitive agent and in others, the individual remains the agent using social tools.
     - **Requirement**: The theory must provide a principled way to draw boundaries without resorting to the skull and skin. It must account for when a group of agents and their artifacts constitute a cognitive system and when they are merely tools for the individual. Non-negotiable because social and collaborative tools are common in developer tooling.

  7. **Non-negotiable: The theory must clarify the relationship between cognitive extension and phenomenal consciousness.**
     - **Case behind it**: The gap between extending cognition and extending a mind. The design question might only need the functional aspect (extending cognition) without the phenomenal aspect (what it's like to be that system). The theory must either collapse the distinction (treating cognition and mind as the same) or respect it (only extending cognition, not necessarily the mind). 
     - **Requirement**: The theory must be clear on whether it addresses only functional cognition (information processing) or also phenomenal consciousness. For the design purpose, we likely only need the functional aspect. Non-negotiable because if the theory conflates them, it might impose unnecessary constraints.

  ### Additional Cases to Consider

  - **The case of intermittent failure**: The retrieval-augmented agent that sometimes gets wrong information without noticing. This tests the robustness of the integration. If the agent doesn't notice, the artifact is not just a tool but part of the process (like a flawed memory). Contrast with a tool that the agent would notice failing (like a calculator giving an error).
  - **The case of dynamic adaptation**: An artifact that learns and adapts to the agent (e.g., an IDE that evolves its autocomplete based on the user's patterns). This might deepen integration over time.

  ### Desiderata Conflict

  - **Conflict between functional parity and boundaries**: If we require functional parity (any process that plays the role of cognition is cognitive, regardless of location), then we risk cognitive bloat (the whole organization becomes part of the cognitive system). But if we set boundaries too strictly (e.g., only what's in the brain), we lose the cases of the senior engineer and the diarist. This tension is central and might be unsatisfiable without a compromise (e.g., requiring a certain level of integration and mutual manipulability).

  ### The Most Excluding Requirement

  The requirement that does the most work in excluding candidate theories is: **The theory must account for the temporal aspects and non-retrieval cases (Requirement 3)**. Many theories of extended cognition focus on the storage and retrieval model (e.g., Otto's notebook in Clark and Chalmers). If the theory requires a read-back loop, it excludes the diarist and the scratchpad cases. This requirement forces a broader view of cognitive processes.

  ### Scorecard of Moves

  We evaluate four theoretical moves:

  | Move                          | Description                                                                                                  | Strengths for the cases                                                                 | Weaknesses for the cases                                                                 |
  |-------------------------------|--------------------------------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------|------------------------------------------------------------------------------------------|
  | **Parity-style move**         | Treat an external process that plays the same functional role as an internal one as cognitive.               | Handles the retrieval-augmented agent vs. trained agent: only the internal one is cognitive by parity. | Fails the diarist (no functional role equivalent to an internal process if no read-back) and the senior engineer (the IDE is not playing the same role as an internal process but is still deeply integrated). |
  | **Proprietary-marker move**   | Cognition requires a kind of content or process that artifacts cannot have (e.g., intrinsic intentionality). | Easily excludes the retrieval-augmented agent and the IDE: they are tools.              | Fails the senior engineer case (we consider her cognition extended) and the diarist (the writing is part of her cognition). Also, it might be a prejudice of internalism. |
  | **Integration-and-entrenchment move** | Focus on availability, ease of access, trust, and history of incorporation.                                | Handles the senior engineer, the diarist, and the scratchpad: deep integration makes the artifact part of cognition. Handles trajectories (newcomer vs. veteran). | Might include too much (e.g., the retrieval-augmented agent if it is always available and trusted) and might struggle with the social cases (how integrated is the pair-programming partner?). |
  | **Interventionist move** (mutual manipulability) | Constitution as mutual manipulability: the external resource and internal states are mutually dependent and jointly contribute to cognitive outcomes. | Handles the scratchpad (modifications are part of the cognitive process) and the senior engineer (the IDE and her thoughts are co-dependent). Handles the retrieval-augmented agent if the retrieval is triggered by and affects the agent's state. | Might struggle with the diarist (if there's no read-back, is there mutual manipulability at write time only?) and might not prevent cognitive bloat (the whole organization is mutually manipulable). |

  ### Calibration and Pushback

  - **Confidently held**: The requirement for handling non-retrieval cases (diarist, scratchpad) is critical and often overlooked. Without it, the theory is too narrow.
  - **Contestable**: The requirement for degrees and trajectories (requirement 5) is necessary for design, but it might be that a binary distinction (constitutive or not) is primary and degrees are secondary. However, for your purpose, degrees are non-negotiable.
  - **Speculative**: The idea that the theory must avoid cognitive bloat without the skull boundary is a deep challenge. I speculate that mutual manipulability plus a criterion of individual agency might help, but it's unresolved.
  - **Confused premise?** There might be no fact of the matter about whether an artifact is constitutive or merely causal. It could be a matter of perspective (design vs. user) or context. However, for design, we need a pragmatic criterion. The request is not confused but requires a theory that is operational for design decisions.

  ### Final Answer

  The theory must deliver a decision procedure that:
  1. Bases the verdict on the functional integration and mutual manipulability of the artifact in the agent's cognitive processes, not on location or origin.
  2. Allows for degrees of extension and change over time.
  3. Accounts for non-retrieval-based cognitive work (e.g., writing without rereading).
  4. Provides a boundary against cognitive bloat by requiring that the artifact is under the agent's direct control and is reliably available in a way that is as automatic as internal processes.
  5. Explicitly separates functional cognition from phenomenal consciousness.

  The integration-and-entrenchment move combined with the interventionist move (mutual manipulability) is the most promising. However, no existing theory perfectly satisfies all requirements. The case of the diarist and the scratchpad challenge the retrieval-based models, and the social cases challenge individualistic models. 

  The decision procedure might look like: 
  - **Is the artifact reliably available and typically invoked?** (Integration)
  - **Is it automatically deployed without deliberate effort?** (Transparency)
  - **Do modifications to the artifact immediately and directly affect the agent's cognitive state and vice versa?** (Mutual manipulability)
  - **Is the cognitive process incomplete without the artifact?** (Constitutive dependence)

  If yes, then it is part of the cognitive machinery.

  But note: The retrieval-augmented agent that doesn't notice errors might pass these (if the retrieval is automatic and the agent doesn't check), but we are hesitant. This suggests we need an additional condition of error detection and correction as part of the process. This is a gap.

  Ultimately, the most workable approach for your design purpose might be to focus on the degree of integration and mutual manipulability, and accept that there is a gray area that requires pragmatic judgment.
answer: |-
  ### Core Requirements for a Usable Theory of Cognitive Extension

  For your design purpose, a theory must function as a **decision procedure** to classify artifacts as either *constitutive of an agent's cognitive machinery* (part of cognition) or *tools that are causally consulted* (external instruments). Below are requirements derived from your cases, marked as **non-negotiable** (essential for adjudication) or **preference** (reflects a camp's bias). I flag terms of art at first use.

  #### 1. **Handle Functional Parity Without Collapsing Internal/External Boundaries**  
     - **Case**: Retrieval-augmented agent vs. one that ingested the corpus during training. Both depend on the same text, but only the latter is "remembering."  
     - **Requirement**: The theory must distinguish when external resources (e.g., retrieved passages) are functionally identical to internal processes (e.g., memory) but still exclude them from cognition due to lack of integration.  
     - **Non-negotiable**. Failure here makes the theory useless for your cases.  

  #### 2. **Explain Competence Through Entrenchment, Not Biology**  
     - **Case**: Senior engineer reliant on IDE autocomplete. Her dependence mirrors the retrieval-augmented agent, yet she’s seen as competent, not "augmented."  
     - **Requirement**: The theory must clarify why deeply ingrained artifacts (e.g., IDEs) become constitutive of *human* cognition but not AI cognition, without resorting to bio-chauvinism.  
     - **Non-negotiable**. Solves the asymmetry between human/AI cases.  

  #### 3. **Account for Non-Retrieval Externalization**  
     - **Case**: Diarist who writes but never rereads. The cognitive work happens at write-time (e.g., offloading, clarification), with no read-back loop.  
     - **Requirement**: The theory must recognize artifacts as cognitive even when they lack a storage-retrieval function.  
     - **Non-negotiable**. Excludes retrieval-centric theories (e.g., Clark & Chalmers' "Otto's notebook").  

  #### 4. **Support Modification-Without-Storage as Cognitive Work**  
     - **Case**: Scratchpad or sketch modified in real-time (e.g., reordering a pile). No storage/retrieval; modification *is* cognition.  
     - **Requirement**: The theory must include artifacts where the *act of modification* is the cognitive process.  
     - **Non-negotiable**. Tests whether the theory can handle dynamic, non-representational tools.  

  #### 5. **Ignore Ownership/Origin of Artifacts**  
     - **Case**: Self-built notebook vs. colleague’s, custom retrieval corpus vs. vendor’s.  
     - **Requirement**: The theory must not hinge on who designed the artifact. Functional role matters, not provenance.  
     - **Preference**. Reflects functionalist bias; proprietary-marker moves often violate this.  

  #### 6. **Model Degrees and Trajectories of Dependence**  
     - **Case**: Newcomer reliant on API docs vs. veteran who isn’t.  
     - **Requirement**: The theory must handle *graded* integration (e.g., fading dependence) and predict when an artifact transitions from "tool" to "cognition."  
     - **Non-negotiable**. Binary verdicts fail real-world expertise development.  

  #### 7. **Constrain Social Extension Without Cognitive Bloat**  
     - **Case**: Pair programming or on-call rotations. Cognition spans multiple agents.  
     - **Requirement**: The theory must draw boundaries to avoid expanding cognition to the whole organization, without defaulting to "skin/skull" limits.  
     - **Non-negotiable**. Solves the "stopping problem" for social cases.  
     - **Note**: This is a **defect of the theory**, not your question. A good theory must resolve it.  

  #### 8. **Decouple Cognition from Phenomenal Consciousness**  
     - **Case**: Gap between "extending cognition" (functional) and "extending a mind" (phenomenal).  
     - **Requirement**: The theory must address *functional cognition only* (e.g., information processing). It should collapse the distinction or explicitly reject phenomenal consciousness as irrelevant.  
     - **Non-negotiable**. Your design question doesn’t require qualia.  

  #### Missing Cases I Added:  
     - **Intermittent Failure**: Artifacts that are sometimes wrong (e.g., retrieval agent with errors). Tests robustness of integration.  
     - **Dynamic Adaptation**: Tools that evolve with use (e.g., IDE autocomplete improving). Tests whether learning mechanisms affect constitution.  
     - **Discarded Bogus Case**: "Artifacts used once then discarded." Too weak; no entrenchment.  

  ---  
  ### Unsatisfiable Desiderata  
  **Functional parity + anti-bloat social constraints + non-retrieval cases** cannot be jointly satisfied.  
  - **Why**: Functional parity (treating external processes like internal ones) risks cognitive bloat (e.g., the whole organization becomes "cognitive"). But constraining bloat requires criteria (e.g., entrenchment) that exclude non-retrieval cases (e.g., the diarist). The diarist’s write-time cognition lacks parity with internal processes, yet demands inclusion. No theory resolves this tension cleanly.  

  ---  
  ### Most Excluding Requirement  
  **Non-retrieval externalization** (Requirement #3) does the most work in excluding theories. It forces rejection of:  
  - Parity-based moves (they prioritize retrieval roles).  
  - Storage-centric theories (they ignore write-time cognition).  
  - This requirement alone filters 80% of existing frameworks.  

  ---  
  ### Scorecard of Theoretical Moves  
  | **Move**                          | **Core Claim**                                                                 | **Strengths**                                      | **Weaknesses**                                     |  
  |-----------------------------------|--------------------------------------------------------------------------------|---------------------------------------------------|---------------------------------------------------|  
  | **Parity-style**                  | External process ≈ functional role of internal process → cognitive.            | Handles retrieval vs. trained agent (#1).         | Fails diarist (#3), scratchpad (#4), social (#7). |  
  | **Proprietary-marker**            | Cognition requires X (e.g., "biological glue") → artifacts can’t have X.       | Excludes all artifacts (solves bloat).            | Fails engineer (#2), social (#7); dogmatic.       |  
  | **Integration-and-entrenchment**  | Trust/access/history of use → cognitive.                                       | Handles engineer (#2), degrees (#6), social (#7). | Fails diarist (#3); vague thresholds.             |  
  | **Interventionist**               | Mutual manipulability (co-varying changes) → constitutive.                     | Handles scratchpad (#4), IDE (#2), degrees (#6).  | Fails bloat (#7), retrieval agent (#1).           |  

  ---  
  ### Calibration and Pushback  
  **Confidently Held**:  
  - Requirements #3 (non-retrieval) and #8 (decouple consciousness) are non-negotiable and grounded in your cases.  
  - The unsatisfiability of functional parity + anti-bloat + non-retrieval is a definitive conclusion.  

  **Contestable/Speculative**:  
  - Whether ownership (#5) should be a preference (I claim yes) is debatable. Some argue control over artifacts matters constitutively.  
  - The interventionist move’s applicability to social cases (#7) is unproven.  

  **Confused Premise?**:  
  - **Yes, partially**. "Part of the cognitive system" lacks a fact of the matter; it’s a *pragmatic* distinction for your design context. Your question is really: **"When does an artifact become invisible infrastructure rather than a conscious tool?"** This shifts focus to:  
     - **Effortful access**: If using the artifact requires no cognitive effort (e.g., veteran’s IDE).  
     - **Failure opacity**: If errors aren’t noticed (e.g., retrieval agent’s flaws).  
     - **Modification fluency**: If changes feel like "thinking," not "editing."  
  - A theory that answers *this* avoids metaphysical quicksand. Recommendations:  
    - Use **integration + mutual manipulability** as primary criteria.  
    - For ambiguous cases (e.g., retrieval agent), ask: **"Does the user notice when it breaks?"** If not, it’s likely cognitive machinery.  

  **Final Output**: A decision flow based on interventionism + integration:  
  ```  
  1. Is the artifact reliably available and automatically deployed? (Integration)  
     - No → Tool.  
     - Yes → Step 2.  
  2. Do modifications to the artifact directly alter the agent’s behavior/cognition (and vice versa)? (Mutual manipulability)  
     - No → Tool.  
     - Yes → Cognitive machinery.  
  ```  
  This handles 6/8 cases (fails diarist; add a sub-loop for write-time only use).
