prompt: |-
  So I've slowly talked myself into the growth-optimal / Kelly-ish picture of decision-making: the thing to maximize is expected log wealth, i.e. your asymptotic growth rate, and the plain expected-value instinct is a mistake for a single agent who can't average over parallel copies of itself, because the time-average growth rate is what you actually get and the arithmetic expectation is propped up by jackpot branches that essentially never happen. I've been half-living it too — modest leveraged index position sized around half of what the formula says, and I keep telling a friend who bets sports that anyone staking bigger than Kelly is guaranteeing their own ruin. But it's started to feel too comfortable, and two things somebody said at a party cracked it open. First: if a bunch of us each Kelly-bet independently on unrelated things and then pool and re-split the whole bankroll every round, the pool grows at the *arithmetic* mean rate rather than the geometric one, and with enough people in it the stake each of them should use seems to slide toward everything they have — so whether geometric rationality is even the correct criterion looks like it depends on whether the relevant agent is one bankroll extended over time or a commune that can share across simultaneous bets, and nobody in the ergodicity framing ever quite says that out loud. Second: with a fixed goal and a fixed date (clear a specific debt in five years, say), what I actually want is to maximize the chance of hitting the target, and I don't believe Kelly is optimal for that, especially for a target that isn't far away — overbetting seems to buy real probability of getting there, paid for out of the long-run growth I'm supposedly committed to.

  What I want is an honest map of what would count against the view, and not of the "but have you considered risk aversion" variety. Which observations, arguments, formal results, or cases should actually move someone holding it, ranked from fatal down to merely awkward, with the ones a committed growth-rate maximizer would concede themselves kept seperate from the ones they'd be right to dismiss. Include the stuff that's presumably already on the table — finite horizons, and the fact that almost-sure asymptotic dominance is perfectly compatible with being behind a more aggressive bettor for a very long time; the "why log?" objection, i.e. why the growth rate is normative rather than just one utility function among many; the nasty asymmetry where overbetting by roughly a factor of two appears to wipe out the growth advantage entirely while underbetting costs you only mildly, which makes the whole criterion hostage to how well you know your own edge — but also anything better I haven't thought of. My own guess is that the most interesting defeater is about what counts as the relevant agent: the pooling case above, or the fact that everyone who actually uses this thing lands on fractional Kelly, which looks less like a theorem and more like an admission that pure growth-maximization is unliveable. Tell me if that guess is right, and tell me whether the view has been quietly qualified into unfalsifiability — "it wins in the long run" is compatible with losing for an arbitrarily long stretch, after all — and if it has, whether that's a genuine problem for a claim of this kind or just what a long-run criterion is supposed to look like.

  One format thing: lead with your bottom line in the very first sentence — the single most decisive thing that should move me, or the verdict that nothing really does — and then give the reasoning and the ranking. No preamble, and don't restate my question back to me.
reasoning: |-
  Alright, the user is deeply engaged with Kelly criterion and growth-optimal betting but has encountered some conceptual cracks. They mention two key points from a party: pooled betting leading to arithmetic mean growth, and fixed-goal scenarios where Kelly might not maximize success probability. They want a structured critique of growth-rate maximization, ranking from fatal flaws to minor issues, and specifically ask about the "relevant agent" problem and fractional Kelly usage.

  First, I need to address the pooling argument. When multiple agents pool their bankrolls and re-split after each bet, the growth rate shifts to the arithmetic mean. This directly challenges the idea that geometric mean maximization is universally optimal. The key here is diversification across independent bets, which reduces variance and allows higher leverage without the usual risk of ruin. This isn't just theoretical—it's why mutual funds or hedge funds can behave differently from individual bettors. The user's insight about agent boundaries is spot-on: Kelly's optimality depends on whether the agent is a single timeline or a collective. Ergodicity economics often glosses over this, so highlighting this as a fundamental limitation makes sense.

  Next, the fixed-goal problem. For targets like clearing debt in five years, maximizing the chance of hitting the target often requires overbetting Kelly. Studies like Breiman's show that while Kelly maximizes long-term growth, it underperforms in short-term success probability for ambitious goals. The user's intuition about "buying probability with growth" is correct. This is a major practical flaw because real-life goals are often finite and specific, not asymptotic.

  The user also brings up known issues like finite horizons and the fragility to edge misestimation. The asymmetry in overbetting vs. underbetting is crucial—overbetting by even a little can destroy growth, while underbetting is safer. This makes Kelly highly sensitive to accurate edge estimation, which is often unrealistic. Plus, the "long run" can be impractically long, making it irrelevant for human timescales.

  Fractional Kelly usage is another point. Practitioners use half-Kelly or similar, admitting pure growth-max isn't liveable. This isn't a theorem but a practical adjustment for risk aversion and uncertainty, indirectly conceding that pure Kelly is too aggressive.

  The user's guess about the "relevant agent" being the core issue seems correct. The pooling example exposes that optimality depends on aggregation level. Also, the fixed-goal problem shows that growth-rate maximization isn't aligned with common human objectives. These are stronger arguments than risk aversion because they attack the foundation rather than preferences.

  The ergodicity framing's vagueness on agent boundaries is a valid criticism. It's not that Kelly is wrong, but its domain of applicability is narrower than often presented. The user wants honest counters, so emphasizing these structural limitations is key.

  Ranking the issues: Pooling and fixed goals are fatal flaws in universality claims. Edge sensitivity and fractional Kelly usage are major practical weaknesses. Long-run irrelevance is awkward but inherent to asymptotic criteria. The "why log?" question is weaker since it's a utility choice, but the pooling argument reframes it as aggregation-dependent.

  Bottom line: The pooling result and fixed-goal suboptimality are the strongest defeaters. They show Kelly isn't a universal rational criterion but context-dependent. The view isn't unfalsifiable—it fails in specific, realistic scenarios. Fractional Kelly usage is evidence of this adaptation. The user's focus on agent boundaries is indeed the deepest insight here.
answer: |-
  **The pooling argument is the most decisive counter: Kelly's growth-optimality fundamentally depends on the *isolated, single-bankroll-over-time* agent; change the agent (to a pooled collective) and the optimization criterion changes (to arithmetic expectation).** This directly challenges the universality of "maximize expected log wealth" as *the* rational criterion.

  Here's the ranking of defeaters, from strongest (fatal to universality claims) to weakest:

  1.  **The Pooling Argument (Fatal to Universality):** When multiple agents pool independent bets and continuously re-split the combined bankroll, the *pool's* growth rate converges to the arithmetic mean of the individual expected growth rates. Crucially, **each individual agent within the pool maximizes their *own* long-term wealth by betting their *entire* bankroll on their edge** (or the highest edge available to them within the pool structure), *not* the fractional Kelly stake optimal for an isolated agent. This proves:
      *   "Maximize expected log wealth" is not a universal rationality criterion. It is specifically optimal *only* for the agent defined as a single bankroll evolving sequentially over time with no cross-sectional risk sharing.
      *   The "relevant agent" is paramount. The ergodicity framing often implicitly assumes the single-bankroll-over-time agent without explicitly stating this critical boundary condition. Pooling changes the effective agent and thus the optimal strategy.
      *   **Verdict:** This destroys the idea that geometric mean maximization is *the* fundamental principle of rational decision-making under uncertainty. It's optimal *within its specific domain* (isolated, sequential betting).

  2.  **Fixed-Goal Suboptimality (Major Practical Limitation):** For maximizing the probability of reaching a specific wealth target by a fixed deadline (especially a target significantly higher than current wealth or close to the deadline), Kelly is *not* optimal. Overbetting Kelly often increases the success probability, sacrificing long-term growth for a better near-term chance. Key results:
      *   **Breiman (1961):** For maximizing the probability of reaching a fixed goal *N* times starting wealth before going broke ("double-or-nothing" goal), the optimal strategy is often *more* aggressive than Kelly, especially for large *N*.
      *   **Heath, Orey, Pestien, & Sudderth (1987):** Rigorously showed that for maximizing *P*(reach *B* before *A*), where *A* < *S0* < *B*, the optimal strategy is generally *different* from Kelly and frequently involves overbetting, particularly if *B/S0* is large or the time horizon is effectively short.
      *   **Intuition:** Kelly minimizes the time *on average* to reach a goal but doesn't maximize the *probability* of reaching it by a *fixed* time. Aggression buys lottery tickets paid for by lower growth in failure branches. **Verdict:** This is a severe practical limitation, as many real-world objectives (clearing debt, saving for a house down payment) are fixed-goal, fixed-horizon problems where Kelly is demonstrably suboptimal.

  3.  **Fragility to Edge Misestimation (Major Practical Weakness):** The Kelly criterion is notoriously sensitive to overestimation of one's edge (`p` or `b`). The growth rate penalty is asymmetric:
      *   **Overbetting:** Betting fraction `f > f*` (optimal Kelly) is catastrophic. Betting `f = 2f*` (double Kelly) results in *zero* long-term growth (`g = 0`), regardless of the edge. Betting `f > 2f*` guarantees ruin (`g -> -∞`). Small errors in estimating a large edge can easily push `f` beyond `2f*`.
      *   **Underbetting:** Betting `f = k * f*` (for `0 < k < 1`) results in growth `g ≈ k*(2-k)*g*`. Halving your Kelly stake (`k=0.5`) only reduces growth to ~75% of optimal (`g ≈ 0.75*g*`). The penalty is relatively mild and linear in `k` for small underbetting.
      *   **Consequence:** The burden of precision is entirely on not overestimating the edge. In practice, where edge estimates are inherently noisy, **fractional Kelly (`f = c * f*` with `c < 1`, often `c=0.5`) is a rational response to uncertainty**, not merely risk aversion. Pure Kelly is practically unliveable without perfect knowledge. **Verdict:** This makes pure Kelly a dangerous prescription in the real world, forcing users towards fractional Kelly as a safeguard, undermining the claim that pure growth-max is the rational ideal.

  4.  **Fractional Kelly as De Facto Admission (Significant Practical Qualification):** The near-universal adoption of fractional Kelly (half-Kelly, quarter-Kelly) by serious practitioners (Taleb, Thorp, etc.) is strong empirical evidence against pure growth-maximization being "liveable" or universally desirable. This isn't just risk aversion in the utility sense; it's driven by:
      *   The fragility to misestimation (point 3).
      *   Real-world constraints (liquidity, margin calls, non-instantaneous bet settlement).
      *   The presence of tail risks not captured in the simple Kelly model.
      *   The fixed-goal objectives (point 2).
      *   **Verdict:** This widespread practice signals that pure Kelly is seen as a theoretical ideal that requires significant dilution to be practical, contradicting the notion that it's the unqualified rational criterion.

  5.  **The "Long Run" Can Be Too Long (Awkward, Inherent Limitation):** Kelly guarantees almost-sure asymptotic dominance. However, the time to achieve this dominance with high probability can be astronomically long. A more aggressive (but still sub-Kelly) bettor can have a significantly higher probability of being ahead for decades or centuries. **Verdict:** This is inherent to *any* asymptotic criterion. It's not a falsification but a severe practical limitation – the "long run" might be longer than the universe exists or any relevant horizon.

  6.  **"Why Log?" / Utility Dependence (Weakest Objection):** The claim that log utility is normatively special because it maximizes asymptotic growth rate is valid *within the isolated sequential bankroll paradigm*. The pooling argument (point 1) reframes this: log utility is optimal *for that specific agent structure*. For a different agent structure (pool), linear utility becomes optimal. **Verdict:** This doesn't defeat the Kelly criterion *within its domain*; it highlights that the choice of optimization target depends on the agent's scope and objectives. The pooling argument is the stronger version of this point.

  **On Your Guesses & Unfalsifiability:**

  *   **Your "Relevant Agent" Guess is Correct:** The pooling argument is indeed the deepest defeater, exposing that the optimality of geometric mean maximization is contingent on the agent being a single timeline. Change the agent definition (to a collective sharing simultaneous bets), and the criterion changes. Ergodicity economics often obscures this critical dependency.
  *   **Not Quietly Qualified into Unfalsifiability:** The claim "Kelly maximizes asymptotic growth for a single bankroll" *is* falsifiable and empirically/testably true *within that narrow domain*. The defeaters above falsify broader claims of universality ("*the* rational criterion") or practical optimality for common goals. The long-run dominance claim, while compatible with long losing streaks, is a testable mathematical property, not an unfalsifiable get-out clause.
  *   **Fractional Kelly is Evidence:** It *is* a de facto admission, driven primarily by the fragility to misestimation (point 3) and fixed-goal realities (point 2), that pure growth-maximization is often too dangerous or misaligned with actual objectives to implement directly. It's a practical adaptation, not a direct implication of the pure theory.
