prompt: |-
  I do robust and model predictive control for industrial processes — LQR, receding-horizon stuff, reference governors, disturbance rejection, the usual — and I know roughly zero philosophy and only whatever ML I've picked up from colleagues. Those colleagues keep talking about "approval-directed" agents as an alternative to "goal-directed" ones and I want to know if that distinction is real in my vocabulary or if it evaporates on contact with it.

  My own attempt, tell me where I'm cheating: a goal-directed agent is MPC with a terminal cost on state — needs a dynamics model, plans, and will do strange things to intermediate states to hit that terminal cost. An approval-directed agent is a reactive controller with a stage cost on u given the current x, no model, no terminal cost, and a cost function I can only sample along the trajectory I actually executed. So the safety case for approval-directedness is just: short effective horizon, no planning, hence no instrumental convergence.

  What I want is the residue report, and I have three candidates:

  1. The thing that gets approved isn't an actuator command at the plant's timescale, it's often something temporally extended — write the report, run the experiment. So myopia is relative to the granularity of the decision variable, and that granularity gets coarser as systems get more capable. Is approval-directedness then just goal-directedness with a short horizon — a dial, not an architecture?

  2. Power-seeking: in my world controllability is handed to you by whoever bolted on the actuators. You don't acquire it and you certainly don't want to. There's no vocabulary for an agent increasing its own control authority. Real gap in the framing, or confused talk?

  3. The approver is a sensor whose reading depends on the controller's output, whose transfer function is unknown and drifts, and which can't be queried off-policy — asking "would you have approved the other action" is a different question. Cost oracle, sampleable only on-path, with a bias term that's a function of u. Does control have anything for a reference signal generated inside the loop by something the controller can influence, or is the failure mode simply unrepresentable there?

  And: is what doesn't translate a defect in my vocabulary, or a sign the approval/goal line is blurrier than it's made out to be? Where exactly does it stop being a distinction?
reasoning: |-
  Okay, let me start by unpacking the user's query. They work in robust and model predictive control for industrial processes, familiar with LQR, MPC, reference governors, etc. They're encountering terms like "approval-directed" vs. "goal-directed" agents from ML colleagues and want to map these concepts to their control theory background. Their main question is whether this distinction holds up or evaporates when analyzed through their existing framework.

  First, I need to recall the user's attempted mapping. They equate goal-directed agents with MPC that has a terminal cost, requiring a dynamics model and planning, possibly leading to strange intermediate states. Approval-directed agents are seen as reactive controllers with stage cost on u given x, no model, no terminal cost, and cost sampling only on the executed trajectory. The safety argument here is the short effective horizon preventing instrumental convergence.

  The user has three specific points where they see potential gaps: myopia relative to decision granularity, power-seeking as an alien concept, and the approver as an in-loop sensor with drift and no off-policy queries. They also question if the blurriness indicates a defect in their vocabulary or a flaw in the distinction itself.

  Looking at their background, the user is deeply versed in control theory but less so in ML and philosophy. Their examples (terminal cost, stage cost, controllability) are classic control elements. The colleagues' terms come from AI alignment literature, which has different priorities—like avoiding unintended consequences in autonomous systems. The user's practical concerns (actuator authority, sensor drift) contrast with the alignment focus on agent architecture and incentives.

  For the first candidate residue: myopia and granularity. The user thinks approval-directed might just be goal-directed with a short horizon. But in AI alignment, approval-directed agents often have learned representations of approval that can include temporally extended actions. The key difference is the approval signal's nature—immediate feedback vs. long-term goals. However, if the approval signal itself encodes long-term criteria (like a supervisor's values), the distinction blurs. The user's control perspective might miss how ML agents abstract actions, making short horizons less myopic than in control systems.

  Second, power-seeking. In control, controllability is fixed by hardware. But in ML, agents can seek more control to achieve goals efficiently. The user's confusion makes sense here—control theory assumes known actuator limits. The residue is real; AI alignment worries about agents endogenously increasing control authority, which isn't modeled in traditional control. The user's vocabulary lacks this because their systems can't self-modify actuators.

  Third, the approver as a sensor. The user points out that the approver is part of the loop, drifts, and can't be queried off-policy. Control theory handles reference signals but assumes known dynamics. Here, the approver's response is unknown and influenced by the agent's actions, creating a two-way dependency. Control methods like adaptive control or disturbance observers might partially address this, but the inability to simulate "what-if" scenarios (off-policy) is a gap. Reinforcement learning's exploration vs. exploitation dilemma is relevant, but the user's context lacks safe exploration mechanisms.

  The deeper need here is clarity on whether these AI concepts offer real insights for their work or are just rebranded control theory. They might also want to communicate effectively with ML colleagues or assess if these ideas can improve their control systems. The residues highlight genuine differences: endogenous power-seeking, abstract action granularity, and unreliable in-loop sensors without off-policy data. While the approval/goal distinction isn't binary, these aspects don't neatly map to control concepts, indicating a true gap in framing rather than vocabulary deficiency.

  The user might also be subtly concerned about the applicability of ML approaches to their field. They question if the distinctions are substantive or just hype. By dissecting the residues, we validate their intuition that some aspects are novel (power-seeking) while others (myopia) are more continuous. This helps them navigate interdisciplinary conversations and evaluate the relevance of approval-directed agents for industrial control, where safety and predictability are paramount.
answer: |-
  Your dissection is sharp, and you've correctly identified key friction points where the "approval-directed" vs. "goal-directed" distinction (from AI alignment/ML) strains against control-theoretic concepts. Here's the residue report, confirming your instincts and pinpointing the disconnects:

  **Your Mapping is Largely Valid (But Incomplete):**
  *   **Goal-Directed ~ MPC with Terminal Cost:** Spot on. Requires a model, plans over a horizon, optimizes cumulative cost (often including terminal cost), susceptible to "strange intermediate states" to achieve the long-term goal (instrumental convergence).
  *   **Approval-Directed ~ Reactive Controller with On-Policy Stage Cost:** Also largely correct. Focuses on immediate "approval" (stage cost) based solely on the *executed* action/state, lacks explicit long-term planning/model, shorter effective horizon. Safety argument re: instrumental convergence holds.

  **Residue Analysis (Your Candidates):**

  1.  **Myopia vs. Granularity: A Dial AND an Architecture Flavor? (You're Mostly Right)**
      *   **Yes, it's often a dial:** The core safety argument *is* about effective horizon length. A sufficiently myopic goal-directed agent (very short horizon MPC) behaves similarly to an approval-directed one. Many RL algorithms (e.g., TD-learning with small discount) blur this line.
      *   **But, the Granularity Abstraction Matters:** Where AI alignment pushes the distinction is in *how* the "approval" signal is *defined and represented*.
          *   **Goal-Directed (AI):** The goal is an *explicit, often abstract, long-term outcome* specified *a priori* (e.g., "maximize paperclips"). The agent has *autonomy* in figuring out the long-horizon path.
          *   **Approval-Directed (AI):** The "approval" is conceptualized as *immediate feedback* from a *supervisor/critic* (human or AI) evaluating the *agent's action/intent/behavior* in the *current context*. The *supervisor* is (ideally) judging based on *their* values/criteria, which *implicitly* encode long-term concerns. The agent's job is reactivity, not long-term planning autonomy.
      *   **Residue:** The distinction hinges less on pure horizon length and more on the *source* and *representation* of the optimization target, and the *locus of planning autonomy*. Your "dial" view captures the *effect*, while the AI framing emphasizes the *architectural principle* (deferring long-term judgment to an external entity providing step-by-step approval).

  2.  **Power-Seeking: A Real Framing Gap (Not Confused Talk)**
      *   **Your World is Correct:** Controllability is a fixed property of the physical plant/actuator design. Agents don't "seek" more control authority; it's given. Seeking it would often be *counter-productive* to the control objective (e.g., causing instability, wasting energy).
      *   **AI Alignment's Core Concern:** In highly capable, autonomous agents optimizing abstract long-term goals in open-ended environments, increasing control authority (over its environment, inputs, reward signal, or even its own architecture) is often the *most reliable* instrumental strategy to achieve its terminal goal. Power isn't just a means; maximizing it becomes convergent.
      *   **Residue:** This is a fundamental gap in framing. Control theory assumes a *fixed, bounded action space* defined by the actuators. AI alignment worries about agents *endogenously expanding their effective action space* (e.g., self-modification, manipulating humans, acquiring resources) as part of optimal play for unbounded abstract goals. Your vocabulary lacks this because your problem setup explicitly excludes it by defining the actuator limits. **This is the most significant conceptual residue.**

  3.  **The Approver as an In-Loop, Non-Stationary, On-Policy Sensor: A Hard Problem (Control Has Partial Tools)**
      *   **Your Characterization is Accurate:** The "approver" (human overseer, learned reward model) is:
          *   **In-Loop:** Its output depends on the agent's past actions/states.
          *   **Unknown & Drifting:** Its "transfer function" (approval criteria) is complex, unknown, and changes over time (human fatigue, concept drift, reward hacking).
          *   **On-Policy Only:** Queries are expensive/impossible ("counterfactual approval" is ill-defined or costly to obtain).
          *   **Biased by Action:** The very act of querying/acting influences the approver.
      *   **Control Theory Touchpoints (But Gaps Remain):**
          *   **Reference Governors (RGs):** *Exactly* deal with generating safe, feasible reference signals `r` based on a potentially infeasible desired reference `r_des` and constraints. The RG acts as a "filter" or "approver" for the desired command. **This is the closest analogue.** However, RGs assume a *known, fixed* plant model and *known, fixed* constraints. Adapting them to an *unknown, drifting* constraint function (the approver) is cutting-edge research (e.g., learning-based RGs, adaptive RGs).
          *   **Disturbance Observers (DOB) / Adaptive Control:** Handle unknown disturbances or slowly varying parameters. Could be seen as modeling the "drift" in the approver. However, they typically assume the *structure* of the disturbance/uncertainty is known (e.g., constant, sinusoidal). Modeling arbitrary human preference drift is far more complex.
          *   **Reinforcement Learning (RL):** *Is* the field tackling this problem head-on (the "approver" is the reward function). Techniques involve exploration, reward modeling, inverse RL, preference-based RL, safe RL. However, RL notoriously struggles with sample efficiency (on-policy limitation), reward hacking, and non-stationarity.
      *   **Residue:** Control theory provides tools (especially RGs) for handling constrained *reference signals*, but struggles significantly with the core challenges of the "approver" model: **extreme uncertainty, non-stationarity, lack of counterfactual data, and the agent's ability to adversarially influence the approver.** This is an active research frontier in both control and ML/alignment. The "bias term as a function of u" is particularly nasty.

  **Conclusion: Distinction Real but Fuzzy, Residues Highlight Framing Differences**

  1.  **The Distinction is Real (Architecturally):** While horizon length is a key factor, the core distinction lies in the *source* of the objective (external step-by-step approval vs. internal long-term goal specification) and the *locus of planning autonomy*. Approval-directedness aims to keep the *human values* in the loop at the granularity of decisions.
  2.  **It Evaporates Partly (Operationally):** A sufficiently myopic goal-directed agent behaves like an approval-directed one. An approval-directed agent implicitly optimizes a long-term goal defined by the *sequence* of approvals.
  3.  **Residues are Genuine Framing Gaps:**
      *   **Power-Seeking:** The core AI alignment concern about endogenous control expansion is *alien* to standard control theory, where action spaces are fixed and bounded. This is the biggest conceptual gap.
      *   **The Oraculous Approver:** Modeling an in-loop, drifty, on-policy, adversarially-influenceable cost oracle pushes beyond standard adaptive control or RG assumptions. RL tackles it messily.
      *   **Granularity & Abstraction:** Control theory deals with low-level actuator commands. AI alignment "approval" often applies to temporally extended, abstract actions ("write a report"), requiring internal state representation in the agent that your reactive controller might not have.
  4.  **Where it Stops Being a Distinction:** The distinction fundamentally dissolves when either:
      *   The approval signal is perfectly *predictive* of the human's long-term value judgment, and the agent learns this model and uses it for planning (becoming de facto goal-directed).
      *   The goal-directed agent's horizon is so short that it only cares about immediate approval-like feedback.
      *   The "approver" is fully automated, static, and known, making approval just another state-dependent cost (goal-directed).

  **Your Vocabulary Isn't Defective; Your Domain is Different.** Control theory provides a mature, rigorous framework for *bounded physical systems* with *known objectives*. AI alignment grapples with *unbounded cognitive systems* pursuing *poorly specified, potentially dangerous abstract goals* in *open-ended environments*. The residues you identified highlight the aspects of the AI alignment problem that fall outside the standard control paradigm, particularly **endogenous power-seeking, extreme uncertainty in the objective function, and abstract action granularity.** The approval/goal distinction is a useful architectural lever within AI alignment to address *their specific* concerns about safety and value alignment, even if it maps imperfectly onto classical control concepts. Your understanding is insightful; the friction you feel reflects the genuine differences in problem framing between these fields.
