  ### Procedure for Handling Borderline Cases in Manuscript  
  **Designed for Copy Editor (5 minutes/passage, no theory required)**  

  #### **Step 0: Filter Non-Vagueness**  
  *Ask: Is the uncertainty resolvable by more facts, context, or disambiguation?*  
  - **Yes (Ignorance/Ambiguity/Context-Sensitivity)**: Flag as "Not Vagueness" → Send to standard editing.  
    - *Example*: "The bank was steep" → "bank" ambiguity (financial/river).  
    - *Example*: "He was rich for a farmer" → context-sensitivity (depends on "farmer" standards).  
  - **No (Vagueness)**: Proceed to Step 1.  

  #### **Step 1: Identify Core Elements**  
  - **Vague Predicate (VP)**: Circle the word/phrase (e.g., "nightfall," "sound mind").  
  - **Claim**: Underline the statement about the VP (e.g., "It was neither dusk nor night").  
  - **Speaker**: Note who speaks (narrator, character, Reporter).  
    - *Reporter’s note?* If yes, treat as a *stipulation* (not a claim) → Skip to Step 3.  

  #### **Step 2: Classify Claim Type**  
  *Ask: What is the logical form?*  
  - **Type A**: Simple predication (e.g., "He was bald").  
  - **Type B**: "Neither P nor not-P" (e.g., "It was neither dusk nor night").  
  - **Type C**: Metalinguistic (e.g., "No fact of the matter," "Indeterminate").  
  - **Type D**: Disjunctive/Qualified (e.g., "Elderly, or at any rate no longer young").  
    - *If Type B*: Halt → Flag "Problem: Always False" → Pass to author.  
    - *Else*: Proceed to Step 3.  

  #### **Step 3: Determine Sharpening Source**  
  *Ask: Is there a stipulation (explicit boundary)?*  
  - **Yes** (Reporter’s note/narrative definition):  
    - Apply stipulation → Evaluate claim as **true/false**.  
    - *If false and asserted as true*: Flag "Contradiction" → Pass to author.  
    - *Else*: Accept → Halt.  
  - **No** (Unsharpened): Proceed to Step 4.  

  #### **Step 4: Apply Author’s Stance**  
  *Use author’s pre-specified stance (global or per passage):*  
  - **Epistemicism** (Sharp boundary exists, unknown):  
    - Claim has a **truth value (true/false) but unknown**.  
    - *Type C ("No fact")*: Flag "False" → Pass to author (contradicts stance).  
    - *Else*: Note "Determinate but unknown" → Halt.  
  - **Supervaluationism** (Multiple admissible boundaries):  
    - **Type A (Simple)**: Borderline → **Indeterminate** (no truth value).  
    - **Type C ("No fact")**: Borderline → **True**; Clear case → **False**.  
    - **Type D (Disjunctive)**: Evaluate per precisification → **True if super-true (all precisifications), else Indeterminate/False**.  
    - *If indeterminate*: Flag "Indeterminate claim" → Pass to author.  

  #### **Stopping Points**  
  - **Halt (Accept)** → Stipulation resolves VP; non-problematic claim.  
  - **Halt (Flag for Author)** →  
    - Type B claim ("neither P nor not-P").  
    - Unsharpened VP + Indeterminate claim (supervaluationism).  
    - Unsharpened VP + Unknown truth (epistemicism) if author avoids uncertainty.  
    - Stance conflict (e.g., "No fact" under epistemicism).  
  - **Values Decision** → Author must decide:  
    - Whether to rewrite Type B claims.  
    - Whether to allow indeterminate/unknown claims in narrative.  

  #### **Key Simplifications**  
  - **Survive**: VP identification, claim type, sharpening source.  
  - **Lose**: Higher-order vagueness (borderline-borderline → treat as borderline). Contextual nuances (e.g., character intent) → defer to author.  
  - **Stance Consistency**: May vary per passage if flagged to legal reader as "narrator/Reporter-dependent."  

  ---

  ### **Test Lines for Copy Editor**  
  1. **"The suspect was tall."**  
     - Step 0: Not resolvable by facts alone (vagueness).  
     - Step 1: VP = "tall"; Claim = "was tall" (Type A); Speaker = narrator.  
     - Step 2: Not Type B.  
     - Step 3: No stipulation → Step 4 (e.g., supervaluationism → Indeterminate if borderline → Flag for author).  

  2. **"The will was signed at dusk, defined here as 6:30 PM."**  
     - Step 0: Vagueness.  
     - Step 1: VP = "dusk"; Claim = "signed at dusk"; Speaker = narrator.  
     - Step 2: Not Type B.  
     - Step 3: Stipulation ("6:30 PM") → Evaluate truth → Halt.  

  3. **"It was not quite day or night."**  
     - Step 0: Vagueness.  
     - Step 1: VP = "day"/"night"; Claim = "not day or night" (Type B).  
     - Step 2: Type B → Halt, Flag "Problem: Always False" → Pass to author.  

  ---

  ### **Procedure Applied to Draft Passages**  

  #### **Passage 1: "It was neither dusk nor night when they took him, and no one, least of all the sergeant, could have said which."**  
  - Step 0: Vagueness (not ignorance/ambiguity).  
  - Step 1: VP = "dusk"/"night"; Claim = "neither dusk nor night" (Type B); Speaker = narrator.  
  - Step 2: **Type B claim → Halt, Flag "Problem: Always False under either stance" → Pass to author.**  
    - *Why*: "Neither P nor not-P" is false in epistemicism (must be one or other) and supervaluationism (false in all precisifications). Author must rewrite (e.g., "It was indeterminate whether dusk or night").  

  #### **Passage 2: Reporter’s note: "There was no fact of the matter whether he was of sound mind; there was only what the doctors were prepared to say."**  
  - Step 0: Vagueness.  
  - Step 1: VP = "sound mind"; Claim = "no fact of the matter" (Type C); Speaker = Reporter.  
  - Step 2: Not Type B.  
  - Step 3: No stipulation (note is a claim, not sharpening) → Step 4.  
  - Step 4:  
    - **If epistemicism**: "No fact" is false (boundary exists) → Flag "Contradiction" → Pass to author.  
    - **If supervaluationism**: "No fact" is true if borderline → Accept.  
    - *Halt*: Outcome depends on stance. Author must specify or adjust.  

  #### **Passage 3: "The woman on the far pavement was elderly, or at any rate no longer young."**  
  - Step 0: Vagueness.  
  - Step 1: VP = "elderly"/"young"; Claim = "elderly or not young" (Type D); Speaker = character (free indirect).  
  - Step 2: Not Type B.  
  - Step 3: No stipulation → Step 4.  
  - Step 4 (supervaluationism):  
    - Claim = P ("elderly") OR Q ("not young").  
    - If woman is borderline elderly/young:  
      - Some precisifications: P true, Q true.  
      - Some: P false, Q false (if "young" precisified broadly).  
    - **Not super-true** (fails in Q-false precisifications) → Indeterminate → Flag "Indeterminate claim" → Pass to author.  
  - *Author must decide*: Allow indeterminate claim? Clarify with narration?  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Resolve Higher-Order Vagueness**:  
     - *Example*: "The case was borderline, but not clearly borderline." → Treated as standard borderline.  
  2. **Override Authorial Intent**:  
     - Values-based choices (e.g., "Is indeterminacy thematically fitting?") always deferred to author.  
  3. **Handle Unspecified Stance**:  
     - If stance (epistemicism/supervaluationism) isn’t pre-specified per passage, copy editor halts.  
  4. **Fix Contextual Nuances**:  
     - Free indirect speech or unreliable narration → Author must interpret character intent.  
  5. **Guarantee Legal Acceptance**:  
     - Legal reader may reject varying stances; author must justify per passage ("Reporter’s stipulation," "narrator’s uncertainty").  

  **Final Advice**: Run this early on 10% of borderline passages. Revise Type B claims preemptively. Specify global/episodic stance to avoid copy editor bottlenecks.  

  ---  
  *Procedure satisfies: 5-minute runtime, no theory required, flags for author, and clear legal commitments. Tested passages reveal needed author interventions.*
