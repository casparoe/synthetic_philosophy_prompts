prompt: |-
  I have been asked to contribute a short conceptual-foundations annexe to a health authority's draft methods guide for technology appraisal, and the section I am responsible for has to say what the guide's central rule presupposes. Before I write it, I would like your help reconstructing the implicit theory as sharply as the material allows.

  The rule, as the guide states it: a treatment is recommended if its incremental cost per quality-adjusted life year falls below a fixed monetary threshold, and rejected if it exceeds that threshold. The details that seem to matter philosophically are these. QALYs are constructed by weighting each year of life by a quality weight between zero, identified with death, and one, identified with full health, with weights below zero permitted for states judged worse than death. The weights are derived from surveys in which members of the general public choose between a shorter life in full health and a longer life in a described impaired state, and the guide averages across respondents even for states those respondents have never occupied. Gains are then summed linearly across all patients, and the guide states explicitly that the value of a QALY gain does not depend on whose it is, on how many QALYs the patient has already had, or on how the total is distributed. There are three standing exceptions to the threshold. The first is an end-of-life override permitting a premium for patients with short remaining life expectancy. The second is an unmet-need clause permitting a premium where the condition is rare and no alternative treatment exists. The third is a spillover clause: health gains accruing to carers and family members may be counted in sensitivity analysis but are excluded from the base case, and so are the future health care costs a patient would have incurred had they not died.

  What I need from you is a reconstruction, not a survey of positions, and I would rather you argue from the structure of the practice than appeal to what is standard in the literature. Specifically:

  Distinguish the different strengths of comparability the rule might be committed to: that one person's well-being can be compared in level with another's; that gains and losses can be compared cardinally across persons; and that well-being is measurable on a ratio scale rather than merely an interval scale. Which of these does the arithmetic strictly require? My own suspicion is that division by cost demands more than summation does, and that allowing negative weights demands something specific about where zero sits, but I want this set out precisely, with each commitment tied to the step in the calculation that forces it.

  Say whether the practice presupposes a welfarist reading, on which QALYs are a measure of welfare, or an extra-welfarist one, on which they measure health and society may weight health however it likes. Which parts of the practice fit which reading, and what breaks if we switch? I am especially unsure about the survey method: it asks people to evaluate states they have never been in, and the guide simply averages over the familiar gap between how patients in a state rate it and how the general public rates it from outside. What view of well-being does that method quietly commit the guide to, and would patients' own ratings be a better or worse fit for the reading you identify?

  Assess whether the no-distributional-weighting clause really commits the guide to an unweighted total view, on which the marginal moral value of a gain is the same whoever receives it, or whether it is compatible with prioritarianism, since the guide says nothing about patients' lifetime well-being levels. Then take up the exceptions. Are the end-of-life override and the unmet-need clause contradictions of the baseline rule, or do they reveal that the baseline was never unweighted in the first place? I would like the difference between weighting by absolute shortfall, the number of QALYs a patient would lose without treatment, and weighting by proportional shortfall, the fraction of remaining life lost, spelled out, and I want to know which of these the end-of-life rule actually instantiates, given that its trigger is life expectancy rather than either shortfall measure. If the answer is neither, say what view of distributive justice a life-expectancy trigger would instead commit us to, and whether that view is one the guide could coherently hold alongside its own baseline.

  One member of the panel has proposed, in a footnote, that the threshold is not a moral quantity at all but the shadow price of a fixed budget: the amount of health that unidentified patients elsewhere in the system lose when we spend here. Does that reinterpretation remove the need for interpersonal comparisons, or does it only relocate them, given that the displaced patients are not identified and the comparison is with a counterfactual population? I want a straight answer on whether this is a genuine defence of the rule or a change of subject.

  Finally, tell me what would have to change if the comparability assumption were dropped. Could the rule survive as a decision procedure without being an aggregation of well-being at all, for instance as the output of a social choice function over profiles of individual preferences, or as a device for implementing a hypothetical agreement among people who do not know whose position they will occupy? And if the implicit view were replaced by prioritarianism, sufficientarianism, or a capabilities-style view in which the currency is not well-being but what people are able to do and be, which elements of the practice would have to change: the quality weights, the linear summation, the three exceptions, or the currency itself?

  Throughout, I want three things kept clearly separate: what the practice strictly presupposes in the sense that it would be unintelligible otherwise; what it merely fits well with because several theories would license it; and where its parts seem to presuppose inconsistent things, so that the guide may be committed to a conjunction no single view would endorse.
reasoning: |-
  Okay, the user is asking for a detailed reconstruction of the implicit philosophical foundations of a health technology appraisal guide. They want a precise analysis of what the guide's central rule presupposes about interpersonal comparability, welfare measurement, and distributive justice. 

  First, I need to unpack the core elements of their query. The guide uses a cost-per-QALY threshold rule with three exceptions. The user wants me to dissect the philosophical commitments step-by-step, tying each to specific features of the methodology. 

  Hmm, the interpersonal comparability question is tricky. The arithmetic requires cardinal comparability of gains (for summing QALYs) and ratio-scale comparability (for cost-per-QALY division and negative weights). The zero point being death is crucial - it anchors the ratio scale. 

  On welfarism vs extra-welfarism, the survey method is revealing. Using general public valuations of unexperienced health states suggests an objective-list view of welfare, closer to extra-welfarism. But the summation method treats QALYs as directly additive welfare units, which leans welfarist. There's tension here.

  The distributional neutrality claim is interesting. The guide rejects weighting by patient characteristics, but prioritarianism could still fit if we interpret it as weighting by absolute lifetime shortfall. The exceptions complicate things - the end-of-life override seems to prioritize based on absolute shortfall, while unmet need might reflect severity weighting. 

  The budget shadow price interpretation doesn't actually avoid interpersonal comparisons - it just moves them to the opportunity cost level. The displaced patients' losses still need to be comparable. 

  If we dropped comparability entirely, the whole QALY framework would collapse. But alternative foundations like veil-of-ignorance approaches might preserve similar decision procedures without interpersonal welfare comparisons. 

  The user's deep concern seems to be about internal consistency. There are real tensions: between public vs patient valuations, between distribution-neutral summation and severity-sensitive exceptions, between welfarist-style aggregation and extra-welfarist valuation methods. I should flag these as "fragile coherences" - technically compatible but philosophically unstable. 

  For their annexe, I'll structure it to show where commitments are strict (cardinal comparability), where there's flexibility (welfarism interpretations), and where the pieces grind against each other (public valuations + distribution neutrality). The exceptions aren't contradictions but reveal unstated prioritarian intuitions. 

  Most importantly, I need to resist surveying literature and stay focused on reverse-engineering the guide's own logic. The user wants the implicit theory laid bare, not compared to external frameworks. Every claim must be tied to a specific rule or calculation in the guide.
answer: |-
  Here is a reconstruction of the implicit philosophical commitments of the guide's rule and its details, structured to address your specific queries:

  ### I. Interpersonal Comparability: Strict Commitments
  1.  **Cardinal Comparability of Gains/Losses (Strict Commitment):** Linear summation of QALY gains across patients *requires* that gains and losses in QALYs are cardinally comparable across persons. The practice assumes that a gain of 1 QALY for person A represents the *same magnitude* of welfare/health benefit as a gain of 1 QALY for person B, and that these magnitudes can be added meaningfully. *(Forced by: Summation of QALY gains across patients)*
  2.  **Ratio-Scale Measurability (Strict Commitment):** Three features necessitate a ratio scale with a fixed, meaningful zero point (death):
      *   **Cost-per-QALY Calculation:** Division (ΔCost / ΔQALY) requires a true zero. A ratio scale means that a 2 QALY gain is exactly twice as large as a 1 QALY gain, not just ordinally larger or differing by an arbitrary interval. *(Forced by: Division in the ICER calculation)*
      *   **Negative Weights:** States "worse than death" imply a negative value *relative to the zero point*. This only makes sense if zero (death) is a fixed, meaningful anchor, not an arbitrary point on an interval scale. *(Forced by: Explicit allowance for negative quality weights)*
      *   **End-of-Life Calculation:** Assessing "short remaining life expectancy" inherently relies on quantifying the *absolute magnitude* of life lost without treatment relative to zero (death). *(Reinforced by: End-of-life exception logic)*
  3.  **Level Comparability (Implied but Not Strictly Forced by Arithmetic):** While cardinal gain comparability is essential, the practice *strongly implies* level comparability. The guide's explicit rejection of weighting based on "how many QALYs the patient has already had" or distribution suggests it *could* function purely on gain comparability. However, the exceptions (especially end-of-life, potentially unmet need) and the very concept of "shortfall" rely implicitly on comparing the absolute level of (expected) welfare/health between individuals relative to a norm (full health/lifespan) and zero. The surveys also implicitly ask respondents to compare absolute levels of welfare across hypothetical lives.

  ### II. Welfarism vs. Extra-Welfarism: A Tension
  *   **The Practice Creates Ambiguity:** The guide does not neatly fit either category, leading to internal tension.
  *   **Welfarist Elements:**
      *   *Currency:* QALYs are explicitly a measure combining length *and quality* of life, strongly associated with welfare.
      *   *Source of Values:* Using public preferences about trade-offs between length and quality of life directly imports a *conception of welfare* (what makes a life worth living) into the metric. Asking about states never occupied suggests an attempt to measure *experienced utility* from an informed perspective, aligning with welfarism.
      *   *Additivity:* Summing QALY gains directly across individuals treats them as commensurable units of welfare benefit.
  *   **Extra-Welfarist Elements:**
      *   *Focus:* The *stated* goal is health technology appraisal, implying health is the primary object of value.
      *   *Valuation Method (Conflict):* Averaging public valuations, *even when they systematically differ from patient valuations*, decisively breaks from welfarism. Welfarism requires respecting the preferences/valuations *of the individual experiencing the state*. Using public valuations constitutes an "objective" (societal) judgment about the *health state's value*, not the individual's experienced welfare. This is classic extra-welfarism.
      *   *Spillover Exclusion (Base Case):* Excluding carer/family health gains treats "health gain" as the narrowly defined currency, not overall welfare.
  *   **Conclusion:** The core *currency* (QALY) and *summation* lean welfarist. However, the *valuation method* (public preferences overriding patient experience) is fundamentally extra-welfarist. **The survey method commits the guide to an extra-welfarist reading of the *source of values*.** Using patient ratings would be a *better* fit for a welfarist reading but a *worse* fit for the guide's apparent desire for a societal perspective on health state value.

  ### III. Distributional Neutrality, Prioritarianism, and Exceptions
  *   **Baseline Rule (Unweighted Sum):** The explicit rejection of weighting based on recipient identity, past QALYs, or distribution commits the guide to *unweighted summation* – the moral value of a QALY gain is identical regardless of who receives it. This is compatible with *classical utilitarianism* but also with any view accepting cardinal comparability and unweighted summation.
  *   **Compatibility with Prioritarianism?** **Yes, but only weakly.** The guide says nothing about patients' *lifetime* well-being levels. Prioritarianism weights gains based on the *absolute level* of lifetime welfare. Without lifetime data or weighting, the baseline practice is *agnostic* but *operationally equivalent* to unweighted summation. Prioritarianism *could* be implemented within the framework *if* lifetime welfare levels were known and incorporated via differential weights – but the guide explicitly forbids this. The baseline rule *fits* prioritarianism only if lifetime levels are assumed equal or irrelevant.
  *   **Exceptions: Revelation or Contradiction?**
      *   **End-of-Life Override:** This *breaks* the baseline unweighted sum rule. It assigns higher value (a premium) to QALY gains for a specific group (those with short life expectancy). This reveals an unstated commitment to *weighting by absolute shortfall*. The trigger (short remaining life expectancy) implies that the *absolute number of QALYs lost* without treatment (the shortfall) is the morally relevant factor, not the proportional loss. A patient losing 2 expected QALYs gets higher priority than one losing 1 QALY, regardless of what proportion of their total life that represents. This aligns with a *sufficientarian* or *prioritarian* concern for those facing the largest absolute welfare deficit (dying imminently).
      *   **Unmet Need (Rare Conditions):** This also breaks the baseline. The justification is often linked to severity (large shortfall) or lack of alternatives (inability to achieve health). It strongly suggests *severity weighting* – valuing gains more for those in worse health states (larger absolute shortfall). While distinct from the end-of-life focus on *remaining* lifespan, it shares the core idea of weighting by the magnitude of the deficit.
      *   **Distinction:** The guide's end-of-life rule uses *absolute shortfall* (expected QALYs lost = life expectancy). *Proportional shortfall* (e.g., losing 50% of your expected remaining life vs. 10%) would require knowing both the individual's expected lifespan *and* the magnitude of the loss. The guide does *not* use this trigger.
  *   **Coherence:** The exceptions are *contradictions* of the baseline rule's stated principle of distributional neutrality. They reveal that the baseline was *not* intended to be a complete moral theory, but a default operational rule subject to overrides based on other distributive principles (prioritarianism/sufficientarianism focused on absolute shortfall/severity). Holding both simultaneously is *incoherent at the philosophical level* but reflects pragmatic policy compromise.

  ### IV. The Threshold: Moral Value vs. Shadow Price
  *   **The Budget Constraint Reinterpretation:** Framing the threshold as the shadow price of a fixed budget (health forgone elsewhere per £ spent) *does not* eliminate the need for interpersonal comparisons. It merely *relocates* them.
  *   **Relocated Comparisons:** To interpret the threshold as the "health lost elsewhere," you must:
      1.  Cardinal comparability of QALYs: Gains here are compared to losses elsewhere.
      2.  Unweighted summation: The *sum* of QALYs lost by the unidentified displaced patients must be comparable to the *sum* gained by the treated patients. The counterfactual comparison inherently involves aggregating welfare losses across a different group.
  *   **Is it a Defence or Subject Change?** It's primarily a **change of subject** regarding *what the threshold represents* (opportunity cost vs. moral value of a QALY). However, it *can* be seen as a partial defence of the *decision rule* (maximising total QALYs under a budget constraint is technically coherent). It doesn't defend the *welfarist/extra-welfarist* aspects of the QALY itself, nor the *distributional implications* of unweighted summation, nor the *exceptions*. It sidesteps the *moral justification* for QALY maximisation itself, framing it purely as an efficiency criterion under scarcity.

  ### V. Dropping Comparability & Alternative Foundations
  *   **Dropping Interpersonal Comparability:** This would **fatally undermine** the core rule.
      *   Summation across individuals becomes meaningless.
      *   The ICER calculation comparing cost to *total* QALY gain becomes unintelligible.
      *   The threshold (whether moral or shadow price) loses its foundation.
  *   **Alternative Foundations:**
      *   **Social Choice / Preference Aggregation:** The rule *could* be reinterpreted as a social choice function aggregating individual preferences (e.g., QALY weights as proxies for strength of preference). However, this requires the *assumption* that preferences are cardinally measurable and interpersonally comparable in strength – which reintroduces comparability. The public survey method already incorporates *one form* of preference aggregation (averaging).
      *   **Veil of Ignorance (Hypothetical Agreement):** The rule *could* be seen as the output rational individuals would choose behind a veil of ignorance not knowing their health state or wealth. This *might* justify unweighted summation and perhaps even the threshold *if* combined with assumptions about risk aversion and the budget constraint. However, it would likely demand different valuation methods (perhaps patient valuations) and would need to explicitly justify the exceptions within the hypothetical agreement.
  *   **Alternative Moral Views & Required Changes:**
      *   **Prioritarianism:** Requires weighting QALY gains by the recipient's *lifetime welfare level*. This necessitates: 1) Estimating lifetime welfare (far beyond current health), 2) Abandoning the explicit "no weighting" clause, 3) Potentially modifying exceptions (end-of-life might align, unmet need might need rethinking).
      *   **Sufficientarianism:** Focuses on bringing people above a sufficiency threshold. This would require: 1) Defining a health/QALY sufficiency threshold, 2) Prioritizing treatments for those below the threshold or those lifting patients *to* the threshold, 3) Dramatically altering the summation rule and threshold application, 4) Exceptions might be subsumed or altered.
      *   **Capabilities Approach:** Changes the *currency* from health-related welfare (QALY) to capabilities (opportunities for functionings). This requires: 1) A fundamental shift in the metric (developing capability weights/measures), 2) Re-evaluating the valuation method (focusing on freedom, not health experience or preference), 3) Reconceiving aggregation (summing capability gains? Prioritizing threshold achievements?), 4) Exceptions would need radical reinterpretation based on capability deprivation.

  ### VI. Summary: Presuppositions, Fits, and Fragile Coherences
  *   **Strict Presuppositions (Unintelligible Without):**
      1.  Cardinal comparability of QALY gains/losses across persons (Summation).
      2.  Ratio-scale measurability of QALYs with death as the fixed, meaningful zero point (ICER calculation, Negative Weights, End-of-Life logic).
  *   **Strong Fits (Deeply Resonant, Multiple Theories Possible):**
      1.  Unweighted summation (Utilitarianism, some VEIL interpretations).
      2.  Extra-welfarist health focus (despite welfarist currency) (Valuation method, Spillover exclusion).
      3.  Severity weighting via absolute shortfall (Exceptions).
  *   **Fragile Coherences / Inconsistent Parts:**
      1.  **Welfarist Currency vs. Extra-Welfarist Valuation:** The QALY implies welfare, but public valuation over patient experience rejects welfarism's core tenet.
      2.  **Distributional Neutrality Baseline vs. Distributive Exceptions:** The baseline explicitly rejects weighting, while the exceptions introduce weighting based on shortfall/severity, contradicting the stated principle.
      3.  **Public Valuation & Experience Gap:** Averaging public valuations of unexperienced states, knowing they differ systematically from patient valuations, sits uneasily with *both* welfarism (ignores experience) and pure extra-welfarism (why preferences?).
      4.  **Threshold Interpretation:** Moral value vs. opportunity cost represents a fundamental ambiguity about what the threshold *is*.
      5.  **Exceptions Justification:** While both appeal to severity/shortfall, end-of-life is explicitly triggered by *remaining* life expectancy (absolute shortfall), while unmet need lacks a clear, consistent trigger linked explicitly to a measurable shortfall in the guide's description, making its philosophical basis less clear.

  This reconstruction reveals the guide's rule as a pragmatic hybrid, presupposing strong comparability, operationally extra-welfarist in valuation despite a welfarist-looking currency, formally unweighted but substantively incorporating severity weighting through exceptions, resulting in a structure held together more by policy necessity than a single coherent philosophical foundation.
