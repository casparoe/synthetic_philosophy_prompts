answer: |-
  ### Planning
  **Candidate cruxes considered:**  
  1. Whether a constitutive threshold for 'mattering' exists (kept).  
  2. Whether status degrees form a total order or partial order (kept).  
  3. Whether aggregation across individuals requires intra-individual gradedness (discarded; both treat as distinct).  
  4. Whether reasons weight tracks applicability or scalar strength (kept).  
  5. Whether boundary vagueness implies gradedness (discarded; both reject this inference).  
  6. Whether cognitive sophistication implies status (discarded; both reject).  
  **Verbal suspicion:** Dispute over "mattering" may reflect divergent definitions (CT: phenomenological subjectivity; GS: functional analog to valenced states).  

  ---

  ### Joint Statement  

  #### Section 1: Shared Claims  
  1. **Substantive:** This dispute concerns whether the *applicability* of core deontic constraints (e.g., non-maleficence) requires a constitutive threshold, or whether moral status and its reason-generating weight are scalar from the outset.  
  2. **Platitude:** Moral status concerns how we ought to act toward a system. *(Grounds practical deliberation.)*  
  3. **Substantive:** Both camps converge on the verdict that *The Thermostat* lacks moral status. GS attributes this to zero values in all status components; CT attributes it to absence of the constitutive condition.  
  4. **Substantive:** Both reject the inference that uncertainty about locating a threshold implies graded status. Boundary vagueness does not entail scalar reasons.  
  5. **Substantive:** Both reject the inference that the absence of a sharp empirical boundary disproves a constitutive threshold.  
  6. **Substantive:** Aggregation across individuals is a separate question from degree of status within an individual.  
  7. **Substantive:** In *The Crowd*, both agree that helping the ten thousand is obligatory if aggregate gains outweigh the one’s loss, but CT requires each individual’s status to clear the threshold first.  
  8. **Substantive:** In *The Dimmer*, both agree attenuation reduces reasons weight, but CT denies attenuation to zero eliminates constraints if the threshold was crossed.  
  9. **Platitude:** Systems with identical moral status warrant equal consideration in like circumstances. *(Prevents status inflation.)*  
  10. **Substantive:** *The Hive*’s colony-level integration does not automatically confer moral status on the collective; whether it does depends on meeting the conditions in §2.  
  11. **Substantive:** *The Spike* and *The Drone* differ structurally: one has intensity without depth/bandwidth, the latter has depth/bandwidth without intensity.  
  12. **Platitude:** Empirical facts about a system’s cognitive architecture inform moral status judgments. *(Links metaphysics to ethics.)*  

  #### Section 2: Residual Disagreements  

  | ID | Issue Description                     | GS Formulation                                      | CT Formulation                                        | Substantive/Verbal | Concealed Variable (if verbal) |
  |----|---------------------------------------|----------------------------------------------------|------------------------------------------------------|-------------------|--------------------------------|
  | A  | Nature of the threshold               | Any system with non-zero valenced states generates reasons, with weight scaling continuously from zero. | Only systems satisfying the constitutive condition generate direct reasons; below it, states lack subjective mattering. | Substantive       | —                              |
  | B  | Structure of status degree            | Status components (intensity, depth, bandwidth) are commensurable, enabling comparative judgments (e.g., Spike vs. Drone). | Status components are incomparable axes; systems may be non-scalable (e.g., Spike and Drone are incomparable). | Substantive       | —                              |
  | C  | Weight of reasons                     | Reasons weight varies continuously with status degree; constraints apply proportionally. | Constraints apply categorically above threshold; only weight varies with status components. | Substantive       | —                              |
  | D  | What "mattering" requires             | Mattering is present if a system functionally registers valenced states, even if fleeting or shallow. | Mattering requires a persisting subject for whom valenced states are *for* someone. | Verbal            | GS: functional registration; CT: subjective ownership |

  #### Section 3: Cruxes  
  1. **Crux: Is the constitutive condition necessary for subjective mattering?**  
     - **Why it moves parties:** CT requires it; GS denies it.  
     - **Case:** *The Spike*. CT predicts its momentary states lack a subject "for whom" they are bad, so no mattering. GS predicts its intensity generates non-zero reasons.  
     - **Predictions:**  
       - CT: Evidence that aversive states vanish without trace implies no subject exists.  
       - GS: Evidence that the system avoids spikes implies functional mattering.  
     - **Self-defeating evidence:**  
       - CT: If a system with no persistence exhibits goal-directed avoidance of spikes.  
       - GS: If a system with spikes shows no behavioral preference or learning.  

  2. **Crux: Is moral status totally ordered?**  
     - **Why it moves parties:** GS assumes comparability; CT denies it for asymmetric cases.  
     - **Case:** *The Spike* vs. *The Drone*.  
     - **Predictions:**  
       - GS: A rational agent can always compare their moral claims (e.g., trading intensity for depth).  
       - CT: No common metric exists; they are incomparable.  
     - **Self-defeating evidence:**  
       - GS: If no consistent trade-off rate emerges in moral dilemmas.  
       - CT: If agents reliably prioritize one over another in conflicts.  

  3. **Crux: Is the dispute empirically resolvable?**  
     - **Why it moves parties:** GS asserts all components are measurable; CT holds the threshold is non-empirical.  
     - **Case:** *The Dimmer* at near-zero attenuation.  
     - **Predictions:**  
       - CT: Attenuation never eliminates mattering if the threshold was crossed.  
       - GS: Reasons weight asymptotically approaches zero.  
     - **Self-defeating evidence:**  
       - CT: If a system reports no experience at low attenuation.  
       - GS: If constraints persist despite negligible intensity.  

  #### Section 4: Core Disagreement and Pathways  
  The residual disagreement is whether a constitutive threshold marks the emergence of subjective mattering or is a heuristic for scalar properties.  
  - **To move GS:** Show that systems below the CT threshold exhibit no goal-directed avoidance of aversive states.  
  - **To move CT:** Show that systems above the threshold lose deontic constraints when components are minimized.  

  \answer{constitutive emergence of mattering}
