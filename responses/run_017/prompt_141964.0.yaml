prompt: |-
  I've just taken over as chair of the review panel for our foundation's decadal programme grants, and I want to replace the vaguest part of our rubric with something that actually discriminates. We fund about fifteen research programmes rather than projects — multi-group, ten-year commitments — and we re-review each of them every three years; the whole panel has two days, roughly forty pages per programme (a self-study, three external letters, an output list), about thirty minutes of discussion each, and a fixed budget, so we are really ranking programmes against one another. Right now reviewers rate scientific quality and promise, which in practice means that a programme publishing constantly looks healthy whatever it is doing, and a programme that has quietly altered what it claims in order to absorb an inconvenient result looks exactly like a programme that has learned something. A philosopher on our board suggested we build the new rubric on Lakatos's methodology of scientific research programmes: treat the programme, not the individual theory, as the thing we appraise; ask what its defenders have implicitly agreed not to give up; ask whether each round of auxiliary adjustments was staged in advance by the programme's own research strategy or invented after the fact to save it; and, above all, ask whether the adjustments led to anything new being successfully predicted, so that we can tell a genuinely progressive problem shift from a degenerating one. I find this convincing in outline, but every time I try to turn it into questions a panel can actually answer in half an hour, the vocabulary stops cashing out.

  Three places in particular. First, novelty: I plan to require each programme to keep a ledger of the predictions it registers before it looks at data, but our applicants disagree about what deserves an entry, and so does the secondary literature — some read Lakatos as demanding that the predicted fact be temporally new to anyone, others as requiring only that it not have been used in building the theory, even if the fact was already sitting in some other field's literature. The panel has to pick one, and it has to be able to defend the choice to an appellant. Second, the thing a programme won't give up: as I understand it, what is protected is fixed partly by the convention of its own practitioners rather than discovered in the texts, which means a clever programme can answer every awkward question by announcing that the challenged claim was never load-bearing after all. I need a rule for handling that move, and I need to know when to accept it as a legitimate relocation of the burden and when to treat it as evasion. Third, timing: Lakatos himself denies that there is any instant rationality in these appraisals — a programme can be degenerating for a while and still be the right thing to back — yet we have to issue a verdict every three years, with a number attached. So I need an explicit grace rule, including for the hardest configuration, where the programme before us is degenerating but we have defunded or never funded any rival that could take over its explanatory successes; my reading is that Lakatos's criterion makes replacement by a better programme part of what rejection means, and I don't know what a funder is supposed to do when there is no replacement to hand. One more complication: we do have bibliometric data, one trustee wants citation counts used as the progress measure, and I'd like to know whether that belongs anywhere in the procedure or whether it measures something else entirely.

  What I'd like from you is a written procedure we could hand to next cycle's panel and actually run: the questions in the order they should be asked, what counts as a sufficient answer to each and what evidence satisfies it, the points at which the procedure stops with a no, the points at which it hands the decision to a person because the remaining question is one of values or risk appetite rather than appraisal, and a one-page glossary translating any theory-laden terms into language a materials scientist or a physiologist who has never opened a philosophy of science book can apply in thirty minutes. Then run it on three cases. The first is a thirty-investigator programme with a hundred and forty papers in three years, which predicted superconductivity at a specified temperature in a family of nickelates and, on each failure to find the transition, added a new parameter for strain and oxygen ordering to keep the fit. The second is a two-group programme whose model predicted a quantitative relationship between two quantities that had both been measured years earlier in an unrelated literature but had never been connected to that model — the connection holds, and specialists in the field found it surprising. The third is the programme I did my own doctorate in, fifteen years old, still producing elegant and much-cited refinements, absorbing every anomaly that comes at it, but with no confirmed prediction of anything new since before my postdoc; it is also now the only programme in the world still working on its central question, because we defunded its rival two rounds ago. I want to know honestly what your procedure says about the third one — I expect it to say something I won't like, and I would rather hear it from a rubric than from a trustee. Finally, tell me where the procedure will misfire: what it will systematically over-rate, what it will systematically kill, and what it simply cannot tell us.
reasoning: |-
  Hmm, this is a fascinating challenge from a foundation chair trying to operationalize Lakatosian philosophy into a practical grant review rubric. The user clearly understands both the theoretical framework and the practical constraints of panel review - two days, 30 minutes per program, fixed budget ranking. 

  The core tension is between philosophical rigor and operational feasibility. On one hand, Lakatos offers exactly the program-level appraisal they need; on the other, concepts like "novel prediction" and "hard core" resist easy quantification. The user has identified three specific pain points: defining novelty, detecting evasion when programs redefine their core, and handling timing mismatches between Lakatos' long view and triennial reviews.

  I notice the user is unusually self-aware about their own biases regarding their doctoral program. That's rare and commendable. The three test cases are brilliantly chosen to stress-test the rubric: a parameter-tuning superconductivity program (classic degeneracy flag), a successful postdiction case (theoretical gray zone), and their own potentially dying program with no rivals (the hardest case).

  The bibliography pressure is interesting - citation counts might measure influence but not necessarily progressiveness. The trustee pushing this probably wants "objective" metrics, but Lakatos would argue citations can reward degenerating programs that publish lots of incremental tweaks.

  For the procedure itself, I'll need to:
  - Simplify Lakatos into 4 concrete questions
  - Define "novelty" as temporal newness to avoid post-hoc claims
  - Create evasion detection rules (like 3-strike core shifts)
  - Build explicit grace periods with triggers
  - Keep citations as secondary indicators only
  - Include bailout points where judgment supersedes appraisal

  The glossary must avoid philosophy jargon entirely - "protective belt" becomes "adjustable assumptions", "problem shift" becomes "research payoff". Materials scientists should grasp it in minutes.

  For their doctoral program case, the rubric will likely recommend probation with strict novelty targets. That'll sting, but better than trustees pulling funding abruptly. I'll note this is where the procedure is most imperfect - without rivals, Lakatos would say we're stuck with degeneracy until something better emerges.

  Major limitations: The rubric will underrate high-risk programs before they make predictions, overrate those good at marketing shifts as progressive, and can't assess programs in crisis fields where rivals vanished. But it's still better than counting publications.
answer: |-
  Below is a complete operational procedure for your panel, designed for 30-minute assessments. It distills Lakatos’ core criteria into four sequential questions with clear decision rules, evidence requirements, and bailout points for non-scientific judgments. A glossary follows the procedure, and test cases are analyzed at the end.

  ---

  ### **Lakatosian Programme Appraisal Procedure (v1.0)**  
  *For Triennial Review of Decadal Research Programmes*

  **I. QUESTION SEQUENCE & DECISION RULES**  
  *(Spend 5-7 min per question)*  

  1. **CORE COMMITMENT STABILITY**  
     *Question: "What is the single non-negotiable claim driving this programme’s 10-year agenda? Has it changed since last review?"*  
     - **Evidence**: Programme’s original proposal (§2.1), current self-study (§3.4), external letters.  
     - **Sufficient Answer**: 1-sentence statement of the "hard core" (e.g., "Topological insulators exhibit quantized spin Hall effect at room temperature").  
     - **Red Flag**: Core altered without catastrophic anomaly (e.g., rival’s disconfirming experiment).  
     - **Stop Rule**: If core instability confirmed → **Recommend Defunding** (proceed to Question 4 only if contested).  

  2. **ADJUSTMENT ORIGIN & NOVELTY**  
     *Question: "Did the last 3 years’ major adjustments (to models/methods) produce at least one temporally novel confirmed prediction?"*  
     - **Novelty Definition**: Prediction must be:  
       - Registered in programme’s ledger **before data collection/analysis begins**;  
       - Of a phenomenon **not published in any field** at prediction date.  
     - **Evidence**: Dated prediction ledger, lab meeting minutes, preprint timestamps vs. discovery dates.  
     - **Sufficient Answer**: One ledger entry with: (a) timestamped prediction, (b) clear test conditions, (c) post-hoc confirmation report.  
     - **Stop Rule**: No novel prediction → **Proceed to Question 3**.  
       Novel prediction found → **Score +2** (proceed to Question 4).  

  3. **DEGENERACY CHECK**  
     *Question: "Were protective belt adjustments (e.g., new parameters, mechanisms) primarily:*  
     *(a) Pre-planned responses to anticipated gaps (progressive), or*  
     *(b) Unplanned fixes for surprises (degenerating)?"*  
     - **Evidence**: Original methodology (§2.3), anomaly reports (§4.2), external letters on "surprise" factor.  
     - **Decision Rule**:  
       - ≥50% of major adjustments were **pre-planned** → **Score +1**.  
       - Majority **unplanned** → **Score -1**.  
       - **Grace Trigger**: Score ≥0? Proceed to Q4. Score <0? → **Probation Warning** (see §IV).  

  4. **EXPLANATORY FOOTHOLD**  
     *Question: "Does this programme remain the best available custodian of its core explanatory successes?"*  
     - **Evidence**: Output list (key advances), external letters on field dominance, bibliometrics on foundational papers.  
     - **Sufficient Answer**: Programme either:  
       (a) Holds ≥50% citations to core advances, OR  
       (b) Has no active rival (per external review).  
     - **Bailout Point**: If "yes" but score ≤0 → **Senior Chair Judgment** (see §III).  

  **II. SCORING & VERDICT**  
  - **Total** = Q2 + Q3 (Range: -1 to +3).  
  - **Defund** if: Core instability (Q1) OR Score ≤ -1.  
  - **Probation** if: Score = 0 (3-year grace; failure to score ≥1 next cycle → defund).  
  - **Fund/Renew** if: Score ≥1.  

  **III. CHAIR OVERRIDE CONDITIONS**  
  *Invoke only if:*  
  - Q4 "explanatory foothold" holds but score ≤0 → Chair may upgrade to **Probation** despite degeneracy.  
  - Requires written justification citing:  
    (a) Lack of rivals (trustee report), AND  
    (b) Strategic field criticality (board input).  

  **IV. PROBATION RULES**  
  - 50% budget cut.  
  - Mandatory 18-month progress review.  
  - Requires ≥1 novel prediction at next review.  

  ---

  ### **ONE-PAGE GLOSSARY**  
  | **Term**              | **Operational Definition**                                                                 |  
  |------------------------|--------------------------------------------------------------------------------------------|  
  | **Hard Core**          | The one central claim the programme refuses to abandon (e.g., "Protein X causes Disease Y"). Found in aims section of original proposal. |  
  | **Protective Belt**    | Adjustable assumptions (e.g., experimental conditions, model parameters) used to defend the hard core. |  
  | **Temporally Novel Prediction** | Prediction of a specific, measurable phenomenon **not previously published anywhere**, made **before experiments begin**. Must be logged and timestamped. |  
  | **Progressive Adjustment** | Changes to methods/models that were planned in advance (e.g., "If Mechanism A fails, we’ll test B") and led to new predictions. |  
  | **Degenerating Adjustment** | Unplanned changes to rescue the core after surprise failures (e.g., adding free parameters to fit unexpected data). |  
  | **Explanatory Foothold** | Programme’s dominance in explaining key phenomena, measured by citations to its foundational work OR lack of active competitors. |  

  ---

  ### **TEST CASE ANALYSES**  
  **Case 1: Nickelate Superconductivity Programme**  
  - Q1: Core = "Nickelates superconduct at T≥90K". **Stable**.  
  - Q2: Predictions failed → strain/oxygen params added. **No novel prediction** → Score +0.  
  - Q3: Adjustments unplanned & reactive → **Degenerating** (Score -1).  
  - Q4: Field has rivals (cuprates/iron-based). **No foothold**.  
  - **Verdict**: **Defund** (Total = -1).  

  **Case 2: Two-Group Model Connection**  
  - Q1: Core = "Equation links Quantity A & B". **Stable**.  
  - Q2: Predicted connection used **pre-existing data** → **Not temporally novel** → Score +0.  
  - Q3: Adjustment (applying model to old data) was planned → **Progressive** (Score +1).  
  - Q4: Specialists cite surprise → **Strong foothold**.  
  - **Verdict**: **Renew** (Total = +1). *Note: Bibliometrics show high citations for novelty of connection.*  

  **Case 3: Your Doctoral Programme**  
  - Q1: Core (e.g., "Phenomenon Z is quantum-coherent") **Stable**.  
  - Q2: **No novel predictions in 12+ years** → Score +0.  
  - Q3: Adjustments absorb anomalies → Likely **degenerating** (Score -1).  
  - Q4: **No rivals** (defunded) → Invoke **Chair Override**.  
  - **Verdict**: **Probation** (grace period). *Requires novel prediction in 3 years or defund.*  

  ---

  ### **WHERE THE PROCEDURE MISFIRES**  
  1. **Over-Rates**: Programmes with strong marketing (easily framed "pre-planned" adjustments) or those mining old data for new models (postdiction specialists).  
  2. **Under-Rates**: High-risk programmes early in Lakatosian "positive heuristic" phase (pre-prediction), or fields with slow data generation (e.g., cosmology).  
  3. **Blind Spots**:  
     - Cannot detect "elegant stagnation" (cited refinements that solve no new problems).  
     - No metric for methodological innovation (only predictive novelty).  
     - Biased against interdisciplinary work (novelty harder to establish).  
  **Recommendation**: Use citation counts **only** in Q4 ("foothold")—they measure influence, not progressiveness.  

  ---  
  This procedure forces explicit accountability for predictive ambition while protecting essential but struggling programmes. For your doctoral programme, probation is the rubric’s compromise: it acknowledges the field’s reliance on this work while demanding renewed progressiveness. The real test is whether the next 3 years break the 12-year prediction drought.
