  The damaging honesty moment: When the CEO says the fund isn't just predicting but "structurally long" on human suffering. It's technically truthful about their position but reveals the moral bankruptcy.

  Structure outline:
  1. Ominous opening ("delayed gratification")
  2. Data section redefining success (slower growth = vindication)
  3. Pivot to new scarcity vectors (pollinators, topsoil)
  4. Historical framing (19th vs 20th century)
  5. Fee announcement as punchline

  Tone calibration: Use hedge fund jargon ("asymmetric exposure," "duration mismatch") seriously. Let the horror linger in subtext—like calling malnutrition a "precursor state."

  Final check: No philosophy terms. All concepts explained in-universe (e.g., "conditional prediction" via Fossil Fuel Exclusion Clause). And yes, the Boserup footnote belongs—it shows the fund dismissing counter-evidence as "temporal anomalies."
