  Below is a complete, runnable classroom simulation designed to meet your goals. It emphasizes how electoral incentives prioritize traceable benefits (pork-barrel projects) over universal ones, even when they have equal societal value, while showcasing lotteries' representativeness and the impact of institutional memory.

  ---

  ### **Game Setup: Chambers of Influence**
  **Objective**: Accumulate points for your district by passing beneficial legislation.  
  **Players**: 24 students, each representing a district (1–24).  
  **Chambers**:  
  - **Elected Chamber (EC)**: 8 members chosen via campaign spending.  
  - **Lot Chamber (LC)**: 8 members chosen randomly via station cards (mirrors class demographics).  
  **Rounds**: 3 rounds (20 min each), 15-min debrief (75 min total).  
  **Materials**:  
  - Station cards (pre-made, reflecting class diversity: e.g., 12 "Low Income," 8 "Middle Income," 4 "High Income").  
  - Campaign tokens (physical or tracked): **4 rich** (10 tokens), **8 middle** (5 tokens), **12 poor** (2 tokens).  
  - Motion cards (pre-written, two types per round).  
  - Scoreboard (points per district).  

  ---

  ### **Rules & Payoff Scheme**
  #### **1. Chamber Selection (Each Round)**
  - **Elected Chamber (EC)**:  
    - Anyone may run by spending ≥1 token.  
    - Top 8 spenders win seats (ties broken randomly).  
    - **Seniority**: Re-elected members get +2 tokens next round (simulates incumbent advantage).  
  - **Lot Chamber (LC)**:  
    - **Rounds 1 & 2**: 8 random station cards dealt (one term only; cards reshuffled each round).  
    - **Round 3 (Staggered)**: 4 members from Round 2 retained; 4 new drawn randomly.  
  - **Non-Members**: Act as voters for EC elections but don’t vote on motions.  

  #### **2. Motions & Voting**  
  - Each round, both chambers vote on **two motions** (presented simultaneously):  
    - **Type A (Traceable)**: "Build a bridge in District [X]."  
      - *Effect*: District X gains **15 points**.  
    - **Type B (Universal)**: "Fund a national literacy program."  
      - *Effect*: **All districts** gain **1 point**.  
  - **Voting**:  
    - Chambers vote separately (majority wins).  
    - **Key**: Both motions can pass/fail independently.  
  - **Motion Details**:  
    - Type A’s district (X) is randomized each round.  
    - Total societal benefit is **identical per motion** (15 points total).  

  #### **3. Points & Incentives**  
  - Points are cumulative. The top 3 districts win small prizes (e.g., candy, extra credit).  
  - **Critical Incentive**: EC members know re-election requires **visible credit**. Type A projects (bridge) are traceable to their vote; Type B (literacy) is not.  

  #### **4. Timeline**  
  - **Round 1 (20 min)**:  
    - Assign tokens/station cards.  
    - EC election (5 min).  
    - LC random draw (2 min).  
    - Vote on Motions A & B (8 min).  
    - Record points (5 min).  
  - **Round 2 (20 min)**:  
    - Re-elect EC (+2 tokens for incumbents).  
    - New LC draw.  
    - Vote on new Motions A & B.  
  - **Round 3 (20 min)**:  
    - Re-elect EC.  
    - Staggered LC (4 retained + 4 new).  
    - Vote on final motions.  
  - **Debrief (15 min)**: Structure below.  

  ---

  ### **Predicted Dynamics & Pitfalls**  
  **What Will Happen**:  
  1. **EC skew**: Wealthy/talkative students dominate EC (token inequality → re-election loop).  
  2. **Voting bias**:  
     - EC passes **more Type A motions** (even if Type B benefits their district equally).  
     - LC passes **more Type B motions** (no re-election pressure → vote "for the common good").  
  3. **Staggered LC (Round 3)**:  
     - Retained members may advocate for Type B (institutional memory), but efficiency drops due to new members’ learning curve.  

  **What Will Go Wrong**:  
  - **Time crunch**: Voting may run over; keep motions simple.  
  - **Student confusion**: Clarify that Type A benefits *one* district, Type B benefits *all equally*.  
  - **LC disengagement**: Non-members may feel left out. Mitigate by:  
    - Letting non-members lobby chambers (1 min per round).  
    - Ensuring all rotate into chambers by Round 3.  
  - **Overly strategic play**: Some may "game" Type A by colluding ("Vote for my bridge, I’ll vote for yours"). This *enhances* the lesson (logrolling = real electoral politics).  

  **Limitations of the Game**:  
  - **No deliberation**: Real sortition uses discussion to leverage diverse perspectives. Here, chambers only vote.  
  - **Oversimplified "universal" benefits**: Real policies (e.g., climate action) have complex tradeoffs.  
  - **Non-traceable ≠ non-valuable**: In reality, Type B policies (e.g., education) may have higher long-term ROI.  

  ---

  ### **Debrief Framework**  
  **1. Reveal the Objective** (2 min):  
  > "Today simulated *sortition* (selection by lot) vs. election. No one mentioned it to avoid bias. How did chambers differ?"  

  **2. Analyze Data** (5 min):  
  - Tally motions passed by chamber/type:  
    |          | Type A Passed | Type B Passed |  
    |----------|---------------|---------------|  
    | **EC**   | [Count]       | [Count]       |  
    | **LC**   | [Count]       | [Count]       |  
  - Discuss: *Why did EC favor traceable projects (Type A)?*  

  **3. Map to Real-World Concepts** (5 min):  
  - **Electoral Incentives**: EC members need credit for re-election → pork-barrel spending.  
    - *Example*: Bridges renamed after politicians; untraceable policies avoided.  
  - **Sortition’s Strengths**:  
    - LC mirrored class demographics (show station cards).  
    - No re-election pressure → more universal policies.  
  - **Staggered Terms**: Institutional memory (Round 3) helped but slowed decisions.  

  **4. Critical Discussion** (3 min):  
  - *"Should we use sortition in real life? What did the game miss?"*  
    - Pros: Better representation, less corruption.  
    - Cons: No expertise (EC had "seniority"), no deliberation here.  

  **5. Bridge to Theory** (Optional):  
  - Mention real examples:  
    - Ancient Athens (sortition for magistrates).  
    - Modern proposals (Citizens’ Assemblies for climate policy).  

  ---

  ### **Why This Works**  
  - **Electoral distortion** emerges organically: Token inequality → EC skew → traceable bias.  
  - **Sortition’s fairness** is felt when LC’s station cards mirror the class.  
  - **Staggered terms** show tradeoffs: Continuity vs. fresh perspectives.  
  - **No jargon** until debrief avoids priming.  

  **Adjust on the Fly**:  
  - If EC passes Type B often, ask: *"Did anyone fear losing re-election for voting 'yes' on Type B?"*  
  - If time runs short, skip staggered LC or reduce motions to one per type.  

  This simulation makes abstract incentives visceral. Students leave understanding why electoral systems prioritize pork—and why sortition offers an alternative.
