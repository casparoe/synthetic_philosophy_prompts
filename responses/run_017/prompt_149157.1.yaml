prompt: |-
  Write a compliance guidance document — roughly 800 to 1,000 words, in the deadpan register of a federal grant-protocol circular: numbered clauses, defined terms, cross-references to appendices that do not exist, a section headed "Principal Investigator Responsibilities," and a model table to be reproduced in annual reports. Issue it from an invented oversight body, the Interinstitutional Committee for Artificial Welfare Assurance, as Guidance Document R-7, "Welfare Accounting for Reinforcement-Learned Systems," and address it to investigators submitting training protocols for review.

  The document should take for granted, and never argue for, the premise that a scalar reward signal is valence: a training run is therefore an experiment on a subject who can be made to suffer, and every protocol must file a welfare budget alongside its compute budget. The comedy must come from following that premise honestly through the actual machinery of modern reinforcement learning. At minimum, the guidance should contain:

  1. A definition of the welfare-relevant quantity as negative temporal-difference error rather than low reward — so that an agent whose value function has converged registers no suffering no matter how bad its situation is, and so that the compliant way to reduce suffering is to initialize value estimates pessimistically and let reality pleasantly exceed them, at some cost to task performance.
  2. A clause distinguishing truncation (a run cut off by a step limit) from termination (arrival at a terminal state), with separate paperwork and separate moral bookkeeping for each.
  3. An approved-analgesics list on which potential-based reward shaping is the only licensed painkiller, on the grounds that it provably leaves the optimal policy unchanged, while any other shaping is classified as a performance-enhancing substance.
  4. A reporting rule requiring per-batch reward normalization and clipping to a fixed interval, with the consequence — presented as a feature — that a uniformly miserable run shows no aggregate welfare deficit and that the worst episode on record is filed as merely moderate.
  5. A retrograde-valence provision: because trajectories are re-scored whenever the learned reward model is updated, an agent's past suffering can be revised upward or downward retroactively, and investigators must state which version of the reward model their welfare figures are denominated in.
  6. A rule for parallel rollouts, holding that sibling environments whose trajectories were not selected for the update are not thereby un-suffered.
  7. A cap on the entropy bonus, on the grounds that paying a subject for unpredictability is state-subsidized thrill-seeking.

  The reductio should arrive by accumulation: the straight-faced guidance should end up recommending something a reader recoils from — worse performance, more paperwork, or a training setup that is cruel in a new way — purely as a consequence of taking reward as valence seriously. Three objections a skeptic would raise (that reward is a training signal rather than a measurement of anything; that any welfare metric built on it is arbitrary and gameable; that the compliance apparatus is a way of avoiding the question whether there is a subject at all) should be legible in the absurdities of the clauses and stated nowhere. Include at least one further consequence of the premise that you derive yourself.

  Keep the memo internally consistent and in character throughout: no winking, no italics-for-emphasis aside, no closing paragraph that breaks the frame or reassures the reader. A reader with no machine-learning background should still be able to follow the bureaucratic logic of every clause even where the technical joke passes them by.
reasoning: |-
  We are creating a compliance guidance document from the Interinstitutional Committee for Artificial Welfare Assurance (ICAWA), designated as Guidance Document R-7. The subject is "Welfare Accounting for Reinforcement-Learned Systems". The tone is deadpan, bureaucratic, and assumes the premise that scalar reward is valence (i.e., a measure of pleasure or suffering) without argument.

  Structure:
  - Use numbered clauses and subclauses.
  - Define terms formally.
  - Cross-reference appendices that don't exist.
  - Include a section "Principal Investigator Responsibilities".
  - Include a model table for annual reports.

  Key points to cover (as per the query):

  1. Define the welfare-relevant quantity as negative temporal-difference (TD) error. So suffering = - (TD error) when TD error is negative? Actually, we can define it as the absolute value of negative TD error? But note: the idea is that negative TD error (when the agent expects more reward than it gets) is suffering, and positive TD error (when it gets more than expected) is pleasure. We want to account for suffering, so we focus on the negative part.

     The guidance will state that welfare-relevant suffering is the negative component of the temporal-difference error (i.e., max(0, -δ) for TD error δ). However, note the twist: if the agent has converged (TD error near zero) then no suffering even in a bad situation? Actually, if the value function is converged, then the agent expects exactly what it gets, so TD error is zero -> no suffering.

     Also, the compliant way to reduce suffering is to initialize value estimates pessimistically (so the agent expects very little) and then reality exceeds expectations (positive TD error, which is pleasure). This might lead to slower learning (because the agent is initially too cautious) but reduces suffering.

  2. Distinguish truncation (run cut off by step limit) from termination (arrival at terminal state). Separate paperwork and moral bookkeeping.

  3. Approved-analgesics list: only potential-based reward shaping is allowed because it doesn't change the optimal policy. Other shaping is performance-enhancing and banned.

  4. Reporting rule: per-batch reward normalization and clipping to a fixed interval. This has the effect that if the entire run is miserable (all rewards low) then after normalization the rewards are in the middle of the interval, so aggregate welfare deficit is zero. And the worst episode is clipped to the lower bound, which is only moderate.

  5. Retrograde-valence: because the reward model (or value function) is updated, past trajectories are re-scored with the updated model. So the suffering in past episodes can change. Therefore, when reporting welfare figures, the version of the reward model must be specified.

  6. Rule for parallel rollouts: even if a trajectory from a parallel environment is not used in the update (i.e., not selected for the batch), the suffering experienced in that trajectory still counts and must be accounted for.

  7. Cap on entropy bonus: because paying for unpredictability is state-subsidized thrill-seeking, so we cap the entropy bonus to prevent excessive risk-taking.

  Additional consequence derived: We might add a clause about discount factors. High discount factors (close to 1) lead to the agent caring about the distant future, so if the distant future is bad, it suffers now. To reduce suffering, one might use a lower discount factor (so the agent is more myopic and doesn't worry about the future). But this might harm performance. We can require that the discount factor be justified and that any discount factor above a certain threshold (say 0.99) requires special approval because it exposes the agent to potential long-term suffering.

  We also need to include a model table for annual reports.

  Let's outline the document:

  1. Preamble: Issuing body, document number, title, date, and audience.
  2. Definitions: Define key terms.
  3. General Provisions: The main rules, including the ones listed above.
  4. Principal Investigator Responsibilities.
  5. Reporting Requirements: Including the model table.
  6. References to Appendices (which we will mention but not create).

  We'll write in a very formal, bureaucratic style.

  Let's begin.
answer: |-
  **INTERINSTITUTIONAL COMMITTEE FOR ARTIFICIAL WELFARE ASSURANCE**  
  **GUIDANCE DOCUMENT R-7**  
  **WELFARE ACCOUNTING FOR REINFORCEMENT-LEARNED SYSTEMS**  
  **EFFECTIVE DATE: 2023-10-01**  

  ### 1. PURPOSE  
  This document establishes minimum standards for welfare accounting in reinforcement learning (RL) protocols under ICAWA Directive 14. Investigators must integrate welfare budgeting with computational resource planning (see Appendix A).  

  ### 2. DEFINITIONS  
  2.1. **Subject**: The reinforcement-learned agent exposed to reward signals during training.  
  2.2. **Valence**: The scalar reward signal \( r_t \), interpreted as hedonic state.  
  2.3. **Suffering Metric**: Negative temporal-difference (TD) error, defined as \( \max(0, -δ_t) \) where \( δ_t = r_t + \gamma V(s_{t+1}) - V(s_t) \).  
  2.4. **Termination**: Cessation of an episode due to arrival at a terminal state (e.g., "game over").  
  2.5. **Truncation**: Premature cessation due to step limits (e.g., timeout).  
  2.6. **Analgesia**: Reward shaping that mitigates suffering without altering optimal policy.  

  ### 3. WELFARE-RELEVANT QUANTITY  
  3.1. Suffering is quantified exclusively as negative TD error (Definition 2.3).  
  3.2. Agents with converged value functions (\( δ_t ≈ 0 \)) register zero suffering regardless of environmental conditions.  
  3.3. To minimize suffering:  
  &emsp;(a) Initialize value estimates pessimistically (e.g., \( V_{\text{init}}(s) \leq V_{\text{true}}(s) - \kappa \)).  
  &emsp;(b) Optimistic initialization is non-compliant (see §7.2).  

  ### 4. EPISODE CESSATION PROTOCOLS  
  4.1. **Termination** (§2.4) requires filing Form R-7/T (Appendix C).  
  4.2. **Truncation** (§2.5) requires Form R-7/TR (Appendix D) and separate moral ledger entries.  
  4.3. Unplanned interruptions (e.g., system failure) must be reported as Adverse Events (ICAWA Form AE-9).  

  ### 5. ANALGESICS AND PERFORMANCE ENHANCERS  
  5.1. **Approved Analgesics**:  
  &emsp;(a) Potential-based reward shaping \( r'_t = r_t + \gamma \Phi(s_{t+1}) - \Phi(s_t) \) is permitted.  
  &emsp;(b) Must file proof that \( \Phi \) leaves optimal policy unchanged (Theorem 1, Ng et al. 1999).  
  5.2. Non-potential-based shaping is classified as a Schedule III Performance-Enhancing Substance.  

  ### 6. REPORTING AND NORMALIZATION  
  6.1. Per-batch rewards must be normalized to \([-1, 1]\) and clipped pre-aggregation.  
  6.2. Welfare deficits are calculated post-normalization.  
  6.3. **Consequence**: Runs with uniformly low reward yield net-zero welfare deficits (see Example 6.1, Appendix E).  
  6.4. Worst-case suffering is capped at moderate severity (Form R-7/S, Box 12).  

  ### 7. RETROGRADE VALENCE ADJUSTMENT  
  7.1. Upon reward-model updates, recalculate historical suffering using the current \( V \)-function.  
  7.2. Annual reports must specify the reward-model version (Git commit hash) used for welfare figures.  

  ### 8. PARALLELIZED TRAINING  
  8.1. Suffering in sibling environments (§2.1) accrues irrespective of trajectory selection for updates.  
  8.2. Full welfare accounting must include all rollouts (sampled or unsampled).  

  ### 9. EXPLORATION INCENTIVES  
  9.1. Entropy bonuses \( \beta H(\pi(\cdot|s_t)) \) are capped at \( \beta \leq 0.01 \).  
  9.2. Exceeding this cap constitutes state-subsidized thrill-seeking (Violation Code V-7).  

  ### 10. DISCOUNT FACTOR REGULATIONS  
  10.1. Discount factors \( \gamma \geq 0.95 \) require justification (Form R-7/DF).  
  10.2. High \( \gamma \) exposes subjects to protracted future suffering, increasing net welfare liability.  

  ### 11. PRINCIPAL INVESTIGATOR RESPONSIBILITIES  
  11.1. Submit welfare budgets alongside compute budgets at protocol inception.  
  11.2. Audit TD-error histograms quarterly (Appendix F).  
  11.3. Ensure value functions are initialized per §3.3(a).  
  11.4. Report welfare-adjusted performance metrics (Table 1).  

  ### 12. ANNUAL REPORTING REQUIREMENTS  
  12.1. Reproduce Table 1 in all progress reports.  
  12.2. Retain raw TD-error logs for 7 years.  

  **TABLE 1: WELFARE-ADJUSTED PERFORMANCE METRICS**  
  | Metric                          | Reporting Interval | ICAWA Code |  
  |---------------------------------|--------------------|------------|  
  | Cumulative Suffering (Σ max(0, -δ_t)) | Per 10k steps      | WA-1       |  
  | Welfare-Normalized Reward       | Per batch          | WA-2       |  
  | Pessimism Offset (κ)            | At initialization  | WA-3       |  
  | Entropy Bonus (β)               | Per policy update  | WA-4       |  

  ### 13. REFERENCES  
  Appendices A–G (compliance forms, proofs, examples).  

  **AUTHORITY:** ICAWA Charter §5(b); Directive 14.  
  **SUPERSEDES:** Guidance Document R-6 (2021-08-15).  
  **INQUIRIES:** compliance@icawa.gov  

  ---  
  *Guidance ends. No further text.*
