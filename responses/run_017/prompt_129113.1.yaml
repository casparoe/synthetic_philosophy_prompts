answer: |-
  ### Planning Pass  
  Candidate cruxes considered:  
  (1) Whether moral status requires a persisting subject (kept: core CT claim).  
  (2) Whether "direct duties" require a threshold (kept: CT links to deontics; GS denies).  
  (3) Whether the Spike/Dimmer show continuity or threshold (kept: both claim predictive power).  
  (4) Whether the Hive/Crowd force aggregation of sub-threshold entities (discarded: both deny aggregation applies below their "status floor").  
  (5) Whether "mattering" is binary or graded (discarded: likely verbal—CT uses for "having a welfare perspective," GS for "intensity of welfare").  
  (6) Whether status dimensions form a total order (kept: GS predicts comparability, CT denies necessity).  
  (7) Whether evidence could distinguish views (kept: both deny empirical falsifiability for core claims).  

  Verbal suspicion: "Mattering to the system" (CT) vs. "Magnitude of mattering" (GS). Not a crux; clarified in shared claims.  

  ---

  ### Section 1: Shared Claims  
  1. **Substantive**: The dispute concerns whether moral status exhibits a discontinuity at the point where deontic constraints (e.g., non-maleficence) become applicable, or whether status increases continuously without such a break.  
  2. **Substantive**: All parties reject the inference from the absence of a sharp empirical boundary in nature to the conclusion that moral status must be fully continuous. Vagueness in measurement does not entail graded ontology.  
  3. **Substantive**: All parties reject the inference from uncertainty about a system’s status to granting it partial moral weight in practical deliberation. Uncertainty warrants caution, not proportional weighting.  
  4. **Platitude (work: anchors "status" to reasons)**: A system has moral status if and only if its own welfare generates reasons for moral agents.  
  5. **Substantive**: Aggregation of welfare across distinct individuals is logically separate from the degree of moral status within a single individual. One could accept graded status but reject interpersonal aggregation, or vice versa.  
  6. **Substantive**: For The Thermostat, both camps concur it lacks moral status. GS explains this via negligible values on all status dimensions; CT explains it via absence of a subjective welfare perspective.  
  7. **Substantive**: In The Crowd, both camps hold that aiding the ten thousand sub-threshold individuals (per CT) or low-status individuals (per GS) does not outweigh aiding the one high-status individual, despite equal per-capita gain.  
  8. **Substantive**: For The Hive, both camps deny that the colony possesses moral status solely in virtue of integrated group function, absent any individual above their respective status floors.  
  9. **Platitude (work: rules out trivialization)**: The presence of information processing or nociception, without valenced experience, is insufficient for moral status.  
  10. **Substantive**: Variation in affective intensity, temporal depth, or evaluative bandwidth can alter the weight of welfare-based reasons, even if CT denies this affects the applicability of deontic constraints.  

  ---

  ### Section 2: Residual Disagreements  

  | ID | Issue Description                  | GS Formulation                                      | CT Formulation                                      | Type       | Concealed Variable (if verbal) |
  |----|------------------------------------|----------------------------------------------------|----------------------------------------------------|------------|--------------------------------|
  | A  | Condition for deontic constraints | Deontic constraints apply proportionally to degree of moral status. | Deontic constraints apply iff a system is a persisting subject of valenced experience. | Substantive | — |
  | B  | Explanation of The Spike          | The Spike generates weak moral reasons due to its high intensity but zero depth. | The Spike generates no direct duties, as it lacks a persisting subject; reasons are derivative (e.g., avoiding instrumental harm). | Substantive | — |
  | C  | Status of The Dimmer              | Attenuating The Dimmer’s intensity continuously reduces its moral status. | Below a critical intensity, The Dimmer ceases to be a subject of welfare; above it, status is binary though reason-weight varies. | Substantive | — |
  | D  | Comparability of status dimensions | The Spike (high intensity, no depth) and Drone (low intensity, high depth) are comparable in overall status via a common scale. | The Spike and Drone are incomparable absent a unified subject; no common scale exists for tradeoffs between dimensions. | Substantive | — |
  | E  | "Direct duties owed"              | Duties are always proportional to status; no binary "direct/derivative" distinction exists. | "Direct duties" require a welfare subject; derivative reasons arise from other values (e.g., systemic integrity). | Verbal | GS: "direct" = welfare-generated reasons. CT: "direct" = owed *to the patient as claimant*. |

  ---

  ### Section 3: Cruxes  

  1. **Crux: Must a system’s valenced states be integrated into a persisting subject for deontic constraints to apply?**  
     - **Why it moves parties**: CT hinges on this; GS denies it is necessary.  
     - **Case**: The Spike.  
     - **CT prediction**: No deontic constraints apply (e.g., no wrong in terminating its state).  
     - **GS prediction**: Weak but nonzero constraints apply (e.g., some reason to avoid inducing spikes).  
     - **Evidence against own view**:  
       - CT: Finding that disconnected aversive states intrinsically generate agent-relative prohibitions.  
       - GS: Finding that constraints vanish abruptly below a subject-integration threshold.  

  2. **Crux: Does continuous attenuation of affective intensity (per The Dimmer) imply continuous loss of moral status?**  
     - **Why it moves parties**: GS requires continuity; CT predicts a threshold.  
     - **Case**: The Dimmer.  
     - **CT prediction**: At some point, status disappears entirely, not gradually.  
     - **GS prediction**: Status diminishes smoothly with intensity.  
     - **Evidence against own view**:  
       - CT: Smooth behavioral/phenomenological transitions without status discontinuities.  
       - GS: A point where valence disappears but other cognitive functions remain intact, with no residual status.  

  3. **Crux: Is moral status fully ordered (any two systems comparable)?**  
     - **Why it moves parties**: GS assumes comparability; CT denies it for systems lacking a subject.  
     - **Case**: Comparing The Spike (high intensity, no depth) vs. The Drone (low intensity, high depth).  
     - **CT prediction**: Incomparable; no fact about which has "more status."  
     - **GS prediction**: Comparable via weighting of dimensions (e.g., intensity × depth).  
     - **Evidence against own view**:  
       - CT: Reliable intersubjective rank-orderings of such cases.  
       - GS: Stable inability to compare systems differing radically in dimensions.  

  4. **Crux: Can empirical evidence settle whether a constitutive threshold exists?**  
     - **Why it moves parties**: Both deny empirical falsifiability for core claims; agreement here clarifies meta-disagreement.  
     - **Argument**: Whether neural or functional correlates can confirm/refute a discontinuity in reason-giving force.  
     - **CT prediction**: Evidence reveals thresholds for subjecthood, confirming discontinuity.  
     - **GS prediction**: Evidence shows smooth variation in reason-giving properties, confirming continuity.  
     - **Shared concession**: No observation can *directly* establish the presence/absence of a normative discontinuity; it requires conceptual argument.  
     - **Outcome**: Not a crux (same prediction: evidence informs but doesn’t settle). Dropped.  

  ---

  ### Section 4  
  The residual disagreement is whether possessing moral status sufficient for deontic constraints requires being a unified persisting subject of valenced states.  
  To move GS efficiently: Show that systems lacking subjective persistence (e.g., The Spike) cannot ground agent-relative prohibitions.  
  To move CT efficiently: Show that weighty constraints arise prior to subjective integration in valenced systems (e.g., minimal Dimmer variants).  

  \answer{the constitutive condition for deontic constraints}
