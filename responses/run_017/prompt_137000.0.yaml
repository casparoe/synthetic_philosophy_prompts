prompt: |-
  I convene a working group that drafts consensus guidance for a health-data research consortium. Its members are clinicians, epidemiologists, data scientists, lawyers and two philosophers, and roughly every second meeting deadlocks over an existence question: whether a proposed diagnostic category is a real disease or a construct, whether a deployed risk model makes decisions, whether a data-sharing population is the sort of thing that can have interests. Half the room wants to settle these by stipulating a definition and moving on; the other half thinks the stipulation quietly buries the real disagreement. I have read enough of the philosophical literature on verbal disputes, quantifier variance, conceptual ethics and metalinguistic negotiation to believe there are decent tests for which side is right in a given case, but my facilitators are not philosophers, the room is not patient, and I get ninety minutes per deadlock. So I need something operational.

  Please write a decision procedure my facilitators can run: the steps in order, each phrased as a question that can be asked out loud to non-philosophers, what counts as a sufficient answer at that step, and where the procedure stops with a verdict or hands the question back to the group as a values call rather than a diagnosis. Three verdicts matter to me, not two: MERELY VERBAL (dissolved once the contested expression is disambiguated or regimented), SUBSTANTIVE (a first-order or meta-level disagreement that survives regimentation), and what I will call CONCEPTUAL (the parties are disagreeing about which concept we ought to use, which is a normative dispute and must not be closed by fiat even though it is, in a sense, about language). At the core I want: a regimentation step, in which the contested term is replaced by a freshly coined one with stipulated application conditions, to see whether the disagreement survives; a check for whether either party is using the term to track a distinction it takes the things themselves to make rather than one we project, since my understanding is that agreement on all the first-order facts does not by itself establish that a dispute is merely verbal; a downstream-licensing step, asking what each party takes the existence claim to entitle them to — an explanation, a legal or moral consequence, a line in our guidance — on the ground that if the licenses differ, agreeing on usage does not settle the dispute; and, for disputes that do dissolve, a cost-of-relabeling check, because a settlement that puts the whole burden of re-description on one party's vocabulary is not one the group will honour.

  Then run the procedure on two deadlocks from our last meeting, showing the answer at each step: (A) clinicians and philosophers disagreeing about whether a symptom cluster in the new dataset is a distinct disease entity or an artifact of how we code it; (B) engineers and clinicians disagreeing about whether a deployed risk model makes a decision for which someone must take responsibility. I expect (A) to come out MERELY VERBAL and could live with that. I would be annoyed if (B) came out MERELY VERBAL as well, because our consent and accountability framework is built on there being a decision-maker; if the procedure returns that, I want to see precisely which step produces it and what we would have to give up in order to keep it. Finally, tell me which kinds of deadlock the procedure cannot settle at all, and at which points the facilitator's own judgment is doing the work while appearing not to.
reasoning: |-
  We are designing a decision procedure for resolving deadlocks in a working group. The procedure will have several steps, each phrased as a question that can be asked out loud to non-philosophers. The goal is to classify the deadlock into one of three verdicts: MERELY VERBAL, SUBSTANTIVE, or CONCEPTUAL.

  The steps of the procedure are:

  1. **Regimentation Step**: Replace the contested term with a newly coined term with stipulated application conditions to see if the disagreement persists.
  2. **Projection Check**: Check if either party believes the distinction being made is one that the world makes independently (i.e., a "joint in nature") rather than one we project.
  3. **Downstream Licensing Step**: Ask what each party takes the existence claim to entitle them to (e.g., explanatory power, legal consequences, etc.). If the licenses differ, then even if there's agreement on the facts, the dispute might not be merely verbal.
  4. **Cost-of-Relabeling Check**: If the dispute dissolves, check the cost of relabeling to ensure that the burden of re-description is not unfairly placed on one party.

  Additionally, we note that if the dispute is not resolved by the above, it may be either SUBSTANTIVE (if there's a factual disagreement that survives regimentation) or CONCEPTUAL (if the disagreement is about which concept we ought to use, which is normative).

  We will run the procedure on two examples:

  (A) Disagreement about whether a symptom cluster is a distinct disease entity or an artifact of coding.
  (B) Disagreement about whether a deployed risk model makes a decision for which someone must take responsibility.

  Finally, we will discuss the limitations of the procedure.

  ---

  **Decision Procedure:**

  **Step 1: Regimentation**
  - **Question to the group**: "Can we replace the contested term [insert term] with a new, made-up word that we define precisely by the conditions under which it applies? For example, instead of arguing about whether X is a 'disease', let's define 'glark' to mean [proposed conditions]. Then, does the disagreement about whether X is a glark persist?"
  - **Sufficient answer**: If both parties agree that under the stipulated definition the disagreement vanishes (i.e., they agree on whether the thing is a glark or not), then move to Step 2. If the disagreement persists even under the new term, then the dispute is SUBSTANTIVE (because there is a factual disagreement about the world that is not resolved by redefinition). If they cannot agree on the conditions for the new term, then the dispute might be CONCEPTUAL (if they are disagreeing on which definition to use) and we move to Step 3.

  **Step 2: Projection Check**
  - **Question to each party**: "Do you think the distinction we are making (between things that are glarks and things that are not) is one that the world makes independently of us, or is it a distinction that we project for our purposes?"
  - **Sufficient answer**: If both parties agree that the distinction is projected (i.e., it's a construct) and they have already agreed on the facts under regimentation, then the dispute is likely MERELY VERBAL. However, if at least one party insists that the distinction is independent of us (i.e., it's a real joint in nature) and the other does not, then we must note that there might be a deeper disagreement about realism vs. anti-realism. This doesn't by itself change the verdict, but it leads to the next step.

  **Step 3: Downstream Licensing**
  - **Question to each party**: "What practical or normative consequences do you think follow from calling this thing a glark? For example, does it entitle us to a certain kind of explanation, legal responsibility, or a line in our guidance? And if we didn't call it a glark, what would we lose?"
  - **Sufficient answer**: Compare the answers. If the parties have the same downstream implications in mind, then the dispute is MERELY VERBAL. If they have different implications, then even if they agree on the facts, the dispute is not merely verbal because the label carries different weights. In this case, the dispute is CONCEPTUAL (because they are disagreeing on the normative implications of the concept) and must be resolved by the group as a values call.

  **Step 4: Cost-of-Relabeling Check (applied only if the dispute is dissolved as MERELY VERBAL)**
  - **Question to the group**: "If we settle on using the new term 'glark' with the stipulated conditions, what is the cost of relabeling? Specifically, does one party have to abandon a lot of their existing terminology and concepts? Is the burden of re-description shared fairly?"
  - **Sufficient answer**: If the cost is too high or the burden is unfair, then the group might decide to go back and reconsider. However, this step does not change the verdict of MERELY VERBAL; it just addresses the practicality of the solution.

  **Verdicts**:
  - **MERELY VERBAL**: The dispute dissolves under regimentation and the parties agree on the facts and the downstream implications (or the difference in implications is not at stake in the current context). The group can then adopt the new term and move on, provided the cost of relabeling is acceptable.
  - **SUBSTANTIVE**: The disagreement persists even after regimentation because there is a factual dispute about the world. The group must resolve the factual issue (which might require more data or expertise) or acknowledge the disagreement and move on despite it.
  - **CONCEPTUAL**: The parties agree on the facts but disagree on which concept to use because of the normative implications (downstream licensing). This is a normative dispute and must be resolved by discussion of values, not by stipulation.

  ---

  **Running the Procedure on Example (A): Symptom cluster as a distinct disease or artifact**

  Contested claim: "Is symptom cluster X a distinct disease entity or an artifact of coding?"

  **Step 1: Regimentation**
  - We replace "disease" with a new term, say "zorg". We stipulate: "A 'zorg' is a set of symptoms that (a) co-occur more often than by chance, (b) have a common underlying biological mechanism, and (c) can be identified independently of the coding system used to record them."
  - **Question**: "Under this definition, do you agree on whether X is a zorg?"
  - **Answer**: The clinicians might say: "We don't know about (b) because we haven't found a mechanism, but we know (a) is true and (c) is false because it disappears when we change coding systems." The philosophers might agree that under this definition, X is not a zorg because (b) is unknown and (c) is false. So they both agree: X is not a zorg. The disagreement vanishes? Then we move to Step 2.

  **Step 2: Projection Check**
  - **Question**: "Do you think the distinction between what is a zorg and what isn't is a distinction that exists in nature independently of us, or is it a distinction we project?"
  - **Answer**: The clinicians might say it exists in nature (they are realists about diseases). The philosophers might say it's projected. But note: they already agreed on the facts under the regimentation. So we move to Step 3.

  **Step 3: Downstream Licensing**
  - **Question**: "What consequences follow from calling X a zorg? And what if we don't?"
  - **Answer**:
    - Clinicians: "If it's a zorg, then we should invest in finding a biological mechanism and develop targeted treatments. If not, we treat symptoms individually."
    - Philosophers: "If we call it a zorg, we risk reifying a social construct and might misallocate resources. We should instead focus on the social determinants of health."
    - The downstream implications differ: The clinicians want to use the label to justify research and treatment pathways, while the philosophers worry about reification and misallocation.

  Because the downstream implications differ, the dispute is not merely verbal. It is CONCEPTUAL. The group must now discuss which set of implications they want to endorse. However, note that in the original dispute, the clinicians might have a different definition of disease in mind (one that doesn't require an independent biological mechanism). If so, we might have to go back and adjust the regimentation. But in this case, we used a definition that captured the criteria the clinicians care about (they want a biological basis) and the philosophers care about (independence from coding). They agreed on the facts under that definition, but the normative implications differ.

  **Verdict for (A)**: CONCEPTUAL. The group must have a values discussion about the implications of labeling.

  But note: the original expectation was that (A) would be MERELY VERBAL. However, the downstream licensing step revealed a normative difference. If the group had been using the term 'disease' without the requirement of an independent biological mechanism, then the regimentation might have been different. Let's try an alternative regimentation:

  Alternative Step 1 for (A):
  - Stipulate: "A 'flurg' is a set of symptoms that co-occur more often than by chance and that we choose to treat as a single entity for the purposes of treatment and research, regardless of underlying mechanism."
  - Then ask: "Is X a flurg?"
  - Clinicians: Yes, because they want to treat it as a single entity.
  - Philosophers: They might say no, because they think that without an independent biological basis, treating it as a single entity is harmful. Or they might say yes, but then they would object to the consequences.

  But note: the philosophers might not agree to the definition because they object to the normative implications. This shows that the dispute is not merely verbal.

  Alternatively, if we can get both parties to agree on the facts under a neutral definition and then see that the normative implications are the same, then it would be merely verbal. But in this case, the implications are different.

  **Revised verdict for (A)**: CONCEPTUAL. The group must discuss the values: what are the costs and benefits of treating the symptom cluster as a distinct disease entity? They cannot avoid the normative question by stipulation.

  ---

  **Running the Procedure on Example (B): Risk model making a decision**

  Contested claim: "Does the deployed risk model make a decision for which someone must take responsibility?"

  **Step 1: Regimentation**
  - Replace "makes a decision" with a new term, say "blork". We stipulate: "A system 'blorks' if it takes an input, processes it through an algorithm, and produces an output that directly leads to an action without human intervention in that specific case."
  - **Question**: "Under this definition, does the risk model blork?"
  - **Answer**:
    - Engineers: The model takes input, processes, and produces an output (e.g., a risk score) that is used to trigger an action (e.g., a high-risk patient is automatically scheduled for an intervention). So yes, it blorks.
    - Clinicians: They might argue that the output is only a recommendation and the final action requires a human to sign off. So no, it doesn't blork because there is human intervention.

  But note: if the system is fully automated (no human in the loop for each case), then both might agree it blorks. If there is always a human in the loop, then both might agree it does not. Let's assume the system sometimes has human intervention and sometimes doesn't. Then we might need to refine the definition. Alternatively, we can see that there is a factual disagreement about whether human intervention is present. If so, then the dispute would be SUBSTANTIVE at Step 1.

  But the original deadlock might be about whether even with human intervention the model is making a decision. So let's try a different regimentation that focuses on the core issue:

  Alternative regimentation: 
  - Define "blork" as: "A system 'blorks' if its output is the primary determinant of the action taken, and the human in the loop (if any) does not exercise independent judgment but merely rubber-stamps the output."
  - **Question**: "Does the risk model blork?"
  - **Answer**:
    - Engineers: They might say that the human does exercise judgment (they can override), so the model does not blork.
    - Clinicians: They might say that in practice, the human does not override (due to time pressure, trust in the model, etc.), so it does blork.

  This reveals a factual disagreement about human behavior. Therefore, the dispute is SUBSTANTIVE because it hinges on a factual claim about whether humans exercise independent judgment.

  But the original deadlock might also be about the definition of "decision" itself. Let's try a more neutral regimentation that doesn't mention humans:

  - Define "blork" as: "A system 'blorks' if it outputs a prescription for action (e.g., 'do X') and that prescription is acted upon in a way that affects the world."
  - **Question**: "Does the model output a prescription for action? And is that prescription acted upon?"
  - **Answer**:
    - Engineers: The model outputs a risk score, not a prescription. The prescription is made by a human or by a separate rule (e.g., "if score>Y, then schedule intervention"). So the model does not blork.
    - Clinicians: The risk score is used by a rule to produce a prescription, and the model is a critical part of that. But under the strict definition, the model itself does not output a prescription. So they might agree: the model does not blork.

  If both agree that under this definition the model does not blork, then the disagreement vanishes. Then we move to Step 2.

  **Step 2: Projection Check**
  - **Question**: "Do you think the distinction between systems that blork and those that don't is a distinction that the world makes independently, or is it a distinction we project?"
  - **Answer**: Both parties might agree that it's projected (because what counts as a "prescription" is defined by us). So we move to Step 3.

  **Step 3: Downstream Licensing**
  - **Question**: "What consequences follow from saying that the model blorks? And what if we don't?"
  - **Answer**:
    - Clinicians: "If the model blorks, then the model is making the decision and we should hold the model (or its developers) responsible. If it doesn't blork, then the human who signs off is responsible."
    - Engineers: "If the model blorks, then we have to design it to higher standards of accountability and explainability, and we might be held liable. If not, then the responsibility lies with the user."

  But note: under the regimentation, they agreed the model does not blork. So the clinicians might say: "Then we should hold the human responsible." But the engineers might be happy with that because it takes the burden off them. However, the clinicians might not be satisfied because they believe that the model is so influential that the human is just a rubber stamp. They want the model to be held accountable too. So the downstream implication they care about is accountability.

  Therefore, the clinicians might not accept the verdict. They want the model to be considered a decision-maker because they want to assign shared responsibility. The engineers want to avoid that responsibility. 

  This shows that the dispute is not about the facts (they agreed on the regimented facts) but about the normative implications of the label. The clinicians are using the term "decision" to imply accountability, and the engineers are avoiding it to deflect accountability.

  Thus, the dispute is CONCEPTUAL. The group must decide: what kind of accountability framework do they want? Should the model be held responsible in some way? This is a normative question.

  However, note that the original claim included: "for which someone must take responsibility." The regimentation only addressed "makes a decision". We might need to run the procedure for the entire claim.

  Alternatively, we can see that the core issue is accountability. The group might need to have a separate discussion about responsibility assignment regardless of the label.

  **Verdict for (B)**: CONCEPTUAL. The group must discuss accountability norms.

  But note: the user would be annoyed if (B) were MERELY VERBAL. The procedure did not return MERELY VERBAL. It went to CONCEPTUAL because of the downstream licensing step.

  ---

  **Limitations of the Procedure**:

  1. **Dependence on the quality of regimentation**: If the facilitator chooses a poor or biased definition in Step 1, the procedure might misclassify the dispute. The facilitator must be neutral and capture the core concerns of both parties.

  2. **Facilitator judgment in Step 3**: When asking about downstream licensing, the facilitator must interpret whether the differences in consequences are material to the dispute. This requires judgment.

  3. **Cannot settle deep normative disagreements**: The procedure can identify CONCEPTUAL disputes, but it cannot resolve them. The group must engage in values-based discussion.

  4. **Time constraints**: Each step requires discussion, and 90 minutes might be tight. The facilitator must manage time strictly.

  5. **Parties might not cooperate**: If one party is entrenched, they might not accept the regimentation or the outcomes.

  6. **Incomplete coverage**: Some disputes might involve multiple contested terms or complex interdependencies that the procedure doesn't handle well.

  7. **Step 2 (Projection Check) might be confusing**: Non-philosophers might not grasp the realism/anti-realism distinction. The facilitator must explain in simple terms.

  8. **Step 4 (Cost-of-Relabeling) is practical, not philosophical**: It might lead to a non-optimal solution due to practical constraints.

  Despite these limitations, the procedure provides a structured way to clarify the nature of the disagreement.

  ---
answer: |-
  Below is a decision procedure designed for your facilitators, structured as step-by-step questions for non-philosophers. The goal is to resolve deadlocks into one of three verdicts: **MERELY VERBAL** (dissolved by clarifying language), **SUBSTANTIVE** (persistent factual or meta-level disagreement), or **CONCEPTUAL** (normative dispute about which concept to use). The procedure includes regimentation, a "joint in nature" check, downstream licensing, and a cost-of-relabeling step. Each step is operationalized with clear questions, sufficient answers, and exit conditions.

  ---

  ### **Decision Procedure for Deadlocks**  
  *Facilitator Instructions: Ask questions in order. Record answers. Stop at first clear verdict or hand back to group.*

  #### **Step 1: Regimentation**  
  **Question:** "Let’s replace the contested word (e.g., 'disease' or 'decision') with a new made-up word, like 'glark.' We’ll define 'glark' with specific, observable conditions: [Insert proposed conditions based on group input]. Under this definition, is there still disagreement about whether [the thing] is a glark?"  
  - **Sufficient Answer:**  
    - If **agreement**: "Yes, it is/is not a glark" → Proceed to Step 2.  
    - If **disagreement**: "No, we still disagree" → Verdict **SUBSTANTIVE**. Stop.  
    - If **can’t agree on conditions**: "We can’t define glark" → Skip to Step 3 (Downstream Licensing).  
  **Purpose:** Tests if disagreement persists under unambiguous terms.  

  #### **Step 2: "Joint in Nature" Check**  
  **Question:** "Do you believe the distinction between glarks and non-glarks exists *independently of us* (like gravity), or is it a tool *we* created (like a 'high-risk' label)?"  
  - **Sufficient Answer:**  
    - If **both say "tool"** → Proceed to Step 3.  
    - If **one/both say "independent reality"** → Note this, then proceed to Step 3.  
    - If **split** → Proceed to Step 3 (disagreement here doesn’t block resolution).  
  **Purpose:** Flags if parties project objectivity onto the term, which may signal deeper stakes.  

  #### **Step 3: Downstream Licensing**  
  **Question:** "What do you gain or lose if we call this a glark? For example, does it entitle us to an explanation, a policy, or moral responsibility? What happens if we *don’t* call it a glark?"  
  - **Sufficient Answer:**  
    - If **licenses match** (e.g., both say: "Calling it a glark means we must validate it clinically") → Proceed to Step 4.  
    - If **licenses conflict** (e.g., "Glark implies biological reality" vs. "Glark implies we can ignore consent") → Verdict **CONCEPTUAL**. Stop.  
    - If **no clear licenses** → Proceed to Step 4.  
  **Purpose:** Reveals if the dispute is about normative implications (e.g., rights, duties, resources).  

  #### **Step 4: Cost-of-Relabeling Check**  
  **Question:** "If we adopt 'glark,' how hard is it for each side to adjust their language? Does one group bear most of the burden?"  
  - **Sufficient Answer:**  
    - If **burden is even or low** → Verdict **MERELY VERBAL**. Stop.  
    - If **burden is high/uneven** → Hand back to group: "This is resolved linguistically, but the cost of relabeling is unfair. How should we proceed?"  
  **Purpose:** Ensures practical fairness if the dispute dissolves.  

  ---

  ### **Verdict Summary**  
  - **MERELY VERBAL**: Agreement in Step 1 + matching licenses (Step 3) + manageable relabeling (Step 4).  
  - **SUBSTANTIVE**: Disagreement in Step 1.  
  - **CONCEPTUAL**: Conflicting downstream licenses (Step 3) or inability to define terms without normative stakes.  

  ---

  ### **Running the Procedure on Example Deadlocks**  
  #### **Case A: Symptom Cluster as "Disease" vs. "Artifact"**  
  - **Contested Claim**: "Is this symptom cluster a distinct disease or a coding artifact?"  
  - **Parties**: Clinicians (real disease) vs. Philosophers (artifact).  

  | Step | Question/Answer | Outcome |  
  |------|-----------------|---------|  
  | **1** | **Regimentation**: Replace "disease" with "glark" = "symptom cluster with >90% reproducibility across coding systems, and independent biomarker."<br> **Q**: "Is it a glark?"<br> **A**: *Both agree*: No (fails biomarker requirement). | → Proceed. |  
  | **2** | **Joint in Nature**:<br> **Q**: "Is glark distinction independent or our tool?"<br> **A**: Clinicians: "Independent." Philosophers: "Tool." | → Proceed (split noted). |  
  | **3** | **Downstream Licensing**:<br> **Q**: "What does calling it a disease/glark license?"<br> **A**: Clinicians: "We fund research into mechanisms." Philosophers: "We must disclose coding limitations to patients."<br> → *Licenses conflict* (research vs. transparency). | → **Verdict: CONCEPTUAL**. Stop. |  

  **Why?**  
  - Agreement on facts under regimentation (Step 1), but divergent downstream licenses (Step 3) make this normative. Philosophers want to avoid reification; clinicians want explanatory power. The verdict forces a values call: Should we prioritize research or transparency?  

  ---

  #### **Case B: Risk Model "Makes Decisions"**  
  - **Contested Claim**: "Does this risk model make decisions requiring accountability?"  
  - **Parties**: Engineers (no) vs. Clinicians (yes).  

  | Step | Question/Answer | Outcome |  
  |------|-----------------|---------|  
  | **1** | **Regimentation**: Replace "makes decisions" with "blork" = "output directly triggers action without human override."<br> **Q**: "Does the model blork?"<br> **A**: *Both agree*: No (humans can override alerts). | → Proceed. |  
  | **2** | **Joint in Nature**:<br> **Q**: "Is blork distinction independent or our tool?"<br> **A**: Engineers: "Tool." Clinicians: "Independent." | → Proceed (split noted). |  
  | **3** | **Downstream Licensing**:<br> **Q**: "What does calling it a decision/blork license?"<br> **A**: Engineers: "Nothing—accountability stays with users." Clinicians: "We must audit the model’s training data and add consent."<br> → *Licenses conflict* (no change vs. new obligations). | → **Verdict: CONCEPTUAL**. Stop. |  

  **Why?**  
  - Agreement on facts under regimentation (Step 1), but conflicting licenses (Step 3): Clinicians tie "decision" to accountability; engineers decouple it. **This is not MERELY VERBAL** because the label implies moral/legal consequences. To force a MERELY VERBAL verdict, you’d need to:  
    - **Sacrifice accountability**: Drop the licensing demand (e.g., agree "decision" has no bearing on responsibility).  
    - **Regiment away stakes**: Define "blork" as purely technical (e.g., "binary output"), but this buries the normative dispute.  

  ---

  ### **Limitations and Hidden Judgments**  
  1. **Unsettleable Deadlocks**:  
     - **Foundational metaphysics**: E.g., "Do data populations *really* have interests?" if parties reject naturalistic definitions.  
     - **Incommensurable values**: Downstream licensing (Step 3) reveals incompatible goals (e.g., innovation vs. consent).  
     - **Ambiguity overload**: Multiple contested terms (e.g., "decision" + "responsibility") may require recursive runs.  

  2. **Facilitator Judgment**:  
     - **Step 1 (Regimentation)**: Facilitator must draft neutral definitions. If biased, outcomes skew.  
     - **Step 3 (Licensing)**: Facilitator interprets "conflict." E.g., Is "research funding" vs. "transparency" a conflict?  
     - **Step 4 (Relabeling)**: Facilitator assesses "fair burden," which is subjective.  

  3. **Edge Cases**:  
     - If parties **agree post-regimentation but resist relabeling**, the procedure forces a values discussion (Step 4).  
     - **False MERELY VERBAL**: If licensing conflicts are missed, substantive stakes resurface later.  

  ---

  ### **Recommendations**  
  - **For (A)**: Embrace **CONCEPTUAL** verdict. Draft guidance that balances research and transparency (e.g., "treat as provisional disease pending biomarker validation; document coding limitations").  
  - **For (B)**: Avoid MERELY VERBAL. Use **CONCEPTUAL** to negotiate accountability: e.g., "models don’t *decide*, but developers must ensure audits and override protocols."  
  - **Training**: Role-play regimentation with facilitators. Pre-draft definitions for common disputes (e.g., "disease," "decision").  

  This procedure surfaces hidden stakes in 90 minutes. It won’t resolve all disputes but forces clarity on *why* they persist.
