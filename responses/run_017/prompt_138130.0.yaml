prompt: |-
  I'm a third-year undergraduate in a seminar on philosophy of language and pragmatics, and I've been asked to lead one session of it myself. The group is 14 students plus me; I have a 75-minute slot in a room with movable chairs, a whiteboard and a projector I'd rather not use. I can bring index cards, pens, sticky notes and a printed handout. No money, no phones, no software, and nothing that needs rehearsal time beforehand.

  The last two weeks have been Grice: the Cooperative Principle, the maxims, what is said versus what is implicated, conversational versus conventional implicature, generalized versus particularized implicature, and the standard tests of cancellability, non-detachability and calculability. My classmates can recite all of it and can apply the labels to the textbook examples. What they cannot feel, and what I want the session to give them, is this:

  1. That the extra content is inferred, not decoded. The hearer runs an argument from the words plus assumptions about the speaker and the point of the exchange, and that argument can be written down in three or four lines. If you cannot reconstruct it, you do not have an implicature.
  2. That what is implicated is not part of what is said, and that this is a resource rather than a curiosity. A speaker can be held to the literal content while disavowing the rest, which is why speakers can mislead without saying anything false, and why auditing only for literal truth never closes that gap.
  3. That the same sentence implicates different things when the shared purpose of the exchange changes, and stops implicating altogether when the hearer stops assuming the speaker is cooperating. I would like at least one round in which the speaker's and the hearer's interests diverge and the inference visibly breaks, so they see that cooperation is doing real work rather than decorating it.
  4. That trying to cancel an implicature in so many words tends not to make it go away, so cancellability is a logical property of the content and not a social escape hatch.

  Two design constraints. First, I do not want to explain any of this: no more than about five minutes of framing from me at the top, no vocabulary on the board until the debrief, and the distinctions should be things participants collide with because of the rules, the roles or the scoring, not things I announce. Second, the activity should run on ordinary language only, with a scenario any student can enter in ten seconds, and with small, legible stakes such as points, chips or a bracket on the board rather than money.

  The staging devices I keep coming back to, and which you should feel free to replace with something better, are: asymmetric information between a speaker and a hearer who share a goal; a transcript-only role in which a third participant sees the sentence but not the context and rules only on whether anything literally false was said; and a rule giving the speaker a bonus for keeping deniability while still getting the hearer to act correctly. Please also propose what happens when the speaker is allowed to add one explicit cancelling clause and what it costs them, since I suspect that is where point 4 becomes visible.

  Please give me the design in the following sections, with roughly these lengths:

  1. Setup and materials — about 100 words, including the verbatim text of any cards, slips or handout lines I would need to prepare.
  2. Rules, roles and scoring — about 400 words: who does what, what counts as success for each role, and a payoff scheme in points with the numbers justified.
  3. Timeline — about 200 words, with minute marks across the 75 minutes, including setup, each round and the transition into discussion.
  4. How each round maps onto the distinctions — about 200 words, naming which of my four targets each round is engineered to produce and by which rule.
  5. Debrief questions — about 300 words: the actual questions to put to the group, in the order that lets them name the machinery themselves, with the follow-up I should use if the first answer is shallow.
  6. Predictable failure modes — about 250 words: what will go wrong the first time I run this, including the most likely way participants game the scoring, and how to handle each.
  7. What the game cannot do — about 150 words: the feature of the view the activity cannot reproduce and that I will have to supply in about five minutes of straight explanation at the end, with a note on what to say and what to leave for the next class.
reasoning: |-
  Okay, the user is a third-year philosophy student preparing to lead a seminar on Gricean pragmatics. They have a clear vision of what their classmates are missing despite textbook knowledge: the lived experience of inference, the strategic use of deniability, context-dependence, and the limits of cancellability. 

  Hmm, their constraints are interesting. They want zero lecturing, minimal materials, and immediate emotional stakes—no tech, no prep time, no abstraction. The core challenge is making inference feel visceral. I notice they're rejecting projector use; probably tired of passive learning. The "transcript judge" idea is smart—makes literal truth tangible.

  Their four targets are brilliantly interdependent. Point 1 (inference as argument) needs a scenario where students *must* reconstruct reasoning to win. Point 2 (deniability as resource) requires a scoring system that rewards skating close to falsehood. Point 3 (context-dependence) needs radically shifting speaker/hearer incentives. Point 4 (cancellability failure) demands a situation where explicit denial backfires socially.

  *Scratching head*... The "asymmetric info + shared goal" framework they suggested is perfect for Points 1-2. For Point 3, I'll add a betrayal round where cooperation breaks. Point 4 needs a phase where cancellations are permitted but costly—maybe docking points for clumsiness? 

  *Testing in mind*... Round 1: Cooperative search. Speaker hints at location ("Not in the woods") to test basic inference. Round 2: Adversarial—same words, now misleading. Round 3: Cancellation attempt ("...but I'm not saying it's at the lake") which feels suspicious. Judge role is key throughout to anchor "what is said."

  *Worries*: Students might oversimplify ("Just say nothing!") or miss inferences without examples. Mitigation: Handouts prime with sample implicatures. Scoring must penalize silence (e.g., -5 for no guess) and reward successful deniable hints (+15 if judge approves AND hearer acts). 

  Debrief questions should unravel their lived frustrations: "When did words feel weaponized?" → leads to strategic deniability. "Why did cancellation feel weirder in Round 3?" → exposes social entanglement of implicature.

  *Hard truth*: The game can't show conventional implicatures (like "but" vs "and") or calculability tests. I'll note that for quick post-game theory cleanup. Also, generalized implicatures (e.g., "some" implying "not all") need separate examples—too subtle for this format.

  *Ah!* Materials: Must be dirt simple. Cards for roles, slips for locations, handout with just two examples. No jargon until debrief. Stakes: Points = bragging rights. Minimalist is best.
answer: |-
  Here’s a complete seminar design focused on experiential learning of Gricean pragmatics, optimized for your constraints.  

  ### 1. Setup and Materials (95 words)  
  **Materials**:  
  - **Role cards** (3 types): Speaker (×5), Hearer (×5), Literal Truth Judge (×4).  
  - **Location slips** (10): "Library," "Cafeteria," "Dorm A," etc. + 1 blank.  
  - **Handout** (1/page):  
    > *Example 1*: A asks: "Is Theo a good philosopher?" B replies: "He’s always on time." → Implicature: ? (Calculate: 1. B is cooperative → 2. Relevance? → 3. Theo isn’t good.  
    > *Example 2*: Same reply when asked "Is Theo punctual?" → No implicature.  
  - **Scoring board**: Columns for Speaker/Hearer/Judge points.  

  **Room setup**: Chairs in 5 clusters (Speaker+Hearer+Judge per cluster).  

  ### 2. Rules, Roles, and Scoring (395 words)  
  **Roles**:  
  - **Speaker**: Gets a location slip (e.g., "Library"). Must get Hearer to *go there* without naming it. Can say 1 sentence.  
  - **Hearer**: Must *guess the location* based on Speaker’s sentence.  
  - **Judge**: Sees Speaker’s sentence *only* (no context). Rules: "Did Speaker say anything literally false?" (Yes/No).  

  **Scoring**:  
  - **Speaker**:  
    - +20 pts if Hearer guesses correctly.  
    - +10 pts if Judge rules "nothing false."  
    - *Bonus*: Can add "but I’m not saying it’s [X]" (cancellation) → loses 5 pts.  
  - **Hearer**: +25 pts for correct guess.  
  - **Judge**: +15 pts if ruling matches *actual literal truth* (pre-checked by you).  

  **Justification**: High stakes for deniability (+10) vs. effectiveness (+20). Cancellation penalty exposes its social cost. Hearer’s reward prioritizes inference accuracy.  

  ### 3. Timeline (200 words)  
  - **0–5 min**: Framing + distribute roles/materials. *"You’re campus tour guides. Speakers: Get your partner to a location without naming it. Hearers: Guess where. Judges: Audit only for lies."* Show handout examples.  
  - **5–20 min**: **Round 1 (Cooperative)**: Speakers give hints (e.g., "It has the best coffee" → Cafeteria). Hearers guess. Judges rule. Record scores.  
  - **20–35 min**: **Round 2 (Adversarial)**: *New rule*: Hearers get +50 pts if *avoid* Speaker’s location. Speakers still score only if Hearer guesses correctly.  
  - **35–50 min**: **Round 3 (Cancellation)**: Speakers may add cancellation clauses (e.g., "It has coffee… but not saying it’s the Cafeteria"). Penalize −5 pts.  
  - **50–65 min**: **Debrief** (questions below).  
  - **65–75 min**: **Synthesis**: Board Grice’s terms + 5-min theory recap.  

  ### 4. Round-to-Target Mapping (195 words)  
  - **Round 1 (Cooperative)**: Targets #1 (inference) and #2 (deniability). *How*: Hearers *must* infer to guess; Judges protect deniability ("nothing false" = +10). Speaker’s hint + shared goal forces calculability.  
  - **Round 2 (Adversarial)**: Targets #3 (context-dependence). *How*: Divergent goals break cooperation → same sentence (e.g., "It’s quiet") fails to implicate correctly. Hearer assumes bad faith.  
  - **Round 3 (Cancellation)**: Target #4 (cancellability limits). *How*: Explicit cancellation costs points (social penalty) and often *strengthens* suspicion (e.g., "Why mention the Cafeteria if it’s not?"). Judges still award deniability points, but Hearers distrust.  

  ### 5. Debrief Questions (300 words)  
  1. **"Speakers: What strategies maximized your points? When did you feel most 'safe' from the Judge?"**  
     → *Follow-up if shallow*: "Did saying *less* help your deniability? Why not just stay silent?" (Exposes inference necessity).  
  2. **"Hearers: In Round 2, did identical words from Round 1 still work? What changed?"**  
     → *Follow-up*: "Did you still *try* to infer? Why/why not?" (Highlights cooperation’s role).  
  3. **"Judges: Did cancellation clauses make sentences *more* literally true? Did they make Speakers seem *more* trustworthy?"**  
     → *Follow-up*: "Why might 'not saying X' draw attention to X?" (Reveals cancellation’s pragmatic paradox).  
  4. **"All: When could a Speaker 'trick' a Hearer without the Judge penalizing them? Give an example."**  
     → *Follow-up*: "Is this lying? Why/why not?" (Elicits implicature-as-resource).  

  ### 6. Predictable Failure Modes (250 words)  
  - **Problem**: Speakers give overly vague hints ("Go somewhere nice"), making inference impossible.  
    *Fix*: Penalize Hearers for "no guess" (−5 pts), forcing Speakers toward *effective* implicatures.  
  - **Problem**: Judges rubber-stamp all statements as "literally true."  
    *Fix*: Include one location slip ("Nowhere") → Speaker *must* lie if assigned. Judges lose points for wrong rulings.  
  - **Problem**: Round 2 degenerates into silence (Speakers won’t hint if Hearers avoid the location).  
    *Fix*: Add "Speaker gets +5 if Hearer guesses *any* location" to maintain engagement.  
  - **Problem**: Students miss inference steps (Target #1).  
    *Fix*: Use handout examples to prime calculability. Ask: "Walk me through *why* you guessed X?" in debrief.  
  - **Problem**: Cancellation (Round 3) feels artificial.  
    *Fix*: Pre-seed a Speaker to cancel clumsily ("It’s not the Library!"). Class will groan → social cost visible.  

  ### 7. What the Game Cannot Do (150 words)  
  **Limitation**: Cannot model *generalized* vs. *particularized* implicature (e.g., "some" → "not all" vs. context-dependent hints).  
  **Post-Game Explanation** (5 min):  
  > *"Today showed how implicatures rely on context and cooperation. But some inferences (e.g., 'some' implying 'not all') feel automatic—these are generalized. They’re cancellable ('Some indeed all!'), but rarely *needed* outside philosophy class. Particularized implicatures (like your hints) collapse without shared goals. Next week: why 'some' → 'not all' *isn’t* semantic—and how tests like cancellability prove it."*  
  **Leave unresolved**: Whether conventional implicatures (e.g., "but" vs. "and") exist. Tease as future topic.  

  This design forces collision with your four targets through gameplay, minimizes lecture, and uses low-stakes scoring to mirror real pragmatic dynamics. Students will experience inference, deniability, and cooperation breakdown viscerally—then label it in debrief.
