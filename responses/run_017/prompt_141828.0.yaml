prompt: |-
  I keep having this argument with a friend of mine who's an economist and I always end up losing it because my entire contribution is basically a list of examples followed by "but that's obviously gross". He says my reactions are just noise dressed up as morality. I want to see whether there's actually a principle buried in them. So: going by gut on cases, no peeking at the literature (I can't look anything up right now, and please don't give me names of papers or a reading list, I've read enough of the debate and I want your own take on the pattern).

  Here's where I land. A poor person selling a kidney to a rich stranger: ban it, no question. Donating a kidney to a stranger for free: not just fine, genuinely admirable — and I know those two sit badly together but I don't want to give either up. Getting paid for blood plasma: fine. Getting paid for whole blood: makes me uneasy, and I can't explain the difference. Paying a broke student to take real medical risks in an early-stage drug trial: fine, and I don't think exploitation is the right word for it. Selling eggs for IVF: uneasy, feels much closer to the kidney than to the plasma — but selling sperm is completely fine, and noticing that makes me suspect I'm just squeamish about women's bodies. Getting paid to queue up for someone else: a bit off, can't work myself up about it. Surge pricing for rides on New Year's Eve: fine. A shop trebling the price of bottled water during a flood: not fine, ought to be illegal — that pair is the one I go back and foward on most, because I can't say what the difference is supposed to be. Tickets sold on above face value: more annoying than immoral. Selling your vote: strongly not fine, ban it, and unlike the kidney case I don't feel any pull at all. Paying a grandson to go and visit his own lonely grandmother: grubby, not fine; paying a stranger to do companionship visits to a lonely old man: fine, that's just a job. The charity that pays women struggling with addiction to be sterilised: not fine, it actually makes me angry in a way the others don't. Commercial surrogacy: round in circles, no stable verdict. And I genuinely don't know what to think about selling a company access to your old photos and messages so it can train a model on them. One more thing: I'm told the one country that actually legalised a paid kidney system more or less cleared its waiting list, and learning that moved me not at all — which worries me, because it suggests I'm not really weighing consequences here.

  My own attempt at a principle: it's fine to sell something if both parties are better off and nobody else is made worse off, unless the thing being sold is internal to a practice that's supposed to run on a different logic — votes, care, medicine, justice. But plasma and kidneys are both medical, and care shows up in both the grandson case and the paid companion case, so I already know it's broken as stated. Test it, repair it, or bin it and give me two or three candidates, stated precisely enough that I could apply them myself: which of my cases forces each clause, what each candidate says about cases I haven't listed (say: cash payments to get people vaccinated, selling residency rights to rich foreigners, and letting someone sell a place further up the transplant waiting list), and which of my verdicts I'd have to drop to get a clean principle — and if the choice is between something ugly that saves all my verdicts and something simple that costs me two of them, tell me which you'd take and why. Also say honestly whether the waiting-list consequence should move me. British English please, lead with your bottom line in the very first sentence and then give me the reasoning — no preamble and no restating my question back at me.
reasoning: |-
  Alright, let me tackle this user's query step by step. The user is frustrated after losing arguments with an economist friend because their objections to certain transactions seem based on gut feelings rather than a coherent principle. They provided a list of cases where buying/selling feels either acceptable or wrong to them, and they want a consistent ethical framework that explains their reactions.

  First, I need to analyze the patterns in their examples. They’re uncomfortable with selling kidneys but fine with paid plasma donation. Surge pricing for rides is okay, but price gouging during floods isn’t. Selling votes is a hard no, but paid companionship by strangers is acceptable. The key differences seem to revolve around bodily integrity, vulnerability, essential goods, and social practices.

  The user attempted a principle involving no harm and practices running on different logics, but it fails because medicine includes both allowed (plasma) and prohibited (kidneys) cases. I notice vulnerability is a recurring theme: poor kidney sellers are vulnerable, while plasma donors might be less so. Essential goods like water in a crisis trigger their outrage, whereas non-essentials like ride surges don’t. Also, social practices like voting or family care have intrinsic values that markets might corrupt—paying a grandson feels grubby because it commodifies familial love.

  Next, I consider existing ethical frameworks. Commodification theory (Margaret Jane Radin) distinguishes market-inalienable things, but it’s fuzzy. Vulnerability and essentialness might be better factors. The economist friend likely uses Pareto efficiency, but the user rejects outcomes like clearing kidney waiting lists. This suggests consequences alone don’t justify violating their moral intuitions.

  I test their cases against three candidate principles. The first combines vulnerability, essential goods, and normative practices. It explains why kidneys (bodily integrity, vulnerability) are banned but paid trials (informed, non-essential) are okay. Flood price gouging involves essential goods during crises, unlike surge pricing for rides. The grandson case commodifies family bonds, while paid companions are professional.

  The second principle focuses on degradation of personhood or social practices. Selling kidneys degrades bodily integrity, votes degrade citizenship. But paid plasma might not degrade if regulated properly, showing this principle’s flexibility.

  The third is strict commodification, banning anything market-inalienable. But this would force the user to accept price gouging or reject paid plasma, which they don’t want. It’s too rigid.

  The user must drop some verdicts. Paid egg donation makes them uneasy, but sperm is fine. If vulnerability is key, egg retrieval’s physical risks and targeting women might justify the unease, aligning with their suspicion about gender bias. The charity sterilizing addicts exploits vulnerability, banned by principle one. Surrogacy remains unstable due to conflicting values—vulnerability vs. autonomy.

  The kidney waiting list consequence shouldn’t sway them if their core objection is commodification of the body. Efficiency doesn’t override inherent wrongness for them.

  In conclusion, principle one best captures their intuitions by weighing vulnerability, essentialness, and social norms. They’d need to accept that paid egg donation’s unease might be valid, not just squeamishness, due to higher risks. Honesty about the trade-offs: sacrificing kidney trade efficiency for moral integrity. The answer should validate their moral instincts while providing a structured framework, empowering them in future debates.
answer: |-
  **Bottom line:** Your intuitions largely cluster around three ethical boundaries: preventing *exploitative vulnerability*, protecting *essential goods in crisis*, and preserving *non-market social practices*—but you'll need to drop or reframe 1-2 verdicts to avoid contradictions. The kidney waiting-list consequence *shouldn't* move you if your core objection is deontological (inherent wrongness vs. outcomes).  

  ### Core Principles Tested Against Your Cases  
  **Candidate Principle 1 (Best Fit):**  
  *"Ban transactions where:  
  (a) **Vulnerability is exploited** (severe power imbalance + irreplaceable harm risk), OR  
  (b) **Essential goods/services are monetised during life-threatening crises**, OR  
  (c) **Social practices central to human dignity are commodified**, thereby corrupting their purpose."*  

  **How it explains your judgments:**  
  - **Kidney sale (ban):** Hits (a) and (c). Extreme vulnerability (poverty coerces consent) + bodily integrity commodified.  
  - **Paid plasma (allow):** Avoids all three. Lower risk (renewable), no crisis, no dignity violation.  
  - **Flood price gouging (ban):** (b) — water is essential during crisis. Surge pricing for rides avoids (b) — non-essential, no crisis.  
  - **Selling votes (ban):** (c) — voting’s purpose is equal voice, not market logic.  
  - **Paying grandson to visit grandma (ban):** (c) — familial care is normatively non-market. Paying a stranger avoids (c); it’s a job, not kinship.  
  - **Charity paying for addict sterilisation (ban):** (a) + (c) — preys on vulnerability and corrupts medical ethics.  
  - **Paid drug trials (allow):** No (a) if risks are transparent and non-life-altering; (c) doesn’t apply (research isn’t a "dignity practice" like voting).  
  - **Eggs vs. sperm:** Unease with eggs aligns with (a) — extraction is invasive/high-risk, targeting financially strained women. Sperm avoids (a) due to low risk. *Your verdict holds, not mere squeamishness.*  
  - **Ticket resale:** Annoying but not (a)-(c), so allowed.  
  - **Commercial surrogacy:** Unstable because it *could* trigger (a) (vulnerable surrogates) or (c) (commodifying parenthood). Principle forces a choice: if vulnerability is mitigated, allow; else ban.  

  **Forced Drops/Adjustments:**  
  1. **Whole blood payment unease:** Must be dropped or reframed. No strong (a)/(b)/(c) case—identical to plasma. *Drop the unease.*  
  2. **Paid queueing:** "A bit off" isn’t covered by (a)-(c). *Accept it as neutral.*  

  **Candidate Principle 2 (Simpler, Costs More):**  
  *"Ban sales of anything that is:  
  - **Non-renewable** (kidneys, votes, bodily integrity), OR  
  - **Essential for survival** during emergencies."*  
  *Problems:* Allows paid drug trials (renewable dignity?), bans paid plasma (renewable but essential?), can’t explain grandson case. *Costs 3+ verdicts (plasma, drug trials, companion care).*  

  **Candidate Principle 3 (Broader "Degradation"):**  
  *"Ban transactions that **degrade personhood or social institutions** by treating them as fungible market goods."*  
  *Problems:* Too vague. Why kidneys degrade but plasma doesn’t? Doesn’t cover flood gouging. *Saves most verdicts but less testable.*  

  ---  
  ### New Cases Under Principle 1  
  - **Cash for vaccination:** Allowed. No crisis exploitation (b), not a dignity practice (c), vulnerability (a) mitigated if payment isn’t coercive.  
  - **Selling residency rights:** Banned under (c) — citizenship/residency are membership goods, not market assets.  
  - **Selling transplant queue spots:** Banned under (a) + (c) — exploits illness-induced vulnerability and corrupts medical prioritisation.  

  ---  
  ### Should the Kidney Waiting-List Consequence Move You?  
  **No.** Your resistance confirms your objections are rooted in deontology (inherent wrongness) or virtue ethics (protecting dignity), not utilitarianism. Principle 1(a) and 1(c) treat exploitation/commodification as *intrinsically* wrong, regardless of outcomes. If you sacrifice this to clear waiting lists, you abandon the core of your intuition.  

  ---  
  ### Final Recommendation  
  **Stick with Principle 1.** It saves 90% of your verdicts, explains contradictions (e.g., medicine *can* allow markets *unless* vulnerability/dignity is breached), and flags where your instincts need refining (e.g., whole blood). The trade-off is worth it: an "ugly" principle that captures real moral boundaries beats a simple one that ignores your outrage at exploitation. When your economist calls it "noise," argue that markets rely on **non-market foundations** (e.g., uncommodified bodies, civic equality) to function without self-destructing. Your gut knows this; the principle names it.
