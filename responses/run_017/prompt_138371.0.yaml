  What would change my mind? A case where there are many experts in agreement and a single outlier, and it is rational to ignore the outlier. For example, if we have 1000 experts in [0.30,0.35] and one at 0.90, then it might be rational to have an interval [0.30,0.35] and not [0.30,0.90]. But our principle gives [0.30,0.90]. 

  To fix this, we might need to incorporate the idea of consensus or to downweight outliers. But that requires more than the simple Underdetermination Test. 

  Alternatively, we might say that the evidence from the 1000 experts rules out values outside [0.30,0.35]. But then we are doing a meta-analysis that the committee is not equipped to do. 

  Given the problem statement: "I'm not an expert and can't inspect their data", we have no way to rule out the outlier. So the interval should be [0.30,0.90]. 

  But if the committee has a policy of ignoring estimates that are more than, say, 3 standard deviations away, then we could do that. But that's an additional rule. 

  Given the verdicts in cases 4,5,6, it seems the committee is taking the raw estimates. 

  Therefore, I will stick to the convex hull of the estimates.

  The repaired Underdetermination Test:

  Credence in H should be an interval [l, u] when the evidence admits a set of admissible probabilities that has more than one element, and there is no unique probability that is mandated by the evidence. The set of admissible probabilities is determined as follows:

  - If the evidence directly specifies a set of possible probabilities (as in Ellsberg blue), then that set.
  - If the evidence provides a known chance distribution, then the expected chance (unique).
  - If the evidence comes from multiple expert estimates, then the convex hull of the union of their estimates (where a point estimate is taken as a singleton).

  Additionally, when new evidence is acquired, the set of admissible probabilities is updated accordingly.

  For decision making, we use a decision rule that accounts for the stakes. For low stakes, any action that is not dominated is acceptable. For high stakes, we require an action that is not dominated and is safe in the worst-case scenario over the interval, or else we gather more evidence.

  Let's check against the cases:

  1. Ellsberg: 
     - Red: evidence specifies 30/90 -> sharp 1/3.
     - Blue: evidence specifies any number in [0,2/3] -> interval [0,2/3]. Pass.

  2. Known bias: evidence gives known chance distribution -> sharp 1/2. Pass.

  3. Unknown crate: evidence gives no information -> [0,1]. Pass.

  4. Three modellers: convex hull of {0.20,0.45,0.70} is [0.20,0.70]. Pass.

  5. Withdrawal: convex hull of {0.20,0.45} is [0.20,0.45]. Pass.

  6. Fourth modeller with [0.30,0.34]: convex hull of {0.20,0.45,0.70} ∪ [0.30,0.34] is [0.20,0.70]. Pass.

  7. Gauge case:
     - Unconditional: set of admissible probabilities is [0.9p, 0.9p+0.1]. 
       But the verdict doesn't specify the unconditional interval. It only says about conditionals and the decision to avoid evidence.
     - Conditional on uncalibrated: [0,1]. Pass.
     - We avoid evidence because of potential dilation (widening of the interval). The Test doesn't forbid that.

  8. Stakes: the interval is [0.30,0.60]. For decisions, we use a decision rule that depends on stakes. For large stakes, we avoid actions that are risky over the interval. Pass.

  9. Laundering: 
     - Publishing midpoint: administrative, not doxastic. 
     - Using it as sharp later: illegitimate because the interval represents uncertainty.
     - After scoring: new evidence -> sharp credence. Pass.

  Additional cases:

  - Ten modellers in [0.30,0.35] and original three (0.20,0.45,0.70): convex hull is [0.20,0.70]. The interval does not shrink. 

  - Gauge with 50/50: unconditional interval would be [0.5p, 0.5p+0.5] (if p is the calibrated probability). For example, if p=0.6, then [0.3,0.8]. 

  - Scoring switched off: the evidence from past scoring remains, so for new events of the same class, we use a sharp credence (or a narrow interval) based on that evidence. The intervals do not come back.

  The principle may be wrong in the many-modellers case if we think that consensus should rule out outliers. But given the constraints (no ability to evaluate the estimates), the principle holds.

  What would change my mind? A case where the committee has many experts in agreement and one outlier, and it is clearly irrational to include the outlier. But in the absence of any way to evaluate, I think including the outlier is rational.

  Therefore, the repaired Underdetermination Test is as above.
