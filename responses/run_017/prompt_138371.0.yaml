  ### Repaired Underdetermination Test
  The core principle remains that your credence in a hypothesis \( H \) should be an interval \([l, u]\) when evidence underdetermines a unique sharp probability and admits multiple admissible sharpenings with no reason to prefer one over others. Otherwise, it should be sharp. I repair the principle to handle your cases, adding three key clauses:

  1. **Admissible Sharpenings Definition**: Admissible sharpenings are probabilities compatible with evidence, interpreted as:
     - Direct evidence (e.g., physical symmetries, known chances) specifies a set or point.
     - Expert estimates (points or intervals) contribute their values to the set of admissible sharpenings, with no weighting or aggregation.
     - The interval is the convex hull (min to max) of the union of all admissible sharpenings.

  2. **Evidence Update Rule**: When new evidence arrives, the set of admissible sharpenings is updated. Removal of evidence (e.g., a withdrawn expert) narrows the set; addition of new evidence (e.g., a new expert) expands the set unless it is subsumed within existing bounds.

  3. **Decision Context Separation**: Intervals represent doxastic states. Decisions use a separate rule: for high-stakes, irreversible choices, avoid actions sensitive to uncertainty (i.e., not robust across \([l, u]\)) or gather more evidence; for low stakes, any robust or random choice is permissible.

  **Repaired Principle Statement**:  
  Your credence in \( H \) is an interval \([l, u]\) iff:  
  - (i) Evidence admits a set \( S \) of admissible sharpenings for \( P(H) \),  
  - (ii) \( S \) has more than one element,  
  - (iii) No unique element in \( S \) is mandated by evidence (e.g., via known chances, symmetries, or overwhelming consensus).  
  Otherwise, credence is sharp. The interval \([l, u]\) is the convex hull of \( S \).  
  *Clarifiers*:  
  - **Admissible sharpenings** are probabilities directly compatible with evidence (e.g., from physical constraints, or expert estimates taken at face value).  
  - **Evidence mandates uniqueness** if it pins down one value (e.g., via known expectations, symmetries, or meta-evidence from scoring).  
  - **Updates**: Add/remove evidence \(\rightarrow\) expand/contract \( S \) \(\rightarrow\) recalc \([l, u]\).  
  - **Decisions**: Intervals inform but don't dictate choices; stakes determine decision rules.

  ### Application to Your Cases
  I apply the repaired principle to your 9 cases, noting where verdicts are accommodated (✓), rejected (✗), or require decision-rule separation (➜). I then handle your additional cases.

  1. **Ellsberg urn**  
     - Verdict: \( P(\text{red}) = 1/3 \) sharp, \( P(\text{blue}) = [0, 2/3] \).  
     - Principle: ✓  
       - Red: Evidence (30/90 balls) mandates unique sharpening: \( S = \{1/3\} \).  
       - Blue: Evidence (60 balls, unknown blue/green) admits \( S = [0, 2/3] \) (any proportion possible), so interval \([0, 2/3]\).  
     - Why asymmetric? Physical symmetry for red; no information for blue.

  2. **Coin with known bias distribution (uniform)**  
     - Verdict: Sharp \( P(\text{heads}) = 1/2 \).  
     - Principle: ✓  
       - Evidence (known uniform chance) mandates unique sharpening: expected chance is \( 1/2 \), so \( S = \{0.5\} \). Higher-order uncertainty doesn't create imprecision because expectation is unique.

  3. **Coin from sealed crate**  
     - Verdict: \( P(\text{heads}) = [0, 1] \), refuse even-odds bet.  
     - Principle: ✓  
       - Evidence (no information) admits \( S = [0, 1] \).  
       - Bet refusal: Decision rule (high stakes if symmetric loss) \(\rightarrow\) avoid non-robust action. Not doxastic failure.

  4. **Three modellers (0.20, 0.45, 0.70)**  
     - Verdict: Interval \([0.20, 0.70]\), not weighted mean.  
     - Principle: ✓ Repaired!  
       - Admissible sharpenings are expert estimates: \( S = \{0.20, 0.45, 0.70\} \).  
       - Convex hull is \([0.20, 0.70]\). No unique sharpening mandated (no reason to weight/aggregate).  
     - Old test failed (allowed mean); repair adds expert clause.

  5. **0.70 modeller withdraws**  
     - Verdict: Interval \([0.20, 0.45]\).  
     - Principle: ✓ Repaired!  
       - Update: Remove 0.70 from \( S \), so \( S = \{0.20, 0.45\} \), convex hull \([0.20, 0.45]\).  
     - Why fine? Evidence changed (less uncertainty), not world.

  6. **Fourth modeller reports [0.30, 0.34]**  
     - Verdict: Interval stays \([0.20, 0.70]\).  
     - Principle: ✓ Repaired!  
       - Admissible sharpenings: \( S = \{0.20, 0.45, 0.70\} \cup [0.30, 0.34] \).  
       - Convex hull is \([0.20, 0.70]\) (new interval subsumed).  
     - Why not narrow? New evidence doesn't eliminate old extremes.

  7. **Gauge case (90% calibrated)**  
     - Verdicts:  
       - If uncalibrated, \( P(\text{frost}) = [0, 1] \). ✓  
         - Evidence (no info) \(\rightarrow S = [0, 1]\).  
       - Pay to avoid envelope: ✓ (decision rule for high-stakes dilation).  
       - Decline evidence never epistemically rational: ✗ Rejected.  
     - Principle:  
       - Unconditional: \( S = \{ \text{calib} \times p + \text{uncalib} \times q \mid q \in [0,1] \} = [0.9p, 0.9p + 0.1] \) (sharp if calibrated, [0,1] if not).  
       - Dilation occurs, but epistemic rationality requires updating with free evidence. Paying to avoid is pragmatic (avoiding imprecision risk), not epistemic.  
     - Cost: Loses your "never decline evidence" verdict. Rationale: Epistemic rationality is truth-tracking; free evidence always improves accuracy/robustness, even if it widens intervals.

  8. **Stakes**  
     - Verdict: Same interval \([0.30, 0.60]\), but low stakes: any choice; high stakes: avoid or gather evidence.  
     - Principle: ✓ via decision separation.  
       - Doxastic: \( S = [0.30, 0.60] \) in both (evidence identical).  
       - Decisions:  
         - Low stakes: Any action fine (random or robust).  
         - High stakes: Choose action safe across \([l, u]\) (e.g., if \( \geq 0.45 \) is risky, avoid it) or gather evidence. Flipping not fine if irreversible.  
     - Why: Intervals reflect belief; stakes trigger caution.

  9. **Laundering**  
     - Verdicts:  
       - Publish midpoint: ✓ (administrative, not doxastic).  
       - Reuse as sharp: ✗ Illegitimate.  
       - Scoring eliminates intervals: ✓ (improvement).  
     - Principle: ✓  
       - Publishing midpoint: Not doxastic (no change to \( S \)).  
       - Reusing midpoint: Illegitimate because original credence was interval, not sharp.  
       - Scoring: Provides meta-evidence (reliability of midpoint), updating \( S \) to a sharp value. Not laundering—genuine learning.

  ### Additional Cases
  Your principle applied "cold":

  - **Panel grows to ten modellers in [0.30, 0.35] with original three (0.20, 0.45, 0.70)**:  
    - \( S = \{0.20, 0.45, 0.70\} \cup [0.30, 0.35] \). Convex hull \([0.20, 0.70]\).  
    - Interval does not shrink.  
    - Why? Evidence still includes 0.20 and 0.70. Unless experts are retracted or new evidence rules out extremes, interval remains.  
    - When would it shrink? If original three are withdrawn, \( S = [0.30, 0.35] \) → interval \([0.30, 0.35]\).

  - **Gauge case with 50/50 (not 90/10)**:  
    - Unconditional: \( S = [0.5p, 0.5p + 0.5] \). E.g., if calibrated \( p = 0.6 \), then \([0.3, 0.8]\).  
    - If learn uncalibrated: \( S = [0, 1] \).  
    - More dilation risk (wider unconditional interval), but still epistemically rational to take free evidence.

  - **Scoring regime switched off**:  
    - Intervals do not come back.  
    - Why? Past scoring provided meta-evidence (e.g., "midpoints are reliable"), which is retained. New events use updated \( S \) (sharp or narrow). No reversion without counter-evidence.

  ### Weaknesses and What Would Change My Mind
  - **Where reasoning is most likely wrong**: Handling expert consensus. The principle treats all expert estimates as equally admissible, ignoring clustering. In the 10-modeller case, if 1000 experts say \([0.30, 0.35]\) and one says \(0.90\), interval is \([0.30, 0.90]\), which may seem irrational.  
    - **What would change my mind**: A case where equally credentialed experts produce a tight cluster and an extreme outlier, and intuition says the interval should ignore the outlier (e.g., \([0.30, 0.35]\)). This would require adding a consensus clause (e.g., "ignore estimates outside \(k \times\) IQR of the set").  
    - **Cost**: Adds complexity; risks subjectivity. Your cases 4–6 support no aggregation, so I prioritize consistency with them.

  - **Other weakness**: Decision separation may feel ad hoc. If you reject separating doxastic and practical states, I'd need to fold stakes into the credence (e.g., intervals widen with stakes). But your cases 1–3 and 7 support a pure doxastic principle.  
    - **What would change my mind**: A case where identical evidence and intervals, but stakes directly affect the interval (e.g., high stakes widen it). No such case is presented; your case 8 treats doxastic state as identical.

  ### Final Principle Summary
  - **Core**: Interval iff evidence admits multiple admissible sharpenings with no unique mandate.  
  - **Admissible sharpenings**: Direct from evidence (physical, expert estimates).  
  - **Interval**: Convex hull of set \( S \).  
  - **Updates**: Add/remove evidence → expand/contract \( S \).  
  - **Decisions**: Stakes determine actions, not credence.  

  This repairs your test, accommodates 8/9 verdicts (rejects "never decline evidence" in case 7), and handles your cases uniformly. It costs one verdict for epistemic purity, but gains coherence.
