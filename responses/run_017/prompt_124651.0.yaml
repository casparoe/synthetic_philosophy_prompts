prompt: |-
  I sit on the allocation committee of a foundation that gives away roughly forty million dollars a year. Our grants come in units of about half a million, committed over several years, and our due-diligence capacity means we can run at most four programmes at a time; a few of the things we could fund also have thresholds, in the sense that nothing at all is achieved below a certain minimum scale and a great deal is achieved once that scale is reached. So whatever rule we adopt has to tell us what to do with lumpy sums, not with dollars. We score candidate causes by importance, tractability and neglectedness, multiplied together. A colleague on the committee, who is an economist and who will not let this go, argues that once the framework is made precise it eats itself. I have reconstructed his argument as charitably as I can and I cannot find where it cheats.

  (1) A funder should allocate so as to maximize the expected good its spending does, and should count only the difference its own money makes: the expected difference between the world in which the grant is made and the world in which it is not.

  (2) For a budget fixed in advance, that comes to comparing, across the causes open to us, the expected counterfactual value of the next unit of money in each cause, evaluated at the level at which that cause is currently funded. Call this the point-marginal return.

  (3) The three-factor framework is standardly defended as a proxy for exactly that comparison. Importance fixes the size of the prize, that is, how much value there is in the problem's being fully solved. Tractability fixes the slope, that is, how much of the remaining problem an extra dollar buys. Neglectedness fixes the position on the curve, that is, how little of the problem has already been bought up with other people's money. On this reading the framework says nothing beyond what those three features do to the comparison in (2). Call it the proxy reading.

  (4) Consider two live options. Programme A is a large, moderately tractable and fairly well-funded global health intervention that we have supported for years. Programme B concerns a genuinely minor problem, one where the total value at stake over a decade is a rounding error beside A's, but almost nobody funds B and it is very cheap to make progress in it, so that by our own estimates the first million dollars in B does somewhere between three and five times as much good as the next million in A.

  (5) By (2), our next unit of money belongs in B. And this is not an artefact of the example: take any two causes; either their point-marginal returns are equal or one of them is larger, and if one is larger, (2) sends the next unit there. So (2) directs money, in every case, to whichever cause has the highest point-marginal return, however trivial that cause is.

  (6) But no committee could act on that. A foundation that moved its entire health budget into a minor cause on the ground that the first million went further there would deserve the criticism it received, and the criticism would be about the smallness of the problem, not about the marginal million. Importance is therefore a consideration in its own right, and not merely an input to a comparison of per-dollar values.

  (7) So the proxy reading is false: the framework's first factor does work that (2) gives it no room to do.

  (8) And then the framework has no interpretation left. If importance carries weight independently of per-dollar value, the framework is maximizing two things at once, more good per dollar and a larger share of a bigger problem, and multiplying them produces a number that means nothing while adding them leaves the relative weights arbitrary. Either way the framework collapses: it is either a cost-effectiveness calculation that ignores scale and therefore issues recommendations no one could act on, or it is an uninterpreted score. In neither case do we have a decision rule.

  He adds a second limb, which worries me more than the first. Neglectedness, he says, is self-effacing in a way that tractability is not. If a cause's being unfunded is a reason for us to fund it, then it is a reason for every funder, so the causes that score highest on neglectedness are precisely the ones that stop being neglected as soon as anyone acts on the score; and a consideration that cancels itself when acted upon cannot belong in a decision rule. Taken at face value this seems to prove too much, since it would also show that being the only person in a position to help is never a reason, which I do not believe.

  I do not want to give up (1), and if forced I would sooner keep the proxy reading in (3) than keep (6); but (6) is the step I am most confident of, which is why I am stuck.

  Please do three things. First, name the step or the transition you would reject and state exactly what it assumes. I suspect there is a slide somewhere between comparing a unit of money and comparing a programme, but I cannot state it cleanly, and I want the assumption made explicit rather than gestured at. Second, price the rejection: which of the claims I would prefer to keep has to go, and what do we lose by giving it up. Third, give me the allocation rule you would actually hand a committee that makes half-million-dollar grants, can run four programmes at a time, and faces causes that differ in scale, slope, current funding and lumpiness; say plainly whether importance survives in that rule as anything other than a factor in per-dollar value, and whether neglectedness survives at all in light of the second limb. Where your rule is silent, or where it merely restates the disagreement, say so instead of papering over it.

  Finish with a single last line of exactly this form:

  Verdict: step N — six words or fewer naming the flaw.
reasoning: |-
  We are given a dilemma in philanthropic allocation. The economist's argument leads to the conclusion that the standard three-factor framework (importance, tractability, neglectedness) either collapses into a cost-effectiveness calculation that ignores the scale of the problem (and thus leads to funding trivial causes) or becomes an uninterpreted score. We are also asked to address the issue of neglectedness being self-effacing.

  The argument proceeds in steps (1) to (8). We must reject one step and explain.

  Let me outline the steps:

  (1) The funder should maximize expected good, considering only the counterfactual difference.

  (2) For a fixed budget, compare the point-marginal return (the expected counterfactual value of the next unit of money) in each cause.

  (3) The three-factor framework (I×T×N) is a proxy for that point-marginal return.

  (4) Example: Programme A (large, moderately tractable, well-funded) vs. Programme B (minor problem, very neglected, very cheap to make progress). The first million in B does 3-5x as much good as the next million in A.

  (5) By (2), the next unit of money should go to B. In general, (2) always sends money to the cause with the highest point-marginal return, regardless of the absolute importance.

  (6) But we cannot act on that because moving the entire health budget to a minor cause would be criticized, and the criticism is about the smallness of the problem. Therefore, importance must be a consideration in its own right, independent of per-dollar value.

  (7) Thus, the proxy reading (3) is false because the framework's first factor (importance) does work beyond the per-dollar value.

  (8) Without the proxy reading, the framework collapses: either it ignores scale (leading to trivial causes) or it becomes an uninterpreted score (by trying to combine two incommensurable things).

  Additionally, the second limb: neglectedness is self-effacing because if every funder acts on it, then the cause is no longer neglected.

  We are to reject one step and state the flaw.

  I think the flaw is in step (5) and (6). Specifically, step (5) assumes that we are only allocating one unit at a time and that the point-marginal return is constant or that we can ignore the lumpiness and thresholds. But the problem states that grants come in units of about half a million and that some causes have thresholds (lumpiness). Moreover, we can only run four programmes at a time. Therefore, we cannot allocate one dollar at a time; we have to allocate in lumps and we are constrained by the number of programmes.

  In step (4), the example says the first million in B does 3-5 times as much good as the next million in A. But note: we are giving grants of half a million. Suppose we give one grant (half a million) to B. Then the marginal return of that grant might be very high. But if we give two grants (one million) to B, we might hit a threshold and achieve a lot. But after that, the next grant might not be as effective. Meanwhile, in A, the marginal return might be steady.

  However, step (5) generalizes to any two causes and says that we should always send the next unit to the cause with the highest point-marginal return. But this ignores:

  - The lumpiness: the marginal return might not be linear. In fact, the example says that for B, the first million does a lot (implying that after that, it might drop). So if we allocate one unit (half a million) to B, then the next unit (the second half million) might still be high, but then if we allocate a whole million, we might have achieved the threshold. But if we allocate only one grant (half a million) to B, we might not achieve the threshold and thus get very little. The problem says: "a few of the things we could fund also have thresholds, in the sense that nothing at all is achieved below a certain minimum scale and a great deal is achieved once that scale is reached." So we cannot allocate a single dollar (or even a single grant) to such a cause and get any return. We have to commit to a minimum scale.

  Therefore, the point-marginal return of a single grant in B might be zero (if we don't reach the threshold) or very high (if we do). But we cannot allocate a fraction of a grant. So we must consider the return of the entire lump.

  Moreover, we are constrained to at most four programmes. So we cannot spread our budget over many small causes. We have to choose which programmes to run and at what scale.

  So the flaw is in step (2): it assumes that we can allocate in arbitrarily small units and that the marginal return is defined for a unit. But in reality, we have to allocate in lumps and consider the entire grant size and the thresholds.

  Therefore, we must reject step (2) as stated because it ignores the lumpiness and the constraints on the number of programmes.

  But step (2) is derived from (1). How can we reconcile?

  We must reinterpret (2) to account for the lumpiness. Instead of the point-marginal return of the next dollar, we should consider the marginal return of the next grant (or the next lump that meets the threshold). And we must consider that we are making a decision about which programmes to fund and at what level, given the constraints.

  So the decision rule should be: choose a set of programmes (up to four) and funding levels (in units of half a million) such that the total budget is allocated and the expected counterfactual good is maximized, taking into account the thresholds.

  This rule would avoid the problem of step (6). In the example, if we are considering Programme B, we must fund it at least at the threshold level to get any return. And if the threshold is, say, two million (four grants) and we have to commit to that, then we must compare the return of funding B at two million (which achieves a great deal) versus funding A with the same two million (which might achieve a steady, but lower, return per grant). But note, we are constrained by the number of programmes: we can only run four at a time. So if we fund B, we are using one slot and spending two million (say) to get a big return. Then we have to compare that to the alternative of funding A with two million (which might be less than the threshold for A, if A has a threshold, or just a linear return).

  Moreover, the absolute importance (the size of the prize) matters because if the problem is minor, then even if the marginal return per dollar is high at the beginning, the total achievable good is limited. So after we hit the threshold in B, the marginal return might drop to zero because the problem is solved. But in A, the problem is huge, so even if the marginal return is lower, we can keep getting a steady return for a long time.

  Therefore, the rule must account for the total potential of the cause and the diminishing returns.

  Now, about neglectedness: it is not self-effacing in the way described. The reason is that we are not the only funder, but we are making a decision conditional on what others are doing. If a cause is neglected, then our funding may have a high impact because we are the only one. But if we (and others) act on neglectedness, then indeed the cause becomes less neglected and the impact of additional funding decreases. But that is a dynamic effect. In a static analysis (given the current level of funding by others), neglectedness is a valid factor. Moreover, we are making a one-time decision. The self-effacing argument would only apply if we were trying to set a rule for all funders for all time. But we are one funder making a grant now.

  Therefore, neglectedness survives as a factor in the static assessment of the current marginal return.

  But note: in our decision rule, we are already accounting for the current funding level because the marginal return depends on it. So neglectedness is captured in the marginal return.

  Similarly, importance is captured in the total value and the shape of the return curve.

  So what would the allocation rule be?

  We have to choose a portfolio of programmes (up to four) and for each, a level of funding (in units of half a million) that meets any minimum thresholds and does not exceed the budget. We want to maximize the total expected counterfactual good.

  This rule:

  - Takes into account the lumpiness by requiring thresholds to be met.
  - Limits the number of programmes to at most four.
  - Uses the entire budget.

  In this rule, importance is present in two ways:
  1. The total value of solving the problem (which sets the ceiling on the return).
  2. The shape of the return function (which may have diminishing returns or thresholds).

  But we are not separately multiplying by importance; rather, we are estimating the return of each grant package.

  Neglectedness is also present because the current funding level affects the marginal return. If a cause is already well-funded, then additional grants might have low returns (diminishing returns). If it is neglected, then the first grants might have high returns.

  Therefore, the standard three factors are still relevant as inputs to estimating the return function, but they are not multiplied arbitrarily. Instead, we estimate the return for each candidate grant package and choose the best portfolio.

  This rule avoids the problem of funding trivial causes: if a cause is minor, then even if the initial returns are high, the total return we can get from it is limited. So we would only fund it if the return from the required lump (to meet the threshold) is high enough and if we have room in our portfolio. But if we have to commit a lot of money to a minor cause to get a one-time benefit, and then the cause is solved, that might be worse than funding a major cause that can absorb more money at a steady (though lower) rate.

  Now, the price of rejecting step (2) as stated:

  We are giving up the simplicity of point-marginal allocation. We cannot use a rule that just compares the next dollar. We must do a more complex optimization that considers the lumpiness and the constraints. This requires more data and computation. We need to estimate the return for different levels of funding for each cause, and then solve a knapsack-like problem with multiple constraints (number of programmes, thresholds).

  We must also reject the economist's conclusion that the framework collapses. Instead, we use the factors to estimate the return curves and then optimize.

  But note: the three factors are still useful as a heuristic for estimating the return curve. Importance tells us about the total value, tractability about the slope (how much progress per dollar), and neglectedness about the current position (how much has been done). So we can build a model of the return curve using these factors.

  For the allocation rule:

  Rule: 
  1. For each candidate programme, estimate the expected counterfactual good as a function of the number of grants (each grant is half a million) committed to it, taking into account any thresholds (so below the threshold, the return might be zero; at or above, it jumps). This function may have diminishing returns.

  2. We are to select a subset of at most four programmes and assign to each a non-negative integer number of grants (at least enough to meet the threshold, if any) such that the total number of grants (times half a million) does not exceed the budget (which is fixed: 40 million per year, so 80 grants per year? But note: grants are committed over several years. We must account for the time commitment. However, the problem does not specify the time period. Let us assume we are allocating for a cycle, say one year, and the grants are multi-year but we commit a fixed amount per year? The problem says "committed over several years", but we are told the annual budget. We must clarify: the foundation gives away 40 million per year, so that is the annual budget. Each grant unit is half a million, so we can make about 80 grants per year? But we can run only four programmes at a time. So each programme might receive multiple grants per year? Or the grants are multi-year, so we commit to a stream of payments. We must be cautious.

  The problem says: "grants come in units of about half a million, committed over several years". So each grant is a commitment of, say, 0.5 million per year for, say, 5 years? Then the total commitment for one grant might be 2.5 million. But then the annual budget of 40 million would allow 16 grants per year (if each grant costs 0.5 million per year). But we can run at most four programmes at a time. So each programme might consist of multiple grants (i.e., we might fund a programme at a higher level by giving it more grants per year).

  Alternatively, a grant unit might be a one-time payment of 0.5 million, but then the foundation gives 40 million per year, so 80 grants per year. But again, we can run only four programmes. So we must assign multiple grants to the same programme.

  Therefore, we can think of a programme as a cause we are funding, and we can fund it at different levels (number of grants per year). And we can run up to four programmes simultaneously.

  So the decision is: which four programmes (or fewer) to fund, and at what level (how many grants per year for each) within the budget.

  And we have to account for the thresholds: for some programmes, we must fund at least a certain number of grants to have any effect.

  So the rule:

  - Let the set of candidate programmes be indexed by i.
  - For each programme i, we have a function f_i(n) that gives the expected counterfactual good per year (or over the relevant time horizon) if we fund it at level n (where n is the number of grants per year, each grant being 0.5 million per year). This function must account for the thresholds: if n is below the minimum threshold for i, then f_i(n) might be zero or very low. Above the threshold, it might jump and then increase with n (with diminishing returns?).

  - We want to choose a subset S of at most four programmes and non-negative integers n_i (for i in S) such that:
     n_i >= threshold_i (if the programme has a threshold) for each i in S, and
     the total cost: sum_{i in S} n_i <= 80 (because 40 million / 0.5 million = 80 grants per year), and
     the total good: sum_{i in S} f_i(n_i) is maximized.

  This is a complex integer programming problem, but it can be solved approximately.

  In this rule, importance is captured in the magnitude of f_i(n) for large n (and in the shape of f_i). If a problem is minor, then f_i(n) will be bounded by a small number. If it is major, then f_i(n) can be large even for large n.

  Neglectedness is captured in the shape of f_i: if the programme is already funded by others, then the marginal return of our grants might be lower. So we model that in f_i.

  Therefore, importance survives as a determinant of the total potential, and neglectedness survives as a determinant of the current marginal return.

  Now, the second limb about neglectedness being self-effacing: as argued, our decision is conditional on the current state (including current funding by others). If we (and others) fund a neglected cause, then it becomes less neglected, and the next funder will see a lower return. But that is a dynamic effect and not a reason to exclude neglectedness from our static decision.

  Therefore, we keep neglectedness as a factor in estimating the current marginal return.

