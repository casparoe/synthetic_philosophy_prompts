prompt: |-
  I'm in a small philosophy-of-economics reading group — me, one philosopher, and two econ PhD students who mostly roll their eyes at us — and we've now spent three sessions on the old row about whether the realism of a model's assumptions matters, and I genuinely cant tell whether we're disagreeing about anything. Here's the shape of it as I see it. One side, descending from Friedman's 1953 essay on positive economics, says a theory is to be judged only by whether its predictions work; that the assumptions of a good theory will typically be wildly false, because the whole trick is to throw away almost everything to isolate the few forces that dominate for some class of phenomena; and that asking whether firms 'really' maximise is like asking whether a falling body 'really' is a point mass — the interesting theories are the ones whose assumptions are the least realistic. The other side says this turns on an equivocation about what an assumption is, that the famous move where the significance of a theory is supposed to explain the unreality of its assumptions conflates several quite different things, and that predictive success is cheap: a model can track the data for reasons that have nothing to do with its being even approximately right about the world, which matters enormously the moment you use it to do something rather than to retrodict a series.

  My working hypothesis is that this is not one dispute but about four, and that it stalls because nobody says which job the model is being used for. I've been playing with a taxonomy of my own, with my own labels so nobody can accuse me of stealing them: (1) negligibility assumptions — the assumption says a factor is small enough to ignore, it's statable as a limit claim (viscosity going to zero, molecular volume going to zero), and there's a well-defined direction in which you could de-idealise and check; (2) scaffolding assumptions — the assumption isn't a claim about the target at all but a device you need in order to have a tractable model space, e.g. a continuum of traders, an infinite horizon, every agent knowing the model; there may be no sensible limit to take, because relaxing it gives you a different kind of object rather than the real system; (3) stand-in assumptions — you put something in that you know is false because you don't know the true mechanism, and here the critics seem plainly right that the model's predictive success is no evidence for the stand-in; (4) domain assumptions — the model is really a conditional, 'in systems where X holds', so the live question is a matching question about whether the actual system is near enough to such a world, not a truth question about X. On top of that, a second hypothesis: both sides quietly test models on within-sample prediction, and the instrumentalist line earns its keep for interpolation but goes silent — or actively misleads — when the model is used to extrapolate to a new regime, or to evaluate a policy that changes the very thing the assumption held fixed. So maybe the real hidden disagreement is about which predictive task is at stake, or maybe it's bedrock, a difference about what theories are even for: saving the phenomena versus latching onto the causes.

  So: is this a substantive disagreement, three or four verbal ones under one heading, two camps answering different questions, or a difference about what counts as evidence for a model that nobody has made explicit? Is my four-way taxonomy doing any work, or is it just relabelling the familiar points? I'd like you to run it against four cases I care about and tell me where it breaks: a zero-viscosity / frictionless-plane idealisation in a mechanics derivation; a one-immortal-consumer representative-agent macro model; a continuum-of-agents assumption in a market-clearing model; and a firms-maximise-profits postulate used to predict outside the regime it was fitted in. Then tell me what would count as progress given your diagnosis — a distinction, a formal result about when de-idealisation is well defined, a case study, a change of question — or argue honestly that no progress should be expected and why. Please don't give me a survey of the positions or a reading list, I've read enough of those and there's no library where I am; I want the diagnosis, with reasons tied to what each side actually says. And be explicit about how confident you are in each claim you make, and flag the single point you're least sure of. British English please, and thanks — sorry if this is a bit of a ramble, it's 1am and I've been staring at my notes for hours.
reasoning: |-
  Okay, let me try to unpack this user's query. They're in a philosophy-of-economics reading group with a philosopher and two econ PhD students. They've spent three sessions debating whether the realism of a model's assumptions matters, and they can't tell if there's a real disagreement. The user has developed a taxonomy with four types of assumptions and suspects the disagreement stems from not specifying the model's purpose.

  First, I need to understand the core of their taxonomy: negligibility, scaffolding, stand-in, and domain assumptions. Each addresses different roles assumptions play. The user also mentions a hidden disagreement about predictive tasks—interpolation vs. extrapolation. They want this tested against four cases: frictionless mechanics, representative-agent models, continuum of agents, and profit maximization outside its regime.

  The user's frustration is palpable. They've been reading extensively, it's late, and they need clarity, not more literature. They want a diagnostic that ties into what each side actually argues, using their taxonomy. The econ students roll their eyes, which suggests the philosopher might be pushing for realism while the economists lean instrumentalist. The user is likely the mediator, trying to find common ground or at least understand the disconnect.

  I recall Friedman's instrumentalism: assumptions don't need to be realistic if predictions work. Critics like Cartwright or Hausman argue that unrealistic assumptions can mislead, especially in new contexts. The user's taxonomy tries to bridge this by categorizing assumptions based on their function. For instance, negligibility assumptions (like frictionless planes) can be de-idealized, while stand-ins (like profit maximization) might not hold when extrapolating.

  Testing their cases:
  1. **Frictionless plane**: A negligibility assumption. De-idealization is straightforward (add friction coefficients), so realism matters less for predictions within its domain but crucial for extrapolation (e.g., air resistance).
  2. **Representative-agent**: Scaffolding. Infinite horizons and identical agents simplify computation, but relaxing this (heterogeneous agents) changes the model structure. Predictive success here doesn't validate the assumption, especially for distributional policies.
  3. **Continuum of agents**: Also scaffolding. It enables calculus but ignores granularity. If the real system has few agents, predictions might fail, but it's a modeling convenience rather than a claim about reality.
  4. **Profit maximization**: Stand-in or domain? If used as a domain assumption ("if firms act as if maximizing"), it's conditional. But if treated as literal, extrapolating to new regulations might fail because firms adapt or other factors dominate. Critics argue predictive success here isn't evidence of the mechanism.

  The hidden disagreement might be about the purpose of models: instrumentalists focus on prediction, while realists care about causal structure for policy or explanation. The user’s second hypothesis about interpolation vs. extrapolation is key. Instrumentalism works for interpolative predictions but falters in new regimes where underlying mechanisms matter.

  Where could the taxonomy break? The continuum case blurs scaffolding and negligibility—relaxing it might be mathematically messy but not impossible (agent-based models). Profit maximization could be seen as domain if qualified, but often it's presented as a general truth. The real issue is whether the taxonomy clarifies when realism matters based on the assumption's role and the predictive task.

  Progress might involve distinguishing model purposes: prediction vs. intervention. Case studies where unrealistic models failed in policy (e.g., financial crisis models assuming rational agents) could highlight the stakes. Alternatively, formal results on de-idealization, showing when adding complexity improves predictions, might bridge gaps. However, if the divide is philosophical (instrumentalism vs. realism), agreement might be elusive without shifting the question to "what is this model for?"

  The user's taxonomy does work by forcing specificity about assumption types and tasks, moving beyond "realism matters/doesn't." But it might not resolve deeper philosophical splits. The least certain point is whether the continuum assumption is purely scaffolding or if it can be a negligibility claim—depending on context.
answer: |-
  Right, let's cut through the fog. Your taxonomy **is doing substantive work** by forcing specificity where both sides trade in ambiguities, and the core disagreement **isn't bedrock philosophy but about the evidential weight of predictive success for different model uses**. The eye-rolling likely stems from both sides talking past each other on *which predictive task validates which type of assumption*. Below, I'll run your cases, diagnose the disagreement, then suggest progress. Confidence levels marked throughout.

  ### Diagnosis: Why the Dispute Stalls
  1.  **The "Realism" Equivocation:** Friedmanites use "unrealistic" to mean *simplified or abstracted* (point masses, frictionless planes). Critics mean *false in a way that misrepresents causal structure* (firms as black-box optimisers, representative agents). Your taxonomy exposes this by separating *types* of unreality (negligibility vs. stand-in).
  2.  **The "Prediction" Equivocation:** Both sides focus on "prediction" but mean different things:
      *   **Friedmanites (Instrumentalists):** Primarily mean *interpolation/retrodiction within the fitted domain* (e.g., predicting price changes given known supply shocks). Success here *can* validate negligibility/domain assumptions. (Confidence: High - core of Friedman's examples).
      *   **Critics (Realists/Mechanists):** Focus on *extrapolation to new domains/policy interventions* (e.g., predicting effects of a *new* tax regime). Success here requires plausible causal mechanisms, not just past fit. Stand-ins/scaffolding often fail here. (Confidence: High - central to Cartwright, Hausman, policy relevance arguments).
  3.  **The Hidden Stakes:** The PhD students likely see models as **computational engines for generating conditional forecasts** within known domains (domain/negligibility focus). The philosopher (and possibly you) worries about **causal understanding for novel interventions or explanation** (where stand-ins/scaffolding become suspect). (Confidence: Medium - inferring motives, but fits the dynamic).

  ### Testing Your Taxonomy & Diagnosing the Cases
  1.  **Zero-Viscosity / Frictionless Plane (Mechanics):**
      *   **Your Classification:** Negligibility Assumption. Statable as a limit (viscosity → 0), defined de-idealisation path (add drag coefficient).
      *   **Breakdown?** Minimal. This is Friedman's *paradigm case*. Instrumentalists win *for interpolation*: predicting trajectory *in vacuum* doesn't require modelling air. Realists agree *if* the task is interpolation. **Disagreement surfaces only if:** (a) You *extrapolate* to high-viscosity fluids without de-idealising (model fails, critic wins), or (b) Someone absurdly claims "bodies *are* points" (straw man). Here, predictive success (within domain) *is* strong evidence the assumption is harmless. (Confidence: High - classic example).

  2.  **One-Immortal-Consumer Representative Agent (Macro):**
      *   **Your Classification:** Primarily **Scaffolding** (tractability for solving infinite-horizon optimisation), potentially **Stand-in** (if implying aggregation is exact) or **Domain** (if interpreted as "if aggregation held perfectly...").
      *   **Breakdown?** This exposes the core clash. *Interpolation:* If the model fits aggregate consumption data *post-1990*, instrumentalists say "good enough". *Extrapolation/Policy:* Predicting effects of a *new*, highly redistributive policy? The scaffolding (single agent) *destroys* the model's ability to capture distributional effects or heterogeneous responses. Critics argue: Past fit was cheap/lucky/achieved by tuning other parameters; it tells you *nothing* about whether the causal mechanism (single optimiser) is relevant for *this* new task. The stand-in/scaffolding element is not benignly negligible; it fundamentally mis-specifies the causal structure needed for the extrapolation. (Confidence: High - core of Akerlof/Yellen, Kirman critiques).

  3.  **Continuum-of-Agents Assumption (Market-Clearing):**
      *   **Your Classification:** **Scaffolding** (enables calculus, avoids strategic discontinuities/finite-game effects). Not cleanly negligibility (no clear "size → 0" limit that recovers reality if agents *are* few).
      *   **Breakdown?** Similar to above, but subtler. *Interpolation:* Model predicts smooth price adjustments in deep markets (e.g., forex)? Fine, scaffolding works. *Extrapolation:* Predicting behaviour in a *thin* market with 5 large players? The scaffolding (continuum) masks strategic hold-up, bargaining, volatility – the model likely fails spectacularly. Critics argue: Success in the deep market doesn't validate the continuum as a *true description*; it just shows it's adequate scaffolding *for that specific task*. Instrumentalists might counter they'd switch models for thin markets (domain shift), but critics retort: How do you *know* when to switch without understanding the *role* of the scaffolding? (Confidence: High for scaffolding role; Medium-High for extrapolation risk - depends on specific model).

  4.  **Firms-Maximise-Profits (Predicting Outside Fitted Regime):**
      *   **Your Classification:** **Stand-in** (if used as the literal mechanism) or **Domain** (if "as if"). Crucial ambiguity.
      *   **Breakdown?** This is the critics' strongest case. *Interpolation:* Model predicts firm output responses to input price changes *in stable environments*? Instrumentalists: "Works, who cares if they *really* solve Lagrangians?" *Extrapolation:* Predicting responses to a *radical new regulation* altering the *very nature of competition* (e.g., breaking up monopolies, introducing AI co-pilots)? The stand-in is now dangerous:
          *   If "max profit" is just a domain marker ("in stable, competitive environments"), the model *shouldn't* be used here – critic wins on domain mismatch.
          *   If treated as a *universal causal mechanism* (the stand-in), the model assumes firms instantly re-optimise to the *new* landscape. Reality: Firms use routines, satisface, learn slowly, make errors. Past predictive success (within stable domain) provides *zero* evidence the stand-in mechanism works in the novel regime. Critics (e.g., behavioural/evolutionary econ) argue predictive success was *always* potentially misleading for causal understanding. (Confidence: High - Cyert & March, Nelson & Winter, Friedman's own failure to predict stagflation based on simple Phillips curves).

  ### Where the Taxonomy Helps (and Where It Gets Fuzzy)
  *   **Helps:** It forces asking: *What kind of "unreal" is this?* and *What predictive task is it being used for?* This dissolves monolithic "realism matters/doesn't" into tractable questions. It makes clear why negligibility/domain assumptions are more robust *for interpolation* than stand-ins/scaffolding *for extrapolation*.
  *   **Fuzziness:** Distinguishing Stand-in vs. Domain (esp. in econ) is often murky. Is "max profit" a *claim* about firm psychology (stand-in) or a *behavioural regularity conditional on environment* (domain)? Practitioners often blur this, causing cross-talk. (Confidence: High - this blur is endemic).

  ### The Core Substantive Disagreement (Not Bedrock, But Evidential)
  It's **not** ultimately about "saving phenomena vs. latching causes". Both sides want useful models. The disagreement is: **Under what conditions does within-domain predictive success provide evidence that the model captures *relevant causal structure* for *novel tasks*?**
  *   **Instrumentalists (Friedmanites):** Tend to argue success in *any* prediction (even interpolation) suggests the model isolates *some* dominant force, usable cautiously elsewhere. They see de-idealisation as often intractable.
  *   **Critics:** Argue success in interpolation, *especially when achieved via stand-ins/scaffolding*, provides *very weak or misleading* evidence for extrapolation/policy. True causal understanding (even approximate) is needed for novel tasks.

  ### What Counts as Progress (Concrete Steps, Not Just Talk)
  1.  **Adopt Your Taxonomy (or Similar) Explicitly:** In discussion, *force* specificity: "Is this assumption negligibility, scaffolding, stand-in, or domain for *this* purpose?" and "Are we testing interpolation or extrapolation?" This alone can resolve 70% of apparent disagreement. (Confidence: High - it structures the ambiguity).
  2.  **Demand Case Studies of Extrapolation/Policy Failure:** Stop debating abstractly. Find concrete examples where:
      *   A model with "unrealistic" assumptions (specify type!) worked well interpolating but failed catastrophically when extrapolated or used for policy. (e.g., Lucas Critique examples, failure of DSGE models pre-2008 to capture systemic risk due to scaffolding like representative agents/complete markets). *Why* did it fail? Which assumption type bit back?
      *   A model *succeeded* in extrapolation *because* its assumptions, while abstract, captured key causal structure (e.g., basic supply/demand predicting effects of a new tax in a *similar* market). (Confidence: High - empirical grounding is needed).
  3.  **Formalise "De-Idealisation Paths" Where Possible:** For negligibility assumptions, rigorously showing how to add complexity (e.g., perturbation theory in physics) builds trust. For scaffolding, ask: *Is there a *tractable* model *without* this scaffold that gives different, *better* predictions in novel regimes?* (e.g., Agent-Based Models vs Continuum). If no path exists, the critic's case weakens pragmatically. (Confidence: Medium - possible in some econ, hard in others).
  4.  **Shift the Question:** Move from "Are assumptions realistic?" to "**For this specific purpose (prediction task X), is this assumption *benign* or *dangerous*? What evidence do we have about its benignity/danger for *this* task?**" This is operationally clearer. (Confidence: High - focuses on use).

  ### The Single Point I'm Least Sure Of
  **Whether the distinction between Scaffolding and Stand-in is always clear or useful.** Is an infinite horizon *just* scaffolding for tractability, or is it *also* a stand-in for "no finite lifetime effects matter"? Is a representative agent *only* scaffolding, or *inherently* a stand-in for a complex aggregation process we don't understand? The line can blur, and its usefulness might depend heavily on the specific model and the critic's depth of suspicion. (This is the murkiest part of your otherwise sharp taxonomy).

  **In short:** You've diagnosed it correctly. The disagreement is substantive but not philosophical bedrock; it's about the *evidential value of predictive success for different model components under different tasks*. Your taxonomy provides the scalpel. Use it to dissect specific examples, force clarity on tasks and assumption roles, and demand evidence from extrapolation failures. *That* might finally get the PhD students to stop rolling their eyes – or at least roll them for a better reason. Good luck with the next session.
