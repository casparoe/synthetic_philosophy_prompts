prompt: |-
  You are a philosopher of language who has also done descriptive fieldwork on a language with no written tradition, and who is used to explaining technical disputes to non-specialists without cheating. Think carefully and at length. Before you write anything final, spend a few hundred words of private brainstorming: sketch every candidate requirement you can think of for the theory I describe below, argue with yourself about each, and discard the ones that are really just preferences of one school. Then commit to the list that survives, and say plainly which candidates you threw out and why.

  The setting. I am a journalist working on a long feature about translation — human and machine — and about the claim, which I keep encountering in one form or another, that a system which renders a sentence of one language into another has or has not got what the speaker was talking about right. The classic version of this worry is Quine's field linguist, who hears a word — gavagai — in the presence of a rabbit and cannot settle whether the speakers mean rabbit, undetached rabbit part, rabbit stage, or rabbithood. I have read the popular versions of that argument and I do not need another summary of it. What I want instead is the specification: what a theory of what it takes to fix what a speaker's words are about would have to deliver in order to be adequate.

  Fix the adequacy to a purpose, because I think that is where these arguments go wrong. I want a theory good enough for this job: to let an outsider — me, a skeptical reviewer, an auditor of a translation system — decide and defend in public whether a given rendering has pinned down what the speaker was talking about, and to say what would count as evidence for or against it. If the honest answer is that the question has no determinate answer, that is a finding I can use, but only if the theory tells me why it is a finding rather than a shrug, and what I should say instead.

  Here are the situations I want the theory to be tested against. Some are invented; treat them as data, and add your own if a requirement needs one.

  One. A field linguist finds two words where Quine found one. The first is used of a live rabbit, not of a rabbit carcass and not of a rabbit seen at dusk. The second is used of a live rabbit, of a severed rabbit foot, and of rabbit stew, but not of a rabbit-shaped decoy. Is either of them the word for rabbit, if either is? A theory that must choose between them, and one that must be permitted to refuse, are very different theories, and I want to know what forces the choice.

  Two. The speakers assent to the word when an older man points at a rabbit and withhold assent when a younger person does, even though both are plainly looking at the same animal. The linguist cannot tell whether this is a fact about what the word means, a fact about who is allowed to speak about rabbits, or a fact about whom these people defer to. Can a theory separate meaning from the social practice of deference if all it has to go on is behavior, or must the manual absorb the deference into the meaning?

  Three. Coordination works perfectly in the middle of the range and falls apart at the edges. The linguist and a speaker hunt together successfully for months on the strength of one word; then the linguist points at a rabbit-shaped rock, then at a rabbit at dusk, and the assent pattern becomes noise. Which range is the theory answerable to — the practical core, or the boundary cases, or both?

  Four. The case that matters most for my piece, and the one I have not seen handled: there is no field linguist at all. No pointing, no shared environment, no assent behavior, no questions asked and answered. There is only a large corpus of text in the source language paired with text in the target language — this is roughly the situation of a machine translation system. State what, if anything, a theory must say about whether reference can be fixed in that setting, and what the difference is between the corpus-only setting and the field setting.

  Five. Evidence that is downstream of the theory itself. A second linguist produces a manual that pairs the word with undetached rabbit part; the two manuals agree on every sentence anyone has tested and disagree on what the word is about. Years later some speakers learn enough of the linguist's language to be asked which they meant — but they learned the relevant word from the first linguist's own translations. Is their answer independent evidence, or is it contaminated by the manual used to teach them? I want a requirement about what counts as independent evidence here.

  Six. The speakers say things that are, on the most natural rendering, straightforwardly false — that a crop failed because the ancestors were angered. A theory under pressure to make speakers come out right about most things will have to say something about error, disagreement and false belief, or it will make them unfalsifiable.

  Seven. Symmetry. Whatever the theory says must apply to the linguist's own language; it may not grant determinacy to English while denying it to the language under study.

  The deliverable. Give me the requirements list: what an adequate theory must be able to do — the cases it must get right, the distinctions it must not collapse, the results it must be consistent with — with the case or consideration behind each one. For each, mark whether it is non-negotiable, whether it is negotiable, or whether you suspect it is a prejudice of one camp that has smuggled itself in as a requirement. Distinguish, where it matters, between not knowing which manual is correct and there being no fact of the matter, and say how anyone could tell the difference. Say also whether the theory must be able to state its own conclusion in the vocabulary whose determinacy it is calling into question.

  Then the two things I care most about. First: is any subset of these requirements jointly unsatisfiable? If the list itself forces a result — if, say, a behavioral-evidence constraint and a determinate-reference constraint cannot both hold — say so explicitly and show the argument; that is the part of the piece I most want to get right. Second: which single requirement does the most work in excluding otherwise attractive theories?

  Only at the end, and briefly: in prose or a small table, score against your list the four broad families of answer — a charity-and-truth-conditions style account, a causal or informational account of how terms get hooked to things, an inferential-role or use-theoretic account, and the deflationary view that the puzzle is a pseudo-problem. One or two lines each is plenty; keep the weight on the criteria. Define any term of art a general reader would trip over, and do not give me a bibliography, a reading list, or citations — I am not going to chase references, and a theory that only works when footnoted is not one I can use.
reasoning: |-
  Hmm, this is a rich and challenging request from a journalist working on translation. They want me to develop a set of requirements for what would make a theory about fixing reference (what speakers' words are about) adequate for practical assessment. The key is that this theory must help an outsider decide whether a translation has captured what was being talked about, with special attention to seven test cases they've provided.

  First, I need to consider all possible requirements that might be proposed for such a theory, then critically evaluate each one to separate genuine necessities from mere theoretical preferences. The journalist explicitly wants me to document this brainstorming process - what I consider, what I reject, and why.

  Looking at their scenarios: We've got cases involving partial reference (rabbits but not carcasses), social factors (who can point at rabbits), boundary problems (rabbit-shaped rocks), corpus-only translation, contaminated evidence from bilingual speakers, false beliefs, and symmetry between languages. Each reveals different challenges for a reference theory.

  Potential requirements that come to mind include:
  - Behavioral adequacy (must account for observable language use)
  - Social practice recognition (can't ignore who speaks when)
  - Boundary case handling (must address fuzzy edges)
  - Corpus-only applicability (must work without field interaction)
  - Independent evidence specification (what counts as uncontaminated proof)
  - Error accommodation (must allow for false statements)
  - Symmetry principle (applies equally to all languages)
  - Determinacy clarification (must distinguish "don't know" from "no fact")
  - Self-applicability (theory must use its own terms consistently)
  - Practical utility (must help decide real translation cases)

  Now I need to argue with myself about each. For example, should behavioral adequacy be non-negotiable? Probably yes - without behavioral constraints, we lose connection to actual language use. But pure behaviorism might collapse important distinctions, like between meaning and social deference (Case 2). So I'll keep it but note limits.

  The symmetry principle seems crucial - we can't privilege English while doubting other languages. That's non-negotiable. But determining whether it's a "prejudice" requires examining if it unfairly excludes certain theories.

  For the corpus-only case (Case 4), this is particularly important for machine translation. Any adequate theory must say something about whether reference can be fixed without shared environment - even if the answer is "no," it must explain why this matters.

  The independent evidence requirement (Case 5) is tricky. We need clear criteria for what counts as uncontaminated evidence, which might mean evidence gathered before any cross-language contamination occurs.

  After this internal debate, I'll settle on a final list of requirements, marking each as non-negotiable, negotiable, or potentially prejudiced. Then I'll examine whether any requirements conflict in ways that force particular outcomes - for example, if insisting on determinate reference clashes with behavioral evidence limitations.

  Finally, I'll briefly evaluate four major theoretical approaches against these requirements: truth-conditional semantics, causal theories, inferential role semantics, and deflationism. The key is showing how each handles (or fails) the test cases, not advocating for any one position.

  Throughout, I'll avoid jargon and focus on what a journalist can actually use - no citations, no footnotes, just clear analysis of what a reference theory must accomplish to be practically useful for assessing translations.
answer: |-
  Here is the distilled requirements list for an adequate theory of reference fixation, following extensive brainstorming where I considered and rejected several candidates. I discarded requirements that smuggled in substantive philosophical commitments rather than genuine adequacy conditions for your journalistic purpose. The surviving requirements are framed by your core question: **What must a theory deliver to let an outsider publicly decide whether a translation has "pinned down what the speaker was talking about," using observable evidence?**

  ### Requirements List (Non-Negotiables Marked ⚠️)
  1. **Behavioral Adequacy (Case 1, 2, 3)**  
     ⚠️ **Non-negotiable.** The theory must account for all observable linguistic behavior (assent/dissent, successful coordination, breakdowns). It must distinguish between:  
     - *Competence*: What speakers consistently do in core cases (e.g., successful rabbit hunts).  
     - *Boundary Noise*: Where behavior becomes inconsistent (e.g., rabbit-shaped rocks).  
     *Why?* Without this, the theory cannot interface with evidence. Rejects theories that ignore behavior or overfit to edge cases.  

  2. **Social Practice Transparency (Case 2)**  
     **Negotiable.** The theory must *either*:  
     (a) Separate semantic meaning from social facts (e.g., deference, authority), OR  
     (b) Explicitly absorb social practices into meaning *and* justify why this is necessary.  
     *Why?* To avoid conflating "what a word means" with "who may use it." Discarded the stronger requirement that meaning *must* be separable, as this assumes individualism (a contested view).  

  3. **Error Accommodation (Case 6)**  
     ⚠️ **Non-negotiable.** The theory must allow for speakers to be *wrong* (e.g., false beliefs about ancestors). It cannot make speakers infallible.  
     *Why?* Otherwise, reference becomes untestable – any contradiction is dismissed as "misinterpretation."  

  4. **Corpus-Only Applicability (Case 4)**  
     ⚠️ **Non-negotiable.** The theory must state whether reference can be fixed *without* shared environment or interaction. If yes, it must say *how* (e.g., via patterns in paired texts). If no, it must explain *why* the absence of shared context prevents reference fixation (e.g., lack of causal grounding).  
     *Why?* This is critical for machine translation. The field setting provides ostension ("pointing"); the corpus setting lacks it. A theory must address this gap.  

  5. **Evidence Independence (Case 5)**  
     ⚠️ **Non-negotiable.** The theory must specify what counts as *independent evidence* for reference (e.g., pre-contact cultural artifacts, child language acquisition). It must flag "contaminated" evidence (e.g., speakers taught via linguist’s manuals).  
     *Why?* Without this, circularity invalidates verification.  

  6. **Symmetry (Case 7)**  
     ⚠️ **Non-negotiable.** The theory must apply identically to all languages, including the linguist’s own. No privileging "English" as determinate.  
     *Why?* Asymmetric theories beg the question.  

  7. **Determinacy Diagnostics**  
     ⚠️ **Non-negotiable.** The theory must distinguish:  
     - *Ignorance* ("We don’t know if it means rabbit or rabbit-part").  
     - *Indeterminacy* ("There is no fact of the matter").  
     *How to tell?* Test via novel predictions. If two manuals agree on all behavior but disagree on reference, and no *new* evidence could resolve it, that suggests indeterminacy.  

  8. **Self-Applicability**  
     **Negotiable.** The theory should ideally state its conclusions in non-question-begging terms. If it uses the target vocabulary (e.g., "reference"), it must not presuppose determinacy.  
     *Why?* Avoids performative contradiction.  

  ---

  ### Rejected Candidates & Why
  - **"Must Resolve All Boundary Cases"**: Rejected. This is a preference for precision, not a requirement. Case 3 shows boundary noise may be inherent in use.  
  - **"Must Reduce Meaning to Behavior Alone"**: Rejected. A behaviorist *prejudice*. Case 2 shows social facts may be irreducible.  
  - **"Must Guarantee Determinacy"**: Rejected. A metaphysical commitment. The theory may *conclude* indeterminacy (per Case 1/5).  
  - **"Must Prioritize Core over Boundary Cases"**: Rejected. A pragmatic preference, not a necessity. A theory could prioritize boundaries (e.g., formal semantics).  

  ---

  ### Critical Tensions & Key Excluder
  1. **Joint Unsatisfiability?**  
     **Yes.** The trio of:  
     - Behavioral Adequacy (Requirement 1),  
     - Corpus-Only Applicability (Requirement 4),  
     - Determinacy (implied by "pinning down" reference)  
     **cannot all hold.**  
     *Why?* In the corpus-only setting (Case 4), behavioral evidence is limited to text patterns. Without shared environment (ostension), there is no way to anchor reference to extralinguistic reality. Behavior (text) underdetermines reference (Quine’s point). A theory satisfying Behavioral Adequacy and Corpus-Only Applicability *must* allow for indeterminacy.  

  2. **Most Excluding Requirement**  
     **Evidence Independence (Requirement 5).** This excludes:  
     - Theories relying solely on speaker intuitions (contaminated by translation).  
     - Causal theories requiring direct interaction with referents (impossible in corpus-only).  
     - Deflationism (if it treats "reference" as uncontroversial).  

  ---

  ### Scoring Major Theories
  | **Theory**                          | **Behavioral Adequacy** | **Corpus-Only** | **Error** | **Evidence Independence** | **Determinacy Diagnostics** | **Verdict** |  
  |-------------------------------------|-------------------------|-----------------|-----------|---------------------------|-----------------------------|-------------|  
  | **Charity/Truth-Conditions** (e.g., Davidson) | Strong (prioritizes agreement) | Weak (needs shared world) | Strong (allows error) | Weak (depends on interpretation) | Weak (assumes determinacy) | Fails Cases 4,5 |  
  | **Causal/Informational** (e.g., Fodor) | Weak (ignores use) | Very Weak (needs causation) | Strong | Weak (needs causal chains) | Weak (assumes determinacy) | Fails Cases 2,4,5 |  
  | **Inferential Role** (e.g., Brandom) | Strong (prioritizes use) | Moderate (text patterns suffice) | Strong | Moderate (if corpus is pristine) | Strong (allows indeterminacy) | Best fit, but struggles with Case 4 anchoring |  
  | **Deflationism** (e.g., Quine) | Strong | Strong | Strong | Strong | Strong (embraces indeterminacy) | Rejects "pinning down" as ill-defined. Best for Cases 1,5; worst for your core question. |  

  **Key terms**:  
  - **Inferential role**: Meaning is defined by how a word is used in reasoning (e.g., "rabbit" implies "animal," "furry").  
  - **Deflationism**: "Reference" isn’t a deep relation; it’s a tool for semantic bookkeeping.  

  ### Conclusion
  An adequate theory must navigate the tension between **evidence** (behavior, corpus) and **determinacy**. No theory satisfies all requirements perfectly, but **Inferential Role semantics** handles the most cases at the cost of potentially vague reference. **Deflationism** is coherent but dismisses your core question. The corpus-only setting (Case 4) is the graveyard for theories demanding determinate reference. If your goal is to "decide and defend" whether reference is pinned down, the theory must *at minimum* provide clear diagnostics for when it isn’t – and Requirement 5 (Evidence Independence) is the linchpin.
