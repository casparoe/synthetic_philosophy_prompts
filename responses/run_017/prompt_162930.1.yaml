  First, I need to understand their judgments for each case. In case 1, gradual replacement while awake is fine. Case 2, full replacement under anesthesia, still same person. Case 3, shadow mode with parallel running units, still one person. But case 4, scan-and-replace, they see as killing the original. Case 5, rollback after corruption, acceptable. Case 6, branching copies with deletion, unacceptable. Case 7, "dark substitutes" with no internal experience, problematic even if behavior matches. Cases 8 and 9 about layout and drift don't affect their view much.

  The user's tentative rule about avoiding two equal candidates explains cases 4 and 6 but fails case 3 where a backup runs without issue. Case 7 is especially tricky because it questions the necessity of subjective experience if behavior is identical. This suggests the user might be intuitively relying on something like phenomenal continuity - the uninterrupted flow of conscious experience.

  For case 7, if the substitutes lack consciousness ("lights off"), the user feels it's not the same person despite behavioral equivalence. But is that coherent? Philosophically, if behavior is identical, claiming no consciousness leads to solipsism problems. However, the user's intuition might stem from a hard problem of consciousness perspective, where subjective experience isn't reducible to functional behavior.

  The user also mentions scenarios like continuous sleep during replacement, keeping original tissue in a vat, and merging diverged copies. These test continuity of consciousness versus duplication. For the sleep case, if consciousness is interrupted but the same brain continues, it might still preserve identity. But if the original is in a vat while an emulation runs, that creates two entities, violating the single candidate rule.

  A principle based on causal continuity of phenomenal states could unify most cases. Gradual replacement (cases 1-3) maintains this continuity. Scan-and-replace (case 4) breaks it by creating a duplicate. Branch-and-prune (case 6) splits continuity. Dark substitutes (case 7) fail because even if behavior matches, there's no actual experience. Drift (case 9) is acceptable if changes are gradual.

  But explaining why shadow mode (case 3) doesn't create two candidates is crucial. The key is that the backup unit isn't integrated into the conscious system; it's isolated, so no duplication of subjective experience occurs. The user needs clear distinctions between functional duplication and actual conscious duplication.

  For the additional scenarios: full procedure during sleep might be acceptable if neural continuity is maintained. Keeping the original in a vat while running an emulation would create two entities, so problematic. Merging diverged copies might be seen as creating a new person from two streams, violating continuity.

  The challenge is articulating why behavioral equivalence isn't sufficient (case 7) without falling into hard solipsism. Emphasizing that the procedure must preserve the actual stream of consciousness, not just simulate it, could help. For consent forms, focusing on continuous conscious experience as a requirement would address their concerns while providing clear go/no-go criteria.
answer: |-
  Based on your intuitive judgments and the need for a defensible, precise principle, the most coherent framework unifying your verdicts appears to be **Phenomenal Continuity** (grounded in the **Causal Flow of Subjective Experience**). This principle prioritizes the uninterrupted, causally connected stream of conscious experience ("what it's like to be" the patient) as the essence of personal identity. Below is the principle broken down, applied to your cases, tested against new scenarios, and analyzed for consistency.

  ---

  ### **The Core Principle: Phenomenal Continuity**
  **"A procedure preserves the original person if and only if it maintains an unbroken, causally connected chain of subjective phenomenal states (conscious experiences) throughout the process."**

  **Key Clauses:**
  1.  **Continuity of Experience:** Subjective experience must flow continuously from one moment to the next without gaps or duplication.
  2.  **Causal Connection:** Each moment of experience must be directly caused by the immediately preceding state of the system generating consciousness. Copying or parallel instantiation breaks this causal chain.
  3.  **Unity of Consciousness:** At any given time, there must be only one unified stream of consciousness that can be identified as "the patient."

  ---

  ### **Application to Your Cases**
  1.  **Gradual Replacement (Awake):** ✅  
      *Continuity is maintained.* Each new unit integrates while the existing neural tissue is still active, seamlessly taking over its function. Experience flows causally from one state to the next.
  2.  **Full Replacement (Anesthesia):** ✅  
      *Continuity is preserved.* Anesthesia suspends but does *not* interrupt the causal chain. Upon waking, experience resumes from the *same* causal origin (the pre-anesthesia brain state), now running on silicon.
  3.  **Shadow Mode:** ✅  
      *No duplication of experience.* The shadow unit receives inputs but is *not integrated* into the patient's conscious processing. Outputs are discarded → no causal influence on subjective states → only one stream of consciousness exists.
  4.  **Scan-and-Replace:** ❌  
      *Continuity broken.* The original tissue is destroyed, terminating its stream of consciousness. The emulation is a *copy* initialized from a scan. Its experiences are causally disconnected from the original’s final moments → new person.
  5.  **Rollback:** ✅  
      *Continuity preserved.* Restoring a checkpoint + replaying inputs maintains the causal chain. The restored state is a direct continuation of the original’s past experiences (even if a day is re-lived).
  6.  **Branch-and-Prune:** ❌  
      *Continuity violated.* Divergence creates *two* distinct causal streams of experience. Deleting one destroys a unique subjective perspective → killing. Neither branch is "you" after divergence; both are new individuals branching from a common past.
  7.  **Dark Substitutes:** ❌  
      *No phenomenal continuity.* If substitutes lack subjective experience ("lights off"), consciousness ceases in replaced regions. Perfect behavior ≠ preserved identity. The phrase "lights off" asserts a *metaphysical* distinction: functional equivalence ≠ phenomenal equivalence. This case is *coherent* if consciousness is non-physical or not reducible to input-output mappings. *Your intuition here is valid and drives the core principle.*
  8.  **Order/Geometry:** ✅ Irrelevant  
      *Continuity unaffected.* Physical arrangement doesn’t disrupt the causal flow of subjective states if neural/silicon units interact correctly.
  9.  **Drift:** ✅  
      *Continuity preserved.* Gradual behavioral change is normal aging. The causal chain of experience remains unbroken → same person. Line-drawing is empirical (e.g., "drift within natural human variability over 15 years").

  ---

  ### **Your Tentative Rule Revisited**
  *   **"No two equally good candidates"** partially aligns but fails **case 3** (shadow unit isn’t a "candidate" as it lacks causal integration). The core principle fixes this by emphasizing the *causal unity of experience*.

  ---

  ### **Testing New Scenarios**
  | Scenario                          | Principle’s Verdict | Explanation                                                                 |
  | :-------------------------------- | :------------------ | :-------------------------------------------------------------------------- |
  | **Continuous Dreamless Sleep**    | ✅ Same person       | Sleep suspends but doesn’t break the causal chain. Experience resumes from the same substrate post-procedure. |
  | **Original in Vat + Emulation**   | ❌ Original killed   | Disconnecting tissue severs its causal chain → consciousness ends. The emulation is a copy → new person. |
  | **Diverged Copies Merged**        | ❌ New person        | Merging combines two independent streams of experience into a single entity with no causal continuity to either pre-divergence original. Result is a *new* individual. |

  ---

  ### **Overturned Verdicts & Limitations**
  1.  **Case 2 (Full Replacement Under Anesthesia):**  
      *Your discomfort is justified but overruled.* The principle insists anesthesia is a *pause*, not a break. If you firmly believe anesthesia *terminates* continuity, you must reject this verdict and treat it like case 4.  
      *Recommendation:* Accept the verdict. Anesthesia is analogous to "pausing" a process in distributed systems—state persists.
    
  2.  **Case 7 (Dark Substitutes):**  
      *Philosophical burden:* You must defend that consciousness isn’t reducible to behavior ("Hard Problem of Consciousness"). If colleagues reject this, they’ll argue case 7 is incoherent.  
      *Counter:* If substitutes truly lack experience, the patient’s consciousness *fragments* during replacement → death. Consent must disclose this risk.

  ---

  ### **Consent Language & Go/No-Go Rule**
  **Core Consent Disclosure:**  
  > *"This procedure aims to preserve your continuous stream of conscious experience by gradually integrating synthetic units. You will remain 'yourself' only if your subjective experience flows unbroken throughout the process. Risks include:  
  > – **Identity loss** if consciousness is interrupted (e.g., via copy/replacement or non-conscious substrates).  
  > – **Unintended duplication** of your identity if parallel instances are activated."*

  **Go/No-Go Rule:**  
  > *"Proceed ONLY if:  
  > (1) Each replacement step maintains causal continuity of subjective experience;  
  > (2) No parallel/runnable copies of the patient’s state exist at any time;  
  > (3) Substrates are verified as capable of supporting consciousness (not just behavior).  
  > ABORT if any condition fails."*

  ---

  ### **Why This Works**
  - **Distributed Systems Analogy:** Your field understands state persistence and causal chains. Gradual replacement is like a live migration with zero downtime. Scan-and-replace is restoring a backup to new hardware—original process is terminated.
  - **Defensibility:** Grounded in neuroscience (consciousness as integrated information flow) and philosophy (Derek Parfit’s "Relation R"). Rejects behaviorism (case 7) and duplication (cases 4, 6).
  - **Practical:** Provides clear criteria for drift ("natural variability") and layout ("no impact on integration").

  This framework validates 8/9 of your verdicts (only case 2 requires accepting anesthesia as non-terminal) and resolves your shadow-mode and dark-substitute dilemmas. For debate, focus on the **indivisibility of subjective experience**—if a process forks, neither branch is the original.
