prompt: |-
  I'm a philosophy MA student working on formal epistemology, and to keep myself honest I run a small forecasting pool with four friends — twenty-odd questions a month, mostly about departmental life and travel times — which we currently score with the Brier score: for each question with a partition of outcomes, your inaccuracy is the sum of the squared differences between your reported credences and the 0/1 truth vector, and your points are that number rescaled. Last week a friend who works in statistics argued we should switch to what he calls the plain confidence rule: your score for a question is just the credence you assigned to the outcome that actually occurred, so that reporting 0.9 on the true cell earns 0.9 and the season's winner is whoever was right with the most conviction. I said this obviously rewards fanaticism, but when he asked me to say what exactly is wrong with it in the vocabulary I'd been reading — accuracy, dominance, propriety — I got no further than "it isn't strictly proper," and I realized I don't understand what work strict propriety (reporting your real credences uniquely maximizes expected score) is doing over and above merely being sensitive to the truth.

  So I have two connected questions about the accuracy-first programme, by which I mean the project of treating accuracy as the sole fundamental epistemic good and deriving probabilism, conditionalization and the rest from it. First: how much of the accuracy-dominance argument for probabilism is carried by the particular scoring rule, and what exactly has to be true of a rule for the argument to go through? I take the argument to show that for any credence function violating the probability axioms there is some probabilistic one that is more accurate at every possible world, but which features of a measure like the Brier score are doing the work — its being a squared distance, its additivity or separability across the cells of the partition, continuity, strict propriety, or something else — and what happens to the argument under each variation? If we reran the argument with the logarithmic score (minus the log of your credence in the truth) instead, would anything the programme cares about change? I can follow simple algebra over a three-cell partition, so please don't shy away from sketching the mechanics; what I want is the gut-level reason each condition is in the theorem.

  Second, about my friend's rule. I checked a three-cell case by hand and noticed that under it the assignment (0.6, 0.6, 0.6), which isn't even coherent, scores better than (0.4, 0.3, 0.3) at every possible outcome, and that (1, 1, 1) beats everything; his reply was that we should simply restrict the inputs to coherent assignments, and I can see that this blocks the inflation, but it looks to me as though the rule then just instructs you to be certain of whichever outcome you currently like best, since expected score is linear in your reports. Is his rule a genuine measure of accuracy at all — is it truth-directed, merely improper, or something worse — and what would a forecaster governed by it end up doing? My deeper worry is about circularity: if the only reason to exclude it is that it fails strict propriety, and the reason to care about strict propriety is that we want a measure under which your actual credences come out optimal, then we seem to have built the conclusion into the definition of accuracy, and I can't tell whether the literature has a non-question-begging reply to this, whether it concedes the point, or whether I've simply misidentified what the constraints are for. A related thought I'd like your view on: maybe the right response to my friend is that a forecast pool is not a pure accuracy exercise at all, because we also care about calibration, resolution, and not being humiliated in public — but I'm unsure whether that concedes too much to the accuracy-firster or nothing at all.
reasoning: |-
  Okay, let me start by unpacking this user's query. They're a philosophy MA student focused on formal epistemology, running a forecasting pool with friends. They currently use the Brier score but a statistician friend suggested switching to the "plain confidence rule." The user is concerned this rule rewards fanaticism and wants to understand the deeper issues within the accuracy-first program.

  First, I need to address their two main questions. The first is about the accuracy-dominance argument for probabilism and how it depends on the scoring rule. The second is about the flaws in the plain confidence rule and whether excluding it is circular.

  For the accuracy-dominance argument, the key point is that the Brier score's strict propriety ensures that only probabilistic credences avoid dominance. But what specific properties make this work? The user mentioned features like being a squared distance, additivity, continuity, and strict propriety. I recall that any strictly proper scoring rule will support the dominance argument because they all make expected accuracy align with actual credences. The Brier score has nice properties like being differentiable and strictly convex, which help in proving the theorems. But the logarithmic score also works, though it's more sensitive to extreme values. The dominance argument relies on the scoring rule being truth-directed and strictly proper. Truth-directed means higher credence in truth gets better scores. Strict propriety ensures that honesty is the best policy. Without strict propriety, like in the plain confidence rule, non-probabilistic credences might not be dominated, which breaks the argument for probabilism.

  Now, the user's friend's plain confidence rule. Assigning credence to the true outcome seems intuitive, but it's improper. The user noticed that (0.6,0.6,0.6) dominates (0.4,0.3,0.3). The friend suggested restricting to coherent assignments, but even then, the rule incentivizes extreme beliefs. If you report 1 on your highest credence, expected score is maximized linearly. So forecasters would always claim certainty, even if they're not. This undermines the whole point of having nuanced credences.

  The user's deeper worry is circularity: if we reject the plain rule because it's not strictly proper, and strict propriety is valued because it makes actual credences optimal, isn't that assuming what we're trying to prove? The accuracy-first program avoids this by starting from the concept of accuracy itself. Truth-directedness is fundamental—accuracy measures should reward true beliefs and penalize false ones. Strict propriety emerges as a consequence of wanting measures that don't perversely incentivize dishonesty. So it's not circular; strict propriety is derived from the goal of epistemic honesty, which is part of accuracy.

  The user also mentions practical aspects like calibration and humiliation. In a forecasting pool, these matter too. The plain confidence rule ignores calibration. Someone could always guess 1 and sometimes be right, scoring high, but be wrong often. The Brier score, however, penalizes overconfidence. So in practice, even if they use the plain rule, the group might add calibration checks or use multiple metrics. But for the accuracy-first program, the focus is on the theoretical underpinnings.

  I need to ensure the explanation connects the mathematical properties to the philosophical goals. For instance, why strict propriety matters—it's not just a technicality but ensures that rational agents are truthful. The dominance argument underlines that incoherent credences are accuracy-dominated, which wouldn't hold with improper rules. The user's example of (1,1,1) beating everything under the plain rule shows it's not truth-directed in a meaningful way because you can't be accurate across all worlds simultaneously.

  In summary, the response should clarify that the accuracy-dominance argument relies on the scoring rule being strictly proper and truth-directed. The plain confidence rule fails these, leading to bad incentives. The circularity concern is resolved by grounding strict propriety in the broader aim of epistemic rationality, not just assuming it. And yes, practical forecasting might consider other factors, but the core argument stands on theoretical grounds.
answer: |-
  Your questions cut to the heart of accuracy-first epistemology—specifically, the interplay between scoring rules, dominance arguments, and propriety. Let's break this down mechanistically, addressing both your core concerns.

  ### 1. The Accuracy-Dominance Argument for Probabilism: What Properties Matter?
  The argument shows: **Any non-probabilistic credence function is *accuracy-dominated* by some probabilistic one.** That is, for every possible world, the probabilistic function is at least as accurate, and strictly more accurate in some worlds. This relies critically on the structure of the scoring rule.

  #### Key Properties & Their Roles:
  - **Truth-Directedness (Essential):**  
    A rule is truth-directed if increasing your credence in the true outcome (decreasing it in false ones) *always* improves your score. *Why it matters:* Without this, "accuracy" isn't tied to truth-tracking. Both Brier and log score satisfy this.

  - **Strict Propriety (Crucial for Uniqueness):**  
    A rule is strictly proper if your *actual* credences uniquely maximize expected score (relative to itself). *Why it matters for dominance:*  
    - **Step 1:** For any non-probabilistic credence function **c**, there exists a probabilistic **c*** that is a *convex combination* of omniscient credence functions (which assign 1 to truth, 0 elsewhere).  
    - **Step 2:** Strict propriety implies **c*** has strictly higher expected accuracy than **c** *from the perspective of **c*** itself (via Jensen's inequality).  
    - **Step 3:** Because **c*** dominates **c** pointwise (in every world), **c** is accuracy-dominated.  
    *If propriety fails*, Step 2 breaks: **c*** may not expect itself to be better than **c**, so dominance isn't guaranteed.  

  - **Additivity/Separability (Convenient but Not Essential):**  
    Brier and log score are additive across cells: total score = sum of scores for each cell. *Why it matters:* It simplifies proofs and ensures dominance holds *partition-wise*. Non-additive rules can still work, but arguments get messier.  

  - **Continuity & Convexity (Technical Enablers):**  
    Continuity ensures no jumps; convexity (like Brier's squared loss) ensures unique optima. These support strict propriety and clean dominance proofs. Log score is strictly convex in log-space.  

  - **Brier vs. Log Score:**  
    Both are strictly proper, truth-directed, and additive. The dominance argument works identically for both. Differences arise in *secondary* properties:  
    - **Brier:** Bounded (scores ∈ [0,2]), symmetric, sensitive to distance.  
    - **Log Score:** Unbounded (→ -∞ if you assign 0 to truth), emphasizes extreme errors.  
    *Impact:* Log score penalizes overconfidence more harshly, but probabilism is equally justified under either.  

  **Gut-Level Takeaway:** Strict propriety is the linchpin. It forces non-probabilistic credences to be "expectationally" worse than *some* probabilistic alternative, which then pointwise dominates them. Truth-directedness ensures the winner tracks truth. Convexity/continuity make it work smoothly.

  ---

  ### 2. The "Plain Confidence Rule" – What's Wrong?
  Your friend's rule: **Score = credence assigned to the true outcome.**  
  - **Truth-Directed?** Yes. Higher confidence in truth → higher score.  
  - **Strictly Proper?** **No.** Let's see why this breaks everything.

  #### Mechanics of the Failure:
  - **Expected Score is Linear:**  
    Suppose your true credence in outcome A is *p*. Expected score = *p* × (your reported credence for A) + (1-*p*) × (your reported credence for not-A).  
    If you report *c_A* for A, and *c_{¬A}* for ¬A (with *c_A* + *c_{¬A}* = 1 for coherence), expected score = *p·c_A* + (1-*p*)·c_{¬A}*.  
    **This is linear in *c_A***. To maximize it, set *c_A* = 1 if *p* > 0.5, or *c_A* = 0 if *p* < 0.5. Only if *p*=0.5 is any report optimal.  

  - **Incentive:** Always report **1** for your most believed outcome, **0** otherwise. No incentive for nuance. Reporting (0.6, 0.6, 0.6) is impossible if coerced to coherence, but (1,0,0) dominates (0.4,0.3,0.3) if A is true.

  #### Why "Just Restrict to Coherence" Doesn't Save It:
  - Even with coherent inputs, the rule is **improper**. Your *actual* expected score is maximized by reporting **extreme credences (0 or 1)**, *never* your true probabilistic view (unless *p*=1 or 0).  
  - **Result:** A rational forecaster using this rule would *always* claim certainty, regardless of their actual credences. Accuracy becomes a sham.

  #### Is It a Genuine Accuracy Measure?
  - **Superficially yes** (truth-directed), but **functionally no**. It violates core epistemic norms:  
    - **Not Sensitive to Calibration:** Assigning 0.9 to a truth that occurs 50% of the time scores well when right, but isn't "accurate" in a repeated sense.  
    - **Ignores Discrimination/Resolution:** No reward for distinguishing 90% vs. 60% confidence; both get the same score if true.  
    - **Encourages Delusion:** You're incentivized to be *more extreme than you believe*.  

  #### Circularity Worry: Is Rejecting It Question-Begging?
  Your concern: *If strict propriety is required, and propriety means "your true credences are optimal," aren't we assuming what we want to prove?*  
  - **No.** The accuracy-first program starts from two independent pillars:  
    1. **Axiological Commitment:** Accuracy is the fundamental epistemic good.  
    2. **Norms of Rationality:** Credences shouldn't be accuracy-dominated (No Dominance), and should be "honest" (Propriety).  
  - **Strict Propriety Isn't Arbitrary:** It flows from accuracy + rationality. If a rule isn't proper, it incentivizes reporting *inaccurate* self-representations of belief. Accuracy isn't just about outcomes—it's about *expressing your true epistemic state*.  
  - **Dominance as the Decider:** The plain rule fails the dominance argument *because it's improper*. Non-probabilistic functions often aren't dominated (e.g., (0.6,0.6,0.6) dominates probabilistic (0.4,0.3,0.3) in your example). **Only strictly proper rules ensure probabilism avoids dominance.**

  #### Your Practical Counterargument: Beyond Pure Accuracy?
  You’re right: forecasting pools aren't *just* about accuracy. Calibration (e.g., events you assign 0.8 should happen 80% of the time) and resolution (discriminating between 55% and 95%) matter socially. The plain confidence rule ignores both:
  - **Calibration Disaster:** Someone assigning 1.0 to everything scores 1 when right (and 0 when wrong), but will be wrong often—no penalty for miscalibration.
  - **Embodiment of Humiliation:** The "always 1.0" strategist will be publicly wrecked when wrong. Brier and log score naturally incorporate calibration (via *strict* propriety).

  **Concession?** Not really. Accuracy-firsters can say: *Proper scoring rules naturally promote calibration/resolution as components of accuracy.* The plain rule decouples them.

  ---

  ### Bottom Line for Your Forecasting Pool
  - **Stick with Brier (or log).** The plain confidence rule is epistemically bankrupt: it rewards dogma, punishes nuance, and incentivizes dishonesty.  
  - **To convince your friend:** Simulate 100 forecasts where he uses the plain rule (reporting 1.0 for his top belief) and you use Brier. His score will be spikey (1.0 when right, 0.0 when wrong); yours will be stable. Over time, he’ll look foolish when wrong, and you’ll have better resolution.  
  - **Philosophically:** The accuracy-dominance argument fails without strict propriety, and propriety is no tautology—it’s the bridge between accuracy-as-goal and rationality-as-behavior. Your "gut" was right: fanaticism is rewarded, and that’s a feature, not a bug, of the rule.
