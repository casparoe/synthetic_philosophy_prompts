  **Textualist Reasoning**:  
  - "Advise" plainly includes phone consultations → violation  
  - No ambiguity → no need to consider purpose  

  **Purposivist Reasoning**:  
  - Statute’s purpose: prevent harm from untrained hands *in clinical contexts*  
