answer: |-
  Here is a self-contained fact pattern meeting all requirements, followed by a breakdown of the reasoning, a near-variant, collapse analysis, and textualist critique:

  ---

  **Fact Pattern**  
  The State Veterinary Licensing Board investigates "Rover Rescue," an unlicensed animal shelter whose volunteers occasionally give basic pet care advice by phone to adopters. A volunteer told a caller whose dog had mild diarrhea to "withhold food for 24 hours and offer bland rice/chicken." The Board cites § 14-802: "No person shall practice veterinary medicine without a license. ‘Practice of veterinary medicine’ includes diagnosing, treating, or advising on the care of animals." Rover Rescue argues this applies only to clinical services for fees. Legislative history is sparse: floor debates mention "preventing harm from untrained individuals" but lack specifics about scope. The Board seeks penalties.

  ---

  **Reasoning & Divergence Point**  
  - **Textualist**: Statute’s ordinary meaning is unambiguous. "Advising on the care of animals" covers any guidance, including one-off phone advice. No need to infer unstated limitations; the text is broad but clear. *Result: Violation.*  
  - **Purposivist**: Purpose (preventing harm via untrained clinical interventions) is narrower than the text. Brief, non-diagnostic advice for minor symptoms (like dietary adjustments) falls outside the core concern of "practicing medicine." *Result: No violation.*  
  **Divergence Point**: Textualism applies the plain text’s breadth; purposivism restricts coverage to acts aligning with the harm-prevention purpose.  

  ---

  **Near-Variant (Convergence)**  
  *Same statute, but Rover Rescue’s volunteer is a* ***licensed veterinarian*** *doing this pro bono.*  
  - **Textualist**: "Advising" still covers the act, but the statute prohibits only *unlicensed* practice. Licensed vet → no violation.  
  - **Purposivist**: Purpose targets *untrained* actors; licensed vets pose no risk. No violation.  
  **Load-Bearing Feature**: The actor’s *unlicensed status* forced the original divergence by activating purposivism’s harm-prevention limitation.  

  ---

  **Collapse Analysis**  
  If Rover Rescue’s volunteer were **licensed**, the case collapses into an *easy textualist win*: the text’s exemption for licensed individuals controls, and purposivism aligns. Without the unlicensed status, purposivism lacks grounds to narrow the text.  

  ---

  **Textualist Attack & Rebuttal**  
  **Attack**: "This rigs textualism by defining ‘practicing veterinary medicine’ broadly upfront. The phrase itself is ambiguous—it could imply professional context, limiting ‘advising’ to formal consultations!"  
  **Rebuttal**: The statute *defines* "practicing" by listing specific acts ("diagnose, treat, advise"), stripping ambiguity. If "practicing" alone were undefined, textualism might narrow it contextually. Here, the explicit list’s breadth is inescapable. (Note: This reinforces the need for stable meanings—"advise" uncontestedly includes informal guidance.)  

  ---

  **Design Notes**  
  1. **Why it works**:  
     - Stable meanings ("advise," "care of animals" cover phone advice unambiguously).  
     - Purpose (harm prevention) is objectively narrower than text but not absurdly so.  
     - Legislative history is thin ("preventing harm" is generic).  
     - No lenity/sci-fi; realistic licensing dispute.  
  2. **Actual-Coalition Purposivism**: Same result if records show legislators feared "backyard surgeries." If records emphasized "consumer protection from paid services," purposivism *might* narrow further—but sparse history prevents this from resolving the case.  
  3. **Pedagogical Kick**: Students expect textualists to "cramp" statutes. Here, textualism *expands* liability to informal advice, while purposivism *contracts* it to clinical-risk contexts—reversing the cartoon.  

  This scenario forces methodological conflict without semantic loopholes, satisfying all constraints. Use it cold-calling to expose latent assumptions about each theory’s "default" directionality.
