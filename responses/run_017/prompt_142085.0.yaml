  3. **Environmental Permitting**: "Discharge into waters" includes groundwater migration. Textualist follows text; purposivist notes statute aimed at surface pollution. *Risk*: Groundwater might be lexically debatable as "waters." Discarded.  

  **Chosen Scenario: Veterinary Board Licensing**  
