prompt: |-
  I did just over thirty years as a government fisheries biologist, and since retiring I've been volunteering as the verification coordinator for our regional bird atlas — which means I'm the person who looks at what three hundred-odd citizen volunteers send in and decides what gets entered as a record, and at what confidence level. In the last couple of years I've also started reading philosophy, mostly out of stubborness, and I've got properly stuck on that raven example: someone pointed out that a white shoe is evidence that all ravens are black, because saying all ravens are black is apparently the same claim as saying everything that isn't black isn't a raven. My volunteers think this is a joke and I'm not sure it is, and it matters to me practically, because a fair number of the things the atlas is supposed to be able to say have exactly that shape: no pale-morph ravens occur in this region, every nest of species X in the county is on a cliff, all the individuals in the island population are the dark morph.

  So here's what I want. A decision procedure my verification team could actually run on a single submitted record, to say how much evidential weight it gets for a generalization of that all-X-are-Y shape, and where to stop with a no. Not a philosophy essay — I need something a retired volunteer with a field guide and a laptop can work through in ten minutes, thirty to sixty times a week in spring, with no maths past a ratio, and with an explicit instruction about what to do when the number it wants can't be had. It has to hand the decision to a human being at the points where the question is really about what we're willing to stake rather than about evidence, and say so out loud rather than dressing it up as a rule. And it has to be honest about which steps are judgment calls.

  The hard cases I keep hitting, which the procedure has to actually deal with rather than wave at:

  One volunteer has genuinely submitted a spreadsheet of three thousand photographs of non-black objects — shoes, sheep, a grey heron, a cloud — and wants them entered as supporting records. Another has proposed we redeploy volunteers to go out and photograph white things instead of birds, on the grounds that it's cheaper.

  The atlas currently gives "negative" records — I looked at point 47 for an hour and saw no ravens — zero weight, and archives them, while at the same time treating forty years of nobody ever reporting a pale raven as real evidence that there aren't any. That looks inconsistent to me and I want to know whether it is.

  Dependence: fourteen people photograph what is almost certainly the same bird at the same landfill. The same bird is reported forty times across a season. And a bird described as all black in June is photographed pale in November, which might be molt, or age, or wear, or a different individual entirely.

  Definitions: our field guide separates ravens from crows partly on size and tail shape and partly on the bird being all black. If being all black is part of how you identify a raven, then a pale bird can't be a raven by definition, and it feels like the generalization has become unfalsifiable and every weight my team assigns is meaningless. I want a step that catches this before we waste anyone's time.

  Closed versus open populations: on one offshore island the raven population is colour-banded and thought to be around two hundred birds; on the mainland nothing is closed and nobody knows. Should the procedure branch there?

  And lab results: a student sends genotype data showing the dark-morph allele in twelve sampled birds. Where does that sit on the same scale as a photograph, if it sits on it at all?

  Then run it on three cases. First, a single pale raven photographed at a landfill in November by one observer, mediocre photo, reportedly black in June, no specimen, species identification contested by two committee members, and a committee rule that wants two independent observers or a specimen. Second, the three thousand non-black objects. Third, nine thousand black-raven checklist records accumulated over forty years — and give me the honest answer on that one even if it comes out that we should stop collecting them, because I suspect it might, and I'd rather hear it plain than have it softened.

  Finally, tell me what the procedure can't do. My guess is that it can only ever rate a record against one hypothesis at a time and has nothing to say about what that same record is worth to the atlas for distribution or population trend, but you tell me. I've no library access any more, so please don't send me off to read somebody — just argue for the procedure you give me.
reasoning: |-
  Okay, the user is a retired government fisheries biologist now volunteering as a verification coordinator for a regional bird atlas. They're dealing with the raven paradox in practical terms, needing a decision procedure for evaluating records that support generalizations like "all ravens are black." They need something usable by volunteers without advanced math, handling real-world complexities like massive submissions of irrelevant data, negative records, dependence between observations, definitional issues, closed vs. open populations, and lab results.

  First, I need to unpack the raven paradox. Hempel's paradox points out that observing a non-black non-raven (like a white shoe) should support "all ravens are black" because it's logically equivalent to "all non-black things are non-ravens." But intuitively, a white shoe shouldn't count as evidence for raven coloration. The user needs to resolve this for their atlas work, where they make similar generalizations.

  The user's practical issues are key. The three thousand non-black objects submission is a direct challenge. How can the procedure dismiss this without philosophical hand-waving? Then there's inconsistency in handling negative records—archiving single negative observations but accepting decades of absence as evidence. Dependence is another problem: multiple reports of the same bird inflating evidence. Definitional issues arise if "all black" is part of the raven ID, making the claim tautological. Closed populations like banded islands versus open mainland populations need different handling. And where do genetic lab results fit compared to photos?

  The user wants a step-by-step procedure that volunteers can run in ten minutes. It must flag judgment points explicitly, avoid advanced math, and specify when to stop. They also want it tested on three cases: a contested pale raven photo, the 3000 non-black objects, and 9000 historical black raven records. Plus, clarity on what the procedure can't do.

  Starting with the core logic: the paradox arises from treating all observations equally. But in practice, evidence strength depends on how likely the observation is under the hypothesis versus alternatives. For "all ravens are black," observing a black raven is strong because it's expected only if the hypothesis is true. A white shoe is consistent with the hypothesis but also with many alternatives, so it's weak evidence. The procedure needs to capture this with likelihood ratios.

  But how to operationalize that for volunteers? Using a ratio of "probability under hypothesis" to "probability under alternatives" makes sense. But volunteers can't calculate probabilities. So, they need a way to estimate these qualitatively. Categories like "very likely," "possible," "unlikely" could work. For example, for a black raven observation, under "all ravens black" it's certain (100%), under alternatives (say, some ravens aren't black), it's less likely. Assigning percentages roughly, even if subjective.

  For the white shoe case: under "all ravens black," a non-black non-raven is probable (many such things exist). Under alternatives, also probable. So the ratio is close to 1, meaning no evidence. That addresses the massive non-black submissions—they get minimal weight because they don't change the probability of the hypothesis.

  Negative evidence is tricky. A single "no raven" observation has low weight because ravens might have been missed. But decades of no pale raven reports, especially with active searching, becomes strong evidence. The procedure needs to differentiate based on search effort and coverage.

  Dependence requires identifying if reports are independent. Multiple photos of the same bird count as one observation. The procedure should cluster dependent records.

  Definitional issues: if "all black" is part of the raven definition, then a pale bird can't be a raven, making the hypothesis unfalsifiable. The procedure must check if the characteristic is part of the species ID. If yes, stop—no evidence can counter it, so it's not a scientific claim.

  Closed populations allow quantitative assessments. For example, in a banded population, observing all dark morphs gives strong evidence if all individuals are accounted for. Open populations need more qualitative assessments.

  Lab results vs. photos: genetic data showing the dark allele in multiple birds is strong evidence, especially if the genotype-phenotype link is established. Photos are direct but might be misidentified. The procedure should rate lab evidence higher if reliable.

  The decision procedure steps: 

  1. **Clarify the generalization:** State exactly what's being claimed (e.g., "all ravens in region R are black"). Volunteers must define X and Y clearly.

  2. **Check for tautology:** If Y is part of X's definition, stop. The claim isn't testable.

  3. **Categorize observation type:** 
     - A: X and Y (black raven)
     - B: X and not Y (pale raven)
     - C: not X and Y (non-raven black thing)
     - D: not X and not Y (non-raven, non-black)

  4. **Assign likelihood ratios:**
     - For A: How likely is this under the hypothesis (H) vs. alternatives? If H is true, A is certain. If alternatives (some ravens not black), observing a black raven is still likely but not certain. So ratio >1, supporting H.
     - For D (non-black non-raven): Likely under both H and alternatives, so ratio ~1, no support.
     - B directly contradicts H, so if confirmed, falsifies H.
     - C (black non-raven) is irrelevant.

  5. **Adjust for reliability:** Photo quality, observer skill, etc. Use a reliability score (high/medium/low).

  6. **Handle dependence:** Group reports of the same individual or event as one observation.

  7. **Negative evidence:** Assess search effort. High effort with no sightings supports H.

  8. **Population type:** Closed populations allow stronger conclusions. Open ones require more observations.

  9. **Evidence weight scale:** Combine likelihood ratio and reliability into low/medium/high weight.

  Running through the cases:

  1. **Contested pale raven photo:**
     - Tautology check: If "all black" is part of raven ID, stop. Otherwise, proceed.
     - Type B: Contradicts H.
     - Reliability: Mediocre photo, contested ID, no specimen → low reliability.
     - Dependence: Single observer.
     - Weight: Low due to reliability. Committee rule requires more evidence.

  2. **3000 non-black objects:**
     - Type D: No evidential weight (ratio ~1).
     - Stop: No support for H.

  3. **9000 black raven records:**
     - Type A: Supports H.
     - Dependence: Likely many duplicates. Cluster by individual/time/location.
     - After clustering, effective observations might be lower.
     - In a well-covered area, this supports H strongly. But if clustered, less so.
     - Weight: Medium to high, but diminishes with repeated observations.

  What the procedure can't do:
  - Handle multiple hypotheses at once.
  - Assess evidence for distribution or population trends directly.
  - Replace expert judgment in tricky cases.
  - Account for changing conditions over time without explicit adjustment.

  The key is making the steps clear, using qualitative judgments, and flagging where human input is needed.
answer: |-
  Below is a practical, step-by-step decision procedure for your verification team to assess the evidential weight of a single submitted record for generalizations of the form "all X are Y" (e.g., "all ravens are black," "no pale-morph ravens occur in this region," "all individuals in the island population are the dark morph"). It's designed for retired volunteers with basic field biology experience, using only simple ratios (no advanced math), judgment flags, and explicit stopping points. It handles your hard cases directly. The procedure requires volunteers to work through 6–8 questions per record (taking ~10 minutes), with clear "STOP" instructions when no useful evidence exists or human judgment is needed. Crucially, it treats the raven paradox (white shoes as evidence) as a non-issue by assigning near-zero weight to irrelevant observations.

  ### Core Principles
  - **Evidence weight** depends on two factors:  
    (1) **Relevance**: How much does this observation challenge or support the hypothesis?  
    (2) **Reliability**: How trustworthy is the observation itself?  
  - Weight is rated on a simple scale: **None (0)**, **Low (1)**, **Medium (2)**, or **High (3)**. Assign a score based on the procedure's output.  
  - **Judgment calls** are flagged explicitly (e.g., "JUDGMENT NEEDED"), requiring team discussion. No step is automated when expertise is critical.  
  - **Dependence** is handled early to avoid overcounting.  
  - **Tautology checks** prevent wasted effort on unfalsifiable claims.  
  - **Negative records** are evaluated based on search effort, not just absence.  
  - **Lab data** is treated as high-reliability but contextual.  
  - **The output** is a weight score for the specific "all X are Y" hypothesis only—it says nothing about distribution, abundance, or trends.  

  ---

  ### Decision Procedure: Steps for a Single Record  
  *Run these steps in order. Stop if instructed. Use field guides, atlases, and committee rules as references. Time: ~10 minutes.*

  1. **Define the Generalization**  
     - State the hypothesis clearly: "All [X] are [Y]" (e.g., "all ravens are black"). If the record doesn't relate to a specific hypothesis, STOP: weight = **None**.  
     *Why: Focuses evaluation and avoids paradox distractions.*

  2. **Check for Tautology (Unfalsifiable Claim)**  
     - Is [Y] part of the official definition of [X] in your atlas or field guide? (e.g., "all ravens are black" is used to *identify* ravens).  
       - **YES**: STOP. The hypothesis cannot be tested—weight = **None**. Log why (e.g., "pale bird can't be a raven by definition").  
       - **NO**: Proceed.  
     *Why: Prevents meaningless assignments. Judgment call: Team must agree on what defines [X].*

  3. **Account for Dependence (Is this a unique event?)**  
     - Could this record describe the same individual/event as another record? (e.g., same bird, same location/time, same genetic sample).  
       - **YES**: Cluster it with dependent records. Treat the *cluster* as a single observation for weight assessment. Proceed with this cluster as "the record."  
       - **NO**: Proceed.  
     *Why: Avoids inflating evidence from duplicate reports. Judgment call: Use time/location/description to group records (e.g., landfill raven reported 14 times = 1 cluster).*

  4. **Categorize the Observation Type**  
     - Identify what was observed relative to [X] and [Y]:  
       - **Type A: [X] and [Y]** (e.g., black raven).  
       - **Type B: [X] and not [Y]** (e.g., pale raven).  
       - **Type C: Not [X] and [Y]** (e.g., black crow).  
       - **Type D: Not [X] and not [Y]** (e.g., white shoe).  
     *Why: Solves the raven paradox—Type C/D are irrelevant to "all X are Y."*

  5. **Assign Base Relevance (Relevance Ratio)**  
     - For each type, assign a **relevance ratio** (a simple fraction) based on how much the observation supports/challenges the hypothesis:  
       - **Type A**: Supports "all X are Y." Ratio = **1 / 10** (weak support: common if true, but also possible if false).  
       - **Type B**: Contradicts "all X are Y." Ratio = **10 / 1** (strong challenge: rare if true, common if false).  
       - **Type C or D**: Irrelevant. Ratio = **1 / 1** (no evidence: equally likely whether true or false).  
     - *If Type C or D: STOP. Weight = **None**.* Log as "Irrelevant observation."  
     *Why: White shoes (Type D) get ratio 1/1—no evidence. This avoids paradox issues practically.*

  6. **Adjust for Reliability (Trust Score)**  
     - Rate reliability based on method. Choose one:  
       - **High (3)**: Specimen, verified lab result (e.g., genetics), or high-quality photo/video with diagnostic features.  
       - **Medium (2)**: Good photo/video with metadata, expert observer notes.  
       - **Low (1)**: Poor photo, anecdotal description, or inexperienced observer.  
       - **Unusable (0)**: No evidence (e.g., "I saw it" with no details). If Unusable, STOP: weight = **None**.  
     - *Judgment call: Use committee rules (e.g., "needs two observers") here. If contested, default to lower score.*

  7. **Adjust for Context (Population Openness & Effort)**  
     - **Closed population?** (e.g., color-banded island birds with known size):  
       - **YES**: Multiply relevance ratio by **2** (easier to generalize).  
       - **NO** (open population): No change.  
     - **For negative records** (e.g., "no raven seen"):  
       - Was search effort documented? (e.g., duration, area covered, methodology).  
         - **High effort** (e.g., 1-hour structured survey): Treat as **Type A** (supports absence).  
         - **Low effort** (e.g., incidental note): STOP. Weight = **None**. Log as "Insufficient effort."  
     *Why: Negative records only count with effort. Closed populations strengthen evidence.*

  8. **Calculate Evidence Weight**  
     - **Weight Score** = (Relevance Ratio) × (Reliability Score) × (Context Multiplier).  
     - Convert to weight category:  
       - **< 0.5**: **None** (0)  
       - **0.5–2.9**: **Low** (1)  
       - **3.0–5.9**: **Medium** (2)  
       - **≥ 6.0**: **High** (3)  
     - *If Type B (contradiction), flag for urgent review regardless of weight.*  
     *Why: Simple multiplication handles real-world constraints. Ratios keep math easy.*

  9. **Final Judgment & Logging**  
     - Does the weight feel wrong due to unusual factors? (e.g., extreme rarity, changing conditions).  
       - **YES**: JUDGMENT NEEDED. Discuss and override with team consensus. Log the reason.  
       - **NO**: Assign weight, log the score, and move on.  
     *Why: Humans override edge cases. Science is pragmatic.*

  ---

  ### Handling Your Hard Cases Explicitly
  - **White shoes / 3,000 non-black objects**: These are **Type D (not X, not Y)**. Relevance ratio = 1/1 → weight = **None**. STOP at Step 5. Log: "Irrelevant to generalization."  
  - **Negative records**: Only get weight if **high effort** (Step 7). Archived low-effort negatives are correctly ignored; decades of absence are not "records" but accumulated context from high-effort surveys. No inconsistency.  
  - **Dependence**: Handled at **Step 3 (clustering)**. One bird at landfill = one observation, not 14.  
  - **Definitions**: Caught at **Step 2 (tautology check)**. If "all black" defines ravens, STOP—weight = **None**.  
  - **Closed vs. open populations**: Adjusts weight at **Step 7** via multiplier.  
  - **Lab results**: Treated as **High reliability (3)** in Step 6. Context determines relevance (e.g., genotyping dark-morph allele supports "all dark" if phenotype link is proven).  

  ---

  ### Run the Procedure on Your Cases
  **Case 1: Contested Pale Raven Photo**  
  - Hypothesis: "All ravens are black."  
  - Step 1: Defined.  
  - Step 2: No tautology (assuming ID doesn't require blackness). Proceed.  
  - Step 3: Single observer, no cluster. Proceed.  
  - Step 4: **Type B (raven, not black)**. Relevance ratio = 10/1.  
  - Step 6: Mediocre photo, contested ID → **Low reliability (1)**.  
  - Step 7: Open population → no multiplier.  
  - Step 8: Weight = (10/1) × 1 = 10 → **High (3)** for *contradiction*.  
  - Step 9: JUDGMENT NEEDED. Committee rule requires two observers/specimen → weight overridden to **None**. Log: "Contested ID, insufficient verification."  
  - **Output: Weight = None.**  

  **Case 2: 3,000 Non-Black Objects**  
  - Hypothesis: "All ravens are black."  
  - Step 1: Defined.  
  - Step 4: **Type D (not raven, not black)**. Relevance ratio = 1/1.  
  - Step 5: STOP → weight = **None**.  
  - **Output: Weight = None.** Log: "Irrelevant to generalization."  

  **Case 3: 9,000 Black-Raven Checklists (40 years)**  
  - Hypothesis: "All ravens are black."  
  - Step 1: Defined.  
  - Step 2: No tautology. Proceed.  
  - Step 3: **Cluster by individual/time/location**. Assume high dependence → effective observations = ~500 (estimate). Proceed with one "representative" record.  
  - Step 4: **Type A (raven, black)**. Relevance ratio = 1/10.  
  - Step 6: Checklists vary; assume **Medium reliability (2)**.  
  - Step 7: Open population → no multiplier.  
  - Step 8: Weight = (1/10) × 2 = 0.2 → **Low (1)**.  
  - Step 9: JUDGMENT NEEDED. Decades of coverage → team may raise to **Medium (2)**. Log: "Strong cumulative context but high dependence."  
  - **Honest verdict**: Weight per record is **Low-Medium**. Collecting more has diminishing returns—focus effort on high-value gaps (e.g., under-surveyed areas).  
  - **Output after judgment: Weight = Medium (2).**  

  ---

  ### What the Procedure Can't Do  
  1. **Handle multiple hypotheses**: It only evaluates one "all X are Y" claim at a time. A record supporting "all ravens are black" says nothing about "ravens avoid cities."  
  2. **Assess non-generalization evidence**: Weight is for the hypothesis only. For distribution/trends, you need other methods (e.g., occupancy modeling).  
  3. **Quantify absolute proof**: It assesses *weight*, not truth. "High" weight means strong evidence, not certainty.  
  4. **Adjust for temporal changes**: If conditions shift (e.g., climate affecting morphs), human judgment must reset baselines.  
  5. **Replace sampling design**: It evaluates records, not survey efficiency. Your white-shoe volunteer is wrong—targeted sampling of X (e.g., ravens) is always better than non-X (e.g., white things).  
  6. **Resolve deep philosophy**: It pragmatically avoids the raven paradox by ignoring irrelevant data, but doesn't "solve" logic debates.  

  ### Why This Works  
  - **Practical**: Uses ratios and scores a volunteer can tally on paper. No library or math needed.  
  - **Transparent**: Judgment calls are explicit, not hidden. Stopping rules prevent wasted time.  
  - **Robust**: Handles your cases by design—e.g., white shoes stop early, lab data gets high reliability.  
  - **Defensible**: Based on likelihood principles (simplified), making it scientifically sound for atlases.  

  This procedure won't make philosophers happy, but it will give your team a consistent, auditable way to assign weight. Test it for a month on real records and adjust the scores as needed—it's meant to be practical, not perfect.
