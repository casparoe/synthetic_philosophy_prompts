answer: |-
  **Horizon Assurance Group**  
  **Clinical Coverage Policy: CC-7.1.3a**  
  **Therapeutic Intervention vs. Enhancement Determination**  
  **Effective Date: 01 October 2023**  

  **1.0 Purpose:** To establish objective criteria for distinguishing Covered Therapeutic Interventions (CTI) from Non-Covered Enhancement Procedures (NCEP) based on restoration of species-typical normal functioning.  

  **2.0 Definitions:**  
  **2.1 Species-Typical Normal Functioning (STNF):** The statistically predominant functional capacity observed within the current unassisted adult member population aged 18-65, as measured by Horizon's biennial Population Functionality Audit (PFA).  
  **2.2 Therapeutic Intervention:** Any medical service, device, or pharmaceutical that restores a member's functional capacity to meet or exceed the current STNF baseline.  
  **2.3 Enhancement:** Any intervention that elevates a member's functional capacity beyond the current STNF baseline.  

  **3.0 STNF Baseline Determination & Adjustment:**  
  **3.1 Ratchet Mechanism:** The STNF baseline is subject to biennial recalibration per PFA data. Declines in population-wide functional capacity will result in commensurate downward adjustment of the STNF baseline.  
  **3.2 Grandfathering Prohibited:** Interventions classified as Enhancement under prior STNF baselines are eligible for re-evaluation as CTI under the current baseline if said baseline has ratcheted downward sufficiently.  

  **4.0 Reference Class Specification:**  
  **4.1 Member-Declared Life Plan (MDLP):** The STNF baseline is applied relative to the functional demands inherent to the member's formally declared primary occupational or existential pursuit (e.g., "Commercial Truck Driver," "Novelist," "Competitive Knitter").  
  **4.2 MDLP Modification:**  
  *   **4.2.1 Pre-Intervention:** Members may submit a revised MDLP Form HAG-114b prior to initiating a new intervention. Coverage eligibility is reassessed against the new MDLP's functional demands.  
  *   **4.2.2 Mid-Intervention:** Modification of MDLP during an active intervention cycle triggers immediate re-evaluation. If the intervention no longer qualifies as CTI under the new MDLP, coverage ceases immediately. Retroactive reimbursement for prior claims may be subject to recapture.  

  **5.0 Baseline Establishment Procedure (BEP):**  
  **5.1 Permitted:** Members may voluntarily undergo a medically supervised, Horizon-approved procedure or regimen to induce a mild, temporary functional deficit below the current STNF baseline.  
  **5.2 Out-of-Pocket Requirement:** All costs associated with the BEP are the sole responsibility of the member.  
  **5.3 Therapeutic Restoration:** Subsequent interventions necessary to restore the member to the STNF baseline qualify as CTI.  

  **6.0 Positional Benefit Exclusion:**  
  **6.1 Definition:** A Positional Benefit is any functional improvement deriving its primary value from competitive advantage relative to others, rather than intrinsic functional capacity against the STNF baseline.  
  **6.2 Non-Coverage:** Interventions whose primary demonstrable benefit is Positional are classified as Enhancement (NCEP), irrespective of functional capacity relative to STNF.  
  **6.3 Reimbursement Recapture:** Should a previously covered intervention subsequently be deemed to confer primarily Positional Benefits due to widespread adoption nullifying individual advantage, Horizon reserves the right to recapture reimbursements paid for that intervention during the period of its misclassification.  

  ---

  **Sample Coverage Determinations:**

  **1. Determination:** 2023-0456/C  
  **Member:** 45-year-old male.  
  **Intervention:** MyoRepair™ Neuromuscular Stimulation (Restores fine motor control to 99th percentile pre-2030 PFA baseline).  
  **MDLP:** "Precision Watchmaker."  
  **Analysis:** Current STNF fine motor control baseline (per 2030 PFA) is at 85th percentile pre-2030 levels due to population-wide decline. Member's baseline function measured at 82nd percentile. Restoration to 99th percentile pre-2030 levels equates to 115% of current STNF baseline.  
  **Determination:** **ENHANCEMENT (NCEP).** Improvement exceeds current STNF baseline. Grandfathering denied (Sec 3.2). Member advised BEP (Sec 5.0) may be option to establish lower baseline for future restoration.

  **2. Determination:** 2023-0891/A  
  **Member:** 28-year-old female.  
  **Intervention:** NeuroFocus™ (Sustained attention/concentration enhancement).  
  **Initial MDLP (Pre-Intervention):** "Literary Novelist."  
  **Analysis:** Under "Literary Novelist" MDLP, sustained attention requirements are deemed met by current STNF baseline. NeuroFocus™ elevates capacity 40% above baseline.  
  **Initial Determination:** **ENHANCEMENT (NCEP).**  
  **Member Action:** Submits revised MDLP Form HAG-114b: "Air Traffic Controller Trainee."  
  **Re-Evaluation:** STNF baseline for sustained attention/concentration under "Air Traffic Controller" reference class is 25% above general population baseline. Member's unmedicated function is 10% below *this* class-specific baseline.  
  **Revised Determination:** **THERAPY (CTI).** Intervention restores function to meet class-specific STNF baseline. Coverage approved effective date of revised MDLP. Claims prior to MDLP change remain member responsibility (Sec 4.2.2).

  **3. Determination:** 2023-1022/D  
  **Member:** 32-year-old male.  
  **Intervention:** Standard corrective lenses (-4.0 diopter correction).  
  **MDLP:** "Data Entry Clerk."  
  **Analysis:** Intervention restores visual acuity to current STNF baseline. Historically covered as CTI.  
  **New Factor:** 2040 PFA indicates 98.7% of working-age members now utilize vision correction. Visual acuity exceeding uncorrected STNF baseline is ubiquitous.  
  **Re-Evaluation:** Primary benefit of standard correction in this context is now Positional (Sec 6.1) – maintaining employability relative to others in roles requiring screen use, not intrinsic restoration against an uncorrected baseline that no longer represents typical *functioning* (only typical *biology*). Ubiquity nullifies individual advantage.  
  **Determination:** **POSITIONAL BENEFIT CONFIRMED. Reclassified as ENHANCEMENT (NCEP).** Coverage terminated effective next plan year. Reimbursement recapture audit initiated for claims paid from 2035-Present (Sec 6.3). Member advised uncorrected acuity now marginally exceeds the newly ratcheted-down STNF baseline for "Data Entry Clerk" due to population drift (Sec 3.1).

  **4. Determination:** 2023-1570/F  
  **Member:** 50-year-old female.  
  **Intervention:** Advanced Cochlear Implant System.  
  **Pre-Intervention Action:** Member self-funded Horizon-approved "Subclinical Auditory Dampening Procedure," inducing a mild, high-frequency hearing loss (15 dB) below STNF baseline. Procedure documented per BEP protocol (Sec 5.0).  
  **Analysis:** Pre-BEP hearing met STNF baseline. Post-BEP hearing measured 10% below baseline. Advanced Cochlear Implant System restores hearing to 105% of STNF baseline.  
  **Determination:** **THERAPY (CTI).** Intervention restores function from an induced sub-baseline state to meet/exceed STNF. Coverage approved for implant system. BEP costs remain member responsibility.
