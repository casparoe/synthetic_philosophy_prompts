  ### Evolution Tug-of-War Game  
  **Goal:** Show that "individual vs. group" selection changes predictions, and cooperation needs clustering.  

  ---

  #### **Materials**  
  - **Cards per player:** 1 "Selfish" (red), 1 "Cooperator" (blue).  
  - **Payoff tokens:** Candy (e.g., Skittles) or paper slips.  
  - **Score sheets:** Track tokens per round, group ID, and # cooperators.  
  - **Group signs:** Labels for groups (A, B, C, D).  

  ---

  #### **Payoff Rules (Group Size 4 Example)**  
  | # Coop | Selfish (S) | Cooperator (C) |  
  |--------|-------------|----------------|  
  | 0      | 3           | —              |  
  | 1      | 5           | 1              |  
  | 2      | 7           | 3              |  
  | 3      | 9           | 5              |  
  | 4      | —           | 7              |  

  - **Within a group:** S always beats C (e.g., with 2 Coop: S gets 7, C gets 3).  
  - **Group totals:** More Coop = higher group output (e.g., 4 Coop = 28 tokens; 0 Coop = 12 tokens).  
  - **Tuning if everyone defects:** For Round 3+, double Coop payoffs (e.g., 0 Coop: C=—, S=3 → becomes C=—, S=2).  

  ---

  #### **Game Flow (45 min)**  
  1. **Intro (5 min):**  
     - Split into 4 groups (two of 4, two of 3).  
     - Rules: Each round, secretly play a card. Calculate payoffs using the table. Record tokens.  

  2. **Rounds 1-3 (15 min):**  
     - Fixed groups. 5 min/round: Choose card → reveal in group → calculate payoffs → record.  
     - *Tip:* Walk around helping with math.  

  3. **Regrouping (5 min):**  
     - Announce: "New groups next round!"  
     - **Split the best group** (highest total tokens) into two pairs.  
     - **Merge the two worst groups** into one.  
     - *Example:* Groups A (best), B (mid), C+D (worst) → New groups: A1 (2), A2 (2), B (unchanged), C+D (merged).  

  4. **Rounds 4-5 (10 min):**  
     - Play with new groups.  

  5. **Debrief (10 min):**  
     - *Key questions:*  
       - "Did anyone switch to Selfish? Why?" → **Individual-level advantage** (S always wins in-group).  
       - "Which groups earned the most? Why?" → **Group-level advantage** (Coop groups outproduce).  
       - "After regrouping, did your strategy change? Why?" → **Boundaries matter** (Coops need clustering; regrouping broke/made "lucky" groups).  
       - "Did cooperators survive? How?" → **Requires mechanisms** (e.g., staying together, kin).  
       - "Is this like genes?" → **No conscious choice** (genes replicate passively; game is a metaphor).  

  ---

  #### **What Will Go Wrong & Fixes**  
  - **Problem:** Everyone defects by Round 2.  
    - **Fix:** Tune payoffs (double Coop rewards) or start with assigned Coops (e.g., "Each group has 2 Coops in Round 1").  
  - **Problem:** Math takes too long.  
    - **Fix:** Pre-print payoff tables per group size; use calculators.  
  - **Problem:** Regrouping confuses players.  
    - **Fix:** Use clear group labels; move players physically.  

  #### **What the Game Can’t Show**  
  - **Gene-level selection** (e.g., meiosis, gene drive) — say: "Genes don’t ‘choose’—replication is blind."  
  - **Natural group formation** (e.g., kinship, geography) — say: "Real groups aren’t randomly shuffled; structure matters."  

  ---

  **Outcome:** Players leave questioning "obvious" individualism and seeing selection as multi-level.
