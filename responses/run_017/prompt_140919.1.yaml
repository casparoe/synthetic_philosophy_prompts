  ### Case Design: Courier in an Unfamiliar City

  **Scenario**  
  A courier is in an unfamiliar city to deliver a package. The package is in one of two districts: North (A) or not North (¬A). Within the district, the building containing the package is either open (B) or closed (¬B). The courier is uncertain and must decide how to spend the next hour while waiting for delivery instructions. The courier receives a radio message: "If the package is in the North, then the building is open" (if A then B). She must act immediately based on her updated beliefs. The closeness structure is based on feasibility: changing the building status (open/closed) is easier than relocating the package (changing district). Thus, states differing only in building status are closer than those differing in district. Specifically, for a state violating the conditional (A ∧ ¬B), the closest state is (A ∧ B) (changing building status), followed by (¬A ∧ ¬B) (changing district).

  **State Space**  
  States are defined by two binary questions:  
  - A: Package in North district? (True: North, False: not North)  
  - B: Building open? (True: open, False: closed)  

  Four states:  
  - s1: A=true, B=true (North, open)  
  - s2: A=true, B=false (North, closed)  
  - s3: A=false, B=true (not North, open)  
  - s4: A=false, B=false (not North, closed)  

  **Priors**  
  Motivated by the courier's background knowledge: North is less familiar, and open buildings are more likely in non-North areas. Priors as fractions:  
  - P(s1) = 1/8  
  - P(s2) = 2/8  
  - P(s3) = 3/8  
  - P(s4) = 2/8  

  **Evidence**  
  Learned conditional: "If A then B" (i.e., ¬A ∨ B). This eliminates s2 (A ∧ ¬B).

  **Acts and Payoffs**  
  The courier chooses an activity with payoffs based on the state (acts do not affect states; payoffs depend only on the state):  
  - Act X: Go to a coffee shop. Payoff = 1 if building is open (B=true), else 0.  
    - Rationale: If open, she can deliver immediately after; if closed, she wastes time.  
  - Act Y: Go to the gym. Payoff = 1 if package not in North (A=false), else 0.  
    - Rationale: If not North, she has time for a workout; if North, she must rush.  

  Payoff table:  
  | State | A   | B   | Act X | Act Y |  
  |-------|-----|-----|-------|-------|  
  | s1   | T   | T   | 1     | 0     |  
  | s2   | T   | F   | 0     | 0     |  
  | s3   | F   | T   | 1     | 1     |  
  | s4   | F   | F   | 0     | 1     |  

  **Update Rules**  
  (i) **Conditioning**: Condition on material conditional ¬A ∨ B. Eliminate s2, renormalize.  
  (ii) **Imaging**: Move s2's mass to the closest state satisfying the conditional. Closest to s2 is s1 (differ only in B).  
  (iii) **Adams' Rule**: Minimizing relative information with P(B|A)=1. This collapses to conditioning on ¬A ∨ B (same as (i)), as the constraint implies P(¬A ∨ B)=1. Thus, only (i) and (ii) are distinct.

  **Posteriors and Decisions**  
  - **Conditioning (i)**:  
    P(s1 | ¬A ∨ B) = (1/8) / (6/8) = 1/6  
    P(s3 | ¬A ∨ B) = (3/8) / (6/8) = 3/6 = 1/2  
    P(s4 | ¬A ∨ B) = (2/8) / (6/8) = 2/6 = 1/3  
    P(A) = P(s1) = 1/6 (decreased from prior 3/8)  
    Expected utilities:  
    - EU(X) = P(B=true) = P(s1) + P(s3) = 1/6 + 1/2 = 2/3  
    - EU(Y) = P(A=false) = P(s3) + P(s4) = 1/2 + 1/3 = 5/6  
    **Recommendation: Y (gym; EU=5/6 > 2/3)**  

  - **Imaging (ii)**:  
    Move s2's mass (2/8) to s1:  
    P(s1) = 1/8 + 2/8 = 3/8  
    P(s3) = 3/8  
    P(s4) = 2/8  
    P(A) = P(s1) = 3/8 (unchanged from prior)  
    Expected utilities:  
    - EU(X) = P(B=true) = P(s1) + P(s3) = 3/8 + 3/8 = 6/8 = 3/4  
    - EU(Y) = P(A=false) = P(s3) + P(s4) = 3/8 + 2/8 = 5/8  
    **Recommendation: X (coffee; EU=3/4 > 5/8)**  

  **Verdict**  
  - Conditioning recommends Y (gym); imaging recommends X (coffee).  
  - Conditioning decreases P(A) (from 3/8 to 1/6); imaging keeps P(A) unchanged (3/8).  
  - Key feature: Prior mass in s2 (A ∧ ¬B) is large (2/8), and the closest state (s1, A ∧ B) has low prior (1/8). Conditioning redistributes mass proportionally, increasing ¬A states; imaging moves mass to s1, preserving P(A).  
  - Without this feature: If s1 and s4 had equal priors (e.g., P(s1)=P(s4)=2/8), conditioning would still decrease P(A), but imaging might not cause a flip (see robustness).  

  **Robustness**  
  - **Closeness Orderings**:  
    - If imaging moves s2's mass to s4 (¬A ∧ ¬B) instead:  
      P(s1)=1/8, P(s3)=3/8, P(s4)=2/8 + 2/8=4/8  
      EU(X)=P(B=true)=1/8+3/8=4/8, EU(Y)=P(A=false)=3/8+4/8=7/8 → Both rules recommend Y (no flip).  
    - If ties are split equally (s1 and s4):  
      P(s1)=1/8 + 1/8=2/8, P(s3)=3/8, P(s4)=2/8 + 1/8=3/8  
      EU(X)=2/8+3/8=5/8, EU(Y)=3/8+3/8=6/8 → Both recommend Y (no flip).  
    **Flip survives only under the motivated closeness (s2 → s1).**  

  - **Generalized Update (P(B|A)=0.75)**:  
    Use priors: P(s1)=0.1, P(s2)=0.3, P(s3)=0.25, P(s4)=0.35.  
    - **Conditioning (min relative entropy, fix P(A)=0.4)**:  
      P_new(A,B)=0.75×0.4=0.3, P_new(A,¬B)=0.25×0.4=0.1, P_new(¬A,B)=0.25, P_new(¬A,¬B)=0.35  
      EU(X)=0.3+0.25=0.55, EU(Y)=0.25+0.35=0.6 → **Recommend Y**.  
    - **Imaging (move 100% of s2 to s1)**:  
      P(s1)=0.1+0.3=0.4, P(s3)=0.25, P(s4)=0.35  
      EU(X)=0.4+0.25=0.65, EU(Y)=0.25+0.35=0.6 → **Recommend X (flip)**.  
    - If imaging moves mass fractionally (75% to s1, 25% to s4):  
      P(s1)=0.1+0.225=0.325, P(s3)=0.25, P(s4)=0.35+0.075=0.425  
      EU(X)=0.325+0.25=0.575, EU(Y)=0.25+0.425=0.675 → **No flip (recommends Y)**.  
    **Flip survives with full mass transfer to s1, but depends on imaging method.**  

  **Attacks and Contrivance**  
  - **Conditioning Defender**: Argues the decrease in P(A) is rational. Learning "if A then B" rules out A ∧ ¬B, and since B is not strongly associated with A (e.g., P(B|A) prior is low), A becomes less likely. The courier should avoid the gym only if ¬A is probable.  
  - **Imaging Defender**: Counters that the conditional doesn't negate A; it only requires minimal change (fixing the building status). Moving mass to s1 reflects this, preserving P(A). Conditioning overreacts by diluting A's probability.  
  - **Contrivance**: The flip requires:  
    - Closeness prioritizes changing B over A (justified by story).  
    - Priors where d > a and a + b > d (e.g., P(s4) > P(s1) and P(s1) + P(s2) > P(s4)).  
    - Acts sensitive to A and B independently.  
    Without these, the flip vanishes, but they are satisfiable without knife-edge values (e.g., priors a=0.1, b=0.3, d=0.2 work).  

  **Window for Flip**  
  - **Priors**: Satisfy d > a and a + b > d (e.g., a=0.1, b=0.3, d=0.2).  
  - **Payoffs**: Survives for any u1 > u2 and v1 > v2 (e.g., Act X: 1/0, Act Y: 1/0).  
  - **Closeness**: Must move s2's mass to s1 (not s4 or split).  

  **Conclusion**  
  This case achieves the goal: Conditioning and imaging yield conflicting recommendations due to differing posterior distributions, driven by where the mass from the eliminated state is allocated. The flip is robust across priors satisfying d > a and a + b > d, and survives generalized imaging with full mass transfer but depends on the closeness choice. Use this to spark debate on whether learning conditionals should affect the antecedent's probability.
