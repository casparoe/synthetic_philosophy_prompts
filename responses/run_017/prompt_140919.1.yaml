  - Defender of imaging: They would argue that learning the conditional should not change the probability of the antecedent unless there is a reason to think that the conditional is true because the antecedent is false. They would say that the similarity-based update is more conservative: it changes the world as little as possible to make the conditional true. In this case, it is easier to change the building status than to move the package, so the package being in the North is not less likely.

  Contrivance: The case does require a particular tie-breaking in the imaging (moving to s1 rather than to s4) and a particular prior structure (d>a and a+b>d). But we have provided a natural story for the tie-breaking (building status is easier to change than district). And the prior structure is not knife-edge (as we showed with a range of priors).

