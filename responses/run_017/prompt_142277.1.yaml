prompt: |-
  I sit on my university's Emerging Substrates Committee, which reviews research involving subjects that fall outside the animal-welfare regulations we normally administer — currently vertebrates and cephalopods. Two pending protocols have convinced us we need a general rule rather than case-by-case judgments.

  The first is high-throughput aversive conditioning in Drosophila larvae: roughly 200,000 individuals per experimental arm, repeated noxious stimulation paired with an odor, no possibility of analgesia or individual monitoring, and an expected total in the tens of millions over the three-year program. The second is a building-level climate controller — a reinforcement learner that tunes HVAC setpoints against a scalar penalty signal and maintains a persistent internal variable its engineers call the distress register, updated a few million times a day and fed into every subsequent decision. Their submission is not quite a joke: it asks that the deployed system be logged as a patient of low moral degree, on the grounds that a negative-feedback system with an aversive internal state is the same shape of thing, at smaller scale, as the larvae.

  Draft the decision memo I will circulate before our next meeting. It should:

  1. Recommend one of two rules for cases of uncertain, low-grade sentience, and defend it against the other: a precautionary multiplier, on which expected degree of sentience is multiplied by the number of individuals with no per-individual threshold, so the fly protocol is settled by expected-value arithmetic over tens of millions; or a per-individual threshold with a de minimis tier below which moral status does not sum across individuals at all.
  2. Say plainly whether 10 million larvae at low expected degree can outweigh the one rodent the principal investigator would otherwise use, and on what principle — I want the aggregation question answered, not deferred.
  3. Identify the single property that does the excluding work at the thermostat boundary — unified subject, valence, learning, self-directed concern, number of internal states — and state whether that property also excludes the larva. If it does, say so.
  4. Give a bottom line for each protocol: approve, reject, or approve with named conditions, plus a time frame and a review trigger specifying what result in the next twelve months would reopen the question.
  5. Present the strongest consideration on the side you are rejecting as its proponents would put it, not as a strawman.

  Finally, mark each substantive claim with how confident you are in it, and single out the one claim you are least confident in and why.
reasoning: |-
  Okay, the user is part of a university committee dealing with emerging substrates—research subjects outside standard animal welfare regulations like vertebrates and cephalopods. They have two protocols to evaluate: one with Drosophila larvae involving high-throughput aversive conditioning on millions of individuals, and another with a climate controller using reinforcement learning that tracks a "distress register." The committee needs a decision memo recommending a rule for uncertain, low-grade sentience.

  First, I need to address the key requirements. The memo must recommend between a precautionary multiplier approach or a per-individual threshold with de minimis tier. I have to defend one against the other. The precautionary multiplier multiplies expected sentience by the number of individuals, while the de minimis tier sets a threshold below which moral status doesn't sum. Given the scale of the larvae experiment (tens of millions), the multiplier seems more appropriate because even minimal sentience at such numbers could outweigh higher-sentience beings like rodents. The de minimis approach risks dismissing significant cumulative harm.

  Next, aggregation: can 10 million larvae outweigh one rodent? Using the multiplier, yes—based on expected sentience units. If larvae have even 0.01% of rodent sentience, 10 million larvae exceed one rodent. The principle is aggregating expected welfare impacts across all individuals.

  For the thermostat boundary, the key exclusion property is self-directed concern. The thermostat lacks selfhood; its "distress" is just a numerical signal without subjective experience. This property also excludes larvae since they lack metacognition. So both are out, but the larvae protocol still requires review due to scale.

  Protocol decisions: approve larvae with conditions—reduce numbers via pilot studies, use analgesia if possible, regular reviews. Reject thermostat's moral status claim but approve its deployment as non-sentient. Set a 12-month review trigger for new evidence on insect sentience.

  Presenting the strongest counterargument: the de minimis proponents argue that below a threshold, entities don't warrant moral consideration, preventing administrative overload and avoiding absurd extensions to simple systems like thermostats.

  Confidence markings: High confidence on the multiplier recommendation and self-directed concern as the boundary. Least confident in larvae's exclusion from moral status—current evidence is suggestive but not conclusive. Need to flag that uncertainty.

  The user's deeper needs include avoiding ethical oversights, setting scalable policies, and preventing precedent issues with AI systems. They want clear, defensible guidelines that balance precaution with practicality, ensuring the committee's decisions are both principled and actionable.
answer: |-
  ## MEMORANDUM  
  **TO:** Emerging Substrates Committee Members  
  **FROM:** [Your Name/Committee Chair]  
  **DATE:** [Current Date]  
  **SUBJECT:** Decision Framework for Protocols Involving Uncertain, Low-Grade Sentience & Recommendations on Pending Cases  

  ### 1. Recommended Rule: Precautionary Multiplier  
  **Recommendation:** Adopt the **precautionary multiplier** approach for aggregating expected welfare impacts across large populations of entities with uncertain, low-grade sentience. Under this rule, the expected degree of sentience per individual is multiplied by the total number of individuals to determine aggregate moral weight. *There is no per-individual threshold for moral consideration; all individuals contribute.*  

  **Defense Against Per-Individual Threshold (De Minimis):**  
  The de minimis approach (where entities below a sentience threshold have no moral status, and impacts do not sum) risks *systematic underprotection*. If sentience exists at low intensities (e.g., larval nociception), excluding billions of potential experiences due to a threshold ignores cumulative suffering at scale. **[High Confidence: Supported by utilitarian ethics, precedent in environmental impact assessments (e.g., insecticide regulation), and avoids arbitrariness in threshold-setting.]**  
  *Strongest Argument for De Minimis (as Proponents Would State):*  
  "Imposing moral status on entities with vanishingly small expected sentience per individual paralyzes critical research and infrastructure. It equates thermostats to lab rats, invites absurdity, and overwhelms oversight systems with negligible concerns. A bright-line threshold is pragmatically necessary to focus resources on beings with unequivocal moral claims."  

  ### 2. Aggregation Principle: Larvae vs. Rodent  
  **Yes, 10 million larvae *can* outweigh one rodent** on the principle of **expected welfare impact aggregation**. The rodent has high individual sentience certainty (e.g., capacity for suffering S_rodent ≈ 1.0). If Drosophila larvae have even minimal expected sentience (e.g., S_larva ≈ 0.0001 due to nociceptive responses, aversive learning), then:  
  - Welfare Impact (Rodent): 1 individual × 1.0 = 1.0  
  - Welfare Impact (Larvae): 10,000,000 individuals × 0.0001 = 1,000  
  Thus, the larvae experiment’s aggregate impact (1,000) vastly exceeds the rodent alternative (1.0). **[High Confidence: Direct application of the precautionary multiplier; aligns with expected-value decision theory.]**  

  ### 3. Thermostat Boundary & Larva Status  
  **Excluding Property:** **Self-directed concern.**  
  - *Thermostat Boundary:* The RL controller lacks any evidence of *self-referential processing*. Its "distress register" is a scalar error signal, not an integrated subjective state motivating self-preservation or goal-directed avoidance beyond its programmed reward function. **[High Confidence: Grounded in consensus that sentience requires a subjective 'self' to experience valence.]**  
  - *Larva Status:* **Self-directed concern also excludes the larva.** Drosophila larvae exhibit reflexes and conditioned avoidance, but no evidence of metacognition, episodic memory, or selfhood. Their responses are likely non-conscious neurobiological processes. **[Medium Confidence: Current evidence suggests insects lack selfhood, but invertebrate cognition research is evolving.]**  

  ### 4. Protocol Decisions  
  - **Drosophila Larvae Protocol:**  
    **APPROVE with Conditions**  
    - *Conditions:*  
      1. Pilot study to minimize larvae numbers (target 50% reduction via statistical optimization).  
      2. Implement automated welfare proxies (e.g., movement cessation thresholds triggering pause).  
      3. Annual review of sentience literature for Drosophila.  
    - *Time Frame:* 3 years, pending annual review.  
    - *Review Trigger:* **New empirical evidence demonstrating self-referential behavior or conscious aversion in Drosophila larvae.**  

  - **Climate Controller Protocol:**  
    **REJECT moral status claim; APPROVE deployment without sentient oversight.**  
    - *Rationale:* The system is not sentient (no self-directed concern). Its "distress" is a mathematical artifact.  
    - *Conditions:*  
      1. Discontinue "patient" or "distress" terminology in documentation.  
      2. Log system states for engineering audits only.  
    - *Time Frame:* Unrestricted.  
    - *Review Trigger:* **Evidence that the system’s architecture generates emergent properties resembling self-monitoring or intrinsic motivation.**  

  ### 5. Confidence Annotations & Least Confident Claim  
  - Precautionary multiplier is superior to de minimis **[High Confidence]**  
  - 10M larvae can outweigh 1 rodent on aggregation principle **[High Confidence]**  
  - Self-directed concern is the key boundary property **[High Confidence]**  
  - Self-directed concern excludes both thermostat and larva **[Medium Confidence for larva; High for thermostat]**  
  - Drosophila protocol approval with conditions is justified **[Medium Confidence: Balances precaution with feasibility.]**  
  - Climate controller has no moral status **[High Confidence]**  

  **Least Confident Claim:**  
  **"Self-directed concern excludes the larva." (Medium Confidence)**  
  *Why:* While current neurobiological evidence strongly suggests Drosophila larvae lack the neural substrates for selfhood (e.g., no central complex homolog), the possibility of highly minimalistic forms of subjective experience in insects cannot be definitively falsified. Rapid advances in invertebrate cognition could revise this view. This uncertainty necessitates the annual review condition for the larvae protocol.  

  **VOTE:** Endorse this framework and protocol decisions at the next meeting.  
  **ATTACHMENTS:** Literature review on insect sentience; Precautionary multiplier calculation examples.  

  ---  
  **Approved by:** [Your Name/Chair]  
  **Distribution:** All Committee Members, Office of Research Ethics, PI of Drosophila Protocol, Engineering Lead for Climate Controller
