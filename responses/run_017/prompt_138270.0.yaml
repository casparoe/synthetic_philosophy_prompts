prompt: |-
  I'm in the lower sixth, and I'm writing my Extended Project on whether attachment to one's own country is a virtue or a vice. While reading and arguing about it over the past few months I've noticed a pattern in how people talk, and I can't work out whether it is a recognised phenomenon with an established name, or whether I'm inventing a spurious unity.

  It usually shows up like this. After a national sports victory, or at a Remembrance assembly, or when some long-dead figure from our own country is praised for a discovery, people slide very easily into "we": they say "we" achieved it, and they seem to feel a genuine, personal pride about it, even though they had no hand in it, would have opposed it at the time, and in some cases weren't born when it happened. But the moment the story is an unflattering one — the slave trade, the empire, some wartime atrocity — the very same people retreat to the strictest possible account of individual agency: they weren't there, they didn't do it, their family wasn't even in the country, and so no share of it attaches to them. What struck me most is that the boundary of the group itself seems to flex. A scientist born two centuries ago in the next city is "ours" when he is being celebrated, but a merchant from the same period who made his money from slavery is treated as belonging to a country that was somehow a different entity then. And it sometimes runs the other way as well: I have friends who are extremely critical of the country, who would never permit themselves a moment of patriotic pride, and who nevertheless insist that we owe apologies or reparations for historical wrongs — so they seem to accept a share in the guilt while refusing the share in the credit.

  I don't think what I'm describing is just the ordinary business of people taking credit for their own successes and blaming circumstances for their own failures, since none of this is about anybody's own actions at all, and each individual move seems perfectly defensible in isolation — it does sound strange to say you feel guilty about something done in 1830. I'm also not sure it is simply a fallacy to be exposed, because there may be a principled story on which a community can be a source of pride without being a source of responsibility, or vice versa. I'd be grateful if you could tell me whether this pattern — the asymmetry, and the way the group's edges stretch for credit and shrink for blame — has an established name in philosophy or in social psychology; if the nearest concepts only fit it partly, which ones they are, how my case differs from each, and which comes closest; whether what I've described is really one phenomenon or two or three that I've wrongly lumped together; and whether there is a defensible version of the move rather than only a defective one. I'm after the carving rather than a label, so please don't just hand me a term. Please write your answer in British English.
reasoning: |-
  Okay, the user is working on their Extended Project about whether national attachment is a virtue or vice. They've noticed a pattern where people use "we" for national achievements but distance themselves from historical wrongs. They want to know if this has a name in philosophy or social psychology, and whether it's one phenomenon or several. They also ask if there's a defensible version of this asymmetry.

  First, I need to recall relevant concepts. The selective use of "we" for pride but not guilt sounds like collective narcissism or in-group bias. But they mentioned the group boundaries shifting—expanding for credit and contracting for blame. That might relate to "boundary elasticity" in social identity theory. 

  Then there's the part where critics accept guilt but reject pride. That's interesting. It might be linked to moral responsibility versus pride. Maybe "asymmetric group identification"? But I should check if there's an established term. I remember "moral luck" by Bernard Williams, but that's more about individual actions. Collective moral luck could be part of it, but not the whole picture.

  The user also wants to know if this is one phenomenon or several. The shifting boundaries and the asymmetric identification (pride vs. guilt) might be two separate mechanisms under a broader umbrella of national identity management. 

  For defensible versions, theorists like David Miller argue that pride can be about shared identity without direct causation, while responsibility might require current structures benefiting from past injustices. But critics might emphasize moral continuity for accountability. The user needs a balanced view for their project, so highlighting both sides is key.

  I should also address the user's deeper needs. They might be looking for academic validation of their observation and frameworks to analyze it. They’re in lower sixth, so clarity is important. Using British English terms like "remembrance assembly" and "lower sixth" as per their request. 

  Putting it all together: the main concepts are asymmetric group identification and boundary elasticity. Explaining how these interrelate, and discussing defensible positions from Miller and others. Ensuring the answer is thorough but accessible, helping them carve the concepts properly for their project.
answer: |-
  What you've described is a profoundly insightful observation about the **asymmetric construction of national identity and responsibility**. While there isn't a single, universally agreed-upon term that captures *every* facet of this phenomenon in one go, several established concepts from philosophy, social psychology, and political theory illuminate different parts of it. Your observation holds together as a unified pattern of **strategic group identification**, though its mechanisms and defensibility can be parsed.

  Here's the carving, using British English:

  1.  **Core Phenomenon: Asymmetric Group Identification & Boundary Elasticity**
      *   **The Pattern:** The core phenomenon involves the *selective adoption or rejection* of membership in a national "we-group" depending on whether the historical event or action being considered is creditable or discreditable. Crucially, the *boundaries of the group itself* ("who counts as 'us'?") are flexibly redefined to facilitate this asymmetry.
      *   **Why it's One Coherent Phenomenon:** While the mechanisms for claiming credit and disclaiming blame can be analysed separately, they are two sides of the same coin: the *management of collective self-esteem and moral burden* through the strategic manipulation of group membership. The "flexing boundaries" are intrinsic to making this asymmetry work. People are engaging in **identity work** to maintain a positive national self-image.

  2.  **Key Contributing Concepts & How They Fit (and Differ):**
      *   **Collective Narcissism (Social Psychology):**
          *   **Fit:** Captures the *inflated* sense of self-importance derived from group membership ("*We* won the World Cup!", "*We* invented the steam engine!"). Explains the *pride* taken in others' achievements simply through shared identity. The asymmetry aligns with narcissistic tendencies to claim glory while avoiding shame.
          *   **Partial Fit/Difference:** Primarily focuses on the *positive, grandiose* side. While it implies avoidance of negative associations, it doesn't explicitly theorise the *active redefinition of group boundaries* or the *acceptance of negative association by critics* as part of the same dynamic. It's more about the *level* of attachment than its *selective application*.
      *   **In-Group Favouritism / Out-Group Derogation (Social Identity Theory - SIT):**
          *   **Fit:** SIT explains the fundamental drive to enhance self-esteem by valuing the groups we belong to (in-groups) more highly than others (out-groups). Claiming credit for past glories boosts in-group status. Distancing from past wrongs protects in-group image ("*They* did those awful things, not *us*").
          *   **Partial Fit/Difference:** SIT provides the *underlying motivational engine* (self-esteem maintenance). However, standard SIT often assumes relatively *stable* group boundaries. Your observation highlights the *dynamic, strategic manipulation* of those very boundaries ("Is this historical figure *really* part of *our* group *now*, given what they did?") as a specific tactic *within* this drive. It also doesn't fully account for critics who *accept* negative association.
      *   **Collective Responsibility & Moral Taint (Philosophy/Political Theory):**
          *   **Fit:** Directly addresses the core question: can a *present-day* collective (like a nation) be responsible for actions committed by *past* members? The phenomenon you describe is essentially a widespread, intuitive (and often unreflective) *rejection* of collective responsibility for blame, while simultaneously *embracing* it for credit. The concept of "moral taint" – feeling stained by association with wrongdoing – explains the *aversion* to the negative side.
          *   **Partial Fit/Difference:** Philosophical debates focus on *whether* such responsibility *should* be attributed, based on arguments about continuity, benefit, shared values, or political obligation. Your observation is about the *psychological and rhetorical behaviour* people exhibit *around* this complex question, often pre-empting the philosophical debate. The critics you mention *do* accept a form of collective responsibility/taint for blame.
      *   **Moral Luck (Philosophy - Bernard Williams, Thomas Nagel):**
          *   **Fit:** Moral luck explores how factors outside an individual's control (like consequences or circumstances) affect moral judgement. This resonates with the asymmetry: the *luck* of being born into a nation with a glorious past allows one to claim reflected glory without effort, while the *luck* of being born later allows one to avoid blame for its past sins. The "not my fault I wasn't born then" argument relies on this contingency.
          *   **Partial Fit/Difference:** Moral luck is traditionally applied to *individual* agents. Your phenomenon involves *collective* identity and the *assignment* of credit/blame to individuals *based* on their contingent group membership. It's a *societal* manifestation of how luck influences moral standing.
      *   **Boundary Work / Symbolic Boundaries (Sociology):**
          *   **Fit:** This explicitly addresses the *social construction of group boundaries* – who belongs, who doesn't, and what defines membership. Your observation perfectly illustrates how these boundaries are *actively worked on* ("boundary work") – stretched to *include* positive historical figures/events and shrunk to *exclude* negative ones. The criteria for membership (time, location, values) become flexible tools.
          *   **Partial Fit/Difference:** Boundary work is the broad *mechanism* for the identity management. Your phenomenon specifies the *asymmetric direction* (include good/exclude bad) and *context* (national historical narratives) of this work.

  3.  **The Closest Conceptual Fit:**
      The phenomenon is best understood as **Asymmetric National Identification** coupled with **Strategic Boundary Elasticity**.
      *   **Asymmetric National Identification:** The core behaviour of readily identifying with the nation for pride/credit while disidentifying for shame/blame.
      *   **Strategic Boundary Elasticity:** The mechanism enabling this asymmetry – the flexible redefinition of the national "in-group" across time and space depending on the valence (positive/negative) of the event/actor being considered.

      This formulation captures the unity of the pride/blame asymmetry *and* the boundary flexing as intrinsically linked parts of national identity management. It draws heavily on Social Identity Theory (motivation) and Boundary Work (mechanism), framed by the philosophical dilemmas of Collective Responsibility and Moral Luck.

  4.  **Is it Defensible? Arguments For and Against the Asymmetry:**
      Yes, *principled* defences exist, though they are contested:

      *   **Defence of Claiming Pride (While Denying Blame):**
          *   **Argument:** National pride can be based on *shared identity and values*, not direct causation or responsibility. Celebrating Newton honours shared intellectual heritage and values like curiosity and reason embedded (it's argued) in British culture. Conversely, responsibility for past wrongs requires *active complicity, ongoing benefit, or a failure to repudiate*. If the modern nation-state, its institutions, and dominant values are fundamentally distinct from those of the imperial past (e.g., embracing equality vs. racial hierarchy), and if tangible benefits are diffuse or outweighed, then direct responsibility *doesn't* transfer. The boundary shift reflects a genuine discontinuity. (Thinkers like David Miller offer nuanced defences of national identity along these lines).
          *   **Critique:** This risks being selective. Values are often contested and selectively interpreted. Did "British values" *cause* Newton's genius or merely coexist? Can a nation truly claim the glory of its past heroes while disavowing the sins of its past villains if both operated within the same historical-political entity? Continuities (institutions, wealth, global position derived from empire) are often downplayed.

      *   **Defence of Accepting Blame (While Denying Pride - your critical friends):**
          *   **Argument:** Nations are enduring political communities. Moral responsibility can arise from *inherited benefits* (wealth, infrastructure, global standing built partly on exploitation), *ongoing structures* (systemic inequalities with roots in the past), or a *duty to acknowledge* wrongs committed in the name of the continuing political entity ("the Crown", "the State"). Pride, however, requires *current alignment* with the *values* the achievement represents. If the critic believes the nation *still* embodies the negative values (e.g., systemic racism, imperialism, inequality) or fails to adequately address them, they cannot in good conscience take patriotic pride, even while acknowledging the debt stemming from the ongoing entity's past. The nation's boundary remains fixed, but its moral standing is mixed.
          *   **Critique:** This can seem overly negative, denying positive aspects of shared heritage and belonging. It can also be accused of anachronism, judging the past by current standards. The refusal of *any* pride might undermine the social cohesion that national identity can foster.

      *   **Defence of Symmetry (Either Both or Neither):**
          *   **Argument:** Nations are continuous entities across time. If you claim the achievements of past members as *yours* ("we invented..."), you logically inherit association with their failings ("we enslaved..."). Conversely, if you insist you bear no responsibility for past sins because you weren't there, you cannot logically claim credit for past glories. The boundary must be consistent. Responsibility/pride should be based on *acknowledging history*, *learning from it*, and *current actions* (e.g., celebrating *repudiation* of past wrongs, commemorating *both* sacrifice *and* loss caused), not on claiming vicarious glory or denying uncomfortable truths. (This is a common cosmopolitan or critical nationalist position).
          *   **Critique:** This can feel emotionally sterile, denying the powerful, often positive, role of shared identity and heritage. It might also impose an unrealistic burden of guilt on individuals.

  **Conclusion:**

  You've identified a real and significant pattern: **Asymmetric National Identification enabled by Strategic Boundary Elasticity.** It's not spurious. While no single term perfectly encapsulates it, the concepts of collective narcissism (for the pride side), in-group favouritism (the motive), collective responsibility (the philosophical core), moral luck (the contingency), and boundary work (the mechanism) all contribute pieces to the puzzle. Crucially, the *flexing of the group boundary itself* is integral to making the asymmetry work smoothly.

  Defensible versions exist, often centred on whether the link is based on *identity/heritage* (pride) vs. *causation/benefit/responsibility* (blame), or on arguments about the nation's *continuity* or *discontinuity* over time. However, the inconsistency in how the boundaries are applied *in practice* often reveals a self-serving bias, making the asymmetry feel like a form of national-level **cognitive dissonance management** – preserving a positive national self-image by selectively defining "who we are" and "what belongs to us".

  This asymmetry is absolutely central to debates about patriotism, nationalism, historical memory, and reparations. Your sharp observation cuts to the heart of the tensions inherent in belonging to a nation with a complex past. It's excellent material for your EPQ – you're grappling with fundamental questions of identity, responsibility, and collective narrative. Good luck!
