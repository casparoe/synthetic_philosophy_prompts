prompt: |-
  I write courtroom fiction, and I am trying to get something right that is not really a matter of dialogue or plot: the theory of emotion that my characters' legal world is quietly committed to. I would like your help reconstructing it, because I keep finding that the practices I am describing pull in different directions, and I cannot tell whether that is my own muddle or the doctrine's.

  Consider the cluster of practices I am working with. A killing done in the heat of passion is treated as a lesser offence than the same killing done deliberately, but only if the killer acted before there was time to cool off: he may have driven across town, bought a weapon, or waited several hours, and the mitigation fails on that basis alone, even if his rage is in no way diminished. The provocation must also be one that would have moved a reasonable person, and in some jurisdictions the question is put in explicitly evaluative terms, asking whether the deceased gave the defendant a justifiable sense of being seriously wronged. A history of small provocations culminating in a trivial final trigger is sometimes allowed in, so that the last straw counts although it could not have moved anyone by itself. Words alone have traditionally not been enough, though a blow is. Separately: remorse counts in a defendant's favour at sentencing, but an apology read out by counsel counts for almost nothing, and a defendant's bare assertion that he was terrified or grief-stricken is treated as nearly worthless unless it shows in what he did. Probation conditions routinely include anger-management courses, on the assumption that a disposition to anger is something a person can be made to work on and be held to account for failing to work on. And the same culture that runs these rules also gives a short window in which to cancel a contract signed at the kitchen table under a salesman's pressure, and imposes a pause before a strike may begin, on the reasoning that the agitation of the moment is temporary and that a night's reflection dissolves it.

  What I want from you is the implicit theory of emotion that this pattern presupposes, worked out rather than named. Which parts of it only make sense if an emotion is a bodily agitation or feeling that swells, decays with time, and is dispelled by deliberation? Which parts only make sense if an emotion is an appraisal or evaluative judgment that can be reasonable or unreasonable, well-grounded or not, and therefore something we can be answerable for? Which parts sit best with the view that emotions are perceptions of value or concern-based construals, apt or inapt in the way a perception is veridical or not? Be careful to distinguish what these practices strictly presuppose from what they merely fit comfortably with, and tell me where they are underdetermined, so that two or three rival theories would license exactly the same rules and my characters could reasonably disagree. Where the pattern seems to me inconsistent, say whether it really is: does the mitigation have to treat emotion as an involuntary storm that displaces agency, given that the same system trains offenders out of their anger, discounts unexpressed remorse, and asks juries to assess whether the passion was warranted?

  Then I want the counterfactual, because that is what my draft actually needs. Take each of the three families of theory in turn and tell me what would have to change in practice if it were the one the law adopted: which of the requirements above survives, which collapses as incoherent, and which would have to be replaced by something else. In particular, tell me what a cooling-off rule could even mean on a view where emotions carry content and can be more or less justified, and what a reasonable-person test could mean on a view where emotions are only felt disturbances.

  One last thing, which is where I have had to invent. My manuscript is set in a jurisdiction that does not exist, and I have given it a rule I have never seen anywhere: the mitigation is unavailable unless the jury finds that the defendant's anger was about the thing he says it was about, so that a man enraged at his own humiliation rather than at what was done to him, or a man who kills the wrong person in a transported fury, gets no reduction. I would like to know which theory of emotion that rule is secretly legislating, whether it is coherent on the terms of the theory that seems to motivate it, and what the cross-examination of such a defendant would sound like under each of the three views. Reason it out from the concepts; I do not need authorities, names, or further reading, and I would rather have your argument than a survey of the literature.
reasoning: |-
  Okay, the user writes courtroom fiction and is trying to nail down the implicit theory of emotion underlying legal practices like heat-of-passion manslaughter, remorse in sentencing, and cooling-off periods. They've noticed tensions in how the law treats emotion—sometimes as uncontrollable storms, sometimes as accountable judgments—and wants to reconstruct the unstated framework. 

  Hmm, their examples are sharp: why does a killer get less time if he stabs immediately but not if he drives across town first? Why does remorse count only if it's visible? And they've invented a rule where anger must be "about the right thing" for mitigation—that’s intriguing. They need this for world-building, so precision matters. 

  First, I should map the contradictions. The law wobbles between seeing emotion as physiology (raging blood, cooling time) and cognition (reasonable provocation, justified anger). The cooling-off rule screams "emotion is a tempest," but the reasonable-person test whispers "it’s a moral verdict." And their invented rule? That’s pure cognitive appraisal—anger must track the real wrong. 

  For the counterfactuals: if emotions are *only* felt disturbances (Theory 1), the reasonable-person test collapses. How can a stomach ache be "reasonable"? Cooling-off stays, but remorse would need physiological proof—sweat, tears, pulse. If emotions are *only* judgments (Theory 2), cooling-off makes no sense; deliberation doesn’t dissolve a moral conclusion. Mitigation hinges entirely on whether the appraisal was correct, not timing. 

  Their invented rule fits Theory 2 best—anger must be object-accurate. Under Theory 1, cross-examining would grill the defendant: "Was your pulse racing? Did you vomit?" Under Theory 3 (emotions as perceptions), it’d be about whether the humiliation *felt* like an injustice, even if misplaced. 

  The real law’s messiness? It’s not the user’s muddle—it’s doctrine’s. The system *wants* emotion to be both storm and judgment when convenient. For fiction, they can lean into that tension: have judges argue whether cooling-off is about blood or ethics. Their invented rule? It’s coherent only if anger is a cognitive act. A cross-exam like "Why did you *think* he deserved death?" would expose that. 

  ...Wait, did I miss something? They mentioned probation forcing anger management—that implies emotion is malleable, not just biology. So Theory 1 alone fails. And the "last straw" doctrine? That’s Theory 3: accumulated wrongs alter perception. 

  Got it. The user’s draft needs the counterfactuals crystal clear. For Theory 2, cooling-off isn’t about time—it’s about confirming the judgment holds. For Theory 1, "reasonable provocation" becomes nonsense. Their jurisdiction’s special rule? It’s a stealthy vote for cognition. Cross-exams would dissect beliefs, not heart rates. 

  Perfect. Time to structure this: first dissect the implicit theory, then blow it up per framework, then tackle their invented rule. They want logic, not citations. No fluff.
answer: |-
  Here's a reconstruction of the implicit theory of emotion within your legal system, followed by the counterfactuals and analysis of your invented rule:

  **The Implicit Theory: A Pragmatic Hybrid**

  The legal practices you describe presuppose a **dual-nature theory of emotion**, treating it as both:

  1.  **Physiological Agitation (Storm):** A temporary, overwhelming, involuntary bodily state that displaces rational agency, decays over time, and is dispelled by deliberate reflection. This justifies the *cooling-off period*, the skepticism towards bare assertions of emotion (without behavioral signs), the short window for contract rescission, and the strike pause.
  2.  **Evaluative Judgment (Appraisal):** A perception or assessment of a situation concerning one's values or well-being, which can be reasonable or unreasonable, justified or unjustified. This justifies the *reasonable person standard*, the *justifiable sense of being wronged*, the requirement for an objectively serious provocation (like a blow over mere words), the *last straw doctrine* (as evidence of cumulative wrongs), the accountability for anger management (judging the disposition/response), and the discounting of unexpressed remorse (judging sincerity and depth of the evaluative shift).

  **Where Practices Pull & What They Strictly Presuppose:**

  *   **Cooling-off & Reasonableness:** Strictly presuppose the **Storm aspect** for the cooling-off rule (time = dissipation of physiological state). Strictly presuppose the **Appraisal aspect** for the reasonableness test (judging the *cause* of the storm). The tension arises because the law uses the *passage of time* as a proxy for the *return of rational agency/judgment*, even if the feeling remains.
  *   **Provocation (Blow vs. Words, Last Straw):** Strictly presuppose the **Appraisal aspect**. Words alone are deemed insufficient *provocation* because the law judges they shouldn't provoke a *reasonable* person to lethal violence. A blow is an objective wrong. The last straw works because it reveals the cumulative weight of appraisals, making the final trigger subjectively significant despite being objectively minor.
  *   **Remorse:** Strictly presupposes the **Appraisal aspect** (genuine remorse signals a revised negative evaluation of one's own *action/judgment*). It presupposes the **Storm aspect** only indirectly: unexpressed remorse is suspect because genuine emotional states (like deep regret) are expected to manifest behaviorally/somatically. The *bare assertion* discount emphasizes needing evidence beyond the claim of feeling.
  *   **Anger Management:** Strictly presupposes the **Appraisal aspect**. It treats anger proneness as a *disposition to make certain negative appraisals* (e.g., perceiving threats or slights too readily or intensely) and/or a disposition to *act* on anger based on those appraisals. This disposition is seen as malleable through cognitive-behavioral work, making the individual accountable for managing their *judgments* and *responses*.
  *   **Contract Rescission/Strike Pause:** Strictly presuppose the **Storm aspect**. Agitation impairs judgment; time allows the storm to pass so rational appraisal can occur.

  **Is it Inconsistent?**
  No, it's **pragmatically coherent but conceptually strained**. The mitigation *does* treat the *intense emotional state* as temporarily displacing rational agency (Storm), hence the reduction. However, the law *also* holds individuals accountable for:
  *   The *dispositions* that lead to such states (anger management).
  *   The *reasonableness* of the appraisal that *caused* the state (provocation test).
  *   The *sincerity and depth* of the appraisal *after* the state (remorse).
  The system doesn't absolve the person for *having* the emotion; it reduces culpability for the *act committed while overwhelmed by it*, provided the trigger was sufficiently wrongful. The accountability for dispositions and appraisals (before and after) fits with viewing emotions as partly constituted by judgments we are responsible for cultivating.

  **Underdetermined Areas (Room for Character Disagreement):**
  *   **The Nature of "Cooling":** Does time literally dissipate the feeling (Storm), or does it allow for reappraisal (Appraisal)? Characters could debate this.
  *   **"Reasonable Person" Feeling:** Does the test demand a reasonable person *would feel* rage (blending Storm & Appraisal), or just that a reasonable person *would judge* it a grave wrong (pure Appraisal), allowing for individual variation in emotional response?
  *   **Remorse Manifestation:** How much behavioral evidence is required? Is stoicism incompatible with deep remorse? (Highlights the Storm expectation vs. Appraisal focus).
  *   **Last Straw:** Is it about the cumulative *wrongdoing* (Appraisal) or the cumulative *stress* weakening control (Storm)?

  ---

  **Counterfactuals: What Changes if One Theory Dominates?**

  **1. Theory Adopted: Emotion = Bodily Agitation/Feeling (Pure Storm)**
  *   **Survives:** Cooling-off period (core principle), contract rescission/strike pause, skepticism towards bare assertions of emotion (needs physiological evidence - flushed, trembling, witness accounts of agitation).
  *   **Collapses/Changes:**
      *   **Reasonable Person Provocation Test:** Becomes incoherent. How can a physiological disturbance be "reasonable"? Provocation would focus *only* on whether the stimulus was *sufficiently intense* to *cause* the storm in *this* defendant (medical/psychological evidence of susceptibility), not whether it *should* have. "Justifiable sense of wronged" evaporates. Words vs. Blow distinction weakens – if words cause an identical physiological storm in this person, why discount them?
      *   **Last Straw Doctrine:** Shifts focus. It becomes evidence of cumulative *stress* sensitizing the defendant to the final trigger, making the storm more likely/volatile, not about cumulative wrongs.
      *   **Remorse:** Only observable physiological/behavioral signs matter (tears, posture, voice breaking). The *content* of the appraisal (guilt, understanding wrong) becomes irrelevant unless it causes observable distress. An apology's *delivery* (shaking voice) might count more than its words.
      *   **Anger Management:** Collapses. If anger is just an involuntary storm, how can one be held responsible for "managing" it? Training might focus purely on suppressing *outward signs* (behavioral control) or sedation, not cognitive reappraisal.
  *   **Cooling-off Rule Meaning:** Strictly physiological. "Cooling off" means the measurable physiological arousal (heart rate, adrenaline, etc.) has returned to baseline. Time is a direct proxy for this dissipation. Deliberation's role is irrelevant unless it demonstrably calms the body.
  *   **Reasonable-Person Test Meaning:** Effectively meaningless. Replaced by an "extreme physiological susceptibility" test for the defendant.

  **2. Theory Adopted: Emotion = Evaluative Judgment (Pure Appraisal)**
  *   **Survives:** Reasonable person provocation test (core principle), "justifiable sense of wronged," words vs. blow distinction (as objective wrongs), last straw doctrine (cumulative wrongs), remorse (as revised negative judgment of one's act), anger management (training judgment/reappraisal).
  *   **Collapses/Changes:**
      *   **Cooling-off Period:** Collapses as incoherent. Why would *time* mitigate culpability if the *judgment* ("this person deserves death") remains the same? Mitigation would depend *only* on the *reasonableness* of the judgment *at the moment of action*. If the judgment was reasonable (extreme wrong), why reduce the charge? If unreasonable, why mitigate? The "heat" becomes irrelevant.
      *   **Contract Rescission/Strike Pause:** Lose their rationale. If emotion is judgment, pressure just means you made a judgment under suboptimal conditions. Rescission would require proving the judgment was *substantively* flawed/mistaken due to the pressure, not just that pressure existed. No automatic time window.
      *   **Skepticism of Bare Assertions:** Shifts focus. The *content* and *logic* of the defendant's claimed appraisal ("I judged him a mortal threat") is scrutinized for reasonableness/consistency, not whether they *felt* agitated. Behavioral evidence matters only to corroborate the *content* of the judgment (e.g., defensive actions support a fear judgment).
  *   **Cooling-off Rule Meaning:** Could only mean time allowing for *reappraisal* or *confirmation* of the initial judgment. Did the defendant, upon reflection, *persist* in the lethal judgment? If yes, it's murder. If they quickly realized the judgment was excessive/wrong, mitigation might apply based on the *initial reasonableness* of the appraisal under provocation. "Cooling off" = "rethinking".
  *   **Reasonable-Person Test Meaning:** Central and clear. It directly assesses whether the *judgment* formed by the defendant (e.g., "this is an intolerable wrong requiring lethal force") was one a reasonable person *could* form in those circumstances. The feeling is irrelevant.

  **3. Theory Adopted: Emotion = Perception of Value/Concern-Based Construal (Perceptual)**
  *   **Survives:** Reasonable person test (as assessing the *aptness* of the construal), "justifiable sense of wronged" (fitting the construal), last straw (cumulative wrongs shaping the construal), remorse (as a revised, hopefully more apt, construal of the act), anger management (training to make more apt construals).
  *   **Collapses/Changes:**
      *   **Cooling-off Period:** Similar strain as with Appraisal. Time itself doesn't negate the aptness/inaptness of the initial perception. Mitigation would depend *only* on the aptness of the construal *in the moment*. However, time *could* allow for a clearer, less "blinkered" perception to emerge, potentially showing the initial construal was inapt due to the agitation.
      *   **Skepticism of Bare Assertions:** Focuses on the *object* and *fit*. Does the claimed construal (e.g., "I saw utter contempt in his look") *fit* the objective facts better than alternative construals? Behavioral evidence matters as data points for the construal.
      *   **Words vs. Blow:** A blow is a clearer, more objective datum supporting a construal of serious aggression/harm than words, making the resultant anger perception more *apt*.
      *   **Contract Rescission/Strike Pause:** Similar to Appraisal theory. Pressure distorts perception. Rescission requires showing the perception of the contract's value was *inapt* due to pressure. Time allows for a more apt perception.
  *   **Cooling-off Rule Meaning:** Time allows the "heat" (which distorted perception like fog distorts sight) to clear, enabling a more *veridical* perception of the situation and the appropriateness of the violent response. "Cooling off" = "clearing of perceptual distortion".
  *   **Reasonable-Person Test Meaning:** Assesses whether the construal formed by the defendant (e.g., "this act constituted a devastating humiliation") was an *apt* or *reasonable* (veridical) perception of the situation given the facts, shared human concerns, and social norms. It judges the perception's accuracy, not just the feeling.

  ---

  **Your Invented Rule: Anger Must Be "About the Right Thing"**

  *   **Theory Legislated:** This rule most strongly aligns with the **Appraisal (Judgment) Theory**, and fits comfortably with the **Perceptual Theory**. It demands that the *object* and *content* of the emotional appraisal/perception be accurate. Anger must track the actual provocation and target the actual wrongdoer. It treats the emotion's *intentional object* and *evaluative content* as central to the mitigation's justification.
  *   **Coherence:** It is **coherent** within the Appraisal/Perceptual framework motivating it. Mitigation is granted because the defendant's rational agency was overcome by a *justified* appraisal/perception of a grave wrong *done by the victim*. If the appraisal/perception was *inaccurate* (wrong object, wrong reason), the justification for the mitigation evaporates. The anger, while intense, wasn't a *warranted* response to *this* act by *this* person, even if subjectively felt. It might be misdirected rage or displaced emotion.
  *   **Incoherence with Storm Theory:** On a pure Storm view, this rule makes little sense. If mitigation is for being overwhelmed by physiological agitation, why does it matter *why* or *at whom* the storm was directed? The loss of control is the key factor.

  **Cross-Examination Under Each Theory:**

  1.  **Storm Theory (Agitation Focus):**
      *   "Describe the physical sensations you felt when you saw [the Victim]."
      *   "Did your vision blur? Was your heart pounding? Were you trembling?"
      *   "How long after [the Trigger] did you strike? Seconds? Minutes?" (Trying to establish immediacy, lack of control).
      *   "You were angry, correct? Just a raw, overwhelming feeling?" (Downplaying the *reason* for anger).
      *   **Defense Focus:** Emphasizing intensity, immediacy, physiological signs of loss of control, regardless of the specific target or reason. "He was just a blur of rage, Your Honor."

  2.  **Appraisal Theory (Judgment Focus):**
      *   "What, *exactly*, did you believe [the Victim] had done to deserve death?"
      *   "You claim you were angry about [Specific Provocation X], but isn't it true you were actually furious about [Unrelated Humiliation Y] that happened earlier?"
      *   "Why did you believe killing [Wrong Person B] was an appropriate response to what [Person A] did?"
      *   "Did you truly *judge* that [the Victim's action] warranted lethal force, or were you just lashing out blindly?"
      *   "If you were focused on the wrong done to you, why attack the wrong person?"
      *   **Defense Focus:** Precisely articulating the specific wrongful act by the victim that formed the lethal judgment. Demonstrating the logical (if extreme) link between that specific wrong and the violent response. "He judged, in that moment of profound betrayal, that lethal force was the only answer to the violation."

  3.  **Perceptual Theory (Construal Focus):**
      *   "What did you *see* in [the Victim's] actions that night? What meaning did you attach to it?"
      *   "You perceived [Victim's minor act] as a 'final humiliation', but how does that perception fit with his generally respectful behavior?"
      *   "Why did you perceive [Wrong Person B] as responsible for the wrong done by [Person A]? What about *him* made that perception seem apt?"
      *   "Was your perception of a 'devastating wrong' clouded by your pre-existing resentment over [Unrelated Humiliation Y]?"
      *   "Looking back now, calmly, do you still perceive [the Victim's action] as warranting death?"
      *   **Defense Focus:** Painting a vivid picture of the situation as the defendant *genuinely perceived* it in the moment, emphasizing how the victim's actions *construed as* an intolerable assault on core values or safety, making the anger an apt response *to that perception*. "In that instant, she *saw* not just a push, but the culmination of years of calculated degradation."

  This invented rule creates rich ground for cross-examination, forcing the defendant to justify the *content* and *direction* of their anger, directly serving the Appraisal/Perceptual logic behind it. It shifts the focus from the mere *fact* of rage to the *reason* for it and its *target*.
