  - (a) → Q1, Q2  
  - (b) → Q1, Q2, Q4  
  - (c) → Q1, Q3  
  - (d) → Q4  
  - (e) → Q1, Q2, Q5  
  - (f) → Q8  
  - (g) → Q5
