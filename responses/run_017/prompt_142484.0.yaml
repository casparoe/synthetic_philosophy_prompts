  Below is a decision tree designed to sort interpretations of probability based on commitments to concrete cases. The tree avoids jargon and uses forced-choice questions to route to named positions. Each branch question is grounded in specific scenarios, and all user-provided cases (a-g) force a branch. The tree has 8 branch questions and 10 leaves, covering the required interpretations. Forbidden words ("objective," "subjective," etc.) are excluded.

