    - Q2: No (not factive).  
    - Q5: No (allows disagreement).  
    - Q7: Yes (confidence without decision ties).  
    → **Leaf: Coherence-only subjectivism**.  

  ---

  ### **(ii) Indistinguishable Leaves & Separator Case**
  - **Objective chance (propensity/dualism) vs. Classical/logical indifference**  
    - **What separates them?** Propensity/dualism denies indifference can solve the cube problem; classical view affirms it.  
    - **Further case to separate**:  
      - *Ask: "In the cube problem, does the factory’s physical process determine the probability, or can we ignore it and use symmetry?"*  
      - Propensity/dualism: Physical process matters (no probability if unknown).  
      - Classical: Symmetry alone suffices (probability = 1/2 for side < 1.5 cm).  

  - **Long-run propensity vs. Hypothetical frequentism**  
    - **What separates them?** Both allow hypothetical trials, but propensity grounds probability in physical setups.  
    - **Further case to separate**:  
      - *Ask: "If two setups have identical long-run frequencies but different physical structures (e.g., fair coin vs. weighted coin mimicking fairness), do they have the same probability?"*  
      - Long-run propensity: No (probabilities differ due to physical differences).  
      - Hypothetical frequentism: Yes (probabilities are defined by frequencies alone).  

  ---

  ### **(iii) Unoccupied Cells in Logical Space**  
  The tree’s cuts: (1) Applicable to single events? (2) Fact beyond evidence? (3) Indifference works? (4) Agents must agree? (5) Defined via preferences? (6) Long-run basis.  
  Unoccupied combinations:  

  | Cell | Reason for Vacancy |  
  |------|-------------------|  
  | **"No" to single events (Q1) + "Yes" to next-trial without data (Q3) + "B" in Q6 (physical setup) + "Yes" in Q8 (severity)** | Incoherent: Severity (Q8) requires long-run frequencies (Q6A), not physical setups (Q6B). |  
  | **"Yes" to single events (Q1) + "No" to fact beyond evidence (Q2) + "Yes" to agreement (Q5) + "No" to coherence-alone (Q7)** | Unattractive: Evidentially constrained probabilities (Q5) are typically defined as coherent degrees of belief (Q7=Yes), not derived from preferences. |  
  | **"Yes" to indifference (Q4) + "No" to agreement (Q5)** | Undefended: Classical/logical views (Q4=Yes) imply unique rational probabilities (so Q5=Yes); no modern defense of indifference + subjective disagreement. |  
  | **"No" to single events (Q1) + "No" to next-trial without data (Q3) + "Yes" in Q8 (severity)** | Undefended: Finite frequentism (Q3=No) rejects probabilities without data, but severity (Q8) requires hypothetical long runs. |  

