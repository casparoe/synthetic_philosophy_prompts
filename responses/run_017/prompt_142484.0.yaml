  ### **Decision Tree for Interpretations of Probability**

  **Q1.** Can probability apply to a **single, unrepeatable event** (e.g., the decay of one specific atom in a one-time experiment)?  
  - **Yes** → Go to Q2.  
  - **No** → Go to Q3.  

  **Q2.** For that single event, is the probability a **fact independent of human knowledge** (e.g., even if no one observes the atom’s decay, does it have a definite probability)?  
  - **Yes** → Go to Q4.  
  - **No** → Go to Q5.  

  **Q3.** For a **repeatable setup** (e.g., a mint producing coins), when no trials have been run, can you assign a probability to the next outcome (e.g., heads on the first toss of a new coin)?  
  - **Yes** → Go to Q6.  
  - **No** → **Leaf: Finite frequentism**.  

  **Q4.** In the **cube problem** (side length 1–2 cm; event = side < 1.5 cm), can you assign a unique probability using **symmetry/indifference** (e.g., assuming equal likelihood for equal length intervals)?  
  - **Yes** → **Leaf: Classical/logical indifference**.  
  - **No** → **Leaf: Objective chance (single-case propensity or chance-credence dualism)**.  

  **Q5.** If **two agents share identical evidence**, must they assign the **same probability** to an event (e.g., next year’s recession)?  
  - **Yes** → **Leaf: Objective Bayesianism (evidentially constrained)**.  
  - **No** → Go to Q7.  

  **Q6.** What **makes the probability true** for the next trial (e.g., the first coin toss)?  
  - **A: The pattern of outcomes in a hypothetical long run** (e.g., "if we tossed infinitely many coins like this, half would land heads").  
  - **B: The physical setup** (e.g., "the mint’s machinery gives a tendency for heads").  
  - **A** → Go to Q8.  
  - **B** → **Leaf: Long-run propensity**.  

  **Q7.** Can probability be defined as **coherent confidence alone**, without ties to decisions or preferences?  
  - **Yes** → **Leaf: Coherence-only subjectivism**.  
  - **No** → **Leaf: Decision-theoretic derivation (preferences to probability)**.  

  **Q8.** In **statistical testing**, does a **p-value** (e.g., 0.03) primarily describe **how well-tested the hypothesis is** (e.g., "the test was severe"), not just error rates?  
  - **Yes** → **Leaf: Error-statistical (severity) frequentism**.  
  - **No** → **Leaf: Hypothetical frequentism**.  

  **Leaf: Pluralism** (if Q0 = No)  
  *(For context-dependent answers: "Probability means different things in different cases.")*  

