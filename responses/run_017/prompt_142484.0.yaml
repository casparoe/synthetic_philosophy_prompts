  ### **Leaves and Their Most Awkward Commitments**
  1. **Finite frequentism**: Probability = actual frequency in finite trials.  
     *Awkward: No probabilities for events without historical data (e.g., new coins).*  
  2. **Hypothetical frequentism**: Probability = limiting frequency in infinite hypothetical trials.  
     *Awkward: Probabilities exist for imaginary worlds but not directly for real single events.*  
  3. **Long-run propensity**: Probability = physical tendency of setups to produce long-run frequencies.  
     *Awkward: A "tendency" with no empirical content beyond frequencies.*  
  4. **Classical/logical indifference**: Probability = symmetry over possibilities (equal ignorance → equal probability).  
     *Awkward: Yields contradictions (e.g., cube problem: P(side < 1.5) ≠ P(volume < 3.375)).*  
  5. **Objective chance (single-case propensity or chance-credence dualism)**: Probability = physical property of single events (e.g., atom decay).  
     *Awkward: No clear way to measure or verify single-case physical probabilities.*  
  6. **Coherence-only subjectivism**: Probability = internally consistent confidence (no further constraints).  
     *Awkward: Two rational agents can hold extreme, opposing views on the same evidence.*  
  7. **Decision-theoretic derivation**: Probability = constructed from rational preferences (e.g., betting behavior).  
     *Awkward: Probability depends on choices, not just beliefs (e.g., risk-aversion distorts probabilities).*  
  8. **Objective Bayesianism**: Probability = unique rational confidence given evidence.  
     *Awkward: Requires an unattainable "objective prior" for all agents.*  
  9. **Error-statistical (severity) frequentism**: Probability = reliability of procedures to detect errors.  
     *Awkward: Cannot assign probabilities to hypotheses (e.g., "P(H true) = 0.95" is meaningless).*  
  10. **Pluralism**: "Probability" has context-dependent meanings (e.g., physical vs. epistemic).  
      *Awkward: No unified account; risks equivocation in arguments.*  

