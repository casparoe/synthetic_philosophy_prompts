answer: |-
  ### Decision Tree: Mapping Karma's Logical Space Against Moral Desert and Luck

  **Tree Purpose:** To classify positions on karma based on core philosophical commitments, testing each against moral luck problems and desert criteria. Students answer concrete questions to navigate the tree; labels emerge only at endpoints.

  ---

  **The Decision Tree**  
  *(Answer each question to proceed down one branch)*

  1.  **Node 1 (Mechanism):** When a person does something morally wrong but escapes all worldly consequences (e.g., a corrupt politician dies peacefully in their sleep), is any *necessary* negative effect *caused directly by the act itself* (like damage to their own character), or must it come *from outside* (like punishment from a cosmic force or future misfortune)?
      *   **A: Caused directly by the act itself (Internal Mechanism).** → Go to Node 2
      *   **B: Must come from outside the act (External Mechanism).** → Go to Node 3

  2.  **Node 2 (Persistence for Internal):** Does the 'damage' caused by the act (e.g., a corrupted character) *require a single, unchanging self* to carry it into the future (like a soul), or can it be passed on *through cause-and-effect* in a changing stream of experiences, even if there's no permanent 'owner'?
      *   **A: Requires a single, unchanging self (Persistent Subject).** → Go to Leaf 1
      *   **B: Cause-and-effect in a changing stream (Causal Stream, No Persistent Subject).** → Go to Leaf 2

  3.  **Node 3 (Agent for External):** Is the negative effect (punishment/misfortune) linked back to the original wrongdoer by *a single, unchanging self* (a soul) that persists, or only by *cause-and-effect* connecting events in a stream, even without a permanent 'I'?
      *   **A: Single, unchanging self (Persistent Subject).** → Go to Node 4
      *   **B: Cause-and-effect in a changing stream (Causal Stream, No Persistent Subject).** → Go to Node 5

  4.  **Node 4 (Purpose for External/Persistent):** Is the main point of the negative effect *to pay back* exactly what the wrongdoer deserves based *only on what they did in the past* (like settling a debt), or is it *to change them* for the better (e.g., teach a lesson, purify) or fix a cosmic imbalance?
      *   **A: Pay back based only on the past act (Backward-Looking Desert).** → Go to Node 6
      *   **B: Change the person or fix an imbalance (Forward-Looking Purpose).** → Go to Node 7

  5.  **Node 5 (Unit for External/Stream):** Does the negative effect (misfortune) fall *only on the individual being* who performed the act (or whose stream contains the cause), or can it *also fall on others* closely connected (like their family, community, or even nation)?
      *   **A: Only on the individual being (Individual Unit).** → Go to Leaf 3
      *   **B: Can also fall on others (Collective Unit).** → Go to Leaf 4

  6.  **Node 6 (Intention/Outcome for External/Persistent/Backward):** When judging the wrongness that 'deserves' payback, is the *intention behind the act* the key factor, or is the *actual outcome* the key factor (even if unintended), or must *both* align perfectly?
      *   **A: Intention is key (Intention Focus).** → Go to Leaf 5
      *   **B: Outcome is key (Outcome Focus).** → Go to Leaf 6
      *   **C: Both intention and outcome must align (Strict Alignment).** → Go to Leaf 7

  7.  **Node 7 (Birth as Payoff for External/Persistent/Forward):** Can the *circumstances of a person's birth* (e.g., being born into poverty, disability, or oppression) *itself* be the direct result/karmic payoff for morally significant actions done *before* that birth?
      *   **A: Yes, birth circumstances can be karmic payoff (Birth as Payoff).** → Go to Leaf 8
      *   **B: No, birth circumstances are not karmic payoff; payoff happens within life (Payoff Within Life).** → Go to Leaf 9

  ---

  **Leaves (Positions):**

  *   **Leaf 1 (Internal, Persistent Subject):** **Aristotelian/Character Ethic (Western) or Vedāntin view (Eastern).** Awkward Commitment: Suffering from bad character isn't 'deserved' punishment, just natural consequence – weakens retributive 'payback' element. **Desert Theory?** Borderline: Shifts towards virtue ethics/character development, not pure desert.
  *   **Leaf 2 (Internal, Causal Stream):** **Theravāda Buddhist view (e.g., Abhidhamma).** Awkward Commitment: No 'self' suffers the consequences, just a causally linked stream – challenges intuitive notions of personal desert and blame. **Desert Theory?** Effectively No: Becomes a natural law of moral causation focused on purification, not agent-centric desert.
  *   **Leaf 3 (External/Stream, Individual Unit):** **Unnamed (Logically possible Buddhist hybrid).** Awkward Commitment: Combining impersonal cosmic force with strict individualism within the causal stream is unstable; why wouldn't effects ripple? **Desert Theory?** Yes (if backward), but incoherent?
  *   **Leaf 4 (External/Stream, Collective Unit):** **Some interpretations of Chinese/Ancestral Karma or societal karma.** Awkward Commitment: Blames innocents (e.g., children) for ancestors' deeds, creating severe moral luck problems. **Desert Theory?** Problematic: Stretches 'desert' beyond the agent, undermining its core justification.
  *   **Leaf 5 (External/Persistent/Backward, Intention Focus):** **Some Jain views or Kantian-inspired interpretations.** Awkward Commitment: Pure intentions can lead to disastrous outcomes 'deserving' no negative payoff, seeming unjust. **Desert Theory?** Yes: Strongly backward-looking, agent-focused desert.
  *   **Leaf 6 (External/Persistent/Backward, Outcome Focus):** **Unnamed (Logically possible, resembles consequentialist 'desert').** Awkward Commitment: Punishes harshly for accidents or unforeseeable harm, ignoring intent – major moral luck problem. **Desert Theory?** Yes, but highly problematic.
  *   **Leaf 7 (External/Persistent/Backward, Strict Alignment):** **Classical Hindu (Mīmāṃsā) or some Jain views.** Awkward Commitment: Requires perfect cosmic bookkeeping for every intention-outcome pair, empirically implausible. **Desert Theory?** Yes: The 'purest' retributive desert view.
  *   **Leaf 8 (External/Persistent/Forward, Birth as Payoff):** **Mainstream Hindu (esp. Dharmashastric), Jain, Traditional Buddhist view.** Awkward Commitment: Justifies blaming sufferers (e.g., untouchables, disabled) for 'past sins', potentially endorsing social injustice. **Desert Theory?** Yes: Backward-looking desert *causes* birth state, payoff (suffering/opportunity) serves forward-looking purpose.
  *   **Leaf 9 (External/Persistent/Forward, Payoff Within Life):** **Some modern Hindu/Buddhist revisions or theistic karma (e.g., Sikh).** Awkward Commitment: Struggles to explain severe, lifelong suffering unrelated to actions within that life. **Desert Theory?** Mostly Yes: Retains backward-looking desert basis but aims payoff at reform/balance within a life.

  ---

  **Unoccupied Combinations & Why:**

  1.  **External Mechanism + Internal Mechanism:** Incoherent. An effect can't be *simultaneously* caused directly by the act itself *and* require an external source. (Node 1 forces a choice).
  2.  **External/Stream + Backward-Looking Purpose:** Largely unexplored/unattractive. An impersonal causal stream imposing 'payback' without a persisting self or clear purpose is incoherent (Why 'pay back' without a persistent debtor? Why impersonal 'debt'?). (Path: Node 3B → Needs Node 4 - but Node 4 only follows Node 3A).
  3.  **External/Persistent/Forward + Outcome Focus:** Merely unattractive/unexplored. Punishing based on outcomes for 'reform' ignores intent, making moral education/change arbitrary. (Path: Node 3A → Node 4B → Needs Node 6 - but Node 6 only follows Node 4A).
  4.  **External/Stream + Strict Alignment (Intention/Outcome):** Incoherent. An impersonal stream cannot meaningfully track *intention* (a subjective state) requiring alignment with outcomes. (Path: Node 3B → Node 5A → Needs Node 6 - but Node 6 only follows Node 4A, which follows Node 3A).

  **Indistinguishable Leaves:** The tree *cannot* separate:
  *   **Leaf 1 (Internal/Persistent)** from **Leaf 5 (External/Persistent/Backward/Intention)** on the basis of intention focus alone. Both *could* emphasise intention, but for different core reasons (one internal, one external). This distinction relies on the Mechanism node (1) chosen earlier.
  *   **Leaf 8 (Birth as Payoff)** and **Leaf 9 (Payoff Within Life)** share the same path until Node 7. Their difference is solely on the mechanism/timing of payoff for the forward-looking purpose, not on the core structure of desert or luck.

  ---

  **Running the Tree in a 90-Minute Seminar (Show-of-Hands):**

  1.  **Intro (10 mins):** Frame the session: "We're testing karma against moral luck and desert using a logic map. Answer based on your intuition about justice, not prior knowledge. Goal: See what structures make sense or solve problems."
  2.  **Navigate Major Branches (40 mins):** Use slides showing the tree one node at a time.
      *   **Start with Node 1 (Mechanism):** Crucial first split. Pose the corrupt politician case. **Expect Split:** Roughly 50/50 or slight lean to Internal (A) based on secular intuitions. Discuss briefly *why* – is 'cosmic justice' needed?
      *   **Split Group A (Internal) to Node 2 (Persistence):** "Can character damage exist without a fixed soul?" **Expect Split:** Significant lean towards B (Causal Stream) – modern intuitions favour no fixed self. Label Leaf 1 & 2.
      *   **Split Group B (External) to Node 3 (Persistence):** "For cosmic justice, do you need a soul?" **Expect Split:** Likely majority for A (Persistent Subject) – external justice feels personal. Discuss.
      *   **Split Group B/A (External/Persistent) to Node 4 (Purpose):** "Is cosmic payback about settling a debt or teaching a lesson?" **Expect Split:** Significant debate, likely split. Crucial for desert core. Send A (Backward) to Node 6, B (Forward) to Node 7.
  3.  **Navigate Sub-Branches (25 mins):**
      *   **Group at Node 6 (Intention/Outcome):** Pose case: "Driver A intends to murder, but victim survives. Driver B causes fatal crash by swerving to avoid a dog." Who 'deserves' cosmic payback more? **Expect Split:** Majority for A (Intention), significant B (Outcome), few C (Strict). Label Leaf 5,6,7.
      *   **Group at Node 7 (Birth as Payoff):** "Can being born into severe poverty be deserved punishment for a past life?" **Expect Split:** Overwhelming majority for B (No). Strong moral repugnance to A. Label Leaf 8 & 9.
      *   **Briefly address Group at Node 5 (Unit):** (From External/Stream path, smaller group). "Should a thief's child starve as cosmic payback?" **Expect Split:** Overwhelming majority for A (Individual). Label Leaf 3 & 4.
  4.  **Synthesis & Discussion (15 mins):** Show full tree with leaves labelled. Key discussion prompts:
      *   "Which leaves handle *moral luck* (e.g., outcome focus, birth state) the worst? The best?"
      *   "Which leaves are still clearly about *desert*? Which become something else (causation, education)?"
      *   "Compare the 'Birth as Payoff' (Leaf 8) solution to moral luck (explains birth circumstance) with its 'awkward commitment' (blaming sufferers). Is the cost too high?"
      *   "Does the 'Internal/Causal Stream' (Leaf 2) avoid moral luck problems entirely? Does it still deliver 'desert'?"
      *   Link back: "How does this compare to the retributivist views covered earlier? Does karma offer better/worse solutions to luck?"

  **Expected Dynamics:** Major splits at Node 1 (Internal/External), Node 4 (Backward/Forward Purpose), and Node 7 (Birth as Payoff). Node 6 (Intention/Outcome) will spark debate. The External/Persistent/Backward branch (especially Leaf 5,6,7) most resembles Western retributivism but faces similar luck problems. The Internal/Causal Stream (Leaf 2) and Forward-Looking (Leaf 9) positions will be seen as moving away from strict desert. The Birth as Payoff (Leaf 8) will be contentious, highlighting the tension between solving luck and justifying suffering. Focus discussion on this tension and the definition of 'desert'.
