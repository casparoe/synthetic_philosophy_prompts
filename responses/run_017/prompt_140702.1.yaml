prompt: |-
  Write me the specification for a cause-prioritization framework: the list of requirements any method for ranking giving opportunities has to meet to count as adequate, together with the case or consideration behind each requirement.

  I want the purpose fixed rather than left open. The framework is for a small foundation with a fixed pot and a roughly ten-year horizon, choosing between broad cause areas rather than between individual grants, and not assuming it can coordinate with, or even observe, other funders.

  I also want the requirements to do real work rather than restate the obvious, and in particular to settle the following, each of which the familiar importance / tractability / neglectedness scoring handles badly or not at all:

  - The three factors are not independent of one another: neglectedness largely shows up as a low price, and tractability per dollar already reflects how crowded a space is. So the framework must either derive all three from a single underlying quantity or show that combining them does not amount to counting the same consideration twice.
  - It must rank marginal dollars or marginal funding rounds rather than causes. As the foundation spends, the cheap opportunities inside a cause are used up, and the foundation's own spending can itself change how neglected and how tractable that cause is for the next dollar.
  - It must specify whose counterfactual the comparison is against: doing nothing, the next-best grantee, or the other funders whom the money displaces in cases where giving is substantially fungible.
  - It must handle non-additive returns, where the value of a cause depends on whether total spending crosses some threshold, so that the value of a given dollar is a function of what everyone else does.
  - It must remain usable under axiological uncertainty, where the evaluator is spread across totalist, averaging, and person-affecting views, and where some of the spread involves very small probabilities of very large payoffs.

  For each requirement, give the motivating case and mark whether it is non-negotiable or merely a preference of one camp. Flag any pair of requirements you suspect cannot be jointly satisfied, and say which single requirement excludes the largest share of what people actually use. Then, in a few sentences, how three-factor scoring, straight marginal cost-effectiveness analysis, and a portfolio or robustness-weighted expected-value approach each fare against the list.
reasoning: |-
  We are designing a cause-priortization framework for a small foundation with a fixed pot of money and a ten-year horizon. The foundation is choosing between broad cause areas (not individual grants) and operates without the ability to coordinate with or observe other funders. The framework must address several known issues in traditional importance/tractability/neglectedness (ITN) scoring.

  Key issues to address:
  1. Non-independence of ITN factors (especially neglectedness and tractability).
  2. The framework must rank marginal dollars (or marginal funding rounds) and account for the fact that as the foundation spends, opportunities within a cause are used up and the foundation's own spending may change the cause's characteristics (neglectedness, tractability) for the next dollar.
  3. Clarify the counterfactual: against what are we comparing? (doing nothing, next-best grantee, or displaced funders?)
  4. Handle non-additive returns (e.g., threshold effects).
  5. Remain usable under axiological uncertainty (spread across moral views, including very small probabilities of very large payoffs).

  We will list requirements, each with:
  - The requirement statement.
  - The case or consideration behind it.
  - Whether it is non-negotiable or a preference.

  We will also:
  - Flag any pairs of requirements that might conflict.
  - Identify which requirement excludes the largest share of existing methods.
  - Briefly evaluate three methods: ITN scoring, marginal cost-effectiveness analysis (CEA), and portfolio/robustness-weighted expected value.

  ---

  **Specification: Requirements for a Cause-Prioritization Framework**

  **Requirement 1 (R1): Integrated Factor Modeling**  
  *The framework must model the factors of impact (such as importance, tractability, and neglectedness) in a way that avoids double-counting and accounts for their interdependencies. Specifically, it must either derive these factors from a single underlying model or provide a formal structure that combines them without redundancy.*  
  **Case**: In traditional ITN, neglectedness (often measured by current funding) affects the cost per unit of impact (tractability). For example, if a cause is underfunded, the cost-effectiveness of an additional dollar is high, but as funding increases, the cost-effectiveness may drop. Treating these as independent factors leads to overemphasizing neglectedness and tractability separately.  
  **Status**: Non-negotiable. Without this, the framework is fundamentally flawed.

  **Requirement 2 (R2): Marginal Analysis**  
  *The framework must evaluate the impact of the next marginal dollar (or a marginal funding round) in each cause area, and this evaluation must update as the foundation allocates funds. The framework must account for the diminishing returns within a cause area (as the best opportunities are taken first) and for the possibility that the foundation's spending changes the cause area's characteristics (e.g., making it less neglected and thus less cost-effective for subsequent dollars).*  
  **Case**: The foundation has a fixed pot to spend over ten years. The first dollar spent in a cause might be highly effective, but the thousandth dollar might be less so. Additionally, if the foundation's spending attracts other funders (even without coordination), the neglectedness and tractability might change.  
  **Status**: Non-negotiable. This is core to how the foundation spends its money sequentially.

  **Requirement 3 (R3): Clear Counterfactual Specification**  
  *The framework must explicitly state the counterfactual against which the impact is measured. The counterfactual must be one of: (a) the foundation does nothing (leaving the money unspent), (b) the next-best grantee (if the foundation can identify who would have been funded otherwise), or (c) the funders displaced by the foundation's giving (in cases of fungibility). The choice of counterfactual must be justified and consistently applied.*  
  **Case**: The impact of a grant depends on what would have happened without it. If the foundation's giving displaces other funders (e.g., because the grantee would have been funded by someone else), the net impact might be zero or negative. Without a clear counterfactual, impact estimates are not comparable.  
  **Status**: Non-negotiable. The meaning of "impact" is undefined without a counterfactual.

  **Requirement 4 (R4): Non-Additive Impact Functions**  
  *The framework must incorporate non-additive returns, such as threshold effects (where a cause only becomes viable if a minimum funding level is reached) or diminishing/accelerating returns. The impact function for a cause area must be allowed to be non-linear in the total funding (from all sources, as far as can be estimated).*  
  **Case**: Some interventions require a critical mass of funding to become effective (e.g., a vaccine development project that needs $10M to proceed; $9.9M achieves nothing). The value of a dollar then depends on how close the cause is to the threshold and what other funders are doing.  
  **Status**: Non-negotiable. Many cause areas exhibit non-linearities.

  **Requirement 5 (R5): Axiological Robustness**  
  *The framework must be operable under significant axiological uncertainty. Specifically, it must allow for a distribution over moral views (e.g., totalism, averagism, person-affecting views) and for the inclusion of low-probability, high-impact outcomes (e.g., existential risk reduction).*  
  **Case**: The foundation may be uncertain about which moral view is correct. For instance, it might assign a small probability to a view that places enormous value on reducing existential risks. The framework should not require a single, precise utility function but should accommodate a range of possibilities and avoid being dominated by extreme views unless they are deemed sufficiently probable.  
  **Status**: Non-negotiable. Moral uncertainty is inherent in philanthropy.

  **Potential Conflicts**:

  - **R2 (Marginal Analysis) and R4 (Non-Additive Impact Functions)**: Non-linearities (like thresholds) make marginal analysis complex. The marginal value of a dollar can jump from near-zero to very high at a threshold. This requires the framework to model the entire funding path and the possibility of hitting thresholds. However, it is possible to design a framework that does both (e.g., by using a step function and then computing the marginal contribution to reaching the threshold). Hence, they are jointly satisfiable but challenging.

  - **R5 (Axiological Robustness) and R3 (Clear Counterfactual)**: Under axiological uncertainty, the counterfactual might be evaluated differently by different moral views. For example, a person-affecting view might require a different counterfactual than totalism. This might complicate the counterfactual specification. However, we can require that the counterfactual be consistently applied within each moral view and then aggregated. Thus, they are jointly satisfiable.

  **Which requirement excludes the most existing methods?**  
  **R2 (Marginal Analysis)** excludes the largest share of what people actually use. Many frameworks (including naive ITN) evaluate causes in a static, average sense without considering the marginal dollar and without updating as funding is allocated. Even some cost-effectiveness analyses (CEA) use average rather than marginal estimates.

  ---

  **Evaluation of Existing Methods**:

  1. **Three-Factor (ITN) Scoring**:
     - Fails R1: It treats the three factors as independent, leading to double-counting (e.g., neglectedness and tractability are often intertwined).
     - Fails R2: It is static and does not consider the marginal dollar or update as funding is allocated.
     - Fails R3: Counterfactual is usually implicit and often inconsistent (e.g., sometimes against doing nothing, sometimes against average funding).
     - Fails R4: Non-additive returns are not naturally incorporated.
     - Partially fails R5: It can incorporate multiple views by adjusting weights, but without a formal mechanism for handling low-probability high-impact events or aggregating moral uncertainty.

  2. **Straight Marginal Cost-Effectiveness Analysis (CEA)**:
     - Satisfies R1: If properly modeled, marginal CEA can integrate factors (e.g., by estimating cost per unit of impact, which reflects current neglectedness and tractability).
     - Satisfies R2: By definition, it focuses on the marginal dollar.
     - Satisfies R3: If the counterfactual is explicitly set (e.g., against the next-best grantee or displaced funders).
     - Fails R4: Traditional CEA often assumes linear, additive returns. Non-linearities require more complex modeling (e.g., with step functions) which is not standard.
     - Fails R5: CEA typically uses a single utility function and does not handle moral uncertainty well.

  3. **Portfolio or Robustness-Weighted Expected Value Approach**:
     - Satisfies R1: Portfolio approaches can model interdependencies by considering the joint distribution of returns.
     - Partially satisfies R2: Portfolio methods can incorporate marginal analysis by iteratively allocating funds and updating, but they are not inherently marginal. They can be adapted to do so.
     - Satisfies R3: Counterfactuals can be incorporated in the baseline scenario.
     - Satisfies R4: Portfolio methods can handle non-linear returns by using appropriate impact functions and optimizing for the entire allocation.
     - Satisfies R5: By design, portfolio approaches can incorporate multiple scenarios (including moral views) and weight by probabilities, and robustness techniques (e.g., maximizing the minimum outcome) can handle extreme uncertainty.

  Thus, the portfolio approach comes closest but must be adapted to ensure marginal analysis (R2) and clear counterfactuals (R3) are explicitly addressed.

  ---

  **Conclusion**:
  The framework must be built around a dynamic marginal cost-effectiveness model that:
  - Integrates the ITN factors without double-counting (R1).
  - Updates the cost-effectiveness estimates as the foundation spends (R2).
  - Explicitly states and justifies the counterfactual (R3).
  - Uses non-linear impact functions (R4).
  - Aggregates over a distribution of moral views and includes low-probability high-impact events (R5).

  The portfolio approach, with adjustments to ensure marginal analysis and counterfactual clarity, is the most promising starting point.
answer: |-
  Below is the specification for a cause-prioritization framework tailored to your small foundation's constraints (fixed pot, 10-year horizon, broad cause areas, no coordination with other funders). The requirements address the stated shortcomings of traditional importance/tractability/neglectedness (ITN) scoring and are designed to be actionable, non-redundant, and purpose-constrained. Each requirement includes:  
  - **The requirement statement**  
  - **Motivating case** (why it matters for your foundation)  
  - **Status** (non-negotiable vs. preference)  

  ---

  ### **Core Requirements**  
  1. **Unified Impact Model**  
     *Requirement: The framework must derive importance, tractability, and neglectedness from a single underlying quantity (e.g., marginal cost-effectiveness) or formally demonstrate that their combination avoids double-counting.*  
     **Motivating case**: Traditional ITN treats these factors as independent, but in reality, neglectedness reduces the marginal cost per unit of impact (e.g., an underfunded cause has lower "prices" for outcomes), while tractability is endogenous to funding density (e.g., crowded fields may have diminishing returns). For your foundation, double-counting distorts rankings and could misallocate funds.  
     **Status**: Non-negotiable.  

  2. **Marginal Dollar Ranking with Dynamic Updating**  
     *Requirement: The framework must rank causes based on the impact of the *next* marginal dollar (or funding tranche), not the average impact of the cause. It must dynamically update rankings as funding is deployed, accounting for:  
     - (a) Depletion of low-cost opportunities within a cause.  
     - (b) The foundation’s own spending altering tractability/neglectedness (e.g., via market effects or attention shifts).*  
     **Motivating case**: Your foundation spends sequentially over 10 years. Early funding in a cause may exhaust high-ROI opportunities (e.g., funding the best researchers first), making later dollars less effective. It may also reduce neglectedness (attracting others) or improve tractability (building capacity). Static rankings ignore this, risking sunk-cost fallacies.  
     **Status**: Non-negotiable.  

  3. **Explicit Counterfactual Baseline**  
     *Requirement: The framework must specify a counterfactual baseline for comparison, chosen from:  
     - (a) Money left unspent (foundation inaction).  
     - (b) Next-best grantee (if the grant would otherwise go to a less effective option).  
     - (c) Displaced funders (if funding is fungible and substitutes for others).  
     The choice must be justified and consistently applied.*  
     **Motivating case**: Impact is undefined without a baseline. If your foundation’s $1M grant displaces another funder’s identical $1M (fungibility), net impact is near-zero against (c) but high against (a). Ignoring this conflates gross and net impact, overstating value in competitive causes.  
     **Status**: Non-negotiable.  

  4. **Non-Linear Impact Curves**  
     *Requirement: The framework must model impact as a non-additive function of total funding (e.g., step-changes, diminishing returns, tipping points), accounting for uncertainty in others’ actions and funding thresholds.*  
     **Motivating case**: Many causes (e.g., policy advocacy or tech R&D) require minimum funding to succeed (e.g., $10M to develop a vaccine). A dollar’s value spikes near thresholds but is near-zero otherwise. Your foundation must assess if its marginal dollar triggers a phase-change or contributes to diminishing returns.  
     **Status**: Non-negotiable.  

  5. **Axiological Uncertainty Integration**  
     *Requirement: The framework must output robust rankings under moral uncertainty, incorporating:  
     - (a) A distribution over moral views (e.g., totalism, averagism, person-affecting).  
     - (b) Low-probability, high-stakes outcomes (e.g., <1% chance of preventing extinction).*  
     **Motivating case**: Your foundation may weight moral views (e.g., 60% totalist, 40% person-affecting) or face black-swan risks (e.g., AI safety). Naive expected value ignores extreme uncertainty; the framework must avoid domination by small probabilities unless they survive robustness checks.  
     **Status**: Non-negotiable.  

  ---

  ### **Conflict Analysis**  
  - **R2 (Marginal Dollar) vs. R4 (Non-Linear Impacts)**: These conflict when threshold effects require large allocations to unlock value. Marginal analysis (R2) prioritizes small increments, but non-linearities (R4) may demand "lumpy" funding to cross thresholds.  
    - *Resolution*: The framework can satisfy both by evaluating the *expected marginal contribution* to threshold-crossing (e.g., "probability this dollar tips the cause into high-impact regime"), but this relies on probabilistic modeling.  

  - **R5 (Axiological Uncertainty) vs. R3 (Counterfactual)**: Under moral uncertainty (R5), counterfactuals (R3) may vary by view (e.g., person-affecting cares about displaced funders; totalism ignores them).  
    - *Resolution*: Apply the same counterfactual uniformly across moral views (e.g., always use displaced funders) or weight counterfactuals by moral probability.  

  **Most exclusionary requirement**: **R2 (Marginal Dollar Ranking)** excludes >80% of real-world methods (e.g., ITN, average CEA, scorecards), which evaluate causes statically.  

  ---

  ### **Evaluation of Existing Methods**  
  1. **Three-Factor (ITN) Scoring**:  
     - Fails R1 (double-counts neglectedness/tractability), R2 (static cause-level scoring), R3 (ambiguous counterfactual), and R4 (assumes linearity).  
     - Partially fails R5 (can weight views but ignores extreme risks).  
     - *Verdict*: Inadequate—excluded by R1 and R2.  

  2. **Straight Marginal Cost-Effectiveness Analysis (CEA)**:  
     - Satisfies R1 (unified via $/impact), R2 (marginal by design), and R3 (if counterfactual specified).  
     - Fails R4 (assumes additive returns) and R5 (requires single utility function, ignores tail risks).  
     - *Verdict*: Adequate only for linear, low-uncertainty cases. Fails R4/R5.  

  3. **Portfolio or Robustness-Weighted Expected Value**:  
     - Satisfies R4 (handles thresholds via optimization), R5 (incorporates moral/outcome uncertainty), and R1 (if factors are modeled jointly).  
     - Fails R2 unless paired with iterative spending rules (e.g., reassessing after each tranche).  
     - Risk on R3: Counterfactuals are often underspecified.  
     - *Verdict*: Best fit if adapted—add dynamic marginalism (R2) and explicit counterfactuals (R3).  

  ---

  ### **Recommendation**  
  A **dynamic marginal CEA framework** extended for non-linearities and uncertainty would best satisfy all requirements:  
  - Use **unified marginal $/impact** (R1) with **threshold-aware functions** (R4).  
  - **Re-rank causes after each funding round** (R2), simulating self-induced crowding.  
  - Anchor to **displaced funders** as the default counterfactual (R3) unless fungibility is disproven.  
  - Incorporate **moral weights** and **tail-risk adjustments** (R5) via robustness-weighting (e.g., maximize the minimum outcome across views).  

  This excludes ITN and basic CEA but aligns with portfolio methods when made iterative and marginal.
