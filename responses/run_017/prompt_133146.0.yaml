prompt: |-
  hey — I need something like a spec review, except the spec is conceptual and I dont have the vocabulary for it. No philosophy background here (I know the words utilitarianism and Rawls and that's about where it ends), so gloss any jargon, and please don't send me to read anyone — I want the requirements, not the literature.

  Setup. I'm on the eng side of a system that splits a shared monthly budget across a few thousand users. Every user files a weekly self-report number, 0 to 10, for how things are going for them. The numbers are on each user's own scale: I have literally no idea whether Ana's 7 is better or worse than Ben's 3, and I suspect in the general case there's no fact of the matter recoverable from the reports alone.

  Two new-ish data sources, which is why this is coming up now:

  - The ML team shipped a "pair probe": we sample pairs of users, ask a third user who knows both well "who's worse off right now", and we get a noisy ordinal label. About 72% agreement with a held-out heuristic. It only works inside tight clusters of users who actually know each other, so there's no probe path between clusters.
  - We can, occasionally and expensively, run a "swap interview": ask one user whether they'd trade their next month for another user's next month, all things considered.

  Two known failure modes in the self-reports:

  - Some users are what user research calls "adapters": after a permanent bad event their number drops and then climbs back to roughly where it was within a few months. Others ("straight-liners"?) never come back up. I don't want the allocator to systematically defund the adapters just because their readout heals.
  - Users know a low number gets them more budget. Some shading is certain.

  I'm also told there's a distinction I should care about between lining up everyone's zero point (levels) versus lining up everyone's step size (units), and that a lot of the arguing happens there. Assume I know nothing about it.

  What I want from you: the requirements list. What does a method for putting these people onto one comparable scale have to get right to be good enough to actually move money with? For each requirement, give me the concrete case or failure it exists to prevent — ideally a case built out of the setup above, not a textbook one. In particular I want you to cover, at minimum: what to do when the probe can't reach across clusters; what an adapter vs a straight-liner does to the comparison; what happens when the very users you most need comparisons for (the adapters) are also the ones the probe is least reliable on; and what the allocator owes a user by way of explanation when it turns them down — our legal folks want a one-paragraph justification a user could read and not feel cheated by, and I don't know whether that's a real constraint on the theory or just a product preference.

  Then:
  - Mark each requirement non-negotiable vs. nice-to-have vs. "that's just one faction's taste".
  - Tell me which subset of requirements can't all hold together. If there's a genuine tradeoff, that's the most useful thing you can give me.
  - Tell me which single requirement excludes the most candidate methods, and why.

  Here are the candidate methods on the table, described the way they'd actually be built — give each one line against the list, plus the one requirement that hurts it most:

  (a) no cross-person comparison at all: only use each user's own ranking over time, pick splits by Pareto-ish improvements and otherwise something like a rotating dictator.
  (b) normalize onto one observable proxy instead of onto reported experience — money-equivalents, or the health-adjusted-life-year style units that health agencies use to rank treatments.
  (c) ask each user to rate other people's lives as if they didn't know whose life it was going to be, and use the average of those ratings as the common scale.
  (d) recover a full cardinal scale per user from the gambles they'll accept, then line the scales up somehow.
  (e) forget fine-grained scores, just sort everyone into a few coarse bands (fine / struggling / in trouble) and treat comparisons as valid only within a band.

  Last bit: given that this is a monthly, mostly reversible decision with real but limited money behind it — not a one-shot constitutional choice — which requirement should I relax first, and what specifically breaks when I do?
reasoning: |-
  We are given a problem of comparing self-reports (0-10) from different users on an incomparable scale, with two new data sources: pair-wise ordinal comparisons (pair probe) and occasional "swap interviews" (cardinal trade-off questions). We have two known failure modes: adapters (who report a temporary drop and then recover) and strategic shading (users under-report to get more budget). We also have the issue of clustering (no probe paths between clusters) and the distinction between levels (zero point) and units (step size).

  The goal is to produce a requirements list for a method that puts users on a common scale for budget allocation, with each requirement justified by a concrete failure case from the setup. We must cover: cross-cluster comparisons, adapter vs straight-liner, reliability of probes on adapters, and justification to users.

  Then:
  - Classify each requirement as non-negotiable, nice-to-have, or factional.
  - Identify conflicting requirements and trade-offs.
  - Identify the requirement that excludes the most methods.

  We also have candidate methods (a) to (e) and must give each one line against the requirements and the requirement that hurts it most.

  Finally, advise which requirement to relax first given the context (monthly, reversible, limited money).

  ---

  **Requirements List**

  1. **Requirement: Cross-Cluster Comparability**  
     *Description*: The method must allow for comparison and allocation across clusters of users that have no probe path between them.  
     *Failure Case*: Without this, we cannot allocate budget between two clusters. For example, if one cluster is entirely adapters and another is straight-liners, and we have no way to compare them, we might allocate all budget within clusters arbitrarily, leading to unfairness between clusters (e.g., one cluster gets more per capita because it has more straight-liners who report low, even though they might be better off than an adapter in another cluster).  
     *Classification*: Non-negotiable (because we must allocate across the entire population).

  2. **Requirement: Robustness to Adapters and Straight-liners**  
     *Description*: The method must not systematically disadvantage adapters (who recover after bad events) relative to straight-liners (who do not).  
     *Failure Case*: If we rely only on self-reports, adapters might get less budget because their numbers recover even though their underlying condition might be as bad as a straight-liner who reports a low number. This would be unfair and inefficient.  
     *Classification*: Non-negotiable (because it's a known failure mode and we want to avoid systematic bias).

  3. **Requirement: Incentive Compatibility (or at least Resistance to Strategic Shading)**  
     *Description*: The method should be resistant to users shading their reports downward to get more budget.  
     *Failure Case*: If users can easily manipulate the system by under-reporting, then the allocation becomes inefficient and unfair (honest users get less).  
     *Classification*: Non-negotiable (because shading is certain and could break the system).

  4. **Requirement: Reliability on Critical Subpopulations**  
     *Description*: The method must work reasonably well on the very users we are most concerned about (e.g., adapters) even if the probe is less reliable for them.  
     *Failure Case*: If the pair probe is less reliable for adapters (maybe because their behavior is harder for peers to judge) and we use that data naively, we might misallocate resources for them.  
     *Classification*: Non-negotiable (because adapters are a key group we must handle correctly).

  5. **Requirement: Actionable Justification**  
     *Description*: The allocator must be able to provide a one-paragraph justification to a user who is denied additional budget, in terms the user can understand and not feel cheated by.  
     *Failure Case*: Without this, we risk user dissatisfaction, loss of trust, and potential legal challenges.  
     *Classification*: Non-negotiable (due to legal and product requirements).

  6. **Requirement: Distinguish Levels and Units**  
     *Description*: The method must account for the fact that we might need to align the zero points (levels) and the step sizes (units) of the different scales.  
     *Failure Case*: If we align only levels but not units, then a one-point increase for a user with a small unit might represent a bigger improvement than for a user with a large unit, leading to misallocation.  
     *Classification*: Factional (because there is disagreement on how critical this is, and some methods might handle one but not the other).

  7. **Requirement: Scalability and Cost**  
     *Description*: The method should not require an excessive number of expensive swap interviews.  
     *Failure Case*: If the method requires too many swap interviews, it becomes too costly to run monthly.  
     *Classification*: Nice-to-have (but important given budget constraints).

  8. **Requirement: Use of Available Data**  
     *Description*: The method should make use of the available data (self-reports, pair probes, swap interviews) in a way that improves accuracy.  
     *Failure Case*: Ignoring any of these data sources might lead to less accurate comparisons.  
     *Classification*: Nice-to-have (but we have the data, so we should use it).

  **Conflicts and Trade-offs**

  - **Conflict 1**: Cross-Cluster Comparability vs. Scalability and Cost.  
    *Reason*: To compare across clusters, we might need to run many swap interviews (which are expensive) because the pair probes don't cross clusters. This is a trade-off: we can have comparability but at a high cost.

  - **Conflict 2**: Robustness to Adapters and Straight-liners vs. Reliability on Critical Subpopulations.  
    *Reason*: The probe might be less reliable on adapters, so methods that rely on the probe for these users might fail. But we need to be robust to their reporting patterns. We might have to use swap interviews for adapters, which is expensive.

  - **Conflict 3**: Actionable Justification vs. Complexity.  
    *Reason*: A method that is very complex (e.g., using ML on multiple data sources) might be hard to explain in a paragraph. Simpler methods might be easier to justify but less accurate.

  **Requirement that Excludes the Most Methods**

  - **Cross-Cluster Comparability** is likely the most excluding because many methods (like pair probes) are inherently local. Without a way to bridge clusters, methods (a), (b) if the proxy isn't comparable, (c) which requires within-cluster knowledge, (e) which requires within-band comparisons, might fail. Only methods that can use swap interviews to bridge clusters (like (d)) might work, but they are expensive.

  ---

  **Evaluation of Candidate Methods**

  (a) **No cross-person comparison**  
     *Summary*: Uses only within-user changes.  
     *Requirements*:  
       - Fails Cross-Cluster Comparability (non-negotiable) because it doesn't compare across users at all.  
       - May be robust to adapters if we look at the drop and then recovery (but note: we don't want to defund adapters because they recover? This method might not defund them if we focus on changes, but without cross-comparison, we don't know if the drop was severe).  
       - Incentive: Vulnerable to shading because users can always report a drop.  
       - Justification: Easy to explain ("we're giving to those who had the biggest drop").  
     *Most Damaging Requirement*: Cross-Cluster Comparability (non-negotiable).

  (b) **Normalize to a proxy (money-equivalent or HALY-like)**  
     *Summary*: Map reports to a common observable proxy.  
     *Requirements*:  
       - Cross-Cluster: If the proxy is comparable, then yes.  
       - Adapters: Might not capture the true experience if the proxy doesn't account for adaptation (e.g., an adapter might have the same health as a straight-liner but report differently).  
       - Incentive: If the proxy is verifiable (like income), shading might be harder.  
       - Reliability: Depends on the proxy. If the proxy is not well-correlated with the experience of adapters, then it fails.  
       - Justification: Easy ("we use your income level").  
     *Most Damaging Requirement*: Robustness to Adapters and Straight-liners (if the proxy doesn't capture the adaptation effect).

  (c) **Ask users to rate others' lives blindly**  
     *Summary*: Each user rates others' lives without knowing whose it is.  
     *Requirements*:  
       - Cross-Cluster: Only works within clusters because users don't know people in other clusters.  
       - Adapters: Might be rated more accurately by peers? But if peers are fooled by adaptation, then not.  
       - Incentive: Users might shade their ratings to help friends.  
       - Reliability: For adapters, peers might not be reliable.  
       - Justification: Hard to explain ("we averaged other people's ratings of your life").  
     *Most Damaging Requirement*: Cross-Cluster Comparability (non-negotiable).

  (d) **Recover cardinal scale from gambles**  
     *Summary*: Use swap interviews to get cardinal utility and then align scales.  
     *Requirements*:  
       - Cross-Cluster: Can bridge clusters because swap interviews can be done between any two users.  
       - Adapters: The gamble might reveal true preferences including adaptation.  
       - Incentive: The gamble question might be incentive-compatible if framed properly (they are trading their own next month).  
       - Reliability: We can run swap interviews on adapters to get direct data.  
       - Justification: Can be explained ("we asked if people would trade with others and used that").  
       - Cost: Requires many swap interviews (expensive).  
     *Most Damaging Requirement*: Scalability and Cost (if we need many interviews).

  (e) **Coarse banding**  
     *Summary*: Sort into bands and compare only within bands.  
     *Requirements*:  
       - Cross-Cluster: Only within bands, but bands must be comparable across clusters. How to assign bands? Without cross-cluster data, we can't.  
       - Adapters: If an adapter recovers and moves to a higher band, they get less budget, which is fair. But if a straight-liner stays in a low band, they get more, which is intended? But note: if an adapter is in a low band temporarily, they get help.  
       - Incentive: Users might try to stay in a lower band.  
       - Reliability: Bands might be noisy for adapters.  
       - Justification: Easy ("you are in the 'struggling' band, but we have many in that band and limited funds").  
     *Most Damaging Requirement*: Cross-Cluster Comparability (if we can't define bands across clusters).

  ---

  **Which Requirement to Relax First?**

  Given the context (monthly, reversible, limited money), we can relax **Scalability and Cost** (requirement 7) first. Specifically, we can run a limited number of swap interviews each month, focusing on the most critical comparisons (e.g., between clusters, or for users near allocation thresholds). 

  *What breaks*: We might not have enough data to make precise comparisons for all users, leading to more noise in allocations. But since the decision is reversible, we can adjust next month. We can also use statistical methods to impute missing comparisons. The system will be less accurate but still functional.

  Alternatively, if cost is a hard constraint, we might have to relax **Cross-Cluster Comparability** by allocating within clusters independently. But that would break fairness between clusters. Since the problem states we have to split the budget across all users, this might not be acceptable.

  Therefore, we relax **Scalability and Cost** and accept that we cannot run as many swap interviews as we would like, and thus have to use approximate methods for some comparisons.

  ---

  **Final Summary of Requirements with Classification**

  1. **Cross-Cluster Comparability**: Non-negotiable.  
  2. **Robustness to Adapters and Straight-liners**: Non-negotiable.  
  3. **Incentive Compatibility**: Non-negotiable.  
  4. **Reliability on Critical Subpopulations**: Non-negotiable.  
  5. **Actionable Justification**: Non-negotiable.  
  6. **Distinguish Levels and Units**: Factional.  
  7. **Scalability and Cost**: Nice-to-have.  
  8. **Use of Available Data**: Nice-to-have.
answer: |-
  Below is a requirements list for your budget allocation system, grounded in your setup and failure modes. Each requirement is defined by **what it must prevent**, with concrete examples drawn from your scenario. I then classify them, identify conflicts, highlight the most exclusionary requirement, evaluate your candidate methods, and advise on relaxation. The goal is to ensure the system is fair, practical, and resilient to your specific challenges.

  ---

  ### **Requirements List**  
  *Each requirement is justified by a concrete failure case from your setup. Focus areas (adapters, clusters, etc.) are covered.*

  1. **Cross-Cluster Comparability**  
     - **What it prevents**: Unfair allocation between isolated user clusters.  
     - **Failure case**: Cluster A (all adapters) has self-reports averaging 3/10 after a disaster, but they recover fully. Cluster B (all straight-liners) averages 5/10 due to chronic issues. Without cross-cluster comparison, Cluster A gets more budget during recovery but Cluster B is perpetually underfunded, even though B is objectively worse off long-term.  
     - **Classification**: Non-negotiable (budget is shared; no opt-out for clusters).

  2. **Adapter-Straightliner Neutrality**  
     - **What it prevents**: Systematically defunding adapters because their self-reports "recover."  
     - **Failure case**: Ana (adapter) and Ben (straight-liner) both start at 2/10 after identical injuries. Ana’s score rebounds to 8/10 in 3 months, Ben’s stays at 3/10. If allocation relies only on self-reports, Ana loses funding despite having the same underlying need as Ben.  
     - **Classification**: Non-negotiable (core failure mode you highlighted).

  3. **Incentive Resistance**  
     - **What it prevents**: Users gaming the system by shading self-reports low for more money.  
     - **Failure case**: Users realize a self-report of 2/10 guarantees +20% budget. Honest users (true 2/10) are crowded out by strategic users (true 6/10 but reporting 2/10), diverting funds from the neediest.  
     - **Classification**: Non-negotiable (shading is inevitable; breaks system integrity).

  4. **Critical-Group Reliability**  
     - **What it prevents**: Misallocating resources for adapters when the pair probe is least accurate for them.  
     - **Failure case**: Pair probes are 72% reliable overall but drop to 60% for adapters (peers misjudge their recovery). If probes heavily influence allocation, adapters get incorrect funding during recovery (e.g., deemed "better off" too soon).  
     - **Classification**: Non-negotiable (adapters are vulnerable and high-stakes).

  5. **Actionable Justification**  
     - **What it prevents**: User backlash/litigation when budget is denied.  
     - **Failure case**: A user at 4/10 is denied funds while another at 5/10 gets money. Without a clear, non-technical reason (e.g., "We prioritized users with deeper drops this month"), users feel cheated and quit the system.  
     - **Classification**: Non-negotiable (legal/product constraint; builds trust).

  6. **Levels-vs-Units Clarity**  
     - **What it prevents**: Misinterpreting gaps between users due to scale mismatches.  
     - **Failure case**: Ana’s "5→6" self-report improvement reflects a small gain (large units), while Ben’s "5→6" is a huge gain (small units). If units aren’t aligned, the system treats both gains equally, overfunding Ana and underfunding Ben.  
     - **Classification**: Factional (some theorists insist on levels/units distinction; others see it as academic).

  7. **Probe-Independent Fallback**  
     - **What it prevents**: Allocation paralysis when probes fail (e.g., no path between clusters or unreliable for adapters).  
     - **Failure case**: A new cluster has no probe data. Without a fallback, they get arbitrary funding (e.g., split equally), misallocating funds versus known clusters.  
     - **Classification**: Nice-to-have (avoids edge-case gridlock; not always relevant).

  ---

  ### **Conflicts and Tradeoffs**  
  - **Cross-Cluster Comparability vs. Critical-Group Reliability**:  
    Bridging clusters requires global data (e.g., swap interviews), but swap interviews are expensive and sparse. If you use them heavily for cross-cluster links, you may lack capacity to use them for adapter validation (where probes are weak).  
    - *Tradeoff*: Prioritize swap interviews for adapters to ensure reliability, but accept coarse/clunky cross-cluster comparisons (e.g., via proxy metrics).  

  - **Adapter-Straightliner Neutrality vs. Incentive Resistance**:  
    Protecting adapters often requires ignoring self-report "recovery," but self-reports are the only universal data. Over-indexing on alternatives (e.g., probes) may increase gaming risk if those are manipulable.  
    - *Tradeoff*: Use swap interviews to ground-truth adapter/straight-liner differences, but limit their use to avoid incentivizing users to misrepresent trade preferences.  

  - **Actionable Justification vs. All Other Requirements**:  
    Simple justifications ("We use peer comparisons") may obscure complex logic (e.g., levels/units adjustments), risking user trust. But over-explaining confuses users.  
    - *Tradeoff*: Favor transparency on a few key factors (e.g., "prioritized larger drops") and hide complexity elsewhere.  

  **Most exclusionary requirement**: **Cross-Cluster Comparability**.  
  - **Why**: It invalidates methods relying solely on local data (pair probes, within-user trends, or cluster-specific bands). Without it, 60% of your candidate methods fail outright. It forces expensive solutions (e.g., swap interviews) or risky proxies.

  ---

  ### **Candidate Method Evaluation**  
  *(One line per method + worst-hit requirement)*  

  | Method | Description                                      | Evaluation                                                                 | Worst-Hit Requirement                     |  
  |--------|--------------------------------------------------|----------------------------------------------------------------------------|-------------------------------------------|  
  | (a)    | No cross-person comparison; use only self-reports over time. | Fails cross-cluster comparability and adapter neutrality (e.g., adapters deprioritized as scores rebound). Incentive-resistant if gamed. Justification easy ("rewarded recent drops"). | Cross-Cluster Comparability (non-negotiable; no global view). |  
  | (b)    | Normalize to proxy (e.g., money-equivalents).    | May bridge clusters if proxy is global, but proxies often miss experience (e.g., an adapter’s "recovered" income ≠ their well-being). Incentive-resistant if proxy is objective. Justification moderate. | Adapter-Straightliner Neutrality (proxies ignore adaptation effects). |  
  | (c)    | Users rate others blindly.                       | Unreliable across clusters (raters don’t know outsiders). Probes may misjudge adapters. Incentive issues (users rate friends higher). Justification weak ("others rated you average"). | Critical-Group Reliability (probes unreliable for adapters). |  
  | (d)    | Cardinal scale from swap gambles.                | Best for cross-cluster and adapter neutrality (gambles reveal true preferences). Costly. Incentive-resistant if users answer honestly. Justification moderate. | Scalability (non-listed but implied; 1000s of users need 1000s of swaps). |  
  | (e)    | Coarse bands (fine/struggling/trouble).          | Fails cross-cluster (bands not comparable globally). Bands may hide adapter-straightliner differences (e.g., both in "struggling"). Incentive issues (users aim for lower band). Justification easy. | Cross-Cluster Comparability (bands arbitrary without global links). |  

  ---

  ### **What to Relax First (Given Monthly/Reversible Context)**  
  **Relax: Levels-vs-Units Clarity (Requirement 6)**.  
  - **Why**: This is factional, not core to fairness. In a reversible system, small misalignments between users' scales can be corrected over time with new data (e.g., swap interviews).  
  - **What breaks**: Short-term misallocation from unit mismatches (e.g., overfunding a user whose "1-point improvement" is trivial). But this is tolerable if:  
    - You focus on extreme cases (e.g., users below 3/10 get priority regardless of units).  
    - You use swap interviews to fix egregious errors next month.  
  - **Do not relax** non-negotiables like Cross-Cluster Comparability or Adapter Neutrality—these risk systemic unfairness that compounds monthly.  

  **Second-best relaxation**: Probe-Independent Fallback. Use simple heuristics (e.g., equal split) for new clusters until data arrives, accepting temporary unfairness.  

  ### **Summary**  
  - **Non-negotiable**: Cross-Cluster Comparability, Adapter-Straightliner Neutrality, Incentive Resistance, Critical-Group Reliability, Actionable Justification.  
  - **Factional**: Levels-vs-Units Clarity.  
  - **Nice-to-have**: Probe-Independent Fallback.  
  - **Start with (d) + (b) hybrid**: Use swap interviews sparingly for cross-cluster links and adapter validation, and proxy metrics (e.g., income drops) for fallback. Relax units-levels precision to save costs. Monitor adapter funding monthly for fairness.  

  This balances your constraints: comparability, adapter protection, and justification, while acknowledging budget/reversibility. If swaps are too expensive, method (e) + targeted swaps for cluster bridging is a fallback (despite coarse-band flaws).
