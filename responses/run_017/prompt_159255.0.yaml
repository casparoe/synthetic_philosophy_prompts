  ### Grading Rubric for First-Class Answer  
  **Part A(i) (4 marks):**  
  - Must identify **Relation maxim** violation.  
  - Specify it's **flouting** (ostentatious breach inviting inference), not violation (covert) or opting out.  
  - Explain why flouting generates implicature: speaker signals non-literal intent, triggering hearer’s cooperative inference.  
  - Contrast with other failures: violations (deceptive) or clashes (maxim conflicts) don’t invite calculable inferences.  

  **Part A(ii) (2 marks):**  
  - Classify as **conversational implicature** (CI).  
  - Apply two diagnostics:  
    - **Cancellability**: CI cancellable without contradiction; conventional implicature (ConvI) or what is said is not.  
    - **Embedding**: CI doesn’t project under operators (e.g., conditionals); ConvI does.  
  - Explain results for this case.  

  **Part A(iii) (2 marks):**  
  - Distinguish falsity in *saying* (literal content false) vs. *implicating* (inferred content false).  
  - State Ada **implicated falsely** but **said truly**.  
  - Confirm Grice marks the difference: Quality governs *what is said*, not implicature.  

  **Part B(a) (5 marks):**  
  - Eliminate CI: witness content isn’t context-dependent.  
  - Debate **what is said** vs. **ConvI**:  
    - **Calculability**: Not CI (no maxim-based inference).  
    - **Detachability**: No alternative forms; inconclusive for said/ConvI.  
    - **Cancellability/Embedding**: Apply to test if content projects or cancels.  
  - Conclude: Settled as conventional (grammatical), but diagnostics don’t resolve said/ConvI distinction.  

  **Part B(b) (4 marks):**  
  - **Non-detachability** confirms **conventionality** (attached to form) but **not whether it’s said or ConvI**.  
  - Test **ill-defined** here: Grammar forces encoding, but doesn’t show if content is truth-conditional.  
  - Emphasize: Detachability only distinguishes conventional vs. conversational; not said vs. ConvI.  

  **Part B(c) (3 marks):**  
  - If ConvI, Meera **implicates falsely** but **says truly** (door open).  
  - Argue: **Quality governs only what is said**, per Grice’s original formulation (maxims apply to "conversational contribution" = what is said + implicatures, but Quality targets truth of *stated content*).  
  - Position: ConvI falsehood violates cooperation but not Quality maxim directly.  

  ---

  ### Student Answer Evaluation  
  **Part A(i) (4 marks)**  
  > "Ada violates the maxim of Relation... violation is one Ben can detect... he works out what she must mean."  
  - **Partly right (0.5/1)**. Correctly identifies Relation maxim and inferential recovery.  
  - **Major error**: Calls it a "violation" but describes **flouting** (detectable breach inviting inference). Grice distinguishes *flouting* (generates implicature) from *violating* (secret non-cooperation). **Cost: 0.5 marks**.  
  - **Missing**: Explicit term "flouting"; contrast with other failures (e.g., violating ≠ flouting).  

  **Part A(ii) (2 marks)**  
  > "Conversational implicature... cancellability... embedding... behaviour of conversational rather than conventional content."  
  - **Right (2/2)**. Perfect. Correctly classifies as CI, uses cancellability (additive cancellation works) and embedding (fails in conditional). Diagnostics applied flawlessly.  

  **Part A(iii) (2 marks)**  
  > "Ada did implicate something false... said something true... apparatus marks the difference."  
  - **Right (2/2)**. Excellent. Distinguishes said (true) vs. implicated (false), notes Quality governs what is said, and references irony contrast.  

  **Part B(a) (5 marks)**  
  > "Not a conversational implicature... conventional... Detachability is decisive... part of what Meera said."  
  - **Partly right (2/5)**.  
    - **Right**: Correctly eliminates CI (not context-dependent).  
    - **Major error**: Asserts detachability "decides" it is "part of what is said". **Detachability only confirms conventionality** (vs. conversational) but **does not** distinguish what is said from ConvI. Grice treats both as non-detachable. **Cost: 2 marks**.  
    - **Missing**: Cancellability/embedding tests. A first-class answer would note:  
      - Cancellability: Witness claim *cannot* be cancelled (e.g., "Door open-vi, but I didn’t see it" → anomalous), suggesting conventionality.  
      - Embedding: In "If door open-vi, then..." the witness claim projects, behaving like ConvI/what is said.  
    - **Omission cost: 1 mark**.  

  **Part B(b) (4 marks)**  
  > "Non-detachability is the mark of content... part of the speaker's commitment... no alternative formulation."  
  - **Partly right (1/4)**.  
    - **Right**: Notes non-detachability due to grammatical constraint.  
    - **Major error**: Equates non-detachability with being "part of what is said". **Non-detachability only shows conventional encoding**; it cannot distinguish ConvI from what is said (both are non-detachable). **Cost: 2 marks**.  
    - **Major error**: Claims test is "decisive" when it is **ill-defined** here. When no alternative exists, detachability test is inapplicable for *any* content. **Cost: 1 mark**.  

  **Part B(c) (3 marks)**  
  > "What Meera said includes that she witnessed... she said something false... violates Quality."  
  - **Partly right (1/3)**.  
    - Position logically follows their (flawed) Part B(a) conclusion, but:  
    - **Major error**: Assumes witness content is "said" without justification. **If ConvI**, falsity would *not* violate Quality (which governs what is said). Grice restricts Quality to the truth of "what is said". ConvI falsity misleads but doesn’t breach Quality. **Cost: 1.5 marks**.  
    - **Missing**: Argument for why Quality governs only what is said (e.g., Grice’s examples of ConvI, like "therefore", don’t affect truth evaluation).  

  > **Caveat on calculability**: Valid critique but irrelevant to the question. No deduction.  

  ---

  ### Overall Mark and Justification  
  **Mark: 13/20**  
  **Band: Upper Second (Good but with significant gaps)**  

  **Justification**:  
  The student excels in Part A, demonstrating secure grasp of conversational implicature derivation and diagnostics (scoring 6.5/8), including a nuanced distinction between saying and implicating falsity. However, Part B reveals serious misunderstandings: conflating non-detachability with what is said (costing 4 marks), misapplying diagnostics to conventional content, and mishandling Quality’s scope. The solid Part A performance lifts the mark above a lower-second classification, but Part B errors prevent a first-class grade. To improve, the student must disentangle conventionality from truth-conditionality and refine diagnostic application.
