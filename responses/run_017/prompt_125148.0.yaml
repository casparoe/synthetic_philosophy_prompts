answer: |-
  ## The Eulogy

  (Quiet, steady start)
  Maureen, family, friends, colleagues, students… thank you for gathering to remember Hugh. It feels impossible to capture him. He was… substantial. A force. And he’d be the first to tell me that trying to pin him down with neat labels, to sum him up in a few grand phrases, would be a kind of betrayal. He left a note about that, actually. A request. He asked us not to turn him into a fixed character, a statue. Not to say things that made his life seem inevitable, pre-written. Instead, he asked us, if we needed to talk about him, to talk about things he *did*. Specific moments. Times when choices were made, paths were taken, and others were left behind. To show that he could have done otherwise. And he specifically asked us not to say he was “at peace.” That wasn’t a state he ever sought, and certainly not one he’d want declared about him now, unable to argue back. So, I’ll try to honour that. I’ll try to talk about Hugh as he lived: in motion, in the doing.

  Think of Hugh in Room B7. Thirty-eight years. Not just teaching French verbs or explaining Molière’s jokes, though he did that brilliantly. Teaching drama. Picture him on a Tuesday afternoon, maybe 1987. A group of fifteen-year-olds, awkward, self-conscious, trying to project their voices for the first time. Hugh wouldn’t just tell them *how*. He’d show them. He’d stride to the front, suddenly larger than life, his voice booming off the rafters – “Is this a dagger I see before me?” – making them jump, then laugh. Then shrinking back, whispering conspiratorially, drawing them in. He showed them *how* it could be done, yes. But he also showed them the *choice*: the power in volume, the intimacy in quiet, the vulnerability in stillness. He didn’t tell them, “Be confident actors!” He showed them actions they could *choose* to take, actions that cost effort, that felt risky, that revealed something new. He made the alternatives visible.

  Or think of him arguing. Hugh argued *for* things. Passionately. Especially ideas. Sartre was his constant companion, a sparring partner across the decades. This wasn’t some youthful phase. It was a lifelong conversation, a measuring stick. I remember sitting with him years ago, maybe 2005, coffee long cold. He was wrestling with a passage, not for a lesson, but for himself. Frowning, muttering, jabbing his finger at the page. “No!” he’d suddenly exclaim, not at me, but at Sartre himself. “That won’t *do*! What about the sheer *weight* of the past? What about the pull of habit?” He wasn’t just reading; he was *arguing*, testing the ideas against the life he knew, the life he was living. He could have nodded along. He could have accepted the text. He chose engagement. He chose the friction. It cost him easy answers. It gave him a restless, demanding clarity.

  That brings me to a particular Tuesday. Spring term, 1994. Most of you know the story. A student, seventeen, scared and foolish, got caught with exam papers. Hugh knew him. Saw the panic, the potential ruin. He wrote a reference. Not excusing the act, but speaking to the boy, the person he knew, the potential still there. The headmaster saw it differently. Saw the risk, the precedent, the pressure from outside. He asked Hugh to withdraw it. Hugh refused. And then Hugh walked out. Resigned. Mid-term. After thirty-eight years.

  It’s tempting, so tempting, to paint this moment. To say, “That was Hugh all over! Always the rebel, the principled fighter!” Or to say, “The school was clearly wrong, and history proved it!” Or even, looking back, to say, “Ah, *that’s* why he did X or Y later, it all fits.” Hugh hated those versions. He never described it to me as a grand stand on principle. He described it as something he *did*. That Tuesday. In that headmaster’s office. He pictured the boy’s face. He felt the weight of the headmaster’s authority, the pressure of the institution. He could have stayed silent. He could have withdrawn the reference. He could have negotiated, delayed, compromised. The alternative paths were real, tangible. He chose to refuse. He chose to leave. That choice had consequences – financial uncertainty, the loss of his classroom, the fractured relationships with colleagues who felt he abandoned them or endangered the school. He lived with those consequences, never pretending they didn’t exist, never claiming it was easy or the only right path. He simply owned it as the choice he made, on that day, with those alternatives staring back at him.

  That’s how Hugh lived. Not as a fixed portrait, a single image captured forever. He called that trap “the passport photograph” – freezing a person in one moment, one expression, pretending that’s the whole truth. Hugh was a blur of motion, a series of actions, big and small, chosen in specific moments against a backdrop of other possibilities. He built bookshelves meticulously, could curse colourfully when the wood split, and then choose to start again. He cooked elaborate meals for Maureen, sometimes burning them spectacularly, laughing at the disaster, choosing to order takeaway instead. He listened fiercely to friends in trouble, not just offering platitudes, but asking hard questions, pointing out choices they might be avoiding, offering support *for* the struggle, not just escape from it. He wrestled with doubt, with anger, with the sheer absurdity of things. He wasn’t serene. He was engaged. He chose, again and again, often messily, to be present, to act, to argue, to care.

  He suffered terribly these last months. The physical reality was brutal. That suffering is over. That is a fact we can hold onto, a physical relief. But Hugh wouldn’t want us to call it “peace.” He’d see it as an end, a cessation. He wasn’t aiming for tranquility; he was aiming for life, fiercely lived, argued over, chosen piece by piece.

  So, what comfort is there? Not in declaring a finished story. Not in smoothing over the rough edges, the arguments, the choices that divided opinion, the sheer bloody-mindedness. Hugh wouldn’t trust easy comfort. The comfort, I think, lies precisely in refusing that final passport photograph. It lies in seeing Hugh as he was: complex, contradictory, always capable of surprise, always capable of choosing differently. And perhaps, seeing him that way, we see something about ourselves.

  We are not finished. Sitting here, grieving, remembering, arguing in our heads about that day in 1994, feeling the weight of our own pasts… none of it is the final word. Hugh’s life, lived in specific acts, in visible choices, reminds us that we aren’t trapped by a single story about ourselves. The versions people have of us – the roles we play, the mistakes we’ve made, the good deeds done – they aren’t fixed portraits. We are more like Hugh arguing with Sartre: questioning, pushing back, capable of something different tomorrow. The future isn’t written by the past. It’s built, choice by choice, action by action, in the moments ahead. That’s the freedom Hugh wrestled with, raged against sometimes, but ultimately insisted upon. It was his compass.

  He was… (Pause)… well, Maureen knows the word. And he’d hate me using it as a label. But if I use it just this once, as something earned by all these actions, these choices, these refusals… Hugh was stubborn. Gloriously, infuriatingly, magnificently stubborn. He insisted on looking directly at the choices. He insisted on acting, even when it cost him. He insisted on being Hugh, right to the end, on his own terms. We will miss his voice, his arguments, his presence, his fierce, stubborn engagement with this messy, difficult, precious life. Thank you, Hugh. For everything. Especially the argument.

  ## What the Speech Refuses to Say

  1.  **"He is at peace now." / "His suffering is over and he is at rest."** Refused because Hugh explicitly forbade it, seeing "peace" as an unchosen, unchangeable state antithetical to his belief in constant becoming and the necessity of choice. Saying it would imply his current state is a desirable resolution he would have welcomed, contradicting his lifelong stance. For the mourners, especially the Catholics, it would offer traditional comfort but at the cost of misrepresenting Hugh's core philosophy and violating his direct request, turning the eulogy into a lie by his standards.
  2.  **"He was always a principled rebel / a man of integrity."** Refused to avoid trait-talk that makes his 1994 resignation seem inevitable or defines his entire character. Hugh rejected the notion that he *was* a fixed type ("the principled man") who *therefore* acted. The speech shows the choice he made *then*, with alternatives visible, rather than attributing it to a static character. Saying this would imply his life was pre-determined, erasing the contingency and cost of that specific choice, and simplifying the real disagreement and mixed feelings others still hold about that event.
  3.  **The "It all makes sense now" narrative.** Refused regarding the 1994 resignation or his life overall. The speech avoids suggesting his later life "vindicated" the resignation or revealed its "true meaning," or that his life arc forms a neat, coherent story. Hugh saw such retrospective smoothing as false, obscuring the open-endedness and uncertainty of the moments when choices were made. It would imply closure and predetermined meaning where Hugh saw only the ongoing project of a life lived in freedom.
  4.  **"He was authentically himself." / Any use of Sartrean jargon.** Refused per the request to avoid philosophical vocabulary. While the speech *enacts* ideas like authenticity and bad faith (through showing choices, avoiding bad-faith excuses, taking responsibility), it never names them. Using the terms would alienate Maureen and others, turning Hugh's lived philosophy into academic abstraction, which he despised. It would also violate the instruction to find comfort through dramatization ("showing" freedom) rather than assertion ("telling" about authenticity).
  5.  **"He would want us to be happy/not grieve."** Refused as simplistic and potentially dismissive of the complex grief in the room, including disagreements about Hugh's life and choices. Hugh understood the weight of consequence and emotion. The offered comfort is not the cessation of grief, but the recognition of shared, unfinished potential – a more active and Hugh-like solace rooted in the freedom he championed.

  ## Lines to Cut (and Substitutes)

  1.  **Original:** "He wrestled with doubt, with anger, with the sheer absurdity of things. He wasn’t serene. He was engaged. He chose, again and again, often messily, to be present, to act, to argue, to care... He suffered terribly these last months. The physical reality was brutal. That suffering is over. That is a fact we can hold onto, a physical relief. But Hugh wouldn’t want us to call it 'peace.' **He’d see it as an end, a cessation. He wasn’t aiming for tranquility; he was aiming for life, fiercely lived, argued over, chosen piece by piece. And let's be honest, sometimes that meant he was just plain angry – angry at the limitations, angry at the pain, maybe even angry at the silence where he expected an argument."**
      *   **Why Cut:** The bold section, especially the explicit mention of anger at limitations/pain/silence, while true to Hugh's spirit, could be deeply jarring for Maureen and her family in the immediate context of acknowledging his suffering is over. It risks sounding harsh or accusatory ("angry at the silence" could be misheard as anger at God or faith) and might overshadow the preceding, more measured point about his engagement vs. peace.
      *   **Substitute:** "...He wasn’t aiming for tranquility; he was aiming for life, fiercely lived, argued over, chosen piece by piece. **Even in the toughest times, that fierce engagement never left him.**"
  2.  **Original:** "Hugh’s life, lived in specific acts, in visible choices, reminds us that we aren’t trapped by a single story about ourselves. The versions people have of us – the roles we play, the mistakes we’ve made, the good deeds done – they aren’t fixed portraits. We are more like Hugh arguing with Sartre: questioning, pushing back, capable of something different tomorrow. **The future isn’t written by the past. It’s built, choice by choice, action by action, in the moments ahead. That’s the freedom Hugh wrestled with, raged against sometimes, but ultimately insisted upon. It was his compass... We are not finished.**"
      *   **Why Cut:** The bold section, particularly "The future isn’t written by the past" and the emphasis on "We are not finished," while core to the existential comfort, might feel too starkly challenging or unsettling to some mourners, especially those seeking solace in faith or the finality of a life completed. It could be misconstrued as dismissing the significance of the past or the reality of death in the moment of grief.
      *   **Substitute:** "...capable of something different tomorrow. **Hugh showed us that the story isn't fixed, even by our own past. What comes next is still ours to shape, moment by moment, just as he shaped his.** That's the freedom he insisted upon..."
  3.  **Original:** "He was… (Pause)… well, Maureen knows the word. And he’d hate me using it as a label. But if I use it just this once, as something earned by all these actions, these choices, these refusals… Hugh was stubborn. Gloriously, infuriatingly, magnificently stubborn. **He insisted on looking directly at the choices, the costs, the lack of easy answers – even when it hurt, even when it meant standing alone.**"
      *   **Why Cut:** The bold phrase "even when it hurt, even when it meant standing alone" could inadvertently highlight pain and isolation in a way that feels unnecessarily sharp in the final moments, especially recalling the 1994 event which did cause lasting fractures. It might detract from the celebratory "gloriously, magnificently" aspect.
      *   **Substitute:** "...Hugh was stubborn. Gloriously, infuriatingly, magnificently stubborn. **He insisted on looking directly at the choices, the costs, the lack of easy answers – right to the end, on his own terms.**"
