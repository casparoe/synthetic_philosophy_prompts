prompt: |-
  Hey — I'm putting together a problem set for my upper-level seminar on personal identity for next spring, and I want to build it around one person's actual track record rather than around cases floating free of anybody's commitments. The person is a senior colleague of mine — call her Dana — who has been thinking about upload cases for years and has gone on record, in talks and in print, on a bunch of them. Her verdicts, as best I can reconstruct them:

  (1) Gradual replacement, the standard one: swap one neuron at a time for a silicon unit playing exactly the same causal role in the network, over about a decade, with the person behaving and reporting normally throughout. She says: you survive, and it isn't even a close call.

  (2) Scan, destroy, rebuild the next day, functionally identical down to the last connection weight. She says: that's death. The thing that wakes up is a successor — a very good copy, but a copy.

  (3) Fission: the two hemispheres end up driving two different bodies, each with the full psychology. She says: neither is you. Two equally good candidates means there's no answer to "which one is me," and a relation that has no answer isn't survival.

  (4) Replacement units that match the originals only from the outside: same input–output mapping for every signal they actually receive, but they get there by a different internal route, and they carry internal states the original never had — states no downstream part is sensitive to. She says: still you. Differences that nothing else in the system can see aren't differences that matter.

  (5) The same decade-long replacement as in (1), except that the subject is kept in a medically induced coma for the middle stretch, during which something like 80% of the swapping happens; conscious and normal before and after. She says: still you. Consciousness going dark for a while doesn't interrupt whatever it is that's doing the work.

  So: she's not a substrate chauvinist, she isn't moved by "same person, new body" talk when there's been a gap, she's happy to count external functional equivalence as equivalence, and she doesn't require continuous consciousness. But I've been siting on these five for a week and I cant tell what's actually load-bearing. As far as I can see, at least three different rules fit all of them: something about step size (small increments preserve you, big jumps don't), something about the same concrete system never ceasing to operate, and something about the person being wherever the causal organization gets realized. I suspect there's a fourth I'm missing, or a way of sharpening one of those three that makes it collapse into another.

  Here's the case I want to put on the set, and I don't think this exact configuration gets discussed much. Call it the fade-over. Nothing is replaced in place. Instead a second system — the understudy — is built alongside the original and run in parallel, receiving the same inputs, functionally identical to the original by the standard she accepted in (4). A mixer decides whose output drives behaviour, and it shifts by one percent a week over about two years. The original is never modified; it just gets increasingly ignored. Both systems run continuously for the whole period. At the end the mixer takes everything from the understudy and the original is switched off and destroyed. The behavioural and verbal stream is continuous throughout, with no discontinuity anyone can detect. I'm deliberately not stipulating whether the understudy is conscious during the middle stretch — leave that open, because (5) suggests she might not care, and because the usual argument that preserving function must preserve experience might or might not be doing work for her here.

  What I want from you:

  - The rules that fit her five verdicts, stated sharply enough that they genuinely come apart from each other, including any I've missed — and say honestly if two of them turn out to be the same rule once you fix what counts as the subject.
  - What each rule predicts about the fade-over, and specifically how each one answers the question of what the subject is during the middle stretch: the original system, the understudy, the composite of both plus the mixer, or none of them. I think that question is where the real action is.
  - Your best guess at her verdict, with the reasons for preferring it. Flag if (3) is doing more work than it looks like it's doing: at the midpoint there are two complete systems running, so if her no-answer principle generalizes, this case might come out as death for a reason that has nothing to do with step size — though maybe it's distinguishable, since one of the two candidates is being retired rather than going on to live a life.
  - The further case you'd put on the set to separate whichever rules are still tied afterwards. My candidate is to run the same setup but flip the mixer from zero to a hundred in a millisecond, with both systems already running — I'm not convinced that's the sharpest probe available.

  And this is the part I'll actually be grading: keep clear which moves here are settled and which are contested. I want to be able to tell students where people who work on this agree, where the disagreement is real and live, and where a tempting answer is just one side of an argument. Don't present a contested view as the consensus, and give me confidence levels on the individual claims, not only on the headline verdict.
reasoning: |-
  Okay, let me tackle this problem set query step by step. The user is designing an upper-level seminar on personal identity and wants to build cases around their colleague Dana's actual views on upload scenarios. They've provided five of Dana's verdicts and want help analyzing the underlying principles, applying them to a new "fade-over" case, and designing follow-up probes.

  First, I need to parse Dana's five verdicts clearly:
  - Gradual replacement (1) is survival
  - Scan-and-destroy (2) is death
  - Fission (3) is death (neither survives)
  - Internal-state-indifference replacement (4) is survival
  - Coma-inclusive gradual replacement (5) is survival

  The key is to identify what consistent principles could explain all these judgments. The user suspects three possibilities: step size, continuous operation of the same concrete system, or causal organization realization. I should test these against the cases and see if they hold.

  Noticing Dana rejects substrate chauvinism (accepts silicon), rejects gap-based objections (coma case), and cares about functional equivalence. But she draws lines at destruction/rebirth and fission. This suggests continuity of implementation might be crucial for her - the "never blinking out" idea.

  For the fade-over case: parallel systems with gradual output shifting. Need to apply each principle to predict:
  - Step size principle: gradual shift might suggest survival
  - Concrete system principle: original system runs throughout but gets ignored - is that "same system operating"? Tricky.
  - Causal organization: the functional thread continues but hops between systems

  The midpoint question is key - where is "the person" when both systems are active? This might connect to her fission verdict where two candidates lead to no survival. But here one candidate gets destroyed, which may break the symmetry.

  I'll propose a fourth principle: "no branching" to capture her fission rejection. Then test all principles against fade-over:
  - Step size: survives
  - Concrete system: survives (original persists)
  - Causal organization: survives (function continues)
  - No branching: survives (no competing claimants)

  But this seems too tidy - probably missing nuance. Need to examine if "same concrete system" requires being the one driving behavior. That might change things.

  Best guess for Dana's verdict: survival, because no discontinuity and original isn't modified. But the mixer creates a composite entity that might complicate things. Her coma case (5) shows she doesn't require behavioral control continuity.

  For follow-up cases, sudden mixer flip could test whether gradualness matters. Also consider a "branching fade-over" where both copies continue to test the no-branching principle.

  Throughout, I'll maintain clear distinctions between established points (Dana's actual verdicts), contested interpretations (which principle she holds), and open questions (fade-over prediction). Confidence levels will be marked for each claim.
answer: |-
  Here's a breakdown of Dana's commitments, the rules fitting her verdicts, their predictions for your fade-over case, and the recommended follow-up probes. I'll maintain strict separation between settled data (Dana's verdicts), contested interpretations (competing rules), and open philosophical questions.

  ### I. Settled Data: Dana's Verdicts (Your Cases 1-5)
  These are fixed points any rule must explain:
  1.  **Gradual Replacement (Neuron Swap):** Survival. (Substrate irrelevant; gradual change acceptable)
  2.  **Scan-Destroy-Rebuild:** Death. (Functional continuity with gap = failure)
  3.  **Fission:** Death. (Branching = failure; no unique candidate)
  4.  **Internal-State-Indifference Replacement:** Survival. (Only externally observable function matters; internal implementation irrelevant if causally isolated)
  5.  **Coma-Inclusive Gradual Replacement:** Survival. (Temporary unconsciousness/lack of behavioral output irrelevant)

  ### II. Contested Interpretations: Competing Rules (Stated Sharply)
  Three distinct rules fit *all* five verdicts. They genuinely come apart. Crucially, "the subject" refers to the *implementation* realizing the relevant psychology/organization at a given time.

  1.  **Rule A: No Implementation-Replacement Without Overlap (NIRWO)**
      *   *Stated Sharply:* You survive iff there is never a moment where the concrete physical system (or computational implementation) realizing your core psychology *ceases to operate* and is *replaced wholesale* by a numerically distinct system. Survival requires that the core implementing system persists in an *operational state* throughout the process, even if gradually modified or temporarily quiescent (as in coma). *Gradual modification of the original system is permitted; complete replacement of the original system as a whole is not.*
      *   *Why It Fits:*
          *   (1) & (5): Original brain/system modified gradually while operational → Survive.
          *   (2): Original system destroyed → replaced by new system → Die.
          *   (3): Original system ceases to operate as a unified whole → replaced by two new systems → Die (branching is irrelevant to *this* rule's core mechanism; the *replacement* is the killer).
          *   (4): Original system modified (neurons replaced) while operational → Survive. (The internal differences are irrelevant to the persistence of the *implementation*).

  2.  **Rule B: Unique Continuous Realization of Causal Organization (UCRO)**
      *   *Stated Sharply:* You survive iff there is a *unique*, *continuous*, *functionally identical* realization of your core causal organization (input-output-state mappings). "Continuous" means no temporal gap in the existence of *a* realizing system. "Unique" means no branching into multiple co-realizing systems both claiming identity. "Functionally identical" means satisfying condition (4).
      *   *Why It Fits:*
          *   (1) & (5): Continuous, unique, functionally identical realization (modified brain) → Survive.
          *   (2): Temporal gap → No continuous realization → Die. (The reboot is a new realization).
          *   (3): Branching → No unique realization → Die.
          *   (4): Functional equivalence maintained → Survive. (Internal differences don't break functional identity).

  3.  **Rule C: Minimal Incremental Change with Behavioral Continuity (MICBC)**
      *   *Stated Sharply:* You survive iff the change from one moment to the next involves only *minimal incremental modifications* to the physical/functional state of the realizing system, *and* there is *observable behavioral continuity* (reports, actions) throughout the process. "Minimal Incremental" means changes small enough that the system is never radically reconfigured or replaced as a whole at any single step. Consciousness gaps are irrelevant if behavioral continuity holds.
      *   *Why It Fits:*
          *   (1) & (5): Minimal incremental changes (single neurons/week), behavioral continuity → Survive.
          *   (2): Radical change (destruction/rebuild) → Die.
          *   (3): Radical change (splitting) → Die. (Branching is a form of radical reconfiguration).
          *   (4): Minimal incremental changes (single neurons replaced), behavioral continuity → Survive. (Internal differences don't constitute a radical change *if* introduced incrementally and behavior is continuous).

  **Why They Are Distinct:**
  *   **NIRWO vs UCRO:** NIRWO cares about the *numerical identity of the implementing system*. UCRO cares about the *abstract pattern* and its realization history (gap/branching). UCRO allows the *original* system to be completely destroyed/replaced *if* there's no gap/branching (e.g., seamless teleportation where the original is vaporized *after* the copy is activated continuously). NIRWO forbids this. Case (2) kills both UCRO (gap) and NIRWO (replacement). Case (3) kills UCRO (branching) and arguably NIRWO (original ceases unified operation). *Crucially, NIRWO focuses on the object, UCRO on the pattern.*
  *   **NIRWO vs MICBC:** MICBC allows the original implementing system to be completely replaced *if* done gradually enough with behavioral continuity. NIRWO forbids wholesale replacement *even if gradual*. Case (2) kills both. Case (3) kills both. The fade-over case will likely distinguish them.
  *   **UCRO vs MICBC:** UCRO forbids gaps/branching even if changes are minimal. MICBC allows gaps/branching *if* the changes at the moment of gap/branching are minimal and behavioral continuity holds *across* the gap/branching. Case (2) kills UCRO (gap) but MICBC might allow it *if* the gap were instantaneous (behavioral continuity holds) – but Dana's verdict on (2) kills this for MICBC. Case (3) kills both.

  ### III. Applying Rules to the Fade-Over Case
  *   **Setup:** Original system (O) runs untouched. Understudy system (U) runs untouched. Mixer (M) gradually shifts behavioral output control from O to U over 2 years (1%/week). Both O and U run continuously, receiving identical inputs, functionally identical per (4). Continuous behavioral stream. O destroyed at end.
  *   **Question:** What is the subject, specifically during the midpoint (50% mix)?

  | Rule          | Survival Outcome? | Subject During Midpoint (50% Mix)                                                                 | Reasoning                                                                                                                               | Confidence in Prediction (Given Dana) |
  | :------------ | :---------------- | :------------------------------------------------------------------------------------------------ | :-------------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------ |
  | **A (NIRWO)** | **SURVIVAL**      | **The Original System (O)**                                                                       | O is the *only* concrete system that was originally "you" and has *never ceased operating*. U is a distinct system running in parallel. Control being diverted doesn't change O's operational persistence. The *implementation* (O) persists. | **High**                              |
  | **B (UCRO)**  | **DEATH**         | **No Single Subject (or Composite?)**                                                             | There are **two distinct realizations** (O & U) of the *same causal organization*, both fully operational and contributing to the single behavioral stream. This violates **uniqueness**. The "composite" (O+U+M) is a *different* organization (it has duplicate processing, a mixer). | **Medium-High** (Branching aversion)  |
  | **C (MICBC)** | **SURVIVAL**      | **The Behavioral Stream Source (Composite?)**                                                     | Changes are minimal (1%/week), behavioral continuity is perfect. The *source* of behavior gradually shifts. The subject is the entity producing the continuous stream, likely the composite system (O+U+M) controlling the output. | **Medium**                            |

  **Analysis of Midpoint:**
  *   **NIRWO:** Clear winner is O. O is the persisting implementation.
  *   **UCRO:** Fatal problem is the *duplicate realization*. Two complete, functionally identical systems realizing "your" psychology simultaneously. This mirrors the core issue in fission (Case 3), even though U isn't embodied separately *yet* and will be destroyed. The principle "no unique candidate" likely generalizes. The composite is a distinct system.
  *   **MICBC:** Focuses on the smooth transition of *control*. The composite system (O+U+M) is the minimal entity producing the continuous behavior. The internal duplication is irrelevant if changes are small and output is continuous.

  **Role of Case (3) Fission:** It's likely **doing heavy work** for UCRO (Rule B). The presence of two complete, co-existing realizations of "your" psychology seems fatal for survival under UCRO, regardless of their fate or behavioral integration. NIRWO (A) and MICBC (C) aren't inherently threatened by parallel operation; they care about the history/persistence of the *original* system (A) or the continuity of the behavioral source (C).

  **Best Guess for Dana's Verdict:**
  *   **Prediction: DEATH (via UCRO / Rule B)**
  *   **Reasons:**
      1.  **Primacy of Case (3):** Her strong "neither is you" in fission suggests a deep aversion to co-existing realizations. The fade-over midpoint features *exactly* this: two complete, simultaneous realizations of her psychology. The fact that U is later destroyed and O is turned off doesn't erase the period of duplication. The lack of separate bodies might be irrelevant if the core issue is the existence of multiple claimants *at the same time*.
      2.  **Contrast with Gradual Replacement (1 & 5):** In gradual replacement, *only one system* (the modified brain) realizes the psychology at any time. There's no duplicate running in parallel. The fade-over introduces a parallel duplicate.
      3.  **Contrast with Internal States (4):** Case (4) involves modification of the *single* realizing system, not duplication.
      4.  **The "Unique Realization" Intuition:** Her rejection of gaps (2) and branching (3) points towards UCRO requiring a single, unbroken thread of realization. Fade-over breaks uniqueness.
  *   **Confidence: Medium.** While UCRO seems the strongest fit, MICBC (survival) is plausible given her focus on continuity and indifference to implementation details. NIRWO (survival via O) is less likely, as it seems odd to say the subject is O when its control is diminishing and eventually zero.

  ### IV. Recommended Follow-Up Cases to Separate Rules
  The Sudden Flip case is a good start, but these probes target the fault lines more precisely:

  1.  **The Seamless Teleporter (Separates NIRWO vs UCRO & MICBC):**
      *   *Setup:* A device scans O, transmits the data, and *simultaneously* (1) destroys O *and* (2) constructs & activates U (functionally identical per (4)) at the destination. No temporal gap in the behavioral stream is detectable by any external observer (or internal perspective, if stipulated). It's instantaneous destruction/reboot with continuity of function.
      *   *Predictions:*
          *   **NIRWO:** **Death.** Original implementation (O) is destroyed. U is a distinct system.
          *   **UCRO:** **Survival.** Continuous functional realization with no gap *and* no branching.
          *   **MICBC:** **Likely Survival.** Minimal change? Arguably radical (destruction), but *behavioral continuity is perfect and instantaneous*. Might be ambiguous, but MICBC leans towards survival due to continuity.
      *   *Why it's sharp:* Directly pits implementation persistence (NIRWO) against pattern continuity (UCRO/MICBC). Dana's verdict on Case (2) (death) suggests she'd likely side with NIRWO here (death), distinguishing it from UCRO. This tests the "gap vs replacement" distinction.

  2.  **Branching Fade-Over (Separates UCRO vs MICBC & NIRWO; Tests Generalization of Fission):**
      *   *Setup:* Identical to your fade-over *except* at the endpoint: Instead of destroying O, the mixer freezes at 50/50 and *both* O and U are given their own separate bodies and continue living independent lives, both functionally identical to the original pre-fade and to each other at the split.
      *   *Predictions:*
          *   **NIRWO:** **Survival (Original Branch Only? Ambiguous).** O was the original persisting implementation. U was always distinct. But does O survive *as the original person*? Probably yes. U is a copy.
          *   **UCRO:** **Death.** Clear branching at endpoint → no unique candidate → death for the original person at the moment of branching. (Like Case 3).
          *   **MICBC:** **Death? Survival?** The change at the endpoint (sudden branching) is radical → likely death. If the branching process were gradual enough (e.g., slowly separating the bodies over time), MICBC *might* allow survival, but the sudden split likely kills it. Dana's verdict on (3) suggests MICBC would predict death here.
      *   *Why it's sharp:* Directly tests if the *co-existence* during the fade-over was the problem for UCRO (predicting death) or if the problem *only* arises when *both* continue (predicting survival during fade-over but death at endpoint). If Dana judged the original fade-over as death (as predicted), this case is less necessary. If she judged fade-over survival, this forces the branching issue.

  3.  **The Sudden Flip (Refines MICBC & UCRO; Tests "Minimal Incremental"):**
      *   *Setup:* As you suggested: O and U running in parallel, identical, receiving inputs. Mixer flips instantly from 100% O to 100% U. Continuous behavioral stream (U was already perfectly synced and predicting outputs).
      *   *Predictions:*
          *   **NIRWO:** **Death.** O persists but is rendered irrelevant. U is a distinct system now driving behavior. The *implementing system* changed wholesale.
          *   **UCRO:** **Death.** Branching existed before the flip (two realizations), violating uniqueness. The flip itself is a radical change in realization.
          *   **MICBC:** **Death.** The flip is a radical, non-incremental change in the source of behavior, even if behavior is continuous. Violates "minimal incremental change".
      *   *Why it's sharp:* Contrasts with the gradual fade-over under MICBC (survival) and UCRO (death). If Dana judged gradual fade-over as survival (under MICBC), this case should be death. If she judged fade-over as death (under UCRO), this is also death, so it doesn't distinguish MICBC and UCRO *in outcome*, but reinforces the difference in *reasoning* (branching vs step size).

  ### V. Summary for Students: Where Things Stand
  *   **Settled (Dana's Data):** Her specific verdicts on Cases 1-5 are fixed points. She rejects substrate essentialism, accepts external functional equivalence, dismisses consciousness gaps if behavior is continuous, rejects rebirth after destruction, and rejects survival in fission.
  *   **Contested (The Rules):** At least three distinct principles (NIRWO, UCRO, MICBC) explain all five verdicts. Philosophers disagree on which principle best captures the underlying logic of views like Dana's. There is no consensus on "the correct" rule for personal identity in uploads. The debate hinges on:
      *   What is the primary bearer of identity? (The physical implementation? The abstract pattern? The behavioral stream?).
      *   What breaks continuity? (Wholesale replacement? Gaps? Branching? Radical steps?).
      *   Is duplication inherently fatal, or only when candidates diverge?
  *   **Contested (Fade-over Prediction):** Applying the rules leads to divergent predictions (Survival via O, Death via branching, Survival via Composite). Dana's likely verdict (Death via UCRO/branching) is a *plausible inference* based on her fission case, but not guaranteed. Her views on coma (5) and internal states (4) suggest MICBC (survival) is also possible. Her view on scan-destroy-rebuild (2) rules out NIRWO accepting U as the survivor if O is destroyed.
  *   **Open Philosophical Questions:** The follow-up cases target core live disagreements:
      *   **Seamless Teleporter:** Does perfect functional continuity *require* implementation persistence? (NIRWO vs UCRO/MICBC).
      *   **Branching Fade-Over:** Is the *mere co-existence* of duplicates fatal (UCRO), or only their *subsequent independent existence* (MICBC/NIRWO)? How does this relate to the original fission case?
      *   **Sudden Flip:** How "minimal" must a step be to preserve identity? Is behavioral continuity alone sufficient, or must the *source* change incrementally? (Tests MICBC's limits).
  *   **Confidence Levels:** High confidence in the rules fitting Dana's data and being distinct. Medium-High confidence that UCRO best explains her fission verdict and is likely her basis for fade-over death. Medium confidence in the specific follow-up case predictions against the rules. Low confidence that any single rule is "objectively correct" – this is the core of the philosophical debate.

  This structure provides students with clear data points (Dana's verdicts), explicit competing interpretations (the rules), testable predictions (for fade-over), and targeted probes for further investigation, while clearly demarcating settled, contested, and open issues. Good luck with the seminar!
