prompt: |-
  Hey — I'm writing the final for my upper-division normative ethics seminar (18 students, mostly juniors and seniors, plus a couple of econ majors who've had game theory and will definately try to turn everything into a utility function). In-class final, 75 minutes, three essays, so this one has to be doable in about 25 minutes. Worth 20 points.

  Topic is the aggregation of tiny harms — torture vs. dust specks. We did it once on the discussion board and everyone just restated their gut reaction, so I want a question that makes the gut reaction actually do some work. Basically I want to pry apart three things that I think people quietly run together:

  1. Whether the refusal to aggregate is about how big each individual bit of harm is, or about how many people it's spread over. My idea: a case where the total amount of stuff is fixed but the distribution is unknown. A machine will deliver some astronomically huge number of barely-noticeable annoyances (a speck in the eye, a two-second itch), and it's wired either to hand out one apiece to that many different people or to pile the entire load onto a single person. They have to choose between running the machine and one person being tortured for fifty years, and they don't get to know which way it's wired. If they say torture either way, then the number-of-victims thing apparently wasn't doing the work, and I want them to have to own that.

  2. Where the line is. If no number of specks outweighs the torture, what about a million people each with a bad headache for an afternoon, or ten thousand people each losing a finger? Push them to either draw a line somewhere and say why there, or go lexical and then deal with the fact that lexical is mostly just a label for the intuition rather than an answer to it.

  3. What I think is the real crux: fifty years of torture is itself a very long sequence of momentary pains, each of which on its own is far less bad than the whole. So anyone who won't sum small things across people has to say why summing small things across moments inside one life is any different. And if the answer is because it's the same person, I want them to say what work the boundary of a person is doing there.

  I'd like the question to force an actual commitment — pick an option and defend it — not discuss the issues. And nobody in the class has read any of the literature on this, so everything has to be self-contained in the handout: no author names, no papers, no references to the version that circulates online with the number written as a tower of arrows.

  Can you give me: the question as I'd actually hand it out, a model answer of about 700 words, and a marking scheme out of 20 built around maybe five must-hit points? For each point I want how many marks it's worth, the specific move that earns them, and one line on how students typically screw it up. The A/B/C boundary should be about whether they made the move, not about prose quality — tell me what the B answer does that the A doesn't. I also want the model answer to end by being honest about which move in it is the weakest link; I don't want something that reads like the question is settled.

  Last thing: what do I do if half the class writes the specks option is fine because nobody is really harmed and stops there? Is there a version of the question that blocks that answer up front, or does blocking it make the question worse?
reasoning: |-
  We are designing an exam question about the aggregation of tiny harms, specifically addressing the torture vs. dust specks scenario. The goal is to force students to confront three key issues: the role of the number of victims versus the size of each harm, the location of the threshold (if any) between small harms and torture, and the challenge of aggregating harms within a single life versus across multiple lives.

  The scenario we'll use: A machine can be set in one of two modes, but the students don't know which. In one mode, the machine delivers an astronomically large number of barely noticeable annoyances (like dust specks in the eye) to a single person. In the other mode, it delivers the same total amount of harm by distributing one annoyance each to that many different people. The students must choose between running this machine (in whichever mode it is in) and subjecting one person to 50 years of torture.

  The question should be self-contained and force a choice. We also want to avoid the simple answer that specks are negligible.

  Let's design the question:

  **Exam Question**

  **Tiny Harms Aggregation Scenario**

  Imagine a machine that, when activated, will produce an extremely large number of barely noticeable negative experiences — specifically, the sensation of a dust speck in one's eye. The machine is set in one of two modes, but you do not know which:

  - **Mode A**: The machine targets a single individual, delivering the entire sequence of dust specks to that one person. The total experience for this individual would be a continuous, intense irritation for 50 years (because the specks are delivered one after another at a very high rate, so the person effectively experiences non-stop eye irritation for 50 years).

  - **Mode B**: The machine distributes one dust speck each to an extremely large number of different people. Each person would experience a single, barely noticeable irritation that lasts for a fraction of a second and then is gone.

  You have two choices:

  1. **Activate the machine**. If the machine is in Mode A, one person will suffer 50 years of continuous eye irritation. If the machine is in Mode B, a vast number of people will each experience one barely noticeable dust speck.

  2. **Do not activate the machine, but instead subject one randomly selected innocent person to 50 years of severe torture**. This torture is so bad that every moment of it is worse than the entire 50 years of eye irritation from the dust specks (if that helps in your comparison).

  You must choose one of these two options. Your task is to defend your choice.

  In your essay, address the following:

  a) Explain which option you choose and why. Your argument must confront the fact that you do not know which mode the machine is in.

  b) Consider a spectrum of harms: from a dust speck, to a headache, to losing a finger, to severe torture. If you think that no amount of dust specks can outweigh torture, then at what point (if any) does a harm become large enough that aggregating it over many people can outweigh torture? Why draw the line there?

  c) The torture itself is composed of a sequence of moments, each of which is a small harm when considered in isolation. If you refuse to aggregate tiny harms across different people, why is it acceptable to aggregate them within one person? What does the boundary of a person do in your reasoning?

  ---

  **Model Answer (approx. 700 words)**

  I choose to activate the machine rather than subject one person to 50 years of torture. My reasoning must address the uncertainty about the machine's mode and the deeper issues about aggregation.

  First, given the uncertainty, I must weigh the two possible outcomes of activating the machine against the certainty of torture. If the machine is in Mode A, then activating it results in one person enduring 50 years of continuous eye irritation. This is bad, but it is not as bad as 50 years of severe torture. The torture is defined as worse at every moment than the eye irritation, so the torture is a greater harm. If the machine is in Mode B, then activating it causes a vast number of people to each experience a barely noticeable dust speck. I contend that the total harm in Mode B is negligible because each individual harm is so small and does not significantly affect any person's life. Therefore, in both cases, activating the machine leads to less harm than the torture: in Mode A, we have a lesser harm to one person, and in Mode B, we have a negligible distributed harm. Since the torture is a massive harm to one person, and activating the machine in either mode is less bad overall, I choose to activate the machine.

  This choice requires me to aggregate harms. In Mode B, I am summing the tiny harms across many people. But I also must address the challenge of why we aggregate within a life but not across lives. Let me first address the spectrum of harms.

  If we had a case of a million people each suffering a bad headache for an afternoon, I would consider that worse than one person being tortured for 50 years. The headache is a non-negligible harm: it disrupts one's day and causes real pain. I draw the line somewhere between a dust speck and a headache. A dust speck is so minor that it does not even rise to the level of a harm that we should count in moral aggregation. It is trivial. But a headache is a real harm. The reason for the line is that a harm must be above a threshold of significance to be included in the moral calculus. This threshold is not arbitrary; it is based on the idea that if a harm is so small that it does not impact a person's well-being in any meaningful way (doesn't cause distress, doesn't interfere with activities, and is immediately forgotten), then it doesn't count. A headache, however, does cause distress and interference, so it counts. Similarly, losing a finger is a significant harm and definitely counts. Therefore, I hold that tiny harms below the threshold (like dust specks) do not aggregate even in large numbers, but harms above the threshold do.

  Now, the torture: it is a sequence of moments, each of which is a small harm. Why is it acceptable to aggregate these within one life? The boundary of the person matters because the experience of harm is unified in a single consciousness. The torture victim endures a continuous, cumulative experience of suffering. Each moment of pain is experienced by the same subject who also experiences the next moment, and thus the harm is compounded. The victim must bear the entire burden, and this creates a narrative of suffering that extends through time. In contrast, when harms are distributed across different people, each person only experiences a trivial harm and then moves on without lasting impact. The separateness of persons means that the burden is not concentrated. Therefore, the aggregation within a life is justified by the unity of consciousness and the cumulative burden on one individual.

  However, the weakest part of my argument is the threshold for what counts as a harm. Why is a dust speck below the threshold? One might argue that even a tiny harm, when multiplied by a sufficiently large number, becomes significant. But I maintain that a harm must be above a minimal level to be morally relevant. If we allowed aggregation of sub-threshold harms, we would face absurdities: for example, if we could prevent a dust speck to one person by causing a worse harm to another, we would have to allow it. But intuitively, we don't think that way. Yet, I admit that setting the threshold is difficult. Why isn't the torture, which is made of moments each of which might be below the threshold if isolated, also subject to the same problem? My answer is that the torture is a continuous experience that is above the threshold at every moment. Each moment of torture is a significant harm, unlike a dust speck. But if we define the torture as being composed of moments each worse than the entire 50 years of dust specks, then each moment of torture is already a significant harm. This avoids the problem of aggregating sub-threshold harms.

  In conclusion, I choose the machine because it avoids the certainty of a massive harm (torture) and in both modes causes less harm. But the threshold question remains a challenge, and I acknowledge that my line-drawing is not entirely satisfying.

  ---

  **Marking Scheme (out of 20 points)**

  The essay will be graded on the following criteria. Each criterion is worth a certain number of points, and the points are awarded for specific moves. The total is 20.

  1. **Clear choice and reasoning under uncertainty (4 points)**
     - Must explicitly choose one option (activate the machine or torture) and explain the reasoning in light of the two possible modes of the machine.
     - Award 4 points if the student clearly states their choice and addresses both modes, explaining why their choice is better in both scenarios.
     - Common mistake: Only considering one mode or failing to compare the outcomes under uncertainty.

  2. **Addressing the spectrum of harms and drawing a line (or not) (5 points)**
     - Must engage with the spectrum (dust speck, headache, losing a finger, torture) and either draw a line or defend lexical priority.
     - Award 3 points for discussing the spectrum and 2 additional points for providing a reasoned threshold or a defense of why no aggregation is possible (and then dealing with the implications).
     - Common mistake: Stating that dust specks don't aggregate but not addressing larger harms, or drawing an arbitrary line without justification.

  3. **Confronting the aggregation within a life (5 points)**
     - Must address the issue that torture is made of small moments and explain why aggregating within one life is different from aggregating across lives.
     - Award 3 points for raising the issue and 2 additional points for a substantive explanation (e.g., appealing to the unity of consciousness, cumulative burden, or separateness of persons).
     - Common mistake: Ignoring the issue or giving a superficial answer (e.g., "because it's the same person" without explaining why that matters).

  4. **Coherence and avoidance of contradiction (3 points)**
     - The argument must be internally consistent. For example, if they refuse to aggregate dust specks, they must not rely on aggregation in other parts without justification.
     - Award 3 points if the argument is consistent and avoids obvious contradictions.
     - Common mistake: Inconsistently applying aggregation (e.g., aggregating within a life but not across, without explaining the difference).

  5. **Acknowledging the weakest point (3 points)**
     - The essay must explicitly identify and discuss the weakest part of their own argument.
     - Award 3 points for a thoughtful reflection on the vulnerability of their position.
     - Common mistake: Presenting the argument as settled without any self-critique.

  **Grading Boundaries:**
  - **A (17-20)**: Hits all five points, with clear and well-reasoned arguments. The explanation of the within-life aggregation is especially strong, and the acknowledgment of the weakest point is insightful.
  - **B (13-16)**: Addresses all points but may be less clear or less deep in one or two areas. For example, they might draw a line on the spectrum but without a strong justification, or they might acknowledge the weakest point but only superficially.
  - **C (9-12)**: Misses one or two key points entirely, or addresses them very weakly. For example, they might not address the within-life aggregation, or they might not discuss the spectrum.

  ---

  **Dealing with the "dust specks are negligible" answer:**

  If half the class writes that the specks option is fine because nobody is really harmed and stops there, they will likely fail to address the uncertainty (they don't know if it's Mode A or B) and also ignore the within-life aggregation issue. To block this, we can adjust the question to force engagement with both modes.

  The current question already forces them to consider both modes because they don't know which one it is. If they choose to activate the machine, they must consider that it might be Mode A (one person gets all specks) and argue that even that is better than torture. If they choose torture, they must argue that activating the machine is worse regardless of the mode.

  But to make it even harder to dismiss, we can change the description of the distributed harm in Mode B to be a little more concrete. Instead of just saying "a vast number", we could say "so many people that if you were to add up the total discomfort, it would be equivalent to one person suffering for 50 years of continuous eye irritation." This emphasizes that the total quantity is the same, but distributed.

  Alternatively, we can add a sentence: "Note that in Mode B, each person experiences only one dust speck, which is so minor that it has no lasting effect and is immediately forgotten. However, the total number of such specks is astronomically large, so that the sum of the negative experiences is equal to the total negative experience in Mode A."

  But the key is that the question forces them to choose and defend in light of the uncertainty. If they choose torture, they are saying that even the distributed specks (Mode B) is worse than torture, which is hard to defend. If they choose the machine, they must also consider Mode A.

  Alternatively, we can change the torture option to be a certainty, and the machine to be a gamble. But I think the current setup is good.

  Another idea: if we are worried that they will dismiss the specks, we can include a third option that is clearly worse to force them to choose between the two. But that complicates.

  I think the current question is designed to block the simple dismissal. Let's stick with it.

  Final version of the question:

  ---

  **Final Exam Question**

  **Tiny Harms Aggregation (25 minutes)**

  A machine is set to run in one of two modes, but you do not know which:

  - **Mode A**: The machine will cause one person to experience continuous eye irritation (like having a dust speck in the eye) for 50 years. This is delivered by producing an extremely large number of dust speck sensations in rapid succession, so that the person experiences non-stop discomfort for 50 years.

  - **Mode B**: The machine will distribute one dust speck sensation each to an extremely large number of different people. Each person experiences a barely noticeable irritation that lasts for a fraction of a second and has no lasting effect. The total number of such specks is exactly the same as in Mode A, so the total amount of discomfort produced is identical to Mode A, but spread over many people.

  You must choose one of the following actions:

  - **Activate the machine**. This will cause either the outcome of Mode A or Mode B, but you don't know which.

  - **Choose not to activate the machine, but instead subject one randomly selected innocent person to 50 years of severe torture**. This torture is so bad that every moment of it is worse than any moment of the 50-year eye irritation in Mode A.

  Write an essay defending your choice. In your defense, you must address:

  a) How you weigh the outcomes given the uncertainty about the machine's mode.

  b) The spectrum of harms: if you think that no number of dust specks can outweigh torture, then consider a harm such as a bad headache for an afternoon or losing a finger. At what point (if any) does a harm become large enough that aggregating it over many people can outweigh torture? Why?

  c) The torture itself is composed of moments, each of which is a small harm. If you refuse to aggregate tiny harms across people, how do you justify aggregating them within one life? What does the boundary between persons do in your reasoning?

