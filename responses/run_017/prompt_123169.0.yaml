answer: |-
  ### Exam Question Handout

  **Tiny Harms Aggregation Final Exam Question**  
  **Time Allotment:** 25 minutes  
  **Points:** 20  

  **Scenario:**  
  A machine is set to run in one of two modes, but you do not know which mode is active:  
  - **Mode A:** The machine delivers an extremely large number of barely noticeable annoyances (e.g., a dust speck in the eye lasting a fraction of a second) to a **single person**. This person experiences continuous discomfort for 50 years due to the rapid succession of specks.  
  - **Mode B:** The machine delivers the **same total number** of annoyances to a vast number of different people, with each person receiving **exactly one speck**. No individual experiences more than a fleeting, trivial irritation.  

  You must choose one of two actions:  
  1. **Activate the machine**, resulting in either Mode A or Mode B (you don’t know which).  
  2. **Reject the machine**, but instead subject one randomly selected innocent person to 50 years of severe torture. Assume the torture is so horrific that any single moment of it is worse than the entire 50 years of Mode A’s discomfort.  

  **Your Task:**  
  Defend your choice in an essay. You must address all three points below. Your argument must commit to one action—do not "discuss both sides."  

  a) **Uncertainty:** Explain your choice given that you don’t know whether the machine is in Mode A or Mode B. Why is your chosen action preferable in both scenarios?  
  b) **Threshold:** If you reject aggregation for dust specks, consider a spectrum: a dust speck → a headache lasting an afternoon → losing a finger → torture. At what point (if any) does a harm become large enough that aggregating it over many people outweighs torture? Defend your threshold (or explain why no threshold exists).  
  c) **Personal Boundary:** Torture is a sequence of momentary harms, each small when isolated. If you refuse to aggregate tiny harms across persons, why is aggregating them within one life (e.g., the torture victim) acceptable? What does the boundary of a person *do* in your reasoning?  

  ---

  ### Model Answer (Approx. 700 words)  
  I choose to **activate the machine**. My decision rests on three pillars: the lesser harm under uncertainty, a defensible threshold for aggregation, and the moral significance of personal boundaries. I conclude that activating the machine minimizes harm whether in Mode A or B, but I acknowledge weaknesses in how I set the threshold.  

  First, **uncertainty demands I compare outcomes for both modes**. If I reject the machine, I cause 50 years of torture—a catastrophic harm. If I activate it:  
  - In **Mode A**, one person endures 50 years of eye irritation. Though severe, this is less bad than torture because torture’s every moment exceeds Mode A’s totality.  
  - In **Mode B**, countless people each suffer one dust speck. I argue this distributed harm is negligible: each speck is imperceptible in daily life, forgotten instantly, and causes no disruption.  
  Thus, activating the machine avoids torture in both cases: Mode A delivers a lesser concentrated harm; Mode B delivers no meaningful harm at all. Choosing torture would knowingly inflict maximum suffering when a less harmful alternative exists.  

  Second, **I draw a threshold for aggregation between a headache and a dust speck**. No number of dust specks outweighs torture because specks fall below a minimum harm threshold. A harm must be perceptible, memorable, and disruptive to "count" morally. Dust specks fail this: they don’t alter well-being. But a headache for an afternoon meets the threshold—it causes pain, distracts from tasks, and is unpleasant enough to remember. Aggregating headaches across millions could outweigh torture, as the cumulative disruption (e.g., lost productivity, compounded suffering) becomes significant. Losing a finger is further above the threshold, making aggregation easier to justify. I reject lexicality (where small harms never outweigh large ones) because it’s arbitrary: if torture outweighs a billion headaches, we ignore tangible societal costs. The threshold isn’t arbitrary—it’s based on harm’s *impact*, not size.  

  Third, **aggregating within one life is justified by personal identity**. Torture’s moments are aggregated because they occur within a single conscious entity that experiences them as a unified narrative. This continuity magnifies harm: the victim accumulates trauma, dread, and brokenness over time. Conversely, Mode B’s specks are dispersed across disconnected individuals. No person bears a burden beyond a trivial blip, and no shared narrative emerges. The personal boundary matters because it defines where suffering becomes "owned." Without it, we ignore how harm shapes a life’s entirety—e.g., torture destroys a person’s future, while specks don’t alter any life.  

  **Weakest link:** My threshold argument. Defining a harm as "memorable" or "disruptive" risks subjectivity. Why is a headache memorable but not 1,000 specks to one person? If specks amass into years of irritation (Mode A), they become memorable, but I still rate them below torture. This inconsistency exposes a flaw: if I set the threshold at perceptibility, torture’s moments are perceptible, but specks are too. I salvage this by emphasizing *degree*—torture’s moments are intense harms, while specks are not—but this feels ad hoc. Ultimately, my threshold relies on intuition, not a clear principle.  

  ---

  ### Marking Scheme (20 points total)  
  **A (17–20):** Hits all 5 must-hit points with clarity and depth.  
  **B (13–16):** Addresses all points but with gaps (e.g., superficial treatment of personal boundaries or threshold).  
  **C (9–12):** Misses 1–2 key points or contradicts themselves.  
  **D/F (0–8):** Fails to commit to a choice, ignores uncertainty, or omits multiple sections.  

  | Points | Must-Hit Point                                                                 | How to Earn Points                                                                                                | Common Mistakes (Cost Points) |  
  |--------|---------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------------------------------|--------------------------------|  
  | **4**  | **Commitment under uncertainty**                                                | Chooses one action and explains why it’s better in **both** Mode A and B.                                         | Only analyzes one mode; ignores the torture alternative. |  
  | **5**  | **Threshold defense**                                                           | Sets a clear threshold (e.g., headaches count, specks don’t) OR defends lexicality; explains *why* (e.g., harm’s impact). | Arbitrary line ("I just feel headaches matter"); ignores the spectrum. |  
  | **5**  | **Personal boundary argument**                                                  | Explains why aggregating within one life differs from across lives (e.g., unified consciousness, narrative harm). | Superficial answer ("it’s the same person"); ignores torture’s momentariness. |  
  | **3**  | **No contradiction**                                                            | Avoids inconsistency (e.g., if rejecting aggregation, doesn’t use it in uncertainty argument).                     | Inconsistent threshold (e.g., specks don’t count unless concentrated). |  
  | **3**  | **Self-critique**                                                               | Identifies and discusses the weakest part of their argument (e.g., threshold vagueness).                         | No critique; presents position as settled. |  

  **Why B vs. A?**  
  - A **B answer** (13–16) hits all points but lacks depth in one area—e.g., defines a threshold but doesn’t explain *why* headaches count, or mentions personal boundaries without tying them to cumulative harm.  
  - An **A answer** (17–20) interconnects all points (e.g., uses the threshold to justify the uncertainty choice, and links personal boundaries to the torture’s structure).  

  ---

  ### Blocking the "Specks Are Negligible" Answer  
  **Problem:** If students dismiss Mode B as "harmless" and ignore the rest, they’ll fail on uncertainty (Mode A) and the boundary issue.  
  **Solution:** The question already blocks this by:  
  1. **Forcing Mode A confrontation:** Choosing the machine risks one person suffering 50 years of irritation. If a student claims specks are negligible, they must still argue why Mode A is better than torture.  
  2. **Emphasizing equivalence:** The handout states the total harm in Mode A and B is identical (just distributed differently). Students can’t trivialize Mode B without addressing why the *same total harm* becomes unacceptable when concentrated.  
  3. **Mandating all sections:** Part (c) forces them to reconcile their view with torture’s momentary harms.  

  **Why not "block harder"?** Explicitly dismissing the "negligible" view (e.g., "Assume dust specks cause real harm") would bias the question. The current phrasing preserves neutrality while making superficial answers unsustainable. If half the class writes "Mode B is fine," they’ll lose points on uncertainty (ignoring Mode A) and self-critique (failing to question their threshold).  

  **Grading tip:** In feedback, note that calling specks "harmless" doesn’t resolve Mode A or torture’s momentariness—this is where B/C answers stumble.
