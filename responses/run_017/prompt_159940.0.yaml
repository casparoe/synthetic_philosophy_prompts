prompt: |-
  I run a reading group on promissory obligation, and the argument has been going round in circles for a year, so I want a diagnosis rather than a verdict. One camp says the practice does the work: to promise is to invoke a social institution with a point — giving others reliable assurance about one's future conduct — and the obligation is to do what that institution, properly described, requires; whether keeping the promise does anyone any good is beside the point, and the wrong in breaking it is infidelity rather than harm. The other camp says a practice can only ever be a transmission mechanism: what matters is that the promisee has been given a normative power over the promiser's conduct, or that there is something intrinsically bad about being let down by someone one trusted, so a promise no one relies on, or whose keeping benefits no one, raises a quite different question. I am not asking about contracts or legal enforcement.

  My hypothesis is that these are not two answers to one question. One camp is asking what the practice we actually have requires of someone who has invoked it; the other is asking what would make such requirements genuine moral requirements rather than conventions. Each side slides between the two, so every exchange stalls: one side produces cases where the practice's rules and morality come apart, the other replies that those are cases where the practice has been misdescribed, and neither point is one the opposition ever denied. Behind that I suspect a further disagreement nobody argues for — about whether an act of will can generate a reason at all.

  Test it against a case I think neither side handles well. Call it the disowned promise: before Alf says anything, Bea tells him that she does not accept promises, does not want that kind of claim on him, and will not recognise one if he makes it. Alf promises anyway. Later Bea finds she has relied, is let down, and resents it. Is there a promissory obligation here, and if not, what is left? Now vary one feature: the same disclaimer, but the two have for years relied on each other's bare word, and Bea knows she will rely again.

  What kind of disagreement is this actually — verbal, a dispute about which cases count as data, or bedrock intuitions about the authority of the will? And given your diagnosis, what would count as progress? I would rather have a distinction that dissolves part of it, or an argument that no convergence should be expected, than another survey of the two positions.
reasoning: |-
  Hmm, the user runs a reading group on promissory obligation that's been stuck in a circular debate for a year. They're frustrated and want a diagnostic analysis rather than another verdict on which position is correct. 

  The two camps they describe are classic practice-based vs. power-based theories of promising. The practice camp sees obligation as arising from institutional rules (infidelity as wrong), while the power camp sees it as flowing from normative relationships (harm/disappointment as wrong). The user suspects these aren't actually addressing the same question - one is about descriptive practice requirements, the other about moral foundations. 

  Their proposed test case is brilliant: Alf promises despite Bea's explicit rejection of promissory claims. This exposes fault lines in both theories. The practice view struggles because Bea opted out of the institution, while the power view falters because she didn't grant normative power. The variation with longstanding reliance adds delicious complexity - it suggests obligation might emerge from patterns of behavior despite formal disclaimers.

  What the user really needs is:
  - Confirmation that their "different questions" hypothesis holds water
  - Analysis of why standard arguments talk past each other
  - Insight into the underlying will/reason metaphysics dispute
  - Practical suggestions for moving the group beyond stalemate

  The emotional subtext suggests intellectual exhaustion - they've heard all the standard arguments and want someone to map the battlefield's actual topography. The request for "what counts as progress" reveals pedagogical concern: they want to salvage the group's discussions.

  Key observations:
  1) The camps do fundamentally diverge on whether obligation requires institutional participation (practice view) or normative uptake (power view)
  2) Their deadlock stems from conflating conceptual analysis with moral justification
  3) The will/reason question is indeed the buried landmine - can sheer commitment create reasons?
  4) Progress might come from: a) separating "promise" as term-of-art vs moral concept b) examining borderline cases like disowned promises c) exploring historical context of will-based obligation theories

  The disowned promise case is perfect because it breaks both models cleanly. In the variation, the practice view might salvage obligation through implied consent, while the power view might appeal to reasonable expectations - but both become strained. This reveals the need for either a hybrid theory or clearer meta-ethical framing.

  For moving forward, I should emphasize analytical tools over solutions: teach them to spot when arguments shift between descriptive/conceptual/normative registers, and suggest reading materials that explicitly address the will/reason connection (maybe Scanlon's hybrid approach or historical texts on vow-making).
answer: |-
  Your diagnosis is perceptive: **this is not one debate but two distinct layers of inquiry that are being conflated**, leading to persistent stalemate. The "disowned promise" case brilliantly exposes this. Here's the breakdown, why progress stalls, and paths forward:

  ### 1. The Core Conflation: Two Different Questions
  - **Camp A (Practice/Institution):** Asks a *conceptual/sociological question*:  
    *"What does our actual social practice of 'promising' require of participants, given its function of providing reliable assurance?"*  
    **Focus:** Internal rules of the convention. Wrong = *Infidelity to the institution's norms*.
  - **Camp B (Normative Power/Relational Harm):** Asks a *moral foundation question*:  
    *"What moral reasons (if any) does a promise create, independent of social convention?"*  
    **Focus:** Underlying moral psychology/obligation. Wrong = *Violating autonomy, causing harm via betrayal, or failing a moral duty created by commitment*.

  **The Stalemate Mechanism:**  
  - When Camp A cites a case where the practice's rules create obligation despite no harm/reliance (e.g., a secret, unrelied-upon promise), Camp B says: *"That's not morally binding, only conventional!"*  
  - When Camp B cites a case where harm/betrayal exists without formal promise (e.g., implicit assurances), Camp A says: *"That's not promising—it's a different practice!"*  
  - **Result:** Both are right *on their own terms*, but talk past each other. Neither denies the other's point; they simply care about different projects.

  ### 2. The "Disowned Promise" Test & What It Reveals
  - **Case 1 (Explicit Disclaimer):**  
    - **Camp A:** *No promissory obligation.* Bea explicitly opts out of the institution. Alf's utterance is invalid—like trying to "play chess" with someone who refuses the rules. The practice requires uptake.  
    - **Camp B:** *Likely no obligation, but not for institutional reasons.* Bea denied Alf the normative power to bind himself to her. His act lacks moral force. Her *resentment* stems from broken trust in *his character* (e.g., "He said he'd do it!"), not from a promissory obligation.  
    **Agreement on outcome, different reasons.**  
  - **Case 2 (Disclaimer + History of Reliance):**  
    - **Camp A:** *Still no promissory obligation* (Bea rejected the institution). But Alf may have created obligation via a *different* practice (e.g., "assurance-giving" or "commitment-making") with its own rules.  
    - **Camp B:** *Obligation likely exists, but not "promissory".* The history creates reasonable reliance/expectation. Alf's "promise" reinforces this, making his failure a betrayal of *trust*, even if Bea disclaimed the formal label.  
    **Disagreement sharpens:** Camp A sees no promise, Camp B sees moral obligation *like* promise but rooted in reliance/autonomy.

  ### 3. The Deeper Bedrock: The Authority of the Will
  Your suspicion is correct. The unresolvable core is **metaphysical**:  
  - **Can an act of will (like a promise) create a *new*, content-independent moral reason?**  
    - Camp A (Practice): *No.* Reasons derive from the practice's function/rules. The will only triggers institutional norms.  
    - Camp B (Power/Relational): *Yes.* The promisor's will transfers normative authority or creates a relational bond that itself generates reasons.  
  **This is not about "intuitions" but about fundamental commitments in moral philosophy:** Is morality solely about welfare, autonomy, and existing duties (Camp B's focus), or can social constructs *create* new moral facts through collective intentionality (Camp A's focus)?

  ### 4. Diagnosing the Disagreement Type
  - **Not merely verbal:** Both use "promise" to refer to a deliberate commitment, but differ on its *source of normativity*.  
  - **Not just about data:** Cases are interpreted through incompatible frameworks.  
  - **Bedrock:** A clash of **meta-ethical commitments** about:  
    - The moral relevance of social practices.  
    - The power of the will to create obligations *ex nihilo*.  
    - Whether "obligation" must reduce to harm/autonomy or can be practice-internal.

  ### 5. Paths to Progress (Without Forcing Consensus)
  Focus on **disambiguation** and **framework articulation**:
  1. **Map the Two Projects Explicitly:**  
     - Distinguish:  
       (a) *Descriptive/Conceptual Analysis:* "What is our practice of promising, and what does it require?"  
       (b) *Moral Justification:* "Why (if ever) should we keep promises? What moral work does promising do?"  
     - Agree that answers to (a) don't settle (b), and vice versa.

  2. **Reframe Cases Using the Disowned Promise:**  
     - Ask: *"Is Alf *culpable*? If so, is it because he broke a promise, or something else (dishonesty, unreliability)?"*  
     - This separates *institutional validity* from *moral blameworthiness*.

  3. **Surface the Meta-Ethical Commitment:**  
     - Have each side articulate: *"Must all moral obligations ultimately reduce to welfare, autonomy, or harm-prevention? Or can practices create *sui generis* obligations?"*  
     - This exposes why Camp B thinks Camp A is "fetishizing rules," and Camp A thinks Camp B is "reducing promise to reliance."

  4. **Seek Hybrid Insights:**  
     - Explore theories that *bridge* the gap (e.g., Scanlon’s *Principle F*: Breaking a promise is wrong because it violates a principle no one could reasonably reject, given our interest in assurance).  
     - Or Raz: Promises derive force from the value of the *practice* (assurance), but the obligation is moral, not merely conventional.

  5. **Accept Irreducible Pluralism:**  
     - Conclude that promising serves **two distinct functions** that may not fully harmonize:  
       - *Assurance-Giving* (Social/Functional)  
       - *Moral Bond-Creation* (Interpersonal/Normative)  
     - Some "obligations" may exist only within one framework.

  ### What Counts as Progress?
  - **Clarity:** Group members consistently classify arguments as addressing *conceptual practice* vs. *moral foundations*.  
  - **Nuance:** Recognizing that "obligation" in the disowned case might be:  
    - *Institutionally invalid* (Camp A)  
    - *Morally unjustified* (Camp B)  
    - But Alf may still be blameworthy for *misleading Bea* or *exploiting her reliance*.  
  - **Meta-Agreement:** Acknowledging that the dispute hinges on unresolvable views about the will's moral power, not misreading cases.  
  - **New Questions:** Shifting from "Who's right?" to "What work do we *want* 'promising' to do in our moral lives, and what institutional design best achieves that?"

  **In essence:** The impasse is real because it reflects a fundamental divide in moral philosophy. Progress lies not in choosing a camp, but in rigorously separating the layers of inquiry and understanding why the other camp's answers seem plausible *within its own framework*. The disowned promise case doesn't resolve the debate—it illuminates its structure. Your group may not converge, but it can argue more productively by diagnosing *which* question is being asked at any moment.
