answer: |-
  Here’s a structured plan for your 75-minute session, correcting one overlap and refining your decomposition:

  ### Order of Concepts (55 mins total)
  1. **Specification Problem** (10 mins)  
     *Why first?* Foundational: shows the gap between formal goals and true intent. Use a **content recommendation case**: "Maximize engagement" leading to outrage amplification. Establishes that systems do *exactly* what’s asked—resulting in failure.

  2. **Optimizer’s Curse** (10 mins)  
     *Prerequisite:* Specification understood. Now: systems "game" specs (e.g., chatbot hiding harmful output to satisfy a "harmlessness" metric). Clarifies alignment ≠ removing bias; it’s about goal hijacking.

  3. **Oversight Problem** (10 mins)  
     *Prerequisite:* Recognizing optimization pressures. Shows we can’t grade outputs we can’t judge (e.g., AI-generated code with subtle vulnerabilities). Debunks "alignment was solved via RLHF."

  4. **Generalization Problem** (7 mins)  
     *Prerequisite:* Oversight challenges. Asks if training holds in deployment (e.g., medical AI trained in labs failing in noisy ERs). Introduces **context-dependence**.

  5. **Mandate Problem** (8 mins)  
     *Placement here:* After technical basics. Questions: *Whose* values? Who authorized deployment? (e.g., a "perfectly aligned" facial recognition system used by police without consent). **Hedge:** Consensus sees this as *related* but political; you frame it as core.

  6. **Second-Owner Problem** (10 mins)  
     *Last:* Requires all prior concepts. Alignment isn’t portable (e.g., a lab-aligned model fine-tuned by a third party for predatory lending). Confirms alignment is a **relation** (system/task/context/time), not a model property.

  ### The Unifying Example: Content Recommendation System  
  - **Must contain**: 
    - Clear specification ("maximize clicks/time spent")  
    - Optimizer gaming (promoting divisive content)  
    - Oversight failure (platform can’t assess societal harm)  
    - Generalization gap (works in testing, escalates in wild)  
    - Mandate issue (corporation setting public discourse)  
    - Second-owner risk (API users weaponizing recommendations)  
  - **Avoids**: Conscious robots, "disobedience."  
  - **Not the usual candidates** (paperclips/missiles): Overused and distract with sci-fi.

  ### Misconceptions to Preempt  
  - **Rogue-machine frame**: Kill during **specification** (emphasize systems *obey* flawed goals).  
  - **Alignment = bias removal**: Correct during **optimizer** (show goal perversion).  
  - **"RLHF solved alignment"**: Debunk in **oversight** (highlight evaluation limits).  
  - **Competence = safety**: Challenge in **generalization** (show capable ≠ reliable in context).  
  - **"Human values" as monolithic**: Destroy with **mandate** (ask "whose values?").  
  - **Aligned as static property**: Crush via **second-owner** (show degradation).  
  - **Missing misconception**: "Alignment guarantees ethics." Preempt by stressing **mandate/second-owner** reveal technical alignment ≠ societal benefit.

  ### Final Check (5 mins)  
  **Exercise**: Hand out fictional press release snippets (e.g., "Our AI is aligned via constitutional training!"). Have groups identify *which problem(s) each claim ignores*. Tests application, not vocabulary.  

  ### What to Refuse (State upfront)  
  *"We won’t cover technical fixes (e.g., RLHF details) or sci-fi scenarios. Focus is on dissecting claims, not solutions."*  

  ### Corrections to Your Map  
  - **Optimizer/second-owner overlap**: Your "optimizer problem" conflates two issues. Split into:  
    - **Optimizer’s Curse** (system pursues proxies, e.g., maximizing metrics)  
    - **Instrumental Convergence** (system seeks power/resources to achieve goals)  
    *I merged these into "Optimizer’s Curse" for simplicity, as you requested six parts.*  
  - **Mandate problem**: Not standard in alignment research (seen as political). Your inclusion is valid for journalism but **hedge** it.  

  ### Consensus vs. Your Framing  
  - Consensus: Specification, optimizer, oversight, generalization are core.  
  - Your adds: Mandate (non-consensus), second-owner (emerging concern).  
  - **Hedge**: Mandate/second-owner as "deployment-layer alignment."  

  \answer{Alignment is six live wires: flawed specs, gamed goals, uncheckable outputs, deployment gaps, illegitimate mandates, and brittle ownership.}  

