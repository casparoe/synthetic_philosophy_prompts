answer: |-
  **Critical Comments on Draft**

  **§1–2: Fairness to dialectic**  
  Accuracy: Your Thomson reconstruction correctly identifies the settling premise as requiring either a last flip or a final interval. (High)  
  *But* Benacerraf-style replies *do* address "why" gaps arise: through underspecification in the mathematical model. Your claim that they don't explain "why" may overstate novelty. (Medium)  

  **§3: Load-bearing premise**  
  The indispensable claim is: **"smoothing is the operation that turns a non-convergent two-valued history into a convergent magnitude"** (end of §3). Without this link between relaxation and limit production, the malignancy diagnosis fails. (High)  
  *If convergence holds only for some schedules*: Your proposal survives weakly. Duty-cycle dependence (§3a) shows convergence isn't universal, but if *some* schedules converged to {0,1}, the idealization might not always delete limits. The core argument requires only that τ=0 *can* destroy limits. (Medium)  

  **§4: Circularity and overreach**  
  *Circularity?* No. The Constraint doesn’t presuppose a terminal fact *must* be a limit; it asserts that *if an argument queries a terminal fact*, idealizations must preserve relevant limits. Thomson queries brightness at t=1, so the constraint targets that. (High)  
  *Overreach?* **"Condemn idealizations... point masses"**: Yes. A point mass in orbital mechanics preserves limits of *position/velocity* (queried quantities), so passes. But frictionless constraints *fail* for dissipation-dependent queries (e.g., entropy production at t=∞). Your constraint *correctly* flags this if entropy is queried. (High)  

  **§5: Vagueness vs. gap**  
  **" 'on' is a vague sentence"** does genuine work. Benacerraf identifies a *model-relative gap*; you reframe it as *predicate vagueness applied to a sharp physical magnitude*. This explains why stipulation feels inappropriate (it changes the subject) and why changing descriptors resolves it. It’s not merely relabeling. (Medium)  

  **§6: Extension to computation**  
  Strongest objection: **"output is not the limit of anything"** assumes computational states are discrete and lack continuity. But if the machine’s state (e.g., voltage levels) evolves continuously via relaxation (like §3), the *physical state* has a limit that *might* determine a discrete output (e.g., via thresholding). Your dismissal ignores this possibility. (High)  

  **§0–4: Non-physical objections omission**  
  Strongest objection: Supertasks require "completing" an infinite series, which is metaphysically impossible (e.g., requires actual infinity, which nominalists reject). §§2–4 **merely restate** your position: they assume the schedule is coherent and address only *how* terminal states are determined. They don’t engage the deeper impossibility claim. (Medium)  

  **Least confident**  
  Claim: **Frictionless constraints fail the Limit Preservation Constraint only for dissipation-dependent queries** (in §4 comment).  
  What would settle: A case where frictionless constraints are used in an argument querying a *non*-dissipative quantity (e.g., final position in an elastic collision) but still produce paradox by deleting a limit. If found, it would show overreach.
