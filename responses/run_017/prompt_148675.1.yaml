prompt: |-
  Me and my mate Dave had a three-hour argument in the pub last night about where the line between history and pseudohistory actually goes, and I've come away realising I've got a whole pile of verdicts and no principle behind them. Dave's position — which I think is bollocks but I couldn't say why — is that it's purely sociological: pseudohistory is just what the people with jobs in history departments say is pseudohistory, and Fomenko only counts as a crank because he isn't one of them. I don't believe that, because I've got cases going both ways. But I also can't get my own test to work. The test I've been using goes: a claim is pseudohistory if its defenders have a move that converts every apparent refutation into more evidence — forgers, suppressed excavations, the dating is wrong, the mainstream won't look — so there's no state of the evidence that would get them to stop. Call it the no-way-out test. My second idea, which I like less, is about scope: crank theories never stop, they promise to rewrite everything, whereas real revisionism changes one thing and leaves the rest of the furniture where it was. I'm not sure that's more than a vibe, and it may just be a proxy for how big the claim is, which can't be right either.

  Here are the verdicts I'm stuck with. (A) Fomenko: as I understand it, roughly everything before the year 1000 is a phantom duplicate of later history, arrived at by running statistical comparisons over king-lists and eclipse records. Obviously crank — and I want to say more than 'false': something about the method is rotten before you even check the answer. (B) Ancient aliens: the pyramids and the Nazca lines needed outside help. Crank, and I also think part of what's wrong with it is moral — it's a refusal to credit people four thousand years ago with being able to organise anything, which makes me suspect demarcation isn't purely epistemic, though I'd rather it were. (C) A visiting professor my girlfriend's department takes the piss out of: the Pictish symbol stones are a complete writing system and the Picts taught literacy to Ireland. Immaculate footnotes, and he does concede individual readings when people push him, but the headline conclusion has never moved in twenty years and every claim happens to land in the direction of national prestige. I call him a crank. (D) A retired surveyor who reckons every parish church in the county sits on a prehistoric grid; when three turn out to be off it, he says those three were rebuilt. Crank. (E) A local amateur who argued in the eighties that our abbey's foundation charter is a twelfth-century forgery. The professionals scoffed, and then a copy in a cartulary turned up with a witness list that can't be earlier than about 1180, so he was right. I want to say it was a real hypothesis all along — but note he was an outsider, he was claiming the documents are fakes, which is exactly the move in my no-way-out test, and the only difference I can find between him and (D) is that he turned out to be right, which is cheating. (F) Two cases from measuring stones: a retired engineering professor who surveyed hundreds of circles and found they all used one unit (the megalithic yard, I think) — crank, and as far as I can tell nobody in archaeology takes it seriously now; versus the passage at Maeshowe lining up with the midwinter sunset — perfectly respectable. Same evidence type, opposite verdicts, and I can't tell you how many coincidences have to pile up before a pattern becomes a pattern. (G) A real professor with a university press book arguing that all the silver in late Anglo-Saxon coinage came from a single Alpine mine. I think it's probably wrong. It is not pseudohistory. (H) One I go back and forth on: my flatmate's mate, a metal detectorist, says the hoard he found was a ritual deposit rather than someone's savings buried in a hurry. Half the time I think that's just I found something lovely and now I want it to be religious; half the time I think it's an ordinary inference from where the stuff was lying. (I) One more: my girlfriend's own thesis, that a whole genre of early medieval saints' lives was written by women. She'd be delighted if it were true and she cares because of a political commitment. I do not think that's crank. But I cannot see what separates it from (C), except that I happen to agree with it.

  So: can you give me one principle, or at most two, stated precisely enough that I could apply it cold to a case I haven't seen — with a line on which of my cases motivates each clause, what it says about (H) and (I), and a straight answer about which of my verdicts it forces me to drop? Please also invent one new case yourself and tell me what your principle says about it, ideally the kind of case that shows where it would embarrass me. It can't smuggle in turned out to be true, for the reason in (E): that's no use on a live case and it would make (E) and (D) differ only by luck. And I'd like a sentence or two about what I should have said to Dave when he said it's all just who's in the club — I'm fairly sure (C), (E) and (G) together sink that, but I couldn't argue it properly at the time and he's going to bring it up again on Friday.
reasoning: |-
  Okay, let me try to unpack this user's query. They had a long argument with Dave about pseudohistory versus real history. Dave thinks it's all about who's in the academic club, but the user disagrees and wants a solid principle to distinguish them. They provided several examples (A through I) where they've made judgments but can't find a consistent rule. Their "no-way-out test" and "scope" idea haven't worked perfectly. 

  First, I need to understand each case. Fomenko (A) reshuffles history using stats but ignores counter-evidence. Ancient aliens (B) discredits ancient peoples' capabilities. The Pictish stones professor (C) has fixed conclusions despite evidence. The parish grid surveyor (D) adjusts his theory when churches don't fit. The abbey charter forger (E) was an outsider proven right later. The engineering professor (F) with the megalithic yard is rejected, while Maeshowe's alignment is accepted. The Alpine silver mine theory (G) is probably wrong but legitimate scholarship. The metal detectorist (H) interprets a hoard as ritual, which might be biased. The user's girlfriend’s thesis (I) about female-authored saints' lives has political motivation but isn't crank.

  The user wants a principle that doesn't rely on truth outcomes (since E succeeded by luck) and handles insider/outsider status neutrally. Their frustration with Dave's sociological argument needs addressing—cases like C, E, G show credentials aren't the issue. 

  Looking at patterns: Pseudohistory often immunizes itself against counter-evidence (A, C, D), makes vast claims (A, B), or has non-epistemic motives like nationalism (C) or diminishing past cultures (B). Legitimate work adjusts to evidence (E eventually validated, I open to scrutiny), focuses on specific claims (G), and methods are transparent (Maeshowe's alignment). 

  So the core issues seem to be: How theories respond to counter-evidence, their scope, motivations, and methodological rigor. But need one primary principle. Falsifiability is key, but Popper's version is too simplistic. Instead, emphasizing how evidence is handled—whether negative results update the theory or are dismissed via immunizing moves. 

  Combining that with scope: Pseudohistory often rewrites everything (A, B), while real revisionism is localized (E, G). Also, non-epistemic motivations can corrupt methods (C's nationalism, B's ethnocentrism). 

  The proposed principle: Pseudohistory systematically avoids falsification by reinterpreting all counter-evidence as confirmation, often driven by non-epistemic motives and making vast, totalizing claims. Legitimate history is testable—specific evidence could disprove it, and it doesn't dismiss counter-evidence arbitrarily. 

  Applying this: A, B, C, D fit pseudohistory (immunizing moves, vast scope). E is legit because he accepted the cartulary find. F's megalithic yard ignores variations, while Maeshowe's alignment is testable. G is falsifiable (e.g., finding non-Alpine silver). H depends on whether the detectorist ignores contrary evidence. I is testable via textual analysis. 

  For Dave: Cases E (outsider right) and C (insider crank) show it's not about credentials. G is credentialed but could be wrong legitimately. The demarcation is methodological, not social. 

  New test case: Someone claims Atlantis was in Antarctica, ignoring ice core data by saying "it melted." Classic immunizing move, pseudohistory. 

  User might need to drop verdict on H if no immunizing moves are present, or clarify I's method. The principle forces consistency, separating process from social status.
answer: |-
  Here's a precise demarcation principle derived from your cases, designed to handle live claims without relying on truth outcomes, institutional status, or mere scope:

  **The Core Principle (Epistemic Accountability Test):**
  *A historical claim or methodology qualifies as pseudohistory if it systematically employs **methodological immunizations** against counter-evidence, rendering its core assertions unfalsifiable in practice. This is characterized by:*
  1.  **Reinterpretation-Only Moves:** All counter-evidence is *always* explained away via auxiliary assumptions (forgery, suppression, dating errors, "lost" evidence, coincidence) that *only ever* preserve the core claim and are not independently testable or falsifiable themselves.
  2.  **Lack of Positive Testability:** The core claim lacks *specific, concrete, and unique* predictions or necessary empirical consequences that could be observed *and would force revision* if absent. Negative evidence is dismissed, but positive evidence is often vague, malleable, or non-unique.
  3.  ***(Corollary) Motive & Scope:** While not strictly necessary, pseudohistorical claims frequently arise from strong non-epistemic motives (nationalism, ideology, mysticism, diminishing past agency) and/or make vast, totalizing revisions suggesting a pre-determined conclusion.*

  **Why this works with your cases & what it forces you to drop:**

  *   **A (Fomenko):** **Pseudohistory.** *Motivation:* Classic immunizations (all discrepancies are duplicates/errors). No positive testability - any record can be re-dated to fit. Vast, totalizing scope driven by methodology, not evidence.
  *   **B (Ancient Aliens):** **Pseudohistory.** *Motivation:* Immunizations (suppressed truth, "they couldn't have done it"). Diminishes past agency (moral/epistemic flaw). Lacks positive testability - what *couldn't* aliens explain? Scope is vast implication.
  *   **C (Pictish Professor):** **Pseudohistory.** *Motivation:* Immunizations (footnotes concede minor points, but core *never* shifts despite counter-evidence; new finds only ever support it). Nationalist motive evident. Core assertion lacks falsifiable test - what evidence *would* prove Picts *didn't* teach Ireland?
  *   **D (Parish Grid):** **Pseudohistory.** *Motivation:* Direct immunization (churches off-grid = rebuilt). Core claim unfalsifiable - any deviation is explained away. No positive testability for the grid's existence beyond fitting some sites.
  *   **E (Abbey Forger - Correct Amateur):** **NOT Pseudohistory.** *Crucial difference:* He *lacked* systematic immunizations. He made a specific, falsifiable claim: "This charter is a 12th-century forgery." A *specific* piece of counter-evidence *could* have falsified him: a *genuine* 11th-century copy with matching provenance. The *cartulary copy* didn't immunize; it *falsified the professionals' dating* and *confirmed his specific claim*. His "document is fake" move was a *specific hypothesis*, not a catch-all immunization. **You must drop labeling this as potentially pseudohistorical.** His outsider status and "fake" claim are irrelevant to the epistemic method.
  *   **F1 (Megalithic Yard):** **Pseudohistory (likely).** *Motivation:* If variations are *always* explained as "later degeneration," "builder error," or selective use of sites (common criticisms), it uses immunizations. Lacks positive testability: what specific, unique prediction does the *universal* MY make beyond circular fitting? Can it predict circle dimensions *before* measurement? If *no* variation is accepted as falsifying universality, it fails.
  *   **F2 (Maeshowe Alignment):** **NOT Pseudohistory.** *Motivation:* Specific, testable claim: "This passage points to midwinter sunset." *Falsifiable:* If it pointed elsewhere, the claim is wrong. Positive testability: The alignment can be observed/calculated. Scope is limited to one feature's *possible* intent.
  *   **G (Alpine Silver):** **NOT Pseudohistory.** *Motivation:* Specific, falsifiable claim: "All silver came from Mine X." *Falsifiable:* Finding late Saxon coins with silver traceably from Mine Y *forces revision*. Positive testability: Unique isotopic signature prediction. Scope significant but bounded. Wrongness ≠ pseudohistory.
  *   **H (Ritual Hoard):** **Ambiguous - Depends on method.** *Your Principle Says:* If the detectorist *only ever* interprets hoards as ritual (ignoring contexts suggesting savings, dismissing inconvenient evidence as "later disturbance" or "exceptional case"), it leans pseudohistorical via immunization. If he acknowledges the savings hypothesis as plausible in other cases, weighs contextual evidence (deposition depth, associated finds, location relative to settlement), and admits this specific case *could* be savings if contrary evidence emerged, it's a legitimate (if perhaps weakly supported) historical interpretation.
  *   **I (Girlfriend's Thesis):** **NOT Pseudohistory.** *Motivation:* Key is testability. Her claim should be: "Texts X, Y, Z show stylistic/linguistic/thematic evidence A, B, C, indicative of female authorship." *Falsifiable:* Finding a contemporary manuscript explicitly attributing text X to a known male author, or showing A/B/C were common in male-authored texts of the genre, *forces revision*. Political motivation doesn't corrupt method *if* evidence is handled fairly and the claim is testable. **Crucially, this separates her from (C):** (C) *never* concedes core falsification; your GF presumably would if faced with strong contrary evidence. Her political interest might *bias* her, but doesn't *immunize* the thesis by definition.

  **What Your Principle Forces You to Drop:**
  1.  **The "Scope" Test as Primary:** Vast scope (A, B) is often a *symptom* of immunization/lack of testability, but bounded revision *can* be pseudohistorical (D) and vast claims *can* be legitimate (e.g., "The Black Death was caused by Y. Pestis" was once vast revision). Scope is demoted to a corollary indicator.
  2.  **"Outsider" Status as Relevant:** (E) shows outsiders can do sound history. (C) shows insiders can do pseudohistory. The test applies equally.
  3.  **Truth as Demarcation:** (E) was correct but wasn't pseudohistory *before* being proven right. (G) might be wrong but isn't pseudohistory. Pseudohistory is defined by its *method*, not its (in)accuracy.

  **New Test Case (Designed to Embarrass a Simpler Principle):**
  *   **Case J (The 'Revised' Thermopylae):** A historian argues, based on reinterpretations of Herodotus' troop numbers and satellite imagery of the pass, that the Battle of Thermopylae involved no more than 500 Greek hoplites holding a much narrower defile for just one day. Mainstream historians point to: 1) Contemporary Persian records (fragmentary) suggesting larger forces; 2) Archaeological evidence of camp sizes; 3) The logistical implausibility of such a small force slowing the army significantly. The revisionist responds: 1) Persian records are propaganda exaggerations; 2) The archaeology shows later camps; 3) The Persians were far less disciplined than thought, and small elite forces *can* cause disproportionate delay in narrow terrain (citing modern parallels). He *does* concede that if a Spartan grave marker listing 500 names *specifically for Thermopylae* was found, he'd be wrong, but insists no such evidence exists or is likely.
  *   **Your Principle Says:** **NOT Pseudohistory (Yet).** *Why?* He makes specific reinterpretations of existing evidence. His core claim is *falsifiable* by a specific, conceivable piece of evidence (the 500-name stele). While he uses common moves (dismissing sources as biased, reinterpreting archaeology), they aren't *immunizations* here – he's offering *alternative interpretations of the same evidence* within established historical debate methods. His concession about the stele shows testability. He *might* be wrong, overly reliant on modern analogy, or biased, but his *method* isn't pseudohistorical. It's revisionism using contestable but standard historical arguments. A simpler "immunization" or "scope" test might falsely label this crank.

  **What to Say to Dave (The Sociology Argument):**
  "Dave, it's not just who's in the club. Look: **(C)** is *in* the club (visiting professor) and acts like a crank with his unfalsifiable Pictish theory. **(E)** was *outside* the club (retired surveyor?) but used a testable method and turned out right – the pros were wrong *on the evidence*, not because of his job. **(G)** is firmly *in* the club with a university press book, and his Alpine silver theory might be wrong, but it's falsifiable and methodologically sound history, not crankery. If it was purely sociological, **(C)** would be accepted and **(E)** dismissed forever. The difference is *how they handle evidence*: cranks build fortresses that no evidence can breach, real historians build structures that evidence can topple. The club matters for *access* and *audience*, not the epistemic definition of nonsense."

  This principle focuses on the *epistemological engine* driving the claim – its inherent (un)responsiveness to evidence – which aligns with your intuition that pseudohistory is "rotten before you even check the answer" and deals with your problematic cases consistently.
