  Potential blowups:
  1. When they find out the rules were different, they might feel tricked. How to handle: Acknowledge that it was intentionally set up to show how the rules affect decisions. Emphasize that in real life, the default is often invisible.
  2. Some tables might not follow the rule. How to handle: The facilitator can remind them during the exercise to follow the rule on their card. And in the debrief, note that in real life, people don't always follow the rules consistently.
  3. The evidence might be too compelling one way. We have to make sure the dossier is balanced. Test it beforehand.
  4. Time: Keep strict time limits. Use a timer.

  What the game can't do:
  - It can't reproduce the weight of real-world consequences, especially irreversible harm or catastrophic risks. We have to mention that in the wrap-up.
  - It simplifies the evidence and the decision-making process. Real decisions involve more uncertainty and complexity.

  Final note: The exercise is designed to be experiential. The facilitator should resist the urge to explain until the debrief.

  Let's write the rule cards:

  Card for Group A: "Your editorial policy: When considering a new proposal, the default is to APPROVE it unless there is clear evidence that it would cause significant harm."

  Card for Group B: "Your editorial policy: When considering a new proposal, the default is to BLOCK it unless there is clear evidence that it is safe."

