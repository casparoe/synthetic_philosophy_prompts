  - Long history of use with known risks managed by regulations.
  - The current system is functional (though aging).

  Evidence against the status quo:
  - THMs are known carcinogens.
  - Chlorine production is energy-intensive and produces toxic waste.

  Unknowns:
  - Long-term effects of NanoClean.
  - Whether the cost savings will materialize as projected.

  Your task: Your editorial board must decide whether to endorse the switch to NanoClean. You have 15 minutes. Base your decision on the evidence and your editorial policy (on the card).

