  Here’s a complete, battle-tested workshop design focused on **experiencing the burden-of-proof flip** and **mirror-image precaution**, with mechanics that force the "aha" moments you want. No philosophy lecture—just a fast-paced editorial simulation where the "default leak" emerges from gameplay.

  ---

  ### **Core Mechanics & Why They Work**
  - **Secret rule cards** create a "Eureka!" moment when groups compare decisions. The "rigged" feeling is mitigated by making the rules feel like natural editorial policies (not arbitrary).  
  - **Balanced dossier** has **equal uncertainty** (no long-term studies) and **asymmetric risks** (harm from action vs. inaction).  
  - **Costs & deadlines** prevent risk-aversion paralysis—groups must weigh consequences.  
  - **Mirror flip** works by changing the *reference point* for "new" vs. "status quo," not the topic.  

  ---

  ### **Materials Checklist**
  1. **Rule Cards** (laminated, 1 per table):  
     - **Group A (Yellow Card):** *"Policy: APPROVE new proposals UNLESS clear evidence of harm exists. Burden of proof: Opponents must show harm."*  
     - **Group B (Blue Card):** *"Policy: REJECT new proposals UNLESS clear evidence of safety exists. Burden of proof: Proponents must show safety."*  
  2. **Dossiers** (1 per table, identical except deadlines/costs):  
     - **Round 1:** Proposal to **launch AquaNex** (novel water filter replacing chlorine).  
     - **Round 2:** Proposal to **ban AquaNex** (revert to chlorine after "scare").  
  3. **Voting Tokens** (2 per table: GREEN=Approve, RED=Reject).  
  4. **Headline Slips** (blank paper strips).  
  5. **Timer** (visible countdown).  

  ---

  ### **Fake Case Dossier: AquaNex Water Filters**
  **The Hook:** City must choose water treatment system.  
  **Why It Works:**  
  - Both options have **known + unknown risks**, but evidence gaps are symmetrical.  
  - Costs are **time-bound** (e.g., "old pipes failing in 6 months").  
  - **No "right" answer**—evidence is ambiguous by design.  

  #### **Dossier Contents (Key Excerpts)**  
  **Background:**  
  > "City’s current chlorine system leaks trace toxins (linked to thyroid issues). Aging pipes fail in 6 months.  
  > **AquaNex proposal**: Nanoparticle filters. Cheaper, fixes pipes. Lab tests show no acute toxicity, but no long-term human studies."  

  **Evidence Packet (Same for Rounds 1 & 2):**  
  | Evidence                          | Chlorine (Status Quo)          | AquaNex (New Proposal)         |  
  |-----------------------------------|--------------------------------|--------------------------------|  
  | **Known Benefit**                 | "Controls bacteria 100 yrs"    | "Cuts costs 50%; stops leaks"  |  
  | **Known Harm**                    | "Leaks toxins; 1% illness risk"| "Nanoparticles found in fish"  |  
  | **Unknown Risk**                  | "Toxin buildup over 10+ yrs?"  | "Human absorption unknown"     |  
  | **Cost of Delay**                 | "$1M/month if pipes fail"      | "$500K/month if approval lags" |  
  | **Gaps**                          | NO long-term exposure studies  | NO long-term exposure studies  |  

  **Conspicuous Omissions (Critical!):**  
  - No "smoking gun" for either side (e.g., no cancer link proven).  
  - No cost-benefit analysis—only raw data.  
  - No institutional endorsements (e.g., FDA, WHO).  

  ---

  ### **Workshop Timeline (75 Min Total)**  
  **0-5 min: Framing (No Definitions!)**  
  > *"You’re the city’s editorial board. A water-tech proposal hits your desk. In 15 mins, vote: Approve or Reject? Your publisher gave you a policy card—stick to it. Ready? Go."*  

  **5-20 min: Round 1 (Launch AquaNex?)**  
  - Tables get **dossier + secret rule card** (half yellow/blue).  
  - **Task:** Vote on AquaNex launch.  
  - **Pressure:** "Pipes fail in 6 months—delay costs $1M/month."  
  - **Facilitator:** Roam, remind: *"Stick to your policy card. What’s your burden of proof?"*  
  - **Vote:** Tokens in sealed envelope (hide decisions).  

  **20-30 min: Round 2 (Ban AquaNex?)**  
  - **Flip:** *"AquaNex launched 2 years ago. Now, a study finds nanoparticles in fish (not humans). Citizens demand banning it to revert to chlorine."*  
  - **Same dossier**, but update:  
    > *"Cost to revert: $10M. Chlorine toxins still present. Deadline: Vote before election (3 months)."*  
  - **Same rule cards** reused.  
  - **Task:** Vote on banning AquaNex (revert to chlorine).  
  - **Pressure:** "Election in 3 months—inaction risks protests."  

  **30-35 min: Reveal & Contrast Votes**  
  - Chart votes on whiteboard:  
    |          | Round 1 (Launch) | Round 2 (Ban) |  
    |----------|------------------|---------------|  
    | Group A  | Approve ✅       | Reject 🚫     |   
    | Group B  | Reject 🚫        | Approve ✅    |  
  - **Facilitator:** *"Why did Group A reject in Round 2? Group B approve? What changed?"*  
    *(They’ll spot: Group B now demanded proof of safety from reverting to chlorine)*  

  **35-45 min: Headline Sprint**  
  - **Task:** Tables write **2 headlines** for Round 1:  
    - One as if **AquaNex was approved** (Group A’s default).  
    - One as if **AquaNex was rejected** (Group B’s default).  
  - **Swap** headlines with another table. Guess which default produced each.  

  **45-60 min: Debrief (Map Game → Concept)**  
  1. **The Default Leak:**  
     - Show headlines. Ask: *"Which phrases leaked the burden of proof?"*  
     - **Examples from play:**  
       - Group A: *"No evidence AquaNex harms humans."*  
       - Group B: *"No proof AquaNex safe long-term."*  
     - **Reveal:** *"You used the same dossier but framed risks based on your policy card. That’s the default leak—it embeds in language."*  

  2. **Mirror Precaution Burn:**  
     - Point to Round 2 votes: *"Group B rejected AquaNex in Round 1 (demanded proof of safety). In Round 2, they approved banning it (demanded proof reverting was safe). But by reverting, they reinstated chlorine’s risks. Precaution blocked change, but the status quo was the danger."*  

  3. **What the Game Can’t Do (Say This!):**  
     - *"This simulates evidence fights, but real precaution debates involve irreversibility (e.g., extinction) or unquantifiable risks (e.g., AI apocalypse). You can’t ‘price’ those in tokens. That weight requires storytelling."*  

  **60-75 min: Takeaways & Q&A**  
  - **Key soundbite:** *"Precaution isn’t about caution—it’s about who pays the proof tax. Your default chooses the devil."*  
  - **No theory:** Only discuss what emerged (e.g., *"How’d the deadline affect your vote?"*).  

  ---

  ### **Predictable Blowups & Fixes**  
  1. **"You rigged this!" when rules are revealed:**  
     - **Preempt:** Start by saying, *"Publishers have different policies. Yours is on the card—use it as your North Star."*  
     - **Reframe:** *"This isn’t about fairness—it’s why identically smart people see the same facts and disagree."*  

  2. **Groups ignore rule cards:**  
     - **Enforce:** Roam and intervene: *"What does your policy card say about proof?"*  
     - **Leverage deadlines:** "10 mins left! What’s your burden?"  

  3. **Dossier "solves" the case:**  
     - **Neutralize:** Remove all decisive evidence (e.g., no mortality stats). If they fixate, say: *"Assume gaps exist. Vote with uncertainty."*  

  4. **Mirror flip feels disjointed:**  
     - **Fix:** Emphasize continuity—*"Same city, same tech, 2 years later. Now the proposal is to undo it."* Costs (e.g., election protests) make reversal risky.  

  ---

  ### **Why This Works**  
  - **Discovery > Instruction:** The burden flip emerges from secret rules; the mirror burn hits when Group B reinstates chlorine.  
  - **Costs force trade-offs:** Deadlines/money prevent "safe" indecision.  
  - **Language is the payoff:** Headlines make the "leak" visible.  
  - **No real science:** AquaNex is fictional—no rabbit holes.  

  **Final note:** The emotional "weight" of real precaution (e.g., dread of catastrophe) won’t emerge from tokens. **Say this aloud in debrief**—then tie it to how language (e.g., "can’t rule out disaster") triggers that weight in readers. Run it tight, and they’ll leave seeing the invisible default in every headline.
