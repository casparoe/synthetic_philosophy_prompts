  Title: Proposal: Switch to ChlorSafe for City Water Treatment

  Background:
  - Five years ago, the city switched to NanoClean. The switch has been successful in reducing THMs to zero and saving money. However, new concerns have arisen.
  - A study (Jones et al.) found nanoparticles from NanoClean in the sediment of the city reservoir. Fish in the reservoir show abnormalities (reduced fertility). The levels in drinking water are very low, but the long-term effects on humans are unknown. The company disputes the study, saying the conditions were unrealistic.

  The Proposal:
  - A citizen group proposes switching to a new chlorine-based technology, ChlorSafe, which reduces THMs by 90% compared to the old system.
  - Benefits of ChlorSafe:
    - Avoids the nanoparticle issue.
    - Uses a safer form of chlorine with fewer byproducts.
  - Costs:
    - The current NanoClean system would be dismantled. The switch would cost $20 million and take 18 months, during which the city would rely on bottled water (costing an extra $5 million).
    - The old chlorine system was decommissioned and cannot be reused.

  Evidence for ChlorSafe:
  - Tested in three small towns with no reported health issues and THM levels 90% lower than the old system.
  - Uses established technology with a better safety profile.

  Evidence against ChlorSafe:
  - High cost and disruption.
  - Unproven at the scale of our city.
  - THMs are not eliminated entirely.

  Evidence for the status quo (NanoClean):
  - Five years of use with no reported health issues in humans.
  - Saves money.
  - The fish study might be flawed; replication studies are ongoing.

  Evidence against the status quo:
  - The fish abnormalities are concerning and might indicate environmental damage that could affect humans in the long run.

  Unknowns:
  - Long-term effects of ChlorSafe at scale.
  - Whether the fish abnormalities are caused by NanoClean or other factors.

  Your task: Your editorial board must decide whether to endorse the switch to ChlorSafe. You have 15 minutes. Base your decision on the evidence and your editorial policy (same card as before).

  Headline exercise:

  Each table gets a summary of the Round 1 case (without the decision). They must write two headlines for a news article about the proposal to switch to NanoClean:
  - Headline A: As if the default is "allow unless harm" (leaning toward approval).
  - Headline B: As if the default is "block unless safety" (leaning toward rejection).

  Then they swap with another table and try to guess which headline is which. Finally, discuss how the language reflects the default.

  This should cover the objectives.
