  Timeline for the session (75 minutes):

  0-10 min: Introduction (set the stage, no definitions, just the case)
  10-25 min: Round 1 - Editorial meeting for the initial proposal (switch to NanoClean). Each table gets the dossier and their secret rule card. 15 minutes to discuss and vote.
  25-30 min: Each table reports their decision (allow or block) and the reason in one sentence. The facilitator records without comment.
  30-45 min: Round 2 - The same tables get the Round 2 dossier (5 years later, proposal to switch to ChlorSafe). They have the same rule card (but now applied to this new proposal). 15 minutes to discuss and vote.
  45-50 min: Each table reports their decision and reason.
  50-60 min: Reveal that there were two different rules. Show how the rules affected the decisions. Then, introduce the concept of the "default leak" and show examples from their reasons and the language they used.
  60-70 min: Headline exercise. Each table is given a short summary of the Round 1 case and must write two headlines: one as if the default is "allow unless harm" and one as if it's "block unless safety". Then they swap with another table and guess which headline is which.
  70-75 min: Wrap-up: emphasize that the precautionary principle is about the burden of proof, and that it can be applied in both directions. Mention that in real reporting, the default is often chosen without acknowledgment.

  Materials:
  - Rule cards (two types, labeled for the facilitator: Group A and Group B)
  - Dossier for Round 1 (one per table)
  - Dossier for Round 2 (one per table)
  - Flip chart or whiteboard to record decisions
  - Headline writing: slips of paper

  Debrief:
