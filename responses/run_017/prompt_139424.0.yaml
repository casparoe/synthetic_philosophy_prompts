  First, their core framework: indicatives as purely probabilistic (P(B|A)) without truth conditions, versus counterfactuals having possible-worlds truth conditions. The unification claim (point 3) seems immediately precarious - maintaining identical semantics while accommodating such divergent behaviors won't be trivial. 

  The user's keycard example (point 5) reveals their intuition about modal access: indicatives draw from what's epistemically possible given known facts, while counterfactuals require causal-historical paths. This explains their resistance to subjunctive readings in the keycard scenario. 

  Now evaluating tensions:
  - Point 3 clashes violently with point 1. If the conditional is fundamentally the same, why would indicatives lack truth conditions while counterfactuals have robust ones? The "only contextual difference" claim can't sustain this asymmetry. Either truth conditions must infect indicatives (costing their probabilistic purity) or counterfactuals must shed theirs (destroying their analysis).
  - Or-to-if (point 4) endangers point 1. If "A or B" entails "¬A→B", then indicatives must have truth-conditional content to participate in entailment relations. This forces either abandoning or-to-if (which the user explicitly values) or making indicatives truth-apt.

  Secondary tensions:
  - The keycard example's indicative/subjunctive divergence (point 5) already partially resolves the point 3 conflict by introducing a causal requirement for counterfactuals. But this creates new pressure: if causal chains distinguish the modes, doesn't that constitute a semantic difference beyond just "which worlds are accessible"?
  - Strengthening/transitivity failures (point 2) actually help the counterfactual analysis, but the user hasn't explained why indicatives obey these rules if both share underlying semantics. This isn't fatal yet but needs addressing.

  Cheapest resolution path:
  1. First sacrifice unification (point 3) while keeping indicatives non-truth-conditional (point 1). This preserves their elegant probabilistic treatment and or-to-if can be reinterpreted pragmatically rather than as strict entailment.
  2. Alternative: bring indicatives into the truth-conditional fold with a worlds-semantics where P(B|A) emerges from contextually restricted worlds. But this blurs their clean P(B|A) story.

  The user seems most attached to probabilistic indicatives (point 1) and or-to-if (point 4). Protecting these while letting unification go might be their least painful concession - even if it costs theoretical unity, it keeps their favorite tools operational.
answer: |-
  Here's a breakdown of the tensions in your position, ordered by severity, with specific diagnoses and costs for each concession. The core conflict is between unifying indicatives/counterfactuals semantically (point 3) and their radically different treatments (points 1 & 2). Your keycard case (point 5) is insightful but exacerbates the tension.

  ### 🚨 **Critical Tension (Highest Severity): Points 1 vs. 3 & 5**  
  **Problem:** If indicatives lack truth conditions (point 1) *and* counterfactuals have truth conditions (point 2), they **cannot be "one and the same conditional underneath"** (point 3). Semantics is where truth conditions live. If indicatives are purely expressions of credence (P(B|A)) while counterfactuals are truth-apt propositions about worlds, they differ fundamentally in semantic type.  
  - **Example from point 5**: Your denial of the subjunctive ("If Ana hadn’t done it...") relies on causal/historical constraints in the *truth conditions* of counterfactuals. But your indicative ("If Ana didn’t...") explicitly *lacks* truth conditions. If they’re the same underlying thing, this divergence is inexplicable.  
  - **What must give?**  
    - **Option 1: Abandon unification (point 3)**.  
      Cost: Lose theoretical elegance; admit a semantic split between indicatives and counterfactuals.  
    - **Option 2: Drop truth-conditionlessness for indicatives (point 1)**.  
      Cost: Surrender a core tenet of your view; must explain indicative truth conditions (e.g., as restricted world quantifiers à la Kratzer).  
  - **Cheapest fix**: **Drop point 3 (unification)**. Keeping indicatives non-truth-conditional (point 1) and counterfactuals truth-apt (point 2) is coherent only if they’re distinct. Cost: Moderate (loses simplicity but preserves key insights).  

  ### 🚨 **Major Tension: Point 4 (Or-to-If) vs. Point 1**  
  **Problem:** Or-to-If (from "A ∨ B" to "¬A → B") is typically understood as a *logical entailment*. But if indicatives lack truth conditions (point 1), they can’t be entailed by truth-apt disjunctions. Entailment requires truth-conditional content on both sides.  
  - **What must give?**  
    - **Option 1: Reinterpret Or-to-If as pragmatic (not semantic)**.  
      Cost: Weakens its force; it becomes a defeasible inference (e.g., via conditional probability). May not match your intuition of "good standing".  
    - **Option 2: Grant indicatives truth conditions (abandon point 1)**.  
      Cost: As above, forces a worlds-based semantics for indicatives.  
  - **Cheapest fix**: **Reinterpret Or-to-If pragmatically**. Argue that asserting "A ∨ B" raises P(B|¬A) to 1 *in context*, licensing the conditional assertion. Cost: Low (aligns with probabilistic view; retains use of Or-to-If).  

  ### ⚠️ **Moderate Tension: Points 2 vs. 5 (Causal Requirement)**  
  **Problem**: You say counterfactuals require "causal/historical connection" (point 5), but standard nearest-world semantics (point 2) doesn’t build this in. Closest worlds are often *similarity*-based (e.g., minimizing miracles), not causally constrained.  
  - **Example**: In your keycard case, the nearest ¬Ana-world might be one where Bo acts identically (no causal break), making "If Ana hadn’t, Bo would have" *true* on standard semantics—contra your denial.  
  - **What must give?**  
    - **Option 1: Add causal constraints to world similarity**.  
      Cost: Complicates semantics; may overgenerate (e.g., in preemption cases).  
    - **Option 2: Treat the causal requirement as pragmatic**.  
      Cost: Weakens point 5; your keycard denial becomes contextual, not semantic.  
  - **Cheapest fix**: **Clarify that "similarity" in point 2 includes causal/historical fidelity**. Cost: Low (many theorists like Lewis already include this in world-ordering).  

  ### 🔍 **Apparent Tension (Resolvable): Points 1 & 2 vs. Strengthening/Transitivity**  
  **Non-issue**: You rightly note counterfactuals flout strengthening/transitivity (point 2), but indicatives (as P(B|A)) obey them:  
  - P(B|A) can be high while P(B|A∧C) is low (anti-strengthening).  
  - P(B|A) and P(C|B) high doesn’t guarantee P(C|A) high (anti-transitivity).  
  **Resolution**: This is consistent! Indicatives *do* violate these rules probabilistically, matching your view. No tension.  

  ### The Repair Path & Costs  
  1. **Drop unification (point 3)** → Cost: **Moderate** (loses elegance but keeps core claims intact).  
  2. **Demote Or-to-If to pragmatic inference** → Cost: **Low** (retains utility without truth-conditional baggage).  
  3. **Clarify counterfactual similarity as causal** → Cost: **Negligible** (refines point 2 to match point 5).  

  **Resulting Position**:  
  - Indicatives: Non-truth-conditional, governed by P(B|A).  
  - Counterfactuals: Truth-conditional, with causal/historical constraints on world similarity.  
  - Or-to-If: Pragmatically valid via conditional probability.  
  - Keycard case: Explained by modal base divergence (epistemic for indicatives, causal for counterfactuals).  

  This preserves your key insights (1,2,4,5) while resolving tensions. The unification claim (3) is the main sacrificial lamb—but its cost is justified by the conflicts.
