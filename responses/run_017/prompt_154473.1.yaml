prompt: |-
  Hey — act as a profressional philosopher who specializes in the extended mind thesis and philosophy of cognitive science. Please think carefully and brainstorm a bit first, then give me a structured answer.

  Here's the case. A university has a disability-accomodation policy for exams: certain students are allowed to consult a customized external resource, like a searchable personal knowledge base or an AI assistant trained on their own notes, during the exam. The stated rationale is that the resource functions as part of the student's memory or cognitive system, so banning it would be like penalizing someone for having poor biological recall; the point of the exam is to assess their reasoning, not unaided recall. At the same time, if another student secretly used the same resource, that would be treated as cheating.

  What philosophical commitments does this policy presuppose? I want the implicit theory reconstructed: does it strictly presuppose something like the parity principle, or only the weaker claim that external tools can sometimes play a cognitive role? What does it assume about authorship, responsibility, and the boundary of a person's mind? Is the policy consistent with itself — if the laptop is literally part of the student's mind, why is unauthorized use cheating, and if it isn't, why is the accommodation fair? And what would have to change in the policy if we rejected the extended mind claim and treated the device as a mere tool? Please seperate what the practice strictly presupposes from what it merely fits well with, and say where it's underdetermined.
reasoning: |-
  Okay, let me approach this query methodically. The user presents a fascinating case study at the intersection of philosophy of mind and educational ethics. They want me to reconstruct the implicit philosophical commitments behind a university's disability accommodation policy where certain students can use external cognitive aids during exams.

  First, I need to unpack the core tension: the policy treats identical technological resources differently based on authorization. For approved students, the AI/laptop is framed as part of their cognitive system; for others, its use constitutes cheating. This immediately suggests the extended mind thesis (EMT) is relevant, but we must distinguish between strict presuppositions and mere compatibilities.

  The policy clearly presupposes functionalism in cognitive science - it prioritizes reasoning ability over biological implementation. The key move is decoupling cognitive function from biological substrate. However, it doesn't strictly require the full EMT parity principle. What's essential is the weaker "complementarity principle": that external resources can complete cognitive functions impaired internally.

  Regarding mind boundaries, the policy implicitly endorses a soft scaffolded view rather than hard extended cognition. The authorization requirement reveals that social/legal recognition matters as much as functional integration. This is where Clark and Chalmers' original EMT needs social augmentation.

  On consistency: the apparent contradiction dissolves when we see the policy isn't claiming the device literally becomes part of the mind, but that it plays an equivalent functional role for disabled students. Unauthorized use violates exam conditions designed to test individual competence - here the tool becomes an unfair advantage rather than a compensatory prosthesis.

  If we rejected EMT entirely, the accommodation rationale would shift from "extended mind" to "leveling the playing field" for disability. The focus would be on equitable access rather than cognitive integration.

  The user's deeper interest seems to be in how philosophical theories translate into institutional practices. They're likely exploring the practical implications of EMT or critiquing its application. I should highlight where the policy is philosophically underdetermined - like its tacit reliance on social recognition over pure functional criteria.

  This case beautifully exposes the tension between individual cognition and institutional assessment frameworks. The university isn't just making metaphysical claims but negotiating what counts as "authentic" intellectual performance within social constraints.
answer: |-
  Here's a structured analysis of the philosophical commitments underpinning this accommodation policy, drawing on the Extended Mind Thesis (EMT) and philosophy of cognitive science:

  ---

  ### I. **Core Philosophical Presuppositions**
  1. **Functionalism Over Biological Implementation**  
     *Strict Presupposition*: Cognitive processes (like reasoning) are defined by their *functional role*, not their biological substrate. The policy assumes the exam should assess *reasoning capacity*, regardless of whether memory retrieval occurs biologically (brain) or externally (device).

  2. **Cognitive Complementarity (Weaker than Parity)**  
     *Strict Presupposition*: External tools can serve as *functional substitutes* for impaired biological processes. The policy requires only that the device *compensates* for a deficit (e.g., poor recall), not that it is metaphysically equivalent to biological memory. This aligns with **Andy Clark's "scaffolding" view** more than the strict Parity Principle.

  3. **Context-Dependent Cognitive Boundaries**  
     *Strict Presupposition*: What counts as "part of the mind" is determined by *functional integration in a specific context*. The device is treated as cognitive scaffolding *only when officially integrated* into the student's cognitive workflow to offset a disability. Unauthorized use lacks this sanctioned integration.

  ---

  ### II. **Implicit Assumptions About Authorship & Responsibility**
  1. **Agency Through Delegation**  
     The policy assumes the student *authors* the reasoning process by *orchestrating* the resource (e.g., querying their personal notes/AI). Responsibility lies in how they deploy the tool, not in unaided recall.  
     - *Underdetermined*: Whether the AI’s output is fully "theirs" if it generates novel connections.

  2. **Social Recognition of Cognitive Integration**  
     *Strict Presupposition*: Cognitive extension requires *institutional ratification*. The device becomes "part of the mind" *only when legitimized by the accommodation framework*. Unauthorized use is cheating because it bypasses this social agreement.

  ---

  ### III. **Resolving the Consistency Challenge**
  The policy is **internally consistent** but relies on a **pragmatic, socially embedded view of cognition**:
  - **For Accommodated Students**: The device is a *prosthetic extension* to restore normative cognitive function (compensating for disability). Banning it would unfairly penalize their "extended" cognitive system.
  - **For Unauthorized Users**: The device is an *illicit tool* because:  
    a) It circumvents exam conditions designed to test *individual* cognition;  
    b) It provides an *unfair advantage* by bypassing constraints others face;  
    c) It lacks the *legitimizing context* of disability compensation.  
  **Key Insight**: The policy distinguishes between *restorative extension* (accommodation) and *enhancement* (cheating), grounded in social/ethical norms.

  ---

  ### IV. **If We Reject the Extended Mind Claim**
  Rejecting EMT would force these policy changes:
  1. **Shift in Rationale**: The accommodation could no longer claim the device "is part of the mind." Instead, it would be framed as:  
     - A *compensatory tool* to ensure equitable assessment (disability rights), or  
     - A *necessary prosthesis* (like eyeglasses), without cognitive metaphysics.  
  2. **Stronger Delineation of "Authentic" Work**: Unauthorized use would still be cheating, but the rationale would emphasize *violating rules* rather than *violating cognitive boundaries*.  
  3. **Potential Inconsistency**: If the device is *merely a tool*, critics could argue it gives accommodated students an "unfair" advantage. EMT provides a stronger justification for why it’s *not* an advantage but a baseline restoration.

  ---

  ### V. **What the Policy Fits With (But Doesn’t Strictly Require)**
  1. **The Parity Principle** (Clark & Chalmers):  
     Compatible but not essential. The policy needs only *functional equivalence in context*, not metaphysical parity ("if it were in the head, we’d call it memory").  
  2. **Distributed Cognition**:  
     Fits the idea that cognition spans brain/device, but the policy focuses on *individual* assessment (orchestration matters more than group dynamics).  
  3. **Embedded Cognition**:  
     Supports the view that tools augment cognition, without requiring them to be "mental."

  ---

  ### VI. **Underdetermined Aspects**
  1. **Degree of Integration**: How personalized/must the tool be? (e.g., Is GPT-4 trained on personal notes equivalent to a custom database?)  
  2. **Agency Threshold**: At what point does AI-generated content cease to be "the student’s" reasoning?  
  3. **Non-Disabled Use**: Could non-disabled students ever legitimately use tools? (Policy implies "no," but EMT doesn’t forbid it).

  ---

  ### Conclusion
  The policy **strictly presupposes**:  
  - A functionalist view of cognition,  
  - Context-dependent cognitive complementarity,  
  - Socially ratified integration for disability compensation.  

  It **does not require** the full Extended Mind Thesis (e.g., metaphysical parity), but EMT provides its most coherent foundation. Without EMT, the policy must rely on disability rights frameworks alone, potentially weakening its rationale against accusations of unfair advantage. The tension between "extension" and "cheating" is resolved by recognizing that **cognitive boundaries are both functional and social**: the device becomes "part of the mind" only when institutionally sanctioned to restore equitable cognitive function.
