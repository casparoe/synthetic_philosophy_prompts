prompt: |-
  I'm a senior at a large public high school and I run our school's Philosophy and Public Affairs Club. Last year we did a unit on punishment; this year we're doing one on religion and the state, and I'm building the materials myself because nothing I've found online is pitched at people who are new to the arguments. I'd like you to take the role of a political theorist who specializes in church-and-state questions and who is unusually good at turning a messy debate into a handout that actually works in a room. Please work through this slowly and in stages: before you write anything, brainstorm; then prune; then build. I would much rather have a slow, well-built instrument than a fast list of isms.

  What I want is a diagnostic decision tree: a flowchart that two club members can walk through together in about fifteen minutes, starting from a gut reaction to a concrete arrangement and ending at a named position on whether and how a state may be entangled with religion.

  Here are the constraints, which matter to me more than polish:

  1. Every branch node must be a concrete case, not a label and not a slogan. No node may ask whether someone supports separation of church and state, or whether the state should be neutral, or whether religion is a private matter. Each node should put a specific arrangement in front of the reader and ask for a verdict: approve it on principle, tolerate it with qualms, or reject it. The point is to sort people by what they say about cases rather than by which label they like. A member who has never heard the words establishmentarian or laïque should be able to answer every question honestly.

  2. Build the tree from the logical space rather than from a roster of position names. Work out first which distinctions could possibly separate people here, then keep only the ones that actually carve the space, then locate the real views in the resulting tree. Where a combination of answers is empty, say so in the notes and diagnose it briefly: is nobody there because the combination is incoherent, because it is merely unattractive, or because nobody has bothered to occupy it?

  3. My angle, which should drive which distinctions you keep: I care most about why someone objects. Coercion of individual conscience, the state having any authority over doctrine at all, the message that establishment sends about the civic standing of outsiders, and the corruption or fungibility problems that come with money are, in my view, four genuinely different objections, and I want the tree to be able to tell apart people who object for different reasons instead of lumping every opponent of entanglement into one leaf. Each of those four should get at least one node that could in principle separate it from the others.

  4. Size: six or seven branch questions, two or three branches each, ten to fourteen leaves.

  5. Leaves: give each one the name of the position, or the word unnamed if nobody defends it, plus one sentence on its most awkward commitment. These must all appear as leaves somewhere: an establishmentarian or Erastian position; a non-preferentialist position on which the state may fund every comprehensive doctrine on identical terms; a strict no-aid separationist; a laïcité-style position on which visible religious symbols in public institutions are the central issue and money is secondary; a principled-pluralist position on which the state should support associations, religious or not, and keep out of their internal life; and at least two leaves that are unnamed or unoccupied.

  6. Flag any pair of leaves your tree cannot actually separate, rather than pretending the questions sort them. I would rather know that two views collapse on my cases than be handed a tree that only looks discriminating.

  7. Use the four real countries only as loose illustrations: England's established church; Germany's state-administered church contribution with a formal declaration of exit; France's republican secularism and the ban on conspicuous religious symbols in public schools; the United States' no-establishment rule together with publicly funded vouchers redeemable at religious schools. I do not want legal citations, case names, statutes, or dates, and I do not care about current legal accuracy. If you are unsure of a detail about any real country, generalize it or replace it with one of the hypotheticals below.

  8. Most of the branch nodes should use arrangements nobody has memorized an opinion about, so that members have to reason. Here are some I made up; use at least four of them as nodes, and invent two or three of your own in the same spirit.

  - The Mirror Rule: any benefit offered to a religious body must be offered on strictly identical terms to every group offering a comprehensive doctrine of life, explicitly including atheistic and secular humanist ones.
  - The Heritage Clause: the state funds the upkeep and the rituals of religious bodies, but only those whose buildings and liturgies are more than 150 years old, and it funds them as heritage, never as religion.
  - The Exit-Fee Asymmetry: everyone is enrolled automatically in the funding scheme and must file a formal declaration, pay a small fee, and appear in person at a government office to leave it.
  - The Caritative Carve-out: the state contracts with religious bodies to run food banks, hospitals, and preschools that it would otherwise have to run itself, at cost, under identical auditing rules, and pays for nothing else.
  - The Two-Key System: funding requires both a threshold of popular subscription and certification by a state board, where the board may investigate whether a group preaches hatred but is legally forbidden from inquiring into its doctrine.
  - The Silent Establishment: the state has an official religion, but the religion is never mentioned in law, schools, or public ceremony, and is funded only by the income of an old property endowment.
  - The Conscience Ledger: taxpayers who object to any religious funding may redirect their entire share into a fund for secular ethics instruction in public schools.

  9. Before the handout itself, include a short section called "Notes on how I built this." It should show your actual work: the candidate distinctions you considered, which ones you cut and why, and which combinations of answers turned out to be empty. Then check your own tree once and tell me if two people with genuinely different commitments would land on the same leaf.

  10. Format the handout for American high schoolers: readable in one printed page, plain prose, and any term of art should be explained in a parenthesis the first time it appears. No citations, no case names, no quotation, and no bibliography — just the instrument and the notes.
reasoning: |-
  Okay, the user is a high school senior running a Philosophy and Public Affairs Club. They need a decision tree handout about religion and state relations, designed specifically for beginners. Their constraints are very precise: no jargon, concrete cases only, focus on underlying objections (coercion, state authority, civic standing, corruption), and using hypothetical scenarios to force fresh reasoning. 

  First, I need to unpack their core request: they want a diagnostic tool that reveals *why* people object to religious entanglement, not just *that* they object. The four objection types (coercion, state over doctrine, civic exclusion, corruption) must each have at least one node that isolates them. That's clever pedagogy—it forces students to confront their own principles.

  The hypothetical cases they provided are brilliant for avoiding pre-digested opinions. "Exit-Fee Asymmetry" directly tests coercion tolerance; "Heritage Clause" probes whether history legitimizes establishment; "Silent Establishment" isolates symbolic harm. I'll prioritize these and invent two more: maybe one about religious leaders in legislatures (tests corruption) and one about state certification of doctrines (tests authority over belief). 

  Size is tight: 6-7 questions max, 10-14 leaves. That means every branch must pull weight. I'll start by mapping the logical space: 

  - **Axis 1: State endorsement** (symbolic vs material) 
  - **Axis 2: State control** (funding with strings vs no strings) 
  - **Axis 3: Inclusivity** (all groups vs select groups) 
  - **Axis 4: Coercion** (opt-in vs opt-out burdens) 

  But some axes overlap. After sketching, I realize coercion and civic standing might collapse if not careful. Solution: "Exit-Fee Asymmetry" *must* be a node—it uniquely pressures conscience. Meanwhile, "Two-Key System" can tease apart whether objections are about state overreach or just exclusion. 

  For leaves, they specified six required positions. Principled pluralism (state funds associations neutrally) and non-preferentialism (state funds all doctrines equally) are distinct but easily confused. I'll use "Mirror Rule" to separate them: if you accept funding atheists equally, you're non-preferentialist; if you object to *any* state funding of doctrines, you're strict separationist. 

  Biggest challenge: fitting laïcité. Its focus on visible symbols isn't covered by funding questions. Need a dedicated node—probably about headscarves in schools. I'll invent "Public Uniform Rule" as a hypothetical, since France's actual law is too loaded. 

  Now pruning: "Conscience Ledger" is tempting but might not add new info—if someone objects to funding, letting them redirect taxes is a band-aid. Cut. "Caritative Carve-out" stays because it tests whether service delivery justifies entanglement. 

  Empty branches: combining "approve state doctrinal review" with "reject all funding" seems incoherent—why grant authority you never use? That leaf stays unnamed. Another dead end: approving coercive opt-outs (*cough* Exit-Fee) while rejecting state doctrinal control. Possible? Only if you think inconvenience protects religious purity. Unlikely, but noted. 

  Finally, testing separability: laïcité and strict separationism both reject school headscarves, but for different reasons (civic equality vs anti-endorsement). The tree *can* split them if a funding question (like "Heritage Clause") gets different answers. If not, I'll flag the overlap. 

  Handout format: plain language, no citations. "Establishmentarian" becomes "state should officially support one religion." "Laïcité" is "strict civic uniformity." One page is brutal—every word must count. 

  *Phew*. User knows exactly what they need. Respect.
answer: |-
  Here is a decision tree handout designed for your club's needs. It focuses on concrete cases, distinguishes objections, and meets your constraints. The notes explain the construction process transparently.

  ---

  **Religion & State: Where Do You Stand? A Diagnostic Tree**

  **Instructions:** With a partner, start at the top. For each scenario, choose **A) Approve on principle**, **B) Tolerate with qualms**, or **C) Reject**. Follow the arrows based on your choice. Find your ending position and its key commitment. Discuss why you answered as you did!

  1.  **The Exit-Fee Asymmetry:** Everyone is automatically enrolled in a system funding major religions. To leave, you must file a formal declaration, pay a small fee, and appear in person at a government office. Non-members get no equivalent benefit.
      *   **A) Approve** → Go to 2
      *   **B) Tolerate** → Go to 2
      *   **C) Reject** → Go to 3

  2.  **Heritage Clause:** The state funds the upkeep of religious buildings and rituals, but *only* for groups whose buildings/liturgies are over 150 years old. The funding is labeled "cultural heritage," never "religion."
      *   **A) Approve** → Go to 4
      *   **B) Tolerate** → Go to 4
      *   **C) Reject** → Go to 5

  3.  **Public Uniform Rule:** Public school teachers are banned from wearing any visible religious symbols (headscarves, crucifixes, turbans, etc.) while teaching, to ensure pupils perceive no religious influence from state employees.
      *   **A) Approve** → Go to 6
      *   **B) Tolerate** → Go to 6
      *   **C) Reject** → Go to 7

  4.  **Mirror Rule:** The state offers grants for after-school ethics programs. Any religious group offering such a program gets funding *only if* identical funding is also offered to secular humanist, atheist, or other life-philosophy groups on the exact same terms.
      *   **A) Approve** → **Non-Preferentialism**: State may fund all comprehensive doctrines (religious or not) equally. *Awkward: Must fund extreme or fringe groups if they meet neutral criteria.*
      *   **B) Tolerate** → **Principled Pluralism**: State may fund associations (religious or secular) providing public goods, respecting their autonomy. *Awkward: Allows funding groups with internal discriminatory practices.*
      *   **C) Reject** → **Strict No-Aid Separationism**: State must avoid *any* funding or resources going to religious institutions/activities. *Awkward: May force closure of beneficial religious-run social services the state doesn't provide.*

  5.  **State Doctrine Board:** A government board must certify that a religious group "does not preach hatred" before it can receive any state benefit or recognition. The board is forbidden by law from judging the group's actual theological doctrines.
      *   **A) Approve** → **Erastianism Lite**: State can have limited oversight over religious groups' civic impact. *Awkward: State judges the "effect" of preaching, potentially chilling speech.*
      *   **B) Tolerate** → **Principled Pluralism** (See Leaf 4B)
      *   **C) Reject** → Go to 8

  6.  **Silent Establishment:** The state has an official religion, inherited from centuries past. It is never mentioned in laws, schools, or ceremonies. It receives funding *only* from the income of a centuries-old property endowment (no taxes).
      *   **A) Approve** → **Establishmentarian**: State should officially support one religion, even symbolically. *Awkward: Maintains a privileged status for one faith based on history.*
      *   **B) Tolerate** → **Accommodationist**: Tolerates historical entanglements but opposes new ones. *Awkward: Hard to justify why old symbols are okay but new ones aren't.*
      *   **C) Reject** → **Laïcité**: State must enforce strict civic uniformity in public institutions, especially symbols. *Awkward: Can restrict individual religious expression of public employees/students.*

  7.  **Caritative Carve-out:** The state contracts with religious bodies *only* to run essential services it would otherwise run itself (food banks, hospitals, preschools), paying only the operational cost under strict, identical auditing rules. It funds nothing else religious.
      *   **A) Approve** → **Principled Pluralism** (See Leaf 4B)
      *   **B) Tolerate** → **Accommodationist** (See Leaf 6B)
      *   **C) Reject** → **Strict No-Aid Separationism** (See Leaf 4C)

  8.  **Coercion Check:** Rejecting both Exit-Fee (Q1) and State Doctrine Board (Q5) likely means you object to coercion *and* state authority over doctrine. Does *any* direct state funding of core religious activities (like worship services, clergy salaries) seem acceptable?
      *   **A) Yes, if non-exclusive/historical** → **Accommodationist** (See Leaf 6B) *(But note tension: Rejecting Doctrine Board suggests strong anti-authority stance)*
      *   **B) No, never acceptable** → **Strict No-Aid Separationism** (See Leaf 4C)
      *   **C) Only if all groups get it equally (Mirror Rule)** → **Non-Preferentialism** (See Leaf 4A) *(But note: You rejected Exit-Fee, which is coercive)*
      *   **(Unnamed Position 1)** → *Approving direct funding while rejecting both coercion AND state oversight is logically possible but likely unstable/practically rare.* **Most likely land on Separationism (B) or Non-Preferentialism (C).**

  **Leaves Summary:**
  *   **Establishmentarian:** Approves symbolic/official state religion. (Q6A)
  *   **Non-Preferentialism:** Approves funding all doctrines equally. (Q4A)
  *   **Strict No-Aid Separationism:** Rejects state funding/entanglement. (Q4C, Q7C, Q8B)
  *   **Laïcité:** Focuses on banning visible symbols in public institutions. (Q3A/B)
  *   **Principled Pluralism:** Approves funding associations for public goods, respects autonomy. (Q4B, Q5B, Q7A)
  *   **Accommodationist:** Tolerates historical entanglements, opposes new ones. (Q6B, Q7B, Q8A)
  *   **Erastianism Lite:** Tolerates state oversight for civic impact. (Q5A)
  *   **Unnamed Position 1:** Approves direct funding but rejects coercion *and* oversight. (Q8 Note) *Likely rare/attractive only in theory.*
  *   **Unnamed Position 2:** Rejects Exit-Fee (coercion) but *approves* State Doctrine Board (state authority). (Not Reached) *Incoherent: If state authority over doctrine is acceptable, why object to mild coercion enforcing it?*

  ---

  **Notes on How I Built This**

  1.  **Starting Distinctions:** I brainstormed axes of disagreement:
      *   **Coercion:** Does forcing participation (like Exit-Fee) matter fundamentally? (Your key objection #1)
      *   **State Authority:** Does the state have *any* legitimate role in judging religion (doctrine or impact)? (Objection #2)
      *   **Civic Standing:** Does symbolic state affiliation harm non-members? (Objection #3)
      *   **Fungibility/Corruption:** Does state money inherently corrupt religion or vice-versa? (Objection #4)
      *   **Scope of Funding:** What *kind* of entanglement is okay? (Core worship? Buildings? Social services? All groups equally?)
      *   **Symbolism vs. Material Aid:** Is visible religious presence in state institutions distinct from funding?

  2.  **Pruning & Choosing Nodes:**
      *   **Coercion (Objection #1):** Essential. *Exit-Fee Asymmetry (Q1)* isolates this perfectly. Forces a choice on burdening dissent.
      *   **State Authority (Objection #2):** Critical. *State Doctrine Board (Q5)* tests willingness to let state judge religious impact, even without touching doctrine. Cutting direct doctrinal review kept it concrete.
      *   **Civic Standing (Objection #3):** *Silent Establishment (Q6)* tests tolerance for symbolic establishment without current coercion/funding. *Public Uniform Rule (Q3)* isolates the "visible symbols in public institutions" aspect central to laïcité.
      *   **Fungibility/Corruption (Objection #4):** Harder to isolate cleanly. *Heritage Clause (Q2)* and *Caritative Carve-out (Q7)* get at it indirectly by offering funding with specific justifications (heritage, efficiency) that might bypass corruption worries. *Mirror Rule (Q4)* tests if universalism alleviates corruption concerns. It's interwoven but distinct nodes probe it.
      *   **Scope/Inclusivity:** *Mirror Rule (Q4)* is key for separating Non-Preferentialism (approve) from Principled Pluralism (tolerate/reject). *Heritage Clause (Q2)* tests selectivity based on history.
      *   **Symbolism vs. Aid:** *Public Uniform Rule (Q3)* vs. funding questions explicitly separates Laïcité from funding-focused positions.
      *   **Cut:** *Conscience Ledger* (too similar to opt-out, less core). *Two-Key System* (elements covered by Doctrine Board & Mirror Rule). Added *Public Uniform Rule* (symbols) and *State Doctrine Board* (authority).

  3.  **Mapping Positions & Finding Empty Branches:**
      *   **Required Positions:** Located via specific paths (see Leaves Summary).
      *   **Unnamed Position 1 (Q8):** Approving direct funding while rejecting *both* coercion (Q1C) *and* state oversight (Q5C) is logically possible ("State should just give money freely with no strings or pressure"). However, it's likely unstable (why fund if you can't ensure basic civic compliance?) and attractive only in theory. Diagnosed as *merely unattractive or unstable*, not incoherent.
      *   **Unnamed Position 2:** Rejecting Exit-Fee (Q1C, coercion bad) but *approving* State Doctrine Board (Q5A, state authority okay). This seems *incoherent*: If the state has legitimate authority to judge religious groups for civic impact, why object to a mild coercive mechanism (exit fee) enforcing participation in funding those groups? This branch wasn't reached.
      *   **Collapsing Views:** Laïcité (Q3A/B) and Strict Separationism (Q4C/Q7C/Q8B) *both* likely reject Heritage Clause (Q2C) and Silent Establishment (Q6C). The tree *can* separate them via Q3 (Public Uniform Rule - Laïcité approves/tolerates, Strict Separationism might reject/tolerate depending on focus) and Q7 (Caritative - Laïcité might tolerate, Strict Separation rejects). However, **they might land on the same leaf (Strict Separationism) if they consistently reject all nodes.** The Q3 node *tries* to separate them, but strong separationists might also endorse symbol bans. *I flag this potential overlap.* Accommodationist and Principled Pluralism also share some leaves (Q6B, Q7B), distinguished by their answers elsewhere (e.g., Q4 Mirror Rule).

  4.  **Self-Check:** The tree *does* distinguish the core objections:
      *   Coercion: Q1 (Exit-Fee)
      *   State Authority: Q5 (Doctrine Board)
      *   Civic Standing: Q3 (Symbol Ban), Q6 (Silent Est.)
      *   Fungibility/Corruption: Implicated in Q2 (Heritage), Q4 (Mirror Rule), Q7 (Caritative)
      *   Two people differing *only* on why they reject entanglement (e.g., one cites coercion, another cites corruption) *will* potentially answer Q1 and Q7 differently, leading them down different initial paths (Q1C → Q3 vs Q1A → Q2 → potentially Q2C → Q5) and likely to different leaves (e.g., Laïcité vs Separationism). The tree forces them to confront specific mechanisms.

  ---

  **Format:** Designed for one printed page (approx. 650 words). Plain language. Terms like "Erastianism," "laïcité," "non-preferentialism," "pluralism" are introduced in the leaves with brief explanations/commitments. No citations, cases, or quotes. Real countries mentioned only as implicit background for the hypotheticals.
