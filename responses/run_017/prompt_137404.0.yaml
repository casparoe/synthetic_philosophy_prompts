prompt: |-
  I build and calibrate simulation models for a living, mostly population-dynamic and agent-based ones, and I read philosophy of science in the evenings. I keep running into one configuration of the unrealistic-assumptions problem that I cannot find a word for, and I would like to know whether anyone has carved it out, under any name, or whether it genuinely needs a new one.

  I know roughly where I am. There is the methodological claim associated with Friedman's essay on positive economics, that the descriptive accuracy of a theory's assumptions is not what licenses the theory, and there is the stronger twist sometimes extracted from it, that unrealistic assumptions are a sign of a theory's power rather than a cost it bears. My configuration does not feel like a faction in that argument. In my cases nobody is claiming the assumption is harmless, and nobody is claiming it is a virtue. The peculiar thing is that it is hard to see how to replace it with a true statement at all, because every candidate replacement says more than the original did and therefore covers less.

  Three cases, so that the pattern is visible rather than merely asserted.

  First. Take an old-style population model: infinitely large population, completely well-mixed, no spatial structure, no age structure. Out comes a clean threshold result about which traits will spread. Real populations are finite and structured, and when you write down a concrete structured model the result shifts, and shifts differently depending on whether you put in a lattice, a network, local dispersal, or overlapping generations. Yet the qualitative result of the unstructured infinite model keeps turning up in data drawn from all of these very different systems. Notice that my complaint is not the familiar one that finite models fail to converge on the infinite one as the distortion is dialled down, though sometimes they do; my complaint is that there is no single true replacement, that the available replacements disagree with one another about the mechanism, and that the ideal model somehow sits above all of them at once.

  Second. The same shape appears in any model with a single representative agent, or in mechanics with rigid bodies and frictionless constraints. Replace the representative agent with any specific heterogeneous-agent model and you must pick a heterogeneity; the clean comparative static then either survives for reasons internal to that choice or vanishes, and what the representative-agent model stated is not identical to any of the heterogeneous results but is rather what that whole family has in common.

  Third, a case that feels different in kind and that I am least sure about. A colleague tells me that in statistical mechanics the sharp discontinuities we call phase transitions only appear in the limit of infinite system size, because for any finite system the relevant functions are perfectly smooth. If that is right, then the infinite-size assumption is not something one corrects by adding finite-size corrections; it is what makes the phenomenon stateable in the first place. Part of what I want to know is what kind of claim that is.

  My provisional three-way cut is this. Type A: distortions you can dial down, with the predictions converging as you do. Type B: distortions that are load-bearing, where dialling them down does not converge back and the derivation collapses instead. Type C: the ones I am asking about, which seem not false so much as uncommitted, functioning like a place-holder that ranges over many incompatible but individually more truthful stories, none of which has the coverage of the original.

  So, concretely, what I want to know:

  One, does type C have an established name, or is it distributed across several named concepts that nobody has noticed overlap here?

  Two, I suspect type C is not one thing. Sometimes the various concretions agree on the target result, in which case the ideal model looks like a robustness argument compressed into a single model. Sometimes they disagree, and yet each is empirically adequate in its own domain, in which case the model looks like it is tracking a constraint or an invariance rather than a mechanism. Should that split be drawn, and if so where exactly, and does the difference change what the model's success entitles us to believe?

  Three, what is the right thing to say about the truth-status of a type-C assumption: that it is not the sort of thing that can be true or false; that it is true of a capacity or tendency that no real system ever instantiates on its own; that it defines a class of systems rather than describing any of them? These seem to me to give different advice about what to do next, and I want to know which is defensible and why the others are not.

  Four, is my three-way cut the right one at all, or am I collapsing distinctions that do real work?

  What I am not asking for: a reading list, a bibliography, or citations. I have no library access where I am writing and could not follow any of them up, so a list of names and papers would be useless to me even if accurate. I want the carving. Specifically: state what you take the nearest established concepts to be, in your own words, and say of each exactly where it fits my cases and where it fails them; then either identify the existing concept that fits best or, if none fits, coin and define one tightly enough that another person could apply the definition to a new case; then give me one hard case that sits on the boundary between type B and type C and say what turns on which side of the line it falls, or, if you think that line is not worth drawing, say what should replace it; finally, say what follows for the methodological instruction to de-idealize, since in type-C cases I cannot see that de-idealization is even a coherent demand.

  Aim for roughly 800 to 1100 words of prose, and please do not close by observing that scientific models are diverse and that different tools suit different purposes. I know that. Commit to a classification and defend it.
reasoning: |-
  Okay, let me tackle this user's query. They're a simulation modeler working with population dynamics and agent-based models, also interested in philosophy of science. The core issue is about a specific type of unrealistic assumption that doesn't fit neatly into existing categories. They call it Type C, where the assumption isn't just a simplification but acts as a placeholder that covers multiple incompatible but more truthful models. 

  First, I need to map their Type C to existing philosophical concepts. The user mentioned Friedman's instrumentalism, but Type C seems different. Robustness phenomena come to mind—like Weisberg’s—where multiple models converge on the same result. That fits their first two examples where different structures still show the same threshold behavior. But the phase transition example is trickier. Infinite limits there aren't just about robustness; they define the phenomenon itself. Batterman’s work on asymptotic explanations and universality classes might apply here. The infinite system isn't an approximation but a necessity for defining the phase transition.

  The user’s three-way split (A, B, C) makes sense. Type A converges when distortions are dialed down. Type B collapses without the distortion. Type C is different because the assumption isn't replaceable by a single true statement. Instead, it captures something common across diverse models. 

  For the split within Type C: When concretions agree (like the population threshold), it's a robustness argument. When they disagree but each works in its domain (like representative agents), the model tracks a constraint. The phase transition case is distinct because the infinite limit defines the phenomenon; finite systems approximate it but can't replicate the discontinuity. So maybe Type C has subcategories: robustness-to-details and phenomenon-defining limits.

  Truth-status for Type C is tricky. Saying it's false misses the point. Maybe it's about capturing modal truths—what would happen under idealized conditions. Or it defines a target that real systems approximate. The user’s suggestion of "uncommitted" fits; the assumption avoids over-specifying, allowing broad applicability.

  Is the three-way cut valid? Probably, but the boundary between B and C needs clarity. Take finite populations with drift vs. infinite models. If drift changes the outcome qualitatively, that's Type B. If it only adds noise but the threshold still holds approximately, it's Type C. The key is whether the core result persists across concretions.

  De-idealizing Type C isn't straightforward. Adding details narrows the model's scope. The methodological takeaway might be to recognize when an idealized model serves as a unifying framework, and de-idealize only when context-specific predictions are needed.

  The user wants a committed classification. So, define Type C as "modal abstraction" where assumptions are under-specified to cover multiple realizations. Subtypes: robustness and invariance. Phase transitions fall under phenomenon-defining limits. The truth-status is about capturing necessary conditions or constraints. De-idealization isn't always necessary; sometimes the idealization's power is its breadth.
answer: |-
  Here's a carving based on your cases and constraints, committing to a classification and its defense:

  **The Established Landscape & Its Gaps:**
  Your Type C doesn't map cleanly onto a single dominant concept. Near neighbors exist but miss key aspects:

  1.  **Idealization (Broadly):** Covers all simplifications. Doesn't distinguish your A, B, and C types. Type C is a distinct *kind* of idealization.
  2.  **Asymptotic Explanation / Infinite Limits (e.g., Batterman):** Fits your phase transition case *perfectly* – the infinite system isn't an approximation *of* a finite system; it defines the *phenomenon itself* (the discontinuity), which finite systems only approximate. However, it fails your first two cases: The infinite-population model *doesn't* define the threshold phenomenon itself (which *can* be observed, albeit fuzzily, in finite systems); it *abstracts away* mechanisms present in finite/structure models. The representative agent isn't an asymptotic limit defining a new phenomenon.
  3.  **Multiple Models / Robustness (e.g., Weisberg, Wimsatt):** Captures the *effect* in your first two cases – the result persists across diverse concretizations. However, it describes a *relationship between models/data*, not a characteristic *internal to a single model's assumption*. Type C is about the *status and function of a specific assumption within one model* that *enables* this robustness analysis.
  4.  **Minimal Models (e.g., Batterman, Rice):** Models capturing only core features. Close, but Type C assumptions are often *less* than minimal – they aren't capturing core features so much as *avoiding commitment* to *any* specific mechanism that would render the model non-minimal (e.g., the infinite/well-mixed assumption avoids specifying *any* spatial/temporal structure). Minimal models often *include* core mechanisms; Type C assumpions *elide* them.
  5.  **Universality:** Captures the phase transition case beautifully (different systems sharing critical exponents). Explains *why* diverse concretizations (lattice, network) in your first case might show similar thresholds near criticality. But universality is often the *outcome explained* by asymptotic limits, not a description of the *assumption type* itself. It doesn't cleanly apply to the representative agent case.

  **The Carving: Defining "Modal Abstraction"**

  Your Type C is best understood as **Modal Abstraction**. This coinage emphasizes two core functions:

  1.  **Abstraction:** The assumption deliberately omits concrete details (size, structure, heterogeneity, specific interactions).
  2.  **Modality:** It functions not descriptively, but to define a *space of possibilities* or a *necessary condition*. It makes claims about *what could be* or *what must hold* under *some* concretization(s), rather than *what is*.

  **Definition:** A **Modal Abstraction** is an unrealistic assumption within a model that serves as a placeholder ranging over a (potentially diverse) set of possible concrete realizations. Its primary function is not descriptive accuracy but to:
      a)  Isolate a result that is *robust* across a range of concretizations (demonstrating its independence from specific omitted details), OR
      b)  Define the *very possibility* or *essential character* of a phenomenon only fully realized or defined under the abstraction (e.g., sharp phase transitions).
      Its "truth" lies not in correspondence with a single real system, but in capturing a *constraint*, *invariance*, or *defining limit* that governs the behavior of a *class* of systems.

  **Applying "Modal Abstraction" to Your Cases:**

  1.  **Infinite Well-Mixed Population:** *Modal Abstraction* (Robustness). The assumption ranges over all possible finite sizes and structures (lattices, networks, etc.). Its function is to isolate the threshold result as a robust feature common to this entire class, independent of the *specific* omitted details. The model doesn't describe *how* the threshold emerges in any *particular* structure, but *that* it emerges robustly across structures.
  2.  **Representative Agent:** *Modal Abstraction* (Constraint/Invariance). The assumption ranges over all possible distributions of heterogeneity. Its function is to derive a result (e.g., a comparative static) that holds only under specific aggregate conditions or constraints that *must* be satisfied by *any* heterogeneous instantiation for the result to obtain, even if the mechanism differs. It captures an aggregate invariance.
  3.  **Infinite System Size (Phase Transitions):** *Modal Abstraction* (Phenomenon-Defining Limit). The assumption doesn't range over finite systems; it defines the *sharp discontinuity* as a distinct phenomenon. Finite systems can only approximate it. The truth of the assumption lies in defining the *target phenomenon* itself, not in being an approximate description of finite systems. It defines a *necessary condition* for the phenomenon's existence *as such*.

  **The Split Within Type C: Robustness vs. Phenomenon-Defining**

  1.  **Robustness Modal Abstractions (Cases 1 & 2):** The abstraction isolates a result that remains invariant (qualitatively or quantitatively) across a significant range of concretizations. *What we learn:* The result depends on fundamental relationships captured by the abstract model (e.g., selection coefficients, budget constraints) and is surprisingly insensitive to vast classes of omitted details (structure, heterogeneity). Success entitles us to believe in the *robustness of the relationship*, not the literal mechanism of the abstract model.
  2.  **Phenomenon-Defining Modal Abstractions (Case 3):** The abstraction defines the phenomenon in its idealized, essential form. Concretizations (finite systems) manifest approximations or precursors. *What we learn:* The idealized phenomenon (e.g., sharp phase transition) reveals deep features of the underlying physics/mathematics (e.g., non-analyticity, universality classes). Success entitles us to believe that the idealized phenomenon captures an *essential feature* of reality that manifests clearly only in the limit, governing the *asymptotic behavior* of real systems. The mechanism *is* defined by the limit.

  **Truth-Status of Modal Abstractions:**

  Saying Modal Abstractions are "false" is unhelpful and misses their function. More accurate descriptions:

  1.  **They define a class or a target:** They are "true of" the *class* of systems whose behaviors converge under concretization (Robustness type) or whose large-scale behavior approximates the defined phenomenon (Phenomenon-Defining type).
  2.  **They capture constraints/invariances:** They are "true" in the sense of correctly identifying necessary mathematical or physical conditions that *must* hold for the result/phenomenon to be possible or robust. (e.g., The representative agent result identifies an aggregate constraint any heterogeneous population must satisfy for the comparative static to hold; the infinite limit defines the mathematical condition for non-analyticity).
  3.  **They are uncommitted, not false:** They deliberately avoid asserting specific details, making them incapable of being "false" about those details. Their validity lies in the *range* of systems for which their consequences hold robustly or in the *fidelity* with which real systems approximate the defined phenomenon.

  **The Boundary Case: Finite-Population Genetic Drift**

  *   **Scenario:** An infinite-alleles model shows a mutation-selection balance frequency. Real populations are finite, experiencing drift. Adding finite size (N) fundamentally changes the dynamics: alleles can fix or go extinct randomly. The equilibrium becomes a distribution, not a point. Increasing N makes the distribution peak near the infinite-N value, but the dynamics remain stochastic.
  *   **Is this Type B or Type C?** This sits on the boundary. It depends on the *question* and the *nature of the convergence*.
      *   **If the core question is "What is the *expected* allele frequency?" and the stochastic distribution peaks sharply near the infinite-N value for large N:** This leans **Type C (Robustness Modal Abstraction)**. The infinite model isolates the *deterministic expectation* robustly observed as the mean/peak in large finite populations, despite the change in mechanism (deterministic -> stochastic). The abstraction ranges over finite populations, capturing the robust expected value.
      *   **If the core question is about fixation probabilities, times to fixation, or the very existence of a stable point equilibrium:** This is **Type B (Load-Bearing Distortion)**. Adding finite size fundamentally alters the phenomenon – stable point equilibria vanish, replaced by stochastic dynamics. Dialling N up makes the system *persist longer near the expected value* but never recovers the point equilibrium or deterministic dynamics. The derivation of a stable equilibrium *collapses* with the distortion.
  *   **What Turns on It:** Classifying as Type C justifies using the infinite model to predict *central tendencies* in large populations and understand the *deterministic forces* at play, while recognizing the need for finite-N models for questions about variation, fixation, or small populations. Classifying as Type B warns that the core prediction (stable point equilibrium) is fundamentally unattainable and misrepresents the dynamics of real (finite) systems.

  **Methodological Instruction on De-idealization:**

  For Modal Abstractions (Type C), the demand to "de-idealize" is often **misguided or secondary**.

  1.  **The Point is the Abstraction:** The power *is* the uncommitted nature capturing robustness or defining the phenomenon. Premature concretization loses this breadth and can bury the essential insight under contingent details.
  2.  **De-idealization as Exploration, not Correction:** De-idealize not to "correct a falsehood," but to:
      *   *Explore Robustness:* Test the *range* of concretizations over which the abstract result holds (Robustness type).
      *   *Understand Approximations:* Study *how* real systems *approach* the idealized phenomenon (Phenomenon-Defining type).
      *   *Generate Specific Predictions:* When context demands predictions sensitive to specific omitted details (e.g., which *specific* network structure matters here?).
  3.  **Success Condition:** The modal abstraction succeeds if its core result *is* robust across relevant concretizations or if it *correctly defines* the target phenomenon that real systems approximate. Failure occurs if the result is highly sensitive to concretization or if the defined phenomenon doesn't correspond to observable asymptotic behavior.

  **Conclusion:**

  Your three-way cut (A: Convergent Approximation, B: Load-Bearing Distortion, C: Modal Abstraction) is valid and necessary. Modal Abstraction is the distinct concept you identified: unrealistic assumptions functioning as uncommitted placeholders defining classes, constraints, or phenomena. The split within C (Robustness vs. Phenomenon-Defining) matters: Robustness teaches us about insensitivity to details and fundamental relationships; Phenomenon-Defining teaches us about essential features and asymptotic behavior. Their truth lies in capturing invariances, constraints, or defining limits, not in descriptive correspondence. De-idealization is not a primary goal for Type C; its power *is* its breadth and abstraction. The boundary case shows that the line between B and C depends on whether the distortion destroys the core result/phenomenon (B) or merely transforms it while preserving a robust aspect/asymptotic target (C). This classification clarifies the function and justification for a crucial class of modeling assumptions.
