answer: |-
  ## Proposal: Selective Submission and the Epistemic Value of Majority Rule

  **1. The Question and Distinguished Claims**  
  The core question is: *When the agenda for collective voting is endogenously determined by a routing process that selects questions partly based on their difficulty (and where routers have partial information about difficulty), does the Condorcet jury theorem’s epistemic justification for majority rule hold equally for (A) the reliability of majority decisions *on voted questions* versus (B) the claim that routing *more questions to majority rule* improves overall decision quality?*  
  - Claim A: Majority rule is reliable for questions it actually decides (high accuracy on voted items).  
  - Claim B: Expanding the use of majority rule (routing more questions to the vote) improves a group’s overall decision quality.  

  **2. Why Standard Debates Leave This Open**  
  Existing critiques of the Condorcet theorem focus on exogenous questions: arguments about voter independence (e.g., common signals breaking independence), deliberation (correlating votes), or heterogeneous competence (e.g., experts vs. non-experts). These treat the agenda as given, debating whether the theorem applies *to a fixed set of questions*. My angle is orthogonal: even if independence/deliberation/competence challenges were resolved, the *selection of which questions reach a vote* could systematically bias the population of voted items toward easier or harder cases. Routing agents (e.g., committee chairs) filter questions based on perceived difficulty, creating correlation between selection and the very variable (difficulty) that affects voter competence. This selection mechanism is not addressed in standard defenses or critiques.  

  **3. Method: Nine-Month Plan**  
  *Assumption:* No empirical data collection; reliance on formal modeling and conceptual case analysis.  
  - **Months 1–2**: Develop a baseline model extending the jury theorem. Define "difficulty" as inversely related to average voter competence on a question. Formalize routing as a selection mechanism where items reach the vote only if a router (with partial competence) deems them unresolved by subunits. Output: Mathematical framework with competence as a function of difficulty.  
  - **Months 3–4**: Analytic work on competence under selection. Assume distributions of difficulty (e.g., uniform, normal) and router competence. Derive conditions where Claim A holds (voted questions show high majority accuracy) but Claim B fails (routing more questions lowers overall accuracy). Output: Proofs on when selection preserves/pooled competence.  
  - **Months 5–6**: Small-scale simulations. Test robustness via synthetic data: vary router competence, difficulty distributions, and routing thresholds. Output: Simulated "hit rates" for voted vs. non-voted items.  
  - **Months 7–8**: Illustrative case analysis. Examine the jury (deadlock implies high difficulty), foundation (routing bylaws), and legislative filibusters (issues reaching the floor are contested). Establish that selection *can* occur; cannot prove its real-world prevalence without data.  
  - **Month 9**: Synthesize limits. Formalize when conclusions depend on unknown parameters (e.g., difficulty skew) and derive bounds assuming worst-case distributions.  

  **4. Why This Approach Over Alternatives**  
  - *Empirical study of real bodies*: Useful for quantifying selection prevalence, but infeasible without data access and beyond scope. I extract qualitative insights (e.g., deadlocks signal difficulty) to inform modeling.  
  - *Conceptual analysis of "competence"*: Necessary to define difficulty-driven competence, but insufficient alone; formal modeling is needed to handle statistical dependencies.  
  - *Social-choice agenda control*: Focuses on strategic manipulation by outcome-oriented actors (e.g., restricting agendas to force preferred results). I assume non-strategic, information-based routing (e.g., a director routing hard questions to the board for fairness). This isolates epistemic reliability from preference-driven tactics.  

  **5. Range of Conclusions and Deflationary Steelman**  
  Possible conclusions:  
  - Strong deflation: Selection effects *are* absorbed into a redefined competence parameter for the voted subpopulation. The theorem’s structure holds: higher majority accuracy on voted questions (Claim A) still implies that voting is reliable *for that subset*. Claim B becomes irrelevant because routing decisions are outside the theorem’s scope.  
  - Moderate view: Claim A holds under broad conditions, but Claim B requires restrictive assumptions (e.g., router competence near 1.0).  
  - Strong critique: Under plausible selection (e.g., routers with competence <0.7), increasing votes *lowers* overall accuracy by adding hard questions voters bungle.  

  *Steelman deflationary view*: If routers are highly competent, selection creates a subpopulation of voted questions with stable, redefined competence (e.g., 0.65 after filtering). The theorem then applies cleanly to Claim A, and Claim B is not an epistemic claim but a managerial one about institutional design. My project merely refines competence measurement—a technical footnote.  

  *Decisive consideration*: Whether router competence and difficulty distributions are such that selection *systematically distorts* the competence parameter (e.g., making it non-constant or uncorrelated with true competence). If routers are perfect, distortion vanishes; if incompetent, selection warps the sample.  

  **6. Risks and Failure Conditions**  
  - *Main risk*: Conclusions hinge on unbounded empirical unknowns (e.g., real-world difficulty distributions). Without data, results may be too contingent on arbitrary assumptions.  
  - *Failure conditions*:  
    1. Analytic models prove intractable: No closed-form results emerge under selection.  
    2. Simulations show robustness: Selection effects are negligible across plausible scenarios.  
    3. Conceptual collapse: "Difficulty" cannot be formalized independently of voter competence.  
    4. Scope creep: Agenda-setting interacts irreducibly with strategic motives, muddying the epistemic focus.  
  - *Scope verdict*: Fits nine months if limited to formal results and case illustrations; "too big" if empirical validation is required.  

  **7. Practical Deliverable**  
  To the foundation’s bylaw committee: A conditional rule of thumb—*"Route fewer questions to full votes if your director/executive committee has high competence (>0.7) on difficulty assessment and voted items show very high agreement (>80%). Otherwise, default to broad voting."*  
  *Limits*: Assumes non-strategic routing; requires rough estimates of router competence; does not override procedural fairness needs.  

  **8. Concession to Proceduralists**  
  This project addresses *only* the reliability of majority rule and cannot engage with procedural legitimacy: someone who values voting as an expression of equal respect may endorse it even if selection effects make it unreliable, and my critique offers no argument against them.  

  ---

  ### Structured Objects  

  **Table: Framing Alternatives**  

  | Framing considered              | What it makes tractable                        | What it costs                                  | Verdict   |  
  |---------------------------------|-----------------------------------------------|-----------------------------------------------|-----------|  
  | **Epistemic reliability under endogenous agenda** | Isolates selection effects on competence; enables formal modeling of Claims A vs. B. | Cannot address strategic agenda manipulation or empirical frequency of selection. | **Adopt** |  
  | Empirical study of jury/board routing | Grounds selection effects in real data; quantifies distortion. | Requires data access and months of collection/analysis; infeasible in nine months. | Reject    |  
  | Pure conceptual critique of "competence" | Clarifies foundational terms; avoids technical work. | Fails to show statistical consequences (e.g., how selection breaks the theorem). | Reject    |  
  | Integration with strategic agenda control | Captures real-world agenda-setting motives. | Conflates epistemic and preference-based routing; intractable for isolation. | Fallback |  

