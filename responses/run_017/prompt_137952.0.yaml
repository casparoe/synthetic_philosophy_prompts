answer: |-
  ### Bottom line (150 words)
  Your museum's practices aren't governed by a single, coherent theory of what an object "is." Instead, they reflect **pragmatic conventions tied to institutional roles, legal/financial accountability, and context-specific values**. When restoring or maintaining objects/buildings, **continuous institutional custody + form/function preservation** defines identity (hence replaced parts don't create a new object). Replicas (like bronze casts) lack that custody chain. Digital files are "preservation" because they serve *informational* purposes, but 3D prints fail as repatriation substitutes because communities often seek **specific material with contested history, not just form**. Your colleague is mostly right: "original" in your paperwork signals **provenance and custodial responsibility**, not metaphysical identity. However, this doesn't resolve ethical tensions (e.g., repatriation demands). You need policies that explicitly separate **catalog identity** (tracked by accession numbers) from **ethical/legal obligations** (which vary by context).

  ### The implicit theory (~400 words)
  Your practices suggest a hybrid view prioritizing **narrative continuity and institutional function** over strict metaphysics. An artifact persists if:
  1.  **Its custodial history is unbroken** within the institution (e.g., the restored head or listed building remains under the same accession number/custody).
  2.  **Its significant form/function is maintained** through sanctioned conservation (repairs, replacements) adhering to professional standards.
  3.  **It fulfills the institutional role** assigned to it (exhibition, research, symbolic value).

  This isn't mere conventionalism. It leans on **causal-historical theories of identity**: the object is the unique entity originating at its creation point (or discovery/acquisition point for archaeological items) and persisting via a continuous, traceable chain of custody and care, *even if its matter changes gradually*. The accession number is the anchor for this history.

  Contrast this with replicas (the bronze cast). They lack the **original causal origin and custodial chain**. They are new creations *derived from* the original, not continuations of it. Their institutional role is inherently different (study copy, not primary exemplar).

  Digital scans fit the "form/function preservation" aspect *for informational purposes* – they preserve data crucial for research, reconstruction, or documentation. But they don't anchor the custodial chain or possess the material history. They are records *about* the object, not the persistent object itself under the accession number.

  The Ise Shrine exception highlights **ritual/communal practice as constitutive**. Its identity hinges on the *unbroken ritual process* of renewal, making the physical structure a temporary manifestation of an enduring tradition. Your museum's practices lack this ritual framework; custody and material intervention define persistence.

  ### What's Strictly Presupposed vs. What Merely Fits (~250 words)
  *   **Strictly Presupposed:**
      *   **Traceability:** An object must have a unique, unbroken, documented chain of custody (provenance) anchored by its accession number.
      *   **Institutional Authority:** The museum defines "significant form/function" and sanctions conservation interventions that preserve it without breaking identity.
      *   **Material Doesn't Dictate Identity:** Gradual replacement (marble arm, building timber) is permissible under institutional authority without creating a new entity. An object isn't *just* its current matter.
      *   **Original ≠ Replica:** A replica, no matter how accurate, is a new creation lacking the original's causal origin and custodial history.
  *   **Merely Fits (Could Change):**
      *   **Degree of Replacement:** How much material can be replaced before identity is questioned? Your practices imply "gradual" is key, but the threshold is conventional (Ise pushes this boundary).
      *   **Value of Material Authenticity:** While matter isn't identity-defining, its *authenticity* carries immense value for research, aura, and specific communities. The policies reveal a tension: matter is *dispensable* for identity but *essential* for certain purposes (repatriation, aura).
      *   **Digital = Preservation:** This language conflates preserving *information about* the object with preserving *the object itself*. It fits the informational role but obscures the material/historical aspect demanded elsewhere. A scan isn't the object under the accession number.

  ### The Hard Cases: Ise & Scan-and-Print Repatriation (~300 words)
  *   **Ise Shrine:** This directly challenges the "gradual replacement" model. Complete, periodic demolition and rebuilding isn't gradual. Its persistence relies on **ritual continuity and communal intentionality**. The shrine is the *enduring ritual practice itself*, not the specific material at any time. The material structure is a *phase* of the ritual object. Your museum lacks this ritual framework. Applying the Ise logic would imply an object's identity could persist through *any* sanctioned replacement if part of an unbroken institutional practice – but this clashes with the replica distinction (demolish-and-rebuild isn't "like-for-like repair"). **Verdict:** Ise operates on a fundamentally different constitutive principle (ritual) not directly transferable to your context.
  *   **Scan-and-Print for Repatriation:** The insult arises because the offer fundamentally misunderstands the community's claim. They typically seek:
      1.  **Specific Contested Matter:** The physical object embodies a history of removal, trauma, or spiritual connection. A replica lacks this history.
      2.  **Restitution of Relationship:** Returning *the thing taken* acknowledges past wrongs and restores agency. A replica feels like a dismissal, implying the history and relationship are replaceable.
      3.  **Inalienability:** For many cultures, certain objects are inalienable – intrinsically tied to the community, non-reproducible, non-fungible. A print is alienable by nature.
      Your "digital preservation" language inadvertently highlights the disconnect: you treat the scan as preserving the *essence* (form/information) for *your* purposes (research, display copies), but deny that essence suffices for *their* purposes. **Verdict:** Your practice isn't inconsistent *internally* (the print is clearly a replica lacking the accession number/history), but it reveals a blind spot in valuing material history *only when convenient for the institution*, not when demanded by source communities.

  ### If We Switched Theories (~200 words)
  *   **Strict Material Identity (Object = Its Matter):** You'd need to stop all invasive restoration involving replacement (no filler, no new arms). Every replaced fragment becomes a new object; the "original" shrinks or ceases to exist. Plaster reconstructions would be new replicas. Boxes of fragments *would be* the original (or parts of it). Repatriation demands would be clearer (give back the specific matter), but conservation would be crippled. Replicas couldn't be confused with originals.
  *   **Coinciding Objects (Statue + Lump of Bronze):** Cataloging becomes a nightmare. Is the accession number for the statue (persisting through change) or the lump (changing constantly)? Conservation might be easier (repairing the lump doesn't destroy the statue), but provenance chains get tangled. Repatriation: which "object" is being requested? This adds complexity without solving core issues.
  *   **Pure Conventionalism (Community/Practice Defines Persistence):** You *could* potentially list replicas if deemed significant, or accept Ise-like rebuilds as originals. However, it erodes stable cataloging and legal/financial accountability. Who is the "relevant community"? (Staff? Source community? Public?) Resolving disputes (e.g., conservation vs. curator views) becomes arbitrary without clear principles. Repatriation gets murkier – does the museum's practice or the source community's define the object's identity for return? **Your colleague's "right history" view is the most pragmatic and closest to current practice, but needs explicit ethical frameworks for contested cases like repatriation.**
