  The core tension is between matter and form: museums prioritize form in restoration (keeping identity despite material replacement) but matter in repatriation (rejecting perfect replicas). The Ise Shrine example challenges both by prioritizing continuity of practice over either. Digital "preservation" language implicitly treats form as sufficient until communities demand matter - exposing a conflict between institutional and source community values. 

  The colleague's "right history" view fits many practices: accession numbers track provenance regardless of material changes. But it stumbles on Ise (no material continuity) and repatriation (communities may reject historical acquisition as "right"). A pure conventionalist view (persistence defined by community practices) could accommodate Ise and repatriation but might destabilize museum cataloging. 

  For hard cases: Ise works because the rebuilding ritual itself is the persistent entity - the physical shrine is a temporal stage. Repatriation refusals of 3D prints reveal that "original" often means "the one taken" - tying identity to specific matter with contested history. Digital scans as "preservation" is arguably misleading; it preserves information, not the artifact. 

  If switching theories: Adopting strict material identity would halt most restoration and force fragments to be separate objects. Conventionalism might allow listing replicas but could confuse legal/insurance contexts. The "right history" view is pragmatically closest to current praxis but needs explicit ethical framing for repatriation cases. 

