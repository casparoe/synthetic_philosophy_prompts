  The user presents two original cases: "preacher's loop" (correlation influenced by past decision-theory beliefs) and "bookie's loop" (adversarial anti-correlation), plus "signaling regress" (pre-commitment strategies). Their hypothesis is that multiple disagreements are conflated: (1) what's chosen (act vs. policy vs. policy-generating process), (2) the purpose of decision theory (rationality criterion vs. design specification), and (3) verbal differences in how possibilities are partitioned.

  The user wants a diagnosis—not a verdict—of these fault lines. For each, they want to know if it's verbal or substantive, what it hinges on (facts, evidence standards, case selection, intuitions), and how the original cases illuminate it. They also seek a "cleaner" test case and honest thoughts on what progress would look like.

  First, I need to map the fault lines precisely from their hypothesis:  
  1. **Object of choice** (act/policy/policy-generation)  
  2. **Purpose of DT** (rationality-in-situ vs. design-for-agents)  
  3. **Partition granularity** (fine-grained states carrying correlation vs. coarse states requiring empirical correlation)  

  Then, I'll analyze each:  
  - **Fault Line 1**: Substantive. Turns on whether correlation is fixed (critics) or estimable (EDT). Preacher's loop shows estimation is contaminated; bookie's loop shows adversarial manipulation. Cleaner case: "The Oracle's Filter" (correlation manipulated by an entity that screens agents based on their decision theory).  
  - **Fault Line 2**: Substantive but misaligned. Philosophers (rationality) vs. ML (design). Signaling regress exposes this: EDT sees stage-zero as part of the same evidential calculation; ML sees it as meta-policy optimization.  
  - **Fault Line 3**: Verbal (mostly). Critics insist on coarse partitions where correlation is dynamic; EDT defaults to fine partitions where it's "baked in." Both sides are right within their frameworks but talk past each other.

  For progress:  
  - Fault Line 1 needs formal work on fixed-point stability.  
  - Fault Line 2 requires acknowledging divergent goals.  
  - Fault Line 3 needs explicit agreement on partition rules.  
