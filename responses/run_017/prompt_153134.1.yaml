prompt: |-
  Several large philanthropic funders, and the cause-selection advice written for donors in that circle, rank candidate causes with a three-factor rubric. Each cause is scored for importance (roughly: how much value would be created, or how much disvalue averted, by solving the whole problem), tractability (roughly: what fraction of the problem a marginal dollar, or a marginal researcher-year, can be expected to solve), and neglectedness (roughly: how little funding and talent is currently going into it). The three scores, usually on coarse logarithmic or 1-to-5 scales, are combined multiplicatively, and the product is used to rank causes: money goes to the top-ranked cause until it is judged saturated, then to the next. Within a cause, the same funders switch to a different-looking metric: expected good per dollar in a common unit such as a disability-adjusted life year, with an explicit deduction for the share of the outcome that would have happened anyway without the grant.

  What puzzles me is that the two halves seem to rest on different ideas. Neglectedness is normally justified by diminishing returns: the best opportunities in a crowded field are already taken, so your marginal dollar buys less there. But tractability as usually defined is itself a marginal-per-dollar quantity, and importance is a total, not a marginal, quantity; a product of the two already looks like value per dollar at the current margin, which would make neglectedness either redundant or a correction of a different kind. Meanwhile the funders say they care only about outcomes and not about who gets credit, yet they treat heavily funded causes as unattractive in their own right; and they defend concentration in one top-ranked cause, rather than diversification, using the same diminishing-returns reasoning that made neglectedness matter. Leadership also carves out an exception for what it calls hits-based causes, where nearly all the value comes from a small number of large successes and the average grant accomplishes nothing.

  I would like the implicit theory reconstructed. What view of value, and of what a funder ought to do, does this practice presuppose — maximization of impartial impersonal value, commensurability across very different kinds of good, cause-neutrality, a specific story about diminishing returns and about how other funders respond to your spending? Which of these does the rubric strictly require, which does it merely fit comfortably with, and where is it philosophically underdetermined, so that a satisficer, or someone who thinks a funder may properly favor a cause for reasons of relationship or obligation, could still use it? Is the multiplicative form doing real work or is it a heuristic that misrepresents the quantity it approximates, and are importance, tractability and neglectedness even separable enough to multiply?

  Finally, suppose a trustee proposed replacing the rubric with a straight estimate of the expected counterfactual value of the marginal dollar, computed explicitly against a model of the whole funding landscape including crowding out and crowding in, and with allocation decided over a portfolio rather than by ranking. What exactly would that change about which causes get funded and how, and would anything that the current rubric tracks well be lost in the translation?
reasoning: |-
  Okay, let me try to unpack this user's query. They're asking about a philanthropic funding rubric that uses importance, tractability, and neglectedness (ITN) to rank causes. The user is puzzled because the rubric seems internally inconsistent—tractability already measures marginal impact per dollar, so why multiply by neglectedness? Also, they switch to expected value per dollar within a cause, which seems at odds with the initial approach. Plus, there's this hits-based exception. The user wants to understand the underlying assumptions and what a portfolio approach might change.

  First, I need to parse the core issues. The user is pointing out that tractability is marginal, importance is total, and neglectedness adjusts for diminishing returns. But if tractability is already marginal, then multiplying importance and tractability should give the marginal impact, making neglectedness redundant. But that's not right because tractability is defined per marginal dollar without considering current funding levels. So neglectedness accounts for how funding saturation reduces that marginal return. That makes sense—tractability is about the cause's inherent responsiveness, while neglectedness is about how much it's been funded already.

  Then there's the switch to DALYs within a cause. The user wonders why they don't just use marginal expected value everywhere. The answer is practicality. Estimating marginal impact across all causes is hard. The ITN framework simplifies by using proxies. Importance and tractability are about the cause itself, while neglectedness is a proxy for the funding environment. So the multiplication gives an estimate of marginal impact without complex modeling.

  The user also questions the funders' claim of caring only about outcomes while avoiding saturated causes. But avoiding saturation isn't about credit; it's about efficiency. If a cause is well-funded, additional dollars do less good. That's consistent with outcome-focused altruism. The concentration versus diversification point is interesting. The rubric ranks causes and funds the top one until saturated. But a portfolio approach might be better. The user's trustee proposal addresses this. The current method might miss synergies or risk diversification benefits. However, the rubric's simplicity is a strength—it's easier to apply across diverse causes without detailed models.

  Hits-based causes are another exception. For high-risk, high-reward areas, the average grant does nothing, but a few succeed big. The standard ITN might undervalue these because tractability looks low on average. So funders adjust, maybe by focusing on the potential upside rather than average impact. This shows the rubric isn't rigid; it adapts to context.

  The user's deeper questions involve the philosophical underpinnings. What values does this assume? Total utilitarianism, cause neutrality, diminishing returns. The rubric requires diminishing returns and cause neutrality but can accommodate different value theories as long as outcomes are commensurable. The multiplicative form is a heuristic; it's separable only if the factors are independent, which they might not be. For example, more funding could improve tractability via innovation, breaking independence.

  The trustee's proposal would shift to explicit marginal value estimates and portfolio allocation. This could better handle interactions between causes and diversification. However, it requires complex modeling and data that might not exist. The current rubric's strength is its simplicity and applicability across causes with limited information. But it might miss cross-cause effects and undervalue high-risk opportunities.

  I should also consider the user's possible identity. They seem knowledgeable about philanthropy, maybe a trustee or advisor. Their concerns suggest they're critiquing the framework's theoretical consistency. They might be looking to improve their foundation's approach or write a critique. The unspoken need could be understanding whether to adopt the trustee's proposal or defend the current model.

  In reconstructing the implicit theory, it's about maximizing counterfactual marginal impact under uncertainty. The rubric proxies for what a full model would do. The multiplication works if neglectedness inversely correlates with current funding. But it's an approximation. The philosophical commitments are cause neutrality and diminishing returns, but other values can fit if the factors are adjusted.

  Switching to the portfolio model would change funding by accounting for interactions and risk. It might fund a mix of causes instead of one top cause. But without good data, it could be error-prone. The current rubric's loss would be simplicity and transparency, which help in collaborative funding environments.

  In essence, the user is highlighting tensions between theoretical purity and practical application. The ITN framework is a useful heuristic but has limitations. The trustee's proposal is theoretically better but harder to implement. The choice depends on data availability and the funder's capacity for complex analysis.
answer: |-
  Your analysis astutely identifies tensions in the common ITN (Importance, Tractability, Neglectedness) rubric. Let's reconstruct the implicit theory, its presuppositions, limitations, and the implications of your trustee's proposal.

  **Reconstructing the Implicit Theory & Presuppositions:**

  1.  **Core Objective:** Maximization of *counterfactual marginal expected value* (CMEV) per unit resource (dollar/researcher-year). Funders act as impartial, consequentialist optimizers.
  2.  **Commensurability:** Assumes all value (averted suffering, increased welfare, knowledge gains) *can* be reduced to a common unit (e.g., DALYs, QALYs, "utils"), at least practically for comparison.
  3.  **Cause-Neutrality:** Funders have *no* intrinsic preference for one cause domain (health, education, AI safety) over another. Value is value, regardless of source.
  4.  **The Diminishing Returns & Funding Landscape Model:**
      *   **Tractability (T):** Defined as the *inherent, average* marginal effectiveness *at very low funding levels* (or per unit effort). It's the slope of the impact curve near zero funding. (e.g., "How many lives saved per $1M if we were the *only* funder in this space?").
      *   **Neglectedness (N):** A proxy for *current position* on the diminishing returns curve. High neglect means the field is still near the steep part of the curve; high saturation means it's on the flat part. It's a correction factor applied to T.
      *   **The Product (I * T * N):** This aims to approximate the *current* CMEV per dollar:
          *   `I * T` approximates the *total potential value accessible per marginal dollar if the field were empty* (Value accessible per $ *if* you could buy the first units of progress cheaply).
          *   `N` acts as a multiplier reflecting *what fraction* of that initial potential effectiveness remains available *at the current margin* due to lack of prior investment. (Think: `Current CMEV ≈ (Max Potential Value Accessible per $) * (Fraction of Initial Slope Remaining)`).
      *   **Why Neglectedness Isn't Redundant:** T is *field-specific physics/biology/economics* (e.g., vaccine cost-effectiveness in a lab). N is *funding landscape economics* (e.g., how many other labs are already working on similar vaccines, bidding up researcher salaries, taking the easy wins). T defines the *shape* of the curve; N defines *where we are* on that curve.
  5.  **Concentration Justification:** The diminishing returns logic implies the *steepest* curve (highest `I*T*N`) offers the highest CMEV *until* your funding pushes it down the curve sufficiently that the next cause offers a higher CMEV. Diversification is suboptimal if one cause remains significantly steeper.
  6.  **Within-Cause Shift:** Once committed to a cause, the "expected good per dollar" metric *is* the direct attempt to estimate CMEV for specific interventions *within* that cause, incorporating counterfactuals (what would happen anyway). This is consistent with the overall goal but requires finer-grained data available only after cause selection.
  7.  **Hits-Based Exception:** Acknowledges limitations of the average/expected value framework for causes dominated by extreme right-tail outcomes with very low probabilities. The standard `I*T*N` product (relying on average tractability) dramatically *underestimates* the CMEV for a funder willing to absorb high variance. Leadership relaxes the reliance on the *average* implied by T and N, focusing instead on the *potential magnitude* (I) and the counterfactual probability of enabling a "hit" *given their specific grant*.

  **Philosophical Commitments and Underdetermination:**

  *   **Strictly Required:**
      *   **Consequentialism:** Focus on outcomes, not inputs, credit, or intrinsic properties of causes.
      *   **Cause-Neutrality:** Willingness to compare vastly different domains via a common value metric.
      *   **Diminishing Returns:** Belief that marginal impact decreases as more resources enter a specific sub-field/problem.
      *   **Marginalism:** The focus is on the *next* dollar's impact, not average or total impact.
  *   **Comfortable Fit (But Not Strictly Required):**
      *   **Utilitarianism/Total Welfare Maximization:** The common unit (DALY/etc.) leans heavily towards this.
      *   **Perfect Information/Calculability:** The rubric assumes these factors *can* be estimated usefully.
      *   **Independence of Factors:** Multiplying I, T, N assumes they are separable.
  *   **Philosophically Underdetermined:**
      *   **Value Theory:** A satisficer could use ITN scores to find causes meeting a "good enough" CMEV threshold. Someone with relational/obligation-based reasons could *add* those reasons as a fourth factor or use ITN to select *within* their obligated causes.
      *   **Risk Aversion:** The rubric implicitly assumes risk-neutrality *across causes* (maximize EV). Hits-based is an exception *within* a cause type. A risk-averse funder might systematically discount high-variance causes (like hits-based) even if their EV is high.
      *   **Commensurability Depth:** One could use the rubric while believing commensurability is imperfect but the best practical approach.
      *   **Scope of "Counterfactual":** The model of "what would happen anyway" (for neglectedness and within-cause calculation) could incorporate different assumptions about other actors' responses.

  **The Multiplicative Form: Work vs. Heuristic**

  *   **Real Work:** It *attempts* to mathematically model a core theoretical insight: `Current CMEV ∝ Total Value * Initial Marginal Effectiveness * Fraction of Initial Effectiveness Remaining`. Multiplication is the natural operation if you believe T and N independently scale the impact derived from I.
  *   **Heuristic & Misrepresentation:**
      *   **Non-Separability:** I, T, N are deeply intertwined. More funding (low N) can *increase* tractability T (e.g., via knowledge spillovers, infrastructure, attracting talent). Solving part of a problem (high T) can change the perceived importance I (e.g., proving a disease is eradicable). Importance I can attract funding, reducing N.
      *   **Non-Linearity:** Diminishing returns aren't always smooth or multiplicative. Threshold effects, network effects, and sudden breakthroughs violate simple multiplication.
      *   **Scale Dependency:** Logarithmic/coarse scales mask precision issues; the product's meaning is fuzzy.
      *   **Proxy Imperfection:** N (e.g., funding $) is a proxy for the *true* unobservable "position on the diminishing returns curve."
  *   **Conclusion:** The multiplicative form is a **useful heuristic** that captures the core intuition driving CMEV maximization under diminishing returns. However, it **misrepresents the true complexity** of the underlying function, which is likely non-linear, non-separable, and context-dependent. It works best as a prioritization tool for *initial cause screening* under uncertainty, not as a precise calculator.

  **The Trustee's Proposal: Implications and Trade-offs**

  Replacing ITN with explicit portfolio-wide CMEV estimation (including crowding out/in) would fundamentally change the approach:

  1.  **What Would Change:**
      *   **Direct Focus:** Explicitly targets the core quantity of interest: counterfactual marginal expected value.
      *   **Landscape Dynamics:** Directly incorporates how *your grant* influences *other funders' behavior* (crowding out: your grant reduces their giving; crowding in: your grant attracts more funding/talent).
      *   **Portfolio Effects:** Considers diversification benefits (reducing variance in total impact) and potential synergies/complementarities *between* interventions/causes.
      *   **Cause Rankings:** Would likely produce less rigid "rankings." Funding allocations would emerge from optimizing the *portfolio mix* for total expected impact given budget and risk tolerance, not a strict sequence.
      *   **Hits-Based Integration:** High-risk/high-reward causes could be naturally integrated via their probability distributions within the portfolio optimization.

  2.  **What Might Be Lost:**
      *   **Simplicity & Communicability:** ITN's intuitive factors (Big Problem? Solvable? Ignored?) are easier to explain and debate than complex integrated models. This facilitates collaboration, donor communication, and transparency *among funders using the same rubric*.
      *   **Robustness to Model Error:** Simple multiplicative heuristics can be more robust to poor input data than complex models that amplify uncertainty through many parameters and assumptions (especially about other actors' responses).
      *   **Feasibility:** Building reliable, comprehensive models of the *entire* funding landscape, actor responses, and cross-cause interactions for vastly different domains is incredibly data-intensive and theoretically challenging. ITN functions as a "bounded rationality" tool.
      *   **"Saturation" Clarity:** The ITN sequence ("fund top cause until saturated") provides a clear, albeit simplified, operational rule. Portfolio optimization offers less intuitive stopping rules for individual causes.

  3.  **What the Current Rubric Tracks Well (Potentially Lost):**
      *   **Intuitive Neglect:** The explicit "N" factor forces consideration of whether a problem is being overlooked, which a poorly specified model might miss if it doesn't accurately capture diminishing returns or crowding dynamics.
      *   **Conceptual Separation:** While intertwined, forcing explicit scores on I, T, N encourages deeper investigation into *why* a cause might score high or low on each dimension, potentially revealing different insights than a single CMEV estimate.

  **Conclusion:**

  The ITN rubric presupposes a highly specific, consequentialist, cause-neutral, marginalist, diminishing-returns view of philanthropic value maximization. Its multiplicative form is a heuristic that usefully approximates the desired quantity (CMEV) but oversimplifies complex realities through separability assumptions and coarse scoring. Philosophically, it strictly requires consequentialism, cause-neutrality, marginalism, and diminishing returns, but is compatible with various value theories and risk postures applied as modifiers.

  Your trustee's proposal – explicit portfolio-wide CMEV modeling – is theoretically superior, directly targeting the core objective and handling interactions and diversification. It would likely lead to more nuanced, dynamic, and potentially higher-impact allocations, particularly benefiting causes with complex cross-effects or high-risk profiles. However, this comes at the cost of immense complexity, fragility to model errors, reduced transparency, and the loss of ITN's intuitive, communicable, and robust heuristic power. The "best" approach depends on the funder's capacity for sophisticated modeling, tolerance for uncertainty, need for collaboration/transparency, and the specific cause landscape. ITN remains a powerful tool for initial triage and communication, while explicit CMEV modeling represents the aspirational gold standard for ultimate allocation decisions where feasible.
