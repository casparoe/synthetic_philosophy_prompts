  ### **Key Distinctions Clarified**
  - **Convention Types**: Your split (coordination, transfer, risk-allocation) works for most cases. It breaks down when conventions serve multiple purposes (e.g., queueing coordinates *and* allocates blame for cutting). Add a fourth type: **Symbolic Conventions** (e.g., shoe removal), which signal respect but lack tangible outcomes.  
