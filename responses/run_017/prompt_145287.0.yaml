  ### **Taxonomy Tree: Moral Obligations of Local Conventions**

  **Node 1: Starting Question (Case: Shoes in a home)**  
  *In a home where everyone has removed their shoes, is it wrong for a visitor to keep theirs on?*  
  - **YES (conventions can create obligations)** → Go to Node 2  
  - **NO (conventions create no inherent obligations)** → Go to Node 7  

  ---

  #### **Branch 1: Conventions CAN create obligations (from Node 1 YES)**  
  **Node 2: Harm vs. Convention (Case: Empty-street crossing)**  
  *In a place where locals always wait for green lights, is it wrong to cross against a red light on a completely empty street?*  
  - **YES (wrong even without harm)** → Go to Node 3  
  - **NO (only wrong if harm is caused)** → Go to Node 6  

  **Node 3: Knowledge Requirement (Case: Shoes, new arrival)**  
  *Is it wrong for a visitor *just off the plane* to keep shoes on if they haven’t learned the custom?*  
  - **YES (obligation exists even without learning)** → Go to Node 4  
  - **NO (must have fair chance to learn)** → Leaf 1: **Fair Play Conventionalism**  
