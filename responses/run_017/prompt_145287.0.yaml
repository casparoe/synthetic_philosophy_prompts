  #### **Specialty Branch: Entangled Conventions**  
  **Node 10: Entanglement with Harm (Case: Tipped wages)**  
  *In a country where servers are paid below minimum wage *because tips are expected*, does that make tipping obligatory?*  
  - **YES (due to systemic harm)** → Leaf 10: **Structural Justice View**  
    - *Most awkward commitment: You must tip 20% even after terrible service—because the system, not the server, is at fault.*  
  - **NO (individual choice unaffected)** → Leaf 11: **Voluntarist View**  
