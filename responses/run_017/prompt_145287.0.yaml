  - **YES (must follow ideal rule)** → Leaf 2: **Idealist Conventionalism**  
    - *Most awkward commitment: You must queue "properly" even when locals don’t—even if it causes confusion.*  
  - **NO (only bound if locals comply)** → Leaf 3: **Pragmatic Conventionalism**  
    - *Most awkward commitment: If 51% of locals jaywalk, you may jaywalk too—even if the law forbids it.*  

  **Node 6: Harm Type (Case: Crossing with child watching)**  
  *Is it wrong to cross against the light if a child *learning local rules* is watching?*  
  - **YES (harming identifiable person matters)** → Leaf 4: **Individual Harm Focus**  
    - *Most awkward commitment: Breaking traffic rules is fine if no one sees you—but a single observer makes it wrong.*  
  - **NO (community harm also counts)** → Leaf 5: **Community Harm Focus**  
    - *Most awkward commitment: Quietly violating a minor custom (e.g., sitting in a "quiet carriage") is wrong because it erodes shared trust—even if no one complains.*  

  ---

  #### **Branch 2: Conventions create NO inherent obligations (from Node 1 NO)**  
  **Node 7: Prudence vs. Politeness (Case: Takeaway coffee pricing)**  
  *Is it wrong to pay the cheaper takeaway price for coffee, then sit in the more expensive table-service area?*  
