      "bullet_bitten": "A world of flattened affect devoid of both extreme suffering *and* intense joy is morally superior to one containing any above-threshold agony, even if net happiness is lower and individuals feel worse off.",
      "pressure_point": "Why should we preserve moments of unbearable torment simply because they are subjectively outweighed by pleasure within a life?"
  }
