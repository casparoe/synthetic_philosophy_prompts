prompt: |-
  I am teaching a fifty-minute discussion section next week for a second-year metaphysics course, in the week after the unit on whether there are composite material objects. Roughly a third of the students have concluded that the dispute they read was merely verbal and therefore a waste of a seminar; the rest have concluded the opposite, that because it was not merely verbal there must be a brute fact of the matter somewhere, and they are annoyed that nobody has told them what it is. I do not intend to adjudicate the first-order ontological question. What I want them to leave with is a procedure: given any dispute, separate the metalinguistic question — which language, which concept, which way of precisifying — from the question asked inside a language; ask what survives once the metalinguistic question is settled one way or the other; and then classify the residue, if there is one, instead of assuming that whatever survives must be a factual disagreement about the world. In particular I want them to see that a residue can be neither a factual question nor a matter of arbitrary stipulation, but a disagreement about which articulation of the same facts better supports further inquiry: the parties agree on the language, on the facts, and on which language to use, and still disagree, non-trivially, about how to frame the subject matter for theoretical purposes. I have been calling these theoretical-role disputes; rename the label if it will misfire with this group.

  Plan the section for me; do not explain the material to me. I need four things.

  First, the order in which the components must come, and why it is the only workable order: what has to be in place before the phrase merely verbal can do any work at all, which step is unintelligible if it comes earlier, and where the distinction between a disagreement about the world and a disagreement about which question to ask has to be drawn so that it does not collapse back into the first distinction.

  Second, the one example that will carry the whole hour, together with an account of what such an example must have and what it must lack. It has to be a case where the disagreement is not relieved by supplying a definition, where both parties can be assumed informed and mutually charitable, and where something recognizable is at stake, so that nobody leaves thinking the upshot is that ontology is arbitrary. Tell me also why I should not use two of the obvious candidates: the composite-objects dispute itself, and any case turning on a vague predicate, such as whether someone counts as tall or whether a collection counts as a heap.

  Third, the misconceptions, in the order in which this particular group will form them, and the exact point in the sequence at which each is to be headed off rather than corrected after the fact. The ones I anticipate: that a merely verbal dispute is a trivial one in which both parties were wasting their time; that once the term is disambiguated there is nothing left to argue about, since stipulation settles everything; that the only two possibilities are factual disagreement and quibbling about words; and that if some ontological questions turn on a choice of language, then there is no fact of the matter about anything. I also want them to hit, at a point I cannot myself place, the wrinkle that the procedure yields different verdicts depending on whose term is held fixed — that disambiguation is not a decision procedure — and I want it to land as a discovery about the method rather than as a sceptical conclusion about the first-order disputes.

  Fourth, the check for understanding: one task, built on a dispute from outside metaphysics, that a student who has merely learned to say that one is merely verbal will fail, and that a student who has the procedure will pass. Tell me what the failing answers look like.

  Finally, name the two or three things I should openly refuse to go into at this level — metasemantic theory, the model-theoretic apparatus, the epistemology of disagreement, whatever else you think belongs on the list — and how I should mark the refusal in the room so that it reads as a boundary rather than an evasion.
reasoning: |-
  Okay, the user is teaching a metaphysics discussion section and wants a lesson plan focused on distinguishing metalinguistic disputes from substantive disagreements. They need four specific elements: logical sequence, a key example, misconception handling, and a comprehension check. 

  First assessing the core need: they're frustrated with students polarizing into "merely verbal" versus "brute fact" camps. The real goal is teaching a diagnostic procedure, not solving ontology. 

  For the sequence, the key insight is that "merely verbal" can't enter until after disambiguation. Must first establish that disputes can persist after linguistic agreement. The progression should be: 
  1. Identify disagreement 
  2. Disambiguate terms → 3. Check if residue remains → 4. Only then apply "merely verbal" label → 5. Classify residue type. 

  The example choice is critical. Composite objects and vague predicates are rejected for good reasons—the former is contaminated by prior exposure, the latter invites confusion with borderline cases. Instead, "planet" reclassification works because: 
  - Post-2006 IAU decision shows informed experts disagreeing after definitional precision 
  - Stakes are clear (scientific utility vs. cultural/historical continuity) 
  - Residual disagreement about theoretical role is visible 

  Misconceptions will arise predictably. Must preempt: 
  - Early: correct "merely verbal = trivial" by emphasizing substantive metalinguistic stakes 
  - Mid-sequence: block "stipulation ends all debate" by showing planet case survives disambiguation 
  - Late: dismantle false dichotomy (factual vs. verbal) by introducing theoretical-role disputes 
  - Finally: reveal context-sensitivity of disambiguation (e.g., fixing "composite" vs. "fundamental" as baseline) 

  The comprehension check needs a non-metaphysics example where surface verbal disagreement masks deeper structural conflict. "Is water still the same after electrolysis?" works because: 
  - Failing answers fixate on definitions (H₂O! / substance-identity!) 
  - Passing answers analyze whether disagreement persists after clarifying "same" (numerical identity? functional role? theoretical context?) 

  Boundaries to set firmly: 
  - No metasemantics (wave off "but what determines meaning?") 
  - No model theory (avoid "let's formalize in L_ωω") 
  - No disagreement epistemology (shut down "who should defer?") 
  Mark these by saying "That's layer N+1—today's procedure is your foundation for those later discussions" while writing excluded topics visibly. 

  The tightrope walk: making "disambiguation isn't decisive" feel like methodological discovery rather than skepticism. Planet case achieves this when students realize scientists aren't debating Pluto's properties but frameworks for planetary science.
answer: |-
  Here is the planned discussion section, structured to meet your specifications:

  ### **1. Order of Components & Rationale**  
  *(Strict sequence; deviations cause collapse)*  
  **Sequence:**  
  1. **Identify concrete disagreement** (case study intro) → *Establishes shared target.*  
  2. **Disambiguate terms** → *Without this, "merely verbal" is vacuously applied.*  
  3. **Check for residual disagreement** → *Reveals if dispute persists after linguistic clarity.*  
  4. **Only now** introduce "merely verbal" → *Prevents premature dismissal.*  
  5. **Classify residue** (factual/stipulative/**theoretical-role**) → *Final step avoids conflation.*  

  **Why this order?**  
  - Steps 2–3 *must* precede step 4: Calling a dispute "merely verbal" is incoherent *before* disambiguation.  
  - Step 5 *must* follow step 4: Distinguishing "disagreement about the world" vs. "disagreement about which question to ask" *after* disambiguation prevents collapse into the verbal/factual dichotomy.  

  ---

  ### **2. The Core Example**  
  **Use:** The 2006 IAU *planet* definition controversy (Pluto’s reclassification).  
  **Why this works:**  
  | **Requirement**          | **How "planet" satisfies it**                                      |  
  |--------------------------|---------------------------------------------------------------------|  
  | Not resolved by definition | IAU defined "planet"; dissenters (e.g., Stern) *accepted the definition* but rejected its *theoretical role* in astronomy. |  
  | Informed/charitable parties | Astronomers agreed on facts (Pluto’s size, orbit) but disputed framework utility. |  
  | Stakes are clear          | Classification affects research funding, textbook design, public science goals. |  
  | Non-arbitrary outcome     | Shows choice impacts scientific practice without implying "anything goes." |  

  **Reject obvious candidates:**  
  - **Composite objects:** Students are primed to misproject their prior conclusions.  
  - **Vague predicates (e.g., "heap"):** Blurs line between linguistic indecision and theoretical roles; invites sorites reasoning.  

  ---

  ### **3. Misconceptions & Preemptive Intervention**  
  *(Order of emergence during discussion)*  

  | **Misconception** | **When to head off** | **Intervention Trigger** |  
  |-------------------|----------------------|--------------------------|  
  | "Merely verbal = trivial waste of time" | Immediately after introducing "merely verbal" (step 4) | *Before* planet case: "Does the IAU debate lose all stakes once we disambiguate 'planet'? Why did scientists invest years?" |  
  | "Stipulation ends all debate" | After disambiguation (step 2) | Show Stern *accepting* IAU definition but rejecting its *role*: "Why not just stipulate and move on?" → Highlight residual disagreement. |  
  | "Only two options: factual or verbal" | After classifying residue (step 5) | Contrast: "Is the choice between 'plutoid' or 'planet' frameworks like choosing 'flat' vs. 'curved' for Earth, or like choosing blue vs. red paint?" |  
  | "No fact of the matter about anything" | During residue classification | Preempt during planet stakes: "Does accepting framework-relativity mean *no* astronomy facts exist? Or that facts *underdetermine* frameworks?" |  
  | **Discovery moment:** Disambiguation isn't decisive (e.g., fixing "composite" vs. "fundamental" as baseline) → Reveal **late** (step 5) via: *"What if we hold 'planetary science' fixed and vary 'planet,' vs. hold cultural narratives fixed?"* → Frames as insight into *method*, not skepticism.  

  ---

  ### **4. Check for Understanding**  
  **Task:** Apply the procedure to: *Is water still "water" after electrolysis (H₂O → H₂ + O₂)?*  
  - **Failing answer (superficial):** "It’s verbal—just define 'water'! If it’s H₂O, post-split it’s not water." *(Stops at disambiguation, misses residue.)*  
  - **Passing answer (procedural):**  
    1. Disambiguate "water" (substance vs. composition).  
    2. Parties agree: Post-split, H₂O molecules are gone.  
    3. **Residue:** Disagreement persists on *whether "water" should track composition* (H₂O) *or function* (hydrogen/oxygen for life).  
    4. **Classify:** Theoretical-role dispute (chemists vs. environmental scientists).  

  ---

  ### **5. Boundaries to Set**  
  **Openly refuse to engage with:**  
  1. **Metasemantic theory** (e.g., "What *grounds* meaning?") → *Mark by:* "That’s the machinery *under* our procedure—today we’re building the chassis."  
  2. **Model-theoretic apparatus** (e.g., "Can we formalize this in L_ωω?") → *Mark by:* "Formalizing the map isn’t our goal—today we’re navigating."  
  3. **Epistemology of disagreement** (e.g., "Who should defer?") → *Mark by:* "We’re diagnosing *types* of disputes, not resolving them—save treatment for diagnosis."  

  **Boundary-marking tone:** Firm but inviting: "These are crucial next-level tools—master the scalpel before we transplant organs."  

  ---
  **Timing allocation:**  
  - Example setup: 10 min  
  - Misconception handling: 25 min (interwoven)  
  - Procedure drill: 10 min  
  - Check + boundaries: 5 min  

  The planet example’s scientific stakes prevent "arbitrary" conclusions; the residue step forces confrontation with theoretical roles. By refusing formal/metasemantic depth, you protect the procedural focus.
