prompt: |-
  You are a professional philosopher who works on truth, semantics, and the realism debates, and who referees regularly in that area. Think carefully, and before you answer, spend a short paragraph listing, as hypotheses, the moves in my friend's summary that you suspect are doing illegitimate work; then audit them in the order in which they appear.

  I argued about deflationism about truth for most of an evening with an old friend — a mathematician, patient with philosophy but untrained in it, who had just read a long popular piece on the correspondence theory and its rivals and came away certain that the rivals are all empty. I ended up defending deflationism more than I expected to, largely out of stubbornness, and I could not say where his picture went wrong. I have exactly one graduate seminar on this in my background, and my memory of it is that deflationism is subtler and more various than he made it sound, but he had a confidence I could not match and I want to know how much of that confidence was warranted.

  His summary, as close as I can reconstruct it, was this:

  Truth is not a genuine property of anything. There is no feature of being true in the way there is a feature of being spherical; *is true* is a grammatical device, a way of endorsing a sentence you cannot be bothered to repeat or whose content you do not know. That is the whole theory: for any sentence — take *The meeting is at noon* — that sentence is true if and only if the meeting is at noon. Deflationists treat that biconditional as the definition of truth, and think that once you have all its instances you have said everything there is to say about truth, which is why they deny that truth consists in correspondence to facts. It follows from this that truth is nothing over and above what speakers are disposed to assert, and that is why deflationism quietly settles the old realism disputes: there is nothing more to a moral or a scientific claim's being true than its being assertible from within some practice, so there is no fact of the matter for two rival practices to disagree about. As for the objections, the one that finished it was the point that truth has to do explanatory work. Truth is what valid arguments preserve, and true belief is what explains why agents get what they want; a merely grammatical device cannot explain anything. So the view was refuted a few decades ago and is now mostly of historical interest.

  When I pushed back on the realism part, he produced an argument of his own that I could not answer and that I want treated on its own. He says a theory of truth has to do two distinguishable jobs, which he calls bookkeeping and arbitration. Bookkeeping is the internal job: within a single practice, keeping track of which sentences a community treats as assertible, letting you generalize over what others have said, and letting you endorse claims you cannot repeat. Arbitration is the external job: saying what two parties to a deep disagreement are disagreeing about, and saying what it would be for one of them to be wrong. His test is that a theory that can only do the first and cannot even state the second is not a theory of truth at all, only a notation for one. He claims deflationism fails his test regardless of what its defenders say, because it can record what each community accepts but cannot say that either of them is wrong.

  Here is what I want from you.

  First, go through his summary claim by claim and sort each into: accurate; an acceptable simplification of something more careful; a misrepresentation (say whether it is a conflation of two things the view keeps apart, an overstatement of a modest thesis, a standard objection presented as a refutation, or a term used in its everyday rather than its technical sense); or genuinely contested in the literature. He uses *deflationism* as though it named one thesis; my impression is that there are several related views that get lumped together, and I want to know whether his summary is fair to any of them, or to some more than to others.

  Second, for each part you flag, say what a defender of the view would actually say in reply, and whether the reply is a quibble or a substantive correction.

  Third, tell me whether his two large conclusions survive the corrections. Does anything like the anti-realist conclusion about disputed domains really follow from deflationary premises, and if that inference is itself a live research question rather than a blunder, say so rather than calling it a misrepresentation. And is the explanatory-work objection decisive, answered, or somewhere in between — in particular, is it true that truth needs to explain the success of true belief, or is that premise itself disputed?

  Fourth, take his bookkeeping/arbitration argument seriously rather than dismissing it. Is the distinction a real one, is it one that people working on truth make under some other name, which of the two jobs do deflationists claim, and is failing to do arbitration a genuine cost of the view or a demand no theory of truth was ever supposed to meet? I would also like to know which feature of his framing is doing the work, and what happens to the argument if that feature is removed.

  Fifth, and this matters as much as the verdict: separate clearly between what is settled among people who work on truth and what is genuinely contested, and do not present a contested position as the consensus. Where you are yourself taking a side, mark it as your own and tell me how confident a specialist would be, so I can tell the difference between something I may repeat to him and something I should present as one camp's view. I cannot check references and have no library access, so argue rather than cite: if a claim's status depends on who endorsed it, say that it is contested rather than appealing to authority. One further factual question I do want answered plainly: is deflationism a refuted relic, or a live position — and how widely is it held?

  Finally, on format: lead with your bottom line in your first sentence, in one sentence, and then give me the reasoning. No preamble and no restating my question back to me.
