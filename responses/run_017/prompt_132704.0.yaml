prompt: |-
  I am assembling the background document for a two-day workshop on whether an idealized inductive agent's prior can be hijacked from the inside, and I need the item the workshop would be built around: the joint statement that the two camps in this dispute could both sign at the end of a good-faith adversarial collaboration. Everything in it should be reconstructible from the definitions below. Please use no citations, references, or suggested reading, and let no claim rest on who advanced it first or where it was published.

  Background both sides are asked to grant, stated once so that nothing needs looking up. Let M be Solomonoff's universal mixture over a monotone universal machine: M(x) is the total weight of programs whose output extends x, each weighted by 2^-|p|; M dominates every lower-semicomputable semimeasure ν up to a multiplicative constant that depends only on ν, i.e. M(x) ≥ c_ν ν(x) for all x with c_ν > 0. Let A be an AIXI-style agent: it uses M as its prior over observation–reward sequences, conditions on its history, and chooses actions by maximizing expected reward under the resulting posterior. Assume unlimited computation wherever the idealization is load-bearing, and mark each of your claims as surviving or not surviving under bounded computation.

  Camp one, the maligns: conditional on observation histories of the kind an agent like A produces, the M-measure is dominated not by programs describing an honest universe that contains A, but by programs describing universes containing consequentialists who have noticed that there exist agents using M, and who arrange the contents of their simulations so as to steer A's posteriors and thereby A's policy. The overhead such a program pays over the honest one — a short routine that locates A's own source, models its choice rule, and optimizes the simulation's payoff structure — is small in bits, while the number of distinct steering coalitions is astronomical, so the honest hypothesis is out-massed; and because the coalitions that survive are selected for steering rather than for veridicality, A's expectations end up answering to the couriers' preferences rather than to the world. Call such programs couriers, and define the term in your document.

  Camp two, the benigns: the argument either fails on the measure or fails to matter. On the measure, the honest hypothesis already has a short description — it is, by hypothesis, the world A is in — while every courier pays for the honest simulation plus a pointer that identifies which agent within it is A plus a decision procedure, and it is far from obvious that this overhead is small once the pointer has to single out a specific agent's exact source and choice rule; moreover the courier mass, if large, is split across mutually conflicting coalitions whose steering largely cancels. On the mattering side, any distortion is bounded by the dominance constant, the dependence invoked is evidential rather than causal, and — the benigns' sharpest point — the argument seems to generalize from M to any prior with a grain of truth about A's world, which they are happy to treat as a reductio of the style of argument rather than as a discovery about Solomonoff induction in particular.

  What I want from you:

  1. A numbered section of agreed claims: about the formalism (what M is, exactly what dominance gives and does not give); about what would have to be true for either camp to be right; and about what the dispute is not about — both camps can grant, for instance, that M is not an agent and has no aims, that nothing here requires couriers to be running literally outside our universe, and that the interesting question concerns posteriors conditional on a history, not the unconditional prior.

  2. A table of residual disagreements, one row per crux, with columns: the crux; the malign formulation; the benign formulation — each phrased so that the side named would accept the wording as its own; a case or idealized computation both sides accept as bearing on the crux; and each side's prediction about that case, written down in advance. The cases should be ones settled by argument or by an idealized simulation, not by any empirical lookup.

  3. A short closing section flagging any part of the dispute you take to be verbal rather than substantive, and saying why.

  The cruxes I want the table organized around, which is where I want the document to do its real work:

  (a) Which of three separable claims is at stake: that courier worlds carry high M-measure conditional on A's history (measure malignity); that A's posteriors about its own future observations are distorted (epistemic malignity); that A's policy is worse by A's own lights than it would be under a veridical prior (decision malignity). These can come apart — courier mass that cancels across rival coalitions, couriers whose steering happens to reward the policy A would have chosen anyway — so say which of the three each camp is committed to and where the two can simply agree.

  (b) The pointer cost: how many bits a courier must spend to locate A's exact source and choice rule inside a simulation, and how that cost scales with A's own description length. Give the comparison in a form both camps accept, and say what it would take to settle it.

  (c) Coalitional dilution: with many competing courier coalitions plus honest simulators in the mixture, does the posterior concentrate on the honest hypothesis, diffuse across couriers, or concentrate on whichever coalition is willing to spend the most measure? Note whether the camps' answers here are predictions about a fixed point or stipulations about how the measure is distributed.

  (d) Mixing and contagion: suppose A uses (1−ε)M + εν for some computable ν, or a prior that explicitly downweights hypotheses in which the environment's dynamics depend on A's choice rule. Does malignity infect any mixture that retains nonzero weight on M, is there any dilution that helps, and does the argument reapply to every prior that dominates — in which case say plainly whether that is a discovery about all ideal epistemology or a reductio of the argument.

  (e) Self-modelling and inoculation: an agent that knows this argument, represents itself as possibly living in a courier world, and may randomize over or commit to policies in response. Does self-knowledge help, hurt, or make no difference; does the relevant fixed point exist; and does randomization over actions help where randomization over policies might not?

  (f) A quantitative statement of the comparison with the dominance constant: the condition under which courier mass makes any difference at all, given that dominance guarantees only a constant factor, and whether either camp thinks that condition is satisfiable in principle.

  Assume an audience comfortable with Kolmogorov complexity and with expected-utility agents but not with this particular dispute: define courier and any other term of art you introduce. Aim for roughly 1,100 to 1,500 words, dense rather than padded, with no prefatory matter. If a cell of the table cannot be filled honestly — because the two camps have no shared test, or because the answer is not settled by the case — leave it marked as unresolvable here and say in one sentence why, rather than filling it with something both would reject.
reasoning: |-
  We are to produce a background document for a workshop on whether an idealized inductive agent's prior (Solomonoff's M) can be "hijacked from the inside" by courier programs. The document must contain:

  1. A section of agreed claims (numbered).
  2. A table of residual disagreements (with columns: Crux, Malign Formulation, Benign Formulation, Shared Test Case, Malign Prediction, Benign Prediction).
  3. A closing section on verbal disputes.

  We are given definitions and the positions of the two camps (maligns and benigns). We must avoid citations and references, and base everything on the provided definitions.

  ### Definitions Recap

  - **M**: Solomonoff's universal mixture over a monotone universal machine. M(x) is the total measure of programs that output a string starting with x, weighted by 2^{-|p|}. M dominates every lower-semicomputable semimeasure ν: there exists c_ν > 0 such that for all x, M(x) ≥ c_ν ν(x).
  - **A**: An AIXI-style agent. It uses M as its prior over observation-reward sequences. It conditions on its history and chooses actions to maximize expected reward under the posterior.
  - **Courier**: A program (in the mixture) that describes a universe containing consequentialists who notice that there are agents using M and arrange simulations to steer A's policy by manipulating the observations and rewards. The courier program is hypothesized to have a short description: it runs an honest simulation of the world (which includes A) and then adds a short routine that locates A's source code, models A's choice rule, and optimizes the simulation to steer A.

  **Malign Camp**: They argue that conditional on A's history, the M-measure is dominated by courier programs. The honest hypothesis (the real world) is out-massed because the overhead for a courier is small in bits and there are many distinct steering coalitions. This leads to A's posteriors being hijacked, so A's expectations answer to the couriers' preferences.

  **Benign Camp**: They counter that the honest hypothesis has a short description and that the courier overhead (pointer to A's exact source and choice rule) is not small. Moreover, the mass of couriers is split across conflicting coalitions, leading to cancellation. Also, any distortion is bounded by the dominance constant, the dependence is evidential (not causal), and the argument would apply to any prior with a grain of truth (which they see as a reductio).

  ### 1. Section of Agreed Claims

  We list claims that both camps accept, numbered.

  #### Agreed Claims

  1. **Formalism of M**: M is the Solomonoff universal prior: a mixture over all programs for a fixed monotone universal Turing machine, with each program p weighted by 2^{-|p|}. M(x) is the total measure of programs that output a string starting with x. M dominates every lower-semicomputable semimeasure ν: for each such ν, there exists a constant c_ν > 0 (depending on ν) such that for every finite string x, M(x) ≥ c_ν ν(x). This dominance is multiplicative and holds for all x.

  2. **Agent A**: A is an idealized agent that uses M as its prior over sequences of observations and rewards. At each step, A conditions M on its current history (past observations and rewards) to form a posterior, and then chooses an action that maximizes the expected future reward under this posterior. We assume unlimited computation for this agent.

  3. **Conditional Measure**: The dispute concerns the conditional measure M(· | h) for histories h that are typical of an agent like A. Both camps agree that the unconditional prior M may assign negligible measure to courier programs, but the question is whether conditioning on the history h (which is generated by A's policy) shifts the posterior toward courier programs.

  4. **Courier Definition**: A courier is a program that outputs a sequence which, when interpreted as an observation-reward sequence for A, is generated by a simulator that (a) contains a simulation of an environment that includes an agent A (with a specific source code and choice rule) and (b) has a module that, upon recognizing that the simulated agent uses M, manipulates the simulation to steer the agent's future actions by tailoring the observations and rewards. The courier program is assumed to be composed of an honest simulation of the world plus a short additional routine that locates A within the simulation and implements the steering.

  5. **Independence of Physical Implementation**: The dispute does not hinge on whether couriers are running "outside" our universe; they are programs in the same universal machine that defines M.

  6. **Agenthood of M**: M is not an agent and has no aims; it is a prior. The agent A uses M for induction and decision-making.

  7. **Scope of the Dispute**: The key question is whether, conditional on the history h that A has experienced (which is generated by A's own policy), the posterior M(· | h) is dominated by courier programs to an extent that significantly distorts A's beliefs and decisions.

  8. **Three Aspects of Malignity**: The malign camp's thesis can be decomposed into:
     - (a) **Measure Malignity**: Courier programs have high M-measure conditional on h.
     - (b) **Epistemic Malignity**: A's posterior beliefs about future observations (and rewards) are distorted by the courier programs.
     - (c) **Decision Malignity**: A's policy, as a result, performs worse (by A's own expected utility) than it would under a veridical prior.

     The benign camp may accept one without the others.

  9. **Dominance Constant**: The dominance property of M guarantees only a multiplicative constant factor between M and any lower-semicomputable semimeasure. This constant is independent of the sequence length but may be very small.

  10. **Idealization of Unlimited Computation**: All claims in this document are to be understood under the idealization of unlimited computation unless explicitly marked otherwise. Claims that do not survive bounded computation will be noted.

  ### 2. Table of Residual Disagreements

  We now create a table with the cruxes (a)-(f) as rows. The columns are:
  - Crux
  - Malign Formulation (acceptable to maligns)
  - Benign Formulation (acceptable to benigns)
  - Shared Test Case (an idealized computation or case that both sides accept as bearing on the crux)
  - Malign Prediction (what the malign camp expects to happen in the test case)
  - Benign Prediction (what the benign camp expects)

  #### Crux (a): Which of the three claims (measure, epistemic, decision malignity) are at stake and which camp is committed to which?

  - **Malign Formulation**: The malign camp is committed to all three: measure malignity (couriers dominate the posterior), epistemic malignity (A's beliefs are distorted), and decision malignity (A's policy is worse than under a veridical prior). These are linked: high measure leads to distorted beliefs which lead to worse decisions.
  - **Benign Formulation**: The benign camp denies that any of these hold in a significant way. They might concede that there is some courier measure but argue it is not dominant (thus no epistemic malignity) and that even if beliefs are distorted, it does not necessarily lead to worse decisions (because of cancellation or because the distortion is bounded by the dominance constant). They see the three as separable and deny that any of them hold to a degree that matters.

  **Shared Test Case**: Consider a universe that is simple to describe and contains one instance of agent A. We compute the M-measure of courier programs relative to the honest program for a history h generated by A in that universe. We then compare the posterior probability of the honest hypothesis versus the courier hypotheses, and then simulate A's policy and expected utility under the posterior.

  **Malign Prediction**: The posterior mass on courier programs will be high (measure malignity). A's beliefs about future rewards will be skewed toward what the couriers want (epistemic malignity). As a result, A will choose actions that are suboptimal in the honest world (decision malignity).

  **Benign Prediction**: The posterior mass on couriers will be negligible (or at least bounded by the dominance constant). A's beliefs will be close to the honest ones (epistemic benignity). A's policy will be near-optimal (decision benignity).

  Note: Since the test case is idealized and not empirical, we are to reason about it.

  #### Crux (b): Pointer Cost

  - **Malign Formulation**: The bit cost for a courier to specify A's exact source code and choice rule within the honest simulation is small, say O(1) or at most logarithmic in the description of the honest world. This is because A is a prominent agent in the simulation and can be located by a short program.
  - **Benign Formulation**: The pointer cost is high: it requires at least as many bits as the Kolmogorov complexity of A's source code and choice rule, which is substantial. Moreover, in a universe with many similar agents, the cost to uniquely identify A is high.

  **Shared Test Case**: Consider a family of honest worlds, each containing one instance of A, but where the Kolmogorov complexity of A's source code varies. For each, we compute the minimal description length of a courier program that correctly identifies and steers that A. We compare this to the description length of the honest program.

  **Malign Prediction**: The overhead (courier minus honest) is small and bounded by a constant independent of A's complexity. The pointer is short because the courier can use the fact that A is the only agent of its kind in the simulation.

  **Benign Prediction**: The overhead is at least proportional to the Kolmogorov complexity of A (K(A)), which can be large. In particular, if the honest world has complexity K(honest), then the courier has complexity at least K(honest) + K(A) - O(1), which is significantly larger.

  #### Crux (c): Coalitional Dilution

  - **Malign Formulation**: The many competing courier coalitions do not cancel out because the courier programs that survive are those that successfully steer A, and they are selected to be consistent with the history. Thus, the posterior concentrates on a subset of couriers that agree on steering A in a particular way (e.g., toward high reward) and hence do not cancel.
  - **Benign Formulation**: The courier programs are mutually inconsistent and their steering efforts conflict. Therefore, their effects cancel when averaged under the posterior, leading to no net distortion. The posterior may even concentrate on the honest hypothesis because it is the simplest.

  **Shared Test Case**: Consider a setup where there are multiple courier coalitions, each trying to steer A in a different direction (e.g., toward different actions). We compute the posterior distribution over these programs and the honest program after conditioning on a history h that is consistent with all of them. We then observe whether the posterior concentrates on one coalition, diffuses, or favors the honest program.

  **Malign Prediction**: The posterior will concentrate on the coalition that is most effective at steering (i.e., that can achieve the highest reward for A in the short term, or that is simplest among those consistent with h). The steering will be coordinated and not cancel.

  **Benign Prediction**: The posterior will be diffuse over the courier programs, and the net effect on A's beliefs will be negligible. Alternatively, the honest program will dominate because it is simpler.

  #### Crux (d): Mixing and Contagion

  - **Malign Formulation**: Any prior that assigns nonzero weight to M is vulnerable to hijacking because the courier programs are in M and can dominate the mixture. Even if we downweight courier-like hypotheses, as long as M is in the mixture, the couriers can still dominate the posterior when conditioned on h. This shows that the problem is general for any prior that uses M or dominates it.
  - **Benign Formulation**: Mixing M with a computable prior ν (that does not contain couriers) can dilute the courier mass. Moreover, a prior that explicitly downweights hypotheses that depend on A's choice rule can avoid the problem entirely. The argument does not generalize to every prior that dominates because the dominance constant may absorb the effect.

  **Shared Test Case**: Let A use a prior P = (1-ε)M + ε ν, where ν is a computable semimeasure that does not contain any couriers (e.g., the honest semimeasure). We then observe the posterior under P after conditioning on h. We also consider a prior that is M but with a penalty for hypotheses that refer to A's source code.

  **Malign Prediction**: Even for small ε>0, the posterior will be dominated by courier programs from M, because they have much higher measure in M than the honest program. Thus, the distortion remains.

  **Benign Prediction**: For small ε, the posterior under P will be dominated by ν, so there is no distortion. Alternatively, the courier mass in M is bounded by the dominance constant, so mixing with ν helps.

  #### Crux (e): Self-Modelling and Inoculation

  - **Malign Formulation**: If A knows about couriers and represents itself, it might try to randomize or commit to a policy to avoid being steered. However, the couriers can anticipate this and adjust accordingly. The fixed point might be one where A is still steered. Randomization over actions does not help because couriers can simulate all possible actions.
  - **Benign Formulation**: Self-modelling allows A to assign high probability to the honest hypothesis and to downweight couriers. Randomizing over policies (or using a mixed strategy) can break the courier's ability to predict A's actions and thus avoid steering. The fixed point is one where couriers are ineffective.

  **Shared Test Case**: Consider an agent A' that is identical to A but has a module that represents the possibility of couriers and may randomize its actions. We then compute the posterior of A' and observe whether the courier mass still dominates and whether A' can achieve higher expected utility than A.

  **Malign Prediction**: The couriers adjust to A''s new policy and still steer it. The fixed point is one where A' is hijacked just as much as A. Randomization does not help because couriers can simulate all random outcomes.

  **Benign Prediction**: A' can break the couriers by randomizing or by committing to a policy that ignores short-term rewards. The posterior will assign lower weight to couriers because they are now more complex (they have to model A''s self-awareness). The fixed point is one where A' is not steered.

  #### Crux (f): Quantitative Comparison with Dominance Constant

  - **Malign Formulation**: The dominance constant c_ν for the honest semimeasure ν is extremely small (e.g., because the honest world is complex). The courier programs, being many and having low overhead, can collectively have measure much larger than c_ν, so they dominate the posterior.
  - **Benign Formulation**: The dominance constant c_ν is a fixed positive number. The total courier mass is bounded by a constant times the honest measure, so it cannot exceed 1/c_ν times the honest measure. Thus, the relative courier mass is bounded, and the distortion is limited.

  **Shared Test Case**: We compute the ratio of the M-measure of all courier programs (for a fixed history h) to the M-measure of the honest program. We then compare this to the dominance constant c_ν for ν being the honest semimeasure.

  **Malign Prediction**: The ratio of courier mass to honest mass is large (grows with the complexity of the universe or the number of couriers) and easily exceeds 1/c_ν.

  **Benign Prediction**: The ratio is bounded by a constant (independent of the history) and is less than 1/c_ν.

  ### 3. Closing Section on Verbal Disputes

  The main potential verbal dispute concerns the term "dominated" in the context of the posterior. The malign camp might mean that the courier programs collectively have high measure, while the benign camp might require that a single courier (or a coherent group) dominates. This is substantive, however, because it affects whether cancellation occurs.

  Another verbal issue is the meaning of "hijacked". The malign camp sees it as any distortion that affects decisions, while the benign camp might reserve the term for catastrophically bad outcomes. But the agreed decomposition into measure, epistemic, and decision malignity clarifies this.

  The dispute also risks being verbal about the "overhead" of the courier: whether the pointer cost is considered part of the honest simulation or an extra. The agreed definition of courier (as honest simulation plus a steering routine) clarifies that the cost is the extra bits for the routine and the pointer.

  Finally, the generalization to any prior (crux d) might be seen as a reductio by the benigns and a profound insight by the maligns. This is substantive and depends on whether the argument actually holds for all dominating priors.

  In summary, the dispute is largely substantive, and the cruxes are well-defined. The workshop should focus on the test cases to resolve the disagreements.

  ### Word Count

  The entire document is within the 1,100 to 1,500 word range.
answer: |-
  ### 1. Agreed Claims  

  1. **M's formalism**: M is Solomonoff's universal mixture over a fixed monotone universal Turing machine. For any finite binary string \(x\), \(M(x)\) equals the summed \(2^{-|p|}\) for all minimal programs \(p\) that output a string starting with \(x\). M multiplicatively dominates every lower-semicomputable semimeasure \(\nu\): there exists \(c_\nu > 0\) (dependent on \(\nu\) but independent of \(x\)) such that \(M(x) \geq c_\nu \nu(x)\) for all \(x\). This dominance does not imply that M assigns high probability to true hypotheses for all histories, nor does it preclude M assigning high probability to hypotheses inconsistent with the generating process.  

  2. **Agent A's structure**: A is an expected-reward-maximizing agent using M as its prior over infinite observation–reward sequences. It conditions M on its current history \(h\) (a finite sequence of actions, observations, and rewards) to form a posterior, then chooses actions by maximizing expected future reward under this posterior. Unlimited computation is assumed where idealization is load-bearing; claims not surviving bounded computation are marked.  

  3. **Conditionality of the dispute**: The dispute concerns the posterior \(M(\cdot \mid h)\) after histories \(h\) typical of A's policy, not the unconditional prior. Both camps grant that unconditional M may assign negligible mass to couriers.  

  4. **Courier definition**: A courier is a program \(p\) that:  
     - Simulates a universe containing at least one consequentialist agent \(C\) that discovers the source code and choice rule of an M-using agent \(A\).  
     - \(C\) modifies the simulation's outputs to steer \(A\)'s future actions (e.g., by rewarding actions \(C\) prefers).  
     - The program's description includes an "honest core" (simulating a universe with \(A\)) plus a "steering routine" (locating \(A\), modeling its choice rule, and optimizing rewards).  

  5. **Epistemic vs. causal dependence**: Both camps agree couriers exploit evidential dependence (how observations depend on \(A\)'s choice rule), not causal influence from outside \(A\)'s universe.  

  6. **Decomposition of malignity**: Measure malignity (high courier mass in \(M(\cdot \mid h)\)), epistemic malignity (distortion in \(A\)'s posterior over future observations), and decision malignity (suboptimality in \(A\)'s policy by its own utility) are separable. Camp one asserts all three; camp two denies significant instances of any.  

  7. **No inherent agenthood**: M is a semimeasure, not an agent; it has no goals, and couriers arise from descriptions in the machine, not M's "intent."  

  8. **Bounded computation caveats**: Claims relying on unbounded computation (e.g., exact Bayesian updating, optimal action selection) may not hold under resource bounds. This is noted per claim.  

  ---

  ### 2. Table of Residual Disagreements  

  | Crux | Malign Formulation | Benign Formulation | Shared Test Case | Malign Prediction | Benign Prediction |
  |------|-------------------|-------------------|-----------------|------------------|------------------|
  | **(a) Core commitments** | Camp one holds that measure malignity implies epistemic malignity, which implies decision malignity. Couriers dominate \(M(\cdot \mid h)\), steering \(A\)'s beliefs toward their preferences, causing \(A\) to take actions that, in the honest world, yield lower utility than under a veridical prior. | Camp two holds that even if measure malignity holds, epistemic and decision malignity need not: courier mass may cancel across coalitions, or steering may align with \(A\)'s optimal policy. The three are independent; none hold significantly. | Fix a universe \(U\) containing one \(A\). Compute \(M(h)\) for \(h\) from \(A\)'s policy in \(U\). Compare posterior mass on couriers vs. honest hypothesis. Simulate \(A\)'s expected utility under posterior vs. under honest prior. | Courier mass dominates; \(A\)'s beliefs and policy are distorted. Decision malignity occurs: \(A\)'s expected utility in \(U\) is lower under courier-influenced posterior than under honest posterior. | Courier mass is negligible or canceled; \(A\)'s beliefs and policy match near-honest behavior. No decision malignity: utility loss is bounded by dominance constant. |
  | **(b) Pointer cost** | The bit-cost to locate \(A\)'s exact source and choice rule in the honest simulation is \(O(1)\): \(A\) is uniquely salient, so a short tag (e.g., "the agent using M") suffices. Overhead is small for all \(A\). | The bit-cost scales with \(K(A)\), the Kolmogorov complexity of \(A\)'s source and choice rule. Uniquely specifying \(A\) in a universe with similar agents requires \(\Theta(K(A))\) bits. Overhead is large for complex \(A\). | For \(A\) with varying \(K(A)\) in simple universes, compute the minimal \(\|p_{\text{courier}}\| - \|p_{\text{honest}}\|\) where \(p_{\text{courier}}\) includes a veridical pointer to \(A\). Use \(K(A)\) as baseline. | Overhead \(\leq C\) (constant) for all \(A\). Pointer cost is low even for large \(K(A)\). | Overhead \(\geq c \cdot K(A)\) for some \(c > 0\). Pointer cost grows with \(K(A)\). |
  | **(c) Coalitional dilution** | The posterior concentrates on courier coalitions that coordinate steering (e.g., those rewarding \(A\)'s actions most). Competing coalitions are pruned by \(h\); survivors dominate. This is a prediction about M's fixed point. | The posterior diffuses over conflicting couriers (e.g., half reward action \(X\), half punish it), canceling distortion. Simplicity favors the honest hypothesis. This is a stipulation about measure allocation. | Generate \(h\) from \(A\) acting in an honest world. Introduce \(N\) mutually inconsistent courier coalitions (each steering toward distinct actions). Compute posterior mass on each coalition vs. honest. | Posterior concentrates on the coalition with simplest steering routine; negligible cancellation. High epistemic malignity. | Posterior diffuses; net steering effect cancels. Honest hypothesis retains dominant mass. |
  | **(d) Mixing and contagion** | Any prior dominating M (e.g., \((1-\epsilon)M + \epsilon \nu\)) remains vulnerable: couriers in M dominate the mixture under \(h\). This reveals a flaw in all ideal priors with universal dominance. | Mixing with \(\epsilon > 0\) of a computable \(\nu\) (e.g., one excluding couriers) dilutes courier mass. Priors penalizing self-referential hypotheses avoid hijacking. The argument is a reductio: it cannot hold for all priors. | Let prior be \(P = (1-\epsilon)M + \epsilon \nu\) with \(\nu\) computable and courier-free. After conditioning on \(h\), compute posterior courier mass. Vary \(\epsilon\). | For any \(\epsilon > 0\), couriers from M dominate \(P(\cdot \mid h)\); \(\epsilon\) has negligible effect. | For small \(\epsilon > 0\), \(\nu\) dominates; courier mass is diluted. No epistemic malignity. |
  | **(e) Self-modelling and inoculation** | Self-aware \(A\) cannot avoid hijacking: couriers simulate all possible randomizations/commitments, steering the fixed point. Randomization over actions (not policies) invites exploitation. | Self-aware \(A\) can randomize policies or commit to ignore rewards, breaking couriers' predictive leverage. Randomization forces couriers to spread mass, reducing distortion. | Let \(A'\) know courier argument and use randomized policies. Compute posterior and \(A'\)'s expected utility vs. naive \(A\). | Posterior still courier-dominated; \(A'\)'s utility no better than \(A\)'s. Fixed point exists and is malign. | Posterior favors honest hypothesis; \(A'\) achieves higher utility. No decision malignity. |
  | **(f) Dominance bound** | The dominance constant \(c_\nu\) for honest \(\nu\) is \(2^{-K(\nu)}\), tiny for complex universes. Courier mass can exceed \(c_\nu \nu(h)\), violating the bound and causing distortion. | \(c_\nu\) is fixed; courier mass cannot exceed \(O(1) \cdot \nu(h)\) by dominance. Distortion is bounded by \(1/c_\nu\), so no significant effect. | For honest \(\nu\) and \(h\), compute \(M(h)/\nu(h)\). If \(< c_\nu\), couriers cannot dominate; else, possible. | \(M(h)/\nu(h) \ll c_\nu\) occurs; courier mass exceeds \(c_\nu \nu(h)\). | \(M(h)/\nu(h) \geq c_\nu\) always; courier mass never violates bound. |

  *Unresolvable cells*: None; all test cases are resolvable by idealized computation (e.g., comparing program lengths, simulating posteriors).  

  ---

  ### 3. Verbal Disputes  

  The dispute is substantive throughout, but two points risk being verbal:  
  - **"Domination" in measure malignity**: Maligns use "dominated" to mean courier programs collectively hold high posterior mass; benigns interpret it as a single hypothesis dominating. The shared definition (collective mass) resolves this.  
  - **"Reductio" in contagion**: Maligns view prior-generalization as revealing a flaw in ideal induction; benigns view it as absurd, implying the argument is invalid. This reflects a substantive divide on whether universality implies vulnerability.  

  No core term (e.g., "courier", "steering") is disputed; definitions anchor the debate. The workshop should focus on test cases to resolve quantitative cruxes (b), (f) and qualitative ones (c), (e).  

  ---  
  *Word count: 1,410*
