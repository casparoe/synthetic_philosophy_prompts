answer: |-
  ### Tier Ranking & Justifications  
  **S-tier**: Quadratic (1)  
  *Why*: Strictly proper, underpins dominance argument for probabilism, gold standard despite partition sensitivity.  
  **A-tier**: Log (2)  
  *Why*: Strictly proper and partition-invariant, but unbounded—fine-grained agendas cause ∞-inaccuracy.  
  **B-tier**: Soft-floor log (5)  
  *Why*: Bounded and convex, but *improper* (tangent swap breaks expected accuracy minimization at \(c_j \approx \epsilon\)).  
  **C-tier**: Spherical (3)  
  *Why*: Strictly proper but partition-sensitive and unintuitive (non-additive, geometric quirks).  
  **F-tier**: City-block (4)  
  *Why*: Not proper, fails dominance argument (incoherent credences can "beat" coherent ones).  

  ---

  ### Scores (0–10)  
  | Measure       | Strict Propriety | Boundedness | Refinement-Stability | Dominance Argument |  
  |---------------|------------------|-------------|----------------------|--------------------|  
  | Quadratic (1) | 10               | 0           | 0                    | 10                 |  
  | Log (2)       | 10               | 0           | 10                   | 10                 |  
  | Spherical (3) | 10               | 0           | 0                    | 10                 |  
  | City-block (4)| 0                | 5¹          | 10                   | 0                  |  
  | Soft-floor (5)| 0²               | 10          | 0³                   | 0⁴                 |  

  ¹ *Bounded per cell but not overall in \(\sum|c_i|\).  
  ² *Improper near \(\epsilon\): coherent \(p\) expects worse accuracy than some \(c \neq p\).*  
  ³ *Fails Coarsening test: \((0.34,0.66)\) vs. \((0.34,0.33,0.33)\) yield different scores.*  
  ⁴ *Incoherent \(c = (0.5,0.5,0.5)\) isn’t strictly dominated by any coherent \(p\) (e.g., \((0.5,0.5,0)\) fails at \(w_3\)).*  

  ---

  ### Your Suspicion: Local + Proper + Bounded = Impossible  
  **Yes, your argument holds** under standard regularity (continuity, strict convexity). Only the log score is *local* (inaccuracy depends solely on \(c_j\) at true world \(w_j\)). Crucially:  
  - **Local + Proper → Unbounded**: Propriety forces \(\mathcal{I}(c,w_j) \to \infty\) as \(c_j \to 0\) (else shifting credence from false cells to \(w_j\) wouldn’t improve accuracy).  
  - **Bounded + Local → Improper**: If bounded, \(\mathcal{I}(c,w_j)\) can’t blow up as \(c_j \to 0\), so it can’t be proper.  
  Your soft-floor log is bounded and local (by design) but *must* be improper—the tangent swap violates the scoring rule derivative condition for propriety. The quadratic’s partition-sensitivity *is* the cost of propriety + boundedness.  

  ---

  ### Confidence in Top Tier  
  **0.7** (Quadratic is S-tier for veritism *as currently framed*).  
  - **Why not higher?** Refinement-stability is a serious philosophical gap—no strictly proper measure achieves it (log is stable but unbounded). Your Coarsening test exposes this: quadratic/spherical penalize \((0.34,0.33,0.33)\) vs. \((0.34,0.66)\), undermining "purely epistemic" status.  
  - **Why not lower?** Propriety and dominance are non-negotiable for accuracy arguments. Quadratic delivers these, and boundedness may be a red herring (epistemic immodesty requires unbounded penalties?).  

  **Bottom line**: Quadratic/log are "right" for probabilism arguments, but refinement-stability demands new axioms or a retreat from strict veritism. Your soft-floor log is clever but can’t fix the trilemma—it’s a bounded improper tool, not a foundation.  

