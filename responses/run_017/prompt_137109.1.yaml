prompt: |-
  I'm on the ethics committee at a mid-sized community hospital, and last month we switched to a new two-part advance directive form that our chair designed. Part A is the actual instruction — the checkbox stuff about ventilators, feeding tubes, antibiotics for infections once someone has advanced dementia. Part B is a blank box where the patient writes, in her own words, a few sentences about what she's trying to protect or avoid by signing Part A. The idea is that when the two parts come apart down the road, Part B tells us how to read Part A. I got into an argument about this with a friend who's a hospitalist, and she said the whole form is pointless: only Part A can have any authority, because the earlier competent self is a decision-maker, not an advice columnist. Once she's decided, her reasons for deciding are done — we don't get to reopen them and audit whether they still hold. I think that can't be right, but every time I try to say why I end up just asserting it, so I want a case concrete enough to bring to the next meeting (we're also using it to train the new residents, so it has to be a real hospital-ish situation, not a philosophy seminar setup).

  So: build me a case — one paragraph, realistic, a hospital or a memory care unit, nothing science-fictional — engineered to these specs. The patient is now permanently incapacitated and Part A's trigger condition is unambiguously met. But Part B's rationale has, in a way you get to design, been voided: the thing she wrote the directive to protect or prevent is gone, or achieved, or no longer on the table. Two things you can't use. First, no empirical-misconception move — she was not wrong about what the condition would be like, so you can't win by saying she'd have been surprised by how things turned out. Second, and this is the bit I keep failing at: the case has to be built so that the question "what would she have wanted now?" is genuinely blocked. The evidence should point both ways or be silent. If your scenario makes it obvious she'd have changed her mind, or obvious she'd have stuck with her guns, it doesn't count — winning by speculation about her hypothetical current wishes is exactly the cheat I'm trying to rule out. Also, please don't make it easy on yourself by making her current life obviously good: I want her present-day welfare to be genuinely murky, so that a straight current-interests or best-interests reading can't deliver a clean verdict either way.

  After the scenario, do the accounting. Tell me what the instruction-authority reading (my friend's) says and why; what a current-interests reading says and why; and what the rationale-authority reading says and why — and I want the last one to come apart from the second one, so that the argument for overriding is structural (something about what she was *doing* when she filled out the form, what the authority was *for*) rather than a claim that she's better off being treated. Then isolate the single feature of the case that's doing the work, show me what happens to all three verdicts if you delete it, and tell me how my friend the hospitalist would attack the case — she's smart and she'll say something about hindsight and about the whole point of the practice, so give me her strongest version, not a strawman. One more thing: I need to know how confident you are in each piece of this and, specifically, which part you're least sure of — I'd guess it's whether the rationale reading can even be stated without quietly collapsing back into a guess about her hypothetical wishes, but you tell me. If it can't be done to spec, say so rather than fudging, and tell me which constraint you had to drop.
reasoning: |-
  Okay, the user is on an ethics committee and needs a concrete case to argue for the importance of Part B in advance directives. They want a realistic hospital scenario where Part A's instructions conflict with Part B's rationale, but without relying on misconceptions or hypothetical wishes. Let me break this down.

  First, the constraints: The patient is incapacitated, Part A applies clearly, but Part B's rationale is voided. No empirical misconceptions—so the patient wasn't wrong about the condition. Also, the current situation must be murky; not obviously good or bad. And crucially, "what would she want now?" is unanswerable. That's tricky because avoiding speculation about current wishes is hard. 

  I need to void Part B's rationale. The user mentioned the avoided outcome being gone, achieved, or off the table. Maybe the patient feared something that later becomes irrelevant. For example, a fear of burdening someone who is no longer around. That way, the core reason for the directive no longer exists. 

  Let me think of a scenario. Suppose the patient, Martha, had early-stage dementia and feared being a financial burden on her granddaughter. She signed Part A to refuse life-prolonging treatments. But then the granddaughter wins the lottery, so the financial burden is gone. Martha's current condition is still poor—advanced dementia, bedbound, but not suffering. Her welfare is ambiguous, so best-interests can't decide. 

  But why can't we ask what she'd want now? The granddaughter's windfall changes the context, but Martha never knew about it. Since she's incapacitated, we can't infer her current wishes. Evidence is silent—she might still not want to live with dementia, or she might not care now. So that blocks the hypothetical wishes angle. 

  Now, the three readings: Instruction-authority (friend's view) says follow Part A regardless. Current-interests is indeterminate because her state isn't clearly bad. Rationale-authority says since the burden is gone, the directive's foundation is void, so we shouldn't follow Part A. The key here is that the authority of the directive was tied to the rationale, not just the instructions. 

  The critical feature is the granddaughter's lottery win removing the burden. Without it, Part B's fear is still valid, so rationale-authority would uphold Part A. But with it, the rationale is void. 

  The hospitalist friend might argue that advance directives are meant to bind future decisions, and allowing rationale to override instructions introduces uncertainty. Hindsight shouldn't invalidate prior choices. 

  My uncertainty is whether rationale-authority avoids smuggling in hypothetical wishes. Here, it's about the directive's conditional nature—if the rationale is void, the directive lapses. But is that different from assuming she'd change her mind? Maybe. If the case hinges on the rationale being a condition, not a prediction, it might work. But it's a fine line.
answer: |-
  Here's the case engineered to your specifications:

  **Scenario:** Martha, 78, with early vascular dementia, completes the advance directive. In Part A, she checks "Do Not Attempt Resuscitation" and "No Artificial Nutrition/Hydration" **if** she develops "severe, permanent cognitive impairment (unable to recognize family or communicate meaningfully)". In Part B, she writes: *"I fear becoming a crushing financial burden on my granddaughter, Lily, who is just starting her career and struggles with student loans. I do not want her sacrificing her future to pay for my care. This directive is to protect her from that."* Five years later, Martha has advanced dementia, meets Part A's trigger perfectly: bedbound, non-communicative, requires total care. Lily, however, unexpectedly won a substantial lottery last year, making her financially independent and easily able to cover Martha's high-cost memory care without hardship. Martha's current existence involves no apparent pain but minimal responsiveness; she shows fleeting, ambiguous reactions to touch/music. A UTI arises, easily treatable with antibiotics, but declining them (per Part A) would likely lead to death via sepsis progression. Her current welfare is ambiguous: no overt suffering, but no discernible positive experience or engagement either.

  **Accounting:**

  1.  **Instruction-Authority Reading (Hospitalist's View):** **Follow Part A - decline antibiotics.** Martha's competent self made a clear, condition-specific instruction in Part A. The trigger condition (severe permanent cognitive impairment) is unambiguously met. The directive was an exercise of her decision-making authority over her future incapacitated self. Her *reasons* (Part B) are irrelevant to the validity of the *instruction* (Part A). Reopening the decision based on changed circumstances (Lily's windfall) undermines the core purpose of advance directives: binding future caregivers to prior competent choices and preventing burdensome guesswork. Her authority was to *decide*, not just to advise.

  2.  **Current-Interests Reading:** **Indeterminate.** Martha's current existence is neither clearly beneficial nor clearly burdensome *to her*. There is no evidence she experiences pain or distress warranting death as a relief. Conversely, there's no evidence she derives meaningful pleasure, relationships, or awareness that would make continued life a benefit *to her*. The ambiguous reactions preclude a confident assessment of net suffering or benefit. Neither treating nor withholding can be clearly justified based solely on *her* current experiential interests.

  3.  **Rationale-Authority Reading:** **Override Part A - administer antibiotics.** The directive's authority derived from the specific protective purpose Martha articulated in Part B: shielding Lily from financial ruin. That specific condition of applicability – the *threat* to Lily's future – has been definitively voided (Lily's wealth). Martha structured the directive as a means to an end (protecting Lily), not an end in itself. The *authority* of Part A was contingent on Part B's rationale being operative. Since the rationale is void, the instruction loses its foundational justification. Honoring her *intent* (the structure of her decision-making) requires recognizing that the directive was conditional on circumstances that no longer hold. This is not about what she *would* want now (unknowable), but about what her *prior competent self* established as the *condition for the directive's force*.

  **The Critical Feature:** The **voiding of the specific, articulated protective goal (Lily's financial burden) due to an unforeseeable external event (lottery win) that resolves the threat entirely**, while the patient's clinical condition and directive trigger remain unchanged.

  *   **Delete this feature (Lily remains financially struggling):** Rationale-Authority aligns with Instruction-Authority (follow Part A). Current-Interests remains indeterminate. The case loses its force for Rationale-Authority overriding Part A.
  *   **Hospitalist's Strongest Attack:** "This misunderstands the *kind* of authority Martha exercised. She didn't write 'Do not treat me *if* Lily is poor'. She wrote 'Do not treat me *when* I have severe dementia'. The 'if' was her *motive*, not a *condition* written into the instruction. Advance directives are designed to lock in decisions *despite* unforeseen changes – that's the whole point of binding future uncertainty! Using Part B to invalidate Part A based on hindsight transforms directives from decisive instructions into endlessly revisable suggestions tied to fluctuating circumstances, creating paralyzing ambiguity for clinicians when the trigger condition *is* met. It disrespects her prior autonomy by substituting our judgment about the relevance of her reasons for her actual, clear instruction."

  **Confidence & Uncertainty:**

  *   **High Confidence:** In constructing the scenario to meet the empirical (no misconception), trigger condition met, welfare murky, and rationale voided constraints. Also high confidence in articulating the three distinct readings clearly.
  *   **High Confidence:** That the Hospitalist's attack (as stated above) is the strongest, most principled counter-argument focusing on the nature of decisional authority versus motive.
  *   **Moderate Confidence:** That the Rationale-Authority reading can be articulated *structurally* (contingent authority based on articulated purpose) without *explicitly* relying on hypothetical current wishes.
  *   **Low Confidence / Crucial Uncertainty:** Whether the Rationale-Authority reading **truly avoids smuggling in hypothetical wishes.** The argument hinges on interpreting Part B as establishing a *condition* for Part A's application ("protecting Lily" wasn't just a reason, it was the *purpose* defining *when* the instruction should govern). However, one could argue that inferring *this specific type of conditionality* from the text "I fear... I do not want... This directive is to protect..." is itself an interpretation that edges towards speculating about what she *would* deem relevant *now* that the fear is gone, rather than being an unambiguous structural feature of the directive *as she wrote it*. Is "to protect her from that" clearly establishing a *condition*, or is it simply stating a *motive*? This ambiguity is the core tension. If Part B explicitly said "This directive is *only* valid if Lily faces financial hardship," the Rationale-Authority case would be ironclad. Without that explicit conditional language, inferring conditionality from motive/purpose is the vulnerable step where hypothetical wishes *might* be creeping in, despite the structural framing.

  **Conclusion:** The case meets your specifications, isolating the rationale-voiding mechanism effectively. The Hospitalist's principled attack on hindsight and the nature of authority is robust. The Achilles' heel remains whether the move from "motive/purpose stated in Part B" to "contingent condition for Part A's authority" can be made without implicitly relying on the very speculation about her *potential* reaction to changed circumstances that you are trying to rule out. This is the point requiring the most careful defense in committee.
