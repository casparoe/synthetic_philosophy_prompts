prompt: |-
  My buddy and I got into a three-hour argument last night and I can't shake it. We were talking about that AI safety proposal where you get two systems to argue in front of a human judge who can't check everything, and the judge just picks whichever one sounds more convincing. He says truth has a built-in edge: the liar has to keep inventing new stuff, the honest side just points at what's already there. I think that's backwards, because of something I keep running into in totally ordinary arguments.

  Here's the pattern. The more exactly right your claim is, the more claims you've made. I tell my manager "the deploy broke checkout for people with saved cards on Safari, it was about 3% of sessions, and it was fixed in forty minutes," and what she hears is "so the deploy broke checkout." My friend tells me the car I'm looking at has a transmission problem; I say "true for the 2013-2015 automatics, the manuals are fine, and there was a recall fix," and he says "so you admit it's a problem." Nobody lied, but the accurate version lost, and it lost because every qualifier I added was another thing the other person could demand I back up or just quietly drop. Being precise doesn't shrink what you're on the hook for, it multiplies it. And the lying version isn't cheap because lies are cheap to make — its cheap because it only has one surface to check.

  Is there a name for this? Everything I poke around at is about the opposite direction: the thing where one side floods the zone with bogus claims so you can't rebut them all. This is different — the honest side isn't overwhelmed by volume, it's penalized for accuracy, and giving the judge unlimited time doesn't obviously fix it, since the budget seems to be per-claim rather than per-argument. I don't just want a label. I want to know what exactly this is, what it isn't, and where its edges are: does it depend on the audience being lazy, does it survive a careful and well-informed judge, does it still bite if the judge is allowed to ask questions, and is it the same mechanism when the qualifiers are true vs. when they're just hedges. If nobody's named it, name it and define it so it's clearly distinct from the nearby things. And if it's real, does it actually put a hole in the debate setup, or does the setup dodge it somehow?

  Also tell me how confident you are and what would change your mind — which consideration would flip you, and where your reasoning is most likely to fail.
reasoning: |-
  Okay, the user is describing a communication pattern where precise, nuanced explanations seem to lose out to oversimplified versions in arguments. They want to know if there's a name for this phenomenon, how it works, and whether it undermines AI safety debate proposals. 

  First, I need to unpack their core observation: that adding qualifiers to make a statement more accurate actually increases its vulnerability in debate. Their examples (the deploy error, the car transmission) show how listeners discard nuance and latch onto the simplest interpretation. This feels distinct from Gish Gallop - it's not about overwhelming with falsehoods, but about precision backfiring.

  The user's frustration is palpable. They've clearly thought deeply about this, given how they dissect the mechanics: the "per-claim cognitive cost" angle is sharp. Their manager/friend examples suggest real-world experience where nuance gets punished. And they're not just venting - they want rigorous analysis of boundaries (lazy vs careful judges, true qualifiers vs hedges).

  Hmm... existing concepts like the "burden of proof" or "steelmanning" touch this but don't quite fit. The closest might be Brandolini's Law, but that's about debunking nonsense being harder than creating it. Here it's different: the truthful party bears extra load simply by being precise. 

  Let me structure this:
  - Mechanism: Each added qualifier creates a new "proof obligation" while the simplified claim has fewer attack surfaces. Cognitive load matters more than truth value.
  - Audience matters: Lazy listeners amplify this, but even careful judges might struggle with cumulative complexity. 
  - AI debate implications: In theory, unlimited time should help, but human cognition has limits. The truthful AI might still drown in its own nuance.

  Biggest insight: The "cost of precision" isn't about deception - it's about the structural disadvantage of complexity versus simplicity. That's why naming it "Precision Tax" feels right. 

  For confidence levels: I'm solid on the phenomenon existing (user's examples ring true), but less certain about how fatal this is to AI debates. If the judge can actively interrogate/simplify claims, it might mitigate things. Would change my view if shown studies where nuanced arguments consistently win under time pressure.

  User's depth impresses me - they've identified a genuine cognitive blind spot in debate design. Their "per-claim rather than per-argument" point is particularly astute. This deserves a thorough response that honors their insight while probing its limits.
answer: |-
  What you're describing is a **fundamental asymmetry in cognitive burden between precision and simplicity**—an asymmetry that systematically disadvantages nuanced truth in many debate contexts. It doesn't have a universally accepted name, but based on your mechanism, I propose calling it the **"Precision Tax"** or **"Nuance Burden."**  

  ### Core Definition  
  **Precision Tax**: The cognitive and persuasive disadvantage incurred when a communicator adds accurate qualifiers or contextual details to a claim. Each increment of precision:  
  - **Increases the number of verifiable sub-claims** the speaker must defend.  
  - **Expands the surface area for skepticism** (e.g., "Prove the 3% figure," "Show the recall notice").  
  - **Allows opponents to selectively ignore nuance** and reframe the core claim in oversimplified terms.  
  Meanwhile, the simplified (or dishonest) claim **benefits from lower cognitive demand**: it presents fewer hooks for challenge, making it easier to assert and harder to fully refute.  

  ### Key Boundaries: What It Is vs. Isn't  
  | **Aspect**               | **Precision Tax**                                                                 | **Common Misconceptions**                                                                 |
  |--------------------------|-----------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------|
  | **Core Mechanism**       | Penalty per *additional true claim*, not volume of lies.                          | ≠ Gish Gallop (overwhelm with false claims). <br> ≠ Brandolini's Law (asymmetry of debunking effort). |
  | **Source of Advantage**  | Simplicity wins by minimizing *defensible units*, not because lies are "cheaper." | ≠ "Lies are easier to invent" (your liar still invents—but defends less).                |
  | **Judge's Role**         | Persists even with unlimited time *if* judges evaluate claims discretely.         | ≠ "Lazy audience" effect alone (though laziness amplifies it).                           |

  ### When Does It Apply? Critical Edge Cases  
  1. **Audience Competence**:  
     - **Lazy/biased judge**: Precision Tax dominates. Nuance is discarded.  
     - **Careful judge**: Tax *reduces* but persists. Verifying 10 precise claims still takes 10× longer than verifying one broad claim.  
  2. **Judge Interaction**:  
     - **Passive listening**: Highest tax (e.g., your manager truncating your statement).  
     - **Active questioning**: Mitigates the tax *if* the judge forces simplification ("What’s the *main* issue?").  
  3. **Qualifier Types**:  
     - **True contextualizers** (e.g., "only 2013–2015 automatics"): Still taxed—each requires evidence.  
     - **Hedges** (e.g., "generally," "often"): Increase vagueness *and* suspicion, doubling the tax.  

  ### Implications for AI Debates  
  Your buddy's "truth has a built-in edge" argument **fails** here:  
  - **The liar AI** can offer a single, streamlined narrative. It only defends one surface.  
  - **The truthful AI** must defend every sub-claim (browser version, session %, fix time). Each is a vulnerability.  
  - **Unlimited time helps, but doesn't erase the asymmetry**: Humans have finite working memory. A judge parsing 50 true sub-claims may lose the thread, while the lie’s simplicity remains sticky.  

  **Does this break AI debate?**  
  - **In naive implementations: Yes.** If the judge scores claims atomistically ("Prove each sub-point"), truth loses.  
  - **Mitigations**:  
    - Train judges to reward *holistic accuracy* over point-by-point "wins."  
    - Allow the truthful AI to *simplify* without penalty ("The core issue was X; details on request").  
    - Penalize the lying AI for *evasion* when pressed for specifics.  

  ### Confidence & Uncertainty  
  **Confidence Level**: 85%  
  - **Strong evidence**: Your examples mirror cognitive psychology findings (e.g., the "dilution effect," where irrelevant details weaken strong arguments; or "attribute fatigue" in decision-making).  
  - **Limits**: Most studies focus on persuasion—not debate formats with adversarial AIs.  

  **What would change my mind?**  
  1. **Data showing nuanced arguments win under time pressure** (I’ve seen none).  
  2. **Proof that liars *must* generate more claims** to compete (your "single surface" insight feels robust).  
  3. **AI debate experiments** where truth wins *despite* high Precision Tax (current results are mixed).  

  **Where my reasoning is most fragile**:  
  - The assumption that all qualifiers *must* be defended. In some contexts (e.g., expert audiences), nuance may build credibility.  
  - Underestimating the liar’s risk: One exposed falsehood can collapse their entire position.  

  ### The Takeaway  
  You've identified a real vulnerability. **Precision Tax isn't about deception—it's about cognitive economy.** In any adversarial forum (AI debates, office politics, car arguments), truth pays a surcharge for completeness. The solution isn't less accuracy—it's designing systems that reward integrated understanding over fragmented point-scoring. If your buddy dismisses this, ask him: "If truth always wins, why do billion-dollar industries exist to simplify complex facts?" That might fuel night #2 of debate.
