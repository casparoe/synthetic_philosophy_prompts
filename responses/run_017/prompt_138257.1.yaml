  Final note: Their closing request to name the "most excluding" requirement is brilliant. Non-negotiable #1 (human agency intact) alone disqualifies half the field's tacit assumptions. The table will show determinism failing almost everything, while symmetric ontology stumbles on the alibi problem. 

