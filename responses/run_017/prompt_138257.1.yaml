answer: |-
  ### Desiderata for a Theory of Non-Human Causes in Historical Explanation  

  **Core Definitions:**  
  - **Triggering Factor:** An event that directly initiates a change (e.g., a volcanic eruption causing immediate famine).  
  - **Standing Condition:** A persistent background state enabling/disabling outcomes (e.g., endemic malaria in a region).  
  - **Constraining:** Limits the range of possible actions (e.g., drought restricting agricultural options).  
  - **Enabling:** Creates opportunities (e.g., frozen river allowing an army to cross).  
  - **Selector of Stability:** Filters which social systems endure stress (e.g., pathogen exposure favoring resilient populations).  
  - **Environmental Determinism:** Over-attributing outcomes to non-human forces, minimizing human agency.  

  ---

  ### I. Non-Negotiable Requirements (Cases the Theory Must Get Right)  
  1. **The Eruption Test: Scale Sensitivity**  
     - *Case:* 1815 Tambora eruption → "Year Without a Summer" → harvest failures in Europe/New England.  
     - *Test:* Theory must distinguish between the eruption as a *trigger* of crisis and pre-existing social vulnerabilities (e.g., grain storage systems) as *standing conditions*.  
     - *Status:* Non-negotiable. Failure here implies blindness to multi-scalar causality.  

  2. **The Pathogen Test: Specificity in Agency**  
     - *Case:* Mosquito-borne disease (e.g., yellow fever) dooming a colonial expedition in the Caribbean.  
     - *Test:* Theory must show why the pathogen is an *active cause* (killing troops) not mere background, but not the *sole explanation* (poor planning, local resistance matter).  
     - *Status:* Non-negotiable. Avoids conflating "cause" with "excuse" for colonial failure.  

  3. **The Drought-Violence Test: Contextual Interaction**  
     - *Case:* Drought → migration → violence in Region A, but not in Region B with comparable drought.  
     - *Test:* Theory must explain why the non-human factor (drought) *enabled* violence only when intersecting with specific human factors (e.g., land tenure systems, political grievances).  
     - *Status:* Non-negotiable. Rules out monocausal environmental determinism.  

  4. **The Twin Harvest Failures Test: Causal Idiom Shift**  
     - *Case:* Identical harvest failures—one from bad weather, one from oppressive tax policy—where historians emphasize "drought" vs. "state extraction."  
     - *Test:* Theory must justify when non-human factors are cast as *impersonal forces* (weather) vs. human factors as *intentional acts* (policy), without defaulting to anthropocentrism.  
     - *Status:* Non-negotiable. Exposes hidden hierarchies in causal attribution.  

  ---

  ### II. Essential Distinctions (Must Not Be Collapsed)  
  5. **Triggering vs. Standing Condition**  
     - *Motivation:* In the drought-violence case, drought may *trigger* migration, but pre-existing ethnic tensions are the *standing condition* enabling violence.  
     - *Status:* Non-negotiable. Collapsing these conflates immediate catalysts with structural causes.  

  6. **Constraining vs. Enabling**  
     - *Motivation:* A frozen river *enables* an invasion (e.g., Napoleon’s 1812 campaign) but *constrains* naval mobility. Theory must clarify dual roles.  
     - *Status:* Non-negotiable. Avoids reductive "good/bad" framing of non-human factors.  

  7. **Cause vs. Selector of Stability**  
     - *Motivation:* Pathogens in colonies act as *selectors* (exposing weak logistics) not prime *causes* (which include imperial overreach).  
     - *Status:* Non-negotiable. Prevents naturalizing social Darwinism.  

  8. **Explaining vs. Excusing (The Alibi Problem)**  
     - *Motivation:* Historians use climate to *excuse* state failures (e.g., "famine absolves bad governance") but pathogens to *explain* defeat (e.g., "disease defeated the army"). Theory must block this asymmetry.  
     - *Status:* Non-negotiable. Moral/political stakes require neutrality.  

  ---

  ### III. Adjudicating Candidate Requirements  
  9. **The Substitution Test**  
     - *Requirement:* A non-human factor counts as more than background *only if* swapping it (e.g., no eruption, milder winter) would alter agents’ feasible options, not just timing/casualties.  
     - *Assessment:* **Genuine desideratum**.  
       - *Motivation:* Ensures non-human factors have *counterfactual weight* (e.g., no Tambora eruption → no pan-European subsistence crisis → different policy choices).  
       - *Rules Out:* Factors that merely accelerate inevitable outcomes (e.g., a storm delaying but not preventing a ship’s arrival).  
       - *Survives Cases:* Passes eruption/pathogen tests; clarifies why a mild drought may not "cause" violence if alternatives existed.  

  10. **The Uptake Condition**  
      - *Requirement:* A factor counts *only if* it was registered by contemporaries (e.g., as risk, rumor, or explanation).  
      - *Assessment:* **Prejudice of human-centric history**.  
        - *Motivation:* Privileges documentary evidence and intentionality.  
        - *Rules Out:* Slow-moving/imperceptible factors (e.g., soil depletion, gradual climate shifts) even if structurally decisive.  
        - *Fails Cases:* Drought-violence case (farmers may not "register" early-stage drought as a portent); pathogens (asymptomatic carriers).  

  ---

  ### IV. Conflicts and Exclusionary Power  
  **Irreconcilable Conflict:**  
  - **Substitution Test (Requirement 9)** and **Alibi Problem (Requirement 8)** clash.  
    - *Why:* Substitution requires non-human factors to have *independent causal power* (e.g., "no eruption → no crisis"). But this risks *excusing* human failures (e.g., "eruption caused crisis, not poor governance"), violating the ban on alibis. Theory must balance causal weight without absolution.  

  **Most Exclusionary Requirement:**  
  - **Requirement 3 (Drought-Violence Test)** excludes the most positions. It forces theories to explain *why* non-human factors produce divergent outcomes in similar contexts, invalidating:  
    - Strict determinism (same cause → same effect).  
    - Blanket exceptionalism (drought is always irrelevant).  
    - Naïve symmetry ("drought as actor" ignores mediation by social structures).  

  ---

  ### V. Evaluation of Stances  
  | **Stance**                           | **Score Against Desiderata**                                                                 |  
  |--------------------------------------|----------------------------------------------------------------------------------------------|  
  | **Strict Human Exceptionalism**      | Fails all non-negotiable cases (1–4): Rejects non-human factors as causal, reducing them to scenery. Violates Requirement 8 by ignoring alibi risks. |  
  | **Environmental Determinism**        | Fails Requirements 3 (drought-violence divergence) and 8 (alibi problem): Over-attributes outcomes to non-human factors, erasing agency and excusing actors. |  
  | **Flat Symmetric Ontology**          | Fails Requirement 8 (alibi problem): Treats germs/treaties as equivalent "actors" obscuring moral responsibility. Struggles with Requirement 7 (pathogens as "selectors" not agents). |  
  | **Middle View (Constraints/Affordances)** | Best fit: Satisfies all non-negotiables by framing non-human factors as *boundaries* for action (e.g., eruption enables/blocks choices). Avoids determinism (Requirement 3) and alibis (Requirement 8). |  

  **Conclusion:** The middle view uniquely balances agency and constraint, though it must navigate the substitution-alibi tension. Historians should ask: *"Did this non-human factor reshape the landscape of possible actions, and if so, how was that landscape navigated?"* This avoids scenery and determinism alike.  

  —  
