answer: |-
  Below is a complete workshop plan designed to meet your requirements. It uses a team-based game to illustrate the divergence between world-centric and observer-centric reasoning, embedding your three variations organically. The session runs in 90 minutes with 20 participants at five tables but includes scaling notes for a 45-minute version. The debrief maps outcomes to philosophical concepts without jargon until the end.

  ---

  ### **Workshop Title:** "The Betting Game: Which World Are You In?"

  **Goal:** Participants discover that two scoring methods (counting worlds vs. counting observers) lead to conflicting rational betting strategies, revealing how anthropic reasoning depends on unstated assumptions.

  **Core Mechanics:**  
  - Teams bet on which "world" is real: **Small** (few observers) or **Large** (many observers).  
  - Unknown to them, a coin flip determines the real world each round.  
  - Observers are secretly sorted into worlds. Only those in the real world bet.  
  - **Two scoreboards** track:  
    - **World Score:** +1 if the majority of observers *in the real world* bet correctly.  
    - **Observer Score:** +1 *per observer* who bets correctly.  
  - Payouts vary by round (fixed vs. shared prizes).  

  **Materials:**  
  - 1 coin.  
  - 30 "Observer" cards (blank paper).  
  - 30 "Not Selected" cards (blank paper).  
  - Betting slips (paper with "Small" and "Large" options).  
  - 2 whiteboards: one for **World Score**, one for **Observer Score**.  
  - Timer.  

  **Room Setup:**  
  - Five tables with 4 participants each.  
  - Each table is a team. Teams do not move.  

  ---

  ### **Timeline (90 Minutes Total):**

  #### **1. Introduction (5 mins)**  
  - **Goal:** Set up the game without philosophy.  
  - **Script:**  
    > "Welcome! We’re playing a betting game. There are two possible worlds: **Small** (with few observers) and **Large** (with many observers). Each round, I’ll flip a coin to decide which world is real. Some of you will become 'observers' in that world and bet on whether it’s Small or Large. We’ll track two scores: one for *worlds*, one for *observers*. The winning team gets a book token. No prior knowledge needed—just follow the rules."

  #### **2. Round 1: Baseline (20 mins)**  
  - **Goal:** Introduce core conflict. Teams commit to a betting policy *before* learning who observes.  
  - **Rules:**  
    - Small world: 1 observer. Large world: 19 observers.  
    - Coin flip (50/50) determines the real world (do not reveal yet).  
    - **Assign observers secretly:**  
      - If Small world: Randomly select 1 team. Give 1 random member an "Observer" card; others at that table get "Not Selected."  
      - If Large world: All 5 teams play. Give 3–4 random members per table "Observer" cards (19 total); others "Not Selected."  
    - **Betting:** Only "Observers" bet. Teams must agree on a policy (e.g., "Always bet Large") *before* cards are distributed.  
    - **Payout:** Each winning observer gets +1 point (fixed prize).  
  - **Conduct:**  
    - Teams discuss policy (3 mins).  
    - Flip coin, assign cards (2 mins).  
    - Observers bet (2 mins).  
    - Reveal world. Update scoreboards:  
      - **World Score:** +1 if >50% of observers in the real world bet correctly (e.g., in Large, ≥10 of 19 must bet Large).  
      - **Observer Score:** +1 per correct bet.  

  #### **3. Round 2: Capped Variation (15 mins)**  
  - **Goal:** Show how restricting who bets "dissolves" anthropic evidence.  
  - **Rules:**  
    - Organisers "cap" bets: Only 4 observers bet *total*, regardless of world.  
    - Small world: 1 observer. Large world: 100 observers (emphasise this; no scaling).  
    - **Assign observers:** After coin flip:  
      - Randomly select 4 participants *across all tables* as "Observers." Others get "Not Selected."  
    - **Betting:** Teams commit to policy *before* selection.  
    - **Payout:** Fixed prize (+1 per correct bet).  
  - **Conduct:**  
    - Teams discuss policy (2 mins).  
    - Flip coin, assign cards (2 mins).  
    - Observers bet (2 mins).  
    - Reveal world. Update scores (same as Round 1).  

  #### **4. Round 3: Payout Variation (20 mins)**  
  - **Goal:** Contrast fixed vs. shared prizes to highlight how payouts affect rationality.  
  - **Rules:**  
    - Two sub-rounds (same world setup as Round 1):  
      - **Sub-round A (Fixed):** Each winning observer gets +1 point.  
      - **Sub-round B (Shared):** Total prize = 20 points. If Small wins, the observer gets 20 points. If Large wins, *all* observers in Large *share* 20 points (e.g., 19 observers ≈1 point each).  
    - Teams commit to *one policy for both sub-rounds* in advance.  
  - **Conduct:**  
    - Teams discuss policy (3 mins).  
    - Run sub-rounds sequentially (flip coin each time). Assign observers as in Round 1.  
    - Update scores after each.  

  #### **5. Round 4: No-Index Variation (15 mins)**  
  - **Goal:** Reduce to "bare evidence" (existence).  
  - **Rules:**  
    - No teams or observers. All participants bet as "outsiders."  
    - They know: "At least one observer exists." No other details.  
    - Coin flip determines world (Small: 1 observer; Large: 100).  
    - **Betting:** Individuals bet independently.  
    - **Payout:** Fixed prize (+1 per correct bet).  
  - **Conduct:**  
    - Flip coin (keep hidden). Announce: "At least one observer exists."  
    - Participants bet (2 mins).  
    - Reveal world. Update **Observer Score** only (no World Score—no "in-world" observers).  

  #### **6. Debrief (15 mins)**  
  - **Reveal the Point:**  
    > "Today’s game had two scoreboards. **World Score** asked, ‘Did the world’s observers guess right?’ **Observer Score** asked, ‘How many individuals guessed right?’ These diverged because they embody two philosophies:  
    > - **Self-Sampling (World Score):** You’re a random observer from your world. Bet based on your world’s details.  
    > - **Self-Indication (Observer Score):** Your existence is evidence *for* worlds with more observers. Bet on Large.  
    > In Round 1, most teams bet on Large for Observer Score—this is self-indication. But in Round 2 (capped), betting became 50/50 because capping broke the link between world size and your selection. That’s why anthropic arguments vanish when selection is controlled."  

  - **Map Variations to Objections:**  
    - **Capped (Round 2):** Answers "What group are we sampling from?" by fixing the sample size. Shows anthropics relies on *being selected* as evidence.  
    - **Payout (Round 3):** Fixed prizes favoured Large (self-indication); shared prizes favoured Small (self-sampling). Self-indication maximizes *chances to win*; self-sampling maximizes *prize if you win*.  
    - **No-Index (Round 4):** Reduced to "at least one observer exists." With no personal index, you don’t update from the prior (50/50). This is anthropic reasoning stripped bare—you need ‘I exist’ to do more."  

  - **Handle Curveballs:**  
    - **Infinite Universes:** "Infinity breaks probability math. Our game assumes finite worlds. Afterward, we can discuss how infinity changes things—but it’s not playable here!"  
    - **Counting People vs. Moments/Species:** "Why observers? Because we’re counting ‘experiencers.’ But is a ‘moment’ or ‘species’ the right unit? The game simplifies—ask in Q&A!"  
    - **Priors Shouting Match:** If debates erupt: "This game fixes priors at 50/50. We’re testing how *additional evidence* updates beliefs, not debating the prior."  

  - **Limitations:**  
    - **Can’t Reproduce:** Doomsday’s birth rank, Boltzmann brains, or infinite populations. These require post-game discussion (offer resources).  
    - **Predictable Issues:**  
      - **Policy Disagreement:** Teams may split on betting strategies. Stress: *Commit in advance!*  
      - **Confusion in Capped Round:** Clarify: "Only 4 bet *total*, even if Large has 100 observers."  
      - **Observer Score Dominates:** World Score often lags—highlight this as a feature (shows observer-centric intuition).  

  #### **Scaling to 45 Minutes (8 People):**  
  - **Changes:**  
    - Use 2 tables of 4.  
    - Skip Round 4 (No-Index). Reduce Round 3 to one sub-round (fixed payout only).  
    - Shorten discussions: 2 mins per policy.  
    - **Observer Adjustments:**  
      - Round 1: Small (1 observer), Large (7 observers).  
      - Round 2 (Capped): 3 observers bet total.  
      - Round 3: Skip shared payout.  
  - **Debrief:** Focus on Round 1 vs. Round 2 to contrast self-sampling and self-indication.  

  ---

  **Why This Works:**  
  - **Discovery Over Lecture:** The scoreboards’ divergence emerges from gameplay. Teams *feel* the tension between betting strategies.  
  - **Variations Integrated:** Capped, payout, and no-index rounds directly tackle objections through mechanics.  
  - **No Jargon Until Debrief:** Labels ("self-sampling/indication") come only after experiencing the conflict.  
  - **Handles Disruption:** Coin flips and fixed policies prevent prior-squabbles; capped round preempts "which group?" questions.  

  **Prep Tips:**  
  - Pre-make cards/slips.  
  - Assign a helper to manage scoreboards.  
  - For infinity/Boltzmann post-game, prepare a 2-min elevator pitch: "Infinity breaks ratios; Boltzmanns are about random observers—both stretch the game’s assumptions."  

  Run it once with colleagues to iron out kinks—it’s robust but thrives on clear instructions. Good luck!
