      - In the no-index round (round 4), you are not given the information that you are an observer. You only know that there is at least one observer. This doesn't change the prior. So you should bet 50-50.

      - Handle the infinity person: The game assumes finite worlds. If there are infinite observers, the probabilities might not be defined. We can say that the game is a finite analogy and that the arguments might not directly transfer.

