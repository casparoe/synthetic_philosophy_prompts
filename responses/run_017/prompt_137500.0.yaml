   5. Debrief (25 minutes)

      - First, show the two scoreboards (observer and world) after 3 rounds (excluding round 4). Point out that they might have diverged.

      - Explain the two ways of counting:
          - The observer score counts each observer's correct bet. It cares about individuals.
          - The world score counts whether the majority of observers in a world bet correctly. It cares about the world as a whole.

      - Map to the two assumptions:
          - Self-Sampling Assumption (SSA): You should reason as if you are a random observer from all possible observers. This leads to betting on the world with more observers because you are more likely to be there. This is what maximizes the observer score.
          - Self-Indication Assumption (SIA): The existence of many observers in a world is evidence that you are in that world. This is the anthropic update.

