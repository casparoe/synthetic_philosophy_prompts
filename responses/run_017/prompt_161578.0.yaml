prompt: |-
  After a long argument with a friend, I am trying to defend a version of al-Ghazālī's occasionalism against the objection that it cannot explain the reliability of ordinary causal sequences. My friend grants that God could directly cause burning whenever fire touches cotton, but insists that on the occasionalist picture the regularity is either brute or merely projected by us, so the view collapses into Humean constant conjunction plus an idle divine appendix. Please argue for the position that the occasionalist can instead treat God's customary order as a stable, content-specified policy for producing effects in the presence of their ordinary accompanying conditions, without attributing any irreducible causal power to the fire or cotton and without reducing the policy to a mere summary of observed constant conjunctions; the argument should explain how the policy's normative and teleological structure can do explanatory work that brute regularity cannot, and should address why this response is not simply a relabeling of the friend's objection.
reasoning: |-
  Okay, let me start by unpacking the user's problem. They're defending al-Ghazālī's occasionalism against the objection that it reduces to Humeanism with God added. Their friend argues that if God causes each event directly, the regularity in nature is either brute or projected by us, making divine involvement unnecessary. The user wants to show that God's "customary order" can be a stable policy with normative and teleological elements, avoiding brute regularity.

  First, I need to recall al-Ghazālī's framework. He rejects secondary causes; God directly causes all events. But the user emphasizes the "Sunna," God's habitual action. The challenge is to explain how this differs from Hume's constant conjunction. 

  The key points to address: how is God's policy not just a relabeling of regularity? How does it add explanatory value? The user mentioned normative and teleological structure. So, I should focus on intentionality and purpose. God's policy isn't just patterns—it's a deliberate choice with objectives, like human laws or habits, which have reasons behind them.

  I should compare brute regularity vs. intentional policy. Brute regularities lack reasons; they just are. But a policy has reasons, even if not always known. For example, traffic laws exist for safety, not just observed patterns. Similarly, God's consistency reflects wisdom and purpose, providing a basis for predictability and counterfactuals.

  Next, addressing the "idle divine appendix" charge. Humean regularities are descriptive summaries. God's policy is prescriptive—it governs what should happen. This normative aspect supports scientific inquiry; we assume nature is intelligible because God acts wisely. Also, teleology: the order serves purposes like human flourishing, which brute regularities can't explain.

  Why isn't this just relabeling? Because the policy is ontologically grounded in God's attributes, not derived from events. The regularity is a manifestation of divine wisdom, not the source. So, the explanation is top-down from God's nature, not bottom-up from observations.

  Potential counterarguments: If God can change the policy, why is it stable? Response: God's commitment to wisdom ensures reliability unless there's a greater purpose, like miracles. Also, how do we know God's intentions? While humans can't fully grasp divine wisdom, the policy's consistency allows science to function, trusting that patterns reflect intentional design.

  Finally, emphasize that this framework provides a foundation for laws of nature beyond mere patterns, incorporating purpose and reliability rooted in divine rationality. This addresses the friend's objection by showing God's role is active and explanatory, not redundant.
answer: |-
  Your friend raises a valid Humean concern, but al-Ghazālī's occasionalism, properly understood, offers a robust alternative grounded in divine *wisdom* and *intentionality*, not brute regularity. Here’s a defense that addresses the core objections:

  ### 1. **God’s "Customary Order" (Sunna) as a Stable, Teleological Policy**
     - **Beyond Brute Regularity**: God’s actions are not random conjunctions but stem from His eternal, wise will. The "customary order" is a **volitional policy**—akin to a sovereign establishing laws or an artisan following a design—not a passive pattern. For al-Ghazālī, this policy reflects God’s *ḥikma* (wisdom), meaning it is purposeful, intelligible, and oriented toward divine goals (e.g., human survival, cosmic order, moral testing).
     - **Content-Specificity**: The policy isn’t a blank "when X, then Y" but is **contextually rich**: God wills burning *specifically* when fire touches dry cotton *because* this sequence serves goods like human survival (cooking, warmth) or moral lessons (danger). The regularity is explained by the policy’s *telos*, not vice versa.

  ### 2. **Explanatory Advantages Over Brute Regularity**
     - **Normative Force**: 
       - **Brute regularity**: "Fire burns cotton" is a descriptive fact with no "should." Deviations (e.g., cotton failing to burn) are merely statistical anomalies.
       - **Divine policy**: The regularity has **normative weight**. Fire *ought* to burn cotton under standard conditions because God wills it as part of a wise order. Miracles (e.g., Abraham in the fire) are *exceptions* that confirm the rule by highlighting divine sovereignty and purpose—whereas in Humeanism, they are just rare events.
     - **Counterfactual Robustness**:
       - **Brute regularity**: "If fire touched cotton, it would burn" is an inductive guess, ungrounded in actual necessity.
       - **Divine policy**: Counterfactuals hold because God **sustains a consistent policy**. "If fire touched cotton, God *would* will burning" is true based on His immutable wisdom—even if He *could* will otherwise. This provides a foundation for scientific laws beyond observed frequencies.
     - **Teleological Depth**:
       - **Brute regularity**: No answer to *why* fire burns cotton—it just does.
       - **Divine policy**: The sequence serves purposes: fire burns to enable human industry, warn of danger, or reflect divine power. This **explains the regularity’s existence** and its reliability—God isn’t arbitrary but acts for reasons consistent with creation’s good.

  ### 3. **Why This Avoids "Relabeling" Humeanism**
     - **Grounding in Divine Attributes**: Humean regularities are *emergent* from particular events. In occasionalism, the policy is **prior and causative**: God’s wisdom *explains* the regularity. The policy isn’t "read off" events but is the *reason* events unfold as they do.  
     - **Non-Reductive Necessity**: While the burning isn’t *metaphysically* necessary (God can suspend it), it is **volitionally necessary**—God, being perfectly wise, does not capriciously alter policies without higher purpose. This necessity is stronger than Humean contingency but weaker than creaturely causation.  
     - **Agency Over Projection**: Your friend’s "projection" claim implies humans impose order. For al-Ghazālī, the order is **objectively real** as an expression of divine rationality. We *discover* God’s habits (via reason/revelation), we don’t invent them.

  ### 4. **Addressing the "Idle Divine Appendix" Objection**
     - **God as Active Sustainer**: God isn’t a "placeholder" for regularity but the **efficient cause** of every event. Fire doesn’t "trigger" God; God wills fire *and* burning simultaneously as a unified act. The policy is how God’s simplicity manifests in ordered creation.  
     - **Explanatory Work Done**:  
       - **Science**: The policy justifies why induction works—nature is uniform because God is consistent. Humeanism leaves this unjustified.  
       - **Miracles**: The policy explains how miracles are *meaningful* interruptions of divine habit (e.g., to reveal truth), not statistical flukes.  
       - **Theodicy**: Evil (e.g., destructive fire) is permitted within the policy for greater goods (e.g., moral growth)—a teleological answer unavailable to Humeanism.

  ### Conclusion: Occasionalism as a Robust Theistic Alternative
  Al-Ghazālī’s God is not a passive "Humean God" who underwrites brute facts. Instead, divine wisdom institutes a **stable, purposeful order** that *explains* regularity, grounds scientific inquiry, and provides metaphysical depth. The policy is irreducible to observed conjunctions because it is rooted in God’s eternal character—making divine action explanatorily vital, not redundant. Your friend’s objection conflates occasionalism with deism, but for al-Ghazālī, God’s continuous, intentional volition is the very fabric of causation.

  *This defense turns the tables: it’s the Humean who cannot explain regularity’s reliability, while the occasionalist anchors it in divine rationality.*
