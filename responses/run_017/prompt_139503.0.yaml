prompt: |-
  Write a specification for an account of causation by omission. I am not yet asking which account is true — I want the requirements list first, so I have something to hold the candidates to.

  Fix the purpose, so that adequacy has something to be relative to. The account is being bought to do three jobs at once: (i) to underwrite singular causal explanations in ordinary and specialist discourse, of both the agential sort (the nurse did not administer the anticoagulant; the driver did not brake) and the non-agential sort (the rains did not come; the firewall was never installed; the backup generator did not engage); (ii) to underwrite the causal-attribution step in legal and moral responsibility, where an omission is pinned on someone and treated as what they brought about; (iii) to plug into the variable-based causal models used in epidemiology, engineering failure analysis and accident investigation. An account that works for one of these and fails the others is not adequate for my purposes, and part of what I want from you is a view on whether that triple mandate is itself coherent, or whether jobs (ii) and (iii) pull in opposite directions — the lawyer wants the causation to track duties and expectations, the modeler wants it to be duty-free difference-making.

  The deliverable: a numbered list of requirements — the phenomena an account must explain, the cases it must get right, the distinctions it must respect, and the results or practices it must not contradict — each with the case or consideration that motivates it, stated tightly enough that I could use it as a checklist. For each requirement say whether it is non-negotiable or a preference of one camp, and why. Flag any subset of the requirements that cannot be jointly satisfied, and say which one you would weaken or drop and what that costs. Then name the single requirement that does the most work in excluding otherwise-attractive views, and defend that choice.

  Here are the materials I already think matter. Organize them, prune the ones you think are fake, and add what is missing:

  - Selection. Every non-actor is a difference-maker in the same formal way: had the Queen watered the plant, it would have lived, just as it would have had the gardener watered it. Only one of them gets cited. So the account owes a filter — and it owes a story about whether the filter is semantic, pragmatic, or normative. If it is pragmatic, say plainly whether that demotes the whole topic to a footnote about language use.
  - Agency-independence. The rains that did not come and the switch that was never thrown have to be handled by the same machinery as the nurse and the driver. Agency cannot be built in at ground level. But agent omissions dominate ordinary and legal practice; is that a fact about norms, or about the metaphysics?
  - Chain structure. Omissions must be able to sit at intermediate nodes: the supervisor never trained the guard, the guard never threw the switch, the backup never engaged, the patient died. Does causal strength attenuate as a chain alternates between action and omission? Can there be second-order omissions all the way down, and if not, where is the cutoff?
  - Preemption and overdetermination among omissions. Two guards asleep, neither of whom would have raised the alarm had the other stirred; and the variant where one of the two had a duty to act and the other did not. Both guards, one guard, or neither?
  - Grain and location. The plant died because she did not water it — or because she did not water it on Tuesday, or because she did not water the fern. And where is the omission located: at the plant, at the gardener, or nowhere? An account that wants to mesh with anything spatiotemporal has to answer.
  - Timing. A season-long failure to irrigate versus an instant failure to brake. When does the causal work happen — at the last moment at which acting would still have made a difference, or spread across the whole interval?
  - The intervention asymmetry. On an interventionist treatment one can test what would have happened had the agent acted, but there is no intervention that sets a variable to the omissive value it already has: the counterfactual runs in one direction only. Is that a defect of interventionism, a feature, or a reason to deny that omissions are causes strictly speaking?
  - The deflation worry. "Her failure to feed the child caused the death" and "had she fed the child, he would not have died" seem to have no distinct observable consequences. If the account cannot say what would settle the difference between them, is the stronger claim contentful?
  - Univocality versus mechanism. Does "caused" mean the same thing in "the brake failure caused the crash" and "the failure to brake caused the crash," given that the second has no connecting process, no conserved quantity, no transmission? Which of these two demands is a genuine desideratum and which is a prejudice of one camp?
  - Ontology. Are there negative events, or only positive events plus facts and absences? The account must say what makes "the failure to feed the child caused her death" true if nothing in the world corresponds to the failure — and whether that makes the failure a cause, or merely the correct answer to a why-question.
  - Doing/allowing, and blame. The account must not collapse causation by omission into allowing, or into blameworthiness, but it must explain the very tight correlation between them.
  - Norm-sensitivity. People are far more willing to cite an omission where there was a duty, a rule, or a statistical default. Must the account build that sensitivity into causation itself, or may it hand the work to a separate theory of responsibility and conversational relevance?
  - Defaults. The alarm did not sound gets cited; the Sun did not explode does not. Is the background default causal, statistical, or normative — and who or what sets it?
  - Contrast-hunger. "The plant died because you did not water it" is fine until one asks "rather than what?" Omissions look peculiarly dependent on an implicit contrast. Is that special to omissions, or general to causal selection?
  - The fundamental-physics worry. Causal claims in fundamental physics seem never to cite omissions. Must an account secure a place for them there, or only in the special sciences and ordinary life?
  - Empirical constraint. There is a developmental and experimental literature on when people will and will not attribute causation to an omission. What, if anything, does a metaphysical account owe to it? I expect you to mark this one as negotiable if you think it is.

  Two things I especially want. First: I suspect the real fault line is between a requirement that causation be objective and interest-independent and a requirement that the selection among omissions track norms, duties, or defaults — set out that conflict as cleanly as you can, and say which side you would give up. Second: tell me whether, once a decent filter is in place, there is anything left that is distinctive about omissions, or whether "the problem of omissions" dissolves into the general problem of causal selection and was never a separate problem at all.

  If the usual taxonomy — act versus omission, prevention versus double prevention, event versus fact versus absence — is missing a distinction your spec needs, draw it, name it, and say what case forces it.

  Finish with a short scorecard, three rows only: counterfactual or difference-making accounts; process, mechanism, or conserved-quantity accounts; and views on which omission claims are perfectly true but not causal at all. Keep the weight on the criteria rather than on the scoring.
reasoning: |-
  Okay, the user wants a specification for an account of causation by omission. Let me start by understanding their main goals. They need the account to handle three jobs: underwriting causal explanations in everyday and specialist contexts, supporting legal and moral responsibility attributions, and fitting into variable-based causal models. The challenge is ensuring the account works for all three without conflicts. 

  First, I need to organize their materials into a structured list of requirements. They mentioned points like selection, agency-independence, chain structure, preemption, grain, timing, intervention asymmetry, deflation, univocality, ontology, doing/allowing, norm-sensitivity, defaults, contrast-hunger, fundamental physics, and empirical constraints. I should categorize these under must-haves or preferences, flag conflicts, and identify the most critical requirement that filters out competing theories.

  The user is concerned about the tension between objectivity and norm-sensitivity. Legal and moral contexts rely on duties, while scientific models need duty-free difference-making. This conflict is central. I need to address whether building norm-sensitivity into causation is necessary or if it can be handled separately. Also, they want to know if the problem of omissions is just a subset of causal selection.

  Looking at their materials, some points might overlap or need pruning. For example, the deflation worry might be more about semantics than metaphysics. The fundamental-physics worry could be negotiable since omissions might not apply there. The empirical constraint should be marked as negotiable because experimental data informs but doesn't dictate metaphysics.

  I need to add distinctions they might have missed, like the dual role of norms in selection and ontology. Also, differentiate between enabling conditions and omissions, as both involve absences but omissions have normative elements. The user’s mention of variable-based models requires clarity on how interventions handle omissions' unidirectionality.

  The key conflict is between objectivity and norm-sensitivity. I'll recommend giving up strict objectivity for the causal relation itself, allowing norms to influence causal selection. This keeps the metaphysics duty-free but explains why norms affect what we cite as causes. 

  For the scorecard, counterfactual accounts handle difference-making well but struggle with preemption and norm-sensitivity. Process theories fail on univocality and chain structure. Non-causal views might handle explanations but miss the causal attribution needed for responsibility.

  Finally, assess if omissions dissolve into general causal selection. While similar, omissions involve absences and normativity, making them distinct enough to warrant special consideration. The triple mandate is coherent if the account separates causal relation from selection, using norms for the latter.
answer: |-
  Here is a specification for an account of causation by omission, designed to meet your triple mandate. Requirements are categorized, conflicts flagged, and critical exclusions identified.  

  ### Core Requirements (Non-Negotiable)  
  1.  **Scope Universality**: The account must handle *both* agential omissions (nurse didn't administer anticoagulant) and non-agential omissions (rains didn't come, firewall wasn’t installed) symmetrically. *Motivation*: Your mandate (i) and (ii) demand unity; agency cannot be primitive.  
  2.  **Difference-Making Fidelity**: Must validate that omissions are causes iff they are difference-makers (i.e., had the omission not occurred, the outcome would likely not have occurred, holding other factors fixed). *Motivation*: Required for (iii) to integrate with variable-based models (e.g., structural equations in epidemiology).  
  3.  **Normative Neutrality at Base**: Causation itself must be objective and duty-free; norms/duties may *select* which omissions are salient but cannot *constitute* causation. *Motivation*: (iii) demands duty-free difference-making; (ii) can layer norms post-causation.  
  4.  **Chain Compatibility**: Must permit omissions in causal chains (e.g., supervisor didn’t train → guard didn’t throw switch → backup didn’t engage → death). Attenuation of causal strength must be explicable. *Motivation*: Real-world cases (e.g., engineering failures) involve multi-step omissions.  
  5.  **Preemption Resolution**: Must resolve cases of preempted/overdetermined omissions (e.g., two negligent guards, neither of whom would have acted if the other did). *Motivation*: Legal responsibility (ii) requires attributing causation in overdetermination scenarios.  
  6.  **Intervention Compatibility**: Must explain the asymmetry of testing omissions (we intervene to *make* an action happen, not to *preserve* an omission). *Motivation*: Integration with interventionist causal models (iii) cannot treat omissions as "interventions."  
  7.  **Univocality Constraint**: "Cause" must mean the same thing in "brake failure caused crash" (positive event) and "failure to brake caused crash" (omission). *Motivation*: Avoiding ad hoc metaphysics; mandates a unified causal ontology.  

  ### Contextual Requirements (Negotiable but High-Priority)  
  8.  **Selection Mechanism**: Must provide a filter for *which* omissions are cited (e.g., Queen vs. gardener case), distinguishing causal relation from causal attribution. *Motivation*: Ubiquity of selective citation in (i), (ii), and (iii). *Status*: Pragmatic/normative filters are acceptable, but causation itself must be objective.  
  9.  **Grain and Location**: Must specify the spatiotemporal "location" of an omission (e.g., failure to water on Tuesday vs. generally) and whether it supervenes on positive events. *Motivation*: Legal liability (ii) and engineering models (iii) require precision.  
  10. **Contrast Sensitivity**: Must explain why omissions demand implicit contrasts ("didn’t water *rather than...*"). *Motivation*: Explanatory practices in (i) and (ii) rely on contrasts.  
  11. **Empirical Plausibility**: Should align with developmental/experimental data on omission attribution (e.g., people cite omissions more readily when norms are violated). *Motivation*: Desirable for descriptive adequacy, but not constitutive. *Status*: Negotiable; metaphysics need not mirror folk intuitions.  

  ### Requirements to Prune or Weaken  
  - **Deflation Worry** (pruned): If "A’s omission caused B" is equivalent to "had A acted, B might not have occurred," the account need not invent extra ontology. *Reason*: Demanding distinct observable consequences misplaces the burden; causation is often counterfactually defined.  
  - **Fundamental Physics** (pruned): Need not apply to physics. *Reason*: Omissions are macroscopic, normative, or contrastive phenomena; no evidence they operate at quantum/relativistic levels.  
  - **Ontology of Absences** (weakened): Need not reify "negative events"; omissions can be facts or counterfactual dependencies. *Reason*: Univocality (Requirement 7) is satisfied by fact-based or counterfactual accounts without ontological inflation.  

  ---

  ### Conflicts and Tradeoffs  
  - **Core Conflict**: **Normative Neutrality (3)** vs. **Selection Mechanism (8)**.  
    - *Conflict*: (ii) requires norms to *drive* attribution (e.g., only the nurse with a duty "caused" the death), but (iii) requires causation to be norm-free.  
    - *Resolution*: Sacrifice **norms as constitutive of causation**. Adopt a two-tiered view: causation is difference-making (objective), while norms filter *which* causes are relevant for responsibility. *Cost*: Lawyers (ii) must accept that causation ≠ responsibility; norms attach post hoc.  
  - **Secondary Conflict**: **Univocality (7)** vs. **Process-Based Intuitions** (e.g., transmission, energy flow).  
    - *Resolution*: Drop univocality *only if* process accounts can satisfy Scope Universality (1) and Chain Compatibility (4). But they cannot (see Scorecard). Univocality stands.  

  ---

  ### The Key Excluding Requirement  
  **Normative Neutrality at Base (3)** excludes otherwise-attractive views:  
  - *Why it’s critical*: It directly addresses the lawyer/modeler tension. Views that build norms/duties into causation (e.g., "only failures of duty cause") fail (iii): epidemiology models don’t care if a cloud "should have" rained.  
  - *Excluded views*: Normative primitivism (e.g., Moore), some agential accounts (Schaffer).  
  - *Defense*: (iii) is non-negotiable; variable-based models require causation to be reducible to dependency relations. Norms are explanatory filters, not causal relations.  

  ---

  ### Added Distinction: Norms vs. Defaults  
  - **Distinction**: **Statistical Defaults** (what’s probable) vs. **Normative Defaults** (what’s obligated).  
  - *Case*: Two asleep guards — one paid to watch (normative duty), the other statistically likely to wake (habitual). Legal practice (ii) cares only about the first; models (iii) might include both.  
  - *Need*: Clarifies why norm-based selection (Requirement 8) doesn’t infect causation itself.  

  ---

  ### Dissolution of "The Problem"?  
  Once **Requirement 8 (Selection Mechanism)** is satisfied, the "problem of omissions" reduces to **causal selection under contrastive constraints**. Omissions are distinctive only in:  
  1. Their dependence on **explicit or statistical contrasts** (Requirement 10).  
  2. Their **intervention asymmetry** (Requirement 6).  
  But neither requires separate metaphysics.  

  ---

  ### Scorecard (Against Core Requirements)  
  | **Account Type**               | **Fails Core Requirements**                                  | **Strengths**                          |  
  |--------------------------------|-------------------------------------------------------------|----------------------------------------|  
  | **Counterfactual/Difference**  | Preemption (5) if symmetric; Contrast (10) if underspecified | Universality (1), Fidelity (2), Chains (4), Intervention (6) |  
  | **Process/Mechanism**          | Univocality (7), Chains (4: no process for omissions), Scope (1: non-agential omissions) | Grain/Location (9)                   |  
  | **Non-Causal (Explanatory)**   | Univocality (7), Fidelity (2) — rejects omissions *as causes* | Selection (8), Contrast (10)         |  

  **Key**: Counterfactual accounts struggle with preemption and contrast; process accounts fail univocality; non-causal views reject causation outright. **Requirement 3 (Normative Neutrality)** is pivotal for the triple mandate.
