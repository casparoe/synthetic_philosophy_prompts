  To address this, I need to translate each philosophical claim into CEA terms clearly. For equal consideration, it would mean including animals in the health gain calculation, perhaps assigning them DALYs or similar. The argument from marginal cases highlights inconsistencies in excluding animals when similarly impaired humans are included. Speciesism as irrelevant like race/sex would require equity weights for species, but that's not standard.

  The residue report should identify distortions. For example, equal consideration might be reduced to weighting, ignoring intrinsic moral standing. The marginal cases argument exposes a boundary problem CEA can't resolve internally. Speciesism's irrelevance challenges the human-only scope fundamentally.

  In the badger example, using human WTP to represent animal harm is a distortion—it makes animal suffering contingent on human preferences. Some philosophical claims, like inherent moral status independent of humans, simply have no place in CEA.

