prompt: |-
  I'm on a volunteer panel for our city council that divides up a fixed pot of money and a fixed amount of wall space between memorial projects — this year it's a Holocaust education programme, a plaque about the slave trade, something for a colonial famine, and a request from a community whose grandparents were killed in a massacre in the 1940s that almost nobody round here has heard of. I've sat through about a dozen of these meetings now and I can't work out what we collectively believe. Two things keep happening.

  The first: we say, all the time, that we aren't in the business of ranking sufferings, and when a local journalist asked whether one of these was worse than another we shut the question down as obsenely tasteless. But the money actually gets allocated by a per-victim sort of formula — so much per name on the wall, travel costs for survivors scaled to how many, a small fund that pays out per head. That's a cardinal, roughly linear-in-deaths scale of badness, which is a stronger commitment than just saying A was worse than B. We also once floated splitting everything equally four ways and that got the angriest reaction of the whole meeting, which suggests the equal split gets heard as a verdict too, just a different one.

  The second thing is the one I keep going round on and that I've never seen discussed anywhere. The taboo gets stronger the closer the two cases are. Nobody minds us saying that a famine was worse than a bar fight, or that the twentieth century was worse than the eighteenth. The fury is reserved for comparisons between two things that are properly similar — two genocides, two famines. But if the objection were epistemic, if it were that we can't get a grip on these things well enough to compare them, you'd expect exactly the opposite pattern: near cases are where comparison is easiest and most reliable. So the obscenity charge doesn't look like it's tracking difficulty at all. What is it tracking?

  There's a related thing from the news, which may or may not belong in the same box: criminal sentences don't seem to scale with the number of victims anything like the way our budget does, and blame seems to run per-perpetrator rather than per-victim. If that's right then we've got two bits of public practice, money and punishment, doing the arithmetic completely differently.

  So: reconstruct the theory of comparative badness that our committee's practice only makes sense under. Which parts of it are load-bearing and which are just what people happen to say? Could a straightforwardly aggregative view, an incommensurability view, or some expressivist view about what comparing does licence the the same behaviour — i.e. is the practice underdetermined? And what would we actually have to start doing differently under each of those? I'm after the argument rather than a bibliography, and I definately want to know where my own framing is the confused bit.
reasoning: |-
  Okay, let's start by unpacking the user's problem. They're on a volunteer panel allocating money and wall space for memorial projects. There's a tension between what they say—refusing to rank sufferings—and what they do—allocating resources per victim. The user notices two main issues: the committee uses a per-victim formula despite claiming not to rank sufferings, and the taboo against comparing similar events is stronger than for dissimilar ones. They also mention criminal sentences not scaling per victim, unlike their budget.

  First, I need to figure out the underlying theory that explains these practices. The user wants a coherent framework that makes sense of their actions versus their statements. They’re also curious if other theories (aggregative, incommensurability, expressivist) could fit and what changes each would require.

  The key points are the per-victim allocation conflicting with the stated refusal to rank, and the taboo’s intensity depending on similarity. The criminal justice comparison adds another layer. The user might be seeking validation that their committee's approach isn't hypocritical but follows an implicit logic. They might also want practical advice on navigating these tensions without causing outrage.

  Next, analyzing the taboo. Why is comparing similar events more offensive? The user notes that epistemically, similar cases should be easier to compare. The emotional charge suggests it's about identity and moral proximity. When events are similar, the comparison feels like an existential threat to each group's unique suffering. For dissimilar events, the differences in kind make comparison less threatening. This isn't about difficulty but about perceived moral threat.

  Then, the per-victim allocation seems like a practical necessity. Distributing resources requires a measurable metric, and the number of victims is tangible. But publicly, they avoid ranking to respect each tragedy's uniqueness. The equal split rejection indicates that equality is seen as equating, which undermines individual significance. So the committee uses a formula that acknowledges scale without explicitly judging moral weight.

  The criminal justice contrast is important. Punishment focuses on perpetrator culpability, not victim count. This highlights that different contexts have different moral logics. Memorials are about victim recognition, justice is about blame. The user needs to see that these aren't inconsistent but context-dependent.

  Now, evaluating theories. Aggregative (utilitarian) would strictly scale with numbers, but the committee avoids explicit rankings, so it's partially applied but not fully. Incommensurability says sufferings can't be compared, yet they use numbers, so that doesn't fit alone. Expressivist views focus on the act of comparing as harmful, which explains the taboo but not the allocation. The implicit theory combines elements: practical aggregation for allocation, public incommensurability to avoid offense, and expressivist understanding of taboos.

  The user's framing might confuse the descriptive (what they do) with the normative (what they should do). The committee’s practice is a pragmatic compromise. To change, they’d need to either fully embrace aggregation (which risks backlash) or commit to incommensurability (making allocation arbitrary). The current hybrid approach, while messy, works for their context.

  Potential deeper needs: The user might feel conflicted about their role, seeking justification for the committee's methods or ways to improve transparency. They might want to reduce internal conflict or public criticism. Understanding the implicit theory could help them communicate their process better, perhaps explaining the per-victim formula as administrative rather than moral.

  In conclusion, the committee’s practice relies on separating operational metrics from public deference to uniqueness. The taboo’s strength for similar cases stems from identity threats. Acknowledging this duality might help the user navigate meetings more effectively, clarifying that the formula is a practical tool, not a moral statement.
answer: |-
  Your committee's practice reveals a sophisticated, albeit unspoken, **hybrid moral framework** that combines *pragmatic aggregation* with *public deference to incommensurability*, governed by **contextual moral proximity**. Here's the reconstructed theory:

  ### The Core Theory: Contextual Moral Proximity & Segmented Valuation
  1.  **The Cardinal Scale (Aggregation) is a Practical Tool, Not a Moral Statement:**
      *   **Why it exists:** Dividing finite resources *requires* a measurable metric. Victim count is:
          *   **Objective:** Less disputable than "intensity of suffering" or "historical significance."
          *   **Administrative:** Simplifies budgeting, wall-space allocation, travel logistics.
          *   **Perceived as "Fair" Procedurally:** It feels like an impartial formula, avoiding subjective bias accusations ("We just counted names").
      *   **Why it's not *called* ranking:** The committee intuitively understands that *operational necessity* ≠ *moral equivalence*. Using numbers for logistics isn't the same as declaring "Each victim of X suffered exactly as much as each victim of Y." It's a concession to practicality, not a philosophical stance on suffering's essence.

  2.  **The Taboo Tracks Moral Proximity & Identity Threat:**
      *   **The Pattern Explained:** The outrage isn't about *epistemic difficulty* but **perceived moral equivalence/implication**. Comparing vastly different events (famine vs. bar fight) is unproblematic because:
          *   **No Equivalence Threat:** Acknowledging the Holocaust was "worse" than a bar fight doesn't diminish the Holocaust; it highlights its unique scale/horror. The difference in *kind* is so vast, comparison doesn't imply moral parity.
      *   **Why Similar Cases Trigger Fury:**
          *   **Existential Threat to Uniqueness:** Comparing two genocides risks implying they are "the same kind of thing," potentially erasing the specific historical context, intent, and unique suffering of each victim group. For communities whose identity is tied to memorializing *their specific* trauma, this feels like an annihilation of their distinct experience.
          *   **Implicit Hierarchy & Zero-Sum Recognition:** Saying Genocide A was "worse" than Genocide B is heard as "Victims of A deserve *more* recognition/sympathy/resources than victims of B." In a context of competing for memorial resources, this feels like a direct attack on the legitimacy or value of B's remembrance. The closer the cases, the higher the stakes in perceived standing.
          *   **The "Moral Danger Zone":** Similar events exist in a zone where comparison feels *possible* but morally *forbidden* precisely because the differences are nuanced (intent, duration, aftermath, contemporary resonance). Assigning a rank feels reductive and disrespectful of that nuance. It's not that we *can't* know the facts; it's that translating those facts into a singular "worse/better" judgment is seen as inherently violating the complexity and sanctity of each event.

  3.  **Rejection of Equal Split: The Uniqueness Imperative**
      *   Splitting equally was rejected because it **violates the core principle of recognizing unique historical specificity**. Equal division implies:
          *   **Moral Equivalence:** It suggests each tragedy has the *same* moral weight or claim, regardless of scale, nature, or community need. This is anathema to groups seeking acknowledgment of their *distinct* suffering.
          *   **Procedural Indifference:** It appears lazy, ignoring the specific contours of each event and the differing scales of victimization. The per-victim formula, while also procedural, at least *acknowledges* the difference in scale, even if imperfectly.

  4.  **Criminal Sentencing Contrast: Perpetrator-Centric vs. Victim-Centric Logic**
      *   Your observation is astute. Criminal law focuses on **individual culpability and blameworthiness**.
          *   **Per-Perpetrator:** Punishment scales with the offender's intent, actions, and moral agency. Killing 100 people shows greater culpability than killing one, but the *core unit* is the perpetrator's deed.
          *   **Victim Count as Aggravator, Not Multiplier:** More victims *increase* the severity of the *offense* committed by the perpetrator(s), but the sentence isn't mechanically "per victim." The harm is evidence of the magnitude of the *wrongdoing*, not the sole determinant. The focus is on condemning the *act* and the *actor*.
      *   **Memorial Allocation: Recognition-Centric Logic.** Here, the focus is on **acknowledging harm done to victims and communities**.
          *   **Per-Victim:** The core aim is recognition and remembrance. More victims generally necessitate more resources for meaningful acknowledgment (wall space, names, survivor participation). The harm *to the victims* is central. It's about the *scale of loss experienced*, not primarily about assigning proportional blame to historical actors (though that context matters).
      *   **Different Purposes, Different Math:** Punishment aims for retribution/justice against perpetrators; memorials aim for recognition/healing for victims/communities. One focuses on the *source* of harm (perpetrator), the other on the *impact* of harm (victims).

  **Is the Practice Underdetermined? Testing Theories Against Your Practice:**

  *   **Straight Aggregative Utilitarianism:** Would demand explicit ranking based on total disutility ("worst first"). Your practice *uses* aggregation administratively but *rejects* its core moral ranking implication publicly. **It wouldn't license the taboo.**
  *   **Strict Incommensurability:** Would forbid *any* comparative allocation formula. The per-victim approach would be incoherent. Equal split might be the only option, which you've seen rejected. **It wouldn't license the formula.**
  *   **Pure Expressivism (Comparing is the Wrong Speech Act):** Explains the taboo well – comparing similar atrocities expresses disrespect or implies equivalence. But it struggles to explain why the *administrative* use of numbers is acceptable or why dissimilar comparisons aren't equally taboo. It also doesn't ground the resource allocation logic itself.
  *   **Your Implicit Hybrid Theory (The Winner):**
      *   **Licenses the Formula:** As a *practical, procedural necessity* for resource distribution, focused on *recognition of victims*, using the most objective available proxy (count).
      *   **Licenses the Taboo:** Comparing similar events is forbidden because it violates the *expressivist norm* against implying moral equivalence/reduction and threatens the *unique historical identity* of each event/community.
      *   **Licenses the Dissimilar Comparison Tolerance:** Vastly different events pose no equivalence threat; acknowledging difference reinforces uniqueness.
      *   **Licenses Rejecting Equal Split:** Equal split violates uniqueness and feels like a refusal to engage with the specific scale/meaning of each event.

  **Your Framing: Sharp, But Over-Intellectualizing the Practice**

  Your confusion stems from expecting the committee's *stated principles* ("no ranking sufferings") to perfectly align with their *operational practice* (per-victim formula) and *emotional reactions* (taboo strength). You're looking for a single, coherent moral theory. The reality is messier:

  1.  **"No Ranking Sufferings" is a Moral Aspiration, Not an Operational Guide.** It expresses a commitment to respecting the uniqueness and incomparable horror of each event *on a deep moral level*. It doesn't mean they believe resource allocation *can* or *should* ignore scale in a practical world.
  2.  **The Formula is a Bureaucratic Compromise.** It's chosen because it's the least bad, most defensible *administrative* tool for an impossible task, not because it perfectly reflects a philosophical truth about suffering. They likely feel *uncomfortable* with its implications but see no better alternative.
  3.  **The Taboo is Emotional/Social, Not Epistemic.** You correctly identified the epistemic puzzle. The answer is that the taboo isn't driven by *how hard it is to know*, but by *what the act of comparing means socially and emotionally* to the affected communities and the committee's sense of moral decorum. It's about offense, not ignorance.
  4.  **The Practice is Load-Bearing:** The **operational formula (per-victim)** and the **public deference to uniqueness/incommensurability** (manifest as the taboo and rejection of equal split) are both essential. The **distinction between practical allocation and deep moral judgment** is crucial. The **sensitivity to moral proximity** (similarity causing outrage) governs the taboo's application.

  **What Would Change Under Different Theories?**

  *   **Embrace Aggregation Fully:** Explicitly rank events by scale/horror. Allocate strictly proportionally. Abandon the "no ranking" principle. Expect constant, profound outrage from groups deemed "less bad."
  *   **Embrace Incommensurability Fully:** Abandon the formula. Use lottery, equal split, or rotate years for major funding. Explain it as respecting fundamental uniqueness. Expect anger over perceived disregard for scale of suffering/victim numbers ("Why does the bar fight get the same as the genocide?").
  *   **Embrace Expressivism Fully:** Focus intensely on *how* decisions are communicated. Avoid *any* language or formula implying comparison. Develop highly contextual justifications for each allocation, emphasizing specific needs rather than relative standing. The administrative burden increases massively. The core tension remains but is masked by language.

  **Conclusion: Navigating the Hybrid**

  Your committee's practice makes sense under a theory that **pragmatically aggregates for administrative necessity while fiercely guarding against any public implication of moral equivalence, especially between events perceived as morally proximate.** The per-victim formula is a reluctant tool for a practical job. The taboo against comparing similar sufferings is a protective mechanism for the perceived uniqueness and sanctity of each traumatic history. The rejection of equal split reinforces that uniqueness cannot be administratively erased. The contrast with criminal law highlights that memorialization is fundamentally about recognizing victimhood and loss, not assigning proportional blame.

  **Your path forward isn't finding a perfect theory, but managing the inherent tension:** Be transparent that the formula is a *practical metric for resource constraints*, not a *moral calculus of suffering*. Frame allocations in terms of the *specific needs* of *this project* (e.g., "This requires X linear feet to list names," "This requires travel for Y survivors who are geographically dispersed") rather than implying a comparison. Acknowledge the uniqueness of each event explicitly during discussions. Understand that the anger at comparing similar events stems from a deep need for distinct recognition, not faulty logic. Your practice *is* the theory in action – a messy, human compromise between the impossible ideal of pure reverence and the practical need to divide a pot of money.
