prompt: |-
  I'm a PhD student in philosophy (my own work is on promising and the norms of speech acts, which is uncomfortably close to this material) and this term I've been given the marking for the first-year module on ethical theory — my first time with a pile of scripts, and I'm conscious that I may just be rewarding fluency. So I'd like a second reader, and I'd rather you read this one cold: there are a couple of passages where I genuinely cannot tell whether I'm looking at a real mistake or at compressed writing, and I don't want to say which they are in case it anchors you. My own work being what it is, I'm more likely to be too hard on it than too soft.

  The question was set by the module convener, and the script below is transcribed verbatim. Please mark it out of 30 against the question as set — not against the question you'd have set — and give me the point-by-point comments I'd need to defend the mark to a student: which claims are right and should earn credit, which specific move fails and why it fails, and what a first-class answer would have had to do that this one doesn't. Where a claim is defensible but under-argued, say so and say what it should still be worth. The scheme is 10 marks for part (a) (statement of the distinction, application to the case) and 20 for part (b) (engagement with the objection, treatment of the two required kinds of case, coherence of the positive account); a first is 21+, a high 2:1 is 18–20. Don't manufacture faults, and don't soften the ones you find.

  **Question 4 (30 marks)**

  *(a)* Distinguish lying from misleading, and apply your distinction to the following case. Jennifer is a candidate for a lectureship. Her doctoral referee knows that a chapter of her thesis was plagiarised, and writes a letter that is literally true in every sentence but says nothing about her research integrity and praises her 'breadth of engagement with the literature'. The search committee, reading it, concludes that there is no question mark over her work. The referee foresees this and writes the letter partly so that they should conclude it. Is the referee lying, misleading, or neither? (10 marks)

  *(b)* 'Since the liar and the misleader alike aim at their audience's holding a false belief, and since the audience ends up with the very same false belief either way, the difference between them is at most a matter of etiquette.' Discuss. Your answer should consider (i) a case in which the audience has no right to the truth, and (ii) a case in which the attempted deception fails. (20 marks)

  **Student's answer**

  Lying and misleading are both ways of getting someone to believe something false, but they do it by different routes, and the difference in route is where the moral difference lies.

  To lie is to assert something one believes to be false, presenting it as true. Assertion is the key notion: a lie is a false assertion, and it is the assertion, and not merely the falsity, that makes it a lie. To mislead is to bring it about that someone has a false belief without asserting anything false — by implicating, by withholding, or by arranging what they see. The referee's letter is a clear case of misleading and not of lying. Every sentence of it is true; the committee's belief that there is no question over Jennifer's research integrity is not something the referee says but something the committee infers from her silence on the matter. Since what is said and what is implicated are disjoint features of an utterance, and since lies are located entirely in what is said while misleading is located entirely in what is implicated, no utterance can be both a lie and an act of misleading — which is why we can say flatly that the referee does not lie. It follows too that there is nothing in the letter that the referee disbelieves, and hence no insincerity in it: she means every word she writes. (I set aside bald-faced lies, where the speaker is not believed anyway; nothing here turns on them.)

  The objection in (b) — that both the liar and the misleader aim at the same outcome and therefore differ only in style — gets one thing right and one thing wrong. It is right that the intended outcome is the same false belief. It is wrong to infer that the difference is merely presentational. Assertion is a practice constituted by a norm of truthfulness: to assert is to give one's word, to invite the hearer to take the content on one's authority. The liar invokes that authority and abuses it; the misleader leaves the practice intact but free-rides on the hearer's own inferential habits. This is why the difference in norm matters morally. Lying violates a directed duty — the hearer's claim-right not to be lied to — whereas misleading violates only the general duty not to deceive people. So the difference is not etiquette but a difference in which norm one breaches and in whom one wrongs. I would concede only that the difference in overall wrongness can be small: where the stakes are the same and the deception equally effective, the misleader is not obviously a much better person than the liar.

  Two cases bear this out. First, an audience with no right to the truth. The murderer at the door has forfeited his claim on the truth by his murderous intention, so misleading him is permissible: I may tell him that I last saw my friend at the station, knowing that he will draw the wrong conclusion. Lying to him is another matter. The duty not to assert what one disbelieves is not derived from what any particular hearer deserves or can claim, so it does not lapse merely because the hearer has forfeited his rights; I may not say that my friend is not here. This confirms that the two wrongs have different sources. Second, a deception that fails. If my hearer sees straight through me, I have still asserted what I disbelieved and meant it to be taken as true, so I have still lied, even though no false belief results. That shows the wrong of lying is not exhausted by its effects — which is what we should expect if the wrong consists in the abuse of a practice rather than in the production of a false belief.

  None of this makes misleading a free pass. Where the audience does have a right to the information — a patient deciding whether to consent, a committee deciding whether to appoint — withholding can be as wrong as a lie would be, because the general duty not to deceive is itself stringent when the stakes are high. The referee's letter is not, I think, permissible. But its wrongness is the wrongness of evasion rather than of lying, and the difference is worth marking even when both routes are closed.
reasoning: |-
  Hmm, I need to evaluate this philosophy essay as a teaching assistant would. The student is answering a question about lying versus misleading in ethics. Let me break this down carefully.

  First, for part (a): The student correctly defines lying as asserting something believed false, and misleading as causing false belief without false assertion. The application to the plagiarism reference case is spot-on - they show how the referee misleads through truthful statements and strategic silence rather than lying. The point about implicature being distinct from assertion is well-made. I'd give full marks here (10/10) since they nail both the distinction and its application.

  Now part (b) is more complex. The student handles the core objection well by arguing that lying abuses the assertion practice's norm of truthfulness, while misleading exploits inferential habits. This is philosophically sophisticated. Their treatment of the two required cases is strong: 
  - For the murderer-at-door scenario, they correctly note that misleading may be permissible when rights are forfeited, but lying remains problematic due to the nature of assertion itself. 
  - For failed deception, they insightfully observe that lying is wrong regardless of outcome because it violates the practice's norms.

  Some weaknesses though: 
  The claim that "no utterance can be both lie and misleading" is potentially problematic (they might mean they're mutually exclusive in the assertion/implicature dimension, but phrasing is too absolute). 
  The "directed duty vs general duty" distinction needs more support - it's asserted rather than argued. 
  The plagiarism case conclusion feels tacked on without connecting to the theoretical framework.

  Still, this is clearly first-class work. The arguments are coherent, they engage deeply with the objection, and show philosophical nuance (like acknowledging that misleading isn't automatically permissible). I'd award 17/20 for part (b) - deducting 1 for the absolute claim, 1 for underdeveloped duty distinction, and 1 for weak plagiarism case integration. Total 27/30 - solid first.

  For defense: I'd praise the precise distinction-drawing, strong case analyses, and recognition that norm-violation matters beyond consequences. Criticism would focus on needing more support for the duty claim and moderating the mutual exclusivity point. A perfect answer might reference Austin or Grice more explicitly and tighten those arguments.
answer: |-
  ## Mark: 27/30 (First Class)
  *   **(a): 10/10** (Excellent)
  *   **(b): 17/20** (Strong First-Class)

  **Overall:** This is an exceptionally strong script. The student demonstrates a clear grasp of the core distinction, applies it accurately, engages deeply and philosophically with the objection, handles the required cases well, and builds a coherent positive account. The writing is precise and philosophically sophisticated. Minor deductions in (b) stem from one slightly overreaching claim and slightly underdeveloped points.

  ---

  **Part (a) Distinction & Application (10/10 - Excellent)**

  1.  **Definition of Lying (Credit Earned):** Correctly identifies lying as asserting something one believes to be false. Highlights the centrality of assertion and insincerity. (Full Credit)
  2.  **Definition of Misleading (Credit Earned):** Correctly identifies misleading as causing a false belief without asserting something false, citing key methods (implicature, withholding, arranging evidence). (Full Credit)
  3.  **Application to Case - Not Lying (Credit Earned):** Correctly concludes the referee is not lying because every sentence is true. Accurately identifies the source of the false belief as the committee's inference from silence/praise, not a false assertion. Notes the referee's belief in the truth of what is written (sincerity). (Full Credit)
  4.  **Application to Case - Misleading (Credit Earned):** Correctly concludes the referee is misleading. Accurately identifies the mechanism: implicature (or more precisely, misleading implicature generated by the *absence* of expected information combined with the praise) and withholding. Recognizes the referee's foresight and intent. (Full Credit)
  5.  **Stronger Claim - Disjointness (Credit Earned *but qualified*):** The claim that "lies are located entirely in what is said while misleading is located entirely in what is implicated" and thus "no utterance can be both" is *defensible* within a specific Gricean framework focusing on conventional/content-based lying vs. implicature-based misleading. The application works here. (Full Credit - it's a compressed but acceptable articulation of a common view for this level).
      *   *Note for Defense:* While the strong "disjoint" claim can be debated (e.g., can an utterance contain both a false assertion *and* a misleading implicature?), it doesn't harm the core application in this case. The student correctly identifies the *source* of the deception here as implicature/withholding, not assertion.

  **Part (b) Discussion (17/20 - Strong First-Class)**

  6.  **Engagement with Objection (Credit Earned):** Directly addresses the core objection: same aim (false belief), same outcome (if successful). Concedes the sameness of aim/outcome but rejects the conclusion that the difference is merely stylistic/etiquette. (Full Credit)
  7.  **Core Distinction - Norms & Practice (Credit Earned):** Provides the crucial counter: the *means* differ morally because they involve different norms/practices. Clearly states the key difference: Lying abuses the constitutive norm of assertion (truthfulness), violating a specific "directed duty" (claim-right not to be lied to). Misleading exploits inferential habits, violating only a general duty not to deceive. This is the heart of a sophisticated response. (Full Credit)
  8.  **Concession (Credit Earned):** Appropriately concedes that the *overall* wrongness can be similar in impact (same stakes, same effectiveness), mitigating the moral difference without collapsing it. Shows nuance. (Full Credit)
  9.  **Case (i) Audience with No Right to Truth (Murderer) (Credit Earned):**
      *   Correctly identifies that misleading (saying "friend at station") may be permissible as the duty not to deceive lapses due to forfeited rights.
      *   Correctly identifies that lying ("friend not here") remains problematic because the norm of assertion itself generates a duty not to lie, independent of the hearer's rights. This *strongly confirms* the student's core distinction – the duties have different sources/grounds. (Full Credit)
  10. **Case (ii) Deception Fails (Credit Earned):**
      *   Correctly applies the distinction: Lying still occurs and is wrong even if the hearer sees through it, because the act of asserting insincerely violates the norm of assertion itself.
      *   Correctly draws the conclusion: This shows the wrong of lying is not solely in the *effect* (false belief), but in the *act* of abusing the practice. This powerfully supports the core argument against the objection. (Full Credit)
  11. **Limits of Misleading / Permissibility (Credit Earned):** Correctly notes that misleading isn't always permissible. Highlights contexts where there *is* a right to information (patient, committee), where withholding/deceiving can be just as wrong as lying due to the stringency of the general duty not to deceive in high-stakes situations. Applies this back to the plagiarism case, judging it impermissible. (Full Credit)
  12. **Final Distinction (Credit Earned):** Reiterates the key moral difference clearly: wrong of "evasion" (misleading) vs. wrong of "lying". (Full Credit)
  13. **Minor Weakness 1 (Slight Deduction -1):** The claim that misleading "leaves the practice [of assertion] intact" is slightly too strong. While the liar directly violates the constitutive norm *within* an act of assertion, the misleader arguably still exploits the *background expectation* of truthfulness governing assertion to make their misleading effective. The practice's health *can* be undermined by systematic misleading, even if not violated in the same direct act. (This is under-argued; deduct 1 point).
  14. **Minor Weakness 2 (Slight Deduction -1):** The distinction between a "directed duty" (claim-right) violated by lying and only a "general duty" violated by misleading needs slightly more support. *Why* is the duty not to lie directed/claim-right generating in a way the duty not to deceive is not? The student relies on the "abuse of a practice" argument, which is strong, but the specific "directed duty" terminology introduces a further claim that isn't fully fleshed out here. (Slightly under-argued; deduct 1 point).
  15. **Minor Weakness 3 (Slight Deduction -1):** While the plagiarism case is mentioned in the conclusion ("The referee's letter is not, I think, permissible"), its integration into the positive account in (b) is slightly thin. A first-class answer might have more explicitly linked *why* its wrongness is the "wrongness of evasion" stemming from the violation of the general duty not to deceive (due to the committee's right to the information in this high-stakes context), contrasting it with the wrongness of lying that would have occurred had the referee written something false. (Minor under-development; deduct 1 point).

  **What a First-Class Answer Needed to Do (And This Mostly Did):**
  *   **Distinction:** Clearly and accurately define lying and misleading. **(Done)**
  *   **Application:** Correctly apply the distinction to the plagiarism case. **(Done excellently)**
  *   **Engage Objection:** Seriously engage with the objection's core claim (same aim/outcome). **(Done well)**
  *   **Core Counter:** Provide a principled reason why the difference *is* morally significant, grounded in the nature of communication/norms. **(Done excellently with the norm of assertion)**
  *   **Case (i):** Show how the distinction holds/matters when the audience has no right to the truth (e.g., murderer). **(Done excellently)**
  *   **Case (ii):** Show how the distinction holds/matters when deception fails. **(Done excellently)**
  *   **Coherent Positive Account:** Integrate the responses to the cases into a coherent explanation of the moral significance of the lying/misleading distinction. **(Done well, minor deduction for integration of plagiarism case)**
  *   **Nuance:** Acknowledge limits (misleading can be very wrong, lying isn't always maximally wrong). **(Done very well)**
  *   **Precision & Argument:** Avoid significant overreach or under-argumentation. **(Mostly done, minor deductions)**

  **Defending the Mark (27/30) to the Student:**

  "This is an excellent answer demonstrating a sophisticated understanding of the lying/misleading distinction and its ethical implications. You earned full marks (10/10) for part (a) by providing precise definitions and a flawless application to the plagiarism case. In part (b), you engaged deeply with the core objection and built a strong, coherent argument centered on the norm of assertion and different types of duties violated. Your handling of the two required cases (murderer, failed deception) was particularly insightful and effective in supporting your thesis.

  The mark of 17/20 for part (b) reflects its high first-class quality, with minor deductions for three areas needing slightly more development: (1) The claim that misleading 'leaves the practice [of assertion] intact' could be nuanced, as systematic misleading can erode trust in the practice itself. (2) While the 'directed duty' vs. 'general duty' distinction is plausible, the argument for *why* the duty not to lie specifically generates a claim-right needed slightly more support beyond the 'abuse of practice' point. (3) The integration of the plagiarism case's wrongness into your positive account in part (b) was a little brief; explicitly linking it to the violation of the general duty in a high-stakes context where there *is* a right to information would have strengthened the coherence.

  Overall, this is outstanding work. Your argument that the moral difference lies in the violation of distinct norms (the constitutive norm of assertion vs. a general duty not to deceive), supported by the cases, is philosophically rigorous and effectively counters the objection that the difference is merely 'etiquette'. The concessions you make show appropriate nuance. Well done."
