prompt: |-
  my flatmate's brother is doing a philosophy minor, and over dinner last night he went off on one about Kant. his claim was that the universal law formula is just the thing your mum says when you're six — what if everybody did that? — with the serial numbers filed off, and that it's secretly consequentialist anyway, because whenever anyone actually runs it on a real case the badness always cashes out in consequences: if everyone lied, promising collapses, trust breaks down, nobody gets lent money, etc. his conclusion was that there's nothing specifically Kantian going on, so why wade through 200 pages of Kant to get there.

  i have some sympathy with that but it feels like he's sliding something. can you audit the analogy properly?

  - the correspondence table first: what plays the role of "everybody", of "that", of the bad outcome, of the mum's frown, of "you wouldn't like it, would you". and what's the Kant-side analogue of the "what if" — universal adoption of the maxim, or universal legislation of the law? does that difference do any work, or is it just branding?
  - where the mapping breaks. the bit i half remember: Kant apparently splits things into a contradiction in conception and a contradiction in will, and the four examples he runs in the Groundwork (suicide, the lying promise, letting your talents rot, not helping anyone) aren't all meant to work the same way. so: does the mum-test fit one branch and not the other? my guess is it fits the contradiction-in-will ones, where the verdict does look like "a world like that would be unwishable", and completly misfires on the contradiction-in-conception ones — but i can't make that precise and i might have it backwards.
  - the case that actually bothers me. take the maxim: when keeping a promise has become inconvenient, i'll quietly not keep it. if literally everyone always did that, promising is dead and the test gives the right answer for the boring reason. but that isn't the interesting case. the interesting case is partial: everybody holds that maxim but acts on it only sometimes, or 5% of people hold it. at low defection rates promising as a practice survives just fine, so the crude consequence story doesn't obviously deliver "don't do it" — and partial defection is exactly where deontologists and consequentialists are supposed to come apart. so does Kant's test say anything there that the mum-test doesn't? does the maxim's condition get universalized along with it? and does the answer depend on how fine-grained we make the description, which brings me to:
  - the gerrymandering worry. i can apparently make anything pass by adding details ("i'll lie only to buy milk on tuesdays from red-haired shopkeepers") or make anything fail by stripping them out. is that fatal, or is there a principled story about what the unit of assessment is — maxim, policy, principle of volition — and who sets the level of generality?
  - and the other direction, where the mum-test over-generates: i'll train as a concert pianist and grow no food. universalize that and we starve, so on the mum-test it's wrong, which is absurd. does Kant have a fix that isn't just consequences sneaking back in? (something about a world where no one cultivates talents being conceivable but not willable?) and if that fix needs the formula of humanity to do the work, does that mean the universal law formula on its own is empty — which is the objection my flatmate says one of the Germans who came after Kant already made, about nothing following from mere non-contradiction?

  end by telling me whether the brother's conclusion survives: vacuous, crypto-consequentialist, or neither. and if "what if everybody" is the wrong analogy, is there a better one? someone suggested the constitutive rules of a game: you can't have "bishop moves one square diagonally when it suits me" as a universal rule of chess, not because the game would go badly but because it wouldn't be chess any more. that sounds right to me, but i want to know what it imports that the mum-test doesn't, and which cases it can't handle.

  argue it out, no citations or reading lists please, i can't look anything up and i don't need a bibliography.
reasoning: |-
  Okay, let me try to unpack this user's query. They’re recounting a debate with their flatmate’s brother who dismissed Kant’s universal law formula as just a dressed-up version of the "what if everybody did that?" question moms ask kids. The brother thinks it’s secretly consequentialist because the bad outcomes always boil down to consequences, like trust breaking down if everyone lied. The user feels there’s something off but can’t pinpoint it and wants a thorough audit of the analogy.

  First, I need to map the mum-test to Kant’s formula. Mum’s "everybody" corresponds to universal adoption of the maxim, and "that" is the action being evaluated. The bad outcome aligns with contradictions in Kant’s system, and mum’s frown is akin to the contradiction itself. The key difference is that Kant isn’t about outcomes but logical consistency. The "what if" in mum’s test is about imagining consequences, whereas Kant focuses on whether the maxim can be universalized without contradiction. This distinction is crucial because it shifts from "what happens" to "can it be a law without inconsistency."

  Next, where the mapping breaks. Kant has two types of contradictions: in conception and in will. The mum-test fits better with contradiction in will, like when not helping others leads to a world you wouldn’t want to live in. But for contradictions in conception, like lying promises, the issue isn’t consequences but the logical impossibility—promising ceases to exist if universalized. Mum’s test might miss this nuance since it leans on outcomes, not logical coherence.

  The partial compliance case is tricky. If only some people defect on promises, consequentialism might allow it if the system holds, but Kant’s test still forbids it because the maxim itself, when universalized, makes promising incoherent. The test isn’t about empirical outcomes but whether the agent can consistently will the maxim as universal law. So even partial defection fails because the maxim, if universal, would destroy the practice, making the agent’s own action contradictory.

  Gerrymandering maxims is a real issue. Kant’s formula requires testing the underlying principle, but specifying too many details can game the system. The solution might lie in the agent’s intention—if the maxim is structured to evade universality, it’s invalid. Still, this is a weak spot without clear guidelines, which Kant doesn’t fully resolve.

  The concert pianist example shows where mum’s test overreaches. Universalizing everyone becoming pianists leads to starvation, but Kant’s contradiction in will addresses this: you can conceive such a world, but couldn’t rationally will it because talents are needed for personal goals. This isn’t about consequences per se but about the agent’s own will being inconsistent.

  The brother’s claim that it’s crypto-consequentialist doesn’t hold. Kant’s focus on logical consistency and the nature of rational willing is fundamentally different from weighing outcomes. The game rules analogy is better—like how changing chess rules destroys the game, not because of bad results but because it ceases to be chess. This captures the deontological essence: moral rules define the practice itself.

  However, the game analogy might not cover cases where the contradiction is in will rather than conception. Kant’s system needs both formulas (universal law and humanity) to work fully. The universal law alone can seem empty without the context of rational agency, which the humanity formula provides.

  In conclusion, the brother’s dismissal oversimplifies Kant. The mum-test is consequentialist at heart, while Kant’s formula is about rational consistency. The brother’s conclusion doesn’t survive because he conflates the mechanism with outcomes, missing Kant’s core deontological structure.
answer: |-
  Let's audit this analogy properly. Your flatmate's brother is sharp but oversimplifying – the "mum-test" is a surface-level cousin to Kant's Universal Law Formula (ULF), but the differences are where Kant's distinctiveness lives. Here's the breakdown:

  ### 1. Correspondence Table & The Core Difference
  *   **"Everybody"**: Universal adoption of the maxim by *all rational agents*.
  *   **"That"**: The specific *maxim* (subjective principle of volition) guiding the action.
  *   **The Bad Outcome**: A *contradiction* – either in *conception* (logical impossibility) or in *will* (practical/rational impossibility).
  *   **Mum's Frown / "You wouldn't like it"**: The experience of the *contradiction* itself (realizing the maxim *cannot* be a universal law without defeating itself or your own rational agency).
  *   **The "What If"**: **Crucially, it's *not* "what if everybody *did* this action?" but "what if everybody *willed this maxim as a universal law*?"** This difference is *not* just branding; it's the heart of the matter.
      *   **Mum-Test:** Imagines empirical consequences of mass action ("if *everyone acted like that*, society would collapse"). It's predictive and consequence-focused.
      *   **Kant's ULF:** Asks if the *maxim itself*, when conceived as a universal law, generates a logical or practical contradiction *for the rational will*. It's a test of *internal consistency* of rational willing, not a prediction about the world. The "badness" isn't *primarily* the consequence; it's the *irrationality* of willing a self-defeating law.

  ### 2. Where the Mapping Breaks: Contradiction in Conception vs. Will
  You're right about the split. The mum-test fits **Contradiction in Will** much better than **Contradiction in Conception**.
  *   **Contradiction in Conception (e.g., False Promise):** Universalizing "Break promises when inconvenient" makes the *concept* of a promise vanish. A "promise" inherently implies an obligation; if everyone knows promises are broken when inconvenient, *no one would accept a promise as binding in the first place*. The maxim destroys its own precondition *logically*. **Mum-Test Misfire:** The mum-test points to bad consequences (trust breakdown). Kant points to the *logical incoherence* of the maxim itself becoming law. The consequence (no trust) is a *symptom* of the logical flaw, not the *source* of the wrongness.
  *   **Contradiction in Will (e.g., Not Developing Talents, Not Helping):** Universalizing "Never help others" or "Never cultivate talents" *is* conceivable (a world could physically exist). But could you *rationally will* to live in such a world? Kant argues no. You *depend* on others' help and cultivated talents to achieve *your own* ends. Willing universal non-help/non-cultivation undermines the possibility of achieving *any* rational agent's ends, including your own. **Mum-Test Fit:** "If nobody helped, you'd be screwed when *you* need help!" feels closer. But Kant's emphasis is still on the *practical irrationality* of your own will contradicting itself, not the empirical unpleasantness.

  ### 3. The Partial Compliance Case (The Interesting One)
  This is where the mum-test truly diverges and Kant's deontological core shows.
  *   **Consequentialist Take (Mum-Test Logic):** If only 5% defect on promises, the practice *functions*. The bad consequence (total collapse) *doesn't* occur. Therefore, the mum-test might say *this specific lie* (by you, now) is permissible *because* most people are honest. Consequentialism often permits defection in low-rate scenarios.
  *   **Kant's ULF:** You must test *your own maxim*: "I will break promises when convenient." Can you will *this maxim* (this rule for yourself) to become a universal law? **No.** Why? Because if *everyone rationally willed this maxim as law*, the practice of promising would be logically impossible (contradiction in conception). Your maxim *depends* on the very institution (promising) that it would destroy if universalized. Your action is *inconsistent* with the necessary conditions for your maxim to even make sense. **The test isn't about predicting what *will* happen if *some* people act, but about the *rational structure* of your *own* willing.** Even if *you* are the only one ever to defect, your maxim is self-defeating at the level of universal law. This is pure deontology: the act is wrong *in itself* because of the irrational will behind it, regardless of actual consequences or others' compliance.

  ### 4. The Gerrymandering Worry
  This is Kant's biggest headache. Is the maxim "Lie to red-haired shopkeepers on Tuesdays to buy milk" universalizable? Probably yes, as it doesn't destroy truth-telling generally. Is that valid? Kant would say **no**.
  *   **The Principled(ish) Story:** You must test the *underlying principle* or *intention*. Why are you lying? Presumably, the red hair/Tuesday detail is irrelevant; it's just a way to evade the universalizability test for the core principle: "I will lie to get what I want easily." *That* maxim fails the ULF spectacularly. The test targets the *reason* for the action, not arbitrary surface descriptions. Kant insists maxims must reflect our true reasons. In practice, this relies on the agent's honesty and Kant's insistence on testing fundamental principles, but it's undeniably vulnerable to bad-faith formulation. It's a weakness, but not necessarily fatal – it highlights the need to identify the *essential volition*.

  ### 5. Mum-Test Over-Generates: The Concert Pianist
  *   **Mum-Test:** "If everyone trained as a concert pianist and grew no food, we'd starve! Bad! Don't do it!" Absurd verdict.
  *   **Kant's Fix (Contradiction in Will):** Can you conceive a world where *no one* cultivates *any* talents (including farming, medicine, etc.)? Yes. Could you *rationally will* this as a universal law? **No.** Why? Because *you*, as a rational agent, necessarily have ends (goals) you wish to achieve. Achieving *any* non-trivial end requires the development and use of *some* talents (your own or others'). Willing universal non-cultivation makes achieving *any* rational end impossible, contradicting your own nature as a purposive being. It’s *not* primarily about starvation (a consequence), but about the *internal contradiction* in your will: willing the elimination of the very means (developed capacities) necessary for the pursuit of the ends your will inherently seeks. The "badness" stems from the irrationality, not the starvation (though starvation is the empirical manifestation).

  ### The Brother's Conclusion & A Better Analogy
  *   **Verdict on Brother's Conclusion:** It **doesn't survive**. His claim is **largely vacuous** regarding Kant's core intent and **incorrect** about it being "secretly consequentialist."
      *   **Not Vacuous:** The ULF *does* generate specific duties (like the four examples) through a distinct mechanism (testing for contradictions in conception/will).
      *   **Not Crypto-Consequentialist:** While consequences *often correlate* with the contradictions (especially in contradiction in will), the *source* of the wrongness for Kant is the *irrationality* and *self-defeating nature* of the will willing a non-universalizable maxim. The consequence (trust breaking down) is the *result* of the logical flaw (the destruction of promising) in the lying case, not the *reason* it's wrong. The ULF targets the *form* of the maxim, not outcomes.
  *   **A Better Analogy: Game Constitutive Rules.** This is much closer.
      *   **Why it's better:** It captures the *internal logic* focus. "Bishop moves one square diagonally when it suits me" *cannot* be a universal rule of chess **not** because the game would be chaotic or "go badly" (a consequence), but because it **wouldn't be chess anymore**. The rule defines what a "bishop" *is* within the practice. Similarly, Kant sees moral maxims as defining the "rules" of rational agency. A lying promise isn't wrong because of bad consequences *per se*, but because it tries to use the "rule" of promising (which implies obligation) while simultaneously willing a maxim that would abolish the very possibility of that rule existing – it's like trying to use a bishop while changing its defining move, destroying the coherence of the "game" of rational interaction. The wrongness is in the self-contradictory attempt to participate in a practice while willing its abolition.
      *   **What it Imports:** Focus on internal consistency, definitional coherence, and the conditions for a practice (like rational agency) to exist at all. It downplays predictive consequences.
      *   **Limitations:** The game analogy struggles most with **Contradiction in Will** cases. "Not helping" isn't like changing a chess piece rule; it's more like refusing to play by *any* cooperative strategy in a game where cooperation is sometimes necessary to achieve individual goals within the rules. The Formula of Humanity ("treat humanity as an end, never merely as a means") is indeed often needed alongside the ULF to fully capture Kant's system and handle cases like neglect of self/others. The ULF alone *can* feel formalistic, which is why Kant presents multiple formulations.

  **Final Tally:** The brother spotted a surface resemblance but missed Kant's deeper project of grounding morality in the formal requirements of *rational willing itself*. The mum-test *is* consequentialist; the ULF is fundamentally deontological, even if consequences sometimes lurk nearby. The game rules analogy gets much closer to the deontological heart of the matter.
