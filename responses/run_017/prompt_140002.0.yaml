prompt: |-
  I'm in the eleventh grade, and for an independent project I'm trying to build what my supervisor calls a decision procedure: a short field guide that my class could actually use to rule on anything anyone hands us, and say whether it is alive. The purpose is fixed in advance. I do not need the guide for cats, oak trees, or the bacteria on a petri dish in the lab cupboard, because everyone already agrees about those. I need it for the cases where nobody agrees: things assembled in a lab, samples a rover might bring back, self-copying computer programs, industrial chemical processes, and whatever else turns up that nobody has seen before. Before I read any more of the proposed definitions of life, I'd like the specification that such a definition is supposed to meet.

  So please write out the desiderata for an account of what it is to be living, given that purpose: the cases it has to get right, the distinctions it must not collapse, the results from biology and chemistry it is not allowed to contradict, and the features it must have as a test rather than as a slogan. For each requirement give the case or consideration that makes it a requirement, and mark which are non-negotiable and which are really preferences of one camp dressed up as requirements. I care much more about the list and about why each item is on it than about any scoring of existing theories.

  The cases I keep coming back to, and which I think any account has to say something about, are these: an individual that is plainly alive but can never have offspring of its own; a seed or spore in which essentially no chemistry happens for centuries or millennia and which then starts up again; a forest that is one individual spread over many acres, linked underground, while also shedding parts that live on their own; a computer worm on a school network that copies itself, mutates, and sheds functions nobody needs; a factory process that consumes fuel, grows, and produces waste, but produces nothing that inherits anything from it; a laboratory cell that runs its own chemistry but can only reproduce by sending instructions to a machine it neither built nor can repair.

  The distinctions I don't want collapsed are: being alive versus being a part of something alive; being alive versus being a product of something alive; whether a thing is alive at all versus how much it counts or how alive it is; reproducing versus merely being copied by something else; and having a function or a purpose versus merely happening to be useful to something.

  I've also made up three cases for the project, and I'd like them treated as real constraints on the account rather than as jokes. The Rental: a creature that maintains itself and reproduces, but every component of it, including its outer boundary and the machinery that copies its instructions, is manufactured by a different organism living inside it; separated from that partner it does nothing at all. The Library: a creature whose young develop into the right body only if raised within a structure the parent builds, where the shape of that structure rather than the parent's genetic material carries most of the information about the body's layout, where the shape is rebuilt slightly differently each generation, and where those differences are passed on. The Twin Ladder: a lineage that must alternate, one generation multiplying by splitting and the next only by exchanging material with another individual, where neither method alone can carry the line more than one step. For each of the three, tell me what a candidate definition is committed to saying, and whether you think that is the right thing to say.

  Two further things I specifically want. First: I suspect that two requirements people usually demand are in tension, namely that the account must not simply be reverse-engineered from a list of the organisms we already call alive, and that it must of course agree with us about those organisms. If that tension is real, make it precise and tell me what has to be given up; if I'm just muddling two different things, say so and explain the difference. Second: tell me which single requirement, of the ones you defend, excludes the largest number of the definitions currently on offer, including the popular style that defines life as something like self-maintaining chemistry that can evolve by natural selection. Say which way of thinking it rules out and why that is a point in the requirement's favour rather than a reason to weaken it.

  Finally, on how I'd like you to answer: please commit. Give me the list you would actually stand behind, argue for it, and where you have to make a judgment call, make it and say why rather than laying out the options and leaving me to choose. If you had to drop one desideratum from your own list, say which and why, and say which part of your answer you take to be most open to reasonable disagreement. A binary verdict may or may not be what the guide should output; if your own desiderata settle that question, say which way they settle it.
reasoning: |-
  Okay, let me approach this systematically. The user is a sharp eleventh grader working on a decision procedure for determining life - not for clear cases but for controversial edge cases. They've provided specific scenarios and distinctions they want preserved, along with three invented test cases.

  First, I need to identify core requirements from their constraints. The key challenges are: sterile organisms (like mules), dormant states (seeds), distributed individuals (forests), digital life (computer worms), and abiotic systems (factories). The distinctions they emphasize between life/parts, life/products, and reproduction/copying are crucial.

  For non-negotiable requirements: 
  - Must handle sterile individuals (biology confirms their aliveness)
  - Must account for metabolic suspension (like tardigrades)
  - Must distinguish between organism and ecosystem (the forest case)
  - Cannot require DNA-based inheritance (their Library case breaks this)

  The tension they identified is real: we can't just list known life while also covering novel cases. The solution is to prioritize functional criteria over historical ones. The requirement that will eliminate most existing definitions is prohibiting evolutionary potential as necessary - this rules out popular "evolution-capable" definitions that would misclassify sterile organisms.

  For their invented cases:
  - The Rental commits us to saying it's alive despite external manufacturing dependency
  - The Library forces acceptance of non-genetic inheritance
  - The Twin Ladder requires reproduction to include multi-step processes

  If I had to drop one desideratum, it would be perfect continuity with everyday judgments - some counterintuitive results may be necessary for consistency. The most debatable point is whether self-repair is essential, given their lab cell case.

  The output should be binary - their project needs clear rulings. This means drawing bright lines while acknowledging gray areas require case-by-case application of the criteria.
answer: |-
  Here is the list of desiderata for your decision procedure, argued as commitments. Each requirement stems directly from your cases, distinctions, or fundamental biological consistency, with sources and non-negotiability marked. I'll then address your specific cases, the tension you identified, and the most exclusionary requirement.

  **Core Desiderata for a Life Definition (with Rationale & Status):**

  1.  **Must accommodate entities that are metabolically active and organized but sterile (cannot reproduce).**
      *   *Source:* Mules, worker ants, post-reproductive individuals. Biology unequivocally considers these alive.
      *   *Non-negotiable:* Yes. Excluding them contradicts core biological understanding.
      *   *Test Requirement:* Definition cannot have reproduction (or evolutionary potential) as a *necessary* condition.

  2.  **Must accommodate metabolic suspension (dormancy) without death.**
      *   *Source:* Seeds, spores, tardigrades in cryptobiosis. Revivability after cessation is a biological fact.
      *   *Non-negotiable:* Yes. Denying this misclassifies known living states as non-living.
      *   *Test Requirement:* Definition must allow for temporary cessation of metabolic processes *without* loss of "living" status, contingent on inherent structural integrity enabling future function.

  3.  **Must clearly distinguish an individual organism from a colony, ecosystem, or machine.**
      *   *Source:* Your forest case (distributed individual vs. ecosystem), distinguishing parts/products from living wholes, computer worms vs. intentional copies. Collapsing this renders the guide useless (is a leaf alive? Is the internet alive?).
      *   *Non-negotiable:* Yes. This is central to the *purpose* of your guide – making distinct rulings.
      *   *Test Requirement:* Definition must specify an *organizational boundary* and *functional integration* that constitutes a distinct, persistent unit of process.

  4.  **Must require active self-maintenance against equilibrium (metabolism).**
      *   *Source:* Contrast with crystals (grow passively) or fire (consumes fuel, grows, produces waste). Essential to distinguish life from complex non-living dissipative systems.
      *   *Non-negotiable:* Yes. This captures the fundamental thermodynamic distinction biology relies on.
      *   *Test Requirement:* Definition must specify *internal work* using energy to maintain a specific, far-from-equilibrium state and structure. Mere passive persistence or externally driven change isn't enough.

  5.  **Must distinguish *inherent* self-replication/reproduction from external copying.**
      *   *Source:* Factory process (grows but doesn't replicate *itself*), Computer worm (copies *itself* inherently), distinguishing products from offspring.
      *   *Non-negotiable:* Yes. Collapsing this eliminates a key distinction between living processes and industrial/technological ones.
      *   *Test Requirement:* Definition must require that the *process of replication/reproduction is causally directed by the entity's own internal organization and state*. (The entity is the *proximate cause* of the new instance).

  6.  **Must avoid teleology ("purpose") inherent in the definition itself.**
      *   *Source:* Requirement to distinguish having a function vs. being useful. Biology describes evolved functions, but doesn't require intrinsic cosmic purpose to define life.
      *   *Non-negotiable:* Preference leaning towards requirement. "Purpose" is subjective and leads to circularity or vagueness ("What is the purpose of a virus?"). Focus on *mechanism* (how it works) not *telos* (why it exists).
      *   *Test Requirement:* Definition should describe *processes* (self-maintenance, replication) not invoke *goals* ("seeks to survive," "aims to reproduce").

  7.  **Must allow for non-DNA based information inheritance.**
      *   *Source:* Your Library case. Biology recognizes epigenetic, behavioral, and structural inheritance. Limiting to DNA is empirically unjustified for novel cases.
      *   *Non-negotiable:* Preference, but strongly argued. DNA is Earth-specific. A general definition must allow for *any* persistent encoding (molecular, structural, symbolic) that reliably transmits organizational information.
      *   *Test Requirement:* Definition cannot specify the *medium* of inheritance, only the *functional role* (transmission of information guiding development/organization).

  8.  **Must provide a *binary* verdict (Alive / Not Alive) for a specific entity at a specific time.**
      *   *Source:* Your project goal: a "decision procedure" to "rule" and "say whether it is alive." "How alive" is not useful for ruling.
      *   *Non-negotiable:* Yes, for *this specific project brief*. Your guide needs a clear output.
      *   *Test Requirement:* The criteria must be applicable to yield a yes/no answer about a defined entity at a snapshot in time.

  **Addressing Your Cases:**

  *   **The Rental:** Committed to saying **Alive**. *Why:* It actively self-maintains (metabolism) and inherently reproduces (its internal organization directs the replication process, even if relying entirely on symbiotic manufacturing). Separation kills it because it loses its essential metabolic/replicative machinery, not because it wasn't alive before. *Right call?* **Yes.** Its dependency is extreme symbiosis, not evidence of non-life. It meets core process criteria.
  *   **The Library:** Committed to saying **Alive**. *Why:* It self-maintains and reproduces. Reproduction crucially involves inherent transmission of information (the structure's shape) that guides offspring development. The medium (structure vs. molecule) is irrelevant per Desideratum 7. *Right call?* **Yes.** This challenges DNA-centrism but captures the functional essence of inheritance.
  *   **The Twin Ladder:** Committed to saying **Alive**. *Why:* The *lineage* inherently reproduces. The alternating methods are intrinsic parts of its life cycle, ensuring continuity. Neither generation alone is sterile; the *process* of reproduction spans the alternation. *Right call?* **Yes.** Reproduction doesn't require every individual to be capable of all modes; it requires a persistent lineage mechanism.

  **The Tension (Reverse-Engineering vs. Agreement):**

  This tension is **real and fundamental**. Here's the precision:

  *   **Reverse-Engineering Risk:** If the definition is *solely* built to match known Earth life (cats, bacteria), it will almost certainly fail on novel cases (rover samples, AIs) because it encodes historical accidents (DNA, specific metabolic pathways).
  *   **Agreement Requirement:** We *must* classify known Earth organisms correctly (mules, seeds) because they are the empirical bedrock.

  **Resolution & What Must Be Given Up:**

  *   You must **give up the requirement that the definition *explicitly mentions* or is *obviously derived from* the specific traits of known Earth life** (e.g., "based on nucleic acids", "carbon-based in water").
  *   Instead, the definition must be **functional and organizational**. It describes the *type of process* (far-from-equilibrium self-maintenance, inherent replication, bounded organization) that *happens* to be instantiated by Earth life. Agreement is achieved because Earth life exemplifies these functional processes, not because the definition lists Earth-life traits.
  *   **Sacrifice:** You might have to accept that the definition *could*, in principle, apply to things that look nothing like Earth life, and conversely, that some Earth entities (like certain debated viruses or prions) might fall just outside the boundary. The focus is on the *process logic*, not the familiar examples.

  **The Most Exclusionary Requirement:**

  **Desideratum 1 (Accommodating Sterility) excludes the largest number of popular definitions.**

  *   **What it Rules Out:** Any definition that makes *reproduction*, *evolution by natural selection*, or *potential for evolution* a **necessary** condition for being alive. This includes:
      *   NASA's "self-sustaining chemical system capable of Darwinian evolution".
      *   Definitions focusing on "units of selection" or "evolvability".
      *   Definitions requiring "heritable variation".
  *   **Why it's a Point in the Requirement's Favor:** Biology itself demonstrates that sterility does not negate life. Mules are alive. Insisting on reproduction/evolution as necessary forces you to either:
      *   **Deny Biology:** Claim mules aren't alive (absurd).
      *   **Redefine Reproduction:** Stretch "reproduction" to meaningless levels (e.g., "cell reproduction counts for the mule" - but then *any* multicellular entity qualifies via its cells, collapsing distinctions).
      *   **Introduce "Potential":** Claim steriles have the "potential" (mules demonstrably don't). This makes the definition vague and untestable ("What potential? Measured how?").
  *   **Why Not Weaken It?** Weakening it means abandoning core biological facts for theoretical neatness. Your guide *must* get mules right. This requirement forces the definition to focus on the *current state and processes* of the entity itself (metabolism, organization), not its lineage potential.

  **Judgment Calls & Commitments:**

  *   **Binary Verdict:** Desideratum 8 commits the guide to a binary output. This is essential for its stated purpose as a decision procedure for ruling. Gray areas exist, but the criteria must be applied rigorously to force a yes/no.
  *   **Dropping One Desideratum:** If forced to drop one, I would reluctantly drop **Desideratum 7 (Non-DNA Inheritance)**. *Why?* While desirable for novelty, it's the least critical *core* requirement. You could define life requiring *some* form of heritable material/encoding, leaving the door open for non-DNA on a case-by-case basis without demanding it upfront, and still get Earth life and many novel cases (like The Library) right. Dropping Desideratum 1, 2, 3, 4, or 5 would be catastrophic.
  *   **Most Open to Disagreement:** **The scope and nature of the "organizational boundary" (Desideratum 3).** What constitutes a *distinct, functionally integrated unit*? Is a lichen (fungus+alga) one organism or two? Is a tightly integrated symbiotic pair one? Is a robot with symbiotic microbes one? This requires careful application of the criteria to specific cases and is inherently the hardest line to draw sharply. My commitment is that the boundary must be defined by functional integration and persistence *as a unit* for the core life processes.

  **In Essence:** Your decision procedure must be **functional, process-oriented, and binary**. It must define life as **a distinct, persistently organized entity that actively maintains itself in a far-from-equilibrium state using energy, and whose inherent organization is capable of directing the generation of new instances of itself.** This meets your core constraints, handles your tricky cases correctly, resolves the tension by focusing on process over substrate, and excludes definitions that erroneously demand reproduction or evolution for individual aliveness. Stand by this logic; it provides the clearest, most consistent, and biologically grounded path for your field guide.
