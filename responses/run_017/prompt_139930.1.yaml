  We are designing an activity for a 90-minute session with 18 participants. The goal is to explore the inefficacy objection without naming it until the end, through three rounds that differ in causal structure: 
   1. Visible threshold with no individual impact (unless at the boundary).
   2. Hidden threshold (randomly drawn) so each act has a small chance of making a difference.
   3. Continuous outcome (no threshold).

  Constraints:
   - Avoid turning into a standard prisoner's dilemma (focus on "my contribution makes no difference", not "I'd be a sucker").
   - Private written reasons before outcomes are revealed.
   - Use a real stake (e.g., charity donation or shared treat) but no money among participants.
   - Heterogeneity in costs? We'll consider whether adding private costs muddies the effect.

  Brainstorming three candidate activities:

  Candidate 1: "Charity Donation Thresholds"
   - Three rounds: 
     Round 1: Visible threshold for a donation (e.g., 10 contributors trigger a €40 donation). Each participant decides whether to contribute (by giving up a small real sacrifice, e.g., a comfortable seat for a less comfortable one, or doing a 30-second chore). The threshold is set at a level where if exactly one more is needed, that person is pivotal; otherwise, no one is. But with 18 people and a threshold of, say, 10, each person can see that unless the total is exactly 9 (so they are the 10th), their contribution doesn't change the outcome. However, with 18, it's very likely the threshold is exceeded, so individual contributions seem futile.
     Round 2: Hidden threshold. The threshold is drawn randomly from a range (e.g., 5 to 15) after decisions. Now each contribution has a chance (unknown) to be pivotal.
     Round 3: Continuous: Each contribution adds a fixed small amount (e.g., €0.50) to a donation pool (with a cap? but we want continuous). The donation is proportional to the number of contributors.
   - Real stake: The society's €40 is donated to charity in proportion to the outcomes (or as triggered). The sacrifice: In each round, contributors might have to do a chore (like standing for 5 minutes) or give up a treat (a cookie?).
