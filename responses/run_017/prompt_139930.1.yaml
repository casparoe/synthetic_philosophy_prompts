  ### Brainstormed Candidate Activities
  1. **Charity Threshold Auction**: Participants bid tokens (distributed equally) to push a donation over one of several visible thresholds. Each token bid is a small real sacrifice (e.g., giving up a comfortable seat). The highest bidder who pushes the donation into a new threshold tier wins a prize, but all face the inefficacy problem: unless they are the pivotal bidder, their token changes nothing.  
     *Rejected*: Too easily collapses into a competitive auction, shifting focus to strategic bidding rather than perceived individual inefficacy. The winner-takes-all element risks fostering "sucker" resentment.

  2. **Climate Tipping Point Simulation**: Groups represent countries emitting CO₂. Each decides privately whether to "reduce emissions" (sacrificing a small treat) to avoid crossing a hidden global threshold. Thresholds are drawn randomly from a range (e.g., 1–5°C warming), with catastrophic costs if breached.  
     *Rejected*: Complex to run in 90 minutes; heterogeneity in group dynamics might overshadow individual reasoning. The team structure could trigger assurance-game thinking ("Will my group cooperate?"), muddying the inefficacy focus.

  3. **Index Card Contribution Game**: Participants privately decide whether to contribute (at a small real cost) in three rounds with identical payoffs but varying causal structures. Decisions affect a real charity donation.  
     **Selected**: Cleanly isolates inefficacy reasoning through private, simultaneous choices. The cost (writing an extra sentence) is trivial yet tangible, avoiding prisoner’s-dilemma feelings. Rules ensure no benefit excludability (all share the donation outcome equally), blocking "sucker" dynamics. Simple materials, scalable to 18 people.

  ---

  ### Activity Design: **Threshold, Chance, and Continuity**
  **Goal**: Surface the inefficacy objection ("My act changes nothing") through three rounds where causal structures vary (visible threshold/hidden threshold/continuous), using identical incentives. Participants confront the problem by experiencing when their contribution feels futile vs. impactful.

  **Core Mechanics**  
  - **Real stake**: €40 donation split across rounds (details below).  
  - **Cost of contributing**: Writing an extra sentence on an index card (symbolic effort).  
  - **Benefit structure**: Non-excludable—if the donation is triggered, all share the moral/social reward (no individual penalties/rewards). Blocks prisoner’s-dilemma reasoning by removing free-rider resentment.  
  - **Private reasons**: Before outcomes, all write a one-sentence justification for their choice.  
  - **Heterogeneity**: None. Uniform costs/stakes ensure inefficacy is the primary friction.  

  **Materials**  
  - Index cards (54), pens (18)  
  - Projector for rules/outcomes  
  - Phone RNG (random.org) or die  
  - €40 charity donation (pre-select 3 options; group votes post-game)  
  - €10 cookies for sharing (post-debrief)  

  **Rules & Payoff Scheme**  
  **Intro Script (5 min)**:  
  > "We’ll play 3 quick rounds. Each round, you decide privately: **Contribute (C)** or **Not (N)**. If you choose C, you must write an extra sentence on your card—a small cost. Your choices affect a real €40 donation to charity. After all rounds, we’ll donate the total and share cookies. Write your reason for C or N *before* we reveal outcomes. Decisions are simultaneous and private—no talking during rounds."

  **Round 1: Visible Threshold (15 min)**  
  - **Rules**: "If ≥10 contribute, €10 is added to the donation. Otherwise, €0. You see the threshold and group size (18)."  
  - **Procedure**:  
    1. Hand out cards. Participants write: [Round 1], [C/N], [Reason], and if C, [Extra sentence].  
    2. Collect cards, shuffle, count C’s. Announce: "X contributed. Threshold (10) was/wasn’t met. Donation: €Y."  
  - **Inefficacy trap**: With 18 people, P(being pivotal) ≈ 1/18. Most will intuit their C changes nothing unless X=9.

  **Round 2: Hidden Threshold (15 min)**  
  - **Rules**: "A threshold (5–15) will be randomly drawn *after* decisions. If C’s ≥ threshold, €10 is added. Otherwise, €0."  
  - **Procedure**:  
    1. Repeat card write/collection.  
    2. Use RNG to draw threshold (5–15), announce it, then count C’s and outcome.  
  - **Inefficacy trap**: Each C has a small chance (≈1/11) of being pivotal. Uncertainty highlights "expected difference-making."

  **Round 3: Continuous (15 min)**  
  - **Rules**: "Each C adds €0.50 to the donation. No threshold."  
  - **Procedure**: Same as above. Total donation = €0.50 × C’s.  
  - **Contrast**: Every C makes a measurable difference.  

  **Donation Total**: Sum of round outcomes (max €10 + €10 + €9 = €29). Top up to €40 with society funds.  

  ---

  ### Timeline (90 min)  
  - **0–5 min**: Intro and rules.  
  - **5–20 min**: Round 1 (visible threshold).  
  - **20–35 min**: Round 2 (hidden threshold).  
  - **35–50 min**: Round 3 (continuous).  
  - **50–55 min**: Calculate donation, vote on charity.  
  - **55–85 min**: Debrief (script below).  
  - **85–90 min**: Share cookies, donate.  

  ---

  ### Debrief Script (30 min)  
  **1. Surface Reasons (5 min)**  
  > "Read anonymous reasons from cards. *Round 1*: ‘Why bother? 10 is unlikely to hinge on me.’ *Round 2*: ‘Tiny chance I matter, so I contributed.’ *Round 3*: ‘Every bit helps.’ Notice when ‘no difference’ dominated your choice."  
  *Why*: Shows inefficacy reasoning emerged organically.  

  **2. Map to Concepts (10 min)**  
  - **Actual vs. Expected Difference**:  
    > "Round 1: Your C *actually* changed nothing unless you were pivotal (rare). Round 2: Your C had a small *expected* difference—it might have been pivotal. Round 3: Every C *actually* added €0.50."  
  - **Real Cases**:  
    > "Beef consumption? Like Round 1 if abattoirs have hard thresholds. Emissions? Like Round 2 if tipping points exist but are hidden. Voting? Like Round 1 in large electorates. Continuous harms (e.g., microplastics)? Like Round 3."  

  **3. Challenge the Excuse (10 min)**  
  - **Generalization Test**:  
    > "If everyone in Round 1 says ‘I make no difference,’ the threshold fails. The group outcome is bad *because* each excused themselves. So: does ‘I change nothing’ justify inaction?"  
  - **Wrongdoing Level**:  
    > "If the group causes harm (e.g., no donation), are members blameless? Or is each part of a harmful group? This shifts focus to complicity."  
  - **Address the Bullet-Biter**:  
    > "To ‘a 1-in-10,000 chance doesn’t matter’: If the harm is large (e.g., climate collapse), expected harm = (harm size) × (probability). Ignoring this risks catastrophe. Also, small chances add up over repeated acts (e.g., daily choices)."  

  **4. Philosophical Gaps (5 min)**  
  > "This simplifies reality. We didn’t address:  
    - **Empirical uncertainty**: Are beef/emission thresholds real? We often don’t know.  
    - **Non-consequentialist reasons**: Acting to express values or avoid complicity, even if futile.  
    - **Repeat plays**: Your act today might influence others tomorrow.  
    - **Probability debates**: Can we ignore tiny chances of huge harms? Some say yes (threshold deontology); others say aggregate expected harm (utilitarianism)."  

  ---

  ### Failure Modes & Fixes  
  1. **Participants assume bluffing** ("She’ll donate anyway"):  
     - *Fix*: Pre-show charity options. Publish donation receipt next session.  

  2. **Economics students compute pivotality**:  
     - *Fix*: Emphasize gut reasoning. If they vocalize math, note: "Yes, P(pivotal) is low in Round 1—does that make contributing irrational?"  

  3. **Abstention for cost reasons**:  
     - *Fix*: Make cost trivial (writing one sentence). Use card reasons to distinguish: "I don’t want to write" vs. "I won’t make a difference."  

  4. **Group coordination**:  
     - *Fix*: Strict silence during rounds. Collect cards immediately. If whispering, say: "Decisions are private—write your own reason."  

  **Limitations**: Cannot stage empirical uncertainty about thresholds, expressive/complicity reasons, or long-term precedent effects. Supply these in discussion using real cases (e.g., "How do we know if beef orders have thresholds?").  

  ---  
  This design forces inefficacy to the forefront while sidestepping prisoner’s dilemmas. By Round 3, the contrast in reasoning exposes the flaw in generalizing "no difference" excuses. Your friends’ beef debate will resurface—but now, the group has lived it.
