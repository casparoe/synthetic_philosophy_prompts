     Round 1: Visible threshold (e.g., 10 people must choose hard chairs to trigger the upgrade). Each person chooses privately whether to take a hard chair. The total number is announced, and if it meets or exceeds the threshold, the upgrade happens. Otherwise, not. But note: if the threshold is 10 and 11 choose, then the 11th made no difference. If 9 choose, then the 10th would have been pivotal but didn't contribute, so the upgrade fails. But with 18, if the threshold is 10, then if 9 are already choosing, the 10th is pivotal; otherwise, not. But in reality, with 18, the chance of being exactly the 10th is low.
