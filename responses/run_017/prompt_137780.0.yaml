answer: |-
  Below is a complete, runnable 90-minute session designed to meet your objectives. The activity emphasizes underdetermination of rules, the role of priors, and the invisibility of relational hypotheses—all while keeping Bongard problems unnamed.

  ---

  ### **Materials per Team (4 teams of 3)**
  1. **Vocabulary Card** (1 per team):  
     *"Use only these properties:  
     - **Shapes:** circle, square, triangle  
     - **Fill:** empty, striped, solid  
     - **Size:** small, medium, large  
     - **Count:** number of figures per panel  
     - **Relations:** touching, overlapping, contained-in, separate (for figures in the SAME panel)"*  

  2. **Round 1 Packet** (1 per team):  
     - **Panel Pair Sheet:** Left panel (6 figures), right panel (6 figures).  
     - **Loose Probe Cards:** 3 single figures to classify.  
     - **Pre-made Probe Deck:** 5 sealed envelopes, each with 1 figure (for later).  

  3. **Round 2 Packet** (1 per team):  
     - Blank index cards (20+), colored markers, 1 envelope.  
     - **Scoring Rules Card** (see below).  

  4. **Relational Problem** (planted with 1 team):  
     - *Left panel:* All figures unique (no two share shape+fill+size).  
     - *Right panel:* At least two identical figures (same shape+fill+size).  

  ---

  ### **Timeline (90 Minutes)**  
  **0:00–0:10 — Intro & Teams (10 min)**  
  - *Hand out:* Vocabulary Card + Round 1 Packet.  
  - *Instructions:*  
    > "Split into teams of 3. On your sheet are two panels: LEFT and RIGHT. Your goal: figure out what makes a figure belong to one side vs. the other. Use ONLY the properties on your Vocabulary Card. First, classify the 3 loose cards by placing them under LEFT or RIGHT. Then, write down THREE distinct explanations for the pattern—each must fit all 12 figures. Rank them: #1 = your best guess."  

  **0:10–0:35 — Round 1: Discovery (25 min)**  
  - Teams:  
    1. Classify loose probe cards.  
    2. Brainstorm **three distinct rules** (e.g., "Left: striped circles. Right: not striped circles").  
    3. Rank rules by plausibility.  
  - *Facilitator:* Circulate, remind: "Use only the vocabulary. Could there be *other* explanations?"  

  **0:35–0:45 — Probe Test (10 min)**  
  - *Hand out:* Pre-made Probe Deck (5 figures).  
  - *Instructions:*  
    > "For each probe, predict LEFT/RIGHT under EACH of your three rules. If rules disagree, note where!"  
  - *Pre-made Deck Design (splits common distinctions):*  
    - **Probe 1:** Contradicts size-based rules (e.g., if training implies "Left = large," this is medium).  
    - **Probe 2:** Contradicts fill-based rules (e.g., if training implies "Right = solid," this is striped).  
    - **Probe 3:** Contradicts shape-based rules (e.g., ambiguous triangle-square hybrid).  
    - **Probe 4:** Contradicts count-based rules (if panels differ in figure counts).  
    - **Probe 5:** Reveals relational blind spots (e.g., a figure that "should" touch others but doesn’t).  

  **0:45–0:50 — Quick Share (5 min)**  
  - Teams report:  
    > "How many probes split your rules? Which #1 rule survived?"  
  - *Key point:* Highlight teams with conflicting predictions.  

  **0:50–1:05 — Round 2: Authoring (15 min)**  
  - *Hand out:* Round 2 Packet.  
  - *Instructions:*  
    > "Create a new panel pair (6 LEFT, 6 RIGHT) using vocabulary properties. Seal your intended rule in the envelope. Design a puzzle where solvers might FAIL to guess your rule—but avoid ambiguity traps! Scoring:  
    - **+3 chocolates** if solvers find NO rule.  
    - **+1 chocolate** if solvers find ONLY your rule.  
    - **-1 chocolate (COLLISION)** if solvers find a DIFFERENT rule that fits all 12 figures, and you can’t create a new figure that splits the rules. If you win, take chocolates from solvers!"  
  - *Critical nuance:* Teams must defend against alternative rules by creating a **disambiguating figure** if challenged.  

  **1:05–1:20 — Solving & Scoring (15 min)**  
  - Swap puzzles between teams.  
  - Solvers:  
    1. Classify 2 probe figures (provided by authors).  
    2. Write **one plausible rule** and **one alternative rule** (both must fit all 12 figures).  
  - Authors: Reveal sealed rule. Apply scoring above.  
  - *Relational team:* Likely struggles. When stuck, ask: "What’s hard to describe with the vocabulary?"  

  **1:20–1:30 — Debrief (10 min)**  
  > **Q1:** *"In Round 1, how many rules fit your 12 figures? Why did you rank one #1?"*  
  → *Point:* **Underdetermination** + **prior on "naturalness"** (simplicity, familiarity).  

  > **Q2:** *"Did anyone’s #1 rule fail the probes? What does that say about the ‘aha!’ moment?"*  
  → *Point:* **The click ≠ recovering intent**; it’s prior + data alignment.  

  > **Q3 (to relational team):** *"How did you describe your rule? Why was it hard?"*  
  → *Point:* **Hypothesis space is a choice**. Individual properties hide relational structure.  

  > **Q4:** *"In Round 2, how did scoring change your design? Did anyone fear COLLISION?"*  
  → *Point:* Authors appeal to **unstated priors** to avoid ambiguity, mirroring real cognition.  

  > **Final note:** *"Real Bongard problems add perceptual work—here, we gave you symbols. In the wild, your brain must invent the vocabulary too."*  

  ---

  ### **Predicted Failures & Fixes**  
  1. **Overly complex rules:**  
     - *Fix:* Remind: "Rules must use ONLY vocabulary. If it takes 5 clauses, is it ‘natural’?"  
  2. **"Vibes" without articulation:**  
     - *Fix:* Require written rules. Ask: "Point to vocabulary properties that justify this."  
  3. **Exploiting drawing style:**  
     - *Fix:* Use printed figures (not hand-drawn) and enforce vocabulary. Discard "wobbly lines" as invalid.  
  4. **Physical cheating (e.g., moving figures):**  
     - *Fix:* Laminate panels. Say: "Panels are fixed. Relations are BETWEEN figures, not positions on the table."  
  5. **Authors create unfalsifiable puzzles:**  
     - *Fix:* Scoring incentivizes "hard but defensible" puzzles. COLLISION penalty forces testability.  

  ---

  ### **What the Activity Misses**  
  **Perceptual feature construction** is absent because figures are pre-symbolized. Participants select hypotheses but don’t *generate* the vocabulary.  

  **Facilitator adds in debrief:**  
  > "In real Bongard problems, your brain does two things: (1) *invents* features (e.g., ‘symmetry’, ‘curvature’), and (2) *selects* which features matter. Today, we gave you (2). The harder, hidden work is (1)."  

  **Show a real Bongard problem** (e.g., [BP#1](https://www.foundalis.com/res/bps/bpidx.htm)) to contrast. Ask: *"What features would you invent here that aren’t in our vocabulary?"*  

  ---

  ### **Handout Wording**  
  - **Vocabulary Card:** As above.  
  - **Round 1 Instructions:**  
    > "Classify each loose card: LEFT or RIGHT? Then give THREE explanations for the pattern. Each must fit all 12 figures. Rank them (1=best guess). Finally, test all three against the 5 probes."  
  - **Scoring Rules Card (Round 2):**  
    > "GOAL: Make solvers struggle.  
    — SOLVERS FAIL (find NO rule)? → YOU GET 3 CHOCOLATES  
    — SOLVERS FIND ONLY YOUR RULE? → YOU GET 1 CHOCOLATE  
    — SOLVERS FIND ANOTHER RULE? → PRODUCE A NEW FIGURE THAT SPLITS THE RULES. FAIL? → LOSE 1 CHOCOLATE TO THEM."  

  ---

  This design ensures participants experience underdetermination, priors, and relational blindness firsthand. The scoring mechanic forces authors to confront simplicity vs. ambiguity, and the debrief ties each moment to your core concepts. Run it as-is!
