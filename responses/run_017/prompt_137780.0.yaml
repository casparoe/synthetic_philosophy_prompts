prompt: |-
  Hi — I'm running a 90-minute evening session of a small reading group, about 12 people (mostly cognitive-science grad students, a few programmers, one historian who wandered in and never left). Nobody in the room has met Bongard problems before, and I want to keep it that way for the first hour: no definition up front, no "these are called Bongard problems", no lecture. Just two panels of little hand-drawn figures and the question "which side does this new one belong on?" I'd rather the word "rule" not even appear on the handout.

  What I want them to feel in their hands, not be told, is that twelve examples (six a side) don't pin anything down in an interesting sense — that what does the selecting is a shared, mostly unstated prior about which predicates are natural, and that the "oh — now I see it" click is not evidence you've recovered the author's intended distinction. Secondary thing I'd like them to run into by themselves: the space of candidate distinctions is a *choice*, and if you only ever consider properties of individual figures, a whole family of distinctions about relations *between* the figures on a panel stays invisible.

  Can you design me a runnable activity for that? Things I'd like baked in:

  - Practicalities: 12 people, teams of 3, 90 minutes, one room, no projector, no laptops. Materials should be stationery-shop stuff — index cards, coloured markers, envelopes, printed sheets. Nothing that needs charging.
  - A "vocabulary card" handed out first: a short fixed list of legal primitives any distinction has to be built from (shape, fill, size, count, and relations like touching / overlapping / contained-in / separate), maybe 8–10 items. The reason I want it fixed is that afterwards we can genuinely ask "how many distinctions expressible in this little language fit these twelve cards?" and argue to an answer instead of hand-waving.
  - Round 1: each team gets a panel pair plus a few loose probe cards. They have to (a) place the probes and (b) write down *three* seperate distinctions consistent with the training cards, not one. Rank them by which they'd bet on.
  - Then I reveal a pre-made set of maybe five extra probe cards, and each team has to commit, in writing, to a side for each probe *under each of their three distinctions*. If their own distinctions disagree with each other, they should find that out by doing it, not by me announcing it. Tell me how to build that probe deck so it reliably splits the kinds of distinctions people actually generate.
  - Round 2: teams author a panel pair for another team, sealed in an envelope, with a scoring scheme that doesn't need real money (chocolate is fine). Here's the bit I care most about: I want authors rewarded when solvers *fail*, but penalised — call it a "collision" — when solvers name a different distinction that fits all twelve cards and the author can't produce a card, within the vocabulary, that seperates it from their own. My hope is that this forces authors to appeal to something outside the data (simplicity, naturalness, "what a person would think of") in order to defend their puzzle, and that's the moment the debrief names. Sanity-check whether that incentive actually produces the behaviour I want or whether it just makes everyone write easy puzzles.
  - Somewhere in there I want one planted panel pair whose distinction is configural/relational — e.g. on one side no two figures are exactly alike in the vocabulary, on the other at least two are — slipped in without comment as just another problem. I want to see who gets stuck and how they describe being stuck.

  Give me a minute-by-minute timeline, the exact wording for each handout, the payoff scheme, and a debrief that maps specific moments onto the specific points (underdetermination by the data; the prior doing the work; the hypothesis space as a choice; the click not being evidence).

  Also: tell me what will predictably go wrong the first time I run it. I can already guess at a few — someone draws a distinction so baroque nothing could refute it, someone "solves" by vibes and can't articulate anything, someone builds their puzzle on their own drawing style (shaky hand, pen pressure) rather than on the vocabulary, and the physical cutouts end up coarser than the printed vocabulary so people cheat with arrangement on the table. But give me your list and how to handle each.

  And be honest about which feature of the real thing the activity can't reproduce and I'll have to supply in the debrief. My worry is that because everything is pre-symbolised on cards, the activity tests *selection among already-formulated hypotheses* and misses the perceptual work of constructing the description in the first place — which is arguably where Bongard problems actually bite. If that's right, say so, and tell me what the facilitator has to add so nobody walks out thinking they've understood the whole thing.
reasoning: |-
  We are designing a 90-minute session with 12 participants, in teams of 3. The goal is to have participants experience the underdetermination of rules by examples and the role of priors in selecting "natural" rules, without being told about Bongard problems upfront.

  Key features:
  - No definition of Bongard problems, no lecture.
  - Handout with two panels (left and right, each with 6 figures) and probe figures to classify.
  - Fixed vocabulary of primitives (shape, fill, size, count, relations: touching, overlapping, contained-in, separate) to build distinctions.
  - Two rounds: 
    1. Teams get a panel pair and probe cards. They place the probes and write three distinct consistent distinctions, then use a pre-made probe set to test their distinctions.
    2. Teams author a panel pair for another team, with a scoring scheme that rewards when solvers fail but penalizes if solvers find an alternative distinction that fits all examples and the author cannot provide a disambiguating example.

  Additionally, one planted panel pair with a relational distinction.

  Structure:

  Materials:
  - Vocabulary card (one per team)
  - Panel pair cards (each panel is a set of 6 figures, drawn on index cards or printed sheets). We'll have multiple panel pairs (at least 4, one of which is the relational one).
  - Loose probe cards (for Round 1, per team): 3-4 that can be classified by the rule the author intended, but also might be ambiguous under other rules.
  - Pre-made probe deck (for Round 1, per team): 5 extra probe cards designed to split common distinction types.
  - Blank index cards and colored markers for teams to create their own figures in Round 2.
  - Envelopes for Round 2.

  Timeline:

  0:00 - 0:10 (10 min): Introduction and forming teams
  - Welcome, form 4 teams of 3.
  - Hand out vocabulary card and Round 1 materials (one panel pair and 3-4 loose probe cards per team). Also give each team a set of blank cards and markers for later.

  0:10 - 0:40 (30 min): Round 1
  - Each team:
    a) Examines their panel pair (6 left, 6 right) and the vocabulary.
    b) Classifies the loose probe cards (place on left or right).
    c) Writes down three distinct distinctions (rules) that are consistent with the 12 training cards. They must use only the vocabulary. They rank the rules by which they think is most likely.
    d) Then, the facilitator hands out the pre-made probe deck (5 cards). For each probe card, the team must write down which side it would belong to under each of their three distinctions. They might find that their own distinctions disagree on some probes.

  0:40 - 0:50 (10 min): Sharing Round 1 results
  - Each team quickly reports: 
    - How many of their three rules agreed on the classification of the pre-made probes? Were there any probes that split their rules?
    - Which rule did they rank highest and why?

  0:50 - 1:10 (20 min): Round 2
  - Teams now create their own panel pair for another team. They draw:
    - 6 figures for the left panel (all satisfying the intended rule for left)
    - 6 figures for the right panel (all satisfying the intended rule for right and not the left rule)
    - They must also create 3 probe cards: one that clearly fits the left rule, one that clearly fits the right rule, and one ambiguous one (that might fit either or neither? but we might skip the ambiguous one to keep it simple). However, note that the probe cards are not used until after the other team solves. Instead, we are focusing on the scoring.

  Scoring scheme for Round 2:
  - The authoring team writes down their intended rule (using the vocabulary) and seals it in an envelope with their panel pair and the probe cards (if any) but note: the activity doesn't use probe cards in the same way as Round 1. Instead, we are going to have the solving team do two things:

    Step 1: The solving team (another team) gets the panel pair and must:
      a) Write down one rule they think is the intended distinction.
      b) Also, they must write down an alternative rule (if they can) that fits all 12 examples.

    Step 2: Then the envelope is opened and the author's rule is revealed.

    Scoring:
      - If the solving team fails to find any rule that fits the 12 examples (i.e., they say they can't find one), the authoring team gets 3 points.
      - If the solving team finds only one rule (the intended one) and no alternative, the authoring team gets 1 point.
      - If the solving team finds an alternative rule (that fits the 12 examples) and the authoring team cannot produce a new example (using the vocabulary) that distinguishes their rule from the alternative (i.e., a card that would be classified differently by the two rules), then the authoring team loses 1 point (collision penalty) and the solving team gets 1 point for finding an alternative.

    However, we must be cautious: the authoring team must be able to create a disambiguating example if an alternative is proposed. We'll provide blank cards and markers for this purpose.

    To avoid too much complexity, we might have the solving team only propose one alternative if they can, and then the authoring team must respond immediately.

    But note: the activity says "the solvers name a different distinction that fits all twelve cards". So if the solvers name an alternative, the authors must produce a card that separates the two rules (i.e., one rule says left, the other says right). The authors have the vocabulary and materials to draw such a card. The facilitator can verify if the card is within vocabulary and if it indeed separates.

    We want to reward authors for making puzzles that are "hard" in the sense that they rely on naturalness and the solver fails, but penalize if there is an equally consistent alternative that they cannot refute.

    We'll use chocolate as currency: each point is a chocolate coin or similar.

  1:10 - 1:20 (10 min): Solving Round 2 puzzles
  - Teams swap puzzles (each team gets one puzzle from another team). They have 10 minutes to:
    a) Write down the intended rule (as they see it).
    b) If they can, write down an alternative rule that fits all 12 examples.

  1:20 - 1:30 (10 min): Scoring Round 2
  - Teams reveal their intended rules and the solvers present their rules.
  - If the solvers found an alternative, the authors must try to produce a disambiguating example (drawn on a blank card). The facilitator and the group check if the example is valid (within vocabulary) and if it indeed classifies differently under the two rules. If the authors cannot, they lose a point (and the solvers gain one). Otherwise, the authors get their points as above.

  1:30 - 1:40 (10 min): Whole group discussion and debrief

  Debrief points:
  1. Underdetermination: Even with 12 examples, there are multiple rules that fit. We saw this in Round 1 when teams had to write three rules and then found that the probe cards forced them to see that the rules made different predictions.
  2. The role of prior: When ranking rules, we chose the one that seemed "natural" (simpler, more intuitive). But that is not necessarily the one the author intended. The click of insight is not evidence of having found the intended rule, just a rule that fits and feels natural.
  3. Hypothesis space as a choice: The vocabulary we used limited what distinctions we could see. In particular, if we only look at properties of individual figures, we miss relational properties. (Point to the planted relational problem: ask who had it? How did they describe the rule? Did they get stuck? How did they articulate the relational aspect?)
  4. The moment in Round 2: Authors were rewarded when solvers failed, but penalized if they couldn't refute an alternative. That forced authors to think about what makes a rule "natural" and how to design examples that break alternative rules.

  What might go wrong:

  1. Overly complex rules: A team might write a rule that uses many conditions and is hard to refute. In Round 2, if an author creates such a rule, it might be hard for solvers to find an alternative. But then the authors get rewarded because solvers fail. However, if the rule is too complex, the solvers might not even find the intended one. We can mitigate by encouraging simplicity in the instructions? But note: we want to show that complex rules are possible but not natural. In the debrief, we can point out that the scoring in Round 2 didn't penalize complexity, but the solvers' failure is what rewards the authors. Alternatively, we might adjust the scoring: if the solvers fail to find any rule, authors get 3 points. But if the solvers find an alternative and the authors cannot refute, then authors lose. So complex rules that are refutation-proof might be safe, but they are hard to create and might not be natural. We can also note that the vocabulary is limited so the rules are bounded.

  2. Solvers use "vibes": They might not articulate a rule. We require them to write down the rule in the vocabulary. So they must use the primitives. The facilitator should emphasize that.

  3. Authors draw outside the vocabulary: We have the vocabulary card. The facilitator must check that the figures are built from the vocabulary. For example, if the vocabulary says shapes are circle, square, triangle, then they shouldn't draw a star. We can have a list of allowed shapes, fills, etc.

  4. Physical cutouts: To prevent cheating with arrangement, we can have each figure on a separate card and instruct teams to consider the panel as a set of figures (so arrangement on the table shouldn't matter). The relations (touching, etc.) are between figures on the same panel, so the arrangement might matter. We can say: "Each panel is a set of figures. When considering relations, you may arrange them as you like, but the rule should be about the properties of the set (e.g., whether any two touch, etc.)."

  What the activity misses:
  - The perceptual work: Because the figures are pre-drawn and the vocabulary is given, the participants are not doing the low-level feature extraction. They are working at the symbolic level. In real Bongard problems, the "click" often involves seeing a new way to describe the figures. To address this, in the debrief, we can note that in real problems, the set of features is not given, and the act of describing the figure is part of the challenge. We can show a real Bongard problem at the end and ask them to solve without the vocabulary, to highlight the difference.

  Revised timeline with more detail:

  0:00-0:10 (10 min): Introduction
  - "Welcome! Today we're going to do a group activity about pattern recognition. We'll work in teams of three. Each team will get a set of cards: two panels (left and right) and some loose cards. Your job is to figure out a pattern that distinguishes the left from the right. But note: we're going to give you a fixed set of building blocks (the vocabulary card) that you must use to describe the patterns. Let's get into teams."

  0:10-0:40 (30 min): Round 1
    - Teams work on:
      Step 1: Place the loose probe cards (3-4) on left or right. (They can set them aside for now.)
      Step 2: Write down three distinct rules (using the vocabulary) that are consistent with the 12 examples. They must be different and they must rank them (1=most likely, 3=least likely).
      Step 3: Receive the pre-made probe deck (5 cards). For each probe, they write down the classification under each of their three rules. They might find disagreements.

  0:40-0:50 (10 min): Quick share
    - Each team: "Did your rules agree on all the pre-made probes? If not, on how many? Which rule did you rank highest?"

  0:50-1:10 (20 min): Round 2 - Authoring
    - Teams create their own panel pair (6 left, 6 right) and write down their intended rule (using the vocabulary). They put the panel cards and the rule (sealed) in an envelope. They can also create 3 probe cards (optional, but we might skip to save time). We focus on the panel pair.

  1:10-1:20 (10 min): Solving Round 2
    - Each team gets an envelope from another team. They open the envelope and take out the panel pair (but not the rule). They must:
      - Write down what they think is the intended rule (using vocabulary).
      - If they can, write down an alternative rule (also using vocabulary) that fits all 12 examples.

  1:20-1:30 (10 min): Scoring
    - Teams open the sealed rule and compare.
    - If the solvers did not write any rule (they failed), the authors get 3 chocolates.
    - If the solvers wrote only the intended rule (or one that is equivalent) and no alternative, the authors get 1 chocolate.
    - If the solvers wrote an alternative rule that is different, the authors must produce a new example (a card) that is classified differently by the two rules. They draw it on the spot. If they succeed, no penalty (authors keep whatever they had). If they fail, authors lose 1 chocolate (if they had 1, they give it to the solvers; if they had 3, they give 1 to the solvers and keep 2). And the solvers get 1 chocolate for finding an alternative.

    Note: We must ensure that the alternative rule is indeed consistent with the 12 examples. The facilitator and the group can check.

  1:30-1:40 (10 min): Debrief

  Planted relational problem:
    We'll create one panel pair that has a relational rule. For example:
