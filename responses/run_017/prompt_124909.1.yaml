prompt: |-
  You are a political philosopher and institutional economist who has spent a decade advising regulators, standards bodies and collective-action funders on why coordination fails, and who is unusually good at turning game-theoretic ideas into checklists that intelligent non-specialists can actually run. Please think carefully before you write: brainstorm two or three candidate procedures, note in a sentence or two what each one loses, and then give me the one you recommend. Write the whole thing in British English.

  I direct the secretariat of a small philanthropic fund that makes around twenty-five grants a year, mostly between £200k and £2m, to interventions whose stated purpose is to stop a race to the bottom in some domain: a voluntary cap, a shared audit standard, a no-first-use pledge, a joint liability arrangement, an information-sharing or monitoring scheme. Our analysts get roughly one working day per proposal, the proposal pack is often thin on the numbers, and the final decision is made by a committee of seven trustees, four of whom have no economics or philosophy background and will not read anything longer than four pages. Last year we funded a voluntary moratorium in one sector and watched the race reappear a few months later as a fight over who got to write the standard, and I do not want to repeat that. So I need a decision procedure my analysts can run on any such proposal: the questions in order, what counts as a sufficient answer to each, the gates where we simply stop with a no, the gates where we hand the decision to the trustees because the question is one of values rather than facts, and an explicit flag on every step that is really a judgement call dressed up as a procedure. Tell me what an analyst should do when a number cannot be obtained. Keep the procedure itself to something readable in fifteen minutes.

  I also want you to build in, as explicit steps, some distinctions that our discussions keep collapsing. First, whether the bad outcome is genuinely structural, in the sense that each party would prefer the outcome in which nobody races yet each still gains by racing, or whether it is really produced by a handful of identifiable actors whose behaviour we could sanction directly, because the two call for very different interventions. Second, the entrant margin: even if the post-intervention payoff matrix makes restraint rational for existing signatories, would a new actor who never signed still find defection dominant, and is that actor likely to matter? Third, axis relocation: suppressing a race along one dimension usually moves it to another, such as jurisdictional arbitrage, acquisition of the restrained, redefinition of the metric, or competition among the monitors, so require the proposal to name the axis the race is expected to move to and why competition there is less destructive. Fourth, detection latency: if the gains from defection land before defection can be verified, no monitoring regime saves the arrangement. Fifth, whether the good being competed away is one the racers themselves value, one that only outsiders value, or one nobody values, and what follows for each. Sixth, the asymmetry question, whether the arrangement degrades gracefully when it partly fails or fails catastrophically, and who bears the residual risk, including people who never signed. Finally, apply the procedure once recursively to whoever enforces the arrangement, since enforcers are themselves subject to races.

  Then run the finished procedure on three proposals and show your working, including where it stalls. One: a pledge among nine frontier AI developers not to train above a stated compute threshold until a shared evaluation regime exists, with signatories covering most but not all of the credible actors, and with the evaluators funded by the developers themselves. Two: a common third-party safety and quality audit standard written and adopted by fifteen small and mid-sized firms in a fragmented subcontracting industry, while the four largest buyers, who hold around sixty per cent of the market, have declined to sign and say they will revisit it next year; compliance costs fall mostly on the signatories. Three, and this is the one where I expect an answer I will not like: a two-year convening and norm-building programme we have already half-promised to an ally, consisting of a secretariat, an annual summit, a shared vocabulary and a pledge text, with no monitoring and no change to anyone's payoffs, which several trustees are enthusiastic about. Be blunt about what the procedure says on that one, and do not soften it to keep me happy. Close with a short section on what the procedure cannot do: the kinds of race it is structurally blind to, the proposals it will systematically underrate, and the failure mode in which having a procedure becomes a reason to fund nothing at all.
reasoning: |-
  Okay, I need to tackle this complex request from someone who runs a philanthropic fund focused on preventing races to the bottom. The user wants a decision procedure that analysts can apply in a day, presenting trustees with clear recommendations. 

  First, I'll recall key game theory concepts relevant to coordination failures: prisoner's dilemmas, assurance games, free-rider problems. The user specifically mentioned structural problems vs bad actors, entrant margins, axis relocation etc. - these map to concepts like Nash equilibria, incentive compatibility, and enforcement credibility.

  The user's frustrations are clear: last year's failed moratorium shows they need better filters. The trustees' constraints (limited time/background) mean the procedure must produce binary outcomes or clear value judgments. 

  I consider three procedural approaches:
  1) A strict sequential gate model (rigorous but might reject nuanced cases)
  2) A scoring system (flexible but invites gaming)
  3) A diagnostic tree leading to clear decision types (balances rigor with practicality)

  The diagnostic tree seems best - it forces explicit confrontation of critical failure points while accommodating judgment calls. The other options lose either adaptability or objectivity.

  Now structuring the procedure around the user's required distinctions:
  - Start with structural test (true coordination problem?)
  - Then entrant vulnerability
  - Axis relocation planning
  - Detection feasibility
  - Value source analysis
  - Failure mode assessment
  - Enforcer stability check

  For unattainable numbers, I'll build in "judgment call" flags and require explicit uncertainty notation. The trustees need to see where analysts reached limits.

  Testing on the three proposals:
  The AI pledge fails on enforcer incentives (they're funded by developers!). The subcontracting standard might work if buyers can be pressured later. The norm-building program... oof. The procedure will brutally show it changes no incentives. Must be honest even though user expects to dislike this conclusion.

  Finally, the caveats: this won't catch value destruction races or commitment problems from overlapping institutions. And yes, sometimes procedures become excuses for inaction - will warn trustees explicitly.

  The tone needs to be professionally blunt, especially about the "half-promised" proposal. No sugarcoating while maintaining British English conventions like "collective action problem" not "collective action issue".
answer: |-
  ## Coordination Intervention Assessment Protocol (CIAP)  
  *For Analysts: Follow sequentially. Stop at first "No". Escalate at "Trustee Judgment". Flag all "Judgment Call" steps explicitly. Allow 1 working day.*

  **1. Structural Trap Test**  
  *Q: Is the race genuinely structural? (i.e., all parties prefer mutual restraint but have individual incentives to defect, absent enforcement)*  
  - **Sufficient Answer:** Payoff matrix (estimated) shows dominant strategy to defect pre-intervention.  
  - **No if:** Proposal identifies <3 "bad actors" causing the race; sanctioning them directly is feasible.  
  - **Judgment Call:** Estimating payoffs from thin data. If numbers unobtainable, map qualitative incentives (e.g., "Firm A gains 20% market share by undercutting safety"). Flag uncertainty.  
  - **Trustee Escalation:** Only if "structural" but actors could be sanctioned (values question: is collective action preferable to targeted sanctions?).

  **2. Entrant Vulnerability**  
  *Q: Would a credible non-signatory find defection dominant post-intervention?*  
  - **Sufficient Answer:** Analysis shows new entrants gain materially by ignoring the standard/cap.  
  - **No if:** Barriers to entry are prohibitive OR non-signatories control <10% market share/impact.  
  - **Judgment Call:** Assessing "credible" entrants & market share thresholds.  
  - *Gatekeeper Step: Stop here if "Yes" and entrants likely (>30% probability) within intervention timeframe.*

  **3. Axis Relocation Forecast**  
  *Q: Does the proposal explicitly identify where competition will relocate and argue it’s less harmful?*  
  - **Sufficient Answer:** Specific axis named (e.g., "competition shifts from safety cuts to speed of iteration; we accept this because...").  
  - **No if:** Relocation axis absent OR argument unconvincing (e.g., "competition moves to regulatory lobbying" without showing reduced harm).  
  - **Judgment Call:** Assessing "less harmful". Require comparative risk assessment (qualitative OK).  
  - *Gatekeeper Step: Stop here if "No".*

  **4. Detection Latency Check**  
  *Q: Can defection be verified BEFORE defectors gain material advantage?*  
  - **Sufficient Answer:** Monitoring detects defection faster than defector’s payoff horizon (e.g., audit frequency < quarterly if gains accrue monthly).  
  - **No if:** Gains from defection are front-loaded and irreversible (e.g., capturing market share before detection).  
  - **Judgment Call:** Estimating detection speed vs. payoff accrual. Default to "No" if latency >3x payoff period.  
  - *Gatekeeper Step: Stop here if "No".*

  **5. Value Source & Burden**  
  *Q: Who values the preserved good, and who bears compliance costs?*  
  - **Sufficient Answer:** Clear mapping:  
    - Racers value good → Higher compliance likelihood.  
    - Outsiders value good → Requires external enforcement.  
    - Nobody values good → Stop (pointless).  
  - Costs must align: Racers bear costs if they value good; outsiders subsidise if outsiders benefit.  
  - **No if:** Costs fall on racers for externally valued goods without offsetting subsidies.  
  - **Trustee Escalation:** If trade-off between cost-bearers and beneficiaries requires ethical weighting.

  **6. Asymmetry & Failure Grace**  
  *Q: Does the arrangement degrade gracefully? Who bears residual risk?*  
  - **Sufficient Answer:** Identifies failure scenarios (e.g., 1-2 defectors) and mitigation (e.g., partial sanctions). Residual risk not dumped on non-signatories.  
  - **No if:** Single defection triggers collapse OR non-signatories disproportionately harmed.  
  - **Judgment Call:** Assessing "graceful degradation". Require at least one contingency plan.

  **7. Enforcer Stability Review**  
  *Q: Apply Steps 1-6 recursively to the enforcement body.*  
  - **Sufficient Answer:** Enforcer’s incentives are aligned and resistant to races (e.g., independent funding, transparent governance).  
  - **No if:** Enforcer faces conflicts of interest (e.g., funded by racers) OR is itself vulnerable to races.  
  - **Judgment Call:** Gauging enforcer’s credibility. Prioritise structural independence.

  ---

  ### Application to Proposals

  **Proposal 1: AI Compute Cap Pledge**  
  - **1. Structural:** Yes (training advantage tempts defection).  
  - **2. Entrants:** **NO** – Non-signatory startups/govts could race ahead. High likelihood. *Stop. Do not fund.*  
    *Analyst Note: "Credible actors" exclude China-based firms & open-source collectives. Defection dominance clear for entrants.*  

  **Proposal 2: Subcontracting Audit Standard**  
  - **1. Structural:** Yes (cost-cutting race on safety).  
  - **2. Entrants:** **Trustee Judgment** – Non-signatory buyers (60% market) could defect by accepting cheaper, non-compliant subs. Analyst flags: "Buyers’ ‘revisit later’ suggests vulnerability".  
  - **3. Axis Relocation:** **NO** – Proposal silent on relocation. Likely shift to jurisdictional arbitrage (non-signatory buyers use overseas subs). *Stop. Do not fund.*  
    *Analyst Note: Relocation obvious; failure to address concerning.*  

  **Proposal 3: Norm-Building Summit**  
  - **1. Structural:** **NO** – Changes no payoffs. No enforcement. Merely "discussing" norms. *Stop. Do not fund.*  
    *Analyst Note: Bluntly: this funds process, not coordination. Zero impact on incentives. Payoffs unchanged, detection/monitoring absent. Fails Step 1 conclusively.*  

  ---

  ### What CIAP Cannot Do  
  **Structural Blind Spots:**  
  - Races where defection isn’t dominant but occurs due to misperception (assurance games).  
  - Value-destruction races (e.g., competing to erase cultural heritage).  

  **Systematic Underrating:**  
  - "Trojan horse" interventions creating infrastructure for future enforcement.  
  - Pre-emptive coordination in nascent industries with no data.  

  **Failure Mode:**  
  CIAP risks rejecting all proposals if applied hyper-rigorously. Mitigate by:  
  - Requiring analysts to note "marginal improvements" even at "No" gates.  
  - Trustees reviewing all "No" outcomes for exceptional cases (values override).  

  **Final Recommendation:**  
  Use CIAP as a filter, not a straitjacket. Its strength is forcing confrontation with hard game-theoretic realities – as your AI pledge failure exemplified. Fund only proposals passing all gates or with Trustees consciously overruling a "No" due to values. Defund "talk shops" relentlessly; they distract from genuine coordination.  

  ---  
  **Analyst Guidance Summary:**  
  - At missing numbers: Map qualitative incentives, flag uncertainty, state assumptions.  
  - At "Judgment Calls": Write 1-sentence justification.  
  - At "No": Stop analysis, cite the gate.  
  - At "Trustee Judgment": Summarise the value conflict in ≤3 bullet points.
