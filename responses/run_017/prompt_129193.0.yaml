answer: |-
  ## Proposal: Parameterizing Contrast in Historical Explanation - Diagnosing Stalemates in the Great Divergence Debate

  **1. Research Question & Core Problem:**
  Why has the longstanding debate surrounding the "Great Divergence" (why sustained industrial growth emerged first in Britain/Western Europe, *not* elsewhere) and the related "Needham Question" (why the "Scientific Revolution" occurred in Europe, *not* in China despite its earlier lead) persistently stalled? This proposal argues that the central contrastive question – "Why Britain (or Europe) and *not* China?" – is fundamentally **under-specified**, acting as an engine for pseudo-disagreement. Its lack of key parameters obscures whether disputants are genuinely disagreeing about causes or merely answering different implicit questions. The core aim is to identify, rigorously define, and operationalize these hidden parameters to diagnose the debate's impasse and provide tools for formulating tractable contrastive historical questions.

  **2. The Under-Specification Problem & Existing Approaches:**
  The appeal of the "Britain/Europe vs. China" contrast lies in its starkness. However, standard approaches within the historiography and philosophy of explanation fail to resolve its inherent ambiguities:

  *   **Philosophy's "Off-the-Shelf" Contrastivism:** Standard contrastive accounts of explanation focus on the structure `Why P rather than Q?`, assuming `Q` is a well-defined, relevant alternative. They provide frameworks for *evaluating* explanations *given* a fixed contrast, but offer insufficient tools for diagnosing *why* a particular contrast (`Q`) might lead to persistent disagreement or conceptual confusion. They assume the question is well-posed.
  *   **Historiographical Practice:** Debate participants often tacitly shift the ground. Some emphasize macro-civilizational traits (e.g., institutions, culture), others micro-regional factors (e.g., specific coal deposits, local innovation networks), and yet others distinct outcomes (e.g., steam power vs. systematic experimentation). Positions are frequently defended without acknowledging these underlying shifts, leading to cross-talk. Existing historiographical critiques often focus on ideological biases or data limitations, overlooking the *logical structure* of the question itself as a source of confusion.
  *   **Abandonment Critique:** The critique that the question is irredeemably Eurocentric or ideologically loaded is valid but incomplete. Simply abandoning the question forfeits the explanatory potential inherent in well-formed comparative history. The challenge is to *reformulate* the question rigorously, not necessarily discard comparative inquiry.

  **3. The Two Core Parameters:**
  The impasse stems primarily from the unstated variation along two dimensions within the question "Why Britain/Europe and not China?":

  *   **Parameter 1: Level/Scale of Aggregation:** The question does not specify the *unit size* or *level of analysis* at which the comparison is drawn. Is it comparing:
      *   Entire, internally heterogeneous civilizational units ("Europe" vs. "China")?
      *   Specific, functionally similar core regions (e.g., Yangtze Delta vs. English Midlands)?
      *   National states (England vs. Qing Empire)?
      *   Local communities?
      Crucially, **explanatory factors may not be scale-invariant.** A factor (e.g., property rights regimes) deemed crucial at the macro-civilizational level might lose salience or manifest differently at a regional level, while a micro-level factor (e.g., a specific artisan tradition) may be insignificant macroscopically. Disagreement often arises when arguments valid at one scale are mistakenly applied or contested at another, without recognizing the scale-dependency.
  *   **Parameter 2: Outcome Bundling:** The question does not specify *which precise outcome* is being contrasted. The "Divergence" and "Scientific Rise" are complex conjuncts:
      *   Sustained increase in per capita output?
      *   Mechanization of production (esp. textiles)?
      *   Harnessing of fossil fuels (coal/steam)?
      *   Development of systematic, mathematized natural philosophy?
      *   Some package (e.g., "industrial capitalism" or "modern science")?
      **Explanations for these conjuncts may be partly independent.** Factor X might powerfully explain mechanization but be irrelevant to sustained per capita growth; Factor Y might explain mathematization but not fossil fuel adoption. Asking "why Outcome-Bundle O occurred in A but not B" is ill-posed if the bundle's components have divergent causal histories. Disagreement can stem from proponents emphasizing explanations valid for different sub-components of the bundled outcome.

  **4. The Third Challenge: The Residue Problem of Contrast Classes:**
  The selection of "China" as the contrast often stems *only* from its *lack* of the specified outcome(s). This risks making the contrast class (`not-Britain/Europe`) a residual category defined solely by absence, rather than a set of entities sharing relevant similarities *except* for the outcome. This raises a critical worry: **Does "Why Britain/Europe and not China?" carry any more explanatory information than the singular "Why Britain/Europe?"?** If the contrast class is merely "everywhere that didn't have the outcome," the contrast adds little beyond highlighting the outcome's uniqueness. A genuine contrastive question requires a contrast class sharing relevant background conditions where the outcome was *plausibly possible* but did *not* occur. The proposal will develop a **Plausible Alternative Condition (PAC)**: For a contrastive question "Why P in A rather than Q in B?" to be well-posed, B must represent a context where, given shared relevant background knowledge, Q was a plausible alternative outcome to P in A. Applying PAC to the "China" case forces explicit justification: *Why* was the specified outcome(s) plausibly expected in *this specific context* (China) at *this specific scale*? Failure to meet PAC signals a poorly formed question.

  **5. Methodology (6-Month Plan):**
  This conceptual project requires no new archival research or quantitative analysis. Work will involve rigorous logical analysis, conceptual refinement, and engagement with secondary historical literature to illustrate and test parameters.

  *   **Month 1:** **Problem Articulation & Parameter Definition:** Finalize precise definitions of Scale Parameter (defining hierarchical levels: civilizational, macro-regional, state, sub-state region) and Bundling Parameter (disaggregating "Great Divergence" and "Scientific Rise" into core sub-outcomes). Formalize the Plausible Alternative Condition (PAC).
  *   **Month 2:** **Scale Variance Analysis (I - Macro):** Apply Scale Parameter to existing macro-historical arguments (e.g., institutional, cultural, geographic). Analyze how scale assumptions shape factor selection and debate structure. Identify instances where disagreement stems from unacknowledged scale shifts. Test PAC for "China" at civilizational scale.
  *   **Month 3:** **Scale Variance Analysis (II - Meso/Micro):** Apply Scale Parameter to regional/comparative studies (e.g., Yangtze vs. England, specific industries). Examine how explanatory factors change prominence with scale shift. Assess if apparent contradictions across scales are resolvable via parameterization. Test PAC for specific Chinese regions.
  *   **Month 4:** **Outcome Bundling Analysis:** Apply Bundling Parameter to historiographical positions. Map which arguments target which specific sub-outcomes (e.g., coal adoption, textile mechanization, Newtonian synthesis). Identify debates where disagreement reflects bundled vs. unbundled explananda. Test whether bundled explanations are coherent or mask divergent causalities.
  *   **Month 5:** **Integrating PAC & Diagnosing Question Formation:** Synthesize findings. Develop a diagnostic framework: Can a given "Why A not B?" question regarding the Divergence/Science rise be made tractable by specifying Scale, Outcome, and meeting PAC? Apply rigorously to "China" and potential alternative contrasts (e.g., Mughal India, Tokugawa Japan?).
  *   **Month 6:** **Tool Development & Deliverable Structuring:** Translate diagnostics into practical tools for historians. Draft the core deliverable: A clear protocol for formulating and assessing contrastive historical questions. Finalize proposal manuscript.

  **6. Why This Approach?**
  *   **Beyond Standard Contrastivism:** Unlike applying pre-packaged philosophical contrastivism, this project *diagnoses why standard contrastive frameworks fail* for complex historical cases, focusing on question *formation*.
  *   **Beyond Abandonment:** Rather than dismissing the questions as irredeemable, it provides a rigorous method to *reformulate* them into potentially answerable forms, preserving comparative value while mitigating ideological pitfalls through explicit parameterization and PAC.
  *   **Conceptual Precision:** It addresses the *specific logical structure* of the impasse in these debates, offering precise tools (Scale, Bundling, PAC) unavailable elsewhere.

  **7. Deliverables:**
  The primary deliverable is a **Practical Diagnostic Protocol for Historians**, comprising:
  1.  **A Template for Specifying Contrastive Questions:** Mandating explicit declaration of: (a) Scale/Unit of Analysis, (b) Precise Outcome (or sub-outcome) under Contrast, (c) Justification for the Contrast Case meeting the Plausible Alternative Condition (PAC).
  2.  **A Diagnostic Checklist:** To assess existing arguments/questions: Is disagreement traceable to unstated differences in Scale? Outcome Bundling? Or failure of the contrast to meet PAC?
  3.  **Illustrative Application:** Demonstrating how applying the protocol to the Great Divergence/Needham Question debates clarifies sources of confusion and potentially reconfigures the research agenda.

  This protocol will be presented in a polished research paper suitable for publication in a history/philosophy of history journal, providing historians with concrete conceptual tools.

  **8. Success & Failure Criteria:**
  *   **Success:** The project succeeds if it:
      *   Demonstrates convincingly that unstated Scale and Bundling parameters *systematically* underlie major strands of disagreement in the target debates.
      *   Develops a workable, clear Plausible Alternative Condition (PAC) that meaningfully distinguishes genuine contrastive questions from singular questions disguised as contrastive.
      *   Produces a diagnostic protocol that practicing historians find *useful* for identifying sources of confusion in their own comparative work and formulating clearer questions.
      *   Shows that applying the protocol to "Why Britain/Europe not China?" yields distinct, potentially more tractable research questions depending on parameter choices.
  *   **Failure:** The project fails if:
      *   The proposed parameters (Scale, Bundling) are shown *not* to be significant sources of the observed disagreements (e.g., if disagreements persist even when parameters are fixed).
      *   The Plausible Alternative Condition (PAC) proves **vacuous**: Either it certifies *every* proposed contrast (e.g., "Why Britain not the Moon?") as well-posed because it adds no substantive constraint, *or* it condemns *every* historical contrast (like China) as illegitimate, rendering comparative history impossible. This is the critical "technical redescription of 'it's complicated'" failure mode.
      *   The diagnostic protocol is deemed by historians to be merely a cumbersome restatement of the obvious ("you need to define your terms") without providing novel leverage or practical guidance for resolving disputes or designing research.
      *   The analysis cannot move beyond critique to generate any positive, plausible reformulations of the core questions that meet the protocol's own standards.

  **Conclusion:**
  This project tackles the conceptual logjam in debates about pivotal world historical transitions by exposing and rectifying the under-specification inherent in their central contrastive questions. By rigorously defining Scale, Outcome Bundling, and the Plausible Alternative Condition, and translating these into a practical diagnostic protocol, it aims to transform a source of persistent confusion into a tool for clarity. The deliverable empowers historians to pose better questions, leading to more productive debate and potentially more robust explanations for why the modern world took the shape it did.
