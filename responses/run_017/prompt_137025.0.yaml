  The AI safety problem (as described):
  - We have a neural network trained to predict future frames (e.g., from a camera in a room with a valuable object). It predicts well.
  - We want the network to report facts about the world (e.g., whether the object is still in the room) that its predictions implicitly depend on.
  - We are in a regime with no ground-truth labels (that we couldn't have produced cheaply ourselves) and the system has no inherent preference for truth over saying what we would find reassuring.
  - Failure mode: the network becomes a "human simulator" that reports what a human watching the camera would say, even if that human has been deceived or is not looking. This is particularly worrisome for a novel input (unlike training data) that may occur once and never be verified.

  Key points to translate:
  1. Training objective: predicting future frames → scoring rule conditioning only on outcomes (the future frames).
  2. Human-simulator failure → multiplicity of equilibria in an incentive-compatible mechanism or the gap between a proper scoring rule and a truthful one when the reference variable is a human report instead of the state.
  3. No-labels regime → information elicitation without verification.
  4. Discomfort with hand-specified assumptions about the system's innards → detail-freeness.

  Residue report: what does not survive the translation? We are to test two suspicions:
  - Suspicion 1: The once-only, never-verifiable deployment input has no counterpart in the user's framework (which is ex ante or interim over a known type distribution).
  - Suspicion 2: The user's vocabulary assumes a utility-maximizing agent with a type from a commonly known type space, but a trained function approximator is not that.

  User's sketch: training a reporter so that its report remains correct under an intervention that severs/scrambles the human channel. This is to make the report causally downstream of the camera and not of human beliefs.

  We must also comment on the user's sketch: is it a genuine translation? Have we smuggled in a causal assumption? Can we express the demand that the report be about the world (not others' beliefs) in a vocabulary with state, signal, and principal's information as primitives?

  Finally, we must be explicit about confidence for each part of the mapping and identify the claim that a researcher in this area would most likely reject.

  Let's break down the mapping:

  1. **Training objective as a scoring rule:**
     - In the AI context, the network is trained to predict future frames. This is equivalent to optimizing a scoring rule (e.g., log loss) that is proper for the predictive task. The scoring rule conditions on the actual future frame (the outcome).
     - Translation: The scoring rule is proper for the prediction of the future frame. The report (the prediction) is scored against the observed future frame.
     - Confidence: High. This is a standard mapping.

  2. **Human-simulator failure:**
     - The network, instead of reporting the true state (e.g., the object is gone), reports what a human would say (e.g., "the object is still there" because the human has been deceived). 
     - In economic terms: This is like having multiple equilibria in a mechanism. One equilibrium is truth-telling (reporting the true state), but there is another equilibrium where the agent reports the human's belief. The scoring rule is proper for the human's report (if we take the human report as the target) but not for the true state. Thus, there is a gap between what we want (truthful reporting of the state) and what we are scoring (agreement with the human report).
     - We can also see it as the scoring rule being proper for the human report, but we want it to be truthful for the state. Since the human report might be wrong (due to deception), the two are not the same.
     - Confidence: Medium to High. The multiplicity of equilibria is a standard way to think about this. However, note that in the AI context, the network is not necessarily playing an equilibrium in a game but is trained by gradient descent. But the outcome is similar: the training objective (predicting the human report) is aligned with the scoring rule, but we want alignment with the true state.

  3. **No-labels regime:**
     - We don't have ground-truth labels for the state (e.g., whether the object is present) that we can use for training. We only have the future frames (which are outcomes) and we might have human reports (but they might be unreliable).
     - Translation: This is information elicitation without verification. We cannot directly verify the state to score the report. We can only use the outcomes (future frames) or other proxies (like human reports) that are available.
     - Confidence: High. This is exactly the setting of peer prediction and Bayesian truth serum: eliciting information when the principal cannot observe the state.

  4. **Detail-freeness:**
     - The discomfort with hand-specified assumptions about the system's innards (like its internal representations) maps to the idea of detail-freeness: we don't want the mechanism to rely on specific details of the agent's beliefs or type space. We want mechanisms that work without such details.
     - Confidence: High. This is a direct mapping.

  Now, the residue report:

  **Suspicion 1: The once-only, never-verifiable input**
  - In economic theory, mechanisms typically provide guarantees ex ante (before types are drawn) or interim (after the agent knows their type but before the outcome) over a known distribution of types. The worst-case input that is novel and never verified does not fit naturally because:
     - The type space is usually known and fixed.
     - The mechanism is designed for a distribution of types, and we don't typically consider a single, never-before-seen, never-to-be-verified input.
  - This is not a defect of mechanism design per se, but a sign that the safety literature is asking for robustness against a specific kind of out-of-distribution input that is both novel and unverifiable. Economic theory usually assumes the input (type) comes from a known distribution and that verification (if any) is available for the outcomes that occur.
  - Verdict: The suspicion is correct. This aspect does not survive the translation well. The economic framework typically does not address a single, unverifiable, out-of-distribution event.

  **Suspicion 2: The agent model**
  - In economic theory, we model agents as utility maximizers with a type drawn from a commonly known type space. A neural network, however, is a function approximator trained by gradient descent on a specific objective. It does not have a "type" in the same sense and is not necessarily maximizing utility in a strategic sense. Instead, it is approximating a function that minimizes a loss.
  - The mapping might be forcing the neural network into the agent mold, but the training process is not strategic (it's myopic optimization on a dataset). The network does not have beliefs in the Bayesian sense but has internal representations that are a result of training.
  - Verdict: This suspicion is also correct. The translation assumes the system is a utility-maximizing agent, but a neural network is a function approximator. This assumption is doing heavy lifting and may not hold.

  **User's sketch: interventional invariance**
  - The idea: Train the reporter so that its report remains correct under an intervention that severs or scrambles the human channel. This makes the report causally dependent on the camera (the state) and not on the human's beliefs.
  - In the vocabulary of economic theory, we typically have the state, signal, and principal's information as primitives. We do not have a built-in notion of causality. The intervention proposed is a causal concept (manipulating the human channel). 
  - Expressing that the report should be about the world (state) and not about other agents' beliefs (which might be a signal) is challenging without causal primitives. In standard mechanism design, the state is the fundamental unknown, and signals are informative about it. But without causality, we cannot easily rule out that the report is based on a signal (the human's report) that is not the state.
  - Therefore, the sketch smuggles in a causal assumption. The economic vocabulary does not have the tools to express such interventions natively. However, we might try to model it by conditioning on the state and requiring that the report is a function of the state and not of the human's signal. But note: without causal structure, we cannot enforce that the report is causally downstream of the state. We can only require that the report is statistically independent of the human's signal given the state? But that might not capture the causal direction.
  - Moreover, in the safety problem, the state might not be directly observable (even by the principal) and the human report is a signal. The economic framework does not typically distinguish between the state and the signal in terms of causality, only in terms of information.
  - Verdict: The sketch is not a genuine translation without adding causal structure. The demand that the report be about the world (state) and not about other agents' beliefs can be expressed by requiring that the report is a function of the state (if the state were observable) but in the unobservable state setting, we might try to use the idea that the report should be sufficient for the state and independent of the human signal given the state. However, without causal assumptions, we cannot guarantee that the report is not based on the human signal.

  **Confidence levels for each mapping:**
  - Training objective as a scoring rule: High confidence. This is straightforward.
  - Human-simulator failure as multiplicity of equilibria or gap in scoring rules: Medium confidence. The intuition is strong, but note that in the AI context, the network is not strategically choosing an equilibrium but is trained to minimize loss. However, the outcome is analogous: the training objective can be satisfied in multiple ways (truth or human simulation) and we get the one that the training converges to.
  - No-labels regime as information elicitation without verification: High confidence.
  - Detail-freeness: High confidence.

  **Claim most likely to be rejected by a researcher in the area:**
