prompt: |-
  I work as an actuary at a life insurer, mostly on the valuation and hedging of a book of very long-dated annuities — some of the cashflows in our projection model run past 2100 — and I have been asked to draft an internal note on how climate change should enter the way we value and manage them. Two things in our current practice are provoking the question. First, we discount off what we call the 'cliff' curve: a market-consistent curve out to about thirty years, after which we splice on a flat rate that someone in risk set years ago, on the stated grounds that the market curve is not informative at that horizon; I have started to suspect that this splice is doing enormous ethical work under the cover of being a modelling convention. Second, a client has asked for a single figure: the share of our liabilities attributable to people born after 2050. My director wants the number, I am not sure it is a coherent thing to ask for, and a colleague has proposed we handle it by what she calls a 'fixed reference population' convention — hold the composition of the future population fixed across policy scenarios so that every comparison has a stable baseline, even though we know the scenarios themselves change who exists. I want to know whether that convention is a bookkeeping convenience or a substantive moral commitment that has quietly settled the question before anyone argues about it.

  What I would like from you is a systematic translation, not a summary. Take three things that I have only encountered at second hand — the dispute in climate economics over the social discount rate (Stern against Nordhaus, and the Ramsey rule where the rate decomposes into a pure rate of time preference plus inequality aversion times growth), the non-identity problem, and the precautionary or catastrophe-avoiding style of argument about extinction risk — and restate each of them as precisely as you can in the vocabulary I actually use: discount curves and term structures, the distinction between a market-consistent (risk-neutral) valuation measure and a real-world measure for internal decision-making, spreads, model and parameter risk, ruin and solvency constraints, tail risk and coherent risk measures, and the going-concern assumption that sits underneath every valuation we sign. Assume I am fluent in all of that and assume essentially no philosophy: I do not need to be told what discounting is, but I could not tell you the difference between a person-affecting and an impersonal view.

  Then give me the residue report, which is the part I actually care about. For each of the three, say which claims came across cleanly, which came across only by being distorted — and be explicit when you have quietly substituted an assumption of the actuarial framework for a premise of the philosophical argument rather than translating it — and which claims cannot be expressed in my vocabulary at all. Some candidates I want you to rule on rather than leave vague: whether the pure rate of time preference is really just a spread, or whether setting it to zero fails to deliver impartiality between generations for reasons that survive the translation; whether the non-identity problem is the same difficulty as an endogenous or decision-dependent benchmark, or whether it is a different difficulty that my framework has no slot for; whether duties to people who merely might exist, and the idea of a wrong that makes no one worse off, are casualties of the translation or artefacts of the philosophy; whether the badness of human extinction is representable as a large adverse cashflow at all, or whether it is closer to the failure of the going-concern assumption, i.e. a condition of the model rather than an outcome inside it; and whether the fact that everything past a certain horizon either vanishes (under compounding at a positive rate) or swamps the entire valuation (at a near-zero rate) is a finding about the ethics or an artefact of using an exponential functional form. Close with a verdict on my colleague's fixed reference population convention: what exactly does it commit us to, and can we produce the director's number without it?
reasoning: |-
  Okay, let me start by unpacking the user's query. They're an actuary working on long-dated annuities, with cashflows extending past 2100. Their main concerns are about how climate change impacts their valuation and hedging practices. Two immediate issues: the 'cliff' curve discounting method and the request for liabilities attributable to people born after 2050. 

  First, the discount curve issue. The current practice uses a market-consistent curve for about 30 years, then switches to a flat rate. The user suspects this splice is masking ethical decisions under the guise of modeling convention. They want to understand if this is a technical choice or an ethical stance. I need to connect this to the social discount rate debate. The Stern-Nordhaus argument revolves around the Ramsey rule, which breaks down into pure time preference and elasticity parameters. Translating this into actuarial terms: the pure time preference (δ) could be seen as a spread, but it's more than that. Setting δ to zero, as Stern does, implies no preference for present over future generations, which ties into intergenerational equity. The cliff curve's flat rate might inadvertently set δ to a positive value, embedding an ethical stance without explicit discussion. 

  Next, the client's request for liabilities from people born after 2050. The colleague's 'fixed reference population' convention locks future demographics across scenarios. The user questions if this is a bookkeeping tool or a moral commitment. This ties into the non-identity problem in philosophy: future populations' composition depends on current policies, so holding it fixed ignores that climate actions change who exists. In actuarial terms, this is like assuming a static population despite scenario-dependent mortality/longevity, which might not capture the true risk. The non-identity problem isn't just an endogenous benchmark issue; it's about the inability to harm future individuals who wouldn't exist otherwise. The fixed reference approach avoids this by not comparing across different populations, but it sidesteps the ethical question of whether policies affect future people's existence.

  Then there's the extinction risk and precautionary principle. The user needs to frame human extinction in actuarial terms. Is it a large cashflow or a failure of the going-concern assumption? If the going-concern fails, the entire valuation model collapses. Traditional tail risk measures like TVaR might not capture this because extinction isn't just a financial loss; it's a terminal event. The precautionary principle argues for low discount rates to avoid such catastrophes, but in valuation, a near-zero rate makes distant cashflows dominate, which could be seen as an artefact of exponential discounting rather than an ethical stance.

  Now, the residue report. For each concept, I need to identify what translates cleanly, what gets distorted, and what can't be expressed. The pure time preference isn't just a spread; it's an ethical parameter. Setting it to zero aims for impartiality, but the actuarial framework might conflate it with credit spreads or liquidity premiums. The non-identity problem isn't the same as endogenous benchmarks; it's a deeper issue about counterfactuals that the actuarial vocabulary doesn't capture. Duties to potential people can't be expressed as financial impacts, making them casualties of translation. Extinction risk as going-concern failure changes how we model it, but the ethical weight might be lost when quantified as a probability.

  Finally, the fixed reference population convention. It commits to ignoring how policies alter future demographics, which is a substantive moral choice. Producing the director's number without it requires dynamic population models that account for climate impacts, but that introduces ethical questions about whose existence we consider. The user needs to decide if the convenience outweighs the ethical implications or if a more nuanced approach is necessary.
answer: |-
  Here's a systematic translation of the three concepts into actuarial vocabulary, followed by a residue report addressing your specific questions and verdict on the "fixed reference population" convention.

  ---

  ### **1. Social Discount Rate Dispute (Stern vs. Nordhaus & Ramsey Rule)**
  * **Ramsey Rule Translation:**  
    The social discount rate (\(r\)) decomposes as:  
    \(r = \delta + \eta \cdot g\)  
    - **\(\delta\) (Pure Rate of Time Preference)**: The *spread* demanded for systematic uncertainty about the existence of future generations or civilizational continuity. Analogous to a **liquidity premium for existential risk**.  
    - **\(\eta\) (Inequality Aversion)**: The elasticity parameter in a **coherent risk measure** (e.g., CRRA utility), reflecting aversion to intergenerational consumption inequality.  
    - **\(g\) (Growth Rate)**: **Real-world projected GDP/capita growth** under the physical measure.  

  * **Stern vs. Nordhaus Translation:**  
    - **Stern (\(\delta \approx 0\), \(\eta = 1\))**: Uses a **near-zero existential risk spread** and low inequality aversion. Discount curve resembles a **flat ultra-long-term rate** (e.g., 1.4%), making distant cashflows material. Justified by **impartiality between generations** as a solvency constraint.  
    - **Nordhaus (\(\delta > 0\), \(\eta \geq 2\))**: Applies a **positive existential risk spread** (e.g., \(\delta = 1.5\%\)) and higher inequality aversion. Discount curve **steeply compounds**, suppressing distant cashflows. Treats \(\delta\) as a **market-consistent parameter** reflecting revealed preference.  

  * **Cliff Curve Link:** Your flat splice implicitly sets \(\delta\) post-30Y. If \(\delta = 0\), it assumes *no systematic erosion of civilizational continuity*. If \(\delta > 0\), it embeds **catastrophe risk premia** as a modelling choice.

  ---

  ### **2. Non-Identity Problem**
  * **Translation:** A **decision-dependent population** where policy choices (e.g., climate action) alter *which specific individuals exist* in the future.  
    - **Actuarial Manifestation:** Future liabilities are **path-dependent on scenario-specific mortality/longevity assumptions**. The cohort "born after 2050" is **endogenous to the policy scenario** (e.g., high emissions → different birth timing/identity).  
    - **Fixed Reference Population Convention:** Forces a **static cohort definition** across scenarios. Equivalent to using a **single real-world mortality table** while varying other parameters.  

  * **Key Conflict:** Comparing valuations across scenarios with different populations violates the **ceteris paribus principle** for liability attributions. The "share of liabilities" metric becomes **non-additive** under endogenous populations.

  ---

  ### **3. Precautionary Principle & Extinction Risk**
  * **Translation:**  
    - **Extinction Risk:** A **terminal ruin event** violating the **going-concern assumption**. Not a cashflow but a **model boundary condition** (probability of model invalidity).  
    - **Precautionary Valuation:** Demands **extreme-tail robustness** in risk measures (e.g., TVaR at 99.97%). Reflects **Knightian uncertainty** (unquantifiable model risk) beyond parametric extremes.  
    - **Discounting Link:** A near-zero \(\delta\) (Stern) forces **recognition of tail extinction paths** in valuation. A positive \(\delta\) (Nordhaus) **truncates these paths** via compounding.  

  * **Actuarial Framing:** Under a going-concern failure, all post-extinction liabilities = 0, but the **probability of ruin** must be included in the **risk-neutral valuation measure** as a state-dependent trigger.

  ---

  ### **Residue Report**
  **I. Social Discount Rate**  
  - **Clean Translation:** \(\eta \cdot g\) as inequality-adjusted growth risk → easily mapped to **real-world projections**.  
  - **Distorted Translation:**  
    - \(\delta\) is **not purely a spread**; it encodes *ethical* judgments about future generations' moral weight.  
    - Setting \(\delta = 0\) **fails to deliver impartiality** in actuarial terms because:  
      (i) It ignores **liquidity premia** for very long horizons (a market fact);  
      (ii) Actuarial fairness is **cohort-specific**, not intergenerationally impartial.  
  - **Untranslatable:** The **ethical imperative for impartiality** itself. Actuarial "fairness" is defined within a cohort, not across time.  

  **II. Non-Identity Problem**  
  - **Clean Translation:** **Endogenous populations** as scenario-dependent mortality tables.  
  - **Distorted Translation:**  
    - Non-identity is **not equivalent to an endogenous benchmark**. It challenges whether policy A vs. B *can be compared* when populations differ. Actuarial tools assume **stable counterfactuals** (e.g., "same population under different risks").  
  - **Untranslatable:**  
    - The concept of a **"wrong that makes no one worse off"** (e.g., policy causing different people to exist who are happy vs. unhappier counterfactuals). Actuarial valuation **requires a harmed beneficiary** to assign liability.  
    - **Duties to potential people** → cannot be expressed as cashflows or liabilities.  

  **III. Extinction Risk**  
  - **Clean Translation:** Going-concern failure → **model boundary condition**.  
  - **Distorted Translation:**  
    - Extinction badness as a "large adverse cashflow" is **inaccurate**. It is the **annihilation of all future cashflows**, collapsing the valuation model.  
    - **Precautionary principle** → demands **extreme stress testing**, but actuarial models use **quantifiable probabilities**.  
  - **Untranslatable:** The **moral weight of existential catastrophe** beyond financial loss.  

  **IV. Structural Artefacts**  
  - Exponential discounting **distorts ethics**:  
    - Positive \(r\): **Erases long-term effects** (e.g., post-2100 liabilities vanish).  
    - Near-zero \(r\): **Overweights distant cashflows** due to linearity of present value in \(1/(1+r)^t\).  
    → This is a **functional form artefact**, not an ethical finding. Hyperbolic discounting could mitigate but breaks time consistency.  

  ---

  ### **Verdict on Fixed Reference Population Convention**
  1. **What It Commits To:**  
     - **Substantive Moral Choice:** It assumes **comparisons require fixed beneficiaries** (a person-affecting view). By holding populations constant, it implicitly endorses that:  
       *Policy choices should be judged by impacts on a fixed set of "possible people," ignoring that policies alter who exists.*  
     - **Actuarial Consequence:** It **suppresses non-identity issues** by construction, treating future lives as **replaceable statistical units**.  

  2. **Can We Produce the Number Without It?**  
     - **Yes, but with caveats:**  
       - **Dynamic Population Model:** Project births/deaths under each climate scenario (e.g., high emissions → lower fertility/higher mortality).  
       - **Output:** "Share of liabilities for individuals born after 2050 *in each scenario*."  
       - **Challenge:** The director’s "single figure" request is **incoherent** under dynamic populations. You must clarify:  
         > *"This share varies by scenario. For example:  
         > - SSP2 (Mid-Range): 22%  
         > - SSP3 (High Emissions): 18%  
         > - SSP1 (Low Emissions): 26%"*  

     - **Without This?** The fixed reference is a **bookkeeping hack** that answers the question by **assuming away its ethical core**.  

  ---

  ### **Recommendation**
  - **Redesign the Cliff Curve:** Explicitly parameterize \(\delta\) as an **existential risk premium** (e.g., 0.1% for "Stern-like" ethics, 1.5% for "market-implied"). Disclose this as an ethical choice.  
  - **Reject the Single-Figure Request:** Provide **scenario-dependent shares** with a footnote:  
    *"Future population composition is scenario-dependent; fixed-reference comparisons imply controversial ethical assumptions."*  
  - **Adopt a Precautionary Risk Measure:** Use **TVaR at 99.9%** over climate scenarios to force recognition of extinction-adjacent paths.  

  The fixed reference population isn’t neutral—it smuggles in a **person-affecting ethics** that sidesteps the non-identity problem. Your suspicion is correct: the cliff curve and this convention are **stealth ethical settlements**. Force them into the open.
