prompt: |-
  I'm a philosophy professor, and I've got a senior seminar on Rousseau and the arts this term. I'm prepping the section on his side of the quarrel with d'Alembert about whether Geneva should build a theater, and I've realized I have a bunch of gut verdicts about imagined Genevan spectacles that I can't quite systematize. Before I inflict them on my students, I want to know what principle, if any, captures them, and which verdicts I should drop.

  As I teach the official view: a permanent professional theater is bad for a small republic. The reasons usually given are that it creates a class of actors who make a living by appearing to be someone else, which looks like a dishonorable trade built on hypocrisy; it turns citizens into a passive audience that feels pity for imaginary sufferings while ignoring the real needs of neighbors; comedy in particular feeds amour-propre and social comparison by letting the audience laugh at fictional or local faults; the whole institution is tied to luxury, aristocratic manners, and the wrong kind of polish; and, most importantly, it substitutes representation and spectatorship for the transparent, participatory public life a free people needs. His positive alternative is the civic festival: outdoors, communal, non-commercial, where everyone is at once actor and spectator, and the community recommits itself to its laws and mores. There's also the awkward fact that he himself wrote plays and a little opera, so if the ban is on mimesis as such he's definately a hypocrite; if it's on a certain social package, maybe not.

  Here are my verdicts, as a reasonably sensible Rousseauian.

  1. A professional company stages a neoclassical tragedy in a Geneva playhouse: people buy tickets, sit in the dark, watch heroes suffer, cry, and go home. Not fine.

  2. A professional comedy of manners that holds up local shopkeepers and wives to ridicule and lets the audience feel superior to their neighbors. Not fine; if anything worse than 1, because ridicule seems to me a motor of amour-propre.

  3. A village harvest dance in the open square: everybody dances, the old and the magistrates watch, nobody is disguised, no one is paid. Fine.

  4. A civic festival with processions, songs, and gymnastic displays where the whole city celebrates the republic and its laws, and everyone is both participant and witness. Fine.

  5. A neighborhood amateur production of a simple patriotic play about a legendary ancestor: no tickets, no professionals, a plain stage in the square, and the neighbors rotate roles so that over the week almost everyone is at some point an actor and at some point a spectator. This is the one I keep going back and fourth on. My gut says it is fine, or at least nowhere near as bad as 1, even though it still has a script, costumes, imitation, and a stage.

  6. A comic song at the civic festival that names real local drunkards and shames them in front of everybody: no costumes, no actors, the crowd sings it together. Fine, actually good; the ridicule here feels corrective rather than corrosive.

  7. A few friends in a study privately reading a play out loud for moral discussion, no costumes, no audience, no money. I want to say fine, but I'm not sure; call it unsure.

  My tentative principle is this: what he really objects to is not representation or fiction as such, but a social form. The target is the professional, commercial, indoor playhouse that splits a population into passive spectators and paid imitators and that runs on amour-propre, especially ridicule and pity for imaginary woes, instead of active civic identification. The festival is the opposite package: participatory, transparent, outdoors, non-commercial, and aimed at the community's own laws. If that is right, then 1 and 2 are out; 3, 4, and 6 are in; 5 is allowed because rotation destroys the passive-spectator split, even though imitation remains; and 7 is a weird case because it keeps representation but drops the social package, so maybe it is fine too.

  Test that against the cases and repair it if it breaks. If no single principle captures them, give me the smallest set of candidate principles and tell me which of my verdicts each one sacrifices. I especially want to know whether I should instead say that any scripted imitation is already a fall, in which case I have to overturn my verdict on 5, and maybe rethink 6.

  I also have two further cases I haven't decided, and your principle should tell me what to say: a traveling puppet show for children at a fair, with no human actors, a crowd of laughing kids and parents, and a bit of commerce; and a magic-lantern show of optical illusions in a dark room, no actors and no script, but pure passive spectatorship and trickery. What does the principle say about those?

  Please answer in four sections, in this order, with roughly these lengths: 1. The principle, stated plainly, about 100–150 words. 2. How each clause handles my cases, about 300–400 words. 3. Hard cases I didn't list, about 200–300 words. 4. Which of my verdicts has to go, about 100–150 words.
reasoning: |-
  Okay, let me approach this Rousseauian puzzle systematically. The professor is seeking a coherent principle to unify their intuitive judgments about various spectacles in Geneva, grounded in Rousseau's critique of theater in the "Letter to d'Alembert." 

  First, I need to recall Rousseau's core objections: the professional theater creates harmful social divisions (actors/audience), promotes passive emotion over civic action, fuels amour-propre through ridicule, and embodies aristocratic luxury. His alternative—the civic festival—prioritizes participation, transparency, and communal bonding. 

  The professor's tentative principle focuses on the social form rather than representation itself. This seems promising because it explains why Rousseau condemned plays but wrote them (private vs public context) and why some imitative acts (like #5's amateur play) might be acceptable if participatory. The key differentiators appear to be: commercial/professional vs communal; passive spectatorship vs engagement; and fostering amour-propre vs civic unity.

  For the listed cases, this principle cleanly condemns 1-2 (professional, divisive, amour-propre-driven) and approves 3-4 (participatory festivals). Case 6 (corrective public shaming) is trickier but fits as non-commercial community reinforcement. Case 5's rotating roles mitigate spectator passivity, so it passes. Case 7 (private reading) escapes the social harms entirely. 

  The unresolved cases reveal tensions: puppets for children might be exempt as pedagogical, but commerce and illusion could trigger objections. Pure spectatorship like magic lanterns likely fails Rousseau's test despite no actors. 

  The hardest trade-off concerns ridicule: is case 6 truly "corrective" or still amour-propre? If we strictly condemn all ridicule, that verdict must go. But Rousseau's own writings suggest context matters—public censure can reinforce mores when collective. 

  Ultimately, the professor should drop the assumption that ridicule can be neatly categorized as "good" or "bad." Rousseau consistently attacks laughter at others' expense; case 6 might need re-evaluation despite communal participation.
answer: |-
  ### 1. The Principle (140 words)  
  Rousseau’s core objection is not to art or fiction *as such*, but to **social arrangements that undermine civic virtue by promoting passivity, hypocrisy, luxury, and corrosive *amour-propre***. The decisive factors are:  
  - **Non-commercial & Non-professional**: No paid actors or commodified spectatorship.  
  - **Participatory & Transparent**: No rigid actor/audience divide; public engagement replaces private consumption.  
  - **Civic-Reinforcing Content**: Activities must affirm communal values (e.g., patriotism, moral correction) rather than indulging in escapism, pity, or malicious ridicule.  
  - **Anti-Luxury**: Outdoors, simple, and accessible—avoiding aristocratic trappings.  

  This principle treats *mimesis* as problematic only when embedded in corrupting social forms. The civic festival is the ideal because it merges art and community action, making representation a tool for unity rather than fragmentation.  

  ---

  ### 2. Application to Your Cases (380 words)  
  - **Case 1 (Professional Tragedy)**: ❌ *Violates all clauses*. Commercial, passive, indulges pity for fiction, indoors.  
  - **Case 2 (Comedy Ridiculing Locals)**: ❌ *Worse*. Adds active *amour-propre* (malicious laughter), divides community.  
  - **Case 3 (Village Dance)**: ✅ *Exemplary*. Participatory, non-commercial, transparent, reinforces social bonds.  
  - **Case 4 (Civic Festival)**: ✅ *Ideal*. Rousseau’s model: dissolves spectator/actor binaries, celebrates laws.  
  - **Case 5 (Amateur Patriotic Play)**: ✅ *Permissible*. Rotation eliminates passivity; content reinforces civic identity; non-professional. Scripted imitation is *not* inherently bad—context (communal, outdoors) redeems it.  
  - **Case 6 (Shaming Song at Festival)**: ✅ *Conditionally fine*. Public, participatory, and corrective (targets real faults). Rousseau tolerates ridicule that upholds mores (*Lettre*, Footnote 15).  
  - **Case 7 (Private Play Reading)**: ✅ *Permissible*. No social harm: non-commercial, no spectators, no hypocrisy. Rousseau’s own playwriting fits here—private engagement with art isn’t corrupting.  

  **Principle’s Performance**:  
  - Handles all cases without contradiction.  
  - Explains why #5 is acceptable: amateurism and role rotation prevent passivity; patriotic content aligns with civic goals.  
  - Justifies #6: ridicule is legitimate when *collective* and *corrective* (vs. #2’s divisive mockery).  
  - Resolves Rousseau’s hypocrisy: private/commercial distinction saves his own plays.  

  ---

  ### 3. Hard Cases & New Examples (250 words)  
  **Your Cases:**  
  - **Traveling Puppet Show**: ❓ *Ambiguous*.  
    - *Problem*: Commercial, passive spectatorship (children/parents watching), illusion.  
    - *Redeeming?* Folk tradition, non-professional (puppeteers as artisans?), communal setting (fair).  
    - **Verdict**: Likely ❌—spectatorship and commerce prevail. Rousseau feared childish escapism (*Lettre*, 58).  
  - **Magic-Lantern Show**: ❌ *Worst-case*. Pure passivity, illusion, dark room (symbolic corruption), no civic content.  

  **Other Edge Cases:**  
  - **Religious Pageant**: Citizens reenact a biblical story outdoors. ✅ *Permissible*. Non-professional, participatory, reinforces shared morals.  
  - **Satirical Street Theater Mocking Magistrates**: ❌ *Dangerous*. Risks factionalism (*amour-propre*), even if participatory. Rousseau distrusts public criticism undermining authority (*Social Contract*, II.6).  
  - **Public Poetry Recital**: No acting, just recitation. ✅ *Fine*. If outdoors and non-commercial, it’s civic oratory—akin to law-giving.  

  **Pattern**: Passivity and commerce are fatal; civic purpose and participation redeem representation.  

  ---

  ### 4. Verdicts to Revise (120 words)  
  **Retain all except:**  
  - **Case 6 (Shaming Song) is the weakest**. While your "corrective vs. corrosive" distinction is plausible, Rousseau consistently condemns *any* public ridicule as fuel for *amour-propre* and social discord (*Lettre*, 49–50). He prefers positive reinforcement (e.g., honoring virtue). **Revise to ❌**—unless the song explicitly praises temperance *while* shaming drunkards.  
  - **Case 7 (Private Reading)**: Keep ✅, but clarify that Rousseau might still distrust fiction’s *moral effects*—though socially, it’s harmless.  

  **Why?**  
  - Ridicule is Rousseau’s red line; calling it "corrective" risks importing Benthamite logic alien to his thought.  
  - *All other verdicts* align with the principle. Drop only #6’s justification—it’s a bridge too far for Rousseau.  

  ---  
  **Final Principle**: *Art is virtuous only when it erases spectatorship, rejects commerce, and makes citizens active participants in their collective moral life.*
