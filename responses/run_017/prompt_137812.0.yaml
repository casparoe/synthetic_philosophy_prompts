answer: |-
  Below is a complete session plan designed for your philosophy group, focusing on experiential learning about logical vs. physical uncertainty without algebra. The session uses a **betting market** with play money to highlight the core ideas, especially the tension between Dutch-book coherence and "bounded rationality" in logical uncertainty. The climax (last 20 minutes) introduces an adversarial trader to force a confrontation between these standards.

  ---

  ### **Session Overview**
  - **Duration**: 90 minutes  
  - **Participants**: 9–10 people (retirees + undergrads), no algebra.  
  - **Key Insight**: Physical uncertainty (e.g., a hidden coin) involves randomness; logical uncertainty (e.g., primality) involves unknown but fixed truths. Bayesian "omniscience" fails for logical claims.  
  - **Mechanism**: A market where participants trade claims settled by:  
    - Physical reveals (coin/die).  
    - Computations (primality/digits of π).  
    - One uncomputable claim (to provoke discussion).  
  - **Climax**: An "adversary" (with a laptop) exploits mispriced logical claims, showing that Dutch-book coherence is unrealistic for bounded agents. Participants see that prices can be incoherent now but converge to truth with computation.  

  ---

  ### **Materials Needed**
  1. **Physical Items**:  
     - A coin, two cups (red/blue), a 6-sided die, a box.  
  2. **Logical Claims Setup**:  
     - Laptop with Python/online tools preloaded:  
       - Primality test: `is_prime(101)` → True (small prime).  
       - Pi digit lookup: 1000th digit of π = **9** (source: online database).  
  3. **Market Materials**:  
     - Play money ($10 bills, $200 total per participant).  
     - Claim slips (laminated cards):  
       ```  
       [Claim 1] "The coin under the RED cup is HEADS."  
       [Claim 2] "The die in the box shows an EVEN number."  
       [Claim 3] "The number 101 is PRIME."  
       [Claim 4] "The 1000th digit of π is 7."  
       [Claim 5] "This statement is unprovable in arithmetic." (Gödel sentence)  
       ```  
     - Whiteboard to track bids/asks.  
  4. **Adversary Setup**:  
     - Helper (you or a volunteer) with a laptop to compute Claims 3–4 instantly. Claim 5 is intentionally unsettled.  

  ---

  ### **Session Timeline**  
  **Total: 90 mins**  

  #### **Phase 1: Setup & Market Rules (5 mins)**  
  - **What you say**:  
    > "Today we’re running a prediction market. Each claim pays $1 if true, $0 if false. You start with $200. Trade claims with each other—buy low if you think it’s true, sell high if you think it’s false. Prices should reflect your confidence. *No need for math—go with your gut.*"  
  - **Rules**:  
    - Trading is open outcry (participants shout bids/asks).  
    - Record trades on the whiteboard:  
      | Claim | Bid (buy) | Ask (sell) | Last Price |  
      |-------|----------|----------|------------|  
      | 1     | $0.50    | $0.60    | $0.55      |  
      | ...   | ...      | ...      | ...        |  
    - **Settlement at the end**:  
      - Claims 1–2: Reveal physical objects.  
      - Claims 3–4: Run computation on laptop.  
      - Claim 5: No settlement (explain later).  

  #### **Phase 2: Trading Rounds (40 mins)**  
  - **Step 1: Initial Seeding (5 mins)**  
    - Flip a coin, hide under red cup; roll die, hide in box.  
    - Assign each participant one random claim slip (Claims 1–5). This seeds the market.  
    - **Prompt**: "Check your claim. If you want to sell it, shout an ask (e.g., ‘Sell Claim 3 for $0.75!’). If you want to buy, shout a bid (e.g., ‘Buy Claim 1 for $0.40!’)."  

  - **Step 2: Open Trading (35 mins)**  
    - Participants trade freely. Update whiteboard prices in real-time.  
    - **Facilitator nudges**:  
      - "Why did you price Claim 1 at $0.50? Is it like a coin flip?"  
      - "Claim 4—do you feel the same way about digits of π as the coin?"  
    - **Observed behaviors**:  
      - Physical claims (1–2) hover near $0.50 (intuitive symmetry).  
      - Logical claims (3–4) vary wildly (e.g., Claim 3 at $0.90 if someone recognizes 101 as prime; Claim 4 at $0.10 if π feels random).  
      - Claim 5 (Gödel) gets bizarre prices—some refuse to trade, others price at $0.01 or $0.99.  

  #### **Phase 3: Adversary Round (20 mins)**  
  - **Setup**: Introduce a "tech-savvy trader" (adversary) with a laptop that can compute Claims 3–4 instantly.  
  - **What you say**:  
    > "A new trader joins—they have a computer to test math claims. They’ll trade for 5 minutes. Play money is on the line, so watch out!"  
  - **Adversary actions**:  
    - **For Claim 3 (101 is prime → True)**: Buys at any price <$1.00 (e.g., if market price is $0.80, buys all offers).  
    - **For Claim 4 (1000th digit of π=9 → False)**: Sells short at any price >$0.00 (e.g., if price is $0.30, sells unlimited shares).  
    - **Ignores physical claims (1–2) and Claim 5** (can’t compute).  
  - **Outcome**:  
    - Logical claim prices snap to $1.00 (Claim 3) or $0.00 (Claim 4).  
    - Participants who sold Claim 3 cheap or bought Claim 4 lose money to the adversary.  
    - **Key moment**: Adversary profits from "mispricings," but participants couldn’t have known without computation.  

  #### **Phase 4: Settlement & Payouts (10 mins)**  
  - Settle claims in order:  
    1. **Claim 1**: Reveal coin → Pays $1 if heads.  
    2. **Claim 2**: Reveal die → Pays $1 if even.  
    3. **Claim 3**: Run `is_prime(101)` → **True** ($1 paid).  
    4. **Claim 4**: Show 1000th digit of π = **9** → **False** ($0 paid).  
    5. **Claim 5**: No reveal → **No payout**.  
  - Participants calculate final wealth (play money).  

  #### **Phase 5: Debrief (15 mins)**  
  - **Start with reflections**:  
    > "What felt different about betting on the coin vs. the math claims? How did the adversary change things?"  
  - **Map to concepts**:  
    | **Observation** | **Concept** |  
    |-----------------|-------------|  
    | Coin/die prices ~$0.50 | Physical uncertainty: truly random *until* reveal. |  
    | Claim 3/4 prices corrected by computer | Logical uncertainty: fixed truth, unknown due to limited computation. |  
    | Adversary exploited mispricings | Dutch books demand coherence *now*—but this is impossible for bounded minds. |  
    | Claim 5 had no resolution | Undecidable truths: some things *can’t* be settled (Gödel’s incompleteness). |  
  - **Core tension**:  
    - Bayesianism says rational agents must price tautologies at $1.00 to avoid Dutch books.  
    - But humans *can’t* price Claim 3 at $1.00 without computing it!  
    - **Better standard**: Prices should be *unexploitable by adversaries with similar compute* and *converge to truth* with effort (e.g., adversary’s prices were "correct" after computation).  
  - **Closing question**:  
    > "If you reran this market with 1,000 years of compute, how would prices change? What about for Claim 5?"  

  ---

  ### **What Will Go Wrong (and Fixes)**  
  1. **Claim 5 confusion**:  
     - Participants may fixate on its weirdness.  
     - **Fix**: In debrief, clarify it’s a Gödel sentence—true but unprovable—to show logical uncertainty’s limits.  

  2. **Adversary intimidates**:  
     - Less confident traders may disengage.  
     - **Fix**: Preface with "This trader is a thought experiment—no pressure!"  

  3. **Trading lulls**:  
     - Retirees may hesitate to shout bids.  
     - **Fix**: Hand out claim slips to force engagement; model a few trades.  

  4. **Math claims too easy**:  
     - Someone may know 101 is prime.  
     - **Fix**: Use obscure claims (e.g., "Is 1,000,003 prime?" → False). Precompute to save time.  

  ---

  ### **The Idea the Game Can’t Fully Capture**  
  - **Convergence in the limit**: The game shows logical prices *snapping to truth* with computation but can’t simulate *gradual convergence* (e.g., checking primes slowly).  
    - **Workaround**: In debrief, say:  
      > "Imagine the adversary only had 1 minute to compute—they might not resolve Claim 4. Good prices should avoid *long-term* exploitation, not just *instant* coherence."  

  ---

  ### **Why This Works**  
  - **Experiential contrast**: Physical/logical uncertainty feels different when trading.  
  - **Adversary makes limits visceral**: Participants see Dutch books exploited but feel it’s unfair—exposing Bayesianism’s flaw.  
  - **Claim 5 as a hook**: Its unsettledness sparks debate about "unknowable" truths.  

  This design meets your specs: no algebra, no upfront theory, and a climax where coherence and bounded rationality visibly clash. Let me know if you’d adjust claims or timing!
