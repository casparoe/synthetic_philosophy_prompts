answer: |-
  ## The Case for Epistemic Delegation in Advance Directives

  Your position—let’s call it **Epistemic Delegation Theory (EDT)**—offers a compelling, pragmatic foundation for advance directives, precisely because it centers *judgmental competence* rather than metaphysical identity or temporal sovereignty. Its core is this: The earlier self’s authority is **delegated**, grounded solely in her superior epistemic position to forecast the later self’s interests under radically altered conditions. This delegation isn’t ownership; it’s a fiduciary duty contingent on the accuracy of the delegate’s core assumptions. When those assumptions fail, the mandate lapses. Let’s defend it against your crucibles.

  **1. The Hard Case: Content in Dementia**  
  Your healthy woman, fully informed, directs no life-prolonging care if severely demented. Now, demented, she smiles at music, seems content. EDT dictates: **override the directive.** Why is this defensible?  

  The earlier self’s authority stemmed from her unique capacity to *predict* the intolerability of dementia—a prediction rooted in her understanding of consciousness, dignity, and suffering. Her delegation was implicitly conditional: *"Act on my refusal only if dementia truly is the hellscape I envision."* Discovering the later self’s contentment reveals a catastrophic error in the **decisional predicate**—the very fact (future suffering) she was delegated to assess. The delegation collapses because the epistemic justification evaporated. This isn’t discarding autonomy; it’s respecting the *limits* of the mandate she granted herself. Prioritizing her present, verifiable well-being isn’t a betrayal—it’s the system functioning as designed when the delegate’s core judgment proves unsound. The earlier self isn’t ignored; her role as predictor is acknowledged, then found inapplicable.

  **2. The Collapse Objection: Best Interests in Disguise?**  
  Does EDT reduce to a "best interests" standard? No—it preserves the earlier self’s *procedural primacy*. Her directive isn’t advice; it’s the *default* decision-maker until disqualified. The key is distinguishing **source** from **standard**.  

  -   **Source of Authority:** The earlier self *alone* holds the initial right to decide *for the future state*, earned by her epistemic advantage.
  -   **Standard for Exercising Authority:** Her decision is authoritative *only if* her judgment about the later self’s fundamental interests (e.g., suffering vs. contentment) was sound. If her epistemic advantage was illusory (she was badly mistaken), she ceases to be the legitimate delegate.

  This doesn’t make the earlier self irrelevant. She sets the framework. We ask: "What did *she* intend, based on *her* values, contingent on *her* predictions?" Only when her prediction is falsified do we shift to a best interests standard *for the current self*. EDT doesn’t collapse; it *transitions* authority based on the delegate’s success in fulfilling her epistemic mandate. The earlier self is the necessary starting point whose potential failure is built into the model.

  **3. The Discontinuity Puzzle: Why Care About Her Knowledge?**  
  If the demented self is a "different person," why does the healthy self’s knowledge grant authority? Precisely because EDT *sidesteps* identity metaphysics. Authority isn’t based on *being* the same person; it’s based on *functional capacity*.  

  The healthy self possesses a unique, irrecoverable capacity: the ability to rationally integrate *lifelong values*, *fears*, and *hypothetical future states* into a coherent plan. The severely demented self lacks this capacity for complex projection and value-weighing. Knowledge isn’t authority *over another*; it’s the qualification for a *trusteeship role* during the later self’s incapacity. We delegate decisions to the *best available trustee* at the time of planning—usually the healthy self. Discontinuity doesn’t erase the functional need for *someone* equipped to plan for incapacity, and the healthy self is objectively better equipped than a stranger or a state agency. Her authority arises from this functional necessity and competence, not ontological identity.

  **4. The Non-Predictive Directive: Dignity Over Contentment**  
  You refuse treatment because living demented is "demeaning" or "sacrilegious," *even if content*. Does EDT implode? Not necessarily. Here, the directive relies on a **value-consistency predicate**, not a suffering predicate.  

  The earlier self isn’t primarily predicting *experience* (contentment); she’s asserting an enduring value: "My dignity/sacred integrity requires X." EDT asks: Was she mistaken about the *nature or persistence* of this value? If the value itself is fundamentally tied to her *capable self* (e.g., dignity defined as rational autonomy), and that self is gone, the predicate ("*I* will exist in a demeaning state") might be falsified. The later self’s contentment suggests she doesn’t experience the state as demeaning *to her current self*. The delegation was based on the value applying to the future entity; if the future entity doesn’t (or can’t) hold that value, the delegate was mistaken about its relevance.  

  However, if the value is framed as timeless ("My life narrative must not *end* in dementia," "My family must remember me as capable"), and its violation exists independently of the later self’s experience, then the directive *doesn’t* rest on a falsifiable predicate about the later self’s state. In this case, EDT must concede a **non-epistemic core**: the authority stems from the delegate’s superior position to define binding *narrative or relational values* for her life as a whole. Yet, the epistemic frame still governs: Was she well-placed to understand these abstract values? Was the directive *genuinely* expressing them (vs. transient fear)? EDT’s strength is forcing this clarification—distinguishing directives grounded in potentially falsifiable predictions from those rooted in irrevocable value commitments. It handles the former robustly and highlights the distinct nature of the latter.

  **Wrinkle: Social Performance in Directive Writing**  
  EDT readily discounts directives distorted by social pressures (guilt, performance). Delegated authority requires the delegate to act *in good faith* on the beneficiary’s (future self’s) behalf. If the directive reflects external pressures (e.g., "I must look stoic," "I must spare my family burden") more than the author’s authentic assessment of her *own* future interests or values under incapacity, it fails as a valid delegation. The delegate isn’t fulfilling her fiduciary duty; she’s acting under duress or misrepresenting the beneficiary’s needs. We assess this like we assess any testimony for bias or coercion—by context, witness accounts, and internal consistency—without abandoning the core delegated authority model.

  **Conclusion: The Robustness of Epistemic Delegation**  
  EDT provides a clear, flexible, and humane framework. It justifies honoring directives from lived experience (superior predictors), allows for overriding directives based on falsified core assumptions without abandoning the earlier self’s role, navigates psychological discontinuity via functional necessity, and forces clarity on the empirical vs. purely valuative foundations of directives. Its power lies in making authority contingent on actual *judgmental success* regarding the beneficiary’s fundamental state, not on elusive continuity or abstract promises.

  **The Single Premise I’d Least Like to Give Up:**  
  **Delegated authority lapses when the delegate is fundamentally mistaken about the core factual predicates upon which her decision was based.** This contingency is what prevents EDT from becoming rigid paternalism (ignoring present well-being) or collapsing into simple best interests (ignoring the earlier self’s unique role). It’s the keystone of the entire structure.
