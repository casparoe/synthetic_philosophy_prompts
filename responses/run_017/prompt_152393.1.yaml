prompt: |-
  I teach a seven-week upper-level seminar on rational choice — fourteen students, mostly philosophy majors with a few from economics, meeting once a week for seventy-five minutes in a room with a whiteboard, a projector, two opaque cloth bags, a box of ping-pong balls, index cards and a coin, and no budget beyond one book token I am willing to buy for a raffle. We finished expected utility theory last week: the independence axiom, the Allais paradox, and the representation theorem to the effect that an agent satisfying the axioms can be described as maximising expected utility with respect to a single subjective probability measure over the states. In the session after next I want them to feel, before they are told anything, that it is the single-measure part that breaks: that a draw from a bag they can see contains five red and five black balls is not, for them, the same thing as a draw from a bag whose composition I have not disclosed, and that whatever the difference is, it is neither risk aversion nor a guess about the contents. I have run the plain version before — two bags, four binary choices, tally on the board — and it fell flat: a good half of the room said they would simply assume the second bag was fifty-fifty and get on with it, a couple treated my silence as evidence that I had stacked it, and nobody felt the pull of anything. So I would like a properly staged activity instead.

  The mechanic I have been toying with, which you should either use or improve on, is a calibration bag rather than a forced choice: for each colour separately, each student writes down the number of balls of that colour they would want me to put in a second, transparent bag — which I then actually fill in front of them — such that they are indifferent between betting on that colour from the transparent bag and betting on it from the opaque one. A student who says four for red and four for black has thereby said, in their own hand, that the opaque bag is no better than a bag they can see contains four red when the bet is on red, and no better than a bag they can see contains six red when the bet is on black; their two numbers do not add to ten, and I want them to be the ones who notice that, and to find that they cannot make them add up however they try. Alongside that I want two further things, if you think they earn their ten minutes each: a token, purchasable for a small number of raffle tickets, that lets a coin flip decide which bag a student bets on rather than their choosing, and a split in which half the room is told that the opaque bag was filled by a classmate who wins the book token if the class loses while the other half is told it was filled by a mechanical process — the point of the split being to disarm the objection that suspicion of cheating explains everything, since a prior shifted towards thinking someone is out to get them predicts that they will prefer the transparent bag on one colour and the opaque bag on the other, not on both. If a two-stage step in which they commit to a policy in writing and are then invited to revise it is worth the time, add it; if it would muddy the session, say so and say why.

  What I need from you is the runnable thing — the script minute by minute, what goes on the board and when, what each student writes on their card, how the raffle tickets are cashed in, and how I keep the students who calibrate early from anchoring the ones who have not yet written — and then the debrief: which moment in the room is supposed to map onto which part of the idea, and what I should say when the things I expect to go wrong do go wrong (the fifty-fifty move, someone shaking a bag, the student who filled it leaking it, the accusation that I am bluffing about not knowing, the one who refuses to gamble at all, the one who asks what happens if the bag is empty). Please also be frank about what the activity cannot deliver and I will simply have to say in words; my guess is that the gap between their numbers failing to add to ten and the formal apparatus of non-additive or lower-and-upper probabilities is where the staging stops and the lecture has to begin, but tell me if you think the real gap is somewhere else. They should not hear the name of the urn example, or the word ambiguity used technically, until the debrief.
reasoning: |-
  We are designing a classroom activity to illustrate the breakdown of the single probability measure in expected utility theory, specifically to highlight ambiguity aversion without conflating it with risk aversion or beliefs about the bag's composition. The activity should use calibration for each color separately and include elements to address potential objections (like suspicion of cheating). We'll also incorporate a token system and a split condition.

  **Activity Design:**

  1. **Setup:**
     - We have two opaque cloth bags. Bag A (the "known" bag) is filled in front of the students with 5 red and 5 black ping-pong balls (total 10). Bag B (the "ambiguous" bag) is already present but its contents are not disclosed. However, we will explain that Bag B was filled by either a classmate (for half the class) or a mechanical process (for the other half) to test the cheating suspicion objection.
     - Materials: index cards, pens, two bags, ping-pong balls (at least 20 red and 20 black), a coin, raffle tickets, and one book token.

  2. **Raffle Ticket System:**
     - Each student starts with 5 raffle tickets (to be used for betting and for purchasing the optional token).
     - The book token will be raffled at the end. Each raffle ticket gives one entry.

  3. **The Calibration Task:**
     - For each color (red and black), students will write on an index card the number of balls of that color they would require in a transparent bag (which we will then fill) to be indifferent between betting on that color from the transparent bag and from the opaque Bag B.
     - Specifically, for red: "How many red balls (out of 10) in a transparent bag would make you indifferent between betting on red from that transparent bag and betting on red from Bag B?" Similarly for black.

  4. **The Betting and Indifference:**
     - A bet on a color wins 1 raffle ticket if the ball drawn is of that color, and loses nothing otherwise (so it's a gain-only bet). We are using raffle tickets as the currency because they are valuable (for the book token) and fungible.
     - The transparent bag will be filled by the instructor exactly as per the student's specification (with the written number of red and then separately for black) and then a ball is drawn to resolve the bet. But note: the calibration is about indifference, so we don't actually run the bet until after the calibration (to avoid anchoring). We are just setting up the hypothetical.

  5. **The Optional Token:**
     - A student may purchase a token for 1 raffle ticket that allows them to let a coin flip decide which bag they bet on (either the transparent bag they designed or Bag B) for a given bet. This token is meant to illustrate that the ambiguity aversion might lead them to prefer a randomization.

  6. **Split Condition:**
     - Half the class (Group 1) is told: "Bag B was filled by a classmate (who we will call the 'filler') who has an incentive: if the class as a whole loses more raffle tickets than they win, the filler gets the book token. Otherwise, the book token is raffled normally." (This sets up a potential adversary.)
     - The other half (Group 2) is told: "Bag B was filled by a mechanical process that randomly selected a number between 0 and 10 for red balls (and the rest black) with uniform probability. The process was done by a computer program before class and I don't know the contents." (This is meant to be a neutral, random process.)

  7. **Activity Flow (75 minutes total):**

     **Minute 0-5: Introduction and Setup**
     - Welcome and review: "Last week we saw that expected utility theory represents an agent with a single probability measure. Today we are going to test that idea with an activity involving two bags of balls."
     - Explain the known bag (Bag A): 5 red, 5 black. Explain the ambiguous bag (Bag B): contents unknown. Explain the split condition (without revealing the other group's information) and assign groups (e.g., by splitting the room down the middle, or randomly). Write on the board:
          - Group 1: Bag B filled by a classmate with an incentive.
          - Group 2: Bag B filled by a mechanical random process.
     - Explain the raffle: at the end, we raffle the book token. Each raffle ticket is an entry. Students start with 5 tickets.

     **Minute 5-15: Calibration for Red**
     - "We are going to do two separate calibrations, one for red and one for black. First, for red: You are going to write on your index card a number between 0 and 10 for how many red balls you would require in a transparent bag to be indifferent between betting on red from that transparent bag and betting on red from Bag B."
     - Clarify: "If I fill the transparent bag with the number of red balls you write (and the rest black), and then I draw one ball, you would be indifferent between having that bet and betting on red from Bag B. You are not betting now, just setting up the hypothetical."
     - Students write their number for red on one side of an index card (without showing neighbors). Collect the cards immediately to prevent anchoring.

     **Minute 15-25: Calibration for Black**
     - Similarly: "Now, for black: Write the number of black balls you would require in a transparent bag to be indifferent between betting on black from that transparent bag and betting on black from Bag B."
     - Collect the cards.

     **Minute 25-30: Optional Token Introduction**
     - Explain the token: "For 1 raffle ticket, you can buy a token for one bet. This token allows you to flip a coin: heads you bet on the transparent bag you designed, tails you bet on Bag B. So you would be randomizing between the two bags. You can buy this token for the red bet and/or the black bet, but you must decide after you've written your numbers and before we run any bets. We'll give you a moment to decide and then you can purchase tokens with raffle tickets."

     **Minute 30-40: Running the Bets (for demonstration, not for every student)**
     - We don't have time to run every student's bet. Instead, we will demonstrate with a few volunteers or by aggregating the data. But note: the calibration numbers are the key, not the actual betting.
     - Plan: We will tally the numbers for red and black for the whole class and show that they don't add to 10 on average and for many individuals.
     - Steps:
          1. On the board, create two columns: Red and Black. For each student, we will record their red number and black number (anonymously? or by student number?).
          2. Also, note which group they are in (Group 1 or 2).
          3. Ask: "How many of you have your red number plus black number equal to 10?" (Expect few if any.)
          4. Then, for each color, we can compute the average number and show that for red the average might be, say, 4, and for black 4, so 8 < 10.

     **Minute 40-50: Discussion of Results**
     - Display the data (scatter plot? or just the list of pairs?).
     - Highlight that if they were using a single probability measure, they would have the same probability for red and black from Bag B, say p for red and 1-p for black. Then the calibration for red would require the transparent bag to have 10*p red balls, and for black 10*(1-p) black balls. Then the sum would be 10*p + 10*(1-p) = 10. But we see sums less than 10 (if they are ambiguity averse, they will require fewer balls in the transparent bag for each bet, meaning they are more confident in the known bag than the ambiguous bag for each color separately).
     - For example: if a student says 4 for red and 4 for black, then for red they are saying that Bag B is no better than a bag with 4 red (so they think Bag B has at least 4 red? actually, it's about the certainty equivalent). But note: the transparent bag with 4 red and 6 black has a known probability of 0.4 for red. If they are indifferent between that and Bag B for a red bet, then they are revealing that they value the ambiguous Bag B as if it had a probability of 0.4 for red. Similarly, for black, they value Bag B as if it had 0.4 for black (so 0.6 for red). This is inconsistent with a single probability measure.

     **Minute 50-60: Addressing Objections and Variations**
     - Address the "50-50" move: "Some of you might have assumed Bag B is 50-50. If you did, then for red you would have written 5, and for black 5, and they add to 10. But we see that many did not. Why? Because you don't know and that uncertainty matters."
     - Suspicion of cheating: Compare Group 1 and Group 2. If suspicion were driving the results, Group 1 (with the adversarial filler) would have lower numbers for both colors? Actually, if they suspect the filler is against them, then for a red bet they might think the filler put few red balls, so they would require a transparent bag with fewer red balls to be indifferent (because they think Bag B is worse). Similarly for black. So both numbers would be low. But in Group 2, if they trust the process, they might be closer to 5. However, ambiguity aversion predicts both groups show the effect, but perhaps Group 1 more so. But note: the effect (sum<10) should appear in both groups if ambiguity aversion is the main driver, while suspicion might lead to even lower numbers in Group 1.

     **Minute 60-75: Debrief and Lecture**
     - Formalize: What we observed is that people treat the ambiguous bag as if it has a lower probability for red when betting on red and a lower probability for black when betting on black. This cannot be captured by a single probability measure. It suggests that the agent uses a set of probabilities or a non-additive measure.
     - Introduce the term "ambiguity aversion" (Ellsberg paradox) and explain that it violates the independence axiom or the idea that uncertainty can be reduced to a single probability.
     - Note: The gap between the activity and the formal model: The activity shows the behavioral pattern, but the formal model (like Choquet expected utility or maxmin expected utility) will be covered in the next lecture.

  8. **Handling Potential Issues:**
     - **The fifty-fifty move:** Some students will write 5 and 5. That's okay. We can still show that many did not. We can ask: "Did you feel entirely comfortable assuming 50-50? Or did you write 5 because you thought you should?" We can also point out that if they were truly neutral, they should be indifferent at 5, but if they were ambiguity averse, they would require less than 5 for each.
     - **Shaking the bag:** Discourage it. Say: "Shaking won't help because we are about to draw randomly, and the bag is opaque."
     - **Leaking the contents:** If the student who filled Bag B leaks it, then it becomes known. We can say: "If you have inside information, then you are not in the ambiguous situation. But we are studying ambiguity, so please don't share." And if leaked, we might have to exclude that group or note the contamination.
     - **Accusation that the instructor is bluffing:** We can say: "I don't know the contents of Bag B. For Group 2, it was done by a computer. For Group 1, it was done by a student and I don't know who or what they did. I have not looked in the bag." (This is true if we set it up that way.) We can even show that we don't know by having the draw from Bag B done publicly at the end (if we do a demonstration bet).
     - **Refusal to gamble:** They can write "I don't want to bet" but then we can't use their data. We can use that as a point: ambiguity aversion might lead to inaction. But we can also say: "Even if you don't want to bet, try to think what number would make you indifferent if you had to choose."
     - **Empty bag?** The bag has 10 balls (we specified). But if a student asks, we can say: "The bag has 10 balls. I guarantee that."

  9. **What the Activity Cannot Deliver:**
     - The formal models of ambiguity (like capacities, Choquet integral, or multiple priors) will have to be covered in lecture. The activity only shows the behavioral inconsistency with a single probability measure.
     - It might not convince every student. Some might hold onto the single probability by believing they are risk averse (but note: we are not using money, and the bets are symmetric) or by other explanations. The debrief must be clear that risk aversion would affect both bags equally in the calibration (because the transparent bag with 4 red is a known risk, and if they are risk averse they would require more than 4 to compensate? Actually, no: in a gain-only bet, risk aversion doesn't apply because there is no loss. Or if we frame it as a chance to win a raffle ticket, then it's linear in probabilities. So risk aversion wouldn't explain requiring less than 5.)

  **Revised Script:**

  *Minute-by-Minute:*

  0-5: Introduction and setup of bags and groups.
  5-15: Calibration for red (collect cards).
  15-25: Calibration for black (collect cards).
  25-30: Introduce optional token and let them buy tokens (if they want) for 1 raffle ticket per token (for each bet). They can buy up to two tokens (one for red, one for black). They pay by handing in raffle tickets.
  30-40: Tally the numbers on the board for the whole class (anonymously by student ID? or just call out numbers). For each student, we write (red number, black number) and group. Compute the sum for each student and the averages by group.
  40-50: Discuss the pattern: most sums are less than 10. Explain what it means in terms of single probability failure.
  50-60: Compare the two groups: is the effect stronger in Group 1? Address objections.
  60-75: Debrief: introduce ambiguity aversion and Ellsberg. Preview next lecture on non-additive probabilities.

  **Materials:**
  - Index cards (one per student per color? or one card with two sides?).
  - Raffle tickets: pre-distribute 5 per student. Have extra for the book token raffle.
  - Two opaque bags: one with 5 red and 5 black (Bag A), one with 10 balls of unknown composition (Bag B). Note: for Group 1, Bag B was filled by a student (before class) who was given the incentive. For Group 2, Bag B was filled by a random process (e.g., using a random number generator to choose the number of red balls between 0 and 10, then filling accordingly). The instructor does not know the contents of Bag B in either case.

  This activity should create the desired experience and set the stage for the formal treatment.
answer: |-
  Below is a comprehensive, runnable activity designed to achieve your pedagogical goals. The script includes timing, board notes, student tasks, raffle mechanics, and contingency plans for common pitfalls. It builds on your calibration-bag mechanic while incorporating the token and split-group elements to address suspicion and deepen the ambiguity experience.

  ---

  ### **Activity Script: "The Two-Bags Dilemma"**
  **Total Time:** 75 minutes  
  **Materials:**  
  - Opaque Bag A (known): 5 red, 5 black balls (pre-filled in view of students).  
  - Opaque Bag B (ambiguous): Contents hidden. Pre-filled *before class*:  
    - **Group 1 (adversarial)**: Filled by a student volunteer (e.g., "Alex," who gets the book token if the class loses).  
    - **Group 2 (neutral)**: Filled by a "mechanical process" (e.g., dice roll: 1d11-1 red balls, rest black).  
  - **Other items**: Projector, whiteboard, index cards (2 per student), pens, raffle tickets (100+), book token, coin, transparent calibration bag.  

  ---

  #### **Minute 0–10: Setup and Rules**  
  - **Board**:  
    ```  
    TODAY: Calibrating Confidence  
    BAG A (Known): 5 RED, 5 BLACK  
    BAG B (Hidden): ? RED, ? BLACK  
    REWARD: Book token raffle (1 ticket = 1 entry).  
    ```  
  - **Script**:  
    - "Last week, we saw rationality requires a single probability measure. Today, we test that through bets. You each start with **5 raffle tickets**."  
    - Split the room: Left side = **Group 1** (Bag B filled by "Alex," a classmate who gets the token if the class loses raffle tickets overall). Right side = **Group 2** (Bag B filled by dice rolls; I don’t know contents).  
    - "You’ll bet on draws from bags. A winning bet earns +1 raffle ticket. No penalties for losing."  
    - **Crucial framing**: "This is about **your personal indifference**—no right/wrong answers."  

  ---

  #### **Minute 10–25: Calibration Task**  
  - **Hand out 2 index cards per student**. Label one **RED**, one **BLACK**.  
  - **Task**:  
    > "For your color card, write the number of balls I must put in this transparent bag to make you **indifferent** between betting on that color:  
    > - **Option 1**: Bet on the color from Bag B (opaque).  
    > - **Option 2**: Bet on the color from the transparent bag *you design* (filled with X color balls + rest black).  
    > Example: If you write '3' for RED, I fill the transparent bag with 3 red + 7 black. If indifferent, you’d flip a coin to choose the bag."  
  - **Rules**:  
    - Work silently. No discussing numbers—this is about your intuition.  
    - Write numbers 0–10. Submit cards face-down when done.  
  - **During work**:  
    - Circulate to deter discussion. If students rush, say: "Take time—this is about your gut feeling, not math."  
  - **After submission**: Collect cards **immediately** to prevent anchoring. Place in two piles (RED/BLACK).  

  ---

  #### **Minute 25–35: Token Introduction**  
  - **Board**:  
    ```  
    OPTIONAL TOKEN: Cost = 2 raffle tickets.  
    Effect: For one bet, a coin flip chooses your bag (transparent vs. Bag B).  
    ```  
  - **Script**:  
    - "After calibrating, you might feel uneasy committing to one bag. For **2 raffle tickets**, buy a token to let chance decide your bag for a bet. Buy now if you want—limited to one token per student."  
    - **Why tickets?** Forces trade-offs: Tickets are raffle entries, so spending reduces book-token chances.  
  - **Mechanics**:  
    - Students buy tokens by handing you 2 tickets. Record names to avoid reuse.  
    - Tokens are physical (e.g., marked index cards) to make them tangible.  

  ---

  #### **Minute 35–50: Filling Bags + Betting Demo**  
  1. **Process calibration bags**:  
     - For **RED cards**: Call 3 students (e.g., front/middle/back of room) to read their numbers aloud. Fill the transparent bag *exactly* as specified for each.  
     - For **BLACK cards**: Repeat with 3 new students.  
     - **Board**: Record numbers anonymously:  
       ```  
       RED: 4, 3, 5, ...  
       BLACK: 4, 6, 4, ...  
       ```  
     - *No bets yet*—this visualizes their choices.  

  2. **Demo two actual bets** (to incentivize engagement):  
     - **Bet 1 (RED)**: Pick a volunteer. They choose:  
       - Bet on Bag A, Bag B, or use token (if bought). Draw a ball; if red, they win +1 ticket.  
     - **Bet 2 (BLACK)**: Repeat with a new volunteer.  
     - *Focus*: "Notice how you felt when Bag B was chosen—uncertainty vs. known bags."  

  ---

  #### **Minute 50–60: Group Comparison**  
  - **Board**: Tally class results.  
    ```  
    GROUP 1 (Adversarial):  
    RED avg: [3.7] | BLACK avg: [3.9] | SUM: [7.6]  
    
    GROUP 2 (Neutral):  
    RED avg: [4.2] | BLACK avg: [4.3] | SUM: [8.5]  
    ```  
  - **Script**:  
    - "Look at the sums—most are below 10. If Bag B had a single probability, your red + black should equal 10. Why don’t they?"  
    - "Group 1, did suspicion make you avoid Bag B? Group 2, did randomness feel safer?"  
    - **Key question**: "Did anyone write numbers adding to 10? If so, did you *truly* feel indifferent, or did you assume 50/50?"  

  ---

  #### **Minute 60–75: Debrief and Lecture Bridge**  
  - **Reveal the point**:  
    > "Today wasn’t about risk aversion (Bag A is identical for all) or guessing contents (you didn’t assume I stacked it). It was about **ambiguity**—the discomfort from missing information. Your numbers didn’t add to 10 because with ambiguity, people act as if probabilities are *malleable*, not fixed."  
  - **Map to theory**:  
    - "In expected utility, a single measure forces your red + black = 10. But when you wrote [example: 4 red + 4 black], you treated Bag B as ‘worse than 4 red’ for red bets AND ‘worse than 6 red’ for black bets. That’s inconsistent with one probability."  
    - "The token? It’s a ‘safety net’—ambiguity-averse people pay to avoid committing to the ambiguous bag."  
    - "Groups 1 and 2 both showed the effect, but Group 1 had lower sums. Suspicion *amplifies* ambiguity but doesn’t explain it—if it did, you’d prefer Bag B when betting *against* the filler, but you didn’t."  
  - **Formal segue**:  
    > "This is the **Ellsberg paradox**. Next time, we’ll model this with non-additive probabilities or multiple priors. For now, feel the tension: rationality’s single measure *broke* here."  

  ---

  ### **Handling Pitfalls**  
  | Pitfall                  | Response                                                                                                                                 |  
  |--------------------------|------------------------------------------------------------------------------------------------------------------------------------------|  
  | **"I assume 50/50"**     | "Great—if true, your numbers add to 10. But most don’t. Why? Because ambiguity makes 50/50 feel like a *guess*, not a certainty."        |  
  | **Shaking bags**         | "Shaking ensures randomness, but it won’t reveal contents. The issue isn’t fairness—it’s your lack of knowledge."                        |  
  | **Filler leaks contents**| "If Alex leaks Bag B, note: this kills ambiguity. We’ll exclude their data, but it proves the point—ambiguity vanishes with knowledge." |  
  | **"You’re bluffing!"**   | "I genuinely don’t know Bag B’s contents. Group 2’s was random; Group 1’s was sealed by Alex. I’ll draw publicly to prove no tampering." |  
  | **Anti-gambler**         | "You can write ‘pass,’ but think: if forced to bet, what number *would* feel fair? That’s the intuition we’re exploring."                |  
  | **"Empty bag?"**         | "Bag B has 10 balls—I guarantee it. The range is 0–10, but it’s physically full."                                                        |  

  ---

  ### **What the Activity Can and Cannot Deliver**  
  - **Successes**:  
    - Forces students to *confront* ambiguity (not assume 50/50).  
    - Makes inconsistency visible (their numbers ≠10) and personal ("I wrote that!").  
    - Neutralizes risk aversion (bets are symmetric, no losses) and cheating objections (split-group design).  
    - Token illustrates ambiguity-avoidance behavior.  
  - **Limitations**:  
    - **The formal gap**: Students won’t intuit non-additive probabilities from the activity alone. Use the debrief to show how their inconsistency maps to the math:  
      > "Your 4 red + 4 black implies probabilities are *fluid*: for red bets, Bag B feels ≤40%; for black, ≤40% again—which violates additivity. Next class, we’ll formalize this as a capacity or set of priors."  
    - **Nuanced suspicion**: Group differences may be subtle. If Group 1’s sums aren’t lower, stress: "Suspicion might deepen ambiguity aversion, but it’s still about information gaps."  
    - **Token underuse**: If few buy tokens, say: "In experiments, 70% pay to avoid ambiguity—your reluctance mirrors real behavior."  

  ---

  ### **Why This Works**  
  - **Staged discovery**: Students *generate* the paradox (writing inconsistent numbers), making it visceral.  
  - **No jargon early**: Avoids "Ellsberg" or "ambiguity" until debrief, preventing intellectualization.  
  - **Split groups + token**: Preempts objections and enriches discussion.  
  - **Anchoring minimized**: Silent writing + immediate card collection reduces peer influence.  

  **Final Tip**: Start the debrief by validating discomfort—"If this felt messy, good! Rationality isn’t intuitive here." This primes them for the formal fix next session.
