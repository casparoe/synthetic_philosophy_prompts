prompt: |-
  You are a political philosopher whose research is in democratic theory and the normative foundations of the franchise: the boundary problem, the enfranchisement of children and of resident non-citizens, and the ethics of electoral participation rules. Work slowly and carefully. Before writing your answer, do two things privately: first, restate each of my commitments in the strongest form you can give it; second, test them against each other pairwise, marking each pair as a real conflict, an apparent conflict, or no conflict. Then give me the audit.

  The context: I have been asked to write the normative section of a report for a standing commission on electoral law, and before I commit these views to print I want to know whether the package I have arrived at actually hangs together. A colleague tells me it does not, but she will not say where. Here is roughly where I have landed.

  (a) The franchise is grounded in affected interests rather than in membership. What gives someone a claim to a say is that the state's coercive decisions substantially shape the course of their life over the long run. It follows that long-term resident non-citizens — including residents without legal status — should be able to vote in national elections. I take citizenship to be, in itself, no more morally relevant to the franchise than eye colour, and I do not think consent, contract, or cultural membership can do the boundary work that affected interests do.

  (b) There should be no competence, literacy, or civic-knowledge requirement for the franchise. I reject epistocratic proposals, including the statistically sophisticated ones, on the familiar grounds that the aggregation results they invoke are sensitive to assumptions about voter independence, and that such tests have in practice tracked class and race. More strongly: I do not think the quality of a person's political judgment is the right kind of thing to gate the franchise at all.

  (c) The voting age should be fourteen. I hold this as a substantive judgement, not as a placeholder pending better psychology.

  (d) Voting should be legally compulsory: a duty to turn out, enforced by a modest fine, with easy postal and absentee options and, in my view, an election-day holiday. Two features of the scheme matter to me and I want them preserved: the ballot must contain a formal abstention option, and the secret ballot must be preserved in full. The reason is that I also think there is a genuine moral right to withhold one's endorsement — no one may be required to prefer one candidate to another, and conscientious abstention is sometimes exactly the right thing to do. A colleague says these two features of (d) cannot be had together. I think she is wrong, but I would like the objection answered properly rather than waved off.

  (e) Compulsion is over-determined for me, and I would be sorry to lose any of the three grounds: it is a duty of democratic self-rule owed by the members of a political community to one another; it makes the electorate mirror the population whose interests are at stake rather than the old, the rich, and the already-engaged; and it improves the uptake of the policies that track those interests.

  (f) I reject proxy voting for children — the proposal that parents cast additional votes on behalf of their minor children. My reason is that it hands parents political power in proportion to their fertility and treats children as extensions of their parents rather than as the independent agents they are becoming. I take this to be decisive, not a tie-breaker.

  (g) Two boundary assumptions I have been making without much argument: that a residency-duration requirement (a year, say) is acceptable for newly arrived residents; and that citizens who have lived abroad for decades retain the vote indefinitely.

  One more thing my colleague presses: she says (a) absurdly enfranchises tourists and short-term visitors, and that this shows affectedness cannot supply a franchise at all. I am inclined to think the objection is generic to any criterion that has to be implemented by a threshold, and so tells against nothing in particular — but tell me if I am wrong.

  What I want from you, in this order:

  1. The pairs that are in real conflict, ordered by severity, with what each conflict forces me to give up, add, or qualify.
  2. The pairs that only look like they conflict, with an explanation of why they dissolve — and if a dissolve works only given some further condition I have not stated, say what that condition is and how much it costs me.
  3. For each real conflict, the cheapest repair and its price.
  4. One overall recommendation: the single revision that cleans up the most, and what I lose by making it.
  5. Anything the package needs but lacks — a distinction, a principle, an argument I have not made — rather than only a list of what is wrong with what I have.

  Where any of this turns on an empirical claim about turnout, adolescent political judgment, or parental influence over minors, say which claim it is and how much of my view rests on it. Be blunt where a commitment cannot survive. Do not give me a reading list, a literature survey, or citations: I want the argumentative work, not sources, and I have no interest in who said what first.
reasoning: |-
  Hmm, the user is asking me to analyze their political philosophy commitments regarding democratic theory and voting rights. They've outlined several positions: affected interests as the basis for franchise (a), rejecting competence tests (b), lowering voting age to 14 (c), compulsory voting with abstention option (d), justifications for compulsion (e), rejecting proxy voting for children (f), and boundary assumptions about residency (g). They want me to test these for internal consistency.

  First, I need to restate each commitment in its strongest form. For (a), this means anyone substantially affected by state coercion has a claim to vote, regardless of citizenship status. For (b), no epistemic barriers to voting whatsoever - political judgment quality is irrelevant to voting rights. For (c), fourteen-year-olds have inherent political agency requiring direct enfranchisement. For (d), mandatory voting with secret ballot and formal abstention must coexist. For (e), compulsion serves democratic duty, representativeness, and policy responsiveness. For (f), proxy voting treats children as property rather than developing agents. For (g), residency requirements are acceptable while lifelong expat voting isn't problematic.

  Now for pairwise testing. The major conflicts I see are between (a) and (g) - affected interests versus residency thresholds - which creates a real tension in how we define substantial affectedness. Also between (c) and (f) - if fourteen-year-olds can vote, why can't younger children have proxy votes? There's also the colleague's objection about tourists in (a) that needs addressing.

  The secret ballot/abstention combo in (d) seems workable with proper implementation - no conflict there. (e) supports (d) well. (b) actually strengthens (a) and (c) by removing competence barriers.

  For repairs: On the residency conflict, distinguishing between "shaping" and "subject to" coercion might help - tourists are affected but not subjected to lifelong shaping. On children's rights, emphasizing developmental thresholds could reconcile direct voting at 14 with rejecting proxies for younger children.

  The biggest fix would be clarifying the affected interest theory to handle thresholds better - this would resolve multiple issues including the tourist objection. The cost is some loss of theoretical purity, but gains coherence.

  The package lacks a clear principle for distinguishing different stages of life regarding political agency - this needs more development, especially relating to the 14-year threshold. The residency/affectedness boundary also requires more justification than currently provided.

  I'll organize this analysis by severity of conflicts, explaining each clearly and offering practical solutions that maintain the core of their commitments while improving coherence. The key is preserving their radical democratic vision while making it internally consistent.
answer: |-
  ## Comprehensive Audit of Your Normative Framework

  Following your instructions, I've privately restated your commitments in their strongest form and conducted pairwise conflict testing. Below is the audit structured as requested.

  ---

  ### 1. Real Conflicts (Ordered by Severity & Theoretical Cost)

  **Conflict 1: (a) Affected Interests vs. (g) Residency Thresholds**  
  - **Nature:** Real conflict.  
  - **Strong Restatements:**  
    - (a): *Any individual whose life trajectory is substantially shaped by a state's long-term coercive decisions has an unqualified moral claim to vote, irrespective of formal status.*  
    - (g): *States may permissibly impose a residency duration requirement (e.g., 1 year) before granting voting rights to new residents, while indefinitely preserving voting rights for non-resident citizens.*  
  - **Conflict:** (a) implies that *anyone* substantially affected by long-term coercion (e.g., a migrant worker arriving 2 months ago facing deportation) has an immediate claim. (g) delays this claim arbitrarily. The non-resident citizen clause is especially problematic: expats may lack substantial affectedness (contra (a)), while new residents possess it but are denied suffrage.  
  - **Forces You To:** Abandon either (g)'s residency requirement *or* modify (a) to incorporate a threshold of "settled affectedness" (costing theoretical purity). The expat voting clause is indefensible under (a) and must be dropped.  

  **Conflict 2: (c) Voting Age 14 vs. (f) No Proxy Voting**  
  - **Nature:** Real conflict (in developmental logic).  
  - **Strong Restatements:**  
    - (c): *All individuals aged 14+ possess sufficient political agency to exercise the franchise directly as a matter of inherent right.*  
    - (f): *Granting proxy votes to parents fundamentally denies the emerging independent agency of minors and unjustly amplifies parental power based on fertility.*  
  - **Conflict:** If 14-year-olds are agents deserving direct votes, why are 13-year-olds (or younger) not also agents deserving *some* form of suffrage? (f) rejects proxy voting as a violation of agency, but (c) implicitly accepts that agency emerges abruptly at 14. This undermines the "independent agents they are becoming" rationale in (f).  
  - **Forces You To:** Either lower the voting age further (below 14) to align with developmental gradualism *or* justify why agency emerges *suddenly* at 14 (costing consistency in agency theory).  

  **Conflict 3: (d) Compulsion + Secret Abstention vs. (d)'s Own Structure**  
  - **Nature:** Apparent conflict (resolved below).  
  - **Colleague's Objection:** Mandatory turnout with secret ballots and formal abstention creates a paradox: if abstention is secret, how is "duty to turn out" enforced without verifying ballot content?  
  - **Resolution:** **No real conflict.** Enforcement can target *attendance* (verifying ballot receipt) without observing *ballot content*. A formal abstention option on the ballot satisfies your moral right to withhold endorsement. The state checks only that you received/deposited a ballot, not how you marked it. This preserves both compulsion and the secret right to abstain.  
  - **Cost:** Requires robust administrative safeguards to prevent coercion *at the point of ballot marking* (e.g., private voting booths, no photography). Your election-day holiday helps.  

  ---

  ### 2. Apparent Conflicts (Why They Dissolve)

  **Conflict: (a) Affected Interests vs. "Tourist Problem"**  
  - **Objection:** (a) enfranchises tourists/short-term visitors.  
  - **Resolution:** **Apparent conflict.** Your "substantially shape the course of their life over the long run" criterion inherently excludes tourists. Tourists are transiently affected (e.g., sales taxes) but not *shaped* by coercive structures (e.g., education, policing, permanent residency rules).  
  - **Needed Clarification:** Explicitly distinguish *transient impact* from *enduring life-shaping coercion*. This costs nothing—it’s latent in your phrasing.  

  **Conflict: (b) No Competence Tests vs. (c) Age 14 Threshold**  
  - **Objection:** Age threshold is an implicit competence test.  
  - **Resolution:** **Apparent conflict.** (b) rejects gatekeeping based on *judgmental quality*. (c) is based on *presumptive agency*, not competence. Age is a bright-line proxy for minimal autonomy/affectedness (e.g., long-term stakes in education policy), not a judgment of political wisdom.  
  - **Needed Clarification:** Argue that age thresholds are *not epistemic* but *agency-based*. This aligns with (a)’s focus on stakeholding.  

  **Conflict: (d) Compulsion vs. (a) Affected Interests**  
  - **Objection:** Compulsion coerces the unwilling to participate.  
  - **Resolution:** **No conflict.** (a) grounds the *right* to vote; (d) addresses the *duty* to exercise that right for systemic health. Compulsion serves the collective good of representativeness (e) without negating the right.  

  ---

  ### 3. Cheapest Repairs for Real Conflicts

  1. **Conflict 1 (a vs. g):**  
     - **Repair:** Drop non-resident citizen voting. Replace the residency requirement with a "settled life-shaping" criterion (e.g., tax residency, employment, school enrollment).  
     - **Price:** Loses lifelong expat voting (minor practical loss, major coherence gain). Residency threshold becomes a *proxy* for "settled affectedness," not a standalone requirement.  

  2. **Conflict 2 (c vs. f):**  
     - **Repair:** Defend 14 as a *developmentally plausible* bright line for *minimal autonomous agency* in voting, citing evidence on adolescent cognition/social identity formation. Accept that agency develops gradually but argue 14 is a justifiable threshold.  
     - **Price:** Concedes that agency thresholds are somewhat arbitrary but practically necessary. Weakens the "becoming agents" argument against proxies *only if* applied to teens near 14.  
     - **Empirical Claim:** *"By age 14, adolescents typically possess the cognitive capacity and social awareness necessary for basic political judgment."* Your view rests heavily on this; if false, (c) collapses.  

  ---

  ### 4. Overall Recommendation: Single Revision Cleaning Up the Most  
  - **Revision:** **Clarify and tighten the "substantial life-shaping" criterion in (a)** to explicitly exclude transient affectedness (tourists) *and* to incorporate "settled engagement" as a threshold for new residents (replacing (g)'s fixed duration). Drop non-resident citizen voting.  
  - **What You Lose:**  
    - The simplicity of a fixed residency rule (replaced by a fuzzier but normatively consistent standard).  
    - Sentimental attachment to expat voting (which lacks a coherent foundation under (a)).  
  - **What You Gain:**  
    - Resolves the tourist objection.  
    - Eliminates the worst conflict (a vs. g).  
    - Strengthens (a)'s coherence as a standalone franchise theory.  

  ---

  ### 5. What the Package Lacks  
  - **A Theory of Political Agency Development:** Your framework needs a *non-arbitrary principle* for why 14-year-olds are agents deserving direct votes, while younger children (even if affected) are not. This must align with your rejection of proxy voting.  
    - **Proposal:** Argue that voting requires *minimal reflexive agency*—the capacity to see oneself as a participant in collective self-rule. Cite evidence that this emerges in early adolescence (~12-14).  
  - **A Distinction Between "Subject To" and "Shaped By" Coercion:** Tourists are *subject to* laws; residents are *shaped by* them through lifelong institutions (schools, labor markets). Make this explicit.  
  - **A Fuller Defense of Compulsion's Coercion:** Address libertarian objections that forcing turnout violates autonomy. Your (e) hints at this (duty to co-citizens), but needs expansion: *The minimal coercion of turnout is justified to sustain the system guaranteeing rights under (a).*  

  ---

  ### Final Note on Empirical Dependencies  
  - **Adolescent Capacity (for (c)):** If 14-year-olds systematically lack basic political cognition (evidence suggests they don't), (c) fails.  
  - **Parental Influence (for (f)):** If parents *de facto* control teens' votes (data suggests limited influence), (f)'s agency argument weakens, but your anti-fertility-bonus stance holds.  
  - **Compulsory Turnout (for (d)/(e)):** If fines disproportionately penalize the poor (likely without progressive structuring), your representativeness goal is undermined.  

  Your package is *mostly* coherent with minor revisions. The core tension—radical inclusion via affected interests versus practical thresholds—is inherent in boundary problems. Prioritize clarifying (a) and its implications for (g); other conflicts are manageable.
