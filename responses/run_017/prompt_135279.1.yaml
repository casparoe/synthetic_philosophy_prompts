      "closest_thing_that_would_license_it": "A dualist view where laws are conscious entities imposing will, or a world with unstable laws causing visible 'glitches'.",
      "rewrite_suggestion": "Make the drag a hallucination or empathic sense of the Overspill's 'wrongness'—e.g., 'She felt the universe straining against its own logic.'"
    },
    "broken_law_scene": {
      "coherent_on": "Fringe anti-Humean views where laws are contingent and violable (e.g., Nancy Cartwright's patchy laws), or Humeanism (where 'broken law' just means an unexpected event).",
