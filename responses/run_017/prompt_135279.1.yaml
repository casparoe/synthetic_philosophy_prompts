  **Key Fixes for Your Plot**:  
  - **Nomic Drag**: Repurpose as psychological/metaphorical (e.g., "the weight of the world's wrongness").  
  - **Broken Law**: Use Humeanism—your protagonist disrupts an expected pattern, not a governing force.  
  - **Overspill Viability**: Stress that the Overspill is *metaphysically* unstable (its laws are "misfit" to its history), justifying character unease.  
