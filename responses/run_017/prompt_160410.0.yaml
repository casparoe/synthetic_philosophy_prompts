prompt: |-
  hey — so in my effective giving group chat everyone keeps describing moral trade as basically just market trade with a different commodity: you each have comparative advantage in some bit of the world, you specialise, you swap, both sides come out ahead, so it's a clean win and there's nothing morally interesting left to argue about. And they ride that pretty hard to get three conclusions: that refusing to trade on principle is just leaving value on the table, that it doesn't matter what your counterparty actually cares about (even if you think their cause is worthless, or worse than worthless), and that we should all be doing far more of it — someone even floated building an actual exchange for it.

  I've been doing a bit of this myself, which is why I care. My flatmate is a vet who cares about farmed animal welfare, I care about global health, and every month we each put £150 into the other one's charity instead of our own. Three wrinkles have come up. She wants to stagger it — I pay in month one, she pays in month two — and calls that extending credit. A bloke at my climbing gym offered me a trade where his side is his church's mission trip, which I think is somewhere between useless and actively harmful; he thinks bednets are a waste of money; his pitch was still that it's just trade, so we both win. And I've been mucking about with two extensions nobody in the chat has mentioned: trading with someone who has no moral views at all and just wants cash for their own consumption, and "trading" against my own future giving — pledging now to give in five years' time, in exchange for someone else giving now.

  Can you audit the analogy properly? Take ordinary market trade as the source and moral trade as the target, and tell me what maps onto what, which bits of the source the analogy quietly drags in that the target hasn't got, and whether the three conclusions survive once the disanalogies are on the table. I'd like:

  1. Summary — 60 to 80 words, whether the market picture survives as an argument and what it can and can't carry.
  2. The mapping — a table of correspondences (the goods, the budget, comparative advantage, gains from trade, the exchange rate or price, enforcement and trust, whoever ends up consuming the benefit, the numeraire), 200 to 250 words including the table.
  3. Where it holds — the structural parallels that are real, 150 to 200 words.
  4. Where it breaks — split it into breaks that matter for those three conclusions and breaks that are cosmetic; call out explicitly which features of actual markets the analogy imports that moral trade lacks (money as a common measuring rod, contract law, the trader also being the consumer, no third-party beneficiaries, no externalities), 350 to 400 words.
  5. My three cases — the staggered credit idea, the mission trip trade, and my hired-gun and borrow-against-future-giving extensions, 250 to 300 words.
  6. A better analogy — if there is one, 100 to 150 words.
  7. What survives — which of the three conclusions the market framing can still support, and how much weaker each one comes out, 100 words.

  No need to name-drop anyone or point me at anything to read, I just want the argument. British English please.
reasoning: |-
  Okay, the user is part of an effective giving group where everyone is big on moral trade, comparing it to market trade. They've got three main conclusions: refusing trade is wasteful, the counterparty's cause doesn't matter, and they should do more of it, even setting up an exchange. The user has practical concerns from their own experiences—like staggered payments with their vet flatmate, a questionable trade with someone pushing a harmful mission, and their own experiments with trading for cash or future commitments. They want a thorough audit of how well the market analogy holds up.

  First, I need to break down the market analogy step by step. The user's asking for a structured analysis: summary, mapping table, where it holds, where it breaks (especially regarding those three conclusions), their specific cases, a better analogy if exists, and what conclusions survive. 

  Starting with the summary: The market analogy works to show mutual benefit via specialization, but it oversimplifies. It doesn't handle cases where causes are harmful or when there's no shared moral framework. So while the core idea of gains from trade stands, the conclusions about indifference to counterparty causes and universal applicability don't hold up. 

  For the mapping table, I'll need to line up elements like goods, budget, comparative advantage, etc., between market and moral trade. Key points: money vs. moral impact, personal budget vs. giving budget, comparative advantage in effectiveness. The exchange rate is tricky—it's negotiated, not market-driven, and lacks a numeraire like money. Enforcement relies on trust, not contracts, and the beneficiaries are third parties, not the traders themselves. 

  Where the analogy holds: The structural parallels are real. Both involve specialization and trade leading to mutual gains. Just as countries trade goods they're efficient at producing, donors trade causes they're effective in. The gains come from leveraging each other's strengths, so refusing trade does waste potential impact. 

  Where it breaks: This needs splitting into issues affecting the conclusions and cosmetic ones. For conclusion 1 (refusing trade wastes value), the break is minor—externalities and enforcement problems exist but don't negate the core benefit. For conclusion 2 (counterparty's cause doesn't matter), it's critical: if a cause is harmful, trading amplifies harm, and impact isn't fungible without a common metric. For conclusion 3 (do more trade/exchange), enforcement without contracts is shaky, and cause neutrality ignores harm risks. Missing market features like money as a numeraire, contract law, and direct consumption make the analogy leaky. 

  Handling the user's cases: 
  - Staggered credit: This is like trade credit in markets. Trust is key; if broken, it's a moral debt, not legal. 
  - Mission trip trade: If both see each other's causes as harmful, it's like trading "bads," increasing net harm. The market analogy falsely suggests mutual benefit here. 
  - Hired gun (cash for consumption): This is paying for influence, not moral trade. It's bribery, not mutual gain. 
  - Borrowing against future giving: This introduces debt and enforcement risks. It's similar to bonds but without collateral. 

  Better analogy: Diplomacy or barter fits better—negotiating mutual concessions without a common currency, but gains depend on shared goals. If goals conflict, it fails. 

  What survives: Only the first conclusion stands strong—refusing beneficial trades wastes value. The second is weak; counterparty matters if harm is possible. The third is conditional—more trade is good only with trustworthy partners and no harm. 

