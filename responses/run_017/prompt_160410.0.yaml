answer: |-
  ### 1. Summary (75 words)  
  The market analogy correctly identifies mutual gains from specialisation in moral trade, supporting the claim that principled refusal wastes value. However, it fails to generalise fully: it smuggles in assumptions (e.g., fungible "goods", no harmful externalities) that real moral trade lacks. Consequently, while the case for *beneficial* trades holds, conclusions about cause-neutrality and universal scalability break down when counterparties promote harm, lack shared values, or where enforcement/measurement gaps exist. The analogy’s utility is thus narrow and conditional.

  ### 2. The Mapping  

  | **Market Trade Element**       | **Maps to Moral Trade As...**         | **Key Disanalogy Notes**                                  |
  |-------------------------------|---------------------------------------|----------------------------------------------------------|
  | **Goods**                     | Moral impact (e.g., lives saved, welfare points) | Not objectively measurable; no common unit (e.g., "1 life" ≠ "1 animal life"). |
  | **Budget**                    | Giving budget (£)                     | Direct mapping; money is input, not output.              |
  | **Comparative Advantage**     | Cost-effectiveness in cause area      | Real: e.g., you’re better at global health, they at animal welfare. |
  | **Gains from Trade**          | Increased total impact per £          | Mutual benefit *if* impacts are additive/positive.       |
  | **Exchange Rate / Price**     | Negotiated impact ratio (e.g., £X bednets = £Y cage-free campaigns) | Subjective; no market price discovery mechanism.         |
  | **Enforcement & Trust**       | Reliance on integrity (no contracts)  | No legal recourse; "debt" is moral (e.g., staggered payments). |
  | **End Consumer**              | Third-party beneficiaries (not traders)| Traders don’t "consume" the impact; breaks self-interest assumption. |
  | **Numeraire**                 | Money (£)                             | Money funds actions but doesn’t *measure* moral output. |

  *(Word count: 245)*

  ### 3. Where It Holds (180 words)  
  Structurally, moral trade mirrors markets in leveraging comparative advantage: just as Portugal trades wine for English cloth, you trade donations in your high-impact cause (£150 to AMF) for your vet friend’s £150 in animal advocacy, maximising total welfare gains. Specialisation enables pareto improvements—both "win" versus donating alone. The budget constraint (finite £) and negotiation of exchange ratios ("I’ll give £150 to your cause if you match mine") are direct parallels. Gains arise from reallocating resources to where marginal impact is highest, akin to market efficiency. Crucially, this supports **conclusion 1**: refusing mutually beneficial trades *does* leave impact "on the table", assuming trustworthy partners and positive causes. The core mechanism—voluntary exchange amplifying total output—is robust when causes are non-rivalrous, additive, and aligned in intent (e.g., welfare increases).

  ### 4. Where It Breaks (380 words)  
  **Breaks affecting conclusions:**  
  - **Conclusion 2 ("Counterparty’s cause doesn’t matter")**: Market trades assume goods are value-neutral (e.g., a knife can cut food or people). Moral "goods" aren’t fungible. Trading with the mission trip promoter *amplifies harm* if his work erodes rights or spreads disease. Your £150 to his church actively damages welfare; his £150 to bednets is less harmful but still ethically tainted. The analogy falsely implies mutual benefit, ignoring **negative externalities** and **non-fungibility of impact** (saving a life ≠ "saving" a soul through coercion).  

  - **Conclusion 3 ("We should do far more / build exchanges")**: Markets rely on **contract enforcement** and **price signals**. Moral trade lacks both:  
    - **Enforcement**: Your staggered payment relies on trust. An "exchange" would collapse without binding commitments (unlike eBay/PayPal).  
    - **Measurement**: Without **money as a numeraire**, there’s no objective "price" for impact. Is £1 to AMF = £10 to animal advocacy? Subjective haggling isn’t scalable.  
    - **Common values**: Exchanges require **trader=consumer** alignment. But if traders are cause-neutral (per conclusion 2), an exchange could match bednets with conversion therapy, netting negative impact.  

  **Cosmetic breaks:**  
  - **Third-party beneficiaries**: In markets, traders consume gains; in moral trade, beneficiaries are unrelated. This doesn’t invalidate gains but complicates motivation (altruism ≠ self-interest).  
  - **No numeraire**: Money measures market value; no equivalent for welfare (despite DALYs/QALYs).  

  **Smuggled market features the target lacks:**  
  - **Money as measuring rod**: Enables price discovery; moral trade relies on contested impact estimates.  
  - **Contract law**: Ensures enforcement; moral trade is promises + guilt.  
  - **Trader=consumer**: Aligns incentives; moral traders sacrifice for strangers.  
  - **No externalities**: Markets assume trades are welfare-neutral; moral trades *create* externalities (e.g., your bednets reduce disease burden; his mission may increase stigma).  

  ### 5. Your Three Cases (280 words)  
  - **Staggered "Credit"**: Maps to trade credit (e.g., "pay later"). But: market credit has collateral/legal recourse; here, enforcement is pure trust. If your flatmate reneges, you bear a moral loss (£150 for zero impact) while she gains (£150 extra for her cause). High trust enables this, but asymmetric power risks exploitation.  

  - **Mission Trip Trade**: Illustrates **conclusion 2’s flaw**. He views bednets as "waste" (low value); you view missions as harmful (negative value). Trading turns £300 total into £150 of harm + £150 of low-impact—net welfare likely *worse* than no trade. The market analogy masks this by assuming positive-sum exchange.  

  - **Extensions**:  
    - **Hired Gun (cash for consumption)**: Not moral trade—it’s bribery or paid advocacy. You pay £X for him to "donate" £Y (where Y<X, his profit). Impact may rise if he donates effectively, but he "wins" by skimming, violating mutual gain. Maps to markets for influence, not welfare.  
    - **Borrow-Against-Future-Giving**: Like issuing a moral bond. You promise £150 in 5 years for £150 now from Partner. Risks: inflation, changing priorities, or your death invalidate the "debt". Gains hinge on time-discounting impact (e.g., bednets now > later). Requires enforceable pledges, which moral trade lacks.  

  ### 6. A Better Analogy (120 words)  
  **Diplomatic barter**: Two nations swap concessions (e.g., "We’ll cut tariffs on your steel if you accept our refugees"). Like moral trade:  
  - Gains require **shared goals** (e.g., mutual prosperity/refugee protection).  
  - "Goods" are non-fungible (steel ≠ refugee quotas) and involve third parties.  
  - Trust and reputational enforcement dominate; no binding contracts.  
  - Harmful deals (e.g., trading sanctions for weapons) net negative globally.  
  This fits better than markets by acknowledging **negotiated non-fungibles**, **externalities**, and the **role of values**. If goals conflict (e.g., your humanism vs. his theocracy), no mutual gain exists.

  ### 7. What Survives (95 words)  
  - **Conclusion 1 (refusing trade wastes value)**: Holds strongly *for aligned, positive-impact trades* (e.g., you and your vet).  
  - **Conclusion 2 (counterparty cause irrelevant)**: Fatally weakened; cause *must* matter to avoid harm amplification. You *should* reject trades with harmful actors.  
  - **Conclusion 3 (do more / build exchanges)**: Survives weakly: do more *with vetted partners*, but exchanges are unworkable without objective impact pricing and enforcement. Scalability is limited to high-trust, cause-aligned networks.  

  ---  
  *Key takeaway: Moral trade optimises impact among allies but isn’t a frictionless market. Treat it as strategic barter—not a free lunch.*
