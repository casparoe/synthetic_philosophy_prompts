  Where things get tricky is the dismissal of Bayesian and Jeffrey updating. The summary claims Bayesian conditioning is inapplicable because no proposition is learned with certainty, which is technically correct but slightly overstated - one could argue the learned constraint itself forms a new proposition. More significantly, saying Jeffrey's rule is "no help" oversimplifies. Jeffrey's rule handles cases where we update unconditional probabilities over partitions, but here we're given a conditional probability constraint. Still, some philosophers have tried to force the update into Jeffrey's framework through creative partitioning. (Medium-high confidence)

