prompt: |-
  I write about science and ideas, and I'm finishing a long piece on strong longtermism — the view that what matters most about what we do now, in expectation, is how it shapes the very long-run future. Nearly everyone I've interviewed for the piece argues in expected value, and I've found that when I check their arithmetic against my own reactions to particular funding decisions, the two keep coming apart. So I've started writing down my verdicts on concrete cases in the hope of working out what principle I'm actually using, because I owe my editor at least one sentence that states it.

  The cases, with my gut verdicts. (a) A proposal with a one-in-ten-thousand chance of preventing human extinction this century, against a programme that will certainly save ten thousand lives over the next decade: I fund the first, decisively. (b) The same one-in-ten-thousand shot, but now at preventing what I've started calling sterile survival — humanity persists for the next billion years at roughly current numbers, current standards of living and current reach, never expanding past the solar system and never qualitatively changing, so that no one dies who would otherwise have lived: I fund this at something like two-thirds of the urgency I gave (a), which means I am not treating mere biological survival as the whole story. (c) A one-in-a-hundred chance of making the entire long-run future go ten per cent better — better institutions, less cruelty, more of what I'd call flourishing — against the same certain ten thousand lives: here I take the certain lives, even though by the arithmetic this should be worth ten times as much as (a), since a hundredth of everything is more than a ten-thousandth of everything. My discomfort is partly that it feels presumptuous to shape people who don't yet exist, but (b) has already conceded that existence isn't the only thing I care about, so I can't lean on that. (d) A well-off couple deciding whether to have a child they would raise well: I don't think longtermism gives them any reason to, since an additional happy life doesn't strike me as an improvement in itself. But five thousand colonists, ninety years into a two-hundred-year voyage, whose birth rate has slipped below replacement, so that the mission would simply end with them: their not having children looks to me like a catastrophe, not a neutral choice. (e) An intervention that would establish self-sufficient settlements around other stars two centuries earlier than otherwise, at no added risk, against one that cuts extinction risk this century by one hundredth of a percentage point: these feel to me about equally worth funding, though only the second ever gets talked about. (f) Two programmes that each cut the chance of losing the future by the same small amount, one aimed at engineered pandemics and one at the systems that would shape whatever civilization comes next: I'd pay about a quarter more for the second, because it also averts futures in which we survive indefinitely under values that are badly distorted by my lights — which sits badly with (c).

  What I want from you is the principle, stated precisely enough that I could print it and apply it yourself, clause by clause, with the case that motivates each clause. Tell me what it says about the case I keep going back and forth on: a perpetual endowment under a ten-thousand-year charter, funded now and governed so that the money can be spent later, when the picture is clearer, versus spending the same sum today on the best available extinction-risk reduction. Give me at least two further cases it decides that I haven't listed. And be honest about which of my verdicts it cannot accommodate: if there are two or three candidate principles that cut the losses differently, set them all out and say which verdict each one sacrifices. If something has to go, I'd rather lose (c) than (a), and I'd be most reluctant to give up my reactions to (d) and (e).
reasoning: |-
  Hmm, the user is working on a piece about strong longtermism and has encountered a conflict between expected value calculations and their intuitive judgments on concrete cases. They've listed several scenarios (a through f) with their gut reactions and want me to extract a precise principle that explains these judgments. They also have a specific case they're undecided on (perpetual endowment vs. current extinction risk reduction) and want me to generate new test cases.

  Looking at their judgments: They prioritize extinction prevention over saving lives (a), care about quality of survival (b), reject percentage improvements to the future (c), differentiate between creating new lives (neutral for individuals but essential for humanity's continuation) (d), value expansion timelines equally as extinction risk reduction (e), and prioritize value-lock-in prevention (f).

  The core tension seems to be between three aspects of longtermism: 1) The scale of the future (massive number of potential lives), 2) The fragility of existence (extinction risks), and 3) The quality/character of the future. The user clearly prioritizes existential risk mitigation but with important nuances - they reject mere quantity-focused calculations and care deeply about preserving humanity's potential for expansion and moral progress.

  For the endowment case, I should consider that the user values both preserving optionality and addressing clear extinction threats. Their reaction to (e) suggests they see interstellar expansion as crucial, but their reaction to (c) shows skepticism about distant shaping.

  I notice the user has clear priorities: they'd rather abandon (c) than (a), and want to preserve (d) and (e). This suggests their principle must accommodate the intrinsic importance of humanity's continuation and trajectory, not just aggregate welfare.

  I'll formulate a principle with clauses corresponding to each case, make it precise enough to apply clause-by-clause, and be honest about where it conflicts with their intuitions. I'll also provide two new test cases to probe the boundaries of this principle.
answer: |-
  Here’s a precise principle distilled from your verdicts, designed to accommodate your priorities while flagging tensions. It prioritizes **securing humanity’s trajectory toward expansive flourishing** over pure expected value calculations:

  **The Principle of Existential Trajectory Security (PETS):**  
  *When allocating resources for longterm impact, prioritize actions that:*
  1.  **Secure the possibility of a cosmically significant future** (motivated by a, e).  
      *Weight: Highest urgency.*  
      *Example:* Funding extinction risk reduction (a) or interstellar expansion accelerants (e) over near-term certain gains.
  2.  **Prevent permanent stagnation or value-lock-in** (motivated by b, f).  
      *Weight: High urgency, but secondary to (1).*  
      *Example:* Funding interventions against "sterile survival" (b) or shaping future values/institutions (f) over pure extinction risk reduction of equal probability.
  3.  **Avoid irreversible losses of potential** (motivated by d).  
      *Weight: Context-dependent urgency.*  
      *Example:* Ensuring a colony mission continues (d) is essential; creating one additional happy life (d) is neutral.
  4.  **Defer shaping distant futures when agency is speculative** (motivated by c).  
      *Weight: Low urgency relative to (1)-(3).*  
      *Example:* Rejecting a percentage improvement to the far future (c) in favor of certain near-term saves or concrete trajectory security.

  **Excluded Factors:**  
  *   Raw expected value based purely on scale (conflicts with c).  
  *   Intrinsic value of creating additional happy lives (d).  
  *   Presumption of wisdom to optimize distant, complex futures without concrete mechanisms (c).

  ---

  **Applied to Your Undecided Case: Perpetual Endowment vs. Extinction Risk Reduction Now**  
  *   **PETS Favors the Endowment:**  
      *   Clause 1: The endowment *secures the possibility* of future impact by preserving resources and agency for when the picture is clearer. Extinction risk reduction now also serves Clause 1, but...  
      *   Clause 4: Spending *now* on extinction risk reduction relies on *current* assessments of the best interventions. Given your discomfort with shaping distant futures speculatively (c), the endowment’s deferral mechanism mitigates this risk by allowing future, better-informed agents to act.  
      *   **Verdict:** Fund the endowment. It maximizes optionality and defers high-stakes decisions to contexts with potentially better information and wisdom, aligning with your skepticism in (c) and preference for concrete mechanisms. The extinction risk reduction is valuable, but the endowment better serves the *combination* of Clause 1 (preserving potential) and Clause 4 (avoiding speculative shaping).

  ---

  **Two New Cases Decided by PETS:**  
  1.  **Case G: Asteroid Deflection vs. Embryo Repository:**  
      *   Option A: Spend $X on deflecting a large asteroid (1% chance of causing extinction if not deflected).  
      *   Option B: Spend $X on a secure, self-sustaining lunar repository of human embryos/artificial wombs, capable of restarting civilization if Earth is rendered uninhabitable (guaranteed to function if needed).  
      *   **PETS Verdict:** Fund Option A (asteroid deflection).  
      *   *Why:* Clause 1 (Securing Possibility) prioritizes *preventing* the loss of existing civilization, culture, and accumulated knowledge/know-how. Option B is a backup plan (Clause 3 - Preventing Irreversible Loss), but it risks a vastly diminished, fragile restart far below the potential of our current trajectory. Preventing the catastrophe outright (A) better secures the expansive future.

  2.  **Case H: AI Alignment Research vs. Cultural Seed Vault:**  
      *   Option A: Spend $Y on research directly reducing the risk of loss-of-control misaligned AI causing extinction (estimates: reduces risk by 0.01% absolute).  
      *   Option B: Spend $Y on creating a massively redundant, self-updating digital "Cultural Seed Vault" on multiple celestial bodies, designed to preserve humanity's knowledge, ethical frameworks, art, and scientific understanding for any future intelligent civilization (human or post-human).  
      *   **PETS Verdict:** Fund Option A (AI Alignment Research).  
      *   *Why:* Clause 1 (Securing Possibility) demands focusing on preventing the *loss of the future actors themselves*. Option B (Clause 2 - Preventing Value-Lock-In/Stagnation) is valuable for shaping a *potential* future recovery or influencing other intelligences, but it presupposes survival. Preventing the existential failure mode (AI misalignment) that could wipe out the actors who *could* be influenced or recover takes precedence. Option B becomes relevant only if survival (Clause 1) is secured.

  ---

  **Accommodation of Your Verdicts & Sacrifices:**  
  PETS prioritizes your core intuitions in (a, b, d, e, f) but requires sacrificing (c). Here's why, and alternative principles considered:

  *   **Accommodates:**  
      *   **(a):** Clearly prioritizes securing existence (Clause 1).  
      *   **(b):** Treats sterile survival as stagnation (Clause 2), hence less urgent than extinction (Clause 1). Your 2/3 urgency fits "secondary to (1)".  
      *   **(d):** Distinguishes colony mission (Irreversible Loss of Potential - Clause 3) from individual procreation (neutral).  
      *   **(e):** Treats accelerating expansion (securing a significant future trajectory - Clause 1) as equally vital as extinction risk reduction (Clause 1).  
      *   **(f):** Prioritizes interventions preventing value-lock-in (Clause 2) over pure extinction risk reduction of equal probability.
  *   **Sacrifices:**  
      *   **(c):** PETS explicitly downgrades speculative percentage improvements to the distant future (Clause 4). Your gut rejected it despite the math; PETS codifies this rejection based on lack of concrete agency/presumption. *This is the necessary sacrifice.*
  *   **Tension (Managed):**  
      *   **(f) vs (c):** PETS resolves this by context. Shaping institutions *now* to prevent imminent lock-in of bad values (f) is Clause 2 (high urgency). Making the entire future "10% better" via a vague mechanism (c) falls under Clause 4 (low urgency). The difference is the *concreteness* and *immediacy* of the threat/value being addressed.

  **Alternative Principles & Their Sacrifices:**  
  1.  **Pure Trajectory Securement:** *Only* Clause 1 & 3 (Existence + Preventing Loss of Potential).  
      *   Sacrifices: (b) - Sterile survival becomes neutral/low urgency; (f) - Value-shaping becomes irrelevant unless tied to survival; (c) - Rejected (like PETS). *Loses your key insight from (b) & (f).*
  2.  **Value-Conditioned Expectation:** Maximize probability-weighted value, but value defined solely by scale of flourishing *only if* it meets a threshold of "cosmic significance" (expansion, progress).  
      *   Sacrifices: (d) - The colony mission becomes a massive EV gain (billions of future lives), forcing you to fund it *over* many extinction risk reductions; (e) - Expansion acceleration must be EV-calculated against extinction risk, unlikely to match your "equal worth" verdict. *Forces EV math you dislike.*
  3.  **PETS (Proposed):** Sacrifices only **(c)**, as required.

  **Conclusion:**  
  PETS best captures your hierarchy of concerns: **Existence with potential is paramount; stagnation is a grave but secondary threat; creating lives is neutral unless it prevents irreversible loss; shaping the distant future requires concrete pathways, not speculation.** It justifies funding the endowment over extinction risk reduction now due to its superior optionality and alignment with your aversion to speculative shaping. The sacrifice of (c) is necessary to preserve your stronger commitments to (a, d, e). Your discomfort with (c) isn't just about existence; it's about the *mechanism* – PETS makes this explicit.
