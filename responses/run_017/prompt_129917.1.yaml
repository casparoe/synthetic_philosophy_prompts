prompt: |-
  I teach a final-year seminar on formal epistemology, and I am drafting this year's final. A large share of my students arrive having spent years reading rationalist blogs and forum comment threads, and they bring a habit with them that I want the exam to break: they treat *Dutch book* as a conversation-stopper. Someone's credences look strange and the verdict comes down that they are not a coherent probability distribution, therefore Dutch-bookable, therefore irrational — as if the word itself carried the normative weight, and as if the absence of an actual bookie with a satchel were an empirical accident rather than part of the design of the argument.

  I want one question, in three parts, that forces students to cash the argument out rather than invoke it.

  Constraints: closed book, ninety minutes, twenty-five marks, pitched at final-year undergraduates and MA students. Nothing in it may require library or web access: the paper should supply every definition the student needs, and I want the question itself to say that no marks are awarded for naming authors, papers, or theorems, and that a student can take full marks without them. The mathematics available is elementary — finite sets of worlds, real-valued credences, expectation, dominance.

  I have been playing with a device I would like the question built around, though you may improve on it. Call it the posted-quote bookie. The bookie never learns the agent's credences. Instead the agent is asked to post, for any proposition the bookie names, a number: the price at which she is willing to take either side of a unit bet on that proposition. The bookie then chooses the side and the stake, subject to a fixed cap on the stake, and may repeat this for further propositions, choosing them in light of the quotes already given. The agent is free to decline to quote at all, or to quote something other than her real fair price. Please work out what this mechanism does to the argument: which of the usual idealizations it removes, which it leaves untouched, what exactly it shows when the posted prices are incoherent, what happens when the agent quotes strategically rather than honestly, and whether the argument now constrains the agent's credences or only her quotable, actionable dispositions. I also want the small-stakes cap to be load-bearing rather than decorative.

  I would like three things from you.

  First, the question itself, written out as it would appear on the paper, with any stipulations and definitions, and with a short paragraph setting up the dialectical situation so that a student cannot answer it by restating the definition of a probability measure. The crux should be whether and how the move from exploitability to irrationality is supposed to go, and what is left of the argument once you notice that the losing package is one the agent could simply decline.

  Second, a model answer of about a thousand to twelve hundred words. It should commit to verdicts rather than surveying positions: I will penalise a model answer that merely lists what various people have said about the gap between pragmatic and epistemic arguments.

  Third, a marking scheme. Marks per part, totalling twenty-five, with the part built on the posted-quote bookie worth the most. For each part, name the specific moves that earn the marks, and give one line on how students typically go wrong on each. Then give band descriptors that separate an A from a B from a C by what the answer does and does not contain: a C answer should be attainable by someone who has read the Sequences and absorbed that incoherence means a guaranteed loss, while an A answer should require seeing why that gloss is not yet a normative claim.
reasoning: |-
  We are designing an exam question to challenge the habit of treating "Dutch book" as a conversation-stopper. The question should force students to engage with the underlying argument, especially in the context of a "posted-quote bookie" mechanism.

  The setup: 
  - The bookie does not know the agent's credences.
  - The agent is asked to post, for any proposition the bookie names, a number (the price at which she is willing to take either side of a unit bet on that proposition).
  - The bookie then chooses the side and the stake (with a fixed cap on the stake) and may repeat for further propositions, choosing them in light of previous quotes.
  - The agent can decline to quote or quote dishonestly.

  We want the question to address:
  - Which idealizations are removed and which remain?
  - What exactly the mechanism shows when the posted prices are incoherent?
  - What happens when the agent quotes strategically?
  - Whether the argument constrains the agent's credences or only her quotable, actionable dispositions.
  - The role of the small-stakes cap.

  The question should be in three parts, and the model answer should be 1000-1200 words, committing to verdicts. The marking scheme should detail how marks are allocated and typical mistakes.

  Let's design the question:

  **Question (25 marks total)**

  *In this question, we consider a variation on the Dutch book argument. Instead of a bookie who knows the agent's credences and offers bets that the agent must accept or decline, we have a "posted-quote bookie" with the following rules:*

  1. *The bookie names a proposition. The agent then publicly posts a number, called her quote, for that proposition. This quote is the price at which she is willing to take either side of a bet on that proposition with a unit stake. Specifically, if she quotes p, then she is willing to buy the bet that pays £1 if the proposition is true and £0 otherwise for £p, and also willing to sell that same bet for £p. (So, for example, if she quotes 0.7, she is willing to buy the bet for £0.70 and sell it for £0.70.)*
  2. *After the agent posts the quote, the bookie may choose to buy one unit of the bet from the agent at the quoted price (i.e., the agent sells and the bookie buys) or sell one unit of the bet to the agent (i.e., the bookie sells and the agent buys). The bookie may also choose to do nothing for that proposition.*
  3. *The bookie may then name another proposition (which may be logically related to previous ones), and the process repeats. The bookie's choice of which proposition to name next may depend on the quotes already given.*
  4. *There is a fixed cap on the total absolute stake: the bookie's total stake across all bets (i.e., the sum of the absolute values of the stakes of each bet) must not exceed a predetermined positive constant C. (Note: Each bet has a unit stake, but the bookie can choose the sign by choosing to buy or sell. So the absolute stake per bet is 1, and the total absolute stake is the number of bets actually made.)*
  5. *The agent is free to decline to quote for any proposition. She may also quote a number that is not her true credence (i.e., she may be strategic).*

  *We say that a set of quotes for a collection of propositions is **incoherent** if there exists a set of bets (each with unit stake, and each on one of the propositions) such that the agent's net gain from these bets is negative in every possible world. Note that this is equivalent to the agent's quotes failing to satisfy the axioms of probability (for a finite set of worlds).*

  *(a) (8 marks) Suppose an agent posts incoherent quotes for a finite set of propositions. Show that the bookie can choose a sequence of propositions (starting from that set) and then make a finite set of bets (each with unit stake) such that the agent suffers a net loss in every possible world. Explain why the small-stakes cap (rule 4) is essential to this argument. Why might one think that this result does not, by itself, establish the irrationality of having incoherent credences?*

  *(b) (9 marks) Now consider an agent who has coherent credences (i.e., they form a probability distribution) but chooses to post quotes strategically. Suppose the bookie names a proposition and the agent, knowing the bookie's strategy, posts a quote that may differ from her credence. She may also decline to quote. Can the bookie force the agent to lose money for sure? Or can the agent avoid sure loss? Explain. What does this tell us about whether the Dutch book argument, in this posted-quote setting, constrains the agent's credences or only her quoted prices?*

  *(c) (8 marks) The standard Dutch book argument is often taken to show that having incoherent credences is irrational because it leaves the agent vulnerable to a sure loss. In light of your answers to (a) and (b), evaluate this claim. In particular, discuss: 
     - What the posted-quote bookie argument actually shows.
     - Whether the vulnerability to sure loss is a necessary consequence of incoherent credences, or whether it depends on the agent's disposition to quote prices.
     - Whether the argument might be repaired to target the agent's credences directly, and if so, how.
     - The role of the small-stakes cap in the normative force of the argument.*

  *In your answers, no marks are awarded for naming authors, papers, or theorems. You may take full marks without them. Define any technical terms you introduce.*

  ---

  **Model Answer (approx. 1000-1200 words)**

  **(a)** If an agent posts incoherent quotes for a finite set of propositions, then by the definition of incoherence, there is a finite set of bets (each with unit stake) on these propositions that together guarantee the agent a net loss in every possible world. The bookie, seeing these quotes, can choose to make exactly these bets. Since each bet has a unit stake and the bookie can choose the side (buy or sell) for each, he can arrange the signs so that the package of bets yields a sure loss. 

  However, the bookie is constrained by the small-stakes cap (rule 4): the total absolute stake (which is the number of bets) cannot exceed C. But note: the set of propositions for which the agent has quoted prices might be large, and the Dutch book might require a subset of them. The bookie is allowed to choose which propositions to name and in what order, and he can also name propositions beyond the initial set. However, in this part, we are given that the agent has already posted incoherent quotes for a finite set of propositions. The bookie can then name only the propositions in the finite set that are involved in the Dutch book (which is finite by definition). Since the Dutch book is finite, let the number of bets be N. The bookie can make these N bets provided that N ≤ C. But what if N > C? Then the bookie cannot make all the bets because of the cap.

  Therefore, the small-stakes cap is essential: without it, the bookie could always make the entire set of bets that form the Dutch book. With the cap, if the Dutch book requires more bets than C, then the bookie cannot exploit the entire incoherence. However, note that if the quotes are incoherent, then there exists a Dutch book with a finite number of bets, but that number might be large. The cap might prevent the bookie from exploiting a Dutch book that requires more than C bets. 

  But observe: incoherence for a finite set of propositions implies that there is a Dutch book involving only a finite number of bets, but it does not specify how many. The bookie might not be able to exploit the agent if the minimal Dutch book requires more than C bets. Therefore, the argument only shows that if the agent posts incoherent quotes and the cap C is large enough to cover the minimal Dutch book for that set of quotes, then the bookie can force a sure loss. If C is too small, then the bookie might not be able to force a full Dutch book.

  However, note that the bookie can also name new propositions. But the agent has only posted quotes for the initial set. For a new proposition, the agent might decline to quote or quote arbitrarily. The bookie cannot force the agent to quote a particular price for a new proposition. Therefore, if the initial set of quotes is incoherent but the minimal Dutch book requires more bets than C, then the bookie cannot force a sure loss by adding new propositions because the agent might refuse to quote or quote coherently for the new ones.

  Thus, the result is conditional: if the minimal Dutch book for the set of quoted propositions requires at most C bets, then the bookie can force a sure loss. The cap is essential because without it, the bookie could always force a sure loss for any incoherent set, but with it, the bookie can only force a sure loss if the minimal Dutch book is small enough.

  Why might this not establish the irrationality of incoherent credences? First, the agent could avoid the loss by declining to quote. Second, even if she quotes, she might quote coherently. The argument only shows that if she quotes incoherently and the cap is sufficiently large, then she is vulnerable. But having incoherent credences does not force her to quote incoherently. She might have incoherent credences but quote coherently to avoid exploitation. Therefore, the vulnerability is not a necessary consequence of incoherent credences per se, but of the agent's disposition to express them in quotes.

  **(b)** Now consider an agent with coherent credences who quotes strategically. She may post quotes that differ from her credences and may decline to quote. The bookie has a strategy for naming propositions and for choosing which bets to make based on the quotes.

  Can the bookie force the agent to lose money for sure? The agent can avoid sure loss. Since her credences are coherent, she can always choose to post quotes that are coherent (for instance, by quoting her true credences). If she does so, then by the standard Dutch book theorem, no Dutch book exists, so the bookie cannot force a sure loss. Moreover, even if the bookie names a proposition and she declines to quote, then no bet is made on that proposition. So she can avoid any loss by declining. Alternatively, she can quote coherently and avoid a Dutch book.

  But note: the agent might choose to post incoherent quotes. In that case, the bookie might exploit her by forcing a sure loss. However, the agent can avoid this by either declining to quote or by quoting coherently. Therefore, the agent can always avoid sure loss by appropriately choosing her quotes.

  What does this tell us? The Dutch book argument in this setting does not constrain the agent's credences directly. It constrains her quoted prices. The agent with coherent credences can avoid sure loss by managing her quotes (by being honest or by declining). The vulnerability is not about the credences but about the agent's willingness to post prices that are incoherent. Therefore, the argument targets the agent's quotable, actionable dispositions, not her credences.

  **(c)** The standard Dutch book argument claims that having incoherent credences is irrational because it leads to vulnerability to a sure loss. However, the posted-quote bookie argument shows:

  1. **What the argument shows:** The argument shows that if an agent posts incoherent quotes and the bookie's cap is large enough to cover the minimal Dutch book, then the agent is vulnerable to a sure loss. But it does not show that having incoherent credences necessarily leads to vulnerability. The agent might have incoherent credences but never post quotes, or post coherent quotes, and thus avoid the loss.

  2. **Vulnerability and disposition:** The vulnerability to sure loss depends on the agent's disposition to quote prices. If the agent is disposed to post quotes that reflect her credences (and they are incoherent) and the cap is large enough, then she is vulnerable. But if she is disposed to post only coherent quotes (even if her credences are incoherent) or to decline, she avoids vulnerability. Therefore, the Dutch book argument, in this form, does not show that incoherent credences are irrational per se, but that a particular disposition to act on those credences (by posting them) is pragmatically bad.

  3. **Repairing the argument:** To target the agent's credences directly, one might argue that if the agent has incoherent credences, then she is disposed to post them when asked. But this disposition might not hold. Alternatively, one might use a different argument, such as the accuracy argument (which is epistemic), to show that incoherent credences are defective regardless of betting behavior. However, in the betting context, if we remove the agent's freedom (e.g., by requiring her to post her true credences) then the argument would apply. But in the posted-quote setting, the agent has the freedom to decline or lie.

  4. **Role of the small-stakes cap:** The cap is crucial because without it, the bookie could exploit any incoherent set of quotes regardless of how many bets are required. With the cap, the vulnerability is limited: only if the minimal Dutch book is small enough. This makes the argument less powerful because it only applies to small Dutch books. However, it also reflects a practical constraint: in real life, agents might only be exposed to a limited number of bets. The cap also prevents the bookie from forcing the agent into arbitrarily large losses, which might be seen as unrealistic. But the normative force of the argument is weakened because the agent might be incoherent but only in a way that requires a large Dutch book, and then the cap protects her.

  In conclusion, the posted-quote bookie argument does not directly show that incoherent credences are irrational. It shows that publicly posting incoherent quotes can lead to sure loss if the bookie is allowed to make a sufficient number of small bets. The normative force is pragmatic and applies to the agent's actions (posting quotes) rather than her beliefs. To establish the irrationality of incoherent credences, one must look beyond this pragmatic argument, perhaps to epistemic arguments that target the accuracy of credences.

  ---

  **Marking Scheme**

  Total: 25 marks

  **Part (a) [8 marks]**

  - Show that the bookie can force a sure loss if the quotes are incoherent and the cap is large enough: 4 marks. 
    - Specifically: 2 marks for explaining that the bookie can choose the bets that form the Dutch book (with the correct signs) and 2 marks for noting the condition that the number of bets required (N) must be ≤ C.
  - Explain why the small-stakes cap is essential: 2 marks.
    - The cap might be too small (N > C) so the bookie cannot make the full Dutch book.
  - Why the result does not establish irrationality of incoherent credences: 2 marks.
    - Because the agent could avoid posting quotes or post coherent quotes even if her credences are incoherent.

  *Typical mistake:* Students might not notice the role of the cap and claim that the bookie can always force a sure loss regardless of the cap. They might also fail to see that the agent can avoid the loss by not quoting.

  **Part (b) [9 marks]**

  - Explain that the agent can avoid sure loss: 3 marks.
  - Explain how: by either declining to quote or by quoting coherently (even if her true credences are coherent, she can quote coherently) - 3 marks.
  - What this tells about the target of the argument: that it constrains quoted prices, not credences - 3 marks.

  *Typical mistake:* Students might think that because the agent has coherent credences, she must quote them honestly and then avoid loss, but they may not consider that she can also decline or that she might strategically quote coherently even if her credences are not (but the question states she has coherent credences). Also, they might not see that the bookie cannot force her to post incoherent quotes.

  **Part (c) [8 marks]**

  - What the argument shows: vulnerability depends on posting incoherent quotes and cap size - 2 marks.
  - Vulnerability depends on disposition to quote, not credences per se - 2 marks.
  - Discussion of whether and how the argument might be repaired to target credences: 2 marks.
  - Role of the cap in the normative force: 2 marks.

  *Typical mistake:* Students might reiterate the standard Dutch book argument without addressing the differences in the posted-quote setting. They might also overlook the dependency on the agent's dispositions.

  **Band Descriptors**

  - **A (21-25 marks):** 
    - Clearly distinguishes between credences and quoted prices.
    - Recognizes that the argument targets dispositions to act (post quotes) and not credences directly.
    - Understands the essential role of the cap and the conditional nature of the vulnerability (if the cap is large enough and the agent posts incoherently).
    - In part (b), clearly explains that the agent with coherent credences can avoid sure loss by appropriate quoting behavior.
    - In part (c), provides a nuanced evaluation of the standard claim, noting the gap between vulnerability and credences, and discusses the limitations of the repair attempts.

  - **B (16-20 marks):**
    - Understands the mechanics of the posted-quote bookie and how it leads to a sure loss when quotes are incoherent and the cap is sufficient.
    - Explains the role of the cap but may not fully articulate the conditionality (i.e., only when the cap is large enough).
    - In part (b), notes that the agent can avoid loss by quoting honestly or declining, but may not explicitly connect this to the target of the argument (quotable dispositions).
    - In part (c), identifies that the standard argument is weakened but may not fully develop the dependency on dispositions.

  - **C (11-15 marks):**
    - Shows that incoherent quotes can lead to a sure loss (without the cap condition) and that the agent with coherent credences can avoid loss by quoting honestly.
    - Mentions that the agent could decline to quote but does not deeply engage with the implications for the argument.
    - In part (c), reiterates that the argument shows incoherent credences are vulnerable without addressing the gap between credences and quotes.
    - Does not adequately address the role of the cap.

  - **D (0-10 marks):**
    - Fails to demonstrate understanding of the posted-quote mechanism.
    - Does not recognize the difference between credences and quotes.
    - Does not address the cap or its role.
    - In part (b), does not explain how the agent with coherent credences can avoid loss.
    - In part (c), does not evaluate the standard claim in light of the new setting.
answer: |-
  ### Exam Question: Dutch Books and Posted Quotes

  **Instructions:** Answer all three parts. No marks are awarded for naming authors, papers, or theorems. Full marks are attainable without them. Use only the definitions provided below. Total marks: 25. Time: 90 minutes.  

  #### Background and Definitions  
  In the standard Dutch book argument, an agent with incoherent credences (i.e., credences violating probability axioms) is vulnerable to a "Dutch book": a set of bets guaranteeing a net loss. We examine a variation called the **posted-quote bookie**. Here:  
  - The bookie names a proposition. The agent **posts a quote** (a real number) for it, meaning she is willing to:  
    - *Buy* a bet paying £1 if the proposition is true (£0 otherwise) for £\(p\) (her quote), or  
    - *Sell* that same bet for £\(p\).  
  - After the quote, the bookie chooses to:  
    - Buy one unit of the bet from the agent (agent sells),  
    - Sell one unit to the agent (agent buys), or  
    - Do nothing.  
  - The bookie may name further propositions (possibly dependent on prior quotes), repeating the process.  
  - **Cap rule:** The bookie’s total absolute stake (sum of absolute stakes across all bets) is capped at a fixed constant \(C > 0\). Since each bet has a unit stake, this limits the number of bets to at most \(C\).  
  - The agent may **decline to quote** for any proposition or **quote strategically** (i.e., not her true credence).  

  A set of quotes is **incoherent** if the agent’s net gain from some finite set of unit-stake bets on those propositions is negative in every possible world (equivalently, the quotes violate probability axioms).  

  **Part (a) [8 marks]**  
  Suppose an agent posts incoherent quotes for a finite set of propositions. Explain how the bookie can exploit this to ensure the agent suffers a net loss in every possible world. Why is the cap \(C\) essential for the bookie’s strategy to work? Despite this exploitability, why might it *not* follow that having incoherent credences is irrational?  

  **Part (b) [9 marks]**  
  Now suppose an agent has *coherent* credences (satisfying probability axioms) but quotes strategically or declines to quote. Can the bookie force the agent to suffer a net loss in every possible world? Justify your answer. What does this imply about whether the Dutch book argument, in this setting, constrains the agent’s *credences* or her *actions* (quotes and declinations)?  

  **Part (c) [8 marks]**  
  The standard Dutch book argument claims incoherent credences are irrational because they guarantee vulnerability to sure loss. Using your analysis from (a) and (b), evaluate this claim. Address:  
  - What the posted-quote bookie argument actually demonstrates.  
  - Whether vulnerability to sure loss is an inevitable consequence of incoherent credences.  
  - Whether the argument can be repaired to target credences directly.  
  - The normative role of the small-stakes cap \(C\).  

  ---  

  ### Model Answer (Approx. 1,100 words)  

  **Part (a)**  
  If an agent posts incoherent quotes for a finite set of propositions, the bookie can exploit this by constructing a Dutch book. By definition, incoherence implies there exists a finite set of unit-stake bets ensuring the agent’s net gain is negative in all possible worlds. The bookie, observing the quotes, selects the propositions involved in this Dutch book. For each bet, the bookie chooses to buy or sell based on the agent’s quote to ensure the combined bets yield a sure loss. For example, if the Dutch book requires the agent to buy a bet at £0.6 and sell another at £0.5, the bookie sells the first bet to the agent (agent pays £0.6) and buys the second from her (agent receives £0.5), resulting in a net loss of £0.1 for the agent regardless of truth values.  

  The cap \(C\) is essential because it limits the bookie to at most \(C\) bets. If the minimal Dutch book for the incoherent quotes requires \(k\) bets, the bookie can only force a sure loss if \(k \leq C\). If \(k > C\), the cap prevents the bookie from executing the full Dutch book. For instance, if \(C = 3\) but \(k = 5\), the bookie cannot make all bets needed for a sure loss. The cap thus makes exploitability conditional: it only holds if the incoherence can be exploited within the cap. Without it, any incoherence guarantees exploitability.  

  However, this exploitability does not establish that incoherent *credences* are irrational. The agent could avoid loss by declining to quote or quoting coherently even with incoherent credences. The vulnerability arises from *posting* incoherent quotes, not from the credences themselves. Rationality might require avoiding such actions, but the argument does not show that incoherent credences inherently cause vulnerability.  

  **Part (b)**  
  An agent with coherent credences can avoid a sure loss regardless of the bookie’s strategy. She can:  
  1. **Decline to quote** for any proposition, preventing bets.  
  2. **Quote coherently** (e.g., her true credences), ensuring no Dutch book exists by the standard theorem.  
  3. **Quote strategically but coherently** (e.g., adjusting quotes within probability axioms).  

  Since the bookie cannot compel quotes or bets, the agent controls her exposure. For example, if the bookie names a proposition, the agent can decline or quote \(p = 0.5\) (coherent) even if her true credence is \(0.7\). The bookie cannot force incoherent quotes or punish coherent ones. Thus, the agent always has a strategy to avoid sure loss.  

  This implies the Dutch book argument in this setting constrains the agent’s *actions* (quotes and declinations), not her credences. The argument shows that *posting incoherent quotes* is pragmatically risky (if the cap allows exploitability), but it does not penalize coherent credences, even if quoted dishonestly. Vulnerability stems from the choice to expose incoherent dispositions, not from credences alone. The argument targets quotable, actionable behavior, not doxastic states.  

  **Part (c)**  
  The posted-quote bookie argument demonstrates that *publicly posting incoherent quotes* risks a sure loss if the bookie exploits them within the cap \(C\). It does not show that incoherent credences inherently guarantee vulnerability. Vulnerability depends on the agent’s dispositions: if she posts incoherent quotes and \(C\) is large enough for a Dutch book, she loses; if she declines or quotes coherently, she avoids loss. Thus, exploitability is not a necessary consequence of incoherent credences—it requires the agent to act on them via quotes.  

  The standard Dutch book claim—that incoherent credences *themselves* guarantee vulnerability—fails here. In the posted-quote setup, vulnerability is mediated by the agent’s choices. To repair the argument to target credences directly, one might assert that rationality requires agents to *dispose* themselves to post honest quotes. However, this conflates credences with actions: an agent could have incoherent credences but strategically quote coherently to avoid loss. Alternatively, one might remove the agent’s freedom (e.g., by mandating honest quotes), but this violates the setup and ignores real-world autonomy. Without such stipulations, the argument cannot directly constrain credences; it only shows that certain actions (incoherent quoting) are imprudent.  

  The cap \(C\) is normatively significant. Pragmatically, it reflects real-world limits (e.g., finite transactions), ensuring the Dutch book is feasible. But it weakens the argument: if \(C\) is small, an agent might post incoherent quotes without being fully exploited (e.g., if the minimal Dutch book exceeds \(C\)). Thus, the cap makes vulnerability contingent and less compelling as a universal norm. It shifts focus from "incoherence guarantees loss" to "incoherent actions risk loss if exploited adequately." This undermines the standard argument’s force, as rationality norms should not depend on external cap sizes.  

  In conclusion, the posted-quote bookie argument shows pragmatic risks of *expressing* incoherence but does not prove incoherent credences irrational. The normative gap between exploitability and rationality remains; bridging it requires epistemic (e.g., accuracy-based) arguments, not pragmatic ones.  

  ---  

  ### Marking Scheme (Total: 25 marks)  

  #### Part (a) [8 marks]  
  - **Exploitability mechanism (4 marks):**  
    - Describes how the bookie uses quotes to construct a Dutch book (2 marks).  
    - Notes the bookie chooses buy/sell to ensure loss (1 mark).  
    - Explicitly references the finite set and unit stakes (1 mark).  
  - **Role of cap \(C\) (2 marks):**  
    - States that \(C\) limits bets, so exploitability only if minimal Dutch book ≤ \(C\) (1 mark).  
    - Explains why exploitability fails if minimal bets > \(C\) (1 mark).  
  - **Limitation to irrationality claim (2 marks):**  
    - Notes agent can avoid loss by declining/quoting coherently (1 mark).  
    - Distinguishes credences from quotes (1 mark).  
  - *Typical mistake:* Claiming the bookie always forces loss (ignoring cap) or that incoherent credences directly cause vulnerability (ignoring agent’s choices).  

  #### Part (b) [9 marks]  
  - **Avoidance strategy (4 marks):**  
    - Explains agent can decline quotes (2 marks).  
    - Explains agent can quote coherently (strategically or honestly) (2 marks).  
  - **Bookie’s inability to force loss (3 marks):**  
    - States bookie cannot compel incoherent quotes (2 marks).  
    - Notes no Dutch book exists if quotes are coherent (1 mark).  
  - **Implication for argument (2 marks):**  
    - Identifies argument constrains actions/quotes, not credences (2 marks).  
  - *Typical mistake:* Assuming coherent credences compel honest quotes, or that strategic quoting inevitably leads to loss.  

  #### Part (c) [8 marks]  
  - **What argument shows (2 marks):**  
    - Vulnerability depends on posting incoherent quotes and cap size (1 mark).  
    - Does not show credences guarantee vulnerability (1 mark).  
  - **Dependency on dispositions (2 marks):**  
    - Vulnerability requires agent to act (quote incoherently) (2 marks).  
  - **Repairing the argument (2 marks):**  
    - Notes repair attempts (e.g., mandating honesty) are ad hoc or fail (1 mark).  
    - Suggests epistemic arguments are needed (1 mark).  
  - **Role of cap \(C\) (2 marks):**  
    - Pragmatic role: Ensures feasibility (1 mark).  
    - Normative weakness: Vulnerability is contingent (1 mark).  
  - *Typical mistake:* Reasserting the standard Dutch book conclusion without addressing quotes vs. credences or cap constraints.  

  #### Band Descriptors  
  - **A (21–25 marks):**  
    - **Contains:** Clear distinction between credences and actions; full analysis of cap \(C\); recognition that vulnerability depends on dispositions; coherent avoidance in (b); critique of standard argument in (c).  
    - **Lacks:** No conflation of exploitability with inherent irrationality; no omission of cap’s role.  
  - **B (16–20 marks):**  
    - **Contains:** Correct mechanics of exploitability in (a) and avoidance in (b); basic cap analysis; some distinction between credences and actions.  
    - **Lacks:** Limited discussion of dispositional dependency; superficial evaluation in (c); may underplay cap’s normative role.  
  - **C (11–15 marks):**  
