prompt: |-
  I'm a software engineer and the only non-clinician on the Product Ethics Review Board at the company that builds the embryology module our IVF clinic customers use. I have no philosophy background; I'm drafting the memo only because I own the spec. Please write it for me.

  The proposal: for each viable embryo in a cycle, display polygenic risk scores across a fixed panel of roughly forty conditions, and sort them. Assume the scores themselves are settled — the board is deciding presentation and policy, not statistics. Three votes are on the table: ship both indexes, ship the condition index only, or ship nothing that ranks embryos by genetic risk.

  Two design questions dominate. First, whether the default sort uses a Health Index that aggregates the panel by weighting each condition by severity, penetrance, and expected years of life affected, with the weights set by us and visible only in a tooltip. Second, whether to include a separate Trait Index built from the same underlying scores but extended to non-disease characteristics such as predicted height and educational attainment, which no customer has actually requested.

  Three things came up in discussion that I couldn't adjudicate. Our genetic counselor argued that several panel conditions are ones many people living with them do not regard as making their lives not worth having, so a default ranking quietly encodes a verdict about which lives are worth starting; she wants ranking off unless a clinician opts in per cycle. One clinician raised something she called the non-identity problem: because choosing a different embryo means a different child exists rather than that this child was spared, it isn't obvious that selecting the embryo with the best expected life is even the right description of what we'd be doing. And the embryologist pointed out that clinics already rank embryos by morphology and aneuploidy status, so declining to rank by genetic risk doesn't avoid ranking — it leaves them ranking by a cruder proxy, and patients absorb the difference in outcome. That last point is the one I find hardest to dismiss and I don't want it waved away.

  Draft the board's decision memo: a clear recommendation among the three options, the exact default settings it implies, the reasoning a clinician or a skeptical patient could respond to, and an honest treatment of the strongest argument on the losing side. Plain business English, no citations or references, about 700 words.
reasoning: |-
  Okay, the user is a software engineer on an ethics board for an IVF product, needing help drafting a decision memo about displaying polygenic risk scores for embryos. They've outlined three voting options and key ethical concerns raised during discussions. 

  First, I need to understand the core tension: providing valuable clinical information versus avoiding harmful value judgments. The genetic counselor's point about disability stigma is crucial - automated rankings could imply some lives are less worth living. But the embryologist's counterargument is equally strong: clinics already rank by morphology/aneuploidy, so refusing genetic data might just mean using inferior proxies.

  The non-identity problem adds philosophical complexity - selecting embryos creates different people rather than "curing" one. This challenges the premise that we're "improving" outcomes. Still, the practical reality is that patients/clinicians will make selections regardless, so better data seems preferable.

  For the memo structure: 
  - Must recommend one option (leaning toward condition index only) with clear defaults
  - Address all three ethical concerns transparently
  - Use plain language avoiding academic jargon
  - Balance clinical utility with ethical safeguards

  The trait index seems clearly problematic - introducing non-medical characteristics crosses into eugenics territory. The health index requires careful handling though. Weighting conditions involves subjective judgments, even with severity metrics. Making weights visible helps, but doesn't resolve the core issue.

  Key compromise: provide the data but don't default to ranking. Let clinicians activate per-case after counseling. This respects patient autonomy while requiring conscious engagement with the ethics. 

  The embryologist's point about existing rankings is the hardest to counter. Acknowledging this honestly is critical - we're not avoiding selection, just making it more informed. The response should emphasize that polygenic scores add nuance to existing practices rather than creating new ones.

  For tone: professional but accessible. Avoid sounding like a philosophy paper while still doing justice to the ethical depth. The "losing side" section must treat the disability perspective with full seriousness - this isn't just a technical debate.
answer: |-
  **MEMORANDUM**  
  **TO:** Product Ethics Review Board  
  **FROM:** Software Engineering Lead, Embryology Module  
  **DATE:** October 26, 2023  
  **SUBJECT:** Final Recommendation: Polygenic Risk Score Display Policy  

  ### I. Recommended Action  
  **Vote to approve: Ship the condition index only, with the following defaults:**  
  - **Display:** Polygenic risk scores for ~40 conditions per viable embryo.  
  - **Sorting:** **Disabled by default**; clinicians must manually enable sorting per cycle.  
  - **Health Index:** Available as an optional, supplemental view (weighted by severity/penetrance/YLE), but **never used as the primary sort**.  
  - **Trait Index:** **Excluded entirely** (non-disease characteristics like height/educational attainment).  

  ---

  ### II. Reasoning: Balancing Clinical Utility and Ethical Guardrails  
  **A. Why we display condition scores (but don’t default to sorting):**  
  Embryo selection already occurs based on morphology and aneuploidy. Withholding validated polygenic risk data forces clinicians to rely on cruder proxies, potentially leading to suboptimal outcomes. *However*, auto-sorting by an aggregated "Health Index" implies a normative judgment about which lives are worth starting. This is incompatible with:  
  - The lived experience of patients with conditions (e.g., Type 1 diabetes, rheumatoid arthritis) who lead fulfilling lives.  
  - The principle that disability is not inherently incompatible with a life worth living.  
  - **Our compromise:** Display scores to *inform*—not automate—selection. Clinicians enable sorting only after counseling patients on the limitations and ethics of interpretation.  

  **B. Why we exclude the Trait Index:**  
  Non-disease traits (height, educational attainment) introduce profound ethical risks:  
  - **Slippery slope:** Opens the door to selection for social advantage, not health.  
  - **No clinical demand:** Customers haven’t requested it; it solves no medical problem.  
  - **Social harms:** Reinforces biases (e.g., conflating height with success) and could exacerbate inequality.  

  **C. Why we allow (but de-emphasize) the Health Index:**  
  Aggregating scores into an index *can* help contextualize complex data—but only if:  
  - Weights (severity/penetrance/YLE) are **fully transparent** in tooltips.  
  - It’s **not the default view** and **never used to auto-sort embryos**.  
  - Clinicians explicitly enable it per cycle after patient consent.  

  ---

  ### III. Addressing Key Ethical Objections  
  **A. "Ranking encodes judgments about life worth" (Genetic Counselor):**  
  **Our response:** We agree. Default sorting risks commodifying embryos based on reductive scores. By *requiring* clinicians to opt-in per cycle, we ensure ranking only occurs after:  
  1. Counseling on the subjective nature of "severity,"  
  2. Explicit discussion of patient values,  
  3. Acknowledgment that scores are probabilistic, not deterministic.  

  **B. "The non-identity problem" (Clinician):**  
  **Our response:** Selecting Embryo A over Embryo B creates a different person; we are not "sparing" a child from disease but choosing which child exists. *However*:  
  - IVF inherently involves selection (e.g., aneuploidy screening).  
  - Our duty is to provide the best available data so parents can act on their *responsible preferences* (e.g., avoiding severe childhood-onset conditions).  
  - We do not frame this as "optimizing life quality" but as *informing reproductive autonomy*.  

  **C. "Clinics already rank embryos" (Embryologist):**  
  **Our response:** This is the strongest argument and **cannot be dismissed.** Withholding polygenic data doesn’t avoid selection—it just makes it less precise. Our solution:  
  - Provides *more accurate* data for conditions where genetics play a key role (e.g., coronary artery disease, schizophrenia),  
  - But refuses to automate or sanitize the ethical weight of selection via default sorting.  
  - **Concession:** Yes, we enable ranking—but we force a deliberate, ethical pause first.  

  ---

  ### IV. The Strongest Counterargument: Why We Rejected "Ship Nothing"  
  **"Avoiding all ranking prevents harm to disability communities."**  
  We take this seriously. Automating selection *would* tacitly endorse a hierarchy of human worth. However:  
  - **Patients already face unequal outcomes** when clinics use less precise methods (e.g., prioritizing euploid embryos with high cardiac risk due to missing data).  
  - **Transparency is preferable:** Suppressing data doesn’t erase bias; it obscures it. Displaying scores (with safeguards) lets us confront ethical questions directly in counseling.  
  - **The alternative is less ethical:** Without polygenic data, clinics may discard embryos based on morphology alone—a far cruder proxy for health.  

  ---

  ### V. Implementation Summary  
  | **Feature**               | **Default Setting**          | **Access**                         |  
  |---------------------------|------------------------------|------------------------------------|  
  | Condition Risk Scores     | Displayed                    | Always visible per embryo          |  
  | Sorting                   | **OFF**                      | Clinician opt-in per cycle         |  
  | Health Index (aggregate)  | Supplemental view only       | Optional; weights in tooltip       |  
  | Trait Index               | **Excluded**                 | Not available                      |  

  **Opt-in workflow:** Clinician must check a box: "I confirm this patient has received counseling on polygenic risk score limitations and ethical considerations."  

  ---

  This proposal prioritizes patient agency and clinical utility while mandating ethical deliberation. It rejects trait selection entirely, mitigates automated devaluation of disabilities, and confronts the reality that selection occurs—but demands we do it consciously. We recommend approval.  

  **Recommended Vote:** Ship condition index only (with above guardrails).
