prompt: |-
  I teach a six-week module on persistence in an upper-level undergraduate metaphysics seminar. The session I need help with is the fourth: sixteen students, seventy-five minutes, a seminar room with a whiteboard, movable chairs, and nothing else. No AV, no prep budget beyond what I can print or carry in a bag, and no real money for stakes.

  By this point the students have worked through the standard pressure points in the abstract: the problem of temporary intrinsics, the objection that a thing wholly present at each of several times would have to be wholly present at many places at once, the embarrassment of how many things a perdurantist must count in an ordinary room, and the way the Ship of Theseus seems to dissolve under one picture and become a forced choice under the other. The difficulty is that all of it stays notional. They can reconstruct the arguments and still feel, reasonably, that nothing is at stake: whichever picture they adopt, the world looks exactly the same afterwards, and the discussion decays into a canvass of who finds what intuitive.

  So I want a session in which they build something, and the cost of the picture they have built shows up in the thing they built rather than in anything I say. The intended arc is this. First, under pressure from a case rather than from a definition, they should arrive at something recognisably perdurantist on their own: they posit different bits of the thing at different times, because that is the only way to stop the thing from being both bent and straight, or the only way to make sense of a thing that has a part at one time and not at another. Second, I want that home-made picture to be shown unstable, so that the natural repair pushes them toward a view I have been toying with and have never managed to get students to take seriously when it is stated on the page. Call it chunk perdurantism: a persisting thing does have temporal parts, but not arbitrary or instantaneous ones — its temporal parts are exactly the maximal intervals across which its intrinsic qualitative profile is constant, so that a thing is a finite train of homogeneous blocks rather than a continuum of slices, and each block can be bent, or straight, or four-legged, simpliciter. Third, I want the repair to fail on them in a way they can feel, and the failure I have in mind is continuous change: for something that is changing throughout — rotating, cooling, wearing down — there are no maximal intervals of qualitative constancy, so either the thing has no temporal parts at all or the grain of its articulation has to be fixed by something extrinsic to the thing, and every candidate they reach for will look arbitrary in a way they did not expect.

  I also want one diagnostic case built in somewhere, to be used at the point where I need each picture to commit itself: a ship dismantled at one time, its planks numbered and stored in a warehouse for a season during which nothing ship-shaped exists anywhere, then reassembled from the same planks in the same arrangement. Both perdurantist variants have a distinctive thing to say about it, and the endurantist alternatives have to choose between intermittent existence and a plain denial of identity. The activity should force that commitment to be made in public and in a form we can point at afterwards.

  What I need from you is a runnable design: the setup and materials, the rules or roles, a minute-by-minute timeline, and the exact instructions I give at each stage. Please keep it honest about the pedagogy. I want the students to do something — assemble, trade, bid, sort, commit to a written verdict — and to run into the problem before it is named; no lecture up front, no show-of-hands intuition polls, and the words endurantism, perdurantism and chunk perdurantism should not be uttered until the last ten minutes. The debrief should map specific moments in the session onto specific moves in the argument, including what each picture must say about the dismantled ship. Tell me what will predictably go wrong the first time I run it — the shortcuts students will take, the way a group will try to vote its way out, the version of the activity where everyone sees the trick in the first five minutes — and how to handle each. Finally, be frank about which part of the dispute the activity cannot stage and which I will have to supply in the debrief myself: I suspect the real cost of these views is metaphysical rather than bookkeeping, and that a game can only ever stage the bookkeeping. If you think part of my intended arc is a bad idea, say so and say what to put in its place.
reasoning: |-
  Okay, let me unpack this professor's request. They teach an advanced metaphysics seminar on persistence and are frustrated that abstract debates about endurantism vs. perdurantism feel sterile to students. For week four, they want a hands-on activity where students build their own model of persistence and experience its failures firsthand.

  Hmm... the core pedagogical challenge is making metaphysical costs tangible. The professor outlined three clear goals: (1) students independently arrive at perdurantism to solve concrete problems, (2) discover its instability and invent "chunk perdurantism", (3) watch that solution crumble with continuous change. Plus they need a diagnostic ship case.

  Constraints are tight: no tech, no budget, just paper and whiteboard. Must avoid lecturing or polling. Key insight: the activity must force commitments through physical actions, not just discussion. And no jargon until the end.

  *Scratching head*... How to make temporal parts feel real? Maybe... object biographies? Students could build timeline representations of objects using physical tokens. 

  First idea: assign each group an object with changing properties (bending rod, growing plant). Give them colored blocks representing states. They'll likely use multiple blocks for different times - that's perdurantism emerging! But how to make the cost visible? 

  Ah - force them to handle gradual change. Give one group an object that cools continuously. Their blocks will either be too coarse (hiding change) or require infinite slices. That's the crisis point. 

  For the ship case: maybe have groups physically separate/destroy/reassemble a paper model. Endurantists would either deny identity or accept gaps - both uncomfortable. Perdurantists get continuity but at cost of many entities.

  *Testing the flow*: 
  1. Case studies trigger perdurantism (5 min setup)  
  2. Build timelines with blocks (20 min)  
  3. Share models - notice variation (10 min)  
  4. Introduce continuous change - systems break (15 min)  
  5. Ship case diagnostic (15 min)  
  6. Reveal metaphysical terms & debrief (10 min)

  Potential pitfalls: Groups might "cheat" by avoiding precise commitments. Need rules forcing binary choices. Also, some may grasp the trap early - so prepare extension questions about identity conditions. 

  Biggest limitation: The activity can't show why ontological simplicity matters. That'll need debrief framing. Also, chunk perdurantism's appeal might be too strong - must emphasize how extrinsic granularity breaks objectivity.

  *Refining*: Use paper strips for timelines, sticky notes for properties. Ship case gets physical tokens for planks. Instructions must forbid vague language - require "same object?" yes/no votes with justification. 

  Printables: 
  - Case cards (bending rod, assembly/disassembly)  
  - Blank timeline grids  
  - Property stickers (bent/straight, whole/parted etc.)  
  - Plank tokens for ship  

  Cruciously, the continuous cooling object must resist chunking. No natural joints! That's where the professor's "arbitrary grain" pain point hits home. 

  Final structure:  
  - Phase 1: Perdurantism born of necessity  
  - Phase 2: Chunking as rescue  
  - Phase 3: Continuity drowns the rescue  
  - Phase 4: Ship case exposes identity commitments  

  Debrief map: Link block-stacking to temporal parts, failed chunks to metaphysical vagueness, ship reassembly to intermittent existence debates. Save the big question for last: "What determines reality's joints if not our descriptions?"
answer: |-
  Here’s a runnable, no-budget activity designed to force experiential engagement with your three-phase arc. The core device is **physical timeline modeling** using paper tokens, forcing concrete commitments students must "build" into a shared structure.

  **Materials to Prep (all printable/carriable):**
  - 16 blank "timeline grid" sheets (horizontal axis: TIME, vertical: OBJECTS; see diagram below)
  - 64 small paper tokens (cut index cards): 16 labeled "SHIP", 16 "PLANK#1–16", 8 "ROD", 8 "THERMOMETER", 16 blank tokens
  - Property stickers (small dots): red ("bent"), blue ("straight"), green ("hot"), yellow ("cold"), gray ("exists?")
  - 1 large poster-sized timeline grid for the whiteboard
  - Case cards (one per group):

  ```
  CASE A: "A metal rod is straight at noon. At 12:30, it is bent until 1 PM. At 1:30, it is straight again."
  CASE B: "A ship is built from planks at noon. At 12:30, one plank is removed and discarded. At 1 PM, a new plank is added."
  CASE C: "A thermometer cools continuously from 90°C to 10°C between noon and 1 PM."
  ```

  ---

  ### **Phase 1: Forced Perdurantism (25 mins)**
  *Goal: Students fragment objects across time to avoid contradictions.*  
  **Setup (5 mins):**  
  - Divide class into 4 groups of 4. Give each:  
    - 1 case card (2 groups get A, 1 gets B, 1 gets C)  
    - 4 timeline grids  
    - Tokens: Group A (ROD x2, blank x2), Group B (SHIP x4, PLANK x4), Group C (THERMOMETER x4)  
    - Sticker sheets  
  - Instructions: *"Model what happens to your object on the timeline. Use tokens for objects/properties. Your model must answer: At each time, is the object bent/straight (A), whole/parted (B), or hot/cold (C)? NO vague answers."*  

  **Activity (15 mins):**  
  - Groups build models. **Predictable crisis:**  
    - Group A (rod): Struggles with "bent and straight at 12:45". They’ll split the rod into "rod-at-noon", "rod-at-12:30" → **spontaneous perdurantism**.  
    - Group B (ship): Debates "is it the *same* ship after plank replacement?". May split ship tokens → perdurantism or use one token but contradict properties.  
    - Group C (thermometer): Faces "is it hot or cold at 12:30?". May try coarse chunks ("hot until 12:45").  

  **Share-Out (5 mins):**  
  - Each group sketches their timeline on the whiteboard grid.  
  - Press contradictions: *"Group A, how can the rod be bent and not bent at 12:45? Group B, is the post-repair ship identical to the original?"*  
  - **Key Insight Emerges:** Avoiding contradictions forces fragmenting objects into time-slices.  

  ---

  ### **Phase 2: Chunk Perdurantism Born & Tested (25 mins)**  
  *Goal: Repair fragmentation with "natural" chunks; expose granularity arbitrariness.*  
  **Setup (2 mins):**  
  - New instruction: *"Revise your model using only chunks where the object’s properties are CONSTANT. Use as few chunks as possible."*  

  **Activity (15 mins):**  
  - Group A easily creates three chunks (straight→bent→straight).  
  - Group B creates chunks (whole→missing plank→repaired).  
  - Group C struggles: *No* interval has constant temperature! They must either:  
    - (a) Use infinitesimal slices (infinite tokens!) → impractical,  
    - (b) Admit no constant chunks exist → no temporal parts, or  
    - (c) Arbitrarily chunk (e.g., "hot: 12:00–12:15", "cold: 12:45–1:00") → but why 15 mins?  

  **Share-Out (8 mins):**  
  - Groups report revisions. Spotlight Group C:  
    - *"Why did you choose 15-minute chunks? Could you choose 5 mins? 1 min? Who decides?"*  
  - **Key Insight:** Constant-property chunks work for discrete change (rod, ship) but fail for continuous change (thermometer). Grain size is extrinsic.  

  ---

  ### **Phase 3: Diagnostic Test – The Dismantled Ship (20 mins)**  
  *Goal: Force public commitment on intermittent existence.*  
  **Setup (3 mins):**  
  - Give ALL groups the same case:  
    *"Ship built at noon. Dismantled at 12:30; planks stored separately until 1 PM. Reassembled identically at 1:30."*  
  - Tokens: 4 SHIP, 16 PLANK.  
  - Instructions: *"Model this on your timeline. Answer: Is the ship at 1:30 the SAME as the ship at noon? Write YES/NO with one-sentence justification."*  

  **Activity (12 mins):**  
  - Groups build models. **Commitments emerge:**  
    - **Perdurantists** (from Phase 1): Use distinct ship tokens (noon-ship, 1:30-ship) → "NO, different temporal parts."  
    - **Chunk Perdurantists** (from Phase 2): May treat storage as a "non-ship" chunk → "NO, not continuous."  
    - **Endurantists**: One ship token spanning gaps → "YES, same ship enduring." Or admit gap → "NO, it ceased existing."  
  - **Critical Move:** Each group writes verdict + reason on a token and posts it on the whiteboard.  

  **Whiteboard Layout:**  
  ```
  TIME:     noon────12:30────1:00────1:30
  OBJECTS: 
  SHIP:     [Grp1:token]    [gap?]   [Grp1:token]
  PLANKS:   [all groups place plank tokens]
  VERDICTS: [Posted answers: "YES: same planks" | "NO: temporal discontinuity"]
  ```

  **Discussion (5 mins):**  
  - Contrast verdicts: *"Group 2 says NO because of the gap—what does Group 4 say to justify YES?"*  
  - Point to planks: *"The planks persist—why not the ship?"*  

  ---

  ### **Debrief & Meta-Reflection (5 mins)**  
  - **Reveal Terms:** *"Today you invented positions called perdurantism (time-slices), chunk perdurantism (constant-property blocks), and endurantism (one thing in time)."*  
  - **Map Activity to Theory:**  
    - Phase 1: Fragmentation → **Perdurantism** (solves temporary intrinsics).  
    - Phase 2: Constant chunks → **Chunk Perdurantism** (avoids arbitrary slices).  
    - Phase 3: Gap dilemma → **Endurantism** (identity through gaps) vs. **Perdurantism** (no identity without temporal parts).  
  - **Costs Experienced:**  
    - Perdurantism: Proliferates entities (many tokens).  
    - Chunk: Collapses under continuous change; grain arbitrary.  
    - Endurance: Either denies gaps (mysterious) or accepts intermittent existence (weird).  
  - **Ship Diagnostic:**  
    - Perdurantism: 1:30 ship ≠ noon ship (different temporal parts).  
    - Chunk Perdurantism: 1:30 ship ≠ noon ship (no continuous chunk).  
    - Endurantism: Either (a) same ship (denies gap matters), or (b) not identical (accepts cessation).  

  ---

  ### **Predictable Pitfalls & Fixes**  
  - **"Why not just say it’s the same object changing?"**: Force property contradictions (Phase 1). Hold them to binary properties: *"Is it bent or not at 12:30? Pick one."*  
  - **Group C gives up on continuous change**: Ask: *"Can you model this without chunks? What vanishes from your model if you do?"* (Answer: The change itself).  
  - **Students vote instead of committing tokens**: Insist: *"Place tokens first—let the model force your answer."*  
  - **Everyone "gets" it early**: Use the thermometer case earlier. Its continuous change disrupts complacency.  

  ### **Limitations & Your Role**  
  The activity brilliantly stages **bookkeeping costs** (entity proliferation, gaps, arbitrariness) but cannot simulate **metaphysical costs**. You must add:  
  - **Why care about bookkeeping?** *"These models commit you to what exists fundamentally: spacetime worms? Substrata? Your choice isn’t neutral—it changes what reality is."*  
  - **The Real Stakes**: *"Is persistence a brute fact (endurance) or reducible to temporal relations (perdurance)? Chunk perdurantism tries to have both—but at what cost to objectivity?"*  

  ### **Why This Works**  
  Students **build** perdurantism to solve contradictions (Phase 1), **repair** it with chunks (Phase 2), then **break** it with continuity and gaps (Phase 3). The dismantled ship forces a public, physical commitment. No jargon until the end ensures ideas are judged by their operational cost, not labels.  

  **Printables Sketch:**  
  - **Timeline Grid**:  
    ```plaintext
    TIME:   noon ────── 12:30 ────── 1:00 ────── 1:30  
    OBJECT: _________________________  
    ```  
  - **Tokens**: Pre-cut cards with "SHIP", "ROD", "THERMOMETER", "PLANK1", etc.  
  - **Stickers**: Color-coded dots for properties.  

  Run it tight, cold-call groups during share-outs, and let the models do the arguing. The ship tokens will haunt them long after class.
