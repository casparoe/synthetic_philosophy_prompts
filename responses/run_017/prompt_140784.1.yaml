  Below is a decision tree designed as a single A3 sheet for your drop-in session. It meets your criteria: 8 concrete branch questions derived from logical distinctions (presence/consultation/veto separation, claim targets, residence effects, claim attachment, compensation nature), 10 named positions (leaves), empirical guesses flagged, and a focus on value structures rather than "for/against" binaries. The tree starts with scenarios and ends with labels to avoid priming. 

  ### **Front Page: Decision Tree**  
  *(Layout: Vertical flowchart with 8 numbered questions, branching into 10 leaves. Answers are simple [A]/[B]/[C] options.)*  

  1. **A developer proposes 40 flats on Elm Street. The primary school and GP surgery are full. Should the developer pay for new facilities?**  
     - [A] **Yes, and the project shouldn’t start until they do.**  
     - [B] **No—that’s the council’s job, not the developer’s.**  
     - [C] **No—new residents’ taxes will cover it eventually.**  
     *→ Branches to Q2 or Q3 based on answer.*  

  2. **Eight flats on Oak Road stand empty for years, owned by a company abroad. Should the council force the owner to rent them out?**  
     - [A] **Yes—empty homes hurt everyone.**  
     - [B] **No—it’s the owner’s choice.**  
     - [C] **Only if the owner gets fair compensation.**  
     *→ Branches to Q4 or Q5.*  

  3. **A family converts their garage into an annexe for an elderly parent, creating an extra household. Do neighbours get a say?**  
     - [A] **No—it’s their property.**  
     - [B] **Yes—neighbours must agree to changes on the street.**  
     - [C] **Only if the council decides it affects others.**  
     *→ Branches to Q6 or Q7.*  

  4. **On a street where most objectors rent their homes, do they have a right to stop new building?**  
     - [A] **Yes—they live here and feel the impact.**  
     - [B] **No—only owners hold that right.**  
     - [C] **They can object, but the town’s needs come first.**  
     *→ Branches to Q8 or a leaf.*  

  5. **Land near town is up for development. Does it matter if it’s owned by a distant pension fund or a family that farmed it for generations?**  
     - [A] **Yes—the family deserves the windfall more.**  
     - [B] **No—the gain from permission belongs to everyone.**  
     - [C] **Ownership might affect design, not who benefits.**  
     *→ Branches to leaves.*  

  6. **The street votes 3-to-1 against a scheme, but the town supports it. Should it happen?**  
     - [A] **No—the street must agree to changes in its space.**  
     - [B] **Yes—the town’s view outweighs the street’s.**  
     - [C] **Only if independent experts say benefits outweigh harms.**  
     *→ Branches to leaves.*  

  7. **A new block offers flats reserved for nurses. Does it matter if instead they’re sold to investors who won’t live there?**  
     - [A] **Yes—nurses serve us; investors don’t.**  
     - [B] **No—a home built is a home available, whoever owns it.**  
     - [C] **Yes—locals need homes, not absentee landlords.**  
     *(Flags empirical guess: Whether investor ownership affects local access.)*  
     *→ Branches to leaves.*  

  8. **Sam grew up here but was priced out 15 years ago. They want one of the new flats. Do they deserve priority?**  
     - [A] **Yes—past roots create a stronger claim than a newcomer’s.**  
     - [B] **No—everyone deserves a fair shot, no special treatment.**  
     - [C] **Some priority, but current residents come first.**  
     *→ Branches to leaves.*  

  ---  
  ### **Leaves (Named Positions)**  
  *Based on answer combinations, participants land here. Each leaf includes a core commitment and its "awkward" implication.*  

  1. **Owner’s Dominion**  
     *Core:* The owner alone decides what happens on their land.  
     *Awkward commitment:* An owner can leave homes empty (Q2/B) or build without community consent (Q3/A), even if it harms neighbours.  

  2. **Public Utility Mandate**  
     *Core:* Planning permission is a public power and must maximize wider societal benefit.  
     *Awkward commitment:* A street’s "no" vote can be overruled if the town benefits (Q6/B).  

  3. **Windfall Commons**  
     *Core:* The value gain from permission belongs to everyone, not just the owner.  
     *Awkward commitment:* A family farm’s generational ties (Q5) don’t justify keeping the windfall—it should fund town needs (Q1/A).  

  4. **Residential Sovereignty**  
     *Core:** Long-term residence earns a moral right to veto local changes.  
     *Awkward commitment:* Renters can block projects (Q4/A) even if they plan to leave (Q8/C implies transience weakens claims).  

  5. **Justice for the Excluded**  
     *Core:** The first duty is to those already priced out or displaced.  
     *Awkward commitment:* Sam’s return (Q8/A) matters more than current residents’ objections.  

  6. **Duty to the Future**  
     *Core:* Our primary obligation is to people not yet here.  
     *Awkward commitment:* Building should happen even if infrastructure lags (Q1/B) or streets oppose it (Q6/B).  

  7. **Street as Collective**  
     *Core:* The street holds a claim as a body that individuals alone lack.  
     *Awkward commitment:* The street can veto projects the town supports (Q6/A), even if individual objections are weak.  

  8. **Compensated Consent**  
     *Core:* Compensation (cash, amenities) is due to those affected, not a concession.  
     *Awkward commitment:* Developers must "buy" local acceptance (Q1/A) even for small changes like garage conversions (Q3/C).  

  9. **Rooted Obligation**  
     *Core:* Long residence brings a duty to make room for newcomers.  
     *Awkward commitment:* Lifelong residents should welcome change (Q3/B, Q8/B) even if it disrupts their peace.  

  10. **Personal Claim Detachment**  
      *Core:* Rights attach to dwellings, not persons—ownership defines authority.  
      *Awkward commitment:* Renters’ voices don’t count (Q4/B), and Sam’s history (Q8/B) is irrelevant.  

  ---  
  ### **Back Page: Key Notes**  

  **Incoherent/Unoccupied Combinations**  
  - *Incoherent:* Answering Q1/A (developer pays) + Q5/B (windfall to everyone). If the windfall belongs to all, why must one developer pay?  
  - *Unattractive (rarely chosen):* Q2/C (compensate owner for renting empty flats) + Q5/B (windfall to everyone). Paying an owner to use their property clashes with societal ownership of gains.  
  - *Unvisited:* Q4/B (only owners decide) + Q6/A (street veto). If rights attach to ownership, why would "the street" have collective power?  

  **Indistinct Leaves**  
  - *Public Utility Mandate* and *Windfall Commons* often blur on compensation. The tree separates them via Q1 (developer obligations) but they share a focus on societal gain.  
  - *Residential Sovereignty* and *Street as Collective* overlap on local control. The tree isolates the latter via Q6/A (street veto over town), but real-world beliefs may fuse them.  

  **"For/Against" Framing Collapses**  
  - Collapses *Owner’s Dominion* (often "for" development) and *Residential Sovereignty* (often "against") into opposing sides, masking that both reject external authority (council/town).  
  - Groups *Justice for the Excluded* (pro-building for Sam) and *Duty to the Future* (pro-building for newcomers) as "for," though one prioritizes repatriating ex-residents and the other future strangers.  

  **Questions That Reveal Hidden Splits**  
  1. **Q3 (Garage Conversion):** Separates those who see ownership as absolute (A) from those who see the street as a collective space (B) or a public concern (C). Neighbors who agree on "local control" may split here.  
  2. **Q5 (Land Ownership):** Exposes whether claims are based on *who owns* (family vs. fund) or *who benefits* (windfall distribution). Those agreeing on "fairness" may diverge sharply.  
  3. **Q8 (Priced-Out Return):** Divides those focused on historical ties (A), present equity (B), or community continuity (C). Allies in opposing a specific project may hold clashing rationales.  

  ---  
  ### **Design Notes**  
  - **Empirical Flags:** Only Q7 (nurses vs. investors) flags a predictive element (absentee ownership effects). Other questions avoid "will it lower rents?" or displacement debates.  
  - **Logical Structure:** Distinctions drive branching:  
    - Q1→Q5 probe *claim targets* (developer, council, society).  
    - Q3→Q4→Q6 probe *claim scope* (individual, street, town).  
    - Q8 + Q2 probe *residence effects* (strengthens claim vs. duty to yield).  
    - Q4 + Q10 probe *claim attachment* (persons vs. dwellings).  
    - Q1 + Q2 + Q5 probe *compensation* (inherent vs. concession).  
  - **Concreteness:** All questions use your cases, phrased for laypeople (e.g., "GP surgery" not "services," "voted 3-to-1" not "local democracy").  
  - **Output:** On A3, the front fits the tree/leaves; the back holds notes. Participants answer Q1-8 to reach a leaf without seeing labels until the end.  

  This tree sorts by *structure* of belief, avoiding tribal "for/against" labels. It clarifies why positions like "build but compensate" or "stop this block but tax windfalls" aren’t contradictions—they reflect distinct moral geometries.
