prompt: |-
  I write a column on evolution and human behavior for a science magazine, and Ive just landed one of those year long fellowships: nine months, about six long features, a travel budget. I want to spend most of it on the mess around adaptationism instead of doing yet another nature-nurture-is-over recap. Forty-plus years after Gould and Lewontin's 1979 spandrels paper, my corner of the science feed still runs on the same engine: a lab finds a correlation, the press release says this is why we do X, and it lands as an evolutionary just-so story with one hedge paragraph bolted on at the bottom. My editor is sympathetic but thinks anything with the word spandrel in the first three paragraphs is inside baseball, so part of what I need is a defense of why this old argument should change how working reporters handle the daily drip, not just how philosophers of biology sort themselves into camps.

  So help me build the agenda rather than summarize the debate. Ive been arguing about this with a friend who's a postdoc in philosophy of biology, and we came up with two homebrew tools that I like but genuinely can't tell are insights or just us cosplaying as methodologists. First, call it the base rate rule: anyone claiming trait T is an adaptation has to name the reference class T belongs to and say what fraction of traits in that class turn out to be adaptations. If you can't or won't, then saying adaptation carries about as much information as saying a drug works without saying how often drugs of its kind work. Second, the lineage swap test: take the adaptive story for T and ask whether anyone would still be telling it if T had turned up in a different taxon with a different ecology. If yes, because the story runs entirely off T's shape and nothing off the lineage's actual history, it's a story about usefulness rather than an explanation of origin. There's a third thing I keep half-noticing, function drift: challenged adaptive stories get rescued by quietly redescribing the function, so the trait never quite gets to be falsified. I don't know whether that's a real phenomenon in the literature or just my annoyance at reading press releases.

  What I need is a defended ordering, not a survey. Of the open questions in or around this cluster, which three or four should the six pieces be organized around, and in what order, and I care far more about the reasoning than the list. Concretely: which questions are upstream, in that how you settle them settles several others; which are genuinely open versus which only look open because people keep relitigating something that's basically settled and would make for a filler feature; which are tractable for someone who can read papers and interview people but can't run models, do fieldwork, or get a lab to share data; and which ones, if I got a clean answer, would actually change how I write a news piece about a gene for X or a why-we-Y press release, as opposed to being satisfying to philosophers while leaving my day job completely untouched. Be willing to say if one of my three homebrew ideas is confused or already has a name and a literature I should read, and tell me what would move things up or down the list: what kind of interview, or what kind of result landing in the next nine months, should make me reshuffle the series.
reasoning: |-
  Okay, the user is a science columnist focusing on evolution and human behavior who just got a fellowship. They want to focus on the adaptationism debate sparked by Gould and Lewontin's spandrels paper. Their editor thinks "spandrels" is too niche, so they need to show why this matters for daily science reporting. They have three ideas: the base rate rule, lineage swap test, and function drift. They want help organizing six features around three or four open questions that are upstream, tractable for a journalist, and impactful on reporting.

  First, I need to unpack their main goal: changing how reporters handle evolutionary just-so stories. They don't want a philosophy debate recap but practical tools for journalists. Their three ideas need evaluation. Let me check each:

  Base rate rule: Demanding a reference class for adaptation claims. This is similar to requiring prior probabilities in Bayesian thinking. It's useful to challenge overconfident claims. Might relate to work by Felsenstein or statistical critiques. Worth including.

  Lineage swap test: Asking if the story would apply to another lineage. This tests if the explanation is based on actual history or just plausibility. It's a good litmus test for adaptive storytelling. Connects to contingency vs. convergence debates. Solid.

  Function drift: Redescribing functions when challenged. This is a real issue—researchers shifting the goalposts. Related to the "flexibility" of adaptationist arguments. Should be addressed.

  Now, structuring six features. Need upstream questions—those that influence others. Also, tractable for a journalist: interviews, reading papers, not running models. Impact on reporting is crucial; answers should change how stories are written.

  Possible questions:
  1. How often are traits adaptations? Base rates. Upstream because it affects the plausibility of any claim. Can be explored via literature reviews, expert interviews. If base rates are low, reporters should hedge more.

  2. How do we test adaptation vs. non-adaptive origins? Methods like the swap test, EEA considerations. Addresses how stories are built and tested. Journalists can use swap test as a filter.

  3. Function drift and evo agendas. Why researchers retrofit functions. Reveals institutional pressures. Interviews with scientists about challenges in publishing non-adaptive stories.

  4. Practical tools for reporters. Synthesizing the previous questions into checklists. Directly impacts how articles are written.

  Order matters:
  Start with the base rate question to set the stage—why skepticism is needed. Then methods (swap test) to evaluate claims. Then the social aspect (function drift) to explain why bad stories persist. End with actionable tools.

  Tractability: Base rates can be covered via meta-studies and experts. Swap test through case studies. Function drift via interviews and paper analysis. Tools are a synthesis.

  What would change reporting? If base rates are low, reporters add context. Swap test helps spot weak stories. Highlighting function drift makes readers skeptical of shifting explanations. Tools like checklists provide concrete steps.

  Their ideas are sound. Base rate and swap test are novel framing; function drift is observed but less formalized. Need to cite related work but present as fresh tools.

  Potential reshuffling triggers: New studies on trait origins (e.g., a genome analysis showing non-adaptive traits), high-profile critiques of an adaptationist claim, or methodological papers improving inference techniques.

  Finally, ensure each piece offers a "newsroom tool" to make it practical. Avoid philosophy deep dives unless they directly aid reporting.
answer: |-
  Here’s a defended ordering for your six features, designed to bridge the adaptationism debate to practical science journalism. I’ve prioritized **upstream questions** (foundational issues that shape downstream thinking), **tractability** (you can tackle them via interviews/literature), and **impact on reporting** (actionable tools for your day job). I’ll also critique your "homebrew tools" and flag reshuffle triggers.

  ### Core Insight: Frame the Series as "Tools for Spotting Evolutionary Just-So Stories"
  Your goal isn’t to rehash philosophy but to equip reporters with **failure mode detectors** for weak adaptationist claims. Structure the series to build these tools progressively.

  ---

  ### The Agenda: 4 Features as Upstream Pillars (Order Matters)
  *(Followed by 2 synthesizing/applied pieces at the end)*

  1.  **Feature 1: What’s the *Actual* Null Hypothesis? Base Rates & the Burden of Proof**  
      **Question:** *How often are complex human traits *genuinely* adaptive vs. byproducts, drift, or noise? What’s the reasonable prior belief?*  
      **Why Upstream?** Settles the epistemological starting point. If base rates for adaptation are low (e.g., most genetic variants are neutral), the burden of proof shifts dramatically onto adaptationist claims. This underpins your "base rate rule."  
      **Tractability:** Interview population geneticists (e.g., on neutral theory, genome-wide association studies showing mostly non-functional variants), paleoanthropologists (on patchy fossil evidence), and meta-researchers analyzing adaptation claims vs. alternatives in lit.  
      **Journalism Impact:** **Tool: The "Prior Probability" Check.** Before writing "Gene X evolved for Y," demand: *"What fraction of similar traits/genes in this lineage are demonstrably adaptive? What’s the neutral expectation here?"* If no answer, the claim needs extreme skepticism.  
      **Your Homebrew:** **Base Rate Rule is VALID & NEEDED.** It’s Bayesian reasoning applied to evo bio. Link it to work on the "adaptationist programme’s" neglect of null models (Gould/Lewontin, but also modern critics like Lynch on complexity). Not pure "inside baseball" if sold as a reporter’s BS detector.

  2.  **Feature 2: How Do We *Test* "Why" Stories? Contingency vs. Plausibility**  
      **Question:** *Can we distinguish an explanation rooted in actual historical lineage/ecology from a just-so story built solely on current utility?*  
      **Why Upstream?** Directly tackles the core methodological weakness: confusing "could be adaptive" with "was shaped by adaptation." Resolving this defines rigor.  
      **Tractability:** Focus on comparative methods. Interview evo biologists using phylogenetics, experimental evolution, or fossil transitions to *test* adaptive hypotheses. Contrast with purely functionalist approaches. Use vivid case studies (e.g., the panda’s thumb vs. truly convergent traits like camera eyes).  
      **Journalism Impact:** **Tool: The Lineage Swap Test (Upgraded).** Your test is excellent! Reframe it for reporters: *"If this trait appeared in [distantly related animal with different ecology], would the *same* adaptive story still sound plausible?"* If yes, it’s likely a just-so story based on current utility, not history. Requires citing actual lineage history.  
      **Reshuffle Trigger:** A major high-profile study retracting an adaptive claim based on new lineage evidence (e.g., better phylogeny or fossil) would make this Feature 1.

  3.  **Feature 3: Why Do Weak Stories Persist? Incentives, Function Drift & Narrative Capture**  
      **Question:** *What social/scientific structures reward adaptive storytelling and allow failing hypotheses to evade falsification (like function drift)?*  
      **Why Upstream?** Explains *why* the problem endures beyond mere ignorance. Addressing incentives is key to changing practice.  
      **Tractability:** Investigate publication bias (non-adaptive findings harder to publish?), grant funding trends, press release pressures, textbook inertia. Interview scientists frustrated by this, journal editors, science communication researchers. **Function Drift IS REAL** – document cases where the proposed function of a trait (e.g., oxytocin, FOXP2) shifts dramatically when initial claims are challenged.  
      **Journalism Impact:** **Tool: The "Function Shift" Red Flag.** When covering a claim, ask: *"Has the proposed function of this trait changed significantly in the last 5-10 years in response to criticism? If so, why should we trust the *current* story?"* Makes reporters explicitly track narrative instability.

  4.  **Feature 4: Beyond "Adaptation or Not?": The Messy Middle (Exaptation, Constraint, Multilevel Selection)**  
      **Question:** *What frameworks move us beyond the binary "is it an adaptation?" trap to capture evolutionary complexity?*  
      **Why Upstream?** Shows the debate matured. Understanding concepts like exaptation (Gould’s key spandrel follow-up), developmental constraint, or niche construction resolves false dichotomies and offers richer storytelling.  
      **Tractability:** Focus on thinkers advancing these ideas (e.g., Kevin Laland on niche construction, Mary Jane West-Eberhard on developmental plasticity). Use accessible examples (e.g., bird feathers: adaptation for flight? insulation? display? All, but sequentially!).  
      **Journalism Impact:** **Tool: The "Yes, And..." Reframe.** Push beyond "Is it for X?" to *"Could it have originated for Y, been co-opted for Z, and now be influenced by W? What evidence exists for each stage?"* Moves reporting from simplistic causality to evolutionary pathways.

  ---

  ### The Final Two Features: Application & Synthesis
  5.  **Feature 5: Case Study Smackdown:** Apply the tools from Features 1-4 to dissect 2-3 recent high-profile (likely shaky) adaptationist claims in human evolution (e.g., a "gene for creativity," "depression as an adaptation"). Show the tools in action.
  6.  **Feature 6: The Reporter’s Field Guide to Evo Claims:** Synthesize the series into a concrete checklist/journalist toolkit:
      *   Prior Probability Check (Base Rate)
      *   Lineage Swap Test
      *   Function Shift Red Flag
      *   "Yes, And..." Framework
      *   Key Questions for Scientists (e.g., "What’s the neutral alternative?", "What lineage-specific evidence supports this?")

  ---

  ### Critique & Naming Your Homebrew Tools
  *   **Base Rate Rule:** Insightful and defensible. It echoes **Bayesian skepticism** prevalent in evo biology critiques (think Felsenstein or even earlier Fisher). Call it the **"Prior Probability Principle"** – clearer for journalists.
  *   **Lineage Swap Test:** Excellent. It’s a specific test for **"adaptive storytelling vs. historical explanation"** or **"contingency neglect."** Keep the name – it’s intuitive.
  *   **Function Drift:** Real phenomenon! Related to **"Moving Target Fallacies"** or **"Ad Hoc Function Rescue."** Documented in philosophy (e.g., Griffiths on how "function" is used) and in critiques of specific fields (like evolutionary psychology). A key red flag.

  ### Reshuffle Triggers (Watch For)
  *   **Feature 1 Up:** A major meta-analysis quantifying the proportion of claimed human adaptations robustly supported vs. debunked/alternative explanations.
  *   **Feature 2 Up:** A high-profile methodology paper (e.g., in *Nature Methods*) proposing a new standard for testing adaptive hypotheses that emphasizes historical contingency, forcing labs to change practice.
  *   **Feature 3 Up:** A significant scandal where function drift/evasion of falsification is exposed in a major lab or journal, leading to retractions or policy changes.
  *   **Downplay Feature 4:** If interviews reveal these frameworks are still too niche or contentious *among working scientists* to impact reporting soon. Focus instead on deepening the critique in Features 1-3.

  This structure builds from foundational epistemology (priors) to methodology (testing) to sociology (incentives) to synthesis (better frameworks), culminating in practical tools. It avoids relitigating 1979 while showing why the core issues *still* corrupt modern science reporting and how to fix it. Good luck!
