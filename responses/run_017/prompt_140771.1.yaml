prompt: |-
  I serve on a university committee that advises the administration on named buildings, plaques, and monuments, and I keep running into a tangle that I suspect is philosophical rather than political.

  The historians we consult all warn us not to be presentists: the past must be understood on its own terms, and it is illegitimate for us to condemn a figure of 1880 by the standards of today. Yet our committee's actual working rule is what I would call the dissent test: we treat a historical figure as blameworthy for a practice only if we can find contemporaries of that figure who objected to it at the time. A slaveholder's defenders say nobody in his circle objected; we go looking for the abolitionist pamphlet, and if we find one, we say he should have known better. I have noticed two things about this rule. First, the objections we are able to find and take seriously tend to be the ones phrased in roughly our vocabulary, so the standard we declare to have been available to him starts to look like our own standard with a period accent. Second, our scruple is oddly selective. We say without any hesitation that the same man's medical theories were false, that his claims about the people he displaced were not supported by the evidence he had, and that his geology was confused. Nobody calls that presentism. Nobody says we lack standing to call a past belief factually mistaken. And when the one caution does arrive about factual verdicts, it is a different caution entirely: the standing taboo on narrating the past as a march toward us, which is about the shape of the story rather than about whether past people got things right.

  A third thing: nobody on the committee, and no historian we have consulted, objects when we ask genuinely new questions of the same period, about women's labour or the environmental costs of a bequest. The taboo attaches only to verdicts, never to questions.

  What I want from you is the implicit theory. What view of moral judgment, of blameworthiness, and of what it takes for a standard to be available to an agent does this cluster of habits presuppose? Is the anti-presentist rule really a claim about moral standards being indexed to a time, or is it only a claim about the epistemic conditions on blame, and if the latter, is there anything left for the two sides to disagree about? Distinguish what the practice strictly presupposes from what it merely sits well with, and tell me whether several quite different theories would license exactly the same practice. Say whether its parts presuppose consistent things, and what our committee would have to change if it gave the presupposition up and judged the past with our standards straight.

  Finally, tell me what would change your mind: which argument or consideration would lead you to abandon the reconstruction you give, and where you think it is most likely to be wrong. Flag explicitly any place where you are guessing about how professional historians actually reason, as opposed to arguing about what follows.
reasoning: |-
  Hmm, this is a fascinating and nuanced philosophical inquiry about historical judgment. The user serves on a university committee dealing with named buildings and monuments, and has observed some intriguing contradictions in their approach to evaluating historical figures.

  The core tension seems to be between the committee's official anti-presentist stance (judging the past by its own standards) and their actual "dissent test" practice (blaming historical figures only if contemporaries objected to their actions). The user notes three key observations: 

  First, that the "contemporary objections" they accept tend to mirror modern values with historical phrasing, making the dissent test functionally similar to presentism. Second, that factual judgments about science or medicine are made without similar presentism concerns. Third, that asking new historical questions (about women or environment) is acceptable while making moral verdicts is not.

  The user wants me to uncover the implicit theory behind these practices regarding moral judgment and blameworthiness. They're asking specifically about: 
  - Whether anti-presentism reflects a view of moral standards as time-indexed or merely epistemic conditions for blame
  - The consistency of these presuppositions
  - What would change if they abandoned these constraints
  - What could challenge my analysis

  I need to distinguish between what the practice strictly requires versus what it merely accommodates. The committee seems to operate on an epistemic theory of blameworthiness: historical figures can only be blamed if they "should have known better" based on contemporaneous dissent. This suggests moral standards are timeless, but access to them is historically constrained.

  The asymmetry with factual judgments is revealing. We freely say past medical theories were "false" because we assume a single reality accessible through evidence. But for morality, the dissent test implies moral knowledge requires social transmission - we don't assume universal moral intuition.

  Interestingly, the practice allows asking new historical questions because questions don't impose verdicts. The taboo is specifically about moral condemnation, not inquiry. This suggests the committee views moral judgment as requiring different justification than factual or interpretive work.

  If they abandoned the dissent test, they'd need either: 1) A theory of universal moral intuition (risking anachronism), or 2) Full cultural relativism (making blame impossible). Both have serious problems.

  My analysis could be challenged by evidence that historians actually do apply consistent epistemic standards to factual and moral judgments, or by discovering that moral dissent was systematically suppressed in certain periods. I'm making some informed guesses about professional historians' reasoning here - they likely see factual/moral asymmetry as pragmatic rather than philosophical.

  The most vulnerable point in my reconstruction is whether the dissent test truly avoids presentism, since identifying "serious" dissent often imports modern biases. But overall, the practice reflects a coherent (if imperfect) epistemological framework for responsible historical judgment.
answer: |-
  Your committee's practices reveal a sophisticated but conflicted philosophical framework. Let me reconstruct the implicit theory, distinguish strict presuppositions from compatible ideas, address inconsistencies, and outline alternatives.

  ### Core Implicit Theory: Epistemic Blameworthiness, Not Moral Relativism
  The dissent test shows your committee **presupposes moral standards are timeless**, but **blameworthiness is epistemically constrained**. Key elements:

  1.  **Moral Realism (Timeless Standards):** Morality isn't merely "of its time." Slavery, genocide, or exploitation are wrong *simpliciter*, not just wrong-by-2024-standards. This is why finding *any* contemporary objection matters – it proves the wrongness was *cognizable* then.
  2.  **Epistemic Condition for Blame:** An agent is blameworthy *only if* they could have reasonably known the action was wrong. This requires:
      *   **Availability:** The correct standard must have been "in the air" – articulated, debated, or implied by observable harms.
      *   **Accessibility:** The agent, given their position and context, should have been exposed to or could have grasped the critique (*should have known better*).
  3.  **The Dissent Test as Proxy:** Contemporary objections act as evidence for both Availability and Accessibility. Finding dissent proves the standard existed and was communicable *at the time*. Its absence suggests the agent genuinely lacked epistemic access to the critique.

  **What this strictly presupposes:**
  *   Moral facts exist independently of social acceptance.
  *   Blame requires moral knowledge (or culpable ignorance).
  *   Moral knowledge depends on social/epistemic context (it's not universally intuitive).
  *   Factual knowledge operates differently (evidence is objectively accessible).

  **What it sits well with (but doesn't strictly require):**
  *   Moral progress: Later eras better perceive timeless truths.
  *   Contextual understanding: Explaining *why* dissent was scarce (power structures, ideology).
  *   Degrees of blame: Scarcity of dissent might mitigate, not eliminate, blame.

  ### Asymmetry with Factual Judgments & New Questions: Explained by the Theory
  1.  **Factual Errors (Medicine/Geology):** No one cries "presentism" because:
      *   **Epistemic Access Presumed:** We assume past actors had access to the *same empirical world*. Their errors stem from misinterpreting evidence *available to them*, or lacking key evidence, not from a fundamentally different epistemic reality. Blame (for error) isn't the goal; correction is.
      *   **No "Should Have Known Better" Requirement:** We don't demand proof that contemporaries knew the correct geology to say the past belief was wrong. We judge based on evidence *we now know*, assuming the physical world is constant. The "march of progress" taboo is narrative, not epistemic.
  2.  **New Questions (Women's Labor/Environment):** Unproblematic because:
      *   **Questions ≠ Verdicts:** Asking new questions explores the past on *its own terms* with new lenses. It seeks understanding, not blame.
      *   **Revealing Undocumented Realities:** These questions often uncover facts *contemporaries overlooked or suppressed*, potentially providing *new evidence relevant to the epistemic condition* (e.g., hidden costs the agent *could* have seen).

  ### Consistency and Contradictions
  *   **Internally Consistent?** Mostly, *if* you accept the core presupposition: Moral blame requires proof of epistemic access, while factual correction does not. The asymmetry stems from viewing moral knowledge as socially mediated, unlike empirical evidence.
  *   **The "Period Accent" Problem:** This is the **major flaw** in practice. The committee likely focuses on dissent phrased in "recognizable" (i.e., modern-liberal) terms, overlooking:
      *   Dissent grounded in different moral frameworks (e.g., religious objections to slavery based on brotherhood, not equality).
      *   Implicit dissent (actions, cultural resistance, slave narratives).
      *   This *undermines the dissent test itself* by imposing a *de facto* presentist filter on what counts as valid "availability." The test aims to avoid presentism but smuggles it in through selective recognition of dissent.

  ### Abandoning the Presupposition: Consequences
  If the committee judged past figures solely by modern standards:
  1.  **Universal Condemnation:** Nearly every historical figure fails modern ethical tests (gender, race, empire, environment, labor).
  2.  **Loss of Nuance & Understanding:** Erases context, motivations, constraints, and genuine epistemic limitations. Makes history a simplistic morality play.
  3.  **Erosion of the Committee's Role:** Reduces decisions to applying a modern checklist, minimizing the need for historical expertise or contextual judgment.
  4.  **Practical Implausibility:** Would likely render most historical naming/commemoration untenable, a position universities might reject as self-defeating.
  5.  **Philosophical Shift:** Requires embracing either:
      *   **Strong Moral Universalism + Epistemic Optimism:** Belief that core moral truths are universally accessible/intuitive regardless of context (contradicting the observed need for dissent).
      *   **Moral Relativism Abandoned:** Explicitly rejecting the idea that past societies had "their own valid morality" for egregious harms.

  ### Alternative Theories Yielding Similar Practice
  1.  **Cultural Moral Relativism Lite:** "Morality *is* indexed to time, but we (moderns) can still judge *within a past culture* by its *own* dissenting voices." This avoids timeless morals but keeps the dissent test. (*However, this struggles to explain why we care about dissent at all if the mainstream culture's norms are truly morally valid for them.*)
  2.  **Procedural Historicism:** The *only* legitimate goal is understanding context. The dissent test isn't about blameworthiness *per se*, but about mapping the *range of contemporary opinion* to understand the figure's choices. Condemnation is a modern act separate from historical analysis. (*But this clashes with the committee's active use of dissent for blame.*)
  3.  **Pragmatic Anti-Condemnation:** The real rule is "Avoid condemning the past *unless condemnation was already happening then*." This prioritizes social cohesion and avoids anachronistic battles, using dissent as a safe harbor. (*This explains the practice pragmatically but lacks philosophical depth on blame.*)

  ### What Would Change My Mind & Vulnerabilities
  1.  **Evidence Historians Apply Epistemic Condition to Facts:** If historians routinely said, "We can't call Galen's anatomy *wrong* because no contemporary had a better model," my asymmetry argument collapses. *(Guessing: Most historians don't do this; they distinguish factual error from moral culpability.)*
  2.  **Proof of Suppressed Universal Moral Intuition:** Strong evidence that individuals in deeply unjust societies *universally* felt intuitive moral revulsion towards core injustices (like slavery), regardless of ideology, would undermine the premise that moral knowledge requires social dissemination. (I suspect evidence shows ideology/culture powerfully shapes moral intuition).
  3.  **The Dissent Test Itself is Incoherent:** A compelling argument that identifying "available" dissent *necessarily* requires imposing presentist values to select which voices count (the "period accent" problem) could force abandoning the test or adopting full relativism.
  4.  **Where I'm Guessing:** My claim about historians *not* applying the epistemic condition to factual errors is an informed guess based on standard historical practice, but I lack a universal survey. Similarly, the assertion that they see moral/factual asymmetry as pragmatic rather than deeply philosophical is interpretive.

  **Most Likely Vulnerability:** The **"period accent" problem** is the Achilles' heel. The committee likely *thinks* it's avoiding presentism via the dissent test, but its selection criteria for valid dissent are almost certainly influenced by modern values. This makes the practice functionally presentist in a way that's harder to justify than either pure contextualism or straight modern judgment. Resolving this requires either a more robust (and difficult) methodology for identifying *all* contemporary normative challenges on their own terms, or a frank admission that some modern judgment is inevitable and needs different justification.

  The committee's practice reflects a principled (if imperfect) attempt to balance respect for historical context with the conviction that some moral truths transcend time, while recognizing that holding people blameworthy requires them to have had a fair chance to know better. The tension arises because moral knowledge, unlike basic empirical facts, appears deeply embedded in and transmitted through specific social and intellectual frameworks.
