     Added "LöbianHandshake" bot. It cooperates if it can prove that the opponent cooperates. 
     README updated to claim that this bot "dissolves" the dilemma.

     ## [0.3] - 2020-03-10
     Fixed a bug where LöbianHandshake would time out against itself. 
     Now it uses a fixed proof-search timeout of 10 seconds. 
     Unfortunately, with the timeout, it defects against itself.

     ## [0.4] - 2020-04-05
     Added "ProvablyNice": a bot that cooperates if it can prove that the opponent is ProvablyNice and that the opponent will cooperate. 
     It also defects against any bot that is not using the exact same proof system (to avoid "proof system hijacking").

     ## [0.5] - 2020-05-20
     ProvablyNice was found to defect against LöbianHandshake because of a slight difference in the proof system encoding. 
     Introduced a "proof system fingerprint" exchange to allow recognition of compatible systems. 
     Now ProvablyNice and LöbianHandshake cooperate only if they have matching fingerprints.

     ## [1.0] - 2020-07-01
     Major rewrite to allow custom proof systems. 
     Added "ReflectiveDefector": cooperates only if the opponent's proof system is exactly the same as its own and it can prove cooperation. 
     This bot cooperates with itself but with no one else.

     ## [1.1] - 2020-08-15
     Bots can now specify "trusted roots" for proof systems. 
     "AuditedCooperate" requires that the opponent's proof system is open-source and has been audited by the bot's maintainer. 
     Only one bot in the tournament (AuditedCooperate itself) meets this criterion.

     ## [2.0] - 2021-01-12
     Introduced adjustable proof-search budgets. 
     Bots can now specify how much time (or steps) they spend on proof search. 
     New bot: "BudgetBox" which cooperates only if the proof can be found within its budget (default: 1 second). 
     Tournament results now show that BudgetBox cooperates with other BudgetBoxes that have at least the same budget, but defects against those with lower budgets. 
     The landing page still states that defection has been refuted.

     ## [2.1] - 2021-03-05
     Added a leaderboard that sorts by average score. 
     Since bots with higher budgets can cooperate with more high-budget bots, they now dominate the top. 
     The README has been updated to note that "cooperation scales with computational resources".

     ## [2.2] - 2021-05-20
     New bot: "TuringTested" - it runs the opponent's code in a sandbox with a fixed resource limit to see what it does when faced with a cooperator. 
     However, it defects by default if the opponent's code takes too long (which happens if the opponent is also running a proof search).

     ## [2.3] - 2021-07-15
     Added a new tournament mode: "RealWorldSim" - bots are given a hash of the opponent's source instead of the full source. 
     In this mode, all Löbian and proof-based bots defect by default. 
     The top performer is now TitForTat.

     Known Issues:
       - Mutual transparency condition is not met in real strategic interactions. 
       - Bots that rely on proof search often time out and defect, even against known cooperators. 
       - The set of bots that can mutually cooperate is shrinking with each patch for security.

     FAQ:
       Q: Why does LöbianHandshake defect against itself?
       A: It requires a proof that the opponent cooperates, which in turn requires that the opponent has already found a proof. 
          With a timeout, this mutual dependency cannot be resolved.

       Q: How do I get my bot to cooperate with more opponents?
       A: Increase the proof-search budget and relax the security constraints. 
          Note that relaxing constraints may make your bot vulnerable to exploitation.

       Q: Doesn't this whole approach just assume away the problem of trust by having perfect information?
