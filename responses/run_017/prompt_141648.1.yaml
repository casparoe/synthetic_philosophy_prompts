answer: |-
  ### CHANGELOG  
  *Maintainer: A. R. Bitwise*  

  #### [0.1] - 2020-04-01  
  Initial release.  
  - Tournament engine: Runs Prisoner’s Dilemma between programs with full source-code access.  
  - Reference bots: `AlwaysCooperate`, `AlwaysDefect`, `TitForTat`.  
  - README claims Löbian agents "resolve" the dilemma via proof-based cooperation.  

  #### [0.2] - 2020-05-12  
  Added `LöbBot v1`:  
  - Cooperates iff it finds a proof (in Peano Arithmetic) that opponent cooperates.  
  - README updated: "Mutual proof-based cooperation dissolves the dilemma."  
  - **Bug**: `LöbBot v1` vs. `LöbBot v1` hangs indefinitely. Both eventually time out and defect.  

  #### [0.3] - 2020-06-30  
  Patched `LöbBot v1.1`:  
  - Added proof-search timeout (default: 5 sec).  
  - Now defects against itself reliably due to timeout.  
  - README footnote: "Cooperation achieved in theory; practice requires optimizations."  

  #### [0.4] - 2020-08-22  
  Added security hardening:  
  - `LöbBot v2` defects if opponent lacks a proof verifier (e.g., `AlwaysCooperate`).  
  - README: "Eliminates naive exploitation."  
  - **Side effect**: `LöbBot v2` defects against 80% of field. Average cooperation drops 65%.  

  #### [1.0] - 2020-12-14  
  **Breaking changes**:  
  - `LöbBot v3` requires opponent’s proof system to be *self-verifiable*.  
  - New bot: `ParanoidLöb` — defects if opponent’s proof logic exceeds 50 LOC.  
  - `ParanoidLöb` cooperates only with itself (if placed in identical containers).  

  #### [1.1] - 2021-02-03  
  - Tournament results now track "coverage": % of opponents a bot cooperates with.  
  - `LöbBot v3` coverage: 12% (down from 15% in v2).  
  - README unchanged: "Defection is provably suboptimal."  

  #### [2.0] - 2021-05-17  
  **Compute-aware update**:  
  - Proof-search budget now configurable (default: 1 CPU-second).  
  - New bot: `BigTechLöb` — budget: 60 CPU-seconds. Cooperates only with agents using ≥30s budgets.  
  - Leaderboard sorts entries by avg. score. `BigTechLöb` ranks highest (cooperates with 4% of bots).  
  - README: "Cooperation scales with rational investment in verification."  

  #### [2.1] - 2021-08-30  
  - Added `CharityLöb`: Cooperates with agents using weaker proof systems by gifting them proofs.  
  - **Bug**: `CharityLöb`’s gifts expire before budget-poor bots verify them. All recipients defect.  
  - Coverage: `CharityLöb` (3%), `BigTechLöb` (4%).  

  #### [2.2] - 2021-11-21  
  - `LöbBot v4` introspects opponent’s hardware specs via container metadata.  
  - Defects if opponent lacks GPU acceleration ("unverifiable under resource constraints").  
  - Tournament now runs on AWS. Entry fee: $0.02/CPU-minute.  

  #### [2.3] - 2022-03-10  
  - New "Realism Mode": Opponent source code replaced with a truncated hash.  
  - All Löbian bots defect. Top scorer: `TitForTat`.  
  - README unchanged.  

  ---

  ### KNOWN ISSUES  
  1. Mutual proof dependency creates infinite regress unless one agent halts verification early (timing out = defection).  
  2. Each security patch (proof-system audits, resource checks) reduces viable cooperation partners.  
  3. "Cooperation" only occurs when:  
     - Both agents have identical proof systems.  
     - Both audit each other’s hardware.  
     - Both possess sufficient resources to simulate the other’s simulation.  
  4. Bots assume opponents are deterministic. Adding a single `rand()` call collapses all Löbian cooperation.  
  5. The setup pre-solves trust by gifting agents perfect information (source code). Without this, they defect.  

  ### FAQ  
  **Q: Why does `LöbBot` defect against itself?**  
  A: Each agent waits for the other to complete its proof first. Under timeout, mutual defection is the halting state.  

  **Q: How to improve my bot’s coverage?**  
  A: Decrease security constraints (e.g., trust opponents with unaudited proof systems) or increase compute budget. Note: Both increase exploitation risk.  

  **Q: Why do Löbian bots dominate the leaderboard but rarely cooperate?**  
  A: Leaderboard scoring rewards cooperation with high-score agents (i.e., other resource-rich Löbian bots). The "top" is a resource-secured clique.  

  **Q: Doesn’t this prove cooperation is possible only under artificial conditions?**  
  A: Yes.  

  **Q: Why keep the original README?**  
  A: The proof of its obsolescence is left as an exercise for the user.
