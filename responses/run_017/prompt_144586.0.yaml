answer: |-
  Here are five points addressing where your framing might break:

  1.  **Aquinas prioritizes the *source* of removal authority, not the method of tyranny:** Your "consent-proofing" focuses on *how* the tyrant secures power, but Aquinas's ruler/tyrant distinction hinges on the initial legitimacy of accession ("title") versus subsequent abuse ("exercise"). Consent-proofing, however sophisticated, likely falls under abuse of *exercise* for him.
  2.  **"Public authority" is the key bottleneck, not the nature of tyranny:** Aquinas mandates removal by existing "public authority" for the ruler-turned-tyrant. Consent-proofing deliberately destroys *precisely* this authority. Your frustration highlights this fatal gap in his framework: he doesn't resolve who acts when the legitimate *institutional* pathway is obliterated by the tyrant.
  3.  **Title vs. Exercise is fundamentally about origin, not ongoing legitimacy:** While destroying consent mechanisms *should* undermine legitimacy, Aquinas's cut is primarily procedural/historical: did the ruler start right (title) or wrong (usurper)? Consent-proofing happens *after* a (presumably) rightful start, keeping it firmly in the "exercise" category for him.
  4.  **Consent-proofing doesn't automatically convert title:** Aquinas doesn't provide a mechanism where subsequent actions by a ruler with initial legitimate title retroactively turn him into a usurper *in title*. His usurper is defined by initial wrongful seizure, not later subversion of systems.
  5.  **"Right to kill" *is* partly anachronistic; focus on authority and common good:** Aquinas isn't primarily granting "rights" but defining licit *authority* to act for the common good. Private killing is framed as a dangerous absence of authority, only permitted against usurpers where *no* constituted public authority exists to act. For the ruler-turned-tyrant, he insists *some* public authority must act, even if crippled.
