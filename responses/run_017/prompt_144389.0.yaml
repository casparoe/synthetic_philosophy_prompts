answer: |-
  ## Sestina for the Last Reader (or the Next)

  You find this poem printed, presses cool,
  Your place within its readers holds your **RANK**.
  The logic claims you're middle of the **CLASS**,
  A median observer, drawn **RANDOM**.
  From where you stand, the ending comes too **SOON**,
  This single copy makes a case for **DOOM**.

  The argument unfolds, a subtle **DOOM**:
  That finding ink still damp, the page not **COOL**,
  Means you are likely near the end. Too **SOON**
  For countless others? Check your reader's **RANK**.
  Assuming you're a typical **SAMPLE**
  Defines the boundaries of the reading **CLASS**.

  But who belongs inside this fading **CLASS**?
  Just those who held the page before its **DOOM**?
  Or every soul who *might* become a **SAMPLE**?
  The paper warms beneath your touch, not **COOL**;
  Your fingers trace the lines that fix your **RANK**.
  The final reader? Maybe. And too **SOON**.

  The printer's rhythm slows, predicts a **SOON**
  Conclusion for the whole assembled **CLASS**.
  Each copy passed implies a higher **RANK**,
  Accelerating towards the final **DOOM**.
  The metal type no longer running **COOL**
  Asserts you are a crucial, late **SAMPLE**.

  But is your presence truly just a **SAMPLE**,
  A data point that signals endings **SOON**?
  The ink where your thumb rests feels strangely **COOL**.
  This very stanza names the shrinking **CLASS**,
  Invokes the logic spelling out your **DOOM**,
  Based solely on your current reader's **RANK**.

  Consider those who never got a **RANK**,
  Who won't exist to be a future **SAMPLE**.
  Does their non-being hasten our shared **DOOM**?
  Or does it mean the end is not so **SOON**?
  The definition of the reader **CLASS**
  Grows slippery, refusing to stay **COOL**.

  The presses cease. The argument turns **COOL**.
  Your final proof: your solitary **RANK**.
  If every **CLASS** must end, then this one's **SOON**.
  You hold the only extant **SAMPLE**.
  Does the press run dry because we claimed its **DOOM**?
  The ink insists: *This mark implies your **RANK**.*

  ---

  **Envoi**

  This ink insists: *This mark implies your **RANK**.*
  A random **SAMPLE**, drawn from fading **CLASS**,
  Predicts the **DOOM** too **SOON**. But why? The **COOL**
  Press stopped because we printed this... the **RANDOM**
  Blur of cause and prophecy. The **DOOM** we claim
  Arrives by naming it. The **SOON** we read
  Is summoned by the **SAMPLE** that we heed.

  ---

  **Formal Notes & Thematics:**

  1.  **Sestina Structure:** Six stanzas of six lines, followed by a three-line envoi. The six end-words (**RANK, RANDOM, CLASS, SOON, DOOM, SAMPLE**) rotate through a fixed pattern (last word of stanza 1 becomes 2nd word of stanza 2, last word of stanza 2 becomes 3rd word of stanza 3, etc., following the traditional sestina permutation: 6-1, 5-2, 4-3, 3-6, 2-5, 1-4). All six end-words appear in the envoi.
  2.  **The Doomsday Argument Applied:** The poem casts the reader as a "median" reader (Stanza 1). Finding the poem relatively early in its print run (implied by "ink still damp," "presses cool") suggests to them, applying the DA logic, that the total readership will be small and ending soon (Stanzas 2, 3). Their specific position (**RANK**) is treated as a **RANDOM SAMPLE** from the total **CLASS** of readers, leading to the inference of imminent **DOOM** for the readership.
  3.  **Self-Fulfilling Prophecy:** The critical twist (Stanzas 4, 5, Envoi) is that the act of printing and distributing *this very argument* ("We printed this") likely *causes* the presses to stop ("The presses cease," "The press stopped because we printed this"). Predicting the end becomes the reason for the end. The prediction (*DOOM*) and its cause are the same act.
  4.  **Reference Class Problem:** The envoi explicitly highlights the ambiguity of defining the reference **CLASS** ("Just those who held the page... Or every soul who *might*"). This definition drastically changes the inference drawn from the reader's **RANK**.
  5.  **Sampling Assumption & Prior:** The core sampling assumption ("Assuming you're a typical **SAMPLE**") is stated directly. The flat prior over total readership is implied by "median" and "likely near the end." The alternative (self-indication) is subtly present in Stanza 4: "Consider those who never got a **RANK**... Does their non-being hasten... Or does it mean the end is not so **SOON**?" – questioning if being born/reading *now* is evidence *for* a large total class.
  6.  **Ambiguity & Unresolved Ending:** The final lines ("The **DOOM** we claim / Arrives by naming it. The **SOON** we read / Is summoned by the **SAMPLE** that we heed.") leave the reader uncertain: Is the logic valid and self-fulfilling? Or is the act of believing it the real cause, making the argument a con? The physicality of the ink ("This ink insists") contrasts with the logical abstraction, emphasizing the tension.
