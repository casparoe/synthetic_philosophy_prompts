prompt: |-
  Hi — I need a decision tree and I've been going in circles trying to build one myself, so I'm outsourcing it.

  Context: I'm a 3rd-year PhD student in linguistics, sociopragmatics side, and I'm running one session of our cross-cultural pragmatics reading group on directness and deception — the Dutch directness vs. Japanese indirectness thing, and whether white lies are actually wrong. The group is mixed: two Dutch students, a couple of Japanese students, some Americans, and one philosopher who keeps dragging everything back to the norm of assertion, which is fine but he's dominating. I want to open with something that sorts people by what they say about cases before anyone gets to say the word Grice, because the last two sessions turned into people reciting positions they'd already picked. Not asking for citations or a reading list — we all know the implicature and face-work stuff well enough, I just need the object itself.

  What I want, in five sections:

  "How to read it" (~60 words). Audience is smart undergrads and grad students who've done a bit of pragmatics but no ethics. Say in one paragraph how to use the tree, and be explicit that it isn't a full binary tree: most branch questions only bite given certain earlier answers, so let paths merge and say which nodes are downstream of which.

  "The tree" (~600 words). Start everyone from the same commitment: you're about to say something negative or unwelcome and there's a softer option available. Then branch on questions a student can answer without knowing any position's name. At minimum I want nodes built from these distinctions: whether the utterance is even in the assertion business (versus being a ritual or an expressive gesture, like a phatic noise that isn't there to transfer a belief); whether the case is one where everyone already knows and you're maintaining a shared pretense, versus one where the hearer genuinely lacks what you know; whether a literally-true but engineered-to-mislead version is better than, worse than, or no different from a flat falsehood; whether staying silent or declining to answer is genuinely available here or whether silence itself would speak; what the exchange is even for — accurate information transfer, or keeping the relationship and everyone's face intact with information transfer as just one sub-game; who ends up doing the inferential and emotional work; whether the softening has effects on third parties and on the long-run value of your own speech (if everything you say is softened, your praise is worth nothing and your criticism becomes unsayable); and finally, when your interlocutor's norm differs from yours, whose norm is supposed to govern — yours, theirs, or the local one. I'd also really like a node on blunt self-disclosure versus blunt assessment of the other person, because people run those together: someone can be all for saying that hurt me and dead against saying your draft is bad, or the reverse, and my group keeps conflating them.

  Cases to use: a friend's genuinely bad paper draft; a recommendation letter or referee report where softening inflates a currency other people rely on; the trivial high-frequency stuff (something in someone's teeth, an ugly haircut); an explicit tell me honestly, I can take it request; and one cross-norm case, e.g. a Dutch supervisor giving feedback to a student who was trained to read the air. No node should be phrased as do you think honesty is important or anything else where the label is in the question.

  "The leaves" (~350 words). Name each endpoint, or call it unnamed if nobody really holds it, and give one sentence on its most awkward commitment. Must appear: no white lies ever but silence is fine; the technically-true-misleading-is-the-honest-compromise view; the misleading-is-just-lying view; polite speech isn't assertion at all; relationship-first contextualism about the truth norm; straight welfare-balancing; bluntness as respect and anti-paternalism; care-first, i.e. bluntness is laziness wearing a virtue label; the view that the whole question is downstream of who is normally expected to do the softening; and accommodationism about whose norm wins.

  "Cells nobody lives in" (~200 words). Which combinations of answers the tree allows but nobody occupies, and why each is incoherent, unattractive, or just unexplored. I especially want the one where you refuse to lie, refuse to mislead, and refuse to be silent — and what that does to ordinary talk — and the one where the isn't-an-assertion move is available for every negative assessment, which then lets anyone opt out of every assertoric norm.

  "Where it stalls" (~120 words). Flag any pair of positions the tree genuinely can't separate rather than inventing a question to force them apart — I'd rather hand the group an honest dead end than a fake branch.
reasoning: |-
  We are building a decision tree for a pragmatics reading group on directness and deception. The goal is to sort participants by their responses to specific cases without invoking theoretical labels. The tree should start from a common scenario and branch based on distinctions that avoid jargon.

  We have five sections:

  1. "How to read it": A brief guide (60 words) explaining that the tree is not a strict binary tree; paths can merge, and some branches are only relevant given prior answers.

  2. "The tree": The main structure (600 words). Start with: You're about to say something negative or unwelcome and a softer option is available. Then branch using the provided distinctions without using theoretical labels. We must include:
     - Whether the utterance is in the "assertion business" (vs. ritual/expressive).
     - Whether it's a shared pretense (everyone knows) vs. hearer genuinely lacks the information.
     - Whether a technically true but misleading version is better, worse, or no different from a flat falsehood.
     - Whether silence is genuinely available or if silence would speak.
     - The purpose of the exchange: information transfer vs. maintaining relationships/face.
     - Who does the inferential and emotional work (speaker or hearer).
     - Effects on third parties and long-run value of speech (e.g., if everything is softened, praise becomes worthless).
     - When norms differ: whose norm governs (yours, theirs, local).
     - A node separating blunt self-disclosure (e.g., "that hurt me") from blunt assessment of others (e.g., "your draft is bad").

     Cases to consider: 
     - A friend's bad paper draft.
     - A recommendation letter or referee report (softening affects others).
     - Trivial cases (something in teeth, ugly haircut).
     - An explicit "tell me honestly" request.
     - Cross-norm case: Dutch supervisor and student trained to "read the air".

  3. "The leaves": Name each endpoint (or "unnamed") and one sentence on its most awkward commitment. Must include:
     - No white lies ever, but silence is okay.
     - Technically-true-misleading is the honest compromise.
     - Misleading is just lying.
     - Polite speech isn't assertion at all.
     - Relationship-first contextualism about the truth norm.
     - Straight welfare-balancing.
     - Bluntness as respect and anti-paternalism.
     - Care-first: bluntness is laziness wearing a virtue label.
     - The view that the whole question depends on who is expected to do the softening.
     - Accommodationism about whose norm wins.

  4. "Cells nobody lives in": Combinations that are allowed by the tree but are incoherent, unattractive, or unexplored. Specifically:
     - Refusing to lie, mislead, or be silent -> what that does to ordinary talk.
     - The "isn't-an-assertion" move for every negative assessment -> opting out of assertoric norms.

  5. "Where it stalls": Pairs of positions the tree cannot separate.

  Approach:

  1. How to read it: We'll write a concise paragraph.

  2. The tree: We'll design the branching structure step by step, starting from the common scenario. We'll use the distinctions provided and ensure that the questions are case-based and avoid theoretical terms.

     We'll structure the tree as follows:

     Step 0: You are about to say something negative or unwelcome, and there is a softer option available.

     Step 1: [Branch on the type of negative content] 
          Q1: Is the negative content about your own state (e.g., "I'm upset") or about an assessment of the other person (e.g., "Your draft is bad")?
          -> This separates self-disclosure from other-assessment.

     Step 2: [Branch on the context of shared knowledge]
          Q2: In this situation, does everyone involved already know the negative truth, or is it new information to the hearer?
          -> Shared pretense vs. new information.

     Step 3: [Branch on the availability of silence]
          Q3: Is silence a genuine option? (That is, would staying silent or declining to answer itself communicate a negative message in this context?)
          -> If silence would be taken as agreement, disapproval, etc., then it's not truly neutral.

     Step 4: [Branch on the purpose of the exchange]
          Q4: What is the primary purpose of this exchange? (a) To transfer accurate information, or (b) to maintain the relationship and everyone's face, with information transfer being secondary?
          -> This might be context-dependent.

     Step 5: [Branch on the nature of the utterance]
          Q5: Is the softer option (or the blunt one) functioning as an assertion (aiming to convey a belief) or as a ritual/expressive gesture (e.g., phatic, politeness formula)?
          -> This addresses whether the utterance is in the assertion business.

     Step 6: [Branch on the use of technically true misleading statements]
          Q6: If you were to use a technically true statement that is engineered to mislead (e.g., "The draft has many interesting ideas" when it's bad but has a few interesting points), how does that compare to a flat falsehood? 
          Options: 
            - It's better because it's true and softens the blow.
            - It's worse because it's deceptive and manipulative.
            - It's no different from lying because it's intended to mislead.

     Step 7: [Branch on the distribution of work]
          Q7: Who should do the inferential and emotional work in this exchange? 
            - The speaker (by being clear and direct, forcing the hearer to confront the truth without extra work).
            - The hearer (by reading between the lines and not taking things too personally).
            - Both share the burden.

     Step 8: [Branch on long-term effects and third parties]
          Q8: If you consistently soften your negative comments, what effect does that have?
            - It devalues your praise and makes criticism impossible to express without causing offense.
            - It maintains harmony and allows for a sustainable relationship where criticism can be given rarely and with care.
            - It might mislead third parties who rely on your statements (e.g., in recommendation letters).

          Also, in cases like recommendation letters: softening might harm the system by inflating the meaning of words.

     Step 9: [Branch on conflicting norms]
          Q9: If you and your interlocutor have different norms about directness (e.g., you prefer bluntness, they prefer indirectness), whose norm should govern the exchange?
            - The speaker's norm (because you are the one speaking).
            - The hearer's norm (because they are the one receiving the message).
            - The local norm (of the institution, country, or context).

     Note: Some branches might be skipped based on prior answers. For example, in a shared pretense context, the question about new information might not be relevant. We'll design the tree so that if an earlier answer makes a later question irrelevant, we skip it.

     We'll use the cases to illustrate the nodes.

  3. The leaves: We'll traverse the tree and assign the required positions to the endpoints. We'll note the awkward commitment.

  4. Cells nobody lives in: We'll identify paths that lead to combinations that are not held by anyone.

  5. Where it stalls: We'll note if two distinct positions end up at the same leaf or if a branch doesn't distinguish them.

  Given the complexity, we'll outline the tree in a structured way and then write the descriptions.

  Let's start with the "How to read it" section.
answer: |-
  ### How to read it  
  This decision tree maps your stance on directness/deception in negative/unwelcome speech. It's **not binary**: branches activate only if prior answers make them relevant (e.g., a "shared pretense" branch won’t appear unless you’ve ruled out certain options). Merge paths where distinctions collapse. Answer based on concrete cases (e.g., "a friend’s bad draft"), not abstract principles. Start from the root and follow arrows; dashed lines indicate conditional branches.  

  ---

  ### The Tree  
  *(~600 words)*  
  **Root:** You’re about to say something negative/unwelcome (e.g., critiquing a friend’s draft). A softer option exists (e.g., vague praise). What do you do?  

  1. **Q1: Is the negativity about your own state ("I’m upset") or an assessment of another ("Your draft is bad")?**  
     - *Self-disclosure* → Go to Q2.  
     - *Other-assessment* → Go to Q3.  
     *(Cases: Bluntly saying "that hurt me" vs. "your haircut is ugly" — these often diverge.)*  

  2. **Q2 (Self-disclosure): Is the goal here to transfer information or to express solidarity/manage tension (e.g., sighing "I’m tired" at a tense meeting)?**  
     - *Information transfer* → Go to Q4.  
     - *Ritual/expressive gesture* → Skip to Q6 (not in "assertion business").  

  3. **Q3 (Other-assessment): Does the hearer genuinely lack this information (e.g., food in teeth), or is everyone maintaining a shared pretense (e.g., praising a bad gift)?**  
     - *Hearer lacks knowledge* → Go to Q4.  
     - *Shared pretense* → Skip to Q7.  

  4. **Q4: Is silence a genuine option? (Or would silence itself communicate rejection, e.g., not answering "do I look okay?")**  
     - *Silence speaks* → Go to Q5.  
     - *Silence neutral* → You may stay silent (leaf: **Silence as shield**).  

  5. **Q5: If you must speak, is a technically true but misleading statement (e.g., "your draft has strengths") better, worse, or equal to a flat lie?**  
     - *Better (softens without lying)* → Go to Q8.  
     - *Worse (manipulative)* or *Equal to lying* → Go to Q6.  

  6. **Q6: Is the softened utterance an assertion (aiming to inform) or not? (E.g., is "nice dress!" phatic when you hate it?)**  
     - *Not an assertion* → Leaf: **Politeness as ritual**.  
     - *Assertion* → Go to Q9.  

  7. **Q7 (Shared pretense): Is the pretense for relationship maintenance, or does it risk harm (e.g., inflated reference letters mislead third parties)?**  
     - *Harmless relationship glue* → Leaf: **Preserve the game**.  
     - *Risks harm/deception* → Go to Q9.  

  8. **Q8: Does consistent softening devalue your speech overall? (E.g., if you always soften criticism, is your praise meaningless?)**  
     - *Yes* → Leaf: **Bluntness as integrity**.  
     - *No* → Go to Q9.  

  9. **Q9: What’s the core purpose of this exchange?**  
     - *Truthful information transfer* → Go to Q10.  
     - *Relationship/face preservation* → Leaf: **Relationship-first**.  

  10. **Q10: When norms clash (e.g., Dutch supervisor vs. Japanese student), whose norm governs?**  
      - *Speaker’s norm* → Leaf: **Anti-paternalism**.  
      - *Hearer’s/local norm* → Leaf: **Accommodationism**.  

  *(Cases anchor branches: e.g., Q3 uses "food in teeth" (new info) vs. "bad gift" (pretense); Q7 uses reference letters (third-party harm); Q10 uses cross-norm supervision.)*  

  ---

  ### The Leaves  
  *(~350 words)*  
  1. **Silence as shield**: No white lies ever, but silence is fine. *Awkward: You must accurately gauge when silence "speaks."*  
  2. **Politeness as ritual**: Soft speech isn’t assertion, just social grease. *Awkward: Can’t explain how "bad dress" feedback differs from "bad draft" feedback.*  
  3. **Preserve the game**: Uphold shared pretense (e.g., praising bad gifts). *Awkward: Lets systemic deception persist.*  
  4. **Bluntness as integrity**: Directness prevents praise inflation. *Awkward: Ignores emotional labor dumped on hearers.*  
  5. **Relationship-first**: Truth bends to protect connections. *Awkward: May gaslight those seeking honesty.*  
  6. **Anti-paternalism**: Impose your norm; bluntness respects autonomy. *Awkward: "Respect" can cause cross-cultural ruptures.*  
  7. **Accommodationism**: Defer to hearer’s/local norms. *Awkward: Forces self-betrayal if your norms clash.*  
  8. **Technically-true compromise**: Misleading statements are the honest middle ground. *Awkward: Still manipulates by design.*  
  9. **Misleading=lying**: Any engineered vagueness is deception. *Awkward: Makes most polite speech immoral.*  
  10. **Care-first**: Indirectness is labor; bluntness is lazy. *Awkward: Framed as "virtue," it dismisses cultural nuance.*  
  *Unnamed leaf*: Welfare-balancing (weigh harm/benefit case-by-case). *Awkward: Ad hoc and unprincipled under pressure.*  

  ---

  ### Cells Nobody Lives In  
  *(~200 words)*  
  1. **The triple refusal**: Reject lying, misleading, *and* silence. *Why incoherent?* In cases where silence speaks (Q4), you must choose *some* speech act — forcing either bluntness (often harmful) or dishonesty. This collapses ordinary conversation (e.g., declining to praise a bad performance becomes impossible without snubbing).  
  2. **Universal non-assertion**: Claiming *every* negative assessment is "not assertion" (e.g., "your draft is bad" is just a ritual groan). *Why unattractive?* It vaporizes accountability: if nothing is an assertion, you can "opt out" of truth norms entirely, making criticism unfalsifiable and praise empty. Only plausible for extreme social rituals (e.g., "how are you?").  
  3. **Strict localism in personal disclosure**: Applying the hearer’s norm to *self-disclosure* (e.g., "I’m sad" must be indirect if the hearer’s culture prefers that). *Why unexplored?* Self-expression norms are typically speaker-centric; forcing accommodation here feels like self-censorship, not pragmatics.  

  ---

  ### Where It Stalls  
  *(~120 words)*  
  1. **Welfare-balancing vs. relationship-first**: Both prioritize outcomes over truth, and the tree can’t isolate whether the driver is relational harmony or holistic welfare without reinventing "purpose" (Q9).  
  2. **Bluntness as integrity vs. anti-paternalism**: Both endorse directness, but the tree can’t distinguish "integrity" (defending speech’s long-term value) from "anti-paternalism" (defending the speaker’s right to impose norms) without rehashing Q10’s norm-governance question.  
  3. **Care-first vs. misleading=lying**: Both condemn evasion, but the tree merges them at Q5 (misleading=lying) vs. Q8 (softening devalues speech). They stall if the case avoids long-term effects (e.g., one-off white lies).  

  ---  
  **Design note**: This tree forces specificity (e.g., separating self-disclosure early) and avoids theoretical labels. Use it by applying cases at each branch — e.g., "Would you soften a referee report?" triggers Q7 (third-party harm).
