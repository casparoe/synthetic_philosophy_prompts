answer: |-
  ## The Standing Condition in Moral Blame: Genuine, Gating, and Grounded in Fairness

  There is a genuine standing condition on moral blame, and when a blamer lacks it, their act of blaming remains a blame-act but is morally defective because it constitutes an unfair exercise of normative power, undermining the reciprocity essential to holding others accountable within a shared moral community.

  The central question is whether the moral authority to blame another person for violating a norm requires the blamer themselves to meet certain conditions beyond merely correctly identifying the violation and its wrongness – conditions we might call "standing". The five cases involving the departmental teaching rota vividly illustrate potential standing failures. To determine if standing is genuine, we must examine whether the blamer's own relation to the norm or the violation fundamentally compromises the legitimacy of their blame, distinct from questions of whether the target *deserves* blame (warrant) or whether blaming is *appropriate* in the circumstances (fittingness). The expressive view – that the defect is merely conversational, arising because hypocritical blame falsely implies the blamer is compliant – offers an initially attractive analysis, particularly for Case 1 (The Confessing Hypocrite). If the defect were purely expressive, the hypocrite's explicit confession ("I shirked too") should repair the standing failure by removing the false implication. Yet, intuitively, the blame *still* seems defective, perhaps even more jarringly so. The confession highlights the unfairness: she demands accountability from another while openly admitting her own identical failure went unaddressed. This suggests the core defect is not merely about conveying false information about oneself, but about the *unfairness of the demand* itself. The blamer, by virtue of their own violation, lacks the moral position to hold *this* person accountable for *this* norm in *this* way. They disrupt the fundamental reciprocity required for moral address – the implicit understanding that we hold each other to standards we ourselves accept and are willing to be held to. This unfairness persists even when the hypocrisy is confessed; the confession might mitigate the *additional* wrong of deception, but not the core unfairness of the blame-act.

  This unfairness analysis provides a coherent verdict across the cases:
  1.  **Confessing Hypocrite (Shirked & Blames, Confesses):** **No standing.** The confession removes deception but highlights the unfairness: she demands the target accept accountability she evaded for the same wrong. Her blame imposes a burden she refused to bear, violating reciprocity. The defect is not cured.
  2.  **Unindicted Beneficiary (Never Shirks but Benefits from Unjust System, Blames, Voted Against Reform):** **Partial standing.** While personally compliant, her complicity in the unjust system generating the violations undermines her authority to blame *these specific violations*. She benefits from the unfairness causing the wrongs and actively sustains it. Blaming others for predictable outcomes of a system she defends is unfair. Her standing is compromised by systemic complicity, not personal hypocrisy.
  3.  **Selective Enforcer (Does Share, Blames One Shirker, Ignores Ally's Identical Shirking):** **No standing.** Selective enforcement corrupts the norm itself. Blame ceases to be an impartial demand for compliance and becomes a tool of favouritism or power. The unfairness lies in applying the norm arbitrarily, denying the target the equal treatment owed under the shared norm. This undermines the norm's authority and makes the blame an exercise in partiality, not accountability.
  4.  **Inducer (Head of Section, Misleads Colleague, then Blames):** **No standing.** This is active entrapment. The blamer manipulates the situation to induce the violation and then holds the target accountable. This is a profound abuse of power and a violation of the duty of fair play fundamental to holding others accountable. The blame is fundamentally unfair because the blamer bears significant responsibility for the very act they condemn.
  5.  **Proxy (Shirked, Blames as Elected Union Spokesperson on Behalf of Members):** **Standing.** The key here is role legitimacy and dissociation. She blames *in her capacity* as representative, voicing the collective judgment of the membership (who presumably have standing, assuming they meet the relevant conditions). Her *personal* failing is irrelevant to the legitimacy of *this act* of *representative* blame. The blame-act belongs to the collective; she is the conduit. There is no unfairness in the *act of blaming* itself, as it stems from the group's authority. (She may owe personal apologies for her own shirking, but that is separate).

  Regarding the structural nature of the standing failure: it functions as a **defect gate**. Lacking standing does not mean no blame-act has occurred – the words are spoken, the judgment is expressed, and it is directed at a genuine wrong. However, the blame-act is *morally defective*. It is invalid *as a legitimate moral demand* because it violates the conditions of fairness inherent in the practice of mutual accountability. It is not merely that the blamer owes something extra (an independent wrong), though they often do (like apologising for their own violation). The defect is intrinsic to the blaming act itself: it constitutes an unfair exercise of the normative power to hold another accountable. It is not scalar – the defect is categorical, making the blame illegitimate, not merely weakened. Nor does standing failure uniformly render blame utterly void ("void gate"), as the act retains its character *as blame* and might still correctly identify a wrong; its defect is moral illegitimacy, not existential nullity. The "defect gate" view best captures this: the blame is launched but crippled by its inherent unfairness.

  The symmetry test reveals something crucial. Applied to **praise**, standing failures seem less significant or different in kind. Praising someone for compliance while having violated the norm oneself might be hypocritical or grating, but it doesn't inherently undermine the praise's validity *for the recipient*. The compliant colleague *did* do well; the praiser’s hypocrisy doesn’t negate that. Crucially, praise doesn't demand anything *from* the recipient in the way blame demands accountability. Similarly, **advice** might be undermined by hypocrisy ("do as I say, not as I do"), but the advice itself could still be sound. The asymmetry is starkest with **demands for apology**. Demanding an apology for a wrong one has committed oneself seems intuitively defective in the *same way* as hypocritical blame – it involves an unfair exercise of normative power, demanding a form of submission or acknowledgment one has evaded. The beneficiary congratulating herself on clean hands while sustaining an unjust system parallels Case 2 – it exhibits a similar complicity and lack of humility, rendering the self-congratulation morally defective or hollow. This asymmetry between blame/demands and praise/advice highlights that the standing condition is tightly bound to acts that impose a demand or cost on the target in the name of a shared norm – acts where fairness in the blamer's own position is paramount.

  Within the specialist literature, several points are widely settled: that hypocritical blame commonly *feels* illegitimate; that this intuition points to *something* significant beyond mere warrant or fittingness; that purely expressive/conversational accounts struggle with cases like the confessing hypocrite; that standing is distinct from whether the target deserves blame; and that "mere tu quoque" dismissals are indeed too quick, as they fail to engage with the substantive fairness concerns. Major controversies include: whether standing is a fundamental condition or derivative (e.g., from duties of fairness or the nature of moral address); the exact mechanism by which standing failure invalidates blame (unfairness? lack of moral authority? undermining the norm?); whether standing is primarily about the blamer's past actions or their current commitment/integrity; and crucially, how robust standing conditions are in representative or institutional roles (like the Proxy). The status of the unindicted beneficiary (Case 2) and the exact structure of the defect (void vs. defect gate) are also live debates.

  My verdict – standing as a genuine, fundamental defect gate rooted in unfairness – represents a **substantial minority** view. While the intuition that hypocrisy undermines blame is near-universal, and the defect gate structure has influential proponents, grounding standing primarily in unfairness as a fundamental condition, rather than seeing it as strictly derivative of duties of sincerity or integrity, is less dominant. The most significant potential defeater for my view would be a compelling demonstration that blame can retain its full moral legitimacy *even when* the blamer is actively complicit in identical or norm-undermining behaviour, provided they sincerely acknowledge their own failing *at the moment of blaming*. If such "redeemed hypocrisy" were shown to be non-defective, it would undermine the claim that unfairness is intrinsic and categorical. The familiar dismissal of standing complaints as *tu quoque* fallacies is too quick because it mischaracterises the objection. It’s not simply "you did it too, therefore I’m innocent" (which *would* be a fallacy). The objection is: "Your own violation/complicity means *you* lack the moral authority to *hold me accountable* in this way; your act of blaming is itself unfair." This targets the legitimacy of the blamer's action, not the warrant of the blame itself. My confidence in this verdict is **0.7**, reflecting the strength of the core intuition and the cases, but acknowledging the genuine philosophical controversy surrounding its precise foundation and the ongoing challenge from sophisticated expressive or derivative accounts.

