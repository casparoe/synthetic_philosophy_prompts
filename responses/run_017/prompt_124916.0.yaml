prompt: |-
  You are a professional philosopher with research-level command of philosophy of mind, metaphilosophy, and the philosophy of cognitive science. I would like you to think carefully and slowly about the question below, and to begin with an explicit brainstorming pass: generate five to eight candidate diagnoses drawn from different areas (philosophy of mind, metaphilosophy, philosophy of language, philosophy of science, social epistemology), including several that you will then reject, and say plainly why each is rejected. Please distinguish throughout between established terminology, your own proposal, and what is contested in the literature. I am not asking for a label; I am asking for the carving. If the honest answer is that the phenomenon has no established name, say so and give me a name, a definition, and the boundary cases.

  Here is the pattern I keep running into. I work in human-computer interaction on assistive cognitive technology, which is why I read philosophy of mind at all, and the pattern is sharpest for me in the debate about whether a person's mind can literally extend beyond the skull — the literature that grew out of the much-discussed case of a man with a memory impairment who carries a notebook whose contents are as reliably and automatically available to him as a neurotypical person's biological memories are to her.

  The first part of the pattern is familiar. A proponent says the notebook is literally where some of his beliefs are stored; the boundary of the cognitive system runs out into the world. A critic replies that at most he has shown causal dependence, and that causing is not constituting. The proponent replies that the critic is helping himself to undefended criteria for what counts as cognition, that nothing in contemporary cognitive science respects the skull, and that where the boundary falls is an empirical and theoretical question rather than one to be settled by intuitions about what looks mental. The critic replies that in that case the original claim was never the empirical discovery it was advertised as, but an invitation to redraw a line and call it a finding. The proponent replies that there are good explanatory, practical and ethical reasons to redraw it there.

  What interests me is the next bit, which I have not seen discussed. Take a dispute that runs in the opposite direction. Someone argues that a choice made under the influence of a brain tumour, a deep-brain stimulator, a hormone, or an automated subpersonal habit system is not really the agent's: the mechanism sits inside the skull, but it is not part of her. Now the theorists who, twenty pages earlier, insisted that the skull has no privileged status and that the location of the boundary is a matter for empirical theory often say something different in spirit — that the question is not straightforwardly descriptive, that it depends on what we want our notion of a person or an agent to do for us, on our practices of holding people responsible, on what we care about. And the theorists who in the first dispute insisted that boundary questions are interest-relative and pragmatic now say the reverse: you cannot excise a mechanism from the agent merely because you dislike what it does, and whether it is part of her is a factual matter about how the system is organized. The same participants seem to treat Is X part of the system? as an empirical question when the answer they favour expands the boundary, and as a normative or conceptual question when the answer they favour contracts it. I do not think anyone is being dishonest; each side appears to find the other's shift transparent and its own principled.

  A second feature: the standard dissolution does not work on these disputes. When I have tried the obvious move — point out that the parties are answering different questions, one descriptive and one normative, and that they should disambiguate and go home — both parties say, in effect, that they win on both questions: the descriptive question resolves in their favour and so, independently, does the normative one. Pointing out the shift does not end the argument, which is what I would have expected if this were merely a verbal dispute. That is why the nearest thing I have found, the literature on verbal disputes, seems to fit only imperfectly: it accounts for the shift but not for its direction, and not for the dispute's immunity to being dissolved once the shift is pointed out. I have seen structurally similar arguments about whether a group, a firm, or a machine learning system can be said to know or believe something, and about whether a contested psychiatric category picks out a real condition or a useful fiction.

  So: does this have an established name, or is it discussed in a literature I have not found? If not, what are the nearest concepts, how does each differ from what I have described, and which fits best? My colleague's deflationary explanation is that I am pattern-matching noise: boundary-expanding claims are surprising and therefore attract a demand for evidence, while boundary-contracting claims are usually made in contexts with high practical stakes and therefore attract a demand for justification of consequences — which would make this a burden-of-proof artifact rather than a register switch. Tell me whether that is right, and how one would distinguish the two empirically. Finally, tell me what a dispute with this structure could come to: whether settling it would be a discovery, a decision, or something else, and what would count as progress rather than as another turn of the same cycle. Please also flag anywhere you think my description is confused or my example misdescribed.
reasoning: |-
  Okay, the user is describing a fascinating pattern they've observed in philosophical debates, particularly in the context of extended cognition and agency attribution. They've noticed a consistent asymmetry: when expanding boundaries (like accepting Otto's notebook as part of cognition), proponents treat it as empirical, while opponents treat it as conceptual. But when contracting boundaries (like excluding a brain tumor's influence from agency), the positions flip - expansionists suddenly appeal to normative concerns while restrictionists demand empirical criteria. 

  Hmm, the user is clearly deeply familiar with these debates - they're citing specific literature (Clark & Chalmers' extended mind case) and recognizing nuanced argument patterns. Their work in assistive cognitive tech gives them practical stakes here. What they're really probing is whether this flip-flopping reveals something fundamental about philosophical methodology.

  First I need to brainstorm candidate explanations across domains. Starting with philosophy of mind: maybe it's about different conceptions of constitution? But no - that doesn't explain the asymmetry. How about cognitive science's pluralism? Also incomplete. Metaphilosophy offers more promise - perhaps Carnapian tolerance or Putnam's conceptual relativity? But those usually don't show this directional pattern. 

  Ah! Social epistemology might help - the idea that epistemic authority shifts depending on whether we're including or excluding. But that feels vague. The most promising is Machery's cognitive pluralism - the thought that we have multiple cognitive systems for boundary judgments that get triggered differently. Still, none perfectly fit.

  The user's colleague suggests a deflationary view - that it's just burden-of-proof shifting. That's plausible but too simple: if it were just that, pointing out the asymmetry should dissolve disputes, but the user says it doesn't. That's crucial - the dispute persists even after clarification, which suggests it's not merely verbal.

  What's really interesting is how the user notices this pattern replicates in other domains: corporate agency, psychiatric categories. That suggests something deep about how we negotiate "system" boundaries. I'm struck by how they describe both sides feeling principled - no bad faith, just fundamentally different intuitions about what counts as "part of" in different contexts.

  For naming... nothing quite fits. "Boundary negotiation asymmetry"? "Inclusion/exclusion duality"? The directional component is key. Maybe "constitutive flip-flopping" but that's clunky. 

  On resolution - this won't yield to discovery or decision alone. It needs what I'd call "explanatory negotiation": jointly constructing why certain boundaries serve certain purposes. The progress would be recognizing when we're boundary-drawing versus boundary-discovering - and that both are legitimate but distinct activities.

  The user's description seems spot-on. Their insight about dispute persistence despite clarification is particularly acute. This feels like they've put a finger on something important that philosophers haven't adequately named or theorized.
answer: |-
  Your description is exceptionally precise and reveals a profound methodological pattern in boundary disputes. I agree this asymmetry is underexplored and requires multi-level analysis. Let's carve it systematically:

  ### Brainstorming Candidate Diagnoses
  1. **Constitutive vs. Causal Criteria (Philosophy of Mind)**  
     *Diagnosis*: Opponents inconsistently apply the mark of the cognitive.  
     *Rejection*: Doesn't explain why *direction* of boundary change determines whether constitutive/causal distinction is invoked. Both sides claim constitutive status in their preferred cases.

  2. **Explanatory Pragmatism (Philosophy of Science)**  
     *Diagnosis*: Boundaries shift based on explanatory goals (e.g., predicting behavior vs. assigning responsibility).  
     *Rejection*: Fails to explain why parties deny pragmatic considerations in their "favored" direction and claim ontological objectivity.

  3. **Conceptual Polysemy (Philosophy of Language)**  
     *Diagnosis*: "Cognitive system" and "agent" have multiple legitimate senses.  
     *Rejection*: Doesn't account for immunity to dissolution – parties insist *their* sense applies universally to both descriptive/normative questions.

  4. **Motivated Reasoning (Social Epistemology)**  
     *Diagnosis*: Ideological goals drive boundary placement (e.g., expansionists favor inclusivity; restrictionists favor accountability).  
     *Rejection*: Overly cynical; your observation that shifts feel "principled" suggests deeper cognitive mechanisms.

  5. **Cognitive Pluralism (Metaphilosophy)**  
     *Diagnosis*: We possess distinct cognitive systems for tracking mechanical vs. agential boundaries (Machery 2009).  
     *Rejection*: Predicts stable individual differences, not context-dependent flip-flopping within individuals.

  6. **Burden-Shifting Artifact (Your Colleague's View)**  
     *Diagnosis*: Expansion claims trigger empirical scrutiny; contraction claims trigger normative scrutiny.  
     *Rejection*: Explains initial framing but not dispute persistence after disambiguation – both sides claim victory on *both* fronts.

  7. **Teleological Boundary-Setting**  
     *My Proposal*: Boundary judgments are inherently tethered to implicit purposes ("what is this system *for*?"). Expansion cases emphasize functional success; contraction cases emphasize moral ownership. The flip occurs because purpose activates different criteria.

  ### Established Name & Nearest Concepts
  No established term captures this *directional asymmetry*. Nearest concepts:
  - **Chisholm's Intentionality Criterion**: Distinguishes mental/non-mental but doesn't address boundary plasticity.
  - **Carnap's Framework Relativity**: Explains choice of frameworks but not asymmetrical commitment to objectivity.
  - **Putnam's Conceptual Relativity**: Similar limitations; parties deny relativity in their preferred cases.
  - **Verbal Disputes (Chalmers 2011)**: Fits poorly because disputes persist post-disambiguation and have practical traction.

  **Proposed Name**: **Constitutive Asymmetry**  
  *Definition*: The systematic tendency to treat boundary-expanding inclusions as empirically discovered facts and boundary-excluding contractions as normatively grounded conventions, while denying this asymmetry applies to one's own position.  
  *Boundary Cases*:  
  - If both parties agree the dispute is purely terminological → Not constitutive asymmetry.  
  - If one party consistently treats all boundaries as empirical → Not asymmetry (e.g., radical neuro-reductionists).  

  ### Evaluating Your Colleague's View
  Your colleague identifies a real heuristic but underdetermines the phenomenon:  
  - **Empirical Test**: Analyze rhetoric in 100 boundary disputes. Predict:  
    - Expansion arguments will cite scientific evidence 3x more (e.g., "fMRI shows coupling").  
    - Contraction arguments will use normative terms 4x more (e.g., "can't hold responsible").  
    - *But* constitutive asymmetry is confirmed if, when challenged, >70% of expansionists *also* claim their view better supports moral responsibility, and restrictionists claim stronger empirical support.  
  - **Verdict**: Burden-shifting is a surface symptom; the core is **purpose-driven ontology**.

  ### What Settlement Looks Like
  This isn't resolved by discovery *or* decision. It requires:  
  1. **Acknowledging Teleological Tethering**: Explicitly stating what purpose the boundary serves (e.g., "We are defining cognitive systems for disability accommodations").  
  2. **Mapping Purpose to Criteria**: If the purpose is predictive accuracy, empirical coupling may dominate; if culpability, agential integration matters more.  
  3. **Accepting Multi-Perspectivalism**: Some boundaries are objective (a tumor is biologically distinct), others are interest-relative (whether it "disqualifies" agency).  

  **Progress** occurs when:  
  - Parties stop claiming unilateral victory on both descriptive/normative fronts.  
  - They generate purpose-specific taxonomies (e.g., "legal personhood" vs. "predictive cognitive systems").  
  - Your field develops *applied standards*: E.g., "For assistive tech regulation, extended cognition requires X reliability; for criminal responsibility, agential unity requires Y neural integration."  

  ### Critique of Your Description
  Your analysis is perceptive, but one nuance needs tightening:  
  - **Misstep**: Calling the notebook case "empirical discovery" oversimplifies. Clark & Chalmers *combine* empirical coupling with functionalist philosophy. The asymmetry arises when functionalism is foregrounded (expansion) or backgrounded (contraction).  
  - **Strength**: Spotting immunity to standard dissolution is key. This reveals the dispute is about *authority* – which framework governs boundary-setting.

  This pattern exposes philosophy's unspoken rule: **We expand boundaries naturalistically but contract them morally, while pretending our tools are neutral.** Naming "constitutive asymmetry" is the first step toward wielding these tools self-consciously.
