answer: |-
  ## Dedicatory Address: Halloran College 175th Anniversary Exhibition

  President Thornton, Trustees, esteemed colleagues, alumni, students, friends, and neighbours,

  We gather today in the heart of our campus, the library, to dedicate a new space: *Becoming Ourselves*, an exhibition marking Halloran College’s 175th anniversary. Walking through these rooms, we encounter objects, images, and words that trace a long path – *our* path, we instinctively say. That instinct, the pull of the "we," is powerful, especially on an occasion like this. It binds us to those who sat in these classrooms decades, even centuries, ago. But history, as we historians are perhaps annoyingly fond of reminding everyone, complicates that instinct. It asks us to look carefully at who "we" were then, and who "we" are now. This exhibition invites us on that very journey of looking – not just to celebrate, though there is much to celebrate – but to understand.

  Halloran College began in 1850. The founding charter is here, or a copy of it. Its language is clear, earnest, and of its time. Local ministers and merchants, pillars of a young Midwestern community, envisioned an institution to train schoolteachers. They believed deeply in the importance of education, specifically for women, but within boundaries they saw as divinely ordained and socially essential. The charter explicitly states concerns that advanced schooling could unfitted women for the domestic and religious duties they believed were their rightful, providential calling. Halloran Seminary – as it was first known – was conceived as a safe compromise: a place to produce pious, capable, and ultimately marriageable teachers. These were not cynical men; they were building what they thought was necessary and good.

  Standing here today, in a coeducational college whose mission statement champions intellectual independence and civic leadership for all, it is impossible to claim that *this* institution is the pure, uncomplicated fulfilment of *that* founding vision. In crucial respects, the path we now walk repudiates the narrowness of their initial compass. We cannot pretend the founders would instantly recognize, let alone endorse, the vibrant, questioning, diverse community we cherish. To force that connection does violence to both their reality and ours. It erases the profound struggles and choices that truly brought us here.

  Neither, however, can we simply dismiss them as hypocrites or relics. Whatever their limitations, they built something tangible. They laid foundations – literal bricks and mortar, but also an institutional identity, however constrained. This place, Halloran College, exists in an unbroken line from that seminary. The students they taught became teachers; those teachers influenced generations. The institution they created, however imperfectly conceived by our lights, possessed a gravity that pulled others towards it, shaping opportunities and lives in ways they could never have fully predicted. The line of cause and effect runs back to them, even as the purpose of the journey has fundamentally changed. They are our ancestors in this institutional story, not our prophets.

  This tension – this evolving "we" – becomes starkly visible at another point in our exhibition: the decision in 1949 to admit men. The display speaks of "opening our doors," suggesting a widening of principle, a step towards the inclusive ideal we claim today. And the outcome *was* profoundly positive, a step towards the college we now value. But the deliberations, the *why* behind that vote, tell a more complex, more human story.

  The primary catalyst was stark necessity. An actuarial report laid bare a harsh truth: as a women's college, Halloran faced financial collapse. The president who championed the change did so largely based on enrolment projections and financial survival. Privately, he expressed concerns that coeducation might even lower academic standards. The alumnae association, fiercely loyal to the college’s identity, opposed the move bitterly. The strongest external pressure came from regional accreditors and a couple of significant local employers needing a broader talent pool. Principle, as we understand it now – the inherent rightness of equal access – was not the loudest voice in that room.

  Yet, here we stand, in a coeducational Halloran, believing this *is* fundamentally right. How do we honour that change? We honour it by acknowledging the messy reality: that a decision driven significantly by financial survival, accreditor pressure, and economic pragmatism – motives that feel narrower and more self-interested than the noble principle we now attach to it – nonetheless yielded a result we genuinely cherish. We honour it by recognizing that institutions, like people, often stumble towards better versions of themselves. The value we assign to coeducation today isn't diminished by the complicated path that led there; if anything, understanding that path makes the achievement more remarkable. It wasn't destiny; it was a difficult choice made under pressure that opened unforeseen possibilities. It demonstrates that institutions can grow beyond the immediate intentions of those who guide them at any given moment. The "we" of 1949 made a decision for their reasons; the "we" of today inherits and transforms that legacy into something new.

  This brings me to a phrase we might see around us, perhaps even on a plaque near the entrance: the idea that Halloran has "always stood on the right side of history." It’s a comforting phrase, isn’t it? It suggests a clear trajectory, a moral compass perpetually pointing true north, with history itself as the final, approving judge. But history isn’t a cosmic courtroom with a known verdict. It’s a vast, unfolding story of human effort, contingency, conflict, and consequence, most of it shrouded in the fog of the present moment for those living it.

  The founders in 1850 believed fervently they were on the "right side" – building piety, order, and useful education within their worldview. The trustees in 1949 believed they were making the necessary, perhaps even the "right," choice to save their college, even amidst internal strife and uncertain outcomes. To claim Halloran has *always* stood on some pre-ordained "right side" risks turning history into a selective fable. It judges the past only by the standards of the present that emerged from it, flattening the genuine dilemmas, the competing goods, and the sheer uncertainty that shaped every critical juncture.

  Instead of claiming the "right side," perhaps we can celebrate something more resilient, more honest: the capacity for *reassessment*. Halloran’s story, like any long human endeavour, isn’t one of perfect foresight or unwavering virtue. It’s a story of an institution that, at critical moments, *changed its mind*. It’s a story of looking at the world as it is, looking at its own founding principles as they were understood, and sometimes finding them insufficient for the challenges and opportunities of a new time. It’s a story of the institutional "we" being redefined – not through a smooth, inevitable progression, but through argument, necessity, courage, and the slow accretion of new values embraced by new generations of students, faculty, and leaders. This isn't about being vindicated by history; it's about engaging with it, learning from it, and sometimes consciously choosing a different path forward.

  So, why have this exhibition? Why walk through *Becoming Ourselves*, knowing that its framing, like any framing of a complex past, will inevitably simplify, perhaps even stumble in places? Precisely because it provides a space – a physical, tangible space – to confront this living, breathing, complicated story. It’s not a flawless mirror, but it *is* a catalyst. It gathers fragments of our past – the lofty charter, the photos of earnest students from decades past, the records of difficult debates – and asks us to consider them together. It allows us to see the distance travelled, not as a pre-ordained march, but as a journey marked by both deliberate choices and unforeseen consequences.

  The value isn’t just in celebrating the triumphs we now recognize, but in seeing the *process*. It’s in seeing how limited beginnings can, through the efforts, arguments, and adaptations of countless individuals across generations, become something broader, more inclusive, and more ambitious. It’s in recognizing that the founders’ "dream," as a panel here suggests, wasn’t "finally kept" in some straightforward way, but rather *transcended*. The institution they built proved sturdy enough to hold the weight of futures they could not imagine. That is a different kind of tribute, one grounded not in false continuity, but in the resilience of a community to learn and grow.

  A flawed commemoration is still worth walking through because it starts the conversation. It gives us common ground, literally, to stand on and look back. It reminds us that the college wasn't forged in the abstract, but through the concrete actions and decisions of real people facing real constraints and aspirations. We see their handwriting, their faces, their buildings; we are reminded that history isn't just ideas, it's lived experience. This exhibition, even with its inevitable simplifications, invites us to engage with that tangible past, to question its narratives, and to reflect on what threads we choose to carry forward into *our* chapter of Halloran’s story. It asks us to consider: What does "Becoming Ourselves" mean *now*? What foundations are *we* laying for a future that will inevitably judge us by standards we cannot fully foresee?

  So, let us dedicate this space not as a shrine to a perfect, preordained past, but as a forum for reflection. A place where alumni can reconnect with cherished memories, where donors can see the tangible results of their belief in this community’s potential, where students can discover the roots from which their present experience grows, and where my historian colleagues – whose critical eyes I value immensely – can find ample material for the complex, vital work of understanding how institutions and identities truly evolve.

  Let us walk through *Becoming Ourselves* with clear eyes and open minds. Let us see the founders not as prophets of our present, but as the initiators of a chain of consequences we now inherit. Let us see the 1949 decision not as pure principle, but as a pragmatic step that opened a door to a better future we were able to build upon. Let us see Halloran College not as an institution perpetually on the "right side," but as one capable of learning, adapting, and striving – sometimes imperfectly, often courageously – to embody the values we hold dear *today*.

  The story continues. Our chapter is being written. Let this exhibition remind us of the long road behind, not to dictate the path ahead, but to inspire us to build upon it with the same mixture of pragmatism, principle, and hope that brought us this far. Thank you.

  It is now my honour, and my genuine pleasure, to declare the *Becoming Ourselves* exhibition officially open. Please, step inside, explore, reflect, and continue this vital conversation.
