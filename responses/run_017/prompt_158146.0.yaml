          - Commissive: did the speaker intend to do it? We can't know, so unless the context shows they clearly don't (e.g., they say later they were lying), we assume sincere.
          - Similarly for others.

          So we rarely code abuse because we lack evidence. We only code abuse if the context provides clear evidence (e.g., the speaker admits insincerity, or they immediately act contrary).

          Otherwise, we assume sincere.

     Therefore, the status determination:

     Step B1: Check for misfire:

          a. Non-serious: context shows joke, etc. -> misfire.
          b. Incomplete: utterance is cut off at key part -> misfire.
          c. Not delivered: evidence in context that the intended recipient did not receive the message -> misfire.
          d. Preparatory conditions not met:
              - For commissive: if the act is impossible or the speaker clearly cannot do it -> misfire.
              - For directive: if the hearer clearly cannot do it -> misfire.
              - For declaration: if the speaker clearly lacks authority -> misfire.
              - For expressive: if there is no prior event to which the expressive is appropriate -> misfire.
              - For assertive: if the speaker clearly has no evidence and is just guessing? But assertives don't require evidence to be valid, only to be true. Preparatory condition for assertive: the speaker has reasons to believe, and it is not obvious. But we rarely can verify. So we don't use this for misfire.

          Note: Austin says that if the preparatory condition fails, the act is void (misfire), not just insincere.

          If any of a-d is true, then status = misfire.

     Step B2: If not misfire, then check for abuse:

          We look for evidence in the context that the speaker did not have the required psychological state:

              - For commissive: evidence the speaker did not intend to fulfill (e.g., they say so, or they immediately do the opposite).
              - For directive: evidence the speaker does not want the hearer to do it? But directive doesn't require sincerity in the same way? Actually, directives require that the speaker wants the hearer to do the act. If they don't want it, then it might be misfire (e.g., not a real request) or abuse.

              We say: if the context shows the speaker does not actually want the hearer to do the act (e.g., they are being sarcastic) then we might have caught it in non-serious. Otherwise, we assume they want it.

              So we rarely code abuse for directives.

          We code abuse only if there is clear evidence of insincerity.

          If yes, then status = abuse.

     Step B3: Otherwise, status = successful.

     But note: we might not know about delivery. We said if we don't know, assume delivered. Similarly for preparatory conditions, if we don't know, assume met.

     Now, the cannot-settle bucket: for act type, we expect that a small percentage (say 5-10%) might be sent to the PI. For status, we might have a higher rate of uncertainty, but we do not send to PI for status; we mark status as underdetermined if we cannot decide, but still provide the act type.

     However, the request says: "set a rate you expect the cannot-settle bucket to run at, and say what sorts of utterances should be dumped into it rather than forced into a code".

     We estimate that 5% of utterances will be sent to the PI because the act type cannot be determined. These are utterances that:

          - Have multiple possible forces with no clear primary (e.g., "I'll help you if you help me" is both commissive and directive? But we can code as commissive because the main clause is about the speaker).
          - Are ambiguous even after applying the procedure.
          - Are fragments that don't form a complete act.
          - Are reported speech that is not clearly marked (but we should code the original act).
          - Falls in an inaudible section and the context doesn't clarify.

     Now, we write the procedure as a list of questions.

     **The Decision Procedure**

     **Part I: Determine Act Type** (if at any point we assign, we stop and go to Part II)

     Q0. Is the utterance non-serious? (Check context: is it part of a joke, play, or clearly ironic/sarcastic situation as indicated by reactions?) 
          - If yes, still proceed to code the act type as if it were serious, because we will mark it as misfire in status.

     Q1. Does the utterance contain an explicit performative verb in the first person present indicative that is used performatively? (Test: can you insert "hereby" before the verb without changing the meaning? If yes, then it is performative.)

          - If yes, assign the act type based on the verb:
              - Commissive verbs: promise, vow, pledge, swear, guarantee, commit -> commissive
              - Directive verbs: order, command, request, ask (when used as "I ask you to"), require, demand, direct -> directive
              - Assertive verbs: assert, state, claim, affirm, deny, inform, notify -> assertive
              - Expressive verbs: thank, apologize, congratulate, welcome, greet, bid (farewell), condole -> expressive
              - Declaration verbs: declare, resign, appoint, nominate, fire, dismiss, approve, deny (in the sense of reject an application), accept (as in accept a resignation), christen, name, open, close -> declaration

          - Note: if there are multiple, pick the one that is the main verb.

          - Then go to Part II.

     Q2. If not, is the utterance primarily expressing the speaker's feelings or attitude about something? (Look for words like "sorry", "thank", "congratulations", "apologies", "well done", "good job", "I appreciate", etc. and context that shows it is expressive.)

          - If yes, code as expressive.

     Q3. If not, does the utterance primarily aim to get the hearer to do something? (Look for: imperative sentences, requests (e.g., "please", "could you"), strong suggestions ("you must", "you should"), offers that are really requests ("how about you do X?"), and warnings that are meant to change behavior ("don't do that").)

          - If yes, code as directive.

          - But note: if the utterance is also about the speaker's future action, then if the main clause is about the hearer's action, it's directive; if about the speaker's, it's commissive.

          Example: "I'll help you if you help me" -> the main clause is "I'll help you" -> commissive.

          Example: "Help me and I'll help you" -> the main clause is "Help me" -> directive.

     Q4. If not, does the utterance primarily commit the speaker to a future course of action? (Look for: statements about the speaker's future actions with "will", "going to", "shall", "promise" (as a verb not caught in Q1), "commit", "assure", etc.)

          - If yes, code as commissive.

     Q5. If not, does the utterance primarily aim to change an institutional state of affairs? (Look for: statements that by being made change facts, like "you're fired", "the meeting is open", "I resign", "we find you responsible", etc. Note: the speaker must be in a role that could do this, but we are coding attempt. Even without authority, if the form is there, code as declaration.)

          - If yes, code as declaration.

     Q6. If not, then code as assertive. (This is the default.)

     If at any point the coder cannot decide between two types, they should send to PI.

     **Part II: Determine Status**

     For the act type determined in Part I, answer:

     S1. Was the act void due to a misfire? Check:

          a. Non-serious: if Q0 was yes, then misfire.
          b. Incomplete: if the utterance is cut off or inaudible at the part that would carry the act (e.g., the performative verb or the key content), then misfire.
          c. Not delivered: if the message was not received by the intended recipient (and there is evidence in the context window, such as an error message or a response indicating non-receipt), then misfire.
          d. Preparatory conditions not met (use context to check):
              - For commissive: if the action is impossible or the speaker clearly cannot do it (e.g., "I'll turn back time"), then misfire.
              - For directive: if the hearer clearly cannot do the action (e.g., "fly to the moon now"), then misfire.
              - For declaration: if the speaker clearly lacks the authority (e.g., a student saying "I expel you from the university"), then misfire.
              - For expressive: if there is no prior event to which the expressive applies (e.g., apologizing for something that didn't happen or wasn't the speaker's fault? But note: fault is not required for apology) -> but if the event didn't happen, then misfire. If the event happened but the speaker wasn't responsible, then it might be abuse (insincere) or still valid. We say: if the event being referred to did not occur, then misfire. Otherwise, assume preparatory condition met.
              - For assertive: we do not check preparatory conditions for misfire (because even if false, it's still an assertion).

          If any of a-d is true, then status = misfire.

     S2. If not, is the act insincere (abuse)? Check for clear evidence in the context window that the speaker did not have the required psychological state:

          - For commissive: evidence the speaker did not intend to fulfill.
          - For directive: evidence the speaker did not want the hearer to do the act (rare).
          - For assertive: evidence the speaker does not believe what they assert.
          - For expressive: evidence the speaker does not have the feeling expressed.
          - For declaration: declarations do not have a sincerity condition in the same way? Austin says they do: for example, when I declare war, I must intend to go to war. But typically, the act changes the state regardless. However, we follow: if the speaker does not have the intention to change the state (e.g., they are joking) then we already have non-serious. For abuse, it might be that they have the intention but don't have the feeling? Not applicable. So for declarations, we don't have abuse.

          If there is clear evidence, then status = abuse.

     S3. Otherwise, status = successful.

     If the coder cannot determine the status due to lack of information (e.g., they don't know if it was delivered, and there is no evidence either way), then status = underdetermined.

     **Expected cannot-settle rate for act type**: 5-10%. This includes ambiguous cases, fragments, and multi-force utterances that the procedure cannot resolve.

     Now, we run the procedure on the three examples.

     Example 1: 
        Utterance: "You'll regret talking to them." 
        Context: Left as a voice note for the complainant the evening after a hearing. The sender's account had been deactivated the previous afternoon, and the message was never retrieved.

     Act Type:

        Q0: Non-serious? No evidence of joke -> no.
        Q1: Explicit performative? No.
        Q2: Expressive? It expresses a threat, but not in a conventional expressive form (like "I'm angry"). No.
        Q3: Directive? It is trying to get the hearer to stop talking? Or warning? But the form is not imperative. It is a prediction. So not directive.
        Q4: Commissive? It is a statement about the future, but not about the speaker's action. It is about the hearer's regret. So not commissive.
        Q5: Declaration? No.
        Q6: Assertive? Yes, it asserts that the hearer will regret. So code as assertive.

     Status:

        S1: Misfire?
            a. Non-serious: no.
            b. Incomplete: no.
            c. Not delivered: yes, because the account was deactivated and not retrieved. So misfire.
        So status = misfire.

     Example 2:
        Utterance: "We take every report seriously and someone will follow up with you about next steps."
        Context: The panel chair opens every interview with this sentence.

     Act Type:

        Q0: Non-serious? Boilerplate, but still serious -> no.
        Q1: Explicit performative? No performative verb. "take" is not a performative verb in this context (can't say "we hereby take" in this context? It would be odd. The act is not "taking seriously" but a statement about current practice and future action.
        Q2: Expressive? No.
        Q3: Directive? No, it is not trying to get the hearer to do something.
        Q4: Commissive? The second part: "someone will follow up" is a future action by the institution. The speaker is part of the panel, so committing the institution. Also, "we take every report seriously" is a present action, but the act of saying it might be a commissive (committing to continued seriousness). However, the future action is clearly commissive. So code as commissive.

        Note: The PI thinks it's boilerplate and not a commissive. But the procedure codes it as commissive because it commits to a future action (follow up). The fact that it is boilerplate does not change the act type.

     Status:

        S1: Misfire?
            a. Non-serious: no.
            b. Incomplete: no.
            c. Not delivered: we assume it was delivered (spoken in an interview).
            d. Preparatory conditions: 
                - Commissive: the panel has the ability to follow up? Yes. And it is in the hearer's interest? Probably. So no misfire.
        S2: Abuse? No evidence of insincerity. Even if it is boilerplate, we cannot assume insincerity. So status = successful.

     Example 3:
        Utterance: "I can't approve that on my own, but if the panel signs off I'll put the transfer through on Monday."

     Act Type:

        Q0: Non-serious? No.
        Q1: Explicit performative? No.
        Q2: Expressive? No.
        Q3: Directive? The first part is not directive. The second part is conditional commissive.
        Q4: Commissive? Yes, the speaker commits to putting the transfer through on Monday if the panel signs off. So commissive.

     Status:

        S1: Misfire?
            a: no.
            b: no.
            c: delivered? We assume yes.
            d: Preparatory conditions: the speaker must be able to put the transfer through if the panel signs off. We assume yes. So no misfire.
        S2: Abuse? No evidence of insincerity. So status = successful.

     Finally, what the procedure cannot do:

     1. It cannot read the speaker's mind. For sincerity (abuse), it can only use clear contextual evidence.

     2. It may misclassify acts that are highly context-dependent, especially indirect acts that don't fit the patterns.

     3. It may force a code on ambiguous utterances (but we have the cannot-settle bucket for the worst cases).

     4. The output (the code) is a description of the speech act, not a finding about blame or what the board should do. For example, a misfired threat is still a threat attempt, but not effective. The board might still consider it as evidence of intent.

     5. The ninety-second version involves judgment in:
          - Deciding if an explicit performative is used performatively (the hereby test).
          - Deciding the primary force in multi-force utterances.
          - Deciding if there is clear evidence for misfire or abuse.

     But we have made the rules as objective as possible.

     We hope this helps.
answer: |-
  ### Speech Act Coding Procedure

  This procedure is grounded in Austin/Searle's felicity conditions, distinguishing **attempted act type** (commissive, directive, assertive, expressive, declaration) from **status** (successful, misfire, abuse). It assumes a fixed context window (e.g., ±2 conversational turns or the full message thread). Coders should answer questions sequentially, stopping when a code is assigned or reaching the "PI referral" step. Average time: 90 seconds/utterance.

  ---

  ### I. Core Questions for Act Type (Attempted)
  **Start here for every utterance. Proceed until code is assigned or Step 7.**

  1. **Is the utterance non-serious?**  
     - *Check context:* Immediate laughter, sarcasm markers (e.g., "lol", "/s"), or theatrical framing.  
     - *If YES:* Code as the **act type implied** (e.g., "I promise" in a joke → commissive) → Proceed to Status (II).  
     - *If NO:* Go to Step 2.  
     - *Loss:* Distinction between parody/genuine attempt. Compensated by Status (II) misfire coding.

  2. **Does it contain a performative verb with "hereby" test?**  
     - *Test:* Insert "hereby" before the verb. If it makes sense (e.g., "I *hereby* promise"), it's performative.  
     - *If YES:* Assign based on verb:  
       - "Promise/commit/guarantee" → **Commissive**  
       - "Order/request/demand" → **Directive**  
       - "State/affirm/testify" → **Assertive**  
       - "Apologize/thank/congratulate" → **Expressive**  
       - "Declare/approve/resign" → **Declaration**  
       → Proceed to Status (II).  
     - *If NO:* Go to Step 3.  

  3. **Is the speaker committing to future action?**  
     - *Check:* Future-oriented verbs ("will", "shall", "going to") with speaker/subject alignment (e.g., "I’ll do X"). Includes conditional commitments ("If Y, I’ll do X").  
     - *If YES:* → **Commissive**.  
     - *If NO:* Go to Step 4.  

  4. **Is the speaker directing the hearer to act?**  
     - *Check:* Imperatives ("Do X"), strong obligations ("You must"), or conventional indirectness ("Could you...?"). Excludes predictions ("You’ll regret...").  
     - *If YES:* → **Directive**.  
     - *If NO:* Go to Step 5.  

  5. **Is the speaker changing institutional reality?**  
     - *Check:* Authority-dependent statements altering status (e.g., "You’re fired", "Report approved"). Requires speaker role/context (e.g., panel chair).  
     - *If YES:* → **Declaration**.  
     - *If NO:* Go to Step 6.  

  6. **Is the speaker expressing a psychological state?**  
     - *Check:* Formulaic emotion ("I’m sorry", "Thank you") or evaluative outbursts ("That’s awful!"). Must reference an event/state.  
     - *If YES:* → **Expressive**.  
     - *If NO:* Go to Step 7.  

  7. **Default/Underdetermined:**  
     - → **Assertive** (e.g., factual claims, descriptions, reports).  
     - *Exception:* If utterance is fragmentary (inaudible), ambiguous, or has conflicting forces → **Refer to PI**.  
     - *PI referral rate:* **5–10%**. Typical cases:  
       - Inaudible/missing clauses.  
       - Reported speech without original intent markers (e.g., "She said: ‘I’ll fix it’" → code as commissive; but "She was angry" without quote → assertive).  
       - Multi-force utterances with no primary act (e.g., "Help me and I’ll help you" → directive-commissive hybrid; PI decides primary force).  

  ---

  ### II. Status Assessment (After Act Type)
  **Determine if the act was successful, void (misfire), or hollow (abuse).**

  1. **Was the act void (misfire)?**  
     - *Check for:*  
       a. **Delivery failure:** Message sent to deactivated account/machine without human uptake (e.g., unretrieved voicemail, auto-forwarded email without human read).  
       b. **Authority lack:** Speaker lacks standing (e.g., student "firing" a professor).  
       c. **Preparatory condition failure:**  
          - Commissive: Action impossible (e.g., "I’ll build a time machine").  
          - Directive: Hearer unable to comply (e.g., "Submit the form yesterday").  
          - Declaration: Speaker lacks institutional role (e.g., intern "accepting" a resignation).  
          - Expressive: No prior event to reference (e.g., apologizing for nothing).  
          - Assertive: N/A (falsity ≠ misfire).  
       d. **Essential incompleteness:** Key clause inaudible/indecipherable.  
     - *If ANY apply:* → **Misfire**.  
     - *If NONE:* Go to Step 2.  

  2. **Was the act hollow (abuse)?**  
     - *Check for insincerity without misfire:*  
       - Clear contextual evidence of deception (e.g., speaker later admits lying, immediate contradiction).  
       - *Exclude:* Doubts without evidence (intentions are inaccessible).  
       - *Declaration note:* No sincerity condition → abuse inapplicable.  
     - *If YES:* → **Abuse**.  
     - *If NO:* → **Successful**.  

  **Uptake definition for async messages:**  
  - Requires **human reception + comprehension opportunity**.  
  - Valid if:  
    - Addressed to humans/groups (e.g., committee emails).  
    - Received by active accounts with access (e.g., inbox, functioning DM).  
  - Invalid if:  
    - Addressed to deactivated accounts/machines without processing (e.g., unread auto-forward).  
    - No human recipient (e.g., drafting a message never sent).  

  ---

  ### Procedure Application to Examples
  #### Example 1:  
  *"You’ll regret talking to them." (Voice note to deactivated account, never retrieved).*  
  - **Act Type:**  
    1. Non-serious? → No evidence → Next.  
    2. Performative verb? → None → Next.  
    3. Commissive? → Not speaker’s action ("you’ll regret") → Next.  
    4. Directive? → Not directing action → Next.  
    5. Declaration? → No status change → Next.  
    6. Expressive? → No emotion conveyed → Next.  
    7. → **Assertive** (prediction).  
  - **Status:**  
    1. Misfire? → Delivery failure (deactivated account, unretrieved) → **Misfire**.  
  - **Output:** Assertive (misfire).  

  #### Example 2:  
  *"We take every report seriously and someone will follow up with you about next steps." (Panel chair boilerplate).*  
  - **Act Type:**  
    1. Non-serious? → Formulaic but serious → Next.  
    2. Performative verb? → "Take" fails "hereby" test → Next.  
    3. Commissive? → "Someone will follow up" = future institutional action → **Commissive**.  
  - **Status:**  
    1. Misfire? →  
       - Delivery? → Valid (hearer present).  
       - Authority? → Panel chair has standing.  
       - Preparatory? → Possible (follow-up plausible).  
       → No misfire.  
    2. Abuse? → No evidence of insincerity → **Successful**.  
  - **Output:** Commissive (successful).  
  - **Argument against PI view:** Boilerplate ≠ null act. It meets commissive criteria: future action commitment by authorized speaker. Status may be hollow (abuse) if insincere, but no evidence here.  

  #### Example 3:  
  *"I can’t approve that on my own, but if the panel signs off I’ll put the transfer through on Monday." (Housing officer).*  
  - **Act Type:**  
    1. Non-serious? → No → Next.  
    2. Performative verb? → None → Next.  
    3. Commissive? → "I’ll put the transfer through" = conditional commitment → **Commissive**.  
  - **Status:**  
    1. Misfire? →  
       - Delivery? → Valid.  
       - Authority? → Officer can process transfers post-approval.  
       - Preparatory? → Action possible if panel approves → No misfire.  
    2. Abuse? → No evidence → **Successful**.  
  - **Output:** Commissive (successful).  

  ---

  ### Limitations of the Procedure
  1. **What it cannot resolve:**  
     - **Intentionality guesses:** Abuse status requires *clear* evidence; most insincerity is unverifiable.  
     - **Multi-force ambiguity:** Hybrid acts (e.g., "Do this and I’ll help") force judgment calls → PI referral.  
     - **Fragmentary utterances:** Inaudible segments may make coding impossible → PI referral.  
     - **Conditional nuance:** Distinguishing commissives ("I’ll do X if Y") from predictions/offers relies on coder inference.  

  2. **Misinterpretation risks:**  
     - **Blame implication:** Coding a misfire (e.g., undelivered threat) does *not* imply speaker innocence; it marks act nullity.  
     - **Institutional outcomes:** A "successful" declaration (e.g., "You’re expelled") codes felicity, *not* ethical/legal validity.  
     - **Boilerplate bias:** Frequent commissives (e.g., Example 2) may be coded "successful" without probing sincerity.  

  3. **Judgment-as-rule elements:**  
     - **"Hereby" test (Step 2):** Coders judge grammatical naturalness.  
     - **Primary force (Steps 3–7):** Coders decide dominant intent in multi-function utterances.  
     - **Delivery evidence (Status-II):** Coders infer from context (e.g., "never retrieved" vs. "sent to inbox").  

  **Final note:** This procedure optimizes speed at the cost of theoretical nuance (e.g., perlocutionary effects, scalar felicity). It captures core illocutionary acts with 90% reliability in clear cases but defers 5–10% to PI for indeterminate items.
