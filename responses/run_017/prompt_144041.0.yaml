answer: |-
  This situation is a collision of **structural exploitation, individual complicity, and ethical ambiguity**. You are **not free-riding**; the system is exploiting unpaid labor while obscuring its true costs. Your guilt is understandable but misdirected. Here’s a breakdown of the core problems:

  ### 1. **The Real Problem: Systemic Exploitation Disguised as Individual Choice**
     - **The Illusion of Voluntariness**: Your teammate claims he *chooses* to work extra. But his chest pains, refusal to take leave, and the team’s silent collusion reveal coercion. This is "voluntary" overwork in the same way a worker "chooses" to skip breaks to meet quotas. The company’s refusal to hire or adjust workloads creates silent pressure.
     - **Managerial Free-Riding**: Your manager is the **actual free-rider**. By citing team performance as proof the 35-hour week works, they convert your teammates’ unpaid labor into:
       - Cost savings (avoiding a 5th hire),
       - Reputational capital ("our team is so efficient!"),
       - A false narrative that masks unsustainable demands.
     - **The Distortion of Metrics**: Your higher efficiency per hour is irrelevant because the system rewards **total output**, not efficiency. By absorbing your share, your teammates inflate the appearance of manageable workloads, perpetuating the cycle.

  ### 2. **Your Role: Complicit Beneficiary, Not Free-Rider**
     - **Benefiting ≠ Exploiting**: You benefit from others’ labor, but you didn’t *create* the system demanding it. The wrongness lies in the structure, not your refusal to participate in self-harm. Your teammate covering for you is a symptom of his internalized overwork ethic, not proof of your burden.
     - **Your Free Time Is Irrelevant**: Scrolling or curing cancer changes nothing. The time is yours. Justifying it reinforces the toxic idea that rest requires productivity. The issue is whether the *work distribution* is fair within *paid hours*—not how you use unpaid time.
     - **His "Choice" Doesn’t Absolve the System**: Even if he genuinely enjoys the work, the company *still* benefits from unpaid labor. His passion doesn’t negate the manager’s exploitation or the health risks he ignores.

  ### 3. **The Ethical Obligations: To the System, Not Just Individuals**
     - **Owed to Your Teammate**: Not gratitude, but **solidarity in dismantling the trap**. He’s harming himself and enabling exploitation. A respectful, private conversation is key:  
       *"I’m concerned the system is using your dedication against us all. Your health matters, and the manager is using our ‘performance’ to avoid hiring. Can we discuss how to fix this?"*  
       **Do not** accuse him of exploitation; frame it as shared victimhood.
     - **Owed to the Team**: Refuse to normalize unpaid labor. Document your completed work/hours transparently. State clearly: *"My capacity at 35h/week is X cases. Cases beyond this remain in the queue unless formally reassigned."*
     - **Owed to Yourself**: Protect your boundaries. Stopping at 35h is **ethical resistance**, not laziness.

  ### 4. **What This Is NOT:**
     - **Not a "Work Ethic" Problem**: The issue isn’t hours worked, but **uncompensated labor propping up false metrics**.
     - **Not About Personal Burnout Alone**: Individual self-care ignores the structural fuel for burnout: understaffing rewarded by managerial deceit.
     - **Not Solvable by "French Hours" or "Japanese Dedication"**: Cultural references distract. This is about **power and accounting**: who extracts value, who pays the cost, and who gets to hide it.

  ### What to Do on Monday: Concrete Actions
  1. **Document and Quantify**:
     - Track your closed cases/hours. Calculate the team’s *actual* weekly workload vs. the 140 paid hours (4 people × 35h). Show the gap.
     - Note the teammate’s skipped days and health issues (without breaching confidentiality).

  2. **Force Transparency**:
     - Email your manager:  
       *"Per our 35h/week policy, I complete [X] cases weekly. The queue requires [Y] cases to stay current, exceeding our 140 paid hours by [Z] hours. How should we prioritize to align with policy?"*  
       This forces acknowledgment of the deficit without accusing teammates.

  3. **Request Structural Solutions**:
     - Push for:  
       - A 5th hire (using your workload data),  
       - Reduced queue intake, or  
       - Overtime pay *formally tracked and approved* for extra hours.  
     - Frame it as sustainability: *"Without adjustment, we risk burnout and attrition."*

  4. **Withdraw Complicity**:
     - Stop letting your untouched cases disappear silently. Flag them at EOD Friday: *"Per my hours, [#] cases remain for Monday."*  
     - If teammates quietly absorb them, note in writing: *"Case #[ID] was resolved by [Teammate] outside my shift."*

  ### Why This Approach?
  - **Exposes Managerial Free-Riding**: Shifts blame from you/teammates to the system.
  - **Protects Teammates**: Makes their sacrifice visible, forcing the manager to confront the cost.
  - **Preserves Your Integrity**: You uphold the 35h agreement without shaming others.

  **The core problem is a rigged system where unpaid labor subsidizes corporate profit and managerial reputation.** Your refusal to participate isn’t wrong—it’s a necessary disruption. The real wrongness lies in a company that quietly profits from silent suffering while convincing workers it’s their choice. Address the system, not your guilt.
