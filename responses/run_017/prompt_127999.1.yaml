prompt: |-
  Last night my friend Sam and I got into it for about three hours over whether someone who genuinely, flatly does not care about anything beyond the next week has a reason to keep taking their medication. I ended up defending a position I'm not sure I can actually defend out loud, and now I have to give it as a department colloquium in three weeks, so I need to be ready for the question period.

  Here's the view, roughly. Call it scaffolded deliberative internalism: there's a reason for A to φ only if A could come to be moved by that consideration through a process we'd count as their own deliberation — where "their own deliberation" is allowed to be extended in time, socially scaffolded (a friend arguing with them over months, a therapist, a book, being around different people), allowed to fix factual mistakes, and allowed to draw out things they already half-care about but have never articulated. What it's not allowed to do is import a desire from outside: no conditioning, no drugs, no manipulation that bypasses their own take-up, and no just stipulating a new want into the set. So the motivational condition still bites — a genuinely desireless or totally unmoved-to-be-moved agent really has no reason — but it bites far less often than the standard internalist thinks, because in practice the route from where almost anyone actually is to being moved by the consideration usually exists, it's just long and needs other people.

  Sam's objection, which I did not have a good answer to, was that once you let the process be that long and that scaffolded, "could be brought to be moved" just means "an ideal persuader could get them there," which is externalism wearing a motivational condition as a hat — the internalist constraint stops excluding anything. I suspect that's the question I'm going to get in some form and I need to have handled it before slide two.

  The room: about thirty people. Three or four hard-line Humeans about reasons who think internalism is basically definitional and that I've reinvented it badly; two Kantian-ish rationalists who think the whole motivational constraint is a category mistake and reasons are just facts about what there is to be said for things; a couple of moral psychologists who spend their time on how people actually change (and don't change) what they care about, including the stuff where people dig in and keep insisting something's wrong after every reason they give gets knocked down; and one political philosopher who will care a lot about whether my view can still say anything to someone genuinely awful. No one there works on this exact debate, which I think makes it worse, not better.

  What I want is a prep sheet. Give me the eight-ish objections I'll actually get from this room — not the ones I'd get from people who already agree with me — ordered by likelihood times damage, each one phrased the way that kind of person would actually say it out loud (the Humean version and the rationalist version of the same complaint sound completely different and I need both). For each: a reply I can give in about ninety seconds standing at the whiteboard without notes, and an honest note on where that reply is soft or where I'm quietly changing the subject. Tell me what I should concede in the first three minutes so I'm not still fighting it in Q&A, which single reply has to land or the whole talk is dead, and — please — the one question I'm hoping nobody asks, with the real answer rather than the comfortable one. If you think Sam's objection is fatal as stated, say so and tell me the most I could salvage by tightening something.
reasoning: |-
  Hmm, the user is a philosopher preparing for a department colloquium where they'll defend a position called "scaffolded deliberative internalism." They need to anticipate and prepare for objections from a diverse audience. The core idea is that reasons require the possibility of motivational uptake through extended, scaffolded deliberation, but without importing desires externally.

  The key objection they're worried about comes from their friend Sam, who argued that allowing such extensive scaffolding makes the view collapse into externalism. The audience includes Humeans, Kantians, moral psychologists, and a political philosopher, each likely to raise different concerns.

  For the prep sheet, I need to identify the most probable and damaging objections. The Humeans will likely see this as a betrayal of internalism since it waters down the motivational requirement. The Kantians will reject any motivational constraint entirely. The moral psychologists might point to real-world cases where people resist change despite extensive scaffolding. The political philosopher will challenge whether this view can address genuinely awful individuals.

  I should organize the objections by likelihood and damage. Top concerns should include Sam's collapse argument, the Kantian rejection of motivational constraints, worries about infinite regress in deliberation, and the problem of the "fixed point" agent who can't be moved. For each, I'll provide a concise reply the user can deliver in 90 seconds, noting where the reply might be weak or evasive.

  The user should concede early that their view isn't traditional internalism but a hybrid position. The most critical reply to land is the distinction between possibility and actuality of motivation, showing how this avoids externalism. The question they should fear most is about truly fixed agents, where the honest answer is that such agents might indeed have no reasons - a tough pill to swallow but necessary for consistency.

  The prep sheet needs to be practical, with objections phrased as audience members would actually say them. Replies should be whiteboard-friendly, and weaknesses should be acknowledged honestly. This will help the user present confidently while knowing where their position is vulnerable.
answer: |-
  Here’s your prep sheet, structured for maximum tactical readiness. I’ve prioritized objections by **likelihood × damage**, factoring in your audience’s composition. Sam’s objection is critical but not fatal—we’ll refine it.

  ---

  ### **Core Concession to Make Early (First 3 Minutes)**
  **Concede:** *"This view deliberately stretches internalism’s 'could be moved' condition to near its breaking point. It’s not pure Williams-style internalism, nor is it externalism. It’s a *hybrid*: reasons are still motivationally constrained, but the *path* to motivation is far wider and more social than traditional internalism allows. If you demand a pristine internalism, this isn’t it."*  
  *Why:* Preempts accusations of definitional betrayal. Anchors you as revising, not reinventing.

  ---

  ### **The Eight Objections (+ Replies & Weaknesses)**

  1.  **Sam’s Collapse Objection (Humean/Rationalist Alliance)**  
      *Humean phrasing:* "You’ve gutted internalism! If ‘could be moved’ includes years of therapy, books, and friends arguing, then *any* agent ‘could’ be moved by *any* reason given enough scaffolding. This is just externalism with extra steps—the motivational constraint is doing no work."  
      *Rationalist phrasing:* "Your ‘scaffolding’ is a Trojan horse for objective reasons. If an ideally extended process *would* move the agent, that’s because the consideration *is* reason-giving independently of their contingent psychology. Drop the pretense of internalism."  
      **Reply:** *"The constraint bites precisely where scaffolding *fails* to connect to the agent’s existing subjective standpoint. Scaffolding isn’t magic—it can only *draw out* or *develop* cares, values, or epistemic commitments already latent (even if deeply buried) in the agent’s actual psychology. It can’t implant wholly alien values. If *no* path exists from their current standpoint to caring about X, even with ideal scaffolding, then X isn’t a reason for them. That’s the internalist core."*  
      **Weakness:** "Latent" cares are fuzzy. Hard to disprove their existence in practice. Rationalists will say you’ve smuggled in objectivity via "latency."

  2.  **The Fixed Point / Unreachable Agent (Moral Psychologist + Political Philosopher)**  
      *Phrasing:* "I study addicts/clinically depressed/extremists. Some people, after *years* of therapy/social support/factual correction, *still* don’t care beyond the next fix/week/ideological goal. Their ‘latent cares’ are a mirage. On your view, does the heroin addict genuinely have *no reason* to quit? Does the Nazi have *no reason* to not gas Jews? That’s absurd or monstrous."  
      **Reply:** *"First, *having* a reason isn’t the same as *acting* on it. Second, the question is whether a *possible* deliberative path exists *from their actual subjective starting point*. For the Nazi, does some element of their current psychology—fear, loyalty, a twisted sense of purity—contain a seed that, if developed via non-manipulative scaffolding (e.g., encountering survivors humanely), *could* lead them to grasp the moral reason? If truly *no* such seed exists—if they are constitutively incapable of ever seeing others as moral patients—then yes, tragically, they lack that moral reason. But this is vanishingly rare. Most apparent ‘fixed points’ result from insufficient or misapplied scaffolding, not psychological impossibility."*  
      **Weakness:** Politically dangerous concession. Relies on empirical rarity of "truly fixed" agents. Moral psychologists may cite evidence of genuine deliberative rigidity.

  3.  **The Regress / Who Judges "Their Own Deliberation"? (Rationalist)**  
      *Phrasing:* "You ban ‘importing desires,’ but your ‘scaffolding’ *is* external influence! How is a therapist/friend/book fundamentally different from ‘conditioning’? And who decides what counts as ‘their own take-up’? This is hopelessly vague and just pushes the problem back."  
      **Reply:** *"The key distinction is *bypass vs. engagement*. Conditioning/manipulation *bypasses* the agent’s rational faculties. Scaffolding *engages* them—it presents considerations, arguments, experiences that the agent must *themselves* process, reject, or internalize. ‘Their own take-up’ means the motivational shift results from *their* cognitive/affective response to the input, not the input itself. The therapist doesn’t implant the desire; they help the agent *discover* it within their own perspective."*  
      **Weakness:** Boundary between "engagement" and "manipulation" is porous (e.g., nudging). Rationalists will argue all persuasion risks bypassing "pure" reason.

  4.  **Motivational Constraint is Irrelevant (Rationalist)**  
      *Phrasing:* "Why keep the motivational condition at all? If reasons are facts about what there is to be said for φ-ing, whether Joe Schmo *could* ever appreciate them through some convoluted social process is irrelevant. A reason’s force doesn’t depend on its psychological accessibility."  
      **Reply:** *"Because reasons are *prescriptive* for *specific agents*. A fact is only a *reason for A* if it bears a relevant connection to *A's* concerns or potential concerns—otherwise, it’s just an inert fact. The motivational constraint (even extended) ensures reasons are action-guiding *for the agent they apply to*, not just abstract truths. Without it, we lose the essential link between reasons and agency."*  
      **Weakness:** Rationalists reject this link as fundamental. They’ll say guidance is a separate issue.

  5.  **"Half-Cares" are Doing All the Work (Humean)**  
      *Phrasing:* "So the only reasons that pass your test are those that hook onto some pre-existing ‘half-care’? That’s just standard internalism! All your scaffolding does is help the agent *find* their existing reasons. Why the fancy apparatus?"  
      **Reply:** *"Standard internalism often requires *current* motivational access. Scaffolding shows how ‘half-cares’—too weak, conflicted, or inarticulate to *currently* motivate—can be *developed* into full motivational sources through deliberation over time. This expands the set of *accessible* reasons dramatically compared to ‘what would motivate them now if they thought about it.’ It also explains why we hold people responsible for reasons they don’t yet grasp but *could*."*  
      **Weakness:** Concedes that ultimately, only existing psychological states ground reasons. Hard-line Humeans may call this a win for them.

  6.  **The "Next Week" Person Has No Latent Cares (Moral Psychologist / Humean)**  
      *Phrasing:* "Take your original case: someone genuinely indifferent to *everything* beyond next week. No long-term goals, no relationships they value, no curiosity. What ‘latent care’ does scaffolding draw on? If none, do they really have *no reason* to take life-saving meds? That seems implausible."  
      **Reply:** *"Scaffolding would first probe: Why only next week? Is it despair? A misunderstanding of time/self? An overwhelming present need? Even the most indifferent person typically has *some* aversion to suffering or desire for fleeting comfort next week. Scaffolding might start there, connecting medication to avoiding *next week's* withdrawal agony, then gradually linking present action to slightly extended comfort, building a chain. If *absolutely nothing* matters to them—not even avoiding pain next Tuesday—then yes, they lack a reason. But that level of global apathy is pathological, not normative."*  
      **Weakness:** Relies on the empirical claim that total motivational blankness is pathological/rare. Might not satisfy.

  7.  **Scaffolding is Just Rationalization (Moral Psychologist)**  
      *Phrasing:* "People often double down when challenged! Scaffolding can entrench bad beliefs (e.g., conspiracy theorists finding ‘better’ arguments in their echo chamber). How does your view distinguish ‘good’ scaffolding that accesses real reasons from ‘bad’ scaffolding that just reinforces error?"  
      **Reply:** *"Good scaffolding requires *epistemic responsibility*: correcting factual errors, confronting contradictions, exposing diverse perspectives. An echo chamber avoids this—it’s *anti*-deliberative scaffolding. The test isn’t whether motivation *changes*, but whether it changes via a process involving *reason-responsive engagement* with the world and others. Bad scaffolding bypasses or corrupts reason-responsiveness."*  
      **Weakness:** "Reason-responsiveness" is contested. Requires a normative account of rationality.

  8.  **No Action-Guidance Now (Political Philosopher)**  
      *Phrasing:* "So for the Nazi, I must spend *years* trying to scaffold their latent humanity before I can say they have a reason to stop? That’s useless for action! We need to condemn them *now*."  
      **Reply:** *"We can condemn the *act* as objectively wrong based on the reasons *we* recognize. We can judge *their character* as vile. The point of the view is *metaphysical*: what reasons *apply to them*. Practically, we act based on *our* reasons (e.g., to stop them). We don’t need to wait for their deliberative journey to justify intervention or judgment of the act itself."*  
      **Weakness:** Separates "reasons for them" from practical response may feel unsatisfying. Risks making reasons overly agent-relative.

  ---

  ### **The "Must-Land" Reply (For Sam's Objection - #1)**
  **Why it’s critical:** If the audience thinks you’ve collapsed into externalism, you lose Humeans *and* rationalists dismiss you as confused.  
  **The Pitch:** *"The internalist core remains: reasons must be *rooted* in the agent’s *actual* subjective motivational set (S), even if deeply buried. Scaffolding *uncovers* or *develops* paths *within* S; it doesn’t *add* to S from outside. Externalism says reasons exist *independently* of S. That’s the crucial difference. The motivational constraint excludes considerations fundamentally alien to S, no matter how much you scaffold."*  
  **Use Whiteboard:** Draw "S" (a blob). Arrows from deep inside S to its surface via winding "scaffolding" paths. Contrast with externalism: arrows from outside pointing *at* S.  
  **If Challenged:** Hammer "rooted in actual S." Concede it makes S fuzzier than Williams allowed.

  ---

  ### **The Question You Hope Nobody Asks (But Prepare For)**
  **The Question:** *"Suppose we find an agent who is *constitutively incapable* of ever being moved by a specific reason (e.g., moral reasons), even via ideal, non-manipulative, extended scaffolding drawing on their actual psychology. On your view, they have no such reason. Doesn’t this mean morality is *optional* for psychopaths, or that the meds-avoider *really* has no reason? How is this not a reductio?"*  
  **The Real Answer:** *"Yes, on this view, such an agent genuinely lacks that specific reason. This *is* a deeply uncomfortable implication. It means normativity is not universal in scope; it depends on the agent's psychological capacities. Morality remains objectively true as a system of reasons *for beings capable of grasping it*, and we still have overwhelming reasons to constrain such agents to protect others. But if an agent *truly* lacks the capacity to be moved by moral considerations *in any way*, then, tragically, moral reasons *for them* don’t exist. This doesn’t make morality optional *for us*; it highlights that agency and reasons are tethered to subjective capacities. We mitigate this by noting such agents are likely rarer than we think, and our practical responses don’t hinge on their internal reasons."*  
  **Why it’s Dangerous:** Admits normativity isn't fully universal. Sounds like giving psychopaths a "pass." Politically toxic.  
  **Damage Control:** Immediately pivot to practical implications: *"This doesn't change our obligations *to* them or *regarding* them one iota. We lock up dangerous psychopaths because *we* have reasons to protect society, not because *they* have a reason to reform."*

  ---

  ### **Salvage If Sam’s Objection Feels Fatal**
  Tighten the **"rooted in actual S"** requirement:
  1.  **Explicit Latency Requirement:** Scaffolding can only develop/disambiguate *structurally present* elements in S (cares, values, general desires, epistemic norms). No *de novo* introduction.
  2.  **No "Ideal Persuader":** Shift from "could be moved by an ideal persuader" to "could be moved *by their own deliberative activity* given access to specific, non-manipulative resources (facts, arguments, experiences) over time." Emphasize *self*-movement.
  3.  **Constraint on Scaffolding:** Scaffolding must respect the agent's "deliberative identity" – it can't turn them into a different person, only a more developed/virtuous version of themselves.

  **This maintains internalism's spirit:** Reasons remain anchored in the agent's *actual* (if underdeveloped) psychology, not an ideal or external standard. It excludes truly alien reasons while accommodating deep self-discovery.

  ---

  **Final Prep Tip:** Start your talk by **defining "scaffolding" concretely** (e.g., "Think of a good therapist: they don't tell you what to care about; they help *you* see connections you were missing"). This makes the abstract mechanism tangible early, preempting "it's just magic" accusations. Good luck – you've got a fascinating position!
