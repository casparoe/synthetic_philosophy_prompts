  - **7 leaves** (named positions with 1 awkward commitment each)  
  - Marked **unseparated leaves** and **unoccupied combinations**  
  - Notes on **reversed empirical findings** at the end.  

  ---

  ### **Decision Tree: Does Moral Psychology Tell Us Who Is Right?**  
  *Start: Assume MFT accurately describes variation in moral intuitions (conservatives use all six foundations; liberals focus on individualizing ones).*  

  #### **Branch 1: The Toilet Flag Case**  
  *A patriot cleans his private toilet with a worn-out national flag (due for retirement). He does it respectfully, believing it’s practical reuse of cloth. Is this acceptable?*  
  - **Yes** → Go to Branch 2A  
  - **No** → Go to Branch 2B  

  #### **Branch 2A: The Nepotism Case**  
  *A family-owned shop hires a less qualified cousin over a more qualified outsider. The job isn’t safety-critical, and the business thrives. Is this acceptable?*  
  - **Yes** → Go to Branch 3A  
  - **No** → Go to Branch 4A  

  #### **Branch 2B: The Village Burial Case**  
  *A remote village insists on burying the dead within 24 hours for tradition, risking missed disease diagnoses. They refuse to change despite modern evidence. Is this acceptable?*  
  - **Yes** → Go to Branch 3B  
  - **No** → Go to Branch 4B  

  #### **Branch 3A: The Crisis Authority Case**  
  *During a disaster, a leader makes a unilateral decision that saves lives but bypasses community input. The outcome is good, but the process was authoritarian. Was the decision-making acceptable?*  
  - **Yes** → **Leaf 1: Coverage Conservatism**  
  - **No** → **Leaf 2: Sensitivity Liberalism**  

  #### **Branch 3B: The Noisy Festival Case**  
  *A town’s annual festival causes sleepless nights for neighbors. Should the festival be allowed without restrictions to preserve tradition, or limited to respect neighbors’ peace?*  
  - **Allowed** → Go to Branch 5  
  - **Limited** → **Leaf 3: Heuristic Non-Realism**  

  #### **Branch 4A: The Harmful Tradition Case**  
  *A tribe’s sacred ritual causes minor physical harm (e.g., scarification). The harm is real but tolerated for cultural reasons. Is this morally justified?*  
  - **Yes** → **Leaf 4: Asymmetric Debunking (Conservative Advantage)**  
  - **No** → **Leaf 5: Asymmetric Debunking (Liberal Advantage)**  

  #### **Branch 4B: The Corporate Loyalty Case**  
  *A CEO prioritizes loyal employees over more innovative outsiders, causing moderate financial decline. Is this acceptable to preserve workplace relationships?*  
  - **Yes** → Go to Branch 6  
  - **No** → **Leaf 6: Noise Conservatism**  

  #### **Branch 5: The Adaptive Tradition Case**  
  *Imagine a society that abandoned quick burials after learning they caused plagues. Was this change:*  
  - **A moral improvement** → **Leaf 3: Heuristic Non-Realism**  
  - **A practical adjustment (no moral change)** → **Leaf 1: Coverage Conservatism**  

  #### **Branch 6: The Universal Flag Case**  
  *If a culture saw flags as just cloth (no symbolic meaning), would cleaning toilets with them be acceptable?*  
  - **Yes** → **Leaf 7: Deliberative Balancing**  
  - **No** → **Leaf 4: Asymmetric Debunking (Conservative Advantage)**  

  ---

  ### **Leaves (Named Positions)**  
  1. **Coverage Conservatism**  
     - **Epistemic claim**: Conservatives’ use of all foundations tracks more moral truths (wider coverage → fewer blind spots).  
     - **Awkward commitment**: *You must defend the quick burial tradition as morally necessary even if it causes preventable deaths.*  
     - *Reached via: Toilet Flag (No) → Village Burial (Yes) → Noisy Festival (Allowed) → Adaptive Tradition (Practical adjustment) OR Crisis Authority (Yes)*  

  2. **Sensitivity Liberalism**  
     - **Epistemic claim**: Liberals’ focus on individualizing foundations reflects better calibration (binding foundations are noise; less distortion → higher accuracy).  
     - **Awkward commitment**: *You must reject hiring the less qualified cousin as inherently immoral, even if it strengthens community bonds.*  
     - *Reached via: Toilet Flag (Yes) → Nepotism (No) → Crisis Authority (No)*  

  3. **Heuristic Non-Realism**  
     - **Epistemic claim**: Foundations are evolutionary heuristics, not truth-trackers. Debunking is symmetric (both sides’ intuitions are unreliable).  
     - **Awkward commitment**: *You must concede that the toilet flag act has no moral weight—it’s only wrong if society agrees it is.*  
     - *Reached via: Toilet Flag (No) → Village Burial (Yes) → Noisy Festival (Limited) OR Toilet Flag (No) → Village Burial (Yes) → Noisy Festival (Allowed) → Adaptive Tradition (Moral improvement)*  

  4. **Asymmetric Debunking (Conservative Advantage)**  
     - **Epistemic claim**: Cultural evolution debunks both, but conservatives’ use of more inputs provides more evolutionary "data," making their intuitions more reliable.  
     - **Awkward commitment**: *You must argue the harmful ritual is justified because its longevity signals adaptive wisdom, even with evidence of harm.*  
     - *Reached via: Toilet Flag (Yes) → Nepotism (Yes) → Harmful Tradition (Yes) OR Toilet Flag (No) → Village Burial (Yes) → Noisy Festival (Allowed) → Universal Flag (No)*  

  5. **Asymmetric Debunking (Liberal Advantage)**  
     - **Epistemic claim**: Cultural evolution debunks both, but binding foundations are more contingent on arbitrary norms (individualizing ones track universal welfare → liberals less deceived).  
     - **Awkward commitment**: *You must dismiss the CEO’s loyalty as morally irrelevant, even if it prevents organizational collapse.*  
     - *Reached via: Toilet Flag (Yes) → Nepotism (Yes) → Harmful Tradition (No)*  

  6. **Noise Conservatism**  
     - **Epistemic claim**: Conservatives’ broader sensitivity introduces noise and error (too many inputs → overfitting); liberals’ focus is more reliable.  
     - **Awkward commitment**: *You must ignore conservative warnings about social decay from liberal policies, even if historically accurate.*  
     - *Reached via: Toilet Flag (No) → Village Burial (No) → Corporate Loyalty (No)*  

  7. **Deliberative Balancing** (Your position)  
     - **Epistemic claim**: Psychology tells us nothing about who is right, but reveals that deliberation requires both perspectives to avoid blind spots (procedural, not first-order).  
     - **Awkward commitment**: *In a pandemic, you must include anti-vaccine voices in policy debates, even if their claims are demonstrably false.*  
     - *Reached via: Toilet Flag (No) → Village Burial (No) → Corporate Loyalty (Yes) → Universal Flag (Yes)*  

  ---

  ### **Notes on Tree Structure**  
  - **Unseparated leaves**:  
    - **Coverage Conservatism (Leaf 1) and Asymmetric Debunking (Conservative Advantage) (Leaf 4)** cannot be fully separated by this tree. Both defend conservative intuitions as epistemically superior but on different grounds (truth-tracking vs. evolutionary reliability). The tree conflates them because real-world adherents often blend these arguments. *Marked as unexplored synthesis*.  
  - **Unoccupied combinations**:  
    - **Toilet Flag (Yes) → Nepotism (Yes) → Crisis Authority (No)**: Argues authority is illegitimate but loyalty/nepotism is binding. Incoherent (authority and loyalty are linked in MFT; no stable real-world position).  
    - **Toilet Flag (No) → Village Burial (No) → Corporate Loyalty (Yes) → Universal Flag (No)**: Claims flags have universal sanctity but rejects burial traditions. Unattractive (inconsistent binding-foundation realism).  
  - **Reversed empirical findings?**  
    If liberals used all six foundations evenly and conservatives were narrow, the tree would **largely look the same**. Coverage arguments (e.g., Leaf 1) would favor liberals; sensitivity arguments (e.g., Leaf 2) would favor conservatives. Asymmetric debunking would flip (e.g., Leaf 5 becomes conservative advantage if liberals are "broader"). Only the *labels* change—the epistemic structure is symmetric.  

