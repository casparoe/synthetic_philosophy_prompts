  The depression question is critical - if assent is compromised in MDD, does the model collapse? Honest answer: The model describes a normative process; pathology creates exceptions but doesn't invalidate the framework. This may dissatisfy clinicians wanting clinical tools.

  Surprise danger might be: "If station 3 is so limited, why did Epictetus focus there?" Need to explain historical context vs modern therapeutic adaptation.

