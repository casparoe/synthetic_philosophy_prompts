  For the prep sheet, I need to anticipate 8 objections in likely sequence:
  1. Early objections will challenge practical application (clinicians)
  2. Mid-session will hit philosophical accuracy (classicists)
  3. Late questions may attack theoretical foundations (both)
  4. Ending with the depression concern they've flagged

  The "serial control" model's stations need clear defense:
  - Station 1 (exposure) as environmental control
  - Station 2 (holding time) as metacognition
  - Station 3 (assent) as limited but crucial
  Must emphasize this isn't about outcomes but process

  Key traps to avoid:
