  Here's a complete in-class activity designed for your 80-minute seminar. It simulates a community facing moral choices, structured to expose the fragility of shame and the lag of guilt without requiring outside readings or risking real shame. The game uses index cards, envelopes, and a whiteboard—no fancy materials.

  ---

  ### **Activity: The Village Commons Simulator**  
  **Objective:** Students experience how shame relies on observation/audience, while guilt persists even after institutions change.  
  **Time:** 60 minutes (game) + 20 minutes (debrief).  
  **Students:** 18 (split into 3 villages of 6 each for manageability).  

  ---

  ### **Setup (10 minutes)**  
  1. **Materials Prep:**  
     - **Index Cards:**  
       - 18 "Role Cards" (e.g., "Baker," "Farmer," "Weaver"—no moral weight).  
       - 18 "Infraction Cards" (e.g., "Took extra grain," "Used communal tools without asking").  
       - 18 "Internalization Trackers" (cards with "0" written on them).  
       - 36 blank cards (for decisions).  
     - **Envelopes:** 18 per student (one for internalization tracker, one for private decisions).  
     - **Whiteboard:** Track village scores and institutions (see tables below).  

  2. **Student Prep:**  
     - Assign roles (e.g., "You’re the Baker—your job is to distribute bread").  
     - Give each:  
       - One envelope with their internalization tracker (start at "0").  
       - One empty envelope for private decisions.  
       - Emphasize: "This is fiction. No real moral stakes—just mechanics."  

  3. **Institutions Menu (Write on Board):**  
     | **Institution** | **Cost** | **Supports** | **Effect** |  
     |-----------------|----------|--------------|-----------|  
     | Public Monitoring | 3 points | Shame | All decisions public; observers see who "offends." |  
     | Private Confession | 2 points | Guilt | Secret confessions forgiven; adds to internalization. |  
     | Record Keeping | 1 point | Shame | Public list of past infractions (read aloud each round). |  
     | Deliberate Forgetting | 1 point | Guilt | Confessions erase records; no lasting stigma. |  
     | Cheap Exit | 1 point | Neither | Leave village for "new life" (resets internalization to 0). |  
     | Novice Training | 4 points | Guilt | Slow internalization growth (even without infractions). |  

     - **Village Budget:** 10 points per village to spend on institutions.  

  ---

  ### **Game Rounds (50 minutes)**  
  **Round 0: Institution Purchase (5 min)**  
  - Villages discuss and buy institutions (e.g., "We’ll take Public Monitoring and Record Keeping!").  
  - **Instructor:** Record choices on whiteboard.  

  **Rounds 1–5 (9 min each):**  
  Each round has 4 steps:  
  1. **Infraction Draw:** Each student draws one random Infraction Card (e.g., "Took extra grain").  
  2. **Decision:**  
     - If **Public Monitoring** is active: Students declare choices *publicly* (e.g., "I commit" or "I don’t").  
     - If **no Public Monitoring:** Write choice privately ("commit" or "don’t") and seal in envelope.  
  3. **Consequences:**  
     - **If "commit" and observed** (via Public Monitoring or Record Keeping): Name added to public "shame list."  
     - **If "commit" and unobserved:** Only counted if revealed via confession/records.  
     - **Cheap Exit option:** After decisions, students may exit (leave village, reset internalization to 0, sit out rest of round).  
     - **Private Confession:** If available, "offenders" may confess secretly to instructor for forgiveness.  
  4. **Scoring & Updates:**  
     - **Compliance Points:**  
       - Observed Compliance (shame): +2 pts/villager who *didn’t* commit **when observed**.  
       - Unobserved Compliance (guilt): +2 pts/villager who *didn’t* commit **when unobserved**.  
     - **Internalization Tracker Updates (secret):**  
       - +1 if: (a) Novice Training active AND no infraction, OR (b) Confessed infraction.  
       - **Guilt Lag Rule:** If guilt institution (Novice Training/Confession) repealed, internalization decays by 1 next round (min 0).  
       - **Key Mechanic:** If internalization ≥3, student *cannot* commit infraction (guilt blocks action).  
     - **Instructor:** Update scores and announce aggregate outcomes (e.g., "3 offenses this round—2 confessed").  

  **Environmental Shifts:**  
  - **Round 1:** Baseline (no shifts).  
  - **Round 2:** "Neighboring village opens!" Cheap Exit becomes free (if purchased) or costs 0.  
  - **Round 3:** "Mobility crisis!" Repeal one institution (no refunds).  
  - **Round 4:** "Anonymity tech!" Public Monitoring suspended (if active).  
  - **Round 5:** "Repeal freedom!" Repeal one more institution.  

  ---

  ### **Debrief (20 minutes)**  
  **Guiding Questions:**  
  1. "When did compliance collapse? Why?"  
     - *(Expected: Shame failed in Rounds 2/4—exit/anonymity removed observers. Guilt persisted in Round 5 post-repeal due to internalization lag.)*  
  2. "What did the repeal rounds (3/5) reveal about guilt vs. shame?"  
     - *(Expected: Shame institutions (Public Monitoring) stopped working immediately; guilt habits (internalization) lingered.)*  
  3. "What are the failure modes we observed?"  
     - **Shame:** Exit (Round 2), hypocrisy (public compliance but private cheating), exile (record-keeping stigma).  
     - **Guilt:** Scrupulosity (internalization ≥3 blocking actions), private suffering (no off-switch), no public repair.  

  **Key Takeaways:**  
  - **Shame** = audience-dependent; fragile to exit/anonymity.  
  - **Guilt** = self-policing; persistent but slow to build/decay.  
  - **Limitations:** This simulates structure, not emotion. It can’t make you *feel* guilt/shame or compress moral development.  

  ---

  ### **Safety & Problem Prevention**  
  1. **Prevent Real Shame:**  
     - **Trivialize Infractions:** Use absurd, fictional acts ("borrowed a chicken without asking").  
     - **Anonymize Decisions:** No names used publicly—e.g., in Public Monitoring rounds, students hold up color-coded cards (green = comply, red = offend) while instructor tallies *aggregates* only ("5 reds this round").  
     - **Emphasize Roleplay:** "You’re playing a villager—not yourselves. Offenses aren’t real."  
     - **Confession Privacy:** All confessions submitted sealed; instructor destroys after recording.  

  2. **Predictable Problems & Fixes:**  
     - **Meta-Gaming the Points:** If students optimize scores (e.g., always complying), remind them: "In real life, people *are* tempted—roleplay that tension." Add a "temptation bonus": If they commit, they gain a personal point (tracked secretly), but this risks real shame; better to let the natural dynamics unfold.  
     - **Shame ≠ Embarrassment:** Preempt in intro: "Shame here means *public exposure*, not fleeting embarrassment." Debrief distinction: Shame = "I am seen as bad," guilt = "I am bad."  
     - **Discussion Collapse:** Assign a "village scribe" per group to track institutions/outcomes. Use structured debrief questions.  

  3. **Logistical Hiccups:**  
     - **Time Crunch:** Skip Round 5 if needed; the lag effect appears in Round 4.  
     - **Internalization Tracking:** Students update their own trackers (instructor spot-checks 2–3 envelopes).  
     - **Scores:** Use simple tally marks on whiteboard:  
       | Village | Observed Comp. | Unobserved Comp. | Total |  
       |---------|----------------|------------------|-------|  

  ---

  ### **Why This Works**  
  - **Hard Part Felt:** Students *see* shame fail with exit/anonymity (Rounds 2/4) and guilt outlast institutions (Round 5).  
  - **No Readings Needed:** Concepts emerge from mechanics.  
  - **Emotionally Safe:** Abstraction + anonymity prevents real shame.  
  - **Normative Frame:** You close by contextualizing (e.g., "Guilt’s lag makes it robust but hard to scale; shame’s efficiency requires stability").  

  Run this as-is, and your students will grapple with the core tensions—not just hear about them. Let me know if you need tweaks!
