  - At the start of the round, each student knows their internalization counter.
  - If counter >=3, they cannot commit an infraction (they are forced to choose not commit).
  - At the end of the round, update counter:
     a. If Novice Training is active and they did not commit, +1.
     b. If Private Confession is active and they committed but confessed, +1.

  Scoring:
  - Each round: village score = (number of compliant villagers) * 2, where a compliant villager is one who:
     - Did not commit, OR
     - Committed but confessed (if Private Confession is active).

  Note: If a villager exits, they are not counted in the number of villagers for that round (so the base number is reduced).

  This should fit in 80 minutes with time for debrief.

  Implementation:

  - Have index cards for decisions (one per round per student).
  - Envelopes for private submissions.
  - A master list for the instructor to track internalization counters (or trust students to update).

  First Run Problems:

  - Time: It might run long. Practice with a smaller group.
  - Confusion: Have clear instructions on a handout.
  - Real shame: Be vigilant and stop the game if any student seems distressed.

  This should meet the goals.
