prompt: |-
  I keep noticing a pattern in how groups handle slights, and I dont have a word for it. The stuff I've read on moral cultures sorts them into three kinds — one where you answer an insult yourself and build a reputation for not being pushable, one where you shrug it off or go through the rules without escalating, and one where you publicize the harm and appeal to a third party — and it treats a given group as being one of the three. But the groups I mean run two of them at the same time, stably, not as a phase they're moving through. Inside the group, a slight is handled directly: people keep score, nobody wants to look weak, and running to an authority is contemptible. The second the other party is an outsider — another team, another department, another school, the internet — the same people switch to harm-and-safety language and go straight to HR, admin, the platform, or the public. And the people who are good at both registers have the most status.

  It's not just code-switching in the usual sense, since that's about language and self-presentation, whereas here what changes is who is allowed to settle the thing and what counts as winning. It's not quite hypocrisy either: everyone in the group knows the rule and mostly endorses it.

  Does this configuration have a name? If there's an established concept for it, tell me how it differs from the nearest ones and which fits best; if there isn't, give me a term with a real definition and some boundary cases — including what to call the reverse arrangement, authority-language at home and direct retaliation logic against outsiders, which I think I've seen too. And does the two-register case actually break the three-way typology, or does that typology never need a culture to be internally consistent in the first place?
reasoning: |-
  Okay, the user is describing a pattern they've observed in group dynamics where groups handle slights differently based on whether the offender is an insider or an outsider. They mention the three moral cultures—honor, dignity, and victimhood—but note that their groups use two simultaneously: honor culture internally and victimhood culture externally. They want to know if this has a name, how it relates to existing typologies, and what the reverse would be called.

  First, I recall the three moral cultures from Campbell and Manning's work. Honor culture involves personal retaliation, dignity culture uses institutional mediation without escalation, and victimhood culture publicizes harm to third parties. The user's observation doesn't fit neatly into one category since the group switches based on the offender's identity. This dual-mode behavior is key.

  The user mentions it's not just code-switching or hypocrisy. They need a term that captures the strategic shift in conflict resolution methods. Maybe "insider/outsider moral bifurcation" or "parochial solidarity enforcement"? The existing term "parochial altruism" comes to mind, which combines in-group loyalty and out-group hostility. That might fit, but it's usually about cooperation, not conflict resolution. Adapting it to "parochial conflict resolution strategies" could work. 

  I should also consider boundary cases. For example, what if the outsider is a close ally? Or if an insider harms the group's reputation? The user also asks about the reverse scenario, where groups use authority for internal issues but direct retaliation externally. That might be seen in gangs or militaries. "Institutional pacification internally, honor-based externality" or something similar. 

  The user questions if this breaks the three-way typology. The typology doesn't require internal consistency; it's about dominant modes. Many groups are pluralistic. The dual-mode is a hybrid strategy. The typology still holds as the modes aren't mixed in the same context but applied situationally. 

  I need to ensure the term is clear and distinguishes from similar concepts. Hypocrisy implies deception, but here the rules are known and endorsed. Code-switching is linguistic. Parochial conflict resolution captures the in-group/out-group dynamic. For the reverse, "reverse parochial conflict resolution" or "externality-honor/internal-victimhood" might work. 

  The user's deeper need might be understanding group cohesion mechanisms or navigating such environments. They might want to articulate this dynamic academically or apply it practically. Providing a clear term and examples will help them communicate or analyze these patterns effectively.
answer: |-
  This phenomenon you've described is incredibly astute and does represent a significant pattern that challenges the simplicity of the "honor-dignity-victimhood" typology. While there isn't a single, universally accepted term *exclusively* for this specific dual-register conflict resolution strategy, the best established concept capturing its core dynamic is:

  **Parochial Altruism / Parochial Cooperation (adapted to Conflict Resolution)**

  Here's the breakdown:

  1.  **The Established Concept: Parochial Altruism/Cooperation:**
      *   **Definition:** This concept (rooted in evolutionary psychology and sociology) describes the human tendency towards strong cooperation, loyalty, and sacrifice *within* a defined in-group, coupled with suspicion, competition, or even hostility *towards* out-groups. It explains why we readily help "our own" but may distrust or harm "the others."
      *   **Application to Your Observation:** Your groups are applying this fundamental in-group/out-group distinction directly to their **conflict resolution logic**:
          *   **In-Group (Parochial Cooperation Mode):** Cooperation and group cohesion are paramount. Handling slights directly ("honor" logic) reinforces internal hierarchies, builds trust through demonstrated toughness/resilience, and avoids burdening the group with external mediation (seen as weak and divisive). Reputation *within* the group is the key currency.
          *   **Out-Group (Parochial Hostility/Competition Mode):** The group shifts to seeing the outsider as a threat or competitor. Using "victimhood" logic (publicizing harm, appealing to external authorities like HR, Admin, Public Opinion) becomes a strategic weapon. It mobilizes external power against the competitor, protects the group *as a whole* by framing the conflict as the outsider harming the collective, and seeks to inflict maximum reputational or institutional cost on the out-group member with minimal personal risk to any single in-group member. Winning means the *group* "wins" externally.

  2.  **How it Differs from Nearest Concepts:**
      *   **Code-Switching:** As you noted, this is deeper than just language/presentation. It's a switch in *fundamental moral logic, authority structure, and goals* based on group membership. Code-switching is a tool *within* this larger strategic shift.
      *   **Hypocrisy:** Hypocrisy implies a contradiction between stated beliefs and actions, often hidden. Here, the dual standards are **known and endorsed** within the group. It's not hidden inconsistency; it's *context-dependent rules* seen as functional for group survival and status. It's strategic adaptation, not necessarily deceit.
      *   **Tribalism/Groupthink:** These are broader. Tribalism emphasizes group identity and loyalty but doesn't specify *how* conflict resolution logic bifurcates. Groupthink focuses on flawed decision-making under pressure for conformity. Your observation is a specific *manifestation* of tribalism in conflict dynamics.
      *   **Honor/Victimhood Cultures:** The typology treats these as dominant, mutually exclusive modes for a *whole* culture/group. Your groups demonstrate that a single group can **situationally deploy different modes** based solely on the identity of the offender (in-group vs. out-group), making the typology insufficient on its own.

  3.  **Term Proposal & Definition:**
      *   **Term: Parochial Conflict Resolution (PCR)**
      *   **Definition:** A stable group strategy where the logic and mechanisms for addressing slights or conflicts fundamentally bifurcate based on the group membership of the offending party:
          *   **Internal PCR:** Applied when the offender is a core group member. Characterized by direct handling, reputation management within the group, disdain for external mediation, and a focus on maintaining internal hierarchy/cohesion ("honor" logic adapted for group stability).
          *   **External PCR:** Applied when the offender belongs to an out-group. Characterized by framing the slight as harm/victimization, immediate escalation to third-party authorities or the public, mobilization of collective outrage, and the goal of inflicting external consequences or reputational damage on the out-group ("victimhood" logic weaponized for inter-group competition).

  4.  **Boundary Cases:**
      *   **Ambiguous Membership:** What about peripheral members, allies, or individuals with dual affiliations? PCR becomes unstable or contested. Does an insult from a contractor trigger internal (direct) or external (HR) logic? Groups will often debate or have implicit rules for these grey areas.
      *   **Severity of Harm:** Does a severe physical assault internally still get handled "in-house"? Probably not; severe violations likely override PCR, forcing external systems (police, HR) even internally. PCR governs *slight-to-moderate* conflicts where group norms can apply.
      *   **"Whistleblower" Scenario:** An insider harms the group's *external* reputation or breaks a core taboo. They might be treated with *external* PCR logic internally – publicly shamed, reported to authorities *by the group* – because they are now defined as an out-group threat.

  5.  **The Reverse Arrangement:**
      *   **Observation:** Authority-language/rules internally, direct retaliation logic against outsiders.
      *   **Term:** **Institutional Pacification Internally / Honor-Based Externality (IPI/HBE)** or **Reverse Parochial Conflict Resolution**.
      *   **Definition:** A group strategy where:
          *   **Internally:** Conflict is strictly channeled through formal rules, mediation, or authority figures ("dignity" or institutionalized "victimhood" logic). Direct retaliation is suppressed to maintain internal order and predictability (e.g., corporations with strong HR, monastic orders).
          *   **Externally:** The group perceives out-groups as inherently threatening or ungovernable by shared rules. Conflicts are handled through direct confrontation, retaliation, reputation-building via toughness, and disdain for external mediation seen as biased or weak ("honor" logic applied externally).
      *   **Examples:** Highly disciplined organizations (militaries, some corporations) that demand internal compliance but fiercely defend their reputation/honor against outside criticism or competition; some insular communities; gangs enforcing strict internal codes but engaging in violent turf wars.

  6.  **Does it Break the Three-Way Typology?**
      *   **No, it *complicates* it:** The honor-dignity-victimhood typology describes **dominant modes or ideals** within a culture/group. It doesn't inherently require or assume perfect internal consistency across *all* contexts.
      *   **Hybridity & Situationality:** Your observation highlights that groups are often **pluralistic** or **hybrid** in their moral logics. The typology remains useful for identifying the *available toolkits*, but PCR shows these tools are deployed **situationally** based on a critical factor: in-group vs. out-group status.
      *   **The Typology's Strength:** The typology helps us *recognize* the different logics at play within PCR (internal uses "honor," external uses "victimhood"). PCR explains *why* and *when* a group switches between them. They are complementary frameworks.

  **Conclusion:**

  You've identified **Parochial Conflict Resolution (PCR)** – the strategic application of "honor" logic internally and "victimhood" logic externally – as a stable, endorsed group strategy. This leverages the fundamental human tendency of parochial altruism/hostility and adapts it specifically to conflict management. It's not hypocrisy but context-dependent rule application for group cohesion and competitive advantage. The established typology isn't broken; it provides the vocabulary for the logics PCR situationally employs. The reverse strategy (rules inside, honor outside) is less common but observable and could be termed **Institutional Pacification Internally / Honor-Based Externality (IPI/HBE)**. Your observation underscores that moral cultures are often complex, hybrid, and strategically adaptive.
