answer: |-
  Here's a Q&A prep sheet tailored to your audience, thesis, and the scholarly landscape on Anscombe. I've structured it by objection source, ordered by descending damage potential (how much they could undermine your core thesis or derail the discussion), with phrasing in their likely vocabulary. I've noted settled vs. contested interpretations of Anscombe upfront for clarity.

  **Key Scholarly Context on Anscombe: Settled vs. Contested**  
  *(Crucial for your credibility – address this briefly in your intro or preamble)*  
  - **Settled:** Anscombe opposed Truman’s degree primarily because the atomic bombings involved *intentionally* killing innocents (non-combatants) as a means or end. She explicitly invokes double effect (DE) to argue that Truman’s act fails the "intention/foresight" test. Her 1956 pamphlet is a key text in the revival of DE in just-war theory.  
  - **Contested (Live Debates):**  
    - Whether DE is *essential* to her argument or merely a surface feature. Some (e.g., Teichman, Gormally) see DE as central; others (e.g., Diamond, Haldane) argue her deeper concern is moral absolutism about killing innocents.  
    - Whether her position implies near-pacifism. Anscombe denied this, but scholars disagree on whether her logic consistently allows *any* modern warfare (e.g., Ford’s critique).  
    - Whether her "authority" claim (no one may kill innocents for the common good) is foundational or derivative. Your thesis leans toward the minority "foundational" reading.  
  *Recommendation:* Open with: "While Anscombe explicitly uses double-effect language, I argue this is secondary to her unyielding principle that no authority exists to deliberately kill innocents—a reading supported by X, Y, but contested by Z." 

  ---

  ### **Q&A Prep Sheet: Objections Ranked by Damage Potential**  
  *(Damage Scale: High = could collapse your thesis; Medium = challenges coherence/practicality; Low = localized/side issue)*  

  ---

  #### **1. Objection from War Studies Instructors (Proportionality/Military Necessity Focus)**  
  **Phrasing:** "Your argument ignores the reality of asymmetric warfare. In our precision raid example, the shanty town deaths are *proportionate* and *militarily necessary* — the plant is critical to enemy air power, and there’s no feasible alternative. If we accept your ‘no authority’ principle, it paralyzes legitimate defense. Are you saying commanders must abandon missions with *any* foreseen civilian risk? That’s not just war; it’s surrender."  
  **Damage:** High (directly attacks practical viability; audience sympathy likely with them).  
  **What to Concede:** Proportionality and necessity are essential frameworks for military ethics; avoiding *all* civilian risk is impossible in war.  
  **What to Hold:** Anscombe’s principle denies that proportionality/necessity *license* killing innocents—they merely describe trade-offs. Without "supreme emergency" (which she rejects), you lack *moral authority* for foreseen-but-avoidable killing, even in "clean" cases.  
  **2-Minute Answer:**  
  > "I agree proportionality and necessity are crucial tools. But they don’t resolve Anscombe’s core challenge: *Who has the right to decide* that these workers’ families are an acceptable cost? She argues no authority exists to morally license killing innocents for others’ good—only to stop unjust aggressors. Your ‘no alternative’ claim is factual; hers is normative: even if necessary, it’s *ultra vires*. Precision raids reduce risk, but if we foresee avoidable deaths (e.g., not evacuating the shanty town), we’re still choosing to kill for the mission. That’s what she condemns—not the calculus, but the act’s moral permissibility."  
  **Soft Spot:** Admitting this *could* paralyze real-world operations. Bolster with: "Anscombe likely saw this as a feature, not a bug—forcing us to question whether ‘clean war’ is an illusion."  

  ---

  #### **2. Objection from Double-Effect Philosophers (Textual/Loyalty Focus)**  
  **Phrasing:** "You’re misreading Anscombe. She *explicitly* uses DE to distinguish Truman from ‘permissible’ cases like tactical bombing. If DE is ‘doing no work,’ why does she spend pages on intention? Your ‘authority’ claim is just DE in disguise—it’s about whether the deaths are intended as a means. Ditch DE and her argument against Truman collapses."  
  **Damage:** High (challenges your core thesis and scholarly accuracy).  
  **What to Concede:** Anscombe uses DE extensively; rejecting it entirely risks misrepresenting her.  
  **What to Hold:** DE is a *diagnostic tool* for her, not the *moral foundation*. Her deeper point is that DE can’t license killing if the agent lacks authority to cause death for the greater good. The "clean raid" fails because it still assumes that authority.  
  **2-Minute Answer:**  
  > "You’re right that Anscombe deploys DE—but I argue it’s secondary. She uses DE to *show* Truman intended innocents’ deaths, but her condemnation rests on a prior principle: *no one may kill innocents for the common good*. In the clean raid, DE might redescribe deaths as unintended, but workers’ families are still *used* (e.g., as deterrents to evacuation). For Anscombe, what’s decisive isn’t intention, but that we lack the standing to impose death on non-aggressors. DE doesn’t create authority; it assumes it. Strip that away, and even ‘unintended’ killing lacks justification."  
  **Soft Spot:** If pressed, admit this is a "minority but defensible" reading. Cite Diamond: Anscombe’s absolutism precedes DE.  

  ---

  #### **3. Objection from Consequentialist (Utility Focus)**  
  **Phrasing:** "This is moral fetishism. If the raid saves 10,000 lives by shortening the war, forbidding it over ‘authority’ is monstrous. Should we let millions die to keep our hands clean? Anscombe’s deontology ignores consequences—but we live in the real world."  
  **Damage:** Medium (audience may sympathize; challenges moral intuition).  
  **What to Concede:** Consequences matter immensely; refusing the raid *could* cause greater harm.  
  **What to Hold:** Anscombe denies that outcomes can *confer* authority to kill innocents. If you accept supreme emergency here, it licenses Hiroshima—which she abhors.  
  **2-Minute Answer:**  
  > "I share your horror at refusing life-saving actions. But Anscombe’s point is that ‘saving more lives’ doesn’t magically grant permission to kill blameless people—it assumes an authority we don’t possess. If consequences override all, Truman is vindicated. She forces us to ask: *Can* we ‘license’ killing innocents collectively? Her answer is no—even if it costs us. We might reject this, but then we must defend supreme emergency, not hide behind DE."  
  **Soft Spot:** Consequentialism is intuitive. Stress: "This isn’t my personal view, but Anscombe’s logic—and it exposes a rift in just-war theory."  

  ---

  #### **4. Objection from Pacific War Historian (Counterfactual Fatigue)**  
  **Phrasing:** "This is armchair philosophy. Truman faced a binary choice: bomb or invade Japan, costing millions of lives. Your ‘clean raid’ is hypothetical; in 1945, precision bombing was unreliable. Anscombe ignores context—she wasn’t there."  
  **Damage:** Low (won’t sway philosophers, but could alienate pragmatists).  
  **What to Concede:** Historical context is vital; alternatives to Hiroshima were grim.  
  **What to Hold:** Anscombe’s argument is principled, not contextual. She rejects "lesser evil" justifications for killing innocents *regardless* of circumstances.  
  **2-Minute Answer:**  
  > "I agree—we must study history humbly. But Anscombe isn’t judging Truman’s options; she’s denying *anyone* may choose to kill innocents for the greater good, even in dire straits. Her point stands whether the raid is real or hypothetical: if we lack authority, context can’t grant it. We might reject her principle, but we can’t dismiss it as ahistorical—it’s a moral claim."  
  **Soft Spot:** Historian may disengage. Pivot: "Even in modern ‘clean’ warfare, her principle challenges targeting decisions."  

  ---

  #### **The Question You Hope Nobody Asks (But Prepare For)**  
  **Phrasing:** "Isn’t this just pacifism? If even your precision raid fails, what *can* we do? Anscombe supported just wars—are you saying she’s inconsistent?"  
  **Damage:** High (could paint you as extreme; forces you to defend "near-pacifism").  
  **Response Strategy:**  
  - **Concede:** Anscombe endorsed killing combatants in just wars.  
  - **Hold:** She defined "combatant" narrowly (e.g., direct threats) and rejected *any* foreseen killing of non-combatants. Modern war blurs this line.  
  - **2-Minute Answer:**  
  > "Anscombe isn’t a pacifist—she allows killing unjust aggressors. But she’d likely condemn most modern warfare because it inevitably involves foreseen civilian deaths. My ‘precision raid’ isn’t pacifism; it’s her view taken seriously. Workers in a factory aren’t aggressors; their families certainly aren’t. If we lack authority to kill them, even for good ends, we must either re-think what’s permissible or admit war is unavoidably immoral. That’s her bullet, not mine."  
  **Soft Spot:** Admitting this borders on pacifism. Mitigate with: "This doesn’t forbid all force—e.g., hostage-rescues targeting captors—but it *does* shrink the ‘just war’ window drastically."  

  ---

  **General Q&A Tactics:**  
  - **Order:** Expect War Studies first (practical pushback), then DE philosophers (textual), then consequentialist (ideological), historian last (frustration).  
  - **Tone:** Use physicist credibility: "As an experimentalist, I see DE as a *descriptor*, not a justifier—like distinguishing measurement error from systemic bias."  
  - **When Stuck:** "That’s an excellent point—I’d need to refine my view on X, but Anscombe’s core challenge remains Y."  
  - **Timekeeping:** For 25-minute talks, Q&A often overruns. Prioritize 2-minute answers; offer to discuss deeply post-seminar.  

  This prep sharpens your thesis against high-damage objections while respecting Anscombe scholarship. Good luck—your argument is bold and worthy of debate.
