prompt: |-
  Is there a name for this? I keep noticing a pattern in how much credit a story gets, and I'm not satisfied with the couple of words people have offered me for it.

  Here's the shape of it. Two people have exactly the same pile of facts in front of them. All of it is already known to both of them — nothing new gets discovered, no new measurement gets taken. Each of them produces a story that fits the facts. The fits are, as far as anyone can tell, equally snug: same number of loose ends, same amount of detail accounted for, same awkward bits left over. But one person built their story by looking at those facts and adjusting it until it fit, and the other built their story for reasons that had nothing to do with those facts and only afterwards noticed that it fit. Everyone involved — including me, including the person who built the tuned story — treats the second one as being in much better shape. And when I try to say out loud why, I end up flailing.

  Three cases that I think are the same thing, or two of one and one of another:

  1. At work, two analysts are given the same internal spreadsheet of last year's customer cancellations. Both have had access to it for months. One builds a model by fitting curves to that spreadsheet. The other spends her time on support-call transcripts, forms a story about why people cancel, and then checks it against the spreadsheet; it lands about as well as the fitted one. Nobody thinks these two are in the same epistemic position, and I agree — but the data is identical and equally old in both cases.

  2. A historian friend has a theory about crop rotation that predicts a very specific up-and-down pattern in tithe records. The records are printed, public, and have been sitting in a county archive for a century; nobody ever tabulated them. She spends three weeks tabulating. The pattern is there — but it could easily not have been, and if it hadn't been, her theory would be dead. This feels like a real test to me even though not one new fact about the world came into it. Is it the same phenomenon as case 1, or a different one?

  3. The one that breaks my rule of thumb. Sometimes a story has essentially no dials to twiddle — nothing to adjust — and it was built with the fact in full view, but it lands on some extremely specific detail that nobody had thought to connect to anything. My rule of thumb says: built while staring at the fact, so no credit. My gut says: credit, obviously. One of those is wrong.

  What I've been handed so far doesn't fit. Someone told me it's "ad hoc," but as far as I can tell that's about extras bolted onto a story after it gets into trouble, whereas my thing is about how the story was originally built. Someone else pointed me at something called the problem of old evidence, which I gather is about how a fact you already knew can't move your probabilities. That sounds like it's about the facts being old, not about the route by which the story was arrived at — and it seems to apply equally to both of my analysts, so it can't be what's generating the difference in credit between them. That's exactly what I care about: the difference comes from a fact about the history of the person's thinking, not from anything about the world, and that makes me suspicious that it isn't a real epistemic difference at all.

  So: is there an established concept for this? If the nearest established concepts are the two I mentioned, I want to know precisely how each of them cuts the territory and which of my three cases each one does and doesn't cover — and what's actually doing the work when the tuned story gets discounted. Also: how finely can you draw the line, given that nobody ever builds a story in a vacuum and everyone has background facts in view the whole time? Is "built by staring at the data" a difference in kind or a difference in degree, and if degree, what's the scale? If there's no established concept, I'd rather have a coined term with a real definition and clear boundary cases than a name. A label on its own won't tell me anything.
reasoning: |-
  Okay, the user is describing a pattern they've noticed regarding how much credit different stories receive when explaining the same set of facts. They present three cases and want to know if there's a name for this phenomenon. They've already been suggested "ad hoc" and the "problem of old evidence," but neither seems to fit perfectly. Let me break this down.

  First, the core issue: two people have identical facts, both create equally fitting stories, but the one who didn't tune their story to the data gets more credit. The user is puzzled because the difference lies in how the story was constructed, not the facts themselves.

  Looking at the cases:
  1. Two analysts with the same data. One fits curves, the other derives a story from support calls and then checks. The latter is trusted more.
  2. A historian's theory predicts a pattern in existing records. She tabulates and finds it. The user sees this as a real test even though no new data was generated.
  3. A story built while staring at the data but makes a specific connection no one else saw. Here, the user's initial rule (no credit) clashes with their intuition (credit deserved).

  The user rejects "ad hoc" because it's about post-hoc adjustments, not the initial construction. The "problem of old evidence" doesn't explain the differential credit between the two analysts since both used old data.

  I need to recall relevant philosophical concepts. The difference in credit seems tied to the method of hypothesis generation. The analyst using support calls and the historian had prior frameworks (explanatory models) before checking the data. The curve-fitting analyst adjusted the model to fit, which feels like overfitting or lack of independent grounding.

  Key concepts that come to mind:
  - **Prediction vs. Accommodation**: When a theory predicts data it wasn't designed for, it's stronger than one that accommodates existing data. The historian's case is a prediction even though the data existed; she didn't know the outcome. The analyst using support calls had a model from a different data source, so it's somewhat predictive for this dataset.
  - **Overfitting**: The curve-fitter might have a model too tailored to the data, capturing noise rather than the underlying pattern. The other analyst's model, derived from qualitative data, might generalize better.
  - **Explanatory Coherence/Consilience**: Models that integrate diverse data sources (like support calls and cancellation data) are more robust. The curve-fitter only used one dataset.
  - **Epistemic Security**: How the hypothesis was generated matters. If it comes from an independent process, it's less likely to be biased by the data it explains.

  Case 2 is prediction because the historian didn't know the pattern was there; tabulating was testing the theory. Case 3 is tricky—the specific insight might show consilience if it connects disparate facts, even if built with data in view. The key is whether the connection was obvious or required deep understanding.

  The user's suspicion about the difference being about the history of thinking touches on the "generative vs. justificatory context" distinction. Philosophers like Lakatos and Laudan discuss how the origin of a hypothesis affects its perceived strength, even if justification is separate.

  So, the main concepts are prediction vs. accommodation and overfitting. The differential credit stems from the risk of tuning the model to the data, which undermines its reliability. The historian's case is predictive, hence stronger. Case 3's insight might be abductive, inferring the best explanation, which is credible if it resolves something previously unexplained.

  The user also asks about the line between tuning and not. It's a spectrum. Factors include how much the hypothesis was adjusted to fit, the diversity of data sources, and whether the prediction was risky. Clear cases exist, but many are gray, requiring transparency about the process.

  In summary, prediction vs. accommodation is the key framework, with overfitting as a related issue. The historian's successful prediction is a classic example. Case 3's insight gains credit due to its specificity and explanatory power, showing that not all data-staring is equal—it's about generating non-obvious connections.
answer: |-
  Your observation cuts to the heart of scientific and epistemic reasoning, and you're right that common terms like "ad hoc" or "problem of old evidence" don't fully capture it. The phenomenon you're describing is best understood through two interconnected concepts: **prediction vs. accommodation** and the associated risk of **overfitting**. I'll break this down step by step, map it to your cases, address your core questions, and explain why the difference is both real and epistemically significant.

  ### Core Concept: Prediction vs. Accommodation
  - **Prediction**: A hypothesis is generated *before* seeing the relevant data it aims to explain. The data is then used to *test* the hypothesis.
  - **Accommodation**: A hypothesis is generated or adjusted *after* seeing the data, specifically to fit it.
  - **Why prediction is stronger**: A predictive hypothesis is riskier—it could have been falsified. Accommodation is safer but less impressive because it can be reverse-engineered to fit almost any dataset. Philosophers of science (e.g., Maher, Hitchcock) argue that successful predictions provide stronger evidence for a theory's truth or robustness because they demonstrate the theory isn't just "curve-fitting" the known data.

  This framework explains the epistemic difference in your cases:
  - **Case 1 (Analysts)**:  
    - The curve-fitting analyst **accommodated** the data. Their model is built *from* the cancellation spreadsheet, so it lacks independent grounding.  
    - The support-call analyst **predicted** the cancellation pattern based on an external source (transcripts). Her hypothesis was generated *before* checking the spreadsheet, making its fit more surprising and less likely to be cherry-picked.  
    - **Credit difference**: Her story gets more credit because it demonstrates **consilience**—the same pattern emerged from two independent sources (qualitative transcripts + quantitative spreadsheet). This reduces the risk of overfitting.

  - **Case 2 (Historian)**:  
    - This is a **pure prediction**, even though the data was "old." She generated the theory *before* tabulating the tithe records. If the pattern hadn't been there, her theory would have been falsified.  
    - **Why it's a real test**: The key is not whether data is "new," but whether the hypothesis was exposed to *unexamined risk*. She didn't know the pattern existed—tabulating was an act of testing, not tweaking. This is epistemically identical to discovering new data.  
    - **Relation to Case 1**: Same phenomenon. Her credit comes from prediction, not novelty of data.

  - **Case 3 (No-dials story)**:  
    - Your initial rule ("built while staring, so no credit") is too rigid. What matters is whether the story **explains a previously puzzling fact** through a **non-obvious connection**.  
    - **Why it deserves credit**: If the story resolves an unexplained detail (e.g., "Why did X happen?") without adjustable parameters, it’s an **abductive inference** (inference to the best explanation). Even if built with data in view, its specificity and lack of tunability make it less suspect of overfitting. Example: Darwin "stared at" biogeographical data but connected it to evolution via a mechanism (natural selection) that explained quirks no one else linked.  
    - **Boundary**: If the "specific detail" was already well-understood and the connection is trivial, credit diminishes. The insight lies in resolving something *unexplained*.

  ### Why Established Terms Fall Short
  - **Ad hoc**: Correctly rejected. It describes *post-hoc modifications* to save a theory (e.g., adding epicycles to Ptolemaic astronomy), not initial construction.
  - **Problem of old evidence**: Relevant but incomplete. It asks how pre-known data can confirm a theory (Bayesian puzzles). It *doesn't* address why **how the theory was generated** affects credit. Both your analysts used old evidence, but only one leveraged prediction.

  ### What's Doing the Work? Epistemic Risk and Independence
  The credit difference stems from **how the hypothesis engages with epistemic risk**:
  - A hypothesis built *independently* of the target data (e.g., from support calls) risks falsification when tested against that data. Success suggests robustness.
  - A hypothesis built *by tuning* to the target data faces no such risk—it's designed to fit. This invites **overfitting** (mistaking noise for signal), especially with flexible models (e.g., curves with many parameters).

  This is not *just* about psychology; it's about **avoiding bias**. Tuning exploits dataset-specific quirks, reducing generalizability. Prediction tests whether the pattern holds beyond the data used to generate the hypothesis.

  ### Drawing the Line: Kind vs. Degree?
  - **Difference in kind?** Yes, between **prediction** (hypothesis precedes data-checking) and **accommodation** (hypothesis follows/adapts to data). The historian’s case is unambiguously prediction.
  - **But it’s blurry in practice**: Background knowledge always influences hypotheses. The scale is **degree of independence**:
    1. **High independence** (high credit): Hypothesis from a genuinely separate source (e.g., support calls → spreadsheet).
    2. **Medium independence** (moderate credit): Hypothesis from related but distinct data (e.g., last year’s spreadsheet → this year’s).
    3. **Low independence** (low credit): Hypothesis built by iteratively tweaking a model on the target dataset.

  ### Coined Term: Generative Independence
  If you need a crisp label, call it **Generative Independence (GI)**:
  - **Definition**: The degree to which a hypothesis is generated without direct optimization toward the target dataset.
  - **Clear boundary**: GI is high if the hypothesis would have been the same had the target data been unknown or different. Low if it was shaped by that data.
  - **Applies to your cases**:
    - Support-call analyst: High GI (from transcripts).
    - Historian: High GI (from theory, before tabulating).
    - Curve-fitting analyst: Low GI (built on the data).
    - Case 3 (specific insight): Medium GI if background knowledge drove a non-obvious link; low GI if it was a trivial observation.

  ### Why This Isn't "Just Psychology"
  The credit assignment is epistemically sound because GI mitigates **confirmation bias** and **overfitting risk**. We discount tuned stories not because of arbitrary history, but because they haven’t been stress-tested. A predictive theory survives a potential "reality check"; an accommodated theory does not. In your historian’s case, the theory was *tested* by the tithe records—even if the data existed, her *ignorance of the outcome* made it a valid test.

  ### Practical Implications
  - In science: Preregistration of hypotheses (before data collection) maximizes GI.
  - In your work: The support-call analyst’s model likely has better out-of-sample performance because it wasn’t overfit to the spreadsheet. Her method deserves more credit for decision-making.
  - For Case 3: Credit hinges on explanatory power, not GI alone. If the insight resolves a genuine puzzle, GI matters less because there’s no "tuning" to distrust.

  **Bottom line**: The core phenomenon is **prediction vs. accommodation**, amplified by **independence of evidence**. "Generative Independence" captures the mechanism. It’s a real epistemic distinction—not just a cognitive bias—rooted in avoiding self-deception when modeling the world. Your intuition in Case 3 is correct: when a story has no dials to twiddle, its specificity and explanatory power outweigh GI concerns.
