prompt: |-
  I'm not an academic — I came at this from a practical place. I'm filling in an advance directive (the form where you say what you want to happen later if you can't decide for yourself anymore), and its got me stuck on one thing: how much should present-me defer to future-me? A friend mentioned something in philosophy called the Reflection principle: roughly, if you somehow knew that your future self would end up 70% confident in something, you should be 70% confident now. That strikes me as either very deep or obviously wrong, and I can't tell which.

  I've got a couple months of evenings before I need to sign, and I'd rather spend them on the part that actually decides my question. So: which of the open questions around Reflection is worth my time? Ones I've run into, in my own words:

  - is it a basic rule of rationality, or does it just fall out of some other rule (in which case I should go look at that other thing)?
  - does it apply when future-me simply knows more, or also when future-me has changed — forgotten things, been talked into something, gone foggy, started caring about different stuff?
  - does violating it make you irrational, or just exploitable in the "money pump" / betting sense — and does that difference matter for what I write on the form?
  - what if the "future self" is only loosely me: me after a stroke, or the version of me that my family and doctors will be reading this form back to?
  - is this even about belief at all, or is it really about commitment and planning?

  Add whatever I've missed. Then rank them: which one or two are upstream of the others, which are cheap enough that I can settle them myself in an evening, and which are gadgets that won't change what I actually sign. Commit to an ordering and give me your reasons rather than laying out the menu — and tell me where you're guessing versus where there's a settled answer I should just take.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're working on an advance directive and are stuck on how much present-me should defer to future-me. They mentioned the Reflection Principle and have several philosophical questions about it. The user isn't an academic, so they need practical advice tailored to their situation.

  First, I need to identify their core concern: making a decision now that affects their future self, especially when that future self might be impaired. The Reflection Principle seems central here, but they're unsure if it's applicable. They listed specific questions, and I have to prioritize which ones are most relevant to their advance directive.

  Looking at their questions:
  1. Is Reflection a basic rule or derived from something else?
  2. Does it apply when future-me knows more vs. has changed?
  3. Does violating it make you irrational or exploitable?
  4. What if the future self is only loosely "me"?
  5. Is this about belief or commitment/planning?

  The user wants these ranked by importance, upstream relevance, and practicality. They also need to know which can be resolved quickly and which might not affect their decision.

  Starting with the meta-question: this is about commitment, not just belief. That shifts the focus from epistemology to practical decision-making. For advance directives, the key is ensuring their values are respected, even if their future self changes. So question 5 seems foundational here. If the Reflection Principle is about belief, but the directive is about values, then the principle might not directly apply. That's probably the most upstream issue.

  Next, the nature of the future self. In the context of an advance directive, the future self could be impaired (stroke, dementia). The Reflection Principle assumes continuity of rationality, which might not hold. So question 4 is crucial because if the future self isn't truly "them" rationally, then deferring might not make sense. This ties into the commitment aspect.

  Then, why Reflection isn't the right tool. The principle works when future-me knows more, but if they've changed fundamentally, it doesn't apply. The user needs to protect their current values against future incapacity. So question 2 helps distinguish between knowledge gain and fundamental change, which is vital for their form.

  The other questions—whether Reflection is basic or derived (question 1) and the implications of violating it (question 3)—are more theoretical. While interesting, they don't directly impact the practical decision about the advance directive. Knowing if it's a basic rule won't change how the user fills out the form. Similarly, exploitability is more relevant to betting scenarios than healthcare decisions.

  The user's deeper need is clarity on how to make a binding decision now that respects their current autonomy while accounting for potential future incapacity. They might be worried about their future self's ability to make rational decisions or being influenced by others. The advance directive is a tool to maintain control, so emphasizing commitment and values over belief aligns with that goal.

  Prioritizing question 5 (commitment vs. belief) and question 4 (identity of future self) addresses the core of their dilemma. These can be resolved by understanding that advance directives are about value commitment, not epistemic deference. The other questions are secondary and can be set aside as they won't affect the form's content.

  The user can spend an evening reflecting on their core values and worst-case scenarios, which is more productive than delving into philosophical nuances of rationality. Recommending a TED Talk or practical worksheet might help them focus on what matters for their directive.
answer: |-
  You're right to focus on the core decision rather than getting lost in philosophy. Here's a prioritized roadmap based on what **actually matters for your advance directive**, cutting through the academic noise:

  1.  **#5: Is this even about belief at all, or is it really about commitment and planning?** (Settled Answer - Crucial)
      *   **Why this is #1 & Upstream:** Reflection is fundamentally about *epistemic rationality* (beliefs/knowledge). **Advance directives are fundamentally about *practical rationality* (values, goals, commitment).** This distinction is the master key. You aren't trying to predict what your future *beliefs* will be about medical facts; you're making a *commitment* now about what *actions* should be taken based on your *current values and understanding of a good life*, especially when future-you may lack the capacity to express or act on *any* coherent values or beliefs. Confusing belief-deference with value-commitment is the root of your stuckness. **Settled:** For ADs, it's commitment and planning. Forget Reflection as a belief principle here.
      *   **Impact on Form:** Direct & High. Understanding this liberates you. Your job isn't to guess what future-you might want if they were competent but different; it's to define *now* what constitutes an unacceptable quality of life *for you* based on *your current values*, knowing future-you might be unable to advocate. Focus on concrete states (e.g., "unable to recognize loved ones," "permanent ventilator dependence," "severe unrelenting pain") and the interventions you do/don't want in those states.

  2.  **#4: What if the "future self" is only loosely me?** (Settled Answer - Crucial)
      *   **Why this is #2 & Upstream:** Reflection assumes a continuous, rational agent. The *entire point* of an advance directive is to account for scenarios where **this continuity is profoundly broken** (dementia, severe brain injury, persistent vegetative state). Future-you in these scenarios isn't a rational agent updating beliefs; they are a profoundly altered or non-existent agent. Deferring to that "self" via Reflection is nonsensical and defeats the purpose of the AD. **Settled:** ADs explicitly anticipate the "loosely me" scenario. You are *not* deferring to *that* future self; you are giving instructions *despite* that future self's inability to participate.
      *   **Impact on Form:** Direct & High. This clarifies the scope. Your directive binds caregivers *precisely because* the future self isn't "you" in any meaningful decision-making sense. Legally and ethically, the "you" writing the directive *is* the authentic self making the decision for the incapacitated entity that bears your name.

  3.  **#2: Does it apply when future-me simply knows more, or also when future-me has changed?** (Settled Context - Important)
      *   **Why this is #3 & Context:** Reflection *can* apply when future-you knows more (rational updating) but generally *fails* when future-you has fundamentally changed values, preferences, or cognitive capacity (the AD scenario!). This question helps solidify *why* #1 and #2 are paramount. **Settled:** In the *knowledge gain* scenario (e.g., learning a diagnosis), Reflection *might* be relevant for belief formation, but **not** for overriding the *value commitments* made in an AD. In the *fundamental change* scenario (the AD target), Reflection is irrelevant.
      *   **Impact on Form:** Indirect but Important. Reinforces that your current values, informed by your *current* understanding of potential future states (even if imperfect), are what matter. You aren't required to predict how future-you *might* adapt; you're setting boundaries based on what *current-you* finds unacceptable.

  4.  **#3: Does violating it make you irrational, or just exploitable?** (Mostly Settled - Low Relevance)
      *   **Why this is #4 & Low Priority:** This is deep in academic decision theory. Violating Reflection *can* make you vulnerable to money pumps or Dutch books (exploitable), which is a form of practical irrationality. **However:** This applies to *beliefs and preferences assumed to be stable over time*. It **does not apply** to the core value commitments in an AD, where you *anticipate* and *plan for* fundamental instability. **Settled:** The exploitability argument doesn't meaningfully transfer to the AD context.
      *   **Impact on Form:** Negligible. Don't waste time here. Your AD isn't a series of bets; it's a set of instructions based on values.

  5.  **#1: Is it a basic rule or derived?** (Academic Debate - Negligible Relevance)
      *   **Why this is #5 & Lowest Priority:** This is purely academic philosophy/decision theory. Whether Reflection is fundamental or derived from other axioms (like coherence over time) is fascinating for theorists but provides **zero** practical guidance for your AD. Knowing the answer won't change a single word you write.
      *   **Impact on Form:** None. A philosophical gadget.

  **Your Action Plan (Based on the Priorities):**

  1.  **Accept the Core Settled Answers (Evenings 1-?):** Internalize that your AD is a **commitment device** expressing your **current values** to protect against a future state where **you are fundamentally incapable** of expressing *any* values. This resolves the core "deferral" dilemma: *You are not deferring. You are deciding.*
  2.  **Focus on Values & Scenarios (The bulk of your time):**
      *   **What are your core values about life, dignity, suffering, and dependence?** (Not beliefs, *values*).
      *   **What specific health states would violate those values so profoundly that life-prolonging treatment would be unwanted?** Be as concrete as possible.
      *   **What interventions are acceptable/unacceptable to you *in those specific states*?** (e.g., CPR, ventilator, feeding tube, antibiotics).
      *   **Who do you trust (Healthcare Proxy) to interpret your directive and make decisions in unforeseen situations?** This is often *more* important than the specific form clauses.
  3.  **Consult Resources (Cheap & Practical):**
      *   **Talk to your doctor:** Discuss realistic scenarios and interventions relevant to your health history. What do terms like "terminal," "permanent unconsciousness," "severe dementia" actually mean medically?
      *   **State-Specific Forms & Guides:** Ensure you use the correct form for your state/jurisdiction. Non-profit hospice/palliative care organizations (e.g., Compassion & Choices, state Hospice organizations) often have excellent, plain-language guides explaining options.
      *   **Talk to your Proxy:** Ensure they understand your values and feel capable of acting on them.

  **In short:** Forget the Reflection Principle for this task. It addresses a different problem (belief updating in a rational agent) than the one you face (value commitment anticipating profound incapacity). Your directive is **your voice now, for when you cannot speak later.** Focus your energy on clarifying that voice and the concrete situations where it needs to speak the loudest. Use the evenings to deeply reflect on *your values* and document them clearly.
