prompt: |-
  I'm a senior at a fairly large public high school, and for the last few months a friend and I — we are both on the debate team, though he is much better at it than I am — have been arguing between rounds and on the bus home about whether a state has any right at all to keep people out. We agree on the starting point: a state owes a justification to each person it coerces, and coercion without a justification owed to the person coerced is just force. The disagreement is about where that starting point leads. He has built an argument he calls "the border is not a moment," and it ends somewhere I am confident is wrong but cannot locate. Here it is as cleanly as I can put it. (1) A state may do something to a particular person only if it can justify doing it to that person. (2) Refusing someone at the airport, turning a boat back, deporting someone after a year, and deporting someone after twenty years are all exercises of one and the same power — the power to decide whether a person may remain — and they differ only in how long that person has already been within the state's reach. (3) Whether that power is legitimate cannot depend on how long the person has been within the state's reach, because the duration is itself fixed by the state: it is the state's own decision not to act sooner that creates the interval it would later cite against the person. Call this the anti-accrual premise. (4) So either the state may remove anyone it has never formally admitted, at whatever point it chooses, or it may remove no one at all. (5) It plainly may not remove the man who has lived here twenty years, pays taxes, and whose children were born here. (6) So it may not remove anyone, including at the border: there is no right to exclude. (7) But by (2) and (3) the same holds for every other excluder — I may not ask a guest to leave my house once he has been in it for an hour, since the hour is a product of my own failure to ask sooner; a university may not expel; no one may end a friendship. (8) That last claim is absurd, so the argument has gone wrong somewhere.

  I would most like to hold on to (1) and (5): the first is the premise we began from, and the second feels like a fixed point rather than an intuition I can bargain with. I could live without (2) or (3), but I want to know what each costs, and what my friend's argument looks like if you repair it rather than scrap it. When I pressed him on (5) he offered a fallback he calls membership by adverse possession: time spent inside the state's coercive jurisdiction slowly converts into a claim not to be removed, so the right to exclude is genuine but expires, the way a statute of limitations runs out. I asked whether a state could defeat that by never letting the clock start — admitting everyone on explicitly temporary, annually renewed terms, so that no one is ever present without permission for long — and he said the clock does not care what the paperwork says, because what does the work is a person's life and not a stamp. I cannot tell who is right about that either, so please take it on as well.

  What I want from you is a diagnosis: which step you reject, why that step looked fine on the way in, and what the other candidate rejections would cost me — what I lose if I keep (1) and (5) and give up (2), and what I lose if I give up (3) instead. Please argue from the moves themselves rather than from the literature: I do not need authors, papers, or a reading list, and a roster of famous names would not help me settle this with him on a bus. Be explicit, too, about the standing of your own answer: tell me where your diagnosis is most likely to be wrong, and name the one consideration or argument that would move you to a different step — I would rather have a verdict I can test against him than a confident one.
reasoning: |-
  Okay, this is a dense and fascinating philosophical puzzle from a high school debate student. The core tension is between two strong intuitions: that states must justify coercion to each individual (premise 1), and that long-term residents can't be arbitrarily deported (premise 5). The friend's "border is not a moment" argument tries to bridge these but ends in absurdity by denying all exclusion rights. 

  First, I need to map the argument's anatomy. Premise 2's equation of border refusal with deportation after 20 years feels like the hidden load-bearing wall here. The student mentions this premise might be negotiable, but I suspect they haven't fully grasped how much work it's doing. The friend's "anti-accrual" move in premise 3 cleverly exploits the state's control over timing, but that only works if we accept premise 2's collapsing of distinct actions into one "power."

  Hmm, the adverse possession analogy is revealing. When the student asks about temporary visas stopping the clock, they're actually touching on what philosophers call the "voluntariness" criterion - whether consent matters for political obligation. The friend's dismissal of paperwork suggests he sees physical presence as morally constitutive, which is a strong communitarian position. That might be the real fault line.

  For the diagnosis, I should start by rejecting premise 2. The cost is admitting that duration creates qualitative changes - but that's actually intuitive (think hospital visitor vs squatter). The harder sell will be explaining why state coercion at t=0 needs less justification than at t=20 years without abandoning premise 1. Maybe distinguish between coercion types: refusal at entry versus uprooting established life.

  If I keep premise 2 but ditch premise 3's anti-accrual claim, the cost is allowing the state to weaponize delay - but we already accept statutes of limitations, so that's not catastrophic. Still, it feels icky for immigration policy.

  Biggest worry: my solution might fail if the friend presses on "coercive jurisdiction." Does mere presence in territory automatically trigger full justificatory burden? That could unravel everything. The one argument that'd make me switch steps is if he proves all exclusions are equally destructive to life plans - but border refusal usually allows planning alternatives while deportation doesn't.
answer: |-
  Your friend's argument is clever but contains a critical flaw in **premise 2**. Here’s a step-by-step diagnosis, the costs of rejecting other premises, and the vulnerability of my own position:

  ### **The Flaw: Premise 2 (Collapsing Distinct Powers)**
  **Why it fails:**  
  Turning someone away at the border and deporting a long-term resident **are not the same power** morally, even if legally categorized under "exclusion." They differ in:  
  - **Moral context:** Refusing entry prevents a future relationship; deportation severs an existing one.  
  - **Reliance interests:** A 20-year resident builds a life (job, family, community) relying on the state’s implicit acceptance; a border rejectee has no such reliance.  
  - **Harm inflicted:** Deportation dismantles an integrated life; refusal at entry denies an opportunity.  

  **Why it looked plausible:**  
  Legally, both acts exercise state sovereignty over entry/removal. But legality ≠ moral equivalence. Your friend’s "anti-accrual" premise (3) only works if we accept (2)’s claim that time is the *only* variable. It isn’t.  

  --- 

  ### **What Rejecting Other Premises Costs You:**
  1. **Reject Premise 1 (State must justify coercion per person):**  
     - **Cost:** Abandons your core commitment to individual justification. States could exclude arbitrarily (e.g., racism) without owing explanations. This violates your foundational view of legitimacy.  
     - *Unacceptable; this is non-negotiable for you.*  

  2. **Reject Premise 3 (Anti-Accrual):**  
     - **Cost:** Allows states to "trap" people by delaying deportation. E.g., a state could let someone live 19 years, then deport them before "membership" vests. This rewards bad faith and undermines fairness.  
     - *Plausible but risky:* You’d need a clear principle for when presence becomes "reliance" (e.g., 5 years? tax contributions?). This invites line-drawing problems.  

  3. **Reject Premise 5 (Can’t deport 20-year resident):**  
     - **Cost:** Sacrifices your "fixed point." If states can uproot integrated lives, coercion loses its moral anchor. This also validates your friend’s slippery slope to open borders.  
     - *Unacceptable; this is the intuition you refuse to bargain with.*  

  ---

  ### **Repairing the Argument (Without Scrapping It):**
  Your friend’s "adverse possession" fallback is salvageable with modifications:  
  - **What he gets right:** Time + lived experience *can* generate legitimate claims. Paperwork alone shouldn’t override moral reality (e.g., a 20-year "temporary" worker with a family has roots).  
  - **The fix:** Add a **reliance principle**. A state cannot remove someone if:  
    (a) The person reasonably relied on continued presence (e.g., built a life), *and*  
    (b) The state fostered that reliance (e.g., accepted taxes, didn’t enforce removals).  
  - **Temporary visas?** If terms are explicit *and* enforced (e.g., yearly renewals with no path to permanence), reliance is unreasonable. But if the state *de facto* tolerates overstays for decades, the "clock" runs.  

  **Cost of this repair:** It concedes that exclusion power *can* expire, but only when reliance is demonstrable. Border refusal remains justifiable (no reliance exists).  

  ---

  ### **Where My Diagnosis Is Weak:**
  - **Greatest vulnerability:** If your friend insists that **all physical presence** in a territory triggers an identical claim to justification, *regardless of duration or reliance*. This resurrects premise 2 by claiming that "being subject to state coercion" (even briefly) demands equal scrutiny.  
    - **What would move me:** If he proves that *all* exclusions (even at borders) inflict comparable harm (e.g., by denying refuge to a fleeing dissident). I’d then retreat to rejecting **premise 3** (anti-accrual) and accept that states can’t weaponize delay.  

  ---

  ### **Bus-Ready Summary for Your Friend:**
  > *"Your argument falsely equates refusing a border crosser with deporting a 20-year taxpayer. They aren’t the same act morally. The first denies entry; the second destroys a life already built. Yes, states must justify coercion to each person—but the justification needed grows stronger as reliance deepens. Your ‘anti-accrual’ point only works if time is the sole difference, but it’s not. A state can exclude at borders while still owing more to those it has allowed to put down roots. If you disagree, prove why a 5-minute visitor deserves the same justification as a 20-year resident."*
