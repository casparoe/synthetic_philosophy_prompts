prompt: |-
  I have written up my position on why promises bind for a graduate seminar and I would like an audit of it rather than a survey of the literature. The commitments, as I currently hold them, are these:

  1. Promising is a normative power, and the reason it generates is content-independent: it runs to doing the promised thing as such, and is not exhausted by — nor reducible to — the reasons supplied independently by the promisee's expectations, her reliance, or the general value of people keeping their promises.

  2. What is created is a directed duty: it is owed to the promisee, breaching it wrongs her in particular, and she holds a standing power to release me from it.

  3. That power is personal and lapses with her. Once the promisee is dead, no one else — not her estate, not her family, not the person the promise concerned — can release me.

  4. Wrongful content nullifies outright. A promise to do something immoral generates no obligation at all, as opposed to an obligation that exists and is then defeated or outweighed.

  5. Coercion nullifies as well, but only where the threat comes from the promisee. If a third party forces me to promise you something you had a right to anyway, the promise does bind.

  6. Nullity is not to be extended from wrongfulness to triviality. A promise about something of very slight importance still generates a genuine obligation; there is no de minimis threshold below which promising yields mere considerations rather than duties.

  7. Obligation survives zero impact. It remains in force, and breaking it remains wrong, in the case where the promisee has since died, no one else knows of the promise, and no one's expectations, interests or reliance are affected either way.

  8. Promising requires intention, and intention fixes the content. One cannot promise accidentally; and if I say that I promise to be there at six while privately intending only to try, then trying is all I owe, however reasonable the promisee's contrary understanding.

  Some of these pairs look to me as though they must collide, but I cannot tell which collisions are real. Please go through the set and tell me which commitments genuinely pull against one another and which apparent conflicts dissolve once the right distinction is drawn — in particular, say where an argument that looks like a reduction from one commitment to another is simply invalid. Rank the real tensions by severity rather than treating them as equally bad; for each, state what would have to be given up and what that costs; and then identify the single revision that would clean up the most. If any commitment is best abandoned only in its strong form — as a claim about what obligations exist rather than about what there is reason to do, or the reverse — say so explicitly. Please answer in British English.
reasoning: |-
  Okay, the user has laid out a sophisticated set of commitments about promissory obligation for a graduate seminar. They want an audit focused on internal coherence rather than literature review, which suggests they've already engaged deeply with the subject and need critical pressure-testing. 

  Hmm, their eight commitments form a distinctly "robust" view of promising - emphasising normativity, directed duties, and resistance to consequentialist dilution. The core tension seems to be between their strong anti-reductionism (1) and the absolutism of their nullity conditions (4,5), especially when combined with survival conditions (3,7). 

  Notably, the death scenarios in (3) and (7) create friction: if obligation survives the promisee's death but their exclusive release power dies with them, that creates a peculiar normative zombie - a duty owed to no one that no one can cancel. That might not be contradictory per se, but it's theoretically costly. 

  The coercion asymmetry in (5) feels unstable too. Distinguishing between promisee-coercion and third-party coercion makes sense for wrongfulness, but their content-independence commitment (1) should make the source irrelevant. If the reason is the promise itself, why does who forced me matter? 

  *flips through imaginary notebook* Ah! The biggest collision is actually between (4) and (8). If wrongful promises are void ab initio (4), but intention fixes content (8), what about "accidentally immoral" promises? Suppose I sincerely promise something I believe trivial that turns out deeply harmful - say, promising to share gossip that unwittingly ruins a life. By (8) my obligation is only to the intended trivial act, but by (4) if it's objectively immoral, no obligation exists. Which prevails? 

  *scribbles margin note* Must flag how (6) undermines (4)'s absolutism. If trivial promises bind but immoral ones don't, where's the line? Suppose I promise something slightly immoral (lie to spare feelings) - is that "void" or merely "outweighed"? Their framework lacks resources to say. 

  *stares at point 7* The zero-impact survival is beautifully anti-consequentialist but makes their nullity rules seem arbitrary. Why does death negate release powers (3) but not obligation (7)? If the duty's directedness requires a living promisee, (7) should lapse; if not, (3) seems unmotivated. 

  Recommendation: Softening (3) would resolve multiple tensions. Allowing estates to exercise release powers posthumously (like accepting bequests) preserves directedness without creating orphaned duties. Costs less than abandoning content-independence. 

  *checks British English* Right - "estate" not "inheritance", "whilst" not "while", "trivial" not "petty". Got it.
answer: |-
  Here is an audit of your commitments on promissory obligation, assessing internal coherence, ranking tensions by severity, and recommending revisions—all in British English:

  ### **Severe Tensions (Fundamental Collisions)**
  1. **Commitments (1) + (4) vs. (8): Normative Power vs. Intention & Wrongful Nullity**  
     - **Conflict:** (1) claims promises generate *content-independent* obligations. Yet (4) makes obligation *content-dependent* for immorality (void *ab initio*), and (8) makes content hinge on *private intention*. If obligation stems purely from the normative act (1), why is it nullified by objective wrongness (4) or subjective intent (8)?  
     - **Cost of Resolution:**  
       - *Option A:* Soften (4) to allow wrongful promises to generate *pro tanto* obligations (overridden by moral reasons). **Cost:** Weakens anti-reductionism; obligation becomes partly content-dependent.  
       - *Option B:* Relax (8) so reasonable interpretation trumps private intention. **Cost:** Undermines "intention fixes content"; invites disputes over "reasonableness".  
     - **Severity:** ★★★★★ (Threatens core anti-reductionism).

  2. **Commitments (3) vs. (7): Release Power Lapse vs. Obligation Survival**  
     - **Conflict:** (3) states the promisee’s death extinguishes *all* powers over the duty (e.g., release). (7) insists the obligation *survives* their death. But if the duty is *directed* (2) and owed *exclusively* to the promisee, how can it persist once they cease to exist? If no one can release/waive it, the duty becomes "orphaned" – owed to a non-entity.  
     - **Cost of Resolution:**  
       - *Option A:* Abandon (7) – obligation lapses if no one is wronged. **Cost:** Concedes to reliance/expectation theories.  
       - *Option B:* Moderate (3) – allow estates/heirs limited normative powers (e.g., waiver). **Cost:** Dilutes "personal" nature of promising; may invite third-party interference.  
     - **Severity:** ★★★★☆ (Undermines directed duty coherence).

  ---

  ### **Moderate Tensions (Salvageable with Distinctions)**
  3. **Commitments (1) vs. (5): Content-Independence vs. Coercion Nullity**  
     - **Apparent Conflict:** (5) nullifies promises under coercion *by the promisee* but not third parties. If obligation is content-independent (1), why does the *source* of coercion matter?  
     - **Resolution Distinction:** Coercion by the promisee vitiates the *normative act itself* (no voluntary undertaking), while third-party coercion leaves the promisor’s commitment intact. **Validity:** Coheres with (1) – the promise’s validity depends on the promisor’s agency, not content.  
     - **Tension Severity:** ★★☆☆☆ (Distinction preserves coherence).

  4. **Commitments (4) vs. (6): Wrongful Nullity vs. Trivial Binding**  
     - **Apparent Conflict:** Why does immorality nullify (4) but triviality not (6)? Both involve content.  
     - **Resolution Distinction:** Wrongfulness negates the promise’s *moral possibility* (no obligation can arise from immoral acts), while triviality merely concerns weight. **Validity:** (6) reinforces anti-reductionism; trivial promises still exercise normative power.  
     - **Tension Severity:** ★★☆☆☆ (Distinction holds if wrongfulness is a validity condition).

  ---

  ### **Minor Tensions (Conceptual Unease)**
  5. **Commitments (2) + (7): Directed Duty vs. Zero Impact Survival**  
     - **Unease:** If a duty is *owed to* someone (2), but their death means no expectations/reliance exist (7), *how* is it still directed? Who is wronged?  
     - **Resolution:** Maintain that directed duties are *relational* – breaching a promise wrongs the promisee *as a historical fact*, even posthumously. **Cost:** Metaphysically strained but logically consistent.  
     - **Severity:** ★☆☆☆☆ (Defensible with a "relational history" view).

  ---

  ### **The Single Most Stabilising Revision**  
  **Revise Commitment (3) to allow normative powers to transfer to the promisee’s estate.**  
  - **Why?** Resolves the severe (3)-(7) conflict without abandoning core tenets:  
    - The duty remains *directed* (owed to the promisee’s legacy/estate).  
    - Release powers are exercised by a *proxy* (not third parties), preserving "personal" character.  
    - Obligation survival (7) is coherent, as the estate can waive it.  
  - **Cost:** Moderately dilutes "personal and lapses with her" but avoids reducing promising to expectation/reliance. Better than sacrificing (7) or (1).  

  ### **Other Adjustments**  
  - **Commitment (4):** Recast as *"Wrongful promises generate no* **all-things-considered** *obligation"* (retains nullity intuition without clashing with (1) or (8)).  
  - **Commitment (8):** Qualify that *"intention fixes content* **only if reasonably interpretable** *from context"* (prevents promisors exploiting private reservations).  

  ### **Summary**  
  The fiercest tension is between **content-independence (1)** and **intention/wrongfulness (4,8)**. However, revising **(3)** cleans up the most collateral damage, notably reconciling directed duties with obligation survival. British phrasing retained throughout ("estate", "whilst", "nullifies outright"). 

  Would you like expansion on any specific argument?
