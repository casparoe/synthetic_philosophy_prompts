  ### Session Design: Fair Division Negotiation Game

  **Objective:** Participants experience a psychological shift in perceived fairness when an extreme, unattractive option is introduced, illustrating the difference between Nash (biggest-product) and Kalai-Smorodinsky (equal-fractions) bargaining solutions without prior theory.

  **Structure:** Three negotiation rounds in pairs, using tokens (not cash). Pairs post settlements publicly after each round. Prize: Winning pair chooses next topic + biscuit tin (randomly drawn from pairs agreeing in all rounds).

  **Timeline (90 mins):**
  - **0–10 mins:** Briefing and pair formation (8 pairs of 2).
  - **10–15 mins:** Round 1 negotiation.
  - **15–20 mins:** Round 1 settlement posting + tally.
  - **20–25 mins:** Round 2 negotiation.
  - **25–30 mins:** Round 2 settlement posting + tally.
  - **30–40 mins:** Break.
  - **40–45 mins:** Round 3 negotiation.
  - **45–50 mins:** Round 3 settlement posting + tally.
  - **50–90 mins:** Debrief (40 mins).

  ---

  ### Participant Instructions (Per Round)
  **Before All Rounds:**  
  *"You and your partner represent two parties splitting tokens. You must agree on one option. If no agreement, both get 0 tokens. After each round, write your chosen option (A, B, C, or D) on the wall chart. One pair will win a prize based on agreements."*

  **Round 1 (Simple split):**  
  *"Split 100 tokens. Options:  
  - **A**: You get 50, partner gets 50.  
  - **B**: You get 60, partner gets 40.  
  You have 5 minutes to negotiate."*

  **Round 2 (Symmetric extremes):**  
  *"Split 100 tokens. Options:  
  - **A**: You get 50, partner gets 50.  
  - **B**: You get 60, partner gets 40.  
  - **C**: You get 0, partner gets 100.  
  - **D**: You get 100, partner gets 0.  
  5 minutes to negotiate."*

  **Round 3 (Asymmetric extreme):**  
  *"Split 100 tokens. Options:  
  - **A**: You get 50, partner gets 50.  
  - **B**: You get 60, partner gets 40.  
  - **C**: You get 90, partner gets 10.  
  5 minutes to negotiate."*

  **What’s Hidden:**  
  - Participants aren’t told about upcoming rounds or the purpose.  
  - No theory/jargon is used. The prize mechanism is vague to avoid token maximisation (focus on agreement, not scores).

  ---

  ### Debrief (50–90 mins)
  Facilitator uses wall chart data to guide discussion:  
  1. **Show Round 1 & 2 results:** *"Most pairs chose A (50-50) in Rounds 1 and 2. Why? It felt fairest, and extremes were unappealing."*  
     → *Maps to Nash/Kalai-Smorodinsky alignment*: Both rules initially recommend 50-50 (highest product & equal fractions).

  2. **Highlight Round 3 shift:** *"In Round 3, more pairs chose B (60-40) than in Round 1. Did anyone feel 60-40 was suddenly 'more reasonable'?"*  
     → *Maps to Kalai-Smorodinsky shift*: The extreme option (90-10) changed the "ideal point," making 60-40 seem "fairer" by equal fractions of possible gains.

  3. **Explain rules plainly:**  
     - **Biggest-product (Nash):** *"Maximises the product of gains. Ignores extreme options if inefficient. Recommends A (50-50) in all rounds."*  
     - **Equal-fractions (Kalai-Smorodinsky):** *"Measures how close you get to your best possible gain. In Round 3, your 'best possible' jumped to 90, so 60-40 gives you 60/90≈66% of your max, while your partner gets 40/50=80% of theirs. Rule seeks balance, so 60-40 is closer than 50-50."*  
     → *Correction*: Your initial descriptions were swapped. "Biggest-product" is Nash; "equal-fractions" is Kalai-Smorodinsky.

  4. **Core disagreement:** *"Nash cares only about tangible gains; Kalai-Smorodinsky cares about hopes. The extreme option in Round 3 altered hopes, dragging settlements toward its favoured side—even though no one chose it."*

  ---

  ### Failure Modes & Fixes
  1. **What goes wrong:** Pairs choose B (60-40) in Round 1.  
     **Why:** Some see 60-40 as reasonably fair.  
     **Likelihood:** Likely.  
     **In-room fix:** Compare Round 1 vs. Round 3 B-choices. Ask: *"Did anyone who took A in Round 1 switch to B in Round 3? Why?"*

  2. **What goes wrong:** No shift to B in Round 3.  
     **Why:** Participants may anchor to past rounds ("We got 50-50 before!").  
     **Likelihood:** Possible.  
     **In-room fix:** Use theory to explain *why* a shift was expected: *"The extreme option reset what one side could dream of, changing the fairness calculus."*

  3. **What goes wrong:** Pairs "split the difference" verbally but pick no option.  
     **Why:** Ambiguity in discrete choices.  
     **Likelihood:** Near-certain.  
     **In-room fix:** Remind them: *"You must pick one lettered option. If stuck, flip a coin—but agree!"*

  ---

  ### What the Game Can’t Stage
  **The ideal-point recalibration.** Participants won’t consciously note that option C (90-10) altered their perception of "maximum possible gain." You must state: *"The extreme option changed what one side saw as their ceiling, making 60-40 feel like a compromise. Kalai-Smorodinsky accounts for this; Nash doesn’t."*

  ---

  ### Weakest Assumption
  **That the extreme option (90-10) makes 60-40 seem more reasonable to the disadvantaged player.** This assumes the psychological "anchoring effect" outweighs consistency desires. It’s brittle because participants may resent conceding more after prior 50-50 splits.

  ---

  ### Falsifying Observation
  **If B (60-40) choices in Round 3 do not exceed those in Round 1.** This indicates no anchoring effect, undermining the claim that extremes drag settlements. Success requires a visible uptick in B choices.

  ---

  ### Confidence  
  **0.65**  
  (Anchoring effects are well-documented, but group dynamics may override them.)

