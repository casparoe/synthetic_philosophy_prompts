     Schedule:

     0-10: Intro and pair formation (16 people -> 8 pairs)
     10-15: Round 1 negotiation
     15-20: Round 1 post and quick summary (facilitator writes down which option each pair chose)
     20-25: Round 2 negotiation
     25-30: Round 2 post and summary
     30-40: Break
     40-45: Round 3 negotiation
     45-50: Round 3 post and summary
     50-90: Debrief and discussion (40 minutes)

     Now, what they are told before each round:

     Round 1:
          "In this round, you and your partner are dividing 100 tokens. You have two options:
              Option A: You get 50 tokens, your partner gets 50 tokens.
              Option B: You get 60 tokens, your partner gets 40 tokens.
           If you cannot agree within the time, you both get 0. Please start."

     Round 2:
          "In this round, you are again dividing 100 tokens, but now with four options:
              Option A: You get 50, your partner gets 50.
              Option B: You get 60, your partner gets 40.
              Option C: You get 0, your partner gets 100.
              Option D: You get 100, your partner gets 0.
           If you cannot agree, both get 0."

     Round 3:
          "In this round, you are dividing 100 tokens, with three options:
              Option A: You get 50, your partner gets 50.
              Option B: You get 60, your partner gets 40.
              Option C: You get 90, your partner gets 10.
           If you cannot agree, both get 0."

     We don't tell them anything about the purpose. We keep them ignorant of the other rounds until we start.

     We hope that in Round 1, most choose A.
     In Round 2, most choose A again (perhaps some choose B, but few choose C or D).
     In Round 3, we hope that more choose B than in Round 1.

     The wall chart: for each round, for each pair, we record the option they chose (A, B, C, or D). We can then see the distribution.

     Debrief:

     We start by showing the chart and asking what they notice. We hope someone notices that in Round 3, more pairs chose B than in Round 1.

     Then we explain the two rules:

     Rule 1: The biggest-product rule (Nash): it says to pick the option that makes the product of your gains (above breakdown) the largest. 
          Breakdown is 0, so gains are just the tokens.
          Round 1: 
              A: 50*50=2500
              B: 60*40=2400 -> so A wins.
          Round 2:
              A: 2500, B:2400, C:0*100=0, D:100*0=0 -> A wins.
          Round 3:
              A:2500, B:2400, C:90*10=900 -> A wins.
          So Nash always says A.

     Rule 2: The equal-fractions rule (KS): it says to look at the best you could hope for if your partner were very generous (the ideal point). 
          For a player, the ideal point is the maximum they can get in any option (as long as the other player gets at least their breakdown, which is 0).
          Then, find the option where the fraction of your ideal that you get is the same for both.

          Round 1: 
              Your ideal: max(50,60)=60
              Partner's ideal: max(50,40)=50
              Then we want: your tokens/60 = partner's tokens/50.
              Option A: 50/60≈0.83, 50/50=1 -> not equal.
              Option B: 60/60=1, 40/50=0.8 -> not equal.
              The solution would be in between, but we only have discrete. They might have chosen A as fairest.

          Round 2:
              Your ideal: max(50,60,0,100)=100
              Partner's ideal: max(50,40,100,0)=100
              Then: tokens/100 = partner's tokens/100 -> so they should be equal: only option A does that (50,50). 
              So KS says A.

          Round 3:
              Your ideal: max(50,60,90)=90
              Partner's ideal: max(50,40,10)=50
              Then: tokens/90 = partner's tokens/50.
              Option A: 50/90≈0.556, 50/50=1 -> not equal.
              Option B: 60/90=0.667, 40/50=0.8 -> not equal.
              Option C: 90/90=1, 10/50=0.2 -> not equal.
              The closest is option B: 0.667 vs 0.8 is closer than the others? 
              But actually, we can compute the absolute difference in fractions:
                  A: |0.556-1| = 0.444
                  B: |0.667-0.8| = 0.133
                  C: |1-0.2| = 0.8
              So B is the closest.

          Therefore, KS in Round 3 points to B.

     So the shift from A to B in Round 3 is predicted by KS.

     Then we can say: "In the first two rounds, both rules pointed to option A. In the third round, the biggest-product rule (Nash) still points to A, 
     but the equal-fractions rule (KS) points to B. And we saw more pairs choosing B in Round 3. This shows that the presence of the extreme option C, 
     even though no one chose it, changed the ideal point for you (to 90) and made option B look fairer by the equal-fractions rule."

     This matches the user's request.

     Failure modes:

     - In Round 1, many pairs might choose B (60,40) because it is Pareto efficient and gives more to one. 
          Why would they? Maybe because they don't see 60-40 as unfair. 
          Likelihood: possible. 
          Fix: In the debrief, we can still show that in Round 3 the same pairs might choose an option that is even more favorable to that side? 
          But if they chose B in Round 1, then in Round 3 they might choose C? That would be a shift from B to C? But we hope that C is too extreme. 
          Alternatively, we can compare the shift from Round 1 to Round 3 for each pair. We hope that pairs that chose A in Round 1 might choose B in Round 3.

     - In Round 2, some pairs might choose C or D. 
          Likelihood: possible, but unlikely because it gives one player 0. But if they are strategic and want to build trust? 
          Fix: We can still do the analysis by excluding those pairs.

     - In Round 3, pairs might not shift to B. 
          Likelihood: near-certain? We hope for a noticeable shift, but it might not happen. 
          Fix: In the debrief, we can still explain the theory and show that the rules predict a shift even if it didn't occur. 
          Or we can say: "We see that some pairs shifted, and that is what the equal-fractions rule would predict. Others did not, and that is what the biggest-product rule would predict."

     What cannot be staged: 
          The game does not explicitly reveal why the shift occurs. We hope they feel it in the negotiation. But if they don't shift, then we don't have the moment. 
          Also, the rules are explained after the fact. The part about the ideal point changing might not be naturally discovered.

          We must state: "The extreme option, even though not chosen, changed the ideal point for one player, and that affected what the equal-fractions rule considers fair."

     Weakest assumption: 
          The design assumes that the presence of the extreme option (90,10) in Round 3 will make (60,40) seem more reasonable to the player who is getting 40, 
          so that they are more willing to accept it. But they might not. They might say: "Why should I accept less than 50 when last time I got 50?" 
          This is the status quo effect. 

     What would falsify the design: 
          If in Round 3, we do not see a significant increase in the number of pairs choosing option B compared to Round 1, then the intended effect is not observed.

     Confidence: 
          Given the psychological literature on anchoring, I think the extreme option will serve as an anchor and pull the settlement toward it. 
          But it's not guaranteed. I'd say confidence is 0.6.

