     - The "biggest-product rule" is the Nash bargaining solution.
     - The "equal-fractions rule" is the Kalai-Smorodinsky bargaining solution.

     And we note that the user had the names reversed in the description.

     Debrief moves:

      1. Moment: We show the wall chart for Round 1 and Round 2: most pairs chose A.
         Mapped to: Both rules (Nash and KS) predict A in these rounds.
         Facilitator line: "In the first two rounds, most of you chose the equal split of 50-50, which both fairness rules we're discussing would recommend."

      2. Moment: We show the wall chart for Round 3: more pairs chose B than in Round 1.
