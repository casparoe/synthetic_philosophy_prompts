     at the end of the three rounds, we will randomly select one round and one member of the pair: if that member's token in that round is at least 
     X, they win a biscuit. But this might be too random.

     Alternatively, we can not worry about the incentive and rely on the fun of the game and the small prize. We will tell them that we are 
     interested in how they negotiate, and that we will award a prize to a randomly selected pair that reached an agreement in all three rounds.

     This might be sufficient.

     Timeline for 90 minutes:

     0-10 min: Introduction and forming pairs. Explain the basic setup: they are two parties negotiating how to divide 100 tokens. 
          In each round, they will have a set of options. They must agree on one option within a time limit (say, 3 minutes per round). 
          If they don't agree, they both get 0 for that round. If they agree, they write it on the board. 
          At the end, one pair will be drawn from those that agreed in all rounds, and that pair wins the prize.

