  I'll construct about seven distinct readings, ensuring they don't collapse into each other. Weakest might be a trivial functional claim; strongest a metaphysical necessity claim. The middle ground—constitutive standard plus transparency—is likely what the speaker intended, but it stumbles on cases (i) and (iii).

