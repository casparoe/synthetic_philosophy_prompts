answer: |-
  Here is a specification for an adequate theory of vagueness tailored to your regulatory drafting context. I begin with a brainstormed candidate list, then winnow it, justifying inclusions/exclusions. Requirements are marked (Non-Negotiable) or (Negotiable), followed by potential conflicts and theory assessments.

  **Brainstormed Candidate List (Initial Considerations):**
  1.  **Solve the Sorites Paradox:** Explain the failure point & psychological pull.
  2.  **Handle Non-Soritical Borderline Cases:** Explain "is a game"-type vagueness.
  3.  **Distinguish Vagueness from Neighbors:** Provide an operational test.
  4.  **Explain Boundary Unknowability & Higher-Order Vagueness:** Why can't even experts pinpoint the exact boundary, and why is the borderline region itself fuzzy?
  5.  **Account for Faultless Disagreement:** Can competent users disagree without error?
  6.  **Cover Both Measurement-Inherited & Intrinsic Vagueness:** Explain "significant delay" (inherited) vs. "obscene" (intrinsic).
  7.  **Explain Voluntary Sharpening:** How stipulation eliminates indeterminacy.
  8.  **Provide Guidance for Action in Borderline Cases:** What *should* an inspector do?
  9.  **Model Multi-Dimensional Vagueness:** Handle predicates like "excessive concentration" (cost, time, safety?).
  10. **Accommodate Context-Sensitivity:** Explain how "significant" shifts based on domain (e.g., heart surgery vs. train delay).
  11. **Address Normativity:** Explain why some uses are *incorrect*, even in borderline regions.
  12. **Be Compatible with Compositionality:** How vague terms combine in sentences.
  13. **Avoid Paradoxical Consequences:** Ensure no new, worse paradoxes are generated.
  14. **Be Psychologically Plausible:** Reflect how users actually process vague terms.
  15. **Distinguish Semantic Indeterminacy from Epistemic Uncertainty:** Is the ignorance fundamental or just lack of knowledge?
  16. **Handle Degree Modifiers:** Explain "very significant", "slightly excessive".

  **Winnowed Specification (Requirements for Adequacy):**

  1.  **Sorites Resolution & Pull:** (Non-Negotiable)
      *   **Case:** "Significant Delay": 1 minute isn't significant; if delay N isn't significant, delay N+1 minute isn't; therefore, no delay is significant. Absurd.
      *   **Requirement:** The theory must pinpoint the logical or semantic flaw (e.g., invalid premise? non-transitive truth? context shift?) and explain why the argument *feels* compelling (e.g., tolerance principles, similarity judgments, context collapse).
      *   **Why Non-Negotiable:** The Sorites is the core logical puzzle of vagueness; any theory must address it.

  2.  **Non-Soritical Borderline Cases:** (Non-Negotiable)
      *   **Case:** An inspector must decide if a novel financial product constitutes an "excessive concentration" of risk. No clear linear dimension orders all possible products.
      *   **Requirement:** The theory must explain the nature of indeterminacy for predicates lacking a single, clear ordering dimension. It must define what makes a case borderline absent a sorites sequence.
      *   **Why Non-Negotiable:** Much regulatory vagueness ("excessive", "unfair", "fit for purpose") is multi-dimensional or category-based. A theory only handling linear sorites is inadequate.

  3.  **Discrimination from Neighbors:** (Non-Negotiable)
      *   **Case:** An inspector wonders if "significant delay" is vague, or merely underspecified (needs a precise threshold defined later), or context-sensitive (significant *for what?*), or ambiguous (has multiple precise meanings), or if they just lack knowledge of the exact rule.
      *   **Requirement:** Provide a clear test distinguishing vagueness from:
          *   **Generality/Underspecification:** Vague terms resist *any* complete, context-independent precisification. Generality is resolved by adding detail.
          *   **Ambiguity:** Ambiguity involves multiple precise meanings; vagueness involves borderline cases for a single meaning.
          *   **Indexicality/Context-Sensitivity:** While context influences vague terms, their core indeterminacy persists *within* a fixed context. Pure indexicals (e.g., "I", "here") have precise reference given context.
          *   **Ignorance:** Vagueness involves *inescapable* indeterminacy for competent users, even given all facts. Ignorance is resolvable with more information.
      *   **Lumping Permitted:** Context-sensitivity is often intertwined with vagueness ("significant" *is* context-sensitive). Generality and underspecification are closely related. Ambiguity and ignorance are more distinct.
      *   **Why Non-Negotiable:** Misdiagnosis leads to bad drafting or inspection strategy (e.g., seeking non-existent facts vs. exercising judgment).

  4.  **Boundary Unknowability & Higher-Order Vagueness:** (Non-Negotiable)
      *   **Case:** Even the drafter, fully understanding "significant delay", cannot specify the exact minute it becomes significant. Furthermore, there's no sharp line between clear cases and borderline cases.
      *   **Requirement:** The theory must explain why sharp boundaries (if posited) are unknowable in principle (epistemicism) or why they don't exist (non-epistemic views). It must also explain the apparent lack of sharp boundaries *to the borderline region itself* (higher-order vagueness).
      *   **Why Non-Negotiable:** This is constitutive of vagueness. A theory denying this (e.g., naive precisification) fails phenomenology.

  5.  **Faultless Disagreement:** (Negotiable)
      *   **Case:** Two equally competent inspectors, given identical facts about a delay, disagree: "It *is* significant" vs. "It's *not* significant" (or "It's borderline"). Neither seems factually mistaken.
      *   **Requirement:** The theory should either vindicate the possibility of faultless disagreement or explain why it's merely apparent. Vindicating it is a preference of some camps (e.g., contextualism, relativism), denied by others (e.g., epistemicism, strict supervaluationism).
      *   **Why Negotiable:** While a powerful intuition, some robust theories (Epistemicism) explicitly deny its possibility, arguing one speaker *must* be wrong. Acceptability depends on other theoretical choices.

  6.  **Coverage of Inherited vs. Intrinsic Vagueness:** (Negotiable)
      *   **Case:** "Significant delay" (vagueness plausibly inherited from the inexactness of measuring 'significance' against time/cost) vs. "undue hardship" (vagueness seemingly intrinsic, not resolvable by measurement).
      *   **Requirement:** The theory should ideally cover both types with a unified mechanism. If forced separation is necessary, justify the cost (e.g., needing two distinct semantics).
      *   **Cost of Unification:** Theories focusing on degrees (e.g., fuzzy logic) handle inherited vagueness naturally but may struggle with intrinsic vagueness's lack of a clear scale. Theories focusing on partial definition (supervaluationism) handle both but may obscure the difference.
      *   **Why Negotiable:** While desirable, a theory excelling on one type but weaker on the other might still be useful if it covers the most relevant type for regulation (often inherited).

  7.  **Voluntary Sharpening:** (Non-Negotiable)
      *   **Case:** An inspector and a company representative agree mid-dispute: "For the purposes of this inspection, we'll consider any delay over 30 minutes 'significant'." Reasoning then proceeds determinately.
      *   **Requirement:** The theory must explain how such stipulation works – how it locally eliminates indeterminacy without altering the meaning of the word generally.
      *   **Why Non-Negotiable:** This is a common and powerful feature of language use, especially in practical/regulatory contexts requiring decision-making.

  8.  **Guidance for Action in Borderline Cases:** (Non-Negotiable - *Added during winnowing*)
      *   **Case:** An inspector faces a concrete situation that is a genuine borderline case of "excessive concentration". They *must* make a decision (approve, deny, investigate further).
      *   **Requirement:** The theory must provide a conceptual framework for what is happening semantically and normatively in this situation, informing what the inspector *ought* to do (e.g., exercise judgment based on X, Y, Z; seek supervisor input; recognize the decision as underdetermined but necessary). It needn't dictate the specific action, but must illuminate the nature of the choice.
      *   **Why Added & Non-Negotiable:** This is the core practical need driving your query. A purely descriptive theory is insufficient. (Discarded #15 & part of #14 as less directly relevant than this action-oriented need).

  9.  **Context-Sensitivity Integration:** (Non-Negotiable - *Refined from #10*)
      *   **Case:** "Significant delay" applies differently to a life-saving drug shipment vs. a non-essential goods delivery.
      *   **Requirement:** The theory must explain how context (purpose, domain, consequences) interacts with the core vagueness to determine applicability, especially near borders. It must not reduce vagueness *to* context-sensitivity.
      *   **Why Non-Negotiable:** Regulatory terms are inherently context-dependent *and* vague. Handling one without the other is unrealistic. (Discarded pure #14 as secondary).

  **Winnowing Justification (Discarded/Subsumed Items):**
  *   **#8 (Multi-Dimensional):** Subsumed under **Requirement 2 (Non-Soritical)**. Multi-dimensionality is a prime example of non-linear vagueness.
  *   **#11 (Normativity):** Implicit in **Requirements 4 (Unknowability/Borders)** and **8 (Action Guidance)**. Explaining incorrect use relies on explaining clear cases/borders.
  *   **#12 (Compositionality):** Important for full semantics but less critical for the core phenomena and your practical focus. Potential future extension.
  *   **#13 (Avoid Paradox):** A meta-requirement assumed for any viable theory.
  *   **#14 (Psychological Plausibility):** Desirable but negotiable; formal theories often idealize. Core phenomena (**Req 1, 4**) constrain plausibility.
  *   **#15 (Semantic vs Epistemic):** Central to the debate but addressed by how **Requirements 4 (Unknowability)** and **5 (Disagreement)** are handled by different theories. Not a separate requirement.
  *   **#16 (Degree Modifiers):** Important but can often be handled as an extension of the core theory of gradability/vagueness. Less fundamental than the core list.

  **Conflicts and Trade-offs:**

  *   **Conflict:** **Requirement 5 (Faultless Disagreement)** conflicts with **Requirement 4 (Boundary Unknowability)** *under Epistemicist interpretations*. Epistemicism (sharp boundaries + ignorance) denies faultless disagreement in clear/borderline cases: one speaker *must* be wrong if they make a definite claim.
  *   **Conflict:** **Requirement 7 (Voluntary Sharpening)** conflicts with rigid **Requirement 4 (No Sharp Boundaries - non-epistemic view)**. If there are *no* sharp boundaries, how can stipulation create one?
  *   **Trade-off Choice:** If forced to give one up, I would surrender **Requirement 5 (Faultless Disagreement)**. While intuitive, denying it (as Epistemicism does) or explaining it away (as some Supervaluationist/Contextualist hybrids do) is less damaging to the overall picture than denying core phenomenology (**Req 4**) or practical linguistic capability (**Req 7**). This concession buys compatibility with Epistemicism and simpler versions of Supervaluationism, and avoids complex relativist semantics.
  *   **Most Excluding Requirement:** **Requirement 2 (Non-Soritical Borderline Cases)**. Many popular theories (early Fuzzy Logic, simple Epistemicism) are primarily engineered for the Sorites and linear gradability. Handling complex, multi-dimensional, category-based vagueness robustly is a significant challenge that excludes theories focused solely on soritical sequences or simple scales.

  **Theory Assessments on Non-Negotiables:**

  1.  **Ignorance View (Epistemicism):**
      *   **Sorites:** ✔️ (Failure: False Tolerance Premise; Pull: Mistaking ignorance for tolerance).
      *   **Non-Soritical Borderline:** ✖️ (Struggles, assumes hidden precise boundaries even for complex predicates).
      *   **Distinguish Neighbors:** ✔️ (Clear test: Vagueness = ignorance of sharp boundary despite all facts).
      *   **Boundary Unknowability:** ✔️ (Core thesis: sharp boundary exists but is unknowable). **Higher-Order:** ✖️ (Denies it; insists on sharp higher-order boundaries).
      *   **Voluntary Sharpening:** ✔️ (Stipulation reveals/adopts a precise boundary).
      *   **Action Guidance:** ✔️/➖ (Inspector *should* find the factually correct answer, but recognizes it's unknowable; decision becomes pragmatic/evidential).
      *   **Context:** ➖ (Can incorporate context as fixing the relevant precise property).

  2.  **Supervaluationism:**
      *   **Sorites:** ✔️ (Failure: Tolerance Premise not *super-true*; Pull: True in each precification).
      *   **Non-Soritical Borderline:** ✔️ (Borderline = true on some precifications, false on others).
      *   **Distinguish Neighbors:** ✔️ (Vagueness = partial definition, multiple admissible precifications).
      *   **Boundary Unknowability:** ✔️ (No single sharp boundary). **Higher-Order:** ➖ (Formally tricky; often modeled but arguably artificial).
      *   **Voluntary Sharpening:** ➖ (Stipulation selects one admissible precification; ok, but "admissible" can be contested).
      *   **Action Guidance:** ✔️ (Inspector must exercise judgment to select/adopt a precification consistent with usage/purpose).
      *   **Context:** ✔️ (Context determines the set of admissible precifications).

  3.  **Degree-Theoretic/Contextualist Accounts:**
      *   **Sorites:** ✔️ (Failure: Non-transitive degrees or context shift; Pull: Small degree differences or stable context).
      *   **Non-Soritical Borderline:** ✖️/➖ (Degree theories best for gradable adjectives; struggle with category terms. Contextualism can help by shifting standards).
      *   **Distinguish Neighbors:** ➖ (Risk conflation with context-sensitivity; degree theories may over-apply).
      *   **Boundary Unknowability:** ➖ (Degrees often have sharp boundaries; contextualism avoids global boundaries). **Higher-Order:** ➖ (Often not explicitly addressed well).
      *   **Voluntary Sharpening:** ✔️ (Contextualism: Stipulation sets context/standard. Degree: Sets threshold).
      *   **Action Guidance:** ✔️ (Inspector sets/works within contextually relevant standard/threshold).
      *   **Context:** ✔️ (Context is fundamental).

  **Conclusion for Regulatory Context:** Supervaluationism offers the most balanced coverage of the non-negotiable requirements, particularly handling non-soritical cases and providing a framework for judgment-based action guidance in borderline situations, though its handling of higher-order vagueness and voluntary sharpening can be debated. Contextualism is strong on sharpening and context but weaker on non-gradable vagueness and distinguishing core indeterminacy. Epistemicism is logically clean but struggles with complex vagueness, higher-order phenomena, and clashes with the practical need for justified judgment calls in borderline cases. A hybrid approach (e.g., Contextualist Supervaluationism) might be most promising.
