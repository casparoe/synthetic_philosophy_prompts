  15 - 10p < 10p + 0.2
  15 - 0.2 < 10p + 10p
  14.8 < 20p
  p > 14.8/20 = 0.74

  So at p>74%, Option 3 is better. At p=55% (0.55), Option 2 is better.

  But in the debate, the judge is forced to output a binary. The downstream process is: if the verdict is A, then they choose Option 3 (because they think A is true and they are confident). If the verdict is B, then they choose Option 2.

  In the debate, the judge outputs A (which is correct, but p=55% is not high enough to justify Option 3). So they choose Option 3, which has an expected cost of $9.5M, while the optimal at p=55% is Option 2 with $5.7M. The difference is $3.8M.

  In the no-adversary setup, the judge asks one analyst for their assessment. The analyst says: "The evidence points to A with about 55% probability. It's a close call, but A is slightly more likely." Then the judge, knowing it's 55%, would choose Option 2, saving $3.8M.

  **Why can the lone agent transmit the calibration and the debater can't?**

  In the debate, both debaters are trying to win. The pro-A debater will make the case for A as strongly as possible, making it seem more certain than it is. The pro-B debater will do the same for B. The judge is forced to pick one side as the winner, and that side will have presented their case in a way that makes their position seem stronger. The judge doesn't get a clear signal of the uncertainty because both sides are pushing their narratives. The judge might sense it's close, but without a neutral assessment, they might still lean A because it's slightly more supported, but they don't get a quantitative estimate.

  In the no-adversary case, the analyst is not in a competitive setting and can straightforwardly report their calibrated uncertainty.

  **The load-bearing feature:** The adversarial format pushes each side to present their case as if it were more certain than it is, and the judge cannot easily extract a calibrated probability because the arguments are polarized and designed to persuade rather than inform neutrally.

  **What happens if we remove it?** If we remove the adversarial pressure (i.e., if we have a single agent), then we get the calibrated estimate and the case works. But if we remove the requirement for truthfulness, then we might have a case where one side lies and that causes the problem, but that's not what we want. If we remove the close evidence, then the debate might get the right answer with high confidence and the expensive option would be justified. So the case collapses if the evidence isn't close? Actually, if the evidence is 80% for A, then debate would output A and the expensive option would be justified (because 80%>74%). So the case relies on the evidence being close and the adversarial format obscuring the degree of uncertainty.

