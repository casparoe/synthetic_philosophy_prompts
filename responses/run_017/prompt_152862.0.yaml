  - Option 1: do nothing -> cost: $10M (because outbreak will recur and cause $10M in harm)
  - Option 2: low-cost intervention (retrain staff) -> cost: $200K. This prevents the outbreak if B is true, but if A is true, it doesn't prevent the outbreak and we still have $10M harm. So if B true: total cost $200K; if A true: $10.2M.
  - Option 3: high-cost intervention (replace water system) -> cost: $5M. This prevents the outbreak if A is true, but if B is true, we have the outbreak anyway so total cost $5M + $10M = $15M.

