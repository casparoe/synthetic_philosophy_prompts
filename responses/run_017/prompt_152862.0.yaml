  We are building a scenario for a short paper on scalable oversight. The key requirement is to show a case where debate gets the verdict right (i.e., the true answer is A and the judge picks A) but the binary output leads to a worse outcome because the downstream decision needed a graded confidence (55% for A) but debate forces a binary that is interpreted as high confidence.

  The scenario must be:
  - Ordinary institution, nothing futuristic.
  - Debaters: either LLM assistants or human analysts (non-magical).
  - Judge: competent professional with 30 minutes and no special expertise on the crux.
  - Both debaters equally informed, same evidence.
