  - Option 2: 55% chance of A -> cost $10.2M; 45% chance of B -> cost $0.2M; expected cost = 0.55*10.2M + 0.45*0.2M = 5.61M + 0.09M = $5.7M
  - Option 3: 55% chance of A -> cost $5M; 45% chance of B -> cost $15M; expected cost = 0.55*5M + 0.45*15M = 2.75M + 6.75M = $9.5M
