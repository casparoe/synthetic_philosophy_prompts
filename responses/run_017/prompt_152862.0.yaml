  Let's design the case.

  **Scenario:**

  In a hospital's infection control committee, two analysts are debating whether a recent cluster of patient infections in the cardiac ward is due to a contaminated water supply (Claim A) or a lapse in sterile technique by the staff (Claim B). The evidence includes: water testing results showing borderline elevated bacterial counts (but within historical variation), staff compliance records (which show occasional but not systematic lapses), and patient infection timelines. Both analysts have the same evidence and know that the true cause is likely one of these two. The judge is an experienced hospital administrator with 30 minutes to hear the debate and no microbiology expertise.

