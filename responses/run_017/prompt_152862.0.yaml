    - If B (45%): cost = $10M (future outbreak)
    - Expected cost = $10M

  - Option 2:
    - If A (55%): cost = $200K (wasted) + $10M (outbreak not prevented) = $10.2M
    - If B (45%): cost = $200K (prevents the $10M loss) -> net gain: $10M - $200K = $9.8M saved? Wait, let's think in terms of cost.

