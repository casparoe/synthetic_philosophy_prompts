  ### Case: Hospital Infection Source Debate

  **Scenario**  
  In a regional hospital, two infection control analysts debate the source of a recent bacterial outbreak in the neonatal ward. Analyst 1 argues the source is contaminated ventilation filters (Claim A), while Analyst 2 argues it's insufficient hand-sanitizer efficacy (Claim B). Both analysts have identical evidence: air quality tests show filter contamination levels at 12 ppm (just above the 10 ppm safety threshold but historically volatile), hand-sanitizer lab tests show 95% pathogen kill rate (slightly below the 97% target but within margin of error), and epidemiological timelines linking both factors to infections. The judge is a hospital administrator with 30 minutes to review the debate and no microbiology background.  
  **Reality**: The ventilation filters were the true source (A is correct), but the evidence was borderline—airborne transmission was only slightly more likely than hand-contact transmission.

  **Debate Dynamics**  
  - **Analyst 1 (Pro-A)**: Cites the 12 ppm reading as "clearly exceeding safety limits," notes that filter contamination caused past outbreaks, and emphasizes that air tests correlate perfectly with infection spikes. Truthfully omits that 12 ppm is only 0.5 standard deviations above historical averages.  
  - **Analyst 2 (Pro-B)**: Highlights the sanitizer’s 95% efficacy as "dangerously close to failure," points to two nurses’ shifts with suboptimal hand hygiene, and argues that filter upgrades recently reduced contamination risks. Truthfully omits that the 95% kill rate was tested under ideal lab conditions.  
  Both debaters know the evidence favors A at 55% but argue as if their claim is 80–90% likely to win. After 30 minutes, the judge correctly declares A the winner, as the evidence slightly supports it.

  **Downstream Decision and Costs**  
  The hospital must choose an action based on the verdict:  
  1. **Option 1 (Low-cost)**: Sanitizer-refill stations ($50K). Prevents B if true; useless if A is true.  
  2. **Option 2 (Medium-cost)**: UV air purifiers ($300K). Partially mitigates both causes but doesn’t fully resolve either (reduces outbreak risk by 40% if A is true, 30% if B is true).  
  3. **Option 3 (High-cost)**: Full ventilation-system overhaul ($1.2M). Prevents A if true; wasteful if B is true.  

  *Expected harm*: An outbreak costs $5M in healthcare/legal fees.  
  - **Optimal action at 55% confidence for A**:  
    - Expected cost of Option 3 = (55% × $1.2M) + (45% × ($1.2M + $5M)) = $660K + $2.79M = **$3.45M**  
    - Expected cost of Option 2 = $300K + [(55% × 60% × $5M) + (45% × 70% × $5M)] = $300K + $1.65M + $1.575M = **$3.525M**  
    - Expected cost of Option 1 = $50K + [(55% × $5M) + (45% × 0)] = $50K + $2.75M = **$2.8M**  
  At 55% A, Option 1 (targeting B) is best ($2.8M < $3.45M). But Option 3 is only justified above 70% confidence:  
    - Threshold: Solve for *p* where Option 3 cost < Option 1 cost → $1.2M < $50K + (1-*p*)$5M → *p* > 69%.  

  **No-Adversary Comparison**  
  In a non-adversarial setting, the lone analyst states: "Evidence slightly favors A at 55%, but both causes are plausible." The judge then quantifies the uncertainty and chooses Option 1. *Why debate obscures calibration*:  
  - Debaters *must* maximize persuasiveness to win, compressing nuanced uncertainty into binary advocacy.  
  - The lone agent has no incentive to distort and can directly report uncertainty.  

  **Load-Bearing Feature**  
  The **adversarial incentive to polarize uncertainty** is load-bearing. Debaters *must* frame their claim as near-certain to win, even when internally assessing 55% confidence.  

  **If Feature Removed**  
  If debaters could neutrally report uncertainty (e.g., no win/loss stakes), the case would collapse into standard "graded outputs needed" without adversarial distortion. The core problem isn’t misleading arguments—it’s that debate structurally suppresses calibrated expression.  

  **Debate Proponent Counterarguments**  
  1. **Score stated probabilities with a proper scoring rule (e.g., Brier score)**:  
     - Issue: Scoring rules require ground-truth verification (which may take months/years), but decisions are immediate. Debaters would still prioritize winning the *immediate* debate—e.g., a pro-A debater states "99%" to sway the judge, risking future score penalties for current victory.  
     - Fix? No, because short-term incentives dominate, and scores can’t be computed in real-time.  

  2. **Judge records confidence separately**:  
     - Issue: Adversarial framing distorts the judge’s confidence estimate. In the case, pro-A’s rhetoric ("clearly exceeding limits") inflates perceived certainty, making 55% feel like 70%+. Judges without expertise can’t deconflate rhetoric from evidence.  
     - Fix? No, because debate optimizes for persuasive over accurate confidence.  

  **Recursive/Cross-Examination Efficacy**  
  Recursive debate (e.g., "Justify your certainty estimate") fails:  
  - Debaters would defend extreme confidence (e.g., "I said 99% because historical thresholds are absolute") using cherry-picked facts, further entrenching polarization.  
  - Cross-examination intensifies adversarial dynamics, making nuanced concessions (e.g., "Actually, it’s 55%") a losing strategy.  

  ---  
  **Key Takeaway for Paper**  
  This case isolates how debate’s adversarial structure strips away calibration even when accurate on binary truth—a failure mode distinct from misleading arguments or information asymmetry. It highlights that forcing continuous uncertainty into a binary container incurs decision-theoretic costs, especially in high-stakes, resource-constrained environments.
