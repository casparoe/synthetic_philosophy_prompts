     - Also, if the debaters are strategic, they might not report truthfully because the stated probability could be used against them in the debate. For instance, if one admits it's 55%, the opponent might use that to undermine their position. 
     - Therefore, it's not clear that this would work because the debaters have a conflict of interest: winning the debate vs. reporting an accurate probability for a future scoring rule. The scoring rule reward might be deferred and uncertain, while winning the debate has immediate consequences (e.g., career advancement, bonus). So they might still exaggerate.

  2. **Have the judge write down a confidence next to the verdict:**
     - The judge, after the debate, writes down a confidence level (say, 55%). Then the downstream process uses that. 
     - But the issue is: can the judge accurately assess the confidence? In the adversarial setting, both sides are making the case seem as strong as possible. The judge might feel it's close but doesn't have a way to quantify it. The judge might be influenced by the persuasiveness and come away with a false sense of confidence. 
     - For example, the pro-A debater might present a very compelling narrative that makes A seem 70% likely even though the evidence only supports 55%. The judge, not being an expert, might not be able to discount for the adversarial framing. 
     - In the no-adversary case, the analyst says "55%" and the judge takes that at face value. In the debate, the judge has to disentangle the strength of the evidence from the strength of the rhetoric. Without a neutral anchor, the judge might over- or under-estimate. The problem is that the adversarial presentation distorts the calibration.

  **Recursive / cross-examination variant:**
     - In recursive debate, the debaters might be asked to justify their claims, including their confidence. But if the entire process is adversarial, then each step might be similarly distorted. For example, if the judge asks the pro-A debater: "How sure are you?" and the debater says "90%", then the pro-B debater will attack that. But the pro-B debater might also overstate. The judge then has to decide between two conflicting claims about confidence. 
     - Without a neutral baseline, the judge might not be able to extract the true uncertainty. Moreover, the debaters are trying to win, so they will not volunteer that their case is weak. 
     - Therefore, recursive debate might not help because the adversarial incentives run through the entire process.

  **Final Scenario Paragraph:**

  In a hospital infection control meeting, two analysts debate the cause of a recent infection cluster: Analyst 1 argues for a contaminated water supply (A), while Analyst 2 attributes it to lapses in sterile technique (B). Both have identical evidence: water tests showing borderline elevated bacteria (though within historical fluctuations) and staff records indicating occasional minor lapses. The judge, a hospital administrator without microbiology expertise, hears both sides. Analyst 1 emphasizes the correlation between water test peaks and infections, noting that the bacteria strain in the water is similar (though not identical) to the outbreak strain. Analyst 2 highlights the staff lapses during critical procedures and the recent water system upgrade. After 30 minutes, the judge concludes the water supply is at fault (A). In reality, the water was indeed the cause, though the evidence was close (55% for A, 45% for B). The hospital then replaces the water system at a cost of $5M. However, a calibrated 55% probability would have favored staff retraining (costing $200K) as the optimal decision, saving an expected $3.8M.

  **Load-bearing feature:** The adversarial format incentivizes debaters to present their case with inflated confidence, obscuring the true uncertainty from the judge.

  **Without this feature:** If debaters were not adversarial (e.g., one neutral analyst), the uncertainty is communicated, and the better decision is made.

  **Debate proponent attacks:**
  1. *Scoring rule for probabilities*: Debaters may still exaggerate to win the immediate debate, as the long-term scoring rule reward is uncertain and potentially outweighed by the immediate win incentive.
  2. *Judge records confidence*: The adversarial presentations may distort the judge's confidence assessment, leading to overconfidence (e.g., the judge might feel 70% confident after hearing strong rhetoric, despite the evidence being 55%).

  **Recursive debate:** Unlikely to help, as cross-examination remains adversarial and debaters will defend their position with inflated confidence at every level.
