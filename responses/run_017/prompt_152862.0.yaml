    - Expected cost = (0.55 * ($200K + $10M)) + (0.45 * $200K) = 0.55*10.2M + 0.45*0.2M = $5.61M + $0.09M = $5.7M

  - Option 3:
    - Prevents the outbreak only if A is true (55% chance). 
    - Expected cost = (0.55 * $5M) + (0.45 * ($5M + $10M)) = 0.55*5M + 0.45*15M = $2.75M + $6.75M = $9.5M

