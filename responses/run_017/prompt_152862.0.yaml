  But note: if the true cause is A, then option 3 is the only one that prevents the loss. If the true cause is B, then option 2 is the only one that prevents the loss. Option 1 is bad in either case if there is a cause (because outbreaks will recur). However, we assume that if the cause is not addressed, the outbreak recurs with certainty and causes $10M in harm.

  But wait, the evidence is 55% for A (water) and 45% for B (technique). The expected cost of each option:

