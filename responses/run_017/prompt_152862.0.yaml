  Let p = probability of A (so 1-p = probability of B).

  Expected cost Option 2: p * $10.2M + (1-p) * $0.2M = 10.2p + 0.2(1-p) = 10.2p + 0.2 - 0.2p = 10p + 0.2
  Expected cost Option 3: p * $5M + (1-p) * $15M = 5p + 15(1-p) = 5p + 15 - 15p = 15 - 10p

