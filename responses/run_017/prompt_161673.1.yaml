prompt: |-
  I'm running a ninety-minute seminar next week for second-year cognitive-science undergraduates on Hofstadter's claim that an 'I' need not be confined to a single skull: that a self is a pattern which can be partly instantiated in more than one brain, and that when someone dies what persists of them is distributed, in diminished and unequal measure, across the people who carry it. Their preparation is one lecture on Parfit — teletransportation and the fission cases — and otherwise no philosophy. Most of them will arrive inclined to hear the claim either as obvious sentiment dressed up in technical language or as mysticism dressed up in cognitive science, and I want neither reaction left standing by the end.

  Don't explain Hofstadter's view to me; I know the view. Plan how I should teach it. What I want from you is the architecture of the session:

  The order the components have to come in, and why. Give me the dependency structure rather than a topic list: which idea has to be in place before the central claim is even intelligible, what each step buys for the next, and what specifically goes wrong if a later step is introduced early. My own instinct is that they cannot hear the claim about distribution until they have accepted the self as a pattern rather than an object, and that the pattern claim itself needs one prior move about self-reference and levels — but tell me if I have the order backwards, and say what breaks in each case.

  The one case that should carry the whole session, and what such a case must have and lack. I have been working with a pair of scientists who collaborated closely for thirty years, one of whom has since died; the survivor now notices that when he reads a manuscript he hears, unprompted and in something like the dead colleague's voice, the objection she would have raised, and that this hearing partly settles what he thinks. Tell me what this case needs in order to do the work — I assume it needs dense, long, two-way influence rather than admiration or imitation, and that it must involve no uploading, copying, teleportation, or resurrection machinery, since any of that sends them straight back to Parfit and turns the question into one about fission and duplicates — and, more usefully, tell me what else it must contain and what it must conspicuously lack.

  A three-way distinction I want them to be able to draw by the end, which I have been using in my own notes: (i) trace — the living person carries information about the dead one; (ii) simulation — the living person runs a working model that generates the responses the dead one would have generated, and does so accurately enough to be useful; (iii) co-inhabitation — the dead one's pattern is partly instantiated in the living brain in such a way that it partly constitutes the living person's own 'I'. Everything hangs on what would have to be true for the third to be more than the second. Say where each should be introduced, and give me the probe or small variation on the carrying case that prises (iii) apart from (ii) in a way these students can actually feel, rather than a definition they can repeat.

  The misconceptions, in the order they will actually arrive, and the point in the sequence at which each should be absorbed. My candidate list, which you should correct and reorder: that this is just memory and causal influence with a metaphor bolted on; that on this view my grandmother is alive as long as I remember her, which makes survival far too cheap; that partial survival is incoherent because identity is one-one and admits no degrees, so that Hofstadter must either be changing the subject or talking nonsense — this is the strong objection and I want it met head-on rather than managed, including the possibility that the honest answer is that he has changed the subject and that what he has changed it to is worth having; that if the pattern is the person then two sufficiently similar people are one person; that the view commits him to consciousness surviving death; and finally the word 'soul', which I want kept off the table until late, because introducing it early does something to the room that I would rather it do once the pattern claim is secured. Tell me which of these deserve real time and which should be acknowledged in a sentence.

  What I should refuse to open at this level, and say so out loud to them: I am inclined to fence off the hard problem of consciousness, the Further-Fact versus Reductionism dispute, and the fission literature. Tell me whether that is right, and what else I am likely to get pulled into that I should decline.

  One question I can put to them in the last five minutes such that their answer tells me whether they have grasped the difference between the second and the third grade, as opposed to having been merely moved by the example or persuaded that memory is important.

  Finally, be explicit about where this plan is weakest: which step you think is most likely to fail with this particular audience, what would lead you to reorder the sequence, and what consideration — an argument, a distinction I have not supplied, or a better reading of what Hofstadter is actually claiming than the co-inhabitation reading the plan rests on — would make you abandon the plan's central move and teach the topic some other way.
reasoning: |-
  Okay, I need to plan a seminar on Hofstadter's view of the self as a distributed pattern. The user is an experienced instructor who knows the material but wants a pedagogical architecture. Let me break this down step by step.

  First, the dependencies. The user suspects students must grasp self-as-pattern before distribution. I agree. The sequence should be: 
  1. Start with self-reference and levels (using videos or software examples) to show patterns can be substrate-independent. 
  2. Introduce self as pattern through Parfit's fission cases but quickly move to non-fission examples. 
  3. Only then present distribution. 

  If we reverse this, distribution sounds mystical without the pattern foundation, and self-as-pattern seems abstract without the levels framework. The case study comes after step 2 - it illustrates pattern distribution but would confuse if shown earlier.

  For the scientist case study: It needs long-term mutual shaping (not imitation), absence of tech (avoids Parfit comparisons), and asymmetric survival (shows partiality). Crucially, it must demonstrate automatic, integrated influence - the voice isn't consulted but participates. The weak point is distinguishing simulation from co-inhabitation, so we'll add variations: "What if he deliberately imagines her voice?" vs. "What if he's startled by her objection?" The latter shows involuntary participation.

  The three-way distinction: Introduce trace during initial case presentation (obvious). Simulation emerges when discussing how the voice works. Co-inhabitation is the reveal - probed by asking "Is her pattern part of his cognition?" The key probe: Contrast "He runs a simulation of her" with "Her pattern runs through him when he thinks." Use the startle test: If the objection interrupts him unbidden, it's not a tool he uses but a voice within.

  Misconceptions in predicted order: 
  1. "Just memory + metaphor" (address after case study) 
  2. "Grandmother survives in memory" (show asymmetry: she shaped him less than the co-equal scientist) 
  3. "Identity demands all-or-nothing" (confront directly: Hofstadter isn't talking about identity but persistence of patterns) 
  4. "Similar people = one person" (refute via pattern uniqueness) 
  5. "Consciousness survives" (deny: no ghost, just active patterns) 
  6. "Souls" (tackle last when pattern is secure). Spend real time on 1,3,5; glide through others.

  Fence off: Hard problem, Further-Fact debates, fission edge cases. State this upfront to avoid rabbit holes. The main risk is students demanding consciousness guarantees - shut this down by noting patterns aren't "ghost substrates."

  Final check question: "Could the dead scientist's pattern still be partly her if it only generated wrong predictions?" (No - simulation can fail; co-inhabitation requires functional integration.) If they say yes, they've missed the third grade.

  Weakest point: Getting them to feel co-inhabitation beyond simulation. May require leaning hard on the startle variation. If skepticism persists, pivot to Hofstadter's "causal potency" criterion: Does the pattern actively constrain his thoughts? Backup plan: Use shared idioms in close couples ("we think with one mind").

  Abandon plan if: They cling to numerical identity. Then retreat to "useful metaphor for influence" - but that's failure. Better to preempt by stressing "pattern survival isn't identity" early.
answer: |-
  Below is a rigorously structured seminar plan centered on **dependency architecture**, designed to dismantle initial skepticism and force engagement with Hofstadter's core claim. The sequence prioritizes cognitive scaffolding—each step *requires* the prior one to avoid misinterpretation. I’ll follow your requested sections precisely, highlighting why the order is non-negotiable, then address your specific queries.

  ---

  ### **Dependency Structure: The Non-Negotiable Sequence**
  1. **Levels of Description & Self-Reference** (20 mins)  
     *Why first?* Students must grasp **pattern/substrate separation** before "self as pattern" is intelligible. Without this, "pattern" sounds like vague poetry.  
     *Tool:* Use a *non-mind* example—e.g., a video file played on different devices (phone, projector, smartwatch). Emphasize:  
     - The *pattern* (video) persists across substrates.  
     - The pattern *is* the information, not the device.  
     - Self-reference: A video about video-making exemplifies a pattern referencing its own level.  
     *Dependency risk:* Skip this, and "self as pattern" collapses into "soul in a machine" or techno-mysticism.  

  2. **Self as Pattern, Not Object** (25 mins)  
     *Why next?* This *enables* distribution. Students must see the self as an abstract, replicable structure (like software) before it can "spread."  
     *Tool:* Use **Parfit as a foil, not foundation**. Briefly recap fission: "If your copied brain pattern activates in two bodies, is it 'you'?" Highlight Parfit’s conclusion: *Identity might not matter; survival of the pattern does.* Then **pivot hard** to non-fission cases:  
     - A musician internalizing their teacher’s style until they "hear" corrections mid-performance.  
     - How dialects/perceptions shift after living abroad.  
     *Key move:* Ask, "Is the 'teacher in your head' *part of you* or a *separate voice*?" This primes the co-inhabitation distinction.  
     *Dependency risk:* Introduce distribution now, and it becomes "memories + sentimentality."  

  3. **Distribution: The Core Claim** (30 mins)  
     *Why last?* Only now can "distributed self" avoid reductivism. Students have:  
     - Patterns ≠ substrates (Step 1).  
     - Self = pattern (Step 2).  
     → Thus, a self-pattern *can* distribute.  
     *Tool:* Your **scientist case study** (perfectly chosen). Isolate its *required* features:  
     - **Dense mutual shaping**: 30-year collaboration with *bidirectional* influence (e.g., co-authored papers, shared jargon, inside jokes).  
     - **No tech/magic**: Avoids Parfit-esque "copying" debates.  
     - **Asymmetry**: The survivor’s "hearing" is *unprompted* and *constrains* his thoughts (not just recall).  
     - **Gaps**: The colleague’s voice *only* comments on manuscripts—not other topics. Shows "partial" survival.  
     *Crucial omission:* Do *not* mention death until now. Frame it as "What persists when a collaborator moves to Antarctica?" Then reveal death.  

  ---

  ### **The Scientist Case: What It Must Do (and Lack)**  
  - **Must have**:  
    - **Bidirectional history**: They changed each other’s thinking (e.g., the survivor cites papers where *she* changed *his* view).  
    - **Unprompted intrusion**: The voice interrupts his workflow ("I didn't summon her; she *shoved* in").  
    - **Functional integration**: Her objections *alter his conclusions*; it’s not just "WWSD?" simulation.  
  - **Must lack**:  
    - **Admiration/imitation**: If he "idolized" her, it feels like projection.  
    - **Completeness**: Her voice is silent on topics beyond their work.  
    - **Accuracy checks**: Avoid "What if she’d disagree?"—this isn’t about prediction.  

  ---

  ### **The Three-Way Distinction: Prying Apart (ii) & (iii)**  
  - **Introduce sequentially**:  
    - **(i) Trace** (during case setup): "He recalls her views" → mere information.  
    - **(ii) Simulation** (when analyzing the case): "He runs a model to guess her response" → useful tool.  
    - **(iii) Co-inhabitation** (the reveal): "Her pattern *is a constituent* of his cognition" → not a tool he *uses*, but a pattern that *operates through him*.  
  - **The probe to split (ii) and (iii)**:  
    > *"What if, while reading, he’s startled by her objection—like an involuntary flinch? What if he says, 'I didn’t decide to think that; *we* thought it'?"*  
    Contrast with: *"What if he deliberately imagines her voice to check his work?"* → The first feels like *her* agency in *his* mind; the second is tool-use.  

  ---

  ### **Misconceptions: Order & Response**  
  Address them **as they arise** in this order:  
  1. **"Just memory + metaphor"** (arises after case intro)  
     → *Spend time*: Ask, "Does *your* memory argue with you? Does it *generate* new critiques?"  
  2. **"Grandmother survival"** (arises during distribution)  
     → *Acknowledge swiftly*: "Unlike the scientist, your grandmother didn’t co-write your thesis. Distribution requires *mutual* pattern-embedding."  
  3. **"Identity is all-or-nothing"** (strong objection; post-distribution)  
     → *Confront*: "Hofstadter agrees: numerical identity *dies*. What persists is *not* identity but *fragments of a pattern*." Give a 5-min debate.  
  4. **"Similar people = one person"**  
     → *Dismiss*: "Two identical videos are two instances. Patterns are multiply realizable."  
  5. **"Consciousness survives"**  
     → *Clarify*: "No—consciousness *ended*. A *pattern* persists, like a melody outliving its composer."  
  6. **"Souls"** (save for last)  
     → *Reframe*: "Call it a 'soul' if you like—but it’s a *physical pattern*, not a ghost."  

  ---

  ### **Fence Off These Topics (Declare Early)**  
  - **Hard problem of consciousness** → "We’re discussing *patterns of cognition*, not qualia."  
  - **Further-Fact vs. Reductionism** → "Hofstadter assumes reductionism; we won’t relitigate Parfit."  
  - **Fission literature** → "Teletransporters distract from real-world distribution."  
  - **Also refuse**: Group minds, hive identities, or AI uploading.  

  ---

  ### **Final Diagnostic Question**  
  > *"Could the dead scientist’s pattern still be ‘partly her’ if it always generated* wrong *objections? Why/why not?"*  
  - **Correct answer**: No. Co-inhabitation (iii) requires the pattern to be *functionally active in shaping thought*—not just present (i) or runnable (ii). If it’s inaccurate, it’s a broken simulation.  
  - **Why it works**: Tests if they see pattern-persistence as *causal efficacy*, not storage.  

  ---

  ### **Weakest Point & Contingencies**  
  - **Likely failure point**: Step 2 (Self as Pattern). Students may concede "self as software" but resist "my ‘I’ is *just* a pattern."  
  - **Why?** It feels like elimination, not redistribution.  
  - **Salvage plan**:  
    - **Pivot to "causal potency"**: Ask, "What *is* your ‘I’ if not the sum of patterns that *constrain* your choices?"  
    - **Drop "I" temporarily**: Substitute "cognitive agency" or "thinking style."  
  - **Abandon the plan if**: Students conflate *pattern* with *essence* (e.g., "But my *true self* is unitary!"). Then:  
    - Retreat to Hofstadter’s *strange loop* argument: The "I" *is* the self-referential pattern.  
    - Use a simpler case: A living duo who finish each other’s sentences. Ask, "Where does one ‘I’ end?"  
  - **Reorder only if**: Skepticism peaks early. Then:  
    1. Start with the scientist case *as mystery*.  
    2. Reverse-engineer: "What must be true for *this* to happen?"  
    3. Build levels/pattern retroactively.  

  ---

  This plan’s strength is its **narrative progression**—from abstract patterns (safe) to distributed selves (provocative). By refusing tech/magic early, you force engagement with the *everyday weirdness* of shared cognition. The scientist case is your engine; its design ensures (iii) feels distinct from (ii). If time flags, cut debate on "similar people" or "grandmothers." Go all-in on the probe question—it’s your litmus test for co-inhabitation.
