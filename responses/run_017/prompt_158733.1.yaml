answer: |-
  Below is a decision tree handout designed for your Moral Psychology seminar, structured to help students identify their own stance on guilt and shame without prior theoretical knowledge. The tree uses concrete, self-diagnostic questions focused on the dimensions you specified (what the emotion is *addressed to*, its temporal focus, response to omissions, and available exits). It avoids the overused act-vs-self contrast and minimizes jargon. 

  The tree has **7 distinct leaves** (positions), with clear markers for unexplored or incoherent combinations and pairs it cannot separate. A second tree on cultural choice follows, with **4 leaves**. Both are designed for undergraduate readability.

  ---

  ### **PART 1: PERSONAL MORAL EMOTIONS DECISION TREE**  
  *Answer the questions based on your gut reactions to real or imagined wrongdoings. Don’t overthink—go with your first instinct.*

  #### **START HERE**  
  **Q1: When you realize you’ve done something wrong, who do you feel owes something to whom?**  
  - **A:** "I owe something *to the person I hurt* (e.g., an apology, amends)." → **Go to Q2**  
  - **B:** "I owe something *to people who witnessed it* (e.g., explaining myself, saving face)." → **Go to Q3**  
  - **C:** "I owe something *to myself* (e.g., self-punishment, self-reflection)." → **Go to Q4**  
  - **D:** "No one owes anything; it’s about the *future* (e.g., doing better next time)." → **Go to Q7**  

  ---

  **Q2 (from A): After making amends to the person you hurt, does your bad feeling fade?**  
  - **A:** "Yes, mostly—once I fix it, I move on." → **Guilt-Primacy**  
  - **B:** "No—I still feel like a worse person, even after repair." → **Go to Q5**  
  - **C:** "Sometimes, but I can’t always repair it (e.g., if they’re gone, or it’s an omission)." → **Go to Q6**  

  **Q3 (from B): If people found out about your wrongdoing, would their judgment change your status?**  
  - **A:** "Yes—I’d feel demoted or excluded until I redeem myself." → **Go to Q5**  
  - **B:** "No—I’d feel bad, but it wouldn’t alter my place in the group." → **Go to Q6**  

  **Q4 (from C): Does feeling bad about yourself make you want to hide or withdraw?**  
  - **A:** "Yes—I avoid others until I ‘fix’ myself." → **Shame-Primacy**  
  - **B:** "No—it motivates me to improve *publicly* (e.g., confessing, making changes)." → **Go to Q6**  

  **Q5 (from Q2B, Q3A, or Q4A): Can you ‘reverse’ your feeling by doing good deeds later?**  
  - **A:** "Yes—if I do enough good, I feel ‘repaid’ and less stained." → **Moral Bookkeeping View**  
  - **B:** "No—the feeling lingers regardless of future actions." → **Shame-Primacy**  

  **Q6 (from Q2C, Q3B, or Q4B): Could you feel this way about something you *didn’t do* (e.g., a trait you didn’t choose, a failure to act)?**  
  - **A:** "Yes—I often feel bad about unchosen flaws or missed opportunities." → **Rehabilitation-of-Shame**  
  - **B:** "No—I only feel bad about deliberate actions." → **Division-of-Labor**  
  - **C:** "Rarely, and it’s not a strong feeling." → **Guilt-Primacy**  

  **Q7 (from D): When you think about the wrong, what’s your dominant thought?**  
  - **A:** "Regret about the *outcome* (e.g., ‘I wish things were different’)." → **Rejectionist View**  
  - **B:** "A mix of self-blame and regret—I can’t split them." → **Deflationary View**  

  ---

  #### **LEAVES (POSITIONS)**  
  1. **Guilt-Primacy**:  
     - Guilt is primary. It’s addressed to the victim, resolved through repair, and fades with amends. Shame is marginal or unhelpful.  
     - *Path: Q1 → A → Q2A or Q1 → A → Q2C → Q6C*  

  2. **Shame-Primacy**:  
     - Shame is primary. It alters your self-status, isn’t reversed by repair, and often involves withdrawal. Guilt is secondary.  
     - *Path: Q1 → C → Q4A → Q5B or Q1 → B → Q3A → Q5B*  

  3. **Division-of-Labor**:  
     - Guilt and shame are distinct and equally valuable: guilt for actions (repairable), shame for traits/omissions (motivating self-change).  
     - *Path: Q1 → A → Q2B → Q6B or Q1 → C → Q4B → Q6B*  

  4. **Rehabilitation-of-Shame**:  
     - Shame is healthy if it drives growth (not withdrawal). It can address unchosen flaws/omissions and doesn’t require an audience.  
     - *Path: Q1 → A → Q2C → Q6A or Q1 → C → Q4B → Q6A*  

  5. **Moral Bookkeeping View**:  
     - A hybrid: guilt/shame are debts tracked internally. Doing good later "cancels" bad feelings, creating a moral balance sheet.  
     - *Path: Q1 → B → Q3A → Q5A or Q1 → A → Q2B → Q5A*  
     - *Note: Rare in literature; some may find it incoherent (moral scorekeeping ignores the victim).*  

  6. **Deflationary View**:  
     - Guilt/shame aren’t distinct. They blur into one feeling (e.g., "remorse") that varies by situation, not phenomenology.  
     - *Path: Q1 → D → Q7B*  

  7. **Rejectionist View**:  
     - Neither guilt nor shame is ideal. Prefer forward-looking emotions like regret or remorse without self-punishment.  
     - *Path: Q1 → D → Q7A*  

  ---

  #### **NOTES ON THE TREE**  
  - **Unexplored Combinations**:  
    - *Moral Bookkeeping + Rehabilitation-of-Shame* (Q5A + Q6A): Logically possible (shame drives "repayment" via good deeds), but not theorized.  
    - *Guilt-Primacy + Omissions* (Q6A): Uncommon—guilt theorists often tie guilt to voluntary acts. May feel incoherent if guilt implies control.  
  - **Pairs the Tree Can’t Separate**:  
    - *Shame-Primacy vs. Moral Bookkeeping*: If you answered Q5B (no reversal), you land on Shame-Primacy; if Q5A (reversal via good deeds), on Moral Bookkeeping. The tree separates them, but in practice, some may vacillate.  
  - **Weak Branch**: Q3B → Q6 has fewer examples in literature. If chosen, it leans toward **Division-of-Labor** or **Rehabilitation-of-Shame**.  

  ---

  ### **PART 2: CAN A CULTURE CHOOSE ITS DOMINANT EMOTION?**  
  *Answer based on your views about societal institutions (e.g., justice, education, social norms).*

  #### **START HERE**  
  **Q1: Should wrongdoing be addressed publicly (e.g., community forums, social media) or privately (e.g., confidential hearings)?**  
  - **A:** "Publicly—norms need shared reinforcement." → **Go to Q2**  
  - **B:** "Privately—avoid stigma and focus on growth." → **Go to Q3**  
  - **C:** "Depends on the wrong (e.g., public for harms, private for traits)." → **Go to Q4**  

  ---

  **Q2 (from A): If publicly addressed, what’s the goal?**  
  - **A:** "Restore the victim and repair harm (e.g., restitution)." → **Go to Q5**  
  - **B:** "Uphold community standards and assign status (e.g., shaming)." → **Guilt/Shame Depends on Buy-In**  

  **Q3 (from B): Can private accountability (e.g., therapy, self-reflection) replace public judgment?**  
  - **A:** "Yes—it avoids shame and focuses on guilt/repair." → **Steering Possible (Toward Guilt)**  
  - **B:** "No—people need social pressure to care." → **Leakage Problem**  

  **Q4 (from C): Who should lead this process?**  
  - **A:** "Peers (e.g., community boards)." → **Go to Q5**  
  - **B:** "Specialists (e.g., judges, therapists)." → **Steering Possible (Hybrid)**  

  **Q5 (from Q2A or Q4A): What if the wrongdoer rejects the community’s values?**  
  - **A:** "They’ll still feel guilt if the process is fair." → **Steering Possible (Toward Guilt)**  
  - **B:** "They’ll feel shame or anger, undermining the goal." → **Leakage Problem**  

  ---

  #### **LEAVES (POSITIONS)**  
  1. **Steering Possible (Toward Guilt)**:  
     - Cultures can cultivate guilt by focusing on repair, privacy, and specialist-led processes. Shame can be minimized.  
     - *Path: Q1 → B → Q3A or Q1 → A → Q2A → Q5A*  

  2. **Steering Possible (Hybrid)**:  
     - Cultures can mix guilt/shame intentionally (e.g., public repair for acts, private growth for traits).  
     - *Path: Q1 → C → Q4B*  

  3. **Guilt/Shame Depends on Buy-In**:  
     - Institutions can’t control emotions—only whether people *identify* with the community. No identification = shame/anger, not guilt.  
     - *Path: Q1 → A → Q2B or Q1 → C → Q4A → Q5B*  

  4. **Leakage Problem**:  
     - You can’t choose: guilt-efforts leak into shame (e.g., repair feels stigmatizing), and shame-efforts fail without identification.  
     - *Path: Q1 → B → Q3B or Q1 → A → Q2A → Q5B*  

  ---

  #### **KEY FOR CULTURAL TREE**  
  - **"Leakage"** is flagged in questions (e.g., Q5B).  
  - **"Steering Possible"** positions assume institutions can reduce (but not eliminate) leakage with careful design (e.g., coupling public repair with reintegration rituals).  
  - **Weakness**: The tree can’t separate *Hybrid* from *Depends on Buy-In* if you endorse peer-led hybrid models (Q4A → Q5B). In practice, these overlap—hybrid requires buy-in.  

  ---

  ### **INSTRUCTOR NOTES**  
  - **Tree 1** separates all 7 leaves but has soft boundaries at Moral Bookkeeping/Rehabilitation-of-Shame.  
  - **Tree 2** doesn’t include a "Side-Effects Only" leaf (your third option) because all paths address leakage/buy-in; "Leakage Problem" covers it.  
  - **Plain Labels**: Avoids terms like "phenomenology" or "moral ecology." "Moral Bookkeeping" and "Leakage Problem" are self-explanatory.  
  - **Neutrality**: The trees don’t favor any outcome—e.g., Deflationary/Rejectionist and Steering/Leakage are equally reachable.  
  - **Time Estimate**: Students can complete both trees in 15–20 minutes.  

