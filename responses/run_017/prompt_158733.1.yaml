  We are creating two decision trees: one for personal moral reactions (Tree 1) and one for the cultural question (Tree 2).

  Tree 1: Personal Emotions
  Goal: To guide students through their own reactions to moral situations and land them on one of six to eight positions regarding guilt and shame.

  Named Positions (Leaves):
  1. Guilt-Primacy: Believes guilt is the primary or more important moral emotion.
  2. Shame-Primacy: Believes shame is the primary or more important moral emotion.
  3. Division-of-Labor: Believes both guilt and shame have distinct and important roles.
  4. Rehabilitation-of-Shame: Believes shame has been unfairly maligned and can be rehabilitated as a healthy moral emotion.
  5. Deflationary View: Believes guilt and shame are not distinct at the phenomenological level or are the same emotion with different eliciting conditions.
  6. Rejectionist View: Believes neither guilt nor shame is ideal; we should cultivate emotions like regret, remorse, or agent-regret without the self-directed sting.
  7. (Optional) Incoherent Combination: If a path leads to a combination that is incoherent or unattractive, we note it.
  8. (Optional) Unexplored Combination: If a combination is logically possible but not represented in the literature.

  Branching Questions (each answerable without knowing the outcome):
  We avoid the simple act-versus-self contrast. Instead, we use:
  - What the emotion is addressed to (the victim, the community, an internalized observer, nobody)
  - Whether it's backward-looking (debt-like) or forward-looking (regulative) or status-altering (irreversible)
  - Whether it can take omissions as its object (guilt about inaction, shame about unchosen traits)
  - What exit it offers (repair, disclosure, self-punishment, withdrawal, moral bookkeeping)

  Tree 2: Cultural Choice
  Goal: To explore whether a culture can deliberately choose to be guilt-dominant or shame-dominant.

  Named Positions (Leaves):
  1. Cultural Steering Possible: Believes a society can deliberately move towards a guilt-dominant or shame-dominant moral ecology.
  2. Side-Effects Only: Believes the guilt/shame contrast is a description of side-effects that cannot be directly steered.
  3. Leakage Problem: Believes that attempts to induce one emotion often result in the other or misfire due to audience effects.
  4. (Optional) Hybrid Approach: Believes that a mixed institutional design is possible and desirable.

  Branching Questions:
  - How public are sanctions?
  - Administered by peers or specialists?
  - Wrongdoing framed as a debt or a stain?
  - Does the agent identify with the disapproving community?
  - Is there an exit available?

