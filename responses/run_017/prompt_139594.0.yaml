prompt: |-
  I sit on the grants committee of a small family foundation. For three decades the payout has gone to near-term causes — vaccination, deworming, secondary school scholarships — and this autumn we are being asked to move roughly a third of it into longtermist funding. I volunteered to read into the philosophical literature before we vote and, because I was reading anyway, to act as second marker for a colleague's third-year seminar on the ethics of the long-run future. The essay question and one submitted answer are reproduced below. I would like an independent and reasonably severe reading of the answer; my own judgement is not to be trusted, since I have no training in this area and the prose is persuasive.

  Please do three things. First, assign a mark out of 25, with a sentence on where that places the answer in the range. Second, give point-by-point comments keyed to the structure of the question — parts (a), (b) and (c) — flagging both what the student gets right and, specifically, anything that reads as correct but is not; where a step is defensible but under-defended, say so rather than marking it wrong. Third, say in two or three sentences what a first-class answer to (c) would have had to establish.

  Question (25 marks)

  Strong longtermism, as we have encountered it this term, has two components: an axiological component, to the effect that the value of what we do now is determined, to a very large extent, by the effects of our actions on the very long-run future; and a deontic component, to the effect that we ought to be doing considerably more than we currently are to make that future go well.

  A critic — call her the levelling critic — argues that the first component cannot support the second. Her argument runs as follows. Our best models of how a present intervention propagates into the very long-run future are so uncertain that once credence is spread across the full range of mechanisms by which the intervention might matter, the expected long-run value of every serious candidate intervention comes out roughly the same. If that is right, the long-run term in our decision problem is approximately a constant across the options: it cancels. But a term that cancels cannot tell us to do one thing rather than another. Nor, she adds, can the longtermist retreat to the thought that some very small probability of a very large effect is enough: for every mechanism by which an intervention might improve the long run there is a broadly similar mechanism by which it might worsen it, and nothing in the axiological component tells us which family of mechanisms is more probable.

  Write an essay in which you:

  (a) set out the levelling argument in the strongest form you can, state precisely which component of strong longtermism it targets, and explain the difference between saying that the long-run term is roughly constant across the options and saying that long-run effects have no value;

  (b) assess whether the claim that the stakes are astronomical is by itself an adequate reply. You may use the following illustration: intervention A certainly improves the near-term welfare of one million people by a given amount; intervention B has some probability p of improving the very long-run future by the equivalent of ten billion such improvements, and otherwise does nothing;

  (c) consider whether the case for strong longtermism survives if we hold the axiological component fixed but adopt a person-affecting axiology of population ethics rather than a totalist one — for instance the asymmetry, on which a person can be made better or worse off by how their life goes once they exist, but bringing a person into existence with a life worth living benefits nobody. Be explicit about what such a view can and cannot say about the badness of human extinction.

  Submitted answer

  Strong longtermism (SLT) is best understood as two claims. The axiological claim is that the very long-run future contains, in expectation, astronomically more value than the near term: there may be trillions of future people, and the near-term effects of anything we do now are a rounding error by comparison. It is because the future is where the value is that the effects of our actions on the long run determine, to a very large extent, how good those actions are. The deontic claim follows directly: we ought always to act so as to maximize the expected value of the very long-run future. On this view the near-term benefits of an intervention drop out of the picture except insofar as they feed into long-run outcomes. The comparative formulation — we should be doing more — is best read as a maximising instruction in polite dress; taken literally it is too weak to be worth defending.

  The levelling critic is best read as attacking the bridge between the components rather than the axiology itself. For the sake of argument she grants that long-run effects determine most of the value of what we do, and argues that this cannot tell us what to do. The distinction the question invites is important here: a term that is constant across the options is not a term with no value. It can be enormous and still fail to discriminate between options. That is why her argument is an epistemic objection about our leverage on the future, not a claim about the value of the future. She has two lines of support. The first is that our models of long-run causal propagation are too diffuse for the long-run terms of different options to differ in any estimable way. The second is that where we do have some grip, the mechanisms by which an intervention might improve the long run are roughly matched by mechanisms by which it might worsen it, so the expected long-run effect hovers near zero. If either line holds, the long-run term cannot do the work that the deontic component requires of it.

  Is the appeal to astronomical stakes an adequate reply on its own? No, and no careful longtermist should say otherwise. The size of the future's value is one factor in a product; the other is the difference our action makes to it. So the view needs a leverage premise: some probability that what we do now affects the trajectory of the long run. But that premise is close to trivially satisfied. Take the illustration. A's certain benefit is 10^6 units; B's expected benefit is p times 10^10; the two are equal at p = 10^-4. So a one-in-ten-thousand chance of a large long-run effect already matches a certain benefit to a million people, and B wins at any p above that threshold. More generally, since there is no upper bound on how many future people there might be, it is enough that the probability of our affecting the trajectory be non-zero: for any non-zero p, some finite number of future people is large enough that p multiplied by the value at stake exceeds the value of any near-term benefit. This is also why the critic's symmetry point does no work. Symmetric mechanisms cancel in expectation only where the magnitudes on either side are equal, and here the magnitudes are astronomical. Long-run considerations therefore dominate the decision problem even before we ask how likely it is that our action makes a difference.

  Finally, suppose we keep the axiology but adopt a person-affecting view of population ethics — the asymmetry, on which a person can be made better or worse off by how their life goes once they exist, but on which bringing a person into existence with a life worth living benefits nobody, though it can harm them if the life is not worth living. It is sometimes said that this deflates the longtermist case, on the grounds that if value is person-affecting then extinction harms nobody: those who would have existed are not made worse off by not being created. I think this is a misreading of the asymmetry. Extinction would deprive all the people who would otherwise have existed of the good lives they would have led, and being deprived of a good life is bad for the person deprived of it. What the asymmetry denies is that there is a reason to create happy people; it does not deny that there is a reason not to take away a good life that someone would otherwise have had. So the person-affecting restriction costs the longtermist very little: the astronomical figure survives, and with it both components of SLT. There is a residual question about the loss to people alive now, through the frustration of their projects and desires, but that is a small part of the loss and in any case not the part the longtermist is trading on.

  The levelling critic has therefore identified a genuine constraint — the longtermist needs a leverage premise — but it is a constraint that is met almost automatically. What remains of her objection is a general scepticism about acting under uncertainty that nobody should accept. Strong longtermism survives intact, in both components and on either axiology.
reasoning: |-
  Okay, let me approach this grading task methodically. The user is a foundation committee member seeking an impartial evaluation of a philosophy essay on longtermism, and I need to provide three specific outputs: a mark out of 25, structured feedback, and a note on what a first-class answer to part (c) would require.

  First, I'll analyze the essay against the question's three parts. For (a), the student correctly identifies the levelling argument targets the bridge between axiology and deontic components, not the axiology itself. The distinction between constant value and no value is well-handled, though the "two lines of support" could be more precisely integrated with the critic's symmetry point from the prompt.

  For (b), the student's leverage premise explanation is strong, and the numerical example is correctly applied. But they miss a nuance: the critic's symmetry concern isn't fully addressed because matching magnitudes assumption isn't challenged. The "cancels in expectation" claim needs deeper engagement with probability distributions.

  Part (c) is where significant issues arise. The student conflates deprivation with harm under person-affecting views. Their extinction argument contradicts the asymmetry's core principle - non-existent people can't be deprived. The "residual question" dismissal is too quick. This section contains substantive errors that weaken the overall case.

  Considering the balance: parts (a) and (b) show good comprehension despite minor gaps, but (c) has fundamental flaws. The writing is polished, which may mask conceptual problems - exactly what the user feared about being persuaded by prose.

  For the mark: I'm considering 15/25 as the essay demonstrates competence but has serious errors in a key section. That places it around lower second-class (2:2) by UK standards.

  For the first-class (c) requirement: It would need to acknowledge that under strict person-affecting views, extinction harms no future individuals, then either justify a deprivation-based value or reinterpret "harm" through actual people's interests. The trade-off between near-term and long-term losses must be quantified, not dismissed.

  The user's context matters here - they're using this exercise to inform real funding decisions, so rigor is crucial. I should emphasize where the student's confidence outpaces their argumentation, especially regarding extinction ethics.
answer: |-
  ## Mark and Placement
  **15/25** – This places the answer in the lower second-class range (UK system: 2:2). It demonstrates a competent grasp of the core concepts and structures a coherent argument, but contains significant errors in part (c) and lacks sufficient depth/rigour in parts (a) and (b) to achieve a higher mark.

  ## Point-by-Point Comments

  ### (a) Setting out the levelling argument (Target: ~8 marks)
  *   **Strengths:**
      *   Correctly identifies the target as the "bridge" between the axiological and deontic components (i.e., how the claimed axiological dominance translates into deontic force).
      *   Accurately explains the key distinction: a constant long-run term has enormous value but doesn't discriminate between options, unlike a term with no value.
      *   Correctly frames the argument as primarily epistemic (about our knowledge/leverage) rather than axiological (about the value itself).
      *   Captures the two core lines of the levelling argument (diffuse models, symmetry of mechanisms).
  *   **Weaknesses/Under-Defended Points:**
      *   While mentioning "diffuse models", the student doesn't sufficiently emphasize the *uncertainty* aspect – the core idea is that credence is spread so thinly *across many possible mechanisms* that the *expected* values converge. The phrasing "too diffuse for... to differ in any estimable way" gestures at this but could be sharper.
      *   The explanation of the symmetry point ("mechanisms... roughly matched... hovers near zero") is acceptable but could be more precise by explicitly linking it to the "spread credence" idea: for every mechanism where intervention X improves the future by magnitude M, there's a similar-credence mechanism where it worsens it by ~M, leading to cancellation *in expectation*.
      *   **Minor Point:** The claim that the deontic component *directly follows* from the axiological one in SLT is slightly overstated; the levelling critic precisely argues that the axiological dominance *alone* doesn't entail the deontic claim without a leverage premise.

  ### (b) Assessing the "astronomical stakes" reply (Target: ~8 marks)
  *   **Strengths:**
      *   Correctly identifies the need for a "leverage premise" (some probability p > 0 of affecting the long-run trajectory).
      *   Correctly applies the numerical example: showing dominance at p > 10^-4.
      *   Correctly states the general longtermist point: with unbounded potential future value, *any* non-zero p of affecting it (positively) will eventually dominate any finite near-term benefit.
      *   Correctly identifies the flaw in applying the symmetry objection directly here: the levelling critic's symmetry argument (in part (a)) is about the *expected value calculation itself* converging to zero/constant, not about symmetric magnitudes cancelling *within* a scenario where positive impact *is* possible. The student rightly notes that if you *can* assign a p to a large positive impact, the symmetry argument doesn't automatically negate it *unless* the levelling holds (i.e., unless positive and negative impacts *are* symmetric in expectation).
  *   **Weaknesses/Under-Defended Points:**
      *   The dismissal of the symmetry point ("does no work") is **too quick and potentially misleading**. The levelling critic *would* argue that the calculation of p *itself* is subject to the symmetry problem: for any mechanism you identify giving p of a large positive impact, they posit a symmetric mechanism giving p of a large *negative* impact of similar magnitude and credence, meaning the *expected value* of B might still hover near zero *despite* the astronomical stakes. The student assumes we can isolate a positive p without its symmetric counterpart dominating the calculation, which is precisely what the levelling denies. They needed to engage with *how* the longtermist can overcome *this specific symmetry challenge to estimating p*.
      *   The claim that the leverage premise is "close to trivially satisfied" glosses over the deep epistemic challenges raised by the levelling argument. It *is* trivial to say *some* effect exists (p>0), but specifying a *net positive* effect large enough to be estimably different from zero (or constant) is the core difficulty the levelling critic highlights. The student conflates the existence of *some* effect with the estimability of a *net positive effect*.
      *   The answer doesn't explicitly note that the levelling critic might accept the *formula* (p * huge value) but deny we can get a reliable, non-levelled estimate for p.

  ### (c) Person-affecting axiology and extinction (Target: ~9 marks)
  *   **Strengths:**
      *   Accurately describes the key features of the Asymmetry: existence can harm (if life bad) but cannot benefit (if life good); only existing people can be benefited or harmed by events affecting their lives.
      *   Correctly identifies the standard person-affecting challenge to the badness of extinction: it doesn't harm the non-existent.
      *   Clearly states their intended rebuttal: extinction *does* harm because it deprives people who *would* have existed of good lives.
  *   **Critical Errors:**
      *   **Fundamental Flaw:** The student's rebuttal ("depriving... is bad for the person deprived") **directly contradicts the person-affecting Asymmetry they just defined.** Under the strict Asymmetry, a person who *never exists* cannot be "deprived" or "harmed" by not existing. There *is no subject* for whom non-existence is a harm if their life would have been good. The Asymmetry explicitly denies that failing to bring a person with a good life into existence is bad *for anyone*. The student's argument relies on a *deprivation account* of harm that is incompatible with the Asymmetry they are supposed to be adopting. This is a significant misunderstanding.
      *   **Consequence:** By incorrectly claiming the Asymmetry allows deprivation harms to the non-existent, the student invalidates their conclusion that "the astronomical figure survives". Under the actual Asymmetry, the primary "astronomical" loss from extinction – the non-existence of trillions of potential people with good lives – *does not count as a harm or a loss of value* on this view. This drastically reduces the "astronomical figure".
      *   **What the Asymmetry Can Say:** It *can* say extinction is bad because:
          *   It harms *currently existing people* (e.g., by cutting their lives short, preventing the fulfillment of their long-term projects/desires, causing suffering during the extinction event).
          *   It harms *people who will exist in the near future regardless* (e.g., the last generation(s) suffer immensely knowing they are the end).
      *   **What the Asymmetry Cannot Say:** It *cannot* say that extinction is bad because it prevents the existence of future people who would have had good lives. The value of those *possible* good lives does not count as a loss *for anyone* under the Asymmetry.
      *   **Dismissal of Near-Term Losses:** While correctly noting this is a smaller loss under a totalist view, dismissing the frustration of existing people's projects/desires as "a small part" is **unjustified within the person-affecting framework**. Under the Asymmetry, *this is the primary source of the badness of extinction* (alongside harm to existing/near-future people). The longtermist case *does* lose its primary source of astronomical value – the potential good lives of the vast future – and becomes reliant on harms to existing/near-future people and the loss of *their* potential future good experiences/projects. This is a *significant* weakening of the SLT case, contrary to the student's conclusion.

  ## What a First-Class Answer to (c) Would Need to Establish (2-3 Sentences)

  A first-class answer would explicitly acknowledge that adopting the Asymmetry **eliminates the primary source of the "astronomical" badness of extinction** – the loss of potential future good lives doesn't count as harm to anyone. It would then rigorously explore the *remaining* sources of badness under this view: harms to *existing and near-future people* (shortened lives, suffering, project frustration). Crucially, it would assess whether *this person-affecting badness of extinction* (which is finite) can plausibly sustain the "astronomically more value" claim of the axiological component and thereby support the strong deontic demand, likely concluding it significantly weakens the SLT case.
