  The user wants to identify which desiderata for cognitive extension theories are non-negotiable versus which might be theoretical biases. They're particularly interested in whether parity arguments, demands for intrinsic content, phenomenological requirements, and anti-bloat constraints are genuine necessities or just philosophical preferences. Their core suspicion is that three requirements might be incompatible: metaphysical neutrality, determinacy in hard cases, and non-question-begging criteria.

  I need to analyze this carefully. The user is clearly deeply familiar with the literature and wants to move beyond survey to original analysis. Their focus is conceptual sorting - exposing which demands are substantive versus which might be disguised commitments. The legal attribution purpose makes determinacy crucial, but this might conflict with how cognition actually works.

  For the desiderata analysis, I'll categorize each as non-negotiable, camp preference, or eliminable based on the cases. Non-negotiables would be those required by the legal purpose itself - like determinacy and interpersonal attribution. Camp preferences might include parity demands or anti-bloat constraints. The inscrutable resource case shows that surveyability isn't necessary if reliability and transparency exist.

  The trilemma is key here: metaphysical neutrality, determinacy, and non-question-begging criteria seem incompatible. If we insist on neutrality and determinacy, we might need to beg the question by smuggling in intracranial assumptions. If we avoid question-begging and stay neutral, we lose determinacy. The legal context might force us to prioritize determinacy over perfect metaphysical purity.

