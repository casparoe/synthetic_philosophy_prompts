  In scoring theories, I'll briefly evaluate functionalist, commonsense, systems-based, enactive, and integrationist approaches against the cases. The systems view handles shared resources well but struggles with dormant cases. Enactive views reject the framing entirely. Integrationist views might handle plasticity but blur legal boundaries.

  Finally, about the framing: legal attribution does import special demands for determinacy that explanatory purposes wouldn't require. If the purpose were scientific modeling instead, we could drop the determinacy requirement and accept fuzzier boundaries. But for legal institutions, we need clear attribution rules despite cognitive complexity.

