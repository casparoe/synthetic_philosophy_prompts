                 - For the with-serial-number part: 
                      - If you are #1, under SSA you report 10/11 for A. 
                           If the world is A (which it is with probability 10/11 given you are #1 and under SSA), your score is 1 - (1-10/11)^2 = 1 - (1/11)^2 = 1 - 1/121 = 120/121.
                           If the world is B (prob 1/11), your score is 1 - (10/11)^2 = 1 - 100/121 = 21/121.
