  ### Self-Sampling vs. Self-Indication: A Runnable Game  
  **Goal:** Make the SSA (self-sampling) vs. SIA (self-indication) disagreement visceral, and test whether per-world scoring nullifies SIA’s edge.  

  ---

  #### **Materials**  
  - **World Die**: 6-sided die (World A if 1–3, World B if 4–6).  
  - **Observer Cards**: Index cards labeled with:  
    - **World A**: 10 cards numbered 1–10.  
    - **World B**: 10 cards numbered 1–10 (same numbers, but distinct world).  
  - **Scoring Tokens**: Chocolate coins (or poker chips).  
  - **Envelopes**: To hide world assignments.  
  - **Betting Slips**: For probability estimates.  
  - **Whiteboard**: Track scores.  

  #### **Setup**  
  - **Worlds**:  
    - **World A (Small)**: 10 observers.  
    - **World B (Large)**: 10,000 observers.  
  - **Prior**: 50/50 (via die).  
  - **Participants**: 13 players (plus 1 facilitator).  
  - **Rounds**: 4 rounds (2 without info, 2 with early serial number), 10–15 min each.  

  ---

  ### **Game Flow**  
  #### **Round 1: No Info, Per-Observer Scoring**  
  1. **Assign Worlds**: Roll World Die. Hide result in envelope.  
  2. **Assign Observers**:  
     - **World A**: Shuffle 10 observer cards, randomly assign 10 players.  
     - **World B**: Assign *all 13 players* an observer card (ignore 3 extra numbers; explain this simulates "being in a huge world where not all slots are filled in the room").  
  3. **Bet**: Players estimate **P(World A)** on a slip (0–100%). No talking.  
  4. **Reveal & Score**:  
     - **Per-Observer**: Each correct bet (within 10% of truth) earns 1 token.  
     - *Debrief later*: SIA players bet near 0.1% (since 10 observers vs. 10,000 favors World B). SSA players often stick near 50%.  

  #### **Round 2: Early Serial Number, Per-Observer Scoring**  
  1. Repeat **Steps 1–2**, but now:  
     - **Reveal Serial Numbers**: Tell players their number (e.g., "You are #2").  
  2. **Bet**: Players estimate **P(World A)** again.  
  3. **Reveal & Score**: Same as Round 1.  
     - **Flip Moment**: SSA players jump to >90% for World A (since #2 feels "early" in small world). SIA players stay near prior (50%).  

  #### **Round 3: No Info, Per-World Scoring**  
  1. Same as Round 1, but scoring changes:  
     - **Per-World**: Total winnings = 10 tokens per correct world. Split *equally* among observers in that world.  
     - *Example*: If World A wins, 10 tokens split among 10 observers (1 each). If World B wins, 10 tokens split among 13 observers (~0.77 each).  
  2. **Bet & Score**: Players bet, then calculate payouts.  

  #### **Round 4: Early Serial Number, Per-World Scoring**  
  1. Repeat Round 2 with per-world scoring.  

  ---

  ### **Debrief (20 min)**  
  Map key moments to the debate:  
  1. **Per-Observer Scoring (Rounds 1–2)**:  
     - **SIA’s Edge**: In Round 1, SIA wins big (many winners in World B). In Round 2, SSA wins if World A is true (high payout for #2).  
     - **His Objection**: "SIA racks up points via copy count." *Concede*: Yes, but that’s the point—existence *is* evidence for more observers.  

  2. **Per-World Scoring (Rounds 3–4)**:  
     - **Edge Evaporates?**: SIA’s advantage fades. In World B, 10 tokens split 13 ways (tiny individual gain). SSA’s World A win pays well.  
     - **Crucial Point**: Scoring system changes incentives, but *not beliefs*. SIA still rationally believes World B is likely—it just doesn’t pay under per-world.  

  3. **The Flip (Round 2)**:  
     - Why SSA jumps: "Observer #2" feels impossible in World B (only 1-in-10,000 chance), but certain in World A. SIA ignores indexicals.  

  4. **Concessions**:  
     - **You**: SIA relies on per-observer scoring to "win" bets.  
     - **Him**: Per-world scoring neutralizes SIA’s edge—but doesn’t refute its truth-tracking.  

  ---

  ### **What Will Go Wrong & Fixes**  
  1. **"Fifty-Fifty Prior"**:  
     - **Preempt it**: Start by voting: "Who thinks P(World A) is 50%?". Then run Round 1. Show aggregate bets—likely clustering near 0.1% (SIA) and 50% (SSA). Use token counts to prove SIA dominates.  

  2. **Room Sample Size (n=13)**:  
     - **Lean in**: Ask: "If World B has 10,000 observers, why are only 13 of you here?". Point: This *is* the sampling bias SIA/SSA debate. The game abstracts it—real philosophers argue about weightings.  

  3. **"World B Observers Overcrowded"**:  
     - **Fix**: In World B, assign all 13 players cards (ignore number gaps). Stress: "You’re in a vast world; this room holds a fragment."  

  4. **Noise from Few Rounds**:  
     - 4 rounds × 13 players = 52 data points. Enough to show:  
       - SIA bets consistently low (World B favored).  
       - SSA jumps when serial numbers given.  
       - Per-world scoring flattens differences.  

  ---

  ### **What the Game Can’t Do**  
  - **Infinite/Unknown Worlds**: Finite, known sizes simplify the math.  
  - **Reference Class**: You set "observers," not players.  
  - **Betting vs. Belief**: Scoring rewards calibration, but doesn’t prove metaphysical truth.  

  ### **Timeline**  
  - Intro (5 min)  
  - Rounds 1–4 (60 min)  
  - Debrief (20 min)  
  - Buffer (5 min)  

  This forces players to *feel* the update flips and scoring trade-offs. The chocolate makes it sting.
