prompt: |-
  Last night a friend and I argued for several hours about whether our emissions policy can wrong people born a century from now. I came away unable to locate the break in her reasoning, and I would like your help finding it. She sets it out as follows.

  (1) Call a choice *identity-fragile* when the set of people who ever exist depends on which option is taken. Every realistic climate policy choice is identity-fragile: a carbon tax shifts where people travel and work, whom they meet, and when they conceive, and because conception timing is sensitive to circumstance, within a couple of generations the entire downstream population is different.

  (2) A choice wrongs someone only if it makes that person worse off than they would otherwise have been. Wrongness is person-affecting, and the complaint is comparative.

  (3) Compare a lax policy L (roughly 3°C of warming) with a stringent policy S (roughly 2°C). Because of (1), everyone who exists under L is a distinct person from everyone who exists under S. The people who exist under L would not have existed under S at all.

  (4) The lives of the L-people, though hotter, poorer, and more hazardous than the lives of the S-people, remain well above the threshold at which existence is a harm to the one who lives it.

  (5) So no one who exists under L is worse off than they would otherwise have been: their only alternative under S was never to exist, and (4) says that would not have been better for them.

  (6) By (2), choosing L wrongs no one. Since the reasoning does not depend on the size of the gap between L and S, no realistic climate choice wrongs anyone, whatever the warming. Duties of intergenerational climate justice turn out to be empty; there remain only impersonal reasons of optimality, if one happens to care about aggregate welfare.

  (7) She adds that the argument generalizes rather than reducing to absurdity: a policy that knowingly bequeaths a degraded but survivable world — depleted soils, collapsed public infrastructure, endemic background risk — to a population whose identities depend on that very policy wrongs no one either, so long as those lives stay worth living. She thinks our intuition here is simply a non-identity case in disguise.

  Two lines of resistance I tried both stalled. I said that some future people are *identity-robust* — people alive now, and those whose conception timing is insensitive to our policy — and that (3) fails for them. She grants that the same-people case is where the comparative test does real work, but says that set is a demographically contingent remnant that cannot ground duties to generations a century out. I also pressed her on (5), and she replied that nonexistence is not a state a person can be in, so "worse off than they would otherwise have been" is not false for the L-people but undefined, and that an undefined comparative claim cannot ground a duty, so the duty drops out.

  I feel the argument proves too much and cannot accept (6) or (7), but every premise looks defensible. Please tell me which step fails and why it looked sound. If I have to choose, I would rather keep some person-affecting constraint than accept (7) — though I am uneasy about abandoning (2) outright, since a purely impersonal view seems to license displacing actual people with better-off replacements. Price the alternatives for me: giving up the comparative person-affecting requirement, resisting (1)'s scope claim about identity fragility, and the move from (4) to (5). Lead with your bottom line in the first sentence — the step you reject and, in a phrase, the reason — then give the reasoning, with no preamble and no restatement of what I have asked.
reasoning: |-
  Hmm, the user presents a complex philosophical argument about climate policy and future persons, specifically the non-identity problem. Their friend argues that since future people's identities depend on our current emissions choices (identity fragility), and since these future people wouldn't exist under alternative policies, we can't wrong them by choosing policies that give them worse lives - as long as those lives are worth living. The user finds this conclusion troubling but can't locate the flaw.

  The argument structure is clear: (1) establishes identity fragility for climate policies, (2) defines wronging as comparative harm, (3) notes future people under different policies are distinct, (4) assumes lives remain worth living, (5) concludes no one is worse off, leading to (6) no wronging occurs and (7) generalization to other policies.

  Key premises to examine: The identity fragility claim (1) seems solid for long-term future generations due to butterfly effects. The comparative harm principle (2) is standard in person-affecting ethics. The inference from (4) to (5) is where I suspect the flaw lies - the friend assumes that since non-existence isn't worse for the person (as per (4)), there's no comparative harm. But this ignores how we define "worse off" in counterfactuals involving non-existence.

  The user tried two objections: identity-robust present people (which friend concedes but dismisses as insignificant for long-term duties), and challenging (5) by questioning whether non-existence can be a comparison state. The friend responds that "worse off" is undefined when comparing to non-existence, so no duty arises.

  I think the critical failure is at step (5), specifically the interpretation of comparative harm when the alternative is non-existence. While non-existence isn't a state of being for the person, we can still make meaningful comparisons between existence in one state versus never existing. The friend's claim that this comparison is undefined is questionable - many ethicists argue that if a life is worth living, existence is better than non-existence for that person. Therefore, choosing a policy that gives someone a worse existence than they could have had (if they'd existed under better conditions) could still wrong them, even if their alternative was non-existence.

  Alternative approaches would be: abandoning the strict person-affecting view (risking impersonal aggregation problems), challenging identity fragility (difficult for long-term futures), or rethinking the comparative harm principle itself. But modifying the comparative framework seems most promising - perhaps adopting a "same number choice" approach where we compare possible lives for the same possible person, which avoids the non-identity trap.

  The user seems ethically committed to maintaining some person-affecting constraint but troubled by the implications of strict comparative harm. I should emphasize that rejecting (5) doesn't require abandoning person-affecting ethics entirely, just refining how we handle counterfactuals involving different populations.
answer: |-
  The step that fails is **(5)**, because the comparative claim "worse off than they would otherwise have been" is meaningful and false for the L-people under a plausible interpretation, despite identity fragility. The inference from (4) to (5) incorrectly assumes that "would otherwise have been" must refer to a state of nonexistence for the *same* person, rendering the comparison undefined. However, in ethical evaluation, we routinely compare the actual outcome for a person against the counterfactual outcome *had a different choice been made*, even if that person wouldn’t exist in the alternative scenario. The L-people are *not* worse off than they would have been under S because they wouldn’t exist under S at all—but this doesn’t imply the comparison is undefined. It implies the comparison is false: they are *not worse off* than in the S-scenario precisely because they don’t exist in it. Crucially, this does not entail that choosing L fails to wrong them. The flaw is conflating the *falsity* of the comparative claim ("they are worse off") with the *undefinedness* of that claim, allowing the person-affecting constraint (2) to evade its work. Here’s why:

  1.  **The comparison is false, not undefined:** For a specific L-person, the statement "L-person is worse off than they would have been under S" is false because "they would have been [anything] under S" is false—they wouldn’t exist. A false statement is still meaningful; it has a truth value (false). Undefinedness would arise only if the concept of "L-person" couldn't be referenced in the S-scenario, but we *can* refer to them hypothetically ("Had S been chosen, L-person would not exist"). The friend’s move to claim undefinedness in (5) is an unjustified semantic leap to avoid the implication that the comparative claim is simply false, which (under premise 2) would block the conclusion of wrongdoing.

  2.  **False ≠ Absence of Harm/Wrong:** Premise (2) requires that wrongdoing depends on making someone *worse off*. The falsity of "L-person is worse off than under S" shows this *specific condition* isn’t met. However, this doesn’t prove no wrong was committed; it only shows wrong wasn’t committed *via this comparative mechanism*. The argument mistakenly treats the falsity/undefinedness of the comparison as proof that no other basis for wronging exists within a person-affecting framework. Yet, alternative person-affecting views exist that reject strict comparativism.

  3.  **The core problem is premise (2):** The comparative person-affecting requirement (2) is the real vulnerability. It forces us into the non-identity trap. Rejecting (2) allows grounding duties to future people without needing to claim they are worse off than in an alternative where they don’t exist. We can adopt a *non-comparative* person-affecting view: an action wrongs someone if it causes them to exist in a harmed state (e.g., severe climate suffering), *even if* their alternative was non-existence. This directly challenges (5) by rejecting the necessity of the comparison. Choosing L wrongs the L-people by imposing severe, avoidable harms upon them, full stop. This avoids impersonal aggregation but accepts that bringing people into a harmed state can wrong them, even if their life is net-positive.

  **Pricing the alternatives:**
  *   **Give up comparative person-affecting (2):** Reject strict comparativism. Adopt a non-comparative harm principle: causing someone to exist with severe, avoidable suffering wrongs them. *Cost:* Faces the "Parfitian" challenge: if causing a harmed-but-worthwhile life wrongs the person, does causing a wonderful life benefit them? This might seem counterintuitive. It also doesn't easily explain why not creating a potential person isn't wronging them. *Benefit:* Rescues person-affecting duties to future generations and invalidates (6)/(7). Avoids impersonal aggregation.
  *   **Resist identity fragility (1):** Argue that for policy choices impacting distant futures, *collectives* or *types* of people (e.g., "the 22nd-century generation") are the relevant subjects of harm, not specific individuals. Their collective welfare is diminished by L compared to S. *Cost:* Blurs person-affecting ethics into impersonal aggregation ("the sum of welfare of whoever exists"). Requires accepting that duties attach to abstract groups, not specific persons. May not convince those committed to strict individualism. *Benefit:* Preserves a comparative framework attached to a subject, blocking (5) by allowing "the future generation" to be worse off under L.
  *   **Reject the inference from (4) to (5):** As argued above, insist the comparison is false, not undefined, but argue that wrongdoing doesn't *solely* depend on comparative harm. Supplement (2) with a non-comparative harm principle or shift the subject to collective harm. *Cost:* Less theoretically tidy; requires modifying the core person-affecting premise. *Benefit:* Most directly targets the flawed step while keeping a form of person-affecting constraint.

  Your unease about abandoning (2) due to impersonal aggregation licensing replacement is valid. The non-comparative harm view avoids this: displacing actual people with better-off replacements typically *harms* the displaced people (by causing their non-existence/death), which *is* wrong under that view. Replacement cases usually involve distinct harms to the displaced, not just impersonal gains. The non-comparative approach thus offers the most coherent path to rejecting (6) and (7) while maintaining a robust person-affecting constraint focused on preventing severe harm to future persons.
