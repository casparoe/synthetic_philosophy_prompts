prompt: |-
  I'm a philosophy professor, and for the last couple of years I've been the token ethicist on our teaching hospital's clinical ethics committee. We get about thirty consults a year, and we have to log a single recommended course of action in the chart within 48 hours or the consult never gets signed off by the attending — which means the form more or less forces us to pretend every case has an answer. Plenty of them don't, and I want us to stop deciding that case by case.

  So: give me a decision procedure the committee can actually run — the nurses, the chaplain and the two residents on it have no philosophy training — that sorts a consult into four kinds before we write anything: conflicts of prima facie duties that weighing genuinely settles; cases that look like dilemmas but are really ignorance or uncertainty about the facts or about what the patient wanted; cases where weighing does settle what must be done but leaves real moral residue that we ought to name and document; and cases where there is no permissible option at all, so that whatever gets done is in some sense a wrong. I want the questions in the order to ask them, what counts as a sufficient answer to each, where the procedure stops with a no, and where it hands the decision to a person because what's left is a question of values rather than facts. It should also tell us what to write when we land in each box — in particular when we should refuse to tick a single recommendation and say instead that the choice belongs to the family, or that no available option is clean.

  Then run it on three real-shaped cases. (1) Two patients, one ventilator, bad flu week; the hospital has a written allocation policy but it runs out at exactly the point where the two patients score identically. (2) A comatose man on pressors whose wife insists on full support because he'd never want to miss their daughter's wedding next month, and whose adult son says his father told him last year he'd never want to live like this — no written directive, and the two are evenly credible. (3) A ten-year-old with relapsed leukemia whose mother wants to stop chemo and whose father wants to continue; both are legal custodians, both are loving, and the oncologist says either path is medically defensible. The third is the one I expect to dislike the answer on: the residents treat it as a tragedy, and I suspect any honest procedure is going to tell us it isn't our decision at all — I want to see wether that's right or whether the procedure is deflating something it shouldn't.

  Be straight about where the procedure misfires, and about whether a tie-breaker like first-come-first-served really resolves a conflict or just relocates it. Lead with the bottom line in your first sentence — what the procedure is, in one sentence — then give the reasoning; no preamble, and don't restate the question back at me.
reasoning: |-
  Okay, the user is a philosophy professor and ethicist on a clinical ethics committee. They need a practical decision procedure that categorizes ethics consults into four types, usable by non-philosophers. The goal is to stop pretending every case has a clear answer and instead document when choices involve moral residue or no permissible options.

  First, I need to design a step-by-step flowchart. It should start with factual clarity, then move to patient preferences, conflicts of duties, and finally assess moral residue. The four categories are: resolvable duties, factual uncertainty, resolvable with residue, and no permissible options. 

  The procedure must be simple. The committee includes nurses, a chaplain, and residents without philosophy training. Each step needs clear yes/no questions. For example, step one checks if all medical facts and patient wishes are clear. If no, it's category two—uncertainty. If yes, proceed to whether duties conflict. 

  Handling ties is crucial. The user mentioned cases like the ventilator allocation where policy ties. The procedure should acknowledge that some ties are irresolvable by weighing alone and require a tie-breaker, which doesn't resolve the moral conflict but makes a practical decision. 

  For the three cases: 
  1. Ventilator allocation: Tied scores mean no clear medical preference. The policy doesn't help, so it's a conflict of duties (justice vs. beneficence). Using a tie-breaker like first-come might be necessary but leaves moral residue. Category three. 
  2. Comatose patient with conflicting family accounts: Unclear patient preferences despite credible sources. This falls under category two—factual uncertainty. The committee shouldn't decide but might suggest a surrogate decision-maker. 
  3. Divorced parents disagreeing on leukemia treatment: Medically defensible options with no clear best interest. Here, it's about unresolved conflicts between autonomy and beneficence. The procedure might push it to judicial resolution, but the user worries about deflating the tragedy. The answer is that it's not the committee's decision—category four? Wait, no permissible option? Actually, both options are permissible but conflicting. The procedure should flag that no resolution is possible without external arbitration, so category four: no permissible option without choosing a wrong. 

  Misfires: The procedure might oversimplify when values are intertwined with facts. Also, tie-breakers like first-come don't resolve moral residue; they just act. The user needs honesty here. 

  Bottom line first: A four-step flowchart sorting cases by resolvability of duties, uncertainty, residue, or no permissible options. Then, the steps, outputs for each category, and application to cases. Highlight where the procedure misfires, especially in case three where the committee might feel it's a tragedy but the procedure says it's not their call.
answer: |-
  ### Bottom Line: A four-step flowchart sorting consults by resolvability of duties, presence of factual uncertainty, moral residue, or absence of permissible options, with explicit outputs for each terminal category.

  **Decision Procedure (Run Sequentially):**

  1.  **"Are all medical facts *and* the patient's known preferences/wishes *sufficiently clear and uncontested* to determine a single medically appropriate course of action aligned with those preferences?"**
      *   **Sufficient Answer:** Medical facts objectively known (e.g., prognosis, treatment options/responses). Patient preferences documented in an advance directive, consistently reported by a sole/agreed surrogate, or clearly expressed while competent and directly applicable. *No* credible, conflicting interpretations of facts/preferences exist.
      *   **No?** → **Category 2 (Factual/Preference Uncertainty)**. Stop. *Output:* "Consult reflects uncertainty regarding medical facts or patient preferences. Recommendation: Gather further information/clarification [specify if possible, e.g., 'attempt family consensus on patient's values,' 'seek second medical opinion on prognosis'] before proceeding. No single ethical recommendation possible at this time."
      *   **Yes?** → Proceed to Step 2.

  2.  **"Does applying standard ethical principles (autonomy, beneficence, non-maleficence, justice) *clearly* point to a single obligatory course of action, with *no* significant conflicting duties?"**
      *   **Sufficient Answer:** Principles align unambiguously (e.g., respecting documented refusal of treatment; clear medical indication for life-saving treatment in the absence of refusal; unambiguous application of a fair allocation policy). *No* significant countervailing duty of comparable weight exists.
      *   **No?** → Proceed to Step 3.
      *   **Yes?** → **Category 1 (Resolved by Weighing)**. Stop. *Output:* "Ethical analysis concludes [specific action] is the obligatory course of action. Rationale: [Briefly state key principles applied, e.g., 'Respect for patient autonomy via documented directive,' 'Application of hospital justice policy X.Y.']."

  3.  **"After careful weighing of conflicting duties, is there a single course of action that *must* be pursued, even though it involves significant moral costs (e.g., profound regret, unavoidable harm, violation of a lesser duty)?"**
      *   **Sufficient Answer:** Weighing reveals one option as *imperative* (e.g., withdrawing futile treatment despite family distress; allocating a scarce resource to one patient using a justifiable tie-breaker where policy fails). The "must" stems from the *overriding* nature of one duty/principle *or* the *impermissibility* of alternatives. Significant moral burden is acknowledged.
      *   **No?** → Proceed to Step 4.
      *   **Yes?** → **Category 3 (Resolved but with Moral Residue)**. Stop. *Output:* "Ethical analysis identifies [specific action] as the necessary course, recognizing significant moral burden/residue related to [name the cost, e.g., 'the profound loss experienced by Patient B's family,' 'the violation of Mr. X's previously expressed preference for limited intervention']. Support for stakeholders experiencing this burden is essential."

  4.  **"Is *every* available course of action impermissible (violates a core duty) *or* are there *multiple* permissible options with no ethically determinable way to choose between them (a true dilemma)?"**
      *   **Sufficient Answer:** (a) All options violate a fundamental duty (rare, e.g., lying to both parties in an intractable conflict). (b) Multiple options are *permissible* (each satisfies core duties reasonably), but ethical reasoning provides *no* basis for choosing one over the other(s) (e.g., genuine tie in resource allocation after exhausting criteria; irreconcilable, good-faith surrogate conflict where both choices are within standard of care and reflect plausible interpretations of patient values).
      *   **Yes?** → **Category 4 (No Permissible Option / True Dilemma)**. Stop. *Output:* "Ethical analysis finds no single obligatory course. [Choose A or B]:
          *   A (True Dilemma): Multiple permissible options exist, but ethics cannot dictate a choice between them. The decision rightfully belongs to [specify decision-maker(s), e.g., 'the patient's legally designated surrogate,' 'the family through consensus,' 'the clinical team using a fair procedural tie-breaker'].
          *   B (All Options Impermissible): All available choices involve violating a core duty. Recommendation: Explore alternative options [suggest if possible] or acknowledge the tragic nature of the choice forced upon decision-makers."
      *   **No?** → *Rethink Steps 1-3.* (This step should rarely be answered "No" if previous steps were correctly answered "No".)

  **Key Features:**
  *   **Order:** Sequential filtering from factual clarity → resolvable principles → resolvable-with-residue → irresolvable.
  *   **Handoff to Values/Decision-Makers:** Explicit in Category 4 (True Dilemma) and implied in Category 2 if uncertainty persists. Category 3 (Residue) names the cost but affirms the action.
  *   **"Sufficient" Answers:** Based on objective clarity, consensus among committee members on the *presence/absence* of clarity or resolvability, not on philosophical depth.
  *   **Tie-Breakers:** Acknowledged in Step 3 as necessary *procedures* for action in allocation cases, but *do not* resolve the underlying moral conflict or eliminate residue (Category 3). They relocate the decision burden from "weighing" to "procedural fairness," accepting the residue of the unchosen option.

  **Where it Misfires:**
  1.  **Values Disguised as Facts:** Step 1 might misfire if disagreements about "medical appropriateness" or "applicability" of preferences are *actually* value conflicts masquerading as factual disputes (e.g., "Is this *really* futile?" often involves values). The procedure risks mis-categorizing these as Category 2 (Uncertainty) when they might be Category 3 or 4.
  2.  **The Weight of Residue:** Distinguishing Category 3 (Resolved w/ Residue) from Category 4 (True Dilemma) hinges on whether one option *must* be done. This can be highly subjective. A committee might see a ventilator tie as Category 3 ("*Must* allocate using a tie-breaker"), while others see it as Category 4 ("No *ethical* way to choose, only procedural").
  3.  **Category 4 Nuance:** Labelling a case as Category 4 (True Dilemma) doesn't mean *no* action is taken; it means ethics cannot *prescribe* which permissible action to take. The procedure specifies who *does* decide. Calling *all* options "impermissible" (4B) is rarer and more severe.

  ---

  **Running the Cases:**

  1.  **Two Patients, One Ventilator (Tied Score):**
      *   Step 1: **Yes.** Facts (tied score, policy exhausted) and relevant preferences (presumed desire for life-saving treatment) are clear.
      *   Step 2: **No.** Duties of justice (fair allocation) and beneficence (save life) conflict directly due to the tie. No single clear obligation emerges *from weighing the principles alone*.
      *   Step 3: **Yes.** *Must* allocate the ventilator to *someone* using a fair, transparent tie-breaker (e.g., first-come). Not allocating guarantees two deaths. The moral residue (death of the unchosen patient) is profound and unavoidable.
      *   **Category 3 (Resolved but with Moral Residue).** *Output:* "Ethical analysis identifies allocating the ventilator using [specified tie-breaker, e.g., time of admission] as the necessary course, recognizing significant moral burden/residue related to the unavoidable death of the unchosen patient. Support for the family of the unchosen patient and the clinical team is essential. The allocation policy should be reviewed to address tie scenarios."
      *   **Tie-Breaker Note:** The tie-breaker (e.g., first-come) *relocates* the conflict. It doesn't resolve the ethical anguish of choosing A over B when both are equally deserving; it just provides a procedurally fair *way* to choose, accepting the residue (Category 3).

  2.  **Comatose Patient, Conflicting Family Testimony:**
      *   Step 1: **No.** The patient's preferences ("never want to live like this" vs. "never want to miss wedding") are directly contested by two equally credible surrogates. Medical facts might be clear (prognosis on pressors), but the *key preference* is fundamentally uncertain.
      *   **Category 2 (Factual/Preference Uncertainty).** *Output:* "Consult reflects significant uncertainty regarding the patient's preferences for life-sustaining treatment in this specific scenario. Recommendation: Facilitate a mediated family meeting to seek consensus on the patient's core values and goals. If consensus remains elusive, the legal surrogate designation should be clarified. No single ethical recommendation on continuing or withdrawing pressors is possible at this time due to unresolved preference uncertainty."

  3.  **10-Year-Old, Divorced Parents Disagree on Chemo:**
      *   Step 1: **Yes.** Medical facts are clear (relapsed leukemia, both paths medically defensible per oncologist). Patient preferences are unknown/inapplicable (10-year-old, no clear directive). Parental authority is the relevant framework.
      *   Step 2: **No.** Duties conflict: Respect parental autonomy (both have legal custody, both loving) and Beneficence/Non-maleficence (both paths have potential benefits/harms; neither is clearly superior *or* negligent per medical judgment). Neither principle clearly overrides to dictate one choice.
      *   Step 3: **No.** There is no *single* course that *must* be pursued. Continuing chemo *or* stopping are both *permissible* (medically defensible, either could align with beneficence depending on outcomes/values, neither inherently violates non-maleficence grossly). Neither parent's choice is clearly unreasonable or abusive.
      *   Step 4: **Yes.** Multiple permissible options exist (continue chemo, stop chemo/palliative care), but ethical reasoning provides *no* basis for choosing between them. The conflict is between two legitimate expressions of parental love and judgment, neither overridable by ethics alone.
      *   **Category 4A (True Dilemma - Multiple Permissible Options).** *Output:* "Ethical analysis finds no single obligatory course. Both continuing chemotherapy and transitioning to palliative care are medically permissible and reflect loving parental judgment. Ethics cannot dictate a choice between these valid options. The decision rightfully belongs to the parents. The committee strongly recommends intensive mediation support to help the parents reach a shared decision in their child's best interest. If consensus remains impossible, judicial review may be necessary to appoint a final decision-maker."
      *   **Deflating Tragedy?** The procedure correctly identifies this as a Category 4 dilemma *for the ethics committee*. It's a profound human tragedy for the family, but the committee's role isn't to *resolve* the parental conflict when both choices are ethically permissible. The tragedy stems from the irreconcilable parental disagreement, not from a failure of ethical analysis to find "the answer." The procedure avoids the pretense that ethics can dissolve this conflict. It clarifies the committee's limited role (cannot choose) and points to the necessary resolution path (parental agreement or legal determination).
