prompt: |-
  Hey — I need something I can actually put on the wall and use, not an essay about it.

  Im deputy director of comms at a regional public health agency. About 2 million people, four of us on the team, we push out two or three guidance lines or press lines a week, the chief medical officer signs off on anything with a number in it, and we usually have a few hours rather than a few weeks. Our recurring problem: the version of a claim that works is the confident one, and the version we can defend in front of a journalist is the careful one, and those arent the same sentence.

  Two features of our situation that I think matter. First, a lot of our claims are what I'll call uptake-linked: their truth depends on people believing them, because the believing is what produces the behaviour that makes them come true. ('If everyone cuts their contacts by about a third for two weeks, the hospitals will hold.') Others are nothing like that — the water is contaminated or it isnt, and no amount of confidence from us touches it. Second, we have what our team calls the archivist: a permanent local opposition group that screenshots every line we soften or overstate and recycles it for years. So an overclaim has a long tail, not just a news cycle.

  What I want is a decision procedure built out of the ethics-of-belief stuff I half remember from university — Clifford's flat rule about believing on insufficient evidence and his shipowner case, James's reply that when an option is genuine and the evidence genuinely cant settle it you're allowed to let your passional nature decide, and above all his thought that some facts only arrive at all if you've already banked on them. I dont want a summary of the debate and I dont want reading recommendations. I want: the questions in order, what counts as a sufficient answer to each, where the procedure stops and says no, and where it hands the decision back to a person because its a values question rather than a factual one.

  Three things it has to get right:

  1. Dont collapse "should I believe this" into "should I say it." For us those come apart constantly — sometimes the right move is to say the confident thing while believing the cautious one, sometimes I think the reverse, sometimes neither. Show me exactly where the gap is and what the procedure does when the two answers disagree.

  2. Give me an actual test for whether a belief is the kind that helps create its own object. Not "its motivating" — the shipowner's belief motivated him perfectly well and that was the whole problem. The test has to be about whether the believing is causally upstream of the fact believed. And most of our real claims are half-and-half: the hospitals hold if uptake is high AND staffing survives AND the variant isnt nastier than the modelling assumes. Tell me how to score a claim that's partly uptake-linked and partly not.

  3. Put the archivist in the procedure. How much weight does long-run damage to our credibility get, and at which step — is it a tiebreaker, a veto, or just one input among many?

  Then run it on three cases:

  (a) Next week we want to publish "If everyone cuts their contacts by about a third for the next two weeks, the hospitals will hold." Our modelling puts that somewhere near 60/40 and the modellers wont go on the record with the number.

  (b) A lab result on a municipal water supply is 36 hours late. We're maybe 80% sure the water is fine. Do we tell people its safe, or tell them to boil it.

  (c) The one I already know I wont like. Our staff are wrecked after two years of back-to-back surges, and the CMO wants to stand up at the all-staff meeting and say "the worst is behind us." Nobody knows that. But the team's view is that if she doesnt say it, a chunk of people quit. Tell me what the procedure actually says, not what would be kind.

  And last: where does it break. Which of these steps are judgement calls dressed up as procedure, whats the failure mode if we run it hard for six months, and what kinds of decisions should we keep out of it entirely.
reasoning: |-
  Okay, the user is the deputy director of communications at a regional public health agency. They need a practical decision tool for crafting messages that balance confidence and defensibility. The key issues are the tension between effective messaging and factual accuracy, especially with claims that depend on public uptake. They also have an "archivist" group that documents any inconsistencies, so credibility is crucial.

  First, I need to address the three main requirements. The tool must separate belief from communication, assess whether a belief is self-fulfilling, and incorporate the archivist's impact. The three cases provided will test the procedure's applicability. 

  Starting with the framework, the user mentioned Clifford and James. Clifford emphasizes evidence-based belief, while James allows passion in genuine options. The procedure needs steps that evaluate evidence first, then consider if the claim is self-fulfilling. If evidence is insufficient, James' passional nature comes in. But for public health, the ethical implications are high, so the bar for using passion should be high.

  For requirement 1, separating "should I believe" from "should I say." The procedure must have distinct checks. Belief relies on evidence, while communication factors in consequences, audience, and credibility. If they conflict, the tool should highlight the gap and guide the decision based on harm assessment.

  For requirement 2, testing if a belief creates its own truth. The key is whether public belief causes the outcome. The example given is a claim with multiple factors: uptake, staffing, variants. Each factor needs scoring (0-1) on how much it depends on public belief. Averaging these gives a score. Above a threshold (say, 0.6) means the claim is sufficiently uptake-linked to consider James' approach.

  For requirement 3, the archivist's effect. Long-term credibility damage acts as a veto if the overclaim risk is high. Otherwise, it's a tiebreaker. This prevents reckless statements but allows necessary risks when outcomes justify it.

  Now, applying to the cases:
  - Case A: The hospitals claim has mixed factors. Uptake is highly dependent (0.9), staffing and variants less so (0.2, 0.3). Average 0.47—below threshold. Evidence is insufficient (60/40), so belief isn't justified per Clifford. But communicating it? The potential harm of hospitals overflowing vs. credibility hit. The archivist risk is high, but the outcome's importance might justify the message with caveats.
  - Case B: Water safety. Not uptake-linked. Evidence is 80%—sufficient for belief. But communicating "safe" risks harm if wrong. Boiling water is low-cost, so caution is better despite public alarm. Archivist less relevant here.
  - Case C: Staff morale claim. Not evidence-based, but possibly self-fulfilling. Preventing resignations is highly belief-dependent (0.8). But the claim's falsifiability and archivist risk are high. The procedure rejects it due to insufficient evidence and high credibility risk. Alternatives like hopeful messaging without guarantees are better.

  The procedure might break when scoring uptake linkage—subjective judgments could bias results. Also, quantifying evidence sufficiency is tricky. Over six months, team exhaustion might lead to skipping steps. Decisions involving equity or political implications should stay out of this tool. Training and regular reviews would mitigate some issues, but the procedure isn't foolproof. The key is ensuring it's a guide, not a replacement for human judgment.
answer: |-
  Here's a wall-ready decision tool, designed for speed under pressure. Print it, laminate it, and use it when drafting lines. It's built on Clifford/James ethics, tailored to public health comms, with your archivist and uptake-linked claims hardwired in.

  ---

  **PUBLIC HEALTH MESSAGE DECISION PROCEDURE**  
  *(For Claims Requiring Confidence vs. Defensibility Balance)*

  **1. IS THE CLAIM PRIMARILY UPTAKE-LINKED?**  
  *(Does public belief CAUSALLY contribute to making it true?)*  
  - **Test:** *"If we say this AND the public fully believes/acts on it, does that DIRECTLY increase the likelihood of the outcome, INDEPENDENT of other factors?"*  
  - **Scoring (for mixed claims):**  
    - Break claim into core components (e.g., "Hospitals will hold" = Uptake + Staffing + Variant Severity).  
    - Score each 0-1.0 on "Dependence on Public Belief/Action" (0 = no dependence, 1.0 = entirely dependent).  
    - **Threshold:** Average score ≥ 0.6 = "Primarily Uptake-Linked."  
  - **OUTPUT:**  
    - **YES (≥0.6):** Proceed to Step 3.  
    - **NO (<0.6):** Proceed to Step 2.  

  **2. NON-UPTAKE-LINKED CLAIM: BELIEF CHECK (Clifford Standard)**  
  *(Is there sufficient evidence to justify belief?)*  
  - **Test:** *"Would we stake a high-consequence personal decision (e.g., family's health) SOLELY on this evidence?"*  
  - **Threshold:** ≥90% confidence OR overwhelming consensus evidence.  
  - **OUTPUT:**  
    - **YES (Belief Justified):** Proceed to Step 4.  
    - **NO (Belief Unjustified):** **STOP. DO NOT STATE AS FACT.** Use alternatives: "We are investigating," "Preliminary data suggest," or silence.  

  **3. UPTAKE-LINKED CLAIM: JAMES EXCEPTION CHECK**  
  *(Is this a "genuine option" where evidence is truly insufficient AND inaction has high costs?)*  
  - **Tests:**  
    - A. *"Is the evidence genuinely inconclusive (40-60% confidence) despite best efforts?"*  
    - B. *"Is the cost of NOT expressing confident belief (e.g., low uptake → collapse) severely worse than being wrong?"*  
  - **Threshold:** BOTH A and B must be YES.  
  - **OUTPUT:**  
    - **YES (Genuine Option):** Belief CAN be adopted pragmatically. Proceed to Step 4.  
    - **NO:** Revert to Step 2 (Apply Clifford Standard).  

  **4. COMMUNICATION CHECK: CONSEQUENCES & ARCHIVIST**  
  *(Should we SAY it, even if belief is justified/pragmatic?)*  
  - **Assess:**  
    - **Harm if Wrong:** Severity of damage if claim is false (health, trust, resources).  
    - **Harm if Silent:** Cost of not speaking (inaction, panic, missed opportunity).  
    - **Archivist Impact:** *"Could this be weaponized for >2 years if overstated/under-delivered?"* Score 1-5 (5 = high damage).  
  - **Thresholds:**  
    - **SAY IT (Confidently):** IF (Harm if Silent > Harm if Wrong) AND Archivist Impact ≤ 3.  
    - **SAY IT (Cautiously):** IF (Harm if Silent > Harm if Wrong) BUT Archivist Impact ≥ 4 → Add caveats ("likely," "if conditions hold").  
    - **DON'T SAY IT / REFRAME:** IF (Harm if Wrong ≥ Harm if Silent) OR Archivist Impact = 5 AND Harm if Wrong > Low.  
  - **OUTPUT:** Final Message Decision.

  ---

  **APPLIED TO YOUR CASES:**  
  *(Using the Procedure Above)*  

  **(a) "Cut contacts by 1/3 for 2 weeks → hospitals hold."**  
  - **Step 1:** Uptake-Linked? Component Scores: Uptake (0.9), Staffing (0.2), Variant (0.3) → Avg. 0.47 → **NO** (<0.6).  
  - **Step 2 (Clifford):** 60/40 confidence → **NO** (Belief Unjustified).  
  - **STOP.** **Command:** Do NOT state as fact.  
    - *Output:* "Modelling suggests cutting contacts *could* prevent hospital overload. We urge the public to reduce contacts now."  

  **(b) Water Safety: 80% sure it's fine. Say "safe" or "boil"?**  
  - **Step 1:** Uptake-Linked? **NO** (Belief doesn’t affect water quality).  
  - **Step 2 (Clifford):** 80% confidence → **NO** (Insufficient for high-stakes belief).  
  - **STOP.** **Command:** Default to harm minimization.  
    - *Output:* "Issue boil-water advisory pending final results. Safety is our priority."  

  **(c) CMO: "The worst is behind us" (to prevent staff quitting).**  
  - **Step 1:** Uptake-Linked? Staff retention IS belief-dependent (Score 0.8) → **YES**.  
  - **Step 3 (James):**  
    - A. Evidence inconclusive? **YES** (Nobody knows).  
    - B. Cost of silence severe? **YES** (Staff collapse).  
    - → **Genuine Option**. Pragmatic belief allowed.  
  - **Step 4 (Consequences & Archivist):**  
    - Harm if Wrong: High (Credibility hit if surge recurs).  
    - Harm if Silent: High (Staff quit).  
    - Archivist Impact: **5** (Definitive claim screenshot forever).  
    - **Threshold:** Archivist=5 + Harm if Wrong=High → **DON'T SAY IT / REFRAME**.  
  - **Command:** Reject the exact phrase.  
    - *Output:* "We have the tools and resilience to face what comes. Your efforts have turned the tide; we see a path forward."  

  ---

  **WHERE IT BREAKS:**  
  1. **Judgment Dressed as Procedure:**  
     - Uptake-Linked scoring (Step 1) and Archivist Impact (Step 4) rely on subjective estimates.  
     - Mitigation: Have 2 team members score independently; discuss discrepancies >0.3.  
  2. **Failure Mode (6 Months In):**  
     - Exhausted teams may overuse "James Exceptions" (Step 3) to justify desired but shaky claims.  
     - Archivist fatigue → downweighting long-term credibility risks.  
  3. **Keep These Decisions Out:**  
     - **Equity-driven messaging** (e.g., prioritizing vulnerable groups). This is values-based, not truth-based.  
     - **Political/legal directives** that override evidentiary thresholds.  
     - **Crisis triage** (e.g., immediate evacuation orders) — use pre-established protocols instead.  

  **LAMINATE VERSION TIP:** Add a "RAPID REFERENCE" sidebar:  
  > - **Uptake-Linked?** → Split claim. Avg. ≥0.6?  
  > - **Evidence ≥90%? (Non-Uptake)** → No? STOP.  
  > - **Genuine Option? (Uptake)** → Only if 40-60% AND silence = disaster.  
  > - **Archivist Score ≥4?** → Add caveats or reframe.  
  > - **Archivist =5 + Harm if Wrong = High?** → DON'T SAY IT.  

  This forces explicit tradeoffs, separates belief/speech, quantifies uptake-dependence, and bakes the archivist into the consequence matrix. Use it in drafting huddles.
