  User's hidden needs: They're likely annoyed by philosophers ignoring experimental rigor (variance decomposition, operational definitions). The document must force philosophical clarity through empirical gates. Also, their insistence on "American English" suggests disdain for jargon-heavy philosophy speak. I'll keep prose lean and precise.

