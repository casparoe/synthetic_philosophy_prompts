answer: |-
  ## Adversarial Collaboration Framework: Libet Paradigm & Causal Agency  
  *(Joint Statement for Antecedent-Initiation and Conscious-Control Camps)*  

  ### Part 1: Agreed Claims  
  1. **Operational Definitions**: The premovement negativity (Bereitschaftspotential, BP/RP) is measured as a slow cortical negativity at central electrodes, time-locked to movement onset and contrasted against a pre-trial baseline or no-movement control. Its amplitude and slope reflect aggregated neural activity preceding voluntary movement.  
     *Why included*: Both camps accept RP as an empirical anchor; its measurement constraints are foundational.  

  2. **Veto Capacity**: Subjects can consciously abort prepared movements after reporting intention, even late in the premotor interval (~200ms pre-movement).  
     *Why included*: Demonstrates that neural preparation is not determinative.  

  3. **Task Constraints**: Libet-style tasks involve arbitrary, self-paced movements with minimal consequences, no deliberation, and no competing reasons. This design may not engage deliberative or evaluative mechanisms.  
     *Why included*: Limits generalization claims; both agree mechanisms may differ in high-stakes decisions.  

  4. **Decision Onset Inference**: No direct neural "decision timestamp" exists. Claims about decision timing rely on operational proxies (e.g., RP onset, reported intention).  
     *Why included*: Forces clarity on what "decision" means empirically.  

  5. **Intention Report Limitations**: Reported intention time (W) is a metacognitive judgment subject to:  
     - Reconstruction error (post-hoc narrative bias)  
     - Attentional capture (e.g., distraction shifts W)  
     - Synchronization error (mapping intention to clock)  
     *Why included*: Quantifying these errors is essential for interpreting W-RP latencies.  

  6. **Causal Pluralism**: Philosophical conclusions (e.g., "free will is illusory") depend on the definition of "free will" (e.g., libertarian, compatibilist). No experiment adjudicates all definitions.  
     *Why included*: Prevents conflation of empirical and metaphysical claims.  

  ---

  ### Part 2: Residual Disagreements  
  | Disputed Proposition | Antecedent-Initiation Camp | Conscious-Control Camp | Dispute Type |  
  |----------------------|----------------------------|------------------------|-------------|  
  | **RP's functional role** | "RP onset reflects the *settling* of a specific motor decision, where stochastic accumulation crosses a threshold." | "RP indexes *non-specific preparation* (e.g., attentional arousal or motor bias), not decision settlement." | Mechanism |  
  | **Conscious intention's causal status** | "The experience of intention is an *epiphenomenal readout* of prior neural events, not an independent cause." | "Conscious intention *modifies ongoing processes* (e.g., via veto or amplitude modulation), granting it downward causation." | Explanation |  
  | **The 'veto' mechanism** | "Aborting is the *absence* of threshold crossing; no unique 'veto signal' exists." | "Aborting requires an *active inhibitory signal* distinct from go-processes." | Mechanism/Terminology |  
  | **Scope of 'decision'** | "A 'decision' occurs when motor parameters are irreversibly specified (e.g., ~500ms pre-movement)." | "A 'decision' only occurs when consciously endorsed (e.g., post-W). Prior activity is pre-decisional." | Terminology |  

  ---

  ### Part 3: Cruxes & Testable Predictions  
  **Crux 1: RP as Decision vs. Preparation**  
  *Test*: Vary costs of early/late actions (e.g., reward penalty for mistimed movements) and include forced-decision blocks (external cue demands immediate go/no-go).  
  - **Antecedent-Initiation**: Predicts RP onset tracks movement deadlines, not W. *Embarrassment*: RP onset correlates with W, not deadlines.  
  - **Conscious-Control**: Predicts RP amplitude/onset shifts with W reports under deadline pressure. *Embarrassment*: RP unchanged; only W varies.  

  **Crux 2: Intention Report Error**  
  *Test*: Catch trials (movement blocked) + attentional probes during W report.  
  - **Antecedent-Initiation**: Needs reconstruction error >100ms to preserve causal primacy of RP. Predicts W drifts toward movement time when blocked.  
  - **Conscious-Control**: Needs synchronization error dominant (<50ms). Predicts W stable under distraction; blocked trials show no W drift.  

  **Crux 3: Veto Mechanism**  
  *Test*: Compare EEG/MRI for successful aborts vs. go trials in last 300ms.  
  - **Antecedent-Initiation**: Predicts no unique abort signature; activity mirrors go trials until cessation. *Concedes if*: Decodable abort signal >150ms pre-cancellation.  
  - **Conscious-Control**: Predicts distinct prefrontal inhibitory signature >200ms pre-abort. *Concedes if*: No difference from random noise.  
  *Note*: Underpowered if n<50 trials/condition; null result uninformative.  

  **Crux 4: Generalizability**  
  *Test*: Reason-based task (e.g., choose left/right based on subjective preference with stakes).  
  - **Antecedent-Initiation**: Predicts RP-like signal precedes conscious choice. *Retracts* if RP absent or post-W.  
  - **Conscious-Control**: Predicts no early RP; intention W aligns with choice commitment. *Retracts* if RP identical to arbitrary task.  

  ---

  ### Part 4: Closing: Disentangling Disputes  
  **Verbal Components**:  
  - "Decision" ambiguity: Resolved by distinguishing *motor specification* (criterion: muscle activation pattern fixed) vs. *endorsement* (criterion: conscious commitment).  
  - "Brain decided before agent": Misleading phrasing. Replace with: "Neural specification precedes reportable endorsement."  

  **Substantive Components**:  
  - Whether conscious endorsement/veto has *emergent causal power* uncontained by pre-report neural activity.  
  - Whether RP's predictive validity holds for deliberate decisions.  

  **Mind-Changing Results**:  
  - **Antecedent-Initiation**: Would retract if reason-based tasks show RP onset *after* W or veto signals are neurally distinct.  
  - **Conscious-Control**: Would retract if RP in reason-based tasks predicts choices 500ms+ pre-W *and* abort signature is absent.  

  **Final Note**: Philosophical commitments (e.g., "causal authority requires non-physical causation") remain untouched by data. Empirical cruxes address *which neural events* align with operationalized agency concepts.  

  ---  
  *This document isolates testable mechanisms from metaphysical baggage. Signatories agree that resolving the above cruxes empirically will constrain—but not eliminate—philosophical interpretations.*
