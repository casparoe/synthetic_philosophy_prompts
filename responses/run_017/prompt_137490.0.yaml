prompt: |-
  I sit on the allocation committee of a small pooled giving fund, and for the past two years we have scored candidate causes on the three-factor framework that circulates in effective altruism: importance (how much value there would be if the problem were solved), tractability (how much progress a marginal dollar buys), and neglectedness (roughly, how little resource the rest of the world is directing at the problem relative to its scale). We multiply the three. A quant who joined our committee this year has written up an argument that the framework, taken literally, is incoherent, and I cannot find the seam. I reproduce it as he gave it.

  (1) The three factors are meant to be independent axes, a cause's priority is their product, and you should give where the product is largest.
  (2) Neglectedness is a function of how much resource is already going to a cause. The more that is already going in, the less neglected it is, and full crowding means zero neglectedness.
  (3) Since the product contains neglectedness as a factor, a cause that ceases to be neglected has priority zero — however enormous the good still available in it, and however cheaply a dollar still buys that good.
  (4) But our own giving changes how much resource is going in. So the framework has this dynamic consequence: back a cause, watch its neglectedness fall, watch its score fall below some other cause's, and move. Repeat. The framework therefore never licenses sustained investment in anything; its output is permanent hopping between causes. And if our fund is large relative to a field, we can exhaust a cause's neglectedness in a single cycle and be told to walk away from work we have just begun.
  (5) It also has a static consequence that is arguably worse. Take two causes identical in importance and identical in what a marginal dollar does in them, but suppose one already has billions flowing to it and the other has nothing. The framework ranks the billion-dollar cause at zero and sends you to the empty one. That cannot be right: if the marginal dollar does the same thing in both places, the history of who funded what before you arrived is irrelevant to where your dollar should go.
  (6) Everyone on the committee behaves as if (4) is a caricature and (5) is straightforwardly false. Importance and tractability are plainly doing real work in our deliberations, and I want to keep them. So the culprit must be neglectedness: it is not a third independent factor at all. Its only real content is that crowded fields have had their cheapest opportunities picked off, which is just tractability at the margin under another name. Multiplying it in double-counts, and the honest framework is importance times tractability — plain cost-effectiveness, with neglectedness demoted to a search heuristic.

  I half want to accept (6), because I have never been able to say what neglectedness contributes beyond crowding. But (6) also says that everyone who has used a three-factor scorecard for years has been double-counting, which is a lot to swallow; and the quant's step from (1) and (2) to (4) has the smell of a scope error that I cannot locate.

  So: which step do you reject, and why did it look sound? If the flaw is in (2), tell me what neglectedness is actually a function of, and why the reading that generates (4) and (5) was the natural one to reach for. If the flaw is in the move from (1) and (2) to (4), say what allocation problem the framework is really solving — I suspect something about all-or-nothing versus marginal allocation is doing hidden work, and I want it made explicit. Then price the alternatives: what does it cost to keep neglectedness as a genuine third factor, what does it cost to demote it to a heuristic, and is there any reading on which both my committee's actual practice and the quant's (5) come out right?
reasoning: |-
  Okay, let me start by unpacking the user's problem. They're part of an allocation committee for a pooled giving fund that uses the ITN framework (Importance, Tractability, Neglectedness) to evaluate causes. A new quant member has pointed out flaws in the framework, specifically that multiplying neglectedness leads to incoherence. The user is trying to figure out where the argument goes wrong and how to adjust their approach.

  First, I need to understand the quant's points step by step. The core issue seems to be how neglectedness is defined and multiplied. The quant argues that since neglectedness depends on current funding, adding more funding reduces neglectedness to zero, making the priority zero even if the cause still has high importance and tractability. This leads to dynamic hopping between causes (point 4) and the static problem where a well-funded cause is ranked zero despite marginal dollars being effective (point 5).

  The user is stuck because they see the logic but also feel that neglectedness must have some value. They mention that their committee uses neglectedness heuristically but can't articulate its exact contribution beyond avoiding crowded fields. The challenge is reconciling the theoretical flaw with practical use.

  I recall that in economics, the ITN framework is similar to marginal cost-effectiveness analysis. Neglectedness is meant to capture diminishing returns. When a field gets crowded, the easy wins are taken, and additional dollars achieve less. So neglectedness isn't independent; it's a proxy for the current level of tractability. Multiplying it directly would double-count if neglectedness is defined as a function of resources, which affects tractability.

  The quant's step (5) highlights a static example: two causes with identical importance and marginal tractability but different funding levels. ITN ranks the funded one as zero, but intuitively, if a dollar does the same good in both, funding history shouldn't matter. This suggests that neglectedness as a multiplier is problematic. Instead, it should be integrated into how tractability is measured—current marginal impact rather than average.

  For the dynamic issue (point 4), the problem arises because ITN treats neglectedness as an independent input. But in reality, funding decisions are iterative. Each dollar affects the landscape. The framework doesn't account for this; it's a static snapshot. So using it dynamically causes hopping because the model doesn't include how current funding changes future tractability.

  The user's committee likely uses neglectedness as a heuristic to avoid low-hanging fruit already picked, which is practical but not mathematically sound in multiplication. Demoting neglectedness to a heuristic avoids double-counting but loses the explicit emphasis on funding gaps. Alternatively, redefining neglectedness as a discount rate on tractability could work, but it's complex and requires data.

  The solution might be to reframe the framework as importance times marginal tractability, where tractability incorporates current funding levels. This merges neglectedness into tractability, avoiding multiplication. The committee's practice aligns because they intuitively adjust tractability based on crowdedness. The quant's point (5) is resolved because funding history affects tractability only if it impacts marginal returns.

  The user's deeper need is to maintain a structured yet coherent framework without dismissing years of practice. They need validation that their heuristic approach isn't wrong but requires conceptual refinement. Providing a clear model that integrates neglectedness into marginal cost-effectiveness addresses both the quant's critique and practical use.
answer: |-
  Your quant has identified a legitimate flaw in the literal multiplicative ITN framework. The flaw originates in **step (2) and its interaction with step (1)**, specifically how "neglectedness" is defined and multiplied. Here's the breakdown:

  **The Flaw: Step (2) Mis-specifies Neglectedness**
  *   Defining neglectedness *solely* as a decreasing function of total resources invested (e.g., `N = 1 - (CurrentFunding / FullFundingThreshold)`) and then **multiplying it directly** with Importance (I) and Tractability (T) creates incoherence.
  *   **Why the natural reading leads to (4) & (5):** This definition makes neglectedness (`N`) an *input* to the priority score. However, `N` itself is *dynamically determined* by the *output* (funding decisions). This creates a feedback loop the static multiplicative model can't handle. It treats `N` as fixed when calculating where to give, but giving changes `N`. Multiplying by `N` directly *penalizes* the cause *for receiving funding* in a way that doesn't reflect reality, leading directly to the absurd outcomes in (4) and (5). The intuition that "funded causes are less neglected" is sound, but translating that intuition into a multiplicative factor in a static score is the mistake.

  **What Neglectedness Actually Represents (The Corrected View):**
  Neglectedness isn't a fundamental third factor independent of tractability. **It's a proxy for the *current state of marginal tractability*.** Its real function is to signal:

  1.  **Diminishing Returns:** In many cause areas, the easiest, cheapest opportunities (the "low-hanging fruit") are addressed first. As funding increases, the cost to achieve an *additional* unit of good often increases. A neglected field is one where these cheap opportunities likely still exist.
  2.  **Crowding Out/Coordination Failures:** In some cases, excessive funding can lead to inefficiencies (e.g., NGOs competing for staff, duplication of effort, funding flowing to less effective actors), reducing the marginal impact of an additional dollar below what it was when the field was neglected.

  **Therefore, neglectedness isn't an independent axis; it's a *determinant of current marginal cost-effectiveness (tractability at the margin)***. The quant's point (6) is essentially correct.

  **Why the Move from (1) & (2) to (4) Looks Sound (But Depends on the Flawed Premise):**
  The logic *is* sound *if* you accept the flawed definition in (2) and the multiplicative framework in (1). If `N` truly is an independent input factor defined solely by current funding, and priority is `I * T * N`, then backing a cause *does* reduce `N`, reducing its priority score below others, forcing a move. The quant correctly follows the flawed premises to their logical, absurd conclusion. The "scope error" you smell is the framework's inability to handle the dynamic feedback between funding decisions and the `N` factor it relies on.

  **What Allocation Problem the Framework *Should* Be Solving (The Corrected Framework):**
  The goal is **maximizing marginal impact per dollar**. The correct framework is:

  *   **Priority = Importance (I) * Marginal Tractability (T_m)**
      *   **Importance (I):** The total scale of the problem (lives affected, welfare gain potential if solved). This remains an independent factor.
      *   **Marginal Tractability (T_m):** The *additional* good achieved *per additional marginal dollar* **given the current level of funding and activity in the cause area.** This is what "tractability" *should* represent. **Neglectedness (`N`) is not multiplied; it is *embedded within* the calculation of `T_m`.**

  **How This Fixes the Quant's Problems:**
  *   **Fixes (5) - The Static Problem:** Suppose two causes have identical `I` and identical `T_m` (the good done by the *next* dollar is the same in both). The corrected framework (`I * T_m`) ranks them equally. The history of funding (the billions vs. nothing) is irrelevant *because `T_m` already captures the current state*. If the marginal dollar truly does the same good in both places now, they *should* be ranked equally. The multiplicative ITN framework artificially penalized the funded cause by multiplying by `N`.
  *   **Fixes (4) - The Dynamic Problem:** You fund a cause because its `I * T_m` is high. Funding it *may* cause its `T_m` to decrease over time (due to diminishing returns or crowding) as it becomes less neglected. You keep funding it **until its `T_m` falls below the `T_m` of another cause with sufficient `I`.** This leads to *sustained* investment where the marginal dollar remains highly effective, not hopping. You only "hop" when the *marginal* impact elsewhere genuinely becomes higher. You don't hop *because* you funded it; you hop only if funding it *reduced its marginal impact below alternatives*. If your fund is large, you model how your investment changes `T_m` over the funding round.

  **Pricing the Alternatives:**

  1.  **Keep Neglectedness as a Genuine Third Factor (Multiplicative):**
      *   **Cost:** High. Leads to the incoherent dynamics (4) and statics (5) the quant identified. Requires arbitrary and potentially misleading quantification of `N`. Perpetuates conceptual confusion and double-counting (since `N` affects `T_m`). Requires complex adjustments to avoid absurd outcomes, undermining its simplicity.
      *   **Benefit:** Maintains the intuitive appeal of explicitly highlighting "neglectedness" as a distinct concern. Matches the historical formula many are familiar with (though familiarity ≠ correctness).

  2.  **Demote Neglectedness to a Heuristic / Integrate it into Marginal Tractability:**
      *   **Cost:** Moderate. Requires a conceptual shift – letting go of `N` as an independent multiplier. Requires more careful estimation of *marginal* tractability (`T_m`), which incorporates the insights neglectedness provides (current funding levels, stage of development, potential for diminishing returns). This estimation can be challenging but is fundamentally necessary anyway.
      *   **Benefit:** High. Resolves the quant's critiques logically. Aligns the framework with the core goal of maximizing marginal impact per dollar (`I * T_m`). Provides a coherent basis for sustained investment. Matches your committee's actual practice (where `I` and `T` are doing the work, and `N` is informing `T`). Makes the framework dynamically consistent. Avoids double-counting.

  3.  **A Compromise (Conceptually Sound, Practically Tricky):** Define `T_m` explicitly as a *function* of current funding: `T_m = f(CurrentFunding)`. You could *call* `1 - (CurrentFunding / SaturationPoint)` "Neglectedness" and use it *within* the function to *modify* a baseline tractability estimate, but **do not multiply it directly by `I` and baseline `T`.** (e.g., `T_m = T_baseline * g(N)`, where `g(N)` is a function capturing how marginal returns diminish with funding). This explicitly embeds `N` within `T_m`.
      *   **Cost:** Moderate/High. More complex modeling required. Still requires defining "saturation points" and diminishing return functions.
      *   **Benefit:** Retains the "neglectedness" terminology explicitly within the model while avoiding direct multiplication and its pitfalls. Makes the dependence of marginal impact on funding levels explicit.

  **Resolution: How Your Committee's Practice and Quant's (5) Can Both Be Right**

  *   **Your Committee:** You intuitively understand that "tractability" in your deliberations isn't a fixed, inherent property of the cause area. When you consider a cause that's crowded (`N` low), you mentally downgrade your *estimate* of what an *additional* dollar can achieve there (`T_m`). You are effectively estimating `I * T_m`, using neglectedness (`N`) as a crucial input *to estimate* `T_m`. You are *not* literally multiplying by a separate `N` factor independent of its effect on marginal impact. Your practice is sound; the *labeling* of the framework is slightly misleading.
  *   **Quant's Point (5):** Is correct *if* "tractability" (`T`) is misinterpreted as a fixed property unrelated to current funding. However, if "tractability" is correctly understood as *marginal* tractability (`T_m`), which already reflects current funding levels (i.e., incorporates neglectedness), then his static example works perfectly: If `I` and `T_m` are identical *now*, the causes are equally valuable *now*, regardless of past funding. The framework (`I * T_m`) ranks them equally. Neglectedness informed the *assessment* that the funded cause still has high `T_m` (maybe its baseline `T` was very high, or diminishing returns are mild), but it doesn't get multiplied in separately.

  **Conclusion and Recommendation:**

  Reject **Step (2)** as the primary flaw. Neglectedness (`N`) is not an independent factor to be multiplied; it is information used to estimate the *current marginal tractability* (`T_m`). The honest framework is **Importance times Marginal Tractability (`I * T_m`)**, where `T_m` is the expected additional good per additional dollar *given the current state of funding and activity in the cause area*.

  *   **Demote neglectedness to a search heuristic / key input for estimating T_m.** This resolves the quant's critiques, aligns with sound economic principles of marginal analysis, avoids double-counting and dynamic absurdities, and validates your committee's practical intuition that importance and tractability (properly understood as marginal) are the core drivers. The cost is a manageable shift in terminology and a continued focus on the challenging but essential task of estimating marginal impact, using neglectedness as a vital clue. The cost of keeping the multiplicative framework is higher: persistent logical incoherence.
  *   **Communicate the shift:** Explain to the committee that you're refining the framework for greater coherence. Emphasize that "tractability" now explicitly means *marginal* tractability, which inherently captures whether the easy wins are gone (the core insight of neglectedness). You're not abandoning neglectedness; you're correctly placing its information where it belongs – inside the assessment of how effective the *next* dollar will be. This should resolve the quant's concerns while preserving the valuable insights the committee already uses.
