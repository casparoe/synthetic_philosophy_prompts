prompt: |-
  I work as a research assistant on a project that is annotating every conditional in a corpus of mid‑century newspaper reportage and detective fiction. Each conditional receives exactly one of two tags: *indicative* or *counterfactual*. The codebook says to use the counterfactual tag when the speaker is not treating the antecedent as an open possibility, and says nothing at all about verb forms. My supervisor adjudicates whatever I flag; these are her eight rulings so far, each with the sentence and the corpus context I put in front of her.

  1. *If the match is cancelled tomorrow, we will lose the deposit.* — printed the evening before the match, outcome unknown, no indication of which way the writer expects it to go. Tagged **indicative**.
  2. *If Maria is in her office right now, the light is on.* — present tense, speaker has not checked. Tagged **indicative**.
  3. *If the butler was in the pantry at midnight, he heard the shot.* — uttered by the detective before the pantry question has been settled. Tagged **indicative**.
  4. *If he took the money, the auditors will find it.* — past antecedent, future consequent, matter unresolved. Tagged **indicative**.
  5. *If Maria were in her office right now, the light would be on.* — uttered by a character who has just been told Maria has gone home. Tagged **counterfactual**.
  6. *If the butler had been in the pantry at midnight, he would have heard the shot.* — uttered by a character who knows the butler spent the whole evening in the drawing room. Tagged **counterfactual**.
  7. *If the strike had started on Monday, the plant would have lost a week of output.* — written after the strike was called off. Tagged **counterfactual**.
  8. *If I were you, I would accept the offer.* — ordinary advice. Tagged **counterfactual**.

  Those eight rulings are compatible with the codebook's definition read in several different ways, and also with a much cruder rule that just looks for the fake past or irrealis marking and a *would* in the consequent. Up to now the two have lined up perfectly on every example, and I have been coding off the verb forms without ever being corrected. My next batch contains two sentences on which they come apart, and I would rather reconstruct her rule than wait for her to get back from her conference.

  N1: *If the strike started tomorrow, the plant would lose a week of output.* Written the night before the strike deadline; the reporter states explicitly that the outcome is a toss‑up and treats it as a genuine, live possibility.

  N2: *If the butler is the murderer, then he was in the pantry at midnight.* Spoken by the detective in the closing chapter, immediately after she has told the assembled suspects that the butler is not the murderer; she asserts the conditional as a step in an argument whose conclusion is that he is not the murderer.

  I am not asking how these sentences ought to be classified in the abstract. I am asking what she will say, given that she has to remain consistent with her own eight rulings. Specifically:

  1. Set out the different rules that fit all eight rulings equally well — not only the first one that comes to mind — including variants that differ only in which part of the sentence they look at, and note which plausible rules the eight rulings already eliminate.
  2. Say what each surviving rule predicts for N1 and for N2, and identify which pairs of rules the two sentences fail to separate.
  3. Give your best guess at her tag for each of the two sentences, with your reasons for preferring the rule you attribute to her. In weighing this: every written justification she has produced cites the tense and mood of the verbs, but in project meetings she has more than once insisted that the tags are meant to track what the speaker is doing with the possibility rather than the words on the page.
  4. For any tie that N1 and N2 leave unbroken, supply one further sentence — together with the corpus context you would need me to give her — that would break it, and what each tied rule predicts for it. If you think one of my two probes is defective, say which and tell me what to change about its context.
  5. Say which of the two sentences does more of the diagnostic work, and why.
reasoning: |-
  Hmm, the user is a research assistant working on a corpus annotation project involving conditionals. They need to understand how their supervisor would tag two new sentences (N1 and N2) based on her previous eight rulings. The goal is to infer her tagging rule and apply it consistently.

  First, I need to analyze the supervisor's eight rulings. All examples with past subjunctive or past perfect + "would" were tagged counterfactual (5-8), while those with present/past indicative + future/modal were tagged indicative (1-4). The codebook defines counterfactual as when the speaker doesn't treat the antecedent as an open possibility, yet verb forms perfectly predicted the tags so far.

  Now, N1 has future possibility ("started tomorrow...would lose") but uses past tense + would. N2 has present tense ("is the murderer") but is uttered when the antecedent is known false. These challenge the verb-form-based approach.

  Potential rules consistent with all 8 rulings:
  1. Verb-form rule: counterfactual iff past subjunctive (were/had) + would
  2. Epistemic rule: counterfactual iff speaker treats antecedent as false/closed
  3. Hybrid: counterfactual iff either (a) verb forms match pattern OR (b) antecedent is treated as closed

  For N1: 
  - Verb rule says counterfactual (due to "started...would")
  - Epistemic rule says indicative (speaker treats it as open possibility)
  - Hybrid says counterfactual

  For N2:
  - Verb rule says indicative (present tense)
  - Epistemic rule says counterfactual (antecedent known false)
  - Hybrid says counterfactual

  The hybrid rule matches both of the supervisor's verb-form justifications and her meeting comments about speaker intent. N1 is likely tagged counterfactual due to verb forms, while N2 gets counterfactual due to context. 

  To break remaining ties between rules, I propose a new test sentence: "If he took the money yesterday, he hid it well" where the theft is still unconfirmed. This separates the verb-form rule (indicative) from epistemic rule (could be either).

  N2 does more diagnostic work because it directly forces the choice between form and meaning, while N1 could be explained by the hybrid rule. The key is whether the supervisor prioritizes linguistic form or speaker epistemology when they conflict.
answer: |-
  Based on your supervisor's eight rulings and stated principles, here's a systematic analysis addressing all your requests:

  ### 1. Rules Compatible with All Eight Rulings
  **Surviving Rules** (all predict identical tags for the original 8):
  - **Rule A (Epistemic Stance):** Tag as **counterfactual** *iff* the speaker/writer treats the antecedent as non-true (false, impossible, or concluded-as-unrealized in the discourse context). Tag as **indicative** otherwise.  
    *Fits all 8: Antecedent treated as open in 1-4 (indicative), false/closed in 5-8 (counterfactual).*

  - **Rule B (Morphosyntactic):** Tag as **counterfactual** *iff* the antecedent has irrealis marking (*were*/*had* + past participle) *AND* the consequent contains *would*. Tag as **indicative** otherwise.  
    *Fits all 8: Standard forms in 1-4 (indicative), irrealis+*would* in 5-8 (counterfactual).*

  - **Rule C (Hybrid):** Tag as **counterfactual** *iff* either (a) antecedent uses irrealis *were*/*had* + *would*, *OR* (b) the speaker treats the antecedent as non-true. Tag as **indicative** only if *both* are false.  
    *Fits all 8 by design (subsumes A and B).*

  **Eliminated Rules**:
  - "Tag based *only* on tense/time reference": Fails Ruling 4 (past tense antecedent tagged indicative).
  - "Tag *only* on *would* in consequent": Fails Ruling 1 (no *would* but indicative).
  - "Tag based on speaker certainty": Fails Ruling 3 (detective uncertain but tagged indicative).

  ---

  ### 2. Predictions for N1 and N2
  | Rule      | N1 Prediction       | N2 Prediction       |
  |-----------|---------------------|---------------------|
  | **A (Epistemic)** | Indicative (open possibility) | Counterfactual (antecedent false) |
  | **B (Morpho)**    | Counterfactual ("started" + "would") | Indicative (present indicative, no *would*) |
  | **C (Hybrid)**    | Counterfactual (triggers morpho) | Counterfactual (triggers epistemic) |

  **Pairs Not Separated by N1/N2**:
  - N1 fails to separate **B** and **C** (both counterfactual).
  - N2 fails to separate **A** and **C** (both counterfactual).
  - Only **A** and **B** are separated (N1: A=indicative vs B=counterfactual; N2: A=counterfactual vs B=indicative).

  ---

  ### 3. Best Guess for Supervisor's Tags & Reasoning
  **Predicted Tags**:
  - **N1**: **Counterfactual**  
  - **N2**: **Counterfactual**  

  **Reasoning**:  
  Your supervisor likely follows **Rule C (Hybrid)**. This reconciles her written justifications (which cite verb forms) with her meeting comments (emphasizing speaker intent).  
  - **For N1**: Despite the open epistemic context, the *morphosyntax* ("started" + "would" ≈ irrealis past + conditional) matches her counterfactual rulings (5-8). She would override context due to strong formal marking.  
  - **For N2**: Despite indicative present tense, the *epistemic context* (antecedent known false) mirrors Rulings 5-6. Her rulings show she prioritizes speaker stance when forms are ambiguous (Ruling 3 used past indicative *without* marking as counterfactual).  

  *Why Rule C over others?*  
  - Rule A (epistemic) fails her reliance on verb forms (e.g., Ruling 5 explicitly cites "were").  
  - Rule B (morpho) fails her context sensitivity (e.g., Ruling 3 ignores past tense "was" because context is open).  
  - Rule C is the minimal extension of her behavior: she uses morphosyntax *unless* context forces a reanalysis (as in N2).

  ---

  ### 4. Tiebreaking Sentence for Remaining Ambiguity
  **Unbroken Tie**: N1/N2 leave **Rule A vs Rule C** unresolved (both predict counterfactual for N2).  
  **Probe Sentence (P1)**:  
  > *"If he took the money yesterday, he hid it well."*  
  **Context**: Uttered by a detective during an investigation. Theft is suspected but unconfirmed; no evidence proves/disproves it.  

  | Rule      | Prediction for P1      | Why? |
  |-----------|------------------------|------|
  | **A (Epistemic)** | Indicative | Antecedent treated as open possibility. |
  | **B (Morpho)**    | Indicative | Simple past ("took"/"hid"), no irrealis. |
  | **C (Hybrid)**    | Indicative | No irrealis forms *and* context open. |

  **Diagnostic Power**:  
  - If supervisor tags P1 as **indicative**, **Rule C** holds (consistent with morpho *and* context).  
  - If she tags it **counterfactual**, she uses **Rule D** (e.g., "past tense antecedents always counterfactual"), but this contradicts Ruling 4.  

  *Why this probe?* It isolates tense from epistemic stance. Ruling 4 showed past tense can be indicative, so a past-tense indicative with open context tests if morphosyntax alone ever triggers counterfactual.  

  ---

  ### 5. Diagnostic Value of N1 vs N2
  - **N2 is More Diagnostic**:  
    N2 forces a choice between **epistemic stance** (counterfactual) and **morphosyntax** (indicative). It directly tests whether context can override verb forms (as your supervisor implied in meetings). N1 only tests if morphosyntax can override context, which her rulings already suggest (via verb-form justifications).  
  - **N1 is Less Novel**: Ruling 4 already showed future consequents with past antecedents can be indicative, but N1’s "would" makes it a closer test of morphosyntactic bias.  

  **Recommendation**: If N2 is tagged counterfactual (as predicted), it confirms context can *override* indicative forms. If tagged indicative, she prioritizes morphosyntax absolutely. N1 tests the reverse override. Both are essential to map her rule space.  

  ### Summary of Proposed Tags
  | Sentence | Predicted Tag | Supervisor's Likely Reasoning |
  |----------|---------------|-------------------------------|
  | **N1**   | Counterfactual | "Started... would" mirrors irrealis form (despite open context). |
  | **N2**   | Counterfactual | Antecedent known false (despite present indicative). |  

  Use **P1** to confirm if her rule is strictly hybrid (Rule C) or leans epistemic (Rule A). If she tags P1 as counterfactual, request clarification—it would contradict Ruling 4.
