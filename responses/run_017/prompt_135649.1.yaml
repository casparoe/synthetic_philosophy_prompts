prompt: |-
  Hi — I need help drafting a memo and I'm kind of drowning. Context: I'm a second-year cog sci PhD student and I somehow ended up on the steering committee of a small open evaluation suite for visual reasoning (six members, a Slack that's 90% meme threads, and a release date in six weeks). We have to decide on one task submission and I'm the one stuck writing the recommendation memo.

  The submission is a Bongard-style few-shot concept-induction task: you get twelve figures — six on the left that share a rule, six on the right that violate it — and then you have to say whether a new figure follows the rule. The intended rule here is about containment: every left-hand figure has one shape sitting entirely inside another (triangle in a circle, square in a pentagon, circle in a circle, two nested rectangles), while every right-hand figure has shapes that are either fully disjoint or only partially overlapping, with nothing contained in anything. We all liked it. Then one reviewer ran a three-line baseline that just measures average ink density per image and got 98%: the generator apparently has two rendering branches, and the positive branch also draws with a thinner stroke, and because of how the layout code samples sizes the positives also wierdly tend to have a slightly smaller bounding box. So a system can ace the task without representing containment at all.

  Now the committee is split and I have to recommend something. Our ML person says: fine, just regenerate the item pool with the correlates flipped or randomized and score on held-out items, so anything relying on stroke weight fails. Our vision chair says that fixes nothing: the general worry is that no finite set of examples pins down a rule — there are always grue-style alternatives that fit all the data and diverge on the next case — and "randomize the confounds we happened to notice" only works because we already decided which features are projectible, i.e. we smuggled in the answer, and by that logic the whole few-shot format is broken rather than just this task. Someone else floated a different scoring rule: don't score the model's label on the held-out image at all; score whether the model can state a rule in words that a naive human annotator can then apply to fresh figures and get right. I have a nagging suspicion that this just tests verbalization, which current systems are very good at, rather than whether the system has got the concept, but I can't get the worry into focus. Complicating everything: our rubric says accepted tasks must be "solvable by an untrained human in under two minutes," and it occurs to me that a human staring at these twelve figures faces exactly the same underdetermination and just picks the rule that feels natural — so that criterion might already presuppose whatever we were trying to test. Our existing rubric language ("requires abstract reasoning") is useless and I'd like the memo to actually say what our criterion should be.

  So: please write the memo I'll circulate, around 800 words, addressed to the committee, recommending one of: accept as submitted, reject, or accept with specified conditions. It should be something we could actually vote on, and it should include a short criteria section saying what we are testing for when we claim a task measures induction of a concept from a few examples rather than surface pattern-matching. Please treat the underdetermination objection seriously and give the strongest version of whichever position you end up rejecting — I don't want the losing side to feel strawmanned, especially not the vision chair, who will absolutely push back in the meeting. No bibliography or citations please, we can't check them and none of us will read them anyway. End the document with exactly one final line: \answer{accept}, \answer{accept with conditions}, or \answer{reject}.
reasoning: |-
  We are drafting a memo for the steering committee of an open evaluation suite for visual reasoning. The memo must address a specific task submission (a Bongard-style few-shot concept-induction task about containment) that has a problem: a trivial baseline using average ink density achieves 98% accuracy due to unintended correlates (stroke weight and bounding box size). The committee is split on how to proceed.

  The memo should:
  - Be addressed to the committee
  - Be about 800 words
  - Recommend one of: accept as submitted, reject, or accept with conditions
  - Include a short criteria section defining what we are testing for when we claim a task measures concept induction from few examples
  - Treat the underdetermination objection seriously and present the strongest version of the rejected position(s)
  - End with exactly one of: \answer{accept}, \answer{accept with conditions}, or \answer{reject}

  Key positions in the committee:
  1. ML person: Regenerate the item pool with the confounds (stroke weight, bounding box) flipped or randomized and score on held-out items. This way, a model relying on those features would fail.
  2. Vision chair: This fix is inadequate because underdetermination is inherent in few-shot learning. We cannot randomize all possible confounds, and by choosing which ones to fix, we are already biasing the task toward the intended rule. Moreover, the few-shot format itself may be flawed if we require that the rule is uniquely determined by the examples.
  3. Another member: Change the scoring to require the model to state a rule in words that a human can then apply to new figures. But the author worries this may test verbalization rather than the actual concept.

  Additional complication: The rubric requires that the task is "solvable by an untrained human in under two minutes." The author notes that humans also face underdetermination and rely on "natural" rules, which might be what we are actually testing.

  We must define criteria for what makes a task a good measure of concept induction from few examples.

  After considering the options, I think the best recommendation is to **accept with conditions**. The conditions should address the immediate confounds and also set a standard for future tasks.

  Proposed conditions:
  1. Regenerate the item pool to remove the known confounds (stroke weight and bounding box size) by randomizing or balancing them across positive and negative examples. This is the ML person's suggestion and is a practical fix for the current issue.
  2. Additionally, we should require that the task includes a set of "adversarial" or "foil" items in the test set that are designed to probe for reliance on unintended features. These are held-out items that are consistent with the intended rule but vary in the confounded features, and also items that are inconsistent with the intended rule but might be consistent with an alternative rule based on a confound. This goes beyond just randomizing the confounds in the training (few-shot) examples and tests whether the model has really learned the intended rule.

  We should also update our criteria for future tasks to require that they include such adversarial testing and are designed with confound control in mind.

  But we must address the vision chair's underdetermination objection. The strongest version: No finite set of examples can uniquely determine a rule because of the grue problem (Goodman's riddle of induction). Therefore, any few-shot task is inherently biased toward the rule that the designer intended and that humans find natural. The vision chair might argue that the entire format is flawed and we should abandon it in favor of a different approach.

  However, we can counter that the point of the task is not to test whether the model can find the unique rule (which is impossible) but to test whether it can induce the same rule that a human would in the same context. The human solvability criterion in our rubric is key here: if an untrained human can solve the task in under two minutes, then the intended rule is the one that is "natural" to humans. Thus, the task is valid if it requires the model to align with human-like induction biases.

  Regarding the alternative scoring rule (verbalizing the rule): We should reject this as a requirement because it shifts the task to verbalization, which is a different skill. However, we might allow it as an optional additional metric for models that are capable of generating such explanations.

  Criteria section: We are testing for the ability to induce a concept from a few examples in a way that generalizes to novel instances, where the generalization must align with human-like induction (as evidenced by human solvability). This requires:
  - The task to be designed so that simple heuristics (like the ones we found) are controlled and do not lead to high performance.
  - The task to include held-out examples that are adversarial with respect to potential confounds (i.e., they break the correlation between the confound and the label) to ensure that models are relying on the intended features.

  Therefore, the memo will:
  - Acknowledge the problem and the underdetermination concern.
  - Recommend accepting the task with the conditions of regenerating the item pool to remove the confounds and including adversarial test items.
  - Propose updating our criteria for future tasks to include confound control and adversarial testing.

  End with: \answer{accept with conditions}

  Now, drafting the memo accordingly.
answer: |-
  **MEMORANDUM**  
  To: Steering Committee, Open Evaluation Suite for Visual Reasoning  
  From: [Your Name], Second-Year Cognitive Science PhD Student  
  Date: [Current Date]  
  Subject: Recommendation for Bongard-Style Containment Task Submission  

  ### Background  
  The submitted task is a Bongard-style visual reasoning item designed to test few-shot concept induction. Twelve figures are presented: six "positive" examples sharing a containment rule (one shape entirely inside another), and six "negative" examples violating it (shapes disjoint or partially overlapping). A new figure must then be classified as adhering to the rule or not. While the task initially garnered consensus for its clarity and alignment with our goal of probing abstract reasoning, a critical flaw emerged: a trivial baseline leveraging low-level correlates (stroke weight and bounding box size) achieved 98% accuracy. This undermines the task’s validity, as models could "solve" it without representing containment. The committee is divided on solutions, raising deeper questions about underdetermination in few-shot learning. This memo evaluates options, proposes criteria for concept-induction tasks, and recommends a path forward.  

  ### Key Concerns and Positions  
  1. **The Immediate Flaw**: The generator’s rendering artifacts (thinner strokes and smaller bounding boxes for positives) create unintended cues. A model exploiting these correlates bypasses concept induction entirely.  
  2. **The Underdetermination Objection (Vision Chair’s Argument)**:  
     - *Strongest Version*: No finite set of examples uniquely determines a rule. For instance, the positives might imply "containment" or "low ink density," and we cannot preempt all such alternatives. Randomizing known confounds (e.g., stroke weight) merely privileges our intuitions about "projectible" features (like geometric relationships) over others. If we reject correlates while accepting that examples underdetermine rules, we implicitly endorse human-like induction biases—rendering the few-shot format fundamentally flawed for testing "true" concept learning. Requiring human solvability worsens this, as it presupposes the very biases we aim to evaluate.  
  3. **Proposed Fixes**:  
     - *ML Member’s Suggestion*: Regenerate the item pool with confounds randomized (e.g., vary stroke weight/bounding box size across labels) and test on held-out items. This ensures models relying on correlates fail.  
     - *Alternative Scoring Rule*: Score models based on verbalized rules applied by humans to new figures. This risks testing verbalization fluency over concept induction, as modern LLMs generate plausible rules without deep understanding.  
     - *Rejection*: Discard the task due to irreparable design flaws.  

  ### Criteria for Concept-Induction Tasks  
  Our rubric’s "abstract reasoning" criterion is underspecified. For a task to validly measure **concept induction from few examples**, it must:  
  - **Control for Trivial Heuristics**: The design must minimize low-level correlates (e.g., pixel density, color, texture) that could solve the task without concept representation. This requires explicit checks during item generation.  
  - **Test Generalization Robustly**: Held-out items must include "adversarial" examples that break correlations between unintended features and labels (e.g., a positive figure with thick strokes or a large bounding box). This forces reliance on structural/relational features.  
  - **Align with Human Inductive Biases**: Human solvability ("untrained human in under two minutes") is not a bug but a feature. Humans resolve underdetermination by privileging "natural" rules (e.g., containment over ink density). A valid task should require models to mirror this bias, as our goal is to evaluate human-like reasoning—not to solve philosophical underdetermination.  
  - **Avoid Task Shifting**: Changing scoring (e.g., to verbalization) alters the construct being measured. We should test *performance* (labeling new figures) first, with verbalization as an optional auxiliary metric.  

  ### Recommendation: Accept with Conditions  
  I recommend **accepting the task with two conditions**:  
  1. **Regenerate the Item Pool with Confound Randomization**: Implement the ML member’s suggestion. Randomize stroke weight, bounding box size, and other identified correlates across labels during generation. This is a pragmatic, necessary step to eliminate trivial solutions while preserving the task’s core structure.  
  2. **Include Adversarial Held-Out Items**: Augment the test set with figures that:  
     - Adhere to the containment rule but exhibit features correlated with negatives (e.g., high ink density).  
     - Violate containment but share correlates with positives (e.g., low ink density).  
     This tests whether models induce the intended rule rather than overfitting to surface statistics.  

  ### Addressing Counterarguments  
  - **To the Vision Chair**: The underdetermination critique is valid but not fatal. Human solvability anchors the task to *human*-like induction, which is our benchmark for "successful" concept learning. By randomizing confounds and adding adversarial items, we force models to grapple with the same inductive biases humans use—making the task a probe for human-aligned reasoning, not a test of logical determinism. This aligns with our rubric’s goals.  
  - **To the Verbalization Proposal**: While rule verbalization is insightful, it introduces construct drift. Systems may generate "correct" rules without functional understanding (e.g., via pattern-matching training data). Performance on held-out figures remains the primary indicator of concept induction.  
  - **Why Not Reject?**: The task’s core idea—containment as a visual primitive—is sound, and human solvability confirms its intuitiveness. Discarding it wastes a valuable opportunity to refine our suite.  

  ### Implementation and Voting  
  Conditions are feasible within our six-week timeline:  
  - Task designers can regenerate items in <1 week using existing code.  
  - Adversarial items can be sampled from a larger pool or synthetically tweaked.  
  - We retain original scoring (label accuracy) but may add verbalization as a secondary metric.  

  I propose we vote on:  
  **Accept the containment task contingent on: (1) confound randomization in generation, and (2) inclusion of 20% adversarial items in held-out test figures. Deadline for revisions: [Date 10 days from now].**  

  ### Conclusion  
  The containment task, revised to mitigate confounds and include adversarial testing, can robustly measure concept induction. It leverages human solvability to define "natural" rules while pressuring models to transcend surface cues. This approach balances pragmatism with philosophical rigor—and sets a precedent for future tasks. I urge the committee to support conditional acceptance.  

  \answer{accept with conditions}
