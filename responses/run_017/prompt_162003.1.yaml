prompt: |-
  I write long-form pieces, mostly on science and the history of ideas, and I keep running into the same thing in archives. I dont have a word for it.

  A historian works through a colonial administration's correspondence. The files for one district survive; the files for the neighbouring one were destroyed in a fire decades ago. She writes it carefully: unlike district A, she says, district B shows no record of organised resistance. The next book drops the caveat: district B, notably quiet under the new administration. By the third one it's the pacification of district B, and it's in the textbook. Nothing was fabricated — the fire is real, and it's in a footnote somewhere — but a fact about what survived got converted into a fact about what happened, and each retelling makes the conversion harder to spot.

  Digital version of the same thing: I was searching a scanned newspaper run for coverage of a strike and found a clean-looking collapse in mentions halfway through. Turned out the scan was made from microfilm, a couple of reels were unreadable, the OCR for those months is garbage, and the search engine can't see it. Anyone who searched instead of reading would report that coverage fell off a cliff.

  Is there a name for this? It isn't argument from silence — the people making the move usually know the silence is an artifact. And it isn't quite the literature on silences in the archive, which as far as I can tell is about how power shapes what got recorded in the first place, not about what later writers do downstream with a gap. Its not citation laundering either, because nobody invented a claim; they just stopped repeating the caveat.

  So: does this have an established concept, and if not, name it and define it — including where the line falls between the harmless version (a caveat you don't have room to repeat) and the version that should worry you, and what a check for it looks like when I'm about to lean on a secondary source. Lead with your bottom line in the first sentence, then give me the reasoning, no preamble and no restating the question.
reasoning: |-
  Okay, the user is asking about a specific phenomenon they've encountered in historical research where the absence of evidence, due to archival gaps or technical issues, gets transformed into evidence of absence over successive retellings. They've provided clear examples: one with colonial district records lost in a fire, and another with faulty OCR in digitized newspapers. 

  First, I need to confirm this isn't already a named concept. They've ruled out "argument from silence" (which is about drawing conclusions from literal absence of records, not technical gaps), "archival silence" (which focuses on why records weren't created, not later mishandling of gaps), and "citation laundering" (which involves inventing sources). They're right—this is distinct. 

  The core issue is the degradation of nuance in scholarly transmission. The initial author knows the gap is artificial (e.g., footnote about the fire), but subsequent writers strip the caveat until the gap becomes a "fact." The user wants: 
  1. A name for this (or a new term if none exists) 
  2. A definition distinguishing harmless omission (e.g., space constraints) from problematic erasure 
  3. Practical checks for spotting it in secondary sources 

  I recall similar ideas: 
  - Latour's "immutable mobiles" (how facts stabilize as they circulate) 
  - "Source amnesia" in psychology (forgetting origins of info) 
  - "Biased transmission" in cultural evolution (simplification favors less complex info) 
  But nothing fits perfectly. 

  Coining a term: Needs to evoke both the archival/material cause (fire, bad OCR) and the scholarly negligence. "Documentary decay" is tempting but too passive. "Caveat erosion" is clearer—it targets the loss of qualifying information. "Archival mirage" hints at the illusion created. "Survivorship Sophism" leans too hard on logical fallacy. 

  Best option: **Caveat Collapse**. It's punchy, describes the vanishing qualifier, and implies structural failure (like a building collapsing). 

  Definition boundaries: 
  - Harmless: Omission in summaries due to space, where original context is accessible (e.g., textbook briefly stating "District B was pacified" but citing the full study). 
  - Problematic: When the caveat disappears entirely from the literature chain, making the gap-invisible. 

  Check strategy: 
  - Trace citations back to the earliest source 
  - Audit the source's description of its own materials (e.g., "microfilm gaps noted on p. x") 
  - Ask: "Would the original author recognize their nuanced claim in this retelling?" 

  User's deeper need: They’re likely building methodology sections or calling out lax historiography. They want armor against accidental complicity and tools to critique weak sources. The term must be crisp enough for academic writing.
answer: |-
  **Bottom line:** The process you describe is best termed **Caveat Collapse**: the progressive erosion of qualifying context about archival gaps or limitations across retellings, transmuting a known artifact of preservation into a false fact about historical reality.

  **Reasoning:**
  1.  **Core Mechanism:** It describes the *failure to sustain critical context* (the caveat) about the source's limitations (the fire, the bad OCR). Each iteration makes the caveat less visible or disappears it entirely.
  2.  **Distinction from Related Concepts:**
      *   **Argument from Silence:** Involves *interpreting* the absence *as* evidence. Caveat Collapse starts *after* the initial interpreter *correctly flagged the silence as artifactual*; the sin is the *loss* of that flagging.
      *   **Archival Silences:** Focuses on *why* records weren't created/preserved (power structures). Caveat Collapse focuses on how scholars *handle known, documented gaps* downstream.
      *   **Citation Laundering:** Involves fabricating *support*. Here, the *initial claim is contextually accurate*; the problem is the *stripping away* of essential context that made it accurate.
      *   **Survivorship Bias:** Concerns errors from analyzing only what *survived*. Caveat Collapse is how a *known instance* of survivorship bias becomes *misrepresented* as objective reality in later scholarship.
  3.  **The Harmful Threshold:** The line falls when the caveat is severed from the claim in the scholarly record.
      *   *Harmless:* Briefly omitting the full caveat in a tightly focused argument *while clearly pointing to the original source containing it* (e.g., "As Jones notes, District B showed no resistance [Ref]"). The caveat remains *retrievable* via the citation.
      *   **Harmful:** When the caveat is omitted *and* the claim is made without qualification *and* subsequent citations build on this *unqualified* version, making the original context effectively lost to anyone not doing deep archival backtracking. The artifactual gap becomes an accepted "fact."
  4.  **The Check When Using Secondary Sources:**
      *   **Trace the Citation Chain:** Don't just read the secondary source you're using; follow its citation for the key claim back to *its* source, and repeat until you find the *earliest* source making the claim about the archival gap.
      *   **Audit the Original Context:** In that earliest source, scrutinize *how* the author presents the gap. Do they explicitly state the limitation (fire, missing reels, OCR failure)? Is it framed as an absence *in the record* or an absence *in history*?
      *   **Spot the Collapse:** Compare how the claim is presented in the earliest source versus your immediate source. Has the qualifying language ("no record survived," "due to preservation issues," "the available fragments show...") been dropped or minimized? Does your source present the claim as an unvarnished historical fact?
      *   **Assess Retrievability:** Is the caveat *still attached* in your source, or easily found in its cited source? If not, the collapse has likely occurred, and the claim should be treated with extreme skepticism unless you can independently verify the *absence* (not just the gap).

  Caveat Collapse highlights the fragility of nuanced interpretation in historical transmission and the ethical burden on scholars to maintain critical context about the very foundations (the archives) they build upon.
