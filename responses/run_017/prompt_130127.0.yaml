prompt: |-
  I could use a hand with something. I'm the token scientist on the exhibits and public programing committee at the little natural history museum in town — we also run a 60-seat planetarium out back, which is how I got roped in. I did thirty-one years in isotope geochemistry, and since retiring I've been sitting in on a philosophy of science reading group at the university, and its gone to my head a bit, so I'm the one always saying "well, it depends what you think a research program is."

  The case: our education staff want an interactive for the Kepler exhibit we're opening in October. Visitor types in a birth date, the box computes the angular separations between the planets at that moment — the aspects, the ones Kepler actually used, including the odd ones he derived from regular polygons — and prints a card describing that person's 'temperament' in his terms. All of it labelled as 17th-century history, with a disclaimer panel at the exit. Our astronomer on the advisory board says no: she says we would be manufacturing an astrological claim about a living visitor, using real orbital mechanics to do it, with the museum's name on it, and that nobody reads the disclaimer. There's a third version floating around, which is to keep the machine but have it print the aspects next to what the same geometry let Kepler actually do — nail Mars to within minutes of arc — so the visitor sees the failure sitting right beside the success. Half of us think that's the honest version and half think its a fig leaf on the same thing.

  We vote March 12, because the interactive has to go to the fabricator in April. Please draft the memo I'll table. What I want in it:

  A clear recommendation in the first paragraph — build it, build it with named conditions, or kill it — with the reasons after, not the other way round.

  It has to commit to a reading of what Kepler thought he was doing, because I've come to think that's what the argument is really about. Three candidates as I see them. (a) Leftover: the astrology was the vocabulary and the income of his time, and had nothing to do with the work that survived. (b) Same machinery, wrong domain: the same instincts for geometry and number and checkable prediction, pointed at a subject where they didn't pay — a failed research program pursued in good faith. (c) Two standards: he was merciless with himself about Mars and much looser about charts, which is compartmentalization of a kind we'd call a fault even on his own terms. Say which one the exhibit should be built on, why that choice decides whether the station is history of science or just an occult parlor trick in a lab coat, and what should follow if we honestly can't tell which reading is right.

  Give the losing side at its best. The education staff's real argument isn't engagement numbers; it's that the chart has to work on you a little before the correction means anything, that a panel saying astrology was bunk teaches nothing about how science actually changed, and that Kepler's version — no sun signs, no houses, real geometry, and a claim that the soul answers to shapes rather than being pushed around by them — is instructive precisely because it looks so much like science and then isn't. Don't flatten that. But also deal honestly with the thing I think is the strongest point on the astronomer's side: that people read a personality description about themselves as uncannily accurate even when it's generic, and that cuts against any version that prints something about the person standing at the machine.

  Give us a rule we could apply to the next three proposals, which I can tell you right now are alchemy, phrenology, and something with the Platonic solids. Something like: never produce an output about a living visitor? Or: only ever compute charts for dead people — Kepler's own, or one of the patrons he drew them for — so the machinery is on display without anyone being told something about themselves? If you like that second one, say so and say what it costs us in terms of the point the education people are making.

  Plain language, about 800 words: it's going to trustees and two high school teachers. Don't bother with citations or further reading, nobody on this committee will check them and I'd only have to format them. And if you think the real crux here is something other than what I've laid out, say that in the memo and hang the recommendation on that instead — I'd rather be told I've framed it wrong than be agreed with.
reasoning: |-
  Okay, let me unpack this request from the isotope geochemist turned museum committee member. They're wrestling with an ethical and historical dilemma about a Kepler exhibit interactive. 

  First, I need to understand the core tension: education staff want visitors to experience historical astrology firsthand, while the astronomer fears this legitimizes pseudoscience. The philosopher-scientist wants a memo that doesn't shy away from epistemological questions about Kepler's mindset.

  Hmm... the key angles seem to be:
  - The Barnum effect (people believing generic personality descriptions)
  - Whether historical context justifies interactive participation
  - Kepler's own duality in applying rigor to astronomy but not astrology

  I'm noticing the requester is unusually self-aware about their own biases - they mention the philosophy reading group "going to their head." That's helpful context; they want rigorous thinking, not just validation.

  The third option (showing failed astrology beside successful astronomy) is clever but feels like having cake and eating it too. The astronomer's concern about museum credibility is valid - once you print something "about you," disclaimers become wallpaper.

  For the recommendation... what if we reframe entirely? Instead of printing personal temperaments, print Kepler's actual historical chart interpretations alongside his scientific breakthroughs. That way:
  - Visitors see the same mind at work in both domains
  - The "geometry-to-meaning" link is preserved without personalization
  - We avoid manufacturing modern claims

  This satisfies education's goal of showing "how science changed" by juxtaposition, while honoring the astronomer's ethical line. For the rule: "Never generate outputs about living visitors' attributes." Dead people only - like Kepler's patrons.

  On Kepler's mindset - option (b) feels most accurate. Same machinery, wrong domain. His astrology wasn't residual superstition but parallel inquiry with lower standards. The exhibit can highlight this cognitive dissonance as historically instructive.

  Biggest tradeoff: visitors won't get that visceral "this is about me" moment. But the education team's insight about cognitive engagement can be achieved through other means - maybe a side-by-side display of how generic descriptions feel "accurate."

  Word count is tight at 800 words. Need plain language for trustees and teachers. Structure: recommendation first, then reasoning broken into digestible chunks with clear headings. No citations per request, but historical accuracy must be implicit.

  The real crux might be deeper: museums as authorities. When we put our name on an interactive, we endorse its framework. Better to show Kepler's framework than recreate it uncritically.
answer: |-
  **MEMORANDUM**  
  **TO:** Exhibits and Public Programming Committee  
  **FROM:** [Your Name], Committee Member (Geochemistry/Philosophy of Science Liaison)  
  **DATE:** March 1, 2024  
  **SUBJECT:** Recommendation for Kepler Exhibit Interactive Station  

  **Recommendation:** Build the interactive station **without generating personalized temperament outputs for living visitors**. Instead, compute and display aspects for **historical figures only** (e.g., Kepler himself, Rudolf II), accompanied by Kepler’s documented interpretations of their temperaments and a clear comparison to his astronomical achievements. *Do not proceed* with versions printing personalized claims or relying solely on juxtaposition without historical context.  

  **Reasoning:**  
  The core conflict is whether the museum risks endorsing pseudoscience by using real orbital mechanics to generate personalized astrological claims, even as historical demonstration. While the education team’s goal—to immerse visitors in Kepler’s worldview to critique it—is pedagogically sound, the astronomer’s concern that **personalized outputs inherently validate astrology** is compelling. Psychological research confirms that individuals attribute undue accuracy to generic personality descriptions (the Barnum effect), especially when tied to personal data like birthdates. A disclaimer will not counteract this cognitive bias.  

  **Kepler’s Intent: Why It Matters**  
  The exhibit’s integrity hinges on how we frame Kepler’s relationship with astrology. Of the three readings:  
  - **(a) Leftover** (astrology as irrelevant income) is untenable; Kepler wrote extensively on astrology’s philosophical foundations.  
  - **(c) Two standards** (compartmentalization) is plausible but reduces him to hypocrisy, obscuring his genuine quest for cosmic harmony.  
  - **(b) Same machinery, wrong domain** best captures his project: **a unified, numerological pursuit of divine geometry**, applied with empirical rigor to *planetary motion* (success) and *human temperament* (failure). This reading transforms the interactive from a "parlor trick" into **history of science**. It shows how methodological instincts—quantification, prediction, geometry—can falter when detached from falsifiable constraints.  

  **The Solution: Historical Charts, Not Personal Ones**  
  Computing aspects for historical figures (using their *documented* birthdates and Kepler’s interpretations) achieves the education team’s goals *without* crossing ethical lines:  
  1. **Visitors engage with mechanics**: They input dates, see angular separations, and grasp Kepler’s geometric logic.  
  2. **The "failure" is visible**: Kepler’s temperament readings for patrons (e.g., "melancholic with martial vigor") sit beside his precise Mars orbital data, illustrating how identical methods succeeded in astronomy but failed in astrology due to unverifiable claims.  
  3. **No manufactured claims**: The museum avoids attaching speculative traits to visitors.  

  **Addressing Key Concerns**  
  - **Education Team’s Core Argument**: A generic "astrology is bunk" panel *is* ineffective. Historical charts solve this. Visitors still witness Kepler’s "science-like" system and its collapse *in practice*—Rudolf II’s chart feels immediate without targeting the visitor.  
  - **Astronomer’s Valid Warning**: Personalized outputs exploit cognitive bias. Historical figures eliminate this risk while preserving the machinery’s educational value.  
  - **Juxtaposition-Only Version (Fig Leaf)**: Printing a visitor’s aspects beside Mars’ orbit *still* implies their birth chart has meaning—it just "failed" this time. This undermines the critique.  

  **A Rule for Future Proposals (Alchemy, Phrenology, etc.)**  
  **Never generate an output asserting a speculative claim about a living visitor’s mind, body, or future.** Interactive stations may:  
  - Demonstrate historical methods using **impersonal inputs** (e.g., "Try a phrenology measurement on this 19th-century skull replica").  
  - Compute outputs for **historical subjects** with documented outcomes (e.g., "See how alchemical symbols mapped to known elements").  
  - **Cost**: This sacrifices the visceral "this is about me" hook. However, it forces exhibits to focus on *historical evidence* over sensationalism. For Kepler, this means leaning into his writings on Rudolf II’s melancholy, not a visitor’s.  

  **If We Can’t Agree on Kepler’s Intent?**  
  Should the committee remain divided on whether astrology was "failed science" (b) or "compartmentalized delusion" (c), the ethical imperative remains: **avoid personalization**. History is full of brilliant minds embracing flawed ideas; we can showcase this without implicating visitors.  

  **Conclusion**  
  The proposed historical-figure interactive uses Kepler’s tools to illuminate his worldview, contrasts his astronomical triumphs with astrological dead ends, and adheres to the museum’s role as a critical educator. It satisfies the astronomer’s ethical boundary and the education team’s demand for experiential learning. Reject personalized outputs outright—no fig leaves. Proceed with fabrication under these terms.  

