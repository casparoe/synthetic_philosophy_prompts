prompt: |-
  I write long-form pieces, mostly on science and the history of ideas, and I keep running into the same thing in archives. I dont have a word for it.

  A historian works through a colonial administration's correspondence. The files for one district survive; the files for the neighbouring one were destroyed in a fire decades ago. She writes it carefully: unlike district A, she says, district B shows no record of organised resistance. The next book drops the caveat: district B, notably quiet under the new administration. By the third one it's the pacification of district B, and it's in the textbook. Nothing was fabricated — the fire is real, and it's in a footnote somewhere — but a fact about what survived got converted into a fact about what happened, and each retelling makes the conversion harder to spot.

  Digital version of the same thing: I was searching a scanned newspaper run for coverage of a strike and found a clean-looking collapse in mentions halfway through. Turned out the scan was made from microfilm, a couple of reels were unreadable, the OCR for those months is garbage, and the search engine can't see it. Anyone who searched instead of reading would report that coverage fell off a cliff.

  Is there a name for this? It isn't argument from silence — the people making the move usually know the silence is an artifact. And it isn't quite the literature on silences in the archive, which as far as I can tell is about how power shapes what got recorded in the first place, not about what later writers do downstream with a gap. Its not citation laundering either, because nobody invented a claim; they just stopped repeating the caveat.

  So: does this have an established concept, and if not, name it and define it — including where the line falls between the harmless version (a caveat you don't have room to repeat) and the version that should worry you, and what a check for it looks like when I'm about to lean on a secondary source. Lead with your bottom line in the first sentence, then give me the reasoning, no preamble and no restating the question.
reasoning: |-
  Okay, the user is asking about a specific phenomenon they've encountered in historical research. They describe how gaps in archives get misinterpreted over time, evolving from caveats to accepted "facts." They mention colonial records and digital newspaper scans as examples. They've ruled out terms like "argument from silence" or "citation laundering" because the issue isn't about unawareness of the gap but the gradual omission of caveats in retellings.

  The user needs a term for this concept. First, I should consider if there's an existing term. Epistemic erosion? That might work. The user also wants a clear definition, the line between harmless and problematic cases, and how to check for it in secondary sources.

  Looking deeper, the user is a long-form writer focused on science and history of ideas. They likely aim to maintain accuracy and avoid perpetuating errors. Their unspoken need might be to not only name the issue but also equip themselves and readers with tools to spot and prevent it. They might want to enhance their methodology or educate others through their writing.

  The key elements here are the transformation of archival gaps into historical facts through iterative retelling. Each step omits a bit of the original caution. The digital example shows how technical issues (bad OCR) create false negatives in searches. The problem isn't intentional fabrication but negligence in maintaining caveats.

  Existing concepts: "Argument from silence" doesn't fit because the historians know the silence is artificial. "Silences in the archive" deals more with why records were omitted initially, not the downstream effect. "Citation laundering" involves inventing sources, which isn't the case here. So a new term is needed.

  "Epistemic erosion" seems fitting. It captures the gradual wearing away of knowledge qualifiers. Defining it: the process where caveats about archival survival or data limitations are incrementally omitted in scholarly retellings, converting absence of evidence into evidence of absence.

  Differentiating harmless vs. harmful: Harmless might be omitting a well-known caveat in a summary. Harmful is when the omission changes the narrative, especially if the gap isn't common knowledge. Checks for secondary sources: Look for citations tracing back to the original source, presence of caveats in earlier works, and whether later authors acknowledge the limitations. Also, verify if the silence is treated as significant without justification.

  User's deeper needs: They want to prevent their work from contributing to this erosion and to critically assess sources. Providing a term and methodology helps them articulate and address the issue in their writing, promoting historical accuracy.
answer: |-
  **Bottom line:** The core phenomenon you describe is best termed **epistemic erosion**, defined as *the incremental loss of qualifying context (especially regarding knowledge gaps or methodological limitations) across successive scholarly retellings, resulting in the unintentional transformation of "absence of evidence" into accepted "evidence of absence"*.

  **Reasoning:**

  1.  **Core Mechanism - Erosion of Caveats:** The defining feature is the *stepwise omission* of crucial qualifiers ("unlike District A", "due to the fire", "OCR gaps prevent search") originally present. Each iteration sheds a layer of contextual caution.
  2.  **Distinction from Related Concepts:**
      *   **Argument from Silence (Fallacy):** This *starts* from silence *as proof*. Your case starts with a *known artifact* (the fire/OCR gap) acknowledged as creating the silence, which is then *eroded away* over retellings. The initial historian isn't necessarily committing the fallacy; later ones do by losing the context.
      *   **Archival Silences (Power Dynamics):** This focuses on *why* something wasn't recorded initially (oppression, bias, neglect). Your focus is on what happens *after* a known, *documented* gap exists – how the *handling* of that gap decays over time.
      *   **Citation Laundering:** Involves fabricating or misrepresenting sources to support a claim. Here, the *source* (the archive with the gap) is real and initially cited correctly; the problem is the *decay of the interpretation's precision* around that source.
  3.  **The Harmless vs. Harmful Line:** The line falls where the *omitted caveat changes the inferred historical reality or causal explanation*.
      *   **Harmless:** Omitting "microfilm reel 7 damaged" when summarizing a *well-established fact also supported by other, intact sources*. The caveat is redundant noise in *that specific context*.
      *   **Harmful:** Omitting the caveat when *the silence itself is treated as significant evidence* ("pacification," "coverage collapsed"), especially if:
          *   The gap is the *primary* or *only* source for the claim of absence/change.
          *   The inferred absence supports a broader narrative or argument.
          *   The gap is not common knowledge within the field/subfield.
  4.  **The Check - Tracing the Caveat Stream:** When leaning on a secondary source reporting an absence or a "notable quiet," ask:
      *   **Citation Archaeology:** Does the source *cite* an earlier work making the same claim *with* the caveat? If citing primary sources, what *exactly* do those sources say about the *completeness* of the record? Look for footnotes mentioning fires, lost files, poor OCR, selective preservation, or methodological disclaimers.
      *   **Source Provenance:** What is the *nature* of the source being cited for the absence? Is it inherently fragmentary (e.g., one colonial office, specific newspaper run)? Does the author demonstrate awareness of potential gaps *in that specific source*?
      *   **Plausibility Check:** Is the reported absence *plausible* on its own merits, or does it seem surprising? If surprising, the burden of proof (and likelihood of epistemic erosion) increases.
      *   **Silence as Evidence:** Is the *silence itself* being presented as positive evidence for a historical state or event (e.g., "pacification," "lack of interest")? If so, scrutinize extremely hard – demand explicit justification for why the silence is probative *despite* known preservation issues.

  Epistemic erosion thrives on the normalization of incomplete knowledge and the compression inherent in synthesis. Vigilance requires actively reconstructing the chain of citation and context to see if the caveat was washed away.
