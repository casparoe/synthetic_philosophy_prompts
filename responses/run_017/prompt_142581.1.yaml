prompt: |-
  In a reading group on Anscombe's protest against Oxford giving Truman an honorary degree, one member keeps shutting down every discussion with the same line: *the deliberate killing of the innocent is never permissible*, and that is supposedly all there is to say about Hiroshima. I think it's doing about four jobs at once and I want the menu, not one of them explained.

  Separate the precise claims that sentence could be making — about who counts as innocent (non-combatant? morally blameless? not currently attacking anyone? not liable for some reason other than fault?), about what deliberate covers (intended as an end, as a means, merely foreseen, accepted as a side effect, risked because the upside is huge), about whether it's a rule about acts or about what sort of person one turns into and what a community can afterwards avow, and about whether it's absolute or just a very heavy presumption. For each, say whether it's a platitude, a substantive thesis someone could deny, or something that quietly begs the question, and whether it actually gets him his conclusion about Truman or only looks like it does.

  Two cases where I got lost: a night strike on a munitions plant whose workers are all asleep and so not attacking anyone, though the plant is what keeps the war running; and a crew that aims at the plant, gets blown off course by wind, and kills a schoolfull of children — same deaths, no intention of them. Plus a case I made up: Truman is credibly told the bombs will end the war, but the same report says a demonstration detonation over an empty bay would probably work too, and he picks the city because if the demonstration failed he'd be blamed for the extra months of fighting. Is that deliberating about the deaths, or only about his career, and does it matter which?

  Last thing: someone said the whole argument rests on a forecast, and since the forecast was uncertain, Anscombe should've been uncertain too. I think that's a bad argument but can't say why — what would the good version of that worry look like, and does it cut against her or against Truman?
reasoning: |-
  Okay, let me start by unpacking the user's query. They're dealing with a reading group on Anscombe's protest against Truman's honorary degree. One member keeps shutting down discussions with the line: "the deliberate killing of the innocent is never permissible." The user wants to dissect this sentence into its component claims without explaining each one, just mapping out the possible interpretations and their implications.

  First, I need to break down the key terms: "deliberate," "innocent," and the nature of the rule. The user mentioned specific scenarios like the munitions plant at night and the accidental bombing of a school. They also brought up Truman's possible motivations, where he might have chosen the city bombing to avoid blame if a demonstration failed. Plus, there's the point about the uncertainty of the forecast ending the war.

  I recall Anscombe's position is rooted in absolutist deontology. She opposed consequentialism, so her argument likely hinges on intention and moral absolutes. The user’s scenarios test different aspects of intention and innocence. For example, the munitions workers asleep—are they innocent non-combatants? What if their deaths are foreseen but not intended? The wind-blown bomb case contrasts intended versus accidental harm, which ties into the doctrine of double effect.

  The Truman case with the demonstration option is tricky. If he chose the city to save his career, does that make the deaths intended? Or are they a side effect? Anscombe would probably argue that choosing the city when an alternative exists makes the deaths deliberate. But if the alternative wasn’t certain, does that affect moral responsibility?

  Then there’s the forecast uncertainty. The user thinks dismissing Anscombe because of uncertainty is a bad argument. I need to clarify that uncertainty affects consequentialist calculations but not deontological principles. Anscombe’s point is about the act itself, not outcomes. So the uncertainty critique might weaken Truman’s justification but not Anscombe’s principle.

  I should structure the analysis by dissecting each term: "innocent," "deliberate," the rule's nature, and absoluteness. For each, identify possible interpretations, whether they’re platitudes, substantive, or question-begging, and if they support the member’s conclusion. 

  For "innocent," definitions range from non-combatant (standard in Just War) to morally blameless. The munitions workers case challenges whether contributing to war effort removes innocence. If innocence is defined as non-combatant, the workers might not be innocent, but Anscombe probably considers them so. If innocence requires moral blamelessness, that’s harder to judge and might beg the question.

  "Deliberate" involves intention. Direct intention versus foresight. The school bombing scenario shows that unintended deaths might not count as deliberate. Truman’s case: if he chose the city to avoid blame, is that intending the deaths as a means? Or accepting them as a side effect? That’s where double effect comes in. If the deaths were necessary to end the war, they might be permissible under double effect, but if there was an alternative, then choosing the city makes the deaths intended.

  The nature of the rule—act-focused versus character/community—shifts the discussion. Absoluteness is key. If the rule has exceptions, then Hiroshima might be justified under consequentialism, which Anscombe rejects. But if absolute, then no exception, regardless of outcomes.

  The forecast uncertainty: a good version would note that Truman’s decision relied on predictions. If those were uncertain, his justification is weakened. But Anscombe’s argument isn’t about outcomes; it’s about the act itself. So uncertainty challenges Truman’s rationale but not Anscombe’s principle.

  Putting it all together, the member’s statement is an absolute rule. But each component can be interpreted in ways that might not condemn Truman. For example, if "innocent" excludes munitions workers, or if the bombing’s intention was to force surrender, not kill innocents. But Anscombe likely sees the civilians as innocent and the killing as deliberate. The member’s use of the statement shuts down debate by assuming specific definitions that support their view without argument. The user wants to expose these hidden assumptions to reopen discussion.
answer: |-
  Here's the dissection of the sentence "the deliberate killing of the innocent is never permissible" into its core claims, analyzing their nature and effectiveness in condemning Truman. Your scenarios are integrated to test the boundaries.

  **I. Dissecting the Sentence: Core Claims & Analysis**

  | **Component**          | **Possible Interpretations**                                                                 | **Nature of Claim**                                                                 | **Gets Truman?**                                                                                                                                                                                               |
  | :--------------------- | :------------------------------------------------------------------------------------------ | :---------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **"the innocent"**     | **1. Non-combatant:** Not actively engaged in hostilities (standard Just War).              | **Substantive Thesis.** Deniable by those arguing total war/mass contribution = liability. | **Crucial.** If Hiroshima victims are non-combatants (debatable - see munitions plant case), they are "innocent" here. Begs question if defined circularly as "those it's wrong to kill".                       |
  |                        | **2. Morally Blameless:** Free from guilt for the aggression/war effort.                    | **Question-Begging/Substantive.** How to assess collective guilt? Highly subjective. | **Weak/Vulnerable.** Easily countered: civilians enable war effort (munitions plant), may support regime. Invites endless debate about Japanese society.                                                     |
  |                        | **3. Not Currently Attacking:** Harmlessness at the moment of killing.                      | **Platitude/Substantive.** Killing a sleeping soldier? Deniable by necessity arguments. | **Strong for Hiroshima.** Sleeping workers/children weren't attacking. But does mere contribution remove "innocence"? See your munitions plant case - key battleground.                                           |
  |                        | **4. Not Liable to Harm:** No forfeiture of right not to be killed (philosophical).         | **Substantive Thesis.** Deniable by consequentialists/those endorsing collective liability. | **Core Issue.** Assumes liability requires *personal* fault/threat. Hiroshima victims likely not liable under this view. But member *assumes* this definition without argument.                            |
  | **"deliberate"**       | **1. Intended as End/Means:** Deaths specifically aimed at (e.g., terror to force surrender). | **Platitude?/Substantive.** Absolutists see this as key. Consequentialists blur lines.      | **Strongest for Truman IF proven.** If bomb aimed *at* civilians to terrorize, clearly deliberate. But was it? Or was destruction of military capacity the aim, death the foreseen means? (See your career case). |
  |                        | **2. Merely Foreseen:** Deaths expected but not desired (Doctrine of Double Effect - DDE). | **Substantive Thesis.** Deniable by those rejecting DDE or seeing foresight as intent enough. | **Potentially Avoids?** US arguably foresaw deaths but "intended" surrender/military effect. DDE *might* permit this if proportionate. Member's line likely rejects DDE or includes foreseen as "deliberate".     |
  |                        | **3. Accepted as Side Effect:** Knowing it will happen, choosing the act anyway.            | **Substantive/Platitude.** Absolutists often equate this with intent.               | **Likely Condemns Truman.** Choosing to bomb knowing thousands die *is* "deliberate" in this broad sense. Your "wind-blown" scenario highlights the difference - *that* isn't deliberate.                       |
  |                        | **4. Risked:** Possibility accepted for significant gain.                                   | **Substantive.** Deniable by risk-absolutists.                                       | **Weak.** Hiroshima deaths were certain, not risked. Doesn't apply.                                                                                                                                          |
  | **Nature of Rule**     | **1. Act-Focused:** Moral wrongness resides solely in the act itself.                       | **Substantive Thesis (Deontology).** Deniable by consequentialists/virtue ethicists. | **Essential for member.** Condemns the bombing *act* regardless of consequences or Truman's character.                                                                                                      |
  |                        | **2. Character/Community:** Primarily about what doing this makes you/your society.         | **Substantive Thesis (Virtue Ethics).**                                             | **Potentially Avoids?** Could argue Truman was tragic figure, US flawed but redeemable. Weakens absolutist condemnation of the *act*. Member likely intends act-focused.                                       |
  | **"never permissible"**| **1. Absolute:** No exceptions, regardless of consequences.                                 | **Substantive Thesis (Absolutist Deontology).** Deniable by most consequentialists. | **Crucial.** If absolute, Hiroshima is condemned even if it saved lives. If not, proportionality/necessity matter. Member asserts absolutism without defending it.                                              |
  |                        | **2. Strong Presumption:** Overwhelmingly wrong, exceptions almost unimaginable.            | **Platitude?/Substantive.** Deniable only by nihilists.                             | **Weakens Conclusion.** Allows *possible* justification if consequences were catastrophic otherwise (Truman's claim). Member's "never" suggests absolutism.                                                  |

  **II. Applying Your Scenarios**

  1.  **Night Strike on Munitions Plant (Workers Asleep):**
      *   **"Innocent" (Non-combatant/Not Attacking):** Workers are asleep, not attacking. Likely "innocent" under this definition.
      *   **"Deliberate" (Foreseen/Accepted):** Deaths foreseen & accepted as side effect of destroying the plant.
      *   **Member's Line:** Likely condemns it as "deliberate killing of innocent" (foreseen + non-combatant).
      *   **Challenge:** Is destroying a *legitimate* military target with *foreseen* civilian deaths inherently impermissible? Tests the absolutism/DDE rejection. Member's line shuts this down by fiat.

  2.  **Wind-Blown Bomb Kills School:**
      *   **"Deliberate":** Deaths were *unintended and unforeseen* (due to wind). Not deliberate under any definition.
      *   **Member's Line:** Does *not* apply. This is tragic accident, not deliberate killing. Highlights the critical role of *intent/foresight* in "deliberate".

  3.  **Truman's Career Motive (Demonstration Option):**
      *   **"Deliberate" (Intended/Foreseen):** Deaths were *foreseen and accepted*. Choosing the city *knowing* it kills civilians for *any* reason (even career) makes it "deliberate" in the broad sense (accepted side effect).
      *   **Does Motive Matter?** For *act-focused absolutism*, the *reason* for choosing the deadly option might be irrelevant if the deaths are foreseen and the act is forbidden. Choosing the deadly option *when a non-deadly one existed* makes the deaths seem *more* deliberate/less excusable. It shifts the justification from "necessary evil" to "convenient evil". **It matters less for *act* condemnation, more for *character* condemnation.**

  **III. The Forecast Uncertainty Argument**

  *   **Bad Argument:** "The forecast was uncertain, so Anscombe should have been uncertain."
      *   **Why Bad:** It fundamentally misunderstands Anscombe's *type* of argument. She's a **deontologist** (act-focused absolutist). Her claim isn't primarily about the *consequences* (which forecasts predict), but about the *inherent nature of the act* (deliberately killing innocents). For her, the act is intrinsically wrong *regardless* of outcomes. Uncertainty about consequences might weaken a *consequentialist justification* for the bombing, but it doesn't touch a deontological condemnation *of the act itself*. The uncertainty is irrelevant to her core principle.
  *   **Good Version of the Worry (Cuts Against TRUMAN):**
      *   **Targets Truman's Justification:** Truman's decision was *consequentialist* – he claimed the bomb was necessary to end the war quickly and save lives (American/Japanese). If the forecasts (about bomb effectiveness, invasion casualties, Japanese surrender likelihood, demonstration viability) were highly uncertain, then **Truman's consequentialist justification is severely weakened.** He took a *gamble* with catastrophic certain costs (100,000s dead) for uncertain benefits. This makes his decision look reckless or based on flawed/incomplete information, undermining *his stated reason* for the act. It doesn't make the act *inherently* wrong for a deontologist like Anscombe, but it removes the primary *justification* offered for it.
      *   **Doesn't Cut Against Anscombe:** Her argument stands independently: even *if* the forecasts were certain and the bomb saved millions, *she believes* deliberately killing innocents is still intrinsically impermissible. Uncertainty doesn't affect her core moral principle; it only exposes weaknesses in the *opposing* justification.

  **Conclusion:** The member's line is a loaded assertion masquerading as a simple truth. It smuggles in:
  1.  A specific definition of "innocent" (likely non-combatant).
  2.  A broad definition of "deliberate" (likely including foreseen/accepted deaths).
  3.  An act-focused, absolutist interpretation of the rule.
  It **only "gets" Truman** if all these specific, substantive, and highly contested interpretations are accepted *and* the Hiroshima victims are classified as "innocent" *and* the bombing is classified as "deliberate" killing under that definition. Your scenarios show how easily these definitions unravel under scrutiny. The line shuts down debate by presenting a complex, controversial ethical position as an uncontestable axiom. The forecast uncertainty critique is valid against *Truman's consequentialism* but irrelevant to *Anscombe's deontology*.
