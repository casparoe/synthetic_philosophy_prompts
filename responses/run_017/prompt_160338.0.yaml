answer: |-
  ### The Calibration Defense of Heterophenomenology

  Heterophenomenology’s core methodological virtue—neutrality toward subjective reports—is often misconstrued as a philosophical stance on the unreality of consciousness. This misstep invites unnecessary controversy. Instead, we should reinterpret neutrality as a *calibration protocol* for treating verbal reports as a finite-resolution instrument. Just as a microscope’s diffraction limit defines the smallest observable detail without denying finer structures exist, the report channel has inherent thresholds beyond which it cannot reliably resolve differences in experience. This recalibration salvages the method from key objections while preserving its scientific rigor.  

  Consider the "shyness" problem: stable neural or functional differences that fail to manifest in any report—spontaneous, prompted, or probed via confidence ratings—creating local underdetermination between "experiential difference" and "no experiential signature." Under the traditional reading of heterophenomenology, such cases force neutrality toward both hypotheses, implying the science cannot adjudicate them. But this conflates *epistemic caution* with *ontological dismissal*. The calibration norm reframes the issue: shyness reveals the report channel’s resolution limit, not an absence of phenomenality. We do not declare subatomic vacuums when optics fail to image atoms; we state the instrument’s bounds and design better tools. Similarly, a shy difference is not evidence for eliminativism but an opportunity to map the reportability threshold itself—perhaps through cross-validating neural correlates or developing new behavioral assays.  

  This recalibration resolves three persistent tensions. First, it secures neutrality without begging questions against realism. The scientist does not deny unreportable experiences; she refuses to treat an uncalibrated instrument (verbal report) as evidence for phenomena it cannot detect. Neutrality becomes a demand for error bars, not a denial of territory. Second, it answers shyness without collapse into eliminativism. A resolution limit implies gradients, not binaries: just as faint stars visible in some telescopes are absent in others, reportability varies by task design, attention, and training. The method thus mandates characterizing these limits—e.g., quantifying how attentional load modulates report fidelity—rather than declaring unreported differences nonexistent. Third, it demystifies the investigator’s role. Yes, the experimenter uses her own introspective lexicon to interpret subjects’ reports, and her self-reports escape third-person scrutiny. But this is no regress: like any instrument, the researcher is calibrated inter-subjectively. Cross-lab replication, consensus on report-coding schemes, and algorithmic parsing of verbal data (e.g., NLP tools) act as calibration checks. The experimenter is part of a communal instrument, validated by collective practice.  

  The strongest unaddressed objection is this: calibration assumes reportability thresholds *can* be mapped, but if consciousness is fundamentally private, such thresholds might be intrinsically unquantifiable. We cannot "peer behind" the report to verify unreportable experiences, even indirectly. This threatens to reduce calibration to a promissory note. While I reject its fatalism—neural and behavioral proxies *have* resolved "unreportable" states (e.g., priming effects in blindsight)—it underscores that heterophenomenology cannot escape all metaphysical commitments. Its revised neutrality still presupposes consciousness leaves *some* trace accessible to third-person tools. Where none exists, science remains silent—but so would any method.

