     - *Intervention*: **Expose fabrication and target trust repair** (e.g., debunking specific falsehoods).  

  8. **Selective Distrust** (established)  
     - *Description*: Members dismiss only *disagreeing* external sources due to confirmation bias (e.g., partisans ignoring opposing news).  
     - *Intervention*: **Repair trust in specific sources** (e.g., balanced exposure).  

  9. **Propaganda Regime** (established)  
