     - *Intervention*: **Expose fabrication and repair trust** (e.g., fact-checking, whistleblowing).  

  6. **Generalized Outgroup Distrust** (established)  
     - *Description*: Members dismiss *all* external sources due to ingrained biases (e.g., xenophobic communities). Information is present but universally discounted.  
     - *Intervention*: **Repair trust in outside sources** (e.g., cross-group dialogue).  

