  ### Leaf Descriptions  
  *Each leaf includes: (1) a label (established/proposed), (2) a brief description, (3) intervention notes, and (4) unnamed status (if applicable).*  

  1. **Deferential Epistemology** (unnamed)  
     - *Description*: The community systematically discounts its own members and defers to external authorities, losing access to local knowledge (e.g., indigenous groups overridden by colonial science).  
     - *Intervention*: **Rebuild internal testimonial confidence** (e.g., validating local expertise).  
     - *Unnamed reason*: Underexplored in literature; lacks a settled term despite being a mirror image of epistemic closure.  

  2. **Selective Exposure** (established)  
     - *Description*: Members actively avoid external information due to preferences (e.g., echo chambers in social media). External material is absent because it is not sought.  
     - *Intervention*: **Supply missing content** (e.g., algorithmic diversification).  

  3. **Information Blockade** (established)  
     - *Description*: External information is physically absent due to constraints members did not choose (e.g., censorship, geographic isolation).  
     - *Intervention*: **Circumvent barriers** (e.g., VPNs, satellite internet).  

  4. **Warranted Distrust** (established)  
     - *Description*: External sources are discounted due to justified reasons (e.g., proven bias or corruption), making closure rational.  
     - *Intervention*: **Improve external sources** (remedy outside taxonomy; e.g., holding media accountable).  

