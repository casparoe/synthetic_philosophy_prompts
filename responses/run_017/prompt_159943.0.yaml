  Below is a taxonomy structured as a branching tree with 10 leaves, designed to classify ways a community becomes systematically cut off from information. The tree is built from logical splits at each branch node, with questions phrased to be answerable about concrete cases without specialized vocabulary. Established terms are used where they exist; unnamed combinations are marked with reasons. The taxonomy prioritizes distinctions relevant to interventions (e.g., remedies like supplying content or repairing trust). Two specified cases (a community manufacturing its own evidence, and a community deferring excessively to outsiders) are included as leaves with proposed names.

