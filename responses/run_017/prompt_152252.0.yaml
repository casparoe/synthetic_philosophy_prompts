prompt: |-
  I've been working through a semi-popular overview of Bayesian confirmation theory — one of those short, confident books that compress a whole literature into a chapter — and it gives an account of the problem of old evidence that I neither fully trust nor know how to fault. Before I build anything on it, I'd like an accuracy audit. I should say up front that I have no library or database access where I am, so please argue the points out rather than telling me whom to read: I can't chase references.

  The passage is this (copied out, slightly compressed, but otherwise as it stands):

  "Bayesian confirmation theory says that evidence E confirms hypothesis H just in case P(H|E) exceeds P(H): the evidence raises the probability of the hypothesis. It also says that learning E is always to be modeled as conditionalization on E. Put those together and you get the problem of old evidence. Conditionalizing on something you already fully believe cannot change your credences at all — if P(E) = 1, then P(H|E) = P(H) — so it cannot raise your confidence in H. Yet scientists constantly cite evidence that everyone had already accepted: the anomalous advance of Mercury's perihelion had been on the books for half a century before general relativity predicted it, and it is still counted among the theory's strongest supports. Bayesianism is thus forced to say that evidence which is already certain confirms nothing, which is absurd. The standard repair, proposed in the 1980s, is to conditionalize not on E but on the newly learned fact that H has E as a consequence. You keep your credence in E at 1, but you are not certain in advance that H entails E, so you assign the implication H ⊃ E a probability short of 1, and conditionalizing on that implication raises the probability of H. The repair works. Its moral is that the problem of old evidence is really just the problem of logical omniscience in miniature: Bayesian agents are assumed to know everything that follows from what they believe, and once you drop that assumption the paradox evaporates. A second moral follows for the partisan debate. The problem afflicts only subjective Bayesians, who model the actual opinions of an actual person. Objective Bayesians, who fix their priors by symmetry and maximum-entropy constraints rather than by consulting anyone's opinion, are immune, because whatever evidence there is has already been priced into the prior at exactly the value it ought to have."

  What I want, claim by claim, is what a careful Bayesian would accept, what they would call an allowable simplification, and what they would reject — and then, separately, whether either of the two closing "morals" follows from the parts that survive. Begin with the first sentence: is the positive-relevance criterion, offered there as the definition of confirmation, one a defender would endorse, and does anything later in the argument actually depend on which measure of confirmation you choose?

  Four things I am stuck on.

  First, the repair. When I try to execute it on paper I get stuck at once. If E has probability 1 for me, and H ⊃ E is the material conditional ¬H ∨ E, then the probability calculus seems to force P(H ⊃ E) = 1 as well, since the conditional is entailed by E alone; in which case "learning" it changes nothing and the repair is empty. The only way I can see to get the repair off the ground is to let the agent be probabilistically incoherent — to assign E probability 1 while assigning the material conditional something less — but then the agent is not a probability function, and it is obscure to me what "conditionalizing" is even supposed to mean. So: is the passage skipping a step, or have I misdescribed the move? And if the move genuinely requires a non-standard updating rule for a logically non-omniscient agent, does that alter what sort of solution it is and what it can be credited with?

  Second, the identification of the problem of old evidence with the problem of logical omniscience. That strikes me as too quick, and here is the case that makes me think so. I already know for certain that the pavement outside is wet — I looked. Someone now proposes a new hypothesis: it rained overnight. That hypothesis does not entail wet pavement (a street-cleaner or a burst main would do), but it makes wetness more likely, and I already knew that too, long before the hypothesis was proposed. (a) Does the wet pavement confirm the hypothesis that it rained? Intuitively yes, and P(rain | wet) > P(rain) looks like exactly the judgment confirmation theory exists to vindicate. (b) Is this an instance of the problem of old evidence? It seems to be, twice over: conditionalizing on wetness is a no-op, and I think the Bayes factor collapses as well, since P(wet) = 1 forces P(wet | X) = 1 for anything X to which I give positive probability, so the likelihood ratio P(wet | rain) / P(wet | ¬rain) equals 1. (c) But nothing in the case turns on logical omniscience. There is no unrecognized entailment for me to discover, and a repair that works by conditionalizing on H ⊃ E has no foothold, because rain does not entail wet pavement. So is the passage's first moral simply mistaken, or does my case stop counting as a problem of old evidence once the problem is correctly formulated? And if I have the collapse of the likelihood ratio right, is that a second and independent version of the difficulty rather than a restatement of the first?

  Third, the claim about objective Bayesians. I cannot tell whether "already priced into the prior at exactly the value it ought to have" describes a solution or restates the problem. If the prior already reflects E completely, then there is apparently no work left for E to do as evidence, which is the difficulty rather than a way around it; and since maximum-entropy priors are standardly fixed by constraints supplied by the evidence, the objective Bayesian looks like someone guaranteed to be in the P(E) = 1 situation. Is there any version of objective Bayesianism for which the passage's claim is true, or is it backwards?

  Fourth, my own attempt at a diagnosis, which I would like tested rather than encouraged. It seems to me that what is genuinely new when a hypothesis is first proposed is often not a proposition but a hypothesis space: before anyone thought of H my credences were spread over {H₁, …, Hₙ}, afterwards they range over {H₁, …, Hₙ, H}, and nothing in my old credence function determines how much of the enlarged space H is owed, or how the old evidence is to be redistributed across it. On this view the problem of old evidence is not about old evidence at all; it is the problem of the priors for new hypotheses in disguise, and it survives every repair that stays inside a fixed space. Three things to check. (i) Does it handle the wet-pavement case, where no entailment is discovered and no likelihood changes? (ii) Is it a real proposal, or a redescription that merely relocates the freedom — the freedom to fix a prior over an enlarged space — from where the problem was to somewhere less visible? (iii) Does it make confirmation objectionably historical, so that whether E confirms H for me can turn on when someone happened to think of H, or on which rivals happened to be on the table? I suspect (iii) is the deepest objection, and I would like it stated in its strongest form together with the best available reply.

  One methodological question underneath all of this, which you may prefer to answer first. The whole tangle may be a conflation of two questions: the synchronic one, whether E is evidence for H relative to what I now believe, and the diachronic one, whether my coming to accept H can be modeled as a sequence of Bayesian updates. Bayesianism may have a good answer to the first and a gap in its answer to the second. If so, does that dissolve the problem of old evidence or merely relocate it — and is the dissolution available to someone who thinks the point of confirmation theory is to guide inquiry rather than to grade finished bodies of belief?

  Please organize the reply so that it moves through the passage's sentences first, then through my four questions in order, and flag anywhere the passage and I are making the same mistake.
reasoning: |-
  Alright, let me tackle this user's query step by step. They've shared a passage from a book on Bayesian confirmation theory and have four main concerns about it, plus a deeper methodological question. The user is clearly well-versed in philosophy of science and Bayesian epistemology but lacks access to references, so I need to provide self-contained arguments.

  First, the passage claims Bayesian confirmation is defined as P(H|E) > P(H), which is the standard positive relevance criterion. I recall this is widely accepted, though debates exist about alternative measures like the likelihood ratio. But the core argument here doesn't hinge on that choice - the old evidence problem arises regardless. 

  The user's first sticking point is about the proposed "repair" for old evidence. The passage suggests conditionalizing on H⊃E instead of E itself. But if the agent already knows E (P(E)=1), probability theory forces P(H⊃E)=1 too, making the update inert. The user is right to spot this - the repair requires either logical ignorance or non-probabilistic representations. Some solutions propose modeling the discovery of logical relations, but this moves beyond standard Bayesianism. The passage oversimplifies by not mentioning these complications.

  Next, the user's wet pavement counterexample. This is clever - it shows old evidence confirming a hypothesis without entailment, challenging the passage's claim that the problem reduces to logical omniscience. Here, the likelihood ratio indeed collapses to 1 if P(E)=1, creating a parallel problem. This suggests at least two distinct issues: the entailment-based version (like Mercury's perihelion) and the probabilistic relevance version (like wet pavement). The passage wrongly collapses them.

  Then there's the claim about objective Bayesians being immune. This seems backwards - if objective priors incorporate all known evidence by design (e.g., via maxent constraints), then P(E)=1 by construction, making the problem worse, not better. The passage might confuse "pricing in" evidence (which causes the problem) with having a solution.

  The user's own diagnosis about hypothesis spaces is insightful. Introducing new hypotheses does create a prior-setting problem distinct from updating on old evidence. Their worry about historicity is serious - if confirmation depends on when hypotheses are formulated, it clashes with the ideal of objective evidential relations. I think this points to a fundamental limitation of strictly Bayesian approaches to scientific discovery.

  Underneath it all, the synchronic/diachronic distinction is crucial. Bayesianism handles "does E support H given current beliefs?" well (synchronic), but struggles with "how should I update when learning H itself?" (diachronic). The user is right that this reframes rather than solves the problem, especially for those wanting guidance for inquiry.

  The passage gets several things wrong: oversimplifying the repair, overgeneralizing to all old evidence cases, and misdiagnosing the objective Bayesian situation. The user's analysis is largely correct and deeper than the textbook's. Their hypothesis space point deserves serious consideration despite the historicity concern - perhaps as a necessary compromise for modeling real scientific practice.
answer: |-
  Below is a claim-by-claim audit of the passage, followed by responses to your four questions. I'll flag simplifications, rejections, and where your analysis aligns with or improves on the text. Bayesian confirmation theorists would classify elements as follows:

  ### Audit of the Passage
  1. **"Bayesian confirmation theory says that evidence E confirms hypothesis H just in case P(H|E) > P(H)"**  
     - **Endorsed**: This "positive relevance" definition is standard.  
     - **Simplification**: Some Bayesians prefer likelihood-ratio measures (e.g., P(E|H)/P(E|¬H) > 1), but the core problem persists regardless of the measure. The argument does not depend on the choice.  

  2. **"Learning E is always modeled as conditionalization on E"**  
     - **Endorsed**: Standard diachronic Bayesianism.  
     - **Simplification**: Jeffrey conditionalization handles uncertain evidence, but the old-evidence problem arises when P(E) ≈ 1.  

  3. **"If P(E) = 1, then P(H|E) = P(H)"**  
     - **Endorsed**: Mathematically true for probabilistic coherence.  

  4. **"The anomalous advance of Mercury's perihelion [...] is still counted among [GR's] strongest supports"**  
     - **Endorsed**: Historical fact; a canonical example.  

  5. **"The standard repair is to conditionalize not on E but on the newly learned fact that H entails E"**  
     - **Allowable simplification**: A common proposal (e.g., Garber 1983), but **incomplete**. The passage glosses over a critical technical flaw you identified: if P(E)=1, coherence forces P(H ⊃ E)=1. The repair requires either:  
       - (a) Modeling the agent as *uncertain* about the logical implication itself (not just E), violating logical omniscience.  
       - (b) Using a non-material conditional (e.g., "H □→ E") or logical learning framework.  
     - **Rejection**: The passage presents this as straightforward, but it demands non-standard tools (e.g., "impossible possible worlds," logical ignorance models).  

  6. **"The problem of old evidence is really just logical omniscience in miniature"**  
     - **Partial rejection**: True *only* for entailment-based cases (e.g., Mercury). **False** for non-entailment cases (e.g., your wet-pavement example). The passage overgeneralizes.  

  7. **"Objective Bayesians [...] are immune"**  
     - **Rejection**: Incorrect. MaxEnt/symmetry priors *fix P(E)=1* if E is known, replicating the problem. Objective Bayesians face the same synchronic issue: if E is "priced in," P(H|E) = P(H).  

  8. **"The problem afflicts only subjective Bayesians"**  
     - **Rejection**: See above. Both variants struggle when P(E)=1.  

  ### Responses to Your Four Questions  
  **1. The Repair's Technical Flaw**  
     - You are correct: probabilistic coherence forces P(H ⊃ E) = 1 if P(E) = 1. The repair requires either:  
       - **Logical non-omniscience**: The agent doesn't recognize that E entails H ⊃ E.  
       - **Non-probabilistic representation**: E.g., separating "logical certainty" from "epistemic certainty."  
     - This alters the solution: It shifts the problem to modeling *logical learning* (e.g., updating on "I now see that H entails E"). This is not standard conditionalization and demands richer frameworks (e.g., Bayesian networks with logical ignorance). The passage oversimplifies by ignoring coherence constraints.  

  **2. Your Wet-Pavement Case & Logical Omniscience**  
     - (a) **Confirmation?** Yes, intuitively. P(rain | wet) > P(rain) *should* hold.  
     - (b) **Old evidence?** Yes: P(wet) = 1 forces P(wet | rain)/P(wet | ¬rain) = 1, so the likelihood ratio cannot confirm.  
     - (c) **Logical omniscience irrelevant?** Correct. This is a distinct **probabilistic relevance variant** of old evidence.  
     - **Conclusion**: The passage is mistaken. "Old evidence" covers two problems:  
       - **Entailment-based**: (e.g., Mercury) tied to logical omniscience.  
       - **Probabilistic**: (e.g., wet pavement) where P(E)=1 collapses likelihood ratios.  
     - Both are serious, but only the first is "solved" by the entailment repair.  

  **3. Objective Bayesianism Claim**  
     - The passage is **backwards**. Objective Bayesians (OB) fix priors using evidence constraints (e.g., P(E) = 1). Thus:  
       - OBs face the *same* synchronic problem: P(H|E) = P(H) if P(E) = 1.  
       - MaxEnt priors *encode* E as certain, leaving no "updating" role.  
     - **No version of OB escapes this**. The passage confuses "pricing in" (which causes the problem) with a solution.  

  **4. Your Hypothesis-Space Diagnosis**  
     - (i) **Handles wet pavement?** Yes. Introducing "rain" as a new hypothesis redistributes probability. Prior P(rain) must be set *after* learning wetness, avoiding P(wet) = 1 in the *new* space.  
     - (ii) **Real proposal or relocation?** It's both:  
       - **Real**: Expanding the hypothesis space is a recognized solution (e.g., "new conceptual resources" in Glymour 1980).  
       - **Relocation**: It moves the freedom to prior assignment over new hypotheses. This is unavoidable but highlights that the problem stems from Bayesianism's static framework.  
     - (iii) **Historicity objection**:  
       - **Strongest form**: Confirmation becomes path-dependent. If you introduce "rain" *after* seeing wetness, P(rain|wet) > P(rain) might hold; if introduced *before*, it might not. This violates the intuition that evidential relations are timeless.  
       - **Reply**: Bayesians can bite the bullet: confirmation *is* agent-relative and dynamic. The alternative is to deny that old evidence confirms (counterintuitive) or adopt non-Bayesian measures.  

  ### Underlying Methodological Point  
  - **Synchronic vs. Diachronic**:  
    - **Synchronic**: "Does E confirm H *given current beliefs*?" Bayesians handle this well (e.g., P(H|E) > P(H) relative to a background model).  
    - **Diachronic**: "How does *learning H* change beliefs?" This is where old evidence bites.  
  - **Dissolution or Relocation?**  
    - For guiding inquiry, the synchronic question suffices: "Given all data (including old E), does H merit investigation?" The diachronic problem arises only if we insist on modeling hypothesis generation as "updating."  
    - **Verdict**: It *relocates* the problem. Those seeking a dynamic theory of discovery must augment Bayesianism (e.g., with hypothesis-space expansion).  

  ### Where You and the Passage Share Mistakes  
  - **Logical omniscience as the core issue**: Both overlook the probabilistic relevance variant (wet pavement).  
  - **Objective Bayesian immunity**: Both misdiagnose (you note the tension, the passage asserts immunity).  
  - **Repair simplicity**: The passage ignores technical flaws; your query initially missed that logical ignorance *requires* non-coherent representations.  

  ### Key Takeaways  
  1. The passage correctly identifies the entailment-based old evidence problem but overgeneralizes.  
  2. Your wet-pavement case exposes a second, independent problem.  
  3. The entailment "repair" works only with non-trivial modifications (logical ignorance models).  
  4. Objective Bayesians are not immune.  
  5. Hypothesis-space expansion resolves many cases but introduces historicity.  
  6. The synchronic/diachronic split reframes but does not dissolve the issue for dynamic confirmation.  

  This is a careful Bayesian's verdict: the passage is half-right on specifics but wrong on scope and implications. Your analysis improves on it significantly.
