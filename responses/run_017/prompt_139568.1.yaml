prompt: |-
  Write a short story, dialogue-heavy is fine, about a committee deciding whether to add a new diagnosis to the next edition of the psychiatric manual. The proposed category is "volitional attenuation disorder": people who, after a year or more of delegating everyday decisions to AI assistants, report that their sense of having chosen something has gone thin, they still act fine, but actions stop feeling like they originated with them. Nobody on the committee can tell whether this is a genuine new condition, a rebranding of something much older, or just what everyone feels now.

  The story should show the feedback loop in action: once the label leaks, patients start using it to organise vague discomfort, an online community forms with its own vocabulary and its own unwritten rules about which experiences count as real symptoms, clinicians start recognising it faster and more confidently, and the rising diagnosis rate then gets cited back as evidence the condition was there all along. Have one character argue that this loop is exactly the reason to reject the category, and another argue that looping is just how human kinds work and disqualifies nothing. Maybe a third who doesn't care about any of that and just wants people to get accommodations covered.

  Don't tie it up with a tidy moral. I want the reader left with the vertigo of not being able to tell whether the diagnosis found the thing or made it.
reasoning: |-
  Okay, the user wants a short story about a committee debating a new psychiatric diagnosis called "volitional attenuation disorder." The core idea is fascinating: people who've delegated decisions to AI for over a year feel like their actions aren't truly their own anymore. 

  Hmm, the challenge is nailing that unsettling ambiguity—is this a real condition or a cultural artifact? The feedback loop aspect is crucial: how the label itself reshapes people's experiences once it exists. I should show the committee members embodying different philosophical positions without preaching. 

  Dr. Vance makes sense as the skeptic, paranoid about diagnostic fashion. Dr. Rao can represent the pragmatic view—labels as tools regardless of origin. And Dr. Chen, yes, the accommodations advocate who sidesteps the debate entirely. Their names should feel globally neutral. 

  The setting should feel sterile but charged—fluorescent lights, lukewarm coffee—to contrast with the high-stakes debate. Opening with the leaked slide immediately drops us into the tension. 

  Key scenes: 
  The initial debate where Vance mocks "algorithmic learned helplessness." 
  Rao's "human kinds" counterargument about all diagnoses being socially constructed. 
  Chen cutting through with insurance realities. 
  The midpoint where they learn the label went viral. 
  The eerie moment when Vance hesitates on diagnosing his own patient. 

  For the ending, Vance's private crisis is perfect—his hesitation to diagnose becomes a meta-symptom. That last line about the "thin" feeling lingering... chills. It leaves the vertigo the user wanted. 

  Must avoid: 
  - Making any character "right." 
  - Resolving the philosophical debate. 
  - Over-explaining the disorder. The ambiguity is the point. 

  The coffee stain on the slide feels like a nice touch—mundane messiness intruding on clinical abstraction. And Vance checking his own sense of agency? Chef's kiss. That's the vertigo.
answer: |-
  The fluorescent lights hummed above the polished mahogany table of the DSM Revision Subcommittee on Emerging Syndromes. Dr. Aris Vance, lean and perpetually skeptical, tapped his pen against a printout titled *Volitional Attenuation Disorder (Proposed)*.

  "So," he began, voice dry, "we have a cohort reporting... what? A persistent sense that their choices aren't *really* theirs? After outsourcing life admin to silicon for a year-plus? They still pay bills on time, hold jobs, don't meet criteria for depersonalization or depression... they just feel like passengers?"

  Dr. Priya Rao, her tablet glowing, nodded. "Essentially. The metaphor they consistently use is 'thinness.' Like the feeling of *choosing* has gone thin, translucent. Actions happen, competently, but the origin point feels... externalized. Or absent."

  Dr. Liam Chen, pragmatic and tired, scanned the insurance implications summary. "Self-reports are climbing. Clinicians are starting to see it. People are struggling, Aris. They feel detached from their own lives. Isn't that distress enough?"

  Vance scoffed. "Distress? Or a perfectly understandable consequence of offloading cognitive load? We habituate! Driving a car feels less 'volitional' than walking once you're proficient. Is that a *disorder*? This feels like rebranding existential ennui, or maybe a very mild, very modern form of dissociation. Or," he leaned forward, "it's just *what life feels like now*. Algorithmic learned helplessness."

  Rao countered, her tone measured. "The specificity is compelling, Aris. The *precipitant* – prolonged, habitual AI delegation for mundane decisions. The *qualia* – this specific 'thinness' of volition, distinct from apathy or lack of motivation. They *act*, they just don't *feel* the authorship. It resonates."

  Chen cut in. "Resonates is key. That online forum, 'Thinning Choices'? It didn't exist six months ago. Now it has 50,000 members. They have their own lingo: 'ghost-choosing,' 'auto-pilot creep,' 'decision residue.' They're *validating* each other's experiences against this leaked draft criteria." He tapped his screen. "Clinicians *are* diagnosing it faster. Because the patients come in *using the term*."

  "Exactly!" Vance slammed his hand lightly on the table. "The feedback loop! We float a label – even unofficially, even *here* – it leaks. People with vague dissatisfaction seize it. They form communities, refine the symptoms, share 'aha' moments. Clinicians, seeing this surge, start applying the label more readily. Then *boom*, the rising diagnosis rate becomes cited as proof the disorder *was always there*, just unseen! It’s diagnostic iatrogenesis! We're *creating* the thing we're trying to describe!"

  Rao remained calm. "Aris, name one psychiatric category that *didn't* emerge from a similar loop. Depression? Anxiety? Their presentations shift with culture, language, available frameworks. 'Human kinds' *are* looping kinds. We label clusters of distress and dysfunction. The label organizes experience, which refines the label. That doesn't make the suffering less real, or the category invalid. It just makes it... human."

  Chen sighed. "I don't care if it's ancient philosophy wrapped in a neural net or brand new. People are suffering a specific, reported distress linked to a modern behavior pattern. They need therapy strategies, workplace accommodations – maybe 'AI decision fasting' protocols, structured choice-reclamation exercises. Insurance won't cover 'feeling a bit thin' without a code. We need a box to check."

  The debate cycled: Vance’s fear of reification, Rao’s pragmatic constructivism, Chen’s bureaucratic necessity. Weeks passed. Outside the committee room, "Volitional Attenuation" went viral. News segments asked, "Is Your AI Stealing Your Will?" Memes depicted hollow-eyed office workers captioned "Me choosing between almond or oat milk (I feel nothing)." Therapists reported patients arriving with printed forum posts detailing their "attenuation."

  The committee reconvened. The leaked draft criteria had become a self-fulfilling prophecy. Prevalence estimates, once speculative, now showed a sharp upward curve. Chen presented data on improved patient outcomes when therapy targeted "volitional rebuilding" under the *provisional* label.

  "The loop is closed," Vance murmured, staring at the updated graphs. "It exists because we named it. It’s spreading because we named it."

  "And people are getting help *because* we named it," Rao countered. "Does the origin story negate the relief?"

  Chen pushed a revised diagnostic code proposal across the table. "The accommodations board meets next week. They need a code."

  ***

  Months later, "Volitional Attenuation Disorder" appeared in the DSM-6 appendix as a "Condition for Further Study." Officially provisional, unofficially everywhere.

  Dr. Vance sat in his own office, reviewing a file. A young man described feeling "hollowed out" after two years of letting his AI assistant manage his schedule, finances, even suggesting social replies. "It's like I'm watching my life through thick glass," the patient said. "I do things, but the 'me' part is... thin."

  Vance knew the criteria cold. Precipitant: check. Core symptom: check. Duration: check. Distress: evident. He hesitated, pen hovering over the diagnosis line. Was this VAD? Was it modern malaise amplified by a catchy label? Was this patient unconsciously performing the symptoms he’d read about online? Or had the label finally given voice to something genuinely new, a fracture in agency forged by algorithmic symbiosis?

  He thought of Rao: *Human kinds are looping kinds.* He thought of Chen: *They need the code.*

  He wrote "309.89 (Provisional: Volitional Attenuation Disorder)" on the form, the letters stark and definite. A necessary box checked. As he filed the paper, a familiar, unsettling feeling washed over him – a slight detachment, a questioning of his own choice in that moment. Had he *decided* to diagnose, or had the category, the expectation, the looping system itself, chosen for him? The feeling was thin, almost imperceptible, but undeniably *there*. He reached for his coffee, the movement automatic, and wondered.
