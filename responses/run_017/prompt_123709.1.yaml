  Their suspicion is that this exposes a flaw in internalism: either it leads to absurd claims (e.g., that you can reason yourself into grief), or it collapses into externalism (where reasons are about emotional "fittingness"). They also wonder if idealization—a common internalist move for actions—backfires spectacularly for emotions. 

