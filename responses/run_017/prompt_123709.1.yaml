  - A week-by-week plan tackling objections head-on (especially the "reasons-for-emotions-are-just-fittingness" rebuttal) 
  - Possible conclusions and failure conditions 

  Key challenges: 
  - Avoiding scope creep (it's only 8–10k words!) 
  - Preempting the "fittingness" objection without getting derailed 
  - Explaining why alternatives (e.g., using beliefs instead of emotions) won't work 

  Their tone is brisk but thoughtful ("Ta" at the end feels very British-academic). They're clearly deep in the weeds—phrasing like "the route has no obvious home" suggests they've wrestled with this for a while. The urgency ("in a couple of weeks") means the plan must be actionable, not theoretical. 

  Structure I'll use: 
  1. **Question**: Hammer home the action/emotion asymmetry for internalism. 
  2. **Why unsettled**: Show how both sides awkwardly sidestep emotions. 
  3. **Approach**: Three phases—diagnose the action-emotion gap, test internalism's solutions, pressure externalism. Weekly breakdown to prove feasibility. 
  4. **Objection handling**: Bite the "fittingness" bullet early—argue that even if reasons= fittingness, internalism must still explain *why* fittingness matters to agents. 
  5. **Risks**: Highlight the "idealization trap" and word-count pitfalls. 

  Biggest fear: The chapter could "fail" by being too narrow (just rehashing fittingness) or too broad (drowning in moral psychology tangents). Need to keep it focused on *reasons* specifically. 

  Final note: Their aside about "idealised route into an emotion doesn't look like anything at all" is gold—that's the hook. The plan should make that intuition the engine of the argument.
answer: |-
  Here’s a structured chapter plan addressing your core concerns, written in British English and tailored to the 8–10k scope. It pre-empts key objections and clarifies the stakes.

  ### Chapter Plan: *Reasons for Emotion and the Internalism/Externalism Impasse*

  #### **Core Question**  
  Can internalism about normative reasons—the view that a reason for an agent must be capable of motivating them via sound deliberation from their existing subjective motivations—account for reason-claims about emotions (e.g., "You have reason to be less resentful"), or does it collapse into absurdity or externalism when applied beyond action?

  #### **Why Existing Positions Leave This Open**  
  The internalism/externalism debate fixates on *action* as the output of practical reasoning. Internalists (e.g., Williams, Smith) argue reasons must be "followable" via a deliberative route anchored in the agent’s subjective motivational set (SMS). Externalists (e.g., Parfit, Scanlon) treat reasons as objective, independent of motivation. Both sides assume the "grip" requirement applies to *choices*, where deliberation’s role is intuitive. Emotions, however:  
  - Are not directly produced by deliberation (e.g., you cannot reason yourself into grief).  
  - Are frequently subject to reason-claims ("You ought to feel ashamed") without an obvious "route" from the SMS.  
  Existing frameworks either ignore emotions or assimilate them to actions/beliefs by stealth, leaving the challenge unaddressed.  

  #### **Approach (Weekly Breakdown)**  
  **Weeks 1–2: Diagnosing the Gap**  
  - *Task*: Analyse paradigmatic internalist/externalist arguments (Williams’ "internal reasons"; Scanlon’s "reasons fundamentalism"), showing their reliance on action-based cases.  
  - *Why this approach?* To establish that emotions are not merely overlooked but *structurally anomalous*: they lack a clear "deliberative route" yet are central to moral criticism. Rejecting alternatives here:  
    - *Reasons for belief*: Beliefs respond to evidence via reasoning, but emotions (e.g., grief) aren’t evidence-responsive in the same way.  
    - *Fittingness-first*: Prematurely reduces reasons to evaluative norms, sidestepping internalism’s motivational requirement.  

  **Weeks 3–5: Testing Internalism’s Resources**  
  - *Task*: Pressure internalist strategies for handling emotions:  
    - (a) *Idealisation*: Does positing an "ideally rational agent" who would feel the emotion (e.g., Smith) resolve the "route" problem? Argue that it doesn’t: an idealised route to *feeling* (vs. acting) is vacuous—what would it mean to "deliberate towards" anger?  
    - (b) *Indirect routes*: Can emotions be motivated by deliberating towards *actions* (e.g., "reason to cultivate anger")? Show this misdescribes direct reason-claims (e.g., "You ought to *be* angrier," not just "act on anger").  
  - *Why not fittingness?* To avoid conceding externalism by fiat. Even if reasons entail fittingness, internalism must explain *why* fittingness should motivate.  

  **Weeks 6–8: Externalism’s Advantages and Hidden Costs**  
  - *Task*: Assess if externalism better handles emotional reasons (e.g., reasons-as-fittingness). Then, argue that this:  
    - (a) Exposes internalism’s instability: If internalists quietly adopt fittingness for emotions, their "grip" requirement loses its *raison d’être*.  
    - (b) Raises a *new* problem: Can externalism explain why we hold agents responsible for emotions *as if* they were subject to reason’s "grip"?  

  #### **Possible Conclusions**  
  1. **Internalism restricts reasons to actions/beliefs** (denying genuine reasons for emotions).  
     - *Deciding factor*: If emotional reason-claims are irreducible to action/belief.  
  2. **Internalism collapses into externalism for emotions** (exposing the "grip" requirement as superfluous).  
     - *Deciding factor*: If no coherent deliberative route to emotions can be formulated.  
  3. **A revised internalism** (e.g., emotions are "tracked" not produced by deliberation).  
     - *Deciding factor*: If this preserves internalism’s core without ad hoc moves.  

  #### **Handling the Fittingness Objection Head-On**  
  The chapter explicitly confronts the claim that "reason-claims about emotions are just fittingness claims" by:  
  - Arguing that fittingness does not resolve internalism’s problem: Internalists must still explain *why* fittingness *should engage the agent* if it’s detached from their SMS. If fittingness *necessarily* motivates (or ought to), internalism concedes ground to externalism.  
  - Testing if "fittingness" can be internalised: Can fittingness judgments be integrated into the SMS without losing objectivity? If not, the externalist challenge stands.  

  #### **Risks: Scope and Failure Conditions**  
  - **Too big for 8–10k?** If:  
    - It delves into meta-ethics (e.g., nature of fittingness) or empirical psychology (how emotions *actually* respond to reasons).  
    - *Mitigation*: Focus on *conceptual* pressure on internalism/externalism, not resolving meta-ethics.  
  - **Failure despite execution?** If:  
    - The argument only shows emotions are "hard cases" without illuminating the broader debate.  
    - Internalists can plausibly reduce emotions to actions (e.g., "reasons to manage emotions").  
    - Externalism’s "cost" (e.g., divorcing reasons from motivation) is judged insignificant.  

  #### **Chapter’s Payoff**  
  Succeeds if it forces internalists/externalists to re-examine the *scope* of their theories, showing that emotional reasons either fracture internalism or demand a unified account of "grip" that applies beyond action. The action/emotion asymmetry becomes a litmus test for the tenability of the "deliberative route".  

  ---  
  This keeps the lens tight on the internalism/externalism debate while leveraging emotions to reveal new tensions. It’s structured to fit a term’s work and pre-empts pigeonholing into fittingness. Let me know if you’d like to sharpen any section.
