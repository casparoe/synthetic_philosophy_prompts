prompt: |-
  I chair the weekly signal-triage meeting at a regional public health agency. Every Monday me and five others (two epidemiologists, a lab lead, a comms person, and a rotating field officer) spend 45 minutes deciding whether each flagged signal — a cluster of lab results, a spike in school absenteeism, a handful of GP calls — gets sent to field investigation or gets closed. We get eight or so a week and investigations are expensive, so most get closed. I sign off on the closes myself; anything above a certain cost goes to the director. About six months later we usually find out whether we were right, so I can score last year's calls.

  I can tell we herd. I speak first because I'm the chair and I'v read the briefing, and by the third or fourth signal everyone is just saying "agree". What I want is a procedure I can actually run in the room: questions in order, what counts as a good enough answer to each, where it stops with a no, where it hands the decision to a person because it's a values question (what a false alarm costs us vs what a missed outbreak costs) rather than a facts question, and when a case should go up to the director undecided instead of being settled in the room. It has to work at about two minutes a signal, so tell me which step is the cheap screen that clears most of them, and which step only runs on the one or two near the threshold.

  Three things about the room that I think break the textbook story, and I want the procedure to deal with them rather than assume them away: we already do an anonymous written poll before the meeting that I read out at the start, and I genuinely don't know whether that helps or just starts the cascade earlier; we have a standing devil's advocate whose job is to argue against whatever I say, so her dissent carries no information any more; and two of my members look at the same dashboard I do, so when they "agree" with me it's often not an independent check at all, while the field officer usually has something nobody else has. Tell me roughly how much to discount an agreement from someone whose information overlaps mine — I don't need a formula, but "count it as nothing" and "count it as half" are very different instructions.

  Please also keep seperate three things I keep conflating: a real cascade, honest convergence because everyone saw the same genuinely strong evidence, and a value disagreement pretending to be a factual one. Say what I should do differently in each.

  Then run it on three cases. (1) The pre-meeting poll split 4–2 to investigate, I opened by saying I thought it was noise, everyone then said close, and the field officer said nothing but mentioned afterwards that she'd heard from a local pharmacist about a second school. (2) The same confirmed strain in three patients with no link between them — I want the procedure to tell me not to bother with whatever anti-cascade ritual you invent, because I can't waste the meeting on unanimous cases; show me the 30-second screen that clears it. (3) The one I'll hate: I'm personally about 90% sure a signal is a real outbreak, I've seen the pattern before, and the room is lukewarm. Show the procedure telling me that my gut isn't independent evidence and that I either shut up or lose the vote — and then tell me honestly whether that's right or whether the procedure is just bullying me.

  Finally, flag which steps are judgment calls dressed up as procedure, and say plainly what a procedure like this cannot do for me. Don't point me at papers or reading lists — I want something I can run on Monday.
reasoning: |-
  We are designing a decision procedure for a signal-triage meeting with the following constraints:
   - 45 minutes for ~8 signals (about 2-3 minutes per signal on average, but we can allocate more to the hard ones by having a quick screen for the easy ones)
   - We have a pre-meeting anonymous poll (which we read at the start) and a standing devil's advocate.
   - Information overlap: chair (you) and two others (epidemiologists?) see the same dashboard; field officer has unique info; lab lead and comms person have their own perspectives.
   - We want to avoid herding, and we want to separate: cascade, honest convergence, and value disagreements.

   Steps in the procedure:

   1. **Quick Screen (5-10 seconds per signal):** 
      - You (chair) state the signal and the pre-meeting poll result (e.g., "4-2 to investigate").
      - Then ask: "Any new critical information that would change the poll?" 
          - If the field officer (or anyone) has new critical info (like the pharmacist report in case 1), then we skip the quick screen and go to step 2.
          - If no new critical info and the poll is unanimous (or near-unanimous) and the chair agrees, then we can close or investigate immediately without discussion. This is the 30-second screen for case 2.

      Rationale: For clear-cut cases (like case 2: same strain, no links) we don't need debate. We only debate when there's dissent or new critical info.

   2. **Individual Reasoning Round (if not cleared by step 1):**
      - Go around the table (in a fixed order, but not starting with you) and ask each person: "What is your current vote and the one strongest reason for it?" 
      - Order: Start with the field officer (unique info), then the lab lead, then comms, then the two epidemiologists (who see the dashboard), then the devil's advocate, then you (chair) last.
      - Why this order? We want the unique info (field officer) to be aired first, then the other experts, then the devil's advocate (who must argue against the emerging consensus, but now she has heard others), and then you (so you don't lead).

      - Each person must state their vote (investigate or close) and one reason (briefly). No discussion until everyone has spoken.

   3. **Check for Independence and Weighting:**
      - After the round, you (chair) summarize and note:
          - Field officer: full weight (unique info).
          - Lab lead and comms: full weight (independent perspectives).
          - Epidemiologists: if they cite the dashboard (which you also see), then discount their agreement with you to half-weight. If they bring up a new point (not on the dashboard) then that part is full weight. But in practice, for voting, we might not need a formula. Instead, we note when they are just repeating the dashboard.
          - Devil's advocate: her dissent is by role, so we don't count it as new information. But if she brings up a new argument (not already discussed), then that is considered.

      - How to handle: If the field officer, lab lead, or comms person dissents, that carries more weight than a dashboard epidemiologist agreeing with you. Also, if the devil's advocate raises a new point, we consider it.

   4. **Discussion (if needed):**
      - Focus on the key points of disagreement. Ask: "What is the key fact that, if we knew it, would change our mind?" 
      - Also, separate facts from values:
          - Factual: "Is there a link between the cases?" (if we could know, it would change the decision)
          - Value: "How bad would it be if we missed this outbreak?" vs. "How expensive is an investigation?" 
      - If the disagreement is primarily about values, then we note that and either:
          a) If the cost is above a threshold, send to the director (with a summary of the factual agreement and the value disagreement).
          b) If below, then as chair you decide (since you are accountable) but note the value disagreement.

   5. **Final Vote (if not resolved):**
      - We do a secret ballot (to avoid social pressure) on the spot. 
      - Tally the votes. 
      - If the vote is to investigate and the cost is above the threshold, then it goes to the director. Otherwise, you sign off.

   6. **Handling the Devil's Advocate:**
      - Since her role is to dissent, we do not count her vote in the same way. We listen to her arguments, but if she is the only dissenter and her points are not new, then we note that and move on.

   7. **Case of Chair's Gut Feeling (case 3):**
      - In step 2, you must state your vote and reason last. If your gut feeling is based on the same dashboard (so not independent) and you don't have new facts, then you must state it as such. 
      - The procedure will then discount your opinion if it's not independent. 
      - However, if your gut is based on experience (a pattern you've seen before) that others haven't, then you can present that as your reason. But then the room can evaluate if that pattern is valid.

      - Then, if the room is lukewarm and you are the only one strongly for investigation, then you must either:
          a) Convince them with your reasoning (which may be discounted because they haven't seen the pattern) or 
          b) Note that it's a value judgment (you are more risk-averse) and then if the cost is above threshold, send to the director.

      - The procedure is not bullying you. It is forcing you to articulate your reasoning and to acknowledge that others might not share your experience. But if you have a strong track record, the group might learn to trust your gut over time.

   8. **Time Allocation:**
      - Quick screen (step 1) for every signal: 5-10 seconds.
      - For the clear unanimous ones (step 1 passes): total 30 seconds.
      - For the rest: step 2 (individual round) should take about 30-40 seconds per person (6 people, so 3-4 minutes total). Then steps 3-5 as needed, but try to keep the whole signal under 5 minutes. For the very hard ones, we might take 7 minutes and then catch up by having a few very quick ones.

      - We expect that 5-6 signals will clear step 1 and take 30 seconds each (so 2.5-3 minutes for 5 signals). Then 2-3 signals take 5 minutes each (10-15 minutes). Total about 15-18 minutes, leaving time for administrative notes.

   9. **Dealing with Pre-meeting Poll:**
      - We read the poll at the start for each signal. But we note that the poll is done without group discussion, so it's a snapshot of initial independent thinking. However, it might start a cascade. Therefore, we use the poll only as a starting point and then require the individual round (step 2) to air new information and reasons.

      - The poll helps in step 1 to quickly clear unanimous cases. But if there is dissent (even 4-2) we go to step 2.

   10. **Three Cases:**

       **Case 1: Pre-meeting poll 4-2 to investigate, you opened by saying you thought noise. Then everyone said close, and field officer was silent until later.**
          - Step 1: You state signal and poll (4-2 investigate). Then ask: "Any new critical information?" 
              - The field officer might say nothing (if she doesn't speak up) or if she does, then we go to step 2.
              - But in the meeting, she didn't speak. So we would have cleared via step 1? Not exactly: because the poll was not unanimous (4-2 is split) so we do step 2.
          - Step 2: Go around the table. Start with field officer: she must state her vote and reason. If she had the pharmacist info, she should say: "I vote investigate because I heard from a local pharmacist about a second school with similar symptoms." Then the rest state. You last. 
              - Without her input, the others might have said "close", but now we have new info. 
          - Then the discussion (step 4) would focus on the second school report. 
          - Final vote might change.

          - Lesson: The procedure forces the field officer to speak when it's her turn and state her reason. This avoids the problem of her staying silent.

       **Case 2: Same confirmed strain in three unlinked patients.**
          - Step 1: You state the signal and the poll (likely unanimous to close? Or maybe split? Let's assume the poll is 6-0 to close). 
          - You ask: "Any new critical information?" 
              - If no, then you say: "We are closing this one, any objection?" (If no objection, done in 30 seconds.)

          - If someone objects, then we go to step 2, but that would be rare.

       **Case 3: You are 90% sure, room is lukewarm.**
          - Step 1: Poll is not unanimous (say, 3-3 or 4-2 in some direction). We go to step 2.
          - Step 2: You go last. The field officer, lab, comms, and epidemiologists state their lukewarm votes (probably to close). Then the devil's advocate argues against investigating. Then you state: "I vote investigate because I've seen this pattern before and it turned out to be an outbreak. Specifically, [briefly describe pattern]." 
          - Step 3: We note that your pattern recognition is not on the dashboard, so it's new information? Yes, but it's your experience. The group must weigh that. 
          - Step 4: Discussion: 
              - Fact: Is the pattern you recall applicable? 
              - Value: If you are right, how bad? If wrong, cost of investigation?
          - Step 5: If the group remains unconvinced, then we vote by secret ballot. 
              - If the vote is to close, then you (as chair) must decide whether to accept or to escalate to the director (if the potential cost of a missed outbreak is high and above the threshold). 
              - The procedure does not let you overrule without escalation unless the vote is tied and you break the tie. 

          - The procedure is not bullying you. It forces you to articulate your reasoning and then accept the group's decision unless you escalate. But if you have a strong track record, the group might trust you more over time. However, if you escalate too often, the director might push back.

   11. **What the procedure cannot do:**
      - It cannot eliminate the need for judgment. The discounting of overlapping information (e.g., epidemiologists) is a judgment call. The separation of facts and values is a judgment call. The decision to escalate to the director is a judgment call.
      - It cannot make up for lack of expertise or information. If the group doesn't have the right data, then we might make mistakes.
      - It cannot prevent all errors. Some outbreaks will be missed and some false alarms will occur.
      - It cannot force people to speak up if they are shy, but the structured round (step 2) helps.

   12. **Steps that are judgment calls dressed as procedure:**
      - Step 1: Deciding what counts as "critical" new information.
      - Step 3: Deciding how much to discount the epidemiologists' agreement (we don't have a strict formula).
      - Step 4: Deciding whether a disagreement is about facts or values.
      - Step 5: Deciding to escalate to the director (if the cost is above threshold, we must; but if near threshold?).

   13. **Implementation for Monday:**
      - Prepare a one-page handout for the team explaining the steps (so everyone knows the rules).
      - For each signal, you will:
          a) Read the signal and the poll.
          b) Ask: "Any critical new information?" 
          c) If no and unanimous poll and you agree, then close/investigate and move on.
          d) Else, do the individual round (in the fixed order) and then follow steps 3-5.

      - Timekeeper: assign someone (maybe one of the epidemiologists) to keep time and signal when 2 minutes are up for a signal (for the easy ones, we are under; for the hard ones, we might go over, but we have 45 minutes total).

      - After the meeting, you can note which signals were decided quickly and which took longer, and adjust for next week.

      - Finally, note that the devil's advocate is not allowed to speak until her turn in the round. She must wait until then to present her dissent.

   We hope this helps for Monday. It's designed to be run without outside materials and within the time constraints.
answer: |-
  Here's a practical, room-ready procedure designed for your constraints. It separates fact/value judgments, mitigates herding, and works within your 2-minute/signal average. Use a timer visibly.

  ---

  ### **The Triage Procedure: 4-Step Funnel**
  **Goal:** Clear 80% of signals in <30 seconds via Step 1. Spend remaining time on borderline cases.

  #### **STEP 1: PRE-SCREEN (20 SECONDS)**  
  *(Clears obvious cases; uses your poll)*  
  - **You state:** "Signal #X: [1-sentence summary]. Pre-meeting poll: [results]. **Field Officer: any ground-level updates not in the briefing?**"  
  - **Field Officer responds:**  
    - If "No" → Proceed to Step 1A.  
    - If "Yes" → Skip to Step 2.  
  - **STEP 1A (Unanimity Check):**  
    - "If poll was *unanimous (6-0 or 0-6)* and matches my initial assessment, we close/investigate now. Any objection?"  
    - *No objection?* Decision made. **Done in 30 sec.**  
    - *Objection?* Go to Step 2.  

  **Why this works:**  
  - Leverages your existing poll but adds Field Officer input immediately (their info is most likely unique).  
  - Clears unanimous, low-stakes signals fast (e.g., your Case 2: same strain, no links).  

  #### **STEP 2: FACT QUICK-TEST (45 SECONDS FOR NON-UNANIMOUS SIGNALS)**  
  *(Tests if signal fails basic factual thresholds)*  
  - **Ask in sequence:**  
    1. **Lab Lead:** "Is the lab quality/confirmation solid? (e.g., contamination ruled out?)"  
    2. **Epi 1 (or dashboard user):** "Is the cluster stat. significant *after* adjusting for reporting bias?"  
    3. **Epi 2 (other dashboard user):** "Is there a plausible transmission mechanism?"  
  - **Threshold:** If *any* answer is **"No" → Close immediately** (You sign off).  
  - If all "Yes" → Proceed to Step 3.  

  **Discounting overlaps:**  
  - Treat dashboard Epis' "agrees" as **half-weight** if they cite data *you also saw*. If they add new analysis (e.g., "I re-ran stats accounting for X"), count as full.  
  - Field Officer/Lab Lead/Comms: Always **full-weight** (unique roles).  
  - Devil's Advocate: **Never count as a vote** (treat as procedural noise).  

  #### **STEP 3: VALUES CHECK (30 SECONDS)**  
  *(Flags signals needing director/ethics input)*  
  - **Ask:** "Could this decision change if we weighed false alarms vs. missed outbreaks differently?"  
  - **If YES →** Escalate to director with note: "Values conflict: Group split on risk tolerance."  
  - **If NO →** Proceed to Step 4.  

  #### **STEP 4: BLIND VOTE + CHAIR OVERRIDE (25 SECONDS)**  
  *(Final call for non-escalated signals)*  
  - **Hold secret vote** (write "I" or "C" on paper; fold; tally).  
  - **Outcome:**  
    - Majority vote wins.  
    - **Tie?** Chair decides.  
    - **You disagree with majority?** You may override *only if*:  
      - Cost is below director threshold, AND  
      - You take personal accountability (e.g., email director: "I overrode group on Signal X").  

  ---

  ### **Diagnosing Your 3 Cases**
  #### **CASE 1: Pre-poll 4-2 Investigate → You said "noise" → Everyone agreed to close**  
  - **Procedure fix:**  
    - Step 1: Field Officer *must* speak. If she mentions the pharmacist, skip to Step 2.  
    - Step 2: Lab/Epis confirm data quality → Proceeds.  
    - Step 4: Blind vote prevents silent acquiescence.  
  - **Why it works:** Field Officer input surfaces *before* your opinion biases the group.  

  #### **CASE 2: Same strain, no links**  
  - **Procedure fix:**  
    - Step 1A: Unanimous poll (likely 6-0 Close) → Closed in 30 sec.  
  - **Why it works:** No debate on clear-cut cases.  

  #### **CASE 3: You're 90% sure, room is lukewarm**  
  - **Procedure fix:**  
    - Step 2: Your "gut" isn't a fact. You can say: "I’ve seen this pattern before," but it’s **not independent evidence** (it’s experience).  
    - Step 4: If vote is "Close" and you’re outvoted, **you cannot override without escalating** (unless cost is low).  
  - **Is this bullying?** **No.** The procedure forces you to:  
    - Convert "gut" into testable facts (e.g., "In 2023, pattern X had 90% PPV" – then Step 2 tests it).  
    - Accept that your role as chair is to manage process, not dictate outcomes.  
    - If your track record is strong, the group will learn to upvote your signals.  

  ---

  ### **Key Judgement Calls Disguised as Procedure**  
  1. **Step 1A's "any objection?"** – Relies on someone speaking up (mitigated by Field Officer speaking first).  
  2. **Step 2's "plausible transmission mechanism"** – Subjective, but Epis define it pre-meeting (e.g., "Must share venue/time").  
  3. **Step 3's "values conflict"** – Chair judges if disagreement is about risk tolerance (values) or data (facts).  

  ### **What This Can't Do**  
  - **Fix information gaps:** If Field Officer hides knowledge (Case 1), procedure can’t force it out.  
  - **Eliminate hierarchy:** Your authority as chair still influences dissent (blind vote mitigates this).  
  - **Replace expertise:** Requires members to understand their role’s thresholds (e.g., Lab Lead knows "quality" means).  
  - **Prevent all misses:** Some outbreaks will be missed; some resources wasted. This optimizes for speed + due process.  

  ---

  ### **Run This Monday**  
  1. **Print this for the group:** Assign roles (Lab, Epi1, Epi2, Field Officer, Comms, Devil's Advocate).  
  2. **Use a timer:** Strictly enforce 20 sec/Step 1, 45 sec/Step 2, etc.  
  3. **Record decisions:** Track overrides, director escalations, and outcomes for future scoring.  

  **Adjust as needed:** If your team balks, simplify Steps 2-3 into: "Field Officer/Lab/Epi1: One new fact each → Blind vote." The core is forcing unique inputs early and voting secretly.
