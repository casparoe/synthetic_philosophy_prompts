prompt: |-
  Hi — I'm on the grants committee of a small family foundation (five trustees, monthly meetings, maybe a dozen grants a year out of about a million dollars total, and the closest thing we have to a research capacity is me with a spreadsheet). We keep having the same arguement and I want to stop having it by turning it into a form we fill in.

  The argument in one paragraph: almost every proposal has near-term effects we can sort of see and long-run effects we can't see at all. Cash transfers to very poor households obviously help the recipients, but they also move local prices, and migration, and maybe fertility, and therefore possibly who exists in twenty years. The deworming proposal has beautiful trial evidence on school attendance, thin evidence on earnings, and no evidence whatsoever on what a slightly better-educated cohort does to a country's politics or growth rate. And then we get asks like a curriculum-reform advocacy group where the entire case is long-run and the near-term is invisible. Two of us have fallen into saying "we're clueless about the long run, therefore the near-term numbers shouldn't be allowed to decide it", and three say "the numbers are all we've got, therefore they should decide it", and if I'm honest both sides are using cluelessness as a route to a verdict they already liked.

  So: write me a decision procedure we can actually run on a proposal in an afternoon. Fixed order of questions, what counts as an adequate answer to each, where the procedure stops with a no, and where it hands the decision back to humans because the issue is one of values rather than evidence. It has to meet some constraints:

  - It can't require a number we have no way of getting. If a step needs a parameter, say what to do when it's unobtainable.
  - It has to terminate. We can't spend a meeting asking whether we're clueless about whether we're clueless.
  - I want it to separate two kinds of causal channel, roughly: ones where the effect enters through a damped, near-additive pathway (a consumable delivered once, a one-off medical treatment) and ones where it enters through a system that amplifies and redistributes — prices, norms, institutions, anything that changes what other agents later do. My hypothesis is that cluelessness is mainly a property of the second kind and that the procedure should treat the first kind as decideable on near-term numbers. Tell me if that's wrong.
  - Related: somewhere in it there should be a sign-stability check — not "estimate the size" but "would the sign of the total effect stay the same across a spread of background assumptions we can't distinguish between?" If the sign flips, I want the procedure to say the expected-value calculation was unearned, and to say what we do instead (fall back to option value? to reversibility? to near-term numbers as a tie-breaker only?).
  - It should flag explicitly when an intervention's main effect is identity-affecting — changes how many people exist, or when, or which ones — because that's where our committee visibly falls apart, and I suspect a lot of the rest of the disagreement is really about that.
  - And it should handle the fact that our counterfactual — the donor spending the money on something else, or the money not existing — is just as opaque as the grant.

  Then apply it to two proposals: the deworming program, and the curriculum-reform advocacy group. Include at least one place where the procedure gives an answer our committee won't like, and don't soften it. Finally, tell me which steps are judgement calls wearing a lab coat, and what the procedure simply cannot tell us.

  Keep it under 700 words, no citations or reading suggestions (we won't read them), and write it so the retired doctor and the lawyer on the comittee could follow it without me in the room.
reasoning: |-
  We are designing a decision procedure for grant proposals that addresses near-term vs. long-term effects and cluelessness. The procedure must be practical and terminate. We'll break it into steps with clear questions and actions.

  **Decision Procedure: Grant Evaluation Framework**

  **Step 1: Near-Term Effect Assessment**
     - Question: What is the near-term effect (within 5 years) on the direct beneficiaries? Can we quantify it with reasonable confidence (e.g., from trials, pilot data, or strong theory)?
     - Adequate Answer: A quantitative estimate (e.g., 10% increase in school attendance) or a clear qualitative description (e.g., "reduces immediate hunger") with a stated basis (e.g., "from RCT in similar context").
     - If unobtainable: Skip to Step 4 (Long-Term Pathway).
     - If negative or negligible: Stop → **Reject** (unless Step 4 overrides).
     - If positive and quantifiable: Note the magnitude and proceed to Step 2.

  **Step 2: Pathway Classification**
     - Question: Is the primary effect pathway **damped** (effects diminish over time, no major feedback loops) or **amplifying** (effects propagate through systems like prices, norms, institutions, or behavior changes that affect others)?
     - Damped example: One-off deworming treatment (effects on health/schooling may fade).
     - Amplifying example: Cash transfers (may alter local economy, migration, fertility).
     - Adequate Answer: Classification with a brief rationale (e.g., "cash alters local labor supply → damped? no, because it affects wages and thus others' behavior → amplifying").
     - If damped: Proceed to Step 3 (Expected Value Calculation).
     - If amplifying: Proceed to Step 4 (Long-Term Pathway).

  **Step 3: Expected Value Calculation (for Damped Pathways)**
     - Question: Using near-term numbers and a reasonable discount rate (e.g., 5% per year), calculate the net present value (NPV) of the intervention per dollar spent. Include any known costs and benefits within 10 years.
     - Adequate Answer: A single NPV number or range (e.g., $1.50 benefit per dollar spent).
     - If NPV > 1: Proceed to Step 6 (Counterfactual).
     - If NPV ≤ 1: Stop → **Reject** (unless Step 4 applies and overrides).

  **Step 4: Long-Term Pathway Assessment**
     - Question: For amplifying pathways (or when near-term effects are unquantifiable), sketch the causal chain to long-term effects (20+ years). Is there a plausible, sign-stable effect?
     - Sign-Stability Check: Would the sign (positive/negative) of the total effect stay the same under varying reasonable assumptions (e.g., different economic conditions, policy environments)? 
     - Adequate Answer: 
          - If sign-stable: Note the sign and proceed to Step 5.
          - If sign-flips (e.g., "this curriculum reform could strengthen democracy or fuel polarization"): Flag as **clueless** → Proceed to Step 5 with caution.
          - If entirely speculative: Flag as **clueless** → Proceed to Step 5.
     - Also, explicitly: Does this intervention change who exists in the long run (identity-affecting)? (Yes/No) → Note and proceed.

  **Step 5: Cluelessness Handling**
     - Question: Given the cluelessness (from sign-flip or speculation), how do we decide?
     - Procedure:
          - If identity-affecting: **Flag for values-based debate** → Stop and hand to humans.
          - Otherwise, consider:
               a. **Option Value**: Does this grant preserve future options (e.g., piloting a reversible policy)? If yes, weight positively.
               b. **Robustness**: Is the intervention reversible? (Reversible → less risky.)
               c. **Near-Term Tie-Breaker**: Use near-term effects (from Step 1) as a tie-breaker if present.
          - Adequate Answer: A decision to **Approve** if option value/reversibility is high, or **Reject** if low. If unclear, hand to humans.

  **Step 6: Counterfactual**
     - Question: What would happen if we didn't fund this? Would another funder likely step in? If not, is our money additive?
     - Adequate Answer: 
          - If money is non-additive (e.g., project happens anyway): Stop → **Reject** (unless strategically valuable).
          - If additive: Proceed to final decision.
     - Note: If counterfactual is opaque (common), assume additive unless strong evidence otherwise.

  **Final Steps:**
     - Compile results from Steps 1-6. If not rejected by any step:
          - If NPV >1 (Step 3) or sign-stable positive (Step 4) with no cluelessness: **Approve**.
          - If clueless but high option value/reversibility: **Approve**.
          - Otherwise: **Reject** or hand to humans if values-based (e.g., identity-affecting).

  ---

  **Application to Proposals:**

  **1. Deworming Program:**
     - Step 1: Near-term effect: Strong evidence on school attendance (+20%?). Quantifiable → Proceed.
     - Step 2: Pathway: Damped (effects on individual health/education; little feedback to systems) → Proceed to Step 3.
     - Step 3: NPV: Assume high (e.g., $3 per $1) → Proceed to Step 6.
     - Step 4: (Skipped for damped pathway, but note: long-run effects on politics/growth are speculative and identity-affecting? Unclear, but not primary.) 
     - Step 5: Not needed (damped).
     - Step 6: Counterfactual: Assume additive (many areas lack deworming) → **Approve**.

  **2. Curriculum-Reform Advocacy:**
     - Step 1: Near-term effect: Invisible (advocacy → policy change → eventual student outcomes). Unquantifiable → Skip to Step 4.
     - Step 2: (Implicitly amplifying) → Step 4.
     - Step 4: Causal chain: Advocacy → policy → curriculum → student skills → economic growth/democracy. 
          - Sign-stability: Could education improve growth (positive) or fuel inequality/conflict (negative)? Sign may flip → **Clueless**.
          - Identity-affecting? Yes (alters future population composition) → **Flag for values**.
     - Step 5: Identity-affecting → **Hand to humans** for debate on values (e.g., "Do we want to influence future demographics?"). 
     - Step 6: Counterfactual: Opaque, but assume additive for now (advocacy often underfunded).
     - Outcome: Stuck at Step 5 → Human debate. The procedure doesn't force a number-based decision here.

  **Where the Procedure Bites:**
     - The deworming approval is straightforward (damped, high NPV). But if one trustee argues it's identity-affecting (e.g., "better-educated people have fewer kids, altering who exists"), the procedure would flag it in Step 4 and force a values debate → might not approve. This could be unpopular with the "just the numbers" faction.

  **Judgement Calls:**
     - Step 2 (Pathway): Classifying damped vs. amplifying is subjective. 
     - Step 4 (Sign-Stability): Requires judging what "reasonable assumptions" are.
     - Step 5 (Option Value): Subjective weighting.

  **What It Can't Do:**
     - Resolve deep value disagreements (e.g., on identity-affecting interventions).
     - Assign exact numbers to amplifying effects.
     - Eliminate the need for qualitative judgement.

  **Summary:** This procedure forces explicit handling of cluelessness and identity effects, uses near-term numbers only for damped pathways, and defaults to option value or human debate when clueless. It should fit in an afternoon.
answer: |-
  ### Grant Decision Procedure  
  **Purpose:** Systematically evaluate proposals when near-term effects are quantifiable but long-term effects are uncertain. Forces explicit reasoning about cluelessness, pathways, and values.  

  #### Step 1: Near-Term Effect & Quantifiability  
  **Question:** *What is the direct, near-term (≤5 years) outcome for beneficiaries? Is it quantifiable?*  
  - **Adequate answer:** Numerical estimate (e.g., "increases school attendance by 15%") with source (trial, data, expert). If no number, qualitative description (e.g., "reduces hunger").  
  - **Unobtainable?** Skip to Step 4.  
  - **Termination:** If effect is negative/negligible → **Reject**.  
  - *Why:* Filters out proposals with no immediate justification.  

  #### Step 2: Pathway Classification  
  **Question:** *Is the primary effect pathway **damped** (effects fade without systemic feedback) or **amplifying** (effects ripple through systems like prices, norms, or institutions)?*  
  - **Damped examples:** Vaccines, one-off cash for food.  
  - **Amplifying examples:** Large cash transfers, education reform.  
  - **Adequate answer:** Classification + 1-sentence rationale (e.g., "Cash transfers alter local labor markets → amplifying").  
  - **Termination:** None. Proceed to Step 3 if damped, Step 4 if amplifying.  
  - *Why:* Isolates interventions where long-run cluelessness matters less (damped) vs. more (amplifying).  

  #### Step 3: Expected Value (Damped Pathways Only)  
  **Question:** *Calculate net benefit per dollar using near-term numbers (e.g., cost per life saved). Use 5% annual discounting for effects >2 years.*  
  - **Adequate answer:** Dollar-value ratio (e.g., "$3 benefit per $1 spent").  
  - **Unobtainable?** Skip to Step 4.  
  - **Termination:** If ratio ≤1 → **Reject** (fails cost-effectiveness).  
  - *Why:* For damped pathways, near-term data suffices.  

  #### Step 4: Long-Term Sign-Stability & Identity Effects  
  **Question:** *Could the long-term effect (20+ years) flip sign under plausible assumptions? Does this change who exists?*  
  - **Adequate answer:**  
    - Sign-stability: "Likely positive/negative" or "sign-flips" (e.g., "Curriculum reform could boost growth or entrench inequality → sign-flips").  
    - Identity-affecting: Yes/no (e.g., "Cash transfers alter fertility → changes who exists → yes").  
  - **Termination:**  
    - If sign-flips **and** identity-affecting → **Hand to humans** (values debate).  
    - If sign-stable → Proceed to Step 5.  
  - *Why:* Flags where cluelessness invalidates expected value. Identity effects trigger values-based debate.  

  #### Step 5: Cluelessness Handling  
  **Question:** *If sign-flips but not identity-affecting, does this grant offer option value or reversibility?*  
  - **Adequate answer:**  
    - Option value: "Yes, it pilots a reversible policy" or "No, it’s irreversible."  
    - Reversibility: "Effects can be undone if harmful" (yes/no).  
  - **Termination:**  
    - High option value/reversibility → **Approve**.  
    - Low option value/irreversible → **Reject**.  
    - Uncertain → Use near-term effects (Step 1) as tie-breaker.  
  - *Why:* Defaults to near-term data when cluelessness blocks long-run analysis.  

  #### Step 6: Counterfactual  
  **Question:** *Would this happen without us? If we don’t fund this, what do we fund instead?*  
  - **Adequate answer:** "Likely unfunded" (additive) or "others will fund it" (non-additive).  
  - **Unobtainable?** Assume additive (common for small funders).  
  - **Termination:** If non-additive → **Reject** (no marginal impact).  
  - *Why:* Avoids wasting funds on inevitable projects.  

  #### Final Decision  
  - **Approve:** Survives all termination points.  
  - **Reject:** Fails any termination point.  
  - **Hand to humans:** Identity effects or irreconcilable values conflict.  

  ---  
  ### Application to Proposals  
  **1. Deworming Program**  
  - **Step 1:** Near-term attendance +15% (quantifiable trial data) → Proceed.  
  - **Step 2:** **Damped pathway** (treatment effects fade; no systemic feedback) → Go to Step 3.  
  - **Step 3:** $4 benefit per $1 spent → Proceed.  
  - **Step 4:** Long-term sign-stability? *Unchecked (damped pathway skips this).*  
  - **Step 5:** Not applicable.  
  - **Step 6:** Additive (no other funders) → **Approve**.  
  - **Harsh truth:** The procedure ignores long-run political/growth effects (classified as damped). Trustees who debate this are overruled by near-term numbers.  

  **2. Curriculum-Reform Advocacy**  
  - **Step 1:** Near-term effects? None visible → Skip to Step 4.  
  - **Step 2:** **Amplifying pathway** (alters education systems → reshapes future workforce/norms) → Go to Step 4.  
  - **Step 4:**  
    - Sign-stability? "Sign-flips" (could improve equity or worsen polarization).  
    - Identity-affecting? "Yes" (alters future population via education-driven migration/fertility).  
    → **Hand to humans** (triggers values debate).  
  - **Outcome:** No numerical verdict. Committee must debate "What future do we want?"  

  ---  
  ### Reality Check  
  **Judgement calls in disguise:**  
  - Pathway classification (Step 2) is subjective.  
  - Sign-stability (Step 4) hinges on "plausible" assumptions.  
  - Option value (Step 5) is speculative.  

  **What the procedure cannot do:**  
  - Resolve moral disagreements (e.g., "Is changing who exists acceptable?").  
  - Assign weights to competing values (e.g., equity vs. growth).  
  - Eliminate opacity in counterfactuals.  

  **Design note:** Forces the committee to confront cluelessness upfront. Amplifying pathways and identity effects trigger human debate; damped pathways live/die by near-term data.
