  Notably absent: concrete probability calculations. The median hitting $3.3M is irrelevant - Claire correctly notes median ≠ success probability. Someone should compute P(success) for f=0.2 vs f=0.3 etc. under constraints. But given 60-round complexity, simulation is indeed necessary.

