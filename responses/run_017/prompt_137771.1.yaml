prompt: |-
  I am a philosopher by training, and this term I am teaching a graduate seminar on the concept of democracy; I have also been trying, without much success, to write a short paper on what makes a political change an instance of democratic backsliding rather than merely an illiberal reform, and on who is entitled to apply that label. My method so far has been to go case by case, trusting my own verdicts as data, and the verdicts refuse to line up under any principle I try. Hungary after 2010 — a two-thirds parliamentary majority rewriting the constitution, redrawing constituencies and changing the electoral rules, packing the constitutional court, and building a compliant media regulator — is backsliding for me, and it is my paradigm. So is Poland between 2015 and 2023: neutralising the constitutional tribunal, forcing Supreme Court judges out through a lowered retirement age, and creating a disciplinary regime over the judiciary, even though the governing party won an outright majority and said it was dismantling an unaccountable post-communist bench. So, with slightly more hesitation, is Turkey's shift to an executive presidency approved by a narrow referendum, combined with the prosecution and removal from office of opposition mayors and the imprisonment of Kurdish politicians and civil-society figures; my hesitation is that I don't think Turkey was a full democracy beforehand, and I don't know whether backsliding needs a satisfactory baseline to slide from. I also count the American episode of 2020–21 as backsliding — a sitting president pressuring state officials and legislators to substitute their own slates of electors, the spurious certificates, the pressure on the vice-president, the crowd at the Capitol — even though every one of those efforts failed, the rules held, and the incumbent left office. But I don't count the imaginary Republic of Verdania: a government that restricts speech, channels advertising money to friendly outlets, and governs illiberally, yet holds elections whose count is honest and has handed power to the opposition four times in thirty years. That looks to me like illiberalism, not backsliding. And then there is Saldena, also imaginary: elections there are scrupulously fair, power alternates, turnout is high — but every significant party has an explicit understanding that a hereditary minority making up a sixth of the citizens will never be represented in government, and its members are informally barred from standing. I want to say Saldena is backsliding, or anyway democratically defective in a way that belongs to the same story, even though my reason for excusing Verdania was that democracy is about the fairness of competition rather than about liberal rights.

  The pairs that trouble me are these. If fair competition is what matters, Saldena's elections are fairer than Hungary's, so my two verdicts pull in opposite directions. Hungary and Poland involved the same mechanisms as the imaginary case I call restoration: the incoming majority in Poland after December 2023 moved against the public broadcaster and against disputed judicial appointments by means its own critics called legally dubious, defending itself as dismantling a capture its predecessor had built — and here I oscillate, wanting to say that this is repair rather than backsliding although the mechanisms are the ones I counted against the previous government. I also seem to want it both ways about who decides: when an external union suspends funds and threatens voting rights on rule-of-law grounds and the electorate responds by re-electing the government with a larger majority, I side with the external body; but when outside observers cry backsliding and the opposition then wins the next election, I am inclined to side with the electorate. My own tentative principle is that backsliding is any change, enacted by those currently in office, that lowers the probability of their being turned out at the next election under the rules they themselves have made. It handles Hungary and Poland, but it gives the wrong answer on the American case, where nothing was actually changed, and it says nothing about Saldena, where incumbents are perfectly removable. My repair is to add a counterfactual clause about fragility: an attempt counts when the rules survived only because enough officials declined to break them, so that the outcome depended on norms rather than on legal constraint.

  So: is there a single principle, or a small ordered set, that captures most of these verdicts, and where does it force me to give one up? Please state it precisely, tell me which case motivates each clause, and then tell me what it says about a case I have not listed — say, a long-standing democracy where a referendum-backed amendment gives the cabinet power to rule by decree for renewable six-month periods, used so far only for measures with majority support. I would also like it to say something about whether backsliding can occur where the baseline was already defective, whether a state can keep backsliding once it has plainly stopped being a democracy, and whether the correct principle has an official sayer built into it — domestic courts, the electorate, external bodies, or retrospective judgement — or whether the verdict is irreducibly someone's. I am not asking for a literature survey or citations; I have read enough of those, and I want the argument. Please write your answer in British English.
reasoning: |-
  Okay, the user is a philosopher teaching a graduate seminar on democracy and struggling to define "democratic backsliding" versus "illiberal reform." They've shared several real and hypothetical cases where their intuitive judgments conflict with any principle they try to formulate. Their core struggle is reconciling procedural fairness with substantive democratic erosion across cases like Hungary, Poland, Turkey, the US Capitol riot, and imaginary states like Verdania/Saldena.

  Hmm, their examples reveal three key tensions: 
  First, between electoral competitiveness (why they excuse Verdania) and equal political agency (why Saldena troubles them). 
  Second, between legal mechanisms (identical in Poland's backsliding and restoration phases) and contextual intent. 
  Third, between external vs domestic legitimacy of backsliding claims.

  Their proposed fragility principle is smart but fails on passive erosion like Saldena. I notice they're also wrestling with four meta-questions: defective baselines, post-democratic erosion, authoritative labelers, and whether judgments are inherently subjective.

  The user needs a coherent framework that preserves their intuitive verdicts while resolving contradictions. Since they've rejected literature surveys, I'll build a response around their own cases, proposing a three-pronged principle focusing on *competitive agency*, *durable advantage*, and *counterfactual fragility*. 

  For Hungary/Poland: it fits all three prongs. 
  For Turkey: I'll address their baseline hesitation by arguing backsliding can occur from flawed democracies if erosion targets existing competitive mechanisms. 
  For the US: the fragility clause captures near-misses. 
  Verdania gets excluded as illiberal but competitively robust, while Saldena is backsliding via the durable exclusion clause. 

  The Poland restoration quandary is tricky - identical mechanisms lack durable advantage when power recently changed hands. Their referendum case will test the framework: renewable decree powers create fragility even if currently popular, satisfying all three prongs. 

  On meta-questions: 
  Baselines matter relatively (erosion from prior state). 
  Backsliding stops making sense post-democracy. 
  No privileged labeler exists, though some agents have better epistemic positions. 
  And yes - the judgment remains inherently normative, though empirically constrained. 

  The user will likely push back on Saldena's classification, but I'll stand firm: permanently excluding a minority from governing violates competitive agency regardless of electoral fairness. That's the crux where liberalism can't be divorced from democracy.
answer: |-
  Your struggle captures the core tension in defining democratic backsliding: the interplay between **procedural fairness** (electoral competition) and **substantive political agency** (equal capacity to influence outcomes). Your verdicts suggest that backsliding occurs not merely when illiberal policies are enacted, but when **changes systematically undermine the possibility of alternation in power by eroding institutional checks or excluding groups from effective participation**. Below is a synthesised principle, its motivations, applications, and answers to your residual questions.

  ---

  ### **The Proposed Principle**
  Democratic backsliding is **a deliberate act or series of acts by incumbent rulers that:**
  1. **Reduces the effective political agency of opposition groups** (including voters, parties, or minorities), *and/or*  
  2. **Creates a durable advantage for incumbents**, *and*  
  3. **Is counterfactually fragile**—i.e., it would likely fail if subjected to robust institutional scrutiny or unfettered public contestation.  

  **Ordered Application:** (1) and (2) are necessary; (3) resolves edge cases where formal rules persist but norms are weaponised.

  ---

  ### **Clause Motivations & Case Applications**
  1. **Reduces effective political agency**  
     - *Motivation:* Saldena (explicit hereditary exclusion) and Turkey (jailing opposition figures). Even with fair elections, agency is denied to a defined group.  
     - *Verdicts:*  
       - **Saldena:** Backsliding (exclusion destroys agency for 1/6 of citizens).  
       - **Verdania:** *Not* backsliding (opposition can still win power; illiberalism ≠ agency erosion).  
       - **Turkey:** Backsliding (prosecutions/jailing directly target opposition agency).

  2. **Creates a durable advantage for incumbents**  
     - *Motivation:* Hungary (gerrymandering, court-packing) and Poland 2015–23 (judicial neutering). Reforms entrench incumbents regardless of future electoral outcomes.  
     - *Verdicts:*  
       - **Hungary/Poland 2015–23:** Backsliding (changes designed to survive electoral defeat).  
       - **Poland 2023 restoration:** *Not* backsliding (actions reversed prior entrenchment; no *durable* advantage created).  
       - **USA 2020–21:** Backsliding (attempt to subvert electoral count aimed at entrenching Trump).

  3. **Counterfactually fragile**  
     - *Motivation:* USA 2020–21 and "near-miss" scenarios. Acts depend on norm violations, not durable legal shields.  
     - *Verdict:*  
       - **USA 2020–21:** Included (success relied on officials’ complicity, not rules).  
       - **Failed coups:** Generally backsliding if fragility is exposed.

  ---

  ### **Unlisted Case: Renewable Decree Powers**  
  *Scenario:* A longstanding democracy amends its constitution via referendum, granting the cabinet renewable 6-month decree powers (used only for popular measures so far).  
  - **Verdict:** Backsliding.  
    - *Why:*  
      1. **Agency reduction:** Short-circuits legislative scrutiny, reducing opposition’s role.  
      2. **Durable advantage:** Incumbents can bypass parliament to enact their agenda.  
      3. **Fragility:** Relies on public support *now*; future use could target opposition (e.g., restricting protests "for stability").  

  ---

  ### **Resolving Your Troubling Pairs**
  - **Saldena vs. Hungary:**  
    Saldena violates (1) (excluded group lacks agency); Hungary violates (1) *and* (2) (agency reduced *and* advantage entrenched). Both are backsliding, but via distinct mechanisms.  
  - **Poland 2015–23 vs. 2023 Restoration:**  
    Identical *mechanisms* but divergent *intent*: The first aimed to entrench advantage (2); the second removed that advantage. Context matters.  
  - **Who Decides?**  
    External bodies may identify backsliding (e.g., EU on Poland), but the electorate’s verdict can *correct* it (e.g., voting out incumbents). Your impulse is consistent: Backsliding is objective, but **reversibility** determines whether external intervention is justified.  

  ---

  ### **Answers to Residual Questions**
  1. **Defective Baseline:**  
     Backsliding can occur from a flawed democracy if reforms *accelerate decline in agency/advantage* (e.g., Turkey). The "slide" is relative to prior conditions.  
  2. **Post-Democratic Erosion:**  
     Once a state is wholly authoritarian, further repression is *not* backsliding (e.g., Belarus today). The concept implies decline *from* democracy.  
  3. **Authoritative Labeler:**  
     No single entity has a monopoly. The verdict relies on:  
     - **Empirical evidence** (e.g., constitutional changes, electoral data).  
     - **Normative threshold** (e.g., agency/advantage criteria).  
     Domestic courts or electorates may *contest* the label, but their judgments can be self-interested (e.g., Hungary’s Fidesz-dominated courts). Retrospective scholarly consensus often crystallises legitimacy.  
  4. **Subjectivity:**  
     The *judgment* is objective if based on the principle above, but **application** requires contextual analysis (e.g., discerning "durable advantage"). This is inherent in political philosophy.

  ---

  ### **Where You Must Surrender a Verdict**
  - **Poland 2023 Restoration:** You must accept it as *not backsliding* if the goal was de-entrenchment, even with "dubious" means. Context overrides mechanism.  
  - **Saldena:** You cannot exclude it—permanent exclusion of a group violates core agency, making it backsliding *even with fair elections*.

  ---

  ### **In Summary**
  Backsliding is **institutionalised cheating**: actions that rig the system to favour incumbents or exclude rivals, beyond mere illiberalism. Your instinct to prioritise *contestability* over liberalism is correct—but Saldena proves that exclusion nullifies contestability for some. The fragility clause rescues episodic cases (like the US) where norms, not laws, were the last bulwark. What unites Hungary, Poland, Turkey, the US, and Saldena is that all **altered the playing field to make "turning out the government" materially harder or impossible for segments of the polity**. Verdania, however illiberal, left the field intact.
