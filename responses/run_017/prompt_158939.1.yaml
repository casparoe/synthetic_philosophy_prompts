prompt: |-
  My friend Priya and I spent like three hours last night arguing about whether thought experiments in philosophy ever actually show anything, or whether they're just rhetorical gadgets (she kept calling them intuition pumps, which I think is Dennett's phrase) that make a conclusion feel obvious without giving you any reason for it. She says they're the closest thing philosophy has to data; I said they're persuasion with a lab coat on. We ended up going case by case, and I came away with a pile of verdicts that I now realize don't obviously add up, so I'm trying to work out what I actually think.

  Here's where I landed. Gettier's little story about the job candidate and the coins in somebody's pocket (I'm probably mangling the details, you know the shape) — legit. It's tiny, there's basically no imagery, and it turns on exactly one move: justified true belief that still isn't knowledge. Thomson's violinist — legit too, even though the setup is completely fantastical, because the fantasy is a stand-in for something real and the weirdness isn't what's pushing me. Parfit's teletransporter — legit, and I trust it more because my answer barely changes whether the copy is made before or after the original is destroyed, or whether there are two copies. Nozick's experience machine — I think it's rigged. If I say it flatly ("you reliably get whatever you most want and you never find out") my resistance mostly evaporates, and what's left doing the work is the picture of a body floating in a tank. Same with the utility monster: the monster part is doing all the persuading. But the repugnant conclusion I want to keep, even though it's also a pure aggregation intuition and also kind of gross, because I can put it in completely flat language and still feel the pull. The Chinese room — I want to throw out, on the grounds that whether the guy in there "understands" Chinese is precisely what's being argued about, and the image of a man shuffling flashcards is one side's conclusion dressed up as a neutral setup. Mary the color scientist — I also want to throw out, but for a different reason: I think the question "does she learn something new" slides between learning a fact and gaining an ability, and you get a different answer depending on which one you hear. And here's the pair I keep going back to: I'm keeping the teletransporter, which is science fiction, while junking the experience machine, which is also science fiction, and my only story about the difference is that the teleporter's fiction stands in for a real question about what matters in survival while the machine's fiction is a picture of the very thing being argued about — which feels like something I invented on the spot to save the verdicts I already liked.

  The rule I half-articulated to Priya over the second round of drinks was: a thought experiment earns its conclusion only if (1) the fantastic element is a substitution for an ordinary situation rather than a picture of the disputed thing itself, (2) the verdict survives being restated in flat language with all the imagery stripped out, and (3) the verdict doesn't flip when you re-describe the scenario from the other side, or swap the loaded details for neutral ones. She pointed out that clause (2) probably sinks my verdict on Mary: stated drily — someone who knows every physical fact about color vision sees red for the first time, is there something she comes to know? — I still want to say yes, which means either the case is fine and my verdict is wrong, or clause (2) isn't enough and I need a further clause about setups whose question has more than one reading. And she said clause (1) fails my own teletransporter verdict, since the scanning machine there is arguably a picture of survival rather than a stand-in for it. I've started calling the irrelevant imagery "sticky details," and my worry is that everything I distrust just happens to be a case where I dislike the conclusion.

  So: can you give me a principle that actually captures the pattern, or tell me straight which of my verdicts I have to give up? I'd like it stated precisely enough that I can apply it, with the case that motivates each clause, and I want you to be honest about where my set is simply inconsistent rather than papering over it with a disjunctive clause for every case. Then tell me what the principle says about the three I couldn't settle: Chalmers's zombie case (conceivable that there's someone physically identical to me with nothing it's like to be them) — flat restatement doesn't dissolve it for me, but the setup feels like a picture of the thing in dispute in the same way the Chinese room does, so my rule is pulling two ways; a near-future version of the teleporter where it's just a commute and the scan is imperfect, where I notice I'd probably use it, which makes me think my survival intuition is tracking something other than identity; and a trolley case rewritten as a product-safety decision at a car company, where the numbers are real (a recall costs 40 lives, skipping it costs 12) but the version I was shown includes a named six-year-old. I'm running a undergrad reading group next semester and I need a defensible rule for which of these things I put on the syllabus, so ideally the principle is something I can say in a sentence or two and then actually use.
reasoning: |-
  Okay, this user is deep into a philosophical debate with their friend Priya about thought experiments. They've spent hours arguing whether these are legitimate tools or just rhetorical tricks. The user has analyzed several classic cases—Gettier, Thomson, Parfit, Nozick, etc.—and arrived at individual verdicts but now realizes their judgments might be inconsistent. They're seeking a coherent principle to evaluate thought experiments fairly, especially since they need to select readings for an undergrad group.

  First, I need to unpack their existing framework. They proposed three criteria: (1) fantastical elements must stand in for ordinary situations, not depict the disputed thing; (2) conclusions must hold when stripped of vivid imagery; (3) verdicts shouldn't flip under neutral re-descriptions. But their own examples expose flaws—e.g., Mary's case fails (2) yet they reject it for ambiguity, while Parfit's teletransporter arguably violates (1). Their core struggle is confirmation bias: distrusting experiments whose conclusions they dislike. 

  The key tension lies in distinguishing intuition pumps from genuine analysis. Dennett's critique resonates here—some experiments feel manipulative (e.g., Nozick's tank imagery). But the user also recognizes that flat restatements sometimes preserve intuitions (Repugnant Conclusion) or dissolve them (Experience Machine). Their zombie case dilemma highlights this: conceivability arguments might just dress up dualism as a neutral setup. 

  For a defensible principle, I should prioritize epistemic hygiene over their initial criteria. Focus on whether experiments clarify concepts versus smuggling conclusions. Cases like Gettier work because they isolate variables (JTB ≠ knowledge); Thomson’s violinist, despite surrealism, proxies real bodily autonomy dilemmas. Conversely, Chinese Room’s "shuffling man" image presupposes understanding as mere syntax. 

  Their unsettled cases reveal pitfalls: Zombies risk circularity (dispute packed into setup), near-future teleporter exposes intuition plasticity, and trolley-with-named-child exploits affective bias. The principle must flag when emotional salience or ambiguous premises drive verdicts. 

  Ultimately, the user needs a litmus test for undergrads: "Does this experiment disentangle questions or conflate them?" For syllabus inclusion, prioritize cases that survive premise scrutiny and minimize sticky details. Admit that Parfit’s teletransporter—while sci-fi—passes by varying persistence conditions neutrally, whereas Experience Machine’s "tank" imagery is rhetorically loaded. 

  They’ll have to concede that Mary’s case requires disambiguation (fact vs. ability) and that zombie intuitions may reflect conceptual confusion. The principle isn’t perfect—it can’t resolve all conflicts—but it forces transparency about what’s doing the work: logic or rhetoric.
answer: |-
  Here's a cohesive principle that captures your legitimate concerns while forcing you to revise some verdicts, based on epistemic fairness rather than conclusion-preference:

  **A thought experiment legitimately supports a conclusion only if:**
  **(1) The scenario cleanly isolates the target concept/philosophical question,**
  **(2) The intuition it pumps is stable under disambiguation and neutral redescription, and**
  **(3) The conclusion doesn't crucially depend on affectively loaded or question-begging details.**

  **Why this works & what you must revise:**

  1.  **Clean Isolation (Targets the *Question*, not the *Answer*):**
      *   *Motivating Cases:* **Gettier** (isolates JTB vs. knowledge), **Thomson** (isolates bodily autonomy vs. right to life), **Repugnant Conclusion** (isolates aggregation vs. average welfare). **Parfit's Teletransporter** (isolates psychological continuity vs. identity).
      *   *Problem Cases:* **Chinese Room** (fails: The setup *assumes* syntax manipulation isn't understanding - it builds the conclusion against functionalism into the imagery). **Zombie Case** (fails: The "conceivability" *is* the dispute about physicalism; it builds the conclusion against physicalism into the setup by defining "zombie" as physically identical but lacking consciousness). **Experience Machine** (fails in its standard form: The "tank" imagery *is* the picture of hedonism/illusion being bad).
      *   **Revision:** You must **junk the Chinese Room and Zombie cases** as legitimate support for their intended conclusions. They violate (1) by packaging the disputed conclusion into the setup itself. The imagery *is* the argument.

  2.  **Stable Intuition (Robustness under Scrutiny):**
      *   *Motivating Cases:* **Gettier** (flat: "JTB without knowledge? Yes."), **Repugnant Conclusion** (flat: "Vast population with barely positive lives better than small paradise? Counterintuitive."), **Thomson** (flat: "Forced use of your body to save a life? Unjust.").
      *   *Problem Cases:* **Experience Machine** (passes when flat: "Guaranteed optimal experiences forever, never knowing otherwise? Many hesitate." Your initial flat restatement *does* preserve the intuition for many - you just disagree with the intuition. Its failure is under (1) and (3)). **Mary's Room** (fails: The intuition *isn't* stable. "Does she learn a new *fact*?" (No, she knew the physical facts). "Does she gain a new *representation/ability/know-how*?" (Yes). The setup slides between these. It violates (2) due to ambiguity).
      *   **Revision:** You must **revise your rejection of Mary's Room**. Your reason (ambiguity) is correct and covered by (2). It fails because the intuition isn't stable under disambiguation. You can *keep* rejecting it, but for this principled reason.

  3.  **Neutral Detailing (No "Sticky" Persuasion):**
      *   *Motivating Cases:* **Parfit's Teletransporter** (passes: Variations - destruction before/after, one copy/many - probe *what matters* without changing the core identity/survival question via loaded details).
      *   *Problem Cases:* **Experience Machine** (fails: "Floating in a tank" is affectively loaded and depicts the *badness* of illusion). **Utility Monster** (fails: The "monster" imagery deliberately evokes disgust/fear, doing the persuasive work). **Trolley with Named Child** (fails: Naming the child exploits affective bias; the corporate version reveals the core utilitarian calculus without the sticky detail).
      *   **Revision:** You must **junk the standard Experience Machine and Utility Monster presentations** as *rhetorically legitimate support*. Their conclusions rely on (3). You can *discuss* the underlying question neutrally ("Is only experienced pleasure good?" / "Should utility aggregation have limits?"), but the experiments as presented are intuition pumps in the pejorative sense. **Keep your rejection of them.**

  **Reconciling Parfit vs. Experience Machine:**
  *   **Parfit (Legit):** The sci-fi *stands in for* real questions about psychological continuity vs. biological identity in ordinary survival (e.g., severe amnesia + personality change, gradual cell replacement). The variations test the *structure* of what matters. It isolates the question (1), the intuition is stable (2) (people feel continuity matters more than identity), and the details are neutral (3) (scanning machine isn't affectively loaded *against* the conclusion).
  *   **Experience Machine (Illegit Support):** The sci-fi *is* the depiction of the disputed *answer* (hedonism = being trapped in an illusion). The sticky detail (tank) *is* the argument against hedonism (3). While the *flat question* might provoke hesitation, the *standard presentation* violates (1) and (3).

  **Your Unsettled Cases:**

  1.  **Zombie Case:** **Junk it** (by principle). It flagrantly violates (1). The "zombie" *is defined* as physically identical but lacking consciousness – the physicalist *denies* this is conceivable/possible. The setup *assumes* the falsity of physicalism. It's a picture of the disputed conclusion.
  2.  **Near-Future Teleporter (Imperfect Scan):** **Use it carefully.** This *passes* the principle. It isolates the question "What matters in survival?" (1). The intuition shift ("I'd use it") is stable under description (2) (it reveals people track continuity/connectedness, not identity). The details (commute, imperfect scan) are neutral (3) – they don't emotionally prejudice the answer *against* using it. It's a *refinement* of Parfit, showing intuitions track degrees of continuity.
  3.  **Corporate Trolley (Recall = 40 lives, No Recall = 12 lives):** **Use it (and ditch the named-child version).** This *passes* the principle. It isolates the core utilitarian conflict (minimizing harm) (1). The intuition (choose to save more lives) is stable (2). The details (corporate, recall) are affectively neutral relative to the core dilemma (3). The named-child version fails (3) – the sticky detail manipulates the intuition away from the utilitarian calculus.

  **Defensible Rule for Syllabus:**
  "Prioritize thought experiments where the scenario isolates the philosophical question without presupposing the answer, the core intuition holds up when stripped of vivid or emotional language, and the conclusion isn't driven by affectively loaded details. Avoid those that build the disputed conclusion into the setup or rely on rhetorical 'sticky details.'"

  **Honest Summary:** Your initial rule was insightful but slightly off-target. You correctly identified "sticky details" and setup bias, but missed the core issue of *isolating the question* (1) and needed to distinguish ambiguity (Mary) from rhetorical loading (Experience Machine tank). You must **give up Chinese Room, Zombies, and the standard Experience Machine/Utility Monster presentations as legitimate *support* for their conclusions**, and **accept that Mary fails due to ambiguity**. Your judgments on Gettier, Thomson, Parfit, Repugnant Conclusion, and the corporate trolley hold. The near-future teleporter is a keeper. This principle provides a clear, applicable filter for your syllabus.
