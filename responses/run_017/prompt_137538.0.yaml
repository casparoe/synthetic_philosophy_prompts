prompt: |-
  i'm finishing a chapter on ubuntu-style relational personhood — specifically the achievement reading, on which 'person' is a status you come to occupy by being taken up into relations of mutual recognition, not something you have automatically in virtue of your species or your psychological capacities. the bit i'm pushing is that what matters is bidirectionality: you have to be able to *receive* as well as give, because a relation you are never on the receiving end of isn't really mutual, it's just an audience.

  i need a case for a grad seminar that makes this reading bite in the direction nobody expects. so: build me a single paragraph, realistic (a workplace, a parish, a block of flats — no feral children, no comas, no brains in vats), with two living adult characters of perfectly ordinary capacities. one of them, call him M, is the person everyone in the story admires and relies on; the other, call her N, is the person the story's other characters are slightly embarrassed by. the achievement reading has to come out saying M is *less* fully a person than N, and the status view (species-or-capacities, personhood as a flat moral status) has to come out saying they're persons to exactly the same degree.

  constraints: the harsh verdict must fall out of the relational structure of their lives, not from a twist — M isn't secretly embezzling, N isn't secretly a saint, and the neighbourhood's attitudes can't be doing any work (that's the objection i'm trying to answer, that the achievement reading just dressed up social disapproval, so the case has to indict the community's favourite). they should differ along one specifiable structural variable.

  after the paragraph: give me each view's verdict and the reasoning that produces it, say which single feature of the case is doing the work and what happens to the case if you remove that feature (e.g. M lets himself be helped once, badly), and then give me the best available attack from whichever view comes out looking worse — i want to know whether the verdict is really generated by the theory or just relabelled. last line, no hedging: \answer{achievement | status | neither} for who actually gets M right.
reasoning: |-
  We are building a case that highlights the importance of bidirectionality in relational personhood (ubuntu-style achievement reading). We need:
  - Two adult characters: M (admired, relied upon) and N (slightly embarrassing to others).
  - Both have ordinary capacities (no disabilities, no superhuman traits).
  - The relational structure must show that M is less fully a person than N on the achievement reading, but both are equally persons on the status view.
  - The difference must be structural, not based on hidden traits or community attitudes (so the community admires M and is embarrassed by N, but that cannot be the reason for the verdict).
  - The key must be bidirectionality: M is always the giver, never the receiver, while N both gives and receives (even if in ways that are awkward or embarrassing).

  Setting: A workplace (to avoid family ties and make it about chosen relations).

  Paragraph:

  "In the open-plan office of a mid-sized nonprofit, M was the indispensable one: colleagues sought her advice on grant proposals, the director entrusted her with sensitive donor negotiations, and interns leaned on her patient mentorship. She never asked for help, always had the solution, and her calendar overflowed with meetings where others presented their problems. N, by contrast, was the one who'd linger after meetings to share overly personal anecdotes, sometimes tear up when stressed, and once sent a cringingly earnest company-wide email thanking everyone for their 'unseen emotional labor' after a project deadline. While M was admired for her competence, N was tolerated with polite discomfort. Yet N frequently brought homemade cookies to share, asked colleagues about their children's soccer games, and when she struggled with a spreadsheet formula, she'd unabashedly ask the junior staffer at the next desk."

  Reasoning:

  1. **Achievement Reading (Ubuntu-style relational personhood):**
     - Verdict: **M is less fully a person than N.**
     - Reasoning: Personhood is achieved through mutual recognition in bidirectional relationships. 
       - M is always in the position of the giver (advice, solutions, mentorship). She never receives; she never allows herself to be vulnerable or in need. Thus, her relationships are non-mutual: she functions as a resource, not a participant in reciprocal exchange. She is an audience to others' needs but not a recipient. 
       - N, despite her social awkwardness, both gives (cookies, attention to personal details) and receives (asks for help, shares vulnerabilities like tearing up). Her relationships, though sometimes embarrassing, involve bidirectional flows of recognition. She is embedded in mutual relations.
     - The key structural variable: **Bidirectionality of care/recognition.** M only gives, never receives; N both gives and receives.
     - If removed: Suppose M once asks for help (badly) on a minor issue. Then the asymmetry weakens; she might begin to achieve personhood. The verdict would shift toward equality.

  2. **Status View (Species or capacities-based personhood):**
     - Verdict: **M and N are equally persons.**
     - Reasoning: Personhood is a flat status conferred by species membership (human) or basic psychological capacities (e.g., rationality, self-awareness). Both M and N are adult humans with ordinary cognitive and emotional capacities. Therefore, they have equal moral status.
     - The key structural variable: **Inherent capacities.** The view ignores relational structures, focusing only on intrinsic properties.
     - If removed: Not applicable, since capacities are static and not at issue.

  Best Attack from the Status View:
  - "The achievement reading confuses moral worth with social adeptness. M's independence and generosity are virtues, not defects. By tying personhood to reciprocity, you penalize the self-reliant and reward the needy. Worse, you make personhood contingent on others' responsiveness—if no one helped N, would she cease to be a person? The status view avoids this capriciousness by grounding personhood in the inviolable dignity of human beings."

  Best Attack from the Achievement View:
  - "The status view ignores how moral agency is realized in practice. A hermit with no relations might be human but not a 'person' in the moral sense of being embedded in a community of accountability. Your 'flat status' renders invisible the actual work of mutual recognition that sustains ethical life."

  Final Line:
  \answer{achievement}

  Why achievement? Because the case is designed to show that the structural absence of receiving (despite M's virtues) undermines the mutuality required for full personhood in the ubuntu framework, and the status view cannot capture this gradation. The verdict is generated by the theory's core commitment to relationality.
answer: |-
  ### Case Paragraph
  In the bustling community centre of a multicultural neighbourhood, M was the revered coordinator: neighbours praised his tireless dedication, from organising food drives to mediating disputes, and everyone turned to him for solutions. He never showed vulnerability, always offering help but declining even the smallest gestures in return—whether a cup of tea during late meetings or advice on his own struggles. N, meanwhile, was the awkward volunteer who overshared about her divorce during setup, fumbled tasks like poster-hanging, and often asked for reassurance when overwhelmed. While M was celebrated as a pillar, N was met with mild embarrassment—yet she accepted help freely, like when a teen tutored her on social media for outreach, and reciprocated with heartfelt, if clumsy, encouragement during others' low moments.

  ### Verdicts and Reasoning  
  - **Achievement Reading (Ubuntu-style relational personhood)**:  
    **Verdict**: M is *less fully a person* than N.  
    **Reasoning**: Personhood requires bidirectional relations of mutual recognition. M only occupies the role of giver: he gives help but never receives it, refusing even minor reciprocity (e.g., declining tea or advice). This makes his relations non-mutual—he is an audience to others' needs, not a participant in reciprocal exchange. N, despite her social missteps, both gives (encouragement) and receives (tutoring, reassurance), embedding her in genuine mutual recognition. Bidirectionality is structurally present for N but absent for M, diminishing M’s personhood as a relational achievement.  

  - **Status View (Species or capacities-based personhood)**:  
    **Verdict**: M and N are persons *to exactly the same degree*.  
    **Reasoning**: Personhood is an inherent moral status derived from species membership or basic psychological capacities (e.g., rationality, empathy). Both are living adults with ordinary human capacities—neither has impaired cognition or agency. Thus, their social roles or relational dynamics are irrelevant; personhood is a binary, flat status they share equally.  

  ### Key Structural Variable and Counterfactual  
  - **Variable**: **Bidirectionality in exchanges of care/recognition**—M only gives, never receives; N both gives and receives.  
  - **If removed (e.g., M accepts tea once, awkwardly)**: The asymmetry weakens. M now minimally engages in receiving, allowing a thread of mutuality. The achievement reading would soften its verdict, moving toward parity. The status view remains unchanged, as capacities are unaffected.  

  ### Best Attack from the Status View  
  The status view would argue: "The achievement reading conflates moral worth with relational performance. M’s self-reliance is a virtue—his refusal of help reflects admirable independence, not a deficiency in personhood. By making personhood contingent on reciprocity, the achievement reading absurdly implies that isolated individuals (e.g., hermits) or those in hierarchical relationships (e.g., a dedicated nurse who never asks for aid) are ‘lesser persons.’ This reduces personhood to social popularity and punishes excellence. Our view, grounded in universal human capacities, avoids this bias and upholds dignity unconditionally."  

  ### Best Attack from the Achievement View  
  The achievement reading would counter: "The status view ignores how personhood is *lived*, mistaking a bare minimum (capacities) for full moral agency. Without bidirectional relations, M is objectified as a tool—his ‘virtues’ trap him in a one-sided role where he cannot experience mutual recognition. This hollows out personhood, reducing it to a static label. N’s ‘flaws’ foster richer mutuality, proving personhood is dynamic and relationally earned. The status view’s ‘flat’ equality is inert; it cannot explain why M’s isolation is ethically concerning or why N’s reciprocity matters."  

  ### Final Assessment  
  The achievement reading’s verdict arises directly from its core tenet—bidirectionality as constitutive of personhood—while the status view’s equalizing verdict stems from its disregard for relational context. The case indicts M without relying on hidden traits or community attitudes by focusing solely on structural reciprocity.  
  \answer{achievement}
