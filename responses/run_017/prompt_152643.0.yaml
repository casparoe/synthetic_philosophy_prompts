     In the reverse order:
          First set P(red)=0.6 (starting from P(A)=0.8).
                  P(A|red) = 0.9412, P(A|blue)=0.5 (from state after first bead)
                  new P(A) = 0.9412*0.6 + 0.5*0.4 = 0.56472 + 0.2 = 0.76472
          Then set P(red)=0.9.
                  In the new state: P(A)=0.76472.
