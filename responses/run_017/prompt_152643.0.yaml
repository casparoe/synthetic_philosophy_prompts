                  P(A|red) = (0.8 * 0.76472) / 0.658832 = 0.611776/0.658832 ≈ 0.9285
                  P(A|blue) = (0.2 * 0.76472) / (1-0.658832) = 0.152944 / 0.341168 ≈ 0.4484
                  new P(A) = 0.9285 * 0.9 + 0.4484 * 0.1 = 0.83565 + 0.04484 = 0.88049

