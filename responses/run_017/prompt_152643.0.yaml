          P(A|red) = 0.9412 (from before the first nudge) -> but after the first nudge, the state changed. 
     Actually, after the first nudge, we have a new state. The conditional probabilities are based on the state after the first nudge.

     In the state after the first nudge, we have P(A)=0.897. For the second bead, we have:
          P(red|A) = 0.8, P(red|B)=0.2.
