   Now, for the failure of the proportional shift. We want a case where the proportional shift is not appropriate because the nudge also gives information about the internal with a case. In the above, the partition for W and the partition for R are not independent, and updating in different orders matters, but it's not a failure of the method, it's just that the method is order-dependent.

   For a failure, we can have a nudge that is meant to be about one partition but also affects the conditional probabilities within another partition. 

