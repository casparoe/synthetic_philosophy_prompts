     - If we then set the probability of the bead being red to, say, the value we would get if we didn't know about the accuracy difference, we might be in trouble.

     - How to do that without conditioning? The experience should shift our confidence about the bead, but if we set it to a number without taking into account the bag, it might be inconsistent.

     - However, this might be too complicated. 

   Given the complexity and time, I will provide the activity as follows. 

   The activity will have:

   Part 1: 
     - Two bags, beads as above. 
     - One hard evidence: show a red bead. Update to 80% for A.

   Part 2: 
     - A nudge for the second bead: we become 90% confident it's red. 
     - Update to approximately 90% for A.

     - Then, we reveal the second bead: it is blue. 
     - If they had known it was blue, they would have updated to 50% for A.
     - So their current 90% is now shown to be overconfident. This is not a failure of the method per se, because the method is for when you don't get hard evidence. But it shows that the method does not protect you from being wrong if your nudge was misleading.

     - To make it a failure of the proportional shift holding ratios fixed, we can then ask: 
          "But wait, does the experience of the dim light only tell us about the bead? We also have information that the dim light might be more reliable for one bag than the other. Let me now tell you that the dim light is 95% accurate for bag A and only 80% for bag B."
     - Then, the experience of seeing apparent red not only should shift our confidence about the bead, but also about the bag. In the proportional shift we did, we did not account for that. We held the conditional probabilities P(A| bead2=red) and P(A| bead2=blue) fixed from before the nudge, but those conditional probabilities might be affected by the accuracy of the light.

     - This is getting into the weeds.

   Given the time, I will stop and provide the activity with the two-part update (hard and then nudge) and then the revelation to show that the nudge-based update can be wrong.

   For the order dependence, we can do two nudges in a row for two different attributes, but with the rain-sprinkler model. 

   But for simplicity in the activity, we might do two nudges on the same bead. For example, we have two observers. Observer 1 says: "I am 90% sure it's red." Observer 2 says: "I am 60% sure it's red." 

