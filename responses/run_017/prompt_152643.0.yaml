prompt: |-
  I convene a small evening group — fourteen or so regulars, ages from their twenties to their seventies, most of them comfortable with fractions and percentages, and most of them visibly relieved when no algebra appears — that meets for ninety minutes once a month in a room at the public library to work through practical reasoning. We have index cards, dice, a bag of coloured beads, a bag of dried beans, a lamp with a dimmer switch, and a prize at the end worth no more than a bar of chocolate or a raffle ticket. I have been reading about probability and belief revision on my own for about a year, with no formal training, and I have become convinced mainly of one negative thing: the short rule that gets repeated whenever this subject comes up — that a reasonable person just conditions on what she learned — covers only the case where experience hands you a proposition outright.

  Most of actual life is not like that. You catch half of a remark, you see something under a bad light, you get a reading from an instrument you only half trust. Nothing is settled. There is no new fact in your possession; you have simply come away leaning further in one direction than you were leaning before. I want my group to feel the difference between those two situations, and to feel it before anyone names it.

  So I am asking for a runnable activity, and I have some opinions about its shape.

  It should open in the comfortable case: something is simply revealed, everyone updates, and the point of that phase is how unremarkable it is — nobody needs a rule, the arithmetic is forced, and if two such revelations arrive in the other order nobody ends up anywhere different. Then it should move to the difficult case, where participants do not learn anything at all but are nudged: their confidence over a small set of exclusive possibilities is moved by an experience rather than by a fact. I would like them to invent the obvious repair themselves — spread the shift across the cases in proportion, leaving the relative odds inside each case exactly as they were — and I would like them to commit to specific numbers, physically, before anyone discusses method. Ten beans pushed around on an index card will do; I do not want numerals floating in the air.

  Then I want two things to happen to them that they cannot talk their way out of.

  First, the repair should fail somewhere. There should be a case where the nudge does not just move their confidence about which case they are in, but also tells them something about the inside of a case, so that holding those internal ratios fixed produces something they can see is wrong. I would rather they discover this than be told it, and I would rather the discovery be about a case they have already committed numbers to.

  Second, the order should matter. If two nudges arrive and they apply the repair to each in turn, they should be able to end up in detectably different places depending on which came first — and nothing in the setup should tell them which order is the right one. I would like the scoring arranged so that someone who notices this can exploit it, or at least so that the discrepancy shows up in the record rather than in a disagreement they can shrug off.

  Constraints, some of them negotiable if you say why: no lecture and no formula on any surface until after the last bean has been moved; no medical-test scenario, no politics, nothing requiring specialised background; a payoff scheme that makes honest reporting of a number the best policy and that I can run from a printed card without doing arithmetic in my head; one facilitator plus at most one helper; robust to a participant who is clever and contrary; and nothing that requires anyone to be singled out or embarrassed. Please give me the actual numbers to load into the bag and the actual sizes of the nudges, chosen so the effects are large enough to survive rounding and argument, and a minute-by-minute timeline with a note of where I can cut.

  I also want a debrief that does more than summarise. It should map specific moments in the activity onto specific parts of the underlying idea, and it should tell me what will predictably go wrong: the person who insists the nudge was really just a signal they could have conditioned on; the person who refuses to commit to a number because they do not want to be wrong; the group splitting into two camps and each camp assuming the other has misunderstood the rules; the participant who works out that the whole thing has been arranged and says so, correctly. And I want you to be frank about what the activity cannot reproduce and what I will simply have to say myself — I assume at least this: that real experience does not arrive already sorted into a labelled set of exclusive cases, and that the cases here are discrete and few while actual confidence moves continuously.

  One request that matters to me more than the rest. If the order-dependence I am expecting is not real for the situation as I have described it — if a properly specified update of the kind I am groping toward would give the same answer either way, and the difference my group thinks it has found is an artefact of sloppy set-up — tell me so plainly, and tell me what feature I would have to add to the set-up to make the order genuinely matter, and what that would cost me in realism. I would much rather hand fourteen people a smaller truth than a manufactured one. By the same token, if the thing I have been calling a nudge has an established name and an established formula, tell me the name and write the formula down for my own reading — with the notation explained, since I will be reading it alone — and tell me whether soft evidence and conditioning on a weighted mixture are the same proposal under two descriptions or two different proposals. I have seen both characterisations online, I suspect at least one of them is a distortion, and I do not want to repeat to fourteen people a slogan I only half understand. None of that vocabulary should enter the room on the night.

  What I want them to be able to say on the way out, in their own words, is why the familiar advice is not advice you can follow when nothing has been learned, and why the natural way of following it anyway is a decision you make rather than a conclusion that follows.
reasoning: |-
  We are going to design an activity that meets the specifications. The activity will have three phases:

  Phase 1: Conditioning on a fact (unremarkable update)
  Phase 2: Updating on a nudge (proportional shift without changing internal ratios)
  Phase 3: Two nudges applied in different orders leading to different outcomes, and a situation where the proportional shift breaks.

  We'll use a scenario with two bags of beads. Each bag contains beads of two colors, say red and blue. The bags are set up so that the color distributions are different. We will have two possible worlds: Bag A and Bag B.

  We'll start by having the group assign prior probabilities to which bag is in use. Then we'll have two kinds of evidence:

  1. Hard evidence: A bead is drawn and shown to everyone. They update by conditioning.
  2. Soft evidence: An unreliable witness reports the color of a bead. The witness has a known accuracy rate (say 70%). But note: we are not going to condition on the witness's report as a fact. Instead, we are going to treat the witness report as a nudge: it shifts our confidence about the color, but we don't take it as a fact.

  However, the request is for a scenario without specialized background and without medical tests. So let's reframe the soft evidence without a witness. Instead, we can have an experience that is ambiguous: for example, seeing the bead under a dim light that makes it hard to distinguish the color. We might say: "Under the dim light, the bead looked red, but it might have been blue." And we can quantify the effect of the dim light: it makes red beads look red 90% of the time and blue beads look red 30% of the time (or some other numbers). But note: the participant does not get the proposition "the bead is red", but rather a nudge that shifts their belief toward red.

  But the facilitator wants to avoid algebra and formulas. So we need a way to convey the nudge without probabilities. We can do this by having a helper (or the facilitator) give a statement that is known to be somewhat reliable but not perfectly. However, we want to avoid the medical test scenario. So let's try a different setting.

  Alternative scenario: We have two dice. One is fair (D6), the other is loaded (say, it has a 1/3 chance of showing 6 and 5/36 for each other face). We are going to roll a die, but we don't know which one. We'll have two kinds of evidence:

  1. Hard evidence: The die shows a 6. Then we condition.
  2. Soft evidence: We are told by an unreliable observer who says "I think it's a 6", but we know this observer is only 70% accurate (meaning that when the die shows a 6, the observer says "I think it's a 6" 70% of the time, and when it's not a 6, the observer says "I think it's a 6" 30% of the time). But note: we don't want to condition on the fact that the observer said "6", we want to treat it as a nudge that moves our confidence without giving us a fact.

  This is tricky because the observer's statement is a fact: we know that the observer said "6". But the outcome of the die is not known. How do we update without conditioning? The idea of soft evidence (or Jeffrey conditionalization) is that we shift the probability of the partition (the die face) without taking the statement as a fact. Instead, we are going to change the probabilities of the faces in a way that reflects the nudge.

  But note: the problem is that the observer's statement is about the die face, and the die face is the outcome we care about. So we have two levels: the identity of the die (fair or loaded) and the outcome of the roll. We can set up the nudges to be about the outcome, but we are ultimately interested in the identity of the die.

  Alternatively, we can set up a scenario with two coins: one fair, one biased (say 2/3 heads). We flip the coin twice. We want to know which coin it is. We get two kinds of evidence:

  1. Hard: we see the outcome of one flip (say, heads).
  2. Soft: we get a nudge about the outcome of one flip (e.g., "it looked like heads, but it was hard to see").

  However, we are asked for a runnable activity with beans and index cards. So let me propose the following:

  We have two bags of beads. Bag A has 8 red and 2 blue. Bag B has 2 red and 8 blue. We are going to pick one bag at random (say, by flipping a fair coin). The group's prior is 50-50 for which bag was picked.

  Phase 1: Conditioning on a fact.
  We draw a bead from the bag and show it: it's red. Now they update: P(Bag A | red) = [P(red|A)*P(A)] / [P(red)] = (0.8 * 0.5) / (0.5*0.8 + 0.5*0.2) = 0.4 / 0.5 = 0.8. So they should put 80% of their beans on Bag A and 20% on Bag B.

  Phase 2: A nudge.
  Now we do a second draw. But we don't show the bead. Instead, we look at it under a dim light. We tell the group: "Under the dim light, red beads look red 90% of the time and blue beads look red 10% of the time." [This is the reliability of the dim light.] Then we say: "I looked under the dim light and it looked red." But note: we are not going to condition on "the bead is red". Instead, we are going to treat the experience as a nudge that shifts our belief about the color of the second bead. How do we shift? We want to shift the probabilities for the color of the second bead. But note: the group's belief is about the bag, not directly about the bead. We have to update the bag probabilities given the nudge about the bead.

  But the nudge is about the bead, not the bag. So we have to connect the two.

  We can do this by having the group update in two steps:

  Step 1: Update their beliefs about the color of the second bead given the nudge. This is where we apply the proportional shift. The nudge (the dim light making it look red) should shift the probability that the bead is red. How? The group has a prior about the second bead: 
  P(red) = P(red|A)*P(A) + P(red|B)*P(B) = 0.8*0.8 + 0.2*0.2 = 0.64 + 0.04 = 0.68? Wait, no: after the first update we have P(A)=0.8, P(B)=0.2. So for the second bead: 
  P(red) = P(red|A)*P(A) + P(red|B)*P(B) = 0.8*0.8 + 0.2*0.2 = 0.64+0.04=0.68.

  But the nudge: we saw it looked red. The reliability: 
  P(look_red | red) = 0.9, P(look_red | blue) = 0.1.

  But we are not going to condition. Instead, we are going to set the new probability for the bead being red to be the old probability conditioned on the experience? That is conditioning. We don't want that.

  The idea of Jeffrey conditionalization is that we take the old probabilities and we set the new probabilities for the partition (the color) to a new value. How do we get that new value? We can compute it by conditioning if we want, but that's not the point. The point is that we are handed a shift in the partition probabilities.

  But in the scenario, we are handing them a nudge that is equivalent to a shift. How about we tell them: "After seeing the bead under the dim light, I now feel that the probability that the bead is red is 90%." But that's just giving them a new probability? We want them to compute the shift? 

  Alternatively, we can avoid numbers for the nudge. We can say: "The dim light experience makes me more confident that the bead is red." And then we can ask the group: "How much more confident? We know that under the dim light, when the bead is red it looks red 90% of the time, and when it is blue it looks red 10% of the time. But we don't know for sure what happened. So we are going to shift our probability for the bead being red. We can compute the shift: the likelihood of the experience (looking red) is 0.9 for red and 0.1 for blue. So the new odds for red vs blue would be (0.9/0.1) * (old odds). But that is conditioning on the experience! 

  This is confusing. The facilitator wants to avoid conditioning and instead have a nudge that is not a proposition. 

  Another idea: we don't quantify the nudge. We just say: "I saw the bead under the dim light and it looked red to me. That makes me more confident that the bead is red. Let's say that my confidence for red has gone up to 90%." Then the group can update the bag probabilities by taking the new probability for the color and then updating the bag accordingly. Specifically, we can use the law of total probability:

  P(A) = P(A | red) * P(red) + P(A | blue) * P(blue)

  But note: we are changing P(red) and P(blue) to 0.9 and 0.1. And we leave P(A | red) and P(A | blue) fixed? 

  But what are P(A | red) and P(A | blue)? They are from the prior state (after the first update). 

  After the first bead (red), we have P(A)=0.8, P(B)=0.2. Now, for the second bead, we have:
  P(A | red) = P(red|A)*P(A) / P(red) = 0.8*0.8/0.68 = 0.64/0.68 ≈ 0.941
  P(A | blue) = P(blue|A)*P(A) / P(blue) = 0.2*0.8/0.32 = 0.16/0.32 = 0.5

  But note: we are updating the probability of the second bead color to 0.9 for red and 0.1 for blue. Then the new probability for A becomes:
  P(A) = P(A|red)*0.9 + P(A|blue)*0.1 = 0.941*0.9 + 0.5*0.1 ≈ 0.8469 + 0.05 = 0.8969

  But this is Jeffrey conditionalization. The problem is that we are giving the new probabilities for the color partition arbitrarily (we set it to 0.9). How did we get 0.9? We got it from the reliability of the dim light? But then we are conditioning on the experience. 

  The facilitator wants to avoid that. We want the nudge to be a shift without a fact. So perhaps we don't want to use the dim light scenario. 

  Alternative: we have two coins, one fair and one biased (2/3 heads). We flip the coin twice. We have two possible worlds: fair or biased. We are going to get two kinds of evidence:

  1. Hard: one flip is shown as heads.
  2. Soft: for the other flip, we get a nudge. We are told by an observer who is known to call heads 70% of the time and tails 30% of the time regardless of the truth. But then the observer's call is a fact. We don't want that.

  Another idea: we have a bag of beans. We are going to draw a bean, but we don't show it. We have two scales: one that is accurate and one that is broken. We weigh the bean. The accurate scale would tell the weight exactly, but the broken scale always reads 10g. We don't know which scale we are using. But then we get a weight reading. If we get 5g, then we know we have the accurate scale and the bean weighs 5g. But if we get 10g, we don't know if it's because the scale is broken or because the bean weighs 10g. This is a standard example for Jeffrey conditionalization.

  But let's adapt it to our bead bags. We have two bags: Bag A has 8 red, 2 blue; Bag B has 2 red, 8 blue. We also have two scales: one accurate, one broken (always says "red"). We pick a bag and a scale at random (each 50%). We draw a bead and weigh it. The accurate scale reports the true color (say, by weight: red beads weigh 5g, blue beads weigh 10g). The broken scale always reports 5g (which would be red). We get a reading of 5g. What is the probability that the bag is A?

  This is a classic Jeffrey case. We have a partition by scale and by bag. But we want to update on the reading. The reading of 5g could come from:
  - The scale is accurate and the bead is red.
  - The scale is broken.

  We cannot condition on "the bead is red" because we don't know that. We only know the scale read 5g.

  We can compute:
  P(A | reading=5g) = P(reading=5g | A) * P(A) / P(reading=5g)

  P(reading=5g | A) = P(reading=5g | A, accurate) * P(accurate) + P(reading=5g | A, broken) * P(broken)
  = [P(red|A) * 1 + P(blue|A)*0] * 0.5 + [1] * 0.5
  = (0.8 * 1) * 0.5 + 1 * 0.5 = 0.4 + 0.5 = 0.9

  Similarly, P(reading=5g | B) = (0.2 * 1) * 0.5 + 1 * 0.5 = 0.1 + 0.5 = 0.6

  P(reading=5g) = P(reading=5g | A)*P(A) + P(reading=5g | B)*P(B) = 0.9*0.5 + 0.6*0.5 = 0.45+0.3=0.75

  Then P(A | reading=5g) = 0.9 * 0.5 / 0.75 = 0.45 / 0.75 = 0.6

  But this is conditioning on the proposition "reading=5g". That is a fact. We are handed a proposition. We are not handed a nudge.

  We need a nudge that is not a proposition. 

  Let me try to reframe with the dim light, but without conditioning. We tell the group: "I looked at the bead under the dim light and it appeared red to me. I know that under this light, red beads appear red 90% of the time and blue beads appear red 10% of the time. However, I am not sure what I saw. I am not saying the bead is red. I am just saying that after this experience, I am more inclined to think it's red. Specifically, I now feel that the probability that the bead is red is 0.9."

  Then we ask the group to update their belief about the bag given this new belief about the bead. They will do this by:

  P(bag=A) = P(bag=A | bead=red) * P(bead=red) + P(bag=A | bead=blue) * P(bead=blue)

  But we are setting P(bead=red)=0.9 and P(bead=blue)=0.1. And we use the conditional probabilities from the prior state (after the first bead).

  After the first bead (which was red and shown), we have P(A)=0.8. For the second bead, we have not drawn it yet, but we are about to. The group's belief about the second bead, before the nudge, is:
  P(bead2=red) = P(red|A)*P(A) + P(red|B)*P(B) = 0.8*0.8 + 0.2*0.2 = 0.64+0.04=0.68

  Then we get the nudge and we set P(bead2=red)=0.9.

  The conditional probabilities P(A|bead2=red) and P(A|bead2=blue) are computed from the prior to this update (which includes the first bead). They are:

  P(A|bead2=red) = [P(bead2=red|A) * P(A)] / P(bead2=red) = (0.8 * 0.8) / 0.68 = 0.64/0.68 ≈ 0.9412
  P(A|bead2=blue) = [P(bead2=blue|A) * P(A)] / P(bead2=blue) = (0.2 * 0.8) / (0.32) = 0.16/0.32 = 0.5

  Then the new P(A) = 0.9412 * 0.9 + 0.5 * 0.1 = 0.84708 + 0.05 = 0.89708 ≈ 0.90

  So they would update to about 90% for bag A.

  But how do they know to use 0.9 for the probability of red? We told them that the nudge makes us set it to 0.9. But why 0.9? Because of the reliability of the dim light. But then we are conditioning on the experience to get that 0.9. 

  The facilitator wants to avoid that. We want the nudge to be a direct shift in confidence without going through the reliability numbers. So perhaps we should not mention the 90% and 10% to the participants. Instead, we just say: "After seeing it under the dim light, I am now 90% sure that the bead is red." And we leave it at that. The participants don't need to know how we got that 90%. We are giving them the new probability for the bead color as a result of the nudge.

  Then the update they do is a mechanical application of the law of total probability with the new probabilities for the bead color.

  This meets the requirement of proportional shift: we leave the conditional probabilities P(A|bead=red) and P(A|bead=blue) unchanged, but we change the weights (P(bead=red) and P(bead=blue)).

  Now, for the failure: we want a case where holding the internal ratios fixed is wrong. This happens if the nudge also tells us something about the bag directly. For example, if the nudge is not about the bead but about the bag. But in our setup, the nudge is about the bead. How can it tell us about the bag? It might if the reliability of the dim light depends on the bag. For example, suppose that the dim light is more reliable for bag A than for bag B. But that might be artificial.

  Alternatively, we can have a different kind of nudge. We can have a witness who is more likely to say "it looks red" if the bag is A than if the bag is B, regardless of the bead color. That would be a direct nudge on the bag. But then it's not about the bead.

  We want a nudge that is about the bead but also indirectly about the bag. Let's change the scenario. 

  Suppose we have two bags: Bag A and Bag B. But now the bags have beads of different sizes. Bag A has large beads (which are easier to see) and Bag B has small beads (harder to see). We draw a bead. We then look at it under the dim light. The reliability of the dim light depends on the size: for large beads, the light is 90% accurate; for small beads, it is 70% accurate. So the nudge (the experience of seeing red) not only tells us about the bead color but also about the bead size, which is directly tied to the bag.

  So let's set up:

  Bag A: 8 large red, 2 large blue. (large beads)
  Bag B: 2 small red, 8 small blue. (small beads)

  We pick a bag at random (50-50). We draw a bead. We then look at it under the dim light and it looks red. We want to update on this experience.

  If we try to apply Jeffrey conditionalization by shifting the probability of the bead being red, we have to set a new probability for "red". But how? The experience is not just about the color but also about the size. We cannot set a new probability for "red" without knowing the size, and the size tells us the bag.

  This might be too complicated.

  Alternatively, we can have a nudge that is not about the bead but about the bag. For example, we hear a rumor that the bag was stored in a red cabinet, which might make it more likely to be bag A (because we know bag A was stored in a red cabinet 80% of the time, etc). But then it's a nudge directly on the bag.

  We want the nudge to be about an observation that is not the bag identity.

  Let's go back to the first simple scenario with the two bags and two bead draws. We will have two nudges. The first nudge is about the second bead: we become 90% sure it's red. The second nudge is about the first bead: we then become less sure about the first bead because we recall that the lighting was also bad then, and we now think that for the first bead, we are only 80% sure it was red. 

  Then we do the updates in different orders:

  Order 1: 
  - Start with 50-50.
  - First bead is shown as red: update to 80% A, 20% B.
  - Then for the second bead, we get a nudge: we become 90% sure it's red. Update to about 90% A.

  Order 2:
  - Start with 50-50.
  - Before any bead is drawn, we get a nudge for the second bead: we become 90% sure it's red. But we haven't drawn it yet. This is a bit awkward because the second bead hasn't been drawn.
  - Then we draw the first bead and see it as red: update.

  But this is messy.

  We can have two beads drawn at the same time. We show the first bead as red (hard evidence). Then we have two nudges for the second bead: one from an observer and one from another observer, or one from the dim light and one from a different experience.

  But we want two nudges that are about different things and that don't commute.

  Alternatively, we can have one nudge that is about the bead and another nudge that is about the bag.

  Let me propose the following scenario for the non-commutativity:

  We have two bags: A and B.
  We have two coins: one fair, one biased (2/3 heads).

  We are going to do two things:
  1. Flip a coin to decide which bag to use: if heads, bag A; if tails, bag B. But we don't see the coin flip.
  2. Draw a bead from the chosen bag.

  We want to know which bag was chosen.

  Evidence 1: We are told that the coin flip landed heads. This is hard evidence.
  Evidence 2: We are told that the bead drawn is red. But this is not shown; instead, we have a nudge: we become 80% sure the bead is red.

  But note: the bead is drawn from the chosen bag. The probability of red given the bag is known.

  We can do the updates in two orders.

  Order 1:
  - Start with P(A)=0.5 (since the coin is fair).
  - We get the hard evidence: the coin landed heads. So now P(A)=1.
  - Then we get the nudge: we become 80% sure the bead is red. But since we know the bag is A, and in bag A, P(red)=0.8, this nudge doesn't change anything? Because if we are already at P(red)=0.8, then setting it to 0.8 is no change. 

  Order 2:
  - Start with P(A)=0.5.
  - We get the nudge: we become 80% sure the bead is red. 
    How do we update? We need P(A | bead=red) and P(A | bead=blue) from the prior.
    P(bead=red) = P(red|A)*P(A) + P(red|B)*P(B) = 0.8*0.5 + 0.2*0.5 = 0.4+0.1=0.5.
    P(A|bead=red) = (0.8*0.5)/0.5 = 0.8.
    P(A|bead=blue) = (0.2*0.5)/0.5 = 0.2.
    Then new P(A) = 0.8 * 0.8 + 0.2 * 0.2 = 0.64 + 0.04 = 0.68.
  - Then we get the hard evidence: the coin landed heads. This forces P(A)=1.

  So in Order 1: P(A) goes 0.5 -> 1 -> 1.
  In Order 2: P(A) goes 0.5 -> 0.68 -> 1.

  They end in the same place.

  We need two nudges that do not commute.

  Jeffrey conditionalization does not commute in general. We need two different partitions.

  Let me use a classic example from the literature. We have two propositions: 
  - R: it is raining.
  - S: the sprinkler is on.

  We start with a prior: say P(R)=0.4, P(S)=0.5, and they are independent.

  Then we have two experiences:
  1. We look out the window and it appears wet. This experience shifts our belief about the ground being wet. The ground being wet (W) can be caused by rain or by the sprinkler. But we don't have a direct partition on W. We have to define it.

  But we can simplify. We'll have a partition on W (wet or not wet). Then we have:
  P(W|R,S) = 1 if either R or S is true? But then if both are true, it's wet. But we might have: 
  P(W| R=true, S=true) = 1
  P(W| R=true, S=false) = 1
  P(W| R=false, S=true) = 1
  P(W| R=false, S=false) = 0

   So W = R or S.

   Then the probability of W is:
   P(W) = 1 - P(not R and not S) = 1 - (0.6*0.5) = 1-0.3=0.7.

   We then have two experiences:
   Experience 1: shifts our belief about W to 0.9.
   Experience 2: shifts our belief about R to 0.6.

   We then do the updates in two orders.

   Order 1: 
   Step 1: Shift W to 0.9. Then we update P(R) and P(S) using Jeffrey conditionalization.
   Step 2: Shift R to 0.6. Then update.

   Order 2:
   Step 1: Shift R to 0.6. Then update.
   Step 2: Shift W to 0.9. Then update.

   These will give different results.

   How to make this runnable with beans and index cards? We have three states: 
   - State 1: R and S
   - State 2: R and not S
   - State 3: not R and S
   - State 4: not R and not S

   We start with priors: 
   P(state1) = P(R and S) = 0.4 * 0.5 = 0.2
   P(state2) = P(R and not S) = 0.4 * 0.5 = 0.2
   P(state3) = P(not R and S) = 0.6 * 0.5 = 0.3
   P(state4) = 0.6*0.5=0.3

