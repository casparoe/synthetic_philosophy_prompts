   Activity: 

   We have two bags: Bag A and Bag B.
   Bag A has 8 red and 2 blue beads.
   Bag A has 2 red and 8 blue beads.

   We will have two rounds of evidence.

   Round 1: 
     - We draw a bead and show it to everyone. It's red.
     - They update: prior 50-50, then posterior for A: 
          P(A|red) = (0.8 * 0.5) / (0.8*0.5 + 0.2*0.5) = 0.4/0.5=0.8.
     - They move beans: 80% on A, 20% on B.

   Round 2:
     - We draw a second bead. This time, we do not show it. 
     - We tell them: "We looked at it under a dim light. We know that under this light, when a bead is red, it appears red 90% of the time and blue 10% of the time. When a bead is blue, it appears blue 90% of the time and red 10% of the time. However, in this case, it appeared red."
     - But then we say: "But we are not going to condition on the bead being red. Instead, this experience has made us 90% confident that the bead is red. So we are now going to set the probability that the bead is red to 90%."

     - They then update the probability for the bag using this new information about the bead.
          They have from round 1: P(A)=0.8, P(B)=0.2.
          For the second bead, they have conditional probabilities:
            P(bead2=red|A) = 0.8, P(bead2=blue|A)=0.2
            P(bead2=red|B) = 0.2, P(bead2=blue|B)=0.2

          But they need P(A| bead2=red) and P(A| bead2=blue) from the current state.
          P(bead2=red) = 0.8*0.8 + 0.2*0.2 = 0.64+0.04=0.68 (from their current beliefs).
          So:
            P(A| bead2=red) = (0.8 * 0.8) / 0.68 = 0.64/0.68 ≈ 0.9412
            P(A| bead2=blue) = (0.2 * 0.8) / (0.32) = 0.16/0.32 = 0.5 (because P(bead2=blue)=1-0.68=0.32)

          Then new P(A) = P(A| bead2=red) * 0.9 + P(A| bead2=blue) * 0.1 = 0.9412*0.9 + 0.5*0.1 = 0.84708 + 0.05 = 0.89708

          So they should move to about 90% for A.

     - Note: we are not using the reliability to condition, we are using it to set the new probability of the bead being red to 0.9. Then we update mechanically.

   For the failure: 
     - We then reveal that the second bead was actually blue. 
     - The group can see that their updated probability for A was 90%, but then if they condition on the bead being blue, they would have:
          P(A| bead2=blue) = 0.5, as above.
     - This shows that the proportional shift (Jeffrey conditionalization) does not force the conditional probabilities to remain fixed if we later get hard evidence. It is only an update for when we don't get hard evidence.

     - But this might not be the failure requested. The facilitator wants a case where the proportional shift is applied, but it is not appropriate because the nudge also tells us something about the bag. 

     - We can arrange that by having the reliability of the dim light depend on the bag. For example, the dim light is more accurate for bag A than for bag B. 
