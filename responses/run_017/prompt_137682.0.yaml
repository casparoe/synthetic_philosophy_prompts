  Hmm, the core tension seems to be between their phenomenological stance (first-person reports as authoritative) and functionalist leanings (defining unpleasantness via aversion). Point 6's inverted asymbolia case is the critical fracture line - it directly pits behavioral responses against subjective reports. The user's flatmate was sharp to notice that point 3 and point 4 are in covert conflict here.

