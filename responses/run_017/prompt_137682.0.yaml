  Point 7's climber case is less problematic than it first appears. The user carefully distinguishes between pain's unpleasantness and overall judgment of the experience. That's compatible with point 1 if we read "bad for the person" narrowly as the raw feeling, not the holistic evaluation. Smart framing. 

