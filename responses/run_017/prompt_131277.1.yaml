prompt: |-
  I had a long argument on Saturday with a friend who works in structural biology, and I want to know whether the philosophical literature can settle it well enough to change what my team actually does on Monday. Her position was that a function annotation should simply record what the gene product currently contributes to the organism that carries it — that selection history is a separate, optional piece of information, and that mixing the two into one field is what makes our annotations incoherent. My position was that this throws away the difference between what a trait is *for* and what it happens to do, and that it leaves us unable to say that anything has gone wrong: if function is just current contribution, then a protein that no longer performs the effect it was maintained for isn't malfunctioning, it just isn't contributing. We went back and forth for about two hours and got nowhere, and I suspect we were each defending a different thing the word "function" might be picking out.

  I am the curation lead for a genome-function database maintained by a small consortium. We process roughly forty annotation tickets a week with a staff of twelve curators who have master's-level training in molecular biology and no philosophy. Each curator has about fifteen minutes per ticket. The output has to be one of a small closed set of labels that can be entered directly into the database, because our annotations are consumed downstream by a machine-learning group that predicts phenotype from genotype and, indirectly, by clinical partners who use them to decide whether a loss-of-function variant is worth investigating in a rare-disease case. Routine annotations are signed off by the curator; anything that changes an already-published annotation has to go to me and, if it affects more than a handful of entries, to the consortium steering group.

  My team has floated a compromise I want you to evaluate rather than assume: split the existing "function" field into three subfields — a selected-effect field (what, if anything, the trait appears to have been maintained by selection for), a current-contribution field (what it now systematically does that bears on some capacity of the system), and a provenance field recording what kind of evidence supports each — and then let downstream users choose which one they care about. I want to know whether that split dissolves the disagreement or merely relabels it, in particular for the cases where a user needs a single answer and cannot be given two.

  Please write the procedure we would actually run on a ticket: the questions in order, what counts as a sufficient answer to each, where the procedure stops and returns no annotation, and where it hands the decision to a person because the remaining question is not one the evidence can settle. It has to be usable by someone who has never heard the etiological/causal-role distinction, so say explicitly which of the philosophical distinctions must survive that simplification and which can be dropped without loss. Most of our tickets do not come with a phylogeny or a selection scan and we cannot afford to produce one, so the procedure has to say what to do when the historical evidence simply isn't there. Flag the steps that are judgment calls dressed up as procedure.

  Then run it on three stylized tickets of the kind we get.

  1. A light-gated ion channel in a soil bacterium, acquired from an unrelated lineage by horizontal transfer within the last few decades, spreading in the population, and shown in assay to modulate the cell's response to a wavelength present in its current environment. Both the historical and the present-day stories appear to point the same way; I want to see whether the procedure wastes a curator's time confirming this or clears it in one step.

  2. An opsin-like light-sensitive protein in a vertebrate lineage that has lived in permanent darkness for a very long time. The protein is still expressed in tissue beneath the skin, still binds its chromophore, and still changes conformation when illuminated in the lab, but nothing in the animal's life is affected by light, and the gene shows signs of relaxed selection. A colleague has pointed out that the protein also binds and sequesters a metal ion, and that this sequestration measurably improves survival in the chemistry of the cave water.

  3. A gene whose product was maintained by selection for a metabolic step that no longer occurs in the organism's current environment, because the organism now obtains the metabolite from a host. The same protein, as a matter of present causal structure, binds a host protein and suppresses a host immune response, and that suppression is the only thing about it anyone currently cares about. I want this ticket annotated as immune suppression, and I want you to run your procedure honestly even if it refuses to say that: if it does refuse, tell me what it says instead and why I should live with it.

  Finally, tell me what the procedure cannot do: which tickets it will misclassify systematically, which of our existing annotations it would force us to revisit if we applied it retroactively, and what I should say to the steering group if they ask whether adopting it commits us to one side of the philosophical dispute. Please don't give me citations or a reading list; I'll handle the literature myself.
reasoning: |-
  Hmm, the user is a curation lead for a genome-function database who had a heated argument with a structural biologist colleague about how to define "function" in annotations. The core dispute is whether function should be based on evolutionary history (selected effect) or current causal role. This isn't just academic—it directly impacts how their team labels genes starting Monday.

  The user has proposed a compromise: splitting the function field into three subfields (selected effect, current contribution, and provenance). They want me to evaluate whether this resolves the philosophical tension or just relabels it, and crucially, they need a practical annotation procedure that their master's-level biologists can execute in 15 minutes per ticket.

  Key constraints: The procedure must be philosophy-agnostic, work without phylogeny data, handle cases where only one answer is needed downstream, and explicitly flag judgment calls. They also want three test cases run through the procedure.

  For the procedure design, we'll need:
  - A strict evidence-first workflow (no philosophical debates)
  - Clear stopping rules for insufficient evidence
  - Explicit fallbacks for missing historical data
  - Machine-readable outputs with provenance
  - Danger zones where curators must make judgment calls

  The test cases are perfectly chosen to stress-test the system:
  1. Easy consensus case (should be fast-tracked)
  2. Function-switch case (tests historical vs current conflict)
  3. Repurposed gene case (where user wants current function prioritized)

  Downstream implications matter most here. Clinical users need unambiguous "malfunction" flags (which only selected effect provides), while structural biologists care about mechanistic behavior. The three-field split actually serves both by separating concerns, but we must warn about cases where:
  - Relaxed selection makes historical function ambiguous
  - Horizontal transfer blurs "selected for whom" questions
  - Current contribution might be ephemeral (like the cave protein)

  The steering group will care about coherence, not philosophy. We can position this as evidence-based pragmatism: "We're not choosing sides; we're exposing the evidence layers that always existed but were previously conflated."

  Notably, the procedure forces explicit nulls ("SE unknown") instead of implied assumptions. This will require revisiting old annotations where historical evidence was assumed but not recorded. That's painful but necessary for clinical reliability.
answer: |-
  Here's a practical annotation procedure designed to resolve your operational conflict without requiring philosophical training. It prioritizes evidence, separates historical and current claims, and enforces fallbacks when evidence is missing. **The key surviving distinction is between evidence-supported historical maintenance (SE) and evidence-supported current mechanistic behavior (CC). Provenance forces explicit evidence tracking.**

  ---

  ### **Annotation Procedure**  
  *(Time target: 12-15 minutes/ticket)*  

  1. **Question 1: What does the gene product *currently and systematically* do in the organism’s *present* biological context?**  
     - **Sufficient answer:** Experimental evidence (e.g., biochemical assay, knockout phenotype, interaction data) showing a consistent mechanistic effect *in vivo* or *in situ*.  
     - **Stop/return if:** No direct evidence exists (e.g., only computational predictions). Return "CC: Unknown".  
     - **Judgment call:** Deciding if evidence is "systematic" (e.g., a single paper vs. replicated studies).  

  2. **Question 2: Is there evidence this trait was *maintained by historical selection* for a specific effect?**  
     - **Sufficient answer:** Phylogenetic conservation + adaptive signatures (e.g., dN/dS), experimental fitness impact in ancestral environment, or clear vestigial structure.  
     - **Stop/return if:** No historical data exists. Return "SE: Unknown".  
     - **Judgment call:** Assessing if conservation implies selection (e.g., purifying selection vs. drift). Horizontal transfer defaults to "SE: Unknown" unless donor lineage evidence exists.  

  3. **Question 3: Do SE and CC conflict?**  
     - **If CC = SE or either unknown:** Proceed to Step 4.  
     - **If CC ≠ SE:** Flag for human review (curation lead). *Example: A trait with historical function X but current function Y.*  

  4. **Question 4: Assign provenance codes:**  
     - **SE Provenance:** `Experimental` (fitness assay), `Comparative` (phylogeny/selection scan), `Inferred` (vestigial structure), or `Unknown`.  
     - **CC Provenance:** `Experimental` (direct assay), `Genetic` (knockout phenotype), `Correlative` (expression + environment), or `Unknown`.  

  5. **Output:** Populate three database fields:  
     ```sql
     SE: [Effect] / [Provenance]  // e.g., "Phototaxis / Comparative"  
     CC: [Effect] / [Provenance]  // e.g., "Ion sequestration / Experimental"  
     Conflict_Flag: [Yes/No]  
     ```  
     - **No annotation if:** Both SE and CC are "Unknown".  
     - **Human escalation if:** Conflict_Flag = Yes, or provenance is weak (e.g., `Correlative` only).  

  ---

  ### **Test Cases**  
  **Case 1: Bacterial Light-Gated Ion Channel**  
  - Q1 (CC): Assay shows modulation of light response → "CC: Light-gated ion channel / Experimental".  
  - Q2 (SE): Horizontal transfer (recent) → "SE: Unknown / Unknown" (no historical evidence in *this* lineage).  
  - Q3: No conflict → Output.  
  - **Result:** Cleared in 3 minutes. No SE claim due to lack of lineage history.  

  **Case 2: Cave Vertebrate Opsin-like Protein**  
  - Q1 (CC): Binds metal ion, improves survival → "CC: Metal ion sequestration / Experimental".  
  - Q2 (SE): Relaxed selection, vestigial photoreception → "SE: Photoreception / Inferred (vestigial)".  
  - Q3: Conflict (Photoreception ≠ Sequestration) → Escalate to curation lead.  
  - **Lead decision:** Keep both. SE documents decay; CC captures current role. Downstream users filter by field.  

  **Case 3: Repurposed Metabolic Gene**  
  - Q1 (CC): Binds host protein, suppresses immunity → "CC: Immune suppression / Experimental".  
  - Q2 (SE): Ancestral metabolic role, but no current selection → "SE: [Ancestral Metabolite] Synthesis / Comparative" (if phylogeny exists) or "Unknown".  
  - Q3: Conflict if SE known → Escalate.  
  - **Lead decision:** CC = "Immune suppression", SE = "[Metabolite] Synthesis". **Your goal is achieved:** Immune suppression is the CC annotation. Clinical users querying "current function" see it.  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Systematic misclassifications:**  
     - Traits under *recent* selection (e.g., antibiotic resistance) may lack SE evidence → SE defaults to "Unknown" despite likely function.  
     - "Current contribution" may capture transient effects (e.g., a protein binding a pollutant not present historically).  

  2. **Required revisits of old annotations:**  
     - Any existing entry where:  
       - Historical claims lack provenance (e.g., "photoreception" inferred from sequence homology alone).  
       - Current role was omitted if historical role existed (e.g., your Case 3 genes annotated only as metabolic).  

  3. **Response to Steering Group:**  
     > "This procedure doesn’t resolve the philosophical debate—it bypasses it. We separate evidence types so users can apply their *own* definition of ‘function.’ Clinicians querying ‘malfunction’ (e.g., loss-of-function variants) will use the SE field; structural biologists predicting phenotype will use CC. We’re not endorsing one theory—we’re exposing the evidence behind our claims."  

  ---

  ### **Key Trade-offs**  
  - **Speed vs. accuracy:** Curators spend <2 minutes on non-conflicting tickets (Case 1). Conflicts (Cases 2–3) add 5–10 minutes for review.  
  - **Clinical safety:** SE field flags malfunctions (e.g., broken photoreception in Case 2 isn’t a "malfunction" if SE is unknown).  
  - **Downstream simplicity:** When one answer is needed:  
    - **Phenotype prediction:** Use CC.  
    - **Pathogenic variants:** Use SE (if unknown, default to CC but flag low confidence).  

  Implement this Monday. It codifies your compromise, respects evidence limits, and lets your clinical partners decide what "function" means.
