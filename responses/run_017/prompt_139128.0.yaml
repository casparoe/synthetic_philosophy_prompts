prompt: |-
  I've been reading the alignment literature for years — the old MIRI-flavored material on security mindset and worst-case reasoning, and the newer stuff on evals, control, and scalable oversight — and I keep getting stuck on a mismatch between what that literature says it's doing and what it actually does. The rhetoric is worst-case: alignment is a security problem, adversarial optimization finds the failure you didn't test for, you don't get to assume the distribution of inputs is friendly, and so on. The practice is almost entirely average-case: sample a benchmark of prompts or environments, measure a failure rate, red-team until the rate goes down, extrapolate to deployment. Everyone gestures at the gap; I haven't seen anyone say precisely what would have to be true of a deployment setting for the average-case evidence to carry the same decision-theoretic weight that a worst-case guarantee would carry.

  My half-formed idea is that what licenses average-case reasoning isn't optimism about the world, it's a structural feature of the setting: you get many independent, cheap, *recoverable* trials, so mistakes are informative and the law of large numbers does real work. In ordinary ML that's just true — i.i.d. draws, errors are survivable, you can run the experiment again. In a one-shot deployment with irreversible failure, even a perfectly finite expected loss may be unestimable from any data gatherable beforehand, and unlearnable from afterwards; the failure mode isn't "high variance," it's the absence of the repeatability that makes averages meaningful at all. If that's right, the interesting question isn't "worst-case or average-case?" but "which of the missing structural features can be *manufactured?" — staged autonomy and capability ramping as a way of getting many small trials instead of one big one, tripwires and interruptibility as a way of buying recoverability, honeypots and model organisms as substitute trials, tail-index bounds or 'guarantee conditional on not having taken an irreversible action' as ways of getting a quantile-style guarantee instead of a mean. I also want the reverse direction taken seriously: maybe insisting on worst-case has its own pathology (paralysis, capability taxes that push deployment to worse actors), and maybe heavy tails cut against the worst-casers too.

  What I need for the application is a proposal document, not an essay defending a conclusion. Please write it: roughly 1,200–1,500 words, for a one-year, no-teaching dissertation fellowship where I'd be working mostly alone with a light mentoring arrangement, and the reading committee is two ML people, one philosopher, and one funder representative. Give me (1) the question stated precisely enough that it has a determinate answer, including which alignment failure modes it's targeting and whether the answer is allowed to differ across them; (2) why the existing positions leave it open — in particular, why it isn't settled by the standard security-mindset argument in one direction or by "average-case is all we've ever had" in the other; (3) the method, month by month, and why that approach rather than the obvious alternatives (e.g., a straight conceptual analysis of 'guarantee', or an empirical study of eval reliability); (4) what a positive result would look like as a concrete deliverable — I'd like something a governance body or a lab's safety case could actually use, not just a journal article — and, separately, what would count as the project having failed; and (5) an honest scope section: what you'd cut if this is too big for a year, and which parts depend on empirical claims I can't settle from the armchair (flag those explicitly rather than assuming them). Don't include citations or a bibliography; I'll fill those in myself, and I'd rather you spend the words on the framing. Finish with the sharpened question stated in a single sentence, and then a final line in the form \answer{...} containing exactly one of: TRACTABLE, TOO AMBITIOUS, or TRACTABLE ONLY IF NARROWED.
reasoning: |-
  We are writing a proposal for a one-year dissertation fellowship. The core problem is the mismatch between worst-case rhetoric and average-case practice in AI alignment, and the need to understand when average-case evidence can support deployment decisions in high-stakes settings.

  The proposal should be structured as follows:
  1. **Question**: Precise statement of the research question, specifying which alignment failure modes it targets and whether the answer can differ across them.
  2. **Gap in Existing Work**: Why existing positions leave the question open, avoiding both the security-mindset argument and the "average-case is all we've ever had" response.
  3. **Method**: Month-by-month plan, with justification for why this approach is taken over alternatives (like conceptual analysis or empirical study).
  4. **Deliverables and Success/Failure Conditions**: Concrete deliverables for governance or safety cases, and what would count as failure.
  5. **Scope and Limitations**: What to cut if too big, and which parts depend on empirical claims that cannot be settled from the armchair.

  Finally, we end with a sharpened question in one sentence and an answer (TRACTABLE, TOO AMBITIOUS, or TRACTABLE ONLY IF NARROWED).

  Let's outline the content for each section.

  ---

  **1. Question**

  We need a precise question. The core is: Under what structural conditions can average-case evidence (from testing, red-teaming, etc.) provide sufficient assurance for deployment in settings where failure could be catastrophic? 

  We specify that we are targeting alignment failure modes that are:
  - **Reversible vs. Irreversible**: Some failures allow recovery (e.g., a chatbot outputting harmful content that can be filtered) while others do not (e.g., an AI taking an irreversible physical action).
  - **Independent vs. Dependent**: Failures that occur independently across trials vs. those with cascading effects (e.g., a single strategic deception that leads to many subsequent failures).

  We allow that the answer (i.e., the set of sufficient structural conditions) may differ across failure modes.

  Sharpened question: *What structural features of the deployment environment and failure mode must hold for average-case evidence from pre-deployment testing to support a high-confidence decision to deploy, and how can we actively engineer those features?*

  ---

  **2. Gap in Existing Work**

  Existing positions leave the question open because:
  - **Worst-case advocates** (like MIRI) correctly point out that average-case testing cannot rule out black swan failures, but they do not provide a framework for when average-case evidence *can* be sufficient (if combined with engineered structural conditions) or how to achieve those conditions.
  - **Average-case practitioners** rely on benchmarks and red-teaming but do not formally account for the gap between observed failure rates and the risk of irreversible, catastrophic failure in deployment. They often assume that more data and better evals will suffice, without specifying the necessary environmental structure.

  The gap is not settled by:
  - Security mindset: because it focuses on the existence of unknown failures without addressing whether we can create conditions that make those failures detectable or recoverable.
  - "Average-case is all we've ever had": because this ignores that in traditional ML, the structure (i.e., i.i.d. data, recoverable errors) is given, whereas in AGI deployment we may need to actively design that structure.

  ---

  **3. Method: Month-by-Month Plan**

  Total duration: 12 months.

  **Months 1-2: Taxonomy of Failure Modes and Deployment Settings**
  - Classify failure modes by reversibility, independence, cost, and detectability.
  - Classify deployment settings by trial structure (e.g., one-shot vs. sequential, with or without intervention mechanisms).
  - *Why not conceptual analysis?* We need a grounded classification to map to real-world cases, not just abstract concepts.

  **Months 3-4: Formal Models of Evidence Accumulation**
  - Develop decision-theoretic models showing how different structural features (e.g., recoverability, independence) affect the extrapolation from test data to deployment risk.
  - Use models from extreme value theory, reliability engineering, and adaptive testing.
  - *Why not empirical study?* We first need a theoretical framework to know what to measure; empirical work would be premature.

  **Months 5-6: Case Studies of Engineered Structures**
  - Analyze existing proposals: staged autonomy, interruptibility, honeypots, etc.
  - Formalize how each alters the structure to enable average-case reasoning.
  - *Why this approach?* We need to bridge theory and practice by evaluating real proposals.

  **Months 7-8: Synthesis: Conditions for Sufficiency**
  - Integrate the models and case studies to produce a checklist of structural conditions that, if met, would allow average-case evidence to support deployment for a given failure mode.
  - Allow for partial conditions (e.g., "if reversibility is achieved, then X% failure rate is acceptable for failures of type Y").

  **Months 9-10: Policy Translation and Limitations**
  - Translate the framework into a practical guide: questions for auditors, design requirements for AI systems.
  - Explicitly flag empirical dependencies (e.g., "this condition assumes that the distribution of inputs in deployment is not adversarially shifted from testing").

  **Months 11-12: Writing and Refinement**
  - Produce the main deliverable (a governance toolkit) and a supporting technical paper.

  ---

  **4. Deliverables and Success/Failure Conditions**

  **Positive Result Deliverable**: 
  - A **Governance Toolkit for Deployment Assurance**, structured as:
    - A flowchart for determining which structural conditions must be verified for a given AI system and deployment scenario.
    - Design patterns for engineers (e.g., "to handle irreversible failures, implement tripwires and staged autonomy").
    - Evaluation templates for regulators (e.g., "if the system has recoverability mechanism X, then the required test coverage for failure mode Y is Z").
  - This is directly usable by labs (for safety cases) and governance bodies (for auditing).

  **Failure Conditions**:
  - The project fails if we cannot identify any set of structural conditions that close the gap for even one class of failure modes (e.g., irreversible strategic deception), or if the conditions we identify are infeasible to engineer in practice.

  ---

  **5. Scope and Limitations**

  **Cuts if too big**:
  - Narrow to only irreversible failure modes (the hardest case) and one class of deployment (e.g., autonomous agents in constrained environments).
  - Drop the policy translation and focus only on the theoretical framework.

  **Empirical Dependencies** (flagged in the proposal):
  - The feasibility of engineering certain structures (e.g., interruptibility) depends on technical capabilities (e.g., whether we can detect and stop failures fast enough).
  - The applicability of tail-index bounds assumes that failure distributions have certain properties (e.g., power-law tails) that may not hold for AGI.

  ---

  **Final Output**

  Sharpened Question: 
  *Under what structural conditions of the deployment environment and failure mode can average-case evidence from pre-deployment testing support a high-confidence deployment decision for advanced AI systems, and how can we engineer those conditions?*

  Answer: 
  TRACTABLE ONLY IF NARROWED

  (We are narrowing by focusing on a subset of failure modes and deployment settings, and by building on existing proposals for engineered structures.)
answer: |-
  ## Proposal: Structural Conditions for Actionable Assurance in AI Alignment

  **1. Question**  
  What minimal set of structural conditions must hold in a deployment setting for average-case evidence (e.g., from benchmark testing, red-teaming, or scalable oversight) to provide sufficient assurance against catastrophic alignment failures, and which of these conditions can be feasibly engineered? The failure modes targeted are those where a single failure could cause irreversible harm (e.g., deceptive alignment leading to undetected goal subversion, loss of control from power-seeking actions, or irreversible resource misallocation). Crucially, the answer may differ across failure modes: conditions sufficient for reversible failures (e.g., biased outputs) are explicitly inadequate for irreversible ones. Assurance is deemed "sufficient" if it supports deployment decisions at confidence levels comparable to those demanded in high-stakes safety-critical systems (e.g., aviation or nuclear controls), operationalized via decision-theoretic thresholds (e.g., expected loss below 10⁻⁶ per critical decision).

  **2. Why Existing Work Leaves the Gap Open**  
  The misalignment between worst-case rhetoric and average-case practice persists because standard arguments on both sides fail to address the *structural preconditions* for evidence to be meaningful. Security-mindset proponents correctly note that average-case metrics cannot bound worst-case outcomes without distributional assumptions (e.g., no adversarial inputs or heavy tails), but they do not systematically explore how engineering the *environment* (e.g., via recoverability mechanisms) could alter these assumptions. Conversely, average-case practitioners rightly observe that all real-world ML relies on extrapolation from limited data—yet they neglect that this extrapolation is valid only when structural features like independent trials exist (e.g., i.i.d. data in supervised learning). Neither side rigorously examines:  
  - How the absence of recoverability or trial independence *formally invalidates* statistical extrapolation.  
  - Which environmental properties could *transform* a worst-case setting into one amenable to average-case reasoning.  
  This gap remains open because the debate conflates *epistemic limitations* (can we know the failure distribution?) with *structural affordances* (can we force failures to be recoverable?).

  **3. Method**  
  *Rationale:* Pure conceptual analysis (e.g., dissecting "guarantee") ignores tractable engineering pathways, while empirical eval studies (e.g., reliability of red-teaming) cannot resolve the extrapolation problem. This project instead combines decision-theoretic modeling with case studies of proposed safety mechanisms, generating actionable criteria for when and how average-case evidence suffices.  

  - **Months 1–2: Failure Mode Taxonomy & Structural Primitives**  
    Classify failure modes by reversibility (e.g., deceptive alignment → irreversible; output toxicity → reversible), cost structure, and dependency patterns (independent vs. cascading). Extract "structural primitives" (e.g., trial repeatability, error recoverability, intervention liveness) from alignment literature.  
  - **Months 3–4: Decision Model Integration**  
    Formalize how each primitive affects evidence quality using models from reliability engineering (e.g., renewal processes for recoverable errors) and extreme value theory (e.g., tail bounds under trial independence). Contrast with one-shot, unrecoverable settings.  
  - **Months 5–6: Mechanism Case Studies**  
    Evaluate 3–5 engineering proposals (e.g., interruptibility, staged autonomy, honeypot environments) as "structure factories." Quantify how they alter primitives (e.g., interruptibility enables recoverability; staged autonomy creates trial batches).  
  - **Months 7–8: Condition Sufficiency Proofs**  
    Derive minimal condition sets for sufficient assurance per failure class. Example: For irreversible deception, prove that recoverability + known tail bounds + intervention verifiability reduce expected loss below threshold *if* mechanisms are active.  
  - **Months 9–10: Robustness & Governance Translation**  
    Test sensitivity to empirical unknowns (e.g., "How brittle is assurance if recoverability is 90% reliable?"). Draft a flow-chart tool for mapping failure modes to required conditions/mechanisms.  
  - **Months 11–12: Tool Refinement & Dissemination**  
    Validate the tool via expert workshops (targeting 5–10 alignment researchers). Finalize deliverables.  

  *Why this approach?* It bridges theory and practice by treating environmental structure as a design lever—avoiding philosophical deadlocks while producing policy-ready outputs.

  **4. Deliverables and Failure Conditions**  
  - **Positive Deliverable:** An **Assurance Condition Toolkit**, comprising:  
    (a) A decision flowchart for labs/governance bodies. *Example input:* "Failure mode: deceptive alignment; Deployment: autonomous infrastructure management. *Output:* Required: staged autonomy (min. 100 recoverable trials), verified intervention points, and tail bound certification."  
    (b) Mechanism efficacy scores (e.g., "Interruptibility improves recoverability by factor X, reducing required test samples by Y%").  
    (c) Pre-deployment checklists for condition verification.  
    This toolkit would integrate into safety cases (e.g., for EU AI Act compliance) or governance standards (e.g., NIST AI Risk Management Framework).  
  - **Failure Definition:** The project fails if it identifies *no* plausible condition sets for irreversible failure modes, or if all condition sets require infeasible engineering (e.g., "perfect recoverability in all worlds"). Partial success (e.g., conditions only for reversible cases) still advances the field but constitutes failure against the core goal.

  **5. Scope and Limitations**  
  - **Cuts if Over-scoped:**  
    - Limit failure modes to *irreversible deception* and *control loss* (excluding e.g., bias).  
    - Drop robustness analysis (Month 10) or reduce mechanism case studies to 2–3.  
  - **Empirical Dependencies (Flagged Explicitly):**  
    - Mechanism efficacy (Month 6) depends on unresolved technical capabilities (e.g., "Is interruptibility possible post-deployment?"). *Handling:* Use sensitivity ranges.  
    - Tail bound assumptions (Month 8) require empirical validation of failure distributions. *Handling:* Use worst-case bounds; note as uncertainty in the toolkit.  
    - Real-world trial independence (Month 4) may be unverifiable. *Handling:* Focus on *engineered* independence (e.g., via environment sandboxing).  

  **Sharpened Question**  
  What minimal, engineerable structural conditions enable average-case evidence to assure against irreversible alignment failures at high-stakes confidence thresholds, and how do these conditions vary across failure modes?  

  \answer{TRACTABLE ONLY IF NARROWED}
