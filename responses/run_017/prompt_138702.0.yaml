    - Overall accuracy \( P \) (match rate between T and choice) is calculated as:  
      \[
      P = P(T+) \cdot P(\text{match} \mid T+) + P(T-) \cdot P(\text{match} \mid T-)
      \]
      \[
      P = (0.4 \times 0.85) + (0.6 \times 0.55) = 0.34 + 0.33 = 0.67
      \]
    - Threshold: \( S_{\text{threshold}} = 1,\!000,\!000 \times (2 \times 0.67 - 1) = 1,\!000,\!000 \times 0.34 = \$340,\!000 \).  
