answer: |-
  The existing common-law pattern rests on a coherent but philosophically contested theory of harm, benefit, and legal personhood. Below, I reconstruct the implicit theory, test its coherence, address the two complications, and answer your specific questions. The core framework combines **threshold comparativism** with **legal separability of interests**, moderated by policy concerns.

  ### Core Implicit Theory
  1. **Harm Definition**:  
     - Legal harm requires a **worsening** of a person's condition relative to a baseline.  
     - *Nonexistence cannot serve as a baseline* because there is no subject to whom "worsening" applies. Thus, a child cannot claim harm from being born (even impaired) as their existence is not "worse" than never existing.  

  2. **Benefit Offset Rule**:  
     - Benefits to the plaintiff must offset costs *if they arise from the same injurious event*.  
     - Parents recover only "extraordinary costs" (e.g., medical care for disability) because these are *uniquely caused* by negligence. Ordinary child-rearing costs are offset by the *intrinsic benefits of parenthood* (joy, companionship), which the law deems non-quantifiable but universally present.  

  3. **Counterfactual Stability via Interest Segmentation**:  
     - The parents' claim avoids the "nonexistence comparison" problem because it focuses on *their* autonomy and welfare, not the child's existence:  
       - **Autonomy Interest**: The right to avoid the burdens of an *impaired* child (not the child per se).  
       - **Welfare Interest**: The costs directly attributable to the impairment.  
     - Courts sidestep the "same healthy child later" counterfactual by treating the *timing and nature* of the pregnancy as inseparable from the parents' injury. The negligence deprived them of the choice to avoid *this specific burden*.  

  4. **Threshold View of Life's Value**:  
     - The law presumes *any life worth living is a net benefit to the person living it*. This justifies rejecting the child's action and limiting parental recovery to extraordinary costs. It is not a philosophical claim about "no subject of harm" but a *practical irrelevance*: nonexistence is not a cognizable state for legal comparison.  

  ### Addressing Complications
  **1. The Unstable Counterfactual:**  
     - **If parents would have conceived a healthy child later**: Courts award extraordinary costs because the negligence forced them to bear *avoidable disability-related burdens*. The offset rule applies only to ordinary costs (shared with the hypothetical healthy child), not extraordinary ones.  
     - **If no child would exist**: The comparison is *not* between existence/nonexistence *for the child*, but between the parents' actual burdens (costs of a disabled child) and their counterfactual burden-free state. The child's existence is a "benefit" to parents, but the *disability* is a compensable injury.  
     - *Coherence Test*: This holds if we accept:  
       - (a) Harm is interest-relative (parents' autonomy ≠ child's welfare),  
       - (b) Extraordinary costs are segregable from existence itself.  

  **2. Statutory Reform ("Life Not Worth Living" Action):**  
     - This undermines the threshold view by defining a compensable harm *below* the "worth living" line.  
     - Payments to a trust (not the child) avoid the contradiction of "compensating for existence."  
     - *Effect on Coherence*: Makes the child's action logically consistent but clashes with the common law's refusal to compare existence/nonexistence.  

  ### Philosophical Commitments vs. Pragmatism
  | **Element**                | **Strictly Presupposed**                          | **Merely Fits With**                           |  
  |----------------------------|--------------------------------------------------|-----------------------------------------------|  
  | **Child's action denied**  | Nonexistence cannot be a legal baseline.         | Threshold view; dignity of disabled lives.     |  
  | **Parents recover extraordinary costs** | Autonomy + segregable harm.          | Welfare-based cost avoidance.                 |  
  | **Benefits offset rule**   | Same-event benefits offset costs.                | Reproductive autonomy (if benefits are non-coercive). |  
  | **Healthy child split**    | No injury if benefits exceed costs (pure gain). | Judicial reluctance to price life.            |  

  - **Rival Theories Supporting the Pattern**:  
    - **Autonomy Theory**: Parents recover for violation of reproductive choice; child's action fails as nonexistence isn't a "choice" for them.  
    - **Welfare Economics**: Only net financial losses are recoverable; child's "loss" is non-financial/unquantifiable.  
    - **Person-Affecting View**: Harm requires a victim who is worse off; no victim in nonexistence.  

  ### Parents' Claim: Welfare or Autonomy?  
  - **Welfare-Based View**: Coherent if extraordinary costs are *uncompensated burdens* the negligence caused. The offset rule reflects that ordinary costs are balanced by benefits.  
  - **Autonomy View**: The action compensates for *lost control* over family planning. Benefits offset is incoherent here (you can't "offset" a violated right with joy).  
  - *Resolution*: The practice is **hybrid**. Courts use cost-based damages but justify them via autonomy rhetoric ("right to avoid a disabled child"). The offset rule fits welfare logic better.  

  ### The Asymmetry Problem  
  - **Asymmetry Stated**: We have a duty to avoid creating miserable lives but no duty to create happy ones (absence of pain ≠ absence of pleasure).  
  - **Current Law Compatibility**: The pattern *fits* the asymmetry:  
    - Denying the child's action aligns with "no duty to create happy lives."  
    - Allowing parental recovery for disability aligns with "duty to avoid creating avoidable suffering."  
  - **If Asymmetry Were Explicitly Adopted**:  
    - **Child's action**: Still denied (nonexistence isn't "better," but no duty to create life).  
    - **Offset rule**: Might weaken—if a disabled life is "harm" to parents, why offset with benefits?  
    - **Healthy child**: Recovery for pregnancy costs (pain) but not rearing (pleasure offsets), reinforcing asymmetry.  
    - **Damages Measurement**: Shift from cost-based to "quantified suffering" for the child (if statutory).  

  ### Coherence Assessment  
  - **Strengths**:  
    - Pragmatic: Avoids metaphysical debates about nonexistence.  
    - Normative: Upholds dignity of disabled people by rejecting "non-existence as better."  
  - **Weaknesses**:  
    1. **Counterfactual Inconsistency**: Measuring parental harm against a no-child world *while denying that comparison to the child* is unstable.  
    2. **Offset Rule Arbitrariness**: Why are ordinary child-rearing costs offset by emotional benefits, but disability costs not offset by the "benefit" of having *this specific child*?  
    3. **Healthy Child Split**: Calling a healthy child "pure gain" ignores parental autonomy entirely.  

  ### Conclusion  
  The implicit theory is **minimally coherent** but relies on compartmentalization:  
  - **Harm to child**: Rejected due to non-comparability of nonexistence (a metaphysical claim).  
  - **Harm to parents**: Allowed by isolating avoidable burdens from existence itself (a practical fiction).  
  - **Role of Policy**: Dignity concerns and administrative feasibility (e.g., not pricing "worth of life") are decisive, not philosophical rigor. The statutory reform proposal exposes tensions but doesn't resolve the core incoherence: if a "life not worth living" is compensable, why not measure *all* lives against nonexistence? The pattern survives by refusing to answer this question.
