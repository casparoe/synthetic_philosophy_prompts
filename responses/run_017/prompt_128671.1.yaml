prompt: |-
  I've got a 75-minute seminar with second-years next week on Harsanyi's aggregation theorem, and I want a plan, not an explanation — I know the result, I just don't know how to get it into their heads.

  Where they are: they did vNM expected utility three weeks ago and can tell you that a utility function is fixed only up to positive affine transformations (sevaral can even say what that means), they've read nothing on social choice, and the room is split between people who arrive thinking utilitarianism is obviously right and people who think it's obviously vile — both of whom will pounce on anything that looks like a proof of utilitarianism.

  Rough statement I'd put on the board: give each person i a vNM utility function u_i over lotteries; suppose society's ranking of lotteries also satisfies the EU axioms; suppose Pareto indifference, i.e. if every individual is indifferent between two lotteries then society is indifferent too. Then there are constants a_i, not all zero, such that society ranks lotteries by the expected value of W = sum of a_i u_i.

  What I want from you: (1) the order the pieces have to go in, and what breaks if I swap any two. I have a feeling the rescaling point — each u_i is fixed only up to affine transformation, so the a_i soak up the units, and "changing the weights" can be the very same social ordering written in different units — has to land before the weighted-sum formula rather than after, but I can't say why, so tell me whether I'm right and what it depends on. (2) A carrying example. I've been toying with a currency-exchange frame: read a_i as the exchange rate at which person i's utility converts into the social currency, so rescaling someone's u_i is just redenominating (dollars into cents) and changes nothing, while changing the rate changes their social weight. I like that it makes the units point vivid. I worry that exchange rates are prices you read off a market and there is no market here, so they'll walk out thinking the a_i are measurable magnitudes rather than a free parameter of the representation. Run with it, fix it, or bin it — and if fix, tell me exactly what to bolt on. (3) Where in the sequence to defuse each of these: "so Harsanyi proved utilitarianism"; "so all the real moral work is in the weights"; "the u_i already carry interpersonal comparisons"; and the one I always get — we're applying Pareto to expected utilities, i.e. ex ante, so what if the coin lands badly and after the lottery everyone is worse off. I want that last one placed on purpose rather than fielded when it erupts: before or after the formula, and why? Plus anything else this particular audience will generate that I haven't listed. (4) One closing question that separates someone who has the representation from someone who can recite W = sum of a_i u_i. (5) What I should openly refuse to cover — I'm inclined to sacrifice his impartial-observer, veil-of-ignorance version of the argument, but tell me if that's the wrong cut.

  One small thing I'm unsure of: I half-remember that Pareto indifference alone doesn't rule out negative weights, and that you need a stronger Pareto condition to get them non-negative. If that's right, does it earn a slot in the 75 minutes or is it a footnote?

  Commit to things, please: one ordering, one verdict on the exchange-rate frame, and tell me plainly where I'm wrong. Don't hand me three options and leave me to pick. Under 700 words — I'll be reading this on my phone between classses.
reasoning: |-
  Okay, the user is preparing a 75-minute seminar on Harsanyi's aggregation theorem for second-year students. They need a structured plan to help students grasp the theorem without getting bogged down in debates about utilitarianism. The students have a background in vNM expected utility theory but no social choice exposure. The key challenges are addressing misconceptions about utilitarianism, handling Pareto conditions, and clarifying the role of weights in the aggregation.

  First, I need to establish the order of presentation. Starting with the setup makes sense: reviewing vNM utility to remind students that individual utilities are affine transformations. This sets the stage for understanding why weights are necessary. Next, introducing the social planner's vNM utility function and Pareto indifference. The critical step is showing that the linear aggregation form follows from these assumptions. Emphasizing the affine rescaling point early is crucial because students might miss why weights absorb the scaling changes.

  The user's currency-exchange analogy for weights is useful but risky. Students might misinterpret weights as market-driven prices. To fix this, I should explicitly state that weights are normalization choices, not market prices. A concrete example, like dividing a cake under uncertainty, can illustrate how weights represent value judgments. This connects the abstract math to a tangible scenario.

  Addressing misconceptions: The "Harsanyi proved utilitarianism" claim needs debunking right after presenting the theorem. Highlight that the theorem is about representation, not moral justification. The weights' role should be clarified—they aren't derived but chosen based on normative views. Interpersonal comparisons are embedded in the utility functions, which the theorem assumes as given. The ex ante vs. ex post Pareto point should come after the proof to show the theorem's scope is ex ante evaluations.

  For the closing question, asking why weights can't be zero tests if students understand that zero weights violate Pareto. Sacrificing the impartial observer version is correct due to time limits. Mentioning negative weights as a footnote keeps focus on the main theorem without derailing into edge cases.

  The user's deeper needs include efficiently conveying the theorem's structure while preempting common student pitfalls. They want a clear, confident plan that avoids tangents and ensures students distinguish mathematical representation from normative claims. The plan must be concise, with timed segments to stay within 75 minutes, and proactive handling of objections to maintain focus.
answer: |-
  Here’s your battle-tested plan for 75 minutes:

  **Order (45 mins total – commit to this sequence):**  
  1.  **(5 min) Setup & Assumptions:**  
      - Quick recap: "vNM says your personal `u_i` ranks lotteries via EU, and `u_i` is unique up to affine transforms (`u_i' = α_i u_i + β_i`)."  
      - **Society is also vNM-rational.** Write "Social EU Axioms" on board.  
      - **Pareto Indifference:** If all `i` indifferent between `L` & `L'`, then society is too.  
      - *Why this order?* Starts from shared ground (vNM). Pareto Indifference is the *minimal* social link needed.  

  2.  **(15 min) The Affine Scaling Point (CRITICAL – DO FIRST):**  
      - "Each `u_i` is on an arbitrary scale (like temperature: Celsius/Fahrenheit). Changing `u_i` to `α_i u_i + β_i` is just changing units."  
      - **Carrying Example:** Use your **currency exchange frame BUT FIX IT:**  
          *   "Think of `u_i` as i's *internal currency* (Utils-i). Society needs a *common currency* (Social Utils)."  
          *   "The weight `a_i` is the *exchange rate* converting Utils-i into Social Utils (e.g., 1 Util-Alice = 2 Social Utils → `a_A = 2`)."  
          *   **Crucial Bolt-On:** "BUT: There's no 'market rate'. `a_i` reflects *how much society values a unit of change in i's utility scale*. Rescaling `u_i` (e.g., Alice uses cents instead of dollars) forces `a_i` to adjust inversely (`a_i` becomes `a_i / 100`). The *social valuation* of Alice's well-being relative to Bob's is fixed by the *ratio* `a_A / a_B`."  
      - *Why before the formula?* Students must grasp that `a_i` absorbs scale freedom *before* seeing `Σ a_i u_i`. Otherwise, they'll think weights *set* interpersonal comparison, not *reflect* it within the representation.  

  3.  **(20 min) Deriving the Formula (Sketch Proof):**  
      - "Society has its own vNM utility `U` over lotteries."  
      - "Fix a 'status quo' lottery `L0` where (by convention) set `U(L0) = 0` and `u_i(L0) = 0` for all `i` (we can do this via affine shifts!)."  
      - "Consider small changes: lotteries differing only in outcome on one state. Pareto Indifference + vNM rationality for society *forces* `U` to be a linear combination of the `u_i`s at `L0`." (Hand-wave the functional equation/linearity step – emphasize intuition: society's `dU` must respond linearly to changes in individuals' `du_i`).  
      - "This linearity holds everywhere → `U = Σ a_i u_i`."  
      - *No swapping:* Scaling (step 2) makes `u_i(L0)=0` sensible. Linearity *follows* from local Pareto+vNM.  

  **Defusing Bombs (Place INTENTIONALLY):**  
  4.  **(5 min) Immediately After Derivation:**  
      - "**'So Harsanyi proved Utilitarianism?'** NO! He proved IF society is vNM-rational and satisfies Pareto Indifference, THEN it *must* rank lotteries *as if* maximizing `Σ a_i u_i`. **'Utilitarianism' requires `a_i = 1` for all `i` – that's a separate, *normative* choice.** The theorem provides the *form*, not the *weights*."  
      - "**'All real moral work in weights?'** YES. The `a_i` encapsulate the value judgment: whose utils count more? The theorem *assumes* `u_i` are interpersonally comparable (via their scales & the aggregation)."  

  5.  **(After Bomb #4, Before Q&A – 5 min) Ex Ante vs Ex Post:**  
      - "**'What if the coin lands badly?'** The theorem *only* governs the *ex ante* social ranking of lotteries *before* uncertainty resolves, based on expected utilities. It says *nothing* directly about evaluating outcomes *ex post* (e.g., redistribution after the fact). That's a different problem."  
      - *Why here?* It directly addresses the scope of the social ranking defined by the theorem.  

  **Closing Question (5 min):**  
  *   "If society is indifferent whenever Alice is indifferent (regardless of Bob), what does that imply about the weights `a_A` and `a_B`?"  
  *   *Answer:* `a_B = 0`. (Tests understanding that non-zero weights are essential for Pareto to give others influence).  

  **Sacrifice (10 min for Q&A):**  
  *   **Openly Refuse:** "We are *only* covering the *aggregation theorem* today – the core mathematical result linking individual vNM utilities to social vNM utilities under Pareto. We are *not* covering Harsanyi's impartial observer/veil-of-ignorance argument (that's a distinct justification *for* specific weights like `a_i=1`)."  

  **Negative Weights (FOOTNOTE, 1 min max):**  
  *   "Pareto Indifference *alone* permits negative `a_i` (e.g., society dislikes when Bob is happy). To ensure `a_i >= 0`, you need **Strong Pareto:** If everyone weakly prefers `L` to `L'` and at least one strictly prefers it, then society strictly prefers `L`. We'll assume this holds for sensible applications. Details are advanced."  

  **Q&A Buffer (5 min):**  
  *   Expect pushback on interpersonal comparability ("Where do the `u_i` scales come from?!"). Response: "The theorem *assumes* they are given and interpersonally meaningful. Constructing them is a major topic in welfare economics – not for today."  

  **Your Verdicts:**  
  *   **Order:** Correct. Scaling MUST come before the formula derivation.  
  *   **Exchange Rate Frame:** GOOD, but **BOLT ON** the explicit statement that `a_i` reflects the *social value* of a unit change on `i`'s scale, and the *ratio* `a_i/a_j` is the meaningful interpersonal tradeoff. Emphasize rescaling invariance.  
  *   **Where You're Wrong:** Don't say "u_i already carry interpersonal comparisons" without stressing the theorem *assumes* this comparability is possible and meaningful. The weights `a_i` are how society *uses* that comparability.  

  **Stick to this. You’ve got 75 minutes – move briskly.**
