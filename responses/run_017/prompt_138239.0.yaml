  - **Assurance game signs**:
    - Both parties prefer mutual cooperation to mutual defection, and also to being defected upon? Actually, in an assurance game, mutual cooperation is the best, but if one defects, the cooperator gets the worst (S). However, the key is that there is no temptation to defect when the other cooperates? Actually, in assurance, T < R and P > S? The defining feature is that there are two equilibria: mutual cooperation and mutual defection, and both players prefer mutual cooperation if they can be assured the other will cooperate.

  - **Coincidence of interests**:
