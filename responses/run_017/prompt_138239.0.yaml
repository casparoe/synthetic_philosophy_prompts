  We are designing a decision procedure based on the theory of the prisoner's dilemma and the evolution of cooperation, particularly drawing from Robert Axelrod's work. The procedure must be simple, run in 15 minutes, and result in one of a few stances.

  Key concepts:
  1. **Prisoner's Dilemma (PD)**: A situation where two parties might not cooperate even if it is in their best interest to do so. The payoff structure must satisfy T > R > P > S and R > (T+S)/2, where:
     - T: Temptation to defect
     - R: Reward for mutual cooperation
     - P: Punishment for mutual defection
     - S: Sucker's payoff (cooperating when the other defects)

     In a PD, the dominant strategy for a one-shot game is to defect, but in repeated interactions, cooperation can emerge.

  2. **Assurance Game**: Sometimes called "stag hunt". Here, mutual cooperation is the best outcome, but there is a risk if the other defects. The payoffs satisfy R > T and P > S (or R > T > P > S but with R+T > 2R? Actually, the key is that mutual cooperation is better than mutual defection and also better than being exploited, but the main issue is coordination. The critical point is that both players prefer to cooperate if the other does.

  3. **Coincidence of Interests**: When the interests of both parties are aligned, so that cooperation is the dominant strategy for both.

  The procedure must first determine if the situation is a PD, an assurance game, or a coincidence. Then, for PD-like situations, we use the concept of repeated games and Axelrod's advice (tit-for-tat, etc.).

