answer: |-
  Below is a decision procedure built on game theory (specifically the Prisoner's Dilemma and Axelrod's evolution of cooperation) to address your team's recurring supplier decisions. The procedure is designed for speed (15 minutes), simplicity (one page), auditability, and clear stances. It explicitly prioritizes the five areas you highlighted and includes safeguards for ambiguity, endpoints, and reputational risks.

  ---

  ### **Supplier Cooperation Decision Procedure**  
  *Run in order; stop at any "STOP" point. Document answers and rationale in the file.*

  ---

  #### **STEP 1: IS THIS A PRISONER'S DILEMMA? (5 mins)**  
  *Purpose: Filter out non-PD scenarios where reciprocity rules backfire.*  
  **Test 1a: Temptation Test**  
  - *Question:* "If we cooperate (e.g., absorb cost, waive penalty), and the counterparty *could* defect (e.g., exploit our goodwill) without immediate consequences, would they gain a *significant short-term advantage*?"  
  - *Signs of "Yes" (PD risk):*  
    - Counterparty has unilateral power to exploit (e.g., sole source, contract ambiguity).  
    - Short-term incentive for them exists (e.g., their quarterly bonus depends on cost savings).  
  - *Signs of "No" (not PD):*  
    - Mutual gains are locked-in (e.g., joint investment, shared savings).  
    - Their success depends on our success (e.g., they lose more if we defect).  

  **Test 1b: Sucker Payoff Test**  
  - *Question:* "If we cooperate and they defect, would we suffer *disproportionate, unrecoverable losses* (e.g., sunk costs, delayed launch) compared to mutual defection?"  
  - *Signs of "Yes" (PD risk):*  
    - Defection causes high switching costs (e.g., requalification delays, penalties).  
    - No recourse (e.g., weak contract terms, no alternative).  
  - *Signs of "No" (not PD):*  
    - Losses are symmetric/contained (e.g., both lose efficiency, but no catastrophe).  

  **Decision:**  
  - **Both "Yes" → Prisoner’s Dilemma.** Proceed to Step 2.  
  - **Both "No" → Coincidence of interests.**  
    - *Stance:* **Cooperate unconditionally** (no reciprocity needed).  
    - *File note:* "Non-PD: Interests aligned."  
    - **STOP.**  
  - **Test 1a "No" + Test 1b "Yes" → Assurance Game.**  
    - *Stance:* **Cooperate unconditionally** (goal is signaling trust to avoid mutual defection).  
    - *File note:* "Non-PD: Assurance game."  
    - **STOP.**  
  - **Test 1a "Yes" + Test 1b "No" → Unusual (e.g., Chicken Game).** Escalate to Head.  
  - *Confidence note:* High confidence if contract/context shows clear incentives. Medium if ambiguous; assume PD to guard against exploitation.

  ---

  #### **STEP 2: CONTINUITY ASSESSMENT (3 mins)**  
  *Purpose: Estimate the "shadow of the future" (likelihood of repeated interactions with the same decision-maker/incentives).*  
  **Quick Estimate:**  
  - *Answer:* "Will the same person, in the same role, with the same incentives, likely face us in ≥3 similar interactions over the next 12 months?"  
  - **High (≥80%):** Long-term relationship (>2 yrs), stable contact, no known endpoint, strategic partner.  
  - **Medium (40-79%):** Some turnover risk, contract ≥6 months, moderate interdependence.  
  - **Low (<40%):** New contact (<6 months), their internal chaos, or known endpoint (see Step 3).  

  **Handling Uncertainty:**  
  - If unclear, default to **Medium**.  
  - *File note:* "Continuity: [High/Medium/Low]. Uncertainty: [Reason]."  
  - Proceed to Step 3.

  ---

  #### **STEP 3: ENDPOINT ADJUSTMENT (2 mins)**  
  *Purpose: Adjust for known endpoints (yours or theirs) that undermine repeat interactions.*  
  **Test:**  
  - Is there a fixed endpoint (e.g., contract non-renewal, merger) within 6 months?  
    - **No →** Use Step 2 continuity. Proceed to Step 4.  
    - **Yes →** Adjust continuity:  
      - **Endpoint known to both →** Set continuity to **Low** (cooperation unravels).  
      - **Endpoint known only to us →** Set continuity to **Low** + note "Info advantage."  
      - *File note:* "Adjusted continuity: Low (Endpoint: [Date])."  
  - Proceed to Step 4.

  ---

  #### **STEP 4: RESPONDING TO AMBIGUOUS DEFECTIONS (3 mins)**  
  *Purpose: Avoid overreacting to unclear actions.*  
  **Rule:**  
  - If counterparty's action is ambiguous (e.g., late delivery due to force majeure, disputed clause):  
    - **If continuity = High/Medium → Cooperate** (benefit of the doubt; avoid feud).  
    - **If continuity = Low → Defect** (no future to protect; minimize losses).  
  - If *we* may have defected ambiguously:  
    - **Apologize + compensate if cost < 5% of interaction value** (preserve trust).  
    - Else, escalate to Head.  
  - *File note:* "Ambiguity: [Details]. Rule applied: [Cooperate/Defect]."

  ---

  #### **STEP 5: REPUTATION & AUDIENCE (2 mins)**  
  *Purpose: Factor in network effects.*  
  **Test:**  
  - Will ≥1 other supplier (with ≥Medium continuity) likely observe this decision?  
    - **No →** Proceed to stance.  
    - **Yes + Stance involves defection →** Override to **Cooperate conditionally** (reputational risk).  
      - *File note:* "Audience: [Names]. Override: Reputation risk."  
    - **Yes + Stance is cooperation →** No change (reputation gain).  

  ---

  #### **STANCE DECISION FOR PRISONER'S DILEMMA**  
  - **Continuity = High + No recent defection →**  
    - *Stance:* **Cooperate conditionally** (tit-for-tat: match their last move).  
  - **Continuity = High + Recent defection →**  
    - *Stance:* **Cooperate conditionally** (tit-for-tat) *but* add 1-time forgiveness if defection was >6 months ago.  
  - **Continuity = Medium →**  
    - *Stance:* **Cooperate conditionally with defined forgiveness** (e.g., forgive 1 defection per year).  
  - **Continuity = Low →**  
    - *Stance:* **Reduce exposure and watch** (defect + minimize future reliance).  
  - **Escalate if:**  
    - Stance is "Reduce exposure," "Withdraw," or involves legal risk.  
    - Endpoint known only to us and stance is defect (ethical/legal review).  

  **Final Stances:**  
  1. Cooperate unconditionally (non-PD only).  
  2. Cooperate conditionally (tit-for-tat).  
  3. Cooperate conditionally with forgiveness (e.g., "forgive first offense").  
  4. Reduce exposure and watch.  
  5. Withdraw from cooperation (escalate to Head).  
  6. Escalate (to Head/Legal).  

  ---

  ### **Live Case Applications**  
  *Using the procedure above:*

  **Case A: Packaging Tray Supplier**  
  - **Step 1:**  
    - *Test 1a:* "Yes" – They gain short-term by invoking disputed clause.  
    - *Test 1b:* "Yes" – Dispute risks supply disruption (Sucker payoff: delayed qualification).  
    → **PD confirmed.**  
  - **Step 2:** Continuity **Medium** (new contact, but 11-year history; second source in 8 months adds uncertainty).  
  - **Step 3:** No endpoint → Continuity remains Medium.  
  - **Step 4:** Ambiguous defection (clause dispute). Continuity Medium → **Cooperate** (absorb cost).  
  - **Step 5:** No audience → No override.  
  - **Stance:** **Cooperate conditionally with forgiveness** (forgive this ambiguity; if repeated, defect).  
  - *Why you won’t like it:* Absorbing a 6% cost increase feels like losing. But with second source pending, continuity is medium – defection risks disruption. Auditable as "Step 4 ambiguity rule."  

  **Case B: Logistics Provider (Integration Co-Funding)**  
  - **Step 1:**  
    - *Test 1a:* "Yes" – They gain if we fund but they under-deliver.  
    - *Test 1b:* "Yes" – If they defect (deliver late/under-spec), we lose co-funding with no benefit.  
    → **PD confirmed.**  
  - **Step 2:** Continuity **Low** (merger in 5 months; known only to us).  
  - **Step 3:** Endpoint known only to us → Continuity **Low**.  
  - **Step 4:** N/A (no defection yet).  
  - **Step 5:** No audience → No override.  
  - **Stance:** **Reduce exposure and watch** (defect: decline co-funding).  
  - **Escalate:** Yes (endpoint known only to us + defection stance).  
  - *Diagnosis:* Not a PD? No – it is PD, but endpoint changes incentives.  
  - *Why you won’t like it:* Defection (refusing co-fund) may feel unethical since they’ve been reliable, but the procedure forces escalation due to hidden endpoint.  

  **Case C: Distributors (Order Inflation)**  
  - **Step 1:**  
    - *Test 1a:* "No" – If they order fairly, auditing gains nothing (wastes cost).  
    - *Test 1b:* "Yes" – If they inflate and we don’t audit, we overallocate (high loss).  
    → **Assurance Game** (Test 1a "No" + Test 1b "Yes").  
  - **Stance:** **Cooperate unconditionally** (no audit; trust but verify later).  
  - *Diagnosis:* Not PD (assurance game).  
  - *Why you won’t like it:* No audit feels permissive. But in assurance games, unilateral defection (auditing) destroys trust. Procedure overrides intuition.  
  - *Escalate:* Optional (values call: tolerance for inflation vs. relationship cost).  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Misfire in Complex Games:** Fails in non-2x2 games (e.g., multi-party auctions).  
  2. **Exploitable by Sophisticated Players:** A counterparty can mimic cooperation until the final interaction (known endpoint) to exploit.  
  3. **Ignores Payoff Magnitudes:** Only uses ordinal rankings (T, R, P, S), not financial impact.  
  4. **Static Continuity:** Assumes incentives/roles won’t change mid-game.  
  5. **Values > Theory:** Ethics (e.g., hiding endpoints) require human judgment.  

  **Audit Trail for Improvement:**  
  Record per decision:  
  - Game type (PD/non-PD) and tests used.  
  - Continuity score, endpoint adjustment.  
  - Ambiguity handling.  
  - Audience impact.  
  - Stance + outcome (e.g., "Cooperation led to 5% cost avoidance").  
  - **Track quarterly:**  
    - % supplier issues escalating to "Reduce exposure" (goal: <10%).  
    - Cost of defections (actual vs. avoided).  
    - Relationship longevity vs. stance history.
