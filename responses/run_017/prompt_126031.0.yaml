answer: |-
  Here’s a reading of *Spider-Man 2* focused on your elastic demandingness dilemma, structured for your ethics night. The film leans hard on **integrity and the ceiling-less demand** (your point *b*), not the *degree* of sacrifice. It also subtly critiques consequentialism by grounding responsibility in identity, not utility.

  ### Key Philosophical Takeaway
  The film dramatizes **the integrity objection**: Consequentialism’s open-ended demand erodes personal projects and relationships until the self dissolves. Peter’s return isn’t a surrender to infinite duty but a reclaiming of identity. The "distributed duty" moments are illusions—society fails to share the load, making the demand solitary. Powers convert heroism into duty, erasing supererogation for Peter.

  ---

  ### Core Scenes to Build Discussion Around
  1. **Peter Lets the Thief Escape (Opening)**  
     - *What happens*: Peter delays delivering pizzas to help an elderly woman, losing his job. He then passively lets a thief escape.  
     - *Philosophical work*: Shows the **opportunity cost** of heroism. Letting the thief go isn’t framed as *wrong* but as a desperate act of self-preservation. The film sympathizes with his burnout—this is **integrity erosion**, not moral failure.  
     - *Consequentialist pushback*: Letting the thief escape risks future harm (e.g., the thief could kill someone). Peter’s duty scales with his ability to prevent harm—he *should* have acted.

  2. **"I’m Spider-Man No More" (Suit in the Trash)**  
     - *What happens*: After failing at everything (job, studies, friendships), Peter quits. The montage shows him smiling, acing exams, and reconnecting with MJ.  
     - *Philosophical work*: Quitting is framed as **self-betrayal**, not liberation. His joy fades quickly; he’s denying his identity. The demand’s cruelty isn’t its cost (*he’s happier!*) but its refusal to acknowledge **his projects as intrinsically valuable**. Aunt May later nails it: "You owe the world your gifts." Not "you must maximize utility."  
     - *Consequentialist pushback*: His happiness is irrelevant. By quitting, he’s condemning people to death he could easily save. His "gifts" are tools for good, not identity markers.

  3. **The Train Sequence (Passengers Unite + "He’s just a kid!")**  
     - *What happens*: Passengers carry an unconscious Spider-Man, shield him, and promise silence about his identity.  
     - *Philosophical work*: This *feels* like **distributed duty**—but it’s a fakeout. They help *after* he’s exhausted himself saving them. Society doesn’t *prevent* crises; it just patches collateral damage. The demand still lands solely on Peter.  
     - *Consequentialist pushback*: This scene proves society *can* share burdens. If everyone did their part (e.g., reporting crimes, supporting heroes), Peter’s load would lighten. His failure is not mobilizing others.

  4. **Aunt May’s Speech ("There’s a hero in all of us")**  
     - *What happens*: May tells Peter heroism is everyday decency, not just superpowers.  
     - *Philosophical work*: **Re-frames responsibility as universal but limited**. Ordinary people can be heroes by helping neighbors, not stopping super-villains. This *implies* a ceiling: you do your fair share, not everything. But for Peter? No—his "share" is infinite.  
     - *Consequentialist pushback*: If May’s right, Peter should *still* be Spider-Man because his "everyday decency" can save 100x more lives than yours or mine. The speech is feel-good evasion.

  ---

  ### Where the Reading Breaks Down
  - **Genre Demands**: Peter *must* return. The film can’t endorse quitting because Doc Ock exists. Real-world demandingness lacks obligatory super-villains.  
  - **Doc Ock as Red Herring**: His "obsession" mirrors Peter’s struggle, but he’s corrupted by tech/AI, not morality. It’s not about demandingness; it’s about control.  
  - **Marginal Costs Aren’t Zero**: Peter suffers physically/emotionally (e.g., back pain, humiliation). The film emphasizes this to humanize him, weakening the "elasticity" point.  

  ---

  ### Supererogation: Does It Exist?
  - **For Peter? No.** Once he has powers, heroism is duty. Saving a child from a burning building is as obligatory as stopping Doc Ock.  
  - **For others? Yes.** The train passenger who says "We won’t tell" acts beyond duty—this is true supererogation. The film preserves it for *ordinary* people, not Peter.

  ---

  ### What the Film Adds to the Academic Debate
  1. **Visceral Integrity Loss**: Papers describe "eroding personal projects"; the film *shows* Peter unraveling as he lies to MJ, misses his lecture, and stares at the suit. You *feel* the suffocation of a ceiling-less demand.  
  2. **Identity > Calculation**: "With great power..." isn’t consequentialist. It’s **virtue ethics** (Uncle Ben’s wisdom) or **role duty** (heroes act). The film ties responsibility to *who you are*, not what you can achieve. This reframes the demandingness objection: it’s not "too much," but "this isn’t me."  
  3. **The Distributed-Duty Illusion**: The train scene teases collective responsibility—then reveals it’s a fantasy. Society applauds heroes but won’t prevent crises. A brutal critique of *our* complicity.

  ---

  ### Talking Points for Your Group
  - **Your bike vs. Peter’s powers**: EA says your marginal cost to save a life is low ($4k to Against Malaria?). But unlike Peter, your "powers" are finite. The film suggests **demandingness thresholds aren't about ability but sustainability of self**.  
  - **Is quitting *ever* okay?** Peter’s return feels right because he *is* Spider-Man. But if being a doctor made you miserable, quitting might be integrity-preserving, not failure.  
  - **The MJ Problem**: Peter’s lies hurt her. Consequentialism often ignores relational harm. The film says: **demands that force you to betray loved ones are unjust**, regardless of outcomes.

  *Spider-Man 2* ultimately sides with **moderate deontology/virtue ethics**: duties exist, but they must leave room for a life. Peter isn’t a bad person for wanting that bike—he’s human. The film’s power is making you *feel* why "give until it hurts" risks losing the person who gives at all.
