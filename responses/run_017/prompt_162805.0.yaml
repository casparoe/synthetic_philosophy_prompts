  | defeater                  | what_would_have_to_be_true                                                                 | severity                  | defender_concedes | status                  | why                                                                 |
  |---------------------------|-------------------------------------------------------------------------------------------|---------------------------|-------------------|-------------------------|---------------------------------------------------------------------|
  | no_maximum                | Ratio has supremum but no maximum; density measures diverge in infinite worlds.            | fatal                     | grudgingly        | live                    | Actual world cannot be "best" if no maximum exists.                 |
  | clause_4_untestable       | Isolated suffering with no global causal role (e.g., pre-human pain).                     | serious-but-survivable    | grudgingly        | live                    | Untestable "compensation" voids empirical content.                  |
  | density_non_uniqueness    | Different value density measures select different "best" worlds.                          | serious-but-survivable    | no                | live                    | No unique best world in infinite settings.                          |
  | better_worlds_compossible | A compossible world with higher R/L exists (e.g., pain-free biodiversity).                | serious-but-survivable    | grudgingly        | live                    | Directly contradicts "actual is best."                              |
  | ratio_arbitrary           | A non-arbitrary alternative value metric outranks R/L.                                    | merely awkward            | no                | logically possible      | Challenges the foundation of clause 2.                              |

