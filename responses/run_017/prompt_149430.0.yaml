prompt: |-
  I sit on my school's Student Integrity Board, which rules on whether a particular gift or favor counts as corrupt. I would be grateful for help reading our own track record.

  Our rulings so far:

  1. A club treasurer accepted a box of pastries from a bakery owner, given as thanks after the club had finished buying there for the year. Not corrupt.
  2. A student sent a $50 gift card to a teacher with a note asking her to reconsider a grade that had not yet been submitted. Corrupt.
  3. A parent donated new jerseys to the athletic department and then emailed the coach asking that his daughter start at point guard. Corrupt — the Board said the connection did not have to be stated out loud.
  4. A student gave each of her teachers a jar of preserves at the start of the year, as her family always does. Not corrupt.
  5. A parent offered a contribution to the principal's discretionary fund while his son's suspension appeal was pending, explaining that in the country he grew up in such gifts to officials are ordinary. Corrupt; the Board added that its standard applies regardless of local custom. It has also hinted, without ever saying why, that a standing relationship of favors is worse than a one-off offer.

  The new case: for three years a family that owns a restaurant near the school has hosted a free dinner each June for the whole Student Council and its faculty adviser — no request attached, and Council took no vote for months afterward. This year the dinner is moved to the week before a vote on a student-activities-fee increase that would pay for more catered school events, and the invitations go only to the eleven voting members: the alternates and the adviser, who were always included before, are not invited.

  What should the Board decide if it wants to be consistent with itself, and which precedent is the closest analog? I am less interested in the verdict than in the rule we are implicitly running: is it a test about the giver's intent to influence, about whether a donor with a financial stake is buying access and indebtedness, about whether the gift is targeted at the actual decision-makers, about customary practice as an exemption, or something else? If our rulings genuinely underdetermine the case, tell me what principle we would be committing to with each choice, and which single further case would best separate the rules still in play.
reasoning: |-
  Okay, I'm looking at this user's query about their Student Integrity Board. They need help analyzing a new case about a free dinner hosted by a restaurant family for the Student Council, and they want to understand the implicit rules from past rulings to stay consistent. 

  First, I need to parse their existing cases to identify patterns. The key precedents show corruption hinges on several factors: timing relative to decisions, targeting of decision-makers, and implicit expectations. For example, case 2 (gift card before grade submission) was corrupt because of direct solicitation, while case 4 (annual preserves) wasn't due to established custom without decision links. Case 3 is crucial—it shows implied intent matters even without explicit requests. 

  The new case has red flags: the sudden exclusion of non-voters right before a fee vote suggests deliberate targeting. The family's restaurant stands to gain financially from more catered events if the fee passes. Unlike the harmless preserves tradition (case 4), this timing and selectivity create implicit pressure. 

  The user seems to want clarity on their board's unspoken principles. From the cases, I see a "totality of circumstances" approach emerging: gifts are corrupt when they create indebtedness during pending decisions, especially from stakeholders. Custom alone isn't a shield (case 5), but context-dependent goodwill like the pastries (case 1) can be exempt. 

  For consistency, this new dinner feels closest to case 3—implied influence via strategic timing and beneficiary targeting. A "not corrupt" verdict would contradict their stance on unspoken quid pro quos. If they're unsure, I should propose a hypothetical future case to test intent versus timing, like a post-vote dinner with the same exclusivity. 

  The user's deeper need might be systematizing their reasoning—they mention underdetermination and wanting a "separating case." That suggests they're preparing for principled debates, not just this ruling. I'll emphasize how each verdict would shift their precedent and offer that clarifying scenario.
answer: |-
  Based on your board's rulings and the principles they imply, here's a consistent analysis of the new case and the underlying rule:

  **Consistent Verdict:** **Corrupt**

  **Closest Analog:** **Case 3 (Jerseys & Point Guard)** - This is the strongest parallel due to the implied connection between the gift and a specific pending decision benefiting the donor, even without an explicit request.

  **The Implicit Rule Your Board is Running:**

  Your rulings indicate a **"Totality of Circumstances" test focused on the potential for undue influence and the appearance of impropriety, prioritizing objective factors over stated intent.** Key elements include:

  1.  **Decision Nexus:** Is the gift/favor closely linked in *timing and context* to a specific, pending decision where the recipient has power and the donor has a stake? (Critical in Cases 2, 3, 5; absent in Cases 1 & 4).
  2.  **Donor Stake:** Does the donor have a direct, tangible financial or personal interest in the outcome of a pending decision? (Present in Cases 2, 3, 5; absent in Cases 1 & 4; relevant here).
  3.  **Recipient Power:** Are the recipients the *actual decision-makers* for the matter concerning the donor? (Explicit in Cases 2, 3, 5; implicit in the shift here).
  4.  **Pattern vs. One-Off:** Does the gift establish or exploit a *standing relationship* creating ongoing indebtedness? (Hinted as worse in Case 5; the 3-year history here creates context).
  5.  **Appearance & Implied Expectation:** Does the *context* create a reasonable perception that the gift is intended to influence, or could create a sense of obligation, *regardless of stated intent or local custom*? (Central to Cases 3 & 5; overrides custom in Case 5).

  **Analysis Against Precedents & Rule:**

  *   **Why Corrupt?**
      *   **Critical Timing Shift:** Moving the dinner to the *immediate week before* a specific vote (fee increase) is highly suspicious, mirroring the "pending decision" timing in Cases 2, 3, and 5.
      *   **Targeting Decision-Makers:** Excluding the non-voting alternates and adviser (who were previously included) specifically targets the *eleven voting members*. This selective gifting directly parallels Case 3 (targeting the coach) and contrasts with Case 4 (non-targeted gifts).
      *   **Clear Donor Stake:** The restaurant owner directly benefits financially if the fee increase passes, as it funds more catered events – a textbook conflict of interest (like the bakery in Case 1, but crucially *with* a pending decision nexus).
      *   **Exploiting an Established Practice:** The 3-year history creates a standing relationship. Holding the dinner *now*, with the *exclusive group*, *before the vote* leverages that goodwill to create an acute sense of obligation or indebtedness among the voters. This aligns with the board's hinted concern about standing relationships being worse.
      *   **Implied Expectation:** The board has ruled (Case 3) that an explicit request isn't needed. The context – a valuable gift (free dinner) from a financially interested party, exclusively to decision-makers, immediately before their vote – creates an undeniable *appearance* of an attempt to influence and an *implied expectation* of favorable treatment, regardless of what's said. Custom (Case 5) isn't a defense here.
      *   **Contrast with "Safe" Precedents:** Unlike Case 1 (gift *after* business concluded, no pending issue) or Case 4 (routine, non-targeted gift with no decision link), this gift is intrinsically linked to a pending decision benefiting the giver.

  *   **Why Case 3 is the Closest Analog:** Both involve:
      *   A gift from a stakeholder (parent/restaurant owner).
      *   Targeting the specific decision-maker(s) (coach/voting council members).
      *   A pending decision directly impacting the donor (starting position/funding for catering contracts).
      *   An implied expectation of reciprocity, without an explicit quid pro quo being stated.
      *   The board's rejection of the "no explicit request" defense.

  **If the Case Seems Underdetermined & Principles at Stake:**

  While the above strongly points to "Corrupt," let's assume the board feels conflicted:

  *   **Principle Committed to with "Corrupt" Verdict:** The board firmly prioritizes preventing *even the appearance of undue influence* and protecting the integrity of decision-making processes. It holds that *timing, targeting, and donor stake* create an unacceptable risk of corruption by creating indebtedness or expectation, *especially* when exploiting an existing relationship, regardless of stated intent. It views the decision nexus as paramount.
  *   **Principle Committed to with "Not Corrupt" Verdict:** The board emphasizes *proven intent* and *explicit requests* as necessary for corruption. It views longstanding, customary practices (like the annual dinner) as inherently benign, even when altered, unless an explicit demand is made. It downplays the significance of timing and targeting changes if no explicit request is attached.

  **The Single Further Case to Separate the Rules:**

  **The Clarifying Case:** *The same restaurant family hosts its usual free June dinner for the* ***entire*** *Student Council (including alternates and adviser), as in previous years. However, this year, the vote on the activities-fee increase (which would fund more catering) happens to be scheduled for the week* ***after*** *the dinner. No mention of the vote is made during the dinner.*

  *   **How it Separates the Rules:**
      *   **"Corrupt" Principle Focus (Nexus/Appearance):** This would likely still be seen as corrupt by the "nexus" view. The vote is *imminent*, the donors have a *massive stake*, and the dinner creates a direct sense of obligation for the decision-makers *just before* they vote. The lack of an explicit request and the inclusion of non-voters wouldn't override the powerful timing and stake factors. The established practice is weaponized by the timing.
      *   **"Not Corrupt" Principle Focus (Intent/Explicitness):** This would likely be seen as *not corrupt*. It maintains the established custom and group inclusion. The vote timing is coincidental, and crucially, *no explicit request was made*. The burden of proving intent to influence falls entirely on the timing coincidence, which might be deemed insufficient without more.

  This case directly tests the *relative weight* your board assigns to **imminent timing + donor stake** versus **explicit request + deviation from custom**. A "Corrupt" ruling in this clarifying case confirms your board operates on a strong objective appearance/implicit expectation standard. A "Not Corrupt" ruling signals a much higher bar requiring near-explicit solicitation or a drastic change in the gift itself relative to custom.
