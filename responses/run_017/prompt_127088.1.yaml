prompt: |-
  Hey — I'm putting together a problem set for my grad seminar on philosophy of cognitive science (we're in the predictive processing / active inference stretch), and I want one question that forces them to actually run the machinery instead of repeating slogans back at me. I keep starting from something like an ambiguous email from someone whose opinion of you matters, or a meeting you could quietly skip — but use whatever setting you like.

  The way I've been framing the machinery for them: on the myopic, "variational" reading, what the system does at each moment is minimize the surprise of the sensations it is currently getting, and it can do that either by updating its generative model or by acting so that incoming input matches what it already predicted. On the expected-free-energy reading, candidate policies are scored by the free energy they're expected to bring, and that quantity decomposes into a risk term — how far the outcomes a policy is expected to produce sit from the outcomes the organism is set up to expect — and an ambiguity term — how much the sensations expected under that policy would still leave you unsure about what's going on in the world. The epistemic bit, on this reading, isn't bolted on from outside; it's already inside the same quantity as the pragmatic bit, which is exactly why people argue about whether it's really doing any work.

  So here's the build. Give me one paragraph (160 words max) featuring an ordinary adult human in a recognizable everyday setting, with two or at most three options in front of her. Constraints: no clinical populations, no rats in boxes, no scanners, no sci-fi, no pharmacological or neural interventions, and no stipulated weirdness about the agent. The two readings have to come apart: the myopic reading says do A, the expected-free-energy reading says do B. Important: I want the myopic reading to be scoring actions here, not just shrugging and recommending a belief update — otherwise the comparison is rigged in the EFE story's favor and my sharper students will call it. On top of that, a plain myopic reward-maximization story (take whatever is most pleasant / least aversive right now) has to also say A, so the case pulls EFE apart from the hedonic story too. Same agent, same priors, same preferences, same evidence across all the options, so the disagreement can't be blamed on a difference in what she wants. And this is the one that matters for my purposes, so I'll say it up front: the whole point of the exercise is to see whether the ambiguity term has any behavioral content that isn't just a curiosity bonus smuggled in, so the moment your agent is stipulated to enjoy finding things out, to get a kick out of uncertainty, or to have an information-seeking utility bolted onto her, the case is worthless to me. The ambiguity term has to earn its keep structurally — e.g. by being load-bearing for a wide swath of downstream predictions — not by being a novelty preference in a trench coat. Both orderings (immediate surprise, and expected free energy) need to be readable off the scenario, because I have to grade these.

  After the scenario, the walkthrough: for each option, its risk term, its ambiguity term, and which reading picks it; then name the single load-bearing feature that's doing the work; then ablate it and tell me what the case collapses into (I'm guessing something dark-room-ish where all three stories agree); then the best version of the complaint you'd get from someone in my department who thinks active inference is just reward learning with Bayesian window dressing, and what you'd have to add to the case to block that complaint; and finally one line on why this isn't cheating, i.e. why the verdicts fall out of the frameworks rather than being written into the setup. If you don't think the specs are jointly satisfiable, say that first and tell me which one has to give.

  Give it back as a JSON object with these fields: "scenario" (the paragraph), "options" (array, one object per option with keys "option", "immediate_surprise", "risk_term", "ambiguity_term", "myopic_reading_verdict", "myopic_reward_verdict", "efe_verdict"), "efe_winner", "myopic_winner", "load_bearing_feature", "ablation", "skeptics_best_reply", "why_not_cheating". Keep every field except the scenario to a sentence or two — I'm pasting these into an answer key.
reasoning: |-
  We are constructing a scenario that satisfies the following constraints:
   1. Ordinary adult human in a recognizable everyday setting.
   2. Two or three options.
   3. The myopic (variational) reading minimizes current surprise by acting (or updating beliefs, but we want action to be the focus). 
      - The myopic reading must recommend an action (A) that minimizes immediate surprise.
   4. The expected free energy (EFE) reading must recommend a different action (B).
   5. The plain myopic reward-maximization (hedonic) story must also recommend A (so EFE is pulled apart from both the myopic surprise minimization and the hedonic story).
   6. The agent must not be stipulated to have an inherent curiosity or information-seeking utility. The ambiguity term must be structurally necessary.

   How to achieve this?
   - We need a situation where acting to minimize immediate surprise (and also to maximize immediate reward) leads to one option (A), but considering the expected free energy (which includes risk and ambiguity) leads to a different option (B).
   - The key is that the ambiguity term in EFE (which is about expected information gain) must be critical for choosing B, but without the agent having a built-in preference for information. Instead, the ambiguity must be important for reducing future surprise or enabling better future actions.

   Scenario Idea:
   Setting: A professional context. The agent is at work and has an important meeting in an hour. She is currently at her desk and has two options:
     Option A: Stay at her desk and prepare for the meeting (by reviewing notes, etc.). This is a low-immediate-surprise action because she is in a familiar setting and doing a routine task. It also minimizes immediate aversive feelings (like anxiety) and is pleasant because she feels productive. So both myopic surprise minimization and myopic reward maximization say A.
     Option B: Walk to the conference room now (an hour early) to check if the projector is working. Why? Because in the past, the projector has been unreliable, and if it fails during the meeting, it would be highly surprising (and aversive). However, right now, walking to the conference room is a bit effortful and might cause some immediate surprise (e.g., unexpected interactions, physical effort) and is less immediately rewarding than preparing at her desk.

   But note: The immediate surprise of Option B might be higher than staying at the desk? We need to set up so that the immediate sensations of B are more surprising than A.

   However, the EFE for the policy of going to check the projector:
     - Risk term: If she goes and checks, she might find the projector broken and then can fix it (by calling IT) or adjust (find another room). The expected outcomes (a smooth meeting) are close to her preferences (which is a successful meeting). If she doesn't go, there's a risk that the projector fails and the meeting is disrupted (high risk).
     - Ambiguity term: Currently, she is uncertain about the state of the projector. If she goes and checks, she will resolve that uncertainty. The expected sensations under the policy of going are unambiguous: she will see whether the projector works or not. The policy of staying leaves the uncertainty high (so the ambiguity term is high for staying).

   Therefore, the EFE for going (B) is lower than for staying (A) because:
     - The risk term for going is low (she can fix the problem if found) and for staying is high (if the projector fails, the meeting is a disaster).
     - The ambiguity term for going is low (because she will get clear information) and for staying is high (she remains uncertain).

   But note: The myopic surprise minimization at the current moment: 
     - Option A: staying at desk -> low immediate surprise (familiar, safe, predictable).
     - Option B: walking to the conference room -> higher immediate surprise (might encounter people, the walk is less familiar at that moment, etc.).

   Also, the myopic reward maximization: 
     - Option A: immediate reward of feeling prepared and avoiding effort.
     - Option B: immediate cost of effort and possible social encounters (which might be aversive if she is introverted).

   So both myopic readings (surprise and reward) say A (stay and prepare). But EFE says B (go check).

   However, we must ensure that the ambiguity term is not just a curiosity bonus. In this case, the information gained by going to check the projector is pragmatically useful: it allows her to take an action (calling IT) that prevents future surprise (a disrupted meeting). Thus, the ambiguity term is load-bearing because without resolving the uncertainty, she cannot effectively minimize future surprise.

   Now, let's write the scenario paragraph (within 160 words):

   Scenario:
   "Sarah has an important presentation in an hour. She can either stay at her desk reviewing her notes (Option A) or walk to the conference room now to test the projector (Option B). The projector has been unreliable, and if it fails during her talk, it would derail the meeting. Staying put is comfortable and lets her prepare without disruption. Walking to the room now might interrupt her flow and she might run into colleagues, but then she'd know if the projector works and could call IT if needed."

   Options:
     Option A: Stay at desk and prepare.
     Option B: Walk to conference room to test projector.

   Now, the breakdown for each option:

   For Option A (stay at desk):
     immediate_surprise: low (familiar environment, routine task)
     risk_term: high (because there is a significant chance the projector fails, leading to a meeting disaster which is far from her preferred outcomes)
     ambiguity_term: high (because she remains uncertain about the state of the projector)
     myopic_reading_verdict: yes (minimizes immediate surprise)
     myopic_reward_verdict: yes (maximizes immediate reward: comfort, avoiding effort and social encounters)
     efe_verdict: no (because the expected free energy is high due to high risk and ambiguity)

   For Option B (go check):
     immediate_surprise: high (unfamiliar action, potential unexpected encounters)
     risk_term: low (by checking, she can mitigate the risk: if broken, call IT; if working, then she is assured)
     ambiguity_term: low (by checking, she resolves the uncertainty about the projector)
     myopic_reading_verdict: no (does not minimize immediate surprise)
     myopic_reward_verdict: no (immediate effort and potential awkwardness)
     efe_verdict: yes (low expected free energy because of low risk and low ambiguity)

   EFE winner: Option B
   Myopic winner: Option A

   Load bearing feature: The uncertainty (ambiguity) about the projector state is critical because without resolving it, the agent cannot effectively minimize future risk (i.e., the projector failure). The ambiguity term in EFE is not an independent curiosity drive but is structurally necessary for reducing future surprise.

   Ablation: If we remove the uncertainty (e.g., she already knows the projector is working), then both EFE and myopic readings would agree on staying (Option A). If she knows it's broken, then EFE might recommend going to call IT immediately (but then the immediate surprise of going might be justified by the known broken state). Without uncertainty, the ambiguity term disappears and the risk term for staying becomes even higher (if known broken) or low (if known working). Without uncertainty, the case collapses: both myopic and EFE would avoid going if the projector is known to be working, and if known broken, both would agree on taking action (but then the immediate surprise of going might be lower because the action is necessary). So the dark-room-like situation is when there is no uncertainty and no risk.

   Skeptics best reply: A skeptic might argue that the agent is simply maximizing long-term reward (or minimizing long-term surprise) and that the decomposition into risk and ambiguity is just a redescription. They might say that the ambiguity term is not doing any real work because the agent only cares about the projector state insofar as it affects the success of the meeting (a pragmatic outcome). Thus, the EFE framework is just reward maximization with Bayesian beliefs.

   How to block that? We must show that the ambiguity term is necessary to explain why the agent would choose to check the projector even when the immediate expected reward (of staying) is higher and the risk of the meeting failing is the same in both cases? But note: the risk term already captures the pragmatic outcome. The skeptic is right that the agent cares about the meeting success. However, the ambiguity term is still necessary because without it, the agent might not be motivated to resolve the uncertainty. In fact, the skeptic might say that the agent has a prior belief that the projector might be broken and that going to check is a way to ensure the meeting goes well (so it's all risk). But note the definition: the ambiguity term is the expected uncertainty about the states given the observations. In the EFE decomposition, the risk term is about the divergence from prior preferences, and the ambiguity term is about the expected uncertainty. In this case, the ambiguity term is high for staying because the state (projector working or not) is hidden and the sensations during the meeting (if the projector fails) would be ambiguous until it happens. But the key point is: the EFE framework naturally combines both. To block the skeptic, we could point out that in a case where the risk term is held constant (say, the agent doesn't care about the meeting? but that's not the case) it's hard. Alternatively, note that without the ambiguity term, the agent might not seek information when the immediate risk is low but the long-term risk is high because of uncertainty. The structural role of ambiguity is to drive information gathering that is pragmatically useful. So the best reply is that the ambiguity term is part of the same quantity that scores policies, and it is the mathematical structure of EFE that forces the agent to consider both the divergence from preferences and the expected uncertainty. Without the ambiguity term, the agent might not resolve uncertainty even when it is critical for future action.

   Why not cheating? The verdicts fall out of the frameworks because:
     - The myopic surprise minimization only looks at the immediate sensory input. Going to the conference room now causes more immediate surprise (unpredictable walk, encounters) than staying.
     - The myopic reward maximization: the immediate reward of staying (comfort, avoiding effort) is higher than going.
     - The EFE framework, by considering the future implications (and decomposing into risk and ambiguity), naturally favors checking the projector because it reduces both the risk of a bad meeting and the ambiguity about the projector state.

   Therefore, we have a scenario that satisfies the constraints.

   Let's write the JSON accordingly.
