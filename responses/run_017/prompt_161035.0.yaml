prompt: |-
  ok weird situation, hopefully you can help. My team got "reorganized" at work and I got dumped onto a data migration project, and it has quietly turned into a metaphysics problem that I now have to have opinions about by Friday.

  Setup: there's a legacy system I'll call the Beast, with an old schema — Customers, Accounts, Households, and junk like "Arrangement" and "Shadow Account" — and we're merging it into a new system with its own schema. About a third of the Beast's documentation is gone, everyone who built it left years ago, and the vendor will only give us query access to outputs: no internals, no historical logs, no way to run interventions against it. So over and over we hit the same argument: does entity type X in the Beast denote something real in the domain, or is it an artifact of how they happened to store things, or is it the same thing as Y in the new system under another name? And "just look at the data" doesn't settle it, because for a lot of these the accessible outputs provably can't discriminate between the candidates. I keep saying things like "that's not a thing, that's a way of talking" and my colleague says "you can't know that, you can't see the logs," and we are going in circles.

  I've been reading up on ontology identification / ontology matching and it's 90% tooling and 10% the question I actually have, so I want the philosophical spec instead. Write me the desiderata: what a method for identifying what a system's ontology really is has to deliver, in a situation where part of the evidence is permanently inaccessible. Requirements list, with the case or consideration behind each one, and put it in my setting (schemas, lost logs, orphan predicates) as much as in abstract terms. Things I specifically want dealt with, because these are literally the arguments we're having:

  - orphan predicates: a term in the Beast that no accessible query can make come out differently — nothing we can do makes a difference to any output we can see. Does an adequate method owe us a verdict on those at all? Is "delete it" a verdict or a refusal?
  - dormant vs dead: some of these would matter again if we ever recovered the logs or got write access; some wouldn't matter under any expansion of access at all. Is a method allowed to treat "it would make a difference if we could see more" as evidence that it's there now? Should it?
  - I think two requirements we both sort of want can't both hold: never conclude non-existence just because the evidence is missing, but also don't keep entities alive forever just because nobody can disprove them. If that's right, say so and say what has to give.
  - should the method also have to tell us what would settle the question — which inaccessible fact, if we got it, would flip the verdict? My colleague says that's the whole point; I think it's optional. Who's wrong?
  - granularity: Household vs. the three Customers in it. Is that a fourth thing or a façon de parler, and what does the method owe us here? Be explicit about whether "it's just how we talk" is an ontological verdict or a cop-out.
  - identity over time and across systems: is supplying identity criteria an input to the method or a deliverable of it? And can the method work pairwise (match two schemas at a time) or must it be global? I have a feeling that pairwise matching + treating "is the same entity as" as transitive + admitting borderline cases are jointly unsatisfiable — tell me if that's a real tension or if I'm talking nonsense.
  - verdicts indexed to an access profile (same system, different clearance, different verdict): bug or feature?

  Mark which requirements are non-negotiable and which are just the taste of one camp — I'm pretty sure my colleague is smuggling in a verificationist prejudice and I want it flagged as such rather than smuggled into the spec. Also, fix the purpose: I need this good enough to actually decide what to migrate and what to flag to compliance as uncertain, so say which desiderata change if the purpose is legal/audit rather than description. Tell me which single requirement knocks out the most tempting approaches. Then a short scorecard, three approaches only: count only what's directly accessible; count whatever the best explanation of the accessible evidence needs; count whatever our best description of the domain quantifies over. Keep the weight on the criteria, not the scoring. No bibliographies or citations, I can't follow up on references right now and I'd rather have the argument anyway.
reasoning: |-
  We are in a data migration scenario with a legacy system ("Beast") and a target system. The problem is ontological: determining what entities in the Beast's schema correspond to real entities in the domain versus implementation artifacts, and how they map to the target system. Key challenges include inaccessible internals (logs, write access) and "orphan predicates" (terms that don't affect any accessible output).

  We must define desiderata for a method that identifies the ontology of the Beast given the constraints. The method must help decide what to migrate and what to flag as uncertain, with potential legal/audit implications.

  ## Core Desiderata for an Ontology Identification Method

  1. **Non-Negotiable: Must Operate Within Accessible Evidence**  
     The method cannot rely on evidence that is permanently inaccessible (like internal logs). It must deliver verdicts based solely on what we can observe (query outputs) and the schema structure.  
     *Why*: Because we have no way to verify claims that depend on inaccessible data. This requirement knocks out approaches that require full system introspection.

  2. **Non-Negotiable: Must Provide Actionable Verdicts**  
     The method must output a verdict (e.g., "real entity", "artifact", "same as X in target system") for every entity in the Beast, even if the verdict is "uncertain". It cannot leave entities in limbo.  
     *Why*: We need to decide what to migrate and what to flag for compliance. "Delete it" is a verdict (it means "treat as non-existent for migration") but must be justified by the method.

  3. **Non-Negotiable: Must Distinguish Between Dormant and Dead Orphan Predicates**  
     - **Orphan predicate**: A term that does not affect any accessible output.  
     - The method must classify orphans as:  
       - **Dormant**: Would matter if we had more access (e.g., if we could see logs or run interventions).  
       - **Dead**: Would not matter under any expansion of access (it is purely an artifact).  
     *Why*: Because dormant orphans might have legal/audit implications (they could become relevant if access changes) and must be flagged. Dead orphans can be safely ignored.  
     *How*: By analyzing counterfactuals: "If we had write access, would changing this predicate affect outputs?" If yes, dormant; if no, dead. This requires reasoning about the system's possible states, not just actual observations.

  4. **Non-Negotiable: Must Reject Both Naive Verificationism and Eternal Suspense**  
     The method must avoid two extremes:  
     - **Verificationism**: Concluding non-existence solely because of missing evidence (we cannot see it, so it isn't real).  
     - **Eternal Suspense**: Keeping entities "alive" indefinitely because we cannot disprove them.  
     *Resolution*: The method must use the best explanation of accessible evidence (see point 7) to make defeasible verdicts. Non-existence can be concluded only for dead orphans (point 3). For all others, verdicts are probabilistic or tagged with uncertainty.

  5. **Conditional: Should Output What Would Settle the Question**  
     This is a feature, not a bug. For every verdict, especially uncertain ones, the method should specify what inaccessible fact (if recovered) would change the verdict.  
     *Why*: Because it helps compliance/audit teams prioritize recovery efforts and understand risks. However, it is secondary to delivering verdicts (point 2).  
     *Non-negotiable for legal/audit purposes*: If the migration has compliance implications, this becomes essential.

  6. **Non-Negotiable: Must Handle Granularity Explicitly**  
     - The method must decide whether a grouping (e.g., Household) is a real entity or a façon de parler (a way of talking about its members).  
     - "It's just how we talk" is an ontological verdict: it means the grouping has no independent existence beyond its parts.  
     *How*: By checking if the grouping has properties/behaviors not reducible to its parts in accessible outputs. If not, it is an artifact.  
     *Example*: If Household has attributes (e.g., "household credit score") not computable from individual Customers, it is real. Otherwise, it is an artifact.

  7. **Non-Negotiable: Must Use Identity Criteria as Input, Not Output**  
     - Identity over time and across systems must be supplied as part of the method's input (e.g., business rules from stakeholders).  
     - The method cannot invent identity criteria; it can only test candidate criteria against evidence.  
     *Why*: Identity is domain-specific (e.g., when does an Account merge or split?) and must come from business knowledge.  
     - The method must work pairwise (Beast vs. target) but account for transitivity. If pairwise matching + transitivity leads to contradictions (e.g., A=B, B=C, but A≠C), the method must flag this as a borderline case or an error.  
     *Why*: Global consistency is ideal, but pairwise is practical. Contradictions reveal flaws in candidate identity criteria or schema design.

  8. **Feature: Verdicts Indexed to Access Profile**  
     Verdicts may change if access improves (e.g., from read-only to write access). The method should tag verdicts with the access profile they rely on.  
     *Why*: This is honest and helps in risk assessment. For example, a dormant orphan under current access might become active if write access is granted.  
     *Non-negotiable for audit*: Compliance requires tracking how verdicts depend on evidence quality.

  ## What Breaks Tempting Approaches?
  - **Requirement 1 (accessible evidence only)** knocks out approaches that require full system internals or historical data.
  - **Requirement 3 (dormant vs. dead)** knocks out naive deletion of orphans (which ignores dormancy) and naive preservation (which treats all orphans as real).

  ## How Purpose Changes Desiderata
  - **For legal/audit**:  
    - Requirement 5 (what would settle the question) becomes non-negotiable.  
    - Requirement 8 (access-indexed verdicts) becomes non-negotiable.  
    - Verdicts must be conservative: when in doubt, preserve and flag.
  - **For descriptive purposes only**:  
    - Uncertainty can be left unresolved; verdicts can be probabilistic.

  ## Three Approaches Scorecard
  We evaluate three approaches against the desiderata:

  1. **Accessible-Only Literalism**:  
     Count only what is directly observable in outputs. Orphans are deleted (treated as non-existent).  
     - *Requirement 1*: Pass (only uses accessible evidence).  
     - *Requirement 2*: Pass (gives verdicts).  
     - *Requirement 3*: Fail (cannot distinguish dormant vs. dead; deletes all orphans).  
     - *Requirement 4*: Fail (verificationist: if not seen, it doesn't exist).  
     - *Requirement 5*: Fail (no guidance on what would settle it).  
     - *Requirement 6*: Mixed (if grouping has no observable properties, deleted; but may miss dormancy).  
     - *Requirement 7*: Pass (if identity criteria are observable).  
     - *Requirement 8*: Fail (assumes current access is complete).  
     **Verdict**: Unacceptable for audit; too reckless.

  2. **Best Explanation (Abductive) Approach**:  
     Count whatever entities the best explanation of the accessible evidence requires. Orphans are classified as dormant/dead by counterfactual reasoning.  
     - *Requirement 1*: Pass (uses accessible evidence).  
     - *Requirement 2*: Pass (gives verdicts, with uncertainty).  
     - *Requirement 3*: Pass (explicitly models dormancy).  
     - *Requirement 4*: Pass (rejects extremes: verdicts are best-guess, not certain).  
     - *Requirement 5*: Pass (can say what evidence would change the verdict).  
     - *Requirement 6*: Pass (groupings are real if needed for explanation).  
     - *Requirement 7*: Pass (uses input identity criteria to test explanations).  
     - *Requirement 8*: Pass (can tag verdicts with access dependencies).  
     **Verdict**: Meets all non-negotiable requirements. Best for audit.

  3. **Domain Quantification Approach**:  
     Count whatever entities our best description of the business domain quantifies over (ignoring system implementation).  
     - *Requirement 1*: Fail (relies on domain knowledge, not system evidence).  
     - *Requirement 2*: Pass (gives verdicts).  
     - *Requirement 3*: Fail (cannot classify orphans without system evidence).  
     - *Requirement 4*: Mixed (avoids verificationism but may ignore system artifacts).  
     - *Requirement 5*: Fail (not based on system evidence).  
     - *Requirement 6*: Pass (if the domain quantifies over Households, they are real).  
     - *Requirement 7*: Pass (if domain identity criteria are used).  
     - *Requirement 8*: Fail (not tied to access).  
     **Verdict**: Unreliable for migration (may preserve artifacts or miss system-specific entities).

  ## Conclusion
  Use the **Best Explanation Approach**. It is the only one that:  
  - Respects evidence constraints.  
  - Handles orphans properly.  
  - Avoids ontological extremes.  
  - Is audit-safe.  

  In practice:  
  - For each entity, ask: "What is the simplest story that explains all accessible outputs, including why some queries return what they do?"  
  - Orphans: If an entity never affects outputs, consider if it *could* under expanded access. If not, it's dead; else, dormant.  
  - Granularity: Household is real only if the explanation needs it (e.g., to predict a credit score that isn't just an average of members).  
  - Identity: Use stakeholder-supplied rules to test if Beast and target entities match, and flag contradictions.  

  This approach will tell you:  
  - What to migrate (real entities and their mappings).  
  - What to drop (dead orphans).  
  - What to flag to compliance (dormant orphans, borderline identity cases) with notes on what evidence would resolve uncertainty.
answer: |-
  Below is a structured breakdown of the desiderata (requirements) for a method to resolve ontological ambiguity in your data migration scenario. It addresses your specific pain points, distinguishes non-negotiables from philosophical biases, and clarifies trade-offs. The focus is on practical deliverability given your constraints: partial evidence (no internals/logs), orphan predicates, and the need for auditable decisions.

  ---

  ### **Core Desiderata for Ontology Identification**  
  *Purpose: Map the Beast's schema to the domain/target system with minimal evidence, to decide migration actions (keep, merge, flag, delete) and satisfy compliance.*

  1. **Non-Negotiable: Evidence-Bounded Verdicts**  
     - **What**: The method must output a verdict (e.g., "real entity," "artifact," "equivalent to target entity Y") for every Beast entity **using only accessible evidence** (query outputs, schema structure, known business rules).  
     - **Why**: Inaccessible logs are permanently unavailable; waiting for them is impractical. Verdicts must be actionable *now*.  
     - **Your Context**: Orphan predicates (e.g., "Shadow Account") with no observable effect on outputs *must* receive a verdict. "Delete it" is a valid verdict if justified—it means "no migration needed, treat as noise."  

  2. **Non-Negotiable: Distinguish Dormant vs. Dead Orphans**  
     - **What**: The method must classify orphan predicates as:  
       - **Dormant**: Would impact outputs *if* access expanded (e.g., logs recovered).  
       - **Dead**: No impact under *any* access expansion (pure artifact).  
     - **Why**: Dormant orphans pose compliance risks (e.g., hidden audit trails); dead orphans waste resources.  
     - **Your Context**: "Just look at the data" fails here. The method *must* infer dormancy from counterfactuals (e.g., "If we had write access, could changing this field alter outputs?").  
     - **Bias Alert**: Your colleague's "you can't know without logs" is verificationist (existence requires observable proof). Non-negotiable rejects this: we *can* infer dormancy from schema/dependencies.  

  3. **Non-Negotiable: Reject the "Existence Suspense" Trap**  
     - **What**: The method *cannot* allow:  
       - **Verificationism**: "No evidence ⇒ non-existence."  
       - **Eternal Suspense**: "No evidence ⇒ we can never decide."  
     - **Why**: Both are impractical. Verificationism ignores dormancy; eternal suspense halts migration.  
     - **Resolution**: The method must use **inference to the best explanation** (IBE). If all accessible evidence is equally explained with/without an entity, default to "dead orphan" (simplicity). Dormancy requires positive evidence (e.g., schema links to active fields).  
     - **Trade-Off**: You lose "absolute certainty" but gain auditable decisions.  

  4. **Negotiable: Specify What Would Settle Uncertain Verdicts**  
     - **What**: For uncertain verdicts (e.g., dormant orphans), the method *should* output what inaccessible fact would change the verdict (e.g., "log entry X would confirm dormancy").  
     - **Why**: Critical for compliance/audit to justify uncertainty. *But* it’s optional for purely descriptive goals.  
     - **Your Context**: Your colleague is **wrong** that this is "the whole point." It’s a *supplement* to verdicts, not a core output. Prioritize it only if legal risk is high.  
     - **Non-Negotiable for Audit**: If compliance is a concern, this becomes mandatory.  

  5. **Non-Negotiable: Resolve Granularity Explicitly**  
     - **What**: The method must decide if groupings (e.g., "Household") are:  
       - **Real Entities**: Exist independently (e.g., Household has properties not reducible to Customers).  
       - **Façon de Parler**: Convenient labels, reducible to parts (e.g., "Household" is just a query grouping Customers).  
     - **Why**: Migration requires knowing whether to map groupings or their parts.  
     - **Your Context**: "It’s just how we talk" **is a verdict** (artifact), not a cop-out. The method must test irreducibility (e.g., if Household has unique attributes in outputs, it’s real).  

  6. **Non-Negotiable: External Identity Criteria**  
     - **What**: Identity (e.g., "Beast Account = Target Account") must be **input** (from business rules/stakeholders), not inferred.  
     - **Why**: Identity is domain-specific; the method tests consistency with evidence but can’t invent criteria.  
     - **Pairwise vs. Global**: Pairwise matching (Beast vs. target) is sufficient, but:  
       - Transitivity (if A=B and B=C then A=C) must be enforced.  
       - Contradictions (e.g., A=B, B=C, but A≠C) **reveal flawed criteria or borderline cases**—flag these for manual review.  
     - **Your Tension is Real**: Pairwise + transitivity + borderlines *is* unstable. The method must flag inconsistencies, not hide them.  

  7. **Feature: Access-Indexed Verdicts**  
     - **What**: Verdicts should be tagged with the access profile they rely on (e.g., "dormant under query access").  
     - **Why**: Future access changes (e.g., log recovery) may alter verdicts. This is a **feature** for audit trails.  
     - **Your Context**: Compliance demands this—it shows due diligence if verdicts change later.  

  ---

  ### **How Purpose Changes Desiderata**  
  - **Legal/Audit Focus**:  
    - Non-negotiable: #4 (specify what would settle verdicts), #7 (access-indexing), #2 (dormant/dead classification).  
    - Verdicts must err toward conservatism (e.g., preserve dormant orphans).  
  - **Descriptive Focus** (e.g., schema docs only):  
    - #4 and #7 become optional.  
    - Verdicts can prioritize simplicity (e.g., delete more orphans).  

  ### **What Breaks Tempting Approaches?**  
  - **Requirement #3 (reject eternal suspense)** sinks:  
    - "Wait-and-see" (requires inaccessible evidence).  
    - "Preserve all orphans" (inactionable).  
    - Naive verificationism ("delete all orphans").  

  ---

  ### **Approach Scorecard**  
  *Evaluated against non-negotiables (#1–3,5–6). "Pass" = fully meets, "Partial" = meets only with trade-offs, "Fail" = violates.*  

  1. **Count Only Accessible Evidence**  
     - **Premise**: If an entity isn’t observable in outputs, it doesn’t exist. Delete orphans; ignore dormancy.  
     - **#1**: Pass (uses accessible data).  
     - **#2**: Fail (deletes all orphans—no dormant/dead distinction).  
     - **#3**: Fail (verificationist: "no evidence ⇒ non-existence").  
     - **#5**: Partial (groupings are artifacts if no unique outputs).  
     - **#6**: Pass (if identity is input).  
     - **Verdict**: Unfit. Violates #2–3; ignores compliance risks.  

  2. **Count What Best Explains the Evidence**  
     - **Premise**: Infer entities needed to explain accessible outputs (e.g., "Household is real if it explains output patterns"). Orphans are dead unless dependencies suggest dormancy.  
     - **#1**: Pass (uses accessible evidence).  
     - **#2**: Pass (explicit dormant/dead classification).  
     - **#3**: Pass (rejects extremes via IBE).  
     - **#5**: Pass (groupings are real if irreducible).  
     - **#6**: Pass (tests input identity rules).  
     - **Verdict**: Best fit. Meets all non-negotiables and handles audit needs.  

  3. **Count What the Domain Quantifies Over**  
     - **Premise**: Ignore system internals; use business glossaries (e.g., "Household is real per our domain model").  
     - **#1**: Fail (ignores system evidence; legacy schemas often deviate from ideal domains).  
     - **#2**: Partial (classifies orphans but misses dormancy).  
     - **#3**: Partial (avoids verificationism but may preserve dead artifacts).  
     - **#5**: Pass (if domain says groupings are real).  
     - **#6**: Fail (identity may not match system behavior).  
     - **Verdict**: Risky. Ignores evidence, creating false positives (artifacts treated as real).  

  ---

  ### **Recommendation**  
  **Use Approach #2 (Best Explanation)**. It:  
  - Delivers verdicts on orphans (e.g., "Shadow Account is dead; delete").  
  - Flags dormancy (e.g., "Arrangement is dormant—if logs surface, it may impact X").  
  - Handles granularity (e.g., "Household is real due to irreducibility in outputs").  
  - Integrates your access constraints and avoids philosophical traps.  

  **To break your stalemate**:  
  1. For each disputed entity, ask: *"What minimal story explains all accessible outputs? Does this entity play a necessary role?"*  
     - Yes + impacts outputs → Real.  
     - Yes + no current impact → Dormant.  
     - No → Dead.  
  2. For identity matching: *"Do stakeholder rules + transitivity hold? If not, flag the contradiction."*  
  3. Document verdicts with:  
     - **Action** (migrate/delete/flag).  
     - **Certainty** (e.g., "low—would require log Y to confirm").  
     - **Access Dependencies** (e.g., "dormant under current access").  

  This method ensures defensible decisions for Friday. Your colleague’s verificationism is flagged as bias (#2–3); your "way of talking" is a valid verdict (#5). If they protest, ask: *"What testable prediction does your view enable?"* If none, it’s metaphysics—not migration.
