prompt: |-
  I am the managing editor of a mid-sized journal in molecular and cell biology, and I am rewriting the section of our house style guide that deals with what we loosely call 'metaphorical language'. The people who have to enforce it are my copy-editors: they have degrees in biology but no philosophy, they process thirty or forty manuscripts a month, and they have roughly two minutes per flagged sentence before the production schedule slips. They can refer a problem to the handling editor, who has the final say, but in practice they must make the call themselves, and they need a sentence they can paste into an email to an author who has written back furious that we have flattened their prose — last year one such exchange ended up in a blog post accusing us of censorship, which is the sort of thing my editor-in-chief would rather not repeat. Our current rules are pure inherited precedent: we let through 'the genetic code', 'transcription', 'translation', 'reading frame', 'start codon' and 'misreading' without comment; we routinely strike 'the genome is the blueprint of the organism', 'genes for aggression', 'the cell interprets the signal', 'the instruction manual of life'; and we have no principled way of saying why one list is acceptable and the other is not, nor any way of handling the very large number of phrases that sit in between them — 'encodes', 'specifies', 'carries information', 'instructs', 'targets', 'reads out', 'programmes', 'switches on'.

  What I want from you is a decision procedure my copy-editors can actually run, grounded in whatever the philosophy of biology has to say on this that is usable at two minutes per sentence. No literature review, no references, no history of the debate: just the distinctions that have to survive the simplification, and an honest note on which ones can be dropped. The distinctions I think matter are these, though the procedure should correct me if I have mis-described them: (i) the narrow sense in which there is a code at all — a mapping from codons to amino acids that is physically implemented by adaptor molecules rather than settled by convention or by what an interpreter intends — as against the broad sense in which a genome is called a programme, blueprint, recipe or text; (ii) 'information' in the sense of a reduction in uncertainty at a receiver, as against information about the phenotype, i.e. content that is about something and can in principle be wrong about it; (iii) the awkward fact that which content a stretch of sequence bears seems to depend on the machinery present — reading frame, splicing, chemical marks — so that the string on its own may not fix any message at all; (iv) whether anything in the cell occupies the role that would make 'error' and 'misreading' more than a façon de parler, or whether there is only causation with a norm projected onto it by us; (v) the difference between a representation of what is to be built and a trigger or resource that a developing system simply uses. I gather there are live disputes here — some people want content grounded in selection history, others want to treat the whole developmental system rather than the sequence as the unit — and I do not need the procedure to settle those, only to be robust to them. Give me the tests in the order they should be applied, what counts as a pass at each, where the procedure halts with a definite yes or no, and where it must hand the decision back to a person because the question is really one of our editorial policy, or of what the field's usage has already made standard, rather than one of fact. Mark clearly which steps are judgement calls dressed up as tests.

  Then run it, as a copy-editor would, on three sentences from recent submissions: (a) 'the transcription factor reads out the regulatory information encoded in the enhancer sequence'; (b) 'the genome contains the complete programme for building the organism'; (c) 'methylation marks carry epigenetic information that the cell reads and that specify which genes to express'. For each, tell me what the procedure outputs, what it does to the sentence, and the one-line justification the editor can send the author. I also suspect that at least one of the phrases we currently pass — 'genetic information' is my own worry, but it may be 'the genetic code' — fails the tests you are going to give me; if so, say so plainly and explain why, because I would much rather hear it from you than discover it while defending house style to an author. Finally, tell me what the procedure cannot do: the sentences it must simply leave alone, the cases where it will misfire badly, and the kind of claim it has no purchase on at all.
reasoning: |-
  Okay, the user is a managing editor at a molecular and cell biology journal. They're dealing with a tricky problem: how to guide copy-editors on when to flag metaphorical language in manuscripts. The copy-editors are biologists without philosophy backgrounds, working under tight deadlines—about two minutes per flagged sentence. They need a quick, practical decision procedure that's grounded in philosophy of biology but simplified for real-world use. 

  The user has outlined five key distinctions they care about: (i) the genetic code vs. broader metaphors like "blueprint", (ii) information as uncertainty reduction vs. semantic content, (iii) context-dependence of sequence meaning, (iv) whether "error" implies a real norm or just human projection, and (v) representation vs. trigger/resource. They want a step-by-step test that doesn't resolve academic debates but works despite them. 

  Hmm, the urgency here is palpable. The user mentions a past incident where an author accused them of censorship—this isn't just about precision, it's about reputation management. The editor-in-chief wants no repeats. The copy-editors need defensible, one-line justifications for authors. 

  First, I need to boil down philosophy to executable steps. The core tension: some metaphors are entrenched technical terms ("genetic code"), others are misleading anthropomorphisms ("blueprint"). The line isn't always clear. 

  Key principles from philosophy: 
  - "Code" is defensible only for codon-amino acid mapping (physical adaptors, not convention). 
  - "Information" as Shannon-type (uncertainty reduction) is safer than semantic claims (e.g., "about" phenotypes). 
  - Context-dependence matters: without cellular machinery, sequences aren't "messages." 
  - Normative terms ("error") need grounding—perhaps in evolved function, but that's contested. 
  - Avoid implying representations (like blueprints) where it's really causal triggers. 

  But academic nuance must yield to practicality. Tests should cascade: quick checks first, hardest last. Judgment calls should be explicit. 

  For the procedure: 
  1. Start with a whitelist of accepted terms (e.g., "genetic code," "transcription"). If match, pass. 
  2. Blocklist clearly misleading metaphors (e.g., "blueprint," "instruction manual"). 
  3. Check if it's Shannon information (e.g., signal/noise contexts). 
  4. Test for semantic claims—does it imply "aboutness" or correctness? 
  5. Assess context-dependence—does the sentence imply meaning resides solely in sequence? 
  6. Flag normative terms lacking mechanistic basis. 
  7. Finally, representation vs. trigger—does it mischaracterize the causal role? 

  For the examples: 
  (a) "Reads out" and "encoded" might pass if "regulatory information" implies sequence specificity (Shannon-type). But "reads out" anthropomorphizes—tricky. Probably edit to "binds and responds to." 
  (b) "Programme" is blocklisted—it implies preformation. Kill it. 
  (c) "Carry epigenetic information" is borderline; "specify" is problematic. Edit to "methylation marks influence gene expression." 

  Biggest concern: "genetic information" is everywhere but philosophically shaky. It often smuggles in semantic content. I should warn them—it might need grandfathering despite issues. 

  Limitations: The test can't handle deeply embedded metaphors or terms where field usage overrides philosophy (e.g., "gene expression"). Also, metaphors in discussion sections might be rhetorical—procedure could overcorrect. 

  The user needs armor against accusations of pedantry. Justifications must sound scientific, not philosophical. E.g., "This implies centralized control unsupported by evidence" works better than "Violates telcosemantics." 

  This is balancing act: rigorous enough to be defensible, simple enough for two-minute decisions. Gotta mark the judgment calls clearly.
answer: |-
  Here's a decision procedure for your copy-editors, designed for speed and defensibility, grounded in key philosophy of biology distinctions. It prioritizes **actionability** and **editorial policy** over philosophical resolution. Steps are ordered to catch the worst offenders first.

  ---

  ### **The Metaphor Decision Procedure (2-Minute Version)**

  1.  **WHITELIST CHECK:** Does the phrase match *exactly* a term on the pre-approved list? (`genetic code`, `transcription`, `translation`, `reading frame`, `start codon`, `misreading`)
      *   **Pass:** Allow without change. **HALT.**
      *   **Fail:** Proceed to Step 2.
      *   *Rationale:* Field-standardized technical terms, however metaphorical, are exempt. Policy trumps philosophy here.

  2.  **BLACKLIST CHECK:** Does the phrase contain a core forbidden metaphor? (`blueprint`, `programme/program`, `instruction manual`, `recipe`, `text`, `book of life`, `genes for [complex trait]`, `the cell/the machinery interprets`, `the genome is the... [anything implying complete pre-formed plan]`)
      *   **Pass (i.e., contains blacklist item):** Flag for deletion/replacement. **Output:** "Strike phrase." **HALT.**
      *   **Fail:** Proceed to Step 3.
      *   *Rationale:* These are widely criticized as profoundly misleading about development (preformationist, implies centralized control/executor).

  3.  **CODE-SPECIFICITY TEST:** Is the metaphor *explicitly and narrowly* about the genetic code (codon-amino acid mapping)?
      *   **Pass:** Allow. **HALT.** (e.g., "a codon *specifies* an amino acid" passes by association with the whitelisted `genetic code` concept).
      *   **Fail:** Proceed to Step 4.
      *   *Rationale:* The codon-aa mapping is the *only* unambiguously code-like, convention-dependent mapping in the cell (tRNA adaptors). **Judgment Call:** Applying "code" language *only* here is policy.

  4.  **CAUSAL vs. SEMANTIC INFO TEST:** Does the phrase use "information", "encodes", "specifies", "carries information", "instructs", "reads out", "message" **in a context implying semantic content (aboutness, correctness) or centralized control?**
      *   **Key Indicators:**
          *   "Information" coupled with `about` (the phenotype/future state).
          *   "Encodes/specifies" applied to complex phenotypes (e.g., "encodes the eye").
          *   "Instructs", "reads out", "programmes" applied beyond transcription/translation.
          *   "Message" implying meaning separable from context.
      *   **Pass (i.e., implies semantic content/control):** Flag for revision. **Output:** "Revise to causal/mechanistic language." Proceed to Step 5 for potential quick fix.
      *   **Fail (i.e., implies causal specificity/reduction in uncertainty):** Allow. **HALT.** (e.g., "encodes a protein", "information content" in a Shannon sense measured in bits).
      *   *Rationale:* "Information" as causal specificity (Shannon) is widely tolerated; "information" as semantic content (about phenotypes, implies correctness/error) is philosophically contested and often misleading. **Judgment Call:** Distinguishing semantic intent from causal language in context.

  5.  **QUICK FIX ATTEMPT (If flagged in Step 4):** Can the phrase be easily replaced with standard causal/mechanistic language *without* altering the scientific meaning?
      *   **Pass (Easy Fix):** Replace (e.g., "encodes" -> "determines sequence of"; "carries information" -> "influences"; "specifies" -> "guides", "helps determine"; "reads out" -> "binds", "responds to"; "instructs" -> "activates", "triggers").
      *   **Fail (Meaning Altered/Complex):** Flag sentence for handling editor review. **Output:** "Refer to handling editor." **HALT.**
      *   *Rationale:* Practicality. If a simple, accurate alternative exists, use it. If not, escalate.

  6.  **NORMATIVE LANGUAGE TEST ("error", "misreading", "correct"):** Is the term used *outside* the narrow context of transcription/translation fidelity or direct molecular recognition (e.g., antibody-antigen)?
      *   **Pass (i.e., used broadly):** Flag for revision/review. **Output:** "Consider revising; normative claim may lack clear mechanistic basis." Proceed to Step 5 for quick fix attempt.
      *   **Fail (i.e., used in whitelisted context like `misreading` a codon):** Allow. **HALT.**
      *   *Rationale:* Norms like "error" are only relatively uncontroversial where there's a clear, local biochemical standard (correct base pairing, codon-aa matching). Broader use (e.g., "developmental error") projects human norms.

  **Where it Halts:** Steps 1, 2, 3, 4(Fail), 5(Pass), 6(Fail) give definite actions (Allow/Revise/Replace). Step 5(Fail) and Step 6(Pass -> Step 5 Fail) lead to referral.
  **Judgment Calls Dressed as Tests:** Step 4 (Causal vs. Semantic Intent) is the most significant judgment call. Step 6 also involves judgment on context.

  ---

  ### **Analysis of Your Current Whitelist Worry**

  *   **`genetic information` FAILS the Step 4 test routinely.** It *strongly* implies semantic content ("information *about* the phenotype/organism") rather than just causal specificity. Philosophers (e.g., Sarkar, Griffiths, Sterelny) consistently criticize this as misleading.
  *   **Why it's Whitelisted Anyway:** Pure entrenchment and utility. It's the field's shorthand for "whatever it is in DNA that's causally specific and evolutionarily relevant." Your policy choice to keep it is pragmatic, not philosophical. **Be prepared to defend this as policy, not ontology.** Acknowledge the simplification: "We retain 'genetic information' as a deeply entrenched term denoting the sequence-specific causal role of DNA, while recognizing its limitations as a metaphor."

  ---

  ### **Running the Procedure: Example Sentences**

  **(a) 'the transcription factor reads out the regulatory information encoded in the enhancer sequence'**

  1.  **Whitelist Check:** "reads out", "encoded", "information" not on whitelist. FAIL. Proceed.
  2.  **Blacklist Check:** No blueprint/program/etc. FAIL. Proceed.
  3.  **Code-Specificity:** Not about codon-aa mapping. FAIL. Proceed.
  4.  **Causal vs. Semantic Info:**
      *   "reads out" implies an agent/interpreter.
      *   "regulatory information encoded" strongly implies semantic content *about* regulation within the sequence itself.
      *   PASS (i.e., implies semantic content). FLAG for revision. Proceed to Step 5.
  5.  **Quick Fix Attempt:**
      *   Easy Fix: "the transcription factor **binds specific motifs in** the enhancer sequence **to regulate gene expression**".
      *   PASS (Easy Fix). **Output:** Replace sentence as above. **Action:** Edit.
      *   **Justification to Author:** "Revised to use standard mechanistic language describing transcription factor binding and function, avoiding potentially misleading metaphors of 'reading' and 'encoded information'."

  **(b) 'the genome contains the complete programme for building the organism'**

  1.  **Whitelist Check:** "programme" not on whitelist. FAIL. Proceed.
  2.  **Blacklist Check:** "programme" is a core blacklisted term. PASS (contains blacklist item). **Output:** Strike phrase. **Action:** Delete "the complete programme for building the organism".
      *   **Justification to Author:** "The phrase 'complete programme' is a prohibited metaphor as it inaccurately implies the genome alone contains a pre-formed, executable plan for development, disregarding the essential roles of cellular machinery, environment, and stochastic processes."
      *   *(Copy-editor would likely need to work with author on replacement, e.g., "the genome contains the DNA sequence essential for development")*.

  **(c) 'methylation marks carry epigenetic information that the cell reads and that specify which genes to express'**

  1.  **Whitelist Check:** "information", "reads", "specify" not whitelisted. FAIL. Proceed.
  2.  **Blacklist Check:** No core terms. FAIL. Proceed.
  3.  **Code-Specificity:** Not about codon-aa. FAIL. Proceed.
  4.  **Causal vs. Semantic Info:**
      *   "carry epigenetic information" implies semantic content *about* gene expression.
      *   "the cell reads" implies an agent/interpreter.
      *   "specify which genes to express" implies semantic content/instruction about an outcome.
      *   PASS (i.e., implies semantic content/control). FLAG for revision. Proceed to Step 5.
  5.  **Quick Fix Attempt:**
      *   Easy Fix? "methylation marks **influence** gene expression **through interactions with cellular machinery**". (Removes "carry information", "reads", "specify").
      *   PASS (Easy Fix). **Output:** Replace sentence as above. **Action:** Edit.
      *   **Justification to Author:** "Revised to describe the causal influence of methylation marks on gene expression mechanistically, avoiding metaphors implying the marks carry semantic information or are 'read' and 'interpreted' by the cell."

  ---

  ### **What the Procedure Cannot Do**

  1.  **Deeply Embedded Metaphors:** It struggles with metaphors fundamental to the field's language but philosophically problematic (e.g., `gene expression`, `signal transduction`, `genetic information`). It must leave these alone as policy choices.
  2.  **Novel or Boundary Metaphors:** New metaphors, or those sitting right on the edge (e.g., "computational module", "hardwired"), will often require referral (Step 5 Fail).
  3.  **Rhetorical Flourishes in Discussion:** Metaphors used purely for rhetorical summary in broad discussion/conclusion sections might be harmless but could still get flagged. The procedure lacks nuance for intent/context beyond the sentence.
  4.  **Settling Philosophical Disputes:** It won't resolve debates (e.g., teleosemantics vs. developmental systems). It codifies a specific, pragmatically defensible editorial stance *informed* by those debates.
  5.  **Authorial Style vs. Misrepresentation:** It can't distinguish between a metaphor that is merely stylistically vivid but scientifically understood vs. one that actively misrepresents mechanisms to the reader. It assumes the blacklist and Step 4 catches the worst misrepresentations.
  6.  **"Aboutness" Without Obvious Keywords:** Subtle implications of intentionality or semantic content not using the flagged keywords might slip through.
  7.  **Historical/Contextual Quotes:** It doesn't handle quotes from other papers or historical context.

  **Biggest Risk of Misfire:** Over-zealous application of Step 4, flagging causal uses of "information" or "encodes" that are standard and unproblematic (e.g., "encodes a protein"). Training copy-editors on the distinction between "encodes a protein" (causal, sequence specificity - OK) and "encodes the phenotype" (semantic - Not OK) is crucial. The "Quick Fix" step helps mitigate this.

  By implementing this procedure, you provide your copy-editors with a defensible, philosophically-informed (though simplified) framework that prioritizes clarity and avoids the most egregious misleading metaphors, while acknowledging the necessary compromises with entrenched usage. The key to author relations is clear, concise justifications focusing on **scientific clarity and avoiding mechanistic misrepresentation**, not philosophical purity.
