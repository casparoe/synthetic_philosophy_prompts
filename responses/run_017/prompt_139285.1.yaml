  ** Strongest objection: **
  Escalation of commitment is always psychological because a rational agent would never let sunk costs influence their decision. In this model, the sunk costs are not being treated as relevant for the decision; instead, they are relevant because they affect the future recovery. The sunk costs are not motivating the continuation per se, but they are a state variable that changes the payoff of winning. Therefore, it is rational to consider them. The objection fails because the mathematics shows that the expected cost of continuing is indeed lower than quitting at every round, and a stranger would make the same decision.

