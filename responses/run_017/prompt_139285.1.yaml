  ### Thought Experiment: The Condominium Fee-Shift Trap

  You own a unit in a condominium complex. After a water leak, the association assesses you $30,000 for damages, claiming responsibility lies with your unit. You dispute this, arguing the leak originated in common areas. The association is represented by an insurer that rotates adjusters quarterly due to internal workload policies. Each new adjuster, unfamiliar with the file’s history and facing time constraints, independently reviews the case. Upon initial review, they perceive weak evidence and a 20% chance of conceding (dropping the claim entirely) to avoid further costs. If they concede, the bylaws entitle you—as the prevailing party—to recover 40% of your total legal costs incurred to date. Each round of negotiation/arbitration costs you $10,000 in legal fees. You have no emotional stake (no reputation, vindication, or loss aversion pressures; social counsel urges settlement), and a stranger inheriting the file would see only the numbers.  

  ### Escalation Mechanics
  - **Stakes**: Original dispute: $30,000.  
  - **Cost per round**: $10,000.  
  - **Recovery fraction**: 40% of total costs if you win.  
  - **Concession probability**: 20% per round (independent, due to rotating adjusters).  

  #### Decision at Round 1 (Early Round)
  - **Sunk costs**: $0 (just starting).  
  - **Quit now**: Pay $30,000.  
  - **Continue**:  
    - 20% chance adjuster concedes → You recover $0 (no costs yet) + avoid $30,000 liability. **Net gain: $30,000**.  
    - 80% chance continue to Round 2 → Pay $10,000 + face same choice later.  
  - **Expected value of continuing**:  
    - *Shortcut calculation*: Win nets $30,000 (avoided liability) + 40% × ($10,000) = $34,000.  
    - Expected gain: (20% × $34,000) + (80% × -$10,000) = $6,800 - $8,000 = **-$1,200**.  
  - **Quit vs. Continue**: Quitting costs $30,000; continuing has expected cost of $30,000 (baseline) + -$1,200 = **$28,800**. Continuing is **$1,200 better** than quitting.  

  #### Decision at Round 5 (Late Round; Sunk Costs = $40,000)
  - **Quit now**: Pay $30,000.  
  - **Continue**:  
    - 20% chance win → Recover 40% × ($40,000 + $10,000) = $20,000 + avoid $30,000 liability. **Net gain: $50,000**.  
    - 80% chance continue to Round 6 → Pay $10,000.  
  - **Expected value of continuing**:  
    - Win nets $30,000 (avoided liability) + 40% × ($50,000) = $50,000.  
    - Expected gain: (20% × $50,000) + (80% × -$10,000) = $10,000 - $8,000 = **$2,000**.  
  - **Quit vs. Continue**: Quitting costs $30,000; continuing has expected cost of $30,000 + -$2,000 = **$28,000**. Continuing is **$2,000 better** than quitting.  

  ### Why This Is Not the Sunk-Cost Fallacy
  The decision hinges **only on forward-looking expected value**, not past losses. The fee-shift rule makes the *recovery amount* (a future benefit) increase with sunk costs. As you spend more, winning becomes more valuable, raising the expected value of continuing. Quitting ignores this growing upside. A stranger inheriting the file at any round would make the same choice.  

  ### Why Concession Probability Stays Flat
  Rotating adjusters reset expertise and resolve. Each treats the file as new, preserving the 20% concession chance. If a **single resolute adjuster** handled the case, concession odds would drop over time (e.g., falling to 5% by Round 5). Then continuing at Round 5 would have negative expected value, and quitting would be rational.  

  ### No Identifiable Mistake Point
  At every round, given the information (flat 20% concession chance, fee-shift rule), continuing has higher expected value than quitting, as shown above. Entering the dispute was **positive in expected value overall** (initial EV = -$1,200 + fee-shift upside ≈ net gain). The trap is the **distribution’s skew**: you likely win early (low costs, high net gain), but if unlucky, costs escalate and even a "win" after many rounds may yield a net loss (e.g., winning after $70,000 spent: recover $28,000 + avoid $30,000 = net cost $12,000). For you, this means accepting that continued escalation is *mathematically rational* but *risky*.  

  ### Verdicts Under Altered Recovery Fractions
  - **Recovery fraction = 0%**: Winning recovers nothing. Continuing is never rational (expected value always worse than quitting). Escalation stops early.  
  - **Recovery fraction = 100%**: Winning recovers all costs. Continuing is always rational (expected value approaches infinity as sunk costs rise). Escalation becomes inevitable.  

  ### Strongest Objection and Why It Fails
  **Objection**: "Escalation is always psychological—rational agents ignore sunk costs."  
  **Why it fails**: Here, sunk costs *objectively* increase the *future* recovery value via the fee-shift rule. Ignoring them would mean overlooking a quantifiable, non-psychological incentive. The inherited-file test confirms this: a coldly rational stranger escalates identically.  

  ### Feature Doing the Work
  The **fee-shift rule** (winner recovers a fraction of costs) transforms sunk costs into *future* rewards, creating a mathematically rational escalation trap.
