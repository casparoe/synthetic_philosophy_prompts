  ### Structural Condition for Agreement  
  **Cardinal Proportionality:** If the difference in value between any two options under Theory 1 is *proportional* to the difference under Theory 2 (i.e., the theories are affine transformations of each other), **all normalizations agree**.  
  - **Example:** If util and deont both rank B > C > A *and* util’s B–C gap is always 10× deont’s B–C gap, MEC is consistent.  
  - **Why it fails here:** Util sees B as 65 units better than C; deont sees C as 60 units better than B. This inversion and scale mismatch prevent agreement.  

