  - Realistic, one paragraph, three options. A workplace, a family, a clinic — no trolleys, no demons, no mixed acts or lotteries over the options.
  - You're between exactly two moral theories, with credences something like 55/45, so that "my favourite theory" (the one you're more confident in) is well defined and can be reported alongside MEC.
  - The two theories have to be structurally different, not tweaked variants: one agent-neutral maximizing theory, one that has an agent-relative constraint or agent-relative option in it. And here's the bit I care most about: they should individuate the options differently. One of them recognizes a doing/allowing or intending/foreseeing distinction that the other one thinks is morally irrelevant, so its not even clear they're ranking the same three acts.
