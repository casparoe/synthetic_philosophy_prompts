  Below is a decision tree designed to classify views on higher-order evidence (HOE) based on concrete cases. The tree uses eight of the nine candidate cases provided. I dropped **Case 7 (Uniqueness)** because it is a meta-question about rationality in general, not a specific HOE scenario. It asks whether evidence uniquely determines a single rational attitude, which is orthogonal to how HOE functions in particular cases. The other cases are more directly diagnostic of HOE handling, as they present tangible dilemmas. The tree is built from the eight remaining cases, ordered to maximize diagnostic clarity. Each branch node is a question with answer options based solely on the case description. The tree has 10 leaves, each corresponding to a named or unnamed position in the literature, with a brief note on its "most awkward commitment" (a consequence or implication that may be counterintuitive or challenging for the view).

  The audience is a reading group of six, including formal epistemologists and ethicists, all comfortable with probabilities but not specialists in HOE. No citations, bibliographies, or further reading are included. After the tree, I list:
  - Two pairs of leaves the tree cannot separate, with the extra question needed.
  - Unoccupied combinations of answers, with reasons for their absence.

