  ### **Two Pairs of Leaves the Tree Cannot Separate**
  The tree cannot distinguish these pairs because they share answer combinations on the included questions. An extra question is needed to split them.

  1. **Steadfastness (Leaf 3) vs Calibrated deference (Leaf 10)**  
     *Why inseparable:* Both hold confidence unchanged in peer disagreement (Node 1=C) and defer to ideal reasoning in calibration (Node 3=D).  
     *Extra question needed:* **Does higher-order evidence directly affect first-order justification, or is it merely about when to rely on your reasoning?**  
