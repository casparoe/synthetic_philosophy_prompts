  ### **Decision Tree**
  The tree has 8 branch nodes (questions). Start at Node 1 and follow the answers. Answers are letter-coded (A, B, C, D). Each path ends in a leaf (position) at depth 8. For clarity, the tree is presented as a numbered list with cross-references. Answer options are simplified for quick response (<1 minute).

  1. **Node 1: Peer disagreement (Case 1)**  
     You and a colleague of equal competence and carefulness, working from the same data, reach different conclusions about whether the data show an effect. What do you do?  
     - **A:** Move toward the midpoint (e.g., average your confidence with theirs).  
     - **B:** Suspend judgment entirely (withhold belief).  
     - **C:** Hold your confidence unchanged.  
     - **D:** Any confidence in the interval between the two is permitted (e.g., it’s rational to stay at your original level or move partway).  
     *Go to Node 2 if A or B; Node 3 if C; Node 4 if D.*

  2. **Node 2: Tainted source (Case 2)**  
     You believe a city's crime rate is rising because you read a run of reports; you then learn the reports were selected for publication by an advocacy campaign that wanted that conclusion. What is the impact?  
     - **A:** You have learned something about crime (e.g., lower your confidence that crime is rising).  
     - **B:** You have only lost your basis for a view (so you suspend judgment; you no longer believe crime is rising, but you don’t affirm it isn’t).  
     *Go to Node 5 if A; Node 6 if B.*

  3. **Node 3: Calibration (Case 3)**  
     You know that on hard yes-or-no questions of a certain kind, when you feel 85% confident you are right about 60% of the time. The question you are now considering is of that kind, and you feel 85% confident. What do you do?  
     - **A:** Reduce your confidence to 60%.  
     - **B:** Keep 85% and add a second-order worry (e.g., “I’m 85% sure, but I know I’m overconfident”).  
     - **C:** Suspend judgment.  
     - **D:** Hold 85% (you would defer to a better-calibrated version of yourself).  
     *Go to Leaf 1 if A; Leaf 2 if B; Leaf 3 if C; Leaf 4 if D.*

  4. **Node 4: The model’s disagreement (Case 5)**  
     You ask a language model a factual question on which you have a well-grounded, confident answer; it disagrees. All you know is that on a benchmark from the same body of text you both read, it is right 80% of the time, and its errors align with human bias. How do you treat this?  
     - **A:** Peer disagreement (treat it as a peer’s view and conciliate, e.g., move toward midpoint).  
     - **B:** First-order testimony (treat it as new evidence about the world).  
     - **C:** Higher-order evidence (it shows your reasoning from the shared corpus is unreliable).  
     - **D:** Nothing at all (ignore it; its errors correlate with yours, so it doesn’t add information).  
     *Go to Node 7 if A, B, or D; Node 8 if C.*

  5. **Node 5: Forgotten evidence (Case 6)**  
     Three years ago, you read a careful study and formed a 70% credence. You now remember the credence and that you judged the study careful, but not its content; today you learn you often misremember studies as careful when they were not. What do you do?  
     - **A:** Revert toward your earlier prior (discount the memory).  
     - **B:** Keep 70% and add a second-order worry.  
     - **C:** Treat the retained credence as self-standing (stick with 70%).  
     - **D:** Suspend judgment.  
     *Go to Node 9 if A or D; Node 10 if B or C.*

  6. **Node 6: Iterated defeat (Case 4)**  
     You learn you are in a condition (sleep-deprived, drunk, etc.) that degrades reasoning, and this very assessment is made in that condition. What happens?  
     - **A:** The correction applies once and stops (correct first-order beliefs but trust this assessment).  
     - **B:** It applies to everything, including itself (leads to global suspension).  
     - **C:** It undermines itself so nothing changes (ignore the HOE).  
     - **D:** It reaches only domains with independent evidence of impairment.  
     *Go to Leaf 5 if B; Node 11 if A, C, or D.*

  7. **Node 7: Akratic combination (Case 8)**  
     Can there be a subject who sincerely believes that p, sincerely believes her total evidence does not support believing that p, and is fully aware of both? If yes, what is the status?  
     - **A:** Yes, and it is always a rational defect.  
     - **B:** Yes, and it is sometimes what rationality requires.  
     - **C:** Yes, but it is a defect for credence, not full belief.  
     - **D:** No, the state is impossible; the requirement is to investigate or manage inquiry.  
     *Go to Node 12 if A, B, or C; Leaf 6 if D.*

  8. **Node 8: Action (Case 9)**  
     When a first-order attitude (e.g., “p is likely”) and a conflicting second-order attitude (e.g., “my evidence doesn’t support that”) coexist, which should guide action?  
     - **A:** The first-order attitude.  
     - **B:** The second-order attitude.  
     - **C:** A merged attitude (e.g., average them).  
     - **D:** No single combination is required (it depends on context).  
     *Go to Leaf 7 if A; Leaf 8 if B; Leaf 9 if C; Leaf 10 if D.*

  9. **Node 9: Calibration (Case 3)**  
     *Same as Node 3.*  
     *Go to Leaf 1 if A; Leaf 2 if B; Leaf 3 if C; Leaf 4 if D.*

  10. **Node 10: The model’s disagreement (Case 5)**  
      *Same as Node 4.*  
      *Go to Node 7 if A, B, or D; Node 8 if C.*

  11. **Node 11: Forgotten evidence (Case 6)**  
      *Same as Node 5.*  
      *Go to Node 9 if A or D; Node 10 if B or C.*

  12. **Node 12: Action (Case 9)**  
      *Same as Node 8.*  
      *Go to Leaf 7 if A; Leaf 8 if B; Leaf 9 if C; Leaf 10 if D.*

