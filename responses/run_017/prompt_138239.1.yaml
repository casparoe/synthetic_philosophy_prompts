  Below is a decision procedure for supplier cooperation dilemmas, built on game theory (specifically the iterated prisoner's dilemma and Axelrod's principles). It fits on one page, uses observable commercial facts, and terminates in a clear stance. The procedure is designed to be run in 15 minutes with no game theory expertise. Critical distinctions preserved: **game type identification** (to avoid false dilemmas), **continuity assessment** (the core of iterated games), and **endpoint visibility** (which alters incentives). Simpler distinctions (e.g., exact payoff quantification) are dropped in favor of qualitative thresholds. Judgment calls are noted.

  ---

  ### **Supplier Cooperation Decision Procedure**  
  *Run tests in order. Terminate at any stop point. Record answers and test references in file.*

  #### **Step 1: Is This a Prisoner's Dilemma (PD)?**  
  *Purpose: Avoid misapplying reciprocity to non-dilemmas (e.g., assurance games).*  
  - **Test 1.1:** Would we gain *significantly* by defecting (e.g., enforcing a penalty, refusing a request) if the supplier cooperates?  
    - *Significant = >3% cost impact or operational disruption.*  
  - **Test 1.2:** Would we lose *significantly* by cooperating if the supplier defects?  
  - **Test 1.3:** Is mutual cooperation better than mutual defection?  
  - **Decision:**  
    - **If 1.1=Yes, 1.2=Yes, 1.3=Yes → PD.** Proceed to Step 2.  
    - **If 1.1=No, 1.2=No → Common interest.** Stance: **Cooperate unconditionally**. (Stop. Note: "Test 1")  
    - **If 1.1=No, 1.2=Yes → Assurance game.** Stance: **Cooperate conditionally** (this move only) and signal intent (e.g., "We agree, assuming you fulfill X"). (Stop. Note: "Test 1")  
    - *Judgment call:* Uncertainty defaults to PD.  
    *Why this works:* PD requires mutual vulnerability. Common interest has aligned incentives; assurance games lack temptation to defect. Observable in contracts (e.g., unambiguous clauses = common interest; shared risks = assurance).

  #### **Step 2: Continuity Assessment**  
  *Purpose: Estimate the shadow of the future (Axelrod’s key condition).*  
  - **Test 2.1:** Rate **role stability** of the supplier’s decision-maker:  
    - *High:* >2 years in role, expected tenure >1 year.  
    - *Medium:* 6–24 months in role, expected tenure >6 months.  
    - *Low:* <6 months in role, expected tenure unknown.  
  - **Test 2.2:** Rate **relationship stability**:  
    - *High:* Contract >12 months, no exit plans.  
    - *Medium:* Contract 6–12 months, or mild uncertainty.  
    - *Low:* Contract <6 months, or known exit.  
  - **Adjust for endpoints:**  
    - If exit planned in **≤6 months and known to both sides**: Force continuity = **Low**.  
    - If exit planned in **≤6 months and confidential (only us know)**: Force continuity = **Low** + flag "hidden endgame".  
  - **Decision:**  
    - Combine ratings:  
      - *High + High → High continuity*  
      - *Medium in either → Medium continuity*  
      - *Low in either → Low continuity*  
    - **Low continuity → Stance: Withdraw from cooperation** (Stop. Escalate to head. Note: "Test 2").  
    - **Medium/High continuity → Proceed to Step 3**.  
    - *Judgment call:* Unknowns default to Medium. Record if stability unverifiable.

  #### **Step 3: Handle Ambiguous Defections**  
  *Purpose: Avoid overreacting to noise. Uses cost-asymmetry rules.*  
  *[Run only if suspecting defection (e.g., late delivery, disputed invoice)]*  
  - **Test 3.1:** Estimate costs:  
    - **A = Cost if we cooperate but they defected** (e.g., absorbed loss).  
    - **B = Cost if we defect but they cooperated** (e.g., relationship damage).  
    - *Use: High (>5% value), Medium, Low.*  
  - **Test 3.2:** Count prior ambiguous events (last 12 months).  
  - **Decision:**  
    - If **A > 2×B** → Treat as defection. Proceed to Step 4.  
    - If **B > 2×A** → Treat as cooperation. Proceed to Step 4.  
    - Else:  
      - If **<2 prior events** → Treat as cooperation.  
      - If **≥2 prior events** → Treat as defection.  
    - *Record event* in file (increment counter if cooperation).  
    *Why this works:* Tolerates noise but penalizes patterns. Cost ratios prevent worst-case losses.

  #### **Step 4: Determine Stance (PD Cases)**  
  *Purpose: Apply tit-for-tat (TFT) with endpoint tweaks.*  
  - **Test 4.1:** Supplier’s last clear move:  
    - Cooperative (e.g., met terms) → **Stance: Cooperate conditionally** (Note: "Test 4").  
    - Defection (e.g., violated terms) → **Stance: Reduce exposure and watch** (Note: "Test 4").  
    - *Judgment call:* First interaction = cooperative.  
  - **Adjust for hidden endgame (confidential exit):**  
    - If flagged in Step 2 → **Override to: Reduce exposure and watch** (Note: "Test 2 adjustment").  
    - *Why:* Defection is tempting but risks leaks; reduce exposure silently.

  #### **Step 5: Audience Effects**  
  *Purpose: Modify stance if reputation is at stake.*  
  - **Test 5.1:** Will other suppliers observe this decision?  
  - **Test 5.2:** Is the issue visible (e.g., public dispute, shared pool)?  
  - **Decision:**  
    - **If 5.1=Yes and 5.2=Yes:**  
      - Override "Cooperate unconditionally" or "Cooperate conditionally" (if defection suspected) to: **Reduce exposure and watch**.  
      - *Why:* Prevents perceptions of weakness that invite exploitation.  
    - *Record:* Audience identity and visibility.

  #### **Final Output & Escalation**  
  - **Stances:**  
    - `Cooperate unconditionally` | `Cooperate conditionally` | `Reduce exposure and watch` | `Withdraw from cooperation` | `Escalate`  
  - **Escalate to head if:** Withdraw, Escalate, or hidden endgame.  
  - **Stop and refer to Legal if:** Contract/competition law triggered.  
  - **Audit trail:** Record test results (e.g., "Stance: Reduce exposure [Test 4+5]") and unresolved estimates.

  ---

  ### **Live Case Applications**  
  **Case A: Packaging Tray Supplier (Sole Source)**  
  - **Step 1:** PD?  
    - 1.1: Yes (save 6% if refuse and they comply).  
    - 1.2: Yes (lose 6% if accept invalid increase).  
    - 1.3: Yes (mutual cooperation > dispute). → **PD.**  
  - **Step 2:** Continuity?  
    - Role stability: Low (new manager, 4 months).  
    - Relationship stability: Medium (exit in 8 months, confidential). → **Medium continuity** (no endpoint adjustment).  
  - **Step 3:** Ambiguous? Yes (clause interpretation).  
    - A = High (6% loss). B = High (sole-source disruption).  
    - Prior events: 0. → **Treat as cooperation** (N<2).  
  - **Step 4:** Stance → **Cooperate conditionally** (last move cooperative).  
  - **Step 5:** No audience.  
  - **Final Stance:** `Cooperate conditionally` (accept increase but flag for future scrutiny).  
  - **Diagnosis:** *Not a PD* (unclear clause makes this assurance; procedure defaults to PD due to uncertainty).  
  - **Why you won’t like it:** Costs 6% on a likely invalid claim. Defense: High B (disruption risk) justified tolerance; use time to qualify second source.

  **Case B: Logistics Provider (Shared Integration)**  
  - **Step 1:** PD?  
    - 1.1: Yes (save co-funding if they still integrate).  
    - 1.2: Yes (lose co-funding if they renege).  
    - 1.3: **No** (mutual cooperation worse: we pay but get no benefit post-exit). → **Not PD.**  
  - **Step 1 Decision:** Assurance game? 1.1=Yes → No. Common interest? 1.1=Yes → No. → **Dominant strategy: Defect.**  
  - **Final Stance:** `Withdraw from cooperation` (refuse co-funding). Escalate to head.  
  - **Diagnosis:** *Not a PD* (defection dominates; cooperation is irrational).  
  - **Endpoint effect:** Hidden exit (5 months) makes cooperation exploitative.  
  - **Why to defend upward:** Short-term savings vs. reputation risk. Defense: Sunk cost (exit in 5 months); reinvest savings in post-merger integration.

  **Case C: Distributors (Inflated Orders)**  
  - **Step 1:** PD?  
    - 1.1: Yes (save audit cost if they comply).  
    - 1.2: Yes (lose allocation if they cheat).  
    - 1.3: Yes (trust > audit spiral). → **PD.**  
  - **Step 2:** Continuity? Medium (ongoing contracts).  
  - **Step 3:** Ambiguous? Yes (inflation unproven).  
    - A = High (allocation loss). B = High (relationship damage).  
    - Prior events: 2 (two quarters of inflation). → **Treat as defection** (N≥2).  
  - **Step 4:** Stance → **Reduce exposure and watch** (respond to defection).  
  - **Step 5:** Audience? Yes (shared pool, visible audit). → **No override** (stance already cautious).  
  - **Final Stance:** `Reduce exposure and watch` (audit; if fraud found, penalize; else, repair).  
  - **Audience impact:** Audit signals toughness to group, deterring others.

  ---

  ### **What the Procedure Cannot Do**  
  1. **Misfires in:**  
     - **Non-PD games** (e.g., Chicken, Battle of the Sexes) – rare in supplier contexts.  
     - **High-noise relationships** (e.g., chronic ambiguities) – may over-forgive or over-punish.  
     - **Crisis events** (e.g., force majeure) – override with humanitarian/legal rules.  
  2. **Exploitable by:**  
     - **Sophisticated counterparties** who simulate your continuity/ambiguity thresholds to defect optimally.  
     - **Short-tenured players** (low continuity) who defect aggressively.  
  3. **Improvement Tracking:**  
     - **Record per run:** Test results, stance, and supplier ID.  
     - **Audit metrics:**  
       - Relationship longevity (+ = success).  
       - Dispute/defection frequency (- = failure).  
       - Cost savings from avoided blowups.  
     - **Validation:** Compare 12-month pre/post-procedure data on:  
       - % of dilemmas escalating to Legal/product delays.  
       - Supplier retention/defection rates.  
       - Cost of absorbed losses vs. penalties collected.  

  **Final Note:** This procedure systematizes reciprocity but cannot replace human nuance. Use it to force consistency, then refine stances based on outcomes. Escalate judgment calls early.
