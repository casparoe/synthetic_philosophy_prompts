  We are going to design a decision procedure based on the theory of the prisoner's dilemma and the evolution of cooperation (specifically, Axelrod's work). The procedure will be a flowchart-like set of tests that can be run in about 15 minutes by a buyer with no game theory training.

  Key concepts from the theory:
  1. **Prisoner's Dilemma (PD)**: A situation where two players each have two choices: cooperate (C) or defect (D). The payoffs are such that:
     - If both cooperate, they get a reward (R).
     - If one cooperates and the other defects, the defector gets a temptation payoff (T) and the cooperator gets the sucker's payoff (S).
     - If both defect, they both get punishment (P).
     The dilemma is that T > R > P > S and 2R > T+S. This creates a dominant strategy to defect (because regardless of what the other does, defecting yields a higher payoff) but mutual cooperation yields a better outcome than mutual defection.

  2. **Evolution of Cooperation**: Axelrod showed that in iterated prisoner's dilemmas, a strategy called "tit for tat" (TFT) can promote cooperation. TFT starts by cooperating and then does whatever the opponent did in the previous round. The key conditions for cooperation to emerge are:
     - The game is repeated (with sufficiently high probability of future interactions).
     - The players can recognize each other and remember past interactions.

  We'll build a procedure that classifies the situation and then recommends a stance.

  The stances we will use (as requested):
  - Cooperate unconditionally
  - Cooperate conditionally (like TFT: cooperate if the other did last time, else defect)
  - Cooperate conditionally with a defined forgiveness rule (like TFT with occasional forgiveness)
  - Reduce exposure and watch (a cautious stance, perhaps after a defection but not wanting to break the relationship)
  - Withdraw from cooperation (stop cooperating, but without escalation; may involve reducing business)
  - Escalate (to higher management or legal)

  The procedure must be one page and have stop points. We'll break it down into steps.

  ### Step 1: Is it a Prisoner's Dilemma?
  We need to check if the situation is indeed a PD. We are looking for:
  - **Observable signs that it is NOT a PD**:
    a. **Common interest (coordination game)**: Both parties have the same best outcome. For example, if the contract is clear and both gain from following it, then it's not a dilemma. Signs: The contract terms are unambiguous and mutually beneficial, and there is no incentive to deviate. The buyer should ask: "If I defect (e.g., by enforcing a penalty), does that put me in a better position even if the other party cooperates? And if they defect, am I worse off by having cooperated?" If the answer is no to both, then it's not a PD.
    b. **Assurance game**: Both parties prefer mutual cooperation over mutual defection, and each prefers to cooperate if the other cooperates, but they are afraid the other might not. The key difference from PD is that in an assurance game, there is no incentive to defect unilaterally. Signs: The buyer should ask: "If I knew the other party would cooperate, would I prefer to cooperate? And if I knew they would defect, would I prefer to defect?" If yes to both, then it's an assurance game.

  **Test for Step 1**:
  - Consider the immediate payoffs for the two choices (cooperate or defect) given the other party's choice. The buyer must estimate the payoffs (qualitatively: high, medium, low) for the four outcomes (C/C, C/D, D/C, D/D) in the short term for the specific issue.
  - Check if the following conditions hold (if they do, it's a PD):
    1. Temptation (T) > Reward (R)   [if the other cooperates, I get more by defecting]
    2. Punishment (P) > Sucker (S)   [if the other defects, I get more by defecting too]
    3. Reward (R) > (T+S)/2          [mutual cooperation is better than alternating defection and cooperation? Actually, the condition 2R > T+S is for the iterated case to make mutual cooperation better than alternating. But for a single round, the condition is that R > P and T > R and P > S and 2R > T+S. However, we are in a business context and the buyer may not have numbers. We can simplify.]

  But note: In business, we are often in iterated settings. However, the first step is to check if the current situation is a one-shot PD or not.

  Alternative approach: We can ask the buyer to assess:
  - Is there a short-term gain for either party by unilaterally defecting? (If no, then not PD.)
  - If one party defects, does the other party end up worse off than if they had both cooperated? (Yes in PD.)

  But we must be cautious: the buyer may not have exact numbers.

  **Practical Test for Step 1**:
  1. **Identify the defection**: What would defection look like in this case? (e.g., demanding a penalty, refusing a request, etc.)
  2. **Assess the immediate outcome if we defect and they cooperate**: Would we gain significantly? (If yes, then T > R -> condition for PD)
  3. **Assess if we cooperate and they defect**: Would we lose significantly? (If yes, then S is low -> condition for PD)
  4. **Assess the outcome of mutual defection**: Is it worse for both than mutual cooperation? (If yes, then R > P -> condition for PD)

  But note: We don't require exact numbers. We can use:
  - High gain: e.g., saving more than 5% of the contract value in the short term, avoiding a significant cost.
  - Significant loss: e.g., loss of more than 5% of contract value, or a critical delay.

  If all three conditions hold (steps 2, 3, and 4), then it's a PD. If not, then it might be a different game.

  **If it's not a PD**:
  - If the situation is one of common interest (both parties have the same best outcome, e.g., following the contract exactly), then the best move is to cooperate unconditionally (because there's no incentive to defect).
  - If it's an assurance game (both want to cooperate but need to be sure the other will too), then we should cooperate conditionally (with the condition being that the other party also cooperates) and also try to signal our intention to cooperate to get the same in return.

  But note: In an assurance game, the problem is one of coordination and trust. We might still use a conditional stance, but the condition is about the current move, not about past behavior.

  However, the procedure must be simple. We can say:

  - If Step 1 concludes it's a PD: go to Step 2.
  - If it's not a PD and the buyer concludes it's common interest: then stance is "cooperate unconditionally".
  - If it's not a PD and the buyer concludes it's an assurance game: then stance is "cooperate conditionally (with the condition that the other party cooperates in the same move)" and we should communicate our intention to cooperate (if possible) to get the same.

  But note: We must be cautious because the buyer might misclassify. We'll have a fallback.

  **Stop Point**: If the situation is not a PD, we don't need to run the rest of the PD-specific steps. We output the stance accordingly.

  ### Step 2: Assess Continuity
  We need to estimate the probability of future interactions with the same decision-maker. We'll use a simple scale: high, medium, low.

  Factors to consider:
  - How long has the relationship been? (Longer -> higher continuity)
  - How stable is the counterparty's organization? (High turnover? -> lower continuity)
  - How stable is the role of the person we are dealing with? (If they are new, how long are they likely to stay? If they are established, higher continuity.)
  - Are there any known changes coming (on their side or ours) that would affect the relationship? (e.g., contract renewal, merger, etc.)

  We can ask the buyer to rate continuity on a scale of 1 to 5 (or high/medium/low) based on:
  - The counterparty's account manager tenure and expected tenure (if known): 
    - High: >2 years in role and expected to stay at least 1 more year.
    - Medium: 6 months to 2 years in role, or expected to stay at least 6 months.
    - Low: <6 months in role or expected to leave soon (or unknown).
  - The stability of the contract and business: 
    - High: Contract has more than 1 year left, and both parties are committed.
    - Medium: Contract has 6-12 months left, or some uncertainty.
    - Low: Contract ending in less than 6 months, or known exit (even if confidential).

  But note: The continuity score is about the decision-maker and their incentives. We combine these factors.

  **Continuity Score**:
  - High: Both the account manager and the contract stability are high.
  - Medium: One high and one medium, or both medium.
  - Low: Any low factor, or unknown.

  If the continuity cannot be estimated (e.g., new relationship, no information), then we assume medium? But the theory says that if the probability of future interactions is too low, cooperation breaks down. Therefore, we might set a threshold.

  **Rule**: 
  - If continuity is High: go to Step 3.
  - If continuity is Medium: we might still have a chance for cooperation, but we need to be cautious. We'll use a conditional strategy with a shorter memory (less forgiveness) and perhaps reduce exposure? But let's see the next steps.
  - If continuity is Low: then the situation is effectively one-shot. In a one-shot PD, the rational move is to defect (unless there are other factors). But note: we might want to avoid burning bridges. We'll have a stance of "withdraw from cooperation" or "reduce exposure and watch" if we expect no future interactions.

  But note: We have to consider endpoints (Step 3) separately because of known end dates.

  ### Step 3: Endpoints
  We need to account for known end dates and whether they are known to both sides.

  - If there is a known end date (to both sides) and it is near (within the next few interactions), then the continuity is effectively low. This is the "endgame effect": cooperation may break down because there is no future.
  - If there is a known end date but only we know it (and the counterparty does not), then we are in a position of having an endgame but they are not. This is tricky: we might be tempted to defect because we know the relationship is ending, but if they find out, it might harm our reputation. Also, note that the counterparty might suspect.

  **Rule**:
  - If there is a known end date (to both sides) and the number of remaining interactions is small (say, less than 3 or within the next 3 months), then set continuity to Low (override Step 2) and go to Step 4 (or handle in Step 2?).
  - If only we know the end date and it is near (within 3 months, say), then we must be cautious. We cannot rely on the counterparty's cooperation because they don't know the end is near. But we might want to avoid actions that would reveal our exit. We'll set a special flag: "hidden endgame". This will lead to a stance of "reduce exposure and watch" (so we minimize the risk of being exploited without provoking a reaction that might reveal our plans).

  We'll adjust the continuity from Step 2 if there is a known end date:
     - If the end date is known to both and within 6 months: set continuity to Low.
     - If the end date is known only to us and within 6 months: set continuity to Low and note "hidden endgame".

  But note: the end date might be further away. We can set:
     - If the end date is in less than 6 months: then it's near.

  ### Step 4: Ambiguous Defections
  We need a rule for when we suspect a defection but it's ambiguous. The buyer must assess:
  - The probability that the counterparty defected intentionally (vs. an accident).
  - The cost to us if we mistakenly punish an innocent counterparty (sucker cost in the future?).
  - The cost to us if we mistakenly let a defection go unpunished (encouraging more defections).

  **Rule**:
  - If the suspected defection is ambiguous, then we do not treat it as a clear defection. Instead, we use a "forgiveness" rule: we give the benefit of the doubt a limited number of times. We can have a counter in the file for each supplier: how many ambiguous events have occurred in the last 12 months? 
    - If this is the first or second ambiguous event in the last year, then we cooperate conditionally (meaning: we continue to cooperate, but we note the event). 
    - If it's the third or more, then we treat it as a defection and respond by defecting (i.e., conditional cooperation: we defect because we suspect a pattern).

  But note: the cost of being wrong matters. We can have a risk matrix:

  - If the cost of being exploited (if we cooperate and they defected) is high and the cost of punishing an innocent (if we defect and they were innocent) is low, then we should be more likely to defect in response to ambiguity.
  - Conversely, if the cost of punishing an innocent is high (e.g., losing a critical supplier) and the cost of being exploited is low, then we should be more forgiving.

  We can simplify by having the buyer assess:
  - High risk if we are exploited: e.g., if the defection would cause a loss of more than 5% of the contract value or a critical delay. 
  - High risk if we punish an innocent: e.g., if the counterparty is critical and we have no alternative, or if punishing might cause them to defect in the future.

  Then:
  - If the risk of being exploited is high and the risk of punishing an innocent is low: then treat as defection.
  - If the risk of punishing an innocent is high and the risk of being exploited is low: then treat as cooperation (ignore the ambiguity).
  - If both are high: then we need to investigate further (but we have 15 minutes). In that case, we might "reduce exposure and watch" and escalate to the head (you) for a decision.
  - If both are low: then use the forgiveness counter (as above).

  But this is getting complex. We can have:

  **Rule for ambiguous defection**:
  1. If the buyer can estimate the costs:
     - Let A = cost to us if we cooperate and they defected (sucker cost).
     - Let B = cost to us if we defect and they were innocent (damage to the relationship, which might lead to future costs). This is subjective.

     Then, if A > 2*B, then treat as defection (because the cost of being exploited is high relative to the cost of a false punishment).
     If B > 2*A, then treat as cooperation (ignore).
     Otherwise, use the forgiveness counter: if the number of ambiguous events in the last 12 months is < 2, then treat as cooperation; else treat as defection.

  2. If the buyer cannot estimate the costs, then use the forgiveness counter (with a default of 2).

  ### Step 5: Reputation and Audiences
  If there is an audience (other suppliers who might observe our action and adjust their behavior), then we are in a repeated game with multiple players. This can change the incentives because our action might signal to others.

  **Rule**:
  - If there is an audience and the current issue is visible to them, then we must consider that our action might set a precedent. 
    - If we are facing a defection, and we do not punish, then we risk encouraging defection by others.
    - If we punish too harshly, we might damage relationships with multiple parties.

  Therefore:
  - If the audience is present and the issue is visible (or likely to become visible), then we should be more consistent and less forgiving of defections. But we must balance with the risk of escalating a small issue.

  We can say:
  - In the presence of an audience, we should be more likely to choose a conditional cooperation stance (to maintain a reputation of being firm but fair). 
  - Specifically, if we are in a PD and continuity is high, then we should use a conditional stance without forgiveness (or with very little) to maintain a strong reputation.

  But note: if the defection is ambiguous, we might still need to be cautious.

  **In the procedure**: We'll add a question at the end: "Is there an audience that might observe this decision?" If yes, then:
  - If we are about to choose "cooperate unconditionally" in the face of a defection, we should reconsider and choose "cooperate conditionally" (to avoid looking weak).
  - If we are about to choose a very forgiving stance, we should reconsider and be less forgiving (to maintain deterrence).

  But to keep it simple: we can have a modifier at the end.

