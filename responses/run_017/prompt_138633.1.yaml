  ### Grading of Student Submission

  **Overall Mark:** 17/25 (Letter Grade: C+)  
  The answer is well-written and mostly correct for parts (i) and (ii), but part (iii) contains critical errors. The student demonstrates strong understanding of the Gibbard–Satterthwaite theorem and the mechanics of the charter median rule under single-peaked preferences, but incorrectly generalizes strategy-proofness to arbitrary preferences and makes false claims about the rule's properties. Below, I break down the grading point by point, with specific feedback and counterexamples where needed.

  ---

  ### Step-by-Step Evaluation

  #### **Part (i) (8 marks): Statement of Gibbard–Satterthwaite and Application to Charter Median Rule**
  **Student's Answer (Lines: "The theorem from the notes says... by hand.")**  
  - **Claim 1:** The theorem requires at least three voters, at least three alternatives, a rule that returns a single winner, is defined on the unrestricted domain of strict rankings, and is onto. Strategy-proofness implies dictatorship.  
    **Verdict:** Correct-but-unjustified.  
    **Feedback:** The standard Gibbard–Satterthwaite theorem holds for **at least two voters** (not necessarily three), though this error is minor here since the committee has five voters. The rest of the conditions (three alternatives, single winner, unrestricted domain, onto) are correctly stated.  
  - **Claim 2:** The theorem does not apply to the charter median rule because preferences are single-peaked (restricted domain).  
    **Verdict:** Correct.  
    **Feedback:** The student correctly identifies restricted domain as the escape hatch. The rule meets all other conditions (single winner, three+ alternatives, onto—as 0m and 8m are achievable; see part (iii) counterexample).  
  - **Claim 3:** If the range had only two alternatives, majority rule with a default is strategy-proof and non-dictatorial, illustrating the necessity of "at least three alternatives" and "onto."  
    **Verdict:** Correct.  
    **Feedback:** This shows good contextual understanding.  

  **Part (i) Mark:** 7/8  
  **Deductions:**  
  - \-1 for the minor error (claiming "at least three voters" is required). A full-credit answer would state the theorem precisely as given in the course notes (no added conditions).  

  ---

  #### **Part (ii) (10 marks): Prove/Disprove Strategy-Proofness under Single-Peaked Preferences**
  **Student's Answer (Lines: "Fix the other four members' reports... The rule is therefore strategy-proof.")**  
  - **Claim 1:** With other reports fixed, let \(L\) be the third-smallest and \(U\) the fourth-smallest of the six numbers (four reports + two anchors). The outcome is \(L\) if \(r \leq L\), \(r\) if \(L \leq r \leq U\), and \(U\) if \(r \geq U\).  
    **Verdict:** Correct.  
    **Feedback:** This accurately describes the "clamping" effect of a voter's report.  
  - **Claim 2:** Under single-peaked preferences, truthful reporting is optimal: if the ideal is in \([L, U]\), reporting it yields the ideal; if below \(L\) (or above \(U\)), no report can produce an outcome below \(L\) (or above \(U\)), and \(L\) (or \(U\)) is the closest possible outcome to the ideal.  
    **Verdict:** Correct.  
    **Feedback:** The proof is complete and uses the definition of single-peakedness (preferring nearer outcomes to the ideal). This justifies strategy-proofness.  

  **Part (ii) Mark:** 10/10  
  **No deductions:** The proof is correct, clear, and addresses the question. The subsequent claim (that the argument "nowhere uses single-peakedness") is incorrect (see part (iii)), but it appears after the proof and does not invalidate the core argument for this part.  

  ---

  #### **Part (iii) (7 marks): Arbitrary Preferences, Theorem Applicability, and Safety**
  **Student's Answer (Lines: "Notice that this argument... safe, and not by luck.")**  
  - **Claim 1:** The rule remains strategy-proof even with arbitrary preferences because "submitting anything other than my favourite level can only move the outcome further away."  
    **Verdict:** **Wrong.**  
    **Counterexample:**  
    - **Voters and Reports:**  
      - Anchors: Fixed at 0m and 8m.  
      - Voters 1–4: Truthful reports (top choices): Voter 1 = 0m, Voter 2 = 0m, Voter 3 = 6m, Voter 4 = 6m.  
      - Voter 5: True top choice is 0m, but her *true preferences* are \(6m \succ 0m \succ 2m \succ 4m \succ 8m\) (arbitrary, not single-peaked).  
    - **Truthful Reporting:**  
      - Voter 5 reports 0m.  
      - All seven numbers: 0m (anchor), 8m (anchor), 0m (V1), 0m (V2), 6m (V3), 6m (V4), 0m (V5) → Sorted: [0m, 0m, 0m, 0m, 6m, 6m, 8m].  
      - Median (fourth-smallest) = 0m.  
    - **Profitable Misreport:**  
      - Voter 5 reports 6m (instead of 0m).  
      - All seven numbers: 0m (anchor), 8m (anchor), 0m (V1), 0m (V2), 6m (V3), 6m (V4), 6m (V5) → Sorted: [0m, 0m, 0m, 6m, 6m, 6m, 8m].  
      - Median (fourth-smallest) = 6m.  
    - **Manipulation:** Voter 5 strictly prefers 6m to 0m, so she gains by misreporting. The rule is **not strategy-proof** for arbitrary preferences.  
  - **Claim 2:** The rule is "not onto" because "the extreme levels 0m and 8m can never be the median."  
    **Verdict:** **Wrong.**  
    **Counterexample:**  
    - **Achieving 0m:** Three voters report 0m.  
      - Reports: V1–V3 = 0m, V4–V5 = 8m (any reports ≥0m).  
      - Numbers: Anchors (0m, 8m), V1=0m, V2=0m, V3=0m, V4=8m, V5=8m → Sorted: [0m, 0m, 0m, 0m, 8m, 8m, 8m].  
      - Median (fourth-smallest) = 0m.  
    - **Achieving 8m:** Three voters report 8m.  
      - Reports: V1–V3 = 8m, V4–V5 = 0m (any reports ≤8m).  
      - Numbers: Anchors (0m, 8m), V1=8m, V2=8m, V3=8m, V4=0m, V5=0m → Sorted: [0m, 0m, 0m, 8m, 8m, 8m, 8m].  
      - Median (fourth-smallest) = 8m.  
    The rule **is onto** (all five levels are achievable).  
  - **Claim 3:** The rule escapes Gibbard–Satterthwaite due to restricted domain and not being onto, so the committee is "safe" from strategic voting.  
    **Verdict:** **Wrong.**  
    **Feedback:**  
    - With arbitrary preferences, the domain is unrestricted, and the rule is onto and non-dictatorial. Gibbard–Satterthwaite **applies** and implies the rule is manipulable (as shown in the counterexample).  
    - Escaping the theorem (e.g., via restricted domain) does not guarantee safety; it only means the theorem's *conclusion* (dictatorship or manipulability) is not forced. Strategy-proofness must still be verified case by case. Here, without single-peakedness, the rule is manipulable.  

  **Part (iii) Mark:** 0/7  
  **Deductions:**  
  - All claims are false or misleading. A full-credit answer would:  
    1. State the rule is **not strategy-proof** under arbitrary preferences (with a counterexample).  
    2. Confirm Gibbard–Satterthwaite **applies** (unrestricted domain, onto, non-dictatorial) and implies manipulability.  
    3. Explain that escaping the theorem (e.g., via restricted domain) avoids the *impossibility* but does not ensure strategy-proofness; safety depends on the specific rule and domain.  

  ---

  ### Summary of Errors and Feedback
  - **Part (i):** Minor inaccuracy (unnecessary "three voters" condition), but core argument correct.  
  - **Part (ii):** Flawless proof for single-peaked preferences.  
  - **Part (iii):** Critical errors:  
    - Incorrect claim that the rule is strategy-proof for arbitrary preferences (counterexample provided).  
    - Incorrect claim that the rule is not onto (counterexample provided).  
    - False conclusion that the committee is "safe" and that escaping the theorem implies strategy-proofness.  
  - **Overall Weakness:** The student overgeneralizes from the single-peaked case and neglects to verify properties (e.g., onto) rigorously.  

  **Recommendation for Feedback:** Provide the counterexamples and emphasize that domain restrictions are necessary for strategy-proofness in median rules. The elegance of the answer masked logical overreach in part (iii).
