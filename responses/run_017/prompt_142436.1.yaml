prompt: |-
  hey so i need help writing a speech. im a senior and im giving a 4-ish minute speech at this "rule review" assembly next friday — whole school in the gym, teachers lined up against the wall looking bored, principal there, and also some lady from the district office who does "student voice" stuff who's apparently coming to watch. its about one rule: phones have to be in your locker during passing periods, not just silenced in your pocket. at the end of the assembly everyone votes on their phone and ms. okonkwo said shell go with whatever wins unless its a safety thing, so it kind of actually matters.

  heres my problem. i started the petition to get rid of the rule back in september, im literally the reason its on the ballot. and ive sort of changed my mind, or at least ive stopped being sure, and now im the one giving the case for keeping it — except i dont want it to be "the case for keeping it," i want it to be honest, and i also really dont want to make maya look bad because shes giving the repeal speech right after me and shes still my friend and shes sitting in the front row. and i cant pretend i know why the rule exists because i dont. nobody i asked does. we asked three teachers and they all just kind of shrugged.

  the thing i keep coming back to is that chestertons fence idea (the thing where if you cant see what the fence is for you dont get to take it down yet — go away and come back when you can say what it was keeping in or out). but i need it to do actual work in the speech and not just be something i mention and then pivot into respect-for-tradition talk, which is definatly not my thing. some specific stuff i want it to deal with:

  - i read somewhere about there being three kinds of old rule: ones whose reason died but the rule keeps going anyway, ones that are still holding something up, and ones that were only ever needed while something else was being built and then never got taken down, like scaffolding. i dont know which kind this is and neither does anyone else, and i feel like not knowing which one it is should change what the right move is?? but i dont know how to say that without it sounding like "so do nothing forever."
  - the strongest thing maya is going to say is probably: if it turns out to matter we can just put it back next year. i dont have a good answer to that except a feeling that some things you can put back and some things you cant, and that it has something to do with whether the rule works because basically everybody follows it. like if the reason the rule works is that everyone follows it, then one person ignoring it is basically free, which means from inside your own head it always looks like a pointless rule — and it also means once people stop you cant just flip a switch and have it back. i think that IS the actual argument but i cant get it straight and it sounds weird in my head.
  - we only asked teachers. the crossing guard has been here since forever and so has the night custodian and neither of them is going to be in the gym.

  one more thing that makes it weirder: were moving to the new building next year and it doesnt have lockers. like at all, its those little cubby things instead. so "keep the rule exactly as is" isnt even physically possible, and i think the speech has to somehow separate what the fence was FOR from what the fence actually LOOKED LIKE — im just not sure how to do that without it sounding like a compromise written by a school board.

  so: write me the speech. 4 minutes, so like 500 words ish, dont go over. it has to be something i can actually say out loud in front of 800 people without sounding like im reading an essay, it has to be honest about the fact that i was on the other side three months ago, it has to give maya something to be right about instead of steamrolling her, and it has to end with something concrete people can actually vote on. the freshmen are mostly there because they want their phones and they will tune out anything that sounds like an adult talking, so dont let it turn into that.
reasoning: |-
  Okay, the user needs help writing a speech about a phone rule for a school assembly. Let me break down their situation. They're a senior who started a petition to remove the rule requiring phones in lockers during passing periods. Now they're supposed to argue for keeping it, but they've changed their mind and feel unsure. 

  First, I need to understand their key concerns. They want to be honest, not make their friend Maya look bad (she's arguing to repeal the rule), and avoid sounding like they're just promoting tradition. They mentioned Chesterton's fence, which is about not removing a rule until you understand its purpose. But they don't want to just mention it; they want it to do real work in the speech.

  The user brought up three types of old rules: obsolete ones, necessary ones, and temporary scaffolding. They're unsure which category this rule falls into, and that uncertainty should influence the decision. Also, Maya's main argument is that if removing the rule causes problems, they can reinstate it next year. The user's counter is that some rules can't be easily reinstated because compliance relies on collective habit. Once broken, it's hard to restore. That’s a crucial point but they’re struggling to articulate it clearly.

  Another point: they only asked teachers about the rule’s purpose, but not other staff like the crossing guard or custodian who might have insights. Including this could add depth, showing they looked beyond the obvious sources.

  The new building next year has cubbies instead of lockers, so the rule can't stay as-is. The speech needs to separate the rule's purpose from its current form. The user wants to address this without sounding bureaucratic.

  The audience is 800 students, including freshmen who just want their phones and might tune out if it sounds preachy. The speech needs to be engaging, conversational, and not essay-like. It should acknowledge their past stance, validate Maya's points, and end with a clear voting option.

  I should structure the speech to start by grabbing attention, admitting their initial petition, and explaining their change of heart using Chesterton's fence. Then, break down the three rule types, emphasizing uncertainty. Address Maya's point about reinstating by explaining how rules rely on collective trust. Suggest talking to other staff to uncover the rule's purpose. Acknowledge the new building’s cubbies and focus on the rule's intent rather than the mechanism. End by proposing a vote to keep the rule for the rest of the year to preserve the habit while investigating its purpose, then reassess for the new building.

  Need to keep the tone honest and relatable, use rhetorical questions, pauses, and maintain a natural flow. Highlight the importance of community trust and habits. Make sure Maya isn't undermined by agreeing with her valid points but adding caution. Keep it under 500 words, around 4 minutes. Avoid adult-like lecturing to keep freshmen engaged.
answer: |-
  Here’s a 4-minute speech draft (approx. 480 words) designed to hit your key points: honesty, uncertainty, respect for Maya, avoiding tradition-for-tradition's-sake, addressing the fence idea meaningfully, and the locker-to-cubby transition. It ends with a concrete voting ask.

  **Speech Draft: The Phone Rule & The Fence We Don't Understand**

  **(Start confidently, look around, maybe a small, acknowledging wave/nod to Maya)**
  Hey everyone. So, phone lockers during passing. Yeah, *that* rule. My name’s [Your Name], and here’s the weird part: back in September, **I** started the petition to get rid of it. Seriously. I thought, "Why can't it just be silenced in my pocket? What harm does *that* do?" I argued it was pointless. And honestly? I still don’t *see* the harm. That’s Maya’s argument next, and she’s got really good points – points I used to make myself. **(Brief pause, sincere tone)**

  But here’s why I’m standing here asking you to vote *to keep it* for the rest of **this** year, even though I started the petition against it: I realized I don’t actually know *why* this fence was built.

  There’s this idea called **Chesterton’s Fence**. The gist is: if you find an old fence you don’t understand, *don’t just tear it down*. First, figure out why it was put there in the first place. Was it keeping something dangerous *in*? Or keeping something valuable *out*? Until you know, ripping it down is... risky.

  **(Lean in, more conversational)**
  Now, old rules are kinda like that fence. They usually fall into three piles:
  1.  **Rules whose reason died.** Like maybe a rule about horse-drawn carriages in the halls. Pointless now? Tear it down!
  2.  **Rules holding something important up.** Like safety rules. Those fences? We need them.
  3.  **Rules that were temporary scaffolding.** Needed for a moment, then forgotten. Just clutter. Get rid of it!

  **(Hands out, open, showing uncertainty)**
  Here’s the thing: **I don’t know which pile this phone rule is in.** And honestly? The teachers I asked didn’t seem 100% sure either. They shrugged! But that doesn’t mean it’s automatically pointless. It might mean *we just haven’t asked the right people yet*. What about Ms. Henderson, the crossing guard who’s seen *everything* for 20 years? Or Mr. Davies, the night custodian who knows the chaos we leave behind? Maybe *they* saw the reason years ago? We didn’t ask them. **We don’t actually know what problem this fence was solving.**

  **(Address Maya's strongest point directly & respectfully)**
  Maya’s gonna make a strong case, and she’s totally right about one thing: **if getting rid of it causes problems, we *could* just bring it back next year.** That sounds logical. But here’s my worry: **Rules like this work because *almost everyone follows them*, almost all the time.** It becomes a habit, part of how we move through the day. Once that habit breaks? Once everyone feels that little buzz in their pocket is harmless? It’s really, *really* hard to rebuild that collective muscle memory. You can’t just flip a switch and get the habit back. The fence is *down*, and whatever it was holding back? Might already be loose.

  **(Address the elephant in the room: the new building)**
  And yeah, next year? New building. No lockers. Little cubbies. So, **keeping the rule "exactly as is" is impossible.** That’s not the point. The point is figuring out **why the fence existed in the first place.** Was the goal just "phones in lockers"? Or was it something deeper? Maybe reducing hallway collisions? Stopping thefts? Preventing social blow-ups before class? Making sure we actually *see* each other? **We need to know the *purpose* before we design the *solution* for the cubby world.**

  **(Shift to call to action)**
  So, here's what I'm asking you to vote for: **Keep the rule *for the rest of this school year*. BUT ALSO:** Demand that Principal [Principal's Last Name] and Ms. Okonkwo launch a real investigation *now* into **why this rule existed.** Talk to the crossing guard, the custodians, long-time teachers, even alumni. Find the reason. Was it a dead rule? Vital scaffolding? Or something essential?

  **(Concrete voting ask)**
  That way, when we move to the cubbies next year, we’re not just blindly copying an old locker rule OR blindly throwing out a fence we never understood. **We build smart rules based on what actually matters.**

  **Vote to KEEP the rule for now, but vote knowing it comes with a demand: Find out why the fence was built. Let’s not tear down something we don’t understand. Let’s get the facts first. Thanks.**

  ---

  **Why this works for your needs:**

  1.  **Honesty & Credibility:** Opens with your petition role and changed mind. Admits uncertainty ("I don't see the harm," "I don't know").
  2.  **Respects Maya:** Acknowledges her points are valid ("really good points," "she's totally right about one thing"), frames her argument fairly, and avoids attacking her.
  3.  **Chesterton's Fence Does Work:** It's not just a mention; it's the *core framework* for uncertainty and the call to action (investigate before removing/replacing).
  4.  **Addresses Rule Types:** Explicitly names the three piles and places the phone rule squarely in the "unknown" category, justifying caution.
  5.  **Counters Maya's "Put It Back" Point:** Clearly articulates your concern about habit erosion and the difficulty of reinstating social norms.
  6.  **Includes Other Staff:** Directly names crossing guard/custodian as untapped sources of institutional memory.
  7.  **Deals with New Building:** Explicitly separates the rule's *form* (lockers) from its potential *function* (purpose), paving the way for a future solution based on discovered need, not blind tradition. Avoids a board-like compromise by focusing on *discovering* the purpose first.
  8.  **Concrete Voting Ask:** "Keep for rest of year + Investigate WHY." It's actionable and time-limited.
  9.  **Audience-Appropriate:** Conversational tone ("Hey everyone," "weird part," "kinda like"), avoids jargon, uses rhetorical questions, keeps it moving. Acknowledges the freshmen perspective ("why can't it just be silenced?").
  10. **Length:** Roughly 480 words, fitting comfortably within a 4-minute delivery, especially with pauses for emphasis.

  **Delivery Tips:**

  *   **Practice:** Time yourself. Read it aloud several times to find natural pauses and emphasis.
  *   **Pacing:** Don't rush. Pause after key points ("Chesterton's Fence," "three piles," "Maya's totally right," "new building," "Vote to KEEP").
  *   **Eye Contact:** Scan the room. Make specific eye contact at points (e.g., "Maya's gonna make a strong case" - glance her way; "demand that Principal..." - look towards them).
  *   **Sincerity:** Let your genuine uncertainty and concern come through, especially when admitting you don't know or talking about the habit erosion.
  *   **Energy:** Start strong to grab attention. Maintain engagement through vocal variety (don't be monotone). End firmly and clearly on the voting ask.
  *   **Body Language:** Open posture (no crossed arms). Use natural hand gestures to emphasize points (e.g., showing "three piles," hands out for "uncertainty," pointing slightly for "demand").

  Good luck! You've got a thoughtful, honest angle that respects everyone involved.
