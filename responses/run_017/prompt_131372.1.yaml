prompt: |-
  Dear Colleague,

  I am rewriting the moral psychology half of our second-year ethics module, and I should be grateful for your judgement on a point that I had taken to be settled, but which now seems to me considerably less straightforward than I had assumed.

  I had understood the situationist literature — the obedience studies, the Good Samaritan studies, the work on incidental mood and helping, and the use Harman and Doris make of it — to have established something quite strong: that what an agent does on a particular occasion is determined almost entirely by features of the situation, and that the ascription of stable traits of character is a systematic error, the projection of an imaginary unity onto conduct that is really cued by local circumstances. If that is right, it seems to me that the honest course is to stop presenting the excellences of character as a normative ideal, and to teach instead a kind of situational ethics: identify the variables that actually move conduct, and then arrange our environments so that people behave decently.

  A junior colleague resists this. She says that I am running together two claims which the careful literature keeps apart — the claim that conduct is sensitive to situational variables, and the claim that traits of character do not exist — and she proposes a "restricted" virtue ethics in their place: a virtue is not a global trait but a localised reliability, a stable disposition to act well in situations of a precisely specified type, keyed to exactly the variables the social psychologists manipulate. Such dispositions, she argues, are precisely what the experiments cannot exclude; so the situationist critique has no purchase upon them, and the whole dispute turns out to be merely verbal — a disagreement about how broad a disposition has to be before it merits the name of character.

  I find this attractive, but I suspect that it may be a retreat. Which of us has the better of the argument? Specifically: is situational sensitivity in the data any evidence at all against the existence of traits, given that a disposition is by its very nature something whose manifestation depends upon conditions? If the critique succeeds, does it tell against the normative claims of virtue ethics, or only against our ordinary descriptive claims about who possesses the virtues? And does my colleague's proposal really answer the critique, or does it purchase immunity by surrendering what was distinctive — the thought that a virtue is worth having for its own sake, that possessing one makes an agent's conduct intelligible, that the virtues hang together?
reasoning: |-
  Okay, let me start by unpacking the user's query. They're a professor revising a moral psychology module and grappling with situationist critiques of virtue ethics. Their junior colleague proposed a localized virtue ethics approach, and the user is unsure if this is a valid solution or a retreat.

  First, I need to recall the situationist arguments. Milgram's obedience experiments, Good Samaritan study, mood effects on helping behavior—all show situational factors heavily influence actions. Harman and Doris use this to argue against stable character traits. The user initially thought this meant character traits are illusions, so we should focus on situational ethics instead.

  The junior colleague's point is key: she separates situational sensitivity from the nonexistence of traits. She suggests virtues are local dispositions tied to specific contexts. The user wonders if this is a coherent defense or just redefining terms to evade criticism.

  I should check if the literature really supports this distinction. Doris and Harman do conflate situational influence with trait nonexistence, but the colleague argues that experiments can't test for highly contextualized dispositions. For example, honesty in low-stakes vs. high-stakes scenarios. If traits are this narrow, situationist findings don't refute them—they just show the specificity required.

  But then the normative issues arise. Traditional virtue ethics values global traits that make actions intelligible and are good in themselves. Local traits might not unify character or provide intrinsic motivation. They could become context-specific habits without deeper integration. Plus, practical application: can we teach countless context-bound virtues? It's cumbersome compared to broad traits.

  The user's deeper concerns: maintaining virtue ethics' core against empirical challenges without losing its essence. They might need to present students with a balanced view—acknowledging situationist findings but showing virtue ethics can adapt. Also, addressing whether localized virtues retain philosophical depth or reduce to behaviorism.

  I should also consider the meta-question: is the debate merely verbal? If traits are redefined as local, situationists might accept their existence but argue they're not "character" in the traditional sense. The real issue is the normative weight of global vs. local traits.

  Finally, advising the user: affirm the colleague's point as a valid interpretation but highlight the unresolved tensions. Suggest teaching both critiques and adaptations, emphasizing the ongoing debate. Stress that virtue ethics can incorporate empirical data without abandoning its normative project, but must address the fragmentation of virtues.
answer: |-
  You've pinpointed the core tension in contemporary virtue ethics beautifully. Your junior colleague offers a sophisticated and increasingly popular response to situationism, but you are right to sense potential retreat. Let's break down your specific questions:

  1.  **Is situational sensitivity evidence against traits?**
      *   **No, not inherently.** Your colleague is fundamentally correct here. This is the crux of her "interactionist" position. A *disposition* (trait) is defined as a *latent potential* that manifests *when triggered by specific situational cues*. The situationist data brilliantly demonstrates the *power* and *specificity* of those situational triggers. Finding that people are less helpful when rushing does *not* prove they lack a disposition to be helpful; it proves that the *manifestation* of that disposition is highly sensitive to the presence/absence of time pressure.
      *   **The flaw in the strong situationist claim (Harman/Doris):** They often commit the fallacy of inferring the *absence* of a disposition *simply* from the *presence* of situational influence. This ignores the very nature of dispositions. The data shows people *aren't* consistent *across wildly different situations* – but virtue ethics, properly understood, never claimed they *should* be. Courage on the battlefield doesn't imply courage in the dentist's chair; honesty with found money doesn't imply honesty under torture. The data challenges *globalist* or *invariant* trait conceptions, not dispositionalism *per se*.

  2.  **Does the critique succeed against normative claims or only descriptive ascriptions?**
      *   **Primarily Descriptive Ascriptions:** The core situationist attack targets the *empirical reality* of broad, cross-situationally consistent character traits *as commonly ascribed in folk psychology* ("John is honest," "Sue is compassionate"). It argues our everyday attributions are often mistaken. This directly challenges the *descriptive basis* of virtue ethics – the idea that people actually *possess* virtues understood as robust, global traits.
      *   **Normative Implications (But Nuanced):**
          *   **If Traits Don't Exist (Strong Claim):** If the strong situationist claim were true (traits are illusions), it *would* undermine virtue ethics' normative project. Why strive for an ideal (possessing robust virtues) that is empirically impossible? Normative ideals must be realistically attainable. This would favor your "situational ethics" approach.
          *   **Given Local Traits (Colleague's View):** The normative ideal *shifts* but isn't abandoned. The ideal becomes cultivating *reliable local dispositions* (e.g., "honesty in low-stakes professional settings," "compassion when not in a hurry"). Virtue ethics still provides a normative framework for identifying *which* local dispositions are worth cultivating ("excellences") and *how* to cultivate them (habituation, reflection). The *content* of the virtues becomes more situationally specified.

  3.  **Does the "local trait" proposal answer the critique, or surrender what's distinctive?**
      *   **It Answers the *Empirical* Critique:** On empirical grounds, your colleague's proposal is strong. Situationist experiments *cannot* rule out the existence of highly context-specific dispositions. Milgram didn't test "obedience to legitimate authority figures in non-coercive learning environments"; he tested a very specific, highly pressurized scenario. Her model accommodates the data by making dispositions *as sensitive to context* as the data demands. This effectively defangs the situationist challenge *as a refutation of the very possibility of character traits*.
      *   **But It Risks Surrendering Key *Philosophical* Distinctiveness:** This is your well-founded concern. The "retreat" lies here:
          *   **Fragmentation:** Traditional virtue ethics prizes the *unity* of character. Virtues are supposed to hang together (Cardinal Virtues), forming an integrated whole that makes an agent's life intelligible and coherent. Local traits risk reducing character to a patchwork of isolated, context-bound habits ("honest-at-work-but-dishonest-on-taxes," "compassionate-unless-late"). This loses the holistic vision of *phronesis* (practical wisdom) integrating judgment across domains.
          *   **Intelligibility & Depth:** A global trait like "courage" provides a deep explanation for diverse courageous acts across contexts (physical danger, moral confrontation, intellectual honesty). A set of hyper-local dispositions ("brave-in-physical-conflict," "firm-in-moral-debates") offers shallower, fragmented explanations, lessening the *explanatory depth* virtue ethics traditionally claimed. The agent's conduct becomes less intelligible as emanating from a unified core.
          *   **Intrinsic Value & "For its own sake":** The strongest challenge. Cultivating a *global* virtue like justice is seen as constitutive of *eudaimonia* (flourishing) – valuable intrinsically, shaping the agent's entire being. Cultivating a hyper-local disposition ("returns-lost-wallets-in-park") risks looking more like a context-specific behavioral trick, valuable *instrumentally* for good outcomes in that niche, rather than as a fundamental excellence of the *person*. Does possessing 100 local "virtues" make one a *virtuous person* in the rich, traditional sense? Or just someone reliably programmed for good behavior in specific, pre-defined slots? The intrinsic, character-forming aspect is threatened.

  **Conclusion: Who has the better argument?**

  *   **Empirically:** Your junior colleague has the stronger case. The strong situationist inference (no traits exist) overreaches. Dispositionalism, especially localized, is empirically resilient. Her "restricted virtue ethics" is a coherent and defensible *empirical* model compatible with the data.
  *   **Philosophically/Normatively:** Your concerns are profound and valid. While her model saves virtue ethics from empirical refutation, it does so by significantly diluting central philosophical commitments – unity, intelligibility, intrinsic value as character-forming, and the holistic ideal of *eudaimonia*. It risks reducing virtue ethics to a sophisticated form of behaviorism or contextual rule-following, losing its distinctive soul.

  **Recommendation for your Module:**

  1.  **Present Both Views Clearly:** Frame the situationist challenge (strong claim: traits are illusions) and the interactionist/local trait defense.
  2.  **Highlight the Empirical Nuance:** Emphasize that dispositions *require* situational triggers, so sensitivity doesn't refute traits, only *invariant* or *overly broad* conceptions.
  3.  **Confront the Philosophical Tension:** Explicitly discuss the trade-off: Local traits answer the empirical critique but potentially sacrifice the unifying, character-constitutive, intrinsically valuable core of traditional virtue ethics. Ask: "Does this 'saved' virtue ethics retain what made it philosophically compelling?"
  4.  **Don't Jettison the Ideal Prematurely:** While situationism challenges naive trait ascription, it does *not* definitively prove the traditional normative ideal of integrated, global virtues is *impossible* or *undesirable*. It shows it's *harder* and *rarer* than folk psychology assumes. Virtue ethics can still argue that *striving* for that integration, despite our situational fragility, *is* the normative ideal, even if we often fall short. The cultivation of *phronesis* aims precisely at navigating situational complexity in a way that *manifests* a coherent character. The situationist data shows why this cultivation is so difficult and context-dependent, not necessarily why it's futile.
  5.  **Acknowledge the Middle Ground:** Many virtue ethicists now advocate for a *moderately* robust conception of traits – more stable and cross-situationally consistent than the hyper-local view, but acknowledging significant situational influence and rejecting unrealistic globalism (e.g., Nancy Snow, Christian Miller). This attempts to preserve more unity and intelligibility than the purely local view, while accepting the situationist data.

  Your instinct that the local trait move *might* be a retreat from the heart of virtue ethics is correct. However, your colleague is also correct that the strong situationist conclusion is empirically unwarranted. The most honest course is to present this complex landscape, showing students that the debate is very much alive, pivoting on fundamental questions about the nature of character, disposition, and the normative ideal of human flourishing.
