  Based on your requirements and gut calls, I've analyzed the situation and concluded that the **proportional gains rule (Kalai-Smorodinsky solution)** best satisfies your criteria, though it requires giving up your verdict in **case 4**. Below is the implementation, explanation, and trade-offs.

  ---

  ### Key Conclusions
  1. **Your mate is correct**: No rule can satisfy both case 3 (monotonicity) and case 4 (independence of irrelevant alternatives) under Pareto efficiency. This is a fundamental impossibility in bargaining theory.
  2. **Trade-off**: 
     - **Proportional gains** satisfies cases 1, 2, 3, 5 (and your rejection of (10,5) in case 3), but fails case 4.
     - **Nash solution** satisfies cases 1, 2, 4, 5, but fails case 3 (it returns (10,5), which you reject).
  3. **Recommendation**: Use proportional gains. Case 4 is sacrificed because:
     - Case 3 is more central to your intuition (no one should lose from added options).
     - Case 4's failure is explainable: removing options changes the "ideal point," which affects outcomes even if the removed option wasn't chosen.

  ---

  ### The Rule: Proportional Gains (Kalai-Smorodinsky)
  - **Definition**: The outcome ensures both players achieve the **same fraction** of their maximum possible gains (from the walk-away point), maximized along the Pareto frontier.
  - **Why it fits**:
    - Scale-invariant (cases 1, 2).
    - Monotonic: Adding options never harms anyone (case 3).
    - Handles walk-away changes (case 5).
    - Pareto efficient (no value left on table).

  ---

  ### Algorithm & Code
  Implement as a function that takes:
  - `d`: Walk-away point `(dA, dB)`.
  - `vertices`: List of vertices of the convex polygon (clockwise/counter-clockwise).

  ```python
  def proportional_gains(d, vertices):
      dA, dB = d
      xs = [v[0] for v in vertices]
      ys = [v[1] for v in vertices]
      M_A = max(xs)  # Max payoff A can achieve
      M_B = max(ys)  # Max payoff B can achieve
      gain_A_ideal = M_A - dA  # A's max possible gain
      gain_B_ideal = M_B - dB  # B's max possible gain

      # Degenerate cases (no gains possible)
      if gain_A_ideal <= 0 and gain_B_ideal <= 0:
          return (dA, dB)
      if gain_A_ideal <= 0:
          return (dA, M_B)  # Maximize B, fix A at dA (adjust per frontier if needed)
      if gain_B_ideal <= 0:
          return (M_A, dB)  # Maximize A, fix B at dB

      # Shoot a ray from d in direction (gain_A_ideal, gain_B_ideal)
      t_min = float('inf')
      n = len(vertices)
      
      for i in range(n):
          x1, y1 = vertices[i]
          x2, y2 = vertices[(i + 1) % n]
          dx = x2 - x1
          dy = y2 - y1

          # Skip zero-length edges
          if abs(dx) < 1e-10 and abs(dy) < 1e-10:
              continue

          # Solve: [dA + t*gain_A_ideal = x1 + s*dx], [dB + t*gain_B_ideal = y1 + s*dy]
          numerator_t = (x1 - dA) * dy - (y1 - dB) * dx
          denominator = gain_A_ideal * dy - gain_B_ideal * dx

          if abs(denominator) < 1e-10:  # Ray parallel to edge
              continue

          t = numerator_t / denominator
          # Compute s using the least error-prone equation
          if abs(dx) > 1e-10:
              s = (dA + t * gain_A_ideal - x1) / dx
          else:
              s = (dB + t * gain_B_ideal - y1) / dy

          # Check if intersection is valid
          if t > 1e-10 and 0 <= s <= 1:
              if t < t_min:
                  t_min = t

      # If no valid intersection (unlikely in convex sets), return ideal point
      if t_min == float('inf'):
          return (M_A, M_B)
      
      # Calculate final point
      x_sol = dA + t_min * gain_A_ideal
      y_sol = dB + t_min * gain_B_ideal
      return (round(x_sol, 2), round(y_sol, 2))  # Optional rounding
  ```

