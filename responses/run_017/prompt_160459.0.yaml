prompt: |-
  I'm writing a chapter that treats cluelessness as a problem for consequentialist decision procedures rather than for first-order verdicts, and before I defend any particular procedure I want the specification it would have to meet. Give me the desiderata that any such procedure must satisfy, each with the case or consideration behind it, where cluelessness is roughly this: for most ordinary options — which career to enter, whether to have a child, whether to give now or later — the far-future effects dominate the near-term ones in expected magnitude, but the agent cannot determine even the sign of the net long-run difference and cannot expect to resolve it in the time available. The procedure is for an agent who must act anyway, in real time, with the evidence available to a reflective non-specialist, and who is not entitled to the answer that no option is better than any other.

  Among the requirements I want you to adjudicate, not merely list: that it not dissolve the problem by stipulating that structurally unmeasurable effects get zero weight; that it not quietly reduce to maximizing the near-term effects we can estimate; that its recommendations be invariant under re-individuation of the options, so verdicts do not swing when an option is described at finer grain or two options are merged — call this grain-invariance, which I suspect may be unsatisfiable in principle, since finer individuation seems to multiply the chances of a large but unmeasurable downstream difference; that it say what weight near-term reasons retain when long-run uncertainty is roughly sign-symmetric; that it take a stand on tiny-probability, astronomical-payoff cases rather than inheriting whatever the agent's prior says; that it distinguish returning a set of permitted options from returning nothing, and degrade gracefully as cluelessness deepens; and that it tell the agent whether, and how much, to invest in reducing cluelessness rather than acting under it. For each, say whether it is non-negotiable or a preference of a particular camp, and why. Then say which subset you think cannot be jointly satisfied, and which single requirement does the most work in excluding candidate procedures — argue against my guess that it is grain-invariance. A few lines on how maximizing expected value with a prior over signs, deferring to robust near-term reasons, and hedging across a portfolio of bets fare against the list is enough; the criteria are the deliverable. State how confident you are in the main claims and single out the one you are least sure of.
reasoning: |-
  Okay, the user is tackling a complex problem in moral philosophy related to consequentialist decision-making under deep uncertainty, specifically cluelessness about long-term effects. They’re writing a chapter and need desiderata for a decision procedure that handles this.  

  First, I need to unpack their query. They define cluelessness as situations where far-future effects dominate in expected magnitude, but the agent can’t determine the sign (positive/negative) of these effects or resolve it in time. The procedure must work for real-time decisions by reflective non-specialists, and can’t just default to "all options are equally good."  

  The user lists specific requirements they want adjudicated, not just listed. These include:  
  - Not dissolving the problem by ignoring unmeasurable effects.  
  - Not reducing to maximizing near-term effects.  
  - Grain-invariance (invariance under re-individuation of options).  
  - Clarifying the weight of near-term reasons when long-run uncertainty is sign-symmetric.  
  - Taking a stand on tiny-probability, high-payoff cases.  
  - Differentiating between permitted options vs. no recommendation, and degrading gracefully.  
  - Advising on whether to reduce cluelessness vs. act under it.  

  For each, I need to judge if it’s non-negotiable or a preference, explain why, and address conflicts. The user suspects grain-invariance might be the hardest and possibly unsatisfiable.  

  Breaking it down:  
  1. **No dissolving via zero-weight stipulation**: Non-negotiable because ignoring dominant effects violates consequentialism. A procedure must engage with the uncertainty, not dismiss it.  
  2. **No quiet reduction to near-term**: Non-negotiable for similar reasons—it’s a bait-and-switch that dodges the core problem.  
  3. **Grain-invariance**: This is tricky. The user thinks it might be unsatisfiable because finer options increase uncertainty. I’ll argue it’s not the primary issue, but rather a symptom of how we model options. The real conflict is with "no quiet reduction" and "taking a stand on tiny probabilities."  
  4. **Weight of near-term reasons**: Preference of some camps. Consequentialists might prioritize bridging principles, while others lean toward satisficing.  
  5. **Taking a stand on tiny probabilities**: Non-negotiable to avoid paralysis, but approaches vary (e.g., lexical thresholds vs. continuity).  
  6. **Gracious degradation**: Non-negotiable for practicality—agents need guidance even when cluelessness is extreme.  
  7. **Investment in reducing cluelessness**: Non-negotiable; a good procedure should account for meta-cognition.  

  Conflicts: The biggest tension is between grain-invariance and the requirement to take a stand on tiny probabilities. Finer-grained options amplify the number of speculative long-term effects, making it harder to avoid arbitrary thresholds. Grain-invariance might be secondary, though.  

  Assessing candidate procedures:  
  - **Maximizing EV with a prior over signs**: Fails on grain-invariance and quietly reduces to near-term if priors are arbitrary.  
  - **Deferring to robust near-term reasons**: Risks reducing to near-term maximization unless carefully bounded.  
  - **Hedging across portfolios**: Handles cluelessness well by diversification but struggles with grain-invariance (e.g., defining the "portfolio").  

  The user’s confidence question: I’d say the judgment on grain-invariance is least certain—it’s entangled with agent-relative option sets.  

  Overall, the key insight is that the deepest conflict is between avoiding arbitrariness in tiny probabilities and maintaining grain-invariance, not grain-invariance itself being the root issue. The procedure must navigate this without collapsing into near-term focus or ignoring long-term effects.
answer: |-
  Here are the desiderata for a consequentialist decision procedure under cluelessness, adjudicated as requested. I'll first list the requirements with justifications and status (non-negotiable vs. preference), then identify conflicts, argue against grain-invariance as the primary obstacle, and briefly evaluate candidates. Confidence levels follow at the end.

  ### **Desiderata & Adjudication**
  1. **No Dissolution via Zero-Weight Stipulation**  
     - *Requirement*: Cannot ignore structurally unmeasurable effects by assigning them zero weight.  
     - *Justification*: Consequentialism requires considering all effects; arbitrarily excluding dominant long-term effects violates its core commitment.  
     - *Status*: **Non-negotiable** (foundational to the problem).  

  2. **No Quiet Reduction to Near-Term Maximization**  
     - *Requirement*: Must not covertly collapse into optimizing only measurable near-term effects.  
     - *Justification*: If long-term effects dominate expected magnitude, ignoring them (even implicitly) misapplies consequentialism.  
     - *Status*: **Non-negotiable** (avoids trivializing cluelessness).  

  3. **Grain-Invariance**  
     - *Requirement*: Recommendations must be invariant under re-individuation of options (e.g., splitting "career A" into sub-options).  
     - *Justification*: Ethical verdicts should depend on outcomes, not arbitrary description of choices.  
     - *Status*: **Preference** (many ethicists demand option-neutrality, but it’s contested under uncertainty).  

  4. **Weight of Near-Term Reasons Under Sign-Symmetry**  
     - *Requirement*: Must specify how near-term reasons function when long-run differences are symmetrically uncertain.  
     - *Justification*: Agents need guidance when cluelessness neutralizes long-term comparisons.  
     - *Status*: **Preference** (consequentialists diverge: some prioritize near-term proxies, others seek "bridging" principles).  

  5. **Taking a Stand on Tiny-Probability/Astronomical-Payoff Cases**  
     - *Requirement*: Must not inherit arbitrary priors; should provide normative stance on low-probability extreme impacts.  
     - *Justification*: Unregulated priors allow intuitively absurd decisions (e.g., neglecting existential risks).  
     - *Status*: **Non-negotiable** (avoids paralysis or fanaticism; procedures need internal safeguards).  

  6. **Gracious Degradation**  
     - *Requirement*: Must distinguish permitted options from returning "no verdict," and weaken recommendations smoothly as cluelessness deepens.  
     - *Justification*: Agents must act under uncertainty; binary "permitted/forbidden" fails when options are non-comparable.  
     - *Status*: **Non-negotiable** (practical necessity for real-time decisions).  

  7. **Investment in Reducing Cluelessness**  
     - *Requirement*: Must advise whether (and how much) to invest in reducing cluelessness vs. acting immediately.  
     - *Justification*: Consequentialism requires optimizing information-gathering if it improves long-term outcomes.  
     - *Status*: **Non-negotiable** (meta-decision is part of the procedure).  

  ---

  ### **Conflicts and Key Obstacles**
  - **Subset that cannot be jointly satisfied**:  
    {**Grain-invariance**, **No quiet reduction to near-term**, **Taking a stand on tiny probabilities**}.  
    *Why*: Grain-invariance requires option descriptions not to affect verdicts, but finer individuation multiplies unmeasurable long-term effect pathways. Avoiding reduction to near-term optimization forces engagement with these effects, yet regulating tiny probabilities demands *some* structure (e.g., discounting negligible probabilities) that may violate grain-invariance. For example, splitting an option into sub-choices could introduce speculative tail risks that alter verdicts if the procedure imposes probability thresholds.  

  - **Highest-impact requirement**:  
    **No quiet reduction to near-term** (not grain-invariance) does the most work in excluding candidates.  
    *Argument against your guess*: Grain-invariance is *satisfiable* if a procedure aggregates options into equivalence classes (e.g., via outcome similarity) or uses ambiguity aversion. However, **no quiet reduction** forces procedures to honestly confront long-term cluelessness rather than retreating to measurable proxies. Most candidates (e.g., "satisficing near-term welfare") fail here by covertly ignoring the problem. Grain-invariance is a *modeling challenge*, but quiet reduction is a *theoretical betrayal* of consequentialism. Your insight about finer grain multiplying uncertainty is correct, but this makes grain-invariance harder to satisfy, not the core driver of impossibility.  

  ---

  ### **Candidate Procedures – Quick Assessment**
  - **Maximizing EV with a prior over signs**:  
    Fails **no quiet reduction** (priors over signs are arbitrary, often reducing to near-term) and **grain-invariance** (finer options amplify prior sensitivity). Struggles with **tiny probabilities** if priors lack structure.  

  - **Deferring to robust near-term reasons**:  
    Fails **no quiet reduction** (covertly prioritizes near-term) and **no dissolution** (ignores long-term). May satisfy **weight under symmetry** and **gracious degradation**, but violates core desiderata.  

  - **Hedging across a portfolio of bets**:  
    Best on **gracious degradation** and **investment advice** (diversification + research as hedging). Fails **grain-invariance** (portfolio definition is description-sensitive) and struggles with **no dissolution** (if "portfolio" excludes hard-to-assess options).  

  ---

  ### **Confidence Assessment**
  - **Overall confidence**: 85%.  
    The analysis integrates standard challenges in decision theory (e.g., option individuation in Broome, irreducibility of cluelessness in Greaves) and avoids overclaiming.  
  - **Least confident claim**: That **grain-invariance is a preference, not non-negotiable** (70%).  
    *Why*: Ethicists like Broome treat option individuation as a serious problem, and practical procedures might *require* coarse-grained choices to function. However, I lean toward "preference" because cluelessness itself may demand rethinking invariance (e.g., if uncertainty is fundamental, not descriptive).  

  ### **Key Deliverable Summary**
  A viable procedure must:  
  - Engage long-term uncertainty without dismissal or reductionism,  
  - Regulate extreme probabilities normatively,  
  - Degrade gracefully under ignorance,  
  - Guide meta-investment,  
  - Sacrifice grain-invariance if needed to avoid arbitrariness.  
  **Core tension**: Honest engagement with cluelessness (non-negotiable) vs. option-description invariance (preferential but costly).
