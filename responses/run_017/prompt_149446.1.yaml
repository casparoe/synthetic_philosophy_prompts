answer: |-
  Here’s a complete exam package designed to force engagement with the conceptual tension you describe, avoiding recitation while centering the threshold regress and evaluation ambiguities.

  ---

  ### **Exam Question (20 marks)**
  > "Satisficing, understood as terminating search upon encountering an option that meets or exceeds a fixed aspiration level, is frequently presented as a bounded-rational alternative to exhaustive optimization. However, critics argue that under costly search, setting a stopping threshold *is* the optimal (maximizing) strategy when the costs of further search are accounted for. This would render satisficing merely a special case of standard rational choice under constraints, not a distinct model of rationality.  
  >   
  > Evaluate this critique. Does it successfully reduce satisficing to a form of maximizing? If not, what irreducible conceptual or practical challenges remain for the satisficing model? In your response, address:  
  > (a) The role of the aspiration level’s *origin* and its dependence on prior knowledge;  
  > (b) The implications of evaluating satisficing as a *process* versus its *outcomes*;  
  > (c) Whether bounded rationality offers a substantively distinct account of rationality once search costs are admitted."  
  > *(Suggested time: 90 minutes)*  

  ---

  ### **Model Answer (≈700 words)**  
  The critique that satisficing collapses into maximizing under search costs has formal merit but overlooks foundational problems of *procedural grounding* and *evaluative ambiguity*. While a well-calibrated aspiration level can indeed be derived as optimal *if* the distribution of options and search costs are known, this conditional exposes satisficing’s core vulnerability: **the threshold-setting regress**.  

  **(a) The origin of the aspiration level** is pivotal. To set a rational threshold, an agent must estimate the distribution of available options (e.g., expected salaries in a job market). Acquiring this knowledge, however, often requires costly search resembling the exhaustive process satisficing seeks to avoid. If the aspiration level is exogenously given (e.g., by social norms), satisficing relies on external epistemic scaffolding, failing as a self-contained model. If endogenous, the agent must adapt it dynamically through experience (e.g., raising aspirations after successes). But this adaptation *itself* constitutes a meta-search problem: How many trials inform the threshold? What confidence governs adjustments? This regress implies that satisficing cannot be fully specified as a static "decision rule" but demands a learning process—shifting the focus from *rational choice* to *ecological adaptation*.  

  **(b) Process vs. outcome evaluation** further complicates the critique. Suppose satisficing *outperforms* maximizing in some environments (e.g., rapidly changing markets where exhaustive search is obsolete by completion). The critic might retort that this merely reflects suboptimal maximizing due to flawed cost estimation. However, this defense conflates *rationality as justification* with *rationality as mechanism*. Satisficing, as envisioned by Simon, is a heuristic *procedure* for coping with computational intractability. Evaluating it *solely* by outcomes—comparing its payoffs to an omniscient benchmark—misses its raison d’être: it asks how agents *actually navigate* ignorance, not what they *should* do with perfect knowledge. Conversely, judging it by its alignment with idealized optimization (e.g., "Was the threshold *objectively* optimal?") assumes away the very bounds it addresses. The two frameworks operate on distinct evaluative planes.  

  **(c) Bounded rationality’s distinctness** survives the critique, but its substance shifts. If bounded rationality merely meant "optimization + constraints," it would indeed reduce to standard theory. Its core insight, however, is that *the cognitive operations required for optimization under constraints are often infeasible or infinite-regressing*. Recognizing search costs doesn’t magically grant agents the capacity to compute expected utilities over all possible search paths or distributional priors. Satisficing, then, is not a "special case" of maximizing but a *bypass* of its unsupportable computational demands. Its distinctness lies in positing that rationality *in practice* involves non-optimizing procedures (like aspiration thresholds) that are ecologically adaptive—not because they maximize in disguise, but because they yield *acceptable* results with *tractable* computation.  

  **Conclusion**: The critique correctly notes that satisficing *can* be optimal under specific information-rich conditions. But this does not reduce bounded rationality to conventional optimization, as it ignores the *bootstrapping problem* of threshold-setting and the *procedural priority* of bounded models. Satisficing remains distinct precisely where optimization is epistemically inaccessible: it replaces *global calculation* with *local, adaptive stopping*, accepting that rationality may be defined by resilience under ignorance rather than convergence to omniscient benchmarks.  

  ---

  ### **Marking Scheme (20 marks total)**  
  1. **Defines satisficing & bounded rationality without psychologizing** (3 marks)  
     *Must distinguish: satisficing (aspiration-based stopping) vs. bounded rationality (rationality under computational limits).*  
     *Common error: Equating bounded rationality with irrationality or cognitive biases.*  

  2. **Articulates the optimization critique clearly** (4 marks)  
     *Must state: Under search costs, optimal stopping *is* threshold-based, making satisficing "maximizing in disguise."*  
     *Common error: Claiming satisficing ignores costs entirely, or that the critique renders it meaningless.*  

  3. **Explains the threshold-setting regress** (5 marks)  
     *Must argue: Aspiration levels require distributional knowledge, whose acquisition invites infinite regress/contradicts boundedness.*  
     *Common error: Treating thresholds as arbitrary or ignoring their dependence on prior expectations.*  

  4. **Analyzes process vs. outcome evaluation** (4 marks)  
     *Must contrast: Evaluating the mechanism (tractability) vs. outcomes (payoff optimality), and justification vs. rationality.*  
     *Common error: Conflating success of outcomes with rationality of procedure.*  

  5. **Assesses bounded rationality’s distinctness post-critique** (4 marks)  
     *Must conclude: Bounded models remain distinct by focusing on *feasible computation*, not just adding constraints to optimization.*  
     *Common error: Declaring bounded rationality "dead" if satisficing aligns with optimal stopping.*  

  **A vs. B Discriminator**:  
  - **B (13-15/20)**: States the regress and process/outcome tension accurately but cannot derive broader implications.  
  - **A (16-20/20)**: Explicitly ties the regress to a *procedural reconception of rationality* (e.g., "ecological validity over axiomatic optimality") and identifies *environmental conditions* where satisficing succeeds/fails (e.g., stable distributions → robust; deceptive landscapes → maladaptive).  

  ---

  ### **Model Answer Annotations**  
  - **Confidence in claims**: 90% on structural arguments (regress, process-outcome); 70% on adaptive processes as "distinct rationality" (more interpretive).  
  - **Attributions**: Only Simon’s heuristic/procedural focus is attributed (essential to bounded rationality’s definition). All other claims are structural.  
  - **Least confident claim**: "Satisficing yields *acceptable* results with *tractable* computation" (requires empirical support; some environments exploit satisficers).  
  - **Question fairness probability**: 85%. Self-contained setup avoids exegesis, focuses on logic, and targets the intended conceptual tension. Strong students should reach the regress within 30 mins.  

  This package rewards students who see that the debate isn’t about *whether* satisficing can be optimal, but *what its viability implies for the foundations of rational choice theory*. It forces engagement with your unresolved debate while avoiding historical footnotes.
