  ### **Notes on Logical Space & Inconsistencies**  
  - **Empty Combinations**:  
    - Patterns where Q3 = `b` (assign total by fixing order) and Q7 = `b`/`c` (incomparability/arbitrariness) are **provably incoherent**. Fixing an order assumes comparability, but incomparability denies it.  
    - Patterns supporting Q4 = `a` (escalator better) and Q6 = `b` (sparse misery irrelevant) but Q1 = `c` (no worsening from misery) are **merely unattractive** — they ignore suffering inconsistently.  
    - Most `c`-heavy patterns (paralysis, deflationary) are **satisfiable but unsupported** by consequentialism.  

  - **Indistinguishable Views**:  
    - **Aggregative consequentialism** (P1) and **expected-value fanaticism** (P2) **cannot be separated** if Q1/Q4 are `a` and Q5 is `a`. Both support infinite aggregation + fanaticism. The quiz flags this overlap.  
    - **Density/average views** (P5) and **overtaking** (P4) are separated by Q3: P5 uses averages (`a` = non-summation), P4 uses overtaking (`a` = non-summation) but differ in Q1/Q2/Q6.  

  - **Rearrangement Survival**: As requested, views are tagged: summation-based (❌) vs. non-summation (✅). Fanaticism (⚠️) depends on the underlying ethic.  

  This quiz isolates core commitments while respecting the "no explicit naming" constraint. It covers your cases (i)–(iv) in Q1–Q4, adds the gamble in Q5, and handles rearrangement coherence transparently. The scoring key flags inconsistencies and indeterminacies, ensuring users confront their implicit assumptions.
