answer: |-
  ### Specification for a Theory of Pramāṇa-Hood

  **Purpose**: To provide actionable guidance to an inquirer during active inquiry, enabling them to discern which sources of knowledge are trustworthy in real-time contexts, and why, while resolving conflicts between sources.

  #### Requirements Table
  | Requirement (Imperative) | Motivating Case | Status | What It Knocks Out | Conflicts |
  |--------------------------|-----------------|--------|---------------------|-----------|
  | **Distinguish pramāṇa from mere causal process** | Mirage illusion: A desert traveler "sees" water (causal visual process) but correctly rejects it as non-knowledge. | Non-negotiable | Theories conflating reliable processes (e.g., optics) with warrant-conferring pramāṇas. | None — foundational. |
  | **Separate source of content from source of warrant** | Untrustworthy testimony: A liar says "The sky is green," and you believe it due to their charm. Content (sky's color) comes from testimony; warrant fails due to unreliability. | Non-negotiable | Accounts that treat testimony as monolithic (e.g., content and warrant always co-sourced). | May clash with *discriminability* if warrant source is opaque to the agent. |
  | **Require recognizability of reliability, not just reliability** | Hidden oracle: A machine prints true facts, but you lack any access to its reliability. Reliable but unusable for inquiry. | Camp preference (internalist) | "Pure" externalist theories (reliability alone suffices). | Conflicts with *discriminability* if recognizability demands introspection. |
  | **Enforce intra-agential discriminability** | Non-cognition confusion: You "know" there's no pot in a dark room. Is this from non-cognition or failed perception? Discriminability requires telling them apart internally. | Your invention | Non-cognition as independent pramāṇa (if discrimination fails); testimony from unverifiable sources (e.g., distant historical events). | Clashes with testimony from uncheckable sources and non-cognition; may conflict with *external recognizability*. |
  | **Articulate defeater hierarchies** | Defeated inference: You infer fire from smoke (inference), but a trusted source says it's fake smoke (testimony undercuts). Later, you touch the heat (perception restores). | Non-negotiable | Theories without defeater protocols (e.g., "strongest source wins" ad hoc rules). | Conflicts with *non-circularity* if sources mutually referee credibility. |
  | **Handle nested sources** | Compensated testimony: You infer "Socrates is mortal" using "Socrates is human" (from a habitual liar) and "All humans are mortal" (from perception). The perception premise compensates for unreliable testimony. | Non-negotiable | Isolated-source models (e.g., treating testimony-based inferences as uniformly weak). | May conflict with *discriminability* if nested sources blur origins. |
  | **Avoid collapsing distinct pramāṇas** | Postulation reduction: Claiming arthāpatti (e.g., "Devadatta eats at night") is just inference. Loses the unique "explanatory gap-filling" role of postulation. | Camp preference (non-reductionist) | Reductionist accounts (e.g., upamāna as inference + memory). | Conflicts with *independence* if reduction simplifies theory. |
  | **Guarantee non-circular justifications** | Testimonial loop: You trust the Veda because the Veda says it's reliable. | Non-negotiable | Theories allowing circular source-validation (e.g., self-justifying scriptures). | Conflicts with *defeater hierarchies* if defeater sources need external validation. |

  ---

  ### JSON Summary
  ```json
  {
    "purpose": "To enable an active inquirer to determine which knowledge sources to trust in real-time inquiry, resolving conflicts and clarifying epistemic dependencies.",
    "friction_pairs": [
      {
        "a": "Intra-agential discriminability",
        "b": "Allow testimony from uncheckable sources",
        "why": "Discriminability requires internally verifying a source's role, but uncheckable testimony lacks verification paths.",
        "which_to_drop": "Intra-agential discriminability (keep testimony for practical inquiry)"
      },
      {
        "a": "Intra-agential discriminability",
        "b": "Accept non-cognition as a pramāṇa",
        "why": "Non-cognition often feels indistinguishable from perception failure; discriminability demands clear internal markers.",
        "which_to_drop": "Non-cognition as independent pramāṇa (reduce to perception + inference)"
      },
      {
        "a": "Require recognizability of reliability",
        "b": "Pure externalist reliability",
        "why": "Recognizability demands agent-accessible grounds, while externalism allows reliability undetectable to the agent.",
        "which_to_drop": "Recognizability requirement (if endorsing externalism)"
      }
    ],
    "most_excluding": "Intra-agential discriminability — it invalidates non-cognition, unverifiable testimony, and any source whose causal mechanism isn't introspectively transparent, narrowing viable theories to those with strong internalist commitments.",
    "verdict_on_my_criterion": "Intra-agential discriminability is a genuine but costly desideratum: it ensures agents can self-monitor sources during inquiry, but if kept, it forces rejection of non-cognition and uncheckable testimony, risking impracticality for real-world agents who rely on these."
  }
  ```

  #### Key Implications
  - **Discriminability**: If you keep it, non-cognition cannot be a basic pramāṇa (reduce to inference: "No pot here" = "If a pot were here, I’d see it; I don’t; so it isn’t"). Testimony requires triangulation (e.g., cross-checking speakers).  
  - **What breaks**: Inquiry in domains with inherently uncheckable sources (e.g., historical events) becomes "non-knowledge" unless discriminability is relaxed.  
  - **Defeater solution**: Assign fixed priority tiers (e.g., perception > testimony > inference) or use "coherence checks" (e.g., a source wins if it explains more data without contradiction).  
  - **Winning compromise**: Drop discriminability for testimony/non-cognition *or* treat them as derivative pramāṇas with inferential safeguards.
