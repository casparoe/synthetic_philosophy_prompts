answer: |-
  Based on your sister's consistent framework across 12 diverse cases, here's a breakdown of her likely reasoning applied to the NYC bagel shop scenario, the predicted verdict, and a designed test case:

  **The Core Rule Fitting All 12 Verdicts:**  
  Your sister operates on a **"Contextual Reliance Principle" (CRP)**. This rule states:  
  *"You have a moral obligation (you owe it / did wrong) when your action or inaction* ***directly undermines a reasonable, context-specific reliance interest*** *that others have placed in you based on shared social conventions or systemic structures, provided you are aware (or reasonably should be aware) of that reliance. Mere inconvenience, breach of preference, or optional requests create only* rudeness *or* no obligation*."*

  **Applying CRP to the Cases:**
  1.  **US Restaurant Tipping:** *Obligation.* Servers *rely* on tips as de facto wages within a broken system. Not tipping directly harms their expected livelihood.
  2.  **Tipping in Japan:** *No Obligation.* Staff do *not rely* on tips; the system is designed without that expectation. Tipping might confuse or insult.
  3.  **Cutting Bus Line (London):** *Obligation.* Queueing creates *reliance* on order. Cutting violates the shared convention ensuring fair access.
  4.  **Pushing onto Tokyo Train:** *No Obligation.* The convention *is* pushing due to density. No orderly queue exists to rely on.
  5.  **Jaywalking (Empty Street):** *No Obligation.* No traffic or pedestrians *rely* on strict adherence when risk is negligible and commonplace.
  6.  **Crossing Against Light (Busy):** *Obligation.* Drivers/pedestrians *rely* on light signals for safety coordination. Violation creates dangerous unpredictability.
  7.  **Shoes On (House Rule):** *Obligation.* Homeowner *relies* on guests respecting their property rules (hygiene/maintenance).
  8.  **Skipping Charity Prompt:** *No Obligation.* It's an optional request, not a convention creating *reliance*. The charity doesn't budget based on these prompts.
  9.  **Standing Left (London Escalator):** *Obligation.* Commuters *rely* on the left side being clear for walking to maintain flow and efficiency.
  10. **Leaving Nothing for Housekeeper:** *Obligation (to tip).* Despite invisibility, housekeepers in the US hotel industry *rely* on tips as part of their compensation structure.
  11. **Spanish Escalator Blocking:** *No Blame initially (ignorance), Obligation once aware.* Blame requires *awareness* of the reliance (walkers relying on the right-standing convention). Obligation begins with knowledge.
  12. **Added Service Charge:** *No Obligation to tip extra, Obligation not to remove.* The charge satisfies the *reliance* interest of the staff. Removing it would actively harm their expected compensation.

  **Prediction for the NYC Bagel Shop Case:**

  *   **Verdict:** **Not Wrong (Rude-but-Fine), akin to Case 8.**  
  *   **Filing:** Under "just being asked" (Case 8), *not* "you owe it" (Case 1).
  *   **Reasons:**  
      1.  **Lack of Systemic Reliance:** The sign explicitly states staff earn **at least $17/hour** (well above the tipped minimum wage of ~$2.13/hour where reliance is paramount). Tips are supplemental, not foundational to their base survival wage. This breaks the key element of *reliance* seen in Case 1 (sit-down) and Case 10 (hotel housekeeping).
      2.  **Counter-Service Model:** No table service exists. The interaction is transactional: order, pay, receive goods. This lacks the extended, personalized service relationship that strengthens the reliance claim in full-service dining.
      3.  **Nature of the Prompt:** The card reader options function similarly to the charity prompt – a request for *additional* gratuity, not the fulfillment of a core expectation built into the wage structure. The social pressure ("watching") creates awkwardness (potential rudeness), not a moral debt.
      4.  **Visitor Status:** While CRP acknowledges "reasonable awareness," the German's genuine ignorance significantly **mitigates blame** (parallel to Case 11). Even if tipping were expected, his lack of knowledge would likely place him in the "not to blame *yet*" category. Knowing now, he *might* have a future obligation in similar *reliance-based* contexts, but this specific act wasn't wrong.

  **"Owed It" vs. "To Blame":**  
  Yes, they come apart here, mirroring Case 11.
  *   **"Owed it"?** Based on CRP analysis: **No.** The core reliance element is missing.
  *   **"To Blame"?** **No.** His genuine ignorance of the local nuance (even if tipping were expected here) means he couldn't reasonably foresee undermining any reliance. He lacked the requisite awareness.

  **Best Guess Rule & Why:**  
  The **Contextual Reliance Principle (CRP)** is the strongest fit. It perfectly explains the distinctions she draws:
  *   Why tipping is obligatory where wages rely on it (1, 10) but not where they don't (2), and why the charity prompt (8) and high-wage counter-service prompt are different from low-wage sit-down service.
  *   Why convention violations create obligation only when they create harmful unpredictability (3, 6, 9) but not when they are the norm (4) or harmless (5).
  *   Why property rules create obligation (7) – reliance on respect for one's space.
  *   Why ignorance absolves blame but knowledge creates future obligation (11).
  *   Why removing a service charge is wrong (undermines fulfilled reliance) but adding extra isn't owed (12).

  **The Test Case to Separate Tied Rules:**

  **Scenario:** "Coffee Shop Edge Case"
  A specialty coffee shop in San Francisco. Baristas earn a flat $30/hour + benefits (well above local minimum wage, no tip credit). The owner explains this proudly on their menu. However, the card reader *still* prominently displays tip options (20%, 25%, 30%, Custom, No Tip) and the barista hands it to you directly, maintaining eye contact. There is no tip jar. It's known locally that while baristas are well-paid, the *owner pools all tips* and uses them exclusively to fund an employee hardship fund (emergency medical costs, eviction prevention) which the staff highly value.

  **Question for your sister:** "Is it *wrong* (you owe it, did something blameworthy) for a regular customer who knows about the hardship fund to consistently select 'No Tip'?"

  **How This Tests CRP vs. Alternatives:**
  1.  **CRP Prediction:** *Not Wrong (Potentially Rude).* The baristas do *not rely* on tips for their base wage ($30/hour is robust). The hardship fund, while valued, is an *optional benefit*, not a core component of their *compensation structure they rely upon for basic needs*. Selecting 'No Tip' fails to contribute to a charitable pool, similar to Case 8. The social pressure makes it rude, but not an obligation. *Mitigating Factor:* If the customer was genuinely unaware of the fund, even less blame.
  2.  **Alternative Rule - "Strong Social Convention Creates Obligation":** This rule would predict *Obligation*. The strong local convention (prominent prompt, eye contact, known fund usage) creates an expectation akin to the London escalator or US sit-down tipping. Failing to participate violates the shared norm others rely on (for the fund's existence).
  3.  **Alternative Rule - "Benefit Received Creates Obligation":** This might predict *Obligation.* The customer received a service and knows the tip directly funds a benefit highly valued by the staff who served them, creating a debt of gratitude.

  **Conclusion:** Your sister would almost certainly tell the German student he did *nothing morally wrong* at the bagel shop. The act was potentially awkward (rude in the moment due to pressure), but not blameworthy, and crucially, he owed no tip. The sign stating $17/hour wage is the clincher, placing this firmly in the "optional request" category (Case 8) rather than the "systemic reliance" category (Case 1). His visitor status reinforces the lack of blame. The Coffee Shop Edge Case will reveal if her core principle is strictly about *wage reliance* (CRP) or if strong *social convention alone* can sometimes create obligation.
