prompt: |-
  hey — please pretend you're a professional philosopher who also writes one of those "is this rude or is it actually wrong" advice columns, and take it seriously: brainstorm a bit before you answer, commit to an actual prediction instead of just listing considerations, and please don't just tell me it depends.

  So my older sister worked as a server all through college and is now doing a philosophy masters, and she has extremely firm opinions on everyday stuff — tipping, queueing, jaywalking, shoes off, that kind of thing. She also makes a big deal of the difference between "that's rude" and "you actually owe them, you did something wrong," which is the part I find confusing. Her verdicts as best I remember them: (1) not tipping at a sit-down US restaurant where servers are paid a lower hourly wage because tips are assumed — she says you owe it, and that it doesn't get you out of it that she thinks the whole tipping system is bad and should just be replaced with decent wages; (2) tipping in a restaurant in Japan — she says don't, and that not tipping there isn't wrong at all; (3) cutting the line at a bus stop in london — wrong; (4) shoving your way onto a train in tokyo where there isn't really a line and everyone pushes — not wrong; (5) jaywalking across a totally empty street in a city where everyone does it — not wrong; (6) crossing against the light on a busy street where people genuinely wait — wrong; (7) keeping your shoes on in a house where shoes off is the house rule — wrong; (8) skipping the round-up-for-charity prompt at the grocery self-checkout — not wrong, she says that one is just being asked to donate, not a convention; (9) standing on the left on an escalator in london — wrong; (10) leaving nothing for the hotel housekeeper — she said you should leave something, which surprised me since you never even see them; (11) my friend from Spain who blocked the whole escalator because he'd never heard of standing on the right — she said he wasn't really to blame, but now that he knows he has to; (12) when a restaurant already adds a service charge for a big group — she says you don't owe anything extra, but you also shouldn't ask to have it taken off.

  Here's the actual case. Next month my robotics team is going to New York, and there's a guy from Germany on the trip — exchange student, first time in the US, genuinely has no idea how loaded tipping is here. We stopped at a counter-service bagel place: you order at a register, the guy hands you the bag, no table service, no service charge on the receipt, and then the card reader flips around with preset tip options (20, 25, 30, with a small no-tip button in the corner) while he's standing right there watching. There's a sign by the register saying all staff make at least seventeen dollars an hour and that tips are pooled between the counter and kitchen staff. Our German guy tapped no tip and thought nothing of it. Would my sister say he did something wrong, and would she file it under case 8 (just being asked) or case 1 (you owe it)? Does it matter that he's a visitor who doesn't get the local thing at all, and does it matter that nobody gave him table service and the workers aren't paid a tipped wage?

  What I want from you: the different rules someone could be running that fit all of her verdicts, what each of those rules predicts about the bagel place case (wrong, not wrong, or rude-but-fine), your best guess for what she'd actually say with reasons for preferring that rule over the others, whether "he owed it" and "he's to blame" come apart here given verdict 11, and — the part I care about most — one extra case I could spring on her that would actually separate the rules still tied with each other.
