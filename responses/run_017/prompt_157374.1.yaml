  The sister would likely focus on the systemic aspect: since staff don't depend on tips for base survival (above minimum wage), this resembles case 8's optional donation rather than case 1's obligation. The German's lack of knowledge further removes blame. However, she might note that once informed, one should tip in such contexts.

