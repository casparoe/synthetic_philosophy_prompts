prompt: |-
  I am in my final year of secondary school, I sit on our school's conduct committee as the student member, and I am also writing an extended essay on the question the committee keeps failing to settle — so I would be grateful for something I can use in both places. Please do not point me at books or papers; I have no library access until term begins, and I want the thinking rather than the reading list.

  The case that split us: at the inter-school gala, the backup timer for our relay squad left her stopwatch in the changing room and watched from the stands instead of standing at the poolside. The first timer's watch froze at 0.00. No time was recorded for our leg, the result was voided, and we lost a qualifying place we would very likely have taken. Everyone agrees she did nothing at all. Half the committee thinks that if the word cause is to do any work in a hearing it has to track something a person did; the other half thinks that restriction is just a way of dodging the question.

  So: before I read any theories, I want the specification. What does an account of causation by omission have to deliver in order to be good enough for the purpose I actually care about — deciding, in a disciplinary hearing, whether someone who did nothing is answerable for an outcome, and, where several people did nothing, whose failure it was? Give me the desiderata with the case or consideration behind each: the cases the account must get right, the distinctions it must not collapse, the constraints it must be consistent with. Please number them D1, D2 and so on, because I intend to refer back to them by number.

  The cases I want covered are the ones we argued about, in rough order of how badly they divided us.

  The gala itself, where the harm seems to be a lost chance rather than a lost race, and where it matters whether the outcome is the voided time, the lost qualifying place, or the squad's season.

  The fire door. The prefect assigned to check it at ten did not check it; the night porter, who in eleven years had never once checked it, also did not. Either one of them, had they checked, would have found it propped open and shut it. The fire began at twenty-past. If both failures are treated the same way as two people doing something, then neither seems necessary, and the account needs a story about why we still want to pick one.

  The window. The prefect's duty ran from ten until half past, and the porter's ran all night. The fire started at twenty-past. Did her omission happen at ten, throughout the half hour, or only at the end of it — and is it still happening at half past ten, when she could no longer have done anything about it? A conduct code has to say when the thing occurred, and omissions do not seem to have the sharp edges that actions have.

  The seedlings. Twelve hundred people did not water the biology department's trays over the holidays, and the trays died. Only the two who signed up are blamed. Whatever filter selects those two, I want it stated as a requirement, and I want to know whether it is a filter on causes or a filter on blame.

  The router. One student switches off the wifi router during an exam; another fails to switch it back on after a cut. The behaviour can look identical from outside, and I want to know whether the distinction between doing and allowing is something the account must respect, or something it must explain away.

  The exchange student and the girl in isolation. One did not know the door was propped; the other knew and could not reach it. Both did nothing, and neither seems to me to have caused anything — so there is a requirement here about knowledge and ability, and I want it separated from the requirement about duty, because our committee conflated them.

  Two further things I want marked explicitly. First, which of your desiderata are non-negotiable and which are really preferences of one camp — for instance whether causation must be a matter of difference-making only, or must involve something physical passing between cause and effect, or must be a norm-free notion. Our hearings use the word cause to apportion blame, and I suspect that if a duty has to be built into the account in order to exclude the eleven hundred and ninety-eight, then the account can no longer do independent work in the blame question, and the hearing's first question collapses into its second: did she cause it, and did she owe it, becoming one question. If that circularity is unavoidable I would rather be told than protected from it. Second, flag any pair of desiderata you suspect cannot be jointly satisfied. Where a whole specification turns out to be unsatisfiable, that itself is the result I most want.

  If it is quick, add two lines each on how the three families of account people mention — difference-making or but-for views, connection or process views, and agency or norm-first views — do against your list; I will do the fuller scoring myself. Keep the weight on the criteria and their cases: that is the part I cannot do without help.

  Finish with a last line, with nothing after it, in exactly this form: \answer{Dn}, where n is the number of the single desideratum that in your judgement rules out the most candidate theories.
reasoning: |-
  Alright, let me unpack this user's request. They're a final-year student on a conduct committee, needing a framework to assess causation by omission for disciplinary hearings. The core tension is between theories that require active contribution versus those attributing blame for inaction. 

  First, the gala case shows how defining the "harm" changes culpability: was it the voided time, the lost qualification, or the entire season? This highlights the need for precise outcome specification (D1). The fire door scenario introduces overdetermination - both staff failed to act, but traditional causation models struggle here without introducing duty-based filters (D3). 

  The window case reveals temporal ambiguity: when does an omission "occur"? Discipline systems need clear timelines, so D4 requires accounting for opportunity windows. Seedlings present the inverse problem - mass inaction with only two culpable, demanding a duty-based cause filter (D6). 

  The router scenario tests if identical inaction should be judged differently based on prior action (turning off vs failing to turn on). This suggests respecting the doing/allowing distinction matters (D2). The exchange student case separates capacity/knowledge from duty - key because committees often conflate them (D5). 

  Underlying everything is the normative dilemma: can causation exist independently of duty? If not, "did they cause it?" collapses into "did they have duty?" (D7). I suspect process theories fail D4's temporal precision, while but-for theories stumble on overdetermination (D3). Normative theories may cheat by baking duty into causation. 

  The hardest requirement? D3 - explaining why one failure matters when either could've prevented harm. Most theories either blame both (unfair) or neither (illogical). Hence \answer{D3}.
answer: |-
  Here is a specification of desiderata for an account of causation by omission in disciplinary contexts, derived from your cases and concerns. Each requirement is linked to the case motivating it, with constraints and distinctions marked. Non-negotiable desiderata (based on logical coherence or practical necessity) are starred (\*).

  ---

  ### **Desiderata for Causation by Omission in Disciplinary Hearings**
  **D1\*: Must specify the relevant outcome precisely.**  
  *Case*: Gala. The "harm" could be the voided time (direct), lost qualifying place (probabilistic), or ruined season (downstream). An account must fix the outcome *before* assessing causation. Without this, omissions become endlessly expansive.  
  *Constraint*: Prevents arbitrary outcome-shifting to implicate/absolve.

  **D2\*: Must respect the distinction between *doing* and *allowing*.**  
  *Case*: Router. Turning off the router (doing) vs. failing to restart it (allowing) may look identical externally but involve different causal structures. Collapsing this distinction risks conflating active malfeasance with passive neglect.  
  *Constraint*: Theory must explain why "allowing" can be causal without equating it with "doing."

  **D3\*: Must resolve overdetermination in joint omissions fairly.**  
  *Case*: Fire door. If both prefect and porter omitted to act, and either *could* have prevented the fire, the account must explain why one/both are causal without resorting to "neither is necessary."  
  *Distinction*: Must not treat omissions like physical forces (e.g., two arsonists lighting one fire) but also not absolve all when harm was preventable.

  **D4: Must define the temporal boundaries of an omission.**  
  *Case*: Window. Did the prefect’s omission "occur" at 10:00 (duty start), continuously until 10:30, or only at 10:20 (when the fire started)? Discipline requires knowing *when* a breach happened.  
  *Constraint*: Must align with opportunity windows in duty schedules (e.g., omission persists only while action was possible).

  **D5: Must separate *capacity/knowledge* from *duty* in causal assessment.**  
  *Case*: Exchange student vs. isolated girl. Neither caused the fire due to lack of capacity/knowledge. But if only duty matters, knowledge gaps might excuse breaches.  
  *Distinction*: Causation should require *ability to act* (physical/epistemic), while *duty* determines blameworthiness. Avoid conflation.

  **D6\*: Must filter non-duty-bound agents from causal candidates.**  
  *Case*: Seedlings. 1,200 people didn’t water plants; only 2 signed up. The account must exclude non-duty-bound individuals *causally*, not just morally.  
  *Constraint*: If causation requires duty, it collapses into blame (circularity). Must have a *causal* filter (e.g., "normally expected interveners").

  **D7\*: Must avoid normative circularity.**  
  *Case*: All. If causation *by omission* presupposes duty ("she caused it *because* she had a duty"), then "did she cause it?" adds nothing to "did she breach duty?".  
  *Non-negotiable*: Causation must do independent work. If duty is a *precondition* for causal relevance (not part of causation itself), circularity is avoided.

  **D8: Must handle probabilistic outcomes.**  
  *Case*: Gala. The lost qualifying place was *likely*, not certain. An account must address "lost chances" without requiring certainty.  
  *Distinction*: Prevented a sure outcome (fire) vs. lost opportunity (qualification).

  ---

  ### **Constraints & Tensions**  
  - **Non-negotiable**: D1, D2, D3, D6, D7 (logical/practical necessity).  
  - **Key tension**: D3 (joint omissions) vs. D7 (anti-circularity). Many theories fail D3 by either blaming all/none or smuggling duty into causation.  
  - **D6 vs. D7**: Filtering by duty (D6) risks circularity (D7) if not carefully framed.  
  - **D4 vs. Physics**: Omissions lack "sharp edges" (unlike actions). Process theories struggle here.  

  ---

  ### **Theories in Two Lines**  
  - **Difference-making (but-for)**:  
    Excels at D1 (specifying outcomes), D8 (probabilities). Fails D3 (overdetermined omissions: neither is but-for cause) and D6 (non-duty-bound are still difference-makers).  
  - **Connection/Process**:  
    Excels at D2 (physical doing/allowing distinction). Fails D4 (omissions aren’t processes) and D3 (no physical link).  
  - **Normative/Agency**:  
    Excels at D6 (duty filters), D3 (duty breaks symmetry). Fails D7 (collapses causation into duty) and D5 (often conflates duty with capacity).  

  ---

  ### **Critical Failure Point**  
  **D3\* is the strongest filter**: Most theories cannot resolve joint omissions (Fire door) without violating D7 (circularity) or D2 (doing/allowing). But-for says neither caused it; normative says both did; process ignores omissions. None explain *why* one duty-bound omission is causal when others coexist.  

  \answer{D3}
