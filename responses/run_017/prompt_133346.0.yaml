  **Slide Text**:  
  **Case: Medical Diagnosis**  
  - **H**: "Patient has Condition C"  
  - **Times**: \(t_1\) (9:00 AM), \(t_2\) (2:00 PM)  
  - **Credences**:  
    - \(P_{t_1}(H) = 0.5\)  
    - \(P_{t_2}(H) = 0.9\) if (Test B+ and no S) or (Test B- and S)  
    - \(P_{t_1}(H \mid P_{t_2}(H) = 0.9) = 0.8\)  
  - **Divergence**: \(0.8 < 0.9\)  
  - **Why?**: \(t_2\) credence of 0.9 can arise from evidence more likely under \(\neg H\).  
  - **Key Insight**: Reflection assumes later evidence is only about \(H\); here, it’s about tests/symptoms affecting \(H\)’s probability.  
  - **Dutch book**: Fails; agent rejects overpriced bets.
