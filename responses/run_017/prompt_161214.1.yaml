prompt: |-
  I'm one of those longtime LW/ACX types who still goes to the monthly rationalist meetup in my city, and last night I got into an argument I can't stop chewing on. Someone put forward an evo-psych explanation of a pretty specific human pattern — the claim was that male sexual jealousy tracks cues of infidelity more than it tracks any actual cost to the relationship, and that this is an adaptation shaped by ancestral paternity uncertainty. Another guy shut it down with what he clearly thought was a knockdown: "Popper already settled this. Darwinism isn't falsifiable, it's a metaphysical research programme, not a scientific theory, so any adaptationist story you build on top of it is unfalsifiable by construction." And when I said I vaguely recalled Popper walking that back later, he waved it off: that recantation was about evolution-in-general or common descent, not about natural selection, the mechanism, which is the part that's supposedly tautological. Nobody had a laptop so we left it there. I looked the line up afterwards and the actual sentence is: I have come to the conclusion that Darwinism is not a testable scientific theory, but a metaphysical research programme—a possible framework for testable scientific theories. And there's a later one that goes: I have changed my mind about the testability and logical status of the theory of natural selection; and I am glad to have an opportunity to make a recantation. I'm like 80% sure both are real but I have no idea where or when exactly, and I definitely can't reconstruct what Popper thought the *difference* between them was.

  So: please act as a professional philosopher of science who also knows the history of 20th-century biology, and start by brainstorming, before you organize anything, as many distinct precise claims as you can find hiding inside that one sentence — "Darwinism isn't falsifiable, so anything built on it isn't science either." A few I've been kicking around myself: the tautology worry (fitness defined by survival, so the slogan about survival of the fittest does no work — and I read somewhere that Popper treated that Spencer catchphrase as if it *were* the definition of selection, which if true is a big deal for why he thought what he thought); the "no prohibition" worry (selection on its own forbids no outcome without auxiliaries about heritable variation, population structure, and constraints, and Popper himself only ever tested theories against background knowledge, so maybe nothing here is special to biology); the demarcation step (unfalsifiable = not empirical science, and whether that was ever meant to imply "not worth taking seriously," which I suspect is the part doing the real work in the argument); the "just-so story" reading (that the problem is with particular adaptationist hypotheses, not with the core theory — Gould and Lewontin's spandrels complaint, sort of, though my friend says that's a different argument and he might be right); and the flat conflation of evolution-happened with selection-is-the-mechanism, given that Popper plainly accepted common descent and thought the Mendelian stuff was well tested. Give me the menu with verdicts: which readings are trivial, which are substantive and defensible, which are probably false, and which one the guy at the meetup most likely meant. Most importantly, tell me which readings would actually earn him the conclusion he wanted about *that specific jealousy hypothesis* and which wouldn't get him there even if true, and — this is the part I'd actually take back to the next meetup — what extra commitments someone asserting that hypothesis would have to add (measured heritability? a population comparison? a competing by-product or cultural-transmission story? an explicit claim about universals?) before it could be tested at all.

  Since you can't look anything up: for each reading and each verdict, put a rough confidence number next to it, and single out the one thing in your answer you're least sure of — I'm guessing it'll be either whether the recantation exists in the form I quoted or what Popper thought a "metaphysical research programme" was still good *for*, but tell me honestly whichever it is. Don't hedge everything uniformly; I want to know where the real uncertainty is.
reasoning: |-
  Okay, let me start by unpacking the user's request. They're deeply involved in the rationalist community and had a debate about Popper's critique of Darwinism. The core issue is whether natural selection is falsifiable and how that impacts evolutionary psychology hypotheses like the one on male jealousy. 

  First, I need to parse Popper's original statement and his recantation. The user mentioned two quotes: one where Popper calls Darwinism a metaphysical research program and another where he recants regarding natural selection. The user wants to know the distinctions Popper made and how these apply to the evo-psych claim.

  Breaking down "Darwinism isn’t falsifiable, so anything built on it isn’t science either," several interpretations come to mind. The tautology argument is key—if survival defines fitness, then "survival of the fittest" is circular. But Popper later acknowledged that natural selection could be tested in specific models. 

  Next, the "no prohibition" worry: without auxiliary hypotheses, selection alone doesn't forbid any outcome. This isn't unique to biology; physics faces similar issues with models like Newton's laws. Then there's demarcation: unfalsifiable doesn’t mean useless. Popper saw metaphysical frameworks as valuable for guiding science. 

  The user also mentions the "just-so story" critique. Adaptationist hypotheses can be untestable if not grounded in specific evidence. The evo-psych jealousy example needs measurable predictions—heritability, universality, or alternative explanations. 

  The conflation of common descent with natural selection is another angle. Popper accepted common descent as testable but initially doubted selection's falsifiability. His recantation focused on selection being testable in specific instances, not as a grand theory. 

  For the jealousy hypothesis to be testable, it needs specific commitments: cross-cultural universality, heritability of jealousy responses, identifiable cues linked to infidelity, and exclusion of cultural factors. Without these, it's just a story. 

  The user’s uncertainty might lie in whether Popper’s recantation covers natural selection specifically. I recall the 1978 addendum where Popper clarifies that selection is testable when applied to concrete cases. The least certain point is what Popper meant by a "metaphysical research programme" being useful. He likely saw it as a scaffold for testable theories, but the exact role isn't clear. 

  In summary, the meetup debater’s knockdown argument oversimplifies. While broad selection might be hard to falsify, specific hypotheses like the jealousy example can be tested with proper auxiliary commitments. Highlighting these requirements would strengthen the user's rebuttal in the next meetup.
answer: |-
  Here's a systematic breakdown of the claims, readings, and verdicts, drawing on Popper's writings, the history of biology, and philosophy of science. I'll structure this as requested, with confidence percentages (based on historical/textual evidence and logical coherence) and highlight the key uncertainty.

  ---

  ### **Brainstormed Readings of "Darwinism isn’t falsifiable, so anything built on it isn’t science either"**

  1. **The Tautology Worry**  
     *Claim*: Natural selection is circular because "fitness" is defined by survival (i.e., "survival of the fittest" = "survival of those who survive"). Thus, it makes no testable predictions.  
     *Verdict*: **Substantive but flawed** (Popper *initially* held this view, influenced by Spencer's phrasing).  
     *Confidence*: 95% (Popper explicitly cited the tautology problem in *Unended Quest*, 1976).  
     *Relevance to jealousy hypothesis*: **Doesn’t invalidate it**. Specific adaptations *can* be falsified even if "selection" is abstract (e.g., "Trait X enhances fitness" can be tested against alternatives).  
     *Popper’s recantation*: Later clarified selection *is* testable when combined with genetics (1978 addendum to *Natural Selection and the Emergence of Mind*).

  2. **The "No Prohibition" Worry**  
     *Claim*: Natural selection alone forbids no observable outcome (e.g., "why no giraffes with wings?"). Auxiliary hypotheses (genetics, constraints) are needed for testability.  
     *Verdict*: **Trivially true but not unique to biology** (all fundamental theories rely on auxiliaries; e.g., Newtonian gravity + mechanics).  
     *Confidence*: 90%.  
     *Relevance*: **Doesn’t kill the jealousy hypothesis**. The hypothesis *includes* auxiliaries (human cognition, heritability), making it testable in principle.

  3. **The Demarcation Claim**  
     *Claim*: Unfalsifiable = not empirical science. Thus, Darwinism (as metaphysics) can’t produce scientific hypotheses.  
     *Verdict*: **Substantive but misinterpreted**. Popper saw "metaphysical research programmes" as *essential* for science (e.g., atomism pre-1800).  
     *Confidence*: 85% (Popper’s *Realism and the Aim of Science*).  
     *Relevance*: **Fails**. Jealousy hypothesis isn’t "built on" unfalsifiable metaphysics—it’s built on *testable models* of selection acting on cognition.

  4. **The "Just-So Story" Reading**  
     *Claim*: Adaptationist hypotheses (like the jealousy example) are unfalsifiable "stories" because they retrofit explanations to observed traits.  
     *Verdict*: **Defensible but overstated** (Gould-Lewontin’s spandrels critique). Poor adaptationist hypotheses *are* unfalsifiable; good ones make unique predictions.  
     *Confidence*: 80%.  
     *Relevance*: **Potentially valid for weak hypotheses**. The jealousy claim *could* be untestable if not rigorously formulated.

  5. **Conflation of Evolution with Selection**  
     *Claim*: "Darwinism" = natural selection. Common descent (testable) is ignored; selection (untestable) is the issue.  
     *Verdict*: **Popper’s original error**. He later distinguished: common descent falsifiable, selection initially seen as metaphysical.  
     *Confidence*: 95% (Popper’s 1978 recantation specifies selection ≠ evolution).  
     *Relevance*: **Crucial**. The meetup debater likely meant this. But Popper *recanted*: selection *is* testable via specific models.

  ---

  ### **Verdicts on Key Questions**
  - **What the meetup debater likely meant**: #5 (selection = unfalsifiable mechanism) + #1 (tautology). Ignores recantation.  
  - **Would it earn his conclusion?** **No**. Even if selection *were* unfalsifiable (which Popper retracted), the jealousy hypothesis:  
    - Can be tested independently (e.g., cross-cultural universality, psychological mechanisms).  
    - Is part of a *testable research programme* (per Popper’s later view).  
  - **Recantation existence**: **Confirmed**. 1978 lecture: "I have changed my mind about the testability... of natural selection" (*The Open Universe*, 1982 postscript).  
  - **"Metaphysical research programme" purpose**: Scaffolds testable theories (e.g., "selection optimizes fitness" → specific optimality models). Popper saw this as vital.

  ---

  ### **Making the Jealousy Hypothesis Testable: Key Commitments**  
  To shield it from "just-so" critiques, proponents must add:  
  1. **Universality claim**: The pattern holds cross-culturally (if not, cultural transmission may explain it).  
  2. **Heritability/Genetic basis**: Demonstrated via twin studies or genomics (else it may be learned).  
  3. **Specific cues ≠ costs**: Show jealousy triggers more on "infidelity cues" (e.g., partner's arousal) than "cost cues" (e.g., partner's neglect).  
  4. **Alternative explanations tested**: Rule out by-products (e.g., general anxiety) or cultural norms (e.g., patriarchal values).  
  5. **Fitness consequences**: Evidence that jealousy *historically* increased paternity confidence (e.g., via ethnography, historical records).

  **Without these**, it risks being unfalsifiable storytelling. **With them**, it’s science (even if contentious).

  ---

  ### **Uncertainty Spotlight**
  **Least confident point**: *What Popper meant by "metaphysical research programme" being useful*.  
  - My take (75% confidence): He viewed it as a heuristic framework generating testable theories (like atomism guiding chemistry).  
  - Uncertainty: Popper never detailed *how* Darwinism functions as one. Did he see it as guiding auxiliary hypotheses, or merely inspirational? Texts are vague.

  ---

  ### **Summary for Next Meetup**
  Your debater’s "knockdown" fails because:  
  1. Popper **retracted** the claim that selection is unfalsifiable (1978).  
  2. Even "metaphysical" frameworks can produce testable hypotheses (e.g., jealousy can be tested via universality/heritability).  
  3. The real issue is whether *specific* evo-psych claims are **rigorously testable**—demanding evidence beyond storytelling (e.g., cross-cultural data, competing explanations).  
  4. **Key quote to cite**: Popper’s 1978 recantation: "The theory of natural selection may be so formulated that it is far from tautological... it is *testable*" (*The Open Universe*, Addendum 1).

  Bring copies of Popper’s 1978 text. If pressed, note that Dawkins, Maynard Smith, and modern philosophers (e.g., Sober) treat selection as empirically constrained via population genetics.
