  First, let's understand the core of their argument with their friend. The user believes "Western values" is a constructed category where people retroactively label desirable things as "Western" to make them seem inherited rather than chosen. Their friend argues these values are real and distinctive. The satire needs to expose this construction without anyone explicitly stating it.

  The format is crucial: institutional minutes of a committee meeting. This bureaucratic framing will allow the satire to emerge from procedural logic rather than direct statements. The humor must come from accurately exaggerated bureaucratic handling of conceptual problems.

  Key elements to include based on user's specifications:
  - Retroactive recruitment of values (voting in and backdating values)
  - The Switch Clause (formal mechanism to toggle between universal/civilizational definitions)
  - Excision Rule (processing historical embarrassments as deviations)
  - Border disputes (who counts as "Western")
  - Origin-myth problems (tension between Athens/Jerusalem/Enlightenment)
  - Real-world function (turning interests into principles, manufacturing "we")

  Important constraints:
  - Must stay deadpan and procedural
  - No real people named
  - No anchoring in current culture wars
  - No character voicing the user's objection
  - Each agenda item must clearly parody a real conceptual move

  I'll structure this as formal committee minutes with:
  - Members present/apologies
  - Minutes approval
  - Numbered agenda items with motions/discussion/votes
  - Procedural language throughout

  For the retroactive recruitment, I'll include an item where they vote to adopt "universal public education" as a Western value and immediately backdate it to ancient Greece. This shows how recent developments get framed as ancient inheritances.

  The Switch Clause will be written as Standing Order 7(b), with a demonstration where members toggle between "universal human value" and "distinctly Western heritage" during a debate about religious freedom.

  For the Excision Rule, I'll create a Backlog Subcommittee that's years behind on processing historical embarrassments like colonialism and slavery as "deviations."

  Border disputes will cover ambiguous cases like Russia (too authoritarian?), Japan (too efficient?), Australia (too new?), and an application from "Atlantis" to highlight the absurdity.

  The origin-myth problem will appear as Item 6, where members note irreconcilable tensions between Athenian democracy, Judeo-Christian morality, and Enlightenment rationalism regarding individualism.

  Finally, I'll include a drafted press release where "work-life balance" gets framed as a Western value to oppose labor reforms, showing how the category manufactures solidarity around interests.

  Throughout, I'll maintain absolute bureaucratic seriousness - the horror comes from how rationally they handle these conceptual contradictions. The satire works because every motion reflects actual moves made in real "Western values" discourse, just pushed to their logical extreme.
