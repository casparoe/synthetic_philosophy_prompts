  Okay, let me tackle this user's problem step by step. They're in a grad reading group on ethics and have built an argument against moral sainthood using two key concepts: attitude-dependence and revocability discount. Their friend claims this leads to absurdity by undermining all committed lives, including moderation itself. The user wants to defend step (4) while rejecting the problematic conclusions.

  First, I need to understand the core moves. The user's added devices seem airtight at first glance—they effectively block the "scheduled leisure" counterargument. But the generalization in step (5) is where things unravel. If every dominant commitment triggers the revocability discount, then even non-moral commitments like science or art would be condemned, and moderation would self-destruct in step (6). That does feel like a reductio.

  Hmm... the critical flaw might be in how "dominant commitment" operates across domains. Moral commitments have a unique feature: they claim overriding authority. When the saint leaves a concert for a moral emergency, it's because morality demands priority. But when a physicist pauses a dinner to check an experiment, that interruption stems from professional passion—not a normative claim that science trumps friendship. The revocability discount applies differently here; the physicist's friends might accept "science is her calling" without feeling secondary in the same way the saint's friends would. 

  The user's step (2) defines the saint as treating every hour as morally owed. That creates a psychological burden absent in other commitments. For the moderate person in step (6), their balancing act doesn't necessarily lease all goods—they might fully inhabit each activity without moral anxiety. The discount requires actual revocation, not just theoretical revocability. 

  I should check if this resolves the chain. Rejecting step (5)'s equivalence preserves the anti-sainthood argument (steps 1-4) while sparing other commitments. The cost? I'd need to clarify that moral commitments uniquely generate the discount due to their normative supremacy. That seems defensible—and the user already hints at morality's special status when calling it "maximal moral goodness." 

  Alternatives would be messier. Rejecting step (1) guts the argument; rejecting step (4) surrenders their thesis. This path lets them keep their core claim while answering the friend's reductio. Plus, it explains why we admire Curie but not saints: her absorption lacks the moral-leasing effect.
answer: |-
  Here's my definite position: **Reject step (5)**. Its claim that "nothing in (1)–(4) turns on the value in question being the moral one" is false. The argument relies on a *unique feature of morality* that doesn’t apply to other commitments like physics or cello. Here’s the breakdown:

  ### What’s Wrong with Step (5)
  1. **The Scope of "Owed" Time**:  
     - In step (2), the saint treats every hour as **morally owed**—meaning any moment *could* be commandeered by a higher moral demand. This creates a universal background anxiety: friendships/hobbies exist *only* on borrowed time, conditional on no moral emergency arising.  
     - For the physicist or cellist, time not spent on their craft isn’t "owed" to physics/cello in the same **normative sense**. Their commitment doesn’t claim *authority over all possible moments*. When they play chess with a friend, they aren’t implicitly thinking, "This is permissible only if no breakthrough in quantum mechanics occurs." Their devotion is *passionate*, not *morally totalizing*.  

  2. **Revocability Discount’s Moral Trigger**:  
     - The discount applies when goods are held on a lease **revocable by overriding moral demands**. The physicist who leaves dinner for a lab emergency revokes friendship-time for *her own priority*, not because physics *morally obligates* her to abandon friends. The saint, however, acts under a perceived *moral duty* to revoke. This injects a qualitatively different betrayal dynamic: the friend knows they’re second fiddle to *morality itself*, not just a passion.  

  3. **Attitude-Dependence and Moral Anxiety**:  
     - Attitude-dependence (from step 1) requires that you *not* treat the activity as a "permitted use of time owed elsewhere." The saint’s leisure is always shadowed by moral accounting ("Is this *allowed*?"). The physicist absorbed in a sonata isn’t subconsciously auditing whether she "owes" this time to the cello; she’s simply engrossed. Her commitment lacks morality’s **guilt-inducing authority**.  

  ### Cost of Rejecting Other Steps
  - **Reject (1)**: You lose your defense against the scheduling reply. If attitude-dependence is false, the saint *could* schedule "genuine" friendship by mentally partitioning time. But this guts your core argument—you’d need an alternate account of why scheduled sainthood fails. *Cost: High. (4) collapses.*  
  - **Reject (2)**: You must explain how the saint *avoids* leasing all goods. But your definition is standard in anti-sainthood arguments (e.g., Susan Wolf). Denying it concedes the pro-saint position. *Cost: (4) dies.*  
  - **Reject (3)**: You deny the saint lacks genuine goods. But if (1)-(2) hold, (3) follows. *Cost: Argument fails.*  
  - **Reject (4)**: Abandons your thesis. *Cost: Total surrender.*  
  - **Reject (6)**: Moderation isn’t a "dominant commitment" in the relevant sense. The moderate person *doesn’t* treat each activity as revocable for "balance." They inhabit each pursuit fully *because* balance isn’t a supreme demand—it’s a framework enabling absorption. *But this doesn’t save (5), which is the deeper flaw.*  

  ### Why (4) Survives Rejecting (5)
  - The anti-sainthood argument (steps 1-4) stands because morality’s **totalizing normative claim** uniquely poisons attitude-dependent goods via revocability. Physics/cello lack this feature.  
  - We can admire Curie *because* her devotion doesn’t impose the moral revocability discount: her friends aren’t hostages to a universal duty. The saint’s friendships, however, *are*.  

  ### Positive Account (Per Your Request)  
  The saint’s friendships are **contingent utilities**, not intrinsic bonds. From the inside:  
  > *"I cherish this dinner with you—but part of me monitors for crises. If I heard a child crying outside, I’d leave immediately, not from personal choice, but because I must. You understand; you know I’d do the same for you if you were in need. Our joy is real, but it’s underwritten by the awareness that it’s dispensable if duty calls."*  
  This fractures absorption. The physicist’s version:  
  > *"This dinner is my sanctuary from the lab. If my phone rings with news of a breakthrough, I’ll leap up—but that’s *my* passion, not cosmic obligation. You might roll your eyes, but you don’t feel secondary to morality."*  

  ### Conclusion
  Your friend’s reductio fails because step (5) equivocates on the nature of "commitment." Only moral commitment, by asserting universal authority, triggers the revocability discount in a way that undermines attitude-dependent goods. (4) survives: maximal moral sainthood *is* undesirable, but physics/cello/moderation aren’t condemned by your argument. The flaw is in (5)’s false equivalence.
