prompt: |-
  I am a TA for a second-year metaphysics course, and I have one fifty-minute section to take students from the simple conditional analysis of dispositions to seeing why finks and masks are not two instances of a single problem. They have already met one fink case — a wire that is live but wired to a device that cuts the current at the instant it is touched — and they found it intuitive; they have not met masks. Do not explain the material to me; give me the plan for teaching it.

  I want four things. First, the order the components must come in and what depends on what: in particular, what has to be in place before a mask can even look like a counterexample, and whether the reverse failure — a conditional that is true although the disposition is absent — belongs in this session at all or would only blur the distinction I am trying to build. Second, the one carrying case for masking, and what it must have and lack: I am drawn to the analgesic that blocks pain while leaving the sensitivity to pain intact, but I suspect students will defuse it by saying the subject is not really in the pain-disposing state, and I do not want to use protective packaging, since they will just say the glass was never really struck. Third, the misconceptions in the order they will form and the point in the sequence where each should be headed off: that finks and masks have the same structure and so call for the same repair; that a normal-conditions or ceteris paribus clause disposes of both; that if the disposition survives the mask then the manifestation must survive too, in some weakened form.

  Fourth, tell me where to place a pair of cases I have constructed: a fragile mug coated in a polymer that stiffens on impact so the mug does not break, the stiffening lasting only as long as the stress does; and a variant in which the same impact also briefly anneals the ceramic, so that the brittleness itself is absent for a moment. Which belongs earlier, what each should force the students to notice, and whether the hybrid case is both, neither, or a reason to doubt the distinction. Finally, give me one question to put on the board at the end that would show me they have the distinction rather than the labels — including what a wrong-but-tempting answer would look like — and name one thing I should explicitly refuse to go into at this level.
reasoning: |-
  Okay, the user is a TA preparing a metaphysics section on dispositions, specifically distinguishing finks from masks using the Simple Conditional Analysis (SCA). They need a clear teaching plan with four components: sequence, masking example, misconceptions, and their custom cases. 

  First, assessing the user's scenario: They're time-limited (50 mins) and students already grasp finks intuitively but haven't encountered masks. The core challenge is preventing conflation of finks/masks as "the same problem." Their anxiety about student misinterpretations (e.g., defusing the analgesic example) shows deep pedagogical awareness. The unspoken need is likely confidence in controlling conceptual drift during discussion.

  Breaking down the four requests:
  1. **Sequence**: Must first solidify SCA's failure modes. Finks (disposition vanishes pre-test) are prerequisite since masks (disposition persists but blocked) only make sense if SCA's core structure is intact. Reverse failures (false positives) would muddy the waters here—save for later.
  2. **Masking case**: Analgesic is ideal if pre-empted correctly. Students might argue "not in pain-disposing state," so the setup must emphasize preserved neural sensitivity (e.g., nociceptors firing normally). Avoid packaging examples—they invite "not really struck" objections.
  3. **Misconceptions**: Three traps: (a) structural sameness (finks remove D, masks block M), (b) overreliance on ceteris paribus (masks exploit normal conditions), (c) manifestation must occur if disposition exists. Each needs targeted blocking during examples.
  4. **Custom cases**: The polymer-coated mug (stiffens on impact) is pure mask—manifestation blocked but brittleness intact. The annealing variant is a fink—brittleness temporarily lost. Present polymer first to isolate masking, then annealing to contrast. Hybrid case proves the distinction isn't arbitrary.

  For the exit question, "Why isn't a finked wire still live?" tests if they see disposition loss vs. obstruction. Tempting wrong answer: "Because conditions weren't normal" (misapplying ceteris paribus). 

  Finally, explicitly avoid reverse failures (e.g., mimickers)—they'd derail the focus on finks/masks as distinct SCA falsifiers.
answer: |-
  Here’s a step-by-step plan for your 50-minute section, optimized for clarity and avoiding conflation:

  ---

  ### **1. Order of Components & Dependencies**  
  *(Timing: 15 mins)*  
  - **Start with SCA Recap (5 mins)**:  
    - Re-state SCA: "Object *O* is disposed to yield *M* when *S* iff *O* would *M* if *S* were to occur."  
    - **Reinforce the fink case** (live wire + cut-current device): Emphasize that the disposition *ceases to exist* when triggered.  
  - **Introduce Failure Modes (10 mins)**:  
    - **Finks**: Disposition *vanishes* pre-manifestation (→ conditional false).  
    - **Masks**: Disposition *persists* but is *blocked* from manifesting (→ conditional *true*? Problem emerges later).  
    - **Dependency**: Finks must be understood *first* to show masks aren’t disposition-loss. **Omit reverse failures** (false positives) entirely—they’re a separate problem that blurs today’s goal.  

  ---

  ### **2. The Masking Case: Structure & Defense**  
  *(Timing: 10 mins)*  
  - **Case**: "A subject takes a *super-analgesic*: it blocks pain *output* (e.g., screaming) but leaves pain *sensitivity* fully intact (nerves fire normally). When burned, they don’t flinch."  
  - **Crucial Features**:  
    - The disposition (pain sensitivity) is *present* (deflect "not in pain-state" by noting neural evidence).  
    - The manifestation (flinching) is *physically blocked* (analgesic intercepts signal).  
  - **Preempt Defusal**:  
    - *If students say "not disposed"*: Ask: "If the analgesic wears off *mid-burn*, would they flinch? Yes → disposition persisted." Contrast with fink (disposition gone instantly).  

  ---

  ### **3. Misconceptions & Preemptive Strikes**  
  **Sequence of Pitfalls** (Address *as they arise* during examples):  
  1. **"Finks & masks are the same"**:  
     - *When*: After introducing mask.  
     - *Block*: Contrast mechanisms:  
       - Fink: Disposition *destroyed* (wire not live when touched).  
       - Mask: Disposition *intact* but *silenced* (pain sensitivity active, output blocked).  
  2. **"Ceteris paribus fixes both"**:  
     - *When*: After presenting either case.  
     - *Block*: "Normal conditions *include* the mask! The analgesic *is* part of the scenario." Finks involve abnormal *changes*; masks exploit stable conditions.  
  3. **"Manifestation must occur weakly"**:  
     - *When*: During analgesic/mug discussion.  
     - *Block*: "Does the analgesic cause *any* pain behavior? No. The mask *fully* blocks *M* without altering *D*."  

  ---

  ### **4. Your Custom Cases: Placement & Purpose**  
  *(Timing: 15 mins)*  
  - **Step 1: Polymer-Coated Mug (Mask)**  
    - *Place*: **Right after analgesic**.  
    - *Features*: Brittleness persists → polymer stiffens *only during impact* → no breakage.  
    - *Force students to notice*: Disposition (brittleness) is *unchanged*; manifestation is *externally suppressed*.  
  - **Step 2: Annealing Variant (Fink-Mask Hybrid)**  
    - *Place*: **After establishing pure mask**.  
    - *Features*: Impact *temporarily removes brittleness* (disposition lost) → no breakage.  
    - *Purpose*:  
      - Shows annealing is a *fink* (disposition vanishes).  
      - Contrast with polymer (mask): "Which mug is *still brittle* when struck?" (Polymer: yes; Annealing: no).  
    - **Hybrid Verdict**: *Both* mechanisms are present (brittleness lost *and* stiffened). Use to **reinforce distinction**: "Two independent ways to prevent breaking: kill *D* (fink) or block *M* (mask)."  

  ---

  ### **5. Exit Question & Boundaries**  
  - **Question**:  
    > *"In the analgesic case, why does the subject still have the disposition to feel pain, but in the finked wire, the wire loses its disposition to conduct current?"*  
    - **Tempting wrong answer**: "Because the wire’s conditions changed." (*Misses key difference: disposition destruction vs. survival*).  
    - **Target insight**: Finks remove *D*; masks leave *D* intact but prevent *M*.  
  - **Explicitly Avoid**:  
    - **Reverse failures** (e.g., mimickers/disguises). Say: "Today is about *false negatives*—when *D* is present but *M* doesn’t occur. We’ll handle mimics later."  

  ---

  ### **Timing Summary**:  
  - SCA + Finks (15 mins) → Masking Case (10 mins) → Custom Cases (15 mins) → Exit Q + Recap (10 mins).  
  **Goal**: By session’s end, students should see finks/masks as distinct *causes* of SCA failure (disposition death vs. blocked expression), not "two versions of interference."
