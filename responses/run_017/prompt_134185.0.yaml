prompt: |-
  Hi — I work for a state alliance of about 250 independent pharmacies. I'm the staff person who shepherds our practice standards: the board of nine votes on them four times a year, our counsel has to clear whatever we send out, and whatever we recommend goes to members in writing with reasons they can argue with. Because we're competitors, counsel is extremely clear that the alliance can't be used to reach any understanding about what members will do — no joint commitments, no we-all-agreed-to-this, nothing that smells like coordinating conduct. So each member ends up deciding alone whether to take on some costly practice where the payoff only shows up if enough others do it to: keep making a compounded pediatric suspension at a loss so the regional referral network and the inspector's familiarity with it survive, post real cash prices when the shop across town doesn't, stay open extra evening hours for a vaccination service that only draws people if most pharmacies offer it. Roughly eight of these a year, and the stakes run from a few thousand dollars to existential for a small store.

  What I want is a decision procedure, runable in half an hour by someone with no philosophy background, that takes seriously the thing I've been reading about — that if I reason evidentially about my own action, and the world is large in the sense that I can't write down in advance every state that would screen off the correlation between what I decide and what other agents relevantly like me decide, then my cooperating is genuine evidence that they cooperate, and that can beat the obvious causal calculation where I just eat the cost by myself. The story is that in a small world, where you can condition on a fully specified state, you get the usual defection answer, and large worlds break it. I get the headline. I cannot turn it into something nine pharmacists can actually run.

  So: the steps in order, what counts as a good enough answer to each, where the procedure stops with a no. Please handle specifically: how to fix the reference class of agents my action is evidence about before anyone knows which way it points, since otherwise everyone picks the class that tells them what they wanted to do anyway; what to do when the class comes out nearly empty, or when I've conditioned on so much of my own situation that the only agent relevantly like me is me; not double counting when there's also some real causal channel, because word does get around the county; what it even means to decide to cooperate if the whole point is that I can't choose which kind of agent I am — managing the news versus managing the world; and the case where widening the class adds people but drops the correlation, trading off against the same marginal benefit.

  Then run it on two proposals: keeping the money-losing compounded pediatric suspension, and adopting posted transparent cash prices. Include one case where it hands us an answer we won't like — I'd rather have that than a procedure that always says be nice. And tell us definitely where it hands the decision back to a human because the question is one of values rather than facts, and honestly where you think it will just misfire.
reasoning: |-
  We are designing a decision procedure for independent pharmacies to decide whether to adopt a costly practice that only pays off if enough others do it. The procedure must be runnable in half an hour by someone without a philosophy background and must avoid any appearance of coordination. The key idea is to use evidential reasoning in a "large world" where one's own action provides evidence about what other similar agents will do.

  The procedure is structured as a series of steps. Each step must be answered, and if any step yields a clear "no", the process stops. The steps are designed to avoid common pitfalls such as reference class manipulation, double-counting causal effects, and confusion between evidential and causal reasoning.

  ### Step 1: Define the Practice and the Threshold
  - **What to do**: Clearly describe the practice and the minimum number (or proportion) of pharmacies that must adopt it for the benefit to materialize. Also, state the cost to you and the benefit to the group (and to you) if the threshold is met.
  - **Why**: To set the stage and ensure everyone is evaluating the same scenario.
  - **How to answer**: The practice must be well-defined. If the threshold or the costs/benefits are too vague, stop and revise the proposal.

  ### Step 2: Assess the Causal Impact of Your Action
  - **What to do**: Consider whether your action, by itself, has any direct causal effect on the outcome, independent of others. For example, if you adopt the practice, does it directly cause others to adopt? (But note: we cannot coordinate, so any causal effect must be through non-coordinated channels, e.g., observable actions that might influence without agreement.)
  - **Why**: To separate the causal effect (which is often negligible in large groups) from the evidential effect.
  - **How to answer**: If your action has a significant causal effect (e.g., you are a trendsetter, or your action will be highly visible and likely to inspire imitation), then note that and proceed. Otherwise, assume the causal effect is negligible. If the causal effect is strong enough to potentially tip the outcome by itself, then you might decide based on that. But in our context, causal effects are likely weak.

  ### Step 3: Define the Reference Class
  - **What to do**: Define the group of "relevantly similar" agents (pharmacies) whose behavior you are trying to predict. The reference class should be based on shared circumstances that affect the decision, but not on factors that are direct outcomes of the decision itself or that you can manipulate. The class must be fixed before you know what your own decision will be.
  - **Why**: Your own decision is evidence about what other members of the reference class will do. We want a class that is large enough to be informative but not so large that it includes irrelevant agents. We also want to avoid conditioning on too much, which would isolate you.
  - **How to avoid manipulation**: The class should be defined by objective characteristics that are fixed at the time of decision and are known to be relevant (e.g., location, size, type of services, current participation in similar practices). Do not include your own decision or intentions. The reference class must be defined without knowing how the evidence will point.
  - **What if the class is too small?**: If the reference class has fewer than 5 agents, it may be too small to be informative. In that case, try to broaden the class by relaxing some conditions (but not by including clearly dissimilar agents). If it remains too small, note that the evidential approach may not work and skip to Step 5 (pure causal reasoning).
  - **What if broadening the class reduces correlation?**: We must balance class size and relevance. If including more agents makes the class less homogeneous (so that your action is less predictive of theirs), then we need to adjust the class to maximize the expected informativeness. We can do this by choosing a class that is as large as possible while maintaining high relevance (e.g., using a rule like "all independent pharmacies in our state that serve pediatric patients" for the pediatric suspension example). If no such class exists, then the evidential reasoning may not apply.

  ### Step 4: Estimate the Base Rate and the Evidential Effect
  - **What to do**: 
    a) Estimate the base rate of cooperation in the reference class without conditioning on your action. This is the prior probability that a randomly selected agent in the class will cooperate. Use available data (e.g., past similar decisions, surveys, expert opinion) to set this. If no data, use a neutral prior (e.g., 50%).
    b) Now, condition on your own cooperation. How much does that increase the estimated cooperation rate in the reference class? This is the evidential effect. The idea is that if you cooperate, that is evidence that the world is one in which cooperation is more likely, so you update the base rate upward.
  - **Why**: To quantify the evidential effect: by cooperating, you learn that cooperation is more likely among similar agents.
  - **How to estimate the evidential effect**: This is the hardest step. We can use a simple heuristic: 
    - Let N be the size of the reference class.
    - The prior expected number of cooperators is N * p, where p is the base rate.
    - If you cooperate, then you are one of them. So the expected number of other cooperators is (N-1) * p', where p' is the updated probability of cooperation for others.
    - How much to update? We can use a simple Bayesian model: imagine that the true cooperation rate in the class is unknown, and we have a prior distribution for it (e.g., uniform). Then, observing your own cooperation (one success) updates the expected cooperation rate to (1 + prior_success) / (1 + prior_trials). If we started with a uniform prior (which is equivalent to having seen 1 success and 1 failure), then after you cooperate, the updated expected p is (1+1)/(1+2) = 2/3. But note: this is a heuristic and may not be perfect.

  A practical approach: 
    - If you have data from past similar decisions, use the observed correlation. For example, in past practices, when a pharmacy cooperated, what proportion of the reference class cooperated? And when they didn't, what proportion? The difference is the evidential effect.
    - If no data, use a rule of thumb: assume that your cooperation increases the estimated proportion of cooperators in the class by a factor of 1.5 (but not above 1). For example, if the base rate is 40%, then conditionally it becomes min(1, 1.5 * 40%) = 60%. This factor is arbitrary but reflects the idea that your action is one data point.

  ### Step 5: Combine Causal and Evidential Effects
  - **What to do**: Now, compute the expected net benefit of cooperating and not cooperating.
    - For cooperating: 
        - Cost: you pay the cost C.
        - Benefit: if the total number of cooperators meets the threshold, you get the benefit B (which includes both the group benefit and your share).
        - The probability that the threshold is met: this depends on the expected number of cooperators. Use the updated estimate from Step 4 (if using evidential reasoning) and account for any causal effect from Step 2.
    - For not cooperating: 
        - Cost: 0.
        - Benefit: you get B only if the threshold is met without your cooperation.

  But note: the evidential effect means that if you don't cooperate, that is bad news about the world (so the threshold is less likely to be met). So we have to use the same updated probabilities for both scenarios? Actually, we condition on your action.

  We can compute:
    - If you cooperate: the expected number of other cooperators is (N-1) * p_cooperate, where p_cooperate is the updated probability for others given you cooperate (from Step 4).
    - Then the total cooperators = 1 + (N-1)*p_cooperate (this is an expectation, but we need the probability of meeting the threshold).
    - Similarly, if you don't cooperate: the expected number of cooperators is (N) * p_not, where p_not is the updated probability for others given you defect. We can set p_not by the same logic: if you defect, then the updated base rate might be lower. Using the same heuristic: if base rate is p, then after defecting, the updated rate might be max(0, p / 1.5) or something.

  But note: the threshold is a step function. We need the probability that the total number of cooperators is at least T. We can approximate by assuming the number of cooperators follows a binomial distribution with parameters (N-1, p_cooperate) when you cooperate, and (N, p_not) when you don't. Then compute the probability that the threshold is met.

  However, this might be too complex. Instead, we can use a normal approximation or even just compare the expected number to the threshold.

  Simplified approach:
    - Let T be the threshold (number of cooperators needed).
    - If you cooperate:
        Expected total cooperators = 1 + (N-1)*p_cooperate
        If this expected total is >= T, then we consider the threshold met with high probability (if the variance is low). Otherwise, low.
    - If you don't cooperate:
        Expected total = N * p_not
        Similarly.

  But this ignores uncertainty. We can use a rule: if the expected total when you cooperate is at least T and when you don't is less than T, then cooperating increases the chance of success. Then the decision depends on whether the benefit B times the increase in the probability of success is greater than the cost C.

  Specifically:
    Let P_success_coop = probability that threshold is met if you cooperate (approximated by 1 if E_total_coop >= T, 0 otherwise? This is crude. Alternatively, we can set P_success_coop = min(1, E_total_coop / T) or use a logistic function. But we need something simple.)

  A better crude approximation: 
    - If E_total_coop >= T and E_total_not < T, then cooperating makes success go from 0 to 1 (so the benefit is B).
    - But if E_total_coop is only slightly above T, and the variance is high, it might not be 1. We can use: 
          P_success_coop = 1 if E_total_coop > T + 2*SD, 
          P_success_coop = 0.5 if T - 2*SD <= E_total_coop <= T+2*SD, 
          P_success_coop = 0 if E_total_coop < T - 2*SD
    But that's too complex.

  Alternatively, we can skip to a cost-benefit comparison:

    Net benefit of cooperating = -C + B * I(E_total_coop >= T)
    Net benefit of not cooperating = 0 + B * I(E_total_not >= T)

  But the indicators are random. Instead, we use the expected net benefit:

    E[Net|coop] = -C + B * Pr(threshold met | you cooperate)
    E[Net|not] = 0 + B * Pr(threshold met | you don't cooperate)

  We then choose the action with the higher expected net benefit.

  The challenge is estimating the probabilities. We can use:

    Pr(threshold met | you cooperate) = Pr(at least T-1 other cooperators) 
    ~= 1 if (N-1)*p_cooperate >= T-1 (by a comfortable margin, say 5%)
    ~= 0 if (N-1)*p_cooperate < T-1 (by a comfortable margin)
    and if it's close, then set to 0.5.

  Similarly for not cooperating: Pr(threshold met | you don't) = Pr(at least T cooperators) 
    ~= 1 if N * p_not >= T (by 5%)
    ~= 0 if N * p_not < T (by 5%)
    else 0.5.

  ### Step 6: Check for Double Counting
  - **What to do**: Ensure that any causal effect (from Step 2) is not already captured in the evidential effect. If there is a causal effect (e.g., your action might influence others via observation), then we have two channels: evidential and causal. The evidential effect already captures the idea that the world might be such that others are more likely to cooperate (and you are like them). The causal effect is an additional push. So in Step 5, when estimating p_cooperate, we should not include the causal effect? Actually, the evidential effect is about the world, the causal effect is about your direct impact. They are additive.
  - **How**: In Step 5, if there is a causal effect, then when you cooperate, you not only get the evidential update but also cause some additional cooperators. So the total expected other cooperators would be (N-1)*p_cooperate + causal_impact. Similarly, if you don't cooperate, you avoid the cost but also lose the causal impact. But note: the causal impact might be on a different set of agents (not necessarily the reference class). We have to be careful.

  ### Step 7: Make a Decision
  - **What to do**: Compare the expected net benefits. If E[Net|coop] > E[Net|not], then cooperate; else, don't. If they are close, then consider other factors (like fairness, long-term reputation, etc.) but note that we cannot coordinate.

  ### Step 8: Human Judgment
  - **What to do**: If at any step the answer is unclear or the procedure is too complex, or if the decision hinges on factors that are not quantifiable (like ethical obligations), then the human must make a judgment call. The procedure stops and the pharmacist decides based on their own values.

  ### Run the Procedure on Two Examples

  #### Example 1: Keeping the money-losing compounded pediatric suspension
  - **Practice**: Continue to compound a pediatric suspension that is sold at a loss. The benefit: maintaining a regional referral network and inspector familiarity. Threshold: at least 50 of the 250 pharmacies must do it to keep the network viable. Cost to you: $5,000/year. Benefit to you if threshold met: $10,000/year (due to referrals and reduced errors). If threshold not met, benefit is $0.
