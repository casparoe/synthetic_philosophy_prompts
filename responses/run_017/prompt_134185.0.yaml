answer: |-
  Below is a decision procedure designed for independent pharmacists to evaluate costly collective practices, incorporating evidential reasoning in "large worlds" while avoiding coordination. It's structured as sequential steps (with clear stopping points), uses plain language, and addresses your specified challenges. It should take <30 minutes to run, requires no philosophy background, and includes safeguards against manipulation. Two examples are analyzed at the end.

  ---

  ### **Decision Procedure: 8-Step Framework**
  **Key Principle**: Your action is *evidence* about what similar others will do (not a *cause* of their actions). We avoid coordination by treating your choice as information about the world, not a commitment tool.

  #### **Step 1: Define the Practice and Threshold**
  - **Task**: Specify:  
    (a) The practice (e.g., "Keep making pediatric suspension at a $5k annual loss"),  
    (b) Threshold for success (e.g., "50+ pharmacies must participate"),  
    (c) Your cost if you participate (C),  
    (d) Your benefit if threshold is met (B).  
  - **Stop if**: Threshold, C, or B are undefined or speculative.  
  - **Why**: Ensures clarity. Proceed only if all are quantifiable.

  #### **Step 2: Establish the Reference Class**  
  - **Task**: Identify "relevantly similar" pharmacies using **objective, pre-existing traits** (e.g., "independent pharmacies in rural counties," "stores with pediatric specialists," "under 3 staff pharmacists"). *Do not* use traits influenced by the decision (e.g., "pharmacies that care about children").  
  - **Fix the class upfront**: Write down the class *before* analyzing your action’s evidence.  
  - **Handle edge cases**:  
    - **Class too small (<5 agents)**: Widen by removing *one* least-relevant trait (e.g., drop "rural" but keep "independent"). If still small, **stop—evidential reasoning fails**. Use Step 7 (causal only).  
    - **Class too heterogeneous**: If broadening weakens correlation, use the **smallest class with >10 agents** where members share >80% of your defining traits.  
    - **Only "me" in class**: **Stop—evidential reasoning fails** (no "similar others").  
  - **Why**: Prevents self-serving class manipulation. Large/N homogeneous classes yield better evidence.

  #### **Step 3: Estimate Base Cooperation Rate (Prior)**  
  - **Task**: Estimate the % of the reference class *likely to cooperate without your influence*. Use:  
    - Data from past similar decisions (e.g., "60% adopted last year’s transparency standard"),  
    - If no data, default to 40% (conservative; assumes inertia/self-interest dominates).  
  - **Stop if**: No past data and no defensible estimate. Proceed only if you have a number.  
  - **Why**: Anchors the evidential update. 40% default avoids over-optimism.

  #### **Step 4: Calculate Evidential Effect**  
  - **Task**: Compute how your action updates the estimated cooperation rate:  
    - If you cooperate, new rate = `min(100%, base rate × 1.5)`  
    - If you don’t cooperate, new rate = `max(0%, base rate ÷ 1.5)`  
    *(Note: 1.5x is a heuristic for "large worlds"; adjust to 1.2x if class <20 agents)*.  
  - **Why**: Your choice signals the "type of world" you’re in. Cooperating suggests a world where cooperation is more likely (and vice versa). The multiplier adjusts for uncertainty.

  #### **Step 5: Add Causal Effects (If Any)**  
  - **Task**: Estimate causal impacts *separately*:  
    - **Visibility**: Could your action directly influence others? (e.g., "If I post prices, 2 nearby stores might copy me"). Quantify extra cooperators caused.  
    - **Do not double-count**: Causal effects are *additive* to evidential effects (e.g., "My cooperation suggests 60% of class will join + my visibility adds 2 extra").  
  - **Stop if**: Causal effects are speculative (e.g., no past examples of imitation).  
  - **Why**: Isolates "manipulating the world" (causal) from "reading the world" (evidential).

  #### **Step 6: Compute Net Benefit**  
  - **Task**: Calculate expected value:  
    - **If you cooperate**:  
      `Net = –C + B × P(success | you cooperate)`  
    - **If you don’t cooperate**:  
      `Net = 0 + B × P(success | you don’t cooperate)`  
    - **P(success) formula**:  
      - Expected cooperators = `(Reference class size × updated rate) + causal cooperators`  
      - `P(success) = 1` if expected cooperators ≥ threshold  
      - `P(success) = 0.5` if within 10% of threshold  
      - `P(success) = 0` if expected cooperators < threshold  
  - **Why**: Simple threshold approximation avoids complex probability math.

  #### **Step 7: Decide**  
  - **Task**: Compare net benefits:  
    - If `Net(cooperate) > Net(not)`, **participate**.  
    - If `Net(cooperate) < Net(not)`, **opt out**.  
    - If difference < 20% of C, **undecided**; use Step 8.  
  - **Why**: Clear economic criterion.

  #### **Step 8: Human Judgment (Values Tiebreaker)**  
  - **Task**: If undecided or evidential steps failed, ask:  
    - "Would I regret this if no one followed?" (Self-respect test)  
    - "Does this align with my pharmacy’s mission?" (Values test)  
  - **Stop here**: This step is subjective and final.  
  - **Why**: Captures non-utilitarian factors when math is inconclusive.

  ---

  ### **Example Analyses**
  #### **Case 1: Money-Losing Pediatric Suspension**  
  - **Setup**:  
    - Practice: Lose $5k/year to make suspension.  
    - Threshold: 50/250 pharmacies needed.  
    - Benefit (B): $15k/year if successful (reputation, referrals).  
    - Reference class: 200 pharmacies with pediatric focus (pre-defined).  
    - Base rate: 30% (from past similar choices).  
    - Causal effects: None (decision not visible).  

  - **Procedure**:  
    1. Step 1: Defined.  
    2. Step 2: Class = 200 (valid).  
    3. Step 3: Base rate = 30%.  
    4. Step 4:  
       - If cooperate: New rate = min(100%, 30% × 1.5) = 45%.  
       - If don’t: New rate = max(0%, 30% ÷ 1.5) = 20%.  
    5. Step 5: No causal effects.  
    6. Step 6:  
       - If cooperate: Expected cooperators = 200 × 45% = 90 ≥ 50 → P(success)=1.  
         Net = –$5k + $15k × 1 = **$10k**.  
       - If don’t: Expected cooperators = 200 × 20% = 40 < 50 → P(success)=0.  
         Net = $0 + $15k × 0 = **$0**.  
    7. Step 7: $10k > $0 → **Cooperate**.  

  - **Outcome**: Clear participation signal. Evidential effect shows your choice is pivotal.

  #### **Case 2: Transparent Cash Prices**  
  - **Setup**:  
    - Practice: Post real prices (cost: $8k/year in lost margins).  
    - Threshold: 100/250 pharmacies needed to shift patient behavior.  
    - Benefit (B): $12k/year if successful (volume increase).  
    - Reference class: 250 pharmacies (all alliance members).  
    - Base rate: 70% (high, from industry trends).  
    - Causal effects: Your visibility causes 2 nearby stores to copy you.  

  - **Procedure**:  
    1. Step 1: Defined.  
    2. Step 2: Class = 250 (valid).  
    3. Step 3: Base rate = 70%.  
    4. Step 4:  
       - If cooperate: New rate = min(100%, 70% × 1.5) = 100%.  
       - If don’t: New rate = max(0%, 70% ÷ 1.5) = 47%.  
    5. Step 5: Causal cooperators = +2 if you participate.  
    6. Step 6:  
       - If cooperate: Expected cooperators = (250 × 100%) + 2 = 252 ≥ 100 → P(success)=1.  
         Net = –$8k + $12k × 1 = **$4k**.  
       - If don’t: Expected cooperators = 250 × 47% = 117.5 ≥ 100 → P(success)=1.  
         Net = $0 + $12k × 1 = **$12k**.  
    7. Step 7: $4k < $12k → **Do not cooperate**.  

  - **Outcome**: Free-ride! High base rate means success is likely without you. Your causal impact is too small to justify $8k cost.  
  - **Why you won’t like this**: Recommends free-riding despite ethical appeal of transparency. Math dominates values here.

  ---

  ### **When the Procedure Works (and When It Doesn’t)**  
  - **Reliable when**:  
    - Reference class is objective/homogeneous (Step 2).  
    - Base rates exist (Step 3).  
    - Causal effects are small/quantifiable (Step 5).  
  - **Misfires when**:  
    - Thresholds are vague (Step 1 fails).  
    - No valid reference class (Step 2 stops).  
    - High causal noise (e.g., rumors force "double-counting").  
  - **Human judgment needed (Step 8)**:  
    - When net benefits are close (±20% of C).  
    - When values (ethics, identity) outweigh economics.  
    - When "existential risk" isn’t captured by B (e.g., small store facing closure).  

  This procedure forces systematic thinking while avoiding coordination. It *will* sometimes recommend defection (as in Case 2), but that’s a feature—not a bug—of evidence-based reasoning. Use Step 8 to inject humanity when math clashes with mission.
