        E[Net|not] = 0 + 10000 * 0.5 = 5000.
        Then E[Net|coop] = 5000, so it's a tie.

  In the tie, we go to Step 8: human judgment. The pharmacist might consider the ethical obligation to pediatric patients.

  #### Example 2: Adopting posted transparent cash prices
  - **Practice**: Post your real cash prices (without the usual obfuscation) to help patients compare. Threshold: 100 pharmacies must do it to create a market where patients trust that they can shop around. Cost to you: you might lose some high-margin business when patients see your prices are higher, say $8,000/year. Benefit: if threshold met, you gain from increased trust and volume: $12,000/year. If threshold not met, benefit=0.
