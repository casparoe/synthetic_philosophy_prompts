  - **Step 3**: Reference class. Objective: independent pharmacies in the state that serve pediatric patients. Say there are 200 such pharmacies. We'll use this class of 200.
  - **Step 4**: Base rate: without conditioning, what is the probability that a pharmacy in this class will cooperate? We have no data. Use neutral prior: p=0.5. Then, if you cooperate, update: using the heuristic, p_cooperate = min(1, 1.5 * 0.5) = 0.75. If you don't cooperate, p_not = max(0, 0.5 / 1.5) ≈ 0.333.
