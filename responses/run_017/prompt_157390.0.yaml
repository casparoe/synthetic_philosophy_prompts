prompt: |-
  I help run a mid-sized nonprofit that funds after-school tutoring programs in a handful of cities, and I'm currently the person drafting the one-page guidance our program directors get about which outcome numbers they're allowed to promise funders. So I keep running into Goodhart-flavoured failure in an annoyingly practical form: we commit to a number, the number gets worked on, and afterwards nobody can tell whether anything actually improved. I'm also in a desultory reading group on specification gaming in machine learning, and the two conversations don't feel like they're about the same thing even though everyone recites the same slogan about a measure ceasing to be good once it becomes a target. Before I commit to any framework, I want the spec: what would a theory of which measures survive being targeted have to get right? Give me the desiderata list, each with the case or consideration behind it, and mark which are non-negotiable and which are really just what one camp wants a theory to deliver.

  A few things I want you to take a stand on, because I suspect the shape of the list is the actual result. Does the theory have to cover "selection without a target" — a quantity nobody is optimizing against that still degrades because survival or publication selects on something correlated with it (think reported effect sizes in a literature, or the average outcome among programs that make it past a funding cut)? Or is an agent aiming at the measure part of the definition, so that case belongs to some other theory? Does it have to respect the distinction between a metric that merely evidences the thing we care about (test-score gain as evidence of learning) and one that partly constitutes it (share of enrolled students who actually completed the course, where completion is part of what the program is for), and explain why pushing on the second kind can be fine while pushing on the first corrupts? Should adequacy require it to predict the shape of the failure — e.g. that distortion bunches up right at a funding cliff rather than spreading smoothly — or is "it breaks somewhere" enough? Does it need to handle chains, where you bolt on a second metric or an audit to catch gaming of the first and the audit becomes the new target? And is the four-way taxonomy that gets passed around online (causal / adversarial / extremal / regress-to-the-mean-ish) carving at the joints, or is it a prejudice of one camp?

  Two more constraints from my situation. I need this ex ante: I have to pick metrics before anything is deployed, so a theory that only diagnoses failures after the fact is useless to me — tell me whether that's a fair desideratum or an unfair demand on the subject matter. And whatever the list is, it must not collapse "the number moved because people responded to the incentive in a way that bypassed the target" into "the number moved because the target moved," since for us those look identical in the data. Please flag any pair of desiderata you think can't be jointly satisfied (I have a hunch full generality and ex ante specificity are in tension, and that covering no-optimizer cases fights with any mechanistic story about agents), and say which single requirement knocks out the most popular framings — a couple of sentences each on the slogan version, the economics-of-incentives version, and the ML reward-hacking version is plenty; I care much more about the criteria than the scorecard.
reasoning: |-
  Okay, let me start by unpacking the user's query. They run a nonprofit funding after-school tutoring programs and are struggling with Goodhart's Law in their outcome metrics. They need a theory to help choose metrics that won't degrade when targeted. They also mention a reading group on specification gaming in ML, noting the disconnect between theory and practice.

  First, I need to identify their core request: desiderata for a theory that predicts which measures survive being targets. They want criteria that distinguish between metrics that evidence vs. constitute desired outcomes, handle ex ante prediction, and avoid conflating incentive responses with metric shifts. 

  The user’s explicit needs include understanding non-negotiable vs. negotiable criteria, whether the theory must cover selection without explicit targeting, and if it should predict failure modes. They also mention chains of metrics and audits, and critique existing taxonomies. Constraints: ex ante applicability and distinguishing between causation types in data.

  Deeper needs might involve practical implementation. They need actionable frameworks, not just academic theories. Their frustration with post-mortem analyses suggests they need preventative solutions. The mention of ML specification gaming indicates they seek interdisciplinary insights but find current theories lacking integration.

  Key considerations:
  - **Selection without targeting**: The user observes metrics degrading without explicit optimization, like survival bias in programs. Should the theory include this? I think yes, because excluding it limits real-world applicability. Non-negotiable point.
  - **Evidence vs. Constitutive metrics**: They highlight completion rates (constitutive) vs test scores (evidence). The theory must explain why the former resists distortion. Non-negotiable.
  - **Predicting failure modes**: They need to know if predicting specific distortions (like cliffs) is essential. Probably negotiable; "it breaks" might suffice if mechanisms are understood.
  - **Metric chains**: Audits becoming new targets. Essential to include as it's a common real-world issue. Non-negotiable.
  - **Existing taxonomies**: They question if causal/adversarial/etc. categories are useful. The theory should transcend these, integrating them into a cohesive framework.

  Constraints:
  - **Ex Ante Prediction**: Crucial. Theories only diagnosing failure post-hoc are useless. Non-negotiable.
  - **Avoiding conflation**: Must distinguish between metric shifts from gaming vs. genuine improvement. Vital for data interpretation. Non-negotiable.

  Potential conflicts:
  - **Generality vs. Specificity**: A theory covering all Goodhart variants might lack actionable details for specific contexts. Need to balance.
  - **No-Optimizer Cases vs. Mechanistic Explanation**: Including selection without agents might conflict with agent-based models. The theory should accommodate both by separating mechanisms.

  Knockout criteria for existing framings:
  - **Slogan Version**: Fails ex ante prediction and lacks mechanisms. Knocked out by Desideratum 1.
  - **Economics of Incentives**: Focuses on effort substitution but ignores non-agent selection. Struggles with Desideratum 4.
  - **ML Reward Hacking**: Addresses adversarial gaming but not constitutive metrics or no-optimizer cases. Fails Desideratum 7.

  The user’s unspoken need is a practical, implementable framework that bridges theory and practice, avoiding academic pitfalls while providing clear guidance for metric selection in their nonprofit context.
answer: |-
  Here's a desiderata list for a theory of "measures that survive targeting," grounded in your practical needs and explicit constraints. I'll take clear stands on your questions, flag tensions, and identify knockout criteria for popular framings. The goal is a theory that helps you **select metrics ex ante** and **avoid conflating gaming with genuine progress** in observed data.

  ---

  ### **Core Desiderata for a Theory of Robust Metrics**

  1.  **Non-Negotiable: Ex Ante Predictive Power**  
      *   **What it must get right:** The theory must provide actionable guidance *before* metric deployment, predicting *which specific measures* will resist distortion when incentivized. It must rule out metrics prone to significant gaming or selection effects.  
      *   **Why:** Your core constraint. Post-hoc diagnosis ("we see gaming now") is useless for drafting guidance. Theories must identify failure modes *prospectively*.  
      *   **Knockout Impact:** Eliminates the pure "slogan" version of Goodhart's Law ("when a measure becomes a target...") and descriptive historical case studies. They lack predictive machinery.

  2.  **Non-Negotiable: Distinguish Causal Pathways in Observed Data**  
      *   **What it must get right:** The theory must provide frameworks or tests to differentiate between:  
          (a) *Gaming/Corruption:* The metric improved *because* agents bypassed the true goal.  
          (b) *Genuine Improvement:* The metric improved *because* the true goal improved.  
          (c) *Exogenous Shift:* The metric improved due to external factors unrelated to the incentive.  
      *   **Why:** Your data shows metric movement, but you can't tell why. Collapsing (a) and (b) renders the theory useless for evaluation and learning. Requires attention to *mechanisms* and *counterfactuals*.  
      *   **Knockout Impact:** Eliminates naive correlational analyses or theories that treat all metric movement under incentives as suspect by default.

  3.  **Non-Negotiable: Incorporate "Selection Without a Target" (NO OPTIMIZER REQUIRED)**  
      *   **What it must get right:** The theory *must* cover cases where metric degradation occurs through selection effects (e.g., survival bias, publication bias) *without* any conscious agent optimizing against the metric.  
      *   **Why:** Your examples (reported effect sizes, programs surviving cuts) are critical failure modes in nonprofits/research. Excluding them creates a fatal blind spot. Selection is a core Goodhart mechanism.  
      *   **Tension:** Conflicts with purely *mechanistic* "agent-response" theories. Resolution: The theory must encompass *both* agent-driven gaming *and* systemic selection pressures, likely through a unified "pressure on the measure" framework.

  4.  **Non-Negotiable: Differentiate "Evidential" vs. "Constitutive" Metrics**  
      *   **What it must get right:** The theory must explain *why* targeting "constitutive" metrics (e.g., % course completion - where completion *is* part of the goal) is often robust, while targeting "evidential" metrics (e.g., test score gains - *evidence* of learning) corrupts. It must provide criteria to classify metrics.  
      *   **Why:** Your practical need. Conflating them leads to banning *all* targets, which is unsustainable. The theory must justify when/why pushing on a measure is acceptable.  
      *   **Mechanism:** Constitutive metrics have minimal "causal distance" from the goal; improving them *directly* improves the goal. Evidential metrics have distance; effort can shift to paths that move the metric *without* moving the goal.

  5.  **Negotiable (But Highly Desirable): Predict Failure Mode Shape**  
      *   **What it should ideally get right:** Predicting *how* failure manifests (e.g., threshold effects/"cliffs," smooth degradation, substitution patterns) is valuable for detection and design.  
      *   **Why:** Helps design audits, tiered incentives, or identify early warnings. Knowing *it will break* is essential (Desideratum 1), knowing *how* is pragmatic.  
      *   **Why Negotiable:** Precise prediction may require domain-specific details beyond a general theory. "It breaks somewhere" might suffice for initial metric rejection.

  6.  **Non-Negotiable: Handle "Metric Chains" & Audit Gaming**  
      *   **What it must get right:** The theory must model the dynamics when a secondary metric or audit is added to catch gaming of the primary metric, and predict when this secondary measure itself becomes corruptible.  
      *   **Why:** Your reality ("bolting on an audit"). Naive fixes often backfire. The theory must inform sustainable monitoring design, not just initial metric choice.  
      *   **Implication:** Requires concepts like "vulnerability cascades" or "monitoring overhead."

  7.  **Negotiable: Transcend the "Four-Way Taxonomy"**  
      *   **What it could get right:** While causal/adversarial/extremal/regressive categories describe *symptoms*, a robust theory should focus on underlying *mechanisms* (e.g., causal structure, cost functions, information asymmetry, selection pressure) that *generate* these symptoms.  
      *   **Why:** The taxonomy is descriptive, not predictive. It doesn't reliably tell you *ex ante* which metric will suffer which failure. A mechanistic theory is more actionable.  
      *   **Stand:** The taxonomy doesn't carve reality at the joints; it's a useful heuristic for diagnosis, not a foundation for prediction. Your focus on constitutive vs. evidential metrics is more fundamental.

  ---

  ### **Tensions Between Desiderata**

  1.  **Full Generality vs. Ex Ante Specificity:** A theory covering *all* Goodhart manifestations (agent gaming, selection bias, metric chains) risks being too abstract for concrete metric selection. **Resolution:** The theory must provide *domain-agnostic criteria* (e.g., causal distance, susceptibility to manipulation/selection) that can be applied contextually.
  2.  **No-Optimizer Cases vs. Mechanistic Explanation:** Incorporating selection effects without agents conflicts with theories relying solely on rational agent models. **Resolution:** The theory must explicitly include *system dynamics* (selection pressures, equilibrium states) alongside *agent models*. Think "ecology of measures."
  3.  **Predicting Specific Failure Modes vs. Feasibility:** Predicting exact shapes (cliffs vs. smooth) may require granular simulation, conflicting with usability. **Resolution:** Focus prediction on *likelihood* and *general class* of failure (e.g., "high risk of threshold manipulation" or "vulnerable to effort substitution") based on metric properties.

  ---

  ### **Knockout Criteria for Popular Framings**

  *   **The Slogan Version ("Measure ceases to be good..."):**  
      **Knocked out by:** Desideratum 1 (Ex Ante Prediction) & Desideratum 2 (Distinguish Pathways). It's purely descriptive, offers no predictive power, and provides no tools to distinguish gaming from genuine improvement in your data. It's a warning label, not a theory.

  *   **Economics of Incentives (Principal-Agent Models, Effort Substitution):**  
      **Knocked out by:** Desideratum 3 (Selection Without Target) & partially by Desideratum 7 (Constitutive Metrics). It excels at modeling agent gaming (Desiderata 2, 4, 6) but ignores systemic selection effects common in nonprofits/research. It also struggles to explain why targeting some metrics (constitutive) *doesn't* corrupt, often treating all metrics as proxies vulnerable to substitution.

  *   **ML Reward Hacking / Specification Gaming Framings:**  
      **Knocked out by:** Desideratum 3 (Selection Without Target) & Desideratum 4 (Evidential vs. Constitutive). ML theories focus intensely on adversarial agents exploiting loopholes in a specified reward function (Desiderata 2, 6). However, they largely ignore non-agent selection effects and lack a robust concept of "constitutive" metrics – the reward function *is* the target by definition, making the evidential/constitutive distinction moot in pure RL. They are powerful for *some* agent-driven gaming but miss critical aspects of your real-world context.

  ---

  ### **The Shape of a Useful Theory for You**

  A theory meeting your specs would look like this:

  1.  **Foundation:** Focuses on the **causal structure** linking the measure, agent actions, the true goal(s), and environmental factors. Uses this to define **causal distance** (Desideratum 4).
  2.  **Scope:** Explicitly incorporates **system dynamics** generating **selection pressures** alongside **agent optimization models** (Desideratum 3).
  3.  **Core Tool:** Provides a **vulnerability assessment framework** evaluating metrics on dimensions like:
      *   *Manipulability:* How easily can agents directly distort the measure without affecting the goal? (e.g., teaching to the test).
      *   *Susceptibility to Selection:* How sensitive is the measure to selective survival/attrition/reporting? (e.g., creaming students).
      *   *Causal Distance:* Is the measure constitutive or evidential? What's the pathway length/robustness?
      *   *Robustness to Cascades:* If audited, how vulnerable is the audit to becoming the new target?
  4.  **Output:** For any candidate metric, the framework **predicts the dominant failure risk(s)** (gaming, selection, regression) and **estimates severity** ex ante (Desideratum 1), enabling comparison and rejection of bad metrics.
  5.  **Diagnostic:** Provides **signatures or tests** (e.g., using auxiliary data, unexpected correlations, discontinuities) to **distinguish gaming from genuine progress** in observed outcomes (Desideratum 2).

  This isn't a single existing theory; it's a synthesis needing elements from causal inference, incentive design, evolutionary theory, and complex systems. Your focus on **causal structure** and **selection pressures** is the critical starting point. Prioritize metrics with minimal causal distance and low susceptibility to manipulation/selection. Avoid any metric primarily serving as *evidence* of an outcome unless paired with robust constitutive checks or audits designed using the same vulnerability framework.
