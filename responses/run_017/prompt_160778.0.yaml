  So the safest option is taking both: guaranteed $5,000 plus possible $60,000. If they take only the sealed one, high chance of $0 if Ray predicted they'd grab both. Taking only cash gives $5,000 but no shot at $60,000. Taking both maximizes the minimum gain and has upside potential. 

