  Now, let's describe the leaves:

  Leaves:

  L1. **Incorrigibilism**: 
     - Committed to: Introspective reports about the gross presence or absence of current experiences (like strong pain) are infallible. However, for other types of mental states (like faint sensations or beliefs), the authority of introspection may be limited or denied.
     - How contested: Highly contested. Many philosophers reject incorrigibility due to evidence of introspective errors even for pain (e.g., under distraction).

  L2. **Inner-sense/Perceptual model**: 
     - Committed to: Introspection is a fallible faculty similar to perception, which can be trained (improving discriminability) and calibrated. It is subject to measurement disturbance (attending to an experience may change it) and other failure modes, but is generally reliable for various channels including experiences and beliefs.
     - How contested: Moderately contested. It is a common view but faces challenges from transparency theories (for beliefs) and confabulation data.

  L3. **Transparency/Agentialism**: 
     - Committed to: For self-ascription of beliefs and other propositional attitudes, introspection is not a matter of detecting an internal state but of making up one's mind (looking outward to the world). For other channels (like experiences), it may allow a perceptual model, but the core of first-person authority for attitudes is agential, not detective.
     - How contested: Contested, especially in how it handles cases of self-deception or unconscious beliefs.

  L4. **Self-interpretation/Confabulation**: 
     - Committed to: Reports about the causes of one's own behavior (and sometimes other mental states) are often the product of self-interpretation (inference from behavior, context, and cultural narratives) rather than direct introspective access, and are frequently wrong (confabulation).
     - How contested: Well-supported by psychological experiments (e.g., Nisbett and Wilson), but the extent to which it generalizes is contested.

  L5. **Global pessimism**: 
     - Committed to: Introspection is unreliable even for basic states like the presence of pain. Errors can occur due to inattention, confusion, or other factors.
