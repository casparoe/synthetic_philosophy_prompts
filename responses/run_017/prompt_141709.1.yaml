answer: |-
  Phase diagnosis: Verrania is deep in the **crisis phase**, with elite overproduction as the binding constraint. The tripling of credentialed aspirants against near-static elite positions created combustible factionalization *before* fiscal erosion became acute. Wage immiseration now functions as an accelerant, not the primary driver.  

  **25-year forecast (year 220–245):**  
  - **Probability >80%:** Full state breakdown via civil war (factional conflict escalating to mass mobilization) within 10–15 years. Debt service exceeding 30% of revenue will trigger sovereign default or hyperinflation (central bank enabling deficits). This collapses state capacity, allowing revolts to coalesce.  
  - **Magnitude:** Population decline of 15–20% from violence/famine; elite ranks purged by 40–60%; real wages bottoming out 50% below peak before partial recovery.  
  - **Falsification condition:** If elite aspirant numbers *sharply reverse* (e.g., −30% via credential reform/plague) *and* wages stabilize within 5 years, without fiscal collapse. Absent that, crisis is structurally locked in.  

  **Addressing non-agrarian objections:**  
  1. **"Demographic engine off"**: Population stagnation *doesn’t* negate immiseration. Urbanization concentrates surplus labor, depressing wages despite flat demographics. Real wages fell 35% *before* population plateaued (years 110–140)—driven by labor oversupply, not Malthusian scarcity. Credential inflation *is* the new "land": finite elite positions gatekeep status, forcing aspirants into predatory competition that hollows out the professional class.  

  2. **"Fiscal-political story in disguise"**: The state’s debt spiral is *symptomatic*, not causal. Why can’t it tax or reform? Because swollen elites (0.8% households, but richest 0.1% tripling incomes) capture fiscal policy. Credentialed factions block wealth taxes to protect their status. Central bank monetization? A stopgap that inflates asset prices (benefiting entrenched elites) while eroding real wages—*deepening* inequality. Fiscal collapse is the endpoint of elite overproduction fragmenting the state’s coalition.  

  **Core mechanism intact**: Elite overproduction → intra-elite conflict → state fragility → mass rebellion. Urban professions replace manors, credentials replace inheritances, but the dynamic is identical: too many elites fighting for shrinking surplus destabilizes the system. Verrania proves the model adapts; removing ploughs doesn’t remove scarcity.
