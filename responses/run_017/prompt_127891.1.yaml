  So the trader will try to extract as many chips as possible by offering swaps. But how? They can offer a swap from A to B at a price p. The chooser will accept if p is less than or equal to their recorded willingness to pay for that swap. But the trader doesn't have to charge 1 chip; they can charge up to the willingness to pay. But then the trader might charge exactly the willingness to pay and get that many chips. But then they can only do one swap per type? Because after the swap, the chooser is holding the new option.

  But if the preferences are cyclic, the trader can offer a sequence: X->Y at price w_XY, then Y->Z at price w_YZ, then Z->X at price w_ZX. Then the chooser ends up back at X and has paid w_XY + w_YZ + w_ZX chips. The trader gets all that. And the chooser is back where they started. That is the money pump.

  But note: if the chooser is sophisticated, they might refuse the first offer? But in this case, the trader can charge the full willingness to pay, so the chooser is exactly indifferent. So they might accept. But then they are at Y and have paid w_XY. Now the trader offers Y->Z for w_YZ: the chooser is indifferent, so they might accept. Then they are at Z and have paid w_XY+w_YZ. Then the trader offers Z->X for w_ZX: indifferent, so they accept and are back at X, having paid the full amount.

  The trader extracts w_XY+w_YZ+w_ZX.

  But if the preferences are transitive, then the cycle doesn't occur. For example, if X>Y>Z and then X>Z, then the chooser might be willing to pay to go from X to Y and from Y to Z, but not from Z to X? Or if they are at Z, they might not want to go back to X? So the trader cannot pump them back to X.

  Therefore, the trader can extract the most from an intransitive chooser by pumping them in a cycle.

  In the activity, the trader can offer any swap at any time, at any price. The chooser can accept or decline. The chooser starts with X and 10 chips (we give more chips now). The trader's goal is to extract as many chips as possible from the chooser in 5 minutes.

  We then see that traders paired with intransitive choosers extract more than those with transitive ones.

  But how do we ensure some students have transitive preferences? The scoring rule we used might lead to a cycle for most, but not all? Some might break the cycle by using a different rule. For example, if a student uses a lexicographic order on Movies, then:
  X:100, Y:60, Z:80 -> so X>Z>Y. So they would pay to go from Y to Z and from Z to X, but not from X to Y? And they would not want to go from X to Y. So their preferences are transitive.

  So we will have both types.

  Now, the timeline for 80 minutes:

  0-5 min: Introduction to the activity. Distribute handouts. Explain the streaming services and the comparison rule. Emphasize that chips are valuable (each chip = one entry in a draw for a $10 gift card at the end of class). Do not mention anything about cycles or money pumps.

  5-15 min: Students work on the handout: record their maximum willingness to pay (in whole chips) for each of the three swaps. Collect the handouts.

  15-20 min: Explain the market rules for Phase A: 
  - Everyone starts with StreamFast and 3 chips.
  - The market will open exactly 3 times.
  - Each time the market opens, you may choose to swap your current service for another service that you prefer to your current one, by paying 1 chip to the house (instructor). 
  - You may only swap to a service that you prefer to your current one.
  - After you swap, you have the new service and one fewer chip.
  - If you don't want to swap, you can pass.

  Run Phase A: Open the market three times. Each time, students who want to swap raise their hand, and the instructor records (or they come to the front to swap?).

  20-25 min: After Phase A, ask students to record their final service and chip count.

  25-30 min: Explain Phase B: 
  - Now, the market will stay open indefinitely. 
  - You start again with StreamFast and 3 chips (reset).
  - The same swap rules apply.
  - The market will close at an unannounced time.

  Run Phase B: Open the market, and then after a while (when you see that some students have done 0, 1, 2, or 3 swaps) close it unexpectedly. Say after 3-5 minutes, or when activity dies down.

  30-35 min: After Phase B, record final service and chip count.

  35-45 min: Split the class: half as choosers (keep their own preferences and start with X and 10 chips), half as traders. Redistribute the record sheets: each trader gets one record sheet from a chooser (not their own). Pair each trader with a chooser.

  45-65 min: Trader phase: 
  - Traders have 5 minutes to offer swaps to their chooser. 
  - A trader can offer a swap from the chooser's current service to any other service at a price (in chips) that the trader sets. 
  - The chooser can accept or reject.
  - If accepted, the chooser pays the price to the trader and swaps to the new service.
  - The goal of the trader is to extract as many chips as possible.
  - The goal of the chooser is to maximize their own outcome (service and chips).

  65-75 min: Debrief.

  Debrief points:
  - In Phase A, if you did all three swaps, you ended up back at StreamFast with 0 chips. But you started with StreamFast and 3 chips. So you lost 3 chips. 
  - Why did you do the swaps? At each step, you preferred to swap. 
  - But if you had looked ahead, would you have done differently? 
    - If you take swap1, then in swap2 you will want to swap again, and in swap3 again. So you end up pumped.
    - So you might decide to not take any swap. But then you have StreamFast and 3 chips. 
    - But at the first swap, you prefer ViewMax to StreamFast, and you recorded that you are willing to pay up to [say] 2 chips for that swap. Paying 1 chip is a bargain. So you should take it. But then you are on a path to being pumped.
    - So the sophisticated agent might take only the first swap and then stop? But at the second swap, they are at ViewMax and have 2 chips. They prefer WatchAll to ViewMax, and are willing to pay more than 1 chip, so they would want to swap again. So they cannot commit to stop. Therefore, they are forced to either take no swaps or take all three? 
    - This is the sophisticated choice: they foresee that if they take the first swap, they will take the next two, so they prefer to take none. But then they are not acting on their preferences at the first node? 
  - In Phase B, without a known endpoint, what should you do? 
    - If you take one swap, you are better off than at the start. 
    - Then you might take another, and another, and then you are back at the start and down 3 chips. But then you are in the same position as the start, and you might do it again? But you only have 3 chips. So you stop at (X,0). 
    - The outcomes: 
        0 swaps: (X,3)
        1 swap: (Y,2)
        2 swaps: (Z,1)
        3 swaps: (X,0)
    - And by your own preferences, you prefer 1 to 0, 2 to 1, 3 to 2, and 0 to 3. So there is a cycle: no best policy.
    - The greedy policy (always swap if you prefer the other and the cost is less than your willingness) leads to the worst outcome (3 swaps).
  - In the trader phase, the traders with intransitive choosers could pump them in a cycle and extract many chips. Traders with transitive choosers could only extract chips for one or two swaps.

  The moral: with cyclic preferences, there is no policy that your own preferences single out as best. So if rationality is diachronic, it must demand something else: commitment, or resolute choice.

  Frank list of what will go wrong:

  1. Some students may refuse to trade at all in both phases, to avoid losing chips. 
     - How to handle: That's okay. It will show in the debrief that they avoided the pump by not trading. But they also missed out on improving their service.

  2. Some students may treat chips as worthless. 
     - How to handle: Emphasize the value of chips (draw for gift card). Also, at the end, actually do the draw.

  3. Some students may have transitive preferences. 
     - How to handle: That's good for the trader phase: we can compare extraction between transitive and intransitive.

  4. Some students may conclude that the lesson is never to trade with the house. 
     - How to handle: In the debrief, point out that in the trader phase, the house was another student who might exploit you, but in the first phase, the house was just charging a fixed fee. Also, if you have transitive preferences, you might benefit from one swap.

  5. In the trader phase, some traders may not understand how to exploit. 
     - How to handle: Give a quick example: "If you know your chooser is willing to pay 2 chips to go from X to Y, you might offer that swap for 2 chips. Then once they are at Y, offer the next swap, etc."

  6. The comparison rule might not be followed by all. 
     - How to handle: Emphasize the rule clearly. Most should have the cycle.

  7. In Phase B, students might keep swapping indefinitely, but they only have 3 chips. So they stop after 3 swaps. That's fine.

  Honest note on what the activity cannot stage:

  The activity shows the problem of cyclic preferences and the lack of a best policy. However, it does not show the full philosophical debate between sophisticated and resolute choice. In sophisticated choice, the agent uses backward induction and ends up taking no swap in Phase A. In resolute choice, the agent commits to a plan (e.g., take one swap and then stop) and sticks to it. The activity can mention these, but it doesn't illustrate resolute choice in action because the students are not given a commitment mechanism. We will have to explain that in the next lecture.

  Now, the handout text:

  **Handout: Streaming Service Choice**

  You are choosing a streaming service for the next month. You care about three attributes:
  - Number of movies available
  - Number of TV series available
  - Number of exclusive shows available

  You will compare services pairwise. When comparing two services, prefer service A to service B if and only if service A is better than service B on at least two out of the three attributes.

  Service Options:

  - **StreamFast**  
    Movies: 100  
    TV Series: 80  
    Exclusive Shows: 60

  - **ViewMax**  
    Movies: 60  
    TV Series: 100  
    Exclusive Shows: 80

  - **WatchAll**  
    Movies: 80  
    TV Series: 60  
    Exclusive Shows: 100

  Record your maximum willingness to pay in chips (whole numbers) for the following swaps. Remember, each chip you have at the end gives you one entry in a draw for a $10 gift card.

  1. I would pay up to _____ chips to swap from StreamFast to ViewMax.
  2. I would pay up to _____ chips to swap from ViewMax to WatchAll.
  3. I would pay up to _____ chips to swap from WatchAll to StreamFast.

  **Timeline (80 minutes):**

  - 0-5 min: Distribute handouts, explain the streaming services and the comparison rule. Explain chips (each = one draw entry for $10 gift card).
  - 5-15 min: Students record their willingness to pay. Collect the handouts.
  - 15-20 min: Explain Phase A market rules (3 rounds, start with StreamFast and 3 chips, swap cost 1 chip to house, only swap to preferred service).
  - 20-25 min: Run Phase A: open the floor three times (each time, students who want to swap raise hand, pay 1 chip, and swap service).
  - 25-30 min: Students record final state (service and chips) for Phase A.
  - 30-35 min: Explain Phase B (indefinite rounds, reset to StreamFast and 3 chips, unannounced closing).
  - 35-45 min: Run Phase B (open floor; close after about 5 min or when activity wanes).
  - 45-65 min: Trader phase: 
    - Split class: half choosers (start with StreamFast and 10 chips), half traders.
    - Redistribute record sheets: each trader gets one chooser's sheet (not their own).
    - Pairs: trader offers swaps to chooser (trader sets price; chooser accepts or rejects). 
    - 5 minutes for trading.
  - 65-75 min: Debrief: 
    - Ask about outcomes in Phase A and B.
    - Show the cycle in preferences.
    - Discuss why they traded in Phase A and ended up worse.
    - Discuss the lack of a best policy in Phase B.
    - Discuss what traders discovered.
    - Introduce terms: money pump, transitivity, sophisticated vs resolute.
    - Moral: cyclic preferences lead to diachronic incoherence.
  - 75-80 min: Draw for gift card based on chips.

  **Debrief:**

  1. **Phase A Outcomes:** 
     - "Who ended up back at StreamFast with 0 chips? How did that happen?"
     - "At each swap, you thought you were making an improvement. But overall, you lost chips and ended up where you started."
     - "If you looked ahead, what could you have done? Some of you might have done nothing. But then you didn't get the improvement you wanted."

  2. **Sophistication:**
     - "If you are sophisticated, you foresee that taking the first swap leads to taking the next two, ending up worse off. So you take none. But then you are not acting on your current preference at the first node."

  3. **Phase B:**
     - "Without a known endpoint, what happened? Some of you did one swap and stopped. Some did two. Some did three. And some did none."
     - "By your preferences, one swap is better than none, two better than one, three better than two, but none better than three. So there is no best policy."

  4. **Trader Phase:**
     - "Traders with intransitive preferences could pump in a cycle and extract many chips. With transitive preferences, they could only get one or two swaps."

  5. **Moral:**
     - "The lesson is not that intransitive agents are shortsighted. It's that with cyclic preferences, there is no policy that your own preferences single out as best. So if rationality is diachronic, it must demand something else: planning, commitment, or a resolute approach that sticks to a plan."

  **Frank List of What Will Go Wrong:**

  1. **Refusal to trade:** Some students will not trade at all to save chips. In debrief, note that this avoids the pump but also avoids potential gains (if preferences are transitive, one swap might be good).

  2. **Chips as worthless:** Emphasize the gift card draw. Actually hold the draw.

  3. **Transitive preferences:** Some students might not have the cycle (e.g., if they break ties differently). Use this in the trader phase to show less extraction.

  4. **Lesson misinterpretation:** Some think "never trade with the house". Point out that in the trader phase, exploitation requires cyclic preferences.

  5. **Trader confusion:** Some traders might not know how to pump. Give a quick example: "Offer the swaps in a cycle at the recorded max price."

  6. **Time management:** Keep to the timeline strictly. Phase B might run long if trading is active; close after 5 minutes.

  7. **Pairing in trader phase:** Ensure each trader gets a random record sheet, not their own.

  **Honest Note:**

  The activity does not show how resolute choice (committing to a plan) can solve the problem, because we do not provide a commitment mechanism. We will discuss that in the next lecture.
answer: |-
  ### Diachronic Choice Activity: "Streaming Service Swap"

  **Objective**: Illustrate the diachronic challenges of cyclic preferences without upfront technical terms, leading students to experience the lack of a maximal choice policy.

  ---

  ### **Materials & Setup**
  - **Chips**: Each student starts with 3 chips. Chips are redeemable for tickets in a draw (1 chip = 1 ticket). Prize: $10 gift card.  
  - **Handout** (distributed at start; see full text below): Describes three streaming services (StreamFast, ViewMax, WatchAll) scored on movies, series, and exclusives. Includes a record sheet for swap values.  
  - **Trading tokens**: Cards labeled "Swap to [Service]" for market phases.  
  - **Timer** for phases.  

  ---

  ### **Handout Text**  
  **Streaming Service Choice**  
  *You are choosing a service for a free month. Compare services pairwise: Prefer Service A to Service B if A is better on at least two of three attributes.*  

  - **StreamFast**  
    Movies: 100 | Series: 80 | Exclusives: 60  
  - **ViewMax**  
    Movies: 60 | Series: 100 | Exclusives: 80  
  - **WatchAll**  
    Movies: 80 | Series: 60 | Exclusives: 100  

  **Record Sheet**  
  *What is the MAX chips (0,1,2,3) you’d pay to swap?*  
  1. StreamFast → ViewMax: \_\_\_ chips  
  2. ViewMax → WatchAll: \_\_\_ chips  
  3. WatchAll → StreamFast: \_\_\_ chips  

  *(Chips = tickets in a draw for a $10 gift card. You start with 3 chips.)*  

  ---

  ### **Timeline (80 Minutes)**  
  **0–10 min: Setup & Preferences**  
  - Distribute handouts. Explain: “Pick services based on the rule. Record swap values privately. Chips are real (draw tickets).”  
  - *Do not define terms or foreshadow the activity’s purpose.*  

  **10–15 min: Record & Collect**  
  - Students record swap values (ensure whole numbers 0–3). Collect handouts.  

  **15–25 min: Phase A (Fixed Rounds)**  
  - Rules: “Everyone starts with StreamFast and 3 chips. The market opens 3 times. Each time, you may swap to a service you prefer for 1 chip. No other trades.”  
  - Run three 2-minute trading rounds. In each, students call out swaps (e.g., “Swap to ViewMax!”), pay 1 chip to the house (instructor), and update their service.  
  - *Instructor records who swaps.*  

  **25–30 min: Reset & Prep for Phase B**  
  - Reset all to StreamFast and 3 chips.  

  **30–40 min: Phase B (Indefinite Rounds)**  
  - Rules: “Same swaps, but the market stays open until I close it. Closing time unannounced.”  
  - Open trading. Allow swaps (same cost/rule). Close market unexpectedly after 5–6 minutes (or when 50% have swapped ≥2 times).  

  **40–50 min: Trader Phase Setup**  
  - Split class: 8 choosers (keep roles), 8 traders.  
  - Redistribute record sheets randomly (traders get a chooser’s sheet).  
  - Traders’ goal: Extract max chips from chooser using their swap values.  
  - Choosers start with StreamFast and 10 chips (to allow more trades).  

  **50–65 min: Trader Phase**  
  - Rules: “Traders may offer swaps at any price. Choosers accept/reject. If accepted, chooser pays trader and swaps services.”  
  - Run 10-minute negotiation. Traders use swap values to price strategically (e.g., charge near max recorded value).  

  **65–80 min: Debrief**  
  - Guide discussion to reveal key insights (see below). Introduce terms only at the end.  

  ---

  ### **Debrief Script**  
  *(Link each insight to phase outcomes; use student experiences as evidence.)*  

  **1. Phase A Experience (10 min)**  
  - Ask: “Who swapped all three times? What did you end with?” (Most end with StreamFast and 0 chips—pumped.)  
  - Contrast: “Who refused a swap? Why?” (Some refuse first swap to avoid losses; others take one swap and stop.)  
  - **Key insight**: “If you took one swap, you got a service you preferred for 1 chip—and you’d already said you’d pay more for it. But if you took all three, you lost chips for no gain. Why did some of you take all three even though you knew there were three rounds?”  
    - Reveal: At each step, swapping felt beneficial (e.g., ViewMax > StreamFast), but foresight showed the cycle would complete. Refusing all avoided loss but missed a beneficial first swap.  
    - **Moral**: With cyclic preferences, even a “smart” choice (one swap) doesn’t feel optimal—your preferences don’t pick a best path.  

  **2. Phase B Experience (5 min)**  
  - Ask: “How did Phase B differ? Who kept swapping?” (Many do 1–3 swaps; some stop early.)  
  - **Key insight**: “In Phase B, there was no ‘last round’ to plan for. What stopped you?” (Chips run out, but policies are unstable: 1 swap > 0, 2 > 1, 3 > 2, yet 0 > 3.)  
    - Chart outcomes:  
      - 0 swaps: StreamFast + 3 chips  
      - 1 swap: ViewMax + 2 chips  
      - 2 swaps: WatchAll + 1 chip  
      - 3 swaps: StreamFast + 0 chips  
    - **Moral**: No policy is best—your preferences cycle through them. Greed (always swap) is worst (0 chips).  

  **3. Trader Phase (5 min)**  
  - Ask traders: “Who extracted the most chips? How?” (Successful traders cycled intransitive choosers: X→Y→Z→X at high prices.)  
  - Ask choosers: “Did you feel exploited? Why?”  
  - **Key insight**: “Traders exploited cyclic preferences by ‘pumping.’ But with transitive preferences, pumping failed—why?” (No cycle; e.g., if WatchAll > ViewMax > StreamFast, traders can’t loop back.)  

  **4. Introduce Terms & Conclusion (5 min)**  
  - “This is the ‘money pump’ problem: Cyclic preferences make you vulnerable to exploitation. Rationality over time (‘diachronic’) can’t just mean choosing what you prefer now—it demands planning or commitment to avoid cycles. Next lecture: How do we do that?”  
  - *Avoid authors; terms only now: money pump, transitivity, sophisticated/resolute choice.*  

  ---

  ### **What Will Go Wrong & Fixes**  
  1. **No one trades in Phase A/B**:  
     - *Why*: Risk aversion or chips undervalued.  
     - *Fix*: Emphasize chip value (do gift-card draw post-class). Praise traders who profit.  

  2. **Chips treated as worthless**:  
     - *Why*: Abstract stakes feel unreal.  
     - *Fix*: Hold up gift card visibly; remind that chips = entries.  

  3. **Transitive preferences emerge**:  
     - *Why*: Some students break the comparison rule (e.g., weight movies higher).  
     - *Fix*: Use these in debrief—show traders extracted fewer chips from them.  

  4. **“Never trade with the house” conclusion**:  
     - *Why*: Misinterfers avoidance as the lesson.  
     - *Fix*: Highlight Phase A’s beneficial one-swap outcome; stress that exploitation requires cyclic preferences.  

  5. **Trader phase chaos**:  
     - *Why*: Traders don’t grasp pricing.  
     - *Fix*: Demo pre-phase: “If max swap value is 2, charge 1.5–2 chips.”  

  6. **Time overrun**:  
     - *Why*: Haggling in trader phase.  
     - *Fix*: Enforce 60-second per offer; use timer.  

  ---

  ### **What the Activity Can’t Stage**  
  The activity shows cyclic preferences undermine diachronic rationality but cannot model **resolution vs. sophistication**. Students experience the *problem* (no maximal policy) but not the *solutions* (e.g., committing to a plan in advance). This requires lecture follow-up to contrast:  
  - **Sophisticated choice**: Foreseeing future choices and refusing the first swap (as some did in Phase A).  
  - **Resolute choice**: Committing to one beneficial swap and sticking to it (not testable without a commitment mechanism).  
  *Next lecture*: Explore how rationality might demand resolution, not just foresight.
