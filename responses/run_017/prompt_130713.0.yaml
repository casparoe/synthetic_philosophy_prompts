  - **Description**: "A public library tracks book borrowings to manage inventory (purpose: resource allocation). It anonymizes and publishes datasets online. A political campaign downloads the data, re-identifies users via borrowing patterns, and targets ads based on inferred ideologies (e.g., frequent radical philosophy books = left-leaning)."  
