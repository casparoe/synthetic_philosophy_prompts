prompt: |-
  hey, I'm running a reading-group session on the non-identity problem next week and I want to end it with something funny that isn't just a restatement of the puzzle. You're a moral philosopher who also happens to write extremely dry bureaucratic satire. Start by brainstorming for a bit about which feature of the non-identity problem is genuinely ridiculous rather than just counterintuitive, then commit to one angle and write the piece.

  What I want: a mock official document, 600–700 words, from something like a treasury or an Office for Future Generations — a "Supplementary Impact Assessment Guidance Note" — that quietly introduces a Conditional Existence Exemption: where a policy affects which people come to exist rather than how well off already-existing people are, no one can be entered on the "persons affected" line of a cost-benefit assessment, since under any alternative policy different people would have existed, and their lives are on the whole worth living. So the affected-persons column reads zero.

  Things I actually care about:
  - keep it deadpan official throughout. no winking, no "as absurd as this sounds", the document should believe itself
  - the comedy has to come from getting the structure right: the identity-affecting vs same-people distinction, why "made worse off" and "harmed" come apart here, why the exemption does nothing at all for people already alive when the decision is made, and the fact that its scope grows the further into the future you project
  - invent one piece of technical apparatus the working group could plausibly have produced — I was thinking something like a counterfactual-person discount rate, or a de minimis threshold for how much identity overlap someone needs before they count as "the same" person for assessment purposes — and have the bureaucracy apply it with total literalness
  - close with a worked example where it bites hardest: a decision the exemption covers that also clearly worsens things for some currently living people, so a reader feels the gap between what the form says and what is obviously wrong
  - don't state the moral. let the reductio land on its own

  think carefully about which detail to build the ending around, and dont hedge — pick one and commit.
reasoning: |-
  Okay, the user is organizing a reading group on the non-identity problem and wants a humorous yet deadpan bureaucratic satire to conclude the session. They specifically requested a mock official document that introduces a "Conditional Existence Exemption" - a policy where identity-affecting decisions show zero affected persons in cost-benefit assessments. 

  Hmm, what makes the non-identity problem genuinely ridiculous rather than just counterintuitive? It's how it treats future people as mathematical abstractions while completely sidestepping tangible harms to existing populations. The core absurdity lies in the bureaucratic pretense that if you're creating new people (whose lives are net-positive), you're not actually harming anyone - even when real humans alive today suffer concrete damages. That disconnect between paperwork and reality is prime satire material.

  For the technical apparatus, a "De Minimis Identity Persistence Threshold" feels right - some arbitrary percentage (say 99.2%) of genetic similarity required to count as "the same person" across policy scenarios. The colder and more precise the number, the funnier. 

  The ending example must showcase the exemption's cruelty through bureaucratic detachment. A coastal infrastructure project that drowns existing homes while creating future beneficiaries fits perfectly: the form calmly notes zero affected persons because displaced residents "would not exist" under alternative policies (based on that 99.2% threshold), while the treasury section frets about compensation costs to... those same non-existent people. 

  Key execution points:
  - Maintain absolute bureaucratic seriousness. No irony cues.
  - Hammer the exemption's expanding scope over time (future-heavy policies get automatic passes).
  - Let the worked example's dissonance speak for itself: compensation calculations for people the form declares nonexistent.
  - Bury the moral horror in subsection footnotes and cross-references.

  The humor works precisely because the document takes its own absurd logic deadly seriously. When the treasury annex calculates payouts to "non-persons," the reductio ad absurdum lands without a single nudge.
answer: |-
  ## SUPPLEMENTARY IMPACT ASSESSMENT GUIDANCE NOTE  
  **OFFICE FOR FUTURE GENERATIONS (OFG) / HM TREASURY JOINT WORKING GROUP**  
  **REF: SIA-GN/07/REV.3**  
  **DATE: 23 October 2023**  
  **SUBJECT: Conditional Existence Exemption (CEE) for Policies Affecting Identity-Constituted Cohorts**

  **1. PURPOSE**  
  This Guidance Note clarifies the application of the Conditional Existence Exemption (CEE) under Annex D.2 of the *Intergenerational Fairness Act (2051)* and HM Treasury’s *Green Book: Supplementary Guidance on Long-Term Cost-Benefit Analysis (2049)*. It provides operational definitions and procedures for determining the "Persons Affected" metric (Column 7, Standard Form SIA-1) where policies materially influence the composition of future populations.

  **2. LEGAL & CONCEPTUAL BASIS**  
  The CEE recognises that certain long-term policy choices (e.g., major infrastructure timing, deep geological repositories, cumulative environmental thresholds, large-scale demographic incentives) determine *which specific individuals come into existence* ("Identity-Affecting Policies" - IAPs), rather than altering welfare levels for predetermined persons. Legal precedent (*Parfit v. Secretary of State for Temporal Affairs, 2043*) established that individuals whose existence is contingent upon a specific IAP cannot be meaningfully classified as "harmed" by that IAP, provided their lives are, on balance, worth living (cf. OFG *Minimal Viability Threshold*, SIA-GN/02). Consequently, no valid claimant exists for welfare diminution under counterfactual scenarios.

  **3. APPLICATION OF THE CEE**  
  3.1. **Determining IAP Status:**  
      A policy qualifies as an IAP if, under *all reasonably foreseeable alternative policy options*, the cohort of individuals born beyond the *Identity Disjunction Horizon* (IDH, see Section 4) exhibits a population-wide genetic/personal identity divergence exceeding the **De Minimis Identity Persistence Threshold (DMIPT)** of 99.2%. (Refer to OFG Technical Appendix TA-8b: *Identity Variance Modelling Using Probabilistic Conception Event Chains*).  
  3.2. **CEE Trigger:**  
      Where an IAP status is confirmed (per 3.1), and OFG verifies projected life satisfaction scores for the contingent cohort exceed the Minimal Viability Threshold (SIA-GN/02, §4.7) across all scenarios:  
      - **Column 7 (Persons Affected)** of SIA-1 **MUST** be recorded as **0 (Zero)** for all future time-periods beyond the IDH.  
      - **Note:** This applies *only* to impacts on individuals whose existence is contingent upon the policy selection. Impacts on **currently living persons** or persons conceived prior to the IDH *must still be fully accounted* in Column 7 and subsequent welfare calculations.

  **4. THE IDENTITY DISJUNCTION HORIZON (IDH)**  
  4.1. **Definition:** The IDH is the future point beyond which the DMIPT (99.2% identity divergence) is statistically assured (>95% confidence) under divergent policy paths.  
  4.2. **Calculation:** The IDH is calculated using the formula:  
      `IDH (years) = [ln(1 - DMIPT) / ln(1 - Annual Conception Event Variance Rate)]`  
      The default Annual Conception Event Variance Rate is 0.018 (1.8%), derived from ONS longitudinal cohort data (See TA-8b, Table 3). This yields a **Standard IDH of 65 years**.  
  4.3. **Implication:** The CEE applies *only* to impacts occurring **after the project-specific IDH**. Impacts occurring before the IDH must undergo standard assessment *unless* the DMIPT is demonstrably exceeded earlier via project-specific modelling (TA-8b approval required).

  **5. COMPENSATION & DISTRIBUTIONAL CONSIDERATIONS**  
  5.1. **No Intergenerational Compensation:** As contingent future persons cannot be classified as harmed, *no compensatory transfers* from beneficiaries (other future persons) to contingent persons are mandated or calculable under the CEE framework.  
  5.2. **Intragenerational Impacts:** The CEE pertains *only* to Column 7 quantification. Policies may still generate significant welfare impacts or distributional inequalities *among persons existing pre-IDH*. These impacts **must** be fully assessed and compensated via standard mechanisms (e.g., welfare adjustments, lump-sum transfers). The CEE does not nullify these obligations.

  **6. WORKED EXAMPLE: COASTAL DEFENCE STRATEGY (CDS) OPTIONS**  
  *Scenario:* Selection between CDS Option A (Immediate Major Reinforcement) and CDS Option B (Phased Adaptation/Managed Retreat).  
  *Assessment Window:* 2025 - 2200.  
  *IDH Calculation:* Standard IDH = 65 years → **IDH = 2090.**

  * **Impacts PRE-IDH (2025-2090):**  
    - Option B results in periodic flooding affecting **~12,500 existing persons** (or persons conceived before policy enactment) by 2080, causing quantifiable welfare loss.  
    - **Column 7:** **12,500 persons** entered. Standard cost-benefit and compensation applies.  

  * **Impacts POST-IDH (Post-2090):**  
    - Modelling confirms >99.2% identity divergence in the coastal population cohort born post-2090 under Option A vs. Option B (TA-8b Certificate: OFG/TA8b/CDS/789).  
    - Option B leads to significantly lower average welfare (e.g., reduced GDP/capita, higher disease burden, poorer amenities) for the post-2090 coastal population relative to Option A.  
    - **Application of CEE:**  
      - Affected cohort's existence is contingent upon CDS selection.  
      - Minimal Viability Threshold met (Life satisfaction > 0.4 in all projections).  
      - **Column 7 (Post-2090):** **0 (Zero) persons affected** entered for welfare differentials under Option B.  
      - *Consequence:* Welfare losses post-2090 under Option B are *excluded* from aggregate net present value (NPV) calculation for the policy decision. Only pre-2090 impacts and project costs are compared.

  * **Treasury Annex Note (CDS Option B Financial Summary):**  
      > "...While acknowledging significant long-term welfare diminution post-2090 relative to Option A, the CEE (SIA-GN/07) mandates exclusion of these impacts from Column 7 (Persons Affected) and subsequent NPV. Compensatory mechanisms for pre-2090 displacement (est. £4.2bn) remain fully costed and provisioned..."

  **7. REPORTING**  
  All SIA-1 submissions invoking the CEE must append the certified OFG TA-8b Identity Variance Report and clearly demarcate impacts pre- and post-IDH. The rationale for the "0" entry in Column 7 post-IDH must be explicitly referenced to this Guidance Note (SIA-GN/07).

  **END OF GUIDANCE**  
  *Issued under Authority: Joint OFG-HMT Steering Committee on Intergenerational Accounting*
