prompt: |-
  I'm a retired zoologist — birds, mostly, nothing whatsoever to do with brains — and for the last year or so I've been going along to a philosophy of mind reading group at the university. There's a move that keeps turning up in what we read about split-brain patients, and I don't have a word for it, which means I can't get a grip on what I think is wrong with it.

  Here's the shape of it. Someone lays out the classic commissurotomy findings: a word is flashed to the left visual field so it goes to the right hemisphere; the patient can't say what was shown but the left hand picks out the matching object from behind a screen; asked why, the patient — well, the speaking half — comes out with some reason that has nothing to do with the word. Every verb in that description is a psychological one and every subject of it is a hemisphere. The right hemisphere saw, understood, knew what to do; the left one invented a story. You can't state the finding any other way.

  Then a page later, when someone says "so are there two subjects of experience in that skull?", the same writers say: no, of course not, a hemisphere isn't the sort of thing that can be a subject, that's just a manner of speaking about information being available to one causally seperated subsystem and not to another. The subject is the patient, full stop.

  What interests me is the asymmetry. The hemisphere-talk is good enough to report the discovery and to carry the dramatic conclusion — that consciousness can come apart, that unity is an empirical matter — but it's suddenly only a manner of speaking the moment it would support something people don't want, like there being two subjects, or two centres of moral concern, in one body. Nobody ever seems to run it the other way: since it's only shorthand, perhaps it doesn't show disunity either.

  I see the same shape in a harmless place: a friend who used to do neurophysiology says "the visual system hypothesises" all day and then denies the visual system believes anything. There it costs nothing, because nobody is trying to count subjects. In the split-brain case the counting is the whole point.

  I've heard it called a fallacy, but that doesn't feel right: it isn't a slip, the people doing it are careful and know exactly what they're up to, and the description would be unstatable without it. It's more like a licence that gets waved and then withdrawn depending on which conclusion is on the table.

  So: does it have a name? I mean the asymmetry in particular, not talking about hemispheres in general. If yes, I'd want to know how near the established notions get and where mine departs from each; if there's nothing that fits, say so plainly and invent a term with a definition, and give me a couple of borderline cases so I can see the edges. And either way, tell me whether the asymmetry can actually be defended — is there a reading on which the shorthand really is evidential about disunity and really is silent about how many subjects there are, or is it just wanting it both ways? I'm not after a label to drop at the next meeting; I want to know what the thing is, what it isn't, and where it stops.
reasoning: |-
  Okay, let me start by unpacking what this retired zoologist is asking. They're coming from a background in ornithology, not neuroscience or philosophy, but they've been attending a philosophy of mind reading group. The core issue they're grappling with is a particular rhetorical move in discussions about split-brain patients. 

  First, I need to understand the asymmetry they're pointing out. On one hand, researchers describe hemispheric actions using psychological verbs ("the right hemisphere saw," "the left hemisphere invented a story"). This language seems necessary to convey the experimental findings. But when the question of "two subjects" arises, the same researchers retreat to saying this is just shorthand for information processing in isolated subsystems. 

  Hmm. The zoologist is sharp to notice this inconsistency. They're not just asking for a fallacy name; they want to understand the structure of this rhetorical dance. The key pain points seem to be:
  - The language feels indispensable for describing disunity
  - But it's explicitly denied when it would imply multiple subjects
  - There's never symmetrical skepticism about whether the data truly shows disunity

  I recall similar patterns in other domains. In cognitive science, we often say "the hippocampus remembers" while denying it has beliefs. But as the zoologist notes, the stakes are higher with split-brain subjects because the "subject count" is precisely what's being debated. 

  Let me mentally scan philosophical concepts... 
  - Is this a mereological fallacy? (Attributing person-level properties to parts) Close, but that usually criticizes the initial attribution, whereas here the attribution is embraced then strategically abandoned. 
  - Maybe it's a version of selective instrumentalism? Using intentional language pragmatically while denying ontological commitment. But that doesn't capture the asymmetric application. 

  Ah! What about Anscombe's distinction between "material" and "formal" descriptions? The hemisphere-talk might be formally adequate (describing the pattern) but materially empty (not implying a subject). But does that hold water when the formal description uses psychological predicates? 

  The zoologist's observation about evidence is penetrating: If the shorthand is robust enough to prove disunity, why isn't it robust enough to suggest multiple subjects? And if it's too weak for the latter, why trust it for the former? 

  I should also consider defenses. Maybe there's a principled distinction: psychological verbs can describe subsystem functions (seeing-as-information-processing) without implying subjecthood (seeing-as-experiential). But that feels slippery - when we say "the right hemisphere understood the word," isn't "understood" already experiential? 

  For borderline cases: 
  - Mild: "My phone knows where I am" (instrumental) 
  - Moderate: "The chess program considers its moves" (functional) 
  - High-stakes: "The dementia patient's intact cortex still recognizes loved ones" (teetering on subjecthood implications) 

  The zoologist deserves a term for this specific asymmetry. "Evidential opportunism"? "Descriptive oscillation"? "Subpersonal double-move"? Need something that captures the selective reification. 

  Ultimately, the move might be defensible if we strictly separate information-access descriptions from subjecthood claims. But the burden is on those who use it to explain why the same language bears evidential weight in one context but not the other. The zoologist's skepticism seems warranted - it does smell like wanting the cake and eating it too.
answer: |-
  Your insight cuts deep into a persistent tension in cognitive science and philosophy of mind. What you're describing is a **rhetorical asymmetry in the attribution of psychological predicates**, specifically the selective use of personal-level language for subpersonal systems when reporting data, followed by a strategic retreat to instrumentalism when metaphysical conclusions become inconvenient. This isn't a single fallacy but a **pattern of explanatory opportunism** with philosophical roots. Here's a breakdown:

  ### 1. **The Core Pattern: Subpersonal/Personal Sliding**
     - **Step 1:** **Personal-level descriptions of subsystems** (e.g., "The right hemisphere *saw* the word," "The left hemisphere *invented* a story"). This uses verbs implying agency, cognition, or subjectivity (*knew, understood, decided*).
     - **Step 2:** **Denial of ontological commitment** when implications are unwanted (e.g., "Hemispheres aren't subjects; this is just shorthand for information processing").
     - **Asymmetry:** The language is treated as *evidentially robust* for proving **functional disunity** (consciousness isn't monolithic) but *evidentially inert* for proving **metaphysical multiplicity** (multiple subjects). The burden of proof shifts mid-argument.

  ### 2. **Established Concepts & Where They Fall Short**
     - **Mereological Fallacy** (Bennett & Hacker, 2003):  
       Attributing psychological properties to *parts* of a person (e.g., "The brain believes") that only make sense for the *whole* person. **Fit:** Explains why "the visual system hypothesizes" is problematic. **Shortfall:** Doesn't capture the *asymmetry*—your case involves the *same authors* leveraging then disavowing the attribution strategically.
     
     - **Homunculus Fallacy:**  
       Explaining cognition by positing a "little person" inside the brain. **Fit:** Warns against treating subsystems as agents. **Shortfall:** The split-brain case involves *real functional isolation*, not just speculative homunculi. The language feels empirically necessary.

     - **Instrumentalism vs. Realism:**  
       Treating intentional language ("The right hemisphere knows") as a useful fiction (instrumentalism) vs. literal truth (realism). **Fit:** The "manner of speaking" retreat is explicitly instrumentalist. **Shortfall:** Fails to explain why instrumentalism is waived for disunity claims but invoked for subject-counting.

     - **Levels of Explanation** (Marr, Dennett):  
       Distinguishing computational (what the system does) from personal (what the person experiences) levels. **Fit:** Writers may claim they're only describing computational-level processes. **Shortfall:** The language used (*knew, invented*) is *personal-level vocabulary*, smuggling in subjective implications when convenient.

  ### 3. **A New Term: Evidential Asymmetry of Subpersonal Attribution (EASA)**
     Since no existing term fully captures the *rhetorical double-move*, we can define:  
     **EASA**: *The practice of using personal-level psychological predicates to describe subpersonal systems when reporting empirical findings (implying the data supports strong conclusions about disunity), while denying those predicates entail metaphysical consequences (e.g., multiple subjects) when such conclusions are undesirable, without justifying the differential evidential weight.*  

     **Key Features:**  
     - Asymmetry in evidential commitments: Personal-language descriptions are treated as *revealing* for unity/disunity debates but *non-revealing* for subjecthood.  
     - Context-dependent ontology: The metaphysical status of subsystems shifts based on the conclusion being defended.  
     - Unidirectional skepticism: The move is never used to question whether the data truly shows disunity ("If it's just shorthand, maybe consciousness isn't split either").

  ### 4. **Borderline Cases (Testing EASA's Edges)**
     - **Non-Borderline (Clear EASA):**  
       Split-brain interpretations exactly as you describe.  
       **Example:** "The right hemisphere chose the object but didn't *want* it—only the person wants." (Attribution for action, denial for emotion.)  
     
     - **Borderline Case 1 (Plausible Deniability):**  
       *AI Systems*: "The LLM *understands* the query but doesn't *believe* anything."  
       **Test for EASA:** If "understands" is used to prove semantic competence (disunity from human understanding) but denied for mental state implications, it fits.  
     
     - **Borderline Case 2 (Defensible Asymmetry?):**  
       *Blindsight*: "The visual system *detected* the stimulus but didn't *see* it."  
       **Test for EASA:** If "detected" is treated as evidence for unconscious perception (disunity in visual processing) but the denial of "saw" blocks subjecthood claims, does it avoid EASA? Only if "detected" is rigorously non-personal.  
     
     - **Not EASA (Consistent Instrumentalism/Realism):**  
       "My GPS *thinks* I'm on the road" (consistently metaphorical).  
       "The rat hippocampus *encodes memories*" (consistently subpersonal/computational language).

  ### 5. **Can the Asymmetry Be Defended?**
     **Yes, but only under strict conditions:**  
     - If psychological predicates are **explicitly defined operationally** (e.g., "knew" = "guided accurate behavior"; "invented" = "generated verbal output without stimulus justification").  
     - If **personal-level implications are uniformly avoided** (e.g., "Information in the right hemisphere controlled left-hand behavior; the verbal system generated confabulations").  
     - If the **evidential scope is clarified**: Data shows *functional modularity*, not necessarily ontological splits in subjectivity.  

     **In Practice, It's Often "Wanting It Both Ways":**  
     Most split-brain literature fails these conditions. Using verbs like *invented* or *knew* (which imply agency/subjectivity) to dramatize findings, then retreating to "just subsystems" when counting subjects, *is* inconsistent. The asymmetry serves a narrative:  
     - **Dramatic Hook:** Personal language makes the dissociation vivid and philosophically provocative.  
     - **Theoretical Safety Net:** Denying subjecthood avoids radical conclusions (e.g., two persons) that challenge legal/moral frameworks.  

     **The Zoologist's Challenge Holds:**  
     If disunity is proven *because* we can say "the right hemisphere knew," then denying that this implies anything about subjects requires explaining why the same language bears metaphysical weight in one context but not the other. Absent that, the asymmetry is indeed a **rhetorical sleight-of-hand**.

  ### Why This Matters
  You've identified a crack in the foundation of how consciousness research is communicated. The split-brain case isn't unique—EASA appears in debates about AI consciousness, global workspace theory, and even psychiatry (e.g., "The depressed brain *believes* negative thoughts"). Calling it out forces clarity: either commit to a consistent instrumentalism (weakening the disunity narrative) or grapple with the messy metaphysics head-on. Your ornithological lens—attuned to observing behaviors without overinterpreting "inner states"—might be uniquely valuable here. At your next meeting, ask: *"When 'the hemisphere knows,' what exactly do we mean by 'knows'—and why does that meaning prove disunity but not subjecthood?"* That’s the prey in your sights. Keep hunting.
