  First, the committee makeup: supervisor (Humean), Priya (Bayesian), Dave (causal inference), a visiting CS expert on distribution shift, and an emeritus who thinks the debate is verbal. Each has distinct concerns. I need to predict the top objections each might raise, ordered by damage potential, with responses and weaknesses.

