   The current two-gate approach (existence of valenced experience, then weight of suffering) is problematic because:
     - The underlying property (valenced experience) is continuous, but the decision (list/delist) is binary.
     - It implies comparability across species which may not be achievable.

   We need a procedure that:
     - Handles absent evidence (burden of proof).
     - Combines conflicting proxies (and addresses clade-local validity).
     - Defines the unit of account (individual, weighted individual, population?).
     - Decides if partial listing (by practice) is possible and how it affects consistency.
     - Explicitly addresses the three submissions (industry, animal-protection, consultant).
     - Must be applied to three example groups (A, B, C) and yield defensible outcomes.

   We also need a one-page summary for new members.

   Key issues from submissions:
     1. Industry: Central neuron count as the only proxy; set a numerical threshold.
     2. Animal-protection: Thresholds arbitrary; nonzero probability times population scale mandates listing; aggregation is required.
     3. Consultant: Experience per unit of objective time (temporal resolution) matters; ignoring it undercounts fast animals.

   Proposed approach:

   We avoid a two-gate structure that separates existence and weight. Instead, we use a single integrated assessment of the strength of evidence for valenced conscious experience and the implications for protection, but without requiring inter-species comparison for weighting. The decision to list is based on whether the taxon has a non-negligible capacity for valenced experience, and the protection is all-or-nothing (because the legal duties are triggered by listing and are the same for all listed taxa). However, we can consider the scale of impact (number of animals, severity of practices) in the context of the evidence strength when the evidence is close to the threshold.

