  ### Rebuilt Decision Procedure for the Standing Committee on Protected Taxa  
  **Core Objective:** To determine whether a taxon possesses a **non-negligible capacity for valenced conscious experience** (VCE), triggering binary listing/delisting under the law. The procedure avoids inter-species comparisons of suffering intensity and rejects brain-size discounting.  

  ---

  ### Ordered Sequence of Questions  
  **Unit of Account:** The *individual animal*. Population scale enters only at the "precautionary override" step (Question 5) when evidence is weak.  
  **Burden of Proof:** The *petitioner* bears the burden to provide sufficient evidence. Absent evidence = evidence not provided; it does not count as negative evidence.  
  **Partial Listing:** Not permitted. Duties attach to the entire taxon; partial protections would create inconsistency across cycles.  
  **Clade-Local Proxies:** Validity of proxies (e.g., brain structures) is treated as clade-specific. Evidence from non-homologous clades (e.g., vertebrate proxies for arthropods) is admissible but downgraded unless validated within the focal clade.  

  #### **Question Sequence:**  
  1. **Is there *any* empirical evidence of valenced experience in the taxon?**  
     - *Sufficient Answer:* Yes (proceed to Q2).  
     - *Insufficient Answer:* No → **Recommend "Do Not List"**.  
     - *Handling Absent Evidence:* If evidence exists but is not in the dossier, the burden is unmet → **Recommend "Do Not List"**.  

  2. **Does the evidence converge across ≥2 independent proxy categories?**  
     - *Proxy Categories:*  
       - **Neuroanatomical** (e.g., brain structures, neuron counts).  
       - **Neurophysiological** (e.g., analgesic reversibility, nociceptive sensitization).  
       - **Behavioral** (e.g., motivational trade-offs, persistent avoidance, cognitive bias).  
       - **Evolutionary** (e.g., conserved pathways in related taxa).  
     - *Sufficient Answer:* ≥2 categories show medium/high-quality evidence → Proceed to Q3.  
     - *Insufficient Answer:* Only one category → **Stop; refer to Committee** (values judgment: whether isolated evidence is sufficient).  
     - *Conflicting Proxies:* If proxies conflict (e.g., neuroanatomy negative but behavioral positive):  
       - Prioritize behavioral > neurophysiological > neuroanatomical > evolutionary evidence.  
       - Downgrade evidence from non-homologous clades (e.g., vertebrate proxies for nerve-net taxa).  

  3. **Is the evidence of high quality and clade-valid?**  
     - *Quality Standards:*  
       - **High:** Replicated, controlled studies in peer-reviewed journals.  
       - **Medium:** Preliminary but methodologically sound data (e.g., one peer-reviewed study).  
       - **Low:** Grey literature, unreplicated, or methodologically weak.  
     - *Clade-Validity Adjustment:*  
       - Non-homologous proxies (e.g., vertebrate brain structures for arthropods) downgraded one level (high → medium; medium → low).  
     - *Sufficient Answer:*  
       - ≥1 **high-quality category** OR ≥2 **medium-quality categories** → Proceed to Q4.  
       - Else → **Recommend "Do Not List"**.  

  4. **Is there robust evidence of *negative* valence (suffering) specifically?**  
     - *Sufficient Answer:* Yes → **Recommend "List"**.  
     - *Insufficient Answer:* Evidence only for positive valence or unclear valence → **Stop; refer to Committee** (statutory purpose: whether non-suffering valenced states trigger duties).  

  5. **Precautionary Override (Weak Evidence + High Scale):**  
     - *Condition:* Evidence is weak (one medium-quality category) AND annual welfare exposure ≥ 10<sup>12</sup> individuals.  
     - *Sufficient Answer:* Both true → **Recommend "List"** (precautionary principle).  
     - *Insufficient Answer:* Else → **Recommend "Do Not List"**.  

  ---

  ### Handling Key Submissions  
  - **Industry (neuron-count threshold):** Rejected. Neuron count alone is inadmissible as a universal proxy; it must be combined with other evidence (Q2) and validated within the clade (Q3).  
  - **Animal-Protection (nonzero probability × scale):** Partially accommodated. Scale *only* triggers listing under precautionary override (Q5) when evidence is weak but nonzero. Population-scale aggregation is not a default.  
  - **Consultant (temporal resolution):** Not directly incorporated. Temporal density is treated as a behavioral/neurophysiological proxy (e.g., rapid learning) under Q2/Q3 but does not adjust suffering "weight."  

  ---

  ### One-Page Procedure Summary (For Committee Members)  
  **Goal:** Decide if a taxon has a non-negligible capacity for valenced suffering, based on evidence.  
  **Steps:**  
  1. **Evidence Check:** Is there *any* evidence of valenced experience? If not → **Do Not List**.  
  2. **Proxy Convergence:** Does evidence cover ≥2 categories (neuroanatomical, neurophysiological, behavioral, evolutionary)? If not → **Refer to Committee**.  
  3. **Quality & Validity:**  
     - Rate evidence quality (high/medium/low).  
     - Downgrade non-clade-valid proxies (e.g., fish brain measures for insects).  
     - If ≥1 **high-quality category** OR ≥2 **medium-quality categories** → Proceed. Else → **Do Not List**.  
  4. **Suffering Focus:** Is there evidence of *negative* valence (pain/distress)? If yes → **List**. If no → **Refer to Committee**.  
  5. **Precautionary Rule:** If evidence is weak (one medium category) AND billions of animals are affected → **List**. Else → **Do Not List**.  
  **Key Rules:**  
  - Population size only matters in Step 5.  
  - Burden is on the petitioner; absent evidence = no evidence.  
  - No partial listings; no cross-species suffering comparisons.  

  ---

  ### Application to Current Petitions  
  #### **Group A: Reef-Dwelling Cephalopods**  
  - **Evidence:**  
    - Neuroanatomical: High (large brain, high neuron counts).  
    - Neurophysiological: Medium (nociceptive sensitization).  
    - Behavioral: Absent.  
  - **Procedure:**  
    - Q1: Evidence exists → Proceed.  
    - Q2: ≥2 categories (neuroanatomical + neurophysiological) → Proceed.  
    - Q3: One high (neuroanatomical) + one medium (neurophysiological) → Proceed.  
    - Q4: Nociceptive sensitization suggests negative valence → **Recommend "List"**.  
    - Q5: Not needed (evidence strong).  
  - **Reasons for Record:** *"Converging neuroanatomical and neurophysiological evidence indicates a non-negligible capacity for suffering. Behavioral evidence absent but not required."*  

  #### **Group B: Social Insects**  
  - **Evidence:**  
    - Neuroanatomical: Low (downgraded; no integrating structure, vertebrate proxies invalid).  
    - Neurophysiological: Medium (analgesic reversal).  
    - Behavioral: Medium (persistent avoidance, flexible injury responses).  
  - **Procedure:**  
    - Q1: Evidence exists → Proceed.  
    - Q2: ≥2 categories (neurophysiological + behavioral) → Proceed.  
    - Q3: Two medium categories (neurophysiological + behavioral) → Proceed.  
    - Q4: Avoidance/analgesic data suggest negative valence → **Recommend "List"**.  
    - Q5: Not needed (evidence sufficient).  
  - **Reasons for Record:** *"Behavioral and neurophysiological evidence (e.g., analgesic reversal, persistent avoidance) converges to indicate suffering capacity. Neuroanatomy downgraded due to clade differences but overruled by stronger proxies."*  

  #### **Group C: Nerve-Net Filter-Feeders**  
  - **Evidence:**  
    - Neuroanatomical: Low (nerve net only; downgraded).  
    - Neurophysiological: Absent.  
    - Behavioral: Low (habituation, state-modulated withdrawal).  
  - **Procedure:**  
    - Q1: Evidence exists → Proceed.  
    - Q2: Only one category (behavioral) → **Stop; Refer to Committee**.  
    - **Committee Guidance:** *"Does isolated low-quality behavioral evidence (e.g., modulated withdrawal) imply suffering without neurophysiological support?"*  
  - **Hypothetical Committee Decision:** Likely **"Do Not List"** due to weak, non-convergent evidence.  
  - **Reasons for Record:** *"Insufficient convergence across proxy categories. Behavioral evidence alone is weak and not clade-validated. Precautionary override not triggered (exposure < 10<sup>12</sup>)."*  

  ---  

  ### What the Procedure Cannot Do  
  1. **Moral Status vs. Suffering:** It assesses *capacity for suffering relevant to human-imposed harms* (statutory duty), not rights-bearing status.  
  2. **Cross-Architectural Comparisons:** It cannot equate a "unit of suffering" between clades (e.g., insect vs. mammal). Listing is binary; intensity is ignored.  
  3. **Valence in Kind (Not Degree):** If a taxon has valenced states fundamentally unlike human-like suffering (e.g., non-affective cognitive states), the procedure may misfire. Q4 refers such cases to the Committee.  
  4. **Boundary Taxa:** Taxa near the evidentiary threshold (e.g., Group C) will face arbitrary outcomes. Precautionary override (Q5) mitigates this but risks over-inclusion.  
  5. **Temporal Resolution:** It does not quantify "suffering per objective time" (consultant’s concern). Fast taxa may be underprotected if evidence is weak.  

  **Outcome Alignment:** Group A (cephalopods) is listed despite political pressure; Group C (nerve-net) is unlikely to be listed. Group B (insects) is listed—a defensible but contentious outcome due to exposure scale. The procedure forces consistency: like evidence → like outcome, regardless of member turnover.
