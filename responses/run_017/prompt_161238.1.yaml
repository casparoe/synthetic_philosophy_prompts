answer: |-
  Here's your desiderata list for a theory of biological function, tailored to your focus on working biology/medicine, malfunction, and key cases. Requirements are grouped as **Non-Negotiable** (essential for core bio/med use) or **Negotiable** (important but sometimes traded off).

  ### **Non-Negotiable Desiderata**
  1. **Malfunction/Dysfunction Capture**  
     *Requirement:* Must explain how a trait can *fail* at its function (e.g., a heart that can’t pump is *broken*, not just different).  
     *Case/Reason:* Core to medicine/disease definitions (e.g., immunodeficiency disorders). Without this, "function" loses clinical utility.  

  2. **Distinguish Function from Mere Accidental Benefit**  
     *Requirement:* Must differentiate what a trait is *for* vs. what it *happens* to do (e.g., heart’s function is pumping blood, not making thumping sounds).  
     *Case/Reason:* Vital for targeted interventions (doctors fix pumping, not sound). Prevents "everything is functional" absurdity.  

  3. **Selection-History Independence**  
     *Requirement:* Assigns functions to traits in synthetic/organisms with no evolutionary history (e.g., lab-designed gene).  
     *Case/Reason:* Modern biology (synthetic bio, GMOs) needs function claims without Darwinian history.  

  4. **Grain Relativity**  
     *Requirement:* Allows the same item to have different functions at different levels (e.g., a gene’s molecular function vs. its organismal role).  
     *Case/Reason:* Biological reality (e.g., hemoglobin carries O₂ for cells, but supports locomotion for organisms).  

  ---

  ### **Negotiable Desiderata (Often Camp-Dependent)**
  5. **Handles Exaptation/Spandrels**  
     *Requirement:* Assigns functions to traits co-opted for new roles (e.g., feathers for insulation → flight).  
     *Case/Reason:* Evolutionary biology’s bedrock—but some accounts limit "function" to original selection.  

  6. **Handles Vestigial Traits**  
     *Requirement:* Explains how traits lose function (e.g., human appendix).  
     *Case/Reason:* Key for evolutionary/comparative bio. Conflicts with accounts that tie function only to current utility.  

  7. **Time-Scale Indexing Clarity**  
     *Requirement:* Should specify if function refers to:  
     - *Lifetime* (what it does *for the organism now*),  
     - *Evolutionary* (what it was *selected for*), or  
     - *Normative* (what it *should* do in "ideal" conditions).  
     *Case/Reason:* Your hunch is spot-on. This ambiguity hides in debates (e.g., is a vestigial trait "dysfunctional" now or just lacking past function?). Non-negotiable for precision but often fudged. *Not a bad desideratum—it’s crucial for resolving contradictions.*  

  ---

  ### **Conflicts Between Desiderata**
  - **Malfunction + Selection-History Independence** clashes with strict **Selected-Effect** accounts (no history → no function → no malfunction).  
  - **Vestigial Traits + Grain Relativity** strains **Causal-Role** accounts (if vestigials contribute *anything* at *any* level, are they functional?).  
  - **Biggest Single Wrecking Ball:** **MALFUNCTION**. It sinks pure causal-role accounts (if it currently contributes, how can it be broken?) and strains minimalist selected-effect.  

  ---

  ### **Where Major Theories Falter (in 2 Sentences Each)**
  - **Selected-Effect (Etiological):**  
    Fails **Selection-History Independence** (can’t assign functions to designed traits). Struggles with **Grain Relativity** (original selection may not match current hierarchical roles).  
  - **Causal-Role (Systemic):**  
    Fails **Malfunction/Dysfunction** (if a "broken" trait still contributes *somehow*, it’s not malfunctioning). Blurs **Function vs. Accident** (e.g., heart’s thumping sound becomes a "function" if it occasionally startles predators).  

  ---

  ### **Why Time-Scale Matters**  
  This *is* a critical desideratum. Without it, theories equivocate:  
  - A vestigial trait has *no evolutionary function now* but might have *lifetime effects* (e.g., goosebumps trap air).  
  - A diseased heart *fails its lifetime function* but retains its *evolutionary function*.  
  **Good theories specify the context** (e.g., "function in the life cycle" vs. "selected function"). Your cases (designed organisms, exaptation) force this issue—ignore it at your peril in debates.  

  This gives you a cheat sheet for dissecting theories. **Malfunction** and **History-Independence** are the hardest combo to satisfy—prioritize those when judging.
