  ### Decision Tree
  **Start at the top, answer each question, and follow the path to your position.**

  1. **If you knew for certain that skipping pellets this year changed nothing – no emissions, no price, no supplier behavior – should your household still buy?**  
     - **Yes** → **Position D**  
     - **No** → Go to 2  

  2. **If the village is exactly at the 12-tonne minimum, and skipping means the truck won’t come at all, should your household buy?**  
     - **Yes** → Go to 3  
     - **No** → Go to 5  

  3. **If skipping only nudges a rolling average by less than a pallet (no immediate effect), should your household still buy?**  
     - **Yes** → Go to 4  
     - **No** → **Position A**  

  4. **If there’s a tiny chance (1 in 1,000) your tonne tips us over the 12-tonne threshold, should your household buy?**  
     - **Yes** → **Position B**  
     - **No** → **Position Y**  

  5. **If the shared truck only runs when both valleys order, and your decision only matters if the other valley agrees, should your household buy?**  
     - **Yes** → **Position E**  
     - **No** → Go to 6  

  6. **If the hall boiler replacement is already funded by a grant, and your vote isn’t pivotal, does voting to replace it now matter?**  
