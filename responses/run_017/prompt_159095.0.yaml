prompt: |-
  I host a small philosophy podcast, and next week's guest is a philosopher who's just published a book reviving Moore's organic-unity axiology: the two great intrinsic goods are the enjoyment of beauty and personal affection, we know this by intuition rather than argument, and the value of an organic whole isn't the sum of the value of its parts. Her one genuinely new move is a "replacement test" instead of Moore's isolation test: to find the value of a friendship, don't imagine it alone in an empty universe, imagine swapping this friend for the most agreeable available substitute while holding your own mental states fixed, and see what's lost.

  Draft me seven or eight questions, each with a follow-up keyed to the answer she's most likely to give. I want at least one on the "no owner" problem: if the surplus value of the friendship-whole isn't experienced by either friend, who is it good for — and if her answer is that value needn't be value-for anyone, push on what practical work "good" is still doing. At least one on her own bullet-biting claim that beautiful objects nobody ever sees add almost nothing to a world's value: does that quietly make her a pure experientialist, and if so why keep beauty on the list of intrinsic goods at all? One on scope: if the method delivers beauty and friendship, why not parenting, achievement, or religious devotion, and what stops the method from being a blank cheque for whatever a particular class finds tasteful? One that turns the organic-unity machinery loose on evil — if wholes generate surplus value, can a friendship that involved betrayal and reconciliation be more valuable than an equally close one that didn't, and does she bite that bullet too? And please end with one question where her favourite deflection, roughly, that intuition is the datum and there's nothing further to argue about, stops being available to her — plus one about what would actually count as evidence against the view.
reasoning: |-
  Okay, the user hosts a philosophy podcast and needs interview questions for a guest who's reviving Moore's organic-unity axiology with a new "replacement test." Let me unpack their request carefully.

  First, they want 7-8 questions with follow-ups tailored to likely answers. Specific required topics include: the "no owner" problem (who experiences the surplus value?), the claim that unseen beauty has minimal value (experientialism tension), scope issues (why only beauty/friendship?), applying organic unity to evil (can betrayal enhance value?), and finally questions that bypass the intuition defense.

  Hmm... the guest's core framework has three pillars: two fixed intrinsic goods (beauty enjoyment & personal affection), intuition as justification, and non-additive organic wholes. The novel replacement test seems designed to operationalize value assessment through counterfactual substitution rather than isolation.

  For the "no owner" problem - the crux is that if the friendship's emergent value isn't felt by either friend, its ontological status becomes murky. The follow-up should press whether "good" retains meaning if disconnected from subjective experience. Maybe analogize to unobserved beauty to expose consistency issues.

  On unseen beauty... if she concedes it adds negligible value, that collapses into experientialism. The follow-up must challenge why beauty remains "intrinsic" rather than just labeling pleasant experiences. Does this secretly reduce all value to phenomenology?

  Scope questions should probe if the method could expand to parenting/achievement by similar intuition. The follow-up risks opening floodgates - if value is intuition-based, what prevents culturally relative "goods"? Need to highlight the tension between pluralism and arbitrary restriction.

  For evil applications... if betrayal-and-reconciliation creates richer unity, does that make it superior? Follow-up could invoke moral discomfort - is she willing to say abusive relationships might contain more "value" through dramatic wholeness?

  Finally, the intuition blocker: need scenarios where intuition clearly conflicts (e.g., valuing art over starving children) to force non-circular justification. And for evidence against - what observable phenomena would falsify the theory? Otherwise it risks being unfalsifiable dogma.

  Structure-wise: lead with replacement test clarification, then no-owner, unseen beauty, scope, evil, intuition limits, and falsifiability. Each Q needs a concise follow-up anticipating her defense while exposing tensions. Tone should be rigorous but charitable - embodying good-faith critique.
answer: |-
  Here are seven interview questions with follow-ups tailored to your guest's specific views, hitting your requested points while building a coherent dialogue:

  1.  **Core Method:** "Your 'replacement test' is presented as an improvement on Moore's isolation test for discerning the intrinsic value of organic unities like friendships. Could you walk us through exactly *how* swapping in the 'most agreeable available substitute' friend while holding my mental states fixed reveals the *non-additive surplus value* specific to that unique friendship-whole?"
      *   **Likely Answer:** She'll explain that the test isolates the unique contribution of *that particular friend* and the *specific relational dynamic* by seeing what's missing when only the external person is changed, revealing a value *beyond* the generic pleasure of friendship or the individual virtues of the friends.
      *   **Follow-Up:** "But doesn't holding *my* mental states fixed risk obscuring how the *specific friend* actually shapes those states? If the friend truly co-constitutes the relationship-whole, wouldn't substituting them inherently alter my mental landscape, making the 'holding fixed' part artificial and potentially masking the very surplus you're trying to find?"

  2.  **The "No Owner" Problem:** "Moore himself grappled with the 'no owner' problem: the surplus value generated by the friendship-whole isn't located in or experienced by either individual friend. If this value isn't good *for* Alice or *for* Bob, who *is* it good for? In what sense is it 'good' at all?"
      *   **Likely Answer:** She'll likely argue that value is *impersonal* or *non-relational* – the whole state of affairs (the friendship existing) is intrinsically valuable *simpliciter*, even if that value isn't reducible to or experienced as a positive mental state by any individual within it.
      *   **Follow-Up:** "If this surplus value isn't value *for* anyone and doesn't necessarily enhance anyone's experience or well-being in a tangible way, what *practical* or *ethical* work is the concept of 'good' actually doing here? Doesn't this risk making 'intrinsic value' a mysterious, inert property disconnected from the lived reality of sentient beings, including the friends themselves?"

  3.  **Unseen Beauty & Experientialism:** "You argue that a beautiful object, like a mountain vista, unseen by any conscious being adds 'almost nothing' to a world's value. Doesn't this concession effectively make you a pure *experientialist* – where only conscious experiences (of beauty, affection) hold ultimate value? And if so, why retain 'beauty' as an *intrinsic good* distinct from the *enjoyment* of it? Why not just say pleasure is the good, and beauty is just a particularly potent cause?"
      *   **Likely Answer:** She'll insist beauty itself is intrinsically valuable, *but* its value is only *realized* or *activated* when experienced. The unseen mountain has *potential* value, but its actual contribution to the world's goodness is negligible without an experiencer.
      *   **Follow-Up:** "Isn't the distinction between 'potential intrinsic value' and 'actualized intrinsic value' doing the heavy lifting here? If the value of the *object itself* is contingent on being experienced, doesn't that collapse the value *back* onto the experience? Isn't calling beauty itself 'intrinsic' while admitting its value contribution is near-zero without an experiencer a distinction without a practical difference from experientialism?"

  4.  **Scope & The Blank Cheque Problem:** "Your method identifies beauty-enjoyment and personal affection as the two great intrinsic goods via intuitive appeal to the replacement test. But why stop there? Couldn't a devoted parent run the same replacement test on *their child* and intuit a vast, irreplaceable surplus value in the parent-child relationship-whole? Or someone deeply committed to justice for achievement? What principled reason prevents the replacement test from validating *any* deeply held commitment (religious devotion, political cause, artistic creation) as a new 'intrinsic good' organic unity, potentially making the list arbitrary or culturally relative?"
      *   **Likely Answer:** She'll argue that beauty and affection are *fundamental* and *directly* intuited as good via the replacement test in a way other things are not, or that parenting/achievement/etc. derive their value *from* these more basic goods (e.g., parenting involves affection and perhaps shared aesthetic experiences).
      *   **Follow-Up:** "Doesn't this reliance on fundamental intuition risk being a *petitio principii*? You use the test to 'find' beauty and affection, declare them fundamental based on that intuition, and then use their fundamentality to disqualify other candidates revealed by the *same method* applied elsewhere. How do we adjudicate conflicting intuitions about what the replacement test reveals without an independent criterion beyond the intuition itself?"

  5.  **Organic Unity & Evil (The Betrayal Bullet):** "Organic unity generates *surplus* value. Does this principle apply symmetrically to negative value or disvalue? Could a complex whole involving *evil*, like a deep friendship that endured a significant betrayal and subsequent hard-won reconciliation, generate a *greater magnitude of positive value* as an organic unity than an equally close friendship that never faced such a rupture? In other words, is the 'value-whole' of the reconciled friendship potentially *more valuable* precisely because of the negative elements it integrated and overcame?"
      *   **Likely Answer:** She'll likely bite the bullet (as you suggest) and argue that yes, overcoming adversity can create a richer, more valuable unity. The betrayal itself is bad, but the *whole* of the reconciled relationship possesses a unique and greater positive value *because* of the history it encompasses.
      *   **Follow-Up:** "This seems morally perilous. Doesn't this imply that *introducing* betrayal (or other evils) into a relationship could, under the right circumstances of eventual reconciliation, be *value-enhancing* overall? How do you prevent this axiology from morally justifying the instrumental use of significant harm as a means to create greater relational 'wholes' later?"

  6.  **Bypassing the Intuition Shield (The Starving Child Challenge):** "Let's grant that we have strong intuitions about the value of friendship and beauty via your test. But intuitions can conflict, especially under pressure. Imagine two possible worlds: World A contains one person experiencing sublime enjoyment of a unique, irreplaceable beauty (say, a sunset they alone witness). World B contains a million people experiencing mild but genuine personal affection in simple friendships. Intuition suggests, for many, that World B is vastly better. Yet, applying your replacement test *rigorously* to the sunset-lover: swapping *that specific sunset* for the next best available would reveal a massive, irreplaceable loss *for them*. If we strictly follow the non-additive logic of organic unities focused on the *specific* irreplaceable whole (the unique sunset experience), doesn't this methodology risk *failing* to capture the overwhelming intuition that the million friendships make World B better? Doesn't this force a choice between abandoning the primacy of specific organic unities or biting a very hard bullet about the relative insignificance of widespread mild affection?"
      *   **Likely Answer:** This forces her beyond simple appeal to the specific intuition about friendship/beauty. She might argue that the *aggregate* of a million affection-unities creates its *own* massive organic whole of value exceeding the single sunset, or that widespread affection has instrumental value promoting other goods, or that the replacement test *does* reveal the sunset's immense value *for that world*, but we have a separate intuition about the greater *overall* good of World B.
      *   **Follow-Up:** "But doesn't appealing to an 'aggregate whole' or instrumental effects here violate the core anti-additive, anti-reductionist spirit of organic unity? And if we *do* have this strong separate intuition about the greater overall good of World B, doesn't that suggest the replacement test, focused on specific unities, is insufficient *on its own* for making comparative value judgments across vastly different scenarios? Doesn't this expose a limitation in the method for guiding real-world priorities?"

  7.  **Falsifiability & Evidence:** "You emphasize intuition as the bedrock. But for a theory to be robust, we should ask: what conceivable state of affairs or argument *could* count as evidence *against* your specific axiology? If someone simply doesn't share the intuition about beauty or friendship after performing the replacement test, is that falsification? Or if we discovered conscious beings utterly indifferent to beauty and affection but finding profound value elsewhere? What, if anything, could make you reconsider the core claims?"
      *   **Likely Answer:** She might say consistent, widespread failure of the replacement test to reveal these values to sincere inquirers would be problematic, or evidence that beings *incapable* of these experiences lead lives indistinguishable in value from those capable (which is hard to imagine). She might reaffirm intuition as primary.
      *   **Follow-Up:** "If the ultimate appeal is to intuition, and disagreement is explained away as faulty application or lack of sensitivity, doesn't this risk making the theory unfalsifiable and insulated from critique? Without a clearer standard for what constitutes a competent intuition or a failed test, how can this axiology engage in productive dialogue with competing views or empirical findings about what humans *actually* value?"

  **Key Rationale:**

  *   **Structure:** Starts with clarifying her core innovation (replacement test), then tackles the major philosophical challenges (no owner, experientialism, scope, evil), pushes past the intuition shield with a concrete counterexample, and ends on falsifiability.
  *   **Follow-Up Strategy:** Each follow-up anticipates her most plausible defense and pushes the logical or ethical implications further, forcing her to either defend a bullet-biting position or refine her view under pressure. The "Starving Child" question specifically creates a scenario where intuitions conflict *despite* applying her method faithfully.
  *   **Meeting Your Specs:** Explicitly covers the "no owner" problem, unseen beauty (experientialism tension), scope/blank cheque, evil/betrayal, bypassing intuition, and falsifiability.
  *   **Tone:** Aimed at rigorous but charitable exploration, highlighting tensions within her view to provoke insightful responses.

  These questions should provide a stimulating and challenging framework for your interview, pushing your guest to defend and refine her intriguing revival of Moorean axiology. Good luck with the podcast!
