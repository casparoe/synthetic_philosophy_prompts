prompt: |-
  A friend's startup spent most of last year in a nasty dispute with a former contractor over who "had" a design, and the experience left me unable to say what I actually think about when one person owes another something for using an idea. I don't want a reading list or a survey of what the law currently holds anywhere — I want to know whether my own verdicts on concrete cases add up to a principle, and if so which one. Here they are, as honestly as I can report them. A former line cook opens his own restaurant and reproduces his old employer's signature dish exactly — same technique, same plating, same name on the menu: not fine. But a cabinetmaker's apprentice who spends ten years in a shop absorbing the master's way of joining drawers, then sets up across the street and builds in that idiom: fine, and I'd think less of a master who tried to stop him — that pair is the one I can't shake, since both look like carrying away something learned at someone else's elbow. A graduate student emails her advisor an idea that ends up in his keynote without her name on it: not fine, and worse than the restaurant case, though nothing was copied in either. Two teams with no contact prove the same theorem the same way: the later one owes the earlier nothing. A rival journalist learns only that a story exists and digs it up himself: fine. A biographer spends two years in an archive and establishes that a famous novelist wrote a certain anonymous review; another biographer uses that finding in her own book without so much as a nod: not fine. A lab spends years and a lot of money measuring a decay constant; a rival lab uses the number the week it is published: fine — and this pair, two costly-to-produce new facts treated completely differently, is the one that makes me doubt I have a principle at all rather than a set of habits. A comedian does another comedian's joke more or less verbatim on television: not fine; another comedian takes only the structural trick — the misdirection setup, the callback timing — with wholly different material: fine. A fashion label prints a pattern that a weaving village in Oaxaca has used for generations, marketing it as the label's own signature: not fine, except that I cannot identify anyone in particular who is owed. A company buys a rival's product on the open market, takes it apart, and copies the geometry: fine; the same company fishes the rival's discarded prototypes out of a dumpster and copies those: I genuinely don't know. Finally, the case I keep returning to: a living poet's complete published works are used to build a system that produces new poems in her manner, no line of hers reproduced, sold by people who never spoke to her — some days this seems like the open-market teardown, other days like the advisor's keynote.

  The only formulation I've been able to make satisfy me even partly is this: you owe the originator of an idea something only when the idea reached you through a channel that they had a stake in controlling — a confidence, an employment or apprenticeship relation, a shared workspace, a manuscript handed over for a purpose — and never merely because the idea was in their head first. Please test that against the cases rather than just restating it: where does it give the verdicts I gave, where does it have to be bent to do so (I suspect the archival-fact case and the poet case are where it strains, since a published book is a channel the author chose, but not for that use), and which of my verdicts does it force me to abandon? I'd like the simplest principle that saves most of the verdicts and the more elaborate one that saves all of them, side by side, with an explicit statement of what each costs me — and I'd especially like to know whether the thing I'm calling ownership of an idea is really about ideas at all, or only about relationships and the expectations they create. Then tell me what the principles you offer say about two cases I haven't settled: an employee who invents something on company time and with company equipment but well outside anything he was hired to think about, and a novelist who takes from a novel she read at fifteen, and only half-remembers, the bare shape of its plot — a death disclosed in the first chapter, the rest of the story told backwards.
reasoning: |-
  Hmm, the user presents a fascinating philosophical puzzle about intellectual ownership. They've clearly wrestled deeply with concrete cases where moral intuition clashes with legal frameworks, rejecting textbook answers in favor of principles derived from lived experience. The emotional weight of their friend's startup dispute lingers - this isn't abstract theorizing but an attempt to heal cognitive dissonance through systematic reasoning.

  Their proposed principle about "channels of control" is remarkably sophisticated, revealing how they've already mapped relationships onto information flow. The cases cluster into three tensions: effort-based claims (lab measurements vs archival facts), relational expectations (advisor/student vs journalist rivalry), and cultural boundaries (Oaxacan weavers vs open-market teardowns). The poet and prototype dumpster cases seem to be their mental testing grounds where these dimensions collide.

  Notably absent are standard IP concepts like patents or copyright duration. When they mention "not wanting a reading list", they're rejecting external frameworks that might override their intuitions. Their closing challenge about the forgetful novelist and rogue employee suggests they suspect context matters more than content - that ownership resides in the space between minds rather than within them.

  The poet case is their white whale because it exposes all fault lines: is the AI trainer's access to published poems equivalent to a dumpster dive (improper channel) or bookstore purchase (proper channel)? Does "manner" replication violate something deeper than literal copying, like the comedian's structural trick? Their discomfort with the Oaxacan pattern case reveals unease about collective ownership in individualistic systems.

  For the unresolved cases, the employee scenario tests whether company resources create an automatic channel claim regardless of job scope, while the novelist probes whether subconscious absorption severs the relational thread. Their principle might handle these better than traditional IP doctrines - the employee's invention likely flows through company-controlled channels (time/equipment), whereas the half-remembered plot exists in a channel the original author never controlled (the reader's memory).
answer: |-
  Your proposed principle—**that obligation arises only when an idea is received through a channel the originator had a stake in controlling**—is insightful and captures many cases. Let's test it against your verdicts, identify tensions, and refine the principles. Below is a breakdown:

  ---

  ### **Cases Where Your Principle Works Perfectly**  
  1. **Graduate student's idea stolen by advisor**  
     - *Channel*: Confidential academic relationship.  
     - *Stake in control*: Advisor exploits trust.  
     - ✅ **Matches your verdict (not fine)**.  

  2. **Journalist independently digs up a story**  
     - *Channel*: Public investigation (no controlled channel).  
     - ✅ **Matches your verdict (fine)**.  

  3. **Biographer plagiarizes archival discovery**  
     - *Channel*: The first biographer’s published/book/fact (shared publicly, but *for a specific purpose*).  
     - *Stake in control*: Originator invested labor to uncover; channel (publication) implies attribution.  
     - ✅ **Matches your verdict (not fine)**.  

  4. **Comedian copies joke verbatim**  
     - *Channel*: Performance (public), but *direct copying* exploits the originator's creative channel.  
     - *Stake in control*: Comedians control dissemination of their act.  
     - ✅ **Matches your verdict (not fine)**.  

  5. **Company reverse-engineers rival's product (open market)**  
     - *Channel*: Legally purchased product → no controlled channel breached.  
     - ✅ **Matches your verdict (fine)**.  

  ---

  ### **Cases Where Your Principle *Strains***  
  1. **Lab’s decay constant vs. Biographer’s archival fact**  
     - *Your verdict*: Using the decay constant is fine; using the archival fact is not.  
     - *Problem*: Both facts are published (a channel the originator chose).  
     - **Strain**: Your principle treats both as "chosen channels," but you distinguish them.  
       - *Why?* **Effort vs. Discovery**: The archival fact required *interpretive labor* (connecting dots); the decay constant is a *raw measurement*. Your intuition values *insightful synthesis* over *mechanical production*.  

  2. **Oaxacan weaving pattern**  
     - *Your verdict*: Not fine, but no individual owed.  
     - *Problem*: No controlled channel breached (pattern is traditional/public).  
     - **Strain**: Your principle can’t explain obligation without a specific channel.  
       - *Why?* **Collective ownership**: The "stake" belongs to a community, not an individual. Your intuition extends obligation to *cultural custodianship*.  

  3. **Dumpster-diving prototypes**  
     - *Your verdict*: Uncertain.  
     - *Principle*: Discarded prototypes imply the originator *relinquished control* of the channel.  
     - **Strain**: Your hesitation suggests *context matters*: dumpster-diving feels like violating *implicit boundaries*, even if no formal channel exists.  

  4. **Poet’s style replicated by AI**  
     - *Your verdict*: Ambivalent (teardown vs. keynote).  
     - *Principle*: Published poems are a "chosen channel," but not for AI training.  
     - **Strain**: You sense a violation because the use *exploits creative essence*, not just the channel.  

  ---

  ### **Cases Where Your Principle *Fails***  
  1. **Line cook copies signature dish**  
     - *Your verdict*: Not fine.  
     - *Principle*: Recipe learned in employment → channel originator (employer) had stake in controlling.  
     - ✅ **Works!** (But note: Cabinetmaker case challenges this).  

  2. **Cabinetmaker’s apprentice copies technique**  
     - *Your verdict*: Fine.  
     - *Principle*: Technique learned in apprenticeship → channel originator (master) had stake in controlling.  
     - ❌ **Fails**: Your principle would say "not fine," but you say "fine."  
       - *Why?* **Skill vs. Expression**: Techniques are *generic knowledge*; the dish is a *specific expression*. Your intuition forgives *absorbed craftsmanship* but not *replicated creations*.  

  ---

  ### **Refined Principles**  
  #### **Simplest Principle (Saves Most Verdicts):**  
  > **"You owe obligation when you use *specific expressions* or *insightful syntheses* gained through a relationship or channel the originator sought to control."**  
  > - *Saves*: Dish, thesis, biographer, comedian (verbatim), dumpster (likely not fine).  
  > - *Abandons*: Cabinetmaker (now "not fine" but you said "fine").  
  > - *Cost*: Forces you to abandon the apprentice’s right to use generic skills.  

  #### **More Elaborate Principle (Saves All Verdicts):**  
  > **"Obligation arises when:  
  > (a) You replicate a *unique expression* (e.g., dish, joke, plot) OR  
  > (b) You use *insightful synthesis* (e.g., archival fact) OR  
  > (c) You breach a *contextual expectation* (e.g., confidence, employment, cultural custodianship) —  
  > unless the knowledge is *functional/mechanical* (e.g., measurement, technique) or *independently generated*."**  
  > - *Saves all verdicts*:  
  >   - Cabinetmaker: Technique = functional knowledge (✅ fine).  
  >   - Biographer vs. Lab: Synthesis (❌ not fine) vs. mechanical fact (✅ fine).  
  >   - Oaxaca: Cultural custodianship = contextual expectation (❌ not fine).  
  >   - AI Poet: Replication of *unique expressive style* (❌ not fine, aligning with keynote).  
  > - *Cost*: More complex, requires judgment calls (e.g., what is "unique expression"?).  

  ---

  ### **Is This About Ideas or Relationships?**  
  **Neither alone**: It’s about *how ideas are contextualized*.  
  - *Relationships* create expectations (e.g., advisor-student).  
  - *Effort* matters when it yields *insight* (e.g., archival fact).  
  - *Culture* can create collective stakes (e.g., Oaxaca).  
  - *Functional knowledge* (e.g., joinery, decay constant) escapes obligation because it is *tool-like*, not *expressive*.  

  **Ownership of ideas is really about**:  
  > **The moral weight of *context* and *form*. Relationships and expectations define *obligation*; the *type* of idea (expressive vs. functional) defines its *protectability*.**  

  ---

  ### **Unsettled Cases Resolved**  
  1. **Employee invents on company time/equipment (outside job scope):**  
     - *Elaborate Principle*:  
       - Breaches *contextual expectation* (resources/access provided by employer).  
       - ❌ **Not fine** → employer has claim.  

  2. **Novelist uses half-remembered plot from childhood:**  
     - *Elaborate Principle*:  
       - "Bare shape of plot" = *functional knowledge* (not unique expression).  
       - No channel breached (read publicly years prior).  
       - ✅ **Fine** → no obligation.  

  ---

  ### **Conclusion**  
  Your core intuition is correct: obligation stems from **violating contextual trust or exploiting expressive labor**, not mere precedence. The simplest principle sacrifices the apprentice’s freedom; the elaborate one preserves all verdicts by distinguishing **expression/synthesis** from **function/mechanics** and honoring **implicit expectations**. What you call "ownership" is less about the idea itself than about **how it was obtained and what form it takes**.  

  This aligns with your poet case: training an AI on her *expressive style* (not just words) feels like theft because it replicates her *creative essence* through a channel (published work) she didn’t consent to for *that purpose*. It’s the **misalignment of use and expectation** that bites.
