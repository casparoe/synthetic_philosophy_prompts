  Hmm, the user's supervisor thinks they should pick one issue, but they're resisting that. I can see why—their proposed angle is genuinely novel. The electorate-as-sample framework shifts focus from individual rights/duties to systemic representativeness, which could reframe all three debates. But the supervisor's concerns about vagueness and "sortition with extra steps" are valid. The challenge is making this concrete enough for a proposal.

  The user explicitly wants a *proposal*, not an essay—so structure is key. They need: a precise research question, gaps in existing literature, methodological clarity, and defined success/failure conditions. They're adamant about avoiding comparative surveys or empirical deep dives. Smart—this keeps it theoretical and manageable.

  Breaking this down: First, the research question needs to avoid being three questions stapled together. The phrase "systematically unrepresentative electorate" seems crucial—it's the common thread. The gap is that existing frameworks don't address how *interacting* inclusion rules (age, compulsion, citizenship) create representational distortions. 

  For methodology, they'll need to: 
  - Define the electorate-as-sample view rigorously (distinguishing it from sortition/polling analogies). 
  - Analyze each debate through this lens to expose limitations of current arguments. 
  - Test the framework's coherence by tackling threshold problems (e.g., "How does sampling logic handle 16 vs. 18 voting age?"). 

  Success isn't about proving the framework "right"—it's about showing it reveals new tensions or trade-offs. A negative but useful result would be identifying where the sampling view *collapses* (e.g., competence concerns resurfacing unexpectedly). Failure would be if the framework just restates existing arguments or can't handle thresholds without arbitrary lines.

  The user worries they're writing three papers. They're not—the sampling view is the through-line. But they should probably *not* dive into policy details (e.g., exact residency rules). Keeping it focused on theoretical implications avoids sprawl.

  ...Time to craft a tight proposal structure that meets all their specs while quieting the supervisor's doubts.
answer: |-
  Here's a structured proposal framing your core question, gap, method, and stakes, designed as a prospectus for ~5,000 words:

  ---

  **Working Title:** The Representative Electorate: Sampling Logic and the Coherence of Franchise Expansion Debates

  **Core Research Question:**  
  *Can the "electorate-as-sample" framework resolve the normative deadlocks in debates over compulsory voting, voting age, and non-citizen suffrage by demonstrating that these mechanisms collectively determine whether the voting body constitutes a* **systematically unrepresentative sample** *of those governed, and if so, what theoretical and practical constraints does this impose on democratic inclusion?*

  **The Gap in Existing Literature:**  
  Current approaches treat compulsory voting (duty/virtue/correction of free-riding), voting age (competence/affectedness), and non-citizen suffrage (membership/affectedness/stakeholding) as discrete normative problems. This fragmentation:  
  1. **Ignores interaction effects:** How voluntary turnout + age restrictions + citizenship requirements *compound* representational skew (e.g., excluding young non-citizens doubles the distortion).  
  2. **Overlooks shared stakes:** All three debates impact the *system-level property* of whether the electorate accurately reflects the governed population’s interests and experiences.  
  3. **Misses trade-offs:** Duty-based arguments for compulsion clash with membership-based objections to non-citizen voting, yet both claim to enhance legitimacy. The sampling lens reveals these as competing strategies for the same goal: a representative mandate.  

  **Methodology (Semester Plan):**  
  *(Assumption: Empirical claims about turnout skews, age/citizenship demographics, and policy responsiveness are stipulated as background conditions, not tested.)*  

  1. **Theoretical Groundwork (2 weeks):**  
     - Define the "electorate-as-sample" view: Distinguish it from sortition (no random selection), preference aggregation (focus on input representativeness, not output), and statistical polling (ballots are constitutive acts, not opinions).  
     - Core claim: A democratically legitimate electorate must avoid *systematic, politically consequential exclusion* of governed groups.  

  2. **Diagnosing Fragmentation (2 weeks):**  
     - Analyze how duty-based (e.g., Lever), competence-based (e.g., Brennan), and membership-based (e.g., Walzer) arguments isolate one franchise parameter while holding others static, obscuring aggregate distortion.  

  3. **Applying Sampling Logic to the Three Debates (3 weeks):**  
     - **Compulsory Voting:** Show it corrects *voluntary* participation bias but doesn’t address exclusion from the registry (age/citizenship). Why ballots over sortition? Ballots authorize government; sortition administers it. Abstention options preserve agency.  
     - **Voting Age:** Competence objections assume individual voter rationality. Sampling prioritizes *collective* epistemic capacity and inclusion of affected interests (youth). Thresholds become empirical (when does exclusion cause systematic distortion?) not moral.  
     - **Non-Citizen Suffrage:** Membership objections conflict with the "governed population" definition. Sampling logic demands inclusion unless exclusion is non-arbitrary *and* non-distorting (rare for long-term residents).  

  4. **Coherence Test: Thresholds and Trade-offs (3 weeks):**  
     - Can the framework handle "edge" questions without arbitrariness?  
       - *Age:* If distortion matters, why not enfranchise infants? Sampling requires *capacity to contribute to collective epistemic function* (minimal competence ≠ high competence).  
       - *Residency:* Duration thresholds are justifiable if transient presence creates negligible stake/distortion.  
     - Explore tensions: E.g., compulsory voting for non-citizens may face legitimacy deficits despite improving sample accuracy.  

  5. **Conclusion: Implications for Democratic Theory (1 week):**  
     - Assess if sampling logic offers a unified justificatory framework or merely exposes trade-offs. Does it transcend the liberal/communitarian divide?  

  **Why this approach?**  
  - Avoids **comparativism** (no cataloging country policies).  
  - Avoids **empirical turn** (no new turnout studies).  
  - Targets **theoretical synthesis** where fragmentation persists.  

  **Success Conditions:**  
  - **Positive Result:** Demonstrating that the sampling framework:  
    a) Reveals hidden connections between franchise parameters,  
    b) Dissolves intractable objections (e.g., competence for age) by shifting the justificatory ground,  
    c) Generates principled (non-arbitrary) guidance for thresholds.  
  - **Useful Negative Result:** Showing the framework either:  
    a) Collapses into existing approaches under pressure (e.g., sampling requires competence thresholds akin to status quo), OR  
    b) Demands politically untenable inclusions (infants, tourists), exposing a flaw in *representativeness* as the sole ideal.  

  **Failure Conditions:**  
  1. The framework is merely **metaphorical** and cannot generate normative prescriptions without smuggling in duty/membership logic.  
  2. It cannot resolve **threshold problems** better than status quo intuitions.  
  3. It proves **redundant** – e.g., "affected interests" arguments already cover sampling concerns.  

  **Should you cut one sub-question?**  
  **No.** The power of your project lies in forcing these debates into dialogue. Cutting one (e.g., non-citizen voting) weakens the claim that fragmentation obscures systemic distortion. *However:* Focus on their *interdependence* within the sampling logic. Don’t dive deep into each debate’s minutiae; use them as test cases for the framework’s coherence.  

  **Addressing Supervisor's Core Worries Explicitly:**  
  - **"Sortition with extra steps"?** Sampling logic uses ballots because they *authorize* governments; sortition *replaces* authorization with random rule. The act of voting remains symbolically constitutive.  
  - **"Can’t generate determinate answers"?** Concede thresholds remain contested but argue the framework makes debates *more productive* by reframing them: "At what point does excluding 16-year-olds create *significant distortion* in climate policy responsiveness?" is better than "Are 16-year-olds competent?"  
  - **"Metaphor dressed as argument"?** Ground it in real exclusion effects: Unrepresentative electorates produce policies that neglect excluded groups’ interests (e.g., climate, migrant rights). This is a measurable democratic failure.

  ---

  **Why this works as a prospectus:** It’s a *plan* – it identifies a puzzle, proposes a novel lens, outlines steps to test it, defines success/failure, and shows awareness of pitfalls. It promises conceptual innovation, not a finished argument.
