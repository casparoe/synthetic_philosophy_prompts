answer: |-
  ## GUIDANCE NOTE 17(b): CERTIFICATION OF SAFE PARETO IMPROVEMENTS  
  **Issued by the Welfare Optimization Committee (WOC), Wainwright College**

  **Effective Date:** October 27, 2023  
  **Supersedes:** Guidance Note 17(a)

  **1. Purpose:** This Note outlines the procedure for certifying administrative, academic, or operational changes as Safe Pareto Improvements (SPIs) under the College's Expected Consent Procedure (ECP). SPIs may be enacted without formal vote, per College Statute 8.7.3.

  **2. Definition of SPI:** A Safe Pareto Improvement is a change satisfying:
      *   (a) Under the Committee's Official Probability Model (OPM), the change raises the expected welfare of at least one individual; and
      *   (b) Under the OPM, the change does not lower the expected welfare of any individual.

  **3. The Official Probability Model (OPM):**
      *   3.1 The WOC maintains and periodically updates the OPM. The OPM incorporates relevant stochastic factors affecting welfare outcomes.
      *   3.2 As mandated by ECP, the WOC selects the OPM deemed "most conservative" in its assessment of potential welfare losses. Conservatism is defined as maximizing the robustness of welfare estimates under baseline sensitivity analysis (WOC Internal Protocol 4.2).
      *   3.3 The current OPM (v.3.1) utilizes historical data on campus climate surveys, HR satisfaction metrics (2018-2023), and calibrated risk aversion parameters. Assumptions are documented in Appendix Γ.

  **4. Utility Function Specification:**
      *   4.1 Expected welfare is calculated using standardized individual utility functions.
      *   4.2 All faculty, staff, and students are required to submit their Cardinal Welfare Preference Schedule (CWPS Form Ω-7) biennially. This schedule allows the WOC to derive an individual-specific utility function mapping outcomes (e.g., salary, teaching load, office configuration, library access) onto a cardinal welfare scale.
      *   4.3 Individuals failing to submit CWPS Form Ω-7 by the deadline are assigned the Median Cohort Utility Function (MCUF) for their employment/student classification (e.g., "Tenured Humanities", "Adjunct STEM", "Undergraduate Year 3").
      *   4.4 Objections based on personal utility function divergence from the submitted CWPS or assigned MCUF will be reviewed. Certification proceeds if the OPM, using the *official* utility function (submitted or assigned), confirms the SPI status. Individuals are directed to consult WOC Guidance Note 12: "Aligning Personal Hedonics with Institutional Welfare Metrics."

  **5. The Compensation Principle:** Should any individual experience a realized welfare decrease post-implementation of a certified SPI:
      *   5.1 No ex post compensation is warranted.
      *   5.2 The welfare decrease is understood to have been fully compensated *ex ante*, in expectation, as verified by the OPM using official utility functions. The individual received the benefit of the positive expected value prior to the change's realization.

  **6. Certification Process:**
      *   6.1 Proponents submit Proposal Packet Π-12, including a detailed description of the change, implementation plan, and a WOC-Certified Welfare Impact Simulation (WIS) report.
      *   6.2 The WIS must utilize the current OPM and the official utility functions (per 4.2 & 4.3) of all affected individuals.
      *   6.3 The WOC reviews the WIS for methodological soundness and recomputes key welfare estimates using OPM v.3.1.
      *   6.4 If the recomputation confirms SPI status (expected welfare non-decrease for all, increase for at least one), the WOC issues a Certification of Safe Pareto Improvement (Form Σ-4).
      *   6.5 Form Σ-4 authorizes immediate implementation without further vote or consent procedure.

  **7. Worked Example: Voluntary Pay Optionality Programme (VPOP)**
      *   7.1 **Proposal:** Replace the guaranteed monthly salary (Base Salary = S) with a monthly lottery. Employees receive either 106% of S (probability = 92%) or 68% of S (probability = 8%).
      *   7.2 **WIS Analysis:** Using the OPM v.3.1 and assigned/staff-submitted utility functions:
          *   Expected Monetary Value (EMV): (0.92 * 1.06S) + (0.08 * 0.68S) = 0.9752S + 0.0544S = 1.0296S (i.e., +2.96% in expectation).
          *   Expected Utility Calculation: The OPM incorporates a standard coefficient of relative risk aversion (γ) calibrated to staff surveys. For γ=1.5 (log utility), Expected Utility EU(VPOP) = 0.92 * ln(1.06S) + 0.08 * ln(0.68S). Computationally, EU(VPOP) ≈ ln(S) + 0.015 > ln(S) = EU(Guaranteed S). [Numerical values: ln(1.06)≈0.0583, ln(0.68)≈-0.3857; EU(VPOP)≈0.92*0.0583 + 0.08*(-0.3857)≈0.0536 - 0.0309≈0.0227; EU(S)=0; Thus gain ≈0.0227 utils].
      *   7.3 **Certification Rationale (Σ-4 #2023-087):** The EMV gain (+2.96%) constitutes a positive expected welfare change for all participants under the OPM. While the concave utility function reduces the *utility* gain relative to the EMV gain, the computation (7.2) confirms a strict expected utility increase for every staff member using official utility functions. Therefore, VPOP is a SPI. Staff experiencing the 68% outcome (Clause 5) were compensated in expectation by the higher probability of the 106% outcome.

  **8. Illustrative Certified SPIs (Partial List):**
      *   8.1 **Project Athena:** Replacement of scheduled faculty office hours with a 24/7 AI Tutoring & Advising Chatbot (Certified Σ-4 #2023-041). Rationale: OPM projected increased aggregate student access (welfare gain for students) and time savings for faculty (welfare gain for faculty), with no expected welfare loss. Assigned MCUFs showed low marginal utility for in-person interaction variance.
      *   8.2 **The Serenity Hub Initiative:** Conversion of the 3rd floor of the Pynchon Library into a multi-sensory Wellbeing Pod relaxation space (Certified Σ-4 #2023-112). Rationale: OPM projected significant welfare gains for users of the Pods, while the marginal utility loss for users of the displaced book stacks (based on circulation stats and MCUFs) was estimated as negligible in expectation. Bundling a 0.1% chance of a $500 wellness voucher for all users during the certification period ensured strict expected welfare gain for all under the OPM.

  **9. Reversal and Iteration:**
      *   9.1 Changes certified as SPIs may themselves be reversed by a subsequent SPI certification process.
      *   9.2 The certification of a change (C) and its reversal (R) as separate SPIs is logically consistent within the ECP framework. Each satisfied the SPI criteria relative to the state of the world preceding *its* implementation. The net effect of implementing C and then R is understood to constitute a double application of the SPI principle to the original status quo.

  ---

  **FREQUENTLY ASKED QUESTIONS (FAQ)**

  **Q1: Who decides what the "Official Probability Model" is? What makes it "conservative"?**
  A1: The Welfare Optimization Committee (WOC) is statutorily responsible for maintaining and selecting the OPM. ECP mandates the use of the "most conservative" model. Conservatism is rigorously defined within WOC protocols (Internal Protocol 4.2) as selecting the model specification, among empirically plausible alternatives, that maximizes the minimum estimated welfare impact across sensitivity checks. This ensures robustness against underestimation of potential welfare losses.

  **Q2: I submitted my CWPS Form Ω-7, but the utility function derived from it doesn't feel right to me. My preferences have changed. What happens if the change makes me worse off?**
  A2: The SPI certification relies solely on the *official* utility function, submitted via CWPS Form Ω-7 or assigned as the MCUF per Clause 4.3. If the OPM, using this official function, shows no expected welfare loss for you, the change is certified. Should you experience a realized welfare decrease post-implementation, Clause 5 applies: you were compensated for this possibility *in expectation* beforehand. Your updated preferences can be reflected in your *next* CWPS submission.

  **Q3: How can a change and its reversal both be Safe Pareto Improvements? Doesn't that mean doing nothing was best?**
  A3: The ECP evaluates each proposed change *relative to the current institutional state*. A change (C) is certified if it improves the expected welfare from State S. Later, a reversal (R) back to State S may also be certified if, relative to State C (the new status quo), moving to State S meets the SPI criteria (non-loss in expected welfare for all, gain for some). This reflects the dynamic application of the Pareto principle sequentially. The original State S benefits from having both the potential gain from C (certified) and the subsequent restoration via R (also certified) available.

  **Q4: Proposal VPOP (Clause 7) seems risky. What if I get unlucky and get the 68% salary many months?**
  A4: The SPI certification is based on *expected* welfare calculated before the outcome is known, using the OPM and your official utility function. At the time of certification, the lottery offered a higher *expected* salary (102.96% of base) and, under the OPM's risk aversion calibration, a higher *expected utility*. While specific realizations may vary, the certification confirms that, on balance based on probabilities, you were not made worse off by the *opportunity* presented by VPOP. Realized losses are an inherent possibility within the positive expectation, for which you were compensated ex ante.

  **Q5: How are objections about the fairness or realism of the OPM handled?**
  A5: Objections concerning the OPM's structure or inputs can be submitted for WOC review during the public comment period preceding its biennial update (see WOC Calendar). The Committee evaluates objections against the criterion of conservatism (Clause 3.2, Protocol 4.2) and empirical plausibility. Certification decisions for specific proposals are based solely on the OPM in effect at the time of proposal submission.
