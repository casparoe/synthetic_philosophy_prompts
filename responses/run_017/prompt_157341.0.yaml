answer: |-
  Your analysis is remarkably perceptive – you've identified the core tensions within the institution of conscientious objection (CO) as it currently operates. Your "integrity-commitment" hypothesis hits a crucial nerve. Let's break down your questions systematically:

  **1. What view of pacifism/conscientious refusal does the practice presuppose?**

  Your hypothesis is largely correct. The dominant view embedded in the practice is:

  *   **Conscientious Refusal as Deep Personal Identity/Integrity:** The state treats the objection primarily as a **fundamental, defining characteristic of the individual**, akin to a core religious belief or identity marker. The focus is on the *sincerity*, *depth*, *consistency*, and *source* (often requiring a religious or similarly profound philosophical grounding) of the belief *within the person*, not on the objective truth or political validity of the claim "War is wrong" or "This war is unjust."
  *   **Pacifism as a Personal Conviction, Not a Political Claim:** The state explicitly *does not* engage with the moral truth-value of pacifism or the justice of a specific war. Accommodation is granted because forcing the individual to violate this core identity is seen as a profound harm *to them* (a violation of conscience, potentially soul-destroying), not because the state accepts their moral assessment *of war*.
  *   **Distinction from Political Dissent:** Objection must be to "war as such" precisely to filter out objections rooted in political disagreement with a *specific* war or policy. Political dissent is seen as contestable and subject to democratic processes; deep conscience is treated as inviolable *for that person*.
  *   **Protecting the Individual, Not Validating the Belief:** The exemption is a concession to individual vulnerability, not an endorsement of pacifism. This explains why pacifists still pay taxes and are bound by other laws – the state maintains its right to wage war and enforce its laws generally.

  **2. Features Presupposing vs. Fitting the Integrity View**

  *   **Strictly Presuppose:**
      *   **Inquiry into Sincerity/Depth/Source:** The board examines the *person's* belief system (religious texts, personal history, consistency of actions), not the geopolitical situation or the justice of the war. This *only* makes sense if the protected interest is the integrity of the individual's conscience.
      *   **Rejection of Selective Objection:** If the focus were on the *objective wrongness* of participating in an unjust war, selective objection would be *more* compelling. Its rejection signals that the state cares about the *nature of the individual's belief* (must be absolute) rather than the *moral reality of the conflict*. Gillette v. US explicitly framed it this way: selective objection was seen as too easily feigned and rooted in political judgment, not unalterable conscience.
      *   **Ignoring the "Truth" of Pacifism:** The state's continued war-making and taxation prove it doesn't accept pacifism as true. The accommodation is purely about protecting individuals from self-betrayal.
  *   **Fit Well (But Could Fit Other Views):**
      *   **Alternative Service:** This *fits* the integrity view by offering a way for the individual to fulfill a civic duty *without* directly violating their core conviction against killing/warfare. However, it doesn't *strictly presuppose* it. It could be justified under other views:
          *   **Act-Centered Morality:** If the wrong is solely the *direct act* of killing or military service, then hospital work might be sufficiently distinct. This is the view the state *implicitly relies on* to justify AS as non-complicity.
          *   **Complicity-Based View (as Workable Compromise):** A complicity-based pacifist *might* reluctantly accept AS as a *lesser* evil compared to military service or prison, recognizing that perfect non-complicity in a modern state at war is near-impossible. The state doesn't require this view but provides an option that *could* be accepted by someone holding it pragmatically. The *absolutist* rejecter, however, demonstrates the friction with a strict complicity view.
      *   **Punishment for Absolutists:** Fits the integrity view (the state respects the core conviction but must uphold the legal duty), but also fits state interests in maintaining order and deterring total non-compliance.

  **3. Internal Coherence: Reviewing Belief vs. Refusing to Assess War**

  The institution is **operationally coherent but morally/politically tense**:

  *   **Operational Coherence:** The state maintains a clear, administrable rule: "We accommodate deep, absolute, personal convictions against *all* war based on conscience; we do not accommodate political judgments about *this specific* war." The boards have a defined task (assess sincerity/depth) and avoid a minefield (assessing war's justice).
  *   **Moral/Political Tension:** The tension arises because:
      1.  **The Objector's Perspective:** For the selective objector, their objection *is* based on deep conscience regarding the *specific, grave injustice* of the war. Denying their claim feels like the state is privileging one *type* of conscience (absolute) over another (discriminating), despite both being deeply held.
      2.  **The State's Contradictory Stance:** The state simultaneously says "Your belief against all war is so deep we won't force you to fight" (implying a profound respect for conscience) and "But we *are* forcing others to fight this war, and taxing you to pay for it, and we deem it necessary/just" (denying the objective truth of pacifism and asserting its own judgment on the war's justice). The integrity accommodation exists *alongside* the state's assertion of its own moral authority to wage war.
  *   **Stabilized by Pragmatism:** This tension is "resolved" practically by prioritizing administrative workability, military necessity, and avoiding the chaos of individualized justice-of-war assessments. The integrity framework provides a stable, albeit imperfect, container for this compromise.

  **4. Alternative Explanations: Beyond Morality?**

  Your instincts are spot-on. The institution is **overdetermined** and serves multiple purposes beyond moral accommodation:

  *   **Administrative Convenience & Military Necessity:** Assessing every selective claim would be bureaucratically impossible and paralyze mobilization. Requiring absolute pacifism is a clearer, harder-to-fake standard. Alternative Service provides needed labor without directly weakening the military.
  *   **Preserving War Capacity:** By channeling objectors into AS and rejecting selective objection, the state minimizes disruption to military manpower and avoids legitimizing challenges to its war-making decisions.
  *   **Legitimacy & Social Cohesion:** Offering *some* accommodation (especially to religious objectors) reduces social friction, avoids creating martyrs, and makes conscription appear more humane and tolerant, bolstering the state's legitimacy. Punishing absolutists reinforces the law's authority.
  *   **Cheap Purchase of Legitimacy:** AS is often less costly than imprisonment and provides public benefit. The state gets legitimacy points for "respecting conscience" at a relatively low cost while maintaining its core war-fighting capability.
  *   **Multiple Theories:** Yes, the *same institution* can be justified by different, even conflicting, theories:
      *   **Liberalism (Integrity):** Protects individual conscience/identity.
      *   **Communitarianism/Republicanism:** Fulfills civic duty in an alternative form (AS).
      *   **Realism/Statism:** Preserves state power and military effectiveness efficiently.
      *   **Pragmatism:** Finds a workable solution to a difficult social/political conflict.

  **5. What Would Change Under Different Underlying Views?**

  *   **Complicity-Based Pacifism:**
      *   **Review of AS:** The permissibility of AS would be intensely scrutinized. Does working in a state hospital during war *materially support* the war effort in a way that constitutes unacceptable complicity? The answer might vary.
      *   **Potential Outcomes:** AS might become unacceptable to more objectors (like absolutists now). Prisons might fill faster. The state might need to offer *truly* neutral service (e.g., international humanitarian NGOs) or simply exempt without service. AS placements would face much closer ethical review regarding their connection to the military-industrial complex or war support.
      *   **Inquiry:** Boards might need to assess the objector's specific *theory* of complicity and whether AS meets their threshold.

  *   **Just-War View Recognizing Selective Objection:**
      *   **End of Absolute Requirement:** Selective objection would be permitted based on a sincere, reasoned belief that *this specific war* violates jus ad bellum criteria. Gillette would be overturned.
      *   **Radical Change in Boards:** Boards would transform into quasi-tribunals assessing the *merits* of the objector's claim about the war's injustice. They would need expertise in international law, intelligence, and just war theory. Standards of evidence and burden of proof would be critical and contentious.
      *   **Massive Administrative Burden:** Applications would skyrocket. Decisions would be complex, slow, and highly politicized.
      *   **Impact on Military:** Could significantly disrupt mobilization for controversial wars. Might create "justice assessments" parallel to government decisions.
      *   **AS or Exemption?** Selective objectors might still be required to perform AS, or might be exempted outright. Their objection is to *this fight*, not civic duty *per se*.

  *   **The View that Pacifists May Simply Be Right:**
      *   **Fundamental Shift:** This challenges the state's core monopoly on legitimate violence and its right to conscript.
      *   **Exemption Without Service:** If pacifism is potentially correct, forcing *any* alternative service as "compensation" loses moral justification. A sincere pacifist would likely be fully exempted from any service obligation tied to the war system.
      *   **End of Sincerity Tests?** If the *belief* might be *true*, the focus might shift away from probing the individual's psychology and towards the substance of the belief itself. However, practical concerns about malingering might still require some assessment.
      *   **Taxation Challenge:** The moral basis for compelling pacifists to fund wars they (potentially correctly) believe are inherently wrong becomes highly problematic. War tax resistance might gain legal traction.
      *   **Potential for Abolition:** In the extreme, widespread acceptance that pacifism *is* true would lead to the abolition of conscription and potentially major restrictions on the state's ability to wage war at all.

  **Conclusion:**

  You've astutely identified that the institution of conscientious objection, particularly its focus on absolute pacifism and alternative service, functions primarily as an **integrity-protecting accommodation**. It's a pragmatic compromise shaped more by the state's need for administrative efficiency, military readiness, and social legitimacy than by a deep engagement with the moral philosophy of war. While tensions exist (especially regarding selective objection and complicity), the current structure provides a relatively stable, though imperfect, mechanism for balancing the claims of individual conscience against the demands of the state in times of conscription. Changing the underlying philosophical assumptions would necessitate profound, likely destabilizing, reforms to the entire system.
