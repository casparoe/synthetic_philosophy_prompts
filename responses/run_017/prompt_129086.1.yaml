  | (6)→(7)         | Modal slide                 | Assumes rejecting (1) requires "spooky metaphysics," but narrative meaning is social, not mystical. | Must ground value in communal practices, not undetectable essences. | "We care where things come from because it ties us to real people, real time."           |

