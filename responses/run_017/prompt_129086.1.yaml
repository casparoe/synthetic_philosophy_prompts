  ### Key Explanations  
  - **Why (3) fails**: The granddaughter conflates *perceptual* indistinguishability with *semantic* indistinguishability. The painting’s physical traits are unchanged, but its identity as a cultural artifact is shattered. The town’s tea-towels celebrated a connection to a 17th-century master—now they commemorate a 1920s deception. This historical rupture alters meaning, even if the canvas looks identical.  
  - **Disclosure paradox**: The forgery is the vandalism; disclosure is restoration. Silence perpetuates fraud. The granddaughter’s framing blames the whistleblower, but the conservator can argue: "The lie poisoned the well. I’m just diagnosing the sickness."  
  - **Conservator’s core insight**: Value isn’t in the pigment—it’s in the chain of human hands and intentions. The chance panel has no such chain; the forgery has a broken one.  
  - **Forger’s retort**: The granddaughter weaponizes empathy—"You’ll hurt people for abstract truth." This forces the conservator to choose: protect comfort or honor history.  

  ---  
  **Final note**: The conservator’s strongest line rejects the binary of "spooky metaphysics" vs. "only what’s detectable." She can say:  
  *"This isn’t about ghosts in the paint. It’s about respect—for the artist we thought we knew, for the town that loved it, even for your grandmother. Lies rot that respect."*  
  This grounds value in ethics, not physics—a defense even a non-philosopher can wield.
