prompt: |-
  A friend sent me a blog post explaining updateless decision theory and I can't tell how much of it I should actually believe. Roughly, it says this:

  UDT says you should never update on your evidence -- a UDT agent ignores what it observes and instead asks which policy it would have wanted to commit to from behind the veil of ignorance, before it knew anything at all, and then mechanically does that. That's why it one-boxes in Newcomb's problem: not because one-boxing is evidence that the million is there, but because "always one-box" is the policy you'd have picked in advance, so that's what it executes. This matters because UDT wins the cases where causal decision theory loses money, like Newcomb's problem and Parfit's hitchhiker. But it also means a UDT agent pays up in counterfactual mugging, handing over money on the strength of a branch of the coin that didn't happen, and since nobody sane would pay there the theory is refuted -- it's a curiosity about perfect predictors and brain copies with no bearing on real decisions. (He also keeps calling it "functional decision theory, as people usually say now", as if that's just a rename.)

  I'm fairly sure the "never updates on anything" bit can't be right -- obviously the thing has to react to what it sees -- but I cant say what goes in its place, and the rest of it sounds plausible to me. So: which parts would someone who actually works on this accept, which are distortions, and is the counterfactual mugging point really the refutation he takes it for?

  I also tried testing it on a case of my own and dont trust my answer. Someone scanned me yesterday without telling me. Today they run that scan as a simulation and tell it: "you're the sim -- pay $1,000 and we'll give the real you $100,000; you yourself get nothing either way." Then they come to the real me, explain the whole setup, and offer me the same $1,000 deal, except that for me the payout is already fixed by what the sim did, so my paying changes nothing. My friend says the post's version of UDT is committed to "the sim pays, the real you refuses, and you walk away with $100,000 for free," which he says is just magic. Does the version in the post actually say that, and does the real thing?
reasoning: |-
  Okay, let me try to unpack this user's query. They're confused about Updateless Decision Theory (UDT) after reading a blog post. The post claims UDT agents never update on evidence, which seems off because agents obviously need to react to observations. The user also mentions counterfactual mugging as a supposed refutation and a personal thought experiment where UDT might lead to a "free $100,000" outcome. 

  First, I need to correct the "never updates" misconception. The blog post oversimplified here—UDT absolutely uses observations, but not for Bayesian updating of beliefs about the world. Instead, it uses them to index into a precomputed policy. The veil-of-ignorance framing is key: you choose a strategy upfront for all possible observations, then execute it mechanically. That explains Newcomb's one-boxing—it's not about evidence but precommitment. 

  The counterfactual mugging point is where things get thorny. The blog post calls UDT "refuted" because it pays in a scenario where humans wouldn't. But that misunderstands UDT's purpose: it's designed for idealized problems with perfect predictors, not as a descriptive human psychology model. Defenders would argue paying in mugging is rational if you view your decision algorithm as a fixed mathematical object—your "twin" in other branches is part of your logical identity. 

  For the user's simulation dilemma: the blog post's take ("sim pays, real you refuses, free money") is technically what vanilla UDT would do, but it's not magic—it's the policy working as intended. The sim pays because it's playing the role of "agent seeing simulation-observation," and the real you refuses because it observes "real-world" and follows the policy's output for that case. Of course, this relies on the scanner being perfectly trustworthy, which is unrealistic. 

  The user seems analytically sharp—they spotted the update paradox and tested UDT with their own case. Their underlying worry might be: "Is this philosophy or is it practical?" I should emphasize UDT's niche (theoretical alignment research) while acknowledging its strangeness in mugging-like cases isn't a bug but a feature. Also, clarify that "Functional Decision Theory" is indeed a rebranding by some researchers to generalize the idea. 

  ...Wait, did the blog post call UDT "refuted" based solely on mugging? That feels like dismissing general relativity because it breaks at singularities. UDT solves *different* problems than CDT/EDT. Maybe the user needs that context most.
answer: |-
  Your skepticism is well-founded—that blog post contains significant distortions and oversimplifications. Here's a breakdown of what's accurate, what's misleading, and why counterfactual mugging isn't a "refutation":

  ### Key Corrections to the Blog Post
  1.  **"Never updates on evidence" is a severe misrepresentation.**
      *   **Reality:** UDT absolutely *uses* observations—it couldn't act otherwise. The key difference is *how* it uses them.
      *   **UDT's actual flow:**
      1.  **Pre-Commitment (Veil of Ignorance):** Before having *any* specific observations, the agent chooses a *policy function* mapping *possible future observations* to *actions*. This policy is selected to maximize expected utility across all possible worlds/observations it might find itself in.
      2.  **Execution:** Upon making an actual observation `O`, the agent *looks up* the action specified by its pre-committed policy for input `O` and executes it mechanically. **It doesn't "update" its *beliefs about the state of the world* in the standard Bayesian sense to decide the action *now*; it relies solely on the pre-computed policy.**
      *   **Analogy:** Think of writing a computer program *before* knowing the input. When the input arrives, the program executes the pre-written instructions for that input. The program "reacts" to the input, but its behavior was determined beforehand.

  2.  **Newcomb's Problem: Correct Intent, Simplified Explanation.**
      *   Yes, UDT one-boxes because "always one-box" is the policy that maximizes expected utility *from the perspective of initial ignorance*. It avoids CDT's trap of thinking "My choice *now* can causally influence the Predictor's past decision." UDT reasons: "Before I knew what box I was facing, committing to one-boxing led to a better overall outcome across possible worlds where the Predictor is accurate."

  3.  **Counterfactual Mugging: Feature, Not (Necessarily) a Bug.**
      *   **The Setup:** Omega flips a coin. Heads, it asks you for $100. Tails, if you would have paid had it been heads, Omega gives you $10,000 (otherwise, nothing). The coin was tails. Do you pay the $100?
      *   **UDT Pays:** The pre-committed policy that says "Pay if asked" yields $10,000 in the Tails world, while "Don't pay if asked" yields $0. From the veil of ignorance, "Pay if asked" has higher expected utility ($5,000) than "Don't pay" ($0). So, upon observing "Tails & Asked", the policy outputs "Pay".
      *   **Is this "Insane"?** Critics argue paying $100 for literally nothing *feels* irrational. Proponents argue:
          *   It's logically consistent with viewing your decision algorithm as a fixed object Omega can reason about.
          *   Refusing "refutes" the logical dependency Omega relies on, destroying the *possibility* of the $10,000 gain in the Tails branch.
          *   It highlights UDT's focus on the *logical consequences* of the policy choice across all branches, not just the current causal situation.
      *   **Not a Refutation:** This is a *deliberate consequence* of UDT's core principle. Whether it's desirable is debated, but it's not an accidental flaw; it's the theory working as designed in a scenario highlighting the difference between causal and logical dependence. Many researchers accept this as a valid (if counterintuitive) solution.

  4.  **"Functional Decision Theory" (FDT): More Than Just a Rename.**
      *   While closely related to UDT, FDT (MIRI, Yudkowsky, Soares) is often presented as a refinement/generalization emphasizing that agents should optimize over the *outputs of their decision function* across all scenarios where that function is called (logical counterfactuals). It captures the same core "veil of ignorance" policy commitment idea but frames it slightly differently. Calling it "just a rename" undersells the nuances, though the core similarity is high.

  ### Your Simulation Scenario: UDT's Answer
  The blog post's description of UDT *is* committed to the outcome your friend calls "magic":
  1.  **The Sim Pays:** When the simulation observes "I am the simulation", the pre-committed policy (chosen from the veil of ignorance) dictates: "If you observe 'simulation', pay the $1,000." It does this *not* because it thinks its payment causes anything for the real you, but because committing to this policy *before knowing* if you'd be the sim or the real agent leads to the best overall outcome. The sim is playing its assigned role in the optimal policy.
  2.  **The Real You Refuses:** When the real you observes "I am the real agent", the pre-committed policy dictates: "If you observe 'real agent', do not pay the $1,000." The money is already secured by the sim's action (assuming the scanner is trustworthy and the setup is understood). Paying now would be a useless $-1,000.
  3.  **Result:** Real you gains $100,000 at the cost of the sim's $1,000. Since the sim is "you" only in a computational sense, you (the real, biological you) experience a net gain of $99,000.

  **Is this "Magic"?** Within the idealized assumptions (perfect trust in the scanner/setup, the sim being a perfect instantiation of your decision algorithm), it's consistent UDT reasoning. The "magic" stems from:
  *   **Logical Dependency:** The scanner/simulator *relies* on knowing the real you and the sim share the *same* fixed decision policy. The real you's precommitment *forces* the sim to pay. The sim isn't "sacrificing for you"; it's mechanically following the only policy that makes sense from the initial perspective.
  *   **No Free Lunch:** The real you benefits *because* the sim, implementing the *same* policy, paid in a situation where *its* action was necessary for the real you's benefit. If the real you had been scanned, *they* would have been the one paying $1,000 in the sim role to benefit the other instance.

  **Does "Real" UDT/FDT Say This?** Yes, this is a standard application of the theory to such "acausal" (logical) interactions. It's not a distortion by the blog post. Whether this is *realistic* or *sane* depends on accepting the core UDT/FDT premise: decisions should be made by precommitting to a policy optimizing over all instances where your decision algorithm is invoked.

  ### What Researchers Accept
  1.  **Core Premise:** Choosing actions by precommitting (from ignorance) to a *policy* mapping observations to actions, rather than choosing actions based on updated beliefs in each situation, is a powerful and distinct approach to decision theory.
  2.  **Solves Key Problems:** UDT/FDT correctly handles Newcomb, Parfit's Hitchhiker, and other problems involving predictors or logical dependencies where CDT fails.
  3.  **Counterfactual Mugging:** Paying is the correct solution *within the UDT/FDT framework*. Researchers accept this as a *consequence* of the theory. Debate centers on whether this is a strength (logical consistency across branches) or a weakness (counterintuitive, potentially exploitable in non-idealized settings).
  4.  **Role of Observations:** They are inputs to the policy function, not triggers for belief updates relevant to *that specific decision*. The policy itself was chosen considering the probabilities of different observations.
  5.  **Niche Applicability:** UDT/FDT is primarily seen as crucial for reasoning about:
      *   Advanced AI alignment (agents with the ability to self-modify or reason about their own source code).
      *   Highly idealized scenarios with perfect predictors or simulations (like the ones discussed).
      *   Logical counterfactuals and acausal trade.
      It's not generally presented as a complete replacement for CDT/EDT in everyday human decisions under normal uncertainty.

  ### In Summary
  *   **Believe:** UDT/FDT uses precommitment to a policy chosen from ignorance; it handles Newcomb correctly; it pays in Counterfactual Mugging and your simulation scenario as described.
  *   **Don't Believe:** The "never updates" caricature. UDT uses observations as critical inputs to its precomputed policy.
  *   **Distortion:** Calling Counterfactual Mugging a "refutation" misrepresents it. It's a challenging but intentional consequence central to understanding the theory.
  *   **Your Scenario:** UDT/FDT *does* produce the "sim pays, real you refuses, net gain" outcome. Whether this feels like "magic" highlights the theory's reliance on logical dependencies and treating multiple instances (sim/real) as implementing the same abstract decision function. Its realism depends entirely on accepting the idealized setup where the scanner perfectly instantiates your decision algorithm and the dependency is known/trusted. In messy reality, this is far less applicable.
