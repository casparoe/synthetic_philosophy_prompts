prompt: |-
  I'm a rising senior at a large public high school, and this summer I'm doing two things at once: an online philosophy course (my first — I have no philosophy background beyond it) and a lot of competitive programming. The programming I'm genuinely fluent in: Python and NumPy, writing Monte Carlo estimators, thinking about tail behaviour and overflow, Kahan compensated summation, and the fact that floating-point addition isn't associative, so that the order in which you sum a list of numbers changes the answer you get. The maths I have is BC Calculus — I know what a conditionally convergent series is, but not much more than that.

  The course recently spent a session on a puzzle that I can't tell whether I've understood or whether I've quietly translated it into something I already know and thereby ruined it. A fair coin is tossed until it first lands heads; if the first heads is on the nth toss, you win 2^n/n dollars when n is odd and lose 2^n/n dollars when n is even, and that outcome has probability 1/2^n — so +$2 with probability 1/2, −$2 with probability 1/4, +$8/3 with probability 1/8, and so on. Working term by term, the expected value is 1 − 1/2 + 1/3 − 1/4 + ..., the alternating harmonic series: added up in that order it converges to ln 2, about 69 cents, but it's only conditionally convergent, so the terms can be rearranged to add up to any number at all, or to diverge. The instructor's conclusion was that the game has no expected value, and she stressed that this is different from the St. Petersburg game, where the expected value is infinite but perfectly well-defined — a distinction I didn't really follow. Someone on the course forum said the real diagnosis is that the sum of (probability × absolute payoff) diverges: here it's 1 + 1/2 + 1/3 + ..., the plain harmonic series. That much I could check myself, and it made me suspect the puzzle has nothing to do with the payoffs being enormous. I also simulated ten million plays. The running average seemed to hover near 0.69, but it kept getting kicked by rare enormous payoffs — several dollars at a time, occasionally much more — and I genuinely couldn't tell whether it was converging to something or whether I had just been lucky so far about which huge payoffs hadn't turned up yet.

  My own reaction was that this is a non-problem, and that it dissolves completely in my vocabulary, in two steps. First: there is a non-arbitrary order on the outcomes, namely the order in which the coin tosses actually happen, so just define the value as the limit of the partial sums taken in that order — you get ln 2, and the fact that other orderings disagree is a fact about series, not about the game. Second: this looked to me like exactly the situation I already deal with in floating point, where the sum of a list depends on the order you add in; we fix an order, or compensate for the error, and nobody concludes that the sum fails to exist. I have a standing bet with a friend from the course about this — she says the game is worth about 69 cents, I say it's worth nothing, because something with no expected value can't have a price — and we agreed to get a second opinion.

  So: could you restate the puzzle, and the disagreement around it, as faithfully as you can in the vocabulary I actually have — finite samples, summation order, floating-point error, estimators that may or may not converge, tails, truncation, overflow — and then give me the residue report? Which parts map cleanly onto something I already understand; which parts you had to bend or fudge to make them fit; and which parts have no counterpart in my vocabulary at all (I suspect the word "should" is one of them — nothing in my code expresses what it would be rational to pay to play). And then, on the basis of that report, a verdict: is what's left over a gap in my vocabulary, which is mostly a vocabulary of finite, noisy, computable things, or a sign that "expected utility," as the philosophers are using it there, is doing less work than it looks like it's doing? Please also flag the point at which your translation is most likely to be a distortion rather than a translation — where you had to smuggle in something my vocabulary doesn't contain — and say what would change your mind about that, ideally one consideration I could check on my own laptop.
