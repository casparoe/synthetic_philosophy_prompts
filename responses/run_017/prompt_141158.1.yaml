prompt: |-
  I've been trying to work out what I actually think privacy is, by trusting my gut on a list of cases and then asking what principle the verdicts add up to. I keep failing to find one principle that fits them all, and I'd like your help. No reading lists, citations, or references, please — I can't look anything up, and what I want is the principle itself, not where to read about it.

  Here are the cases and my verdicts.

  **C1.** My landlord installs a device in my apartment that watches continuously and processes the video on the spot, purely to count how many people are in the room so the heating can be adjusted. Footage is deleted every thirty seconds. No human ever sees it, nothing about what I do is ever stored, and nothing about me is ever inferred by anyone. My verdict: a clear and serious violation — the worst thing on this list. But if the identical device with the identical setup were in the building's shared lobby, which I walk through every day, I'd say it was fine, and I can't say what the difference is.

  **C2.** A data broker assembles a dossier about me — address, employer, hometown, the names of the people I live with, my political donations — and sells it to an insurer. Every item in it comes from a page I myself put up or agreed to publish. My verdict: a violation, and a worse one than any single one of those publications was.

  **C3.** A stranger who knows nothing about me goes and reads those same public pages, one at a time, over a week, and forms roughly the picture of me the dossier contains. My verdict: no violation at all. This is the pair I can't reconcile: C2 and C3 seem to differ only in that the broker's copy is cheaper to use.

  **C4.** The model on my phone — it runs entirely on the device, and nothing is transmitted anywhere — infers from my typing rhythm and app-switching that I am probably pregnant, and starts showing me prenatal ads. The inference is true. I hadn't told anyone. No one at any company ever learns it. My verdict: a violation, though a milder one than C1.

  **C5.** My ex-partner, who knows all manner of intimate things about me from the years we lived together, passes a few of them to an insurer that sets premiums with them. Nothing was accessed, hacked, bought, or inferred; they simply said what they already knew. My verdict: something is badly wrong here, and my first instinct is to call it a violation of my privacy — but it may be a different kind of wrong wearing privacy's clothes, and I can't tell which.

  **C6.** A colleague tells people I have a gambling problem. It is false, and it costs me a great deal. My verdict: a serious wrong, but not a violation of my privacy — which I think matters, because it suggests privacy isn't about what others believe about me, or about my reputation.

  **C7.** A close friend, over months, notices changes in me and works out correctly that I'm depressed. She never asks, never looks at anything of mine, never opens anything. She just starts checking in on me more. My verdict: I go back and forth. Sometimes this feels like the most intimate intrusion imaginable; sometimes it feels like the precise opposite of one.

  My own rule of thumb, such as it is: privacy is violated when someone makes me the object of their attention in a way I haven't agreed to. That gets C1 and C4, but it also says the stranger in C3 and the colleague in C6 violate my privacy, and I don't believe that. And the common alternative — that privacy is my control over information about myself — seems to get C2 and C3 backwards and to have nothing to say about C4, where no information goes anywhere.

  So: is there one principle that captures all seven verdicts, or close, and what does it say about C7? If no single principle does the work, give me the two or three best candidates, state each precisely enough that I could apply it to a case you haven't seen, and tell me plainly which of my verdicts each one forces me to give up — including whether C2 and C3 can really come apart, or whether one of them has to go. I'd also like to know whether my seven cases even settle the question, or whether they are consistent with several quite different theories that would diverge elsewhere.

  Please give me, first, at most about 500 words of prose: the candidates, the tension between them, which of my verdicts each sacrifices, and your recommendation. Say plainly how confident you are in that recommendation, and single out the one point in your answer you are least sure of and what would change your mind about it.

  Then give me a single JSON object in a fenced code block, parsable as-is, with this exact schema:

  - `principles`: array of 2–3 objects, one per candidate (including my rule of thumb if it survives repair), each with:
    - `id`: short string, e.g. `P1`
    - `name`: short descriptive label of your own coining
    - `statement`: one or two sentences, precise enough to apply to an unfamiliar case
    - `clauses`: array of objects `{clause, motivating_case}` — each clause of the principle paired with the case label that forces it
    - `verdicts`: object mapping each of `C1`–`C7` to one of `"violation"`, `"no violation"`, `"unclear"`
    - `severity_rank`: array of the case labels you count as violations, ordered from most to least serious, and nothing else
    - `sacrifices`: array of case labels whose verdicts it cannot match, each with a one-sentence `why`
    - `cost`: one sentence on what this principle buys its fit with, i.e. what complexity or independent counterintuitiveness it commits me to
  - `my_principle`: object with `restated`, `cases_it_misses` (array of labels), `smallest_repair`, and `repair_is_ad_hoc` (boolean plus one sentence of justification)
  - `verdicts_to_overturn`: array of `{case, my_verdict, recommended_verdict, why}`, empty if none
  - `undecided_case`: object with `case` (`C7`), `verdicts_by_principle` (object mapping principle ids to verdicts), `recommended_verdict`, and `decisive_consideration` (one sentence on what settles it if anything does)
  - `novel_case`: object with `scenario` (one sentence describing a case of your own construction, not on my list), `discriminates` (one sentence on which candidates it separates and how), and `verdicts_by_principle`
  - `underdetermination`: one or two sentences on whether my seven cases could in principle select a single theory, or whether they leave the field genuinely open
  - `confidence`: object with `overall` (one of `"low"`, `"medium"`, `"high"`), `confidence_in_ranking` (integer 0–100), `most_confident_claim` (one sentence), and `least_sure_point` (object with `claim` and `what_would_change_it`)
reasoning: |-
  Hmm, the user is wrestling with defining privacy through concrete cases and their gut reactions. They've presented seven scenarios with their verdicts, and their own rule of thumb fails to cover all cases consistently. The core tension seems to be between control-based definitions and attention/intrusion-based ones, neither fully capturing their intuitions.

  Looking at C1 and C4, the user feels violated even when no information leaves the local environment. This suggests privacy isn't just about data transmission but about being subjected to unwanted perception or analysis. Yet in C3, public information gathering by a human feels acceptable while automated compilation (C2) doesn't - pointing to a distinction between natural cognition and systematic processing.

  The ex-partner case (C5) is particularly thorny. The wrong feels privacy-related but might actually be about betrayal of trust. Meanwhile C7 shows how even well-intentioned perception can feel intrusive when it bypasses consent. The gambling lie (C6) confirms privacy isn't about false information per se.

  I see three candidate principles emerging:
  1) The "Systematic Access" principle focuses on institutionalized data processing - it explains C2's dossier being worse than C3's manual research because of scale and permanence. But it struggles with C1 where no data persists.
  2) The "Unconsented Perception" principle captures the visceral discomfort in C1, C4 and possibly C7 by focusing on being made an object of attention. However, it would wrongly condemn the manual researcher in C3.
  3) A hybrid "Contextual Integrity" approach that considers whether information flows violate contextual norms. This handles C1 (home vs lobby), C2 (compilation vs individual access), and C5 (ex-partner sharing intimate knowledge) well but becomes vague in novel situations.

  For C7, the perception feels violating when framed as bypassing consent, acceptable when seen as care. The hybrid principle allows this ambivalence by recognizing contextual relationships matter. The novel case about a public camera with AI analysis would test whether it's the systematic processing or the public setting that matters more.

  The cases underdetermine theory - they don't force one clear winner. I'm most confident that privacy violations require more than just information control (hence C4 matters), least sure about where to draw the line in C7. The JSON will formalize these tradeoffs.
answer: |-
  Your cases reveal a fundamental tension between two aspects of privacy: **unwanted perception/analysis** and **systematic alienation/control of information about you**. No single principle perfectly fits all verdicts without sacrificing at least one strong intuition. Here are three candidate principles, each sacrificing different cases:

  1.  **P1: Systematic Alienation Principle**: Privacy is violated when information about you is systematically processed, aggregated, or made permanently accessible by an entity (person or system) in a way that alienates it from your contextual control or exposes you to institutional scrutiny you didn't consent to.
      *   **Sacrifices**: C1 (no systematic alienation/accessibility - data ephemeral and local), C7 (human perception isn't systematic alienation).
      *   **Cost**: It struggles with purely local, ephemeral analysis (C1, C4) feeling violating, and makes human perception (C3, C7) always non-violating.

  2.  **P2: Unconsented Perception Principle**: Privacy is violated when you are made the object of sustained observation, analysis, or inference (by human or machine) within a context where you reasonably expect refuge from such scrutiny, without your consent.
      *   **Sacrifices**: C2 (the *act* of compiling public info isn't perception, though *use* might be), C3 (the stranger's manual perception isn't violating).
      *   **Cost**: It struggles with the compilation of public data (C2) feeling worse than its manual collection (C3), and makes C7 always a potential violation if "sustained analysis" applies.

  3.  **Hybrid P3: Contextual Integrity Breach**: Privacy is violated when information about you is observed, inferred, used, or transferred in a way that breaches the norms of appropriateness or flow governing that specific context or relationship.
      *   **Sacrifices**: None directly, but verdicts depend heavily on interpreting contextual norms (e.g., C7 hinges on friendship norms). It can justify all your verdicts but relies on external norms.
      *   **Cost**: It requires defining complex contextual norms independently, making it less predictive without that prior understanding. It risks vagueness.

  **Recommendation & Confidence**: **P3 (Contextual Integrity Breach)** best preserves *all* your verdicts. It explains:
  *   C1: Home has a norm against surveillance; a lobby doesn't.
  *   C2 vs C3: Compiling a dossier breaches the norms of how public information is *typically* accessed/used, even if individual accesses don't.
  *   C4: Phone inference breaches the norm of "personal device as private space".
  *   C5: Ex-partner sharing breaches relationship/confidentiality norms.
  *   C6: Lying breaches truth norms, not necessarily privacy norms.
  *   C7: Ambiguous because friendship norms around observation/care vary.
  **Confidence: Medium.** It fits best but relies on contestable interpretations of context. **Least Sure Point:** Whether C2's violation stems purely from breached norms or involves an inherent wrong in systematic alienation independent of context. If C2 still feels violating even within norms permitting data brokerage, P1 gains strength.

  **Your Rule of Thumb:** Restated as "Privacy is violated by unconsented attention making you an object of scrutiny in a context expecting refuge." It misses C2 (compilation isn't direct attention) and forces violation verdicts for C3 & C6. Smallest repair: Add "...or when information about you is systematically aggregated/alienated without consent." This is somewhat ad hoc (combining perception and alienation) but closer to P3.

  **Verdicts to Overturn:** None recommended. P3 supports all your initial verdicts.

