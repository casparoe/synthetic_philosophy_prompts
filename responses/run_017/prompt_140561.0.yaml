answer: |-
  Here's a breakdown of your summary, categorized as requested. I'll be explicit about consensus vs. controversy, mark my confidence, and flag where professionals disagree. My assessment is based on the current (2023) state of the philosophy of physics literature surrounding Everettian QM (EQM), particularly the Born rule debates.

  **Key:**
  *   ✅ **Accept (Standard View):** Core EQM tenets widely endorsed by proponents.
  *   🟡 **Accept but Restate Carefully:** Correct in spirit, but phrasing is often metaphorical, misleading, or hides subtlety/debate.
  *   ❌ **Reject or Wince At:** Views not held by serious EQM proponents or actively contested.
  *   🧩 **Live Dispute:** Area of significant ongoing philosophical debate *within* EQM.
  *   *(Confidence: High/Medium/Low)* - My confidence in this categorization.

  ---

  **Breakdown of Your Summary:**

  1.  **"Every outcome with nonzero amplitude happens in some branch, so there's no collapse and no fundamental randomness — the universal wavefunction just evolves deterministically..."**
      *   **Verdict:** ✅ **Accept (Standard View)**
      *   **Confidence:** High. This is the *definition* of the Everett interpretation (Many-Worlds). Decoherence explains the *appearance* of distinct "worlds" or branches. Deterministic unitary evolution is fundamental. Absolutely uncontroversial among Everettians.

  2.  **"...the appearance of randomness is an illusion created by decoherence splitting the world into branches that can't see each other."**
      *   **Verdict:** 🟡 **Accept but Restate Carefully**
      *   **Confidence:** High. Correct core idea. However:
          *   "Illusion" can be slightly misleading. The randomness is *subjective/epistemic* (due to the agent's perspective), not ontological, but the branching and distinct experiences are real.
          *   "Can't see each other" is a good pop-sci phrase, but technically it's about the practical irreversible loss of interference due to decoherence and environmental entanglement. "See" implies observation, but the mechanism is more fundamental.

  3.  **"The hard part is probability: if every outcome happens, what can it even mean to say this one has probability one third?"**
      *   **Verdict:** ✅ **Accept (Standard View)**
      *   **Confidence:** High. This *is* the central conceptual problem of EQM, universally acknowledged by proponents and critics alike.

  4.  **"The now-standard Everettian answer is that you have self-locating uncertainty. Before a measurement you don't know which branch you're going to end up on..."**
      *   **Verdict:** 🟡 **Accept but Restate Carefully**
      *   **Confidence:** High. The framework of self-locating uncertainty (SLU) is indeed the dominant approach. Crucially:
          *   It's uncertainty about *which future branch* (containing a future copy of "you") *you* will find yourself experiencing after the branching event.
          *   "End up on" is slightly passive; the branching creates the copies, and each copy finds itself on a branch.
          *   SLU provides the *structure* for assigning probabilities. It doesn't, by itself, tell you *what* probabilities to assign. That's the job of arguments like Deutsch-Wallace.

  5.  **"...so you assign a credence to each possibility, and the rational credence turns out to be the squared amplitude — which is just the Born rule."**
      *   **Verdict:** 🧩 **Live Dispute** (This is the **crux** of your suspicion, and you're right to focus on it)
      *   **Confidence:** Medium (on the "turns out to be" being uncontroversially derived). *Most* working Everettians publishing in this area endorse *a* decision-theoretic or similar approach (like Deutsch-Wallace, Greaves-Myrvold, Vaidman's "caring measure", or Zurek's envariance) to derive the Born rule as the rational credence *given SLU*. **However:**
          *   **The Load-Bearing Part:** The inference from "rational credence given SLU" to "objective probability is the Born rule" **is the core of the dispute**. Critics argue these derivations either:
              *   Smuggle in the Born rule implicitly through their axioms/constraints (e.g., "Branch Indifference" or "Measurement Neutrality" might presuppose a norm equivalent to the Born rule). *(Your suspicion is valid here - this is a major criticism line from philosophers like Adrian Kent, David Albert, and Simon Saunders in some moods).*
              *   Derive only that a rational agent *acts as if* the Born rule is true, not that the Born rule *describes an objective chance* process (the "Functionalist" vs. "Realist" views on probability in EQM).
              *   Fail to genuinely solve the "incoherence problem": if all outcomes happen, what physical fact makes it rational to be *surprised* by a low-amplitude outcome? (The answer relies heavily on the "measure" discussed next).
          *   **Proponents' Counter:** Deutsch-Wallace (DW) argue their constraints (like consistency across branching events, diachronic coherence) are minimal requirements for *rationality in a branching universe*, independent of quantum specifics. They claim the Born rule *falls out* purely from these + the unitary dynamics. They see it as a genuine derivation of objective rational credence.
      *   **Professional Disagreement:** Significant. While DW-style arguments are influential and accepted by many leading Everettians (Wallace, Saunders, Vaidman, Carroll, Tappenden), they face strong criticism from others *within* QM foundations (Kent, Albert, Maudlin, Price) and even some sympathetic to EQM (e.g., parts of Saunders' work express concern). The debate centers on whether the rationality constraints are truly "obvious" and non-question-begging.

  6.  **"The squared amplitude is really a kind of measure of existence: branches with larger amplitude are, in some sense, more real or thicker or take up more of the multiverse..."**
      *   **Verdict:** 🟡 **Accept but Restate Carefully** (Metaphor) and 🧩 **Live Dispute** (Interpretation)
      *   **Confidence:** High (on need for restatement), Medium (on dispute). This is crucial:
          *   ✅ **Measure:** It's uncontroversial that the squared amplitude defines a *measure* (a positive function) over the branches emerging from decoherence. This measure is additive, conserved under unitary evolution, and mathematically natural.
          *   ❌ **"More real / Thicker":** Serious Everettians **reject** this phrasing. It's considered a misleading metaphor. All branches are equally "real" in the ontological sense - they all exist as parts of the universal wavefunction. The measure isn't a degree of reality.
          *   🟡 **"Take up more of the multiverse":** This is a *better* metaphor for the *measure*, but still potentially misleading. It signifies that branches with higher measure are, in a precise mathematical sense, "larger" or "more numerous" *relative to the measure*. It doesn't mean physical space; it's an abstract weighting.
          *   🧩 **The Live Dispute:** What is the *status* of this measure, and *why* should rational credence track it? Is it a "caring measure" (Vaidman)? Does it represent a density of observers/minds? (Generally rejected as problematic). Is it primitive? Or is its connection to probability *only* justified via the decision-theoretic arguments (which are themselves disputed)? Critics (e.g., Maudlin) argue that without an *independent* justification for why credence should track this particular measure (as opposed to, say, amplitude itself or unity), the derivation is circular.

  7.  **"...and that's why you should expect to find yourself in one in proportion to its amplitude [squared]."**
      *   **Verdict:** 🟡 **Accept but Restate Carefully** & 🧩 **Live Dispute** (Justification)
      *   **Confidence:** Medium. This is the *conclusion* proponents want to reach. However:
          *   "Expect to find yourself" needs the context of SLU: upon branching, your future self *will* find itself on *a* branch, and the claim is that rational pre-branching credence about *which* future branch you'll experience should be proportional to the Born measure.
          *   The **"why" is entirely dependent on the success of the Deutsch-Wallace-type arguments or alternatives**. If those arguments fail or are question-begging, then this claim lacks its foundational justification. It's not *directly* obvious from the measure alone.

  8.  **"The Deutsch–Wallace decision-theoretic argument makes this rigorous: they show that any agent whose preferences satisfy a handful of obviously-rational-sounding constraints has to bet exactly as if the Born rule were true..."**
      *   **Verdict:** ✅ **Accept (Standard View)** (as description of DW's *claim*) & 🧩 **Live Dispute** (on "obviously-rational-sounding" and the conclusion drawn)
      *   **Confidence:** High (description), Medium (controversy level). DW indeed make this argument. The dispute is:
          *   Whether the constraints (e.g., Ordering, Diachronic Consistency, Macrostate Indifference, Branching Indifference/Measurement Neutrality) are truly minimal requirements of rationality *specific to branching scenarios*.
          *   Whether these constraints are *truly independent* of the Born rule or subtly assume it (e.g., Branching Indifference says an agent shouldn't care *how* a branch splits into finer-grained branches as long as the outcomes are the same - critics argue this presupposes the measure is irrelevant to preference, which is part of what needs proving).
          *   Whether deriving *betting behavior* is sufficient to derive *probability*. (Proponents say yes for subjective probability/credence; critics might demand more for "objective chance").

  9.  **"...which settles it — the probabilities aren't bolted on to the theory as an extra postulate, they're derived from the dynamics plus rationality alone, so the Born rule is now a theorem of many-worlds rather than an assumption."**
      *   **Verdict:** ❌ **Reject or Wince At** (as settled) & 🧩 **Live Dispute** (as a universally accepted conclusion)
      *   **Confidence:** High. This is *exactly* where the controversy lies.
      *   **Why Wince/Reject?**
          *   **Not Settled:** The philosophical literature is *full* of papers arguing *against* the adequacy of DW and similar derivations. It's one of the most active debate areas in EQM. Claiming it "settles it" is strongly rejected by critics and would make many proponents uncomfortable due to the ongoing scrutiny.
          *   **"Dynamics plus Rationality Alone":** Critics argue "rationality alone" is doing too much work and that the specific constraints encode quantum assumptions or the desired conclusion. Proponents argue the constraints are purely about rationality in a branching universe.
          *   **"Theorem of Many-Worlds":** Proponents *claim* this. Critics argue it's circular or that the "theorem" relies on axioms that are not intrinsic to the *physics* of EQM but are imported decision-theoretic principles whose applicability *to EQM* is precisely what's in question. The derivation relies *heavily* on interpreting the quantum state *as* describing branching worlds with a measure, which some argue is already adding structure beyond pure wavefunction dynamics.

  10. **"Collapse models and Bohmian mechanics, by contrast, have to put the Born rule in by hand, so Everett wins on parsimony."**
      *   **Verdict:** 🟡 **Accept but Restate Carefully** (Parsimony Claim) & 🧩 **Live Dispute** (Effectiveness of Derivation)
      *   **Confidence:** Medium.
          *   ✅ It's true that Collapse models (GRW, CSL) and Bohmian mechanics *postulate* the Born rule as part of their fundamental dynamics or guidance equation. EQM *attempts* to derive it from unitary dynamics + decision theory.
          *   🧩 Whether EQM *succeeds* in this derivation (as per points 5-9) is disputed. If the derivation fails or is circular, then EQM hasn't *achieved* greater parsimony; it may have just hidden the postulate within the decision-theoretic axioms or the interpretation of the wavefunction as many worlds with a measure. Proponents argue the derivation is valid and thus parsimony is achieved; critics deny this. Parsimony only "wins" if the derivation is sound.

  11. **"One upshot people balk at: because the measure of a branch can get arbitrarily tiny without ever reaching zero, there's always some version of you that sees a million heads in a row — it's just extremely low-measure, so you shouldn't plan around it."**
      *   **Verdict:** ✅ **Accept (Standard View)**
      *   **Confidence:** High. This is a straightforward consequence of EQM + the Born measure. All possible outcomes (with non-zero amplitude) occur. Very low-measure branches exist. The "shouldn't plan around it" is justified *by* the decision-theoretic arguments: rational agents bet according to the Born rule, meaning they assign negligible credence/preparation to such low-measure outcomes. While it seems bizarre, it's a direct prediction accepted by proponents. Critics often cite this as deeply counterintuitive or problematic.

  **Addressing Your Suspicion Directly:**

  You nailed it: **"The jump from 'a rational agent in a branching universe should bet as if the Born rule' to 'therefore the Born rule is derived, not assumed' feels like it might be smuggling something, maybe smuggling the conclusion in through the rationality constraints."**

  *   **This is the absolute core of the live philosophical dispute.** Your instinct is excellent.
  *   Critics (like Kent, Albert, Maudlin) argue precisely this: that the "obvious" rationality constraints (especially Branching Indifference/Measurement Neutrality) either directly presuppose the irrelevance of amplitude to preference (which is part of the Born rule conclusion) or assume a structure equivalent to the Born measure being the correct weighting.
  *   Proponents (Wallace, Saunders) argue that the constraints are justified solely by considerations of rational agency in a branching universe *without* assuming anything about quantum probabilities. They see Branching Indifference as simply saying that rational agents only care about outcomes, not the irrelevant details of *how* the branching happens to achieve those outcomes.
  *   **Why it's hard to audit cleanly:** The disagreement is fundamentally about what constitutes "rationality" in the profoundly strange context of personal identity splitting via quantum branching. There's no neutral, universally accepted theory of rational decision-making under such conditions. The debate hinges on whether DW's constraints capture *genuinely* minimal rationality or subtly build in the quantum probabilistic structure they aim to derive. **This *is* upstream of what counts as a solution.**

  **Conclusion on Your Summary:**

  You captured the *narrative* of the modern Everettian response to probability very well. The parts concerning the *structure* (branching, decoherence, SLU, existence of a measure, all outcomes happen) are standard. The parts concerning the *derivation of the Born rule as rational credence* (Deutsch-Wallace) and its implications (Born rule as a theorem, parsimony victory) are the **load-bearing claims** and are **actively contested** in the professional literature. The metaphors ("thicker," "more real") are widely seen as unhelpful by professionals. Your specific suspicion about the rationality constraints is precisely where the most significant philosophical battle is being fought.

  **What Would Change My Mind on the Contested Parts (Derivation/Parsimony):**

  *   **For the Derivation:** A widely accepted formal proof that DW's constraints (or similar) are *necessary* consequences of a *more fundamental*, universally accepted principle of rationality or agency, applicable *specifically* to branching scenarios and *independent* of quantum mechanics or any probabilistic assumptions. Conversely, a definitive demonstration that Branching Indifference *does* implicitly assume the Born measure or an equivalent probabilistic rule.
  *   **For Parsimony:** Consensus emerging in the philosophy of physics community that the DW derivation (or a successor) is logically sound and non-question-begging. Currently, it's influential but not consensus. If the derivation is deemed sound, then the parsimony claim becomes much stronger. If it's deemed circular or flawed, then the claim that EQM derives the Born rule collapses, and its parsimony advantage over collapse/Bohm theories on this specific point vanishes.

  The honest answer is that the core issue (can probability be derived, or is it smuggled in?) remains a live and difficult dispute precisely because it challenges fundamental concepts of rationality, personal identity, and the nature of probability itself, all within a deterministic, branching universe. Nobody has a clean, universally accepted audit yet.
