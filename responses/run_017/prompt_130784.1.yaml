  Avoid:
  - Explaining jokes. Let math-savvy readers spot the bijection themselves. 
  - Calling infinity "weird." The humor is in treating it as a Tuesday problem. 
  - Overdoing formalism. Keep math correct but invisible (e.g., "Section 2.7.3" for reindexing). 

  Biggest risk: Missing the balance. If the math slips, it’s unfunny; if operational details aren’t painful enough, the satire fails. Must make "reprinting all signage" feel like a real cost.
