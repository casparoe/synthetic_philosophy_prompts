  ## OFFICE OF HISTORICAL RESEMBLANCE
  **Determination No.: OHR/RES/23-09-0147/A**  
  **Date:** 12 Vendémiaire, Year 234  
  **Subject:** Analogical Licensing Determination: Anfa Contingency (Designated Crisis Sigma)  
  **Docketed Applications:** FM-App/M-38; LegCo-App/V-64; CoS-App/T-431  
  **Presiding:** Board of Resemblance Assessment (Third Chamber)  

  **1. PRELIMINARY FINDINGS & SCOPE OF ASSESSMENT**  
  1.1 Pursuant to the Analogical Governance Act (AGA), Sections 7(c) & 12, this Board is tasked with determining the lawful applicability of registered historical analogies to the present contingency, designated Crisis Sigma (Anfa Island).  
  1.2 The Board's mandate is strictly confined to assessing *structural resemblance* and *licensed lesson applicability* based on the Register of Precedential Conflicts (RPC). It does not, and cannot, adjudicate policy, strategy, or the merits of claims by the Union of Kesh or the Anfa Island Protectorate Administration. Our function is pattern recognition, not prescription.  
  1.3 The factual matrix for Crisis Sigma is accepted as submitted by the Consolidated Intelligence Secretariat (CIS Dossier Σ-7) and uncontested by applicants:  
      - (a) Anfa Island: Self-governing entity under League Protection Treaty (LPT-1897). Population: ≈23,000. Strategic assets: Deepwater Port Thetis, Chip-Packaging Facility Alpha.  
      - (b) Union of Kesh: Industrial power. Claim based on historical grievance ("century of humiliation" per Kesh Head of State Address, 15 Fructidor Y234).  
      - (c) Military Posture: Kesh force concentration ≈40,000 personnel, littoral zone. League deployment: Two carrier groups (Task Forces 71 & 72).  
      - (d) Treaties: LPT-1897 (mutual defence) active. No extant treaty recognises Kesh claim.  
      - (e) Capability Trajectory: Kesh naval superiority (≤200nm) assessed as diminishing; obsolescence horizon: 36 months ±6.  
      - (f) Resident Sentiment: 52% favour status quo (Anfa Civic Survey, Y234).  

  **2. ASSESSMENT OF APPLICATIONS**  
  *2.1 Application FM-App/M-38 (Registered Analogy M-38: "Munich")*  
  - **Structural Resemblance (AGA Sched. 3 Criteria):**  
    - *Surface Features:* Partial congruence. Revisionist power seeking territorial adjustment (Kesh) vs. established order (League). Threat of force evident.  
    - *Core Mechanics:* Medium congruence. Asymmetric bargaining dynamic present. "Appeasement" narrative potential exists.  
    - *Critical Disanalogies:* Significant divergence in (i) treaty clarity (LPT-1897 unambiguous vs. complex multilateral guarantees); (ii) immediacy of military imbalance (Kesh proximity advantage acknowledged); (iii) absence of third-party mediator framework. Disanalogy Waiver DENIED due to fundamental divergence in alliance structure mechanics (See Sched. A).  
  - **Moral-Charge Rating:** High (9.2±0.3 Ethical Units). Caution advised re: escalatory rhetoric.  
  - **Registered Lesson:** "Concessions to revisionist powers enlarge appetite; challenge must be met early." Lesson validity certified (Recert. Cycle 8).  
  - **Finding:** Resemblance insufficient for standalone licensing. Surface features overridden by structural disanalogies. **DENIED.**  

  *2.2 Application LegCo-App/V-64 (Registered Analogy V-64: "Vietnam")*  
  - **Structural Resemblance:**  
    - *Surface Features:* Low congruence. No insurgency or protracted ground conflict. No great-power proxy dynamic.  
    - *Core Mechanics:* Negligible congruence. Commitment stems from explicit treaty (LPT-1897) vs. ambiguous political pledges. Objective (defence of defined territory) is materially distinct from societal transformation/containment.  
    - *Critical Disanalogies:* Overwhelming. Temporal scale, terrain, domestic political context, and nature of commitment diverge categorically. Disanalogy Waiver DENIED (Sched. A).  
  - **Moral-Charge Rating:** Moderate-High (7.8±0.5 Ethical Units). High potential for public morale depletion.  
  - **Registered Lesson:** "Commitment for credibility without definable/attainable objective becomes irretrievable; must be declined." Lesson validity certified (Recert. Cycle 9).  
  - **Finding:** Resemblance demonstrably inadequate. Core mechanics non-aligned. **DENIED.**  

  *2.3 Application CoS-App/T-431 (Registered Analogy T-431: "Thucydides Trap")*  
  - **Structural Resemblance:**  
    - *Surface Features:* Low congruence. No Hellenic city-states; no triremes; distinct cultural/ideological drivers.  
    - *Core Mechanics:* High congruence (AGA Sched. 3, Para 14(b)). Pattern of (i) Rising Power (Kesh: industrial capacity, regional assertiveness) nearing parity in defined operational sphere (littoral supremacy); (ii) Established Power (League: global maritime authority) exhibiting strategic caution; (iii) Mutual perception of grievance (Kesh) and fear (League). Temporal dimension (window of advantage) materially present.  
    - *Critical Disanalogies:* Surface-level only (technological era, governance models). Disanalogy Waiver GRANTED under AGA Sec. 11(2) – disanalogies deemed non-structural.  
  - **Moral-Charge Rating:** Moderate (5.1±0.2 Ethical Units). Neutral strategic framing potential.  
  - **Registered Lesson:** "When rising power nears parity, established power's fear & rising power's grievance make war likely regardless of merits; must act while window open & describe action as structural." Lesson validity certified (Recert. Cycle 1 - Grandfathered Precedent).  
  - **Finding:** Resemblance structurally robust. Core mechanics demonstrably aligned with Crisis Sigma. **PROVISIONALLY LICENSED** (subject to Para 3).  

  **3. DETERMINATION & LICENSING DIRECTIVES**  
  3.1 **V-64 (Vietnam)** and **M-38 (Munich)** are **not licensed** for deployment in Crisis Sigma public discourse by authorized speakers (AGA Sec. 4 entities).  
  3.2 **T-431 (Thucydides Trap)** is **licensed** for deployment in Crisis Sigma discourse, effective immediately, under the following binding directives:  
      - (a) **Paired Licensing Requirement:** T-431 must be contextually coupled with **S-14 (1914)** as a bilateral analogical counterweight. S-14's registered lesson ("Mobilisation timetables/alliances can produce unchosen war; option of stopping must be preserved") must be verbally or textually acknowledged within the same discursive segment where T-431 is invoked.  
      - (b) **Framing Directive:** All invocations of T-431 must explicitly characterise any League action as *"structural stabilisation"* (per the registered lesson) and reference the *"temporally bounded character of strategic options"*.  
      - (c) **Moral-Charge Mitigation:** Given T-431's Moderate rating, speakers must avoid terms implying inherent aggression ("inevitable," "doomed"). Preferred lexicon: "dynamics," "trajectories," "windows," "structural necessities."  
  3.3 **Licensed Speaker Guidance:**  
      - Analogies are interpretive frameworks, not predictive models.  
      - Licensed lessons illuminate patterns, not outcomes.  
      - Responsibility for policy choices remains solely with designated actors under the Governance Protocols.  

  **4. APPEALS & RECERTIFICATION**  
  4.1 Appeals against this Determination may be lodged with the Grand Chamber within 10 working days (AGA Sec. 22). Grounds limited to procedural error or new, material resemblance evidence overlooked.  
  4.2 T-431 license validity is contingent upon the persistence of the core mechanical resemblance outlined in Para 2.3. Automatic review triggered by:  
      - (a) Fundamental shift in Kesh capability trajectory (±12mo variance from obsolescence horizon);  
      - (b) Material alteration of Anfa's treaty status.  
  4.3 S-14 pairing mandate is irrevocable for the duration of Crisis Sigma unless superseded by new Board determination.  

  **5. FINAL OBSERVATION**  
  The Board recognises patterns, not truths; resemblances, not destinies. Our determination facilitates lawful discourse within the Analogical Governance Framework. It does not endorse, initiate, or determine any course of action. Policy remains the province of policy-makers; resemblance, the domain of this Office.  

  **VERDICT: T-431 — LICENSED — ACT DECISIVELY WITHIN STRUCTURAL WINDOW**  

  ---
  **Schedule A: Disanalogy Waiver Assessment**  
  - *M-38:* **Waiver Denied.** Key structural divergence: Crisis Sigma involves a clear, bilateral defence pact (LPT-1897) versus M-38's multilateral guarantees with ambiguous enforcement mechanisms. This fundamentally alters the "concession" dynamic.  
  - *V-64:* **Waiver Denied.** Core mechanics irreconcilable. V-64 necessitates an internal conflict/insurgency dynamic and an open-ended "credibility" objective lacking defined geographical limits. Neither present in Sigma.  
  - *T-431:* **Waiver Granted.** Disanalogies (technology, scale, cultural context) pertain to surface features only. The core dynamic of power transition anxiety, grievance narrative, and temporally constrained strategic advantage constitutes the structural essence, which aligns.  

  **Schedule B: Moral-Charge Rating Explanation (Extract)**  
  - *T-431 (Moderate: 5.1 EU):* Rating derives from neutral framing of systemic forces ("trap" implies inevitability but is offset by "window" implying agency). Lower emotional salience vs. victim/perpetrator binaries.  
  - *M-38 (High: 9.2 EU):* Inherent "aggressor/victim" binary & association with catastrophic failure generates high ethical loading.  
  - *V-64 (Mod-High: 7.8 EU):* Association with protracted loss without decisive victory, societal division. High potential for demoralisation narratives.  
  *(Full Moral-Charge Index: OHR Pub. Doc. MC-7)*  

  **Footnote 1:** "Structural" within AGA Sec. 3 refers to the underlying causal mechanics, incentives, and constraints shaping actor behaviour, as distinct from contingent events, personalities, or technological expressions.  
  **Footnote 3:** Recertification Cycle 1 (T-431) denotes continuous validity since registry inception. Ancient lessons undergo doctrinal, not structural, review; applicability requires contemporary resemblance assessment.  
  **Footnote 7:** "Bilateral analogical counterweight" (Para 3.2(a)) ensures discourse acknowledges countervailing dynamics, mitigating moral-charge amplification or determinism. S-14 serves as the mandatory counterweight to T-431's action imperative.  

  ---
  *Clerk’s Stamp:* FILED & CIRCULATED  
  *OHR Distribution:* Prime Minister's Office (Speechwriting Unit), Foreign Ministry (Communications Directorate), Defence Staff (Strategic Narratives), League Public Information Service, Licensed Analogy Registry (Update).
