prompt: |-
  I sit on the scientific advisory committee of a national food-safety and animal-health agency, and we are the body that decides which animal groups fall under our rules on stunning, humane slaughter and live transport. Coverage currently runs to all vertebrates and, since a revision a few years back, to octopuses, squid and cuttlefish; that last extension was adopted explicitly as a precautionary measure rather than as a finding that cephalopods are certainly conscious, which means there is no written standard anywhere in our records for what we were being precautionary about. Petitions now arrive every few weeks — industry bodies asking us to add or to exempt a group, welfare organisations asking us to extend, and several times a year a file on something for which no studies exist at all. Our decisions are legally reviewable and must be published with reasons. The committee is six people (a veterinarian, a neuroscientist, a fisheries biologist, an entomologist, an ethicist and a producer representative), we meet one day a month, and no member can realistically give a petition more than about an hour of reading. So what I need is a decision procedure we could actually run inside those constraints, not a philosophical essay on which animals are conscious.

  What I want is that procedure, written so that a committee member with no philosophy training can execute it: the questions in the order they should be asked, what counts as an adequate answer to each, the points at which the procedure returns a yes and stops, the points at which it returns a no and stops, and — most importantly — the points at which it has to stop and hand the matter over as a question about values rather than evidence. I also want you to mark honestly which of its steps are judgment calls wearing the costume of a test. Three things in particular have to be built in, because these are where our past discussions have collapsed. First, the evidence arrives in kinds that are not interchangeable. A taxon may have neural hardware of the sort we associate with pain in vertebrates; or it may show the flexible, trade-off-making behaviour we associate with pain — avoiding a place where it was hurt even when a food reward is on offer, tending an injury at some cost, taking an analgesic option only when injured; and very often a group looks impressive on the behavioural markers while having a nervous system organised unlike ours, or the other way round. We are also regularly reminded that reacting to a harmful stimulus is not the same as feeling it, and I want the procedure to preserve that distinction without letting it become a reason never to decide anything. So: how should we combine evidence of these different kinds, how do we avoid counting a single underlying capacity three times because it shows up in three different assays, and what do we do when the only studies available were done on a related species — at what taxonomic grain should a classification be made, and how far up or down may we extrapolate? Second, every marker we use is, taken on its own, something a clever unconscious machine could in principle be built to do. I want a step that asks whether the whole body of evidence for a taxon could be produced by a system that lacks the very thing we are trying to detect, and I want to know what kind of evidence would be needed to get past that step. Third, the costs of error are not symmetric: covering a group that is not conscious imposes real costs on producers and on our inspectors' time, while failing to cover a group that is conscious means we are authorising pain on a very large scale, sometimes across enormous numbers of animals. I want the procedure to say where the burden of proof sits, how the size of the stakes changes how much evidence we demand, and — for the direction nobody enjoys — what standard applies when a submission asks us to remove coverage from a group we already protect. Where the answer is that the evidence is insufficient, it should say what would have to change and when we re-open the file.

  Then run it on three live files. (1) A petition from a welfare coalition to extend stunning and transport rules to decapod crustaceans — crabs, lobsters, prawns — currently treated as unprotected invertebrates, whose supply chains here are large and, as far as our economic briefing goes, expensive to retrofit. (2) A petition to extend the rules to the insects now being farmed at industrial scale for animal feed, mainly black soldier fly and house cricket, where the literature per species is thin or ambiguous and the number of candidate species is enormous. (3) A submission from a commercial fishing association arguing that the fish we already cover should come out of coverage, on the grounds that the brain structures which do the relevant work in mammals are absent in fish. At least one of the three should come out in a way I will find inconvenient, and I would much rather see that here than in our published reasons; for each file I want to see where exactly the procedure stopped and why. Finally, tell me what this procedure cannot do: which questions it is bound to get wrong or to leave open, and which ones we should simply stop pretending we can settle from evidence.
reasoning: |-
  Hmm, this is a complex and urgent request from someone on a scientific advisory committee dealing with animal welfare regulations. They need a practical decision procedure for determining which animal groups require protection under stunning, humane slaughter, and live transport rules. The constraints are tight: six committee members with different expertise, limited time (about 1 hour per petition), and legally reviewable decisions.

  The key requirements are:
  - A step-by-step procedure usable by non-philosophers
  - Clear stopping points for "yes," "no," or "values decision"
  - Honest labeling of judgment calls disguised as tests
  - Handling three specific evidence challenges: 
    Different evidence types (neural vs behavioral) without double-counting
    Dealing with related species studies
    The "clever unconscious machine" problem
  - Asymmetric error costs (more weight to avoiding suffering)
  - Burden of proof clarification
  - Test cases: decapod crustaceans, farmed insects, and fish deregulation

  I need to design a procedure that respects both scientific evidence and ethical responsibilities within their time constraints. The procedure should have clear exit ramps when evidence is insufficient or when values judgments are required. For the evidence challenges, I'll incorporate:
  - Parallel assessment of neural architecture and behavioral markers
  - A "coherence check" to see if evidence points to the same conclusion
  - A "clever machine test" requiring evidence not explainable by reflex alone
  - Taxonomic grouping with explicit extrapolation rules

  For burden of proof, I'll place it on petitioners seeking change (coverage expansion or removal) but with higher bars for removal. The error asymmetry means we should err toward protection when evidence is ambiguous.

  For the test cases:
  - Decapod crustaceans: Strong behavioral evidence but some neural questions might push this to "values" territory
  - Farmed insects: Likely insufficient evidence (neural architecture gap)
  - Fish deregulation: Should fail due to overwhelming counterevidence

  Important limitations to highlight: 
  - Cannot resolve fundamental consciousness debates
  - Struggles with borderline cases or radical neural differences
  - Requires committee judgment at key points
  - Depends on available literature quality
answer: |-
  Below is a scientifically grounded, time-constrained decision procedure for your committee. It prioritizes tractability, minimizes philosophical ambiguity, and explicitly flags judgment points. The procedure is structured as a flowchart with binary checkpoints. It assumes petitioners provide evidence summaries (as required by your process), and committee members consult pre-vetted literature reviews maintained by your agency staff where possible. 

  **Core Principles**:  
  - **Burden of Proof**: Rests on the petitioner (for coverage additions/removals).  
  - **Error Asymmetry**: Insufficient evidence defaults to *coverage* for additions (precaution against suffering) but *maintains status quo* for removals (precaution against deregulating conscious beings).  
  - **Evidence Types**: Neural ("hardware") and behavioral ("software") assessed separately, then combined.  
  - **Taxonomic Grain**: Decisions apply at **class** level (e.g., "decapod crustaceans") unless compelling evidence shows within-class divergence. Extrapolation from studied species permitted if no contradictory data exists.  

  ---

  ### **DECISION PROCEDURE: ANIMAL GROUP COVERAGE ASSESSMENT**  
  *(Execute steps in order; stop at first terminal point [✔️=Cover, ❌=No Cover, ⚖️=Values Decision])*  

  1. **PETITION TYPE?**  
     - **Addition**: Proceed to Step 2.  
     - **Removal**: Proceed to Step 6 (higher burden).  

  #### **ADDITION PATHWAY**  
  2. **NEURAL ARCHITECTURE CHECK**  
     - *Question*: Does the taxon possess:  
       (a) Centralized brain (not just ganglia), **AND**  
       (b) Nociceptors linked to integrative brain regions?  
     - *Evidence*: Anatomy studies (e.g., histology, neural tracing). Accept studies on closely related species (same order/family) if target-species data absent.  
     - **✔️ YES** → Proceed to Step 3.  
     - **❌ NO** → Stop. **No Cover**.  
     - *JUDGMENT CALL*: Defining "integrative regions." Default: Brain areas processing multiple inputs (e.g., vertebrate pallium, octopod vertical lobe).  

  3. **BEHAVIORAL MARKERS CHECK**  
     - *Question*: Is there evidence of **≥2** trade-off behaviors?  
       - Injury tending (e.g., grooming wound, sacrificing feeding).  
       - Conditioned place avoidance (avoiding location despite reward).  
       - Analgesic self-administration (e.g., choosing pain-relief).  
     - *Evidence*: Controlled lab studies. Accept same-family extrapolation.  
     - **✔️ YES** → Proceed to Step 4.  
     - **❌ NO** → Stop. **No Cover**.  

  4. **COHERENCE TEST**  
     - *Question*: Do neural and behavioral evidence plausibly describe **one capacity** (e.g., neural hardware explains behaviors)?  
     - **✔️ COHERENT** → Proceed to Step 5.  
     - **⚠️ CONFLICTING** (e.g., strong behavior but simple ganglia) → ⚖️ **Values Decision**. *(e.g., Precaution may override neural gaps)*.  
     - *JUDGMENT CALL*: Assessing plausibility of alternative explanations (e.g., is "trade-off" just reflex?).  

  5. **CLEVER MACHINE TEST**  
     - *Question*: Could an unconscious automaton produce *all* observed evidence?  
       - *Key hurdle*: Require **≥1** marker that demands integrated learning (e.g., context-dependent analgesia, long-term avoidance without reinforcement).  
     - **❌ NO** (Evidence ≥1 integrated marker) → ✔️ **Cover**.  
     - **✔️ YES** → ⚖️ **Values Decision**. *(e.g., Is precaution justified despite ambiguity?)*.  
     - *JUDGMENT CALL*: Defining "integrated learning." Default: Behavior flexibly adjusted to novel scenarios.  

  #### **REMOVAL PATHWAY** (Higher burden: "Prove lack of consciousness")  
  6. **NEW EVIDENCE CHECK**  
     - *Question*: Has new, high-quality evidence emerged since coverage began that fundamentally undermines the original basis?  
     - **❌ NO** → Stop. **Maintain Cover**.  
     - **✔️ YES** → Proceed to Step 7.  

  7. **CONTRADICTION TEST**  
     - *Question*: Does new evidence **conclusively disprove** ≥1 pillar of original coverage (e.g., proof that "integrative" brain region is non-functional)?  
     - *Evidence*: Requires direct target-species data (no extrapolation).  
     - **✔️ YES** → ✔️ **Remove Cover**.  
     - **❌ NO** → Stop. **Maintain Cover**.  

  ---

  ### **PROCEDURE LIMITATIONS**  
  - **Cannot resolve**:  
    - Fundamental debates about consciousness (e.g., "hard problem").  
    - Edge cases with radical neural differences (e.g., distributed intelligence in jellyfish).  
    - Value judgments (e.g., "How much risk of suffering is acceptable?").  
  - **Vulnerable to**:  
    - Literature gaps (e.g., unstudied species).  
    - Extrapolation errors in poorly resolved taxa.  
  - **Requires upfront**:  
    - Agency-maintained evidence repositories.  
    - Pre-meeting staff summaries for petitions.  

  ---

  ### **TEST CASE ANALYSES**  
  *(Assumes 1-hour review per member; uses standard literature)*  

  #### **(1) DECAPOD CRUSTACEANS (Addition)**  
  - **Step 2 (Neural)**: ✔️ YES. Decapods have centralized brains (supraesophageal ganglion) and nociceptors linked to central processing (e.g., *Elwood 2019*).  
  - **Step 3 (Behavioral)**: ✔️ YES. ≥2 trade-offs:  
    - Injury tending (e.g., crabs groom wounds; *Patterson et al. 2007*).  
    - Conditioned avoidance (e.g., prawns avoid shock zones despite food; *Barr et al. 2008*).  
  - **Step 4 (Coherence)**: ✔️ COHERENT. Neural hardware supports complex behavior.  
  - **Step 5 (Clever Machine)**: ❌ NO. Evidence of integrated learning (e.g., hermit crabs trade shell quality vs. shock risk; *Elwood & Appel 2009*).  
  - **OUTCOME**: ✔️ **Cover** (Procedure stops at Step 5).  
  - **Inconvenience Note**: High retrofit costs acknowledged, but evidence meets bar.  

  #### **(2) FARMED INSECTS (Addition: Black Soldier Fly, House Cricket)**  
  - **Step 2 (Neural)**: ❌ NO. Insects lack brain structures integrating nociception (e.g., no vertebrate-like pallium; *Eisemann et al. 1984*). Nociceptors exist but link to ganglia, not central brain.  
  - **OUTCOME**: ❌ **No Cover** (Procedure stops at Step 2).  
  - **Why?**: Neural architecture insufficient. Behavioral evidence (e.g., avoidance) is explainable by reflexes.  
  - **Re-open If**: New neuroanatomy shows unexpected integration (e.g., functional mushroom body homology).  

  #### **(3) FISH DEREGULATION (Removal)**  
  - **Step 6 (New Evidence)**: ❌ NO. No revolutionary data since coverage. Claims re: missing mammalian cortex are old arguments (*Rose 2002*), countered by evidence of functional analogs (e.g., pallium supports learning/suffering; *Sneddon et al. 2018*).  
  - **OUTCOME**: ❌ **Maintain Cover** (Procedure stops at Step 6).  
  - **Why?**: Petitioner’s evidence rehashes known disputes; fails "conclusive disproof" standard for removal.  

  ---

  ### **HONESTY MARKS: JUDGMENT CALLS**  
  - **Step 2**: Defining "integrative regions" (relies on analogy to protected taxa).  
  - **Step 4**: Assessing "coherence" (subjective weighting of neural vs. behavioral gaps).  
  - **Step 5**: "Clever Machine" threshold (what counts as "integrated learning" is theory-laden).  

  This procedure ensures defensible decisions within 60 minutes by focusing on tractable thresholds, leveraging taxonomy, and flagging where science ends and values begin. It prioritizes preventing suffering amid uncertainty while minimizing regulatory overreach where evidence is absent.
