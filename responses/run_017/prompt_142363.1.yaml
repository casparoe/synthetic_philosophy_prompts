  **First: Why the aggregation objection is a structural challenge**

  The aggregation objection arises because contractualism, as Scanlon presents it, evaluates the reasonableness of rejecting a principle by considering each person's complaint in isolation. The test is: a principle is reasonably rejectable if there is an alternative that no one could reasonably reject. When comparing two principles, we look at the strongest individual complaint against each. If the strongest complaint against principle P1 is weaker than the strongest complaint against P2, then P2 can be rejected in favor of P1. This pairwise comparison does not allow for adding together the complaints of multiple individuals. Therefore, in cases where there are many individuals each with a small complaint, and one individual with a large complaint, the large complaint may outweigh each small one individually, but the sum of the small complaints might be greater than the large one. Contractualism, as standardly interpreted, cannot capture this because it doesn't aggregate.

  The structural challenge is that contractualism's core justificatory procedure — the reasonable rejectability test — is built on pairwise comparisons that are sensitive only to the strongest individual complaint in any given pairwise contest. This means that the view is inherently non-aggregative. The objection is not just about a few counterintuitive cases but about the very structure of moral reasoning that contractualism endorses. If aggregation is sometimes required (as in saving the greater number), then the structure of contractualism must be revised or supplemented.

