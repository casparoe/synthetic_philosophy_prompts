  ### Understanding the Aggregation Objection and the Margin-Plus-Sum Proposal

  **Why the Aggregation Objection Is a Structural Challenge**  
  The aggregation objection targets the core structure of Scanlon’s contractualism, not just specific cases. Contractualism assesses principles by asking whether any individual can reasonably reject them based on their *personal* complaint against a principle, compared to alternatives. This test is inherently pairwise and non-aggregative: it considers only the strongest individual complaint in any comparison, without summing or combining complaints across persons. The objection arises because this structure cannot accommodate the intuition that multiple smaller complaints can collectively outweigh a single larger one. For instance, saving five lives instead of one seems justified by the total burden avoided, but contractualism lacks resources to "add" the five complaints. This is not merely about counterintuitive outcomes; it challenges contractualism’s foundational commitment to justifications that respect the separateness of persons. If morality sometimes requires aggregation—where the *combined weight* of many claims matters—then contractualism’s test of reasonable rejectability, as standardly defined, is structurally inadequate. It cannot capture the idea that a principle imposing many small burdens might be worse than one imposing a large burden, even if no single small burden outweighs the large one.

  **Applying the Rule to Three Cases**  
  Assume complaints are interpersonally comparable and measurable on a scale (e.g., 0–100, where higher numbers indicate stronger complaints). The margin-plus-sum rule works as follows:  
  1. Compare the largest individual complaints (max-complaints) of two principles.  
     - If the difference exceeds a fixed margin \( m \), the principle with the smaller max-complaint wins.  
     - If the difference is \(\leq m\), compare the sums of all complaints; the smaller sum wins.  

  We test three cases with \( m = 10 \) (a plausible setting; outcomes may depend on \( m \)).  

  - **Case 1: Many trivial burdens vs. one severe burden.**  
    - *Setup*: Principle A imposes a severe burden on one person (complaint = 100). Principle B imposes a trivial burden on each of 1,000 people (complaint = 0.1 each).  
    - *Rule application*: Max-complaint for A is 100; for B, 0.1. Difference = 99.9 > 10, so B wins (smaller max-complaint).  
    - *Verdict*: Intuitively, B should lose for large N (1,000 trivial burdens outweigh one severe burden), but the rule always favors B, regardless of N. The answer is wrong and independent of \( m \). The rule fails here because it never reaches the sum-comparison step.  

  - **Case 2: Five lives vs. one life (all else equal).**  
    - *Setup*: Principle A saves one, lets five die (complaints: 100 for each death, so max = 100, sum = 500). Principle B saves five, lets one die (max = 100, sum = 100).  
    - *Rule application*: Max-complaints are tied (difference = 0 ≤ 10), so compare sums: 100 (B) < 500 (A). B wins.  
    - *Verdict*: Intuitively correct (save five), but for the "wrong" reason. The sum-comparison does the work, not Scanlon’s indirect appeal to giving equal claims their due. This reveals the rule’s aggregative engine.  

  - **Case 3: Many slightly worse off than one, but vastly outnumbering.**  
    - *Setup*: Principle A imposes a burden on one person (complaint = 50). Principle B imposes a slightly larger burden on each of 100 people (complaint = 51 each).  
    - *Rule application*: Max-complaints: 50 (A) vs. 51 (B). Difference = 1 ≤ 10, so compare sums: 50 (A) < 5,100 (B). A wins.  
    - *Verdict*: Intuitively correct for large N (avoid massive total burden), but depends on \( m \). If \( m < 1 \) (e.g., \( m = 0.5 \)), the difference exceeds \( m \), so B wins (smaller max-complaint), which is wrong. The rule works here only if \( m \) is large enough to trigger summing.  

  **Intransitivity and Whether It Matters**  
  The rule defines a pairwise relation that can generate cycles (intransitivity). Consider three principles with complaints:  
  - A: One person at 31. *L<sub>A</sub> = 31, Sum<sub>A</sub> = 31*  
  - B: One person at 20. *L<sub>B</sub> = 20, Sum<sub>B</sub> = 20*  
  - C: Two persons at 21 each. *L<sub>C</sub> = 21, Sum<sub>C</sub> = 42*  

  Set \( m = 10 \):  
  - **A vs. B**: |31–20| = 11 > 10; B wins (smaller max-complaint: 20 < 31).  
  - **B vs. C**: |20–21| = 1 ≤ 10; compare sums: 20 (B) < 42 (C); B wins.  
  - **C vs. A**: |21–31| = 10 ≤ 10; compare sums: 42 (C) > 31 (A); A wins.  

  Result: B beats A, B beats C, but C loses to A—no cycle. Now adjust to create a cycle:  
  - A: One person at 25. *L<sub>A</sub> = 25, Sum<sub>A</sub> = 25*  
  - B: Two persons at 15 each. *L<sub>B</sub> = 15, Sum<sub>B</sub> = 30*  
  - C: One person at 20. *L<sub>C</sub> = 20, Sum<sub>C</sub> = 20*  

  Set \( m = 10 \):  
  - **A vs. B**: |25–15| = 10 ≤ 10; compare sums: 25 < 30; A wins.  
  - **B vs. C**: |15–20| = 5 ≤ 10; compare sums: 30 > 20; C wins.  
  - **C vs. A**: |20–25| = 5 ≤ 10; compare sums: 20 < 25; C wins.  

  Result: A beats B, C beats B, C beats A—no cycle. After extensive search, no cycle is found, but the rule is vulnerable in principle. Tolerances often cause intransitivity, and cycles could arise with more complex distributions (e.g., where sum comparisons conflict with max-complaint comparisons across three options).  

  If a cycle occurs (e.g., A beats B, B beats C, C beats A), contractualism faces a fatal problem. The framework requires a principle that is "not reasonably rejectable" — i.e., one that is not defeated by any alternative in pairwise comparisons. A cycle implies that every principle is beaten by another, so no principle is uniquely least rejectable. This undermines contractualism’s justificatory goal, which relies on identifying a stable, unrejectable principle. Unlike value theories that tolerate non-transitive betterness, contractualism needs transitivity to deliver a decisive outcome. A cycle would be fatal, but since it has not been demonstrated, the rule may be practically usable. A "cheap fix" (e.g., lexical priority for max-complaints when sums are close) risks collapsing into standard summation or ad hoc constraints.  

  **Does the Rule Preserve Contractualism’s Distinctiveness?**  
  The rule does not preserve contractualism’s non-aggregative core. Scanlon’s view insists that justifications must respect individual separateness: no one should bear a large burden because others’ complaints are combined into a "total" that no single person experiences. The margin-plus-sum rule, however, explicitly aggregates complaints in the sum-comparison step. The margin (\( m \)) is a rounding device that permits aggregation when max-complaints are close, but it does not alter the fact that summing complaints treats individuals as containers of value to be totaled. This explains why the rule succeeds in Case 2: it covertly uses aggregation. Its plausibility in edge cases (e.g., Case 3) depends on the sum, not Scanlon’s idea of comparative reasons or indirect number sensitivity. The rule is thus aggregation in disguise, borrowing contractualist language while abandoning its essence.  

  **Bottom Line**  
  The margin-plus-sum fix does not succeed because it fails key cases without aggregation, relies on summing in ways antithetical to contractualism, and risks intransitivity that would undermine the framework.  

  \answer{ILLUSORY}
