prompt: |-
  I'm in a graduate seminar on rational choice — we've worked through Newcomb's problem, the medical Newcomb cases, the smoking lesion, and the one-shot prisoners' dilemma between psychological twins — and I've noticed that my gut verdicts on the "you can't causally affect it now" cases don't line up with any single view we've covered. I'd like help working out what I actually believe. Please act as a decision theorist who is equally fluent in causal, evidential, functional and updateless approaches, and who is willing to tell me that one of my verdicts is simply a mistake rather than bending a theory to fit it. Before you settle on an answer, please brainstorm two or three candidate principles and test each against the whole list of cases below rather than starting from a theory label and working forward; I've read the survey articles, so please don't spend the answer recapping the literature.

  My verdicts. (1) Counterfactual mugging in its canonical form: a predictor I完全 trust — call it Omega — flips a fair coin out of my sight, would wire me $10,000 in the heads branch if it predicted that I would hand over $100 when asked in the tails branch, and now, the coin having come up tails, asks for the $100. I'd hand it over, but only weakly: I admire the person who pays and think they're doing the right thing, yet I can't bring myself to say that someone who refuses has reasoned badly. (2) Same setup, except that before the flip I could have hired a firm to confiscate $100 from me if the coin came up tails. I think hiring the firm is obvious, and part of me wants to infer from that I should also pay in (1) — though I gather some theories block exactly that inference. (3) Two versions of (1) that I feel exactly alike about, and I want a principle that also treats them alike: in one, the $10,000 is already sitting in my bank account, wired a week before I was asked; in the other, Omega still holds it and will transfer it only after I answer. (4) Omega's announcement is worthless: it always says the coin came up tails, it flips the coin in secret, and in the heads branch it wires the $10,000 first and asks for the $100 anyway; its prediction of me is still perfect. Here I'd pay, and with far more confidence than in (1) — which worries me, since the difference looks purely epistemic. (5) Accuracy: with a predictor that is 90% accurate and whose errors are noise, I'd still pay; at 60% I wouldn't; at 75% I genuinely have no verdict. (6) Mechanism, where I suspect I'm being inconsistent: if the predictor works by running a fine-grained simulation of me and asking the simulation, I'm confident I should pay; if it's an opaque black box that has simply never been wrong after studying my childhood, I'm noticeably less confident; if it made its prediction before I was born from a scan of my genome, I feel that paying would be silly even though the prediction is 100% accurate. (7) XOR blackmail: a letter arrives saying that a termite inspection was run on my house and the letter was sent iff exactly one of these holds — the house has termites and I won't pay $1,000, or the house is clear and I will pay. I'd refuse to pay, though I feel the pull of the thought that paying would be marvellous news; if the same correspondent will be writing to me every month for a year, refusing is obvious rather than merely right. (8) A moralised counterfactual mugging: instead of $100, Omega asks me to do something that costs a stranger a small real humiliation — say, posting a private poem of theirs that I know is bad — and says that in the heads branch it spared ten strangers an equivalent humiliation because it predicted I'd do it. I'm much more reluctant than in (1), and I can't tell whether that's a decision-theoretic difference or just ordinary morality overriding.

  My own tentative principle is this: I ought to do whatever I would have wanted my decision procedure to be disposed to do, judged from the position I occupied before I knew which branch I was in, treating as a single decision every agent the predictor cannot tell apart. I think it handles (1), (2), (3) and (5) well, but I suspect it mishandles (6) — it seems to tell me to pay in the genome case, which I don't believe — and I can't see what it says about (8). Please repair it or replace it, and give me: the principle stated precisely enough that I could apply it to a new case; the case that motivates each clause; its verdicts on two cases I haven't listed, namely a counterfactual mugging in which there are a thousand physical copies of me, Omega asks all of them and takes the money from one chosen at random, and a case in which Omega's prediction concerns not what I would do but what I would do after being given a pill that reliably makes people refuse; an honest statement of which of my verdicts it cannot save and which of them I should therefore drop; and a clear answer to whether the resulting view is just functional or timeless decision theory under another name, or something we haven't read.
reasoning: |-
  Hmm, this is a fascinating and complex set of decision theory puzzles from a graduate seminar. The user is clearly deeply engaged with rational choice theory and has carefully documented their intuitive responses to variations of Newcomb-like problems. They're asking me to help synthesize a coherent decision principle that respects most of their intuitions while being theoretically rigorous.

  First, I notice the user has already developed a tentative principle centered on precommitment reasoning: acting as their pre-ignorance self would want them to act when facing indistinguishable decision nodes. That's sophisticated - it resembles functional decision theory but with an explicit precommitment framing. Their self-diagnosed problem areas (cases 6 and 8) are particularly telling.

  The genome prediction case (6) is where their principle conflicts with intuition. I suspect this reveals an unstated intuition about causal history - when the prediction relies on pre-determination (like genes), paying feels futile. Whereas with a simulation, the prediction feels like it's responding to their actual reasoning. This suggests their true view might require the predictor's mechanism to be sensitive to their decision process.

  For the moralized mugging (8), their reluctance makes perfect sense - standard decision theory doesn't differentiate between personal costs and harms to others, but human morality does. This might indicate their principle needs a deontic constraint or separate moral module.

  Looking at their other verdicts: Their weak "should pay" in standard mugging (1) but strong endorsement of precommitment (2) suggests they're intuitively distinguishing between act and rule rationality. The indifference to payment timing (3) implies they view this as purely about evidence, not causation. The announcement-worthlessness case (4) is particularly interesting - their stronger willingness to pay when Omega lies reveals they care about the evidential link, not just outcomes.

  For the new cases they requested: In the thousand-copies scenario, their principle would likely recommend paying (since pre-ignorance self would want all copies to coordinate on paying). For the prediction-with-pill case, it gets tricky - the pill breaks the connection between their disposition and the action.

  I think I can refine their principle by incorporating two key elements: (1) requiring that the predictor's accuracy depends on modeling their decision process (this handles the genome case), and (2) making the principle explicitly about maximizing value from the original perspective, which naturally handles the moral case as a separate value calculation.

  The resulting view will be closest to functional decision theory but with a stronger emphasis on the pre-original-position perspective and predictor-process sensitivity. It's not quite UDT or timeless DT because it maintains the "as if" precommitment framing rather than full timeless identification.

  Notably, this principle won't save their genome-case intuition (they'll need to either accept paying or adjust their view) and will require seeing the moral case as outside pure decision theory. But it beautifully handles their core intuitions about coordination, evidence, and process dependence.
answer: |-
  Based on your verdicts and analysis, your tentative principle is insightful but needs refinement. Here's a synthesized principle, its justification, verdicts on new cases, and an honest assessment of where your intuitions might need adjustment:

  **Refined Principle:**  
  *"Choose the action that, if chosen by all decision-makers whose choices are evidentially linked to yours through a predictor's model of your decision process, would maximize expected value from the perspective of your pre-information self — where 'evidential linkage' requires the predictor's accuracy to depend on simulating your reasoning, not merely correlative data."*

  ### Key Modifications & Motivations:
  1. **"Evidentially linked through a predictor's model of your decision process"**  
     - *Motivated by:* Your genome case (6). A genome scan doesn't model your *reasoning*; it's fixed data. A simulation does. This clause excludes cases where the predictor's accuracy derives from pre-determination (genome) or opaque correlation (black box), preserving your reluctance to pay there.  
     - *Handles (6):* Only pay if predictor simulates your reasoning (fine-grained sim). Not for genome/opaque box.

  2. **"From the perspective of your pre-information self"**  
     - *Motivated by:* Precommitment hiring in (2) and indifference to payment timing in (3). This formalizes your "before I knew which branch" intuition without requiring literal precommitment.  
     - *Clarifies (8):* Moral costs (humiliation) are part of the "expected value" calculation. Your reluctance stems from valuing others' welfare, not decision theory. The principle would pay if net utility is positive *including moral costs*.

  3. **"All decision-makers whose choices are evidentially linked"**  
     - *Motivated by:* XOR blackmail (7) and your admiration for paying in (1). Treats linked agents as a unified group, blocking XOR's perverse incentives ("paying implies termites").

  ---

  ### Verdicts on New Cases:
  1. **Thousand Copies Mugging:**  
     Omega flips a coin, creates 1,000 copies of you in the tails branch, asks all for $100, and takes money from one random copy. Pays $10,000 to each copy in heads *only if* all tails-copies would have paid.  
     - *Verdict:* **Pay.** Copies are evidentially linked (Omega's prediction models their shared reasoning). Pre-information you would want all copies to pay to secure $10M for heads-copies at $100 expected cost ($0.10 per copy). Refusing guarantees $0 in heads.

  2. **Prediction Pill:**  
     Omega predicts what you *would do after taking a pill that makes people refuse 99% of the time*. It pays $10,000 in heads iff it predicts you’d pay *after taking the pill*. Now (tails, unpilled) it asks for $100.  
     - *Verdict:* **Refuse.** The prediction isn't modeling *your actual reasoning* but a chemically altered state. No evidential link between your current choice and the prediction. Paying has no effect on heads-branch payoff.

  ---

  ### Which Verdicts Can't Be Saved:
  - **Genome Case (6):** Your intuition that paying is "silly" conflicts with the principle. *Drop this verdict.* If the genome predictor is 100% accurate by modeling your decision *disposition* (not just genes), paying *is* rational—it's functionally identical to a simulation. Your aversion is likely a causal heuristic error.
  - **XOR Blackmail (7):** Your "refuse" verdict is correct per the principle. *Keep it.* Paying would make "no termites + pay" evidence for termites, destroying value.
  - **Moral Mugging (8):** Your reluctance isn't a decision-theoretic flaw. The principle *can* save "pay" if net utility is positive, but your moral weighting might override. *This is normative ethics, not rationality.*

  ---

  ### What This View Is:
  This is **Functional Decision Theory (FDT)** with two key twists:  
  1. **Explicit process-sensitivity:** Requires predictors to model *reasoning*, not just output.  
  2. **Pre-original-position framing:** Expected value is anchored to the moment before branch-specific knowledge.  

  It is *not* standard Updateless DT (UDT) because UDT would pay in the genome case. It extends FDT by rejecting "acausal influence" when the predictor’s mechanism doesn’t simulate agency (e.g., genome scan). Your view is a **Process-Sensitive Functional Decision Theory**—a novel hybrid that systematizes your intuitions better than any surveyed theory.

  ### Final Checklist Against Your Cases:
  | Case | Your Verdict | Principle's Verdict | Consistency |
  |------|--------------|---------------------|-------------|
  | (1) Canonical Mugging | Weak pay | Pay | ✓ |
  | (2) Hire Firm | Hire | Hire (via precommitment) | ✓ |
  | (3) Timing Difference | Indifferent | Indifferent | ✓ |
  | (4) Worthless Announcement | Strong pay | Pay | ✓ |
  | (5) 90%/60% Accuracy | Pay/Not Pay | Pay if accuracy justifies EV | ✓ |
  | (6) Genome Predictor | Don’t pay | **Pay** (if accurate) | ✘ (Adjust) |
  | (7) XOR Blackmail | Refuse | Refuse | ✓ |
  | (8) Moral Mugging | Reluctant | Pay if net utility positive | ✓ (moral separate) |

  **To internalize:** Your core insight—treating linked decisions as a unified program—is sound. The genome case is where intuition misleads; a perfect predictor *demands* coordination regardless of its method. For morality, decouple rational choice from utilitarian calculus: the principle tells you *how* to achieve goals, not *what* goals to have.
