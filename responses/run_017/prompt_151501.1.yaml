prompt: |-
  My roommate's a molecular biologist, I'm a philosophy grad student, and we keep going round on whether DNA is really a code or whether that's just a lab habit of speech. She finally wrote her argument down for me and I think it proves way too much, but every step looks fine to me individually. Here it is, roughly in her words:

  (1) A string of symbols is a code only if the mapping from symbols to what they stand for is arbitrary — set by convention, not forced by the physics of the symbols themselves. (Her example: the word "dog" doesn't resemble a dog, and a photograph of a dog isn't a code for a dog.)
  (2) The mapping from codons to amino acids is arbitrary: nothing about the triplet's chemistry calls for its amino acid, the link is made by tRNA synthetases and tRNAs, which are physical machinery, and the code even varies a bit between lineages (mitochondrial tables differ from the standard one, and I half-remember something about a yeast where a leucine codon actually specifies serine).
  (3) So the genome is a code and genes carry semantic information: a stretch of DNA means an amino acid sequence. That's the bit she wants, and I basically want it too.
  (4) But now notice what fixes which amino acid a codon means: just what the translating machinery does with it. The machinery is the "convention," and it operates by chemistry, not by interpreting anything.
  (5) So take any physically specific structure that some downstream mechanism reliably turns into a specific product — a synthetic random-sequence mRNA in a cell-free extract, the shape of a substrate relative to the enzyme that acts on it, the maternal mRNAs and proteins dumped into an egg cytoplasm that the embryo then acts on. By (4) each of these is a code for its product.
  (6) And the meaning looks context-bound anyway: the same string gets different readings under alternative splicing, RNA editing, recoding or a shifted frame, so meaning isn't sitting in the string.
  (7) Here's the case I made up that bugs her: suppose we synthesized a lineage whose translation table is a uniform permutation of ours, and rewrote its genome to match. It builds exactly the same proteins, lives exactly the same life, but every codon "means" a different amino acid. Nothing changed except the code. To me that says the code is extrinsic and (3) is doing no work; she says it shows two different codes can express the same message, which is exactly what you'd expect if it were a code.
  (8) So either "code" collapses into mere causal specificity — true of tree rings, thermometers and riverbeds, and hence not something that marks genes out as special — or nothing literally carries genetic information and half the vocabulary of molecular biology is metaphor.

  Both horns look wrong to me: I don't want to say the genome is just another riverbed, and I don't want to say molecular biologists are speaking figuratively. So which step do I reject, and what does rejecting it cost me? A couple of things people in my reading group have thrown out, which I want priced rather than repeated: one person says premise (2) isn't clean, because there are stereochemical-affinity results and something about the actual code being unusually good at buffering translation errors — if that's right, does it undercut (2) or only the jump from (2) to (3)? Another says codes need proper functions supplied by selection, which handles my test-tube case, but then I want to know whose selection — the gene's or the organism's, and haven't I just walked into the units-of-selection swamp I was trying to stay out of — and what we'd say about the first self-replicators, before there was selection to supply any functions. And please don't just tell me it depends what I mean by information; tell me which sense of information each premise needs and why the argument can't have all of them at once.
reasoning: |-
  Okay, let me try to unpack this problem. So the user is a philosophy grad student debating with their molecular biologist roommate about whether DNA is truly a code or just a metaphor. The roommate laid out an argument in eight steps, and the user feels it proves too much but can't find the flaw in individual steps. They want to know which step to reject without ending up in undesirable positions—either reducing DNA to mere causal specificity like tree rings, or dismissing molecular biology's language as metaphorical.

  First, I need to parse the roommate's argument clearly. Premise (1) defines a code as requiring arbitrary mapping—conventional, not physically determined. Photographs aren't codes because they resemble what they depict, unlike words. Premise (2) claims codon-to-amino-acid mapping is arbitrary, citing tRNA machinery and variations like mitochondrial codes. Premise (3) concludes DNA is thus a code with semantic meaning. Premise (4) notes that the "convention" is set by chemical machinery, not interpretation. Premise (5) extends this logic: any reliable physical specificity → product becomes a code (e.g., synthetic mRNA in a test tube). Premise (6) adds that meaning is context-dependent (splicing, editing). Premise (7) presents a thought experiment: permuted code producing identical organisms, which the user sees as undermining (3), but the roommate sees as proof of coding flexibility. Premise (8) concludes this forces a dilemma: either "code" is trivialized (tree rings are codes) or genetic information isn't literal. 

  The user's core tension: They want DNA to be special (not just causal specificity) and molecular biology's language to be literal. But the argument threatens both. Their reading group suggested two objections: (A) Premise (2)'s arbitrariness isn't clean due to stereochemical affinities/error buffering—does this weaken (2) or the (2)→(3) leap? (B) Codes require proper functions from selection, which avoids the test-tube case but drags in units-of-selection debates and fails for early replicators. 

  Hmm. Let me start by scrutinizing premise (1). Is arbitrariness sufficient for "code"? The roommate's photograph example suggests resemblance excludes coding, but what about non-arbitrary codes? Morse code isn't arbitrary in symbol length (dots vs dashes), yet it's paradigmatically a code. Traffic lights: red=stop isn't arbitrary (wavelength visibility), but still a code. So (1) might be too narrow. Also, arbitrariness alone doesn't capture intentionality—a code typically implies design or convention for communication. Tree rings correlate with age via physics alone; no "convention" is set. So perhaps (1) misses that codes are representational systems, not just mappings. 

  Premise (5) is where the overextension happens. If any reliable causal chain is a code, then yes, enzyme-substrate shapes or maternal mRNAs become "codes," trivializing the term. But why? Because the chemical machinery in DNA translation evolved to interpret sequences, whereas a river shaping a bed isn't "interpreting" anything. The difference is function: tRNA synthetases are adaptors that evolved to link symbols (codons) to meanings (amino acids), like a lookup table. In the test-tube case, the extract isn't "interpreting" synthetic mRNA; it's reacting chemically without evolutionary purpose. So maybe the gap is between causal specificity and representational specificity. 

  The user's permuted-code thought experiment (7) is clever. If identical organisms can use different codon mappings, that suggests the mapping is extrinsic, but doesn't negate coding—it highlights that the code is a vehicle, not the message. Like two languages describing the same reality. The roommate is right here; this is consistent with codes. The problem arises in (5)'s test-tube case because there's no message or representation—just chemistry. 

  Objection (A) about stereochemistry: Some codons show affinity for their amino acids (e.g., histidine codons bind histidine), and the genetic code is error-robust. But this doesn't refute arbitrariness; it just shows the evolved code isn't fully random. Variations (like mitochondrial codes) prove mappings aren't physically necessary. So (2) holds, and (3) still follows. 

  Objection (B) about proper functions: This might resolve the test-tube issue. If "code" requires teleology—e.g., the machinery evolved to convey information—then synthetic mRNA in a tube lacks that history. But the user worries about units of selection (gene vs organism) and prebiotic replicators. For early replicators, if they had no heritable variation/selection, they arguably weren't "coding" yet; coding emerges with evolvable representation. This avoids trivialization but requires biting the bullet on selection's role. 

  The user wants to avoid "information" ambiguity. Premise (3) needs semantic information (meaning), while (5) conflates it with causal information (reliability). Shannon information is about uncertainty reduction, which DNA has (sequence specifies outcomes), but semantic information adds intentionality. The argument fails by equivocating these. 

  My verdict: Reject the leap from (4) to (5). Premise (4) correctly notes DNA's "convention" is implemented chemically, but (5) ignores that the translation machinery evolved as an interpretive system with representational function. The permuted-code case (7) is fine—it shows coding is extensional—but the test-tube case only has causal reliability, not representational norms. Cost: You must accept that "code" implies evolved teleology, which handles the test tube and early replicators (no selection → no code). This avoids trivialization without making molecular biology metaphorical. 

  Alternative: Reframe "arbitrary" in (1) as "underdetermined by physics," which DNA satisfies, but add that codes require sender-receiver systems. The test-tube extract isn't a "receiver" in that sense. This also blocks (5). 

  Key insight: DNA coding isn't just mapping + arbitrariness; it's part of a functional, evolved system of inheritance and interpretation. Riverbeds lack that.
answer: |-
  Your roommate's argument is clever but overextends due to a conflation of **arbitrariness** with **representational function**. The flaw isn't in premises (1–4) or even (7), but in the leap to (5). Here's the breakdown:

  ### Step to Reject: **Premise (5)**
  **Why it fails:**  
  (5) claims *any* physically specific structure turned into a product by a downstream mechanism counts as a code. This ignores the **teleological and systemic nature of representation**. DNA coding isn't just about reliable causation—it's about **evolutionarily designed representation** within a self-sustaining system.  

  **Cost of Rejection:**  
  You must accept that "code" requires a **biological context of heredity and function**. This excludes synthetic mRNA in a test tube or enzyme-substrate binding, which lack representational intent.  

  ### Why Other Premises Hold (With Nuance)
  - **Premise (1)** is defensible: Codes *do* require arbitrariness (e.g., Morse code isn't inherent in dots/dashes).  
  - **Premise (2)** stands: Codon mappings *are* arbitrary (despite error-buffering optimizations; these are evolutionary "tweaks," not physical necessity).  
  - **Premise (3)** follows: DNA *is* a code because arbitrariness + biological function create semantics.  
  - **Premise (4)** is correct: The "convention" is biochemical machinery.  
  - **Premise (7)** doesn't hurt you: Permuted codes producing identical organisms confirm arbitrariness (like translating a book into French).  
  - **Premise (6)**: Context-dependence (splicing, etc.) is a feature of complex codes, not a refutation (e.g., "bank" means different things in different sentences).  

  ### Addressing Objections From Your Reading Group
  1. **"Stereochemical affinities/error buffering undermine (2)":**  
     - These only show the code is *optimized*, not physically determined. Variations across species prove arbitrariness. This doesn’t threaten (2) or (3).  

  2. **"Codes need proper functions from selection":**  
     - **This resolves the test-tube case:** Synthetic mRNA lacks evolutionary history, so it’s not a "code."  
     - **Cost:** You must bite the "units of selection" bullet. But the minimal commitment is:  
       - Functions arise from **lineage-level selection** (organisms/cells).  
       - For early replicators, if they lacked heritable variation/selection, they didn’t have a "code" yet. Coding emerges with evolvable representation.  
     - **Why it’s necessary:** Teleology prevents trivialization. Riverbeds and tree rings aren’t *for* conveying information; ribosomes *are*.  

  ### Why "Information" Isn't Equivocated Here
  The argument uses "semantic information" consistently:  
  - **Premises (1–3):** Requires **intentionality** (stand-for relations).  
  - **Premise (5):** Illicitly switches to **causal information** (reliability without intentionality).  
  - **Resolution:** Genetic information is **teleosemantic**—meaning arises from evolved biological functions.  

  ### The Solution: A Third Way Out
  Rejecting (5) gives you:  
  - **DNA is literally a code** (it has arbitrariness + evolved representational function).  
  - **Molecular biology isn’t metaphorical** (terms like "transcription," "translation," "code" are apt).  
  - **Genes are special**: Unlike riverbeds, they’re part of a **self-replicating interpretive system** where sequences are *used as instructions* by cellular machinery.  

  **What this costs:** You accept that "code" applies only in contexts of **biological interpretation** (heredity, adaptation). This excludes test-tube synthetics but preserves the core of molecular biology’s language and DNA’s unique status.  

  **Final note:** Your roommate’s permuted-code thought experiment (7) actually *supports* your view—it shows that sequences gain meaning from the system’s interpretive rules, not intrinsic physics. That’s the essence of coding. The flaw was letting "interpretation" collapse into mere chemistry in (5), ignoring the evolutionary context that makes chemistry *semantic*.
