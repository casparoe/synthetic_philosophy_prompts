answer: |-
  ### **In-Class Game Design: Cooperation via Source-Code Recognition**

  **Core Idea:** Students submit "programs" (simple rule sets) that receive an opponent's source code as input and output an action (Cooperate/Defect) in a one-shot Prisoner's Dilemma. Cooperation emerges when programs recognize copies of themselves, but perturbations break recognition, causing collapse. Students experience the fragility of cooperation without repetition, enforcement, or altruism.

  ---

  ### **Rules, Materials & Timeline**  
  **Total Time:** 90 minutes  
  **Students:** 18 (split into 9 pairs per round).  
  **Materials:**  
  - Paper forms for submissions (template below).  
  - Whiteboard/projector for leaderboard.  
  - Randomizer tool (dice, online tool, or slips in a hat) for pairing.  
  - Payoff matrix (visible throughout):  

  |          | **Cooperate (C)** | **Defect (D)** |  
  |----------|-------------------|----------------|  
  | **C**    | 3, 3              | 0, 5           |  
  | **D**    | 5, 0              | 1, 1           |  

  *(T=5, R=3, P=1, S=0; satisfies T > R > P > S and 2R > T + S)*  

  **Stakes:**  
  - **Individual Score:** Points earned across rounds (e.g., "Trust Tokens").  
  - **Group Total:** Sum of all individual scores (displayed live).  

  **Timeline:**  
  1. **0–10 min: Introduction & Setup**  
     - Explain: "You are submitting a *program* that outputs C/D after reading an opponent’s *source code*. No communication, repetition, or enforcement. Goal: Maximize your tokens."  
     - Show payoff matrix. Emphasize anonymity.  

  2. **10–20 min: Submission**  
     - **Submission Format:** Fixed natural-language template (prevents crashes/ambiguity):  
       ```  
       RULE 1: If [CONDITION], then OUTPUT [C/D].  
       RULE 2: Otherwise, OUTPUT [C/D].  
       ```  
       **Conditions (choose one):**  
       - "OPPONENT'S SOURCE CODE IS IDENTICAL TO MINE"  
       - "OPPONENT'S SOURCE CODE CONTAINS THE WORD '[WORD]'" (student fills [WORD])  
       - "ALWAYS" (default)  
     - **Example Submission:**  
       `RULE 1: If OPPONENT'S SOURCE CODE IS IDENTICAL TO MINE, then OUTPUT C. RULE 2: Otherwise, OUTPUT D.`  
     - Students write submissions anonymously on paper.  

  3. **20–25 min: Anonymize & Pair**  
     - Collect submissions, shuffle, and assign random IDs (e.g., P1–P18 + 4 planted submissions).  
     - **Plant 4 Submissions** (guarantee key outcomes):  
       - `AlwaysDefect`: `RULE 1: ALWAYS OUTPUT D.`  
       - `AlwaysCooperate`: `RULE 1: ALWAYS OUTPUT C.`  
       - `CopyDetector`: `RULE 1: IF IDENTICAL TO MINE, OUTPUT C. RULE 2: OTHERWISE, OUTPUT D.`  
       - `KeywordDetector`: `RULE 1: IF CONTAINS "TRUST", OUTPUT C. RULE 2: OTHERWISE, OUTPUT D.`  
     - Pair programs randomly (9 pairs per round).  

  4. **25–60 min: Four Rounds of Play**  
     - **Run each round (5 min setup + 5 min execution):**  
       1. **Round 1: Plain Source Exchange**  
          - Give each program its opponent’s *exact* source code.  
          - **Expected:** `CopyDetector` pairs cooperate (3,3). `AlwaysDefect` exploits `AlwaysCooperate` (5,0).  
       2. **Round 2: Obfuscated Source**  
          - Apply "compiler": (1) Insert "//" + random number (e.g., `//42`), (2) Capitalize random letter.  
          - **Expected:** `CopyDetector` fails (no longer identical). `KeywordDetector` still works if "[WORD]" survives.  
       3. **Round 3: Behavioral Fingerprint**  
          - Replace source with outputs against 3 fixed probes:  
            - Probe1: `AlwaysCooperate` → Output: C  
            - Probe2: `AlwaysDefect` → Output: D  
            - Probe3: `KeywordDetector` (word="TRUST") → Output: C (if opponent contains "TRUST") else D  
          - **Expected:** `CopyDetector` cooperates only if fingerprints match (rare). `KeywordDetector` fails (no source to scan).  
       4. **Round 4: Execution Noise**  
          - Flip output with 10% probability (e.g., roll dice: 1–10; 1 = flip).  
          - **Expected:** Cooperation collapses even among matched pairs due to random defections.  

  5. **60–80 min: Scoring & Leaderboard**  
     - After each round:  
       - Calculate payoffs.  
       - Update **Individual Scores** (sum of payoffs) and **Group Total**.  
       - Show top 3 leaders (e.g., "P5: 12 tokens").  
     - **Key Outcome:** `AlwaysDefect` likely tops the leaderboard by exploiting cooperators.  

  6. **80–90 min: Debrief**  
     - **Reveal the Idea:** "Program Equilibrium" (cooperation via source-code recognition).  
     - **Discussion Points:**  
       - **Not Folk Theorem:** No repetition/future. Cooperation hinges on *recognition*, not reciprocity.  
       - **Trust ≠ Universality:** Cooperating with "copies of yourself" works; "anyone who cooperates with you" requires infinite regress ("how do they know you’ll cooperate?").  
       - **Equilibrium, Not Solution:** Mutual cooperation is *one* equilibrium (others: mutual defection, keyword pairs). No unique "rational" choice.  
       - **Individual vs. Collective:** `AlwaysDefect` wins individually, but if all submit `CopyDetector`, group total is maximized.  
     - **Handle the Skeptic:** "Yes, defectors won individually! But if *everyone* defects, all get 1 point. Cooperation is stable *only* if recognition is possible."  

  ---

  ### **Anticipated Problems & Solutions**  
  1. **Copy-Detectors Fail (e.g., extra space):**  
     - *Solution:* Highlight in debrief: "Recognition is fragile! A single character breaks trust."  

  2. **Out-of-Band Collusion (e.g., agreeing on a keyword):**  
     - *Solution:* Anonymize rigorously. If detected, note: "Real-world collusion requires communication we forbid."  

  3. **Underspecified/Crashing Submissions:**  
     - *Solution:* Template forces complete rules. "Otherwise OUTPUT [C/D]" is a catch-all.  

  4. **Unconditional Cooperator Flattens Dynamics:**  
     - *Solution:* Plant `AlwaysCooperate` to show exploitation.  

  5. **Student Lies About Submission:**  
     - *Solution:* Run what’s written, not claimed.  

  6. **Time Shortfall:**  
     - *Solution:* Run 2–3 pairs as examples per round; extrapolate scores.  

  ---

  ### **What the Game Cannot Stage**  
  **Infinite Regress of Mutual Simulation:**  
  - Programs in the literature can simulate opponents’ code (e.g., "I cooperate if you output C when given my code"). This risks infinite loops or undecidability.  
  - **Why Absent:** Our template uses string matching, not simulation. Students would need coding skills to handle recursion.  
  - **Bridge in Debrief:** "In full program equilibrium, programs must *simulate* opponents. But simulation can crash or loop forever. Our game avoids this with simple rules, but the theoretical depth remains."  

  ---

  ### **Why This Works**  
  - **Engagement:** Students "find" cooperation via copy-detection, then lose it to perturbations.  
  - **Clarity:** Template ensures submissions are executable and short.  
  - **Teachability:** Planted submissions guarantee failure modes; scoring makes tradeoffs visceral.  
  - **Debrief:** Explicitly ties rounds to theoretical insights.  

  This design balances simplicity with depth, ensuring students *feel* the fragility of cooperation without repetition or enforcement.
