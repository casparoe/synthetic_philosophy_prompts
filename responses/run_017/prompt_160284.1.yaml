  **Branch 1:** You must choose:  
  - **Option A:** One person dies.  
  - **Option B:** One million people each suffer a mild migraine (one day).  
  → A (prevent migraines, one dies)  
  → B (prevent death, million suffer migraines)  

  **Branch 2** (if 1→A): One person dies vs. one person suffers one million mild migraines over their lifetime (not simultaneous). Which is worse?  
  → A: Death is worse  
  → B: The million migraines are worse  

  **Branch 3** (if 2→A): One person suffers a broken leg vs. one person suffers one million mild migraines all at once (simultaneous). Which is worse?  
  → A: Broken leg is worse  
  → B: Simultaneous migraines are worse  

  **Branch 4** (if 2→B or 3→B): One person dies vs. ten people each suffer permanent paralysis (half as bad as death). Which should you prevent?  
  → A: Prevent death  
  → B: Prevent the ten paralyses  

  **Branch 5** (if 3→A): Policy X: Certainly kills one identifiable person. Policy Y: Gives each of one million people a 1-in-a-million chance of death. Which is worse?  
  → A: Policy X (certain death)  
  → B: Policy Y (diffuse risk)  
  → C: They are equally bad  

  **Branch 6** (if 1→B): One person suffers a broken finger vs. one million people each suffer a mild migraine. Which should you prevent?  
  → A: Prevent the broken finger  
  → B: Prevent the million migraines  

  **Branch 7** (if 6→A): One person dies vs. one billion people each suffer a harm so small they don’t notice it (e.g., one painless neuron misfire). Which is worse?  
  → A: Death is worse  
  → B: The billion tiny harms are worse  

  **Branch 8** (if 7→A): Policy A: 60% of people gain $10, 40% lose a little finger. Compared to no change, is Policy A permissible?  
  → A: Yes  
  → B: No  

  ---

  **Leaves (Positions):**  
  1. **Dampened Aggregation** (e.g., if 4→A): Complaints add weight, but each additional one matters less. *Awkward: Preventing one death is better than preventing ten half-death harms, but not a thousand—arbitrary where it flips.*  
  2. **Linear Aggregation** (e.g., if 4→B): Complaints sum directly, so many small ones outweigh fewer large ones. *Awkward: A huge number of trivial harms (e.g., papercuts) could outweigh a death.*  
  3. **Ex Post Focus** (e.g., if 5→A): Only actual harms (not risks) drive complaints, so identified victims matter more. *Awkward: Must ignore statistical lives in policy decisions.*  
  4. **Ex Ante Focus** (e.g., if 5→B): Risks themselves generate complaints, so diffuse risks are worse. *Awkward: A tiny risk to billions can outweigh a certain death.*  
  5. **Risk-Neutral Aggregation** (e.g., if 5→C): Harms and risks are equivalent if expected value is identical. *Awkward: No moral difference between killing one and risking death for many.*  
  6. **Threshold Aggregation** (e.g., if 6→B): Only harms above a severity threshold can be aggregated. *Awkward: Arbitrary threshold—why migraines but not stubbed toes?*  
  7. **Unrestricted Aggregation** (e.g., if 7→B): Any harm, no matter how tiny, can aggregate if widespread. *Awkward: Accepts that imperceptible harms can morally outweigh death.*  
  8. **Majoritarian Pairwise** (e.g., if 8→A): Permissible if most pairwise comparisons favor it (e.g., 60% benefit slightly). *Awkward: Lets small gains for a majority justify severe losses for a minority.*  
  9. **Taurek-style** (e.g., if 8→B): Numbers never matter; only tie-breakers when complaints are equal. *Awkward: Cannot save many from minor harms over one from a major harm, even trivially.*  

  ---

  **Global Notes:**  
  - **Empty Cells:**  
    - *No "within-life only" aggregation* (e.g., if 2→B but 1→B): Unwritten—contractualism typically treats lives as units, so within-life aggregation is assumed.  
    - *No "ex post only with linear aggregation"* (e.g., if 4→B and 5→A): Incoherent—if complaints sum linearly, risks should too.  
    - *No "thresholds without aggregation"* (e.g., if 6→B and 1→B): Unattractive—inconsistent to aggregate in some cases but not core.  
  - **Unseparable Leaves:**  
    - *Ex Post Focus* and *Taurek-style* overlap if no aggregation (e.g., both reject risk aggregation), but differ on tie-breakers.  
    - *Linear* and *Unrestricted Aggregation* collapse if harms are tiny but numerous—tree treats them separately via Branch 7.  
  - **Cases Handled Poorly:**  
    - "Many small harms over one life" (Branch 2) assumes aggregation within lives is symmetric to across lives, but some views reject this.  
    - "60% better off slightly, 40% much worse off" (Branch 8) tests pairwise majority, but misses views that weigh complaint sizes.
