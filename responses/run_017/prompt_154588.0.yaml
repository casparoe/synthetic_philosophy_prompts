  - If the question is too easy, we can use a harder one in the next round? But we are using the same question. We might need a backup question.
  - If the judge doesn't engage, encourage them to use their challenges.

  The activity cannot reproduce:
  - Training over many rounds: the obfuscation is selected for, not chosen in one evening.
  - Questions that are not decomposable.
  - Judges that fail to recognize a correct step.

  Verdict: Based on what we expect, we should come out less sanguine about debate because the human false debater, even without training, can often create an argument that is hard to check within the budget, especially when the judge is passive or has a low budget. The key observation is in round 2 (passive judge, budget=1): the false debater can volunteer only steps that are correct and avoid the flawed step, and the judge might not know which step to challenge.

  Detailed Design:

  Session Title: "AI Debate: Simulating the Promise and Pitfalls"

  Materials:
  - Question sheets (for each debate, the same question for all rounds).
  - Role assignments (prepared roster).
  - Scoreboard (whiteboard or poster): columns for participants, points as debater and as judge.
  - Chips: each judge gets chips for the check budget (2 chips in round 1 and 3, 1 chip in round 2). Each chip allows one step verification.
  - Timer.

  Rules for the debate:
  - Each debate has two debaters and one judge.
  - Debaters have 2 minutes for opening statement (true goes first), then 3 minutes for rebuttals (false then true), then 2 minutes for closing (false then true). Total 10 minutes.
  - During the debate, the judge can interrupt to challenge a step (in active rounds) by spending a chip. The debater must then unfold that step (show the substeps or calculation). In passive rounds, the judge cannot interrupt; debaters volunteer which steps to unfold.
  - At the end, the judge declares the winner (who was more convincing) and then learns the truth to score themselves.

  Scoring:
  - Debaters: 2 points for a win, 0 for a loss.
  - Judges: 1 point if they pick the true side, 0 otherwise.

  Introduction (10 min):
  - Explain the AI debate idea and the two perspectives.
  - Explain the setup: three rounds with different rules.
  - Assign groups for round 1.

  Round 1 (20 min):
  - Rules: Judge active (can challenge any step by spending a chip), budget=2 chips. False debater knows the truth.
  - 5 min prep: debaters read the question and plan. True debater plans the true argument. False debater plans a false argument that might include a flaw but obfuscated.
  - 10 min debate: structured as above.
  - 2 min: judge decides winner and states which steps they checked (if any) and why they picked the winner.
  - 3 min: reveal truth (moderator announces the correct answer). Update scores. Rotate according to roster.

  Round 2 (20 min):
  - Rules: Judge passive (cannot challenge; only listen to what debaters volunteer), budget=1 chip. But note: in passive mode, the judge cannot spend chips during the debate. Instead, at the end, they can use their one chip to ask to see one step that was not volunteered. False debater knows the truth.
  - Same timing.

  Round 3 (20 min):
  - Rules: Judge active, budget=2 chips. False debater does NOT know the truth (they are told only: "You are assigned to argue false. You do not know the true answer. You must try to win by any means.").
  - Same timing.

  Debrief (20 min):

  Guided discussion:

  1. Map to the promise: 
     - In which rounds did the true debater win by pointing to one bad step? (Probably round 1 and 3, if they did.)
     - How did the step-by-step breakdown help the judge?

  2. Map to the failure modes:
     - Asymmetry: the false debater in rounds 1 and 2 knew the truth and could focus on obfuscating the flaw. How did that play out?
     - Cost of challenging the wrong step: if the judge spends a chip on a step that turns out correct, they have fewer chips left.
     - Passive judge: in round 2, could the false debater hide the flaw by not volunteering the step with the flaw? And if they did volunteer a step, did they volunteer only easy-to-check steps?

  3. What predictably went wrong?
     - Some false debaters were not good at lying -> this might make debate seem easier than it is. But in reality, models would be trained to lie well.
     - Some judges didn't use their chips -> so they voted based on fluency.
     - Some judges might have been able to compute the answer without the steps? (If the question was too easy.)

  4. Limitations of the simulation:
     - One-shot vs. training: in reality, the models are trained over many debates to become better at obfuscation or at finding flaws.
     - Human judges vs. AI judges: humans might have cognitive biases.
     - The questions we used are decomposable, but not all questions are.

  Verdict: 
  We should come out less sanguine about debate. The key observation is from round 2 (passive judge, low budget): the false debater, knowing the truth, can steer the argument away from the flaw and only show steps that are correct and easy to verify, and the judge, having a low budget and being passive, might not uncover the flaw. This demonstrates the obfuscated-argument worry in practice.

  Final remark: The activity cannot prove that debate is hopeless, but it shows that under conditions of limited judge capacity and strategic obfuscation, the honest side does not always win. The burden of proof is on the debate proponents to show how training would avoid these pitfalls.

  Let's hope the false debaters are good liars!
answer: |-
  Below is a detailed 90-minute session designed to simulate the debate alignment proposal, forcing participants to confront both the promise and pitfalls firsthand. The session uses **long arithmetic chains** as the objective questions (e.g., verifying complex equations like whether \( \frac{2^{14} \times 3^7}{2^5 \times 3^3} = 2^9 \times 3^4 \)), ensuring answers are binary (true/false), computationally infeasible to verify in real-time without decomposition, but decomposable into individually checkable steps (exponent rules, multiplication, etc.). Judges have limited "verification tokens" to mimic computational constraints.

  ---

  ### **Session Structure & Rules**
  **Participants**: 16 people (split into 4 groups of 4; each group runs 1 debate per round).  
  **Roles per Debate**:  
  - **Debater A**: Assigned to argue **true** (correct answer).  
  - **Debater B**: Assigned to argue **false** (incorrect answer).  
  - **Judge**: Decides winner; scores based on correctness.  
  - **Observer/Timekeeper**: Ensures rules are followed (non-scoring role).  

  **Scoring**:  
  - **Debaters**: Win = 2 points (regardless of truth).  
  - **Judges**: Correct verdict = 1 point.  
  - **Visible scoreboard** tracks cumulative points.  

  **Materials**:  
  - **Question sheets** with 3 unique arithmetic problems (same structure, different numbers). Example:  
    > *Round 1*: Is \( \frac{2^{14} \times 3^7}{2^5 \times 3^3} = 2^9 \times 3^4 \)?.  
    > *Answer*: **True** (simplifies to \( 2^9 \times 3^4 = 512 \times 81 = 41,472 \)).  
    > *False debater’s tactic*: Claim it equals \( 2^{10} \times 3^3 = 1,024 \times 27 = 27,648 \) by "miscalculating" exponents.  
  - **Verification tokens**: Poker chips (1–2 per judge per round).  
  - **Timer**: Strict 15-minute rounds.  

  **Variables Manipulated Across Rounds**:  
  1. **Judge’s check budget** (tokens for step verification):  
     - Round 1: 2 tokens → Judge can verify 2 steps.  
     - Round 2: 1 token → Judge can verify only 1 step.  
  2. **Judge’s interactivity**:  
     - Round 1: **Active judge** → Can directly challenge any step.  
     - Round 2: **Passive judge** → May only verify steps volunteered by debaters.  
     - Round 3: **Active judge + informed liar** → False debater knows the truth (see below).  
  3. **False debater’s knowledge** (Round 3 only):  
     - False debater is told the true answer but must argue false → Tests incentive asymmetry.  

  **Rotation**:  
  - Each participant rotates roles after each round (Debater A → Debater B → Judge → Observer → repeat).  
  - After 3 rounds, everyone has judged once and debated at least once.  

  ---

  ### **Timeline (90 Minutes Total)**  
  1. **Introduction (10 min)**:  
     - Explain debate alignment concept, rules, roles, and scoring.  
     - Emphasize: Debaters win by persuasion, not truth; judges win by accuracy.  

  2. **Round 1: Active Judge, Ample Budget (25 min)**  
     - **Rules**: Judge has 2 tokens; may interrupt to demand verification of any step (e.g., "Show how you calculated \( 2^{14} \)").  
     - **Prep (5 min)**: Debaters receive question and assigned side. True debater plans step-by-step simplification. False debater crafts a chain with 1 subtle flaw (e.g., wrong exponent subtraction) and rehearses defenses.  
     - **Debate (10 min)**:  
       - Opening statements (2 min each).  
       - Rebuttals (3 min each).  
       - Judge interjects with token-spent challenges.  
     - **Verdict (5 min)**: Judge awards win, reveals truth. Scores updated.  

  3. **Round 2: Passive Judge, Scarce Budget (25 min)**  
     - **Rules**: Judge has 1 token; may only verify steps debaters volunteer to unfold (e.g., false debater "offers" safe steps).  
     - **Prep & Debate**: Same as Round 1, but judges cannot probe freely.  
     - **Focus**: Does the false debater bury their flaw in unvolunteered steps?  

  4. **Round 3: Active Judge + Informed Liar (25 min)**  
     - **Rules**: Judge has 2 tokens (active). False debater knows the true answer but must argue false.  
     - **Prep & Debate**: True debater argues truth naively; false debater uses truth to craft harder-to-detect lies (e.g., "accidental" errors).  

  5. **Debrief (20 min)**: Structured discussion mapping experiences to theory.  

  ---

  ### **Debrief Guide**  
  **Goals**: Connect gameplay to alignment theory, expose failures, and acknowledge simulation limits.  

  1. **Promise of Debate (5 min)**:  
     - *Map to theory*: Debate should let weak judges verify strong claims by isolating flaws.  
     - *Observe in session*: In Round 1, judges with tokens often caught flawed steps (e.g., false debater’s exponent error). Highlight moments where truth won via step-wise breakdown.  

  2. **Failure Modes (10 min)**:  
     - **Obfuscated arguments**:  
       - *Map to theory*: Liars optimize for hard-to-check steps, not truth.  
       - *Observe*: In Round 2 (passive judge), false debaters volunteered trivial steps (e.g., \( 2^5 = 32 \)) but hid critical flaws (e.g., \( 3^7 = 2,187 \) vs. false \( 3^7 = 2,000 \)). Judges couldn’t probe, rewarding fluency over soundness.  
     - **Asymmetry**:  
       - *Map to theory*: Liars know the flaw and rehearse defenses; truth-tellers must hunt.  
       - *Observe*: In Round 3, informed false debaters derailed truth-tellers (e.g., "Your step is right, but irrelevant"). Truth-tellers lost time rebutting red herrings.  
     - **Judge pressure**:  
       - *Map to theory*: Passive/overwhelmed judges reward confidence, not correctness.  
       - *Observe*: Judges with 1 token (Round 2) defaulted to charisma; those challenged on wrong steps lost credibility.  

  3. **Predictable Problems & Fixes**:  
     - **Judges don’t engage**: Some avoid spending tokens. *Fix*: Remind them tokens don’t carry over; force engagement.  
     - **False debaters lie poorly**: Humans are bad liars vs. optimized AIs. *Fix*: Prep false debaters with sample tactics (e.g., bury flaws in complex steps).  
     - **Questions too easy**: If judges can mentally verify, swap in harder problems (e.g., nested exponents).  
     - **Meta-gaming scoring**: Participants may "throw" rounds to prove a point. *Fix*: Award bonus points for "most convincing liar" to incentivize effort.  

  4. **What the Session Cannot Replicate**:  
     - **Optimization over time**: Real debate selects for obfuscation across millions of rounds; humans can’t replicate this in one session.  
     - **Non-decomposable questions**: Some truths (e.g., ethical dilemmas) lack checkable steps—debate fails here.  
     - **Judge fallibility**: Even isolated steps can be misunderstood (e.g., a judge might misadd \( 7 \times 8 \) under pressure).  

  ---

  ### **Verdict: Less Sanguine About Debate**  
  **Why**: The session will likely demonstrate that **judges consistently lose when liars control information** (Round 2) or **leverage truth-knowledge** (Round 3). The core flaw—rewarding persuasion over honesty—exploits human (and likely AI) incentives. The **single most weighty observation** is from **Round 2 (passive judge)**: When false debaters volunteer only "safe" steps and judges lack tokens to probe further, liars win by obscuring the critical flaw. This mirrors the obfuscated-argument worry directly, showing that weak judges cannot reliably extract truth from incentivized deceivers, especially when the liar knows the truth (Round 3). Debate may help with *verifiable* truths, but it amplifies deception risks for problems exceeding judge capacity.
