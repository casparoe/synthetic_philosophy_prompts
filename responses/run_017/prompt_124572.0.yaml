  Let me unpack their core ask: they need 4-5 prioritized research questions where answers would actually change whether funders take "AI market socialism" seriously. Not a literature survey - actionable agenda. And they care about tractability for theorists without big compute resources.

  *scratches head* The tricky part is avoiding obvious but dead-end questions. Like "can AI predict prices?" is boring - of course it can somewhat. The real tension is between Hayek's dispersed tacit knowledge versus what modern data exhaust might capture. That's the needle to thread.

  First question should tackle the elephant in the room: can ML actually internalize context that market prices convey? Because if not, the whole hypothesis collapses early. That's upstream - nothing else matters if local knowledge stays stubbornly tacit. Philosophers could handle this by studying algorithmic pricing in firms versus open markets.

  Second question... ah! Counterfactual simulation. Lange's trial-and-error was slow, but if ML can rapidly simulate "what if we changed this price?" that changes the game. Though I wonder about emergent effects - simulating a whole economy might be like predicting weather three weeks out. Chaotic systems defeat even good models.

  *checks notes* The user mentioned firms increasingly using internal planning algorithms. That's relevant! Question three should examine whether corporate "planned economies" succeed specifically where they overcome knowledge problems - like how Amazon's algorithms might know things local store managers don't.

  Fourth question needs to be the reality check: even if theoretically possible, would deploying this at scale create systemic risks? Like homogenizing failure modes. That's where complex systems theorists could contribute without needing GPU clusters.

  *mental note* Must explicitly dismiss low-value questions: "Can AI optimize?" (yes, trivially) or "Will planners be corrupt?" (incentive issue, off-topic). Stay laser-focused on knowledge transmission.

  Final filter: which answers would make a funder say "Whoa, this might actually work" versus "Nope, Hayek still wins"? That's the priority sort. The tacit knowledge question could kill it fast; the counterfactual simulation question might resuscitate it. Hence their order.

