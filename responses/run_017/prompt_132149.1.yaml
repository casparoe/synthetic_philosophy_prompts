prompt: |-
  I've been reading about the question people discuss under the heading of moral worth — whether someone who does the right thing does it for the reason that makes it right — and I keep hitting a case type that doesn't match the standard examples. Two instances.

  (1) A department chair blocks a hiring decision because she believes the search was procedurally rigged. It was rigged, and that is exactly what makes blocking it the right thing to do. But her belief comes from misreading an email: she thinks the shortlist was cut for an improper reason when it was not, and there is a different, unnoticed defect of the same kind that does taint the process. Had the email read differently, she would have let a rigged decision through.

  (2) A tenants' association leader rejects a settlement that would benefit her own building, because she believes accepting would set a precedent that hurts tenants elsewhere. That is true, and it is the best thing to be said for rejecting. But she believes it only because a friend in law school told her so; she cannot reconstruct the argument, and the argument her friend gave was bad. The sound argument is one she has never heard.

  In both, the agent acts on the consideration that genuinely makes the action right, and in both the route from that consideration to the action is broken in some way. It is not the familiar case of right action from a self-interested motive, and it is not action that is right by luck; whatever goes wrong here goes wrong inside the agent's own psychology. Nor is it clear to me that the agent's true belief merely needs to be added to the story, since in each case she would have acted the same way had the belief been false.

  Does this configuration have a name? More than the label, I want the carving: are (1) and (2) one defect or two, or more than two? How does the case sit with the standard requirement that the agent act because of the right-making feature, and with the views that relax that requirement? Does the breakage remove credit entirely, reduce it, or leave it untouched? And where is the boundary — is there a version where the broken route is harmless, and a neighboring version where the same breakage is clearly worse? If nothing established fits, coin a term, define it, and give me boundary cases. No reading list or citations, please; the distinction itself is what I am after. Please answer in American English.
reasoning: |-
  Okay, let me tackle this user's query about moral worth in these tricky cases. They've presented two scenarios where people do the right thing for the right reason, but through flawed reasoning. The user wants to understand if there's a name for this, how to categorize the defects, and how it affects moral credit. 

  First, I need to unpack both cases carefully. In the department chair scenario, she blocks hiring based on a mistaken belief about email evidence, yet coincidentally there was actual rigging she didn't notice. The tenants' leader rejects a settlement based on a poorly explained legal argument from a friend, though a sound justification exists that she's unaware of. Both act on the right-making feature (procedural integrity/tenant solidarity), but their epistemic routes are defective.

  The core tension here is between the consideration being objectively correct versus subjectively flawed in its acquisition or justification. This isn't about bad motives like self-interest, nor pure luck - the defect is in how they formed the belief supporting their action. 

  I recall debates in moral philosophy about "acting for the right reason" requiring proper sensitivity to the reason. These cases feel like they expose a gap in standard accounts. Maybe I should frame this as an "epistemic disconnect" - where the agent grasps the right consideration but lacks proper epistemic grounding. 

  For the defect analysis: There are actually two issues in each case. First, the false belief (email misinterpretation/bad legal argument) that motivated them. Second, the failure to recognize the actual right-making feature (unnoticed rigging/valid precedent harm). But crucially, they'd act identically even without the real justification existing - that's what makes this philosophically juicy. 

  On moral credit: I think it's reduced but not erased. They show good will by responding to what they perceive as moral demands, unlike selfish actors. But their flawed reasoning prevents full credit since their judgment isn't reliably aligned with truth. 

  For boundary testing: Imagine if the chair had correctly noticed the real rigging but misinterpreted minor details - that might be harmless. Or if the tenants' leader vaguely sensed the precedent issue without articulation - that feels worse than having a sound but inarticulate intuition. 

  The user clearly wants conceptual precision, not citations. I'll avoid jargon and coin "epistemically unsupported moral alignment" to capture this. American English phrasing is key - no "whilst" or "one might think." Need crisp examples showing the spectrum from excusable to culpable disconnect. 

  This user is philosophically sophisticated - they've constructed original counterexamples to test moral frameworks. I'll honor that by offering nuanced categorization rather than forcing existing labels. The carving matters more than the name.
answer: |-
  This is a sharp observation. Your cases expose a **fractured alignment** between the agent's motivating reason and the objective right-making feature. The core defect is **epistemic disconnect within the right-making consideration itself**. Let's carve it up:

  1.  **The Shared Defect: Epistemically Unsupported Right-Motive (EURM)**
      *   In both cases, the agent *is* motivated by the consideration that *actually* makes the act right (procedural integrity in (1), solidarity/precedent harm in (2)). This distinguishes it from acting on a *different* motive (like self-interest).
      *   **However,** their *grasp* of *why* that consideration applies, or their *justification* for believing it applies, is flawed or non-existent.
      *   (1) She believes the *specific instance* of rigging exists based on faulty evidence (misread email), while the *real* rigging is unseen. Her belief is *about* the right-making feature (rigging) but is *accidentally true* due to unseen rigging.
      *   (2) She believes the *general principle* (precedent harms tenants) based on an unreliable source/bad argument. She holds the *correct* general belief motivating the action, but lacks any sound *reason* for holding it.
      *   **The Break:** The connection between the agent's psychology and the *truth* or *validity* of the right-making consideration *as they conceive it* is broken. They hold the *proposition* that constitutes the right reason, but their epistemic basis for that proposition is defective. They act *on* the right reason, but not *because* it is true/valid – they lack the cognitive connection to its truth/validity.

  2.  **Number of Defects:** Two Intertwined Defects
      *   **Defect 1: Accidental Truth/Validity:** The agent's motivating belief about the *specific* right-making circumstance (1) or the *general* right-making principle (2) is true/valid, but only coincidentally. It *could easily have been false/invalid* given their epistemic process (misread email, bad argument).
      *   **Defect 2: Lack of Rational Sensitivity:** The agent lacks the cognitive resources (evidence, understanding, sound reasoning) to *discern* the truth/validity of the consideration motivating them. Their action is not responsive to *reasons supporting the right-making feature*; it's responsive only to *holding the belief*, however flawed its origin.

  3.  **Relation to "Acting Because of the Right-Making Feature":**
      *   **Strict Views (e.g., Kantian):** Fail. Acting "because of" requires the reason's *moral salience* to motivate, not just the propositional content. The broken epistemic link means the *moral force* of the reason isn't what moved them; it was the *belief state* itself, poorly grounded. They didn't act *in light of* the *validity* of the reason.
      *   **Relaxed Views (e.g., some Consequentialists):** Might grant *some* credit. The *content* of their motive aligns with the good. Their *intention* was morally directed (unlike self-interest). However, the lack of rational grounding weakens the connection to *why* the act is right.

  4.  **Moral Credit:** **Significantly Reduced, Not Eliminated.**
      *   **Credit:** They display *some* good will. They aimed at the right *kind* of consideration (integrity, solidarity). They weren't selfish or malicious. There's a basic alignment of intention with objective rightness.
      *   **Reduction:** Full credit requires the action to flow from *understanding* or *rational appreciation* of the right-making feature. The EURM defect means:
          *   Their action wasn't *reliably* right; it was lucky.
          *   They don't demonstrate *practical wisdom* or sound moral judgment.
          *   They don't show *why* the feature is right-making; they just parrot/stumble onto the correct proposition.
      *   **Not Eliminated:** Contrast with acting on self-interest *despite* knowing the right reason. Here, the agent *is* trying to respond to moral demands, albeit incompetently. It's better than acting on a *bad* motive.

  5.  **Boundaries & Variations:**
      *   **Harmless Breakage (Minimal Credit Reduction):** Imagine the tenants' leader vaguely senses the precedent harm based on years of experience and tenant stories, but struggles to articulate a rigorous argument. She has *some* non-articulate justification rooted in pattern recognition. The epistemic link is weak but not *entirely* broken. Credit is higher.
      *   **Clearly Worse (Near Elimination of Credit):**
          *   **Version A (False Belief Dominates):** The chair blocks hiring *primarily* because she dislikes a candidate, but *also* latches onto the misread email as a post-hoc justification. The right-making feature (integrity) is a rationalization, not the real (flawed) motive. Credit plummets.
          *   **Version B (Complete Disconnect):** The chair blocks hiring because she believes the committee used Comic Sans in the email, which she finds deeply unprofessional and "rigged" (her bizarre definition). Unbeknownst to her, the process *was* actually rigged. She acts on a consideration *she labels* "rigged," but it's not the right-making feature (procedural fairness) at all. She acted on a *different, crazy* reason that accidentally aligned with the outcome. Minimal credit.
          *   **Version C (Willful Ignorance):** The tenants' leader hears the sound argument against the settlement but dismisses it because it came from someone she dislikes. She clings to her friend's bad argument. Here, the EURM defect is compounded by *culpable* disregard for better justification. Credit greatly reduced, approaching zero.

  **Coined Term & Definition:**

  **Epistemically Unsupported Moral Alignment (EUMA):** An agent performs the objectively right action and is motivated by the proposition that constitutes the primary right-making feature, but their belief in that proposition lacks adequate justification, rational grounding, or sensitivity to its truth/validity. Their action aligns with the right reason *in content* but not *in rational force*.

  *   **Core:** Motivated by the *correct proposition* identifying the right-making feature, but with a *faulty epistemic basis* for that belief.
  *   **Effect:** Significantly reduces moral credit/praise because the action does not demonstrate sound moral judgment or reliable responsiveness to the *reasons why* the feature is right-making. It reveals luck, not virtue, in the alignment.
  *   **Contrasts With:**
      *   *Right Action, Wrong Motive:* Motivated by a different consideration (e.g., self-interest).
      *   *Moral Luck (Resultant):* Action turns out right due to external luck, regardless of motive/reason.
      *   *Justified True Belief Motive:* Motivated by the right reason *and* holds that belief justifiably/rationally (full credit).
      *   *Conscientious Misjudgment:* Motivated by a *sincere but incorrect* belief about what is right.

  Your cases (1) and (2) are clear instances of **EUMA**. The defect lies in the gap between holding the correct motivating proposition and having a rational foundation for it. The breakage is internal to the agent's cognitive relationship with the very reason motivating their otherwise correct action.
