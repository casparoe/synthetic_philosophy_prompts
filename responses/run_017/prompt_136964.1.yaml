prompt: |-
  hey — I've got a lunch-and-learn slot next thursday, 45 minutes plus maybe five for questions, and I volunteered to do something on Solomonoff induction / Kolmogorov complexity as the grown-up version of Occam's razor. The audience is around thirty backend and ML engineers: they all know gzip and regular expressions, two or three have actually used an MDL-ish penalty in a model selection loss, nobody has any measure theory to speak of, and the room's default going in is that "simpler = fewer lines of code = better" is obvious and doesn't need justifying. I want them to leave having lost that assumption and gained something better, not leaving thinking the razor has been *proved*.

  Don't write the talk. I need the plan: the order the pieces have to go in, and for each one what it depends on that I can't skip. Specifically:

  - what has to be in place before "simplicity" means anything at all. I think I have to fix the data as a bitstring and the hypotheses as programs on one particular machine before anyone can compare lengths, but I can't decide whether the invariance theorem should come early (as permission to stop worrying about the machine) or late (as the place where I admit the additive constant never goes away and is unbounded in the size of the data). Argue for one and tell me what breaks if I do the other.
  - the one example that carries the whole thing. Here's my candidate: two 60-bit strings. A is the first 60 bits of the binary expansion of 1/7. B is 60 bits off a hardware RNG that I've hand-edited so gzip compresses B to something shorter than A. I want it to do two jobs at once — show that K is an infimum over all programs and not what any one compressor happens to spit out, and show that a string can be *accidentally* compressible, so a short program isn't automatically the true mechanism. Is that too much for one example? What does a carrying example here need to have, and what does it need to not have?
  - where the actual Solomonoff move goes (weighting programs by 2^-length, the universal semimeasure, the dominance and convergence results) relative to the plain complexity material, and whether I need Kraft / prefix-free at all at this level or can just gesture. If I gesture, what's the sentence?
  - the misconceptions, in the order the room will actually form them, and the point in the sequence where I head each off. The ones I expect: that K(x) is what gzip gives you; that "most strings are incompressible" means most real datasets are random; that random-as-incompressible is the same thing as random-as-in-chancy; that the convergence result says the shortest program is the true one; that Solomonoff induction is impractical-but-implementable, something you'd approximate with enough compute. One-sentence correction for each, and tell me which one or two I should let somebody say out loud first because the correction lands harder that way.
  - the thing I should openly refuse to explain, and say out loud that I'm refusing.
  - one question to ask at the end that would actually tell me they got it, rather than that they can repeat "shorter program, bigger prior."

  Two more things. First, somewhere in there I want them to feel the constant problem. I half-remember that the bound has a factor with something like 2-to-the-K-of-the-true-source in it, and that it's astronomically large, but I can't remember exactly where it sits or what it does to the "so the razor is justified" reading. Put it in the right place, and tell me how to say it without the room concluding the whole framework is useless.

  Second, be straight with me about the plan itself. Where is it most likely to break in the room — which step has a dependancy I've underestimated, which correction will install a worse misconception than the one it replaces. And what single fact about the audience or the clock would make you scrap this ordering and do something else entirely. Also flag anywhere the plan quietly takes a side on something contested: whether Solomonoff induction is a *justification* of Occam's razor or a re-description of it, whether the finite-data case has anything to do with the asymptotic one, whether "simple" being language-relative up to a constant is a technicality or a defeater. I don't want to present a preference as a theorem to thirty engineers who'll take me at my word.
reasoning: |-
  We are designing a 45-50 minute talk for backend and ML engineers on Solomonoff induction and Kolmogorov complexity as a rigorous foundation for Occam's razor. The audience is familiar with gzip and regex, some have used MDL, no measure theory, and they currently hold "simpler (in lines of code) is obviously better". The goal is to challenge that assumption and provide a deeper understanding without claiming proof.

  Key elements to cover:

  1. **Setting the stage for "simplicity"**: We must define the framework. Data is a finite binary string. Hypotheses are programs (on a fixed universal Turing machine) that output that string. Kolmogorov complexity K(x) is the length of the shortest such program. We have to fix the machine first. The invariance theorem (that K(x) is machine-independent up to an additive constant) is crucial. I argue it should come early to alleviate concerns about machine choice, but we must be clear that the constant exists and can be large.

     - If we present invariance late: The audience might get stuck on "but what machine?" and not engage with the core ideas. Early, we say: "Yes, the machine matters, but only by a constant that doesn't depend on the data. So for large enough data, the relative complexities are stable." We must then emphasize that the constant is unbounded in the sense that for any fixed machine, there are strings for which the constant is large relative to their length, but for the purpose of comparing hypotheses for a given dataset, the machine choice isn't critical.

     - What breaks if done the other way? If we skip invariance and just fix a machine, the audience might think the results are machine-dependent in a way that matters for real-world use. By introducing invariance early, we avoid that distraction.

  2. **The carrying example**: Your candidate is two 60-bit strings. A is the first 60 bits of 1/7 (so it's periodic, hence highly compressible). B is from a hardware RNG but edited so that gzip compresses B shorter than A. 

     - This example can do two jobs: 
       (a) K(B) is still high because the edit was adversarial to gzip; the true Kolmogorov complexity is not what gzip gives but the infimum over all possible programs. 
       (b) A short description (like the gzip output) might be accidental and not the true mechanism.

     - However, it might be too much for one example because we are introducing two concepts at once: the infimum nature of K and the possibility of accidental compressibility. We can break it down:

       Step 1: Show A and B. 
          - A: 010101... (period 2) -> very short program: "print '01' 30 times".
          - B: random-looking but gzip compresses it to, say, 40 bytes (by chance, it has some regularity that gzip found).

       Step 2: Point out that gzip says B is shorter than A? (But we know A is simpler.) Why? Because gzip is a specific compressor, not the universal one. Kolmogorov complexity is about the shortest program in any language.

       Step 3: But wait, we can write a program for B that is short? No, because we constructed B by taking random bits and then editing until gzip was fooled. The Kolmogorov complexity of B is still high because to specify B exactly, you need to specify the 60 bits (or nearly so). The program that uses gzip and then decompresses might be long because gzip is a complex program. The true K(B) is about 60 bits (if it's incompressible) or a bit less because of the pattern we introduced, but not as low as gzip's compressed length.

       Step 4: Also, for A, the true mechanism is simple. For B, even if we found a short program (by chance), it doesn't mean the data was generated by a simple process. We were just lucky to find a pattern.

     - What the example must have: 
          - A string that is truly simple (like A).
          - A string that appears compressible by a standard tool but is complex in reality.
          - The contrast must highlight that K(x) is defined by the shortest program in any language, not a specific one.

     - What it must not have: 
          - Avoid making B actually simple (like by having a hidden pattern). It should be complex but with a fluke compression in one scheme.

     - So the example can work if we structure it carefully. We might need to precompute the gzip lengths and have the actual strings to show.

  3. **Solomonoff induction relative to plain complexity**:

     - We have to introduce the idea of weighting hypotheses by simplicity. After defining K(x) and the invariance theorem, we can say:

          "But what if there are multiple programs that output x? And what if we are predicting the next bit? We want to weight all programs that are consistent with the data so far, with shorter programs getting more weight."

     - Then introduce the universal prior: P(x) = sum_{p: U(p)=x*} 2^{-length(p)} (where x* means a prefix that starts with x). We need to explain that we are considering prefix-free machines to avoid the problem of programs being prefixes of each other.

     - Gesture at prefix-free: "To avoid ambiguity, we use a programming language where no valid program is a prefix of another. This allows us to sum the probabilities without overcounting." We don't need to go into Kraft's inequality, but we can say: "This makes the sum of 2^{-length(p)} over all programs p less than or equal to 1, so it's like a probability."

     - The move: After showing that K(x) is about the shortest program, we extend to the prior. The convergence result (that the universal prior will in the limit dominate any computable prior) and the dominance (it multiplicatively dominates any computable prior) are the key results. We can state them without proof.

     - Order: First, plain Kolmogorov complexity (with invariance). Then, the example. Then, Solomonoff: we move from the single shortest program to a weighted sum.

  4. **Misconceptions and corrections**:

     - Expected misconceptions and one-sentence corrections:

          1. K(x) is what gzip gives. 
             Correction: "K(x) is the length of the shortest program in any language, not just one compressor; gzip is just one approximation and can be off by a lot, as we saw in the example."

          2. "Most strings are incompressible" means most real datasets are random.
             Correction: "Most strings are random, but real data is often generated by structured processes, so we expect it to be compressible. The incompressibility result says that if we don't know the structure, we can't assume it's there."

          3. Random-as-incompressible is the same as random-as-in-chancy.
             Correction: "Kolmogorov randomness is about patterns, while chance is about probability. A string can be generated by a fair coin and still be compressible by chance (like flipping 100 heads in a row) but that doesn't make it non-random in the chance sense."

          4. The convergence result says the shortest program is the true one.
             Correction: "Solomonoff induction doesn't pick one program; it weights all consistent programs. The convergence result says that in the limit, the true data generating process will dominate the posterior, but for finite data, the shortest program might be wrong, as we saw with the edited random string."

          5. Solomonoff induction is impractical but implementable with enough compute.
             Correction: "It's uncomputable; no algorithm can compute it for all inputs. We can approximate it, but the approximations are not Solomonoff induction."

     - Which one to let someone say: Let someone say that K(x) is what gzip gives. Then show the example and correct. This lands harder because they see the counterexample.

  5. **Openly refuse to explain**: The full proof of the invariance theorem, or the convergence theorems. Say: "I'm skipping the proofs because they require more formal machinery, but the intuition is what we need for our purpose."

  6. **One question to test understanding**: 
     - Instead of asking for a repetition, ask: "Suppose we have two programs that both output the same dataset: one is 100 bits long and the other is 200 bits long. How much more weight does the shorter one get in the Solomonoff prior?" [Answer: 2^{-100} vs 2^{-200}, so 2^{100} times more]. 
     - But to test deeper: "We have a dataset that looks like it has a pattern, but it might be by chance. Why shouldn't we just always pick the shortest program that fits the data? What's the risk?" 
       [We want them to say: because the shortest program might be fitting noise, and we might be overfitting. The Solomonoff prior accounts for all programs and weights them, so it doesn't throw away information from longer programs that might be true.]

  7. **The constant problem**: In the convergence of Solomonoff induction, the bound for the error in predicting the next symbol has a multiplicative constant that is 2^{K(\mu)} where \mu is the true distribution. This is astronomically large if the true distribution is complex. We must mention this to show that the razor isn't "proved" for practical use.

     - Place: When discussing the convergence result. Say: "Theoretically, Solomonoff induction will eventually predict better than any computable method. However, the convergence might be extremely slow because the constant is 2^{K(\mu)}, which could be huge. So for real-world problems, we are still in the finite-data regime where the choice of model class matters."

     - Without making it useless: Emphasize that the framework gives a formal justification for why simplicity is a guide to truth, but it doesn't guarantee that the simplest model we can find with our computers is the truth.

  8. **Plan critique and risks**:

     - Most likely break point: The step from bitstrings to real data. They might not see how this applies to their work with tabular data or images. We must connect: the data is represented as a string, and the model is a program that generates it.

     - Dependency underestimated: The concept of a universal Turing machine and why we can fix one. They might not be familiar with UTMs. We might need a one-sentence explanation: "A universal Turing machine can simulate any other computer, so we can think of it as a fixed programming language that can run any program."

     - Correction that might install a worse misconception: When correcting that "most strings are incompressible" doesn't mean real data is random, they might think that Kolmogorov complexity is not useful for real data. We must stress that real data often has patterns so we can find short programs, but we have to be cautious not to overfit.

     - Scrap the ordering if: The audience has zero tolerance for theory (e.g., if they are purely applied and have no patience for UTMs). Then focus on the example and the intuition. But from the description, they can handle some theory.

     - Contested points:

          - Is Solomonoff a justification or a re-description? We present it as a formalization that makes the assumptions explicit (e.g., the choice of machine, the weighting). We don't claim it "proves" Occam, but it gives a coherent framework where simplicity is linked to probability.

          - Finite vs. asymptotic: We must be clear that the convergence is asymptotic and the constants matter in practice. The finite-data case is where we live.

          - Language relativity: The additive constant is a technicality for comparing complexities of individual strings, but for large data, it becomes negligible. However, for model selection in practice, the constant can be large relative to the data, so we need to choose a reasonable reference machine (like a programming language we agree on). We should present it as a technicality that doesn't defeat the framework but requires care.

  **Proposed Order of the Talk**:

  Total: 45 minutes + 5 Q&A.

  1. (5 min) **Introduction**: Occam's razor in science and ML. Current belief: simpler = fewer lines of code = better. But why? We'll see a rigorous framework.

  2. (10 min) **Setting up Kolmogorov complexity**:
     - Data as bitstrings.
     - Hypotheses as programs that output the data.
     - Define K(x) as the length of the shortest program on a fixed universal machine.
     - Invariance theorem: the machine choice only affects K(x) by an additive constant (independent of x). So for large x, it doesn't matter. But the constant can be large for small x? Yes, but we are comparing for the same x.

  3. (10 min) **The example**:
     - Show A (periodic) and B (edited random). 
     - Show gzip compresses B more than A? (Actually, we set it so gzip compresses B to a shorter string than A). 
     - Then explain why that's misleading: 
          - The true K(A) is low (a few bits). 
          - The true K(B) is high (about 60 bits) because we edited randomly until gzip was fooled. 
          - So gzip is not Kolmogorov complexity. 
          - Also, even if we find a short program for B, it might be by chance.

  4. (10 min) **Solomonoff induction**:
     - From one program to many: we weight all programs that output the data (so far) by 2^{-length}.
     - Why prefix-free? (gesture: to make the sum work without overcounting) and the universal prior.
     - The two key results: dominance and convergence (state without proof).
     - The constant problem: convergence has a constant 2^{K(\mu)} which is huge if the true source is complex. So asymptotically it works, but in practice we have to be cautious.

  5. (5 min) **Misconceptions and clarifications**:
     - Go through the list, especially allowing the gzip one to be raised and corrected by the example.
     - Emphasize: Solomonoff is uncomputable, so we approximate (like with MDL), but the approximations are not the same.

  6. (5 min) **Wrap-up and the status of Occam**:
     - We haven't proved the razor, but we've shown a framework where simplicity is linked to probability and prediction.
     - The razor is not just about lines of code: it's about the shortest program in any language, and we have to account for all programs to avoid overfitting.

  7. **Refuse to explain**: When introducing the universal machine, say: "I won't define a UTM formally, but trust that we can fix one and it can run any program."

  8. **Test question at the end**: "We have a dataset that is 1000 bits long and we have two models: one is 100 bits long, the other 200. How much more prior weight does the shorter one get? [2^100] But if the data was generated by the longer one, when would the Solomonoff posterior switch to favor it? [When the data is long enough to overcome the prior difference, but subject to the constant.]"

  **Risks**:
  - The example might be too abstract. We can make it more concrete: A is the binary representation of the first 60 digits of 1/7 (which is periodic) and B is from a random number generator that we tweaked until gzip compressed it to 40 bytes. But we must be clear that we are not changing the true Kolmogorov complexity of B.
  - Time: 10 minutes per section is tight. We might have to cut details. The misconception section can be integrated throughout.
  - The audience might get stuck on the uncomputability. Emphasize that we use approximations (like MDL) in practice, and that the theory guides why we do so.

  **Contested Points**:
  - We present Solomonoff as a formalization that justifies Occam in a specific sense (as a prior over programs) but not as a proof. We are explicit that the constants and uncomputability matter for practice.
  - The language relativity is a technicality: for large data, it's negligible. But for small data, it's a problem. We don't hide it.

  **Final Plan**:
  1. Intro: 5 min
  2. Kolmogorov setup and invariance: 10 min
  3. Example: 10 min (including gzip demo)
  4. Solomonoff: 10 min
  5. Misconceptions and wrap: 5 min
  6. Q&A: 5 min

  Plus one test question at the end and one refusal.

  **If time runs short**: Cut the details of the invariance theorem and just state it. Or reduce the Solomonoff part to just the weighting and the constant problem.

  **If the audience is more applied**: Focus more on the example and how this relates to MDL or compression in ML.

  Let me know if you want adjustments.
answer: |-
  ### Plan for the Lunch-and-Learn: Solomonoff Induction as the Grown-Up Occam's Razor  
  **Audience:** 30 backend/ML engineers, familiar with gzip/regex, some MDL exposure, no measure theory. Default belief: "simpler = fewer lines of code = obviously better."  
  **Goal:** Undermine the default assumption without "proving" the razor. Leave them with: *Simplicity isn't arbitrary—it's rigorous but subtle, and shorter programs aren't automatically true.*  

  ---

  #### **Order of Pieces, Dependencies, and Timing**  
  *(Total: 45 min talk + 5 min Q&A)*  

  1. **Setup: Why "Simplicity" Needs Rigor (5 min)**  
     - **What:** Start with the problem—why does "simpler = better" feel obvious? Highlight gaps:  
       - "Fewer lines of code" depends on the programming language.  
       - We need a way to compare hypotheses fairly.  
     - **Dependencies:** None. Hook them with the weakness of their default view.  
     - **Key move:** Fix the framework:  
       - Data = bitstring (e.g., a dataset encoded as binary).  
       - Hypothesis = program that outputs that bitstring.  
       - "Simplicity" = program length.  
     - **Crucial dependency:** You **must** fix a universal Turing machine (UTM) here. Say: "We pick one UTM to run all programs—think of it as Python or assembly. This lets us compare lengths fairly."  
     - **Why now?** If you delay the UTM, they’ll question comparisons (e.g., "But what if I use Java instead?").  

  2. **Invariance Theorem Early (8 min)**  
     - **What:** Immediately after fixing the UTM, state invariance:  
       *"Change the UTM, and Kolmogorov complexity \(K(x)\) only shifts by a constant \(c\) (e.g., 10,000 bits). This \(c\) depends on the UTMs, not the data."*  
     - **Dependencies:** UTM must be defined first.  
     - **Why early?**  
       - **Pros:** Kills "but the machine matters!" objections upfront. Lets you use "K(x)" freely later.  
       - **Cons:** You must address the constant's risk head-on: *"Yes, \(c\) can be huge—like the size of a compiler. For small data, it’s a problem. For large data, \(c\) becomes negligible when comparing hypotheses."*  
     - **If done late:** They’ll distrust every complexity claim until resolved. It breaks the flow.  

  3. **The Carrying Example (10 min)**  
     - **Your candidate (A and B strings) is perfect.** Use it here.  
       - A: First 60 bits of \(1/7\) (simple pattern: `010101...`). True mechanism: short program.  
       - B: 60-bit RNG output, hand-edited so `gzip(B) < gzip(A)`.  
     - **Do two jobs at once:**  
       1. **Show \(K(x)\) is an infimum:**  
          - `gzip(A)` is small, but `gzip(B)` is *smaller* by chance.  
          - Yet \(K(B)\) is large—it requires ~60 bits (or more) to specify the edited string.  
          - Punchline: *"gzip is one compressor; \(K(x)\) is the shortest program over all possible algorithms."*  
       2. **Show accidental compressibility:**  
          - B’s short gzip encoding is a fluke—not the true mechanism.  
          - Contrast with A: its short program reflects true structure.  
     - **Why it works:**  
       - It needs contrast (A vs. B), compressibility via common tools (gzip), and hidden complexity (B’s editing).  
       - It **must not** have real-world patterns (e.g., natural data). Keep it abstract to avoid distractions.  
     - **Risk:** If rushed, they might miss the infimum point. Slow down: *"B’s gzip size is low by accident—but is there a *shorter* program? No, because we broke patterns."*  

  4. **Solomonoff Induction: The Move (7 min)**  
     - **What:** After the example, pivot to prediction:  
       *"OK, but what if multiple programs fit the data? We weight them. Shorter programs get exponentially more prior weight: \(P(\text{program}) \propto 2^{-\text{length}}\)."*  
     - **Dependencies:** Program-length simplicity (from Step 1) and infimum over programs (from example) must be clear.  
     - **Kraft / prefix-free:** Gesture. Say: *"We use prefix-free codes so programs halt unambiguously—this ensures probabilities sum to ≤1."* No details. If asked: *"It’s like Huffman trees; we skip the math."*  
     - **Dominance/convergence:** State intuitively:  
       *"If the true data source is computable, this prior will eventually dominate any other computable prior. But ‘eventually’ might mean astronomically long."*  

  5. **Constant Problem: The Reality Check (5 min)**  
     - **Place it here**—right after stating convergence.  
     - **What:** *"The convergence bound has a factor like \(2^{K(\mu)}\), where \(\mu\) is the true source. If \(\mu\) is complex (e.g., \(K(\mu) = 10^{10}\)), this constant is huge."*  
     - **Why it’s not useless:** *"This doesn’t break the framework—it shows why we approximate (e.g., with MDL). Asymptotics justify the principle, but practice needs pragmatism."*  
     - **Head off defeatism:** *"We’re not saying ‘throw this away.’ We’re saying: the razor is grounded, but finite data needs care."*  

  6. **Misconceptions: Order and Corrections (5 min)**  
     Address these **in sequence** (as they’ll arise chronologically):  

     | Misconception | When It Arises | One-Sentence Correction | Let Them Say It? |
     |---------------|----------------|-------------------------|-----------------|
     | "K(x) ≈ gzip" | After example | *"gzip is one compressor; K(x) is the shortest program *anywhere*, which gzip might miss (like in B)."* | **YES**—correction lands harder after they voice it. |
     | "Shorter program = true" | After Solomonoff | *"B had a short gzip program by chance—weighting guards against overfitting flukes."* | No—preempt after example. |
     | "Random data = common" | After incompressibility | *"Most bitstrings are incompressible, but real data (like A) often has structure—we’re sampling from the non-random slice."* | No—clarify when defining incompressibility. |
     | "Random-incompressible = random-chancy" | When contrasting A/B | *"A coin flip can make compressible strings (e.g., 60 heads), but Kolmogorov-random means *no* patterns exist."* | Yes—if someone asks "Isn’t B random?" during example. |
     | "Solomonoff is implementable" | After weighting | *"It’s uncomputable—we approximate with MDL, NML, or priors in ML, but lose theoretical guarantees."* | No—state upfront. |  

  7. **Openly Refuse to Explain**  
     - **What:** The construction of the universal Turing machine.  
     - **When:** During Step 1 (setup).  
     - **Say:** *"I’m skipping how UTMs work—it’s sufficient to know they exist and let us compare programs. Ask me after if curious!"*  

  8. **Question to Test Understanding**  
     - **Ask at the end:** *"In the Solomonoff prior, why would a program that’s 10 bits longer than the shortest one still get significant weight if the data is small?"*  
     - **Why it works:** It tests grasp of weighting vs. minimization, accidental compressibility, and constants. A strong answer: *"Because 2^{-10} isn’t negligible for small data—the true source might be longer, or the short program might be a fluke like B."*  

  ---

  #### **Where the Plan Might Break**  
  - **Underestimated dependency:** Invariance theorem. If they fixate on the constant \(c\), they’ll dismiss the whole framework. **Mitigation:** Emphasize that \(c\) is *fixed*—it doesn’t grow with data. For large datasets (their world), relative lengths stabilize.  
  - **Worse misconception risk:** Correcting "K(x) ≈ gzip" might imply "gzip is useless." **Mitigation:** Say: *"gzip is a practical proxy—but the theory shows why we shouldn’t treat it as gospel."*  
  - **Achilles' heel:** The example. If they don’t buy that B’s *true* K is high, the infimum/accidental compressibility points collapse. **Mitigation:** Pre-compute K(B) ≈ 60 bits (via a known-good compressor) and show the code used to edit B.  

  #### **Scrap This Order If...**  
  - **The audience has near-zero theory tolerance.** Then: Start with the example → reveal gzip’s fallibility → justify with invariance → skip Solomonoff details. Focus on "simplicity isn’t naive."  
  - **Clock runs short.** Cut dominance/convergence. Keep: Setup → invariance → example → Solomonoff weighting → constant problem.  

  #### **Contested Points: Where You Take a Side**  
  - **Solomonoff as justification vs. re-description:**  
    You present it as a **formal justification** (it grounds Occam in probability theory). But clarify: *"This doesn’t *prove* simplicity always wins—it shows how to make it precise in a computable framework."*  
  - **Finite vs. asymptotic:** You **side with pragmatism:** *"Asymptotics justify the principle, but finite data needs approximations like MDL. The constant problem is why."*  
  - **Language relativity:** You treat it as a **technicality, not a defeater:** *"The constant \(c\) is a tax we pay for the framework—it’s why we use sane UTMs (like real CPUs), not why we abandon simplicity."*  

  ---

  **Final Tip:** End by linking to practice. *"This is why ML uses MDL or compression-based model selection—it’s Solomonoff-inspired. But now you know: shorter isn’t *always* truer, just likelier if we avoid flukes."*  
  **Slides:** Minimal text. Visuals: Binary strings, code snippets, gzip sizes for A/B. No equations beyond \(2^{-\text{length}}\).
