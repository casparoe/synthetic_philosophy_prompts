prompt: |-
  I'm a journalist — I do a weekly column on science and ideas, mostly the human and social stuff, and every so often I manage to smuggle in some actual philosphy. Right now I'm working on a piece about who gets counted as "the people" in a democracy, and I've been going round in circles on it, so I'd rather think out loud with you than be lectured at. Please don't send me a reading list or footnotes: I can't use citations in a newspaper piece anyway, and what I need is the argument, not the literature.

  Here's the pattern that's bugging me. In most democracies the national vote is tied to citizenship, not residence, and it plays out in ways that look, on the face of it, like they can't all come from the same idea:

  - People who have lived abroad for decades — sometimes born there, citizens purely by descent, never paid tax in the home country, never really lived under its day-to-day laws — keep the vote for life and usually pass it on to their children. Several countries even run dedicated overseas constituencies with reserved seats. (I know a few have time limits — Australia, I think, cuts you off after a while — but the general shape is what I mean.)
  - Meanwhile long-term legal residents who've worked, paid taxes, and raised kids in the country for twenty or thirty years can't vote in national elections, and in a lot of places can still be deported.
  - The bit that really gets me: in the US, as I understand it, non-citizen male residents are required to register for the draft. So the state can conscript you while refusing you any say in the decision to conscript you.
  - But then flip to the local level, and residence suddenly seems to be enough: plenty of places let non-citizen residents vote in municipal or school-board elections, and within the EU a citizen of one member state living in another can vote in local elections where they actually live. So residency qualifies you down at the bottom and disqualifies you at the top.

  So: what theory of legitimate inclusion does that package presuppose? I mean both "what has to be true for this to make sense" and "what does it quietly rule out."

  I've been sorting the arguments I hear into three buckets and I suspect my buckets are wrong, so tell me if they are:
  - Authorship claims: the law is issued in my name, so I have to be able to see myself as one of its authors; being pushed around by a collective I don't belong to is a form of domination even if the pushing is gentle.
  - Exposure claims: I carry the costs of whatever gets decided, so I need a say in it.
  - Stake or association claims: my life plan is bound up with this place over time, so I'm a member in a way a visitor or a passing investor isn't.

  Which of those does the practice actually need, and which does it only sit comfortably next to? Does it maybe need a fourth thing I haven't got a bucket for — something about stability, like: the demos has to be a group whose membership you can't change by moving house, and which persists across generations so it can bind itself to long-term commitments? Is the nationality rule best explained by that kind of consideration, by the authorship idea, or by something less flattering (emigrants who send money home and lobby for the folks back home are useful to governments)? And can any single story hold the whole package together — the overseas voters, the voteless taxpayers, the draft-eligible non-voters, and the local elections where residence is suddenly fine — or is this just a settlement between theories that don't really fit?

  Then the counterfactual I want: if we dropped the implicit theory and adopted something like a pure "everyone who's genuinely affected gets a say" rule, what would elections actually have to look like? Walk me through it concretely — do we end up enfranchising foreigners downstream of our emissions or our central bank, giving children or future people some kind of proxy, and disenfranchising emigrants? Is that a reductio of the affected-interests principle, or is it where the logic honestly goes and we should just get used to it?

  And be clear on where the practice is underdetermined: which features would several rival theories all license, so that they tell us nothing about what we really believe, and which are load-bearing. I want to know which parts of this are philosophy and which are just historical accident.
reasoning: |-
  Okay, the user is a journalist working on a column about democratic inclusion, specifically questioning why citizenship rather than residence determines voting rights. They've observed inconsistencies: long-term non-citizen residents can't vote nationally but can locally, citizens abroad can still vote, and non-citizens in the US can be drafted without voting rights. They want to understand the underlying theory that justifies these practices and explore what a pure "affected interests" approach would look like.

  First, I need to unpack their three buckets: authorship, exposure, and stake. The current system seems to prioritize authorship—tying voting to citizenship as a form of collective self-rule. But this clashes with exposure, where long-term residents are affected by laws without representation. The draft example is a stark violation of exposure. Local elections using residency might be a pragmatic compromise, acknowledging immediate impact.

  The user suspects historical accident plays a role. They're right. Overseas voting often stems from states wanting to maintain ties with diasporas for remittances or lobbying. Non-citizen exclusion might be rooted in nationalism or sovereignty concerns. The draft requirement for non-citizens is a historical artifact, possibly from wartime needs.

  For the affected-interests principle, applying it radically would mean including anyone impacted by decisions. That could mean enfranchising global populations affected by climate policies or giving future generations proxies. But this becomes impractical. The user wants to know if this is a reductio or a logical conclusion. It's both: the principle highlights flaws in current systems but also shows why boundaries are necessary, even if arbitrary.

  The key is that current practices aren't based on a coherent theory but a mix of authorship, historical accidents, and pragmatism. The user needs to articulate this inconsistency without getting bogged down in citations. Emphasize that local elections show residency can work, challenging the idea that only citizens should vote. The draft example undermines the authorship argument, revealing a power imbalance.

  They also want to know which parts are load-bearing. Citizenship as a boundary is load-bearing for authorship, but the draft and local elections expose its weaknesses. The affected-interests approach, while logical, requires manageable boundaries, leading to compromises like stakeholder citizenship. This might involve residency-based national voting after a period, aligning more with exposure and stake.

  In conclusion, the user should present the current system as a flawed patchwork. Highlighting the EU example and local voting shows alternatives exist. The draft is an indefensible outlier. The affected-interests thought experiment reveals the trade-offs but also practical limits. The takeaway: democratic inclusion needs boundaries, but current ones are inconsistent; residency and contribution might be fairer than birthright citizenship.
answer: |-
  This tangle you're wrestling with reveals a deep, unresolved tension at democracy's core. The package you describe doesn’t presuppose a single coherent theory of legitimate inclusion—it embodies a messy, historically contingent *compromise* that prioritizes **sovereign authorship** while awkwardly accommodating **exposure** and **stake** at the margins. Let's dissect it:

  ### Your Buckets vs. The Practice
  1.  **Authorship (Dominant Logic):** This is the load-bearing wall. The state claims legitimacy as the expression of a pre-political "People" (the *demos*), historically defined by nation/citizenship. Voting is membership in the authoring collective, not primarily about individual impact. This explains:
      *   **Overseas Citizens Voting:** They remain symbolic members of the sovereign people, even without exposure. Their vote maintains the fiction of a perpetual, territorially transcendent nation-state "club."
      *   **Non-Citizen Exclusion (National Level):** No matter how deeply affected, they aren't *authors* of the sovereign will. Their presence is conditional.
      *   **The Draft Paradox:** Brutally exposes the flaw. The state asserts its sovereign power *over* the resident (exposure/domination) while denying them authorship. It prioritizes state power ("we can compel you for defense") over democratic consistency.

  2.  **Exposure (Partial/Contingent Accommodation):** This is acknowledged pragmatically, not as a fundamental right, but where it's politically convenient or administratively manageable:
      *   **Local Elections:** Here, "authorship" is diluted. Municipal decisions (roads, schools, zoning) directly impact daily life regardless of national citizenship. Residency becomes a practical proxy for exposure. The EU model extends this logic regionally. It’s a concession to reality *within* the sovereign frame.
      *   **Taxation Without Representation:** The glaring hypocrisy tolerated precisely *because* authorship trumps exposure at the national level. The state benefits from their contributions but excludes them from the authoring body.

  3.  **Stake/Association (Secondary Consideration):** Often invoked rhetorically, but easily overridden by the citizenship boundary. Long-term residents demonstrably have deep stakes, yet are excluded. Overseas citizens may have minimal concrete stake, yet are included. Stake matters only *after* you clear the citizenship hurdle.

  ### The Fourth Bucket: Sovereignty & Intergenerational Binding
  You nailed it. This is crucial:
  *   **Stability & Binding:** The national *demos* is conceived as a stable, intergenerational entity capable of making long-term commitments (debt, treaties, constitutions). Citizenship-as-birthright (including descent) creates this continuity. Residency is fluid; citizenship is (ideally) permanent. Letting residency determine the national franchise feels, to proponents, like allowing transient tenants to vote on demolishing the foundation of a centuries-old clubhouse.
  *   **Usefulness:** Absolutely plays a role. Overseas voters often lobby/fund/support the "home" country. Disenfranchising them cuts off a resource. Conversely, excluding long-term residents avoids diluting national identity or "culture" (often a coded argument) and maintains the state's power over immigration.

  ### Can One Story Hold It Together? Only By Force...
  The package only "makes sense" if you **elevate sovereign authorship (defined by citizenship) to absolute primacy** and treat everything else as a pragmatic exception:
  1.  **Core Rule:** Only the sovereign People (citizens) author the laws that bind them (and others within their territory).
  2.  **Exception 1 (Overseas Citizens):** They remain part of the sovereign People for perpetuity (binding/stability/usefulness), even if unaffected by most laws.
  3.  **Exception 2 (Local Elections):** Residency suffices for decisions deemed *local/administrative*, not fundamental to *sovereign* authorship. Exposure matters here.
  4.  **Contradiction Tolerated (Draft/Residents):** The state's sovereign power to compel obedience (draft) trumps the democratic principle of authorship for those compelled. Might makes right within the sovereign frame.

  **What it Quietly Rules Out:** The idea that *impact* or *stake* alone creates a fundamental *right* to participate in collective self-rule. It rules out the possibility of a *demos* defined primarily by shared territory and subjection to power, rather than inherited membership.

  ### The Affected-Interests Counterfactual: Pandora's Box (or Honest Democracy?)
  A pure "all affected interests" principle *demolishes* borders. Walking through it:
  *   **Who Gets In?**
      *   **Residents:** Obviously included, regardless of citizenship status. Long-term residents vote nationally.
      *   **Emigrants:** Significantly affected by foreign policy, extradition, citizenship rules for children, inheritance taxes? Likely *keep* voting rights indefinitely.
      *   **Downstream Foreigners:** If your central bank's rates crash my economy, your emissions flood my country, your trade policy starves my farmers? Logically, I deserve a say. This implies transnational voting mechanisms or weighted representation in international bodies – a radical shift.
      *   **Future Generations:** Radically affected by climate, debt, infrastructure. Requires proxies (e.g., guardians for minors/future, scientists on climate panels with veto power?).
      *   **Children:** Directly affected. Age-based exclusion becomes harder to justify than competence-based assessments (controversial!).
  *   **Who Might Get Out?** Truly transient populations with minimal stake (short-term tourists, business travelers) might logically be excluded locally too.
  *   **The Mechanics Nightmare:**
      *   How do you measure "affectedness"? Degree? Proximity? Certainty? This is inherently fuzzy and political.
      *   Voting becomes non-binary: *Weighted* votes based on impact? (e.g., coastal residents get heavier weighting on climate policy than inlanders?).
      *   Constant flux: Voter rolls would churn constantly with migration, policy changes, even weather events.
      *   **Is it a Reductio?** Only if you insist democracy must be contained within nation-states. It exposes the fundamental tension: democratic legitimacy clashes with the arbitrary boundaries of sovereignty. It *is* where the logic honestly goes. We *should* get used to grappling with it, even if full implementation is impractical. It reveals the exclusionary violence inherent in the current model.

  ### Underdetermined vs. Load-Bearing
  *   **Underdetermined (Accident/Pragmatism):**
      *   **Overseas Voting Perpetuity:** While consistent with authorship/stability, the *lifelong, generational* aspect is driven by usefulness, diaspora politics, and historical accident (easier to keep people on than re-enfranchise). Australia's limit shows it's malleable.
      *   **The *Extent* of Local Voting:** *Which* local elections allow non-citizens? School boards but not mayors? This is pure political contingency, not deep theory.
      *   **Specific Draft Rules:** That *male* non-citizens register is historical sexism, not a philosophical necessity to the contradiction.
  *   **Load-Bearing (Philosophy):**
      *   **Citizenship as the *National* Franchise Gate:** Essential for the sovereign authorship narrative. Changing this fundamentally alters the concept of the state.
      *   **Distinction Between National/Local Franchise:** Embodies the idea that sovereignty resides only at the national level; local is merely administration. Challenging this (e.g., strong municipalism) challenges the state's primacy.
      *   **The Draft Exclusion Paradox:** Not an accident, but the logical (if ugly) outcome of prioritizing sovereign power over democratic inclusion for non-members. It reveals the core hierarchy.

  ### The Takeaway for Your Column
  The current system isn't philosophy; it's **sovereignty's compromise.** It prioritizes the myth of a bounded, self-authoring nation-state people above all else. Exposure and stake are only recognized when convenient and contained (locally) or when useful (diaspora). The draft exposes the raw power beneath the democratic veneer.

  The "affected interests" principle isn't a reductio; it's the repressed conscience of democracy, highlighting the exclusions required to maintain the nation-state form. The honest question isn't "what theory justifies the current mess?" but "what *fictions* of belonging and sovereignty are we willing to tolerate to make collective decision-making possible, and at what cost to those excluded?" The local elections and the EU show residency *can* work. The draft shows the current model's profound injustice. The diaspora vote shows its instrumentalism. There’s your tension.
