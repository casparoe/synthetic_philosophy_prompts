  Looking at her past verdicts: Race, money, teenager, citizenship are constructed. Her reasons point to human decisions changing categories over time or across cultures. For instance, race depends on which physical traits society deems significant, and money relies on collective agreement. 

  On the other hand, being six feet tall, species like crows, diabetes, and left-handedness aren't constructed. Here, she emphasizes that once units are defined (like feet), measurement is objective. Biological categories exist independently of humans—crows would be crows without us, and diabetes is a bodily mechanism discovered, not invented.

  So what's the pattern? It seems Mara distinguishes between categories that depend on human practices for their existence (socially constructed) and those that don't (discovered or objective). Key factors include: whether the category boundaries are defined by human decisions, if the kind persists without human practices, and if the label itself affects the thing.

  Now for Pluto's planet status: Astronomers voted to change the definition, reclassifying Pluto. The physical characteristics of Pluto didn't change, just how we categorize it. This fits the pattern of human decisions shaping the category, so likely she'll say "planet" is socially constructed.

  For "chronically absent": The school district created a label based on an arbitrary threshold (10% absence). Once applied, it influences how teachers and students behave, potentially reinforcing absenteeism. The label changes social dynamics, making it constructed.

  To test between potential rules, consider a case like "refugee status." If the legal definition changes who gets aid, leading to different outcomes, it highlights how human decisions create the category's impact. This would align with the "label-affects-reality" aspect, distinguishing it from purely objective categories.
answer: |-
  Based on Mara's track record and reasoning, here's a careful breakdown of the pattern (the "rule") she's likely applying, predictions for the new cases, and a test case to probe deeper:

  **Mara's Likely Rule (The Pattern):**
  Mara distinguishes **discovered kinds** (existing independently of human practices) from **instituted kinds** (existing *because* of specific human practices, agreements, or decisions). Crucially, she focuses on **what grounds the existence and boundaries of the kind itself**:

  1.  **Constructed ("Instituted Kind"):** If the *existence* of the kind *as that specific kind* and/or its *defining boundaries* depend fundamentally on **ongoing human agreement, social practices, rules, or decisions** to create, define, and maintain it, *even if it's built on a physical or biological basis*.
      *   *Why Race?* The *groupings* (which physical features count, how many races, who belongs where) aren't discovered biological facts; they are defined and changed by social/political decisions and practices across history and cultures.
      *   *Why Money?* The paper/digital token *only functions as money* because of a complex system of social trust, legal tender laws, and economic practices. Its value and status are instituted.
      *   *Why Teenager?* The *social category* of "teenager" as a distinct life stage with specific expectations, culture, and laws didn't exist before modern social, economic, and educational structures created it.
      *   *Why Citizenship?* Borders and the legal status of belonging to a nation are defined and enforced by human-made laws and political agreements.

  2.  **NOT Constructed ("Discovered Kind"):** If the kind exists, and its core defining properties are fixed, independently of human agreement, decisions, or social practices. Humans might *label* it or *measure* it, but we don't *institute its essence or boundaries* through our practices.
      *   *Why Height?* Once a unit (foot) is defined, measuring an object's length in that unit is an objective fact about the object relative to that standard. The *standard* is constructed, but the *measurement outcome* isn't.
      *   *Why Species?* Crows existed, behaved like crows, and were biologically distinct long before humans named them. Our taxonomy aims to *discover* and describe pre-existing biological reality.
      *   *Why Diabetes?* Type 1 diabetes is a specific physiological mechanism that occurs in bodies. Medical science *discovers* and describes it; it wasn't invented by social agreement.
      *   *Why Left-Handed?* Handedness is a biological predisposition. While *cultural attitudes* towards left-handedness are constructed, the underlying biological trait itself isn't.

  **Key Distinction:** It's **not** *just* about "could we have drawn the line elsewhere?" (we could measure in meters, but height-in-meters is still not constructed once defined). It's **not** *just* about "would it exist without us?" (money *as money* wouldn't, crows *as crows* would). It's **not** *just* about "does the label change people?" (though that can be a *consequence* of construction). **The core is: What fundamentally constitutes the kind *as that kind*? Is it human practices/institutions, or is it objective reality independent of those practices?**

  **Predictions for New Cases:**

  1.  **Pluto / "Planet": CONSTRUCTED**
      *   *Reasoning:* The category "planet" isn't a discovered natural kind with an immutable essence waiting to be found. The *definition* and its *boundaries* (what counts, what doesn't) are decided by a community of experts (astronomers) based on evolving scientific understanding, practical considerations (like needing clear definitions for cataloging), and even historical precedent. Pluto didn't change; the *human-defined rules for club membership* changed. Its status *as a planet* depended entirely on the socially agreed-upon definition. This fits perfectly with money (status depends on agreement), citizenship (status depends on rules), and race (groups depend on socially chosen criteria). It contrasts sharply with "crow" or "diabetes," where the core defining features exist independently of any committee vote.

  2.  **"Chronically Absent" Student: CONSTRUCTED**
      *   *Reasoning:* The kind "chronically absent student" is *entirely instituted* by the school district's specific rule (10% absence threshold). This threshold is an arbitrary (or at least policy-driven) line drawn by human decision, not a discovered natural category like a species or a disease. Crucially, the *significance* of this label comes from the social practices that follow: teachers getting lists, lowered expectations, and the resulting behavioral changes in students. The label itself, defined by human rules, *creates a new social reality* that changes how people are perceived and treated, similar to how the "teenager" category creates social expectations. The underlying absences are real (like height is real), but *being "chronically absent"* is a status defined by and dependent on the school's specific policy and the social responses it triggers.

  **Testing the Rule: A Probing Case**

  To distinguish between the "instituted vs. discovered kind" rule and simpler rules like "label changes the person" or "could lines be drawn differently," present this:

  *   **The Case: "Refugee" Status**
      *   *Scenario:* Someone flees their country due to a well-founded fear of persecution. Whether they are officially recognized as a "refugee" depends on specific legal definitions in the country they flee to (e.g., type of persecution, proof required), which vary and change over time. Getting the label grants specific legal rights and access to aid; not getting it leaves them vulnerable. The label itself significantly impacts their life chances.

  **How the Rules Predict:**

  *   **Mara's Likely Rule (Instituted vs. Discovered Kind):** CONSTRUCTED. The *legal status and category* "refugee" (as opposed to "migrant," "asylum seeker," etc.) is defined by human-made laws, treaties, and bureaucratic decisions. Its boundaries and the rights/consequences attached are entirely dependent on social and political institutions. The *fear and flight* are real, but the *official kind* "refugee" is constructed.
  *   **"Label Changes the Person" Rule:** CONSTRUCTED. Getting the "refugee" label demonstrably changes their social reality and opportunities.
  *   **"Could Lines Be Drawn Differently" Rule:** CONSTRUCTED. Definitions of who qualifies as a refugee vary greatly between countries and eras.
  *   **"Exists Without Humans" Rule:** NOT CONSTRUCTED (Problem!). The *person experiencing persecution and displacement* would exist without the label, but the *institutional kind "refugee"* would not. This rule would likely misfire here, suggesting Mara isn't using it purely.

  **Conclusion on Mara's Rule:** Mara consistently distinguishes between kinds whose *fundamental existence and definition as that specific category* are *instituted* by human practices, agreements, or decisions (constructed) and kinds whose *fundamental existence and core defining features* are *discovered* in objective reality, independent of those practices (not constructed). The "refugee" case strongly confirms this "instituted vs. discovered kind" distinction is her core rule, as it clearly fits the pattern of constructed institutional statuses (like citizen, chronically absent) rather than discovered biological realities (like crow, diabetes). Her verdicts genuinely settle on this pattern. Go forth and predict confidently at lunch!
