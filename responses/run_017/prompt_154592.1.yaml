  For the constituency problem, the rural/urban imbalance and intergenerational effects are crucial. Most readings exclude future residents except the idealized counterfactual one. The regress issue is real for any reading claiming the "people" pre-exist the decision.

  The referendum vs assembly conflict exposes how different readings handle time. Binding earlier decisions make sense for procedural readings but undermine deliberative ones. The tradeoff between determinacy and refutability is stark - the most substantive readings are unfalsifiable while procedural ones are clear but empty of policy content.

  Applying this to their four cases: The closure campaign misuses the referendum reading. The organizer's shutdown tactic relies on an illegitimate slide between readings. The assembly member's usage is the most defensible but still has operational gaps. The remit letter's ambiguity seems deliberately unhelpful.

