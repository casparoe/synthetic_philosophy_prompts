  Breaking this down, the user has very specific constraints: no theoretical deep dives, just functional disambiguation. They want a menu of readings ordered from thinnest to most demanding, with each analyzed along five dimensions: claim, nature of will, constituency, verification method, and falsification conditions. Plus addressing their five specific constraints about determinacy, constituency, time conflict, procedure tradeoffs, and application to their four real-world examples.

