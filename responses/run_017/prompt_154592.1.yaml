answer: |-
  Here is a disambiguation of "the will of the people" structured as a menu of distinct readings, ordered from thinnest (most procedural) to most demanding (most substantive), addressing your five constraints directly:

  ### **Reading 1: Procedural Authority (Thinnest)**  
  - **Claim**: Legitimate decisions are those made by an authorized procedure, regardless of content. "The will" is the *output* of that procedure.  
  - **Nature of Will**: A title conferring authority on a decision-maker (e.g., referendum, legislature, assembly).  
  - **Constituency ("The People")**: Defined by the procedure itself (e.g., voters in the 2019 referendum). Boundaries are set *prior* to the procedure. Future/unborn residents are excluded.  
  - **Settled By**: Successful completion of the authorized procedure (e.g., a majority vote).  
  - **Counts Against**: Procedural flaws (fraud, coercion, exclusion of eligible voters).  
  - **Determinate Policy?** **No** – Only settles *who* decides, not *what* should be decided.  
  - **Regress?** Boundaries must be pre-defined; no regress.  
  - **Earlier vs. Later?** Earlier procedure binds if authorized (like the 2019 referendum claim).  
  - **Tradeoff**: Escapes the tradeoff: easily refutable (check procedure) but policy-neutral.  

  ### **Reading 2: Aggregate Preference (Simple Majoritarianism)**  
  - **Claim**: The will is the policy preferred by a majority of individuals at a given time.  
  - **Nature of Will**: Tally of individual preferences (e.g., opinion poll, referendum result).  
  - **Constituency**: All current residents/eligible voters. Boundaries fixed by jurisdiction (e.g., health region). Excludes future residents.  
  - **Settled By**: Counting preferences via vote/survey.  
  - **Counts Against**: Evidence of changed preferences; non-participation distorting representation.  
  - **Determinate Policy?** **Yes** – Points to a specific outcome (e.g., "No" to closures in 2019).  
  - **Regress?** Boundaries pre-defined; no regress.  
  - **Earlier vs. Later?** Earlier snapshot (referendum) overrides later views unless new vote held.  
  - **Tradeoff**: Bites hard: refutable by new data, but unstable and ignores intensity/quality of preferences.  

  ### **Reading 3: Ascriptive Will (Populist Sovereignty)**  
  - **Claim**: The will is whatever a leader/movement *declares* it to be in the name of "the people."  
  - **Nature of Will**: An ascription by whoever successfully claims to speak for the people.  
  - **Constituency**: Defined rhetorically by the speaker (e.g., "real locals," "silent majority"). Boundaries shift strategically. Unborn excluded.  
  - **Settled By**: Successful rhetorical claim + mobilization.  
  - **Counts Against**: Contradiction by actual preferences; exposure of exclusionary framing.  
  - **Determinate Policy?** **Yes/No** – Declares a policy *and* asserts legitimacy, but content is arbitrary.  
  - **Regress?** Evades regress by fiat: the speaker defines the people.  
  - **Earlier vs. Later?** Speaker can override past decisions ("The people now see the truth").  
  - **Tradeoff**: Determinate but irrefutable – immune to evidence, relies on charisma/force.  

  ### **Reading 4: Deliberative Counterfactual (Most Demanding)**  
  - **Claim**: The will is what the people *would* agree on after informed, impartial deliberation.  
  - **Nature of Will**: Idealized counterfactual – a function of preferences transformed by reason.  
  - **Constituency**: All affected (present + future generations). Boundaries set by impact, not residency. **Includes future residents**.  
  - **Settled By**: Structured deliberation (e.g., citizens’ assembly) under fair conditions.  
  - **Counts Against**: Evidence that deliberation was distorted (e.g., misinformation, power imbalances).  
  - **Determinate Policy?** **Yes** – Aims at a reasoned consensus.  
  - **Regress?** Boundaries partially defined by deliberation itself (e.g., who is "affected"). Mild regress resolved pragmatically.  
  - **Earlier vs. Later?** Later, better-informed deliberation overrides earlier snapshots.  
  - **Tradeoff**: Escapes tradeoff *in theory* – determinate and refutable (by deliberative flaws). *In practice*, relies on institutional design.  

  ---

  ### **Application to Your Cases & Verdicts**  
  1. **Campaign against closures (2019 referendum)**:  
     - **Reading**: #2 (Aggregate Preference).  
     - **Defensible?** Only if:  
       - The referendum was authorized to bind future decisions *and*  
       - The question precisely matched current policy options.  
     - **Fatal flaw**: Citizens’ assemblies exist precisely to *revisit* snapshots with deeper analysis.  

  2. **Organizer closing down debate**:  
     - **Reading**: Illegitimate slide from #1 (authority) to #2/#3 (content). Assumes a prior decision (#1) *also* embodies a substantive will (#2/#3).  
     - **Defensible?** **No** – Conflates procedural legitimacy with substantive infallibility.  

  3. **Assembly member (deliberative view)**:  
     - **Reading**: #4 (Deliberative Counterfactual).  
     - **Defensible?** **Yes** – Aligns with the purpose of sortition-based assemblies. Requires rigorous process to avoid bias.  

  4. **Remit letter ("do not substitute your judgment")**:  
     - **Reading**: Ambiguous between #1 (follow the procedure) and #3 (don’t question authority).  
     - **Defensible?** **Only as #1** – If it means "execute your role faithfully." As #3, it undermines deliberation.  

  ---

  ### **Your Tradeoff: Genuine but Not Absolute**  
  - **Genuine**: Readings #2 and #3 claim determinate policies but are hard to refute (#2 is brittle, #3 is authoritarian). Reading #4 aims for both determinacy and refutability but depends on institutional trust.  
  - **Escapes**: #4 escapes *if* deliberation is transparent and self-correcting.  

  ### **Verdict on Usability**  
  - **Only Reading #4** is both applicable to your assembly and defensible. It:  
    - Matches your design (informed deliberation over time),  
    - Incorporates future generations (crucial for long-term infrastructure),  
    - Allows overriding past referendums *with justification*,  
    - Generates substantive guidance, not just legitimacy.  
  - **All other readings** collapse into **honorifics** that immunize decisions:  
    - #1 is tautological ("the will is what the procedure says"),  
    - #2 is unstable and exclusionary,  
    - #3 is authoritarian.  

  ### **The "General Will" Shadow**  
  Reading #4 parallels Rousseau’s "general will" (common good vs. private interests) but avoids mysticism by tethering it to *actual deliberation* under constrained conditions. The key distinction: it’s not metaphysical but **emergent from process**.  

  ### **Final Judgment**  
  The phrase is **mostly an honorific** outside deliberative contexts. For your assembly:  
  - **Reject** appeals to "will" as pre-existing (#2, #3) or authoritarian (#1 misapplied).  
  - **Embrace** your role as Reading #4: you *are* the vehicle for ascertaining the deliberative counterfactual will. The remit letter’s warning likely means: "Don’t impose personal biases – let the process work." Your recommendation *is* the will under this reading, provided your process was sound. Anchor legitimacy in your **method**, not the slogan.
