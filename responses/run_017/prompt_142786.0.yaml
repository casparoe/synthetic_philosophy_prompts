prompt: |-
  I'm taking an undergraduate set theory course this term, and after section a few of us got into an argument about the axiom of choice that I haven't been able to resolve. The usual slogan is just that every family of nonempty sets has a choice function: you can pick one element from each set in the family. My friend insisted that this sounds weaker than a principle he made up, and now I can't tell if he's right. Fix a carrier set S. Let Fam(S) be the set of all families A of nonempty subsets of S, so each A is itself a set of nonempty subsets of S. His principle, call it Uniform Choice on S, says there is a single function U whose domain is Fam(S) such that for every A in Fam(S), U(A) is a choice function for A: U(A) has domain A and for each a in A, U(A)(a) is an element of a. Ordinary AC only seems to promise that for each individual A there exists some choice function; Uniform Choice on S promises one global assignment U that hands you a choice function for every family of nonempty subsets of S simultaneously.

  Can you explain the exact strength of this? I don't want a one-line answer like it depends. For a fixed S, is Uniform Choice on S equivalent to the statement that S can be well-ordered? I think there's a neat argument: the family A* of all nonempty subsets of S is itself an element of Fam(S), so U(A*) is a function that picks an element out of every nonempty subset of S; then you can enumerate S by repeatedly feeding the set of remaining elements to that selector, and by the Hartogs argument the process has to stop, giving a well-ordering of S. Conversely, if S has a well-ordering, you can define U(A)(a) to be the least element of a, and that gives a single uniform U. Please check this argument and spell out both directions, including whether any hidden choice is needed in the transfinite recursion. Then, what about the scheme that says Uniform Choice on S holds for every set S? Is that scheme equivalent to the full axiom of choice, given that AC is equivalent to every set being well-orderable? Walk through how the equivalence for each S combines into the equivalence for the scheme, and be explicit about the seperate roles of the well-order and the uniform selector.

  I'm also fuzzy on the conceptual difference between for every family there is a choice function and there is a uniform function that assigns a choice function to every family. Why is the move from forall-A exists-f to exists-U forall-A (U(A) is such an f) not legitimate in general, and what is AC doing when it lets us make that move here? I keep hearing that AC is nonconstructive and doesn't give an explicit rule, but Uniform Choice on S starts to look like a rule: feed it a family and it spits out a choice function. Please explain why, for S = the natural numbers, the uniform U is actually definable in ZF (just take the least number in each nonempty subset), whereas for a general set S the uniform U is basically a well-ordering of S in disguise, so AC provides it without providing a definable procedure. Use the socks analogy if it helps, but I really want the set-theoretic detail: Fam(S), the special family A* = P(S) minus the empty set, the least-element definition when a well-order exists, the transfinite enumeration when you only have U, and why the seeming uniformity of U still leaves the choice as arbitrary as ever. I was discussing this with a freind and we kept talking past each other, so a clear walkthrough would help a lot.
reasoning: |-
  We are discussing "Uniform Choice on S", which asserts the existence of a single function U defined on Fam(S) (the set of all families of nonempty subsets of S) such that for every family A in Fam(S), U(A) is a choice function for A.

  We want to know:
  1. For a fixed set S, is Uniform Choice on S equivalent to S being well-orderable?
  2. If we have Uniform Choice for every set S, is that equivalent to the full Axiom of Choice?

  Additionally, we want to understand the conceptual difference between the existence of a choice function for each family and a uniform assignment of choice functions to every family.

  Let me first recall the definitions and set up the notation.

  - Let S be a set.
  - Fam(S) = { A ⊆ P(S) \ {∅} }  [Note: each A is a set (a family) of nonempty subsets of S. So Fam(S) is the power set of P(S) without the empty set, but note: we are including all possible such families, so Fam(S) = P(P(S) \ {∅}). However, we don't need to go into that level of detail; we just consider Fam(S) as the collection of all families of nonempty subsets of S.]

  - Uniform Choice on S: There exists a function U: Fam(S) → (some codomain) such that for every A ∈ Fam(S), U(A) is a function with domain A and for every a ∈ A, U(A)(a) ∈ a.

  Now, let's prove the equivalence for a fixed S.

  **Part 1: If S is well-orderable, then Uniform Choice on S holds.**

  Assume S is well-ordered by a relation <. Then for any nonempty subset a of S, we can define the least element of a with respect to this well-order.

  We can then define U as follows: For any family A ∈ Fam(S), define U(A) to be the function that maps each set a in A to the least element of a (with respect to the fixed well-order of S).

  Then clearly, for every a ∈ A, U(A)(a) is an element of a (since it is the least element of a). And U is a single function defined on all of Fam(S). So we have Uniform Choice on S.

  **Part 2: If Uniform Choice on S holds, then S is well-orderable.**

  Assume we have a uniform choice function U for Fam(S). Consider the family A* = P(S) \ {∅}, which is the family of all nonempty subsets of S. Note that A* ∈ Fam(S). Then U(A*) is a choice function for A*, meaning that U(A*) is a function that assigns to every nonempty subset a of S an element in a. In other words, we have a global choice function for S.

  Now, we wish to well-order S using this global choice function. The standard way to do this is by transfinite recursion. We define a sequence of elements of S by repeatedly applying the choice function to the set of elements not yet chosen.

  More formally, we define by transfinite recursion:

  - Let F(0) = U(A*)(S)  [choosing an element from S, which is nonempty if S is nonempty; if S is empty then we are done, so assume S nonempty]
  - For an ordinal α, let S_α = S \ { F(β) | β < α }
  - If S_α ≠ ∅, then F(α) = U(A*)(S_α)
  - Otherwise, stop.

  This is a transfinite sequence. Since the class of ordinals is a proper class and S is a set, by the Hartogs number argument (or by the Axiom of Replacement) we know that the sequence must terminate at some ordinal, meaning that for some ordinal γ, S_γ = ∅. Then the set { F(β) | β < γ } is an enumeration of S without repetition, hence a well-ordering of S.

  But note: in this construction, we are using the global choice function U(A*) (which we have by Uniform Choice) to pick the next element. Also, we are using transfinite recursion, which is a theorem of ZF (it doesn't require the Axiom of Choice). The recursion is defined using the fixed function U(A*). So we can define the well-order without any additional choice.

  Therefore, Uniform Choice on S implies that S is well-orderable.

  Thus, for a fixed S, Uniform Choice on S is equivalent to S being well-orderable.

  **Now, for the scheme over all S:**

  We want to know if the statement "for every set S, Uniform Choice on S holds" is equivalent to the full Axiom of Choice.

  Recall that the full AC is equivalent to "every set is well-orderable".

  - If we assume that for every set S, Uniform Choice on S holds, then by the above, every set S is well-orderable. Hence, the full AC holds.

  - Conversely, if the full AC holds, then every set S is well-orderable. Then for each S, since S is well-orderable, we have Uniform Choice on S (by the first part). So for every S, Uniform Choice on S holds.

  Therefore, the scheme is equivalent to the full AC.

  **Conceptual Difference:**

  The ordinary AC for a family A (which is a set) says: For every A in Fam(S), there exists a choice function f for A.

  In symbols: ∀A ∈ Fam(S), ∃f: A → ∪A such that ∀a∈A, f(a)∈a.

  Uniform Choice on S says: ∃U: Fam(S) → (set of choice functions) such that ∀A∈Fam(S), U(A) is a choice function for A.

  The difference is that the ordinary AC gives you, for each A, a choice function f_A, but these f_A might be chosen arbitrarily and independently. Uniform Choice requires that there is a single rule (a function U) that assigns to each A a choice function in a uniform way.

  Why is the move from ∀∃ to ∃∀ not legitimate in general? This is because the existential quantifier in ∀A∃f might depend on A in a way that cannot be made uniform. Without AC, we cannot necessarily collect the choices into a single function.

  In the case of S = natural numbers (with the usual ordering), we can define U uniformly: for any family A of nonempty subsets of ω, we can define U(A)(a) = the least element of a (in the usual order of ω). This is definable in ZF without AC because the natural numbers come with a canonical well-order.

  But for an arbitrary set S, without a well-order, we cannot define such a U without AC. And even when we have Uniform Choice on S via AC, the function U is not necessarily "explicit" or "definable" in any constructive sense. It is just as arbitrary as a well-ordering of S.

  The socks analogy: If we have infinitely many pairs of socks, AC allows us to choose one sock from each pair, but it doesn't give us a rule. Similarly, Uniform Choice on S gives us a rule (a function U) that, when given any family of nonempty subsets (like a family of pairs of socks, but note: the family could be arbitrary, not necessarily pairs), produces a choice function for that family. But the rule itself is arbitrary: it depends on the well-ordering we fixed (if we have one) or on the uniform U we have by fiat.

  In the case of the natural numbers, we have a canonical rule: the least element. But for a set without a distinguished well-order, the rule is arbitrary. However, Uniform Choice on S does provide a uniform method for all families at once, but that method is not constructive in the sense that it is not definable without a well-order.

  **Summary:**

  1. For a fixed set S, Uniform Choice on S is equivalent to S being well-orderable.
  2. The principle that Uniform Choice on S holds for every set S is equivalent to the full Axiom of Choice.

  The move from "for every family there is a choice function" to "there is a uniform function assigning a choice function to every family" is not automatic and requires a choice principle. In the case of S being well-orderable, we can define the uniform function from the well-order. Without a well-order, we cannot define such a function in general (as in the case of a set that cannot be well-ordered without AC).

  The uniformity provided by Uniform Choice on S is only as explicit as the well-ordering of S. For the natural numbers, we have an explicit well-ordering, so we have an explicit uniform choice function. For an arbitrary set, we do not, unless we assume AC.

  I hope this clears up the confusion.
