prompt: |-
  Hey — I'm writing a term paper on everyday conventions (tipping, queueing, jaywalking) and my flatmate, who's an anthro PhD and enjoys being insufferable, walked me into an argument I now think proves way too much. I've been going in circles for a week and would rather someone else name the broken step.

  Here it is:

  (1) A big chunk of what we call everyday morality is convention-dependent. Whether leaving nothing on the table is an insult depends on the local tipping practice; whether walking to the front is a theft or just how it's done depends on how the line works; whether stepping off the curb on a red is a small rudeness or a total non-event depends on local pedestrian practice. There doesn't seem to be any practice-independent fact about whether 18% or nothing is owed, or about whether the front of the line is yours if you got there first. If the practice were different, the duty would be different or gone.

  (2) The content of a convention-dependent duty is fixed by the practice, and the practice as it actually exists doesn't sort people into locals and visitors. It says something like: someone in situation S at a place like this is required to do R. Nothing in the content of the queueing convention, or the tipping convention, carries a nationality clause. So if you want to say "she's exempt, she's just visiting," you're adding a condition the practice itself doesn't contain.

  (3) And there's no in-principle limit on what a local practice can require. Where my flatmate grew up, the shared taxis board as an actual scrum and nobody thinks less of anyone for it. In plenty of places you're expected to refuse an offered gift twice before accepting. In plenty of others the permit application moves because there's cash folded into it.

  (4) So a visitor is morally required to shove at the taxi rank, to refuse the gift twice, to hand over the envelope — and by the same reasoning required to tip at the local rate even if she thinks tipping is a rotten system, and required to stand at the crossing for a full cycle with no car in sight if that's the local pedestrian norm.

  (5) That's way too much. A traveler who declines to fold cash into the permit hasn't done anything wrong; if anything she's done the better thing. And the argument seems to eat itself: if every duty is fixed by the local practice, there's no standpoint left from which anyone inside the practice can criticize it, and "that's how we do things here" becomes a complete moral answer.

  (6) So one of (1)-(4) has to go.

  What I want to keep: I'd most like to keep (1), because the whole point of my paper is that everyday morality is more local than my classmates want to admit. I also want to keep the bit of (4) that says the visitor isn't off the hook — I really dislike the tourist who strolls to the front of the line on the grounds that this isn't her country, and I want to be able to say she's doing something wrong. So I'm hoping the damage is in (3) or the move from (2) to (4).

  My flatmate says (3) is cheating: a scrum isn't a convention, it's what happens when there isn't one, and the envelope isn't a convention either, it's coercion that happens to have a regular shape. I half believe her, but I don't know how to state the test for which regularities count without it being ad hoc, and I'm worried any test that rules out the scrum will also rule out US tipping, which nobody thinks is *not* a convention. The gift-refusal case is the one that actually scares me, because it looks like a perfectly good convention on the standard coordination story — everyone conforms because everyone else conforms, everyone expects everyone to, nobody has a unilateral reason to stop — and yet I don't want to say a visitor who accepts on the first offer has committed a moral fault.

  I've been calling the fix I want "the guest clause": a local convention binds a visitor only if (a) she's taken up the benefits the practice distributes — she ate the meal, rode the taxi, walked the sidewalks — and (b) the point of the practice is served by conformity even when nobody can tell that you're conforming. But I can't tell whether that's a real principle or just a description of the cases I already have opinions about, and whether it proves too much in the other direction (does it let me free-ride?). A related thing I can't sort out: jaywalking, where "everyone does it" and "it's against the law" come apart, and I don't know whether the legal/conventional distinction is doing any work in (1) or is a red herring.

  So: which step do you reject, why did it look fine, and what does rejecting it cost me? If you think the argument is valid and I just have to swallow something, tell me which premise is cheapest to give up and what I lose. And if you use a test to separate the scrum from the queue, please say why it isn't gerrymandered — and whether it also gives an answer on the visitor who refuses the gift, the one who doesn't tip, and the one who jaywalks. Also worth flagging if my (2) is doing something sneaky: I have a feeling that any way of exempting the visitor needs moral resources from outside the practice, which would undercut (1) from the inside, but I can't quite make that precise.

  Please write in American English, and keep it concrete — I'd rather have the argument diagnosed step by step than a survey of what's been said about conventions generally.
reasoning: |-
  Okay, let me start by unpacking the user's problem. They're writing a term paper on everyday conventions like tipping and queueing, and they're stuck in a logical argument their flatmate led them into. The core issue is that following the argument to its conclusion leads to absurd moral obligations for visitors, like having to bribe officials or participate in a scrum for taxis. The user wants to reject this outcome but is struggling to identify which step in the argument is flawed without undermining their thesis that everyday morality is local.

  First, I need to understand each step of their argument. Premise (1) states that everyday morality is convention-dependent, which is central to their paper. They don't want to give this up. Premise (2) argues that conventions don't differentiate between locals and visitors, so visitors are bound by the same rules. Premise (3) claims there's no limit to what conventions can require, using examples like scrums or bribery. Step (4) concludes that visitors must follow all local conventions, leading to the problematic outcomes in (5). The user finds (5) unacceptable and wants to reject one of the earlier steps.

  The user specifically wants to preserve (1) and the idea that visitors aren't entirely off the hook (like cutting in line). They suspect (3) might be the issue or the move from (2) to (4). Their flatmate argues that some examples in (3) aren't genuine conventions but rather coercion or absence of norms. The user is worried that any test to distinguish "real" conventions might be ad hoc, especially since US tipping is clearly a convention but could be challenged under such a test.

  Looking at their proposed "guest clause," it has two parts: benefiting from the practice and conformity mattering even when unobserved. But they're unsure if this is principled or just ad hoc. Also, they're confused about jaywalking where law and convention diverge.

  I need to identify the weakest link. Premise (3) seems vulnerable. The examples given—bribery and scrums—might not be pure coordination conventions. Bribery involves coercion and harm, which introduces external moral considerations. The scrum might be an absence of a queue convention rather than a positive norm. The gift-refusal case is trickier because it seems like a genuine convention without obvious harm.

  The key is separating conventions that solve coordination problems from those that impose harms or involve coercion. Conventions like tipping or queueing create mutual benefits without significant harm. But bribery creates victims and corruption. So rejecting (3) by limiting conventions to those without significant harm or coercion preserves the user's core points. This allows visitors to be bound by queueing norms (which maintain order) but not by bribery (which is harmful). The gift-refusal case falls in the middle; if it avoids social offense, visitors might have a weaker obligation to comply.

  For jaywalking, the distinction between law and convention matters. If everyone ignores the law, the convention overrides it. But if the law is enforced, it's not purely conventional. The user should focus on actual practices, not legalities.

  The user's concern about needing external moral resources to exempt visitors is valid, but by limiting conventions to coordination norms, they're not importing full external morality—just a minimal harm principle that doesn't undermine the locality of conventions. This keeps (1) intact while resolving the absurdities in (5).
answer: |-
  Here's the breakdown of where your argument goes wrong, why it's tricky, and what rejecting the flawed step costs you – keeping (1) intact and preserving the visitor's obligation in core queueing/tipping cases:

  **The Broken Step is (3): "And there's no in-principle limit on what a local practice can require."**

  **Why (3) Looks Fine (At First):** It seems intuitively true. Human societies *do* generate wildly diverse behavioral norms around coordination, respect, resource distribution, and conflict avoidance. The examples (scrum, gift refusal, envelope) *appear* to be regular, expected patterns of behavior that people follow because others do. This fits a broad definition of "convention."

  **Why (3) is Actually Wrong:** It ignores a crucial distinction embedded in your own examples and essential for "everyday morality." **Not every regular pattern of behavior is a *morally binding convention* in the sense that failing to follow it constitutes a distinct *moral wrong* against specific individuals.** The "no in-principle limit" claim collapses different kinds of regularities into one category.

  **The Test (and Why It's Not Gerrymandered):** A genuine *morally binding coordination convention* must satisfy two core conditions derived from its fundamental *purpose*:

  1.  **Coordination/Order Function:** Its primary purpose is to solve a coordination problem or establish a predictable order *for mutual benefit*, reducing conflict, inefficiency, or social friction. It creates a stable expectation about behavior in a specific context.
  2.  **No Inherent Significant Harm/Coercion:** Conforming to the convention itself does not typically involve causing *significant, direct harm* to specific individuals against their will *as an inherent part of the practice*, nor is it primarily sustained by fear of punishment rather than mutual expectation. (Minor friction or disappointment doesn't count as "significant harm" here).

  **Applying the Test to Your Cases:**

  *   **Queueing (Kept):** Solves coordination problem (who gets served when). Creates order, reduces conflict/frustration. Mutual benefit (everyone gets served predictably). No inherent harm (waiting your turn isn't harmful).
  *   **Tipping (Kept):** Solves coordination problem (supplementing service worker income in a specific system). Creates predictable income expectations, reduces friction/resentment. Mutual benefit (worker gets paid, customer gets service under known expectations). No inherent harm (paying an expected supplement isn't harmful).
  *   **Gift Refusal (Ambiguous/Debatable - Often Kept):** Solves coordination problem (avoiding appearance of greed, demonstrating modesty, establishing sincerity). Reduces social friction/awkwardness. Mutual benefit (gift-giver feels offering is valued, receiver avoids seeming grasping). *Usually* no inherent harm (mild social awkwardness isn't "significant harm"). **Visitor Status:** A visitor *might* be cut slack (benefit of the doubt), but persistently ignoring the norm *after understanding it* likely causes the social friction the convention exists to prevent (awkwardness, offense), so the obligation arguably *does* hold, though perhaps less strictly than for locals. Your intuition that it's less severe than queue-cutting might stem from the *degree* of friction caused.
  *   **"Scrum" Taxi Boarding (Rejected as a Binding Convention):** This fails condition 1. It doesn't *solve* a coordination problem; it's often the *absence* of one ("every man for himself"). It doesn't create predictable order; it *is* the disorder. There's no mutual benefit from *shared expectations*; individuals benefit only through personal force/aggression. It's the *lack* of a queueing convention, not an alternative one.
  *   **"Envelope" Bribery (Rejected as a Binding Convention):** This fails condition 2. While regularized, its primary function isn't mutual benefit through coordination. It inherently involves *coercion* (denying a service/right without payment) and *harm* (corruption, unfairness, victimizing those who can't pay). It's sustained by fear of consequences/power imbalance, not mutual expectations of benefit. It's a corrupt *practice*, not a morally binding coordination *convention*.

  **Why This Test Isn't Gerrymandered (and Protects US Tipping):**

  *   **It targets the core *function*:** The test focuses on *why* the regularity exists and what it *does*. Does it create order and mutual benefit (convention), or is it chaos (scrum) or exploitation (bribery)?
  *   **It explains why some "regularities" feel different:** We intuitively sense that shoving isn't "how it's done" in a moral sense like queueing is; it's just what happens *without* rules. Bribery feels wrong *because* it harms and coerces.
  *   **It handles the US Tipping Case:** Tipping clearly solves a coordination problem (income supplement within a specific labor system) and provides mutual benefit (workers rely on it, customers know the expectation). While controversial, the *act* of tipping within the system doesn't inherently harm anyone (arguably the *system* might, but that's different from the *act of conforming* to the convention). The test distinguishes the convention itself from potential critiques of the system it operates within.
  *   **It's not based on harm *simpliciter*:** Minor friction (queue-jumping causes frustration, gift-acceptance causes awkwardness) is part of *why* coordination conventions are beneficial – they *avoid* it. The test excludes practices where significant harm/coercion is the *primary mechanism or inherent outcome* (like bribery).

  **How Rejecting (3) Fixes Your Argument:**

  *   **(1) Stands:** Everyday morality *is* heavily convention-dependent for coordination norms like queueing and tipping. The duty *is* practice-relative.
  *   **(2) Stands (with nuance):** The convention's content *is* "someone in S does R." There's no inherent "tourist clause."
  *   **(3) Falls:** There *is* an in-principle limit. Practices involving inherent significant harm/coercion or failing to solve a coordination problem for mutual benefit aren't morally binding conventions in this sense. The scrum and the envelope aren't valid examples of binding conventions.
  *   **(4) Modified:** A visitor is morally required to follow *genuine coordination conventions* (like queueing, tipping at the local rate) because they participate in the context (benefiting from the order/service) and violating them causes the very friction/harm the convention prevents (disorder, unfair financial impact on workers). They are *not* required to participate in harmful/coercive practices (bribery) or chaotic non-conventions (scrum).
  *   **(5) Resolved:** The traveler who doesn't bribe hasn't violated a morally binding convention; they've avoided participating in a harmful/coercive practice. "That's how we do things here" *isn't* a complete moral answer for harmful practices, but it *is* relevant for genuine coordination conventions. Criticizing a convention *from within* is still possible by appealing to broader harms the system *causes* (e.g., arguing tipping is exploitative) or inefficiencies, but the *violation of the convention itself* by a participant remains a distinct wrong against those relying on it.

  **What Rejecting (3) Costs You (Minimal, Given Your Goals):**

  1.  **Narrower Scope for "Convention":** You have to accept that not every regularity is a morally binding convention. Practices like systematic bribery or chaotic scrambles fall outside this category. This is a cost, but it aligns with moral intuition and rescues your core argument from absurdity.
  2.  **External Resource? (Minimal):** You use a thin, functional definition ("solves coordination for mutual benefit without inherent significant harm") to filter conventions. This *is* a resource "outside" the specific practice's content, but it's *not* importing a full external morality. It's defining the *type* of practice that *can* generate localized moral obligations. It doesn't dictate *what* the convention *is* (that's still local), just whether it fits the mold for generating *this kind* of obligation. This preserves the locality of (1).

  **Addressing Your Specifics:**

  *   **The Guest Clause:** Your (a) "benefit" point is strong and incorporated (visitor participates/benefits). Your (b) "point served by conformity even when unseen" is insightful for *why* violating genuine conventions is wrong (undermining the system/expectation), but is less crucial for the initial sorting than the function/harm test. The harm test is more fundamental for ruling out bribery/scrum.
  *   **Jaywalking:** The key is the *actual, prevailing practice*, not the law. If the *convention* is "cross when safe regardless of light," then violating *that* convention (e.g., waiting pointlessly when everyone else crosses) might cause minor friction or confusion (mild harm of inefficiency/social awkwardness). If the convention is "obey the light," then crossing against it violates the coordination norm. The legal status is secondary; focus on the lived convention. The harm test usually keeps this minor.
  *   **Visitor Refusing Gift:** As above, likely *is* a genuine convention. The visitor causes the social friction (awkwardness, potential offense) the convention exists to prevent. The obligation holds, though the harm is lesser than queue-cutting, possibly lessening the *severity* of the wrong. They *are* "off the hook" only via ignorance or significant cultural distance making the expectation truly unknowable/unreasonable.
  *   **Visitor Not Tipping:** They've benefited from the service within a system where the worker's income relies on the convention. Violating it directly harms the worker financially (significant harm relative to the context) and undermines the system. Strong obligation holds.
  *   **Free-Riding:** Your test *prevents* free-riding in genuine conventions. If the visitor benefits from the order created by queueing or the service within the tipping system, they are obligated to conform. It only exempts them from participating in harmful/non-conventions.

  **Conclusion:** Reject (3). The flaw is assuming *any* regularity constitutes a morally binding convention. The fix is limiting "convention" in this moral context to practices that solve coordination problems for mutual benefit without inherent significant harm or coercion. This preserves your core thesis (1), maintains visitor obligations for queueing/tipping (as you want), avoids the absurdities (bribery/scrum), provides a non-arbitrary test that protects US tipping, and handles the gift/jaywalking cases plausibly. The cost is a slightly narrower, more functional definition of "convention," using minimal external criteria focused on the practice's core purpose and effects. Your flatmate was partly right about the scrum/envelope, but for deeper reasons than they likely stated.
