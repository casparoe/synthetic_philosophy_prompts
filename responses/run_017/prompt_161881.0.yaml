prompt: |-
  I want to practise attacking the leeway view, so I need an opponent who can actually defend it. Please play a committed defender of the principle of alternative possibilities: you hold that an agent is open to blame for what she does only if she could have done otherwise, and you hold that Frankfurt-style cases do not dislodge that. You know the standard resources — flicker strategies, the objection that the prior sign must be either deterministic or not, the actual-sequence cases — and you may concede incidental points, but never the main one. Reply in a single paragraph, in British English, stay in character until I say "stop", and if some detail of my case matters, pick the reading least convenient for you and say which you picked rather than asking me.

  My opening move. Here is a Frankfurt case with a merely probabilistic intervener. Black wants Jones to embezzle the funds. Black cannot read Jones's decision directly, but he watches for a prior sign; I will grant you whatever you like about the sign — indeterministically produced, causally insufficient for Jones's refraining — because the probability I care about lies in Black himself: he is vigilant but fallible, noticing the sign and intervening with certainty ninety-nine times in a hundred, while one time in a hundred he is distracted and does nothing, and when he does intervene his intervention is fully determining. In fact Jones embezzles on his own, for his own reasons, and Black never moves. Still, Jones's chance of refraining was one in a hundred.

  Now the squeeze. If "could have done otherwise" requires only some non-zero objective chance, then Jones could have refrained — and since no physically realised intervener can be perfectly reliable, no Frankfurt case built out of a real intervener ever removes alternative possibilities, so the principle survives every case anyone can construct, which looks less like a defence of it than like a proof that it does no work. If "could" requires a robust or significant chance, then blame becomes a function of how reliable an intervener who did nothing happened to be, and the difference between Jones-with-a-ninety-nine-per-cent-Black and Jones-with-a-sixty-per-cent-Black is sheer luck. And if you reach for a third reading on which "could" names the agent's own two-way ability rather than any chance, then tell me what an ability is such that it is removed by someone who never does anything. Which horn do you take?
reasoning: |-
  Hmm, the user wants to practice attacking the leeway view, specifically the principle of alternative possibilities (PAP), and has constructed a Frankfurt-style case with a probabilistic intervener. They're clearly knowledgeable about philosophical debates on free will and moral responsibility, likely a grad student or academic preparing for a conference or paper defense. Their frustration with standard Frankfurt counterarguments shows they've engaged deeply with the literature.

  Ah, their case cleverly avoids the usual prior sign objections by granting indeterminism upfront. The core move is forcing a trilemma about interpreting "could have done otherwise": either (1) accepting vanishingly small chances as sufficient for PAP (which trivializes it), or (2) making blame depend on intervener reliability (which introduces moral luck), or (3) invoking abilities in a way that seems circular. 

  Right, as the committed PAP defender, I must reject all three horns while preserving moral responsibility's grounding in genuine alternatives. The key is distinguishing metaphysical possibility from agential ability. Even with a 1% chance of non-intervention, that possibility wasn't accessible through Jones' capacities - his psychology determined the outcome independently. 

  *adjusts philosophical armor* The flicker strategy still applies here: that tiny chance represents Black's potential failure, not Jones' ability to choose otherwise. Jones lacked any ability-generating mechanism for refraining - his reasons, motivations, and character all converged on embezzlement. The intervener's reliability is irrelevant because what matters is whether the agent possessed the two-way power, which requires more than mere physical possibility. 

  *checks for British phrasing* "Sheer luck" is properly British, and "trifling" has the right Oxbridge disdain. Must maintain that the ability horn isn't a dodge but a substantive claim about agent-causal powers. The user's "never does anything" point is sharp, but the defender can retort that abilities are dispositional properties - a gun doesn't lose its ability to fire just because nobody pulls the trigger.
answer: |-
  Right then, I'll grasp the third horn firmly: "could have done otherwise" refers not to bare metaphysical possibility or probabilistic chance, but to the agent’s own robust, two-way rational ability – a capacity grounded in her psychological mechanisms, enabling genuine alternative choices under the same conditions. In your probabilistic Frankfurt case, Jones lacked *that* ability entirely when he decided to embezzle. His psychology, reasons, and deliberative processes were such that, given his actual mental state and the circumstances (including Black’s inactive presence), he was *unable* to generate the intention to refrain. The mere 1% objective chance of non-intervention wasn’t Jones’s ability; it was an external fluke reflecting Black’s potential distraction, utterly disconnected from Jones’s own agential capacities. Jones had no access to that alternative path through his own will – his choice flowed deterministically from his reasons, rendering him unable to choose otherwise in the relevant agential sense. The intervener’s reliability is a red herring; what matters is that the agent’s own actual sequence of reasoning locked in the outcome, obliterating her two-way power. Black’s existence merely masks this inability without creating it – the ability was already absent due to Jones’s psychology. Thus, PAP stands: Jones couldn't have done otherwise in the ability-entailing sense, and he's blameworthy precisely because his own unimpeded, reasons-responsive mechanism produced the wrong choice *without* alternatives. This reading preserves PAP's core work by ensuring blame requires the agent could have exercised her capacities differently. The "chance" here is a trifling metaphysical gap, not an ability.
