prompt: |-
  I have somehow ended up on the committee that decides which projects in our new "evolution of mind" cluster get the first round of seed money, and I am the only member who is not an evolutionary psychologist — my own work is in developmental methods, so I am the person who is supposed to ask the annoying questions. Every application has the same shape: a human behavior, a story about why it would have paid off for our hunter-gatherer ancestors, and a flourish. Some of them feel like lactase persistence to me — a case where the adaptationist story has really been nailed down — and some feel like Kipling with footnotes. I cannot reliably tell which is which, I do not trust my gut, and I am going to have to defend the ranking to a dean, so before I read another application I want a written standard I can actually apply.

  What I need is a specification: what does an adaptationist hypothesis about a human psychological trait have to deliver to count as a real explanation rather than a just-so story, where "real" is relativized to the purpose — is this worth $40,000 of pilot money and a year of someone's time. Give me the requirements with the case or consideration behind each one: the phenomenon it must explain, the case it must get right, the distinction it must not collapse, the finding it must not contradict. For each requirement, tell me whether it binds any adaptationist explanation as such, or whether it is a preference of one research program dressed up as a methodological demand. My draft list, which I half-suspect is a mix of genuine desiderata and camp prejudice, runs like this: (1) the three ledgers — the story must name the currency it was maximizing and in what units, the timescale over which selection acted, and the selective regime, rather than "fitness" in the abstract; (2) the contrast class — it must say which alternative designs were actually present in the same population and lost, since "it was useful" is otherwise compatible with everything; (3) no phantom preferences — no positing a desire or module whose only evidence is the very behavior it is invoked to explain; (4) the orphan-trait discount — a trait present in exactly one lineage has no comparative leverage, and the hypothesis should be marked down for it; (5) the lag-load constraint — mismatch stories ("stone-age brains in a modern world") have to show that the environment changed faster than the trait could have tracked it by selection; (6) reachability — the design must be reachable from the ancestral design by tinkering, not engineered from scratch; (7) the engineering signature — reliable development, precision, economy, efficiency in the trait, as you would expect of something built for a job; (8) heritability and non-social transmission — cultural transmission must be ruled out; (9) cross-cultural universality; (10) some identifiable genetic basis; (11) novel predictions rather than post hoc fitting of known findings; (12) a stated finding that would kill the hypothesis.

  For each, say keep, revise, or drop, and say why, and add whatever I have missed. Three things I especially want. First: which of these are jointly unsatisfiable — my suspicion is that "generates predictions we can test now," "cites ancestral selection pressures no one can observe," and "uniquely human traits need comparative leverage" cannot all stand together, and if so the interesting output of this exercise is the impossibility result rather than the list. Second: which single requirement does the most exclusionary work, and which one, if I dropped it, would let in the worst offenders. Third: how the list handles the cases that are giving me trouble — morning sickness and food aversions in the first trimester, where pregnancy-protection and mere-byproduct stories are both on offer; the content effect on the Wason selection task, where a specialized cheater-detection device competes with general reasoning plus familiarity; a mate-preference difference that shows up in large cross-cultural surveys but reportedly shrinks in more gender-equal societies; a preference found in Western student samples that reportedly fails to appear in the small-scale societies I have read about; the mirror-image problem, where the same selective story is told for opposite findings (risk-taking shows mating competition, caution shows parental investment); and a byproduct explanation that is offered with exactly the same confidence and exactly as much evidence as the adaptation story it replaces. Any list that also rules out lactase persistence, camouflage, or the peacock's train is too strong, so use those as calibration. One further wrinkle specific to my situation: some hypotheses are fine as science but not cheaply testable, and I need to know whether "checkable within a pilot budget" is a desideratum on the theory or merely a fact about my committee.

  Only after all that, and briefly, score the main contenders against whatever list survives — the massive-modularity program, human behavioral ecology, cultural-evolution and dual-inheritance approaches, and the developmental / niche-construction style of explanation. I care far more about the criteria than the scorecard, so keep the weight on where the requirements come from and what each one is for.
reasoning: |-
  Okay, let me tackle this user's problem. They're on a committee deciding seed funding for projects in an "evolution of mind" cluster. They need a reliable standard to distinguish solid adaptationist hypotheses from just-so stories. Their draft list has 12 criteria, but they're unsure which are valid. I need to evaluate each, add missing ones, address their three special requests, and handle specific trouble cases without ruling out well-established adaptations.

  First, I'll go through their draft criteria one by one. For (1) the three ledgers, it's essential because vague "fitness" claims don't provide testable specifics. Keep it. (2) The contrast class is crucial to avoid "it's useful" explanations—revise to include design alternatives. (3) No phantom preferences prevents circular reasoning; keep. (4) Orphan-trait discount might be too strict since some traits are unique; drop it. (5) Lag-load constraint is necessary for mismatch stories; keep with a revision. (6) Reachability is important but should focus on plausibility, not perfection; revise. (7) Engineering signature is useful but not definitive; keep as supporting evidence. (8) Heritability requirement is too strong; drop since cultural traits can be adaptive. (9) Cross-cultural universality is problematic; drop or revise to expect patterned variation. (10) Genetic basis isn't always necessary; drop. (11) Novel predictions are key for testability; keep. (12) Falsifiability is fundamental; keep.

  Now, missing criteria: I should add comparative evidence (even if limited), developmental plausibility, and specifying adaptive trade-offs. Also, integration with proximate mechanisms and evidence of adaptive design are important.

  For their special requests: The triad of novel predictions, ancestral pressures, and comparative evidence for unique traits is indeed challenging. You can't have all three at once without trade-offs. The most exclusionary criterion is the contrast class—it forces specificity. Dropping falsifiability would let in the worst offenders, like unfalsifiable stories.

  Handling their trouble cases: For morning sickness, compare adaptationist vs. byproduct hypotheses using multiple criteria like engineering signature and novel predictions. Wason task content effect needs testing between specialized module vs. general reasoning. Mate preferences in egalitarian societies should consider environmental calibration. Western findings failing elsewhere highlight the need for universality revisions. Mirror-image problems require clear contrast classes. Byproduct explanations need equal evidence as adaptationist ones.

  Calibration with lactase persistence, camouflage, peacock's tail: The revised list should accept these. Lactase persistence has clear genetics and recent selection, camouflage shows comparative evidence, peacock's tail has sexual selection contrasts.

  Pilot budget constraint: This is practical, not theoretical. The criteria should prioritize testable hypotheses within budget.

  Finally, scoring main contenders: Massive modularity may struggle with contrast classes and reachability. Human behavioral ecology handles trade-offs well but may lack developmental evidence. Cultural evolution accounts for rapid change but needs transmission evidence. Developmental approaches excel in mechanisms but may not specify selective histories.

  In conclusion, the refined criteria should balance theoretical rigor with practical testability, focusing on specificity, testability, and integration of evidence.
answer: |-
  Below is a rigorously revised specification for evaluating adaptationist hypotheses, designed to exclude just-so stories while allowing strong candidates (like lactase persistence or camouflage) to pass. It incorporates your draft list, addresses your core concerns (impossibility triads, exclusionary power, trouble cases), and adds critical missing elements. Requirements are categorized as **Core** (binding for any adaptationist explanation), **Supporting** (empirically valuable but not strictly necessary), or **Contextual** (depends on the hypothesis type).

  ---

  ### **Revised Specification: 10 Requirements**
  *(Keep/Revise/Drop verdicts with rationale)*

  1. **The Three Ledgers** (Keep → **Core**)  
     *Requirement:* Specify the **fitness currency** (e.g., calories saved, offspring survival rate), **timescale** (e.g., Pleistocene, 10k generations), and **selective regime** (e.g., pathogen load, intergroup conflict).  
     *Why:* "Fitness" alone is untestable. Lactase persistence nails this (currency: nutrient absorption; timescale: Neolithic; regime: dairying). Kipling-esque stories fail here.  
     *Binds all adaptationism?* Yes. Without this, hypotheses are unfalsifiable.

  2. **Contrast Class** (Revise → **Core**)  
     *Requirement:* Identify **evolutionarily feasible alternatives** that existed or could arise in the population (e.g., "Why this *over* that?"). Not necessarily "losers," but plausible designs.  
     *Why:* "Usefulness" is vacuous without alternatives. Peacock's train succeeds by contrasting with short-tailed males; mirror-image risk-taking/caution fails without specifying *which conditions* favor each.  
     *Binds all?* Yes. Adaptation implies *differential* success.

  3. **No Phantom Preferences** (Keep → **Core**)  
     *Requirement:* The proposed mechanism (e.g., "cheater-detection module") must have **independent empirical support** beyond the behavior it explains.  
     *Why:* Circularity sinkhole. Wason task content effects need evidence beyond the task itself (e.g., neural dissociations, cross-domain deficits).  
     *Binds all?* Yes. A non-negotiable bulwark against storytelling.

  4. **Orphan-Trait Discount** (Drop)  
     *Why:* Uniquely human traits (e.g., language) can still have strong adaptationist explanations using engineering or fossil evidence. Comparative data is helpful but not essential. Overly restrictive.

  5. **Lag-Load Constraint** (Revise → **Contextual**)  
     *Requirement:* For mismatch hypotheses, demonstrate the **trait’s inertia** (e.g., slow generational turnover) and **environmental change speed** (e.g., industrialization < 10 generations).  
     *Why:* Mismatch requires proof the trait *couldn’t* track change. Keep only for hypotheses invoking "Stone Age brains."  
     *Binds all?* No. Only relevant for modern dysfunctions.

  6. **Reachability** (Revise → **Supporting**)  
     *Requirement:* Show the trait is **plausibly developable** from ancestral precursors via known mechanisms (e.g., gene duplication, heterochrony). Not "perfection," but no zero-to-engineered leaps.  
     *Why:* Rules out biologically impossible transformations. Camouflage passes (e.g., pigment gradients tweaked); "innate grammar" struggles without a proto-form.  
     *Binds all?* No. Engineering plausibility supports but isn’t definitive.

  7. **Engineering Signature** (Keep → **Supporting**)  
     *Requirement:* Evidence of **functional efficiency, precision, or reliability** (e.g., low error rates, energy economy, canalized development).  
     *Why:* Morning sickness succeeds here (precision timing, toxin targeting); byproduct theories (e.g., "pregnancy nausea is spillover from immune activation") lack this specificity.  
     *Binds all?* No. Some adaptations are "quick fixes" (e.g., kludgy tinkering).

  8. **Heritability/Transmission** (Drop)  
     *Why:* Culturally transmitted traits can be adaptations (e.g., Inuit cold-adaptation via clothing/behavior). Requires evidence of *adaptive design*, not innate genes. Fold into #7 and #10.

  9. **Cross-Cultural Universality** (Revise → **Supporting**)  
     *Requirement:* Expect **patterned variation**, not rigidity. If absent in some societies (e.g., Western mate preferences vs. small-scale societies), the hypothesis must explain why (e.g., environmental calibration).  
     *Why:* Rigid universality is unrealistic. Gender equality reducing mate differences fits flexible adaptation; total absence kills weak hypotheses.  
     *Binds all?* No. Plasticity is part of many adaptations.

  10. **Genetic Basis** (Drop)  
      *Why:* Epigenetic, developmental, or cultural mechanisms can underpin adaptations. Lactase persistence works because it *has* a gene; not all need to.

  11. **Novel Predictions** (Keep → **Core**)  
      *Requirement:* Generate **testable, unique predictions** beyond the explained phenomenon.  
      *Why:* The best shield against post-hoc fitting. Peacock’s train predicts male mortality trade-offs; Kipling stories "predict" nothing new.  
      *Binds all?* Yes. Science 101.

  12. **Falsifiability** (Keep → **Core**)  
      *Requirement:* State a **specific, observable finding that would disprove** the hypothesis.  
      *Why:* If nothing can kill it, it’s not science. Lactase persistence fails if the allele predates dairying.  
      *Binds all?* Yes.

  ---

  ### **Added Requirements**
  13. **Comparative Evidence** (Revise → **Supporting**)  
      *Requirement:* Use **phylogenetic neighbors or fossils** where possible (e.g., primate social cognition). If absent (orphan traits), use #6 and #7.  
      *Why:* Camouflage gains power from convergent evolution. But uniquely human traits (e.g., humor) can still pass via other criteria.  
      *Binds all?* No. Essential for non-human traits; supportive for humans.

  14. **Developmental Plausibility** (Add → **Core**)  
      *Requirement:* Show the trait **can reliably develop** under realistic conditions (e.g., not requiring impossible inputs).  
      *Why:* Just-so stories often imply magical maturation (e.g., "innate jealousy module"). Developmental pathways must be feasible.  
      *Binds all?* Yes. Links evolution to ontogeny.

  15. **Trade-off Specification** (Add → **Core**)  
      *Requirement:* Identify **costs/constraints** (e.g., energy, opportunity costs, pleiotropy) that shaped the trait.  
      *Why:* Absence implies "free perfection." Peacock’s train acknowledges predation risk; male risk-taking must trade off with survival.  
      *Binds all?* Yes. Adaptation is optimization, not maximization.

  ---

  ### **Addressing Your Key Requests**
  1. **The Impossibility Triad**  
     *Conflict:* "Novel predictions" + "ancestral pressures" + "comparative evidence for unique traits" *can* coexist, but not cheaply.  
     - *Resolution:* Orphan traits (#4 dropped) avoid the worst tension. Pilot budgets prioritize hypotheses using *extant* evidence (e.g., engineering signatures, developmental paths) over costly ancestral reconstructions. Strong candidates generate testable predictions from minimal comparative data (e.g., using primates for social traits) or leverage archaeology (e.g., diet shifts).

  2. **Most Exclusionary Requirement**  
     - **#2 (Contrast Class)**: Forces specificity. Without it, "it was useful" excuses anything.  
     - **Dropping #12 (Falsifiability)** lets in the worst offenders—unkillable stories.

  3. **Trouble Cases Handled**  
     - **Morning Sickness**: Adaptationist (toxin avoidance) wins on #7 (precision timing), #15 (trade-off: nausea vs. miscarriage), and #11 (predicts aversion peaks when embryo vulnerability peaks). Byproduct story fails #7.  
     - **Wason Task**: Cheater-detection module requires #3 (independent evidence of social contract reasoning) and #11 (predicts content effects *only* for social exchanges). General reasoning + familiarity lacks #7 (no efficiency signature).  
     - **Mate Preferences**: Shrinking in egalitarian societies supports #9 (environmental calibration), killing rigid universality demands.  
     - **Western-Specific "Preferences"**: Fails #9 unless hypothesis explains cultural variation (e.g., as calibration).  
     - **Mirror-Image Problems**: Require #2 (contrast class: "risk-taking *when* X, caution *when* Y") and #15 (trade-offs, e.g., mating effort vs. parental investment).  
     - **Byproduct vs. Adaptation**: Both need equal evidence (#3, #11, #12). Byproducts must show the "real" adaptation (e.g., morning sickness as byproduct requires evidence of the purported immune mechanism).

  4. **Calibration Cases**  
     - Lactase persistence passes #1 (currency: nutrition; timescale: Neolithic), #11 (predicts allele-dairying correlation), #12 (falsified if allele predates farming).  
     - Camouflage passes #7 (efficiency), #13 (convergent evolution), #15 (trade-offs with signaling).  
     - Peacock’s train passes #2 (contrast with shorter tails), #11 (prediction: tail length correlates with parasite load), #15 (survival cost).

  ---

  ### **Pilot Budget Constraint**
  - **"Checkable within budget" is a contextual demand on the *project*, not the theory.** A hypothesis can be strong science but require excavation/paleogenomics. Prioritize projects that:  
    a) Test novel predictions (#11) with existing methods (e.g., behavioral experiments, surveys),  
    b) Leverage available data (e.g., cross-cultural databases, biobanks),  
    c) Focus on tractable subtraits (e.g., one aspect of mate preferences).  
  - *Reject unfalsifiable hypotheses outright; deprioritize expensive-but-valid ones.*

  ---

  ### **Program Scorecard (vs. Core Criteria)**
  | **Research Program**       | **Strengths**                                  | **Weaknesses**                              | **Pilot Suitability**         |
  |----------------------------|-----------------------------------------------|--------------------------------------------|-------------------------------|
  | **Massive Modularity**     | #3 (mechanisms), #7 (efficiency)             | Fails #2 (vague alternatives), #6 (reachability), #14 (development) | Low (neuroscience costly)    |
  | **Human Behavioral Ecology** | #1 (currencies), #2 (trade-offs), #15        | Weak #3 (mechanisms), #14 (development)    | Medium (fieldwork possible)  |
  | **Cultural Evolution**     | #9 (variation), #13 (transmission)           | Struggles #7 (engineering), #11 (predictions) | High (survey/experiment friendly) |
  | **Developmental/Niche**    | #6 (reachability), #14 (ontogeny)            | Weak #1 (selective pressures), #15 (trade-offs) | Medium (longitudinal studies) |

  ---

  ### **Final Checklist for Applications**
  **CORE (Must Pass)**  
  - [ ] Three Ledgers (#1)  
  - [ ] Contrast Class (#2)  
  - [ ] No Phantom Preferences (#3)  
  - [ ] Novel Predictions (#11)  
  - [ ] Falsifiability (#12)  
  - [ ] Developmental Plausibility (#14)  
  - [ ] Trade-off Specification (#15)  

  **SUPPORTING (Weighted Bonus)**  
  - [ ] Engineering Signature (#7)  
  - [ ] Patterned Cross-Cultural Variation (#9)  
  - [ ] Comparative Evidence (#13)  

  **CONTEXTUAL (If Applicable)**  
  - [ ] Lag-Load Constraint (#5) for mismatch claims  

  **REJECT IF**  
  - No testable predictions OR unfalsifiable OR circular mechanism.  
  *Then* rank by feasibility: pilot projects must test at least one novel prediction (#11) within budget.  

  This balances theoretical rigor with practical constraints. Your role is to enforce specificity and testability—let the evolutionists argue about Pleistocene climates if they’ve earned it with falsifiable hypotheses.
