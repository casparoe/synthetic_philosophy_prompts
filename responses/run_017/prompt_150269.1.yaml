answer: |-
  ### Translation and Analysis

  **Claim 1 (Mencius):** Incipient responses (alarm/compassion, shame/aversion, deference/yielding, sense of fit) are universal sprouts of virtue requiring cultivation.  
  *In your terms:* Humans exhibit species-typical developmental potentials for prosocial reactivity. These are canalised, domain-specific sensitivities (e.g., distress detection) that serve as substrates for cooperative phenotypes. Moral development involves niche construction via ritualised social feedback to stabilise these reaction norms.  
  *Status:* Clean.  
  *Loss:* "Virtue" as a telos; Mencius’s moral ontology.  
  *Smuggled in:* "Substrates for cooperative phenotypes" frames traits as *exaptations*, while Mencius implies teleological design.  
  *Diagnosis:* Genuine mismatch—his teleology isn’t empirical.  

  **Claim 2 (Mencius):** Child-at-well response is immediate, not instrumental.  
  *In your terms:* A species-typical adaptive response: rapid, non-calculative aversion to fitness threats (offspring loss). Likely a canalised fear reaction norm, with developmental entrenchment for kin-recognition errors.  
  *Status:* Clean.  
  *Loss:* "Compassion" as morally valenced; Mencius’s anti-utilitarianism.  
  *Smuggled in:* "Fitness threats" implies selective history; Mencius avoids mechanistic explanation.  
  *Diagnosis:* Genuine mismatch—he rejects reduction to consequences.  

  **Claim 3 (Mencius):** Failure results from environmental deprivation, not absence of endowment.  
  *In your terms:* Phenotypic plasticity under selective regimes: moral traits express reliably across typical developmental environments but degrade under perturbation (e.g., resource scarcity). Recovery parallels reaction norm restoration when stressors lift.  
  *Status:* Clean.  
  *Loss:* "Moral endowment" as recoverable *essence*; Mencius’s perfectionism.  
  *Smuggled in:* "Reaction norm" quantifies plasticity; his "sprouts" are qualitative potentials.  
  *Diagnosis:* Genuine mismatch—biology describes processes, not latent virtues.  

  **Claim 4 (Mencius):** Hearts agree on rightness like senses agree on stimuli; sages exemplify universal potential.  
  *In your terms:* Canalised cognitive biases for fairness/coordination, arising from gene-culture coevolution under multilevel selection (within-group alignment vs. between-group conflict). Sages represent optimal developmental outcomes in high-fidelity cultural niches.  
  *Status:* Distorted.  
  *Loss:* "Agreement" as normative consensus; Mencius’s universalism ignores cultural variation.  
  *Smuggled in:* "Multilevel selection" admits conflict; Mencius assumes harmony.  
  *Diagnosis:* Your framework is poorer here—it lacks "perfectionist flourishing" as an endpoint.  

  **Claim 5 (Xunzi):** Nature is desire-driven disorder; artifice (ritual) regulates via external templates.  
  *In your terms:* Species-typical reward-seeking systems, unchecked, create fitness costs (scarcity contention). Ritual is culturally inherited niche construction—social technologies that redistribute resources, modifying selective pressures via gene-culture coevolution.  
  *Status:* Clean.  
  *Loss:* "Disorder" as moral failure; Xunzi’s Hobbesian pessimism.  
  *Smuggled in:* "Niche construction" implies bidirectional causation; Xunzi sees artifice as unidirectional imposition.  
  *Diagnosis:* Genuine mismatch—his "bad" is prescriptive, not a fitness claim.  

  **Claim 6 (Xunzi):** Goodness is accumulated cultural artifice; all can access it via effort.  
  *In your terms:* Cumulative cultural inheritance builds adaptive social structures (e.g., norms). The capacity for social learning is a genetically canalised adaptation; achieving "sagehood" depends on developmental environment (niche quality) and phenotypic plasticity.  
  *Status:* Clean.  
  *Loss:* "Accumulated artifice" as moral progress; Xunzi’s progressivism.  
  *Smuggled in:* "Adaptive" is relativistic; Xunzi assumes rituals are objectively optimal.  
  *Diagnosis:* Genuine mismatch—biology doesn’t judge "goodness".  

  ---

  ### Residue Report  
  1. **"Good/bad"**: Untranslatable. Your framework describes *function* (adaptive consequences), not moral valence. Mencius’s "good" is perfectionist (flourishing *qua* human), Xunzi’s "bad" is prescriptive (unregulated desires breach social order). *Diagnosis:* Genuine mismatch—neither claims empirical universality.  
  2. **Sagehood as telos**: Mencius’s sages realise "flourishing"; Xunzi’s epitomise cultural optimisation. Biology has no counterpart for teleological endpoints. *Diagnosis:* Your framework is poorer here—it lacks Aristotle-like *entelechy*.  
  3. **"Heart’s agreement" (Mencius)**: Assumes universal moral grammar. Biology expects cultural relativity in moral norms. *Diagnosis:* The text is less clear—Mencius conflates prosocial *biases* with consensus on *rightness*.  
  4. **Xunzi’s "artifice extinguishes nothing"**: Implies desire regulation without repression. Biology can map this to feedback systems, but not his moralised "measure". *Diagnosis:* Genuine mismatch—his ideal is normative equilibrium.  

  **Smuggled Assumptions**:  
  - "Adaptive" as proxy for "good" (neither text reduces morality to fitness).  
  - "Canalisation" as "innate" (both philosophers see potentials as dynamic).  
  - "Niche construction" as intentional design (Xunzi’s rituals are deliberate; Mencius’s cultivation is relational).  
  - "Reaction norms" quantify plasticity (texts treat development qualitatively).  

  **Biggest Casualty**: Mencius’s Claim 4 ("hearts agree"). His universalism clashes with cross-cultural variation in moral codes. Biology shows cooperative *mechanisms* are conserved, but their *content* is niche-dependent.  

  **Reverse Translation**:  
  "A human’s *xing* is a canalised potential for social learning and emotional contagion, expressed via genotype-environment interactions. *Wei* (cultivation) occurs through cumulative cultural inheritance within constructed niches. Moral phenotypes are developmentally entrenched reaction norms, optimised by multilevel selection."  
  *Ownership:* Neither. Mencius would reject niche-dependence of virtue *content*; Xunzi would reject that *xing* includes prosocial biases. Yang Xiong’s "mixed nature" aligns best: biology sees *xing* as capacities for both competition and cooperation, with *wei* determining expression.  

  **Collapse Verdict**: Your vocabulary dissolves the dispute. "Good/bad" are reductive labels for complex developmental outcomes. Biology shows *xing* includes tools for both conflict and cooperation; *wei* (via niche construction) shapes which dominates. This dissolution succeeds—it reframes a normative debate as a dynamical system.  

  **One Change**: Add **teleonomy**—goal-directedness arising from adaptive history—to parse Mencius’s "sprouts as directional potentials" without teleology. This bridges "flourishing" and fitness optimisation.  

