prompt: |-
  I help run a tiny informal bouldering group — no club, no insurance, just a group chat and a poll on WhatsApp — and at the start of each season we get everyone to sign one form that basically says "I'm happy with whatever the session leader decides on the day". A mate of mine says that isn't consent at all, it's just a piece of paper, and we've been going round in circles about it for weeks. Around the same time I had a minor medical thing where I signed a form after about a five-minute chat, and I walked out feeling like I'd agreed to something I didn't fully get, but also that refusing would have been a bit silly. So I've ended up trying to work out what a proper account of when consent is actually *valid* would even have to do, and I'd like the spec before I go any further.

  So: write me the desiderata for a theory of valid consent. What does an account have to deliver to count as any good — which cases it has to get right, which distinctions it isn't allowed to collapse, which plain facts about how people actually decide it can't contradict — with the case or consideration behind each requirement? I care about all three of the usual suspects (deception, coercion, competence) but I don't want the answer to just be those three headings with a paragraph each. For every requirement I want a verdict on whether it's non-negotiable or just a thing one camp happens to like; I have a hunch that "consent has to be fully informed about every relevant detail" is a prejudice rather than a genuine requirement, but tell me if I've got that backwards. Please also flag any pair of requirements that look like they can't both be satisfied at once — that's the bit I'm most interested in, because if the list is internally unsatisfiable then that itself is the finding — and say which single requirement does the most work knocking candidate theories out.

  Here are the things that actually got me stuck, and I want the list to handle them rather than dodge them. (1) Blanket or up-front consent to an open-ended future act — my season form, and it feels different in kind from agreeing to a specific thing. (2) Something I've started calling *drift*: what you agreed to and what actually happens come apart over twenty small steps, none of which you'd have objected to on its own, but the end state is one you'd have said no to if it had been described to you at the start. Is drift just deception in slow motion, or is it a problem of its own? I really can't tell. (3) Borrowed consent — going ahead on the say-so of someone else who tells you "she's fine with it". (4) Consent given after the cost of saying no has partly been sunk, e.g. you're halfway through something painful or expensive and you just nod along. (5) Consent from someone who is clearly competent but who you're fairly sure will regret it, where the regret on its own seems like evidence of nothing. And (6) something about what consent has to look like from the outside: as the person organising the group I need to be able to tell, in advance and without reading minds, whether I've got it. Tell me honestly if that last one is a real desideratum or whether I'm smuggling in a legal or evidential worry that doesn't belong on a moral list.

  Assume the theory is meant to be good enough for two jobs at once: working out what I owe people in ordinary life, and deciding when a signed form should change what's permitted — and if those two jobs pull the requirements in different directions, say exactly where. A quick score of the one or two big general pictures of consent against the list is fine at the end if it's short, but the criteria are what I'm after. Write it in British English, and end with a final line beginning "Verdict:" naming the single requirement you'd bet on as doing the most real work.
reasoning: |-
  Okay, the user runs an informal bouldering group and uses a consent form that's essentially a blanket agreement to whatever the session leader decides. Their friend argues it's not real consent. The user also had a personal experience with a medical form where they felt unsure but signed anyway. They want a solid theory of valid consent, including desiderata (requirements) that cover tricky cases like drift, borrowed consent, sunk costs, and future regret. They also need to know if external verification is a legitimate requirement.

  First, I need to outline the core elements of valid consent. The usual suspects are competence, information, voluntariness, and specificity. But the user wants deeper desiderata. Let's list each requirement with justifications, negotiability, and tensions. 

  The user's form is about blanket consent for future acts. They need to know if that's valid or if specificity is necessary. Also, drift is a concern—small changes leading to an outcome the person wouldn't have agreed to initially. Is that deception or a separate issue? Borrowed consent involves third parties, which is tricky. Sunk costs might pressure someone into agreeing. Regret after the fact—does that invalidate consent? And the need for external verification for organizers.

  For each desideratum, I'll consider non-negotiable vs. debatable. For example, is full information non-negotiable? In medical contexts, yes, but for bouldering, maybe not every detail is critical. The user suspects "fully informed" might be a prejudice. I should address that—maybe a baseline of material risks is necessary, but not every detail.

  Tensions between requirements: Specificity vs. practicality. Blanket consent might be practical for the bouldering group, but lacks specificity. Voluntariness vs. sunk costs—if someone is halfway through a procedure, their agreement might be coerced by sunk costs. External verifiability vs. true mental state. You can't read minds, so some external sign is needed, but that might not capture true willingness.

  The user also wants to know which requirement knocks out most theories. Probably specificity, because blanket consent fails if specificity is non-negotiable. But in practice, blanket consent with clear scope might work. Drift could be managed by incremental consent checks. Borrowed consent is invalid without direct confirmation. Sunk costs introduce pressure, possibly undermining voluntariness. Regret doesn't invalidate past consent if it was valid at the time. External verifiability is necessary for practicality but shouldn't override genuine consent.

  Balancing moral and practical aspects: For the bouldering group, a form that specifies material risks and allows withdrawal might suffice. But the current form is too vague. Including key risks and the right to refuse activities could help. Drift can be mitigated by leaders checking in when plans change. Borrowed consent shouldn't be accepted—always get direct agreement. For sunk costs, ensure decisions aren't pressured. Regret is separate.

  The key tension is between specificity and practicality. Blanket consent is practical but might not meet specificity. However, if the scope is clear and material changes require re-consent, it could work. The most crucial requirement knocking out theories is Specificity because many cases hinge on whether the consent matches the actual situation.
answer: |-
  Here’s a rigorous set of desiderata for a theory of valid consent, designed to handle your real-world dilemmas while exposing tensions. Each requirement includes its rationale, negotiability status, and practical implications. The list prioritises moral robustness over legal formality but acknowledges where practical enforcement matters.

  ### **Core Desiderata (Non-Negotiable)**
  1. **Voluntariness Baseline**  
     *Requirement:* Consent must be free from coercion, undue pressure, or exploitation (e.g., threats, blackmail).  
     *Case:* Your medical form – signing because "refusing would be silly" hints at social pressure, but likely not coercive. Sunk-cost scenarios (e.g., halfway through dental work) become invalid if pressure crosses into manipulation.  
     *Non-Negotiable?* **Yes.** Coercion voids consent categorically.  
     *Tension:* Distinguishing "undue pressure" from ordinary inconvenience (e.g., bad weather on climb day) is context-dependent.

  2. **Minimal Competence Threshold**  
     *Requirement:* The consenter must grasp the *nature* of the act and its *material risks*. Competence is task-specific – a dementia patient might consent to tea but not surgery.  
     *Case:* Your bouldering group – assumes adults understand physical risks. "Borrowed consent" fails here unless the proxy has explicit authority (e.g., parental rights).  
     *Non-Negotiable?* **Yes.** Consent without comprehension is a nullity.  
     *Knockout Power:* High. Invalidate theories that allow consent from the profoundly misinformed or incapacitated.

  3. **Intentionality**  
     *Requirement:* Consent must reflect a deliberate choice (not a reflex, misunderstanding, or joke).  
     *Case:* Nodding mid-procedure due to exhaustion – if not a conscious "yes," it fails.  
     *Non-Negotiable?* **Yes.** Accidental "consent" isn’t consent.  
     *External Check:* Requires observable affirmative acts (verbal/written "yes," unambiguous gesture).

  ### **Contested but Critical Desiderata (Negotiable Scope)**
  4. **Specificity Fidelity**  
     *Requirement:* Consent must align with what actually occurs. Significant deviations invalidate it.  
     *Case:* **Blanket consent** (your season form) – valid *only* if scope is clear ("session leader decides warm-ups") and excludes material changes ("we’re free-soloing now!"). **Drift** is a failure here: 20 minor changes leading to an unacceptable outcome breaches specificity.  
     *Non-Negotiable?* **Partially.** Core act must match; minor variations tolerated. Your form likely fails if "whatever the leader decides" includes unrevealed high-risk moves.  
     *Tension with Practicality:* Demands granularity vs. administrative ease.  
     *Verdict on "Fully Informed":* Prejudice. Only *material* risks (e.g., "this climb has 3X injury rate") need disclosure – not every detail.

  5. **Revocability**  
     *Requirement:* Consent must be retractable at any point without penalty.  
     *Case:* Sunk-cost dilemmas – consent mid-process is valid only if refusal remains cost-free (e.g., stopping dental work without extra charge).  
     *Non-Negotiable?* **Morally yes, practically limited.** Penalizing revocation coerces continuance.  
     *External Check:* Must design exit ramps (e.g., "opt-out anytime" policy).

  ### **Contextual Desiderata (Morally Weighted)**
  6. **Non-Regret Condition**  
     *Requirement:* Regret ≠ invalidity. Consent is judged at *t1* (decision time), not *t2* (post-regret).  
     *Case:* Competent adult tries heroin, regrets it – still valid consent if voluntary/informed initially.  
     *Non-Negotiable?* **No.** Protecting autonomy sometimes means allowing mistakes.  
     *Tension with Paternalism:* Over-emphasis enables recklessness; under-emphasis insults agency.

  7. **External Verifiability**  
     *Requirement:* Consent must be legible to others via reasonable evidence (speech, writing, gesture).  
     *Case:* Your bouldering group – you need proof without mind-reading. "Borrowed consent" fails unless verifiable (e.g., WhatsApp confirmation *from her*).  
     *Non-Negotiable?* **For social coordination, yes.** Moral theories ignoring this are useless for group organisers.  
     *Tension with Authenticity:* A coerced "yes" satisfies verifiability but fails voluntariness.

  ### **Irreconcilable Tensions**
  - **Specificity vs. Practicality:** Blanket consent is administratively essential but risks violating specificity when plans drift.  
    *Resolution:* Limit blanket consent to *predictable* scenarios with clear boundaries (e.g., "variations within V3-V5 grades") + revocation right.  
  - **Verifiability vs. Voluntariness:** A signed form proves consent externally but hides coercion.  
    *Resolution:* Combine verifiable acts (signing) with environment design (no pressure culture, easy opt-out).

  ### **Application to Your Cases**
  1. **Blanket Consent:** Likely **invalid** under rigorous specificity. Improve by: listing material risks (e.g., "may include bouldering up to 6m"), excluding major changes (e.g., roped climbing), and adding "consent revocable mid-session."  
  2. **Drift:** A **specificity failure**, not deception. Mitigate with incremental re-confirmation at decision points (e.g., "changing location – still OK?").  
  3. **Borrowed Consent:** **Invalid** unless the person directly verifies (e.g., forwarding their own message).  
  4. **Sunk-Cost Consent:** **Conditionally valid** only if refusal carries no penalty (e.g., stopping without financial/ social cost).  
  5. **Regretted Consent:** **Valid** if competent/voluntary at decision time.  
  6. **External Verifiability:** **Essential** for your role – not a legal smuggler, but a social necessity.

  ### **Quick Score of Consent Theories**
  - **Autonomy Maximalism** (consent = any uncoerced "yes"): Fails specificity (drift), verifiability.  
  - **Legal-Compliance Model** (consent = signed forms): Fails voluntariness, competence.  
  - **Relational Models** (consent = ongoing dialogue): Handles drift/regret well but struggles with verifiability/practicality.  
  - **Hybrid Theory Winner:** **Material Risk + Revocability** – requires disclosure of significant dangers, affirmative agreement, and easy exit. Balances morality and pragmatism best for your cases.

  **Verdict:** **Specificity Fidelity** does the most work – it knocks out over-broad theories, forces clarity on drift/blanket consent, and anchors real-world accountability. Without it, consent becomes a rubber stamp.
