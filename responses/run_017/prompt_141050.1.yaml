prompt: |-
  Hey — I've got a fifty-minute tutorial on Tuesday, first-years, intro metaphysics, and the topic is endurantism vs perdurantism. I've run it twice and both times it died the same death: everyone walks out able to say "perdurantism is the worm view" and nobody can say what would make anyone *reject* it. So don't explain the debate to me, I know it — plan the session. What has to be on the board before either view is even statable, and in what order (what depends on what)? They'll have had one lecture already and the handout defines perdurantism as "objects are four-dimensional," which I think has done damage before I even start — how much of the hour do I spend undoing that?

  I want one example carrying the whole thing. I've been using a pencil sharpened down to a nub: intrinsic change, most of the original matter gone, no persons involved. Say what it's missing and whether to swap it. I keep being tempted by a sourdough starter kept alive for decades and fed daily — none of the original flour left, still "the same starter" — but I suspect that's doing something different (lineage, or fission) and would just muddy things; tell me if I'm right and why, and whether it's usable later as a case the view has to handle rather than as the lead.

  Misconceptions, and where in the sequence to head each off. The one that actually worries me: they'll define "wholly present" as "all of its parts exist at that time," which both sides can happily accept, and the distinction quietly collapses — where do I stop that, and what do I put in its place? Then: they'll take temporal parts to be instanteous slices, like film frames. Half of them code, and I'd like to use a version-control analogy (a file whose history is a chain of commits), but I'm worried it builds in exactly that mistake — use it, place it somewhere specific, or drop it? Also "perdurantism means nothing really changes" and "that's just the block universe" — I want them to see those as extra commitments, not the view. And at some point a student will say "so there are hundreds of pencils in this room" and I never know whether to treat that as an objection or as the view itself.

  What do I openly refuse to get into and say so out loud (I'm guessing the argument from special relativity and stage theory, but you tell me)? And give me one question for the last five minutes they can't pass by repeating "wholly present" at me — ideally one where the two views have to disagree about a sentence rather than about a picture.
reasoning: |-
  Okay, let's tackle this tutorial plan. The user is teaching intro metaphysics to first-years, focusing on endurantism vs perdurantism. They've struggled with students only remembering slogans like "perdurantism is the worm view" without understanding the underlying reasons for rejecting it. 

  First, I need to identify the core issue: students aren't grasping what's at stake in the debate. The handout defining perdurantism as "objects are four-dimensional" might be oversimplifying and causing confusion. The user wants to avoid this trap by building the necessary conceptual scaffolding before introducing either view.

  For the sequence, I'll start with the problem of change - specifically Leibniz's Law. The pencil example seems solid: intrinsic change over time while remaining "the same" object. The sourdough starter might introduce identity-through-replacement concepts that could distract from the core metaphysical issue, so I'll suggest saving it for later application.

  Key misconceptions to address:
  - "Wholly present" can't mean "all parts exist at that time" - that definition collapses the distinction. Need to emphasize qualitative presence instead.
  - Temporal parts aren't necessarily instantaneous - they can have duration. The version-control analogy could work if framed carefully as having temporal depth.
  - Perdurantism doesn't entail that "nothing changes" - it just explains change differently.
  - The "hundreds of pencils" comment is actually correct perdurantist ontology - should affirm that as a feature, not a bug.

  For the session flow:
  1) Establish Leibniz's Law problem (15 mins)
  2) Build the "wholly present" concept properly (10 mins)
  3) Introduce endurantism as solution A (10 mins)
  4) Introduce perdurantism as solution B (10 mins)
  5) Controversy-spotting exercise to show real disagreement (10 mins)

  Should explicitly bracket special relativity and stage theory to avoid scope creep. The closing question should force them to choose between views on a concrete case - perhaps whether "the pencil was once unsharpened" is true or false under each theory.

  The key is making the tension palpable before offering solutions. If they feel why change is philosophically problematic, the views become meaningful responses rather than just labels.
answer: |-
  Here's a battle-tested 50-minute plan focused on **building tension first**, making the rejection grounds explicit, and preempting misconceptions. The pencil example stays central – sourdough is saved for later as a challenge case.

  **Core Goal:** Students must see the **tension between Leibniz's Law and genuine change** *before* meeting the solutions. The views are *responses to a problem*.

  **Board Sequence & Timing (Crucial Dependencies):**

  1.  **The Problem: Change & Identity (15 mins)**
      *   **Write:** `Pencil A (t1): Unsharpened, 15cm long. Pencil A (t2): Sharpened, 10cm long.`
      *   **Question:** "Is the pencil at t2 *the same object* as the pencil at t1? (We say 'yes' in ordinary talk.)"
      *   **Write:** `Leibniz's Law (LL): If x = y, then x and y have all the same properties.`
      *   **Conflict:** "Uh oh. At t1, Pencil has property F (being unsharpened). At t2, it has property G (being sharpened). If it's the *same* pencil at both times (x=y), then by LL, it must have both F and G at *all* times it exists. But it doesn't! Contradiction? How do we resolve this?"
      *   **Key Point:** This *is* the problem. Any solution must explain how one thing can change intrinsic properties without violating LL. *This is why we need fancy metaphysics.*
      *   **Undoing "4D objects" damage:** Explicitly say: "Saying 'objects are 4D' doesn't *solve* this yet. It just names a possible answer. We need to see *how* it solves this problem and what price it pays."

  2.  **The Crucial Concept: "Wholly Present" (10 mins) - KILL THE MISCONCEPTION NOW!**
      *   **MISCONCEPTION HEAD-OFF:** "You might think 'wholly present at t' just means 'all its parts exist at t'. But wait! *Both* sides agree that for a perduring object, its *temporal part* at t exists at t, and for an enduring object, *it* exists at t. That definition doesn't distinguish them!"
      *   **Build Positive Concept:** "Think of a ghost. If a ghost is 'wholly present' in the room, the *entire ghost* is here *right now*, spookiness and all. It's not that only its 'head part' is here while its 'foot part' is in the hallway. **Wholly Present = The entire object, with all its properties (at that time), is located *at* that time.** It's not 'stretched out' across time; it's fully 'here' now *as itself*."
      *   **Board:** `Wholly Present (WP) at t: The entire object, with all its properties-at-t, exists *at* t (not just a part of it).`
      *   **Connect to Problem:** "The challenge is: How can the *whole* pencil be at t1 (unsharpened) and the *whole* pencil be at t2 (sharpened) without violating LL?"

  3.  **Introduce Endurantism (Solution A - Keep WP) (8 mins)**
      *   **Board:** `Endurantism: Objects persist by being WHOLY PRESENT at each moment of their existence.`
      *   **Pencil:** "The *entire* pencil exists at t1, unsharpened. The *entire* (same!) pencil exists at t2, sharpened."
      *   **How it "solves" LL:** "LL applies to objects *at a time*. At t1, the pencil has property F (unsharpened). At t2, the *same* pencil has property G (sharpened). LL isn't violated because we're not comparing the pencil-at-t1 to the pencil-at-t2 *as if they were two things existing at the same time*. We're talking about one thing having different properties *at different times*. Change is the object gaining/losing properties over time."
      *   **Why Reject Perdurantism (Implicitly):** "Perdurantism says objects *aren't* wholly present at times. Endurantists think that means objects don't *really* undergo change at a time – only their temporal parts do. They think perdurantism loses the 'one thing changing' intuition." (Planting the rejection seed).

  4.  **Introduce Perdurantism (Solution B - Sacrifice WP) (10 mins)**
      *   **Board:** `Perdurantism: Objects persist by having different TEMPORAL PARTS at different times. They are 4D wholes "spread out" in time.`
      *   **Temporal Parts - KILL THE SLICE MISCONCEPTION:**
          *   "A temporal part isn't necessarily an instantaneous slice (like a film frame). Think of a chapter in a book. The 'Monday chapter' of the pencil's life lasts several hours. It has temporal extension."
          *   **Version-Control Analogy (Use Here!):** "Think of a file `pencil.txt`. Its entire history is the 4D object. `Commit t1` is the temporal part at t1 (unsharpened). `Commit t2` is the temporal part at t2 (sharpened). The *whole file* (`pencil.txt`) includes *all* commits. You never see the whole file at once in your editor; you only see one commit (temporal part) at a time. The `diff` between commits *is* the change." **Emphasize:** "The commits *are* parts of the whole file's history. The whole file isn't present in any single commit."
      *   **Pencil:** "The perduring pencil is the whole 4D 'worm'. Its t1-temporal-part is unsharpened. Its t2-temporal-part is sharpened."
      *   **How it "solves" LL:** "LL applies to objects *simpliciter*. The *whole* 4D pencil has the property *having-an-unsharpened-t1-part* and *having-a-sharpened-t2-part*. These aren't contradictory! The *temporal parts* have the incompatible properties (F at t1-part, G at t2-part), but they are *different* parts of the whole. Change is variation between temporal parts."
      *   **"Hundreds of Pencils" MISCONCEPTION:** "If a student says 'So there are hundreds of pencils in this room!' (meaning temporal parts), say: **'YES! That's EXACTLY what perdurantism says!** There is one 4D pencil-worm, but it has many temporal-parts, each of which is a shorter-lived 'pencil-stage'. Calling the temporal part 'a pencil' is like calling a chapter 'the book'. It's a way of speaking, but strictly, the whole 4D worm is the persisting object.'" (Affirm it's the view, not an objection).
      *   **"Nothing Changes" / "Block Universe" MISCONCEPTION:** "Does perdurantism mean nothing changes? NO! Change is real variation *between* temporal parts. Does it require a block universe? NO! Perdurantism is about *how objects persist* within a theory of time. You can be a perdurantist with a dynamic or static theory of time. It's an extra commitment." (State this clearly).

  5.  **Controversy Spotting & Sourdough Challenge (5 mins)**
      *   **Board:** `Key Disagreement: Is the object itself WHOLLY PRESENT at each time it exists?`
      *   **Why Reject Perdurantism?** "Endurantists reject it because they think: (1) It denies genuine change *in* the object (only parts change), (2) It doesn't capture our intuition that the *very same thing* is here now and was here yesterday (only a part is here now), (3) It multiplies objects (temporal parts) strangely."
      *   **Why Reject Endurantism?** "Perdurantists reject it because they think: (1) It violates LL unless you weaken LL massively (tensing properties is messy), (2) It can't handle cases of fission/fusion easily, (3) It struggles with material constitution (Ship of Theseus)."
      *   **Sourdough Starter (Use Now!):** "Consider 'Bub', a sourdough starter maintained for 100 years. None of the original flour/molecules remain. Is Bub today the *same object* as Bub 100 years ago?
          *   Endurantist: This is VERY hard! If the *whole* Bub must be present at each time, but its matter completely changes... how? Maybe via immanent causation? It's a major challenge.
          *   Perdurantist: Easier! Bub is a 4D worm. Its temporal parts are linked by causal continuity (feeding). The change in matter is just variation between temporal parts. This is a point *for* perdurantism." (Shows a case where one view has an advantage).

  6.  **Closer: The Forced-Choice Question (Last 2 mins)**
      > **"True or False: The pencil that exists right now (in my hand) *was* unsharpened yesterday."**
      *   **Endurantist:** MUST say **True**. The *very same object* that is here now (wholly present) *is* the object that existed yesterday (wholly present then) and had the property of being unsharpened then.
      *   **Perdurantist:** MUST say **False**. *The object* that exists right now is the entire 4D worm. It has the property *having-an-unsharpened-temporal-part-yesterday*, but it *itself* (the whole worm) wasn't unsharpened yesterday; only its yesterday-part was. The temporal part in your hand now *is* sharpened, and it *did not exist* yesterday (only an earlier part did). The thing in your hand *now* (the current temporal part) wasn't around yesterday to *be* unsharpened. (They might say "The pencil *we refer to* was unsharpened" – push them on what "the pencil" refers to strictly: the worm or the stage? They must say the worm has the historical property).

  **What to Explicitly Refuse (Say This Upfront):**
  *   "We are **bracketing Special Relativity**. We're assuming a single, universal 'now' for simplicity, even if physics challenges that. This debate arises even in classical time."
  *   "We are **ignoring Stage Theory** today. We're comparing Endurantism with *Worm-Theory* Perdurantism only. Stage Theory is a different perdurantist variant."
  *   "We are **not settling material constitution** (lump of clay vs statue). Focus on the pencil and persistence through its *own* changes."

  **Why This Works:**
  1.  **Problem-First:** The LL tension is visceral. They see *why* we need these views.
  2.  **"Wholly Present" Defined Right:** The ghost analogy and positive definition prevent collapse.
  3.  **Rejection Grounds Built-In:** When introducing each view, immediately state what the *other* side thinks is wrong with it.
  4.  **Misconceptions Preempted:** Temporal parts = chapters (not frames), "Hundreds of pencils" = YES (it's the view), Change/Block Universe = separated.
  5.  **Sourdough Used Wisely:** Shows a *motivation* for perdurantism *after* the core is clear, not muddying the lead.
  6.  **The Closing Question:** Forces them beyond slogans. The disagreement about the truth of a *sentence* is stark and reveals the core ontological difference (what is the object *now*?).

  **Tone:** Be energetic about the puzzle. Frame the views as desperate solutions to a real problem. "Endurantists bite *this* bullet, Perdurantists bite *that* bullet. Which bullet tastes less bad?" This makes rejection reasons intuitive. Good luck!
