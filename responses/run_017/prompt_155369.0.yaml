answer: |-
  ## Project Proposal: Evidential Cooperation Under Population Uncertainty - Mirroring vs. Signaling Mechanisms

  **1. Core Question & Distinction:** Does evidential decision theory (EDT) robustly recommend cooperation in large-population scenarios resembling real-world problems like voting or collective action, given uncertainty about agent similarity? Specifically, does the mechanism generating the correlation between an agent's act and others' acts (mirroring vs. signaling) critically impact the robustness and scale-dependence of EDT's cooperative recommendation?

  *   **Precise Definition (Mirror vs. Signal Mechanism):** Consider a population of `N` agents facing a symmetric interaction (e.g., generalized Prisoner's Dilemma). Agents share a common prior over a set of possible "types" `Θ` (e.g., cooperative disposition, reasoning algorithm). Each type `θ` maps to a deterministic policy `π_θ` specifying an act (Cooperate/Defect) for the agent.
      *   **Mirror Mechanism:** The agent is uncertain *which position in the population she occupies* (e.g., she might be any of the `N` agents). All agents share the *same* type `θ` (unknown to the agent) and thus the same policy `π_θ`. Her own act `A_i` is determined by `π_θ`. Conditioning on `A_i` directly reveals `π_θ`, perfectly predicting all other agents' acts (`A_j = A_i` for all `j`). Identity uncertainty induces policy certainty upon self-observation.
      *   **Signal Mechanism:** The agent knows her unique identity `i`. The types `θ_i` of agents are drawn from a joint prior distribution exhibiting *positive correlation* `ρ` (0 < `ρ` ≤ 1), but are not necessarily identical. The agent is uncertain about her *own* type `θ_i` and thus her own policy. Her act `A_i` is a (potentially noisy) signal about `θ_i`. Conditioning on `A_i` provides a noisy signal about her type, which, due to type correlation `ρ`, provides a (weaker) signal about others' types `θ_j` and thus their likely acts `A_j`. Type uncertainty persists even after self-observation.
  *   **Determinate Question:** For a fixed type correlation `ρ` and a symmetric cooperative dilemma payoff structure, how does the expected utility gain from cooperating (vs. defecting) under EDT, computed *after* conditioning on the agent's own act (and potentially observable deliberation states), scale with population size `N` under the Mirror Mechanism versus the Signal Mechanism? Does the EDT recommendation for cooperation decay significantly with `N` under the Signal Mechanism (`lim_{N→∞} EU(C|C) - EU(D|D) ≈ 0`), while remaining constant under the Mirror Mechanism?

  **2. Gap in Existing Discourse:** The current debate surrounding EDT and cooperation suffers from a conflation of these mechanisms, obscuring the population-scale sensitivity.

  *   **Pro-EDT Arguments:** Typically rely on *Mirror-like* scenarios: two-agent clones (`N=2`, `ρ=1` effectively) or perfect correlation. Here, conditioning on `C` provides overwhelming evidence the other cooperates, making cooperation compelling. These arguments implicitly assume the Mirror Mechanism scales perfectly, obscuring potential Signal Mechanism fragility.
  *   **Anti-EDT Arguments:** Often attack the *legitimacy* of self-conditioning itself ("Why does my choosing C *cause* the other to choose C?"), or rely on Newcomb-like problems or scenarios with pre-fixed acts, which bypass the core mechanisms of unfolding deliberation and uncertainty central here. They fail to engage with the *specific structural difference* between Mirroring and Signaling and its consequences for population size.
  *   **The Open Question:** Neither side adequately addresses whether the robust cooperation seen in the highly correlated, small-`N` (often Mirror-like) cases *persists* in large-`N` scenarios where the Signal Mechanism dominates, characterized by weaker individual signals about a shared latent variable (type) and residual type uncertainty after self-observation.

  **3. Methodology & Minimal Formal Model:**

  *   **Core Model:** A Bayesian game-theoretic framework with `N` agents.
      *   **States/Types:** A common prior `P(θ_1, θ_2, ..., θ_N)` with a covariance structure parameterized by `ρ` (correlation coefficient between any `θ_i`, `θ_j`). Types `θ_i ∈ Θ` (e.g., real-valued cooperative bias).
      *   **Policies:** Each type `θ_i` deterministically maps to an act `A_i` via `π(θ_i)` (e.g., `A_i = C` if `θ_i > threshold`).
      *   **Agent Information & Conditioning:** The focal agent `i`:
          *   (Mirror): Knows she is one of `N` positions; prior uncertainty only over the *single* shared `θ`. Observes her intended `A_i`, revealing `θ` perfectly.
          *   (Signal): Knows her identity `i`; prior uncertainty over the vector `θ`. Observes her intended `A_i`. Updates belief over her `θ_i` (using `P(A_i | θ_i)`), then over others' `θ_j` (using correlation `ρ`), then over their acts `A_j` (using `π`).
      *   **Deliberation Observability (Extension):** Introduce `k` deliberation steps observable to the agent *before* final commitment. Each step provides a noisy signal `S_t` about `θ_i`. Model `P(S_t | θ_i)`. The agent conditions sequentially on `S_1, ..., S_k, A_i` when calculating `EU`. Parameter `k` controls how much evidence accumulates *before* the final act choice is known.
      *   **Payoffs:** Symmetric payoffs depending on the agent's act and the *number* (or proportion) of others cooperating (e.g., linear public goods game payoff: `B * (#Cooperators/N) - C` if agent cooperates, `B * (#Cooperators/N)` if defects).
  *   **Defense of the Model:**
      *   **Against Purely Informal Treatment:** The hypothesized decay effect (`1/N` signal strength) is inherently quantitative and probabilistic. An informal argument cannot rigorously establish the rate of decay or its dependence on `ρ` and `k`.
      *   **Against Pure Simulation:** While simulation will be used for complex cases, starting with an analytical (or semi-analytical) model for simple priors (e.g., multivariate normal types) is crucial. It provides general insights, clarifies functional dependencies (e.g., `EU_gain ∝ 1/(σ^2 * N)` under Signal?), and avoids the opacity of black-box simulations. Simulation will validate analytical insights and explore non-Gaussian priors or complex `π`.
      *   **Minimalism:** Focusing on symmetric interactions, a single latent type dimension, and a common prior isolates the core mechanisms (Mirror/Signal) and parameters (`N`, `ρ`, `k`) without unnecessary complexity. More complex models (multiple types, heterogeneous priors, learning) are valuable future steps but beyond this project's scope.
  *   **Monthly Breakdown:**
      *   **Months 1-2:** **Model Formalization & Baseline Cases.** Rigorously define the Bayesian update rules for both mechanisms. Derive analytical expressions for `EU(C|C) - EU(D|D)` under Mirror and under Signal for `N=2` and large `N` limit, assuming simple priors (e.g., `Θ = {Coop, Defect}`, known correlation `ρ`; or Gaussian types with known mean/variance/covariance `ρ`).
      *   **Months 3-4:** **Signal Mechanism Analysis.** Focus on large `N` Signal case. Analyze how `EU_gain` scales with `N` for fixed `ρ` (<1). Quantify the signal strength of one's own act. Explore sensitivity to prior variance and correlation strength `ρ`. Begin simple simulations to confirm analytical predictions where tractability breaks down.
      *   **Months 5-6:** **Incorporating Deliberation (`k`) and Robustness.** Extend the Signal model to include `k > 0` observable deliberation steps. Analyze how accumulating evidence *before* knowing `A_i` affects the probative value of finally choosing `C`. Does early strong evidence of cooperativeness diminish the *additional* evidence provided by the final act, mitigating decay? Test model robustness to different priors and policy functions `π(θ)` via simulation.
      *   **Months 7-8:** **Comparison, Counterarguments & Synthesis.** Systematically compare scaling results under Mirror vs. Signal. Formalize how standard small-`N`/high-`ρ` arguments map onto Mirror vs. Signal. Address potential counterarguments (e.g., "But agents *should* know their type!" – model this as high prior certainty; "What about equilibrium selection?" – focus on the evidential calculation *given* the agent's uncertainty). Refine the conceptual distinction based on model results.
      *   **Month 9:** **Writing & Dissemination.** Synthesize findings into fellowship report/publication draft. Clearly articulate implications for EDT's applicability to large-scale cooperation problems.

  **4. Possible Conclusions & Deciding Factors:**

  *   **Confirmation of Decay (Project's Guiding Hypothesis):** `EU_gain` under Signal decays as ~`1/N` (or similar) for fixed `ρ` < 1, while remaining constant under Mirror. Factors: Mathematical derivation showing posterior variance/uncertainty about others' acts scales inversely with `N` under Signal but not Mirror. Simulation confirmation across parameter ranges.
  *   **Mitigated Decay:** Decay under Signal is slower than `1/N` (e.g., `1/sqrt(N)`) or is negligible for plausible `ρ` and `k>0` values. Factors: Analysis showing that even weak type correlation `ρ` or significant deliberation evidence (`k`) provides sufficiently strong signals to sustain cooperation in large populations relevant to human-scale problems (e.g., `N` in thousands, not millions).
  *   **Threshold Effects:** Cooperation remains viable under Signal if `ρ` is above a critical threshold dependent on `N` and payoffs. Factors: Derivation of a critical `ρ_c(N)` below which EDT no longer recommends cooperation. Analysis of how `k` lowers `ρ_c`.
  *   **Mechanism Collapse:** The distinction proves less fundamental than hypothesized (e.g., Mirror emerges as a limit of Signal as `ρ→1` and prior variance →0, but intermediate cases behave similarly). Factors: Analysis showing smooth transitions between mechanisms or similar scaling properties across the `ρ` spectrum.
  *   **Deciding Factors:** The mathematical relationship between `EU_gain`, `N`, `ρ`, and `k` derived in the model; the sensitivity of this relationship to the prior distribution and policy function; the strength of evidence required to make cooperation EDT-optimal given payoff structures.

  **5. Success, Failure, and Scope Management:**

  *   **Success:** A rigorous formal distinction between Mirror and Signal mechanisms; definitive analytical and/or simulation results characterizing how EDT's cooperative recommendation under each mechanism scales with population size and depends on correlation strength and deliberation observability; a clear assessment of the implications for EDT's application to large-scale real-world problems.
  *   **Failure Conditions:**
      *   **Conceptual Collapse:** The Mirror/Signal distinction proves impossible to formalize cleanly or fails to capture meaningfully different behaviors in the model.
      *   **Intractability:** The Bayesian updating under plausible priors/correlation structures for large `N` proves analytically intractable and too computationally expensive to simulate meaningfully within the timeframe.
      *   **Ambiguous Results:** The scaling behavior is highly sensitive to hard-to-justify model assumptions (e.g., specific prior shape), yielding no clear generalizable conclusion.
      *   **Triviality:** The decay effect under Signal is found to be either overwhelmingly strong (making large-scale EDT cooperation implausible) or trivially weak (negligible for any realistic `N`), rendering the project less impactful.
  *   **Scope Management for 9 Months:**
      *   **Focus:** Prioritize comparing scaling under the *pure* Mirror vs. *pure* Signal mechanisms (`ρ=1` vs. `ρ<1`). Deliberation (`k`) is a crucial but secondary extension.
      *   **Limit Complexity:** Stick to symmetric interactions, one-dimensional types, common priors, and deterministic policies. Avoid complex learning dynamics, multiple equilibria, or heterogeneous agents initially.
      *   **Analytics First:** Focus on deriving results for analytically tractable cases (even if idealized) before extensive simulation. Use simulation to *check* and *extend*, not replace, analytical understanding.
      *   **Define Core Deliverable:** The primary output is a clear understanding of `d(EU_gain)/dN` under Mirror vs. Signal. If results for `k>0` are incomplete, they become future work.
      *   **Honest Assessment Point:** Month 4. If the core Signal scaling analysis proves intractable or yields only weak/ambiguous results despite best efforts, the project will pivot to thoroughly documenting this outcome and its implications for modeling EDT in large populations.

  This project offers a necessary clarification in the debate over evidential cooperation, moving beyond the stylized small-world clones to assess EDT's prospects in the large, uncertain worlds where pressing collective action problems reside. By rigorously dissecting the mechanisms linking self-conditioning to expectations about others, it promises to reshape our understanding of when, and why, EDT might deliver cooperative recommendations.
