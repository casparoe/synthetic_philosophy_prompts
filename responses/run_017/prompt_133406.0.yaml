prompt: |-
  I teach an upper-level undergraduate seminar on contemporary moral philosophy, and I am writing this year's final. Last time I set a question on the aggregation objection to Scanlon's contractualism and got back a pile of papers that did the same three things: restated the formula of reasonable rejectability, recited the familiar case of the technician who is injured so that a large audience can watch a broadcast, and concluded that contractualism cannot add up complaints and therefore cannot make sense of numbers. I want this year's question to make that answer worthless. What I am after is a question that forces students to notice that the individualist restriction — no summing of complaints across different people — is not yet a decision procedure, because before any comparison can be made the framework has to settle two further things: the temporal and institutional grain at which candidate principles are individuated, and the permitted content of an individual's complaint, in particular whether that content may include other-regarding components whose magnitude varies with how many other people are affected. My suspicion is that the aggregation problem does not vanish once these are fixed but rather changes shape, and I want the question to make students say how. Assume they know the framework; I do not want marks available for restating it, and I do not want citations or scholarly apparatus of any kind, since I am testing argument and not reading.

  The case I want the question built around is this. Twelve towns share a regional grid, and for twelve weeks of summer the operator must shed load. Two standing policies are available. Under the Rota policy, one town is disconnected for a full week at a time and the towns take turns, so that over the summer each town has exactly one turn; because the week is announced in advance and each town hosts a cold store and a small data centre, a town can plan around it by hiring generators, moving perishable stock and taking the shutdown as its annual maintenance week, so that the cost to a town of its single turn is about five units of burden. Under the Dimming policy, every town loses one randomly timed hour of power every day: an unannounced hour a day cannot be planned around, and the eighty-four interruptions over the summer carry restart and spoilage costs that come to about twelve units per town, or one unit per town per week. So at the grain of a single week the Rota imposes five units on one town and nothing on the other eleven, while Dimming imposes one unit on each of the twelve; but at the grain of the whole summer the Rota imposes five units on each town while Dimming imposes twelve on each. The policy that looks worse for whoever is singled out at any given moment is better for every single town across the period the policy governs. Part (a) of the question should press on what follows: whether this is an aggregation problem at all, whether a fine-grained principle of the form at each occasion of choice, spare the many by minimising the largest individual complaint is a genuine candidate principle that contractualism must take seriously (it is, after all, general), what such a principle would rule out if it were accepted — ordinary turn-taking arrangements, rotas, standing schemes that concentrate a burden on one party at a time in order to spare everyone — and whether the coarse-grained alternative, comparing each town's total burden across the summer, is available to contractualism without violating the individualist restriction at all, since nothing is summed across persons. Part (b) should then remove the temporal escape route and attack from the other side: take the one-off version of the case, with a single week, no future turns and no possibility of equalising burdens over time, so that the choice is between five units for one town and one unit each for twelve; and suppose in addition that the towns are closely linked by long-standing ties, that each town's council and citizens have a sincere and standing concern for their neighbours, and that each town reports a genuine burden of about half a unit of distress at the thought of a sister town sitting dark for a week while everyone else carries on, a distress that grows with the number of towns affected. The question is whether the contractualist may count such other-regarding components, whether doing so lets numbers matter without summing anybody's complaints together, and whether that is a legitimate reading of an individual complaint or merely aggregation smuggled in by another route, given that the very same burden then does argumentative work once for every person who sympathises with it — with the obvious parallel of a thousand people each distressed that one person is permitted to do something harmless. Where the framework leaves a choice open, the question should require students to say which way they would go and to defend it by appeal to the point of the individualist restriction rather than by stipulation.

  Please write the question itself in clean, exam-ready prose that I can paste into the paper, with the case and both parts self-contained, then a model answer of roughly 650 words, then a marking scheme worth 25 marks in total, built around five must-hit points with the marks each is worth and a one- or two-line note on how candidates typically get that point wrong. My provisional thought is that the points should be something like: mapping the verdicts at each grain and seeing that no cross-person sum is needed to explain them; treating the fine-grained principle as a real candidate and running the reductio through burden-sharing institutions; explaining why whole-life or whole-policy comparison is intra-personal and therefore outside the restriction, while noting the residue that this manoeuvre only works for recurring, time-shareable burdens among parties with comparable tenure; showing how numbers can enter through the content of each person's complaint and distinguishing that sharply from summing across persons; and giving the strongest objection to that move together with a defended filter or a defended admission that no filter is available. But improve on that structure if you see a better one. Finally, add a short note on the A/B boundary: what an A answer does that a solid B answer, which handles the mechanics correctly, fails to do. The question should be answerable in about an hour, and it should reward taking a defended position over hedging.
reasoning: |-
  Okay, let me tackle this professor's request for a redesigned exam question on contractualism and aggregation. The user is clearly frustrated with repetitive answers about Scanlon's framework and wants to force deeper engagement with temporal granularity and other-regarding complaints.

  Hmm, the professor's case about power outages is brilliant - it creates a perfect tension between fine-grained and coarse-grained evaluations. The key insight is that contractualism's individualist restriction isn't the end of the story; we still need to decide whether to evaluate principles at the level of individual decisions or whole policies, and whether complaints can include distress about others' suffering.

  For part (a), I need to design questions that make students see: 
  First, that at weekly granularity, Rota creates one big complaint while Dimming creates twelve small ones - but crucially, this doesn't require summing across persons. 
  Second, that a principle minimizing the largest individual complaint per decision-point would absurdly reject all burden-sharing schemes. 
  Third, that summer-long comparison is intra-personal aggregation, which is permitted, but only works for recurring burdens among stable groups.

  For part (b), the one-off version removes the temporal solution and introduces other-regarding complaints. The exam must push students to confront whether sympathetic distress counts as part of an individual's complaint, and whether this legitimately makes numbers matter or secretly reintroduces aggregation.

  The model answer should demonstrate how to navigate these issues without getting stuck on basic framework restatement. Top answers will likely show awareness that contractualism's commitment to justifiability to each person might inherently resist both solutions - either by prohibiting variable-grain principles or by limiting complaint content to first-personal interests.

  The marking scheme needs to penalize students who mechanically repeat the aggregation objection without seeing how the case transforms it. Five clear points: (1) recognizing intra-personal aggregation in summer totals, (2) taking the fine-grained principle seriously and seeing its institutional implications, (3) explaining why coarse-graining avoids cross-person summing, (4) analyzing other-regarding complaints as content-based number-sensitivity, (5) engaging the smuggling objection. 

  For A/B differentiation: B answers will correctly apply the mechanics but miss how these maneuvers strain contractualism's core motivation - the need for principles no one could reasonably reject might actually forbid both temporal flexibility and expansive complaint content. An A answer will spot this tension and take a stand on whether contractualism can or should accommodate such moves.
answer: |-
  Here is the exam question, model answer, marking scheme, and differentiation note designed to meet your specifications:

  **Exam Question: Contractualism, Grain, and Grief**

  **The Case:** Twelve towns share a regional power grid. For 12 weeks each summer, the grid operator must shed load. Two standing policies are available:
  1.  **Rota Policy:** One town is disconnected for a full week at a time, towns take turns. Each town has one turn per summer. With advance notice, towns can plan around it (hire generators, move stock, schedule maintenance), reducing the burden to **5 units per town for its one week**.
  2.  **Dimming Policy:** Every town loses one randomly timed hour of power every day. Unannounced interruptions cannot be planned around. The 84 interruptions over the summer cause restart/spoilage costs totaling **12 units per town (1 unit per town per week)**.
  *At the weekly grain:* Rota imposes 5 units on one town and 0 on the other eleven. Dimming imposes 1 unit on each of the twelve towns.
  *At the summer grain:* Rota imposes 5 units on each town. Dimming imposes 12 units on each town.

  **Part (a) (12 marks):**
  Explain how contractualism, under the individualist restriction (no summing complaints across persons), might evaluate the Rota and Dimming policies. Consider:
  (i)   Evaluating principles governing *each weekly decision*: What verdict might a principle minimizing the largest individual burden *at that decision point* yield? What would this imply for burden-sharing schemes like rotas generally? Is such a principle a genuine candidate?
  (ii)  Evaluating a principle governing the *entire summer policy*: How does comparing the *total burden each town bears over the summer* avoid violating the individualist restriction? Under what conditions (considering the nature of burdens and parties) is this coarse-grained comparison plausible?

  **Part (b) (13 marks):**
  Now consider a *one-off* decision for a *single week only* (no future turns, no burden-sharing over time). The choice is solely between imposing **5 units on one town** or imposing **1 unit on each of the twelve towns**. Crucially, the towns have deep, long-standing ties. Each town’s citizens experience a genuine, additional burden of **approximately 0.5 units** of distress *specifically at the thought of one sister town suffering a week-long blackout while others carry on normally*, and this distress *increases with the number of towns affected*.
  (i)   Could contractualism legitimately include this other-regarding distress as part of an *individual town’s complaint* against a principle permitting the one-town blackout? Explain why or why not, focusing on the *content* of the complaint.
  (ii)  If included, how would this affect the comparison of complaints? Does this allow numbers to matter *without* summing complaints *across different persons*? Explain precisely.
  (iii) What is the strongest objection to including such other-regarding components? Is this objection decisive? Defend your view by appealing to the *point* of contractualism's individualist restriction (e.g., what it aims to protect or achieve), not just the restriction itself.

  ---

  **Model Answer (Approx. 650 words):**

  **Part (a):** Contractualism’s individualist restriction prohibits summing burdens *across different persons*. However, it does not dictate the *temporal grain* at which candidate principles are framed or evaluated.

  (i) A principle framed at the *weekly decision grain*, such as "At each load-shedding decision, choose the option generating the smallest maximum individual burden *for that week*," is a genuine candidate. It is general and reasonably rejectable only if an alternative principle yields no greater burden for anyone. Applying it weekly: In any given week, Rota imposes a 5-unit burden on one town, while Dimming imposes only a 1-unit burden on everyone. The maximum individual burden under Rota (5) is larger than under Dimming (1). Therefore, Rota *could be reasonably rejected* by the town facing 5 units that week, as Dimming offers them a lesser burden (1 unit). Crucially, this holds *even though Rota is better for everyone over the summer*. This principle would systematically reject *any* burden-sharing scheme (like rotas, queues, or lotteries) that concentrates a large burden on one party at a time to achieve lower burdens overall. It mandates spreading burdens thinly at every opportunity, potentially leading to worse aggregate (and individual) outcomes over time, like Dimming’s 12-unit summer total per town vs. Rota’s 5.

  (ii) Contractualism can also evaluate a principle governing the *entire summer policy*. Here, we compare the *total burden borne by each individual town* over the 12 weeks. Under Rota, each town bears 5 units total. Under Dimming, each town bears 12 units total. Comparing these *intra-personal totals* does *not* sum burdens across persons; it compares the total complaint *of Town A* under Rota (5) to the total complaint *of Town A* under Dimming (12), and likewise for each other town individually. Since every single town has a smaller total burden under Rota (5 vs 12), Rota is clearly preferable under a principle minimizing each individual's total burden. This avoids violating the individualist restriction because the comparison is per individual across the policy period. However, this coarse-grained escape hatch *only works* if the parties are the same over the relevant period, burdens are recurring and shareable over time, and the principle governs the *scheme* rather than discrete acts. It wouldn't apply to one-off decisions involving transient parties.

  **Part (b):** The one-off scenario removes the coarse-grained option. We must choose between one town suffering 5 units or twelve towns suffering 1 unit each.

  (i) Contractualism *might* permit including the other-regarding distress (approx. 0.5 units per town) in an individual’s complaint against a principle allowing the concentrated burden. The complaint isn't just "I suffer 1 unit"; it could be "I suffer 1 unit *plus* 0.5 units of distress seeing Town X suffer immensely alone." The *content* of the complaint includes a relational, other-regarding component. If this distress is genuine and stems from sincere communal ties, it arguably reflects a personal interest in not seeing close neighbours suffer unfairly, which could be a basis for reasonable rejection. The individualist restriction concerns the *unit* of justification (the individual) and prohibits aggregating *different individuals' burdens* to outweigh a large burden; it doesn't inherently forbid an *individual's complaint* having complex content that includes distress at others' plight.

  (ii) If included, each town considering the "one-town-blackout" principle experiences a complaint of 0.5 units (the sympathy burden) *even if they are not the one blacked out*. The town actually blacked out has a complaint of 5 units (direct) + 0.5 units (sympathy for others? Debatable, but perhaps just the 5). Critically, the *magnitude* of the 0.5 unit sympathy burden *for each other town* depends on the *number* affected – it exists *because* one town suffers alone. This makes the total *set* of complaints against the one-town-blackout principle consist of one large complaint (~5 units) and eleven smaller complaints (~0.5 units each). Against the spread-burden principle (each suffers 1 unit), each town has a complaint of only ~1 unit (direct burden, sympathy burden is likely minimal or zero as no one suffers intensely alone). Comparing complaints *individual by individual*, the maximum complaint under one-town-blackout (5) is larger than under spread-burden (1). Numbers matter here *not* because we sum the 0.5 units across people, but because the *content* (the *reason*) for *each individual's* 0.5 unit complaint *references the number of people suffering intensely* – the solitary nature of the suffering is what causes the distress. The individual complaint magnitudes are number-sensitive.

  (iii) **Strongest Objection:** This smuggles aggregation in through the back door. While formally each complaint is individual, the *source* and *justification* for the 0.5 unit burden *depends entirely* on the suffering of *another person*. Counting it separately for each sympathizer effectively multiplies the weight given to the single victim's suffering – eleven extra 0.5 unit complaints all generated by *one person's* 5-unit burden. This replicates the effect of summing: the single victim's burden gets counted 11 extra times indirectly. This violates the *spirit* of the individualist restriction, which aims to ensure that a large burden to one person cannot be outweighed by many small burdens to others *precisely because* it prevents the many small burdens from amplifying the case against the principle that avoids the large burden. Here, the many small *sympathy* burdens *do* amplify the case against the principle imposing the large burden. **Defended Admission:** This objection is powerful. While the argument for inclusion relies on respecting the complex content of individual complaints, the *effect* is functionally equivalent to aggregation and risks undermining contractualism's core commitment to protecting individuals from being sacrificed for the aggregate good. A consistent defense of the individualist restriction's *point* (blocking trade-offs where one bears a large cost for diffuse benefits to others) likely requires filtering out such other-regarding components *when they are contingent on others' primary burdens* to prevent this amplification. The distress might be real, but its *justificatory force* in the contractualist framework is suspect in this context.

  ---

  **Marking Scheme (Total: 25 Marks)**

  1.  **Weekly Grain Analysis & Fine-Grained Principle Implications (5 marks):**
      *   Correctly identifies that at weekly grain, Rota yields max complaint=5, Dimming yields max complaint=1 (1 mark).
      *   Recognizes minimizing max weekly burden favors Dimming weekly, rejecting Rota weekly (1 mark).
      *   Treats the fine-grained principle as a serious candidate (1 mark).
      *   Clearly states this principle rejects *any* burden-sharing scheme concentrating burdens (rotas, queues, lotteries) (1 mark).
      *   Identifies the problematic consequence: mandates thin spreading always, potentially worse overall/per person (e.g., Dimming's higher total) (1 mark).
      *   *Common Error: Only stating Rota vs Dimming weekly outcome without deriving implications for burden-sharing generally or the principle's candidacy.*

  2.  **Summer Grain Analysis & Intra-Personal Comparison (5 marks):**
      *   Correctly states Rota total per town=5, Dimming total per town=12 (1 mark).
      *   Explains that comparing *each town's total burden under Rota vs. under Dimming* is comparing burdens *within* a single individual's experience under different principles (intra-personal) (2 marks).
      *   Explicitly states this comparison does NOT sum burdens across different persons (1 mark).
      *   Notes the limitations: requires recurring burdens, stable parties, a policy/scheme grain (not one-off), and comparable tenure (1 mark).
      *   *Common Error: Confusing intra-personal (over time for one person) with interpersonal (across people) summing, or failing to note the necessary conditions for this move.*

  3.  **Other-Regarding Complaint: Legitimacy & Mechanism (5 marks):**
      *   Engages seriously with the possibility of including other-regarding distress as *content* of an individual complaint (1 mark).
      *   Explains the proposed complaint: e.g., "1 unit direct + 0.5 units distress at neighbour's plight" (1 mark).
      *   Explains *how* inclusion makes numbers matter without interpersonal summing: The *magnitude* (0.5 units) *and/or existence* of the sympathy component *for each individual* is *caused by* the fact that *one specific other* suffers intensely *alone* (i.e., the *number* affected - one - is intrinsic to the complaint's content) (2 marks).
      *   Contrasts the complaint sets: One large + eleven sympathy complaints (vs. one-town) vs. twelve direct complaints (vs. spread) (1 mark).
      *   *Common Error: Simply asserting numbers matter now, or vaguely suggesting sympathy "counts," without explaining the precise mechanism via complaint content and individual comparison. Confusing this with aggregating the sympathy burdens.*

  4.  **Objection & Defense: Smuggling Charge (5 marks):**
      *   Clearly articulates the strongest objection: This functionally replicates aggregation by multiplying the weight of the single victim's burden via multiple sympathy complaints dependent on it (smuggling) (2 marks).
      *   Explains *how* it violates the *point/spirit* of the individualist restriction: It allows many small burdens (sympathy) dependent on one large burden to indirectly outweigh the case for a principle avoiding the large burden, undermining protection against being sacrificed for aggregate good (1 mark).
      *   Takes a clear position: Either (a) **Defended Filter:** Argues consistently for filtering out such contingent other-regarding components to uphold the restriction's purpose (1 mark), OR (b) **Defended Admission:** Concedes the objection is strong/valid as it reveals a tension, even if sympathetic distress seems genuine (1 mark). (Mere description of objection: Max 3 marks).
      *   Defense must appeal to the *aim* of the restriction (protecting individuals from trade-offs, ensuring justifiability based on personal standpoints), not just its formal rule (1 mark).
      *   *Common Error: Only describing the objection without defending a position, or defending a position based on stipulation/irrelevant moral intuition rather than the point of contractualism.*

  5.  **Clarity, Structure, and Addressing Prompts (5 marks):**
      *   Answers all sub-parts explicitly (a(i), a(ii), b(i), b(ii), b(iii)) (1 mark).
      *   Avoids mere restatement of Scanlon's framework/Formula of Reasonable Rejectability (1 mark).
      *   Logical flow, clear expression, precise use of terms (burden, complaint, intra-personal, content, grain) (2 marks).
      *   Demonstrates understanding that the aggregation problem *changes shape* with these moves, doesn't just vanish (1 mark).
      *   *Common Error: Wasting words rehashing basic contractualism, missing sub-questions, poor structure, vague terminology.*

  ---

  **A/B Boundary Note:**

  *   **Solid B Answer:** Correctly maps the mechanics of both "escape routes" (coarse-grained intra-personal comparison; other-regarding complaint content). Accurately explains the weekly principle's implications for burden-sharing and the limitations of the summer move. Clearly articulates how sympathy makes numbers matter via content and identifies the smuggling objection. Addresses all parts competently. Demonstrates good understanding of the framework's application.
  *   **A Answer:** Does all of the above, **plus**:
      1.  **Depth on Justification:** For Part (b), explicitly grapples with the tension between respecting the *content* of individual complaints (including sincere relational distress) and the *purpose* of the individualist restriction (preventing trade-offs). Doesn't just state the smuggling charge but deeply interrogates *why* it's problematic *for contractualism specifically*.
      2.  **Critical Awareness:** Recognizes that the "solutions" are controversial moves *within* contractualism, not straightforward applications. Shows awareness that adopting variable grain or expansive complaint content requires justification against the background of the aggregation problem and the restriction's rationale. Might note how the coarse-grain move only defers the problem to non-recurring cases.
      3.  **Synthesis:** Clearly articulates *how* the case transforms the aggregation problem rather than solving it – e.g., the problem becomes about the *admissibility of principles at certain grains* or the *permissible content of complaints*, showing these are foundational choices *before* the restriction applies.
      4.  **Defended Position Strength:** For Part (b)(iii), the defense (whether for filter or admission) is particularly nuanced, well-reasoned, and tightly connected to contractualism's foundational aims (e.g., mutual justifiability, the separateness of persons, protection from being used as a means).
      5.  **Insight:** Might draw the parallel to the "thousand distress" case explicitly and explain its relevance to the legitimacy of the sympathy component. May question whether the sympathy burden *truly* reflects a personal interest relevant to reasonable rejection or is a backdoor consequentialism.
