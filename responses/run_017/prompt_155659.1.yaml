  The user mentions their friend called it an argument from ignorance or god of the gaps, but they feel those don't quite fit. They're right because those fallacies involve filling gaps with supernatural explanations, whereas here, the gap itself is relabeled as evidence without adding new information. I recall terms like "ceremonial catch-all" or "ritual rubbish bin" used informally in archaeology. But the user wants a precise term and analysis.

  Breaking down the components: First, there's the conflation of ignorance with evidence. Unexplained objects are categorized as ritual, which then supports the existence of religious institutions. This is circular. Second, there's the exclusion of functional items from religious contexts, which ignores that rituals often involve everyday objects. This creates a false dichotomy between secular and religious.

  I should consider existing concepts in philosophy of science and archaeology. The "ceremonial trope" is a known issue. Binford criticized the "Pompeii premise," assuming artifacts reflect a single moment, which relates but isn't the same. The "argument from absence" might be part of it, but it's broader. A more fitting term could be "Ritual Inference by Ignorance" or "Ceremonial Default Fallacy." The key is the automatic categorization without positive evidence.

  The user also wants boundary cases. A legitimate inference would involve multiple lines of evidence: contextual clues, ethnographic parallels, wear patterns indicating non-utilitarian use, etc. For example, an object in a burial context with symbolic carvings could be legitimately considered ritual. But a pit of skulls without further analysis shouldn't default to ritual.

