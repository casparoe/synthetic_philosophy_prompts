  Policy A: Select a healthy embryo. The child (Child A) is born and has a well-being of 90. The mother's well-being is 80. The cancer patient's well-being is 70.

  Policy B: Select a different embryo that has a genetic condition. The clinic uses the budget to provide an expensive gene therapy to the child, which corrects the condition and also provides an enhancement, giving the child (Child B) a well-being of 121. However, this therapy is so expensive that it requires cutting the mother's care, reducing her well-being to 50. The cancer patient receives the same level of care as in A, so her well-being is 70.

  Well-being levels:

  Policy A:
  - Mother: 80
  - Child A: 90
  - Cancer patient: 70
  - Total: 80+90+70 = 240

  Policy B:
  - Mother: 50
  - Child B: 121
  - Cancer patient: 70
  - Total: 50+70+121 = 241

  Total utilitarianism: 241 > 240 -> prefers B.
  Average utilitarianism: same number of people (3), so also prefers B.

  Person-affecting view: The only people who exist in both are the mother and the cancer patient. 
  - The mother is worse off in B (50 vs 80).
  - The cancer patient is equally well off (70 in both).
  - There is no improvement for any existing person, but there is a loss for the mother.
  - The new child (Child B) is not a reason to choose B because we have no duty to create her (even though her life is very good).
  - Therefore, B is worse than A.

  This satisfies all the constraints.

  Now, we present:

  **Scenario:**

  At a fertility clinic, a couple using in vitro fertilization is hoping to have one child. The clinic also provides treatment to a cancer patient. The clinic has a fixed budget, so any spending on one patient means less for others. The clinic must decide between two policies for embryo selection and treatment.

  Policy A: The clinic selects a healthy embryo. The child is born without health issues and enjoys a high quality of life. The mother experiences a standard level of well-being during the process. The cancer patient receives a baseline treatment that manages her condition but leaves her with some discomfort.

  Policy B: The clinic selects a different embryo that has a treatable genetic condition. The clinic uses an expensive gene therapy that not only corrects the condition but also enhances the child's health, resulting in an even higher quality of life than in Policy A. However, this therapy is so costly that the mother's care is significantly reduced, causing her substantial discomfort. The cancer patient receives the same baseline treatment as in Policy A.

  **Well-being assignments (on a scale where 0 represents a life barely worth living, and higher values are better):**

  - In Policy A:
    - Mother: 80
    - Child: 90
    - Cancer patient: 70
    - Total well-being: 240

  - In Policy B:
    - Mother: 50
    - Child: 121
    - Cancer patient: 70
    - Total well-being: 241

  **Arithmetic:**

  - Total utilitarianism: Sums the well-being of all individuals. Policy A: 240, Policy B: 241. Since 241 > 240, it prefers Policy B.
  - Average utilitarianism: Divides total well-being by the number of people. Both policies have 3 people. Policy A: 240/3 ≈ 80.0, Policy B: 241/3 ≈ 80.33. Prefers Policy B.
  - Person-affecting restriction with asymmetry: Compares only the well-being of individuals who exist in both scenarios (the mother and the cancer patient). The mother is worse off in Policy B (50 vs 80), and the cancer patient is equally well off (70 in both). The child in Policy B would not exist in Policy A, and since we have no obligation to create a person even if their life is good, the child's high well-being does not count in favor of Policy B. Therefore, Policy A is better because it avoids harming the mother.

  **Which single feature is doing the work?**

  The key feature is that Policy B creates a different child (Child B) who would not exist under Policy A, and the cost of providing that child with high well-being is borne solely by an existing person (the mother), who is made worse off. The person-affecting view discounts the gains of the new child but counts the losses of the existing mother.

  **What if the same future individuals exist in both policies?**

  Suppose we stipulate that the same child exists in both policies, but in Policy B, the child receives the gene therapy and the mother's care is reduced. Then well-being levels would be:

  - Policy A: Mother=80, Child=90, Patient=70 -> total=240
  - Policy B: Mother=50, Child=121, Patient=70 -> total=241

  Now, the same individuals exist. Then:

  - Total and average utilitarianism still prefer B.
  - The person-affecting view: The child is now an existing person in both, and in B the child is better off (121 vs 90) and the mother is worse off (50 vs 80). The cancer patient is the same. So there is a trade-off: the child gains 31 and the mother loses 30. The person-affecting view might now aggregate and prefer B because the gain to the child outweighs the loss to the mother (if we allow aggregation). But if it doesn't allow aggregation and requires that no one is made worse off, then it might be indeterminate. However, typically, the person-affecting view with aggregation would prefer B in this case. So the verdict changes: the person-affecting view might now prefer B or at least not rank A above B.

  **How would a defender of the person-affecting view attack the case?**

  The defender might argue that the clinic's policy does not actually fix the identity of the child in the way required. They might claim that the selection of the embryo is not what determines the identity; perhaps the couple would have had a child anyway, and the embryo selection only affects the child's health, not which child is born. We need to emphasize that in IVF with multiple embryos, selecting one embryo rather than another does lead to a different child being born. This is a standard assumption in non-identity problem cases.

  Alternatively, the defender might bite the bullet and say that Policy B is indeed worse than Policy A, as the case shows, and that total utilitarianism is mistaken because it counts the well-being of the new child who shouldn't count.

  **Is fixing the population size question-begging because total and average coincide at fixed population size?**

  Yes, at a fixed population size, total and average utilitarianism are equivalent because they are ordinally identical (since the population size is constant, maximizing total is the same as maximizing average). So the requirement (v) that average utilitarianism also prefers B is automatically satisfied if total does and the population size is fixed. This is not a problem for the case, because we are trying to isolate the person-affecting issue. But if we want to relax the fixed-number constraint, we could consider a case with slightly different numbers. However, the requirement (i) is that the number is the same, so we are good.

  **Critical-level utilitarianism:**

  Critical-level utilitarianism (CLU) says that a person's well-being only counts if it is above a critical level (often set to a positive number, c). The value of a life is its well-being minus c.

  In our case, let's assume a critical level c > 0.

  Policy A: 
  - Mother: 80 - c
  - Child A: 90 - c
  - Patient: 70 - c
  - Total: 240 - 3c

  Policy B:
  - Mother: 50 - c
  - Child B: 121 - c
  - Patient: 70 - c
  - Total: 241 - 3c

  Since 241-3c > 240-3c, CLU prefers B regardless of c. However, the gain is only 1, which is small.

  But note: the critical level is applied to everyone, including the mother and patient. This doesn't change the ordering between A and B.

  The health economist might have in mind a different variant? Some versions of CLU might apply the critical level only to new people, but that is nonstandard. Normally, it is applied to everyone.

  In this case, CLU agrees with total utilitarianism in preferring B.

  **Are any two specifications not jointly satisfiable?**

  We were able to satisfy all. The numbers might seem strained (Child B having well-being 121 while the mother is at 50), but it is conceivable that the child's enhanced well-being is very high and the mother's reduction is significant.

  If the health economist's point was that CLU would rescue the totalist verdict, it does, but in this case total utilitarianism already prefers B. The challenge was to have the person-affecting view disagree, which it does.

