  ### Thought Experiment: The Fertility Clinic's Choice

  **The Scenario**  
  A fertility clinic offers in vitro fertilization (IVF) with preimplantation genetic testing to a couple seeking a child. The clinic also treats a cancer patient who will exist regardless of the clinic's decision. With a fixed budget, the clinic must choose between two policies:  

  - **Policy A**: Select an embryo without genetic issues. The child (Child A) is born healthy. The mother receives standard care, and the cancer patient gets baseline treatment.  
  - **Policy B**: Select a different embryo carrying a genetic condition, then use expensive gene therapy to correct it and enhance the child's health. This therapy is so costly that the mother's care is drastically reduced, causing her significant discomfort. The cancer patient receives the same baseline treatment as in Policy A.  

  Policy B creates a different child (Child B) who would not exist under Policy A. Both children have lives well worth living, and no one falls below a "neutral point" (a life barely worth living). The policies cost the same and only differ in which child exists and the distribution of well-being.  

  **Well-Being Levels**  
  We measure well-being on a scale where:  
  - **0** = Neutral (a life barely worth living).  
  - **Positive values** = Better than neutral (e.g., 50 is moderately good, 100 is excellent).  
  This scale reflects "quality-adjusted life years" (QALYs), a real-world metric used in health economics. A 10-point gain equals a 10% improvement in life quality—defensible as it captures how policies affect health and happiness.  

  *Assignments for Policy A*:  
  - Mother: **80** (good care, minimal stress).  
  - Child A: **90** (healthy, no issues).  
  - Cancer patient: **70** (baseline treatment, some discomfort).  
  *Total well-being*: 80 + 90 + 70 = **240**.  

  *Assignments for Policy B*:  
  - Mother: **50** (reduced care, high stress and discomfort).  
  - Child B: **121** (gene therapy corrects the condition and enhances health).  
  - Cancer patient: **70** (same as Policy A).  
  *Total well-being*: 50 + 70 + 121 = **241**.  

  **Arithmetic and Verdicts**  
  - **Total utilitarianism** (sum well-being): Prefers Policy B (241 > 240).  
  - **Average utilitarianism** (average well-being): Both policies have 3 people. Policy A: 240/3 ≈ 80.0. Policy B: 241/3 ≈ 80.33. Prefers Policy B.  
  - **Person-affecting restriction + asymmetry**:  
    - Only individuals existing in both policies matter: the mother and cancer patient.  
    - Mother is worse off in B (50 vs. 80). Cancer patient is unchanged (70).  
    - Child B would not exist under A, and creating a person with a life worth living needs no justification ("asymmetry"). Gains to Child B do not count.  
    - Thus, B harms the mother without compensating gains to anyone who exists in both. Ranks Policy A above B.  

  ### Key Features and Adjustments  
  **Single Feature Doing the Work**  
  The core feature is that Policy B *changes who exists* (Child B instead of Child A), while the cost of Child B's high well-being falls solely on an identifiable person (the mother) who exists in both options. This allows the person-affecting view to ignore Child B's gains but count the mother's losses.  

  **If the Same Individuals Exist in Both Policies**  
  Suppose we stipulate the same child exists in both (e.g., Child A receives gene therapy in Policy B):  
  - Policy A: Mother = 80, Child = 90, Patient = 70 → Total = 240.  
  - Policy B: Mother = 50, Child = 121, Patient = 70 → Total = 241.  
  - *Verdicts*:  
    - Total and average utilitarianism still prefer B (241 > 240).  
    - Person-affecting restriction now must account for the child's gains (since they exist in both). The mother loses 30, but the child gains 31. With aggregation, this could favor B or be indeterminate. The original disagreement vanishes.  

  ### Defense and Objections  
  **How a Person-Affecting Defender Attacks the Case**  
  A philosopher defending the person-affecting restriction might object in two ways:  
  1. **Deny that the policy fixes identity**: They could argue embryo selection doesn't truly determine *who* exists—only which traits a future child has. If readers accept this, the case collapses. *Counter*: In IVF, selecting one embryo over another creates a genetically distinct child. This is empirically grounded (e.g., "savior sibling" cases), so the objection is weak without denying reproductive science.  
  2. **Appeal to the same-number quality claim**: They might argue that Policy A is better because it creates a *happier child* (Child A at 90) than Policy B (Child B at 121) would, if we compare the children. But this fails—Child B doesn't exist in A, so the claim is incoherent. The person-affecting view avoids this trap by focusing on identifiable losers (the mother).  

  **Is Fixing Population Size Question-Begging?**  
  Yes, but harmlessly. At a fixed population size, total and average utilitarianism *always coincide* (same denominator for averages). Your constraint (v) is satisfied automatically if (iv) is, so it doesn't "switch off" a real dispute—it isolates the person-affecting disagreement. To relax this:  
  - *Small, realistic adjustment*: Allow Policy B to create one extra person (e.g., if gene therapy enables a twin birth).  
    - Policy A: 3 people, total well-being 240.  
    - Policy B: 4 people (mother, cancer patient, and two children), with well-being: mother = 50, child 1 = 121, child 2 = 60, patient = 70 → Total = 301.  
    - *Verdicts*:  
      - Total utilitarianism prefers B (301 > 240).  
      - Average utilitarianism: B = 301/4 ≈ 75.25, A = 80 → Prefers A.  
      - Person-affecting restriction still ranks A above B (mother loses, no gains to shared individuals).  
    - Now total and average conflict, but the person-affecting verdict remains intact.  

  **Critical-Level Utilitarianism's Role**  
  Critical-level utilitarianism (CLU) assigns value to a life only if well-being exceeds a positive "critical level" (e.g., c = 30). It rescues the totalist verdict here:  
  - Policy A: (80 - 30) + (90 - 30) + (70 - 30) = 50 + 60 + 40 = 150.  
  - Policy B: (50 - 30) + (121 - 30) + (70 - 30) = 20 + 91 + 40 = 151.  
  - CLU prefers B (151 > 150), matching total utilitarianism.  
  - *Does the critical level's scope matter?* If applied only to people whose existence is at stake (Child B), CLU still prefers B:  
    - Policy A: 80 (mother) + 90 (Child A) + 70 (patient) = 240.  
    - Policy B: 50 (mother) + (121 - 30) (Child B) + 70 (patient) = 50 + 91 + 70 = 211.  
    - Now CLU prefers A (240 > 211). But this is ad hoc—standard CLU applies to *all* people. Your health economist likely assumed universal application, which holds.  

  **Joint Satisfiability and Realism**  
  All specifications are satisfied. The only strain is Child B's well-being (121) versus the mother's loss (down to 50). This 71-point gap requires readers to accept:  
  - Gene therapy could dramatically enhance a child's health beyond normal (e.g., eliminating genetic risks and boosting resilience).  
  - The mother's care reduction is severe (e.g., no counseling, inadequate pain management).  
  This is plausible with modern biotech (e.g., CRISPR enhancements) and healthcare rationing. If the gap feels extreme, reduce Child B to 120 and Child A to 89—the verdicts hold (B totals 240, A totals 239).  

  ### Final Thoughts  
  This case isolates your thesis: The "repugnant" fracture arises when gains to unidentifiable future people (Child B) are balanced against losses to existing people (the mother). Person-affecting views reject this trade-off; totalist views accept it. The IVF setup makes identity-shifting realistic, and QALYs keep it legible. Use this, and your philosopher-interlocutor will face a resilient challenge.
