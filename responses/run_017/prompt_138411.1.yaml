prompt: |-
  I am revising the chapter on the fact–value distinction in a handbook of argument analysis for policy professionals, and I want the statement of the is–ought gap to be one a reader could actually apply. The version I have been working with is syntactic: classify every atomic claim in an argument as descriptive or normative, and treat any inference step as illegitimate if none of its premises is normative while its conclusion is. Three difficulties have made me doubt this formulation, and I would like to know which of the diagnoses I can see is the right one, or whether the formulation should be abandoned.

  First, the apparent counterexamples. A duty engineer wants the substation not to flood, and pumping the sump is the only means available to her of preventing it; so she ought to pump the sump. No premise contains "ought," "good," "bad," "reason," or "should," and yet the reasoning strikes me as impeccable. Either Hume's law is false, or instrumental reasoning is a recognised exception to it, and I cannot tell which — though the difference clearly matters for what I tell my readers.

  Second, the cases where the norm seems already to be inside the descriptive-looking premise. N promised the Board she would keep the records dry; so N ought to keep the records dry. If promising is the sort of thing that binds, the "ought" is packed into the first premise rather than produced by the step, and then whether my rule flags an argument depends only on where the norm is parked, which cannot be a real difference. A student of mine has also pointed out that from "the gauge reads four metres" one may validly infer "the gauge reads four metres or the Board ought to resign," which my rule flags as well, and which surely cannot be what anyone meant to prohibit.

  Third, if I retreat to the safer claim that a normative conclusion requires a normative premise somewhere, the thesis begins to look like mere bookkeeping: any argument can be made to satisfy it simply by making the normative premise explicit, and nothing follows about whether the argument is any good. Yet the gap is standardly treated as a deep thesis about the autonomy of ethics, which suggests that in retreating I have lost whatever content it had.

  So, as I see it, I have three options: (a) the law, stated syntactically, has counterexamples and should be given up; (b) it survives only because "descriptive" and "normative" are defined so that any premise from which an "ought" follows counts as normative, which makes it circular and unfalsifiable; or (c) what I have been calling the is–ought gap is really only the naturalistic fallacy — the prohibition on analysing "good" as some natural property — and has nothing to say about inference at all.

  Which of these is correct, and is there a fourth option I am missing? If the answer is (b), what exactly is the non-trivial claim, what sort of argument would violate it that I would otherwise have been willing to accept, and what would count as successfully bridging the gap rather than merely relabelling a premise as normative? Finally: is the naturalistic fallacy the same thesis as the is–ought gap, a consequence of it, or a separate doctrine that I have been conflating with it?
reasoning: |-
  Okay, let me start by understanding the user's problem. They're revising a chapter on the fact-value distinction for policy professionals and are struggling with the is-ought gap formulation. They presented three difficulties: apparent counterexamples like instrumental reasoning, normativity hidden in descriptive premises, and the triviality of requiring any normative premise. They proposed three options: abandoning the syntactic rule (a), it being circular (b), or conflating it with the naturalistic fallacy (c).

  First, I need to recall Hume's original point. Hume was pointing out that authors often slip from "is" to "ought" without explanation, which suggests a conceptual gap. The syntactic approach doesn't capture this because it's too rigid. The user's counterexamples highlight this. For instance, the duty engineer example: the premises are descriptive (wanting to prevent flooding, pumping as the only means), yet concluding "ought" seems valid. This is because the instrumental norm is implied. Similarly, promising implies an obligation. So the syntactic rule flags valid inferences as problematic because it misses implicit norms.

  Then there's the disjunction example. From a descriptive claim, adding a normative disjunct is logically valid but trivial. The syntactic rule would flag it, but it's not a real violation of the is-ought gap. This shows the rule's inadequacy.

  The user's third issue is that requiring any normative premise makes the rule trivial. If you can always add an explicit normative premise, the gap loses its force. But Hume's point is deeper—it's about justifying the normative premise itself. The real challenge is deriving "ought" from "is" without prior normative assumptions.

  The user's options: (a) abandon the syntactic rule—probably necessary since it's flawed. (b) Circular if "normative" includes anything implying "ought"—this makes it unfalsifiable. (c) Conflating with naturalistic fallacy. The naturalistic fallacy is about defining "good" in natural terms, while is-ought is about inference. They're related but distinct. Moore's naturalistic fallacy is metaphysical (what "good" means), while Hume's is-ought is epistemological (how we justify moral conclusions).

  So the fourth option is to reframe the gap as a justificatory challenge. For policy professionals, this is practical: arguments need explicit normative foundations. The key is not to ban inferences but to highlight where normative premises are assumed and require their justification. This approach maintains the gap's depth without syntactic rigidity.

  Also, the user might need to address how policy arguments handle implicit norms. Instrumental reasoning (if you want X, do Y) relies on a hypothetical imperative. Recognizing such structures helps avoid misapplying the gap. For example, the duty engineer's "ought" is conditional on her goal. If the goal itself is normative, that's where justification is needed.

  In summary, advising to shift from syntactic to justificatory focus, distinguishing between trivial and substantive inferences, and clarifying the relation to naturalistic fallacy. This provides a practical framework for policy analysts, emphasizing the need to scrutinize normative premises rather than policing inference rules.
answer: |-
  Your doubts are well-founded—the syntactic formulation is indeed inadequate for practical application. The correct diagnosis is **a combination of (b) and a fourth option you're missing**, with crucial clarifications about the naturalistic fallacy. Here's a breakdown:

  ### Diagnosis & Reframing the Is-Ought Gap
  1. **Option (a) is partly true**: The *syntactic rule* (classifying claims atomically and flagging "no-normative-premise" inferences) fails due to counterexamples and trivial cases. **But Hume's core insight stands**: You cannot *justify* a substantive "ought" solely from non-normative premises without implicit normative assumptions. The gap is about *justification*, not syntax.

  2. **Option (b) is the trap**: If you define "normative premise" as "any premise from which an 'ought' *could* follow," the rule becomes circular and useless ("Anything can be a normative premise!"). This must be avoided.

  3. **Option (c) is incorrect**: The is-ought gap ≠ naturalistic fallacy.  
     - **Is-Ought Gap (Hume)**: Concerned with *inference/justification* – Can you derive normative conclusions from purely descriptive premises?  
     - **Naturalistic Fallacy (Moore)**: Concerned with *meaning/reduction* – Can you define "good" using only natural properties?  
     They are distinct doctrines. Moore's fallacy *assumes* Hume's gap (if "good" can't be reduced to facts, you can't infer it *from* facts alone), but they address different problems.

  4. **The Fourth Option: Reframe as a "Justificatory Gap"**  
     The enduring insight is: **A genuinely *substantive* normative conclusion requires *explicit and justified normative input*.** The syntactic rule fails because:
     - **Implicit Norms**: Premises like "Pumping is the *only means* to prevent flooding" or "N *promised*" contain *normative commitments* (instrumental rationality, fidelity to promises). Syntactically "descriptive," they functionally imply norms.
     - **Trivial Inferences**: Logically valid inferences (like adding a disjunctive "ought") don't *substantively* derive new obligations – they just restate or dilute existing claims. Prohibiting them is irrelevant.
     - **The Retreat Trivializes**: Simply adding "*and you ought to achieve your goals*" satisfies the syntactic rule but dodges the *justificatory challenge*: *Why* ought we pursue those goals? Or: *Why* does promising bind?

  ### Practical Reformulation for Policy Professionals
  Abandon the syntactic rule. Replace it with this actionable guideline:

  > **"The Is-Ought Challenge: Scrutinizing Normative Foundations"**  
  > *An argument concluding with a substantive 'ought' (e.g., about obligations, permissions, values) must include at least one **explicit and contestable normative premise** that cannot be derived solely from descriptive facts. Your task is to:*  
  > 1. **Identify Hidden Norms**: Check if descriptively-worded premises (e.g., 'only means,' 'promised,' 'efficient,' 'law requires') rely on implicit normative assumptions (e.g., instrumental rationality, fidelity, efficiency is good, legal compliance is obligatory).  
  > 2. **Demand Justification**: Treat these implicit norms as *premises needing justification*. Ask: *"Why is this norm binding/relevant here?"*  
  > 3. **Flag Unsupported Leaps**: Reject arguments that present a substantive 'ought' as *directly following* from purely descriptive premises (e.g., "This policy increases GDP; therefore, we ought to adopt it" – unless "increasing GDP is always good" is explicitly argued).  
  > 4. **Accept Valid Structures**: Recognize that reasoning like *instrumental rationality* ("To achieve X, you must do Y") or *norm application* ("Rule R applies here; R requires action A; so do A") are valid *if* their normative components (the value of X, the validity of R) are acknowledged and defended.

  ### Applying to Your Difficulties
  1. **Duty Engineer Counterexample**:  
     - **Valid**: Because it's *instrumental reasoning*. Premise 1 ("She wants to prevent flooding") implies a goal. Premise 2 ("Pumping is the only means") is descriptive.  
     - **Normative Input**: The implicit premise: *"If you have a goal and there is a necessary means to it, you ought (instrumentally) to take that means."*  
     - **Application**: Tell readers: *"This argument works because it relies on a widely accepted norm of instrumental rationality. However, if the *goal itself* is contested (e.g., 'prevent flooding at all costs'), that norm needs defense."*

  2. **Promising & Trivial Inference**:  
     - **Promising**: "N promised" implies *"Promises create obligations."* This is the normative premise – make it explicit! The inference isn't from "is" to "ought"; it's from *"is + normative rule"* to "ought."  
     - **Trivial Disjunction**: Flagged by the syntactic rule, but irrelevant. Point out: *"This inference is logically valid but useless. It doesn't generate a new obligation; it just attaches an unrelated 'ought' disjunctively. Focus on substantive normative leaps."*

  3. **Avoiding Triviality**:  
     - The challenge isn't "add *any* normative premise." It's: **"Can you justify the *specific* normative premise(s) needed without begging the question or relying on another unsupported 'ought'?"**  
     - *Example of Failure*: "We ought to maximize happiness because happiness is good." (Circular – "good" is normative).  
     - *Example of Success*: "We ought to alleviate suffering because we have a capacity for empathy, and empathy, when universalized, demands we act to reduce others' pain." (Still normative premises, but argued, not assumed).

  ### What Successfully "Bridges the Gap"?
  It's not about syntax or labeling. A successful bridge **argues for the normative foundation**, e.g.:
  - Defending why a certain goal (e.g., well-being, autonomy) is intrinsically valuable.
  - Demonstrating why a social practice (e.g., promising, law) generates obligations *if* certain background conditions hold.
  - Showing how a descriptive fact (e.g., "causes suffering") *counts as a reason* for action under a justified normative framework.

  ### Recommendation for Your Handbook
  - **Ditch the syntactic rule**. It misleads and creates false positives/negatives.
  - **Adopt the justificatory framework**. Emphasize:
    > *"Policy arguments often hide norms in descriptive language. Your job is to expose these norms and demand their defense. The 'is-ought gap' isn't a logical stop sign; it's a reminder that values need explicit reasoning, not just factual support."*
  - **Clarify fallacies**: Distinguish the is-ought gap (justifying norms) from the naturalistic fallacy (defining "good" naturalistically). They often arise together but address different errors.

  This approach preserves Hume's insight while giving policy professionals a practical tool to dissect arguments—focusing on where norms enter and whether they hold up.
