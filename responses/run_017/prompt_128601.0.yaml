     - Also, ESC and pluralism: in our tree, ESC is assigned when they say no to lichen fungus alone and two for salamander ring. But pluralism is when they say no to lichen fungus alone and one for salamander ring. But a pluralist might use different concepts, so they might say two for salamander ring using BSC, which would be ESC-like. So the tree might misroute a pluralist who uses ESC for both to ESC leaf. But we have a separate leaf for pluralism only for the combination of answers that don't fit elsewhere.

     - Another issue: BSC and conventionalism are separated by the hybrid willow: BSC says yes (it is a species) and conventionalism says no. But a conventionalist might say yes for the willow arbitrarily. So the tree forces them to say no to be conventionalism. But they might say yes, so we might misroute a conventionalist to BSC. To avoid, we could have asked a fourth question, but we have limited branches.

     In practice, the tree might not perfectly separate, but we have to do with the cases.

  2. Combination of answers the tree allows that nobody defends:

     - In our tree, the only combination that leads to pluralism is: crayfish yes, lichen fungus no, salamander ring one.
          - Crayfish yes: so not BSC or conventionalism.
          - Lichen fungus no: so not PSC or GLC.
          - Salamander ring one: so not ESC (which would say two).
          - So it's a combination that doesn't fit the other concepts, so we call it pluralism.

     - Is there a combination that is not used? For example, if someone says crayfish no and hybrid willow no, we assign conventionalism. But a BSC person might say crayfish no (because asexual) and hybrid willow yes (because reproductively isolated). We have that as BSC.

     - What about: crayfish yes, lichen fungus no, salamander ring two: we assign ESC. That seems defended.

     - Another: crayfish yes, lichen fungus yes, salamander ring one: GLC.
     - Crayfish yes, lichen fungus yes, salamander ring two: PSC.

     - The only combination that might be unexplored or incoherent is if someone says crayfish no and hybrid willow no: we assign conventionalism. But a BSC person might say hybrid willow yes. So the combination of crayfish no and hybrid willow no is only for conventionalism. And that is defended by conventionalism.

     So no combination in the tree is left without a leaf.

     But what about if someone says crayfish yes, lichen fungus no, salamander ring one: we call it pluralism. Is that defended? Pluralism isn't a specific combination, but it's a catch-all for mixed views. So it's fine.

  Now, warnings:

  - The tree is simplified and might not capture every nuance.
  - For the salamander ring, the answer "two or more" might be chosen by some who are not necessarily PSC or ESC, but we assign them based on the path.
  - The lichen question: the answer might depend on the group. Some might not know that the fungus can be considered separately.
  - Volunteer applicability: the tree is for helping volunteers understand which concept they might align with, not for applying in the field. For actual counting, they need practical guidelines.

  Now, let's write the tree as a handout.

  Format: decision tree, then table, then flags.

  Decision Tree:

  1. Start: The clonal crayfish (all-female, no sex) is morphologically distinct and found in a marsh. Is it a distinct species?
     - No: Go to 2
     - Yes: Go to 3

  2. The hybrid willow (fertile, self-sustaining, doesn't breed with either parent species) at Kestrel's Point. Is it a distinct species?
     - Yes: Biological Species Concept
     - No: Conventionalism

  3. The lichen on the church wall: the same fungus species is found elsewhere with a different alga partner. Is the fungus (by itself) one species?
     - No: Go to 4
     - Yes: Go to 5

  4. The salamander ring: six populations in a valley, each neighboring pair interbreeds, but the two at the north end do not interbreed and live side by side. How many species are there?
     - One: Pluralism
     - Two or more: Ecological Species Concept

  5. The salamander ring (as above). How many species?
     - One: General Lineage Concept
     - Two or more: Phylogenetic Species Concept

  Leaves:

  - Biological Species Concept: 
    - Awkward: Doesn't work for asexual organisms or fossils.
    - Volunteer: Maybe (for sexual groups only, with effort)

  - Ecological Species Concept:
    - Awkward: Hard to define and measure the niche.
    - Volunteer: Maybe (observe habitat and role)

  - Phylogenetic Species Concept:
    - Awkward: May split populations into many microspecies; requires lab work.
    - Volunteer: No (not practical in field)

  - General Lineage Concept:
    - Awkward: Vague; no clear threshold for lineage separation.
    - Volunteer: Maybe (use multiple lines of evidence)

  - Pluralism:
    - Awkward: Inconsistent classifications across taxa.
    - Volunteer: Yes (use the concept that fits)

  - Conventionalism:
    - Awkward: Makes species arbitrary, not real.
    - Volunteer: No (not useful for counting)

  Table: The Lathe Question

  | Concept                   | Origin | Membership | Termination | Borrows from (if not covered)          |
  |---------------------------|--------|------------|-------------|----------------------------------------|
  | Biological Species        | No     | Yes        | No          | Lineage concepts for continuity        |
  | Ecological Species        | No     | Yes        | No          | Lineage concepts for duration          |
  | Phylogenetic Species      | No     | Yes        | No          | Phylogeny for origin/termination       |
  | General Lineage Concept   | Yes    | Yes        | Yes         |                                        |
  | Pluralism                 | No     | Maybe      | No          | The concept used in the context        |
  | Conventionalism           | No     | Arbitrary  | No          | Other concepts for classification      |

  Flags:

  - The tree might not cleanly separate Pluralism from other concepts, as a pluralist could be routed to other leaves if they give answers consistent with one concept. The combination for Pluralism in the tree is a catch-all for mixed or inconsistent answers.
  - No combination in the tree is left without a leaf, and all combinations are either defended or covered by the assigned leaf.

  Note: The tree uses the cases to route to the concepts, but real-world decisions may be more complex. Volunteers should be aware that these are simplified philosophical positions.

  This completes the one-page handout.
answer: |-
  ### Species Concept Decision Tree for Volunteers

  **1. Consider the clonal crayfish: all-female, no sex in its life cycle, morphologically distinct. Is it a distinct species?**  
  - **No** → Go to 2  
  - **Yes** → Go to 3  

  **2. Consider the hybrid willow: fertile, self-sustaining, arose from two parent species, doesn't breed with either. Is it a distinct species?**  
  - **Yes** → **Biological Species Concept**  
    - *Awkward commitment:* Cannot handle asexual organisms, fossils, or ring species.  
    - *Volunteer applicable?* Maybe (for sexual organisms only; interbreeding tests are field-feasible with effort).  
  - **No** → **Conventionalism**  
    - *Awkward commitment:* Species are arbitrary human constructs; no objective reality.  
    - *Volunteer applicable?* No (undermines practical counting; relies on tradition or convenience).  

  **3. Consider the lichen: the same fungus is found with different algae partners. Is the fungus alone one species?**  
  - **No** → Go to 4  
  - **Yes** → Go to 5  

  **4. Consider the salamander ring: populations interbreed with neighbors, but the two ends do not interbreed and coexist. How many species?**  
  - **One species** → **Pluralism**  
    - *Awkward commitment:* Inconsistent classifications; no single "right" answer.  
    - *Volunteer applicable?* Yes (use different concepts for different cases).  
  - **Two or more species** → **Ecological Species Concept**  
    - *Awkward commitment:* Requires defining a "niche," which is vague and hard to measure.  
    - *Volunteer applicable?* Maybe (observe habitat/role differences; subjective without ecology training).  

  **5. Consider the salamander ring (same as above). How many species?**  
  - **One species** → **General Lineage Concept**  
    - *Awkward commitment:* Vague thresholds for lineage separation; relies on multiple indirect criteria.  
    - *Volunteer applicable?* Maybe (integrates geography, traits, etc.; complex but field-friendly).  
  - **Two or more species** → **Phylogenetic Species Concept**  
    - *Awkward commitment:* May "oversplit" into microspecies; requires DNA or detailed morphology.  
    - *Volunteer applicable?* No (needs lab work; not feasible with binoculars/hand lens).  

  ---

  ### The Lathe Question: What Does Each Concept Actually Define?  
  *(Answers: "Origin" = Where species starts; "Membership" = What belongs at a time; "Termination" = When species ends)*  

  | Concept                   | Origin | Membership | Termination | Borrows From (if silent)              |  
  |---------------------------|--------|------------|-------------|---------------------------------------|  
  | Biological Species        | —      | ✓          | —           | Lineage concepts for origin/termination |  
  | Ecological Species        | —      | ✓          | —           | Lineage concepts for origin/termination |  
  | Phylogenetic Species      | —      | ✓          | —           | Lineage concepts for origin/termination |  
  | General Lineage Concept   | ✓      | ✓          | ✓           | —                                     |  
  | Pluralism                 | —      | ✓ (varies) | —           | Other concepts used in context        |  
  | Conventionalism           | —      | — (arbitrary) | —         | Other concepts for practical grouping |  

  **Key:**  
  - ✓ = Concept directly addresses this.  
  - — = Concept does not address this; silently borrows from another.  

  ---

  ### Flags and Warnings  
  1. **Indistinguishable Pairs:**  
     - **Pluralism vs. Ecological Species Concept:** If a volunteer uses ecological reasoning for the lichen but lineage reasoning for the salamander ring, they route to Pluralism. However, an Ecological Concept user might also accept pluralism situationally. The tree separates them based on the salamander answer, but real-world decisions may blur.  
     - **General Lineage vs. Phylogenetic Species:** Both say "yes" to the crayfish and lichen fungus. They only split on the salamander ring (one lineage vs. diagnosable clusters). In practice, these often overlap; the tree relies on the ring case to force a choice.  

  2. **Unused Case:** Microbes swapping genes sideways (not needed for routing; all concepts handle it poorly except Pluralism/Conventionalism).  

  3. **Combinations Allowed But Undefended:**  
     - **"Crayfish: No + Salamander: One"** is missing.  
       - *Why?* Biological Concept users (crayfish "no") typically say "two" for the salamander. No one defends this combo—likely **unattractive** (inconsistent for sexual/asexual treatment).  
     - **"Lichen fungus: No + Salamander: One"** routes to Pluralism.  
       - *Why?* Ecological Concept users typically say "two" for the salamander. Defended only if a pluralist mixes concepts—**unexplored** but coherent.  

  **Warnings:**  
  - Cases simplify real biology (e.g., salamander niches unstated; assume coexistence implies ecological divergence).  
  - Volunteers: Focus on "Membership" (counting). "Origin/Termination" are abstract and rarely field-relevant.  
  - Tree biases toward clear splits; ambiguous cases (e.g., willow hybrid) may route differently with more questions.  
  - Practical advice: For Saturday counts, use **General Lineage** or **Pluralism**—they handle most volunteer scenarios.
