  Key points to hit:  
  - Munich/Vietnam as contradictory but always applicable packages.  
  - Surface features over causal analysis (mountains? conference tables?).  
  - Thucydides Trap as a lazy universal law.  
  - Analogies altering the crisis itself (billable, of course).  
  - Survivorship bias in the "casebook."  
  - Depreciation schedule for overused analogies.  

  The Swiftian turn: top-tier service where the recommendation comes before the crisis, revealing the circular logic. Never break character or state the critique explicitly.  

  User’s constraints are clear: no real names, no explaining jokes, American English. The FAQ appendix could add flavor if it feels organic.  

  I’ll structure it like a real consulting doc:  
  - Fake firm name (HistoriSolutions?)  
  - Tiered pricing (Basic → Platinum)  
  - Testimonial from "Defense Dept. client"  
  - Fine print disclosing circularity  

  The challenge is balancing humor with precision. Every joke must stem from real flaws in historical analogy misuse. For example, the "fit rubric" scoring aesthetics while causal analysis is a costly add-on.  

  For the turn, Platinum tier will offer "pre-emptive lesson alignment"—billing for the analogy before the crisis unfolds, with after-action reports confirming it was "always obvious." That’s where the reader flinches.  

  Footnotes should parody academic pretense ("source text modernized for compliance"). Pricing must be absurd ($850k for Thucydides, paid in advance).  

  Survivorship bias note: "Only precedents with successful analogical deployment are retained." Depreciation: "Munich has 3-5 year shelf life."  

  Testimonial: "We got Munich *and* Vietnam for the same crisis!"—highlighting the contradiction as a feature.  

  Final polish: all caps disclaimer about "outcomes not guaranteed," because the real joke is policy made by lazy metaphors.
