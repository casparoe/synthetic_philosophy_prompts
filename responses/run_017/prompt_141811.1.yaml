answer: |-
  Here are five numbered questions with follow-ups:

  1.  If backward causation is metaphysically coherent in time travel cases like the grandfather paradox, why can't it support bilking scenarios generally—like someone in 1920 whose hammer blow tomorrow is caused by the *absence* of a signal from 2050?  
      *Follow-up:* When you say the bilker’s blow is constrained because the signal’s absence (or presence) is already part of the story, is this a constraint on the bilker’s *abilities* (what they can physically do), or is it merely a statement about what *in fact* happens, leaving their capacities untouched?

  2.  Beyond stating that the past doesn't change, what specific action does your distinction between senses of "can" explain the time traveler is *unable* to perform that an ordinary person in a similar local situation *could* perform?  
      *Follow-up:* If the answer is that the traveler is unable to do *nothing* except what actually fails to happen, doesn't this reduce the view to simply asserting the actuality (and thus fixity) of the past—effectively fatalism—and if so, what genuine scope for deliberation about her actions does this leave the traveler in the past?

  3.  In a causal loop—like a musical score in 2024 copied from an 1824 manuscript that itself was a copy of the 2024 score brought back—where does the specific *content* (e.g., the notes on the page) ultimately come from, since it has no external source?  
      *Follow-up:* You suggest loops are no more problematic than unexplained initial conditions, but isn't there a key difference: an initial condition is a brute *starting* point lacking prior explanation, whereas the looped fact seems *never* explained at *any* point in the causal chain? Doesn't this make it genuinely *unexplained*, not merely *initially* brute?

  4.  (*) Suppose a time traveler’s existence doesn’t depend on her grandfather surviving past her father’s conception (e.g., his gamete was frozen before she travels back to kill him): does your "no-change" view predict she *can* succeed in killing him, since her existence isn’t causally tied to his later survival?  
      *Follow-up:* If you agree she *can* succeed in this case, doesn’t your view then imply that in the *standard* grandfather paradox, the consistent failure of the attempt is a massive, unexplained coincidence—a hundred travelers, each with the ability and opportunity, all failing for wildly different, unrelated reasons, with *nothing* in the situation ensuring consistency?

  5.  Is the consistency requirement in your model (e.g., the traveler’s failure) a *metaphysical constraint* on which global histories are possible, or merely a *nomological* feature that *happens* to hold, dependent on the spacetime structures permitted by our physical laws?  
      *Follow-up:* If consistency is purely a conceptual/metaphysical constraint and the physics is "beside the point," how can your model tell us whether time travel is genuinely *possible* in our actual world, or only coherent in some abstract, physics-agnostic sense? Isn’t answering the possibility question for our world inherently tied to physics?

  (*) I'm least confident about the anticipated reply for question 4. Dr. Hallam might *not* bite the bullet and instead argue that the "no-change" view applies universally: even in the gamete case, the grandfather's survival is still a past fact, and her attempt *must* fail for consistency reasons, regardless of the causal independence. Her defense of Lewisian orthodoxy might lead her to extend the "fixed past" reasoning strictly, avoiding the concession that success is possible here. The follow-up about coincidence relies on her conceding the possibility of success in the modified case.
