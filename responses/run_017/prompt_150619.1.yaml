  hey — I need a piece of satire for a little zine I put together for grad students in my cosmology-adjacent department. topic: Boltzmann brains.

  Form: an internal memorandum / "Guidance for Applicants" — numbered sections, deadpan bureaucratic voice, 700-800 words — from whatever funding committee you want to invent (I was thinking something like the Committee on Observational Demographics) that decides which cosmological models get telescope time. It's announcing a new eligibility rule: every submitted model has to include a Typicality Impact Statement estimating its freak-observer yield, and any model whose median observer is a momentary fluctuation out of thermal equlibrium is disqualified.

  The part I actually care about: the comedy has to come from the methodology, not from anyone being dumb. The committee is trying to use "we are not Boltzmann brains" as a constraint for picking a measure, and as the memo tries to apply its own rule it keeps running into the real problems. Give me at least these three:

  (a) the yield depends entirely on how you count — observers per unit volume, per unit time, per observer-moment, per e-fold of inflationary volume, per unit of whatever — and the memo quietly settles on the scheme that saves its own house model;
  (b) to exclude fluctuation brains it has to bolt on a provenance requirement: a mental state only counts as an observation if its memories were inherited from a long causal history rather than assembled out of the ambient heat bath;
  (c) taken seriously, its own rule implies its own deliberations are untrustworthy, since a committee that is mostly fluctuation-brains would produce exactly these minutes anyway.

  Please put in a couple of worked toy numbers — made up is fine — where two equally defensible counting schemes differ by some absurd factor and one gets picked because it doesn't disqualify the committee's favourite model. End with the committee quietly exempting or reclassifying itself.

  Constraints: never break character, no winking, no closing paragraph explaining the joke. Stay deadpan and internally consistent, and let the reductio land because the reasoning is right — don't strawman the freak-observer argument: the brains really are predicted, the counting really is ambiguous, and the provenance fix really is the kind of thing people reach for. The self-sampling bit (reason as if you're a random draw from the observers in your reference class) should be smuggled in as bland administrative common sense. Also it should be funny and legible to a first-year who's only vaguely heard of the Boltzmann brain thing — define everything in the bureaucratic voice itself, no footnotes, no asides from the author. Invent jargon freely (I'm partial to "hereditary memories", "ancestry threshold", "observation-hours", "unsponsored observers") but make it sound like it was photocopied out of a real grant handbook.
