  Failure condition: if burden strength measurement is the core issue, that's a pivot point. The user wants honesty here. Also, is 12 months enough? Probably, but cutting the utilitarian comparison might save time. 

  Non-question-begging arguments are tricky. The committee is skeptical, so grounding in contractualism's own principles without relying on contested intuitions is key. Using structural coherence or avoiding ad-hoc solutions could help. 

