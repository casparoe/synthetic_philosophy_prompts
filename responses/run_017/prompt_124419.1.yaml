answer: |-
  Here’s a sharpened proposal framework targeting the committee’s skepticism and your core insights. It treats your tripartite distinction as genuine but interdependent, focusing the project on *foundations of complaint strength* while explicitly acknowledging the risk that this may dominate the work.

  ---

  **Project Title:** The Structure of Complaints: Disaggregating Aggregation in Scanlonian Contractualism

  ### 1. Precise Question
  *What principled grounds, consistent with contractualism’s core commitment to justifiability *to each person*, justify (a) permitting robust *intra-personal* burden summation while restricting *inter-personal* summation, and (b) determining whether negligible burdens generate *complaints at all*, thereby resolving the apparent paradoxes in aggregation?*

  **Why determinate?** The answer hinges on identifying necessary conditions for a burden to constitute a "complaint" with justificatory force within the contractualist framework and the grounds for comparing complaint-strength *within* vs. *across* lives. Success requires delivering a set of *principled criteria* for (i) complaint existence (vs. non-existence) and (ii) permissible summation domains, not just intuitions about cases.

  ### 2. Why the Standard Dialectic Fails & Your Framing Holds
  Standard approaches conflate distinct challenges, leading to stalemates:
  *   **Headcount (Problem 1):** Dominates literature (e.g., Taurek-style cases). Solutions (e.g., Kavka's ex ante pairwise comparison, Kamm's "weighted lotteries") *assume* complaints exist and focus on comparing *fixed* burdens across persons. They fail to address **why** summation is blocked inter-personally but allowed intra-personally (Problem 2), or what happens when burdens are vanishingly small (Problem 3).
  *   **Intra-Personal Summation (Problem 2):** Often taken for granted (e.g., "life-ruining burden" vs. "minor inconvenience" *for one person*). Contractualists lack a clear, non-ad hoc *principled distinction* grounded in the "to each person" requirement to explain why aggregation is permissible *here* but not *across persons*. This asymmetry is underexplored and critical.
  *   **Threshold Problem (Problem 3):** Undermines the very basis of complaint-based justification (e.g., Parfit's "Harmless Torturers"). Standard moves (e.g., "complicity," "imperceptible harms summing to perceptible damage") often *smuggle in aggregation* or rely on non-complaint-based considerations (e.g., impersonal badness), violating contractualism's agent-relativity. This is distinct: it questions the *existence* of a complaint, not its weight relative to others.

  **Your Framing is Valid:** These are three *interlocking* but distinct problems. (1) assumes complaints exist and are comparable, failing on (2) & (3). (2) reveals a core asymmetry needing justification. (3) threatens the foundation of complaint-based justification itself. Solving aggregation requires tackling all three *together*, focusing on **complaint constitution and comparability**.

  ### 3. Method (12-Month Plan)
  *   **Months 1-2: Diagnostic Mapping:** Rigorously dissect canonical aggregation arguments (Scanlon, Parfit, Kamm, Norcross, Otsuka, Frick, Voorhoeve) and existing critiques. Precisely catalogue *where* and *how* treatments of (1), (2), and (3) diverge or collapse into each other. *Why?* To definitively establish the need for the tripartite framework and identify precise points of failure in existing solutions.
  *   **Months 3-4: Foundations of Complaint Strength:** Analyze the contractualist machinery: What makes a burden a "complaint"? What determines its "strength" for justification? Scrutinize concepts of "standpoint," "reason-giving force," "personal unity," and "significance *to the bearer*." *Why?* This addresses the core worry – the project *will* engage complaint strength directly. This is unavoidable and central, not a side issue. Avoiding bolted-on prioritarianism/utilitarianism here is crucial for integrity.
  *   **Months 5-6: The Asymmetry Challenge (Problem 2):** Develop and test potential principled grounds for the intra/inter-personal summation distinction (e.g., unity of agency/narrative vs. separateness of persons; non-alienability of intra-personal reasons; temporal vs. interpersonal justification). *Why?* To move beyond habit to principle. *Avoids* toy utilitarianism by grounding solely in what can be justified *to each person*.
  *   **Months 7-8: The Existence Threshold (Problem 3):** Investigate criteria for when a burden is sufficiently negligible that it generates *no complaint* (e.g., phenomenological inaccessibility, inability to feature in the bearer's rational standpoint, lack of reason-giving force *even for the bearer*). *Why?* To solve the threshold without illicit aggregation or impersonal values.
  *   **Months 9-10: Synthesis and Model Building:** Integrate findings from M3-8. Construct a unified model specifying: (i) Conditions for complaint existence (resolving Threshold), (ii) Principles for complaint strength comparison *within* a life, (iii) Principles for comparing complaints *across* lives (constraining Headcount via the Asymmetry justification). *Why?* To provide a comprehensive contractualist solution.
  *   **Months 11-12: Robustness Testing & Drafting:** Test the model against extreme/novel cases (e.g., distributed AI microharms, collective action over long timescales). Refine. Write monograph draft and article.

  ### 4. Candidate Conclusions (What Decides Between Them)
  Success hinges on which view best **coheres with contractualism's core tenets** (agent-relativity, justifiability *to each*, no impersonal good) **while resolving the three problems without ad hocery or intuitive fiat**. Key candidates:
  1.  **Principled Asymmetry + Threshold:** Intra-personal summation is justified by the non-alienable unity of personal agency/narrative (grounded in Scanlon's "Value of Choice"), while inter-personal summation is ruled out by separateness. Thresholds exist where burdens cannot feature in a subject's rational standpoint. *Decider: Coherence of "unity of agency" with contractualism; plausibility of the rational standpoint threshold.*
  2.  **Revised Complaint Basis:** Complaints are tied to *impediments to pursuing justifiable life plans*. Intra-personal burdens sum as they cumulatively impede *one plan*. Inter-personal burdens resist summation as they impede *distinct plans*. Thresholds exist where impediments are undetectable/irrelevant to *any* plan pursuit. *Decider: Whether "life plans" can be defined non-circularly and provide sufficient structure.*
  3.  **No Pure Summation, Only Holistic Justification:** Reject direct summation. Justification requires assessing the overall "package" of burdens/benefits *for each individual* holistically against alternatives. Headcount matters indirectly via how individuals fare holistically. Threshold burdens vanish as they don't alter the holistic package *for anyone*. *Decider: Whether holistic assessment collapses into aggregation or remains agent-relative.*
  4.  **The Slippery Slope Wins:** The attempt to ground the asymmetry and threshold reveals that complaint strength *is* fundamentally prioritarian/aggregative in a way contractualism cannot accommodate without collapse. *Decider: Failure to find non-aggregative principles for (2) & (3).*
  5.  **Complaint Strength is Primitive (But Structured):** The asymmetry and threshold reflect irreducible, structured properties of complaints themselves (e.g., burdens have "personal weight" allowing intra-sum, but "interpersonal weight" blocking sum). *Decider: Whether this avoids being mysterious intuition-mongering.*

  ### 5. Failure Conditions & Risks
  *   **Clear Failure:** The project conclusively demonstrates that **any resolution of Problems 2 & 3 unavoidably and centrally depends on a prior, unanalyzable, intuitive ranking of complaint strengths** that does no substantive justificatory work beyond restating intuitions. This would confirm the committee's skepticism, rendering the year wasted *for this specific aim*. (But yields a valuable negative result).
  *   **Core Risk (Your Worry is Valid):** This project **will** become centrally about the nature and measurement of complaint strength. This is not a side issue; it is *the* issue revealed by disaggregation. The proposal *embraces* this. Success means providing a *principled, non-intuition-based account* of complaint strength that resolves (2) & (3). Failure means being unable to move beyond intuitions.
  *   **Scope Management:** 12 months is *tight* but feasible for a focused theoretical analysis. **Cut:** Extensive comparison to utilitarian/prioritarian benchmarks (mention only to show contrast/difference). Focus purely on *internal* contractualist development. Don't cut the foundational work on complaint strength (M3-4) – it's essential.

  ### 6. Non-Question-Begging Argument for Skeptics
  Arguments must **avoid relying on contested intuitions about specific aggregation cases** and instead focus on:
  1.  **Structural Coherence:** Demonstrating that resolving (2) & (3) is *necessary for the internal consistency* of contractualism's core machinery (e.g., without a threshold, the "complaint" concept becomes incoherent; without an asymmetry, the "to each person" requirement lacks determinate implications for summation).
  2.  **Explanatory Power:** Showing how the proposed principles *systematically resolve* persistent paradoxes (Harmless Torturers, Life-Saving vs. Headaches) *better* than alternatives *without* introducing greater ad hocery or violating core commitments.
  3.  **Conceptual Necessity:** Arguing that the proposed grounds for complaint existence/asymmetry (e.g., unity of agency, rational standpoint) are *conceptually entailed* by the very idea of agent-relative reasons or justification *to a person* that contractualism presupposes.
  4.  **Avoiding Collapse:** Proving the solution doesn't functionally reduce to an aggregative or prioritarian model in disguise.

  **Key Pitch to Skeptics:** "Contractualism's value hinges on whether it can handle burdens systematically, not just in easy cases. Disaggregation reveals that the real challenge isn't headcounts; it's whether contractualism has the *resources* to define complaints and their comparability rigorously enough to handle summation asymmetries and vanishing burdens. This project either secures those resources or shows conclusively that contractualism lacks them – a result of equal importance."

  ---
  **Summary:** This proposal leverages your key insight – that aggregation's core problems are about complaint constitution (Threshold) and comparability domains (Asymmetry) – to reframe the debate. It tackles the committee's skepticism head-on by making complaint strength the explicit, central focus, not a hidden assumption. The project either provides contractualism with the tools to solve its hardest problem on its own terms or delivers a fatal negative result. The 12-month plan is ambitious but focused, prioritizing internal development over external comparison. The risk of bottoming out in complaint strength is acknowledged and embraced as the core challenge.
