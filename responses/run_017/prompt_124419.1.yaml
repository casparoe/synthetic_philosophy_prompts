  The user's main request is to structure this into a solid proposal. Key elements include a precise question, why existing approaches fail, whether the three-problems framing holds up, a detailed method, possible conclusions, and a failure condition. They're especially worried that everything might boil down to measuring complaint strength, and if so, they'd rather focus on that directly.

