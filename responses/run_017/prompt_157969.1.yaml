prompt: |-
  I'm an ML person (mostly large-scale model selection work: hyperparameter and architecture searches, Bayesian model comparison, forecasting) and I got into an argument at a workshop last month with a friend who does cosmology-adjacent theory. She claims that the string landscape / multiverse picture can be rationally supported even though it isn't making clean new predictions, and she leaned on three arguments I half remember from some philosophy-of-physics book I never read: (1) the no-alternatives argument — decades of very smart people have looked for a consistent competitor framework and nothing viable has turned up, and that absence is itself evidence; (2) the unexpected-interconnections argument — the framework was built to do one job and then turned out to deliver results nobody designed it for (a spin-2 graviton-like state falling out of it, the right counting of black-hole microstates), and that kind of unplanned convergence is confirmatory; (3) a meta-inductive argument — this research programme has a track record of producing novel predictions that later checked out, so its own judgments deserve trust in the absence of fresh data. She also brushed off the objection that earlier generations could have run the very same argument for theories that later died, and she said something about the multiverse's measure problem being a technical nuisance rather than a refutation. I want this translated, not explained in general terms.

  So: restate each of those three arguments as faithfully as you can in the vocabulary I actually use — hypothesis spaces and model classes, priors over them, likelihoods, marginal likelihood and Bayes factors, the Occam penalty for spreading predictive mass thinly, cross-validation and held-out data, over- and under-fitting, identifiability and weak identifiability, the look-elsewhere effect and multiplicity, the garden of forking paths, search over an architecture space, no free lunch, explore/exploit in allocating compute, expected value of information. Assume I'm fluent in all of that up to roughly the level of a practitioner, and that I have no philosophy-of-science background beyond pop books. I also want you to try one specific construction of mine rather than the standard one: I've been thinking of the no-alternatives argument as a likelihood over the *output of a search procedure* — something like P(a search over hypothesis space S with effort E returns no viable competitor | H is false), a "search-effort likelihood" — because in my world we do run enormous sweeps and sometimes only one family survives, and I want to know whether that survival-of-the-search is ever legitimately treated as evidence in ML practice, whether it has a name, whether it should be, and how sensitive it is to my assumptions about how much of S the search actually covered and about the base rate of viable alternatives in S. Please don't quietly replace my construction with a cleaner one and call it a translation; if my version is broken, say why and then give the better one.

  Then the residue report, which is the part I actually care about. For each of the three: what carried over cleanly, what only fit after you distorted it, and what has no expression in my vocabulary at all. In particular: (a) can the distinction between "worth pursuing" and "probably true" be rendered as explore/exploit or as expected-value-of-information versus posterior, or does something like rational credence simply have no counterpart in how I allocate compute? (b) the "it predicts everything, therefore nothing" worry about the multiverse — in my terms is this just an over-flexible model class with a diffuse prior, i.e. a flat likelihood plus an Occam penalty, and does that framing make the objection stronger or weaker than the way philosophers state it? Does the extra step of conditioning on observers surviving (the anthropic bit) map onto any selection-bias or survivorship correction I know, or is there a typicality/reference-class question left over that my vocabulary can't even pose? (c) the objection about unconceived alternatives — is that just "your search space was misspecified" (an optimizer failure, fixable in principle), or does my framing trivialize it into an engineering bug when the real point is that the space of alternatives isn't enumerable in advance, which sounds to me like it should connect to no-free-lunch and to the impossibility of a prior over all hypotheses? (d) "explanatory depth" or understanding: my vocabulary tracks predictive accuracy and generalization and nothing else, so is there anywhere to put it, and is that a real gap in my framework or a sign the philosophical notion was never sharp? For every item say whether the residue is a defect of my framework or a sign that the original claim was doing less work than it looked like it was doing.

  One last thing on tone: I'd like you to be explicit about your own commitments. Separate what is basically settled (the Bayesian machinery, what a flat likelihood does, the logic of selection effects) from what is genuinely contested among people who work on this (whether non-empirical arguments can move credence at all or only justify spending more resources, how badly the measure problem actually damages the multiverse case, whether the meta-inductive argument is sound) and don't present a contested position as the consensus. Where your translation is your own invention rather than something philosophers would recognize, mark it and say how confident you are in it; and flag any place where my ML framing is smuggling in an assumption and calling it a neutral translation — e.g. if assuming a prior over hypotheses, or assuming that all confirmation is likelihood-ratio-shaped, quietly settles the question before it's asked.
reasoning: |-
  We are going to break this down step by step.

  First, the user is an ML practitioner with a background in model selection, Bayesian methods, forecasting, etc. They had an argument with a friend in cosmology about the string landscape/multiverse. The friend presented three arguments:

  1. **No-Alternatives Argument (NAA)**: Decades of smart people searching for alternatives and finding none is evidence for the current theory.
  2. **Unexpected Interconnections Argument (UIA)**: The theory was built for one purpose but then delivered unplanned results (like a graviton emerging, black hole microstates) which is confirmatory.
  3. **Meta-Inductive Argument (MIA)**: The research program has a track record of producing novel predictions that were later confirmed, so it deserves trust even without fresh data.

  The user wants these arguments translated into their ML vocabulary. They also propose a specific construction for the NAA: treating the absence of alternatives after a search as a likelihood over the output of a search procedure. They want to know if this is legitimate in ML, its name, and how sensitive it is to assumptions.

  Then, they want a residue report for each argument: what carries over cleanly, what is distorted, and what has no expression in their vocabulary. They also have specific questions (a, b, c, d) about distinctions, the multiverse objection, unconceived alternatives, and explanatory depth.

  Finally, they want me to be explicit about my own commitments, separate settled from contested issues, and flag where the translation might be smuggling in assumptions.

  ### Step 1: Translate the three arguments

  #### Argument 1: No-Alternatives Argument (NAA)

  **Original**: The absence of viable alternatives after extensive search is evidence for the theory.

  **User's construction**: P( search over hypothesis space S with effort E returns no viable competitor | H is false ) as a likelihood. They want to know if this is used in ML, what it's called, and its sensitivity.

  **Translation in ML terms**:

  We have a hypothesis space S. We are considering a model H (the string landscape/multiverse). We run a search procedure (e.g., hyperparameter sweep, architecture search) over S with effort E (e.g., compute budget, researcher-years). We observe that no viable competitor to H is found. We want to use this as evidence for H.

  In Bayesian terms, we might set up:

  - Let H: the hypothesis that H is true (or that H is the only viable model in S?).
  - But note: H being false might mean there is at least one viable alternative, or that H is not the true model.

  The user's likelihood: P(no viable competitor found in search | H is false)

  But note: H being false doesn't necessarily mean there is a viable alternative. We have to define:

  - Let A: the event that at least one viable alternative exists in S.
  - Then, H being false might be equivalent to A being true? Not exactly. H might be false and no alternative exists? Then we are stuck. But in the context, the argument is that if H were false, we would expect an alternative to exist and be found.

  Actually, the NAA is often presented as: if there were a viable alternative, it would have been found by now. So:

  Let F: the event that the search returns no viable competitor.

  We are interested in P(H | F) ∝ P(F | H) * P(H)

  But note: if H is true, then there are no viable alternatives (because H is the truth and alternatives are false?), but that might not be the case. The argument is that H is the only viable one, so if H is true, then no alternative is viable, so F is certain.

  But the user's likelihood is P(F | H is false). If H is false, then there might be viable alternatives (A) or not. We can break it down:

  P(F | H false) = P(F | A) * P(A | H false) + P(F | not A) * P(not A | H false)

  But if H is false and not A (no viable alternative exists), then we are in a situation where H is false and there's no alternative, so F (no competitor found) is certain. But then we might not have a viable theory at all.

  The argument assumes that if H were false, then there would be viable alternatives that the search would have found. So, if no alternative is found, it suggests that there are no alternatives, hence H must be true.

  In ML terms, we can model:

  - Let A: the event that at least one viable alternative exists in S.
  - We are interested in P(A | F) and how it relates to H.

  But note: H being true doesn't necessarily imply that no viable alternative exists (because there could be multiple true models). However, in the context of fundamental theories, we assume there is one true model? Or at least one that we can hope to find.

  Alternatively, we can think of H as being the only viable candidate we have, and we want to know if it is true.

  The user's construction:

  Likelihood: P(F | not H) = P(no viable competitor found | H is false)

  But H being false doesn't tell us about the existence of alternatives. So we need to include the existence of alternatives.

  We might introduce:

  - θ: the number of viable alternatives in S (could be 0,1,2,...)
  - We have a prior over θ: P(θ=k)
  - Then, the search procedure has a detection probability: P(F | θ=k) = P(no viable competitor found | there are k viable alternatives)

  This depends on the search: if k>0, then P(F | θ=k) is the probability that the search misses all k. This is (1 - d)^k if each has independent probability d of being found (with d depending on E). But they might not be independent.

  The user's likelihood is P(F | H false). But H false doesn't specify θ. We can write:

  P(F | H false) = sum_{k>=1} P(F | θ=k) * P(θ=k | H false)

  But note: if H is false, then θ>=1? Not necessarily: H being false doesn't imply θ>=1 because there might be no viable alternative at all (and then we are in trouble). The NAA assumes that if H is false, then there must be a viable alternative? Not necessarily. So the argument is weak if we allow the possibility that there are no viable alternatives even if H is false.

  In the context of fundamental physics, they assume that there must be a viable theory. So we condition on there being at least one viable theory (either H or an alternative). Then, the argument is:

  We have two possibilities: H is true or an alternative is true (and H is false). We search and find no alternative. Then, the probability of this observation is:

  P(F | alternative is true) = P(search fails to find an alternative | there is at least one alternative)

  This is the probability of a false negative in the search.

  So, if that probability is low (i.e., the search is thorough), then F is evidence against the existence of an alternative, hence in favor of H.

  In Bayesian terms:

  Let T be the true theory. We have two hypotheses: T=H or T in S_H (the set of alternatives).

  But note: the alternatives are in S excluding H? So the hypothesis space is S = {H} ∪ S_H.

  We assume that exactly one of these is the true model (or at least viable). We are interested in P(T=H | F) and P(T in S_H | F).

  We can set:

  - Prior: P(T=H) = p, P(T in S_H) = 1-p (with the understanding that S_H is non-empty? Or we have to account for the possibility that there is no viable theory? But we condition on there being one.)

  To avoid that, we condition on there being exactly one viable theory (which might be H or in S_H). Then:

  P(T=H | F) / P(T in S_H | F) = [P(F | T=H) / P(F | T in S_H)] * [P(T=H) / P(T in S_H)]

  Now, P(F | T=H) = 1 because if H is true, then there are no viable alternatives (by assumption, we have one true model) so the search will not find an alternative (or if it does, it's wrong, but we are only considering viable ones).

  P(F | T in S_H) = P(no viable competitor found | the true model is in S_H and there is at least one viable alternative in S_H). But note: the true model is in S_H, and we are searching for viable alternatives. The event F is that no viable alternative is found. But if the true model is in S_H, then there is at least one viable alternative (the true model itself). So F means we failed to find any viable alternative, including the true one.

  So P(F | T in S_H) = P(search fails to find the true model and any other viable alternatives | T in S_H)

  But if we assume that the true model is the only viable one? Or there might be multiple. This is messy.

  A simpler approach: let A be the event that there exists at least one viable alternative to H (in S_H). Then:

  We want P(H | F) ∝ P(F | H) P(H)

  If H is true, then there are no viable alternatives (since H is the truth and alternatives are not true, hence not viable? But viability might include being consistent with data, etc.). So P(F | H) = 1.

  P(F | not H) = P(F | not H and A) * P(A | not H) + P(F | not H and not A) * P(not A | not H)

  But if not H and not A, then there are no viable theories at all. In that case, F (no viable competitor found) is certain. But we are assuming that we have a viable theory? The argument is made in the context where H is a candidate and we are considering whether to accept it. So if not H and not A, we are in a bad state. The NAA typically assumes that if H is false, then A is true (there is a viable alternative). So P(A | not H)=1? Then P(F | not H) = P(F | A)

  And P(F | A) is the probability that the search fails to find any viable alternative given that at least one exists.

  So:

  P(H | F) / P(not H | F) = [P(F|H) / P(F|not H)] * [P(H)/P(not H)] = [1 / P(F|A)] * [P(H)/P(not H)]

  So the strength of the evidence depends on P(F|A): if P(F|A) is small (the search is very thorough and would have found an alternative if it existed), then the evidence for H is strong.

  In ML, we sometimes encounter this when we do a large hyperparameter sweep and only one model family (say, deep networks) works well. We then take that as evidence that this family is the right one. But we know that this is only as good as the search space and the search effort.

  In ML practice, we are cautious because:

  - The search space S might be misspecified: we might not have included the true model.
  - The search might not be exhaustive: P(F|A) might be high because we didn't look hard enough.

  This is similar to the "no free lunch" theorem: without assumptions about the search space, we cannot conclude much.

  **Name**: In ML, this is related to the concept of **search efficiency** or **coverage**. We might call it the **argument from negative search results**. It is also related to **Bayesian model comparison with a discrete set of models**, but the twist is the negative evidence.

  **Legitimacy**: It can be legitimate if we have a well-defined search space and we can estimate the coverage (i.e., the probability of missing a viable alternative). But in practice, we often don't have a prior over the existence of alternatives. We might use the fraction of the space searched as a proxy.

  **Sensitivity**: Highly sensitive to:

  - The prior P(A | not H): if we think it's likely that there is an alternative, then negative search is strong evidence. If we think alternatives are rare, then negative search might occur even if they exist.
  - The coverage of the search: if we only searched 1% of the space, then P(F|A) is high, so negative search is weak evidence.
  - The base rate of viable alternatives in S: if the space is sparse (viable models are rare), then even a thorough search might miss one.

  In ML, we sometimes use this informally: "we tried everything and only this worked." But we know it's heuristic.

  #### Argument 2: Unexpected Interconnections Argument (UIA)

  **Original**: The theory was designed for one purpose but then solved problems it wasn't designed for, which is confirmatory.

  **Translation in ML terms**:

  Consider a model H that was developed to fit a dataset D1 (e.g., string theory was developed to unify gravity and quantum mechanics). Then, it turns out that H also fits a different dataset D2 (e.g., it predicts a graviton, black hole entropy) without being explicitly tuned for it.

  This is like a model performing well on a **held-out validation set** that was not used for training or architecture selection. In ML, we value generalization to unseen data.

  We can formalize with Bayes:

  The likelihood for H on the new data D2: P(D2 | H, D1) (note: if H was not fit to D2, then this is the marginal likelihood for D2 under H, which might be high if H predicts D2 well).

  The support for H increases because:

  P(H | D1, D2) ∝ P(D1, D2 | H) P(H) = P(D1 | H) P(D2 | H, D1) P(H)   (if D1 and D2 are independent given H)

  But note: if H was fit to D1, then P(D1|H) is high by design. The key is P(D2|H, D1): if H was not fit to D2, then this is the predictive performance on D2.

  If P(D2|H, D1) is high, then H gets a boost in posterior probability.

  In ML, we often use cross-validation: we train on one set and test on another. Good performance on the test set is evidence of good generalization.

  Additionally, if the model was not designed for D2 (i.e., the features or architecture were not chosen to fit D2), then it's even stronger evidence because it avoids overfitting.

  This is similar to **transfer learning**: a model trained for one task performs well on a different task without fine-tuning.

  **Confirmatory power**: The key is that the model had high **predictive accuracy** on data it was not optimized for. This is strong evidence against overfitting and for the model's robustness.

  #### Argument 3: Meta-Inductive Argument (MIA)

  **Original**: The research program has a track record of producing novel predictions that were confirmed, so even without new data, we should trust it.

  **Translation in ML terms**:

  This is like **model selection based on past performance**. For example, we have a model class (e.g., a neural network architecture) that has consistently performed well on many tasks (i.e., it has high **empirical risk minimization** across multiple datasets). Then, for a new task, we might choose this architecture even before seeing the new data, because of its prior performance.

  In Bayesian terms, we can think of a hierarchical model:

  - Let M be the model class (e.g., string theory research program).
  - We have observed that in the past, when M was applied to problems, it produced models that made novel predictions and they were confirmed (i.e., high likelihood on the data).

  So, for a sequence of datasets D1, D2, ..., Dn, models from M achieved high likelihoods (or good generalization).

  Then, for a new problem (with data D_{n+1}), the prior for a model from M is high because of its track record.

  This is similar to **Bayesian hierarchical modeling**: we have a prior over model classes, and we update it based on their performance on multiple tasks.

  We can also think of it as **empirical Bayes**: we use past data to set the prior for the model class.

  In ML, we do this when we choose an architecture that has worked well in the past (e.g., ResNet for image tasks) or when we use a pre-trained model.

  The trust comes from the **expected generalization performance** based on historical data.

  ### Step 2: Residue Report

  For each argument, we report:

  - What carried over cleanly: aspects that map directly to ML concepts without distortion.
  - What only fit after distortion: aspects that required some adjustment or are not a perfect fit.
  - What has no expression: concepts that don't exist in the ML vocabulary.

  Then, we address the specific questions (a, b, c, d) in the context of the arguments.

  #### For NAA:

  - **Carried over cleanly**:
    - The idea that a thorough search over a hypothesis space with no positive results can be evidence for the only remaining candidate is familiar in ML model selection. We often use the failure to find a better model as evidence that the current one is good (or the best available).
    - The dependence on search effort (E) and the size of the search space is well understood.

  - **Distorted to fit**:
    - In physics, the hypothesis space is not well-defined (it's the set of all possible theories) and is not enumerable. In ML, we usually work with a predefined, finite (though large) set. The translation assumes we can define S and the search coverage, which is often not possible in physics.
    - The assumption that if H is false then a viable alternative exists and would have been found is strong. In ML, we often don't make that assumption because we know our search space might be incomplete.

  - **No expression**:
    - The notion of a "viable" theory in physics includes consistency with existing data and theoretical consistency (e.g., mathematical consistency). In ML, we only care about predictive performance on data. Theoretical consistency (like mathematical rigor) has no direct counterpart.

  **User's specific construction**:
  The user's likelihood P(no viable competitor found | H false) is a valid starting point, but we had to refine it by conditioning on the existence of alternatives. In ML, we might model:

  - Let p_miss = P(miss a viable alternative | one exists) which depends on E and the search algorithm.
  - Then, if we assume that the number of viable alternatives is Poisson(λ) with λ small, then P(no find | at least one exists) ≈ 1 - e^{-λ * (1 - p_miss)} which for small λ is about λ * (1 - p_miss). But without a prior on λ, it's hard.

  In ML, we don't have a standard name for this, but it's similar to the **probability of improvement** in Bayesian optimization when no improvement is found.

  **Legitimacy in ML**: Yes, it is used, but cautiously. We might say: "after a grid search over 100 hyperparameters, only these settings worked." But we know it's not proof. The evidence strength depends on:

  - How well-defined S is.
  - The coverage of the search (if random search, we can estimate the probability of missing a good point).
  - The base rate: if good models are rare, we might miss them.

  **Sensitivity**: Very sensitive to:
  - The prior belief about the existence of alternatives (if you start with a high prior that there is an alternative, then negative search is strong evidence for H).
  - The coverage: if the search covers only 1% of S, then P(F|A) is high, so the evidence is weak.
  - The independence and distribution of viable alternatives: if they are clustered, even a sparse search might find one.

  #### For UIA:

  - **Carried over cleanly**:
    - The idea of generalization to held-out data is central in ML. A model performing well on data it wasn't trained on is strong evidence against overfitting.
    - The analogy to cross-validation is direct: we use one dataset for training (architectural design) and a separate one for testing.

  - **Distorted to fit**:
    - In physics, the "data" D2 might not be empirical data but theoretical results (like the graviton emerging). In ML, we only have empirical data. So we are mapping theoretical consistency to predictive accuracy, which is a stretch.
    - The unexpectedness: in ML, we don't have a good way to quantify how "surprising" a prediction is. We only measure accuracy.

  - **No expression**:
    - The concept of "explanatory depth" or understanding: in ML, we care about prediction, not explanation. So the fact that string theory provides a unified explanation doesn't map to anything.

  #### For MIA:

  - **Carried over cleanly**:
    - Using past performance on multiple tasks to inform prior beliefs about a model class is common in ML (e.g., pre-trained models, architecture selection based on benchmarks).
    - This is similar to empirical Bayes or hierarchical modeling.

  - **Distorted to fit**:
    - In physics, the "tasks" (problems solved) are not independent or identically distributed. In ML, we often assume tasks are similar (same distribution). The mapping requires assuming that the future problem is like the past ones.
    - The track record includes non-empirical successes (like theoretical consistency) which don't map to data.

  - **No expression**:
    - The idea of a "research program" as a dynamic entity that evolves over time has no counterpart in static model classes. In ML, we select a fixed model class, but in science, the program might generate new models.

  ### Addressing the specific questions:

  (a) **The distinction between "worth pursuing" and "probably true"**:

  In ML, this maps to **explore/exploit trade-off** and **expected value of information (EVI)**. 
  - "Worth pursuing" is about EVI: we invest resources (compute, time) in exploring a model class if we expect that it might yield high returns (e.g., better performance). This is a decision under uncertainty.
  - "Probably true" is about the posterior probability: our belief that the model is correct.

  The two are related but distinct. We might pursue a model that is unlikely to be true if it has high upside (e.g., in bandits, we explore arms with high uncertainty and high potential). Similarly, in science, we might pursue a theory that is not yet probable because it has high potential if true.

  However, in the ML vocabulary, we don't have a direct way to assign "probability of being true" to a model. We only have predictive performance. So for a model that is not true but useful (like an approximation), we still use it. The concept of "truth" is not central in ML; we care about utility.

  So the residue: 
  - Cleanly: explore/exploit and EVI capture the "worth pursuing" part.
  - Distortion: "probably true" is mapped to high posterior predictive performance, but in physics, "truth" means more than just predictive accuracy (e.g., correspondence to reality). This is a gap in the ML framework for the physics context.

  (b) **The multiverse's "predicts everything, therefore nothing"**:

  In ML terms, this is an **overflexible model class with a diffuse prior**. The multiverse can predict any observation by invoking a universe where that happens. So the likelihood P(D|H) is flat (or very spread out). Then, in Bayesian model comparison, it gets a large **Occam penalty** (the marginal likelihood is low because the prior is spread thin).

  The anthropic conditioning (conditioning on observers existing) is a **selection effect**. We only observe data in universes where observers exist. So we have to condition on that.

  In ML, selection effects can be modeled by:
  - Defining the selection event: we only see data that passes some filter (e.g., we only observe users who clicked on an ad).
  - Then, the likelihood is P(D | H, selection) = P(D | H) / P(selection | H)  if D implies selection.

  But in the multiverse, the selection is by the existence of observers. So for a given observation D, we have to compute P(D | H, observers exist). This can be done if we have a measure over the universes and a function that says whether observers exist in a universe.

  The problem is the **measure problem**: we don't know how to assign probabilities to different universes. Without that, we cannot compute the likelihood.

  In ML terms, this is like having a model class with no specified prior. We cannot do Bayesian inference without a prior.

  The framing in ML makes the objection stronger because it shows that without a well-defined prior and likelihood, the model is not testable. The Occam penalty alone would penalize the model for its flexibility, but the measure problem prevents us from even computing the penalty.

  The residue: 
  - The typicality/reference-class question: in the anthropic argument, we need to specify what counts as an observer and what is typical. In ML, we don't have a way to incorporate such philosophical questions. This is a gap.

  (c) **Unconceived alternatives**:

  This is the worry that there might be alternatives we haven't thought of.

  In the user's framing, it is "your search space was misspecified". In ML, this is a common problem: if the true model is not in S, then no amount of search will find it. This is an **optimizer failure** due to limited expressivity.

  But the point in philosophy is that the space of all possible theories is not enumerable. This connects to **no-free-lunch (NFL) theorems**: without assumptions, no model is better than any other. We need to restrict the hypothesis space.

  However, NFL is about worst-case performance over all possible functions. In practice, we assume that real-world problems have structure.

  The residue:
  - The user's framing does trivialize it as an engineering bug (we can fix by expanding S). But the philosophical point is that we cannot enumerate all alternatives, so we can never be sure. This is a fundamental limitation.
  - The ML vocabulary does include the idea that we cannot have a prior over all computable functions (e.g., Solomonoff induction is incomputable). So we recognize the issue, but in practice, we work with restricted spaces.

  (d) **Explanatory depth**:

  In ML, we only care about predictive accuracy and generalization. We have no notion of "understanding" or "explanatory depth". If a model predicts well, we use it, even if it's a black box.

  So there is nowhere to put explanatory depth in the ML vocabulary. This is a real gap if we believe that explanation is important for science. However, in ML, we might argue that prediction is all we need (e.g., in forecasting). But for fundamental theories, explanation might be seen as a proxy for generalization or robustness.

  The residue: 
  - It is a defect of the ML framework for the purpose of fundamental science, where explanation is valued. But it also suggests that the philosophical notion of "explanatory depth" might be less sharp than predictive accuracy.

  ### Step 3: Tone and Commitments

  I will be explicit about settled vs contested issues.

  - **Settled**:
    - Bayesian machinery: the math of Bayes' theorem, marginal likelihood, Occam's razor as a consequence of Bayesian model comparison.
    - Selection effects: conditioning on selection events is standard in Bayesian inference (e.g., in survival analysis).
    - The impact of a diffuse prior (flat likelihood) leading to low marginal likelihood is settled.

  - **Contested**:
    - Whether non-empirical arguments (like NAA, UIA, MIA) can move rational credence (i.e., change the posterior) or only justify resource allocation. Some philosophers (e.g., Dawid) argue they can, while others (e.g., traditional Bayesians) say that without data, there is no likelihood, so no update.
