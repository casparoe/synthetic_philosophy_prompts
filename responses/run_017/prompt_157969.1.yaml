  ### Translation of the Three Arguments into ML Vocabulary

  I'll restate each argument in your specified ML vocabulary, preserving your construction for the no-alternatives argument. I'll use precise terms like hypothesis spaces, priors, likelihoods, Bayes factors, Occam penalties, cross-validation, search procedures, etc. For each argument, I'll provide the translation and address your questions about legitimacy, sensitivity, and residue. I'll be explicit about where my translation is inventive or contested.

