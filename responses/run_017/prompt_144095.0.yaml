answer: |-
  **MINUTES OF THE THIRD MEETING OF THE AD HOC COMMITTEE ON THE NAMING OF THE INTERDISCIPLINARY BUILDING**  
  **Date:** Tuesday, October 26, 2024  
  **Time:** 3:00 PM - 5:15 PM  
  **Location:** Conference Room 7B, Administration Hall  

  **1. Present:**  
  *   Dr. Alistair Finch (Chair, Classics)
  *   Prof. Brenda Chen (Mathematics)
  *   Dr. Reginald Thorne (Economics)
  *   Prof. Elara Vance (Biochemistry)
  *   Dr. Silas Croft (Philosophy)
  *   Ms. Fiona Greaves (Graduate Student Representative, Urban Planning)
  *   Mr. Desmond Pike (Administrative Liaison)

  **2. Apologies for Absence:**  
  *   None recorded.

  **3. Old Business:**  
  The Chair (Dr. Finch) recalled the consensus reached at the previous meeting concerning the fundamental desiderata for any voting procedure employed by the Committee to aggregate individual member rankings into a single, definitive committee ranking of the proposed names. The Committee formally adopted the following four conditions, deemed essential for procedural equity and robustness:

  > **Condition 1 (Universality):** Any logically possible individual ranking of the shortlisted names by a Committee member must be admissible as input.  
  > **Condition 2 (Unanimity):** If every Committee member ranks Name A higher than Name B, then the Committee’s final ranking must also rank A higher than B.  
  > **Condition 3 (Independence of Irrelevant Alternatives - IIA):** The Committee’s relative ranking of any two names (e.g., A vs. B) must depend *only* on the individual members’ rankings of A and B, and *not* on how they rank any other name(s) (e.g., C, D, etc.) relative to A or B or each other.  
  > **Condition 4 (Non-Dictatorship):** There is no single Committee member such that, whenever they strictly prefer Name A to Name B, the Committee’s ranking strictly prefers A to B, regardless of the preferences of other members.^1

  The Chair noted that the Committee had spent considerable time attempting to identify a voting rule satisfying all four conditions simultaneously but had thus far been unsuccessful. The purpose of this meeting was to rigorously explore potential solutions.

  **4. New Business:**  
  **4.1 Review of Procedural Impasse:** Prof. Chen (Mathematics) provided a concise overview, referencing the "Arrow Impossibility Theorem" as formally describing the difficulty encountered: no voting rule converting individual ordinal preferences into a complete and transitive social ordering can simultaneously satisfy Conditions 1 through 4 when three or more options are considered. The current shortlist comprises five names: "The Convergence Centre," "The Founders' Forum," "Horizon Hall," "The Nexus," and "The Synergy Nexus."^2

  **4.2 Exploration of Alternative Voting Methodologies:**  
  *   **4.2.1 Restriction of Preferences (Domain Restriction):** Dr. Thorne (Economics) proposed that the problem stemmed from the excessive diversity of permissible rankings under Condition 1. He suggested restricting admissible preferences to those exhibiting "single-peakedness" along a defined ideological or aesthetic axis relevant to building names. Dr. Croft (Philosophy) inquired as to the nature of this axis. Dr. Thorne postulated it could relate to "Tradition vs. Innovation" or "Specificity vs. Abstraction." Prof. Vance (Biochemistry) moved the formation of a Subcommittee on Preference Axis Definition and Faculty Alignment, charged with devising a suitable axis and ensuring faculty preferences conformed to single-peakedness thereon. After discussion, Mr. Pike (Administrative Liaison) raised concerns regarding the feasibility of enforcing preference structures upon the wider faculty body and the potential timeline implications. The motion was **referred** to the Committee as a whole for further consideration at a future date, pending a feasibility report to be drafted by Mr. Pike.
  *   **4.2.2 Abandonment of Condition 3 (IIA) - Borda Count:** Prof. Vance (Biochemistry) proposed adopting the Borda Count method, assigning points based on rank position (e.g., 4 points for 1st choice, 3 for 2nd, etc.) and summing for each name. Ms. Greaves (Grad Rep) expressed support for its simplicity. Dr. Croft (Philosophy) immediately noted that Borda Count explicitly violates Condition 3 (IIA), as the introduction or removal of a third name (e.g., "The Synergy Nexus") could alter the relative point difference between two other names (e.g., "Convergence Centre" and "Founders' Forum"), even if no member changed their relative ranking of those two. Dr. Thorne (Economics) concurred, adding that this violates the "no spoilers" principle.^3 The Committee acknowledged Condition 3 violation and **rejected** the Borda Count.
  *   **4.2.3 Cardinal Utilities and Interpersonal Comparisons:** Dr. Croft (Philosophy) tentatively suggested moving beyond mere rankings to cardinal utility scores (e.g., members assign scores like 0-100 to each name), allowing summation. Dr. Finch (Chair, Classics) inquired how interpersonal comparisons of utility (e.g., is Prof. Chen's "70" for "The Nexus" equivalent to Ms. Greaves's "70") could be meaningfully established. Prof. Chen (Mathematics) noted the significant theoretical and practical challenges in calibrating and comparing subjective intensities across individuals. Mr. Pike (Administrative Liaison) expressed concern about the subjectivity and potential for strategic misrepresentation. The proposal was deemed **impractical**.
  *   **4.2.4 Outputting Only a Winner:** Ms. Greaves (Grad Rep) suggested abandoning the goal of a full ranking and simply selecting a single winner, perhaps using Instant-Runoff Voting (IRV). Prof. Vance (Biochemistry) expressed support for IRV. Dr. Thorne (Economics), with visible irritation, interjected that IRV also violates Condition 3 (IIA). He further noted the documented phenomenon where a name could *lose* under IRV because it became *more popular* (specifically, if it rises in some rankings without becoming a first choice), contravening intuitive notions of fairness. Dr. Finch (Chair) reminded the Committee that the Terms of Reference, as established by the University Senate, explicitly require the submission of a *ranked shortlist of three names*, not merely a single winner. Dr. Chen (Mathematics) added that, even if only a winner were required, Arrow's theorem implies difficulties in finding a *consistent* rule for selecting winners that satisfies analogous fairness conditions across different sets of candidates; however, given the immediate requirement for a full ranking, this point was **tabled** due to time constraints.

  **5. Any Other Business:**  
  **5.1 Resolution of Deadlock:** Following the exhaustive review of alternatives and the consistent failure to identify a voting rule satisfying all four mandated Conditions, Dr. Finch (Chair) summarized the logical position: The only aggregation procedure demonstrably satisfying Conditions 1 (Universality), 2 (Unanimity), and 3 (IIA) is one where a single member determines the Committee's ranking (Condition 4, Non-Dictatorship, being thereby violated). Prof. Chen (Mathematics) confirmed this interpretation of the theorem's implications.

  Dr. Thorne (Economics) moved that, in light of the established logical constraints and the urgent need to progress, the Committee formally adopt a procedural rule whereby the Chair, Dr. Finch, acting as a single designated member, shall determine the Committee's final ranked shortlist for submission, this arrangement to be reviewed at the next scheduled meeting. Prof. Vance (Biochemistry) seconded the motion.

  The motion was put to a vote. The Committee employed a show of hands, being the most readily available procedure. The vote was **unanimous in favour (7-0)**.

  Dr. Finch (Chair) accepted the responsibility, expressing his intention to deliberate carefully on the rankings. The Committee recorded its **satisfaction** that a definitive, procedurally grounded resolution had been achieved through democratic deliberation and voting.

  **6. Adjournment:**  
  The meeting was adjourned at 5:12 PM. The next meeting is scheduled for Tuesday, November 2nd, 2024, at 3:00 PM in Conference Room 7B, primarily to review the Chair's ranking prior to newsletter submission.

  **Minutes submitted by:**  
  Desmond Pike, Administrative Liaison & Secretary  
  **Date:** October 27, 2024

  ---
  **Footnotes:**

  ^1 **Clarification on Dictatorship:** It is crucial to note that a "dictator" in this specific technical sense is defined solely by the power to determine the group's strict preference between *any* two options single-handedly. This differs significantly from having influence, wielding a veto (which only allows blocking, not imposing a preference), or holding a leadership position. Condition 4 requires that no individual member possesses this absolute power over pairwise outcomes.
  ^2 **Shortlist Note:** "The Synergy Nexus" was included as a late nomination by the Faculty of Business and Management, seconded under procedural rules by Dr. Thorne.
  ^3 **Secretary's Note on IIA:** Dr. Thorne's colloquial reference to "no spoilers" is noted. While capturing an aspect of IIA's intent – that irrelevant alternatives shouldn't "spoil" the contest between two others – Condition 3 (IIA) is a stricter, formal requirement concerning the *exclusive dependence* of the A vs. B outcome on individual A vs. B rankings, irrespective of other options' presence or position. Dr. Croft's explanation accurately reflected Condition 3.
