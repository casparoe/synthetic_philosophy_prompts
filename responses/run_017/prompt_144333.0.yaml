prompt: |-
  I am on a small committee revising the practices of a learned society — among them double-blind reviewing, the expectation that referees work unpaid, the order in which senior and junior members are called on at panels, and a lingering practice of not citing another member's unpublished conference paper without asking first. We keep calling these things 'conventions' and 'norms' interchangeably, and I have come to think the word is doing no work in our deliberations. So before I classify any of them, I want the specification.

  The purpose fixes what adequacy means here, so let me state it. The theory I need is one a reformer can use from the inside, in advance of acting, and without survey data, to answer three questions: whether a given practice is a convention at all rather than a mere regularity, an artefact of an external constraint, or a norm of some other sort; if it is a convention, what is actually holding it up; and which of the instruments really available to us — setting a precedent, changing what is observable to whom, a public announcement, attaching a cost to deviation, changing who the population is — has any chance of moving it, and which is certain not to. A theory that only lets a philosopher classify a practice correctly once the history is known is no use to me, and a theory that classifies correctly but tells me nothing about levers is only half a theory.

  Write the desiderata such a theory has to meet. For each one, give the case or consideration that makes it a requirement rather than a preference, and tell me whether you take it to be non-negotiable or a prejudice of one camp. The classifications I most need it to get right, and which I would use as test cases: a practice everyone complies with and everyone knows everyone complies with, while each privately believes — falsely — that most others endorse it, and which survives a public announcement of that fact; a practice that looks conventional but is really a by-product of an external constraint, such as a funder's reporting requirement, so that repealing the constraint dissolves it without anyone changing their mind; a practice nobody in the organisation can state, which nevertheless survives near-total turnover of its members; a practice that is inefficient and known by all to be inefficient, and yet stable for decades; and a practice that collapses within a year with no change in sanctions, population, or anyone's private convictions. Anything your list cannot sort from its neighbours is a gap in the list.

  Two further things matter more to me than completeness. First, flag any subset of your desiderata that you suspect cannot be jointly satisfied: I would rather have a short list with a proved tension in it than a long list that quietly presupposes a theory that cannot exist. My own suspicion is that the demand that a theory explain stability and the demand that it explain endogenous change are met by theories of incompatible shapes — one wants an equilibrium concept, the other wants a dynamics defined largely off the equilibrium — and that the second of these is where the Lewisian picture is thinnest. If something like that is right, say which desideratum should give way given my purpose, and what I lose by dropping it. Second, tell me which single requirement on your list excludes the most candidates, and whether it is a genuine requirement or a preference you happen to share — I would rather know which of your demands is doing the real work.

  If the honest answer is that 'convention' is a folk term that should be split into two or three kinds before any desiderata are stated, say so and give me the taxonomy the design purpose actually needs, rather than analysing a word.

  Then, briefly — a short paragraph each, and no references, since I know the literature and will supply citations myself — how the Lewisian coordination account, broadly evolutionary and dynamic accounts in the spirit of Skyrms, and normative-expectations accounts in the spirit of Bicchieri do against the list. Keep the weight on the criteria rather than on the scoring.

  Mark your confidence on each desideratum you call non-negotiable, and for each, state what would make you drop it: which case, or which argument, would change your verdict. Say too where you suspect your list has been shaped by what is easy to model rather than by the phenomenon itself — that is where I most expect it to be wrong.
reasoning: |-
  Okay, let me tackle this complex request step by step. The user is part of a committee revising learned society practices and needs a theoretical framework to distinguish conventions from other phenomena and understand how to change them. 

  First, I need to identify the core challenge: the committee keeps using "conventions" and "norms" interchangeably without clear criteria. The user wants a theory that can:
  1. Classify practices pre-empirically (without historical data)
  2. Identify what sustains them
  3. Predict effective intervention levers

  Key pain points emerge:
  - Current theories fail at distinguishing conventions from external constraints or other norm types
  - Lewisian models struggle with explaining endogenous change
  - Most frameworks don't connect classification to actionable interventions

  The test cases are particularly revealing. That "practice surviving public revelation of false consensus" directly challenges Lewis's mutual expectations requirement. And the "constraint-byproduct practice" exposes how many theories overattribute to social conventions what's actually structural. 

  For taxonomy, I'm considering splitting "convention" into:
  1. Coordination equilibria (Lewis-style)
  2. Conformity practices (driven by normative expectations)
  3. Structural artifacts (externally imposed)

  Each has distinct dissolution mechanisms. For example, coordination equilibria respond to precedent changes, while conformity practices need expectation disruption. 

  On desiderata tensions: Stability analysis (equilibrium models) vs change mechanisms (dynamic models) are fundamentally incompatible. Given the user's reformer role, sacrificing perfect stability models for change-predictive frameworks seems justified. The biggest casualty would be predicting unintended consequences of interventions.

  The most discriminating criterion? Probably "explains persistence without endorsement" - it eliminates strict rational-choice models while preserving psychological and evolutionary accounts. 

  For theory assessments:
  - Lewis fails most test cases (especially the false consensus survival)
  - Bicchieri handles normative expectations well but misses structural factors
  - Skyrms-style evolution explains population turnover cases but struggles with inefficiency puzzles

  My confidence flags on "pre-intervention predictability" - we might need to accept some trial-and-error given complex systems. A strong counterexample would be any practice where small interventions produce catastrophic collapse contrary to all models.

  The biggest modeling bias? Likely overemphasizing observable actions when much convention sustenance involves latent beliefs. The unpublished citation taboo case probably lives in that gap.
answer: |-
  Here are the desiderata for your theory of conventions, grounded in your purpose and test cases. Non-negotiable items are marked **(NN)**; others reflect analytical priorities for reform. Tensions and trade-offs are noted.

  ---

  ### **Desiderata for the Theory**
  1.  **Distinguish conventions from mere regularities, constraints, and other norms *pre-intervention* (without historical data).**  
      *Requirement:* Test case: Practice dissolving instantly when an external constraint (e.g., funder’s rule) is repealed. If the theory cannot identify constraint-linked practices *before* repeal, it risks misclassifying them as conventions and recommending futile interventions. **(NN)**  
      *Confidence:* High. Counterexample: A practice sustained *both* by constraint *and* mutual expectations survives constraint removal. This would force splitting "convention" (see Taxonomy below).

  2.  **Identify the sustaining mechanism (e.g., mutual expectations, sanctions, efficiency, inertia).**  
      *Requirement:* Test case: Stable practice known by all to be inefficient. If efficiency isn’t the sustainer, the theory must pinpoint what is (e.g., fear of sanctions, belief in others’ endorsement). Misdiagnosis leads to ineffective levers (e.g., proving inefficiency won’t change it). **(NN)**  
      *Confidence:* Medium. Counterexample: A practice sustained by *multiple* mechanisms (e.g., expectations + inertia). If mechanisms aren’t separable pre-intervention, the theory fails.

  3.  **Predict stability/change levers (precedent, observability, announcements, costs, population).**  
      *Requirement:* Test case: Practice collapsing with no change in sanctions/population/convictions. Levers like changing observability or announcements must be distinguishable (e.g., an announcement might shatter false consensus). Without this, reformers cannot prioritize actions. **(NN)**  
      *Confidence:* Low. Counterexample: Context-specific interactions (e.g., an announcement backfires due to unmodeled identity dynamics). This desideratum is most vulnerable to overfitting models.

  4.  **Explain persistence without endorsement or awareness.**  
      *Requirement:* Test cases: (a) Practice surviving public revelation of universal false consensus; (b) Practice surviving near-total member turnover. If the theory requires active endorsement or common knowledge, it cannot explain these. **(NN)**  
      *Confidence:* High. Counterexample: A practice that *requires* explicit instruction to transmit (e.g., a cryptographic protocol). This is rare in social contexts; most conventions self-replicate via imitation.

  5.  **Explain endogenous change (without exogenous shocks).**  
      *Requirement:* Test case: Practice collapsing with no external change. Theories focused solely on equilibrium (e.g., Lewis) cannot explain this. Reformers need to trigger change from within.  
      *Confidence:* Medium. *Tension:* Desiderata 4 (stability) and 5 (change) conflict. **Sacrifice 5 for your purpose:** Focus on diagnosing *how* to disrupt stability. You lose predictive power over spontaneous collapse but gain actionable levers.

  6.  **Operationalize without surveying beliefs.**  
      *Requirement:* Test case: Practice where no one can state the "rule" but complies. Reformers need proxies (e.g., observable behaviors, reaction to deviations) to classify pre-action.  
      *Confidence:* High. Counterexample: A practice sustained *only* by identical private reasons (e.g., individual profit). This is likely rare; most social practices involve interdependence.

  ---

  ### **Key Tensions and Trade-offs**
  -   **Major Tension:** **Stability vs. Change (Desiderata 4 vs 5).** Equilibrium theories (Lewis) excel at 4 but fail at 5; evolutionary/dynamic theories (Skyrms) address 5 but may overpredict instability. **For reform, prioritize stability analysis (Desideratum 4) and levers (3)**, sacrificing *endogenous* change prediction. Focus on how to *induce* change via levers.
  -   **Most Discriminating Desideratum:** **#4 (Persistence without endorsement/awareness).** It excludes strict rational-choice models (require belief in others’ preferences) and some normative accounts (require internalization). This is a genuine requirement: your false-consensus test case breaks if the theory assumes sincere endorsement.
  -   **Modeling Bias Risk:** Desideratum 3 (levers) assumes mechanisms are generalizable. Real-world conventions may depend on network structures or cultural schemas that are hard to observe pre-intervention. Test case: "Unpublished paper citation taboo" may involve unspoken hierarchies invisible to reformers.

  ---

  ### **Taxonomy Needed (Split "Convention")**
  "Convention" conflates three types your cases demand separating:
  1.  **Coordination Equilibria (Lewis-type):** Sustained by mutual expectations of compliance (e.g., driving side). *Vulnerable to:* Precedents, observability changes.  
      *Fails test cases:* False consensus survival (if expectations are falsified), inefficiency stability.
  2.  **Norm-Driven Practices (Bicchieri-type):** Sustained by expectations of *sanctions* for deviation (e.g., citation taboo). *Vulnerable to:* Changing sanction visibility/cost.  
      *Fails test cases:* Constraint-byproduct dissolution, unaware persistence.
  3.  **Structural Artifacts:** Sustained by external constraints (e.g., funder rules) or inertia. *Vulnerable to:* Constraint removal, population turnover.  
      *Fails as "convention":* Collapses without social feedback.

  ---

  ### **Theory Assessments vs. Desiderata**
  -   **Lewis (Coordination Equilibrium):**  
      Fails Desiderata 1 (misclassifies constraint-byproducts), 4 (requires common knowledge/beliefs), 5 (no endogenous change), and 6 (requires belief surveying). Excels only at stability *if* mutual knowledge exists.
  -   **Skyrms (Evolutionary/Dynamic):**  
      Addresses 4 (persistence via inertia/imitation) and 5 (change via drift/selection). Struggles with 1 (constraints often exogenous to models) and 3 (levers are abstract population dynamics). Weak on 2 (sustaining mechanisms are often fitness-based, ignoring norms).
  -   **Bicchieri (Normative Expectations):**  
      Meets 2 (pinpoints sanction-based sustenance) and 3 (levers: change expectations/sanctions). Fails 4 (practices without normative expectations, e.g., inertia-driven) and 1 (if constraints create perceived sanctions). Requires belief data (fails 6).

  ---

  ### **Recommendation**
  Prioritize a hybrid approach:  
  1.  **Classify** using taxonomy above (Coordination/Norm/Structural).  
  2.  **Target levers:**  
      - *Coordination:* Shift focal points via precedent/observability.  
      - *Normative:* Undermine expectations of sanctions via announcements.  
      - *Structural:* Remove constraints or force population churn.  
  3.  **Accept:** No theory predicts *all* endogenous collapse. Focus on destabilization, not forecasting spontaneity.  
  **Weakest Link:** Lever prediction (Desideratum 3). Pilot interventions small-scale to test mechanisms.
