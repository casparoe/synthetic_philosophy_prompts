prompt: |-
  i help run a volunteer bike repair workshop, maybe 40 volunteers, most of them stay one season, and basically everything we know how to do gets passed on by watching somebody do it and then showing the next person. practices come and go and nobody is steering it. i started thinking about this in a half-baked darwinian way and made up three labels for what i keep seeing: demo-magnets (it spreads because it looks cool the one time you see it), founder-shadows (it's only still around because whoever invented it is still around doing it), and quiet good ones (it works, nobody notices, and it vanishes after one unlucky week).

  i want a procedure i can actually run by myself in about twenty minutes, with no data beyond what i can watch and who i can ask, that tells me for a given practice which of those three is going on, and then whether we should deliberately protect it, deliberately kill it, or leave it alone. give me the questions in order, what counts as a good enough answer to each, and be straight about which steps are really just my hunch dressed up as a method.

  then run it on three real ones: a weirdly complicated way of truing a wheel that one old volunteer does and everybody copies; a sign-in rule everybody follows but nobody can explain the point of; and a way of greeting people at the door that we dropped after two bad saturdays.

  also my co-organizer says the whole framing is bogus because we copy on purpose and improve things as we hand them over, which she says isn't how genes work. i dont know what to say to that, so build whatever you think about it into the procedure. please answer in american english.
reasoning: |-
  Okay, the user runs a volunteer bike repair workshop with about 40 volunteers. Most volunteers only stay for one season, so knowledge is passed through observation and imitation. The user noticed three patterns: demo-magnets (spread because they look cool), founder-shadows (stick around only because the inventor is still there), and quiet good ones (effective but unnoticed, so they vanish quickly). 

  The user wants a quick, 20-minute procedure to classify any practice into one of these three categories and decide whether to protect, kill, or leave it alone. The method should rely only on observation and asking people, with no data collection. They also mentioned their co-organizer's critique that their Darwinian framing is flawed because humans copy intentionally and improve things, unlike genes. This needs addressing in the procedure.

  First, I need to design a step-by-step process. Since time is limited (20 minutes), the steps must be concise. The assessment should start with gathering basic info: how long the practice has been around, how many people do it. Then, move to questions about its visibility, dependence on specific individuals, effectiveness, and reasons for adoption. The answers will categorize the practice.

  For the co-organizer's critique, I should acknowledge that intentional improvement happens. The procedure could include a step to ask if the practice has been adapted or improved, making it part of the assessment. This addresses the critique without abandoning the framework.

  Next, applying the procedure to the three examples:
  1. **Weird wheel truing method**: Check how many people use it, if it's flashy, if it depends on the old volunteer, its effectiveness. Likely a founder-shadow. If it's effective but complex, decide to simplify rather than kill.
  2. **Sign-in rule**: Determine if people follow it without knowing why. If it's not adding value, it might be a founder-shadow. Check if it has a hidden benefit. If not, kill it.
  3. **Greeting method**: Why was it dropped? If it vanished after two bad days, it's a quiet good one. Assess its effectiveness and if it was noticed. Decide to revive if it was effective.

  The user's deeper needs include maintaining effective practices efficiently, avoiding loss of valuable methods, and reducing reliance on individuals. They also need to justify their approach to the co-organizer by incorporating intentional adaptation. The procedure should be practical, quick, and inclusive of human elements like intentional improvement.
answer: |-
  Here's a straight-shooting, 20-minute procedure you can run solo, incorporating your co-organizer's valid point about intentional improvement. The key is focusing on **observable behavior and quick, targeted questions**.

  **The Quick Assessment Procedure (20 Minutes Max)**

  **Step 0: Prep (1 min)**
  *   Clearly identify the **one specific practice** you're assessing. Write it down: "Practice: [Description]".
  *   Briefly note who you know does it regularly and who you know *doesn't*.

  **Step 1: Prevalence & Longevity Check (Observation & 1 Question - 3 min)**
  *   **Observe:** Roughly what percentage of *current* volunteers use this practice? (High? Medium? Low? Just 1-2 people?)
  *   **Ask 1 Person (Pick someone experienced who isn't the inventor, if possible):** "Hey, quick question: How long have you seen people doing [Practice] around here? Since last season? Longer?"
  *   *Good Enough Answer:* A rough timeframe (e.g., "Since Dave started," "At least two seasons," "New this year"). Don't get bogged down in exact dates.

  **Step 2: The 'Why Do People Do It?' Test (2 Questions - 5 min)**
  *   **Ask Someone Who DOES the Practice (Not the inventor):** "I was curious, why do you do [Practice] that way?" *Listen carefully.*
  *   **Ask Someone Who DOESN'T do the Practice (If possible):** "Have you ever seen anyone do [Practice]? Any reason you don't do it that way yourself?" *Listen carefully.*
  *   *Good Enough Answers:*
      *   **"Because [Name] does it/taught me that way."** (Points to Founder-Shadow)
      *   **"It looks cool/easier/faster/more professional."** (Points to Demo-Magnet)
      *   **"I don't know, just how it's done?"** (Points to Founder-Shadow or Quiet Good)
      *   **"I tried it once, seemed fiddly/slow/didn't work for me."** (Points to Demo-Magnet if flashy but impractical, or Quiet Good if misunderstood)
      *   **"It just works well." / "It solves [specific problem]."** (Points to Quiet Good or robust practice)
      *   **"Because the sign says to." / "Because we have to."** (Points to Founder-Shadow - rule without understood purpose)

  **Step 3: The Inventor Dependence Test (1 Question - 2 min)**
  *   **Assess:** Is the person who invented or championed this practice (the "Founder") *still actively volunteering*?
  *   **Ask (If Founder is gone, ask an experienced volunteer):** "When [Founder's Name] stopped coming around, did people keep doing [Practice]? Or did it fade out?"
  *   *Good Enough Answer:* A simple "Yeah, mostly" or "Nah, not really" or "Only [Name] still does it sometimes." This is crucial for Founder-Shadows.

  **Step 4: Effectiveness & Visibility Gut Check (Observation & Your Hunch - 4 min)** *(Yes, this is the "hunch dressed up" step, but grounded by steps 1-3)*
  *   **Observe:** Does the practice *look* flashy, complex, or involve special tools (Demo-Magnet potential)? Or is it simple, subtle, maybe even a bit boring (Quiet Good potential)?
  *   **Reflect:** Based on your own experience and what you heard in Step 2:
      *   Does it *actually* work reliably? (Quiet Good if yes but unnoticed; Demo-Magnet if flashy but flaky)
      *   Is it noticeably *better* than simpler alternatives? (Quiet Good or robust practice)
      *   Is it just *different* without clear benefit? (Founder-Shadow or Demo-Magnet)
      *   Did it vanish quickly despite working? (Quiet Good candidate)
  *   **Consider Improvement:** **(Addressing your co-organizer's point!)** Did anyone mention *adapting* this practice? ("Oh, I do it like Dave showed me but I skip that one twisty bit"). If yes, it's evolving intentionally – mark this down. This moves it away from strict "gene" analogy.

  **Step 5: Classification & Action Decision (Your Analysis - 5 min)**
  *   **Classify (Based on Steps 1-4):**
      *   **Demo-Magnet:** High initial spread (Step 1), adopted because it *looks* good (Step 2), often flashy (Step 4), effectiveness might be questionable (Step 4). *Fragile if it doesn't deliver.*
      *   **Founder-Shadow:** Moderate/Low prevalence (Step 1), done because "X does it" or "it's the rule" (Step 2), highly dependent on Founder being present (Step 3), purpose often unclear (Step 2/4), effectiveness variable. *Fragile if Founder leaves.*
      *   **Quiet Good:** Low/Moderate prevalence (Step 1), adopted because "it works" (Step 2), often simple/subtle (Step 4), effectiveness is real but unglamorous (Step 4), might have vanished quickly elsewhere (Step 1/4). *Fragile because invisible.*
      *   **Bonus: Robust/Improved Practice:** Widespread/sustained (Step 1), adopted because it works well (Step 2), not Founder-dependent (Step 3), effective (Step 4), *and* people mention adapting/improving it (Step 4). *This is the gold standard.*
  *   **Decide Action:**
      *   **Protect (Document/Explain/Train):** Primarily for **Quiet Goods** (they work but vanish easily) and essential **Robust** practices. *Also consider for effective Founder-Shadows nearing founder departure.*
      *   **Kill (Stop/Explain Why/Offer Alternative):** Primarily for ineffective **Founder-Shadows** (pointless rules) and **Demo-Magnets** that don't actually work well. *Also for any practice causing consistent problems.*
      *   **Leave Alone:** Effective **Robust/Improved** practices, harmless **Founder-Shadows** (if founder still there), or **Demo-Magnets** that *are* actually effective and stable (they become Robust). *Also for things genuinely being improved through adaptation.*

  **Addressing Your Co-Organizer:** The procedure explicitly asks about adaptation (Step 4) and identifies "Robust/Improved" practices as the ideal outcome. This acknowledges that intentional copying *and* improvement happen, which is different from blind genetic replication. The "Darwinian" labels are just useful shorthand for common *fragility patterns* you observe, not a perfect biological model.

  ---

  **Running the Procedure on Your Examples**

  **1. The Weirdly Complicated Wheel Truing Method**
  *   **Step 1:** High prevalence among those who true wheels? (Likely yes if everyone copies the old volunteer). Longevity? (Probably at least this season).
  *   **Step 2 (Ask a Copier):** "Why do you true wheels that way?" *Likely Answer:* "Oh, that's how Bob showed me." (Founder-Shadow flag). (Ask a non-user - maybe hard if all truers do it). *Alternative:* "Have you tried other ways?" *Answer:* "This works, Bob's the expert." (Founder-Shadow).
  *   **Step 3:** "Founder" (Bob) is still present? (Yes).
  *   **Step 4:** Looks complex/flashy (Demo-Magnet potential), but does it work? (Probably, or Bob wouldn't have status). Any adaptation mentioned? (Unlikely, "Bob's way is gospel").
  *   **Classification:** **Founder-Shadow.** It persists because Bob is there and respected. Effectiveness is likely real *for Bob*, but complexity might be unnecessary for others.
  *   **Action:** **Leave Alone... for now.** BUT: Protect the *outcome* (a true wheel). Before Bob leaves, **Protect:** Work with Bob to document/teach *why* the complex steps matter (or if some can be skipped). Goal: Extract the core effectiveness into a more transferable Robust practice.

  **2. The Unexplained Sign-In Rule**
  *   **Step 1:** High prevalence (everyone follows). Longevity? (Probably long-standing).
  *   **Step 2 (Ask a Follower):** "Why do we sign in on the blue sheet before touching any tools?" *Likely Answer:* "Uh... not sure. Always have? The coordinator said to." (Major Founder-Shadow). (Ask someone - maybe they skip sometimes?): "Ever skip the sign-in? Why?" *Answer:* "No, you gotta do it. They check maybe?" (Founder-Shadow - rule without understood purpose).
  *   **Step 3:** Original Founder probably long gone. Current enforcer(s)? (Maybe a coordinator).
  *   **Step 4:** Not flashy, purpose unclear. Effectiveness? (What *is* the point? Safety log? Volunteer hours? Parts tracking? If no one knows, it's likely not achieving anything vital). No adaptation mentioned.
  *   **Classification:** Strong **Founder-Shadow.** Persists only because "it's the rule," original purpose lost.
  *   **Action:** **Kill (or radically clarify).** Find out if it *ever* had a valid purpose. If yes, PROTECT that purpose by explaining it clearly ("We sign in so we know who to contact if there's an accident with this bike later"). If no valid purpose remains, kill the rule. Replace with something useful if needed.

  **3. The Dropped Door Greeting**
  *   **Step 1:** Prevalence *Now*: Zero. Longevity: Very short (tried, dropped).
  *   **Step 2 (Ask someone who was there):** "Remember that greeting we tried a few weeks back? Why did people start doing it?" *Likely Answer:* "Sarah suggested it, seemed friendly/professional." (Demo-Magnet - looked good initially). "Why did folks stop?" *Likely Answer:* "Felt awkward / took too long / people got overwhelmed Saturdays." (Effectiveness problem surfaced).
  *   **Step 3:** Founder (Sarah) likely still present? But practice died anyway.
  *   **Step 4:** Was it flashy/noticeable? (Probably, greetings are visible). Effectiveness? Clearly failed under pressure (Step 2 answers).
  *   **Classification:** **Demo-Magnet.** Spread because it *sounded* good (professional/friendly) but collapsed when its impracticality became obvious under real conditions. It wasn't robust.
  *   **Action:** **Leave it Dead (Killed).** It self-selected out. Focus energy on finding/developing a greeting method that *is* robust and works on busy Saturdays. Maybe experiment with simpler variations intentionally (addressing co-organizer's point about improvement).

  **Key Takeaway:** This procedure helps you diagnose *why* a practice is fragile (Demo-Magnet = fails under scrutiny, Founder-Shadow = person-dependent, Quiet Good = invisible benefit) so you can take targeted action: protect the hidden gems, kill the pointless cargo-cult rituals, and leave the healthy, evolving practices alone. It explicitly factors in intentional adaptation, making it more than just a biological analogy.
