prompt: |-
  Me and my housemates have gone way too deep on the ethics of eating meat and now we want a joke about it for the group chat. It only has to land for people who are in on the debate: the ones who know that crop cultivation kills field animals too, so vegetarianism isn't automatically blood-free, that chicken looks much worse than beef if you count individual animals killed per calorie while beef looks much worse if you count land per calorie, and that the version of the question you should actually care about is the marginal one rather than the average. I want punchlines that turn on that actual tension, not a generic vegan joke or a generic steak joke. My own attempt was "I switched to chicken to save the cows and ended up funding a warehouse full of them," which is depressing rather than funny. Give me two or three short ones, and if you can make at least one of them turn on the gap between the average accounting and the marginal accounting, that's the bit that would actually make us laugh. No links to studies and nothing that needs looking up.
