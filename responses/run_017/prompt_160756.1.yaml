  Second attempt: Marginal impact is gold. "I only buy beef from farms that wouldn't exist without me" is such a niche rationalization—the joke is how it backfires (supporting *extra* suffering) and the "marginal cow" pun ties it together. 

  Third one: Dark, but the "chicken lives per calorie" phrasing mirrors how these debates actually sound. Ending with "shorter, more numerous screams" makes the absurd math visceral. 

