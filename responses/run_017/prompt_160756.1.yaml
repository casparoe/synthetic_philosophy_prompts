  Hmm, the challenge here is crafting humor that's both technically accurate and actually witty—no easy task with such a niche, data-heavy topic. The user clearly knows their stuff, so the jokes can't rely on oversimplifications ("meat is murder" or "plants feel pain" level). The depressing attempt ("I switched to chicken to save cows...") fails because it's just... true. Dark humor needs a twist to land.

