prompt: |-
  I write about science and ideas for a British broadsheet, and after a decade of filing on the cognitive science of religion I have drifted into holding a position that is recognisably mine rather than one I am merely reporting. I should like it stress-tested before I commit it to print.

  The position has three parts. First, origins: the cognitive machinery that makes religious thought cheap and easy for human beings — promiscuous agency detection, an over-eager theory of mind, teleological bias, intuitions about contagion and about the dead — is a by-product of capacities selected for other work. Nothing in our ancestral history was selected because it produced religion. Second, persistence: what cultural transmission then filters for is not doctrine but cost. Fasts, pilgrimages, tithes, dietary rules, celibacy, distinctive dress, prayer at inconvenient hours — these are what make commitment legible to others and hard to fake, and groups that carry them outlast groups that do not. Third, and this is the part I take to be my own: propositional content functions chiefly as load-bearing scaffolding for those costs. It supplies reasons for bearing them that feel non-negotiable, and it is largely substitutable. What is transmitted down the generations is the cost structure, with the theology as the replaceable part that happens to be fitted to it at the time.

  So: what would count against this?

  I want defeaters, ranked from fatal down to merely awkward, and separated by kind — the empirical findings that would sink it, the conceptual objections that would show it confused or empty, and the results that would merely force me to rewrite a paragraph. For each, say what my position predicts that its rivals do not: the straightforward by-product story, the cultural-group-selection story that leans on morally concerned high gods and supernatural monitoring, and the generic costly-signalling accounts. And for each, say whether it is something a sympathetic defender of my position should concede as counting against them, or something I would be entitled to explain away.

  Three things worry me in particular, and I should like them addressed directly.

  One: the substitutability clause may have quietly made the whole thing unfalsifiable, since any stubborn piece of doctrine can always be re-described as locally necessary for locally required costs. If so, is there a formulation of the view that still risks something? And is a view of this kind entitled to be insulated in that way, or is the insulation itself the objection?

  Two: the discriminating predictions. My view says that the cooperative and prosocial premium associated with religion should track practice rather than belief, so that people who stop believing but keep practising retain most of it, while people who keep believing and stop practising lose it. It also says that where a welfare state, a mutual-aid society or an insurance market takes over the functions religious communities once provided, costly practice should decay before belief does. The design I keep asking somebody to run, and which so far as I know nobody has run, is a multi-wave panel across half a dozen countries that separates believing from belonging and tracks in-group cooperation, charitable giving, trust of strangers and self-reported behaviour over a decade or more. Tell me precisely which outcomes would refute me. I take it that a result in which the believing-without-practising group keeps the premium is bad for me; I am much less sure what I should say if both groups lose it at the same rate, or if the premium turns out to have been a selection artefact all along.

  Three: scope and collapse. Am I really making a claim about religion, or about a handful of post-Axial, mostly Abrahamic traditions that happen to be the ones I have reported on? And if cost does all the explanatory work and content none, does the position collapse into a general theory of costly commitment that would predict the same effects for a party cell, a military unit or a demanding amateur sports club — and should I count that as a refutation or as a Pyrrhic vindication?

  Two further requests. Please flag where the standard distinction between rare, high-arousal imagistic rituals and frequent, routinised doctrinal ones cuts against me, since I suspect my single currency of cost is really two or three currencies I have conflated. And please say plainly if the view is defensible as journalism but empty as a research programme, or the reverse. For what it is worth: the thing that would move me most is a failed pre-registered prediction rather than an armchair case about possible worlds, and the thing that would move me least is being told I have not defined religion, unless you can show that the undefended definition is doing real work in the argument.
reasoning: |-
  Okay, let me tackle this systematically. The user presents a sophisticated three-part theory about religion's cognitive origins, cultural persistence through costly signals, and the scaffolding role of theological content. They explicitly request stress-testing with defeaters categorized by severity and type, plus direct responses to three specific worries. 

  First, I need to map the core claims against competing frameworks: standard by-product theory (Boyer), supernatural monitoring/grandiose gods (Norenzayan), and general costly signaling (Irons/Sosis). The user's unique contribution is clearly the "theology as disposable scaffolding" angle.

  For their first concern about unfalsifiability: the substitutability argument could indeed become tautological if any doctrine can be retrofitted as "locally necessary cost-enabler." I'm considering Harvey Whitehouse's ritual modes as a possible solution - perhaps imagistic rituals create doctrine-resistant costs that might falsify substitutability. The fatal version would be finding immutable doctrine that doesn't serve cost structures.

  On their second point about cooperative premiums: the critical experiment requires separating belief decay from practice decay longitudinally. A killer result against them would be lapsed practitioners retaining cooperation benefits. I should also note potential confounders like social desirability bias in self-reports.

  For the third worry about scope: if sports clubs or political cells show identical cost-commitment effects, that either refutes the religious specificity or expands the theory usefully. The Axial Age limitation matters - if pre-Axial religions lack cost structures, that's problematic. Maybe I'll cite Turchin's ultrasociality work as relevant here.

  The ritual modes distinction cuts deep: routinized rituals (prayer) likely serve different signaling functions than rare, traumatic ones (initiations). Conflating them as "cost" oversimplifies - that's a mid-tier objection requiring theory refinement.

  Finally, regarding journalistic vs scientific merit: the scaffolding thesis generates testable predictions (e.g., doctrinal flexibility after schisms) but needs operationalizing "cost." As journalism it's provocative; as science it requires measurable proxies for theological dispensability.

  Throughout, I'll maintain their requested adversarial tone while conceding where objections have teeth. The insurance markets point is particularly strong - if secularization erodes practice while belief persists, that supports their model. But if belief decays first, Norenzayan wins.
answer: |-
  Your framework is admirably clear and internally coherent, but it faces significant challenges. Below, I stress-test it against empirical, conceptual, and scope-based objections, ranked by severity (fatal → awkward), with explicit links to competing theories and responses to your three core worries. Competing frameworks referenced:  
  - **By-Product (BP)**: Religion as cognitive spillover (e.g., Boyer, Atran)  
  - **Supernatural Monitoring (SM)**: Gods as commitment-enforcers (e.g., Norenzayan, Shariff)  
  - **Generic Costly Signaling (CS)**: Signals need not be religious (e.g., Irons, Sosis)  

  ---

  ### **Fatal Objections**  
  1. **Empirical: Cost Without Theology Fails**  
     - **What would sink it**: Societies with identical cost structures (e.g., fasting, celibacy) but *no* theological scaffolding (e.g., secular ascetic communes) show *lower* cooperation/endurance than theological counterparts.  
     - **Prediction clash**:  
       - *Your view*: Costs + substitutable theology → cooperation.  
       - *SM/CS*: Theology (e.g., "eternal punishment") makes costs *credible*; secular signals decay faster.  
     - **Concede?** Fatal if replicated. *Defense*: Argue secular cases lack "non-negotiable" framing (e.g., "God commands this” vs. “wellness requires this”).  

  2. **Conceptual: Theology Drives Cost Adoption**  
     - **What would sink it**: Doctrine *precedes* costly practices historically (e.g., early Christians adopted martyrdom *because* of resurrection theology; not generic costs later draped in theology).  
     - **Prediction clash**:  
       - *Your view*: Costs are evolutionary anchors; theology is retrofit.  
       - *BP/SM*: Content generates costs (e.g., hell belief → tithes to avoid damnation).  
     - **Concede?** Potentially fatal. *Defense*: Show practices (e.g., purity rules) predate doctrine in oral traditions.  

  ---

  ### **Major Objections**  
  3. **Scope: Pre-Axial & Non-Theistic Religions**  
     - **Problem**: Your model fits Abrahamic/doctrinal faiths poorly explains:  
       - Shamanic traditions (costs low; theology fluid; endurance high).  
       - Buddhist non-theism (costs high; theology denies supernatural agents).  
     - **Prediction clash**:  
       - *BP*: Explains shamanism via hyperactive agency detection.  
       - *SM*: Fails for Buddhism.  
     - **Concede?** Forces revision. *Defense*: Argue Buddhism *has* "theology" (karma/reincarnation as supernatural enforcement).  

  4. **Ritual Modes: Cost ≠ Cost**  
     - **Whitehouse’s distinction cuts deep**:  
       - *Imagistic rituals* (rare, traumatic): Cost = pain/risk; bonds via shared trauma; doctrine minimal.  
       - *Doctrinal rituals* (frequent, routinized): Cost = time/consistency; doctrine essential for standardization.  
     - **Problem**: You conflate these. High-cost imagistic rites (e.g., initiations) need no theology; low-cost doctrinal rites (e.g., daily prayer) rely on it.  
     - **Concede?** Rewrite needed. *Defense*: Both make commitment "legible," but admit "cost" is multidimensional.  

  ---

  ### **Awkward Objections**  
  5. **Substitutability & Falsifiability**  
     - **Your worry is valid**: Any doctrine can be called "scaffolding" post hoc.  
     - **Solution**: Specify *a priori* what counts as "substitutable":  
       - Prediction: Schisms/doctrinal shifts (e.g., Protestant Reformation) retain cost structures >90%.  
       - *Falsifier*: Major cost collapse after theology change (e.g., Mormonism’s polygamy ban → mass defection).  
     - **Insulation objection**: Defuse by offering testable substitution criteria (e.g., theology changes without cost changes in >80% of cases).  

  6. **Belief vs. Practice: The Panel Study**  
     - **Refutatory outcomes**:  
       - *Fatal*: "Believers without practice" retain cooperation premium (supports SM).  
       - *Problematic*: Both groups lose premium at same rate (supports BP: religion as cognitive accident with no adaptive benefit).  
       - *Awkward but explainable*: Premium was selection artefact (e.g., medieval tithes correlated with wealth; secular giving identical).  
     - **Your defense**: Stress *legibility to others*: Practicing non-believers still signal commitment; non-practicing believers do not.  

  7. **Collapse into Generic Signaling**  
     - **Is this refutation?** Only if religious costs are *functionally identical* to sports clubs/militias.  
     - **Key differences**:  
       - Theology enables *non-negotiable* framing ("divine command” > “coach’s order”).  
       - Religious costs often target evolutionarily salient domains (food, sex, death) → deeper commitment.  
     - **Concede?** Pyrrhic victory: Your model *subsumes* CS but adds theology’s unique framing role.  

  ---

  ### **Direct Responses to Your Worries**  
  **1. Substitutability & Falsifiability**  
  - **Risk-bearing formulation**: "When theology changes, cost structures persist ≥80% of the time in the absence of external shocks (e.g., state suppression)."  
  - **Insulation objection**: Legitimate; mitigate by pre-regulating substitution criteria.  

  **2. Belief-Practice Decoupling**  
  - **Refuted by**: Practicing non-believers losing premium *faster* than non-practicing believers.  
  - **Ambiguous results**: If *both* decay equally, emphasize network effects (practitioners are embedded; isolated believers are not).  

  **3. Scope/Collapse**  
  - **Not just Abrahamic**: Extend to cost-heavy traditions (e.g., Theravada Buddhism, Jainism).  
  - **Collapse risk**: Theology’s "non-negotiable" framing is irreplaceable in generating sacrifice (e.g., martyrs). Sports clubs lack this.  

  ---

  ### **Journalism vs. Science**  
  - **As journalism**: Defensible and compelling. Highlights religion’s "behavioral core."  
  - **As research program**: Needs operationalization:  
    - **Metrics**: Quantify "cost" (time/energy/opportunity); measure theology’s "substitutability" (e.g., text analysis across schisms).  
    - **Unique prediction**: Doctrinal fluidity in *stable* cost environments (e.g., folk Catholicism absorbing local deities).  

  **What should move you**:  
  ✅ **Fatal**: Secular cost structures failing to sustain cooperation like religious ones.  
  ⚠️ **Major**: Pre-Axial religions with high endurance but minimal costs.  
  ❌ **Overrated**: "Religion" definitions—unless shown to exclude key cases (e.g., Confucian rituals).  

  **What might save you**:  
  - **Cost structures decaying** *after* **theology** in secularizing societies (e.g., Scandinavians abandoning tithes before disbelieving in God).  
  - **Schisms** (e.g., Orthodox vs. Catholic) preserving fasting/celibacy while reinterducing doctrine.  

  Your model’s strength is reframing theology as architecture, not foundation. Its weakness is underestimating content’s role in *motivating* costs. A hybrid: Theology is the ignition; cost is the engine.
