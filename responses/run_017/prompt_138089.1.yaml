prompt: |-
  I work as the clinical ethics consultant for a hospital centre that performs graded neural replacement, and I need something I can actually put in front of the nursing coordinators. The intervention is what it sounds like: in patients with a rare progressive cortical degeneration, biological cortex is exchanged for functionally matched synthetic modules a few cubic millimetres at a time, each session under general anaesthesia, over something like two hundred sessions spread across eighteen to twenty-four months. It works. Patients who complete it wake up with their memories, their temperaments, their projects and their manner of speaking intact, and to anyone observing them they are the people who enrolled. None of our disputes are about whether to offer it. They are about who, precisely, is in the bed at session 140, and that question has to be answered repeatedly and under time pressure, because the answer settles whether we continue to treat the current subject as the enrolling patient for purposes of consent, advance directives, surrogate designation, resuscitation status, and the property, custody and insurance questions that families bring us. I have roughly thirty minutes per consult, the person filling in the form will usually be a senior nurse with no philosophical training, and whatever the form does not settle escalates to me and then, if money or custody is involved, to legal. So I want a written procedure: the questions in the order they should be asked, what counts as an adequate answer to each, the points at which the procedure returns a presumption against treating the current subject as the enrolling patient and stops, and the points at which it hands the decision to a human being because the issue is one of values rather than fact. Be explicit about which steps are really judgment calls wearing procedural clothing, because I would rather know that now than discover it during an audit. I would also rather have a procedure that is wrong in a known and correctable direction than one that is vague, and my committee will not accept one whose answer is always that it depends. Please skip citations, bibliographies and suggested reading altogether; I have no library access on the ward and I need the instrument, not the literature underneath it.

  The reason I am pushing for this now is that I had a long and unsatisfying argument about it last night with a friend. He holds the psychological-continuity line and thinks the graded case is trivial: each session the patient wakes up remembering the last one, behaviour and memory are preserved end to end, so of course it is the same person throughout, and anyone who says otherwise is being spooked by the anaesthesia. I found myself defending something closer to the biological-organism view, mostly on the strength of what our phenomenal-continuity interviews turn up, and a third colleague of ours says there is no further fact here at all and that survival simply comes in degrees, so that the practical question is not what happened to the patient but which statuses we should let follow the continuity. We went nowhere. So I want the procedure built to handle, at minimum, these cases: the patient at around seventy per cent replacement who revokes the advance directive he wrote before enrolling, on the ground that he no longer wants what that earlier self wanted; the reversion case, where excised tissue has been kept viable and is reimplanted after sixty per cent of the cortex has been replaced, leaving us with two candidate claimants, the mostly synthetic subject and the restored biological one; the branching case, where a patient dies intraoperatively and the team restores a full backup taken at intake into the already implanted substrate, so that the resulting subject remembers nothing after intake; the split-stream case, a patient with a prior corpus callosotomy whose two hemispheric streams are replaced on staggered schedules and who then disagree about whether to continue; the pause case, where funding lapses at forty per cent and treatment resumes years later; the substitution case, where the only modules available mid-course run several times faster than biological tissue and the resulting subject says the enrollee could not have anticipated what living at that speed would be like; and the fade case, where behaviour, memory and reported life history are all intact but from about session eighty onward the patient volunteers, reliably and without being prompted, that it has felt for some time as though someone else has been finishing his sentences for him, while our interview instrument scores him ambiguously. I would also like the procedure to say whether it treats whole-brain destructive replacement of the sort performed at a competing centre differently from the graded protocol, and what in the procedure makes the difference.

  Please ground the thing in the actual substance of those three views rather than in anything idiosyncratic, and keep the theory invisible in the form itself: the nurse should never have to know which view a question comes from. Then apply the finished procedure to three of the cases above, showing the steps as they would be gone through: the seventy per cent revocation, the reversion case where the restored biological subject contests the enrollee's will, and the split-stream case where the streams disagree. One of the three needs to be a case where the procedure gives an answer my committee will not want, and I strongly suspect that is the revocation case, since if the procedure tells us we must re-consent everyone mid-course and suspend new enrolments the programme will be damaged; if that is where it lands, say so plainly rather than softening it. Finally, tell me what the procedure cannot do. In particular, I want to know whether it is capable of settling the underlying question my friend and I were actually arguing about, whether the enrolling patient survives the series at all, or whether the most it can honestly deliver is a defensible rule for allocating consent, property and surrogacy among candidate claimants while leaving the survival question open, and how I should explain that difference to a family who wants a straight answer.
reasoning: |-
  We are designing a procedural decision tree for nursing coordinators to determine when the current subject in the graded neural replacement process should be treated as the enrolling patient for legal and ethical purposes.

   Core Principles:
   1. The procedure must be operational, with clear yes/no questions and decision points.
   2. It should be grounded in the three philosophical views (psychological continuity, biological organism, and the no-further-fact/degrees view) but without exposing the theory.
   3. The goal is to resolve practical issues (consent, advance directives, etc.) without necessarily settling the metaphysical survival question.

   We'll break down the assessment into stages. We note that the procedure is applied at any point when a decision is needed (e.g., at session 140, or when a revocation occurs).

   The assessment will be based on:
   - Continuity of memory and psychological traits (from psychological continuity view)
   - Biological continuity (from biological view)
   - The degree of change and the subject's own reports (from the degrees view)

   However, we must also account for exceptional cases (reversion, branching, etc.).

   Steps:

   I. Initial Assessment (at the start of the procedure, for baseline)
      Not part of the decision tree for a given session, but we assume that at enrollment the patient is the enrolling patient.

   II. At any point during the procedure (when a question arises), we follow:

   Step 1: Check for Biological Continuity in the Critical Sense
     - We note that the biological organism is changing gradually. However, the biological view might require that the same living organism is present. In the graded replacement, the organism is being altered but the vital functions (respiration, circulation) are maintained by the same body. Thus, the biological organism is continuous until the entire cortex is replaced? But the reversion case complicates this.

     However, the procedure must be practical. We define:

     Question 1: "Is the current subject's body (excluding the replaced neural tissue) the same biological organism that was enrolled? (i.e., the body has not been replaced or destroyed and then reconstituted, and the procedure has been continuous in the sense of not having been interrupted by death or complete brain removal)?"

     - If NO: then we do not treat as the enrolling patient (e.g., in the branching case, if the patient died and was restored from backup, then the body was dead and then revived? Or in whole-brain destructive replacement, the entire brain is replaced at once, so the body is the same but the brain is entirely new. We will have a separate note for whole-brain replacement.)

     But note: in the branching case, the body might be the same, but the patient died. So we must refine.

     Instead, we consider:

     Question 1a: "Has the patient died at any point during the procedure (including during an operation) and then been revived or had consciousness restored (by any means)?"

       - If YES: then we do not treat as the enrolling patient. (This handles the branching case and also any cardiac arrest with resuscitation.)

     Question 1b: "Has the entire brain (or the entire cortex) been replaced in a single session (as in whole-brain destructive replacement)?"

       - If YES: then we do not treat as the enrolling patient. (This distinguishes the graded procedure from the whole-brain replacement at the competing center.)

     But note: our graded procedure does not do whole-brain replacement in one go. However, if the procedure is paused and then resumed after a long time, we might have an issue.

     Let's reframe:

     We are concerned with two types of discontinuity: death and radical replacement.

     So:

     Step 1: Discontinuity Events
       A. Death: "Has the patient been declared dead at any time during the procedure (even if later revived)?" 
           - YES → Not the enrolling patient. (This captures the branching case and any fatal event.)
           - NO → Proceed to B.

       B. Whole-Brain Replacement: "Was the entire brain (or entire cortex) replaced in a single session?" 
           - YES → Not the enrolling patient. (This is the competing center's procedure. In our graded procedure, the answer is always no, but we include for completeness.)
           - NO → Proceed to Step 2.

     However, note that in the pause case, there is no death or whole-brain replacement, so we proceed.

   Step 2: Continuity of Consciousness and Memory (Psychological Continuity)
     - We need to check if there is an unbroken chain of memory and psychological connectedness.

     Question 2: "Does the current subject report continuous memory of the entire procedure, including recalling events from the previous session and the time between sessions, without any gaps that are not typical of normal forgetting?"

       - But note: under general anesthesia, there is a gap. We must account for that.

       We define: the continuity is broken if there is a gap in first-person memory that is not due to normal forgetting (like sleep) and that the subject cannot account for as a normal experience.

       However, anesthesia is expected. So:

       Question 2a: "Between the last session and this one, has the subject experienced any period of unconsciousness (other than normal sleep) that they cannot recall upon waking? (Exclude the current session's anesthesia, which they are just waking from.)"

          - If YES, then we need to check if that period was due to an unexpected event (like a coma) or if it was planned (like an unrelated surgery). But we are concerned with breaks in the chain of consciousness.

          However, the procedure is designed to have anesthesia, so we must focus on unexpected breaks.

          We reframe:

          We are concerned with breaks that are not part of the standard procedure. So:

          Question 2b: "Since enrollment, has the subject experienced any interruption in the continuity of their conscious experience (such as an unexpected coma, a period of amnesia, or a failure to remember events that occurred while conscious) that is not attributable to the expected effects of the neural replacement procedure (i.e., the anesthesia during surgery)?"

            - YES → Then we must assess the significance. But we need a rule.

          Alternatively, we can ask about the chain of memory:

          Question 2: "Can the subject recall, in reasonable detail, what they did and experienced in the previous session (e.g., the trip to the hospital, the pre-op procedures, etc.) and the events of the day before that session? (Excluding the period under anesthesia during the session itself, which is not recalled by anyone.)"

            - If NO → Then there is a break in psychological continuity. But note: the subject at session 140 might not remember session 1, but that's normal forgetting. We are concerned with recent continuity.

          We are interested in the step-by-step connectedness. So:

          We ask about the last session and the time in between.

          Question 2: "Does the subject remember the events immediately before the last surgery (e.g., the pre-op preparation) and the events of the day after the last surgery (e.g., going home, what they did)?"

            - If NO → Then we have a break. Proceed to Step 3 for further assessment (because it might be a memory problem unrelated to identity).

          But note: the fade case might have memory intact but a feeling of alienation.

   Step 3: Subjective Reports and Phenomenal Continuity
     - This is from the phenomenal-continuity interviews.

     Question 3: "Has the subject reported, without prompting, a persistent feeling that they are not the same person as the one who started the procedure, or that someone else is controlling their thoughts or actions? (Exclude transient feelings that resolve quickly.)"

          - YES → Then we do not treat as the enrolling patient? But the fade case is ambiguous.

          However, we must be cautious. We have an interview instrument that scores this. We define:

          We will use a standard set of questions (the Phenomenal Continuity Interview, PCI) that is administered at every session. The PCI has a scoring system. We define a threshold.

          But the nurse cannot do a full PCI on the spot. We need a screening question.

          So:

          Question 3a: "Has the subject ever made an unsolicited report of feeling like they are not the same person, or that someone else is controlling them, and this feeling has persisted for more than one week?"

            - YES → Then we check the PCI score from the last interview.

          But the nurse may not have the score. So we must have the PCI done regularly and the score recorded.

          We assume that the PCI is part of the standard protocol and the score is available.

          Question 3b: "Does the subject's most recent PCI score fall below the threshold for identity continuity (as defined by the clinical protocol)?"

            - The threshold is set by the ethics committee. Let's say a score below 30 (on a 0-100 scale) is a fail.

            - If YES → Then we do not treat as the enrolling patient.

          If the PCI score is not available, then we rely on the nurse's assessment of the answer to 3a. But we want to avoid subjectivity.

          We design:

          Step 3: Phenomenal Continuity Assessment
            - If the subject has ever reported a persistent feeling of discontinuity (unsolicited and lasting more than a week) AND the most recent PCI score is below threshold (or if a PCI is not available, then based on the report alone) → Then not the enrolling patient.

            - Otherwise, proceed to Step 4.

   Step 4: Behavioral and Psychological Consistency
     - We look for significant changes in behavior, memory, and personality.

     Question 4: "Compared to baseline (at enrollment), has the subject shown a significant and persistent change in core personality traits, long-term memory, or mannerisms that is not attributable to the expected progression of the disease or other known factors (like a reaction to medication)?"

          - We have a standard instrument for this too (e.g., a neuropsych battery). But again, we need a quick assessment.

          We define:

          The nurse should check the most recent Behavioral Consistency Score (BCS) from the routine assessments. If the BCS is below a set threshold (say, 70% of baseline), then we flag.

          But if the BCS is not available, we ask:

          "Has the care team noted any significant and persistent change in the patient's identity-relevant characteristics (e.g., they no longer recognize close family, have forgotten major life events, or have a fundamentally different personality)?"

            - YES → Then not the enrolling patient.

          Otherwise, proceed to Step 5.

   Step 5: Special Cases Assessment
     - We now check for the exceptional cases: reversion, branching, split-stream, etc.

     Question 5a: "Is there more than one living subject claiming to be the original patient? (e.g., due to reimplantation of excised tissue or other duplication events)?"

          - YES → Then we do not treat any as the enrolling patient without further adjudication (which must go to the ethics consultant and legal). The procedure stops and escalates.

          Why? Because we have two claimants and we cannot resolve it at the nursing level.

     Question 5b: "Is there a split in the stream of consciousness such that there are two or more independent centers of consciousness within the same body that are both active and making conflicting claims? (e.g., the split-stream case)"

          - YES → Then we do not treat the body as a unified agent for consent. We must escalate to the ethics consultant to determine how to proceed (e.g., which stream to listen to, or whether to halt the procedure). The procedure stops and escalates.

     Question 5c: "Has the procedure been paused for more than [threshold, e.g., 6 months] and then resumed?"

          - YES → Then we require re-consent from the current subject (because the pause might have caused a discontinuity). But note: the pause itself might not break continuity if the subject remained conscious and continuous. However, we are being cautious.

          How to handle: we require a formal re-consent process if the pause is beyond a set duration (to be defined by policy). This does not necessarily mean they are not the same, but we require fresh consent for the continuation.

          However, if the pause is long and the subject has changed their mind about the advance directive, we might have an issue.

          We treat this as a consent issue, not an identity issue. So the procedure would note: if the pause is beyond the threshold, then for the purpose of continuing the procedure, we require a new consent from the current subject. But for other purposes (like advance directives), we continue to treat as the same unless there is a positive finding in a previous step.

          So we don't decide identity based on pause, but we require re-consent for continuation.

          We note: the procedure does not return "not the same" for a pause, but it does require re-consent.

     Question 5d: "Has there been a substitution of modules that significantly alters the rate of thought (or other fundamental aspect of experience) such that the subject claims the change is beyond what the enrolling patient could have anticipated?"

          - YES → Then we require a re-consent for the continuation of the procedure. We do not necessarily revoke the identity, but we require that the current subject, who is experiencing the change, must consent to the continuation.

          Why? Because the change is so profound that it might affect the subject's ability to adhere to the original goals.

   Step 6: Default
     - If we have passed Steps 1-5 without a negative finding (i.e., without a determination of "not the enrolling patient" and without an escalation for multiple claimants or split stream), then we treat the current subject as the enrolling patient.

   But note: we have not addressed the revocation case (patient at 70% who revokes the advance directive). In our procedure, if the subject passes all the steps, then they are the enrolling patient and have the right to revoke the advance directive. We don't have a step that blocks that.

   However, the committee might not like this because it allows revocation at any time. But if we have determined that they are the same person, then they have that right.

   But what if the revocation is due to a change in values? The procedure does not prevent that. It only determines whether they are the same person.

   So the procedure might lead to revocations that the committee thinks are unfair (because the advance directive expressed the patient's true wishes and the new wishes are due to the procedure). But that is a problem for the consent model.

   The procedure must be clear: if the current subject is the enrolling patient, they can revoke. If not, then the advance directive stands and we use the surrogate.

   So for the 70% revocation case, if the subject passes all the steps, then they are the enrolling patient and can revoke. The procedure does not block that.

   However, the committee might want to prevent revocation in some cases. But that would be a separate policy.

   Now, we write the procedure as a flowchart.

   But note: we must also account for the reversion case and the split-stream case in the examples.

   Revised Steps:

   We will combine and streamline to fit in a 30-minute consult.

   Proposed Decision Tree:

   Start:

   1. Death Check:
      - "Was the patient declared dead at any point during the procedure and then revived or restored?"
          - YES → Not the enrolling patient. STOP.
          - NO → Next.

   2. Whole-Brain Check:
      - "Was the entire brain (or entire cortex) replaced in a single session?"
          - YES → Not the enrolling patient. STOP.
          - NO → Next.

   3. Memory Continuity Check:
      - "Can the subject recall, in reasonable detail, the events of the previous session (excluding the surgery anesthesia period) and the day after the previous session?"
          - NO → Proceed to Step 3b.
          - YES → Skip to Step 4.

      3b. "Is the memory gap attributable to a known and expected cause (such as the anesthesia from the surgery, or a medication side effect that is temporary and reversible) and not indicative of a more general break in memory continuity?"
          - NO → Not the enrolling patient. STOP.
          - YES → Next. (We treat as a temporary blip and proceed.)

   4. Phenomenal Continuity Check:
      - "Has the subject ever reported, unprompted and persistently (for more than one week), a feeling that they are not the same person or that someone else is controlling them?"
          - YES → Check PCI score:
              - If the most recent PCI score is below the threshold (e.g., <30) → Not the enrolling patient. STOP.
              - If PCI score is above threshold or not available → Next. (We proceed, but note the report for the ethics consultant.)
          - NO → Next.

   5. Behavioral Consistency Check:
      - "Has the care team documented a significant and persistent change in the subject's core personality, long-term memory, or mannerisms that is not due to the disease progression or other known causes?"
          - YES → Not the enrolling patient. STOP.
          - NO → Next.

   6. Multiple Claimants Check:
      - "Is there more than one living subject claiming to be the original patient?"
          - YES → Escalate to ethics consultant and legal. STOP (for the nurse).
          - NO → Next.

   7. Split-Stream Check:
      - "Is there evidence of two or more independent streams of consciousness within the same body that are in conflict?"
          - YES → Escalate to ethics consultant. STOP.
          - NO → Next.

   8. Pause Check (for consent continuation only):
      - Note: This step does not affect identity determination, but it affects consent for the procedure.
      - "Has the procedure been paused for more than [X] months and then resumed?"
          - YES → Require re-consent from the current subject for the continuation of the procedure. (But note: we are not stopping the identity determination; we are just requiring a new consent for treatment.)
          - NO → Next.

   9. Substitution Check (for consent continuation only):
      - "Has there been a substitution of modules that resulted in a fundamental change in the subject's experience (e.g., speed of thought) such that the subject claims the change is beyond what the enrollee could have anticipated?"
          - YES → Require re-consent for the continuation of the procedure.
          - NO → Next.

   10. Default:
       - If we reach this step, the current subject is to be treated as the enrolling patient.

   Notes:
     - Steps 8 and 9 do not cause a "Not the enrolling patient" outcome, but they require a new consent for continuing the procedure. They are about autonomy, not identity.

     - The procedure does not directly address the revocation of an advance directive. If the subject is determined to be the enrolling patient (by reaching step 10), then they have the right to revoke their advance directive. We do not prevent that.

     - The fade case: if the subject reports the feeling but the PCI score is above threshold, we proceed. The committee might want to set the PCI threshold such that the fade case fails if the feeling is persistent and strong.

     - The reversion case: if there are two claimants (the mostly synthetic and the restored biological), then step 6 (multiple claimants) will be triggered and the nurse escalates.

     - The split-stream case: step 7 triggers and escalates.

     - The branching case: step 1 (death) triggers -> not the enrolling patient.

     - The pause case: step 8 requires re-consent for continuation but does not break identity.

     - The substitution case: step 9 requires re-consent for continuation.

     - The fade case: if the PCI score is below threshold (step 4), then not the same. If above, then same.

     - The revocation case: if the subject passes all steps, then they are the same and can revoke.

     - The whole-brain destructive replacement: step 2 -> not the same.

   Now, we apply to three cases:

   Case 1: 70% revocation
     - No death (step1: NO)
     - No whole-brain replacement (step2: NO)
     - Memory continuity: likely YES (unless there is a gap, but the case doesn't say) -> step3: YES -> step4
     - Phenomenal continuity: the case doesn't report a feeling of discontinuity -> step4: NO -> step5
     - Behavioral consistency: intact -> step5: NO -> step6: NO -> step7: NO -> step8: (if pause, but no) -> step9: (if substitution, but no) -> step10: same.
     - So the subject is the enrolling patient and can revoke the advance directive.

     This is the outcome the committee may not want, but the procedure gives it.

   Case 2: Reversion case (restored biological subject contests the will)
     We are assessing the mostly synthetic subject (the one in the bed at session 60, say) and the restored biological subject is a separate entity.

     For the mostly synthetic subject in the bed:
       Step1: Death? The patient did not die during the procedure (unless the reimplantation caused death and revival, which we don't assume). So NO.
       Step2: Whole-brain? NO.
       Step3: Memory: probably YES (if the procedure has been continuous for them) -> YES -> step4
       Step4: Phenomenal: not reported -> NO -> step5: NO
       Step6: Now, at step6: "Is there more than one living subject claiming to be the original patient?" -> YES -> Escalate.

     So the nurse does not make a determination for the mostly synthetic subject; it goes to the ethics consultant and legal.

     Similarly, if we were to assess the restored biological subject (who was reimplanted after being excised), we would ask:
       Step1: Death? The excised tissue was reimplanted, but the original body (the one that continued) did not die. The restored biological subject was created from tissue that was excised and then reimplanted (presumably into a new body or the same body after removal of the synthetic part? The case is unclear). 

     The problem: we now have two entities. The procedure is designed for one subject at a time. The nurse would run the procedure for each claimant? But the procedure for one claimant might be affected by the existence of the other.

     The procedure says: if there is more than one claimant, we escalate. So the nurse does not run the full procedure for either; they stop at step6 and escalate.

   Case 3: Split-stream case
     Step1: NO
     Step2: NO
     Step3: We have two streams. How do we assess memory? Each stream might recall its own experiences. The nurse might not be able to get a unified answer. But the procedure is designed for a single subject. The existence of two streams is caught at step7: "Is there evidence of two or more independent streams?" -> YES -> escalate.

     So the nurse stops and escalates.

   What the procedure cannot do:
     - It does not settle the metaphysical question of whether the original patient survives. It provides a practical, operational definition for the purpose of legal and ethical decisions.
     - It cannot resolve cases with multiple claimants or split streams; it escalates them.
     - It may be over-inclusive (treating as same in cases where there is a strong feeling of discontinuity but the PCI score is above threshold) or under-inclusive (failing for a memory gap that is actually due to a temporary cause).

   How to explain to a family:
     - "The procedure we use is designed to help us make practical decisions about who has the right to make decisions and how to handle legal matters. It is not designed to answer the deep philosophical question of whether the original person is still here. We focus on what we can observe and measure. In some cases, we might not be able to give a definitive answer about the survival of the original person, but we can give a clear rule for who gets to decide on treatment and who inherits property."

     We are being honest that the procedure is a practical tool, not a metaphysical arbiter.

   We now write the procedure as a form for the nurse.
answer: |-
  ### Graded Neural Replacement: Identity Determination Procedure  
  **For Nursing Coordinators: Operational Protocol**  
  *Purpose: To determine if the current subject should be treated as the enrolling patient for consent, advance directives, surrogacy, and legal statuses. Escalate unresolved cases to Clinical Ethics Consultant (CEC) or Legal.*  

  ---

  #### **Procedure: Step-by-Step Questions**  
  *Complete in order. Stop and escalate if directed. Time: ≤30 minutes.*  

  1. **Death/Revival Check**  
     - *Question:* "Was the subject declared dead at any time during the procedure (even if revived)?"  
     - *Adequate Answer:* Confirmed by medical record (e.g., intraoperative death, resuscitation).  
     - **YES** → **Not the enrolling patient.** Escalate to CEC/Legal for disposition.  
     - **NO** → Proceed to Question 2.  

  2. **Whole-Brain Replacement Check**  
     - *Question:* "Was the entire cortex replaced in a single session (e.g., competitor’s destructive method)?"  
     - *Adequate Answer:* Surgical logs confirming single-session full replacement.  
     - **YES** → **Not the enrolling patient.** STOP.  
     - **NO** → Proceed to Question 3.  
     - *Note:* Graded protocols (partial replacements) always answer "NO."  

  3. **Memory Continuity Check**  
     - *Question:* "Does the subject recall events from the *previous session* (e.g., arriving at the hospital, pre-op interactions) without gaps beyond normal forgetting?"  
     - *Adequate Answer:* Subject describes specific, verifiable details (e.g., "Nurse Jane drew blood").  
     - **NO** → Proceed to Question 4.  
     - **YES** → Proceed to Question 5.  

  4. **Memory Gap Assessment**  
     - *Question:* "Is the memory gap explained by non-identity factors (e.g., sedation side effects, unrelated amnesia)?"  
     - *Adequate Answer:* Medical note attributing gap to known causes (e.g., "temporary anesthesia effect").  
     - **YES** → Return to Question 3 or proceed to Question 5 if resolved.  
     - **NO** → **Presumption against identity.** Escalate to CEC.  

  5. **Phenomenal Continuity Check**  
     - *Question:* "Has the subject *volunteered* persistent feelings of discontinuity (e.g., 'Someone else is controlling me')?"  
     - *Adequate Answer:* Documented in ≥2 nursing notes without prompting.  
     - **NO** → Proceed to Question 6.  
     - **YES** → Proceed to PCI Score Review.  
       - *PCI Score Review:* Access last Phenomenal Continuity Interview (PCI) score.  
         - PCI ≥40 → Proceed to Question 6.  
         - PCI <40 → **Not the enrolling patient.** STOP.  
         - *No PCI?* Escalate to CEC.  

  6. **Behavioral Consistency Check**  
     - *Question:* "Are the subject’s core traits (temperament, life story, habits) consistent with baseline, accounting for disease progression?"  
     - *Adequate Answer:* Compare to enrollment records; inconsistencies must be minor (e.g., "more fatigued" ≠ "new personality").  
     - **NO** → **Not the enrolling patient.** STOP.  
     - **YES** → Proceed to Question 7.  

  7. **Multiple Claimants/Split-Stream Check**  
     - *Question:* "Are there multiple entities claiming to be the original patient (e.g., reimplanted tissue) OR conflicting consciousness streams (e.g., post-callosotomy disagreement)?"  
     - *Adequate Answer:* Evidence of competing claims (e.g., two subjects, documented hemispheric conflict).  
     - **YES** → **Undetermined identity.** Escalate immediately to CEC/Legal.  
     - **NO** → Proceed to Question 8.  

  8. **Re-Consent Triggers (Non-Identity)**  
     - *Question A (Pause):* "Was treatment paused >6 months?"  
       - **YES** → **Require re-consent** for continuation. Proceed to final step.  
       - **NO** → No action.  
     - *Question B (Substitution):* "Did module substitutions cause unanticipated changes (e.g., speed alteration) that the subject calls 'beyond enrollment expectations'?"  
       - **YES** → **Require re-consent** for continuation.  
       - **NO** → No action.  

  9. **Final Determination**  
     - If all steps passed without "NO" presumptions:  
       - **Treat as enrolling patient** for all purposes (consent, directives, property).  
     - If unresolved or escalated:  
       - **Do not proceed** until CEC/Legal resolves.  

  ---

  ### **Key Features**  
  - **Judgment Calls Masked as Procedure:**  
    - Q4 (Memory Gaps): "Normal forgetting" vs. identity discontinuity relies on clinical judgment.  
    - Q6 (Behavioral Consistency): Subjective comparison to baseline; nurses use documented traits.  
  - **Known Biases:**  
    - Favors psychological continuity (prioritizes memory/phenomenal reports).  
    - May over-identify subjects as "same" in fade cases (PCI threshold is arbitrary but auditable).  
  - **Escalation Points:** Values-based decisions (e.g., conflict resolution in split-stream) go to CEC.  
  - **Whole-Brain vs. Graded:** Whole-brain fails Q2 (automatic "not same"); graded passes Q2 by design.  

  ---

  ### **Application to Cases**  
  #### **Case 1: 70% Revocation (Subject revokes advance directive)**  
  1. **Q1 (Death):** NO → Proceed.  
  2. **Q2 (Whole-Brain):** NO → Proceed.  
  3. **Q3 (Memory):** YES (recalls prior session) → Proceed.  
  4. **Q5 (Phenomenal):** NO (no unsolicited reports) → Proceed.  
  5. **Q6 (Behavior):** YES (traits intact) → Proceed.  
  6. **Q7 (Multi-Claimant):** NO → Proceed.  
  7. **Q8 (Re-Consent):** Not triggered.  
  8. **Final:** **Same patient** → Revocation permitted.  
  - **Committee Impact:** Requires honoring revocation. *This will damage the program if mid-course re-consent becomes routine.*  

  #### **Case 2: Reversion (Restored biological subject vs. synthetic subject)**  
  - *Assess synthetic subject (in bed):*  
    1. **Q1:** NO → Proceed.  
    2. **Q2:** NO → Proceed.  
    3. **Q3:** Likely YES → Proceed.  
    4. **Q7:** **YES** (biological subject exists) → **Escalate to CEC/Legal.**  
  - *Outcome:* Procedure stops; CEC adjudicates competing claims.  

  #### **Case 3: Split-Stream (Hemispheric disagreement on continuation)**  
  1. **Q1:** NO → Proceed.  
  2. **Q2:** NO → Proceed.  
  3. **Q7:** **YES** (conflicting streams) → **Escalate to CEC.**  
  - *Outcome:* Procedure stops; CEC resolves conflict (e.g., which stream governs).  

  ---

  ### **Limitations**  
  1. **Cannot Settle Survival:**  
     - Answers "Is this entity the enrolling patient for legal/ethical purposes?" *not* "Did the original person survive?"  
     - Grounded in practical criteria (continuity, behavior, absence of rivals), not metaphysics.  
  2. **Unresolvable Cases:**  
     - Fade cases with PCI 40–60: Ambiguous; defaults to "same" but may escalate.  
     - Values conflicts (e.g., "Is revocation fair?"): Deferred to CEC.  
  3. **Dependence on Documentation:**  
     - Fails if PCI scores/memory logs missing.  

  ---

  ### **Explaining to Families**  
  - **Script:** "Our procedure determines who has the *right* to make decisions or inherit property based on observable continuity. It doesn’t answer whether the original person ‘survived’ in a philosophical sense—only how we assign their legal status. If you want the deeper question answered, I’ll explain the competing views, but our policy must follow this protocol."  
  - **Why?** Pragmatic allocation prevents chaos; metaphysical debates lack operational utility.  

