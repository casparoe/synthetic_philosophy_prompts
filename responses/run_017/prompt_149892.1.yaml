  Okay, let's tackle this. The user is a museum writer/editor dealing with Whig history in exhibit texts. They need a practical 15-minute diagnostic procedure to catch and fix this bias in drafts without rewriting entire labels. 

  First, I need to understand their core frustration: it's not about factual accuracy (curators handle that) but about narrative structures that present history as inevitable progress toward the present. They've already identified four DIY tests but want them refined into a reliable workflow.

  The user's explicit requirements are strict:
  - Must be executable in 15min with no resources
  - Sentence-level repairs preserving voice/length
  - Clear stop points (where edits would harm clarity or enter value-judgment territory)
  - Must exempt three specific non-problem areas (relevance, accumulated resources, genuine praise)
  - Needs demonstration on three sample drafts
  - Must admit limitations openly

  Hmm... their self-diagnosed tests are perceptive but overlapping. The reversal test conflates two issues (teleology vs presentism), the rival-swap could be clearer, and the convergence test tries to do too much. I'll distill these into four discrete, sequential checks:

  1. **Temporal Default Test** - Fixes "present as norm" language first because it's most visible
  2. **Causal Reversal Test** - Catches sneaky teleology in cause-effect claims
  3. **Rival Viability Test** - Requires swapping winners/losers to expose structural bias
  4. **Convergence Audit** - Prevents false unification OR false discontinuity of knowledge 

  Each test needs: question → failure criterion → specific repair move. The stop rules are critical: when repairs would exceed 10% word count or require value judgments. 

  For the samples:
  - Semmelweis label fails Temporal Default ("it was not until") and Rival Viability (colleagues as irrational obstacles)
  - Computing timeline fails all tests spectacularly (especially Causal Reversal - "every dead end was a step forward")
  - Lovelace text passes surprisingly well? But director's favorite has subtle issues with "world not ready" framing

  Biggest challenge: The computing timeline rewrite. Original is pure Whig poetry. Must preserve the "standing on shoulders" truth while ditching inevitability. Maybe reframe dead ends as necessary experiments rather than progress-steps?

  Limitations to confess: 
  - Can't fix selection bias (whose stories get told)
  - Useless for purely descriptive sentences
  - Requires user's historical knowledge to spot viable rivals
  - May oversimplify in complex cases

  User's clearly expert - no need to coddle. When the procedure clears the Lovelace text despite their suspicion, I'll say so bluntly. Their instinct about name-selection being a separate issue is correct - that's institutional politics territory.

  Final output must feel like a colleague's email: dense but fluid, no academic clutter. Will demonstrate repairs on their exact phrasing to build trust. And absolutely no "just read Butterfield" cop-outs - they've already dismissed that.
answer: |-
  Subject: Refined diagnostic procedure for historical framing in exhibit texts  

  Here’s the tightened procedure, built from your diagnostics but split, reordered, and clarified for efficiency. It runs in four sequential tests, each designed to flag one specific flaw and prescribe a surgical repair. I’ll apply it first to your drafts, then note its limits.  

  **The Procedure**  
  **First: Temporal Default Test**  
  *Question*: Does any sentence frame the past as a deviation from the present?  
  *Failure criterion*: Use of phrases like "it was not until," "still believed," "failed to notice," or "only gradually" that imply the present is a natural baseline.  
  *Repair*: Reverse the default. Make the past perspective the unmarked case. Replace temporal framing verbs with neutral ones (e.g., change "not until Pasteur proved" to "after Pasteur proposed").  
  *Stop if*: The repair adds >10% word count or forces a value judgment about "progress."  

  **Second: Causal Reversal Test**  
  *Question*: If I reverse the chronology (later event → earlier event), does the claimed cause now seem illogical?  
  *Failure criterion*: The outcome explains the cause (e.g., "Semmelweis discovered truth" implies his correctness is proven by later acceptance).  
  *Repair*: Restate causality to hinge on contemporary evidence. Replace "discovered the truth" with "proposed handwashing reduced deaths"; replace "saw what would take decades" with "speculated future applications."  
  *Stop if*: The sentence becomes factually inaccurate or loses necessary context for a key object.  

  **Third: Rival Viability Test**  
  *Question*: Swap the historical winner/loser (e.g., replace Semmelweis’s critics with "handwashing advocates," Lovelace with a "skeptic"). Do the same explanatory adjectives/adverbs still work?  
  *Failure criterion*: Praise/blame terms survive the swap (e.g., "irrational refusal" fits both sides if swapped; "visionary" only fits winners).  
  *Repair*: Delete moral descriptors ("refused," "not ready"). Use verbs of action/inaction rooted in contemporary constraints ("colleagues cited X reasons," "notes received little attention").  
  *Stop if*: No viable rival existed for this claim (per your knowledge), or repair obscures genuine asymmetry (e.g., data confirming one view).  

  **Fourth: Convergence Audit**  
  *Question*: Are separate historical threads described as "converging" toward a single endpoint? Or conversely, is accumulation of data/technique denied?  
  *Failure criterion*: Implied teleology (e.g., "each generation stood on shoulders" implies linear progress) or false discontinuity (ignoring cumulative technical gains).  
  *Repair*: For false convergence: Add "though unrelated at the time," or specify divergent goals (e.g., Babbage sought math precision, not smartphones). For false discontinuity: Add "building on" when techniques/data accumulate.  
  *Stop if*: The link between threads is demonstrably direct (e.g., Lovelace citing Babbage), or qualifications bury the lead for a general audience.  

  **What the Procedure Ignores (and Why)**  
  - **Topic relevance**: Choosing Semmelweis because hand hygiene matters today isn’t Whiggism; it’s audience engagement.  
  - **Resource advantage**: Saying "Lister had microscopes Semmelweis lacked" is valid if framed as tools, not wisdom.  
  - **Praise for achievement**: Calling Lovelace’s music speculation "brilliant" is permissible if rooted in her contemporaries’ metrics (e.g., novel for its era).  
  These are curatorial choices, not narrative distortions.  

  ---

  **Application to Your Drafts**  
  **1. Semmelweis Label (Original)**  
  >*In 1847... death rate collapsed. His colleagues refused to listen, and it was not until Pasteur and Lister proved that germs cause disease... that the simple truth he had already discovered became ordinary practice.*  

  - **Temporal Default Test**: "Refused to listen" (blame), "not until... proved" (present as baseline), "simple truth... already discovered" (causal reversal).  
  - **Repaired**:  
  >*In 1847... death rate collapsed. His colleagues questioned his methods, pointing to miasma theory and lack of germ evidence. After Pasteur and Lister demonstrated germ theory decades later, his handwashing protocol was widely adopted.*  
  *Repairs*: "Questioned his methods" (neutral action), "pointing to..." (contemporary rationale), "after... demonstrated" (neutral chronology), "protocol" (avoids "truth").  

  **2. Computing Timeline (Original)**  
  >*From Babbage... to the phone in your pocket... a single idea growing clearer... Each generation stood on the shoulders of the last, and every dead end... was a step forward really, since nothing... was wasted.*  

  - **Causal Reversal Test**: "Growing clearer" implies destiny; "dead end was a step forward" only makes sense because we know the endpoint.  
  - **Rival Viability Test**: If swapped (e.g., "each generation discarded the last’s errors"), "stood on shoulders" and "step forward" become nonsensical.  
  - **Convergence Audit**: False continuity (Babbage ≠ smartphone goals); false accumulation (punched cards *were* reused).  
  - **Repaired**:  
  >*Babbage’s 1830s Analytical Engine envisioned mechanical calculation. Later innovators, from tube engineers to microchip designers, repurposed concepts like punched cards while pursuing distinct goals—from codebreaking to gaming. Many "dead ends" proved adaptable for new tasks.*  
  *Repairs*: "Envisioned" (avoids destiny), "repurposed... pursuing distinct goals" (acknowledges divergence), "adaptable for new tasks" (accumulation without teleology).  

  **3. Lovelace Tote Bag (Original)**  
  >*Ada Lovelace... first computer programmer... wrote the first algorithm... saw... that it could compose music. Her notes lay unread for a century, because the world was not yet ready.*  

  - **Temporal Default Test**: "World not ready" implies present superiority.  
  - **Rival Viability Test**: If swapped (e.g., "a skeptic’s notes lay unread..."), "not ready" still implies inevitable adoption.  
  - **Repair Attempt**:  
  >*Ada Lovelace... wrote an algorithm for Babbage’s unbuilt Engine. Her speculation that such devices might compose music received little attention, as few contemporaries shared her focus on creative applications.*  
  *Verdict*: This passes diagnostics—but I suspect you’ll dislike softening "first programmer" (a factual claim per your curators). The procedure *clears* this because "first" is a fact, and "speculation... received little attention" avoids teleology. If "first" feels Whiggish, that’s a naming issue (see limitations).  

  ---

  **Where the Procedure Goes Blind**  
  1. **Naming choices**: It can’t address *whose* achievements get labeled "firsts" or whose rivals go unmentioned (e.g., Lovelace vs. contemporaries who imagined non-numeric machines). This is archival/political.  
  2. **Complex contingencies**: In multi-cause events (e.g., "germ theory won due to lab tech + hospital reforms"), it flags framing but can’t weigh factors. That requires curator debate.  
  3. **Implied audiences**: It won’t catch Eurocentrism if rival swaps stay within the same regional context.  
  4. **"Voice" overcorrection**: Used rigidly, it could make texts bloodless. A volunteer might strip all judgment, losing engagement. Your expertise balances this.  

  **Final Output**: A 70-word label should tolerate 1–2 repairs. If Tests 1–3 demand 3+ edits, or Test 4 requires >5 added words, flag it for director input. Values—like crediting benefactors or affirming progress—live beyond diagnostics. This won’t fix every flaw, but in 15 minutes, it will excise the most glaring Whiggism.  

  Let me know if you’d like adjustments before sharing with your team.  

  Best,  
  [Your Name]
