prompt: |-
  I build and maintain probabilistic risk models, and there is a configuration I keep meeting in them for which I have no vocabulary. I would like to know whether it has a name, and — more usefully — how exactly it should be carved up, since a bare label would not tell me anything I can act on.

  Here is the smallest case in which I can see it. I am tracking a shipment. Before any message arrives my credences over four exclusive possibilities are: delayed and held at customs, 0.24; delayed for some other reason, 0.16; not delayed and arrived early, 0.30; not delayed and arrived on time, 0.30. A source I only partly trust sends word: if the shipment was delayed, the delay was at customs. Nothing in the message makes me certain of anything, so ordinary conditionalising on a learned proposition is not available to me. There are two ways of cashing out what the message does, and as I assess its credibility both of them squeeze the same possibility — delayed for some other reason — down to 0.08. On the first, the message bears on a proposition, the conditional read materially, true unless the shipment is both delayed and held somewhere else: that proposition goes from 0.84 to 0.92. On the second, the message bears on a ratio: the chance of customs given delay goes from 0.60 to 0.80.

  The two readings agree about which cell shrinks and disagree about everything else, because they disagree about where the freed weight goes. The first, if I hold fixed the relative weights among the ways the message could be true, spreads it over all three remaining cells in proportion to their prior sizes: the two not-delayed cells rise to roughly 0.329 each, delayed-and-at-customs to roughly 0.263, and my confidence that the shipment was delayed at all falls from 0.40 to about 0.343 — note that the ratio I would have naively taken myself to be adjusting moves as well, but only to about 0.767. The second, if I hold fixed the delayed/not-delayed split on the grounds that the message concerns where the delay happened rather than whether there was one, sends the entire freed 0.08 into delayed-and-at-customs, which rises to 0.32, and leaves my confidence in a delay at 0.40. Both procedures answer to the instruction to change as little as you can; they differ only in what they treat as held fixed, and they give answers for the delay question that differ by more than a tenth of its prior value. The arithmetic is mine and I have checked it, but I would not be shocked at a slip.

  Four further things I have noticed, which may or may not be the same phenomenon. First, neither reading determines a unique answer on its own: the message supplies one number, and the rest has to come from a stipulation about what is preserved, and that stipulation is indexed to how I had already divided up the possibilities before any evidence arrived — a bookkeeping decision with no evidential content. Second, when two such messages arrive together, the order in which I process them changes the result, and when both bear on the same conditional the earlier one is erased entirely: only my final confidence in the conditional seems to matter, so that two independent reports count for no more than one. Third, the rules I can think of all agree at both extremes — when the message is worthless and when it is conclusive — and disagree in between, with the disagreement largest when the message is moderately informative; I cannot find anything in the situation that selects among them. Fourth, and strangest: a colleague tells me that for a nested message, of the form if the shipment was delayed, then if it was delayed more than a day it was held at customs, it matters whether I collapse this into if it was delayed more than a day it was held at customs, and that whether collapsing is legitimate is itself disputed for probabilistic readings of conditionals even though it is trivially fine for the material one.

  To be clear about what I am not asking about. When the uncertain news concerns a flat matter of fact — an instrument reading, a witness saying that it rained — I have a procedure I trust, and it is not in question here. Nor is this the puzzle about how a proposition one already accepted can lend support to a general hypothesis. My difficulty is specific to news whose content is conditional in form: I want to know whether the conditional shape adds anything to the problem of updating on something you are not certain of, or whether it only complicates the bookkeeping, and if the former, what exactly it adds.

  So: does this configuration have a name? Which are the nearest established concepts, and where does each one stop short of what I have described — in particular, are my four further observations one thing or several, and which of them travel together? Is there a principled constraint that picks out one rule, an analogue of change nothing you are not forced to change, and what would have to be true of a case for that constraint to apply? And if nothing established fits, coin a term for it: give a definition, the conditions under which it applies, and boundary cases, including a case that looks like mine but is not one, and a version of mine where the right answer is uncontroversial. I am after the carving and the edges, not the label.
reasoning: |-
  We are dealing with updating beliefs when receiving uncertain evidence that has a conditional structure. Specifically, the evidence is of the form "if A, then B" (in this case: if delayed, then held at customs) and we are not certain of the truth of this conditional.

  The problem is that there are at least two ways to interpret the update:

  1. **Material conditional interpretation**: The message is interpreted as the material conditional ¬A ∨ B (i.e., not delayed OR held at customs). Then we update by increasing our credence in this proposition.

  2. **Ratio interpretation**: The message is interpreted as updating the conditional probability P(B|A) (i.e., the probability of held at customs given delay) to a new value.

  In the example, both methods reduce the probability of "delayed for some other reason" (i.e., A and ¬B) from 0.16 to 0.08. But they redistribute the 0.08 in different ways:

  - The material conditional interpretation spreads the 0.08 proportionally to the other three states (since the material conditional is true in those states). So it increases the probabilities of: (delayed and at customs), (not delayed and early), (not delayed and on time).

  - The ratio interpretation keeps the probability of A (delay) fixed and only adjusts the conditional probabilities within A. So the entire 0.08 is added to "delayed and at customs", leaving the non-delayed states unchanged.

  The question is: which update is appropriate? And more broadly, what is the established way to handle such updates?

  ## Established Concepts

  1. **Jeffrey Conditionalization**: This is the standard method for updating on uncertain evidence. When we have a partition of the possibility space and we get evidence that directly changes the probabilities of the cells in that partition, we use Jeffrey's rule. However, in this case, the evidence is not directly about a partition but about a conditional.

  2. **Adams Conditioning**: This is an update rule specifically for conditionals. It adjusts the conditional probability P(B|A) while leaving the probability of the antecedent P(A) unchanged. This matches the ratio interpretation. Adams conditioning is named after Ernest Adams, who worked on the logic of conditionals and their probabilities.

  3. **Updating on Conditionals**: There is a literature on how to update beliefs when learning a conditional. One approach is to treat the conditional as a constraint on the conditional probability. This is the ratio approach.

  ## The Two Interpretations

  ### Material Conditional Update
  - We interpret the message as asserting the material conditional (¬A ∨ B). We then update our belief in this proposition. Since we are not certain, we use Jeffrey conditionalization: we set a new probability for (¬A ∨ B) and redistribute the probabilities accordingly, preserving the relative probabilities of the worlds in which (¬A ∨ B) is true and similarly for false. However, note that in this case, when we update the material conditional, we are also affecting the probability of the antecedent A. In the example, P(A) decreases.

  ### Ratio Update (Adams Conditioning)
  - We interpret the message as providing information about the conditional probability P(B|A). We set a new value for P(B|A) and then update the joint probabilities in a way that preserves P(A) and the probabilities of the non-A worlds. This is done by setting:
      P_new(A and B) = P_new(B|A) * P(A)
      P_new(A and ¬B) = (1 - P_new(B|A)) * P(A)
    and leaving the non-A worlds unchanged.

  ## Which One to Choose?

  The choice depends on what the message is taken to convey.

  - If the message is interpreted as evidence about the material conditional (i.e., that either there was no delay or if there was a delay it was at customs), then the material conditional update is appropriate.

  - If the message is interpreted as evidence about the conditional probability (i.e., that among the delayed cases, 80% are at customs), then the ratio update (Adams conditioning) is appropriate.

  In the example, the message is: "if the shipment was delayed, the delay was at customs". This is naturally interpreted as a conditional statement about the cause of the delay, and it does not seem to provide information about the non-delayed cases. Therefore, the ratio interpretation (Adams conditioning) is more appropriate.

  ## The Four Further Observations

  1. **Non-uniqueness**: The update requires a stipulation about what is preserved. This is because the evidence only gives one constraint (either the new probability of the material conditional or the new conditional probability) and we have multiple degrees of freedom. So we need a principle of minimal change to fill in the rest. The two interpretations are two different principles of minimal change.

  2. **Order Dependence and Independence**: When updating on multiple conditionals, the order may matter if we use Jeffrey conditionalization for material conditionals. However, if we use Adams conditioning, then updating on multiple conditionals that constrain the same conditional probability will overwrite the previous update because we are setting the conditional probability to a new value. This is because Adams conditioning sets the conditional probability to a specific value, so the last update is the one that matters. In contrast, if we update the material conditional, then two updates on the same conditional would compound in a way that might be additive? But note: two messages about the same conditional might be independent evidence. However, in the ratio approach, if we get two independent pieces of evidence about the same conditional probability, we should combine them in a way that updates the conditional probability. This would require a more sophisticated method (like using a beta prior for the conditional probability) rather than setting it to a fixed value.

  3. **Agreement at Extremes**: Both methods agree when the message is worthless (no change) or conclusive (sets the conditional to 1, or sets the material conditional to 1, which would force A and ¬B to 0). They disagree in between.

  4. **Nested Conditionals**: The issue of whether to collapse nested conditionals is related to the interpretation of conditionals. The material conditional interpretation would collapse "if A, then (if C then D)" to "if (A and C) then D" because the material conditional is equivalent to ¬A ∨ ¬C ∨ D. However, for conditional probabilities, P(D|A and C) is not the same as P( if C then D | A ). The latter is not standardly defined because conditionals are not events. In the ratio approach, we would update the conditional probability P(D | A and C). So the ratio approach does not collapse nested conditionals.

  ## Principled Constraint

  The key is to understand the content of the message. If the message is about the relationship between A and B (i.e., when A is true, then B is true) without affecting the probability of A, then Adams conditioning (ratio update) is the way to go. This is the standard update for learning conditional information.

  However, if the message is taken to provide evidence about the material conditional (which is a proposition) then we update that proposition.

  In the context of probabilistic risk models, it is likely that the intended meaning of the message is about the conditional probability. Therefore, Adams conditioning is the appropriate method.

  ## Name

  This configuration is known as **updating on a conditional** or **learning conditional information**. The specific update rule that adjusts the conditional probability without changing the probability of the antecedent is called **Adams conditioning**.

  ## Boundary Cases

  ### Uncontroversial Case
  Suppose we are certain of the conditional: i.e., the message is completely trusted and we set P(B|A)=1. Then both methods agree: they set P(A and ¬B)=0 and redistribute that mass. In the material conditional update, we set P(¬A ∨ B)=1, so we set P(A and ¬B)=0 and then redistribute the 0.16 proportionally to the other three states. But note: the ratio update (with P(B|A)=1) sets P(A and ¬B)=0 and then adds the 0.16 to P(A and B). However, in the ratio update, we leave P(¬A) unchanged, so the non-delayed states remain at 0.60. Therefore, the two methods still differ in this case? 

  Wait: when we set P(B|A)=1, then in the ratio update we have:
     P_new(A and B) = 1 * P(A) = 0.40
     P_new(A and ¬B) = 0
     and the non-delayed states remain at 0.30 and 0.30.

  But the material conditional update: we set P(¬A ∨ B)=1. The prior P(¬A ∨ B) was 0.84. We set it to 1, so we increase by 0.16. We then distribute this 0.16 proportionally to the states where the material conditional is true: (¬A and early), (¬A and on time), (A and at customs). Their prior probabilities were 0.30, 0.30, 0.24, summing to 0.84. So we multiply each by (1/0.84). Then:
     P_new(¬A and early) = 0.30 * (1/0.84) ≈ 0.357
     P_new(¬A and on time) = 0.30 * (1/0.84) ≈ 0.357
     P_new(A and at customs) = 0.24 * (1/0.84) ≈ 0.286
     P_new(A and not at customs) = 0.

  But note: the probability of A (delay) becomes 0.286, which is less than the prior 0.40. In the ratio update, the probability of A remains 0.40.

  So even at the extreme, they differ? That doesn't seem right. Actually, the message "if delayed, then at customs" when taken with certainty should only rule out the case (delayed and not at customs). It should not change the probability of non-delayed events. Therefore, the ratio update (which leaves non-A unchanged) is the uncontroversial one. The material conditional update is controversial because it changes the probability of A.

  Therefore, the uncontroversial case is when we are certain of the conditional: we set P(A and ¬B)=0 and leave everything else unchanged. This is exactly what the ratio update does. The material conditional update does more: it changes the non-A events. So in the extreme case, the ratio update is the correct one.

  ### A Case That Looks Like Mine But Isn't

  Suppose we have evidence that directly affects the probability of the antecedent. For example, a message that says "the shipment was delayed". Then we update the probability of delay. This is straightforward Jeffrey conditionalization on the partition [delayed, not delayed]. This is not about a conditional.

  ## Conclusion

  The configuration is called **Adams conditioning** for updating on a conditional. The rule is: when you receive evidence that sets the conditional probability P(B|A) to a new value (or more generally, changes it), then you update by:

     P_new(A and B) = P_new(B|A) * P(A)
     P_new(A and ¬B) = (1 - P_new(B|A)) * P(A)

  and leave the probabilities of ¬A unchanged.

  The conditions under which it applies: when the evidence directly bears on the conditional probability P(B|A) and not on the probability of A or the non-A cases.

  The boundary case where the answer is uncontroversial: when we learn with certainty that if A then B. Then we set P_new(A and ¬B)=0 and leave the rest unchanged.

  The four observations:

  1. Non-uniqueness: In Adams conditioning, we only change the conditional probability and leave the rest fixed. So we do have a unique update once we specify the new conditional probability and the principle that the non-A probabilities are unchanged.

  2. Order dependence: If we get multiple messages about the same conditional, the last one overwrites the previous because we are setting the conditional probability to a specific value. To handle independent evidence, we should use a more sophisticated method (e.g., treat the conditional probability as a random variable and update it with Bayesian inference).

  3. Agreement at extremes: They agree when the new conditional probability equals the old (no change) or when it is 1 (then both set P(A and ¬B)=0, but note: the material conditional update would change the non-A probabilities, so at the extreme of certainty they do not agree. However, we argued that the ratio update is the correct one at the extreme of certainty).

  4. Nested conditionals: Adams conditioning does not collapse nested conditionals. We update the conditional probability of the innermost conditional given the antecedents.

  Therefore, the term to use is **Adams conditioning** for the ratio update. The material conditional update is not appropriate for conditional information.

  ## How to Act

  In your models, when you receive a message of the form "if A, then B", interpret it as evidence about the conditional probability P(B|A). Decide on a new value for P(B|A) (which may be a weighted average of the old and the message, depending on the credibility of the source) and then apply Adams conditioning: adjust the joint probabilities for A and B, leaving the non-A probabilities unchanged.

  This will keep the probability of A fixed and only change the conditional distribution within A.
answer: |-
  ### The Configuration: Named and Carved

  This configuration is known as **updating on an uncertain conditional**. The core challenge arises when evidence takes the form of a conditional statement (e.g., "if A, then B"), but you lack certainty in its truth. The two update methods you describe correspond to distinct **interpretations of the conditional** and different **minimal change principles**. The established concept that best encompasses your scenario is **Adams conditioning** (for the ratio interpretation), while the material conditional interpretation aligns with **Jeffrey conditionalization** on a proposition. Below, I define the concepts, carve the boundaries, address your observations, and provide boundary cases.

  ---

  ### Key Concepts and Their Boundaries
  #### 1. **Adams Conditioning (Ratio Interpretation)**  
     - **Definition**: Update by directly modifying the conditional probability \(P(B|A)\) while holding \(P(A)\) and the probabilities of \(\neg A\) states fixed. The joint probabilities are adjusted as:  
       \[
       P_{\text{new}}(A \land B) = P_{\text{new}}(B|A) \cdot P(A), \quad P_{\text{new}}(A \land \neg B) = [1 - P_{\text{new}}(B|A)] \cdot P(A).
       \]  
       Non-\(A\) states (e.g., "not delayed") remain unchanged.  
     - **When it applies**: Use when the evidence speaks to the relationship *within* \(A\) (e.g., "if delayed, *where* was it held?"). It assumes the evidence does not bear on whether \(A\) occurred.  
     - **Boundaries**:  
       - **Stops short** if the evidence affects \(P(A)\) (e.g., a message implying delays are more common).  
       - **Not applicable** for nested conditionals (e.g., "if A, then if C, then D") without further assumptions (see observation 4).  

  #### 2. **Jeffrey Conditionalization on the Material Conditional**  
     - **Definition**: Treat the conditional as the material implication \(\neg A \lor B\) (true unless \(A \land \neg B\)). Update by setting a new credence for \(\neg A \lor B\) and redistributing probability proportionally within the true/false partitions of this proposition.  
     - **When it applies**: Use when the evidence speaks to a *proposition* (e.g., "either not delayed, or delayed at customs"). This assumes the evidence may bear on both \(A\) and non-\(A\) states.  
     - **Boundaries**:  
       - **Stops short** if the conditional is not truth-functional (e.g., counterfactuals).  
       - **Fails** for nested conditionals (material implication collapses them, but probabilistic conditionals do not).  

  #### 3. **Unifying Concept: Uncertain Conditional Update**  
     - **Core issue**: Both methods handle uncertain conditionals but enforce different minimality constraints:  
       - *Adams*: Preserve \(P(A)\) and non-\(A\) ratios.  
       - *Jeffrey (material)*: Preserve relative odds within \(\neg A \lor B\) and its negation.  
     - **Name**: The broader configuration is termed **learning conditional information under uncertainty**.  

  ---

  ### Your Four Observations: Unified or Distinct?  
  Your observations are interconnected aspects of the same phenomenon—**ambiguity in minimal change principles**. Here’s how they travel together:  

  1. **Non-uniqueness**:  
     - **Cause**: A single constraint (e.g., \(P_{\text{new}}(B|A) = 0.8\)) is underdetermined; the rest depends on *what to hold fixed*.  
     - **Distinction**: Adams fixes \(P(A)\) and non-\(A\); Jeffrey fixes ratios within partitions. Both are "minimal" but under different bookkeeping.  
     - **Carving**: This is inherent to conditional updates—no evidential input resolves it without auxiliary assumptions.  

  2. **Order dependence and erasure**:  
     - **Cause**: Both methods update point estimates (e.g., set \(P(B|A)\) to a value). Independent evidence isn’t aggregated; the last update overwrites prior ones.  
     - **Unified with observation 1**: Stipulating "what to hold fixed" ignores the evidence history.  
     - **Boundary**: If messages constrain *different* conditionals (e.g., "if A, B" and "if C, D"), order dependence vanishes.  

  3. **Agreement at extremes**:  
     - **Cause**: At \(P_{\text{new}}(B|A) = P_{\text{old}}(B|A)\) (no change) or \(P_{\text{new}}(B|A) = 1\) (certainty), both methods agree:  
       - Certainty: Both set \(P(A \land \neg B) = 0\).  
       - No information: No change.  
     - **Carving**: Disagreement peaks at moderate information because minimality criteria diverge when probabilities shift "partway."  

  4. **Nested conditionals**:  
     - **Cause**: Material conditionals collapse nested statements (e.g., "if A, then (if C, then D)" becomes "if A \land C, then D"). Probabilistic conditionals do not, as \(P(D|A \land C)\) is not equivalent to \(P(\text{if } C \text{ then } D \mid A)\).  
     - **Unified with core issue**: The problem extends to higher-order conditionals, but the ambiguity (material vs. ratio) persists.  

  **Conclusion**: All four observations stem from the same root—**interpreting conditionals and choosing minimal change constraints**—and travel together in cases involving uncertain conditional evidence.  

  ---

  ### Principled Constraints: When to Use Which  
  The choice depends on **what the evidence is about**. Use:  
  - **Adams conditioning** if the evidence:  
    - Concerns *how A manifests* (e.g., "among delays, customs is the cause").  
    - Should not affect whether \(A\) occurred.  
  - **Jeffrey (material)** if the evidence:  
    - Bears on a *factual proposition* (e.g., "the shipment wasn’t both delayed and not at customs").  
    - Could alter \(P(A)\) or non-\(A\) states.  

  **No universal constraint**: Neither method is "correct" in all cases. The decision hinges on **causal/evidential structure**:  
  - Example (Adams): A customs agent reports, "If delayed, it was at customs." This speaks to causes *given delay*; preserve \(P(\text{delay})\).  
  - Example (Jeffrey): A sensor detects "no non-customs delay." This is about a global state; update the proposition \(\neg (\text{delay} \land \neg \text{customs})\).  

  ---

  ### Boundary Cases  
  #### 1. **Uncontroversial Case (Adams is preferred)**  
     - **Scenario**: Same shipment prior. A fully trusted source (certainty) says, "If delayed, it was at customs."  
     - **Uncontroversial update**: Set \(P(\text{delay} \land \neg \text{customs}) = 0\), add the 0.16 to \(P(\text{delay} \land \text{customs})\) (now 0.40). Non-delay probabilities unchanged.  
     - **Why uncontroversial**: Certainty eliminates \(A \land \neg B\); evidence about "where given delay" shouldn’t affect non-delay. Jeffrey (material) distorts this by inflating non-delay probabilities.  

  #### 2. **Looks Similar But Isn’t**  
     - **Scenario**: Message is, "The shipment was delayed at customs."  
     - **Why different**: This is a **categorical statement** (not conditional). Use Jeffrey conditionalization on the proposition "delayed at customs" to update its probability directly. No ambiguity arises.  

  #### 3. **Edge of Applicability**  
     - **Scenario**: Message is, "If delayed, it was not at customs."  
     - **Adams**: Reallocates probability from "delayed at customs" to "delayed for other reasons."  
     - **Jeffrey (material)**: Updates \(P(\neg \text{delay} \lor \neg \text{customs})\), affecting non-delay states.  
     - **Boundary**: Both methods apply, but choice depends on evidence interpretation (see "Constraints" above).  

  ---

  ### Summary and Coinage  
  - **Name**: **Ambiguous Conditional Update** (ACU)  
  - **Definition**: Updating beliefs when uncertain evidence has conditional form, requiring a choice between:  
    - *Adams conditioning* (preserve antecedent probability and non-antecedent states).  
    - *Material Jeffrey* (preserve relative odds within the material conditional’s partitions).  
  - **When it applies**: Evidence is an uncertain conditional ("if A, B"); prior has distinct \(A \land \neg B\) state; evidence credibility is partial.  
  - **Carving key**: ACU arises when evidence is *about a dependency* (A→B), not a direct fact. It adds complexity because:  
    - Conditionals aren’t propositions (philosophically contentious).  
    - Minimal change under constraints is underspecified.  
  - **What it adds**: Beyond generic uncertain updates, ACU forces a decision about **evidence scope** (does it affect the antecedent?) and **dependency preservation** (are ratios structural?).

  By mapping to Adams/Jeffrey frameworks and clarifying boundaries, you can systematize updates: Choose Adams for "within-A" evidence, Jeffrey for propositional evidence, and flag nested conditionals as unresolved. Implementations should document the chosen minimality constraint to audit sensitivity.
