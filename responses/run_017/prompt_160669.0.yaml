  Below is a decision tree designed to clarify positions in your reading group's debate about string theory and the multiverse. It starts from concrete cases and separates positions based on responses to specific, non-loaded questions. The tree has **8 branch questions** (with variants for T1) and **10 leaf positions**. Unoccupied combinations are noted, and distinctions between "truth" vs. "future use" are embedded in the funding question. A **5-question short version** with scoring key is included at the end.

  ---

  ### **Decision Tree: Evaluating Non-Empirical Support for a Theory**

  **Instructions:**  
  Answer each question sequentially. Proceed down the branch matching your answer. Stop when you reach a leaf position.  
  *Cases referenced are defined in your query.*

  ---

  #### **Q1: In case T1 (variant b: rivals reduce to T), does the decades-long absence of rivals to theory T raise your confidence in T?**  
  - **Yes** → Proceed to Q2.  
  - **No** → Proceed to Q3.  

  #### **Q2: In case T2, does T explaining *unexpected* phenomenon Y (even with a free parameter) raise your confidence?**  
  - **Yes** → **Leaf A: Explanatory Coherence Advocate**  
    (Unexpected explanatory success is evidence; T1 variant b may also support. Funding depends on coherence strength.)  
  - **No** → **Leaf B: No Alternatives Advocate**  
    (Absence of rivals is primary evidence; T2 does nothing. Funds if rivals remain elusive.)  

  ---

  #### **Q3: In case T1 (variant a: attention moved elsewhere), does the absence of rivals raise your confidence?**  
  - **Yes** → Proceed to Q4.  
  - **No** → Proceed to Q5.  

  #### **Q4: In case T2, does T explaining *why we don’t see Z* raise your confidence?**  
  - **Yes** → **Leaf C: Explanatory Breadth Advocate**  
    (Explaining absences/unexpected symmetries is evidence. Funds if breadth is novel.)  
  - **No** → **Leaf B: No Alternatives Advocate**  
    (Variant a/b both support; T2 does nothing. Funds if no rivals emerge.)  

  ---

  #### **Q5: In case T3 (harsher version: T predicts *no new phenomena ever*), does this lower your confidence?**  
  - **Yes** → Proceed to Q6.  
  - **No** → Proceed to Q7.  

  #### **Q6: In case T4, does the measure problem (opposite expectations from unfixable measure) mean *no probabilities can be assigned* to observations?**  
  - **Yes** → **Leaf D: Measure Problem Skeptic**  
    (No probabilities → no predictions → no support. Funds only if measure is fixed.)  
  - **No** → **Leaf E: Accommodation Objector**  
    (T3 proves T predicts nothing; non-empirical virtues irrelevant. No funding.)  

  ---

  #### **Q7: Can non-empirical evidence (e.g., from T1/T2) update your *credence* in T’s truth?**  
  - **Yes** → Proceed to Q8.  
  - **No** → **Leaf F: Strict Bayesian**  
    (Likelihood undefined → no rational updating. Funds only for mathematical tools.)  

  #### **Q8: Would you fund research expecting *progress toward truth*, not just usefulness?**  
  - **Yes** → **Leaf G: Realist**  
    (T has truth value; non-empirical evidence supports it. Funds for truth-seeking.)  
  - **No** → **Leaf H: Research Pragmatist**  
    (Funds for potential utility/insight, regardless of truth. "Future use" ≠ "true".)  

  ---

  #### **Unnamed Leaves**  
  - **Leaf I: Framework Non-Believer**  
    (Reached if Q5=No and Q7=No: T is a tool, not a description. Funds for math/utility. *Embedded in Q7→Q8 path if funding is for use, not truth.*)  
  - **Leaf J: Demarcation Skeptic**  
    (Reached if Q5=No and Q6=Yes: T3+T4 make T unfalsifiable → not science. No funding. *Embedded in Q5→Q6 path.*)  

