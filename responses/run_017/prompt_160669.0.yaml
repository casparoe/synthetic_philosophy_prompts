  3. **Leaf C: Explanatory Breadth Advocate**  
     T2’s explanation of absent Z supports T; T1 variant a matters.  
     *Funding:* Yes, if breadth is non-trivial.  
  4. **Leaf D: Measure Problem Skeptic**  
     T4 prevents probabilities → no support.  
     *Funding:* Only if measure solved.  
  5. **Leaf E: Accommodation Objector**  
     T3 (harsher) proves T predicts nothing → no support.  
     *Funding:* No.  
  6. **Leaf F: Strict Bayesian**  
     No likelihood → no updating. Non-empirical "evidence" irrelevant.  
     *Funding:* Only for math tools.  
  7. **Leaf G: Realist**  
     Non-empirical evidence updates credence in T’s *truth*.  
     *Funding:* Yes, for truth-seeking.  
  8. **Leaf H: Research Pragmatist**  
     Funds for *progress* (e.g., math, models), not truth.  
     *Funding:* Yes, as a strategic bet.  
  9. **Leaf I: Framework Non-Believer**  
     T is a useful construct; "truth" is misplaced.  
