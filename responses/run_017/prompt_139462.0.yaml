  #### **Question 1: Inventory Change**  
  *When a new day begins, does the total set of things that exist ever gain or lose members? (For example, when dinosaurs roamed the Earth, did they exist—and when they went extinct, did they stop existing?)*  
  - **Yes** (gain/loss occurs) → Go to Question 2.  
  - **No** (inventory is fixed) → Go to Question 3.  

  #### **Question 2: Past-Tensed Truthmakers**  
  *What makes it true that "Socrates was a philosopher"? (Assume you know this fact with certainty.)*  
  - **A** → Present evidence, records, or fundamental tensed facts (e.g., "Socrates’s being a philosopher *was* true").  
  - **B** → Socrates himself, existing *in the past*, possessing the property of being a philosopher.  
    - **A** → Go to Question 4.  
    - **B** → Go to Question 5.  

  #### **Question 3: Felt Passage of Time**  
  *Does the feeling that "time is passing" (e.g., the sense that events are constantly slipping into the past) reflect a feature of reality itself?*  
  - **Yes** (world does it) → **Moving Spotlight** (leaf).  
  - **No** (we do it) → Go to Question 6.  

  #### **Question 4: Relativity of Existence**  
  *Two astronauts pass each other at high speed: one says event X is happening *now*, the other says event Y (≠X) is happening *now*. Is there an objective fact about who is correct?*  
  - **Yes** (privileged "now" exists) → Go to Question 7.  
  - **No** → Go to Question 8.  

  #### **Question 5: Future Existence**  
  *Do specific future events (e.g., tomorrow’s sunrise) exist *now*?*  
  - **No** → Go to Question 9.  
  - **Yes** → *Empty cell* → **Diagnosis**: Incoherent. If past things exist *and* future things exist, the inventory cannot change (contradicts Question 1).  

  #### **Question 6: Future Structure**  
