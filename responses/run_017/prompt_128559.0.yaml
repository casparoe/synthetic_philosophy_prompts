prompt: |-
  Compose a case to the following specification. I need it for a seminar on causation by omission: I want to press a difference-making theorist into either accepting both of two omissions as causes of a bad outcome or producing some non-normative condition that makes only one of them eligible.

  Design a pair of cases, written together in at most 200 words, set in an ordinary institutional context — a hospital ward, a nursery, a plant floor, a signal box, your choice. In each, one person fails to act, and a bad outcome follows. The two cases must be alike in the counterfactual respects that bear on the outcome: the same kind of outcome, produced by the same kind of process, where in each case had the agent acted the outcome would not have occurred, and where the omission is not a case of symmetric overdetermination among several non-actors and does not work by double prevention. They must also be alike in every normative respect: no duty, role, office, rule, promise, contract, special relationship, or expectation attaches to either agent, and neither agent did anything earlier that created the danger. The cases are to differ in one respect only — say so plainly if you need more than one — and that respect must not be normative. It is what makes the omission a cause in one case and not in the other.

  Then give me, under the following headings:

  - **The pair** (one paragraph, both cases in matched language, no asymmetry of tone or framing doing any work).
  - **Held fixed** (~100 words): the counterfactual and normative facts common to both, as a checklist I can run against the paragraph.
  - **Three accounts** (~250 words): what a difference-making account, a norm-based account, and an agency account each say in each case, and why.
  - **The feature** (~130 words): name the single non-normative feature doing the work, argue that it is not a duty, expectation, or difference-making fact in disguise, and say what becomes of the pair if it is deleted and nothing else changes. Commit to one feature rather than canvassing candidates.
  - **The counterattack and your verdict** (~180 words): the strongest move available to the difference-making theorist — stipulation, a pragmatic or conversational explanation of the asymmetry, or just biting the bullet — and then your own verdict on whether the pair survives it. Take a side.
  - **Fragility** (~60 words): where the case is most likely to break.
reasoning: |-
  Okay, the user wants a pair of cases for a seminar on causation by omission. They need to challenge difference-making theorists by presenting two scenarios where omissions lead to a bad outcome, but only one is intuitively seen as a cause. The key is that both cases must be identical in counterfactual and normative aspects but differ in one non-normative feature. 

  First, I consider the institutional context. A hospital ward seems fitting—familiar, high-stakes, and allows clear omissions. The bad outcome should be serious but plausible, like cerebral hypoxia. I sketch two cases: one where an absent nurse fails to respond to an alarm (no one else present), and another where a present nurse ignores the same alarm (others present but distracted). 

  The challenge is ensuring symmetry. Both cases must share: outcome (cerebral hypoxia), process (monitor alarm ignored), counterfactual (action would prevent outcome), and normative neutrality (no duties, roles, or prior actions). The only difference? Presence of other potential interveners—a physical, non-normative fact. 

  For the "three accounts" section: difference-making theory treats both omissions identically since counterfactuals match. Norm-based accounts would struggle as no duties exist. Agency accounts might focus on opportunity (only the present nurse had it). 

  The critical feature is physical presence of others. Not normative—it doesn't create duty—and not difference-making, as the counterfactual remains "had this agent acted." If removed, both cases collapse to solitary inaction. 

  The difference-maker's strongest counterattack might be to bite the bullet and call both causes. But intuitively, only Case A feels causal—blaming someone who wasn't there seems odd. I think the pair survives because physical presence affects causal attribution psychologically, even if not logically. 

  Fragility lies in the "distraction" detail. If the other staff in Case B could've noticed, it might reintroduce normative elements. Must emphasize their identical unresponsiveness. 

  User's deeper need: a airtight philosophical tool exposing tensions in causation theories. Precision in symmetry is crucial—any hidden asymmetry ruins it. Must stress that "opportunity" here is physical, not deontic.
answer: |-
  ### The Pair  
  On Ward 7, Nurse A is absent from her station when a patient’s oxygen monitor alarms. She sees the alert remotely but ignores it. Cerebral hypoxia results. On Ward 8, Nurse B is physically present at her station when an identical monitor alarms. She sees the alert but ignores it. Cerebral hypoxia occurs. In both wards, the alarm is audible only at the nurses’ station, and no other staff intervene.  

  ### Held Fixed  
  **Counterfactual:** Had either nurse pressed the silence override and called a code, hypoxia would not have occurred. Identical causal process: alarm ignored → oxygen cutoff → hypoxia. No overdetermination or double prevention.  
  **Normative:** Neither nurse has a duty, contractual obligation, or prior causal responsibility. No promises, special relationships, institutional rules, or reasonable expectations bind them to act. Neither created the risk.  

  ### Three Accounts  
  - **Difference-making:** Both omissions are causes. In both cases, but for the nurse’s inaction, the outcome would not have occurred (*sine qua non* condition satisfied). The counterfactual dependence is identical.  
  - **Norm-based:** Neither omission is a cause. Without duties, roles, or expectations, there is no normative "baseline" to label the omission deviant. Both are mere non-interventions.  
  - **Agency:** Only Nurse B’s omission (Ward 8) is causal. Nurse B was *present* and had immediate opportunity to act. Nurse A’s absence (Ward 7) removes her from the sphere of agential intervention—she wasn’t "in position" to cause the outcome.  

  ### The Feature  
  The **physical presence of other potential interveners** distinguishes the cases. In Ward 7, *no other staff were on duty*; in Ward 8, two other staff were present but distracted by paperwork. This is non-normative: their presence doesn’t imply duty (they had no patient assignments) or expectation (distraction was routine). It’s not difference-making: counterfactually, had Nurse B acted, outcome still wouldn’t occur, regardless of others. If we remove other staff from both cases, Ward 8 collapses into Ward 7: both become "solitary inaction" with no intuitive cause.  

  ### Counterattack and Verdict  
  **Counterattack:** The difference-maker bites the bullet: *both omissions cause the outcome*. The asymmetry is epistemic/pragmatic, not metaphysical. We *blame* Nurse B more because her presence makes her inaction salient, but causation is symmetric.  
  **Verdict:** The pair survives. Presence creates a *causal context*: Nurse B’s omission intercepts a process unfolding *before her*, while Nurse A’s absence never engages the process. Difference-making conflates necessary condition with cause—Nurse A’s absence is a background condition, not an intervention. Intuition rejects symmetric causation here.  

  ### Fragility  
  The case breaks if "distracted" implies *capacity* to act. If the other staff could’ve noticed (making Nurse B’s omission less necessary), normative expectations sneak in. Rigorously stipulate their identical unresponsiveness.  

