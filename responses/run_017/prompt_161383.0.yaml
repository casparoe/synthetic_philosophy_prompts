  ### 1. The completed totality of natural numbers

  **Your mapping:** You propose to represent the natural numbers as a lazy stream: `nats = 0 : map (+1) nats`. This is a productive stream: for any finite `n`, you can get the `n`-th element. However, you note that this is an unfolding, not a "completed" thing.

  **The issue:** The finitist denies that the entire set of natural numbers exists as a "completed" or "actual" infinity. In your representation, the stream is a process that can produce any natural number on demand, but it never holds all natural numbers at once. The Cantorian position is that the set of natural numbers is a fixed, complete, infinite set that exists independently of our ability to enumerate it.

  **Translation and residue:**
  - **What maps cleanly?** The idea that we can have a process that generates arbitrarily large natural numbers. In a system with unbounded resources (memory, time), we can simulate an unbounded stream. This corresponds to the potential infinity: the process of always being able to add one.
  - **What requires distortion?** The notion of a "completed" infinity. In your computational model, you cannot have a data structure that contains every natural number at once because that would require infinite memory. The closest you have is a finite representation (like the stream definition) that can be used to generate any natural number. But the stream itself is finite (it's a cyclic structure in memory) and only produces numbers when forced. So the entire set is never simultaneously present.
  - **What cannot be said?** The idea of a static, completed, infinite set. In your model, you can reason about the entire stream by coinduction (for properties that hold for all finite prefixes), but you cannot actually inspect the entire infinite set. The finitist would say that the set of natural numbers does not exist as a single, completed object. The Cantorian claims it does. This distinction is not expressible in your vocabulary because you don't have a way to represent a completed infinite set without a process (which the finitist accepts as a potential infinity).

  **Honest version:** The honest version without smuggling is to say that the natural numbers are represented by a process that can generate any finite prefix. The "completed" set is not a computational object in the usual sense; it's a mathematical abstraction that cannot be realized in a finite machine.

  ### 2. Cantor's diagonal argument

  **Your program:**
  ```haskell
  enum :: Nat -> (Nat -> Bool)
  diagonal :: Nat -> Bool
  diagonal n = not (enum n n)
  ```

  You note that if `enum` is a total function (i.e., `enum n` is a total function for every `n`), then `diagonal` is total. But if `enum` returns partial functions, then `diagonal` might diverge when `enum n n` diverges.

  **The issue:** The diagonal argument requires that we consider the set of all total functions `Nat -> Bool`. The finitist might deny that such a set exists (as a completed totality) or that we can quantify over it. Moreover, the argument requires that we can form the diagonal function, which is a total function if the enumeration is of total functions, but the set of total functions is not computably enumerable.

  **Translation and residue:**
  - **What maps cleanly?** The program itself is a valid piece of code. If we are given an enumeration `enum` of total functions (i.e., for every `n` and `m`, `enum n m` terminates and returns a boolean), then `diagonal` is a total function and differs from every function in the enumeration at least at the diagonal point. This is a constructive proof that there is no computable enumeration of all total functions. This is a standard result in computability theory: the set of total functions is not recursively enumerable.
  - **What requires distortion?** The finitist might object to the assumption that we can even talk about the entire set of total functions. In your computational model, you can define the type `Nat -> Bool` (which includes both total and partial functions) and you can write the diagonal function. However, the set of total functions is a subset that you cannot effectively enumerate. The finitist might say that the set of total functions is not a completed totality. So the argument shows that if you try to enumerate the total functions, you get a contradiction, but the finitist might avoid the contradiction by denying that the set of total functions exists as a completed set. Instead, they might only accept finite sets or potentially infinite sets of functions.
  - **What cannot be said?** The idea of a completed set of all total functions. In your model, you can define the diagonal function, but you cannot actually form the set of all total functions as a single object (because it's not computable and not even finite). The finitist's denial might be that the diagonal argument is a proof by contradiction that the set of all total functions cannot be enumerated, but they might not accept that the set exists in the first place. The Cantorian, however, uses the argument to show that the set of total functions is uncountable, which requires the set to be a completed totality.

  **Separate point on partial functions:** The fact that the set of partial functions is computably enumerable (via, e.g., an enumeration of Turing machines) is a separate issue. The diagonal function for an enumeration of partial functions is not necessarily total and might diverge. This does not lead to a contradiction because the diagonal function might not be in the enumeration (it might not be a partial recursive function? Actually, it is, but it might not be in the given enumeration because the enumeration might be of a different set). The finitist's complaint is not primarily about divergence (though that is a computational issue) but about the existence of the entire set of total functions.

  ### 3. Hilbert's Hotel

  **The scenario:** A hotel with infinitely many rooms (numbered 1,2,3,...), all occupied, can accommodate a new guest by moving each current guest from room `n` to room `n+1`. This is an injection from the current set of guests to a proper subset (leaving room 1 free).

