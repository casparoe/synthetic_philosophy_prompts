prompt: |-
  I'm a science-and-ideas reporter working on a piece about what should happen when a community's memory collides with the archival record, and I've realised my gut verdicts don't line up with each other. Tell me what principle I'm secretly using, or should be.

  My verdicts. (1) A Midwestern town's plaque says the land was bought outright from the Ojibwe in 1854; the treaty and deed records show no sale, just removal. Plaque comes down, no hesitation. (2) A family in Lyon remembers great-uncle as having hidden a Jewish family for nothing; notarial records show he was paid, and paid well. I don't think the memory gives way — I think it's a true memory that got retold as a story about virtue. (3) An Aboriginal Australian community's oral tradition puts a massacre at a particular waterhole; the colonial record for that district is silent for that whole decade — silent about the massacre, but also silent about the community existing at all. Memory stands. (4) A village remembers a famous novelist visiting on 12 June 1878; his published letters and hotel registers put him in another country that June, and nothing local was written down at the time. Confabulation — drop it gently. (5) A village remembers a wartime massacre of 300 of its own people; exhumations turn up 12. The number gives way, but I resist saying the memory was wrong in the way the plaque was wrong. (6) After a dictatorship falls, the secret police's own files name the village's beloved schoolteacher as an informant; everyone who knew him says impossible. My gut: the file doesn't get to decide. But I won't say he was innocent either.

  Two things bug me. Cases 3 and 4 look structurally the same — the record says nothing — and I come out opposite ways. And in both 1 and 6 the document was produced by power, yet I side with it in one and against it in the other.

  The rule I keep half-forming: trust the record when it speaks against the interests of whoever made it, and trust the memory when the silence of the archive is exactly what the powerful needed. But that gets case 6 wrong, and I don't trust it on case 4 either. I've also been toying with two distinctions that may be doing no work: memory held in practice — a procession, a place-name, a gravesite — versus memory held only in propositions; and what I've started calling counter-archival memory, where the content of the memory isn't a rival factual claim but a refusal of the record's jurisdiction at all.

  So: give me one principle, or two candidates, stated precisely enough to grind out verdicts, with the case that motivates each clause. Then tell me which of my six verdicts it can't accommodate and wants me to drop. And two cases I haven't listed, that I genuinely go back and forth on: a community's memory that has hardened into a monument and a museum exhibit, with nobody alive who remembers the event firsthand — is that still memory with a claim on us, or just a false assertion with better architecture? And a memory that exists only because somebody in 1970 read the archive wrong — a memory manufactured by a record.
reasoning: |-
  Okay, the user is a science-and-ideas reporter struggling with inconsistent gut reactions when community memory clashes with archival records. They've listed six specific cases where their instinctive verdicts diverge, and two additional scenarios they're undecided about. 

  Hmm, what's really going on here? At first glance it seems like a simple conflict between oral history and written documents, but the user's own analysis reveals deeper layers. They've already identified some sophisticated concepts like "counter-archival memory" and the distinction between performative vs propositional memory. Smart observer.

  The core tension appears to be about epistemic justice - whose knowledge counts as valid. But it's messier than that. Look how case 1 (Ojibwe land plaque) and case 6 (schoolteacher informant) both involve documents created by power structures, yet the user sides with archives in one and against in the other. Fascinating! That suggests the principle isn't just about power dynamics alone.

  Ah, and here's the real puzzle: cases 3 and 4 both feature archival silence, but get opposite treatment. The massacre memory stands despite absence of records, while the novelist visit gets dismissed. Why? Probably because in case 3, the silence itself serves colonial erasure, while in case 4, the absence doesn't inherently serve anyone's interests. The user's brain is applying a hidden test about systemic function of absence.

  What the reporter might not be articulating is how much weight they're giving to the purpose of the memory. The great-uncle's story (case 2) serves moral instruction even if details changed, while the land plaque (case 1) serves ongoing dispossession. The massacre number (case 5) matters less than the fact of atrocity. This isn't about truth vs falsehood so much as what the memory does for the community.

  For the undecided cases... The monument without living memory feels like it transitions from lived experience to historical interpretation - still valuable but different. And the archive-born false memory? That's tricky because even if factually wrong, it may have become authentically meaningful. But is that enough?

  The user seems to want a decision rule that respects both historical rigor and community agency. No easy task. Their discomfort suggests they recognize archives aren't neutral, but also that memory isn't infallible. The sweet spot might be asking: does correcting this actually repair harm, or just satisfy pedantry?
answer: |-
  Your struggle reveals a tension between **epistemic justice** and **historical forensics**. The principle guiding your verdicts isn't unitary—it's a dual framework I'll call **"The Testimony Principle"** and **"The Function of Silence Principle."** Together, they resolve your inconsistencies.

  ### Principle 1: The Testimony Principle  
  *"Trust memory when it functions as testimony against systemic erasure or oppression; distrust it when it serves dominant narratives uncritically."*  
  - **Motivation**: Cases 3 (massacre waterhole) and 2 (great-uncle's payment). Here, memory counters archival silence or distortion created by power (colonial erasure, Holocaust survival ethics). The Ojibwe plaque (1) serves the dominant narrative, so it falls.  
  - **Case 6 (schoolteacher)**: The secret police file isn't testimony—it's an unverified instrument of power. Memory’s refusal ("impossible") *is* testimony against the oppressor’s framework.  

  ### Principle 2: The Function of Silence Principle  
  *"Interpret archival silence based on who benefits: trust memory when silence serves power; distrust memory when silence is incidental."*  
  - **Motivation**: Case 3 (massacre): Colonial silence erases violence → memory stands. Case 4 (novelist): Silence doesn’t serve power; it’s mere absence → memory yields. Case 5 (massacre numbers): The *fact* of atrocity is testimony; the number is incidental detail.  

  ### Your Verdicts Through This Lens  
  | Case | Principle Applied | Verdict Alignment |  
  |------|-------------------|-------------------|  
  | 1    | Testimony: Serves domination → distrust | Aligns (plaque down) |  
  | 2    | Testimony: Preserves moral resistance → trust | Aligns (memory stands) |  
  | 3    | Silence: Erasure → trust memory | Aligns |  
  | 4    | Silence: Incidental → distrust memory | Aligns (confabulation) |  
  | 5    | Testimony: Atrocity fact > numerical error → partial trust | Aligns (number yields, core stands) |  
  | 6    | Testimony: Rejects oppressor’s "evidence" → distrust document | Aligns (file doesn’t decide) |  

  ### The Conflict Resolved  
  - **Cases 3 vs. 4**: Structural similarity (silence), but *function* differs. Colonial silence (3) actively erases; novelist’s absence (4) is bureaucratic gap.  
  - **Cases 1 vs. 6**: Both documents from power, but Ojibwe plaque (1) *perpetuates* oppression (distrust), while the schoolteacher file (6) is *contested* by community testimony (distrust document).  

  ### Verdict to Reconsider: Case 2 (Great-Uncle’s Payment)  
  - **Tension**: Your principle trusts memory’s "moral truth," but the archival record (payment) directly refutes a key claim.  
  - **Why it strains**: Testimony Principle prioritizes resistance, but here memory *aligns* with virtue narratives of the powerful (heroic rescuer trope).  
  - **Adjusted Verdict**: Memory should *integrate* the archive—e.g., "He took payment but risked his life; the story evolved to emphasize solidarity."  

  ### Undecided Cases Analyzed  
  1. **Monument/Museum Without Living Memory**:  
     - This is **curated history**, not living testimony. It has cultural weight but no "testimonial authority." Principle: *Correct it if it perpetuates harm* (like the Ojibwe plaque), but preserve it as artifact if it reflects community identity (e.g., the novelist myth if it inspires local pride).  

  2. **Memory Manufactured by Misread Archive**:  
     - This is **pseudomemory**. It lacks testimonial roots and exists *because* of the record. Principle: *Reject it* unless it developed independent meaning (e.g., if the misreading sparked a real social movement). Example: A town "remembers" a 1800s labor strike based on misread newspapers—this should yield to archives.  

  ### Core Insight  
  Your gut prioritizes **whose truth is at stake**. When memory is a tool of the marginalized to resist erasure (cases 2,3,5,6), you defend it against archives. When it upholds power or trivializes harm (cases 1,4), you side with evidence. This isn’t relativism—it’s recognizing that archives and memory are *political artifacts*, not neutral vessels.  

  **Final Rule**:  
  > *"In collisions between memory and archive, favor testimony that challenges oppression; treat archival silence or documents as corrupt when they serve power. Elsewhere, default to forensic evidence."*
