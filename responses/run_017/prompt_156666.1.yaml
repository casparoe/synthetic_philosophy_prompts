  - **Gate 7**: Pre-discussion vote, then discussion, then post-discussion vote. We act if at least one post-discussion vote is 'yes'.

  This result (only one vote required) might be what the chair doesn't want to hear because it means that almost any concern, even from one member, triggers action. But note: the cost asymmetry is high (R=10) so we are willing to act even on weak evidence.

  **Limitations and What Would Change Our Mind**

  - **Gate 4 (Independence)**: This is the most subjective gate. The chair's estimate of k is a guess. If we found that the chair consistently overestimates k (by comparing with post-hoc analysis of vote correlations), we would need to adjust the procedure. We might replace it with a rule: if the group has a history of voting unanimously (or nearly) on similar questions, then set k=1 or 2. But without data, it remains a judgment.

