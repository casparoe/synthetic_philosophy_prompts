  **Example 2: Disclosure regulation capturing agricultural book**

  - **Gate 1**: Ground truth? Yes (eventually we will know) -> Gate 2.
  - **Gate 2**: Compound? No -> Gate 3.
  - **Gate 3**: Track record: for this type? Probably not, so p=0.5 -> Gate 4.
