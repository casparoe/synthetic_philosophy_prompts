answer: |-
  Below is a written decision procedure designed for your emerging-risk committee, structured as a sequence of gates. It addresses your constraints (simple arithmetic only, fixed in advance) and complications (ground truth uncertainty, compound questions, competence, dependence, deliberation, expert deference, asymmetric costs, misaligned incentives, and small group size). The procedure is self-contained, with formal results explained in plain language. It includes application to your three examples and concludes with limitations.

  ---

  ### **Decision Procedure for Material Exposure Votes**
  **Purpose**: To determine whether an emerging risk constitutes a material exposure, balancing accuracy, deliberation, and regulatory compliance.  
  **Runtime**: ≤10 minutes at the start of each agenda item, before discussion.  
  **Participants**: Chair (you) and nine voting members.  
  **Output**: Binary decision (yes/no) or delegation to a named expert.

  ---

  #### **Gate Sequence**  
  *Run gates in order. Stop if a gate resolves the decision. Otherwise, proceed.*

  **Gate 1: Is there a ground truth?**  
  - **Question**: "Will we unambiguously resolve whether this exposure was material within 5 years (e.g., claims data, regulatory clarity)?"  
  - **Sufficient answer**:  
    - **Yes** (truth exists): Proceed to Gate 2.  
    - **No** (no resolvable truth, e.g., hypothetical risks): Skip to Gate 5.  
  - **Why?** When no ground truth exists, group accuracy cannot be measured. This is about risk appetite, not facts.  

  **Gate 2: Is the question compound?**  
  - **Question**: "Can this question be split into two or more independent sub-questions that all must be true for the overall exposure to be material (e.g., 'Will Regulation X apply AND cause >5% loss?')?"  
  - **Sufficient answer**:  
    - **No** (single question): Proceed to Gate 3.  
    - **Yes** (compound): Split into sub-questions. Run this procedure separately on each. Combine results logically:  
      - For **AND** (all sub-questions must be true): Treat as material only if all sub-votes are "yes".  
      - For **OR** (any sub-question makes it material): Treat as material if any sub-vote is "yes".  
    - **Stop here** and act on the combined result.  
  - **Why?** Majority votes on compound questions are unreliable. Splitting avoids "double-counting" errors.  
  - **Formal basis**: Probability of a group being correct on a conjunction (A AND B) is lower than on individual parts if errors are independent. Acting on the parts reduces false negatives for critical risks.  

  **Gate 3: Can we estimate member competence?**  
  - **Question**: "For this decision type, do ≥3 members have track records (past resolved votes) to calculate average individual accuracy?"  
  - **Sufficient answer**:  
    - **Yes**: Compute average accuracy (p) for members with data. Use this as the group’s estimated competence. Proceed to Gate 4.  
      - *Example*: If 6 members have 60% accuracy, p = 0.6.  
    - **No** (no track records): Assume p = 0.5 (coin flip). Proceed to Gate 4.  
  - **Why?** Without competence data, we default to no advantage over chance.  

  **Gate 4: Are judgments independent?**  
  - **Question**: "How many independent information sources exist (ignoring shared briefings, dominant speakers, or overlapping expertise)?"  
  - **Sufficient answer**:  
    - Chair estimates number of independent channels (k). Use:  
      - k = 1 if all rely on one source (e.g., data scientist’s model).  
      - k = 2–3 if 2–3 unique sources exist (e.g., legal + underwriting + claims).  
      - k ≤ 9 if all are independent (rare).  
    - If k ≤ 3: Proceed to Gate 5.  
    - If k > 3: Proceed to Gate 6.  
  - **Why?** Dependence inflates group error. Small k reduces the "effective group size."  
  - **Formal basis**: With dependence, group accuracy approaches that of a smaller independent group. At k ≤ 3, expert deference often beats voting.  

  **Gate 5: Should we defer to one expert?**  
  - **Question**: "Is one member’s competence (p_exp) meaningfully higher than the group’s (p), and are others near chance (p ≤ 0.55)?"  
  - **Sufficient answer**:  
    - **Yes**: Delegate the decision to the named expert (e.g., "General Counsel for legal questions"). **Stop here**.  
    - **No**: Proceed to Gate 6.  
  - **Why?** Voting dilutes expertise if one person is significantly better.  
  - **Formal basis**: When p_exp > p and others are weak (p ≈ 0.5), delegation maximizes accuracy. For your group size (n=9), defer if p_exp > 0.65 and p ≤ 0.55.  

  **Gate 6: How severe are errors?**  
  - **Question**: "What is the cost ratio (R) of a false negative (missing real exposure) to a false positive (unnecessary reserves)?"  
  - **Sufficient answer**:  
    - Chair states approximate R (e.g., R=10 if missing exposure costs 10× more).  
    - Compute vote threshold: V_min = ceil(9 / (1 + R)).  
      - *Example*: If R=1 (equal costs), V_min = ceil(9 / 2) = 5.  
      - If R=10, V_min = ceil(9 / 11) ≈ 1.  
    - Proceed to Gate 7.  
  - **Why?** Asymmetric costs require lower thresholds to avoid costly misses.  
  - **Formal basis**: Optimal decision thresholds minimize expected loss. R adjusts the majority rule.  

  **Gate 7: Pre-discussion vote and deliberation**  
  - **Question**: "What are the votes before and after discussion?"  
  - **Procedure**:  
    1. **Silent pre-discussion vote**: Members vote yes/no in writing. Record counts.  
    2. **Discussion**: Hold mandated debate (minuted).  
    3. **Post-discussion vote**: Show of hands.  
    4. **Decision**:  
       - If post-discussion "yes" votes ≥ V_min (from Gate 6): **Treat as material**.  
       - Else: **Do not treat as material**.  
  - **Why?** Pre-discussion captures independence; post-discussion respects deliberation and regulation.  

  ---

  ### **Application to Your Examples**  
  **Example 1: Water-damage claims spike (signal vs. artefact)**  
  - **Gate 1**: Yes (resolves in 6 months).  
  - **Gate 2**: No (not compound).  
  - **Gate 3**: p = 0.6 (from 6 members’ track records).  
  - **Gate 4**: k ≈ 3 (no specialist advantage; shared briefing but diverse roles). Proceed to Gate 5.  
  - **Gate 5**: No single expert.  
  - **Gate 6**: R ≈ 1 (symmetric costs). V_min = ceil(9 / 2) = 5.  
  - **Gate 7**: Pre-discussion vote recorded. Post-discussion vote: if ≥5 "yes," treat as signal.  
  - **Outcome**: Requires majority (5/9) to act.  

  **Example 2: Disclosure regulation capturing agricultural book**  
  - **Gate 1**: Yes (truth revealed when regulation finalizes).  
  - **Gate 2**: No.  
  - **Gate 3**: No track records → p = 0.5.  
  - **Gate 4**: k = 1 (only General Counsel has real knowledge; others guess). Proceed to Gate 5.  
  - **Gate 5**: Delegate to General Counsel.  
  - **Outcome**: General Counsel decides alone.  

  **Example 3: Novel respiratory outbreak (pandemic exposure)**  
  - **Gate 1**: No (may never resolve; risk-appetite question). Skip to Gate 5.  
  - **Gate 5**: No epidemiologist on committee → no deferral.  
  - **Gate 6**: R ≈ 10 (false negative cost >> false positive). V_min = ceil(9 / 11) ≈ 1.  
  - **Gate 7**: Post-discussion vote: if ≥1 "yes," treat as material.  
  - **Outcome**: One "yes" triggers action. (This matches your suspicion: high cost asymmetry forces low threshold.)  

  ---

  ### **Limitations and Revision Triggers**  
  **What the procedure cannot do**:  
  1. **Independence estimation (Gate 4)**: This remains a qualitative guess. Without data on member correlations, it may over/underestimate k.  
  2. **Competence gaps**: If p < 0.5 (members worse than chance), voting amplifies errors. The procedure flags this (Gate 3) but doesn’t reverse majorities.  
  3. **Small-group effects**: At n=9 and p≈0.6, majority votes are only ~75% accurate (per Condorcet). The procedure states this numerically but can’t fix it.  
  4. **Strategic voting**: It assumes votes reflect true beliefs. If business-unit reps vote selfishly (not on risk), delegation (Gate 5) is the only mitigation.  

  **What would change my mind (revision triggers)**:  
  - **Empirical finding**: If post-hoc analysis shows pre-discussion votes consistently outperform post-discussion votes (e.g., due to herding), I’d replace Gate 7 with a silent-vote-only rule.  
  - **Independence data**: If member vote correlations are measured and show k is consistently ≤2, I’d rewrite Gate 5 to mandate delegation for k≤2.  
  - **Competence collapse**: If average p < 0.5 for >50% of decision types, I’d scrap voting and switch to expert-only decisions.  

  **Where my reasoning is weakest**:  
  - **Gate 4 (independence)**: Estimating k is a structured guess, not data-driven. It relies on chair intuition and may be gamed.  
  - **Gate 6 (cost asymmetry)**: The formula V_min = ceil(9 / (1 + R)) assumes linear costs. If costs are nonlinear, thresholds may misfire.  
  - **Formal flaw**: Condorcet’s accuracy gains require n→∞ and p>0.5. At n=9, p=0.6, group accuracy is modest (~75%). The procedure transparently uses this but cannot overcome small-n limitations.  

  **Procedure signed off**: Chair and Chief Risk Officer. Review annually or after 100 votes.  

  ---  
  This procedure prioritizes safety (leaning toward action for high-cost misses), uses your constraints, and forces explicit tradeoffs. It will surface uncomfortable truths—especially for low-threshold, high-uncertainty risks like pandemics—but that is its intent.
