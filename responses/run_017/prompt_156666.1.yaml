prompt: |-
  I chair the emerging-risk committee of a mid-sized mutual insurer. We meet for two hours every fortnight and vote yes or no on questions of the form should we treat this as a material exposure: a cluster of claims in one region, a new regulation that may or may not reach our book, a technology that may or may not create a liability, a rumoured supply-chain chokepoint. Nine people vote. They are a mixed group — two actuaries, a lawyer, an underwriter, a claims manager, a data scientist, and three rotating business-unit representatives — and for any given question at most one or two of them have real domain knowledge. Our current default is a show of hands at the end of the discussion, decided by simple majority, and I have come to suspect that this default is wrong for several of the decision types we face, though I cannot say which or why.

  What I want is a written procedure that can go into our terms of reference and be run in about ten minutes at the start of the item, before anyone speaks. It should be a sequence of gates, in order, each of which says what question is being asked, what counts as a sufficient answer, where the procedure stops with a fixed rule, and where it hands the decision on to a named person because the remaining question is one of values or of unmeasurable fact rather than something an aggregation rule can settle. Two constraints on form. First, no member of the committee can do anything beyond simple arithmetic, so if a number matters, give it approximately and say plainly that it is approximate; the procedure has to survive being applied by someone who has never opened a statistics textbook. Second, any rule we adopt has to be fixed in advance and signed off by our chief risk officer, because I am not permitted to choose an aggregation rule after seeing who is in the room or how the discussion went. Also: state in your own words any formal result you rely on rather than appealing to authorities or naming results you will not spell out, and mark clearly which parts of the procedure follow from the result and which are your own stipulations about our situation.

  The complications I need the gates to handle, because I do not think I can think about them reliably on the fly:

  Whether the question in front of us has a truth that will eventually be revealed at all. Some of our votes are really questions about our risk appetite dressed up as forecasts, and it seems to me that an argument for majority rule from the reliability of groups buys nothing when there is no fact of the matter to be reliable about.

  Whether the question is secretly compound. Will this new regulation apply to us and bite within five years is two claims, not one, and it looks to me as though taking a majority on a conjunction can be worse than taking a majority on either conjunct even when everyone's errors are independent. If the package vote can come out the opposite way from the votes on its parts, tell me which one we should act on.

  Whether our members are actually better than chance on this kind of question, and what to do when we cannot say. We keep a running record of how each member has done on decisions that have since resolved, but only for six of the nine people and only for the two decision types we have been scoring; for most item types there is no track record at all.

  Whether our errors are independent. Everyone reads the same briefing note I circulate; the data scientist's model output is the main input for two other members' views; the lawyer writes the paper that the claims manager reads; most of us read the same two news sources; the most senior person tends to speak first and the room tends to follow. I want a gate that asks how many genuinely separate information channels are in the room rather than how many heads there are, and I want it to say what to do when the honest answer is two or three.

  Deliberation. Our regulator requires that the committee's discussion be minuted, so I cannot replace discussion with a silent vote, but I can add a silent poll before it. The awkward part, as I see it, is that discussion probably makes people more accurate and at the same time makes their errors line up, and I do not know how to weigh a pre-discussion poll against a post-discussion show of hands.

  Whether one member is enough better than the rest that voting dilutes rather than improves the answer, and how big a gap has to be before deferring to that person beats any vote.

  Asymmetric costs. Missing a real exposure is much worse for us than reserving for one that never materialises, and the ratio differs by decision type. Simple majority presumably stops being the right threshold once the two errors cost different amounts, and I would like the procedure to say how the ratio moves the threshold rather than just noting that it does.

  Whether members' votes track what they think is true or what they want. Three of our nine represent business units whose results depend on our continuing to write a given line, and I do not trust that their votes are purely judgments.

  Small numbers. We have nine people, and where we can measure competence at all it is somewhere around a coin flip plus a little. The result everyone invokes is about groups growing without limit, and I strongly suspect that at our size with our competence levels the guarantee is nearly vacuous; if that is right, I want the procedure to say so in numbers rather than as a caveat.

  Then apply the finished procedure to three of our recurring items. The first: a spike in water-damage claims in one coastal region over two quarters, where the vote is signal or reporting artefact, resolution arrives within about six months, six members have scored track records, nobody has a specialist advantage, and the two error types cost roughly the same. The second: whether an incoming disclosure regulation will capture our agricultural book, where our general counsel is the only person with any real purchase on the question and the rest of us would be guessing. The third: a report of a novel respiratory outbreak in a single city abroad, and the question whether we should now treat pandemic-style business interruption as a material exposure and flag it to the board — a compound question, no competence estimate that applies, everyone briefed from the same three sources, an error-cost ratio I would put in the tens, and a truth that may not be settled for years or at all. I expect the procedure to tell me something I do not want to hear on that third one, and I would rather it did.

  Finally, close with a short section on what the procedure cannot do and what would change your mind about it: which gate you expect to be answered confidently and wrongly in practice, which empirical finding about our panel would lead you to rewrite the procedure rather than patch it, and where your own reasoning is most likely to have gone wrong — in particular, whether the step where you judge independence is anything more than a guess with a procedure attached to it.
reasoning: |-
  We are designing a decision procedure for a committee of nine members voting on whether to treat various emerging risks as material exposures. The procedure must handle several complications: existence of a ground truth, compound questions, varying member competence, dependence among members, deliberation effects, potential superiority of one member, asymmetric error costs, possible misalignment of votes and true beliefs, and small group size with low competence.

  The procedure will consist of a sequence of gates (questions) that the chair runs at the start of each agenda item, before any discussion. Each gate either stops the procedure with a fixed rule or hands the decision to a named person. The procedure must use only simple arithmetic and be fixed in advance.

  We rely on the following formal results, which we state in plain language:

  1. **Condorcet Jury Theorem (CJT)**: If each member of a group has independent judgments and competence greater than 0.5 (i.e., each is more likely to be correct than incorrect), then as the group size increases, the probability that the majority vote is correct approaches 1. For small groups, we can compute the exact probability. However, if competence is below 0.5, the majority is more likely to be wrong. If competence is exactly 0.5, the group is no better than a coin flip.

  2. **Dependence and Effective Group Size**: When judgments are not independent, the effective group size is reduced. A common approach is to estimate the number of independent opinions, and then apply CJT with that effective size.

  3. **Compound Questions**: For a conjunction (A and B), the probability of the group being correct on the conjunction is not simply the product of the probabilities of being correct on each part. In fact, taking a separate vote on each part and then combining the results (using the conjunction rule) might be better than taking a single vote on the compound question if the group is more competent on the parts.

  4. **Asymmetric Costs**: When the cost of a false negative (missing a real exposure) is much higher than a false positive (falsely reserving), the optimal threshold for decision shifts. Specifically, we should require less evidence to declare an exposure if the cost of missing it is high.

  5. **Deferral to an Expert**: If one member is significantly more competent than the others, and especially if the others are near chance (0.5) or worse, then deferring to that expert may yield higher accuracy than a group vote.

  We now design the gate procedure. The gates are:

  **Gate 1: Is there a ground truth?**
     - **Question**: Will we eventually know whether this exposure was material? (That is, will the fact of the matter be revealed within a reasonable time frame, such as a few years?)
     - **Sufficient Answer**: 
       - If **yes** (truth will be revealed), proceed to Gate 2.
       - If **no** (truth will not be revealed, so the question is about risk appetite), skip to Gate 5.
     - **Reason**: When there is no ground truth, we cannot use group accuracy as a guide. Instead, we treat the question as one of values (risk appetite) and delegate.

  **Gate 2: Is the question compound?**
     - **Question**: Can the question be broken down into two or more independent sub-questions that are necessary and sufficient for the overall decision? (For example, "Will regulation X apply to us AND cause a material impact within five years?")
     - **Sufficient Answer**:
       - If **no**, proceed to Gate 3.
       - If **yes**, then we break the question into its sub-questions. For each sub-question, we run the entire procedure (starting at Gate 1) separately. Then, we combine the results using the logical rule (e.g., for a conjunction, we require all sub-questions to be answered "yes" for the overall exposure to be material). We then stop for this item and act on the combined result.
     - **Reason**: Taking a single vote on a compound question can be less accurate than breaking it down and then combining.

  **Gate 3: What is the estimated competence of the group?**
     - **Question**: For this type of decision, do we have a track record of past decisions that have resolved (so we know the correct answer) for at least some members? And if so, what is the average individual accuracy (p) for the members for whom we have data?
     - **Sufficient Answer**:
       - If we have track records for at least one member and can compute an average p for the group (using the available data), then we use that p. If we have track records for some but not all, we use the average of the available ones as an estimate for the whole group. If we have no track records, we set p = 0.5 (we assume chance performance).
       - We note that p is approximate and may be biased (e.g., if only the better members have track records). We then proceed to Gate 4.
     - **Reason**: We need an estimate of individual competence to adjust the decision rule.

  **Gate 4: How many independent information channels are there?**
     - **Question**: Considering the preparation and discussion, how many independent sources of judgment are present? (Consider: do multiple members rely on the same briefing? Do they have different expertise? Do they tend to follow the same leader?)
     - **Sufficient Answer**: 
       - The chair estimates the number of independent channels (k). This is subjective, but we provide guidance: 
         - If the group is highly dependent (e.g., all read the same brief and follow the first speaker), k=1 or 2.
         - If there are multiple independent sources of information (e.g., the lawyer has legal training, the actuary has statistical models, the underwriter has market knowledge), k might be 3 or 4.
         - Maximum k is 9 (if all are independent).
       - We then compute the effective group size (n_eff) as k. We do not use the full group size because dependence reduces the effective number of independent opinions.
       - Proceed to Gate 6.

  **Gate 5: Delegate to a named person?**
     - **Question**: Is there one member who is known to be significantly more competent on this specific question than the others? And are the others near chance (p=0.5) or worse?
     - **Sufficient Answer**:
       - If **yes**, then delegate the decision to that named person (e.g., the general counsel for a legal question). The procedure stops and we act on their judgment.
       - If **no**, proceed to Gate 6.
     - **Reason**: When one expert is much better than the rest, a group vote might dilute the expertise.

  **Gate 6: Asymmetric error costs**
     - **Question**: What is the ratio of the cost of a false negative (missing a real exposure) to the cost of a false positive (incorrectly reserving for an exposure that never materializes)? The chair provides an approximate ratio (R) for this decision type.
     - **Sufficient Answer**:
       - The chair states R (e.g., 10:1 meaning missing an exposure is 10 times worse than a false alarm). Then we compute the required threshold for the vote. The optimal threshold (T) for the proportion of votes needed to declare an exposure is given by:
           T = 1 / (1 + R)
         For example, if R=1 (symmetric), T=0.5 -> majority rule. If R=10 (false negative 10 times worse), T=1/(1+10)≈0.09 -> even one vote in favor might be enough. But note: we have a discrete group. We must choose a threshold in terms of the number of votes.
       - We then set the vote threshold (V) as the smallest integer such that the proportion of votes in favor is at least T. Since we have n_eff (from Gate 4) as the effective group size, we use n_eff to compute the threshold. However, note that we are using the actual votes of the 9 members. The n_eff was for competence calculation, but for voting we have 9 votes. We must adjust the voting threshold based on R and n_eff? Actually, no. The error costs are about the decision, not about the competence. We set the threshold for the vote of the 9 members based on R, regardless of n_eff. But note: the vote threshold must be set such that we are willing to act even with very few votes if the cost of missing is high. However, we must also account for the fact that the group might be very small (in effective size) and not competent. We have already accounted for competence in the track record and dependence. So we set the vote threshold on the actual 9 votes by:
           V_min = ceil( T * 9 )
         But note: T is the minimum proportion to act. However, because we have a small group, we might not get a fraction. We round up to the next integer. For example, if T=0.09, then V_min = ceil(0.09*9)=ceil(0.81)=1. So we would act if at least 1 vote in favor.
       - However, this might be too extreme. We must also consider the competence. The threshold T is derived from a Bayesian decision rule: we should act if the posterior odds of the exposure being real are greater than the cost ratio. But the vote count is a proxy for the posterior. We assume that the vote proportion is an estimate of the probability that the exposure is real. But if the group's average competence is low, then even a majority might not be very indicative. We have not incorporated the competence into the threshold. This is a limitation.

       Let's reconsider: the asymmetric cost rule is independent of competence. It says: if the cost of false negative is R times the cost of false positive, then we should act if we believe the probability that the exposure is real is greater than 1/(1+R). But the vote proportion is not necessarily the probability. We can use the track record (p) and the vote count to estimate the probability.

       However, the procedure must be simple. We cannot do complex Bayesian updates. Therefore, we do:

          If we have an estimate of p (from Gate 3) and p>0.5 and we have an effective group size n_eff (from Gate 4), then we can use the Condorcet formula to compute the probability that the exposure is real given the vote count. But that requires binomial calculations, which are too complex.

       Alternative: we stick with the cost-based threshold on the vote proportion, ignoring competence for this step. Why? Because the competence is already factored into the effective group size? Actually, no. We have two separate issues: the group's accuracy and the cost of errors. We are going to use the vote of the 9 members. We set the threshold for the vote based solely on the cost ratio. But note: if the group is incompetent, then even if we set a low threshold, we might be acting on noise. But the track record and independence gates have already given us a sense of the group's reliability. We are not using that to adjust the threshold, only to decide whether to delegate or to use a group vote at all.

       We decide: we set the vote threshold for the 9 members based only on the cost ratio. We let:

           T = 1 / (1+R)

           Then the number of votes required to act is: V_min = ceil( T * 9 )

       But note: if T is very small (because R is large), then V_min might be 1. That is acceptable because we are saying we cannot afford to miss real exposures.

       However, we must also consider the possibility that the group might be systematically biased. But that is beyond the scope of this gate.

     - Proceed to Gate 7.

  **Gate 7: Pre-discussion silent vote**
     - **Question**: We will take a silent vote now (before any discussion) and record the votes. Then we will have the discussion as required by the regulator. After the discussion, we will take a show of hands (post-discussion vote). How do we combine these?
     - **Sufficient Answer**:
       - We have two votes: pre-discussion and post-discussion. We know that discussion may improve individual accuracy (if new information is shared) but also increase dependence. We do not have a fixed rule for combining, but we note that the pre-discussion vote is more independent and the post-discussion vote is more informed. We propose:
          - If the pre-discussion vote meets the threshold (from Gate 6), then we act as if the exposure is real. Why? Because it met the threshold without the influence of discussion (so more independent). But note: the threshold might be very low (even 1 vote). Then we act without even having the discussion? That might violate the regulator's requirement for discussion. Therefore, we must have the discussion regardless. But we can use the pre-discussion vote to make the decision if it meets the threshold. However, the regulator requires the discussion to be minuted and considered. So we might be forced to use the post-discussion vote.

       We must comply with the regulator. Therefore, we use the post-discussion vote as the official vote. But we can use the pre-discussion vote as a tiebreaker or for additional information? Alternatively, we can design the procedure so that the pre-discussion vote is used only if the post-discussion vote is inconclusive? But that might not be efficient.

       Revised plan: we take the pre-discussion vote and record it. Then we have the discussion. Then we take the post-discussion vote. Then we compare:

          - If the post-discussion vote meets the threshold (from Gate 6), then we act as if the exposure is real.
          - If it does not, then we check the pre-discussion vote: if the pre-discussion vote met the threshold, then we note that there was prior evidence but the discussion changed minds, and we do not act. But we record the pre-discussion vote for future reference.

       However, this might be confusing. We want a single decision. The regulator requires the discussion, so we must use the post-discussion vote as the official one. Therefore, we ignore the pre-discussion vote for the decision? That seems wasteful.

       Alternative: we use the pre-discussion vote to estimate the independent judgment and the post-discussion vote to estimate the informed judgment. We then combine by: if either vote meets the threshold, we act? But that would lower the bar even further. Or we require both? That would raise the bar.

       We decide: because the regulator requires discussion and the minutes must reflect the decision, we use the post-discussion vote as the official vote. The pre-discussion vote is taken for calibration and record only. Therefore, we do not use it in the decision. The procedure then skips to the vote.

       But note: the chair wanted to weigh the pre-discussion vote against the post-discussion vote. We cannot do that without a model. So we do not include it in the decision rule. We record both and then use the post-discussion vote.

     - Therefore, after Gate 7 we proceed to the discussion and then the post-discussion vote. The vote threshold is set by Gate 6.

  **Summary of the Gates:**

  1. Ground truth? (Yes -> 2; No -> 5)
  2. Compound? (No -> 3; Yes -> break down and run separately)
  3. Estimate competence (p) -> 4
  4. Estimate independent channels (k) -> set n_eff = k -> 6
  5. Delegate to expert? (Yes -> delegate; No -> 6)
  6. Asymmetric cost ratio (R) -> compute T = 1/(1+R) -> set V_min = ceil(T * 9) -> 7
  7. Pre-discussion vote (recorded but not used for decision) -> discussion -> post-discussion vote: if the number of 'yes' votes in the post-discussion vote >= V_min, then treat as material exposure; else, do not.

  **Important Note on Gate 4 and Group Size**: We set n_eff as the number of independent channels. However, in the vote (Gate 7) we are using the actual 9 votes. The n_eff was used in the Condorcet calculation? Actually, in the procedure above, we did not use n_eff in the vote threshold. We only used it in the delegation gate (if n_eff is very low, but we didn't have a gate for that). We used n_eff only in the competence gate? Actually, we did not use it in any calculation. We have not incorporated n_eff into the Condorcet probability. This is a gap.

  We must use n_eff when we have an estimate of p (from Gate 3) to compute the probability that the majority of the independent opinions are correct. But then we would have to set a threshold for that probability? That is too complex.

  Alternatively, we can adjust the vote threshold for the 9 members by the dependence. But that is not straightforward. We might instead use the effective group size to adjust the vote threshold? For example, if n_eff=2, then we require a majority of the independent channels? But we don't know which votes are independent.

  We leave this as an open issue. We rely on the delegation gate (Gate 5) to handle cases where one expert is present, and we use the pre-discussion vote to capture independence. But in the vote threshold (Gate 6) we use the full 9 votes. This is a limitation.

  **Applying the Procedure to Examples**

  **Example 1: Water-damage claims spike**

  - **Gate 1**: Ground truth? Yes (will resolve in 6 months) -> Gate 2.
  - **Gate 2**: Compound? No (signal vs artefact is a single question) -> Gate 3.
  - **Gate 3**: Track record: yes for 6 members, average p = ? Let's assume we compute p = 0.6 (better than chance). We use p=0.6 -> Gate 4.
