  **1**  
  I am the curve that lifts from baseline, **shoulder**  
  Bearing the weight of words. My open **counter**  
  Invites the eye. No gothic **hood** obscures  
  My modest form, though some would arm me with a **spur**  
  To pierce the space where meaning pools. I **overshoot**  

  **2**  
  The x-height line by just a hair. I **overshoot**  
  The strict geometry, a rounding **shoulder**  
  Against the grid. The scribe might add a **spur**,  
  A tiny beak, to guard my inner **counter**,  
  But here, I need no such elaborate **hood**  

  **3**  
  To state my case. Yet watch: a heavy **hood**  
  Descends, a blackletter cowl. I almost **overshoot**  
  My own identity. Is that my **counter**  
  Still trapped inside? My graceful **shoulder**  
  Now armored, sharp – a weapon’s cruel **spur**?  

  **4**  
  Or cut me clean: a stencil’s bridge, a **spur**  
  Of metal holds my centre. Where my **hood**  
  Might arch, cold air. The **shoulder**  
  Stops abruptly. Does this shape **overshoot**  
  The mark? The bridge defines the **counter**  

  **5**  
  A child draws me backwards, loops askew. The **counter**  
  Gapes unfamiliar. Later, boldness grows a **spur**  
  Of confidence, until the ink **overshoots**  
  Its bounds, my eye a pinprick. Neighbourhood  
  Defines me most: not **d**, not **o**. My **shoulder**  

