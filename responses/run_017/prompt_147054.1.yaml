prompt: |-
  I'm a software engineer with no formal philosophy background — I work on infrastructure reliability, spend a lot of my time writing postmortems and fault-tree estimates for failures that are individually unlikely and collectively expensive — and for about a year now I've been arguing with a friend from the effective-altruism/rationalist part of the internet about what gets called expected value fanaticism. It started concretely: I argued against spending a whole sprint hardening a storage system against a data-loss bug I estimated at roughly one-in-a-million per year, and he said the arithmetic obviously favored it once you multiply by the size of the loss, and that my resistance was just scope neglect with better PR. It then escalated, as these things do, to donation allocation and to the Pascal's-mugging style case where someone claims a one-in-a-billion chance of affecting an astronomically large number of lives and asks you to act on it. Neither of us has moved. We've now agreed to stop arguing and write up an adversarial collaboration instead, and I'd like you to draft the document we should produce.

  The two positions are these. His is the fanatical one: if an action has higher expected value than every alternative, you should take it, full stop — the smallness of the probability is already in the product, so paying attention to it again is double-counting, and any principled rule for ignoring long shots will either collapse back into maximizing or tell you to ignore real risks like a well-anchored one-in-ten-thousand chance of civilizational catastrophe. Mine is a view I'd describe as borrowed from my day job, and I've never seen it stated in this debate, so I want to see whether it survives: probability estimates have a resolution floor. An estimate assembled from a finite body of evidence can't distinguish probabilities below roughly one over the effective size of that evidence, so an expected value computed from a below-resolution probability isn't a small number, it's noise wearing a number's clothes, and it shouldn't drive action however astronomically large the payoff is — whereas a probability that is anchored in a well-validated model (a fault tree with observed component failure rates, an actuarial table) is above the floor and can. He has three replies he keeps making: that this just relocates the arbitrariness into my choice of floor; that it's risk aversion smuggled in as epistemology; and that on any such view there's a large enough payoff that the noise argument should have been applied one step earlier, so I'm only postponing the fanaticism. I don't want you to adjudicate. I want the joint statement.

  Please give me: (1) a numbered agreed-claims section — including what we both already accept, namely that EV reasoning is fine for the anchored cases and that the mugging as stated shouldn't move anyone, so the real question is what separates the anchored from the unanchored; (2) a disagreements table with each side's position stated in wording that side would accept for itself, not in the other side's parody of it; (3) the cruxes — I suspect at least these four: whether the dispute is about small probabilities at all or really about the trustworthiness of the probability's source; whether my view is secretly just concavity in the utility of lives saved (which he rejects as treating people non-linearly) or is genuinely a claim about probabilities; whether there is a difference between what you should do, what you should spend money on, and what you should spend your limited deliberation on, so that "fanaticism" might be three different theses that happen to travel together; and whether any stopping rule avoids both fanaticism and the reductio that you must ignore every long-shot risk; (4) for each crux, a concrete case, argument, or thought experiment both of us would accept as bearing on it, with each side's prediction written down in advance and a note about which outcome should make which side concede; and (5) an honest flag on any part of this that you think is verbal rather than substantive. Please argue from scratch and define your terms rather than pointing at literature — no citations, reading lists, or summaries of what various authors have said; I can't check them and they'd only be name-dropping. Keep the formalism plain-English but exact, and where a claim rests on a dominance or axiom argument, say which axiom is doing the work.
reasoning: |-
  We are drafting an adversarial collaboration document between two positions on "expected value fanaticism." The two parties are:

  - **F (Fanatical position):** Advocates for always acting on the action with the highest expected value (EV), regardless of how small the probability is, as long as the EV calculation is based on the best available estimate. Believes that any rule that ignores small probabilities will either collapse back to EV maximization or lead to ignoring real, well-anchored risks.

  - **S (Skeptical position):** Argues that probability estimates have a "resolution floor" based on the finite evidence behind them. When the probability is below this floor, the EV is not a reliable number and should not drive action, no matter how large the potential payoff. However, for probabilities that are "anchored" (e.g., from well-validated models with observed data), the EV is reliable and should be used.

  ## (1) Agreed Claims

  We both accept the following:

  1. **Expected Value (EV) Reasoning**: For decisions where the probabilities and outcomes can be reasonably estimated (we call these "anchored" cases), maximizing expected value is a sound and rational approach.

  2. **Pascal's Mugging as Stated**: In the classic Pascal's Mugging scenario (where a stranger claims a one-in-a-billion chance of affecting an astronomically large number of lives and asks for a small payment), we agree that one should not be moved by such a claim. The challenge is to explain why, without undermining the use of EV in anchored cases.

  3. **The Central Question**: The key issue is not whether EV reasoning is valid in general, but how to distinguish between cases where it is applicable (anchored probabilities) and cases where it is not (unanchored or extremely small probabilities that fall below a resolution floor).

  4. **Finite Evidence**: All probability estimates are based on finite evidence and thus have limitations in their precision.

  5. **Goal of Decision-Making**: We both aim to make decisions that are, in some sense, rational and that avoid catastrophic outcomes.

  ## (2) Disagreements Table

  | Disagreement Area | F's Position (as stated by F) | S's Position (as stated by S) |
  |-------------------|--------------------------------|--------------------------------|
  | **On the handling of small probabilities** | "When an action has a higher expected value than every alternative, you should take it, without exception. The smallness of the probability is already factored into the expected value calculation. To ignore an action because of a small probability is to double-count the smallness and to neglect the scope of the potential outcome." | "Probability estimates derived from finite evidence have a resolution floor. When the estimated probability falls below this floor, the expected value calculation becomes noise and should not drive action, however large the potential payoff. This is not double-counting; it is recognizing the limits of the estimate. For probabilities above the floor (anchored), EV reasoning applies." |
  | **On the arbitrariness of the floor** | "Setting a resolution floor is arbitrary and merely relocates the problem. It is unclear how to set the floor without introducing subjectivity, and any such floor would either be too high (ignoring real risks) or too low (collapsing back to EV maximization)." | "The resolution floor is not arbitrary; it is determined by the effective sample size of the evidence. For example, if an event has never been observed in a million trials, we cannot reliably distinguish probabilities below about one in a million. This is a matter of statistical reliability, not an arbitrary cutoff." |
  | **On risk aversion vs. epistemology** | "The resolution floor argument is a covert form of risk aversion. It treats the utility function as having a concave region for very small probabilities of very large gains, which is equivalent to treating lives non-linearly (i.e., discounting the value of many lives saved in a single event). But we should value lives linearly and not introduce such concavity." | "The issue is purely epistemological. The problem is not with the utility function (which is linear in lives saved) but with the reliability of the probability estimate itself. When the probability estimate is below the resolution floor, we cannot trust the EV calculation to be meaningful, so we should not act on it." |
  | **On the regress argument** | "Even if we set a resolution floor, there will always be a payoff large enough so that the EV of an action with a probability just above the floor would be enormous. Then, one would have to consider an event with a probability just below the floor and a slightly larger payoff. This forces a regress: either accept fanaticism at the next level or admit that the floor is arbitrary and collapses." | "The resolution floor applies to the probability estimate, not to the payoff. A large payoff does not make a below-floor probability estimate any more reliable. The floor is a property of the evidence, and for events with probabilities below the floor, we must rely on alternative methods (e.g., structural models) to anchor the probability or else refrain from acting on the EV alone." |

  ## (3) Cruxes and Testing Predictions

  We identify four cruxes that might resolve the disagreement. For each, we provide a concrete test case or argument, and state the predictions of F and S. We also note which outcome should lead to which concession.

  ### Crux 1: Is the dispute about small probabilities or the trustworthiness of the probability source?

  **Test Case**: Consider two scenarios:

  - **Scenario A**: A well-validated fault tree model for a storage system, based on 10 years of data from 1000 systems, estimates a failure probability of 1 in 100,000 per year. The failure would cause the loss of 10,000 user accounts (each with high value). The expected loss is 0.1 accounts per year.

  - **Scenario B**: A stranger claims that by giving them $1, they can prevent an asteroid impact that would destroy Earth. They assert the probability of impact is 1 in 10^30, but they offer no evidence beyond their word. The expected value of giving $1 is astronomical (since the value of saving Earth is immense).

  **F's Prediction**: In Scenario A, we act because the probability is anchored. In Scenario B, we do not act because the probability estimate is not trustworthy (it has no evidential basis). Thus, the issue is about the trustworthiness of the source, not the smallness of the probability per se.

  **S's Prediction**: The issue is about the resolution of the probability estimate. In Scenario A, the probability is above the resolution floor (which might be around 1 in 1,000,000 given the data) so we act. In Scenario B, the probability is below any reasonable floor and is unanchored, so we do not act. The key is the resolution floor, which depends on the evidence.

  **Outcome and Concession**: 
  - If both agree that the reason for rejecting Scenario B is the lack of evidence (trustworthiness) and that if the same probability (1 in 10^30) were somehow anchored by a validated model, then we should act, then F is correct and S must concede that the issue is trustworthiness, not the absolute smallness of the probability.
  - If S can show that even a theoretically anchored probability of 1 in 10^30 (say, from a model built on a huge amount of data) would still be below the resolution floor (because no amount of data can pin down such a small probability) and thus should be ignored, then S is correct and F must concede that the absolute smallness matters.

  ### Crux 2: Is S's view secretly about concavity in utility or about probabilities?

  **Test Case**: Consider a hypothetical where we have a perfectly reliable (anchored) probability of 1 in 1 billion of saving 10^12 lives (a trillion lives) for a cost of $1. The expected number of lives saved is 1000, so the EV is positive.

  **F's Prediction**: Since the probability is anchored, we should pay the $1. If S refuses, it must be because S is discounting the value of saving a trillion lives in one go (i.e., treating the utility of lives saved non-linearly) — which is risk aversion or concavity in utility.

  **S's Prediction**: The issue is not utility but the reliability of the probability. In this case, S would argue that a probability of 1 in a billion is below the resolution floor of any real-world evidence we might have. But if we assume it is truly anchored (i.e., we have a model that we trust completely and that gives exactly this probability), then S would accept the action. However, S would note that in practice, we cannot have such an anchor for such a small probability.

  **Concrete Test**: We must clarify: is S willing to act on an anchored probability of 1 in a billion for a sufficiently large payoff? If yes, then S's position is about probabilities, not utility. If no, then S is introducing concavity.

  **Outcome and Concession**:
  - If S agrees that in the hypothetical with a perfectly anchored probability, they would act, then F must concede that S's position is about probabilities and not about utility.
  - If S still refuses to act even with a perfectly anchored probability, then S must admit that their position includes a form of risk aversion (non-linear utility for very large stakes) and F's criticism is valid.

  ### Crux 3: Are "should do", "should spend money on", and "should spend deliberation on" distinct?

  **Test Case**: Consider a decision about whether to spend $1,000,000 on a project that has a one-in-a-billion chance of saving 10^15 lives (a quadrillion lives). The expected lives saved is 1,000,000, so the cost per life saved is $1, which is very good. However, the probability is unanchored — it comes from a back-of-the-envelope calculation with many untested assumptions.

  **F's Position**: The expected value is positive and large, so we should do it (if it's the best use of the money). We should also spend the money. Deliberation costs are negligible for a one-time decision.

  **S's Position**: We should not spend the money because the probability is unanchored and below the resolution floor. However, we might want to spend a small amount of money (say, $10,000) to get better evidence to anchor the probability (if possible). We should spend a limited amount of deliberation to check if there is a way to anchor the probability.

  **Test Question**: Can we separate the decision to act from the decision to deliberate further?

  **Predictions**:
  - F: The only rational decision is to spend the money if the EV is highest. Deliberation is only worthwhile if its cost is less than the expected improvement in the decision. But in this case, since the EV is so high, even a small chance of being wrong might justify more deliberation. However, if we don't have a better way to get evidence, we should act.
  - S: We should not act on the unanchored EV. Instead, we should spend resources to try to anchor the probability (if feasible) or else treat the action as not justified.

  **Outcome and Concession**: 
  - If both agree that in this case, the best course is to spend a little on getting better evidence rather than acting immediately, then the positions converge in practice. F must concede that deliberation and anchoring matter. S must concede that the action might be taken if the probability becomes anchored.
  - If F insists on acting without further deliberation and S insists on not acting even if no further anchoring is possible, then the disagreement remains. But we note that F would accept spending on deliberation if it has positive EV, and S would accept acting if the probability becomes anchored.

  ### Crux 4: Can we avoid both fanaticism and ignoring long-shot risks?

  **Test Case**: Consider a sequence of scenarios where we are asked to pay $1 to prevent an outcome with probability p and loss L. We vary p and L:

  - Case 1: p = 1 in 10,000, L = 1 million lives (anchored, e.g., from actuarial tables).
  - Case 2: p = 1 in 10^10, L = 10^15 lives (unanchored, e.g., from a wild guess).
  - Case 3: p = 1 in 10^10, L = 10^15 lives, but now we have a theoretical model (with no empirical validation) that gives this probability.

  **F's Position**: In all cases, if the EV (p * L) is positive and greater than the next best alternative, we pay. In Case 1, clearly yes. In Case 2, if we accept the probability at face value, we pay. But F might reject Case 2 because the probability is not trustworthy. In Case 3, if the model is the best available, we pay.

  **S's Position**: In Case 1, we pay because anchored. In Case 2, we do not pay because below the floor. In Case 3, if the model is not empirically validated (so still unanchored), we do not pay.

  **The Challenge**: Can we formulate a stopping rule that says "ignore probabilities below threshold T" without either:
  - Ignoring Case 1 if T is set too high (e.g., 1 in 10,000 is below T if T=1 in 1,000) — which would be ignoring a real risk?
  - Collapsing to fanaticism if T is set too low (e.g., T=1 in 10^20, so we act on Case 2 and 3)?

  **S's Proposed Rule**: Ignore probabilities that are below the resolution floor of the evidence. For Case 1, the evidence (actuarial tables with large datasets) supports the probability. For Case 2 and 3, the evidence is insufficient to resolve such small probabilities, so we ignore.

  **F's Challenge**: What if we have a very large dataset? Suppose in Case 4, we have 10^12 data points and observe zero occurrences of an event. Then the resolution floor might be about 1 in 10^12. But then if we set L = 10^18 lives, the EV is 10^6 lives, so we must act. Then what about an event with probability 1 in 10^13 and L=10^19? The EV is the same (10^6 lives). But now the probability is below the floor. So we ignore? Then we are ignoring a risk with the same EV as one we would act on. This is inconsistent.

  **S's Response**: The floor is relative to the evidence. In Case 4, with 10^12 data points, we can act on a probability of 1 in 10^12. For 1 in 10^13, we cannot. But note that the EV of the 1 in 10^13 event is the same as the 1 in 10^12 event only if the loss is scaled by 10. However, the reliability of the probability for 1 in 10^13 is worse. We might use a confidence interval: the 10^12 data points give an upper bound of about 3 in 10^12 (at 95% confidence) for the probability. So we can only say that the EV is less than about 3 * 10^6 lives. We might then act on the upper bound. But if we do that, then for the 1 in 10^13 event, the upper bound from the same data would be about 3 in 10^12, so the EV upper bound is 3 * 10^7 lives, and we would still act if the cost is low. This seems to collapse back to fanaticism.

  **Outcome and Concession**: 
  - If S cannot provide a non-arbitrary stopping rule that avoids both ignoring real risks and fanaticism, then F wins on this crux.
  - If S can provide a rule (e.g., always use an upper bound from the evidence and then maximize EV) that avoids fanaticism (by not letting arbitrary small probabilities drive action) and still catches real risks, then S wins.

  Note: The upper bound rule might lead to acting on many unanchored probabilities, which S wants to avoid. So perhaps S must accept that the rule is to use the best estimate (with a floor) without scaling the payoff arbitrarily.

  ## (5) Flags for Verbal Disagreements

  We flag two areas where the disagreement might be more verbal than substantive:

  - **Definition of "Anchored"**: F might include any probability that is the best available estimate (even if based on weak evidence) as "anchored" for that context. S reserves "anchored" for probabilities that are well-validated and above the resolution floor. This is a substantive difference, but the term "anchored" is being used differently.

  - **Expected Value**: Both agree that EV is the product of probability and outcome. The dispute is about when the probability input to EV is valid. This is substantive.

  - **Noise**: S's claim that below-floor probabilities make EV "noise" might be contested. F might say that even noisy estimates are the best we have and should be used. This is substantive.

  ## Conclusion of the Collaboration

  We have laid out the agreed claims, the disagreements, and the cruxes with testable predictions. We commit to running the tests (e.g., by examining the hypotheticals and real-world cases) and updating our views based on which predictions hold. We also note that the resolution may depend on the context of the decision (e.g., infrastructure reliability vs. philanthropic donations) and that practical considerations (like deliberation costs) may sometimes make the positions converge.
answer: |-
  ### Adversarial Collaboration: Expected Value Fanaticism and the Resolution Floor  
  **Parties:**  
  - **F (Fanatical Position):** Advocates strict expected value (EV) maximization. Believes any deviation risks double-counting low probabilities or ignoring real catastrophic risks.  
  - **S (Skeptical Position):** Argues that EV is unreliable when probabilities fall below a "resolution floor" determined by available evidence.  

  ---

  ### (1) Agreed Claims  
  We both accept the following:  
  1. **EV as the default for anchored cases:** When probabilities are "anchored" (e.g., derived from validated models like fault trees, actuarial tables, or robust empirical data), EV maximization is rational and should guide action.  
  2. **Pascal’s Mugging is invalid:** The canonical mugging (e.g., "1-in-a-billion chance of saving 10^100 lives") should not compel action. The dispute centers on *why*.  
  3. **The core question:** What separates "anchored" probabilities (where EV is actionable) from "unanchored" ones (where it is not)?  
  4. **Finite evidence limits precision:** All probability estimates are constrained by finite data/models.  
  5. **Goal alignment:** Both positions aim to avoid catastrophes and maximize positive impact.  

  ---

  ### (2) Disagreements Table  
  | Topic | F’s Position (in F’s words) | S’s Position (in S’s words) |  
  |-------|------------------------------|------------------------------|  
  | **Role of small probabilities** | "If an action has higher EV than alternatives, you should take it. The probability’s smallness is already baked into the EV product. Adding extra rules to ignore small probabilities double-counts risk and may ignore real threats like a 1-in-10,000 catastrophe risk." | "Probability estimates have a resolution floor. When a probability is below this floor (e.g., 1-in-a-million from sparse data), its EV is noise, not a meaningful number. Acting on it is unjustified no matter the payoff size. This is not double-counting—it’s epistemic humility." |  
  | **Arbitrariness of the floor** | "A resolution floor relocates arbitrariness: Who sets the floor? If it’s too high, it ignores anchored risks; if too low, it collapses back to EV maximization. We should use the best estimate available, however uncertain." | "The floor isn’t arbitrary—it scales with the effective evidence size (e.g., 1/N for N observations). Anchored probabilities exceed this floor; unanchored ones don’t. We reject probabilities that lack statistical resolvability." |  
  | **Risk aversion vs. epistemology** | "S’s view smuggles in risk aversion by treating large payoffs non-linearly. If we value lives linearly, a tiny chance of saving many lives must outweigh a sure small gain." | "This is purely about probability reliability, not utility curvature. I value lives linearly, but an unanchored ‘probability’ isn’t a real probability—it’s a guess. We can’t linearly multiply by noise." |  
  | **Regress argument** | "S’s floor just postpones fanaticism: For any payoff, there’s a probability just above the floor with huge EV. If S acts on that, why ignore a slightly smaller probability with a slightly larger payoff?" | "The floor applies to probability *resolution*, not payoff size. A larger payoff can’t make an unresolvable probability resolvable. We act only when probabilities are above the floor *and* anchored." |  

  ---

  ### (3) Cruxes and Testing Protocol  
  For each crux, we specify:  
  - **A shared concrete case/argument** to test predictions.  
  - **F’s and S’s predictions** about the case.  
  - **Concession conditions:** Which outcome would force which side to update.  

  #### Crux 1: Is this dispute about probability size or source trustworthiness?  
  **Test Case:** *The Asteroid Paradox*  
  - **Setup:** An AI model predicts a 1-in-10^15 chance of a Mars-bound asteroid veering toward Earth, threatening 10^12 lives. The model is trained on 10^9 asteroid trajectories (high data volume) but has never seen such a trajectory.  
  - **Question:** Should we spend $1M to deflect it? (Assume deflection cost is trivial vs. EV of saving lives.)  

  | Position | Prediction |  
  |----------|------------|  
  | **F** | "Act if EV > alternatives. Here, EV = (10^12 lives) × (1/10^15) = 0.001 lives. If $1M < value of 0.001 lives, act. The probability size is irrelevant—only EV matters." |  
  | **S** | "Don’t act. With 10^9 samples, the resolution floor is ~1/10^9. 1/10^15 is unresolvable noise, even with ‘big data.’ The model lacks empirical validation for this novel scenario." |  

  **Concession:**  
  - If S concedes the probability is anchored due to data volume, F wins.  
  - If F concedes the estimate is untrustworthy despite data, S wins.  

  #### Crux 2: Is S’s view secretly concavity in utility?  
  **Test Case:** *The Perfect Model*  
  - **Setup:** A flawlessly validated physics model (e.g., tested against 10^20 particle collisions) gives a 1-in-10^18 probability that a lab experiment destroys Earth. We can cancel it for $10.  
  - **Question:** Should we cancel?  

  | Position | Prediction |  
  |----------|------------|  
  | **F** | "Act. EV = (Value of Earth) × (1/10^18). Any refusal reveals S values ‘saving Earth’ non-linearly—i.e., discounting large-stake outcomes." |  
  | **S** | "Act. The probability is anchored (validated model), so EV is reliable. My objection is solely about *unresolvable* probabilities." |  

  **Concession:**  
  - If S refuses to act, F’s "concavity" critique stands.  
  - If S acts, F must drop the "smuggled risk aversion" claim.  

  #### Crux 3: Are "should do," "should fund," and "should deliberate on" distinct?  
  **Test Case:** *The Unfalsifiable Charity*  
  - **Setup:** A charity claims a 1-in-10^12 chance of averting a pandemic that would kill 10^15 people, for $1B. The claim relies on complex, untestable theories.  
  - **Question:** Should we (a) fund it, (b) reject it outright, or (c) spend $10K to investigate further?  

  | Position | Prediction |  
  |----------|------------|  
  | **F** | "Fund if EV > alternatives. EV = (10^15) × (1/10^12) = 1000 lives. If $1B < value of 1000 lives, fund it now. Deliberation is wasteful unless its cost < EV gain." |  
  | **S** | "Reject funding. The probability is unanchored (no validation). But spend $10K on investigation—it’s cheap and might anchor the probability. ‘Should deliberate’ ≠ ‘should act’." |  

  **Concession:**  
  - If F agrees deliberation is optimal here, S’s distinction holds.  
  - If S funds without deliberation, F’s "unified fanaticism" stands.  

  #### Crux 4: Can we avoid fanaticism and ignore-real-risks?  
  **Test Case:** *The Confidence Interval Rule*  
  - **Setup:** S proposes a rule: "Use the upper bound of a 95% confidence interval for low probabilities, then maximize EV." E.g., 0 observed failures in N trials → upper bound ≈ 3/N.  
  - **Challenge:** Apply to two scenarios:  
    - **A:** 0 failures in 10,000 flights; risk = 1/10,000 (anchored).  
    - **B:** 0 failures in 10^9 server reboots; risk = 1/10^9 (S says unanchored).  
  - **Question:** Does this rule avoid both (1) ignoring Scenario A and (2) acting fanatically on Scenario B?  

  | Position | Prediction |  
  |----------|------------|  
  | **F** | "The rule collapses to fanaticism: For B, EV upper bound = (3/10^9) × Payoff. If Payoff is huge (e.g., 10^20 lives), we must act—same as vanilla EV." |  
  | **S** | "The rule avoids fanaticism: In B, 3/10^9 is still resolvable (N=10^9), so we can act. For probabilities below the floor (e.g., 1/10^15 with N=10^9), the upper bound is still unresolvable noise." |  

  **Concession:**  
  - If S’s rule forces acting on 1/10^15 (by scaling payoff), F wins.  
  - If F admits the rule handles A and B without absurdity, S wins.  

  ---

  ### (4) Verbal Disputes Flag  
  - **"Anchored" vs. "resolution floor":** Potentially verbal. S ties "anchored" to exceeding the resolution floor; F sees "anchored" as synonymous with "best available estimate."  
  - **"Noise":** Substantive. F argues noisy estimates are still action-guiding; S argues noise invalidates the EV product.  
  - **"Linearity of utility":** Partly verbal. Both agree on linear utility for lives, but F accuses S of *implicit* non-linearity. Crux 2 tests this.  

  ---  
  **Joint Commitment:** We will evaluate the test cases against real-world analogs (e.g., infrastructure decisions, AI risk models) and update our positions based on which predictions hold. This document is a snapshot of our current disagreement, not a final resolution.
