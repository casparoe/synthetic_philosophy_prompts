  Okay, let me approach this systematically. The user presents two intriguing cases where scientific regularities - the genetic code and orbital coplanarity - aren't treated as laws despite their universality, and where the status of equations seems to shift between "law" and "derived consequence". 

  First, I need to unpack what might be happening here. Three philosophical concepts come to mind: metaphysical necessity versus contingency, epistemic fundamentality, and pragmatic counterfactual robustness. The genetic code example screams contingency - it's universal but could have been otherwise. The orbital mechanics case highlights how epistemic status changes with theory depth. Both point to how scientists use these regularities: the genetic code isn't relied upon for counterfactual reasoning about alien life, while Kepler's laws still are for orbital predictions even after being "demoted".

  Hmm... the key feature seems to be a regularity's role in explanatory frameworks rather than its empirical strength. This challenges both Humean and governing-law views. For Humeans, if laws are just summaries, why exclude these universal patterns? For governing-law theorists, why call something contingent if it governs? 

  I should test boundaries. Mathematical truths (like πr²) aren't laws because they're analytic. Hedged generalizations ("most planets...") lack universality. The interesting gray zone is when a derived regularity gains law-like status through utility, like thermodynamics emerging from statistical mechanics.

  The movement the user notices isn't confusion - it's scientists tracking explanatory fundamentality. When they say the genetic code isn't a law, they're marking it as contingent even if universal; when they derive Kepler's laws from gravity, they're showing their non-fundamental nature while preserving their counterfactual force. 

  This suggests a concept I'll call "explanatory tiering" - the layered structure of science where some regularities serve as bedrock for counterfactuals while others, however universal, sit at the surface. It's not that laws are unstable, but that their authority comes from their position in this tiering. The user's cases perfectly expose this.
answer: |-
  You've identified a deep and subtle phenomenon at the heart of scientific epistemology. Let's dissect this carefully, exploring candidate concepts, their strengths and strains, before committing to a characterization. I'll avoid premature labeling and focus on the feature doing the work.

  **Brainstorming Candidate Concepts:**

  1.  **Explanatory Fundamentality / Derivational Status:**
      *   **What it captures:** This focuses on *where a regularity sits in the hierarchy of explanation*. A "law" is often treated as a *starting point* for deduction within a theory – a fundamental postulate or brute regularity not derived from deeper principles *within that explanatory framework*. The genetic code isn't derived from deeper biological laws; it's a contingent starting point *for* explaining protein synthesis. Kepler's laws (like near-coplanarity) are *derived* from Newtonian gravity + initial conditions, so they lose "law" status within Newtonian mechanics. The *same* equation (e.g., Kepler's third law, T² ∝ R³) is a fundamental law *if* you're working within a Ptolemaic or purely kinematic framework, but becomes a derived consequence *if* you're working within Newtonian mechanics. The "promotion/demotion" tracks shifts in what is considered explanatorily fundamental.
      *   **Where it strains:** This is highly *theory-relative* and *perspective-dependent*. What's fundamental in one theory (e.g., Mendel's laws in classical genetics) may be derived in another (population genetics, molecular biology). Does "lawhood" then vanish? Scientists often *still* call Mendel's patterns "laws" colloquially. This concept struggles to explain why *some* derived regularities retain a strong "law-like" feel (e.g., thermodynamics derived from stat mech), while others (like the genetic code) feel "accidental".

  2.  **Counterfactual Robustness / Nomic Force:**
      *   **What it captures:** This emphasizes how scientists *use* the regularity in reasoning, particularly *counterfactual* reasoning. A "law" is something expected to hold *even if things had been different* in specific ways. Scientists confidently use Newton's laws to predict spacecraft trajectories in novel situations (counterfactually robust). They *would not* bet on the *specific* genetic code holding for alien life (it lacks nomic force/non-accidentalness). The orbital coplanarity is a consequence of the formation process; if the solar system formed differently, it might not hold, so it's not counterfactually robust in the same way as gravity. The "movement" you see is scientists assessing *how broadly* a regularity constrains possibilities – does it feel like a *constraint* or an *outcome*?
      *   **Where it strains:** Judgments of counterfactual robustness are often *implicit* and *pragmatic*. They depend on what background conditions scientists hold fixed and which they imagine varying. Is gravity counterfactually robust *everywhere*? Near a singularity? At the quantum level? Scientists' willingness to use a regularity counterfactually often *follows* their belief in its fundamentality or universality, rather than being the defining feature. It can feel circular.

  3.  **Metaphysical Necessity vs. Contingency:**
      *   **What it captures:** This is the classic philosophical distinction: Is the regularity *necessarily* true (true in all possible worlds, given the fundamental laws), or merely *contingently* true (true in our world, but could have been otherwise)? Scientists calling the genetic code a "frozen accident" are marking it as metaphysically *contingent*. Orbital coplanarity is contingent on the specific angular momentum distribution of the protoplanetary disk. Kepler's laws derived from Newton are necessary *given* Newton's laws + specific initial/boundary conditions. Demotion occurs when a regularity is shown to be contingent upon deeper laws + contingent initial conditions. Promotion happens when a coincidence is shown to be necessitated by deeper laws (e.g., the stability of certain atomic configurations).
      *   **Where it strains:** This is the most metaphysically loaded concept. Many scientists (and philosophers) are skeptical about our access to "metaphysical necessity." How do we *know* the genetic code *is* contingent? Because we can conceive of alternatives? Conception might not track possibility. Furthermore, the *fundamental* laws themselves might be contingent (a major debate). Judgments of contingency often *rely* on the other two concepts (explanatory fundamentality and counterfactual robustness).

  **The Verdict: The Feature Doing the Work**

  The core feature driving the "law"/"accident" shift in your examples is **the perceived role of the regularity within the current explanatory framework, specifically concerning its counterfactual robustness relative to imagined scenarios relevant to scientific practice.**

  *   **What it is:** It's a judgment about *why the regularity holds* and *how much it constrains possibilities* that scientists care about.
      *   If the regularity is seen as a *fundamental constraint* itself (explanatorily basic or expressing a deep necessity), it gets labeled a "law" and is used robustly in counterfactual reasoning (e.g., predicting spacecraft paths with Newton, even after Einstein).
      *   If the regularity is seen as a *consequence* of deeper constraints *plus* specific contingent initial conditions or historical accidents, it gets demoted to "how things happen to be" or "derived," and its counterfactual robustness is limited (e.g., the genetic code might not hold elsewhere; coplanarity might not occur in other systems).
  *   **What differs:** The *same evidence and scope* (universality in our observations) is interpreted differently based on the *surrounding theoretical context*. That context provides:
      1.  **An explanation for *why* the regularity holds:** Is it fundamental or derived? If derived, does it flow *necessarily* from the deeper laws, or does it depend critically on contingent factors?
      2.  **A basis for judging counterfactual robustness:** Does the explanation suggest the regularity would hold if we varied initial conditions (like planet masses or positions - gravity still holds)? Or would it break (like changing the protoplanetary disk's angular momentum - coplanarity might vanish)? Does it suggest it would hold in radically different contexts (like alien biochemistries - genetic code likely wouldn't)?

  **What it is NOT:**

  1.  **Hedged or Qualified Generalization:** "Most birds fly" is not universal and explicitly hedged. Your examples are (currently) exceptionless *within their observed domain*. The "accidental" label doesn't deny universality *here*, but questions its *necessity* or *robustness elsewhere*.
  2.  **True by Definition/Mathematics:** "All bachelors are unmarried" is true by definition. "The sum of angles in a Euclidean triangle is 180 degrees" is mathematical necessity. These lack empirical content and aren't contingent facts about the world. Your examples are empirical regularities.
  3.  **Pattern Holding Only Due to Lack of Intervention:** "No one has jumped 10m high" holds because human physiology imposes a *law-like constraint*, not merely because no one has tried hard enough *yet*. The genetic code *could* potentially be altered experimentally, but its universality isn't seen as fragile due to imminent intervention; it's seen as contingent on evolutionary history.

  **Boundary Cases & Challenges:**

  *   **Instance:** **The Second Law of Thermodynamics.** It's derived from statistical mechanics (demoted from fundamental status). Yet, it retains immense "law-like" status because its statistical basis makes it *overwhelmingly probable* and thus counterfactually robust for macro-scale phenomena. Its *derived* status doesn't fully erase its nomic force. This shows the interplay – fundamentality *contributes* to counterfactual robustness, but robustness can persist even after demotion due to high probability.
  *   **Merely Looks Like One (Challenge Case):** **Conservation of Energy.** Is it a fundamental law? In classical mechanics, yes. In general relativity, energy conservation gets tricky (depends on the spacetime symmetry). In quantum field theory, it's deeply fundamental. Its status *seems* to shift with theory, but physicists overwhelmingly treat it as having supreme counterfactual robustness. This highlights that *some* principles are treated as so bedrock that their "law" status persists even through radical theory changes, suggesting an element of **epistemic priority** or **regulative ideal** beyond just current explanatory fundamentality. This is contested ground – some argue it *is* fundamental, others that its robustness stems from its foundational role in *all* physical theories.
  *   **Challenge for Both Sides (Humean vs. Governing):**
      *   **Humean (Laws as Summaries):** Struggles to explain why *some* universal summaries (genetic code) are excluded from "law" status while others (thermodynamics) are included, purely based on explanatory context and counterfactual use. It struggles with the "movement" – why summarization status changes with theory depth.
      *   **Governing (Laws as Makers):** Struggles to explain why scientists confidently *demote* things like Kepler's laws or reject the genetic code as laws. If laws "make things happen," shouldn't *any* universal regularity governing phenomena *be* a law? Governing views often need to distinguish "real" governing laws from mere byproducts, which lands them squarely in the problem you describe – the judgment of what's "real governing" vs. "accidental outcome" *is* the judgment you're observing scientists make, based on explanatory fundamentality and counterfactual robustness.
      *   **Conclusion:** Your phenomenon is a **problem for both sides**, highlighting that scientific practice relies on criteria (explanatory role, counterfactual robustness) that aren't fully captured by either simplistic summarization or naive governing metaphors. It emphasizes the **epistemic and pragmatic dimensions** of lawhood within scientific practice.

  **Direct Answer to Your Core Question:**

  The feature doing the work is **the perceived counterfactual robustness of the regularity, grounded in its current explanatory role – specifically, whether it is viewed as a fundamental constraint or a derived consequence contingent on specific initial/historical conditions.** This perception dictates whether scientists will "lean on it counterfactually" across broad scenarios (law-like) or restrict its applicability to contexts resembling the contingent setup (accidental-like).

  **Is your description confused?** No. You've pinpointed a genuine and profound aspect of scientific practice concerning the status of universal generalizations. It's not *just* ordinary theory change; it's specifically about how that change impacts the *modal force* and *explanatory status* attributed to empirically successful regularities. The "movement" is scientists dynamically re-evaluating the source of a regularity's necessity (or lack thereof) within an evolving web of explanation. This dynamic judgment about *why it holds* and *how much it binds* is central to the scientific use of "law."
