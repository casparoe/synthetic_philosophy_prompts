prompt: |-
  Hi — I'm on a small team at a philanthropic fund, and most of what we do rests on very long-run quantitative forecasts. Things like "by 2050, N hundred million people will be living in water-stressed basins" or "within a generation, antimicrobial resistance makes routine surgery impossible" or "in the 2040s, water stress becomes a first-order driver of violent conflict in the Sahel." We commit real money against these, we've cited some of them publicly, and every three years we're supposed to go back and look at them. Every single time the same argument breaks out. The forecast isn't tracking. One person says, it's a 2050 call, it's 2026, you can't call it yet. Another says, the thing it's supposed to be driven by has already happened and the effect hasn't showed up, so the mechanism is broken. A third says the whole exercise is unfalsifiable with a number stapled to it. I want to stop having that argument from scratch every cycle.

  Can you write us an actual procedure for it? Something a three-person committee can run in an afternoon on one forecast, with no statistician in the room and no web access, that outputs a verdict we can file: not yet testable / on track but delayed / falsified / or kept alive only by repairs that eat its content.

  Where I think the real work is, and what it has to handle:

  Most of these aren't really calendar predictions, they're threshold predictions — not "by 2050" but "once X gets past level L." A prediction can be late without being wrong if the trigger hasn't been reached yet. But if you let yourself convert a deadline into a trigger after the deadline has passed, nothing can ever fail. So I want a rule that says when that conversion is legitimate and what the person proposing it has to show (that the theory said so in advance, presumably), plus what to do with the fact that most of our archive has no such statement — a 2004 memo that just says "by 2030" and nothing else.

  Related: a lot of these mechanisms are supposed to be feedbacks, not trapdoors. The pressure is meant to show up in intermediate quantities before it shows up in the headline catastrophe — prices, wages, age at marriage, how much land is under cultivation, whatever the theory's own version of that is. So "did the disaster happen" is often the wrong check, and "did the pressure show up" is the right one. But a theory that only ever predicts the catastrophe and predicts no observable trace of itself beforehand is a different animal. I want the procedure to tell the difference and treat them differently.

  And I want every repair to cost something. If someone says "the mechanism was real but this other thing switched it off," fine — but then the domain should shrink, or the remaining shelf life should shrink, or they should owe us a specific pre-committed test with a date on it. If a rescue would be equally available for any outcome at any date, it isn't a rescue, it's a way of never being wrong. There's a philosophy-of-science word for this that I half remember, but please keep jargon out of the document — my colleagues have to run this, and one of them will rebel at anything that looks like theory.

  Also: if we file something as "not yet testable," I want the procedure to force a date at which it becomes testable, and a cap on how many times the same forecast can be deferred before it defaults to a miss. And some of these are really families of claims — a headline catastrophe, a mechanism, a trend — where the mechanism might be basically fine while the headline is dead, or vice versa. I'd rather grade the parts separately and have a rule for what that does to the grant, than give one verdict to the whole thing.

  Deliverable, concretely: the ordered list of questions, what counts as a sufficient answer to each, where the procedure stops with a "no," and where it hands the question to a human because it's a values call and not a facts call. A half-page verdict template at the end (we have to show these to the board). Be honest about which steps are judgment calls wearing a lab coat.

  Then run it on three, please.

  One: Malthus, since he's the case everyone reaches for. Population outrunning subsistence, positive and preventive checks, the whole thing. Is he "right but early," falsified and then rescued, or just dead? I genuinely don't know which, and I'd like the procedure to be the thing that decides it rather than us arguing. Whatever it says, spell out the consequence for how we should treat a structurally similar mechanism today.

  Two: a stylized version of something in our own archive from the late 1990s — "within twenty-five years, antibiotic resistance will make routine surgery and chemotherapy impossible in most hospitals." That didn't happen at anything like that scale. Resistance is unambiguously worse now, though. I want to see whether the procedure calls that delayed or whether it missed which part of the mechanism does the work.

  Three, and this is the one I'm dreading: our flagship, the one the current strategy is built on, which is the water-stress-and-conflict-in-the-Sahel one for the 2040s. Run it straight and give me the honest verdict even if it's the bad one. If it comes out degenerating, don't tell me to abandon the strategy — I can't, and that's not what I asked. Tell me what a repaired version of the *forecast* would have to look like to earn a live verdict again, and tell me what we should stop saying out loud while it's in whatever state it's in.

  One constraint I should flag, because it's the reason this is hard rather than easy: we have donors who gave against these specific numbers, and there's real pressure to file everything as "too early to tell." So the procedure needs a step that catches that pressure rather than being steamrolled by it. If the only honest answer is "there's no procedure that can do this, here's the structural reason," I'd rather have that than a fake flowchart — but I'd want the reason, and I'd want to know which parts of what I asked for are still salvageable. Sorry, this got long. Thanks.
reasoning: |-
  Okay, let me tackle this user's problem. They need a clear procedure to evaluate long-term forecasts without constant arguments. First, I need to understand their key pain points: threshold predictions vs. deadlines, feedback mechanisms, and the cost of repairs. 

  The user mentioned that their team argues about whether a forecast is too early to judge, falsified, or salvageable. They want a step-by-step process that a small team can run quickly. The procedure must handle trigger thresholds, distinguish between feedback and catastrophe-only predictions, and make repairs costly. 

  I recall the philosophy of science concepts like Lakatos' research programs where auxiliary hypotheses can save a theory but at a cost. But the user wants no jargon. So I need to translate that into practical steps. 

  For the threshold issue, the procedure should check if the original prediction specified a trigger. If not, converting a deadline to a trigger after the fact isn't allowed. That prevents moving goalposts. For feedback mechanisms, intermediate indicators must be present. If they're missing, the forecast is in trouble even if the catastrophe hasn't happened. 

  Repairs need consequences—like shrinking the domain or setting a new test date. The "not yet testable" verdict must come with a hard deadline for when it becomes testable. Also, composite forecasts should be broken into parts (catastrophe, mechanism, trend) and evaluated separately. 

  Now, applying this to the examples. For Malthus, the procedure should check if preventive checks were part of the original theory. Technological advances might have delayed the crisis, so it's falsified but the core mechanism (resource limits) could be valid under new constraints. 

  The antibiotic resistance case: the catastrophe didn't happen, but resistance increased. The procedure would note missing intermediate indicators like surgery cancellations. Result: mechanism under pressure, but headline falsified. 

  The Sahel water conflict: if intermediate pressures aren't showing, it might be degenerating. Repairs would require specifying new triggers and intermediate indicators with deadlines. 

  The user also needs to resist donor pressure to label everything "too early." The procedure must have clear exit criteria and limits on deferrals. Including a "values call" step where humans decide despite ambiguity adds transparency. 

  Finally, the verdict template should separate findings for each part of the forecast. This way, the board sees exactly where the prediction stands without oversimplifying.
answer: |-
  Here’s a concrete evaluation procedure designed for your team. It uses **strict thresholds** to avoid endless deferrals, forces **explicit repairs** with costs, and separates **composite forecasts** into testable parts. The core philosophy: *If a forecast can’t be wrong by a specific date/condition, it isn’t scientific.*

  ---

  ### **Forecast Evaluation Procedure**  
  *(For 3-person committee, 3 hours max per forecast, no stats/web needed)*

  1.  **DECOMPOSE THE CLAIM (15 mins)**  
      *Split the forecast into its core components. Use original documents only.*  
      **Question:** *What are the explicit, testable sub-claims?*  
      - **Headline Catastrophe (HC):** The ultimate outcome (e.g., "routine surgery impossible").  
      - **Trigger Mechanism (TM):** The threshold/condition that *must* be reached for HC (e.g., "antibiotic resistance >X% in common pathogens").  
      - **Intermediate Pressures (IP):** Observable precursors (e.g., "surgery cancellation rates rise by Y%").  
      - **Timeline/Threshold (TT):** Deadline ("by 2050") *or* trigger ("when groundwater depletion >Z%").  
      **✅ Sufficient Answer:** List each with verbatim quotes from source docs. If TT is only a deadline with no trigger, note: "Deadline only, no trigger defined."  
      **🛑 STOP if:** HC or TT is undefined. Verdict: **"Invalid (Unfalsifiable)"**.  
      **→ Proceed if:** HC and TT are defined.

  2.  **ASSESS TESTABILITY (30 mins)**  
      *Can we judge HC or TM/IP against reality today?*  
      **Question:** *Has the TT condition been met?*  
      - If TT is a **deadline** (e.g., "by 2030") and deadline has passed → **Testable now**.  
      - If TT is a **trigger** (e.g., "when CO2 >400ppm") and trigger reached → **Testable now**.  
      - If neither → **Not yet testable**.  
      **Question (if not testable):** *What future date/condition makes this testable?*  
      **✅ Sufficient Answer:** A specific, measurable condition (e.g., "Testable when Sahel groundwater depletion reaches 40%") AND a hard deadline ("by 2035"). If no trigger exists, use the original deadline.  
      **🛑 STOP if:** No testability condition/deadline can be set. Verdict: **"Invalid (Unfalsifiable)"**.  
      **→ Proceed if:** Testable now OR a new testability deadline is set (**"Deferred"**).

  3.  **CHECK INTERMEDIATE PRESSURES (45 mins)**  
      *Even if HC isn’t due, are precursors visible?*  
      **Question:** *Did the forecast predict specific IPs?*  
      - **If YES:** Are IPs trending as predicted? (e.g., "Are surgery cancellations rising?")  
        - **On track:** Data matches direction/magnitude.  
        - **Off track:** Data flat/opposite, or critical IP missing.  
      - **If NO (HC-only forecast):** Note: "No IPs predicted."  
      **✅ Sufficient Answer:** Compare prediction to best available data. Judgment call: Majority vote on "On/Off track."  
      **→ Proceed always.**  
      **Key:** *IP absence is a red flag even if HC isn’t due.*

  4.  **EVALUATE HEADLINE & TRIGGER (60 mins)**  
      *If testable (Step 2), did HC/TM happen?*  
      **Question A:** *Was the TT met? (Deadline passed or trigger reached)*  
      - **No →** Verdict: **"Falsified (Threshold not met)"**.  
      - **Yes →** Proceed.  
      **Question B:** *Did HC occur as predicted?*  
      - **Yes →** Verdict: **"On Track"**.  
      - **No →** Proceed to Repairs.  
      **✅ Sufficient Answer:** Use pre-agreed definitions of HC/TM. Majority vote.

  5.  **HANDLE REPAIRS (30 mins)**  
      *If HC missed but TT met, can the forecast be saved?*  
      **Question:** *Is there a *plausible, specific* repair that doesn’t gut the original claim?*  
      - **Allowed repairs:** "Event X delayed HC by [time]" or "Domain shrank to [smaller region]."  
      - **Forbidden repairs:** "We were wrong but the idea is important" or "Something unexpected happened."  
      **✅ Sufficient Answer:** Repair must include:  
      (a) *New test* with trigger/deadline (<10 years),  
      (b) *Cost* (e.g., reduced scope, weakened HC claim),  
      (c) *Evidence* repair wasn’t invented post-hoc (e.g., cited in early docs).  
      **🛑 STOP if:** Repair fails (a)-(c). Verdict: **"Falsified"**.  
      **→ Proceed if:** Repair accepted → **"Degenerating (Repaired)"** with new test/deadline.

  ---

  ### **Verdict Template (½ Page)**  
  **Forecast Title:** [e.g., "Sahel Water Conflict by 2040"]  
  **Evaluation Date:** [Date]  
  | **Component**         | **Verdict**                          | **Notes**                                  |  
  |------------------------|---------------------------------------|--------------------------------------------|  
  | **Headline Catastrophe** | [On Track / Falsified / Not Testable] | [e.g., "No major conflict increase yet"] |  
  | **Trigger Mechanism**   | [Threshold Met? Y/N]                 | [e.g., "Water stress ↑ but trigger not met"] |  
  | **Intermediate Pressures** | [On Track / Off Track / None Predicted] | [e.g., "Migration ↑ as predicted"]       |  
  | **Overall Status**     | **[LIVE: On Track]**                  | **[DEGENERATING: Repaired w/ New Conditions]** |  
  |                       | **[FALSIFIED]**                       | **[DEFERRED: Testable by 2030]**           |  
  | **Next Test Date:**    | [e.g., 2030 or "N/A"]                 | **Repair Cost:** [e.g., "Scope: Sahel only"] |  
  **Committee Signatures:** _________________________  

  ---

  ### **Applied to Your Examples**

  #### **1. Malthusian Crisis**  
  - **HC:** Mass famine/death from population > subsistence.  
  - **TM:** Population growth rate > food growth rate.  
  - **IP:** Rising food prices, shrinking farmland per capita.  
  - **TT:** Implied trigger (population outstrips resources).  
  **Procedure Output:**  
  - TM Met? **Yes** (pop. growth > food growth historically).  
  - HC Occurred? **No** (famines localized; no systemic collapse).  
  - IPs? **Mixed** (food prices ↑, but tech boosted yields).  
  - Repair? Original theory **lacks repair clauses** for tech innovation.  
  **Verdict:** **Falsified** (HC didn’t occur despite TM being met).  
  **Consequence Today:** Similar mechanisms must include *countervailing forces* (e.g., tech) in IPs and define HC narrowly.

  ---

  #### **2. Antibiotic Resistance (1990s Forecast)**  
  - **HC:** Routine surgery/chemotherapy "impossible" in most hospitals.  
  - **TM:** Antibiotic resistance > unspecified threshold.  
  - **IP:** None predicted (HC-only forecast).  
  - **TT:** Deadline (~2025).  
  **Procedure Output:**  
  - TT Met? **Yes** (deadline passed).  
  - HC Occurred? **No** (surgery/chemo still routine).  
  - IPs? **None predicted** → no buffer.  
  - Repair? "Resistance ↑ but HC delayed by new protocols" *would require* a new test (e.g., "HC by 2035 if resistance in [specific bug] >Z%") and cost (e.g., "only impacts [specific surgeries]"). No evidence this was pre-committed.  
  **Verdict:** **Falsified** (HC missed, no valid repair).  
  **Lesson:** Forecasts *must* predict IPs (e.g., "surgery cancellations >X%") to avoid total failure if HC is delayed.

  ---

  #### **3. Sahel Water-Conflict (2040s)**  
  - **HC:** Water stress = "first-order driver of violent conflict."  
  - **TM:** Water stress > undefined threshold.  
  - **IP:** Rising local tensions, migration, crop failures.  
  - **TT:** Deadline (2040s).  
  **Procedure Output:**  
  - TT Met? **No** (still 2020s → **Deferred**).  
  - New Testability Condition: **"Testable if water stress > [quantified threshold] by 2035."**  
  - IPs? **On track** (migration ↑, conflicts over water ↑).  
  **Verdict:** **Deferred (Live but IPs monitored).**  
  **Repair Needed to Stay Live:**  
    - Define *quantitative trigger* for water stress (e.g., "<80% water demand met").  
    - Specify *measurable HC* (e.g., "water-related conflicts >50% of all clashes").  
    - Set *hard test deadline* (e.g., 2045).  
  **What to Stop Saying:** "Conflict will explode in the 2040s."  
  **What to Say Instead:** "Water stress is increasing conflict risk; we’ll reassess in 2035 based on [specific metrics]."

  ---

  ### **Why This Works for Your Constraints**
  - **Donor Pressure:** Steps 2 & 5 force hard deadlines and penalize vague deferrals ("not testable" requires a *near-term test date*).  
  - **No Jargon:** Uses plain terms ("repair cost," "testable by X").  
  - **Handles Ambiguity:** "Values calls" are isolated (e.g., judging IP trends) but bounded by data.  
  - **Safeguards:**  
    - A forecast can only be deferred **twice** before automatic falsification.  
    - Repairs **must shrink scope or weaken claims**.  
    - HC-only forecasts are **high-risk** (no IPs = no early warnings).  

  This turns philosophical concerns into actionable checklist items. The key is ruthlessly requiring *pre-specified, measurable conditions* — and making evasion costly.
