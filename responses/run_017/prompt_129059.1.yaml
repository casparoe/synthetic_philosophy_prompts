  ### Your Two Additional Questions  
  **1. Pipeline Ordering (ASR → Literal → Pragmatic) and Circularity**:  
  - **Grice says**: "What is said" requires reference/disambiguation, which *itself* needs pragmatics → circular.  
  - **Your vocabulary**:  
