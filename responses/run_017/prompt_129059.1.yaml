    - Example: Reference resolution in NLU uses word-sense disambiguation (WSD) models trained on pragmatic data (e.g., coreference resolution embeds Gricean biases).  
    - **Circularity verdict**: The "what is said/what is implicated" seam is an **engineering artifact**, not a natural joint. Grice's circularity is real; your pipeline hides it via biased training data.  

  **2. Your Reranker vs. Grice's Apparatus**:  
