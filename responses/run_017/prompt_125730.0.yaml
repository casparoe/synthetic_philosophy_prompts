  The hardest trade-off is between elegance and fidelity. To preserve all verdicts, we need both temporal and causal clauses, but a more elegant principle would sacrifice either the verdict on Case 1 (making it fragile) or Case 2 (making it not fragile). Since Case 2 is foundational to masking intuitions, sacrificing Case 1's verdict is preferable if forced to choose - though the user's strong commitment there makes this costly.

