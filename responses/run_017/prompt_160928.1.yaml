     - *Unoccupied*: **Incoherent**. Ecological holism typically assumes restoration benefits ecosystems, so claiming it increases suffering contradicts core premises.  

  3. **Net negative + Total welfare + Animals prevented can benefit + Burden of proof on converter**  
     (Path: A → A2 → A2a → A2a1, with burden of proof)  
     - *Unoccupied*: **Unattractive**. Burden of proof weakens the case for conversion, making it hard to justify action without perfect knowledge.  

  4. **Net positive + Densely settled baseline + Land-sparing works + Burden of proof on preservers**  
     (Path: B → B3 → B3a, with burden inverted)  
     - *Unoccupied*: **Unexplored**. Burden typically falls on converters; flipping it is coherent but politically untenable.  

