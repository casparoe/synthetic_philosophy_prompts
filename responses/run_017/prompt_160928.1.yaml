  - **Leaf 5 (Per Capita Conservationist)** and **Leaf 8 (Status Quo Preservationist)** cannot be fully separated if a habitat has positive net welfare but conversion would increase per capita suffering. The tree prioritizes net welfare first to avoid overlap, but real-world cases may blur these positions.  

