answer: |-
  **Brainstorm Sketch:**  
  - *Fortuna:* Not pure chance but *unmanaged* uncertainty. 5% isn’t "fate"—it’s the tax on laziness. Your *virtù* must compress this risk.  
  - *Rashness vs. Prudence:* Rashness wins against indecisive foes. Here? Your rivals *will* react instantly. Haste isn’t bold; it’s suicide.  
  - *Treaties:* Useless as primary dikes. Men keep faith only if forced. A treaty without teeth is sand.  
  - *Endogeneity:* Fortuna *is* other princes’ *virtù*. Your reputation for audacity *is* the floodwall—if credible.  
  - *Irreversible Ruin:* His system assumes recovery is possible. Total annihilation negates *gloria*, *stato*, everything. He’d treat 5% as intolerable—a failure of *virtù*.  
  - *Probability:* He’d despise the math. Probabilities are for merchants. Princes act on necessity, signs, and iron nerves.  

  ---
  **MEMORANDA: TO THE PRINCE OF THE SIGNORIA**  
  *(As Machiavelli would draft it, circa 1513)*  

  **Subject:** The Arno Gambit—On Seizing Advantage Without Drowning the World  

  **Year One:**  
  Move, but *not* to field the weapon. Your first act is to make the 5% risk *your enemy*, not Fortuna’s whim. How?  
  - **Build visible, terrifying containment.** Dig metaphorical canals: pour gold into bunkers, show rival spies your "iron rooms," stage demonstrations of failsafes. Make them *see* you preparing so thoroughly that hesitation seems wise. Why? *You compel their patience by making your restraint look like strength.*  
  - **Demand a treaty—but only after you’ve shown the knife.** Declare a public congress on containment protocols. Frame delay as *your invention*, not concession. But—crucially—**sabotage it quietly.** Ensure it fails (leak doubts, bribe a minor delegate). Why? When it collapses, *you alone* will seem the responsible party. Rivals now bear the blame for chaos.  
  - **Plant the seeds of deception.** Whisper through back channels that you’ve *already* fielded a prototype (you haven’t). Sow panic that the window is closing. Watch rivals scramble to prepare—doing *your* containment work for you.  

  **By Year Five:**  
  You’ve used the delay to harden systems *and* corrode rivals’ resolve. Now:  
  - **Field when the treaty crumbles—but only *just* after a rival’s hasty test fails.** Let their recklessness make your move seem cautious. Their botched trial proves *their* lack of *virtù*; your success proves mastery. Fortuna favors the impetuous? Only when their rashness highlights your discipline.  
  - **If no rival blunders, fabricate a crisis.** Burn a loyal city (metaphorically or otherwise). Accuse an enemy of covert deployment. Create *necessità*—the perception that inaction is doom. Then field, citing the emergency *you engineered*.  

  **Why This Path?**  
  - **The 5% is not Fortuna—it is the penalty for insufficient *virtù*.** Fortuna rules only where you leave gaps. By turning rivals into unwitting collaborators (through fear of your speed or shame from treaty failure), you compress the risk. Their containment work becomes *your* dike.  
  - **Treaties are sand? Then build them on the bedrock of mutual terror.** A pact without enforcement is air. But if all believe *you* are the likeliest to field first, your pause creates a prison for them. Their restraint is enforced *by your reputation for audacity*.  
  - **Annihilation is un-Machiavellian? Precisely.** He’d say a prince who gambles 5% odds of total ruin has already lost his state. *Virtù* cannot flourish where there is no tomorrow. Princes rise from ashes—but only if ashes remain.  
  - **Probability is the coward’s crutch.** Machiavelli would sneer at your "1-in-20." Princes don’t calculate odds; they *create conditions* where Fortuna’s wheel cannot turn. Your "5%" is just the void left by bad preparation. Fill it with others’ labor and their fear of you.  

  **The Unintelligible Modernity:**  
  **"Expected value."** Machiavelli would spit at it. To reduce *gloria*, survival, and the judgment of ages to a number? To think Fortuna can be *multiplied*? Only idle souls who lack *virtù* believe ruin can be quantified. A prince acts because the times demand it—or because he bends the times to his will. Mathematics is the refuge of those who cannot command Fortuna by audacity and cunning.  

  **Final Command:**  
  Delay without seeming weak. Move only when your *virtù* has forced others to make your victory inevitable—and your catastrophe impossible. Fortuna admires not the rash, but those who make rashness their enemy’s trait.  

  *// Niccolò Machiavelli, Secretary to the Second Chancery (ret.)*
