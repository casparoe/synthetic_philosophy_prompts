prompt: |-
  I've been reading rationalist blogs and forums for something like fifteen years, and for the last four I've convened a small, semi-anonymous discussion group — eight or nine of us, mostly engineers, two physicians, one game designer — that meets monthly to take apart a single live disagreement rather than to work through a syllabus. Last month's got away from us and I want to hand it to you in a more precise form than we managed. We have a standing norm that everyone reads the host's paper and sends written comments before the meeting. One member, R., didn't comment on M.'s paper. M. — who has, by common consent, the worst commenting record in the group — sent a long message to the group chat about it. R. replied that M. of all people had no standing to say it. M. replied that this was textbook tu quoque and that her own record has no bearing on whether R. breached the norm. A third member, S., said the tu quoque framing was the category error and that R. was closer to right: standing is a legal notion, locus standi, and the whole point of standing doctrine is that a party can be right on the merits and still not be the party entitled to press the claim in that forum, because standing isn't about what the defendant did but about who may invoke the tribunal's power. A fourth member said the courtroom was simply the wrong source domain: blame is not an institutional act, there is no judge to dismiss the suit, and talk of standing is just a polite dialect for telling someone to shut up. Halfway through the evening we also noticed something that seemed to cut against R.: on the legal test M. is the injured party, and the injured party normally has the best standing of anyone in the room, which is not at all the conclusion R. wanted. R. then amended his case by appeal to the clean-hands maxim instead, so that what is withheld from M. is not the hearing but the remedy.

  What I want from you is an audit of the analogy rather than a verdict on the etiquette, and I'd rather you argued it than pointed me at a literature — we have no library access and I don't want a reading list. Please do the courtroom mapping explicitly, as a table: who is the plaintiff, the defendant, the tribunal, the injury, the remedy, the motion to dismiss, the appeal; and then, for R.'s amended version, what clean hands maps onto and whether the thing being denied is the claim, the remedy, the hearing, or the uptake. Then tell me which features of a court the analogy quietly imports into ordinary blame that blame doesn't have — a third party with authority to rule on standing, a binary rather than graded entitlement, a scarce institutional good being allocated, blame as something done to a defendant rather than said to an addressee or overheard by an audience — and sort the disanalogies into the ones that matter for the work R. wants the analogy to do and the ones that don't. I especially want to know whether the conclusion R. is using it for (that he may properly answer the criticism by pointing at the critic, without ever addressing whether he skipped the reading) survives once the disanalogies are on the table, or whether the analogy was doing all the work and collapses into either you may not raise this or merely I don't have to listen to you from her.

  Two more things, if you'll indulge them. First, one member proposed swapping the courtroom for the Austin-style speech-act picture: hypocritical blame is not false but infelicitous, a misfire or an abuse rather than an error — a void utterance, like a sentence pronounced by someone with no authority to pronounce it — so that the hypocrite's criticism says something true while failing to come off. Give me that mapping too, and tell me whether it carries R.'s conclusion any better than the legal one does, or whether it just relocates the same problem: if there is no institution, there is no one with the standing to declare the utterance void, and hearers will update on its content anyway. Second, mostly to be contrary, I floated a different model and I'd like it stress-tested rather than indulged: treat standing as a budget rather than a jurisdiction. Blaming draws on a store built up by compliance with the norm in question; the hypocrite is not disqualified but overdrawn, so the criticism still transmits its content while costing her credibility she has already spent, and further blame bounces. On that model, does it follow that reformed offenders regain standing disproportionately, that a bystander who never faced the temptation has infinite standing, that blaming the absent or the dead is costless, and that the debt is discharged by reform or by accepting blame oneself? And does it license an institution one of us half-seriously proposed — a blame escrow, where you file the criticism now and it is released to its target once you have fixed your own instance? Finally, tell me what a hypocritical criticism actually asserts: whether alongside you did wrong it carries a comparative claim about the speaker's own position that makes it self-undermining rather than merely ill-mannered, and what a rational target should do with it — whether the critic's hypocrisy is evidence about the norm's stringency, evidence about the critic's reliability, or noise, and whether the familiar observation that the people keenest to enforce a norm are often the ones who struggle with it should change the answer. If there is a better analogy than any of the three on the table, I'd like to hear it, with the correspondences stated.
reasoning: |-
  Hmm, the user presents an intricate case study from their discussion group about the ethics of hypocrisy in criticism. They want me to analyze three analogies (legal standing, speech-act theory, and credibility budgeting) without delivering moral judgments. 

  First, the core conflict: M calls out R for violating group norms, R responds by pointing to M's own poor record, and the group gets tangled in whether this is valid tu quoque or something deeper. The user wants forensic dissection, not resolution. 

  Noticing several layers here: the immediate dispute about group etiquette (which I'm to avoid), the conceptual question about whether hypocrisy invalidates criticism, and the meta-question about how analogies shape ethical reasoning. The user's background suggests they value precision – they've been in rationalist spaces for 15 years and run a structured discussion group. 

  For the legal analogy mapping: The plaintiff is M (injured by norm violation), defendant is R (accused of not commenting), tribunal is the group. Injury is wasted preparation time, remedy is apology/commitment. Standing dismissal would mean M can't raise the issue, while clean hands would mean M can't receive remedy due to own misconduct. Key disanalogies jump out: no real judge, blame isn't binary, and the "injury" is diffuse. 

  On speech-act theory: Hypocritical blame as infelicitous utterance. But without institutional authority, who decides felicity? And crucially, listeners still absorb the factual content even if they discount the speaker. This might actually undermine R's position more than help it. 

  The credibility budget model is fascinating. Blaming costs social capital earned through compliance. But then: Wouldn't perfect compliers have infinite credit? Could you "prepay" blame via reform? The escrow idea is clever but practically unworkable – emotions don't time-stamp well. 

  Biggest insight: All analogies struggle with the same hole – in informal groups, there's no authority to enforce these frameworks. The power dynamics are peer-to-peer. 

  What the user might really need: A way to diagnose why this analogy debate stalled their group. I suspect it's because they're missing the underlying conflict – R likely felt attacked and deflected, while M weaponized logic to avoid acknowledging her own pattern. The models are proxies for emotional legitimacy. 

  Final thought: The best analogy might be thermodynamic rather than legal. Criticism as energy transfer requiring conductance (credibility) and potential difference (moral gap). But introducing a fourth model might overcomplicate... better to show how existing ones leak.
answer: |-
  ### Legal Analogy Audit  
  **Courtroom Mapping Table:**  

  | Legal Element          | Correspondence in Group Context                  |  
  |------------------------|-------------------------------------------------|  
  | **Plaintiff**          | M. (initiates complaint about norm violation)   |  
  | **Defendant**          | R. (accused of skipping comments)               |  
  | **Tribunal**           | The group (implicit collective authority)       |  
  | **Injury**             | Wasted effort by M./group; erosion of norms     |  
  | **Remedy**             | R. apologizing/committing to future compliance  |  
  | **Motion to Dismiss**  | R.’s claim that M. lacks standing to complain   |  
  | **Appeal**             | Group discussion refining the argument          |  
  | **Clean Hands Maxim**  | Maps to M.’s *own history* of poor commenting   |  
  | **What is Denied?**    | *The remedy* (not the hearing or claim validity)|  

  ---

  ### Key Disanalogies & Implications  
  **Features Imported from Courtroom (That Blame Lacks):**  
  1. **Third-Party Authority**: Courts have judges; groups lack neutral arbiters. Standing is adjudicated *by the accused* (R.), not an impartial body.  
  2. **Binary Entitlement**: Legal standing is all-or-nothing; social "standing" is gradient (e.g., M.’s history reduces her *credibility*, not her *right to speak*).  
  3. **Scarce Institutional Good**: Court access is rationed; group discussion is non-rivalrous (M.’s complaint doesn’t block others’ input).  
  4. **Blame as Formal Act**: Legal blame imposes sanctions; social blame is persuasive speech without coercive power.  

  **Impact on R.’s Argument:**  
  - R.’s "standing" objection collapses because:  
    - No tribunal exists to dismiss M.’s complaint.  
    - M. *is* the injured party → her claim isn’t jurisdictionally void.  
  - **Clean-Hands Amendment**: Denying only the *remedy* fails because:  
    - Social "remedies" (e.g., R. apologizing) aren’t court-ordered; they’re voluntary.  
    - M.’s hypocrisy makes her demand for contrition *less persuasive*, but doesn’t void R.’s obligation.  
  **Conclusion**: R.’s analogy smuggles in institutional authority that doesn’t exist. His retort reduces to "I don’t have to listen to you" or "Your hypocrisy makes your demand unconvincing" — **not** "You may not raise this."  

  ---

  ### Speech-Act Model (Austin-Style)  
  **Mapping:**  
  - **Hypocritical Blame**: A speech act with defective *felicity conditions*.  
  - **Infelicity**: Like a judge sentencing without legal authority → the utterance "misfires."  
  - **Assertion Content**: "R. violated the norm" may be *true*, but the act of blaming is void.  

  **Does It Work for R.?**  
  - **Pros**: Explains why hypocritical blame *feels* illegitimate even if true.  
  - **Cons**:  
    - No "institution" to declare it void → hearers still process the content.  
    - In groups, the *audience* decides felicity (not an authority).  
    - R.’s reply ("You can’t say this") *itself* requires authority he lacks.  
  **Verdict**: Relocates the problem but fails for the same reason — no institutional backdrop. It supports "this criticism lacks force" more than "it cannot be uttered."  

  ---

  ### Credibility Budget Model (Stress Test)  
  **Premise**: Standing = credit built via compliance; hypocrisy = deficit spending.  

  **Implied Questions & Answers:**  
  1. **Reformed offenders regain standing disproportionately?**  
     → *Yes*: Reform "deposits" credibility; redemption narratives amplify standing.  
  2. **Bystander has infinite standing?**  
     → *No*: Non-participants lack "currency" (compliance is irrelevant if you’ve never faced the norm).  
  3. **Blaming the absent/dead costless?**  
     → *Yes*: No social capital spent if the target can’t retaliate or the audience doesn’t penalize it.  
  4. **Debt discharged by reform/accepting blame?**  
     → *Reform*: Yes (credibility replenished). *Accepting blame*: Partial credit (shows accountability).  
  5. **Blame Escrow Viable?**  
     → *No*: Blame’s efficacy depends on timeliness and context. "Stored" blame decays and may misfire if circumstances change.  

  **Conclusion**: This model frames hypocrisy as a *persuasive disadvantage*, not a gag order. R. could say: "Your criticism is less credible due to your own record," but must still address the *merits* (did he skip the reading?).  

  ---

  ### What Hypocritical Criticism Asserts  
  1. **Content**: "You violated norm X" + *implied* "I am compliant with X."  
  2. **Self-Undermining?**: The *implied claim* is false, making the act incoherent if exposed.  
  3. **Rational Target Response**:  
     - **Evidence about norm stringency**: Low (hypocrisy doesn’t make the norm less valid).  
     - **Evidence about critic’s reliability**: High (they may misjudge the norm’s application).  
     - **Noise**: Only if the critic’s behavior is irrelevant to the norm (rare).  
     - **"Keen enforcers struggle" adjustment**: This *increases* the critic’s reliability (they know the norm’s difficulty) but *decreases* their credibility (they’ve failed themselves).  

  ---

  ### Best Alternative Analogy: **Debate Club Rules**  
  - **Correspondences**:  
    - Plaintiff = Debater raising a point.  
    - Standing = Adherence to decorum (e.g., no personal attacks).  
    - Remedy = Concession from opponent.  
    - Disanalogy Advantage: Explicit rules but no formal sanctions; persuasion depends on audience buy-in.  
  - **Outcome for R.**: M.’s hypocrisy violates decorum, weakening her position — but R. still loses if he dodges the substance.  

  **Final Verdict**: No analogy fully rescues R.’s evasion. Hypocrisy undermines *credibility*, not the *right to speak*. Rational response: "Your point about my lapse might be valid, but your own record makes this demand unpersuasive. That said, here’s why I skipped the reading..."
