prompt: |-
  I'm a backend engineer -- mostly Go, zero philosophy training beyond whatever seeps in from podcasts -- and I got completely nerd-sniped by an argument at work that I can't shake. We were writing up a postmortem for an outage where someone noticed a bad config during a routine deploy and just... didn't fix it, and we spent an hour arguing about whether "saw it and left it" is really a different kind of thing from "pushed the bad config in the first place." Everyone on the team had strong gut feelings and not one of us could say what the underlying rule was supposed to be. So here are my own verdicts on a pile of cases, and I want to know if there's a single principle that gets them or whether I'm just holding two incompatible intuitions at the same time. (1) I grab a kid and hold his head under the bathtub water until he drowns: monstrous, and I did it. (2) I walk in, the kid is slipping under, I could grab him with zero risk to myself, and I stand there: still monstrous, but definately less bad than (1), and I can't say why. (3) A doctor unplugs a ventilator from a patient who was never going to recover, at the family's request: fine, maybe even kind. (4) A doctor never hooks that same patient up in the first place, same prognosis, same request: also fine -- and here's what bugs me, it feels *exactly* as fine as (3), so the doing/allowing distinction seems to do no work at all here even though it obviously does work in (1) vs (2). (5) A lifeguard watches a kid drown in the shallow end and doesn't move: to me that's almost as bad as (1). (6) A random guy on the beach does the exact same nothing, same kid, same everything except the job title: way less bad than (5), even though the physical events are identical. (7) I never signed up for the organ donor registry and a neighbor dies needing a kidney: nobody's fault, zero blame. (8) I did sign up, I matched, and I ghost the hospital the morning of the surgery: I feel like that's genuinely bad, not just a little bad -- but it's still technically an omission, so if you tell me doing and allowing are morally different, explain this one too.

  Then the tech-flavored ones, which are the ones I actually care about. (9) A monitoring service I wrote suppresses a critical alarm, a patient dies: I feel worse about myself here than in (10), where I inherited the same bug, spotted it during a routine deploy, and didn't push the one-line fix that was already sitting in my branch. (11) I set up a cron job months ago that deletes a life-critical alert rule at midnight; I go on vacation and never disarm it, and the rule dies at midnight while I'm asleep on a beach somewhere. (12) Same system, but the vendor shipped the opposite default: the rule stays on only if I log in every night and re-arm it, and one night I don't. (13) A patient's life-support device runs on software my company owns; the license lapses and I could renew it with one click for twenty bucks, and I don't. My gut says (11) is killing, (12) is letting die, and (13) is somewhere in between -- but (11) vs (12) looks like it might just be about which way the vendor happened to set the default, and hanging blame on that feels totally arbitrary, like the morality would flip if someone had picked a different config value.

  So: is there one principle here -- something about who initiates a causal sequence versus who fails to stop one, or about what counts as the normal or default baseline, or about duties and roles and who had the easy option -- that gets all thirteen? I want the clause-by-clause version, with which of my cases motivates each clause, and I want you to be straight with me about which of my verdicts it can't accommodate and which ones I should just drop. Don't hand me a slogan like "killing is worse than letting die," because (3) vs (4) already breaks that for me and (5) vs (6) breaks it in the other direction. And if your conclusion is that the doing/allowing line isn't actually doing any real moral work and something else is, say that explicitly, tell me what that something else is, and tell me what evidence or case would show me I'm wrong. The two I keep going back and forth on: my team ships a change that removes a safety check because the check was slow and expensive, and a user dies as a result -- I genuinely can't tell whether that's a (1) or a (2); and a hospital moves the only working ventilator off a patient the model says has a week left and onto one who needs it right now, no malice, pure triage -- fine, or not, and why. I'd rather have the principle than the individual answers, but give me both.
reasoning: |-
  Okay, let's tackle this step by step. The user is a backend engineer with no formal philosophy training, trying to resolve a moral dilemma from a postmortem about whether inaction is as bad as action in causing harm. They've listed 13 scenarios with their gut reactions and want a unified principle that explains all of them, especially the tech-related cases.

  First, I need to understand the core issues. The user is struggling with the doing/allowing distinction because it doesn't consistently hold across all cases. For example, in scenarios (1) and (2), actively drowning a kid vs. not saving them both feel wrong, but (1) feels worse. But in medical cases like (3) and (4), unplugging vs. not connecting the ventilator feel equally acceptable, making the doing/allowing distinction seem irrelevant there. Then there are role-based differences: a lifeguard (5) not acting is worse than a bystander (6) doing nothing. The tech scenarios (9-13) add complexity where defaults and system designs blur the line between action and inaction.

  The user wants a principle that accounts for duties, role responsibilities, intentions, and system defaults. They mentioned causal sequences, baseline norms, and ease of intervention. The challenge is reconciling cases where inaction is nearly as bad as action (like the lifeguard) versus where it's not (the bystander). Also, the organ donor case (7 and 8) shows that commitments create duties where omission becomes blameworthy.

  Key philosophical concepts here include the doctrine of doing and allowing, role obligations, and the distinction between positive and negative duties. But these need to be synthesized into a coherent framework. The user's examples highlight that role-based duties (lifeguard, doctor, organ donor registrant) significantly impact moral judgment. Also, system design and defaults (like in tech scenarios) affect whether an omission is seen as allowing harm or causing it.

  For tech cases (11-13), the default settings matter. If deleting a rule is the active step (11), it's seen as causing harm, whereas not re-arming a rule that requires daily action (12) is allowing harm. But the user feels this is arbitrary since the morality hinges on vendor defaults. This suggests that the baseline or expected norm influences moral judgment. 

  The user's unresolved cases: shipping a change that removes a safety check might be seen as active harm (like 1), whereas triaging a ventilator in a hospital could be permissible if based on need. The principle needs to address intent, role, and necessity.

  Putting it together, the underlying principle combines role duties, the distinction between positive/negative obligations, and the baseline expectation. Harm through action is worse when violating a negative duty (don't harm), but inaction is blameworthy when there's a positive duty (to help) based on role or explicit commitment. System defaults set the baseline; changing from safe to unsafe is action, while not maintaining a fragile state is inaction. 

  This explains why the lifeguard's inaction is bad (role duty) vs. bystander. Medical cases are fine because no duty to prolong life against wishes. Organ donor registration creates a duty, so ghosting is bad. Tech cases: suppressing an alarm (action) is worse than not fixing a known bug (inaction with duty), and defaults define whether maintaining the status quo is safe or not.

  The user should test this principle by considering cases where duties conflict or system baselines are ambiguous. For example, if the safety check removal was part of optimizing a system, but the team knew the risks, it's active harm. Triage is permissible if resources are scarce and the decision is need-based, not arbitrary.
answer: |-
  Here's a unified principle that reconciles your 13 cases, built from philosophical concepts (without jargon) and focused on **role-based duties, causal responsibility, and baseline expectations**:

  **The Principle:**  
  *Moral blame depends on:  
  (A) Your specific duty to prevent harm (based on role, commitment, or unique capacity),  
  (B) Whether your action *creates a new threat* versus *failing to interrupt an existing threat*, and  
  (C) Whether the system expects *active maintenance* to sustain life/safety.*

  ---

  ### Clause-by-Clause Breakdown with Your Cases:
  1. **Duty Matters More Than Action/Omission**  
     Your cases (5) vs (6) (lifeguard vs. bystander) and (8) (organ donor ghosting) show that **role/commitment creates a positive duty to act**.  
     - Lifeguard (5): High duty → Inaction = severe blame.  
     - Bystander (6): No duty → Inaction = minimal blame.  
     - Organ donor (8): Commitment creates duty → Ghosting = blameworthy.  
     *Motivated by:* (5), (6), (8).

  2. **Creating a New Threat vs. Failing to Stop an Existing One**  
     Distinguishes (1) vs (2) (drowning vs. not-saving):  
     - Actively drowning (1): *You created the threat*. Maximum blame.  
     - Not saving (2): Threat existed independently. Less blame (unless duty applies).  
     *Motivated by:* (1), (2), (9) (suppressing alarm *creates* danger).

  3. **Baseline Expectations Define "Normal" Safety**  
     Resolves (3) vs (4) (unplugging vs. not-hooking-up) and tech defaults (11/12):  
     - Ventilator: The "safe" baseline is *not being on life support*. Not hooking up (4) maintains baseline; unplugging (3) changes it *but is justified by consent/prognosis*. Both fine.  
     - Tech (11): System expects rules to *persist unless deleted*. Cron job *creates* a new threat (deletion) → Blameworthy.  
     - Tech (12): System expects rules to *expire unless renewed*. Not renewing *fails to maintain* → Less blame (but duty may apply).  
     *Motivated by:* (3), (4), (11), (12).

  4. **"Easy Rescue" Amplifies Blame for Inaction**  
     When intervention is trivial and low-risk, inaction is worse (even without explicit duty):  
     - (2) (not saving drowning kid): Zero risk to you → Blameworthy despite no role.  
     - (13) ($20 license renewal): One-click fix → Highly blameworthy if you had duty (e.g., sysadmin).  
     *Motivated by:* (2), (13).

  ---

  ### Your Verdicts Explained & Exceptions:
  - **(1) vs (2)**: (1) creates threat (B), (2) fails easy rescue (D) → (1) worse.  
  - **(3) vs (4)**: Both align with baseline (C) and consent → Equal, as you felt.  
  - **(5) vs (6)**: Duty (A) makes (5) worse.  
  - **(7) vs (8)**: Commitment creates duty (A) → (8) blameworthy.  
  - **(9) vs (10)**: (9) *creates* threat (B), (10) fails to fix existing threat → (9) worse.  
  - **(11) vs (12)**: Defaults define baseline (C) → (11) creates threat, (12) fails to maintain. **Your intuition is right: blame shouldn’t hinge on vendor defaults.** The real issue is *whether the system design made harm inevitable without heroic effort*. If (12) required daily re-arming, it’s a flawed design – your blame decreases (but doesn’t vanish if duty exists).  
  - **(13)**: Duty + easy rescue (A+D) → Blameworthy if it’s your job.

  **Unresolved Cases:**  
  - **Removing a safety check for performance**: This *creates a new threat* (B) by removing protection. Closer to (1) than (2). Duty (A) as engineer amplifies blame.  
  - **Ventilator triage**: Permissible if:  
    a) It’s true triage (resource scarcity),  
    b) Based on medical need (not arbitrary),  
    c) No duty to *this specific patient* is violated (e.g., not their assigned doctor).  
    Aligns with (3): altering baseline is justified by greater need.

  ---

  ### Why "Doing vs. Allowing" Fails:
  - It collapses in medical contexts (3)/(4) and tech defaults (11)/(12). **Duty and baselines do the real work.**  
  - **Evidence**: If you remove duty/role (e.g., lifeguard quits 5 mins before shift) or alter baselines (e.g., ventilator self-disconnects daily unless reset), blame shifts without changing action/omission.

  ### The Unified Framework in Practice:
  For your postmortem:  
  - **"Saw it and left it"** is blameworthy if:  
    - There was a *duty* (their role?),  
    - It was an *easy fix* (low effort?),  
    - The system relied on *active maintenance* (not "set and forget").  
  - **"Pushed bad config"** is worse because it *created* the threat.

  **Final Principle:**  
  *Blame scales with (1) strength of duty, (2) ease of intervention, and (3) deviation from expected safety baselines. Action vs. omission only matters as a proxy for these.*  

  This gets all 13 cases, exposes design flaws in (11)/(12), and makes your team’s argument tractable. If you test nothing else, debate: *"Did the engineer’s choices move the system away from its ‘safe’ baseline, or fail to restore it?"* That’s the core.
