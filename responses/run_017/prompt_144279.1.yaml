prompt: |-
  I used to be a research assistant for an archaeologist — call her M — who is writing a book on the c-word, and I am now doing a master's and drafting a chapter that leans on her framework, so I want to pin down what rule she is actually running before I build anything on it. Her verdicts so far, as she has given them in talks and in the two chapters she has let me read: the Mycenaean palace world around 1200 BCE, collapse without hesitation, palaces and script and long-distance exchange all gone and nothing on that scale rebuilt for centuries; the Classic Maya southern lowlands, collapse, with her line that what ended was a political system rather than a people, since Maya people are obviously still there; Rapa Nui, not a collapse, she thinks the ecocide story is one we told about them and that the statue cult gave way to a different one; Norse Greenland, collapse, even though the last scrap of writing from there is a wedding in the early 1400s and after that just silence; the western Roman Empire, not a collapse, too slow and too much carried over; the Inca, also not a collapse, because conquest is something done to you; the Mesa Verde region around 1300, not a collapse, people relocated and Pueblo descendants describe it as a migration rather than an end; and the Soviet Union in 1991, collapse, on the grounds that what disappeared was the future people could imagine. I cannot get the Rome verdict and the USSR verdict to sit together under any single rule I try, since Russia kept the archives and the seat and most of the ministries, and the Inca and Greenland rulings seem to undercut her own conquest line, which makes me think the real rule is something other than what she says out loud.

  The case she has not ruled on, which is meant to be the last chapter: a coastal town of about eight thousand that over roughly thirty years, with large majority support at every referendum, moves most of its housing and businesses two kilometres inland after a bad storm surge, abandons its port, lets the old site return to tidal marsh, merges its municipality into a neighbour an hour away, and loses its maternity ward and its local paper to bigger places further off. Population is slightly up, incomes are up, nobody who wanted to stay was forced out, the town is unusually pleased with itself, and it has a published adaptation plan running to 2050. Structurally it is clearly less complex than it was: fewer institutions, fewer specialised roles, less energy and fewer goods flowing through it, and an archaeologist looking at the debris in five hundred years would call it a collapse without thinking twice. So what does she say, and what should she say if she wants to be consistent with herself? I can see three or four rules that fit her track record about equally well — a straight complexity-loss rule, a rule about whether the people living through it experienced catastrophe, a rule about whether the participants themselves narrate an ending, and something stranger about the time horizon over which a community can still plan and commit — and they come apart sharply on this town, so tell me which one is really doing the work in her verdicts, what each predicts here, which you would bet on and why, and which is the closest analog among her precedents: the relocations, or the abandonments. Then the thing I actually need: name one further case that would separate the surviving rules from each other. My candidate is a case where nothing material falls apart — all the buildings and bureaucracies intact — but everyone involved says their world ended, and I want to know whether that is the right probe or whether I am missing a better one. And one more thing I keep going in circles on with my flatmate: if a future archaeologist with only the pots and the foundations would say collapse, and the people living through it would not, is collapse for her something that happens to a society or something that happens to evidence about one?
reasoning: |-
  Okay, the user is working on their master's thesis and needs to understand the underlying rule their former advisor, M, uses to classify societal collapses. They've provided M's verdicts on several historical cases and a new coastal town scenario where the town voluntarily relocates inland. The user is struggling to reconcile M's rulings, especially between Rome (not collapse) and the USSR (collapse), and between Inca (not collapse) and Greenland (collapse). They need to identify the consistent principle M uses, apply it to the coastal town, and find a case to test competing interpretations.

  First, I need to parse M's pattern. The user lists several cases: Mycenaean palaces (collapse), Classic Maya (collapse but people remain), Rapa Nui (not collapse), Norse Greenland (collapse), Western Roman Empire (not collapse), Inca (not collapse), Mesa Verde (not collapse), and USSR (collapse). The inconsistencies are apparent. For Rome, despite significant changes, it's not a collapse because things carried over. But the USSR is a collapse even though Russia retained institutions. Similarly, the Inca isn't a collapse because it's conquest, but Greenland is, despite being environmental and social pressures.

  The user suggests possible rules: complexity loss, lived catastrophe, narrative of ending, or future planning horizon. Let me test each against the cases.

  Complexity loss: Mycenaean, Maya, Greenland show reduced complexity. But Rome also had complexity loss (loss of central administration, infrastructure) yet was not a collapse. Rapa Nui, which M says is not a collapse, might have had some complexity reduction but the narrative changed. The coastal town reduces complexity but voluntarily, so this rule might call it collapse, but M's other verdicts don't align.

  Lived catastrophe: Mycenaean and Greenland likely involved suffering. Maya political collapse, but people survived. Rome's decline was prolonged, not sudden catastrophe. USSR dissolution was relatively peaceful in some aspects but involved loss of future vision. The coastal town had no catastrophe, so this rule would say not collapse. But M's Greenland ruling includes a wedding record, suggesting decline, not necessarily immediate catastrophe. This might not fit.

  Narrative of ending: Maya as political end, USSR as end of imagined future. Mesa Verde is migration, not collapse, per descendants. Inca as conquest, not their narrative. The coastal town sees it as adaptation, not ending. This could align: if the people don't narrate an ending, it's not collapse. But for Greenland, the last record is a wedding, then silence. Did they narrate an end? Unclear. Rome's narrative might be continuity through the Church, etc. This rule might work if Greenland's silence is seen as an end narrative.

  Future planning horizon: USSR lost the ability to imagine a future. Mycenaean, Maya, Greenland lost long-term planning capabilities. Rome transitioned into medieval kingdoms that did plan. Inca under Spanish rule still had structures. The coastal town has a plan till 2050, so future planning exists. So this rule might say not collapse. But does this fit all cases? Rapa Nui's shift in cults might imply a change in planning, but M says not collapse. Mesa Verde relocated voluntarily, maintaining planning. This could be consistent.

  Looking at the coastal town: population up, incomes up, voluntary, adaptation plan. If M uses narrative or future planning, it's not collapse. If complexity loss, it might be. The user needs to predict M's verdict. The closest analog is Mesa Verde: relocation, not collapse. So M would likely say not collapse.

  For the test case: the user proposes a society where nothing material changes, but people feel their world ended. For example, a cultural or ideological shift without structural change. If M uses narrative, this would be collapse. If complexity loss, not. The user's test case is good. Another test could be a slow decline without a clear endpoint, like the Roman Empire, which M already ruled not collapse.

  The user's deeper need is to apply M's framework consistently in their thesis. They might also want to critique or understand the subjectivity in collapse theory. The coastal town case challenges traditional archaeological views, emphasizing lived experience over material evidence.

  Recommended test case: a society that voluntarily simplifies, like the Amish, but with a narrative of continuity. Or a sudden loss of ideology without structural change, like a cult disbanding but members continuing daily life. This would separate narrative from complexity loss.
answer: |-
  Based on M's pattern of verdicts, her core rule isn't about material complexity loss, catastrophe, or even conscious narration *alone*. It centers on **the irreversible termination of a *specific socio-political project* and its associated future horizon.** Collapse happens when the fundamental organizing principle, identity, or "world" (in the existential sense) that defined the society ceases to exist *as a viable, continuous entity*, regardless of the fate of the population or the speed of change. Conquest usually disrupts this continuity violently, *unless* the conquered project retains a core identity and trajectory (like Rome evolving into medieval kingdoms/church).

  **Dissecting M's Rule:**

  1.  **Termination of the Project:** It's not just about the *people* surviving (Maya, Rapa Nui) or *some* institutions carrying over (Rome, Inca). It's about whether the *core political/cultural project itself* ended definitively.
      *   *Mycenaean:* The palatial system/ideology ended.
      *   *Classic Maya:* The divine kingship/lowland city-state system ended (even if Maya people/culture persisted elsewhere).
      *   *Norse Greenland:* The European Christian settlement project ended (people starved/left, no continuation).
      *   *USSR:* The communist project and its imagined future ended abruptly.
      *   *Western Rome:* The imperial project transformed (e.g., into barbarian kingdoms, the Papacy, Byzantium) but key elements (law, religion, elite culture) provided continuity for a *different* future. The *project* evolved, didn't *end*.
      *   *Inca:* The Inca imperial project was violently terminated *by external conquest*, replaced by a Spanish project. No internal evolution or managed transition.
      *   *Mesa Verde:* The Ancestral Puebloan communities relocated and continued their cultural/political project elsewhere (as affirmed by descendants). The *project* migrated, didn't end.
      *   *Rapa Nui:* The statue-building cult transformed into the Birdman cult. The core Polynesian settlement project and identity persisted *through* the change.

  2.  **Irreversibility & Non-Viability:** The project isn't just paused; it's gone and cannot be revived in its original form or context. No one in later centuries seriously tried to rebuild a Mycenaean palace-state in the same way, restart Norse Greenland, or revive the USSR. Maya divine kingship didn't return to the southern lowlands.

  3.  **Future Horizon:** Closely tied to the project. When the project ends, the specific future it envisioned vanishes (USSR's communist utopia, Norse Greenland's sustainable European outpost, Classic Maya's cyclical kingly order). This is why the USSR verdict ("disappearance of the future people could imagine") is key. Rome's institutions provided a framework for *new* futures.

  4.  **Experience/Narration:** While not the primary driver, M seems to give weight to whether the *participants* experienced or narrated it as an ending *of their world* (Maya political elite, Norse Greenlanders as their project failed, Soviets in 1991). Conversely, the lack of such a narrative (Mesa Verde descendants, Rapa Nui transformation) or its replacement by a narrative of continuity/transformation (Rome) signals non-collapse. Conquest (Inca) forces an end externally.

  **Applying the Rule to the Coastal Town:**

  *   **M Would Say: NOT A COLLAPSE.**
  *   **Why?**
      *   **Project Continuity:** The core project – a thriving coastal community – wasn't terminated. It was *adapted* proactively to changing environmental realities. The goal of community survival and well-being remained paramount.
      *   **Managed Transition:** The change was deliberate, planned, and supported by the community itself via referendums. It was a strategic relocation/consolidation, not a failure or disintegration.
      *   **Future Horizon:** They *have* a published adaptation plan running to 2050. They are actively envisioning and managing their future within a transformed but continuous project. Their world didn't end; they moved it.
      *   **Narration:** They are "unusually pleased with themselves." This is narrated as a success story of adaptation and resilience, not an ending.
      *   **Closest Analog:** **Mesa Verde.** Voluntary relocation/consolidation to ensure survival and continuity of the community project, affirmed by the participants' positive narrative. Complexity loss is a *consequence* of adaptation, not evidence of collapse *under this rule*.

  **Predictions of Other Rules & Why They Don't Fit as Well:**

  *   **Complexity-Loss Rule:** Predicts COLLAPSE. Fewer institutions, roles, energy flows. Archaeologist in 500 years sees debris -> collapse. *Problem:* Ignores agency, continuity of community/project, and positive lived experience/narrative. Contradicts Mesa Verde, Rapa Nui, even Rome verdicts.
  *   **Lived Catastrophe Rule:** Predicts NOT COLLAPSE. No catastrophe; population/income up, no one forced out. *Problem:* Doesn't explain Norse Greenland (slow attrition, last record is a wedding) or USSR (relatively peaceful dissolution for most) being collapses. Might struggle with gradual collapses like Mycenaean.
  *   **Narrative of Ending Rule:** Predicts NOT COLLAPSE. Town narrates it as adaptation/success. *Problem:* This rule *alone* struggles with cases where records are lost (Norse Greenland - silence *is* the evidence of ending? Mycenaean - did they narrate it?) or where the narrative is imposed (Inca - conquered people surely narrated an ending, but M says not collapse). M's rule uses narrative as *evidence* for the project ending, not the sole determinant.

  **Your Test Case & A Better Probe:**

  *   **Your Candidate (Intact Structures, "World Ended" Narrative):** This is an **excellent probe.** Under M's rule, this would likely be **COLLAPSE.** If the core socio-political project and its future horizon are perceived by participants as irrevocably ended ("our world ended"), even if the physical infrastructure remains (e.g., a revolutionary ideology collapses, a defining national myth is shattered, a core unifying purpose vanishes), it fits her USSR, Maya political system, and Norse Greenland verdicts. Complexity loss might be delayed or non-material (ideological, institutional paralysis). This directly challenges a pure complexity-loss rule (which would say no collapse) and emphasizes the core of M's approach.
  *   **An Even Stronger Probe (Separating Narrative from Project):** A case where **participants actively narrate an "ending" *during* a process that M's rule would see as *transformation*, not termination.**
      *   **Example:** A religious schism. Group A splits violently from Group B over doctrine. Group A flees/establishes a new community, sincerely believing their "world" (the old unified church) has ended and they are starting anew. Group B remains in the original holy sites, using the same institutions, believing *they* are the true continuation and the schism was just a purification.
      *   **Why it's better:** It pits the *participant narrative of ending* (Group A) directly against *institutional/material continuity* (Group B) and the *long-term viability of the core project* (did the core religious project end, or did it just transform/split?). Under M's rule:
          *   If the *original core project* is deemed to have ended (e.g., the unique synthesis of beliefs/structures is irreparably shattered), it's Collapse for *both* groups? (Problematic).
          *   If the project is seen as transforming/splitting into two viable continuations (like Christianity post-Reformation), it's NOT Collapse, *despite* Group A's narrative of ending. This forces the issue: Is collapse defined by the lived experience/narrative of *a subset* of participants, or by the objective (archaeological/historical) termination/viability of the *core project as a whole*? M's precedents (Maya, Rome, USSR) suggest she leans towards the latter objective view, using narrative as evidence but not the sole criterion. This probe isolates that tension better than your (still very good) candidate.

  **Society vs. Evidence:**

  For M, **collapse happens to the socio-political project itself.** It is a historical phenomenon concerning the termination of a specific way of organizing human life and its imagined future. The archaeologist misinterpreting complexity loss as collapse in the coastal town case would be mistaking *adaptation* (a change in the project's form) for *termination* (the end of the project). The evidence (pots, foundations) tells a partial story of change, but only the fuller context (agency, planning, narrative, continuity of community purpose) reveals whether it was adaptation or termination. The disconnect arises because archaeology often only sees the material consequences, not the lived experience or intent. M's framework attempts to integrate both, prioritizing the fate of the *project* over just its material footprint or the survival of its population.

  **Bet & Summary:**

  I bet heavily on M calling the coastal town **NOT A COLLAPSE**, aligning with Mesa Verde. Her core rule is the **irreversible termination of a specific socio-political project and its future horizon**, judged by a combination of outcome (non-viability), transformation vs. replacement, and participant experience/narrative as evidence. Conquest usually terminates the project (Inca), unless key elements enable genuine evolution (Rome). Your test case (intact structures, "world ended") is strong and would likely be deemed collapse by M, highlighting the non-material core of her definition. The schism probe is even better for exposing the project vs. narrative tension. Focus your chapter on "project termination" as her unifying principle. Good luck!
