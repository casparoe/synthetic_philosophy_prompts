prompt: |-
  I'm finishing a chapter on moral particularism and I'd like a consistency audit of my own position before I defend it, because I have the feeling that some of the things I want are cheap separately and expensive together. Let me state the package as plainly as I can. I work in the broadly Dancy-style particularist tradition, but several of these commitments are my own additions, and the terms I use for them are my own, so please argue about the substance rather than about who holds what.

  (1) Holism about reasons. Whether a feature of a situation is a reason at all, and which way it points, depends on what else is present in the situation; no feature carries its valence from case to case as such.

  (2) Anti-codification, strongly stated. There is no true, informative, finitely statable moral principle that explains verdicts, and moral judgement does not need one in order to be a genuine exercise of reason. I mean this more strongly than the claim that principles are true but too complicated to be of use: I want to say there is nothing principle-shaped for the verdicts to answer to.

  (3) No brute variation. Whenever a feature's valence differs between two cases, there is some specifiable difference between the cases that explains the difference. I hold this because I want moral judgement to be answerable to reasons rather than to taste, and because I don't see how a verdict could be justified by a difference nothing can be said about.

  (4) Defaults. Some features have a default valence — that a promise was made, that an action would cause someone pain — and they point as they do unless something in the context defeats or silences them. This is what I think makes moral advice and moral education possible at all.

  (5) Silencing. For some features in some contexts, the context does not outweigh the feature but silences it: the feature is not a weak reason that loses, it counts for nothing at all. My central case: you promised Ravi that you would bring a parcel to his flat at six; at ten to six you learn that Ravi died at midday. I want to say that the promise is not a reason, however slight, for going to the flat — not a reason that is outgunned by the futility of the trip. I also want to distinguish silencing from what I call dead weight: a feature that is not a reason and would not have been one anyway, even had the case been otherwise. I claim this distinction can be drawn without appeal to principles.

  (6) Drift. Take a graded series: a promise to deliver antivenom to a snakebite victim; a promised birthday cake; a promised book; a promised newspaper; promised junk mail; and finally the promise to Ravi, who has been dead since noon. My verdicts slide continuously down this series: the promise is a strong reason at one end and nothing at all at the other, and there is, I think, no step at which its status flips from outweighed to silenced and no sharp cut-off anywhere in between.

  (7) Contrastivism about verdicts. Ought is always ought-rather-than-the-alternatives, so the deontic verdict on an action can change when an alternative is added to or removed from the option set even though nothing about the action itself has changed.

  (8) Universalizability. Moral judgements are universalizable: if an action is wrong for me, it is wrong for anyone relevantly similarly situated, and moral disagreement between such people is genuine disagreement rather than a difference of sensibility. Several readers have told me this sits badly with (1); I don't think it does, but I'd like to know whether I'm right.

  (9) Expertise. There are moral experts; their verdicts converge on hard cases; expertise is transmitted by training on cases rather than by teaching principles; and an expert pressed to defend a verdict can always say, non-vacuously, why the verdict is what it is.

  Different readers have flagged different parts of this and I can't tell which of the flags I should take seriously. What I want is an audit, not a survey of the literature: go through the set and tell me which pairs are genuinely in tension, ranked by severity rather than presented as a list of equal worries; which apparent tensions dissolve on inspection and exactly why they dissolve; for each real tension, what specifically I would have to give up and what giving it up would cost me elsewhere in the set; and which single revision would clean up the most. And I'd like you to be explicit about the epistemic status of your own audit: tell me how confident you are in each ranking, where your reasoning is most likely to break down, and which consideration, if I could produce it, would make you reorder the tensions or drop one of them altogether.
reasoning: |-
  Okay, the user is working on a chapter about moral particularism, influenced by Dancy but with their own twists. They've listed nine commitments and want a consistency audit. They're concerned about possible tensions between these ideas, especially since some readers have flagged issues. Let me start by understanding each point clearly.

  First, holism (1) says reasons depend on context—no fixed valence. Then anti-codification (2) rejects any finite, informative moral principles. No brute variation (3) insists that valence changes must have an explainable difference. Defaults (4) allow for default valences to make education possible. Silencing (5) is when a feature isn't overridden but nullified, like the promise to a dead person. Drift (6) describes a gradual shift in reasons' strength without clear boundaries. Contrastivism (7) means "ought" is relative to alternatives. Universalizability (8) says similar situations should have the same moral judgments. Expertise (9) claims moral experts exist and can justify verdicts case by case.

  The main tensions I see are between holism and universalizability. If reasons are context-dependent, how can situations be "relevantly similar" without principles? The user thinks they're compatible, but it's tricky. Then there's anti-codification vs. no brute variation. If there are no principles, how can we always specify the difference? Defaults and drift might conflict because defaults suggest stable valences, but drift shows gradual change. Silencing and drift also clash—silencing implies a binary switch, but drift is continuous. Contrastivism might affect universalizability if alternatives change the "ought," making similarity harder to define.

  I need to check each pair. For holism and universalizability, the user might argue that holistic reasons can still be universal if contexts are identical. But specifying "relevantly similar" without principles is tough. Anti-codification and no brute variation: explaining differences without principles could work if we use contextual narratives, but that might not be "specifiable" in a finite way. Defaults and drift—defaults are heuristics, but drift shows they're not fixed. Maybe defaults are prima facie, but then silencing (as absence of reason) conflicts with drift's continuity. 

  Silencing vs. drift is a big one. If silencing is absolute, but drift has no sharp cut-off, how can a promise go from strong reason to nothing without an intermediate step? The user needs a non-binary account of silencing. Contrastivism and universalizability: if "ought" depends on alternatives, universalizability must include the option set, which complicates similarity. Expertise and anti-codification might be okay if experts use case-based reasoning without principles, but justifying verdicts without principles could be circular.

  Ranking the tensions: Holism vs. universalizability is the most severe because it challenges the objectivity of moral judgments. Then silencing vs. drift because it questions the coherence of reason status. Anti-codification vs. no brute variation next, as it affects explainability. Then defaults vs. drift, and contrastivism vs. universalizability. Expertise seems less problematic if case-based training works.

  Are there any tensions that dissolve? Defaults and silencing together might be fine if defaults are context-sensitive. Anti-codification and expertise could coexist if experts articulate reasons situationally. The user needs to clarify how "specifiable" works without principles. Also, for drift, they might need to accept scalar reasons instead of binary silencing.

  The user's hidden needs might include defending particularism against charges of relativism or subjectivism. They want moral judgments to be objective and universalizable but without principles. They might also need to address how moral education works if principles are impossible. Their examples, like the Ravi case, show intuitive cases but need theoretical grounding.

  In conclusion, the biggest issues are holism vs. universalizability and silencing vs. drift. To resolve the first, the user might refine what "relevantly similar" means contextually. For silencing vs. drift, they could adopt a scalar approach where reasons fade gradually. Sacrificing silencing as binary might help, but then the Ravi case becomes harder to explain. Alternatively, allowing for principles as heuristics could help with education but conflict with anti-codification. Each fix has trade-offs, so the user must decide which commitments are core to their view.
answer: |-
  Here is a consistency audit of your position, ranking tensions by severity (most severe first), identifying where apparent tensions dissolve, and specifying costs of potential revisions. I'll conclude with the epistemic status of this audit.

  ---

  ### **Ranked Tensions (Most Severe First)**

  1.  **Holism (1) + Anti-Codification (2) vs. Universalizability (8)**  
      *   **Tension:** Universalizability requires that two "relevantly similar" situations warrant the same verdict. But holism implies that *any* difference in context can alter a feature's valence or existence as a reason. Anti-codification explicitly denies there are finite, informative principles defining "relevant similarity" or fixing valences. How can situations be "relevantly similar" in a morally decisive way without principles? If every context is potentially unique, universalizability risks becoming vacuous ("similar" only if the verdict is identical).
      *   **Why Severe:** Strikes at the core of moral objectivity and interpersonal justification. Without a robust account of "relevant similarity," moral disagreement risks collapsing into sensibility differences.
      *   **Resolution Cost:** You must either:
          *   **Sacrifice Strong Anti-Codification (2):** Allow that "relevant similarity" *can* be captured by context-sensitive principles (even if infinitely complex or non-action-guiding), providing a basis for comparison. *Cost:* Weakens core particularist claim; may open door to forms of generalism.
          *   **Reinterpret Universalizability (8):** Make "relevant similarity" purely verdict-based (two situations are relevantly similar *iff* they warrant the same verdict). *Cost:* Makes universalizability trivial and non-explanatory; undermines its role in justifying verdicts and settling disagreements.
      *   **Confidence:** High (8/10). This is the most fundamental challenge to particularism.

  2.  **Silencing (5) vs. Drift (6)**  
      *   **Tension:** Silencing posits a binary switch: a feature (like a promise) is either a reason (of some weight) or *completely silenced* (counts for nothing). Drift describes a *continuous* diminution of a reason's force (e.g., the promise's strength fading across the series) with *no sharp cut-off*. How can a feature transition smoothly from "strong reason" to "no reason at all" without ever passing through a state of being a "weak reason" that is merely outweighed? Silencing seems to require a discontinuity that Drift explicitly denies.
      *   **Why Severe:** Direct contradiction between a binary metaphysical claim (silencing) and a scalar phenomenological claim (drift) about the *same phenomenon* (reason status).
      *   **Resolution Cost:** You must either:
          *   **Sacrifice Silencing as Absence (5):** Reconceive silencing as the *extreme limit* of being outweighed, where the weight asymptotically approaches zero. *Cost:* Abandons the core intuition that the promise to the dead person isn't *outweighed* by futility; it simply *isn't a reason*. Blurs the distinction with outweighed reasons.
          *   **Sacrifice Drift's Continuity (6):** Allow that despite appearances, there *is* a sharp (perhaps unknowable) cut-off between outweighed and silenced within the drift series. *Cost:* Contradicts phenomenological claim; makes drift less compelling as an argument against sharp boundaries/principles.
          *   **Sacrifice the Binary View in (5):** Allow that reasons can have scalar existence/force, including zero. "Silencing" just means force=0. *Cost:* Requires redefining "reason" non-binarily; may complicate talk of "presence/absence".
      *   **Confidence:** High (9/10). The logical clash is stark.

  3.  **Anti-Codification (2) vs. No Brute Variation (3) + Expertise (9)**  
      *   **Tension:** No Brute Variation demands that *every* valence shift be explainable by a "specifiable difference." Expertise demands experts can *always* "say why" a verdict is correct. But Strong Anti-Codification denies there are any "principle-shaped" truths for verdicts to answer to. How can experts *non-vacuously* specify the difference explaining a valence shift without implicitly appealing to *some* generalization (even if context-bound and defeasible)? If "specifiable" just means narrating all contextual details, it risks vacuity ("this case is different because everything is different").
      *   **Why Significant:** Threatens the rational justifiability (No Brute Var) and teachability (Expertise) of particularist judgement if explanations cannot be genuinely informative.
      *   **Resolution Cost:** You must either:
          *   **Weaken Anti-Codification (2):** Allow that experts appeal to *defeasible generalizations*, *ceteris paribus* rules, or *patterns* discerned through case training, even if these aren't exceptionless "principles" in the strong sense. *Cost:* Moves towards moderate particularism; may seem to concede ground to generalism.
          *   **Clarify "Specifiable" & "Say Why" (3 & 9):** Argue that "specifying the difference" involves highlighting *salient contextual features* and their *holistic interaction* narratively, not subsumption under principles. Expertise involves recognizing these salient interactions. *Cost:* Must show this is genuinely informative and non-vacuous, satisfying the demand for justification without principles. Requires robust account of salience.
      *   **Confidence:** Medium-High (7/10). Depends heavily on what counts as "informative" and "non-vacuous" explanation.

  4.  **Defaults (4) vs. Drift (6) & Holism (1)**  
      *   **Tension:** Defaults suggest a stable, context-independent valence tendency ("promises *generally* provide pro tanto reasons"). Drift shows a continuous erosion of this valence across contexts. Holism insists valence is entirely context-dependent. How robust can "default valences" be if they smoothly fade to zero in a continuous drift? Doesn't Holism undermine the stability implied by Defaults?
      *   **Why Moderate:** Defaults are explicitly *defeasible* and context-dependent ("unless something defeats/silences"). Drift just illustrates *how* they are defeated. The "default" might simply reflect statistical frequency or psychological salience in common cases, not metaphysical primacy.
      *   **Resolution?** This tension likely **dissolves on inspection**. Defaults (as you describe them) are *prima facie*/defeasible starting points, *not* invariant valences. Drift is *precisely the mechanism* by which context modifies the default, demonstrating holism. Defaults explain learning/advice; drift/holism explain application. *No revision needed.*
      *   **Confidence in Dissolution:** High (8/10). Key is understanding Defaults as heuristic/epistemic aids, not ontological anchors.

  5.  **Contrastivism (7) vs. Universalizability (8)**  
      *   **Tension:** Contrastivism makes "ought" relative to the specific set of alternatives. Universalizability requires that if A is wrong for me in situation S (with alternatives {X,Y,Z}), it's wrong for anyone in a "relevantly similar" S. But if "relevantly similar" must include the *exact same option set* to ensure the contrast is identical, universalizability becomes extremely narrow (almost no two real situations are alike). If "relevant similarity" abstracts away from the option set, then contrastivism implies the verdict *could* differ solely due to different alternatives, even if "everything else" is similar.
      *   **Why Moderate:** You can define "relevantly similar" to *include* the structure of the practical dilemma (the salient alternatives). Universalizability then applies to agents facing *that specific type of choice situation*.
      *   **Resolution?** Tension **largely dissolves**. Universalizability applies to *situations conceived as including the option set*. The contrastivist element is simply part of what defines the "situation." An expert's judgment about "what A ought to do" inherently references the alternatives presented. *No revision needed*, but requires clarity that "situation" in (8) includes the contrast set.
      *   **Confidence in Dissolution:** Medium (6/10). Requires careful definition of "situation," but seems manageable.

  ---

  ### **Apparent Tensions that Dissolve**

  *   **Defaults (4) + Silencing (5):** Silencing is presented *as a mechanism* for defeating a default valence. Defaults explain why the promise *starts* as a reason; Silencing explains how context can make it *cease to be* a reason *at all* in specific cases like Ravi. They are complementary, not conflicting.
  *   **Holism (1) + Expertise (9):** Holism explains *why* expertise requires case-based training (sensitivity to context); Expertise shows *that* reliable, convergent judgment is possible *despite* holism. No conflict.
  *   **Anti-Codification (2) + Expertise (9):** Expertise based on case-training and articulating contextual reasons is precisely how judgment functions *without* relying on codified principles. The "why" given by experts is situational, not principle-based.

  ---

  ### **Which Single Revision Cleans Up the Most?**

  **Reconceiving Silencing (5) away from strict binary absence towards scalar diminution (potentially reaching zero).**

  *   **Why:** This directly resolves the severe tension with Drift (6). It also indirectly helps with:
      *   **Defaults (4) + Drift:** Makes the fading of default force smoother.
      *   **Holism (1):** Fits better with continuous contextual variation.
      *   **No Brute Variation (3) + Expertise (9):** Explaining a scalar shift ("why the promise mattered less here than there") might be easier than justifying a binary switch, potentially easing pressure on Anti-Codification.
  *   **Cost:** Requires abandoning the strong intuition that the promise to Ravi is *metaphysically different* in kind (not a reason at all) rather than just *infinitely weak* (a reason with zero weight). You lose the sharp distinction between silencing and outweighed reasons. This might make the Ravi case feel less decisive.

  ---

  ### **Epistemic Status of this Audit**

  1.  **Overall Confidence:** Medium-High (7/10). The analysis is based on logical consistency between your stated commitments. The ranking reflects the perceived threat to the core coherence and defensibility of your position.
  2.  **Where Reasoning is Most Likely to Break Down:**
      *   **Interpreting "Specifiable" (No Brute Variation):** My critique assumes "specifiable" requires something close to generalizable explanatory content. If you mean only "pointing to any contextual difference, however minute or narratively described," the tension with Anti-Codification lessens significantly, but risks making "No Brute Variation" trivial.
      *   **Nature of "Relevant Similarity" (Univer.):** My assessment hinges on the difficulty of defining this without principles. If you have a robust, non-principle-based account of similarity (e.g., based on salience or narrative coherence), the severity of tension (1) decreases.
      *   **Phenomenology of Drift:** My argument assumes your description of Drift as *phenomenologically continuous* is accurate and intended metaphysically. If Drift is merely epistemic (we *can't perceive* the cut-off, but it exists), the tension with Silencing dissolves.
  3.  **What Could Change My Mind:**
      *   **Holism vs. Univ.:** A concrete, non-principle-based account of "relevant similarity" that successfully enables comparison and disagreement resolution without smuggling in generalizations would make me downgrade this tension significantly.
      *   **Silencing vs. Drift:** A compelling argument that scalar reasons reaching zero weight *can* metaphysically and phenomenologically account for the Ravi case (and distinguish it from dead weight) without needing a binary switch would make me drop this tension.
      *   **Anti-Cod. vs. No Brute Var/Exp.:** Clear examples of how experts "specify the difference" and "say why" in complex cases, using purely narrative, non-generalizing language that is genuinely informative and satisfying, would reduce this tension.
      *   **Defaults vs. Drift/Holism:** Evidence that you conceive of Defaults as *only* psychological/educational heuristics with no metaphysical weight would solidify my view that this tension dissolves.

  **In summary:** Your most critical challenges are reconciling Holism/Anti-Codification with Universalizability, and resolving the binary nature of Silencing with the continuous phenomenology of Drift. Tackling Silencing offers the most leverage. The package is ambitious and philosophically rich, but requires careful navigation at these specific junctures to achieve consistency. Good luck with the defense!
