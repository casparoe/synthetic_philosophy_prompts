    M gives 3.
    We need 4-4p>3 -> same as above, p<1/4.

  Therefore, for any p in (0, 1/4), the mixed strategy (p, 0, 1-p) strictly dominates M: it yields more than M against every action of *The Gazette*.

  Hence, M is strictly dominated by a mixture of P and S.

  **Part 2: Order of Elimination**

  The order of elimination does not matter. Even when mixed strategies are allowed as dominators, iterated elimination of strictly dominated strategies is order-independent. This is because if a strategy is strictly dominated in the original game, it remains strictly dominated in any subgame that does not remove the dominating strategy. Therefore, regardless of the order, all strictly dominated strategies will eventually be removed, and the set of strategies that survive the process is the same.

