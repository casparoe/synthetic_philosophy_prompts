  ---

  **Iterated Elimination and Mixed Strategies: News Outlets**

  You are covering the competitive dynamics between news outlets. Consider the following scenario:

  Two rival outlets, *The Chronicle* and *The Gazette*, are deciding how to cover a developing story. Each outlet must choose among three options: 
  - **P**: Run the story prominently on the front page.
  - **M**: Run the story in a minor way, inside the paper.
  - **S**: Spike the story (do not run it).

  The payoffs (in thousands of additional readers) depend on the choices of both outlets. We represent the game by a payoff matrix where the rows are the strategies of *The Chronicle* and the columns are the strategies of *The Gazette*. The first number in each cell is the payoff for *The Chronicle*, and the second for *The Gazette*.

  We are going to analyze this game using iterated elimination of strictly dominated strategies (IESDS), where we allow a strategy to be strictly dominated not only by a pure strategy but also by a mixed strategy.

  **Part 1: Building the Matrix [10 marks]**

  Construct a payoff matrix (3x3 for each player) for *The Chronicle* and *The Gazette* such that:
  - For *The Chronicle*, the strategy M is strictly dominated by a mixed strategy that uses only P and S (with positive probability on both) but is not strictly dominated by either P or S alone.
  - Ensure that the payoffs are realistic (non-negative integers or simple decimals) and that the dominance condition holds.

  Write the matrix clearly and explain briefly why M is strictly dominated by a particular mixture of P and S but not by P alone or S alone.

  **Part 2: Order of Elimination [5 marks]**

  In iterated elimination of strictly dominated strategies (with mixed strategies allowed as dominators), does the order in which we eliminate strategies affect the set of strategies that survive the process? State whether the order matters or not. If it does not matter, explain why in one or two sentences. If it does matter, provide a counterexample (a different payoff matrix) and show two different orders of elimination that yield different surviving sets.

  **Part 3: Never a Best Response vs. Strictly Dominated [10 marks]**

  A strategy is said to be *never a best response* if there is no belief about the strategies of the other player(s) to which this strategy is a best response. A strategy is *strictly dominated by a mixed strategy* if there exists a mixed strategy (over one's own strategies) that yields a strictly higher payoff against every possible strategy profile of the other player(s).

  (a) In two-player games, is every strategy that is never a best response necessarily strictly dominated by some mixed strategy? State yes or no, and explain your answer in one or two sentences.

  (b) In three-player games, is every strategy that is never a best response necessarily strictly dominated by some mixed strategy? State yes or no. If not, provide a counterexample (a small game) to illustrate.

  ---

  Model Answer (700-800 words):

