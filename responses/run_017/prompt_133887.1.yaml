  ### Question Text: Iterated Elimination in News Competition

  You're analyzing competing news outlets, *The Chronicle* and *The Gazette*, deciding how to cover a major event. Each outlet can choose:  
  - **P**: Prominent coverage (front page, lead story).  
  - **M**: Minor coverage (small section, page 5).  
  - **S**: Spike the story (no coverage).  

  Payoffs (in thousands of new subscriptions) depend on both outlets' choices. *The Chronicle* is the row player; *The Gazette* is the column player. The first number in each cell is *The Chronicle*'s payoff; the second is *The Gazette*'s.  

  **Part 1: Constructing the Matrix (10 marks)**  
  Build a 3×3 payoff matrix where:  
  - For *The Chronicle*, **M is strictly dominated by a mixed strategy using only P and S** (with positive probability on both).  
  - **M is NOT strictly dominated by P alone or S alone**.  
  - Use integers or simple decimals.  
  - Explain why M is mixed-dominated but not pure-dominated.  

  **Part 2: Order of Elimination (5 marks)**  
  When eliminating strictly dominated strategies (allowing mixed strategies as dominators), can the **order of elimination** change the set of surviving strategy profiles? State "yes" or "no." If no, explain why in 1–2 sentences. If yes, provide a counterexample matrix and show two elimination orders with different results.  

  **Part 3: Never a Best Response vs. Strictly Dominated (10 marks)**  
  A strategy is **never a best response (NBR)** if no belief about opponents' play makes it optimal. It is **strictly dominated by a mixed strategy (SDMS)** if a mixed strategy yields a strictly higher payoff against *all* opponents' actions.  
  (a) In two-player games, is every NBR strategy also SDMS? State "yes" or "no" and explain briefly.  
  (b) In three-player games, is every NBR strategy also SDMS? State "yes" or "no." If no, provide a counterexample matrix and explain.  

  ---

  ### Model Answer (785 words)  
  **Part 1: Matrix and Explanation**  
  Payoff matrix (*Chronicle* = row, *Gazette* = column):  

  |          | **Gazette: P** | **Gazette: M** | **Gazette: S** |  
  |----------|----------------|----------------|----------------|  
  | **Chronicle: P** | (4, 0)         | (0, 4)         | (0, 3)         |  
  | **Chronicle: M** | (0, 4)         | (3, 0)         | (3, 4)         |  
  | **Chronicle: S** | (0, 0)         | (4, 4)         | (4, 0)         |  

  - **Why M isn’t pure-dominated?**  
    - M vs. P: If *Gazette* plays P, P (payoff 4) > M (0). But if *Gazette* plays M or S, M (payoffs 3) > P (0). So P doesn’t dominate M.  
    - M vs. S: If *Gazette* plays M, S (4) > M (3). But if *Gazette* plays P, S (0) = M (0) — not strictly better. So S doesn’t dominate M.  

  - **Why M is mixed-dominated?**  
    Consider a mix of P and S: play P with probability *p* and S with *1−p* (*p* > 0). Against:  
    - *Gazette* P: Mix payoff = 4*p* + 0*(1−p*) = 4p. M payoff = 0. **4p > 0 if *p* > 0.**  
    - *Gazette* M: Mix payoff = 0*p* + 4*(1−p*) = 4−4p. M payoff = 3. **4−4p > 3 if *p* < 0.25.**  
    - *Gazette* S: Mix payoff = 0*p* + 4*(1−p*) = 4−4p. M payoff = 3. **4−4p > 3 if *p* < 0.25.**  
    For *p* = 0.2 (1/5), mix payoffs are:  
    - vs. P: 4*0.2 = 0.8 > 0  
    - vs. M: 4−4*0.2 = 3.2 > 3  
    - vs. S: 4−4*0.2 = 3.2 > 3  
    Thus, the mix (P with 0.2, S with 0.8) strictly dominates M.  

  **Part 2: Order of Elimination**  
  **No, order cannot change the surviving set.**  
  - A strategy strictly dominated in the original game remains dominated in any subgame where dominators exist. Since mixed dominance relies on pure strategies that survive, and eliminations only remove dominated strategies, the final set is order-independent.  

  **Part 3: NBR vs. SDMS**  
  (a) **Yes** (in two-player games).  
  - If a strategy is NBR, no belief (probability distribution over opponent’s actions) makes it optimal. This implies a mixed strategy exists that beats it everywhere (via equivalence theorems).  

  (b) **No** (in three-player games).  
  **Counterexample:** Three outlets — *Chronicle* (player 1), *Gazette* (player 2), *Herald* (player 3). Actions:  
  - *Chronicle*: A, B, C  
  - *Gazette*: 0, 1  
  - *Herald*: 0, 1  

  *Chronicle*’s payoffs (others’ payoffs = 0 for simplicity):  

  | *Gazette*/*Herald* | (0,0) | (0,1) | (1,0) | (1,1) |  
  |---------------------|-------|-------|-------|-------|  
  | **Chronicle: A**    | 1     | 1     | 0     | 0     |  
  | **Chronicle: B**    | 0     | 0     | 1     | 1     |  
  | **Chronicle: C**    | 0.5   | 0.5   | 0.5   | 0.5   |  

  - **C is NBR**:  
    - If players 2–3 play (0,0) or (0,1), A gives 1 > 0.5.  
    - If players 2–3 play (1,0) or (1,1), B gives 1 > 0.5.  
    Thus, for any belief, A or B is better than C.  
  - **C is not SDMS**:  
    Suppose a mix (prob. *p* on A, *q* on B, *r* on C; *p*+*q*+*r*=1). To dominate C, the mix must yield >0.5 against all (Gazette, Herald) pairs:  
    - vs. (0,0): 1*p* + 0*q* + 0.5*r* > 0.5 → *p* + 0.5*r* > 0.5  
    - vs. (0,1): same as (0,0) → *p* + 0.5*r* > 0.5  
    - vs. (1,0): 0*p* + 1*q* + 0.5*r* > 0.5 → *q* + 0.5*r* > 0.5  
    - vs. (1,1): same as (1,0) → *q* + 0.5*r* > 0.5  
    Adding the first and third inequalities:  
    (*p* + 0.5*r*) + (*q* + 0.5*r*) > 1 → *p* + *q* + *r* > 1.  
    But *p* + *q* + *r* = 1. Contradiction! Thus, no mix dominates C.  

