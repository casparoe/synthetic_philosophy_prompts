answer: |-
  Below is the specification of adequacy requirements for a norm of assertion, organized by core demands, motivated by your described cases, and annotated for negotiability. Conflicts are flagged, and a comparative table is provided.

  ---

  ### **Standard of Adequacy: Requirements for a Norm of Assertion**

  #### **I. Core Job-Based Requirements**  
  1. **Correctness & Permissibility Specification**  
     - *Requirement*: The norm must specify conditions for **correctness** (when an assertion succeeds as an assertion) and **permissibility** (when asserting is epistemically appropriate). A single unified norm must supply both.  
     - *Motivation*: Distinguishing warranted false assertions (incorrect but permissible) from outright lies (impermissible) demands joint treatment to avoid fragmentation.  
     - *Status*: **Negotiable** (a two-norm solution is defensible but risks complexity).  

  2. **Explanatory Power**  
     - *Requirement*: Must explain:  
       - (a) Moorean absurdity (e.g., "P but I don't believe P").  
       - (b) Propriety of "How do you know?" challenges.  
       - (c) Retraction pressure when assertion is falsified.  
     - *Motivation*: These phenomena reveal assertion's constitutive links to belief, knowledge, and truth-tracking.  
     - *Status*: **Non-negotiable**.  

  3. **Non-Decision-Providing**  
     - *Requirement*: The norm need **not** function as a first-personal decision procedure (e.g., speakers may permissibly assert without certainty of satisfying the norm).  
     - *Motivation*: Selfless assertions (e.g., a doctor asserting a diagnosis she doubts due to depression).  
     - *Status*: **Non-negotiable**.  

  #### **II. Coverage Requirements**  
  4. **Content & Speaker Neutrality**  
     - *Requirement*: Applies identically to:  
       - Vague/moral/aesthetic assertions.  
       - Future-directed assertions ("I will finish this paper").  
       - Deferential assertions (relying on experts/instruments).  
       - Composite speakers (AI, press offices).  
     - *Motivation*: Deference cases and composite speakers challenge norms requiring "personal" justification.  
     - *Status*: **Non-negotiable** (unity is essential).  

  5. **Hedged Assertion Compatibility**  
     - *Requirement*: Must accommodate probabilistic/hedged assertions (e.g., "Probably P") without collapsing into guessing or supposing.  
     - *Motivation*: Distinguishing "I guess P" from "Likely P" requires the norm to govern confidence gradations.  
     - *Status*: **Negotiable** (hybrid norms may treat these as derivative).  

  #### **III. Boundary & Status Requirements**  
  6. **Distinction Preservation**  
     - *Requirement*: Must not blur assertion with non-assertoric speech acts (guessing, joking, conceding).  
     - *Motivation*: Lottery propositions (asserting "Your ticket lost" based on odds alone feels improper vs. guessing).  
     - *Status*: **Non-negotiable**.  

  7. **Blame-Correctness Separation**  
     - *Requirement*: Must distinguish an assertion's *incorrectness* from the speaker's *blameworthiness*.  
     - *Motivation*: Warranted false assertions (e.g., "Sam is in Paris" based on reliable but misleading evidence).  
     - *Status*: **Non-negotiable**.  

  8. **Degrees of Assertion**  
     - *Requirement*: If assertion admits degrees (e.g., hedging), the norm must explain strength-linked requirements.  
     - *Motivation*: Asserting "P" vs. "Possibly P" imposes varying retraction pressures.  
     - *Status*: **Preference** (some deny degrees).  

  ---

  ### **Flagged Conflicts & Trade-offs**  
  - **Primary Conflict**: **Factivity** (correctness requires truth/knowledge) + **Speaker Accessibility** (speakers can typically self-assess satisfaction) + **Unity** (one norm for all content/speakers) → **Unsatisfiable Triad**.  
    - *Resolution*: Drop **Speaker Accessibility**.  
    - *Cost*: Speakers cannot always self-audit assertions (e.g., future/deferential cases).  
    - *Viability*: Retained list remains robust (aligns with your rejection of decision-procedure role).  

  #### **Desiderata vs. Prejudices**  
  | Requirement                     | Status                     | Rationale                                                                 |  
  |---------------------------------|----------------------------|---------------------------------------------------------------------------|  
  | Constitutive (not evaluative)   | **Prejudice**              | Evaluative standards (e.g., "should") may suffice; no need for "rules".   |  
  | Single norm (correctness + permissibility) | **Negotiable Preference** | Two norms possible (e.g., truth for correctness, justification for permissibility) but less elegant. |  
  | Belief-expression link          | **Prejudice**              | Composite speakers (e.g., AI) assert without beliefs.                     |  
  | Epistemic independence          | **Non-negotiable**         | Norms leaning on "justification" or "reasonableness" circularly presuppose epistemic norms. |  

  **Most Exclusionary Requirement**: **Explanatory Power (Moorean/Retraction)**. Excludes truth norms (cannot explain why false assertions warrant retraction) and simple belief norms (fail Moorean absurdity).  

  ---

  ### **Norm Comparison Table**  
  *Rows: Requirements | Columns: Candidate Norms*  

  | Requirement                     | Knowledge Norm<br>("Assert only if known") | Truth Norm<br>("Assert only if true") | Justified Belief Norm<br>("Assert only if justified belief") | Contextualist/Hybrid<br>(e.g., "Knowledge + Sincerity") |  
  |---------------------------------|-------------------|------------|-----------------------|--------------------------|  
  | **Correctness & Permissibility** | Correct if known; permissible only if known | Correct if true; permissible if reasonable | Permissible if justified; correctness uncertain | Uncertain (varies by context/sincerity) |  
  | **Explains Moorean Absurdity**   | Yes               | No         | No                    | Uncertain                |  
  | **Explains "How do you know?"**  | Yes               | No         | Partial               | Partial                  |  
  | **Retraction Pressure**          | Yes               | Weak       | Partial               | Partial                  |  
  | **Non-Decision-Providing**       | Yes               | Yes        | Yes                   | Yes                      |  
  | **Content/Speaker Neutrality**   | Fails future/deferential | Yes       | Yes                   | Uncertain                |  
  | **Hedged Assertion Compatibility**| Weak              | Yes        | Yes                   | Strong                   |  
  | **Distinction Preservation**     | Strong            | Weak       | Weak                  | Moderate                 |  
  | **Blame-Correctness Separation** | Yes               | No         | Yes                   | Uncertain                |  
  | **Degrees of Assertion**         | No                | No         | Partial               | Yes                      |  

  **Key Uncertainties**:  
  - Contextualist views vary widely; many struggle with composite speakers.  
  - Justified belief norms ambiguate correctness (is a justified false assertion correct?).  
  - Truth norms fail retraction pressure (if asserted reasonably, why retract upon falsification?).  

  ---

  **Summary**: The knowledge norm best meets non-negotiable requirements (explanatory power, blame-correctness separation) but falters on neutrality (future/deferential cases). The truth norm fails Moorean/retraction demands. Justified belief norms blur correctness/permissibility. Contextualism offers flexibility but sacrifices unity. **Your triad conflict is validated**; dropping speaker accessibility preserves the strongest core.
