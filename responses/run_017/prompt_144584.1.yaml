    - **Why**: Logical uncertainty (assigning probabilities to unprovable sentences) reintroduces self-reference. A Bayesian agent might assign low probability to "my successor is sound", leading to underconfidence or overconfidence loops. Garrabrant et al. show this can recreate Löbian obstacles (e.g., probabilistic Löb's theorem). The core issue is self-referential trust, not proof-basedness per se.  
    - **Key insight**: Any system capable of reasoning about itself encounters fixed points. Proof-based agents make this explicit, but Bayesian agents face similar challenges implicitly (e.g., with reflective oracles).  
