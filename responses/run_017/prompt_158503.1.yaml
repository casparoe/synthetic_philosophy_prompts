  First, I need to assess their core innovation: replacing the standard phenomenological reading with structural deliberative vulnerability. The three-condition framework (recognition of impartial authority, acknowledgment of potential conflict, embeddedness in standing policy) seems robust. But I wonder if Williams would see this as overly procedural - his concern feels more existential about identity-constituting commitments.

  Regarding the Lena thought experiment, the open/closed record distinction is clever but might need refinement. The "open-record audit" metaphor powerfully captures the subordination Williams objects to, but I should verify if this creates a false binary. Real agents likely exist on a spectrum of vulnerability.

