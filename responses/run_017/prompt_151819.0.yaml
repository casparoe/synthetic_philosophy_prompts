  The repair: replace "broadcast" with "on the record" vs. "merely retrievable". A content is "on the record" if later processing is held to it and must stay consistent; it is defended if challenged. "Merely retrievable" means it can be probed but no commitment.

  We must adjudicate between the two interpretations and check if the repair avoids the multiple drafts objection.

  Multiple drafts model (Dennett): 
  - No central place, no canonical draft, no fixed content at a specific time.
  - What the subject is conscious of depends on how and when probed.

  Audit steps:
  1. Build a correspondence table (Table 1) for the press office model.
  2. For each mapping, note status and whether it is load-bearing for A or B.
