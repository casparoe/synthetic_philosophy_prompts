answer: |-
  Here is your Q&A prep sheet, structured for maximum tactical utility. Objections are ordered by likelihood and potential damage, with phrasing tailored to each group. Replies assume a 2-minute limit.

  ---

  **Q&A PREPARATION SHEET: EVOLUTIONARY PSYCHOLOGY & THE UNCONSTRAINED HYPOTHESIS SPACE**  

  ### **1. Philosopher of Science (Likely & Damaging)**  
  **Objection:** "Your ‘task specification’ still smuggles in adaptationist assumptions. Gould showed *reconstructing* the ‘ancestral task’ is itself a just-so exercise. Isn’t this merely replacing one unconstrained space (behavioural hypotheses) with another (ancestral reconstructions)?"  
  **Reply:**  
  "Valid concern. Task specification doesn’t eliminate reconstruction challenges but *shifts the burden*: it forces hypotheses to commit upfront to quantifiable performance criteria (e.g., ‘solves mate-selection under time constraints with 90% accuracy’). Unlike storytelling, this allows *comparative evaluation*: if a mechanism fails the pre-specified benchmark, the hypothesis is falsified. Crucially, it makes assumptions explicit and testable *in principle*—whilst Gould’s critique stands, this constrains the *form* of adaptationist claims."  
  **Weakness:** Ancestral tasks remain inferential.  
  **Concede/Hold:** Concede reconstruction is fallible; hold that quantifiable criteria impose testable constraints absent in current practice.  

  ### **2. Social Psychologist (Likely & Damaging)**  
  **Objection:** "Even if your method ‘rescues’ some ev psych, won’t the media/policymakers misuse the *conjectural* majority (e.g., ‘rape modules’) to naturalise oppression? Isn’t the real damage ideological?"  
  **Reply:**  
  "I share your concern about misuse. My aim isn’t to endorse conjectural work but to quarantine it: by showing most ev psych *fails* task specification, we demarcate rigorous reverse-engineering from untestable claims. This *undermines* the authority of just-so stories in policy debates. We should actively distinguish ‘tested mechanisms meeting performance criteria’ from ‘speculative narratives’—and I argue only the former deserves scientific credibility."  
  **Weakness:** Doesn’t prevent misuse of bad ev psych.  
  **Concede/Hold:** Concede political risks are real; hold that clear demarcation is the best defence.  

  ### **3. Formal Epistemologist (Likely & Moderately Damaging)**  
  **Objection:** "If the problem is unconstrained hypothesis spaces, why not formalise it? Your ‘five stories’ could be a Bayesian model with priors. Without quantifying how hypotheses are generated/distinguished, haven’t you just described—not solved—the problem?"  
  **Reply:**  
  "Excellent point. Task specification *enables* formalisation: by defining the computational problem and performance criterion, we set the stage for Bayesian reverse engineering (e.g., comparing mechanism priors *given* the task demands). My framework is a prerequisite for the models you propose—it forces hypotheses to be *formalisable*. I’d welcome collaboration on this."  
  **Weakness:** Stops short of providing the formal model.  
  **Concede/Hold:** Concede formalisation is needed for full rigour; hold that task specification is a necessary first step.  

  ### **4. Evolutionary Psychologist (Likely & Low Damage)**  
  **Objection:** "But we *already do* task analysis! E.g., mate-choice studies specify cognitive algorithms for solving trade-offs between fertility cues and resources. Why dismiss this as ‘conjecture’?"  
  **Reply:**  
  "I agree this is the strongest work—and it’s precisely what I aim to rescue. My critique targets studies *lacking* performance benchmarks. For instance, if your model predicts men prioritise youth in mates, does it specify *how quickly* or *how accurately* this must occur to outcompete alternatives? Without that, alternative hypotheses (e.g., cultural transmission) aren’t disconfirmed. Your novel predictions are vital, but task specification *strengthens* them by adding quantifiable sufficiency tests."  
  **Weakness:** Overstates novelty; some ev psych already implies benchmarks.  
  **Concede/Hold:** Concede some work approximates this; hold that explicit criteria are needed for falsification.  

  ### **5. Philosopher of Science (Likely & Low Damage)**  
  **Objection:** "Isn’t this just ‘Panglossianism 2.0’? You assume natural selection *must* have produced optimal solutions, ignoring drift, exaptation, or constraints. Why privilege ‘task performance’?"  
  **Reply:**  
  "Not at all. Task specification *accommodates* exaptation: a hypothesis could state, ‘Mechanism X evolved for task Y but now solves Z—and here’s how we test its efficiency at Z.’ Crucially, it *doesn’t* assume optimality—only that a mechanism must meet a *minimal criterion* to plausibly solve a problem. Drift or constraints can be tested *against* that benchmark."  
  **Weakness:** Benchmarks may still imply adaptationist bias.  
  **Concede/Hold:** Conclude no framework is assumption-free; hold that this is less biased than current practice.  

  ### **6. Social Psychologist (Moderate Likelihood & Damage)**  
  **Objection:** "Aren’t you committing the naturalistic fallacy? Even if a trait *was* adaptive, that doesn’t justify it morally. Task analysis could still enshrine harmful behaviours as ‘natural’."  
  **Reply:**  
  "Absolutely not. I fully endorse Hume’s Law: no ‘ought’ from an ‘is’. Task specification describes *how* a mechanism works, not whether it’s desirable. In fact, by clarifying causation (e.g., ‘this bias arises from a mechanism solving X’), we *empower* intervention. Biology doesn’t dictate ethics—understanding a lock isn’t endorsement of the prison."  
  **Weakness:** Doesn’t prevent others from misapplying findings.  
  **Concede/Hold:** Concede the fallacy risk; hold that descriptive science is neutral.  

  ### **7. Evolutionary Psychologist (Moderate Likelihood & Damage)**  
  **Objection:** "Your method excludes important work! E.g., studies on trauma responses can’t specify ancestral tasks—does that make them unscientific?"  
  **Reply:**  
  "Not unscientific, but *provisionally* conjectural. We might lack data to reconstruct ancestral triggers for trauma, so task specification may be infeasible. That doesn’t invalidate such work—but it should be framed as hypothesis-*generating*, not hypothesis-*testing*. The alternative is pretending we can test untestable claims, which fuels criticism."  
  **Weakness:** Risks alienating ev psych allies.  
  **Concede/Hold:** Conclude this excludes valuable research; hold that clarity about evidential status strengthens the field long-term.  

  ### **8. Formal Epistemologist (Low Likelihood & High Damage)**  
  **Objection:** "How do you *quantify* ‘constraint’? If I can always invent new hypotheses (e.g., ‘the trait is a spandrel of mechanism X designed for task Y’), isn’t your ‘constrained’ space still infinite?"  
  **Reply:**  
  "Constraints come from the *task structure itself*. If a mechanism must solve ‘locate safe food in <10 minutes with 95% accuracy’, hypotheses violating resource limits (e.g., ‘computationally intensive neural net’) are ruled out. The space is bounded by engineering feasibility—not infinite, just large. We prioritise hypotheses that meet the pre-specified benchmark *with minimal resources*."  
  **Weakness:** Feasibility is still subjective.  
  **Concede/Hold:** Concede absolute constraint is impossible; hold that task demands impose *practical* limits.  

  ---

  ### **THE QUESTION YOU HOPE NOBODY ASKS**  
  **Likely Asker:** Philosopher of Science / Social Psychologist coalition  
  **Question:** **"If 80% of ev psych is ‘conjectural’ by your standards, and task specification only rescues niche reverse-engineering, why not conclude the entire field is irredeemably flawed? Isn’t your ‘rescue’ just saving the furniture from a burning building?"**  

  **Why It’s Dangerous:** Forces you to defend ev psych’s value while admitting its flaws, and risks aligning you with "toxic" work.  
  **Reply Strategy:**  
  1. **Reframe:** "It’s not about saving a ‘building’ but building better tools. All sciences have speculative phases—the key is demarcation. Task specification isn’t niche; it’s the core of rigorous behavioural ecology.  
  2. **Pivot to Opportunity:** "This isn’t a death knell—it’s a roadmap. Much ‘conjectural’ work can *become* testable via task specification (e.g., by deriving performance criteria from ethnography).  
  3. **Moral High Ground:** "Dismissing the field outright cedes it to bad actors. Better to salvage the rigorous kernel and marginalise just-so stories."  
  **Concede:** Much current work *is* unsupported conjecture.  
  **Hold:** Reverse-engineering is both salvageable and scientifically vital.  

  ---

  **SUMMARY TACTICS**  
  - **To Philosophers:** Emphasise *demarcation* and testability.  
  - **To Ev Psych:** Position task specification as *strengthening* their best work.  
  - **To Social Psychologists:** Agree on risks but argue your method *reduces* them.  
  - **To Formalist:** Invite collaboration on next-step modelling.  
  - **Always:** Concede weaknesses where unavoidable, but never surrender the core thesis: **unconstrained spaces, not falsifiability, are the root problem.**  

  Good luck with the viva! Remember: "That’s beyond my thesis scope, but..." is a valid defence.
