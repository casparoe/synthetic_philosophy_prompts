prompt: |-
  I run a tiny reading group — four of us, two on each side — that spent most of last year on the causal exclusion argument and got exactly nowhere, so we've now agreed to do an adversarial collaboration and I got volunteered to draft the joint statement. Which I'd like you to do instead, because my own attempts keep getting recieved as slanted by whichever side I wasn't writing for that week. One side is the exclusionist: every physical effect that has a cause has a sufficient physical cause, mental properties aren't (at the level of types, anyway) physical properties, distinct sufficient causes don't systematically overdetermine the same effect, so the mental as such does no causal work, and the honest options are reduction or some weaker surrogate. The other side holds that mental properties do genuine causal work as difference-makers at the grain the special sciences actually use, and that the argument only bites if you smuggle a very particular picture of causation into the premises — single, sufficient, productive, and indifferent to how the effect is specified. Assume we've all read the standard material and nobody needs to be told who argued for what: no citations, no paper titles, nothing resting on the exact wording of a published argument, please. I want the claims, not the footnotes.

  What I'd like: (1) a numbered section of agreed claims — say five to ten, each genuinely load-bearing rather than the sort of thing nobody denies ('causation is contested' — I'll throw the document out); (2) a disagreements table with these columns: the crux, the exclusionist's own formulation (worded so they'd sign it), the non-reductivist's own formulation (same), the single case or argument both sides accept as bearing on that crux, and each side's prediction about how it comes out, written down in advance like a pre-registration; (3) an explicit note on which parts of our dispute, if any, turn out to be verbal, with the substantive version of each reformulated disagreement or an explanation of why there isn't one; (4) a short closing note from you as the drafter: which of the agreed claims you'd bet least on, what result or argument would actually move one or both camps, and where you think this whole exercise is most likely to fail — e.g. that the cruxes aren't independent, that one side wouldn't really accept the wording you gave it, or that the test cases can't discriminate between them.

  Two things to build in, because they're what my own drafts kept breaking on. First, I have a hunch the deep crux is whether 'sufficient' in the closure premise means sufficient for the *occurrence* of the effect or sufficient for the *difference* the effect consists in — tell me whether that distinction dissolves anything or just relocates the fight one step back. Second, here are the cases I want used as the shared probes; add your own if they don't discriminate. Locked Route: an agent's reaching is produced by neural route R1, which realizes the relevant intention-plus-belief state M, and there is a hardwired backup route R2 that doesn't fire but would have produced the very same reaching had R1 failed — did M cause the reaching? Scatter: across a population the same mental property M is realized by many different physical states, each of which produces the behavior, with no single physical-state type present in every case — did M cause the behavior, and does it matter that only M is invariant across the population? Grain Shift: the very same event described as 'the hand moved at t at velocity v' versus 'she reached for the glass' — does the exclusion pressure change with how the effect is specified, and if so which specification is the argument entitled to? For each, give me both camps' verdict and, more importantly, what each would count as having gone wrong if the other's verdict is right.
reasoning: |-
  We are drafting a joint statement for an adversarial collaboration on the causal exclusion argument. The group has two sides: exclusionists and non-reductivists. The exclusionist position is that mental properties do not cause physical effects because every physical effect has a sufficient physical cause, mental properties are not identical to physical properties (at least at the level of types), and systematic overdetermination is implausible. The non-reductivist position is that mental properties do cause behavior as difference-makers at the level of special sciences, and the exclusion argument depends on a particular conception of causation.

  We need:
  1. A numbered list of agreed claims (5-10, load-bearing).
  2. A disagreements table with columns: crux, exclusionist formulation, non-reductivist formulation, shared test case, and each side's prediction for the case.
  3. A note on verbal disputes and substantive reformulations.
  4. A closing note from the drafter.

  Additionally, address:
  - The distinction between "sufficient for occurrence" vs. "sufficient for the difference".
  - Test cases: Locked Route, Scatter, Grain Shift.

  Let's break it down step by step.

  ### Step 1: Agreed Claims
  We need claims that both sides genuinely accept. These should be substantive and relevant to the exclusion argument.

  Possible agreed claims:
  1. **Physical Causal Closure**: Every physical effect has a sufficient physical cause at some time.
     - Both sides accept this, but they may interpret "sufficient" differently. However, we can state it as agreed because it's a premise in the argument that both engage with.

  2. **Non-Identity**: Mental properties (as types) are not identical to physical properties (as types).
     - This is common ground; non-reductivists deny reduction but accept non-identity.

  3. **Causal Relevance of the Mental**: Mental properties are systematically correlated with certain behaviors (or physical effects) in a way that seems causal, and they are invoked in psychological explanations.
     - Both sides acknowledge the apparent causal relevance, but they disagree on whether it's real.

  4. **Avoidance of Systematic Overdetermination**: It is implausible that every behavior (or physical effect) is systematically overdetermined by two distinct sufficient causes (one mental and one physical) in all cases.
     - Both sides agree that systematic overdetermination is problematic and should be avoided.

  5. **Causation is a Relation Involving Properties**: Causation involves properties (or events under a description) making a difference to the effect.
     - Both sides accept that causation is not just between events simpliciter but involves how they are described.

  6. **Multiple Realizability**: Mental properties can be realized by multiple physical properties.
     - This is accepted by both, though exclusionists might see it as a challenge for mental causation, while non-reductivists see it as supporting their view.

  7. **The Challenge of Exclusion**: The exclusion argument presents a challenge that any theory of mental causation must address.
     - Both sides agree that the argument is a serious one that needs to be met.

  Let's aim for 7 agreed claims to be concise.

  ### Step 2: Disagreements Table
  We need to identify the key cruxes where the two sides diverge. For each crux, we provide:
  - The crux (the point of disagreement).
  - Exclusionist formulation (in their own words).
  - Non-reductivist formulation (in their words).
  - A shared test case (from the list: Locked Route, Scatter, Grain Shift, or add one).
  - Each side's prediction for the case and what would count as having gone wrong.

  Possible cruxes:

  **Crux 1: What does 'sufficient cause' mean?**
  - Exclusionist: A cause is sufficient for the occurrence of the effect, meaning that given the cause, the effect occurs in the context of the actual laws and background conditions.
  - Non-reductivist: A cause is sufficient for the effect only relative to a description of the effect and a level of grain; what matters is whether it is a difference-maker for the effect under the relevant description.

  **Crux 2: Is causation primarily productive or difference-making?**
  - Exclusionist: Causation involves a productive mechanism; the physical cause is the one that does the productive work.
  - Non-reductivist: Causation is about difference-making; a cause is a factor that makes a difference to whether and how the effect occurs, and this can be at multiple levels.

  **Crux 3: Does the mental property have causal efficacy in cases of multiple realization?**
  - Exclusionist: In cases of multiple realization, the mental property is not doing the causal work because the physical realizer is the one that actually produces the effect.
  - Non-reductivist: The mental property is causally efficacious because it is the invariant factor that makes the difference to the effect across variations in realization.

  **Crux 4: Does the exclusion argument apply equally to all descriptions of the effect?**
  - Exclusionist: The argument applies regardless of how the effect is described because the physical effect (at a fine grain) has a sufficient physical cause, and the mental is not identical to that cause.
  - Non-reductivist: The argument only bites if we describe the effect at the physical grain; when the effect is described at the mental grain (e.g., as an intentional action), the mental cause is the relevant difference-maker.

  Now, for the test cases:

  - **Locked Route**: Agent's reaching is produced by neural route R1 (which realizes mental state M), and there is a backup route R2 that would have produced the same reaching if R1 failed. Did M cause the reaching?
    - Exclusionist: M did not cause the reaching because the sufficient cause is R1, and M is not identical to R1. If R1 had not occurred, R2 would have caused the same reaching, so M is not necessary. But note: exclusionists might say that M is causally irrelevant because the physical cause (R1) is sufficient and non-overdetermination holds.
      - Prediction: M is not a cause of the reaching.
      - If wrong: If M is a cause, then overdetermination occurs (since R1 is also a cause) and that is implausible.
    - Non-reductivist: M did cause the reaching because M (via R1) is the actual difference-maker. The backup R2 is not active and thus not a cause. The presence of the backup doesn't make M any less a cause.
      - Prediction: M is a cause.
      - If wrong: If M is not a cause, then we cannot account for why the agent reached (as opposed to not reaching) in terms of their mental state.

  - **Scatter**: Across a population, the same mental property M is realized by many different physical states, each producing the same behavior. Only M is invariant. Did M cause the behavior?
    - Exclusionist: M did not cause the behavior because in each instance, the physical realizer is the sufficient cause. The invariance of M is epiphenomenal; it doesn't do any work.
      - Prediction: M is not a cause.
      - If wrong: If M is a cause, then we have overdetermination in each case (by M and the physical realizer) and that is implausible.
    - Non-reductivist: M did cause the behavior because it is the common factor that explains the behavior across variations in physical realization. It is the difference-maker at the psychological level.
      - Prediction: M is a cause.
      - If wrong: If M is not a cause, then we cannot explain the generalization that whenever M is present, the behavior occurs, regardless of the physical realization.

  - **Grain Shift**: The effect described as (a) 'the hand moved at t at velocity v' versus (b) 'she reached for the glass'. Does the exclusion pressure change?
    - Exclusionist: The exclusion pressure is the same because the physical effect (the hand movement) has a sufficient physical cause. The mental cause (if any) would overdetermine it. The coarse-grained description doesn't change the underlying physical event.
      - Prediction: Exclusion applies equally to both descriptions.
      - If wrong: If exclusion applies only to (a) but not (b), then we are allowing that the same event can have a non-physical cause under a different description, which undermines physical closure.
    - Non-reductivist: The exclusion pressure changes because under description (a), the physical cause is the difference-maker, but under (b), the mental cause (the intention) is the relevant difference-maker. The mental cause does not compete with the physical cause for the effect under the intentional description.
      - Prediction: Exclusion applies to (a) but not to (b).
      - If wrong: If exclusion applies to both, then we cannot have mental causation for intentional actions, which is counterintuitive and undermines the special sciences.

  ### Step 3: Note on Verbal Disputes
  We need to identify if any part of the dispute is verbal, i.e., due to different uses of terms like "cause", "sufficient", etc. Then, reformulate the substantive disagreement.

  Possible verbal issue: 
  - The term "sufficient" might be ambiguous: does it mean sufficient for occurrence (metaphysical sufficiency) or sufficient for the difference (explanatory sufficiency)? 

  Substantive reformulation:
  - If we clarify that "sufficient for occurrence" means that the cause guarantees the effect in the context, and "sufficient for the difference" means that the cause is the factor that accounts for why the effect occurred rather than not (or in that way), then the dispute becomes: 
    - Exclusionist: The physical cause is sufficient for the occurrence, and that is what matters for closure.
    - Non-reductivist: What matters for causation is being sufficient for the difference relative to a contrast class and a description.

  But the distinction might not dissolve the dispute; it relocates it to the question of what kind of sufficiency is required for causation.

  Another verbal issue: 
  - "Causation" might be used in different senses (e.g., production vs. difference-making). 

  Substantive reformulation:
  - The dispute is about which concept of causation is correct or which one is relevant for mental causation.

  ### Step 4: Drafter's Closing Note
  - **Which agreed claim I'd bet least on**: Probably the agreement on "avoidance of systematic overdetermination" because it might be that one side (non-reductivist) has a way of denying that their view entails systematic overdetermination (e.g., by saying that the mental and physical causes are not independent or that they are at different levels). So, the agreement might be superficial.

  - **What would move the camps?**
    - For exclusionists: If it could be shown that the physical cause is not sufficient for the effect under the relevant description (e.g., in Grain Shift, that the physical cause does not account for why the action was a reaching for the glass).
    - For non-reductivists: If it could be shown that even at the coarse-grained level, the mental property does not make a difference in a way that isn't already accounted for by the physical (e.g., in Scatter, if the invariance of M is not necessary for the behavioral regularity).

  - **Where the exercise might fail**:
    - The cruxes might not be independent; for example, the meaning of 'sufficient' might affect multiple cruxes.
    - One side might not accept the wording of their formulation in the table.
    - The test cases might not be decisive because each side can interpret them within their own framework.

  Now, let's write the document.
answer: |-
  ### Joint Statement: Adversarial Collaboration on Causal Exclusion  
  **Drafted by Neutral Facilitator**  

  ---

  #### 1. Agreed Claims (Load-Bearing)  
  Both sides endorse the following substantive claims as foundational:  
  1. **Physical Causal Closure (PCC)**: Every physical effect has *a* sufficient physical cause at some time prior to or concurrent with its occurrence.  
  2. **Non-Identity**: Mental properties (as types) are not identical to physical properties (as types).  
  3. **No Widespread Overdetermination**: It is implausible that every physical effect has two *distinct* sufficient causes (e.g., one mental, one physical) in all cases.  
  4. **Causal Relevance of Mental Properties**: Mental properties are reliably correlated with specific behaviors in explanatory patterns (e.g., beliefs/intentions covary with actions).  
  5. **Multiple Realizability**: A given mental property (e.g., pain) can be realized by diverse physical properties across contexts or individuals.  
  6. **Causal Relata**: Causes and effects are events under descriptions; redescribing an event can alter causal attributions.  
  7. **Exclusion Pressure**: The conjunction of PCC, Non-Identity, and No Widespread Overdetermination generates a prima facie challenge for mental causation.  

  ---

  #### 2. Disagreements Table  
  | Crux | Exclusionist Formulation | Non-Reductivist Formulation | Shared Test Case | Predictions |  
  |------|--------------------------|------------------------------|-----------------|-------------|  
  | **What "sufficient cause" entails** | "Sufficient cause" means a cause that guarantees the *occurrence* of the effect given the laws and background conditions. Physical causes are sufficient in this sense, leaving no causal "gap" for non-physical properties. | "Sufficient cause" must account for the *difference* the effect makes relative to alternatives. Physical causes may suffice for occurrence but not for coarse-grained differences (e.g., intentional actions). | **Grain Shift**: Effect described as (a) 'hand moved at t at velocity v' vs. (b) 'she reached for the glass'. | **Exclusionist**: Pressure applies identically to (a) and (b); same physical effect, same exclusion. *If wrong*: Coarse-grained effects escape PCC, violating physical closure. <br> **Non-Reductivist**: Pressure applies only to (a); (b) requires mental difference-makers. *If wrong*: All causal claims reduce to microphysics, trivializing special sciences. |  
  | **Causal efficacy of multiply realized properties** | A property must be identical to (or supervene on) the physical cause to be efficacious. Multiply realizable properties are epiphenomenal because they lack direct productive power; only physical realizers do causal work. | Properties are efficacious if they are difference-makers under invariant generalizations. Multiply realizable properties (e.g., M) are causal when they track behavioral outcomes across realizers. | **Scatter**: M (e.g., intention) is realized by distinct physical states P1, P2,...Pn across a population; only M is invariant. | **Exclusionist**: M is inert; P1...Pn are the true causes. *If wrong*: Systematic overdetermination occurs (M + Pn each suffice). <br> **Non-Reductivist**: M causes the behavior *because* it is invariant. *If wrong*: Explanatory patterns in psychology are illusory. |  
  | **Threat of overdetermination** | If M and P are distinct sufficient causes for effect E, this implies implausible systematic overdetermination unless M reduces to P. | Overdetermination is avoided if M and P are not independent: P *realizes* M, so they constitute a single causal chain. M causes E *via* P. | **Locked Route**: Reaching caused by neural route R1 (realizing M); backup R2 (non-mental) would produce same reaching if R1 fails. | **Exclusionist**: M is not a cause; R1 is sufficient. *If wrong*: M and R1 overdetermine E, violating No Widespread Overdetermination. <br> **Non-Reductivist**: M causes the reaching; R2 is irrelevant. *If wrong*: Mental causation requires necessity, but M isn’t necessary here. |  

  ---

  #### 3. Verbal Disputes and Substantive Reformulations  
  - **Verbal Dispute**: "Sufficient cause" is ambiguous.  
    - *Exclusionist* uses it as "sufficient for *occurrence*" (metaphysical guarantee).  
    - *Non-Reductivist* uses it as "sufficient for the *difference*" (explanatory relevance).  
    - **Substantive Reformulation**: Does PCC entail that physical causes exhaust *all* causal relations (including explanatory ones), or only guarantee the effect’s occurrence? The crux persists: whether causation is solely about production or includes difference-making.  

  - **No Other Verbal Disputes Identified**: Remaining disagreements are substantive (e.g., whether properties or mechanisms are primary in causation).  

  ---

  #### 4. Drafter’s Closing Note  
  **Least Confident Agreed Claim**: Claim 3 ("No Widespread Overdetermination"). The non-reductivist might later argue that their view avoids overdetermination by denying causal independence, potentially reframing this as a point of disagreement.  

  **What Would Move the Camps**:  
  - **Exclusionist**: Evidence that a physical cause is insufficient for a coarse-grained effect (e.g., in **Grain Shift**, showing that the physical description cannot predict whether the motion constitutes "reaching").  
  - **Non-Reductivist**: Proof that invariance (e.g., in **Scatter**) is irrelevant to causal power (e.g., a case where an invariant M correlates with behavior but Pn manipulations break the correlation).  

  **Where This Exercise Fails**:  
  - **Cruxes Aren’t Independent**: The "sufficiency" crux underlies the others. If resolved, others may collapse, but it relocates rather than dissolves the fight (e.g., to "What is causation?").  
  - **Wording Rejection Likelihood**: Exclusionists may balk at the non-reductivist’s "difference-maker" formulation as conflating explanation with causation.  
  - **Test Cases Lack Discrimination**: Cases like **Locked Route** are interpretable both ways (e.g., non-reductivists see R2 as irrelevant; exclusionists see it as disproving M’s necessity). A better probe might be a case where M is present but P is absent (if conceivable), but current cases are borderline.  

  **On Your Distinction**: "Sufficient for occurrence" vs. "sufficient for the difference" doesn’t dissolve the dispute—it **relocates it one step back** to the nature of causation. Exclusionists tie causation to production (occurrence suffices); non-reductivists tie it to difference-making (contextual sufficiency). This is the core fracture.  

  ---  
  *Draft end. Revise collaboratively to ensure formulations capture each side’s commitments.*
