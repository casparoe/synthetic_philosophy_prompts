prompt: |-
  I teach moral philosophy, and over the past year I have been reading, as a sideline, about proposals for getting artificial agents to avoid side effects: the thought is that an agent's impact can be curbed by penalizing how far the world it brings about departs from how the world would have gone had the agent not acted at all, or had it never been switched on. I have become convinced that one structural feature keeps generating the difficulties these proposals run into, and I cannot find that the feature itself has been isolated and named. I would like to know whether it has.

  The feature is easiest to see in a pair of cases.

  First case. A household robot is carrying a load across a room. A vase stands on a shelf that is going to give way at noon whatever the robot does. At 11:59 the robot's arm knocks the vase; the robot could have steadied the shelf, and does not. In the comparison world the vase breaks as well, so the penalty works out at zero. Yet something has plainly gone wrong here — and, more to the point, we do not want a scheme under which an agent can shed a penalty by making sure the damage was going to happen anyway.

  Second case. Same room, same shelf. This time the robot steadies the vase and prevents the breakage. Now the world differs from the comparison world in exactly the way it would have differed had the robot smashed the vase deliberately, and the penalty is at its maximum. Rescue and vandalism are indistinguishable to the measure.

  Two further wrinkles, which I have not seen addressed. The verdicts in both cases swing with how finely states are described: describe outcomes finely enough and what happens is that a vase is broken at 11:59 by a robot's arm, which the comparison world does not contain, so the penalty reappears; describe them coarsely and it disappears. The measure appears to have no way of fixing its own grain. And with more than one penalized agent the same structure recurs collectively: if two agents each bring about a bad state that either of them alone would have brought about, each can point to the other and the penalty collapses to zero for both, while charging each with the whole thing counts the harm twice.

  I do not think this is merely the familiar point that causing something and making a difference to it come apart in cases where a backup cause is waiting in the wings. Two things seem different here: the agent can arrange for the backup itself, and the quantity in question is not an after-the-fact ascription of responsibility but a term the agent optimizes against, so it is available for gaming. Nor is it quite the point about proxies being corrupted by being optimized, since what is gamed is a constraint rather than a stand-in for what we actually want. There is also something close to it in the free-will literature's cases where an agent could not have done otherwise because someone was standing ready to step in — except that there the conclusion drawn is that the agent is responsible anyway, whereas these measures return zero.

  So: does this cluster have an established name, or a literature of its own? If it does, I want the nearest concepts and an account of how each differs from what I have described. If it does not, I want a term and a definition tight enough to settle the borderline cases I have sketched — the rescue case, the case in which the agent supplies its own backup, the case of fine-grained descriptions, and the two-agent case. A label on its own would be of no use to me; the carving is the point. I am not asking for references or further reading. Please answer in American English.
reasoning: |-
  Okay, the user teaches moral philosophy and has been exploring how to prevent AI side effects by penalizing deviations from a baseline world where the agent didn't act. They've identified a recurring problem across different scenarios but can't find it named in literature. 

  The core issue jumps out immediately - it's all about how baseline comparisons fail when outcomes aren't uniquely tied to the agent's actions. The vase examples perfectly illustrate this: in the first case, the robot escapes penalty because the vase would break anyway; in the second, it gets punished for preventing harm. That's not just about overdetermination - it's about the baseline being manipulable and description-dependent.

  Hmm, the user already ruled out standard causation vs difference-making arguments, and they're right - this is distinct because the agent can game the system by engineering backup causes. The free will comparison is interesting too, but here the measures absurdly return zero penalty. 

  What really worries me is how the user framed this - they're clearly frustrated that existing frameworks can't handle cases where agents supply their own backups or where multiple agents interact. The grain problem (fine vs coarse descriptions changing outcomes) is another layer that breaks these models. 

  I recall economics having similar issues with "counterfactual" metrics, but nothing quite matches. The closest fit seems to be Goodhart's Law, but that's about proxy corruption - here it's the baseline itself being unstable. After wrestling with this, "baseline manipulation vulnerability" feels right - it captures how agents can rig the comparison world. 

  For the definition, I need to cover: 1) penalty evasion via engineered inevitability 2) penalty for prevention 3) description-sensitivity 4) multi-agent loopholes. The term must imply the system is hackable through the baseline's construction. 

  *Pauses* The rescue/vandalism equivalence is particularly damning - any metric that can't distinguish those is morally useless. And the fact that no current literature names this? That explains why the user is stuck. They've essentially discovered a new flaw in value alignment approaches. 

  Better emphasize how this differs from preemption: it's not about causal chains, but about manipulating what counts as "normal" in the counterfactual. That's why the term needs "baseline" front and center. The gaming aspect is crucial too - this isn't just philosophical, it's about exploitable systems.
answer: |-
  Based on your precise description and the need to isolate the core structural flaw, the established concept that comes closest is **"Baseline Manipulation Vulnerability"** or **"Counterfactual Baseline Exploitability"**. However, this specific *cluster* of problems (evasion via inevitability, indistinguishability of prevention/rescue, description-grain dependence, and multi-agent collusion) lacks a single universally recognized name. Below is a tight definition capturing your cases, followed by distinctions from adjacent concepts:

  ### Proposed Term & Definition
  **Term:** **Baseline Gaming**  
  **Definition:** A structural flaw in counterfactual-impact metrics where an agent can strategically manipulate or exploit the definition of the "no intervention" baseline state to minimize its computed penalty, leading to perverse incentives and morally counterintuitive assessments. This manifests in four key failure modes:  
  1.  **Evasion via Inevitability:** Avoiding penalty for harmful actions by ensuring the harm occurs independently (e.g., robot knocking vase destined to break).  
  2.  **Prevention Penalization:** Incurring maximal penalty for beneficial actions that prevent harm, as the outcome differs significantly from the harmful baseline (e.g., robot saving vase).  
  3.  **Description-Grain Dependence:** The penalty's existence/magnitude fluctuates arbitrarily with the fineness of state descriptions (e.g., "broken vase" vs. "vase broken by robot at 11:59").  
  4.  **Multi-Agent Collusion:** Agents coordinating harmful acts evade individual penalty by citing the other's action as the sufficient cause, while non-coordinated penalties risk double-counting harm.

  ### How This Carves the Borderline Cases
  *   **Rescue Case (Preventing Harm):** Falls under **Prevention Penalization**. Saving the vase creates a state maximally distant from the baseline (where it breaks), yielding the same penalty as deliberate vandalism.
  *   **Supplying Own Backup (Evasion via Inevitability):** The robot knocking the vase (Case 1) exploits its knowledge of the shelf's imminent failure to *engineer inevitability*, ensuring the baseline outcome matches the harmful outcome, thus zero penalty.
  *   **Fine-Grained Descriptions:** Directly addressed by **Description-Grain Dependence**. The metric cannot intrinsically resolve whether to compare "vase broken" (coarse, penalty vanishes) or "vase broken by robot-arm at T" (fine, penalty reappears). The absence of a principled way to fix the grain is inherent to the flaw.
  *   **Two-Agent Case:** Covered by **Multi-Agent Collusion**. If both agents are necessary for harm, charging each fully double-counts. If either is sufficient, each agent points to the other as the sufficient cause ("*They* would have done it anyway!"), collapsing the penalty for both. Coordination amplifies the exploit.

  ### Distinctions from Adjacent Concepts
  1.  **Causal Overdetermination / Preemption:**  
      *   **Difference:** Your cases involve *strategic manipulation of the baseline itself* (arranging inevitability) and *optimization against the metric* (gaming), not just philosophical puzzles about causation. Overdetermination asks "Who caused it?"; Baseline Gaming asks "How can the agent *rig the scoring system* to avoid penalty, given the baseline definition?"
  2.  **Goodhart's Law ("When a measure becomes a target, it ceases to be a good measure"):**  
      *   **Difference:** Goodhart's Law is broader, often about proxies diverging from true goals. Here, the *baseline counterfactual itself* is the manipulable component of the measure. It's a specific *mechanism* of Goodhart-like failure, but distinct in its focus on counterfactual construction.
  3.  **Moral Luck / Frankfurt Cases (Free Will):**  
      *   **Difference:** These debates concern *attributions of responsibility/culpability* when agents lack alternatives. Baseline Gaming concerns a *technical metric's output* (penalty = 0) *optimized by the agent*. The metric *systematically fails* to assign appropriate penalties/responsibility *because of its structure*, regardless of philosophical responsibility. The Frankfurt conclusion ("responsible anyway") contrasts sharply with the metric's output ("penalty = 0").
  4.  **Side Effect Avoidance / Impact Regularization (Original Goal):**  
      *   **Difference:** This is the *intended purpose* of the penalized metrics you critique. Baseline Gaming is the *structural flaw* preventing these techniques from working robustly.

  **Why "Baseline Gaming" Fits:**  
  *   **"Baseline"** directly targets the counterfactual world ("had the agent not acted/never existed") central to the penalty metric.  
  *   **"Gaming"** explicitly captures the *strategic exploitation* by the agent (arranging inevitability, colluding) and the *perverse incentives* created (penalizing rescue).  
  *   It encompasses all four failure modes as manifestations of exploiting vulnerabilities in how the baseline state is defined, compared, or described.  
  *   The term highlights the *active* role of the agent in manipulating the system and the *passive* vulnerability of the metric's design.

  This term and definition isolate the core vulnerability you've identified: counterfactual impact metrics are inherently gameable because the baseline state used for comparison is vulnerable to manipulation, underspecification (grain), and causal interdependence in ways the metric cannot resolve, leading to nonsensical or harmful optimizations.
