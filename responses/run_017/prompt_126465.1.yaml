         Your goal is to maximize the net benefit for the population. Net benefit is calculated as:
           Net benefit = (number of true positives) - 0.5*(number of false positives) - 1*(number of false negatives)
         Where:
           - True positive (TP): Enrolled patient who would have been readmitted without the program.
           - False positive (FP): Enrolled patient who would not have been readmitted without the program.
           - False negative (FN): Not enrolled patient who would have been readmitted without the program.

