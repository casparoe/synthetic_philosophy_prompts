  Score | Patients | Event Rate (without program)
  20    | 300      | 20%
  40    | 250      | 40%
  60    | 200      | 60%
  80    | 150      | 80%
  100   | 100      | 100%

  For Activity 3 (Year 1 enrolled data with threshold 40 for both groups):

  City Hospital (enrolled patients in Year 1):
  Score | Patients | Readmissions (with program)
  40    | 150      | 30
  60    | 200      | 60
  80    | 250      | 100
  100   | 300      | 150

  Clinic (enrolled patients in Year 1):
  Score | Patients | Readmissions (with program)
  40    | 250      | 50
  60    | 200      | 60
  80    | 150      | 60
  100   | 100      | 50

  And for Year 2, the population is the same as Year 1, but you won't give them the Year 2 data; they only have the Year 1 enrolled data to inform them.

  For the facilitator, you have the Year 1 and Year 2 populations (which are the same) and can compute the audits for any threshold.

  To compute quickly, you might precompute the net benefit and error rates for a range of thresholds.

  For example, for a threshold T, for a group:

    Enrolled: patients with score>=T
    TP = sum over scores>=T of (patients * event rate)
    FP = sum over scores>=T of (patients * (1 - event rate))
    FN = sum over scores<T of (patients * event rate)

  Then net benefit = TP - 0.5*FP - 1*FN

  FPR = FP / (FP + TN), where TN = sum over scores<T of (patients * (1 - event rate))

  FNR = FN / (FN + TP)

  And for Activity 3, they set thresholds based on the partial data, then you do the same computation for Year 2.

  We'll assume Year 2 population is identical to Year 1.

  This should work.

