    Total events in CH enrolled: 30+60+100+150=340 events? But remember, the program effect is 50% reduction, so event rate is half.

    Without program, they would have had 60+120+200+300=680 events, so with program, they have 680/2=340 events.

    For CL enrolled (>=40): without program events=440, with program=220 events.

