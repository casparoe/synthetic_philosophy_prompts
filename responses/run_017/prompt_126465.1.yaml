  Then after they choose, we hand out the audit results for their threshold, which shows for each group:
     - Number of TP, FP, FN, TN
     - FPR = FP / (FP+TN)
     - FNR = FN / (FN+TP)
     - Also, calibration: for each score bin, the event rate and the number in that bin, to show it's well-calibrated.

  The audit will reveal that the error rates are different.

  Then for Activity 2 (Round 2): 
