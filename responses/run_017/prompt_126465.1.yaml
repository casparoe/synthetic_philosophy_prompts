    And for the unenrolled, they don't have data.

    Now, in Year 2, they have a new population with the same characteristics as Year 1 (so we use the same distribution as Year 1 for both groups). But when they try to audit the model using the Year 1 data, they only have the enrolled patients. So they might see that for a given score, the event rate is half of what the model says? For example, for CH score40: event rate in the data is 30/150=0.2, but the model says 0.4. So they might think the model is overpredicting.

