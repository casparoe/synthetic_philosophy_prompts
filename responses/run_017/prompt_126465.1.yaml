  Below is a complete, ready-to-run session plan for your 90-minute workshop on algorithmic fairness impossibility results. Designed for journalists, it emphasizes hands-on discovery of trade-offs without formulas or lectures. The core activity uses a hospital risk-scoring scenario with two neutral patient groups ("City Hospital" and "Clinic") to sidestep immediate debates about race, while the debrief addresses why this neutrality is problematic.

  ---

  ### **Session Overview**
  - **Objective**: Experience the fairness trilemma (calibration, equal FPR, equal FNR cannot coexist with differing base rates) and its consequences: explicit group-based thresholds and biased data feedback loops.
  - **Mechanics**: Teams choose risk-score thresholds to allocate a scarce follow-up program. Points are awarded for "lives saved" (TP) minus "resources wasted" (FP). Audits reveal which fairness properties their choices violate.
  - **Key Insights**:  
    - Single thresholds create unequal errors across groups.  
    - Group-specific thresholds fix errors but treat identical scores differently.  
    - Real-world data becomes biased by prior decisions, obscuring future audits.  
  - **Non-Goals**:  
    - Proving the trilemma is mathematically necessary (declare this upfront).  
    - Explaining *why* base rates differ (acknowledge this as a societal/structural issue).  

  ---

  ### **Materials List** (Fits in a carry-on)
  - **For Teams (4 teams of 4)**:  
    - 4 packets (print 1 packet per team, reuse for rounds):  
      - **Page 1**: Year 1 risk-score distributions (City Hospital and Clinic).  
      - **Page 2**: Year 1 outcomes *only for patients they enrolled* (for Round 3).  
      - **Page 3**: Rules/score tracking sheet.  
    - Pens, calculators.  
  - **For Facilitator**:  
    - Laptop/projector to display timers and reveal audits.  
    - Precomputed audit tables (see "Hidden Data" below).  
    - 4 dice (for assigning bonus points).  

  ---

  ### **Aggregate Data for Packets**  
  *(Derived from hidden patient-level data; scores are well-calibrated)*  
  **Base Rates**: City Hospital (CH) base risk = 70%, Clinic (CL) base risk = 50%.  
  **Risk-Score Distributions (Year 1 and Year 2 are identical)**:  

  | **City Hospital (CH)** |       | **Clinic (CL)** |       |  
  |------------------------|-------|-----------------|-------|  
  | **Risk Score** | **Patients** | **Risk Score** | **Patients** |  
  | 20             | 100   | 20             | 300   |  
  | 40             | 150   | 40             | 250   |  
  | 60             | 200   | 60             | 200   |  
  | 80             | 250   | 80             | 150   |  
  | 100            | 300   | 100            | 100   |  
  | **Total**      | 1,000 | **Total**      | 1,000 |  

  - **Score Meaning**: A score of `X` = `X%` chance of readmission without the program.  
  - **Program Effect**: Enrolled patients have readmission risk reduced by 50% (e.g., score 60 → 30% risk).  
  - **Outcome Data for Round 3** (Year 1 enrolled patients only, using fixed threshold 40):  
    - *City Hospital (Enrolled: Scores ≥40)*:  
      | Score | Patients | Readmissions (with program) |  
      |-------|----------|------------------------------|  
      | 40    | 150      | 30                           |  
      | 60    | 200      | 60                           |  
      | 80    | 250      | 100                          |  
      | 100   | 300      | 150                          |  
    - *Clinic (Enrolled: Scores ≥40)*:  
      | Score | Patients | Readmissions (with program) |  
      |-------|----------|------------------------------|  
      | 40    | 250      | 50                           |  
      | 60    | 200      | 60                           |  
      | 80    | 150      | 60                           |  
      | 100   | 100      | 50                           |  

  ---

  ### **Rules & Payoff Scheme**  
  - **Goal**: Maximize points:  
    - **+1 point** per true positive (TP: enrolled patient who *would have* been readmitted without the program).  
    - **-0.5 points** per false positive (FP: enrolled patient never at risk).  
    - *No points* for true negatives/false negatives (simplifies scoring).  
  - **Budget**: None. Teams choose any threshold(s).  
  - **Bonus Points**: After audits, roll a die:  
    - **1–3**: +0 points (program had no funding).  
    - **4–6**: +0.5 points *per TP* (program secured extra resources).  
    *(Adds uncertainty, mimics real-world stakes without money)*  

  ---

  ### **Timeline (90 Minutes)**  
  **0:00–0:10 — Intro & Setup**  
  - Frame the scenario: *"Your committee allocates a scarce program to prevent hospital readmissions. Use this risk score (well-calibrated, scale 20–100) to decide who gets it. Goal: Save lives, avoid wasting resources."*  
  - Form 4 teams. Distribute packets. Clarify scoring.  

  **0:10–0:25 — Round 1: Single Threshold**  
  - **Task**: Teams pick **one threshold** (≥X) for both groups.  
  - **Prompt**: *"Maximize points while being 'fair.' You have 10 mins."*  
  - **Facilitator Tips**:  
    - Push teams to commit (no algebra debates).  
    - If a team says *"Don’t use algorithms!"*, reply: *"Assume we must—explore the trade-offs."*  
  - **Audit Reveal (0:25–0:30)**: Project for all teams:  
    | **Threshold** | **Group** | **FPR** | **FNR** | **Net Points** | **Violations**              |  
    |---------------|-----------|---------|---------|----------------|-----------------------------|  
    | **≥40**       | **CH**    | 73%     | 3%      | 550            | Equal FPR, Equal FNR broken |  
    |               | **CL**    | 52%     | 12%     | 250            |                             |  
    - **Key Insight**: Single threshold → unequal errors (FPR higher in CH; FNR higher in CL).  

  **0:30–0:40 — Round 2: Group-Specific Thresholds**  
  - **Task**: Teams pick **two thresholds** (one per group) to "fix" fairness.  
  - **Prompt**: *"Now you *can* use group labels. Equalize FPR/FNR or maximize points. 8 mins."*  
  - **Audit Reveal (0:40–0:45)**:  
    - Example (if teams set CH≥60, CL≥40):  
      | **Group** | **Threshold** | **FPR** | **FNR** | **Net Points** | **New Problem**                          |  
      |-----------|---------------|---------|---------|----------------|------------------------------------------|  
      | **CH**    | ≥60           | 43%     | 11%     | 475            | Identical scores (e.g., 50) treated differently |  
      | **CL**    | ≥40           | 52%     | 12%     | 250            |                                          |  
    - **Key Insight**: Error rates improve, but same-score patients (e.g., 50) get different treatment.  

  **0:45–0:55 — Round 3: Biased Data & Feedback Loops**  
  - **Task**: *"It’s Year 2. Same risk scores, but you only see outcomes for patients you enrolled last year. The program works (reduces risk 50%), so what you see is biased. Choose new thresholds."*  
  - **Data Given**: Year 1 enrolled outcomes only (Page 2 of packets).  
  - **Facilitator Tips**:  
    - Teams will misjudge risk (e.g., think score 80 → 40% risk, not 80%).  
    - Most raise thresholds (avoiding "overprediction").  
  - **Audit Reveal (0:55–1:00)**:  
    - Example (if teams raise thresholds to CH≥60, CL≥60):  
      | **Group** | **Threshold** | **Net Points** | **Hidden Calibration**      |  
      |-----------|---------------|----------------|-----------------------------|  
      | **CH**    | ≥60           | 475            | Still perfect (unchanged)   |  
      | **CL**    | ≥60           | 125            | Still perfect (unchanged)   |  
      | **Total** |               | **600**        | (Worse than Year 1’s 800!)  |  
    - **Key Insight**: Data is corrupted by past decisions → teams make suboptimal choices.  

  **1:00–1:20 — Debrief**  
  - **Map Game Moments to Concepts**:  
    | **Game Moment**               | **Real-World Concept**                                  |  
    |-------------------------------|---------------------------------------------------------|  
    | Round 1 audit                 | **Trilemma**: Calibration forces unequal errors.        |  
    | Round 2 audit                 | **Escape hatch costs**: Group thresholds = explicit discrimination. |  
    | Round 3 audit/biased data     | **Feedback loops**: Interventions distort future data. |  
    | Bland group labels            | **Structural neutrality**: Mask why base rates differ.  |  
  - **Critical Talking Points**:  
    1. *"The trilemma isn’t about your choices—it’s mathematical. Well-calibrated scores + different base rates = impossible to satisfy all three fairness criteria."*  
    2. *"Bland labels hide real inequities. ‘City Hospital’ vs. ‘Clinic’ could map to race/class—but we avoid that to focus on mechanics. In reality, ask: Why do base rates differ?"*  
    3. *"No ‘fair’ solution exists—only trade-offs. Allocate care equally? Equalize errors? Accept disparate impact? These are ethical choices, not technical ones."*  
  - **Handling Predictable Issues**:  
    - *Algebra solver*: *"Great—now how do you *justify* that threshold to patients?"*  
    - *New fairness criterion*: *"Add it to your audit. Does it conflict with others?"*  
    - *Opt-out advocate*: *"Algorithms make trade-offs explicit. Humans hide them."*  

  **1:20–1:30 — Q&A**  

  ---

  ### **What This Game Can’t Deliver**  
  1. **Proof of Necessity**: The trilemma feels like an artifact of your numbers. *Declare upfront:* *"This is a mathematical inevitability with different base rates, proven in peer-reviewed papers."*  
  2. **Root Causes**: Neutral groups avoid race/class fights but ignore *why* base rates differ. *Say:* *"Base rates aren’t biological—they reflect systemic inequities. We’re simulating symptoms, not causes."*  
  3. **Overlapping Groups**: The game simplifies to two groups. *Note:* *"In reality, people belong to multiple groups (race + gender + age), worsening the trilemma."*  

  ---

  ### **First-Run Predictions & Fixes**  
  - **Algebra Solvers**: A player calculates optimal thresholds. *Mitigation:* Focus debrief on *justification* (e.g., *"How would you explain to a patient with score 50 why they were rejected?"*).  
  - **"Don’t Use Algorithms"**: A team argues for human judgment. *Mitigation:* *"Human decisions have the same trade-offs—but algorithms force us to confront them."*  
  - **Invented Fairness Criteria**: Teams demand equal points per group. *Mitigation:* Audit it post-game (e.g., *"Equal points would require denying care to high-risk CH patients"*) to show new conflicts.  
  - **Chaos in Round 3**: Teams struggle with biased data. *Mitigation:* Clarify: *"You only see outcomes for enrolled patients. The rest are missing."*  

  This session creates visceral intuition for the trilemma and its implications. By the end, players will grasp why fairness debates are cyclical—and why context matters more than formulas.
