    At threshold 80: non-events at80+100=50+0=50
    So they can't hit exactly 150.

  At threshold 60: FP=130, which is less than 150.
  At threshold 40: FP=220.

  So they can't achieve FPR=0.5 exactly.

  Similarly for CL.

  For the game, we'll let them choose thresholds and then we'll compute the metrics.

