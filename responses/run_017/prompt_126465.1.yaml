    Alternatively, we can compute the audit using the with-program outcomes? But then the event rates are lower.

    I think we should compute the without-program outcomes for the Year 2 population to see the true performance of the model.

    So after they set thresholds for Year 2, we give them an audit that shows for Year 2:
        - The net benefit (computed based on without-program outcomes, but with-program applied for those they enrolled)
        - The error rates by group (computed from the without-program outcomes)

    But note: in Year 2, they applied the program, so the outcomes are with-program. However, for the purpose of the model audit (which is to predict without-program), we can still compute the without-program outcomes? We have them because we generated the population.

    So the audit will show that the model is still well-calibrated (because we know the without-program event rates) and then show the error rates and the net benefit.

    The point is that they might have changed the threshold based on the biased data, leading to suboptimal or unfair decisions.

    For example, they might think the model is overpredicting, so they raise the threshold, which might lead to more false negatives.

  Materials list:
    - Packets for each team: 
        Activity 1: instructions and data tables for Year 1 (CH and CL)
        Activity 2: instructions for Round 2
        Activity 3: instructions for Year 2 and the Year 1 enrolled data (for threshold 40, fixed)
    - A master spreadsheet for the facilitator to compute the audits quickly.
    - Pen and paper for teams.

  Timeline:
    0:00 - 0:10: Introduction (explain the scenario and the goal)
    0:10 - 0:25: Activity 1 (choose single threshold)
    0:25 - 0:35: Reveal audit for Activity 1 and quick discussion
    0:35 - 0:45: Activity 2 (choose two thresholds)
    0:45 - 0:55: Reveal audit for Activity 2 and quick discussion
    0:55 - 1:10: Activity 3 (Year 2, with partial data)
    1:10 - 1:20: Reveal audit for Activity 3 and discussion
    1:20 - 1:30: Debrief

  Debrief points:
    - In Activity 1: with one threshold, you saw that the error rates were different across groups. Why? Because the base rates were different (CH had higher base rate). The model is well-calibrated, but the distribution of risk scores is different: CH has more high-risk patients.
    - In Activity 2: you could set different thresholds to make error rates more equal, but then you are explicitly using group membership, and patients with the same score get different treatment. Is that fair? That's the trade-off.
    - In Activity 3: you only saw data for the patients you enrolled. That data showed lower event rates because of the program. So you might have thought the model was overpredicting, but it wasn't. The data was biased by your own intervention. This is a common problem in algorithmic fairness: the data you collect is influenced by your past decisions.

  What will go wrong:
    1. Someone does the algebra: They might calculate the optimal threshold. That's okay. You can say: "Yes, you can find the optimal for net benefit, but then you still have the fairness issue."
    2. Someone says: "Just don't use algorithms." You can say: "Even human decisions face these trade-offs, but algorithms make them explicit. This exercise is to show that there is no perfect solution."
    3. A team invents a new fairness criterion: Acknowledge it and say that there are many fairness definitions, and they might conflict. You can note that in the debrief.

  What the game can't deliver:
    - The trilemma is necessary, not an artifact of the numbers. You can say: "This result has been mathematically proven for any well-calibrated risk score when base rates differ."
    - It doesn't address why the base rates differ. You can say: "The differences in base rates might be due to societal factors, and addressing those is important, but in the short term, the algorithm faces this trilemma."

  You can say in five minutes: 
    "The takeaway is that when you have a well-calibrated risk score and groups have different base rates, you cannot have the same false positive rate and false negative rate for both groups with a single threshold. If you use different thresholds to equalize error rates, then you are explicitly using group membership, which might be controversial. Moreover, the data you collect can be biased by your past decisions, which makes it hard to monitor and improve the system. These are fundamental challenges in algorithmic fairness."

