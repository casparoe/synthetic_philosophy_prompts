prompt: |-
  I teach a graduate seminar in epistemology and I'm setting the final take-home exam: 48 hours, no collaboration, answers capped at 1,500 words. I need one question on luminosity and the KK principle (Kp → KKp) that can't be answered by summarizing the Williamson-style margin-for-error argument and announcing that knowledge isn't luminous.

  The seminar has been working with a toy model, and I want the question built around it. A subject's evidence at a case w is represented by the set R(w) of cases compatible with it; R is reflexive, and knowledge is treated as factive evidential support, so that S knows p at w if and only if p is true at w and p holds throughout R(w). A condition C is luminous if and only if, whenever C obtains at w, R(w) is a subset of C.

  The crux I want students to confront is this: the margin-for-error argument is often presented as though it quietly refutes KK, but on this model the two theses are in a much tighter relation than that. KK is valid on a frame if and only if R is transitive, and the anti-luminosity argument derives its entire force from the failure of transitivity, since small differences in how things stand are evidentially indiscriminable while large ones are not. So the argument does not refute KK as a corollary; it forces a choice between KK and intransitivity, and the real question is what each horn costs. In particular I want students to see why the natural KK-preserving repair — read in a position to know off the transitive closure of R rather than off R itself — collapses in the sorites series, because the transitive closure of a chain-connected space is the universal relation, which leaves no room for non-trivial knowledge.

  Please give me three things. First, the question as I should hand it out, phrased so that a candidate who knows only the textbook summary won't see where to begin. Second, a model answer of roughly 600 to 700 words, including both directions of the equivalence result and a statement of the collapse argument. Third, a marking scheme out of 25 built on five must-hit points, with the marks each carries and a line on how candidates typically get each one wrong.
reasoning: |-
  We are setting an exam question that requires students to go beyond the standard margin-for-error argument against luminosity and the KK principle. The key is to use the provided toy model and highlight the equivalence between the validity of KK and the transitivity of the accessibility relation R. Moreover, we want them to see that the anti-luminosity argument relies on the failure of transitivity and that the natural fix (using the transitive closure) leads to collapse in a sorites series.

  The question should be phrased in a way that a student who only knows the textbook summary (which might just present the margin-for-error argument and conclude knowledge isn't luminous) won't know how to proceed. We need to force them to engage with the model and the structure of R.

  We'll structure the answer around:
  1. The equivalence: KK is valid on a frame if and only if R is transitive.
  2. The margin-for-error argument and how it relies on the failure of transitivity (intransitivity).
  3. The collapse argument: using the transitive closure in a sorites series (which is chain-connected) leads to the universal relation, trivializing knowledge.

  Let's design the question and then the model answer.

  **The Question:**

  "Consider the toy model of knowledge we have been using in the seminar. In this model, a subject's evidence at a case \( w \) is represented by a set \( R(w) \) of cases compatible with that evidence. The relation \( R \) is reflexive (so \( w \in R(w) \) for every \( w \)), and knowledge is defined as factive evidential support: at a case \( w \), a proposition \( p \) is known (written \( Kp \)) if and only if \( p \) is true at \( w \) and \( p \) holds throughout \( R(w) \). A condition \( C \) is luminous if and only if whenever \( C \) obtains at \( w \), then \( R(w) \subseteq C \).

  (a) State the KK principle (also known as the principle of positive introspection) in the language of this model. Then, prove that the KK principle is valid on a frame (i.e., holds for every proposition and every case) if and only if the accessibility relation \( R \) is transitive. [Note: A frame is a set of cases with an accessibility relation \( R \).]

  (b) In the anti-luminosity argument, Williamson uses a series of cases (like a sorites series for perceptual evidence) where adjacent cases are evidentially indiscriminable (so for each adjacent pair \( w_i, w_{i+1} \), we have \( w_{i+1} \in R(w_i) \) and \( w_i \in R(w_{i+1}) \)), but the first and last cases are discriminable (so \( w_0 \) and \( w_n \) are such that, say, \( w_n \notin R(w_0) \) and \( w_0 \notin R(w_n) \)). Explain why such a series must involve a failure of transitivity in \( R \).

  (c) Suppose we try to preserve the KK principle by redefining knowledge in terms of the transitive closure \( R^* \) of \( R \) (so \( R^* \) is the smallest transitive relation containing \( R \)). In the sorites series described in (b), what is \( R^*(w) \) for a given case \( w \)? What does this imply for knowledge at \( w \) of non-trivial propositions (i.e., propositions that are not always true or always false)? Explain why this is problematic.

  Your answer should not merely summarize the margin-for-error argument and conclude that knowledge is not luminous. Instead, focus on the structural properties of \( R \) and the implications for the KK principle and luminosity."

  **Model Answer (600-700 words):**

  (a) The KK principle states that if one knows \( p \), then one knows that one knows \( p \). In the language of the model: at any case \( w \), if \( Kp \) holds at \( w \), then \( KKp \) holds at \( w \). Using the definition of knowledge, \( Kp \) at \( w \) means that \( p \) is true at \( w \) and for every \( v \in R(w) \), \( p \) holds at \( v \). Similarly, \( KKp \) at \( w \) means that \( Kp \) is true at \( w \) and for every \( v \in R(w) \), \( Kp \) holds at \( v \). But \( Kp \) holding at \( v \) requires that \( p \) is true at \( v \) and for every \( u \in R(v) \), \( p \) holds at \( u \).

  We now prove the equivalence:

  (⇒) Assume the KK principle is valid. We must show that \( R \) is transitive. Suppose \( w R v \) and \( v R u \). We need to show \( w R u \). Consider a proposition \( p \) defined as true at exactly the cases in \( R(v) \). Now, at \( v \), \( Kp \) holds because: (i) \( p \) is true at \( v \) (since \( v \in R(v) \) by reflexivity) and (ii) for every \( v' \in R(v) \), \( p \) holds at \( v' \) (by definition of \( p \)). Now, since \( w R v \), we have that \( Kp \) must hold at \( w \) if \( Kp \) holds at \( v \) (by the definition of knowledge: because \( w R v \) and \( Kp \) holds at \( v \), then \( Kp \) holds at \( w \) only if the knowledge condition is satisfied at \( w \); note that we are using the fact that \( Kp \) is true at \( v \) and \( w R v \), but for \( Kp \) to hold at \( w \), we require that at every case accessible from \( w \), \( Kp \) holds. However, we are going to use the KK principle which ensures that if \( Kp \) holds at \( v \), then \( KKp \) holds at \( v \), meaning that at every \( v' \in R(v) \), \( Kp \) holds. But note: we are trying to show transitivity. Alternatively, we can use a different approach.

  A standard method is to consider the proposition \( p \) that is true everywhere except at \( u \). Now, assume for contradiction that \( R \) is not transitive: there exist \( w, v, u \) such that \( w R v \), \( v R u \), but not \( w R u \). We want to show that KK fails. Consider the proposition \( p \) that holds at all cases except \( u \). Then at \( u \), \( p \) is false so \( Kp \) is false. At \( v \), since \( v R u \) and \( p \) is false at \( u \), \( v \) does not know \( p \). However, at \( w \): note that \( p \) is true at \( w \) (if \( w \neq u \)) and we must check if \( p \) holds throughout \( R(w) \). Since \( w R v \) and \( v \) is not \( u \) (so \( p \) is true at \( v \)), but if \( R(w) \) does not contain \( u \) (because we don't have \( w R u \)), then \( p \) might hold at every case in \( R(w) \). So \( Kp \) holds at \( w \). Now, what about \( KKp \) at \( w \)? For \( KKp \) to hold at \( w \), we need that at every \( x \in R(w) \), \( Kp \) holds. But consider \( v \in R(w) \): at \( v \), \( Kp \) does not hold because \( v R u \) and \( p \) is false at \( u \). So \( KKp \) fails at \( w \). Thus, if \( R \) is not transitive, then KK fails.

  (⇐) Assume \( R \) is transitive. We show that KK holds. Suppose \( Kp \) holds at \( w \). We must show \( KKp \) holds at \( w \). That is, for every \( v \in R(w) \), \( Kp \) holds at \( v \). So take any \( v \in R(w) \). We must show that \( Kp \) holds at \( v \). This requires: (i) \( p \) is true at \( v \), and (ii) for every \( u \in R(v) \), \( p \) is true at \( u \). Since \( Kp \) at \( w \) and \( v \in R(w) \), we have \( p \) is true at \( v \) (because \( Kp \) at \( w \) implies that \( p \) holds at every point in \( R(w) \)). Now take any \( u \in R(v) \). By transitivity, since \( w R v \) and \( v R u \), we have \( w R u \). Then, because \( Kp \) at \( w \), we have \( p \) holds at \( u \). Thus, \( p \) holds at every \( u \in R(v) \). Therefore, \( Kp \) holds at \( v \). Since \( v \) was an arbitrary element of \( R(w) \), we have that \( Kp \) holds at every \( v \in R(w) \). Hence, \( KKp \) holds at \( w \).

  (b) In the sorites series \( w_0, w_1, \dots, w_n \), adjacent cases are mutually accessible: \( w_i R w_{i+1} \) and \( w_{i+1} R w_i \) for each \( i \). But the endpoints \( w_0 \) and \( w_n \) are not mutually accessible (say, \( w_n \notin R(w_0) \) and \( w_0 \notin R(w_n) \)). Now, if \( R \) were transitive, we could show that \( w_0 R w_n \). For example, by repeated application of transitivity: \( w_0 R w_1 \) and \( w_1 R w_2 \) implies \( w_0 R w_2 \), then \( w_0 R w_2 \) and \( w_2 R w_3 \) implies \( w_0 R w_3 \), and so on until \( w_0 R w_n \). But we know that \( w_0 \) does not access \( w_n \). Therefore, transitivity must fail somewhere in the chain.

  (c) The transitive closure \( R^* \) of \( R \) is the smallest transitive relation containing \( R \). In the sorites series, because every pair of cases is connected by a chain of accessibility (since adjacent cases are accessible and the series is connected), \( R^* \) becomes the universal relation: for any two cases \( w_i \) and \( w_j \), we have \( w_i R^* w_j \) and \( w_j R^* w_i \). This is because we can go from \( w_i \) to \( w_j \) by stepping through the intermediates.

  Now, if we redefine knowledge using \( R^* \) (so that \( K^* p \) holds at \( w \) iff \( p \) is true at \( w \) and for every \( v \) such that \( w R^* v \), \( p \) holds at \( v \)), then at any case \( w \), \( R^*(w) \) is the entire set of cases. Therefore, \( K^* p \) holds at \( w \) only if \( p \) is true at every case. Similarly, a proposition \( p \) is known only if it is true everywhere. This trivializes knowledge: the only knowable propositions are the necessary ones (true in all cases) and the agent cannot know any contingent proposition. This is a disastrous result because in a non-trivial setting (like the sorites series) we expect that at least some contingent propositions are known (e.g., at \( w_0 \) the subject might know that the stimulus is clearly red, and at \( w_n \) that it is clearly not red). Thus, the move to preserve KK by using the transitive closure collapses knowledge to triviality.

  **Marking Scheme (out of 25):**

  The marking scheme is built on five must-hit points. Each point is allocated a certain number of marks, and we note common mistakes.

  1. **Correct statement of the KK principle in the model and the equivalence with transitivity (part a):** [8 marks]
     - 3 marks for stating KK correctly in the model: \( Kp \to KKp \) and unpacking it as: if at w, p is true and holds at every v in R(w), then at w, for every v in R(w), p is true at v and holds at every u in R(v).
     - 5 marks for proving both directions of the equivalence (transitivity ⇔ KK valid). 
       - Common mistake: Only proving one direction. Losing 2.5 marks for each missing direction.
       - Common mistake: In the (⇒) direction, not constructing an appropriate proposition to show the failure (like the one that fails at u). Or not using reflexivity properly.
       - Common mistake: In the (⇐) direction, not explicitly using transitivity to show that if w R v and v R u then w R u and hence p holds at u.

  2. **Explanation of why the sorites series requires intransitivity (part b):** [5 marks]
     - The candidate must note that if R were transitive, then from the chain of adjacencies we would get that w0 accesses wn, but by construction it does not. Hence, transitivity fails.
     - Common mistake: Simply restating that adjacent cases are accessible without drawing the conclusion about transitivity. (Lose 3 marks)
     - Common mistake: Not mentioning the chain of adjacencies and the endpoints. (Lose 2 marks)

  3. **Analysis of the transitive closure in the sorites series (part c):** [7 marks]
     - 3 marks for stating that R* becomes the universal relation (because the series is chain-connected).
     - 4 marks for explaining that knowledge defined by R* requires p to be true everywhere (so only necessary truths are known) and that this trivializes knowledge (no contingent knowledge).
     - Common mistake: Saying that R* is universal but not drawing the consequence for knowledge. (Lose 3 marks)
     - Common mistake: Not explaining why R* is universal in the sorites series. (Lose 2 marks)

  4. **Avoiding textbook summary:** [3 marks]
     - The answer should not merely present the margin-for-error argument and conclude that knowledge isn't luminous. It should focus on the structural properties (transitivity and the closure) and the choice between KK and intransitivity, and the collapse of the transitive closure repair.
     - Penalize: If the candidate only gives the margin-for-error argument without the requested structural analysis, deduct 3 marks.

  5. **Clarity and structure:** [2 marks]
     - The answer is well-structured, clear, and within the word limit for the answer to this question (which is part of the overall 1,500 words). 
     - Deductions for disorganization, excessive verbosity, or lack of focus.

  Total: 8+5+7+3+2 = 25 marks.

