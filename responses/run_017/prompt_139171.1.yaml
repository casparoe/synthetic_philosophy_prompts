answer: |-
  Here's a granular breakdown of the passage, followed by a verdict on your questions. I'll be blunt about where the piece goes off track.

  **Passage Breakdown:**

  1.  **Phenomenal vs. Access Consciousness Distinction:** Accurate and standard. Block's point about them traveling together in us, and access being the "tractable half" for mechanisms, is correct.
  2.  **Global Workspace Theory (GWT) Core Mechanism:** Standard description. Competition, capacity-limited workspace (PFC/Parietal), ignition, broadcast to consumer systems – this is textbook GWT (Baars, Dehaene, etc.). Harmless simplification.
  3.  **"Being broadcast just is being conscious — that's the whole theory."**: This is **problematic**. GWT proponents *do* claim ignition/broadcast *is* the *neural correlate* of (access) consciousness. However, saying it "just is" consciousness blurs the ontology/epistemology line. It presents GWT as a full *identity* claim ("consciousness = broadcasting"), whereas it's more cautiously presented as a *sufficient and necessary correlate* in standard formulations. This phrasing leans towards eliminativism about phenomenal consciousness that not all GWTers endorse. **Harmless simplification?** *Barely*, at an undergrad level, but sets up the later error.
  4.  **"So the difference... isn't conscious at all."**: Simplifying, but captures the core GWT prediction: ignition is necessary and sufficient for conscious reportability/access. **Harmless simplification**.
  5.  **"The theory is therefore committed to there being no phenomenal consciousness without access."**: **FALSE.** This is the **critical error**. Block's *entire point* in introducing the distinction was to argue *against* this identity/conflation. GWT is explicitly a theory about the *mechanism of access consciousness*. While GWT proponents (like Dehaene) *often argue* that phenomenal consciousness *requires* access consciousness (i.e., ignition), **this is NOT a logical commitment of the GWT mechanism itself**. It's a *philosophical stance* adopted *by some proponents*. Block and others argue that phenomenal consciousness *can* exist without access (overflow). The passage commits the fallacy of assuming GWT explains phenomenal consciousness *simply because* it explains access consciousness. This error invalidates the subsequent "payoff".
  6.  **"A state that isn't broadcast... nothing it is like to be in it either."**: This directly follows from the previous error and is therefore **FALSE** as a necessary consequence of GWT. It's Block's *opponent's* view, not GWT's inherent commitment.
  7.  **Hard Problem Objection:** Standard description.
  8.  **Workspace Reply: "the workspace is where the feeling itself happens...":** **Misleading/Oversimplified.** While GWT proponents *do* argue that identifying the NCC dissolves the hard problem (or makes it scientific), claiming the workspace is "where the feeling itself happens" is contentious. Critics (like Chalmers) would say this merely identifies the *correlate* of the feeling, not what constitutes the feeling itself. Proponents might frame it as identifying the *physical basis*, but the phrasing "where the feeling itself happens" risks implying a location for qualia that many find incoherent. It's a simplification that papers over the deepest philosophical disagreement. **Harmless simplification?** *No, not really.* It presents a highly contentious claim as a settled "reply".

  **The Payoffs - Do They Survive Fixing Mistakes?**

  1.  **GWT Rules Out Phenomenal Consciousness Without Access:** **No.** Correcting the error (#5) reveals this is *not* a commitment of GWT *as a mechanism*. It is a stance *some* GWT proponents take *based on evidence*, but it is not logically entailed by the theory. GWT describes access; whether phenomenal requires access is a separate question. This payoff collapses.
  2.  **Workspace Answers the Hard Problem Worry:** **No, not convincingly.** While it *is* the reply GWT proponents offer, fixing the mistakes highlights how this reply remains deeply controversial and fails to satisfy critics. Identifying the neural mechanism of access doesn't, in itself, explain *why* that mechanism produces subjective experience. The "reply" survives only as a statement of faith held by some proponents, not as a widely accepted solution.

  **Your "Broadcast Reach" Distinction:**

  1.  **Is it a Distinction or a Rename?** It's a **genuine distinction**, not merely a rename of access-consciousness. Block's access-consciousness is primarily defined in terms of *availability for use* by specific *functions* (reporting, reasoning, action control). Your "broadcast reach" focuses on the *actual downstream causal impact* of the broadcast event – *which specific consumer systems actually receive and utilize the information* on a given occasion. Availability (access-consciousness) might be necessary for potential reach, but reach describes the *realized functional consequences* of that availability in a specific instance. It's about the *implementation* and *effectiveness* of access.
  2.  **Does it Contradict the Uniformity Claim?** **Yes, directly and importantly.** The passage claims "everything in the workspace is conscious in exactly the same way." Your distinction implies that the *phenomenal character* ("how rich the experience is") could vary depending on *which* systems successfully received/used the broadcast (reach), even if ignition occurred (access). This directly challenges the uniformity claim. If phenomenal richness tracks reach, then ignition alone (access) is *not* sufficient to determine the full phenomenal character; the downstream effects matter. This is **incompatible** with the strong uniformity claim in the passage. It suggests a level of gradation or context-dependence *within* access-conscious states regarding their phenomenal properties.

  **Your "Quiet Broadcast" Case:**

  1.  **Is it Phenomenal Without Access?** **By Block's strict definition, arguably YES, it's a candidate.** Block defines access-consciousness as availability for direct *control* of *behavior* (including reporting) and *rational thought*. In your case:
      *   **No Ignition Signature:** Suggests no global broadcast (central to GWT access).
      *   **At Chance on Report ("Did you see anything?"):** Shows lack of availability for direct verbal report.
      *   **Above Chance Forced-Choice:** This is the crux. This shows *some* information is available to *influence behavior* at a very basic level (guessing). However, Block typically reserves "control of behavior" for more robust, flexible, reportable control. Forced-choice guessing above chance, especially without subjective awareness, is often categorized as *unconscious processing* influencing behavior (e.g., blindsight, masked priming). It demonstrates *information processing* but arguably not full "availability for control" in Block's sense. The subject cannot *use* the information flexibly, only guess.
      *   **Decoder Recovers Info:** Reinforces that the information is present neurally but not accessed globally.
  2.  **Does Forced-Choice Performance Mean Access?** **Not necessarily by Block's definition.** Access-consciousness implies the information is *poised* for free use. Forced-choice guessing without awareness feels more like an *automatic, encapsulated influence* rather than the information being freely available to the cognitive system. It's evidence of *information in the system*, but not necessarily of *access-consciousness*.
  3.  **Is it Question-Begging or Redundant?** It's **not question-begging** as you've defined the terms operationally (ignition signature, report, forced-choice). It's **similar to overflow arguments** (like Sperling's partial report), but distinct: Sperling argues for *more* phenomenal content than can be accessed/reported *after* ignition. Your case argues for *some* phenomenal content *without* ignition/access at all. It's a **valid and interesting case** specifically targeting the necessity of ignition/broadcast for *any* phenomenal consciousness. It's a "minimal" overflow case, pushing against both GWT's necessity claim and the conflation of access with phenomenality. It's a good problem set case.

  **Summary:** The piece is accurate until the conflation of GWT's access mechanism with phenomenal consciousness (#5). That error is significant and undermines its core claims about ruling out phenomenal without access and answering the hard problem. Your "broadcast reach" is a novel and useful distinction challenging GWT's uniformity claim. Your "quiet broadcast" case is a strong candidate for phenomenal without access and a valid challenge to GWT's necessity claim. Both are excellent fodder for your seminar.
