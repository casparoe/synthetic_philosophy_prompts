answer: |-
  The U.S. labor law framework reflects an **unstable compromise between two incompatible theories of workplace association**, not a coherent single theory. Its rules presuppose conflicting views of collective agency and individual rights:

  ### Core Tensions & Philosophical Underpinnings
  1. **Collective-Status Theory** (Majoritarian Collectivism):  
     - *Manifests in*: Exclusive representation, majority binding minority, duty of fair representation.  
     - *Presupposes*: The workplace is a **corporate entity** with a unified voice. Bargaining unit solidarity overrides individual dissent for institutional stability (rooted in **civic-republican pluralism**).  

  2. **Individual-Consent Theory** (Liberal Voluntarism):  
     - *Manifests in*: Right-to-work rules, ban on secondary pressure, differential strike replacement.  
     - *Presupposes*: **Classical liberal individualism**. Coercion requires fault/consent: no dues without agreement; no harm to "innocent" third parties; job loss only justified when strikers "choose" economic conflict.

  ### Permanent Replacement Rule: What It Reveals
  - **Strictly Presupposes**: Strikes are **economic contests**, not inviolable rights. The rule:  
    - Treats labor as a commodity subject to market forces ("trial of endurance").  
    - Implies striking is a **liberty**, not a right—since its exercise risks permanent consequences.  
  - **Undermines "Right to Strike" Rhetoric**: If a right can be nullified by replacement, it functions as a procedural privilege, not a substantive guarantee. No rights theory (liberal/republican) justifies this cost under fair conditions.  

  ### Testing the Proportional Representation Variant
  Under a regime with **multiple unions, voluntary membership, and no binding majority**:  
  - **Rules That Could Stand**:  
    - **Secondary Pressure Ban**: Still aligns with liberal individualism—neutral parties lack fault.  
    - **Unfair Labor Practice Strike Protections**: Still fits fault-based logic; targeting employer wrongdoing.  
  - **Rules That Must Change**:  
    - **Permanent Replacement for Economic Strikes**: Loses justification. With no collective status binding workers, firing strikers becomes disproportionate coercion against individuals exercising liberty.  
    - **Exclusive Representation/Duty of Fair Representation**: Obsolete; unions represent only consenting members.  

  ### Which Half Does the Work?
  - **Real Philosophical Workhorse**: **Individual-Consent Theory**.  
    - Secondary pressure bans and right-to-work rules are *principled* features of liberalism.  
    - Permanent replacement *fits* liberalism’s view of strikes as economic warfare.  
  - **Collective-Status Elements are Pragmatic Exceptions**:  
    - Exclusive representation is a **utilitarian trade-off** for orderly bargaining, not a philosophically consistent extension of collectivism (why mandate representation but forbid funding?).  

  ### Conclusion
  The law is an **unstable hybrid**:  
  - **Collective rules** (majority binding all) serve **functional efficiency** (avoiding fragmentation) but clash with liberal individualism.  
  - **Individualist rules** (no compelled dues, no secondary pressure) reflect **deontological boundaries** against coerced association.  
  - **No Unified Theory**: Civic republicanism could justify exclusive representation but not replacement rules; liberalism justifies consent requirements but not majoritarian coercion. The permanent replacement doctrine epitomizes the contradiction—collective action is recognized yet economically neutered.  

  **Underdetermined Doctrine**:  
  The duty of fair representation *could* align with pluralism (groups owe duties to members) but is stretched unnaturally to cover non-members. Proportional representation would resolve this tension but require abandoning the core Wagner Act compromise: stability through enforced collectivity. The replacement rule’s survival in *any* form depends on viewing labor conflict through market logic, not rights logic—a concession to capitalism, not a coherent theory of association.
