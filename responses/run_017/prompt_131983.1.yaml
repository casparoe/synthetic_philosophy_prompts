prompt: |-
  I drafted the following argument for a seminar in normative ethics and have come to distrust it, though I cannot locate the fault. Its conclusion is that supererogation is impossible, and I am not willing to accept that. I would like a diagnosis rather than a verdict.

  Four premises first.

  (1) *Standard characterization*: an available act S is supererogatory for an agent A if and only if it is morally praiseworthy for A to perform S and not morally blameworthy for A to omit S. Call this the datum I most want to keep: that there is a category of acts that are good to do, and in some strong sense better than the alternative, but which no one can be blamed for not doing.

  (2) *Optimizing Ought*: if, among the acts available to A, some act B is morally better than every alternative, then A morally ought to do B.

  (3) *Bridge*: if A morally ought to do x, then A is blameworthy if she omits x.

  (4) *Better-than-the-minimum*: a supererogatory act is morally better than the merely permissible act the agent would otherwise have performed. It is this, and not merely its cost or risk to the agent, that makes it go beyond the call and that distinguishes it from an act that is merely unusual, risky, or personally expensive.

  Now the argument.

  (5) Consider an agent whose only two options are to perform S or to omit it, where S is supererogatory by (1). By (4), S is morally better than the sole alternative; so S is better than every alternative; so by (2) A ought to do S; so by (3) A is blameworthy if she omits it — contradicting (1). So on this option set, S is not supererogatory after all.

  (6) The reply I keep getting is that (5) is an artifact: real agents always have further options — a more generous version of S, a more effective one, a different beneficiary — so S is never *the best* available act and (2) never fires on it.

  (7) But then run the argument on whichever act *is* best. Let B be the morally best act available to A. By (2), A ought to do B; by (3), A is blameworthy if she does anything else, since every other act is an omission of B. Call this the Saint Result. It entails that there are no morally optional acts at all: no permission to pursue one's own projects, no space in which an agent may permissibly do less than the most good she could do, and no praiseworthiness that is not merely the discharge of a requirement. By (1) and (4), that just is the claim that supererogation is impossible. So (6) does not rescue supererogation; it relocates the problem and makes it total.

  (8) One escape is ought-implies-can: the best act is frequently beyond us, in knowledge or in will, so (2) does not generate a real requirement. But if the relevant incapacity is motivational — the agent cannot bring herself to do the best — then either that is not the kind of "cannot" that limits obligation, in which case the escape fails, or it is, in which case ordinary duties dissolve for agents who cannot bring themselves to keep a promise or testify honestly. Worse, on that reading the category becomes dependent on a defect: for an agent who *can* do the best, doing it is required, and so nothing is ever supererogatory *for her*. A saint would have no supererogatory acts available, which is not what anyone meant by the category.

  (9) So the argument seems to be a dilemma: reject (1) and (4), the concept itself, or accept the Saint Result.

  What I want from you:

  First, name the step where the reasoning actually fails, and say why it looked sound. I suspect the fault is in the neighborhood of the move from "better than the permissible alternative" in (4) to "better than every alternative" in (5) and (7) — a scope or quantifier shift that goes through only if the betterness ordering is complete and transitive across the whole option set — or else in an equivocation in (3) between an evaluative or deliberative "ought" and an obligation-implying one. But I cannot tell which, and I cannot tell whether they are the same fault described two ways.

  Second, price the alternatives honestly. As I see them, the options are: (a) restrict (2) — deny that being best generates an "ought," perhaps by letting an agent give her own projects weight beyond their impersonal value, or by treating duty as satisficing rather than optimizing, or as scalar, admitting degrees; (b) restrict (3) — allow that one can ought, all things considered, to do what one is not blameworthy for omitting, either via a threshold below which blame attaches or via a distinction between two senses of "ought"; (c) restrict (4) — deny that supererogatory acts are morally *better*, and explain the praise some other way; (d) block the argument through incomparability, so that no act is best and (2) never fires. For each, say what it costs: whether the satisficing or scalar route needs a non-arbitrary threshold, whether it reintroduces supererogation one level down or merely relocates it, whether the two-"ought" route leaves "ought" with any action-guiding force or makes it equivocal in ordinary moral speech, whether the prerogative route can be justified to the person the agent declines to help, and whether the incomparability route is available for the concrete cases — a bystander who wades into a flooded channel after a stranger, say — without collapsing into scepticism about moral comparison generally.

  Third: is the dilemma in (9) exhaustive, or is there a way of taking the friend's reply in (6) that yields supererogation without the Saint Result? And if the argument does fail, does it fail *instructively* — does it show something about how fragile the required/optional distinction is, or about why the concept of supererogation needs more than the standard characterization in (1) to do any work?

  Please be explicit about which premise you would keep and which you would surrender. I would rather keep (1) and (4) than (2), and I would rather keep both than accept the Saint Result, but I want to know in detail what I am paying.
reasoning: |-
  Hmm, this is a sophisticated problem in normative ethics about the possibility of supererogation. The user has constructed a tight argument that seems to prove supererogation is impossible, but they distrust this conclusion and want help locating the fault.

  The core argument is clever: if a supererogatory act is morally better than the alternative (premise 4), and we accept that one ought to do what's best (premise 2), and that failing to do what one ought to do makes one blameworthy (premise 3), then supererogation collapses - either it becomes obligatory or we get the "Saint Result" where only the absolute best act is permissible.

  I notice several pressure points. Premise (3) seems particularly vulnerable - the bridge from "ought" to blameworthiness might be where the reasoning cracks. The user suspects this might involve a conflation between different types of "ought," and I think that's astute. There's also premise (2) that assumes morality must always demand optimization, which seems too stringent for ordinary moral life.

  The user's proposed alternatives are well-framed: restricting (2) allows for moral satisficing; restricting (3) decouples obligation from blame; restricting (4) denies that supererogatory acts are better; or embracing incomparability. Each has costs they've rightly identified, like the threshold problem for satisficing or the action-guiding issue for multiple "oughts."

  What's interesting is how the user wants to preserve (1) and (4) - the core intuition that supererogation exists as genuinely better yet optional. This suggests the solution might lie in refining how we understand "better" in premise (4). Perhaps supererogatory acts are better in some dimensions (like beneficence) but not strictly better all-things-considered when we factor in agent-relative permissions.

  The friend's reply in (6) about multiple options doesn't solve the problem as shown in (7), but it might point toward a solution if we accept that moral evaluation isn't always comparable across all options. Still, as the user notes, this risks moral skepticism if overused.

  I think the most promising path is to challenge premise (3) by distinguishing between a strong "obligation-ought" that entails blameworthiness and a weaker "recommendation-ought" that doesn't. This preserves the standard characterization while allowing room for supererogation. The cost is explaining why some oughts don't carry blame - perhaps through the concept of moral options or agent-centered prerogatives.

  The argument fails instructively by revealing how fragile moral requirement is when we assume maximizing consequentialism. It shows supererogation needs more than the standard characterization - it requires a moral framework with "moral breathing room" built in.
answer: |-
  Your argument is rigorous and exposes genuine tensions in standard accounts of supererogation. The core failure occurs in **step (5) and its generalization in (7)**, specifically in the inference from "S is morally better than the merely permissible alternative" (per (4)) to "S is better than every alternative" and thus obligatory (per (2)). This equivocates on the scope of "better than" and ignores the structure of moral reasons. Here’s the diagnosis, priced alternatives, and resolution:

  ### 1. **Where the Reasoning Fails (and Why It Looked Sound)**  
     - **The Fault**: The move from (4) to (5)/(7) conflates **agent-relative permissions** with **impersonally optimal acts**. Premise (4) states that a supererogatory act S is *morally better than the minimum permissible act* (call it M). But this does *not* entail that S is *better than every alternative* (e.g., other supererogatory acts or M itself). Crucially, M remains *permissible* even if S is better, because morality may permit suboptimal acts when they protect the agent’s interests (e.g., pursuing personal projects).  
     - **Why It Looked Sound**: The inference relies on an unstated assumption that morality is **strictly maximizing and impersonal**. If we assume all moral value is agent-neutral (e.g., total welfare), then (4) *would* imply that S is strictly better than M, triggering (2) and (3). But this ignores that moral theories often recognize **agent-relative prerogatives** (e.g., Scheffler, Commonsense Consequentialism) allowing agents to weight their own interests more heavily than impersonal goodness.  
     - **Hidden Quantifier Shift**: (4) claims S is better than *the minimally permissible option M*. (5) illicitly treats this as S being better than *all alternatives*, including other supererogatory acts or M itself. But M’s permissibility means it is *not* morally inferior in a blame-entailing sense—it is "good enough."  
     - **The Bridge Premise (3) is Overstrong**: (3) equivocates between two "oughts":  
       - **Ought₁ (Obligation)**: Violation warrants blame (e.g., breaking a promise).  
       - **Ought₂ (Recommendation)**: What is best, but omission warrants no blame (e.g., donating 30% income vs. 10%).  
       Your argument assumes all "oughts" are Ought₁, but supererogation requires Ought₂.  

  ### 2. **Pricing the Alternatives**  
     | Option          | Key Move                                                                 | Cost                                                                                                                                 | Viability |  
     |-----------------|--------------------------------------------------------------------------|--------------------------------------------------------------------------------------------------------------------------------------|-----------|  
     | **(a) Restrict (2)**<br>(Deny optimizing "ought") | Reject (2): Being best ≠ obligatory. Adopt **satisficing** (Slote) or **agent-centered prerogatives** (Scheffler). | - **Satisficing**: Needs a non-arbitrary threshold (e.g., "good enough"). Risk: Relocates supererogation (is donating $101 supererogatory if $100 is sufficient?).<br>- **Prerogatives**: Must justify weighting self-interest (e.g., to the drowning stranger: "I saved my child instead"). Risk: May feel egoistic; hard to systematize. | ★★★★☆<br>(Keeps 1 & 4; avoids Saint Result) |  
     | **(b) Restrict (3)**<br>(Decouple "ought" from blame) | Reject (3): Allow Ought₂ (no-blame "ought"). Distinguish **obligation** (blameworthy omission) from **ideality** (praiseworthy performance). | - **Cost**: Weakens action-guidance of "ought." If "ought" doesn’t imply blame, why obey?<br>- **Mitigation**: Use "must" for obligations (blameworthy omission) and "ought" for ideals (no-blame omission). Ordinary speech supports this ("You ought to exercise, but you’re not *wrong* to skip"). | ★★★★★<br>(Cleanest fix; preserves intuitions) |  
     | **(c) Restrict (4)**<br>(Deny moral betterness) | Reject (4): Supererogatory acts aren’t morally better, just **praiseworthy for other reasons** (e.g., effort, sacrifice). | - **Cost**: Abandons core intuition that saving a stranger *is* better than not. Collapses supererogation into mere heroism (praiseworthy but not morally superior). Makes (1) unstable. | ★★☆☆☆<br>(Undermines 1 & 4) |  
     | **(d) Incomparability**<br>(Block "best" act) | Deny comparability: Acts may be **on a par** (Chang) or **incommensurable**. (2) never fires. | - **Cost**: Impractical for concrete cases (wading into flood *is* better than doing nothing). Risks moral skepticism: If no act is better, how justify praise?<br>- **Mitigation**: Use for hard cases (career vs. charity), not clear rescues. | ★★★☆☆<br>(Partial solution) |  

  **Least Costly**: (b) > (a) > (d) > (c). (b) preserves (1) and (4) with minimal revision, using distinctions already present in moral discourse.

  ### 3. **Escaping the Dilemma: Beyond (6) and (9)**  
     - **(6) Can Work with Refinements**: The friend’s reply succeeds if we reject **maximization** (premise 2). Real agents have options where:  
       - **M (minimally permissible)**: E.g., not helping the stranger.  
       - **S (supererogatory)**: E.g., wading in at moderate risk.  
       - **S⁺ (heroic)**: E.g., diving into a whirlpool.  
       S is better than M (satisfying 4), but S⁺ is better than S. Since S isn’t *best*, (2) doesn’t apply. S’s omission isn’t blameworthy (satisfying 1), and S is praiseworthy. **No Saint Result** because S⁺ isn’t obligatory—omitting it for S or M is permissible (via agent prerogatives).  
     - **Why the Saint Result Fails**: (7) assumes that if B (best act) exists, it *must* be obligatory. But if agents have **permission to suboptimize**, omitting B for a "good enough" act (e.g., S) isn’t blameworthy. A saint has no supererogatory options only if we define "best" as obligatory—but we shouldn’t.  
     - **Instructive Failure**: The argument reveals that supererogation requires **two distinctions**:  
       - Between **obligation** (blame-triggering omission) and **ideality** (praise-triggering performance).  
       - Between **agent-neutral value** (S is impartially better than M) and **agent-relative permissions** (A may choose M without blame).  
       Without these, the required/optional distinction collapses.

  ### Recommendation: Keep (1) and (4), Restrict (3)  
  - **Surrender (3)** as stated: Replace it with "If A is *morally obligated* to do x, then A is blameworthy for omitting x." This distinguishes obligation from mere moral ideality.  
  - **Modify (2)**: Accept it only for contexts without agent-centered prerogatives (e.g., perfect duties).  
  - **Cost Paid**: You weaken the "ought" in (2) to a non-blame-entailing recommendation. But this aligns with ordinary use (e.g., "You ought to be kinder" isn’t an obligation). Supererogation becomes acts that are *ideally ought-to-be-done* but not *obligatory*.  

  **Result**: The bystander *ought* (ideally) to wade in (it’s better than not), but isn’t *obligated* (no blame for omission). Doing it is praiseworthy. The Saint can still perform supererogatory acts (e.g., S) even if S⁺ exists—she isn’t *required* to do S⁺.  

  This preserves the core of supererogation while blocking your argument’s collapse. The fault was in assuming morality is purely optimizing and that all "oughts" imply blame—a mistake the dilemma in (9) falsely presents as exhaustive.
