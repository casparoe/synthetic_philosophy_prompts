prompt: |-
  I've been reading the rationalist blogs and forums for something like fifteen years, and for the last five I've done a fair amount of forecasting on the side: tournament-style questions, some institutional forecasting adjacent to my job, and a standing argument with a group of friends about how long large human institutions last. I'm writing up my own forecasting epistemology so the group can attack it, and what I want from you is an audit rather than an explanation. Assume I already know the standard material: base rates, the planning fallacy, inside versus outside view, reference class arguments, calibration, log-loss scoring, the Tetlock-style results about who forecasts well and why. Please don't give me reading suggestions or tell me to go get better data; I want the conceptual audit stated in its own terms.

  Here is roughly where I have landed.

  1. Outside view first. I treat the inside and outside views as rival methods for producing the same number, and my rule for adjudicating between them is: anchor on the base rate for the reference class, and let the inside view move you off that anchor only to the extent that the inside view has itself been validated out of sample. In practice this means the adjustment is small, and that when someone's inside view moves them a long way from the base rate, I want to see a track record before I follow them.

  2. Reference classes are selected causally, not by surface similarity. I don't think putting two polities in the same class because both are large, or because both get called empires, or because both are wealthy, tells me anything. What matters is whether the same generative process is producing the outcome. So the relevant classes are things like fiscal-military strain after a long commercial expansion, succession crises in systems with weakly specified succession, legitimacy collapse after a legitimacy-bearing narrative fails, and so on. If the failure mode matches, I'll put two very differently sized and very differently dated polities in the same class; if it doesn't, I won't, however similar they look from the outside.

  3. There are no unique events. Every event belongs to some reference class, and the claim that this time is different is almost always the inside view wearing a disguise. I take this to be a claim about intellectual hygiene rather than about metaphysics: refusing to name a reference class is usually just a way of refusing to be scored.

  4. Constant hazard for polities. Unlike organisms, polities have no built-in senescence, and unlike machines they have no obvious wear-out part, so my default model for how long one lasts is the constant-hazard one: conditional on having survived to time t, expected remaining lifetime is roughly the same as it was at the start. I use as my anchor a rough working figure for the average completed lifespan of large polities in the historical record, somewhere between two and four centuries; I don't care about the exact value and I'd rather you argued about the structure than the number. I also don't worry that the historical record is a sample of polities that have already ended. I've never seen a clean argument that this selection pushes the number in a particular direction, so I use the average of the completed cases as my forecast for the remaining life of a polity that is still alive and already old.

  5. Scoring discipline. I report calibrated probabilities, I score myself with log loss, and I think the honest answer to a fifty-year question is often just the base rate with wide error bars attached. I would rather publish an uninformative-looking distribution that is calibrated than a confident one that is not.

  6. The verdict I have actually published: roughly even odds, maybe a little better than even, that the present American constitutional order does not survive in recognizable form to 2100. A substantial part of the weight here comes from the fact that the run since the 1860s, and especially since 1945, is unusually long and unusually untested by historical standards. My reasoning is that long untested runs are fragile: a system that has not recently been stress-tested accumulates unexercised failure modes, degraded norms, and a governing class that has never had to actually use the emergency provisions, and so the next test is more likely to break it rather than less.

  7. I try to apply the same machinery to my own corner of the world, where I have much more inside information: I expect the current structure of the AI industry to look substantially different in ten years, on base rates for fast-moving concentrated industries, and I don't think being inside that world gives me much of an epistemic edge over the base rate.

  What I want from you: go through this set and tell me which pairs are in genuine tension and which only look like they are, ordered by severity rather than listed as equally bad. For each real tension, say what would have to give, what giving it would cost me in the cases I actually care about, and whether there is a cheaper revision that preserves most of what I want. Then tell me which single revision cleans up the most. Assume most of the list is right; I am not looking for permission to abandon the whole framework, and I don't have a favourite commitment I'm protecting, so please don't assume I'll drop whichever item is least fashionable.

  Finally, the part I care about most and that people usually get wrong: separate what is settled among people who actually work on these questions from what is genuinely contested. In particular, tell me where the audit depends on contested empirical claims about the shape of duration distributions or about when base rates beat mechanistic models, and give me the shape of that disagreement rather than a verdict dressed up as a consensus view. Mark which of your own claims you would bet on at even odds and which you would only take at three to one, and flag anywhere you're unsure whether something is settled at all.
reasoning: |-
  Okay, let me start by understanding what the user is asking for. They've been involved in forecasting for years and have developed their own epistemology. They want a conceptual audit, not basic explanations or reading suggestions. They've outlined seven key points in their framework and want to know where the tensions are, how severe they are, and what revisions might help.

  First, I need to go through each of their points and see where they might conflict. Point 1 emphasizes the outside view as the anchor with minimal adjustment from the inside view unless it's validated. Point 2 focuses on causal reference classes rather than surface similarities. Point 3 states there are no unique events—everything belongs to a reference class. Point 4 assumes constant hazard for polities without senescence. Point 5 stresses calibration and scoring discipline. Point 6 applies this to the US, predicting fragility due to a long untested period. Point 7 extends the same approach to the AI industry.

  Now, looking for tensions. The biggest one seems between Point 4 (constant hazard) and Point 6 (long untested runs are fragile). Constant hazard implies that past survival doesn't affect future risk, but Point 6 argues that prolonged stability increases fragility. That's a direct contradiction. The user needs to reconcile these. Maybe they can adjust the hazard model to include accumulated risks, but that might complicate their constant hazard assumption.

  Next, Point 2’s causal classes might clash with Point 3’s "no unique events." Defining causal classes rigorously could lead to classes so specific that they're effectively unique. The user might need to allow for hybrid classes or accept some uniqueness when causal mechanisms are too distinct.

  Point 1 and Point 7 might have tension if the user has inside info in the AI industry but dismisses its value. If their inside view is validated, shouldn't it adjust the anchor more? They might need to clarify when inside views are sufficiently validated to warrant larger adjustments.

  Point 6’s fragility claim also challenges Point 4’s constant hazard. Historical evidence on polity longevity might show non-constant hazards, which is contested. The user should acknowledge this empirical uncertainty.

  I should rank these tensions by severity. The constant hazard vs. fragility is the most critical. Then causal classes vs. no unique events. Followed by inside view adjustments in Point 1 vs. Point 7. Then Point 6 vs. Point 4 again on hazard models.

  For each tension, suggest what might give, the cost, and cheaper revisions. For the main tension, maybe shift to a bathtub hazard model or add a fragility multiplier. The cost is added complexity and potential overfitting. A cheaper fix could be treating fragility as a modifier within the constant hazard framework.

  The single best revision might be relaxing the strict constant hazard to allow for accumulated risks, which addresses multiple tensions.

  On what's settled versus contested: Calibration and scoring discipline (Point 5) are settled. Constant hazard for polities is contested—evidence is mixed. The fragility claim is speculative. Causal classes are best practice but hard to implement.

  The user's deeper needs: They want a robust, defensible framework for their group to critique. They value intellectual rigor and avoiding biases. Unspoken needs might include wanting their framework to be both principled and practical, not overly rigid. They might also seek validation of their approach while being open to refinements.

  I need to ensure the audit is concise, prioritizes tensions, and clearly separates settled from contested areas. Highlighting empirical uncertainties and offering pragmatic revisions without overhauling their entire system is key.
answer: |-
  Here's a conceptual audit of your forecasting epistemology, prioritizing tensions by severity, identifying what must give, the costs, potential cheaper revisions, and distinguishing settled from contested territory. I'll conclude with the highest-leverage single revision.

  **Severe Tensions (Require Core Adjustment):**

  1.  **Tension: Point 4 (Constant Hazard) vs. Point 6 (Fragility of Long Untested Runs)**
      *   **Nature of Conflict:** This is the most fundamental clash. Constant hazard explicitly states that the probability of failure *does not depend on age*. Conditional on survival to time `t`, expected remaining life is constant. Point 6 argues the *opposite*: a long period *without* failure (being "untested") *increases* the probability of failure upon the next stressor ("long untested runs are fragile"). This directly contradicts constant hazard.
      *   **What Must Give:** You cannot maintain both strict constant hazard *and* the fragility argument. One must yield.
      *   **Cost of Yielding Constant Hazard:** Abandons a clean, parsimonious model. Requires specifying a non-constant hazard function (e.g., Weibull with shape parameter >1, implying increasing hazard with age), which is more complex and demands justification for the chosen shape. Weakens the simplicity argument for your anchor.
      *   **Cost of Yielding Fragility Argument:** Forces you to argue that prolonged stability *doesn't* increase fragility (or perhaps even decreases it), which contradicts your stated reasoning about accumulated failure modes, degraded norms, and inexperienced elites.
      *   **Cheaper Revision:**
          *   **Option A (Modify Hazard):** Relax strict constant hazard. Adopt a *bathtub curve* or *increasing hazard* model common in reliability engineering for complex systems *without* a single wear-out part. Early failures (infant mortality), then a relatively constant period, then increasing failures due to accumulated complexity/interdependencies/obsolescence. This accommodates your fragility argument for "old" systems. Your anchor (average lifespan) remains useful, but the *distribution* around it changes. This preserves the core of Point 6 and modifies Point 4.
          *   **Option B (Recast Fragility):** Reposition fragility not as affecting the *baseline hazard rate*, but as affecting the *severity* or *likelihood of occurrence* of specific stressors *relevant to the reference class failure mode*. A "long untested run" makes the system more vulnerable *if* a legitimacy-challenging stressor (Point 2) occurs, but doesn't necessarily change the underlying hazard rate *for all causes*. This keeps Point 4 intact but refines Point 6.
      *   **Settled/Contested:** The applicability of constant hazard to complex socio-political systems is **highly contested empirically and theoretically**. Historians and complexity scientists often argue for non-constant hazards (e.g., Turchin's secular cycles imply rising instability phases). Reliability engineering offers analogies but no definitive proof. Your fragility argument is **speculative** (though plausible) – strong empirical validation at the polity level is lacking. *Betting Odds: I'd bet even odds that constant hazard is *too simplistic* for large polities. I'd only take 3:1 on the specific fragility mechanism being the primary driver over other age-correlated factors.*

  2.  **Tension: Point 2 (Causal Reference Classes) vs. Point 3 (No Unique Events)**
      *   **Nature of Conflict:** Strict adherence to causal classes (Point 2) can *create* effectively unique events. If your causal class is hyper-specific ("fiscal-military strain after >80 years of commercial expansion driven by maritime trade, within a bicameral republic with strong judicial review facing a specific legitimacy narrative failure around immigration"), finding a sufficiently large reference class becomes impossible. Point 3 insists every event belongs *somewhere*, but Point 2's rigor can make the classes so narrow that the base rate estimate is statistically meaningless or relies on 1-2 cases, defeating the purpose.
      *   **What Must Give:** The purity of Point 2 or the absoluteness of Point 3 must bend. You cannot always have large, statistically robust, *purely* causally defined classes for every forecastable event.
      *   **Cost of Loosening Causal Purity:** Risks reintroducing superficial similarity if forced to widen classes. Weakens the theoretical foundation.
      *   **Cost of Accepting "Unique" in Practice:** Undermines Point 3 and potentially opens the door to unfalsifiable inside views if classes are *too* narrow to provide a meaningful anchor.
      *   **Cheaper Revision:** Explicitly adopt a **hierarchy of reference classes**. Start with the broadest causally plausible class ("succession crises in systems with weakly specified succession") for a robust base rate. Then, if justified by validated inside-view knowledge or more specific causal analogues, *condition* the forecast using narrower sub-classes ("...in post-colonial federations" or "...following a prolonged period of executive aggrandizement"). This preserves the causal primacy (Point 2) while pragmatically satisfying Point 3 by ensuring there's *always* a usable class, even if broad. Acknowledge that the narrower the class, the noisier the base rate.
      *   **Settled/Contested:** The *principle* of using causal classes is **best practice (settled)** among sophisticated forecasters (Tetlock's "superforecasters" exhibit this intuition). The *feasibility* of finding non-trivial, robust causal classes for all politically salient events is **contested**. Critics argue true causal isolation is often impossible in complex systems, forcing trade-offs between purity and utility. *Betting Odds: I'd bet even odds that a strict causal definition *often* leads to unusably small classes in real-world political forecasting. I'd take 3:1 that a hierarchical approach is the practical best solution.*

  **Moderate Tension (Requires Refinement or Clarification):**

  3.  **Tension: Point 1 (Small Inside-View Adjustments) vs. Point 7 (Applying Machinery to AI Industry)**
      *   **Nature of Conflict:** Point 1 demands rigorous validation before allowing the inside view to significantly move the anchor. Point 7 states that inside information in the AI industry provides little epistemic edge over the base rate. This *seems* consistent. However, the tension lies in the implication: if your inside view *is* validated (e.g., through a track record on fast-moving tech industries), shouldn't Point 1 *allow* a larger adjustment? Yet Point 7 preemptively dismisses the value of that inside view relative to the base rate. This risks being overly dismissive of potentially *validated* domain expertise.
      *   **What Must Give:** The blanket dismissal of epistemic edge in Point 7 needs qualification, or the threshold for "validated" in Point 1 needs explicit discussion regarding domain expertise.
      *   **Cost:** Admitting validated domain expertise *can* provide an edge might slightly weaken the rhetorical force of the "base rates dominate" argument in specific domains.
      *   **Cheaper Revision:** Refine Point 7: "I don't think *my current, unvalidated* inside view in that world gives me much epistemic edge over the base rate *yet*, consistent with Point 1." Or, more strongly: "Even *with* validated expertise in analogous domains (e.g., past tech disruptions), the base rate for fast-moving concentrated industries often remains a surprisingly strong anchor, limiting the justified adjustment (per Point 1)." This maintains consistency by applying Point 1 strictly to Point 7.
      *   **Settled/Contested:** The **difficulty of consistently beating base rates/simple models with expert judgment (even inside view) is well-established (settled)** (Tetlock, Meehl, Dawes). The extent to which *validated, domain-specific* expertise can *reliably* beat well-chosen base rates in *rapidly evolving* domains like AI is **contested and empirically unclear**. *Betting Odds: I'd bet even odds that *most* self-assessed "inside views" in such domains add little value. I'm unsure (wouldn't bet even odds) whether even validated expertise consistently beats a good causal base rate in hyper-dynamic fields.*

  **Minor Tension/Potential Inconsistency:**

  4.  **Tension: Point 6 (Fragility) vs. Point 4 (Constant Hazard) [Revisited under Point 1 Lens]**
      *   **Nature of Conflict:** If Point 6's fragility argument is a form of "inside view" (reasoning about specific mechanisms like untested norms), then Point 1 dictates it should only move the anchor *if validated out-of-sample*. Is there empirical validation that "long untested runs" reliably predict polity collapse *across causal reference classes*? If not, Point 1 suggests the adjustment away from the constant-hazard base rate anchor should be small, potentially contradicting the "substantial weight" given in Point 6.
      *   **Resolution:** This is partially resolved by addressing the severe tension (Tension 1). If you adopt a non-constant hazard model (Option A), fragility becomes *part of the hazard structure*, not just an adjustment. If you keep constant hazard (Option B), you *must* treat the fragility argument as an unvalidated (or weakly validated) inside view and drastically reduce its weight on the anchor per Point 1. The current "substantial weight" seems inconsistent with strict Point 1 without validation evidence.
      *   **Settled/Contested:** The fragility mechanism itself is **contested and lacks strong cross-polity validation (speculative)**. The *principle* of requiring validation for inside-view adjustments is **settled best practice**. *Betting Odds: I'd take 3:1 that the specific fragility mechanism in Point 6 lacks sufficient cross-polity validation to warrant a *large* adjustment under Point 1's rules, *if* constant hazard is maintained.*

  **The Highest-Leverage Single Revision: Relax Strict Constant Hazard (Point 4)**

  *   **Why:** It directly resolves the most severe tension (vs. Point 6) and indirectly alleviates the minor tension regarding validation of fragility. It better aligns your model with the complex-systems nature of polities you implicitly acknowledge in Point 6. It doesn't destroy your anchor (average lifespan remains informative) but makes your distribution more realistic.
  *   **Cost:** Loss of parsimony. Requires justifying *why* a non-constant model (e.g., Weibull with increasing hazard later in life) fits polities better than constant hazard. Introduces another parameter to estimate (shape parameter).
  *   **Cheapest Implementation:** Adopt a **modifier** to your constant-hazard anchor for "old" systems. E.g., "Constant hazard based on average lifespan `L` is my anchor. For polities significantly older than `L` (e.g., >1.5*L), apply a fragility multiplier `F > 1` to the hazard rate, justified by the reasoning in Point 6, acknowledging this is a pragmatic heuristic awaiting stronger validation." This preserves your anchor logic while incorporating fragility.

  **Settled vs. Contested - Summary:**

  *   **Settled (Among Practitioners):**
      *   The superiority of outside view/base rates as a starting point (Point 1 core).
      *   The necessity of calibration and scoring discipline (Point 5).
      *   The value of causal reasoning over superficial similarity for reference classes *in principle* (Point 2 core).
      *   That treating events as "unique" is usually epistemically irresponsible (Point 3).
      *   That unvalidated inside views add little value and often negative value (Implicit in Point 1, Point 7).
  *   **Contested/Gray Area:**
      *   **The true shape of polity duration distributions (Constant Hazard?):** Highly contested. Empirical evidence is messy and model-dependent. (Point 4).
      *   **The Fragility Hypothesis (Point 6):** Plausible, theoretically grounded in complex systems, but lacks robust, generalizable empirical validation for polities. Competing hypotheses exist (e.g., resilience through stability).
      *   **Practical Feasibility of Pure Causal Classes:** Contested. Requires pragmatic trade-offs (Point 2 vs. Point 3).
      *   **Extent of Validated Domain Expertise Edge:** Unclear, especially in rapidly changing fields. Base rates remain surprisingly potent (Point 1 vs. potential in Point 7).
      *   **Handling of Right-Censored Data (ongoing polities):** While your dismissal of strong selection bias is common, some statisticians argue more sophisticated survival analysis techniques (accounting for entry time) *could* offer marginal improvement, though likely small for your purposes. (Point 4 footnote).

  This framework is rigorous and well-considered. The most critical pressure point is the constant hazard assumption conflicting with your intuitively compelling fragility argument. Addressing that, likely by adopting a more flexible hazard model, would significantly strengthen the coherence of your overall epistemology.
