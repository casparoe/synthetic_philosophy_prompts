answer: |-
  As a propensity theorist, I reject the false dichotomy. Inverse probabilities are indeed derived from physical propensities—specifically, the *forward* propensities inherent in the batch-production process itself. The probability that this die came from the high-doping batch given a six isn't a new disposition; it's *epistemically* inferred from two objective facts: (1) the forward propensity *of the high-doping batch* to produce dice that land six (say, 1/5), and (2) the forward propensity *of the manufacturing setup* to allocate dice to high/low batches (say, 1/10). Bayes’ theorem merely calculates how these *physical tendencies* constrain rational inference. The inverse probability remains anchored in world-dispositions—just not of *this die post-creation*, but of the *generative mechanisms* that produced it.  

  This costs me nothing: causation and trial independence rely on *local* forward propensities (e.g., this die’s chance to land six given its batch). The batch-allocation propensity operates at a different causal scale. Asymmetry is preserved—the die’s landing *now* is caused by its atomic structure, not by future inferences. Inverse probabilities are *calculations* about past propensities, not novel propensities themselves. Your "epistemic work" is just reasoning about *which physical dispositions were actualized*.  

  *(Confidence: 85%. Least sure: Whether "different causal scale" fully resolves the asymmetry tension.)*
