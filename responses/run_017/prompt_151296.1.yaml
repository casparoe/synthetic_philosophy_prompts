  The cases they mention are crucial. Carving relativity means variable choice affects perceived independence. Exchangeability vs. independence matters for repeated trials—should the default be exchangeability? Deterministic vs. chancy systems might need different treatments. Selection effects, like anthropic reasoning, introduce observer-induced correlations. Compounding worry: small independence violations amplify with many variables. Independence as a defeasible claim, not a hidden premise. Handling continuous unbounded spaces, where max-ent can fail.

