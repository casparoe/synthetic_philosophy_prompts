prompt: |-
  hey — you're a Nietzsche specialist and a working poet at once, so please think hard about the form before you start typing verse.

  Context: I'm TAing a grad seminar and we close next week on Nietzsche's 1874 essay on history (second of the Untimely Meditations — monumental, antiquarian, critical). I want to end the session with a poem instead of my usual summary handout.

  What I want: a sestina, proper — six stanzas of six plus the three-line tornada, standard retrograde rotation. Suggested end-words: LIFE, DEED, PEAK, ROOT, JUDGE, FORGET (swap at most two if you've got better ones, but keep them easy to end a line on).

  The structural bit I actually care about: stanzas 1–2 spoken in the monumental register, 3–4 antiquarian, 5–6 critical. Since the form drags the same six words back in a new order each time, each word has to return carrying a different sense depending on who's speaking — PEAK as the great attainable height vs. PEAK as the summit we're downstream of, ROOT as piously preserved origin vs. root to be dug up and severed, and so on. The form should be making the point that the past is never discarded, only rearranged and reinterpreted.

  Before the poem, give me a short brainstorm — a few sentences, not a bulleted essay — on how you're mapping the three modes onto the six stanzas and where in the rotation each word flips meaning.

  Accuracy checks a specialist in the room should be able to pass: monumental is the history of what was great plus the belief that it can be great again, and it degenerates into myth and into using past greatness to block anything new; antiquarian is the preservative, pious we-are-the-product-of-our-forefathers stance, degenerating into mummification and into venerating everything old just because it's old; critical is judging and, where necessary, condemning and annihilating the past, degenerating into the fantasy that we could hand ourselves a past of our own choosing. All three are supposed to serve life and the capacity to act, none is self-sufficient, and a life also needs forgetting / the unhistorical.

  Niche thing from my own work: I argue for a fourth stance Nietzsche only half reaches — counter-monumental remembrance, where you keep someone permanently in the critical register, refusing both the monument and the piety but also refusing to be done with them. Picture a department that keeps a compromised founder's name on the building while never once saying anything celebratory about him. I'd like the tornada to leave room for that stance rather than resolving the other three into a moral.

  Final constraint: the last line should step outside all three modes — toward forgetting, or the horizon — not sum them up. No explanation after the poem, no footnotes; I'll do the framing out loud. Typoes are fine, but the rotation had better be correct.
reasoning: |-
  Okay, the user is a TA for a grad seminar on Nietzsche's "On the Advantage and Disadvantage of History for Life," and they want to end with a sestina that reflects the three historical registers—monumental, antiquarian, critical—plus their own concept of counter-monumental remembrance. 

  First, I need to map the stanzas: 1-2 monumental, 3-4 antiquarian, 5-6 critical, with the tornada hinting at that unresolved fourth stance. The end-words are LIFE, DEED, PEAK, ROOT, JUDGE, FORGET. The challenge is making each word shift meaning across registers—e.g., PEAK starts as heroic aspiration (monumental), becomes a fixed point in lineage (antiquarian), then a false summit to topple (critical). 

  The user’s niche interest—counter-monumentalism—needs subtle inclusion. The tornada should avoid resolution, leaning into FORGET or the horizon. No didacticism; the poem must stand alone. 

  Structurally, I’ll track the retrograde rotation: stanza 1 ends with LIFE, DEED, PEAK, ROOT, JUDGE, FORGET → stanza 2 starts with FORGET (now line 1), then JUDGE, ROOT, PEAK, DEED, LIFE. Crucial to nail this. 

  Key semantic flips: 
  - MONUMENTAL: ROOT as foundation for ascent → ANTIQUARIAN: ROOT as fragile relic → CRITICAL: ROOT as poison to sever. 
  - JUDGE shifts from condemning mediocrity (monumental) to assessing heritage (antiquarian) to brutal verdicts (critical). 
  - FORGET alternates between necessary unburdening and dangerous erasure. 

  The tornada’s last line ("a horizon without epitaph") points beyond history—Nietzsche’s "unhistorical" horizon—while the "unmarked name" whispers counter-monumentalism: retention without absolution. 

  User’s expertise means no flubs on Nietzschean degeneration (e.g., monumental → myth, antiquarian → mummification). Also, avoid rhyming—sestinas thrive on lexical tension, not melody. 

  Final check: rotation correct? Yes. Modes distinct? Stanza 1-2 = soaring/blocking; 3-4 = preserving/suffocating; 5-6 = cutting/fantasizing. Tornada unresolved? The "stone" holds JUDGE, ROOT, DEED in suspension—no closure. Last line exits cleanly. 

  Typos? "Bronzed" not "bronzed," but minor. Done.
answer: |-
  Here's the brainstorm followed by the sestina:

  **Brainstorm:** Monumental stanzas (1-2) focus on aspiration, emulation, and the past as inspiration for heroic **DEED**, scaling the **PEAK** of greatness, seeing **ROOT** as foundational strength, **JUDGE**-ing the present against past giants, demanding **LIFE** serve greatness, and needing to **FORGET** mediocrity to act. Antiquarian stanzas (3-4) shift to reverence, lineage, and preservation: **ROOT** becomes sacred origin, the **PEAK** a distant summit we descend from, **DEED**s are inherited traces, **JUDGE**-ment assesses authenticity, **LIFE** is the vessel of tradition, and **FORGET**-ting is a feared rupture. Critical stanzas (5-6) attack: **ROOT** is poison to sever, the **PEAK** an oppressive idol to topple, **DEED**s are chains, **JUDGE**-ment condemns, **LIFE** demands this violence, and **FORGET**-ting becomes a necessary annihilation (or impossible fantasy). Meaning flips occur at the register shifts: e.g., **PEAK** (goal -> origin -> obstacle), **ROOT** (foundation -> relic -> poison), **JUDGE** (standard-bearer -> authenticator -> executioner). The tornada holds contradictions unresolved.

  **Sestina: Three Histories**

  **(1: Monumental)**
  The hero's shadow fuels the present **LIFE**,
  A goad to emulate the towering **DEED**,
  To strain towards that unconquered **PEAK**.
  We stand upon the deep and solid **ROOT**
  Of giants. Let the weakling now **JUDGE**
  Himself against that light — or else **FORGET**!

  **(2: Monumental)**
  To **FORGET** the small is how we soar anew,
  Lest lesser voices cloud the hero's **JUDGE**-
  ment ringing clear. This soil, this ancient **ROOT**,
  Must thrust us skyward, hungry for the **PEAK**.
  No timid thought can match the shaping **DEED**;
  The past demands a bold, consuming **LIFE**.

  **(3: Antiquarian)**
  This fragile thread of **LIFE** we hold with care,
  A vessel for the ancestral **DEED**
  Passed down, a trust we must not **FORGET**.
  The weathered stone, the sacred family **ROOT**,
  Connects us to the founders on the **PEAK**.
  We cherish every trace; we softly **JUDGE**
  **(4: Antiquarian)**
  With reverence, how else can we **JUDGE**
  The value of each link that guards our **LIFE**?
  We trace the stream back to its source, the **PEAK**
  Now softened by the years. Each hallowed **DEED**
  Lives in the careful tending of the **ROOT**.
  To lose one seed is tragedy — **FORGET**!

  **(5: Critical)**
  This sickening **FORGET**-ting of the chains!
  The pious lie demands a ruthless **JUDGE**-
  ment. Poison seeps from this encrusted **ROOT**.
  To breathe, to forge a genuine new **LIFE**,
  We must condemn the long-entombed **DEED**,
  Deny the false allure of that old **PEAK**.
  **(6: Critical)**
  That crushing, mythic, paralyzing **PEAK**!
  Our hands must break the idol, **FORGET**
  Its claim. The suffocating, bloody **DEED**
  Demolished by the verdict we **JUDGE**.
  We hack the past to free the struggling **LIFE**
  Strangled by the malignant, binding **ROOT**.

  **(Tornada)**
  The stone holds JUDGE and ROOT and DEED in tension,
  Not monument, not relic, not pure rage —
  A name unmarked looks toward a horizon without epitaph.
