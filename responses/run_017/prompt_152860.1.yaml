answer: |-
  ## Terminal State Robustness: A Regularization Approach to Supertask Paradoxes

  **Precis:** This paper argues that debates about supertask possibility systematically conflate three distinct questions: schedule prescription consistency, physical realizability, and terminal state robustness. Focusing on the latter, it proposes that a supertask's outcome is well-defined *only if* it is robust under regularization—i.e., convergent across all admissible finite approximations (e.g., truncating steps or imposing minimum switching times). The project defends the thesis that robustness-under-regularization provides the correct diagnosis for paradoxes like Thomson’s lamp (exhibiting limit-fragility), explains the intuitive difference for collision/relativistic cases (limit-stable), and offers a superior framework to standard logical or physical possibility approaches.

  **Research Question:** Is robustness-under-regularization the necessary and sufficient condition for a well-defined supertask outcome, and does this framework resolve the apparent paradoxes better than competing accounts (e.g., Benacerraf’s incompleteness)?

  **Sharpening the Question & Critique of Standard Positions:**
  1.  **The Conflation:** Existing literature often treats "Is supertask X possible?" monolithically. This obscures key differences:
      *   (a) *Prescription Consistency* (Thomson): Does the infinite schedule logically define a state *at* the limit time? (Benacerraf's target).
      *   (b) *Physical Realizability*: Could any finite physical system execute the infinite schedule within finite time/space? (Kinematic/dynamic constraints).
      *   (c) *Terminal State Robustness*: Is the outcome *uniquely determined* by the schedule, insensitive to *how* the infinite limit is approached via finite approximations?
  2.  **Limits of Existing Approaches:**
      *   *Logical-Possibility-First*: Focuses primarily on (a). Even if consistent prescription is shown (e.g., via set theory for lamp states), it fails to address why the outcome feels indeterminate *physically* or *procedurally*. Benacerraf’s "incomplete description" reply diagnoses (a) but doesn’t engage (c) directly.
      *   *"Check Physics" Approach*: Dominates discussion of (b). While crucial for realizability, it sidesteps the conceptual core of paradoxes like Thomson's lamp – its indeterminacy arises *before* physics, in the idealized mathematical description’s failure to pin down a unique limit. Physics might forbid realizing *any* supertask, but that doesn't clarify why *some idealized descriptions* (collisions, relativity) seem determinate while others (lamp) don’t.
  3.  **The Gap:** Neither approach adequately explains the *intuitive difference* between supertask types. Why do collision mechanics (e.g., Laraudogoitia’s balls) or relativistic scenarios (e.g., Malament-Hogarth spacetimes) *feel* like they have determinate outcomes despite infinite processes, while the lamp does not? Standard positions leave this unexplained.

  **The Regularization Framework: Why it Beats Alternatives**
  1.  **Core Argument:** Robustness-under-regularization provides the missing diagnostic tool. A supertask outcome is genuinely well-defined iff the limit state is the same *regardless* of the specific path taken to approximate the infinite process finitely (e.g., stopping after N flips, imposing min switch time ε → 0).
  2.  **Advantages:**
      *   *Precision over Benacerraf:* It doesn't merely say the description is incomplete; it specifies *what kind* of incompleteness exists – a *failure of convergence* in the limit. It quantifies the indeterminacy by showing divergent outcomes under different regularizations (e.g., lamp "on" if stopped after odd N, "off" if even N; indeterminate state if min time ε imposes specific timing constraints).
      *   *Explains the Difference:* Collision mechanics (using classical elastic collision laws) and relativistic worldlines (using smooth spacetime geometry) typically yield *convergent*, unique predictions under regularization (e.g., final ball positions/velocities or proper time integrals stabilize as approximations improve). Thomson's lamp does not.
      *   *Captures Limit-Fragility:* Directly analogizes to singular points in differential equations (like Norton's Dome) where the initial conditions + laws fail to determine a unique trajectory. The supertask paradox is revealed as a discontinuity or non-uniqueness at the limit point in the state space.
      *   *Goes Beyond Prescription/Realization:* It addresses a distinct issue – the *dependence* of the supposed outcome on the *method of completion*, which is conceptually prior to both consistent prescription (a) and physical realization (b). A schedule can be consistently prescribed *and* physically unrealizable, yet still yield a robust outcome under regularization (in principle). Conversely, a consistently prescribed schedule can fail robustness (like the lamp).

  **Possible Conclusions:**
  1.  **Strong Robustness Thesis:** Robustness-under-regularization is *necessary and sufficient* for a well-defined supertask outcome. Thomson’s lamp fails because it’s non-robust; collision/relativity cases succeed because they are robust. This is the fundamental distinction.
  2.  **Moderate Robustness Thesis:** Robustness is necessary but not always sufficient (e.g., unforeseen physical constraints might still block realizability even with robust math). However, it remains the *primary* criterion for *mathematical* well-definedness, explaining the core paradoxes better than alternatives. Non-robustness implies ill-definedness.
  3.  **Robustness as Symptom:** Robustness is merely a consequence of the underlying dynamics being continuous or well-posed at the limit point. The *real* issue is the continuity of the state evolution map. The regularization approach is useful but derivative.
  4.  **Collapse into Prescription:** The prescription/carry-out distinction *is* primary, and robustness analysis is just a complex way to check for consistent prescription under finite approximations. Benacerraf was essentially right, and regularization adds little.

  **Deciding Between Conclusions:**
  *   **For (1)/(2) vs (3):** Analyze whether robustness can be demonstrated *without* presupposing continuity of the state evolution. Does robustness offer a *practical diagnostic* even for complex systems where continuity is hard to prove? Can non-robustness arise *despite* formal continuity in an abstract state space (highlighting a flaw in the state representation)? Success here supports (1)/(2).
  *   **For (1)/(2) vs (4):** Does the robustness analysis reveal *why* certain prescriptions (lamp) feel indeterminate while others (collisions) feel determinate, in a way that the bare prescription/carry-out distinction cannot? Does it provide a *gradient* of well-definedness (degree of robustness) rather than a binary consistent/inconsistent? Success supports (1)/(2).
  *   **For (1) vs (2):** Can we construct a hypothetical supertask that is mathematically robust but physically impossible for deep reasons unrelated to the infinity (e.g., violating energy conservation)? If so, (2) wins. If robustness seems to capture *all* relevant conceptual well-definedness for the idealized case, (1) wins.

  **Failure Conditions:**
  *   **Collapse into Continuity:** If demonstrating robustness for a specific supertask *requires* proving continuity of the state evolution map, and vice-versa, then the project merely restates the need for continuity in calculus terms without novel insight.
  *   **Prescription Dominance:** If all instances of non-robustness can be shown to stem *directly* from an inconsistent prescription (a la Benacerraf) under analysis, rather than revealing a new dimension of fragility, then the regularization framework is redundant.
  *   **Indistinct from Physical Constraints:** If the difference between lamp-like and collision-like cases is *entirely* explained by the specific physical laws governing collisions/spacetime providing a determinate limit *by fiat*, while the lamp's switching rule does not, then the "robustness" concept adds no explanatory power beyond analyzing the specific dynamics of each case.

  **Scope Management:**
  *   **Core Focus:** Deep analysis of Thomson's Lamp and *one* contrasting case (likely infinite elastic collisions as the clearest example of apparent robustness). Relativistic cases (Malament-Hogarth) introduce significant additional complexity (GR, chronology protection) and will be mentioned as motivation but not analyzed in depth.
  *   **Cut:** Extensive review of *all* historical supertask paradoxes; detailed analysis of multiple physical realizability arguments (beyond establishing the distinction); in-depth discussion of relativistic physics or quantum gravity implications; comprehensive critique of *all* existing philosophical positions (focus on Benacerraf and standard logical/physical possibility proponents as foils).
  *   **Method:** Conceptual/philosophical analysis grounded in mathematical reasoning (limits, convergence) and illustrative physical models (idealized mechanics). Formal proofs kept to necessary minimum for clarity.
  *   **Goal:** Not to definitively settle the possibility of all supertasks, but to establish the *diagnostic value* of the robustness criterion for understanding supertask paradoxes and their resolution.
