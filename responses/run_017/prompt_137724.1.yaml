prompt: |-
  You are a philosopher of social science and public policy who is equally at home in survey methodology and in welfare economics — someone who has argued with both happiness researchers and their critics and found each side half right. Please think carefully before answering, and start by brainstorming privately: generate at least a dozen candidate open questions before pruning. I do not need to see the full brainstorm; I do need the pruning to be visible in the final ordering. What I want is a defended agenda, not a balanced survey, and not a reading list. Assume you have no web access, so argue from the structure of the problem rather than from sources, and do not cite anything.

  Context. I direct a small wellbeing evidence unit inside the finance ministry of a middle-income country of roughly 40 million people. I have about two years and the equivalent of six analyst-years, the ability to bolt one new module onto an existing national household survey, access to administrative data, and essentially no capacity to run large field experiments. Our minister has said he wants the country to top the annual global happiness rankings within a decade. My job is to decide what my unit should actually spend its scarce effort on.

  I can distinguish three goals his slogan might mean: (i) improve our rank; (ii) raise whatever the rankings actually measure; (iii) raise how well our citizens' lives go, whether or not any index captures it. Which of these come apart, and how much, is itself something I want your agenda to tell me how to find out.

  Here are a few distinctions my team has been using informally; adopt them, refine them, or explain why they are confused:

  - Ladder credit versus affect capital. A government can plausibly raise citizens' answers to the standard 0-to-10 life-evaluation question by improving the story people can tell about their lives — status, national prestige, perceived upward mobility — while depleting the mundane conditions that generate positive daily experience: sleep, unhurried sociability, time not spent commuting. Call the difference ladder credit minus affect capital. The open question is whether the flagship rankings are sensitive to something that can diverge from lived experience in this way, and in which direction and magnitude for a country like ours.
  - Compositional versus causal readings of rank. A country's score can rise because its people are doing better, or because the unhappy have emigrated, or because the surviving population has adapted its expectations downward. These have identical signatures in a cross-sectional ranking.
  - The publication-lag problem. Rankings grade a government on data collected years earlier, so a government that tops them is largely being graded on its predecessor's economy — which matters a great deal for whether rank is even an actionable target.
  - Rank-conditional budgeting. Suppose the treasury must publish a written justification whenever a policy is projected to lower the national rank. That rule turns the index into an explicit constraint rather than a report card.

  The question. Given my resources, remit, and time horizon, which open questions or lines of work should my unit prioritize, and in what order? I am less interested in the list than in the reasoning. For each item, state what other questions depend on its answer, whether it is tractable for a team with my tools rather than for a well-funded experimental group, how neglected it is relative to how much it matters, and what specific evidence arriving over the next two years would move it up or down the list. Rank at most five or six. Include at least one question my staff will assume is central and that you would drop as overrated, and say why it fails to carry weight.

  Two further things. First, is there any defensible reading of the slogan on which a country should try to top the rankings as such, rather than treat them as a noisy proxy — and which of your ranked questions settles that? Second, specify the single survey module you would have me add: what it asks, why those questions rather than the obvious alternatives, and what pattern in the answers would most change your recommended agenda.
reasoning: |-
  Hmm, the user is directing a wellbeing evidence unit in a finance ministry of a middle-income country. They need to prioritize research questions given limited resources, with the minister wanting the country to top global happiness rankings. I need to provide a defended agenda, not just a balanced list. The user has outlined three possible interpretations of the minister's goal, and they want me to explore how these might diverge.

  The distinctions they've provided are interesting. "Ladder credit versus affect capital" highlights how narrative satisfaction might conflict with daily emotional experience. "Compositional versus causal readings of rank" points to demographic shifts affecting scores without true wellbeing improvement. "Publication-lag problem" shows rankings reflect past governments' performance. "Rank-conditional budgeting" could turn indexes into constraints rather than measures. These are all crucial for understanding the limitations of happiness rankings.

  Given my constraints - no large experiments, ability to add one survey module, access to administrative data - I need to focus on questions that are tractable with existing tools. Some obvious candidates come to mind: How does ladder credit diverge from affect capital in our context? What drives emigration patterns among the unhappy? How do policy changes actually affect rankings given publication lags? But I should also consider less obvious angles.

  The most overrated question would probably be "What policies directly increase ladder scores?" Many teams would focus here, but it's misguided because it treats the symptom rather than the cause, ignores measurement validity, and risks gaming the system. Instead, I should prioritize questions that reveal whether rankings measure what matters.

  For the survey module, adding time-use diaries with affect sampling would be powerful. Asking "What were you doing?" and "How did you feel?" at random moments could reveal discrepancies between narrative evaluation and lived experience. If we see large gaps between ladder scores and experienced wellbeing, that would elevate questions about measurement validity in our agenda.

  On whether topping rankings is intrinsically worthwhile - only if we confirm rankings measure wellbeing without perverse incentives. The ladder-affect divergence question is key here. If they align, rankings might be worth pursuing; if not, we should focus on genuine wellbeing.

  Here's how I would structure the prioritized questions:
  1. Ladder-affect divergence: Most fundamental as it tests validity of rankings
  2. Emigration patterns: Addresses compositional effects using admin data
  3. Policy attribution windows: Tackles publication lag with policy timing analysis
  4. Expectation anchoring: Explores adaptation effects through vignettes
  5. Budget constraint modeling: Simulates gaming risks

  The user needs actionable insights, not theory. Each question should be justified by its tractability, importance, and how new evidence would affect its priority. The time-use module is crucial because it generates data no other method can provide about daily lived experience versus global evaluations.
answer: |-
  Here is a defended research agenda, pruned and prioritized based on tractability with your resources, centrality to interpreting the minister's goal, and potential to redirect policy intelligently. The pruning discarded questions requiring longitudinal/experimental designs, those answerable only by international consortia, or those addressing philosophical debates without policy traction.

  ### Prioritized Questions (Ranked)
  1. **Does ladder-affect divergence exist *in our population*, and is it sensitive to *policy-tractable* factors?**  
     - *Why prioritize?* Fundamental to knowing if rankings measure lived experience (Goal iii) or a manipulable narrative (Goal i). If divergence is large, topping rankings could actively harm wellbeing.  
     - *Tractability:* Bolt time-use diaries + experience sampling (e.g., "How stressed/joyful do you feel RIGHT NOW?") onto your survey. Link to ladder scores. Admin data on commuting/stress-related health visits validates patterns.  
     - *Neglectedness:* Most research assumes alignment; policy-relevant divergence in middle-income contexts is understudied.  
     - *Evidence shift:* If high-stress/high-ladder groups emerge, elevate this. If alignment is tight, deprioritize.  
     - *Downstream questions:* Shapes whether ranking pursuit is ethical (see final note).

  2. **Do emigration, mortality, or fertility trends *disproportionately* alter the happiness distribution?**  
     - *Why prioritize?* Tests "compositional" effects (Goal i vs ii/iii). If the unhappy emigrate or die younger, rankings rise without wellbeing gains.  
     - *Tractability:* Merge survey data with anonymized admin records (emigration, mortality). Model demographic shifts' impact on aggregate scores.  
     - *Neglectedness:* Often hand-waved; hard data on selective mobility is sparse in policy models.  
     - *Evidence shift:* If emigration correlates strongly with low wellbeing + rising scores, investigate causes (e.g., push factors vs. opportunity).  

  3. **What is the *actual time lag* between policy changes and ranking effects, given survey cycles?**  
     - *Why prioritize?* Critical for actionable targets (Goal i). If rankings reflect 4-year-old data, "topping in a decade" requires 6-year policy horizons.  
     - *Tractability:* Analyze historical policy shifts (e.g., tax reforms, infrastructure) against survey timing. Simulate publication lags with existing data.  
     - *Neglectedness:* Lag is acknowledged but rarely quantified for specific policies.  
     - *Evidence shift:* If lags exceed 3 years, focus shifts to leading indicators; if <2 years, rank becomes more actionable.  

  4. **How do reference frames (e.g., "anchoring vignettes") *vary* across subpopulations, and does this distort cross-group comparisons?**  
     - *Why prioritize?* Reveals if score gains reflect adaptation/lowered expectations (Goal ii vs iii).  
     - *Tractability:* Add vignette module (e.g., "Rate happiness of [described scenario]") to survey. Compare anchoring to self-reports across income/regions.  
     - *Neglectedness:* Methodologists debate this, but policy teams rarely test local variation.  
     - *Evidence shift:* If anchoring differs sharply (e.g., rural poor rate all vignettes lower), aggregate scores are misleading.  

  5. **Under rank-conditional budgeting, what *perverse incentives* emerge in policy simulation?**  
     - *Why prioritize?* Tests if rankings as constraints (Goal i) harm substantive welfare (Goal iii).  
     - *Tractability:* Model trade-offs using existing policy tools (e.g., "If we cut commute times but reduce national prestige, how does rank shift?"). Qualitative interviews with planners.  
     - *Neglectedness:* Gaming risks are theorized but not modeled in real budget contexts.  
     - *Evidence shift:* If models show minor trade-offs, deprioritize; if major sacrifices emerge, warn ministers.  

  ### Overrated Question to Drop
  - **"What policies directly increase ladder scores?"**  
    *Why drop?* Premature without knowing *what scores mean* (Q1, Q4), whether gains are compositional (Q2), or if lags make attribution impossible (Q3). Risks optimizing a noisy/bad proxy. Your staff will favor it because it's action-oriented, but it lacks foundational validity checks.  

  ### Defensible Reading of "Topping Rankings"
  A ranking is intrinsically worth topping **only if** it robustly measures welfare (Q1 shows alignment), isn't gamed by composition (Q2), and reflects current governance (Q3). **Q1 settles this:** Large ladder-affect divergence implies rankings are not welfare measures but narratives. Topping them might then be a *signaling* goal (e.g., attracting talent/investment), but that requires separate evidence.  

  ### The Survey Module: Time-Use Diaries with Experience Sampling  
  - **What:** Randomly prompt respondents 5x/day for 2 days:  
    - *Activity:* "What were you doing 10 mins ago?" (Coded: work/commute/leisure/social/etc.)  
    - *Affect:* "How stressed/calm and joyful/sad did you feel?" (0-10 scales)  
    - *Control:* "Who were you with?" and "Where were you?"  
  - **Why not alternatives?**  
    - Standard affect modules (e.g., "Yesterday, did you feel X?") suffer recall bias.  
    - U-index requires complex coding; diaries capture *context* for policy (e.g., stress during commute vs. leisure).  
  - **Game-changing pattern:** If high-ladder groups show high stress during mandatory activities (e.g., work commutes), it signals ladder-affect divergence (Q1) and prioritizes time-affluent policies over status projects.  

  ### Agenda Logic
  - **Order:** Q1 is foundational. Without it, you risk chasing illusions. Q2–3 address ranking mechanics; Q4–5 explore distortions.  
  - **Resource fit:** All use your survey + admin data; no experiments needed.  
  - **Two-year pivot:** Early results from the diary module (Q1) and lag analysis (Q3) will reshape later priorities. If divergence/lags are minimal, refocus on policy-attribution studies. If severe, rethink the minister’s target.  

  This agenda treats rankings not as truth but as an institution whose relationship to welfare must be stress-tested—because optimizing a broken index is the surest way to miss what matters.
