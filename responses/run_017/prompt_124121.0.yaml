prompt: |-
  I am convening a graduate seminar on population axiology in the spring, and I have been unable to stop worrying at an argument from a department colloquium we hosted last month. The speaker's target was not totalism but the routine use of *the repugnant conclusion* as a reductio of it. Her claim was that the conclusion can be derived from premises that never mention the goodness of adding people — premises, she said, that the person-affecting theorists in the room had already granted in other contexts — and that the argument in fact yields something considerably stronger and worse: that a single person leading an immensely long, drab life constitutes a better outcome than a billion people leading magnificent ones. The question period was swallowed by an unrelated worry about infinite populations, so I never got to press her. Reconstructed from my notes, the argument runs as follows.

  (1) Appending to a life a further year during which the person has positive welfare — a year that is on its own worth living through — leaves the enlarged life at least as good for the person whose life it is; and since betterness-for-a-person is transitive, any number of such appendices does the same. (2) There is no in-principle upper bound on the length of a life, and such years can be added without introducing suffering, degradation, or the frustration of the person's ends; so for any magnificent but finite life, and any finite total of welfare you like, there is a longer life of the same person, every year of which is *barely worth living*, whose total welfare exceeds that figure. (3) A life containing more total momentary welfare, with the subject and everything else held fixed, is better for its subject. (4) If two outcomes contain a single person each and differ only in that her life is better for her in the first, then the first outcome is better — the principle of personal good, which even the critical-level and person-affecting views I have sympathy for are happy to grant. (5) So the outcome in which one person lives an immensely long drab life is better than the outcome in which that same person lives a magnificent mortal one. (6) *Grouping indifference*: the value of an outcome is fixed entirely by the distribution of welfare across the person-moments it contains, and not at all by how those person-moments are parceled into lives; two outcomes containing the same person-moments at the same welfare levels are equally good whether the moments compose one long life or many short ones. (7) Now apply (6) twice. Take any finite population of magnificent lives, however large, and re-bundle its person-moments into a single magnificent life of equal total duration and welfare; then take the immensely long drab life from (5), chosen so that its total exceeds that of the re-bundled magnificent life, and re-bundle its person-moments into a vast population of ordinary-length lives, each barely worth living. Both re-bundlings preserve value by (6), and the drab outcome beats the magnificent one by (5), so by transitivity the vast population of drab lives is better than the magnificent population. That is the repugnant conclusion, arrived at without ever assuming that adding people is good; and the intermediate result — one person dribbling along at a barely positive level for long enough is a better outcome than any number of magnificent lives — was, she admitted, the claim she actually wanted, since it shows that our resistance to the repugnant conclusion is really resistance to large numbers rather than to drabness.

  What I cannot swallow is the intermediate result rather than the repugnant conclusion itself, which I stopped treating as a reductio some time ago. I do not believe that one immensely long drab life is better than a billion magnificent ones, and I do not believe that my resistance to that claim is mere number-aversion. But I cannot see where to intervene. I am strongly attached to (6): once the distribution of welfare across all the person-moments in an outcome is fixed, I do not know what else there is for the value of that outcome to be a function of, and I do not see how to make the parceling of moments into subjects matter without invoking a metaphysically deep fact about personal identity — exactly what a broadly Parfitian picture of persons denies. I am equally attached to (4) and to the judgment that the billion magnificent lives win. That points at (1)–(3), the intrapersonally summative picture of prudential value, but I use that picture elsewhere in my teaching, I do not know what a non-summative account of a life's goodness-for-its-subject would even look like formally, and in any case I suspect that if personal identity is shallow, the line between (1) and the interpersonal assumptions the argument claims to avoid cannot be drawn at all. There is also a loose end I could not pin down: *barely worth living* seemed in her mouth to be a property sometimes of a year and sometimes of a whole life, and I could not tell whether that instability does any work in the argument or only in how shocking the conclusion sounds. So: name the step that fails, explain why it looked innocent, and price the alternatives — including, if you think the argument is after all sound, what accepting the intermediate conclusion would cost me elsewhere in the subject.
reasoning: |-
  Okay, the user is convening a graduate seminar on population axiology and is troubled by an argument presented in a recent colloquium. The argument appears to derive the repugnant conclusion without relying on the goodness of adding people, and even suggests that a single immensely long drab life could be better than a billion magnificent ones. The user is particularly concerned about this intermediate conclusion and wants to identify which step fails.

  First, I need to parse the argument's seven steps. The key premises are: (1) adding good years improves a life, (2) no upper bound on life length allows drab lives to exceed any welfare total, (3) total welfare determines prudential value, (4) the principle of personal good for single-person cases, (5) the intermediate conclusion that a long drab life beats a magnificent one, (6) grouping indifference (welfare distribution depends only on person-moments, not their bundling into lives), and (7) re-bundling to derive the repugnant conclusion.

  The user is attached to premises (4) and (6) but rejects the intermediate conclusion. This suggests the problem lies in (1)-(3). Premise (3) assumes that total momentary welfare determines a life's goodness, but this is precisely where the argument might fail. In a Parfitian framework where personal identity is shallow, the additive model might not hold because psychological connectedness matters. If a life becomes too long with barely positive moments, the subject might not form a coherent narrative or enduring projects, reducing overall value beyond what summation captures.

  The user mentions using the summative model elsewhere in teaching but is open to non-summative accounts. They also note instability in "barely worth living" between years and whole lives. This ambiguity might mask that a year barely worth living doesn't guarantee a life composed of such years is barely worth living, especially over extreme durations where narrative coherence degrades.

  The solution is to reject (3)'s simple summation. Instead, the value of a life could depend on temporal patterns, narrative structure, or peaks and ends. For example, magnificent lives have higher peaks and meaningful projects, while drab lives lack depth even with high totals. This non-additive view aligns with person-affecting views that care about quality of existence over aggregation.

  The cost of this move is revising how we model prudential value. It complicates population ethics but avoids the counterintuitive intermediate conclusion. The user might need to address how to formalize non-summative accounts, possibly using averaging or narrative models. However, this preserves the core intuition that billion magnificent lives are better than one drab life, without abandoning grouping indifference or personal good principles.
answer: |-
  Your resistance is well-placed—the intermediate conclusion (Step 5) is indeed the argument's Achilles' heel, and the flaw lies primarily in **Premise (3)**, amplified by ambiguities in "barely worth living" and the transitivity assumption in (1). Here's the breakdown:

  ### **Step-by-Step Diagnosis**
  1.  **Premise (3) fails:** *"A life containing more total momentary welfare [...] is better for its subject."*  
      This assumes **strict additive aggregation** of momentary welfare into lifetime welfare. While intuitive for moderate life extensions, it breaks down catastrophically for the *extreme* scenario constructed in (2). The problem isn't summation *per se*, but the **erasure of temporal structure, narrative coherence, and qualitative thresholds** that matter for prudential value. A life composed of a trillion barely-positive moments (e.g., mild boredom punctuated by fleeting distractions) may "sum" to a colossal total, but lacks:
      -   **Meaningful Projects:** Magnificent lives involve sustained pursuits, relationships, and achievements that require time and intensity. Drab moments cannot aggregate into magnificence.
      -   **Threshold Effects:** Moments "barely worth living" might rely on contrast with richer experiences. A life *solely* composed of them may fall below a **qualitative threshold** where existence itself becomes tedious or devoid of recognizable human value—even if each moment is technically "positive."
      -   **Discounting/Non-Linearity:** Prudential value may discount the far future, or exhibit diminishing marginal utility of duration. A year added at the end of a 10^100-year life of tedium contributes negligible (or even negative) value *to the subject's overall existence*, violating strict additivity.

  2.  **Ambiguity of "Barely Worth Living" (BWL) does critical work:**  
      -   **Year-Level BWL:** Claimed to be achievable without suffering/frustration (Step 2). This *might* be plausible for isolated years.  
      -   **Life-Level BWL:** The argument *relies* on the *life* composed *only* of such years still being "barely worth living" (or at least, net positive) *for its subject*. **This does not follow.**  
          A life consisting *entirely* of BWL moments may be **intolerable** due to:  
          -   **The Hedonic Treadmill:** Constant minimal positivity may register as neutrality or worse over time.  
          -   **Absence of Flourishing:** A life without peaks of joy, depth, or meaning may fail to meet a minimal threshold for a "life worth living," even if no single moment is negative.  
      The argument surreptitiously transfers the acceptability of *adding* a BWL year to an *existing* life (which might be tolerable due to contrast/context) to the acceptability of a *life defined solely* by BWL moments. This is invalid.

  3.  **Transitivity in (1) is misapplied:**  
      While adding *one* BWL year to a magnificent life plausibly leaves it at least as good, adding *trillions* of such years does not necessarily preserve "at least as good" due to the non-linearities and threshold effects above. Transitivity holds for *ordinal* relations, but the *meaning* of "better for the person" changes as life-structure degrades. The repeated addition fundamentally alters the nature of the life.

  4.  **Consequence for Step (5):**  
      The "immensely long drab life" from (2) & (3) likely **is not better for its subject** than the magnificent mortal life. Its colossal total welfare is an artifact of faulty aggregation (Premise 3). The subject of the drab life would plausibly prefer the magnificent finite life. Premise (4) (Principle of Personal Good) thus doesn't compel us to say the drab-life outcome is better.

  ### **Why Premise (3) Looked Innocent (and Costs of Rejecting It)**
  *   **Innocent Appearance:** Additive summation is the default formal model in economics, decision theory, and much philosophy. It works well for moderate scales, finite goods, and interpersonal aggregation under strict conditions. It feels "objective" and quantifiable.
  *   **Costs of Rejection:**
      1.  **Formal Complexity:** You need a non-additive model of lifetime welfare. Candidates include:
          *   **Averaging:** Value depends on average welfare per moment/time. (But this rejects Step 1!).
          *   **Narrative/Peak-End Models:** Value weights peaks, troughs, endings, or narrative coherence (Kahneman, Velleman). Formally messy.
          *   **Thresholds/Sufficientarianism:** Flourishing requires surpassing minimal qualitative thresholds; moments below threshold don't aggregate "up." (Closer to Aristotle/Nussbaum).
          *   **Critical Levels for Duration:** Adding a BWL year contributes less than its standalone value to very long lives.
      2.  **Teaching Adjustments:** You'll need to explicitly discuss the *limits* of summation for extreme durations and qualitatively flat lives alongside standard models like totalism or critical-level views. Parfit's own discussion of the "Repugnant Conclusion" already hints at qualitative concerns beyond summation.
      3.  **Person-Affecting Symmetry:** Ironically, *rejecting* strict summation aligns *better* with core person-affecting intuitions. PAA often emphasizes the *quality* of existence for individuals over mere aggregation. Accepting the argument's Step (5) is far *more* damaging to PAA than rejecting summation.

  ### **Saving What You Value**
  *   **Premise (6) (Grouping Indifference) is Safe:** You can keep it. The flaw is in the *evaluation of the drab life's prudential value* (Steps 1-3), not the rebundling. The rebundling just exposes the absurdity *if* you accept the faulty intrapersonal aggregation. Rejecting (3) blocks the absurdity *before* rebundling.
  *   **Premise (4) (Principle of Personal Good) is Safe:** You only need to deny its *application* in Step (5) because the antecedent ("her life is better for her in the first") is false for the drab vs. magnificent life comparison.
  *   **Resisting the Intermediate Conclusion is Justified:** It's not mere "number-aversion"; it's recognizing that a life of immense duration composed *only* of BWL moments likely constitutes a *kind of suffering* (existential tedium, lack of meaning) that violates the premises (no suffering/frustration) and fails to be "better for" the person compared to a magnificent finite life.

  ### **Conclusion & Path Forward**
  The fatal step is **(3)**: The strict additive aggregation of momentary welfare into lifetime welfare fails for the extreme, monotonous, immensely long life constructed in the argument. This failure stems from the erasure of temporal structure and qualitative thresholds essential for a life to be good *for the person living it*. The ambiguity of "barely worth living" masks the leap from tolerable moments to an intolerable life.

  **Cost:** You must develop/teach a more nuanced model of *lifetime prudential value* that incorporates non-additivity (e.g., averaging, thresholds, narrative coherence) for extreme cases. This complicates formal models but better reflects intuitions about flourishing and meaning. Crucially, it preserves core person-affecting intuitions and avoids the truly repugnant intermediate conclusion without abandoning Grouping Indifference or the Principle of Personal Good.

  **Seminar Suggestion:** Frame this argument as a challenge to simplistic intrapersonal aggregation. Use it to explore:
  *   The relationship between moment welfare and lifetime welfare.
  *   Whether "a life barely worth living" is meaningfully composable from "moments barely worth living."
  *   Formal alternatives to strict summation (averaging, critical levels for duration, narrative models).
  *   How Parfit's "non-identity problem" and the nature of personal identity *interact* with aggregation (does psychological connectedness weaken over extreme durations, undermining even the *subject's* stake in the distant future?).

  This strengthens your seminar by showing that the deepest puzzles in population axiology often stem from unresolved complexities in *individual* wellbeing.
