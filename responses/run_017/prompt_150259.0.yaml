answer: |-
  ### Desiderata for Evaluating AI Takeoff Speed Theories  
  **Purpose:** Quantify "coordination runway" (time for institutions/competitors to detect and respond to capability shifts).  

  ---

  ### **I. What the Unit Is**  
  **Effective Cognitive Labor Hours (ECLH)** per unit of capability gain.  
  - **Why?** Calendar time is distorted by parallelization, R&D efficiency, and compute scaling. ECLH measures the *aggregate problem-solving effort* required to achieve a capability milestone (e.g., "human-level coding agent").  
  - **Tracks coordination runway:** Institutions respond to *revealed* capability, which lags behind pure R&D. ECLH anchors to the bottleneck (cognitive labor), then converts to calendar time via factors like researcher count, compute access, and parallelization efficiency.  
  - **Example:** Doubling algorithmic efficiency might take 1M ECLH. With 10,000 researchers, that’s 100 hours (days); with 100 researchers, it’s 10,000 hours (~14 months).  

  ---

  ### **II. The List: 8 Requirements**  
  1. **Temporal Unit Discipline**  
     *Must express speed in ECLH, then explicitly convert to calendar time using parallelization, labor, and compute constraints.*  
     **Case:** "Two-year takeoff" is meaningless without specifying workforce/compute scale. A small lab’s 2-year project ≠ a mega-cluster’s 2-year sprint.  

  2. **Deployment Separation**  
     *Must distinguish between (a) capability R&D (ECLH) and (b) deployment/impact latency (regulatory, integration).*  
     **Case: The Quiet Year:** Capability doubles in 3M ECLH (weeks with enough compute), but deployment takes 18 months. **Takeoff speed is fast** (low ECLH), but **runway is long** due to deployment lag.  

  3. **Heterogeneous Latency Acknowledgment**  
     *Must model physical bottlenecks (fabs, energy) and algorithmic progress on separate clocks, with explicit conversion to ECLH-equivalent delays.*  
     **Case: Two Clocks:** Algorithmic breakthrough (low ECLH) + stockpiled compute = fast capability jump. But new fab construction adds 24 months. **Runway = max(ECLH→time, physical delay).**  

  4. **Scalar Rejection**  
     *Cannot reduce takeoff to one metric. Must specify which capabilities (e.g., cyber offense, robotics, biotech) and their runways.*  
     **Case: Jaggedness:** AGI in software (low ECLH, short runway) but robotics lags (high ECLH/physical delays). Institutions get years to respond to physical-world threats.  

  5. **Non-Cognitive Bottleneck Mapping**  
     *Must quantify how permits, trials, or infrastructure gate ECLH-to-calendar conversion.*  
     **Case:** A nanofactory design requires 10k ECLH but 5 years of safety testing. **Runway = testing period, not ECLH.**  

  6. **Actor Concentration Penalty**  
     *Must discount runway if capabilities are controlled by few actors (reduces detection/response time).*  
     **Case:** 10 labs sharing progress vs. one lab with a secret 10,000-GPU cluster. **Concentration shortens runway** by limiting scrutiny.  

  7. **Threshold Granularity**  
     *Must identify critical thresholds (e.g., "can hack power grids") and the ECLH/runway to cross each.*  
     **Case:** Military AI that autonomously disables cyber defenses crosses a threshold. Runway = time from lab demo to weaponization.  

  8. **Epistemic Transparency**  
     *Must state whether speed is ontological (inherent to AI) or epistemological (forecast uncertainty).*  
     **Case:** If slow takeoff relies on "we’ll see it coming," but capability jumps are opaque, **runway collapses.**  

  ---

  ### **III. Non-Negotiable vs. Camp Prejudice**  
  - **Non-negotiable:** Deployment separation, non-cognitive bottlenecks, epistemic transparency. These handle real-world delays and forecasting limits.  
  - **Camp prejudice:** "Scalar rejection" (slow-takeoff advocates want aggregation; hard-takeoff prefers cognitive dominance) and "actor concentration" (proponents of multipolarity downplay this).  

  ---

  ### **IV. Where the List Breaks**  
  **Deployment separation vs. Epistemic transparency.** If deployment gating (e.g., regulation) is perfectly opaque, institutions might *never* "notice" until thresholds are crossed. This conflates capability and impact runways. I suspect no theory can fully resolve this without intelligence access.  

  ---

  ### **V. The One That Kills**  
  **Deployment separation** rules out >80% of existing stories:  
  - Hard-takeoff arguments ignore deployment latency (assuming capabilities instantly weaponized).  
  - Slow-takeoff theories conflate R&D with integration (e.g., "AI in hospitals takes years, so takeoff is slow").  
  - Both fail to decouple capability velocity from institutional visibility.  

  ---

  ### **VI. Sixty-Second Scorecard**  
  | **Theory**               | **Score vs. Desiderata**                                                                 |  
  |--------------------------|------------------------------------------------------------------------------------------|  
  | **Hard takeoff**          | Fails #2 (deployment), #5 (non-cognitive bottlenecks). Assumes ECLH→impact is near-instant. Plausible only for pure software thresholds. |  
  | **Continuous takeoff**    | Fails #4 (scalar rejection), #7 (thresholds). Treats takeoff as GDP-like curve; misses jagged leaps and strategic tipping points.        |  
  | **"Just another tech"**   | Fails #3 (heterogeneous latency), #6 (actor concentration). Ignores compute/algorithmic discontinuities and singleton risk.              |  

  ---  
  **Commitment note:** This framework prioritizes **institutional response time** over abstract capability growth. If you ignore deployment/impact latency (#2, #5) or thresholds (#7), your theory is optimizing for the wrong crisis.
