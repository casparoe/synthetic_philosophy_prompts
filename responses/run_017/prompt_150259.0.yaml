prompt: |-
  yo — for a reading group on AI futures I want the spec sorted before we start arguing about who's right. Write me the desiderata a theory of AI takeoff speed has to meet to be worth taking seriously: what a claim like "hard takeoff", "slow takeoff" or "roughly a two-year takeoff" would actually have to cash out in, with the case behind each requirement. The purpose I care about is coordination runway — how much time institutions, governments and competitors get to notice and respond — so speed should be in whatever unit tracks that, not automatically in calendar months.

  Cases I keep tripping on, which I want the list to either handle or explicitly declare out of scope:
  - the quiet year: lab capabilities double but almost nothing visible happens for ~18 months because deployment is gated by regulation, integration and procurement. fast or slow takeoff, and why
  - two clocks: software/algorithmic progress on one timescale, chip fabs, power and datacenter buildout on another, including the case where a big stockpile of already-built compute can be converted quickly
  - jaggedness: long-horizon software ability racing ahead while robotics and physical-world capability lags — speed of which capability, and is a single scalar index allowed
  - non-cognitive bottlenecks: progress gated on experiments, trials, permits or physical infrastructure rather than on cognitive labour
  - concentration: the same capability curve captured by one actor vs spread across many
  - thresholds: capability crossing a line that unlocks a lumpy strategic advantage (seizure of power, decisive military edge) rather than a smooth economic gain
  - whether "takeoff speed" is a feature of the world or of our forecasting situation

  Give me:
  - "What the unit is" — 3-4 sentences, commit to one currency for speed and say why
  - "The list" — 7-9 requirements, one short paragraph each, each with the concrete case that motivates it
  - "Non-negotiable vs. camp prejudice" — short: which demands are genuine and which are just what one camp likes
  - "Where the list breaks" — one paragraph on the pair of desiderata you suspect can't both be met
  - "The one that kills" — one paragraph on the single requirement that rules out the most existing stories
  - "Sixty-second scorecard" — 3-4 lines on the hard-takeoff/recursive-self-improvement story, the continuous takeoff story, and the "AI is just another technology, growth stays roughly historical" story, against your list

  Be commited — take positions and give reasons rather than laying out options for me to pick, and where you're guessing say so in a clause instead of hedging the whole answer.
