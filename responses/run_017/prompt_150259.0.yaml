  3. **Heterogeneous latency** addresses two clocks by forcing theories to map progress across domains. 
  4. **Scalar rejection** deals with jaggedness—no averaging robotics and software into one index. 
  5. **Non-cognitive bottlenecks** ensures physical constraints aren't handwaved. 
  6. **Actor concentration** matters because a singleton accelerates takeoff. 
  7. **Threshold granularity** covers discontinuous tipping points. 
  8. **Epistemic transparency** clarifies if speed is inherent or uncertainty-driven. 

  Non-negotiables? Units, deployment separation, and non-cognitive bottlenecks are essential. Scalar rejection and actor concentration are more debatable but still strong. The hardest trade-off is between deployment separation and epistemic transparency—acknowledging uncertainty might downplay tangible delays. 

  The deployment separation requirement kills most stories. Hard-takeoff advocates ignore deployment lags; slow-takeoff folks conflate capability with impact. Continuous growth theories get wrecked by threshold granularity—they miss step-changes. 

  Scoring the three camps: 
  - **Hard takeoff** fails deployment separation and non-cognitive bottlenecks (assumes pure software). 
  - **Continuous takeoff** flunks threshold granularity and often scalar rejection. 
  - **Historical growth** ignores actor concentration and threshold risks. 

