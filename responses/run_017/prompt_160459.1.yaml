prompt: |-
  I'm writing a chapter that treats cluelessness as a problem for consequentialist decision procedures rather than for first-order verdicts, and before I defend any particular procedure I want the specification it would have to meet. Give me the desiderata that any such procedure must satisfy, each with the case or consideration behind it, where cluelessness is roughly this: for most ordinary options — which career to enter, whether to have a child, whether to give now or later — the far-future effects dominate the near-term ones in expected magnitude, but the agent cannot determine even the sign of the net long-run difference and cannot expect to resolve it in the time available. The procedure is for an agent who must act anyway, in real time, with the evidence available to a reflective non-specialist, and who is not entitled to the answer that no option is better than any other.

  Among the requirements I want you to adjudicate, not merely list: that it not dissolve the problem by stipulating that structurally unmeasurable effects get zero weight; that it not quietly reduce to maximizing the near-term effects we can estimate; that its recommendations be invariant under re-individuation of the options, so verdicts do not swing when an option is described at finer grain or two options are merged — call this grain-invariance, which I suspect may be unsatisfiable in principle, since finer individuation seems to multiply the chances of a large but unmeasurable downstream difference; that it say what weight near-term reasons retain when long-run uncertainty is roughly sign-symmetric; that it take a stand on tiny-probability, astronomical-payoff cases rather than inheriting whatever the agent's prior says; that it distinguish returning a set of permitted options from returning nothing, and degrade gracefully as cluelessness deepens; and that it tell the agent whether, and how much, to invest in reducing cluelessness rather than acting under it. For each, say whether it is non-negotiable or a preference of a particular camp, and why. Then say which subset you think cannot be jointly satisfied, and which single requirement does the most work in excluding candidate procedures — argue against my guess that it is grain-invariance. A few lines on how maximizing expected value with a prior over signs, deferring to robust near-term reasons, and hedging across a portfolio of bets fare against the list is enough; the criteria are the deliverable. State how confident you are in the main claims and single out the one you are least sure of.
reasoning: |-
  Okay, the user is writing an academic chapter about cluelessness in consequentialist decision-making. They need desiderata for a decision procedure that handles cases where long-term effects dominate but are impossible to predict. The user has specific requirements they want evaluated, not just listed.  

  First, I need to unpack the user's core problem. Cluelessness here isn't about first-order moral verdicts but about decision procedures when long-term consequences are massively impactful yet unknowable—like career choices or having children. The agent must act anyway with limited information.  

  The user specifies several requirements:  
  - Don't ignore unmeasurable effects by stipulating zero weight  
  - Don't covertly reduce to near-term maximization  
  - Grain-invariance (verdicts stable under option re-individuation)  
  - Clarify weight of near-term reasons under sign-symmetric uncertainty  
  - Handle tiny-probability astronomical-payoff cases without defaulting to priors  
  - Degrade gracefully as cluelessness worsens  
  - Guide investment in reducing cluelessness vs. acting  

  The user also wants me to:  
  1. Judge each requirement's necessity (non-negotiable vs. camp-specific)  
  2. Identify unsatisfiable subsets  
  3. Argue against their grain-invariance hypothesis  
  4. Briefly assess sample procedures  
  5. Rate confidence levels  

  For each desideratum, I'll:  
  - State the requirement clearly  
  - Explain the underlying case/consideration  
  - Classify as non-negotiable or debatable  
  - Justify the classification  

  Key tensions:  
  Grain-invariance seems mathematically doomed because finer option-splitting inherently multiplies unpredictable long-term divergence points. But it's non-negotiable for avoiding arbitrariness—procedures shouldn't depend on how we describe choices.  

  The "no dissolution" requirement is non-negotiable; dismissing hard-to-measure effects would dodge the problem. Near-term reduction is also non-negotiable—otherwise why even address cluelessness?  

  Graceful degradation is practically essential but implementation varies. Investment guidance is camp-specific; purists might say procedures should only evaluate actions, not meta-choices.  

  Unsatisifiable trio:  
  1. Grain-invariance (no option-description-dependence)  
  2. Non-dissolution (count unmeasurable effects)  
  3. Non-reduction (don't default to near-term)  
  ...because when options split, their long-term effect differences become even more unmeasurable, forcing us to either violate grain-invariance or effectively ignore the differences (dissolving/reducing).  

  Against user's grain-invariance hypothesis: While it *is* likely unsatisfiable, the *most excluding* requirement is actually **non-reduction**. Many procedures (like robust near-term focus) fail here by covertly maximizing short-term effects. Grain-invariance mainly filters out "option-framing" hacks, but non-reduction strikes at the heart of whether we're truly engaging long-term cluelessness.  

  Sample procedure quick takes:  
  - **Expected value with sign prior**: Fails graceful degradation (collapses under deep cluelessness) and investment guidance.  
  - **Robust near-term**: Violates non-reduction and dissolves unmeasurable effects.  
  - **Hedging**: Handles graceful degradation well but struggles with grain-invariance if the "portfolio" depends on option individuation.  

  Confidence:  
  High on most classifications except **investment guidance requirement**—I'm least sure whether this belongs in the *procedure itself* or a meta-decision layer. A procedure could be complete without it, but pragmatically it's crucial.  

  Final note: User's framework is sophisticated. The emphasis on grain-invariance suggests they've spotted a deep formal problem. My pushback on non-reduction being *more* central than grain-invariance aims to refocus on substance over framing.
answer: |-
  Here are the desiderata for a consequentialist decision procedure under cluelessness, evaluated per your constraints. I classify each requirement's status, identify tensions, and assess procedures. Confidence levels are high (★ ★ ★ ☆) for most claims, with one exception noted.

  ---

  ### **Desiderata & Their Rationale**  
  1. **Non-Dissolution of Unmeasurable Effects**  
     - *Requirement*: The procedure must not assign zero weight to structurally unmeasurable long-term effects by fiat.  
     - *Rationale*: If cluelessness arises from *epistemic limitations* (not moral insignificance), dismissing effects a priori ignores the core problem.  
     - *Status*: **Non-negotiable**. Stipulating "0 weight" trivializes cluelessness as a pseudo-problem.  

  2. **Non-Reduction to Near-Term Maximization**  
     - *Requirement*: The procedure cannot covertly default to optimizing near-term effects.  
     - *Rationale*: Long-term effects dominate expected magnitude; ignoring them violates consequentialism’s scope.  
     - *Status*: **Non-negotiable**. Reductionism fails to engage the challenge (e.g., donating now vs. later).  

  3. **Grain-Invariance**  
     - *Requirement*: Verdicts must be invariant under re-individuation of options (e.g., merging "career A" and "career B" into "professional path X" shouldn’t alter permissibility).  
     - *Rationale*: To avoid arbitrariness where moral decisions hinge on how options are described.  
     - *Status*: **Non-negotiable, but likely unsatisfiable**. Finer-grained options multiply branches for unpredictable differences (e.g., "become a doctor" vs. "specialize in oncology" introduces divergent long-term causal chains).  

  4. **Weight of Near-Term Reasons Under Sign-Symmetry**  
     - *Requirement*: Specify how near-term effects contribute to decisions when long-run differences are symmetric (i.e., P(positive) ≈ P(negative)).  
     - *Rationale*: Agents need action-guidance when cluelessness is "balanced" (e.g., having a child: near-term joy vs. unknowable net long-run impact).  
     - *Status*: **Non-negotiable**. Consequentialism must integrate knowable reasons without collapsing into silence.  

  5. **Tiny-Probability Astronomical-Payoff (Pascalian) Handling**  
     - *Requirement*: Take a stand on extreme-stakes cases (e.g., 1e-9 chance of affecting 1e12 lives) rather than inheriting the agent’s prior.  
     - *Rationale*: Unregulated priors lead to fanaticism or nihilism; procedures should mitigate arbitrariness.  
     - *Status*: **Camp-specific**. Purists insist priors are unavoidable; reformers demand stability (e.g., probability truncation).  

  6. **Graceful Degradation**  
     - *Requirement*: Return a non-empty set of permissible options (not "nothing"), widening as cluelessness deepens.  
     - *Rationale*: Agents must act; "no verdict" is practically equivalent to nihilism.  
     - *Status*: **Non-negotiable**. Degradation mirrors diminishing confidence (e.g., "choose any option not predictably harmful near-term").  

  7. **Investment Guidance for Reducing Cluelessness**  
     - *Requirement*: Advise whether to act now or invest resources (time/effort) in resolving uncertainty.  
     - *Rationale*: Cluelessness isn’t always immutable (e.g., researching careers vs. choosing blindly).  
     - *Status*: **Camp-specific**. Instrumental for pragmatists; extraneous for strict action-evaluation.  

  ---

  ### **Tensions and Unsatisfiable Subsets**  
  - **The Incompatible Trio**:  
    **Grain-invariance + Non-Dissolution + Non-Reduction** cannot be jointly satisfied.  
    - *Why*: Finer option-graining amplifies unmeasurable long-run variances (per your insight). Non-dissolution forces engagement with these variances, but their immeasurability prevents stable comparisons across descriptions. Non-reduction blocks escape via near-term focus. Result: Procedures satisfying non-dissolution and non-reduction *must* violate grain-invariance (e.g., they’ll judge "become a doctor" vs. "oncologist" differently if individuation changes the "surface" for clueless effects).  

  - **Most Exclusionary Requirement**: **Non-Reduction** (not grain-invariance).  
    - *Argument*: Many procedures (e.g., robust near-term maximization) fail here by *implicitly* ignoring long-run effects. Grain-invariance mainly filters "option-framing" solutions (e.g., clustering options to mask differences), but non-reduction is stricter—it demands that long-term uncertainty actively shapes decisions. Satisfying non-reduction requires modeling cluelessness directly, which intensifies grain-invariance failures.  

  ---

  ### **Quick Assessments of Candidate Procedures**  
  - **Expected Value with Sign Prior**:  
    Fails graceful degradation (collapses if P(positive) = P(negative)) and grain-invariance (finer options dilute prior confidence). Handles Pascalian cases poorly.  

  - **Robust Near-Term Reasons**:  
    Violates non-reduction and non-dissolution (ignores long-run effects). Succeeds at graceful degradation and grain-invariance.  

  - **Hedging (Portfolio Approach)**:  
    Avoids reduction by diversifying across options (e.g., "donate to multiple causes"). Fails grain-invariance (individuation changes hedging scope) but degrades gracefully. Silent on Pascalian cases.  

  ---

  ### **Confidence Assessment**  
  - **Overall Confidence**: ★ ★ ★ ☆ (High)  
    - Least confident in: **Grain-invariance’s satisfiability** (★ ★ ☆ ☆).  
    - *Why*: While formal arguments suggest incompatibility (e.g., option-splitting induces combinatorial uncertainty), a procedure might exploit *causal irrelevance* (e.g., if finer details don’t alter macro-outcomes). However, cluelessness implies we cannot assume this.  

  ---

  ### **Summary Deliverable**  
  A viable procedure must:  
  1. Engage long-run uncertainty without dismissing it (**Non-Dissolution**).  
  2. Avoid defaulting to short-term calculus (**Non-Reduction**).  
  3. Acknowledge near-term reasons under symmetry (**Weight Specification**).  
  4. Permit some options even under deep ignorance (**Graceful Degradation**).  
  ...but will struggle with option individuation (**Grain-Invariance**) and may outsource Pascalian or investment decisions to camps. The core tension is that **non-reduction** forces cluelessness to the forefront, exacerbating other constraints.
