prompt: |-
  You are a professional moral philosopher who works both on contractualism and on the ethics of cost-effectiveness reasoning in public health and philanthropy. Please think this through carefully and answer in two passes: first, reconstruct the argument below in your own words and sketch every way you can see of rejecting or defusing it, along with what each option costs; then commit to the diagnosis you think is strongest, and say what a non-specialist reader should take away from the whole exchange.

  I'm a journalist writing a long-form piece about how institutions decide which causes to fund — global health, disaster preparedness, AI safety — and about the philosophical discomfort with the cost-effectiveness framework, which routinely treats a very large number of small benefits as outweighing one person's catastrophic loss. A philosopher I interviewed walked me through the following argument. I can't find the mistake in it, but I'm suspicious of it, because it seems to prove far too much: as far as I can tell the same template could be run against rights-based views, against incommensurability views, against anything that takes the separateness of persons seriously. I think I may have built a machine that eats every non-consequentialist morality, and I want to know which gear is slipping.

  (1) [Contractualism] An act is wrong if and only if it would be disallowed by any principle that no one could reasonably reject as a basis for informed, unforced general agreement.
  (2) [Individualist restriction] Whether a principle can be reasonably rejected is settled by comparing, one person at a time, the burden that principle imposes on her with the burdens alternative principles would impose on other people. Nothing is added up across persons.
  (3) [Numbers drop out] It follows from (2) that the mere number of people who would bear a burden does no work. Only how each of them fares, measured against how others fare under the alternatives, matters.
  (4) [The case] A funder can either save one identifiable person from death or prevent a painful but minor chronic condition in a hundred thousand people. Take the principle: always prevent a death when a death is preventable. Each of the hundred thousand has a complaint; the person who dies has, on any ordering of burdens, a much larger complaint under the alternative. By (3), the hundred thousand complaints carry no additional weight. So the principle is not reasonably rejectable, and the funder is required to save the one.
  (5) [Absurdity] That verdict is not merely counterintuitive. It dismantles the entire practice of weighing many small gains against a few large losses, which is essentially what cost-effectiveness analysis is.
  (6) [The dichotomy] So numbers must be allowed to count. But the only way to let numbers count is to sum burdens across persons, and a view that sums burdens across persons is utilitarianism in a contractualist costume: whatever was distinctively non-aggregative in (1) and (2) has evaporated.
  (7) Therefore contractualism is either absurd, as in (4), or extensionally utilitarian, as in (6). Either way it is not the view it advertises itself as.

  Three escape routes have been suggested to me and I trust none of them; please price each one.

  (a) Numbers re-enter inside a single person's complaint. What grounds my reason to reject a principle is not only the size of my own burden but the relational fact that the principle would spare me only by imposing comparable or lesser burdens on vastly more people — an unfairness-shaped complaint whose strength grows with the number of others without any summing of burdens. Does this simply smuggle in objecting on other people's behalf, which (2) was supposed to forbid?

  (b) Lexicalism by kind rather than by size. Contractualism never compares across incommensurable kinds of burden; death and chronic pain are not on one scale. Within a kind, numbers count normally; across kinds the comparison is not resolved in favour of the one but is simply indeterminate, so (4) should yield no verdict rather than an absurd one. Does a view that falls silent exactly when the stakes are highest still count as a guide to a funder who must act anyway?

  (c) The unit of assessment is wrong. Contractualism assesses principles, and a principle must be general enough to serve as a basis of agreement across an open-ended range of cases. Step (4) gerrymanders a principle to a single decision, and always prevent a death when a death is preventable has implications elsewhere that plenty of people could reasonably reject. The absurdity in (5) is thus an artefact of how the case was built. Does this relocate the same problem to the level of whole principles, where the argument simply reappears?

  Which step do you reject, and why did it look sound? If I want to keep the individualist bite of (2) and (3) — the part that makes contractualism something other than utilitarianism — what exactly am I committed to, and does a contractualist who accepts that commitment still have anything useful to say to someone allocating a budget? Finally: is my worry that the argument generalises into a refutation of every non-aggregative view correct, or is there something specific to contractualism that makes it vulnerable here?
reasoning: |-
  Okay, let me start by really understanding what the journalist is asking. They presented an argument from a philosopher that seems to show contractualism either leads to absurd conclusions or collapses into utilitarianism. The core of the argument is that in a situation where you have to choose between saving one life or preventing minor suffering for many, contractualism forces you to save the one life because the individual burden of death outweighs any single person's minor suffering, and numbers don't matter. The journalist is worried this argument could dismantle any non-consequentialist ethical framework.

  First, I need to reconstruct the argument clearly. The key steps are the contractualist definition, the individualist restriction (no summing across persons), which leads to numbers not mattering. Then the case where saving one life is prioritized over helping many with minor issues, which seems counterintuitive and undermines cost-effectiveness analysis. The dilemma is that either accept this absurdity or allow summing, which turns contractualism into utilitarianism.

  Now, the journalist mentioned three escape routes they're skeptical about. Let me tackle each. Option (a) suggests that a person's complaint could include the unfairness of benefiting them at the cost of many others. But does this violate the individualist restriction by considering others' burdens indirectly? Option (b) proposes that burdens of different kinds (death vs. minor suffering) are incommensurable, so no comparison can be made. But then contractualism doesn't give guidance in such cases, which isn't helpful for a funder who must act. Option (c) argues that principles must be general, and the specific principle in the example is too narrow. If we consider broader principles, maybe we avoid the absurdity. But the worry is that the same problem reappears at the level of principles.

  I need to evaluate which of these is strongest. Option (c) seems promising because contractualism is about evaluating general principles, not one-off decisions. The principle "always prevent death when possible" might be rejectable when considering other scenarios where it leads to ignoring many smaller harms. So the individualist restriction applies to how a principle affects people across all its applications, not just a single case. This could defuse the specific example without abandoning non-aggregation.

  But the journalist is concerned this just moves the problem. However, in contractualism, a principle that consistently prioritizes one life over vast numbers of smaller harms might be rejectable by those who could face those smaller harms without compensation. So the aggregation happens across different instances of the principle's application, not within a single decision. This maintains the individualist focus because each person's total burden under the principle is considered, not summed with others.

  The other options have issues. Option (a) risks smuggling in aggregation through fairness, which might violate the spirit of the individualist restriction. Option (b) leaves us without guidance in critical cases, which isn't practical. So (c) seems the most viable without collapsing into utilitarianism.

  Now, the journalist's worry about the argument generalizing to other non-consequentialist views. Contractualism is particularly vulnerable here because of its structure of pairwise comparisons. Other views like rights-based ethics might avoid this by having deontological constraints that aren't subject to such comparisons. So the argument might not apply universally to all non-aggregative views.

  Finally, for a non-specialist, the takeaway is that contractualism isn't defeated here. The key is focusing on general principles and their cumulative impact on individuals over many cases. This allows for considering numbers indirectly without aggregating burdens. It preserves the core of contractualism while offering a way to justify cost-effectiveness in practice.
answer: |-
  ## Step 1: Reconstruction and Critical Options

  **Reconstructed Argument:**

  1.  **Contractualism Defined:** An act is wrong iff it violates a principle that no one could reasonably reject for governing behavior in a society seeking free, informed agreement.
  2.  **Individualist Restriction:** Reasonable rejection is determined *pairwise*. For any principle P, we compare the burden it imposes on *each individual person* against the burdens alternative principles would impose on *other individuals*. We never sum burdens *across* different people. Aggregation is forbidden.
  3.  **Numbers Drop Out:** Therefore, the *number* of people burdened by a principle cannot factor into whether it's reasonably rejectable. Only the *magnitude* of the burden on each individual (compared to alternatives) matters.
  4.  **The Case:** Choice: Save 1 identifiable life (burden: death) OR prevent minor chronic pain for 100,000 people (burden: pain). Principle: "Always prevent death when preventable." Under this principle, the 100k each bear a minor burden (pain). Under the alternative ("Prevent many minor pains over one death"), the 1 person bears a catastrophic burden (death). Pairwise comparison: The burden on the 1 person under the alternative (death) vastly outweighs the burden on *any single one* of the 100k under the first principle (minor pain). Since we can't sum the minor pains, the 100k complaints together carry no extra weight against the 1 person's catastrophic complaint. Therefore, the "save the one" principle is not reasonably rejectable and is required.
  5.  **Absurdity:** This verdict – always save the one life regardless of how many minor burdens are alleviated instead – is not just counterintuitive; it fundamentally destroys cost-effectiveness analysis (CEA), which *requires* aggregating many small benefits to outweigh fewer large losses.
  6.  **The Dichotomy:** To avoid absurdity (5), numbers *must* count. But the only way for numbers to count is to *sum burdens across persons*. A view that sums burdens is utilitarianism. Therefore, contractualism either:
      *   **(Absurd Option):** Leads to the counterintuitive, CEA-destroying verdict in (4).
      *   **(Utilitarian Option):** Allows summing burdens, collapsing into utilitarianism disguised as contractualism.
  7.  **Conclusion:** Contractualism is either absurd or covertly utilitarian. It fails as a distinct non-aggregative moral theory.

  **Options for Rejecting/Defusing the Argument & Their Costs:**

  1.  **Reject (3) "Numbers Drop Out" via Option (a): Complaint-Internal Relationality/Fairness:**
      *   **Mechanism:** An individual's grounds for reasonable rejection *can* include the *relational fact* that a principle benefits them (or spares them a burden) *only* by imposing comparable or lesser burdens on *vastly many others*. This creates an "unfairness-shaped" complaint *within* their own rejection grounds. The *strength* of *this specific complaint* increases with the number of others burdened without summing *their burdens*. The individual objects to the *structure of distribution*, not directly to others' burdens.
      *   **Costs:**
          *   **Risk of Smuggling:** This *appears* dangerously close to objecting on others' behalf or aggregating indirectly. Does it violate the spirit, if not the letter, of the Individualist Restriction (2)? Requires careful justification to avoid collapsing into utilitarianism.
          *   **Scope & Strength:** How strong is this "unfairness" complaint relative to the direct burden complaint? Does it *always* arise, and is it strong enough to tip the scales in cases like (4)? Requires developing a robust account of fairness within the individualist constraint.
          *   **Complexity:** Makes reasonable rejection more complex, moving beyond simple pairwise burden comparisons to include distributional features *as experienced by the individual objector*.

  2.  **Reject (4) & (6) via Option (b): Lexical Incommensurability by Kind:**
      *   **Mechanism:** Contractualism does *not* compare burdens of fundamentally different *kinds* (e.g., death vs. minor chronic pain). These are incommensurable. Within a kind (e.g., minor pains vs. minor pains), numbers *do* count via pairwise comparisons (e.g., principle causing more minor pains is rejectable). Across kinds (death vs. many minor pains), the comparison is *indeterminate* – neither principle is clearly unrejectable or rejectable based *solely* on burdens. The argument fails at step (4) because the comparison needed isn't possible.
      *   **Costs:**
          *   **Silence in High Stakes:** Precisely when the stakes are highest (different kinds of burdens), the theory delivers *no verdict*. This is deeply unsatisfying for decision-makers like funders who *must* act. It seems to abdicate its role as a practical guide.
          *   **Demarcation Problem:** How do we rigorously define "kinds" of burdens to avoid arbitrariness? Is death always a different kind than any non-lethal burden? What about severe disability vs. death? Requires a defensible theory of burden categories.
          *   **Potential for Worse Outcomes:** Indeterminacy might lead, in practice, to decisions that *do* aggregate (defeating the point) or to paralysis, potentially allowing greater overall harm.

  3.  **Reject (4) & (5) via Option (c): Principle Generality & Cumulative Burden:**
      *   **Mechanism:** Contractualism assesses *general principles*, not isolated acts. The principle "Always prevent death when preventable" is *too narrow* and gerrymandered to this specific case. A relevant principle must govern a *range* of similar choices. When evaluating such a *general* principle (e.g., "Prioritize preventing the most severe individual burdens"), we consider its impacts *across all its applications*. Someone who would *repeatedly* bear smaller burdens under this principle (e.g., chronic pain sufferers never prioritized) has a *cumulative complaint* based on the *total burden imposed on them personally over time* by the principle's consistent application. This cumulative individual burden *could* outweigh the catastrophic burden faced by one person in a single instance *without* summing across persons. The absurdity in (5) arises from misapplying contractualism to a one-off principle.
      *   **Costs:**
          *   **Complexity of Assessment:** Requires imagining the long-term, systemic effects of principles on each individual, which is more complex than the original pairwise burden snapshot.
          *   **Defining the Relevant Principle Class:** How general must the principle be? What counts as the relevant "range" of cases? Requires careful specification to avoid gerrymandering in the *other* direction.
          *   **Counterintuitive in Truly One-Off Cases?** If a case is genuinely unique and never recurs, does the cumulative burden argument still hold water? (Contractualists might argue truly unique cases are vanishingly rare or that principles must still govern even hypothetical repetitions).

  ## Step 2: My Diagnosis and Commitments

  **Strongest Diagnosis: I reject step (4) via Option (c) (Principle Generality & Cumulative Burden).**

  *   **Why (c) is Strongest:** It most faithfully preserves the core non-aggregative commitment of contractualism (Steps 1 & 2) while directly addressing the flaw in how the argument constructs the case. Contractualism *is* fundamentally about justifying *rules for living together*, not one-off decisions. The "always prevent death" principle *is* gerrymandered. Considering the cumulative impact of a *general* prioritization rule on individuals over time allows numbers to matter *indirectly* through the lens of *individual* experience under the rule, without summing burdens *across* different people. It avoids the indeterminacy of (b) and the aggregation-risk of (a). The absurdity vanishes when we consider the long-term, systemic effects: a rule always prioritizing one life over 100,000 minor pains would impose a *massive, repeated, and thus severe cumulative burden* on many individuals (those suffering chronic pain), giving them a powerful individual complaint against the principle.
  *   **Why (4) Looked Sound:** It exploited a misapplication of contractualism. By focusing on a single decision and an artificially narrow principle, it hid the long-term implications that contractualism is designed to evaluate. The pairwise comparison in (4) seems sound *only* if we ignore the principle's broader application and its potential to impose recurring minor burdens on the same individuals.

  **Commitments for Keeping Individualist Bite (2 & 3):**
  To preserve the core non-aggregative commitment, a contractualist *must*:
  1.  **Focus on General Principles:** Evaluate rules that govern classes of actions, not isolated acts.
  2.  **Assess Cumulative Individual Burden:** Consider the *total impact* a principle would have *on each individual person* over the range of situations it governs. This total burden grounds their potential reasonable rejection.
  3.  **Maintain Pairwise Comparison:** When asking if an individual can reasonably reject P, compare the cumulative burden *on them* under P against the cumulative burden *on others* under relevant alternative principles Q, R, etc. *Do not sum* the burdens on *multiple* people under Q to outweigh the burden on the single person under P. The comparison is always: Burden-on-A-under-P vs. Burden-on-B-under-Q, Burden-on-A-under-P vs. Burden-on-C-under-Q, etc.

  **Can Contractualism Still Guide Funders?**
  **Yes.** A contractualist who accepts these commitments can offer meaningful guidance:
  *   **Focus on Rules:** Funders should adopt *general allocation rules* (e.g., "Prioritize interventions based on severity-weighted and scale-sensitive impact per dollar, with thresholds").
  *   **Evaluate Rules Systemically:** Assess potential rules by considering their long-term effects *on each affected group*: "What cumulative burden would chronically ill populations bear under Rule A (always prioritize lifesaving) vs. Rule B (prioritize high aggregate burden reduction)?" Someone facing lifelong unaddressed pain due to consistent deprioritization has a severe *individual* complaint against Rule A.
  *   **Justify Thresholds & Balances:** Explain why a rule allowing aggregation *up to a point* (e.g., preventing vast numbers of minor burdens) but respecting severe individual burdens (e.g., not trading one life for any number of minor pains) is less reasonably rejectable than either extreme. The cumulative burden framework allows this nuance without aggregation *simpliciter*.
  *   **Highlight Unfair Structures:** Identify rules that systematically impose avoidable cumulative burdens on specific groups as reasonably rejectable by members of those groups.

  **Generalization Worry:**
  Your worry is **partially correct but not universal.** The argument's *template* (gerrymandered case + pairwise comparison leading to counterintuitive result) can pressure *many* non-aggregative views. However:

  1.  **Specific Vulnerability of Contractualism:** Contractualism is *particularly* vulnerable *because* its core machinery (reasonable rejection based on individual burdens) *requires* comparisons that the argument exploits. Its structure invites this kind of challenge.
  2.  **Other Views More Resistant:**
      *   **Rights-Based Views:** Might have absolute deontological constraints ("Never intentionally kill an innocent") that simply *forbid* trading a life for minor gains, regardless of numbers. They avoid the comparison altogether. Their challenge is justifying the rigidity of those constraints.
      *   **Incommensurability Views:** Might hold that certain values (life, avoiding severe pain) are simply incomparable, leading to indeterminacy (similar to Option (b)), but potentially grounding this in a deeper metaphysical claim rather than a decision procedure. Their challenge is indeterminacy.
      *   **Sufficientarianism:** Focuses on bringing everyone above a threshold. It might prioritize preventing death (falling below the survival threshold) over minor pains (above threshold), but *could* allow vast numbers of minor pains to outweigh *some* above-threshold burdens if the pains push many *towards* the threshold. Its structure is less directly challenged by this specific case.
      *   **Moderate Deontology:** Allows aggregation only after certain constraints are satisfied. The argument doesn't directly refute the existence of those constraints.

  **The argument primarily exploits the *comparative* nature of contractualist justification.** Views that rely less on direct burden comparisons (like strong rights theories) or that incorporate different structural elements (like thresholds) are less susceptible to *this exact* "machine," though they face other significant challenges.

  ## Non-Specialist Takeaway

  *   **The Core Tension:** The argument powerfully highlights a deep tension: How can we respect each person's distinct moral importance (rejecting simple aggregation) while also recognizing that helping many people in smaller ways can be crucial?
  *   **The Contractualist Defense:** Contractualism isn't necessarily defeated. Its core idea – justifying rules based on what no individual could reasonably reject – might still work if we focus on *general rules* and consider the *long-term, total impact* those rules have *on each person's life*. A rule that *always* saves one life over preventing vast amounts of minor suffering might be rejectable by those who suffer repeatedly under it.
  *   **Practical Guidance Survives:** Even with its focus on individuals, contractualism can offer practical advice to funders. It pushes them to think about the *systematic effects* of their funding *rules* on different groups over time and to choose rules that avoid imposing severe, avoidable cumulative burdens on any group.
  *   **Broader Relevance:** While this argument hits contractualism hard, other ethical approaches that value individuals separately (like strong rights theories) might avoid its trap in different ways, though they face their own difficulties. The challenge of balancing one severe loss against many small gains is fundamental and has no universally agreed-upon, simple solution. The argument shows why this is such a tough philosophical problem, but it doesn't demolish all alternatives to utilitarianism. The search for a morality that truly respects the separateness of persons while allowing sensible collective action continues.
