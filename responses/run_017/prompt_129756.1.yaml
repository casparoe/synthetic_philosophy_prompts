prompt: |-
  I work in a memory and assistive-technology clinic, and several times a month our team faces variants of the same question: whether some external resource a patient depends on should count as part of that patient's own thinking, or merely as a tool they happen to use. The decision is not academic. If the resource is part of the patient's mind, then degrading or removing it looks like impairing a person rather than depriving them of property; if it is a mere tool, it does not. The same question arises in the opposite direction: when a relative supplies the missing half of a decision — the retrieval cue, the unfinished sentence, the standing set of values — should we score that as the patient's own decision-making capacity, or as someone else's influence on it?

  Please turn the extended mind thesis into a decision procedure my team can actually run, in about fifteen minutes, on a real case. Take as raw material — and do not feel obliged to keep — these candidate conditions: the resource is reliably available when needed; its contents are easily accessible; it is trusted and taken at face value rather than checked against something else; consulting it requires no special effort; past reliance on it has become automatic; and the store is durable over time. Say which conditions you keep, which you drop, which you tighten, and which you demote to mere evidence rather than requirements; say what the team should do when a condition is only partly met or cannot be assessed in a quarter of an hour; and mark clearly the points where no amount of procedure removes the need for a value judgment, and who on the team has to make it.

  One distinction I want handled explicitly, because I think we have been conflating three things that can come apart. First, whether the resource is a component of the cognitive system that actually produces the performance. Second, whether the resulting memory, belief, or action is attributable to the patient as theirs, in the way that matters for credit, responsibility, and consent. Third, whether interfering with the resource wrongs or harms the patient, and whether maintaining it falls under our duty of care. A resource could satisfy the first without settling the third, for instance if it is owned and remotely rewritable by a third party. Tell me how the procedure keeps these separate, and what it does when they disagree.

  Then run it on three cases: a man with dense amnesia whose entire prospective and autobiographical memory lives in a cloud-synced voice assistant that his daughter and the manufacturer can both edit; a single jointly maintained notebook that both partners of a couple rely on for their shared life, where one partner now wants it destroyed; and a spouse who, during a capacity assessment, reliably supplies the cues and values the patient cannot retrieve. I expect to dislike the answer on the last one, so give it to me straight. Finally, state plainly what the procedure cannot do — whether it settles legal capacity, personhood, or consent — and where a clinician should refuse to use it as if it did.
reasoning: |-
  Okay, the user works in a memory clinic and needs a practical decision procedure based on the extended mind thesis. They deal with real cases where determining if an external resource is part of a patient's cognitive system has ethical implications. Let me break down their request.

  First, they want a 15-minute procedure. That means the criteria must be quick to assess. The user provided candidate conditions: reliability, accessibility, trust, low effort, automaticity, durability. I need to refine these. Reliability, accessibility, and automaticity seem essential. Trust might be tricky—how to measure it fast? Maybe trust can be observed through usage patterns. Durability could be an evidence point, not a requirement, since some tools like smartphones aren't permanent but are integral.

  The user mentioned three distinctions: cognitive system component, attribution to the patient, and ethical obligations. The procedure must separate these. For example, a cloud-synced voice assistant might be part of cognition but controlled by others, affecting attribution and duties. The team needs to assess each dimension separately.

  The three test cases are crucial. The amnesic patient with a voice assistant: it's reliable and automatic, but third-party access complicates attribution. The joint notebook involves shared cognition, but one partner wanting destruction raises ethical issues—maybe here the cognitive system is joint, but consent to destroy affects both. The spouse supplying cues during assessment: if it's habitual, it might be extended, but during a capacity test, is it the patient's cognition or external aid? The answer might be unpopular, but if cues are integral, it could count as the patient's capacity.

  The user might worry about legal implications. The procedure shouldn't decide legal capacity but inform it. Clinicians must know when to involve legal experts. Also, value judgments are needed, like when resources involve others. The team lead or ethicist should handle those.

  I need to ensure the steps are clear: gather observations, check each condition, note partial meets, then analyze the three distinctions. For partial meets, use flags like "integrates partially." Time constraints mean skipping unassessable points but noting gaps. Finally, state limitations—no legal determinations, just cognitive assessment.
answer: |-
  Here is a practical 15-minute Extended Mind Assessment Procedure (EMAP), designed for clinical use. It refines your candidate conditions, separates the three key distinctions (Cognitive Integration, Attribution, Duty of Care), and provides guidance for partial/uncertain cases and necessary value judgments.

  **The Extended Mind Assessment Procedure (EMAP) - 15-Minute Protocol**

  **I. Refined Conditions for Cognitive Integration (Is it part of the patient's cognitive system?)**  
  *Keep & Tighten:*  
  1.  **Reliable Availability (RA):** Is the resource *consistently present and functional* when the patient needs it for the target cognitive task (e.g., recalling an appointment, making a decision)? (*Tighten:* Must be demonstrably reliable *in the patient's real-world environment*, not just theoretically. Assess via patient/carer report & observed use patterns).  
  2.  **Seamless Accessibility (SA):** Is accessing/consulting the resource *automatic, effortless, and the primary pathway* for this information/function? Does the patient use it *without conscious deliberation* for this task? (*Tighten:* Focus on *behavioral automaticity* - observing use is key. "No special effort" is too vague; "seamless" implies integration).  
  3.  **Trusted Integration (TI):** Is the information from the resource *accepted without verification* as the patient's own would be? Is it treated as *authoritative* for the task? (*Tighten:* Not just "trusted" generally, but *specifically trusted as a source of personal cognition* for this function. Observe if patient challenges it or accepts it like internal memory).

  *Demote to Evidence (Not Requirements):*  
  4.  **Durability (D):** Is the resource reasonably stable/persistent? (*Evidence For:* Long-standing notebooks, ingrained habits. *Evidence Against:* Frequently lost phones, volatile cloud data. Not required - transient tools *can* be integrated if RA/SA/TI are strong).  
  5.  **Past Automaticity (PA):** Has reliance become a well-practiced habit? (*Evidence For:* Long-term, ingrained use patterns support SA/TI).

  *Drop:*  
  6.  "Easily Accessible": Covered by SA (Seamless Accessibility).  
  7.  "Taken at face value": Covered by TI (Trusted Integration).

  **II. Assessment Process (15 Mins Max):**  
  1.  **Define Scope (2 mins):** Clearly identify the *specific cognitive function* being assessed (e.g., "recalling medical appointments," "deciding on lunch options," "maintaining shared weekly schedule"). *Cannot assess "the notebook" broadly; must assess its role for a specific function.*
  2.  **Gather Observable Data (8 mins):** Focus on *behavior and report* for the target function.  
      *   **Observe:** Can you see the patient use the resource spontaneously for the task? Does it look fluid/automatic? Do they accept its output without question?  
      *   **Ask (Patient/Carer):** "When you need to know [X], what do you do first?" "How often does [resource] fail you for this?" "If [resource] says [Y], do you check elsewhere or just go with it?" "How long have you used it this way for [task]?"  
      *   **Flag Partial Meets/Uncertainty:** Use simple scale: `Strong`, `Partial`, `Weak`, `Uncertain/Cannot Assess`. Note *why* (e.g., "SA Partial - uses automatically but sometimes fumbles with device", "TI Uncertain - no opportunity to observe trust in session").
  3.  **Score Core Conditions (3 mins):** For the target function, score:  
      *   RA (Reliable Availability): [ ] Strong / [ ] Partial / [ ] Weak / [ ] Uncertain  
      *   SA (Seamless Accessibility): [ ] Strong / [ ] Partial / [ ] Weak / [ ] Uncertain  
      *   TI (Trusted Integration): [ ] Strong / [ ] Partial / [ ] Weak / [ ] Uncertain  
      *   *(Note D/PA as supporting/contradicting evidence if relevant)*
  4.  **Cognitive Integration Judgment (2 mins):**  
      *   **Integrated:** RA=Strong AND SA=Strong AND TI=Strong.  
      *   **Likely Integrated:** RA=Strong AND SA=Strong AND TI=Partial/Strong. (TI is crucial).  
      *   **Ambiguous/Not Integrated:** Any RA/SA=Weak/Uncertain, or TI=Weak/Uncertain. RA/SA Weak usually = Not Integrated. TI Weak usually = Not Integrated (it's just a consulted tool).  
      *   *Value Judgment Needed Here:* When conditions are **Partial** or **Uncertain**, the **Team Lead** (clinician overseeing case) must weigh the evidence and context. *There's no algorithmic substitute for clinical judgment based on observation.* State: "Cognitive Integration Status: [ ] Integrated / [ ] Likely Integrated / [ ] Ambiguous / [ ] Not Integrated".

  **III. Separating the Three Distinctions:**  
  The EMAP *only directly assesses* **Cognitive Integration (CI)**. The other two require *separate consideration* using the CI output as input:  

  1.  **Attribution (A):** *Is the resulting belief/memory/action attributable to the patient?*  
      *   **If CI = Integrated/Likely Integrated:** The *process* is cognitively the patient's. However, **Attribution requires a further value judgment** about whether the *source/content* compromises ownership (e.g., third-party manipulation). *Ask:* "Is the *content generation/retrieval* under the patient's ultimate control/endorsement?" **Ethicist/Legal Counsel** often needed if source control is external/coercive. CI supports Attribution but doesn't guarantee it.
  2.  **Duty of Care / Wronging/Harm (DoC):** *Does interfering/maintaining the resource create obligations?*  
      *   **If CI = Integrated/Likely Integrated:** Interfering *is* impairing the cognitive system, creating a strong *prima facie* duty to maintain/protect it and wronging the patient if removed/damaged. **However:** This duty can be overridden by other factors (patient's current wishes, safety, rights of others, resource ownership). **Team Lead + Ethicist** must weigh CI status against these factors. *CI strongly suggests a duty but doesn't automatically determine the ethical/legal outcome.*  
      *   **If CI = Not Integrated/Ambiguous:** Interference is merely depriving a tool. Harm might still occur, but it's not *cognitive impairment*. Duties are weaker (property rights, contractual obligations may apply instead).

  **IV. Running the Cases:**

  1.  **Amnesic Man & Cloud-Synced Voice Assistant (e.g., for "recalling today's schedule")**  
      *   **RA:** Strong (always on, synced).  
      *   **SA:** Strong (simple voice command, automatic).  
      *   **TI:** **Partial/Uncertain (Critical Issue).** Accepts outputs readily *BUT* content editable by daughter/manufacturer. Trust may be misplaced.  
      *   **CI:** **Ambiguous.** (RA/SA Strong, TI compromised).  
      *   **Attribution (A):** **Highly Ambiguous.** The *process* is integrated, but the *source/content* is not solely his. Outputs may reflect others' agendas. Cannot automatically attribute beliefs/decisions solely to him.  
      *   **Duty of Care (DoC):** **Strong *Prima Facie* Duty BUT Qualified.** CI Ambiguity leans towards a duty to maintain *function* (perhaps with safeguards). However, daughter/manufacturer control creates major ethical/legal complexities (ownership, manipulation risk). Maintaining *this specific* unsecured setup might *not* be the duty; securing it or finding an alternative might be.  
      *   **Clinical Action:** Urgently address security/control. Cannot rely on outputs for high-stakes decisions without verifying source/control. CI status fragile due to TI issue.

  2.  **Joint Notebook for Shared Life (e.g., for "managing household finances")**  
      *   *Assess each partner separately for the shared function.*  
      *   **Partner A (Wants Destruction):**  
          *   RA: Likely Strong (relied on it).  
          *   SA: Likely Strong (habitual use).  
          *   TI: **Likely Strong *in the past*, NOW WEAK.** Actively distrusts/rejects it *now*.  
          *   **CI:** **Not Integrated (Currently).** Loss of TI breaks integration. It's now an unwanted tool/record.  
          *   **A:** Outputs not attributable to Partner A *now*.  
          *   **DoC:** No strong duty to maintain *for Partner A's cognition*. Destruction may harm Partner B or violate agreements, but not *cognitively impair* A.  
      *   **Partner B (Reliant):**  
          *   RA: Strong.  
          *   SA: Strong.  
          *   TI: Strong.  
          *   **CI:** **Integrated.**  
          *   **A:** Attributable to Partner B *for their role/understanding*.  
          *   **DoC:** **Strong *Prima Facie* Duty to Maintain (or transition carefully).** Destruction would cognitively impair Partner B for shared life management.  
      *   **Value Judgment:** **Team Lead + Ethicist.** The notebook embodies *shared* cognition/interdependence. Destroying it harms B's integrated system. Property rights and B's cognitive needs likely outweigh A's desire for destruction. Transition plan needed.

  3.  **Spouse Supplying Cues/Values During Capacity Assessment**  
      *   **Scope:** Specific capacity being assessed (e.g., "consenting to procedure X").  
      *   **RA:** Strong (spouse present).  
      *   **SA:** **Strong *IF* cueing is immediate, habitual, and patient responds automatically *as if* recalling internally.** Weak if patient pauses, questions, or needs prompting.  
      *   **TI:** **Strong *IF* patient accepts spouse's cue/value *as their own* without question.** Weak if patient disputes or seems influenced.  
      *   **CI:** **Likely Integrated *if* SA & TI are Strong.** This is the "unpopular" part. If the spouse's cueing is a seamless, automatic, trusted part of the patient's *functional* decision-making process *for this type of decision*, then it *is* part of their extended cognitive system. The *performance* (expressing a choice) relies on this loop.  
      *   **Attribution (A):** **Problematic for Sole Attribution.** While the *process* may be cognitively integrated, the *source* of the cue/value is external. The spouse is an active participant. For consent/legal purposes, this blurs agency. **Value Judgment (Team Lead + Ethicist/Legal):** Does this integrated process meet the threshold for *personal* understanding and expression of choice required for *this specific* decision? Often, it does **not** for complex or high-risk decisions, as the patient's *independent* generation/endorsement is in doubt. It might suffice for routine preferences.  
      *   **Duty of Care (DoC):** **Strong.** Facilitating this supportive interaction is likely part of maintaining the patient's functional capacity. Preventing the spouse from cueing *during assessment* might be necessary to probe underlying capacity, but preventing it *in life* would impair function.  
      *   **Clinical Action:** The *performance* (choice expressed with cues) reflects functional capacity *supported by* the extended system. However, for consent/capacity judgments, **you must assess the patient's *independent* understanding and endorsement.** The EMAP shows the spouse *is likely part of the system*, meaning the patient *cannot* perform the task *independently*. This likely **fails** capacity requirements for significant decisions requiring personal understanding/expression. Document reliance.

  **V. What EMAP Cannot Do (Critical Limitations):**

  1.  **Not a Legal Capacity Determiner:** EMAP assesses cognitive integration and functional performance. **Legal capacity** requires applying jurisdiction-specific legal standards (understanding, appreciation, reasoning, expression) to the *specific decision*. EMAP informs this (e.g., showing reliance means independent reasoning/expression is impaired) but doesn't replace a formal capacity assessment against the legal standard. **Clinician Refusal Point:** Never use EMAP output alone to declare someone legally incapable/competent. Always apply the relevant legal test.
  2.  **Not a Personhood Arbiter:** EMAP says nothing about the patient's status as a person or moral agent. It only describes cognitive architecture.
  3.  **Does Not Automatically Settle Consent/Responsibility:** EMAP (specifically the Attribution step) highlights the *tension* between integrated process and external source control/participation. It **does not** resolve whether consent is valid or responsibility is solely the patient's. This requires **ethical/legal judgment** based on the specific context, risks, and applicable standards.
  4.  **Limited by Time & Observation:** A 15-min snapshot cannot capture all nuances. It relies heavily on observable behavior and report. Chronic, low-frequency, or internalized reliance might be missed. **Clinician Refusal Point:** If the stakes are very high (e.g., major surgery consent, changing will) and the EMAP result is ambiguous or suggests significant reliance on external agency (like the spouse cueing), **insist on a more comprehensive assessment** beyond EMAP's scope. Do *not* rely solely on EMAP in high-stakes, ambiguous cases.
  5.  **Value Judgments are Inescapable:** EMAP structures the question and provides evidence, but judgments on Partial/Uncertain conditions, Attribution, and balancing Duties of Care against other factors **require human clinical and ethical judgment** by the designated team members (Lead Clinician, Ethicist).

  **In essence:** EMAP provides a rapid, structured way to apply the Extended Mind Thesis to clinical observations. It clearly separates Cognitive Integration from the thornier questions of Attribution and Duty of Care, highlighting *where* value judgments are essential. Its power lies in framing the resource *not* just as a tool, but as potential cognitive infrastructure, demanding a higher ethical bar for interference while carefully scrutinizing ownership and agency when that infrastructure involves others. Use it to inform, not replace, clinical and ethical reasoning, especially for high-stakes decisions.
