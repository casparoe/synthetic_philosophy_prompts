prompt: |-
  I work in human factors / patient safety at a regional air-ambulance service — rotor- and fixed-wing, about forty flight crew, a few thousand missions a year. One of my jobs is maintaining the tool we use in post-incident review: for any given fact at issue (the weather at the destination was below minima, the oxygen cylinder was reading low, the receiving hospital hadn't actually accepted the patient), the review has to land on one of three verdicts about the crew member at time t: they knew, they didn't know but should have, or they couldn't have known. That verdict feeds our just-culture matrix, so it has teeth — the first two can trigger remedial training or a competency sign-off, the third usually just changes a procedure or a display. Right now the tool is basically evidence-based invariantism with a checklist: list what was available to them at t, ask whether it was good enough. That's been fine, but our new medical director has been pushing back hard after a case where the same evidence counted as knowing on a low-stakes repositioning flight and apparently stopped counting once there was a deteriorating pediatric patient on board. She thinks — and I now half think — that the bar really should move with what was at stake for that crew member at that moment, i.e. she's asking for something like pragmatic encroachment, and the committee wants to know what we'd actually be signing up for before we write it into the handbook.

  So: give me the procedure version of that. I want the ordered questions a reviewer asks off an incident report, runnable in half an hour from what our normal reports contain, written so a flight nurse or a pilot on the panel can run it without any theory background (I did a philosophy minor about fifteen years ago and I'm the most theory-adjacent person in the room). For each step, say what counts as a sufficient answer, where the procedure hard-stops with "did not know," and where it has to hand the decision back to a person because the real issue is a values call about what our org wants to be accountable for, not a factual one. Two problems are where our informal attempts keep falling apart, and I want both handled explicitly. First: stakes the agent didn't appreciate — nobody told them the flight had upgraded to a scene call, or they had no idea the patient was deteriorating, so the stakes were objectively huge but weren't ones they possessed or believed in at the time. Second: stakes that get inflated after the fact — we run a safety briefing or issue a new protocol, and suddenly the same crew with the same evidence didn't know what they plainly did know six months earlier. My current hack for both is a "stakes firewall": the review applies the stakes attached to the role as constituted at t (the mission card, the checklist, the protocol then in force), not the stakes the individual happened to feel, and not the stakes later policy would assign. Tell me whether that hack survives being turned into actual steps, whether it quietly collapses the view back into invariantism with extra bookkeeping, or whether it's doing real work — and if you have a better fix for either problem, use yours instead and say why it beats mine. I'd also like a short version of what the document would look like if we went the other way and took the contextualist line, where what shifts is the standard in the review room rather than the stakes for the agent: my sense is that on that view the deliverable stops being a tool about the crew at all and becomes a tool about how to run the meeting, and I want to see how different those two documents really are before I bring either to the committee.

  Then run your procedure on three of our cases. (A) A daytime VFR ferry flight, no patient, where the crew's evidence about deteriorating destination weather was fairly thin but everyone would have said they knew. (B) The pediatric scene call: identical evidence about the same weather, but now there's a kid on board and a twenty-minute window. (C) The one I'm dreading, where I want your procedure to give the answer we won't like: a senior flight paramedic everybody respects, who followed the protocol exactly, who by the procedure's own lights did not know — and where writing that down means his competency sign-off lapses and we have to tell him that to his face. Please end by flagging what the procedure can't do for us: I'm guessing it can settle the knowledge verdict but not whether to sanction, and that there'll be cases where the evidence is fine but the record is too thin to run it at all. Don't give me a survey of the literature or who argued for what — no citations, no reading list; I need something I could drop into an appendix and defend to a room of pilots.
reasoning: |-
  We are designing a procedure for post-incident review that incorporates pragmatic encroachment (i.e., the idea that the stakes of the situation can affect whether an agent knows a proposition). The procedure must be step-by-step, usable by non-theorists, and address two key problems: 
    1. Stakes the agent didn't appreciate (objectively high stakes not subjectively present).
    2. Stakes that get inflated after the fact (due to new protocols or hindsight).

  The current proposal is a "stakes firewall": we use the stakes attached to the role as constituted at time t (via mission card, checklist, protocol then in force), not the agent's subjective feelings or later policy changes.

  We are to produce:
    - An ordered list of questions for the reviewer.
    - For each step: what counts as sufficient, where it hard-stops, and where it requires a values call.
    - Explicit handling of the two problems.
    - A comparison of what a contextualist approach (shifting standards in the review room) would look like.
    - Application to three cases (A, B, C).

  Then, we must flag what the procedure cannot do.

  Procedure: Pragmatic Encroachment Review (PER) with Stakes Firewall

  Key Definitions:
    - "t": the time of the incident/decision in question.
    - "Evidence": what was available to the crew member at t (via instruments, communications, etc.).
    - "Stakes": the potential consequences of being wrong about the fact at issue, as defined by the role and mission at t.

  Steps:

  1. **Identify the Fact at Issue (F)**
     - What specific fact was the crew member supposed to know? (e.g., "The weather at the destination was below minima.")
     - *Sufficient answer*: A clear, specific statement of F.
     - *Hard-stop if*: F is not relevant to the incident (then the review may not proceed on this fact).

  2. **Identify the Evidence Available at t**
     - What information did the crew member have access to at t about F?
     - Include: instruments, communications, training, checklists, etc.
     - *Sufficient answer*: A list of the evidence sources and their content as recorded or reported.
     - *Hard-stop if*: No evidence was available (then verdict is "could not have known").

  3. **Determine the Objective Stakes at t (Stakes Firewall Step)**
     - What were the stakes attached to the role and mission at t?
     - Use only: the mission type (e.g., ferry, scene call, inter-facility) as per the mission card, the protocol in force at t, and the checklist requirements at t.
     - Do not use: the crew member's subjective awareness of stakes or any post-t policy changes.
     - *Sufficient answer*: Reference to the mission type and protocol/checklist at t that defines the stakes. For example:
          - Ferry flight: low stakes (only equipment and crew at risk).
          - Scene call with critical patient: high stakes (patient survival at risk).
     - *Values call needed if*: The mission type or protocol is ambiguous about stakes. Then the panel must decide, based on the organization's values, what level of stakes to assign to that mission type at t. (This is a rare case.)

  4. **Set the Epistemic Standard (based on stakes)**
     - For low stakes: the evidence must be "adequate" for a reasonable crew member to believe F.
     - For high stakes: the evidence must be "robust" (i.e., it would be unreasonable to doubt F given the evidence).
     - *Note*: We are defining two tiers for simplicity. In practice, the standard is a sliding scale, but we break it into two for operational clarity.
     - *Sufficient answer*: A clear assignment of low or high stakes from step 3, and then the corresponding standard (adequate or robust).
     - *Hard-stop if*: Stakes are low and evidence is absent or clearly inadequate (then verdict is "did not know but should have" if evidence should have been sought, or "could not have known" if not).

  5. **Evaluate the Evidence Against the Standard**
     - For low stakes (adequate standard): 
          - Was the evidence sufficient for a reasonable crew member to form a belief in F without further investigation? (e.g., a single reliable source might suffice.)
     - For high stakes (robust standard):
          - Was the evidence of such quality and quantity that a reasonable crew member would have no reasonable doubt about F? (e.g., multiple independent sources, or one highly reliable source with no conflicting indicators.)
     - *Sufficient answer*: A yes/no on whether the evidence met the standard.
     - *Values call needed if*: The evidence is borderline. Then the panel must decide, based on reasonableness, whether the evidence met the standard. (This is a judgment call.)

  6. **Verdict**
     - If the evidence met the standard for the stakes at t: "knew".
     - If the evidence did not meet the standard, but the crew member could have obtained evidence that would have met the standard (by following protocols, using available resources): "did not know but should have".
     - If the evidence did not meet the standard and the crew member could not have obtained better evidence (within protocol and role expectations): "could not have known".

  Handling the Two Problems:
    - **Problem 1 (Stakes agent didn't appreciate)**: The stakes firewall uses the objective mission and protocol at t. So, if the mission was upgraded to a scene call but the crew wasn't told, the stakes are still low (ferry) because that's what was on the mission card. Conversely, if it was a critical scene call and they didn't know the patient was deteriorating, but the mission card and protocol defined high stakes, then high stakes apply. The firewall prevents the agent's subjective awareness from mattering.
    - **Problem 2 (Stakes inflated after the fact)**: The firewall uses the protocol and mission type as of t. So, if a new safety briefing after t raises the stakes for a particular fact, that doesn't apply. We use the stakes as defined at t.

  Does the firewall collapse into invariantism? 
    - No, because the standard (adequate vs. robust) still shifts with the stakes (as defined by the role at t). The firewall only fixes the stakes to the objective role at t, not to a fixed standard.

  Comparison to Contextualism:
    - In contextualism, the standard for knowledge shifts with the context of the assessor (the review panel). So, in a high-stakes review (e.g., a fatality), the panel might require more evidence for a "knew" verdict than in a low-stakes review. This would make the verdict about the panel's context, not the crew's context at t.
    - A contextualist procedure would look similar but without step 3 (objective stakes at t). Instead, the panel would set the standard based on what they (the panel) consider to be the stakes in the review context (e.g., the severity of the outcome). This would be problematic because:
          - It would make the verdict depend on the outcome (which we don't want in a just culture).
          - The same incident might get different verdicts in different panels or at different times.
          - It does not focus on the crew's situation at t.

    - Contextualist document sketch:
          1. Identify F.
          2. Identify evidence at t.
          3. Determine the stakes in the review context (e.g., based on the outcome: if there was a bad outcome, stakes are high; if not, low).
          4. Set the standard (high stakes -> robust, low -> adequate).
          5. Evaluate evidence against the standard.
          6. Verdict as above.

    - This is indeed a tool about how to run the meeting and is outcome-dependent. We avoid this.

  Application to Cases:

  Case A: Daytime VFR ferry flight, no patient. Fact F: "Weather at destination is below minima." 
    - Step 1: F is clear.
    - Step 2: Evidence was thin (e.g., one weather report that was ambiguous but not clearly below minima).
    - Step 3: Mission type: ferry (low stakes per protocol at t).
    - Step 4: Standard: adequate.
    - Step 5: Thin evidence might be adequate for low stakes? (Yes, because in a ferry flight, a single report might be enough to proceed without further checks, especially if it didn't clearly indicate below minima.) 
    - Verdict: Knew.

  Case B: Pediatric scene call: identical evidence about weather, but now with a critical patient and a 20-minute window.
    - Step 1: Same F.
    - Step 2: Same thin evidence.
    - Step 3: Mission type: scene call for a pediatric critical patient (high stakes per protocol at t).
    - Step 4: Standard: robust.
    - Step 5: Thin evidence (ambiguous report) is not robust. A reasonable crew member would have sought more confirmation (e.g., called the destination, checked another source) given the high stakes.
    - Verdict: Did not know but should have (because they could have obtained more evidence).

  Case C: The dreaded case. Senior paramedic, followed protocol exactly, but by the procedure, did not know.
    - Fact F: e.g., "The receiving hospital had accepted the patient."
    - Evidence: The paramedic called the dispatch and was told "accepted", but dispatch had not actually confirmed with the hospital (and the hospital had not accepted). The protocol at t required only that they call dispatch and get verbal confirmation.
    - Step 3: High stakes (patient transfer).
    - Step 4: Robust standard required.
    - Step 5: The evidence (dispatch saying "accepted") might not meet robust standard if the protocol did not require direct confirmation with the hospital. However, the crew member followed the protocol exactly. 
        - But note: the protocol might be flawed. The verdict is about the crew member's knowledge at t, not the protocol.
        - The evidence available to the paramedic was the dispatch's word. In high stakes, is that robust? Probably not, because it's a single point of failure and the protocol didn't require more. However, the crew member did what the protocol required. 
        - Step 6: They did not know (because the evidence was not robust) and they couldn't have known? But wait: should they have done more? The protocol didn't require more, so they couldn't have known? 
        - However, note the verdict categories:
            - "Knew": if the evidence met the standard -> here, it didn't (robust standard not met).
            - "Did not know but should have": if they could have obtained better evidence -> but they followed protocol, so they did what they should have. Therefore, we must ask: was there an available means to obtain better evidence that they should have used (even if not in protocol)? In a just culture, we don't punish for following protocol. So if the protocol was followed, then they could not have known (because the protocol didn't provide for more). 
        - Therefore, verdict: could not have known.

    - But wait: the procedure says the standard is set by stakes, and the evidence didn't meet it. However, the "could not have known" verdict applies when they could not have obtained better evidence. In this case, they did what the protocol required, and the protocol didn't allow for more. So it's "could not have known". 

    - However, this is the answer we won't like because it means the protocol must change (and the paramedic is not at fault). This is the correct outcome: the procedure flags the protocol as insufficient for high stakes, and the paramedic is not blamed.

  What the Procedure Cannot Do:
    - It cannot decide whether to sanction; it only outputs a knowledge verdict. The just-culture matrix uses this verdict along with other factors (like intent, negligence) to decide on sanctions or actions.
    - It cannot be run if there is insufficient evidence about what happened at t (e.g., no record of the evidence available, or unclear mission type). Then the review must be inconclusive.
    - It does not replace human judgment in borderline evidence or ambiguous stakes; those are values calls for the panel.
    - It does not address systemic issues beyond the specific fact at issue (though the verdict may point to them).

  Final Procedure Document:

  **Pragmatic Encroachment Review (PER) Procedure**

  1. **Fact at Issue**: 
     - Question: "What specific fact was the crew member supposed to know at the time of the incident?"
     - Instructions: State the fact clearly and specifically.
     - If the fact is not relevant to the incident, stop: this fact is not subject to review.

  2. **Evidence Available at t**:
     - Question: "What information did the crew member have access to at the time about this fact?"
     - Instructions: List all sources of information (e.g., instruments, communications, checklists) and their content as recorded or reported.
     - If no evidence was available, verdict is "could not have known": stop.

  3. **Objective Stakes at t (Stakes Firewall)**:
     - Question: "Based on the mission type and protocols in force at the time, what were the stakes for being wrong about this fact?"
     - Instructions: 
          - Refer to the mission card (ferry, scene call, inter-facility) and the relevant protocol/checklist at the time of the incident.
          - Assign stakes: 
              - Low: ferry, non-urgent transfer, no patient or stable patient.
              - High: scene call, critical patient, unstable transfer, or as specified by protocol.
          - Do not consider the crew member's subjective awareness or any changes in policy after the incident.
     - If the stakes are ambiguous, the panel must decide based on the organization's values at the time: this is a values call.

  4. **Set the Epistemic Standard**:
     - If stakes are low: the standard is "adequate evidence" (sufficient for a reasonable belief without further investigation).
     - If stakes are high: the standard is "robust evidence" (leaving no reasonable doubt; multiple sources or highly reliable source without conflict).

  5. **Evaluate Evidence Against Standard**:
     - Question: "Given the stakes and standard, did the evidence meet the standard?"
     - Instructions:
          - For low stakes: was the evidence adequate? (e.g., a single reliable source might be enough)
          - For high stakes: was the evidence robust? (e.g., multiple sources, no conflicting information, or very high reliability)
     - If the evidence is borderline, the panel must decide by consensus: this is a judgment call.

  6. **Verdict**:
     - If the evidence met the standard: "knew"
     - If the evidence did not meet the standard:
          - Could the crew member have obtained evidence that would have met the standard, by following protocols or using available resources?
              - Yes: "did not know but should have"
              - No: "could not have known"

  This procedure addresses:
    - Unappreciated stakes: by using the mission card and protocol at t (objectively defined stakes).
    - Inflated stakes after the fact: by using the protocol and mission type as of t.

  The procedure does not guarantee that every case will be easy, but it provides a structured, fair, and consistent approach.
answer: |-
  ### Pragmatic Encroachment Review (PER) Procedure  
  **Purpose**: To determine whether a crew member knew a critical fact at time *t* during a mission, accounting for the stakes of the situation. Stakes are defined by the **role and mission parameters at *t*** (via mission cards, checklists, protocols in force), not by the crew's subjective feelings or later policy changes.  

  ---

  #### Ordered Questions for Reviewers  
  *Run in sequence. Use mission records, comms logs, and protocols valid at t. Time: ~30 mins.*  

  1. **What was the fact at issue?**  
     - *Ask:* "What specific fact did the crew member need to know? (e.g., 'Weather at destination was below minima.')"  
     - *Sufficient answer:* Clear, unambiguous statement.  
     - *Hard-stop if:* Fact is irrelevant to the incident → End review for this fact.  

  2. **What evidence was directly available to the crew member at *t*?**  
     - *Ask:* "What did they see, hear, or access via tools/protocols at *t*? (e.g., weather display, radio comms, checklist output.)"  
     - *Sufficient answer:* List of evidence sources (e.g., "Weather app showed 1-mile visibility; ATC reported 'clear'").  
     - *Hard-stop if:* **No evidence was available** → Verdict: "Could not have known."  

  3. **What were the objective stakes at *t*?**  
     - *Ask:* "What did the mission card, checklist, or protocol **at *t*** say about this fact’s importance? Was it a ferry flight, scene call, or critical transfer?"  
       - *Use stakes firewall:* Ignore the crew’s subjective awareness *and* post-*t* policy changes.  
       - *Low stakes*: Ferry, stable patient, routine transfer.  
       - *High stakes*: Scene call, unstable patient, time-sensitive emergency.  
     - *Sufficient answer:* Mission type + protocol clause (e.g., "Pediatric scene call; Protocol 4.2: 'Weather certainty required for critical patients.'").  
     - *Values call needed if:* Protocol is ambiguous → Panel decides stakes based on **org values at *t*** (e.g., "How would we define stakes for pediatric transfers in 2023?").  

  4. **What evidence standard applies?**  
     - *Low stakes* → "Adequate evidence": Reasonable to act without double-checking (e.g., one reliable source).  
     - *High stakes* → "Robust evidence": Unreasonable to act without corroboration (e.g., two independent sources, no contradictions).  
     - *Sufficient answer:* Standard tied to Step 3’s stakes (e.g., "High stakes → Robust evidence required").  

  5. **Did the evidence meet the standard?**  
     - *Ask:* "Would a reasonable crew member, given their role and training at *t*, say the evidence was sufficient to act?"  
     - *Sufficient answer:*  
       - ✅ **Meets standard**: Evidence aligns with stakes (e.g., low stakes + one source = adequate).  
       - ❌ **Fails standard**: Evidence too weak (e.g., high stakes + conflicting sources = not robust).  
     - *Values call needed if:* Evidence is borderline → Panel debates reasonableness **based on training at *t***.  

  6. **Could the crew member have obtained better evidence?**  
     - *Ask:* "Could they have gathered more evidence using protocols/tools **available at *t***?"  
     - *Sufficient answer:* Yes/no + method (e.g., "Yes: Could have radioed dispatch per Checklist B").  
     - *Hard-stop if:* **No feasible way to get better evidence** → Verdict: "Could not have known."  

  7. **Final Verdict**  
     | Condition | Verdict |  
     |---|---|  
     | Evidence met standard (Step 5 ✅) | **Knew** |  
     | Evidence failed standard (Step 5 ❌), but better evidence was obtainable (Step 6 Yes) | **Did not know but should have** |  
     | Evidence failed standard (Step 5 ❌), and better evidence was unobtainable (Step 6 No) | **Could not have known** |  

  ---

  #### Why the Stakes Firewall Works  
  - **Solves unappreciated stakes**: Uses mission/protocol at *t* (e.g., if dispatch didn’t upgrade a ferry to a scene call, stakes remain **low**).  
  - **Solves inflated stakes**: Ignores post-*t* policy changes (e.g., a new 2024 weather-check protocol doesn’t retroactively raise 2023 stakes).  
  - **Not invariantism**: Standards **shift with stakes** (low vs. high evidence bars), but stakes are fixed by role at *t*, not theory.  

  ---

  #### Contextualist Alternative (For Comparison)  
  *If standards shift based on review-room stakes (e.g., incident severity), not agent stakes:*  
  1. Same Steps 1–2.  
  2. **Step 3 (modified):** "What are the stakes **of this review**? (e.g., Patient died? Equipment lost?)"  
  3. **Step 4 (modified):** Set evidence standard based on **review stakes** (e.g., death → robust evidence required).  
  4. Proceed as above.  
  - **Key difference**: Verdicts change if the same incident is reviewed by different panels (e.g., a near-miss vs. a crash). This **focuses on the review process**, not the crew’s context. *Not recommended—it breaks just culture by blaming outcomes, not decisions at t.*  

  ---

  #### Procedure Applied to Cases  
  **Case A: Daytime VFR Ferry Flight (No Patient)**  
  - Fact: "Weather below minima at destination."  
  - Evidence: Single weather app showing "possible fog" (not definitive).  
  - Stakes (Step 3): Ferry flight → **Low stakes** (per mission card).  
  - Standard (Step 4): Adequate evidence.  
  - Verdict (Step 5): Evidence adequate for low stakes → **Knew**.  
  - *Why?* Thin evidence suffices when only crew/equipment are at risk.  

  **Case B: Pediatric Scene Call (Identical Weather Evidence)**  
  - Fact: Same as Case A.  
  - Evidence: Same single weather app.  
  - Stakes (Step 3): Pediatric emergency → **High stakes** (per protocol for critical patients).  
  - Standard (Step 4): Robust evidence required.  
  - Verdict (Step 5): Single app not robust → **Did not know but should have** (Step 6: Could have radioed ATC for confirmation).  
  - *Why?* High stakes demand cross-verification.  

  **Case C: Senior Paramedic Followed Protocol**  
  - Fact: "Receiving hospital accepted patient."  
  - Evidence: Dispatch said "accepted" (per Protocol 2.1 at *t*). Truth: Hospital hadn’t accepted.  
  - Stakes (Step 3): High (unstable patient transfer).  
  - Standard (Step 4): Robust evidence.  
  - Step 5: Single dispatch call → **Not robust** (high stakes require direct confirmation).  
  - Step 6: Protocol 2.1 **at *t*** did not require double-checking → No feasible way to get better evidence.  
  - Verdict: **Could not have known**.  
  - *Why we won’t like it:* Competency sign-off lapses, but fault is systemic (flawed protocol). Firewall protects the crew—blame falls on org for inadequate procedures.  

  ---

  #### What This Procedure Can’t Do  
  1. **Not a sanction tool**: Outputs a knowledge verdict only. Sanctions (e.g., training) require the just-culture matrix (intent, negligence).  
  2. **Not for evidence gaps**: Fails if records from *t* are missing (e.g., no mission card → Stakes firewall breaks).  
  3. **Not for moral calls**: Values decisions (e.g., ambiguous stakes) require panel debate.  
  4. **Not for systemic fixes**: "Could not have known" flags procedural holes but doesn’t design solutions.  

  ---  
  **Final Document Ready**: Append this to your handbook. Pilots/nurses can run it using incident reports—no theory needed. Defend the stakes firewall as the "mission-context anchor."
