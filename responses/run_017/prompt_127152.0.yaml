answer: |-
  ### Exam Question  
  **Section C: Diachronic Rationality** (Answer ONE question. 90 minutes total.)  

  **3.** Consider an agent who is *locally coherent*: at every individual choice node she faces, her preferences over the immediately available options are complete and transitive. However, her pairwise preferences over options A, B, and C are cyclical (A ≻ B, B ≻ C, C ≻ A) when offered pairwise menus, while her preference over the full menu {A, B, C} is A ≻ B ≻ C. An exploiter can sequentially offer her trades (e.g., A-for-B + small fee, B-for-C + fee, C-for-A + fee), leaving her with A again but poorer. She foresees this sequence, understands the money pump argument, and is *contented*: she prefers retaining her preference dispositions (even at the cost of paying small fees) over paying a larger cost to change them. She also chooses A from the full menu {A, B, C}.  

  Does this agent exhibit a rational defect? Defend your answer by:  
  (a) Precisely identifying what the money pump purportedly reveals (e.g., defective preferences, defective choice rule, mere vulnerability).  
  (b) Explaining why her contentment does not automatically vindicate her rationality.  
  (c) Describing what she must do to avoid exploitation, what cost this imposes, and why this cost is significant.  
  (d) Addressing whether the money pump argument overgeneralizes by condemning agents with endorsed preference changes (e.g., from learning).  

  ---

  ### Model Answer (≈700 words)  

  The locally coherent agent (LCA) exhibits a rational defect in her *preference structure*, revealed diachronically through exploitability. The money pump does not merely show vulnerability to malicious framing; it demonstrates that her *pairwise preferences are intrinsically inconsistent* with her overarching preference in the grand choice context. This inconsistency is a structural flaw in her conative state, making her diachronically incoherent despite local coherence at each node. Contentment does not resolve this defect because money pump arguments target *coherence requirements of rationality*, not welfare optimization. To escape exploitation, she must act against her current preference at some node ("resolute choice"), sacrificing synchronic rationality for diachronic plan-following—a cost that highlights the conflict between rational requirements. Crucially, the argument does not overgeneralize to benign preference changes, as these lack the *cyclical inconsistency* central to the LCA’s case.  

  **(a) The Defect Revealed**  
  The pump shows a defect in the agent’s *preferences themselves*, not merely her choices. Her pairwise rankings (A≻B, B≻C, C≻A) violate the *acyclicity* condition for rational preferences, even if transitivity holds within each menu. This latent inconsistency is exposed diachronically: sequential choices based on these preferences lead to dominated outcomes (losing money for no gain), violating the principle of *dynamic consistency*. The exploitability arises from the *structure* of her preferences, not the agent’s choice rule (e.g., myopic maximization is faultless here) or mere framing vulnerability. Rationality requires preferences to be extendable to a coherent global ordering; cyclical preferences preclude this.  

  **(b) Why Contentment Fails as a Defense**  
  Contentment mistakenly conflates *welfare rationality* (satisfying desires efficiently) with *structural rationality* (having consistent attitudes). The LCA’s contentment shows she prefers her current state (including cyclical dispositions) to alternatives, but money pump arguments target coherence, not welfare. Rationality imposes *deontic constraints*: even if an inconsistent agent endorses their inconsistency (or benefits from it), they violate a constitutive norm of agency. Broome (2013) argues rationality prohibits certain combinations of attitudes—here, the pairwise preferences contradict the grand-menu ranking. Foreseeable exploitation reveals this contradiction: synchronic preferences that collectively undermine her own diachronic interests. Contentment addresses *reasons to change* but not the *irrationality of the existing state*.  

  **(c) Escape and its Cost**  
  To avoid exploitation, the LCA must adopt *resolute choice* (McClennen, 1990): at the first node (e.g., refusing A-for-B despite preferring it then), she must adhere to her *ex-ante plan* to retain A, based on her grand-menu preference. This requires acting *against her current preference* at that node. The cost is twofold:  
  1. **Synchronic irrationality**: She chooses an option dispreferred *at that moment*, violating the principle of maximizing local preference satisfaction.  
  2. **Commitment burden**: She must invest cognitive resources in precommitment or willpower to override local preferences, a cost not borne by agents with globally coherent preferences.  
  This cost underscores the LCA’s defect: synchronic and diachronic rationality conflict *only* because her underlying preferences are inconsistent. Globally coherent agents avoid this dilemma.  

  **(d) Overgeneration Resolved**  
  The argument does not overgeneralize to benign preference shifts (e.g., learning a food is toxic, changing a disliked painting). These involve *non-cyclical, endorsed transitions*: new preferences *replace* old ones intentionally, without latent inconsistency. Crucially, the agent’s preferences at each time are consistent *with themselves and her beliefs*. In contrast, the LCA’s defect is *structural*: her *simultaneously held* pairwise preferences (across menus) conflict with her grand-menu preference. Exploitability in learning cases arises from *information asymmetry* or *unendorsed path-dependence*, not cyclical inconsistency. Thus, money pumps only condemn preference sets with *inherent cyclicality*, not all diachronic vulnerability.  

  **Conclusion**  
  The LCA is irrational because her preferences violate acyclicity—a core requirement for unified agency over time. Contentment confuses prudential endorsement with structural coherence, resolute choice imposes synchronic costs due to her inconsistency, and the argument’s specificity to cyclicality avoids overgeneralization. Rationality requires more than local coherence; it demands preferences resilient to diachronic scrutiny.  

  ---

  ### Marking Scheme (Total: 20 marks)  

  1.  **Defect Identification** (4 marks)  
      *   *Full marks:* Clearly states the defect lies in the *preferences* (cyclical inconsistency), not choices/vulnerability. Explains violation of dynamic consistency/acyclicity.  
      *   *Common error:* Claims defect is "myopic choice" or "framing vulnerability" without linking to preference structure.  

  2.  **Contentment Rebuttal** (4 marks)  
      *   *Full marks:* Distinguishes structural coherence from welfare/endorsement. Cites Broome-style requirements. Notes exploitability reveals internal contradiction.  
      *   *Common error:* Asserts contentment proves rationality by satisfying desires, ignoring coherence norms.  

  3.  **Escape Mechanism & Cost** (4 marks)  
      *   *Full marks:* Names resolute choice; specifies acting against current preference; identifies cost as synchronic irrationality/commitment burden.  
      *   *Common error:* Suggests "better planning" without specifying the conflict with local preference.  

  4.  **Overgeneration Response** (4 marks)  
      *   *Full marks:* Contrasts cyclicality (simultaneous inconsistency) with endorsed, non-contradictory preference shifts. Notes role of beliefs/information.  
      *   *Common error:* Claims all exploitability implies irrationality, or dismisses overgeneration entirely.  

  5.  **Argument Clarity & Structure** (4 marks)  
      *   *Full marks:* Precise terminology; logical flow; addresses all sub-parts; concise conclusion.  
      *   *Common error:* Disjointed analysis; omitting a sub-part; excessive jargon.  

  **A vs. B Distinction:**  
  *   **A-grades (16+)** integrate parts into a unified thesis, explicitly engage with *why* rationality demands acyclicity beyond exploitability, and rigorously separate structural coherence from welfare.  
  *   **B-grades (12–15)** address all parts correctly but lack depth in connecting themes (e.g., not explaining *why* contentment misses the point philosophically) or lapse into slogans.  

  ---

  ### Confidence Note (98 words)  

  This question has a determinate best answer: the agent *is* irrational due to cyclical preferences. The core arguments (dynamic inconsistency, resolute choice costs, Broomean requirements) are established in decision theory. However, I am least confident about forcing strong candidates to fully accept that **contentment is irrelevant to rationality verdicts**. While structurally sound, this stance may feel counterintuitive; a sophisticated candidate might argue that *endorsed, identity-constitutive* dispositions could override coherence norms without irrationality. This challenges the "requirements of rationality" framework itself, but the model answer’s position remains dominant in the literature.
