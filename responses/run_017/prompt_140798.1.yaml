prompt: |-
  ok so here's the situation. I'm a junior and I'm giving one of the three-minute public comment slots at our school board meeting next Tuesday, and I'm asking them to stop stalling on the solar thing — the district has had a plan to put panels on the three big school roofs for like two years and every budget cycle they push it another year, and the board president keeps saying it's a sequencing/bond issue but everyone knows the paving contractor who does all their parking lots donates to half of them. The room is going to be maybe forty people, mostly teachers union people and three guys who show up to every meeting to complain about the turf field, and the board sits there and does not react. I want to actually say to their faces that what they're doing is blameworthy, not just that the policy is inefficient.

  the problem is that I'm kind of obviously a hypocrite and everyone there knows it. I fly to Singapore every other summer to see my dad. I drive a 2004 truck that gets maybe 14 miles to the gallon and I refuse to feel bad about it. Last spring I skipped the climate walkout to go to a thing. And a guy from the debate team told me he's going to sign up for the slot after mine and say all of that out loud, and like — he's not wrong, that's the annoying part. Priya says I should confess it in my first sentence so nobody can use it against me later. My other friend says that's just handing the board a reason to stop listening and that "you do it too" is a fallacy anyway so I should ignore it entirely. And someone else pointed out that Nora in the env club is vegan and bikes everywhere and has never flown anywhere, so why doesn't she just give the speech instead. That suggestion made me weirdly annoyed and I don't know if that means it's a bad idea or if it's a good one.

  I've been reading around a bit about standing to blame (my philosophy teacher gave me a handout and I fell into a youtube rabbit hole) and what I think I get is this: there's a difference between saying a decision is wrong and demanding they fix it, versus the thing where you blame someone to their face, which is sort of holding them to a rule in a way that maybe you lose the right to do if you break the rule yourself — and the "you too" reply isn't just a dumb fallacy there, it's pointing at something real about what you're doing when you blame. But also, if you need totally clean hands before you're allowed to blame anyone, then basically nobody who benefits from how things are set up can ever blame anyone, which seems like it would just end up protecting the people with the most power, and that feels wrong too. And I genuinely can't tell whether admitting my own garbage up front earns me anything or whether it's just a performance that makes the speech about me. So: write me the speech. ~3 minutes, something a person could actually say out loud into a microphone in front of their mom, not a philosophy paper with line breaks. It should do something real with this mess instead of dodging it — like, if the honest move is that I can say the decision is wrong and demand they act but I don't get to personally condemn them, or that I have to say it as someone implicated rather than as someone clean, or that I give up the blame and keep the demand, I want the speech to actually take that shape rather than hint at it. Also please don't make it a three-minute apology for my truck, and don't have me smugly announce that hypocrisy is a fallacy, because either one will get me booed by whoever shows up. My mom is recording it, so nothing that'll be unbearable in ten years.
reasoning: |-
  Okay, the user is a high school junior preparing a 3-minute public comment for a school board meeting. They want to call out the board for delaying solar panel installations, suspecting corruption due to contractor donations. But they're worried about being seen as hypocritical since they have a gas-guzzling truck, fly internationally, and skipped climate protests. A debate team rival plans to expose this, and friends give conflicting advice: confess upfront, ignore it, or let someone else speak. 

  Hmm. The core tension here is about moral standing—how to demand accountability while acknowledging personal flaws. The user clearly understands the philosophical nuance (they've researched standing to blame) but needs a practical speech that navigates this without sounding defensive or performative. Their frustration at the "let Nora do it" suggestion is telling: they want ownership despite imperfections.

  Key challenges: The speech must 1) pressure the board effectively 2) preempt hypocrisy accusations credibly 3) avoid self-flagellation 4) keep focus on systemic failure. Also, the setting matters—40 people, recorded, with opponents waiting to pounce. 

  The approach should reframe "clean hands" as irrelevant to institutional duty. Start by naming the elephant in the room (their carbon footprint) but immediately pivot to "this isn't about me." Contrast personal choices (variable/messy) with institutional obligations (non-negotiable). Use the board's own "sequencing" excuse against them by demanding transparency. End with a call for action that centers students' futures. 

  Avoid: Philosophy lectures, truck apologies, or conceding moral high ground. Instead, weaponize their imperfections—"I benefit from the status quo too, yet even I see this is wrong." That undercuts the board's potential dismissal. The debate kid's "gotcha" loses sting if the user says it first matter-of-factly. 

  Biggest risk is sounding sanctimonious. Keep language concrete ("two years of delays," "donations from contractors") and ditch jargon. Humor helps ("I drive a truck older than some freshmen") but stay sharp on corruption implications. Mom-proofing means no edgy burns, just unflinching facts. 

  Final speech structure: 
  - Hook (personal stake as student) 
  - Confession (30 sec max) 
  - Pivot to systemic issue (contrast personal/institutional) 
  - Dissect board excuses 
  - Demand timeline + transparency 
  - Close on collective responsibility 

  Nora could deliver it cleaner, but the user's flawed position makes the demand harder to dismiss as "just idealists." Their speech exposes how broad the frustration is—even beneficiaries see the rot.
answer: |-
  Here's a speech that tackles the hypocrisy head-on without letting it derail the core demand, leans into your position as an *implicated* student rather than a "pure" activist, and maintains pressure on the board:

  **Speech Draft (Approx. 2 min 45 sec):**

  "Good evening, Board Members, Superintendent. My name is [Your Name], and I’m a junior here in the district. I’m speaking tonight about the solar project – the one that’s been delayed year after year.

  **(Acknowledge the Elephant - Calmly & Briefly)**
  Let me be upfront: I’m not the perfect environmental advocate. I drive an old truck. I’ve taken international flights. I haven’t attended every climate event. I benefit from the system as it is, just like most of us in this room do. That’s the reality we live in.

  **(Swift Pivot to Institutional Duty)**
  But here’s the crucial difference: **My personal choices, however imperfect, aren’t holding the future of this district hostage.** The board’s institutional choices are. For two years running, the decision to install solar panels on our schools has been pushed down the road. Each time, we’re told it’s about ‘sequencing’ or ‘bond capacity.’ Yet, year after year, other projects – often involving paving and parking lots – seem to find their funding just fine.

  **(Focus on Their Actions & Broken Promises)**
  This isn’t about individual virtue. It’s about institutional responsibility and broken trust. The district *has* a plan. It *knows* solar saves money long-term and reduces our carbon footprint – something our own curriculum teaches us is essential. Delaying action isn't sequencing; it's **stalling**. And when stalling happens year after year, while contractors who benefit from *other* spending are known donors to board campaigns... well, people notice. It erodes faith that decisions are being made for the right reasons: the financial and environmental health of our schools and our students' futures.

  **(The Core Demand - Specific & Action-Oriented)**
  So, here’s my demand, stripped of any pretense about who I am or am not: **Stop the delays.** Commit, publicly and irrevocably, to funding and installing the solar panels in the *next* budget cycle. Not the cycle after that, or the one after that. The *next* one. Give us a concrete timeline by the end of this school year. And if the ‘sequencing’ argument holds any water, show us the transparent plan that proves why paving parking lots repeatedly takes precedence over a long-term, cost-saving, environmentally sound investment on our school roofs.

  **(Closing - Implied Blame through Systemic Failure)**
  You were elected to lead, to make tough choices for our future, not just manage the status quo. Every year this project is delayed is a year of wasted savings, a year of unnecessary emissions, and a year where the message to students is that real action can always wait. You have the power to change that. Stop stalling. Put the panels on the roofs. Show us you're making decisions for the students and the community's future, not just for the next budget cycle or the next campaign donation report. Thank you."

  **Why This Works:**

  1.  **Acknowledges the Hypocrisy (Briefly & Strategically):** You name it quickly and matter-of-factly ("I drive an old truck..."). This disarms the debate kid *before* he speaks. It shows self-awareness and robs his "gotcha" of its sting. It's not an apology; it's a statement of fact that transitions into your main point.
  2.  **Crucial Distinction - Personal vs. Institutional:** This is the heart of your philosophical point. You clearly separate messy individual choices (which everyone makes) from the *non-discretionary, fiduciary, and moral duty* of an elected board managing public funds and infrastructure. Their obligation is absolute, regardless of anyone's personal carbon footprint.
  3.  **Focuses on Their Actions & Broken Trust:** The core blame isn't framed as "you are bad people," but as "your institutional actions (delays) contradict your stated plans and responsibilities, and the pattern raises serious questions about priorities." This is harder to dismiss than personal condemnation. Highlighting the contractor donations *implicitly* makes the corruption point without needing to scream "bribery!".
  4.  **Clear, Actionable Demand:** It's specific ("*next* budget cycle"), time-bound ("timeline by end of this school year"), and challenges their excuse ("show us the transparent plan"). This shifts the burden back onto them to act or explain *properly*.
  5.  **Implied Blame through Systemic Failure:** The blame comes through clearly in the description of the consequences of their actions: wasted money, unnecessary pollution, broken trust, failing students. You don't need to say "you are blameworthy"; you demonstrate *why* the decisions are blameworthy.
  6.  **Avoids Traps:** No long apology tour. No philosophy lecture. No "hypocrisy fallacy" argument. No pretending to be perfect. It leans into being an *imperfect messenger* demanding *essential systemic change*. Nora *could* give a different speech, but *your* speech leverages your position as someone *within* the flawed system demanding it work better.
  7.  **Mom-Proof:** It's direct, factual, passionate but not hysterical, and focuses on institutional failure rather than personal attacks on individual board members. It shows maturity and understanding of how systems work (or fail).

  **Key Delivery Tips:**

  *   **Practice:** Time it! 3 minutes is short. Read it aloud multiple times until it flows naturally. Focus on clear enunciation and pacing – don't rush.
  *   **Tone:** Calm, firm, and respectful but unyielding. Avoid sounding angry or whiny. Project disappointment and resolve. Make eye contact with the board members as a group.
  *   **Emphasis:** Stress key phrases: "**aren't holding the future hostage**", "**Stop the delays.**", "**next* budget cycle*", "**transparent plan**", "**Stop stalling.**".
  *   **The Debate Kid:** If he speaks after you and rehashes your truck/flights, it will likely fall flat because you already addressed it and framed it as irrelevant to the core issue. Your speech makes his point predictable and petty. Stay seated and look unfazed.

  This speech forces the board to respond to the substance – the delays, the excuses, the demand for action – rather than getting bogged down in a debate about your personal life. It uses your position, hypocrisy and all, to strengthen the argument that the *system* is failing and they, as the governing body, must fix it. Good luck!
