  ### Worked Example: Equal TPR with Same Threshold, Calibration Within Groups, Yet Higher FPR in Lower Base Rate Group

  **Group Definitions and Base Rates**  
  - Group A: Base rate = 0.30 (300 events in 1,000 patients)  
  - Group B: Base rate = 0.15 (150 events in 1,000 patients)  
  - Threshold = 0.50 (same for both groups)  

  **Score Distributions (Calibrated Within Groups)**  
  Scores take values {0.2, 0.4, 0.6, 0.8}. Calibration is exact: at each score, the realized event fraction equals the score.  

  | **Group A (Base rate = 0.30)** |         |          |  
  |-------------------------------|---------|----------|  
  | **Score (s)** | **Patients** | **Y=1**   |  
  | 0.2           | 500     | 100      |  
  | 0.4           | 200     | 80       |  
  | 0.6           | 200     | 120      |  
  | 0.8           | 100     | 80       |  
  | **Total**     | 1,000   | 300      |  

  | **Group B (Base rate = 0.15)** |         |          |  
  |-------------------------------|---------|----------|  
  | **Score (s)** | **Patients** | **Y=1**   |  
  | 0.2           | 750     | 150      |  
  | 0.4           | 100     | 40       |  
  | 0.6           | 100     | 60       |  
  | 0.8           | 50      | 40       |  
  | **Total**     | 1,000   | 150      |  

  **Flagging (Threshold = 0.50)**  
  Flagged: All patients with score ≥ 0.60 (i.e., score = 0.6 or 0.8).  

  - **Group A Flagged**:  
    - Patients: 200 (s=0.6) + 100 (s=0.8) = 300  
    - Y=1: 120 + 80 = 200  
    - Y=0: 80 (s=0.6) + 20 (s=0.8) = 100  
  - **Group B Flagged**:  
    - Patients: 100 (s=0.6) + 50 (s=0.8) = 150  
    - Y=1: 60 + 40 = 100  
    - Y=0: 40 (s=0.6) + 10 (s=0.8) = 50  

  **Metrics Comparison**  
  - **TPR (Sensitivity)**:  
    - A: 200 / 300 = 0.6667  
    - B: 100 / 150 = 0.6667 (exactly equal)  
  - **FPR (1 - Specificity)**:  
    - A: Non-events = 1,000 - 300 = 700; FPR = 100 / 700 ≈ 0.1429  
    - B: Non-events = 1,000 - 150 = 850; FPR = 50 / 850 ≈ 0.0588  
  - **FPR Gap**:  
    - FPR_B (0.0588) < FPR_A (0.1429) → B has **lower** FPR.  

  **Punchline: To Achieve Higher FPR in B, Lower Threshold to 0.40**  
  *Threshold adjusted to 0.40 for both groups (still same value). Flagged: Score ≥ 0.40 (s=0.4, 0.6, 0.8).*  

  - **Group A Flagged**:  
    - Patients: 200 (s=0.4) + 200 (s=0.6) + 100 (s=0.8) = 500  
    - Y=1: 80 + 120 + 80 = 280  
    - Y=0: 120 (s=0.4) + 80 (s=0.6) + 20 (s=0.8) = 220  
  - **Group B Flagged**:  
    - Patients: 100 (s=0.4) + 100 (s=0.6) + 50 (s=0.8) = 250  
    - Y=1: 40 + 60 + 40 = 140  
    - Y=0: 60 (s=0.4) + 40 (s=0.6) + 10 (s=0.8) = 110  

  **Metrics at Threshold=0.40**  
  - **TPR**:  
    - A: 280 / 300 ≈ 0.9333  
    - B: 140 / 150 ≈ 0.9333 (equal)  
  - **FPR**:  
    - A: 220 / 700 ≈ 0.3143  
    - B: 110 / 850 ≈ 0.1294  
  - **FPR Gap**:  
    - FPR_B (0.1294) < FPR_A (0.3143) → Still **lower** in B.  

  **Conclusion from Attempts**  
  Under calibration within groups and a fixed threshold, it is **impossible** to have equal TPR and strictly higher FPR in the lower base rate group (B). The mathematical barrier:  
  - Calibration and lower base rate force B’s score distribution leftward.  
  - To achieve equal TPR at the same threshold, B must have a similar density of events above the threshold, but its lower base rate requires fewer high-risk patients, reducing FPR.  

  **Raj’s Strongest Objection & Reply**  
  - **Objection**: "You built a worse score for B! The score must be uninformative or miscalibrated to get your result."  
  - **Reply**: Raj is **partly right**: Calibration + fixed threshold + equal TPR + lower base rate **inherently** produce lower FPR in B. The score is informative (AUC > 0.7; PPV > base rate), but the setting constrains FPR. If you demand equal TPR at the same threshold, FPR will always be lower in the lower base rate group, exposing a fundamental trade-off.  

  **Recommendation for Committee**  
  Focus on clinical utility: If equal TPR is essential, expect higher FPR in higher base rate groups. To reduce FPR in low base rate groups, consider group-specific thresholds or cost-sensitive thresholds that account for base rates.  

