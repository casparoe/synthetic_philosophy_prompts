  I should identify key objections each member might raise. For the decision theorist, they might argue that the whole issue stems from using EU, making modal scarcity unnecessary. The ethicist might worry that modal scarcity discounts future risks. The formal epistemologist could question the computability of anchored probabilities.

  Next, I need to ensure objections are distinct yet cover overlapping concerns. For example, the decision theorist and formal epistemologist might both see modal scarcity as vague, but from different angles—one as a framework issue, the other as a technical flaw. The ethicist's concern about discounting might overlap with the decision theorist's point if anchored probabilities are seen as arbitrary.

