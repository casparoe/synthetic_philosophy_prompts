prompt: |-
  I have just come out of a four-hour argument about reasons with a friend who is a far harder-headed internalist than I am, and she landed one objection I could not answer, so I need help before next week.

  On Tuesday I defend the third chapter of my dissertation in a two-hour committee meeting. The chapter proposes a version of externalism I call role-anchored. Roughly: internalism is right about bare reasons, the reasons an agent has simply in virtue of the aims, projects and cares she actually has, and wrong about role reasons, the reasons attached to an office or relationship the agent occupies: parent, judge, trustee, promisee, citizen, colleague. Those hold whether or not she cares about them. The further claim, and the one I actually care about, is that internalism's real insight is a voluntariness condition that it attaches to the wrong moment. Internalists say a consideration is a reason for me only if I could reach it by correct deliberation from what I already care about. I say the condition does its work at uptake instead: what makes the demands of a role genuinely normative for me is that I could have refused the role, or that its central demands were foreseeable when I took it up. That relocation is also meant to explain why the hard cases in the literature are hard: the brutal agent, the addict who wants the drug and does not want to want it, the person flattened by depression. Those are bare-agent cases, and the intuition that someone has a reason he cannot see returns with full force the moment you give him a role.

  My friend's objection, which I think is close to fatal, is a collapse argument: if voluntariness does the work, then roles nobody chose — being someone's child, being born a citizen, becoming a parent by accident — generate no reasons at all; and where the agent does identify with her role, saying she has reason to do what it requires is just describing an internal reason with a wide motivational set, while where she does not, it is a sociological remark about how often people identify with their roles. Either way, she says, role-anchored externalism is internalism with extra furniture.

  The committee is four people. My supervisor is a constructivist about practical reasons who thinks Humean pictures are the enemy and will want to know whether my uptake move is constructivism about institutional normativity and whether a role's content is fixed by the agent's will or by social practice. The second reader is an internalist in the Williams line, who thinks the whole disagreement turns on what relation reasons must bear to an agent's motivational states, and who will ask whether my could-have-refused condition is a motivational fact in disguise. The third reader doubts that reasons are the primitive normative unit at all — she thinks reasons-talk is derivative from value or from what one ought to do — and will ask whether the dispute is verbal. A visitor who works on practical rationality with an eye to empirical psychology will ask what my view predicts about actual deliberation and how anyone could tell.

  What I want is a prep sheet: the eight or so objections I will actually get, in the order they will come, each phrased the way that person would phrase it, ordered by how much damage it would do if I could not answer it, with a note on how likely each is. For each, a reply I can give in about ninety seconds and an honest note on where the reply is soft. Include the objection I am hoping nobody raises — I think it is whether role-anchored externalism entails that the camp guard, or the accountant for a criminal firm, has reason to do his job well, but tell me if there is a worse one and what to say if it comes. Where the honest answer is that my view has no reply yet, say that rather than manufacturing one. And give me no citations, no named papers, no reading list: I want arguments, not authorities.

  Finally, and this matters as much as the rest: for each reply, mark whether it rests on something that is common ground among people who work on reasons or on a claim that is live-contested, and where it is contested, say what the alternatives are and whether mine is a minority position. Tell me plainly which of my premises are load-bearing and disputed, so that I do not walk in presenting a contested view as the state of the question.
reasoning: |-
  Okay, let me start by understanding the user's situation. They just had a tough argument with a friend who's a hard internalist, and now they're prepping for their dissertation defense. The third chapter proposes "role-anchored externalism," which distinguishes between bare reasons (internal) and role reasons (external). The key move is relocating the voluntariness condition to uptake—reasons from roles are binding if you could have refused or foreseen the demands.

  The friend's collapse argument is the main worry: if voluntariness is key, unchosen roles (like being a child or accidental parent) might not generate reasons. Also, if someone identifies with the role, it's just internalism with extra steps; if not, it's merely sociological. The user needs a prep sheet for their committee, anticipating objections and crafting concise replies.

  Now, assessing the committee members: the supervisor is a constructivist anti-Humean, concerned about whether role content is determined by will or social practice. The second reader is a Williams-style internalist, questioning if the "could-have-refused" condition is motivational. The third reader doubts reasons as primitive, wondering if the dispute is verbal. The visitor from empirical psychology will ask about real-world deliberation predictions.

  The user wants eight objections ordered by damage potential, likelihood, and committee member alignment. Each needs a 90-second reply, noting weaknesses, contested points, and load-bearing premises. They also want the worst unraised objection addressed—like the camp guard problem—and honesty where the view has no answer yet.

  First, I need to outline the most damaging objections. The collapse argument is top—it challenges the core distinction. Then, the constructivist's question about content origin, as it ties into normativity sources. The internalist's motivational disguise concern follows closely. The verbal dispute and empirical predictions come next. The camp guard objection is critical but maybe less likely; if raised, it could be damaging.

  For each objection, crafting replies that are concise. For the collapse, emphasize foreseeability and social recognition as making voluntariness non-binary. But admit that unchosen roles are a soft spot. This is contested, as internalists demand stronger voluntariness. The constructivist's objection: reply that content is socially fixed, but uptake makes it normative. However, the origin of normativity is debated—social practices vs. individual acceptance. The internalist's point: argue that "could have refused" is about opportunity, not motivation. But the line between structural and motivational is fuzzy. 

  The verbal dispute objection: clarify that the debate is about the structure of normativity, not terminology. But conceding that bare/role might not be fundamental. For empirical psychology, focus on role salience in deliberation, though predictive weakness is a flaw. 

  The camp guard case: deny that roles generate reasons when they require immorality, appealing to overriding moral norms. But this introduces a new layer—how morality interacts with roles—which isn't fully developed. 

  Other objections might include whether role reasons are reducible to internal reasons, or if voluntariness can be hypothetical. The foreseeability point helps here, but accident cases remain problematic. Also, the third reader might ask if roles create reasons or just duties, questioning the reasons-primacy. Reply by separating conceptual roles, but admit it's a live debate. 

  Load-bearing premises: voluntariness at uptake (not deliberation), foreseeability as sufficient, role content fixed socially, moral norms overriding role demands. These are all contested. Voluntariness is especially critical—internalists require current motivational access, whereas here it's historical. The foreseeability standard is a minority view; stricter voluntarists require actual consent. 

  Honesty about gaps: unchosen roles need more work, and the moral override isn't detailed. The camp guard reply might feel ad hoc without a principled distinction. 

  Prioritizing objections: collapse first (supervisor/internalist), then content origin (supervisor), motivational disguise (second reader), verbal dispute (third reader), empirical (visitor). The camp guard is the nightmare scenario—address it head-on if raised, but hope it doesn't come up. 

  In replies, mark common ground vs. contested points. For example, the role of social practices in fixing duties is accepted, but whether that generates reasons is disputed. The voluntariness relocation is entirely contested—internalists reject it. 

  Need to ensure the user doesn't present contested premises as consensus. Highlight where their view is minority (e.g., foreseeability over consent) and where it's more accepted (social role content). 

  Finally, the unraised objection: beyond camp guard, maybe whether role reasons persist after resignation (e.g., ex-parent obligations). But camp guard is more pressing. Reply by distinguishing role activation, but that's underdeveloped.
answer: |-
  Here's your prep sheet, structured for maximum defense utility. Objections are ordered by **damage potential** (highest first), with likelihood, source, reply, soft spots, and normative contestedness flagged. Load-bearing/disputed premises are explicitly called out.

  ---

  ### **Objection 1: The Collapse Argument (Your Friend's)**  
  *(Most damaging; likely from Supervisor or Second Reader)*  
  **Phrasing:** "If voluntariness at uptake is necessary for role reasons, then unchosen roles (child, accidental parent, citizen-by-birth) generate no genuine reasons. If agents *do* identify with these roles, your 'role reasons' are just internal reasons in disguise. If they don’t, you’re describing social pressure, not normativity. Either way, this is internalism with decorative jargon."  
  **Reply (90s):** "Voluntariness isn’t all-or-nothing. For unchosen roles, *foreseeability of core demands* anchors normativity (e.g., knowing parenting involves sacrifice). We don’t choose birth citizenship, but we can later affirm/reject it (e.g., renouncing citizenship). Where identification occurs, it’s a *response* to the role’s independent reasons—not their source. Internalism cannot capture the *bindingness* of unchosen roles we intuitively recognize (e.g., adult children caring for abusive parents)."  
  **Soft Spot:** Foreseeability in accidental roles (e.g., unplanned parenthood) is strained. "Later affirmation" risks circularity.  
  **Contested?** **YES.** Voluntariness-as-foreseeability is a minority view (internalists demand stronger agential connection). Common ground: roles *feel* binding; dispute is *why*.  
  **Load-Bearing Premises:** (1) Foreseeability suffices for voluntariness; (2) Role reasons exist independently of current motivation. *(Both hotly contested)*  

  ---

  ### **Objection 2: Is This Just Constructivism About Roles?**  
  *(High damage; Supervisor)*  
  **Phrasing:** "You say role content is fixed socially, but normativity comes from uptake. Isn’t this constructivism—agents ‘making’ reasons by willing roles? If so, why isn’t the *content* also constructed by the agent? If not, how do social facts create *normativity* without voluntariness?"  
  **Reply (90s):** "Social practices fix role *content* (e.g., what a ‘judge’ ought to do), but voluntariness at uptake makes that content *reasons-for-me*. This isn’t constructivism because reasons aren’t *made* by the agent; they’re *activated* by her voluntary role-assumption. The normativity is relational: *given* this social role, its demands bind *if* you voluntarily occupy it."  
  **Soft Spot:** Blurs line between "activation" and "creation." Social practices lack inherent normativity.  
  **Contested?** **YES.** Whether social facts + voluntariness can generate normativity is disputed. Internalists deny this; realists say normativity is mind-independent.  

  ---

  ### **Objection 3: Is "Could Have Refused" a Hidden Motivational Fact?**  
  *(High damage; Second Reader)*  
  **Phrasing:** "Your ‘could have refused’ condition sounds structural, but isn’t it just about *possible* motivation? If an agent couldn’t refuse because she’s psychologically incapable (e.g., indoctrinated), does the role still bind? If ‘could’ requires psychological capacity, this collapses to internalism."  
  **Reply (90s):** "‘Could have refused’ is about *objective opportunity*, not psychological capacity. A conscripted soldier has role reasons even if he’s patriotic; what matters is whether refusal was institutionally/socially possible (e.g., draft evasion). Internalism focuses on *current* motivational access; I focus on *historical* structural freedom."  
  **Soft Spot:** "Objective opportunity" is vague (economic pressure? social stigma?). Hard cases (e.g., lifelong indoctrination) undermine it.  
  **Contested?** **YES.** Internalists see "objective opportunity" as irrelevant without motivational traction.  

  ---

  ### **Objection 4: Is This Merely a Verbal Dispute About "Reasons"?**  
  *(Medium damage; Third Reader)*  
  **Phrasing:** "You grant internalism about ‘bare reasons’ but insist role reasons are distinct. But if ‘reasons’ just mean ‘considerations counting in favor of action,’ why can’t internalists say roles provide reasons *iff* the agent cares about them? Isn’t your ‘externalism’ just relabeling what internalists call ‘motivational sets’?"  
  **Reply (90s):** "The dispute is substantive: whether role demands give agents *genuine normative claims* independent of their current cares. For internalists, a judge who stops caring about justice has *no reason* to be impartial. I say she still does—the role’s demands persist. This isn’t verbal; it’s about the *source* of normativity for social identities."  
  **Soft Spot:** If the third reader is skeptical about reasons-primitivism, this won’t land.  
  **Contested?** **YES.** Whether "normative claims" can exist independently of agents’ subjective states is the core dispute.  

  ---

  ### **Objection 5: How Does This Predict/Explain Actual Deliberation?**  
  *(Medium damage; Visitor)*  
  **Phrasing:** "Empirically, people deliberate based on felt motivations. Your view says role reasons exist independently—but if agents don’t recognize them, how would we detect these ‘reasons’? What does your theory predict about when people *feel* bound by roles?"  
  **Reply (90s):** "It predicts that role salience in deliberation correlates with *uptake awareness* (e.g., a judge reminded of her oath feels bound). We detect role reasons via agents’ *retrospective justifications* (e.g., ‘I had to do it as a parent’). Unlike internalism, it explains guilt/shame in failing role demands *despite* lacking motivation (e.g., a neglectful trustee)."  
  **Soft Spot:** Fails to predict when uptake awareness *fails* (e.g., why some feel bound by unchosen roles). Light on empirical evidence.  

  ---

  ### **Objection 6: Doesn’t This Just Reduce Role Reasons to Internal Reasons?**  
  *(Medium damage; Second Reader)*  
  **Phrasing:** "If an agent *accepts* a role voluntarily, her role reasons are just internal reasons (she’s motivated by ‘being a good parent’). If she doesn’t accept it, she has no reasons. Where’s the *externalism*?"  
  **Reply (90s):** "Acceptance is not motivation. One can accept a role (e.g., citizenship) while being unmotivated by its demands (e.g., voting). Role reasons exist *prior* to acceptance; acceptance is the condition for their *application*. Internalism cannot explain why we criticize people who *ignore* role demands they accepted but don’t care about."  
  **Soft Spot:** Risk of equivocating "acceptance" (cognitive vs. motivational).  

  ---

  ### **Objection 7: The "Camp Guard" Problem**  
  *(High damage if raised; your nightmare scenario)*  
  **Phrasing:** "If roles generate reasons independently of morality, does a Nazi camp guard have a role reason to kill efficiently? If not, how do you block this without smuggling in morality?"  
  **Reply (90s):** **"No.** Role reasons are *pro tanto* and can be overridden by moral norms. Immoral roles (e.g., ‘death camp guard’) lack *genuine normativity* because their core demands violate fundamental moral constraints. My view assumes a background morality that filters illegitimate roles."  
  **Soft Spot:** **Ad hoc.** Requires an independent moral theory you haven’t supplied. Contradicts your "social practices fix content" claim.  
  **Load-Bearing Premise:** Roles must be morally permissible to generate reasons. *(Highly contested; metaethically loaded)*  

  ---

  ### **Objection 8: Why Privilege "Uptake" Over Continuous Voluntariness?**  
  *(Low damage; Supervisor/Second Reader)*  
  **Phrasing:** "If voluntariness matters, why only at uptake? Roles evolve, and agents can lose identification. If a judge stops caring about her role, why does she still have reasons? Shouldn’t voluntariness be continuous?"  
  **Reply (90s):** "Uptake creates a *commitment* that persists unless the role is formally relinquished (e.g., resigning). Continuous voluntariness would collapse into internalism. Stability in role reasons enables social coordination (e.g., we rely on judges to act judicially *even during burnout*)."  
  **Soft Spot:** Doesn’t resolve cases where roles change unpredictably post-uptake.  

  ---

  ### **Strategic Summary**  
  - **Most Dangerous:** Collapse argument (Objection 1). If forced to concede, fall back to: "This shows my view needs refinement on unchosen roles, not that it fails for chosen ones."  
  - **Weakest Reply:** Camp guard (Objection 7). Honestly note: "I need a principled distinction between morally acceptable/abhorrent roles; currently, this relies on a background moral realism."  
  - **Key Contested Premises:**  
    - Voluntariness-as-foreseeability (minority).  
    - Social roles + uptake → normativity (disputed).  
    - Moral constraints on role validity (unavoidably contested).  
  - **Common Ground Exploited:** Intuitions about role-bindingness (e.g., judges/parents have duties beyond their feelings).  

  **Final Tip:** When pressed, distinguish: "I’m offering a *relational* externalism: reasons arise from roles *in relation to* agents’ voluntary uptake. This isn’t internalism because the reasons aren’t *grounded in* the agent’s psychology." Stick to cases where internalism struggles (e.g., burnout, unchosen obligations). Good luck!
