prompt: |-
  I am a retired physical chemist — thirty years in industrial catalysis — and since retiring I have been sitting in on philosophy-adjacent discussion groups, and have now agreed to run one evening myself. Our library's Wednesday series draws about twenty-five people, mostly retired engineers, a physician, a lawyer, a high-school mathematics teacher, and one retired operations-research analyst who is sharp, friendly, and will tell me inside ten minutes that in a one-shot Prisoner's Dilemma defection strictly dominates. Last month another presenter did the iterated version and everyone left content that reciprocity and reputation explain cooperation there; my job is the harder case. I have ninety minutes, a whiteboard, and no way to assign reading in advance, so please do not hand me a bibliography or a list of essays — I cannot easily reach a university library, and in any case I want the plan, not the sources.

  The notion I have to teach is superrationality: the claim, associated with the popular-science essay that introduced the term, that two agents who are genuinely running the same reasoning procedure should treat their choices as correlated rather than independent, so that in a one-shot Prisoner's Dilemma — no repetition, no reputation, no communication, no enforcement — cooperation is nonetheless the rational output. Please do not explain the idea to me; I can follow the argument. Plan how I should explain it to that room. I want the order in which the components must be introduced and what depends on what: does the dominance argument have to be stated and fully conceded before the correlation move can even be heard, or does conceding it first hand the operations-research analyst the whole game? Does Newcomb's problem belong early as an intuition pump, late as a diagnostic, or nowhere? Where does the shift from choosing-as-one to choosing-as-one-of-a-kind have to be made explicit, and what has to be in place before it? I also want one case to carry the session, and I am uneasy with the standard stagings: a player facing an exact copy of themselves invites the response that this is just one person in two places, and the eccentric-benefactor-with-twenty-finalists version invites the response that it is a rigged parlor puzzle. I would rather build on two agents who are not literally the same agent and not guaranteed to reason identically — two independent implementations of the same published algorithm written by different teams, or two strangers each of whom has read and been convinced by the same argument. Tell me what such an example must contain and must lack if it is to bear the weight.

  There is one wrinkle I insist on including, because it is where I suspect the idea either survives or dies and I do not know which: a tremble. Let the other agent be an ordinary defection-bound reasoner with some small but non-negligible probability rather than a superrational one. What becomes of the superrational recommendation, at what point in the sequence should I introduce the perturbation, and is the honest answer that the prescription is discontinuous in that probability — which, if so, I would rather say out loud than paper over? I also want the misconception map with each item placed: that this is just the golden rule in mathematical costume; that it assumes some kind of causal leakage or telepathy between the agents; that it is refuted in advance as a variant of evidential reasoning; that it requires believing the other agent literally is you; and the subtler one, that it amounts only to cooperating when your estimate of the other's cooperativeness exceeds a payoff-derived threshold, which misses the dependence claim entirely. My mathematics teacher will want to say that symmetry means we both do the same thing and so we should simply pick the better of the two joint outcomes, and the operations-research analyst will say that this merely selects an equilibrium by stipulation; I would like to know which of them is closer to the truth and how to let that exchange happen in the room without losing the thread. Give me one question to end on that would show me the idea itself had landed rather than that people had been persuaded to be nicer, and tell me what I should openly decline to explain at this level. Finally, and this matters to me as a scientist who has sat through too many confident talkers: mark clearly for me, in the notes rather than on the board, which claims are settled — the payoff structure, dominance, the equilibrium facts — and which are live disputes among people who work on decision theory, such as whether superrationality is a genuine position distinct from the familiar causal and evidential approaches, whether it collapses into one of them or into reasoning as a group agent, and whether it is a normative claim at all; I do not want to present a contested view to that room as though it were the consensus.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're a retired physical chemist with a background in industrial catalysis, now leading a philosophy-adjacent discussion group. The group consists of educated professionals—engineers, a physician, lawyer, math teacher, and an operations research analyst. The user needs to explain superrationality in a one-shot Prisoner's Dilemma without prior readings, focusing on the core idea that identical reasoning leads to correlated choices.

  First, I need to recall what superrationality entails. It's the concept from Douglas Hofstadter where two rational agents, using the same reasoning process, should see their decisions as interdependent, leading to cooperation in PD. But the user already knows this; they need a teaching plan. Key challenges: dominance argument must be addressed without conceding too early, handling the skeptic (the operations research analyst), and introducing a "tremble" (probability the other defects).

  The user wants to avoid common examples like clones or benefactor games. Instead, they prefer independent agents using the same algorithm or convinced by the same argument. So, I need to craft an example that's robust yet doesn't invite objections about identity or rigged setups.

  The tremble is crucial. How does a small chance of facing a defector affect the superrational approach? The prescription might be discontinuous, which the user wants to address honestly. Also, misconceptions like mistaking it for the golden rule or evidential reasoning need clarification.

  Structure-wise, the session must flow logically. Start with PD payoffs and dominance to establish the problem. Then introduce the twist: what if both agents use identical reasoning? Use the algorithm example to show independence but same process. Highlight symmetry without identity. 

  Next, the correlation move: since both are running the same "program," their outputs are linked. Cooperation becomes the only consistent choice. This counters the dominance argument by reframing the decision space.

  Introduce the tremble carefully. With a small probability of facing a non-superrational player, the expected payoff calculation shifts. If the probability is high enough, defection might dominate again. This discontinuity should be openly discussed.

  Address misconceptions explicitly. Emphasize no causal links, not evidential decision theory, and not about group agency. The math teacher's symmetry point is close but must avoid equilibrium by stipulation.

  End with a diagnostic question to check understanding, like whether a superrational agent would cooperate if they knew the other was superrational but with a tremble. Avoid delving into decision theory debates; clarify settled vs. contested points in notes.
answer: |-
  Here's a structured 90-minute session plan designed for your audience, focusing on clarity, managing objections, and highlighting the core conceptual shift. It sequences ideas to build understanding while neutralizing early dominance objections and incorporating your "tremble" requirement.

  **Session Title:** Rationality Beyond Dominance? Cooperation in a One-Shot Prisoner's Dilemma

  **Core Goal:** Introduce the *concept* of superrationality as a distinct reasoning framework, not to convince everyone it's "correct," but to demonstrate its internal logic and the challenge it poses to standard dominance reasoning in symmetric, high-stakes coordination problems.

  **Key Principles:**
  1.  **Neutralize Dominance Early, But Don't Concede:** Acknowledge its power immediately, then isolate it as a specific *type* of reasoning that might not apply under specific assumptions.
  2.  **Build Symmetry Slowly:** Emphasize *reasoning identity*, not agent identity.
  3.  **Use Concrete, Robust Examples:** Avoid clones and rigged games.
  4.  **Be Transparent:** Mark settled math vs. philosophical disputes. Embrace the discontinuity of the tremble.
  5.  **Preempt Misconceptions:** Address them explicitly as they become relevant.
  6.  **Focus on the Reasoning Shift:** The move from independent to correlated choice is the core.

  **The Plan (90 mins):**

  1.  **Setting the Stage: The Stark Reality of One-Shot PD (15 mins)**
      *   **Whiteboard:** Draw the standard PD payoff matrix (R, R / S, T || T, S / P, P). Label actions (Cooperate, Defect) and players (Player A, Player B). Emphasize T > R > P > S and 2R > T+S.
      *   **Focus:** "This is the puzzle. No future, no talk, no enforcement. What should a purely rational, self-interested player do?"
      *   **Dominance Argument:** Walk through step-by-step. "Regardless of what *they* do, my *best* move is to Defect." Have the OR analyst confirm. Engineer nods likely. **Settle this step.**
      *   **The Outcome:** Mutual Defection (P, P). Highlight the tension: Both would prefer (R, R), but dominance drives them to (P, P). "This feels irrational collectively, but seems inescapable individually. Is it?"

  2.  **Introducing the Symmetry Constraint: "We're Using the Same Manual" (20 mins)**
      *   **The Twist:** "Imagine Player A and Player B know something crucial: *They are both using the exact same, publicly specified, step-by-step rational decision procedure to choose their action.* Think of it like this:
          *   **Example:** Both players have independently implemented the *same* published, unambiguous algorithm ("The Rationality Protocol v1.0") on their own hardware. OR analyst: "Think of two different companies using the same patented, deterministic OR algorithm for this decision." Mathematician: "Think of two instances of the same function being evaluated with the same inputs (the game structure and the knowledge about the other's reasoning)."
          *   **Crucial Features:**
              *   **Lacks:** Identical biology, telepathy, causal links, guarantee of identical outputs *before reasoning*. (Preempts "it's one person/telepathy").
              *   **Contains:** Identical input (game rules, payoffs), identical processing rules (the algorithm/argument), knowledge *that* the other is using the identical procedure.
      *   **Consequence:** "Because they start with the same inputs and run the same deterministic procedure, they *must* reach the same conclusion about what action to take." **This is the pivotal symmetry claim.** "The procedure outputs C or D. Same inputs + same rules = same output."
      *   **Misconception Address #1:** "This is NOT saying they *are* the same person. It's NOT telepathy. It's NOT magic. It's purely about the logical consequence of running identical deterministic reasoning on identical problem specifications. If you and I both correctly solve '2+2' using the same arithmetic rules, we both get '4'. It's that kind of identity – *procedural* identity." (Preempts causal leakage/telepathy/identity).

  3.  **The Correlation Move & The Superrational Choice (20 mins)**
      *   **Reframing the Choice:** "Given this symmetry, Player A *cannot* reason 'regardless of what B does'. Why? Because what B does is *logically tied* to what A does! They get the same output from the same process. If A's procedure outputs C, so does B's. If A's outputs D, so does B's."
      *   **The Effective Choice:** "So Player A isn't really choosing *an action* independently. Player A is choosing *which joint outcome* will happen: (C,C) or (D,D). The choice is between (R,R) and (P,P)."
      *   **The Recommendation:** "A purely self-interested rational player, knowing this symmetry, prefers (R,R) to (P,P). Therefore, the procedure *must* output Cooperate. The *only* consistent outcome is mutual cooperation."
      *   **Label it:** "This type of reasoning – anticipating that identical rational processes must produce identical decisions, and thus correlating the choices – is called **Superrationality**."
      *   **Misconception Address #2:** "This is NOT the Golden Rule (do unto others...). That's a moral principle. This is a *prudential* argument: Cooperation gets *me* a better payoff (R) than mutual defection (P), *given* the logical link created by shared reasoning." (Preempts golden rule).
      *   **Misconception Address #3:** "This is NOT simply picking the best equilibrium. The standard Nash equilibrium is (D,D). Superrationality argues that the shared reasoning *constraint* changes the game structure logically, making (C,C) the only feasible outcome for rational players under that constraint. It's not selecting an equilibrium; it's arguing the dominance reasoning *breaks down* under perfect procedural symmetry." (Preempts OR analyst / equilibrium selection objection).
      *   **Mathematician's Point:** "Yes, we both do the same thing. But *why* do we pick C over D? Because R > P. The symmetry forces us into a coordination game on the diagonal, and C is the Pareto-superior choice. The dominance argument, which relies on treating the other's choice as independent, becomes invalid under the symmetry constraint." (This validates the mathematician's symmetry intuition but grounds the *choice* of C in self-interest within the constrained options).

  4.  **Introducing the Tremble: Realism and Discontinuity (15 mins)**
      *   **The Wrinkle:** "But what if there's a hitch? What if Player A knows there's a small probability, say ε (e.g., 1%), that Player B is *not* using the Superrational procedure? Maybe B glitched, misunderstood, or is just a standard dominance reasoner."
      *   **Analysis:** "Player A must now consider *three* possible scenarios for B:
          1.  B is Superrational (Prob = 1-ε) → Matches A's action (C or D).
          2.  B Defects no matter what (Prob = ε) → Always D.
      *   **A's Expected Payoff:**
          *   If A Cooperates:
              *   Pays R if B is Superrational (Prob 1-ε) → B also Cooperates.
              *   Pays S if B is Defector (Prob ε) → B Defects.
              *   **Expected Payoff (C):** (1-ε)*R + ε*S
          *   If A Defects:
              *   Pays P if B is Superrational (Prob 1-ε) → B also Defects.
              *   Pays T if B is Defector (Prob ε) → B Defects (A still gets T!).
              *   **Expected Payoff (D):** (1-ε)*P + ε*T
      *   **The Discontinuity:** Compare `(1-ε)R + εS` vs. `(1-ε)P + εT`.
          *   As ε -> 0 (perfect superrational partner), (C) -> R, (D) -> P. R > P, so Cooperate is best.
          *   But for ε > 0, look at the difference: `[ (1-ε)R + εS ] - [ (1-ε)P + εT ] = (1-ε)(R-P) + ε(S-T)`
          *   Since R-P > 0 and S-T < 0, this difference decreases as ε increases.
          *   **There exists a critical ε_crit > 0** where the difference becomes negative. Solve `(1-ε)(R-P) + ε(S-T) < 0` for ε. For standard payoffs (T=5, R=3, P=1, S=0), ε_crit = (R-P)/( (R-P) + (T-S) ) = 2/(2+5) ≈ 28.6%.
      *   **Honest Conclusion:** "The superrational prescription is **highly sensitive to the tremble**. If you are *absolutely certain* (ε=0) the other is superrational, cooperation is prescribed. But if there's *any* non-zero doubt (ε > 0), the standard dominance logic starts to creep back in. If the doubt (ε) is large enough (exceeding ε_crit), defection becomes the rational choice *even if you believe in superrationality*. The recommendation **jumps discontinuously** from Cooperate to Defect at ε_crit." **Emphasize this starkly.** This is where the idea survives or dies for many – it's fragile to uncertainty.

  5.  **Tying Up Misconceptions & The Nature of the Claim (10 mins)**
      *   **Misconception Address #4:** "Is this Evidential Decision Theory (EDT)? EDT says choose actions that are good *evidence* of desired outcomes. Superrationality doesn't rely on evidence *causing* the outcome. It relies on a *logical deduction*: Identical inputs + identical process = identical output. The correlation is necessary, not just evidential. However, critics *argue* superrationality either collapses into EDT or is an illegitimate form of reasoning. **This is contested.**" (Preempts "just EDT" / marks dispute).
      *   **Misconception Address #5:** "Is this reasoning *as a group*? Not quite. Each agent is still reasoning from their own self-interest: 'Given we *must* coordinate on the same action, which action gives *me* the best payoff?' They aren't aggregating preferences or aiming for a group optimum per se; they are recognizing a logical constraint that changes their individual calculation." (Preempts group agency).
      *   **The Status of Superrationality:** "Is superrationality a *normative* theory telling you what you *should* do? Its proponents think so, under conditions of known identical reasoning. Critics argue it's incoherent, collapses into existing theories, or is only applicable in bizarrely idealized scenarios like facing a clone. **There is no consensus.** It remains a provocative challenge to the universality of dominance reasoning in symmetric interactions."

  6.  **The Diagnostic Closing Question (5 mins)**
      *   **Question:** "Imagine you are Player A in our scenario. You are committed to the superrational reasoning procedure. You know Player B has also committed to using the *exact same* superrational reasoning procedure. *However*, you also know there's a 10% chance (ε = 0.1) that Player B's implementation malfunctioned and will simply Defect no matter what (like a rock). Based *only* on maximizing your own expected payoff using the superrational logic we've discussed, should your procedure output Cooperate or Defect? (Assume standard payoffs: T=5, R=3, P=1, S=0)"
      *   **Why this works:** It forces them to apply the core concepts: the logic of identical reasoning leading to correlated choices (hence the scenarios) *and* integrate the tremble calculation. A correct answer (Calculate `E(C) = 0.9*3 + 0.1*0 = 2.7`; `E(D) = 0.9*1 + 0.1*5 = 0.9 + 0.5 = 1.4`; 2.7 > 1.4, so Cooperate) shows they grasped the combined model. An answer ignoring the tremble or reverting to pure dominance misses key elements.

  7.  **Openly Decline to Explain (Mention Early & Reiterate)**
      *   The full formal details of competing decision theories (Causal vs. Evidential).
      *   Deep dives into the philosophical literature on collective agency or acausal decision theory.
      *   Resolving whether superrationality is "truly" distinct or just a variant – present it as a claimed distinct position and note the dispute.
      *   Detailed game-theoretic proofs of equilibrium concepts beyond the basic PD. Focus on the core logical argument.

  **Notes for You (The Settled vs. Contested):**

  *   **Settled (Math/Logic):**
      *   The PD payoff structure (T>R>P>S, 2R>T+S).
      *   The dominance argument for Defection *under the assumption of independent choice*.
      *   (D,D) is the unique Nash Equilibrium in the standard one-shot PD.
      *   The mathematical calculation of expected payoffs under the tremble model.
      *   The existence of ε_crit where the recommendation flips (discontinuity).
      *   The logical deduction that identical deterministic inputs + process → identical output.
  *   **Contested (Philosophy/Decision Theory):**
      *   **Whether superrationality is a valid/normative decision principle.** Critics say it's incoherent, irrational, or reducible. Proponents (like Hofstadter) argue it's a higher form of rationality for symmetric contexts.
      *   **Whether superrationality is distinct from Evidential Decision Theory (EDT).** Proponents argue the logical necessity of correlation makes it different from mere evidential correlation. Critics argue it *is* just EDT or suffers from similar problems (like fatalism).
      *   **Whether it requires "magical" thinking or illegitimate correlation.** Proponents argue it's pure logic applied to a specific constraint. Critics argue it smuggles in acausal influence or collective agency.
      *   **Whether the "identical reasoning" assumption is ever realistic or meaningful.** Is it just a philosopher's toy?
      *   **How to handle uncertainty about the other's reasoning (beyond the simple tremble).** The tremble model is simplistic; broader uncertainty is complex and contested.

  **Managing the Room:**

  *   **OR Analyst:** Acknowledge their dominance point upfront as the standard view. Frame superrationality as a challenge: "Given this *additional constraint* of known identical reasoning, does dominance still hold? Let's see the argument." Use their expertise on algorithms. The tremble section is where their calculation skills shine.
  *   **Mathematician:** Validate their symmetry insight. Emphasize the *necessity* of the same output given same inputs/process. Use the function analogy. Clarify why picking C isn't arbitrary but payoff-driven within the constrained choice set.
  *   **General:** Encourage questions but gently steer towards the core sequence. Use the whiteboard relentlessly for payoffs, scenarios, and tremble calculations. Be transparent: "This is a contested idea, but here's its internal logic. What do you make of this challenge to dominance?"

  This plan respects your expertise, your audience's intelligence, your constraints, and your specific requirements (tremble, misconceptions, example robustness, diagnostic question, settled/contested clarity). It builds the superrational argument step-by-step on the foundation of acknowledging dominance, making the crucial symmetry/correlation move explicit, and rigorously testing it with the tremble. Good luck!
