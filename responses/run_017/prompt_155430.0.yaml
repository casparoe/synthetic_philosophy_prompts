prompt: |-
  So I got talked onto the state's clemency advisory panel — I write novels, mostly about people who wreck their own lives on purpose, somebody decided a "narrative person" would be useful, and now I'm the one who has to circulate the memo before Thursday. Help?

  Here's the case. Petitioner D.W.: armed robbery at nineteen, twenty-eight years in, no disciplinary write-ups in the last eleven. His personal statement is unlike anything else we've recieved. It's written almost entirely in what I'd call the alibi voice — "I never stood a chance," "by the time I knew what was happening it was already happening." No excuses offered, no redemption claimed either; just a chain of events in which he appears only as the thing it happened to. Two of us read it as the most honest document in the file. Two read it as a refusal of responsibility, and one of them has drafted a proposed new rule: every petitioner must add a "counterfactual paragraph," saying what they'd have done differently in that same situation, on the theory that being unable to picture yourself doing otherwise just *is* failing to own what you did.

  I'm uneasy and I want the memo to say why, in a form the panel can actually vote on. My worry has two halves. First, I make a living manufacturing the alibi voice: give me a character and three hundred pages and I can make a reader certain she had no choice, and that proves nothing whatsoever about whether she did. Fluency in fatalism is a craft skill, and it's the wrong thing to be grading. Second, the counterfactual paragraph is a genre requirement — it rewards petitioners who've been coached in the redemptive arc (the prison writing program, a good lawyer, a college class) and punishes the inarticulate, which tracks race and schooling pretty exactly. But I also can't shake the mirror image: the "changed man" statement, where the petitioner says the person who did it wasn't really him, feels like the opposite dodge — denying the situation instead of denying the freedom. One member, who read a bit of Sartre in college, keeps using the phrase "bad faith" for both, which I think is right but not yet useful.

  What I need: a memo recommending (1) a decision on D.W. — grant, defer, or grant with conditions, with a timeline — and (2) a standing rule for how we read these statements, with criteria a reviewer could apply in twenty minutes. Treat the strongest version of the counterfactual requirement seriously rather than knocking it down easy: there's a real thought that remorse without "I could have done otherwise" isn't remorse at all, and victims' families are owed that acknowledgement.

  Last thing, since I'm the one who'll be defending it out loud: keep a clear line between what's settled and what people who actually work on this disagree about. If the strong line — that we're radically free and that appeals to upbringing or addiction are always a kind of self-deception — is one contested position among several and not the consensus, say that plainly in the memo instead of building the recommendation on it like bedrock. I'd rather hand in something that survives being challenged than something that sounds decisive. And no citations or footnotes, I can't look anything up and I'd strip them out anyway. thx
reasoning: |-
  Okay, the user is on a clemency advisory panel and needs help drafting a memo about a case. They're a novelist who got roped into this because of their narrative expertise. The main issue is how to handle petitioner D.W.'s personal statement, which uses what the user calls the "alibi voice" - framing his crime as something that happened to him rather than a choice he made. 

  The panel is divided: half see it as honest, half see it as avoiding responsibility. One member even proposes requiring all petitioners to write a "counterfactual paragraph" imagining what they could've done differently. The user is uneasy about this for two reasons: (1) as a writer, they know crafting fatalistic narratives is a skill that doesn't prove anything about actual responsibility, and (2) the requirement would unfairly disadvantage less articulate petitioners who haven't been coached in redemption narratives.

  I need to help them draft a memo that addresses both D.W.'s specific case and establishes fair guidelines for evaluating future statements. The user wants something that holds up under scrutiny - not pretending philosophical debates about free will are settled, but acknowledging disagreements while still providing workable criteria.

  For D.W., the facts seem to favor clemency: 28 years served with 11 years clean conduct. The "alibi voice" is problematic but shouldn't override his demonstrated rehabilitation. Granting with conditions like transitional housing seems appropriate.

  For the broader rule, the counterfactual requirement is too flawed to implement. Instead, we should focus on behavioral evidence of change (like D.W.'s clean record) rather than linguistic performance. The memo should explicitly state that we're not taking sides in the free will debate - just acknowledging that in a practical legal context, we have to evaluate people based on observable rehabilitation.

  The tone needs to be collaborative - "we recommend" not "I say" - since it's a panel decision. And no academic citations since the user wants it accessible. The key is balancing philosophical nuance with actionable guidance that doesn't penalize inarticulate petitioners.
answer: |-
  Here’s a draft memo addressing both the D.W. decision and the broader policy question. It’s structured for clarity, defensibility, and practical application, while acknowledging contested philosophical grounds:

  ---

  **MEMORANDUM**  
  **TO:** State Clemency Advisory Panel  
  **FROM:** [Your Name], Panel Member  
  **DATE:** [Current Date]  
  **SUBJECT:** Recommendation on D.W. Petition & Framework for Evaluating Personal Statements  

  ### I. RECOMMENDED ACTION: PETITIONER D.W.  
  - **Decision:** Grant clemency with conditions.  
  - **Timeline:** Release within 90 days pending transitional plan approval.  
  - **Conditions:**  
    - 12 months in transitional housing with curfew/reporting.  
    - Mandatory employment or vocational program enrollment.  
    - 6 months of cognitive-behavioral therapy (CBT) focused on agency/decision-making.  
    - Revocation for any felony arrest or major program violation.  

  **Rationale:**  
  - **Behavioral Record:** 11 consecutive years without disciplinary issues demonstrates sustained institutional adjustment and risk reduction.  
  - **"Alibi Voice" Context:** While the personal statement avoids explicit accountability, it does not contradict DOC evidence of rehabilitation. Clemency hinges on conduct, not narrative fluency.  
  - **Risk Mitigation:** Conditions address agency development without demanding performative remorse.  

  ---

  ### II. PROPOSED STANDING RULE: EVALUATING PERSONAL STATEMENTS  
  **Recommendation:** *Reject the mandatory "counterfactual paragraph" requirement.*  
  **Adopt the following framework instead:**  

  #### A. **Core Principle**  
     Personal statements are **one non-determinative data point** in clemency review. They must be weighed alongside:  
     - Institutional conduct records (≥5 years preferred)  
     - Victim impact statements (if available)  
     - Rehabilitation evidence (program completion, skill acquisition)  
     - Expert assessments (psychological, risk)  

  #### B. **Evaluative Criteria for Statements (20-min. review)**  
  Assess statements for **indicators, not absolutes**, using this checklist:  
  1. **Consistency:** Does the statement align with documented behavior?  
     *(e.g., Claims of remorse supported by violence prevention coursework?)*  
  2. **Situational Awareness:** Does the petitioner acknowledge harm caused?  
     *(Avoids requiring specific phrases; "I hurt people" or "It damaged lives" suffices.)*  
  3. **Future Orientation:** Does the statement articulate a plausible, law-abiding plan?  
     *(e.g., "I’ll work in my brother’s garage," not abstract redemption.)*  
  4. **Red Flags:**  
     - Blaming victims/system exclusively without self-reference.  
     - Grandiose claims of "new identity" unsupported by conduct.  

  #### C. **Why No Counterfactual Mandate?**  
     - **Equity Concern:** Requires narrative skills disproportionately accessible via education/legal coaching, risking racial/class bias.  
     - **Practical Reality:** Many petitioners lack psychological tools to reconstruct past decisions. Forced counterfactuals may incentivize rehearsed fiction.  
     - **Philosophical Contention:** Whether true remorse requires "I could have done otherwise" **is debated** (see Section III). Clemency focuses on future risk, not metaphysical debates.  

  ---

  ### III. ACKNOWLEDGED PHILOSOPHICAL TENSIONS (For Panel Deliberation)  
  The panel disagrees on whether appeals to circumstance (e.g., upbringing, addiction) invalidate accountability. This memo **does not resolve** whether:  
  - Humans are "radically free" (rejecting circumstantial excuses), *or*  
  - Structural factors constrain agency (making counterfactuals unrealistic for some).  

  **Our pragmatic position:** Clemency is a forward-looking act of state mercy. We prioritize **documented behavioral change** because it is:  
  - Observable and measurable,  
  - Legally defensible,  
  - Inclusive of petitioners with limited narrative/educational resources.  

  ---

  ### IV. CONCLUSION  
  - **D.W.**: Grant clemency with conditions (Section I).  
  - **Policy**: Adopt the evaluative framework in Section II.B, rejecting mandatory counterfactuals. Statements are part of a holistic review centered on conduct.  

  **Vote Recommended:** Approve D.W.’s clemency and adopt the standing rule above.  

  --- 

  ### KEY DEFENSE POINTS  
  1. **Balances Accountability & Equity:** Conditions for D.W. address agency gaps; the framework avoids penalizing inarticulate petitioners.  
  2. **Grounds in Evidence:** Relies on prison conduct (objective) over subjective narrative analysis.  
  3. **Acknowledges but Sidesteps Philosophy:** Explicitly notes panel disagreements without embedding them in policy.  
  4. **Victim Consideration:** Harm acknowledgment is required (II.B.2), but counterfactuals aren’t the only valid form.  

  This memo provides a workable, defensible path forward without requiring consensus on free will. It prioritizes the state’s interest in rehabilitation and public safety.
