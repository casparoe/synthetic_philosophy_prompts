prompt: |-
  Hi — I work in the budget office of a mid-sized city school district, about 40 schools and roughly 22,000 kids. Every spring we hand out a discretionary fund, around $4 million, on top of the state formula money. Two years ago the school board put a line in the budget resolution saying (I'm paraphrasing, I don't have it in front of me) that any inequality in how the discretionary money gets distributed is acceptable only if it works to the greatest benefit of the least advantaged students. Someone on the board said that's basically lifted from Rawls. I took one political philosophy class years ago, so I remember the difference principle and the veil of ignorance in outline and not much else.

  What I actually need is a procedure, not a lecture. Five of us sit around a table for two or three two-hour meetings in April, we have a spreadsheet, and the superintendent signs off on whatever we hand her. Nobody on the committee has philosophy training, and two of them are principals who will absolutely advocate for their own buildings. So I want:

  1. A short, ordered set of questions or tests to run on each proposal, in the order they should be asked, with what counts as a real answer to each one and what counts as hand-waving. One guy on the committee says "but it helps everybody" about literally everything, and I need the procedure to have an answer to that specific move built into it.
  2. A way to settle, up front and using only the columns we actually have — test scores, free-and-reduced-lunch counts, English learner counts, a facilities condition score, teacher turnover, attendance — who the "least advantaged" group is for the purposes of the decision. I think there's a circularity here: you need the distribution to know who's at the bottom of it, and you need to know who's at the bottom to judge the distribution. Tell me how to break into that circle in a way five people can agree on in twenty minutes. Related: I vaguely remember something about representative people in positions rather than actual individual kids, and I can't tell whether that means we should be ranking schools, or ranking kids, or ranking some third thing that isn't either.
  3. What the veil-of-ignorance part is supposed to do in a room where everyone in it really does know which schools and which kids they're attached to. My suspicion is that we're meant to use it once, at the level of the rule we're following, rather than re-running it line item by line item, but I'm not sure, and I also don't know how much of our ordinary knowledge we're supposed to pretend not to have — obviously we shouldn't pretend not to know how poverty affects kids, but there's some line and I can't find it.
  4. Where the procedure just stops. The points where we should quit calculating and hand it to the superintendent or the board as a values call because the framework genuinely doesn't settle it.

  Constraints that I think might break the whole thing: the state formula money has to be equalized per pupil, so this discretionary fund is our only real lever; the fund can't pay recurring salaries, only things that fit inside one budget year, which seems like it should matter a lot for a principle that's supposedly about people's prospects over a whole life rather than about one April; and we can't construct anything like a proper basket of primary goods, we have the spreadsheet and thats it. Also anything we produce needs to fit on one page that can go on the wall of the conference room.

  Then please run it on three proposals that are floating around right now:

  - A literacy coach in each of the six highest-poverty elementary schools, paid for this year by a one-year foundation grant with no plan for year two.
  - A corporate donation that pays for new science labs at the two most affluent high schools, conditional on the same donor also funding a free summer STEM program for low-income middle schoolers for five years. We don't get either half unless we take both halves.
  - Closing a tiny K–8 school in the poorest neighborhood and busing those kids to a bigger, better-resourced school twenty minutes away. On every measure in the spreadsheet the kids who move come out ahead, but the neighborhood is going to be furious and I think something real is being lost that none of our columns see.

  I'd like at least one of those three to come out the way I don't want it to, and I want you to say plainly which one, and why I should accept the answer anyway. And tell me what the procedure is not able to do — the mistakes it will make every single year that I should just expect and stop fighting.

  Plain American English, please, nothing fancy, and please don't cite anything or give me a reading list — there's no library here and I'm not going to chase down references.
reasoning: |-
  Okay, the user works in a school district budget office and needs a practical procedure based on Rawls' difference principle to distribute discretionary funds. They have specific constraints: a committee without philosophy training, principals advocating for their schools, and limited data. They want a step-by-step process that's easy to follow, avoids circularity in defining "least advantaged," and handles real proposals.

  First, I need to recall Rawls' principles. The difference principle allows inequalities only if they benefit the least advantaged. The veil of ignorance asks decision-makers to choose rules without knowing their position. But in practice, the committee knows their affiliations, so the procedure must mitigate bias.

  The user's main pain points:
  1. A member claims every proposal "helps everybody" – need to counter that.
  2. Defining "least advantaged" with existing data (test scores, FRL, etc.) without circularity.
  3. How to apply the veil of ignorance practically when everyone knows their stakes.
  4. Knowing when to stop and hand decisions to higher-ups.

  For the procedure, start by pre-defining the least advantaged group using available metrics. Aggregate school data into a single disadvantage score. This avoids circularity by setting the group upfront. Use a weighted index with FRL, test scores, etc., as these are available indicators.

  Next, the step-by-step questions. First, identify who benefits. If it's not the least advantaged, reject unless there's a compelling case. Then, check if it actively harms them. After that, assess if it benefits everyone but especially the least advantaged. The key is to force specificity – "helps everybody" isn't enough; show how the least advantaged gain more.

  For the veil of ignorance, apply it to the rules, not each decision. Agree on the weighting and criteria beforehand, not during funding debates. This prevents biased arguments in the moment.

  The procedure stops when proposals don't clearly benefit the least advantaged or when harms are disproportionate. Also, when non-quantifiable factors like community impact arise, it's a values call for the superintendent or board.

  Now, the three proposals:
  1. Literacy coaches in high-poverty schools – direct benefit to the least advantaged. Even if temporary, it helps now. Approve.
  2. Science labs for affluent schools with a STEM program. The labs benefit the advantaged, while the STEM program helps the disadvantaged. The STEM program is the actual benefit, but labs might create inequality. Since the STEM program is substantial and multi-year, it might pass if the net gain for the least advantaged is clear. But it's borderline.
  3. Closing a small school. The kids benefit on measurable factors, but the community loss isn't captured. Need to flag this as a values decision since the framework can't measure intangible losses.

  The user wants one outcome they dislike. Proposal 3 might be rejected by the community despite passing the Rawls test on paper. They have to accept that the procedure focuses on measurable student impacts, not community sentiments.

  Limitations: The procedure can't capture non-quantifiable factors, might favor short-term gains, and could be gamed by packaging advantages with minor benefits. Also, defining "least advantaged" is imperfect but necessary.

  The one-pager should have clear steps, definitions, and examples. Keep it simple, action-oriented, with no jargon. The committee can follow it without philosophy training.
answer: |-
  Here's a practical, one-page procedure based on your board's Rawls-inspired rule. It's designed for your spreadsheet, time constraints, and real-world politics. Print this and put it on the wall:

  ---

  **DISCRETIONARY FUND DECISION PROCEDURE**  
  *(Based on Board Resolution: Inequalities must benefit the least advantaged)*

  ### Step 0: Define "Least Advantaged" Upfront (Do this FIRST, in 20 mins)
  - **What to do:** Combine your data columns into a single "Disadvantage Score" per school.  
  - **How:** Use this formula:  
    `(0.4 × % Free/Reduced Lunch) + (0.3 × % English Learners) + (0.2 × Low Test Scores*) + (0.1 × High Teacher Turnover)`  
    *\*Low Test Scores = % of students below state proficiency standard in math/ELA.*  
  - **Output:** Rank schools by this score. The **BOTTOM 20% of students** (by attending these schools) are your "least advantaged" group for ALL decisions.  
  - **Why this works:** It breaks the circle by locking the definition BEFORE discussing money. Weighting emphasizes poverty (FRL) and language barriers (EL) as primary disadvantages. Teacher turnover/test scores adjust for school quality.

  ### Step 1: The Core Questions (Ask in Order for Each Proposal)
  1. **"WHO DIRECTLY BENEFITS?"**  
     - **Real answer:** Names specific schools/groups USING YOUR "DISADVANTAGE SCORE" RANKING. Shows numbers (e.g., "Serves 200 kids at School X, which is in the bottom 10%").  
     - **Hand-waving:** "Kids everywhere," "The whole district," "It’s fair." **STOP HERE if no direct link to bottom 20%.**  

  2. **"DOES IT HARM THE LEAST ADVANTAGED?"**  
     - **Real answer:** "No, and here’s why..." or "Yes, but we offset it by..." (e.g., "Takes lab funds from poor schools? No—it’s new donor money.").  
     - **Hand-waving:** Ignoring trade-offs, pretending cuts aren’t real. **REJECT if harm isn’t fully offset.**  

  3. **"EVEN IF IT HELPS OTHERS, DOES IT HELP THE LEAST ADVANTAGED *MOST*?"**  
     - **Real answer:** Compares benefit SIZE for bottom 20% vs. others (e.g., "Summer STEM gives 100 hrs to disadvantaged kids; labs give 20 hrs to affluent kids").  
     - **Hand-waving:** "It helps everybody equally!" **Your answer to the "helps everybody" guy:** "Show us the data proving the LEAST advantaged get the BIGGEST boost. If not, it fails."  

  4. **"IS THE BENEFIT MEANINGFUL AND TIMELY?"**  
     - **Real answer:** Explains HOW it improves primary goods (e.g., "Literacy coaches boost reading skills (knowledge) and confidence (self-respect)").  
     - **Hand-waving:** Vague outcomes ("enhances school culture"). **REJECT if benefit is minor, distant, or speculative.**  

  ### Step 2: Apply the "Veil of Ignorance" (Do This ONCE, at the Start)
  - **What it means:** When approving the **PROCEDURE** (Step 0 formula and Step 1 questions), pretend you DON’T know which school you represent. Would you still agree these rules are fair?  
  - **What to ignore:** Your specific school, pet projects, political pressure.  
  - **What to keep:** General knowledge (poverty hurts learning, STEM skills matter).  
  - **Why:** It forces a fair framework upfront. You don’t re-do this for each item—just use the rules you agreed to behind the "veil."

  ### Step 3: Where to STOP
  Hand it to the Superintendent/Board when:  
  - The data is silent on harm/benefit (e.g., "community loss" in Proposal 3).  
  - Two proposals equally help the least advantaged (let leadership prioritize).  
  - A proposal passes the 4 tests but has major unquantified risks (e.g., high parent backlash).

  ### Applying the Procedure to Your Proposals
  **Proposal 1: Literacy Coaches in High-Poverty Schools**  
  - Step 1 Q1: **YES.** Directly targets 6 highest-poverty schools (bottom 20%).  
  - Q2: **NO HARM.** New grant money.  
  - Q3: **YES.** Only bottom 20% benefit.  
  - Q4: **YES.** Literacy is a core skill; coaches are proven.  
  - **VERDICT: APPROVE.** *Even if grant ends next year—it helps NOW.*

  **Proposal 2: Donor Labs + STEM Program**  
  - Step 1 Q1: **STEM PART: YES** (serves low-income MS kids). **LABS PART: NO** (affluent schools).  
  - Q2: **STEM: NO HARM. LABS: YES** (widens advantage gap).  
  - Q3: **STEM: YES** (big benefit to disadvantaged). **LABS: NO** (benefits advantaged more).  
  - **VERDICT: SPLIT IT.** The framework says: **APPROVE STEM, REJECT LABS.** *But the donor ties them together.* Here’s where you STOP and hand to the Superintendent. Why? The STEM program *alone* massively helps the least advantaged—but labs create inequality. Let leadership decide if the trade-off is worth it. **This might pass, and you should accept it IF leadership argues STEM’s 5-year benefit outweighs lab inequality.** (But the procedure forces this debate.)

  **Proposal 3: Close Tiny School, Bus to Better School**  
  - Step 1 Q1: **YES.** Targets bottom-ranked school.  
  - Q2: **NO HARM** (on spreadsheet: kids gain resources).  
  - Q3: **YES** (least advantaged gain most).  
  - Q4: **YES** (better facilities/teachers).  
  - **BUT STOP HERE:** The "community loss" isn’t in your data. This is a **VALUES CALL** for the board. The procedure says it helps the least advantaged, but real harm exists. **I know you don’t want this to pass—but by Rawls, it SHOULD.** The kids’ measurable life prospects improve. Accept it because your job is to maximize *their* opportunities, not preserve buildings. The board must weigh intangibles.

  ### What the Procedure CAN'T Do (Mistakes to Accept)
  - **Misses invisible harms/benefits** (e.g., community trust, student morale). That’s why Step 3 exists.  
  - **Rewards short-term thinking** (e.g., one-year grants). Push back by demanding "meaningful benefit" (Step 1 Q4).  
  - **Gamed by packaging** (like Proposal 2). Force honest splits.  
  - **Ignores long-term effects** (e.g., closing schools). Use Step 1 Q4 to flag uncertainty.  
  - **Feels robotic.** Some years, a "fair" decision will anger people. That’s not a flaw—it’s the point.

  **Final One-Pager Summary:**  
  1. **Define "Least Advantaged" FIRST** with your formula.  
  2. **Ask the 4 Questions** in order—stop if any fail.  
  3. **Use the "Veil" only on the RULES**, not each item.  
  4. **Hand off** when data runs out or trade-offs are equal.  
  5. **Accept:** You’ll miss intangibles, but you’ll stop unfairness.  

  Stick to this, and you’ll block self-interest while lifting those who need it most.
