prompt: |-
  I work in causal inference — directed acyclic graphs, do-calculus, confounding and common causes, mediators and colliders, instrumental variables, surrogate endpoints, principal stratification. I use this apparatus daily, so please don't explain it to me, and don't give me a bibliography or named authors and papers; I will add references myself, and I want the argument rather than the literature.

  What I want translated into that vocabulary: epiphenomenalism about phenomenal consciousness, the view that experiences are produced by physical or neural states but themselves cause nothing, together with what gets called the paradox of phenomenal judgment. Roughly: if experiences cause nothing, then my judgement that I am in pain is not caused by my being in pain, and it becomes hard to see how that judgement is about pain, or justified by it, or why the epiphenomenalist should think her own introspective reports give her any reason to accept a theory that makes them idle.

  Two things I would like handled. First, I suspect that causation is doing several different jobs in that paradox, and that the versions come apart once you force them into my terms. Separate out at least the following three readings and translate each: (a) the evidential reading, on which the absence of a directed path from experience to judgement means the judgement has the wrong causal history to count as knowledge or as justified belief; (b) the self-undermining reading, on which the theory predicts that the very belief supporting it is not explained by the phenomenon it concerns, so that the reliability of that belief is left unexplained; (c) the semantic reading, on which reference and content are supposed to be fixed by causal contact, and epiphenomenalism removes the contact. Say which reading, if any, the translation makes look strongest.

  Second, here is my half-formed thought, which I want tested rather than flattered. In my terms the dependence of report on experience looks purely associational: the neural state is a common cause of both, so the report is informative about the experience in the way a confounded marker can be informative, while intervening on the phenomenal node changes nothing downstream. My guess is that the philosophical worry is not about association at all but about what happens under intervention on the phenomenal node itself — that first-personal authority appears to require the report to track the state under interventions that set the state, not merely under interventions on its ordinary causes, and perhaps even to require tracking when those ordinary causes are held fixed. Does that distinction exist in causal-inference terms, or am I inventing something? If it exists, is it the distinction the paradox trades on, or a different one? And can you state, in my vocabulary, what would have to be true of the graph for the report to have whatever it is that the paradox says it lacks?

  Then give me the residue report. Which parts of the epiphenomenalist claim and of the paradox translate cleanly into graphical and counterfactual terms, which survive only with distortion and what the distortion is, and which have no expression in that vocabulary at all — I expect normativity, aboutness, and the first-personal character of the judgement to be candidates. For the residue, tell me whether it points to a genuine gap in my framework or to an unclarity in the position I asked you to translate, and if the latter, say what would have to be made precise to remove it.

  About 1,200 to 1,500 words, in British English. Lead with your bottom line in the first sentence — the single claim you would defend about how much of the paradox survives the translation — and then give the reasoning, with no preamble and without restating my question back to me.
reasoning: |-
  Hmm, the user works in causal inference and wants me to translate philosophical concepts about epiphenomenalism and the paradox of phenomenal judgment into causal inference vocabulary. They specifically want me to avoid explaining basic causal inference concepts since they use them daily.

  This is a sophisticated request. The user wants me to:
  1) Translate the paradox into causal inference terms
  2) Separate out three readings (evidential, self-undermining, semantic)
  3) Test their half-formed thought about association vs. intervention
  4) Provide a residue report showing what survives translation and what doesn't

  For the three readings:
  - Evidential reading: This concerns whether judgments can serve as evidence if experiences don't cause them. In causal graphs, we'd examine if there's a directed path from experience to judgment.
  - Self-undermining reading: This is about whether the theory can explain the reliability of our beliefs about experiences. In causal inference, this relates to unexplained reliability of measurement mechanisms.
  - Semantic reading: This touches on reference and content fixed by causal contact. This might be the hardest to translate since causal inference doesn't typically handle semantic content.

  For their half-formed thought: They're suggesting that the dependence between report and experience is associational due to a common cause (neural state), not causal. The philosophical worry seems to be about what happens under intervention on the phenomenal node itself - whether reports track experiences when we directly intervene on experiences. This is an important distinction in causal inference - association vs. intervention. We can represent this with the do-operator: P(report | do(experience)) versus P(report | experience).

  For the residue report: Some aspects translate cleanly - the causal structure, intervention effects, associational dependencies. Others translate with distortion - justification and reliability become questions about unexplained mechanisms. Some aspects don't translate at all - normativity (oughts), aboutness (intentionality), and the first-personal character of judgment. These point to genuine gaps in the causal inference framework rather than unclarities in the position.

  I'll structure my response to lead with the bottom line about how much of the paradox survives, then systematically address each part of the request using precise causal inference terminology without explaining basic concepts. I'll use British English as requested and keep it within the 1,200-1,500 word range.
answer: |-
  ### Bottom Line
  Approximately two-thirds of the paradox of phenomenal judgement survives translation into causal-inference terms, primarily concerning the **evidential** and **self-undermining** readings, while the **semantic** reading largely dissolves due to inexpressible residue; crucially, your interventionist intuition about first-personal authority is correct and central, exposing a requirement for counterfactual invariance under *direct* intervention on the phenomenal node that epiphenomenalism violates.

  ---

  ### Translation of the Three Readings
  **Graph Structure Assumed:**  
  - Let \( N \) = neural state (sufficient for both experience and report).  
  - \( P \) = phenomenal experience (epiphenomenal).  
  - \( R \) = introspective report/judgement (e.g., "I am in pain").  
  - Directed edges: \( N \rightarrow P \), \( N \rightarrow R \). No edge \( P \rightarrow R \) or \( P \rightarrow \text{anything} \). \( P \) is a collider-free descendant of \( N \).  

  **(a) Evidential Reading**  
  - **Claim:** Absence of \( P \rightarrow R \) path implies \( R \) cannot be evidence for \( P \), as \( R \) is not counterfactually sensitive to \( P \).  
  - **Translation:**  
    - \( R \) is **d-separated** from \( P \) given \( N \). Observational dependence \( (R \not\!\perp\!\!\!\perp P) \) exists due to \( N \) as common cause, but this is non-causal association.  
    - Under intervention \( do(P = p) \), \( R \) remains invariant: \( P(R \mid do(P = p)) = P(R) \). Thus, \( R \) does not track \( P \) under interventions fixing \( P \).  
  - **Strength:** This survives strongly. In causal-evidential reasoning, knowledge/justification requires counterfactual dependence (e.g., \( R \) should change if \( P \) were different, holding fixed upstream variables). Epiphenomenalism implies \( \partial R / \partial P = 0 \) under all interventions, severing the link between evidence and target.  

  **(b) Self-Undermining Reading**  
  - **Claim:** The theory cannot explain the reliability of \( R \) about \( P \), undermining belief in the theory itself.  
  - **Translation:**  
    - Let \( T \) = belief in epiphenomenalism (causally downstream of \( R \)). The causal path is \( N \rightarrow R \rightarrow T \).  
    - \( T \) relies on \( R \) as evidence for \( P \)-related claims. But \( R \)’s reliability about \( P \) has **no causal explanation**; it is an ad hoc association from \( N \).  
    - The graph implies \( P \) does not explain \( R \)’s accuracy. \( R \)’s correlation with \( P \) is non-causal, akin to a confounded biomarker. The theory \( T \) thus predicts its own evidential base (\( R \)) is *accidentally* correct.  
  - **Strength:** Strong. Causal inference treats unexplained reliability of indicators as suspect (e.g., instrumental variables require exclusion restriction). Here, \( R \)’s reliability is causally ungrounded, violating principles of causal faithfulness to stable mechanisms.  

  **(c) Semantic Reading**  
  - **Claim:** Without causal contact, \( R \) cannot refer to or be about \( P \).  
  - **Translation:**  
    - Causal inference lacks vocabulary for "aboutness". Reference fixing might be mapped to **causal identification**, but:  
      - \( P \) is *causally identified* if it has descendants, but here it has none.  
      - Counterfactual tests fail: \( R \) is unchanged by \( do(P) \).  
    - However, association via \( N \) might sustain a statistical index (e.g., \( R \) as proxy for \( P \)), but proxies don’t require causal paths.  
  - **Strength:** Weakest. "Aboutness" relies on intentionality/normativity outside causal graphs. The residue (see §4) is substantial here.  

  ---

  ### Testing Your Interventionist Intuition  
  **Your Claim:** First-personal authority requires \( R \) to track \( P \) under *interventions on \( P \) itself*, not just its causes.  
  - **Validity in Causal Inference:**  
    - This distinction is fundamental: **Association** (\( P(R \mid P = p) \)) vs. **Intervention** (\( P(R \mid do(P = p)) \)).  
    - Epiphenomenalism implies:  
      - Observational dependence: \( P(R \mid P = p) \neq P(R) \) (due to \( N \) as confounder).  
      - No interventional dependence: \( P(R \mid do(P = p)) = P(R) \).  
    - **The Paradox Trades on This:** Philosophical "authority" demands invariance under \( do(P) \). If \( R \) changes when \( P \) is surgically set (holding \( N \) fixed), it implies \( P \rightarrow R \). Epiphenomenalism forbids this.  
  - **Graphical Requirement for "Authority":**  
    - For \( R \) to track \( P \) under intervention:  
      1. Add edge \( P \rightarrow R \) (violating epiphenomenalism).  
      2. Ensure no confounding between \( P \) and \( R \).  
    - Formally: \( R \) must be **counterfactually invariant** to \( do(P) \) conditional on \( N \). But if \( N \) is held fixed, \( do(P) \) is impossible without breaking \( N \rightarrow P \), revealing a contradiction unless \( P \rightarrow R \) exists.  

  ---

  ### Residue Report  
  **What Translates Cleanly:**  
  1. **Causal Structure:** \( N \rightarrow P \) and \( N \rightarrow R \) with \( P \) causally isolated.  
  2. **Intervention Effects:** \( do(P) \) has no effect on \( R \) or any descendant.  
  3. **Associational Dependence:** \( R \not\!\perp\!\!\!\perp P \) due to \( N \), resolvable by conditioning on \( N \).  
  4. **Self-Undermining:** Theory \( T \) relies on \( R \), but \( R \)’s correlation with \( P \) lacks causal explanation—a violation of causal account for measurement reliability.  

  **Translates with Distortion:**  
  1. **Justification/Knowledge (Evidential):**  
     - Translated as counterfactual dependence under intervention. *Distortion:* Epistemology’s "justification" includes normative constraints (e.g., no Gettier cases) absent in causal models.  
  2. **Reliability (Self-Undermining):**  
     - Translated as unexplained statistical association. *Distortion:* "Reliability" implies normativity (e.g., *should* track truth); graphs show only *does* track associatively. Precision requires specifying a causal mechanism for reliability.  

  **No Expression in Causal Vocabulary:**  
  1. **Normativity:** "Justified belief", "knowledge", "warrant". Graphs describe functional dependencies, not epistemic norms.  
  2. **Aboutness/Intentionality:** \( R \) being "about" \( P \) requires semantic content/first-person perspective irreducible to causal roles.  
  3. **First-Person Character:** The subjective "what it is like" to judge \( R \) (e.g., the phenomenology of introspection).  

  **Assessment of Residue:**  
  - **Normativity/Aboutness:** Points to genuine gaps in causal inference. The framework handles *how* beliefs are produced, not *why* they should count as knowledge/reference.  
  - **First-Person Character:** Unclarity in epiphenomenalism. To remove distortion:  
    - Specify whether "judgement" \( R \) includes phenomenal properties (e.g., raw feel of asserting "I’m in pain"). If yes, \( R \) may have a phenomenal component \( P_R \) caused by \( N_R \), creating a new collider (\( N \rightarrow P \), \( N_R \rightarrow P_R \))—but this still isolates \( P \).  
  - **Root Gap:** Causal inference lacks resources for intentionality. A precise demand would be: "Referential success requires \( R \)’s content to be *causally sensitive* to \( P \)". But "content" has no causal graph analogue.  

  ---

  ### Conclusion  
  The paradox’s core survives in the **evidential and self-undermining strands**, hinging on the interventionist requirement for first-personal authority. Epiphenomenalism renders \( R \) a confounded proxy for \( P \), undermining its evidential and explanatory role. The semantic reading, however, relies on irreducibly non-causal elements (aboutness, normativity), exposing limitations of the graphical framework for intentional phenomena. Your interventionist account correctly identifies the crux: the absence of \( P \rightarrow R \) breaks counterfactual invariance under \( do(P) \), which philosophy implicitly demands for "authoritative" judgement.
