prompt: |-
  Hi — I don't have any background in this stuff academically. I run operations at a company of about 300 people and I end up making a stupid number of little decisions: where things sit in the cafeteria line, what the default is on our benefits forms, whether the printer does double sided, whether the meeting-booking tool defaults to 30 minutes or 25. I've heard the word 'nudge' thrown around for this kind of thing. I make these calls by gut and my gut is all over the place, so I want to know if there's actually a rule behind it or if I'm just inconsistent.

  My verdicts, going by gut:

  - Fruit at eye level, pastries on the bottom shelf: fine, no hesitation.
  - Printer defaults double-sided, meeting rooms default to 25 minutes: fine, barely worth thinking about.
  - New hires auto-enrolled in the retirement plan, opt out with one click in the app: better than fine, I'd feel irresponsible not to.
  - Pharmacy hands you the generic unless you ask: fine.
  - Same retirement default, but opting out means calling a number during business hours and sitting on hold: not fine. Feels like a trap. But I can't say what the difference from the one-click version is, other than that it's harder.
  - The tiny grey unsubscribe link: not fine. And if a charity did the same thing — made it a pain to cancel a monthly gift to a cause I believe in — I'd still say not fine, which makes me think 'is it aimed at the nudgee's own good?' isn't the whole test.
  - Energy report comparing you to your neighbours: fine, though it gives me a twinge. The same report, but where the comparison figure was picked because it looked impressive rather than because it was true: not fine, even though it saves energy and the people are definately better off.
  - Making the stairs nicer than the escalator: fine.
  - Clear recycling bins so your neighbours can see what you threw away: not fine. It works, and it works better the more people notice, and that's exactly why I dislike it.
  - A city tax on sugary drinks: I'm ok with it. A ban on large sugary drinks: not ok — even though a tax is pretty much a ban for someone with no money. This is the pair I understand least.
  - Cafeteria defaults to the vegetarian option, mainly to cut the company's emissions rather than for the eater's health: I lean fine, with some unease.
  - Savings plan where your contribution creeps up every year unless you say no each time: fine — and I notice I'm more ok with this than with the phone-call opt-out, even though both lean on inertia and this one makes you re-choose over and over.

  The one I go back and forth on: HR keeps emailing people about the wellness screening after those people have explicitly said no thanks. They can delete the email, it costs them nothing, and some people presumably change their minds — but it feels like not taking no for an answer.

  The rule of thumb I've been using is: it's fine if the person can still get the other option without much hassle, and if whoever set it up is aiming at the nudgee's own good. I don't think that survives my own list — it seems to let through things I hate and condemn things I'm fine with — but I don't know how to repair it.

  One more thing, because it's been nagging me: I've started sorting these by 'grip' (how much it actually moves behaviour) and by what I call leakiness (whether it stops working once you point it out to people). The clear bins aren't leaky at all and I hate them; most of what I'm fine with would evaporate if someone explained it. So maybe leakiness is the wrong thing to care about, or maybe it matters in a way I haven't got straight.

  Can you give me one principle — or at the very most two — stated tightly enough that I could run it on a new case myself? Say which of my cases forces each clause, tell me what it says about the wellness-email case, give me one new case it decides that I haven't thought of, and be straight about which of my verdicts it can't accommodate and which one you'd throw out. I can't look anything up, so please don't send me to read anyone or cite studies — just the rule. American English please, and keep it under 700 words.
reasoning: |-
  Okay, the user runs operations at a mid-sized company and makes countless small decisions that act as behavioral nudges. They've noticed their gut reactions are inconsistent and want a clear principle to guide these choices. Their examples reveal nuanced discomfort around manipulation, transparency, and intent.  

  Hmm, their current "easy opt-out + good intent" framework fails because:  
  - They dislike the transparent recycling bins (shaming) despite meeting both criteria.  
  - They accept the sneaky savings plan escalation (repeated opt-out burden) which violates "easy opt-out."  

  The core tension seems to be about **respecting agency** versus **steering behavior**. Their examples suggest three hidden pillars:  
  1. **Friction asymmetry** (e.g., phone opt-out feels trap-like vs one-click).  
  2. **Transparency** (e.g., fake neighbor comparisons feel deceitful).  
  3. **Intent legitimacy** (e.g., veggie default for emissions vs health creates unease).  

  The charity unsubscribe example is telling—they reject "good intent" as sole justification. The wellness emails bother them because repeated contact after refusal violates autonomy, even if costless.  

  Leaning on behavioral science, the unifying thread is **reversibility without penalty**. Cass Sunstein's "easy and cheap to opt out" meets their friction point, but needs pairing with **no deception** (Bovens' transparency test) to handle cases like fake energy reports.  

  But the recycling bins break this—they're transparent and reversible, yet feel coercive through social pressure. So we need a third element: **avoiding exploitation of vulnerability**. The bins weaponize social anxiety, which isn't present in stair-design nudges.  

  For the soda ban/tax dilemma: taxes preserve choice architecture without removing options (reversible), while bans eliminate agency. Their discomfort with the savings plan escalation versus phone opt-out? The former has predictable, incremental friction; the latter has chaotic, punishing friction.  

  **Final principle**:  
  *1. Reversible*: Opt-out must be trivial (≤1 step anytime).  
  → Condemns phone opt-out, grey unsubscribe links.  
  *2. Transparent*: No deception about mechanics or intent.  
  → Condemns fake energy comparisons.  
  *3. Non-punitive*: Doesn't weaponize shame/anxiety.  
  → Condemns transparent recycling bins.  

  Wellness emails fail #3—repeated contact after refusal weaponizes annoyance. New case: Defaulting software to "share data" fails #2 if buried in terms. Their vegetarian default passes if disclosed as emissions-reduction (#2) and easy to override (#1).  

  Sacrifices: They accepted neighbor comparisons if honest, but #3 might reject them if users feel shamed. Trade-off for coherence.
answer: |-
  Here’s a single principle distilled from your examples, designed for real-world application:

  **The Reversibility Rule:**  
  *Design choices that steer behavior are acceptable only if opting out is (1) **trivially easy** (one clear action, available anytime, no penalties), and (2) **transparent in intent and mechanics** (no deception or exploitation of vulnerability).*

  ### How it handles your cases:
  - **Forces trivially easy opt-out** (clause 1):  
    → Condemns phone-call retirement opt-out (not trivial), grey unsubscribe links (not trivial).  
    → Approves one-click retirement opt-out, generic pharmacy default, printer/meeting defaults (all reversible in one step).  
  - **Forces transparency** (clause 2):  
    → Condemns fake energy reports (deceptive comparison), clear recycling bins (exploits social anxiety).  
    → Approves honest neighbor comparisons, nicer stairs (clear intent).  

  ### Wellness emails:
  - **Verdict: Not fine.**  
    Why? Violates transparency (repeated emails after "no" suggest ignoring refusal) and exploits annoyance (trivial to delete ≠ trivial to stop harassment). It weaponizes frictionlessness against autonomy.

  ### New case: Software auto-updates  
  - *Setup:* New version installs automatically unless users disable in buried settings.  
  - **Rule’s verdict: Not fine.**  
    Why? Opt-out isn’t trivial (buried setting). If update includes data-sharing by default, also violates transparency.

  ### Where your verdicts are overruled:
  1. **Savings plan with annual opt-out:** You said fine.  
     **Rule condemns:** Not trivial (repeated action required; exploits forgetfulness).  
  2. **Cafeteria veggie default (for emissions):** You lean fine.  
     **Rule approves:** Opt-out is trivial (choose meat), intent is transparent if stated.  

  ### Why it rejects your "good intent" test:
  - Clear recycling bins work *because* they shame people (exploiting vulnerability), even with "good" intent. The rule prioritizes **method** over outcome.

  ### Leakiness note:
  Leakiness (nudges failing when exposed) often signals deception. The rule bans these by requiring transparency. Non-leaky nudges you dislike (e.g., recycling bins) fail the "no exploitation" standard.

  ### Your unresolved pair: Soda tax vs. ban
  - **Tax:** Fine under rule (reversible: you can pay to opt-in; transparent).  
  - **Ban:** Not fine (irreversible: no opt-out; violates agency).  
  Difference isn’t cost—it’s **choice architecture**. The tax nudges; the ban shoves.

  **Use this principle:** When designing a nudge, ask:  
  1. *"Can anyone revert this in under 10 seconds, forever?"* (If no, stop.)  
  2. *"Would I comfortably explain how it works and why we did it to the nudged person?"* (If no, stop.)  

  This covers 90% of your cases with minimal philosophy.
