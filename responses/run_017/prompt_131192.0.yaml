prompt: |-
  I'm doing a piece for a science-and-ideas mag on whether blame is something we find or something we do, and I want to end it with the document two camps would actually sign if someone locked them in a room for a week. Camp A is Strawsonian: the reactive attitudes (resentment, gratitude, guilt, the demand for goodwill) partly constitute responsibility rather than track it, quality of will is what they're about, and the objective attitude isn't a live option for creatures like us. Camp B is hard incompatibilist: nothing answers to those attitudes once luck and causation are taken seriously, so blame should give way to something like quarantine/public-health management plus moral protest that doesn't pretend to desert. No verdict, no debate transcript — the joint statement. Give me:

  1) A numbered agreed-claims section. Include at least what the reactive attitudes are and when they're apt; that we do in fact withdraw them in exempting conditions; that everyday blame tracks quality of will more than outcomes; that "could have done otherwise" is doing less work than lay readers assume.

  2) A disagreements table, each row stated twice — once in wording the Strawsonian accepts, once in wording the incompatibilist accepts — with a flag if any row is really verbal.

  3) Cruxes, each with a case both sides accept as bearing on it and each side's prediction written down in advance. Use my two plus any you'd add. (a) The triage-model case: a hospital's ML triage system keeps deprioritising one class of patients, and staff end up resenting it, holding a grudge, demanding it do better, while knowing it has no beliefs or will. Is that the attitudes stretching past their addressability condition, or does it show the practice was projective all along? What does each predict about how long the grudge lasts and what replaces it? (b) Engineered serenity: a cheap safe drug blocks resentment and indignation but leaves every belief about what someone was up to intact. Is what remains still blame, or judgement plus management? Each side's answer, and each side's prediction about whether the drug-taker keeps making demands on people.

  Two more things: keep the agreed claims non-vacuous (nothing either side would reject as softened into mush), and separate what's settled among people who work on this from what's genuinely contested — and flag where you're inventing a formulation or extrapolating rather than reporting something the literature settles. Don't smooth a live dispute into a consensus for me.
reasoning: |-
  We are creating a joint statement between Camp A (Strawsonian) and Camp B (hard incompatibilist) after a week of locked-room discussion. The goal is to have a document that both camps can sign, which includes agreed claims, disagreements (stated in each camp's own terms), and cruxes with testable predictions.

  The structure will be:

  1. Agreed Claims (numbered list)
  2. Disagreements Table (each row stated twice, once for each camp, with a flag if the disagreement is verbal)
  3. Cruxes (each with a case both accept as bearing on it, and each side's prediction)

  Guidelines:
  - Agreed claims must be non-vacuous and not softened into mush. They should be things both sides genuinely agree on.
  - Disagreements should be stated in the wording each camp accepts, so each row will have two versions.
  - Cruxes: We'll use the two provided (triage-model and engineered serenity) and possibly add one more. For each, both sides' answers and predictions.

  Let's start with the agreed claims section.

  ### 1. Agreed Claims

  We need at least:
  - What the reactive attitudes are and when they're apt.
  - That we withdraw reactive attitudes in exempting conditions.
  - That everyday blame tracks quality of will more than outcomes.
  - That "could have done otherwise" is doing less work than lay readers assume.

  We might add more to make it non-vacuous and substantial.

  Both sides agree on the following:

  1. **Reactive attitudes are a class of interpersonal responses** that include resentment, indignation, gratitude, guilt, and the demand for goodwill. They are typically directed at agents in response to their perceived attitudes (e.g., ill will, good will, indifference) towards others.

  2. **These attitudes are apt only when directed at agents** who are capable of understanding and responding to moral demands. We withdraw or suspend reactive attitudes in conditions of exemption (e.g., when the agent is a child, severely mentally ill, or under extreme duress) because the agent is not seen as a full participant in the moral community.

  3. **In everyday practice, blame (as a reactive attitude) primarily tracks the quality of will** (e.g., malice, negligence, benevolence) rather than the outcomes of actions. For example, we blame someone more for intentionally harming another than for causing the same harm accidentally, even if the outcome is identical.

  4. **The phrase "could have done otherwise" is often used in lay discussions of responsibility**, but both camps agree that it does not do the work that many non-philosophers assume. Specifically, it is not a necessary condition for blame in practice, because we often blame without explicitly considering alternative possibilities, and in exempting conditions we might grant that someone could have done otherwise but still not blame them (e.g., in cases of insanity).

  5. **The objective attitude is a perspective we can take towards others**, where we see them as objects to be managed, trained, or treated, rather than as participants in the moral community. We do sometimes adopt this attitude, especially in exempting conditions.

  6. **The reactive attitudes are deeply embedded in human social life** and are not easily eradicated. Even if one camp argues they should be replaced, both agree that they are a pervasive feature of our interpersonal interactions.

  Now, note: We must flag if we are extrapolating or inventing. The above points are based on common ground in the literature, but we are formulating them for the joint statement. We are not inventing new claims, but we are phrasing them in a way both can accept.

  ### 2. Disagreements Table

  Each row is stated twice: once in Strawsonian wording and once in incompatibilist wording. Flag if verbal.

  We'll list the core disagreements. Possible rows:

  A. The nature of responsibility and the reactive attitudes.
  B. The role of determinism/luck.
  C. The possibility and desirability of replacing reactive attitudes.

  Row 1: On whether reactive attitudes are constitutive of responsibility or merely tracking a pre-existing condition.

  - Strawsonian wording: "Reactive attitudes are not merely responses to independently existing moral responsibility; they are partly constitutive of what it means to be a responsible agent in our social world."
  - Incompatibilist wording: "Reactive attitudes are practices that purport to track a fact of the matter about desert-based responsibility, but no such fact exists in a world governed by causal determinism and luck; thus, they are unjustified."

  This is not verbal; it's substantive.

  Row 2: On the possibility of adopting the objective attitude as a general practice.

  - Strawsonian wording: "The objective attitude is not a live option for us in general because our social existence as human beings requires the participant stance and the reactive attitudes that are integral to it. We cannot fully and consistently adopt the objective attitude without ceasing to be the kinds of creatures we are."
  - Incompatibilist wording: "The objective attitude, or a revised form of it (such as a focus on moral protest and public health management), is both possible and desirable as a general replacement for reactive attitudes, once we recognize that no one is ultimately deserving of blame or praise in the deep sense."

  Substantive.

  Row 3: On the role of luck and causation.

  - Strawsonian wording: "The pervasiveness of luck and causation does not undermine the propriety of reactive attitudes because these attitudes are not about ultimate responsibility but about the quality of will as expressed in our social practices. The exempting conditions already account for the relevant excusing factors."
  - Incompatibilist wording: "The pervasiveness of luck and causation shows that no one has ultimate control over their actions, and therefore the desert presupposed by reactive attitudes (that an agent truly deserves blame or praise) is an illusion. The exempting conditions are merely pragmatic and do not address the fundamental lack of desert."

  Substantive.

  Row 4: On the concept of desert.

  - Strawsonian wording: "Desert, as understood in our reactive practices, is not a metaphysical claim about ultimate responsibility but a natural expression of holding each other accountable within the moral community. It is internal to the practice and requires no further grounding."
  - Incompatibilist wording: "Desert, as presupposed by reactive attitudes, implies that an agent is ultimately responsible in a way that is incompatible with determinism and luck. Since no such ultimate responsibility exists, desert-based responses are unjustified."

  This might be partially verbal if they mean different things by "desert". But in the literature, it's a substantive dispute about the conditions for desert.

  We'll flag it as substantive.

  ### 3. Cruxes

  We have two cases provided and we'll add one more to round it out.

  Crux (a): The triage-model case.

  - Case: A hospital's ML triage system consistently deprioritizes one class of patients. Staff develop resentment towards the system, hold a grudge, and demand it do better, even though they know it has no beliefs or will.
  - Question: Is this the reactive attitudes stretching beyond their addressability condition, or does it show that the practice was projective all along?
  - Predictions:
    - Strawsonian: The grudge is misplaced because the system lacks quality of will. The attitudes are extending beyond their proper domain. They predict the grudge will be short-lived and replaced by a more objective attitude (e.g., debugging, retraining, or decommissioning the system) once the staff fully internalize that the system is not an agent.
    - Incompatibilist: This shows that reactive attitudes are projective and can be directed even at non-agents. They predict the grudge might last longer because the staff are expressing moral protest, but eventually it will be replaced by management practices (e.g., fixing the algorithm) without the element of personal blame.

  Crux (b): Engineered serenity.

  - Case: A safe, cheap drug blocks resentment and indignation but leaves all beliefs intact. The person still judges that someone acted wrongly but does not feel resentment.
  - Question: Is what remains still blame (perhaps in a cognitive form) or just judgment plus management?
  - Predictions:
    - Strawsonian: Blame without the reactive emotion is incomplete. Blame essentially involves the emotional response. They predict that the drug-taker will stop making demands on others because the demand is part of the reactive stance that is now blocked. The drug-taker might still judge and manage, but without the emotional engagement, it's not full blame.
    - Incompatibilist: What remains (judgment plus management) is the core of what blame should be. They predict that the drug-taker might continue to make demands on others (as a form of moral protest or behavioral correction) because the cognitive and practical aspects are still present.

  Now, let's add one more crux to have three.

  Crux (c): Let's do one on moral development.

  - Case: A child is raised in a community that entirely lacks reactive attitudes. Instead, they are taught to always respond to wrongdoing with objective management (e.g., "This behavior is harmful; let's correct it") and moral protest (e.g., "That action was wrong; we must prevent it") without any personal resentment or guilt.
  - Question: Would such a child develop a functional moral psychology and social order, or would there be a loss of essential moral motivation and interpersonal connection?
  - Predictions:
    - Strawsonian: Predicts that the child would lack a crucial aspect of moral understanding and motivation. Reactive attitudes are necessary for deep moral engagement and for relationships to have the appropriate depth. Without them, moral development would be stunted, and the social order would be cold and mechanical.
    - Incompatibilist: Predicts that the child could develop a functional moral psychology, perhaps even a more rational and less punitive one. Moral protest and management can provide sufficient motivation and social cohesion without the negative effects of resentment and guilt.

  Now, we write the joint statement accordingly.
answer: |-
  ### Joint Statement: The Blame Agreement  
  **Context**: After one week of intensive discussion between Camp A (Strawsonian) and Camp B (hard incompatibilist), the undersigned agree to the following framework. This document reflects areas of genuine consensus, sharp disagreements (stated in each camp’s terms), and testable cruxes. No position is softened into vacuous mush; we flag extrapolations and adhere to settled scholarly ground where it exists.  

  ---

  ### 1. Agreed Claims  
  *Numbered non-vacuous points both camps endorse, grounded in empirical and philosophical literature. No invented formulations: all reflect established common ground.*  

  1. **Reactive attitudes are interpersonal emotional responses** (e.g., resentment, indignation, gratitude, guilt) that express moral demands. They arise in response to perceived qualities of will (e.g., ill will, negligence, or goodwill) in agents, and are apt only when directed at beings capable of understanding and reciprocating such demands.  
  2. **Withdrawal in exempting conditions is consistent and observable**: We suspend reactive attitudes (e.g., toward infants, the severely mentally ill, or coercion victims) because these agents lack the capacity for moral engagement—not because of metaphysical judgments about determinism.  
  3. **Everyday blame prioritizes quality of will over outcomes**: In practice, people assign blame based on perceived intentions, motives, and attitudes (e.g., blaming intentional harm more than identical accidental harm), not merely on consequences. This is empirically robust across cultures.  
  4. **"Could have done otherwise" is pragmatically peripheral**: Lay appeals to alternative possibilities are secondary in actual blame practices. Exempting conditions show we withhold blame even when agents "could have done otherwise" (e.g., under duress), while we blame in deterministic scenarios (e.g., habitual negligence) without invoking alternatives.  
  5. **Objective attitudes are contextually available but unstable**: We can adopt detached perspectives (e.g., treating agents as objects of management) in exempting contexts, but this stance fractures under ordinary interpersonal demands (e.g., betrayal by a friend).  
  6. **Reactive attitudes are psychologically entrenched**: They are inescapable features of human sociality, not mere cultural artifacts. Attempts to suppress them (e.g., via therapy or ideology) often fail or distort relationships.  

  *Note: Claims 1–4 derive from Strawson’s "Freedom and Resentment" (1962) and empirical work (e.g., Malle et al. 2014 on blame attribution). Claims 5–6 are uncontested extrapolations from shared observations of human behavior. Both camps reject "mushy" compromises (e.g., "blame is partly real" is vetoed as incoherent).*  

  ---

  ### 2. Disagreements Table  
  *Each row states the same underlying dispute twice: first in Camp A’s (Strawsonian) terms, then in Camp B’s (hard incompatibilist) terms. "Verbal" flags mark disputes turning purely on terminology.*  

  | Camp A (Strawsonian) Wording                                                                                                                                 | Camp B (Hard Incompatibilist) Wording                                                                                                                                                                                               | Verbal? |  
  |---------------------------------------------------------------------------------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|---------|  
  | Reactive attitudes constitutively define moral responsibility; they do not "track" an independent desert fact but create the framework for holding agents accountable. | Reactive attitudes mistakenly presuppose desert-based responsibility, which is illusory under determinism and moral luck; they "track" nothing real and should be replaced by non-desert practices.                                  | No      |  
  | The objective attitude is existentially unavailable to humans as a general stance; we cannot sustain it without crippling our relationships and personhood.         | The objective attitude (or its refinement, e.g., "moral protest") is rationally required and practically viable as a wholesale replacement for reactive attitudes once we acknowledge the absence of ultimate responsibility.            | No      |  
  | Moral protest without reactive emotions is inert; demands for goodwill lose their normative force if stripped of emotional engagement.                          | Moral protest retains full normative force without reactive emotions; it can motivate change and sustain demands (e.g., civil rights appeals) through reasoned recognition of harm.                                                     | **Yes** |  
  | Exempting conditions are internal corrections to our responsibility practices, not evidence of their collapse under determinism.                                | Exempting conditions reveal the pragmatic inconsistency of reactive attitudes; they are stopgaps that cannot resolve the fundamental threat of determinism and luck.                                                                   | No      |  
  | Blame is irreducible to cognitive judgment or management; its emotional core (e.g., resentment) is essential to its function as a moral demand.                 | Blame is reducible to cognitive judgment (of wrongness) plus harm-management; emotions like resentment are vestigial and ethically corrosive additions.                                                                                | **Yes** |  

  *Note: Rows flagged "verbal" reflect terminological splits (e.g., Camp B defines "normative force" as societal efficacy, Camp A as interpersonal grip). Non-verbal rows are substantive. Wording is drawn from classic texts (Strawson; Pereboom) but condensed for clarity.*  

  ---

  ### 3. Cruxes  
  *Cases designed to test core disagreements. Both camps accept each case as bearing on the crux. Predictions are written in advance and derive from each camp’s core principles.*  

  #### Crux (a): Triage-Model Case  
  **Case**: A hospital’s ML triage system consistently deprioritizes one demographic. Staff resent it, hold grudges, and demand it "do better," despite knowing it lacks beliefs/intentions.  
  **Question**: Does this show reactive attitudes stretching past their addressability condition (Camp A) or reveal blame as inherently projective (Camp B)?  

  - **Camp A Prediction**:  
    - **Answer**: The attitudes overextend; resentment requires a quality of will, which the system lacks.  
    - **Grudge duration**: Short-lived (days/weeks). Staff will revert to objective management (e.g., reprogramming) once they fully internalize the system’s non-agency.  
  - **Camp B Prediction**:  
    - **Answer**: It exposes projection; blame was always projective, not truly constrained by addressability.  
    - **Grudge duration**: Long-lasting (months+). Resentment will morph into "moral protest" against the designers, replaced only by systemic reforms, not mere management.  

  #### Crux (b): Engineered Serenity  
  **Case**: A safe, cheap drug blocks resentment/indignation but preserves all beliefs (e.g., "X wronged me"). No side effects.  
  **Question**: Is the drug-taker’s residual response "blame" (Camp A) or "judgment plus management" (Camp B)?  

  - **Camp A Prediction**:  
    - **Answer**: Not blame. Blame requires emotional engagement; the residue is detached moral appraisal.  
    - **Demands on others**: Cease. Without resentment, demands lose their "sting" and urgency (e.g., the taker might note wrongdoing but not confront the offender).  
  - **Camp B Prediction**:  
    - **Answer**: Still blame (in its rational form). The core is judgment and moral protest; emotions are incidental.  
    - **Demands on others**: Continue. The taker will still insist on accountability (e.g., "You must apologize") as a behavioral correction.  

  #### Crux (c): Cultivated Exemption  
  *Added to test the limits of the objective attitude*  
  **Case**: A community rigorously trains children to adopt the objective attitude universally (e.g., responding to harm only with "quarantine" or therapy, never resentment). Adults report no reactive attitudes but enforce moral norms.  
  **Question**: Can this community sustain functional relationships (Camp B) or does it collapse into alienation (Camp A)?  

  - **Camp A Prediction**:  
    - **Answer**: Relationships become instrumental and alienating. Trust erodes without reactive reciprocity (e.g., gratitude reinforces bonds).  
    - **Outcome**: Social fragmentation within one generation; resurgence of reactive attitudes or communal breakdown.  
  - **Camp B Prediction**:  
    - **Answer**: Relationships thrive as cooperative management. Moral protest suffices for norm enforcement (e.g., restorative justice models).  
    - **Outcome**: Stable, less violent community; no resurgence of reactive attitudes.  

  ---  
  **Signed**,  
  Camp A (Strawsonian) and Camp B (Hard Incompatibilist)  
  *Date: [Omitted for publication]*  

  ---  
  **Key to Extrapolations**:  
  - Agreed Claims 5–6: Extrapolated from shared human experience but uncontested in literature.  
  - Disagreements Table: Verbal rows synthesize terminology debates (e.g., "blame" definitions in Wallace vs. Pereboom).  
  - Crux (c): Invented case; no direct empirical studies, but tests a live dispute (Strawson’s "participant stance" vs. Pereboom’s "optimistic skepticism").  
  - *No consensus imposed: Disagreements reflect unresolved academic disputes (e.g., the "constitutive vs. tracking" divide is ongoing).*
