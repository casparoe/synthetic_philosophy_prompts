prompt: |-
  Got into a three hour argument with my friend last night and I'm still annoyed about it, mostly because I think I gave away more than I meant to. It started over a news story about a company in our city that contracts adults to act as someone's registered kin — they show up for hospital visits, they're the name on your next of kin forms, they sit with you through end of life stuff. Everyone involved consents, it's disclosed on a public register, nobody inherits anything, no money moves at the death, no fraud, no deception of anyone who has a stake. There is genuinely no one who is harmed by it. It still makes my skin crawl and I said the council should be able to shut it down. My friend, who is usually the more small-l liberal of the two of us, said fine, but then you are just doing Devlin, and the rest of the night went downhill from there.

  So I wrote down where I actually stand and I want it checked before I send it to him. Here it is:

  1. Criminal law needs harm to others, or a risk of it. Majority disapproval is not by itself a reason to ban something. (My friend kept saying harm is itself a moralised concept so my principle is just moralism with extra steps. I think that's a debating point and that there's a real difference, even if the border is fuzzy.)
  2. Disgust is never by itself a good reason to criminalise. That's the actual core of what's wrong with Devlin, and I think the old laws against gay sex were basically that mistake, and that the Wolfenden and Hart line on that was right.
  3. But offense to others in public is different, and I'm fine with public indecency laws even in the empty-park-at-3am case where there is nobody around to be offended.
  4. The law teaching people what's acceptable is part of what the criminal law is for. It has an expressive job, not just a deterrent one.
  5. I reject the idea that a society gets to enforce its constitutive morality as such. And anyway I dont think there is one shared morality in a society as pluralistic as ours for it to enforce.
  6. Consensual adult incest should stay criminal even when there's no coercion, no grooming and no chance of children.
  7. The council should be able to shut down the kin-for-hire company.
  8. No paternalism: people have to be free to wreck themselves. I'm for decriminalising drugs, and I think consent should be a defence to causing someone injury in the consensual dangerous sex cases, the way it isn't in England.

  Some of these obviously rub against each other — I can see 6 and 8 doing it, and 2 and 3 — but I genuinely can't tell which one I have to give up, or whether one of them is doing more work in my overall picture than I realise. I'm an engineer by the way and my friend did a philosophy degree, so assume I'm missing vocabulary rather than being subtle.

  Go through the eight and tell me which pairs are really in tension and which only look like it, ordered by how bad the tension actually is, what the cheapest fix would be in each case and what that fix costs me elsewhere, and then which single revision would clean up the most. Then tell me straight whether my friend is right that I've ended up a legal moralist without noticing. Please write it as continuous prose — no headings, no bullet points, no bold, no tables, just an email you'd actually send.
reasoning: |-
  Okay, the user had a three-hour argument with a friend about a kin-for-hire service and ended up drafting eight principles to clarify their stance. They want me to analyze these points for internal tensions, suggest fixes, and determine if they've unknowingly become a legal moralist. 

  First, I need to unpack their eight principles. Point 1 establishes a harm principle for criminal law, rejecting majority disapproval as sufficient grounds. Point 2 explicitly condemns disgust-based criminalization, referencing the Devlin debate. Point 3 carves out an exception for public offense, even in deserted scenarios. Point 4 acknowledges law's expressive function. Point 5 rejects societal enforcement of a single morality in pluralistic societies. Point 6 maintains incest should remain criminal absent harm. Point 7 wants the kin service banned. Point 8 opposes paternalism, supporting drug decriminalization and consent defenses.

  The kin-for-hire case is fascinating - it's structured to avoid tangible harm through disclosure and no inheritance, yet triggers deep discomfort. Their revulsion clashes with their own anti-paternalism stance in point 8. I suspect their position on incest (point 6) is the key tension point - they seem to be implicitly appealing to some form of moral harm despite rejecting moralism in point 5.

  Looking at the friction zones: Points 6 and 8 clash sharply over whether consent neutralizes "harmless" acts. Points 2 and 3 create tension between rejecting disgust-based laws while endorsing public indecency bans in unobserved scenarios. Point 4's expressive theory could contradict point 5's pluralism if the state expresses values not universally shared. 

  The most glaring contradiction is point 7 (ban kin service) with point 2 (reject disgust-based bans). If no harm exists as described, their discomfort seems exactly the "mere disgust" they condemn. To resolve this, they'd either need to identify actual harm in the kin arrangement (perhaps undermining familial institutions?) or concede it shouldn't be banned. But that might feel like surrendering their gut conviction.

  Regarding legal moralism: Their incest stance (point 6) and kin-service position (point 7) suggest they do attribute weight to societal morality, despite point 5's denials. The expressive function in point 4 becomes a backdoor for moralism when combined with point 7. They're not a pure Devlin-style moralist, but their exceptions create a hybrid position where some moral boundaries get enforced without coherent harm principles.

  The cheapest fix would be modifying point 6 or 7. If they drop the incest criminalization (aligning with point 8), it resolves that clash but abandons a deeply held taboo. If they reframe the kin-service opposition by identifying non-disgust-based harms (e.g., commodification concerns), they could salvage point 7 without contradicting point 2. However, this might stretch the harm principle into contested territory.

  Ultimately, their friend has a point about unconscious moralism - but it's not full Devlin. Their framework contains Millian elements that struggle against intuitions about certain boundaries. I'll structure the response to first validate their clear principles (points 1-2,5,8), then spotlight tensions, suggest resolutions, and gently note the moralistic slippage while acknowledging the complexity of drawing these lines.
answer: |-
  You've done a really thoughtful job laying out your principles after that argument, and it's clear you're wrestling honestly with the tensions. That's more than most people manage. Let me walk through your eight points step by step, see where the rubs are, how bad they are, and what options you have to smooth them out. I'll be straight about where I think your friend might have a point, too.

  First, points 1 and 2 are solid and largely consistent: criminal law needs harm or risk of harm to others, not just majority disapproval, and disgust alone isn't enough. Your friend’s quibble about "harm" being moralised is partly fair – we do argue about what counts as harm – but you're right that there’s a real difference between "this causes tangible injury/danger" and "this offends our values," even if the line blurs sometimes. Hart and Wolfenden absolutely drew that distinction against Devlin. Point 5 reinforces this by rejecting the idea society can enforce one "constitutive morality," especially in pluralistic societies. That’s firmly in the liberal camp. Point 8 fits neatly here too: no paternalism, people can harm themselves if they consent. Decriminalising drugs and allowing consent defences for risky sex absolutely flow from this.

  Point 4, about law’s expressive function teaching what’s acceptable, starts the tricky part. It *can* sit with the others if you mean the law expresses condemnation of *harmful* conduct. But it gets wobbly if the expression is detached from harm. If law "teaches" purely moral boundaries, that edges toward enforcing morality for its own sake – which points 1, 2, and 5 explicitly reject.

  Now, point 3 (public indecency laws, even when no one sees) is a bigger friction point with point 2 than it first appears. Point 2 says disgust alone isn’t grounds for criminalisation. Point 3 seems to say that certain acts in public *are* legitimately banned because they’re offensive *in principle*, regardless of whether anyone is actually offended at the time. You argue the *potential* for offense or the inherent offensiveness *of the public space violation* justifies it. That’s defensible, but it means you *are* allowing a form of offense (or moral boundary-policing) as a basis for law, distinct from tangible harm. It’s a narrow exception, but it’s there. The tension with point 2 isn’t fatal, but it requires careful justification: you’re saying public spaces have unique normative rules where certain acts are inherently disruptive to the shared environment, creating a kind of "harm" to the public order itself, even if no individual is present to feel disgust *at that moment*.

  Point 6 (criminalising consensual adult incest with no coercion, grooming, or pregnancy risk) is where the most serious tension lies, primarily with points 2 and 8. Point 2 rules out disgust as a basis. Point 8 demands freedom for consensual acts that "wreck" the self. Incest under your conditions seems to fit that: consenting adults, no tangible harm to others identified. So why criminalise? If the answer is "because it’s inherently wrong/repugnant," that leans hard on the very disgust point 2 rejects. If it’s about preventing potential subtle coercion or inherent power imbalances even in "apparently" equal cases, that edges closer to a harm/risk argument, but it’s contested and stretches the concept. If it’s about protecting the integrity of the family as a social institution, that sounds a lot like enforcing a constitutive morality, which point 5 explicitly denies. This is the single biggest clash: Point 6 feels like it *requires* a moralist foundation that your other principles dismantle. It directly contradicts point 8’s anti-paternalism in a way decriminalising drugs doesn't – drugs physically harm the user, incest (under your hypo) doesn't necessarily do that.

  Point 7 (shutting down the kin-for-hire service) is the crux with your friend. Based purely on points 1, 2, and 5, it’s hard to justify. You admit there’s no deception, no fraud, no tangible harm, no one with a stake is misled. Your "skin crawl" reaction points to disgust or moral unease – exactly what point 2 says isn’t enough. Point 4’s expressive function *could* be invoked here – perhaps you think the law should express that kinship is sacred and shouldn’t be commercialised. But point 5 explicitly rejects society enforcing its morality "as such," and in our pluralistic society, many wouldn’t share that view of kinship. Invoking "potential for abuse" or "undermining genuine familial bonds" risks being speculative harm, or worse, masking moral disapproval. Without identifying a clearer, more concrete harm (e.g., potential for fraud if disclosure fails, exploitation of the vulnerable seeking such services, burden on hospitals verifying authenticity), point 7 relies on a foundation your principles 1, 2, and 5 undermine. It looks very much like Devlin in practice: "This feels deeply wrong to the community, so we can ban it," even absent tangible harm.

  **Tension Ranking (Worst First):**
  1.  **Point 6 vs Points 2 & 8:** This is the most severe. Criminalising harmless (in your hypo) consensual incest relies on disgust or moral wrongness, directly contradicting the rejection of disgust as a basis (2) and the anti-paternalist freedom to choose self-regarding acts (8). *Cheapest Fix:* Drop point 6 (align with decriminalisation of truly consensual adult incest). *Cost:* Abandoning a deeply held taboo. *Alternative Fix:* Reinterpret "harm" to include psychological harm from violating deep-seated taboos *or* harm to the family institution. But this stretches "harm" significantly, risks moralism, and contradicts point 5’s pluralism argument (society lacks one morality to enforce). It also weakens point 8’s purity.
  2.  **Point 7 vs Points 1, 2 & 5:** Banning the kin service based on your reaction conflicts fundamentally with needing harm (1), rejecting disgust (2), and rejecting enforcement of a single morality (5). *Cheapest Fix:* Drop point 7 (accept the service shouldn’t be banned). *Cost:* Living with your discomfort. *Alternative Fix:* Identify a *concrete* harm/risk you initially missed (e.g., potential for fraud in *practice* despite safeguards, systemic harm to concepts of caregiving, exploitation risks). This preserves 7 but requires robust evidence of harm, not just unease. It avoids moralism if grounded in tangible risks.
  3.  **Point 3 vs Point 2:** Banning public indecency with no audience invokes offense/decency as a justification, which *looks* like the disgust point 2 rejects. *Cheapest Fix:* Reaffirm that this is about protecting the *public character* of shared spaces from inherently violating acts, constituting a harm to public order, not just disgust. It’s a narrow, widely accepted exception. *Cost:* It *is* a bit of a carve-out, making point 2 less absolute. But it’s a common and arguably necessary one in legal systems.
  4.  **Point 4 vs Point 5:** Law’s expressive function can slide into enforcing morality. *Cheapest Fix:* Clarify that the "expression" is tied *only* to condemning conduct that causes harm/risk (tying it firmly to point 1). E.g., law expresses that assault is wrong *because* it harms people. *Cost:* Limits how far the expressive function can go; it can’t express purely moral condemnation absent harm.

  **Single Best Revision:** The revision that would clean up the most tension is **modifying or dropping point 6 (incest criminalisation)**. It’s the biggest outlier causing the sharpest clash with core liberal principles you otherwise endorse (2 & 8). Resolving this significantly strengthens the coherence of your framework against the legal moralism charge. Addressing point 7 next is crucial for your specific argument.

  **Is your friend right? Are you an accidental legal moralist?** Partly, yes, but it's nuanced. Your explicit principles (1, 2, 5, 8) are firmly anti-Devlin. **However,** points 6 and 7, as currently stated, *function* like legal moralism in practice. You want to ban incest and the kin-service not based on proven harm to others under your definitions, but because they violate deeply held intuitions about what is morally permissible or sacred (family bonds, kinship). That *is* Devlin's core argument: society can enforce its fundamental moral fabric against disintegration, even absent tangible harm to specific individuals. Point 4 (expressive function) *could* become a vehicle for this if untethered from harm. So your *framework* rejects legal moralism, but your *conclusions* on incest and kin-for-hire rely on a moralist intuition. Your friend has a point that you might be applying a harm principle inconsistently, letting moral discomfort masquerade as harm or public order concern in these specific cases.

  To avoid being an *unwitting* Devlinite, you need to either:
  1.  **Consistently apply your harm principle:** Drop points 6 and 7 (or radically reinterpret "harm" for them in a way that doesn't collapse into moralism), *or*
  2.  **Explicitly acknowledge a limited moralism:** Accept that for a *very small* set of acts involving foundational social institutions like the family (incest, commodification of core kinship roles), society *does* have a legitimate interest in setting boundaries based on shared moral understanding (even in a pluralistic society, some things are widely held as constitutive), even absent direct, tangible harm. This means revising points 5 and potentially 2 to allow for this narrow exception. But this is a significant concession to Devlin and costs you philosophical consistency.

  Sending this analysis to your friend might actually restart the argument, but hopefully on clearer ground! It shows you've engaged deeply. Good luck.
