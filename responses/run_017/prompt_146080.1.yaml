prompt: |-
  Our philosophy society is run by a teacher who loves trolley cases, and I cant work out what rule he's actually using. His verdicts so far: you may throw the switch so one dies instead of five; you may not push the fat man off the footbridge; you may not push him even in the loop version, where his body is what stops the trolley before it can come back round to the five; you may not be the surgeon who cuts up one healthy patient to save five; a bomber who hits a munitions factory and foresees civilian deaths is fine, while one who bombs civilians to break morale is not; if the person on the side track is about to be crushed by a falling rock anyway, switching is fine; and steering into a wall and killing yourself to save the five is allowed but not required.

  New case we made up: the trolley will hit five people and there's no other track. You can set off a charge that drops the whole trolley into a pit, and that stops it. A man is asleep at the bottom and gets crushed, but his body does nothing to stop the trolley — if he weren't there it would stop just the same and the five would live. Also the trolley wasn't heading for him at all until you set the charge off; the danger to him is entirely your doing.

  Will he say that's OK? More importantly, what rule fits all his verdicts? Every rule I come up with either lets the fat man off the bridge or bans the munitions bomber. If more than one rule fits, tell me which you'd bet on and which follow-up would separate them — should I ask him the same case but where his body IS what stops the trolley, or a version where you could save the five a slower way that only breaks your own leg? A mate says it's all "double effect", but a name doesn't tell me what to say here.

  Please flag which parts of this are genuinely argued about by people who know the topic and which are basically agreed, so I don't repeat a contested view as if it were standard. No book titles or reading lists needed. Answer in British English please.
reasoning: |-
  Hmm, the user is describing a philosophy society and a series of trolley problem verdicts from their teacher. I need to figure out what ethical rule the teacher is using based on these judgments. The user has provided several scenarios where the teacher said certain actions were permissible or not, and they've added a new case about dropping a trolley into a pit where a sleeping man gets crushed.

  Looking at the teacher's verdicts:

  1. Throwing the switch to divert the trolley to kill one instead of five is allowed.
  2. Pushing the fat man off the footbridge to stop the trolley is not allowed.
  3. Pushing the fat man in the loop version (where his body stops the trolley) is also not allowed.
  4. The surgeon who cuts up a healthy patient to save five is not allowed.
  5. The bomber who targets a munitions factory and foresees civilian deaths is fine, but one who intentionally targets civilians to break morale is not.
  6. Switching the trolley is fine if the person on the side track was about to be crushed by a falling rock anyway.
  7. Steering into a wall to kill yourself to save the five is allowed but not required.

  The new case involves setting off a charge that drops the trolley into a pit, crushing a sleeping man whose body doesn't actually stop the trolley - the danger to him is entirely created by the action.

  I need to find an ethical principle that fits all these judgments. The user mentioned "double effect," which refers to the Doctrine of Double Effect (DDE). This doctrine distinguishes between intended effects and merely foreseen side effects. According to DDE, an action might be permissible if:
  - The action itself is good or neutral
  - The bad effect isn't intended
  - The good effect isn't achieved through the bad effect
  - There's a proportionate reason for allowing the bad effect

  Let me test this against the teacher's verdicts:

  - Diverting the trolley: The death is a foreseen side effect, not intended, so allowed.
  - Pushing the fat man: His death is intended as the means to stop the trolley, so not allowed.
  - Surgeon case: Cutting up the patient directly intends his death, so not allowed.
  - Munitions bomber: Targeting the factory is permissible even with foreseen civilian deaths, as those deaths aren't intended. But targeting civilians directly to break morale intends their death, so not allowed.
  - Falling rock case: Switching is fine because the death was going to happen anyway - it's not caused by your action in the same way.
  - Self-sacrifice: Allowed because you're not intending harm to an innocent third party.

  For the new case: Dropping the trolley into the pit directly causes the crushing of the sleeping man. Even though his body doesn't stop the trolley, you're intentionally creating a situation that kills him to save the five. You're using the pit knowing he's there, so his death is a means to your end. Therefore, DDE would likely say this isn't allowed.

  The user wants to know if there's an alternative rule. Another possibility is the Doctrine of Productive Purity, which focuses on whether the harm is caused by a "new threat" versus redirecting an existing threat. But in the new case, creating the pit introduces a new threat to the sleeping man, which would likely make it impermissible.

  I think DDE fits best. To separate possible rules, I should suggest follow-up cases. For example, if the man's body does stop the trolley, DDE still wouldn't allow it because his death is intended as a means. If there's an alternative way to save the five by breaking your own leg, that might be allowed under DDE since you're not harming an innocent third party.

  On philosophical consensus: DDE is widely debated. Many philosophers reject it as arbitrary, while others defend it. The trolley problem variations are contested, with no universal agreement. The bomber case is particularly controversial in just war theory.

  I'll structure my answer to predict the teacher's verdict on the new case, explain why DDE fits, discuss alternatives, suggest follow-ups, and clarify where there's philosophical disagreement.
answer: |-
  Based on your teacher's pattern of verdicts, the rule he's almost certainly using is a strict interpretation of the **Doctrine of Double Effect (DDE)**. Here's how it fits all his cases, a prediction for your new case, and notes on philosophical consensus—all in British English.

  ### The Doctrine of Double Effect (DDE) Explained
  DDE permits causing harm as a *side effect* of a good action but forbids *intending* harm as a means to an end. It has four key conditions:
  1. **The act itself must be morally good or neutral** (e.g., throwing a switch, bombing a factory).
  2. **The bad effect (e.g., death) must not be intended**—only foreseen.
  3. **The good effect must not be achieved *through* the bad effect** (i.e., the harm isn't the instrument that delivers the good).
  4. **There must be a proportionate reason** for allowing the bad effect (e.g., saving five lives justifies one foreseen death).

  ### How DDE Fits Your Teacher's Verdicts
  | Case                                 | Teacher's Verdict | DDE Justification                                                                 |
  |--------------------------------------|-------------------|-----------------------------------------------------------------------------------|
  | Throw switch (standard trolley)      | Allowed           | Act: diverting threat (neutral). Death is foreseen but not intended or instrumental (you save via the track, not the killing). |
  | Push fat man (footbridge)            | Not allowed       | Act: pushing (bad/aggressive). Death is *intended as the means* to stop the trolley. Violates conditions 2 and 3. |
  | Push fat man (loop)                  | Not allowed       | Same as above. His body *is* the stopping mechanism, so death is instrumental.    |
  | Surgeon cutting patient              | Not allowed       | Act: killing (bad). Death is intended as the means to get organs (violates 2 and 3). |
  | Munitions bomber (foresees deaths)   | Allowed           | Act: bombing factory (neutral/military target). Civilian deaths are foreseen but not intended or instrumental (good effect comes from destroying factory). |
  | Bomber targeting civilians           | Not allowed       | Act: targeting civilians (bad). Deaths are intended as the means to break morale (violates 1, 2, 3). |
  | Switch when victim doomed by rock    | Allowed           | Act: diverting threat (neutral). Death is foreseen but not caused *by you*—you’re redirecting an existing threat to someone already dying. Proportional. |
  | Steering into wall (self-sacrifice)  | Allowed           | Act: stopping trolley (good). Your death is foreseen but not intended (you aim to hit the wall, not die). Not required as DDE doesn’t demand self-sacrifice. |

  ### Prediction for Your New Case
  - **Your case**: Setting off a charge to drop the trolley into a pit, crushing a sleeping man (who isn’t instrumental; trolley stops anyway).
  - **Teacher’s likely verdict: Not allowed**.
    - **Why**: The act (detonating a charge) *creates a new threat* (the pit) that directly kills the man. His death isn’t just foreseen—it’s *intended as part of your plan* to neutralise the trolley. Even though his body isn’t instrumental, you’re deliberately using the pit *knowing he’s there*, so his death is a necessary means to your end (violating DDE conditions 2 and 3). The danger to him is entirely your doing, akin to pushing the fat man.

  ### Alternative Rules & Why DDE Fits Best
  - **Why DDE over others?** Every rule you’ve tried likely fails on the bomber or fat man. For example:
    - *"Minimise harm"* fails—it allows pushing the fat man.
    - *"No direct killing"* fails—it bans the standard switch case.
    - *"Productive Purity"* (no new threats) fits most cases but struggles with the bomber (destroying the factory creates "new" debris that kills civilians). DDE handles this smoothly via intention.
  - **DDE is the strongest fit**. It’s the only rule that systematically explains *all* verdicts, especially the bomber distinction (intention matters) and the loop case (fat man’s death is instrumental).

  ### Follow-Up Cases to Test the Rule
  If you want to confirm or probe further, try these (I’d bet on DDE, but these separate it from rarer alternatives like "no active harm"):
  1. **"Man’s body IS what stops the trolley" variant**:
     - *DDE prediction*: Still not allowed (like the loop case). Death is instrumental, so violates DDE.
     - *Why ask?* If he allows this, he might be using a weaker rule (e.g., "no *direct* bodily contact"). But given he banned the loop, I doubt it.
  2. **"Slower way that breaks your own leg"**:
     - *DDE prediction*: Allowed. You’re not intending harm to an innocent third party; your injury is a foreseen side effect. Self-sacrifice is permitted but not required.
     - *Why ask?* If he bans this, he might be inconsistent (as he allowed steering into a wall).

  ### Philosophical Consensus & Disagreements
  - **Widely agreed**: The trolley problem variations are *deliberately designed* to test moral intuitions, and there’s no universal agreement on solutions. DDE is a *common framework* but heavily contested.
  - **Contested points**:
    - **DDE itself**: Many philosophers (e.g., consequentialists) reject DDE as arbitrary. They argue intention doesn’t change outcomes, so the bomber/fat man distinction is incoherent. Defenders (often deontologists) see intention as morally crucial.
    - **Bomber case**: This is hotly debated in just war theory. Critics say "foreseen but not intended" is a loophole for unethical bombing.
    - **Loop case**: Some DDE supporters *do* allow it (arguing you’re redirecting the trolley, not "using" the person). Your teacher’s ban suggests he’s very strict.
    - **Self-sacrifice**: Most agree it’s permissible but not obligatory. Controversy exists over *why* (e.g., is it supererogatory?).
  - **Basically agreed**: The surgeon case is almost universally condemned. The standard switch case is widely (but not universally) seen as permissible.

  In short: Bet on DDE. For your new case, expect a "not allowed" verdict. If you want to unsettle him, press on *why* the pit case differs from the bomber—this targets DDE's weakest spot (the intention/foresight distinction). Good luck with the society!
