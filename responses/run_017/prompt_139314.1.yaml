  2. **Branch 2 (Phenomenal Appearance):**  
     - *Viewers:* Person A (believes liquid is toxic sludge) vs. Person B (believes it’s dyed water).  
     - *Variant:* Liquid is harmless dye (false belief for A).  
     - **Question:** Does the liquid’s *color/texture look subjectively different* (e.g., more viscous or iridescent) to A vs. B, even in the false variant?  

  3. **Branch 3 (Temporal Dynamics - Early Processing):**  
