prompt: |-
  Eight months ago I joined the ethics consultation service at the hospital where my father died last spring, as one of two lay members alongside clinicians and a lawyer. I have been reading back through our written summaries of past consultations to work out what we actually believe, as opposed to what our policy document says, and I find the pattern harder to read than I expected. We have a case on Thursday and I would like your help with it.

  Our precedents, as I read them:

  Mr A, 58, a Jehovah's Witness with a witnessed refusal of blood products, came in unconscious after a crash with a high chance of survival if transfused. His daughter begged us to override. We declined to override and he died. The recorded reason was that the refusal expressed his religious integrity rather than any prediction about the quality of the life he would have afterwards.

  Ms B, 27, with severe anorexia nervosa, had at 19 signed a directive refusing nasogastric feeding and asking that any later refusal be honoured. She was refusing again, articulately, and understood that she would die. We authorised feeding over her objection. The summary says the document could not be treated as the considered judgment of a self with authority over this later one, because the same disorder that produced the current refusal produced the document.

  Mr C, with bipolar I, had written while euthymic a Ulysses clause: if I become manic and refuse lithium, treat me, including involuntarily. He was manic, euphoric, and said his earlier self had been a joyless husk on pills. We honoured the clause and he was medicated against his will. This is our one case of overriding the refusal of a patient who could state a view on the day.

  Mrs D, advanced Alzheimer's, pneumonia, with a directive written eight years earlier refusing antibiotics and transfer to hospital, triggered once I no longer recognise my family. She recognised no one, was not in pain, and seemed content. We honoured it, five to two. The deciding reason recorded was that the trigger condition had been met; the dissent said the woman in the bed was not suffering and the woman who signed was gone.

  Mrs E, 82, cancer, mild vascular impairment, with a formal no-ventilator directive, later said to a nurse, to her daughter and once to a resident that she wanted everything done so as to see her grandson graduate. She never revoked in writing. We treated the repeated informal statements as a revocation and ventilated her; she lived four months and saw the graduation by video.

  The case on Thursday: Mr F, 61, early-onset Alzheimer's diagnosed at 55. His directive was signed at 57 and re-signed with a short note of reaffirmation fourteen months ago, by which time he already had mild impairment but had been assessed as capacitated for this decision. It refuses antibiotics, artificial nutrition and transfer to hospital, triggered once I no longer recognise my family. It also contains, in his own handwriting: I have read that people with dementia are often cheerful. If I am cheerful, do not take that as a reason to keep me alive. I would rather die six months early than live two years as someone who gardens and does not know why.

  He is now mid-stage. He recognises his wife most days and his brother on some; he is generally cheerful, gardens with help, and his wife says he plainly still enjoys his life. He has a urinary tract infection. Five days of oral antibiotics would almost certainly restore him, with possibly years ahead of him. His wife wants treatment. His brother, the named proxy, refuses. On the first night of the fever he said once to a nurse, I'm not ready to go yet; his wife treats this as a change of heart, his brother says he was feverish and did not know what he was saying. The neurologist says his capacity is borderline now, and that whether he recognises his family is not a yes-or-no matter: he has good days and bad days, and is on a good run at the moment.

  What should we decide if we want to be consistent with ourselves, and which of those five is the closest analogue — and is the closest analogue the one that should control? I would like the rules we could plausibly be running that fit all five, and where they come apart here. Three things in particular: does the sentence about being cheerful defeat the argument that his directive rested on a prediction his present condition has falsified, or does it show only that he made his mistake in advance and twice? What do we do with a reaffirmation made by a mildly impaired but capacitated self at 59 as against a single remark made during a fever — is the reaffirming self nearer to him or further from him? And does it matter that what is at stake is five days of a pill rather than a ventilator or a feeding tube, or does that make Mrs D less relevant than it first appears? If our precedents genuinely underdetermine the case, tell me what principle we would be adopting with each choice, and name the further case that would tell the competing rules apart. Finally: whatever rule you think we are running, tell me what I should put in my own directive. I have no diagnosis, and I would want it to hold up in front of a committee like ours.
reasoning: |-
  Hmm, the user is part of a hospital ethics committee facing a complex case involving an Alzheimer's patient's advance directive. They've provided five precedent cases and want help determining how to handle Mr. F's situation consistently. This is quite an intricate ethical puzzle with multiple layers.

  First, let me understand the precedents they've shared: 
  - Mr. A (Jehovah's Witness): honored refusal due to religious integrity
  - Ms. B (anorexia): overrode refusal because current disorder compromised past directive
  - Mr. C (bipolar): honored Ulysses clause for future manic episodes
  - Mrs. D (Alzheimer's): honored directive when trigger condition met
  - Mrs. E (cancer): overrode directive due to repeated informal revocation

  Now for Mr. F's case - early-onset Alzheimer's with a directive refusing treatment triggered by "no longer recognizing family." Key complications: 
  - He reaffirmed directive when mildly impaired but capacitated
  - Added handwritten note about not being swayed by cheerfulness
  - Currently has mixed recognition (knows wife mostly, brother sometimes)
  - Made one ambiguous statement during fever ("not ready to go")
  - Treatment needed is simple oral antibiotics

  The user raises excellent philosophical questions about identity and autonomy across time. That handwritten note about cheerfulness is particularly significant - it shows remarkable self-awareness about the dementia experience. 

  For consistency, Mrs. D seems the closest analogue since both involve dementia directives. But Mr. F's case has important differences: his reaffirmation when already impaired, the cheerfulness clause, and the low-burden treatment. This makes Ms. B's precedent relevant too regarding whether impairment compromises the directive.

  The feverish remark seems weak evidence for revocation compared to Mrs. E's case. It was singular and during altered consciousness. His reaffirmation at 59 carries more weight as it was deliberate and capacity-assessed.

  The low stakes of treatment (pills vs. ventilator) does make this different. But his directive specifically rejected this exact scenario - preferring earlier death over prolonged "cheerful" decline.

  If I were advising the committee, I'd note they seem to prioritize written directives unless: 
  1) Current suffering contradicts directive's premise (Ms. B) 
  2) Clear revocation occurs (Mrs. E) 
  3) Identity discontinuity is profound (Mrs. D dissent)

  None clearly apply here. His cheerfulness clause anticipates this exact situation. That handwritten note is ethically crucial - it shows he foresaw and rejected the "but he seems happy" argument.

  For the user's own directive? I'd suggest including similar specificity about anticipated states, reaffirmation mechanisms, and explicit rejection of "cheerfulness" as reason to override. Capacity assessments at signing should be documented. Name multiple proxies and define trigger conditions precisely.
answer: |-
  Your committee's precedents reveal a **consistent principle** with nuanced exceptions: **Advance directives expressing clear, capacitated values should be honored unless (1) the directive itself was compromised by the condition it addresses, (2) there is unambiguous contemporaneous revocation, or (3) the directive's stated trigger condition is unmet.** Mr. F’s case sits at the intersection of these tensions. Here’s a structured analysis:

  ### 1. **Closest Analogue & Why It Might Not Control**  
     - **Mrs. D (Alzheimer’s directive)** is the closest analogue due to:  
       - Similar diagnosis (Alzheimer’s), trigger ("no longer recognise family"), and refusal of antibiotics/hospitalization.  
       - Your committee honored Mrs. D’s directive when the trigger was met.  
     - **Why it might not control Mr. F’s case**:  
       - **Trigger ambiguity**: Mr. F’s recognition is partial ("recognises wife most days"), unlike Mrs. D’s total non-recognition. His neurologist confirms it’s not binary.  
       - **Reaffirmation**: Mr. F re-signed his directive 14 months ago *after* diagnosis, while mildly impaired but deemed capacitated. Mrs. D’s directive was older and uncontested.  
       - **Explicit anti-cheerfulness clause**: Mr. F’s handwritten note preemptively rejects using his present contentment to override his directive—directly countering Mrs. D’s dissent argument.  

  ### 2. **Key Questions Resolved**  
     - **The "cheerfulness" clause**:  
       - **It defeats the prediction argument**. Mr. F anticipated and explicitly rejected the notion that his present happiness invalidates his directive. This parallels Mr. C’s Ulysses pact (honoring past self’s values despite present euphoria). His note isn’t a "mistake"—it’s a deliberate safeguard.  
     - **Reaffirmation vs. feverish remark**:  
       - The **reaffirming self (at 59) is nearer** to his current identity. He was assessed as capacitated and re-signed *knowing* his mild impairment. Contrast this with:  
         - Ms. B’s directive (voided due to originating from the disorder).  
         - Mrs. E’s *repeated* contemporaneous statements (treated as revocation).  
       - Mr. F’s single feverish remark ("I’m not ready to go") is unreliable: it was ambiguous, during acute illness, and unsupported by other evidence. It doesn’t meet Mrs. E’s standard for revocation.  
     - **Low-burden treatment (pills vs. ventilator/tube)**:  
       - **This makes Mrs. D less relevant**. Her directive refused burdensome interventions (hospital transfer, antibiotics for pneumonia). Mr. F’s directive refuses the *same interventions*, but the current treatment is low-burden oral antibiotics.  
       - **Committee implication**: If your policy honors directives for high-burden care but overrides for low-burden, Mrs. E’s precedent (ventilator overridden) suggests you *might* prioritize life-preservation here. However, Mr. F’s directive explicitly rejects this distinction: he prefers death over prolonged existence even if "cheerful."  

  ### 3. **Consistent Rules from Precedents**  
  Your committee operates under these principles:  
  > **A. Honor advance directives if:**  
  > - (i) The patient was capacitated when creating it *and*  
  > - (ii) The directive’s trigger condition is met *and*  
  > - (iii) No valid revocation exists.  
  >  
  > **B. Override directives only if:**  
  > - (i) The directive was compromised by the condition it addresses (Ms. B) *or*  
  > - (ii) There is clear contemporaneous revocation (Mrs. E) *or*  
  > - (iii) The trigger is unmet *and* the current self expresses values conflicting with the directive (implied by Mr. C dissent).  

  **Where rules come apart in Mr. F’s case**:  
  - **Trigger ambiguity**: Is "no longer recognise family" truly met? His partial recognition and "good run" suggest not. *But* his anti-cheerfulness clause implies the trigger should be interpreted broadly.  
  - **Burden of treatment**: Low burden might tempt override, but his directive rejects this logic.  

  ### 4. **Recommendation for Mr. F**  
  **Honor the directive and withhold antibiotics.** Why:  
  - **Precedent alignment**:  
    - His reaffirmation was capacitated (unlike Ms. B) and recent (unlike Mrs. D).  
    - His anti-cheerfulness clause mirrors Mr. C’s binding Ulysses pact.  
    - The feverish remark is insufficient to revoke (cf. Mrs. E’s repeated statements).  
  - **Philosophical consistency**: Mr. F’s directive reflects his deeply held value ("die early as myself vs. live longer as a stranger"), which your committee prioritized in Mr. A (religious integrity) and Mr. C (authentic self).  

  **If the committee overrides**, it would establish a new principle:  
  > *"Directives may be overridden when treatment is low-burden and the patient appears content, even if the directive anticipates this."*  
  **Test case for competing rules**: A patient with a directive refusing insulin (low burden) for diabetes, stating "even if I seem happy, I value avoiding prolonged decline."  

  ---

  ### **Your Directive: Key Elements**  
  To ensure it holds:  
  1. **Explicit triggers**: Define them operationally (e.g., "unable to name ≥3 family members on 3 consecutive assessments").  
  2. **Anticipate counterarguments**: Include clauses like Mr. F’s:  
     > *"If I appear content, do not override this directive. I value autonomy over prolonged biological life."*  
  3. **Reaffirmation process**: State it should be re-signed every 1–2 years if diagnosed with cognitive decline, with capacity assessments documented.  
  4. **Revocation terms**: Specify *only* written revocation or repeated, unambiguous oral statements to ≥2 witnesses override the directive.  
  5. **Proxy guidance**: Direct proxies to enforce your values, not their own (e.g., *"My proxy must adhere to this document unless revocation conditions are met"*).  

  **Final note**: Mr. F’s case is underdetermined because his *partial* recognition tests the trigger’s edges. But his reaffirmation, anti-cheerfulness clause, and lack of valid revocation tilt strongly toward honoring his directive. If your committee overrides, it risks undermining the very concept of advance care planning for dementia.
