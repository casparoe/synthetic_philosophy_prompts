answer: |-
  Here's a graded assessment and detailed feedback for the answer. The answer is strong overall but has some significant weaknesses, particularly in the tipping section and a key contradiction.

  **Grade: 15/20**

  **Feedback for the Student (Copy and Paste this):**

  Thank you for your thoughtful answer! You've engaged deeply with the concepts and applied a clear theoretical framework (David Lewis on conventions). Here's a detailed breakdown of your strengths and areas for improvement, linked to specific parts of your text:

  1.  **"Rules like these are conventions. Following David Lewis... So conventions do generate genuine obligations...":** **Excellent (Strengths: 3/3 marks)**. You perfectly capture the core idea of Lewisian conventions: arbitrary solutions to coordination problems that generate obligations *because* of the mutual expectations and benefits of uniformity. This is the ideal theoretical foundation for this question. Well done defining the core concept.
  2.  **"That's why Dev did nothing wrong... He isn't like somebody who drives on the wrong side of the road in traffic.": Strong (Strengths: 4/4 marks)**. Your application of the convention theory to Dev's case is logical and persuasive. You correctly identify the *absence of harm, disruption, or observed disappointment* as key reasons why his isolated, unnoticed action doesn't violate the genuine obligation generated by the convention. The comparison to driving on the wrong side in traffic is spot-on for contrast.
  3.  **"I'd add that he couldn't be blamed anyway, because he's only visiting:... What's actually right and wrong for him is still settled by what people in Fenwick think...":** **Problematic (Weaknesses: -3 marks)**. This directly contradicts your excellent Lewisian framework earlier. Lewis argues the obligation arises *from the local convention itself* because you benefit from it and others rely on it. Where you were *raised* (Fenwick) is irrelevant to the moral obligation generated by the *current* coordination scheme (Marlow). While expecting visitors to know *all* rules is unrealistic (a fair practical point), saying his moral obligations are still solely defined by Fenwick undermines your own core argument. Morality, under your initial Lewis view, is tied to the *current* coordination context, not origin.
  4.  **"Tipping is different... leaving nothing takes money out of somebody's pocket. That's a straightforward harm...":** **Overstated/Unsupported (Weaknesses: -3 marks)**. You assert a critical factual claim ("paid a wage that assumes tips") that **is not stated in the scenario**. The scenario *only* says service is included on the menu and tips are pooled/shared. It *does not* say wages are reduced *because* tips are expected. Without this key assumption, your "harm" argument collapses. Tipping *could* be purely conventional/mannered (like the road crossing) or it *could* involve wage expectations – but you need to argue this point based on the given information, not assume the harmful version exists. Failing to acknowledge this ambiguity weakens your argument significantly.
  5.  **"So conventions matter morally in two separate ways: some matter because they coordinate us, and some matter because breaking them makes a person worse off.":** **Partially Correct/Incomplete (Weaknesses: -1 mark)**. While descriptively true of *some* conventions (like your tipping *assumption*), this doesn't fully address the question's core distinction between "moral obligations" and "manners." You frame the tipping harm as non-conventional, but the *act of tipping itself* is clearly a social convention. A stronger answer would grapple with whether the *harm* (if established) transforms a convention *into* a moral obligation, or if the harm exists *independently* of the convention. You jump straight to "harm" without fully analyzing tipping *as* a convention first.
  6.  **"Last thing, though: not every convention deserves to be followed...":** **Insightful Bonus (Strengths: +1 mark)**. This is an excellent, sophisticated addition that shows deeper critical thinking. You correctly identify that conventions lose their moral force (and may become immoral to follow) if they are inherently unjust or fail to solve a coordination problem fairly for all. While not strictly required, this elevates your answer.

  **What a Good Answer Would Have Also Considered:**
  *   **The Distinction:** Explicitly discussing whether the "harm" in tipping (if proven) makes it fundamentally *different in kind* from the purely coordinative road-crossing convention, or if it's just a convention *with* attached consequences.
  *   **"Manners" vs. "Morality":** More directly addressing the question's core dichotomy. Does Lewis's view make conventions *moral* obligations, or are they still a distinct category ("enlightened self-interest" or "social obligation") separate from core morality? Your "prudence, not morality" comment about "When in Rome" hints at this but isn't fully developed.
  *   **The Visitor Aspect (Tipping):** Briefly acknowledging that the tipping scenario *also* involves a visitor, but arguing why the potential for harm (if established) overrides the visitor status, unlike in Dev's case.
  *   **Evidence for Tipping Harm:** Recognizing the lack of explicit information about wages in the tipping scenario and either arguing cautiously or acknowledging the assumption needed.

  **Summary of Mark Breakdown:**
  *   Core Theory (Lewis) Explained Well: +3
  *   Dev Analysis (Strong Application): +4
  *   Tipping Analysis (Flawed due to unsupported assumption and incomplete reasoning): -3
  *   Visitor Status for Dev (Contradicts core theory): -3
  *   Unjust Conventions (Insightful Bonus): +1
  *   **Total: 15/20**

  **Feedback on YOUR Question:**
  Your question is actually very well-designed for this level! It presents two contrasting scenarios perfectly suited to exploring the convention/morality distinction. It doesn't "give away" the Lewisian answer – the student brought that in themselves, which is excellent. The *only* minor suggestion for next time regarding the tipping scenario: you could add a phrase like "Assume waitstaff in Marlow rely on these tips to meet their expected monthly income" *if* you specifically want to test the harm argument. Leaving it ambiguous, as you did, is also fine and forces students to think critically about what information they have and what they must assume. Good job!
