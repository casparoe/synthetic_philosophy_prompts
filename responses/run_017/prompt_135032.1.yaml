prompt: |-
  I work as the planning officer for a small internal drainage board in eastern England. Our job is to keep water off low-lying farmland and the villages on it: about forty miles of raised embankment, a dozen pumping stations, and several hundred culverts and sluices. Once a year we put forward a shortlist of the schemes we want funded — rebanking this reach, replacing that pump — and every scheme has to be justified with a benefit–cost ratio: how likely the asset is to fail over some period, multiplied by what the flooding would cost, against what the work would cost. The numbers go into a spreadsheet supplied by our funding body, which will not normally pay for anything whose ratio is below one, and the spreadsheet wants a single number for the probability.

  The difficulty is that we hardly ever have anything to count. A pumping station of a given age and type failing in a given year is not something anyone here has seen even once, and the few failures we have had turned on causes nobody predicted. For years we filled the box in anyway, because it had to be filled, and the more honest among us put in a round number and shrugged. Recently I started asking our engineers and operators for a range instead: the lowest failure chance they would take seriously over the next ten years, and the highest. Two things have happened since, and I do not know what to make of either.

  The first is that the ranges go into the spreadsheet and come out as their midpoints. Someone has to type a number into the box, the midpoint is the only thing that looks defensible to type, and within a week everyone is talking as though the midpoint had been the estimate all along. The range seems to buy us nothing except a few honest conversations in the room where it was written down.

  The second is worse, and it is what I most want help with. Sometimes we learn something and the range gets wider rather than narrower. A reach of embankment that the team put at between two and ten per cent chance of breaching in ten years was surveyed; the survey found animal burrows in a place nobody had looked; and the same team, given the survey, widened it to between one and forty per cent — the bottom moved down because the burrows are now a known and fixable thing, and the top moved up because a failure mechanism nobody had considered turned out to be live. My colleagues say this is nonsense: finding things out is supposed to make you less unsure, not more. I think the widening is right, and that a single probability could never have recorded it. But I cannot say what should follow from it, and it makes the shortlist impossible to rank.

  So please write me a procedure my team could actually run, once a year, on each asset, in about half a day, with three or four people in a room, none of whom has any statistics beyond school.

  In order, I want it to cover: what question to put to the room to get the two ends of a range, and what the ends are meant to mean in terms someone untrained can act on (I have wondered whether to put it as a bet — the lowest odds at which you would put money on failure, and the highest at which you would take money against it — and I would like to be told whether that is a good idea or a trap); how to combine ranges from people who disagree, including when one person's range sits entirely above another's; what to do when a decision is due and two schemes' ranges overlap, or when one scheme's range straddles the break-even point; how to think about several assets failing together, since what would hurt us most is one storm taking out three reaches at once; what single number, if any, we should give the spreadsheet, and how to stop that number being mistaken for the estimate; and how to handle the widening case when it arises.

  Where the procedure cannot decide, I want that marked, along with whether the remaining question is one that more survey or monitoring could settle, or one about what we actually care about, which is for the board to argue over. I also want it to say when the right output is that we have no idea at all — when the honest range is essentially zero to one — and what we are then supposed to do with that asset, because we have several.

  Then please run the procedure all the way through on three cases.

  1. A mile of embankment protecting a village of about two hundred houses. The team's range for a breach in ten years is two to ten per cent. Flooding there has been costed at around four million pounds. The rebanking would cost £400,000.
  2. Two pumping stations of the same age and type, of which we can afford to replace only one this year. Replacing the first would cost £60,000 and the second £400,000, being the larger installation. The first: a ten to thirty per cent range for failure in ten years, and a modest consequence — a few fields under water for a day, £80,000. The second: five to twenty-five per cent, and a consequence of a road and eleven properties, £900,000.
  3. The embankment with the burrows, whose range widened from two to ten per cent to one to forty per cent after the survey. The board had more or less decided to do this one. A further survey would cost £15,000 and take eight weeks; the funding deadline is in six.

  I would like at least one of these to come out somewhere I do not want it to, and I would rather you did not soften it if it does.

  Alongside the procedure, tell me how confident you are in the parts where you are recommending something that people who think about this properly disagree about, and single out the one point in what you have written that you are least sure of. Please write in British English, and keep the procedure usable by someone who will not read anything else on the subject — gloss any term of art in ordinary words the first time you use it.
reasoning: |-
  Hmm, the user is a planning officer for a drainage board in eastern England dealing with flood risk management. They're struggling with how to handle probability estimates for infrastructure failures when there's very little historical data. Their current approach of using ranges (lowest and highest plausible failure probabilities) isn't working well because those ranges get reduced to midpoints in their funding spreadsheet, and sometimes ranges actually widen with new information rather than narrowing.

  They need a practical procedure that can be implemented once a year by a small team without statistical expertise. The key requirements include:
  - How to properly elicit ranges from experts
  - How to combine conflicting ranges
  - How to handle overlapping benefit-cost ratios
  - How to account for correlated failures
  - What single number to report (if any)
  - How to handle cases where uncertainty increases with new information
  - Specific guidance for three test cases

  The user wants transparency about where the procedure might produce counterintuitive results and where experts might disagree about the approach. They also want British English and clear explanations of any technical terms.

  I should develop a step-by-step procedure that addresses each of these pain points. For the range elicitation, the betting analogy seems promising but needs refinement - perhaps framing it as "the lowest probability where you'd start worrying about failure" and "the highest probability you can reasonably imagine" would work better. For combining ranges, a simple approach like taking the extreme ends of individual ranges might suffice for their needs.

  The correlated failure problem is particularly important since multiple simultaneous failures would be catastrophic. A simple "group risk" multiplier might work as a practical solution. For the widening uncertainty case, I should emphasize that this is actually proper Bayesian updating - new information revealing unknown unknowns should increase uncertainty.

  For the three test cases:
  1. The village embankment has a clear BCR above 1 even with conservative estimates
  2. The pumping stations require comparing risk reduction per pound spent
  3. The burrow-affected embankment becomes problematic - the widened uncertainty range pushes it below the funding threshold, and the additional survey creates a timing conflict

  I should flag where the procedure might produce uncomfortable results, particularly with case 3 where the "right" answer might be to not fund the work despite board expectations. The least confident part is probably how to handle the single number reporting - while the geometric mean approach is mathematically sound, it might still get misinterpreted as "the estimate" in practice.

  The procedure should emphasize documenting uncertainty and marking cases where decisions require board judgment rather than pure calculation. It should also explicitly allow for "we don't know" outcomes where appropriate.
answer: |-
  Below is a practical procedure for your team, designed to be completed in half a day per asset with 3–4 people. It addresses your core challenges: eliciting meaningful ranges, combining them, ranking schemes, handling widening uncertainty, correlated failures, and reporting. The procedure uses plain language and minimises technical jargon. Key terms are **bolded** and explained when first used.  

  **Procedure: Asset Risk Assessment**  
  *Time per asset: 3–4 hours (including breaks)*  
  *Participants: 1 planning lead (you), 2–3 engineers/operators.*  

  ---

  ### **Step 1: Elicit Individual Ranges**  
  **Question to ask:**  
  *“Over the next 10 years, what is the* ***lowest plausible probability*** *of failure you’d consider credible enough to demand action? And the* ***highest plausible probability*** *you could reasonably imagine, even if unlikely?”*  

  **Explain the meaning:**  
  - **Lowest plausible:** "If the true probability were *below* this, you’d feel confident *ignoring* the risk this decade."  
  - **Highest plausible:** "If the true probability were *above* this, you’d consider it a crisis needing *immediate action*."  
    *Why avoid betting analogies?* They can bias experts (e.g., pride in "extreme" estimates). Focus on "plausibility" instead.  

  **Output per person:** Two numbers (e.g., 1%, 40%).  

  ---

  ### **Step 2: Combine Ranges**  
  **Method:**  
  1. Plot all individual ranges on a whiteboard (e.g., sticky notes).  
  2. **Combine overlapping ranges:** Take the **lowest minimum** and **highest maximum** from all participants.  
     - *Example:* Alice says 2–10%, Bob says 1–8% → Combined range: 1–10%.  
  3. **Handle non-overlapping ranges:** If ranges don’t overlap (e.g., Alice 2–5%, Bob 8–15%), **flag high disagreement**. Revisit the asset for 10 mins:  
     - Ask each to explain their reasoning.  
     - If no consensus, take the **outer bounds** (e.g., 2–15%) and mark as **"Disputed: High Uncertainty"**.  

  **Why this works:** It captures the team’s collective uncertainty without false precision.  

  ---

  ### **Step 3: Calculate Benefit-Cost Ratio (BCR) Range**  
  **Method:**  
  - **Cost of failure (£):** Use your existing flood consequence figure (e.g., £4M).  
  - **Cost of work (£):** Known (e.g., £400,000).  
  - **BCR formula:** `(Failure Probability × Cost of Failure) / Cost of Work`  
  - **Calculate for both ends of your probability range:**  
    - *Low BCR:* (Min Probability × Cost of Failure) / Cost of Work  
    - *High BCR:* (Max Probability × Cost of Failure) / Cost of Work  

  **Output:** A BCR range (e.g., 0.2 to 4.0).  

  ---

  ### **Step 4: Account for Correlated Failures**  
  **Simple rule for "group risk" (multiple assets failing together):**  
  - If an asset is in a **high-risk cluster** (e.g., 3 embankments in one valley likely to fail *in the same storm*):  
    1. Estimate the probability of a storm severe enough to threaten all assets simultaneously (e.g., "1-in-50-year event").  
    2. **Multiply the asset’s failure probability by 1.5** (a conservative uplift) *if* it’s in such a cluster.  
  - *Note:* Only apply this if correlated failure is plausible (e.g., geography, shared threat).  

  ---

  ### **Step 5: Handle Uncertainty & Decision Rules**  
  **A. Ranking overlapping schemes:**  
  - If BCR ranges overlap (e.g., Scheme A: 0.8–3.0, Scheme B: 1.2–2.5):  
    - Prioritise the scheme with the **highest *minimum* BCR**.  
    - *Why?* It guarantees at least some value even in the worst case.  
  - If one scheme’s range **straddles 1.0** (e.g., 0.7–1.5):  
    - Mark as **"Marginal: Board Judgment Required"**.  

  **B. Widening uncertainty (e.g., burrows found):**  
  - **Accept the wider range.** New knowledge exposing unknowns *should* increase uncertainty.  
  - If the BCR range now includes values *below 1.0* (e.g., 0.1–4.0):  
    - Flag as **"High Uncertainty: Investigate or Defer"**.  
  - **Action:** Propose further surveys *if* they could narrow the range decisively (see Step 6).  

  **C. When uncertainty is extreme ("zero to one"):**  
  - If the range is **0–100%** (or close):  
    - Output: **"Insufficient Knowledge: Defer or Monitor"**.  
    - *Action:* Install cheap monitoring (e.g., sensors) or commission a targeted survey.  

  ---

  ### **Step 6: Reporting to the Spreadsheet**  
  **What single number to report:**  
  - Use the **geometric mean** of your probability range.  
    - *Formula:* √(Min Probability × Max Probability)  
    - *Example:* For 1–40%, geometric mean = √(0.01 × 0.4) = √0.004 ≈ 0.063 (6.3%).  
  - *Why geometric mean?* It handles skewed ranges better than the midpoint (e.g., 1–40% midpoint = 20.5%, but geometric mean = 6.3% – more representative of uncertainty).  

  **Prevent misinterpretation:**  
  - Label the cell: **"Representative Probability (Geometric Mean)"**.  
  - Add a footnote: *"Based on expert range of X% to Y%. Not a point estimate."*  
  - **Never** say "estimate" in discussions – say "the representative value".  

  ---

  ### **Step 7: Document Uncertainty & Next Steps**  
  **Final output per asset:**  
  1. Failure probability range (e.g., 1–40%).  
  2. BCR range (e.g., 0.1–4.0).  
  3. **Decision flag:** One of:  
     - **"Fund Confidently"** (Min BCR > 1.0)  
     - **"Marginal"** (BCR range straddles 1.0)  
     - **"Investigate Further"** (Widening uncertainty or extreme unknowns)  
     - **"Defer/Monitor"** (BCR consistently <1.0 or "zero-to-one" uncertainty).  
  4. **Correlated risk note** (if applicable).  
  5. **Unresolved question:** Specify if it needs:  
     - *More data* (e.g., "Survey needed to clarify burrow extent").  
     - *Value judgment* (e.g., "Board must weigh risk to village vs. cost").  

  ---

  ### **Confidence Notes**  
  - **Most confident in:**  
    - Using geometric mean (fairer for skewed ranges than midpoint).  
    - Widening ranges with new information (this aligns with Bayesian logic – new data can reveal ignorance).  
  - **Least confident in:**  
    - The **1.5× multiplier for correlated failures**. Experts debate this – some prefer complex models. *Why I recommend it:* It’s simple and conservative enough for your context.  
  - **Contested but workable:**  
    - Taking outer bounds for non-overlapping ranges. Statisticians prefer structured methods (e.g., Delphi), but your time constraints justify pragmatism.  

  ---

  ### **Applying the Procedure: Three Test Cases**  
  *(All costs in £; probabilities for 10-year failure)*  

  #### **Case 1: Embankment protecting village**  
  - **Data:** Pr(failure) range = 2–10%; Cost of failure = £4M; Cost of work = £400,000  
  - **BCR range:**  
    - Min BCR = (2% × 4M) / 400k = 80k / 400k = 0.2  
    - Max BCR = (10% × 4M) / 400k = 400k / 400k = 1.0  
  - **Geometric mean Pr:** √(0.02 × 0.1) = √0.002 ≈ 0.045 (4.5%)  
  - **Correlated risk?** Assume none.  
  - **Decision:** BCR range (0.2–1.0) straddles 1.0 → **"Marginal: Board Judgment Required"**.  
    - *Why uncomfortable?* Despite protecting a village, the *best-case* BCR is only break-even. The board might fund it for social reasons, but the numbers don’t justify it alone.  

  #### **Case 2: Two pumping stations**  
  *(Compare risk reduction per £ spent. We can only fix one.)*  
  - **Pump A (small):** Pr(failure) = 10–30%; Cost of failure = £80k; Cost of work = £60k  
    - BCR range: Min = (10% × 80k)/60k ≈ 0.13; Max = (30% × 80k)/60k = 0.4  
    - **BCR always <1.0 → "Defer"**  
  - **Pump B (large):** Pr(failure) = 5–25%; Cost of failure = £900k; Cost of work = £400k  
    - BCR range: Min = (5% × 900k)/400k = 0.11; Max = (25% × 900k)/400k ≈ 0.56  
    - **BCR always <1.0 → "Defer"**  
  - **Shock result:** Neither meets BCR >1.0! *Why?* High work costs vs. modest failure probabilities.  
  - **Revisit assumptions:**  
    - *Did we underestimate failure costs?* (e.g., road disruption unaccounted for).  
    - *Is Pr(failure) too low?* If Pump B’s *max* probability is realistic, BCR=0.56 is still poor.  
  - **Decision:** Both flagged **"Defer"**. Politically hard, but numbers are clear.  

  #### **Case 3: Embankment with burrows (widening uncertainty)**  
  - **Data:** Pr(failure) range = **1–40%** (was 2–10%); Cost of failure = £4M; Cost of work = £400,000  
  - **BCR range:**  
    - Min BCR = (1% × 4M) / 400k = 0.1  
    - Max BCR = (40% × 4M) / 400k = 4.0  
  - **Geometric mean Pr:** √(0.01 × 0.4) ≈ 0.063 (6.3%)  
  - **Further survey?** Cost £15k, deadline in 6 weeks (needs 8 weeks).  
    - **Assessment:** Survey *might* narrow the range (e.g., to 5–20%). But:  
      - It misses the funding deadline.  
      - Even if BCR improves (e.g., min BCR=0.5), it may still be marginal.  
  - **Decision:**  
    - BCR range (0.1–4.0) → **"High Uncertainty: Investigate or Defer"**.  
    - **Do not fund this year.** Use the £15k for urgent surveys *now* to clarify risk for next year.  
    - *Why uncomfortable?* The board "almost decided" to do it. But post-survey, it’s the riskiest asset with the weakest business case.  

  ---

  ### **Summary for Your Team**  
  - **Honest ranges > false precision.** Widening ranges with new data is valid.  
  - **Rank by minimum BCR** when uncertain.  
  - **Report geometric mean** with clear caveats.  
  - **"Defer" is a legitimate outcome** when numbers don’t stack up or uncertainty is extreme.  
  - **Board’s role:** Make value judgments when BCR is marginal or consequences transcend cost (e.g., village safety).  

  This procedure prioritises transparency over false confidence. It ensures defensible decisions while highlighting where judgment or data is needed – exactly what your funding body should appreciate.
