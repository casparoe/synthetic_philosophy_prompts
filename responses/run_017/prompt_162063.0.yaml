prompt: |-
  I got into sortition a couple years back (I drive a delivery van, no philosophy past high school) and the more I read the more it looks like the thing people actually build isn't the thing they say they believe in.

  What's actually out there: you draw a few dozen or a few hundred people at random — but only from the people who said yes to the letter — you sort them so the group roughly mirrors the population on age, gender, education, region, you sit them for a handful of weekends with experts and a facilitator, they write recommendations, and the elected politicians are free to shelve them. One issue, one group, never the same people twice.

  What I can't figure out is what any of that is claiming. If the claim is that an ordinary random person's judgment on an issue is as good as a politician's, why is it fine that the pool is only volunteers, why bother making the group mirror the population, and why is the output only advice? If the claim is that the group is legitimate because everyone had an equal shot at the draw, don't the volunteer filter and the expert weekends break it? I think people are quietly switching between two different stories — one about the group standing in for everybody, one about the draw being fair to everybody — and I want to know whether those two stories are really compatible.

  The version I daydream about: forget the weekends. Draw people for one non-renewable six year term, pay them what legislators get, let them hire their own staff, ban them from ever running for elected office afterwards so it can't be a career step, and fill half the chamber that way and half by election. Meanwhile plenty of places cap presidents, governors and mayors at two terms and then act surprised that the permanent staff, agency heads and lobbyists are the ones who actually remember how anything works.

  So: what does a practice like this presuppose — about what makes a body representative, about whether governing is a skill that takes time to learn, and about why a decision binds people who had no hand in it? Give me the implicit theory rather than the case for it, and mark which bits the practice really commits you to versus which bits it just sits nicely with and would still work fine under a completely different theory. And if the mirroring story and the equal-chance story can't both be doing the work, tell me which one the real world version is secretly leaning on and which one it would have to give up.
reasoning: |-
  Okay, let me unpack this user's query. They're deeply engaged with sortition but frustrated by the gap between theory and practice. They drive a delivery van and have no formal philosophy background, but their analysis is sharp—they've noticed inconsistencies in how sortition panels are framed. 

  First, I need to parse their core confusion: why do real-world sortition projects use volunteer-filtered, demographically mirrored groups for one-off advisory roles? They're questioning whether the "statistical representation" justification clashes with the "equal opportunity" principle. Smart catch—most people don't spot that tension. 

  Their daydream alternative—long-term legislative sortition with term limits—reveals what they value: real power for ordinary people, insulation from careerism, and institutional memory. But they're self-aware enough to note term limits' unintended consequences (e.g., bureaucrats gaining power). 

  The user wants the *implicit* theories behind existing sortition models, not advocacy. They also want to know:  
  - If "mirroring" and "equal chance" are incompatible, which one is actually carrying weight?  
  - What assumptions about governance skills and legitimacy underpin current practices?  

  Hmm. Existing sortition *does* quietly prioritize mirroring over equal chance. The volunteer filter contradicts random equality but gets hand-waved because "it's practical." Meanwhile, demographic mirroring serves as a proxy for diverse perspectives—even though education/class get sidelined.  

  The advisory-only output suggests designers don't truly believe governing is a generic skill; they rely on experts to fill that gap. But long-term sortition (like the user's dream) *would* assume governing is learnable—which challenges electoral politics' elitist assumptions.  

  Legitimacy-wise, current models lean on input legitimacy (we sampled "your kind of people") rather than direct voice. The user's legislative version would force harder questions about binding decisions without consent.  

  ...I should flag where practices reveal their priorities. For example:  
  - If they *really* believed in equal chance, they'd enforce mandatory participation.  
  - If they *really* trusted group judgment, they'd give them binding power.  
  Neither happens, so the mirroring narrative is doing the heavy lifting.  

  The user's skepticism is justified. Real-world sortition is a compromise—less radical than its rhetoric. Their alternative would need different foundations: that governing *is* learnable, that random rotation prevents corruption better than elections, and that legitimacy comes from resisting elite capture, not demographic quotas.  

  ...I'll structure this as:  
  1. Deconstructing the two legitimacy stories in current models  
  2. Mapping their contradictions (volunteers ≠ equal chance; mirroring ≠ true diversity)  
  3. Explaining why designers accept those gaps  
  4. Contrasting with the user's model's assumptions  
  5. Explicitly answering which story current practice leans on (mirroring) and which it abandons (equal chance)
answer: |-
  You've nailed the central tension in modern sortition practice – and your critique is philosophically sharper than most academic treatments. Let's dissect the implicit theories and contradictions:

  ### The Two Stories & Their Incompatibility
  1.  **The "Mirroring" (Descriptive Representation) Story:**
      *   **Presupposition:** A group is "representative" (and thus its output has legitimacy) if it statistically resembles the population on key demographic markers (age, gender, education, region, *sometimes* race).
      *   **What it Claims:** "This group *is* the people in miniature. Their collective judgment *is* what the people would decide under ideal conditions (information, deliberation)."
      *   **Commitments:** The value lies in the *outcome* (the recommendation) reflecting diverse perspectives *because* the group contains demographically diverse people. Legitimacy comes from the group *looking like* us.
      *   **Problems the Practice Reveals:**
          *   **Volunteer Filter:** Actively *breaks* mirroring. Volunteers are *not* a random slice; they skew towards higher education, civic engagement, political interest, and spare time. This fundamentally undermines the claim that the group *is* "the people." The practice accepts this because it's pragmatically necessary, revealing the theory isn't strictly held.
          *   **Expert/Facilitator Input:** Acknowledges the group *doesn't* inherently possess sufficient knowledge or skill. The "people's wisdom" needs significant scaffolding.
          *   **Advisory Output:** Implicitly concedes the group's judgment, even after mirroring and deliberation, isn't *bindingly* legitimate or sufficiently skilled for final decision-making. The mirror provides *input*, not final authority.

  2.  **The "Equal Chance" (Pure Lottery Fairness) Story:**
      *   **Presupposition:** Political legitimacy arises from the *procedure* itself – everyone has an equal, random chance of being selected. It embodies radical equality and rejects elite claims to inherent superiority.
      *   **What it Claims:** "This process is fair *to everyone*. The outcome is legitimate because *anyone* could have been in the room, not because the room perfectly mirrors demographics."
      *   **Commitments:** The value lies in the *process* (random selection) guaranteeing fairness and equality of opportunity. Legitimacy comes from the *chance* you *could* have been there.
      *   **Problems the Practice Reveals:**
          *   **Volunteer Filter:** *Shatters* this story. "Equal chance" only applies to those who *opt-in*. It becomes "equal chance *among the willing*," which is fundamentally different. This reveals the practice prioritizes feasibility over theoretical purity.
          *   **Expert/Facilitator Input:** Raises questions about whose voice is truly dominant. Does the expert framing overpower the "raw" citizen perspective the lottery was meant to capture?
          *   **One-off Groups:** Undermines the idea that *any* citizen can step into the role effectively. It treats the role as a temporary, facilitated discussion, not genuine governing.

  ### Which Story Wins? Which is Abandoned?
  *   **The Real-World Practice Leans HEAVILY on "Mirroring":** Despite the volunteer filter, the intense focus on demographic quotas shows organizers *need* the group to *look* representative to sell its legitimacy to the public and politicians. The "equal chance" ideal is sacrificed at the altar of practicality and the perceived need for demographic optics. The output legitimacy hinges on "this *looks like* you."
  *   **The Real-World Practice Abandons Core "Equal Chance":** By accepting volunteers, it explicitly rejects the radical egalitarianism of pure lottery. It acknowledges that forcing participation is politically impossible and that only a subset is willing/able. The "fairness" claim becomes rhetorical, not operational.

  ### Implicit Theories About Governing & Legitimacy in Current Practice
  1.  **Representation:** Defined *descriptively* (demographics), not *substantively* (acting in your interest) or *authorization* (being elected). The group *is* legitimate because it *looks like* the population, not because it was authorized by them or necessarily acts like them.
  2.  **Governing Skill:** A complex mix:
      *   **Ordinary Citizens:** Possess "common sense" and "lived experience" valuable for *identifying problems* and *values*, but *lack* the specific knowledge and cognitive frameworks for complex policy design.
      *   **Experts:** Possess the necessary technical knowledge and analysis skills. Their role is *essential* to bridge the gap between citizen values and feasible policy.
      *   **Facilitators:** Essential for managing group dynamics, ensuring fair discussion, and guiding the process – skills citizens aren't assumed to have innately.
      *   **Commitment:** Governing well requires *short-term, intensive training/support* (the "weekends"). It does *not* assume governing is an innate skill, nor that long-term skill development is desirable for citizens (hence one-off groups).
  3.  **Legitimacy of Binding Decisions:** The practice **avoids** this question entirely by being advisory. The *implicit* theory is stark: **The output of even a well-constructed sortition panel lacks the inherent legitimacy to bind the population.** Its legitimacy is:
      *   **Derivative:** It gains force only if elected officials (whose legitimacy comes from authorization via election) choose to adopt it.
      *   **Persuasive:** Its legitimacy rests on the perceived quality of the *process* (mirroring + deliberation + expertise) making the recommendations *compelling*, not on any inherent right of the group to decide.
      *   **Input, Not Output:** The panel provides valuable *input* into the *existing* (electoral) system of legitimacy, not a replacement for it.

  ### How Your Daydream Version Changes the Presuppositions
  Your model presupposes radically different, and arguably more consistent, theories:
  1.  **Representation:** Leans towards "Equal Chance" *enforced* (mandatory service?). Legitimacy comes from the *procedure* (random selection + rotation) ensuring no permanent elite, giving everyone a tangible stake. Descriptive mirroring is less crucial – the *process* guarantees fairness over time.
  2.  **Governing Skill:** Presupposes governing *is* a skill that **can and should be learned by ordinary citizens** through *sustained experience*. Six years allows deep learning, institutional memory development, and independence from permanent bureaucrats/lobbyists. Experts become advisors *to* citizen-legislators, not shapers of the process.
  3.  **Legitimacy of Binding Decisions:** Presupposes a body selected by lot *can* have the inherent authority to make binding laws. Legitimacy stems from:
      *   **Radical Procedural Fairness:** Equal chance + rotation.
      *   **Independence:** No re-election incentive, ban on future office – decisions are (theoretically) for the common good, not careerism.
      *   **Embedded Experience:** The body develops its *own* expertise and institutional memory.
      *   **Hybrid Model:** Combining with election acknowledges different sources of legitimacy/experience but grants the allotted body *equal* binding power. It assumes both sources contribute essential legitimacy.

  ### Conclusion: The Real-World Compromise
  Current sortition practice is fundamentally **advisory, descriptive representation theater**. It presupposes:
  *   Legitimacy ultimately resides *only* in elected officials.
  *   Citizen judgment is valuable *input* but requires heavy expert/facilitator curation to be useful.
  *   Descriptive mirroring (even flawed by self-selection) is the *best available* proxy for "the people's voice" in a practical context.
  *   The "equal chance" ideal is noble but impractical; volunteerism is an acceptable compromise sacrificing theoretical purity for feasibility.

  **It leans entirely on the "Mirroring" story for its output legitimacy** while paying lip service to the "Equal Chance" story for its initial appeal. The volunteer filter proves it doesn't truly believe in or commit to the radical egalitarianism of pure lottery. Your daydream version exposes this compromise and demands a practice that either commits fully to "Equal Chance" (via mandatory service?) or finds a more honest justification for the volunteer-based, expert-driven, advisory model it currently employs. The incompatibility you spotted is real, and practice has chosen demographics over radical equality.
