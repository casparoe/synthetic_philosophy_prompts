  So the ratio of the weights might be:

    weight(black raven) / weight(white shoe) ≈ [ |U| / |R| ] / [ |U| / (|U| - |B|) ] = (|U| - |B|) / |R|

  But note: |U| is very large compared to |B| and |R|? So |U| - |B| ≈ |U|? Then the ratio becomes |U| / |R|, which is huge. So one black raven is worth about |U|/|R| white shoes.

  But this is a rough estimate. In practice, we don't know |R| and |B|. So we use representative sampling.

  (b) Machine-checked proof:

  If we have a machine-checked proof of the invariant, then we know the invariant holds for all inputs. Then the paradox evaporates because we don't need evidence from examples. The proof covers all cases.

  But the paradox is about confirmation by evidence (which is inductive) versus proof (which is deductive). In the context of testing, we are in the inductive setting: we don't have a proof, so we rely on tests. The paradox is about the relationship between two logically equivalent statements in an inductive context. So if we have a proof, then we are not in the inductive context. Therefore, the paradox does not survive for an agent holding a proof.

  (c) Which premise is inexpressible?

  The premise that "logically equivalent hypotheses are confirmed by exactly the same evidence" is the one that the testing vocabulary might challenge. In testing, the evidence (test cases) are not just about the logical content of the hypothesis but also about the way the hypothesis is tested (the oracle) and the coverage of the test cases. So we would say that the same test case (the white shoe) may be used in two different oracles (A and B) and in one it is vacuous (and hence not evidence) and in the other it is non-vacuous (and hence evidence). But note: the evidence is not just the test case but the test case together with the oracle. Therefore, the premise that the evidence is the same is not true in the testing framework: the evidence is the test case and the outcome (pass/fail) in the context of a particular test (oracle).

  Also, the testing framework naturally incorporates the idea of the relevance of a test case to the hypothesis (via coverage and mutation). So the premise that the white shoe confirms the raven hypothesis is rejected because the white shoe does not cover the critical part of the invariant (the raven part) and does not help catch the relevant mutations.

  (d) Projectibility vs. coverage:

  The philosopher's point about projectibility (natural kinds) is that only predicates that are "natural" (like "raven") support inductive inference, and not arbitrary ones (like "non-black"). In our testing framework, we are saying that the oracle for A (which uses "raven") is a natural way to test the hypothesis, and the oracle for B (which uses "non-black") is less natural because it leads to vacuous tests for non-black non-ravens. And the coverage story says that the test for A focuses on the critical set (ravens) and the test for B focuses on a much larger set (non-black things) which is inefficient and uninformative for the raven hypothesis.

