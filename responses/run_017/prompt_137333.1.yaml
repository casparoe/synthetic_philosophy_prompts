answer: |-
  ### Translation of the Raven Paradox into Testing Vocabulary

  **Core Paradox Translation:**
  - **Hypothesis (H):** "All ravens are black" ↔ `assert is_raven(x) implies color(x) == BLACK`
  - **Contrapositive (H'):** "All non-black things are non-ravens" ↔ `assert color(x) != BLACK implies not is_raven(x)`
  - **Logical Equivalence:** H and H' are logically identical invariants. Both pass/fail on identical inputs.
  - **Evidence:** Passing test cases (e.g., a black raven or a white shoe).
  - **Absurdity:** A white shoe (non-black, non-raven) passes H' → it "confirms" H. Intuitively, this feels irrelevant.

  **Your Hunches Tested:**  
  1. **Oracle-Sensitivity of Confirmation (Hunch 1):**  
     - **Translation:**  
       - H's oracle: Only executes `color(x) == BLACK` **if** `is_raven(x) == true`.  
       - H''s oracle: Only executes `not is_raven(x)` **if** `color(x) != BLACK`.  
     - **White Shoe Behavior:**  
       - For H: White shoe skipped (not a raven) → **vacuous pass** (no code executed).  
       - For H': White shoe triggers assertion → **active pass** (code executed).  
     - **Result:** Evidence depends on **which oracle is instrumented**. The white shoe is inert for H but active for H', despite logical equivalence.  
     - **Why It Works:** Captures the paradox's core. Logically equivalent invariants behave differently under coverage-guided testing.  

  2. **Mutation Score Insight (Hunch 2):**  
     - **Translation:**  
       - Mutation = Weakened invariant (e.g., `all_ravens_black_except_albinos`).  
       - Test suite "confirms" H only if it **detects mutants** that violate H (e.g., a non-black raven).  
     - **White Shoe's Role:**  
       - Fails to detect mutants like `allow_white_ravens` (it's not a raven) → **mutation score = 0** for critical mutations.  
     - **Result:** Passing tests alone are insufficient; **detection capability** matters. The white shoe doesn't raise mutation score for H.  

  ---

  ### Residue Report: What Maps, What Distorts, What's Missing

  #### (a) Degree of Confirmation: Coverage vs. Sampling  
  - **Maps Cleanly:**  
    - "Degree of confirmation" ≈ **mutation score** (ability to detect broken invariants).  
    - "Input space sampling" ≈ **code coverage** (e.g., branch coverage over raven/non-raven paths).  
  - **Distortion:**  
    - Philosophy assumes uniform probabilistic priors; testing uses **structural/domain-aware sampling**.  
  - **Quantitative Insight (Your Query):**  
    - Evidential weight of one black raven ≈ `1 / |ravens|`.  
    - Evidential weight of one white shoe ≈ `1 / |non_black_things|`.  
    - To match one black raven's weight:  
      ```
      white_shoes_needed ≈ |non_black_things| / |ravens|
      ```  
      (e.g., if ravens are 0.1% of objects, 1 raven ≈ 1000 white shoes).  
    - **Caveat:** Assumes random sampling. Real tests use targeted input generation (e.g., fuzzers).  

  #### (b) Machine-Checked Proof: Does the Paradox Evaporate?  
  - **Translation:**  
    - Proof = Formal verification (e.g., Coq, TLA+).  
    - Tests = Heuristic sampling (e.g., QuickCheck).  
  - **Result:**  
    - With proof, H is deductively verified → **no need for confirmation** via evidence.  
    - **Paradox Survival:** Only relevant for **bounded testers** (no proof, finite samples). The white shoe remains irrelevant to H under any testing oracle.  

  #### (c) Inexpressible Premise: What Testing Vocabulary Refuses  
  - **Inexpressible Premise:**  
    > "Logically equivalent hypotheses are confirmed by exactly the same evidence."  
  - **Why Rejected:**  
    - Testing separates **logical equivalence** from **operational semantics**.  
    - H and H' have identical truth tables but:  
      - Different **code coverage** (white shoe covers H' but not H).  
      - Different **mutation detection** (white shoe useless for H-specific mutants).  
    - **Fundamental Clash:** Testing cares about *how* invariants are checked, not just equivalence.  

  #### (d) Oracle-Sensitivity vs. Projectibility  
  - **Your Claim:**  
    Oracle-sensitivity ≈ "Only natural-kind predicates (ravens) support confirmation."  
  - **Where They Align:**  
    - Both reject white shoe as evidence for H.  
    - Both argue ravens are "special" (natural kind / high-coverage target).  
  - **Where Coverage Adds Value:**  
    1. **Quantifies Irrelevance:**  
       - White shoe's coverage: `0` for H's critical path (raven-check).  
       - Mutation score: `0` for H-specific mutants.  
    2. **Generalizes Beyond Semantics:**  
       - Applies to any invariant (e.g., `if user.is_admin() then require_2FA()`).  
       - No need for "natural kind" metaphysics; **code coverage suffices**.  
    3. **Actionable Guidance:**  
       - "Focus tests on **antecedent triggers** (ravens) to raise mutation score."  

  ---

  ### Key Takeaways  
  1. **Paradox Resolved in Testing Terms:**  
     - White shoe irrelevant to H due to **vacuous pass** and **zero mutation score impact**.  
     - Oracle-sensitivity explains absurdity: Evidence is **execution-dependent**.  
  2. **Testing Vocabulary Strengths:**  
     - Reveals **hidden structure** (coverage paths, mutation targets).  
     - Provides **metrics** (mutation score, coverage) to quantify evidence quality.  
  3. **Limitations:**  
     - Cannot express "degree of belief" (philosophy's `P(H|E)`).  
     - Assumes **invariant is code**; philosophy handles abstract propositions.  

  **Final Verdict:** Your hunches hold. The paradox dissolves when evidence requires **executing relevant code paths** and **detecting meaningful mutants**. Testing doesn't just restate philosophy—it operationalizes it.
