answer: |-
  ### Exam Question

  **Truth Theories and Circular Sentences**  
  *Answer all parts. Total marks: 25. Time: 45 minutes.*

  #### Context
  Consider a language with:
  - Its own truth predicate "is true",
  - A name for each of its sentences (e.g., "(A)" names sentence A),
  - A factual sentence "snow is white" that is determinately true (assume snow is white).

  We examine two sentences:  
  (A) "The sentence (B) is not true."  
  (B) "Either the sentence (A) is not true, or snow is white."

  #### Theories to Evaluate
  1. **Tarskian hierarchical theory**: Truth is stratified into levels. A sentence at level *n* can only ascribe truth to sentences at levels *< n*. No sentence can contain a truth predicate applying to itself or to a sentence at its own level or higher.  
  2. **Kripke’s minimal fixed point with Strong Kleene evaluation**:  
     - Truth values: true (T), false (F), undefined (U).  
     - Minimal fixed point: Built by iteratively assigning truth values until no further assignments can be made. A sentence is *grounded* if assigned T/F; *ungrounded* if U.  
     - Strong Kleene truth tables:  
       - Negation: ~T = F; ~F = T; ~U = U.  
       - Disjunction: T∨T = T; T∨F = T; F∨T = T; F∨F = F; T∨U = T; U∨T = T; F∨U = U; U∨F = U; U∨U = U.  
       (A disjunction is T if at least one disjunct is T, even if the other is U; otherwise, it is F or U.)  
  3. **Kripke’s minimal fixed point with Weak Kleene evaluation**:  
     - Truth values and minimal fixed point as above.  
     - Weak Kleene truth tables:  
       - Negation: ~T = F; ~F = T; ~U = U.  
       - Disjunction: If *any* disjunct is U, the disjunction is U (even if another disjunct is T/F). Otherwise, standard: T∨T = T; T∨F = T; F∨T = T; F∨F = F.  

  ---

  **Part 1: Verdicts (5 marks)**  
  For each theory, state the truth value or status of (A) and (B):  
  - For Tarskian theory: Can the sentences be expressed? If not, explain why.  
  - For Kripkean theories: Assign T, F, or U (ungrounded). If U, specify it is ungrounded.  

  **Part 2: Kleenean Disagreement (12 marks)**  
  Both Kleenean theories assign U (ungrounded) to the ordinary Liar sentence (e.g., "This sentence is false"). Yet for (A) and (B), they disagree.  
  - Explain why the disagreement arises, focusing on how ungroundedness propagates.  
  - What does this reveal about how each scheme handles sentences mentioning ungrounded components?  
  - What consideration (e.g., about disjunction’s meaning or groundedness) could resolve this disagreement without merely restating truth tables?  

  **Part 3: Revenge Problem (8 marks)**  
  The strengthened Liar paradox highlights that gap theories (like Kripke’s) may be unable to state, *in the object language*, that pathological sentences are "not true."  
  - For each Kleenean theory, can the object language express that (A) is not true? Explain why/why not.  
  - What does this case show about the revenge problem? Does it strengthen, weaken, or complicate the challenge?  

  ---

  ### Model Answer (700 words)  

  **Part 1: Verdicts**  
  - **Tarskian hierarchical theory**: (A) and (B) cannot be expressed. Both contain truth predicates that create a loop: (A) ascribes truth to (B), and (B) ascribes truth to (A). Assigning levels would require (B) to be below (A) (since (A) refers to (B)) and (A) below (B) (since (B) refers to (A)), an impossibility.  
  - **Strong Kleene minimal fixed point**: (B) is true (T), (A) is false (F). (B) is a disjunction with "snow is white" (T) as its second disjunct. Strong Kleene assigns T to a disjunction if one disjunct is T, even if the other (here, "(A) is not true") is ungrounded (U). Thus, (B) is grounded and T. (A) claims "(B) is not true," but since (B) is T, ~T = F. Thus, (A) is grounded and F.  
  - **Weak Kleene minimal fixed point**: Both (A) and (B) are ungrounded (U). (B)’s first disjunct ("(A) is not true") depends on (A), which depends on (B). Initially, both are U. Weak Kleene assigns U to any disjunction with a U disjunct, even if another (e.g., "snow is white") is T. Thus, (B) is U. (A) then remains U since it depends on (B)’s U value. The loop stabilizes with both U.  

  **Part 2: Kleenean Disagreement**  
  The ordinary Liar is U in both Kleenean schemes because self-reference forces a truth-value gap. Here, disagreement arises due to how each scheme propagates ungroundedness through disjunction. (B) contains a factual truth ("snow is white" = T) and a component ("(A) is not true") that is initially U due to circularity.  

  - **Propagation difference**:  
    - In Strong Kleene, disjunction is "truth-preserving": if one disjunct is T, the whole is T, *even if the other is U*. Thus, (B)’s T disjunct overrides the U component, making (B) grounded and T. This breaks the loop: (A) then evaluates to F.  
    - In Weak Kleene, undefinedness is "infectious": any U component forces the whole compound to U. Thus, (B)’s U disjunct infects the disjunction despite the T disjunct, leaving (B) U. (A) stays U, spreading ungroundedness.  

  This reveals a key contrast: Strong Kleene limits ungroundedness to sentences directly involved in loops, allowing factual content to "ground" compounds. Weak Kleene lets ungroundedness spread to any sentence mentioning a U component, prioritizing truth-functionality over grounding.  

  - **Resolving the disagreement**: The core issue is how disjunction should behave with partial information. Strong Kleene reflects an "open-world" intuition: if we know one disjunct is T, the disjunction is T, even with incomplete information. Weak Kleene reflects a "compositional" intuition: a sentence’s value depends on fully defined parts; undefined inputs yield undefined outputs. To decide, we might ask: Does disjunction require both disjuncts to be truth-apt? If "yes," Weak Kleene is justified; if "no," Strong Kleene better captures natural reasoning (e.g., "Either the Liar is false or snow is white" feels true). Groundedness maximization (favoring Strong Kleene) versus error-avoidance (favoring Weak Kleene) could also guide this. Crucially, this must appeal to semantic principles (e.g., disjunction’s meaning) or practical goals (e.g., minimizing gaps), not just restate truth tables.  

  **Part 3: Revenge Problem**  
  - **Strong Kleene**: Yes, the object language can express that (A) is not true. Sentence (B)’s first disjunct ("(A) is not true") is exactly this claim. Since (A) is F, "(A) is not true" is T (as ~F = T). Thus, the theory can assert (A)’s non-truth truthfully, avoiding revenge for (A).  
  - **Weak Kleene**: No, the object language cannot consistently express that (A) is not true. The expression "(A) is not true" (e.g., as (B)’s first disjunct) is itself ungrounded (U) because (A) is U. Thus, it cannot be truly asserted—any such claim becomes U and "not true" in the metatheory, but this cannot be stated in the object language without repeating the problem.  

  This complicates the revenge problem. For Strong Kleene, factual disjuncts can "ground" pathological sentences, enabling object-language truth ascriptions (here, for (A)). This suggests revenge is solvable in cases where pathology is "contained" by grounded content. For Weak Kleene, the infectious spread of ungroundedness blocks such assertions, perpetuating revenge. The case shows revenge depends on the evaluation scheme’s propagation rules: Strong Kleene’s leniency mitigates revenge here, while Weak Kleene’s strictness exacerbates it. However, it does not fully resolve revenge, as other pathological sentences (e.g., a Liar with no factual component) remain problematic for both.  

