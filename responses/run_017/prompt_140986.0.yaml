  ### Marking Scheme (25 marks total)  
  *Key: A = Full credit (precise, complete reasoning); B = Partial credit (vagueness, minor errors, incomplete). Common mistakes listed per point.*

  **Part 1: Verdicts (5 marks)**  
  1. **Tarskian verdict (1 mark)**  
     - A: States sentences cannot be expressed due to level-loop contradiction.  
     - B: Says "not expressible" without explanation, or incorrectly assigns truth values.  
     *Common mistake: Assumes hierarchy allows circular sentences and assigns U/F.*  

  2. **Strong Kleene verdicts (2 marks: 1 for (B)=T, 1 for (A)=F; both grounded)**  
     - A: Correct values and grounded status.  
     - B: Correct values but omits grounded status, or confuses (A)/(B).  
     *Common mistake: Claims (B) is U due to circularity, ignoring T disjunct.*  

  3. **Weak Kleene verdicts (2 marks: 1 for each U/ungrounded)**  
     - A: Both U and ungrounded.  
     - B: One incorrect (e.g., (B)=T via snow), or omits ungrounded.  
     *Common mistake: Assumes (B) is T because snow is white, ignoring infection.*  

  **Part 2: Kleenean Disagreement (12 marks)**  
  4. **Origin of disagreement (5 marks)**  
     - A: Explains Strong Kleene overrides U with T in disjunction, breaking loop; Weak Kleene lets U infect disjunction despite T. Uses truth tables and iterative process.  
     - B: Notes propagation difference vaguely (e.g., "handles undefined differently").  
     *Common mistake: Treats both schemes as identical or misstates tables (e.g., "Weak Kleene ignores T disjunct").*  

  5. **Propagation revelation (4 marks)**  
     - A: Contrasts Strong Kleene (limits ungroundedness via truth preservation) with Weak Kleene (spreads ungroundedness via compositionality).  
     - B: Only describes the verdicts, not the broader mechanism.  
     *Common mistake: Equates ungroundedness with falsity or paradox.*  

  6. **Resolving disagreement (3 marks)**  
     - A: Probes disjunction’s semantics (e.g., truth with partial info) or groundedness goals, without restating tables.  
     - B: Vague (e.g., "depends on the theory") or just restates truth tables.  
     *Common mistake: Asserts one scheme is "correct" without justification.*  

  **Part 3: Revenge Problem (8 marks)**  
  7. **Strong Kleene on revenge (3 marks)**  
     - A: Notes "(A) is not true" is T (via (B)’s disjunct), so object language expresses it truthfully.  
     - B: Says "no revenge" but lacks explanation, or claims expression is U.  
     *Common mistake: Ignores (B)’s disjunct and declares all pathology inexpressible.*  

  8. **Weak Kleene on revenge (3 marks)**  
     - A: Explains "(A) is not true" is U (due to infection), so object language cannot assert it truly.  
     - B: Says "cannot express" without linking to ungroundedness.  
     *Common mistake: Treats U as F, allowing false expression.*  

  9. **Revenge implication (2 marks)**  
     - A: Notes revenge is scheme-dependent: Strong Kleene mitigates via grounding; Weak Kleene perpetuates via infection. Complicates but doesn’t resolve revenge.  
     - B: Overgeneralizes (e.g., "all gap theories fail").  
     *Common mistake: Claims this "solves" revenge universally.*
