prompt: |-
  ok so pretend you're like a professional moral philosopher who's spent way too long on this exact question, and actually think it through carefully instead of giving me something balanced-sounding — like, brainstorm three or four candidate principles first, throw out the weak ones, then commit to whichever one you think survives. And please don't give me reading lists or names of papers or anything, I can't look any of that up and it wouldn't help me anyway.

  Some context: I'm a junior, I lifeguard at the town pool in the summer, and I'm in this ethics-club thing at school and we got into a massive argument at lunch about whether the numbers count. Like, if you can rescue one person or five people, do you have to save the five? My teacher mentioned that some philosopher (don't bother naming him) apparently thinks you should just flip a coin, which sounded insane to everyone at the table but I couldn't explain why. So here are my actual gut reactions, and I want to know what rule I'm accidentally using. (1) One stranger on a raft vs five strangers on another raft, everyone roughly the same age, everyone fine afterward: save the five, obviously, not even close. (2) Same thing but the one person is my best friend: I'd save my friend, and I don't think anyone should call me a bad person for it — but I can't say why that's different from (1), since the five are all someone's best friend too. (3) One vs two: I'd save the two, but a coin flip feels totally fine and I wouldn't judge someone who saved the one. (4) A million vs 999,999: coin flip feels fine, like the extra one life does literally nothing for me there, which I realize contradicts (1) because it's still one extra person. (5) Five people who each have a 20% chance of dying vs one person who's definitely going to die, you can only help one side: I'd go for the one certain person, and a lottery among all six feels wierd to me here. (6) If saving the five means steering away from the one, fine, I steer to the five — but if it means shoving the one guy off the raft with my own hands so the five can hold on, I don't think I could do it, even though it's the same five lives either way. (7) When I'm on duty as a lifeguard and it's my friend vs five kids I don't know, I feel like I'd have to go to the five, and picking my friend would be, like, corruption — but off the clock I'd save my friend no question. (8) The one is right in front of me screaming and the five are a mile away in a totally separate accident and I'd have to drive right past the one: I think I'd still go to the five, the fact that it's not the same accident doesn't seem to matter. My half-baked rule was "numbers count, but only when the gap is big relative to the total, and only when I'm not personally close to someone and not personally killing them" — which I can already tell is a mess.

  Can you test that rule against my cases, fix it or replace it, and give me the end result stated precisely enough that I could apply it to a case I haven't thought about, telling me which of my verdicts each part of the rule is there to save? I also want the short version I could actually say out loud at lunch. And please be honest about which of my verdicts no decent principle can keep — if I have to drop one, tell me which and why. The one I keep going back and forth on: same as (2), but it's my friend vs five strangers and I'm the one on duty, so the relationship and the job are pulling in opposite directions. What does whatever principle you land on say about that, and does it feel right to you or does it make you suspicious of the principle itself?
reasoning: |-
  Okay, this user is a junior in high school who lifeguards and is in an ethics club. They're grappling with the moral dilemma of whether numbers matter in rescue scenarios. They provided eight specific cases with their gut reactions, and they want a clear, precise principle that explains their intuitions without academic jargon. 

  First, I need to unpack their core conflict: they instinctively prioritize numbers in some cases (like 1 vs 5 strangers) but abandon that when personal relationships, proximity, or direct harm are involved. Their self-proposed "half-baked rule" is messy because it tries to cram too many exceptions. 

  Looking at their cases, pattern recognition jumps out: 
  - Threshold effect: They care about proportional gaps (1 vs 2 feels coin-flippable, 1 vs 5 doesn't). 
  - Agent-relative duties: Personal ties create special obligations (saving a friend trumps 5 strangers). 
  - Proximity matters less than expected—they'd still save distant groups. 
  - Role morality sharply overrides personal ties (lifeguard duty vs friend). 
  - Physical involvement triggers deontological brakes (shoving vs steering away feels different even with same outcome). 

  The million vs 999,999 case is particularly revealing—it exposes their intuitive grasp of diminishing marginal utility in moral weight. That one extra life doesn't "feel" significant at scale, which suggests their brain isn't just counting raw numbers but evaluating moral urgency through some lens of proportional impact. 

  For the lifeguard/friend conflict, their gut says duty wins—but they're uneasy. That tension is actually healthy: it reflects how professional roles create impartiality requirements that temporarily suspend personal ethics. If I build a principle that honors that, it needs a "when acting in institutional capacity" clause. 

  The hardest tension is case 6 (steering vs shoving). Their aversion to direct harm even for greater good screams "doctrine of double effect"—a classic deonto move. Any principle I propose must distinguish intended vs foreseen harm without getting wordy. 

  ...Time to kill some darlings. Their "save the certain death over 5x20% risk" intuition contradicts straightforward utilitarianism, but it's coherent if we think in terms of moral phenomenology—a guaranteed rescue feels more urgent than statistical lives. I'll preserve that by framing obligations around "addressable harm" rather than expected utility. 

  Final principle needs to: 
  1. Quantify thresholds simply (e.g., "significantly greater") 
  2. Preserve agent-relative permissions 
  3. Handle role-based obligations 
  4. Forbid intended harm 
  5. Ignore proximity unless affecting outcomes 

  ...And crucially, admit where intuitions clash. Their friend-vs-five-while-on-duty case will expose whether the principle feels lived-in or robotic. If it says "save the five" but they still squirm, that's a feature—it means we've captured moral complexity rather than oversimplified it. 

  The "short version" must pass the lunchroom test: no jargon, one breath, defensible but not preachy. "Save more lives unless you'd have to directly kill someone or betray someone counting on you personally" gets close—but needs the threshold piece. Maybe: "When lots more lives are at stake, save the group—but never kill one to save others, and protect those you love unless your job forbids it." 

  ...Still clunky. Back to workshop it.
answer: |-
  Here's a brutally honest dissection of your intuitions, built step-by-step. I'll start by brainstorming candidate principles, murder the weak ones, then commit to the survivor. Your cases are the guillotine—if a principle can't explain most of them without cheating, it dies. No citations, no platitudes.

  **Brainstorm Phase: Four Candidate Principles**  
  1. **Simple Utilitarianism**: Always maximize lives saved. Period.  
  2. **Threshold Utilitarianism**: Save the greater number *only if* the difference exceeds some threshold (e.g., 1 vs. 2 is trivial, 1 vs. 5 is significant).  
  3. **Agent-Relative Permissions**: You may permissibly favor yourself, loved ones, or avoid direct harm—even if it costs lives overall.  
  4. **Role-Constrained Utilitarianism**: Duty (like lifeguarding) suspends personal privileges—maximize lives when "on the clock."

  **Execution Phase: Killing the Weak**  
  - **Simple Utilitarianism dies first**. It fails (2) (saving your friend), (3) (coin flip for 1 vs. 2), (4) (million vs. 999K), (6) (shoving the one guy), and (7) (off-duty saving your friend). Corpse.  
  - **Threshold Utilitarianism limps**. Explains (1), (3), (4), (8)... but fails (2) (friend exception), (6) (shoving prohibition), and (7) (role matters). Mortally wounded.  
  - **Agent-Relative Permissions survives**. Explains (2), (6) (avoids direct killing), (7) (off-duty exception). Needs support for duties and thresholds.  
  - **Role-Constrained Utilitarianism survives**. Explains (7) (on-duty obligation), (1), (8). Ignores personal ties and threshold doubts.  

  **Synthesis: The Victorious Principle**  
  **Agent-Centered Threshold Obligation with Role Constraints**:  
  > *"You must save the greater number if the difference is significant (threshold), unless doing so requires you to directly cause harm or violate a personal relationship. Institutional duties (e.g., lifeguarding) override personal privileges and impose a stricter threshold."*  

  **Testing Against Your Cases**  
  - **(1) Save 5 vs. 1 strangers**: *Threshold met (5>1 is significant), no relationship/direct harm → save 5.*  
  - **(2) Save friend vs. 5 strangers**: *Threshold met, but personal relationship exception → permissible to save friend.*  
  - **(3) 1 vs. 2: coin flip fine**: *Threshold not met (difference trivial) → no obligation, coin flip allowed.*  
  - **(4) Million vs. 999,999: coin flip fine**: *Threshold not met (1 life insignificant vs. total) → no obligation.*  
  - **(5) Save 1 certain death vs. 5×20% risk**: *Threshold not met (expected lives saved: 1 vs. 4 saved? Too close). Saving the certain death isn't irrational—addressing certain harm feels urgent, but the rule permits either.*  
  - **(6) Steer to 5: ok, but shoving one: forbidden**: *Direct harm prohibition kicks in (shoving is killing, steering is letting die) → may not shove.*  
  - **(7) On-duty: save 5 kids over friend; off-duty: save friend**: *Duty overrides relationship exception on-duty → save 5. Off-duty, relationship exception applies → save friend.*  
  - **(8) Drive past one to save distant 5**: *Threshold met, no direct harm/relationship → save 5. Proximity irrelevant if you can still act.*  

  **Where Your Intuitions Must Die**  
  Your verdict in **(5)** (save the certain death over 5×20% risk) is the weakest. The principle *allows* it (threshold not clearly met), but it’s inconsistent with **(1)**. If 5 lives > 1 always when significant, expected utility should favor the five 20%-risk people (expected lives saved: 4). **You have to drop (5) or admit it’s emotional, not principled.** The "certain death" feels heavier, but that’s bias—philosophically, it’s shaky.  

  **The On-Duty/Friend Conflict (Your Final Q)**  
  The principle says: **On-duty, save the five strangers**. Duty suspends personal privileges, and threshold (5>1) is significant. Off-duty, save your friend.  
  - *Does it feel right?* Yes—duty creates an impartiality requirement. Choosing your friend as a lifeguard *is* corruption; it abuses your role.  
  - *Suspicious of the principle?* Only if you reject that roles create moral asymmetry. But your intuition in (7) already accepts this.  

  **Short Version for Lunch**  
  > *"Save the bigger group when it’s a big difference—like five versus one—unless you’re killing someone directly or it’s someone you love. But if it’s your job to save lives, you gotta be fair and pick the bigger group, even if your friend’s in the smaller one. For tiny differences? Flip a coin."*  

  **Why This Works**  
  - **Threshold** rescues (1), (3), (4), (8).  
  - **Agent-Relative Permissions** rescues (2), (6), (7-off-duty).  
  - **Role Constraints** rescue (7-on-duty).  
  - **Direct Harm Prohibition** rescues (6).  

  **Brutal Truth**: Your gut isn’t perfect—**(5)** is sentimental. But the core structure holds. Now go win that lunch argument.
