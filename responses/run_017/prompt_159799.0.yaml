prompt: |-
  hey — I run a small weekly forecasting group (mostly people from the local EA / rationalist scene) and we keep hitting the same stalemate: two people have read each other's writeups, dumped all their private evidence into a shared doc, argued in the comments, and are still at, say, 10% vs 40% on some AI-timeline-ish question. Aumann's agreeeing-to-disagree result keeps getting invoked, so I've been trying to turn it into an actual protocol we can run in the room — call it the Common Prior Protocol. The steps are: (1) the common prior assumption says that two otherwise rational people can only disagree because of different private information, never because of different priors; (2) so once everything is in the shared doc, we've effectively got common knowledge of each other's posteriors; (3) so any gap that survives must be irrationality somewhere, and the remedy is mechanical — whoever has less private information just adopts the other person's number, since the other person's posterior already contains their evidence plus more.

  I want to run this at the next meetup but I suspect it's cheating in a couple of places, and I'd rather find out now then in front of twelve people. Where exactly does step (2) go wrong — is "we've both read the doc" anywhere near what the theorem needs, or is the condition something stronger that a shared folder just doesn't deliver? Is step (1) even the kind of claim you can apply to real people, or is it a modelling assumption about how one analyst represents a situation, in which case my whole diagnostic use of it is confused? And what about step (3) — if I learn your posterior, does conditioning actually move me all the way to your number, or somewhere else entirely, and is "whoever knows less defers" anywhere close to the right rule?

  Please give me a committed answer, not a survey: tell me plainly which steps are broken and how, whether any version of the protocol survives, and what you'd actually have us do in the room instead — including whether, if the honest conclusion is that the prior genuinely isn't shared, that should change how much we defer to each other at all.
reasoning: |-
  Okay, let me start by unpacking the user's query. They run a forecasting group and are stuck with persistent disagreements even after sharing evidence. They reference Aumann's theorem and propose a "Common Prior Protocol" to resolve this. The core idea is that once all information is shared, any remaining disagreement must be irrational, so the less informed person should adopt the other's probability.

  First, I need to recall Aumann's agreement theorem. It states that two rational agents with a common prior cannot agree to disagree if their posteriors are common knowledge. The user's step (2) claims that sharing a doc and reading it creates common knowledge. But common knowledge is stricter: everyone knows, everyone knows that everyone knows, and so on ad infinitum. A shared doc doesn't guarantee that. Each person might have doubts about whether the other fully understood or believed the evidence. So step (2) is flawed because common knowledge isn't achieved just by sharing a document.

  Next, step (1) assumes a common prior. But in reality, people don't share the same priors. Their backgrounds and experiences shape different initial beliefs. Applying the theorem as if priors are shared ignores this. The user might be treating the common prior as a given, but it's more of a theoretical assumption. Real disagreements often stem from differing priors, not just private information. So step (1) is problematic because it doesn't account for actual prior differences.

  Step (3) suggests that the less informed person should defer. But learning the other's posterior doesn't mean you should adopt their number. Conditioning on their posterior involves complex updates. Plus, "whoever knows less" is vague. Information isn't just additive; it's about interpretation. Deferring ignores that each person might value evidence differently. Also, irrationality isn't the only reason for disagreement. Different models or interpretations play a big role.

  The user's deeper needs include resolving deadlocks effectively and maintaining group cohesion. They want a practical method, not just theory. Their identity as a group leader means they need a protocol that's credible and easy to implement. The actual need might be for a structured way to synthesize perspectives without forcing consensus. They might also need to acknowledge legitimate differences to avoid frustration.

  Alternative approaches come to mind. Instead of assuming common priors, explicitly discuss priors. Use structured debates to surface model differences. Update probabilities step-by-step together. Assign confidence levels to evidence. Maybe use prediction markets or Bayesian tools. Focus on understanding why disagreement persists rather than eliminating it. This addresses the root causes and respects diverse viewpoints.

  In the room, I'd suggest techniques like Fermi estimates or sensitivity analysis. Explore which assumptions drive the gap. If priors differ, decide based on track records or expertise. The key is fostering learning, not just winning arguments. The protocol oversimplifies, but adjustments can make discussions more productive.
answer: |-
  Your "Common Prior Protocol" is a thoughtful attempt to operationalize Aumann's agreement theorem, but it fundamentally misapplies the theorem to real-world forecasting groups. **The protocol is broken in all three steps**, primarily because it ignores the theorem's most critical assumptions. However, a salvageable core idea exists, and I'll give you concrete steps for your meetup.

  ### Where Your Protocol Breaks Down

  1.  **Step (1) is False (for humans in practice): "The common prior assumption says that two otherwise rational people can only disagree because of different private information..."**
      *   **The Flaw:** The common prior is an *assumption* of the theorem, not a universal truth. Aumann *assumes* agents share the exact same prior probability distribution over the entire state space. In reality, humans **do not share common priors**. Our priors are shaped by vastly different life experiences, education, intuitions, and (often subconscious) metaphysical assumptions about how the world works (e.g., inherent risks of technology, human ingenuity, pace of progress). For AI timelines, priors on questions like "How hard is AGI?" or "How stable is recursive self-improvement?" differ wildly *before any evidence is seen*. The theorem *requires* common priors to conclude disagreement implies irrationality. Without it, disagreement is perfectly rational even with shared information.

  2.  **Step (2) is False: "...once everything is in the shared doc, we've effectively got common knowledge of each other's posteriors."**
      *   **The Flaw:** "Common knowledge" is *much* stronger than "shared and read." Common knowledge means not only does A know P, and B knows P, but A knows that B knows P, B knows that A knows P, A knows that B knows that A knows P, and so on ad infinitum. Simply putting evidence in a doc and reading it **does not establish common knowledge**.
          *   **Interpretation Gap:** A and B interpret the *same* piece of evidence differently. Did they truly "know" the other's interpretation?
          *   **Weighting Gap:** A and B assign different weights/significance to the same evidence. Did they internalize the other's weighting scheme?
          *   **Credibility Gap:** Does A fully trust that B has included *all* relevant private evidence? Or that B isn't misrepresenting? Does B trust A?
          *   **Understanding Gap:** Does A truly understand the *implications* B draws from the evidence? Does B understand A's?
          *   **Posteriors:** Knowing someone's *conclusion* (e.g., "I'm 40%") is not the same as common knowledge of their *entire posterior state of belief*, which includes all the reasoning chains, weightings, and interpretations that led to that number.

  3.  **Step (3) is False (and incoherent): "...any gap that survives must be irrationality... whoever has less private information just adopts the other person's number..."**
      *   **The Flaw:** This step collapses entirely because Steps 1 and 2 fail. The disagreement *cannot* be assumed irrational without a *true* common prior and *true* common knowledge of posteriors. Furthermore:
          *   **"Less Private Information" is Undefinable:** How do you measure "less"? Volume? Relevance? Salience? One person might have one crucial insight the other lacks, even if they have fewer documents. "Less information" is not a reliable guide.
          *   **Learning a Posterior ≠ Conditioning:** If you learn *only* that person B believes P(H) = 40%, this **does not tell you how to update your own belief**. Conditioning requires knowing the *evidence* B saw and the *model* B used to process it. Learning the *output* (40%) without the *process* tells you little about what *you* should believe. Your update depends entirely on *why* you think B believes 40% – is it because B saw evidence you missed? Because B interpreted shared evidence differently? Because B is irrational? Because B has a different prior? **The theorem requires common knowledge of *posteriors* to force agreement, but that agreement arises *from the logic of the theorem itself under its strict assumptions*, not from one agent arbitrarily adopting the other's number.**
          *   **"Irrationality" is Overstated:** Persistent disagreement is far more likely due to **legitimate differences in priors, models, interpretations, or weighting of evidence** than outright irrationality (though biases like motivated reasoning certainly play a role).

  ### Can Any Version of the Protocol Survive?

  **The *core idea* of forcing a structured update based on the other person's view is valuable, but it cannot be based on the flawed Aumann justification.** You need a protocol that *explicitly acknowledges* the likelihood of differing priors, models, and interpretations.

  ### What To Do In The Room: The "Model Bridge" Protocol

  Forget Aumann for operational purposes. Instead, focus on diagnosing the *source* of the disagreement. Here's a concrete protocol for your next meeting when two forecasters (A=10%, B=40%) are deadlocked after evidence sharing:

  1.  **State the Anchor & Gap:** "Okay, A is at 10%, B is at 40%. We've shared evidence. Let's understand *why* this gap persists."
  2.  **Surface Priors (Briefly):**
      *   Ask A: "Briefly, what core assumption or prior belief makes 10% feel right *even knowing B sees the same evidence but believes 40%*?" (e.g., "I believe AGI requires fundamentally new, unpredictable breakthroughs, so timelines are inherently long and uncertain.")
      *   Ask B: Same question. (e.g., "I believe we're on a predictable scaling curve with known components, so progress is reliable and faster.")
      *   **Goal:** Acknowledge priors differ. Don't debate them yet, just map them.
  3.  **Identify the Crux(es):** "Looking at the shared evidence, what *one or two key pieces* (or interpretations thereof) explain most of the gap between 10% and 40%?" Facilitate discussion to pinpoint the most divisive evidence points or assumptions. (e.g., "Does this new scaling result imply we can brute-force AGI? Or is it just incremental progress on narrow tasks?")
  4.  **Examine the Model:** "What simple model or mental equation is each of you using?"
      *   A: "My model: P(AGI by 2040) = P(Breakthrough Discovery) * P(Effective Scaling | Discovery). Breakthroughs are rare (prior), so even with scaling evidence, overall prob is low."
      *   B: "My model: P(AGI by 2040) = P(Current Trends Continue) * P(No Showstoppers). Trends look strong and continuous (based on evidence), showstoppers seem unlikely (prior), so prob is moderate."
      *   **Goal:** Make the implicit models explicit. This is where the real disagreement often lives.
  5.  **Joint Sensitivity Analysis:**
      *   Pick the most contentious assumption from Step 3 or 4. (e.g., "How likely is a fundamental breakthrough *really* needed?")
      *   **Ask A:** "B, if I convinced you that the probability of needing a fundamental breakthrough was actually 80% instead of your current estimate (say, 20%), where would your number go? What if it was 10%?"
      *   **Ask B:** "A, if I convinced you that the scaling trends *directly imply* components for AGI, making the probability of needing a new breakthrough only 20% instead of your 80%, where would your number go? What if it was 5%?"
      *   **Goal:** Quantify how much the disagreement hinges on specific judgments. Find where compromise might be possible or if beliefs are truly rigid.
  6.  **Update (Optional but Recommended):** Based on Steps 3-5, ask A and B: *"Has hearing this made you want to nudge your number? Even slightly? Why or why not?"* Don't force convergence. The goal is *understanding and incremental refinement*, not forced agreement.
  7.  **Group Synthesis (If Appropriate):** The group can discuss which models/assumptions seem more robust, whether the cruxes are resolvable with future information, or simply note the legitimate sources of disagreement. A group forecast might cautiously move towards the more compelling case *or* stay split, reflecting genuine uncertainty.

  ### Addressing Your Final Question: Deference and Non-Common Priors

  *   **Should differing priors change deference? Absolutely yes.** If you realize someone has a *consistently well-calibrated prior* on similar questions (e.g., B has a great track record on tech timelines), you *should* weight their posterior more heavily, *even knowing your priors differ*. Their different prior might be *better*.
  *   **Deference should be based on:**
      *   **Track Record:** Who is better calibrated on *this type* of question?
      *   **Domain Expertise:** Who has deeper relevant knowledge?
      *   **Reasoning Transparency:** Whose model and interpretations seem more robust, less biased, and better justified?
      *   **Explanatory Power:** Whose view better explains the totality of the evidence (even if you weight it differently)?
  *   **"Whoever knows less defers" is not a good rule.** Defer to the *better forecaster* or the *more compelling reasoning*, regardless of who initially had "more" private info. Information only matters through the lens of a good model.

  **Conclusion:** Your "Common Prior Protocol" fails because it ignores the core assumptions of Aumann's theorem: real people don't have common priors, and a shared doc doesn't create common knowledge. Forcing an update based on "less information" is arbitrary and unsupported. Instead, implement the "Model Bridge" Protocol. Focus on **surfacing priors, identifying cruxes, explicating models, and doing joint sensitivity analysis.** This respects legitimate disagreement while fostering genuine learning and potentially nudging beliefs. Deference should be earned through proven forecasting skill and robust reasoning, not an artificial rule based on a misapplied theorem. Good luck with the meetup!
