prompt: |-
  I chair the Clinical Priorities Committee of a regional hospital network — six hospitals, roughly nine hundred beds, a mix of urban and rural sites. We meet monthly for ninety minutes and we decide two kinds of thing. The first is standing allocation protocols: who gets the scarce dialysis places, how a short supply of a costly drug is rationed, which exceptions to the transplant waiting list we will endorse. The second, perhaps five or six times a year, is an individual case escalated to us, usually a request for a treatment we would not normally fund. Our members are two physicians, a nurse manager, a pharmacist, and a lay member. None of us has training in philosophy or in health economics. Every decision has to survive two audiences: it must be explainable in a one-page written rationale to the patient or family it burdens, and it must be defensible to a board that thinks mainly in terms of value for money. Anything with a budget impact above a set threshold requires the chief medical officer's counter-signature, and anything that reverses our own standing protocol goes to the board.

  Our working method is cost-effectiveness arithmetic. We estimate benefit in quality-adjusted units, sum across the people affected, and compare totals. It is transparent, it is auditable, and it is straightforwardly aggregative. Last year the daughter of a patient wrote to complain that we had treated her father as a unit in a calculation, and my own sense — which I have not been able to shake — is that the complaint identified something our method is structurally unable to register: that the gains and losses we add up fall on different people, and that a large sum of small benefits distributed across many does not by itself constitute an answer to the one person who is asked to bear something concentrated. The board has now asked us to build an explicit separateness check into our process.

  What I need from you is that check as a procedure rather than as a principle. Concretely: an ordered set of questions we can run in about twenty minutes of committee time on any proposal whose justification aggregates benefits and burdens across distinct patients; what counts as a sufficient answer to each; the points at which the procedure stops and returns a no; and the points at which it stops and hands the decision to a named person on the grounds that what remains is a judgment about values rather than a finding. I want it to be capable of actually biting, and I want the hand-off points to be honest rather than an escape hatch from every difficult case.

  Three of the tests I have in mind are these, and I would like you to build them, tighten them, or replace them if you can show they are the wrong instruments.

  First, an addressability test. The committee should have to state, in one sentence addressed to the person who bears the largest single-person loss, what that person is being asked to accept and why. The test should distinguish a reason that is genuinely a reason for that person — one that survives being generalized to everyone in their position — from a reason that only appears when the case is described from an impersonal standpoint, and whose entire content is that other people gain more.

  Second, a re-description audit. Before we sum, we should have to say what the units being summed are, and check whether they are persons or slots. A benefit described as life-years produced, cases detected, or readmissions averted is a benefit whose bearer has been made interchangeable; a benefit described as this patient's remaining years, or this patient's settled refusal being respected, is not. Where the ranking of options changes depending on which description we adopt, I want the procedure to say so and to rule on whether the slot-description is licensed.

  Third, a ratified-pool test. Aggregation within a single person's life — their own present burden traded against their own longer future — seems to me to raise a much weaker version of the worry than aggregation across lives. I also suspect that aggregation across people is least problematic where those people have in some sense authorized the conversion: they joined a scheme with published rules, they registered under a protocol they knew pooled风险 and benefit, they left an advance directive. My tentative view is that cross-person conversion without ratification is what stands in need of special justification, and that this gives the procedure a principled place to stop rather than a series of ad hoc thresholds. Tell me whether that is defensible and where it breaks.

  I also want a concentration threshold of some kind, but I do not know how to set or defend one, so tell me what the procedure should do when the largest single-person loss is severe and irreversible even though the aggregate favours proceeding.

  The hard cases the procedure must be able to process without collapsing: benefits and burdens falling on statistical rather than identified people; people who cannot be addressed at all, such as infants, patients with advanced dementia, or the unconscious; burdens falling on people who are not yet patients or not yet born; cases where the aggregative and non-aggregative answers diverge only because of how the benefit is described; genuine emergencies decided in minutes; and proposals where the same people appear on both sides of the ledger, so that a rule that protects them as losers also deprives them as winners.

  Then run the procedure on three of our actual recurring cases. One: closing a satellite dialysis unit that serves eleven named patients in a rural town, and redirecting the money to a screening programme that will, on the evidence, prevent a small number of deaths across a much larger population. Two: a request to fund an extremely expensive last-line therapy for one identified patient, where the same money would fund a nurse-led follow-up service that prevents many readmissions — I expect this is the case where the procedure will tell us something we do not want to hear, and I want you to let it. Three: a proposed rule for allocating a scarce drug during a shortage, under which expected benefit governs entirely and the fact that a candidate is already under this hospital's care, with an established clinical relationship, counts for nothing.

  Finally, I want a clear statement of what the procedure cannot do: which of its inputs are set by judgment rather than by the theory, how a committee without philosophical training should set and revisit them, where we should expect it to misfire or to be gamed by a clever re-description, and what brief minute we should record so that the board can audit that the check was run rather than accept our assurance that it was. Please argue for the view rather than survey it: no citations, no bibliography, and no references to particular papers or authors, since I have no library access and no way to check them.
reasoning: |-
  Okay, the user chairs a Clinical Priorities Committee in a regional hospital network, facing ethical dilemmas in resource allocation. They need a practical procedure to address the "separateness of persons" issue raised by a patient's daughter, where aggregating benefits across individuals ignores concentrated burdens on specific people. 

  Hmm, they've already identified three potential tests but want them refined into an actionable 20-minute checklist. The core tension is between utilitarian efficiency and individual rights - a classic problem in medical ethics without easy answers. 

  First, let's unpack their existing tests: The addressability test seems solid - if you can't justify the decision directly to the person bearing the loss, that's a red flag. The re-description audit is clever too; it exposes when we're dehumanizing patients into "slots." The ratified-pool concept is interesting but trickier - informed consent does mitigate ethical concerns, but how far does that extend? 

  *scratches head* The concentration threshold problem is thorny. How severe is "too severe" for an individual burden? Maybe we need to define irreversibility and lack of alternatives as key factors. 

  For the hard cases they mentioned: Statistical lives vs identified patients is ethically asymmetrical - we care more about known individuals. For non-communicative patients, advance directives or surrogate decision-makers become crucial. Future generations? That's a rabbit hole... perhaps stick to existing frameworks like discount rates. 

  *checks watch* Right, time pressure matters. In emergencies, we might need a "break glass" simplified version. And when people are on both sides of the ledger? That actually strengthens the aggregation argument. 

  Now for their real-world cases... 
  - Closing the dialysis unit: Brutal trade-off. The procedure should flag that 11 real people lose life-sustaining treatment versus statistical lives saved. Unless there's patient ratification (unlikely), this fails multiple tests. 
  - The last-line therapy case: Exactly where the procedure bites hard. No way to justify denying Person A's survival for Person B-Q's convenience. 
  - Scarce drug allocation: Pure slot-thinking. The procedure should force explicit acknowledgment that established relationships are being overridden. 

  Biggest vulnerability? Clever framing can game the system. We'll need strict definitions of "severity" and "irreversibility" set by committee vote. Minutes must show test outcomes verbatim - not just "procedure followed." 

  *deep breath* The committee's courage will be tested here. This isn't about making decisions easier - it's about making the hard choices visible and accountable.
answer: |-
  Here is a procedural "Separateness Check" designed for 20-minute committee review of aggregative proposals. It consists of 5 sequential questions with clear exit points, built from your tests but tightened for operational use. The procedure **stops** at any "No" answer, requiring escalation or rejection.

  ---

  ### **The Separateness Check Procedure**
  *(Time: 20 minutes max per proposal)*

  1.  **THE ADDRESSABILITY TEST**  
      *Question: "Can we state directly to the person bearing the largest concentrated loss (LCL): 'We ask you to accept [specific loss] because [reason], and this reason would apply equally to anyone in your position'?"*  
      - **Sufficient Answer:** The reason must be **patient-specific** (e.g., clinical futility, lack of evidence for benefit, ineligibility under pre-ratified rules) OR **systemic necessity** (e.g., "this resource is exhausted for all," "no feasible alternative exists").  
      - **Insufficient Answer:** Any variant of "others gain more overall."  
      - **Stop & Escalate to:** Chief Medical Officer (CMO) if loss is **severe & irreversible** (defined below). **Reject** if not severe/irreversible.  
      *Rationale:* Filters out pure cross-person aggregation masquerading as justification.

  2.  **THE CONCENTRATION ASSESSMENT**  
      *Question: "Is the largest concentrated loss (LCL) SEVERE AND IRREVERSIBLE?"*  
      - **Severe:** Loss involves death, major disability, unremitting pain, or loss of autonomy.  
      - **Irreversible:** Loss cannot be later remedied (e.g., death, permanent disability; excludes temporary pain or inconvenience).  
      - **Stop & Escalate to:** Full Hospital Board if **YES**. Proceed to Q3 if **NO**.  
      *Rationale:* Flags ethically critical cases where aggregation is most problematic, regardless of Q1 outcome.

  3.  **THE RE-DESCRIPTION AUDIT**  
      *Question: "Does switching benefit/burden descriptions from SLOTS (e.g., life-years, QALYs) to PERSONS (e.g., "X’s survival," "Y’s autonomy") change the optimal decision?"*  
      - **Sufficient Answer:** "No change" OR "Change occurs but slots are licensed (see Q4)."  
      - **Insufficient Answer:** "Change occurs and slots are not licensed."  
      - **Stop & Reject** if change occurs and slots are unlicensed. Proceed to Q4 if slots are used.  
      *Rationale:* Exposes when aggregation relies on ethically questionable depersonalization.

  4.  **THE RATIFICATION CHECK**  
      *Question: "Where slots are used (Q3) or cross-person aggregation occurs (Q1), is the burdened party part of a RATIFIED POOL?"*  
      - **Ratified Pool:** Patient joined a scheme with **known rules** (e.g., transplant list criteria), gave **informed consent** for resource-constrained care, or has an **advance directive** accepting trade-offs.  
      - **Sufficient Answer:** "YES, and pool rules cover this loss."  
      - **Stop & Reject** if "NO" or "Rules don’t cover this loss." Proceed to Q5 if "YES."  
      *Rationale:* Permits aggregation only where prior consent legitimizes interpersonal trade-offs.

  5.  **THE EMERGENCY OVERRIDE**  
      *Question: "Is this decision required in <2 hours AND are burdens/burdens unavoidably statistical?"*  
      - **Sufficient Answer:** "YES" (proceed with aggregative justification).  
      - **Insufficient Answer:** "NO" (return to Q1 if time allows, else escalate to CMO).  
      - **Stop & Approve** only if **YES**.  
      *Rationale:* Pragmatic exception for true emergencies with no identifiable losers.

  ---

  ### **Handling Your Hard Cases**
  - **Statistical vs. Identified Persons:** Q1 (Addressability) fails if loss is concentrated on identified persons (e.g., dialysis patients) but benefits are statistical.  
  - **Non-Addressable Persons (infants, dementia):** Apply Q1 to their legally authorized surrogate. If no surrogate, Q4 (Ratification) fails unless societal rules apply (e.g., pediatric triage protocols).  
  - **Future Persons:** Q4 fails unless governed by ratified policy (e.g., sustainability guidelines).  
  - **Divergent Descriptions:** Q3 catches this. If benefit description changes the outcome, reject unless ratified.  
  - **Emergencies:** Q5 provides limited, auditable override.  
  - **Same Person on Both Sides:** Q1 passes (reason applies to them directly); aggregation is ethically safer here.

  ---

  ### **Application to Your Recurring Cases**

  1.  **Closing Rural Dialysis Unit:**  
      - **Q1:** Fails. Cannot tell 11 patients: "Lose dialysis so others gain statistical survival benefit."  
      - **Q2:** Severe/irreversible loss (death). **ESCALATE TO BOARD.**  
      - *Procedure outcome:* Rejects pure aggregation; forces higher-level value judgment.

  2.  **Expensive Last-Line Therapy vs. Readmission Prevention:**  
      - **Q1:** Fails. Cannot tell the patient: "Die so others avoid readmissions."  
      - **Q2:** Severe/irreversible (death). **ESCALATE TO BOARD.**  
      - *Procedure outcome:* Rejects aggregation; forces confrontation with individual sacrifice.

  3.  **Scarce Drug by Expected Benefit Only (ignore existing relationships):**  
      - **Q3:** Slot-description (e.g., "life-years saved") likely changes ranking vs. person-description (e.g., "denying treatment to our long-term patient").  
      - **Q4:** Fails unless all patients ratified a purely utilitarian allocation rule in advance (unlikely).  
      - **Stop & Reject.**  
      - *Procedure outcome:* Blocks depersonalized allocation without consent.

  ---

  ### **What This Procedure Cannot Do & Implementation Notes**

  1.  **Judgmental Inputs Requiring Committee Deliberation:**  
      - Defining "Severe & Irreversible" (Q2).  
      - Deciding if a "slot" description is ethically licensed (Q3).  
      - Interpreting "ratified" rules (Q4).  
      *How to set:* Vote at annual policy review. Document thresholds (e.g., "Severe = risk of death/major disability"). Revisit when cases challenge definitions.

  2.  **Vulnerabilities:**  
      - **Gaming:** Ratification (Q4) could be stretched ("every patient implicitly consents to hospital policies"). **Mitigation:** Require explicit, pre-existing rules.  
      - **Misfires:** May over-reject efficient policies in non-ratified pools. **Trade-off:** Accept reduced efficiency as cost of fairness.  
      - **Undue Rigidity:** Use Q5 (Emergency) sparingly; audit all invocations.

  3.  **Audit Trail:**  
      **Minutes must record:**  
      - Who bears the LCL and the loss severity.  
      - The Q1 statement attempted.  
      - Q3 outcome (slot vs. person divergence).  
      - Q4 ratification source (or lack thereof).  
      *Example minute:* "Q1 failed: No patient-specific reason for LCL (dialysis withdrawal). Q2: Loss severe/irreversible → Escalated to Board. Q3: Slot description reversed outcome; unlicensed. Q4: No ratified pool."

  4.  **Core Limitation:**  
      This procedure **exposes** ethically problematic aggregation but doesn’t resolve whether a loss is *ultimately justified*. It forces escalation to those with mandate to make value judgments (Board, CMO). It ensures aggregation alone cannot justify imposing severe, unratified, concentrated losses—addressing the daughter’s valid complaint.

  **Final Output:** A defensible "no" or a clear handoff to accountable decision-makers.
