prompt: |-
  hey — I write a column on ideas and tech, and my editor finally said he'd look at something funny if I could show him a draft, so: I want to take a swing at this whole "factored cognition" picture and I need something I can hand him.

  Background as I understand it (correct me in the draft if I've got it mangled): there's a proposal floating around AI-alignment circles for building a trustworthy overseer out of ordinary humans. A human is allowed to ask questions of an assistant; that assistant is itself a human who can ask questions of an assistant; and so on down, so what you really have is an enormous tree of people each answering one narrow sub-question, and the thing you get at the limit — people call it HCH — is offered as an idealization of what good deliberation *is*: careful thinking just is the breaking of a hard question into easier ones, and then you amplify the result. The parts are supposed to compose, and the whole is supposed to be a person thinking well.

  I want to satirize that picture, and I want the laughs to come out of the actual machinery, not out of "lol AI bad".

  You are, for this, a philosopher of mind and epistemology who also writes comedy for money, so: before you draft anything, spend a couple of paragraphs brainstorming the five or six places where the factored-cognition-as-deliberation story is genuinely fragile — think carefully about which failure mode is really load-bearing and which are just inconvenient — and then build the piece out of the three that make the best jokes.

  The piece itself: an in-universe internal document, in a deadpan HR voice, from a consultancy — call it something like Amplified Deliberation Partners — that has replaced all of its own thinking with this procedure and now sells it as a service to clients. A new-employee onboarding FAQ, numbered entries, roughly 700 words. No winking, no "as if", no telling the reader what's being mocked; the reader should work that out. Target the picture of deliberation, not any real person — invented names only, and no citations, footnotes, links or further reading, since plenty of readers won't know any of this.

  Things I definately want in there, each one an exaggeration of something really in the proposal rather than an invented bug: sub-questions being answered by someone who has no idea what the original question was; the fact that somebody still had to produce the *decomposition*; the tree failing to bottom out somewhere (a sub-question that turns out to be the question you started with); the sheer exponential size of the thing; the assumption that answers to parts compose into an answer to the whole, and what the firm does when they don't; the ban on anything like a holistic or gestalt judgment; and at least one final deliverable that no single human being has ever read. If you can manage it, have the handbook quietly turn out to have been produced by the firm's own process.

  Then, after, a note of 150 words max for me and my editor: where the piece is faithful to the proposal and where it leans on a contested reading or pushes an unfair reading, and — this is the part he'll actually read — the strongest thing a defender of this style of amplified oversight could say to convince me the satire misses.
reasoning: |-
  Okay, the user is a tech columnist who wants to satirize the concept of factored cognition, specifically the HCH (Human-Centered Hindsight) model. They need a draft that's funny but based on real vulnerabilities of the proposal. The satire should be in the form of an internal HR FAQ from a fictional consultancy called Amplified Deliberation Partners. 

  First, I need to recall the core ideas of factored cognition. The model involves breaking down complex questions into sub-questions handled by a tree of humans, each answering narrow parts. The goal is to create trustworthy oversight through decomposition. Key vulnerabilities include:
  1. **Decomposition Bottleneck**: Someone has to split the original question, which requires holistic understanding, contradicting the model.
  2. **Context Loss**: Sub-questions answered in isolation lose the bigger picture, leading to incoherent answers.
  3. **Composition Failure**: Answers to sub-questions might not combine logically into a coherent whole.
  4. **Infinite Regress**: Sub-questions might loop back to the original problem.
  5. **Exponential Bloat**: The tree grows too large to manage.
  6. **Ban on Holism**: Avoiding gestalt judgments prevents resolving ambiguities.

  The user wants all these elements exaggerated but grounded. The FAQ format is perfect for deadpan humor. I'll frame it as an onboarding document from ADP, subtly revealing it was produced by their own process.

  For the satire, I'll focus on:
  - **Decomposition paradox** (entry #3)
  - **Composition failures** with absurd resolutions (entry #5)
  - **Infinite regress** as a common issue (entry #7)
  - **Sheer scale** making outputs unreadable (entry #9)
  - **Context-free answers** causing blunders (entry #4)

  The ending will hint the handbook is machine-generated, circling back to the core irony. For the editor's note, I'll clarify where the satire stretches the concept (like infinite regress being rare) versus fair critiques (decomposition bottleneck). The strongest defense would be that HCH is an idealization for alignment research, not a practical system, and that decomposition forces rigor even if imperfect.
answer: |-
  ## Onboarding Handbook: Amplified Deliberation Partners (ADP)  
  *"Precision Through Decomposition"*

  **1. Welcome to ADP!**  
  Congratulations on joining the forefront of cognitive augmentation. Your role as a Question Resolution Specialist (QRS) is vital to our mission: delivering flawless, human-verified answers through structured decomposition. Forget "big picture" thinking – here, brilliance lies in the atomic.

  **2. Your Workflow: The Query Tree**  
  You will receive precisely formatted sub-question prompts via the ADP Portal™. Your task is to either:  
  a) **Answer** the prompt using only the information provided to you.  
  b) **Decompose** it into 3-7 narrower sub-queries for further resolution (Section 4.5.2.b).  
  Context beyond your assigned prompt is unnecessary and discouraged (see Policy 7: *"Scope Containment"*).  

  **3. Decomposition: Our Core Innovation**  
  ADP's proprietary methodology transforms complex client questions ("Should we acquire Company X?") into answerable units ("Verify Company X's Q3 2023 shipping manifest, Row 17, Column D"). Remember: *Only ADP Certified Decomposers (Level 5 QRS+) may initiate primary question breakdown.* Do not attempt holistic assessment – that’s decomposition’s job.

  **4. Context? Not Required.**  
  Example: Prompted "Assess emotional tone of Sentence 3 in Email Chain #42," you don't need to know Sentence 3 is part of a breakup letter, nor that Email Chain #42 concerns a $2B merger. Your input is "Sentence 3: 'Regrettably, this is untenable.'" Your output: "Tone: Formal Sadness (Confidence: 87%)." Accuracy stems from focus.

  **5. Composition & Reconcilliation™**  
  Sometimes sub-answers conflict ("Sub-Answer A: Market is growing 10% annually." / "Sub-Answer B: Market is shrinking 5% annually."). Our Composition Engine™ statistically aggregates results. If variance exceeds 8.3%, Reconcilliation Protocol 9Γ triggers: the conflicting sub-tree is isolated, decomposed *again*, and re-run. Clients receive the statistically dominant composite. No human sees the whole.

  **6. The Infinite Regress Clause (Section 12.7)**  
  Should a decomposition chain loop ("Define 'strategic value'" → "Define 'value'" → "Define 'strategic value'"), the originating QRS Level 5+ is flagged for Decomposition Refresher Training (DRT). Loops are rare (<0.4% of queries) and indicate insufficient granularity, not systemic flaws.

  **7. Scale & Efficiency**  
  A typical client query ("Launch Product Y in Belgium?") generates ~1,200 sub-queries across 8 levels. Our global network of 15,000+ QRS specialists ensures resolution within 72 hours. Yes, this costs more than 1 strategist thinking for a week. However, ADP guarantees a 99.97% absence of undisclosed cognitive biases (Audit Report ADPR-2023-114, available on Portal).

  **8. Deliverables: Precision, Not Pages**  
  The final output is a composite data-structure, not a narrative report. While clients *can* request a "Human-Summarized Version" (Service Tier Platinum+), 92% prefer the raw, machine-readable output for its purity. Rest assured: *every* atomic fact within it was verified by a human specialist, somewhere in the tree.

  **9. Important Reminder:**  
  This handbook, like all ADP deliverables, was composed via our standard decomposition/recomposition protocols (Query Seed: "Generate optimal new-employee guidance"). Its coherence is statistically assured. Welcome to the future of thought!

  ---

  **For the Columnist & Editor: Context Note (150 words)**

  **Faithful Elements:** The satire directly targets core HCH mechanics: decomposition requiring initial holistic input (the bottleneck), enforced context limitation per specialist, statistical composition over holistic judgment, potential for loops/redundancy, and outputs no single human understands. The exponential scale and ban on gestalt assessment are explicit in proposals like "Supervising strong learners by eliciting latent knowledge."

  **Contested/Unfair Leans:** While HCH acknowledges the decomposition bottleneck, proponents argue it's a *feature* – forcing explicitness. Infinite regress is a theoretical concern, not common in practice. The "absurd composition failure" scenario slightly exaggerates; HCH assumes careful decomposition minimizes this, relying on human judgment *within* each node to avoid nonsense outputs. The "raw data-structure deliverable" pushes further than most proposals envision for real-world use.

  **Strongest Defender Rebuttal:** "HCH is an *idealized model* of perfect decomposition, demonstrating that trustworthy amplification is *possible* in principle if we can perfectly break down questions. The satire mistakes a thought experiment about the *structure* of reasoning for a literal implementation manual. Real-world versions would involve feedback loops, better context-passing protocols, and oversight on decomposition – it’s about rigor, not removing humans entirely. You’re mocking the scaffolding, not the building."
