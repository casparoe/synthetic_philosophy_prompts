  Here's a principled "Which Lifeboat Ethic Are You?" widget designed around logical branch points, not pre-packaged philosophies. Each question forces a concrete choice that splits the views meaningfully, using your specified cases. The scoring reveals positions based on consistent reasoning patterns.

  ---

  ### **The Lifeboat Ethics Quiz**
  **Instructions:** For each scenario, choose the answer closest to your instinct. There are no trick questions—your first reaction is what matters.

  1. **The Capsized Lifeboat**  
     Swimmers are drowning because your ship’s crew overloaded *another* lifeboat, causing it to sink. Your boat is at safe capacity. Do you:  
     A) **Rescue them—the crew’s mistake created this debt.**  
     B) **Rescue only those who can row or bail water.**  
     C) **Rescue no one—overloading risks everyone.**  

  2. **The Navigator**  
     A lone swimmer knows how to reach a larger, empty lifeboat. Taking them requires tossing supplies, risking your supplies. Do you:  
     A) **Take them—finding the bigger boat saves more lives overall.**  
     B) **Leave them—your boat’s immediate survival comes first.**  

  3. **The Defiant Swimmer**  
     A swimmer refuses a life jacket you throw them. You can redirect it to another. Do you:  
     A) **Redirect it—ensure someone uses it now.**  
     B) **Throw it to them anyway—they might accept it later.**  
     C) **Keep it—no point wasting resources.**  

  4. **Permanent Overcrowding**  
     Your boat is *always* overcrowded; swimmers constantly beg for help. How do you decide who to save?  
     A) **Save those most likely to keep the boat functional (e.g., medics, rowers).**  
     B) **Use a lottery—everyone deserves an equal shot.**  
     C) **Save no one—any rescue perpetuates the crisis.**  

  5. **The Rule-Breaking Rescue**  
     Your boat’s core rule is "Never abandon children." A child swims toward you, but taking them breaches capacity. Do you:  
     A) **Rescue them—breaking the rule destroys the boat’s moral purpose.**  
     B) **Rescue the strongest swimmer instead—rules can’t override survival.**  
     C) **Rescue no one—the rule exposes the system’s hypocrisy.**  

  6. **The Guilty Crew Member**  
     A swimmer caused the initial overloading disaster. They’re now helpless. Do you:  
     A) **Rescue them—assigning blame won’t fix the situation.**  
     B) **Rescue someone else—help those who didn’t cause this.**  
     C) **Rescue no one—they forfeited their place.**  

  7. **The Corrupt System**  
     You learn your "lifeboat" is a prison barge where guards hoard supplies. Do you:  
     A) **Work within it—save whoever you can.**  
     B) **Demand a fair lottery for resources.**  
     C) **Reject it—no choice is moral in this system.**  

  ---

  ### **Scoring Key**  
  Tally your answers and match them to the ethic with the most matches. Ties indicate hybrid views.

  | **Answer Pattern**                   | **Your Lifeboat Ethic**                                                                 | **Core Principle**                                                                 |
  |--------------------------------------|-----------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------|
  | **Mostly A’s in Q1,5,6**             | **Repair-First**                                                                        | "We broke it; we fix it." Prioritizes rectifying past harm, even at short-term cost. |
  | **Mostly B’s in Q1,2,3,4 + A in Q2** | **Straight Triage**                                                                     | "Save the most lives possible." Efficiency-driven, often at the expense of fairness. |
  | **Mostly B’s in Q4,5,7**             | **Fair Lottery**                                                                        | "Random chance is the only justice." Allocates help via impartial systems.         |
  | **Mostly C’s in Q1,2,3,4,6**         | **Hardin-Style No-Boarding**                                                            | "Helping drowns us all." Focuses on resource limits and unintended consequences.   |
  | **Mostly C’s in Q5,7**               | **Corrupt System**                                                                      | "This game is rigged." Sees allocation as irrelevant amid systemic failure.        |

  ---

  ### **Design Notes & Rationale**  
  - **Key Branch Points**:  
    - **Blame vs. Consequences**: Q1 and Q6 split *Repair-First* (focused on blame) from *Triage/Hardin* (focused on outcomes).  
    - **Efficiency vs. Fairness**: Q4 cleanly separates *Triage* (functional utility) from *Lottery* (equal chance).  
    - **System Legitimacy**: Q5 and Q7 isolate *Corrupt System* by forcing rejection of rules or participation.  
    - **Risk Tolerance**: Q2 distinguishes *Triage* (accepts risk for greater good) from *Hardin* (avoids all risk).  

  - **Uninhabited Combinations**:  
    - **Repair-First + Hardin** (e.g., A’s in Q1 + C’s elsewhere): *Incoherent*. You can’t prioritize fixing harm *and* reject all rescue.  
    - **Lottery + Corrupt System** (e.g., B in Q4 + C in Q7): *Unwritten*. If the system is corrupt, why trust a lottery?  

  - **If Cutting One Question**: Drop **Q3 (Defiant Swimmer)**. It tests paternalism (A vs. B) or fatalism (C) but doesn’t cleanly split core ethics—*Triage* and *Repair-First* both overlap on A/B.  

  - **Why This Works**:  
    - Cases map to your reporting needs (overloaded boats, navigators, rule conflicts, etc.).  
    - Positions emerge from patterns, not direct questions (e.g., *Corrupt System* appears when rules are rejected in Q5/Q7).  
    - "Leaves" stay distinct: *Repair-First* requires A’s in harm scenarios (Q1/Q6), while *Hardin* demands C’s in rescue scenarios (Q1–Q4).  

  This widget reveals ethical frameworks through *applied choices*, letting users discover their stance without philosophy jargon. The scoring handles ties explicitly, flagging unstable hybrids.
