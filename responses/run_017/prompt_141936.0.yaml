answer: |-
  Below is a decision tree designed to help identify constructivist positions based on concrete mathematical claims, avoiding rehearsed questions like direct acceptance of the law of excluded middle. The tree uses 8 branch questions, each phrased as a claim you either **assert** (A) or **reject** (R). The leaves cover 8 named positions and 1 unnamed/rarely occupied region. 

  The tree is built from logical consistency first (e.g., full choice + extensionality implies excluded middle, so no position accepts both). Positions cluster due to historical/philosophical reasons, but logical fault lines are flagged. Bishop-style and Martin-Löf type theory often agree, so they share a leaf. Feasibility collapses to strict finitism, and leaky metatheory is a common practice, not a position.

  ---

  ### **Decision Tree: Which Constructivist Are You?**  
  *Answer based on what you’d assert in mathematical practice.*

  1. **Feasibility of witnesses**:  
     *A constructive proof of "∃x P(x)" must yield a witness x₀ computable in polynomial time (relative to input size).*  
     - **A → Strict Finitism** (e.g., Parikh, ultra-finitists). *Diagnosis: Coherent but extreme; rejects large numbers as meaningless.*  
     - **R → Q2**.

  2. **Classical proofs establish truth**:  
     *A statement proven classically (e.g., using LEM) is true, and can be used in further reasoning.*  
     - **A → Q3**  
     - **R → Q4**  

  3. **Value of classical existential proofs**:  
     *The primary value of a classical proof of "∃x P(x)" is extracting a constructive witness (via proof mining).*  
     - **A → Proof Mining** (e.g., Kohlenbach). *Focus: Extract bounds from classical proofs.*  
     - **R → Ecumenical** (e.g., classical logic + constructive embedding). *Basis: Classical math is consistent; constructive math lives inside it via translations (e.g., Gödel-Gentzen).*  

  4. **Markov’s principle**:  
     *If a Turing machine’s non-halting is refuted, it halts. (¬¬∃t halts(t) → ∃t halts(t)).*  
     - **A → Russian/Recursive Constructivism** (e.g., Markov). *Adds: All functions are computable; accepts Church’s thesis.*  
     - **R → Q5**  

  5. **Choice sequences**:  
     *One can reason about sequences of naturals not given by a law (free choice sequences).*  
     - **A → Brouwerian Intuitionism** (e.g., Brouwer, Heyting). *Adds: Bar induction, continuity of all functions on [0,1].*  
     - **R → Q6**  

  6. **Impredicative set definitions**:  
     *A set S ⊆ ℕ may be defined by quantifying over all subsets of ℕ (e.g., S = {n : ∀X ⊆ ℕ, φ(n,X)}).*  
     - **A → Q7**  
     - **R → Predicativism** (e.g., Weyl, Feferman). *Basis: Sets must be built "from below"; rejects circular definitions.*  

  7. **Power set of ℕ as a set**:  
     *𝒫(ℕ) (all subsets of ℕ) is a completed, well-defined set.*  
     - **A → Unnamed region**. *Diagnosis: Coherent but unstable; implies impredicativity + extensionality, risking LEM. Rarely occupied.*  
     - **R → Q8**  

  8. **Meaning via proof conditions**:  
     *The meaning of a statement is tied to conditions for its assertion; understanding requires recognizing proofs.*  
     - **A → Dummett/Prawitz Meaning-Theoretic** (e.g., Dummett). *Basis: Dispute is about manifestability in use, not ontology.*  
     - **R → Bishop/MLTT Constructivism** (e.g., Bishop, Martin-Löf). *Shared: Extensional equality, avoid LEM; functions on [0,1] may be discontinuous. (Types vs. sets is not a fault line here.)*  

  ---

  ### **Notes & Diagnostics**  
  - **Logical fault lines** (deep splits):  
    - *Q2* separates classical-tolerant (proof mining, ecumenical) from strict constructivists.  
    - *Q4* (Markov’s principle) splits computability-focused schools from others.  
    - *Q6* (impredicativity) is a core predicativism boundary.  
  - **Accidental clusters** (historical/philosophical):  
    - Bishop and Martin-Löf type theory (MLTT) answer identically: both reject impredicativity, power sets, and meaning-theoretic primacy. Distinctions (types vs. sets) are not forced by the questions.  
    - Brouwerian and Russian schools both accept function continuity on [0,1], but for different reasons (choice sequences vs. computability).  
  - **Unoccupied regions**:  
    - *Impredicativity + 𝒫(ℕ) as a set (A→A in Q6→Q7)*: Coherent but implies LEM under choice/extensionality, so strict constructivists avoid it.  
  - **Feasibility (Q1)**: Collapses to strict finitism; not a branch as no major schools hold it without modification.  
  - **Leaky metatheory**: Common practice (e.g., proving normalization of MLTT classically), but not a position—footnote for honesty.  
  - **How to read your path**: Start at Q1, follow answers to a leaf. Be honest about what you’d assert in a proof.  
  - **Most sorting power**: **Q2** (classical proofs). It isolates the biggest divide: whether classical math is "true" or requires constructive refinement.  

  ---

  ### **Why This Works**  
  - **Consistency enforced**: Full choice + extensionality → LEM, so no position asserts both (Q6→Q7 filters this).  
  - **Bishop/MLTT not split**: Both reject power sets (Q7→R) and meaning-theoretic primacy (Q8→R), so they align.  
  - **Feasibility/leaky addressed**: Q1 isolates strict finitism; leaky metatheory is a meta-practice, not a branch.  
  - **Coverage**: All requested positions are reached, with unnamed regions diagnosed.  

  This tree reflects actual mathematical commitments, not self-reported labels. Use it to spark discussion in your reading group!
