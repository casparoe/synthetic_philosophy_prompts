  Next, the disagreements table. Each row needs a neutral crux, each position's view fairly stated, and a shared case/evidence with predictions. The user provided two cases: the envelope predicate and split-usage community. For the envelope, epistemicism sees vague predicates as similar but with unknowable cutoffs, while supervaluationism distinguishes via multiple precisifications. Their predictions: epistemicist says "tall" is like the envelope, supervaluationist says it's different. The split-community case tests whether multiple cutoffs imply precisifications or ambiguous terms. Predictions here would differ on how to interpret the community's usage.

  The user suspects some disagreement is verbal, possibly about "truth" or "semantics." I should note that debates over whether truth is precisification-relative or if semantics models linguistic knowledge might be terminological. Highlighting this helps them focus on substantive issues.

  Need to ensure the document stays neutral, doesn't adjudicate, and uses their examples effectively. Check that the common ground excludes any contentious points. For instance, both reject third truth values but handle truth-value gaps differently—supervaluationism has gaps, epistemicism doesn't. Clarify that in the common ground without taking sides.

  Also, structure the disagreements table clearly. Each crux should address core differences: nature of vagueness, truth conditions, truth-value gaps, and indeterminacy. Use the envelope and split-community cases as evidence points. Make sure predictions are specific and testable.

  Finally, flag the verbal dispute section about the role of semantics and truth. This helps them isolate where their arguments might be talking past each other. Avoid any suggestions beyond the document as requested.
answer: |-
  Here's the adversarial-collaboration document draft, structured per your specifications:

  **Common Ground: Claims Both Epistemicist (E) and Supervaluationist (S) Endorse**

  1.  **Classical Logic Preserved:** Vagueness does not require abandoning classical logic (bivalence excluded for S only in borderline cases, see disagreements). The logical connectives retain their standard meanings.
  2.  **No Third Values/Degrees:** Truth-values are classical (True, False). Neither degrees of truth (fuzzy logic) nor a distinct third truth-value (e.g., Indeterminate) are necessary or correct for analyzing vagueness.
  3.  **Borderline Cases Exist:** For vague predicates (e.g., "tall", "bald"), there exist clear positive cases, clear negative cases, and borderline cases where competent speakers hesitate or disagree.
  4.  **The Sorites Paradox is Puzzling:** The Sorites argument (e.g., one grain isn't a heap; if n grains aren't a heap, n+1 aren't; therefore, a million grains aren't a heap) presents a genuine puzzle because:
      *   Its premises (especially the tolerance premise) seem highly plausible.
      *   Its conclusion is clearly false.
      *   Therefore, *something* must be wrong with the argument or our understanding of it.
  5.  **Higher-Order Vagueness is Real:** The transition between clear cases, borderline cases, and clear non-cases is itself gradual and lacks sharp boundaries. There are cases that are borderline-borderline, etc. Any adequate theory must accommodate this phenomenon; it cannot be explained away.
  6.  **The "Definitely" Operator is Essential:** A sentential operator "Definitely" (D) or "Determinately" is crucial for adequately characterizing vagueness and higher-order vagueness. This operator is iterative (e.g., DDP can be meaningful and distinct from DP or P).
  7.  **Meaning Drives Extension (Reject Radical Stipulation):** The extension of a vague predicate in a context is fixed by facts about linguistic meaning and use, not by arbitrary or precise stipulation by an individual speaker or small group (contrast with "epistemicist stipulation" or the Envelope Predicate case below). Vague predicates resist being made precise simply by fiat without changing meaning.

  **Disagreements: Cruxes, Positions, and Test Cases**

  | Crux                                                                                                 | Epistemicist (E) Position                                                                                                                                                           | Supervaluationist (S) Position                                                                                                                                                                         | Shared Evidence / Case                                                                                                                                                                                                                                                                                                                                                                                                    | E Prediction                                                                                                                               | S Prediction                                                                                                                               |
  | :--------------------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ | :----------------------------------------------------------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------------------------------------------- |
  | **1. Nature of Vagueness & Cutoffs:** What constitutes the vagueness of a predicate?                 | Vagueness consists in *principled ignorance* of a sharp cutoff point. The predicate *has* a precise extension fixed by meaning/use/world, but competent speakers *cannot know* where the boundary lies. | Vagueness consists in *semantic indeterminacy*. The predicate *lacks* a single precise extension; instead, it admits a range of equally admissible (and precise) ways of making it sharp (*precisifications*). | **The Envelope Predicate:** A predicate "F" is introduced meaning "The coin in the sealed envelope landed Heads". The coin *did* land Heads or Tails, but this is unknown and in principle unknowable without opening the envelope.                                                                                                                                                                                         | "F" is *exactly analogous* to "tall" or "bald". Both have sharp cutoffs fixed by meaning/use/world; the difference is only in *how knowable* the cutoff is. "F" illustrates the epistemic core of vagueness. | "F" is *fundamentally different* from "tall" or "bald". "F" has a sharp cutoff fixed by a *hidden fact*; "tall" lacks *any* single cutoff fixed by meaning/use/world. "F" exemplifies unknowability, not semantic indeterminacy. |
  | **2. Truth Conditions for Vague Sentences:** What makes a simple subject-predicate sentence true?    | "a is tall" is True iff a's height meets or exceeds the precise (but unknown) cutoff height fixed by meaning/use/world. False iff it does not. Borderline cases are either True or False. | "a is tall" is True iff a is tall on *all* admissible precisifications. False iff a is not tall on *any* admissible precisification. Otherwise, it lacks a truth-value (neither true nor false).       | **(Derived from Sorites):** Consider a borderline case 'a' for "tall". What is the truth-value of "a is tall"?                                                                                                                                                                                                                                                                                                            | "a is tall" has a determinate classical truth-value (True or False), though we cannot know which it is.                                     | "a is tall" has *no* determinate classical truth-value; it is neither true nor false.                                                 |
  | **3. Truth-Value Gaps:** Do genuine truth-value gaps exist for borderline claims?                    | **No.** Every declarative sentence involving a vague predicate, when applied to a specific object in a context, is determinately either true or false. Borderline status reflects *ignorance*, not lack of truth-value. | **Yes.** Borderline claims genuinely lack a truth-value. This gap is not epistemic but *semantic*, arising from the lack of a single precise extension. The "neither" verdict is a semantic fact.       | **Iterated Definiteness:** Consider a borderline-borderline case 'b' for "tall". What is the status of "It is not definite that 'b is tall' is indefinite"? (i.e., ~D~D(P))                                                                                                                                                                                                                                               | ~D~D(P) is always true for vague P, reflecting the sharp but unknowable boundaries at every order. Higher-order vagueness is also epistemic. | ~D~D(P) may be false. There can be sharp boundaries between orders of vagueness *within the space of precisifications* (e.g., a precisification where D and ~D have sharp boundaries).             |
  | **4. Source of Indeterminacy:** What explains the indeterminacy we experience with borderline cases? | Indeterminacy is entirely *epistemic*. It arises from our inability to discriminate the precise cutoff point or know the truth-value in borderline cases. The facts themselves are precise. | Indeterminacy is primarily *semantic* or *ontological*. It arises because the meaning of the word, the patterns of use, and the world simply do not determine a single cutoff point. The facts themselves are indeterminate. | **The Split-Usage Community:** Community C uses "tall". Half of C (Group A) consistently applies it at ≥180cm. The other half (Group B) consistently applies it at ≥185cm. Everyone knows this about each other's usage. There is no deference; both patterns are entrenched and recognized. Is "tall" in C vague? What is the cutoff?                                                                                     | "Tall" in C is likely *ambiguous* between two precise meanings (A-meaning and B-meaning), or perhaps has a single precise cutoff fixed by the *overall* pattern (e.g., 182.5cm). Not a model for standard vagueness. | "Tall" in C is *vague*. The two entrenched cutoffs (180cm, 185cm) represent two distinct *admissible precisifications*. The extension is indeterminate between these boundaries; borderline cases exist between 180-185cm. |

  **Locating the Verbal Dispute**

  We suspect a core verbal disagreement underlies several points, particularly concerning **Crux 2 (Truth Conditions)** and **Crux 3 (Truth-Value Gaps)**. The dispute hinges on the *concept of truth* being employed and the *explanatory goals* of semantic theory:

  1.  **"Truth" Simpliciter vs. "Truth" Relative to Precisification:**
      *   E insists on a single, context-independent, correspondence-like notion of truth: a sentence is true iff it corresponds to the single, precise state of affairs fixed by meaning/use/world. S's "supertruth" (truth-on-all-precisifications) is seen by E as a *different concept* – perhaps "definite truth" or "determinate truth" – not *truth itself*.
      *   S argues that for vague language, the only coherent notion of "truth" *simpliciter* applicable to ordinary assertions *is* supertruth. The correspondence notion E uses is inapplicable because there *is no* single precise state of affairs to correspond to. S sees E as illicitly smuggling in precision that isn't there.
      *   **Verbal Core:** Is the correspondence notion E uses the correct concept of "truth" for vague sentences, or is it only applicable to precise language? Is S changing the subject by defining "truth" as supertruth?

  2.  **Semantics as Modelling Knowledge vs. Modelling Meaning:**
      *   E's view is deeply intertwined with a view of semantics where a speaker's *knowledge* of meaning *could*, in principle, determine the extension, even if limitations prevent actual knowledge of the boundary. The sharp cutoff is part of the semantic fact to be known.
      *   S views semantics as primarily modelling *meaning* and the constraints it places on interpretation (admissible precisifications), independent of whether speakers could, even in principle, know *which* precisification is "the actual one" (since there isn't one). Speaker knowledge concerns competence with the constraints, not knowledge of a hidden boundary.
      *   **Verbal Core:** Is the job of semantics to model the (potentially unknowable) semantic *facts* (E), or to model the *constraints* on interpretation provided by meaning and use (S)? Are "principled unknowability" and "semantic indeterminacy" genuinely distinct explanations, or just different labels for the same phenomena driven by prior commitments about truth and meaning?

  This document isolates the core agreements, structures the fundamental disagreements with neutral descriptions and your proposed test cases (which effectively highlight the cruxes), and explicitly flags the areas where the dispute may hinge on differing conceptions of key terms ("truth", "meaning", the goal of "semantics"). This provides the foundation for your continued debate.
