prompt: |-
  I should say at the outset that I have no academic background in any of this. I am a retired building society manager, and for the last nine years I have been a volunteer trustee of a small city museum in the East Midlands with about forty thousand objects and a staff of six. For the past two years I have been reading about colonial-era collections and restitution on my own — mostly popular books and whatever I can get through the public library — because our collections committee has been asked to go through eleven objects acquired before 1950 and produce a written recommendation on each, and I do not think any of us knows what we are doing. The big cases everyone has heard of, the Benin Bronzes and the Parthenon Marbles, are not much help to us: by now both sides have a settled script, and our objects are not like that. They are ordinary things that arrived by ordinary routes and then sat in a storeroom for eighty years.

  What I would like is a procedure my committee can actually run: the questions to ask, in the order to ask them, what counts as a sufficient answer to each question, where the procedure stops and says no or yes on its own, and where it has to hand the decision over to people because the question is one of values rather than facts. It should fit on two sides of A4, because it will be read by four trustees who have not read anything on the subject and by a city council culture committee, and it may be quoted in the local paper. We have half a day per object, no budget for more than a day of a solicitor's time, and our solicitor is not certain our governing documents permit us to dispose of anything at all.

  There are seven difficulties that have come up in our own argument and that I want the procedure to force us through rather than let us skip.

  One: an object whose paper history simply stops — and the gap in the record falls exactly on the years of a documented mass looting, even though there is no evidence about our particular object. Who carries the burden, and what would discharge it?

  Two: cases where more than one party in the country of origin wants the same object: the national museums service, the court of the traditional ruler, a state government that has built a museum near where the object came from. Is returning it to the wrong one a return at all, and how would we decide who has standing?

  Three: an object that was exchanged for something — a documented transaction, at the time, between an adult and an adult — where the community's descendants say the object was not the kind of thing anyone had the right to sell, whatever was handed over for it.

  Four: return that ends the object's life as a museum object: things that would be buried, re-secreted, or used until they wear out, so that the argument about preserving them for everyone has no grip on the people asking for them.

  Five: an object that is a piece of a dispersed whole — one of a pair, a fragment of a dismantled shrine — where the rest is in five other museums. Does that change what we owe, and does our returning it make it harder or easier for the others to do the same?

  Six: objects that have acquired a second life here. Ours have been in this city for a hundred years, they turn up in local writing, and a community association whose families came from the region in the 1960s brings its children to see one of them on Saturday visits and wants it to stay. I want to know whether there is any claim at all that runs from the receiving side, and how much it weighs.

  Seven: the case where the law says we may not do the thing we have concluded we should do. I would rather the procedure separated may we from should we cleanly, and told us what the honest alternatives are — long loan, acknowledgement, a replica — and which of them is a real answer and which is a way of keeping the thing that mattered.

  Please then run the procedure on three of our objects, about a page each. The first is a cast brass head in the style of the court of Benin, bought at auction in London in 1962 and given to us in 1978, with nothing in the file between 1897 and 1962. The second is eleven ancestral skulls and two carved memorial figures from the highlands of what is now Papua New Guinea, collected in 1901 by a missionary-surgeon from this city, whose notebooks record that he handed over two steel axes for them, and whose descendants say they should be buried. The third is a carved wooden figure from the Cross River region, given to us in 1935 by a colonial officer who recorded that it was handed to his patrol during a campaign against a secret society, for which the national museums service has now asked, and which our local Nigerian-British community association has asked us to keep here on long loan, partly because their children see it and partly because they do not trust the storerooms it would go back to. At least one of the three should come out against what I would like: I would personally find it very hard to refuse the association, because these are our neighbours, and if the procedure says that their request is the old argument about our superior care in a friendlier voice, I would rather be told that plainly than have it smoothed over.

  Finally, be frank about what a procedure like this cannot do: where it will misfire, which distinctions it has to drop to stay usable by people like us, and which parts of the question can only be settled by a vote of trustees who are guessing. Please do not give me a bibliography, a reading list, footnotes, or case citations — I have no library access beyond the public one and no way to check any of it, and what I need is something we can run in a room. And please write it in British English.
reasoning: |-
  Okay, the user is a retired building society manager and trustee of a small museum. They need a practical, step-by-step procedure for assessing restitution claims on colonial-era objects. The procedure must fit on two A4 pages, be understandable by trustees with no expertise, and address seven specific difficulties they've encountered. 

  First, I need to understand the core challenges. The user isn't asking for theoretical debates but actionable steps that force trustees through tough questions without academic jargon. Their seven pain points reveal nuanced dilemmas - like burden of proof in looted objects, competing claims, or when return leads to destruction. The examples given (Benin head, PNG skulls, Cross River figure) are perfect test cases because they represent common scenarios.

  The procedure must have legal teeth since their solicitor doubts disposal authority. That means separating ethical "should" from legal "can" clearly. It also needs to handle emotional conflicts - like the local community's attachment - without flinching. The user specifically wants one recommendation to go against their personal preference, which shows they value objectivity over comfort.

  For structure, I'll build a phased funnel: start with factual verification, then move to ethical considerations, and end with legal/practical constraints. Each phase needs binary checkpoints ("stop/go") and clear handover points where trustees must vote on values. The seven difficulties will be embedded as sub-questions within relevant phases.

  Key design challenges:
  - Burden of proof: I'll place it on the museum for gaps during documented looting periods. "If the void overlaps with known looting, assume contested acquisition unless disproven."
  - Competing claims: Require written consensus from origin country stakeholders or escalate to governmental channels. No returning into disputes.
  - Sacred objects: Explicitly state that cultural authority trumps preservation arguments when descendants dictate disposition.
  - The local connection dilemma: Acknowledge it as a secondary factor only if all other criteria are balanced. Never primary.

  For the test cases:
  - The Benin head will fail on the 1897-1962 gap during the Sack of Benin. Recommend return despite personal feelings.
  - PNG skulls: Clear case for return to descendants for burial. The axes-for-skulls "trade" is void under duress.
  - Cross River figure: Complex. National museums have stronger claim than local loan request, but practical risks (storage) require mitigation strategies.

  Finally, I'll flag limitations: This won't resolve sovereignty disputes or force other museums to repatriate fragments. Trustees must accept that some decisions involve unprovable assumptions. Crucially, the procedure can't replace political will - it only frames choices.

  The tone must stay pragmatic. No "scholarly references" as requested, but I'll subtly anchor recommendations in established frameworks like the ICOM ethics code and UK Museums Association guidelines without naming them. British English throughout - "solicitor" not "attorney", "trustees" not "board".
answer: |-
  Here is a two-page A4 procedure designed for your committee, followed by analysis of your three objects. It focuses on practical steps, forces engagement with your seven difficulties, and clearly separates factual, ethical, and legal questions.

  **Procedure: Assessing Restitution Requests for Colonial-Era Objects (Pre-1950 Acquisitions)**

  **Phase 1: Establish Facts & Provenance (Focus on Acquisition)**
  *   **1.1 Documented Acquisition:** What does the written record *actually* say? (Deed of gift, purchase receipt, collector's note, catalogue entry). Is it contemporary with acquisition?
      *   *Sufficient Answer:* Clear, documented transaction details (parties, date, location, description matching object).
      *   *Stop/Handover:* If NO documented acquisition exists, proceed to 1.2. If YES, proceed to Phase 2.
  *   **1.2 Gap Analysis:** Where are the gaps in the object's history? What historical events occurred during those gaps? (Use standard historical sources: encyclopedias, reputable online history resources).
      *   *Sufficient Answer:* Identified gap periods and relevant historical context (e.g., wars, colonial campaigns, documented looting periods).
      *   *Stop/Handover:* **Difficulty 1:** If a significant gap *overlaps exactly* with a documented period of mass looting/confiscation, the **burden shifts to the museum** to demonstrate acquisition was *not* tainted. Proceed to Phase 2, noting this burden. If no such overlap, proceed to Phase 2 normally. *(Discharging Burden: Requires positive evidence of clean acquisition during that period. Silence = Failure to discharge burden).*

  **Phase 2: Assess Ethical Legitimacy of Acquisition (Focus on Context)**
  *   **2.1 Power Imbalance:** Was the transaction (even if documented) conducted under conditions of significant power imbalance? (Colonial administration, military occupation, economic desperation, lack of informed consent by community standards of the time?).
      *   *Sufficient Answer:* Consider context: Who were the parties? What was the broader political/military situation? Was the seller truly empowered by their community to dispose of the item?
      *   **Difficulty 3:** If the community's descendants assert the object was inalienable (not for sale) under their laws/customs, **this weighs heavily against ethical legitimacy**, regardless of a documented exchange. The "adult-adult" transaction may be void *within the originating culture's framework*.
  *   **2.2 Duress/Coercion:** Was the transaction made under duress, threat, or as part of punitive action? (e.g., confiscation after military action).
      *   *Sufficient Answer:* Evidence from contemporary records (reports, letters, diaries – including the collector's) indicating pressure or force. Context matters (e.g., objects taken during a "punitive expedition").
  *   **Handover Point 1:** *Based on 1.1, 1.2, 2.1 & 2.2:* **ETHICAL JUDGEMENT:** Does the available information indicate the acquisition was legitimate or tainted? (Factual findings feed this, but trustees must weigh the ethical implications). Document the reasoning.

  **Phase 3: Assess the Request & Implications of Return**
  *   **3.1 Legitimacy of Requester(s):** Who is requesting return? What is their relationship to the object and its origin? (National government body, recognised traditional authority, specific descendant community?).
      *   **Difficulty 2:** Is there more than one credible claimant? **Do NOT proceed until consensus is reached among claimants or authoritative guidance is provided by the origin country's highest relevant body (e.g., Ministry of Culture). Returning to the "wrong" party is not valid restitution.** Contact the requesting parties to clarify.
      *   *Sufficient Answer:* Clear authorisation from a widely recognised legitimate authority representing the originating culture/community.
  *   **3.2 Post-Return Fate: Difficulty 4:** What will happen to the object if returned? (Display in museum, reburial, resecreting, ritual use until decay?).
      *   *Handover Point 2:* **ETHICAL JUDGEMENT:** Does the originating community's right to determine the object's fate, even if it ends its museum life, outweigh the museum's preservation mandate? (Generally, **YES**, cultural authority prevails unless specific legal constraints exist).
  *   **3.3 Fragmented Objects: Difficulty 5:** Is this object part of a dispersed set? Does return facilitate or hinder reunification? Does it set a precedent? **Our decision is independent.** Returning our fragment is the ethically correct action regardless of others' actions. It may encourage others but is not conditional on them.
  *   **3.4 Local Significance: Difficulty 6:** What local connection, history, or meaning has developed here? (Documented local use, significance to diaspora communities?).
      *   *Sufficient Answer:* Evidence of deep, specific local meaning beyond simple longevity (e.g., featured in significant local art/literature, central to specific community identity formed *around* the object here).
      *   *Handover Point 3:* **ETHICAL JUDGEMENT:** Does this developed local significance create a countervailing claim *strong enough* to outweigh a tainted acquisition and/or a legitimate request? (Generally, **NO**. Longevity and general affection are weak compared to origins. Diaspora connection is important but usually supports return to origin, not retention).

  **Phase 4: Legal & Practical Feasibility**
  *   **4.1 Legal Authority (Solicitor):** Based on our governing documents and relevant law (Charities Act, museum accreditation standards), **can** we legally deaccession and transfer this object? (Requires solicitor's input).
      *   *Sufficient Answer:* Solicitor's clear "Yes" or "No" with reasoning.
      *   **Difficulty 7:** If "No" on legal authority, proceed to Alternatives (4.3). If "Yes", proceed to 4.2.
  *   **4.2 Practical Feasibility:** Can we practically arrange safe transfer? (Costs, logistics, export/import permits). Is the recipient able to receive it? (Basic due diligence required).
  *   **4.3 Alternatives: Difficulty 7:** If return is ethically indicated but legally impossible, or if ethically complex:
      *   **Long-Term Loan:** To originating community/institution. Only if *they* request it as an acceptable alternative. Not a substitute for ownership transfer.
      *   **Replica:** Only if acceptable to the originating community and used to facilitate return of the original or when original cannot be returned/cared for.
      *   **Acknowledgement/Recontextualisation:** In-depth display/online resource acknowledging contested history and ongoing dialogue. Minimum requirement if object remains.
      *   **Handover Point 4:** **ETHICAL JUDGEMENT:** Which alternative genuinely addresses the ethical concerns raised? Which are just retention by another name? (Loan/Replica only valid with origin community consent; Acknowledgement is essential but insufficient alone for restitution claims).

  **Phase 5: Recommendation**
  *   Synthesise findings from Phases 1-4.
  *   **Recommendation:** Return / Do Not Return / Alternative Action (specify).
  *   **Reasoning:** Concise summary of key factual, ethical, and legal factors leading to the recommendation. Explicitly state where trustee judgement was applied (Handover Points 1-4).

  **Procedure Limitations:**
  1.  **Cannot Resolve Sovereignty Disputes (Difficulty 2):** It flags the issue but can't force claimants to agree. The museum may have to wait or seek higher authority guidance.
  2.  **Cannot Prove Negative (Difficulty 1):** It forces consideration of gaps/looting but can't *prove* an object *wasn't* looted. It operates on balance and shifting burden.
  3.  **Cannot Quantify Values:** Judgements on cultural authority vs. preservation (Difficulty 4) or local significance (Difficulty 6) are qualitative and subjective. The procedure forces the *question* and requires explicit reasoning, not a mathematical answer.
  4.  **Cannot Bind Others (Difficulty 5):** Our action is independent. We can't control if others follow.
  5.  **Limited by Resources:** Relies on publicly available history and solicitor's brief time. Cannot fund deep archival research or cultural consultations.
  6.  **Guessing is Inevitable:** At Handover Points, trustees must make value-based judgements with imperfect information. The procedure ensures these guesses are informed and documented, not skipped.
  7.  **Cannot Override Law (Difficulty 7):** It clearly separates "should" from "can" but cannot make the impossible possible.

  ---

  **Analysis of Your Objects**

  **1. Cast Brass Head (Benin Style)**
  *   **Phase 1:** Documented auction (1962), gift (1978). **Gap: 1897-1962.** This gap perfectly overlaps the 1897 British Sack of Benin, a documented mass looting event. **Burden shifts:** Museum has *no* evidence proving clean acquisition during this period. Burden *not* discharged.
  *   **Phase 2:** Acquisition during the gap is highly likely tainted by the Sack. Even if acquired later, origin likely traces back to 1897 looting. **Ethical Judgement:** Acquisition illegitimate.
  *   **Phase 3:** Assume request from legitimate Benin authority (e.g., Oba's court/National Commission for Museums and Monuments, Nigeria). No competing claimants noted. Local significance? Likely minimal beyond general collection history. **Ethical Judgement:** Legitimate request outweighs any local connection.
  *   **Phase 4:** **Solicitor Essential:** Can we legally dispose? If YES, return feasible. If NO, Alternatives: Long-term loan *to Nigeria* (if acceptable to them) is the minimally ethical alternative, plus full acknowledgement. Replica without return is unethical retention.
  *   **Recommendation:** **RETURN** to Nigeria (or long-term loan if legally impossible, pending their agreement). *Reasoning:* Overlap with 1897 Sack creates presumption of looted origin, undisproven. Ethical obligation to Benin cultural authorities outweighs any local connection.

  **2. Ancestral Skulls & Figures (Papua New Guinea)**
  *   **Phase 1:** Documented acquisition: Collected 1901 by missionary-surgeon, exchanged for "two steel axes". Contemporary notebooks exist.
  *   **Phase 2:** **Power Imbalance/Duress:** Missionary-colonial context involves inherent power imbalance. Steel axes were highly valuable trade goods; exchange may reflect pressure or profound cultural disruption. **Difficulty 3:** Descendants state they should be buried, indicating they were inalienable ancestral remains, *not* legitimate items for trade. **Ethical Judgement:** Transaction fundamentally illegitimate under originating cultural norms, regardless of axes given.
  *   **Phase 3:** Request by descendants for burial. **Difficulty 4:** Return leads to burial (ending museum life). **Ethical Judgement:** Cultural authority (right to dispose of ancestors per tradition) decisively trumps preservation mandate. **Difficulty 6:** Local connection? Collector from city, but skulls not noted as locally significant beyond being part of the collection. Descendants' request is paramount.
  *   **Phase 4:** **Solicitor Essential:** Human remains often have specific legal hurdles. If return possible, burial is the required outcome. If legally impossible, Alternatives are highly problematic (acknowledgement is woefully insufficient; loan/replica absurd for remains needing burial).
  *   **Recommendation:** **RETURN** to descendant community for burial (Requires identifying legitimate representatives, potentially through PNG High Commission or national museum). *Reasoning:* Ancestral remains acquired under imbalance; descendants' cultural authority demands control over disposition, specifically burial. Preservation argument invalid.

  **3. Carved Wooden Figure (Cross River, Nigeria)**
  *   **Phase 1:** Documented acquisition: Gift in 1935 from colonial officer, who recorded it was "handed to his patrol during a campaign against a secret society".
  *   **Phase 2:** **Duress/Coercion:** "Handed to patrol during a campaign" strongly suggests confiscation under duress or as surrender during a punitive colonial military operation. **Ethical Judgement:** Acquisition illegitimate.
  *   **Phase 3:** **Legitimacy:** Request by Nigerian National Museums Service (NMS) - generally considered legitimate authority. **Competing Interest (Difficulty 2 & 6):** Local Nigerian-British community association requests long loan, citing children's connection and distrust of Nigerian storage. **Standing:** NMS has primary standing as the national body. The local association has a *voice* but not equivalent standing regarding *ownership*. **Trust Issues:** Storage concerns are practical, not a challenge to legitimacy. **Ethical Judgement:** Legitimate request from origin country outweighs diaspora wish for retention/loan *here*. NMS has standing.
  *   **Phase 4:** **Solicitor Essential:** Can we legally return? If YES, address storage concerns: Discuss directly with NMS – Can they provide specifics on storage/display plans? Offer UK-funded conservation support pre-transfer if feasible/appropriate. **Alternatives:** Long-term loan *to the local association here* is **unethical** (retention by another name; bypasses NMS). Long-term loan *to NMS* held locally *could* be explored **only if NMS proposes it** as a mutual solution. Replica irrelevant without return. Full acknowledgement essential if retained (but retention unethical).
  *   **Recommendation:** **RETURN** to Nigerian National Museums Service. Engage with NMS on practical storage/display concerns; offer reasonable assistance. Local association's request, while understandable, does not override the ethical imperative to return to Nigeria. *Reasoning:* Confiscation during colonial campaign establishes illegitimacy. Legitimate request from national body of origin country takes precedence over diaspora community's desire for local retention, despite valid practical concerns which should be addressed cooperatively.

  **Frank Conclusion:** This procedure forces you to confront the hardest questions (like the burden during looting gaps, the weight of diaspora voices vs. origin country claims, and the stark choice when return means burial). It won't make decisions easy, but it ensures they are structured, transparent, and explicitly acknowledge where judgement calls based on values (not just facts) are made. The recommendation on the Cross River figure goes against your personal leaning, as requested: the local association's request, while heartfelt and community-focused, represents a form of continued paternalism ("we care for it better") and bypasses the legitimate authority of the Nigerian state. The procedure highlights that the ethical core lies in redress for the original illegitimate taking, prioritising the origin nation's claim. The practical storage concerns are real but must be addressed *with* Nigeria, not used as a reason for retention. Good luck.
