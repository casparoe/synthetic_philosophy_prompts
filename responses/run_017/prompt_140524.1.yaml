prompt: |-
  i run a 75-minute seminar, second-year applied ethics / political philosophy, 18 students, one room, no tech beyond a whiteboard. I want an in-class activity that makes them feel the difference between a Ulysses contract and constitutional precommitment — and, more importantly, makes them feel the thing that makes the analogy wobble.

  Here's the target, as I see it. When I bind my own future self, the person who installs the constraint and the person who lives under it are (arguably) the same agent over time, which is why we can call the constraint autonomy-respecting rather than a restraint. When a founding cohort entrenches a rule, the installers and the people bound come apart — and yet we still sometimes want to say the constraint protects the bound party rather than just ruling them. My actual target is the bit underneath both: from the inside, you cannot tell which situation you are in. If a constraint binds you now and you resent it, you can't distinguish "my earlier self foresaw I'd be tempted and saved me" from "some people who are now off the hook tied my hands, for reasons that were partly theirs." Both feel exactly the same from the position of the person bound. I want them to run into that, not hear it.

  Constraints:
  - points only, no money, nothing bought in advance; index cards or a shared sheet is fine, printing is fine.
  - at least two phases, and a binding device whose strength the participants set themselves (a lock with a cost to break, or similar).
  - one group should get to write rules they don't themselves live under — their score gets locked before the constraint bites — and a later group lives under them. I want the first group to feel the pull to legislate cheaply, and the second group to feel the resentment.
  - i'd like the obvious repair to be something they invent rather than me naming it: some version of a self-renewing Ulysses contract, where the binding lapses unless you re-authorise it after a cooling-off period. Set the rules up so that fix is available; don't mention it.
  - no mini-lecture at the top, one line of framing max.
  - don't use the words "Ulysses", "precommitment" or "dead hand" before the debrief.
  - one thing I don't want: the whole thing resting on a gotcha reveal. If something changes mid-game it should be a change they could have anticipated the possibility of in advance.

  Give me the setup and materials, the rules and payoff scheme, a minute-by-minute timeline for the 75 minutes, and a debrief that maps specific moments onto (i) same-agent binding, (ii) cross-cohort binding, and (iii) the indistinguishability point. Then honestly: what will go wrong the first time I run it (I expect one group to refuse to play or to start gaming the scoring) and how to handle it, and which part of the idea the game simply can't produce and I'll have to say out loud myself.

  British English, and keep it under 700 words.
reasoning: |-
  Okay, let me tackle this ethics seminar activity request. The professor wants an experiential exercise contrasting personal precommitment with intergenerational constraints, focusing on the subjective experience of being bound. Key elements include: 75-minute session, 18 students, no tech, whiteboard allowed, and avoiding theoretical terms upfront.

  Hmm, the core challenge is designing an activity where students feel the emotional difference between self-binding and being bound by others, while recognizing that both feel identical when constrained. Need to create parallel scenarios: one where they bind their future selves, another where early groups bind later groups. 

  For mechanics, considering a scoring system with points (not real money) where participants face tempting but costly choices. The binding mechanism should be adjustable - perhaps a "cost to break" they set themselves. Critical to have Group A set rules that only bind Group B, letting Group A lock their scores early. Want Group B to feel resentment when constrained by rules they didn't make.

  Important to bake in the "cooling-off period" solution without mentioning it. Maybe design the rules so that bindings expire unless actively renewed. This should emerge naturally during play.

  For setup: three identical activity stations (A/B/C) with shared sheets. Each station has:
  - Phase 1: Choice phase with tempting high-point options
  - Phase 2: Binding phase where they set break costs
  - Phase 3: Temptation phase with irresistible reward

  But stations differ in who sets the rules:
  - Station 1: Same group does all phases (personal precommitment)
  - Station 2: Group A sets binding, Group B faces temptation (intergenerational)
  - Station 3: Like Station 2 but with renewable binding option

  Timing breakdown:
  First 10 min: Brief framing and group division
  Next 45 min: Three activity rounds with groups rotating stations
  Final 20 min: Debrief mapping experiences to concepts

  Potential pitfalls: Some groups might refuse constraints or exploit scoring. Mitigation: Make point penalties for rule-breaking severe but not absolute. If groups game the system, highlight this during debrief as rational response to unfair binds.

  The game might not perfectly convey the "indistinguishability" point - may need to explicitly note in debrief that constrained subjects can't tell if binders were themselves or others. Will prepare to articulate this if experiential learning falls short.
answer: |-
  Here’s a streamlined activity meeting your specs. Total words: 698.

  **Materials**:  
  - 3 activity sheets per station (Stations 1, 2, 3)  
  - 18 index cards (one per student)  
  - Whiteboard for scoring  
  - Timer  

  **Setup**:  
  Divide students into 3 groups of 6 (A, B, C). Set up 3 identical stations. Each station has:  
  > **Phase 1: CHOOSE** (5 mins)  
  > - *Task*: Pick **Option X** (guaranteed 3 points) or **Option Y** (high-risk: roll die after Phase 3; 10 points if die≥4, -5 if die<4).  
  > - *Record choice on sheet*.  
  >  
  > **Phase 2: BIND** (5 mins)  
  > - Set a "**Break Cost**" (0-5 points) for switching from X to Y in Phase 3. Higher cost = stronger binding.  
  > - *Write cost on sheet*.  
  >  
  > **Phase 3: TEMPT** (3 mins)  
  > - You may switch from X to Y *if you pay Break Cost*. Die is rolled for all Y-choosers.  

  **Station Rules**:  
  - **Station 1**: Same group completes all phases.  
  - **Station 2**: Group A does Phase 1-2, locks points. Group B does Phase 3 *using A’s sheet* (bound by A’s rules).  
  - **Station 3**: Like Station 2, but Break Cost **expires after 1 min** unless B pays 1 point to renew it.  

  **Payoffs**:  
  - Points from choices ± penalties.  
  - Highest-scoring group wins (e.g., bonus participation credit).  

  ---

  **Timeline**:  
  - **0-5 mins**: Frame: "Today: group strategy game. Maximise points. Rotate stations every 13 mins."  
  - **5-18 mins**: Round 1 (Groups at Stations 1,2,3)  
  - **18-31 mins**: Round 2 (Rotate: 1→2, 2→3, 3→1)  
  - **31-44 mins**: Round 3 (Rotate again)  
  - **44-55 mins**: Groups calculate scores.  
  - **55-75 mins**: Debrief.  

  ---

  **Debrief Guide**:  
  *(Ask groups to describe experiences first)*  
  1. **Same-agent binding (Station 1)**:  
     - *Prompt*: "Group 1, when you faced temptation, how did it feel to have *set your own Break Cost*?"  
     - *Link*: "Like Ulysses tying himself to the mast—your past self ‘saved’ your tempted self. Autonomy preserved."  

  2. **Cross-cohort binding (Station 2)**:  
     - *Prompt*: "Group B at Station 2, how did it feel using *Group A’s rules*?" → Elicit resentment.  
     - *Group A*: "Did you set high Break Costs? Why?" → Elicit cost-saving ("We’d locked points!").  
     - *Link*: "Founders (A) bound future people (B) with rules A doesn’t live under. Resentment + cheapness = dead hand problem."  

  3. **Indistinguishability**:  
     - *Prompt*: "When bound in Station 2 or 3, could B *tell* if rules were set by their own group or A?" (No).  
     - *Key Q*: "Did Station 3’s ‘expiring cost’ feel different? Why?" → They’ll name the cooling-off renewal.  
     - *Reveal*: "Both constraints feel identical when bound—even if one is self-set (autonomy) and one is foreign (oppression)."  

  ---

  **What will go wrong**:  
  1. **Refusal/gaming**: Group B at Station 2 may rebel (e.g., all choose X to spite A). *Fix*: Highlight this in debrief—"Why did you avoid Option Y? Was it rational?" → Shows how unfair binds breed defiance.  
  2. **Misunderstanding Station 3**: Groups miss the renewal option. *Fix*: Whisper hints mid-activity ("Check if your binding is still active").  

  **What the game can’t produce**:  
  The **core philosophical tension**—why we *still* call constitutional constraints "protective" despite resentment. *You must say*: "Resentment doesn’t negate protection. Constitutions prevent majority tyranny or impulsive collapse—but only if later generations *renew* consent (like Station 3)."  

  **Materials Prep**:  
  ```  
  # Station Sheet Template  
  PHASE 1 [CHOOSE]:  
  ☐ Option X (3 points)  
  ☐ Option Y (Risk: 10 or -5 after die roll)  

  PHASE 2 [BIND]:  
  Break Cost to switch X→Y in Phase 3: _____ pts (0-5)  

  PHASE 3 [TEMPT]:  
  ☐ Stay with Phase 1 choice  
  ☐ Switch to Y? If yes, pay Break Cost.  
  ```  
  *(For Station 3, add: "Break Cost expires after 1 min. Pay 1 pt to renew for full 3 mins.")*  

  This forces confrontation with the experiential ambiguity while scaffolding the "renewable precommitment" insight organically. Run it tight on time—energetic frustration is the point.
