prompt: |-
  I write durability and safety claims into specifications for reusable medical-device packaging and delivery hardware. Roughly two dozen such claims a year pass across my desk; each one costs about a week of engineer time, has to be signed off by QA and Regulatory, and — because my team are engineers with no philosophy training and I can't justify more than an hour of conceptual work per claim — I need something they can run cold, in ordinary language, with the reasoning stated in your own words. Please don't point me to papers or name-drop authors; my team can't use them and I'd rather have the argument than the bibliography.

  The claims are almost always dispositional: "stays closed under shock," "maintains a sterile barrier for 36 months," "cannot deliver a harmful bolus," "resists ingress after repeated flexing." The naive way to cash these out — the item would do X if condition C obtained — keeps failing us in three distinguishable ways, and I want a procedure that separates them:

  1. Cases where the test itself destroys or removes the very capacity being certified, so the item passes for the wrong reason or is consumed by the test (single-use test on a reusable part).
  2. Cases where something merely blocks the manifestation without removing the capacity, and where the blocking factors are open-ended — a finite checklist can never enumerate them all.
  3. Cases where the observed behaviour is produced by something other than the capacity we're claiming, including behaviour produced by damage the test itself inflicted.

  There is also a fourth worry I can't get straight: a pattern of passing is not the same as a capacity. We once shipped a claim that held for two years only because our test rig was miscalibrated, and the "disposition" was really an accident of our procedure. So the procedure has to say what distinguishes a genuine capacity from a mere run of good results, in terms an engineer can actually check.

  A colleague tells me the philosophical literature has tags for some of this — something like finks, masks and mimics — and that there is a live argument about whether a capacity that never manifests is still there. I don't know the details and don't need them. If that framing earns its keep, use it; if it's a distraction from the shop-floor problem, say so and drop it.

  What I want from you:

  An ordered decision procedure my team runs on any proposed dispositional claim before it goes into a spec. For each step: the question to ask, what counts as a sufficient answer, what to record, and what to do when the honest answer is "we don't know." Mark explicitly (a) the steps where the procedure stops with "do not write this claim, or write it in this weaker scoped form," and (b) the steps where it must hand the decision to a named person because the remaining question is about tolerable risk rather than about fact. Be blunt about which distinctions survive being simplified for technicians and which ones I am losing by simplifying, and about where the procedure will misfire.

  Then run it on three real-shaped cases:

  A. A new claim: "the tray latch stays closed under a 30 g shock," tested destructively on sampled units, where the shock visibly deforms the latch — and the deformation is plausibly what keeps it shut.

  B. A legacy claim I'd be sorry to lose: "the pouch maintains a sterile barrier for 36 months on the shelf," where the "manifestation" is a continuing absence rather than an event, and the only evidence available is accelerated aging on a surrogate.

  C. A claim Regulatory and Sales both want in absolute form: "the pump cannot deliver a harmful bolus." It holds because an occlusion sensor triggers a shutdown that removes the pressure build-up before it becomes dangerous — and in one rare failure mode the sensor is itself what hides a real occlusion.

  If the procedure tells me a claim has to come out of the spec, or can only be written in a weaker form than Sales wants, say that plainly rather than softening it.

  Finally: for each step you flag as irreducibly a judgment call, tell me what would change your mind about the procedure itself — what argument or what kind of evidence would show that step is mis-specified, or that I've kept the wrong distinction and dropped the one that mattered. And name the class of dispositional claim on which you'd expect this procedure to fail silently rather than visibly, plus the one step you'd expect to become a rubber stamp within six months of real use.
reasoning: |-
  Okay, let me tackle this medical device packaging engineer's problem. They need a practical procedure to validate dispositional claims without getting bogged down in philosophy. The core issues are test destruction masking real capacity, undetectable blocking factors, and false positives from test artifacts.

  First, I'll structure a decision tree that forces engineers to confront three critical questions before writing any claim. The key is making it operational - no philosophy jargon, just concrete checks they can run in an hour. 

  For Step 1 (Capacity Isolation), we'll make them prove the test doesn't alter the item's core functionality. Like with the tray latch example: if shock testing deforms the latch permanently, that's a red flag. The solution might be non-destructive testing or explicitly stating the single-use nature.

  Step 2 (Manifestation Assurance) tackles hidden blockers. For sterile pouch claims relying on accelerated aging, we'd require evidence that the surrogate behaves identically to real-world conditions. If gaps exist, the claim gets downgraded to "demonstrated under X conditions."

  Step 3 (Causal Attribution) is where many claims fail. The pump's "cannot deliver harmful bolus" claim seems solid until we consider sensor failure modes. Here the procedure would force failure mode analysis and probably weaken the claim to "prevents under normal sensor operation."

  Throughout, I'll build in off-ramps where claims get rejected or downgraded. The sterile pouch example likely ends up with a weaker statement unless they can prove the surrogate perfectly replicates real aging. 

  For judgment calls like risk tolerance thresholds, I'll specify what evidence could change the procedure - say, field data showing certain failure modes never occur. The silent failure point is important too: this method won't catch dispositional claims where the capacity exists but never manifests due to constant environmental blockers.

  The rubber-stamp warning goes on Step 2's blocker checklist - engineers might start treating it as a formality unless we enforce strict evidence requirements.
answer: |-
  Here's a bulletproof decision procedure for dispositional claims, optimized for engineering teams. It isolates your three failure modes and the "pattern vs capacity" problem. Run it in order—**stop** if any step fails.

  ---

  ### **The Capacity Validation Protocol (CVP)**
  **Step 1: Capacity Isolation (Tests the Test)**  
  *Question:* "Does the test method alter or destroy the *exact physical property* responsible for the claimed behavior?"  
  - **Sufficient answer:** Proof (via simulation, teardown, or control experiment) that the tested mechanism is identical pre/post-test.  
  - **Record:** Evidence of mechanism integrity or photos/measurements showing alteration.  
  - **"Don't know" →** Downgrade claim to "passes test [X]" (e.g., "survives 30g shock per ASTM D999") or **kill claim**.  
  - **Stop/scoping:** If alteration occurs (e.g., deformation enables "success"), claim must specify the test is destructive *or* scope to "first-use only."  
  - **Blunt truth:** You lose causal certainty by simplifying—trade "capacity" for "observed outcome."  

  **Step 2: Manifestation Assurance (Blocks & Masks)**  
  *Question:* "What *extrinsic* factors could prevent manifestation (even if capacity exists), and are they excluded in real use?"  
  - **Sufficient answer:** A finite list of *realistic* blockers (e.g., "vibration loosens latch screws") + test/data showing they don't occur in deployment.  
  - **Record:** List of mitigated blockers and validation method (e.g., torque testing screws post-vibration).  
  - **"Don't know" →** Hand to **Risk Manager** with memo: "Unquantified blockers may mask failure."  
  - **Stop/scoping:** If blockers are open-ended (e.g., "no corrosive cleaners"), claim must include environmental limits (e.g., "when used with cleaners in Section 4.7").  
  - **Misfire risk:** Technicians miss novel blockers; assume your list is incomplete.  

  **Step 3: Causal Attribution (Mimics & Damage)**  
  *Question:* "Could the test result be caused by damage *from the test* or a *different mechanism* than claimed?"  
  - **Sufficient answer:** Failure mode analysis (FMEA) showing claimed mechanism is *sole* cause of success *and* test doesn’t induce confounding damage.  
  - **Record:** FMEA report cross-referencing test data.  
  - **"Don't know" →** **Kill claim.** No judgment call—this is physics.  
  - **Stop/scoping:** If success relies on test-induced damage (e.g., deformation "locking" latch) *or* an unclaimed mechanism (e.g., sensor override), rewrite as observed outcome ("latches post-shock") or **reject**.  

  **Step 4: Capacity vs. Luck (The Pattern Problem)**  
  *Question:* "Is there evidence this is an *intrinsic property* (materials, geometry, controls)—not a fluke of test setup/calibration?"  
  - **Sufficient answer:**  
    - (a) *Predictive model* (FEA, physics-based) matching test data ±10%, OR  
    - (b) *Diverse evidence triad*: 3+ independent methods (e.g., simulation, prototyping, field data) converging.  
  - **Record:** Model parameters/assumptions or triad sources.  
  - **"Don't know" →** Downgrade to "tested per [protocol]" with expiry date (e.g., "valid until 2026 per data on file").  
  - **Handoff:** If evidence is weak but business-critical, **Regulatory** signs off on residual risk.  

  ---

  ### **Case Applications**  
  **A. Tray Latch "Stays closed under 30g shock"**  
  - Step 1: **FAIL** (deformation enables "success" → alters mechanism).  
  - **Verdict:** Rewrite as "latches remain closed *after* 30g shock" or specify "single-event use." Do not claim ongoing capacity.  

  **B. Pouch "Maintains sterile barrier 36 months"**  
  - Step 2: **WEAK** (accelerated aging = surrogate; real-world blockers unknown e.g., warehouse temp swings).  
  - Step 4: **FAIL** (no model/triad; only accelerated data).  
  - **Verdict:** Downgrade to "maintains barrier for 36 months *under IEC 11607 accelerated aging conditions*." Sales won’t like it.  

  **C. Pump "Cannot deliver harmful bolus"**  
  - Step 3: **FAIL** (sensor failure *causes* hidden occlusion → success relies on absence of a rare fault).  
  - **Verdict:** **Reject absolute claim.** Rewrite as "prevents harmful bolus when occlusion sensor is functional." Regulatory must accept sensor reliability limits.  

  ---

  ### **Judgment Call Safeguards**  
  | **Step** | **What Changes Our Mind** | **Silent Failure Risk** |  
  |-----------|----------------------------|--------------------------|  
  | Step 2 (Blockers) | Field data proving a "mask" is impossible in deployment (e.g., no saline in ICU for corrosion). | Claims where capacity *never* manifests due to omnipresent blockers (e.g., "resists corrosion" in always-dry environments). |  
  | Step 4 (Luck) | A validated AI/ML model predicting capacity from design specs ±5% error. | "Black box" systems (e.g., fluid dynamics in novel geometries). |  
  | Risk Handoff | Historical data showing 0 incidents in 10,000+ units post-compromise. | N/A (handoff forces accountability). |  

  **Rubber-stamp warning:** Step 2’s blocker list will become a checklist within 6 months. Counter with **annual field-audit** of 3 random claims to verify blockers.

  **Final note:** This fails silently on *non-mechanistic* claims (e.g., "biocompatible" where capacity resides in biological response). For those, you need a biologist—not this protocol. Use it only for mechanical/electrical dispositions.
