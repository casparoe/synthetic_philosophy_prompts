  ## Joint Statement on the Absent-Minded Driver Problem

  We, the undersigned, agree on the following claims regarding the absent-minded driver scenario (as defined in the setup with payoffs 0, 4, and 1 for exits at the first intersection, second intersection, and end of road, respectively):

  ### Agreed Claims
  1. **Ex-ante arithmetic**:  
     The ex-ante expected payoff from a strategy with continuation probability \(p\) is \(4p - 3p^2\). This is maximized at \(p = 2/3\), yielding \(4/3\). For \(p = 1/3\), the ex-ante payoff is 1.

  2. **Sequential fixed point**:  
     If the driver re-optimizes at an intersection using a belief derived from their own strategy (with probability \(\frac{1}{1+p}\) of being at the first intersection), and assumes future actions mirror their choice, there is a unique fixed point at \(p = 1/3\) (yielding ex-ante payoff 1). This differs from the ex-ante optimum.

  3. **Belief formation via strategy**:  
     If the driver uses a strategy with continuation probability \(p\), the self-locating belief at an intersection is \(\frac{1}{1+p}\) for the first intersection and \(\frac{p}{1+p}\) for the second. This holds regardless of debates about normativity.

  4. **Commitment device effect**:  
     If the driver can irreversibly commit at the bar to a strategy, the optimal choice is \(p = 2/3\). This achieves \(4/3\), dominating the sequential fixed point.

  5. **Perfect-recall benchmark**:  
     With perfect recall (driver knows the intersection), the optimal plan is to continue at the first intersection and exit at the second, achieving payoff 4. This dominates all absent-minded outcomes.

  6. **Fleet/nightly average**:  
     In repeated trials (e.g., 1000 identical drivers or 1000 nights with one amnesiac driver), the realized average payoff converges to \(4p - 3p^2\) for a fixed strategy \(p\). Both agree \(p = 2/3\) averages \(4/3\) and \(p = 1/3\) averages 1.

  7. **Co-driver case**:  
     If a co-driver with perfect recall and no stake controls the wheel, they should continue at the first intersection and exit at the second, achieving 4. This shows the driver’s absent-mindedness costs payoff.

