  - If s=1/3, then the coefficient is zero, so any s is optimal.

  Therefore, the only fixed point is s=1/3, because:
  - If s<1/3, the driver wants to set s=1 (but then it's not consistent).
  - If s>1/3, the driver wants to set s=0 (but then it's not consistent).
  - At s=1/3, the driver is indifferent, so he might choose s=1/3.

