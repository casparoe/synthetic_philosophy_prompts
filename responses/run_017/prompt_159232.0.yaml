  - **Planner**: Might switch to the Sequentialist view if shown that in the absent-minded setting, the driver cannot implement any strategy other than the fixed point because of the lack of commitment. That is, if they are convinced that the ex-ante strategy is dynamically inconsistent and hence not implementable.

