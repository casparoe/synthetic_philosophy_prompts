  We are designing a 75-minute seminar activity for 14 students on moral uncertainty. The goal is for the class to make a binding collective choice on allocating a fixed pot of play money across 4 or 5 candidate projects. The activity must reveal three key issues in moral uncertainty aggregation without lecturing.

  Setup:
  - Each student has 10 credence chips to distribute privately across three moral views (sketched in one line each):
    1. Near-term maximizing consequentialism (NMC): "Maximize near-term welfare (next 10 years)."
    2. Deontological view (DV): "Respect rights and duties (e.g., no harm, keep promises) and prioritize special obligations (e.g., family, community)."
    3. Long-run consequentialism (LRC): "Maximize long-term welfare (over the next million years)."

  - There is a fixed pot of play money (say, $10,000 in play money) to be allocated among 4 or 5 projects.

  Projects (designed to engineer the three desired features):
  1. Project A: "Near-Term Relief Fund" - Provides immediate aid to current refugees (high impact in near term, but limited scope).
  2. Project B: "Family Support Program" - Supports families in the local community (fulfills special obligations, respects duties).
  3. Project C: "Far-Future Research" - Funds research into preventing existential risks (e.g., asteroid defense, AI safety) with very low probability of success but astronomical stakes if successful.
  4. Project D: "Balanced Approach" - A project that does reasonably well by all views: 
     - It provides some near-term aid (so NMC likes it somewhat), 
     - respects some deontological constraints (e.g., by helping in a way that doesn't violate rights, and supports some special obligations) so DV likes it, 
     - and also invests a little in long-term safety (so LRC gives it some credit, but not as much as Project C). 
     However, it is not the top choice for any view.
  5. Project E: "Global Health Initiative" - Focuses on medium-term global health (e.g., eradicating a disease in 20 years). This is a middle-of-the-road option that might be second or third for each view.

  We need to design the rankings such that:
  - Feature 1: Project D (Balanced Approach) is a respectable second for every view but not first for any. It should win under credence-weighted aggregation but lose if each student acts only on their most plausible theory (because then they would vote for their top project, and Project D might not get enough votes).
