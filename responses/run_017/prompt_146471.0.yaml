  ### Activity Design: Moral Uncertainty Allocation Seminar

  **Objective:** Students experience the aggregation problem in moral uncertainty through a collective allocation decision, revealing three key issues: compromise projects, fanaticism, and intertheoretic comparison sensitivity.

  ---

  ### **Setup & Materials**
  1. **Moral Views** (displayed on board/slide):  
     - **NMC (Near-Term Consequentialism):** "Maximize welfare in the next 10 years."  
     - **DV (Deontology):** "Respect rights/duties and prioritize special obligations (e.g., family, community)."  
     - **LRC (Long-Run Consequentialism):** "Maximize welfare over the next million years; the far future dominates."  

  2. **Projects** (described on handout):  
     - **A: Refugee Aid Now:** Immediate support for 100 refugees (shelter, food).  
     - **B: Local Family Grants:** Financial aid to 50 local families for education/health.  
     - **C: Existential Risk Lab:** Research center for asteroid/AI risks (0.001% chance of preventing extinction).  
     - **D: Balanced Resilience Fund:** Hybrid aid (30 refugees + 15 families + asteroid monitoring).  
     - **E: Disease Eradication:** Campaign to eliminate a disease in 20 years (saves 10,000 lives).  

  3. **Materials:**  
     - 10 credence chips per student (physical tokens or digital votes).  
     - Project descriptions + utility tables (hidden until debrief).  
     - Voting ballots + calculator/spreadsheet for aggregation.  
     - $10,000 play money (symbolic; allocated to the winning project).  

  ---

  ### **Rules & Timeline** (75 mins total)
  #### **1. Introduction (5 mins)**  
  - **Goal:** Allocate $10,000 to one project. Decision is binding.  
  - **Process:**  
    - Privately distribute 10 credence chips across NMC, DV, LRC (e.g., 5 NMC, 3 DV, 2 LRC).  
    - No discussion until voting ends.  

  #### **2. Credence Distribution (10 mins)**  
  - Students submit chip distributions anonymously.  
  - **Instructor:** Collect and calculate average credences (e.g., NMC 40%, DV 30%, LRC 30%).  

  #### **3. Shortcut Vote (10 mins)**  
  - Each student votes for the project their **most credible theory** prefers:  
    - NMC: Project A (maximizes near-term welfare).  
    - DV: Project B (fulfills special obligations).  
    - LRC: Project C (addresses existential risk).  
  - **Tally votes** and announce winner. *Project D never wins here.*  

  #### **4. Moral Uncertainty Aggregation (25 mins)**  
  - **Step 1:** Reveal utility tables (below).  
  - **Step 2:** Calculate expected value for each project:  
    `EV(project) = Σ [Credence(NMC) × U(NMC) + Credence(DV) × U(DV) + Credence(LRC) × U(LRC)]`  
    Sum across all students.  
  - **Utility Tables:**  

    | Project | NMC | DV  | LRC  |  
    |---------|-----|-----|------|  
    | A       | 100 | 20  | 10   |  
    | B       | 30  | 100 | 10   |  
    | **C**   | 0   | 0   | 100  | (*Base*) |  
    | **D**   | 80  | 80  | 80   |  
    | E       | 60  | 60  | 60   |  

    - **Recalculate with scaled LRC:** Change C’s LRC utility to **10,000** (revealing fanaticism).  

  - **Step 3:** Announce winners:  
    - **Base utilities:** Project D wins (compromise).  
    - **Scaled LRC:** Project C wins (fanaticism).  

  #### **5. Binding Vote & Implementation (10 mins)**  
  - Students vote on projects again, knowing results.  
  - Allocate $10,000 to the winner.  

  #### **6. Debrief (15 mins)**  
  - **Key Questions:**  
    1. **Compromise Project (D):**  
       - "Why did Project D lose the shortcut vote but win the base aggregation? How did its ‘respectable second’ status in all views matter?"  
       - *Reveal utility rankings:*  
         - NMC: A (1st), D (2nd)  
         - DV: B (1st), D (2nd)  
         - LRC: C (1st), D (2nd) → Wins credence-weighted EV.  

    2. **Fanaticism Problem (C):**  
       - "Project C won with scaled LRC utilities. Did you vote for it? Why or why not? How does this mirror real debates (e.g., ‘Pascal’s mugging’)?"  
       - *Expose stakes:* LRC values C at 10,000x NMC/DV scales, overwhelming other views.  

    3. **Intertheoretic Comparisons:**  
       - "When we scaled LRC’s utilities, the winner flipped. But did C’s *ordering* change in LRC? What does this say about cardinal scales?"  
       - *Reveal sensitivity:* Compressing LRC’s scale (÷100) would make D win again.  

    4. **Limitations:**  
       - "What couldn’t this activity capture? (e.g., strategic voting, theory-dependent scales, non-cardinal views)."  

  ---

  ### **Engineered Outcomes**
  1. **Project D (Compromise):**  
     - No theory ranks it first (A, B, C are #1 for NMC, DV, LRC).  
     - All rank it second (utilities: 80 > 60 for E, 30 for B under NMC, etc.).  
     - Wins base aggregation; loses shortcut vote (no #1 support).  

  2. **Project C (Fanaticism):**  
     - Only LRC ranks it first.  
     - Base utility (100): Loses to D.  
     - Scaled utility (10,000): Wins aggregation astronomically → Class rejects it in binding vote.  

  3. **Scale Sensitivity:**  
     - Base: D wins (C’s LRC=100).  
     - Scaled: C wins (LRC=10,000).  
     - Compressed: D wins again (LRC=1).  

  ---

  ### **What Will Go Wrong (First Time)**
  1. **Time Crunch:**  
     - Aggregation calculations may run long. *Fix:* Use a pre-made spreadsheet.  
  2. **Credence Skew:**  
     - If all students favor one theory, Project D may not win. *Fix:* Seed a student with split credence (e.g., 4/3/3).  
  3. **Binding Vote Rebellion:**  
     - Students may ignore Project C despite winning. *Use this:* Highlight fanaticism rejection in debrief.  
  4. **Utility Skepticism:**  
     - Students may challenge assigned utilities. *Response:* "This models the real challenge of intertheoretic comparison."  

  ---

  ### **What the Activity Cannot Model**
  1. **Non-Cardinal Theories:**  
     - Deontology often rejects utility curves. *Explain:* "We simplified to expose aggregation mechanics."  
  2. **Strategic Behavior:**  
     - Students may misreport credences. *Note:* "Real agents might manipulate inputs."  
  3. **Credence Updates:**  
     - No Bayesian updating from peer disagreement. *Clarify:* "Moral uncertainty often ignores social evidence."  
  4. **Incommensurability:**  
     - Scales assume comparability. *Emphasize:* "The ‘rigor’ of aggregation depends on this fragile step."  

  ### **Instructor Script for Debrief Closure**
  > "Today, you felt the aggregation problem. Project D won as a compromise when we weighed theories, but lost when you acted on your ‘best guess.’ Project C’s stakes forced a clash between arithmetic and intuition. And when we tweaked LRC’s scale, the verdict flipped—because *no moral meter* exists to compare theories. This is moral uncertainty: even with a ‘procedure,’ your inputs are only as solid as your courage to compare the incomparable."
