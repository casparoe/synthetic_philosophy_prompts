  ### Concrete Numerical Example

  Consider a jurisdiction with a 4-level score: {1, 2, 3, 4}. The threshold is set at 3, so defendants with scores 3 or 4 are detained. Two groups, A and B, each have 200 defendants. The observed data (over released scores 1 and 2) and marginal score distributions are:

  **Group A (200 defendants):**  
  - Score 1: 80 defendants, 8 rearrested (Y=1), 72 not rearrested (Y=0)  
  - Score 2: 40 defendants, 12 rearrested (Y=1), 28 not rearrested (Y=0)  
  - Score 3: 40 defendants (detained, Y unobserved)  
  - Score 4: 40 defendants (detained, Y unobserved)  

  **Group B (200 defendants):**  
  - Score 1: 40 defendants, 4 rearrested (Y=1), 36 not rearrested (Y=0)  
  - Score 2: 80 defendants, 24 rearrested (Y=1), 56 not rearrested (Y=0)  
  - Score 3: 40 defendants (detained, Y unobserved)  
  - Score 4: 40 defendants (detained, Y unobserved)  

  Monotonicity requires that within groups, P(Y*=1 | s) is nondecreasing. Observed:  
  - Group A: P(Y*=1|s=1) = 8/80 = 0.10, P(Y*=1|s=2) = 12/40 = 0.30  
  - Group B: P(Y*=1|s=1) = 4/40 = 0.10, P(Y*=1|s=2) = 24/80 = 0.30  

  Thus, for detained scores:  
  - Group A: P(Y*=1|s=3) ≥ 0.30, P(Y*=1|s=4) ≥ P(Y*=1|s=3)  
  - Group B: P(Y*=1|s=3) ≥ 0.30, P(Y*=1|s=4) ≥ P(Y*=1|s=3)  

  We define two completions for Y* in detained cells:  

  #### **Completion 1**  
  - Group A, s=3: 12 Y*=1 (P=12/40=0.30), 28 Y*=0  
  - Group A, s=4: 40 Y*=1 (P=40/40=1.00), 0 Y*=0  
  - Group B, s=3: 30 Y*=1 (P=30/40=0.75), 10 Y*=0  
  - Group B, s=4: 40 Y*=1 (P=40/40=1.00), 0 Y*=0  

  *Verification*:  
  - Reproduces observed data (s=1,2) and marginal score counts.  
  - Monotonicity: A: (0.10, 0.30, 0.30, 1.00); B: (0.10, 0.30, 0.75, 1.00) → nondecreasing.  

  *Results*:  
  - **Group A**:  
    - Y*=1: 8 (s=1) + 12 (s=2) + 12 (s=3) + 40 (s=4) = 72 → Base rate = 72/200 = 0.36  
    - Y*=0: 200 - 72 = 128  
    - FNR: Released Y*=1 / Total Y*=1 = (8 + 12) / 72 = 20/72 ≈ 0.2778  
    - FPR: Detained Y*=0 / Total Y*=0 = (28 + 0) / 128 = 28/128 = 0.2188  
    - Detention rate: (40 + 40)/200 = 80/200 = 0.40  

  - **Group B**:  
    - Y*=1: 4 + 24 + 30 + 40 = 98 → Base rate = 98/200 = 0.49  
    - Y*=0: 200 - 98 = 102  
    - FNR: (4 + 24) / 98 = 28/98 ≈ 0.2857  
    - FPR: (10 + 0) / 102 = 10/102 ≈ 0.0980  
    - Detention rate: (40 + 40)/200 = 80/200 = 0.40  

  *Disparities*:  
  - FNR: A (0.2778) < B (0.2857) → A has lower FNR  
  - FPR: A (0.2188) > B (0.0980) → A has higher FPR  

  #### **Completion 2**  
  - Group A, s=3: 40 Y*=1 (P=40/40=1.00), 0 Y*=0  
  - Group A, s=4: 40 Y*=1 (P=40/40=1.00), 0 Y*=0  
  - Group B, s=3: 12 Y*=1 (P=12/40=0.30), 28 Y*=0  
  - Group B, s=4: 12 Y*=1 (P=12/40=0.30), 28 Y*=0  

  *Verification*:  
  - Reproduces observed data and marginal score counts.  
  - Monotonicity: A: (0.10, 0.30, 1.00, 1.00); B: (0.10, 0.30, 0.30, 0.30) → nondecreasing.  

  *Results*:  
  - **Group A**:  
    - Y*=1: 8 + 12 + 40 + 40 = 100 → Base rate = 100/200 = 0.50  
    - Y*=0: 100  
    - FNR: (8 + 12) / 100 = 20/100 = 0.2000  
    - FPR: (0 + 0) / 100 = 0/100 = 0.0000  
    - Detention rate: 80/200 = 0.40  

  - **Group B**:  
    - Y*=1: 4 + 24 + 12 + 12 = 52 → Base rate = 52/200 = 0.26  
    - Y*=0: 148  
    - FNR: (4 + 24) / 52 = 28/52 ≈ 0.5385  
    - FPR: (28 + 28) / 148 = 56/148 ≈ 0.3784  
    - Detention rate: 80/200 = 0.40  

  *Disparities*:  
  - FNR: A (0.2000) < B (0.5385) → A has lower FNR  
  - FPR: A (0.0000) < B (0.3784) → A has lower FPR  

  #### **Reversal of Disparities**  
  - In **Completion 1**: A has **lower FNR** and **higher FPR** than B.  
  - In **Completion 2**: A has **lower FNR** and **lower FPR** than B.  
  - *Note*: While the FNR direction (A lower) is consistent, the FPR direction reverses: A has higher FPR in Completion 1 but lower in Completion 2. This isolates the underdetermination for FPR. For full reversal (FNR and FPR both flip), a more complex example is possible, but this suffices to show FPR is not identified.  

  ---

  ### Calibration Check
  - **Observed cells (s=1,2)**:  
    - s=1: A has P(Y=1)=0.10, B has P(Y=1)=0.10 → calibrated.  
    - s=2: A has P(Y=1)=0.30, B has P(Y=1)=0.30 → calibrated.  
  - **Detained cells (s=3,4)**:  
    - Completion 1: A has (0.30, 1.00), B has (0.75, 1.00) → **not calibrated** (s=3 differs: 0.30 vs 0.75).  
    - Completion 2: A has (1.00, 1.00), B has (0.30, 0.30) → **not calibrated** (all cells differ).  
  - **Significance**: Calibration in released cells is observed and holds here, but it is refuted (not verifiable) in detained cells. This asymmetry means calibration cannot be validated from observed data alone, making it an unreliable fairness criterion with selective labels.  

  ---

  ### Commentary on Conceptual Issues  

  #### **4. Completion-Robust Criteria**  
  - **Robust criteria** (return same verdict under all completions):  
    - **Detention rate disparity**: In this example, both groups have detention rate = 0.40 under all completions. If detention rates differ, that disparity is identified.  
    - **Observable error rates** (e.g., FNR/FPR restricted to released defendants) are identified but not policy-relevant.  
  - **Non-robust criteria**:  
    - **FPR/FNR**: As shown, direction of disparity reverses with completion.  
    - **Calibration in detained cells**, PPV, and base rates are not identified.  
  - **Decision-only criteria** (e.g., demographic parity in detention rates) are robust because they quantify over decisions (observed), not outcomes (unobserved).  
  - **Accuracy implications**: Accuracy (e.g., overall error rate) is not identified. The fairness-accuracy trade-off is unquantifiable without resolving the completion ambiguity.  

  #### **5. Bearing of Impossibility Results**  
  - The impossibility theorem (calibration vs. error rate equality) is a constraint on the **joint distribution** (Y*, decisions) but **not on policy** with selective labels, since Y* is unobserved in detained cells.  
  - **Guidance for choice**:  
    - **Worst-case reasoning** (e.g., minimize maximum FPR disparity) is conservative but may be overly pessimistic.  
    - **Audit sampling**: Randomly release detained defendants to measure Y* and restore identification. This is ethically challenging and risks public safety.  
    - **Sensitivity analysis**: Report ranges of disparities under admissible completions to inform policy trade-offs.  
  - **Costs**:  
    - Worst-case: May unnecessarily exacerbate disparities.  
    - Audit sampling: Safety risks and ethical concerns; requires careful implementation.  

  #### **6. Underdetermination with Equal Detention Rates**  
  - In this example, detention rates are equal (0.40 for both groups), yet FPR disparity direction is still underdetermined (reverses between completions).  
  - **Which feature pins down the disparity?**  
    - If detention rates are **equal and the score distribution is identical across groups**, underdetermination may persist. However, if the distribution of outcomes in released cells differs (e.g., Group A has higher observed FPR in released), it can bound the admissible completions.  
    - **Observable quantity with power**: The **group-specific score distribution** in released cells determines the minimal FPR disparity. For instance, if one group has higher observed FPR in released scores, it may constrain the worst-case FPR in detained cells.  
  - **Why it matters**: Even with equal detention rates, fairness criteria relying on unobserved outcomes remain non-robust. Policy should prioritize decision-based metrics or accept ambiguity quantified via sensitivity analysis.  

  ---

  ### Summary  
  This example exposes a fundamental limitation in algorithmic fairness with selective labels: standard impossibility results (e.g., calibration vs. error rate equality) depend on unobservable quantities. The choice between error disparities is not determined by observed data, rendering the impossibility theorem a constraint on an unobserved joint distribution, not necessarily on deployable policies. Fairness criteria based solely on decisions (e.g., demographic parity) are robust, while those requiring unobserved outcomes (e.g., FPR, FNR) are not. To navigate this, policymakers should use sensitivity analysis, worst-case bounds, or audit sampling—each with trade-offs. Equal detention rates do not resolve underdetermination; the burden falls on observable data to constrain disparities, highlighting the need for transparency in uncertainty.
