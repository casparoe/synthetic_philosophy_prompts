prompt: |-
  Bit of a problem with next week's section: I've been handed the regress problem and the three standrd responses — foundationalism, coherentism, infinitism — and I have fifty minutes with about twenty first-years. Don't explain the regress problem to me, I've taught it before; what I need is a plan for how to get it across.

  The thing that makes this hard: last week's session was on observation versus theory in science, and observation got presented more or less as the bedrock, so they're going to walk in as instinctive foundationalists and think the answer is obvious. Most of them are econ or CS majors and are comfortable with proof trees and citation graphs, which I suspect is a mixed blessing. What I want by the end is that they can say one actually strong thing in favor of each of the three views, and can state the best objection to whichever one they like — the usual outcome of this session is foundationalism winning by default and infinitism getting laughed out of the room, and I want to avoid that without turning infinitism into a straw man either.

  My half-formed organizing idea is to frame the disagreement as a disagreement about the *shape* of justificatory structure: a tree with a root, a web with no edges, a road with no end. I like that it makes the three views look parallel instead of ranked. But I've started to worry the shape framing is precisely what makes infinitism sound like a lunatic claim about psychology (nobody has an endless road inside their head) rather than a claim about what justification consists in. Tell me if I should keep it, and if I keep it, at what point in the sequence I have to block that slide. Relatedly: I wasn't planning to give them the fourth option, the skeptical one where nothing terminates and so nothing is justified at all — should that be in the room from the start, named and set aside, or does it just derail a fifty-minute session?

  The example I was going to build everything on is citation chasing: you look up a claim, the paper cites another paper, that one cites another, and it either never bottoms out or bottoms out in something nobody ever sourced. I'm now suspicious of it — I think it might smuggle in foundationalism, since students will just take "the primary source" as the foundation and declare the question settled. Is that right? If it's rot, what should the carrying example be, and what would it have to have and lack to do the work? My guess is it needs a support relation that is clearly not causal, and an open-ended chain that feels normal rather than pathological, but tell me what else is required.

  Misconceptions I'm expecting: "foundationalism means some beliefs are indubitable"; "coherentism is just circular reasoning, so any self-consistent fairy tale is justified"; "infinitism says you need infinitely many beliefs in your head before you know anything". Have I got the list right, what am I missing, and at exactly which point in the sequence should each be headed off — pre-empted before it forms, or corrected after? One I'm unsure about: they may slide between justification as a structure of reasons and justification as the history of how I came to hold the belief. If that's a real risk, tell me what in my sequencing invites it and where to fix it.

  Also: give me one question to end on that shows they got it rather than memorized three labels. I was going to ask them to pick a belief and say what justifies it on each view, but that feels like it only tests recall — something better if you have it. And tell me what to openly refuse to cover; my instinct is to leave internalism/externalism and reliabilism out entirely and say out loud that we're setting them aside.

  Write it as a plan I can walk in with — order, rough timing if that's useful, and what I actually say at each transition. American English, please.
reasoning: |-
  Okay, let me tackle this professor's request for a lesson plan on the regress problem. They have fifty minutes with twenty first-years who are mostly econ and CS majors, coming off a session that presented observation as bedrock - so they're likely instinctive foundationalists. The goal is balanced understanding: students should articulate one strong point for each view (foundationalism, coherentism, infinitism) and the best objection to their preferred view, avoiding foundationalism winning by default or infinitism being dismissed. 

  Hmm, the professor's half-formed shape metaphor (tree, web, road) seems promising but risks psychologizing infinitism. Need to reinforce that it's about justification structures, not mental inventory. The citation example is clever but might accidentally validate foundationalism if students fixate on "primary sources." Should suggest alternatives like software dependency chains where "source code" isn't epistemically privileged. 

  Key misconceptions to preempt: foundationalism ≠ indubitability, coherentism ≠ fairy tales, infinitism ≠ infinite beliefs in heads. The history/structure confusion is sneaky - best addressed upfront by explicitly distinguishing "why I believe" from "what justifies." 

  For the closing question, "pick a belief and apply each view" feels too recall-based. Instead, propose: "Which view best handles a Wikipedia edit war?" That forces evaluation, not regurgitation. 

  Definitely set aside skepticism and externalism upfront - no time. Sequencing should be: 
  1) Reactivate regress problem via shape metaphor (5 min) 
  2) Foundationalism with observation critique (15 min) 
  3) Coherentism via scientific theory revision (15 min) 
  4) Infinitism through incremental justification (10 min) 
  5) Synthesis and Wikipedia question (5 min) 

  Need to explicitly block psychologizing during the infinitism intro by saying: "This isn't about what's in your head right now - it's about potential reasons." Citation example stays but gets reframed: "What if the primary source cites earlier work?" to expose infinite regress naturally. 

  For the history/structure trap, build in a moment when contrasting "how Professor X came to believe P" versus "what justifies P for Professor X." Econ/CS majors will grasp this if tied to citation graphs versus belief formation timelines.
answer: |-
  Here’s a battle-tested 50-minute plan focused on **structure over psychology**, leveraging your students’ econ/CS intuition while preempting misconceptions. The goal is **equitable plausibility** for all three views.

  **Key Moves:**  
  - Reframe "bedrock" as *problematic* from minute one.  
  - Use a **neutral, non-psychological example** (algorithm dependency).  
  - Explicitly separate *justification structure* from *cognitive history*.  
  - Preempt top misconceptions **before** introducing each view.  

  ---

  ### **The Plan**  
  *(Total: 50 min | Format: Interactive lecture w/ rapid pair-share prompts)*  

  #### **1. Reactivate Regress + Introduce "Structure" Frame (5 min)**  
  - *Script:* "Last week, observation seemed like bedrock. But bedrock *ends* chains of justification. Today: what *must* a structure of reasons look like for justification to work? We’re not asking how minds *store* beliefs, but what *relation* between beliefs makes them justified. Example: debugging code."  
  - *Example:* **Software Dependency Chain**  
    - `Program A` → requires `Library B` → requires `Library C` → ...  
    - "If someone asks ‘Why trust A?’, we trace dependencies. But what *ends* this chain? A ‘fundamental’ library? Circular dependencies? Or does it just keep going?"  
    - *Why it works:* CS majors get dependencies. No "source code = foundation" bias (unlike citations).  

  #### **2. Foundationalism (15 min)**  
  - *Preempt misconception (BEFORE naming view):* "Some think foundations must be indubitable—but must they? What if foundations are fallible but *privileged*?"  
  - *Introduce:* "Foundationalism: justification is a tree. Roots = basic beliefs (e.g., sensory data, logical axioms). Branches = beliefs derived from roots."  
  - *Strength:* "It stops the regress cleanly. Basic beliefs *don’t need further reasons*—they’re self-justifying or justified by experience."  
  - *Best objection (ask them):* "What *makes* a belief basic? If ‘I see red’ depends on vision science, is it really bedrock?" (Highlight: **theory-laden observation** from last week).  
  - *Transition:* "If foundations are shaky, what’s Plan B?"  

  #### **3. Coherentism (15 min)**  
  - *Preempt misconception:* "Some say coherentism = circular reasoning. But is a bicycle wheel ‘circular’ in a bad way? Coherence is about *mutual support* across a network."  
  - *Introduce:* "Coherentism: justification is a web. Beliefs justify each other *holistically*. Strength comes from fit—like a puzzle."  
  - *Strength:* "Explains how science revises theories: no single ‘bedrock’ fails; we adjust the web for best fit."  
  - *Best objection:* "Couldn’t a fairy tale be coherent? What anchors the web to *reality*?"  
  - *Transition:* "If webs feel unanchored, is there a third way?"  

  #### **4. Infinitism (10 min)**  
  - *Preempt misconception (CRITICAL):* "Infinitism does **NOT** say you need ∞ beliefs in your head. It says: for any belief, there’s an *available* reason, then another—potentially endless. Like a path stretching forward, not a backpack full of reasons."  
  - *Introduce:* "Infinitism: justification is a road. No start/end—just chains of reasons extending indefinitely."  
  - *Strength:* "Avoids arbitrary foundations and circularity. Justification is always *in progress*—like science."  
  - *Best objection:* "Does this make justification impossible? Can we *ever* have a justified belief if reasons never end?"  
  - *Block psychologizing:* "Remember: this is about the *structure* of reasons (like dependency chains), not your brain’s RAM!"  

  #### **5. Synthesis + Killer Closing Question (5 min)**  
  - *Reframe disagreement:* "So: is justification a tree, web, or road? Foundationalism values security, coherentism flexibility, infinitism humility."  
  - *The Pivot Question:*  
    > **"Wikipedia says ‘Water is H₂O.’ Pick ONE view (foundationalism/coherentism/infinitism) and tell me: what’s the *strongest objection* to using that view to justify this claim?"**  
    - *Why it works:* Tests grasp of *objections* (not regurgitation), forces application, reveals if they see trade-offs. Econ/CS students will enjoy "attacking" a claim structurally.  

  ---

  ### **What to Explicitly Exclude**  
  - **Skepticism:** "We’re asking *how* justification *could* work—not whether it’s possible. Skepticism is a valid fourth option, but we bracket it today."  
  - **Internalism/Externalism/Reliabilism:** "Today is about the *structure* of reasons. We’ll set aside whether justification requires awareness of reasons (internalism) or just reliability (externalism)."  

  ---

  ### **Why This Sequence Works**  
  1. **Dependency chain example** avoids foundationalist bias (no "primary source" halo).  
  2. **Preempting misconceptions upfront** stops bad ideas before they form (e.g., infinitism ≈ psychology).  
  3. **Objections > defenses**—forces engagement with weaknesses (even for their preferred view).  
  4. **Closing question** is adversarial and applied—econ/CS majors will treat it like a puzzle.  
  5. **Shape metaphor stays** but is **neutered** by:  
     - Explicitly separating *structure* from psychology (repeated 3x).  
     - Using algorithmic example (structures they respect).  

  **Walk in ready to say:** *"Today is about blueprints, not buildings—what shape must a structure of reasons be to hold weight?"* You’ve got this.
