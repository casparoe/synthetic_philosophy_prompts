prompt: |-
  Hi — I'm a science-and-ideas writer at a magazine, mostly covering AI, and I keep losing arguments with our style desk about when we're allowed to write that a system thinks, decides, wants, or refuses. Last month we ran a piece saying a chatbot "refused to answer" and a reader wrote in to say we'd smuggled in a mind; the month before we said a chess program "sacrificed its queen" and nobody blinked. I was arguing about this with a friend who edits at another outlet and her rule is just "never use mental verbs about machines," which seems definately too crude to me — we use them about firms, markets, and ant colonies all the time. So I want something better than a vibe: a short procedure my team can actually run. Constraints: reporters with no philosophy training, filing in a few hours, an assigning editor has to sign off, and it has to fit on one page of the style guide and work for headlines and photo captions, not just body copy.

  The theory I want it built out of is Dennett's three stances — physical, design, intentional — plus the companion idea that a pattern counts as real rather than merely projected when there is a description of the data that compresses it, so that predicting via the pattern is cheaper than tracking the underlying detail and any observer doing the bookkeeping would extract the same pattern. Please turn that into ordered steps, and please fix my draft list rather than rubber-stamping it (say which of my steps are circular or in the wrong order). Roughly what I have in mind: (1) a compression audit — the reporter must be able to write down, in one sentence in their notes, the cheaper description that the mental verb is buying; if they can't produce it, stop and no intentional language; (2) a design-availability check — a lot of the systems I write about are trained rather than built, so nobody can say what the parts are for, and I suspect this case is where the usual three-stance picture quietly breaks down and the intentional language starts doing work the design story should have done; (3) whether the intentional description buys predictions the design or physical story doesn't already give, over a prediction horizon the reporter has to name at filing time (new prompts? new board positions? new temperatures?) rather than just over the cases already in the story; (4) whose design it is — if the design stance is unavailable, does the attribution belong to the trainers and objective-setters instead of the system; and (5) some handoff point where the remaining question is about readers rather than metaphysics, i.e. how likely this sentence is to be read as a causal explanation rather than a summary, and how much it matters if it is. I also want a retraction clause: when an intentional prediction later fails on a new case, what exactly are we obliged to print, and why "the system changed its mind" is or isn't an available move. And I'd like the procedure to sort sentences into grades — unhedged attribution, hedged "as if", scare quotes, "in the vocabulary of the field" — and say which grade it licenses and with what typographic marking, since half our fights are about whether to use the quotes at all.

  Then run it on three sentences. One: "the model refused to answer" for a chatbot that was tuned to decline certain requests. Two: "the chess system sacrificed its queen" and "the system prefers positions it can win from." Three: something like "the ant colony chose the shorter route" or "the thermostat wants the room at twenty degrees" — a case where I suspect the procedure licenses unhedged mental language and I will hate the result. Please include at least one worked case where the procedure gives me an answer I don't like, and be explicit about the cases it can't settle at all, where an editor just has to decide. If you can also flag where the procedure will misfire in practice — the failure modes of the checklist itself, not just of the sentences — that would be genuinely useful.
reasoning: |-
  Okay, the user is a science writer dealing with a style guide conflict about using mental verbs for AI systems. They want a practical, step-by-step procedure based on Dennett's stances and compression theory. Let me start by understanding their constraints: reporters without philosophy training, quick turnaround, one-page limit, applicable to headlines and captions.

  First, I need to unpack their draft steps. They mentioned compression audit, design-availability, prediction horizon, attribution, and reader perception. But their steps might be out of order or circular. For instance, checking design availability before compression might be better because if the design stance is available, it could affect how we approach compression. Also, the prediction horizon step should come after compression since it tests the pattern's utility.

  The user is concerned about trained systems where the design stance breaks down. That's a key point. In such cases, intentional language might sneak in to fill gaps. The procedure needs to flag when design isn't available and handle attribution to trainers instead of the system.

  The retraction clause is important. If an intentional prediction fails, they need clear guidelines on corrections. Saying "the system changed its mind" isn't acceptable because it implies agency. Instead, they should explain the pattern shifted due to new data or context.

  Grading the language into unhedged, hedged, scare quotes, etc., will help standardize usage. Each step should determine which grade is appropriate. For example, if compression fails, no mental verbs; if prediction horizon is short, use hedged language.

  Testing the procedure on examples: Chatbot "refused" – here the design stance is available (tuning), so intentional language might be misleading. Compression might exist but prediction horizon is short. Result: hedged language. Chess program "sacrificed" – design stance isn't needed, compression is strong, prediction horizon long. Unhedged is okay. Thermostat "wants" – compression exists, but prediction horizon is immediate. Here, the user dislikes unhedged, so the procedure might suggest "as if" to avoid anthropomorphism.

  Failure modes: Reporters might skip steps under deadline pressure. Compression could be misinterpreted. Editors might override. Need to emphasize simplicity and clarity. Also, borderline cases will require editorial judgment, which the procedure should acknowledge.

  Overall, structuring the steps logically, ensuring each builds on the previous, and providing clear examples will make the guide usable. Balancing theory with practicality is crucial for the team's adoption.
answer: |-
  Here’s a streamlined, executable procedure based on your framework, designed for non-philosophers under deadline pressure. I’ve refined your steps for logical flow, removed circularity, and added grading/practical safeguards. The core principle: **Use intentional verbs *only* if they capture a real pattern that compresses data *and* the design stance can’t fully explain it.**

  ---

  ### **Style Guide Addendum: Intentional Language for Non-Human Systems**  
  **(1-Page Procedure)**

  **When considering phrases like "the system thinks/decides/wants/refuses":**

  1.  **🔍 Pattern Compression Check (Is it real?):**
      *   *Ask:* "Can I write a **single, testable sentence** explaining the *pattern* this verb captures, using *fewer details* than listing all relevant inputs/outputs?"
      *   *Example (Chess):* Instead of listing 1000 board states where it moved the queen into danger for later gain, say: "Prefers positional sacrifice for long-term initiative."
      *   *Fail? → STOP. No intentional verbs.* (e.g., "The model *wants* to be helpful" fails – too vague).
      *   *Pass? → Note the compression sentence. Proceed.*

  2.  **🛠️ Design Stance Availability (Can we avoid mind-talk?):**
      *   *Ask:* "Is there a clear, documented **designer intention or training objective** that *directly and fully* explains this specific behavior?"
      *   *Trained Systems:* If behavior emerges unpredictably from training (not hard-coded), design stance is *unavailable* for *that behavior*. Proceed.
      *   *Built Systems:* If behavior is explicitly programmed (e.g., thermostat rule), design stance *is* available. **STOP. Use design language** (e.g., "The thermostat *is set to* maintain 20°C," not "wants").
      *   *Pass (Design Unavailable)? → Proceed.*

  3.  **⏱️ Predictive Utility Check (Is it useful?):**
      *   *Ask:* "Does my compression sentence **predict *new* behaviors** over a defined **horizon** (e.g., new prompts, board positions, sensor inputs)? Name the horizon."
      *   *Example Horizon:* "Over the next 50 user queries on similar topics," or "In mid-game positions with material imbalance."
      *   *Fail? → STOP. Intentional language adds no value; use physical/design/statistical description.*
      *   *Pass? → Proceed. Note the prediction horizon.*

  4.  **🧩 Attribution & Hedging (Who/How to say it?):**
      *   *If Design Stance *was* available (Step 2):* **Attribute to designers.** Use **hedged language** ("as if," "behaves as though") **+ scare quotes** if verb is strongly anthropomorphic (e.g., "wants," "refuses"). *Avoid unhedged attribution to the system.*
      *   *If Design Stance *was unavailable* (Step 2):*
          *   **Does the compression pattern hold robustly *across contexts* within the prediction horizon?** (Yes → **Unhedged** attribution *to the system* is acceptable for established patterns. No → **Hedged** ("appears to," "effectively").
          *   **Is the verb core domain jargon?** (e.g., "search algorithm *prefers* node X") → **Unhedged, no quotes** (treated as technical term).
      *   *Default Caution:* When in doubt, **hedge** and/or **use "in the vocabulary of [field]"** framing.

  5.  **👁️ Reader Safeguard (Will it mislead?):**
      *   *Ask:* "Is this sentence **likely to be misread as implying consciousness or causal agency** (beyond pattern description), *and* does the context lack space to clarify?"
      *   *High Risk?* (e.g., headline, caption, verb like "believes" or "lied") → **Use stronger hedge/scare quotes** or **rewrite**.
      *   *Low Risk?* (e.g., technical body text, established jargon like "prefers") → Proceed with graded language from Step 4.

  **Retraction Protocol:**
  *   If an **intentional prediction fails** within its stated horizon: **Correct the record.**
  *   *Do NOT say* "the system changed its mind." **Explain:** "The pattern previously observed ([state compression sentence]) did not hold under [new condition]. This suggests the behavior was more context-dependent/locally optimal than the intentional description captured." Attribute error to the *description's limitation*, not system agency.

  ---

  ### **Procedure Walkthrough & Failure Modes**
  **Why this order?** Steps 1-3 test the *metaphysical* claim (is it a real, useful pattern?). Step 4 handles *attribution* based on design availability. Step 5 is purely *pragmatic* (reader risk). Your draft had Step 2 (design) after compression, but knowing design availability *first* is crucial – if design explains it, compression is irrelevant for *intentional* attribution.

  **Critical Failure Modes:**
  1.  **Skipping Step 1 (Compression):** Leads to vibe-based usage. *Safeguard:* Require the compression sentence in the reporter's note.
  2.  **Ignoring Step 2 (Design):** Biggest source of "smuggled minds" – using intentional language where design suffices. *Safeguard:* Explicit "STOP if design available" rule.
  3.  **Vague Prediction Horizon (Step 3):** "It predicts!" without defining scope invites future failures. *Safeguard:* Mandate naming the horizon.
  4.  **Overlooking Step 5 (Reader):** Academics vs. general readers differ. *Safeguard:* Force consideration of placement/context.
  5.  **Editor Override:** Sometimes readability trumps precision. *Safeguard:* Procedure forces explicit justification for intentional use; override requires acknowledging the deviation.

  **Unsettled Cases:** Borderline compression (Step 1), highly context-dependent prediction (Step 3), high-stakes reader misperception (Step 5). **→ Editor's judgment call.**

  ---

  ### **Worked Examples**

  1.  **"The model refused to answer."**
      *   **Step 1 (Compression):** *Pass.* Pattern: "Declines prompts matching safety filter triggers." (Simpler than listing all declined prompts).
      *   **Step 2 (Design):** *Available.* Behavior is *direct result* of explicit safety tuning/rlhf. **→ STOP.** Use design language.
      *   **Result:** **REWRITE.** "The model, tuned to avoid harmful content, declined to answer." *or* Hedged + Quotes: "The model 'refused' to answer per its safety constraints." (If context demands brevity/capture user experience). **NO unhedged "refused".**

  2.  **a) "The chess system sacrificed its queen."**
      *   **Step 1:** *Pass.* Pattern: "Trades queen for positional advantage/material deficit leading to checkmate in N moves." (Compresses vast decision trees).
      *   **Step 2:** *Unavailable.* While designed to play chess, specific sacrifice isn't hard-coded; emerges from evaluation function/search.
      *   **Step 3:** *Pass.* Prediction: "Will identify sacrificial opportunities in similar complex mid-games." Horizon: "Mid-game positions with material imbalance."
      *   **Step 4:** Robust pattern, domain jargon ("sacrifice"). → **Unhedged, no quotes.** OK.
      *   **Step 5:** Low risk (chess term). → **OK.**
      *   **Result:** **✅ Unhedged "sacrificed" acceptable.**

      **b) "The system prefers positions it can win from."**
      *   **Step 1:** *Pass.* Pattern: "Assigns higher evaluation scores to positions with higher calculated win probability." (Core to function).
      *   **Step 2:** *Unavailable.* Win probability estimation is learned/emergent.
      *   **Step 3:** *Pass.* Prediction: "Will consistently choose moves increasing win probability." Horizon: "Entire game."
      *   **Step 4:** Robust, fundamental jargon ("prefers" in AI/game theory). → **Unhedged, no quotes.**
      *   **Step 5:** Low risk (technical). → **OK.**
      *   **Result:** **✅ Unhedged "prefers" acceptable.**

  3.  **"The thermostat wants the room at twenty degrees."** (Your disliked case)
      *   **Step 1:** *Pass?* Pattern: "Activates heat/cool to drive temperature towards 20°C." (Simpler than tracking sensor/relay states).
      *   **Step 2:** **AVAILABLE.** This is *exactly* the programmed function. **→ STOP.** Use design language.
      *   **Result:** **REWRITE.** "The thermostat is set to/maintains 20°C." **NO "wants".** *Procedure prevents the result you dislike.*

      **"The ant colony chose the shorter route."**
      *   **Step 1:** *Pass.* Pattern: "Pheromone accumulation leads to higher traffic on shorter paths between nest/food." (Compresses individual ant paths).
      *   **Step 2:** *Unavailable.* Emergent behavior; no designer for the colony *system*.
      *   **Step 3:** *Pass.* Prediction: "Will shift traffic to new shorter paths if created." Horizon: "Within hours/days of path change."
      *   **Step 4:** Robust pattern, common biological usage. → **Unhedged acceptable** (or mild hedge like "collectively chooses").
      *   **Step 5:** Low risk (common bio metaphor). → **OK.**
      *   **Result:** **✅ Unhedged "chose" acceptable.** (This is where Dennett *expects* intentional stance use!).

  ---

  This procedure provides a concrete, auditable path from Dennett/compression theory to actionable style rules. It prioritizes halting intentional language where design suffices (fixing the chatbot "refused" case), permits it for robust emergent patterns (chess "sacrifice"), blocks it for simple mechanisms (thermostat "wants"), and handles edge cases (ant colony) consistently. The grading system and retraction clause address practical editorial concerns. The main vulnerabilities are rushed compression checks or editors overriding Step 5 for impact – but the framework forces explicit justification.
