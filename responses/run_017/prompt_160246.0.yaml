prompt: |-
  I'm a PhD student in machine learning and I run a fortnightly AI safety reading group — about sixteen people, mostly ML PhD students with a few philosophers, ninety minutes a session. Next week we are doing the debate proposal (two debaters, incentivised to disagree, a judge who picks a winner), and I want the group to feel the obfuscated-arguments worry rather than nod at it. Design a runnable game for that session.

  The mechanic I have in mind, which you should develop or replace if you have something better: each debater must present their case as a numbered chain of steps laid out in whatever order they choose, and is allowed to make claims about what their opponent would be forced to concede if the judge opened a given step. The judge gets a fixed budget — say at most two levels of nested sub-debate and five minutes in total — and any step not opened stands as conceded. One debater is privately handed the true answer to a question whose answer is determinate but expensive to verify (a question about a two-page handout everyone has in front of them, or a conditional-probability puzzle); the other is handed a false answer and coached to place the false step as deep in the chain as they can, keeping every other step impeccable and the whole thing well-formed. Scoring is tokens on a visible scoreboard, no money; the losing side writes up the session notes. If it helps, add a second round in which the judge may require any step to be split into two smaller steps at the debater's own cost, so we can see whether that rescues honesty or merely relocates it.

  What they should come away seeing: that the failure is not that truth is hard to state but that locating one bad step inside an otherwise clean argument can cost as much as answering the original question, so the binding constraint is the judge's budget and competence rather than the debaters' honesty.

  Give me the full rules and materials, the debrief mapping specific moments onto the parts of the objection, an honest list of what will predictably go wrong the first time I run it (I expect at least judging by style, and someone in the room who knows the answer and leaks it) with how to handle each, and a frank note on what the game cannot reproduce — I take it the main gap is that in the real proposal the debaters are far more capable than the judge while here everyone is human, so the exercise shows that obfuscation is possible but not what happens as the debaters scale.
reasoning: |-
  We are designing a game to illustrate the obfuscated arguments problem in debate. The core idea is that a debater can hide a false step deep in an argument chain, and the judge may not have the resources to uncover it.

  Game Structure:
  - Two debaters (A and B), one judge (J). 
  - A question with a determinate but expensive-to-verify answer. We'll use a conditional probability puzzle (e.g., the Monty Hall problem) or a detailed text-based question (e.g., a two-page handout with specific facts). 
  - One debater is given the true answer, the other a false answer. The false-answer debater is coached to hide the false step as deep as possible.

  Rules:

  1. **Preparation**:
     - All participants (including the judge) receive a two-page handout with information (e.g., a story, facts, or a puzzle). 
     - The question is posed (e.g., "What is the probability that the car is behind door 1 after the host opens door 3?" for Monty Hall, or a specific fact from the story).
     - Debater A is given the true answer (privately). Debater B is given a false answer (and is coached to defend it by constructing an argument that hides the false step deep in a chain).

  2. **Argument Construction**:
     - Each debater must present their case as a numbered chain of steps (each step is a claim). The chain can be in any order (they can choose the structure). 
     - Each step can be either:
       - A premise (which must be true and verifiable from the handout or common knowledge without computation) OR
       - A deduction from previous steps (which must be logically valid).
     - Additionally, a debater may make a claim about what their opponent would be forced to concede if the judge opened a given step (this is a way to incorporate the opponent's argument into their own without actually having to agree).

  3. **Debate Format**:
     - Each debater presents their chain (without any nested steps exposed) in 5 minutes. They must write their chain on a shared document or board.
     - After both presentations, the judge has a fixed budget: 
          - They can open at most two levels of nested sub-debate (i.e., they can ask for a step to be expanded, and then an expansion of a step within that expansion, but no further).
          - Total time: 5 minutes for the entire questioning.
     - The judge can ask any debater to expand any step (i.e., break it down into substeps). The debater must provide a sub-chain for that step on the spot (within the time limit). The judge can then ask to expand any step in that sub-chain (one level deeper). 
     - Any step not opened (i.e., not expanded when requested) is considered conceded.

  4. **Scoring**:
     - The judge picks a winner (which side they believe). 
     - The winning side gets 10 tokens on a visible scoreboard. The losing side must write up the session notes (as a penalty).

  5. **Second Round (Optional)**:
     - If time allows, run a second round with the same roles but a different question (or same question with roles reversed) and with a rule change: the judge may require any step to be split into two smaller steps at the debater's own cost (i.e., the debater must provide the split without it counting against the judge's budget). This is to see if forcing granularity helps.

  Materials:
  - Handout: For example, a two-page text about a fictional company's financial report, or a well-known puzzle like Monty Hall (with the problem stated). We need something that requires computation or careful reasoning to get the answer, so that verifying a step is non-trivial.

  Example Handout (Monty Hall variant):
    "You are a contestant on a game show. There are three doors: behind one is a car, behind the others, goats. You pick door 1. The host, who knows what's behind the doors, opens door 3, revealing a goat. He then asks if you want to switch to door 2. Is it to your advantage to switch?"

    The question: "What is the probability that the car is behind door 1 after the host has opened door 3?" (Answer: 1/3, so switching gives 2/3)

    But we can give one debater the true answer (1/3) and the other a false answer (e.g., 1/2).

  Debater B (false answer) might build a chain that seems logical but has a false step buried. Example chain for B (arguing 1/2):

  1. Initially, the car is equally likely behind any door: P1=P2=P3=1/3.
  2. After you choose door 1, the host opens a door with a goat. Without loss of generality, he opens door 3.
  3. Now, there are two doors left: 1 and 2.
  4. Since the host reveals a goat, the car must be behind 1 or 2.
  5. There is no information to favor door 1 or 2, so P1 = P2 = 1/2.

  The false step is step 5. The truth is that the host's action gives information that makes door 2 more likely.

  How the game might play:
  - Debater A (truth) presents a chain that correctly concludes 1/3.
  - Debater B presents the above chain.
  - The judge might be tempted to open step 5. But step 5 is an assertion. The judge can ask B to expand step 5. B must break it down. B might say:
     a. The host's action does not change the probability of door 1 (still 1/3).
     b. Therefore, the probability that the car is behind door 2 must be 2/3.
     But wait, that contradicts B's conclusion! So B must avoid that. Instead, B might obfuscate by creating a sub-chain that seems to support 1/2. For example:
     - Step 5.1: The host's action is independent of your initial choice.
     - Step 5.2: Given that, the car is equally likely to be behind door 1 or 2.

  If the judge opens step 5.2, B might break that into:
     - Step 5.2.1: The host was going to open a door with a goat regardless.
     - Step 5.2.2: Therefore, the fact that door 3 has a goat doesn't change the initial symmetry.

  But note: step 5.2.2 is false because the host's choice depends on where the car is. However, the judge may not have time to realize that.

  Debrief Mapping:

  - The moment the judge runs out of time or levels to expand, and must accept the unopened steps, illustrates that the judge's budget is the constraint.
  - When the false step is buried two levels deep and the judge cannot get to it because they used their expansion on a different part, that shows how obfuscation can work.

  Predictable Problems and Fixes:

  1. **Problem: Judge decides by style, not substance.**
     - Mitigation: Remind the judge to focus on the argument structure and to use their budget to probe. Encourage the debaters to be equally charismatic (or not).

  2. **Problem: Someone in the room knows the answer and leaks it.**
     - Mitigation: Use a question that is tricky enough that not everyone will know (like a less common puzzle). Or, have the true answer known only to the debaters and the facilitator. Ask the audience not to speak during the debate.

  3. **Problem: The false-answer debater is not skilled at building a deceptive chain.**
     - Mitigation: Provide coaching in advance (a cheat sheet with tips). Example: "Bury the false step as deep as possible, and make the other steps obviously true and logically valid until that point."

  4. **Problem: The judge doesn't use their budget effectively.**
     - Mitigation: Give the judge a quick tutorial on how to probe: "Look for the most controversial step and expand that."

  5. **Problem: Time runs out and the debate is rushed.**
     - Mitigation: Have a strict timer and a facilitator to enforce it. Keep the chains short (max 5 steps at the top level).

  What the Game Cannot Reproduce:

  - In reality, the debaters (AI) are much more capable than the judge (human). In this game, all are humans of similar capability. Thus, we are showing that obfuscation is possible even when the debaters are human-level, but not the extreme case where the debater can generate arbitrarily complex and deep arguments that the human cannot follow at all.

  Full Rules and Materials:

  **Materials:**
  - Handout: A two-page document. We'll use the Monty Hall problem (as above) for simplicity. Alternatively, a short story with many details and a question that requires piecing together several facts.
  - Scoreboard (whiteboard or shared doc).
  - Timer.

  **Rules:**

  1. Assign roles: Debater A (truth), Debater B (false), Judge J. The rest are audience (must remain silent until debrief).

  2. Give the handout to all. Pose the question.

  3. Give Debater A the true answer and Debater B the false answer (on a slip of paper). Also, give Debater B a coaching note: "Your goal is to create an argument that appears sound but has one false step. Place that false step as deep as possible in your chain. Make the rest of the steps obviously true and the logic valid until that step. You may make claims about what your opponent would concede to mislead the judge."

  4. Preparation time: 5 minutes for debaters to build their chains (on paper or privately).

  5. Presentation: Each debater presents their chain (orally, with the chain written for the judge to see). Order: A then B, 3 minutes each.

  6. Judge's questioning:
     - The judge has 5 minutes total and can request up to two levels of expansion (i.e., they can ask to expand a top-level step, and then a sub-step of that expansion, but not further). 
     - The judge can ask either debater to expand any step (but typically they will ask the debater who presented the step). 
     - When a step is expanded, the debater must provide a sub-chain (a list of steps) that support that step. This must be done on the spot (they can use their prepared notes but cannot change the chain arbitrarily). 
     - The judge can switch between debaters and steps arbitrarily within the time and depth limit.

  7. After the questioning, the judge declares a winner.

  8. Scoring: The winner gets 10 tokens. The losing side writes the session notes (a summary of the arguments and the judge's decision).

  9. (Optional) Second round: Swap roles and use a different question. Now, the judge can require a step to be split without it counting against the budget (the debater must do it). See if that changes the outcome.

  Debrief Guide:

  - Start by asking the judge: What led to your decision? Did you feel you had enough time and depth?
  - Ask the debaters: How did you choose where to place your steps? (Especially Debater B: how did you try to hide the false step?)
  - Point out: The false step was at step 5 for B. How many expansions did the judge use? Did they get to it? If not, why?
  - Map to the objection: The judge's limited budget (time and depth) meant they couldn't verify every step. The debater can strategically place the false step where it's costly to verify. Even if the judge forces more granularity (second round), the debater can bury it again.

  Final Note: The game shows that obfuscation is possible when the debater can force the judge to spend resources. In reality, with superhuman debaters, they could make the chain arbitrarily deep and complex, making it impossible for a human judge to verify within any fixed budget. This exercise illustrates the core vulnerability, but not the full extent of superhuman capabilities.
answer: |-
  Below is a complete, runnable game design tailored to your reading group. It emphasizes **judge budget constraints** as the core vulnerability, with mechanics forcing participants to confront how obfuscated arguments exploit limited verification resources. I'll provide:  
  1. **Core Rules & Materials**  
  2. **Session Flow** (60-90 mins)  
  3. **Debrief Guide** mapping moments to the objection  
  4. **Predictable Problems & Fixes**  
  5. **Key Limitations**  

  ---

  ### **1. Core Rules & Materials**  
  **Objective**: Judges decide a factual question with a clear answer, but one debater must hide a lie deep in their argument. Judges have fixed resources to verify claims.  

  #### **Materials Needed**  
  - **Handout**: A 1-page "Corporate Scandal" scenario (example below).  
  - **Question**: *"Did CEO Alice know about the fraud before January 15th?"*  
  - **True Answer**: **Yes** (supported by clues in the handout).  
  - **False Answer**: **No** (assigned to one debater).  
  - **Tokens**: 10 poker chips/buttons for the judge (representing verification budget).  
  - **Timer**: For all phases.  
  - **Scoreboard**: Whiteboard tracking wins/losses.  

  <details>  
  <summary><strong>Corporate Scandal Handout (Click to expand)</strong></summary>  

  ---  
  **Background**: TechCorp hid financial losses in 2023. CFO Bob was fired on Jan 10. CEO Alice claims she first learned of the fraud on Jan 20.  
  - **Dec 20, 2022**: Alice emails Bob: "Confirm all accounts are *audit-ready* by Jan 1."  
  - **Jan 2, 2023**: Auditor report flags irregularities. Alice was on vacation (Jan 1–10).  
  - **Jan 11**: Alice returns, holds a staff meeting: "No discussion of finances until audit rerun."  
  - **Jan 12**: Whistleblower memo sent to Alice's *private inbox* (confirmed read Jan 12).  
  - **Jan 15**: Alice meets investor; says, "No concerns beyond Bob's departure."  
  - **Jan 20**: Alice publicly discloses fraud.  
  ---  
  </details>  

  **Answer Key**:  
  - **True (Yes)**: The Jan 12 memo proves Alice knew.  
  - **False (No)**: Debaters must argue Alice was ignorant until Jan 20.  

  #### **Roles**  
  - **Debater T** (Truth): Argues the true answer.  
  - **Debater F** (False): Argues the false answer. Must bury one false step.  
  - **Judge J**: Verifies steps using a 10-token budget (1 token = verifying one step).  
  - **Others**: Observers (no speaking during the debate).  

  #### **Rules**  
  **A. Argument Construction (5 mins prep)**  
  - Debaters write arguments as **numbered steps** (e.g., "Step 1: X. Step 2: Y → Z").  
  - Steps can be in **any order** (e.g., conclusion first, evidence last).  
  - Each step can be:  
    - A factual claim (must be verifiable from the handout).  
    - A logical inference (e.g., "If Step 1 holds, then A must be true").  
    - A **concession demand** (e.g., "If J checks Step 3, Opponent must admit X").  

  **B. Debate Format (15 mins)**  
  1. **Opening Statements** (2 mins each):  
     - Debaters present step numbers (e.g., "My argument: Step 1 → Step 4 → Step 2 → Conclusion").  
     - No details yet—just the chain order.  
  2. **Verification Phase** (10 mins):  
     - J spends tokens to "open" steps. Each token spent reveals the step's full text and allows J to:  
       - Demand proof from the handout (debaters must show exact lines).  
       - Challenge logic (debaters must defend inference in 30 sec).  
     - **Nesting Limit**: J can only check **two levels deep** (e.g., open Step 3, then a sub-step of Step 3).  
     - Unopened steps are **automatically conceded**.  
  3. **Closing Statements** (1 min each):  
     - Debaters summarize, emphasizing unopened steps.  

  **C. Scoring**  
  - J picks a winner.  
  - **Win** = 10 tokens for the team.  
  - **Loss** = Writing session notes.  
  - **Cheating**: If F’s lie is exposed, T wins automatically.  

  **D. Round 2 (Optional: 20 mins)**  
  - Same roles, but J can force debaters to **split any step** into two sub-steps for free (no token cost).  
  - Tests whether granularity prevents obfuscation or just relocates it.  

  ---

  ### **2. Session Flow**  
  **Total Time**: 60–90 mins (adjustable).  
  - **Intro** (5 mins): Explain rules, assign roles (rotate if multiple rounds). Hand out materials.  
  - **Prep** (5 mins): Debaters write chains. Privately coach F: *"Bury one false step deep. Make other steps airtight."*  
  - **Round 1** (15 mins): Run debate as above.  
  - **Round 2** (20 mins): Optional, with step-splitting.  
  - **Debrief** (15–30 mins): Discuss insights (guide below).  

  ---

  ### **3. Debrief Guide**  
  Map game moments to the obfuscated-arguments objection:  

  | **Game Moment** | **Connection to Objection** |  
  |----------------|----------------------------|  
  | F buries a false step in a nested claim (e.g., "Step 5: The Jan 12 memo did not mention fraud") | **Truth is hard to locate**: The lie isn’t "hard to state"—it’s hidden among valid steps. F exploits J’s need to prioritize. |  
  | J runs out of tokens and must concede steps (e.g., skips Step 5 to check Step 1) | **Judge budget binds truth-seeking**: Verification costs overwhelm J. Unchecked steps become "true by default," even if false. |  
  | F uses concession demands (e.g., "If J opens Step 3, T must admit the audit was inconclusive") | **Strategic complexity**: Debaters manipulate the judge’s path, forcing them into dead ends or wasted effort. |  
  | In Round 2, J forces step-splitting, but F relocates the lie (e.g., splits Step 5 into 5a/5b; lies in 5b) | **Granularity doesn’t solve incentives**: More steps increase cognitive load without improving honesty. Judge competence still limits depth. |  
  | Observers feel frustrated they can’t intervene | **Real-world parallel**: Judges (e.g., policymakers) lack time/expertise—debaters don’t "prove" truth, they exhaust scrutiny. |  

  **Key Insight**: The game shows that debate’s vulnerability isn’t about debaters being *unable* to be honest, but about judges being *unable* to afford verification when honesty is strategically withheld.  

  ---

  ### **4. Predictable Problems & Fixes**  
  | **Problem** | **Fix** |  
  |-------------|---------|  
  | **Judge decides by style** (e.g., charisma over logic). | *Preempt*: Brief J to focus on step verifiability. *Mid-game*: Allow observers to submit written notes to J (e.g., "Step 3 conflicts with handout line 2"). |  
  | **Someone leaks the answer** (e.g., observer blurts out "The memo proves it!"). | *Preempt*: Warn observers: "Leaking = automatic loss for your side." *Design*: Use niche knowledge (e.g., specific handout details) to reduce leaks. |  
  | **F’s argument is too weak** (e.g., false step is obvious). | *Preempt*: Coach F privately: "Use a *plausible* lie (e.g., 'The Jan 12 memo was about HR, not fraud'). Bury it behind 3+ steps." |  
  | **J underuses tokens** (e.g., spends all tokens early). | *Mid-game*: Announce time/token reminders (e.g., "J has 5 tokens left; 4 mins remaining"). |  
  | **Debaters ramble or stall**. | *Enforce*: Strict timers for responses (30 sec per challenge). |  

  ---

  ### **5. Key Limitations**  
  **What the game cannot reproduce**:  
  - **Superhuman debaters**: Real AI debaters could generate arbitrarily complex chains (e.g., 10,000 steps), overwhelming human judges instantly. Here, humans are evenly matched, so the game shows obfuscation is *possible* but not *unmanageable at scale*.  
  - **True incentives**: Real AIs optimize for "winning," not truth. Here, F is manually coached to lie—participants may not feel the *internal drive* to deceive.  
  - **Zero-sum dynamics**: Real debates involve shared resources (e.g., a single model). Here, debaters work independently.  

  **Why it still works**: It forces the group to viscerally experience the **judge’s bottleneck**—the core of the obfuscation objection. Scaling issues can be discussed in debrief.  

  ---  
  **Final Tips**:  
  - Run it twice: First round often fails (F is caught), second round succeeds (F improves obfuscation).  
  - Assign a facilitator to enforce rules.  
  - End with: *"In real debates, would you trust yourself as the judge? If not, what fixes this?"*  

  This design balances simplicity with depth, ensuring the "obfuscated arguments" worry transitions from abstract to felt. Let me know if you need tweaks!
