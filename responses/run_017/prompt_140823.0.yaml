prompt: |-
  A mate of mine is in a small sports-betting syndicate and ive been trying to work out what their actual rules commit them to. The rules are: size every bet with the Kelly criterion off their model's own probabilities; bet half of whatever fraction Kelly gives, on the grounds that the probabilities are estimated rather than known; stop betting for the rest of the season if the bankroll drops below 60% of where it started the season; and at the end of each season withdraw everything above a fixed starting stake, so compounding restarts at the same number every year, even though they describe what theyre doing as maximizing long-run growth.

  What does that package presuppose? Is the thing doing the work really log utility / geometric growth, or is it just unstated risk aversion plus estimation risk, and which parts of the practice strictly require which? Does cashing out every year quietly undercut the long-run growth argument, which needs compounding to get going, and leave only the myopia-of-log argument, or are those the same argument in different clothes? Does the 60% floor presuppose a side constraint or a lexicographic cut-off that no growth-rate story can generate on its own, and does the result that Kelly eventually beats any essentially different strategy even survive once you put an absorbing barrier in the model? Also, over a season of a few hundred bets, isnt the asymptotic result basically beside the point?

  Half-remembered and worth checking: in the continuous approximation the growth rate is roughly quadratic in the fraction staked, so anything past about twice your Kelly fraction has negative growth and half Kelly costs you only about a quarter of the maximum growth rate. If thats right, does it make half Kelly defensible on straight growth-maximizing grounds, or does that move smuggle in something extra? And is there a view about pure time preference in here somewhere, given that they discount future bankroll growth at zero while pulling winnings out immediately?

  Please keep settled math separate from whats genuinely contested among people who know this material, e.g. whether the growth-rate argument is an independent justification of Kelly or just log utility in disguise, and dont present a contested reading as the consensus. And tell me where the rules are underdetermined, i.e. where several different theories would license exactly the same behaviour.
reasoning: |-
  Okay, let me try to unpack this user's query about their friend's sports-betting syndicate rules. They're asking a lot of nuanced questions about Kelly criterion implementation, risk management, and the theoretical underpinnings. 

  First, I need to parse the actual rules: they use half-Kelly based on their model's probabilities, have a 60% bankroll stop-loss, and reset to fixed capital annually. The user wants to know what assumptions this package implies and whether it truly maximizes long-term growth as claimed.

  Hmm... the annual reset is particularly interesting. Compounding is interrupted every year, which directly contradicts the asymptotic growth argument for Kelly. But maybe their "long-run growth" claim is more about myopic log utility maximization per bet? That would explain the reset but creates tension with their stated goal.

  The 60% floor feels like it comes from outside the Kelly framework - probably pure risk aversion or operational constraints. Kelly alone would never suggest an absorbing barrier since the growth-optimal strategy assumes infinite play. This definitely breaks the "eventually dominates" property. 

  For the half-Kelly adjustment... ah right, the user mentions that quadratic growth approximation. If true, sacrificing 25% growth for reduced volatility might be mathematically justifiable when probabilities are uncertain. But is that still growth-maximizing or does it sneak in risk aversion? Probably both - it's hedging against model error.

  The user seems sophisticated - they're aware of controversies like "is Kelly just log utility in disguise?" I should flag where experts disagree versus settled math. Also need to note underdetermined aspects: their stop-loss could stem from risk aversion, bankruptcy costs, or psychological factors - same behavior, different motivations.

  Season length matters too. With only hundreds of bets, asymptotic results don't apply. The reset and stop-loss make this effectively finite-horizon, so their "long-run" framing might be misleading. 

  Time preference is sneaky here: withdrawing annually implies they value immediate cash over future compounding. But their growth calculations ignore discounting - inconsistent framing.

  For responses: I'll separate clean math (quadratic approximation) from contested theory (growth vs utility), call out where rules conflict with stated goals, and identify which elements serve which purpose. The annual reset particularly undermines the compounding argument - that's crucial.
answer: |-
  Here's a breakdown of the syndicate's rules, their presuppositions, and the tensions between theory and practice, separating settled math from contested interpretations:

  ### Core Rules & Their Presuppositions
  1.  **Kelly Sizing (with model probabilities):**
      *   **Presupposes:** A belief in maximizing expected logarithmic utility of wealth *per bet* ("myopic" Kelly). This maximizes the *geometric mean growth rate* for that specific bet, assuming their probabilities are correct and bets are sequential.
      *   **Requires:** A bankroll, probabilistic edge estimates, and odds.

  2.  **Half-Kelly Fraction:**
      *   **Presupposes:** Significant *model risk* or *estimation error*. They distrust their own probability estimates.
      *   **Settled Math:** The growth rate `g(f)` *is* approximately quadratic near the optimal fraction `f*`: `g(f) ≈ r + (s²/2)f* - (s⁴/(8f*))(f - f*)²` (where `r` is risk-free rate, often 0, and `s` relates to edge/odds). Halving Kelly (`f = f*/2`) sacrifices roughly 25% of the *maximum possible* growth rate `g(f*)`. Growth *does* become negative for `f > 2f*`.
      *   **Contested/Underdetermined:** Whether halving is optimal *for growth under uncertainty*. It's a common heuristic, but:
          *   *Growth Defense:* If uncertainty is high enough that the *true* `f*` might be half their estimated `f*`, halving protects against ruin and avoids negative growth. Sacrificing 25% growth for drastically reduced risk of ruin *can* be framed as long-run growth maximizing under model uncertainty (avoiding catastrophe is paramount for compounding).
          *   *Risk Aversion Smuggling:* It undeniably introduces risk aversion relative to the myopic Kelly based on their model. The choice of *half* (vs. 60%, 40%) often reflects a desired risk/return tradeoff, not pure growth.
      *   **Underdetermined:** The exact level of model distrust. "Half" is a rule-of-thumb; different uncertainty levels could justify different fractions.

  3.  **60% Stop-Loss (Absorbing Barrier):**
      *   **Presupposes:** A hard constraint *external* to pure growth maximization.
      *   **Settled Math:** This **fundamentally breaks** the asymptotic "Kelly eventually dominates" property. Strategies incorporating absorbing barriers can have different dominance characteristics. Kelly assumes infinite play and no barriers.
      *   **Requires:** Either:
          *   **Lexicographic Preference:** Survival (BR > 60%) is an *absolute priority* over any growth rate consideration. Growth maximization only happens *above* this floor.
          *   **Non-Financial Constraints:** Operational costs, psychological limits, syndicate agreements, or external capital requirements that make continuing below 60% infeasible/undesirable (e.g., "we won't bet with less than $X").
      *   **Contested/Underdetermined:** Pure growth-rate maximization *cannot* generate this rule on its own. It's an exogenous constraint driven by risk aversion, practicalities, or a survival imperative.

  4.  **Annual Reset (Withdraw Excess):**
      *   **Presupposes:** A strong form of *time preference* and separates "seasonal bankroll" from "personal wealth."
      *   **Undercuts Compounding:** This **severely undermines the long-run growth argument**. Kelly's growth optimality relies critically on compounding *over the very long run*. Resetting annually interrupts this compounding process.
      *   **Aligns with Myopic Log Utility:** If each season is viewed as a *separate sequence of bets* starting from `S₀`, then sizing via Kelly (even half-Kelly) *does* maximize the expected geometric growth *for that specific season*, assuming their probabilities. This is the "myopia" property of Kelly.
      *   **Implies Discounting:** Withdrawing winnings immediately values current cash more than the *potential* for greater future growth via compounding. They are explicitly choosing consumption now over higher expected wealth later. Their *stated* goal ("maximizing long-run growth") conflicts with this action, unless "long-run" resets yearly.

  ### Key Questions Addressed

  *   **Is it really about geometric growth?** Only *within* a season, due to the reset. The stop-loss and reset destroy the infinite-horizon compounding essential for Kelly's long-run dominance. The *seasonal* behavior aligns with myopic log utility maximization per season.
  *   **Log Utility vs. Growth Rate Argument:** The rules package blurs the lines:
      *   *Within a Season:* Kelly/Half-Kelly sizing is consistent with *both* maximizing expected log utility *and* maximizing the geometric growth rate *for that finite season* (settled math).
      *   *Long-Run (Multi-Season):* The reset breaks the equivalence. Maximizing *expected log wealth at T years* requires compounding. Withdrawing annually means they are *not* doing this. Their growth is capped per season. The growth argument is *not* the primary driver at this timescale; consumption and season separation are.
  *   **Does the 60% floor presuppose a constraint?** **Yes, absolutely.** It cannot be derived from pure growth maximization or log utility alone. It requires a lexicographic preference for survival above 60% or an external constraint.
  *   **Does Kelly dominance survive the barrier?** **No.** The absorbing barrier fundamentally changes the strategy space and dominance properties. Asymptotic results relying on infinite play without barriers no longer apply cleanly.
  *   **Is the asymptotic result beside the point?** **Yes, largely.** With a few hundred bets per season, an annual reset, and an absorbing barrier, the infinite-horizon asymptotic results are irrelevant. Focus shifts to the distribution of *seasonal* outcomes and risk management (which the rules explicitly address via half-Kelly and the stop-loss).
  *   **Half-Kelly Defensible on Growth Grounds?** **Contingently Yes.** *If* model uncertainty is sufficiently high that the *true* optimal fraction is significantly less than their estimated `f*`, then using a fraction like `f*/2` *can* be justified as a way to maximize *long-run realized* growth by avoiding ruin or severe drawdowns caused by overbetting on erroneous probabilities. It sacrifices *potential* max growth for *robustness*. The quadratic approximation shows the cost (25%) is bounded.
  *   **Time Preference?** **Yes, explicitly.** Withdrawing everything above `S₀` annually demonstrates a strong preference for current consumption (or wealth outside the betting bankroll) over future compounded growth *within the bankroll*. They value `$X` now more than the expected value of `$X * (1 + g)^n` in `n` years, where `g` is the expected seasonal growth rate. Their growth calculations ignore discounting, but their actions incorporate it heavily via the reset.

  ### Underdetermined Aspects (Same Behavior, Different Theories)

  1.  **Half-Kelly Fraction:**
      *   Could stem from: Uncertainty aversion, a specific utility function (e.g., CRRA with gamma>1), a desire to reduce short-term volatility, or a belief it maximizes *robust* long-run growth under estimation error.
  2.  **60% Stop-Loss:**
      *   Could stem from: Lexicographic survival preference, fixed costs requiring a minimum bankroll, syndicate rules mandating dissolution below a threshold, or extreme risk aversion (though a smooth utility function usually implies a gradual response, not a hard barrier).
  3.  **Annual Reset:**
      *   Could stem from: Pure time preference/consumption need, viewing each season as a separate project/profit center, psychological separation ("winnings are for spending"), tax considerations, or simplifying accounting. The *behavior* of resetting is clear; the *motivation* for choosing this over compounding is not uniquely determined by growth or utility theory alone.

  ### Conclusion

  The syndicate's rules are a pragmatic blend, heavily influenced by model distrust and operational constraints, rather than a pure application of Kelly for long-run growth:

  1.  **Within a Season:** They *approximately* follow myopic expected log utility / geometric growth rate maximization, strongly tempered by model uncertainty (half-Kelly) and bounded by a survival constraint (60% floor).
  2.  **Across Seasons:** The annual reset severs the connection to long-run compounding growth. They prioritize annual profit-taking/consumption and restarting at a known size over maximizing expected terminal wealth over many years. "Maximizing long-run growth" is more accurately described as "maximizing expected seasonal growth *rate*" under significant risk controls, with profits consumed annually.
  3.  **Key Drivers:** Model risk/estimation error is central (justifying half-Kelly). The 60% stop-loss reflects an absolute priority on capital preservation beyond a point, external to growth theory. The annual reset reveals strong time preference for consumption over multi-year compounding.

  The rules are defensible as a robust, practical approach to betting under uncertainty with defined risk limits and a seasonal profit-taking structure, but they depart significantly from the theoretical ideal of maximizing compounded growth over an indefinite horizon. The work is done by a mix of geometric growth principles (within seasons), model risk mitigation, lexicographic survival preferences, and time preference for consumption.
