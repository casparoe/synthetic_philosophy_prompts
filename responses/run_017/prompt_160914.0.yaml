  We are building a theory of collections/properties for natural-language semantics. We need to handle self-application, a universal domain, and non-identifying of coextensive properties. We cannot have the naive comprehension because of Russell's paradox. We must explain why the naive reasoning fails and handle Curry-like paradoxes (which use conditionals, not negation). We also need an account of how a competent speaker can use the Russell predicate without immediate contradiction.

  Sections:

  1. The requirements (numbered, ~500 words)
  2. Prejudices, not desiderata (~150 words)
