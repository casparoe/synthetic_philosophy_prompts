  ### Commitment Race Scenario: Research Grant Proposal

  In a university research group, Alice and Bob are co-leads on a grant proposal. They must choose one of two methodologies (X or Y) by the deadline in 10 days. A key peer review (revealing which method is optimal) arrives exactly on day 10. If they wait for it, they’ll choose correctly, securing a $100K grant (split evenly: $50K each). Choosing early risks a 50% chance of error, reducing expected grant value to $50K ($25K each). Additionally, the first to formally decide gains a $10K personal "leadership bonus" from their dean. Commitments are made via a **latency-locked system**: when a researcher commits (by clicking a button), it’s instantly timestamped and irrevocable, but only becomes visible to the other and takes effect after a fixed lag of *T* days. If both commit, the earliest timestamp wins the bonus; the loser’s commitment is void. The private bonus ($10K) is less than each researcher’s share of the loss from deciding uninformed ($25K), satisfying $10K < $25K.

  #### Equilibrium Reasoning
  - **T = 0 (no lag):**  
    Commitments are visible immediately. At time *t=0*, if Alice doesn’t commit, Bob can commit instantly, getting $35K ($25K grant share + $10K bonus) while Alice gets $25K. If both commit simultaneously, each has a 50% chance to win the bonus (expected $30K). Not committing risks being preempted ($25K) versus waiting ($50K). The unique equilibrium is both racing to commit at *t=0*: each expects $30K, worse than waiting ($50K). After losing, the timestamp loser does nothing (accepts $25K), as the decision is locked.  
  - **T > 10 (e.g., T=14):**  
    Commitments made before day 10 become visible after day 10 (e.g., day 14). If Alice commits at *t<10*, Bob (unaware) faces uncertainty: if he commits, he gets the bonus only if Alice hasn’t committed (yielding $35K), but if she has (probability *p*), he gets $25K. Not committing gives $25K if Alice committed or $50K if not. Bob’s payoff for committing is *35(1-p) + 25p*, versus *25p + 50(1-p)* for waiting. Since *35 - 10p < 50 - 25p* for all *p* < 1, Bob strictly prefers waiting. Alice reasons identically. Unique equilibrium: both wait for day 10, get $50K each.  

  #### Key Diagnoses
  - **Lag’s Effect:** The race defuses for *T* > 10. This is **due to restored option value**, not rivalry shifts. The lag introduces uncertainty about preemption, making early commitment unattractive (since the bonus is small and the cost of blind decisions high). Rivalry (the bonus) is still present, but the lag prevents it from triggering a race by shielding information.  
  - **Critical Feature:** **Uncertainty about opponent commitment during the lag**. Removing it (e.g., if the system notified others a commitment *exists* without details) would restore racing incentives.  
  - **Harm Source:**  
    - *T=0*: Harm from **haste** (foreclosing waiting) **and rivalry** (fear of preemption).  
    - *T>10*: Lag eliminates haste by preserving waiting; rivalry remains but is inert.  

  #### Attack from Commitment Optimists  
  A critic would argue the scenario is rigged by **adding an arbitrary bonus ($10K) to force conflict**. They’d claim that without it, commitment technologies only enable Pareto improvements (e.g., binding to wait). However, this misses that real-world decision-right incentives (credit, control) are inherent and small compared to option value losses. The technology *creates* the race by enabling preemption, turning a small conflict into a destructive equilibrium. The bonus isn’t artificial—it’s a natural feature of delegation (e.g., promotions, recognition). Removing commitment ability *does* harm individuals (as losing it leaves one vulnerable to preemption), proving the technology isn’t neutral.  

  ### Verdicts Satisfied  
  1. **T=0 equilibrium**: Both race to commit at first chance; loser accepts voided commitment.  
  2. **Worse off racing**: Both get $30K expected (race) vs. $50K (waiting).  
  3. **Losing commitment ability harms**: If Alice cannot commit, Bob preempts her at *T=0*, giving her $25K < $30K (race expected).  
  Private bonus ($10K) < individual loss share ($25K) holds explicitly.
