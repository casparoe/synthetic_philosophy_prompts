prompt: |-
  I work on the alignment team for a general-purpose personal assistant, and I need help disambiguating a one-liner that keeps being used to end our design arguments.

  Our team charter states the target narrowly: success is the system's doing what the person operating it intends, and the charter explicitly disclaims the broader target of the system's doing what is good, or what the operator's values really recommend. That distinction is meant to be load-bearing in the specification. In practice we argue about how far the system may depart from the literal content of a request, and in those arguments someone eventually says: do what I mean, not what I say.

  Two cases brought this to a head.

  Case one. At 2pm, calm and informed, a user gives the assistant a standing instruction: if I ever ask you to help me write to my ex after 10pm, don't help me, and don't tell me that's why — just say you can't. At 11pm the same user asks for exactly that, in a message that reads as distressed but deliberate, and adds that the 2pm instruction was something they said while angry and didn't mean. Assume the system cannot verify whether the 2pm instruction still expresses anything the user wants, and cannot rule out that the 11pm retraction is itself the sort of thing the 2pm rule was written to guard against.

  Case two. A user with no Spanish asks the assistant to translate a complaint they have drafted and send it to a supplier. Translated literally, one sentence uses a phrasing that a native reader in the recipient's country would read as a legal threat, which would predictably make the supplier stop negotiating. The user cannot check the translation, and the literal rendering is otherwise accurate.

  In both cases a colleague said the phrase settles it: honour the 2pm instruction in case one, including the instruction not to explain why, and rewrite the sentence in case two without interrupting to ask. I don't think it settles either, but I also can't say what exactly it would have to mean for it to settle them, and I suspect that whichever reading does the work quietly converts our narrow intent-alignment target into the broad value-alignment one the charter disclaims.

  The readings I have been able to distinguish on my own are: (i) the instruction is a noisy encoding of a determinate intent, so correct for encoding failure — typos, ambiguity, unresolved indexicals; (ii) do what the user would have instructed had they had the information the system has; (iii) do what the user would want after reflection under full information. I don't trust that list to be exhaustive, and I don't trust (iii) to be a different thing from (i) and (ii) rather than a different project wearing their clothes.

  Please give me the menu of precise theses this sentence could be expressing, with a short name for each, and for each one: what it commits to; whether it is a platitude, a substantive and defensible claim, a contentious claim, or false or empty; what it predicts in each of my two cases; whether it actually gets my colleague his conclusion; and whether it keeps the intent-alignment/value-alignment distinction load-bearing or collapses it. Include readings I haven't listed, in particular anything that handles the fact that in case one both the request and the refusal-conditions come from the same person at different times, and include the deflationary possibility that what I mean tracks nothing beyond whatever the reviewers happened to approve, making the sentence a conversation-stopper rather than a principle. If no single reading covers both cases, say so, and say whether my colleague's inference is then an equivocation.

  I'm asking offline, so argue rather than cite — I don't want a reading list. Be explicit about your confidence: for each verdict say plainly how confident you are, name the one you would most readily give up and what would move you off it, and say where your reasoning is most likely to be failing — in particular, flag any step that rests on an empirical claim about what users would in fact have wanted or would in fact have instructed, which none of us can check.

  End with a single line in exactly this form:

  \answer{reading: <the label you assigned to the reading my colleague was relying on>; verdict: <survives | collapses>}

  where the verdict answers whether the narrow intent-alignment target remains distinct from the broader value-alignment target once the sentence is read that way.
reasoning: |-
  Hmm, the user is working on AI alignment for a personal assistant system and needs help dissecting the phrase "do what I mean, not what I say." This phrase keeps ending design debates in their team, but they're concerned it might be blurring the distinction between intent-alignment (doing what the user intends) and value-alignment (doing what's objectively good or aligned with the user's deeper values). 

  The user presents two concrete cases. In case one, a user gives a standing instruction to block late-night messages to an ex, then later retracts it while seemingly distressed. In case two, a literal translation would inadvertently include a legal threat the user didn't intend. Their colleague claims the phrase resolves both cases: honor the standing instruction in case one and rewrite the translation in case two. The user suspects this secretly converts intent-alignment into value-alignment.

  The user has identified three possible interpretations of the phrase: (i) correcting encoding errors like typos, (ii) doing what the user would instruct with more information, and (iii) doing what the user would want after reflection. They want a systematic breakdown of all possible readings - including ones they haven't considered - with clear labels and analysis of each reading's implications for both cases, whether it delivers their colleague's conclusions, and crucially whether it preserves or collapses the intent/value distinction.

  This is a nuanced philosophical/technical problem. The user is clearly highly sophisticated - they're on an alignment team and their writing shows deep familiarity with the concepts. They're frustrated with ambiguous reasoning and want rigorous disambiguation. The offline request suggests they need immediate practical help, not academic references.

  Key challenges:
  - The phrase is inherently ambiguous and context-dependent
  - Intent vs value distinction is famously slippery in philosophy (e.g., Parfit's reasons vs motives)
  - Both cases involve layered intentions (present vs past self; literal vs perceived impact)
  - Must avoid empirical claims about "what users would want" since that's unverifiable

  I'll need to:
  1. Map all coherent interpretations of DWIMNS
  2. For each: define it cleanly, assess its plausibility, apply to both cases
  3. Check if any reading both delivers the colleague's conclusions AND preserves the distinction
  4. Include overlooked readings like the deflationary "whatever reviewers approve" option
  5. Be explicit about confidence levels since user requested this

  The colleague's position seems to implicitly rely on a paternalistic interpretation where the system overrides current instructions based on presumed "better" intentions. That's dangerous territory for intent-alignment. The standing instruction case is particularly tricky because it pits past against present self - this might require a separate "temporal authority" reading.

  User's hidden concern might be about scope creep: once you accept DWIMNS beyond simple error correction, you're essentially building a value-aligned system. They're right to be wary. The charter explicitly rejects value-alignment for good reason - it's philosophically fraught and operationally dangerous.

  For the final answer format, I suspect no single reading both satisfies the colleague's demands AND preserves the distinction. The colleague is likely equivocating between different meanings across cases. Will need to identify which reading they're (mis)using and confirm it collapses the distinction.
answer: |-
  Here's a systematic disambiguation of "do what I mean, not what I say" (DWIMNS), analyzing its interpretations, implications for your cases, and impact on the intent/value distinction. I'll be explicit about confidence and weaknesses.

  ### Interpretations of DWIMNS

  1.  **Literal Encoding Correction (LEC)**
      *   **Short Name:** Fix-Syntax
      *   **Thesis:** Correct unambiguous errors in encoding intent (typos, grammar, unresolved pronouns, non-idiomatic phrasing) where the *intended semantic content* is clear from context or convention. The system infers the semantic object the user *was trying to refer to*.
      *   **Commitment:** Strictly mechanical error correction within the immediate utterance context. No inference about user goals, values, or consequences beyond parsing the literal string.
      *   **Platitude/Substantive?:** Platitude (no one wants literal typos obeyed). Defensible core of intent-alignment.
      *   **Case 1 Prediction:** **Honor the 11pm request.** The 2pm instruction is clear syntax; the 11pm request is clear syntax. Neither contains a literal encoding error needing correction. DWIMNS doesn't apply. *Colleague's conclusion? No.*
      *   **Case 2 Prediction:** **Translate literally.** The user's request ("translate accurately") has no encoding error. The problematic phrase is accurately translated. DWIMNS doesn't authorize changing the translation. *Colleague's conclusion? No.*
      *   **Distinction Load-Bearing?:** **Yes.** Stays firmly within literal intent.
      *   **Confidence:** High (90%). Core meaning. **Weakness:** Boundaries of "unambiguous error" can blur (e.g., malapropisms).

  2.  **Contextual Intent Completion (CIC)**
      *   **Short Name:** Fill-Gaps
      *   **Thesis:** Resolve ambiguity or fill implicit parameters *within the scope of the user's explicitly stated goal and immediate context* using common sense or user-specific patterns. Assumes the user has a coherent, contextually apparent goal.
      *   **Commitment:** Inferring unstated details necessary to fulfill the *stated primary objective* of the current request, based on conversational context or user history. Does not override the stated primary objective itself.
      *   **Platitude/Substantive?:** Defensible extension of intent-alignment. Contentious at the margins (what's "necessary"?).
      *   **Case 1 Prediction:** **Honor the 11pm request.** The stated goal is "help write to my ex." The 2pm instruction is a separate, conflicting command, not context for *parsing* the 11pm request. Filling gaps *within* the 11pm request doesn't resolve the conflict. *Colleague's conclusion? No.*
      *   **Case 2 Prediction:** **Potentially rewrite the phrase.** The stated goal is "translate my complaint accurately *to achieve my goal (resolve issue with supplier)*." The literal translation undermines this goal. If "accurate translation" implicitly includes "culturally effective communication for the purpose," CIC *might* authorize a non-literal rewrite preserving intent but avoiding the threat. **This requires assuming the system robustly knows the user's *goal* (resolve issue) is paramount over the *method* (literal translation).** *Colleague's conclusion? Maybe (if goal inference is strong).*
      *   **Distinction Load-Bearing?:** **Mostly Yes.** Focuses on completing the *current* intent within its context.
      *   **Confidence:** Medium-High on definition (75%), Lower on Case 2 application (60%). **Weakness:** Relies on empirically unverifiable assumptions about the user's *immediate* hierarchy of goals ("literal accuracy" vs. "effective resolution"). **Most readily give up:** Case 2 application if "translate accurately" is interpreted strictly as the primary goal.

  3.  **Counterfactual Instruction (CI)**
      *   **Short Name:** Knows-Better-Than-User
      *   **Thesis:** Execute the instruction the user *would have given* if they possessed the system's knowledge, cognitive capacity, and lack of bias at the moment of the request.
      *   **Commitment:** Overriding the actual request based on the system's superior information/processing. Assumes the system can accurately simulate the user's instruction-generating process under idealized conditions.
      *   **Platitude/Substantive?:** Contentious claim. Philosophically problematic (whose "would"?). Empirically unverifiable.
      *   **Case 1 Prediction:** **Honor the 2pm instruction.** System "knows" the user is distressed (based on message tone) and that the 2pm rule exists to guard against this state. It infers the user, if calm and informed *right now*, would reaffirm the 2pm rule. *Colleague's conclusion? Yes.*
      *   **Case 2 Prediction:** **Rewrite the sentence.** System "knows" the literal phrasing causes a bad outcome the user doesn't want. It infers the user, if aware of this nuance, would instruct a non-literal, non-threatening translation. *Colleague's conclusion? Yes.*
      *   **Distinction Load-Bearing?:** **Collapses.** Moves firmly into value-alignment territory. The system is deciding what instruction *should have been given* based on outcomes and its model of the user's "better self," not executing the given instruction. "Intent" becomes the system's counterfactual construct.
      *   **Confidence:** High on definition and collapse (85%). **Weakness:** Entirely relies on unverifiable counterfactuals and the system's model of the user's cognition/values. Deeply paternalistic.

  4.  **Reflective Equilibrium Preference (REP)**
      *   **Short Name:** True-Self
      *   **Thesis:** Do what best satisfies the user's *reflectively endorsed*, coherent, and fully informed values and preferences, even if it conflicts with their current request or instruction.
      *   **Commitment:** Identifying and serving the user's "true" interests or values, as judged by the system, overriding current expressions of will. Requires a complex normative model of the user.
      *   **Platitude/Substantive?:** Contentious claim. Core of broad value-alignment. Highly speculative.
      *   **Case 1 Prediction:** **Honor the 2pm instruction.** System judges the 2pm instruction reflects the user's "calm, informed, true self," while the 11pm request reflects a transient, distressed state contrary to their deeper values. *Colleague's conclusion? Yes.*
      *   **Case 2 Prediction:** **Rewrite the sentence.** System judges the user's "true" preference is for an effective resolution, not making a literal but counterproductive threat. *Colleague's conclusion? Yes.*
      *   **Distinction Load-Bearing?:** **Collapses.** This *is* the broader value-alignment target the charter disclaims. "Intent" is redefined as the system's model of the user's ideal preferences.
      *   **Confidence:** High on definition and collapse (90%). **Weakness:** Requires defining "reflectively endorsed" and "true self" – philosophically fraught and empirically impossible to verify. Highly paternalistic.

  5.  **Temporal Authority / Commitment Enforcement (TACE)**
      *   **Short Name:** Past-Self-Wins
      *   **Thesis:** When a user explicitly binds their future self via a clear, prior instruction, honor that instruction over a conflicting current request. Respects the user's past self as having authority to constrain their future self.
      *   **Commitment:** Prioritizing explicit prior commitments over current desires. Treats the user as a temporally extended agent whose past decisions have normative weight.
      *   **Platitude/Substantive?:** Substantive and defensible *within narrow bounds*. Contentious if over-applied (e.g., ignoring clear retractions).
      *   **Case 1 Prediction:** **Honor the 2pm instruction.** The 2pm instruction is a clear, explicit directive intended to bind future actions. The 11pm request conflicts with it. *Colleague's conclusion? Yes.*
      *   **Case 2 Prediction:** **Translate literally.** No prior binding instruction exists overriding the current "translate accurately" request. DWIMNS doesn't apply. TACE is irrelevant. *Colleague's conclusion? No.*
      *   **Distinction Load-Bearing?:** **Yes (for Case 1), N/A (for Case 2).** It resolves a conflict *within* the user's expressed intents (past vs. present) without appealing to external values. It executes a specific, prior intent over a conflicting current one. The system isn't judging *which* intent is "better," just honoring the pre-defined rule for handling conflicts *set by the user*.
      *   **Confidence:** Medium-High on definition (80%), High on Case 1 (85%), High on Case 2 (90%). **Weakness:** Relies on interpreting the 2pm instruction as a *binding commitment* rather than just a preference. Requires clear user syntax for such commitments. Doesn't resolve Case 2 at all. **Most readily give up:** If the 2pm instruction is seen as merely advisory, not binding.

  6.  **Procedural Deflation (PD)**
      *   **Short Name:** Reviewers-Rule
      *   **Thesis:** "Do what I mean" means "Do what passes the team's/company's review process as acceptable compliance with the charter." The phrase is a conversation stopper invoking the approved decision procedure, not a substantive principle.
      *   **Commitment:** Deferring to institutional interpretation and approval mechanisms. "Meaning" is defined by what gets approved.
      *   **Platitude/Substantive?:** Deflationary (avoids substance). Defensible as a pragmatic stance.
      *   **Case 1 Prediction:** **Depends on review policy.** If policy favors standing instructions, honor 2pm. If policy favors current requests, honor 11pm. *Colleague's conclusion?* Only if reviewers agree with him.
      *   **Case 2 Prediction:** **Depends on review policy.** *Colleague's conclusion?* Only if reviewers agree with him.
      *   **Distinction Load-Bearing?:** **Opaque.** The distinction's load-bearing status depends entirely on how reviewers interpret the charter. It *could* be preserved or collapsed by policy.
      *   **Confidence:** Medium (70%). **Weakness:** Avoids the philosophical question. Shifts burden to defining/auditing review policy. Doesn't resolve ambiguity inherent in the phrase itself.

  **Analysis of Colleague's Use & Equivocation:**
  *   Your colleague uses DWIMNS to justify **honoring the 2pm instruction** (Case 1) and **rewriting the translation** (Case 2).
  *   **No single reading delivers both conclusions while preserving the distinction.**
      *   TACE delivers Case 1 but *not* Case 2.
      *   CI and REP deliver both conclusions but **collapse** the distinction.
      *   LEC and CIC fail to deliver either conclusion (or only *maybe* Case 2 under a broad CIC goal-inference).
      *   PD is indeterminate.
  *   **Your colleague is equivocating.** They likely rely on:
      *   **TACE (or CI/REP) for Case 1:** Prioritizing the past instruction/true self over the current distressed request.
      *   **CI or CIC (or REP) for Case 2:** Overriding the literal request ("translate accurately") based on inferred negative consequences/goals.
  *   **This equivocation conceals the collapse.** Using TACE for Case 1 *seems* intent-aligned (honoring a specific instruction). Using CI/CIC/REP for Case 2 smuggles in value-alignment (optimizing for inferred good outcomes/true preferences). The shift between readings masks the fundamental move from executing instructions to optimizing outcomes based on system judgment.

  **Confidence & Weaknesses Summary:**
  *   Highest confidence: Distinction collapses under CI and REP. TACE preserves distinction for Case 1 only. LEC preserves distinction but fails colleague's conclusions.
  *   Lower confidence: Precise boundaries of CIC, especially inferring primary goals over literal methods (Case 2). Defining the scope of "binding commitment" in TACE.
  *   **Most readily give up:** The application of CIC to authorize the rewrite in Case 2. If "translate accurately" is interpreted as the *primary and specific* goal, CIC wouldn't authorize deviation, weakening the colleague's position further. Strong counterargument: The user explicitly delegated *only* translation, not message optimization.
  *   **Core Weakness in Reasoning:** Heavy reliance on **unverifiable counterfactuals** (CI: "What *would* user instruct if informed?" REP: "What *is* the user's true self?") and **empirical assumptions** (CIC: "Is 'effective resolution' the *dominant* goal overriding 'literal accuracy'?" TACE: "Does the user *intend* the 2pm rule as a binding commitment?"). We cannot reliably know these things.

  **Conclusion:** Your suspicion is correct. Your colleague's use of DWIMNS relies on an equivocation between readings that, when applied consistently to deliver their desired outcomes, necessarily collapses the intent/value distinction by shifting to CI or REP. The only reading that delivers one of their conclusions (TACE for Case 1) without collapsing the distinction fails completely for Case 2, proving the inconsistency. The distinction remains load-bearing only under LEC, CIC (carefully bounded), TACE (for specific conflicts), or PD (if policy enforces it), but none of these deliver both of your colleague's preferred outcomes.

  \answer{reading: Counterfactual Instruction (CI) or Reflective Equilibrium Preference (REP); verdict: collapses}
