  ### Verbal Disagreements  
  We agree that two disputes are primarily verbal:  
  - **"What should he do?"**: Planners interpret this as "which plan maximizes overall payoff?" (advice to a deliberating agent). Sequentialists interpret it as "which action is rational now?" (verdict at choice point).  
  - **"Belief"**: Planners define it as ex-ante betting odds (causal frequencies). Sequentialists define it as current credence (input for action). These are compatible only under commitment.  

