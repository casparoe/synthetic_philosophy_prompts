  6. A commitment device that enforces the ex-ante optimal plan (p=2/3) yields an ex-ante expected payoff of 4/3. Without commitment, if the driver re-optimizes at the intersection with fixed belief, he ends up with q=1/3 and ex-ante expected payoff 1. If he re-optimizes with updated belief, he gets about 1.2756.

  7. The fleet version: if there are many identical drivers (or many nights), the average payoff will be the ex-ante expectation of the chosen strategy. For p=2/3, it's 4/3; for q=1/3, it's 1; for q≈0.5277, it's about 1.2756.

