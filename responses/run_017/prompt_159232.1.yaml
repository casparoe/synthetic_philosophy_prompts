  ### Joint Statement on the Absent-Minded Driver Problem

  We, the undersigned Planners and Sequentialists, agree on the following arithmetic, decision-theoretic properties, and empirical predictions of the absent-minded driver (AMD) problem. We also acknowledge key unresolved disagreements, which we frame as testable cruxes. This statement aims to isolate substantive disputes from verbal ones, using concrete cases to force progress.

  ---

  ### Agreed Claims (Signed by Both Parties)

  1. **Ex-ante expected payoff**: For a fixed strategy with continuation probability \(p\), the ex-ante expected payoff is \(4p - 3p^2\). This is maximized at \(p = 2/3\), yielding \(4/3 \approx 1.333\).  
  2. **Belief derivation from plan**: If the driver follows plan \(p\), the self-locating belief at an intersection (probability of being at the first intersection) is \(\frac{1}{1+p}\). For \(p = 2/3\), this is \(3/5 = 0.6\).  
  3. **Payoff at intersection under fixed belief**: Given belief \(\pi = \frac{1}{1+p}\) and assuming future actions use the same \(q\), the expected payoff from choosing \(q\) at the intersection is:  
     \[
     \pi \cdot [q \cdot (4 - 3q)] + (1 - \pi) \cdot [(1 - q) \cdot 4 + q \cdot 1].
     \]  
     For \(\pi = 0.6\) (from \(p=2/3\)), re-optimizing \(q\) with \(\pi\) fixed yields \(q = 1/3\) and an expected payoff of \(1.8\).  
  4. **Fixed-point sequential optimization**: If the driver updates belief to \(\pi = \frac{1}{1+q}\) (based on the new \(q\)) and re-optimizes, the fixed-point \(q \approx 0.528\) maximizes the intersection-expected payoff, yielding \(\approx 1.67\) at the intersection and an ex-ante payoff of \(\approx 1.276\).  
  5. **Perfect recall benchmark**: With perfect recall, the driver exits at the second intersection (payoff 4) and continues at the first (to reach the second). Ex-ante payoff is 4, dominating all imperfect-recall strategies.  
  6. **Commitment device effect**: A commitment device enforcing \(p = 2/3\) yields the ex-ante optimum of \(4/3\). Without commitment, re-optimization (under any belief model) reduces ex-ante payoff below \(4/3\).  
  7. **Fleet version consistency**: For a fleet of 1,000 identical amnesiac drivers (or one driver over 1,000 nights), the average realized payoff converges to the ex-ante expectation of the chosen strategy:  
     - \(p = 2/3\): Average \(\to 4/3\).  
     - \(q = 1/3\): Average \(\to 1\).  
     - \(q \approx 0.528\): Average \(\to \approx 1.276\).  
  8. **Co-driver effect**: If a co-driver with perfect recall and no stake takes the wheel, both sides agree the driver should hand over control, as this achieves payoff 4. This shows that imperfect recall is a constraint, not a norm.  
  9. **Three-intersection generalization**:  
     - Payoffs: Exit at first: 0, second: 4, third: \(x\) (e.g., \(x = 16\)), straight through: 1.  
     - Ex-ante optimum: Computable via \(p\) optimization.  
     - Sequentialist fixed point: May not exist or be unique for some \(x\) (e.g., if \(x\) is small, re-optimization may not converge).  
     - Planner solution: Always defined as ex-ante optimum.  

