  - 40-50 min: Each pair reports their final probabilities and recommended action. We collect on the board.

  - 50-60 min: We reveal that the two halves had different orders and show the difference in results. We also reveal the true state (for the sake of the decision scoring and the Brier score) — but we haven't defined the true state. We can say that the true state is drawn from the prior? But then we need to pick one. Alternatively, we can skip the scoring and focus on the decision and the probabilities.

    But we can say: "For the purpose of scoring, the true state is H2." (or whatever) and then compute the Brier score and the decision loss.

    But the decision loss depends on the true state. If true state is H2, then for Group1 who chose A2 (treat H2), the loss is 1500. For Group2 who chose A1 (treat H1), the loss is 6000.

    That will show a big difference.

  - 60-85 min: Debrief (as outlined below).

  - 85-90 min: Wrap-up and naming the update rule.

  ### 5. Debrief

  - Start by noting that in the first round (certain evidence), both groups agreed, because conditionalization on the intersection is commutative.

  - In the second round, they diverged. Why? Because when evidence is a shift of confidence, the update rule (Jeffrey update) holds fixed the conditionals of the hypothesis given the evidence partition. But when you update on E first, you change the distribution, so the conditionals of H given F are no longer the same as in the prior. Then when you update F, you are holding fixed a different conditional distribution than if you had done F first.

  - Point out: in Group1 (E then F), the second update (on F) holds fixed the conditionals of H given F from after the E update. In Group2, the first update (on F) holds fixed the conditionals from the prior, and then the second update (on E) holds fixed the conditionals of H given E from after the F update.

  - Why is this a problem? Because the conditionals are not the same in the two orders.

  - The wrinkle: the reliability of Instrument B depends on H. This means that the conditional distribution P(H|F) is not arbitrary but reflects the instrument's reliability. When we hold it fixed, we are assuming that the reliability hasn't changed, but after the first update, the distribution of H has changed, so the meaning of F might change? Actually, the reliability P(F|H) is unchanged, but the conditionals P(H|F) do change because they depend on the prior of H.

  - Objection from a strong student: "Why are we updating by shifting the marginal on F? Shouldn't we use the likelihood of the new reading on F?"

    - In the debrief, have the students redo the update using the likelihood. For example, if we get a reading that shifts our confidence on F to (0.6,0.4), that's equivalent to getting a likelihood ratio of (0.6/0.4) / (0.41/0.59) for F1 vs F2? Actually, it's not a likelihood ratio because it's a posterior. 

    - But if we were to use the likelihood ratio, we would have to model the evidence as a specific observation that has a known likelihood given F. But in this case, the evidence is given as a posterior on F. 

    - However, the student might suggest that the update should be done by using the likelihood ratio for the new evidence that caused the shift.

    - So, in the activity, we can say: "Suppose instead that the evidence was a direct observation that had a known likelihood on the evidence partition. Then we would update by multiplying the likelihood."

    - Let's redo the update that way for both orders and see if it commutes.

    - For example, suppose we get an observation that has P(obs|E1)=0.7 and P(obs|E2)=0.3. Then the likelihood ratio for E1 to E2 is 0.7:0.3 = 7:3. Then update the prior on E by multiplying the likelihood and renormalizing. Similarly for F.

    - Then updating on E and then on F would be the same as F then E, because both lead to the same posterior: 
          P(H) * P(obsE|E) * P(obsF|F) 
       and by conditional independence given H, this factors through H.

    - So the result is the same as conditionalization on the product partition.

    - This shows that the non-commutativity arises because the Jeffrey update is not equivalent to conditioning on an observation with a known likelihood; it is a constraint on the marginal distribution of the evidence partition.

  - Facilitator framing: The Jeffrey update is appropriate when the evidence directly changes your degrees of belief on a partition, without your learning which cell you are in. This might happen with unreliable instruments or with vague perceptions. But if the evidence comes as a known likelihood, then conditionalization is the right update and it commutes.

  - Name the update rule at the end: Jeffrey conditionalization.

  ### 6. What will go wrong

  - Mistakes in arithmetic: Students might make calculation errors. Provide a worksheet with clear steps and a structured table.

  - Objections: "Why are we holding the conditionals fixed? They might change!" — This is part of the debrief. Also, students might try to use the likelihood ratio update instead. If they do, let them finish and then note that in the debrief.

  - Pair finishing early: Have a bonus question: "What if you had done the updates in the reverse order? Compute that too and see if it's the same." But then they might see the difference early. Alternatively, have them compute the expected loss and then also compute for the other actions to be sure.

  - Contamination: Keep the two groups separate and don't let them communicate.

  - Handling: Walk around and help with calculations. Have answer keys for the first round to check. For the second round, if a pair finishes early, ask them to explain their steps to you.

  ### 7. What the activity cannot reproduce

  - It shows the order-dependence of Jeffrey updates, but it does not establish that holding the within-cell mix fixed is the right constraint. That is a modeling assumption.

  - It does not address why one should update at all rather than just aiming to score well. The justification for updating rules comes from dynamic coherence arguments, which are beyond the scope of the activity.

  - It also does not show that the Jeffrey update is the only way to update in this situation. Other update rules might be proposed.

  - The activity uses the assumption that the evidence partitions are conditionally independent given H. In general, without that, the Jeffrey update might not be defined because we wouldn't have the joint to compute the intermediate conditionals.

  We must supply these points in the lecture.

  Now, provide the materials.
answer: |-
  Below is a complete runnable activity designed for your 90-minute seminar. It focuses on the difference between updating on certain evidence (conditionalization) and uncertain evidence (Jeffrey update), with a clear divergence in outcomes when order changes. The activity uses a medical diagnostics cover story to keep priors and evidence self-contained. All calculations use integer counts for simplicity.

  ---

  ### **1. Setup and Rules**  
  **Cover Story**:  
  Students are part of a remote medical team diagnosing a patient on a space station. The patient has one of three conditions:  
  - **H1**: Disease A (requires Treatment A)  
  - **H2**: Disease B (requires Treatment B)  
  - **H3**: Healthy (no treatment needed)  

  Two diagnostic instruments provide readings:  
  - **Instrument 1** reports readings in partition **E** = {E1, E2}  
  - **Instrument 2** reports readings in partition **F** = {F1, F2}  

  **Task for Students**:  
  - Split the room into **Group 1** and **Group 2** (8 pairs each).  
  - Both groups receive:  
    - Identical priors over H1, H2, H3 (given as counts).  
    - Identical evidence reports (shifts of confidence on E and F partitions).  
  - **Only difference**: Order of processing evidence:  
    - **Group 1**: Update on Instrument 1 (E) first, then Instrument 2 (F).  
    - **Group 2**: Update on Instrument 2 (F) first, then Instrument 1 (E).  
  - Groups work in pairs (15–20 minutes).  
  - **Deliverables**:  
    - Final probabilities for H1, H2, H3 (rounded to 2 decimals).  
    - Recommended action: *Treat A*, *Treat B*, or *No treatment*, based on expected loss (details in Payoff Scheme).  

  **Key Rules for Updating (Handout Wording)**:  
  - **When updating on a partition (e.g., E)**:  
    - Hold the *within-cell hypothesis mix* fixed (i.e., the conditional probabilities P(H|E) or P(H|F) from the **current distribution**).  
    - Only change the total probability (i.e., marginal) of the partition cells to the new values.  
  - **Order is fixed by group**: Do not reverse it.  

  ---

  ### **2. Materials**  
  **Priors and Conditionals (Total Counts: 1000)**:  
  | Hypothesis | Prior Count | P(E1\|H) | P(E2\|H) | P(F1\|H) | P(F2\|H) |  
  |------------|-------------|----------|----------|----------|----------|  
  | **H1**     | 200         | 75%      | 25%      | 90%      | 10%      |  
  | **H2**     | 300         | 60%      | 40%      | 60%      | 40%      |  
  | **H3**     | 500         | 14%      | 86%      | 10%      | 90%      |  

  - **Wrinkle**: Instrument 2’s reliability (P(F|H)) depends on the hypothesis (bolded above). For H1/H3, it’s highly reliable; for H2, it’s weak. Flag for debrief: *Holding P(H|F) fixed assumes reliability hasn’t changed, but after the first update, the hypothesis distribution shifts, making this suspect.*  

  **Evidence Reports (Handout Wording)**:  
  - **Report 1 (From Instrument 1)**:  
    *"After calibration, your confidence that the reading is E1 should be 70%, and E2 should be 30%."*  
    (Shift E to: P(E1) = 0.7, P(E2) = 0.3)  

  - **Report 2 (From Instrument 2)**:  
    *"After calibration, your confidence that the reading is F1 should be 60%, and F2 should be 40%."*  
    (Shift F to: P(F1) = 0.6, P(F2) = 0.4)  

  **Answer Key**:  
  - **First Round (Certain Evidence)**:  
    - Both groups update on **E1 then F1** with certainty.  
    - Result: P(H1) = 0.54, P(H2) = 0.43, P(H3) = 0.03 (agreement).  
  - **Second Round (Uncertain Evidence)**:  
    | Group | Order | P(H1) | P(H2) | P(H3) |  
    |-------|-------|-------|-------|-------|  
    | **1** | E→F   | 0.32  | 0.39  | 0.29  |  
    | **2** | F→E   | 0.35  | 0.39  | 0.26  |  
    - **Divergence**: H1 differs by 3%, H3 by 3% (large enough to flip decisions).  
  - **Calculation Worksheets**: Provided below.  

  ---

  ### **3. Payoff Scheme**  
  **Scoring Rules**:  
  - **Probability Forecasts**: Use the **Brier Score** (strictly proper).  
    - For reported probabilities (p₁, p₂, p₃) and true state *i*:  
      *Brier Score = (1 - pᵢ)² + pⱼ² + pₖ²* (for j, k ≠ i).  
    - Truth drawn from a key (use **H2** in the key for consistency).  
  - **Decision**: Expected loss minimization.  
    - **Loss Matrix**:  
      | Action \ State | H1     | H2     | H3     |  
      |----------------|--------|--------|--------|  
      | **Treat A**    | $1000  | $6000  | $1000  |  
      | **Treat B**    | $6000  | $1500  | $1500  |  
      | **No treatment** | $5000  | $5000  | $0     |  
    - Students compute expected loss for each action using their final probabilities.  
    - **Threshold**: They recommend the action with the lowest expected loss.  

  **Can Scoring Discriminate?**  
  - **Single round**: No. Brier scores depend on the true state (H2), so both orders yield similar scores (e.g., ~0.63 for both).  
  - **Repeated rounds**: Yes, but inefficient.  
    - Expected Brier score under true P(H) differs by ~0.001 per round.  
    - **Requires 50+ rounds** to detect order effects (not feasible in class).  
  - **Recommendation**: Skip scoring forecasts; use **decision divergence** (e.g., Group 1: Treat B, Group 2: Treat A) to show impact.  

  ---

  ### **4. Minute-by-Minute Timeline**  
  **Total: 90 minutes**  
  - **0–5 min**: Introduce the scenario, hypotheses, and instruments. Split into Group 1/2.  
  - **5–15 min**: **First Round (Certain Evidence)**:  
    - Both groups update on **E1 (certain) → F1 (certain)**.  
    - Use conditionalization: P(H|E1,F1) = P(H|E1) × P(F1|H) / normalizer.  
    - **Result**: All pairs report P(H1)=0.54, P(H2)=0.43, P(H3)=0.03 (write on board).  
  - **15–35 min**: **Second Round (Uncertain Evidence)**:  
    - Distribute evidence reports and worksheets.  
    - Group 1: Update E (shift to 70/30) → F (shift to 60/40).  
    - Group 2: Update F (shift to 60/40) → E (shift to 70/30).  
  - **35–45 min**: Compute decisions (expected loss for actions).  
  - **45–50 min**: **Report Results**:  
    - Pairs submit final probabilities and actions.  
    - Record on board (two columns for Group 1/2).  
  - **50–55 min**: **Reveal Order Difference**:  
    - Show divergence in probabilities (e.g., Group 1 avg. vs. Group 2 avg.).  
    - Highlight decision split (e.g., Group 1: Treat B, Group 2: Treat A).  
  - **55–85 min**: **Debrief** (detailed below).  
  - **85–90 min**: Name the rule (Jeffrey Conditionalization) and dismiss.  

  ---

  ### **5. Debrief**  
  **Map Moments to Formal Points**:  
  - **Agreement in First Round (5 min)**:  
    - "When evidence is certain, conditionalization on E and F commutes because both yield P(H|E ∩ F). Order doesn’t matter."  
  - **Divergence in Second Round (10 min)**:  
    - "With uncertain evidence, Jeffrey updates fix P(H|E) or P(H|F) from the **current distribution**. But after the first update, the distribution is distorted. For example:  
      - Group 1 (E→F): After updating E, P(H) changes → P(H|F) shifts → F-update uses this *new* P(H|F).  
      - Group 2 (F→E): After updating F, P(H) changes → P(H|E) shifts → E-update uses this *new* P(H|E)."  
    - Show calculations for P(H|F) after E-update (Group 1) vs. before (Group 2).  
  - **Wrinkle: Hypothesis-Dependent Reliability (5 min)**:  
    - "Instrument 2’s reliability (P(F|H)) varies by H. Holding P(H|F) fixed assumes this reliability is unchanged, but after the first update, P(H) shifts → P(H|F) becomes unreliable. For example, if H2 is less likely, P(F1|H2) becomes less informative."  
  - **Objection: "Shouldn’t Evidence Be a Likelihood?" (10 min)**:  
    - **Stage the objection**: "A student says: ‘Readings should update via likelihood ratios, not posterior shifts!’ Let’s test this."  
    - **Redo with likelihoods**:  
      - Reprocess reports as likelihoods: P(Report|E1) = 0.7, P(Report|E2) = 0.3 (same for F).  
      - Update via Bayes: Multiply priors by likelihoods and renormalize.  
      - **Result**: Both orders commute (yield identical posteriors).  
    - **Facilitator framing**:  
      - "Likelihood updates commute because they condition on evidence. Jeffrey updates don’t because they *constrain* the marginal. Use likelihoods when evidence is an ‘observation’; use Jeffrey when it’s a ‘direct confidence shift’."  
  - **Name the Rule (Last 15 min)**:  
    - "This is **Jeffrey Conditionalization**. It generalizes Bayes for uncertain evidence but loses commutativity."  

  ---

  ### **6. Predictable Problems & Solutions**  
  - **Arithmetic Errors**:  
    - **Cause**: Fractions in updates (e.g., scaling counts).  
    - **Fix**: Provide worksheets with step-by-step tables. Pre-calculate first-round for reference.  
  - **Objections Derailing Work**:  
    - "Why hold P(H|E) fixed?": Gently defer to debrief ("We’ll discuss why this is the rule").  
    - "Shouldn’t we use likelihoods?": Note this is intentional for the activity; revisit in debrief.  
  - **Pair Finishes Early and Spoils Reveal**:  
    - **Cause**: Fast pairs compute the "other" order.  
    - **Fix**: Assign a bonus task: "Compute expected loss for all actions to validate your recommendation."  
  - **Misunderstanding Partitions**:  
    - **Cause**: Confusing E/F with H.  
    - **Fix**: Use analogies (e.g., "E is like a blurry photo; F like a noisy sensor").  

  ---

  ### **7. Limitations Note**  
  The activity **cannot reproduce** and you must explain:  
  - **Why hold within-cell mix fixed?** Jeffrey update assumes this preserves "conditional beliefs," but it’s a postulate—not derived from coherence (like Bayes).  
  - **Why update at all?** The activity shows *how* Jeffrey updates work, not *why* we should use them. Tie to Dutch-book arguments in pre-reading.  
  - **Generality of order-dependence**: The effect is amplified here by hypothesis-dependent reliability; in symmetric cases, it may vanish.  

