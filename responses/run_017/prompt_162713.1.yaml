  So the recommended actions differ: Group1 says treat H2, Group2 says treat H1.

  That's a clear difference.

  So the activity will show that the update order affects the decision.

  ### 4. Timeline for 90 minutes

  - 0-5 min: Introduction to the scenario and the task. Split into groups and pairs. Hand out the materials.

  - 5-10 min: First round: both readings arrive with certainty. 
     - For this round, both groups get the same order (say, E then F) and are told that the instruments gave a definite reading. For example, for E, they are told: "Instrument A reading is definitely E1." And for F: "Instrument B reading is definitely F1."
