  But for the activity, we can skip the scoring of the probabilities and focus on the decision. The decision might differ between the two groups if the probabilities are sufficiently different.

  In our example, for Group1: H1=0.32, H2=0.39, H3=0.29
  For Group2: H1=0.35, H2=0.39, H3=0.26

