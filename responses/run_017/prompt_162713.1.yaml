     H2:108/250=0.432
     H3:7/250=0.028

     But they can also do it in two steps. First, update on E1: 
     New probabilities: 
     P(H1|E1)=150/400=0.375
     P(H2|E1)=180/400=0.45
     P(H3|E1)=70/400=0.175

