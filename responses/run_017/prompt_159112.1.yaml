prompt: |-
  I am a graduate student in a seminar on practical rationality, and I also sit as the student member of my university's dissertation fellowship committee. Each spring we read roughly forty shortlisted files and award eight fellowships. Applicants are scored on five dimensions, each on a one-to-five scale, and the sums produce exact ties several times per cycle — sometimes a clean pair, sometimes a five-way clump at the cutoff where no one believes the one-point gaps mean anything. Our meetings allow about ten minutes for a borderline case, the other members are faculty with no training in decision theory, and every decision goes into a minute that the dean reads and that an unsuccessful applicant could in principle appeal against. The chair has to sign off on anything we adopt.

  I would like you to turn what the Buridan's ass problem, and the surrounding discussion of choice under genuine indifference, actually establishes into a written tie-break protocol my committee could vote to adopt at the start of a cycle. I have the philosophical reading; I do not need a summary of it or pointers to it. I need the operationalized version, and I need it to survive contact with people who have never heard the term "incommensurability."

  Concretely, please give me:

  1. An ordered sequence of tests, the first of which asks whether the case before us is a tie at all. I want the genuine symmetry case distinguished from its impostors: a rubric too coarse to resolve a real difference, evidence we simply do not have, and the inarticulate but possibly expert judgment of a member who says only that one file feels stronger. For each, say what counts as a sufficient answer and when we stop investigating.
  2. A rule about when the protocol itself must be fixed. I suspect it matters that we adopt our tie-break method before we know which files will tie, because a member who prefers a candidate can always announce indifference and then break the tie his own way. Say what the protocol does about that.
  3. Where the protocol terminates in a decision, where it escalates to a named person, and where it stops because the question is one of values rather than facts.
  4. A clause forbidding invented reasons: we must not write down a discriminator we do not actually believe in order to make a tie look resolved. Tell me how a member is supposed to distinguish a fabricated discriminator from a real one, and tell me what the minute must say when the honest description is that we had no reason.
  5. Guidance on the menu of exits — randomize openly, pick arbitrarily, defer to the chair, split the award between two applicants, or reopen the search rather than choose. Which is right when, and why. Include the case of repeated ties within one cycle and across consecutive years: if an applicant loses a coin flip twice, should the second flip be independent, or should the first loss count?
  6. What to do when the two sides of the tie carry unequal downside — a wrong pick in one direction is much worse than in the other.
  7. An honest account of what is lost in translating the philosophical problem into a committee rule, and which distinctions you deliberately dropped as unusable at ten minutes per case.

  Then run the protocol on three cases from a cycle I can anticipate: two applicants with identical scores on all five dimensions and files of comparable depth; a five-way clump at the cutoff where the point differences are noise; and a tie between a candidate from my own department, about whom three members have substantial informal knowledge, and an external candidate about whom the file is everything anyone knows. At least one of the three should produce an answer my committee will not like, and I want you to say plainly why we won't like it and that we should follow it anyway. Finally, state what the protocol cannot do — the questions it is the wrong instrument for.
reasoning: |-
  We are designing a tie-break protocol for a dissertation fellowship committee. The protocol must be practical, defensible, and grounded in the philosophical insights about choice under genuine indifference (like the Buridan's ass problem) without requiring committee members to be experts in decision theory.

  Key principles:
  - We must distinguish genuine ties (where there is no reason to prefer one candidate over another) from cases that only appear to be ties due to limitations in our scoring system or information.
  - We must avoid fabricated reasons for breaking ties.
  - The protocol must be adopted before the committee sees any files to prevent strategic behavior.
  - The process must be transparent and documented in the minutes.

  Let's break down the components:

  1. **Ordered Sequence of Tests for a Tie**
     We need a step-by-step procedure to determine if we are facing a genuine tie. The tests should be ordered from the most objective to the more subjective, and we stop as soon as we find a reason to break the tie.

     **Step 1: Check for identical scores and comparable file depth?**
     - Are the total scores identical? If not, then it's not a tie. (But note: we might have a clump of scores that are very close and considered as a tie due to noise. We'll handle that in Step 2.)
     - If the total scores are identical, then check the breakdown of scores on each dimension. If they are identical in every dimension, then we have a candidate for a genuine tie. However, even if the total scores are identical but the breakdowns differ, we might have a tie if the differences in the breakdown are not meaningful.

     But we must account for:
     - **Coarse rubric**: The rubric might be too coarse to capture real differences. For example, two candidates might both get 4 in a dimension, but one is clearly stronger than the other. We need to allow for this possibility.

     **Step 2: Check for meaningful differences in the breakdown?**
     - If the total scores are identical and the breakdowns are identical, then move to Step 3.
     - If the total scores are identical but the breakdowns differ, then we must ask: are these differences meaningful? We can do this by having each member independently note if they see a meaningful difference in any dimension that would break the tie. If at least one member can articulate a reason (and it is not fabricated) that the rest of the committee accepts as valid, then we break the tie accordingly. Otherwise, we proceed to Step 3.

     **Step 3: Check for additional information beyond the file?**
     - We must consider whether any committee member has relevant, substantive, and verifiable information about a candidate that is not in the file but that the committee agrees is relevant and reliable. For example, if a member is an expert in the candidate's field and can speak to the quality of the research in a way that is not captured in the file, and if this information is accepted by the committee as breaking the tie, then we use it. But note: we must avoid bias, especially if one candidate is from a member's own department. We must set a high bar for such information (e.g., it must be verifiable and not just a feeling).

     **Step 4: Check for inarticulate expertise?**
     - If a member says they have a "feeling" that one candidate is stronger, we must challenge that member to articulate the reason. If they cannot, then we do not accept it. We must not break a tie based on unarticulated feelings because that opens the door to bias and is not defensible.

     **Stopping Rule**: We stop as soon as we find a reason to break the tie. If we go through all steps without finding a reason, then we declare a genuine tie.

  2. **Rule about when the protocol must be fixed**
     - The protocol must be adopted at the start of the cycle, before any files are reviewed. This prevents members from strategically claiming a tie to then break it in a preferred way.

  3. **Termination, Escalation, and Value Questions**
     - **Termination in a decision**: If at any step we break the tie, we make the decision and document the reason.
     - **Escalation to a named person**: We avoid escalation to a single person (like the chair) because that might introduce bias and undermine the committee. Instead, we use a random or arbitrary method (see below) that is fair and transparent.
     - **Stop for value questions**: If the issue is about values (e.g., the committee disagrees on what criteria should matter more), that is not a tie-break issue. The tie-break protocol is only for when the committee agrees on the criteria and scoring but still has a tie. Value disagreements should be resolved by the committee through discussion and, if necessary, revisiting the scoring criteria (but that should have been done at the outset).

  4. **Clause forbidding invented reasons**
     - We explicitly state that the committee must not invent reasons to break a tie. A reason is acceptable only if:
          a) It is based on the application materials or verifiable additional information (as in Step 3).
          b) It is articulated and agreed upon by the committee as a legitimate and non-arbitrary basis for distinction.
     - How to distinguish a fabricated discriminator from a real one?
          - The reason must be specific and tied to the evaluation criteria. For example, "Candidate A's research statement is more innovative" is acceptable if the committee can point to specific aspects of the statement and if innovation is a criterion. But "I just think Candidate A is better" is not.
          - If a member proposes a reason, the committee must discuss and vote on whether the reason is valid and non-fabricated. The chair should ensure that the reason is not arbitrary.
     - What to write in the minutes for a genuine tie?
          - "After following the tie-break protocol, the committee determined that the candidates were tied and there was no non-arbitrary basis to break the tie. Therefore, the tie was broken by [random method]."

  5. **Menu of exits for genuine ties**
     When we have a genuine tie, we must choose one of:
          a) Random selection (e.g., drawing lots, flipping a coin) - This is fair and transparent.
          b) Arbitrary selection (e.g., alphabetical order) - Also fair if done without bias.
          c) Defer to the chair - Not recommended because it puts too much power in one person and may appear biased.
          d) Split the award - Only if feasible (e.g., the fellowship can be split without compromising its purpose). But typically, fellowships are indivisible.
          e) Reopen the search - This is usually impractical and delays the process.

     Recommendation:
          - For a tie between two: random selection (e.g., coin flip) is recommended because it is fair and efficient.
          - For a tie among more than two: random selection (e.g., drawing names from a hat).
          - For repeated ties:
              - Within one cycle: each tie is broken independently. If the same candidate is involved in multiple ties, each tie-break is independent. This avoids any bias from previous outcomes.
              - Across consecutive years: each cycle is independent. A loss in a previous year should not affect the current year.

     Why random? Because in a genuine tie, there is no reason to prefer one candidate over the other. Random selection is the only fair method. It also avoids the appearance of bias.

     However, if the committee feels that splitting the award is feasible and desirable, that can be considered. But note: splitting might dilute the fellowship's impact.

  6. **Unequal downside**
     - If breaking the tie in one direction has much worse consequences than the other (e.g., one candidate might drop out of the program without the fellowship, while the other has other funding), then the committee should consider this as a legitimate factor. But note: this is not about the quality of the application, but about the consequences of the decision.
     - However, we must be cautious: this might lead to considering factors outside the application. We can allow it if:
          a) The committee has verifiable information about the consequences (e.g., from the department chair or the candidate's advisor).
          b) The committee agrees that the consequences are severe enough to break the tie and that this consideration is in line with the purpose of the fellowship (e.g., to support those most in need).
     - We add a step to the tie-break protocol for this:
          - After Step 4 (if we have a genuine tie) but before using a random method, ask: "Is there clear and verifiable evidence that one outcome would have significantly worse consequences than the other, and that these consequences align with the mission of the fellowship?" If yes, then break the tie in favor of avoiding the worse outcome. But note: this should be rare and must be documented thoroughly.

  7. **What is lost in translation?**
     - The philosophical discussion of Buridan's ass and incommensurability is rich and nuanced. We lose:
          - The depth of the problem of rational choice when there are no reasons to choose one over the other. The protocol reduces this to a procedural solution (randomness) without engaging in the metaphysics of indifference.
          - The distinction between indifference due to equal value and incommensurability (where values cannot be compared) is not operationalized because the committee is forced to act.
          - We also drop the possibility of "suspending judgment" because the committee must decide.
     - We deliberately drop these distinctions because in a practical committee setting, we must make a decision within 10 minutes. The protocol focuses on what can be done with the available information and avoids philosophical debates.

  **The Protocol**

  *Adoption Rule*: The committee must adopt this protocol at the first meeting of the cycle, before any applications are reviewed.

  *Tie-Break Protocol Steps for a Pair of Candidates (for a clump, see below)*:

  1. **Check Score Identity**: 
     - If the total scores are not identical, then there is no tie. 
     - If the total scores are identical, then check if the scores in every dimension are identical. 
       - If not, proceed to Step 2.
       - If yes, proceed to Step 3.

  2. **Check for Meaningful Differences in Breakdown**:
     - Ask each member to independently review the breakdown and note if they see a meaningful difference in any dimension that would break the tie. 
     - Go around the table: each member states if they see a difference and articulates it. 
     - The committee then discusses the articulated differences. 
     - If at least one difference is accepted by the committee (by majority vote) as meaningful and non-arbitrary, then break the tie in favor of the candidate with the higher score on that dimension (or according to the articulated reason). 
     - If no meaningful difference is found, proceed to Step 3.

  3. **Check for Verifiable Additional Information**:
     - Ask: "Does any committee member have substantive, verifiable, and relevant information about either candidate that is not in the file and that would break the tie?" 
     - The member must present this information. The committee then discusses and votes (majority) on:
          a) Whether the information is verifiable (e.g., by checking with the department or the candidate's advisor) and relevant.
          b) Whether it breaks the tie.
     - If yes, break the tie accordingly. 
     - If not, proceed to Step 4.

  4. **Check for Unequal Downside**:
     - Ask: "Is there clear and verifiable evidence that one outcome would have significantly worse consequences than the other, and that avoiding that worse outcome aligns with the fellowship's mission?" 
     - If yes, break the tie to avoid the worse outcome. 
     - If not, proceed to Step 5.

  5. **Genuine Tie Resolution**:
     - Declare a genuine tie. 
     - Break the tie by a random method (e.g., flip a coin) in the presence of the committee. 
     - Document the method and outcome in the minutes.

  *For a Clump of Candidates (e.g., five-way tie)*:
     - Apply the above steps pairwise? That would be too time-consuming. Instead:
     - Step 1: Check if the entire clump has identical total scores and identical breakdowns? If not, try to break the clump by looking for meaningful differences in the breakdowns (Step 2) and then additional information (Step 3). 
     - If the entire clump remains tied, then check for unequal downside (Step 4) for each candidate? This might be impractical. 
     - Alternatively, if the clump is large and the committee believes the differences are noise, then they can:
          a) Use random selection to pick the required number from the clump. 
          b) Or, if the clump is at the cutoff, they might consider awarding extra fellowships (if resources allow) or using a finer-grained scoring method (if time allows). But that might not be feasible.

     Revised for a clump:
     - Step 1: Are the total scores of the clump within one point? If yes, then the committee can treat them as tied due to noise. But then we must check if there are meaningful differences beyond the noise.
     - Step 2: Have each member rank the entire clump based on a holistic assessment (using the same criteria). Then aggregate the rankings (e.g., by Borda count) to break the tie. But note: this might not be fair if there is genuine indifference. 
     - Alternatively, we stick to the pairwise steps but only for the purpose of breaking the clump into a rank order. This might take too long.

     Given time constraints, for a clump we might:
     - Step A: The committee first votes on whether the point differences within the clump are likely noise. If yes, then treat the entire clump as tied and proceed.
     - Step B: Then, we try to break the tie by looking for meaningful differences in the breakdowns (Step 2 above) for the entire clump. Each member can nominate one candidate they believe is the strongest and articulate why. The candidate with the most nominations wins. If there is a tie in nominations, then random selection among the top nominees.
     - If that fails, then Step C: Check for additional information (Step 3) for any candidate in the clump. 
     - Step D: Check for unequal downside for any candidate in the clump. 
     - Step E: If still tied, use random selection to pick the required number.

  *Documentation*:
     - For each step, the minutes must record the outcome. 
     - In the case of a genuine tie broken randomly, the minute must say: "The committee determined that the candidates were tied and that there was no non-arbitrary basis for choosing one over the other. The tie was broken by [random method] with [describe outcome]."

  **Test Cases**

  *Case 1: Two applicants with identical scores on all five dimensions and files of comparable depth.*
     - Step 1: Total scores identical and breakdowns identical -> proceed to Step 3.
     - Step 3: No additional information -> proceed to Step 4.
     - Step 4: No evidence of unequal downside -> proceed to Step 5.
     - Step 5: Genuine tie. Break by coin flip. 
     - Why the committee might not like it: It feels arbitrary. But it is fair. We must do it.

  *Case 2: Five-way clump at the cutoff where point differences are noise.*
     - Step A: Committee votes that the point differences are noise -> treat as a five-way tie.
     - Step B: Each member nominates one candidate they believe is strongest (with a reason). Suppose we get:
          Candidate A: 3 votes
          Candidate B: 2 votes
          Candidates C, D, E: 0 votes
          Then Candidate A wins. But we need to pick 1 out of 5? Or we are awarding multiple fellowships? The problem says we award eight fellowships, and the clump is at the cutoff. So we might have to pick, say, 2 out of the 5? 
     - But note: we are at the cutoff for the last fellowship(s). So if we have five tied for the last fellowship, and we can only award one more, then we break the tie to pick one.
     - In this case, if Step B produces a clear winner (A with 3 votes), then we pick A. 
     - If Step B produces a tie (e.g., two candidates with 2 votes each), then we break that tie by moving to Step C (additional information) for those two, then Step D, then if still tied, random between the two.
     - Alternatively, if the entire clump remains tied after Steps B, C, D, then we pick by random drawing.

     Why the committee might not like it: Random selection in a clump might mean that a candidate who is just as good as the one picked is left out. But if we have no basis to choose, it is the only fair way.

  *Case 3: Tie between a candidate from my own department and an external candidate.*
     - Step 1: Total scores identical. Breakdown: let's say they are identical -> Step 3.
     - Step 3: Three members have substantial informal knowledge about the internal candidate. They present this information. But note: the committee must decide if the information is verifiable and relevant. 
          - Example: "I know that the internal candidate's research has already led to a breakthrough that is not in the file." This might be verifiable by asking the advisor and is relevant. 
          - However, the committee must be cautious about bias. They might require that the information be verified (e.g., by the chair contacting the advisor) which might not be feasible in 10 minutes. 
          - Alternatively, the committee might discount the information because it is not verifiable on the spot and because it might be biased. 
     - If the committee accepts the information and it breaks the tie in favor of the internal candidate, then they win. 
     - If not, then proceed to Step 4.
     - Step 4: Unequal downside? Maybe the internal candidate has less funding? But without verifiable evidence, we cannot use it.
     - Then Step 5: Random selection.

     Why the committee might not like it: They might feel that the internal candidate is better but cannot use unverifiable information. The random selection might pick the external candidate. They must accept it because the process is fair.

  **What the protocol cannot do**:
     - It cannot resolve fundamental disagreements about the criteria for the fellowship.
     - It cannot create reasons where none exist.
     - It cannot eliminate the inherent arbitrariness of choice under genuine indifference, but it can make it transparent and fair.

  Final note: The protocol is designed to be robust and defensible. It requires discipline and honesty from the committee members. The chair must enforce the steps rigorously.
answer: |-
  ### Tie-Break Protocol for Dissertation Fellowship Committee  
  **Adopted before reviewing any applications in a given cycle.**  
  *Rationale: Prevents strategic claims of indifference to manipulate outcomes. Ensures fairness by binding the committee to a pre-established, transparent process.*

  ---

  #### **1. Ordered Sequence of Tests for Tie Verification**  
  *Stop at the first step that resolves the tie. Document each step attempted in the minutes.*  

  | Step | Test | Sufficient Answer to Break Tie | Stop Investigation If... |
  |------|------|--------------------------------|---------------------------|
  | **1** | **Is the tie numerical only?** <br> Check: Identical total scores *and* identical subscores in all five dimensions. | If subscores differ: Proceed to Step 2. | Subscore differences exist → Move to Step 2. |
  | **2** | **Is there a coarse-rubric imposter?** <br> Ask: "Can any member articulate a *specific, criterion-aligned reason* (e.g., 'Applicant A’s methodology section is more innovative') supported by the file?" | Yes: Vote on the reason (majority approves). Valid reason breaks tie. | Articulated reason passes committee vote → Tie broken. |
  | **3** | **Is there missing evidence?** <br> Ask: "Is there *verifiable, non-speculative information* outside the file (e.g., published work, committee expertise) that directly impacts scoring?" | Yes: Information is shared, verified (e.g., by chair), and voted on (majority). | Information is irrelevant/unverifiable → Move to Step 4. |
  | **4** | **Is there inarticulate expertise?** <br> Ask: "Does any member assert a 'stronger feeling'? If so, can they trace it to a tangible aspect of the file?" | No, or reason is vague (e.g., "just feels better"): Reject. Proceed to **Genuine Tie Protocol** (Section 5). | Feeling cannot be tied to file evidence → Declare genuine tie. |

  ---

  #### **2. Protocol Fixity Rule**  
  - **When**: Adopted at the first meeting of the cycle, before files are distributed.  
  - **Why**: Prevents members from feigning indifference to later break ties strategically.  
  - **Enforcement**: If a member claims indifference mid-cycle, the protocol is binding. Appeals require proof of deviation from the protocol.  

  ---

  #### **3. Termination, Escalation, and Values**  
  - **Terminates in decision**: Steps 1–4 resolve the tie via evidence or vote.  
  - **Escalates to named person**: Never. Collective voting and randomization replace unilateral authority.  
  - **Stops for values disputes**: If disagreement is about weighting criteria (e.g., "Methodology should matter more"), this is not a tie—it’s a scoring flaw. Table the application, revisit scoring rules, and rescore.  

  ---

  #### **4. Anti-Fabrication Clause**  
  - **Rule**: No invented discriminators. Minutes must state: *"The committee had no non-arbitrary basis for distinction."*  
  - **Distinguishing real vs. fabricated reasons**:  
    - **Real**: Tied to the rubric (e.g., "Applicant B’s proposal addresses a gap in literature X, per page 3").  
    - **Fabricated**: Vague, unsupported, or retrofitted (e.g., "Applicant C seems more passionate").  
  - **Member guidance**: Ask: "Would this reason hold if challenged by the dean or an appellant?" If uncertain, it’s likely fabricated.  
  - **Minute requirement**: For genuine ties: *"No criterion-compliant reason to prefer one applicant was found."*  

  ---

  #### **5. Exit Menu for Genuine Ties**  
  *Use only after exhausting Steps 1–4.*  

  | Exit | When to Use | Why | Handling Repetition |
  |------|-------------|-----|---------------------|
  | **Randomize openly** | Default for 2–5 tied applicants. | Fair, transparent, and respects symmetry. | **Within cycle**: Each tie independent (e.g., new coin flip). <br> **Across years**: No carryover; past loss irrelevant. |
  | **Pick arbitrarily** | Only if randomization is impractical (e.g., 10+ applicants). Use alphabetical order. | Efficiency without bias. | Alphabetical order fixed at adoption; no repetition issues. |
  | **Defer to chair** | Never. | Risks bias and undermines collective responsibility. | — |
  | **Split award** | Only if: <br> (a) Funds are divisible; <br> (b) Both applicants can benefit (e.g., half-stipend for two). | Preserves fairness but dilutes impact. | Not applicable for indivisible awards (e.g., single fellowship). |
  | **Reopen search** | Never. | Wastes resources; implies committee failure. | — |

  ---

  #### **6. Unequal Downside Cases**  
  - **Step added to protocol**: After Step 4, ask: *"Is there objective evidence (e.g., departmental letter) that one applicant faces severe harm if rejected (e.g., loss of visa, degree delay)?"*  
  - **Threshold**: Harm must be catastrophic (e.g., not "disappointment") and verifiable.  
  - **Action**: Majority vote to break tie toward mitigating harm. Document evidence in minutes.  
  - **Why included**: Practical ethics; avoids grave real-world consequences under symmetry.  

  ---

  #### **7. Lost in Translation**  
  - **Deliberately dropped**:  
    - *Incommensurability*: Distinguishing "equal value" vs. "non-comparable" is unworkable in 10 minutes. Treated identically.  
    - *Moral residue*: The regret of arbitrariness is acknowledged but not resolved; the protocol prioritizes action over reflection.  
  - **Sacrificed for practicality**: Philosophical depth is reduced to binary outputs (tie/no tie) to meet time constraints.  

  ---

  ### **Protocol in Action: Test Cases**  
  #### Case 1: Identical Scores, Comparable Depth  
  - **Applicants**: A and B; same scores in all dimensions.  
  - **Steps**:  
    1. **Step 1**: Tie confirmed (identical subscores).  
    2. **Step 2**: No articulated differences.  
    3. **Step 3**: No external evidence.  
    4. **Step 4**: "Feels stronger" claims rejected (unsupported).  
    5. **Exit**: Random selection (coin flip).  
  - **Why committee won’t like it**: Feels arbitrary when both are excellent. **Follow it anyway**: Indifference is real; randomization is the only fair solution.  

  #### Case 2: Five-Way Clump (Cutoff Noise)  
  - **Applicants**: Five with scores within 1 point; differences reflect rubric coarseness.  
  - **Steps**:  
    1. **Step 1**: Not identical subscores → Proceed to Step 2.  
    2. **Step 2**: No member can articulate specific, criterion-aligned distinctions.  
    3. **Genuine Tie Protocol**: Random selection (draw names from hat).  
  - **Why committee won’t like it**: High stakes; multiple worthy applicants lose. **Follow it anyway**: Noise ≠ distinction; inventing reasons is dishonest.  

  #### Case 3: Internal vs. External Candidate Tie  
  - **Applicants**: Internal (informal knowledge) vs. External (file-only).  
  - **Steps**:  
    1. **Step 1**: Tie confirmed (identical scores).  
    2. **Step 3**: Members share informal knowledge (e.g., "Internal’s conference presentation was groundbreaking").  
    3. **Verification**: Information is deemed unverifiable on the spot (no published record). Rejected.  
    4. **Exit**: Random selection (external candidate wins coin flip).  
  - **Why committee won’t like it**: Favors the unknown candidate despite "expert intuition." **Follow it anyway**: Unverifiable knowledge risks bias; fairness demands symmetry.  

  ---

  ### **What the Protocol Cannot Do**  
  1. **Resolve scoring-criteria disputes**: Use for ties only, not debates over rubric design.  
  2. **Override conflict of interest**: Recusal rules still apply (e.g., if a member advises an applicant).  
  3. **Eliminate regret**: Randomization leaves "moral residue," but this is inherent to indifference.  
  4. **Replace deliberation**: Only invokable after scores are finalized.  

  ---  
  **Final Note**: This protocol transforms philosophical indifference into auditable fairness. It accepts randomization as the price of integrity when reasons vanish. Adopt it once, apply it uniformly, and document relentlessly.
