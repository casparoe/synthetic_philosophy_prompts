prompt: |-
  Hi — I'm the program officer at the Marlow Fund, a small family foundation. We give away about $5m a year, two program staff (me and one other person), board meets quarterly but we make grant decisions monthly, ~25 grants a year and half of them are renewals. Here's our problem in two parts.

  First: about $1.5m of the annual payout is locked by the donor's will to "work that benefits people who have not been born yet," and the rest is basically unrestricted near-term global health and development. So in the same meeting we score, I dunno, a school-based delivery programme that's been running for six years and a small speculative biosecurity team, and it obviously doesn't work — the units aren't the same, and "do nothing and move the money across" isn't even available in the locked bucket, because the money has to go out the door into that bucket somehow.

  Second: right now we rate every proposal High/Medium/Low on importance, tractability and neglectedness (the three-factor framework you've probably seen floating around the effective-altruism world), turn those into 3/2/1, and multiply. It's silly and we know it. A Medium/Low/High beats a High/High/Low and nobody actually believes that. "Neglectedness" keeps getting scored as "nobody cool is talking about this" rather than as anything to do with money. And our board chair is a retired accountant who says he doesn't want to see any figure with more than one significant digit, while another trustee thinks any cause you can't describe to her mother over dinner is a scam.

  So: give us something we can actually run. Constraints — maybe two hours per proposal, one round of follow-up questions to the applicant, no literature reviews, no outside modelling contractor, and it has to fit on the one-page memo that goes to the board.

  Specifically I want:

  - The order we should establish things in, and what counts as an adequate answer at each step. I suspect we should be checking who else is already funding the space *before* we try to estimate how much good a dollar does, and that tractability should be judged at the margin rather than on average — but you tell me if that's right.
  - How the three factors actually interact, and what to do instead of multiplying, given they clearly aren't independent.
  - Where the procedure stops with a no, and where it has to stop and hand the decision to a person because the question is one of values and not facts.
  - What we do when we can't get a number at all, which is most of the time.
  - How to write the result up so it survives contact with the board: one significant digit, and explainable to someone's mother.
  - Honesty about which steps are judgement dressed up as procedure. I'd rather know now than find out in year three.

  Then run it on three real-ish cases, and at least one should come out in a way I won't like:

  (a) a renewal for a well-run school-based mass deworming / delivery programme that everyone loves, that on the evidence as it stands looks fine, and that at least three bigger funders are already in;
  (b) a cheap speculative research proposal from a tiny team with no track record, testing a mechanism nobody has tested, where the interesting part is the tail outcome and the chance we learn something;
  (c) a community health worker training programme whose numbers look great but which can only roughly double in size per year because of trainer supply.

  Also tell us what the procedure can't do — where it will definately misfire — and don't soften it. We keep tying ourselves in knots in meetings and I'd rather hand the board something with its limits printed on it.
reasoning: |-
  We are designing a grant evaluation procedure for the Marlow Fund with specific constraints. The procedure must:
  1. Handle two distinct buckets: locked future-oriented grants ($1.5M) and unrestricted near-term global health and development grants.
  2. Overcome the shortcomings of the current High/Medium/Low scoring and multiplication.
  3. Be executable within about 2 hours per proposal, with one round of follow-up questions.
  4. Fit on a one-page memo for the board, using one significant digit and explainable in simple terms.
  5. Explicitly acknowledge where judgment is used.

  The procedure will be structured in steps, with clear decision points and stopping rules.

  ### Proposed Procedure Outline

  **Step 0: Pre-screening (Quick Check)**
     - Check alignment with the fund's focus (for the locked bucket, must explicitly benefit future generations; for unrestricted, near-term global health/development).
     - Basic due diligence: organization legitimacy, basic financials, and whether the proposal is complete.
     - If fails, stop (no). This step should take no more than 15 minutes.

  **Step 1: Problem Importance**
     - *Goal:* Assess the scale and severity of the problem the proposal aims to address.
     - *Method:* 
       - For near-term grants: Use available data (e.g., DALYs, lives saved, or other measurable impacts) to estimate the burden of the problem. If data is scarce, use expert consensus or comparable benchmarks.
       - For future-oriented grants: Focus on the potential scale of the problem (e.g., existential risk reduction, long-term well-being). Use frameworks like the importance of reducing extinction risk or improving the long-term future.
     - *Adequate answer:* A rough estimate of the problem's magnitude (e.g., "Affects 10 million people annually" or "Could reduce extinction risk by 0.001%"). If we cannot get a rough estimate, we may stop (no) or flag for judgment.
     - *Judgment:* The choice of metric and interpretation of data involves judgment.

  **Step 2: Neglectedness (Who else is funding?)**
     - *Goal:* Determine if the problem is underfunded relative to its importance, and if additional funding would make a difference.
     - *Method:* 
       - Research current funding in the area (via grant databases, expert interviews, or applicant's information). Estimate the total funding and major funders.
       - Assess the funding gap: How much more is needed? Is there room for more funding without diminishing returns?
     - *Adequate answer:* A rough estimate of current annual funding and the funding gap (e.g., "Current funding: $5M, needed: $20M"). If the gap is small (e.g., <10% of current funding) or the problem is saturated, we may stop (no). Also, if the applicant is unable to provide any information, that's a red flag.
     - *Judgment:* Estimating funding gaps involves judgment, especially when data is incomplete.

  **Step 3: Tractability at the Margin**
     - *Goal:* Estimate the expected impact per dollar of additional funding (marginal cost-effectiveness).
     - *Method:*
       - For near-term grants: Use cost-effectiveness models (simplified versions) or benchmarks. For example, compare to known interventions (e.g., deworming costs $X per DALY averted).
       - For future-oriented grants: Estimate the probability of success and the potential impact if successful. Use a simple model: Impact = (Probability of success) * (Magnitude of benefit if successful) / Cost.
     - *Adequate answer:* A rough cost-effectiveness estimate (e.g., "$100 per life saved" or "1e-6 reduction in extinction risk per dollar"). If the estimate is below a threshold (to be set by the fund) or if we cannot produce an estimate despite trying, we stop (no) or flag for judgment.
     - *Note:* We are estimating marginal impact, not average. For renewals, consider the impact of an additional dollar to this organization, not the past impact.
     - *Judgment:* The model structure and parameter estimates are judgment calls.

  **Step 4: Organization and Execution Risk**
     - *Goal:* Assess the organization's ability to deliver.
     - *Method:* 
       - Review track record, team expertise, and operational plan.
       - For new organizations, focus on key personnel and feasibility of the plan.
     - *Adequate answer:* A qualitative assessment (e.g., "Strong team with 5 years of experience in the area" or "New team but plausible plan"). If the risk is too high (e.g., no track record and no mitigating factors), we may stop (no).
     - *Judgment:* This is entirely judgment-based.

  **Step 5: Integration and Decision**
     - Instead of multiplying scores, we use a threshold-based approach:
       - If the proposal fails any of Steps 1-4, it's rejected.
       - If it passes all, then we compare the marginal cost-effectiveness (from Step 3) across proposals, but only within the same bucket (locked vs. unrestricted). We cannot compare across buckets because the units are different.
       - For the locked bucket, we have to spend the $1.5M, so we fund the top proposals until the bucket is exhausted (even if they are below the unrestricted threshold). For unrestricted, we fund the best until the budget is exhausted.

  **Handling Uncertainty and Judgment:**
     - Where we cannot get a number, we use a qualitative assessment (e.g., "very high", "high", "medium", "low") and note the uncertainty. If the uncertainty is too high to make a decision, we stop (no) or flag for board judgment.
     - We explicitly note in the memo which steps are based on judgment.

  **Writing the Memo:**
     - One page, structured as:
       - Proposal summary (1-2 sentences)
       - Problem Importance: [Number or qualitative] (e.g., "Affects 1e6 people per year")
       - Neglectedness: [Number or qualitative] (e.g., "Funding gap: $10M per year")
       - Marginal Cost-Effectiveness: [Number or qualitative] (e.g., "$100 per life saved" or "Low probability but huge upside")
       - Execution Risk: [Qualitative] (e.g., "Low risk: proven team")
       - Overall Recommendation: Fund/Reject. If fund, note bucket and amount.
     - Use one significant digit for numbers and avoid jargon.

  **Limitations of the Procedure:**
     - It cannot compare across buckets (future vs. near-term). We must accept that and treat them as separate portfolios.
     - It relies heavily on judgment in the face of uncertainty, especially for future-oriented grants.
     - It may reject high-risk, high-reward proposals if the probability of success is too uncertain (we might set a lower threshold for the locked bucket to account for this).
     - It may not capture synergies between grants.
     - For renewals, it might undervalue long-term relationships and learning if we only look at marginal impact.

  ### Applying the Procedure to the Three Cases

  **Case (a): School-based mass deworming/delivery programme (renewal)**
     - *Bucket:* Unrestricted (near-term).
     - *Step 1 (Importance):* Deworming addresses a high burden of disease (intestinal worms affect millions, cause anemia, impaired growth). Estimate: 1e6 children reached. [Pass]
     - *Step 2 (Neglectedness):* Several big funders (e.g., GiveWell charities, governments) are active. Current funding likely adequate or even saturated. Funding gap: small? [Potential stop: if we find funding is saturated, then no. But if the organization is particularly efficient, maybe there's room for more funding?]
     - *Step 3 (Tractability):* Well-established cost-effectiveness: ~$100 per DALY averted. But marginal impact: if the area is saturated, additional dollars might not do much. We must estimate the marginal impact. If the organization can expand to a new area, then marginal impact might be similar to average. Otherwise, low. [Without expansion, might fail]
     - *Step 4 (Execution):* Well-run, proven track record. Low risk. [Pass]
     - *Decision:* If neglectedness and marginal tractability are low, reject. This might be unpopular because it's a renewal and loved, but the procedure might say no.

  **Case (b): Speculative biosecurity research**
     - *Bucket:* Locked (future-oriented).
     - *Step 1 (Importance):* Potential to prevent a pandemic (existential risk). Magnitude: if successful, could reduce extinction risk by a tiny but non-zero amount. [Pass]
     - *Step 2 (Neglectedness):* Biosecurity is underfunded? Check: total funding is low relative to the risk. Funding gap: large. [Pass]
     - *Step 3 (Tractability):* High uncertainty. Probability of success: low (say 10%). Impact if successful: huge (say 1% reduction in extinction risk over 10 years). Cost: $100,000. So cost-effectiveness: (0.1 * 0.01) / 100000 = 1e-7 reduction per dollar. But how to compare? We have no benchmark. We must rely on qualitative: "low probability, high upside". [Pass if we set a lower bar for locked bucket?]
     - *Step 4 (Execution):* Tiny team, no track record. High risk. [Could be a stop?]
     - *Decision:* This is borderline. If we have a lot of locked-bucket money and few proposals, we might fund. But the procedure might reject due to high execution risk and uncertainty. However, for the locked bucket, we might be more tolerant of risk.

  **Case (c): Community health worker training**
     - *Bucket:* Unrestricted (near-term).
     - *Step 1 (Importance):* Training community health workers can address a range of health issues. Estimate: covers 10,000 people. [Pass]
     - *Step 2 (Neglectedness):* Many organizations do this. Check funding: might be crowded? Or might be a gap in this region? If there's a gap, pass. [Needs research]
     - *Step 3 (Tractability):* Numbers look great: e.g., $500 per life saved. But note: they can only double per year. So marginal impact of additional dollar: if we give them $X, how much more can they do? If they are constrained by trainers, then additional dollars might not scale immediately. We must fund them at a level that matches their growth. So the marginal impact might be high for the next step (doubling) but then drop. [Pass for a grant that fits their growth rate]
     - *Step 4 (Execution):* They have a track record? If yes, low risk. [Pass]
     - *Decision:* Fund, but at a level that matches their capacity.

  ### Limitations (Explicitly Stated)
     - **Cannot compare across buckets:** We will have two separate lists: one for locked and one for unrestricted. We fund the best in each until the bucket is exhausted.
     - **Renewals may be undervalued:** If an organization is already well-funded, the marginal dollar may have low impact. This might lead to dropping successful programs. We might need a way to account for long-term partnerships and learning (but the procedure doesn't capture that).
     - **High-risk, high-reward:** The procedure may reject high-risk proposals (like the biosecurity one) because of uncertainty and execution risk. For the locked bucket, we might adjust by having a lower threshold for execution risk and accepting more uncertainty.
     - **Subjectivity in qualitative assessments:** We will note these in the memo.

  ### Final Procedure Steps

  1. **Pre-screen** (15 min): Alignment and basic due diligence. Stop if fail.
  2. **Assess Problem Importance** (30 min): Estimate scale. Stop if too small or unquantifiable even qualitatively.
  3. **Assess Neglectedness** (30 min): Estimate funding gap. Stop if gap is small (e.g., <10% of current funding) or if the problem is saturated.
  4. **Assess Marginal Tractability** (30 min): Estimate cost-effectiveness. Stop if below threshold (set separately for each bucket) or unquantifiable even qualitatively.
  5. **Assess Execution Risk** (15 min): Stop if too high.
  6. **Compare within bucket:** Rank by cost-effectiveness (or qualitative equivalent) and fund top until budget exhausted.

  For the locked bucket, we might lower the tractability threshold and accept higher uncertainty.

  We'll run this for a year and review. We accept that it's imperfect but better than multiplying H/M/L.

  Now, let's write the one-page memo format.

  **Example Memo for Case (a):**

  ```
  Proposal: Renewal of School-Based Deworming Program - Org: Deworm World
  Request: $200,000 for one year

  Importance: Deworming treats parasitic infections in children. Prevents anemia and improves growth. Scale: 1e6 children reached annually. [High]

  Neglectedness: Area has multiple large funders (e.g., GiveWell, governments). Estimated current funding: $50M/year. Funding gap: small (maybe 10% of current). [Low]

  Marginal Cost-Effectiveness: Without expansion to new areas, additional funds may not add much impact. Current cost: $100 per DALY averted. Marginal: likely much higher due to saturation. [Low]

  Execution Risk: Low. Organization has 6-year track record. [Low]

  Recommendation: Reject (for unrestricted bucket). Reason: Low neglectedness and low marginal impact.
  ```

  **Case (b):**

  ```
  Proposal: Novel Biosecurity Detection Research - Org: BioFuture
  Request: $100,000 for one year

  Importance: Could lead to early detection of novel pathogens, reducing pandemic risk. Potential impact: very high (reduction in extinction risk). [Very High]

  Neglectedness: Biosecurity research is underfunded. Current funding: ~$100M/year? Funding gap: large (est. $1B/year). [High]

  Marginal Cost-Effectiveness: High uncertainty. Probability of success: low (10% chance of meaningful result). Impact if successful: very high. Rough estimate: 1e-7 reduction in extinction risk per dollar. [Qualitative: High upside, low probability]

  Execution Risk: High. New team, no track record. [High]

  Recommendation: For locked bucket, fund. Reason: High importance and neglectedness, and the locked bucket is for high-risk future-oriented work. However, note high execution risk.
  ```

  **Case (c):**

  ```
  Proposal: Community Health Worker Training - Org: HealthTrain
  Request: $150,000 for one year

  Importance: Trains workers to provide basic health services in underserved areas. Scale: 100 workers trained, covering 10,000 people. [Medium]

  Neglectedness: Many organizations in this space, but regional gap exists. Current funding in region: $1M/year? Funding gap: $500K/year. [Medium]

  Marginal Cost-Effectiveness: $500 per life saved (based on their data). They can double in size, so marginal impact is similar. [High]

  Execution Risk: Low. Two-year track record, good monitoring. [Low]

  Recommendation: Fund (unrestricted bucket). Amount: $150,000.
  ```

  This procedure provides a structured, transparent way to evaluate grants within the constraints. It will require discipline to stick to the steps and time limits, and we must accept that it might reject some beloved programs if they are no longer the best marginal opportunity.
answer: |-
  Below is a streamlined grant evaluation procedure designed for your constraints. It replaces your multiplicative scoring with a **threshold-based decision tree** and explicitly separates factual analysis from value judgments. The procedure is structured to avoid cross-bucket comparisons, handles uncertainty transparently, and delivers board-ready outputs.

  ---

  ### **The Marlow Fund Grant Evaluation Procedure**
  **Core Principle:**  
  *"Fund interventions that are important, under-resourced, and likely to benefit from our marginal dollar—with separate rules for locked vs. unrestricted buckets."*

  #### **Step 0: Bucket Assignment (5 mins)**  
  - **Action:** Assign proposal to either "Locked" (future generations) or "Unrestricted" (near-term global health) bucket.  
  - **Stop if:** Proposal doesn’t fit either bucket (e.g., locked-bucket applicant can’t articulate a future-generation link).  
  - **Judgment call?** Yes. Values-based (e.g., "Do we consider climate change a future-generation issue?").

  #### **Step 1: Neglectedness Check (30 mins)**  
  *Why first?* If others are already funding this, your marginal dollar adds little. Avoids wasting time on saturated fields.  
  - **Action:** Estimate current annual funding in the intervention’s niche (via public databases, applicant info, or 2–3 expert calls).  
  - **Adequate answer:**  
    - *Quantitative:* "Current funding: ~$X M/year."  
    - *Qualitative:* "No major funders working on this specific approach."  
  - **Stop if:**  
    - For unrestricted: Field is saturated (>80% of needed funding met).  
    - For locked: No unique angle (e.g., 5+ well-funded orgs doing identical work).  
  - **Judgment call?** Low. Focuses on observable funding flows.  
  - **Output:** "Neglectedness: High/Medium/Low" + 1-sentence explanation.

  #### **Step 2: Importance Assessment (30 mins)**  
  - **Action:** Estimate the problem’s scale using available data. **Do not model the intervention yet.**  
  - **Adequate answer:**  
    - *Near-term:* "DALY burden: ~Y million/year" or "Affects ~Z million people."  
    - *Future-oriented:* "Potential to reduce existential risk by ~P%" or "Could improve long-term trajectories for Q billion people."  
  - **Stop if:**  
    - Problem scale is trivial (e.g., <1% of comparable issues in the bucket).  
    - No defensible estimate possible (e.g., speculative claims with no anchors).  
  - **Judgment call?** Medium. Requires selecting credible data sources.  
  - **Output:** "Importance: [Number] + [Unit]" (e.g., "10M DALYs/year").

  #### **Step 3: Marginal Tractability (45 mins)**  
  *Why "marginal"?* Your $1’s impact depends on what’s already funded.  
  - **Action:** Estimate added impact per dollar **given current funding levels** (from Step 1).  
  - **Method:**  
    - *Near-term:* Compare to benchmarks (e.g., "Cost per life saved: ~$X vs. $Y for bednets").  
    - *Future-oriented:* "Probability of success: ~P% × Scale of upside: ~Q."  
  - **Adequate answer:**  
    - "Cost per DALY averted: ~$K" or "Expected reduction in risk per $1M: ~R%."  
  - **Stop if:**  
    - Cost-effectiveness < 50% of your bucket’s benchmark (e.g., unrestricted benchmark = $5k/DALY¹).  
    - No plausible path to impact (e.g., physics-breaking assumptions).  
  - **Judgment call?** High. Involves extrapolation and uncertainty weighting.  
  - **Output:** "Marginal impact per $100k: [Number] + [Unit]."

  #### **Step 4: Execution Risk (10 mins)**  
  - **Action:** Assess team/org’s ability to deliver.  
  - **Adequate answer:** Qualitative rating + 1–2 evidence points (e.g., "Low risk: Ran 3 successful pilots" vs. "High risk: No prior work in this context").  
  - **Stop if:** Execution risk is catastrophic (e.g., fraud history, no relevant skills).  
  - **Judgment call?** High. Based on track record and plausibility.  

  #### **Step 5: Integration & Funding Decision**  
  - **Do not multiply factors.** Apply thresholds:  
    ```  
    IF Neglectedness = Low → REJECT  
    IF Importance < Bucket Threshold → REJECT  
    IF Marginal Impact < Bucket Benchmark → REJECT  
    IF Execution Risk = Critical → REJECT  
    ELSE → FUND (prioritize within bucket by marginal impact)  
    ```  
  - **Bucket Benchmarks (set annually):**  
    - *Unrestricted:* Minimum impact = $10k/DALY averted (adjustable).  
    - *Locked:* Minimum "expected value" score (e.g., 0.1% reduction in existential risk per $1M).  
  - **Value judgments:**  
    - Benchmarks reflect board priorities (e.g., "How much risk tolerance for locked-bucket projects?").  
    - No procedure can resolve disagreements about values (e.g., "Should we prioritize near-term lives over long-term futures?").  

  ---

  ### **Output Template for Board Memo**  
  ```markdown
  Proposal: [Name]  
  Bucket: [Locked/Unrestricted]  
  Request: $[Amount]  

  1. **Neglectedness:** [Low/Med/High]. [1-sentence evidence].  
  2. **Importance:** [Number] [Unit] (e.g., "2M people affected").  
  3. **Marginal Impact:** [Number] [Unit] (e.g., "$3k/DALY averted").  
  4. **Execution Risk:** [Low/Med/High]. [1-sentence why].  
  5. **Recommendation:** Fund/Reject.  
  ```  
  *All numbers rounded to 1 significant digit. Plain English explanations required.*

  ---

  ### **Test Cases**  
  #### **(a) School-Based Deworming Renewal**  
  - **Step 0:** Unrestricted.  
  - **Step 1 (Neglectedness):** Low. 3+ large funders; field saturated. → **STOP. REJECT.**  
  - **Board memo:**  
    ```  
    Neglectedness: Low. Gates Foundation, END Fund, and USAID fund similar programs.  
    [Other sections skipped due to rejection]  
    Recommendation: Reject.  
    ```  
  - **Why you’ll dislike it:** Kills a "safe" renewal. Forces focus on gaps, not inertia.

  #### **(b) Speculative Biosecurity Research**  
  - **Step 0:** Locked.  
  - **Step 1 (Neglectedness):** High. Only 2 small teams working on this mechanism.  
  - **Step 2 (Importance):** 10% reduction in pandemic risk if successful (tail estimate).  
  - **Step 3 (Marginal Tractability):** Expected risk reduction per $100k: ~0.01% (low probability × high upside).  
  - **Step 4 (Execution Risk):** Medium. New team but credible backgrounds.  
  - **Decision:** Clears thresholds → **FUND** (if within top 50% of locked-bucket proposals).  
  - **Board memo:**  
    ```  
    Neglectedness: High. Few teams exploring this.  
    Importance: 10% reduction in pandemic risk if successful.  
    Marginal Impact: ~0.01% risk reduction per $100k.  
    Execution Risk: Medium. Team is new but has relevant PhDs.  
    Recommendation: Fund.  
    ```  
  - **Mother-friendly explanation:** "We’re betting a small amount on smart people trying to stop plagues early."

  #### **(c) Community Health Worker Program**  
  - **Step 0:** Unrestricted.  
  - **Step 1 (Neglectedness):** Medium. Major NGOs in region but trainer shortage creates funding gap.  
  - **Step 2 (Importance):** 500k people in target area.  
  - **Step 3 (Marginal Tractability):** $8k/DALY averted (accounts for slow scaling).  
  - **Step 4 (Execution Risk):** Low. 4 years of proven delivery.  
  - **Decision:** Impact better than benchmark ($10k/DALY) → **FUND.**  
  - **Board memo:**  
    ```  
    Neglectedness: Medium. Trainer shortage limits growth.  
    Importance: 500k people with poor healthcare access.  
    Marginal Impact: $8k/DALY averted.  
    Execution Risk: Low. Strong track record.  
    Recommendation: Fund.  
    ```  

  ---

  ### **Where the Procedure Will Misfire**  
  1. **Over-rejects "safe" renewals:**  
     - Deworming case shows this. If your board values stability, add a "legacy exception" (but disclose the trade-off).  

  2. **Undervalues coordination benefits:**  
     - E.g., funding a consortium for field-building. Procedure can’t quantify this.  

  3. **Fails on "unknown unknowns":**  
     - A locked-bucket project with no data (e.g., novel AI alignment) may be rejected at Step 2. This is intentional—high uncertainty demands board discretion.  

  4. **Biased against execution-heavy work:**  
     - Scaling constraints (like trainer shortages) hurt tractability scores. If you value capacity-building, adjust benchmarks.  

  5. **No cross-bucket comparisons:**  
     - A $5k/DALY unrestricted project always beats a 0.05% risk-reduction locked project. The procedure won’t resolve this.  

  ---

  ### **Implementation Notes**  
  - **Set benchmarks annually** with board input (e.g., "What’s our minimum acceptable impact for unrestricted grants?").  
  - **Track your time:** Stop steps at 2 hours total. If unanswered questions remain, reject or flag for board discretion.  
  - **Disclose judgment calls:** Use footnotes in memos (e.g., "Tractability estimate based on expert judgment—40% uncertainty").  
  - **Audit yourself:** Review 3 rejected/approved grants quarterly. Did the procedure miss something critical?  

  This system prioritizes transparency, avoids false precision, and forces tough choices—especially on renewals. It won’t eliminate debate, but it will anchor it in consistent criteria.  

  ¹ *Example benchmark based on GiveWell’s top charities. Adjust to your priorities.*
