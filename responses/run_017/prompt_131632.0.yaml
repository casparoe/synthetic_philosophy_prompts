answer: |-
  ### Exam Question  
  **Philosophy of Perception: Take-Home Final**  
  **Time Allocation:** 90 minutes  
  **Total Marks:** 30  

  ---  
  **Question 3: Cognitive Penetrability and Epistemic Consequences**  
  Consider the following cases:  

  - **Case A:** An experienced radiologist, after two years of using an assistive system that highlights suspicious regions on scans, finds that tumors now "jump out" at her even when the system is offline. She has no occurrent belief about any specific image during viewing, and objective tests confirm her unassisted accuracy has improved.  
  - **Case B:** In a laboratory task, participants are told before each block of trials whether an ambiguous target (e.g., a rotated letter) is more likely to be one thing (e.g., "F") or another (e.g., "E").  
    - **Version 1:** Participants report the target "pops out vividly," but signal detection analysis reveals this is *entirely* due to a shift in response criterion (e.g., they become more willing to report "F" when expecting it), with no change in sensitivity (d').  
    - **Version 2:** The same setup, but sensitivity (d') *increases* when participants expect a specific target.  

  Address the following:  
  **(a)** For **Case A**, what evidence would distinguish whether this is:  
  - (i) Cognitive penetration (where cognition alters perceptual experience itself),  
  - (ii) Merely a diachronic retuning of perception (e.g., long-term learning with no occurrent cognitive state "penetrating" at the moment of seeing), or  
  - (iii) An attentional effect (e.g., learned *where* to look, not *what* is seen)?  
  *(8 marks)*  

  **(b)** For **Case B**:  
  - (i) In **Version 1** (criterion shift only), what would need to be true of the data to show this is cognitive penetration rather than a post-perceptual decision bias? What key ambiguity remains even if participants *insist* the target "looks different"?  
  *(4 marks)*  
  - (ii) In **Version 2** (sensitivity change), does this *settle* that cognitive penetration occurred? Explain what this shows and what it *fails* to resolve about the penetration debate.  
  *(6 marks)*  

  **(c)** Suppose perception *is* cognitively penetrable. For Fodor’s epistemic argument (that penetrated perception cannot serve as an independent check on beliefs), does it matter whether the "penetrating" state is:  
  - (i) A true, rationally held belief (e.g., "Tumors are likely here"),  
  - (ii) A desire (e.g., *wanting* a tumor to be present), or  
  - (iii) A belief absorbed via training (as in Case A) and no longer occurrent?  
  *(6 marks)*  
  Finally, what conditions could make a penetrable system **epistemically benign** (i.e., *non*-circular)? Does this benign/malignant distinction align with the penetrable/encapsulated distinction?  
  *(6 marks)*  

  ---  

  ### Model Answer (High First-Class, ~600 words)  
  **(a)** For Case A, three distinctions are critical. First, to rule out mere *attention*, we’d need eye-tracking or neural evidence (e.g., fMRI) showing activity in early visual areas changes *before* attention is deployed—suggesting the tumor’s salience isn’t just about where she looks. Second, to distinguish diachronic retuning from occurrent penetration, we’d test whether the effect persists when she holds beliefs *incompatible* with the training (e.g., falsely told "today’s scans are tumor-free"). If tumors still "jump out," it’s likely retuning (no occurrent state); if not, it’s penetration. Third, objective accuracy gains alone don’t settle this: retuning often improves sensitivity (d'), but penetration could too.  

  **(b)** (i) For Version 1 (criterion shift), penetration would require evidence that the *phenomenology* changed—e.g., neural correlates of perceptual processing (like V1/V2 activity) aligning with reports of vividness, or a cross-task consistency (e.g., the bias affects reaction times in a task unrelated to reporting). However, even vividness reports are ambiguous: a criterion shift can *feel* like changed experience (e.g., "I saw it clearly!") without altering the percept itself.  
  (ii) In Version 2 (sensitivity change), this shows perception is *altered* (not just decisions), but it doesn’t prove *cognitive* penetration. The sensitivity gain could stem from attentional selection (e.g., expecting "F" focuses spatial attention) or low-level priming. To confirm penetration, we’d need to rule out these alternatives—e.g., by showing the effect occurs with *high-level* expectations (e.g., expecting "farm animals" improves sensitivity to cows).  

  **(c)** For Fodor’s argument:  
  - (i) A *true belief* doesn’t help: even accurate penetration creates circularity. If you see a tumor *because* you believe it’s there, perception can’t independently justify that belief.  
  - (ii) A *desire* worsens the problem: desires aren’t truth-apt, so they could distort perception (e.g., making a hill look less steep) without epistemic constraints.  
  - (iii) *Absorbed beliefs* (Case A) are less damaging: if retuning is based on past statistical learning (not occurrent states), perception remains "encapsulated" at the time of use and can still test *new* beliefs (e.g., the radiologist can spot tumors she didn’t expect).  
  A penetrable system is **epistemically benign** if the penetrating states are *reliably truth-conducive* (e.g., scientific training) *and* encapsulated from the beliefs being tested. Crucially, the benign/malignant distinction *does not align* with penetrable/encapsulated: diachronic penetration (retuning) can be benign (as above), while synchronic penetration by occurrent beliefs is usually malignant (it circularly "confirms" itself).  

  ---  

  ### Marking Scheme  

  | Required move                                                                                                 | Marks (out of 30) | What a first-class answer does                                                                                                | The specific mistake that costs the mark                                                                                |  
  |:-------------------------------------------------------------------------------------------------------------|:------------------|:-----------------------------------------------------------------------------------------------------------------------------|:------------------------------------------------------------------------------------------------------------------------|  
  | **(a)(i): Distinguishes penetration from diachronic retuning in Case A**                                     | 3                 | Uses a test (e.g., incompatible beliefs) to probe for occurrent influence vs. training.                                      | Asserts training *is* penetration without testing for occurrent states.                                                |  
  | **(a)(ii): Distinguishes penetration/retuning from attentional effects**                                     | 3                 | Probes neural/temporal evidence (e.g., early visual activity) to separate attention from perceptual change.                  | Treats attention as a form of penetration without distinction.                                                         |  
  | **(a)(iii): Notes accuracy gains alone don’t resolve the mechanism**                                         | 2                 | Clarifies that both penetration and retuning could improve d'.                                                               | Asserts accuracy gains prove penetration.                                                                              |  
  | **(b)(i): Identifies evidence for penetration in Version 1 (criterion shift)**                               | 2                 | Requires neural/behavioral markers of phenomenology (e.g., cross-task effects).                                              | Accepts subjective reports as sufficient proof of penetration.                                                         |  
  | **(b)(i): Explains why criterion shifts are ambiguous even with vividness reports**                           | 2                 | Notes that decisional bias can be experienced as fluency or confidence without altering perception.                          | Equates "vividness" with perceptual change.                                                                            |  
  | **(b)(ii): States sensitivity change shows perceptual alteration**                                           | 2                 | Explicitly links d' change to perceptual processing (not decisions).                                                         | Confuses sensitivity (d') with response bias.                                                                          |  
  | **(b)(ii): Explains why sensitivity change doesn’t prove *cognitive* penetration**                           | 4                 | Cites alternative explanations (attention, priming) and how to test them.                                                    | Asserts d' change = cognitive penetration.                                                                             |  
  | **(c): Analyzes Fodor’s argument w.r.t. true beliefs/desires/absorbed beliefs**                              | 3                 | Shows true beliefs don’t prevent circularity; desires add distortion; absorbed beliefs reduce circularity.                   | Claims true beliefs make penetration benign.                                                                           |  
  | **(c): Identifies conditions for epistemic benignity (e.g., truth-conducive states, testing novel beliefs)** | 3                 | Links benignity to reliability and encapsulation at time of use.                                                             | Asserts all penetration is malignant or all retuning is benign.                                                        |  
  | **(c): Correctly denies alignment of benign/malignant with penetrable/encapsulated**                         | 3                 | Notes diachronic penetration can be benign; synchronic often malignant.                                                      | Asserts encapsulation guarantees benignity or penetration guarantees circularity.                                      |  

  ---

