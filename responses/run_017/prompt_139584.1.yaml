prompt: |-
  Hi — please act as a professional philosopher who works in metaethics, and take this slowly: before answering, sketch out the distinct claims the passage is making, then walk through them one at a time, and only at the end tell me what follows.

  I'm a retired evolutionary biologist who's got into philosophy in the last few years. There's a popular-science book I read recently — a real science writer, not a hack, I just won't name it — that summarises the evolutionary debunking argument something like this, as best I can reconstruct it:

  "Evolution made us moral, and that is the problem. Natural selection didn't care whether our moral beliefs were true, only whether they kept us cooperating with kin and trading favours inside the band, so it handed us strong convictions about loyalty, fair exchange and punishing cheats while remaining completely indifferent to the actual moral facts. Had the moral truth been the opposite, the same pressures would have handed us the opposite convictions and we would feel just as certain of them. So the best explanation of why we believe what we believe never mentions what is really right: our beliefs were fixed by something independent of the facts, and there are therefore no moral facts for them to track — moral judgments are sentiments selection installed in us. This isn't armchair speculation either: people really do scale their willingness to help and to take risks for others by genetic relatedness, roughly as inclusive-fitness theory predicts, so the evolutionary story is empirically confirmed. And the argument can't be fenced in. Our logical and mathematical beliefs were selected for usefulness too, so if evolution discredits morality it discredits arithmetic, and the debunker is stuck saying that two plus two might equal five, which is absurd — and that's the end of that."

  A couple of pages earlier the book also says the argument doesn't need to claim our moral beliefs are false, only that evolution explains them completely and leaves the moral facts no explanatory work to do — and that sounds to me like it's in tension with the flat "there are no moral facts" line, though maybe that's just my confusion.

  Is this a fair summary? Go through it and separate what a defender of one of these arguments would accept, what they'd call a simplification for a lay audience, and what they'd say the book actually got wrong. I've seen the arguments attached to names like Street, Joyce and Mackie, but I don't want references or a reading list, just the structure. Then: does the arithmetic move, presented as a refutation, land? And does the nihilist conclusion still follow from whatever parts of the summary survive correction?

  My own hunches, which I'd also like checked: the relatedness data seems like the strongest bit to me, but after thirty years of watching colleagues tell adaptationist just-so stories I'm wary of any "best explanation" claim, and I know alot turns on whether a selection story about behaviour says anything about the content of a judgement. And the arithmetic bit strikes me as weak, since surely the debunker just says the warrant for arithmetic comes from proof and not from where the belief came from.
reasoning: |-
  Okay, let me approach this step by step as requested. The user is a retired evolutionary biologist getting into philosophy, presenting a popular science summary of evolutionary debunking arguments in metaethics. I need to carefully dissect this passage claim by claim.

  First, the core structure of the quoted argument appears to have several key components:
  - The origins claim: Evolution shaped moral beliefs through natural selection favoring cooperation within groups
  - The indifference claim: Selection cared about survival advantages, not moral truth
  - The contingency claim: Opposite moral truths could have evolved under different pressures
  - The explanatory claim: Evolution fully explains moral beliefs without needing moral facts
  - The empirical claim: Relatedness data confirms the evolutionary mechanism
  - The generalization worry: If this debunks morality, it should debunk math/logic too
  - The alleged refutation: Rejecting math is absurd, so the argument must be flawed

  I notice tension between two versions of the conclusion - the passage flip-flops between "no moral facts" (error theory) and "moral facts are explanatorily redundant" (which could allow for minimal realism). This isn't just the user's confusion; the text does seem inconsistent here.

  Regarding the empirical strength: While kin selection patterns are well-established, the user rightly flags adaptationist overreach risks. The leap from "evolution shaped cooperative behaviors" to "evolution fully determines moral belief content" needs careful handling. Phenotypic plasticity and cultural evolution complicate simple gene-centric stories.

  The arithmetic analogy is indeed weak. Mathematical beliefs have properties moral beliefs lack: intersubjective verifiability, necessary truth, and established justificatory practices independent of origins. The debunker can consistently say evolution gave us useful heuristics for arithmetic, while proof provides current warrant - unlike morality where no comparable verification exists.

  Ultimately, even if we grant evolution fully explains moral beliefs, the nihilist conclusion doesn't strictly follow. One could maintain minimal realism if moral facts are conceived as non-natural, or adopt constructivism where moral truth is constituted by our evolved capacities. The argument's force depends heavily on background metaphysical commitments.
answer: |-
  As a metaethicist, I'll proceed methodically as requested. Let's dissect the passage's core claims, assess their accuracy within professional debates, then evaluate the arithmetic counterargument and your hunches. I'll structure this as: (1) Claims identification, (2) Critical analysis, (3) Assessment of the arithmetic move, (4) Viability of the nihilist conclusion.

  ### 1. Distinct Claims in the Passage
  - **Claim A (Explanatory Origins):** Moral beliefs arose via natural selection to promote cooperation (kin altruism, reciprocal altruism), not because they track moral truths.
  - **Claim B (Evolutionary Indifference):** Selection pressures were indifferent to moral truth; adaptive utility alone explains belief fixation.
  - **Claim C (Counterfactual Contingency):** Had opposite beliefs been adaptive, we'd hold them with equal conviction.
  - **Claim D (Explanatory Exclusion):** Evolutionary psychology fully explains moral beliefs, leaving no role for moral facts in the explanatory chain.
  - **Claim E (Empirical Confirmation):** Kin-selection data (e.g., helping behavior scaling with relatedness) empirically supports the evolutionary account.
  - **Claim F (Nihilist Conclusion):** Therefore, moral facts don't exist (or beliefs don't track them).
  - **Claim G (Self-Defeat Worry):** If evolution debunks morality, it must debunk logic/math (since they're also "useful"), leading to absurdity.

  ### 2. Critical Analysis: What Would Defenders (Street/Joyce) Accept, Simplify, or Reject?
  - **Accepted by Defenders:**  
    - **A & B** are foundational. Joyce/Street argue selection optimizes for fitness, not truth-tracking in ethics.  
    - **C** is key to "contingency" arguments (Street 2006): Moral beliefs aren't robustly aligned with truth.  
    - **D** ("explanatory exclusion") is the core metaethical move. If evolution *sufficiently* explains beliefs, moral facts are otiose (an inference to the best explanation).  
    - **E** is accepted as supporting evidence but isn't strictly necessary—the argument is primarily philosophical.

  - **Simplifications for Lay Audiences:**  
    - **"Evolution made us moral":** Oversimplifies gene-culture coevolution. Defenders acknowledge cultural transmission but argue evolutionary pressures scaffold moral psychology.  
    - **"Strong convictions about loyalty/fairness":** Accurate but reduces nuanced moral diversity. Debunkers address this via "proximate mechanisms" (e.g., emotions like guilt) shaped by ultimate causes.  
    - **"The evolutionary story is empirically confirmed":** Overstates certainty. Kin selection is well-supported, but specific links to *moral belief content* involve inference (though defenders like Joyce cite experimental psychology).

  - **What the Book Gets Wrong (Per Defenders):**  
    - **Tension in Conclusions:** You're right to flag this. Sophisticated debunkers (e.g., Street) often avoid **Claim F** ("no moral facts"). Their target is **realist** moral facts (mind-independent truths). They argue evolution undermines *access* to such facts, but one could adopt non-realism (e.g., constructivism) without nihilism. The book conflates:  
      - *Epistemic claim:* We lack justification for moral beliefs.  
      - *Ontological claim:* Moral facts don't exist.  
      Defenders typically assert the former implies the latter only for robust moral realism.  
    - **"Completely indifferent to actual moral facts":** Assumes realism in the premise, potentially begging the question. Street's formulation avoids this by framing the argument against *realists*: If moral facts existed, evolution wouldn't guide us to them.  
    - **"No moral facts for them to track":** Overreach. Debunkers target *objective* moral facts. Subjectivists or naturalists might argue moral facts reduce to natural properties (e.g., well-being) that evolution *could* track indirectly.

  ### 3. Does the Arithmetic Counterargument Land?
  - **As Presented? No.** The book misrepresents the debunker's resources.  
    - **Debunkers' Reply:** Math/logic have properties morality lacks:  
      - **Necessity & Indispensability:** "2+2=4" couldn't be false without collapsing all cognition; moral truths lack this status.  
      - **Convergence & Independence:** Math beliefs converge cross-culturally *and* can be verified independently of adaptive origins (via proof). Moral beliefs show radical diversity and lack comparable verification.  
      - **Joyce's Distinction:** Math is "useful *because* true" (truth is instrumentally essential). Morality is "useful *regardless* of truth" (fictional beliefs can promote fitness).  
    - **Weakness of the Analogy:** Your hunch is correct. The debunker can grant evolutionary origins for *basic numeracy* but argue that *warrant for math* now derives from proof/coherence, whereas moral beliefs lack analogous ongoing justification.

  ### 4. Does Nihilism Still Follow After Corrections?
  - **Only If:**  
    (i) Moral realism is assumed (facts are mind-independent),  
    (ii) Evolutionary explanation is *complete* (no residue needing moral facts),  
    (iii) No alternative metaethics (e.g., naturalism) survives scrutiny.  
  - **Surviving Claims & Nihilism:**  
    - **A, B, C, D** → Undermine *justification* for moral realism.  
    - **E** → Supports but doesn't guarantee the explanatory story.  
    - **The Gap:** Even if evolution fully explains beliefs, it doesn't *logically entail* nihilism. Alternatives include:  
      - **Naturalist Reduction:** Moral facts = natural facts (e.g., about well-being) that evolution *might* track approximately (e.g., cooperative behavior enhances survival).  
      - **Constructivism:** Moral truths are constituted by our evolved evaluative attitudes (Street's view—evolution explains the framework, but truth is stance-dependent).  
      - **Nihilism Only Follows** if we add premises: e.g., "If beliefs don't track mind-independent truths, no moral facts exist." This requires rejecting all non-realist options.

  ### Your Hunches: Confirmed & Refined
  1. **"Relatedness data is strongest but adaptationist stories are risky":**  
     - **Correct.** Kin selection is robust, but linking it directly to *moral belief content* risks the "adaptationist fallacy." Debunkers mitigate this by focusing on proximate mechanisms (e.g., emotion-driven intuitions) rather than specific norms.  
  2. **"Selection story about behavior vs. judgment content":**  
     - **Crucial point.** Defenders argue that if evolution shapes cognitive *mechanisms* for social behavior, and moral judgments are outputs of those mechanisms, then content is indirectly shaped. Critics (e.g., Wielenberg) retort that evolved biases may still allow truth-tracking in favorable environments.  
  3. **"Arithmetic refutation is weak due to proof-based warrant":**  
     - **Exactly right.** This is the standard rejoinder (e.g., Shafer-Landau). Math has post-origin verification; morality lacks a comparable method.

  ### Conclusion
  The book's summary is **mostly fair** for targeting robust moral realism but **overreaches** in declaring nihilism inevitable and mishandling the self-defeat objection. The arithmetic counterargument **fails** against sophisticated debunking. Nihilism **doesn't strictly follow** from the corrected claims alone—it requires additional premises rejecting non-realist metaethics. Your disciplinary skepticism about "best explanation" claims in evolution is astute and mirrors ongoing philosophical critiques (e.g., from neutral mutation or cultural evolution).
