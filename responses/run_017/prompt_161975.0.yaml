  ### **The Honest Truth**
  **You won't like this, but here it is**: No voting rule is perfect. Arrow’s theorem forces you to accept some unfairness. Your current process (Borda) pretends to be neutral but is easily manipulated. Switching to **Range Voting** buys simplicity and stability but costs nuanced preferences (e.g., "need" scores may not capture who fits the co-op best). If Range Voting feels too reductionist:  
  - **Fallback**: Let the membership coordinator decide (sacrifices non-dictatorship). This is honest, fast, and avoids committee strife, but centralizes power.  
  - **Reality Check**: The ballot is doing less work than you think. The membership coordinator already has power via shortlist control. Range Voting at least makes this visible and testable.  

  **Least Confident Part**: Handling recusals (Step 1). Arrow assumes complete ballots, so any workaround is a compromise. I’m 80% confident in the recommended approach—test it with your data.  

  **Next Steps**:  
  1. Run Tests 1 and 2 on Range Voting using past data.  
  2. Pilot it for one meeting.  
  3. Write the rule into your bylaws per your lawyer’s requirement.
