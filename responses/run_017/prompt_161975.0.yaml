  ### **Recommended Rule: Range Voting (0–10 Scale)**
  - **Why?**  
    - Escapes Arrow’s theorem (uses scores, not rankings).  
    - Passes both failure-mode tests.  
    - Minimizes coordinator power.  
    - Simple: Average scores, rank highest to lowest. Break ties by shortlist order.  
  - **Ballot Structure**:  
    - Each member scores every applicant 0–10 (10 = highest need).  
    - Recusals: Omit score for that applicant; average uses only non-recused scores.  
  - **Example Spreadsheet**:  
    | Applicant | Voter 1 | Voter 2 | ... | Average | Rank |  
    |----------|---------|---------|-----|---------|------|  
    | Alice    | 8       | (recuse)|     | 8.0     | 1    |  
    | Bob      | 6       | 7       |     | 6.5     | 2    |  
    | Decoy    | 0       | 2       |     | 1.0     | 3    |  

