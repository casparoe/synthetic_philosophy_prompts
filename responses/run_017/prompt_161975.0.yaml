answer: |-
  Below is a decision procedure designed to address your committee's challenges, grounded in Arrow's Impossibility Theorem but tailored for practical use. The procedure is structured as a step-by-step audit for selecting or evaluating a voting rule, with clear questions, acceptable answers, failure tests, and handling of edge cases. It directly addresses your concerns about shortlist manipulation, decoy applicants, and partial ballots while respecting your constraints (simplicity, spreadsheet use, no special software, and transparency for non-experts).

  ---

  ### **Arrow's Theorem: Core Problem for Your Committee**
  Arrow's theorem proves that no voting system can satisfy all four conditions simultaneously when converting individual rankings into a group ranking:
  1. **Unrestricted Domain**: Any individual ranking of candidates is allowed.
  2. **Non-Dictatorship**: No single voter always decides the outcome.
  3. **Pareto Efficiency**: If everyone ranks A above B, the group must rank A above B.
  4. **Independence of Irrelevant Alternatives (IIA)**: Adding/removing a "loser" (e.g., a decoy) shouldn't change the relative order of other candidates.

  Your Borda count failure (the decoy changing the outcome) violates IIA. Since you need a complete, tie-free ranking, **you must sacrifice one condition**. The procedure below helps you choose which one to sacrifice and selects a rule that minimizes real-world unfairness.

  ---

  ### **Decision Procedure: Auditing or Choosing a Voting Rule**
  Run this audit when selecting a new rule or reviewing an existing one. Answer each question in order. If a question has a **values call**, the committee must vote on trade-offs. If the answer violates a **hard stop**, the rule is rejected.

  1. **What input can we collect from voters?**  
     - **Acceptable Answer**: "Complete rankings of all shortlisted applicants." (Ideal, per Arrow's assumptions.)  
     - **Partial Ballots/Recusals**:  
       - If members submit incomplete rankings (e.g., top 5 only) or recuse (e.g., due to conflict of interest), you must define how to handle unranked applicants:  
         - **Option 1 (Default)**: Treat unranked applicants as tied *below* all ranked ones. Break ties by the membership coordinator's shortlist order (or random draw).  
         - **Option 2 (Values Call)**: Exclude recused applicants from that voter's ballot entirely. For incomplete rankings, treat unranked applicants as "no opinion" (not ranked at all).  
     - **Hard Stop**: If partial ballots are unavoidable and Option 2 is chosen, the rule may violate Pareto or IIA. Proceed with caution.  
     - **Confidence**: High. Faithful to Arrow's "unrestricted domain" requirement.

  2. **Does the rule produce a complete, tie-free ranking?**  
     - **Acceptable Answer**: "Yes, always." (Required for your cascade offers.)  
     - **Hard Stop**: If "no," reject the rule (e.g., pure Condorcet methods can create cycles).  
     - **Confidence**: High. Matches your core requirement.

  3. **Which Arrow condition are we willing to sacrifice?**  
     - **Values Call**: Trade-offs:  
       - **Sacrifice IIA**: Cheapest. Prevents decoy manipulation but risks strategic voting (e.g., voters misrank to help their favorite).  
       - **Sacrifice Unrestricted Domain**: Restrict ballots to reduce noise (e.g., require complete rankings). Shifts power to the membership coordinator if they filter applicants.  
       - **Sacrifice Non-Dictatorship**: Unacceptable (one person decides).  
       - **Sacrifice Pareto**: Harmful (e.g., if all prefer A > B, but B wins).  
     - **Recommended Sacrifice**: **IIA** (least bad). Your decoy issue is a direct IIA failure; sacrificing it allows robust rules like Range Voting.  
     - **Confidence**: High. Arrow’s theorem forces this trade-off.

  4. **Does the rule pass the two failure-mode tests?**  
     Run these on a spreadsheet using past data (10 minutes max):  
     - **Test 1 (IIA-like Stability)**:  
       - Add a decoy applicant (e.g., one with no income docs) to the shortlist. Re-run the rule.  
       - Remove the top-ranked applicant (as if housed). Re-run the rule on the remaining shortlist.  
       - **Pass**: Relative order of original applicants is unchanged in both cases.  
     - **Test 2 (No Self-Harm / Participation)**:  
       - Take one voter’s ballot. Move their top choice higher. Re-run the rule.  
       - Remove that voter’s ballot entirely (simulate abstention). Re-run the rule.  
       - **Pass**: (1) Their top choice doesn’t drop in the group ranking; (2) Their top choice doesn’t rise when they abstain.  
     - **Hard Stop**: If the rule fails either test, reject it.  
     - **Confidence**: High. Tests operationalize IIA and monotonicity.

  5. **Can the membership coordinator sway outcomes via shortlist composition?**  
     - **Acceptable Answer**: "No, or minimally."  
     - **Test**: Using past data, add/remove a realistic "weak" applicant (e.g., incomplete application). If the coordinator can flip the winner, the rule is vulnerable.  
     - **Values Call**: If vulnerable, is this acceptable? If not, prioritize rules that pass Test 1.  
     - **Confidence**: Medium. Shortlist power is an indirect IIA issue.

  6. **Is the rule simple enough?**  
     - **Acceptable Answer**: "Explainable in 5 minutes, computable in a spreadsheet."  
     - **Hard Stop**: If "no," reject (e.g., complex Condorcet methods).  
     - **Confidence**: High. Practical constraint.

  ---

  ### **Handling Partial Ballots and Recusals**
  - **Recusals**: If a voter knows an applicant, they omit them from their ranking/score. In aggregation:  
    - For **ranking-based rules** (e.g., Borda), treat unranked applicants as tied at the bottom.  
    - For **scoring rules** (e.g., 0–10 scale), exclude the recused voter’s score for that applicant.  
  - **Incomplete Rankings**: If a voter only ranks top 5:  
    - Treat unranked applicants as tied below the lowest ranked.  
  - **Why?** Prevents strategic recusals and minimizes noise. Breaks Arrow’s "unrestricted domain" slightly, but practicality justifies it.

  ---

  ### **Where the Procedure Can't Give an Answer**
  - **No Rule Passes All Tests**: If all candidate rules fail Tests 1 or 2, you must either:  
    - Accept that your process will be vulnerable to manipulation (e.g., coordinator power or decoys), or  
    - Abandon ranked voting entirely (e.g., let one person decide).  
  - **Values Disagreement**: If the committee disputes which Arrow condition to sacrifice (Step 3), no rule will satisfy everyone.  

  ---

  ### **Analysis of Your Cases**
  #### **Case (a): Borda Count with Decoy Applicant**
  - **Procedure Audit**:  
    1. Input: Complete rankings (assumed).  
    2. Complete ranking: Yes.  
    3. Sacrifice: IIA (implicitly).  
    4. Test 1: **Fails** (decoy changed ranking). Test 2: Passes (Borda is monotonic).  
    5. Coordinator power: High (adding a decoy changed outcome).  
    6. Simplicity: High.  
  - **Verdict**: **Reject Borda**. It fails Test 1, enabling coordinator manipulation.  

  #### **Case (b): Two Units Free at Once**
  - **Options**:  
    - **Option A**: Take top two from the original ranking.  
    - **Option B**: Re-run the ballot with the remaining applicants.  
  - **Procedure Audit**:  
    - **Test 1 (Removal Stability)**:  
      - For Borda: Option A fails (removing the winner changes others’ scores). Option B passes but is inefficient.  
      - For Range Voting (0–10): Option A passes (scores are absolute).  
    - **Recommendation**: Use **Option A with Range Voting**. No re-vote needed, and Test 1 passes.  

  #### **Case (c): 0–10 "Housing Need" Scale (Range Voting)**
  - **Procedure Audit**:  
    1. Input: Scores (not rankings), so Arrow doesn’t apply directly.  
    2. Complete ranking: Yes (rank by average score).  
    3. Sacrifice: Not applicable (cardinal voting escapes Arrow).  
    4. Test 1: **Passes** (adding/removing a low-score applicant doesn’t change others’ averages).  
       Test 2: **Passes** (increasing your score for an applicant can’t hurt them; abstaining can’t help your favorite).  
    5. Coordinator power: Low (adding a weak applicant won’t sway others).  
    6. Simplicity: High (average scores in a spreadsheet).  
  - **Costs**:  
    - **Not a true ranking**: Measures perceived "need," not preferences. May not reflect voter intensity (e.g., a 10 vs. 8 vote).  
    - **Scale interpretation**: Voters may score differently (e.g., one’s "5" is another’s "7").  
    - **Strategy risk**: Voters might exaggerate (e.g., score their favorite 10, others 0).  
  - **Verdict**: **Recommend Range Voting**. It dodges Arrow by using cardinal scores, passes both tests, and is simple. The cost is potential exaggeration and loss of ordinal preferences.  

