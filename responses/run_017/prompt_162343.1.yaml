prompt: |-
  So I got voluntold to run Friday's methods hour in my lab — 45 minutes, maybe twelve people, mostly computational but a few wet-lab folks, all of whom say "Bayesian" to mean "we put a prior on a parameter and updated it" and most of whom have personally written down a likelihood at some point. Topic I picked is the problem of old evidence: the argument that if you already knew E with certainty before a new theory came along, then Bayes' rule can't let E confirm that theory, because P(E) is 1 and the posterior just collapses back onto the prior. Don't explain it to me — I need a plan for how I explain it to them, and I think the order matters more than anything else here.

  What I want from you:

  - What has to be on the table before the problem even looks like a problem. I suspect it's something about the difference between the theory entailing E and my having learned that it entails E, but tell me where in the sequence that belongs and what has to come before it.
  - One carrying example. I don't want the perihelion-of-Mercury chestnut with this crowd; I want something from their own work. We have a result that's been sitting in our own data for about six years, everyone in the field already believes it, nobody has had a mechanism for it — and we also have a rival model that was fitted to that same result after the fact. Tell me which of those two cases to build the whole thing on, and what the example has to have and has to lack in order to do the work. I think one requirement is that the new hypothesis wasn't built to fit the evidence, and another is that the old theory doesn't entail it, but I'm not sure either is quite right.
  - The misconceptions, in the order they'll actually raise them. The ones I'm braced for: "just pretend you forgot the evidence and put a number on it"; "the real fix is that prediction beats accommodation, so all this shows is that accommodation doesn't confirm" (which I think is a dodge rather than a solution?); "our priors already had it baked in, so nothing is lost"; "we'd just compare Bayes factors". Where in the sequence do I head each one off, and is there one I should let them say out loud first because it sets up the next move?
  - What the two live candidate fixes actually are and how much of each to give at this level. One of them, as I understand it, updates on the fact that the theory implies the evidence rather than on the evidence itself; the other is some kind of counterfactual "what would you have assigned before you knew it". Which do I lead with for this crowd, which do I name and drop, and what do I flat out refuse to derive in 45 minutes.
  - One question for the end that tells me whether they actually got it rather than just nodded — ideally something they'd answer differently if they're still stuck on "unlearn the evidence".

  Constraints: nothing on a slide worse than a fraction, and please don't hand me a reading list, nobody will read it. Also assume half of them are checking email and one person is going to try to turn this into a discussion about p-values if I give him an opening.
reasoning: |-
  Okay, the user is preparing a 45-minute methods hour on the "problem of old evidence" for a mixed computational/wet-lab audience. They need a tactical plan to make Bayesian epistemology concrete for practitioners who've actually written likelihoods but may not dwell on philosophical nuances. 

  First, let's unpack their constraints: The audience thinks "Bayesian = prior + update", the example must avoid Mercury's perihelion, and they'll face classic dodges like "just pretend you forgot". Half will multitask, one will derail into p-values. No slides with math denser than fractions, no reading lists. 

  Hmm... their core ask is sequencing. The problem only bites when you distinguish three layers: (1) theory T entailing E, (2) me knowing E, and (3) me learning that T entails E. Most practitioners collapse (1) and (3). I should anchor this early with their six-year-old dataset example – specifically the rival model fitted post-hoc to existing data. That model wasn't built for E, yet E can't confirm it via Bayes because P(E)=1. Perfect. 

  For misconceptions: "unlearn the evidence" must die first. It's seductive but wrong – you can't genuinely forget. Let someone suggest it, then have the group poke holes: "If you 'forget' E, what prior do you assign? Your knowledge contaminates it." This sets up the key insight: updating on T→E is the real fix. Save "prediction vs accommodation" for last – it's a related but separate issue. 

  Fix-wise: focus on the "learned T implies E" update. Derive P(T|T→E) not P(T|E). Show the ratio form: [P(T→E|T)/P(T→E)] * P(T). For this crowd, skip counterfactual priors entirely – too messy. 

  Final litmus test: "Your model predicts E, which we've known for years. Does that prediction mean anything?" If they say "no, it's old news", they're stuck in unlearning. If they say "yes, because now we see the mechanism fits", they get it. 

  ...Better warn about the p-values guy. Prepare a shutdown: "Interesting! But today's about how Bayes handles accommodated evidence – want to discuss NHST over coffee?"
answer: |-
  Here's a battle-tested plan for your 45-minute session. Sequence is critical—we'll build tension before revealing the problem, then dismantle misconceptions in order.

  ---

  ### **1. Setup: What MUST Be Understood First (10 mins)**
  - **Start with Bayes' Rule**: Put this on the board:  
    \( P(T|E) = \frac{P(E|T) \cdot P(T)}{P(E)} \)  
    Remind them: \( P(E|T) \) is probability of evidence *if T is true*, **not** "after T was proposed."  
  - **Key Distinction**:  
    "When does \( P(E) \) get fixed? When you *condition on what you know* **before evaluating T**. If E is already known, \( P(E) = 1 \)."  
  - **Consequence**:  
    If \( P(E) = 1 \), then \( P(T|E) = P(T) \) → **E can’t confirm T**.  
  - **Why this feels wrong**:  
    "We *do* feel like old evidence supports new theories. Contradiction? That’s the problem."  

  ---

  ### **2. Your Lab’s Carrying Example (Use the Rival Model!) (5 mins)**
  **The Setup**:  
  *"Recall our 6-year-old result E (e.g., 'gene X correlates with outcome Y'). Everyone believes E. Now, a new mechanistic theory T is proposed—it wasn’t designed to fit E, but we later realize T implies E. Does E support T?"*  

  **Why this works**:  
  - E is **old** (known with certainty → \( P(E) = 1 \)).  
  - T **wasn’t built for E** (so not just curve-fitting).  
  - T **entails E** (so \( P(E|T) ≈ 1 \)).  
  - **Crucial gap**: Everyone knows E, but they *didn’t know* that T implies E until now.  

  ---

  ### **3. Sequence of Attack: Misconceptions & Their Refutations (20 mins)**
  **Let them raise these—but guide order by asking targeted questions:**  

  | Misconception | When to Address | How to Refute |
  |---------------|----------------|---------------|
  | **"Just forget E!"** | Let it surface first (someone *will* say it). | "Can you *truly* forget E? Your prior for other theories still reflects E. If you ‘pretend’ E is unknown, what’s your *actual* P(E)? It’s contaminated." |
  | **"Priors already bake in E!"** | After "forget E". | "If priors account for E, why would T *need* confirmation by E? The problem asks: *when T is new*, does E support it? If E is baked in, T gets no boost." |
  | **"Bayes factors fix this"** | After priors. | "BF = P(E\|T)/P(E\|¬T). But if P(E)=1, both terms =1 → BF=1. No update. Same issue." |
  | **"Accommodation ≠ prediction!"** | Last (it’s a dodge). | "True, but that avoids the problem. The question isn’t *why* prediction is better—it’s *how can any confirmation happen* if P(E)=1?" |

  ---

  ### **4. Candidate Fixes: Focus on ONE (10 mins)**
  **Lead with the philosophically robust fix** (skip counterfactuals—they lead back to "forgetting"):  
  - **Update on Learning "T → E"**:  
    "When T arrives, you learn *that T entails E*. Update on *this discovery*, not on E itself."  
    New evidence is **I** = "T implies E" (not E).  
    Then: \( P(T|I) = \frac{P(I|T) \cdot P(T)}{P(I)} \)  
    - \( P(I|T) ≈ 1 \) (if T is true, it should imply E)  
    - \( P(I) \) is **not** 1! (Before T, did you expect *any* theory to imply E? Probably not.)  
  - **Intuition pump**:  
    "Before T, did you think E *had* to follow from *some* theory? If E was puzzling (no mechanism), P(I) is low → big update for T."  

  **Name-drop & dismiss counterfactuals**:  
  - "Some say: ‘What would P(E) be if you didn’t know E?’ But that’s imaginary—we *know* E. Stick with what’s actual."  

  ---

  ### **5. Litmus Test Question (End with this)**
  > **"Your new model T predicts E, which we’ve known for 6 years. Does the fact that *T implies E* (and no prior theory did) tell us anything? If yes, *what* did we update on?"**  

  - **Correct answer**: We updated on learning **"T → E"** (not E itself).  
  - **Wrong answer**: "We updated on E after pretending we didn’t know it."  
  - **Why it works**: Forces them to articulate the object of update. If they say "unlearn E," they missed the core.  

  ---

  ### **Tactical Notes**
  - **Slides**: Only show fractions (Bayes’ rule, update on I). No derivations.  
  - **p-values troll**: Shut down gently: "That’s a different debate—today’s about how *Bayesian confirmation* handles old evidence."  
  - **Email-checkers**: Hook them with the lab example first.  
  - **Why this sequence works**: Lets the problem crystallize *before* solutions, uses their intuition against them ("forget E!"), and pivots to a fix that respects actual knowledge.  

  You’ve got this—they’ll feel the tension, then the relief.
