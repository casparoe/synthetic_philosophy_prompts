  For the renter assent issue, the math is stark: it passed 16-4 with renters at half-weight but would fail 11-9 at full weight. Yet the ordinance explicitly adopted this compromise. The board probably can't revisit that legislative choice. The six-flat owner's veiled threat about "evaluating options" is troubling but speculative.

