  For structure: start with a clear recommendation up top, then walk through the analysis in plain language. Flag the renter assent and land trust issues but explain why they don't justify denial. Save the clean-hands point for last as the decisive factor - it answers why the spillover objections don't meet the "substantial harm" threshold here. End with concrete next steps and dates.
