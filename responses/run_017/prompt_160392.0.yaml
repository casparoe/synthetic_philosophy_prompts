  **DRAFT OPINION: BOARD OF ZONING ADJUSTMENT**  
  **Re: Petition for Rezoning to R-4, East Block Face of Halsey St. (4th to 5th St.)**  
  **Hearing Date: July 12**  
  **Member: [Your Name]**  

  **RECOMMENDATION: GRANT THE PETITION WITHOUT CONDITIONS.**  
  **Deadline for City Staff to Issue Revised Zoning Certificates: July 25, 2024.**  

  ---

  ### **I. Summary of the Petition & Requirements Met**
  The petition seeks R-4 zoning (fourplexes by right) for 20 parcels on the east block face of Halsey St. It satisfies all technical requirements of the Block Choice Ordinance ("little local option"):  
  - **Ownership Threshold:** 14 of 20 parcel owners (70%) signed, exceeding the 60% requirement.  
  - **Resident Assent:** The vote passed 16–4 under the ordinance’s rules (renters weighted at 0.5 households).  
  - **No Legal Disqualifiers:** The petition is procedurally valid.  

  The Board must grant the petition unless the rezoning would cause **"substantial harm to the distinctive interests of households outside the petitioning block face."**  

  ---

  ### **II. Opposition Arguments & Analysis**  
  **A. The "Spillover" Objection (Rowan Street Association):**  
  Opponents argue that impacts on street parking, school enrollment (currently 102% capacity), and combined sewer loads will harm neighboring streets. They assert the "block face" unit is undemocratic because affected outsiders have no vote.  

  *Why this does not meet the "substantial harm" standard:*  
  1. **Speculative Severity:** Parking and sewer impacts are common in densifying cities and lack evidence of *substantial*, unique harm to Rowan Street. School capacity is a citywide issue managed by the district, not zoning.  
  2. **Ordinance Design:** The Council intentionally chose the "block face" as the voting unit, accepting inherent spillover risks. Overturning this would negate the ordinance’s purpose.  
  3. **Mitigation Exists:** Parking permits, school redistricting, and sewer upgrades are policy tools *outside* this Board’s authority. Denial here punishes one block for systemic issues.  

  **B. The "Renter Assent" Problem:**  
  The resident vote would have failed 11–9 if renters counted fully. Three dissenting renters in the six-flat face potential displacement if their landlord redevelops.  

  *Why this does not justify denial:*  
  1. **Legislative Compromise:** The half-weight rule was expressly adopted by the Council. We cannot reinterpret it post-hoc.  
  2. **No Relocation Mandate:** The ordinance lacks relocation assistance provisions. Adding conditions would exceed our authority.  
  3. **Future Protection:** If displacement occurs, tenant protection laws or future Council action—not zoning denial—are the remedies.  

  **C. Land Trust Financing Uncertainty:**  
  The community land trust fears the 3-year re-petition window undermines financing.  

  *Why no conditions can be added:*  
  The ordinance explicitly allows re-petition in 2028. We lack authority to "vest" zoning or extend durability. This is a flaw in the ordinance itself, not grounds for denial.  

  ---

  ### **III. The Deciding Factor: Objector Consistency & the Public Interest**  
  The Rowan Street Association’s blanket opposition to *all* upzoning for six years—including projects with no impact on their neighborhood—undermines their claim of unique "substantial harm" here. Their appeal killed a 40-unit project last year, directly contradicting their argument that housing must be built only where "all affected" consent. A group systematically exporting housing burdens to others cannot suddenly demand veto power when proximity shifts.  

  **Concession:** Their parking and sewer concerns are valid *in general* but not *distinctive* or *substantial* enough to override the petition. The Council should study block-face impacts, but that is not our role today.  

  **Crucially, the $11M state grant** requires demonstrating added housing capacity by June 30. Staff confirm this rezoning is the only viable path to secure funding for critical infrastructure. Denial risks public funds for the entire city.  

  ---

  ### **IV. Bottom Line & Order**  
  - **GRANT the petition** as submitted. The standard for "substantial harm" is not met.  
  - **No conditions added.** We lack authority to modify the ordinance’s terms (e.g., vesting, relocation).  
  - **Direct staff** to issue revised zoning certificates by **July 25, 2024**, ensuring permit applications for new units can meet the state’s June 30 grant deadline.  

  ---

  ### **If We Denied: The Strongest Counterarguments**  
  *(Included per your request—but this is NOT my recommendation)*  
  If denying, the core rationale would be: **"The spillover impacts on parking, schools, and sewers—combined with the razor-thin resident assent that failed under full renter weighting—create substantial harm to Rowan Street’s distinctive quality of life. The block-face unit is fundamentally ill-suited for decisions exporting costs to immediate neighbors. The $11M grant deadline, while urgent, cannot override statutory harm findings."**  
  *Concession:* The Rowan Association’s hypocrisy weakens moral standing, but legally, their current impacts are tangible. The grant loss would be catastrophic, but the ordinance’s "harm" test may not accommodate expediency.  

  ---

  **Final Judgment for July 12 Hearing:**  
  The petition complies with the ordinance, and opponents fail to prove "substantial harm to distinctive interests." Granting advances housing opportunity, honors the Council’s intent, and secures vital public funds. The opposition’s history of obstruction further tips the scale toward approval. **GRANT UNCONDITIONALLY.**  

  ---  
  *[End of Draft — 2 pages]*
