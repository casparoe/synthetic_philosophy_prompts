  I need to provide precise translations while respecting the constraints of their generative modeling framework. For the replicator-interactor distinction, I'll frame replicators as latent codes and interactors as generated outputs. For the memetics vs. attraction theory debate, I'll highlight how they differ on whether cultural transmission involves copying latent variables or reconstructing outputs. For transmission biases, I'll map them to proposal distributions and guided variation to generator fine-tuning.

