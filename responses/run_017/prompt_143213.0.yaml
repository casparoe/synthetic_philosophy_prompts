answer: |-
  1.  **Replicator-interactor distinction:** In your terms, a replicator is a latent variable (e.g., a prompt embedding or a specific noise trajectory seed) that, when decoded/sampled, reliably produces similar outputs (interactors) across multiple runs, assuming a stable generator model; the interactor is the specific generated output instance. Memetics insists such stable latent codes exist, while attraction theory argues outputs are directly reconstructed from previous outputs without persistent latent codes.
  2.  **Memetics vs. Attraction disagreement:** They fundamentally disagree on whether transmission involves *copying a latent code* (memetics: sampling from a high-fidelity conditional distribution defined by the replicator, like low-temperature ancestral sampling) or *reconstructing an output* (attraction: running the full generation process conditioned on an observed output, introducing the attractor dynamics of the denoiser/sampler itself).
  3.  **Transmission biases & guided variation:** Transmission biases (e.g., content bias, prestige bias) map to *conditioning inputs or proposal distributions* that skew the sampling process away from the base model's output distribution. Guided variation maps to *fine-tuning the generator model* (e.g., via LoRA or adapter layers) based on individual experience *before* transmission/sampling.
  4.  **Untranslatable elements & fidelity threshold:** The core untranslatable is *selection pressure/fitness differential* independent of the transmission/generation mechanism itself. In culture, differential spread *is* the observable outcome of the combined transmission/generation process; your framework has no analogue for an external "loss function" or "objective" driving selection *across* variants. The *fidelity threshold for cumulative culture* has no direct expression because it requires the concept of *cumulative adaptive change preserved across generations*, which relies on replicator persistence *and* external selection – concepts your generative process lacks.
  5.  **Residue verdict & synthetic-data mapping:** The residue (fitness, selection, fidelity threshold) reveals a genuine conceptual gap in your vocabulary for modelling *open-ended adaptation driven by differential success in an external environment*; it's not just linguistic. Your synthetic-data mapping powerfully captures *distribution collapse* from iterative transmission noise/attractors, but it inherently *lacks* the core Darwinian element of *directional selection pressure* from an external environment, making it a partial but substantive analogy, not merely a pun.
