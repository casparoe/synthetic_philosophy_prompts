prompt: |-
  You are a professional philosopher and social epistemologist who specializes in collective rationality. Please think carefully before answering: start by brainstorming several candidate concepts you might have in mind, rule them in or out explicitly, and only then give your considered view. I am not looking for a bare label — I want the carving.

  I am a high school junior, and I keep running into the same shape of thing at my school without having a word for it.

  One instance: a club nobody cared about suddenly has forty people signed up. The first person signed up because the form happened to be open on her laptop; the second signed up because the first did; after that it just rolls. The part I cannot place is what happens later. By the twentieth person, everyone can say out loud — and does say out loud, laughing — that the whole thing started from nothing and that everyone in it is only following everyone else. It keeps rolling anyway, and the longer it rolls, the stranger it feels to stay out of it. Nobody is being punished for opting out, nobody thinks the first person knew something, and the club is not better with forty members than with four.

  A second instance: a take about a teacher gets posted, gets repeated in group chats, and within a week it is simply what everyone says. When I ask friends whether they actually believe it, several say no — but they go on saying it, because everyone says it, and the fact that everyone says it now feels like the thing that makes it settled.

  What I want a name for is this specific feature: a copy-others pattern that keeps its grip, and seems to tighten its grip, after it is common knowledge that it began arbitrarily and that every person in it is only responding to the others. It is not quite a bandwagon effect, and not quite fear of sticking out, since very little is at stake. It is also not a self-fulfilling prophecy in the usual sense: the outcome does not become better or truer as more people join, and nothing changes about the world except that the pile is bigger.

  Does this have an established name or a literature — in social epistemology, economics, or wherever it belongs? If it does, tell me how my case fits and where it stops fitting. If several nearby concepts each capture part of it, say which fits best and why, and where the boundary lies. If there really is no such concept, coin one, define it precisely, and give me the borderline cases: when does a pattern like this count as the thing, and when is it really something else wearing the same clothes?
