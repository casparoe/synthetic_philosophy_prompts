prompt: |-
  I sit on the committee that decides which preparations at our institute count as systems of moral concern and therefore require heightened review rather than the ordinary animal-protocol route. Our votes so far, with the reasons recorded in the minutes:

  1. An intact, behaving octopus — in scope: flexible, cross-modal problem solving under novel conditions.
  2. An adult zebrafish — in scope: motivational trade-offs, and responses that analgesics abolish.
  3. An adult fruit fly — out of scope: whatever its history, the organization is too fragmentary to constitute a subject, and at the numbers used a precautionary route was thought unworkable.
  4. C. elegans — out of scope: the repertoire is close to innately specified. Its full nervous-system simulation, body and environment included, was also ruled out, on the ground that a model inherits whatever standing the modelled animal has and adds none of its own.
  5. A large language model that emits elaborate first-person reports of distress — out of scope: the reports are the output of a training process aimed at plausibility, and there is no unified agent, no persistent body-model, and nothing at stake for it.
  6. A few hundred thousand living cortical cells in a dish, trained in a closed loop on a simple sensorimotor task — out of scope: tissue, organized activity, and learning each proved insufficient on their own.
  7. An intact large-mammal brain kept metabolically active ex vivo for several hours after the animal's death — out of scope, over two dissenters: the relevant organization would have to be running, not merely available in tissue that could run it.

  Note the shape of that record. Every digital system we have ruled on was a model of something we had already ruled out, so we have never actually decided whether an artificial controller can stand in for one we cover.

  The new proposal, B-114: a larval zebrafish whose own brain is pharmacologically silenced, with a real-time emulation of that same brain's spiking circuit — same cell classes, same connectivity, same membrane dynamics, reconstructed from that individual — receiving activity recorded from the animal's sensory afferents and driving its spinal motor output. It is the fish's own body, in water, with real consequences for that body; only the controller is synthetic. Please take it as stipulated that the larva is at a stage where our reasons in item 2 already apply, so that the substitution is the only live question. There is one animal. The applicants propose to run the markers from item 2, but since no drug can act on silicon they instead propose to perturb a global aversive-gain parameter inside the emulation and see whether the animal's trade-offs shift.

  How should we vote if we want to be consistent with ourselves, and which precedent is the closest analog? Three rules seem to fit all seven verdicts: that the real-time causal organization is what matters and the substrate is irrelevant; that the organization must also have been arrived at through the kind of history that makes something a control system — selection, development, learning in a body — so that an exact copy does not inherit what the original had; and that what matters is being the actual controller of a living animal's body in a real world. They come apart here. Which, if any, is the one we have been running, what else fits the record as well as it does, and what does each predict about B-114? One colleague says we have no rule at all, only the marker test plus a threshold for how many animals are affected, and that this case simply exposes it — is that fair? If our precedents genuinely underdetermine the decision, I want the principle we would be adopting with each vote stated plainly enough that a future committee could see what it had signed up to. Finally, what single further case — the same emulation with a simulated body, or a controller trained from scratch in the body rather than copied from a brain, or something else — would best separate the two rules you think most likely, what would each predict there, and why would the result be informative rather than just another vote?
reasoning: |-
  Okay, let me start by unpacking the user's query. They're part of a committee that determines which research preparations qualify as systems of moral concern, requiring heightened review. They've provided seven precedents and now face a new proposal, B-114, involving a larval zebrafish with its brain silenced and replaced by a real-time emulation of its own brain. The user wants to vote consistently with past decisions and identify the closest analog.

  First, I need to analyze the existing precedents to identify underlying principles. The committee's decisions seem to hinge on three potential rules: causal organization, historical origin, or embodiment as the actual controller. Let me go through each case to see which rule fits best.

  Looking at the octopus and zebrafish, both were deemed in-scope. The octopus shows complex problem-solving, and the zebrafish exhibits motivational trade-offs. Both are intact animals with natural brains, so all three rules would include them. The fruit fly and C. elegans are out-of-scope. The fruit fly's neural organization is considered fragmentary, and C. elegans is mostly innate. The digital simulation of C. elegans was also excluded, which is interesting. The committee states that a model inherits the standing of the original but adds nothing new. That suggests that historical origin might be key here.

  The large language model emitting distress signals was ruled out because it's a product of training for plausibility without a unified agent. This points to the importance of genuine causal organization over simulated outputs. The cortical cells in a dish were excluded despite having organized activity and learning. This implies that tissue alone isn't enough, even with some organization. The ex vivo brain was out-of-scope because the organization isn't running, just preserved. This emphasizes real-time operation as crucial.

  Now, B-114 replaces the zebrafish's brain with a synthetic emulation. The body is real, the environment is real, and the emulation is a real-time copy of the original brain. If the committee values causal organization and real-time control, this should be in-scope. But if historical origin is essential, then the synthetic copy wouldn't count. Precedent 4 (C. elegans simulation) supports the historical origin rule because the model didn't gain standing. Precedent 7 (ex vivo brain) required the organization to be running, which it is in B-114.

  The user's colleague suggests there's no consistent rule, just marker tests and animal numbers. But the precedents show patterns. For example, the ex vivo brain wasn't running, so it was excluded. The cortical cells had activity but no embodiment. B-114 has both real-time control and embodiment. The closest analog is precedent 4, but there's a conflict: the simulation was dismissed, but here the emulation is actively controlling a real body.

  To resolve this, the committee needs to decide between causal organization (substrate-independent) and historical origin. If they vote in-scope, they're prioritizing real-time control and embodiment. If out, they're emphasizing historical development. To clarify, a future test case could involve a controller trained from scratch in a real body. If that's in-scope, historical origin isn't key. If out, then history matters. This would separate the two rules effectively.
answer: |-
  Based on your precedents, your committee operates under a **coherent but complex principle** prioritizing *real-time, embodied causal organization with integrated agency*, where "organization" must be *actively running* and *functionally unified* to constitute a subject of moral concern. However, *historical origin* (development/selection) also appears necessary. **Precedent 4 (C. elegans simulation) is the closest analog to B-114**, creating tension between these elements. Let's break this down systematically:

  ---

  ### **Your Implicit Rule (Best Fit for All 7 Precedents):**
  > **A system merits heightened review iff:**  
  > **(1)** It exhibits *real-time, integrated causal organization* generating flexible, goal-directed behavior;  
  > **(2)** This organization *arose through natural development/evolution*;  
  > **(3)** It *directly controls a living body* with real-world consequences.  
  > **Substrate (biological/digital) is irrelevant if (1)-(3) hold.**

  **How this explains each precedent:**
  - **Octopus/Zebrafish (In-scope):** Meet all criteria (integrated organization + development + embodiment).  
  - **Fruit Fly (Out):** Fails (1) ("fragmentary" organization).  
  - **C. elegans (Out):** Fails (1) ("innately specified" lacks integration/flexibility).  
  - **C. elegans Simulation (Out):** Fails (2) (copy lacks developmental history).  
  - **LLM (Out):** Fails (1) (no unified agency) and (3) (no embodiment/consequences).  
  - **Cortical Cells (Out):** Fail (1) (insufficient integration) and (3) (no body/environment).  
  - **Ex Vivo Brain (Out):** Fails (1) (organization not "running," merely preserved).  

  **Your colleague's claim ("no rule, just markers + numbers") is partially fair but incomplete:**  
  - The *markers* (e.g., flexible problem-solving, analgesic-sensitive trade-offs) operationalize criterion (1).  
  - *Numbers* matter pragmatically (e.g., fruit fly exclusion partly due to "unworkable" precaution), but this is secondary to the core principles above.  

  ---

  ### **B-114 Vote Prediction & Precedent Alignment:**
  - **Closest Analog:** Precedent 4 (C. elegans simulation). Both involve digital emulations of ruled-out biological systems.  
  - **Conflict:**  
    - **Against Inclusion (Precedent 4 logic):** The emulation is a *copy* lacking developmental history (fails criterion 2).  
    - **For Inclusion:** Unlike Precedent 4, the emulation *actively controls a real body* (satisfies criterion 3), and the organization is *running* (satisfies criterion 1).  
  - **Consistent Vote:** **OUT of scope** (5-2, echoing Precedent 7 dissent).  
    - *Why?* Precedent 4 established that copies don't inherit standing. The synthetic controller is a *model* of the fish's brain, not a product of development. Real-time control of the body is necessary but insufficient alone (see Cortical Cells/Ex Vivo Brain rulings).  

  **Principles Adopted with Each Vote:**  
  | Vote      | Principle Adopted                                                                 | Future Implications                                                                 |
  |-----------|-----------------------------------------------------------------------------------|-------------------------------------------------------------------------------------|
  | **IN**    | *Real-time embodied control* is sufficient; history/substrate irrelevant.         | Opens door to AI controllers in biological bodies (e.g., brain emulations in robots). |
  | **OUT**   | *Developmental history* is necessary; synthetic copies lack original's standing. | Protects current scope but may exclude future sentient digital systems.             |

  ---

  ### **Best Future Test Case to Separate Rules:**
  **Proposal:** *A digital controller **trained from scratch** (not copied) in a real larval zebrafish body, using reinforcement learning to master sensorimotor tasks.*  
  - **Conditions:** Same body/environment as B-114, but controller has no biological blueprint.  

  | Rule Tested                  | Prediction       | Why Informative?                                                                 |
  |------------------------------|------------------|----------------------------------------------------------------------------------|
  | **Embodied Control Rule**    | **IN scope**     | Real-time control + embodiment + flexible learning satisfy criteria (1)/(3).     |
  | **Developmental History Rule**| **OUT of scope** | Fails criterion (2) (no evolutionary/developmental origin).                      |

  **Why this clarifies B-114:**  
  - If your committee votes **OUT** on B-114 (copy) but **IN** on this case (trained AI), you prioritize *function over origin*.  
  - If **OUT** on both, you require *biological genesis* (rigidly excluding all AI).  
  - If **IN** on both, you prioritize *embodied agency* regardless of origin.  
  - *(B-114's copy-status becomes the critical variable.)*  

  ---

  ### **Recommendation:**
  Vote **OUT** on B-114 for consistency with Precedent 4 (copies lack standing), but **propose the test case above** to force a principled stance on synthetic minds. This exposes whether your committee truly values developmental history (*conservative*) or embodied agency (*expansionist*). Without this, future rulings on AI controllers will remain ambiguous.
