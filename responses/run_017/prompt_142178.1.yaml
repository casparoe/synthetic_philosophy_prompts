prompt: |-
  I co-teach an undergraduate seminar on virtue ethics, and this term we spent two sessions on the situationist critique — the family of arguments, built on the obedience experiments, the bystander studies, the seminary-student-in-a-hurry study, the dime-left-in-a-phone-booth study and their successors, which conclude that ordinary people lack the robust, cross-situationally stable character traits that virtue ethics needs. The students left with the impression that this is one blanket result that hits every virtue equally hard, and I think that is wrong, but I have not found a way to make the difference precise. So I want numbers, not discussion.

  Below is a list of traits. For each, give me a score from 0 to 100 — call it a robustness score — meaning: taking the critique's empirical claims entirely at face value, and bracketing both the reply that appeals to practical wisdom and the reply that simply redefines the trait as a narrow, local one, how much confidence should a virtue ethicist retain that a typical adult in a contemporary society possesses this trait as a genuinely cross-situationally stable disposition? Then sort the traits into three or four tiers, and give one sentence per trait naming what drives its placement. I have two candidate explanations for why the scores should differ, and I would like you to use them as the spine of the ranking unless you think one of them is backwards, in which case say so and rank on better grounds: (1) opportunity density — a trait should be more stable across a life the more often, and the more variously, ordinary circumstances present occasions to exercise it, since frequent and varied practice is what consolidates anything into a disposition; (2) cue-concordance — a trait should be more stable when the situational cue that prompts it is reliably present on exactly the occasions when the trait is called for, as opposed to traits whose eliciting cue and whose occasion of application come apart.

  The traits: truthfulness in speech; compassionate helping of a stranger in visible distress; physical courage under threat of harm; fidelity to costly promises; gratitude; humility about one's own accomplishments; temperance with everyday pleasures; fairness in dividing resources with strangers; loyalty to a friend when the association is costly; playful ease in conversation (the trait Aristotle discusses under the heading of wittiness); and punctuality, which is deliberately not on the classical list of virtues. Two further constraints. First, if you are tempted to give some trait a high score for a reason that should embarrass a virtue ethicist — because it is a social script or an unthinking habit rather than a disposition the agent has made her own — flag that explicitly instead of quietly awarding the points. Second, tell me honestly whether the finished ranking is measuring which traits are robust or merely which traits psychologists happened to run experiments on, and if there is a way to tell those two hypotheses apart, say what it is. I will put the tier list on the handout, so the one-sentence justifications matter as much as the numbers.
reasoning: |-
  Okay, the user is teaching a seminar on virtue ethics and wants to quantify how robust different virtues are against the situationist critique. They need scores from 0 to 100 for each trait, sorted into tiers, with one-sentence explanations. The key drivers should be opportunity density and cue-concordance. Also, they want to know if the scores reflect true robustness or just experimental availability.

  First, let's list the traits: truthfulness, compassionate helping, physical courage, fidelity, gratitude, humility, temperance, fairness, loyalty, playful ease, punctuality. The user mentioned two factors: opportunity density (how often and varied the opportunities to practice the trait are) and cue-concordance (whether situational cues align with when the trait is needed). 

  Starting with truthfulness. People have many daily opportunities to lie or tell the truth in various contexts—work, social, etc. The cues (being asked a question) usually align with the need for truthfulness. So high opportunity density and strong cue-concordance. Score around 85.

  Compassionate helping: Opportunities are less frequent. Not every day you see someone in distress. Cues like visible distress are clear, but people might not act due to bystander effect. Studies like the Good Samaritan experiment show low consistency. So lower opportunity density and cue issues. Score maybe 35.

  Physical courage: Rare situations involving physical threats. Opportunities are infrequent, and cues (danger) are clear but not regularly encountered. Lack of practice affects stability. Score 25.

  Fidelity to promises: Making and keeping promises happens often, like meeting deadlines or commitments. Cues (the promise itself) are strong reminders. But costly promises are less common. Still, moderate to high opportunity density. Score 70.

  Gratitude: Often expressed in social routines, like saying thanks. Opportunities are frequent, but it can become automatic. Cues (receiving favors) are clear, but responses might be habitual. Risk of being a social script. Score 60, but flag as potentially habitual.

  Humility: Hard to measure. Opportunities vary; cues like accomplishments aren't always present. People might downplay successes situationally. Low opportunity density and weak cues. Score 30.

  Temperance: Daily choices like food, screen time. High opportunity density. Cues (temptations) are immediate. But self-control can waver. Score 75.

  Fairness: Opportunities in resource division are occasional, like splitting bills. Cues are present but situational factors (like anonymity) affect behavior. Mixed results in experiments. Moderate opportunity. Score 50.

  Loyalty: Tested in costly situations, which are rare. Opportunities infrequent, cues (friend's need) might not always prompt action. Low opportunity density. Score 40.

  Playful ease: Social interactions happen often. Cues (conversations) naturally elicit wit. High practice and cue-concordance. Score 80.

  Punctuality: Daily routines like meetings. High frequency, cues (schedules) are strong. But often enforced externally, so might be habitual. Score 65, flag as potentially habitual.

  Now, tier sorting:
  Tier 1 (High): Truthfulness, Temperance, Playful Ease. High opportunity density and strong cues.
  Tier 2 (Moderate): Fidelity, Punctuality, Gratitude. Frequent opportunities but some habitual or external factors.
  Tier 3 (Low): Fairness, Compassion, Loyalty. Infrequent opportunities or cue issues.
  Tier 4 (Very Low): Physical Courage, Humility. Rare opportunities and weak cues.

  Need to check if scores reflect robustness or just experimental focus. Studies like Milgram (obedience), Good Samaritan (helping), Stanford prison (situational effects) cover some traits more. Traits like humility or loyalty have fewer experiments. So bias exists. To distinguish, look for real-world consistency vs. lab results. Traits with high opportunity density likely have more real-world practice, making robustness more plausible even without specific studies. But for less studied traits, scores might be speculative. User should note this limitation.
answer: |-
  Here is the trait ranking based strictly on **opportunity density** (frequency/variety of practice) and **cue-concordance** (alignment between situational cues and trait demands), treating the situationist evidence as conclusive and bracketing virtue-ethical replies. Scores reflect residual confidence in cross-situational stability (0 = no confidence, 100 = unshaken confidence). 

  ### Tier 1: High Robustness (70-85)
  **Playful ease in conversation (85)**  
  *Highest opportunity density (daily interactions) + strong cue-concordance (conversation naturally elicits wit).*  
  **Truthfulness in speech (80)**  
  *Frequent/varied opportunities (work, social, digital) + clear cue-concordance (questions/demands for information).*  
  **Temperance with everyday pleasures (75)**  
  *Constant opportunities (food, screens, etc.) + direct cue-concordance (temptation immediately signals need for restraint).*  

  ### Tier 2: Moderate Robustness (50-65)  
  **Punctuality (65) ⚠️ Habit-Driven**  
  *High opportunity density (scheduled events) but often relies on external structures (alarms, routines) rather than internal disposition.*  
  **Fidelity to costly promises (60)**  
  *Moderate opportunity density (commitments common but costly ones rare) + cue-concordance (promise terms are explicit cues).*  
  **Gratitude (55) ⚠️ Script-Driven**  
  *Frequent opportunities (gifts/favors) but often reduced to social scripts ("thank you" rituals) without deep dispositional roots.*  
  **Fairness in dividing resources with strangers (50)**  
  *Moderate opportunities (sharing costs, etc.) but cue-concordance weak (fairness cues like "equal split" often overridden by anonymity/self-interest).*  

  ### Tier 3: Low Robustness (25-40)  
  **Loyalty to a friend when costly (40)**  
  *Low opportunity density (true tests rare) + cue-concordance weak (friend's need may not override competing pressures like self-preservation).*  
  **Compassionate helping of strangers in distress (35)**  
  *Low opportunity density (distress encounters infrequent) + cue-concordance undermined by diffusion of responsibility (bystander effect).*  
  **Humility about accomplishments (30)**  
  *Low opportunity density (major achievements uncommon) + cue-concordance poor (social praise often incentivizes self-promotion, not humility).*  

  ### Tier 4: Very Low Robustness (10-25)  
  **Physical courage under threat of harm (15)**  
  *Extremely low opportunity density (genuine threats scarce) + cue-concordance fails (threat cues trigger panic/fleeing, not courage).*  

  ---  
  ### Critical Assessment  
  **Is this measuring robustness or experimental focus?**  
  The ranking is **heavily influenced by which traits psychologists tested**. Situationist classics targeted helping (compassion), obedience (loyalty/fidelity), and temptation (temperance), while traits like *playful ease* or *humility* lack iconic experiments. This creates a bias: traits with damning experiments (e.g., compassion) score lower, while understudied traits (e.g., wit) score higher due to lack of counterevidence.  

  **Can we distinguish robustness from experimental bias?**  
  Only partially. A trait’s **opportunity density** is an objective predictor of stability (e.g., daily practice *should* cement dispositions). If a high-opportunity trait (e.g., truthfulness) shows instability in real-world data (e.g., workplace dishonesty studies), it suggests genuine fragility. Conversely, low-opportunity traits (e.g., courage) lack data because real tests are rare—so absence of evidence isn’t evidence of absence. For your handout: **Prioritize high-opportunity traits with supporting real-world consistency data (e.g., truthfulness), and remain skeptical of low-opportunity traits regardless of sparse experiments.**  

  ---  
  **Rationale for Key Scores**:  
  - **Punctuality/Gratitude flagged**: High scores rely on external triggers (alarms) or scripts (rote "thanks"), not integrated virtue.  
  - **Compassion (35) vs. Loyalty (40)**: Compassion has more damning experiments (bystander effect), but loyalty’s lower opportunity density limits consolidation.  
  - **Truthfulness (80)**: Despite deception studies, lying remains context-bound (e.g., rare in stable relationships), and daily truth-telling opportunities dwarf most virtues.  
  - **Physical Courage (15)**: Milgram/Stanford paradigms show *absence* of courage under threat, and real-world analogs (e.g., soldier behavior) confirm instability.
