prompt: |-
  I'm a PhD student in philosophy (political philosophy, if it matters) and I keep bumping into one feature of how my field actually runs, and I'd like the implicit theory behind it spelled out.

  When you submit a paper, referees will reject it for not engaging with the recent literature — meaning roughly the last couple of decades of journal articles — even when the paper is in direct conversation with a classic from the 60s or 70s and the objections it has to answer are basically the same ones that classic faced. But nobody behaves as if anything has been settled: no referee ever says this position was refuted in 2005 so there's nothing to do here, and it's completely normal to publish a paper reviving a view everyone stopped defending thirty years ago. We also have a whole professionalized subfield, history of philosophy, that treats old texts as live objects of research rather than as superseded stages, and nobody finds that odd in the way it would be odd for a physicist. And dissertations have to make an original contribution, even though there is no body of established results to add to.

  What view of progress does this package presuppose? My rough guess is something cartographic or dialectical rather than convergent: the field thinks it keeps getting better at mapping the space of available positions, the objections to each, and what each one costs you elsewhere, and that recent work sits further along that map, which is why recency works as a proxy for quality. That would let us demand novelty without ever claiming theses get settled. But I want the implicit theory reconstructed properly and separated from what it merely fits with: does the recency norm strictly require a progress claim, or is it consistent with the flat view that nothing accumulates? Is there a version of the practice on which a 1970 paper counts as just as dialectically advanced as a 2020 one? Where exactly is the practice philosophically underdetermined — would a no-progress-at-all view license everything except the recency norm, or does it also undermine the original-contribution requirement and the history/contemporary split? And concretely, what would have to change in how we referee and how we train grad students if the field gave up the progress assumption: would the history/contemporary split dissolve, would we stop treating old work as background, would we still be able to say a paper is outdated? Also tell me whether the two halves — novelty is mandatory, nothing is ever settled — are actually in tension or whether the notion of progress that fits the practice dissolves it.
reasoning: |-
  Okay, let me start by really unpacking what this philosophy PhD student is asking. They're noticing some peculiarities in their field—political philosophy—and trying to figure out the implicit theory behind these practices. The main points they raise are: referees demanding engagement with recent literature (last couple of decades) even when the paper engages with classics from the 60s/70s; the absence of settled positions (no one says "this was refuted in 2005, move on"); the revival of old views; the existence of history of philosophy as a subfield treating old texts as live; and the requirement for dissertations to make original contributions despite no established body of results.

  Hmm, the student's rough guess is that progress in philosophy is cartographic or dialectical rather than convergent. They want the implicit theory reconstructed properly, exploring whether the recency norm requires a progress claim, if a flat view (no accumulation) is consistent with practice, and what would happen if the progress assumption were abandoned. They also wonder if the novelty requirement and the "nothing is settled" stance are in tension.

  First, I need to clarify the underlying assumptions. The referees' insistence on recent literature suggests a belief that the discourse evolves. But why recent? If nothing is settled, why prioritize newer works? Maybe because recent literature represents the current state of the dialectic. Each new paper adds layers to the conversation, addressing previous objections or introducing new angles. So recent work is seen as more "informed" by ongoing debates, even if not definitively conclusive.

  The history of philosophy subfield treating old texts as live implies that these texts aren't outdated but still relevant. Unlike in sciences, where old theories are superseded, philosophical ideas remain viable. This supports the idea that philosophy doesn't progress by replacing old theories but by continuously re-engaging with them. 

  The original contribution requirement in dissertations without established results is interesting. If there are no settled truths, how can one contribute? The contribution might lie in novel interpretations, synthesizing ideas, or introducing new arguments within the dialectical space. So originality here is about advancing the dialogue, not adding to a body of facts.

  Now, the student's cartographic metaphor makes sense. Progress is mapping the conceptual terrain: positions, objections, costs. Recent work refines this map, so recency becomes a proxy for being up-to-date with the current landscape. But is recency necessary? Could a 1970 paper be as dialectically advanced? Probably not, because later critiques and developments have occurred, so the map has expanded. Even if the core objections are the same, the context changes.

  If the field gave up the progress assumption, what would change? Without the idea of dialectical refinement, the recency norm might weaken. Engagement could focus on the most relevant texts regardless of time. The history/contemporary split might blur, as old texts are seen equally relevant. "Outdated" would mean not engaging with necessary critiques, regardless of when they were made. The originality requirement might shift to novelty in interpretation rather than contribution to an evolving discourse.

  Are novelty and "nothing settled" in tension? Not necessarily. Novelty here isn't about solving problems but advancing the dialogue. Each contribution adds perspectives, even if no resolution is reached. The tension dissolves if progress is about enrichment of the dialectic rather than convergence on truths.

  Also, considering different views of progress: convergent (like sciences) vs. discursive. Philosophy seems discursive, focusing on the process of argumentation. The recency norm fits this because recent works are part of the ongoing conversation. A flat view (no accumulation) might still require recency to stay current in the discourse, but it challenges why recent work is better. However, the practice assumes that recent work incorporates past dialogues, making it more informed.

  So, the implicit theory is that philosophical progress is discursive, enriching the dialectical landscape. The recency norm ensures engagement with the current state of this landscape. Original contributions add new pathways or syntheses. History of philosophy remains vital as these texts are perennial participants. Abandoning progress wouldn't eliminate the need for novelty but might change how relevance and outdatedness are judged. The tension between novelty and unsettledness is resolved by viewing progress as dialectical enrichment.
answer: |-
  Your analysis is sharp, and the tensions you identify reveal a fascinating implicit epistemology. Let's reconstruct the underlying theory of philosophical progress that makes sense of these practices, separating necessary commitments from consistent-but-not-required ones.

  **The Core Implicit Theory: Discursive Refinement (Not Convergent Truth-Tracking)**

  The field operates with a model of **dialectical enrichment through discursive refinement**. Progress isn't measured by accumulating settled truths (like physics) but by **increasingly sophisticated articulation, differentiation, and navigation of the enduring conceptual landscape.** Key features:

  1.  **The Space of Reasons is Permanent (but Complex):** Core philosophical problems (e.g., justice, freedom, consciousness, knowledge) and the broad families of solutions (e.g., utilitarianism, deontology, materialism, dualism) are enduring. They aren't "solved" but perpetually re-encountered.
  2.  **Progress = Mapping & Maneuvering:** Advancement occurs by:
      *   **Articulating finer distinctions:** Discovering new nuances within positions (e.g., different flavors of contractualism).
      *   **Identifying novel objections & counter-moves:** Finding more subtle ways to challenge positions or defend them against known objections.
      *   **Exploring unforeseen implications & costs:** Understanding how commitment to Position A in Domain X forces difficult choices or has surprising implications in Domain Y.
      *   **Developing richer conceptual frameworks:** Creating more powerful tools (concepts, distinctions, methodologies) for analyzing the landscape.
      *   **Synthesizing & integrating:** Showing connections between previously disparate ideas or debates.
  3.  **The Dialectic is Cumulative (Discursively):** While *theses* aren't settled, the *conversation* accumulates. Recent work inherently builds upon, responds to, or refines the *discursive moves* made in the intervening decades since the classic text. It represents the current state of play in the ongoing dialectic.

  **Addressing Your Specific Questions:**

  1.  **Does the recency norm *require* a progress claim?**
      *   **Yes, but a specific kind.** It requires the claim that **recent work embodies the *current state of the dialectic*.** A 2020 paper is presumed to be operating with a more refined map, aware of more recent objections, distinctions, and costs than a 1970 paper, even if both engage the same classic. The recency norm isn't about "truth" but about **discursive currency.** Ignoring recent literature isn't failing to know settled facts; it's failing to engage the *current complexity* of the debate. A 1970 paper *cannot* be as dialectically advanced as a 2020 paper because the intervening 50 years of argument have added layers of nuance, objection, and response that shape how the classic *must now be discussed* to be taken seriously.

  2.  **Is the recency norm consistent with a "flat" view (no accumulation)?**
      *   **Largely No.** A truly flat view (all arguments are equally valid/perennial regardless of context) undermines the rationale for prioritizing recent work. If nothing accumulates discursively, why not *only* engage the original classic? The recency norm *presupposes* that the dialectic has evolved, that new moves have been made, and that engaging them is necessary for competent participation *now*. A flat view struggles to explain why neglecting a 2010 objection is worse than neglecting a 1975 objection if both are equally "live" and unsuperseded.

  3.  **What would change if the field abandoned the progress assumption?**
      *   **Recency Norm:** Would weaken significantly. Referees couldn't say "you must engage Scholar X (2020)" simply because it's recent. The burden would shift to showing *why that specific piece* is uniquely relevant to the argument being made, regardless of publication date. Engagement would be driven by *conceptual relevance to the position*, not publication date as a proxy for dialectical currency.
      *   **History/Contemporary Split:** Would blur considerably. If no discursive progress occurs, then Plato, Kant, and Rawls are all equally "contemporary" interlocutors. The distinction would become purely methodological (e.g., hermeneutic focus vs. systematic argument) rather than ontological (superseded vs. current). Deep engagement with *any* historically relevant text, without needing to "bridge" it to the last 20 years, could be central to a "contemporary" paper.
      *   **"Outdated" as a Criticism:** Would transform. "Outdated" couldn't mean "fails to cite recent work." It could only mean "fails to engage with *essential* objections or distinctions relevant to its thesis, *whenever* they were made." A paper reviving an old view might be criticized for ignoring a *devastating* 1930 critique, not for ignoring minor 2010 refinements.
      *   **Original Contribution:** Would *not* disappear, but its meaning would shift. Originality could reside purely in *novel synthesis*, *unnoticed connections*, *radically new interpretations* of perennial texts/ideas, or *applying* old ideas to new contexts/problems. The pressure to "add to the dialectic" as an incremental step in an evolving conversation would lessen. The contribution might be seen as timeless insight rather than a move in the current game.

  4.  **Is there tension between "Novelty Required" and "Nothing Settled"?**
      *   **No inherent tension, *if* novelty is understood dialectically.** The tension dissolves within the Discursive Refinement model:
          *   **Nothing Settled:** Positions aren't definitively proven true/false; the debate continues.
          *   **Novelty Required:** New contributions must *advance the dialectic* – they must offer a new distinction, a novel objection, a fresh synthesis, a refined defense, an exploration of new costs/implications, or apply the framework in a new way. You can't *just* rehash well-trodden ground without adding a new discursive move.
          *   **The Link:** Precisely *because* nothing is settled, the space for novel contributions within the ongoing dialectic remains perpetually open. If things *were* settled, novelty would be harder to justify. The unsettled nature *enables* the demand for novelty.

  **Underdetermined Aspects & Philosophical Flexibility:**

  *   **The *Extent* of Discursive Progress:** Is the dialectic genuinely refining understanding, or is it just generating more complex noise? The *practice* assumes refinement, but a skeptic within the field could accept the norms while believing it's mostly noise (though they'd find refereeing frustrating!).
  *   **The *Permanence* of the Conceptual Landscape:** Does the space of positions itself evolve historically/culturally, or is it truly transhistorical? The practice leans transhistorical (why else engage Plato as live?), but a historicist could argue that "revivals" are actually novel constructions shaped by current concerns, fitting within the novelty requirement.
  *   **The *Value* of History of Philosophy:** Is its value primarily instrumental (mining for ideas useful *now*) or intrinsic (understanding past thought in its own right)? The co-existence of HoP as a specialized subfield suggests the field tolerates both views, though the "live interlocutor" assumption leans instrumental.

  **Conclusion: Cartography in Motion**

  Your cartographic metaphor is apt, but it's a map that's constantly being redrawn and annotated, not one where old territories become obsolete. The implicit theory is **Dialectical Cartography:** Philosophy progresses by producing ever more detailed, sophisticated, and interconnected maps of the enduring conceptual territory, revealing new pathways, obstacles, and vistas. Recent literature represents the latest surveys and annotations.

  *   **Recency Norm:** Requires the map to be current. You can't navigate effectively with a 50-year-old map; new features (objections, distinctions) have been discovered, even if the continents (core positions) remain.
  *   **Nothing Settled:** No territory is declared permanently impassable or conclusively mapped; exploration continues.
  *   **Novelty Mandatory:** You must add a new annotation, path, or insight to the map.
  *   **History of Philosophy:** Studies the *process* of map-making itself and treats old maps not as obsolete, but as rich sources of insight about the territory and different ways of navigating it. Abandoning the progress claim (Discursive Refinement) wouldn't destroy all norms (originality, relevance) but would fundamentally alter their justification and application, dissolving the recency norm and radically blurring the history/contemporary divide. The field's coherence relies heavily on this implicit model of non-convergent, discursive advancement.
