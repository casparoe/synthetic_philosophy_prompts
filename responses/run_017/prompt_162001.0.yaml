prompt: |-
  Something I keep tripping over in the "what could someone reasonably reject" / many-vs-one literature, and I dont know whether it has a name.

  The case everyone argues about is: a million people each get a mild headache, or one person loses a hand. Non-summers say the headaches never add up to the hand, and I get the shape of that argument. But there's a class of cases where the many do seem to win without anyone adding anything, and its when their complaints arent really separate complaints. Case one: a town of 5,000 loses its only water source. Each person's complaint is about the very same loss, so saying "each of the 5,000 has a complaint" counts one loss 5,000 times — but it also seems wrong to say the town's complaint is the same size as one person's. Case two: a policy badly hurts one person, and everyone else in the community is horrified about it. Their horrifiedness isnt a harm to them, and it isnt the same event repeated either — it's 5,000 responses to one event — and yet the number of people responding seems to matter.

  So the pattern: cases where counting one complaint per head either inflates (a shared loss gets counted over and over) or sweeps in complaints from people who arent the ones being hurt (distress about someone else's treatment). It looks like aggregation but I dont think it's the "do the numbers count" question, because the disagreement isnt about whether small harms sum — it's about whether these are N separate complaints in the first place. People usually just declare that every person's complaint gets counted once and move on, which papers over both directions.

  Does this have a name? I dont want just a label. I want to know what the nearest established concepts are, how my thing falls outside each of them, and which one actually fits; and if none does, coin something and define it tightly enough that I can tell in a new case whether it applies.

  Give me a JSON object with these fields: nearest_concepts (a list, each entry with: name, what_it_actually_picks_out, where_it_fits_my_case, where_it_doesnt, and fit as exact/partial/no), verdict (one sentence on whether anything established covers this exactly), proposed_term (term, definition, one case it clearly covers, one case it clearly doesn't, and a yes/no test I can run on a new case), and boundary_cases (three cases, each with whether the term covers it and why).
reasoning: |-
  We are dealing with a problem in moral philosophy, specifically in aggregation and the "separateness of persons" debate. The user describes a pattern where in some cases, counting each individual's complaint seems to either overcount (as in the shared loss of a water source) or count complaints that are not about direct harm (like distress about another's harm). The core issue is whether we are dealing with N separate complaints or not.

  Let me break down the examples:

  1. **Shared Loss (Water Source)**: The town loses its only water source. Each person in the town is harmed by this loss. However, the loss is a single event that affects everyone. Counting each person's complaint separately might lead to counting the same loss multiple times. But intuitively, the harm to the town is greater than the harm to one person.

  2. **Distress about Another's Harm**: One person is badly hurt, and 5,000 others are horrified. The distress of the 5,000 is a reaction to the same event. Each person's distress is a separate mental state, but the cause is singular. Moreover, the distress might not be considered a harm of the same kind (or even a harm at all) in the same way as the direct harm.

  The user notes that standard aggregation debates (like the headache vs. hand case) are about whether many small harms can add up to outweigh a large harm. But here, the issue is whether the complaints are truly independent and whether they should be counted as multiple complaints at all.

  Now, let's think about established concepts:

  - **Aggregation**: Typically, this is about summing small individual harms to outweigh a large harm. It assumes that the harms are separate and additive. But in the water source case, the harm is shared and not additive in the same way. In the distress case, the complaints are not about direct harm but about a reaction. So aggregation as usually discussed doesn't capture the overcounting or the nature of the complaints.

  - **Non-Identity Problem**: This is about whether an action that causes a person to exist with a less happy life is worse for that person than not existing. Doesn't fit.

  - **Parfit’s Non-Aggregation**: Parfit discusses cases where we should not aggregate small benefits to many over a large harm to one. But again, that doesn't address the shared loss or distress cases.

  - **Compensation and Complicity**: Not directly.

  - **Collective Harm or Shared Harm**: This might be closer. The water source loss is a collective harm. But note: each person is individually harmed by the loss of water. However, the harm is not independent because it's the same cause and the harm is shared. But we still might think that the collective harm is greater.

  - **Vicarious Harm or Sympathy Harm**: The distress case involves vicarious emotions. But is that a harm? And if so, is it independent?

  - **Double Counting**: This is an issue in economics and ethics. In the water source case, if we count each person's complaint, we are counting the same harm multiple times. But that might be appropriate if we are considering the total harm, which is distributed.

  - **The Problem of Overdetermination**: This is usually about causation (e.g., two shooters, each of which would have killed). Not directly.

  - **The Distinction Between Individual and Collective Complaints**: Perhaps we need to differentiate when a complaint is individual and when it is collective. In the water source case, the loss of water is a collective good, so the complaint is collective. But each individual also has an individual complaint because they are without water.

  I think the core issue is about the **independence of harms** and the **nature of the complaint**. The user is pointing out that in some cases, the harms are not independent (they stem from a single cause and are shared) and in other cases, the complaints are not about direct harm but about a reaction to harm (which might be derivative).

  Let me propose a term: **"Complaint Entanglement"**. But let me think of something more precise.

  Alternatively, **"Complaint Non-Separability"**. But I want to capture both the overcounting (shared loss) and the inclusion of derivative complaints (distress).

  Another idea: **"Complaint Multiplicity Issues"**? But that's too vague.

  Perhaps **"Derivative and Overlapping Complaints"**. But that's a mouthful.

  Now, the user asks for a JSON object with:

  - nearest_concepts: a list of concepts that are near but not exact, with:
    - name
    - what_it_actually_picks_out
    - where_it_fits_my_case
    - where_it_doesnt
    - fit: exact/partial/no

  - verdict: one sentence on whether anything established covers this exactly

  - proposed_term: with term, definition, one case it clearly covers, one case it clearly doesn't, and a yes/no test

  - boundary_cases: three cases, each with whether the term covers it and why

  After reflection, I don't think there is an established term that exactly covers both types of cases. So I will coin a term.

  Proposed term: **"Complaint Conflation"**

  But let me define it carefully.

  Definition: **The conflation of distinct moral complaints arising from either (a) a shared harm that affects multiple individuals but is fundamentally a single event or resource loss, leading to overcounting when each individual's complaint is treated as fully independent, or (b) derivative complaints (such as emotional distress) about a core harm that primarily affects another individual, where the derivative complaints are not direct harms but are responses to the same event.**

  However, I want a more precise term that captures the idea that the complaints are not separable because they are either overlapping (shared harm) or derivative (sympathetic harm).

  Alternative: **"Non-Independent Complaints"**

  But that might be too broad.

  Another idea: **"Complaint Entanglement"** - because the complaints are entangled: either by being about the same event (overlap) or by being causally connected (derivative).

  But let me go with **"Complaint Entanglement"**.

  Definition: **A situation in moral evaluation where individual complaints are not fully independent due to either (1) being caused by a single harm that is shared among multiple individuals (overlapping complaints) or (2) being derivative complaints (such as emotional distress) that arise from a core harm to another individual, leading to challenges in counting and weighing the complaints without overcounting or misattribution.**

  Clear case it covers: 
  - The town losing its water source (overlapping complaints).
  - The community's distress about one person being hurt (derivative complaints).

  Clear case it doesn't cover: 
  - One million people each getting a mild headache from separate causes (independent, additive complaints).

  Yes/No test for a new case: 
  - Are the complaints either (a) about a shared harm that is not divisible into independent harms or (b) a reaction to a harm that primarily affects someone else? If yes, then it's complaint entanglement.

  Now, for nearest concepts:

  1. **Aggregation**:
     - What it actually picks out: The summing of individual harms/benefits to determine overall moral weight.
     - Where it fits: Both cases involve multiple complaints that might be aggregated, so the context is similar.
     - Where it doesn't: Aggregation typically assumes independent harms, but here the complaints are not independent (overlapping or derivative). Also, the debate in aggregation is about whether to sum, not about whether the complaints are independent in the first place.
     - Fit: Partial.

  2. **Collective Harm**:
     - What it actually picks out: Harms that affect a group collectively, often involving public goods or shared resources.
     - Where it fits: The water source case is a collective harm.
     - Where it doesn't: It doesn't cover the distress case (which is about derivative complaints) because the distress is not a collective harm but individual emotional reactions.
     - Fit: Partial.

  3. **Vicarious Harm**:
     - What it actually picks out: Harm experienced by one person due to the harm of another, such as emotional distress from witnessing or knowing about another's suffering.
     - Where it fits: The distress case is a vicarious harm.
     - Where it doesn't: It doesn't cover the shared harm case (like the water source) because that is a direct harm to each individual, not vicarious.
     - Fit: Partial.

  4. **Double Counting** (in ethics):
     - What it actually picks out: The error of counting the same harm more than once.
     - Where it fits: In the water source case, counting each person's complaint might be seen as double counting the same loss.
     - Where it doesn't: It doesn't naturally extend to the distress case because the distress complaints are separate mental states, but they are about the same event. Moreover, double counting is an error, but in the distress case, the issue is whether these complaints should count at all.
     - Fit: Partial.

  Verdict: No established concept fully covers both types of cases (overlapping and derivative complaints) as a unified phenomenon.

  Boundary Cases:

  1. **Case: A public park is closed, and 100 people who used it daily are saddened.**
     - Covered? Yes, because the loss of the park is a shared harm (overlapping complaints). Each person's complaint is about the same resource loss.

  2. **Case: One person is tortured, and 10,000 people watch a live stream and feel distressed.**
     - Covered? Yes, because the distress is a derivative complaint about the core harm to the one person.

  3. **Case: A policy causes 10,000 people to each lose $10 from their separate bank accounts due to a single glitch.**
     - Covered? No, because although the cause is the same (the glitch), each person's loss is independent and separable (they each lose $10 from their own account). The complaints are independent.

  But note: the glitch is a single event, but the harms are independent. So it's not overlapping in the sense of a shared resource.

  Let me adjust the test to be more precise:

  Test: 
  - (a) Is the harm such that it affects a resource or event that is shared (non-excludable and non-rivalrous) so that the loss is inherently collective? OR 
  - (b) Is the complaint about a harm that is primarily experienced by someone else (i.e., the complainant is not directly harmed in the same way but has a reactive attitude)?

  In the bank account case: each account is separate, so the harm is individual and independent. The glitch is the cause, but the harm is not shared. So it doesn't meet (a). And it's not (b) because each person is directly harmed (losing their own $10). So not entangled.

