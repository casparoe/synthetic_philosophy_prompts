  We are creating an asymmetric game that is not a Prisoner's Dilemma. We need two players with different roles, different options, and different payoffs. We want to show that superrational reasoning (under two different interpretations) leads both players to an outcome that is worse for each than if they had used standard game-theoretic reasoning.

  Constraints:
  - Not a PD or reskin.
  - No clones, twins, etc.
  - No communication, pre-agreement, etc.
  - Both know each other's payoffs and that the other is superrational (common knowledge).
  - The bad outcome must come from the principle itself, not from uncertainty or botched reasoning.

  We'll design a game with two players: Player A (Senior) and Player B (Junior). They are co-authors on a paper and must decide how much effort to put into revising it. The options are:
  - Player A (Senior) can choose High effort (H_A) or Low effort (L_A).
  - Player B (Junior) can choose High effort (H_B) or Low effort (L_B).

  The payoffs are asymmetric because the senior's reputation is more established and the junior is trying to build theirs. We'll set up a coordination game with conflict, similar to Battle of the Sexes but asymmetric.

  Payoff matrix (rows for A, columns for B):

  ```
            B: H_B     B: L_B
  A: H_A    (4, 3)    (1, 2)
  A: L_A    (2, 4)    (3, 1)
  ```

  Interpretation:
  - If both choose High: The paper is excellent and both gain, but A gets 4 (high reward for leading a great paper without too much personal cost because they are senior and can delegate) and B gets 3 (good for their career but they did a lot of work).
  - If both choose Low: The paper is mediocre. A gets 3 (they didn't spend much effort and the paper is acceptable) and B gets 1 (poor for their career).
  - If A chooses High and B chooses Low: A does a lot of work and B coasts. A gets 1 (they are overworked and resentful) and B gets 2 (they get credit without much work).
  - If A chooses Low and B chooses High: B does most of the work. A gets 2 (they get some credit without effort) and B gets 4 (they shine and build their reputation).

  In standard game theory, we look for Nash equilibria:

  1. (H_A, H_B): A gets 4, B gets 3. But is it an equilibrium? If A deviates to L_A, they get 2 (which is less than 4), so no. If B deviates to L_B, they get 2 (which is less than 3), so no. Hence not Nash.

  2. (H_A, L_B): A gets 1, B gets 2. If A deviates to L_A, they get 3 (which is better). So not Nash.

  3. (L_A, H_B): A gets 2, B gets 4. If A deviates to H_A, they get 4 (better) so not for A. If B deviates to L_B, they get 1 (worse) so B won't. But because A wants to deviate, it's not Nash.

  4. (L_A, L_B): A gets 3, B gets 1. If A deviates to H_A, they get 1 (worse). If B deviates to H_B, they get 4 (better). So not Nash.

  Wait, there are no pure strategy Nash equilibria? That might be a problem because we want to compare to a standard solution.

  Alternatively, we can adjust the payoffs to have two pure Nash equilibria, like a Battle of the Sexes.

  Revised payoffs:

  ```
            B: H_B     B: L_B
  A: H_A    (4, 3)    (0, 0)
  A: L_A    (0, 0)    (3, 4)
  ```

  Now:
  - (H_A, H_B): A=4, B=3. If A deviates to L_A, they get 0 (worse). If B deviates to L_B, they get 0 (worse). So Nash.
  - (L_A, L_B): A=3, B=4. Similarly, Nash.

  And the other two outcomes are (0,0) and not equilibrium.

  In this Battle of the Sexes style game, the two pure Nash equilibria are (H_A, H_B) and (L_A, L_B). There is also a mixed strategy equilibrium.

  In standard game theory without coordination, they might end up at (0,0) if they miscoordinate, but we assume they can reason. However, without communication, they might not coordinate on the same equilibrium. But we are assuming common knowledge of rationality, and in standard game theory, they might use a focal point or something. However, the problem is asymmetric so they might not agree.

  But we are going to compare with superrationality.

  First, let's set the stage: Two co-authors, one senior (A) and one junior (B). The senior has more reputation to lose and is busier, so they prefer that both put in high effort only if that leads to the best paper (which they get most credit for) but also would be okay with both putting in low effort (so they don't have to work hard). The junior, on the other hand, would prefer to be the one who puts in high effort and have the senior put in low (so they can shine) and also would accept both high (but that is less good for them than being the star). They both dislike the outcomes where only one works hard and the other free-rides because the paper then suffers.

  Now, we introduce superrationality.

  But note: the original Hofstadter superrationality for symmetric games: both players are identical and will choose the same action. They choose the action that, if both choose it, leads to the best outcome for both. In the symmetric PD, that would be cooperate.

  But here, the game is asymmetric. We cannot assume they choose the same action because the actions have different meanings. So we must extend.

