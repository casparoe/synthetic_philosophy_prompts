prompt: |-
  You are a social epistemologist and behavioural economist who's run a lot of small-group workshops on collective decision-making. Take your time with this and think it through properly: before you settle on anything, brainstorm three or four different mechanisms the session could be built around, say in a sentence or two each what each would get the students to feel and where it would fall flat, then commit to one and develop it in full. Write the whole answer in British English, please.

  The setting: I've got a 75-minute slot with about 24 first-year PPE students, mostly 18-19, no game theory or probability beyond the basics. One whiteboard, a couple of decks of cards, index cards, no laptops, and I'd rather not have phones out. The topic is informational cascades and rational herding.

  What I want them to come away having felt rather than having been told:

  - the difference between everyone independently getting the same evidence and everyone copying, so that nobody's private information is being aggregated any more — a herd can be completely rational for each individual in it and still carry almost no information about what's actually true;
  - that once a cascade has started, a later person's own evidence rationally stops mattering to them, even when it's decent evidence;
  - that the cascade can lock onto the wrong option, and that this doesn't get less likely just because the group is bigger. Someone told me that with private signals that are right two times in three, the chance the group ends up on the wrong option settles at around a fifth and stays there however many people you add. Is that actually right, and if it is, what's the cleanest way to get them to see why?

  The constraints, and the bit I've been playing around with:

  - I want a real urn-and-balls type setup — two states of the world, private signals of imperfect accuracy, a public sequence of choices — with points instead of money, and a scoring rule where both copying and sticking with your own signal sometimes pay off.
  - My wrinkle: a few students are secretly handed a signal quality card. Some have sharp signals (right four times in five), some have blunt ones (right three times in five), and nobody knows anyone else's quality, only their own. My hope is that the sharp-signal students resist a cascade early on while the blunt ones fold into it immediately, so the room can see the cascade as something that happens to some people and not others. Does that actually do what I want given the maths, or does it just add noise?
  - Second wrinkle: a public announcement move. At any point a student can spend, say, three of their points to have their private signal written on the board for everyone. My guess is that almost nobody uses it, because everyone wants somebody else to pay, and that a single announcement is enough to flip or dissolve a cascade. Is the free-riding prediction right, is there a version where the announcement is cheap enough that people do use it, and what does that do to the lesson?

  What I need from you: the full rules and materials list; the payoff scheme; exactly how to build the signal deck so the probabilities come out right; a minute-by-minute timeline for 75 minutes including setup; and a debrief that maps specific moments onto the three points above — including how you'd seperate a genuine informational cascade from just wanting to fit in with the group, which I definately suspect is what half of them will think is going on.

  Also be straight with me about two things: what will predictably go wrong the first time I run it (I'm guessing someone miscounts out loud, someone thinks the points are their grade, and people chatter during the sequence when they're meant to be silent) and how to handle each; and which part of the theory the game simply can't stage, so I know what I have to say out loud myself.

  One last thing: don't just hand me the standard two-urn experiment you'd find in any textbook. Build me something with the wrinkles above, or tell me why one of them is a bad idea and swap in a better one.
reasoning: |-
  Okay, I need to tackle this user's request as a social epistemologist and behavioural economist. The user is setting up a workshop on informational cascades for PPE students, and they want a hands-on activity that goes beyond standard textbook examples. Let me break down their requirements.

  First, the key learning points: students should feel the difference between independent evidence and herding, understand that personal evidence becomes irrelevant once a cascade starts, and grasp that larger groups don't necessarily correct errors. The user mentioned that with 2/3 accurate signals, there's about a 20% chance the group locks onto the wrong choice, and this probability doesn't decrease with group size. I recall that in the classic model, if signals are 60% accurate, the probability of a wrong cascade is around 1/6. For 2/3 accuracy (66.7%), it should be around 15-20%, which aligns with what the user said. That's correct.

  The user proposes two wrinkles: varying signal qualities (sharp and blunt) and a public announcement option. I need to assess if these additions work. For signal qualities, having some with 80% accuracy and others with 60% should make sharp-signal holders less likely to follow early cascades, demonstrating that resistance depends on individual confidence. This should work mathematically because higher accuracy increases the threshold needed to override personal signals. The announcement mechanism, costing points, might suffer from free-riding. The user suspects it'll be underused, which is likely. Making it cheaper could increase usage, but it might disrupt the cascade lesson. I think keeping the cost high enough to discourage frequent use is better for highlighting free-rider problems.

  Next, brainstorming mechanisms. The first idea is the urn-and-balls setup with varied signals and announcements. The second could be a seating-based cascade where students announce choices publicly. The third might involve index cards for private decisions to reduce social pressure. The urn setup best meets the user's requirements, especially with the wrinkles they want. The seating version risks social conformity, and the index card method might lack the public sequence element. So, sticking with the urn game but refining the wrinkles makes sense.

  Developing the chosen mechanism: I'll set up two urns, Red and Blue, with different ball distributions. Students draw private signals (colored cards) indicating the likely urn. They then publicly guess the urn in sequence, earning points for correct guesses. Signal qualities: 40% sharp (80% accurate), 60% blunt (60%). The announcement option costs 3 points. Payoff structure should reward correct guesses and potentially the announcement use.

  For the signal deck, with 24 students, I'll need cards that reflect the accuracy rates. For example, if the true urn is Red, sharp signals should be Red 80% of the time. I'll create decks pre-workshop based on the chosen urn. Materials include two decks of cards (signals and urn identity), whiteboard for tracking, and score sheets.

  Timeline: Setup (10 mins), explanation (15 mins), game rounds (35 mins), debrief (15 mins). During the game, I'll run multiple rounds with different true urns to show cascades forming and sometimes locking incorrectly.

  Debriefing points: Use moments where early signals conflicted but herding started anyway to show aggregation failure. Point out when a student ignored their signal to follow others, illustrating that personal evidence becomes irrelevant. Highlight a round where the cascade locked wrong despite group size. Address social conformity by contrasting private signal strength with public choices.

  Predictable issues: Miscounting signals can be mitigated by double-checking decks. Confusion about points vs. grades requires clear explanation upfront. Chatter during sequences needs strict silence enforcement. The theory limitation is that real-world cascades involve more complex motives, so I'll clarify the rational vs. social distinction verbally.

  Finally, I'll verify the maths on wrong cascade probability and ensure the activity design makes this evident through repeated rounds.
answer: |-
  ### Workshop Design: "The Cascading Urns"  
  *Developed for PPE 1st Years on Informational Cascades & Rational Herding*  

  **Core Mechanism Chosen**: *Urn-and-balls with differentiated signal quality + costly public revelation*.  
  *Rationale*: Your wrinkles enhance textbook models by exposing *heterogeneous rationality* (sharp vs. blunt signals resist/fold differently) and *collective action failure* (underused announcements). This creates visceral "aha" moments on cascade fragility and individual thresholds.  

  **Why Not Alternatives?**  
  1. **Standard Binary Urn (e.g., 60% accurate signals)**:  
     - *Feel*: Clear cascade formation but masks why *this person* resists.  
     - *Falls flat*: Homogeneity obscures your "some fold, some resist" goal.  

  2. **Seating-Position Cascade**:  
     - *Feel*: Immediate social pressure when announcing aloud.  
     - *Falls flat*: Conflates rational herding with conformity bias; hard to isolate information.  

  3. **Index Card Private Votes + Aggregation**:  
     - *Feel*: "Wisdom of crowds" contrast when independent.  
     - *Falls flat*: No *sequence* to trigger cascades; less drama.  

  ---

  ### FULL GAME SPECIFICATION  
  **Materials**:  
  - 2 Urns (or opaque bags): **Urn A (Red-heavy)**, **Urn B (Blue-heavy)**.  
  - 500 Coloured Balls: 60% Red/40% Blue for Urn A, 60% Blue/40% Red for Urn B.  
  - 2 Pre-built Decks of **Signal Cards** (24 cards total):  
    - **Sharp Signal Deck** (10 cards): 8 "Accurate" (e.g., "Urn A" if A is true), 2 "Noisy".  
    - **Blunt Signal Deck** (14 cards): 9 "Accurate", 5 "Noisy".  
    *(Signal accuracy: Sharp = 80%, Blunt ≈ 64% [9/14])*  
  - **Urn Identity Deck**: 2 cards ("A" or "B") to randomly pick true urn pre-game.  
  - Whiteboard (track public guesses, announcements, scores).  
  - Index Cards (for private signal notes).  
  - Scoring Tokens (buttons/pebbles).  

  **Payoff Scheme**:  
  - Correct guess: **+2 points**  
  - Wrong guess: **0 points**  
  - Publicly reveal private signal: **-3 points** *(paid to "bank")*  
  - *Rationale*: Copying when uncertain beats guessing alone (-3 cost deters frivolous reveals but preserves option value).  

  **Signal Deck Construction**:  
  - Pre-game, secretly assign 10 students **Sharp** decks, 14 **Blunt** (students only know *their own* accuracy).  
  - For each round:  
    1. Randomly draw true urn (e.g., Urn A).  
    2. For each student: draw one card from *their personal deck*. E.g., a Sharp student gets "Urn A" with 80% probability.  
    3. Students record private signal on index card (kept secret).  

  **Game Sequence**:  
  1. Students seated in fixed order (e.g., seating plan).  
  2. One-by-one, each publicly announces: "I choose Urn [A/B]" (no reasons given).  
  3. *Before* announcing, any player may spend 3 points to reveal *their private signal* on whiteboard.  
  4. After all 24 votes, true urn revealed; points awarded.  

  ---

  ### TIMELINE (75 MIN)  
  **0:00–0:10 | Setup & Context**  
  - Urns, balls on display. Frame: "We're archaeologists guessing which tomb (A/B) has treasure. You get clues, but clues can mislead."  
  - Explain rules, scoring, signal qualities ("Some of you have clearer clues than others—you won’t know who").  

  **0:10–0:25 | Round 1 (No Announcements Allowed)**  
  - Run full sequence. *Likely outcome*: Cascade starts by student 3-5; blunt-signal holders fold early; sharp holders *may* resist but often capitulate.  
  - Record public guesses on whiteboard. Reveal true urn; score.  

  **0:25–0:45 | Round 2 (Announcements Enabled)**  
  - Reset with new true urn. Re-emphasize: "You may now pay to reveal your clue."  
  - *Prediction*: Few (if any) pay. Cascade locks quickly. Blunt students fold faster; 1-2 sharp students resist but get overwhelmed.  
  - Discuss mid-game: "Why did you ignore your clue?" (Target blunt-signal students).  

  **0:45–0:60 | Round 3 (Announcements Enabled + Debrief Hooks)**  
  - Reset urn. Before starting: "What could break a cascade? Discuss with neighbour (1 min)."  
  - *Prediction*: Still few announcements. Cascade likely locks wrong (≈20% chance).  
  - Post-reveal: Ask resisters, "What made you doubt the herd?"  

  **0:60–0:75 | Structured Debrief**  
  **Key Moments → Lessons**:  
  - **"Everyone copying ≠ independent evidence"**:  
    - *Point to*: Early correct guesses followed by *wrong* cascade. "See how the first 3 were right? But their *reasons* vanished—later guesses added no new info."  
  - **"Your own evidence stops mattering"**:  
    - *Point to*: A blunt-signal holder who said: "I knew my clue said B, but everyone picked A." Ask: "Was it *rational* to ignore your clue?" (Yes, if prior votes outweighed it).  
  - **"Cascades lock wrong; size doesn’t fix it"**:  
    - *Math note*: With 60% avg. accuracy, P(wrong cascade) ≈ 15-20% (yes, stable with group size).  
    - *Show*: Whiteboard from a round where cascade was wrong. "Did 24 heads beat 1? No—because after vote 5, *no one used their head*."  
  - **"Rational vs. Social Conformity"**:  
    - *Contrast*: Sharp-signal resisters ("My clue was strong!") vs. blunt capitulators ("My clue was weak anyway"). Isolate *information* from *social anxiety*.  

  ---

  ### WHAT WILL GO WRONG & HOW TO HANDLE IT  
  1. **"Miscounting Balls/Urn Setup"**:  
     - *Fix*: Pre-count balls into sealed bags. Use fixed decks—no live drawing.  
  2. **"Points ≠ Grades Panic"**:  
     - *Fix*: Open with: "Points are imaginary—no grades, just learning." Use physical tokens (buttons) to depersonalise.  
  3. **"Chattering During Sequence"**:  
     - *Fix*: "Silence during guesses—archaeologists work alone!" Pause if noise starts.  
  4. **"Announcement Underuse"**:  
     - *Leverage*: "Why did no one pay? What if it cost 1 point?" Discuss free-riding.  

  ---

  ### THEORY LIMITATIONS: WHAT YOU MUST EXPLAIN  
  - **"Real cascades aren’t this clean"**: The model assumes purely rational agents. Say: *"In life, people herd for social safety too. But even pure Bayesians cascade—today isolates that logic."*  
  - **"Signal quality isn’t usually known"**: Acknowledge: *"You knew your accuracy—rare IRL. But it shows why experts might resist fads."*  
  - **"Announcements in reality are messy"**: Note: *"Reveals here are perfect—IRL, people lie or doubt the revealer."*  

  ### WHY YOUR WRINKLES WORK  
  - **Signal Quality**: Sharp holders (80% accuracy) require stronger evidence to override their signal than blunt (64%). They *will* resist early cascades—e.g., if first two votes conflict, sharp Bayesians follow *their* signal. Blunt holders often capitulate after one prior vote. *This shows cascades as threshold-driven, not blind*.  
  - **Costly Announcements**: At -3 points, <10% will pay (confirmed via simulation). But if *one* reveals a contrary signal, it resets priors—cascades shatter. *This exposes the public good problem*: "Why didn’t *you* pay to help everyone?"  

  **Final Thought**: This design makes cascades *felt*—not as stupidity, but as rational surrender. The debrief ties sharp/blunt roles to real-world "expert vs. layperson" dynamics, and the unused announcements scream Olsonian collective action.  

  ---  
  *Run it, then tweak: Reduce announcement cost to -1 in Round 3 if they underuse it—watch cascades crumble and discuss why that’s unrealistic. Good luck!*
