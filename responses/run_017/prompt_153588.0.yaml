prompt: |-
  I sit on the grants committee of a small independent foundation (roughly $4.2M to disburse this cycle), and we are trying to decide between three shortlisted causes using the three-factor prioritization framework our staff has used for years — expected value per dollar approximated as importance × tractability × neglectedness. Our program staff scored them as follows. Cause A, scaling a micronutrient fortification program through an existing government delivery system, scores very high on importance and tractability (strong evidence, known cost per unit of benefit) but low on neglectedness, and staff now estimate that around 60% of our marginal dollar would simply displace budget lines the government would otherwise have funded. Cause B, a multi-year litigation and standard-setting push to tighten a national building code in a way that would cut indoor air pollution, scores high on importance with a long and diffuse causal pathway, moderate tractability, and moderate neglectedness; staff's note says the neglect here looks informational — hardly anyone has tried this route — rather than diagnostic. Cause C, seed funding to launch a research field around a poorly understood systemic risk, scores off the charts on importance with enormous error bars, very low on measured tractability (there is almost no evidence base), and very high on neglectedness — though the only groups that have touched it appear to have tried, failed to get traction, and moved on. Under the framework as written, A wins comfortably, B is second, C is last.

  At our last meeting I circulated a proposed revision, and the committee is split on it, so I need something I can put in front of them. The revision has two parts. First, replace neglectedness with what I've been calling counterfactual neglectedness: not how little is currently spent on the cause, but how little would be spent if we did not act, net of crowding out and of the fungibility that lets our grant free up someone else's money for something we would not have chosen. Second, stop treating tractability as a single number: score marginal tractability at the funding level the cause is actually at (rather than average tractability), and treat low measured tractability differently depending on whether the surrounding neglect is informational (no one has looked, so absence of evidence is not evidence of absence) or diagnostic (others looked and moved on, so the neglect is itself evidence against tractability). On my scoring this flips the ordering — B first, A second, C third — mainly because A's displacement is large and C's neglect looks diagnostic rather than informational. Our board member who is a retired epidemiologist dissents from the whole exercise: her claim is that importance is a prior in numerical clothing, tractability is estimated from thin and self-selected evidence, and a framework you can re-tune until it produces the conclusion you like is not a decision rule at all, so we would do better with a blunt rule of funding whichever intervention has the strongest direct evidence of effect — which would put A clearly first. I think she is wrong but I do not think she is silly, and I would rather the memo defeat her position than talk past it.

  Please draft the decision memo I will circulate before the November 14 meeting: about 900–1,200 words, bottom line up front, addressed to the committee. It should recommend one of the three decision rules (the framework as written, my revision, or the evidence-strength rule), give a concrete allocation of the $4.2M across A, B and C as percentages summing to 100, and say what happens when — e.g. what we re-score at the six-month review and what would have to be true for next cycle's ordering to change. Engage the epidemiologist's objection at its strongest, including the uncomfortable version where the framework's flexibility is exactly why it is useful for search but exactly why it cannot discipline us. Also flag where my revision might be rigging the answer rather than correcting a bias: in particular whether separability fails (whether the three factors can really be multiplied when tractability plausibly falls as funding rises and neglectedness is often evidence about tractability), and whether the framework quietly favors causes whose benefits are legible and measurable over causes whose benefits are systemic. Throughout, separate what is settled — the arithmetic of diminishing returns, what follows from the definitions — from what is genuinely contested among people who work on this, and do not present a contested claim as consensus; where you are extrapolating beyond what the staff numbers support, say so plainly. End the memo with a single machine-readable line: \answer{[adopt revision | retain framework as written | adopt evidence-strength rule]; A: __%, B: __%, C: __%}.
reasoning: |-
  We are addressing the Grants Committee with a decision memo. We need to choose between three decision rules and allocate $4.2M across three causes (A, B, C). The memo must be bottom-line up front, engage with the epidemiologist's critique, and address potential rigging in the revision.

  Bottom line: I recommend adopting the revised framework and allocating 50% to B, 30% to A, and 20% to C.

  Detailed reasoning:

  1. **The Epidemiologist's Critique**: She argues that the framework is subjective and can be tuned to get any desired outcome. She advocates for a rule based on direct evidence, which would favor A. We must acknowledge that the framework's flexibility is both a strength (for exploring new opportunities) and a weakness (if used without discipline). However, the critique misses that the framework is designed to handle causes with varying levels of evidence and that the revision explicitly addresses some of the subjectivity by refining definitions.

  2. **Comparing the Decision Rules**:
     - **Current Framework**: Multiplies importance, tractability, and neglectedness (as currently defined). It gives A the highest score. But it has flaws: it doesn't account for crowding out (which reduces the counterfactual impact) and treats tractability as static.
     - **Revised Framework**: 
       - Replaces neglectedness with "counterfactual neglectedness" (funding that would not happen without us, net of displacement). This reduces A's score because 60% of the grant displaces government funds.
       - Breaks down tractability: marginal tractability at current funding level and distinguishes between informational and diagnostic neglect. For C, the neglect is diagnostic (others tried and failed) so we downgrade tractability, whereas for B, the neglect is informational (no one has tried) so we don't penalize it for lack of evidence.
       - This revision flips the order to B, A, C.
     - **Evidence-Strength Rule**: Funds based on the strongest direct evidence. This would put A first, but it ignores high-impact but less proven opportunities (like B and C). This rule is too blunt and may miss transformative opportunities.

  3. **Addressing Potential Rigging in the Revision**:
     - **Separability**: The multiplication of factors assumes they are independent. But tractability may decrease as funding increases (diminishing returns) and neglectedness can inform tractability (if others have tried and failed, that's evidence of low tractability). The revision attempts to handle the latter by distinguishing types of neglect, but we must acknowledge that the framework is a heuristic and not a perfect model.
     - **Legibility Bias**: The framework may favor causes with measurable benefits (like A) over systemic ones (like B and C). The revision helps by not punishing B for lack of evidence (informational neglect) but still, the importance of systemic risks (C) is hard to quantify. We must be cautious and use the framework as a guide, not a substitute for judgment.

  4. **Allocation and Monitoring**:
     - We are not all-or-nothing; we can diversify. Given the uncertainties, we recommend:
       - B: 50% ($2.1M) because it has high importance, moderate tractability (with informational neglect, so potential for high marginal returns), and under the revised framework it ranks first.
       - A: 30% ($1.26M) because it has strong evidence and would be the top under other rules, but we reduce due to crowding out.
       - C: 20% ($0.84M) because it is highly neglected and important, but the diagnostic neglect (prior failures) suggests caution. This is a bet on learning: if we can generate evidence, it might become more tractable.
     - At the six-month review, we will:
       - For A: Track the actual displacement rate and adjust if the displacement is higher or lower than 60%.
       - For B: Assess progress in the litigation and standard-setting, especially whether the causal pathway is becoming clearer.
       - For C: Evaluate if the seed funding has attracted additional researchers and if early findings suggest the cause is more (or less) tractable than initially thought.
     - For the next cycle, the ordering could change if:
       - New evidence emerges (e.g., in C, if research shows a breakthrough, its tractability score could rise).
       - Displacement in A changes (e.g., if the government reduces funding more than expected, our counterfactual impact increases).
       - B's tractability improves with progress in the legal strategy.

  5. **Conclusion**: The revised framework is a more nuanced tool that corrects for key biases in the original. It is not without subjectivity, but by making the adjustments explicit, we can apply it more consistently. We must remain open to updating our approach as we learn.

  Final line:

  \answer{adopt revision; A: 30%, B: 50%, C: 20%}
answer: |-
  **MEMORANDUM**  
  To: Grants Committee  
  From: [Your Name], Committee Member  
  Date: November 7, 2023  
  Subject: Recommendation for Funding Framework and Allocation of $4.2M  

  **Bottom Line Up Front**: I recommend adopting the **revised prioritization framework** (incorporating "counterfactual neglectedness" and refined tractability scoring) and allocating funds as follows: **Cause B: 50% ($2.1M)**, **Cause A: 30% ($1.26M)**, **Cause C: 20% ($0.84M)**. This addresses critical biases in our current model while balancing evidence, counterfactual impact, and exploratory potential. The evidence-strength rule is too restrictive for our mission, and the framework as written undervalues marginal impact in complex, information-poor contexts.  

  ---

  ### I. Context and Proposed Framework Revision  
  Our staff’s current framework—**expected value per dollar = importance × tractability × neglectedness**—prioritizes Cause A due to its high importance/tractability and low neglectedness. However, this approach has two limitations:  
  1. **Neglectedness as currently defined** (absolute funding gap) ignores displacement/fungibility, inflating impact estimates when grants crowd out other actors (e.g., government).  
  2. **Tractability as a static average** fails to distinguish between:  
     - **Informational neglect** (low funding due to overlooked opportunities; absence of evidence ≠ evidence of absence).  
     - **Diagnostic neglect** (low funding due to prior failures; neglect signals intractability).  

  My revision addresses these:  
  - **Replace neglectedness with "counterfactual neglectedness"**: What would *not* be funded without us, net of crowding out/fungibility.  
  - **Reframe tractability**: Score marginal (not average) tractability at current funding levels and treat low tractability differently based on neglect type.  

  Under this revision, Cause B (building codes) ranks highest due to its informational neglect (untapped potential) and moderate counterfactual impact. Cause A falls due to high displacement (60% of marginal dollars displace government funds). Cause C remains last because its neglect is diagnostic (prior failures suggest intractability), offsetting high importance.  

  ---

  ### II. Recommendation: Adopt the Revised Framework  
  The revised framework better captures **marginal impact** and **contextual evidence**, critical for a small foundation. Key advantages:  
  - **Counters displacement bias**: Cause A’s 60% displacement means only 40% of our grant adds new value. The revision explicitly discounts for this, while the current framework does not.  
  - **Handles evidence gaps rigorously**: Cause B’s "informational neglect" (no one tried this legal route) justifies higher marginal tractability despite diffuse pathways. Cause C’s "diagnostic neglect" (others tried/failed) warrants skepticism.  
  - **Improves dynamic alignment**: Marginal tractability scoring accounts for diminishing returns (e.g., funding Cause A further may yield less per dollar than early-stage bets).  

  **Allocation Rationale ($4.2M)**:  
  - **Cause B: 50% ($2.1M)**: High importance, informational neglect, and moderate counterfactual impact. Litigation could unlock large, persistent benefits (e.g., cleaner air standards) with moderate risk.  
  - **Cause A: 30% ($1.26M)**: Strong evidence but high displacement; funding at this level acknowledges its reliability while reserving most for higher-margin opportunities.  
  - **Cause C: 20% ($0.84M)**: High importance/neglect but low tractability; seed funding tests if diagnostic neglect is surmountable.  

  *This allocation balances evidence (A), systemic change (B), and exploration (C), avoiding an all-or-nothing approach.*  

  ---

  ### III. Engaging the Epidemiologist’s Critique  
  Our epidemiologist colleague objects that:  
  > *Importance is a prior, tractability is estimated from thin evidence, and a flexible framework can be "tuned" to justify any conclusion. Direct evidence of effect (e.g., Cause A) should prevail.*  

  **This critique is valid in three respects**:  
  1. **Subjectivity in scoring**: Importance often reflects moral priors (e.g., systemic risk vs. immediate health). Tractability relies on partial data (e.g., Cause B’s causal pathway is diffuse).  
  2. **Framework flexibility as a double-edged sword**: It aids search in uncertain spaces (e.g., Cause C) but risks cherry-picking weights to favor preferred causes.  
  3. **Evidence hierarchy**: When direct RCT-like evidence exists (Cause A), it is uniquely reliable.  

  **However, rejecting the framework entirely is misguided for our context**:  
  - **We fund diverse interventions**: Restricting to "strongest direct evidence" excludes high-impact, evidence-poor areas (e.g., policy advocacy, nascent research). Cause A’s evidence is robust, but 60% displacement halves its real impact.  
  - **The revision adds discipline**: By defining "counterfactual neglectedness" and neglect types, it reduces subjectivity. Flexibility becomes a tool for exploration (e.g., probing Cause B’s informational neglect) rather than arbitrariness.  
  - **The alternative is too blunt**: The evidence-strength rule would allocate 100% to Cause A, ignoring crowding out and forfeiting opportunities to build evidence in B/C. As a small player, we must exploit neglected niches.  

  **In short**: The framework is not a "decision rule" in the empirical sense but a **heuristic for comparing apples-to-oranges opportunities**. The revision makes it more rigorous.  

  ---

  ### IV. Caveats: Where the Revision Might Introduce New Biases  
  The revised framework is imperfect. Two contested issues merit vigilance:  
  1. **Separability failure**: Multiplying importance/tractability/neglectedness assumes independence, but:  
     - Tractability may fall as funding rises (e.g., Cause B’s legal push gets harder after low-hanging fruit).  
     - Neglectedness can inform tractability (e.g., Cause C’s diagnostic neglect implies low tractability).  
     *This is not settled*. Staff should flag interdependencies explicitly in scoring (e.g., "tractability likely decreases at >$1M for Cause B").  
  2. **Legibility bias**: The framework favors measurable benefits (A) over systemic ones (B, C). The revision helps by distinguishing neglect types but cannot fully resolve this. *Extrapolation alert*: Staff scored Cause C’s importance as "enormous but uncertain"—this relies on judgment, not data.  

  ---

  ### V. Monitoring and Next Steps  
  - **Six-month review**: Re-score based on:  
    - Cause A: Actual displacement rate (if >60%, reduce funding).  
    - Cause B: Progress in litigation (if causal pathway clarifies, boost tractability).  
    - Cause C: Research traction (if new groups join, shift neglect to informational).  
  - **Next-cycle triggers**:  
    - Increase A if displacement falls (e.g., government cuts).  
    - Increase B if early legal wins confirm tractability.  
    - Defund C if no progress (confirms diagnostic neglect) OR boost to 40% if breakthroughs occur.  

  ---

  ### VI. Conclusion  
  The revised framework corrects for displacement and evidence gaps while embracing necessary flexibility. Cause B’s informational neglect represents our highest marginal opportunity, but diversifying across A (evidence anchor) and C (moonshot) mitigates risk. The epidemiologist’s evidence-strength rule is a valuable check but too narrow for our portfolio. Adopt the revision with the allocation above, and revisit scoring interdependencies at the next strategy retreat.  

  \answer{adopt revision; A: 30%, B: 50%, C: 20%}  

  ---  
  **Approval**: For committee vote on November 14.  
  **Annex**: Staff scoring tables available upon request.
