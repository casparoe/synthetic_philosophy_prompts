     - "Average them (30%)" → Leaf 6  
     - "Use a weighted average favoring extremes" → Leaf 4  

  ---

  ### Leaf Legend
  - **Leaf 1: Full-strength weighted-average view (Expected Utility)**  
    *Awkward commitment:* Must accept any gamble with positive expected value, even if sourced from an untrusted model.  
  - **Leaf 2: Cyclic rankings acknowledged**  
    *Awkward commitment:* Will knowingly "walk" into a dominated outcome (e.g., A9) if steps seem locally optimal.  
  - **Leaf 3: Separate weighting for gains vs. losses (Prospect Theory)**  
    *Awkward commitment:* Might reject a +EV gamble in gains but accept a -EV gamble in losses.  
  - **Leaf 4: Weight probabilities by outcome ranking (Rank-Dependent Utility)**  
    *Awkward commitment:* A 1% chance of catastrophe might be weighted more than a 1% chance of minor loss.  
  - **Leaf 5: Worst-case over a probability set (Maximin Expected Utility)**  
    *Awkward commitment:* Ignores all non-worst-case scenarios, even if overwhelmingly likely.  
  - **Leaf 6: Average over probability set + ambiguity aversion (Smooth Ambiguity)**  
    *Awkward commitment:* Pays to avoid ambiguity even when average probabilities match "known" risks.  
  - **Leaf 7: Hard threshold (Lexicographic Safety)**  
    *Awkward commitment:* Will sacrifice arbitrary benefits to avoid tiny risks of threshold-crossing.  
  - **Leaf 8: Menu-dependent choice (Context-Dependent Utility)**  
    *Awkward commitment:* Adding a clearly inferior option can reverse preferences between two others.  
  - **Leaf 9: Incomparable pairs (Incomplete Preferences)**  
    *Awkward commitment:* May refuse to choose between two viable options despite urgent need.

