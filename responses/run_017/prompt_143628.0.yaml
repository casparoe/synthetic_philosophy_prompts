answer: |-
  ### Cases
  **Case A (Symbiotic Biofilm):** Numerous fungal hyphae and bacterial cells are interwoven in a dense mat. Adjacent cells are chemically bonded via extracellular polymers, forming a continuous surface. Fluids flow steadily through interconnected channels, carrying nutrients from the bacterial cells to the fungal hyphae and waste products in reverse. When mechanically probed, all cells displace cohesively as a unit. Metabolic processes are active: bacterial cells fix nitrogen, fungal cells metabolize it, and both types exchange compounds via the fluid flow.  

  **Case B (Synthetic Scaffold):** The same fungal hyphae and bacterial cells, identically bonded, with identical fluid flow patterns through identical channels. When mechanically probed, they displace cohesively as in A. However, the bacterial cells are metabolically inert (killed via a targeted cytotoxin that halts all biochemical activity while preserving structural integrity). Fungal hyphae remain metabolically active, absorbing nutrients from the fluid flow (now externally supplemented to match A’s rates).  

  ### Verdicts and Reasons  
  - **Nihilism:** No composition in A or B. *Why:* Nihilism denies composition entirely; only simples (cells/molecules) exist.  
  - **Universalism:** Composition in both A and B. *Why:* Any plurality composes something; the arrangement is arbitrary.  
  - **Life Criterion:** Composes in A, not in B. *Why:* In A, the metabolic interdependence constitutes a unified life (cf. van Inwagen: "life" requires self-sustaining, goal-directed activity). In B, the bacterial cells are dead matter; only the fungal hyphae constitute a life, but they don’t compose with inert parts.  
  - **Contact Criterion:** Composes in both A and B. *Why:* All cells are bonded and topologically continuous; contact is identical in both cases.  
  - **Non-Redundancy:** Composes in A, not in B. *Why:* In A, nitrogen fixation and metabolic exchange require both fungal and bacterial cells; no proper subset can perform this. In B, the fungal hyphae perform all metabolic activity alone; dead bacterial cells contribute no "activity" (as they are inert), so no joint performance occurs.  

  ### Key Feature and Its Role  
  **Feature:** Metabolic activity of the bacterial cells.  
  - **Effect of removal:** If bacterial cells are alive in both cases, all theories except nihilism say "composes" in both (universalism, contact, life, and Non-Redundancy agree due to interdependence). If dead in both, life criterion and Non-Redundancy say "no composition" in both (only fungal hyphae might compose, but not with bacteria), while contact and universalism still say "composes." The flip *requires* the metabolic difference to generate disagreement; without it, theories converge (no flip).  

  ### Continuous Process  
  This pair can be modeled as endpoints of a gradual process: introduce a cytotoxin that slowly halts bacterial metabolism while preserving structure. Contact descriptors (bonding, flow, cohesion) change continuously, but the life criterion flips discontinuously at metabolic cessation. Non-Redundancy flips similarly if "activity" requires metabolic contribution. A continuous process *can* be done here because metabolic death needn’t alter physical descriptors.  

  ### Parity Objection: Steelman and Assessment  
  **Strongest Moderate Reply:** The life criterion isn’t gerrymandered—it tracks a *scientifically objective discontinuity*: the presence of a unified, self-sustaining biological process. Life is a natural kind with causal unity (e.g., homeostasis, reproduction) that mere contact lacks. Choosing "life" is principled because it aligns with biology’s joints (e.g., defining organisms), avoiding arbitrariness. Contact, in contrast, is merely structural and fails to distinguish collaborative from coincidental unity.  

  **Honest Read:** This pair *harms* moderates. It highlights that composition facts depend entirely on a non-structural feature (metabolism) invisible to contact descriptors. Since the physical base is identical, the life criterion appears "tacked on" to salvage intuition, collapsing into brutalism ("life just is the criterion, no deeper reason"). Non-Redundancy shadows life here, but both face the same instability: they must accept that composition is brute or admit universalism (as any "joint" is discretionary).  

  ---  
  **Why this satisfies your constraints:**  
  - (1) Identical contact descriptors: bonding, flow, cohesion, and motion are matched. A biologist given only these couldn’t distinguish A from B.  
  - (2) Life criterion flips clearly: A has a metabolic symbiosis constituting a life; B has dead bacterial cells, so no joint life.  
  - (3) No vagueness: Bacterial death is binary (metabolism on/off); no borderline cases.  
  - (4) Realistic: Uses ordinary microbial biology (biofilms) with no exotic elements.  
  - (5) No consciousness: Fungal and bacterial cells lack subjectivity.  
  - (6) No singular terms: Described via cells ("fungal hyphae," "bacterial cells"), bonding, flow, and motion.  
  - (7) Continuous process achievable: Metabolic shutdown needn’t alter physical descriptors.  
  - Non-Redundancy shadows life here, but if altered (e.g., if "activity" included passive structural roles), it could peel off—this setup shows it doesn’t inherently solve instability.
