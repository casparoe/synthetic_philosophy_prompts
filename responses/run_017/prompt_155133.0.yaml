  ### Restatement in ML/Probabilistic Framework Vocabulary

  **Judy Benjamin Case Setup:**
  - **Latent variables:** Binary variables \(A\) (in Second Company's area) and \(B\) (in Second Battalion's area).
  - **Prior joint distribution \(P(A, B)\):**
    - \(P(A=1, B=1) = 0.2\)
    - \(P(A=1, B=0) = 0.3\)
    - \(P(A=0, B=1) = 0.1\)
    - \(P(A=0, B=0) = 0.4\)
  - **Datum:** Learning the logical conditional "If \(A=1\), then \(B=1\)" (equivalent to \(\neg A \lor B\), or the negation of \((A=1, B=0)\)). This rules out the \((A=1, B=0)\) state but provides no direct observation of \(A\) or \(B\).

  **Disputed Posterior Updates:**
  1. **Conditioning Camp (I-projection onto \(\mathcal{Q}_1\)):**
     - **Constraint:** \(Q(A=1, B=0) = 0\) (hard exclusion of the ruled-out state).
     - **Update:** Standard Bayesian conditioning on \(\neg (A=1, B=0)\).  
       \[
       Q_1(\cdot) = P(\cdot \mid \neg (A=1, B=0))
       \]
     - **Result:** \(Q_1(A=1, B=1) \approx 0.286\), \(Q_1(A=0, B=1) \approx 0.143\), \(Q_1(A=0, B=0) \approx 0.571\).  
       Marginal \(Q_1(A=1) \approx 0.286\) (reduced from \(P(A=1) = 0.5\)).

  2. **Marginal-Preserving Camp (I-projection onto \(\mathcal{Q}_2\)):**
     - **Constraints:** 
       - \(Q(A=1, B=0) = 0\) (exclusion),
       - \(Q(A=1) = P(A=1) = 0.5\) (marginal rigidity),
       - Implicitly preserves the conditional distribution given \(A=0\): \(Q(B \mid A=0) = P(B \mid A=0)\).
     - **Update:** Minimize \(\text{D}_{KL}(Q \Vert P)\) subject to constraints.  
       \[
       Q_2(A=1, B=1) = 0.5, \quad Q_2(A=0, B=1) = 0.1, \quad Q_2(A=0, B=0) = 0.4.
       \]
     - **Result:** \(Q_2(A=1) = 0.5\), \(Q_2(B=1 \mid A=1) = 1\).

  **Core Dispute:**  
  The disagreement reduces to **which constraint set the datum implies**:
  - \(\mathcal{Q}_1 = \{ Q : Q(A=1, B=0) = 0 \}\) (camp 1).
  - \(\mathcal{Q}_2 = \{ Q : Q(A=1, B=0) = 0, \, Q(A=1) = 0.5, \, Q(B \mid A=0) = P(B \mid A=0) \}\) (camp 2).  
  Both posteriors are unique I-projections of \(P\) onto their respective sets. The datum ("learning a conditional") does not specify which constraints apply.

  ### Residue Report: Mapping and Fudges
  #### Clean Mappings
  1. **I-projections as updates:**  
     Both camps minimize \(\text{D}_{KL}(Q \Vert P)\) (I-projections) onto convex sets. Camp 1 uses one linear constraint; camp 2 uses three (reducible to two independent ones). This is a natural fit for VI/PGM frameworks.
  2. **Softened version (virtual evidence):**  
     If the datum updates \(P(B=1 \mid A=1)\) to \(0.9\) (not 1), the constraint \(Q(B=1 \mid A=1) = 0.9\) is linear in \(Q(A,B)\). The I-projection is unique and computable via:
     - **Virtual evidence:** Introduce a binary virtual node \(E\) with likelihood ratios:
       \[
       \frac{L(A=1, B=1)}{L(A=1, B=0)} = \frac{0.9 / P(B=1 \mid A=1)}{0.1 / P(B=0 \mid A=1)} = \frac{0.9 / 0.4}{0.1 / 0.6} = 13.5,
       \]
       and \(L(A=0, \cdot) = 1\) (no update). The minimizer corresponds to this specific likelihood (others satisfy the constraint but don't minimize \(\text{D}_{KL}\)).
     - **Privileged status:** This likelihood minimizes \(\text{D}_{KL}\) by preserving \(Q(B \mid A=0) = P(B \mid A=0)\) and \(Q(A)\) as "unchanged as possible" (matches Jeffrey's rule for the partition \(\{A=1, A=0\}\)).
  3. **Conditionals in DAGs:**  
     Adding a deterministic child node \(C := \neg A \lor B\) (material conditional) and conditioning on \(C=1\) yields camp 1's posterior. The "triviality results" (Lewis, etc.) are irrelevant here—they address whether \(P(\text{conditional})\) can equal \(P(B \mid A)\) universally, but in a fixed DAG, \(C\) is well-defined.

  #### Fudges and Assumptions
  1. **Meaning of "learning a conditional":**  
     Fudged by assuming the datum imposes *some* constraint on \(Q\). In reality, the dispute is about whether it implies only \(Q(A=1,B=0)=0\) (camp 1) or also \(Q(A=1)=P(A=1)\) (camp 2). This is smuggled into the constraint sets without justification.
  2. **Marginal rigidity in \(\mathcal{Q}_2\):**  
     Assumed \(Q(A=1) = P(A=1)\) is required, but the datum doesn't specify this. The constraint \(Q(B \mid A=0) = P(B \mid A=0)\) is also assumed (to make \(\mathcal{Q}_2\) closed), but it's not stated in the problem.
  3. **Engineer's proposal (hierarchical Bayes):**  
     Modeling the datum as evidence about a parameter \(\theta = P(B=1 \mid A=1)\):
     - **Works** if \(\theta\) is in a model: E.g., prior \(P(\theta)\), state likelihood \(P(A,B \mid \theta)\). If the datum implies \(\theta = 1\), update \(P(\theta)\) to \(\delta(\theta - 1)\), and recompute \(Q(A,B)\) with \(\theta=1\) (yields camp 2).
     - **Collapses the dispute:** It assumes the datum is about \(\theta\), not the world. This is circular—it assumes camp 2's interpretation.  
       **Problem:** Prior inconsistency if \(P(A=1, B=0) > 0\) but \(\theta=1\) requires it to be 0. You need a hierarchical prior that allows \(P(A=1, B=0 \mid \theta) \propto (1 - \theta)\), but the given prior fixes \(\theta = 0.4\). Uninformative priors don't resolve this.

  #### Unmappable Concepts
  1. **Experience without likelihood functions:**  
     Your friend's objection—that data doesn't "come with" likelihoods—is **a real point**. PGMs require specifying an observation model (likelihood). Choosing between \(\mathcal{Q}_1\) and \(\mathcal{Q}_2\) depends on whether the datum is a "world observation" (camp 1) or a "rule update" (camp 2), which isn't math, it's semantics. No PGM machinery solves this; it's a framework-level gap.
  2. **Reflection principles and "big bad bug":**  
     Van Fraassen's reflection principle requires \(P_t(B \mid A) = \mathbb{E}_t[P_{t+\delta}(B \mid A)]\). Camp 2 violates this if you expect future updates (e.g., learning \(A=1\) would make \(Q_2(B \mid A=1)=1\), but \(P(B \mid A) = 0.4\) now). This is a **genuine connection** but highlights a decision point: violating reflection (camp 2) vs. violating marginal rigidity (camp 1). Not expressible in PGM terms alone.
  3. **Triviality results:**  
     Addressed by DAGs (as above). Residue-free.

  ### Residue Classification
  1. **Choice of constraint set:**  
     - **Hole in framework:** PGMs don't dictate how "learning a conditional" maps to constraints. This is a semantic ambiguity.
  2. **Experience without likelihoods:**  
     - **Hole in framework:** Bayesian updates require likelihood specification; the dispute arises from under-specified evidence semantics.
  3. **Prior inconsistency in hierarchical Bayes:**  
     - **Sign of unprecision:** The philosophers don't specify whether the conditional is "world-factual" (camp 1) or "rule-based" (camp 2). Engineer's proposal assumes the latter, begging the question.
  4. **Reflection principle violation:**  
     - **Sign of unprecision:** Highlights that the camps encode different norms (reflection vs. marginal rigidity), which aren't formalized in the problem.

  ### Recommendations for Your Doc
  - **Frame the dispute** as a choice between constraint sets for I-projections, not update rules. Both camps are "correct" under their assumptions.
  - **Explicitly flag** that PGMs require choosing an observation model (virtual evidence for camp 1, parameter update for camp 2), and this choice isn't determined by probability theory.
  - **Discard the hierarchical Bayes proposal**—it assumes camp 2's stance and doesn't resolve the inconsistency.
  - **Address softened evidence** with virtual nodes + I-projections (clear and uncontroversial).
  - **Ignore triviality results** (moot with DAGs); **mention reflection** as an optional philosophical footnote.

  This clarifies the statistical structure while exposing where philosophy intrudes. No bluffing needed.
