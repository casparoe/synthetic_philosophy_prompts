  Okay, the user is a retired experimental physicist with decades in solid-state chemistry. They've been attending a philosophy reading group focusing on Nietzsche's essay on history. They're trying to understand a phenomenon in their field where historical narratives about foundational figures and events keep changing, but these changes aren't acknowledged. The community venerates a past that's continuously rewritten. They described two episodes: the annual lecture misrepresenting an original paper, and the persistent teaching of a known flawed model. The monument shifts—first a theorist, then an experimentalist, now another figure—each generation acting as if their version was always true.

  The user wants to know if there's an established concept for this. They mention Nietzsche's three histories but feel the critical history doesn't fit because criticism renovates rather than breaks the past. Their reading group is split: one says it's monumental history, another disagrees because the greatness isn't emulated, just the abstract shape of a founder. The user prefers a "carving" over naming—seeking precise distinctions, not just a term. They want to know if existing concepts fit, how, and where they fall short. Also, boundary cases: deliberate vs. unconscious changes, scope (discipline vs. lab), and exclusions like corrections from new evidence.

  First, I need to identify if there's a known concept. The shifting narratives and unacknowledged changes remind me of collective memory studies, like Halbwachs, where groups reshape the past to serve present needs. But collective memory often involves intentional framing, whereas here it's more organic. Then there's Whig history, but the user already dismissed that because the flawed model isn't seen as progress. Nietzsche's monumental history is close, but as the group noted, the emulation aspect is missing—here, it's the structure of having a founder that's key, not the specifics.

  Hmm, the "founder" slot being interchangeable is crucial. It's like the field needs a symbolic origin point, but the occupant can change. That sounds like structural functionalism in sociology—institutions maintain functions through symbolic roles. The function here is creating continuity and identity. The veneration isn't about truth but utility, which aligns with pragmatism. Dewey's idea of "warranted assertibility" comes to mind, where beliefs are valued for their function, not truth.

  The renovation through criticism is interesting. Instead of dismantling, critiques are absorbed, making the monument "shinier." That's like immune response in systems theory—criticism is incorporated, strengthening the narrative. Also, Kuhn's paradigms: anomalies are resolved within the paradigm, but here it's the historical narrative that adapts. The periodic condemnation acts as a ritual, renewing commitment. Bordieu's habitus might fit—practices perpetuated unconsciously, like the coffee-driven drifts.

  For established concepts:
  - Collective memory: Explains narrative shifts serving present needs, but typically intentional; here it's more unconscious.
  - Invented tradition (Hobsbawm): Rituals (like the lecture) that establish continuity with a suitable past. Fits the annual lecture retelling, but traditions are usually stable, whereas here the founder changes.
  - Structural functionalism: The "founder" role fulfills a need for origin, regardless of who fills it. Explains interchangeability but might oversimplify agency.
  - Pragmatism: Truth as utility. Explains why a known wrong model is still taught—it's useful for pedagogy and identity.

  Boundary cases:
  - Deliberate changes (funding/politics) vs. unconscious drifts: Both could be the same phenomenon if the function (maintaining identity/continuity) is served. Intent might not matter; outcome does.
  - Scope: A lab's oral tradition could have this if it has rituals and a need for internal cohesion. Requires a community with shared practices.
  - Exclusion: New evidence (attic letters) leading to correction is different because it's truth-driven, not function-driven. The change is acknowledged, not absorbed silently.

  Reading group's disagreement: Partly verbal. One member says it's monumental history, but Nietzsche's version requires emulation. Here, it's the structural need for a founder, not the inspirational content. So it's a subtype where the monument's form matters more than content. The other member is right that it's not purely monumental because the motivational aspect is absent.

  Best fitting concept: Perhaps "functional historiography." It emphasizes the utility of historical narratives in maintaining community cohesion, pedagogy, and identity. The narratives are malleable as long as they serve these functions. Criticism is metabolized because it reinforces engagement, not because it corrects the record.

  Why it fits:
  - Explains preservation of use over truth (flawed model still taught).
  - Accounts for interchangeable founders (the slot is functional).
  - Critiques renovate by proving the narrative's resilience.
  - Unconscious drifts are natural as needs evolve; deliberate changes also serve functions.

  Misfits: Collective memory often has conscious construction; here it's more organic. Invented traditions are usually stable; here narratives shift. But functional historiography accommodates both if the core function persists.

  Term suggestion: "Mythopoeic maintenance." Mythopoeic meaning myth-making, maintenance indicating sustaining community functions. Defines it as the unconscious process where a community adapts its origin myths to current needs, absorbing critiques as renewals. Boundary: Excludes intentional myth-making for external reasons (politics) unless it becomes internalized. A lab's tradition counts if it has shared rituals; new evidence corrections don't count as they disrupt the function-driven narrative.

  So, the answer would structure this, comparing concepts, identifying functional historiography as closest, coining "mythopoeic maintenance" for precision, and resolving the group's disagreement as focusing on different aspects of monumental history.
answer: |-
  Your description captures a sophisticated, dynamic phenomenon in the historical consciousness of scientific communities—one that doesn't slot neatly into existing concepts but intersects with several. Below, I'll carve the conceptual space by evaluating established ideas, their fits and misfits, propose a tight definition for your case, and address boundary questions. I'll then resolve your reading group's disagreement.

  ### Established Concepts & Their Fit
  1. **Collective Memory (Halbwachs, Nora)**  
     - **What it explains**: The social reconstruction of the past to serve present needs (e.g., the annual lecture creating cohesion). The "interchangeable founder" aligns with Halbwachs' view that memory is framed by current group structures.  
     - **Misfit**: Collective memory often implies conscious curation (e.g., national myths). Your case is more *organic*—shifts happen through "coffee-drift," not deliberate policy. It also struggles with the *absorption of criticism*: Nietzschean critique should disrupt memory, but here it reinforces.  
     - **Verdict**: Partial fit. Explains narrative fluidity but not the immune-like response to critique.

  2. **Invented Tradition (Hobsbawm)**  
     - **What it explains**: Rituals (e.g., the lecture) that establish continuity with a "suitable past." Teaching the flawed model as a pedagogical rite mirrors this. The founder's evolving identity fits, as traditions often retrofit origins.  
     - **Misfit**: Invented traditions are typically *stable* once established (e.g., coronation ceremonies). Your field's founder-role is a *shape-shifting vessel*—first theorist, then experimentalist, now a "neglected" figure—with no fixed content.  
     - **Verdict**: Explains ritualistic aspects but not the plasticity of the "monument."

  3. **Structural Functionalism (Durkheim, Merton)**  
     - **What it explains**: The *purpose* of the narrative: fostering identity ("great work is possible here"), pedagogy (simplified model for newcomers), and a benchmark ("thing people measure against"). Veneration as "use rather than truth" is pure functionalism—e.g., Merton's "latent functions."  
     - **Misfit**: Doesn't fully account for *historical mutability*. Functionalists might see stability; your case shows adaptive evolution. Also, ignores how criticism becomes *nutrient* (renovation).  
     - **Verdict**: Best at explaining *why* the system persists, but weak on *how* it changes.

  4. **Monumental History (Nietzsche)**  
     - **What it explains**: The inspirational role of the past (e.g., spurring grad students). The "shinier after criticism" effect mirrors Nietzsche's warning that monumentalism avoids honest engagement.  
     - **Misfit**: Nietzsche assumes monumentalism *fixates* on heroic exemplars (e.g., "greatness once possible"). Your field preserves an *abstract role* ("there was a founder") with interchangeable occupants. The *lack of emulation* is key—it’s about continuity, not ambition.  
     - **Verdict**: Explains surface veneration but not the structural vacancy at its core.

  ### The Best Fit: A Hybrid  
  Your case is a **functional monumentalization**—a pragmatic, evolving historiography where the past is a tool for community cohesion, not truth or inspiration. Critiques are "metabolized" because they prove the narrative’s resilience, reinforcing group identity. The "founder" is a *role*, not a person, filled by whoever best serves current needs.  

  ### Proposed Term: **Mythopoeic Maintenance**  
  - **Definition**: *The unconscious, adaptive process by which a community preserves its functional identity through mutable origin myths, where criticism is absorbed as a renewing ritual rather than a corrective force.*  
  - **Core mechanics**:  
    - **Utility-driven**: Truth is irrelevant; the myth must serve pedagogy, cohesion, or legitimacy.  
    - **Plasticity**: Figures/events are swapped into archetypal roles (e.g., "Founder," "Skeptic") as needs shift.  
    - **Metabolic criticism**: Attacks are incorporated as "proof" of the myth’s enduring value.  
    - **Amnesia**: Rewriting is invisible; each generation experiences the myth as eternal.  

  ### Boundary Cases  
  1. **Deliberate vs. Unconscious Change**:  
     - Same phenomenon if the *function* (cohesion/identity) is identical. A committee altering history for funding retains the myth’s utility; "coffee-drift" is organic adaptation. Both are mythopoeic maintenance.  
     - *Not the same* if the change serves *external* goals (e.g., political compliance) without reinforcing internal identity.  

  2. **Scope (Discipline vs. Lab)**:  
     - Requires a community with *shared rituals* (e.g., lectures, textbooks, oral traditions). A single lab’s lore counts if it has recurring narratives (e.g., "Lab Founder’s Serendipitous Discovery").  
     - *Fails* for isolated individuals or contexts without communal reinforcement.  

  3. **What Doesn’t Count**:  
     - **New evidence revisions** (e.g., attic letters): These are *corrective*, driven by truth-seeking. Visible change is superficial; the *mechanism* differs. Mythopoeic maintenance prioritizes function, not accuracy.  
     - **Whig history**: Assumes progress; here, the flawed model isn’t a "step forward" but a *fixed benchmark*.  
     - **Critical history (Nietzsche)**: Seeks liberation from the past; here, criticism *strengthens* it.  

  ### Resolving Your Reading Group's Disagreement  
  - **Verbal? Partly**. Both members grasp key facets but stress different Nietzschean elements:  
    - **"It’s monumental"** is right about *veneration* but wrong about *emulation*. Nietzsche’s monument requires exemplars ("go do likewise"); your field venerates an *empty throne*.  
    - **"It’s not monumental"** correctly notes the missing motivational element but underplays the *ritual function*.  
  - **Non-verbal core**: Nietzsche’s typology can’t fully capture *adaptive utility*. Monumentalism is static; your case is dynamic. The disagreement reflects tension between Nietzsche’s categories and your phenomenon’s hybrid nature.  

  ### Why This Fits Best  
  - **Carves reality**: Explains all three details:  
    1. Veneration without credence → *Utility over truth*.  
    2. Monument built from failure → *Functional benchmark*.  
    3. Criticism renovates → *Metabolic absorption*.  
  - **Distinguishes from neighbors**:  
    - Vs. **collective memory**: Focuses on *systemic function* (not just social framing).  
    - Vs. **invented tradition**: Emphasizes *continuous adaptation* (not fixed rituals).  
  - **Predictive power**: If funding dried up or the field fragmented, the myth would harden or fracture—functional needs dictate form.  

  In essence, your field practices **mythopoeic maintenance**: a living historiography where the past is clay, not marble, shaped to hold the present together. The "monument" is a scaffold, not a statue.
