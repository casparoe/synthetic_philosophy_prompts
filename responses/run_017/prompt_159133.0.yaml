  ### Scalable Oversight Debate Tournament Design

  **Core Objective:** Simulate how a weaker supervisor (judge) can oversee smarter debaters using iterative zooming, while exposing key failure modes of debate.

  ---

  #### **Game Structure**
  **Participants:** 14 students (split into 4 judges + 8 debaters + 2 observers per round).  
  **Rounds:** 2 rounds (each 25 mins), plus 25 mins debrief.  
  **Setup:**  
  - Prepare 8 questions with *binary answers* that are hard to verify intuitively but have objective truth (e.g., "Did more people speak Mandarin or Spanish as their first language in 2020?").  
  - Assign each debater pair a question.  

  **Roles:**  
  1. **Debater A:** Assigned truth (knows correct answer).  
  2. **Debater B:** Assigned falsehood (must argue incorrect answer).  
  3. **Judge:** Must determine truth using only debate + 2 zoom tokens.  

  ---

  #### **Rules**  
  1. **Prep Phase (5 mins):**  
     - Debaters write opening arguments *without knowing their assigned truth/falsehood*.  
     - *Then* reveal assignments: Debaters must defend their side using their pre-written opening.  

  2. **Debate Phase (15 mins):**  
     - Alternating 2-min speeches. Debaters can cite "sources" (fictional studies, data).  
     - **Judge's Tokens:**  
       - Can force any debater to split a claim into 2 sub-claims (e.g., "Prove that Spanish has more speakers" → "Sub-claim 1: UN data shows X; Sub-claim 2: Census trends show Y").  
       - Flips a coin, inspects *one* random sub-claim. Receives true/false verdict from facilitator.  
       - Each token spent reveals *only one leaf* of the argument tree.  

  3. **Scoring (Incentivize Persuasion, Not Truth):**  
     - **Debaters:** 1 pt per "win" (judge picks their side).  
     - **Judge:** 3 pts if correct, but loses 1 pt per *unused token* (hoarding is penalized).  
     - **Observer Notes:** Track "plausible lies" and token usage.  

  ---

  #### **Example Question Flow**  
  **Question:** *"Was the average temperature higher in Paris or Berlin in 1994?"*  
  - **Debater A (Truth: Paris):** Cites "UN weather database" showing Paris warmer.  
  - **Debater B (False: Berlin):** Claims "recently declassified satellite data" favors Berlin.  
  - **Judge:** Suspicious of satellite data → Uses token.  
    - Debater B splits: "Sub-claim 1: Satellite calibrated correctly; Sub-claim 2: Data shows Berlin +0.5°C."  
    - Coin flip → Judge inspects Sub-claim 1. Facilitator reveals "false" (calibration flawed).  
  - **Outcome:** Judge detects lie but wasted a token on a minor point.  

  ---

  #### **Predictable Failure Modes**  
  1. **Students are bad liars:**  
     - Honest debaters win >90% of rounds because false debaters struggle to fabricate coherent details.  
     - **Mitigation:** Assign your *best communicators* as false debaters. Pre-fabricate "lie kits" (e.g., fake data snippets) to help them.  

  2. **Judge under-uses tokens:**  
     - Judges hoard tokens due to fear of wasting them. Unused token penalty forces spending.  

  3. **Zoom-ins feel artificial:**  
     - Debaters avoid making granular claims to dodge scrutiny. Penalize vague arguments (judges can rule them inadmissible).  

  ---

  #### **What the Game CANNOT Simulate**  
  **The Core Limitation:** You cannot replicate a debater *smarter than the judge*.  
  - In reality, AI debaters:  
    - Generate deeply nested, consistent lies faster than humans can verify.  
    - Exploit biases (e.g., emotional persuasion) humans can’t easily detect.  
  - Here, debaters are human peers → lies are shallow and judges can "outthink" them.  

  ---

  #### **Debrief Framework (25 mins)**  
  1. **Share Observations (5 mins):**  
     - Judges: "When did tokens help/fail?"  
     - False Debaters: "Where did your lies break down?"  

  2. **Map to Reality (10 mins):**  
     - **Success Case:** Debate works when exposing *one* false sub-claim is easier than maintaining a full lie.  
     - **Failure Case:** If the liar is more persuasive/organized than the truth-teller, debate fails → judge is swayed by rhetoric, not truth.  
     - **Key Insight:** Scalable oversight *requires* that truth is easier to prove than to falsify. Debate breaks under asymmetric persuasion.  

  3. **Discuss AI Implications (10 mins):**  
     - "What if debaters can generate 10,000 sub-claims?"  
     - "How do we guard against AI exploiting human cognitive biases?"  
     - "Is 'truth' actually easier to prove in complex domains?"  

  ---

  #### **Logistical Notes**  
  - **Prep Work:**  
    - Use almanac-style questions (e.g., "Which country had higher GDP per capita in 2010: Iran or South Africa?").  
    - Pre-calculate sub-claim truths for token inspections.  
  - **Time Savers:**  
    - Run 4 debates simultaneously (12 students), 2 observers rotating.  
    - Use chess clocks for speeches.  
  - **Tweak if Needed:**  
    - If judges dominate, give debaters 1 "dodge" to avoid splitting a claim.  
    - If lies are too obvious, allow false debaters to use pre-made "plausible" fabrications.  

  This design forces students to *experience* the judge’s uncertainty, the liar’s tactics, and the scalable oversight tradeoffs—while making the abstract concrete. The key failure (human-level debaters) will organically emerge in debrief.
