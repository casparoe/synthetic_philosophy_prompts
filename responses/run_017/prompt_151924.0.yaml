prompt: |-
  I'm designing one session of our department's upper-level course on democratic innovation — I'm a PhD student in political theory and I have the "institutional design" block to myself: 17 students, mostly third-years who have already had the survey in normative theory, one 90-minute meeting, a room with movable chairs, and no budget beyond printing. My allotted topic is selection rules: sortition, term limits, and the standing complaint about career politicians.

  I don't want to run it as a comparison of three reform packages, because that is what the reading does and they will arrive having read it. What I want them to feel is something I have started calling the migration thesis: the claim that any rule which lowers the return to holding office does not lower the assembly's need for institutional knowledge, it only relocates the people who hold that knowledge to actors nobody selected — permanent staff, lobbyists, the civil service, or the members of the cohort before. Relatedly, I want them to notice that "career politician" bundles at least two different complaints that the standard reform menu answers separately: a complaint about who gets filtered in (the selection runs on the desire to hold office, so it selects for a certain kind of person regardless of what they then do) and a complaint about whom the officeholder must answer to in order to keep the job.

  The design I keep sketching and cannot get to work: the same small legislative game played two or three times over a fictional mid-sized regional assembly's budget — a fixed pool, maybe five named line items, coalition-building required — with the selection rule swapped between rounds while everything else is held constant. A few students are drawn at the start and stay for the whole session as a permanent Secretariat: they alone have the full rulebook, they convert any member's idea into votable text, and they set the order of business. They score on how many provisions they drafted survive to a final vote, so their interest is in being needed rather than in any particular outcome. Members get private district cards and score on how close the outcome is to their district's priorities. Round one is ordinary re-electability; round two is a hard two-term limit; round three is selection by lot for a single non-renewable term. Members can claw power back from the Secretariat by spending floor time, which is scarce and which competes with actually passing things. I am also toying with a fourth, hybrid rule — call it cohort pairing: each member chosen by lot is shadowed by a randomly drawn veteran of the immediately preceding cohort, who may speak, brief, and draft but not vote, and whose own prospects after office rise with the pair's record — as a way of testing whether memory can be institutionalized without re-electability. Tell me whether that fourth round belongs in 90 minutes or whether it buries the debrief.

  What I need from you: a runnable activity on these lines or a better one — role sheets and a one-page rulebook I can print, a payoff scheme in points rather than money, a minute-by-minute timeline for one facilitator with no props beyond index cards, a deck of cards, and a timer. The debrief should map specific moments the students will actually have had onto the migration thesis and onto the two complaints I want separated, and it should let them name the diagnosis before I do. Also: what will predictably go wrong the first time I run it and how I recover without breaking character, and which part of the idea the game cannot reach at all and I will simply have to assert afterwards — I assume real sortition's descriptive representativeness and anything depending on days of facilitated deliberation are in that category, but tell me what else.
reasoning: |-
  Okay, the user is designing a session on democratic innovation focusing on selection rules. They want to move beyond comparing sortition, term limits, and career politicians as presented in the readings. Their core goal is to illustrate the "migration thesis" - that reducing returns to office doesn't eliminate the need for institutional knowledge but shifts it elsewhere. They also want students to distinguish between two complaints about career politicians: selection bias and accountability pressures.

  The user has sketched a legislative simulation game with multiple rounds using different selection rules. They need practical help making it work within 90 minutes: printable materials, scoring systems, timing, and troubleshooting advice. They're particularly concerned about whether to include a fourth "cohort pairing" round and how to structure debriefing to achieve learning goals.

  Hmm... several challenges here. First, compressing three legislative sessions plus debrief into 90 minutes seems tight. The cohort pairing round might be too ambitious - better to focus on core mechanisms. Second, the Secretariat role needs to be designed carefully to demonstrate knowledge migration without dominating. Third, scoring must incentivize behaviors that reveal the target phenomena.

  For materials, we'll need simple role sheets, a one-page rulebook, and district preference cards. Scoring should use points tied to district alignment and (for Secretariat) proposal survival rates. Timing breakdown: 10 min setup, 20 min per round (3 rounds), 20 min debrief. Skip the fourth round to allow proper debriefing.

  Key troubleshooting points: Students might under-negotiate in early rounds, Secretariat could be too passive/dominant, or scoring might not drive intended behaviors. Contingency plans: discreetly prompt negotiation, adjust Secretariat scoring mid-game, simplify rules if needed.

  The simulation won't capture descriptive representation or deep deliberation - these will need explicit mention in debrief. Focus debrief on moments where institutional knowledge gaps appeared, how Secretariat influence changed across systems, and whether students felt different pressures under each rule.

  The payoff scheme should reward members for district outcomes and Secretariat for proposal adoption. This creates tension between local interests and institutional efficiency that will reveal the migration thesis. For the two complaints, design district cards that require choosing between policy outcomes and re-election concerns in Round 1.

  During debrief, use specific game events to show: 1) how term limits increased Secretariat power (knowledge migration), 2) how sortition changed bargaining dynamics (selection effect), and 3) how accountability pressures differed across systems. Guide students to articulate these before naming the formal concepts.
answer: |-
  Here’s a streamlined, runnable 90-minute simulation designed to surface the **migration thesis** and disentangle the **two complaints about career politicians**, while minimizing setup. Skip the hybrid round to prioritize debrief depth.

  ---

  ### **Game Title:** *The Alaria Assembly: Power, Knowledge & Time*
  *(Regional legislature allocating a €500M budget across 5 fixed sectors: Healthcare, Education, Infrastructure, Environment, Public Safety)*

  **Materials to Print:**
  - **1-page Rulebook** (see below)
  - **17 Role Cards**: 12 Legislator Cards (with district priorities), 5 Secretariat Cards
  - **5 Budget Item Cards** (sectors with € ranges, e.g., "Healthcare: €80M–€120M")
  - **Deck of cards** (for random selection)
  - **Timer**
  - **Index cards** (for proposals)

  ---

  ### **Rulebook (1 Page)**
  #### **Objective**
  *Legislators:* Maximize alignment of final budget with your district’s priorities (scored in points).  
  *Secretariat:* Maximize % of *your drafted proposals* passing final vote.

  #### **Rules**
  1. **Roles**:
     - **Legislators (12)**: Represent districts. Negotiate, vote, propose amendments.
     - **Secretariat (5)**: Draft proposals, set agenda, advise. *Cannot vote.*  
     *(Assign via shuffled deck: Hearts = Secretariat, Clubs/Spades/Diamonds = Legislators)*

  2. **Scoring**:
     - Legislators: 10 pts if budget item matches district priority *exactly*, 5 pts if within range.
     - Secretariat: 5 pts per proposal drafted *that passes*.

  3. **Mechanics**:
     - **Floor Time**: Each legislator has 3 "Time Tokens" (index cards). Spend 1 token to:
       - Propose an amendment *without* Secretariat help.
       - Force a vote on an item out of order.
       - Request Secretariat advice (free, but they control response).
     - **Secretariat Powers**:
       - Convert any *written* idea into a votable proposal.
       - Set the order of voting.
       - Advise legislators (answer questions *if asked*).

  4. **Rounds (20 mins each)**:
     - **Round 1: Re-Election Rule**  
       *Goal: Keep your seat next term.*  
       Secret ballot after budget vote: Re-elect legislators who delivered ≥2 priority items. *Lose 10 pts if not re-elected.*
     - **Round 2: Term Limits**  
       *All legislators are "new" (re-shuffle roles).* No re-election. Single 4-year term.
     - **Round 3: Sortition**  
       *Re-shuffle roles.* Legislators serve one 1-year term. No re-election.

  5. **Process per Round**:
     - 5 mins: Secretariat takes written proposals, sets agenda.
     - 10 mins: Debate/amend/vote (majority wins).
     - 5 mins: Calculate scores, announce re-elections (Round 1 only).

  ---

  ### **Timeline (90 Mins Total)**
  1. **Setup (10 mins)**:
     - Distribute roles, rulebooks, budget cards.  
     - Secretariats huddle; Legislators read district priorities.  
     - Explain rules briefly: *"Focus on your scoring goals. Secretariat controls process; Legislators control Time Tokens."*

  2. **Round 1: Re-Election (20 mins)**  
     *Observe:* Coalition-building, deference to Secretariat, re-election anxiety.

  3. **Round 2: Term Limits (20 mins)**  
     *Reset roles randomly.*  
     *Observe:* Rash decisions? Secretariat dominance? Reduced negotiation?

  4. **Round 3: Sortition (20 mins)**  
     *Reset roles randomly.*  
     *Observe:* Confusion? Reliance on Secretariat? Token use surges?

  5. **Debrief (20 mins)** — **Crucial: Use student experiences to surface concepts:**
     - **Migration Thesis**:  
       *"In Rounds 2/3, who held crucial knowledge? How did the Secretariat’s power change? Where did ‘experience’ live?"*  
       → *Guide them to note Secretariat’s growing influence without re-electable members.*
     - **Two Complaints**:  
       *"In Round 1, what pressured you more: pleasing voters or building coalitions? In Round 3, did you care about voter priorities?"*  
       → Contrast **selection bias** (Round 1’s "ambitious" dealers) vs. **accountability** (Round 3’s indifference to districts).
     - **Final Synthesis**:  
       *"If we reduce officeholder incentives, does knowledge vanish or migrate? Do term limits/sortition fix ‘bad people’ or ‘bad incentives’?"*

  ---

  ### **Predictable Problems & Fixes**
  1. **Problem**: Legislators ignore Time Tokens (underuse power).  
     **Fix**: Announce mid-game: *"Reminder: 3 unspent Tokens = -5 pts. Secretariat now charging 1 Token for advice."*

  2. **Problem**: Secretariat is passive/overbearing.  
     **Fix**: Secretly prompt them: *"Your score depends on proposals passing. Push your drafts!"* or *"Legislators may revolt if you’re too rigid."*

  3. **Problem**: Gridlock in Sortition round.  
     **Fix**: Announce: *"Failure to pass a budget by 18 mins = Secretariat imposes its version. -10 pts for all Legislators."*

  4. **Problem**: Students focus on "winning" not concepts.  
     **Fix**: Debrief starts with: *"Don’t tell me *what* you decided—tell me *how* it felt different each round."*

  ---

  ### **What the Game Can’t Teach (Assert Post-Debrief)**
  1. **Descriptive Representativeness**: Sortition’s core appeal (diverse voices) isn’t modeled here. *"In reality, random selection mirrors society—our game doesn’t capture that transformative potential."*  
  2. **Deliberative Quality**: Real citizen bodies use trained facilitators, multi-day dialogues. *"Our rushed talks can’t replicate the epistemic value of structured deliberation."*  
  3. **Systemic Effects**: *"We isolated one rule change—but real democracies have parties, media, and courts that reshape these dynamics."*  

  ---

  ### **Why This Works**
  - **Migration Thesis**: Secretariat’s rising power in Rounds 2/3 *visibly* demonstrates knowledge relocation.  
  - **Two Complaints**: Round 1’s re-election fear vs. Round 3’s indifference starkly separates accountability from selection motives.  
  - **Low Tech**: Uses only paper, cards, and chairs.  
  - **Debrief-Led**: Students experience dynamics *first*; you name concepts *after* they describe them.  

  Print role cards with clear district priorities (e.g., *"District 7: Must get Healthcare ≥€100M; Infrastructure ≤€90M"*) and emphasize scoring. The compressed tension between **knowledge**, **time**, and **accountability** will make the migration thesis undeniable.
