  The end-of-life/severity exceptions in systems like NICE are particularly interesting - they reveal the tension between pure efficiency and equity concerns. This suggests that even within "standard" QALY frameworks, there's implicit recognition that not all QALYs are ethically equal.

  For the machine-readable answer, I'm leaning toward "cardinal comparable utility" as the indispensable commitment, though that feels almost too obvious. The practice could technically function with weaker assumptions (like only ordinal comparability) but would lose its ethical justification for aggregation across individuals. The refusal to use willingness-to-pay is actually consistent because it rejects the market analogy for life-and-death health decisions.

  The user's scenario reminds me of Sen's critiques of standard welfare economics - perhaps I should mention capability approach alternatives briefly. Their frustration with "turf" explanations is warranted; the difference between health and transport valuation does reflect deeper normative commitments about what kinds of goods should be subject to market logic.
answer: |-
  Here's a reconstruction of the implicit theory behind cost-per-QALY analysis, addressing your core questions:

  ### Core Presuppositions of Standard QALY Practice
  1.  **Cardinal Comparability:** Health-related quality of life (HRQoL) can be measured on a cardinal scale (intervals are meaningful) *and* these scales are comparable across individuals. This is the *foundational* commitment.
  2.  **Common Zero and Unit:** "0" represents a state equivalent to being dead (or sometimes worse than dead) *and* "1" represents full health, *and* the distance between 0 and 1 represents the same underlying "quantity of health" for everyone. This anchors the scale meaningfully for aggregation.
  3.  **Additive Aggregation:** Utility gains (QALYs) are additive across individuals. A QALY gained by person A has the same social value as a QALY gained by person B, irrespective of who they are or their baseline health. This embodies the "a QALY is a QALY" principle.
  4.  **Zero Distributional Weighting:** The social welfare function is utilitarian in QALY space. The distribution of QALYs (e.g., giving a QALY to someone very sick vs. someone healthy) does not inherently matter; only the *sum* matters. Efficiency dominates equity *within the QALY metric*.

  ### Load-Bearing vs. Optional Elements
  *   **Strictly Required (Collapses Without):**
      *   **Cardinal Comparability (1):** Without the ability to say "Person A's gain of 0.2 QALYs is objectively comparable to (and additive with) Person B's gain of 0.2 QALYs," the entire aggregation exercise falls apart. This is the *indispensable core*.
      *   **Common Zero and Unit (2):** While the *definitions* of 0 and 1 can be debated (e.g., is 0 precisely death?), the practice fundamentally requires *some* socially agreed, common anchoring points that are stable and comparable across people. Your personal "anchoring fix" *attempts* to provide this, but introduces problems (see below).
  *   **Practically Required (Practice Changes Fundamentally Without):**
      *   **Additive Aggregation (3):** While technically possible to use cardinal comparable QALYs with a non-additive social welfare function (e.g., one valuing equality), the *standard* cost-per-QALY *practice* of maximizing total QALYs depends on additive aggregation. Without it, the core decision rule vanishes.
      *   **Common Zero and Unit (2 - Practical Level):** While the *theoretical* requirement is comparability, the *operational* practice relies heavily on the specific anchors (death=0, full health=1) derived from TTO/SG to generate the numbers used in calculations.
  *   **Optional (Practice Can Function With/Without, But Changes Interpretation):**
      *   **Zero Distributional Weighting (4):** This is a *normative choice* embedded in the standard practice. The *calculation* can still be done if distribution matters, but the decision rule "maximize total QALYs" would be replaced (e.g., "maximize QALYs subject to an equity constraint" or "apply distributional weights"). End-of-life/severity allowances are *explicit deviations* from this principle.

  ### Addressing Your Proposed "Fix" (Individual Anchoring: 0=Worst, 1=Best)
  *   **Known Problems:**
      1.  **Loss of Comparability:** A unit gain on Person A's scale (e.g., moving from quadriplegia to paraplegia) is fundamentally *incomparable* to a unit gain on Person B's scale (e.g., moving from mild acne to clear skin), even if both represent 0.1 QALYs on their *own* scales. Aggregating these gains becomes meaningless for social resource allocation.
      2.  **Incentive Issues:** Creates perverse incentives to report lower baselines to make gains seem larger numerically.
      3.  **Defining "Worst Possible Life":** Highly problematic, subjective, and potentially unethical (e.g., defining states worse than death consistently across individuals).
      4.  **Breaks Standard Instruments:** Standard HRQoL instruments (EQ-5D, HUI, SF-6D) are explicitly designed around a *common* definition of health states and anchors (death=0, full health=1).

  ### End-of-Life/Severity Allowances & Willingness-to-Pay (WTP) Refusal
  *   **Consistency (Sort of):** These are *acknowledged deviations* from the pure "a QALY is a QALY" principle driven by societal value judgments about fairness and the "rule of rescue." They reveal that the theory's **Zero Distributional Weighting (4)** is *not* an immutable truth but a defeasible normative stance. The core **Cardinal Comparability (1) and Common Unit (2)** remain intact; the deviation happens at the aggregation/weighting stage.
  *   **Inconsistency with WTP Refusal:** The refusal of WTP in health is driven by a *different* ethical commitment: the rejection of using ability-to-pay as a determinant of the value of health/risk reduction. This protects the **Zero Distributional Weighting (4)** principle *from market forces* that would weight rich people more heavily, aligning with a view of health as a special good. Using WTP would fundamentally violate the "a QALY is a QALY" principle by making the *monetary value* of a QALY depend on who receives it (their income).

  ### Impact of Alternative Theories on Practice
  *   **(a) Partial/Ordinal Comparability:** The standard practice *collapses*. Decision-making could only rely on:
      *   **Pareto Improvements:** Only fund interventions where *everyone* gains (rare).
      *   **Partial Orderings:** Identify interventions unambiguously better than others under *all* possible interpersonal comparisons (very restrictive).
      *   **Social Choice Rules:** Use voting or other aggregation mechanisms over ordinal preferences (vulnerable to Arrow-type impossibilities).
  *   **(b) Extra Weight for the Badly Off:** The *calculation* of total QALYs remains possible (presupposing 1 & 2). However, the *decision rule* changes. Instead of maximizing sum(QALYs), you maximize sum(Weight_i * QALY_i), where Weight_i > Weight_j for individuals with worse baseline health. End-of-life allowances are a crude form of this.
  *   **(c) Impartial Spectator (Harsanyi/Rawls):** This provides a powerful *justification* for **Cardinal Comparability (1) and Common Unit (2)** – the spectator uses a single utility function applied to all possible lives. It *can* justify standard QALY maximization (utilitarian spectator). However, it *also* allows for incorporating risk aversion or maxi-min rules, which could lead to weighting schemes like (b). The core *measurement* practice (generating QALY gains) remains similar, but the aggregation rule could differ based on the spectator's risk preferences.

  ### The Indispensable Commitment
  The practice fundamentally requires the belief that health states and improvements can be placed on a cardinal scale where units are meaningfully comparable *across different people*. Without this, adding QALYs across individuals has no coherent meaning for resource allocation.

  \answer{cardinal comparable utility}
