answer: |-
  ### Scenario: The Dining Table Book Shove with Irreversible Friction
  A heavy hardback book is shoved horizontally across a long wooden dining table. It slides under dry friction, which deterministically decelerates it at a constant rate until it comes to rest at position X. The investigator knows the exact friction law (constant deceleration), the book's present state (position X, velocity exactly 0), and all governing Newtonian laws. They have unlimited computational power and precision. Yet, they cannot determine the book's *initial position* or *initial shove velocity*—critical for a forensic dispute over whether a suspect pushed it gently from nearby or forcefully from across the table. The future is predictable: from rest, the book remains at X indefinitely. The failure arises from the dynamics' mathematical structure, not chaos or rounding errors.

  ---

  ### Check: Why Past Facts Remain Unrecoverable
  - **Present state taken**: Position \(X\) (exactly measured), velocity \(v = 0\) (exactly), and all other system variables (e.g., book mass, friction coefficient) known precisely.  
  - **Set of compatible pasts**: Infinitely many initial conditions \((x_i, v_i)\) lead to the same final state \((X, 0)\). For constant deceleration \(a\), the stopping distance is \(d = \frac{v_i^2}{2a}\). If \(d = X - x_i\), then any \((x_i, v_i)\) satisfying \(x_i = X - \frac{v_i^2}{2a}\) (for \(v_i > 0\)) is possible. For example:  
    - Gentle shove: \(v_i = 1\,\text{m/s}\) from \(x_i = X - 0.5\,\text{m}\).  
    - Hard shove: \(v_i = 2\,\text{m/s}\) from \(x_i = X - 2\,\text{m}\).  
    Both stop at \(X\) with \(v = 0\).  
  - **Extra precision doesn't collapse the set**: Increasing precision in \(X\) or \(v\) narrows the *numerical range* of solutions but does not reduce the set to one history. For any exact \((X, 0)\), the equation \(x_i = X - \frac{v_i^2}{2a}\) still defines a continuum of \((x_i, v_i)\) pairs. The system is **non-injective**—many inputs map to one output.  
  - **Future predictability**: From \((X, 0)\), Newton's first law applies: velocity remains 0 indefinitely unless disturbed. No uncertainty exists about future states.  

  ---

  ### The Load-Bearing Feature: Non-Injective Dynamics
  The core issue is that the friction law transforms multiple distinct past states (different initial positions/velocities) into a single present state (position X, rest). This "many-to-one" mapping erases information about the initial conditions. If friction were removed (e.g., a frictionless table with conservation of momentum), the dynamics become **injective**: each initial state \((x_i, v_i)\) produces a unique trajectory, allowing past recovery. With friction, irreversibility is baked into the model’s equations.

  ---

  ### Objection: "Determinism Must Imply Unique Past"
  **Objection**: A strict determinist argues that if the laws are deterministic and the current state is known completely (including *all* microscopic details like molecular vibrations or thermal states), reverse computation *must* recover the unique past. Laplacean determinism demands bijective (one-to-one) mapping between past and present states.  

  **Reply**: Determinism guarantees **unique future evolution** from a given state, but not **unique past reconstruction**. This distinction hinges on **time-reversibility**:  
  - If dynamics are reversible (e.g., elastic collisions), past uniqueness holds.  
  - If dynamics are irreversible (e.g., friction with dissipation), past uniqueness fails.  
  Here, friction is modeled macroscopically as energy loss to the environment (heat/sound), making it irreversible *by design*. Even with infinite precision, the microscopic state (e.g., table’s thermal energy) does not encode *which* macroscopic path led to it—multiple initial shoves can produce identical thermal distributions. The past fact ("shove location/force") is a *macroscopic* property not fixed by microscopic reversibility.  

  ---

  ### Terminology and Boundaries
  - **Settled name**: **Irreversible Deterministic System**.  
  - **What falls under it**: Systems where deterministic laws produce non-injective state evolution (e.g., inelastic collisions, diffusion, hysteresis). Information about initial conditions is lost, preventing unique retrodiction.  
  - **What does not**:  
    - **Chaos**: Sensitive dependence amplifies small errors, but past recovery *in principle* succeeds with infinite precision.  
    - **Statistical irreversibility**: Emergent in thermodynamic systems but relies on coarse-graining; underlying mechanics are reversible.  
    - **Quantum indeterminacy**: Involves inherent randomness, violating determinism.  
  - **Boundary**: Irreversible determinism stops at the **micro/macro divide**. Microscopic laws (e.g., Newtonian particles) are reversible, but macroscopic phenomena (e.g., friction) introduce irreversibility via effective laws or emergent dissipation.  

  \answer{Non-injective dynamics}
