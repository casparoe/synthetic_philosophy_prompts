  For the desiderata, I need to systematically address each requirement they listed while maintaining the "reflective realist" framing. The non-negotiable vs. camp-preference distinction is crucial here - some requirements (like avoiding self-undermining premises) seem logically mandatory, while others (like targeting moral realism vs. beliefs) depend on the debunker's aims. The scope problem (why not debunk perception/logic too?) is particularly thorny and needs careful handling with possible solutions like domain-specific reliability.

  The two tensions they flagged are indeed pivotal. The normative premise problem seems nearly insurmountable - any argument concluding we "ought" to doubt moral beliefs risks relying on normative assumptions that genealogy might undermine. The generality-content tension is equally serious; content-specific genealogy is powerful but limits debunking to particular judgments. I suspect the latter tension might be why they prefer localized debunking - it sidesteps the problem.

  For the Joyce/Street evaluation: Joyce's argument (targeting moral belief via explanatory superfluity) struggles with scope and requires normative premises about epistemic justification. Street's dilemma fares better on content-specificity but stumbles over normative premises in its "tracking truth" horn. Neither fully satisfies, confirming the user's suspicion about joint unsatisfiability. Ultimately, the avoidance-of-undermined-premises requirement emerges as the biggest obstacle - it's non-negotiable yet seemingly impossible to meet while concluding anything normative.
answer: |-
  **Bottom line:** The full set of desiderata is *not* jointly satisfiable; the most prohibitive requirement is **Avoiding Undermined Normative Premises (AUNP)**, as it conflicts with delivering a normative epistemic conclusion.

  ### Desiderata for an Adequate Evolutionary Debunking Argument (EDA)

  1.  **Precise Targeting (Non-negotiable):**
      *   **Requirement:** Must clearly identify its epistemic target: moral *beliefs* (as unjustified), moral *knowledge* (as impossible), moral *realism* (as false or unjustifiable), or specific moral *judgment contents* (as unreliable). It must explain why debunking the chosen target counts as "success" (e.g., debunking realism itself vs. debunking our justification for believing it).
      *   **Case:** A realist grants genealogy but insists it only shows *how* we form beliefs, not that they are *false* or *unjustified*. Success hinges on showing the genealogy undermines the realist's specific epistemic claim (e.g., justification for realism, not just belief formation). Debunking *only* specific contents (e.g., purity norms) counts as success only if the argument aims for local skepticism or challenges realism's ability to explain *those* specific contents.

  2.  **Content-Specific Genealogy (Preference: Pro-Debunking Camp):**
      *   **Requirement:** The evolutionary explanation must predict/explain the *specific contents* of our actual moral judgments (e.g., why we judge incest wrong, kin partiality permissible) rather than merely explaining the existence of a generic "moral faculty."
      *   **Case:** Explaining only the *capacity* for moral judgment is compatible with that capacity being truth-tracking for *some* contents (e.g., basic welfare norms). To show pervasive unreliability *for realist purposes*, the genealogy must show why we have the *specific*, often culturally variable, judgments we do, suggesting they track adaptive pressures, not moral truth. A general capacity explanation leaves room for reliable refinement.

  3.  **Scope Restriction (Non-negotiable):**
      *   **Requirement:** Must explain why the *same style* of evolutionary causal explanation does *not* equally undermine perception, memory, basic logic, or the epistemic norms the EDA itself relies upon (e.g., inference rules, standards of evidence).
      *   **Case:** If EDAs undermine all faculties shaped by evolution, they become globally skeptical and self-defeating (using logic/memory/perception to argue against using logic/memory/perception). A successful EDA must distinguish moral judgment's etiology as uniquely problematic – e.g., by arguing perception/logic are *cognitively basic* and indispensable for survival *as truth-trackers*, while moral judgment is a *byproduct* or tracks *fitness* not *truth*, or lacks independent confirmation.

  4.  **Avoiding Undermined Normative Premises (AUNP) (Non-negotiable):**
      *   **Requirement:** Must not rely on substantive normative premises (epistemic or moral) that its *own* genealogical account would render unreliable or unjustified.
      *   **Case:** If the EDA uses a premise like "We should doubt beliefs caused by non-truth-tracking processes," but its genealogy suggests *all* normative reasoning (including epistemic norms) is similarly shaped by non-truth-tracking evolution, then the argument undermines its own foundation. This creates a dilemma: avoid normative premises and struggle to reach a normative conclusion, or use them and risk self-defeat.

  5.  **Empirical Falsifiability (Preference: Pro-Debunking/Scientific Camp):**
      *   **Requirement:** If the EDA makes a key empirical claim about the genealogy (beyond the granted general fact of evolutionary influence), it must specify what empirical finding would refute that claim or the argument's force.
      *   **Case:** For example, an argument claiming moral beliefs *only* track fitness, not truth, could be refuted by strong evidence of moral beliefs consistently arising that significantly *reduce* fitness in ancestral environments for no plausible fitness benefit, yet align with plausible moral truths. Or, evidence that moral cognition piggybacks directly on uncontroversially reliable cognitive mechanisms.

  6.  **Addressing the General Capacity Reply (Non-negotiable):**
      *   **Requirement:** Must engage the reply that selection shaped only a *general capacity* for normative judgment, which was then refined by culture/reason to track truth. It must show why this reply fails *for the specific target* (e.g., why this capacity, even refined, is unreliable for realist truth-tracking).
      *   **Case:** Realists argue evolution gave us a basic "normative sense" that reason/culture calibrates towards truth. The EDA must show either that (a) the specific contents are *too deeply* tied to fitness/path-dependent to be reliably calibrated away from it, or (b) the calibration mechanisms (reason/culture) are themselves infected by the same evolutionary pressures, or (c) there's no independent "calibration standard" accessible to us.

  **Flagged Tensions:**
  *   **AUNP vs. Normative Conclusion:** The demand to avoid undermined normative premises (4) conflicts directly with the need to deliver a conclusion about what we *ought* to believe. Using normative premises risks self-defeat; avoiding them makes reaching a normative conclusion difficult or impossible.
  *   **Generality vs. Content-Specificity:** Achieving full generality (debunking *all* moral judgment) (1, 2) sits badly with requiring content-specific genealogical detail (2). A highly general argument (e.g., targeting the faculty) struggles with scope (3) and the capacity reply (6); a content-specific argument sacrifices generality.

  **Local vs. Global Debunking:**
  *   **Desiderata Shape Change:** A *local* EDA (targeting e.g., purity, kin partiality, retribution) operates under a significantly *weaker* set of desiderata.
      *   **Precise Targeting:** Easier – targets specific contents/judgment types. Success is clearer (undermining justification for *those* judgments).
      *   **Content-Specific Genealogy:** *Essential* and more readily achievable (e.g., specific disgust/kinship modules).
      *   **Scope Restriction:** Less burdensome. Can often grant reliability of other judgments/norms. Self-defeat less acute.
      *   **AUNP:** Still challenging but manageable if using uncontroversial epistemic norms (e.g., inconsistency, lack of independent evidence) *not* claimed to be undermined for that domain.
      *   **Empirical Falsifiability:** Similar.
      *   **Capacity Reply:** Easier to counter – argue the *specific* content is explained *solely* by fitness pressures with no truth-tracking role, unlike potentially other moral contents.
      *   **Tensions Reduced:** Avoids the generality/content clash and lessens the AUNP/normative conclusion tension.

  **Scoring Contenders:**

  1.  **Street's Darwinian Dilemma:**
      *   **Target:** Moral realism (specifically, our justification for believing it). Hits realism via undermining beliefs.
      *   **Content-Specificity:** Strong. Requires showing adaptive links to *specific* contents to argue they don't track truth.
      *   **Scope:** Attempts distinction (moral truth distinct from fitness; logic/perception more directly survival-relevant as truth-trackers). Controversial.
      *   **AUNP:** **Fails.** Heavily relies on normative epistemic premise (we should doubt beliefs insensitive to truth). Genealogy likely undermines *all* such normative reasoning.
      *   **Falsifiability:** Implicit (finding moral truths perfectly tracking fitness would support "tracking" horn).
      *   **Capacity Reply:** Addresses it by arguing "refined" judgments are path-dependent on adaptive origins.
      *   **Verdict:** Fails primarily on **AUNP**; scope argument is vulnerable.

  2.  **Joyce's Explanatory Superfluity:**
      *   **Target:** Moral beliefs (as unjustified). Ultimately aims against realism.
      *   **Content-Specificity:** Weaker. Focuses on explaining the *usefulness/persistence* of the moral faculty/content generally, not specific contents in detail. Can accommodate some content variation.
      *   **Scope:** **Fails.** Explicitly bites the bullet, arguing *if* logic/perception were similarly superfluous fictions, we *should* doubt them too. Makes argument self-applicable and globally skeptical.
      *   **AUNP:** **Fails.** Relies on epistemic norms regarding justification and explanatory virtue, which genealogy would render suspect.
      *   **Falsifiability:** Weak. Finding moral facts indispensable to best explanation refutes it, but hard to demonstrate.
      *   **Capacity Reply:** Addresses by arguing the *function* of the faculty is pragmatic, not truth-tracking, making its outputs unjustified *even if* refined.
      *   **Verdict:** Fails decisively on **Scope** and **AUNP**; weaker on content-specificity.
