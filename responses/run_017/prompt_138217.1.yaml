  The dialogue must avoid strawmen - both positions need robust defenses. For Mira, I'll emphasize how colony-scale behaviors solve adaptive problems no individual ant can address. For Deniz, I'll focus on the absence of neural integration mechanisms.

  On the three focal points:
  1) Turnover: Emphasize how information persists in physical structures and interaction patterns despite ant replacement
  2) Ledger: Debate whether nest modifications constitute memory or just environmental scaffolds
