   - When the other has an extra bit of information the character can't inspect.
   - When the other is an expert in a different field.
   - When the other arrived by a route the character thinks is unreliable but can't show to be wrong.
   - Whether the subject is politics/taste vs. a shared bank balance (or similar objective matter).

   Leaves (end positions) must include:
   1. Equal-weight conciliationist: reduce confidence to the midpoint.
   2. Total-evidence steadfast: hold to original confidence.
   3. Permissivist: both can hold fast without either being irrational.

   We have up to 10 branch points.

