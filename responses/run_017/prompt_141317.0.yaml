  ### Forecasting Game: **The Oracle's Dilemma**

  #### **Game Objective**  
  Students experience firsthand how social predictions can alter outcomes, why long-term forecasting fails, and how conditional predictions differ from unconditional prophecies—without prior exposure to Popperian terminology. The game has three phases:  
  1. **Trend-Fitting (Rounds 1–6)**: Baseline data for forecasting.  
  2. **Prediction & Reaction (Rounds 7–9)**: Predictions are published, triggering self-fulfilling, self-defeating, or equilibrium-seeking outcomes.  
  3. **The Invention Shock (Rounds 10–12)**: An "invention" disrupts all patterns, invalidating prior models.  

  ---

  ### **Game Setup**  
  **Players**: 4 teams of 4 students (16 total).  
  **Materials**:  
  - **Team Forecast Sheets**: Tables to record forecasts (unconditional + conditional).  
  - **Central Board**: Tracks actual values for all teams.  
  - **Data Sheets**: Historical data (Rounds 1–6) + updated rounds.  
  - **Invention Card**: Drawn after Round 9 (e.g., "New Crop: Drought-resistant grain invented").  
  - **Scoring Ledger**: Public scoreboard tracking team points.  

  **Variables** (Reported each round):  
  1. **Grain Price** (e.g., in "silver per bushel")  
  2. **Migration** (e.g., "families entering the city")  
  3. **Council Support** (e.g., "% approval of the City Council")  

  ---

  ### **Rules & Mechanics**  
  #### **Forecasting Rounds**  
  - **Rounds 1–6**: All teams receive identical historical data.  
  - **Rounds 7–12**:  
    1. Teams forecast **next round's values** (unconditional) and **conditional forecasts** (e.g., *"If the Council holds the grain subsidy, Council Support = X"*).  
    2. **All unconditional forecasts are averaged** and published before actuals are computed.  
    3. **Actuals are calculated** based on:  
       - **Grain Price (Self-Fulfilling)**:  
         - *Rule*: If average forecast > previous value + 5, actual = forecast (panic occurs).  
         - *Else*: Actual = previous value + 2 ± small noise.  
       - **Migration (Self-Defeating)**:  
         - *Rule*: If average forecast > 200, actual = previous value – 10 (bottleneck avoided).  
         - *Else*: Actual = previous value + 5 ± small noise.  
       - **Council Support (Equilibrium)**:  
         - *Rule*: Actual = 50 + 0.6 × (50 – average forecast).  
           - Forecast **above 50** → actual **below 50** (over-correction).  
           - Forecast **below 50** → actual **above 50** (e.g., forecast 60 → actual 44; forecast 40 → actual 56).  
           - Settles at **50** if forecast = 50 ("fixed point").  
    4. **Conditional Forecasts**:  
       - Logged separately. Only scored if condition *occurs* (e.g., Council holds/removes subsidy).  
       - **Conditions**:  
         - *Round 8*: "Council holds subsidy."  
         - *Round 10*: "Council removes subsidy."  

  #### **Invention Event**  
  - After Round 9, draw an **Invention Card** (e.g., "Printing Press" or "New Crop").  
  - **New Rules (Rounds 10–12)**:  
    - **Grain Price**: Base trend shifts (e.g., –1 per round), self-fulfillment threshold tightens.  
    - **Migration**: Threshold drops to 150, avoidance effect strengthens.  
    - **Council Support**: Equilibrium shifts to 60, correction weakens.  

  #### **Scoring System**  
  - **Short-Term (One-Round) Forecasts**:  
    - Score = `10 – min(10, |error|)` per variable.  
    - *Example*: Error of 3 → 7 points; error of 12 → 0.  
    - **Max per round**: 30 points (3 variables × 10).  
  - **Long-Term Forecasts**:  
    - **Unconditional (Round 12)**: Forecast made at Round 6.  
      - Score = `30 – 3 × min(10, |error|)`.  
      - *Example*: Error of 4 → 18 points; error of 11 → 0.  
    - **Conditional**: Scored only if condition occurs (Rounds 8 + 10).  
      - Score = `10 – min(10, |error|)` (only for Council Support).  
  - **Total Points**: Sum of all forecasts. Short-term dominates scoring.  

  **Why This Scoring?**  
  - Rewards **trend-fitting** (short-term errors small) and punishes **long-range prophecy** (errors magnified ×3).  
  - Conditional forecasts scored **only when relevant**, mirroring "piecemeal engineering."  

  ---

  ### **Timeline (75 Minutes)**  
  | Time    | Activity                                                                 |  
  |---------|--------------------------------------------------------------------------|  
  | 0–5 min | Explain rules, distribute historical data (Rounds 1–6).                  |  
  | 5–15 min| **Round 7**: Teams forecast (unconditional + long-term Round 12).        |  
  | 15–20 min| Collect forecasts → publish averages → compute actuals → update board. |  
  | 20–25 min| **Round 8**: Teams forecast (unconditional + conditional). Announce Council holds subsidy. |  
  | 25–30 min| Publish averages → compute actuals → update board.                      |  
  | 30–35 min| **Round 9**: Teams forecast (unconditional).                             |  
  | 35–40 min| Compute actuals → draw **Invention Card** → explain new rules.          |  
  | 40–45 min| **Round 10**: Teams forecast (unconditional + conditional). Announce Council removes subsidy. |  
  | 45–50 min| Publish averages → compute actuals → update board.                      |  
  | 50–60 min| **Rounds 11–12**: Teams forecast → compute actuals (accelerated).       |  
  | 60–70 min| **Scoring**: Teams self-calculate points; update ledger. Discuss patterns. |  
  | 70–75 min| **Debrief**: Transition to Popper.                                       |  

  ---

  ### **Debrief: Mapping to Popper**  
  1. **Self-Fulfilling/Self-Defeating Predictions**:  
     - "Remember when Grain Price spiked because everyone predicted a panic? Or when Migration dropped because people avoided the forecasted bottleneck? Popper calls this the **Oedipus effect**: predictions alter outcomes."  
  2. **Equilibrium as a ‘Quasi-Law’**:  
     - "Council Support stabilized at 50, but *only* until the invention changed everything. Popper argues historicists mistake temporary trends for **eternal laws**—but social 'laws' dissolve when conditions shift."  
  3. **The Invention Shock**:  
     - "Why did forecasts fail after Round 9? The invention introduced **new knowledge** (e.g., drought-resistant crops). Popper’s core argument: *We can’t predict future knowledge because we’d already have to know it today*."  
  4. **Conditional vs. Unconditional**:  
     - "Your conditional forecasts ('if the subsidy holds...') were robust across the invention. Popper advocates **piecemeal social engineering**—testing small policies—over grand historicist prophecies."  

  #### **What the Game Can’t Capture**  
  - **The Knowledge Problem**: The invention card *simulates* unpredictable knowledge growth, but Popper’s point is deeper: tomorrow’s knowledge is *logically impossible* to foresee. Admit this gap and reinforce: *"The game fakes novelty with a card, but reality has no predefined deck."*  

  #### **Predicted Pitfalls & Responses**  
  - **Pitfall 1**: "History is random!" → *Counter*: "Didn’t Grain Price *follow* predictions? Randomness isn’t the issue—feedback loops are."  
  - **Pitfall 2**: "We need better models!" → *Counter*: "Even perfect models failed post-invention. Is a 'perfect' social model possible if humans react to it?"  

  ---

  ### **Why This Works**  
  - **Experiential Learning**: Students *see* Oedipus effects via scoreboard patterns, not lectures.  
  - **Popperian Concepts Embodied**: Self-fulfilling/defeating prophecies, equilibrium fragility, and knowledge growth are visceral.  
  - **Scoring Discipline**: Short-term rewards mimic social science’s empirical wins; long-term penalties mock historicist hubris.  

  **First-Run Risk**: Noise in early rounds may obscure patterns. **Mitigation**: Use minimal noise (±1–2 units) so feedback effects dominate.  

  ---  
  **Final Design Commitment**: This balances simplicity, pedagogical goals, and Popper’s themes. Students confront historicism’s flaws *before* labeling them—setting the stage for textual analysis. Run it as-is, then let Popper explain what they lived.
