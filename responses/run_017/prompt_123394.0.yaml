answer: |-
  ## Case: The Devoted Advocate

  Maya stands at the city council podium, her voice resonant and clear. "This housing policy is unjust. We *must* build more shelters, provide more support services – the imperative is undeniable." She cites statistics on homelessness with precision, her passion evident in her gestures. After the meeting, a colleague remarks on her tireless dedication. Maya smiles warmly. "It's simply what needs doing. When you see the suffering, the path becomes clear. There's no other way to respond; the work itself calls. I'm just answering that call." Her colleague nods, impressed. Maya walks out, her step light, heading directly to organize the next outreach event, her focus absolute. She feels no doubt, no regret, and wouldn't trade her commitment for anything. Her life is entirely oriented around this work, pursued with unwavering energy and a sense of serene conviction.

  ---

  **1. Verdicts & Reasoning**

  *   **(i) Sartrean (Bad Faith):** Maya misdescribes her freedom. She treats her commitment ("We *must*...", "the imperative is undeniable", "no other way to respond", "the work itself calls") as a given facticity – an objective demand discovered *in* the world and her situation. She frames herself as merely "answering the call," an executor of external necessity ("the path becomes clear"). This obscures the radical freedom by which she *chose* to confer this specific value on alleviating homelessness, making this her fundamental project, and *choosing* to interpret the suffering as imposing *this* specific imperative. The moment of her constitutive choice is rendered invisible to her consciousness; she relates only to the perceived givenness of the value and her role.
  *   **(ii) Motivational Self-Deception (Not Self-Deceived):** There is no identifiable belief-like state Maya holds *against* evidence. She believes the policy is unjust and action is needed, which her evidence (statistics, suffering) strongly supports. She believes she is "answering the call," which aligns perfectly with her intense, consistent behavior and stated feelings. There's no tension between her expressed state and her actions. Her self-description is coherent and consistent with observable evidence. Desire fuels her passion, but not by distorting evidence *against* a conflicting belief.
  *   **(iii) Wholeheartedness (Authentic):** Maya identifies completely with her desire to fight homelessness ("wouldn't trade her commitment for anything"). She exhibits no ambivalence, regret, or divided will ("no doubt, no regret," "unwavering energy"). Her commitment is reflectively stable; she fully endorses the desire moving her. Her life is integrated around this project pursued with "serene conviction."

  **2. The Key Feature & Perturbation**

  *   **Feature:** Maya's framing of her commitment as a *discovered necessity* ("imperative," "must," "no other way," "path becomes clear," "work calls," "answering") rather than a *chosen commitment*.
  *   **Perturbation:** Alter Maya's final statement to: "It's simply what *I choose* to do. When you see the suffering, *I decide* this is the path. The work feels deeply right, *and I embrace that choice*." Her actions, passion, and wholeheartedness remain identical.
  *   **Effect:** **(i) Sartrean:** Verdict flips to *Authentic*. She now explicitly acknowledges her freedom in choosing and embracing the project and the value it embodies, relating correctly to her transcendence. **(ii) & (iii):** Verdicts *stay the same* (Not Self-Deceived, Authentic). Her beliefs remain consistent with evidence and her behavior, and she is still wholeheartedly identified with her desire.

  **3. Strongest Attack & Response**

  *   **Attack:** The Sartrean verdict relies *entirely* on Maya holding a false *metaphysical belief* about the source of value (objective vs. subjective). Motivational self-deception (ii) *should* apply because she holds the belief "The value/imperative is objective" against the evidence (which shows only suffering, not intrinsic imperatives). Her desire (to serve) causes her to maintain this false belief.
  *   **Response:** Sartre insists bad faith is *not primarily about false belief* but about a *structure of consciousness* – the *flight* from apprehending one's freedom by hiding the constitutive choice behind a mask of facticity. Maya isn't *resisting evidence* that her choice is free; she simply *doesn't apprehend the choice at all* in her lived experience. Her statements reflect a *mode of being* (executor of necessity), not a contested propositional belief she's defending against counter-evidence. She relates to the world *as if* values were objective, without consciously formulating or defending that proposition against doubts. *Concession:* Maya *does* implicitly hold a metaphysically false view, and this structure *enables* self-deception. However, the core of bad faith is the pre-reflective evasion of freedom's burden, distinct from the motivated belief-holding required by (ii).

  **4. Confirmation**

  The case demonstrates bad faith without relying on false empirical belief, inner conflict/ambivalence, or a disreputable project.
