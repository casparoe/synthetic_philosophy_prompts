prompt: |-
  I'm the copy editor for a small interdisciplinary journal — I volunteered, nobody else wanted the job — and I've just been handed a special issue on autonomous systems where the word "man" keeps coming up. We have a house style guide with a non-sexist-language section and a stack of minutes from the committee that maintains it, and I'd rather apply our own precedents than my politics. The trouble is that once I laid the minutes out side by side, I realised they fit more than one rule equally well, and the case actually in front of me seems to sit right where those rules come apart. So: predict what this committee would say, or rather tell me what it should say if it wants to be consistent with itself.

  The precedents, as recorded in the minutes: "chairman" to "chair", replace; "manpower" to "workforce", replace, with a note saying explicitly not "personpower"; "man-hours" to "person-hours", replace, and here a literal "person-" compound is fine; "middleman" to "intermediary", replace; generic "he" for an indefinite researcher to singular "they", replace; "mankind" to "humankind", replace; "guys" when addressing a mixed audience to "everyone", replace (so the rule clearly isn't about the letters m-a-n occurring); "manhole", keep, minute says fixed engineering and legal term, no male is pictured; "human", "humane", "manic", "manifest", keep, minute says "man" isn't a morpheme there; "woman", keep, with "woperson" and "womyn" rejected outright; "man cave", keep, minute says male-specific on purpose and none of our business; "man the phones" to "staff the phones", replace.

  The new case: the survey manuscript keeps saying "man-in-the-middle (MITM) attack", and I have to rule on it. Three things make it unlike the earlier ones. First, the acronym is what people actually cite and search, and MITM survives unchanged whether the expanded form is "man-", "machine-", or "adversary-in-the-middle", so the usual stability argument for leaving technical terms alone costs almost nothing here — unless you think the expanded form in running prose is what does the damage. Second, there are ready-made neutral alternatives that are arguably more accurate, since the thing in the middle is a hostile machine and not a guy in a hoodie, and the authors tell me some people in their field already write "machine-in-the-middle" or "adversary-in-the-middle". Third — and this is what I got stuck on when I was arguing with my housemate, who does feminist linguistics and said something about markedness that I only half followed — there is no such thing as a "woman-in-the-middle", which on the markedness story suggests "man" is doing generic-human work here, but that is equally true of "manhole", which we left alone.

  What I want from you: the two or three candidate rules that fit that whole track record — I can think of a "would a reader picture a man" imagery rule, a "don't touch established terms of art" rule, and something like the old Hofstadter-style parody procedure where you mechanically swap in "person" and ask whether the absurdity you get is the revealing kind or just silliness — what each of them predicts about "man-in-the-middle", and your best guess with the reason for preferring it. Say which precedent is genuinely the closest analog, "middleman" or "manhole", and why. If you think our precedents really don't settle it, say plainly what principle we'd be committing ourselves to with each choice. And name one further case we could put in front of the committee that would tell the top two rules apart — I was going to suggest "manned spacecraft" vs "crewed spacecraft", but tell me if there's a cleaner one. Finish with one machine-readable line and nothing after it, in exactly this shape:

  \answer{verdict: KEEP | rule: <short name of the rule you're attributing to us> | discriminator: <short phrase naming the further case>}
reasoning: |-
  Okay, let me tackle this copy editor's dilemma. They're caught between different precedents in their journal's style guide regarding the term "man-in-the-middle (MITM) attack". The committee has a track record of decisions that seem to point in different directions, and I need to figure out which rule best fits their existing pattern.

  First, I'll analyze their precedents. They replaced "chairman" with "chair", "manpower" with "workforce", and "man the phones" with "staff the phones" - all cases where "man" refers to people generically. But they kept "manhole" as a fixed technical term where no male imagery is involved, and "man cave" as intentionally male-specific. The "man-in-the-middle" case is tricky because it has elements of both: it's a technical term (like "manhole") but also resembles "middleman" which they changed to "intermediary".

  The key tension here is between two rules that emerge from their minutes:
  1) The "imagery rule": Replace if a reader would picture a male person
  2) The "term-of-art rule": Keep if it's an established technical term with no practical alternative

  For "man-in-the-middle", the acronym MITM is fixed regardless of expansion, making the term-of-art argument weaker. And unlike "manhole", there are viable alternatives like "machine-in-the-middle" that are actually more accurate. The committee rejected "personpower" but accepted "person-hours", showing they allow "person-" compounds when they don't sound absurd.

  The closest analog is actually "middleman" rather than "manhole", because both involve an active human role (even if metaphorical). The markedness argument from feminist linguistics suggests that since there's no "woman-in-the-middle" equivalent, "man" is functioning as a false generic here - which aligns with cases they changed.

  For a discriminator case to test these rules, "manned spacecraft" vs "crewed spacecraft" works well. If they keep it, they prioritize term-of-art; if change, they prioritize imagery. But "ombudsman" might be cleaner since it's a formal title with gender-neutral alternatives.

  Based on consistency, I think the committee should recommend replacing "man-in-the-middle" with "machine-in-the-middle" or similar, applying the imagery rule. The term isn't as fixed as "manhole", alternatives exist and are better, and it patterns with "middleman" which they changed.
answer: |-
  Based on your committee's precedents, two core rules emerge:  
  1.  **Imagery Rule:** Replace terms where "man" evokes the image of a male person *and* functions as a generic human reference *unless* it's a fixed technical/legal term with no viable neutral alternative ("manhole", "man cave").  
  2.  **Term-of-Art Rule:** Keep established technical/legal terms where "man" is not picturing a male person or where replacement is impractical/unstable ("manhole", "man cave"). "Machine-" compounds are acceptable if they fit ("person-hours" kept, "personpower" rejected for absurdity).  

  **Analysis of "man-in-the-middle (MITM)":**  
  *   **Imagery Rule Prediction: REPLACE.** The term *does* evoke the image of a (usually male-coded) adversary/hacker ("a guy in a hoodie"). Unlike "manhole" (fixed object, no imagery), "MITM" describes an active role. This aligns with "middleman" -> "intermediary" (active role replaced) and "man the phones" -> "staff the phones" (active verb replaced).  
  *   **Term-of-Art Rule Prediction: KEEP (with caveat).** "MITM" is a widely used acronym. However, the *expanded form* "man-in-the-middle" is less fixed; alternatives ("machine-", "adversary-") exist, are arguably more accurate, and are used in the field. Crucially, the acronym "MITM" survives replacement. This weakens the stability argument significantly compared to "manhole".  
  *   **Hofstadter-Style Test:** "person-in-the-middle" sounds slightly awkward but not absurd like "personpower" or "woperson". It's functionally clear. This suggests replacement is viable, aligning with "person-hours".  

  **Closest Analog:** "**middleman**" is the closest analog. Both describe an active intermediary role where "man" functions generically but evokes a male image. "Manhole" is a weaker analog as it's a passive, fixed object term with no alternative, explicitly deemed to evoke no male imagery.  

  **Committee's Commitment:**  
  *   **REPLACE:** Commits to prioritizing the removal of male imagery in active human/machine agent roles, even in technical contexts, when stable, accurate, non-absurd alternatives exist.  
  *   **KEEP:** Commits to prioritizing acronym stability and treating "man" in established attack names as a technical morpheme devoid of gendered meaning, akin to "manhole".  

  **Discriminator Case:** "**ombudsman**"  
  *   **Why it's better than "manned/crewed":** "Ombudsman" is a formal title (like some technical terms), has direct gender-neutral alternatives ("ombudsperson", "ombuds"), and its "man" directly references a human role. It directly pits the Imagery Rule (replace, as it evokes a male person) against the Term-of-Art Rule (keep, as an established title). "Manned/crewed" is less clear-cut (technical, but "crewed" is a stable alternative).  

  **Best Guess & Reason:**  
  **REPLACE.** The Imagery Rule provides the most consistent fit. "Man-in-the-middle" actively pictures a male adversary, much like "middleman" pictured an intermediary and "man the phones" pictured men staffing. The existence of viable, accurate, field-used alternatives ("machine-", "adversary-") that preserve the crucial acronym "MITM" removes the primary justification for keeping it under the Term-of-Art Rule. Keeping it would be inconsistent with replacing "middleman" and "man the phones".  

  \answer{verdict: REPLACE | rule: Imagery Rule | discriminator: ombudsman}
