  2. **Most Unstable Nodes (prone to inconsistent answers):**  
     - **Node 1 (Case 5: infertility without distress):** Students often waver between "dysfunction" (Y) and "no harm" (N). This instability affects Leaf 1/3 (Y-path) vs. Leaf 4–10 (N-path).  
     - **Node 7 (Case 7: unexplained symptoms):** Students struggle with "disability without mechanism," leading to inconsistent Y/N answers that split pragmatist (Leaf 8) from eliminativist (Leaf 9) or welfare-based (Leaf 2).  
     - *Why focus here:* These nodes force confrontation between dysfunction, harm, and social factors. Class time should explore how intuitions here shape broader commitments.  

  3. **Reference Class Change (typical-for-age vs. species-prime):**  
     - **Effect on assignment:**  
       - If a student implicitly uses "typical-for-age," they avoid labeling aging as disease (e.g., Node 8 → N → Leaf 7).  
       - If they use "species-at-prime," aging is dysfunctional (e.g., Node 8 → Y → Leaf 6).  
       - *Position shifts:* Biostatistical naturalists move from Leaf 7 (age-adjusted) to Leaf 5/6 (species-prime). Welfare/strong normativists are unaffected (no typicality requirement).  
