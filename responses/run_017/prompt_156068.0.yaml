prompt: |-
  I'm rewriting my third-year Kant sessions for next term (we're on Groundwork II, the universalizability stretch), and I've relised I don't actually have a spec for what I want out of a reading of the test before I go pick one to teach. So help me build the spec.

  Purpose first, so adequacy has something to be relative to: I want a version of the test that a student can apply to a maxim they wrote down themselves, in a few minutes, without already knowing the answer — and that returns Kant's own verdicts on the four stock examples (suicide from self-love, the lying promise, the unused talents, the man who walks past the sufferer). Anything that only works if a philosophically trained person reverse-engineers the description is out.

  Here's the part I most want. Below is a battery of maxims I made up because my seminar kept breaking on them. Any adequate reading has to return a verdict on each, and the verdicts have to come from the reading and not from me nudging the description:

  1. As a referee, I'll take money to favour one side. (Is the maxim indexed to a role or office? Universalise over everyone, or over office-holders?)
  2. I'll lie whenver I'm in a city I'm only passing through. (Class indexed by place, not person.)
  3. I'll break a promise when I feel like it. (Class indexed to the agent's occurrent desire.)
  4. When the queue is longer than six people, I'll cut in. (The universalised world falls apart only above a certain occupancy level — so the verdict seems to move with population size, or with whether there's a ticketing system, or with whether everyone else is queueing.)
  5. I'll get ahead by taking credit for colleagues' work. (Universalised, the end — credit — becomes unachievable, but not because the maxim is incoherent.)
  6. As the only person who knows where the archive key is, I'll deny anyone else access. (Universalisation over a class of one: vacuous permission, or no verdict at all?)
  7. I'll let people sort out their own problems. (An omission, not an act; and nature plainly subsists under it.)
  8. I'll lie to myself about why I did it. (Self-directed; universalisation ranges over one agent's own future states.)
  9. I'll fiddle my taxes, but only if most others already do. (Compliance conditional on others' non-compliance.)
  10. I'll help people when it suits me and not otherwise. (A permissive maxim: not "do," not "don't," but "either.")

  For each requirement you state, give me the case from that battery (or one of your own) that motivates it, and tell me which requirements are non-negotiable and which are just what one family of readings wants. Things I think belong somewhere on the list, but you order them and you can throw any of them out: that the reading say what a maxim is and how finely it gets individuated; that it distinguish failing in conception from failing in the will from merely being unwise or unstable; that it say whether the verdict attaches to the maxim, to the action, or to the world the maxim would make; that it handle omissions and maxims of pure indifference; that it explain where the extra premise comes from if the law-of-nature clause is doing the work on case 7; that it tell us whether verdicts are allowed to shift with background empirical facts (case 4); that it be usable first-personally, in the moment, by someone who doesn't know the outcome; and that it not let you gerrymander the verdict by re-describing.

  Two things I especially want. First: is there a pair on your list that can't be jointly satisfied? My candidate is that the verdict has to be insensitive to how finely you describe the maxim, and yet you mustn't be able to get any verdict you like by choosing the description — coarse enough to avoid false negatives, fine enough to avoid false positives. If that pair really is unsatisfiable, say so and tell me which half to keep and what to put in place of the other. Second: which single requirement excludes the most readings?

  Then, briefly — a few lines, not an essay — score the four families I keep circling: the logical/semantic-contradiction reading; the practical-contradiction reading on which the maxim's own end can't be achieved in the universalised world; the law-of-nature reading that leans on a premise about what ends a rational will (or a natural organism) must have; and the reading on which the test is about whether you could will your maxim as a law for a community of rational agents. No names needed, no bibliography, and please don't just walk me through the four stock examples again — I've taught those to death. It's the spec I'm after.
reasoning: |-
  Hmm, the user is a philosophy professor prepping Kant's Groundwork II material. They need a concrete specification for selecting a usable formulation of the universalizability test that works pedagogically. Their core frustration centers on students' inability to apply abstract formulations to messy real-world maxims - hence that brutal battery of 10 edge cases designed to expose theoretical cracks.

  Key pedagogical requirements leap out: First-person applicability is non-negotiable - if students can't self-administer the test during office hours panic, it fails. Verdict stability matters too; they're tired of maxim-description gerrymandering where clever rephrasing flips outcomes (see cases 1,2,3,6). The suicide/lying promise/talents/charity examples must yield Kant's original verdicts without scholarly contortions.

  That maxim battery is brilliantly malicious. Case 4 (queue-cutting) attacks population-sensitive verdicts. Case 5 (credit-stealing) exposes ends-based contradictions that aren't logical impossibilities. Case 9 (tax-fiddling conditional on others' behavior) breaks reciprocity assumptions. Most devastating is case 10 - how can a permissive maxim ("help when convenient") even be tested? Traditional formulations implode here.

  The user's tension between maxim-description granularity and verdict consistency is existential. Every Kant scholar struggles with this. I'd prioritize verdict-stability over granularity-flexibility in teaching contexts - better a slightly rigid framework than one where students "discover" that any action can be permissible through creative phrasing. Suggest teaching maxim-writing as a separate skill first.

  For family scoring: Law-of-nature readings handle omissions (case 7) and natural purposes (suicide) well but fail cases like 6 (singular knowledge) by requiring universalization over non-existent agents. Practical-contradiction excels on credit-stealing (case 5) but stumbles on permissive maxims (case 10). Community-of-rational-agents is elegant for role-based maxims (case 1) yet struggles with self-deception (case 8). Logical contradiction is simplest but fails nearly all edge cases - it can't explain why lying promises are wrong (universal lying is logically possible, just disastrous).

  The non-negotiable requirements are: first-person usability, verdict consistency across descriptions, and handling Kant's four canonical cases correctly. Everything else is negotiable pedagogy-wise. Case 10 (permissive maxim) is the ultimate stress test - most readings can't even process it.
answer: |-
  Here's a spec distilled from your requirements, prioritized by what excludes inadequate readings and handles your battery. Non-negotiables are marked (**NN**).

  ### Core Requirements for an Adequate Reading

  1.  **First-person usability by novices:** Students must apply it *themselves* in real-time to *their own* maxims without prior philosophical training or knowing the "answer". (**NN**)
      *   *Motivation:* The entire purpose. Fails if it requires scholarly interpretation or reverse-engineering.

  2.  **Robust verdict stability:** The verdict (permissible/impermissible) must be largely insensitive to *reasonable* variations in describing the underlying action/intention within the maxim. Gerrymandering the description to change the verdict must be impossible or highly constrained. (**NN**)
      *   *Motivation:* Cases 1 (role indexing), 2 (place indexing), 3 (desire indexing), 6 (class of one), 9 (conditional on others) & 10 (permissive). *Tension with Granularity:* This requirement *conflicts* with the desire for maxim granularity freedom. **Prioritize Verdict Stability.** Replace granularity freedom with: **The reading must provide clear guidance on how to formulate a maxim at the *right level of generality* for the test (specifying relevant circumstances/intentions without arbitrary specificity).**

  3.  **Handles Kant's four stock examples correctly:** Must return Kant's verdicts (impermissible for suicide, lying promise, unused talents; permissible for non-beneficence) using the test's own logic. (**NN**)
      *   *Motivation:* Baseline adequacy check.

  4.  **Distinguishes Contradiction in Conception (CC) vs. Contradiction in the Will (CW):** Must clearly explain *why* a maxim fails (logical/practical impossibility vs. conflict with necessary rational/natural ends). (**NN**)
      *   *Motivation:* Crucial for understanding Kant's system (perfect/imperfect duties). Cases: Suicide (CW?), Lying Promise (CC), Talents (CW), Non-beneficence (Permissible despite CW-like argument). Case 5 (credit) fails purely on ends (CW-like?).

  5.  **Handles omissions & permissions:** Must test maxims of omission (Case 7: "I won't help") and permissive maxims (Case 10: "I'll help or not as I please"). Must explain why "letting nature subsist" (Case 7) isn't automatically sufficient for permissibility.
      *   *Motivation:* Case 7 & Case 10. Requires clarifying if the test targets *acting on* the maxim or the maxim *as a universal law*.

  6.  **Verdict attaches to the maxim *as a universal law*:** The test evaluates whether *this specific maxim* could be willed as a universal law. The "extra premise" (e.g., about rational/natural ends for CW) must be clearly sourced *within the test procedure*.
      *   *Motivation:* Case 7 (Why isn't 'nature subsisting' enough? Needs the 'ends of a rational being' premise for CW). Case 4 (shifting population) highlights the question of *what* is being universalized.

  7.  **Explains failure modes:** Must distinguish clearly between:
      *   CC: Universalization leads to logical/practical contradiction *rendering the action itself impossible*.
      *   CW: Universalization creates a world *in which a necessary rational/natural end is thwarted*, making willing the maxim *as a universal law* irrational/self-defeating.
      *   Mere imprudence/instability: Universalization makes the *agent's specific end* unachievable or the practice unstable, *without* contradicting the action or thwarting a necessary end (Case 5: Credit-stealing end fails, but action is possible; Case 4: Queue-cutting might become unstable only above occupancy).
      *   *Motivation:* Case 4 (instability ≠ contradiction? CW?), Case 5 (end failure ≠ CC or necessarily CW?), Case 9 (conditional instability).

  8.  **Handles indexical/conditional maxims:** Must give clear verdicts on maxims indexed to roles (1), places (2), desires (3), unique situations (6), or conditional on others' behavior (9).
      *   *Motivation:* Cases 1, 2, 3, 6, 9. Tests whether universalization ranges over *all rational agents* or a subclass defined *within the maxim itself*.

  **Which requirement excludes the most readings?** **First-person usability by novices (1)** combined with **Robust Verdict Stability (2)**. Many sophisticated readings work only *after* knowing the answer or require complex interpretive moves students can't make.

  ### Scoring the Four Families (Briefly)

  1.  **Logical/Semantic Contradiction (CC only):**
      *   *Fails:* Usability (requires precise logic), Verdict Stability (gerrymandering easy), CW duties (Talents, Suicide), Permissions (Non-beneficence), Case 4/5/7/10. Only gets Lying Promise reliably. Too narrow.

  2.  **Practical Contradiction (Ends-focused):**
      *   *Better:* Handles Lying Promise (CC), *can* handle Talents/Suicide (if ends defined). Explains Case 5.
      *   *Fails:* Usability (defining "purpose/end" is hard), Verdict Stability (ends can be re-described), Permissions (Case 10), CW/CC distinction blurry. Case 6/7/9 tricky. Needs clear source for "ends".

  3.  **Law of Nature (+ rational/natural ends):**
      *   *Better:* Handles all 4 stock cases (Suicide=CW via natural purpose). Explains Case 7 (needs the ends premise). Distinguishes CC/CW well. Grounds the "extra premise".
      *   *Fails:* Usability (conceiving "laws of nature" + "ends" is abstract), Case 6 (vacuous?), Case 10 (permissive law?), Verdict Stability (how fixed are the "ends"?). Can feel like smuggling in the answer via the ends.

  4.  **Community of Rational Agents (Kingdom of Ends style):**
      *   *Better:* Handles stock cases well (intuitive for Talents/Beneficence). Handles roles (Case 1). Explains CW as conflict with rational community. Good for omissions/permissions (Case 7/10).
      *   *Fails:* Usability ("could I will this *as a law in a community of rational beings*?" is complex/meta), Verdict Stability (what constitutes a "community of rational agents"?), Case 6/9 tricky. Can feel less like a "test" and more like an appeal to moral intuition.

  **Recommendation:** Prioritize the **Law of Nature reading** (Family 3) for teaching Groundwork II. It most robustly handles the stock cases, distinguishes CC/CW clearly, and grounds the necessary premises. Supplement heavily with *structured guidance* on formulating maxims and conceiving the universalized world to address usability and verdict stability concerns. Explicitly teach the "ends of a rational being" premise as part of the test procedure. Acknowledge the challenges with edge cases like 6 and 10 as areas for discussion.
