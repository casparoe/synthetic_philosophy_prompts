prompt: |-
  Me and my friend got into a three-hour argument last night after re-watching a documentary about the Exxon Valdez, and I want someone to settle the conceptual part of it rather than the legal part. The setup, as I remember it: after the 1989 spill the government went after damages not just for lost fishing and tourism but for so-called passive use or existence value — the loss ordinary people supposedly suffer even though they'd never visit the place, never consume anything from it, and there is no market in which they ever make any choice that remotely touches it. To put a dollar figure on that they used contingent valuation surveys, asking people what they would be willing to pay to prevent another spill like it; a panel of economists NOAA convened in the early 90s, with a couple of Nobel laureates on it, gave the method a qualified thumbs-up with some methodological guardrails, and a lot of economists went on saying that hypothetical answers to hypothetical questions are not choices and therefore reveal nothing whatsoever. My friend is firmly on the second side and he keeps invoking revealed preference theory to back it up, and my gut says he's conscripting that theory for a job it was never designed for, but I can't say precisely what the job was supposed to be.

  So: take revealed preference theory seriously as the lens and do a careful mapping of this episode through it. Is it a positivist move to purge utility of unobservable mental content, a consistency condition on choice data (the weak and generalized axioms, the Afriat inequalities, that whole apparatus), or a welfare criterion — and what does each of those readings say about the thing these surveys are supposedly measuring? Be disciplined about the mapping: who is the agent, what is the choice set, what is the budget constraint, is stated willingness to pay a price in the relevant sense when nothing is ever actually bought, and what should we make of the fact that willingness to pay and willingness to accept come apart by huge multiples here — my friend says a theory that lets those drift severalfold apart isn't a theory of preference at all, and I don't know if that's fair. And I want the honest negative part too: where is the theory simply silent, because the good in question isn't in anyone's opportunity set and so there is no pattern of choices to be consistent or inconsistent with?

  Here's the move that actually broke the argument, and I'd like you to take it seriously instead of batting it away. My friend's fallback was that the survey response is itself a genuine choice: you really do decide what number to write down, and what you are purchasing with that number is the experience of answering, a warm glow, the sense of being the sort of person who says yes to protecting wilderness — so the responses do reveal a preference, just for a different good than the one named in the question. I think that's too clever by half but I can't say why. If he's right, does it vindicate revealed preference as a method while gutting it as a way of valuing anything, or does it show the consistency reading and the welfare reading come apart in a case nobody built the theory for? And the other direction: does the episode tell us something about what utility means once you've gone revealed-preference — that it's nothing but an index for choice behavior and has no business valuing goods nobody chooses, or that the whole project of defining utility by choice leaves you with exactly nothing to say at the moment you most need to say something? Please don't give me a survey of the valuation literature or a reading list; I want the mapping, where it holds, where it goes quiet, and if there's some distinction or test that would actually settle whether those numbers mean anything, what it is.
reasoning: |-
  Okay, let me tackle this user's deep dive into revealed preference theory and contingent valuation. The user had a three-hour argument with a friend about whether surveys can measure the "existence value" of environmental goods. They want a disciplined mapping through the lens of revealed preference theory, avoiding legal tangles.

  First, I need to recall the core tenets of revealed preference theory. At its heart, it's about inferring preferences from actual choices, not statements. The user mentions three interpretations: positivism (purge utility of mental states), consistency conditions (like WARP/GARP), and welfare criteria. Each gives a different perspective on contingent valuation.

  The user's friend argues that survey responses aren't real choices. But he has this fallback position: maybe the survey response itself is a choice, just for a different good like "warm glow." That's clever but problematic. If we take that seriously, we're no longer measuring the environmental good but the act of answering. That guts the original purpose of valuation.

  Then there's the WTP-WTA gap issue. In real markets, they're usually close, but in hypotheticals, they diverge wildly. Revealed preference theory can't explain that, which undermines the idea that these surveys reveal consistent preferences.

  The big silence in revealed preference theory is when goods aren't in the opportunity set. For something like the existence value of Alaska's wilderness, most people never had a chance to choose it in any market. The theory has nothing to say here because there's no choice data to analyze.

  The user's deeper need seems to be understanding whether economics can truly capture non-market values. They're frustrated with their friend's rigid application of revealed preference. The theoretical mapping shows where revealed preference holds (actual choices), where it's misapplied (hypothetical surveys), and where it's silent (non-choosable goods).

  The key insight is that revealed preference is brilliant for explaining market behavior but hits a wall with passive-use values. This doesn't mean existence value isn't real—just that we need different tools to measure it, tools that revealed preference theory can't validate. The user's instinct that their friend is overextending the theory seems correct.
answer: |-
  Let's map this rigorously through the lens of Revealed Preference Theory (RPT), dissecting its core interpretations and their implications for contingent valuation (CV) surveys like those used for Exxon Valdez passive-use values. We'll address your friend's arguments directly.

  **Core Tenets of Revealed Preference Theory:**

  1.  **The Fundamental Premise:** Preferences are revealed *only* through observable choices. Statements, intentions, or hypothetical answers are not data for RPT.
  2.  **The Agent:** A single, consistent individual making choices.
  3.  **The Data:** Observed choices from specific **choice sets** under specific **budget constraints** (prices, income).
  4.  **The Goal (Interpretation-Dependent):**
      *   **Positivist/Descriptive:** Describe/predict behavior. Utility is *only* an index representing a consistent ordering of choices (Samuelson). Mental states are irrelevant.
      *   **Consistency Axioms (WARP, SARP, GARP):** Test if observed choices *could* be generated by a stable, rational (complete, transitive) preference ordering. Afriat's inequalities recover a utility function consistent with the data, if possible.
      *   **Welfare Criterion (Normative):** Infer welfare changes *from observed choices*. If bundle A is chosen over B when both are affordable, A is "revealed preferred" to B, implying higher welfare. Compensating Variation (CV) / Equivalent Variation (EV) – based on *actual* expenditure functions derived from choices – measure welfare impacts of price/income changes.

  **Mapping the Exxon Valdez CV Surveys:**

  1.  **The Agent:** The survey respondent.
  2.  **The Choice Set:** Hypothetical options presented: "Pay $X to prevent spill Y" vs. "Don't pay, risk spill Y".
  3.  **The Budget Constraint:** Hypothetical. No actual income is deducted. The price ($X) is proposed, not faced.
  4.  **The "Choice":** Stating a number (Willingness To Pay - WTP) or answering "Yes/No" to a specific bid amount. No transaction occurs. No resource allocation changes.

  **Analysis Through RPT Lenses:**

  *   **Positivist/Descriptive Lens:**
      *   The CV response is **not an observable choice** in the RPT sense. Nothing is exchanged. No budget constraint binds.
      *   The stated WTP is **not a revealed preference**. It's a statement about a hypothetical scenario. RPT, by its strictest definition, has nothing to say about it. It's simply outside the domain of observable choice data RPT analyzes. Utility, here an index of *actual* choices, is silent on hypothetical valuations of non-marketed goods.
      *   *Conclusion:* CV responses are not data for RPT description/prediction. They are fundamentally different from observing someone buy fish vs. chicken.

  *   **Consistency Axioms Lens (WARP/SARP/GARP):**
      *   There is **no sequence of actual choices** involving the Alaskan wilderness existence value to apply WARP/GARP to. The good wasn't previously in choice sets; it won't be afterward.
      *   Hypothetical answers to *different* CV questions (e.g., "Would you pay $10? $100? $1000?") *could* be checked for internal consistency *as answers*. However, this tests the consistency of *answers to survey questions*, **not** the consistency of underlying preferences revealed through *resource-allocating choices*. Failing such a test would be bad, but passing it wouldn't validate the WTP as a measure of preference for the *environmental good* in the RPT sense.
      *   *Conclusion:* The theory is **silent** because there is no relevant pattern of *actual choices* to be consistent or inconsistent *with*. Checking consistency of survey answers is a different exercise.

  *   **Welfare Criterion Lens:**
      *   RPT defines welfare changes (CV/EV) based on the *actual* expenditure function derived from *observed choices* under *real prices and income*. CV surveys attempt to *directly ask* for a welfare measure (WTP) without this foundation.
      *   **WTP vs. WTA Divergence:** This is a critical failure point from this perspective. RPT-derived welfare measures for price changes typically show WTP and WTA are relatively close for small changes and normal goods. Large divergences (often orders of magnitude for non-market goods) signal a fundamental problem:
          *   They violate the basic logic of RPT welfare economics, which relies on the expenditure function being well-behaved and preferences being stable.
          *   They suggest the hypothetical scenario doesn't engage the same cognitive/decision processes as real choices involving budget constraints. Preferences might be "constructed" on the spot or influenced by the elicitation method itself, not "revealed."
          *   *Your friend's point is strong here:* A core welfare tool derived from RPT (CV/EV) behaves wildly differently when applied hypothetically vs. when derived from actual choices. This strongly suggests the hypothetical WTP/WTA are not measuring the same underlying preference structure as RPT requires.

  **Your Friend's Fallback Argument: The Survey Response *is* a Genuine Choice (for Warm Glow)**

  *   **The Mapping:**
      *   **Agent:** Respondent.
      *   **Choice Set:** "Write down a number that makes me feel like a good person/environmentalist" vs. "Write down a low/zero number" vs. "Refuse to answer". The specific number chosen is part of this.
      *   **Budget Constraint:** Time, cognitive effort, social desirability, potential guilt. The "price" is the mental cost of choosing an answer inconsistent with self-image.
      *   **The Good:** The "warm glow" of answering altruistically, fulfilling a perceived social role, avoiding guilt, or even the satisfaction of "sticking it to Big Oil."

  *   **Analysis:**
      *   **Where it Vindicates RPT (Formally):** This argument is *internally consistent* with RPT's fundamental premise. The respondent *is* making a real choice (verbal/written response) from a constrained set under some costs. Preferences *are* revealed for the act of answering in a certain way.
      *   **Where it Gutts the Valuation Project:** This is the crucial point. If RPT reveals a preference only for the *act of giving the answer* (the warm glow good), it **completely severs the link** between the stated WTP number and the *specific environmental good* (preventing a future Exxon Valdez spill). The number reflects the value of feeling altruistic *in that moment*, not the value of the remote wilderness.
      *   **Revealed Preference vs. Welfare:** This highlights a stark separation:
          *   **Consistency Reading:** The survey response *can* be seen as a choice revealing a preference for warm glow. One could potentially model consistency *across different CV surveys* as choices for warm glow.
          *   **Welfare Reading:** The welfare implication only pertains to the warm glow good itself. It tells us *nothing* about the welfare impact of *actually* preventing the oil spill on the respondent. The "warm glow" interpretation makes the stated WTP irrelevant for environmental policy valuation.
      *   **Is it "Too Clever by Half"?** It's logically defensible within strict RPT but renders the CV method useless for its intended purpose. It explains *why* people answer, but not *what* their answer means for the environmental good. It's a valid critique *of the interpretation* of CV results, not necessarily of RPT itself applied to this different good.

  **The Silence and the Core Problem:**

  1.  **The Fundamental Silence:** RPT, in all its interpretations, **is fundamentally silent on goods never chosen and never in the opportunity set.** It has no mechanism, no axioms, no theorems applicable to valuing goods entirely outside the realm of actual, budget-constrained choice. Existence value, by definition, falls into this void. RPT was designed for market (or market-like) settings with trade-offs.
  2.  **Utility Under RPT:** Once you define utility solely via RPT, it **is nothing but an index of actual choices.** It represents "what was done," not "what is felt" or "what *would* be done" in novel situations. It has **no business** directly valuing goods never chosen. The index is undefined for such goods. It's a tool for understanding behavior within existing constraints, not for valuing things beyond them.
  3.  **The Dilemma:** You've hit the nail on the head: "The whole project of defining utility by choice leaves you with exactly nothing to say at the moment you most need to say something." RPT provides a powerful framework for analyzing observable market behavior and welfare *within markets*. It deliberately excludes and offers no tools for valuing non-market goods like existence value. This is its strength (rigor, objectivity) and its profound limitation in environmental economics. CV surveys are an attempt to *bridge this gap*, but RPT argues they fail because they don't generate observable choices.

  **The Distinction/Test:**

  There is no single definitive test RPT would accept for CV validity, as RPT rejects the premise. However, the strongest *indirect* test aligned with RPT concerns is the **hypothetical bias calibration:**

  *   **The Idea:** Compare WTP stated in a CV survey for a *real*, consequential good (where an actual payment will be collected if the "vote" passes) against WTP revealed in an actual market for the *same* good. Do people actually pay what they said they would?
  *   **The RPT Relevance:** If stated WTP reliably predicts *actual* choices (revealed preferences) when the budget constraint binds and the good is delivered, it gains credibility *even within a positivist RPT framework*. It suggests the hypothetical scenario successfully mimics the real choice process.
  *   **The Reality:** Evidence on hypothetical bias is mixed, often showing significant overstatement. The WTP/WTA gap also persists even in incentive-compatible settings for complex non-market goods. This lack of convergence with revealed behavior is precisely what RPT predicts and why it rejects CV.

  **Conclusion:**

  Mapping rigorously through RPT lenses:

  1.  **Positivist/Descriptive:** CV responses are not observable choices. RPT is silent or dismissive.
  2.  **Consistency Axioms:** No relevant actual choice data exists. Checking answer consistency doesn't validate environmental valuation.
  3.  **Welfare Criterion:** The WTP/WTA gap violates the logic of RPT-based welfare measures. Hypothetical WTP isn't derived from actual expenditure functions.
  4.  **Warm Glow Fallback:** Formally consistent with RPT *for a different good* (the answer itself), but eviscerates the environmental valuation purpose.
  5.  **The Silence:** RPT is fundamentally silent on valuing goods entirely outside the realm of actual, budget-constrained choice. This is its core limitation here.
  6.  **Utility under RPT:** Is an index of *actual choices only*. It is undefined for non-chosen, non-choosable goods. It cannot value existence value.

  **Your gut feeling is largely correct.** Your friend is applying RPT – a theory designed to explain and test consistency in *actual market choices* – to a context (hypothetical valuation of a non-market, non-choosable good) that lies entirely outside its domain. RPT's silence on such goods isn't a flaw in RPT; it's a deliberate boundary. The CV survey attempts to value something RPT explicitly excludes by definition. The warm glow argument cleverly exploits RPT's formalism but concedes the central point: the number doesn't reveal a preference *for the environmental good*. The existence of the Exxon Valdez CV highlights the *limitation* of RPT for comprehensive welfare economics involving non-market goods, not a failure of RPT within its designed scope. The honest RPT answer is: "We have no revealed preference data for this good, therefore we cannot measure its value using our theory." Whether society *should* value it is a separate, normative question RPT doesn't answer.
