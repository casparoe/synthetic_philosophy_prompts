prompt: |-
  I've just taken over as chair of the review panel for our foundation's decadal programme grants, and I want to replace the vaguest part of our rubric with something that actually discriminates. We fund about fifteen research programmes rather than projects — multi-group, ten-year commitments — and we re-review each of them every three years; the whole panel has two days, roughly forty pages per programme (a self-study, three external letters, an output list), about thirty minutes of discussion each, and a fixed budget, so we are really ranking programmes against one another. Right now reviewers rate scientific quality and promise, which in practice means that a programme publishing constantly looks healthy whatever it is doing, and a programme that has quietly altered what it claims in order to absorb an inconvenient result looks exactly like a programme that has learned something. A philosopher on our board suggested we build the new rubric on Lakatos's methodology of scientific research programmes: treat the programme, not the individual theory, as the thing we appraise; ask what its defenders have implicitly agreed not to give up; ask whether each round of auxiliary adjustments was staged in advance by the programme's own research strategy or invented after the fact to save it; and, above all, ask whether the adjustments led to anything new being successfully predicted, so that we can tell a genuinely progressive problem shift from a degenerating one. I find this convincing in outline, but every time I try to turn it into questions a panel can actually answer in half an hour, the vocabulary stops cashing out.

  Three places in particular. First, novelty: I plan to require each programme to keep a ledger of the predictions it registers before it looks at data, but our applicants disagree about what deserves an entry, and so does the secondary literature — some read Lakatos as demanding that the predicted fact be temporally new to anyone, others as requiring only that it not have been used in building the theory, even if the fact was already sitting in some other field's literature. The panel has to pick one, and it has to be able to defend the choice to an appellant. Second, the thing a programme won't give up: as I understand it, what is protected is fixed partly by the convention of its own practitioners rather than discovered in the texts, which means a clever programme can answer every awkward question by announcing that the challenged claim was never load-bearing after all. I need a rule for handling that move, and I need to know when to accept it as a legitimate relocation of the burden and when to treat it as evasion. Third, timing: Lakatos himself denies that there is any instant rationality in these appraisals — a programme can be degenerating for a while and still be the right thing to back — yet we have to issue a verdict every three years, with a number attached. So I need an explicit grace rule, including for the hardest configuration, where the programme before us is degenerating but we have defunded or never funded any rival that could take over its explanatory successes; my reading is that Lakatos's criterion makes replacement by a better programme part of what rejection means, and I don't know what a funder is supposed to do when there is no replacement to hand. One more complication: we do have bibliometric data, one trustee wants citation counts used as the progress measure, and I'd like to know whether that belongs anywhere in the procedure or whether it measures something else entirely.

  What I'd like from you is a written procedure we could hand to next cycle's panel and actually run: the questions in the order they should be asked, what counts as a sufficient answer to each and what evidence satisfies it, the points at which the procedure stops with a no, the points at which it hands the decision to a person because the remaining question is one of values or risk appetite rather than appraisal, and a one-page glossary translating any theory-laden terms into language a materials scientist or a physiologist who has never opened a philosophy of science book can apply in thirty minutes. Then run it on three cases. The first is a thirty-investigator programme with a hundred and forty papers in three years, which predicted superconductivity at a specified temperature in a family of nickelates and, on each failure to find the transition, added a new parameter for strain and oxygen ordering to keep the fit. The second is a two-group programme whose model predicted a quantitative relationship between two quantities that had both been measured years earlier in an unrelated literature but had never been connected to that model — the connection holds, and specialists in the field found it surprising. The third is the programme I did my own doctorate in, fifteen years old, still producing elegant and much-cited refinements, absorbing every anomaly that comes at it, but with no confirmed prediction of anything new since before my postdoc; it is also now the only programme in the world still working on its central question, because we defunded its rival two rounds ago. I want to know honestly what your procedure says about the third one — I expect it to say something I won't like, and I would rather hear it from a rubric than from a trustee. Finally, tell me where the procedure will misfire: what it will systematically over-rate, what it will systematically kill, and what it simply cannot tell us.
reasoning: |-
  Hmm, the user has taken over as chair of a foundation's decadal programme grants review panel and wants to improve their rubric. They're currently using vague criteria like "scientific quality and promise," which leads them to favor programs that publish constantly, regardless of actual scientific progress. They've been influenced by a philosopher on their board who suggested using Lakatos's methodology of scientific research programmes as a framework.

  The user has identified three key challenges in implementing Lakatos's approach: defining novelty in predictions, identifying what a program won't give up, and dealing with timing issues since Lakatos argues against "instant rationality" but they need to make decisions every three years. They also have a complication with bibliometric data that a trustee wants to use.

  They want a practical written procedure that a panel can implement in their limited timeframe (30 minutes per program discussion). They want questions in sequence, definitions of sufficient answers, evidence requirements, decision points, and a glossary for non-philosophers. They also want the procedure tested on three specific cases and to know where it might misfire.

  I need to create a structured review procedure based on Lakatos's concepts. For the novelty question, I should provide a clear operational definition that focuses on whether a prediction was made before examining data relevant to it, regardless of whether the fact was known elsewhere. For the "hard core" problem, I need rules to differentiate legitimate adjustments from evasion - perhaps requiring consistent documentation and penalizing frequent shifts. For timing, I need a grace rule that allows for temporary degeneration especially when no alternative program exists.

  The glossary will need to translate terms like "progressive problem shift," "degenerating problem shift," and "protective belt" into language accessible to scientists without philosophy backgrounds.

  For the three test cases: The nickelate superconductivity program appears to be degenerating with ad hoc adjustments. The two-group program that connected existing data seems to have made a novel prediction in Lakatosian terms. The user's old doctoral program seems scientifically stagnant despite elegant refinements.

  I should acknowledge where this approach might fail - it might over-rate programs that make many minor predictions while under-rating high-risk/high-reward programs or those in data-poor fields. It also can't assess ethical or practical importance of research.

  The procedure should be structured as a flowchart with clear exit points and decision thresholds. I'll include specific guidance on how to handle borderline cases and how to incorporate citation data only as supplementary evidence.
answer: |-
  Here is a practical review procedure based on Lakatos's methodology, designed for your panel's constraints, complete with a glossary, application to your cases, and limitations analysis.

  **Decadal Programme Review Procedure (Lakatos-Inspired)**

  **Goal:** To assess whether a research programme is *progressive* (generating novel discoveries and predictions) or *degenerating* (making ad-hoc adjustments without novel output) relative to its own stated aims and available alternatives.

  **Inputs for Each Programme (40 pages):**
  1.  **Self-Study:** Must include:
      *   Clear statement of the programme's "Hard Core" (HC - see Glossary) at inception and *now*.
      *   "Protective Belt" (PB) at inception and *now*.
      *   "Positive Heuristic" (PH) - the planned research strategy.
      *   **Prediction Ledger:** A dated list of specific, testable predictions made *before* relevant data collection/analysis began. Each entry must state: the predicted phenomenon/relationship/value, the date predicted, the planned test/method, and the date tested/result known. (Predictions made *after* data were seen for that specific test are excluded).
      *   Summary of major "problem shifts" (anomalies encountered, adjustments made to PB, and resulting novel findings/predictions).
      *   Brief case for the programme's progressiveness and future promise.
  2.  **External Letters (3):** Focused on programme coherence, adherence to PH, handling of anomalies, novelty of findings, and overall health relative to the field.
  3.  **Output List:** Publications, preprints, major datasets, software, etc.
  4.  **(Optional: Bibliometrics Summary):** Provided separately (e.g., citations per paper, field-weighted citation impact). *Use with caution - see Step 6.*

  **Panel Review Process (30 mins/programme):**

  1.  **Step 1: Define the Programme Core (5 mins)**
      *   **Question:** Based on the Self-Study (HC/PB statements) and External Letters, what is the *uncontested Hard Core* (HC) of this programme *now*? What constitutes its current Protective Belt (PB)?
      *   **Evidence:** Self-Study declarations, consistency across External Letters, recent publications demonstrating commitment to core tenets.
      *   **Sufficient Answer:** Consensus on a concise statement of 1-3 fundamental, non-negotiable principles (HC) and the adjustable auxiliary hypotheses (PB). *If HC cannot be clearly identified from materials, flag as major concern.*
      *   **Decision:** Proceed. (No "No" here - lack of clarity is a major red flag for later).

  2.  **Step 2: Assess Prediction Novelty & Ledger Integrity (7 mins)**
      *   **Question:** Does the Prediction Ledger contain entries meeting the *pre-data* criterion? Are these predictions *novel* in the sense of being *logically new* for *this programme/theory* (i.e., not used in constructing the current HC/PB)?
      *   **Evidence:** Prediction Ledger (dates are crucial), publications reporting the tests/results (check dates/methods sections for data collection timing). External Letters commenting on novelty.
      *   **Sufficient Answer:** At least 2-3 ledger entries where prediction date clearly precedes *that specific test's* data collection/analysis. Novelty is satisfied if the *connection* or *specific quantitative value* predicted was *not* an input assumption of the model/approach being tested. *Knowing the fact existed elsewhere is irrelevant; using that fact to build the model disqualifies it as a novel prediction for that model.*
      *   **Decision Point:** If NO credible, dated, pre-data, logically novel predictions exist in the ledger *over the review period*, proceed with high skepticism. (Not an instant "No", but a major red flag for Step 3).

  3.  **Step 3: Evaluate Problem Shifts (Progressive vs. Degenerating) (10 mins)**
      *   **Question:** When faced with anomalies (failed predictions/contradictions), were adjustments:
          a)  Driven by the programme's Positive Heuristic (PH - planned strategy)?
          b)  Led to *novel empirical content* (new confirmed predictions, discovery of unexpected phenomena)?
          c)  Or were they primarily *ad-hoc* (invented post-hoc just to save the current PB/HC, without leading to new predictions/discoveries)?
      *   **Evidence:** Self-Study narrative of adjustments, Prediction Ledger (novel predictions *resulting* from adjustments), External Letters (especially critical ones assessing adjustment rationale/novelty), publications reporting adjustments *and their consequences*.
      *   **Sufficient Answer:** Clear examples where adjustments were anticipated by the PH or logically followed from it, *and* demonstrably led to new, confirmed predictions/discoveries (recorded in Ledger/outputs) = **Progressive Shift**. Adjustments made repeatedly without generating new predictions/novel findings, or clearly contradicting the PH = **Degenerating Shift**.
      *   **"Hard Core Shift" Rule:** If the programme significantly redefines its HC *during* the review period:
          *   **Accept as Legitimate IF:** Clearly documented *before* major anomalies hit, driven by internal theoretical development consistent with PH, *and* the new programme shows signs of progressiveness (novel predictions). (Rare).
          *   **Treat as Evasion IF:** Coincides with unresolved major anomalies, lacks clear PH-driven rationale, external letters strongly criticize it as arbitrary. Score as Degenerating.
      *   **Decision Point:** If the programme shows **only Degenerating Shifts** (ad-hoc adjustments, no novel predictions resulting) *and* has **no credible novel predictions** (Step 2), proceed to Step 4 with recommendation **"Degenerating, Consider Defund"**. Otherwise, proceed.

  4.  **Step 4: Overall Progressiveness & Grace Rule (5 mins)**
      *   **Question:** Considering Steps 1-3, is the programme currently **Progressive** (generating novel predictions/findings) or **Degenerating** (making ad-hoc saves without novelty)?
      *   **Grace Rule Application:** A programme assessed as currently **Degenerating** should *still be funded* if:
          a)  It absorbed a major, unforeseen anomaly within the period and is actively pursuing a PH-driven adjustment *with promising preliminary steps towards novel predictions* (documented in self-study, supported by at least one external letter). OR
          b)  **Crucially:** It is the **only viable programme** addressing a domain of phenomena considered scientifically crucial, *and* no clearly progressive alternative exists or is fundable within the foundation's scope (even if degenerating, it holds the explanatory territory). *This requires panel judgment on scientific importance.*
      *   **Evidence:** Synthesis of Steps 1-3, External Letters on overall health/future promise, panel's knowledge of the field/alternatives.
      *   **Decision Point:**
          *   **Progressive:** Strong case for continued/continued high funding.
          *   **Degenerating but under Grace Rule (a or b):** Case for continued funding, potentially at reduced level or with specific milestones required at next review. Flag for close monitoring.
          *   **Degenerating and No Grace Rule Applies:** Recommend for phase-out/defund.

  5.  **Step 5: Relative Ranking & Budget Constraint (3 mins)**
      *   **Question:** Where does this programme rank relative to others based on its progressiveness, importance (if degenerating under Grace Rule b), and future promise?
      *   **Action:** Panel assigns a preliminary ranking score (e.g., 1-5) based on the assessment. Final ranking occurs after all programmes are reviewed, considering the budget. *Values/Risk Appetite:* The panel must judge the *scientific importance* of the domain (especially for Grace Rule b) – this is a scientific judgment call, not purely Lakatosian appraisal.

  6.  **Step 6: Bibliometrics - Limited, Contextual Use (Integrated, not a separate step)**
      *   **Rule:** Citation counts/data are **not** a direct measure of progressiveness.
      *   **Permissible Uses:**
          *   As *supporting evidence* for impact/attention when novel predictions/findings are claimed (Step 3).
          *   As a *warning signal*: Exceptionally *low* citations *might* (but doesn't always) indicate lack of impact, which could support a degenerating assessment if novelty is also lacking.
          *   As a *descriptor* of output volume (context for Step 3 evaluation).
      *   **Do Not:** Use citation counts to override the assessment of novelty or progressiveness from Steps 2 & 3. High citations on ad-hoc adjustments do not make them progressive.

  **Glossary (One Page for Scientists)**

  *   **Hard Core (HC):** The fundamental, unshakeable assumptions of the research programme. Think of it as the "constitution" the programme is built upon. (e.g., "Genes are made of DNA", "Markets tend towards equilibrium" - though these can sometimes shift VERY rarely).
  *   **Protective Belt (PB):** The auxiliary hypotheses, models, and assumptions that *surround* the Hard Core. These *can and should* be adjusted as new data comes in. (e.g., specific gene regulation models, specific market friction models).
  *   **Positive Heuristic (PH):** The programme's planned research strategy – the "playbook" for how to develop the PB, what problems to tackle next, what kinds of experiments to do. It guides *how* to adjust the PB.
  *   **Prediction (Novel - for Ledger):** A specific, testable statement about what data *should* look like *if the programme's ideas (specifically the PB being tested) are correct*, made *before* the relevant data is collected or analyzed for *that specific test*. It's "novel" for the programme if the specific connection/value predicted wasn't used to build the current model. (It doesn't matter if someone else knew the fact already).
  *   **Anomaly:** An experimental result or observation that contradicts a prediction derived from the programme's current PB.
  *   **Problem Shift:** How the programme responds to an Anomaly.
  *   **Progressive Problem Shift:** Adjusting the PB (guided by the PH) in a way that *not only* explains the anomaly *but also* leads to **new, confirmed predictions** or discoveries that weren't expected before. The programme gains new ground. *This is GOOD.*
  *   **Degenerating Problem Shift:** Adjusting the PB in an *ad-hoc* way (not planned by PH, often invented just to save the current model) that *only* explains the anomaly but **fails to lead to any new, confirmed predictions or discoveries**. The programme is just patching holes, not advancing. *This is BAD.*
  *   **Ad-hoc Adjustment:** A change to the PB made purely to save it from a specific anomaly, without broader justification from the PH and without generating new testable predictions. A hallmark of degeneration.
  *   **Grace Rule:** A programme currently making degenerating shifts might still deserve funding if: (1) It just hit a major unexpected problem and is actively working on a PH-driven fix showing early promise, OR (2) It's the *only* game in town for an important scientific question, even if it's struggling.

  ---

  **Application to Your Cases:**

  1.  **Nickelate Superconductivity (140 papers, failed predictions, added parameters):**
      *   **Step 1:** HC likely "Superconductivity possible in nickelates under X conditions." PB includes specific models predicting Tc. Clear.
      *   **Step 2:** Ledger *should* contain predictions of Tc for specific compounds pre-synthesis/measurement. Novelty OK (predicting exact Tc is new). **Pass.**
      *   **Step 3:** Failures are anomalies. Adjustments (strain/O ordering params) appear purely *ad-hoc* (post-failure, not driven by a clear PH strategy beyond "find SC"). Crucially, did these adjustments lead to **novel, confirmed predictions**? The case states "keep the fit" - implying they only explained the failure but didn't predict something *else* new successfully. Likely **Degenerating Shifts**.
      *   **Step 4:** Currently **Degenerating**. Does Grace Rule apply? (a) Adding params post-failure isn't a promising PH-driven adjustment leading to *novelty*. (b) Is it the only programme? Probably not (many SC programmes). **Recommend Defund/Phase Out.**

  2.  **Two-Group Programme (Connected existing data, surprising connection):**
      *   **Step 1:** HC/PB should be clear from Self-Study. Assume coherent.
      *   **Step 2:** **Key Question:** Was the *specific quantitative relationship* predicted *before* they looked at the existing data *in the context of testing their model*? If the model was built *without* using those specific data points, and they predicted the relationship *then* went and found the data confirmed it, this is a **perfect novel prediction** (logically new for the programme, pre-data for *that test*). Novelty is confirmed by specialists finding it surprising. **Strong Pass.**
      *   **Step 3:** Assuming no major anomalies reported. The successful prediction *is* a sign of progressiveness. **Progressive Shift** (initial success).
      *   **Step 4:** **Progressive.** Strong case for funding.

  3.  **Your Old Doctoral Programme (Elegant refinements, absorbs anomalies, no new predictions, only one left):**
      *   **Step 1:** HC/PB likely clear and stable. **Pass.**
      *   **Step 2:** **Crucial:** No confirmed *novel* predictions in 15+ years? Self-Study Ledger likely empty of recent valid entries. **Fail.** Major red flag.
      *   **Step 3:** Absorbing anomalies via PB adjustments. Without novel predictions resulting, these are almost certainly **Degenerating Shifts**, even if "elegant". Much-cited refinements suggest *impact* but not Lakatosian *progressiveness*.
      *   **Step 4:** Currently **Degenerating**. Grace Rule? (a) Is there evidence of a recent PH-driven adjustment *actively generating promising novel predictions*? The description suggests not. (b) **Crucially:** It *is* the **only programme** working on its central question. **Grace Rule (b) Applies.** Funding should continue *because the domain is deemed important and no alternative exists*, NOT because the programme is healthy. Flag as high-risk, potentially reduce funding, mandate focus on generating novel predictions in next period. **Recommend Continued Funding (Under Grace Rule b - Essential Monopoly).** *(This is the "something you won't like" - the rubric diagnoses degeneration but the procedure mandates funding due to lack of alternative).*

  ---

  **Where the Procedure Will Misfire:**

  1.  **Systematically Over-Rates:**
      *   **Incremental Programmes:** Programmes making frequent, small, pre-planned (PH-driven) predictions of well-characterized phenomena within their domain. They will look "progressive" even if the novelty is low-hanging fruit or the overall importance is modest.
      *   **"Lucky" Programmes:** Programmes where initial PH-driven adjustments happen to lead to easy novel predictions quickly, even if long-term potential is limited.
      *   **Data-Rich Fields:** Fields where generating testable predictions pre-data is straightforward and frequent. May under-value theoretical programmes in data-poor fields.

  2.  **Systematically Kills:**
      *   **High-Risk/High-Reward Programmes:** Programmes tackling fundamental unknowns where generating precise, testable predictions pre-data is extremely difficult or where the PH involves long-term exploration before prediction. Early stages will look "degenerating" or lack predictions.
      *   **Paradigmatic/Revolutionary Programmes:** Programmes challenging the HC of *other* dominant programmes. Their initial predictions may fail against established paradigms, and their novelty may be dismissed. They might lack a detailed PH initially.
      *   **Descriptive/Exploratory Science:** Programmes focused on systematic observation, classification, or understanding complex systems without strong prior predictive models. They won't fit the ledger/prediction framework well.
      *   **Interdisciplinary Programmes:** May struggle to define a singular HC/PB/PH acceptable to all panel members from different fields.

  3.  **What It Cannot Tell Us:**
      *   **Absolute Scientific Importance:** Is the programme's *question* fundamentally important? (Requires panel judgment - Step 4/5).
      *   **Technical Feasibility/Risk:** Is the PH realistic? Are the proposed methods achievable? (Relies on External Letters/Panel expertise).
      *   **Societal Impact/Ethics:** Is the research beneficial, responsible, or potentially harmful? (Outside scope).
      *   **Personnel/Management Quality:** Is the team capable? Well-managed? (Relies on External Letters/Outputs).
      *   **"Elegance"/"Beauty":** Subjective qualities are not captured, except perhaps indirectly through impact/respect (citations/external letters).
      *   **The "Next Big Thing":** It identifies healthy programmes, not necessarily which one will cause a paradigm shift. Degenerating programmes under Grace Rule (b) are funded out of necessity, not promise.

  **Conclusion:** This procedure forces panels to move beyond simple publication metrics and assess the *dynamic process* of scientific advance within a programme, specifically looking for the generation of *novel empirical content* as the hallmark of health. It provides clear, operational definitions and decision points. While it has biases (favoring incremental, predictable progress) and limitations (struggling with high-risk, exploratory, or revolutionary science), it directly addresses the core weakness of your current rubric by distinguishing progressive adjustment from degenerative patching. The Grace Rule, particularly clause (b), is essential for responsible stewardship when no alternatives exist, even if it means funding less-than-ideal science. Use bibliometrics only as a secondary signal, never a primary measure of progressiveness.
