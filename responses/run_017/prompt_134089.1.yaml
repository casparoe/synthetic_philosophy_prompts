     - Commit: Accepts ℕ as a totality but not ℝ (due to impredicativity).  
     - Awkward: Cannot reconstruct analysis without restrictive set formation.  

  8. **Causal Finitist**  
     - Path: 1b-2b-3b-4a-5a-6b-7a-8a  
     - Commit: Concrete objects cannot causally interact with infinitely many things.  
     - Awkward: Accepts a "static" infinite hotel but rejects any process building it.  

  9. **Nomological Finitist**  
     - Path: 1a-2a-3a-4a-5a-6b-7b-8b  
     - Commit: Concrete infinities are possible in other nomological worlds.  
     - Awkward: No evidence for alternate physical laws permitting infinities.  

  10. **Epistemic Finitist (no standard label)**  
      - Path: 1b-2b-3a-4a-5a-6b-7c-8a  
      - Commit: Concrete infinities exist but are epistemically inaccessible.  
      - Awkward: We could never know if Hilbert's Hotel exists.  

  11. **Deflationist**  
      - Path: 1c-2c-3c-4b-5c-6b-7a-8c  
      - Commit: "Infinite" is a useful formal concept without factual basis.  
      - Awkward: Cannot explain why infinitary math is empirically successful.  

  12. **Mathematical Universalist (no standard label)**  
      - Path: 1a-2a-3a-4a-5a-6a-8a  
      - Commit: Uniform rules are metaphysically necessary for physical realizability.  
      - Awkward: Hotel Z's single guest is unrealizable (no uniform solution).  

