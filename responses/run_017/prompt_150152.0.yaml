  - **Near-clone**: identical sheets except that one of you has an extra line at the bottom the other cant see. Both of you are told that such a line exists and that exactly one of you has it; nobody is told what it says.
  - **Mirror**: identical instructions, but your partners payoff matrix isn't yours — same structure, different numbers — and you can read theirs while they read yours.

