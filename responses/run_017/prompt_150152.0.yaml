answer: |-
  ### Practical Session Plan: Superrationality Exploration  
  **Goal:** Make participants experience the pull of superrationality in symmetric conditions and feel where it breaks, without upfront explanation.  

  ---

  ### **Session Flow (75 mins)**  
  1. **Intro (5 mins):**  
     - "We're playing 3 short games. Each involves choosing Cooperate or Defect with a partner. Choices are simultaneous and silent. Points accumulate; top scorers get chocolate/pick next week's paper."  
     - **No theory framing.** Just: "This is about decision-making with partners."  

  2. **Three Rounds (15 mins each, 45 mins total):**  
     - **Order:** Clone → Mirror → Near-clone (prevents mid-session "aha" moments by masking the symmetry pattern).  
     - **Pairing:** Randomly assign new partners each round. For odd numbers, have one trio (each makes one choice applied against both partners).  
     - **Process:**  
       - Hand out sheets. Give 2 mins to read.  
       - Players circle **Cooperate** or **Defect** silently.  
       - Collect sheets. Record choices and award points (no discussion).  

  3. **Points System (Non-Monetary):**  
     - Points translate to rewards: e.g., 15+ points = chocolate bar; 10–14 = candy; top scorer picks next week’s paper.  
     - Use consistent payoff values (below) so points feel tangible.  

  4. **Debrief (25 mins):**  
     - Reveal conditions only *after* all rounds.  
     - Discuss results → map to symmetries → introduce superrationality.  

  ---

  ### **Game Sheets & Payoffs**  
  **Core Setup for All Rounds:**  
  - Prisoner’s Dilemma structure. Payoffs:  
    - Mutual Cooperation: **3 pts each**  
    - Mutual Defection: **1 pt each**  
    - You Defect/Partner Cooperates: **You get 5 pts, partner gets 0**  
    - You Cooperate/Partner Defects: **You get 0 pts, partner gets 5**  

  #### **Round 1: Clone**  
  **Sheet Text (identical for both players):**  
  > "You and your partner have identical sheets. Your payoffs are:  
  >   
  > | Your Choice \ Partner’s Choice | Cooperate | Defect |  
  > |--------------------------------|-----------|--------|  
  > | **Cooperate**                  | 3 pts    | 0 pts  |  
  > | **Defect**                     | 5 pts    | 1 pt   |  
  >   
  > **Note:** Your partner has this exact same sheet and payoff table.  
  >   
  > Circle your choice:  
  > 🔘 Cooperate  🔘 Defect"  

  **Why first?** Strongest symmetry → tests "pure" superrationality pull.  

  #### **Round 2: Mirror**  
  **Sheet Text (different payoffs per player; both see each other’s matrix):**  
  > **Player A Sheet:**  
  > "You are Player A. Your partner is Player B. Payoffs:  
  >   
  > **YOUR PAYOFFS (A):**  
  > | Your Choice \ B’s Choice | Cooperate | Defect |  
  > |--------------------------|-----------|--------|  
  > | **Cooperate**            | 3 pts    | 0 pts  |  
  > | **Defect**               | 5 pts    | 1 pt   |  
  >   
  > **PLAYER B’S PAYOFFS (B):**  
  > | B’s Choice \ Your Choice | Cooperate | Defect |  
  > |--------------------------|-----------|--------|  
  > | **Cooperate**            | 4 pts    | 1 pt   |  
  > | **Defect**               | 6 pts    | 2 pts  |  
  >   
  > **Note:** Player B sees your payoffs and their own.  
  >   
  > Circle your choice:  
  > 🔘 Cooperate  🔘 Defect"  

  > **Player B Sheet:**  
  > (Swap roles, mirror payoffs. Full template [here](#appendix-mirror-player-b).)  

  **Why second?** Payoff asymmetry disrupts outcome symmetry, but players see everything → tests if transparency alone sustains cooperation.  

  #### **Round 3: Near-Clone**  
  **Sheet Text (symmetric payoffs, asymmetric hidden info):**  
  > **Sheet WITHOUT Extra Line (50% of players):**  
  > "You and your partner have nearly identical sheets. Payoffs:  
  >   
  > | Your Choice \ Partner’s Choice | Cooperate | Defect |  
  > |--------------------------------|-----------|--------|  
  > | **Cooperate**                  | 3 pts    | 0 pts  |  
  > | **Defect**                     | 5 pts    | 1 pt   |  
  >   
  > **Note:** Exactly one of you has an extra line at the bottom. You don’t know who or what it says.  
  >   
  > Circle your choice:  
  > 🔘 Cooperate  🔘 Defect"  

  > **Sheet WITH Extra Line (50% of players):**  
  > (Same as above, plus):  
  > "**Extra line:** You are Player X. This line does not change payoffs."  

  **Why last?** Epistemic asymmetry (hidden info) → tests if uncertainty breaks trust despite symmetric payoffs.  

  ---

  ### **Debrief Script**  
  1. **Reveal Conditions (5 mins):**  
     - "Round 1: **Clone**—identical sheets, same payoffs, knew it."  
     - "Round 2: **Mirror**—saw each other’s payoffs (yours ≠ theirs)."  
     - "Round 3: **Near-Clone**—same payoffs, but one had a hidden line."  

  2. **Share Aggregate Results (5 mins):**  
     - Post round-by-round cooperation rates (e.g., "Clone: 80% cooperated; Mirror: 30%; Near-Clone: 40%").  

  3. **Map to Symmetries (10 mins):**  
     - **Outcome Symmetry (Clone):** "Identical payoffs → ‘If we’re identical, we’ll choose the same. Mutual cooperation (3 pts) > mutual defection (1 pt).’ That’s the superrationality pull."  
     - **Procedural Symmetry (Mirror):** "You saw their payoffs, they saw yours—but outcomes weren’t symmetric (e.g., you get 3, they get 4 if both cooperate). Breaks the ‘we’re in this together’ feeling."  
     - **Epistemic Symmetry (Near-Clone):** "Same payoffs, but hidden info created doubt—‘Do they know something I don’t?’ Superrationality requires perfect knowledge symmetry."  

  4. **Introduce Superrationality (5 mins):**  
     - "Superrationality says: ‘If we’re perfectly symmetric and rational, we must choose identically. So Cooperate dominates.’ You felt this in Clone. But it breaks if symmetries break—like in Mirror (outcome asymmetry) or Near-Clone (knowledge asymmetry)."  

  ---

  ### **What Will Go Wrong (And Fixes)**  
  1. **"Jerks" who defect for fun:**  
     - **Mitigation:** Random pair rotations dilute their impact. In debrief, note: "Some defect to test boundaries—but watch how cooperation drops when symmetries break. That’s the point."  
     - **Reframe:** Award chocolate for top scorers (not just cooperation) to incentivize serious play.  

  2. **Clone round understates the pull:**  
     - **Why:** Participants aren’t *actual* clones, so some defect rationally.  
     - **Use in Debrief:** "Even here, not everyone cooperated. Superrationality requires extreme symmetry—real humans aren’t clones. But compare 80% cooperation here to 30% in Mirror!"  

  3. **Near-clone’s "extra line" may feel irrelevant:**  
     - **Why:** Players might ignore it since it "does nothing."  
     - **Use in Debrief:** "Did the hidden line make you suspicious? That’s epistemic asymmetry at work—even harmless uncertainty breeds defection."  

  4. **Mirror round confusion:**  
     - **Fix:** Pre-print sheets with clear labels ("YOUR PAYOFFS" vs. "THEIR PAYOFFS"). Walk around to clarify if hands go up.  

  ---

  ### **What the Game Can’t Show**  
  - **True superrationality:** Without real clones, the "pull" is weaker than in theory.  
  - **Pure rationality:** Humans use emotion/trust (e.g., some cooperate in Mirror to be "nice").  
  - **Generalizability:** This uses Prisoner’s Dilemma only. Superrationality applies to other games (e.g., Stag Hunt), but we’re keeping it focused.  

  ---

  ### **Logistics Checklist**  
  - **Print:**  
    - Clone: Identical sheets for all.  
    - Mirror: 50% Player A sheets, 50% Player B sheets (see [appendix](#appendix-mirror-player-b)).  
    - Near-Clone: 50% with extra line, 50% without.  
  - **Bring:** Pens, chocolate, a whiteboard for results.  
  - **Prep:** Pre-calculate points for all payoff combinations to speed up scoring.  

  You’ve got this! The structure creates the "aha" moment organically.  

