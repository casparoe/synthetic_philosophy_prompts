                                      - Limits on arbitrage under delegated capital: Leaf 9: Limits to Arbitrage.

  Now, for each leaf:

  Leaf 1: Disagreement from Different Priors.
     - Epistemic authority: Low; prices reflect a balance of opinions, not truth.
     - Awkward commitment: Why would rational agents have different priors?

  Leaf 2: Boundedly Rational Trading.
     - Epistemic authority: Very low; prices reflect biases and heuristics.
     - Awkward commitment: The lack of a unified model of bounded rationality.

  Leaf 3: Liquidity-Based Trading.
     - Epistemic authority: None for fundamentals; reflects liquidity conditions.
     - Awkward commitment: Prevalence of liquidity shocks and lack of insurance.

  Leaf 4: Hedging Motives.
     - Epistemic authority: Low; reflects hedging needs.
     - Awkward commitment: Requires significant non-tradable background risks.

  Leaf 5: Gambling Preferences.
     - Epistemic authority: None; inflated by gambling demand.
     - Awkward commitment: Why don't rational traders arbitrage this away?

  Leaf 6: Model Uncertainty or Ambiguity.
     - Epistemic authority: Low to medium; reflects a weighted average of models.
     - Awkward commitment: Specifying the set of models and weights.

  Leaf 7: Heterogeneous Risk Aversion.
     - Epistemic authority: Medium; reflects risk-adjusted beliefs.
     - Awkward commitment: Trade should be one-time, not continuous.

  Leaf 8: Resale Option Theory.
     - Epistemic authority: Low; reflects option value from resale.
     - Awkward commitment: Requires binding short-sales constraints and persistent optimism.

  Leaf 9: Limits to Arbitrage.
     - Epistemic authority: Low; can deviate from fundamentals long-term.
     - Awkward commitment: Why doesn't arbitrage capital flow in?

  Now, flag pairs that cannot be separated:

  In the tree, each leaf has a unique path. But note that for a student who believes in non-belief motives and cannot choose a primary one, they might be forced to pick arbitrarily. But that's a feature of the tree.

  Also, flag empty combinations:

  The tree does not represent any combination of two or more drops. For example:

  - Different priors and bounded rationality: This combination is not represented. It is unexplored? Or it is unattractive because one drop suffices? We can say it is unexplored.

  - Different priors and non-belief motives: Similarly, not represented. Unexplored.

  - Bounded rationality and non-belief motives: Unexplored.

  - Etc.

  Also, note that the tree does not have a leaf for the case where we drop nothing and also don't have constraints? But we force that to be explained by constraints. So we don't have a leaf for "unexplained".

  We can note that the combination of keeping all assumptions and not having constraints is empty because it would imply no trade, contradicting evidence.

