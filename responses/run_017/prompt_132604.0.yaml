prompt: |-
  I'm a senior at a large public high school, and I'm writing a piece for our student paper about the way our district uses numbers to judge schools, teachers, and students. I've found that I have quite firm opinions about which uses of a number are corrupt and which are perfectly fine, but I can't state the rule I'm applying, and I suspect some of my opinions don't fit together. I'd be grateful for help finding the rule, and for an honest account of which verdicts it forces me to drop. I'm not asking for sources or further reading, just the shape of the principle.

  Here are my cases, all of them from things I've watched happen.

  Our district publishes each school's chronic absenteeism rate, and a slice of funding follows it. One school responded by letting students who arrive up to forty minutes late and leave after lunch count as present, provided they complete a wellness check-in with a counselor in the front lobby. Their rate fell sharply. I think this is straightforwardly corrupt, and I blame the administrators. A second school, facing the same metric, spent a small grant on adult-led walking routes to school, a washer and dryer for students without clean uniforms, and a counselor who phones homes. Their rate fell by about as much. I think this is not corrupt at all — it's the system working. What bothers me is that in both cases the number moved because people responded to being measured, and the second school's programs would not exist if nobody were counting. So responsiveness to the measure can't itself be the test.

  A second pair, which I find harder. My chemistry teacher spent the last three weeks before the state exam drilling us on a fill-in-the-blank template for the explain-your-reasoning items, and I could earn most of the points on those items without understanding the chemistry. I think that's corrupt. Another teacher of mine spends a couple of classes on general test-taking technique — ruling out obviously wrong options, checking whether your answer's units make sense, not leaving anything blank. Her students' scores went up too, and I think she's right to do it, and that a teacher who refused to would be neglecting us. But both of them taught us tricks that raise scores without raising understanding, and I can't say what separates them except that one feels like it defeats the point of the item and the other feels like common sense. That's not a principle.

  One case where I assign blame oddly. Our English department runs essays through an AI-detection score, and a friend of mine, who wrote his essay himself, put it through a rewriting tool to make the prose clumsier so the score would come back low. I think the score has stopped being evidence of anything about who wrote the essay. But I don't blame my friend, whereas I do blame the administrators in the first attendance case. My guess is that the difference is about who imposed the measure and whether the person being measured had any other way to protect themselves, but I'd like that spelled out, because I'm not sure it doesn't just reduce to "I side with students."

  One case my definition can't handle. The peer tutoring program I volunteer for reports the share of tutored students who go on to pass the course, and the district funds it partly on that figure. This year the coordinator began accepting only students whose first-semester average was already above seventy, quietly turning away the students who used to be referred most often. The pass rate rose. I think this is the worst thing on my list — worse than the attendance trick — and yet the number still means exactly what it meant. Of the students who were tutored, more passed. Nothing about the measurement broke. What changed is which students there are. So my rough test, make the number move without making the thing move, doesn't cover it, and I don't know what does.

  One case that pulls in the other direction. A state university near us admits by a formula built on GPA, and several schools in our area now grade generously. One of my teachers has started bumping strong B+ work up to A−, and she has told us privately that she does it to keep us comparable to students from schools that inflate. I can't blame her, and I think she's probably right to do it. But her doing it makes GPA worse as a signal, and if everyone does it the signal collapses while each individual act of inflating remains reasonable. So here I have corruption without blameworthiness, which is the reverse of what I said about the test-taking tricks, and I'd like to know whether I need two separate principles or one with more moving parts.

  A case of a different kind. Several elementary schools in our district cut art and recess to add blocks of tested reading instruction, and the principal of one of them said in a meeting that reading is what the district measures, so reading is what the school is for. I think something has gone badly wrong here, but it isn't that the number stopped tracking the thing. The number tracks reading instruction better than ever. What moved is what the school cares about. I don't know whether that belongs in the same box as the others or is a distinct failure with its own name.

  The case I keep changing my mind about: our district now has every teacher rate each senior on things like resilience and collaboration, from a short paragraph of commentary, using a rubric everyone has seen. Scores have been almost identical for two years and are checked against nothing. Half the time I think this is the most corrupt number in the building, because a teacher could write anything she liked and no one would know. The other half I think that two stable years is some evidence that nobody has bothered to game it, and that a number nothing rides on is safe precisely because it's harmless — which would also make it useless. I'd like to know whether unused gameability corrupts a measure, or whether only exercised gameability does.

  My own tentative principle is that a measure has been corrupted to the extent that a rise in it has stopped being evidence of a rise in the thing we actually care about. That handles the first two cases and the tutoring case, provided I'm willing to say what the target is and to notice that the target's population can be changed by the people being measured. It seems to misfire on the grade inflation case, where the evidence does weaken and yet I won't blame anyone, which makes me think I need a second principle about blame and not only about measurement.

  What I'd like from you is the principle, or the two principles, stated precisely, with each clause tied to the case that forces it; your verdicts on a few cases I haven't listed, such as a measure that everyone games by roughly the same amount so the ranking stays put, a measure that is gamed only at the extremes, a measure whose target is partly constituted by public opinion about the target, and one further case of your own invention that you think discriminates between the candidates; and a frank statement of which of my verdicts no single principle can keep. If it turns out that measurement and blame have to be handled separately, please say where the seam is, and whether anything I care about falls through it.
reasoning: |-
  Okay, I need to help this high school senior figure out the principles behind when using numbers to judge schools, teachers, and students becomes corrupt. They've listed several cases where they have strong opinions but can't articulate a consistent rule. Let me go through each case carefully to identify patterns.

  First, looking at the absenteeism examples: Two schools improved their attendance numbers differently. One used a loophole (wellness check-ins for partial attendance), while the other implemented genuine support systems (walking routes, laundry, counseling). The student sees the first as corrupt but not the second. The key difference seems to be whether the intervention actually addresses the underlying issue (barriers to attendance) versus just manipulating the metric.

  For the chemistry teacher case: Teaching fill-in-the-blank templates for exams feels corrupt because it bypasses actual understanding. But teaching general test-taking skills seems legitimate. The distinction appears to be whether the technique helps demonstrate actual knowledge (like checking units) versus replacing knowledge with memorized formats.

  The AI detection case is interesting: The student blames the system, not the friend who manipulated his essay. This suggests that when the measure itself is flawed or easily gamed, the responsibility lies with those who imposed it, especially if subjects have no fair way to comply.

  The tutoring program case reveals a new problem: Selecting only students likely to pass improves the metric but betrays the program's purpose. Here the number still "means" the same thing statistically, but the population being measured has changed strategically. This points to a different corruption type - perverse selection rather than direct metric manipulation.

  Grade inflation creates a dilemma: Individual teachers feel forced to inflate grades to keep students competitive, but collectively this destroys GPA's meaning. The student can't blame individual actors, recognizing a systemic failure where reasonable individual actions lead to collective harm.

  The recess-cutting example shows what happens when measurement dominates purpose: Schools optimize for the measured subject (reading) at the expense of unmeasured but valuable activities (art, recess). This isn't metric corruption per se, but mission distortion - the measure working too well for a narrowed purpose.

  The senior ratings case highlights a new dimension: A meaningless metric that's stable only because nobody cares enough to game it. This suggests that "harmless" measures aren't necessarily corrupt, just useless.

  The student's tentative principle - that corruption occurs when metric improvements don't reflect real improvements in the underlying concern - is a good start but needs refinement. It explains the first cases well but struggles with grade inflation (where blameworthiness separates from corruption) and tutoring selection (where the measure still "works" but serves distorted aims).

  I need to articulate two distinct principles: one for measurement integrity (when metrics stop measuring what matters) and another for responsibility allocation (who should bear blame). The measurement principle should account for both direct gaming (attendance loopholes) and strategic population changes (tutoring selection). The blame principle should consider power dynamics - administrators imposing flawed systems bear more responsibility than students gaming them.

  For the student's unlisted cases: When everyone games a measure equally, rankings might hold but absolute values become meaningless. Gaming only at extremes might preserve the measure's utility for most cases. Measures based on public opinion (like popularity scores) might be inherently resistant to certain gaming but vulnerable to others. And I'd add a case about metrics that create harmful incentives even when not gamed (like test prep replacing real learning).

  The hardest fit for any single principle is grade inflation - it clearly corrupts the measure, yet individual actors aren't blameworthy. This forces us to separate the measurement corruption judgment from the blame assignment. Similarly, the recess case shows measurement can distort priorities without corrupting the metric itself - suggesting a third category about institutional mission drift.

  The core insight is that numbers aren't corrupt by themselves, but become dangerous when they: (1) can be improved without improving the underlying value, or (2) incentivize abandoning other important values, or (3) create prisoner's dilemmas where reasonable individual actions collectively destroy the measure's value. And we must always ask who has power in the system - the measured or the measurers - when assigning blame.
answer: |-
  Based on your cases and the tensions within them, the core issue is **measurement integrity**—specifically, *when a metric remains reliable evidence of the underlying value it was meant to track*. However, **blameworthiness** operates on a separate axis: *who bears responsibility for distorting the metric or its consequences*. Here’s how these principles resolve your cases:

  ---

  ### **Principle 1: Measurement Integrity (The "Evidence Test")**
  > **A metric is corrupted when its improvement no longer reliably indicates improvement in the underlying value it was intended to measure, due to actions taken *because* the metric is measured.**  
  > *Clarifiers:*  
  > - "Underlying value" = the real-world goal the metric proxies (e.g., learning, well-being).  
  > - "Actions taken because the metric is measured" = responses incentivized by the metric’s existence.  
  > - Corruption occurs when the *link* between metric and value is severed or weakened.

  #### **How It Handles Your Cases:**
  - **Chronic Absenteeism (Wellness Check-In):**  
    Corrupt. The "present" label no longer tracks actual attendance (students arrive late/leave early). The link between the metric (attendance rate) and the value (consistent presence) is broken.  
  - **Chronic Absenteeism (Laundry/Walking Routes):**  
    **Not corrupt.** The metric still tracks the value: improved attendance stems from barriers being removed.  
  - **Chemistry Test Template:**  
    Corrupt. Scores rise without understanding chemistry. The metric (test score) no longer tracks the value (knowledge).  
  - **General Test-Taking Tips:**  
    **Not corrupt.** Scores rise *because* skills help students demonstrate knowledge (e.g., avoiding unit errors). The link remains intact.  
  - **AI-Detection Score Manipulation:**  
    Corrupt. The score no longer tracks authorship (clumsy prose fools it).  
  - **Peer Tutoring Selection Bias:**  
    Corrupt. The metric (% passing) still "means" what it says, but it no longer tracks the *program’s effectiveness*. The underlying value is "helping struggling students succeed," but the metric now reflects pre-selecting students who would pass anyway.  
  - **Grade Inflation:**  
    Corrupt. GPA no longer reliably tracks academic mastery across schools due to strategic inflation.  
  - **Recess Cut for Reading:**  
    **Not corrupt by this principle.** The metric (reading scores) better tracks reading instruction. *But this is a different failure (see below).*  
  - **Senior Resilience Scores:**  
    **Not corrupt by this principle** (if unexercised). The metric *could* be gamed, but if stable and unused, it hasn’t been *actively corrupted*.  

  #### **Verdicts on Your Unlisted Cases:**  
  - **Measure gamed equally by all (ranking intact):**  
    Corrupt. Absolute scores are meaningless, even if rankings hold (e.g., all GPAs inflated by 10%).  
  - **Measure gamed only at extremes:**  
    Partially corrupt. Reliability degrades at the margins (e.g., high-stakes gaming for scholarships), but may hold elsewhere.  
  - **Target constituted by public opinion (e.g., school reputation scores):**  
    **Not corrupt** if opinion *is* the target. But if it proxies something else (e.g., quality), corruption depends on whether gaming breaks the link.  

  ---

  ### **Principle 2: Blameworthiness (The "Power/Alternatives Test")**
  > **Blame falls on actors who impose, control, or benefit from the metric if they:**  
  > (a) *Could reasonably foresee* its corruption, or  
  > (b) *Fail to provide fair alternatives* for those measured to achieve their goals without gaming.  
  > Individuals measured (e.g., students) are rarely blameworthy if they lack power or alternatives.

  #### **How It Handles Your Cases:**  
  - **Absenteeism (Wellness Check-In):**  
    Blame administrators. They imposed the metric, could foresee loopholes, and offered no fair path to improve attendance.  
  - **AI-Detection Score:**  
    **No blame for student.** The district imposed a flawed metric with no fair way to prove authenticity. The student’s only alternative was to accept unfair suspicion.  
  - **Chemistry Test Template:**  
    Blame the teacher. They control instruction and chose to undermine learning despite alternatives (e.g., teaching concepts).  
  - **Grade Inflation:**  
    **No blame for the teacher.** They act reasonably (to protect students) in a system *others* control, with no fair alternative (e.g., no district-wide grading standard). Blame lies with districts/universities that ignore inflation.  
  - **Peer Tutoring Selection:**  
    Blame the coordinator. They distorted the program’s purpose despite alternatives (e.g., seeking more funding for high-need students).  

  ---

  ### **The "Recess Cut" Case: A Distinct Failure**
  This is **mission distortion**—when optimizing a metric narrows an institution’s purpose at the expense of other values. It’s not metric corruption (reading scores *do* track reading), but a **values failure**: the school prioritizes the measured over the unmeasured (art, recess). Requires a separate response (e.g., broader metrics).

  ---

  ### **Cases Your Principles Force You to Drop/Revise**
  1. **Grade Inflation:**  
     - You must call it **corrupt** (fails the Evidence Test).  
     - But you can **absolve the teacher** (per the Power Test).  
     - *This resolves your "corruption without blame" tension.*  
  2. **Senior Resilience Scores:**  
     - You must drop calling it "the most corrupt." Unused gameability doesn’t corrupt it—only *exercised* gaming does. It’s merely **useless**.  
  3. **Recess Cuts:**  
     - Not measurement corruption. Label it **mission distortion**.  

  ---

  ### **Seam Between Principles & What Falls Through**
  - **The seam:** Measurement Integrity judges the *metric*; Blameworthiness judges *people*.  
  - **What falls through:**  
    - **Systemic failures** (e.g., grade inflation) where corruption emerges from collective action, not individual intent.  
    - **Values conflicts** (e.g., recess cuts) where metrics work but incentivize neglecting unmeasured goods.  
    - **Harmless gaming:** If a metric is gamed but nobody cares (e.g., a vanity stat), it’s corrupt but irrelevant.  

  ---

  ### **Final Principle Set**
  1. **Measurement Corruption:**  
     *A metric is corrupted when responses to its measurement break its link to the underlying value.*  
  2. **Blame Allocation:**  
     *Blame rests with those who design or control the metric if they ignore foreseeable corruption or deny fair alternatives to the measured.*  
  3. **Mission Distortion (Bonus):**  
     *A separate harm occurs when metric optimization replaces institutional purpose.*  

  This keeps 90% of your verdicts intact, refines your view on grade inflation/AI-detection, and forces you to reclassify recess cuts and unused metrics. The rule is: **Follow the evidence, then ask who broke it.**
