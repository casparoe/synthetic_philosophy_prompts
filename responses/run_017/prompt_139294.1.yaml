answer: |-
  Below is a decision procedure designed for your panel, structured to fit within your 25-minute per-case constraint. It explicitly addresses your three core concerns (comparison tasks, currency pitfalls, and preference correction) and provides concrete operational steps. The procedure uses a hybrid **objective-functioning scoring system** to avoid the flaws of money-metric, subjective well-being, or capability-based currencies. It focuses on **comparing the size of welfare gains** (not levels or ratios) and includes clear off-ramps for value judgments.

  ---

  ### **Decision Procedure: Welfare Gain Efficiency (WGE) Framework**
  **Goal:** Assign a 0–100 need-benefit score based on cost per unit of welfare gain, using objective functioning metrics adjusted for patient-specific factors.  
  **Time per case:** 25 minutes (strictly timed).  
  **Output:** A score (0–100), funding decision (yes/no), and documented reasoning.  
  **Core principle:** Welfare gain = improvement in functioning × duration × certainty. Avoid comparing well-being levels or gain ratios.

  #### **Step 1: Define the Welfare Gain (5 minutes)**
  - **Task:** Calculate the expected welfare gain using an **Objective Functioning Index (OFI)**.  
  - **Method:**  
    1. **Anchor to standard-case vignettes:** Use your existing mild/moderate/severe vignettes for the condition. Rate the patient’s *current* and *expected post-treatment* functioning on a 0–10 scale in four domains:  
       - Physical health (e.g., mobility, pain)  
       - Mental health (e.g., anxiety, cognition)  
       - Daily functioning (e.g., self-care, work)  
       - Social functioning (e.g., relationships, community).  
       *(Example: "Severe" vignette = 2/10, "Moderate" = 5/10, "Mild" = 8/10.)*  
    2. **Calculate functioning change:**  
       - OFI gain = (Post-treatment OFI) – (Current OFI).  
       - If domains are unequal, use equal weighting (avg. of 4 scores). *Judgment call: Adjust weights only if one domain is overwhelmingly critical (e.g., hand function for a violinist). Document rationale.*  
    3. **Adjust for duration and certainty:**  
       - Duration = Years of benefit (use life expectancy tables; cap at 10 years for age >70).  
       - Certainty = Probability of success (0.1–1.0; use clinical evidence or panel consensus).  
       - **Welfare gain (WG) = OFI gain × duration × certainty.**  
  - **Missing data protocol:**  
    - If OFI gain is unestimable (e.g., no vignettes), use **Step 1a (3 minutes):**  
      - Rate current and expected functioning holistically (0–10) using clinician input.  
      - If still unclear, flag for human judgment (Step 4).  
    - If duration/certainty is missing, default to:  
      - Duration: 1 year (or median for condition).  
      - Certainty: 0.5 (or lowest from similar cases).  
  - **Sufficient answer:** WG is quantifiable (e.g., "OFI gain=3, duration=5y, certainty=0.8 → WG=12"). Proceed to Step 2.  
  - **Stop and return "no":** If WG ≤ 0 (e.g., no improvement or negative effects).

  #### **Step 2: Calculate Cost-Efficiency (5 minutes)**
  - **Task:** Compute cost per unit of welfare gain.  
  - **Method:**  
    - **Cost per WG unit = Total treatment cost / WG.**  
      *(Example: $14,000 / 12 WG units = $1,167 per unit.)*  
    - **Adjust for financial precarity (if applicable):**  
      - If the patient is at risk of deprivation (e.g., job loss, homelessness) due to the condition, multiply WG by 1.5. *Only apply if evidence shows direct causation (e.g., "tremor will cause job loss in 3 months").*  
  - **Missing data protocol:**  
    - If cost is unavailable, use the average cost for the treatment in your system.  
    - If precarity adjustment is disputed, default to no adjustment (WG × 1.0).  
  - **Sufficient answer:** Cost per WG unit is quantifiable. Proceed to Step 3.  
  - **Stop and return "no":** If cost per WG unit exceeds $15,000 (or your system’s de facto threshold).

  #### **Step 3: Assign Need-Benefit Score (10 minutes)**
  - **Task:** Convert cost-efficiency to a 0–100 score for the batch.  
  - **Method:**  
    1. **Rank all applications in the batch** from lowest to highest cost per WG unit (e.g., $500/unit = best, $10,000/unit = worst).  
    2. **Normalize to 0–100 scale:**  
       - Score = 100 × [1 – (Application’s rank – 1) / (Total applications – 1)].  
       *(Example: Rank 1/20 apps → 100; Rank 10/20 → 50; Rank 20/20 → 0.)*  
    3. **Funding threshold:** Fund applications scoring ≥50 (top half of the batch).  
  - **Sufficient answer:** Score is assigned. Document score and rank.  
  - **Hand back to human judgment:** Never at this step. Scores are mechanical once WG and cost are set.

  #### **Step 4: Human Judgment Off-Ramp (5 minutes, only if triggered)**
  - **Trigger when:**  
    - Values conflict (e.g., "Should we override patient-reported functioning due to depression?").  
    - Unresolvable uncertainty (e.g., no data for OFI, duration, or certainty).  
    - Extraordinary equity concerns (e.g., life-saving treatment for a marginalized group).  
  - **Process:**  
    - Panel discusses for ≤3 minutes.  
    - If consensus, adjust WG or cost-efficiency and recalculate.  
    - If no consensus, use fallback: Assign a score of 50 and fund if ≥50% of panel votes yes.  
  - **Documentation:** Explicitly state: "Human judgment applied due to [reason]."

  ---

  ### **How the Procedure Addresses Your Core Concerns**
  1. **Comparison tasks:** Only compares **size of welfare gains** (WG units). Avoids ranking well-being levels or gain ratios.  
  2. **Currency pitfalls:**  
     - Uses **objective functioning (OFI)** to avoid wealth bias (money-metric), recalibration (subjective well-being), and contested weights (capability).  
     - Adjusts for adaptation by using vignettes (not self-report) and precarity (only when evidence-based).  
  3. **Preference correction:**  
     - **Never corrects** patient-reported preferences (e.g., "I rate my QoL as 3/10"). Uses OFI instead.  
     - Flags cases for human judgment if preferences are contested (e.g., "Is the violinist’s despair temporary?").  

  ---

  ### **Application to Your Three Cases**
  #### **Case 1: Child ($9k device) vs. Elderly ($9k comfort care)**  
  - **Child:**  
    - OFI gain: 7→9 (gain=2; severe pain to near-normal).  
    - Duration: 11 years (age 7→18). Certainty: 0.9.  
    - WG = 2 × 11 × 0.9 = 19.8.  
    - Cost per unit = $9,000 / 19.8 ≈ $455.  
  - **Elderly:**  
    - OFI gain: 2→5 (gain=3; high pain to moderate comfort).  
    - Duration: 0.25 years (3 months). Certainty: 0.7 (complication risk).  
    - WG = 3 × 0.25 × 0.7 = 0.525.  
    - Cost per unit = $9,000 / 0.525 ≈ $17,143.  
  - **Result:** Child ranks higher (lower cost per unit). Score: Child=100, Elderly=0. **Fund child.**  

  #### **Case 2: Violinist ($14k surgery) vs. Warehouse Worker ($14k surgery)**  
  - **Violinist (34yo, diagnosed 18mo ago):**  
    - OFI gain: Focus on daily functioning (hand coordination). 3→8 (gain=5; unable to work to near-normal).  
    - Duration: 40 years (life expectancy). Certainty: 0.9.  
    - WG = 5 × 40 × 0.9 = 180.  
    - Cost per unit = $14,000 / 180 ≈ $78.  
  - **Warehouse Worker (58yo, diagnosed 11y ago):**  
    - OFI gain: Daily functioning. 4→7 (gain=3; light work to near-normal).  
    - Precarity: Job loss evidence → WG × 1.5 = 3 × 1.5 = 4.5.  
    - Duration: 20 years. Certainty: 0.9.  
    - WG = 4.5 × 20 × 0.9 = 81.  
    - Cost per unit = $14,000 / 81 ≈ $173.  
  - **Result:** Violinist ranks higher. Score: Violinist=100, Worker=0. **Fund violinist.**  
  - **Note:** Self-reports (QoL 3/10 vs. 7/10) are ignored; OFI focuses on functioning. Precarity adjustment narrows the gap but doesn’t close it.  

  #### **Case 3: Cochlear Implant vs. Home Care for Elderly**  
  - **Cochlear Implant (2yo, speculative benefit):**  
    - OFI gain: Hearing/communication domain. 2→8 (gain=6; deaf to functional hearing).  
    - Duration: 78 years (life expectancy). Certainty: 0.4 (speculative).  
    - WG = 6 × 78 × 0.4 = 187.2.  
    - Cost per unit = $60,000 (assumed) / 187.2 ≈ $321.  
  - **Home Care (6 elderly patients):**  
    - OFI gain per patient: Daily functioning. 3→6 (gain=3; avoids nursing home).  
    - WG per patient = 3 × 1 year × 0.9 = 2.7.  
    - Total WG = 2.7 × 6 = 16.2.  
    - Cost per unit = $60,000 (assumed) / 16.2 ≈ $3,704.  
  - **Result:** Cochlear implant ranks higher. Score: Implant=100, Home care=0. **Fund implant.**  
  - **Fallback for "not determinable":** If benefit/cost is unquantifiable (e.g., no cost data):  
    - Assign WG via panel consensus (e.g., "high/medium/low").  
    - Use median WG from past similar cases.  
    - Record: "Score based on fallback consensus; WG not fully evidenced."  

  ---

  ### **What the Procedure Cannot Do**  
  The procedure **leaves these disagreements unresolved**:  
  1. **Domain weighting:** If panelists disagree on weighting OFI domains (e.g., "Mobility matters more than social function"), the default equal weighting stands. Human judgment is only triggered if >1 panelist objects.  
  2. **Precarity adjustments:** Disagreements about job-loss risk (e.g., "Is the warehouse worker truly at risk?") are resolved by evidence, but if evidence is equivocal, no adjustment is made.  
  3. **Age/life-expectancy bias:** The procedure inherently prioritizes younger patients due to duration. If panelists reject this, they must override scores via Step 4.  
  4. **Threshold disputes:** The $15,000 cost-per-unit "no" threshold and top-half funding rule are arbitrary. Panelists may disagree but cannot alter them mid-batch.  

  ---

  ### **Operational Summary**  
  - **Strengths:** Fits within 25 minutes, avoids subjective currencies, minimizes value judgments.  
  - **Weaknesses:** Relies on crude proxies (e.g., precarity multiplier), may feel mechanical in borderline cases.  
  - **Key safeguard:** Document every adjustment, judgment call, and missing-data fallback to maintain auditability.  
  - **Final advice:** Pilot this for one meeting with 2–3 cases, then refine OFI domains and thresholds based on feedback.
