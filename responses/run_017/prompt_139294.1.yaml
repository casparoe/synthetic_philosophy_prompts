     If the panel feels the speculative nature is not captured by the 0.6 certainty, they can adjust (but must document). That's a judgment call.

     For recording: we record the inputs and the calculation. For the cochlear, we note that the benefit is speculative and the certainty was set at 0.6 based on panel's assessment.

     If the procedure returns a result, we use it. If it returns "not determinable" (because of missing data that we cannot estimate) then we use a fallback rule: the panel assigns a score by consensus (0-100) and we record that it was a panel assignment. We do not compute a raw score. Then we include that score in the batch for scaling? But the batch has a mix? We can still scale the raw scores and the qualitative scores together? But the qualitative ones don't have raw scores.

     We must not mix. Therefore, for applications with complete data, we use the computed raw score and scale. For applications with incomplete data, we first assign a raw score by panel consensus (they assign a number that they think reflects the cost-effectiveness, on a scale from 0 to whatever, but we don't have a reference). Alternatively, we assign a qualitative score (0-100) for the need-benefit without cost? But then it's inconsistent.

     We propose: for incomplete applications, the panel assigns a Welfare Gain by consensus (0 to 100) and then a cost estimate. Then we compute the raw score = Welfare Gain / cost. Then we scale that with the rest. But if we don't have cost, we cannot. So we require cost. If cost is missing, we use the finance office's estimate (they are on the panel) or we defer until we get it. If we must decide, we assign a raw score by consensus: the panel gives a number between 0 and 1 (for example) representing their judgment of cost-effectiveness. Then we scale.

     This is messy. We might say: if critical data is missing, we do not score and we do not fund? But that might be harsh.

     Alternatively, we have a rule: we only score applications with complete data. But that might not be acceptable.

     Given time, we do the best we can: we estimate the missing data and proceed. We record the estimation.

  Finally, what the procedure cannot do:

  1. Resolve deep value disagreements: 
     - For example, whether to prioritize children over the elderly? Our procedure does (because of remaining life) but that is built in. If the panel disagrees with that, they would have to change the procedure.
     - How to weight different domains in the OF? We use equal weights, but the panel might feel that pain is more important than mobility. We allow adjustment, but that is a judgment call and may cause disagreement.

  2. The procedure does not handle fairness concerns beyond cost-effectiveness. For example, if we always fund the young, the elderly might feel left out. The procedure doesn't account for that.

  3. It cannot handle cases where the benefit is not in well-being but in other values (e.g., equity, rights). We focus on well-being.

  4. It cannot resolve when the panel disagrees on the estimates (e.g., the expected gain). We require consensus in the time given.

  5. It does not correct for preferences formed under duress beyond the recalibration adjustment. For example, if a patient is depressed and reports low SWB, we don't adjust for that (unless the panel overrides to use OF).

  In summary, the procedure provides a structured way to compare based on cost-effectiveness of well-being gains, using a hybrid of subjective and objective measures with adjustments for adaptation. It leaves unresolved the value judgments about domain weights, the treatment of depression in self-reports, and the inherent prioritization of the young with long life expectancy.

