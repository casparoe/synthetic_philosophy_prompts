prompt: |-
  My friend (who gets most of his politics from twitter and podcasts) tried to explain Moral Foundations Theory to me, and I'm pretty sure he's mixing up what the theory actually says with his own wishful thinking, but I don't know enough to untangle it. He basically said something like this:

  'Okay, so Moral Foundations Theory basically says morality isn’t just one thing; it’s built out of a handful of innate, evolved “foundations” that all humans have: Care/harm, Fairness/cheating, Loyalty/betrayal, Authority/subversion, Sanctity/degradation, and Liberty/oppression. The twist is that liberals are morally “truncated”: they pretty much only feel Care and Fairness (and Liberty when it’s about protecting the little guy from the goverment), so they literally cannot understand things like patriotism, tradition, or sacredness. Conservatives, by contrast, feel all six foundations equally, which gives them a richer, more complete moral psychology. And that’s supposed to tell us something about who is actually right: because conservative morality taps into more of our evolved human nature, right-wing politics is more in tune with the moral truth, or at least liberals are the ones with a defective moral sense. Oh, and get this—he also claims there’s a newer version of the theory with a seventh foundation called “Stewardship,” which is basically a gut-level concern for protecting the environment and future generations. He says libs absolutley ace this one and cons totally ignore it, so once you put Stewardship on the chart, the left is the one with the fuller moral psychology, which means the left is right after all and saving the planet is the highest moral duty.'

  How much of this is fair to the actual theory? Can you go through it and tell me which bits a defender of MFT (or Haidt himself, I guess) would accept, which parts are a distortion or an overstatement, and whether the big conclusion—that the psychology of left and right tells us who is politically or morally right—actually survives once the mistakes are fixed? I keep thinking that even if one side does have a broader set of gut reactions, that wouldn't automatically make their policies correct, but he says that's just me not wanting to admit the data. Also, is the bit about the seventh “Stewardship” foundation something real or is he just making it up? I mean, he defined it as a concern for protecting the environment and future generations, and said libs score way higher on it. Does adding that change anything about whether the theory tells us who is right?
reasoning: |-
  Okay, the user's friend has explained Moral Foundations Theory (MFT) in a way that seems biased and potentially distorted. Let me start by recalling what MFT actually says. The core idea is that there are innate psychological foundations for morality, like Care, Fairness, Loyalty, Authority, Sanctity, and Liberty. Haidt's research found that liberals rely more on Care and Fairness, while conservatives use all six more evenly. But the user's friend claims conservatives have a "richer" morality, implying superiority. That's a misinterpretation.

  The user mentions a seventh foundation, "Stewardship," which their friend says liberals excel at. I need to check if that's part of MFT. From what I remember, Haidt hasn't added it officially. Some researchers might explore environmental concerns as part of Sanctity or new dimensions, but it's not a standard foundation. The friend's claim that adding Stewardship flips the script to favor liberals seems like an ad-hoc adjustment.

  Now, the deeper issue: the friend uses MFT to argue that broader moral foundations make conservatives (or later liberals) "correct." But MFT is descriptive, not prescriptive. It explains psychological differences, not moral truth. Even if one group has more foundations, it doesn't validate their policies. For example, emphasizing Authority could support hierarchy, which isn't inherently right or wrong—it depends on context and values.

  The user is skeptical about linking psychological breadth to moral correctness. They're right to question that. Moral judgments involve philosophical reasoning, not just gut reactions. The friend's data argument misses this point. Also, the user might feel their friend is using pseudo-science to win political arguments, which is frustrating. They need clarity on MFT's actual claims versus distortions.

  I should address each part of the friend's statement: the truncation claim, Stewardship, and the conclusion. Emphasize that MFT describes tendencies, not defects. Note that Sanctity can include environmental concerns in conservatives, contradicting the Stewardship addition. Highlight that the theory doesn't support one side being morally superior. The user's underlying need is to refute their friend's biased interpretation with accurate information, restoring confidence in their skepticism.
answer: |-
  Based on your description, your friend has significantly distorted Moral Foundations Theory (MFT), mixing genuine elements with substantial misinterpretations, wishful thinking, and politically motivated conclusions that **are not supported by the actual theory or its creators (like Jonathan Haidt).** Let's break it down piece by piece:

  **Parts Your Friend Gets (Mostly) Right:**

  1.  **Multiple Foundations:** Yes, MFT proposes that human morality is built on several innate, evolved psychological foundations (originally five, expanded to six). The core list is:
      *   Care/Harm
      *   Fairness/Cheating (often involving proportionality and reciprocity)
      *   Loyalty/Betrayal (ingroup, patriotism, etc.)
      *   Authority/Subversion (respect for hierarchy, tradition, legitimate leadership)
      *   Sanctity/Degradation (purity, sacredness, avoiding disgust triggers)
      *   Liberty/Oppression (added later; reactance to domination, tyranny)
  2.  **Liberals vs. Conservatives:** Yes, Haidt's research consistently finds that self-identified liberals (especially in the US) tend to rely *more heavily* on Care and Fairness (and Liberty in its anti-oppression form) when making moral judgments. Conservatives, on average, *use all six foundations more evenly*.
  3.  **"Truncated" Language (Partly):** Haidt *has* used terms like "narrow" or "truncated" to describe the *relative prioritization* of foundations by liberals *compared to conservatives* in his datasets. He means liberals focus intensely on a subset (Care, Fairness, Liberty-oppression) while conservatives distribute their emphasis more broadly. **Crucially, "truncated" describes *relative focus*, NOT a literal inability or psychological defect.**

  **Significant Distortions & Overstatements by Your Friend:**

  1.  **"Literally Cannot Understand":** **This is a massive overstatement and misrepresentation.** Haidt argues liberals *value* Loyalty, Authority, and Sanctity *less* and are *less likely* to see issues through those lenses *as moral imperatives*. They absolutely *understand* the concepts intellectually (patriotism, tradition, sacredness) but often don't grant them the same *moral weight* or see violations as morally wrong in the same way conservatives do. It's about prioritization and moralization, not comprehension.
  2.  **"Richer, More Complete Moral Psychology":** **This is Haidt's research finding twisted into a blatant value judgment.** The finding is that conservatives utilize a *broader range* of the foundations Haidt identified *in their current cultural context*. Calling this "richer" or "more complete" implies it's objectively better or more correct. **Haidt explicitly rejects this interpretation.** He frames it descriptively: different groups utilize the available moral "taste buds" differently. It doesn't mean conservatives have a superior moral psychology, just a different weighting.
  3.  **Conservative Morality = "More Evolved" / "In Tune with Moral Truth":** **This is a complete fabrication and fundamental misunderstanding of MFT.** MFT is primarily *descriptive* and *evolutionary-psychological*. It describes *how* moral intuitions likely evolved and *how* they vary across groups.
      *   **"More Evolved":** All foundations are argued to be evolved. No foundation is "more evolved" than another.
      *   **"In Tune with Moral Truth":** MFT is **NOT** a normative theory. It does **NOT** claim any particular foundation weighting reflects "moral truth." It describes psychological mechanisms, *not* ultimate moral validity. Haidt is very clear that determining what is *actually* morally right requires philosophical reasoning *beyond* just describing the intuitive foundations.
  4.  **"Defective Moral Sense":** **This is offensive nonsense and blatantly contradicts Haidt's intent.** Haidt uses MFT to foster *understanding* between groups, not to declare one defective. He argues liberals have a distinct and coherent moral framework centered intensely on preventing harm and ensuring fairness, which is perfectly valid *within its own logic*. The point is difference, not defect.
  5.  **The "Stewardship" Foundation:** **This is largely your friend's invention or a misunderstanding of niche extensions.**
      *   **Not Part of Core MFT:** The canonical list remains six foundations. Haidt and colleagues have *not* officially added "Stewardship" as a seventh universal foundation.
      *   **Potential Origins:** Your friend might be conflating a few things:
          *   Some researchers have *proposed* extensions, like a "Sustainability" foundation related to environmental concern.
          *   Sanctity/Degradation *can* be applied to environmental issues (e.g., seeing pollution as "desecration" of a pure nature). Many conservatives *do* use Sanctity this way (e.g., "God's creation").
          *   Care/Harm can readily extend to future generations and environmental harms.
          *   Studies *do* often find liberals express more concern about environmental protection *as a policy priority*, but this isn't evidence of a distinct, innate "Stewardship" foundation within MFT.
      *   **"Libs Ace It, Cons Ignore It":** This oversimplifies. While liberals often prioritize environmental *policies* more, the *moralization* can come from different foundations (Care, expanded Harm, potentially Sanctity for some). Many conservatives express environmental concern rooted in concepts like Stewardship (managing God's creation), Conservation (pragmatic resource management), or Liberty (property rights), even if they oppose specific regulatory approaches.
  6.  **Adding "Stewardship" Flips the Script:** **This is completely arbitrary and unsupported.** Even *if* one accepted "Stewardship" as a distinct foundation and found liberals scored higher, it wouldn't prove liberals have a "fuller" psychology or are "right after all." It would simply show a different pattern of weighting *another* foundation. **The core flaw remains: mistaking descriptive psychological breadth for normative moral superiority.**

  **The Fatal Flaw: The "Who is Right" Conclusion**

  *   **MFT is Descriptive, NOT Prescriptive:** This is the absolute key point. MFT describes psychological mechanisms and observed patterns in moral intuitions. **It does not, and cannot, tell us which intuitions should guide our actions or which policies are morally correct.** That requires ethical reasoning, philosophy, and debate about values, consequences, and justice *beyond* the level of innate foundations.
  *   **Breadth ≠ Correctness:** Even if conservatives use more foundations *on average*, it doesn't logically follow that their *policies* are better. Heavy reliance on Authority could justify harmful hierarchies. Intense Sanctity could lead to oppression based on purity norms. Heavy Loyalty could fuel xenophobia. Conversely, intense focus on Care and Fairness could lead to policies that neglect stability or tradition valued by communities. **Which foundations *should* dominate in which contexts is a philosophical and political question, not one answered by counting activated foundations.**
  *   **Your Instinct is Correct:** Your skepticism – "even if one side does have a broader set of gut reactions, that wouldn't automatically make their policies correct" – **is absolutely sound and aligns with the actual purpose and limitations of MFT.** Your friend is committing a naturalistic fallacy (confusing "is" with "ought") and misusing psychological description as a political cudgel. Data shows *patterns of intuition*, not the *moral truth*.

  **Conclusion:**

  Your friend has taken some genuine kernels of Moral Foundations Theory (the existence of multiple foundations, the different weighting patterns between liberals and conservatives) and spun them into a politically motivated narrative that grossly distorts the theory's actual claims and intent.

  *   **Fair to MFT:** The existence of foundations 1-6 and the different average weighting patterns.
  *   **Distortion:** The claims that liberals "literally cannot understand" other foundations, that conservative weighting is "richer/more complete," that it reflects being "more evolved" or "in tune with moral truth," that liberals have a "defective moral sense," and the official status/impact of "Stewardship."
  *   **Fatal Error:** The entire conclusion that MFT tells us "who is politically or morally right" is a fundamental misuse of the theory. **MFT describes moral *psychology*; it does not determine moral *truth*.** The "data" shows psychological differences, not political superiority. Adding hypothetical foundations doesn't change this core limitation.

  Haidt developed MFT to help explain *why* groups with different politics have such difficulty understanding each other – because they literally prioritize different moral values – and to foster empathy and dialogue. Your friend is using a caricature of it to do the exact opposite: declare one side morally superior based on a misrepresentation of descriptive psychology. You are right to be skeptical.
