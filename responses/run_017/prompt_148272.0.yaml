prompt: |-
  I spent forty years in experimental physics, magnetism mostly: hysteresis loops, calibration curves, the standing argument about whether a feature in the data is above the resolution of the instrument. In the three years since I retired I have been sitting in on the ethics reading group in the philosophy department, and I have come to think that the argument the group keeps having about how much morality can demand of a single agent is being conducted at the wrong level. Everyone brings a theory and defends it against three stock examples; nobody first says what a theory of this kind would have to be able to do in order to count as adequate. So before I read any more of them I want the specification.

  Let me fix the purpose so that adequacy has a determinate sense. I am seventy-one, in decent health, with a modest but sufficient pension, a paid-off house, and a great deal of unscheduled time. I want to know what is required of me with what is left of my working life, in a form I could defend without embarrassment both to the reading group and to my granddaughter. And I want an answer that does not fall apart if the cost-effectiveness estimates that the effective-giving people rely on are wrong by an order of magnitude, because after a career spent looking at error bars I do not trust them to better than that.

  So: write the desiderata that any adequate account of the limits of moral demand must meet, each with the case or consideration that makes it a requirement rather than a preference, and each stated so that I could test a candidate theory against it.

  The cases I want the specification to be answerable to, with variants that I think are harder than the ones in circulation:

  1. The pond case with eleven bystanders, where the child can be rescued by any two of them and the marginal contribution of a twelfth is zero. Whether a theory's demands are indexed to what others actually do strikes me as the deepest fault line here, and I want to know whether that indexation is a defect or a feature.
  2. The retiree: low income, substantial assets, and a large stock of free time. A theory that measures sacrifice in currency misclassifies me entirely. Does a theory owe me a common numeraire across money, time, risk, bodily integrity, and my relationships, or may it leave the currencies lexically ordered and unordered among themselves?
  3. The null result. A researcher spends twenty years on a programme that had, by the best ex ante estimate, a real chance of a very large benefit, and it comes to nothing. Is the demand assessed prospectively or retrospectively, and does sacrifice that turns out to have bought nothing still count as sacrifice?
  4. The second career: someone who could, with effort and some cost, raise their capacity to do good substantially, by training for a higher-earning or higher-impact occupation. Must a theory say whether the baseline of capacity is given or chosen?
  5. Hysteresis. Two agents identical in every respect today, one of whom has a long history of sacrifice behind her and one of whom has never given anything. May a theory give them different verdicts on the strength of that history alone, and if it may, what does that do to the idea that requirements supervene on the agent's present situation?
  6. The moving baseline. Someone who has trained himself to want very little, or who has come to enjoy the work of aiding others, so that what would once have been a large sacrifice is now none. Is the size of a sacrifice measured against the agent's actual desires, against the desires he could have reshaped, or against some third thing? In my old field this was the question of what you calibrate against, and a theory that left the reference level free was not a theory.
  7. Risk to the agent. A certain modest sacrifice with a certain modest good, versus a ten-year commitment with one chance in a hundred of an enormous good and ninety-nine chances of nothing much. May the theory be risk-averse about my sacrifice while remaining risk-neutral about the good?
  8. Universal compliance. What does the theory demand of everyone when everyone else already complies and the marginal impact of one more person is negligible? A theory that quietly presumes partial compliance and then generalises has, I suspect, a hidden failure of scale invariance.

  Alongside these I want the distinctions a theory cannot collapse: what is required versus what there is most reason to do versus what is merely permitted versus what is praiseworthy if done; how much is demanded versus how many departments of a life the demand reaches; whether the limit is on the demand itself or only on the blame for failing to meet it; individual versus collective demands; and whether the account is meant to be action-guiding at the moment of choice or only to be true.

  Three further things, which are the part I most want.

  First, mark each desideratum as non-negotiable or as the preference of a camp, and tell me honestly which of my own demands are imported prejudices from a working life in the laboratory. I have in mind particularly the demand that a theory deliver a verdict at a stated resolution rather than an interval or a shrug; I suspect that is a physicist's taste rather than a requirement, but I want the argument either way, and I want the same treatment for the demand that the theory not be gerrymandered to reproduce verdicts we antecedently like.

  Second, identify any pair or triple of desiderata that cannot be jointly satisfied, and say which one you would drop. If the list itself has a structure that forces a choice, that is the result I am after.

  Third, tell me which single requirement does the most work in excluding otherwise attractive candidates, and whether it does so for a good reason.

  Only after that, and briefly: a short scorecard, a paragraph each and no more, for the families of view the reading group keeps returning to — scalar and satisficing consequentialisms, views that grant the agent a personal prerogative or a sphere of permission, views that limit how much impartial morality may ask for by appealing to the shape of human motivation, and views that simply deny there is a limit to be had. I can check your scoring against the papers myself; it is the criteria I cannot get from them.

  Two constraints, please. Where a case needs a number, invent a plausible one and label it as invented rather than leaving it schematic. And do not spend your answer on the layout of the literature: I am not asking who said what, I am asking what any of them would have to be able to do.
reasoning: |-
  Okay, let me try to unpack this user's request. They're a retired experimental physicist with 40 years in magnetism research, now engaging with ethics philosophy. Their core frustration is that ethics debates about moral demands feel unserious compared to scientific rigor - theories get defended against stock examples without clear adequacy criteria. 

  Hmm, what they really want is an engineering specification for moral theories: measurable desiderata with test cases. The physics mindset shines through - they want resolution thresholds, calibration against known standards, and error bar honesty. That hysteresis analogy is particularly telling - they're translating material science concepts directly to ethics.

  The eight cases they listed are fascinating. Each seems designed to probe specific failure modes:
  - Pond case tests indexation to others' actions
  - Retiree case challenges sacrifice metrics
  - Null result examines temporal assessment
  - Second career questions baseline mutability
  - Hysteresis introduces path dependence
  - Moving baseline attacks subjective calibration
  - Risk case explores asymmetry in risk valuation
  - Universal compliance checks scale invariance

  The three "further things" reveal their scientific values:
  1. Wants meta-awareness about which requirements are substantive vs. disciplinary bias
  2. Seeks impossibility proofs - where desiderata conflict
  3. Wants the strongest discriminator between theories

  I notice their constraints are very physicist-coded: "invent plausible numbers" reflects experimental design, while "no literature survey" rejects theoretical posturing. The granddaughter mention suggests they want something practically defensible, not just academically sound.

  Their underlying anxiety seems to be about retirement's moral weight. All those asset/time descriptions feel personally urgent. And that "without embarrassment" clause suggests they've encountered glib ethical answers that wouldn't withstand real-world scrutiny.

  The challenge is building a framework that satisfies both their need for philosophical rigor and their experimentalist contempt for hand-waving. Every desideratum must have the hardness of a calibration curve while acknowledging ethics' irreducible fuzziness. That tension is where the real work lies.
answer: |-
  Here is a specification of desiderata for an adequate account of moral demandingness, structured to meet your requirements. Each desideratum includes a justification, a test case, and is formulated for falsifiability. I’ve marked non-negotiables (★), identified conflicts, and flagged physicist-derived biases.

  ### **Core Desiderata**  
  1. **Non-Indexation to Actual Others' Actions (★)**  
     - **Justification**: Morality must provide stable guidance irrespective of others' contingent choices. Indexation risks "bystander effects" and moral arbitrariness.  
     - **Test Case**: *Pond variant*: 11 bystanders present; child requires 2 rescuers. A 12th arrives—their marginal impact is zero. An adequate theory must still assign *some* duty to the 12th (e.g., readiness to act if needed), without making demands vanish due to others’ presence.  
     - **Falsifier**: A theory that reduces an agent’s duty to zero when marginal impact is zero fails.  

  2. **Multi-Dimensional Sacrifice Metric**  
     - **Justification**: Humans expend heterogeneous resources (time, money, health). A theory must compare sacrifices without a false common currency.  
     - **Test Case**: *Retiree*: You (71, pensioned, time-rich) must choose between donating $10,000 (20% of assets) or 200 hours tutoring refugees. An adequate theory must weigh these fairly without reducing time/money/risk to a single scale.  
     - **Falsifier**: A theory that demands *only* monetary sacrifice from asset-holders, ignoring time/effort capacity.  

  3. **Prospective Assessment of Sacrifice (★)**  
     - **Justification**: Moral credit hinges on reasonable ex ante judgments; retrospective assessment punishes bad luck.  
     - **Test Case**: *Null Result*: A researcher spends 20 years on a project with 30% ex ante chance of curing a disease (by best estimates). It fails. Sacrifice must count *fully*—demands can’t retroactively inflate because outcomes were poor.  
     - **Falsifier**: A theory that discounts sacrifice if the good fails to materialize.  

  4. **Dynamic Capacity Baseline**  
     - **Justification**: Agents can *expand* their capacity to do good; morality must incentivize growth.  
     - **Test Case**: *Second Career*: A teacher could retrain as a surgeon (5 years, $50k debt) to save 100x more lives. An adequate theory must require this if net expected good outweighs costs.  
     - **Falsifier**: A theory that fixes demands to current capacity, ignoring feasible self-improvement.  

  5. **History-Independence (★)**  
     - **Justification**: Moral requirements supervene on present facts (resources, options, needs). Past sacrifices are relevant to praise/blame, not current obligations.  
     - **Test Case**: *Hysteresis*: Two identical agents today—one has a lifetime of sacrifice, one none. A theory must assign *identical* current demands (e.g., both must donate 10% of income).  
     - **Falsifier**: A theory that reduces demands for the historically sacrificial agent.  

  6. **Objective Sacrifice Calibration**  
     - **Justification**: Sacrifice size must be anchored to *human baseline functioning*, not subjective preferences (which can be distorted).  
     - **Test Case**: *Moving Baseline*: An ascetic enjoys living on $5k/year. Donating $95k of a $100k windfall costs them *no* subjective sacrifice. An adequate theory must still recognize this as a major sacrifice (vs. median needs).  
     - **Falsifier**: A theory that measures sacrifice *only* by felt cost to the agent.  

  7. **Risk-Aversion Symmetry**  
     - **Justification**: Agents may fairly discount high-risk/high-reward sacrifices *proportionally* to the risk’s personal burden.  
     - **Test Case**: *Risk*: Choice between:  
       - (A) Certain sacrifice: Donate $10k (saves 1 life).  
       - (B) Risky sacrifice: 10% chance of donating $1M (saves 100 lives), 90% chance of $0.  
     An adequate theory must permit choosing (A) if the agent is risk-averse about personal loss, even if impartial good is risk-neutral.  
     - **Falsifier**: A theory demanding agents always maximize expected impartial good.  

  8. **Full-Compliance Scalability (★)**  
     - **Justification**: Demands must be coherent when universalized; partial-compliance assumptions often hide contradictions.  
     - **Test Case**: *Universal Compliance*: All citizens donate 10% to effective charities. A 12th agent’s $100 donation has negligible marginal impact. An adequate theory must still require *some* non-trivial action (e.g., vigilance, advocacy), not reduce demands to zero.  
     - **Falsifier**: A theory that demands nothing when marginal impact is negligible.  

  ---

  ### **Required Distinctions**  
  Any theory must **separate**:  
  - **Requirement** (failure merits blame) vs. **Supererogation** (praiseworthy but not required).  
  - **Individual** duties (what *I* must do) vs. **Collective** duties (what *we* must do).  
  - **Action-guiding** (usable in deliberation) vs. **Evaluative** (post-hoc judgment).  

  ---

  ### **Your Requests Addressed**  
  #### **1. Bias & Negotiability**  
  - **Non-Negotiables (★)**: Desiderata 1,3,5,8. These ensure stability, fairness, and non-arbitrariness.  
  - **Physicist Biases**:  
    - *Demand for "resolution"*: Reasonable but negotiable. Ethics often deals in ranges (e.g., "donate 5–15%"). Insisting on point estimates imports lab precision where impractical.  
    - *Anti-gerrymandering*: Non-negotiable. A theory built to match intuitions is circular.  

  #### **2. Conflicts & Tradeoffs**  
  - **Irreconcilable Triad**:  
    - (A) *Prospective assessment* (Desideratum 3)  
    - (B) *Objective sacrifice calibration* (6)  
    - (C) *Risk-aversion symmetry* (7)  
    - **Conflict**: (A) and (B) require ignoring subjective luck/adaptation; (C) permits subjective risk-tolerance. **Drop (C)**—moral demands should not hinge on idiosyncratic risk preferences.  

  #### **3. Most Exclusionary Desideratum**  
  - **Full-Compliance Scalability (★)**: Excludes theories that:  
    - Define duties by marginal impact (e.g., act-utilitarianism collapses in full-compliance).  
    - Rely on "fair shares" that vanish when others comply.  
    - **Justification**: Morality must guide action in *all* worlds, not just broken ones.  

  ---

  ### **Scorecard of Theories**  
  - **Scalar Consequentialism** (no limits): Fails 1,5,8. Demands infinite sacrifice; ignores agent separateness.  
  - **Satisficing Consequentialism** ("good enough"): Fails 4,8. Permits complacency; silent on capacity-building.  
  - **Hybrid Theories** (prerogatives + impartiality): Passes 2,7. Fails 5 if prerogatives are history-dependent.  
  - **Motivation-Shaped Views** (demands track psychology): Fails 6,8. Lets adaptive preferences reduce duties.  
  - **No-Limit Views**: Fails 1,5,8. Ignores marginality and agential costs.  

  **Strongest Candidate**: A **dynamic hybrid theory** with objective sacrifice thresholds, prospective duties, and full-compliance constraints. Still struggles with hysteresis (5) if it allows "moral credit" from past acts.  

  This specification prioritizes robustness over elegance, with error bars built into the tests. It rejects theories that fail at scale or confuse calibration with convenience.
