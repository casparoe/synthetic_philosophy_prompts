prompt: |-
  ok, you're a decision theorist who spends most of your time on heavy-tailed risk and the foundations of expected utility. Please think this through properly before answering — brainstorm, check the math, throw out the weak points, whatever you do — because my friend and I went around in circles for about three hours last night and neither of us would budge.

  So, the setup: fair coin, flip until heads, payout 2, 4, 8, 16… doubling for each tail, expected payout infinite, and nobody sane pays more than ~20 bucks to play. We ended up arguing about something concrete: about forty freelancers I know are starting a tiny mutual risk pool to cover uncapped liabilty clauses in client contracts (the "you owe us whatever the damages turn out to be" kind). My friend says that's literally the Petersburg game — the expected loss has no ceiling, so no finite premium is ever really fair, so we should neither self-insure nor ever sign an uncapped clause. I said that's overblown: the pool has maybe 200k in it, so cap the payout at the size of the pool and the expected value is only about log₂(200000) + 1, call it eighteen dollars' worth of fair premium, which is pocket change. He said that isn't a solution, it's the problem restated: every time you double the cap you add exactly one dollar and it never stops, so the finite-bankroll answer just moves the bump in the carpet. We also both agreed we didn't want the easy escapes — we're not going to just assume log utility of money, and we're not going to just stipulate that sufficiently tiny probabilities get ignored, since both of those fixes seem to ban every heavy-tailed bet including ones we'd obviously want to take.

  Then we tried to be clever. I said: fine, don't let one person eat a whole claim — split every claim forty ways, each member covers 1/40 of whatever hits anybody. That's diversification, that's the entire point of insurance, the variance collapses. He says no: for a distribution whose mean doesn't exist the law of large numbers doesn't apply, the running average is dominated by the single biggest payoff instead of settling down, and pooling actually makes it worse — he claimed the value per play goes up as you add plays or people, something like growing in proportion to log₂ of the number of plays rather than converging. That sounds insane to me and I couldn't refute it, but I also can't tell whether he's just being glib.

  Sanity-check that, especially the pooling argument and the log₂ claim — if he's got the direction wrong, say so — and then give me the five most important implications for how a group like ours should actually handle uncapped tail risk: whether to pool at all, how to think about a premium or reserve when the fair number is either meaningless or absurdly small, when the right move is to simply refuse the contract, that kind of thing. Skip generic risk-management boilerplate; I want what actually follows from the structure of the paradox itself.

  Answer as exactly five numbered points, one or two sentences each, no intro and no wrap-up.
