prompt: |-
  You are a decision theorist and moral philosopher with genuine expertise in the normative status of tiny probabilities attached to enormous values: unbounded versus bounded value functions, stochastic-dominance-style decision rules, the epistemology of low-probability high-stakes hypotheses, and the arguments that connect this territory to long-termist practical reasoning. Please think carefully and at length before answering. I would find it useful if you began with unstructured brainstorming first: lay out, in rough form, at least six distinct ways the position below could fail, including ones you are initially inclined to dismiss as question-begging, before you start ranking or adjudicating anything. Do not give me a literature review or a reading list; I want the arguments themselves, in your own terms.

  Context: I spent three hours last night arguing with a friend about expected value fanaticism, and I came away holding a position I would rather have stress-tested than defended. Here it is, stated as precisely as I can.

  I accept fanaticism: for any positive probability p, however small, and any finite good G, there is some finite good G' large enough that a certainty of G is worse than a p-probability of G'; and correspondingly, a rational agent whose value function is unbounded above ought always to maximize expected value, however long the odds.

  My argument for it, which I will call Inheritance, runs as follows. Take a large world: an agent facing a long run of decisions of the same shape, with outcomes that are probabilistically and causally independent of one another, and no borrowing or insurance constraints. In that setting maximizing expected value in each decision is not merely permissible but obviously right, since aggregate outcomes concentrate around the sum of expectations and any rival rule predictably leaves the agent worse off in the sense she herself accepts. Now take the small world: a single decision of exactly that shape. The only difference between the two cases is the existence, elsewhere, of further decisions that are independent of this one, that I have no control over, and whose number I may have no evidence about. I claim that what I ought to do here cannot depend on whether such decisions exist. So permissibility inherits downward from the sequence to the single case, and the one-shot fanatical verdicts are correct.

  I have exactly one safety valve, which I will call Evidential Proportionality: the decision weight I give to a hypothesis should be discounted by the reliability of the process that produced my probability for it, so that probabilities generated by processes with no track record, no calibration data, or an unbounded space of rivals get heavily discounted. I invoke this to defuse mugging-style cases, and I invoke it to explain why real-world long-shot reasoning is not as crazy as the abstract fanatical verdicts sound.

  Here is what I want from you.

  First: I suspect Evidential Proportionality is in trouble, and I want to know whether the trouble is real. Any purely multiplicative discount leaves fanaticism fully intact, because a positive weight, however discounted, is still beaten by a large enough ceiling; so either my safety valve is too weak to defuse anything, or it is not really a discount but a truncation, in which case it is doing all the work and my fanaticism is decorative. Is that dilemma genuine, is there a third option, and if the valve is doing all the work, would an honest proponent of my position have to admit she has become a bounded-value theorist in everything but name?

  Second: what would count against the package of fanaticism plus Inheritance plus Evidential Proportionality, ranked from fatal to merely awkward? I want the defeaters sorted into kinds, and I want you to say which kind you take to be most telling for a view like this. Cases and intuitions, including ones I have not mentioned. Formal results, such as the fact that unbounded value plus a modest dominance principle seems to entail fanaticism, so that escaping it costs me bounded value or something else I would hate to lose: if I have misdescribed that landscape, or if the escape routes are cheaper or more numerous than I think, say so, because that would itself be a defeater. Consequences I am committed to that might be unacceptable: I have in mind especially that a fanatic looks obliged to spend nearly all her resources investigating whichever hypothesis has the highest ceiling rather than doing anything else, and that a fanatic's ranking of ordinary options is controlled by facts about the upper tail that no possible evidence could ever distinguish between. And structural results: I want to know whether my position collapses into a rival, whether it can be shown to forbid what it requires, and whether it is exploitable or cyclically incoherent in any way.

  Third: which of these defeaters would a committed fanatic concede as genuinely counting against the view, and which would she rightly dismiss as intuition-mongering, as presupposing the bounded-value conclusion, or as complaining that the view is demanding rather than wrong? I would like the friend's objections and the insider's concessions kept separate.

  Fourth: an honest assessment of exposure. Is my position insulated? Given that its verdicts are determined by ceilings and by ultra-low-probability structure, is there any argument, case, or development that could in principle move me, or have I qualified the view into something unfalsifiable? And if I have, is that a problem for a view of this kind, or is it in order, because a thesis in normative axiology is answerable only to coherence and agglomeration constraints and not to evidential checks? I am genuinely unsure which way to go here and I want your actual view, not a diplomatic one.

  Fifth: what does my position predict that its rivals do not? What verdicts does fanaticism issue that bounded-value, tempered, or stochastic-dominance views withhold, and are the differences ones I should be embarrassed by or proud of? Relatedly, does the case for fanaticism get stronger or weaker once I know that many other agents face structurally similar choices with independent outcomes, and does the answer to that support or undercut Inheritance?

  Two last things. The friend's strongest move, as I recall it, was that the abstract fanatical verdicts have already shown up in the wild: real people now allocate serious resources to interventions whose case rests on a very small probability of an astronomically large payoff. Tell me whether the existence of that practice is any evidence at all for or against the view, or whether it is dialectically inert. And what would move me most, I think, is not a case where fanaticism yields a verdict I find uncomfortable but a demonstration that it is incoherent or self-defeating, or that Inheritance smuggles in something false about independence; a demonstration that it is merely very demanding would move me much less, and I would like you to tell me if you think that ranking of mine is itself a mistake.
reasoning: |-
  Okay, let me start by unpacking the user's position. They're defending fanaticism through Inheritance and using Evidential Proportionality as a safety valve. I need to brainstorm at least six distinct ways this could fail. The user wants rough, unstructured ideas first, including ones I might dismiss as question-begging.

  First, the Independence Smuggle in Inheritance. The argument assumes that adding independent decisions elsewhere shouldn't affect the current choice. But maybe it does. In the large world, the law of large numbers ensures convergence, but in a small world, one decision has no such guarantee. The user might counter that the normative stance shouldn't depend on external factors, but that's the core issue—maybe it should.

  Second, Evidential Proportionality as a Trojan Horse. They call it a discount, but if it's multiplicative, fanaticism remains. If it truncates, it's bounded utility in disguise. The user might not realize that their safety valve either doesn't work or fundamentally changes their position.

  Third, Resource Allocation Implosion. A fanatic should spend resources investigating high-ceiling hypotheses. But gathering evidence on one hypothesis might reduce the probability of others. If all resources go to one area, others are neglected, potentially missing higher expected value options. This could make the strategy self-defeating.

  Fourth, Epistemic Collapse. Fanaticism relies on tail probabilities, which are often resistant to evidence. If no evidence can update these probabilities meaningfully, the view becomes unfalsifiable. That's problematic for a normative theory, as it might not engage with empirical realities.

  Fifth, Dynamic Inconsistency. Over time, as evidence accumulates, the fanatic might have to constantly shift focus to new high-ceiling hypotheses, leading to erratic behavior. This instability could undermine rational planning.

  Sixth, Aggregation Paradox. In a large world with many agents, coordination problems arise. If everyone acts fanatically, they might collectively over-invest in high-risk options, leading to worse outcomes. Inheritance assumes individual actions are independent, but collective effects could negate the benefits.

  Now, evaluating these. Evidential Proportionality seems the most critical. If it's truly multiplicative, it doesn't solve mugging problems. If it truncates, the user is a bounded utilitarian without admitting it. That's a fatal flaw because it undermines their core argument for fanaticism.

  The Independence objection is also strong. Inheritance might depend on the existence of other decisions to justify expected value maximization. Removing that context changes the normative landscape. The user claims it shouldn't matter, but perhaps it does, especially if other agents' actions affect overall outcomes.

  Resource allocation is a practical defeater. The fanatic's focus on tail risks could lead to neglect of more certain, lower-impact actions. This isn't just demanding; it's potentially self-defeating if investigating one hypothesis lowers the probability of others, creating a cycle where no progress is made.

  Epistemic issues make the view unfalsifiable, which is a theoretical weakness. If tail probabilities can't be updated, the theory isn't responsive to evidence, making it dogmatic. For a position grounded in expected value, this is awkward.

  The user's ranking of defeaters matters. They're more concerned with incoherence than demandingness. So pointing out that Evidential Proportionality leads to bounded utility might move them. Also, showing that Inheritance smuggles in dependence on other agents could challenge their independence premise.

  Real-world examples of fanaticism, like longtermism investing in low-probability high-impact interventions, aren't strong evidence either way. They show application but don't validate the theory. The critical test is whether such practices lead to coherent outcomes or resource misallocation.

  Finally, exposure. The position might be insulated through Evidential Proportionality, but if that's a truncation, it's bounded utility. Admitting that would collapse their view. Alternatively, if they stick to multiplicative discounting, they can't avoid fanaticism's extreme demands. Either way, there's a problem.
answer: |-
  Below is a stress-test of your position—fanaticism justified by Inheritance, moderated by Evidential Proportionality—structured as requested. I begin with unstructured brainstorming of six distinct failure modes (including initially dismissible ones), then address your five queries in sequence, incorporating defeaters, concessions, exposure, and predictions. My approach is adversarial but charitable, targeting coherence and practical implications over intuitive repugnance. I assume familiarity with technical terms (e.g., stochastic dominance, calibration) but define them implicitly through argument.

  ### Unstructured Brainstorming: Six Failure Modes
  1. **Independence Smuggle**: Inheritance assumes that adding *externally controlled*, independent decisions is normatively inert. But if those decisions are real (even if uncontrolled), they alter the *epistemic* context: e.g., learning that other agents face similar choices might update priors about hypothesis-space structure. Inheritance implicitly relies on a *causal* independence that ignores *evidential* linkages, violating the "no evidence about number" clause.  
  2. **Resource Dynamics**: In the large world, EV maximization concentrates outcomes; in the small world, one-off tail risks dominate. But resource constraints bind differently: investigating G' requires diverting resources from *other* fanatical gambles. A fanatic must optimize *across* all hypotheses simultaneously, risking self-defeat if tail-investigation consumes resources needed for higher-EV tail pursuits.  
  3. **Proportionality as Truncation**: Evidential Proportionality discounts untestable hypotheses. But if "discount" is multiplicative, fanaticism persists (p→εp, ε>0 still unbounded). If it truncates (p=0 beyond some reliability threshold), it covertly bounds value. The dilemma is genuine: no third option exists without smuggling in a bound.  
  4. **Tail Epistemology**: Unbounded value + fanaticism implies choices hinge on hypotheses with probabilities below any calibratable threshold (e.g., P<10^{-100}). But if no evidence can *distinguish* such hypotheses (all are equally unsupported), fanaticism forces arbitrary allocations—undermining normative action-guidance.  
  5. **Dynamic Inconsistency**: Inheritance assumes static value functions. But in iterated small worlds, fanaticism may demand investing in G' today, reducing resources for future gambles. If future gambles have higher ceilings, this violates stochastic dominance: sacrificing a dominated option for a non-dominated one.  
  6. **Aggregation Paradox**: In the large world, EV maximization works by the law of large numbers. But if *many* agents face *identical* small-world choices (e.g., asteroid deflection), fanaticism may demand all invest in G', causing coordination failures (e.g., over-investment in one tail risk). Inheritance’s "no control" clause ignores that collective action can alter hypothesis probabilities.  

  ### First: Evidential Proportionality’s Trouble  
  The dilemma is **genuine and fatal**. Multiplicative discounts (e.g., reliability weight ε) leave fanaticism intact: for any ε>0, εp >0, so sufficiently large G' still dominates. Only truncation (ε=0 for unreliable hypotheses) defuses mugging, but this:  
  - **Covertly bounds value**: If hypotheses with P < δ (for some δ>0) are ignored, the effective value function is bounded by max{G' | P(h) ≥ δ}.  
  - **Collapses fanaticism**: Your "positive probability p" now excludes unreliable hypotheses, making boundedness implicit.  
  - **Undercuts Inheritance**: In the large world, unreliable hypotheses *could* be included (if aggregate behavior is calibratable), but Inheritance forces small-world truncation, creating a discontinuity.  

  **Verdict**: An honest proponent must admit this is bounded utility disguised as fanaticism. The valve isn’t "doing all the work"—it’s dismantling the engine.  

  ### Second: Defeaters Ranked  
  **Fatal Defeaters** (undermine coherence):  
  1. **Proportionality-As-Truncation**: As above, reduces to bounded utility.  
  2. **Tail Epistemology + Guidance Failure**: If hypotheses with ultralow P are epistemically indistinguishable (no possible evidence updates them differentially), fanaticism cannot rank actions non-arbitrarily. This violates decision-theoretic minimal rationality (e.g., no decisive grounds to prefer hypothesis A over B with same ceiling). Inheritance fails because the large world provides calibration data, but the small world lacks it.  

  **Awkward Defeaters** (expose costs):  
  3. **Resource Implosion**: Fanatics should invest in hypothesis-space exploration for max ceiling. But:  
     - Marginal cost of investigating one tail risk may exceed marginal EV gain from others.  
     - Real-world constraints (e.g., time) force tradeoffs. If exploring "p(alien invasion)" costs resources needed for "p(supernova mitigation)," and the latter has higher EV, fanaticism is self-defeating.  
  4. **Dynamic Inconsistency**: Sacrificing near-term certain goods for tail risks may reduce capacity to pursue future tail risks with higher ceilings—violating stochastic dominance.  

  **Formal Landscape**:  
  - **Unbounded value + weak dominance → fanaticism** is correct (e.g., Beckstead 2013, Wilkinson 2023). Escape routes:  
    - **Bounded utility**: You reject this.  
    - **Stochastic dominance restrictions**: E.g., reject gambles where the tail is *infinitely* worse than alternatives (Bostrom's "extremal option"). But this requires ad hoc thresholds.  
    - **Indexical uncertainty**: If agents are uncertain about their "temporal position," fanaticism may not dominate (Thorstad 2024). This preserves unboundedness but requires extra commitments.  

  ### Third: Concessions vs. Intuition-Mongering  
  **Committed fanatic would concede**:  
  - **Proportionality-as-truncation**: "If Evidential Proportionality zeros out hypotheses, I’m a bounded theorist. But I can refine it to avoid that." (But refinement fails—see First.)  
  - **Tail epistemology**: "Ultralow-P hypotheses may be action-guiding only with calibration data. Inheritance provides that in large worlds, but small worlds might need pragmatism."  
  - **Resource dynamics**: "Fanaticism is demanding, but normatively correct. We should restructure institutions to enable tail-investigation."  

  **Rightly dismiss as question-begging**:  
  - "Fanaticism forces insane sacrifices (e.g., donate to Pascal’s Mugger)." → Presupposes bounded utility.  
  - "Longshots are irrational because they usually fail." → Empirical claim irrelevant to normative EV maximization.  
  - "Inheritance ignores risk aversion." → Assumes a concave utility function, which fanaticism rejects.  

  ### Fourth: Insulation and Falsifiability  
  Your position is **insulated but incoherently so**:  
  - **Evidential Proportionality** makes it unfalsifiable *by design*: It discounts any counterevidence to tail hypotheses as "unreliable," rendering fanaticism immune to empirical challenge.  
  - **Normative vs. empirical**: Axiological coherence *can* demand insulation (e.g., no empirical test for "is pleasure good?"). But your view relies on **epistemic rationality** (calibration, reliability), which *is* answerable to evidence. When tail probabilities are untestable, axiology and epistemology clash, making your view self-undermining: It needs empirical grounding for Proportionality but evades it.  
  - **What could move you**: Proof that fanaticism + Inheritance forces choices that *lose* unbounded value (e.g., resource dynamics). Or that unbounded value implies *no* rational choice (tail epistemology).  

  ### Fifth: Unique Predictions and Collective Action  
  **Unique verdicts**:  
  - Fanaticism mandates:  
    - Prioritize interventions with **no plausible mechanism** but high ceilings (e.g., "simulation rescue" over malaria nets).  
    - Reject **boundedly good certainties** for tiny chances of near-infinite goods (e.g., save 1 life now vs. 10^{-100} chance of 10^{100} lives).  
  - **Embarrassments**: Arbitrariness in indistinguishable tails (e.g., investing in "AI risk" over "nanotech risk" based on ceilings when probabilities are equally uncalibrated).  
  - **Points of pride**: Consistency in large worlds, avoidance of threshold arbitrariness.  

  **Collective action**:  
  - Inheritance **strengthens** if others' actions are independent: More gambles → better concentration.  
  - But it **undercuts** Inheritance if collective action alters probabilities (e.g., 1,000 agents deflecting asteroids reduces P(catastrophe) nonlinearly). Here, Inheritance ignores strategic dynamics, making it self-defeating.  

  ### Real-World Practice and Final Moves  
  **Real-world longtermism**:  
  - **Dialectically inert**: Existing practice isn’t evidence for/against fanaticism. It may stem from bounded views (e.g., "transformative AI has P>0.1") or irrational enthusiasm. Fanaticism’s test is *structural*, not empirical.  

  **What should move you**:  
  - **Incoherence**: Inheritance smuggles in **evidential dependence**. The large world provides calibration data for tail risks; the small world does not. Thus, "same shape" decisions aren’t identical—Inheritance fails.  
  - **Self-defeat**: Resource allocation to tail investigation may **lower** the ceiling of other hypotheses (e.g., neglecting AI safety research while chasing Dyson spheres could allow an AI catastrophe that forecloses space colonization).  
  - **Not mere demandingness**: Your ranking is correct—demandingness is orthogonal to truth. But incoherence is fatal.  

  **Final verdict**: Your position’s core flaw is **Evidential Proportionality** dismantling fanaticism while **Inheritance** ignores epistemic context-dependence. The most honest path is to drop fanaticism, embrace bounded utility, and defend a high bound—or reject Inheritance and accept that large/small worlds differ normatively. Neither is painless, but both are coherent. If you retain the view, stress its *epistemic courage*: It stares down arbitrariness in value-maximization where others impose bounds. But its engine is broken.
