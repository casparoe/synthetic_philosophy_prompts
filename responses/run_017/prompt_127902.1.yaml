prompt: |-
  Hey — for the next hour please act as my in-house philosopher of history (and, honestly, as someone who's sat on too many committees): think carefully, and do some free-form brainstorming first about what rule set could even generate our track record before you commit to an answer. I sit on our city's Memory and Records Board, and we've made a mess for ourselves by never writing down our principles. Cases we've ruled on, roughly in order: (1) a plaque saying soldiers set the 1921 workers' hall fire, when the fire brigade's own report blames the wiring — we had the plaque recut to the archival version; (2) the town's founding-day festival, which commemorates a battle that the muster rolls place twelve kilometres away and a fortnight later — we left the festival entirely alone but paid for an interpretive panel at the actual site; (3) a deported families' association's oral history of expulsion from a village whose land registry burned in 1944 — with the record silent we accepted the memory as the best available evidence and put up a marker worded "according to the memory of the descendants"; (4) the state museum's display claiming a 1948 strike was organised by outside agitators, which turned out to have been drafted by the then-ministry with nothing behind it — we forced removal, saying explicitly that an institution's memory of itself gets no deference; (5) a bronze statue to a local woman said to have hidden nineteen children, where the archives name a different rescuer, but where the misattributed story is what actually inspired a rescue network that saved people in 1942 — we kept the statue and bolted on a second plaque naming the real person and explaining the error; (6) a neighbourhood association wanting a sign for "the green, common land since time immemorial", where the deeds show private ownership — we refused the sign.

  Our new case is the one everyone's dreading. For about sixty years the town has held a dawn walk to a meadow where, by local memory, forty-one people deported in 1943 were shot; two independent archival series (transport rosters and burial registers, neither of them produced by any party to the dispute) put the shootings at a gravel pit three kilometres away and show the meadow was a storage yard with no burials. Three complications. First, the specific claim only appears in print from 1985 in a heritage society booklet, though residents interviewed a few years earlier remember the walk "always" going to the meadow without saying why — so the practice looks older than the claim, but we can't tell by how much. Second, since the nineties the walk has become the town's biggest civic event, run by an association that now includes descendants of people deported from other districts entirely, and a court ruling from that era — relying on the belief — blocked a road across the meadow; the meadow is up for sale and the buyer says the belief has no documentary basis. Third, an organised group of the actual descendants of the forty-one, a small community that's been marginalised in local life, want the walk rerouted to the gravel pit. I've also noticed something I can't get out of my head: our archive now holds a few hundred items — news stories, the court judgment, school materials, our own minutes — that all attest to the shooting at the meadow and that all exist *because* people believed it. So the record isn't clean of the memory; it's partly a sediment of it.

  What I want from you: two or three candidate rules that fit all six precedents about equally well (something like record-primacy-with-an-interested-party-exception, versus a split rule where the record governs factual assertion and memory governs commemorative practice, versus something about what a false memory went on to *cause*), what each predicts we should do here, and your best guess with the reasons for preferring it — which precedent is really the closest analog, and what principle would we be adopting either way (that a practice built on a false claim inherits the defect, say, or that the archive is not a court of appeal for a ritual). Then tell me which single further case would best separate the surviving rules — I keep going back and forth between a case where the false memory is the descendants' *own* and they want to keep it, and a case where the record's only support is documents the memory generated. And please say something about that sedimentation point: how should a record-first rule treat documents whose entire provenance is the memory they're supposed to be checking? I care much less about which way we go than about whether we can say what we're doing.
reasoning: |-
  Okay, let me approach this systematically. The user is essentially asking me to function as a philosophical advisor for their city's Memory and Records Board. They've presented six historical cases where the board made rulings about historical accuracy versus collective memory, and now there's a seventh, highly sensitive case about a memorial walk based on potentially incorrect information.

  First, I need to understand the pattern in those six cases. Looking at them:

  Case 1 corrected a plaque to match archival records about a fire. Case 2 allowed a festival to continue while adding factual context at the actual site. Case 3 accepted oral history when no records existed. Case 4 rejected an institution's self-serving memory. Case 5 preserved a statue with inspirational value while correcting its factual basis. Case 6 rejected a claim that contradicted property deeds.

  Hmm... there seem to be at least three principles emerging here: 1) When records exist and aren't tainted by bias, they usually prevail. 2) Commemorative practices get some leeway, especially when they have independent social value. 3) The source and nature of the "memory" matters - marginalized groups get more deference than institutions.

  Now for the tough seventh case: The dawn walk to the meadow versus archival evidence pointing to the gravel pit. The complications make this messy - the walk predates the specific claim, it's become a major civic event, there are legal consequences, and crucially, the descendants themselves want it changed. Plus that fascinating point about the archive containing documents that only exist because of the false belief.

  I'm struck by how this case combines elements from several precedents. Like Case 3, it involves vulnerable descendants; like Case 5, the false belief inspired real action; like Case 2, it's an established practice. But unlike any previous case, the historical record itself is contaminated by the very memory it should be checking.

  The user wants me to propose 2-3 candidate rules that fit all six cases, apply them here, and suggest a "tiebreaker" hypothetical. They particularly care about consistency and transparency in decision-making.

  Let me brainstorm those candidate rules:

  First could be "Contextual Primacy" - records generally rule unless the memory serves an important social function that would be undermined by correction. This fits Case 1 (no social function lost) and Case 5 (social value preserved).

  Second might be "Provenance-Based Epistemology" - the trustworthiness of sources depends on their origin. Institutional memories (Case 4) get less deference than community ones (Case 3), and generated records (like these news articles) are suspect.

  Third could be "Consequence Weighting" - what matters most is what the belief enabled. Case 5 kept the statue because its false story inspired real rescue efforts. Case 6 rejected the claim because it had property implications.

  Applying these to the walk case gives different answers: Contextual Primacy might keep the walk but add markers; Provenance-Based might side with the descendants; Consequence Weighting might consider the walk's community-building value versus the descendants' wishes.

  The sedimentation problem is philosophically fascinating. If documents are created by belief, can they really "verify" that belief? It's like a snake eating its own tail. A strict record-first approach would need to treat such documents as secondary evidence at best.

  For a tiebreaker case, I'm considering two options: One where descendants want to keep their own false memory (testing if origin trumps accuracy), versus one where the only "records" were generated by the memory (testing the sedimentation issue). The latter might be more revealing.

  Ultimately, I think the descendant testimony in this case functions like the oral history in Case 3 - it's direct and from affected parties. That might be the closest analog, suggesting we should prioritize their wishes over the established practice. But I'll need to lay out all options carefully, since the board's credibility depends on consistent principles, not just this one decision.
answer: |-
  Based on your precedents and the sedimentation paradox, here are three candidate rulesets that fit your six cases, their application to the new case, my recommended approach, and a tiebreaker hypothetical:

  **Candidate Rule 1: Contextual Primacy with Source Scrutiny**  
  *Rule:* Archival records govern factual assertions unless:  
  - Records are absent/fragmented (Case 3)  
  - Records are institutionally self-serving (Case 4)  
  - Memory has generated significant independent social value (Case 5)  
  Commemorative practices may stand if divorced from contested facts (Case 2).  
  *Precedents aligned:* All six. Case 1 (records override), Case 2 (practice preserved sans claim), Case 3 (no record → memory), Case 4 (tainted record rejected), Case 5 (social value preserved), Case 6 (records override).  
  *Prediction for new case:* Reroute the walk. Records (transport rosters/burial registers) are independent and unambiguous. The meadow claim has no pre-1985 documentation, and the civic event’s value isn’t tied to the location (unlike Case 5’s statue). Add interpretive panels at both sites.  
  *Weakness:* Underestimates how the ritual’s *existing form* has become social fact.

  **Candidate Rule 2: Functional Differentiation**  
  *Rule:* Split jurisdiction:  
  - Records determine *what happened* (Cases 1, 4, 6)  
  - Community practice governs *where/how we remember* (Cases 2, 5)  
  Except when:  
  - Affected descendants challenge (Case 3’s oral history acceptance)  
  - Practice relies on actively false claims (Case 6’s refusal)  
  *Precedents aligned:* Case 1 (fact correction), Case 2 (practice untouched), Case 3 (descendant authority), Case 4 (fact correction), Case 5 (practice preserved despite error), Case 6 (false claim rejected).  
  *Prediction:* Keep the walk at the meadow but revise its narrative. The walk is commemorative practice (like the festival in Case 2), but descendants of the *actual victims* (invoking Case 3’s logic) demand correction → erect a memorial at the gravel pit and revise walk signage to: "Commemorating those shot near here in 1943. Archival evidence places the events 3km northeast; this walk honors decades of community remembrance."  
  *Weakness:* Risks "splitting the baby" unsatisfactorily.

  **Candidate Rule 3: Consequentialist Provenance**  
  *Rule:* Prioritize sources based on:  
  - Independence from parties (Cases 1, 4)  
  - Proximity to affected groups (Case 3)  
  - What the belief *enabled* (Case 5’s rescue network)  
  Reject claims serving only institutional/political interests (Cases 4, 6).  
  *Precedents aligned:* Case 1 (independent report > plaque), Case 3 (descendant memory > silence), Case 4 (self-serving record rejected), Case 5 (consequences honored), Case 6 (claim served no civic good).  
  *Prediction:* Move the walk. The gravel pit has superior archival provenance. The meadow’s "social consequence" (civic unity) doesn’t outweigh:  
  a) The descendants’ wishes (proximity principle)  
  b) The record’s independence  
  c) The fact the walk’s value is portable (unlike Case 5’s fixed statue).  
  *Weakness:* Subjective "consequence" valuation.

  **My Recommendation: Rule 3 (Consequentialist Provenance)**  
  *Why:*  
  - **Closest analog is Case 3:** Marginalized descendants’ lived experience trumps ambiguous tradition. Their demand for accuracy mirrors oral history’s acceptance when records burned.  
  - **Sedimentation handled:** Documents generated by belief (news, court records) are *secondary* evidence of the *belief’s existence*, not primary evidence of the event. Treat them as artifacts of commemoration (like the statue in Case 5), not historical proof.  
  - **Principle adopted:** "The archive corrects, but the oppressed descendants’ truth claims correct the archive’s limits." This fits your rejection of institutional self-memory (Case 4) and deference to silenced groups (Case 3).  
  - **Practical solution:** Reroute the walk to the gravel pit. Install a permanent memorial there co-designed with descendants. At the meadow, place a marker: "Site of community remembrance (1985–present) for victims shot 3km away. This meadow symbolizes our ongoing duty to remember."  

  **Tiebreaker Case to Separate Rules:**  
  *Propose:* "A 19th-century diary surfaces proving a town founder celebrated for sheltering fugitive slaves was actually a informant. Descendants of the fugitives (now integrated) want to keep existing memorials unchanged, arguing the *myth* inspired generations’ civil rights work. Independent archives confirm the diary’s authenticity."  
  - **Rule 1 (Contextual Primacy)** amends memorials: records are clear.  
  - **Rule 2 (Functional Differentiation)** keeps memorials (practice) but adds explanatory plaques (fact).  
  - **Rule 3 (Consequentialist Provenance)** keeps memorials: the myth’s positive consequences and descendants’ wishes outweigh archival proof.  

  **On Sedimentation:**  
  A record-first rule must classify memory-generated documents as *reflexive artifacts*, not evidence. Like Case 4’s fabricated display, they prove institutional/communal belief, not events. Your archive should tag such items: "Documenting the *commemoration* of X, not X itself." This prevents self-justifying loops while honoring memory’s cultural role.  

  **Final Thought:**  
  Your precedents suggest a deeper principle: **Memory is sovereign when the record is silent or oppressive; the record is sovereign when memory harms the marginalized.** The meadow walk’s expansion diluted the victims’ descendants’ voice—echoing Case 4’s rejection of institutional self-memory. Correcting this serves justice better than preserving a harmonious fiction. What matters is whether the Board can say: "We prioritized the silenced over the consensus."
