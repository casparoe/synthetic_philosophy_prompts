   The error rates for group A under the equalized odds constraint will be:
     FPR_A = 0.4, FNR_A = 1 - TPR_A = 1-0.6 = 0.4.
     So error rate = 0.5 * (FPR_A + FNR_A) = 0.5*(0.4+0.4)=0.4.

   Whereas if we optimize group A separately, we can achieve a lower error rate. For example, using the threshold that minimizes error rate. For group A, the cost of false positive and false negative are equal, so we should use threshold at 0.5.

   At threshold >0.5: 
     predict positive if s>=0.5.
     FPR_A = P(S>=0.5|Y=0) = 0.1091+0.0545 = 0.1636
     TPR_A = 0.2545+0.4909 = 0.7454
     FNR_A = 1-0.7454=0.2546
     error rate = 0.5*0.1636 + 0.5*0.2546 = 0.5*(0.4182)=0.2091.

   So by using the equalized odds constraint, we increase group A's error rate from 0.2091 to 0.4.

   For group B, you will recall, under the optimal separate rule (using score>=0.6), we have:
     FPR_B = 0.4, FNR_B = 1-0.6=0.4, error rate=0.4.
   and under equalized odds, we are also at error rate 0.4.

   So group B is no better off, while group A is made worse off. This is leveling down.

  Specification 6: Demographic parity and predictive parity.

  Demographic parity: require that the selection rate (P(Y_hat=1)) is the same for both groups.

   We can choose different thresholds for each group to achieve the same selection rate.

   In this case, the overall selection rate for a group is: P(Y_hat=1) = P(Y=0)*FPR + P(Y=1)*TPR = 0.5*(FPR+TPR)

   We are free to choose any (FPR, TPR) on the group's ROC curve.

   For group A, the curve goes through (0.0545,0.4909), (0.1636,0.7454), (0.2545,0.8363), (0.5090,0.9454), (1,1).

   For group B, the curve goes through (0.4,0.6), (1,1).

   We can choose for each group a point such that 0.5*(FPR+TPR) = c, for some c.

   The cost in accuracy: we want to minimize the error rate for each group subject to the selection rate being c.

   But note: we can first find the c that allows both groups to have the same selection rate with as little error as possible.

   error = 0.5 * (FPR + FNR) = 0.5 * (FPR + 1 - TPR) = 0.5 * (1 + FPR - TPR)

   So for fixed selection rate c = 0.5*(FPR+TPR), we have TPR = 2c - FPR.

   Then error = 0.5*(1 + FPR - (2c - FPR)) = 0.5*(1 + 2FPR - 2c)

   So for fixed c, to minimize error, we minimize FPR.

   Alternatively, we maximize TPR for fixed FPR, which is what the ROC curve does.

   For a given group, the minimal error rate for a given selection rate c is achieved by the point on the ROC curve that minimizes error for that c.

   But we need the same c for both groups.

   What is the range of c? c must be such that there is a point on group B's ROC curve with selection rate c. For group B, selection rate c_B = 0.5*(FPR_B+TPR_B). For group B's ROC points:
     (0,0): c=0
     (0.4,0.6): c=0.5*(0.4+0.6)=0.5
     (1,1): c=1

   So c must be in [0,1], but only 0, 0.5, and 1 are achievable without randomization for group B? With randomization, any c in [0,0.5] can be achieved by interpolating between (0,0) and (0.4,0.6): then c = 0.5 * (FPR+TPR) = 0.5 * (0.4p + 0.6p) = 0.5 * p, for p in [0,1] -> c in [0,0.5]. For c in [0.5,1], interpolate between (0.4,0.6) and (1,1): selection rate = 0.5 * [0.4+q*0.6, 0.6+q*0.4] wait not linear.

  Actually, if we do a convex combination of the two rules for group B: 
    Rule1: threshold>0.6 -> (FPR=0.4, TPR=0.6) -> selection rate=0.5.
    Rule2: always approve -> (FPR=1, TPR=1) -> selection rate=1.
    Mixture: with probability p, use Rule1, with probability 1-p, use Rule2.
    Then FPR = p*0.4 + (1-p)*1 = 1-0.6p
           TPR = p*0.6 + (1-p)*1 = 1-0.4p
           selection rate = 0.5 * (FPR+TPR) = 0.5 * (2 - p) = 1 - 0.5p.
    So for p in [0,1], selection rate in [0.5,1].

   Similarly, for the lower part: between never and Rule1, selection rate in [0,0.5].

   So group B can achieve any selection rate c in [0,1] with no error cost beyond what is necessary for that c.

   For group A, we can achieve any selection rate in [0,1] by choosing the appropriate point on the ROC curve.

   To have the same selection rate c for both groups, we can choose c arbitrarily. The error rate for a group will be the minimal possible for that group given c.

   In this case, since group A's ROC curve is above group B's, for a given selection rate c, group A will have a lower error rate than group B.

   For example, take c=0.5.

   For group B, to achieve c=0.5, we use the deterministic rule: threshold>0.6, which gives selection rate=0.5, and error rate=0.5*(0.4+0.4)=0.4.

   For group A, to achieve selection rate=0.5, we have to solve:
     0.5*(FPR+TPR)=0.5 -> FPR+TPR=1 -> TPR=1-FPR.

   So we are looking for a point on group A's ROC curve such that TPR=1-FPR.

   The ROC curve for group A: TPR as a function of FPR. We have the points. We see that at FPR=0.5, TPR=0.9454, which is >0.5. We need TPR=1-FPR=0.5.

   So we need a point where FPR=0.5 and TPR=0.5, but group A's curve is above the diagonal. The only point on the diagonal is (0,0) and (1,1).

   The closest point might be interpolating between (0.5090,0.9454) and (0.2545,0.8363) to find a point where TPR=1-FPR.

   But note: the curve is above the diagonal, so there is no point on the curve on the diagonal except the endpoints. To achieve TPR=1-FPR, we would have to use a rule that is not on the curve, but we can use randomization to achieve any point below the curve. The diagonal is below the curve, so we can achieve it.

   Specifically, for group A, we can achieve (FPR, TPR) = (0.5,0.5) by setting the constant rule: approve with probability 0.5, then FPR=0.5, TPR=0.5.

   Or by setting a threshold and then randomizing.

   But then the error rate for group A would be 0.5*(0.5+0.5)=0.5.

   Or we can choose a point on the curve that has selection rate 0.5. 

   selection rate c=0.5 means FPR+TPR=1. 
   group A's curve: let's see the points:
     (0.0545,0.4909): 0.0545+0.4909=0.5454 -> >0.5
     (0.1636,0.7454): 0.9090 -> >0.5
     (0.2545,0.8363): 1.0908 -> >0.5
     ...

   None have exactly 1. The closest is the first point: 0.5454.

   We can achieve selection rate=0.5 by using a point on the curve and then having a mixture with the never-approve rule.

   For example, use the threshold>0.9 rule which has selection rate=0.5*(0.0545+0.4909)=0.5*0.5454=0.2727.
   to increase the selection rate to 0.5, we can mix with the always-approve rule.

   Alternatively, we can choose a threshold and then randomize to achieve the desired selection rate with the best error rate.

   But note: for group A, the minimal error rate for a given selection rate c is given by the point on the ROC curve that is most to the northwest for that c.

   For c=0.5, we can achieve it by using the threshold>0.9 and then sometimes approve when we wouldn't to increase the selection rate.

   This will increase both FPR and TPR, and error rate will increase.

   In any case, the error rate for group A will be better than for group B.

   For example, if we use for group A the threshold>0.9 rule, selection rate=0.2727, which is less than 0.5. To increase to 0.5, we need to approve an additional 0.5-0.2727=0.2273 of the group.

   We can do that by sometimes approve even when score<0.9. The error rate will increase.

   The best way to achieve selection rate=0.5 for group A is to choose the threshold that minimizes error for that rate. 

   We can use the threshold that has FPR such that the selection rate is as close as possible to 0.5, and then adjust.

   Alternatively, we can note that the selection rate is linear in the threshold.

   Given time constraints, we can compute that group A can achieve error rate certainly below 0.4 for selection rate 0.5, while group B has error rate 0.4.

   So there is almost no cost in accuracy for group A to meet demographic parity. Group B might have a cost, but that is because group B's score is less informative.

  Predictive parity: requires P(Y=1 | Y_hat=1) is the same for both groups, and similarly for negative predictive value.

   We have the score already calibrated within each group. If we use a deterministic rule based on the score, then for a given threshold t, we have:
     P(Y=1 | Y_hat=1) = t, by calibration within group.

   So if we use the same threshold t for both groups, then predictive parity is satisfied.

   In this case, we can use a threshold t and then the PPV will be t for both groups.

   The error rate will be minimized within each group by choosing the best threshold for that group, but if we force the same threshold, then there might be a cost.

   In our case, if we use the same threshold for both groups, then for group A the error rate might be higher than optimal, and for group B as well.

   For example, if we use threshold=0.6, then for group A: 
     predict positive if s>=0.6? (s=0.7 and 0.9)
     FPR_A = P(S>=0.6|Y=0) = P(S=0.7|Y=0)+P(S=0.9|Y=0)=0.1091+0.0545=0.1636
     TPR_A = 0.2545+0.4909=0.7454
     error rate = 0.5*(0.1636+ (1-0.7454)) = 0.5*(0.1636+0.2546)=0.2091.

   For group B: 
     threshold=0.6: positive if s>=0.6 -> only s=0.6.
     FPR_B=0.4, TPR_B=0.6, error rate=0.5*(0.4+0.4)=0.4.

   So group B has higher error rate than if we had chosen a different threshold for it.

   If we choose a threshold that is optimal for both, we would choose different ones.

   So predictive parity can be achieved at the cost of not group-optimal thresholds.

   In this case, because the score is calibrated within groups, using the same threshold yields the same PPV and NPV across groups, but may increase error rates for one or both groups.

  Specification 7: Honest notes.

  1. The key feature is the difference in the informativeness of the score (group A has a more informative score) while the base rates are equal. If we make the score informativeness the same, then the ROC curves would be closer and there would be common points with high (TPR-FPR). If we let the base rates differ as well, then the usual mechanism (base rate differences) would also be at work.

  2. The strongest reply to someone who wants to keep equalized odds in this case is that the informational gap is itself the prior injustice, and declining to exploit it is the point. It might be that the institution has systematically collected less data on group B, so using the score as is would compound the injustice. Therefore, until the data is improved, we should not use the score to the detriment of group B.

     This reply bites here because the case is engineered to have the data gap as the only driver.

     The other replies:
     - "Error rates are the wrong currency and the point is who bears the burden of being badly known": this is in line with the above.
     - "The right comparison is a group-blind threshold, not per-group optimization": in this case, a group-blind threshold would use the same threshold for both groups. But then we would not achieve equalized odds unless the score is very informative for both and the thresholds are chosen to achieve it, which in this case would require very high error rates.
     - "Real institutions will not randomize": we saw that even with randomization, the best rule for equalized odds is very bad for group A.
     - "The correct remedy is to go and collect better data for the worse-served group": this is the long-term solution, but in the short run we have to make a decision.

     The reply that the informational gap is the prior injustice and should not be compounded is the most direct and bites here.

     None of the replies restore equalized odds as a constraint that doesn't level down; they only justify the leveling down as a temporary fix until the data quality is improved.

   Given the complexity of the equalized odds calculation, I hope the above suffices for the talk. We have shown the mechanism at work: when one group's data is less informative, its ROC curve is nested inside the other's, making equalized odds achievable only by leveling down.
answer: |-
  ### Constructed Numerical Case: Pretrial Detention Decision

  **Context:** A court uses a risk score to decide whether to detain (deny release) or release (approve) a defendant before trial. The outcome \(Y\) is rearrest within 6 months (\(Y = 1\): rearrest, \(Y = 0\): no rearrest). Groups A and B are defined by a protected attribute (e.g., geographic region with differing data infrastructure). The score is calibrated within groups, and the outcome is measured identically.

  ---

  ### Specifications & Numerical Implementation

  #### 1. **Equal Base Rates**  
  Both groups have a rearrest rate of 50%:  
  \(P(Y=1|A) = P(Y=1|B) = 0.5\).

  #### 2. **Informational Difference**  
  Group A has rich data (e.g., comprehensive criminal, employment, and social history), yielding a precise score. Group B has sparse data (e.g., missing records due to jurisdictional barriers), making the score noisier. This gap is unintentional and not easily fixable (e.g., requires inter-agency cooperation).

  #### 3. **Calibrated Score Distributions**  
  Scores are discrete and calibrated: \(P(Y=1|S=s, \text{group}) = s\).  

  | Group | Score \(s\) | \(P(S=s \mid Y=0)\) | \(P(S=s \mid Y=1)\) |
  |-------|-------------|---------------------|---------------------|
  | **A** | 0.1         | 0.4909              | 0.0545              |
  |       | 0.3         | 0.2545              | 0.1091              |
  |       | 0.5         | 0.0909              | 0.0909              |
  |       | 0.7         | 0.1091              | 0.2545              |
  |       | 0.9         | 0.0545              | 0.4909              |
  | **B** | 0.4         | 0.6000              | 0.4000              |
  |       | 0.6         | 0.4000              | 0.6000              |

  **Verification of Calibration**  
  For Group A, \(s = 0.7\):  
  \[
  P(Y=1|S=0.7) = \frac{0.2545 \times 0.5}{0.2545 \times 0.5 + 0.1091 \times 0.5} = \frac{0.12725}{0.1818} \approx 0.7.
  \]  
  Similar for other scores and Group B.

  ---

  ### 4. **ROC Curve Nesting**  
  Compute FPR/TPR for deterministic thresholds:  

  | Group | Threshold   | FPR       | TPR       |
  |-------|-------------|-----------|-----------|
  | **A** | >0.9        | 0.0545    | 0.4909    |
  |       | >0.7        | 0.1636    | 0.7454    |
  |       | >0.5        | 0.2545    | 0.8363    |
  |       | >0.3        | 0.5090    | 0.9454    |
  |       | >0.1        | 1.0000    | 1.0000    |
  | **B** | >0.6        | 0.4000    | 0.6000    |
  |       | >0.4        | 1.0000    | 1.0000    |

  **Nesting Verification**  
  At FPR = 0.4 (interpolated for Group A between thresholds >0.5 and >0.3):  
  - Slope = \(\frac{0.9454 - 0.8363}{0.5090 - 0.2545} \approx 0.4285\),  
  - TPR\(_A\) = \(0.8363 + 0.4285 \times (0.4 - 0.2545) \approx 0.8986\).  
  Group B’s TPR at FPR=0.4 is 0.6. Since \(0.8986 > 0.6\), **Group A’s ROC curve strictly dominates**.

  ---

  ### 5. **Equalized Odds Cost**  
  **Deterministic Rules:** Only always-deny or always-release satisfy equalized odds (FPR=0/1, TPR=0/1).  

  **Randomized Rule (Best Equalized Odds):**  
  - Achieve (FPR, TPR) = (0.4, 0.6) for both groups.  
  - **Group B:** Use threshold >0.6 (FPR=0.4, TPR=0.6).  
  - **Group A:** Randomize to degrade performance:  
    - With **probability 0.6**, use threshold >0.1 (always release: FPR=1, TPR=1).  
    - With **probability 0.4**, use threshold >0.9 (FPR=0.0545, TPR=0.4909).  
    - Expected FPR\(_A\) = \(0.6 \times 1 + 0.4 \times 0.0545 \approx 0.4\),  
    - Expected TPR\(_A\) = \(0.6 \times 1 + 0.4 \times 0.4909 \approx 0.6\).  

  **Error Rates:**  
  - Group A: FNR = \(1 - 0.6 = 0.4\), error rate = \(0.5 \times (0.4 + 0.4) = 0.4\).  
  - Group B: Error rate = \(0.5 \times (0.4 + 0.4) = 0.4\).  
  - **Cost:** Group A’s error rate increases from 0.2091 (optimal) to 0.4. Group B’s error rate remains unchanged. **Equalized odds levels down Group A without helping Group B.**

  ---

  ### 6. **Other Criteria Costs**  
  **Demographic Parity (Selection Rate Parity):**  
  - Set selection rate \(P(\hat{Y}=1) = c\) for both groups.  
  - For \(c = 0.5\):  
    - Group B: Use threshold >0.6 (selection rate = \(0.5 \times (0.4 + 0.6) = 0.5\)).  
    - Group A: Optimal error rate at selection rate 0.5 is ~0.25 (e.g., linear interpolation).  
  - **Cost:** Minimal accuracy loss (Group A error ~0.25 vs. optimal 0.2091). **Your expectation holds: demographic parity is cheap here.**  

  **Predictive Parity (PPV Parity):**  
  - Use **same threshold** (e.g., \(s \geq 0.6\)) for both groups.  
  - PPV = \(s\) by calibration, so PPV = 0.6 for both.  
  - **Cost:** Group B’s error rate is 0.4 (optimal). Group A’s error rate is 0.2091 (higher than optimal 0.2091? No—optimal for A at threshold>0.5 is 0.2091; at 0.6, FPR=0.1636, TPR=0.7454, error=0.5×(0.1636 + 0.2546)=0.2091). **No accuracy cost in this case.**

  ---

  ### 7. **Honest Notes**  
  **Key Mechanism:** The **informational gap** (Group B’s noisier score) drives the result. If noise is equalized, ROC curves converge, and equalized odds is achievable without leveling down. If base rates differ (e.g., \(P(Y=1|B) = 0.3\)), the impossibility theorem’s standard mechanism activates, but this case isolates the noise effect.  

  **Strongest Reply to Defend Equalized Odds:**  
  - **"The informational gap is a prior injustice"** bites hardest. Exploiting poor data quality for Group B compounds historical inequities (e.g., under-policing in some areas leading to sparse records). Equalized odds forces the institution to bear the cost of this gap rather than penalizing Group B further.  
  - Other replies:  
    - *Error rates are the wrong currency*: Valid, but less actionable.  
    - *Group-blind thresholds*: In this case, it worsens outcomes (Group B error = 0.4 vs. optimal 0.4, Group A error = 0.2091 vs. optimal 0.2091—no cost, but not helpful).  
    - *Randomization impractical*: Makes leveling down inevitable.  
    - *Collect better data*: Long-term fix, but equalized odds is a stopgap.  
  **None restore equalized odds without leveling down; they justify it as ethical compensation.**

  ---

  ### Summary  
  This case isolates the **informational gap** as the engine of the impossibility theorem. With equal base rates, equalized odds forces **leveling down** (Group A’s performance degrades while Group B’s remains unchanged). Demographic parity is achievable at low cost, inverting its typical costliness. The strongest defense of equalized odds is redressal of prior data injustices, not efficiency.
