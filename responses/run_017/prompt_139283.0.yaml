  Regarding smuggling conclusions into "structurally robust," this is awkward. They might have defined structures too broadly. They should strip out elite cohesion and institutional autonomy to avoid circularity. 

  Evidence discrimination is tricky. Since we only have one timeline, it's hard to test. But not fatal; counterfactuals often rely on comparative cases. They could look at other regimes' radicalization processes. 

