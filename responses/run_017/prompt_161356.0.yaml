answer: |-
  ### Assumptions I Can Safely Make
  The room understands Bayesian updating notationally (P(A|B) = P(B|A)P(A)/P(B)), can compute simple posteriors from priors and likelihoods, and grasps credences as probabilities. They know "common knowledge" colloquially but *not* its technical recursive definition. They accept idealized common priors for the exercise. Do *not* assume measure theory, countable additivity, or familiarity with partitions or information structures. They intuitively grasp "private evidence" but not how posteriors can *become* evidence. The biologist and probability-course attendee can handle likelihood ratios; others will follow step-by-step calculations.

  ---

  ### Dependency Map
  1.  **Bayesian Updating Refresher**: Remind how evidence updates priors via likelihoods. *Why after?* Foundation for all later calculations.
  2.  **Private Information Scenario**: Introduce two agents, a shared prior P(H), and distinct private signals (S1, S2) with known likelihoods. Compute individual posteriors. *Why after?* Shows disagreement arises naturally from different evidence.
  3.  **Common Knowledge (CK) Definition**: Define CK recursively: Not only do both know X, but both know both know X, and so on ad infinitum. Contrast with "merely knowing X". *Why after?* Crucial for the theorem; must distinguish it from simple awareness before proceeding.
  4.  **CK of Posteriors as Evidence**: Stress: The theorem assumes agents learn *only* that their posteriors are common knowledge, *not* the raw private signals or underlying evidence. *Why after?* Breaks the "shared evidence" folk belief; this is the key pivot.
  5.  **Aumann's Statement**: "If agents have the same prior and their posteriors are common knowledge, then their posteriors must be equal." *Why after?* Now makes sense; CK of posteriors forces agreement *without* sharing private evidence.
  6.  **Worked Example Setup**: Introduce specific P(H), S1, S2, likelihoods. Compute initial posteriors P(H|S1), P(H|S2) (which disagree). *Why after?* Concrete base for applying CK step.
  7.  **CK Posteriors Update**: Agents now learn *each other's posterior probability*. Treat the *other agent's posterior* as a new piece of evidence about H. Update *again* using Bayes. *Why after?* Demonstrates the theorem's mechanism: CK of posteriors provides new information forcing convergence.
  8.  **Convergence Calculation**: Show updated posteriors become equal. *Why after?* The payoff; proves the theorem's claim numerically.
  9.  **Implications & Limits**: Highlight: Agreement comes from CK of *beliefs*, not evidence. Disagreement implies either differing priors or lack of CK of posteriors. *Why after?* Contextualizes the result and addresses lurking questions.

  ---

  ### The Carrying Example
  **Proposition H:** "This fair coin landed Heads." *Shared Prior:* P(H) = 0.5 (uncontroversial, binary).  
  **Private Signals:**  
  *   Agent A gets S_A: "Expert Whisper A" (Reliability: P(S_A|H) = 0.8, P(S_A|T) = 0.2 → LR=4)
  *   Agent B gets S_B: "Expert Whisper B" (Reliability: P(S_B|H) = 0.6, P(S_B|T) = 0.4 → LR=1.5)  
  *Why asymmetric?* Prevents accidental averaging success; signals differ in strength.  

  **Initial Posteriors:**  
  *   A: P(H|S_A) = [0.8 * 0.5] / [ (0.8*0.5) + (0.2*0.5) ] = 0.4 / 0.5 = **0.8**  
  *   B: P(H|S_B) = [0.6 * 0.5] / [ (0.6*0.5) + (0.4*0.5) ] = 0.3 / 0.5 = **0.6**  
  *Disagreement: 0.8 vs 0.6. Average = 0.7 (WRONG - will diverge)*  

  **Common Knowledge of Posteriors:**  
  A learns B's posterior is 0.6. B learns A's posterior is 0.8. This is now CK.  

  **Updating on CK Posteriors:**  
  *   A treats "B's posterior = 0.6" as evidence about H. What likelihood does this imply? A knows B *only* saw S_B. A computes what B *should* believe if H is true (P(B_post=0.6|H)) vs. false (P(B_post=0.6|~H)).  
      *   If H True: B saw S_B (P=0.6) → Believes 0.6. *Or* B saw ~S_B (P=0.4) → Believes P(H|~S_B) = [0.4*0.5]/[ (0.4*0.5)+(0.6*0.5) ] = 0.2/0.5 = 0.4.
      *   "B_post=0.6" occurs *only* if B saw S_B. P(B_post=0.6 | H) = P(S_B|H) = **0.6**. P(B_post=0.6 | T) = P(S_B|T) = **0.4**.  
  *   A updates: P(H | S_A & [B_post=0.6]) ∝ P(B_post=0.6 | H) * P(H | S_A) = 0.6 * 0.8 = 0.48  
      Normalizer: P(B_post=0.6 | H)P(H|S_A) + P(B_post=0.6 | T)P(T|S_A) = (0.6 * 0.8) + (0.4 * 0.2) = 0.48 + 0.08 = 0.56  
      → **A's New Posterior: 0.48 / 0.56 ≈ 0.857**  
  *   Similarly, B updates on "A_post=0.8". B knows A only saw S_A.  
      *   P(A_post=0.8 | H) = P(S_A|H) = 0.8, P(A_post=0.8 | T) = P(S_A|T) = 0.2  
      *   P(H | S_B & [A_post=0.8]) ∝ 0.8 * P(H|S_B) = 0.8 * 0.6 = 0.48  
      Normalizer: (0.8 * 0.6) + (0.2 * 0.4) = 0.48 + 0.08 = 0.56  
      → **B's New Posterior: 0.48 / 0.56 ≈ 0.857**  
  **Agreement at ≈0.857 ≠ 0.7 (Average).**  
  *Why good:* Prior uncontroversial, signals asymmetric (breaks averaging), likelihoods clear. *Bad version:* Symmetric signals (e.g., both LR=2) leads P_A=2/3≈0.666, P_B=2/3≈0.666, average=0.666 – masks mechanism. *Rejected:* Coin bias detection – prior disagreement risk, evidence interpretation ambiguity.

  ---

  ### Misconception Ledger
  | Misconception | Likely Surface Point | Defusing Move |
  |---------------|----------------------|--------------|
  | "Common Knowledge just means we both know it." | During CK Definition (Step 3) | Use "The King's Wise Men" puzzle (hat colors) to illustrate the infinite regress. Emphasize CK is a *much* stronger and often unrealistic condition. |
  | "If they agree after sharing posteriors, it means the prior determines the posterior." | After Convergence (Step 8) | Point back to the initial disagreement (Step 2). Stress: The prior + *different private signals* caused disagreement; CK of *results* forced new agreement. |
  | "This proves we should always share our evidence to agree." | Implications (Step 9) | Hammer: The theorem gets agreement *without* sharing the raw evidence (S_A, S_B), only the *processed beliefs* (0.8, 0.6). Sharing evidence is different and *can* lead to different agreements if priors differ. |
  | "So we just average our credences when we disagree?" (Averaging Advocate) | Initial Posteriors (Step 2) / Convergence (Step 8) | Show calculation: Average (0.7) vs. Actual Convergence (≈0.857). State explicitly: Averaging is an ad hoc heuristic; the theorem prescribes a specific Bayesian update on the *fact of disagreement* (via CK of posteriors). |
  | "Isn't this just the No-Trade Theorem?" (Prediction Markets) | Implications (Step 9) | Acknowledge deep link but boundary: "Aumann shows *beliefs* must agree under CK; No-Trade shows they won't *bet* under CK+common priors. Same core, different conclusions. Focus here is belief revision mechanics." |
  | "But Agent A was better informed! Their posterior was higher/closer to truth!" (Calibration Question) | Initial Posteriors (Step 2) / Convergence (Step 8) | Note: The theorem says *nothing* about who was initially "right" or better calibrated. It only says CK of beliefs *forces* agreement. Agent A had stronger evidence initially (LR=4 vs LR=1.5), but the CK update incorporates *both* signals indirectly. |

  ---

  ### The Check
  **Question:** "Alice and Bob share a prior. They see different private evidence and now Alice believes P(H) = 0.9 and Bob believes P(H) = 0.3. They meet, state their credences aloud, and understand each other perfectly. According to Aumann, why *can't* this situation persist if they are both rational Bayesians?"  

  *   **Correct Answer:** Highlights the common knowledge aspect. "Because once they state their credences aloud and this is understood perfectly, they have common knowledge of each other's posteriors (0.9 and 0.3). Aumann's theorem says that with a common prior and common knowledge of posteriors, their posteriors must be equal. 0.9 ≠ 0.3, so this situation is impossible under those conditions. Their disagreement proves they either didn't have a truly common prior or haven't achieved genuine common knowledge of posteriors yet."  
  *   **Wrong-but-Confident Answer:** Focuses only on shared evidence or averaging. "Because they shared all their evidence now, so they must recalculate and agree!" or "Because they should average their beliefs to 0.6 now." (Misses that CK of posteriors *alone* forces agreement *without* sharing raw evidence, and that averaging isn't the mechanism).

  ---

  ### What to Refuse to Cover
  1.  **Debating the Common Prior Assumption:** Acknowledge its idealism but state firmly: "The theorem explores the *implications* of common priors + CK. Debating the realism of common priors is vital but a separate, deep philosophical discussion beyond our 90 minutes. We assume it for the logic."
  2.  **Prediction Markets / No-Trade Theorems:** Explicitly deflect: "This is a crucial application but requires building on Aumann. We're focusing on the foundational belief-agreement mechanism today."
  3.  **The Many-Agent Case:** State: "The core logic is clearest with two agents. Extending to N agents adds complexity (common knowledge across groups) without changing the fundamental insight in this intro."
  4.  **Continuous Signals or Complex Partitions:** Resist requests for "real-world" fuzzy evidence. "Continuous cases need more advanced math (measure theory). Our coin/whisper example captures the essential discrete logic cleanly."
  5.  **The Full Formal Proof:** Decline: "The proof relies on more advanced concepts (like information partitions and measurable sets). Our goal is intuition via mechanics and example, not formal rigor."  
  **Most Tempting Overreach:** The **philosophical implications for rational disagreement**. While crucial, debating "Does Aumann mean we *should* always update towards others?" or "What if priors aren't common?" will consume all time. Contain it: "This shows one *mechanism* forcing agreement under idealization. What it *implies* for real-world disagreement norms is rich but requires separate discussion." Enforce the 90-minute hard stop.
