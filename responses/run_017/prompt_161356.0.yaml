  For assumptions: I can assume basic Bayesian updating literacy but not measure theory. They understand priors/likelihoods/posteriors notationally but need concrete examples. Common knowledge is likely misunderstood as simple awareness. 

  The dependency map must start from Bayesian updating foundations before introducing common knowledge and Aumann's mechanics. Order should be: Bayesian review → private information scenarios → common knowledge definition → posteriors as evidence → theorem statement → example → implications.

