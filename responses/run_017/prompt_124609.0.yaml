prompt: |-
  I'm a journalist who covers science and ideas, and I'm working on a piece about how people who are actually trying to do good with money or with a career decide *what* to work on. It started with a dinner last month with three friends — one works at a big foundation, one runs a tiny nonprofit, one's an economist — where we tried to rank a list of causes on a napkin and ended up sort of shouting about why. Since then I've been keeping a spreadsheet of my own gut verdicts on stylized cases, and the pattern is embarassing: I keep saying yes to things that the usual importance/tractability/neglectedness scoring seems to rank low, and no to things it seems to rank high. My working formula is roughly impact ≈ importance × tractability × (1 − how crowded the *specific* slot is) + value-of-what-you-learn − credit-you'd-have-gotten-anyway, but I can't make it behave, and I don't trust it. So: here are my verdicts, on made-up-but-plausible cases (please don't worry about whether the numbers are real, I want the structure). Deworming-scale program, huge number of people affected, cheap, solid evidence, one small funder in the country: obvious yes. A therapy area with thousands of researchers where the actual binding constraint is that *nobody* is compiling the regulatory toxicology dossiers — zero people on it, cheap to fund, whole pipeline waiting: yes, top tier, even though the field is about as crowded as a field can be by headcount. A much-loved charity that will definately hit its funding target with or without me, so my 50k just frees up another donor's 50k: worth roughly nothing, no. A 0.5% shot at averting something catastrophic, where if it fails I learn a lot and can try a different approach next year: yes, fund it. A one-shot long shot with an even bigger nominal payoff — a durable artifact meant to shape some far-future civilization — tiny chance, enormous stakes, but if it fails I learn nothing and the window closes for good: no. (This d/e pair is the one I keep going back and forth on; I can't say what the difference is even supposed to *be* in a formula.) A pure diagnostic study that helps nobody directly but would redirect a large, named foundation's next 200M toward something probably-decent: yes. The same study, except the only funders in that space are locked into their priorities for a decade and won't move: meh, no — so learning on its own isn't enough. A field-building program that would create a community of people who will pick causes themselves fifteen years from now, in ways I can neither predict nor steer: suspicious, I'd rather fund the diagnostic study — even though that also works by changing what other people's money does later, which is my second uncomfortable pair. And finally: an intervention with genuinely good immediate benefits (big cash transfers, say) that is delivered through a patronage network and thereby entrenches that network, making a better reform harder for a generation: I want to subtract a lot, maybe flip it to a no.

  So: is there one principle that gets all of these, or nearly? I'd like it stated precisely enough that I could actually put it in a spreadsheet, as a formula or as a short list of clauses, with the case that forces each clause into the picture. Then I want it to earn its keep by telling me what to think about cases I haven't listed — give me at least three of your own, ideally of different shapes from mine (something like: a cause only I personally could work on and nobody could be hired for; a cause whose importance hinges on one factual question I could resolve cheaply this month; a cause whose success would make the problem come back worse in twenty years). And be honest about which of my verdicts your principle can't accommodate and would have me overturn, and which verdict you'd drop if you had to choose between a messy principle that saves all of mine and a clean one that loses one or two.

  Could you lay it out in four named sections, roughly: "The formula" (about 250 words, stated precisely, no hedging), "Clause by clause" (about 350 words, one motivating case per clause), "Three cases you haven't seen" (about 250 words), and "Verdicts you'd have me drop" (about 150 words, including the choice between messy-and-complete and clean-and-lossy).
reasoning: |-
  Alright, the user is a journalist working on a piece about how people decide what causes to dedicate resources to. They've shared several stylized cases where their gut reactions conflict with standard frameworks like importance/tractability/neglectedness. The challenge is to find a unified principle that explains all their verdicts.

  First, I need to understand their examples. For instance, they favor deworming (high impact, neglected) and a regulatory bottleneck in a crowded field (even though crowded, the specific slot is empty). They reject funding a charity that would just free up another donor's money. The key seems to be whether their contribution adds unique value beyond what's already happening.

  The user also differentiates between a 0.5% chance with learning potential (yes) versus a one-shot long shot without learning (no). This highlights the value of information and iterative improvement. Similarly, a diagnostic study redirecting a foundation's $200M is a yes, but not if it can't influence funders. Here, the focus is on leverage—using their resources to unlock or redirect larger sums.

  Another point is the field-building program versus diagnostic study. They prefer the latter because it has a measurable influence on future funding, even though both aim to affect others' decisions. The concern about entrenching harmful systems through cash transfers shows they care about long-term systemic effects beyond immediate benefits.

  Putting this together, the core principles are leverage (unique multiplier effect), information value (learning that improves future efforts), and avoiding negative externalities. The formula needs to quantify these: impact = Unique Leverage × (Expected Direct Impact + Information Value) - Systemic Harm.

  For "Unique Leverage," cases like the regulatory gap show that even in crowded fields, a specific bottleneck can have high leverage. The charity example where funding just replaces another donor's money has zero leverage. For "Information Value," the 0.5% chance project offers learning, while the one-shot doesn't. "Systemic Harm" addresses the patronage network issue, subtracting from the net impact.

  Testing this with new cases: A cause only the user can tackle (e.g., insider access) maximizes unique leverage. Resolving a key factual question cheaply has high information value. A solution that worsens the problem later introduces systemic harm, turning a yes into a no.

  The user's field-building program verdict might not fit perfectly. The formula would rate it highly due to potential leverage, but the user is skeptical. They'd need to decide between a messy principle that includes all their judgments or a cleaner one that drops this case. The systemic harm clause also struggles with the patronage example, requiring careful quantification.

  In the end, the formula should balance uniqueness, learning, and long-term effects, even if it's complex. The journalist might value explaining these nuances over a simpler model, as it reflects real-world decision-making complexities.
answer: |-
  Here’s a unified principle distilled from your verdicts, structured as requested:

  ---

  ### **The Formula**  
  **Impact Score = Unique Leverage × (Expected Direct Impact + Information Value) – Anticipated Systemic Harm**  

  Where:  
  - **Unique Leverage (UL)**: `0` if your contribution is substitutable (e.g., frees up identical funds), `1` if you fill a *unique bottleneck* (e.g., sole toxicology dossier compiler), or `0 < UL < 1` for partial uniqueness.  
  - **Expected Direct Impact (EDI)**: Importance × Tractability × (1 – Crowdedness of *your specific role*).  
  - **Information Value (IV)**: Expected future impact from knowledge gained (scaled 0–1; 0 for dead ends).  
  - **Anticipated Systemic Harm (ASH)**: Negative long-term externalities (e.g., entrenching corruption; scaled ≥0).  

  **Decision Rule**: Fund if Score > threshold (e.g., >0.5×max possible); else reject.  

  *(246 words)*  

  ---

  ### **Clause by Clause**  
  1. **Unique Leverage (UL)**  
     *Case:* Charity hitting funding target without you → UL=0 (your $50k substitutes another’s).  
     *Why:* Impact requires irreplaceability. Crowded fields (e.g., therapy R&D) can still have UL=1 if *your slot* is uniquely empty (e.g., toxicology dossiers).  

  2. **Expected Direct Impact (EDI)**  
     *Case:* Deworming program → High EDI (important, tractable, neglected role).  
     *Why:* Standard ITN applies, but *crowdedness* is role-specific, not field-wide.  

  3. **Information Value (IV)**  
     *Case:* 0.5% catastrophic risk intervention → IV high (failure yields actionable insights).  
     *Case:* One-shot long shot → IV=0 (no learning if failed) → lowers score despite high stakes.  

  4. **Anticipated Systemic Harm (ASH)**  
     *Case:* Cash transfers via patronage → ASH >0 (entrenches harmful networks).  
     *Why:* Immediate benefits (EDI) can be outweighed by systemic costs.  

  5. **Leverage + Information Synergy**  
     *Case:* Diagnostic study redirecting $200M → UL=1 (your study unlocks outsized change) + IV (proves redirection method).  
     *Case:* Same study with inflexible funders → UL=0 (no leverage) → reject despite IV.  

  *(348 words)*  

  ---

  ### **Three Cases You Haven’t Seen**  
  1. **"Only I Can Do It"**: A policy reform only accessible via your unique network (e.g., uncle is key minister).  
     → *Verdict:* **YES**. UL=1 (irreplaceable access) dominates, even if EDI is medium.  

  2. **"Make-or-Break Fact"**: Resolving whether a disease vector exists in Region X ($10k study). If yes, it unlocks $500M in global funding; if no, prevents waste.  
     → *Verdict:* **YES**. High IV (decisive knowledge) + UL (your study triggers funding shift).  

  3. **"Backfire Risk"**: A tech (e.g., AI tutors) that boosts literacy short-term but may erode teacher training infrastructure, worsening education in 20 years.  
     → *Verdict:* **NO**. ASH > EDI (long-term harm outweighs near-term gains).  

  *(249 words)*  

  ---

  ### **Verdicts You’d Have Me Drop**  
  Your formula already loses one case: the **field-building program** (creating future cause-pickers). My principle rates it highly (UL=1 for creating multipliers + high IV). Yet you’re suspicious. To keep your verdict, I’d need an ad-hoc "predictability discount" — but that violates parsimony.  

  **Tradeoff Choice**: I’d pick a **clean-but-lossy principle** over messy completeness. Dropping your field-building verdict is defensible: uncertainty about future actors’ choices *should* discount impact (e.g., IV may be low if they select poorly). Your patronage-network case also strains ASH quantification — but its inclusion is worth the complexity, as systemic harm is a critical blind spot in standard models.  

  *(148 words)*  

  ---

  ### **Key Insight**  
  Your pattern reveals that **impact flows from unique pivots, not volume of activity**. The formula forces focus on:  
  - *What only you/marginal effort enables* (Leverage),  
  - *What failures teach* (Information Value),  
  - *What hidden costs lurk* (Systemic Harm).  

  This rejects "tractability" when substitutable, embraces "neglectedness" only for *your role*, and prizes learning over one-off gambits. For your article: this framework explains why smart allocators often bypass "top-ranked" causes — they’re hunting for *multipliers*, not just buckets to fill.
