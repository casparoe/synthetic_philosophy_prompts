prompt: |-
  I direct the translation and measurement team for a multi-country health and well-being survey that runs in a little over forty languages. Every week my analysts review a few dozen items where the same question, asked in two languages, produces response distributions that we do not think mean the same thing. Each of these items has to receive one of four verdicts: pool as-is; adapt the wording and pool with a documented caveat; do not pool for this language; or send the item back to the design team as unusable across the whole survey. At the moment the calls are made on instinct, different analysts decide differently, and we have been burned in both directions — pooling items that a reviewer later showed were not comparable, and dropping whole countries from a headline comparison for what turned out to be a bad translation.

  What I want is a decision procedure my team can actually run, grounded in what the linguistic relativity literature genuinely supports rather than in what a first-year textbook says it says. Two constraints on the theory side. First, I keep being told that the Sapir–Whorf hypothesis was refuted decades ago, and I need the procedure built out of only what survives that refutation: I do not want any step that assumes language determines what a person can represent or think, and I do want it said explicitly which familiar-sounding steps are of that kind and must be left out. Second, my current working rule — flag an item only when the cross-language difference sits in obligatory grammar, and ignore differences that are merely lexical — has started to look wrong to me. Please test it against the cases below and either repair it or replace it, naming the cases that break it and saying what the repaired rule costs us in false alarms.

  On the practice side: the procedure has to be executable in about twenty minutes by an analyst whose only training is a single undergraduate linguistics course, and it has to terminate in one of my four verdicts. For each step, say what would count as a sufficient answer, and whether the answer can be found in materials we already hold — translation notes, back-translations, cognitive interview transcripts, split-sample data — or requires a question to the country team, whose time I can spend at roughly two hours per flagged item and no more. Where a question is settled by fact, the procedure should settle it. Where it is settled by what we want the survey to claim — whether a construct is intended to travel or is allowed to be culture-specific — the procedure should stop, hand the decision to me, and say in plain language what I am choosing between. I also need a one-page version, free of theory vocabulary, for the sign-off meeting with country coordinators, and I want it marked honestly which steps are real tests and which are judgment calls with a checklist wrapped around them.

  Then run the procedure on three items from current work. For each, give me the verdict, the step at which the procedure reached it or the point at which it stopped and handed over, and the short plain-language paragraph I would take into sign-off.

  1. In Language A, the verb obligatorily marks the source of the speaker's information: whether they witnessed the thing, inferred it, or were told it. Our confidence item — How confident are you that the health information you get from your clinic is accurate? — could only be rendered in the reported form, and mean confidence came out well below the pooled sample. Our cognitive interviews suggest that respondents given the inferred form would score differently again. Is this a translation and encoding problem to be fixed by rewording, a difference in how speakers of A are led to construe confidence, or a substantive difference in trust in clinics?

  2. In Language B, every clause describing an event must mark its cause as either an agent acting intentionally or an impersonal process. Our self-efficacy item — How much control do you feel you have over your own health? — came back from back-translation in the impersonal-cause form; the translator said the agentive form reads as boastful and unnatural. Scores are lower than the pooled sample. Note two things: the item was designed to measure individual agency over health, a local advisory group has asked us to drop it as culturally inappropriate, and our funders have the self-efficacy index written into the deliverables.

  3. This is the one I expect not to like. Our headline single item — Overall, how satisfied are you with your life these days? — has no general evaluative term in Language C. The nearest word is closer to contentment with the lot one has been given; it carries no implication that a life is the sort of thing one assesses, or could improve. That item is what the cross-national ranking and all the press coverage rest on. If the procedure says Language C cannot be pooled, I want that said plainly, together with whatever the procedure then implies about the other thirty-nine languages — because I suspect the same argument tells against our English item as well, and I need to know whether I have to go to the funders and say so.

  Finally, tell me what the procedure cannot do. I especially want to know how it handles, or fails to handle, the standing confound that in our sample every linguistic difference is paired with a non-linguistic one — different health systems, different schooling, different interview settings, different norms about giving scalar answers — and what it should say when an item is answered by people responding in a second language rather than their first.
reasoning: |-
  Okay, the user is leading a translation and measurement team for a multi-country health survey spanning over forty languages. They're facing challenges with inconsistent analyst decisions on pooling survey items across languages, leading to both false positives and negatives. They need a grounded, practical decision procedure that avoids discredited linguistic determinism while addressing real-world constraints like analyst training and time limits.

  The user's current approach flags only grammatical differences but feels inadequate. They present three test cases involving: 1) Evidential markers affecting confidence ratings 2) Agentive vs. impersonal constructions in self-efficacy items 3) Missing life satisfaction concept. Each case reveals deeper theoretical and practical tensions.

  Key constraints emerge: The procedure must reject strong Sapir-Whorf assumptions while acknowledging language influences. It needs to be executable by junior analysts with basic linguistics training in under 20 minutes using existing materials. Crucially, it must distinguish factual linguistic analysis from construct validity judgments that require managerial input.

  For the theoretical foundation, I consider contemporary linguistic relativity research showing language affects attention and habitual thought without determining cognition. The procedure should focus on obligatory linguistic features that force conceptual framing differences, while treating lexical gaps as potential rather than automatic barriers.

  The practical framework needs: Initial screening for translation integrity, then analyzing obligatory grammatical constraints, followed by examining conceptual coverage gaps. At each stage, clear thresholds determine progression to the next step or verdict. Crucially, it separates detectable linguistic facts from value judgments about construct equivalence.

  For the test cases: The evidential markers case would likely require adaptation due to grammatical coercion of meaning. The self-efficacy item presents a conflict between linguistic constraints and mandated construct - needing escalation. The life satisfaction case reveals a fundamental conceptual gap that threatens cross-cultural validity, forcing uncomfortable conclusions about the core metric.

  Implementation requires careful documentation protocols and decision trees. The plain-language version for country coordinators must transparently indicate where checks yield definitive answers versus judgment calls. Limitations around cultural confounds and second-language responses need explicit acknowledgement - the procedure can identify linguistic issues but not resolve deeper equivalence questions single-handedly.

  This approach balances contemporary linguistics with practical survey constraints, creating audit trails for decisions while protecting against both over- and under-flagging. The real test will be whether it withstands political pressures when findings challenge established metrics.
answer: |-
  Here's a streamlined decision procedure grounded in contemporary linguistic relativity research, designed for practical use by your team. It replaces the "grammar-only" rule with a focus on **obligatory conceptual framing and conceptual coverage**, avoids linguistic determinism, and integrates your operational constraints.

  **The Core Principle (Surviving Linguistic Relativity):**
  Language habitually draws attention to certain aspects of experience via *obligatory grammatical distinctions* or *lexical gaps*, making those aspects more salient or readily accessible in specific communicative contexts. This influences *how* information is processed and expressed, not *what* can be thought or represented. The procedure tests if the translation forces a framing or omits a concept *essential to the survey construct's intent* in a way that systematically biases responses.

  **The Decision Procedure: "FRAME-CHECK"**

  1.  **Translation Integrity Check (5 mins):**
      *   **Check:** Does the back-translation match the source item's core propositional meaning? Are there unresolved translation notes or cognitive interview flags indicating misunderstanding?
      *   **Sufficient Answer:** Back-translation >90% matches core meaning; no major unresolved flags in notes/interviews.
      *   **Source:** Back-translation report, translation notes, cognitive interview summaries.
      *   **Outcome:**
          *   **Fail:** Verdict = **Send back to design team (Unusable)**. (Fundamental meaning lost).
          *   **Pass:** Proceed to Step 2.

  2.  **Obligatory Framing Check (Core Step - 10 mins):**
      *   **Check:** Does the target language *obligatorily* encode information (via grammar or required lexical choice) that the source language does not, OR vice versa? Specifically, does this obligatory encoding:
          *   (a) **Contradict** the intended meaning of the construct? (e.g., forcing a specific evidentiality when the source is neutral).
          *   (b) **Force attention** onto an aspect irrelevant to or distorting the construct? (e.g., forcing agentive vs. impersonal cause when the construct is about perceived control, regardless of cause type).
          *   (c) **Omit** an aspect *essential* to the construct? (e.g., lacking a term for evaluative "satisfaction").
      *   **Sufficient Answer:** Identify the specific obligatory feature and assess impact (a, b, or c) using linguistic reference materials (grammar guides) and translator notes. *Does NOT require country team input at this stage.*
      *   **Source:** Language reference grammars (for the specific feature), translator notes explaining choices, linguistic expertise of analyst (undergrad level sufficient for identifying features like evidentiality, grammatical mood, aspect, causativity).
      *   **Outcome:**
          *   **No Obligatory Framing Issue:** Proceed to Step 3.
          *   **Framing Issue Found (a, b, or c):** Proceed to Step 4.

  3.  **Conceptual Coverage Check (Core Step - 5 mins):**
      *   **Check:** Is there a significant *lexical gap* or *radical difference in lexical semantics* preventing the expression of the core construct in the target language? (Focus: Is the core *concept* expressible? Not: Is there a perfect 1:1 word?).
      *   **Sufficient Answer:** Translator notes/cognitive interviews explicitly state the concept is inexpressible *or* the best approximation carries connotations that fundamentally alter the meaning (e.g., "satisfaction" only expressible as "resignation"). Requires positive evidence of a gap.
      *   **Source:** Translation notes, cognitive interview summaries (specifically looking for comments on concept expressibility), analyst judgment *based on documented evidence*.
      *   **Outcome:**
          *   **Coverage Adequate:** Verdict = **Pool as-is**. (Minor lexical differences without framing issues are generally safe).
          *   **Coverage Inadequate:** Proceed to Step 4.

  4.  **Impact & Feasibility Assessment (Core Step - 5 mins):**
      *   **Check:**
          1.  **Evidence of Distortion:** Is there split-sample data or cognitive interview evidence suggesting the framing/coverage issue *directly causes* the observed distribution difference?
          2.  **Adapt Feasibility:** Can the item be reworded *within the target language* to avoid the framing issue or better approximate the concept *without* changing the core construct meaning? (Requires linguistic creativity/knowledge).
      *   **Sufficient Answer:** Analyst reviews available data (split-sample, interviews) for direct links; proposes a concrete alternative wording *if feasible*.
      *   **Source:** Split-sample test results (if available for this item), cognitive interview transcripts, analyst linguistic knowledge.
      *   **Outcome:**
          *   **No Distortion Evidence & Adaptation Feasible:** Verdict = **Adapt wording & pool with caveat**. (Document the issue and adaptation).
          *   **Distortion Evidence OR Adaptation NOT Feasible:** STOP & HAND OVER TO MANAGER. Plain Language Message: *"The language forces a framing [describe, e.g., 'forces speaker to specify how they know'] / lacks a concept [describe, e.g., 'for evaluative life assessment'] essential to the core meaning of 'confidence'/'control'/'satisfaction'. Rewording cannot fully resolve this without altering the construct. You must decide: (A) Accept the distortion and pool with a strong caveat, risking cross-language non-comparability. (B) Exclude Language X for this item, losing data. (C) Question if the construct itself is valid cross-culturally for all languages."*

  **Plain-Language Summary for Country Coordinators (One-Page - "FRAME-CHECK")**

  1.  **Check Translation Basics:** Did the meaning get translated correctly back-and-forth? Are people understanding it right in tests? *(Real Test: Back-translation & cognitive interviews)*
  2.  **Check Forced Meanings:** Does Language X *require* adding extra details (like *how* you know something, or if something was done *on purpose*) that English doesn't? Does adding this extra detail change what the question is really asking about? *(Judgment Call* based on language rules/translator notes, *wrapped around* identifying specific forced details)
  3.  **Check Core Idea Fit:** Is the very core idea of the question (like "confidence," "control," or "satisfaction") possible to say clearly in Language X? Or does the closest word mean something quite different (like "contentment" instead of active "satisfaction")? *(Judgment Call* based on translator notes/cognitive interviews, *wrapped around* evidence of a gap)
  4.  **Check Impact & Fix:**
      *   Do we have proof this language quirk is making answers different? (e.g., testing different wordings).
      *   Can we rephrase the question in Language X to avoid the quirk *without* changing the main point?
      *(Real Test:* If split-sample data exists; *Judgment Call* on feasible rephrasing)
  5.  **Result:**
      *   **Green (Pool):** Basics good, no forced meanings or core idea problems found.
      *   **Yellow (Adapt & Caveat):** Forced meaning or core idea issue found, BUT we have a good rephrasing that avoids it. We'll note the issue.
      *   **Red (Manager Choice):** Forced meaning/core idea issue found, it likely distorts answers, and we can't fix it well. Manager decides: Pool with big warning? Drop Language X? Question the question itself?
      *   **Stop (Unusable):** Basic meaning wasn't translated correctly. Needs redesign.

  **(Honest Marking:** Steps 1 & 4a (if data exists) are **Real Tests**. Steps 2, 3, 4b are **Judgment Calls** guided by checklists of evidence).

  ---

  **Applying FRAME-CHECK to Your Cases**

  1.  **Language A (Confidence + Evidentiality)**
      *   Step 1: Pass (Translation accurate).
      *   Step 2: **Framing Issue Found (Type b).** Obligatory evidential marking forces attention *away* from pure confidence evaluation *towards* information source. The "reported" form inherently casts doubt, lowering scores. The construct "confidence in accuracy" is contaminated by forced encoding of "not personally verified".
      *   Step 4:
          *   Evidence: Cognitive interviews confirm different wordings (inferred/witnessed) yield different scores. Observed score is lower.
          *   Adaptation Feasible? Difficult. Could try "Based on what you know, how confident..." but may not fully remove evidentiality requirement or might alter meaning. *Feasibility Likely Low.*
      *   **Verdict:** **STOP & HAND OVER TO MANAGER.**
      *   **Plain Language for Sign-off:** *"Language A forces speakers to specify how they know the clinic information is accurate when answering the confidence question. Using the 'reported' form lowers scores, and other forms change the meaning. We cannot rephrase it cleanly to avoid this while keeping the core 'confidence' meaning. You must choose: (A) Pool with a strong caveat that confidence scores in Language A reflect trust in second-hand information, not pure confidence assessment. (B) Exclude Language A from this item. (C) Question if 'confidence' separate from information source is measurable comparably across all languages."*

  2.  **Language B (Self-Efficacy + Causativity)**
      *   Step 1: Pass (Back-translation shows impersonal form, translator note explains agentive is unnatural/boastful).
      *   Step 2: **Framing Issue Found (Type a/b).** Obligatory causativity forces a *choice* between agentive (boastful) or impersonal. The construct "personal control" is fundamentally about *agency*, but forcing the agentive form distorts responses (boastfulness), while the impersonal form contradicts the construct ("control" implies agency). The grammar *contradicts* (a) and *forces attention* (b) on an irrelevant aspect (cause type vs. feeling of control).
      *   Step 4:
          *   Evidence: Observed scores are lower (consistent with impersonal framing). Local advisors flag cultural inappropriateness (indirect evidence of distortion).
          *   Adaptation Feasible? Very Difficult. Trying to phrase around agency (e.g., "How able do you feel to influence your health?") might still trigger causativity or change the construct. *Feasibility Likely Low.*
      *   **Verdict:** **STOP & HAND OVER TO MANAGER.**
      *   **Plain Language for Sign-off:** *"Language B forces a choice between saying you intentionally cause health outcomes (sounds boastful) or they happen impersonally (removes agency). Neither fits the 'personal control' construct, and scores are lower. Rephrasing to avoid this is very hard without losing the core meaning. You must choose: (A) Pool the impersonal version with a major caveat that 'control' is interpreted more passively in Language B, contradicting the agency intent. (B) Exclude Language B for this item. (C) Re-negotiate deliverables with funders regarding self-efficacy measurement in Language B, given local cultural concerns and linguistic constraints."* (Highlight the funder conflict explicitly).

  3.  **Language C (Life Satisfaction + Conceptual Gap)**
      *   Step 1: Pass (Translation accurate for the available term).
      *   Step 2: Pass (No specific obligatory grammatical framing forcing a distortion *if* the concept existed).
      *   Step 3: **Coverage Inadequate.** The core construct "evaluative life satisfaction" (judging life against a self-defined standard, implying potential for change) is absent. The closest term ("contentment with one's lot") implies acceptance of circumstances, not active evaluation or the possibility of improvement. This fundamentally alters the construct.
      *   Step 4:
          *   Evidence: Cognitive interviews likely show respondents interpret it as acceptance/resignation, not active assessment. The core concept is missing.
          *   Adaptation Feasible? No. There is no lexical or phrasal way to express the idea of active, evaluative satisfaction distinct from passive contentment/resignation. *Feasibility Nil.*
      *   **Verdict:** **Do not pool for this language.** (STOP - Manager notification implied by severity).
      *   **Plain Language for Sign-off:** *"Language C lacks any word or clear phrase for the concept of actively evaluating one's overall life as 'satisfying' in a way that implies assessment against personal standards. The closest term means passive 'contentment with one's given lot'. This is not the same construct as 'life satisfaction'. We cannot rephrase it to capture the intended meaning. Language C must be excluded from the headline life satisfaction item and rankings."*
      *   **Implication for Other 39 Languages:** The procedure *does not automatically invalidate other languages*. However, it forces a critical question: **Is the English (source) concept of "satisfaction" truly equivalent to an active, evaluative judgment across *all* cultures and languages?** You *must* initiate a separate review:
          *   Examine cognitive interview transcripts *for all languages* regarding this item. Do respondents consistently describe an active evaluation process?
          *   Check if other languages rely on approximations closer to "happiness" or "contentment".
          *   **Honest Conclusion:** Language C proves the concept doesn't travel universally. It *does not prove* other languages are invalid, but it raises a serious challenge to the *universal validity* of the construct itself. You *must* investigate the evidence for cross-cultural conceptual equivalence for this construct more broadly. Tell funders: "One language lacks the core concept entirely, forcing its exclusion. This discovery necessitates an urgent review of whether 'life satisfaction' as actively evaluated is truly comparable across *all* 40 languages. We will present evidence from cognitive interviews across languages within [Timeframe]."

  ---

  **What the Procedure Cannot Do**

  1.  **Disentangle Language from Culture/Context:** This is the fundamental confound. The procedure identifies *linguistic* barriers to equivalence. It *cannot* prove that a distribution difference is *caused solely* by language vs. cultural norms, health systems, etc. It flags items where linguistic differences *create a plausible, systematic bias* that undermines comparability *on top of* other potential confounds. The burden shifts: if a linguistic barrier exists (Step 2/3/4 failure), pooling requires strong justification *despite* that barrier, not just assuming other factors explain the difference.
  2.  **Handle Second-Language Responses:** The procedure assumes respondents are answering in their dominant/native language. For responses in L2:
      *   **Flag:** Any item flagged via FRAME-CHECK for the *respondent's L1* should be treated with extreme caution for L2 respondents, as they may be responding based on L1 conceptual frames.
      *   **New Issue:** L2 proficiency adds a massive confound (understanding, cognitive load, acculturation). The procedure is not designed for this. **Recommendation:** Exclude L2 respondents from core cross-linguistic comparisons where possible. If inclusion is mandatory, analyze them as a separate group with caveats about potential linguistic/cultural interference, but do *not* pool them directly with L1 speakers using the standard procedure. FRAME-CHECK cannot resolve L2 complexities.
  3.  **Prove Causation of Distribution Differences:** It identifies *potential* linguistic biases. Step 4a looks for supporting evidence (split-sample, interviews), but definitive proof often requires impractical controlled experiments.
  4.  **Resolve Fundamental Construct Validity Debates:** It identifies when language makes measuring the *intended* construct problematic. It cannot decide if the construct itself is valid cross-culturally (Step 4 Handover).
  5.  **Eliminate Analyst Judgment:** Steps 2, 3, and 4b require trained judgment based on evidence. The procedure structures and documents this judgment but doesn't remove it.
  6.  **Fix Deep Cultural Mismatches:** If the *construct itself* is culturally inappropriate (e.g., highly individualistic "self-efficacy" in strongly collectivist settings), linguistic adaptation (Step 4b) might create a locally valid measure, but it may not be comparable. This becomes a Step 4 Handover about the construct's validity. The procedure highlights the linguistic symptom of a potentially deeper issue.

  This FRAME-CHECK procedure provides a systematic, theoretically grounded, and operationally feasible way to move beyond instinct, minimizing both false pooling and unnecessary exclusion by focusing on linguistically-induced *systematic bias* in *construct measurement*, while clearly flagging decisions requiring higher-level input on construct validity and trade-offs.
