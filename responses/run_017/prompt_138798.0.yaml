prompt: |-
  Hi — I'm a novelist, not an academic, and I've somehow let myself be talked into running a forty-five minute session at a writers' festival in the spring: about thirty other novelists, no slides, me and a flipchart and a room that will have had lunch. It's being billed as Can Your Characters Agree to Disagree?, and the thing I actually have to get across in the middle of it is the common prior assumption in Bayesian epistemology — not the maths, god knows, I've no maths — but the intuition that two perfectly rational people who trust each other and who tell each other everything they know shouldn't be able to end up still disagreeing, the famous result that says they can't, and the assumption underneath doing all the work.

  Don't explain it to me, I've read around a bit. Plan how I should teach it.

  What I especially want from you is the dependency structure: what has to be in place before the assumption even means anything, and why. My sense is that people will hear prior and file it under starting belief or prejudice, and once it's filed that way the rest of the session is unrecoverable, so I need to know what to put in their heads first so that a prior lands as the thing you'd believe if the only difference between you were the evidence you'd each seen.

  The carrying example has to be fiction-shaped, because these are novelists. Mine is from my own draft: two women who've been friends since they were eleven, one of them thinks the other's brother is lying about where he was that night, each of them has private evidence, and they've told each other most of it but not all. There is no moment in time when they shared a prior — they've known each other forty years — so I need the sequence arranged so that the prior feels like a counterfactual rather than a point in time, or the whole thing collapses the second someone in the third row asks when the prior got set. Tell me what that example must contain and what it must not contain, and if it's the wrong one, say so and give me the right one.

  Misconceptions I'm betting on, and I want each defused at the right point in the sequence rather than all at the end: prior as prejudice; the assumption being that everyone begins with the same opinions; it's a claim about how people actually reason, therefore obviously false, therefore who cares; if it's true then every disagreement in fiction is irrational and there goes drama, which is the one that will make the room turn on me; rational people with the same evidence must agree; and the clever dodge, somebody will say people just have different values and that settles it, and I want that headed off wherever it does least damage rather than wherever it's most fun to argue with.

  I also want to use the no-trade thing — two people sharing a prior shouldn't both be able to expect to win a bet — because writers understand a wager in a scene in a way they won't understand a theorem. Where does that go: is it the thing that carries the session, or the payoff at the end?

  What should I openly refuse to explain at this level and say out loud that I'm refusing? And give me one question to put to them at the end that tests whether they actually picked up the assumption rather than the slogan — ideally something they can answer about whatever they're working on at the moment, since that's the only version of the idea they'll retain past the weekend.
reasoning: |-
  Okay, the user is a novelist preparing for a writers' festival session. They need to explain the common prior assumption in Bayesian epistemology without the math, focusing on intuition. Their key challenge is preventing misconceptions like "prior as prejudice" and ensuring the concept lands correctly.

  First, I need to understand their core goal: teaching that rational people with shared trust and full evidence sharing can't disagree if they started from the same prior. The example they have involves two friends disagreeing about a brother's alibi. But there's a problem—no clear starting point for a prior since they've known each other for 40 years. The user worries about someone asking when the prior was set. So the example needs to present the prior as a counterfactual: "if they had the same starting point before seeing any evidence, their disagreement now implies hidden info."

  The user listed several misconceptions to defuse. Each needs addressing at specific points. "Prior as prejudice" is critical to tackle early. Maybe by framing the prior as a neutral starting point, like a detective's baseline before clues. The "different values" dodge should be preempted by clarifying that the theorem applies only to factual disagreements, not value judgments. The drama concern—that this kills conflict—needs turning around: hidden information creates sustainable tension.

  The no-trade theorem could be a hook. Writers understand bets as dramatic devices. Starting with a wager scenario might engage them immediately. Pose a bet between the two women: if they both think they can win, that signals hidden information. Then unpack why that happens, leading to the prior assumption.

  Structure-wise, the session should flow from concrete to abstract. Start with the bet, show the disagreement, reveal that shared trust and rationality imply hidden evidence, then introduce the prior as the missing piece. Emphasize that the prior is hypothetical here—what they would've agreed on before collecting any evidence.

  For the example, the user's scenario works if tweaked. The key is that both women trust each other completely and have shared all evidence except one piece each. The brother's alibi must be a factual claim, not subjective. The prior isn't a memory but a "what if" they had assessed the brother's trustworthiness before the incident.

  What to avoid: letting the prior be mistaken for current beliefs or prejudice. Stress it's a starting point for evidence accumulation. Openly refuse to explain the math or multiple updates. Focus on the intuition.

  End with a question that tests understanding: "What's one piece of hidden evidence keeping your characters from agreement?" This applies the concept to their writing.
answer: |-
  Here’s a battle-tested plan for your session—structured to dodge misconceptions, anchor the "common prior" as a counterfactual, and use fiction-friendly intuition. Total runtime: ~45 mins (adjust timings as needed).

  ---

  ### **Session Structure: The Dependency Chain**  
  **Core Logic:** Disagreement ➜ Requires hidden evidence *only if* rationality + trust + shared priors exist.  
  *Goal: Make "common prior" feel like a *condition for sustained disagreement*, not a historical fact.*

  ---

  ### **Part 1: Hook with the Wager (5 mins)**  
  **Start here:** "Two rational people who trust each other *cannot bet against each other* if they’ve shared all evidence. If they both think they’ll win, someone is hiding something."  
  - **Fiction-shaped example:**  
    *Elena thinks her brother Leo is lying about his alibi (he claims he was at the cinema). Maya believes him. Both are rational, trust each other deeply, and have shared 90% of their evidence. Elena offers a bet: "If he’s lying, you donate £100 to his charity; if he’s innocent, I do." Maya accepts eagerly.*  
    **Q to the room:** *"Why would both agree? What’s happening here?"*  
    → *Key insight: Betting reveals hidden info. Writers instantly grok stakes.*

  ---

  ### **Part 2: Dissect the Disagreement (10 mins)**  
  **Q:** *"Why don’t Elena and Maya agree yet?"*  
    - Brainstorm on flipchart: *"Different evidence? Different values? Trauma? Irrationality?"*  
  **Defuse misconceptions now:**  
    - 🚫 **"Values dodge"**: *"If this were about whether lying is *wrong*, values matter. But here it’s factual: *Was Leo at the cinema?* The theorem applies to facts, not morals."*  
    - 🚫 **"Rational people must agree"**: *"Actually, rational people *with identical evidence* must agree. But if evidence differs? Disagreement is normal."*  
  **Pivot:** *"But Elena and Maya shared almost everything. Why still disagree?"*

  ---

  ### **Part 3: Introduce the "Common Prior" as the Missing Piece (15 mins)**  
  **Build dependency chain:**  
  1. **Rationality + Trust + Full Sharing** → Should lead to agreement.  
  2. **But they disagree** → So one condition is broken.  
  3. *"If we assume trust and rationality are intact... the break is in 'full sharing' OR... they never had the same starting point."*  

  **Reframe the prior as counterfactual:**  
    - *"Forget 'when did they share a prior?'—it's not a memory. Imagine them *before* either saw any evidence about Leo’s alibi. If they’d been asked then, 'How likely is Leo to lie?', would they have given the same probability?"*  
    - **Your example fix:**  
      - ✅ **Must contain**: A *factual claim* (Leo’s alibi), *trust*, *rationality*, and *private evidence each hasn’t shared*.  
      - ✅ **Must not contain**: Any suggestion they "agreed on Leo" in the past. Instead: *"Forty years of friendship doesn’t mean they shared identical base-rates for lying siblings. The 'prior' is hypothetical: what they’d believe with zero case-specific evidence."*  
    - **Analogy**: *"Like detectives starting a case: if both begin equally skeptical of the suspect, but later disagree after sharing clues, someone held back evidence."*  

  **Defuse "prior = prejudice"**:  
    - 🚫 *"This isn’t about bias. It’s a neutral starting point: if neither knew Leo, their 'prior' might be society’s base-rate for lying. For Elena and Maya, it’s *what they’d agree on if they’d never investigated this alibi*."*  

  ---

  ### **Part 4: Why This Matters for Fiction (10 mins)**  
  **Q:** *"Does this kill drama? If rational people must agree, where’s the conflict?"*  
    - **Flip it**: *"No! This *creates* sustainable tension. Disagreement persists precisely because:  
      1. Characters *haven’t* shared everything (drama!), or  
      2. They lacked a common starting point (character depth!)."*  
    - **Power tip**: *"The 'common prior' assumption tells you *why* a disagreement feels unresolved. Hidden evidence? Secrets! Different priors? Backstory wounds!"*  

  **Defuse "it’s obviously false"**:  
    - 🚫 *"Real humans aren’t perfectly rational? Exactly. This is a logic tool—not realism. Use it to diagnose *why* characters clash. Is it trauma (different priors)? Secrets (hidden evidence)?"*  

  ---

  ### **Part 5: What to Openly Refuse (2 mins)**  
  **Declare upfront**:  
    - *"I won’t explain Bayesian math, posterior calculations, or multiple updates. We’re extracting one insight: disagreement + trust + rationality = hidden evidence or different starting points."*  
    - *"This isn’t psychology—it’s logic. We’re using it as a X-ray for conflict."*  

  ---

  ### **Closing Question (3 mins)**  
  **Test their grasp**:  
    *"Pick a disagreement in your current draft. Is it sustainable between rational, trusting characters? If yes, what *one hidden fact* or *differing starting point* keeps them from agreeing?"*  
    → Forces them to apply the *assumption* (common prior as condition), not just the slogan.  

  ---

  ### **Why This Works**  
  - **Wager first**: Writers engage with bets instantly. It’s visceral.  
  - **Dependency chain**: Trust/rationality → Full sharing → Agreement. Break one link? Drama.  
  - **Prior as hypothetical**: Sidesteps "when did they agree?" by making it a thought experiment.  
  - **Misconceptions defused in flow**: Values (early), drama-killer (late), prejudice (mid).  
  - **Their example works**: Just stress the prior is *not* "what they thought as kids" but *"what they’d say before this alibi case."*  

  You’re weaponizing logic for better conflict. Novelists will steal this.
