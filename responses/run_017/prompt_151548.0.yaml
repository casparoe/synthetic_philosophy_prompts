    "holding": "Members have a duty to credibly contest false statements impugning their competence or integrity in contexts harming the Guild; silence when others are at risk compounds disrepute.",
    "closest_precedent": "6 (Fenwick)",
    "strongest_objection": "Rennie had a right to choose dignity (forbearance) over honor (confrontation), per Okonjo.",
    "reply": "Okonjo formally sought redress; Rennie’s inaction ignored Rule 5’s institutional imperative, directly enabling harm to juniors."
  }
  ```

  **Principles Adopted:**
