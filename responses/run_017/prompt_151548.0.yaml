    {
      "label": "Defensive Standing",
      "statement": "Members must credibly challenge false or derogatory statements that harm Guild standing, using proportionate means that prioritize institutional redress over retaliation or undue publicity.",
      "precedents_it_explains": "1 (Wallace: rebuttal mitigates penalty), 2 (Okonjo: formal complaint commended), 3 (Ferrier: violence disproportionate), 4 (Adeyemi: exposure justified but excess noted), 5 (Strachan: public vindication valid), 6 (Fenwick: inaction burdens Guild).",
      "precedent_it_strains_on": "None; all are coherent under this hybrid."
    }
  ]
  ```

  **Predictions for Rennie:**
