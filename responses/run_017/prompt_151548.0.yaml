  ### Reasoning Summary
  The "Defensive Standing" rule best synthesizes our precedents. Wallace and Fenwick emphasize that unanswered slights fester; Okonjo and Adeyemi show formal or proportional responses are valid; Ferrier and Strachan reject extremes. Rennie’s silence—despite Halloran’s false "diversity appointment" claim in a professional setting—violated Rule 4 (failing to uphold mutual respect by allowing the slur to stand) and Rule 5 (permitting disrepute through inaction, enabling Halloran’s subsequent harassment). While his evidence remains admissible, his breach reflects poorly on judgment. Finding otherwise would endorse passivity in the face of defamation, contradicting Fenwick and undermining the merged code’s duty to report. The strongest counterargument (Okonjo-style dignity) fails because Okonjo acted institutionally, whereas Rennie did nothing. Consistency demands we affirm that members must defend the Guild’s integrity when directly challenged.
