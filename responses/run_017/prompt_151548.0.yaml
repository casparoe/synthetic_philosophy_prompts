    "what_each_rule_predicts": "Defensive Standing: breach due to initial inaction enabling harm. A pure dignity rule: no breach if later reported. Pure honor: breach for not confronting immediately.",
    "why_it_settles_it": "It tests whether the duty to act arises at the first slight (honor/institution) or only upon systemic risk (victimhood)."
  }
