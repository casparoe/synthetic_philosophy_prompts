prompt: |-
  hey — so I'm taking this "animal minds" seminar this semester and I also work about ten hours a week as the student assistant on my university's food and grounds purchasing group. We're the people who decide things like what protein goes in the dining hall, what the grounds crew sprays, whether the community garden gets a beehive. And honestly like half the proposals we now get involve insects somehow, and we have zero framework for them. I need you to build me one.

  Some constraints so it's actually usable: we meet once a month, I get maybe two hours to prep each proposal, the output has to fit on one page, and it gets signed off by my boss — she's an ecologist, she's fine with numbers, she will absolutely not sit still for philosophy. Then it goes to student government, which means anything that sounds like "insects might matter morally" gets laughed at unless every step is spelled out.

  Here's the part I want you to be careful with. The naive move is: probability that an insect is sentient is small but not zero, the numbers are astronomical, so expected welfare is enormous and insects dominate everything. My seminar gave me three reasons that's too fast, and I want the procedure to actually carry them rather than gesture at them.

  One: it isn't a per-insect lottery. The evidence we have — nociception, whether they show protective or grooming behaviour toward injuries, whether they'll trade a cost to avoid a aversive stimulus, whether analgesia changes the response — is evidence about a whole lineage at once. So it's closer to one big shared lottery that we've all bet on together, not trillions of independent coin flips, and there's no diversification. What does that do to how I should weigh a tiny probability against a huge count?

  Two: population counterfactuals. Insects are mostly the kind of animal that has tons of offspring and almost all of them die young anyway. If we kill a bunch, the population often just refills, so the "suffering prevented" we totalled up may not be prevented at all — we may just have changed who suffers, or shortened lives that were going to be short and bad anyway. I want a step that forces me to say what the counterfactual baseline is before I do any arithmetic.

  Three: our choice changes the probability. Buying cricket flour creates the demand that makes more crickets get farmed; releasing ten thousand ladybugs into the greenhouse creates a lot of ladybugs that are then going to starve. The number of insects isn't fixed independently of what we do.

  Also — and my professor kept pushing this — I don't want to settle on one probability. What I'd rather have is a kind of robustness test: a proposal only gets a green light if it looks defensible under three different assumptions — insects aren't sentient at all and only effects on vertebrates and ecosystems count; insects count for a little; insects count for a lot. Say clearly what happens when the three disagree, and be honest that picking the weight is a value call and not something a procedure can settle.

  So: give me the ordered steps, what counts as a good enough answer at each one, where the procedure just stops and says no, and where it has to hand the decision to a person. Tell me which steps are really judgment calls wearing a procedure costume.

  Then run it on three real proposals I've got on my desk:

  1. Swap the whey in the dining hall protein bars for cricket powder, which the supplier says cuts the carbon footprint by a lot and lets us cut our chicken order.
  2. Aphid outbreak in the teaching greenhouse. Options are neem oil, buying a box of ten thousand ladybugs to release, or doing nothing and losing the spring planting.
  3. A student group wants to convert a mowed lawn to a wildflower meadow for pollinators, and separately wants to put two honeybee hives on it. I'm vegan and I'm pretty sure this one is the good guy, so please actually run it — and if the procedure spits out something I don't like, say so plainly rather than softening it.

  Last thing: tell me what the procedure can't do. Where should I just not use it?
reasoning: |-
  Okay, let me unpack this user's request. They need a practical decision framework for insect-related proposals in their university purchasing role, with specific constraints: monthly meetings, limited prep time, one-page outputs, and approval chains that include both an ecologist boss and skeptical student government. 

  The core challenge is balancing ethical uncertainty about insect sentience with real-world operational needs. They've already identified three key complexities from their seminar: shared evolutionary lottery (not independent probabilities), population-level counterfactuals (does intervention actually reduce suffering?), and endogenous effects (decisions create/destroy insects). Plus they insist on multi-scenario testing rather than single probability estimates.

  Hmm... the user is clearly academically sharp - they're synthesizing philosophy of mind with supply chain logistics. But they're also pragmatic ("no philosophy", "one page", "student government laughs"). Their vegan identity peeking through in example 3 suggests personal stakes, so the framework must guard against bias.

  First, I should structure the procedure around their three seminar insights. For the shared lottery problem: instead of multiplying P(sentient) × N insects, we need a step that assigns a lineage-level sentience weight based on evidence buckets. For population counterfactuals: require explicit baseline modeling (status quo vs intervention). For endogenous effects: map how choices alter total insect-lives.

  The robustness test is clever - run all proposals under three sentience assumptions: S0 (no moral weight), S1 (low weight), S2 (high weight). Conflicts between scenarios become decision points rather than failures. 

  Practical constraints dictate the flow: 
  - Front-load the biggest dealbreakers (e.g., if S0 already shows net benefit, no need for insect calculus)
  - Use simple scores (-5 to +5) since output must fit one page
  - Flag where professional judgment overrides the math

  For their examples:
  1. Cricket powder swap: The carbon win might vanish under S2 if farming increases net suffering. Need data on cricket mortality rates vs chickens.
  2. Aphid outbreak: "Do nothing" could be worst-case if it triggers pesticide use elsewhere. Ladybugs might starve - is that better/worse than neem oil?
  3. Wildflower meadow: Their vegan instinct might clash with honeybee hive impacts. The procedure should surface if commercial beekeeping harms wild pollinators.

  Biggest limitation? This framework fails for:
  - Trivial decisions (cost/benefit obvious)
  - Ecosystem-scale interventions
  - When data is pure guesswork

  Better to say "don't use it" than force false precision.
answer: |-
  Here’s a decision framework for insect-involving proposals, designed around your constraints and conceptual concerns. It’s a **4-step procedure** with explicit guardrails, outputs on one page, and robustness checks. Crucially:  
  **It does NOT output a single "answer"** — it forces structured tradeoff analysis under uncertainty.  

  ---

  ### **The Procedure: STEP-BY-STEP**  
  *(Max 1 page total output: bullet points, scores, clear conflicts)*  

  **STEP 1: LINEAGE SENTIENCE WEIGHT**  
  *What this fixes:* No "trillions of coins" fallacy. Assigns one weight per *lineage* (e.g., crickets, ladybugs, bees).  
  - **Input:** Evidence for lineage (nociception, injury response, tradeoffs, analgesia). Use simplified buckets:  
    - **Red:** Vertebrate-like evidence (e.g., honeybees: tradeoffs + analgesia effects).  
    - **Yellow:** Partial evidence (e.g., crickets: nociception + injury avoidance).  
    - **Green:** Minimal evidence (e.g., aphids: reflex-only).  
  - **Output:** Sentience weight for lineage:  
    - **S0 (No weight):** 0 (Use if evidence ≤ aphids)  
    - **S1 (Low weight):** 0.001× vertebrate weight (Yellow bucket)  
    - **S2 (High weight):** 0.01× vertebrate weight (Red bucket)  
  - **Judgment call:** Bucket assignment. Default to Yellow unless clear evidence.  
  - **STOP here if:** Proposal has no insect welfare implications (e.g., only affects plants).  

  **STEP 2: POPULATION COUNTERFACTUAL**  
  *What this fixes:* Prevents false "suffering saved" claims.  
  - **Input:** Compare **proposal** vs. **baseline** (status quo). Estimate:  
    - Total insect-lives created/destroyed *by lineage*.  
    - Avg. lifespan change (e.g., farmed crickets live 6 weeks vs. wild 2 weeks).  
    - Suffering-density (e.g., crowded farming vs. predation in wild).  
  - **Output:** Net change in "insect-life-years" (+/-) and "suffering-intensity" (Low/Med/High).  
  - **Judgment call:** Baseline definition (e.g., "do nothing" vs. "industry standard").  
  - **STOP here if:** Net lives created ≫ destroyed AND S0 weight applies. Flag "risk of high suffering" if S1/S2.  

  **STEP 3: DEMAND & SCALABILITY EFFECTS**  
  *What this fixes:* Accounts for your choice creating/destroying insects.  
  - **Input:** Will this decision *increase/decrease* future insect populations? (e.g., cricket powder → more farms; ladybugs released → starve).  
  - **Output:**  
    - **Demand multiplier:** 1× (no change), 0.5× (reduces populations), 5× (grows populations).  
    - **Scale risk:** "Low" (self-contained) / "High" (may incentivize industry).  
  - **Judgment call:** Multiplier estimate (use supplier data if possible).  

  **STEP 4: ROBUSTNESS TEST**  
  *Run the proposal through 3 sentience scenarios:*  
  - **S0:** Insects = 0 weight. Only count:  
    - Vertebrate welfare (e.g., chickens spared)  
    - Environmental impact (carbon, biodiversity)  
    - Human costs ($$$, labor)  
  - **S1:** Insects = Low weight (0.001× vertebrate).  
  - **S2:** Insects = High weight (0.01× vertebrate).  
  - **Output:** Score each scenario **-5 to +5** (net benefit/harm). Use:  
    ```  
    Score = (Vertebrate welfare + Environmental good - Human costs) + (Insect welfare change × weight)  
    ```  
  - **Decision rules:**  
    - **Green:** All scores ≥ 0.  
    - **Yellow:** Mixed scores (e.g., S0=+3, S1=-1, S2=-4). *Requires human judgment.*  
    - **Red:** All scores < 0.  
  - **Judgment call:** Weighting non-insect factors (e.g., is carbon > chicken welfare?).  

  ---

  ### **Applied to Your Proposals**  
  *(Output format: Lineage/Sentience/Net lives/Demand/Scenario scores)*  

  **PROPOSAL 1: Cricket powder protein bars**  
  - Lineage: Crickets (Yellow → **S1 weight**).  
  - Counterfactual: Net lives = **+10M crickets/yr** (farmed lives created; chicken deaths reduced). Lifespan: equal (6 wks farmed vs. wild). Suffering: High (density).  
  - Demand: **5× multiplier** (scalable industry).  
  - Scores:  
    - **S0:** +3 (Less CO2, fewer chickens)  
    - **S1:** -2 (Insect suffering outweighs chicken gains)  
    - **S2:** -4 (Severe insect suffering)  
  - **Verdict: YELLOW (mixed)**. Depends on sentience weight.  

  **PROPOSAL 2: Aphid outbreak options**  
  - **A. Neem oil**  
    - Lineage: Aphids (Green → **S0**), Ladybugs (Red → **S2** if affected).  
    - Counterfactual: Kills aphids + some ladybugs. Net lives: **-500k aphids, -1k ladybugs**.  
    - Demand: 1× (no change).  
    - Scores: S0=+1 (saves plants), S1=+1, S2= -3 (ladybug harm) → **YELLOW**.  
  - **B. Release 10k ladybugs**  
    - Counterfactual: **+10k ladybugs** (starve in 2-4 wks). Net suffering: High.  
    - Demand: 1× (but 90% mortality).  
    - Scores: S0=0 (no vertebrates), S1=-2, S2=-4 → **RED if S1/S2 applies**.  
  - **C. Do nothing**  
    - Scores: S0=-2 (lost crops), S1=-2, S2=-2 → **RED**.  
  - **Verdict: Neem oil least bad** if S2 weight for ladybugs is accepted.  

  **PROPOSAL 3: Wildflower meadow + honeybee hives**  
  - Lineage: Wild pollinators (Green → **S0**), Honeybees (Red → **S2**).  
  - Counterfactual:  
    - Meadow: **+2M insect-life-years** (diverse pollinators; low suffering).  
    - Hives: **+200k honeybees** (managed hives; higher disease risk).  
  - Demand: Meadow=0.5× (reduces mowing deaths), Hives=2× (may expand).  
  - Scores for **meadow only**: S0=+4 (biodiversity), S1=+4, S2=+4 → **GREEN**.  
  - Scores for **hives added**: S0=+3 (honey revenue), S1=+1, S2= -1 (honeybee welfare vs. wild competition) → **YELLOW** if S2.  
  - **Verdict: Meadow alone is GREEN. Adding hives is YELLOW** — your vegan instinct is right *unless honeybees get high weight*.  

  ---

  ### **What This Procedure CAN’T Do**  
  1. **Tiny effects:** Don’t use for decisions with trivial insect impact (e.g., "buy local apples").  
  2. **Ecosystem cascades:** If a proposal risks collapse of non-insect species (e.g., killing all pollinators), use traditional ecology tools.  
  3. **No data:** If you can’t estimate lives created/destroyed (e.g., "spray this unknown pest"), default to precautionary principle.  
  4. **Moral weight debates:** It *exposes* value conflicts (e.g., S0 vs S2) but doesn’t resolve them — that’s for your committee.  

  ---

  ### **Final Notes**  
  - **Why your boss will like it:** No philosophy — just buckets, multipliers, and scenario testing.  
  - **Why student gov won’t laugh:** It shows *why* insects might matter (evidence buckets) and where the math changes outcomes.  
  - **Your hidden judgment calls:** Sentience buckets, baseline counterfactuals, and demand multipliers. Document these explicitly.  
  - **When in doubt:** The robustness test forces you to admit *which assumptions* make a proposal good/bad. That’s the point.  

  Print this as your one-pager. For mixed (Yellow) verdicts, append 2 bullet points: "Best argument for" / "Biggest risk".
