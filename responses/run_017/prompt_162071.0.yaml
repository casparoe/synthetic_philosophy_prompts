prompt: |-
  I write a column on science and ideas, and over the past two years I have come to lean on language models for parts of the job. I am trying to work out what I actually think about when that dependence costs me something, going by my gut on cases, and I would like a principle rather than a vibe.

  Arithmetic and algebra handed to a computer algebra system, in a piece where I only need the result: no loss I care about. Letting a model summarize a paper outside my beat and writing a paragraph from that summary: a real loss, and I would be exposed if a source pushed back on it. The same paper, the same paragraph, but summarized by a colleague who works in that field: fine, or close to it. A model summarizing a paper inside my beat, where I would almost certainly catch a bad summary: mostly fine, but not entirely. Asking a model to walk me through a statistical technique until I can run it myself: clearly fine, maybe better than fine. Dictating drafts by speech-to-text: fine, even though I have noticeably lost the ability to type quickly. GPS in a city I have visited twice: fine. GPS in the neighborhood I have lived in for fifteen years: not fine. Autocomplete for a throwaway data-cleaning script: fine. Autocomplete across a codebase I will maintain for years: worry. A model producing a first draft of my column in something close to my own voice, which I then rewrite heavily: this bothers me most of all, more than the off-beat-paper case, even though I can audit it far better. Turning my own bullet points into a letter of recommendation for a former intern: I think that is fine. A condolence note to a friend: not fine, and I cannot explain why without sounding sentimental.

  My tentative principle is that dependence erodes understanding when it displaces a capacity I would otherwise have exercised and when I cannot audit the tool's distinctive failure modes. But that predicts the voice-draft case should be the least troubling of the set when it is in fact the most, and it has nothing to say about why the recommendation letter and the condolence note come apart. Is there a single principle that handles all of these, or do the epistemic cost and something like an authorship or self-knowledge cost have to be tracked separately? Please state the principle, or the small set of candidates, precisely; say which case motivates each clause; say what it predicts about two cases I have not settled — using a model to pressure-test an argument of mine before publishing it, and relying on one for a medical or financial decision; and say plainly which of my verdicts it cannot accommodate and would have me abandon. I would also like to know whether erosion of understanding is the right description at all, or whether what I am losing in the last two cases is some other thing that merely looks like it.
reasoning: |-
  Hmm, the user is a science columnist who relies on language models for their work but is grappling with the costs of dependence. They've provided a detailed set of cases where they feel AI assistance is acceptable versus problematic, and they're seeking a precise principle to explain these intuitions.

  The user describes several scenarios: Using computer algebra for math results is fine, but having AI summarize papers outside their expertise feels like a loss. They're okay with colleague summaries though. Even within their expertise, AI summaries bother them slightly. Using AI to learn statistical techniques is positive, but voice-drafting columns in their own voice feels deeply troubling despite being auditable. Recommendation letters via AI are acceptable, but condolence notes aren't - and this distinction puzzles them.

  Their proposed principle about "dependence eroding understanding when displacing exercised capacity and lacking auditability" doesn't explain why the voice-draft case (auditable) bothers them more than off-beat summaries (less auditable), nor the condolence note exception.

  Three core tensions emerge:
  1) The voice-draft paradox (auditable but feels wrong)
  2) The condolence/recommendation disparity (both personal but different judgments)
  3) Why GPS in home neighborhood feels wrong despite being auditable

  I think there are two separate axes at play here: epistemic risk (can I verify this?) and identity work (is this fundamentally my expression?). The voice-draft case feels wrong because it hijacks the writer's identity formation process, even if factually correct. Condolence notes fail because they're inherently about personal expression, while recommendation letters have standardized professional expectations.

  For the unresolved cases: Pressure-testing arguments seems fine epistemically but risks intellectual complacency; medical/financial decisions are high-stakes epistemic risks where AI's reasoning isn't transparent. Some original judgments might need revising, like being stricter on using GPS in familiar areas if it erodes spatial cognition.

  The erosion isn't just about understanding - it's also about agency and identity in domains that shape who we are. The columnist might need to accept that multiple principles apply to different aspects of their work.
answer: |-
  Based on your detailed cases and the tensions within them, a single principle struggles to capture all facets. Instead, a dual-principle framework better explains your intuitions, distinguishing **Epistemic Risk** from **Identity/Agency Encroachment**. Here are the principles, their motivations, predictions, limitations, and a note on "erosion of understanding":

  ### The Principles

  1.  **Epistemic Risk Principle:** Dependence is costly when the tool operates with significant opacity *and* the task demands high-stakes accuracy *and* the user lacks sufficient context/competence to reliably audit the tool's distinctive failure modes.
      *   **Motivated by:** Off-beat paper summary (high opacity, high stakes, low user competence/context for audit), GPS in home neighborhood (high personal stakes for spatial awareness, potential for subtle errors hard to audit if fully dependent), Autocomplete in critical long-term codebase (high stakes for future work, potential for subtle errors hard to spot later).
      *   **Predicts:**
          *   **Pressure-Testing an Argument:** *Generally acceptable (Low Risk)*. Core argument is yours. The model acts as an error-checking tool against *known* biases or blind spots (straw men, counterexamples). Opacity is high, but stakes are lower than publishing unchecked (you audit its *suggestions* against your knowledge), and your competence/context (your own argument) is high for auditing *relevance* and *logic* (even if not the model's *reasoning*). Risk: Over-reliance weakening your *future* critical thinking.
          *   **Medical/Financial Decision:** *Unacceptable (High Risk)*. High stakes, extreme opacity (model's reasoning is a black box, failure modes complex/unknown), user typically lacks the deep domain competence to audit the *distinctive* failure modes of an LLM in these contexts (e.g., hallucinating studies, misinterpreting nuances, lacking true causal reasoning).
      *   **Cannot Accommodate:** Condolence Note (low epistemic stakes, opacity irrelevant); Voice Draft (you *can* audit it); Recommendation Letter (low/moderate epistemic stakes, you can audit facts/tone). GPS in home neighborhood feels partly epistemic (auditability of spatial reasoning degrades with dependence), but also partly agency/identity.

  2.  **Identity/Agency Encroachment Principle:** Dependence is costly when the tool performs a core function constitutive of the user's identity, agency, or essential self-knowledge *and* its process bypasses or substitutes for the user's own cognitive/expressive engagement in that function.
      *   **Motivated by:** Voice Draft (core identity/agency as a *writer*; drafting is fundamental expressive/thinking process), Condolence Note (core expression of authentic personal emotion/relationship), GPS in home neighborhood (core agency/self-knowledge related to spatial navigation and environmental mastery), Arithmetic/Algebra via CAS (not constitutive of identity), Off-beat summary (not core identity function), Learning stats (enhances agency), Recommendation Letter (professional duty, standardized genre, less core to *personal* identity/expression).
      *   **Predicts:**
          *   **Pressure-Testing an Argument:** *Acceptable (Low Encroachment)*. Core identity as a *thinker* is engaged in *forming* the argument; pressure-testing is a *supportive* critique function, not identity-constitutive creation. Agency remains central.
          *   **Medical/Financial Decision:** *Unacceptable (High Encroachment)*. Core agency over personal well-being and life choices is fundamentally delegated. The cognitive process of weighing complex personal factors is outsourced.
      *   **Cannot Accommodate:** Off-beat paper summary (while not identity-constitutive, the epistemic risk dominates). Strict adherence might make GPS in home neighborhood *more* unacceptable than you initially feel ("not fine" aligns).

  ### Resolving Your Cases & Tensions

  *   **Voice Draft Paradox (Most Troubling):** Explained by **Identity/Agency Encroachment**. The drafting process *is* your thinking and identity as a writer. Outsourcing the *initial formation* of expression, even if auditable, feels like a violation of self, bypassing essential cognitive engagement. Epistemic risk is lower (auditable), but the identity cost is high.
  *   **Condolence vs. Recommendation Letter:** Explained by **Identity/Agency Encroachment**. A condolence note is a core act of personal emotional expression and relationship maintenance. A recommendation letter, while important, is a professional obligation with more standardized expectations; turning bullet points into prose is closer to efficient communication than outsourcing core emotional labor. The *source* (your relationship/bullet points) matters more than the *polish*.
  *   **GPS in Home Neighborhood:** Captured by both principles. **Epistemic Risk:** Subtle degradation of spatial reasoning/awareness makes errors harder to self-correct over time. **Identity/Agency:** Undermines a sense of mastery, environmental connection, and personal agency within your own space.
  *   **Cases Your Tentative Principle Struggled With:**
      *   Voice Draft: Identity cost outweighs epistemic auditability.
      *   Condolence Note: Identity cost dominates, epistemic stakes irrelevant.
      *   Recommendation Letter: Low identity cost (professional context) and manageable epistemic risk (auditable facts/tone) make it acceptable.

  ### Predictions for Your Unsolved Cases

  *   **Pressure-Testing an Argument:** **Mostly Fine** (Epistemic Risk: Low - supportive tool, high user competence for audit; Identity/Agency: Low - core formation is yours, testing is auxiliary).
  *   **Medical/Financial Decision:** **Unacceptable** (Epistemic Risk: Very High - opacity, high stakes, low user audit competence; Identity/Agency: Very High - delegating core personal agency and judgment).

  ### What You Should Abandon

  This framework suggests you reconsider two intuitions slightly:

  1.  **GPS in Home Neighborhood:** Your "not fine" verdict is supported, but the framework suggests it might be *more* fundamentally problematic due to **Identity/Agency Encroachment** (loss of environmental mastery/connection) than your initial epistemic concern ("cannot audit") implies. Your gut feeling aligns with the principle's strength here.
  2.  **Recommendation Letter:** The framework strongly supports your "fine" verdict, clarifying that the lack of deep identity/agency stake (it's professional, source-driven) and manageable epistemic risk make it acceptable, unlike the condolence note.

  ### Is "Erosion of Understanding" the Right Description?

  It's **partially correct, but incomplete**.

  *   **Epistemic Risk Principle:** Directly concerns erosion of *veridical understanding* (accurate knowledge of the world) and the *capacity to attain it* (auditing skills). Off-beat summaries, uncritical code autocomplete, or GPS dependence can erode understanding and the skills to gain it.
  *   **Identity/Agency Encroachment Principle:** Concerns erosion of **self-knowledge, expressive capacity, and agential competence**. What's lost in the voice draft is the deep cognitive process of *forming* thought into your unique expression – a key part of self-understanding. What's lost in the GPS case is embodied spatial agency. What's lost in the condolence note is the authentic expression of self-in-relationship. This isn't merely "understanding" the external world; it's understanding and enacting *yourself*.

  **Conclusion:** You are tracking two distinct costs: **Epistemic Risk** (failure to know the world accurately due to opaque tools, high stakes, and low audit capacity) and **Identity/Agency Encroachment** (failure to enact core aspects of selfhood, expression, and competence due to outsourcing constitutive processes). This dual framework explains your varied intuitions, resolves the tensions in your cases, provides clear predictions, and clarifies that what's eroded encompasses both objective understanding and subjective self-knowledge/agency. Abandoning your tentative principle's prediction on the voice draft is necessary; it highlights the crucial role of identity and agency beyond pure epistemology.
