answer: |-
  Here’s a decision tree handout designed around your agent case, exposing the metaphysical vs. causal-theoretic fault line and testing your conviction about coarse-grained effects. It fits on one A4 page and uses the grid-world example to force students to confront intuitions before labels. Positions are sorted by their response to the case, not by popularity.

  ---

  **NAVIGATING THE CAUSAL EXCLUSION ARGUMENT: A DECISION TREE**  
  *Based on a grid-world agent with a `thirsty` variable (voltage pattern V1 on old hardware, V2 on new hardware). The agent walks to the fountain when `thirsty` is true.  
  Wrinkles:  
  - Debugger sets `thirsty := false` → also changes voltages (no mental w/o physical intervention).  
  - Bypass: Writing to motor-output register moves the agent without `thirsty`.  
  - Effect grain: Fine = *exact* force/path at time *t*; Coarse = *reaches fountain*.*

  **Start → Q1: When the agent walks to the fountain, could we produce the *exact same fine-grained movement* by directly manipulating voltages (bypassing `thirsty`)?**  
  - **Yes** → Go to Q2.  
  - **No** → **Emergentist/Dualist**  
    *Awkward: Must deny physical laws fully explain fine-grained movements (mental "downward causation").*

  **Q2: If we run the agent on new hardware (where `thirsty` = V2, not V1), is the *coarse-grained effect* (reaching fountain) still caused by the *same kind of thing* as on old hardware?**  
  - **Yes** → Go to Q3.  
  - **No** → **Reductionist (Type Identity)**  
    *Awkward: Must say "thirsty" is just voltage (denies multiple realizability).*

  **Q3: Is `thirsty` just a *label* for whatever voltage pattern implements it, with no real causal power of its own?**  
  - **Yes** → **Eliminativist**  
    *Awkward: Mental states don’t exist; we’re wrong about thirst.*  
  - **No** → Go to Q4.  

  **Q4: When `thirsty` causes the walk, does it work *only because* it’s built from voltage states that "do the real work"?**  
  - **Yes** → Go to Q5. *(Metaphysical branch: mental inherits physical causes)*  
  - **No** → Go to Q6. *(Causal branch: causation explains mental efficacy)*  

  **Q5: In one run, is `thirsty` *identical* to its voltage pattern (V1/V2)?**  
  - **Yes** → **Token Identity (with Inheritance)**  
    *Awkward: Mental causation is just physical causation in disguise.*  
  - **No** → **Epiphenomenalist**  
    *Awkward: `thirsty` is a byproduct of voltages but does nothing (even when bypassed).*  

  **Q6: Does the *coarse-grained effect* (reaching fountain) have *two independent causes*: `thirsty` *and* voltages?**  
  - **Yes** → **Overdeterminationist**  
    *Awkward: Fountain-walk is "overdetermined" like two bullets killing simultaneously.*  
  - **No** → Go to Q7.  

  **Q7: Is `thirsty` a cause because it’s *proportional*—it explains the fountain-walk better than voltages (which are too specific)?**  
  - **Yes** → Go to Q8.  
  - **No** → **Interventionist/Difference-Making Compatibilist**  
    *Awkward: Mental causation requires counterfactuals (if not thirsty, no walk) despite debugger constraints.*  

  **Q8: Is `thirsty-or-it’s-Tuesday` *equally proportional* as `thirsty` for causing the walk?**  
  - **Yes** → **Proportionality-Based Compatibilist**  
    *Awkward: Must accept gerrymandered properties (e.g., Tuesday) as causes.*  
  - **No** → **Token Identity (with Inheritance)**  
    *Awkward: Retreats to "mental inherits physical causes" to avoid gerrymanders.*  

  ---

  ### KEY FEATURES & DESIGN NOTES  
  1. **Fault line exposed early**: Q4 splits metaphysical (inheritance) from causal (proportionality/interventionism) strategies.  
  2. **Grain-of-effect tested**:  
     - Q1 forces fine-grained intuitions (supports exclusion).  
     - Q2/Q7 use coarse-grained effects to challenge exclusion (supports your conviction: when effect is coarse, voltages aren’t a candidate cause).  
     - *Result*: Coarse effects weaken exclusion (proportionality/interventionism branches thrive), but gerrymanders (Q8) pressure proportionality.  
  3. **Gerrymander test**: Q8 forces proportionality theorists to confront disjunctive properties.  
  4. **Awkward commitments**: Highlighted at each leaf to show trade-offs (e.g., token identity "saves" causation but collapses to physicalism).  
  5. **Distinctions with overlap**:  
     - Token identity appears in two paths (metaphysical + fallback from proportionality).  
     - Epiphenomenalism and overdetermination are cleanly separated.  
  6. **Unoccupied combo**: "Deny coarse-grained proportionality but accept fine-grained causation" is unexplored (no major position fits).  

  **Why not a quiz?** A tree better exposes how positions *emerge* from case intuitions (e.g., bypass → closure; debugger → exclusion). Students can trace paths after discussing the agent.  

  **Handout tips**:  
  - Add your readings next to position names (e.g., "Token Identity: Davidson").  
  - Use the agent case in tutorials: Ask Q1/Q2 to test your conviction. If students reject fine-grained exclusion (Q1→No), emergentism gains plausibility. If coarse effects (Q2) feel more natural, proportionality/interventionism win.
