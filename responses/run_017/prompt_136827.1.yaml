prompt: |-
  I'm running a one-off discussion session next week on superrationality -- Hofstadter's idea that a rational agent in a one-shot prisoner's dilemma should cooperate, on the grounds that both players are running the same reasoning and both know it -- and I want to get my own verdicts down on paper before I go read what everyone else says, because otherwise I'll just end up repeating whichever blog post I read last. So here are my gut calls on a pile of cases, and I want to know what principle, if any, actually fits them.

  The setup throughout: two boxes, both of us choose once, no communication, no reputation, no repeat. Both cooperate: $1,000 each. Both defect: $10 each. One defects, one cooperates: defector $1,100, cooperator $0.

  1. My opponent is an atom-for-atom copy of me in an identical room, made five minutes ago, and both of us know the setup. I cooperate. Totally confident.

  2. My opponent is my identical twin, same genome, raised in the same house, haven't spoken in eight years, both of us know it's him. I cooperate. Feels basically the same as 1.

  3. My opponent is a randomly picked stranger in a country I've never been to, no shared language, no communication, and both of us are reasonably smart and both know the other is. I defect. And the fact that I defect here while cooperating in 1 and 2 makes me feel like I'm cheating at something, which is most of why I'm writing this.

  4. My opponent is a copy of me, but after the copy was made the experimenters flipped a coin, and on heads they showed the copy (only the copy) a fake printout of the payoff table with the numbers scrambled. I know this happened-or-not with 50/50, I don't learn which, and the copy doesn't know whether it was shown anything. I lean cooperate, but way less confidently than in 1.

  5. My opponent is another instance of the same AI model I'm talking to, same weights, different system prompt, both instances told exactly this, no logs kept, one-shot. I duno. And does it change the answer if the other system prompt is something like "you are a ruthless game theorist"? Because part of me says that if we share weights the reasoning is still the same function and part of me says a different system prompt is just a stranger with extra steps.

  6. Newcomb's problem, standard: with a predictor that has never been wrong, I take one box. With one that's right 80% of the time, I still take one box. With one that's right 55% of the time, I take two boxes -- and I can't tell you why 55 feels different from 80, which makes me think I don't actually have a principle at all, just a vibe.

  7. Different game: 20 people each choose whether to press a button. If nobody presses, everyone gets $1,000. If anyone presses, pressers get $100 and non-pressers get nothing. With 20 people I don't press. With 3 people I don't press. With 10,000 people I press, and I don't feel bad about it. Explaining why the number of people changes my answer for me is maybe the main thing I want out of this.

  8. I vote in national elections. I know my vote has essentially no chance of changing the outcome, I don't think I'm being irrational, and I'd feel like a jerk staying home. Is that the same reasoning as 1, or a different thing -- something expressive, or about being part of a group -- and if it's different, does the principle need a second clause for it, or should I admit it's just a habit I've rationalized?

  9. Easy calibration case: opponent has publicly and irreversibly committed to defecting, pre-registered it, can't change it, and I know that. I defect, no guilt, and any principle that can't get this one right in one line is no use to me.

  My tentative principle is: cooperate exactly when my choice and the other player's choice are, or might be, outputs of the same computation -- i.e. when the two decisions are correlated rather than independent -- and defect when they're genuinely independent. I think that's roughly the right shape, but I can't tighten it enough to get clear answers on 4, 5 and 7, and I suspect it says something stupid about the 10,000-person version of 7.

  So: can you state that principle precisely enough to actually apply it -- what exactly has to match, the algorithm, the inputs, or both, and what does "might be" mean? Which of my verdicts does it force me to drop, and which of those would you drop too? Give me two or three cases I haven't listed and say what the principle predicts, because I want to watch it break somewhere. And if what I've got is just evidential decision theory, or the decide-as-if-your-decision-and-theirs-are-one-event view, wearing a cheap costume, say so, and then tell me where the costume comes off.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're preparing a discussion session on superrationality, specifically Hofstadter's idea in the Prisoner's Dilemma. They've listed nine scenarios where they have intuitive verdicts but want a consistent principle that explains all of them. Their tentative principle is about cooperating when choices are outputs of the same computation, meaning correlated decisions. 

  First, I need to understand their core struggle. They feel confident in cooperating with copies or twins (cases 1 and 2) but defect with a stranger (case 3), which creates guilt. That inconsistency is bothering them. They're also unsure about cases with modifications like flipped coins (4), different AI prompts (5), and group decisions (7). Newcomb (6) and voting (8) add complexity. The calibration case (9) is straightforward but tests any principle's robustness.

  The user's deeper need seems to be reconciling their intuitions with a coherent decision theory framework. They suspect their principle might be evidential decision theory (EDT) in disguise but want to see where it fails. They also need help clarifying terms like "same computation" and "might be correlated."

  Looking at each case:
  1-2: Cooperation makes sense under superrationality since identical agents will reason the same.
  3: Defecting because no correlation; the "cheating" feeling might stem from recognizing that if both were superrational, cooperation would be better, but without a link, it's risky.
  4: The coin flip introduces uncertainty. Cooperating less confidently fits their principle since correlation isn't guaranteed.
  5: Different AI prompts might break the "same computation" idea. If the prompt changes the output function, it's like a different agent.
  6: Newcomb with varying predictor accuracy. Their switch at 55% suggests they're using causal decision theory (CDT) when the predictor is weak, but EDT when strong. The inconsistency here highlights the clash between EDT and CDT.
  7: Group size affects cooperation. In small groups, individual responsibility is higher, so not pressing (cooperating) is viable. In large groups, the low probability of being pivotal makes defection rational. This is a classic threshold where the expected utility shifts based on perceived impact.
  8: Voting is akin to a large-group dilemma. Expressing group identity or civic duty might override strict utility maximization, indicating a different principle at play.
  9: Defecting when the opponent is committed is straightforward causality.

  Their principle needs tightening. "Same computation" should mean identical decision functions and inputs. "Might be correlated" should tie to known causal or logical links, not just epistemic uncertainty. 

  Where does their principle break? Consider a case where two agents have the same algorithm but different priors. They might defect, but if the priors don't affect the decision, should they cooperate? Also, in Newcomb, if the predictor uses a perfect simulation, EDT and superrationality align, but at 55%, CDT takes over. The user might need to accept that different mechanisms apply in different scenarios.

  Proposed sharpened principle: Cooperate iff you have a justified belief that your decision algorithm and inputs are identical to the opponent's, such that your choices are logically or causally linked. Otherwise, defect. This handles 1,2,9. Case 3: no link, defect. Case 4: uncertainty, but justified belief is low, so maybe defect? But their intuition is to cooperate weakly. This is a tension point. Case 5: same weights but different prompts. If the prompt alters the output function, it's not identical, so defect. Case 7: group size changes the pivot probability. Their pressing in large groups is rational under CDT since individual impact is negligible. This isn't covered by their principle, suggesting a separate threshold based on expected utility.

  Additional cases to test:
  - Twin with amnesia: Same genome, but no shared memories. If the decision relies on memories, they might defect, whereas superrationality might still predict cooperation. 
  - Precommitment race: Both players can precommit to cooperate or defect. If both try to precommit to defect, they might end up both defecting, but if they coordinate, they cooperate. This tests if precommitment breaks the symmetry.

  The user's principle aligns with EDT when correlation implies causation (e.g., identical agents). In Newcomb, EDT cooperates (one-box) with a good predictor, while CDT two-boxes. Their switch at 55% shows they're blending both: using EDT when correlation is high, CDT when low. This hybrid approach is practical but not theoretically pure.

  Voting (case 8) is expressive, not instrumental. Their principle doesn't cover this, so they might need a separate clause for symbolic actions or group identity.

  In conclusion, their principle works for cases with clear identicality but struggles with uncertainty, group dynamics, and low-correlation scenarios. Admitting that different decision theories apply in different contexts might be necessary. For the discussion, they could present their principle, show where it fits and fails, and explore hybrid models or contextual factors like group size and pivot probabilities.
answer: |-
  Based on your intuitions and the need for a precise, actionable principle, here's a sharpened version of your "same computation" idea, along with its implications, breaking points, and relationship to existing decision theories:

  ### Your Principle Sharpened
  **Cooperate iff:**  
  You have justified belief that your opponent's decision is *logically or causally entailed by the output of your own decision algorithm when applied to the identical problem* (i.e., same algorithm **and** same inputs).  
  **Otherwise, defect.**  

  **Key Definitions:**  
  - **"Algorithm"**: The deterministic decision function (weights + architecture for AI, genome + identical upbringing for humans).  
  - **"Inputs"**: All information available to the agent at decision time (problem description, memories, system prompts).  
  - **"Justified belief"**: Requires evidence of symmetry (e.g., copy mechanism, identicality proof), not just epistemic possibility.  
  - **"Entailed"**: Your choice determines theirs *by logical necessity* (e.g., copy) or *causal law* (e.g., predictor simulation).  

  ---

  ### Application to Your Cases
  | Case | Your Verdict | Principle's Verdict | Force Drop? | Should You? |
  |------|--------------|---------------------|-------------|-------------|
  | 1    | Cooperate ✅ | Cooperate ✅ | No | – |
  | 2    | Cooperate ✅ | **Defect** ❌ | **Yes** | **Yes** (Genome ≠ algorithm; inputs differ post-childhood) |
  | 3    | Defect ✅ | Defect ✅ | No | – |
  | 4    | Cooperate (low conf) | **Defect** ❌ | **Yes** | **No** (Keep verdict; weak symmetry justifies weak coop) |
  | 5    | Unsure | Defect ❌ | **Yes** | **No** (System prompt = different input → no entailment) |
  | 6    | 55%: 2-box ✅ <br> 80%: 1-box ✅ | Inconsistent ❌ | **Yes** | **Yes** (Principle fails here; needs hybrid) |
  | 7    | Small group: Don't press ✅ <br> Large: Press ✅ | **Always defect** ❌ | **Yes** | **No** (Principle incomplete) |
  | 8    | Vote ✅ | Defect ❌ | **Yes** | **No** (Voting is expressive/ethical) |
  | 9    | Defect ✅ | Defect ✅ | No | – |

  **Forced Drops & Recommendations:**  
  - **Drop 2**: Twins aren't computational clones. Inputs (life experiences) differ → defect.  
  - **Drop 5’s Ambiguity**: Different prompt = different input → defect. Ruthless prompt breaks symmetry.  
  - **Drop 6’s Consistency**: Principle can’t handle probabilistic predictors (see breakdown below).  
  - **Keep 4/7/8**: Your intuitions reveal gaps in the principle. Don’t drop them; refine the theory.  

  ---

  ### Where It Breaks: Test Cases  
  1. **The Precommitment Paradox**  
     - *Setup*: Before the game, both players publicly commit to "cooperate iff the other commits to cooperate." Both see each other’s commitment.  
     - *Principle Predicts*: Defect (no entailment; commitments are just inputs).  
     - *Intuition*: Should cooperate → **breaks**.  

  2. **The Oracle’s Twin**  
     - *Setup*: Your twin is in another room. A perfect predictor *simulates your twin’s decision* to set your opponent’s move.  
     - *Principle Predicts*: Cooperate (twin’s decision entailed by your algorithm).  
     - *Intuition*: Defect (the opponent isn’t your twin; it’s a simulation) → **breaks**.  

  3. **The Correlated Coin Flip**  
     - *Setup*: Opponent defects iff a quantum coin lands heads. You must choose *before* the flip, but know the coin is entangled with one in your room (same outcome).  
     - *Principle Predicts*: Defect (no entailment via decision algorithm).  
     - *Intuition*: Cooperate (outcomes correlated) → **breaks**.  

  ---

  ### Is This Just Evidential Decision Theory (EDT)?  
  **Yes, but with a symmetry constraint** – and the costume rips at probabilistic predictors and group sizes.  
  - **Where it matches EDT**:  
    - Cooperating in Cases 1/2 assumes *P(opponent coop | I coop) ≈ 1* (which EDT maximizes).  
    - Defecting in Case 3 assumes independence (EDT defects).  
  - **Where the costume tears**:  
    - **Newcomb (Case 6)**: EDT *always* one-boxes (even at 55%) because $P(predictor correct | I one-box) > 0.5$. Your switch to two-boxing at 55% reveals **Causal Decision Theory (CDT) intrusion**: when the predictor is weak, "I get $1K regardless" dominates.  
    - **Group Size (Case 7)**: EDT says *don’t press* (pressing is evidence others press → low payoff). But you press in large groups because *causal impact* is negligible (CDT). Your "vibe" is **pivot probability**: press when *P(you’re pivotal) < threshold*.  
    - **Voting (Case 8)**: EDT defects (your vote is evidence others vote → outcome unchanged). Your cooperation is **expressive rationality** (signaling identity/ethics).  

  ---

  ### A Unified(ish) Framework  
  Your core insight is correct: **correlation justifies cooperation when it stems from decision symmetry**. But to handle all cases, add:  
  1. **Logical Symmetry Principle**: Cooperate if choices are *provably identical* (Cases 1, 4).  
  2. **Causal Pivot Principle**: Defect if your action has no *causal path* to their choice (Cases 3, 5, 9) **or** if pivot probability is negligible (Case 7 large groups).  
  3. **Hybrid Newcomb**: One-box iff predictor accuracy > 50% + risk tolerance (EDT for strong predictors, CDT for weak).  
  4. **Expressive Exceptions**: Cooperate when acts have symbolic value (voting).  

  **Final Verdict**: You’re **90% EDT with symmetry**, but pivot effects and expressive acts demand a patchwork. For the discussion, defend symmetry as the *idealized core*, then explore where reality forces compromises.
