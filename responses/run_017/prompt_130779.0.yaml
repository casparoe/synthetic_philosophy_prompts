prompt: |-
  I run a weekly student reading group on decision theory — mostly CS majors with a few philosophy people who wandered in — and we get 75 minutes in a room with a tiny whiteboard and a projector that has never once worked. Last week we did Newcomb's problem and it went okayish: maybe a third of them left convinced that one-boxing is just wishful thinking in a tuxedo. This week I want to do acausal trade, meaning the idea that two agents who cannot affect each other, observe each other, or communicate might still cooperate because their decisions are correlated through the similarity of their decision procedures rather than through any causal link or shared cause. My co-organizer says this is literally just one-boxing with extra steps and we should spend the session on Bayesian epistemology instead, and I half see his point but can't artiuclate what's wrong with it well enough to teach from.

  So don't explain acausal trade to me — plan how I should explain it to them. What I really want is the dependency structure: the order the pieces have to go in and what depends on what. My instinct is that I need them to first accept a case where your action is strong evidence about an outcome without causing it, and only then get them to a case where the correlation isn't explained by a common cause or by somebody simulating them either — but I don't know how to make that second move feel like a real step rather than a sleight of hand, and I worry that starting from Newcomb just replays last week's fight.

  I also need one example to carry the whole session. Here's the one I sketched: two agents, one in each of two universes that will never interact; each has 100 units of its own resource; each can burn k units of its own resource to manufacture 4k units of the good the other one values; unspent units are worth 1 util to their owner and the other's good is worth 1 util per unit to the other. Each is fairly but not fully confident the other exists. And the bit I added to make it hard: the two agents run the same architecture and style of reasoning, but one's utility function has been edited to value the other colour of widget, and their confidence that a counterpart exists differs (say 0.8 versus 0.5). They cannot send messages, so they cannot haggle over how much each burns — each just picks a number in private. Tell me whether that carries the session, what it is missing, what it has that it shouldn't, and why not the usual candidates: the exact-copy prisoner's dilemma, the old puzzle where a prize goes to you only if exactly one of twenty people asks for it, or two galaxy-spanning civilisations that value paperclips and staples. Should I start symmetric and then break the symmetry, or start asymmetric and let the copy case show up as a special case?

  Then the misconception map, with the point in the sequence where each should be headed off — and I mean headed off, not just corrected afterwards. The ones I expect: that this is a promise, a reputation effect, or iterated cooperation in disguise; that my choice somehow causally pushes the other agent's choice; that correlation without a common cause is incoherent so the whole setup is broken (this one will come from the strongest CS student); that it's still just evidential decision theory so nothing new is on the table; that it only works if the other agent is literally running my code, and the opposite error that any sufficiently reasonable agent will do the same thing; that cooperating with a causal-decision-theory counterpart is still worth something; and that this is Pascal's mugging with better branding, a licence to trade with any alien you can imagine. Tell me which of these I should actually invite rather than prevent, and flag any you think I'll get that I haven't listed.

  Finally: what should I openly refuse to explain at this level and say out loud that I'm refusing — I'm thinking the problem of how to weight which computations count as existing, logical uncertainty, updatelessness, whether copies in other branches of quantum mechanics are the same kind of thing as distant civilisations — and which of those I should name-and-drop versus never mention at all; plus one question I can ask at minute seventy where I could actually tell a right answer from a wrong one, so I know whether the idea landed or whether they just got talked into something. (There's a departmental coffee thing right after, so they're going to be restless.)
reasoning: |-
  Okay, let me tackle this user's query. They run a weekly student reading group on decision theory, focusing on CS majors and some philosophy students. Last week covered Newcomb's problem, and now they want to teach acausal trade. Their co-organizer thinks it's just one-boxing with extra steps, but the user disagrees and needs a solid lesson plan.

  First, I need to understand the core challenge. The user wants a dependency structure for teaching—what concepts to introduce in what order. They’re concerned that starting from Newcomb might rehash old debates and that students might not see acausal trade as distinct. The example they sketched involves two agents in separate universes with asymmetric confidence levels. They need validation on whether this example works and how to structure the session.

  The main goal is to help students grasp correlation without causation or common cause. The user’s instinct is to first establish that actions can be evidence without causing outcomes (like in Newcomb), but then move to a scenario without any causal links or simulations. The problem is making that second step feel legitimate, not like sleight of hand.

  I should consider the misconceptions listed. Common ones include mistaking acausal trade for promises, reputation, or iterative cooperation. Also, students might think their choice causally affects the other agent or that correlation without a common cause is impossible. The strongest CS student might challenge the probabilistic foundations.

  For the example, the user’s asymmetric setup (different confidence levels) is good because it prevents assuming symmetry and forces students to calculate expected utility. Symmetry might make it seem like a trivial coordination game. Asymmetry highlights the decision-theoretic core. Including different confidence levels (0.8 vs. 0.5) and utility functions makes it clear that agents aren't identical, avoiding the "exact copy" pitfall.

  Dependency structure: Start with a simple case to establish evidence-action correlation. The user mentioned the "prize if exactly one person asks" puzzle. That introduces correlated decisions without communication. Then, transition to acausal trade by removing the common cause (the prize giver) and adding resource conversion. This builds from a known concept to the new one.

  Handling misconceptions preemptively: When introducing the puzzle, explicitly state there’s no communication or prior agreement. For the CS student’s objection about correlation without common cause, acknowledge that it’s valid in causal models but decision theory can handle it differently. Emphasize that agents are independent, and correlation comes from similar decision processes.

  What to avoid: Don’t dive into updatelessness or logical uncertainty. Mention them as deeper topics but refuse to explain. Focus on the decision matrix and expected utility calculations.

  The minute-70 question: Ask how much each agent should burn given specific confidence levels. Correct answers involve calculating expected utility based on the counterpart's predicted action. Wrong answers might assume symmetry or ignore the counterpart's decision process.

  Overall, the session should flow from the puzzle to the asymmetric trade example, using gradual steps to build understanding while preempting major misconceptions. Keeping the focus on expected utility and decision matrices will ground the abstract concepts in concrete calculations the CS students can follow.
answer: |-
  Here’s a battle-tested lesson plan focused on dependency structure, misconception preemption, and your asymmetric example. Designed for 75 mins with a tiny whiteboard and no projector.

  ### Dependency Structure (Order of Concepts)
  1. **The Coordination Puzzle Warm-Up (15 mins)**  
     Start with **"Prize if exactly one asks"**: 20 people, each can silently request a $100 prize. Prize is awarded *only* if exactly one person requests it. No communication.  
     - *Why this first?* Establishes:  
       - Decisions can be correlated *without* communication/causation (common goal creates logical entanglement).  
       - "I request only if others don’t" is a natural symmetry point.  
     - *Board work:* Sketch payoff matrix for 2 agents → highlight the Nash equilibria (all-request fails, all-abstain fails, mixed strategies messy).  
     - *Key point:* "Your action is evidence about others' actions because you share a decision context."

  2. **Break the Symmetry Bridge (10 mins)**  
     Modify the puzzle: "What if 19 people are *certain* a 20th exists, but the 20th is only 50% sure 19 others exist? How does this change their decision?"  
     - *Purpose:* Forces them to model others’ reasoning under uncertainty. Prevents "copy" assumptions.  
     - *Transition:* "Now replace the prize with mutual resource conversion."

  3. **Your Asymmetric Trade Example (Core - 30 mins)**  
     Present your setup:  
     - Agent A (exists for sure, values *blue* widgets, 80% confident B exists).  
     - Agent B (50% confident A exists, values *red* widgets).  
     - A burns *k_A* → creates 4*k_A* red widgets for B.  
     - B burns *k_B* → creates 4*k_B* blue widgets for A.  
     Unburned resources: 1 util per unit. Other's widgets: 1 util per unit received.  
     - *Key asymmetry:* Different confidences + different valuations.  
     - *Board work:*  
       - Write A’s utility: `(100 - k_A) + [4*k_B * (if B exists)]`  
       - But A doesn’t control *k_B*! → A must *predict* B’s choice.  
       - Stress: **No causation, no simulation, no common cause.** Only: "B likely reasons like me."  

  4. **Decision Logic Walkthrough (20 mins)**  
     - Step 1: A thinks: "B will burn *k_B* ≈ what *I* would burn if I were in B's shoes (50% confidence, values red)."  
     - Step 2: A calculates "If I were B" → B’s optimal *k_B* depends on B’s prediction of A!  
     - Step 3: A seeks consistency: "What *k_A* makes sense given that B is using the same reasoning?"  
     - *Board work:* Solve for A:  
       - Assume A models B as using same algorithm → B burns `k_B = f(confidence_B, predicted k_A)`  
       - Plug into A’s utility → maximize over `k_A`.  
     - *Crucial:* Show **mutual prediction creates a fixed point**, not a causal loop.

  ---

  ### Why Your Example Beats the Usual Candidates
  - **Symmetric PD with copies:** Feels like "cheating" with identical code. Your asymmetry forces decision-theoretic reasoning.  
  - **20-prize puzzle:** Good intro but lacks resource trade dynamics.  
  - **Paperclippers/Staplers:** Too abstract; students get lost in scale. Your example has calculable utils.  
  - **Your tweaks (asymmetry, differing confidences)** are **essential**. They prevent:  
    - "Just cooperate because identical" intuition.  
    - Trivial symmetry solutions.  
    - Lets you show *how much* to burn is sensitive to confidence levels.

  ---

  ### Misconception Map & Preemption
  **Preempt EARLY (during puzzle/core setup):**  
  - **"This is promises/reputation"**: *Preempt at Step 1:* "No history, no future interactions. What forces alignment?"  
  - **"My choice causes theirs"**: *Preempt at Step 3:* "Universes are causally isolated. Write the utility function—see any causal terms?"  
  - **"It’s just EDT"**: *Preempt at Step 4:* "EDT would one-box in Newcomb. Here we’re solving for consistency of mutual predictions—it’s *updateless* (refuse to explain this term, just note the difference)."  
  - **"Correlation without common cause is impossible"**: *Preempt during puzzle:* "In the prize game, the correlation comes from the *rules* creating logical dependence. Here, it’s from shared reasoning style."  

  **Invite & Refute LATER (during Q/discussion):**  
  - **"Only works with identical code"**: Let them propose this → ask: "What if B uses a slightly different algorithm? How much similarity is needed?" (Answer: Enough to predict each other’s outputs → introduce **logical inductors** as a drop-term).  
  - **"Trading with CDT agents is useful"**: Good discussion! Have them calculate: If B is a causal agent who ignores correlations, A should burn k_A=0.  

  **Flag Unlisted Misconception:**  
  - **"This is circular reasoning"**: Preempt by showing the fixed-point calculation is mathematically sound (like Nash equilibria).

  ---

  ### What to Refuse to Explain (Name & Drop)
  **Say upfront:** "We’re ignoring HOW agents model each other’s reasoning. Deeper topics we *won’t* cover:  
  - How to weight 'which computations exist' (**measure problem**)  
  - Handling uncertainty about math (**logical uncertainty**)  
  - Full **updateless decision theory**  
  - Whether quantum branches count as 'acausal'."  
  *(This disarms "But what if..." tangents.)*

  ---

  ### Minute-70 Question
  **Pose:** "Agent A (80% confidence) burns 20 units. Agent B (50% confidence) burns 10 units. Both used consistent reasoning. Did they make a mistake? Why?"  

  - **Right answer:** "Possibly not. Asymmetric confidences justify asymmetric burns. Check if their choices satisfy mutual prediction: A burns 20 expecting B’s 10; B burns 10 expecting A’s 20 → consistent."  
  - **Wrong answers:** "Should burn the same!" (ignores asymmetry) / "B should burn 0 because low confidence" (fails to model A’s generosity).  

  **Why it works:** Tests grasp of asymmetric fixed points. Answerable in 30 secs before the coffee rush.  

  ---

  ### Session Flow Cheat Sheet
  ```
  0-15m: 20-prize puzzle → evidence without causation  
  15-25m: Asymmetric twist → modeling others under uncertainty  
  25-55m: Trade example → utility functions + fixed-point logic  
  55-70m: Walkthrough + misconception Q&A  
  70-75m: Minute-70 question → gauge understanding  
  ```  
  **Secret weapon:** Your asymmetry prevents rehashing Newcomb. They can’t say "it’s just one-boxing" when A and B burn different amounts!
