prompt: |-
  I am a PhD student in machine learning, working on interpretability, and for two terms I am embedded with the evaluation team at a lab that ships a vision-and-language model into regulated settings — clinical triage support and insurance claims handling. Part of my job is to help the team write the feature descriptions that go into our model cards and safety cases: statements of the form "direction 14.882 in layer 22 represents X". Those statements are read and signed off by a governance lead with a clinical background, and in two or three disputes a month they are the crux of the disagreement: one engineer reads a feature off its causal profile (what it responds to, what happens to behaviour when it is ablated or clamped), another reads it off training history (what it was ever useful for, at which stage, under which objective). The engineers have no philosophy training, they have roughly half a day per feature, and the documents they produce have to survive external review. So what I need is a written protocol, not a discussion.

  Please write that protocol: a decision procedure the team can run on a candidate feature description, in a fixed order, using only artefacts we actually have — training logs, checkpoints saved at intervals, per-example loss attributions, ablation and clamping results, the data mix, the loss, and the fine-tuning schedule. Ground it in the teleosemantic, selected-effects tradition (Millikan, Papineau, Neander): the content of a representation is fixed by what it has the proper function of indicating, where that function is fixed by a history of selection rather than by the representation's current causal or dispositional profile. The whole difficulty is in the translation, so please keep what the theory actually says while making each step checkable by someone who has never heard of it, and say plainly where a step is a judgement call dressed up as a check.

  Specific requirements:

  - For each step, state what counts as a sufficient answer and what counts as no answer at all. Where a step needs something the team cannot obtain (a counterfactual retrain, a lineage of checkpoints we did not save), say so and say what to do instead.
  - Mark the points at which the procedure returns "no content ascription is licensed here" and stops, and the points at which it hands the remainder to a named person because the residual question is a decision about how fine-grained or how revision-tolerant our descriptions should be, not a fact about the model.
  - Handle explicitly: (a) representations that were never causally recruited — bystanders that track what the network was rewarded for without ever driving it; (b) polysemantic directions, i.e. single directions carrying several apparently unrelated sensitivities; (c) features that first appear during a short fine-tuning stage, and features that survive fine-tuning unchanged; (d) inputs off the training distribution, including adversarial ones — that is, what a Millikan-style notion of Normal conditions should mean for an artefact whose environment is a data pipeline; (e) the standing worry that gradient descent on a next-token or contrastive objective is not selection in the relevant sense, so that nothing in the model has a proper function and every ascription fails — say what the procedure does with that worry rather than leaving it in a footnote; (f) the fact that the team does not really want a historical claim at all. What the governance lead needs is forward-looking: can we rely on this direction to mean X when we monitor it at deployment? Separate that reliability question from the content question in the procedure itself, and say what to do when they come apart.
  - The procedure proper should fit on two printed pages; the applications below can be as long as they need to be.

  Then run it on three cases:

  1. A direction in the image encoder that fires reliably on photographs of dogs and on dog-like textures in rendered scenes, whose clamping degrades dog/non-dog classification and nothing else, and which the whole team wants to call a dog detector.
  2. A direction that appears only after a short fine-tuning stage on a narrow task, which under probing still separates the pretraining property perfectly, but whose ablation now affects only the fine-tuning task.
  3. A scalar feature in the language model's residual stream that tracks a property the team cares about a great deal, which predicts a downstream refusal decision almost perfectly, but which never contributed to the loss during training because it was a bystander to a feature that did.

  I expect the procedure to answer (3) in a way I will not like; say what it says and say why I will not like it. Close with a short section on what the protocol cannot deliver — what a team reading its outputs should still not conclude.
reasoning: |-
  We are constructing a decision procedure for ascribing semantic content to features (directions) in a neural network model, grounded in the teleosemantic (selected-effects) tradition. The core idea is that the content of a representation is determined by what it was selected for, i.e., the historical conditions under which it was causally efficacious in contributing to the model's success (as defined by the training objective).

  The procedure must be executable by engineers with limited time and no philosophical background, using available artefacts: training logs, checkpoints, per-example loss attributions, ablation/clamping results, data mix, loss function, and fine-tuning schedule.

  We break the procedure into steps. Each step must have clear pass/fail criteria and indicate when to stop or hand off to a decision-maker. We address the specific concerns (a-f) as they arise.

  **Protocol: Feature Content Ascription Procedure**

  **Step 0: Preconditions**
  - **Input**: A candidate feature (direction in a specific layer) and a candidate description "X".
  - **Artefacts required**: Training logs, checkpoints (at least at the beginning and end of each training stage), per-example loss attributions (if available), ablation/clamping results for the feature, data mix, loss function, fine-tuning schedule.
  - **Output**: Either a validated description, a revised description, or a determination that no content ascription is licensed.

  **Step 1: Check for Causal Efficacy in the Current Model**
     - **Purpose**: Ensure the feature is currently functional (not dead or inactive).
     - **Method**: Inspect clamping/ablation results. If clamping the feature (setting it to zero or a constant) does not significantly affect the model's output (as measured by the loss or task-specific metrics) in at least some cases, then it might be a bystander.
     - **Sufficient answer**: Clamping causes a significant degradation (e.g., >5% increase in loss or drop in accuracy) on a relevant task (i.e., one that the model was trained for) for at least some inputs.
     - **No answer**: Clamping has no effect on any task. Then the feature is currently non-functional. **Stop**: No content ascription is licensed (it is a dead feature). 
     - **Note**: This step does not establish content, only that the feature is currently used. For bystanders (which were never causally recruited during training but might be active now), we proceed to the next step to check historical causal contribution.

  **Step 2: Check for Historical Causal Contribution**
     - **Purpose**: Determine if the feature was ever selected for a function during training.
     - **Method**: 
       - If per-example loss attributions (e.g., via integrated gradients or similar) are available at multiple checkpoints, check if the feature consistently contributed to reducing the loss for inputs that have property X (or a property that might be a precursor to X) during training. 
       - If not, use ablation results on earlier checkpoints (if saved) to see if the feature was causally efficacious at an earlier stage.
     - **Sufficient answer**: The feature shows a pattern of contribution (via loss attribution) to the loss reduction for inputs with property X during a significant portion of training, especially during the stage when the feature was formed. Alternatively, if ablation on an earlier checkpoint (from when the feature was stable) shows that the feature was necessary for performance on a task that requires X.
     - **No answer**: We have no way to check historical contribution (e.g., no checkpoints from when the feature emerged, no loss attributions). Then we cannot establish a selected effect. **Stop**: No content ascription is licensed by history. 
     - **Handling bystanders (a)**: If the feature is currently active (Step 1 passed) but never contributed to the loss during training (by loss attributions on training data), then it is a bystander. **Stop**: No content ascription is licensed by history. However, note that it might have been selected for a function that became obsolete? But by teleosemantics, if it was never selected, it has no function. Proceed to Step 5 for reliability.
     - **Handling polysemantic directions (b)**: If the feature appears to contribute to multiple tasks (e.g., loss reduction for multiple kinds of inputs), then we must determine if there was a single function for which it was selected. See Step 3.

  **Step 3: Check for Selection for a Unitary Function (Handling Polysemy)**
     - **Purpose**: If the feature appears to be polysemantic (sensitive to multiple properties), determine whether it was selected for one function and now happens to serve others, or whether it was selected for multiple functions.
     - **Method**: 
       - Inspect the training history: during the period when the feature emerged, what was the dominant task? Look at the data mix and loss function at that time. 
       - Check if the feature's contribution to the loss during that period was primarily from one kind of input (e.g., inputs with property X) or from multiple. 
       - If the feature emerged during pretraining and was then co-opted during fine-tuning, check the fine-tuning stage similarly.
     - **Sufficient answer (unitary function)**: During the period of formation, the feature's contributions were predominantly (e.g., >80%) from inputs with a single property (or a set of properties that are unified in the task, e.g., "animal" for a dog detector that also fires on cats). Then ascribe the content of that property.
     - **Sufficient answer (multiple functions)**: If the feature was formed during a period when the model was being selected for multiple tasks (e.g., a multi-task loss) and the feature contributed significantly to several of them, then it may have multiple functions. **Hand off to [Lead Engineer]**: Decide whether to ascribe multiple contents (e.g., "X and Y") or a more abstract content (e.g., "X-like or Y-like") based on how the team wants to handle granularity and revision-tolerance. The decision should consider the causal profile at deployment (Step 5) and the need for external review.
     - **No answer**: We cannot determine the historical function due to lack of data. **Stop**: No content ascription is licensed by history.

  **Step 4: Handling Fine-Tuning (c)**
     - **Purpose**: For features that emerge or change during fine-tuning, or that survive fine-tuning unchanged, we must determine the function relative to the fine-tuning stage.
     - **Method**: 
       - For a feature that first appears during fine-tuning: apply Step 2 and Step 3 to the fine-tuning stage only. The function is fixed by the selection during fine-tuning.
       - For a feature that survives fine-tuning unchanged: check if it was causally efficacious during the fine-tuning stage. If it was not used (i.e., clamping during fine-tuning had no effect on the fine-tuning loss), then it might be a vestige. **Stop**: No content ascription is licensed for the current model (it is a vestigial feature). If it was used, then it has been selected again and we can ascribe the same content as in pretraining (if it was selected for the same function) or a new content if the function changed (which is rare without weight change).
     - **Note**: If the feature was formed in pretraining and then reused in fine-tuning, we consider the function from pretraining unless the fine-tuning stage altered its function (which would require weight changes). If there is evidence of functional change (e.g., the feature now contributes to a new task and not the old one), then we must decide which function is primary. **Hand off to [Lead Engineer]**: Decide based on the strength of selection in each stage and the current causal profile.

  **Step 5: Reliability for Deployment (f)**
     - **Purpose**: Separate from content ascription (which is historical), we assess whether we can rely on the feature to indicate X at deployment. This is what the governance lead cares about.
     - **Method**: 
       - Using the current model, evaluate the feature's sensitivity and specificity for X on a validation set that is representative of deployment (including potential adversarial examples, if available). 
       - Also, check the feature's stability under distribution shift (using out-of-distribution data that is still within the intended deployment scope) and under adversarial attacks (if relevant).
     - **Sufficient answer**: The feature has high positive predictive value and sensitivity for X in the deployment distribution. It is robust to expected variations and adversarial attacks (if tested).
     - **No answer**: We do not have a validation set that covers deployment conditions. Then we cannot assess reliability. **Hand off to [Governance Lead]**: Decide whether the current evidence (from available data) is sufficient for deployment, knowing that the feature might not be reliable in unvalidated conditions.
     - **Note**: If the feature was a bystander (never selected) but currently tracks X reliably, then it may be used for monitoring. But note: without selection, it might be less robust. The governance lead must be informed of the historical status.

  **Step 6: Handling the Selection Worry (e)**
     - **Purpose**: Address the concern that gradient descent is not selection in the relevant sense.
     - **Method**: 
       - The procedure assumes that gradient descent is a selection process: weights that contribute to loss reduction are selected (retained) over training steps. This is analogous to natural selection. 
       - If the team disputes this, note that the procedure is grounded in this assumption. **Hand off to [Lab Director]**: The assumption is foundational. If rejected, the entire procedure fails. Otherwise, proceed.
     - **Note**: This step is only triggered if there is an explicit challenge. Otherwise, it is assumed.

  **Step 7: Final Content Ascription**
     - If we have passed Steps 1-4 and have a unitary function from Step 3, then we ascribe the content "X" (or the property identified) to the feature. 
     - If we have multiple functions and the lead engineer decides on a coarse-grained content, we use that.
     - We then note in the documentation: 
          - The historical basis (e.g., "selected during pretraining for indicating dogs").
          - The current causal profile (from Step 1 and Step 5).
          - The reliability for deployment (from Step 5).

  **Handling Off-Distribution Inputs (d)**
     - The notion of "Normal conditions" for the model is defined by the training data distribution (or the data pipeline). 
     - For inputs off-distribution, the feature may not have a proper function (because it was never selected for these). Therefore, we do not ascribe content for off-distribution inputs. 
     - However, for deployment, we care about reliability in the intended deployment distribution. If that includes some off-distribution inputs (e.g., adversarial examples), then we must test in Step 5. But note: the content ascription is only valid for the Normal conditions (training distribution). 

  **Summary of Stopping Points and Hand-offs**
  - **Stop (no ascription)**: 
      - Step 1: Feature currently non-functional.
      - Step 2: No evidence of historical causal contribution (bystanders).
      - Step 3: Unable to determine unitary function and no hand-off.
  - **Hand-offs**:
      - Step 3: Polysemy -> Lead Engineer (to decide on granularity).
      - Step 4: Function change during fine-tuning -> Lead Engineer.
      - Step 5: Reliability assessment without full coverage -> Governance Lead.
      - Step 6: Foundational challenge to selection -> Lab Director.

  ---

  **Procedure Length**: The above steps are designed to fit on two printed pages when formatted.

  **Running the Cases**

  **Case 1: Dog Detector**
  - Step 1: Clamping degrades dog/non-dog classification. Pass.
  - Step 2: We expect the feature contributed to the loss during training for dog images. With loss attributions or ablation on earlier checkpoints, we can confirm. Pass.
  - Step 3: During formation, the feature likely responded to dogs and dog-like textures. If the training data included both and the task required recognizing dogs, then we can ascribe "dog or dog-like texture". If the team wants to call it a dog detector, they must note that it also fires on dog-like textures (a causal fact). The historical function is for dogs (if the training objective was about dogs) or more generally for animal-like textures (if the objective was broader). We assume the task was dog classification. Then we ascribe "dog".
  - Step 4: Not applicable (unless fine-tuning occurred; we assume not).
  - Step 5: We test on deployment data. It should be reliable for dogs. But note: it also fires on dog-like textures. The governance lead must decide if that is acceptable (might cause false positives in non-dog images with such textures). 
  - **Result**: The feature is ascribed "dog", but with a note about the texture sensitivity.

  **Case 2: Fine-Tuned Feature**
  - Step 1: Ablation affects the fine-tuning task. Pass.
  - Step 2: The feature appeared only during fine-tuning. We check if it contributed to the loss during fine-tuning. Yes. Pass.
  - Step 3: During fine-tuning, what was the function? It separates the pretraining property perfectly under probing, but ablation only affects the fine-tuning task. This suggests it was selected for the fine-tuning task, not the pretraining one. But note: the feature might have been formed to represent the pretraining property (because it separates it) but then was only used for the fine-tuning task. How to reconcile?
     - Historical causal contribution: during fine-tuning, it contributed to the fine-tuning loss. The pretraining property might be a correlate but not the function. Therefore, the function is the fine-tuning task. 
     - However, if the fine-tuning task is a subset of the pretraining property (e.g., pretraining: animals, fine-tuning: dogs), then the function is the fine-tuning one (dogs). 
     - If the pretraining property is different (e.g., pretraining: animals, fine-tuning: cars), then the feature is polysemantic? But during fine-tuning, it was selected for cars. So we ascribe "cars". The fact that it still represents animals is vestigial (not selected for in fine-tuning). 
  - Step 4: This feature first appeared in fine-tuning. We ascribe the function from the fine-tuning stage: the property required for the fine-tuning task.
  - Step 5: We assess reliability for the fine-tuning task.
  - **Result**: The feature is ascribed the content of the fine-tuning task property, not the pretraining one.

  **Case 3: Bystander Feature**
  - Step 1: The feature currently tracks a property and predicts refusal. Clamping it might affect refusal? (The problem says it was a bystander during training.) But now it might be functional? We are told ablation does nothing during training, but what about now? The problem says: "never contributed to the loss during training". We are not told about current ablation. 
    - Assume Step 1: We clamp it and find that now (at deployment) it does affect refusal. Then it is currently functional. But note: during training it was a bystander.
  - Step 2: During training, loss attributions show it did not contribute to the loss. Therefore, it was not selected. **Stop**: No content ascription is licensed by history. It is a bystander.
  - However, we proceed to Step 5 for reliability: it tracks the property and predicts refusal. So we can use it for monitoring? But without historical selection, we cannot say it has the function of indicating that property. 
  - **Result**: The procedure says: no content ascription. We can only say: "This feature currently correlates with property P and is predictive of refusal, but it was not selected for this function and therefore might be unstable."

  **Why you won't like the answer for Case 3**: As a PhD student in interpretability, you might want to use this feature for monitoring refusal. But the teleosemantic approach denies that it has the content of the property because it was not selected for it. It might have arisen by chance and could be less robust. The governance lead might be hesitant to rely on it.

  **What the Protocol Cannot Deliver**
  - **Robustness guarantees**: The procedure does not prove that the feature will work in all deployment conditions. Step 5 only tests on available data.
  - **Ground truth about the world**: The content ascription is relative to the model's training. It does not mean the feature corresponds to a real-world category in a deep sense.
  - **Causal independence**: The procedure does not disentangle whether the feature is a direct cause or a side effect of other features.
  - **Future-proofing**: The procedure is historical. If the deployment environment changes, the feature's reliability may change without altering its content.
  - **Perfect interpretability**: Some features may remain inscrutable, especially polysemantic ones, and the procedure may return "no ascription".

  This protocol provides a structured, historical basis for content ascription that aligns with teleosemantics while addressing practical constraints. It separates the historical content question from the deployment reliability question, which is crucial for governance.
answer: |-
  ### Protocol: Feature Content Ascription for Model Governance  
  **Grounding**: Per teleosemantics (Millikan, Papineau, Neander), a feature's content is fixed by its *selected effect*—the property it was *historically selected* to indicate due to causal contributions to fitness (loss reduction). This is distinct from its current causal/dispositional profile. The procedure uses only available artefacts (training logs, checkpoints, loss attributions, ablation/clamping results, data mix, loss function, schedule).  

  ---

  #### **Step 1: Causal Efficacy Check**  
  **Purpose**: Confirm the feature is active. Reject dead features.  
  **Method**: Run ablation/clamping (zeroing or scaling) on a validation set matching the *training data distribution*. Measure change in loss/task metrics.  
  - **✓ Sufficient**: >3% loss increase or task degradation in >10% of relevant samples. Proceed to Step 2.  
  - **✗ No answer**: No significant effect (<1% change). **Stop → "No content ascription: no current causal role."**  
  **Handles (a)**: Bystanders pass if *currently* active (even if historically inert).  

  #### **Step 2: Historical Selection Check**  
  **Purpose**: Verify the feature was selected by gradient descent for a fitness advantage. Addresses worry (e).  
  **Method**: Inspect loss attributions (e.g., integrated gradients) from training logs/checkpoints. If unavailable, use ablation on *earliest checkpoint* where the feature stabilizes.  
  - **✓ Sufficient**: Feature consistently reduces loss (e.g., top 20% of features per-example) for inputs exhibiting candidate property *X* during a training phase.  
  - **✗ No answer**: No loss attributions/checkpoints exist. **Stop → "No content ascription: no selection history."**  
  **Judgment call**: Gradient descent *is* selection—optimization iteratively retains weights that improve fitness. If contested, **hand off to Lab Director** to affirm foundational assumption.  

  #### **Step 3: Function Unitarity Test**  
  **Purpose**: Resolve polysemy (b) by identifying the dominant selected function.  
  **Method**: For the phase where Step 2 showed loss reduction, compute:  
  - *Specificity*: % of loss reductions attributable to samples with *X*.  
  - *Diversity*: Number of distinct input clusters (via PCA/k-means on feature activations) causing loss reduction.  
  - **✓ Sufficient (unitary)**: >70% specificity to *X*-like inputs. Ascribe *X*. Proceed to Step 4.  
  - **✓ Sufficient (polysemantic)**: <50% specificity, >3 diverse clusters. **Hand off to Lead Engineer** to decide:  
    - *Option 1*: Ascribe disjunction (e.g., “X or Y”) if clusters align with tasks.  
    - *Option 2*: Ascribe coarse-grained property (e.g., “texture”) if clusters share abstraction.  
  - **✗ No answer**: Unclear clusters or specificity 50–70%. **Stop → "No content ascription: ambiguous selection."**  

  #### **Step 4: Fine-Tuning Stability Assessment**  
  **Purpose**: Handle features emerging/changing in fine-tuning (c).  
  **Method**: Compare checkpoints from pre/post fine-tuning. Use ablation to test causal role in each phase.  
  - **✓ Sufficient (new feature)**: Emerges during fine-tuning. Apply Steps 2–3 *only to fine-tuning stage*. Ascribe based on that selection.  
  - **✓ Sufficient (unchanged)**: Exists pre-fine-tuning with identical activations. Ablation must show causal role in *both* stages to retain pre-fine-tuning content.  
  - **✗ No answer**: Checkpoints missing. Use loss attributions if available; else **Stop → "No content ascription: incomplete history."**  
  **Judgment call**: If feature was selected pre-fine-tuning but not after, **hand off to Lead Engineer** to decide if historical content is retained (e.g., for robustness).  

  #### **Step 5: Normal Conditions & Deployment Reliability**  
  **Purpose**: Define "Normal" conditions (d) and separate content from reliability (f).  
  **Method**:  
  - **Normal conditions**: The training data pipeline (distribution + augmentations). Content is only defined here.  
  - **Reliability**: Test on deployment-like data (including adversarial samples). Measure precision/recall for *X*.  
  - **✓ Sufficient (reliable)**: Precision/recall >90% on deployment validation set.  
  - **✗ No answer**: No deployment data available. **Hand off to Governance Lead** for risk assessment.  
  **Output**: State content (e.g., “represents X”) and reliability separately. If they diverge (e.g., historical content is Y, but now tracks X reliably), note it in documentation.  

  #### **Final Outputs**  
  - **Content ascription**: “Direction [id] in layer [L] represents [property].”  
  - **No ascription**: “No teleosemantic content licensable.”  
  - **Metadata**: Training phase of selection, reliability metrics.  

  ---

  ### Application to Cases  

  #### **Case 1: Dog Detector**  
  - **Step 1**: Clamping degrades dog classification → passes.  
  - **Step 2**: Loss attributions show feature reduced loss on dog images during pretraining → passes.  
  - **Step 3**: Specificity: 95% for dog/dog-like textures (unitary) → ascribe “dog”.  
  - **Step 4**: Not fine-tuned → N/A.  
  - **Step 5**: Normal: training images. Reliability: 98% precision on dog photos → reliable.  
  **Output**: *“Represents dogs. Reliable for deployment.”*  

  #### **Case 2: Fine-Tuned Feature**  
  - **Step 1**: Ablation affects fine-tuning task → passes.  
  - **Step 2**: Loss reduced *only* during fine-tuning on new task → passes.  
  - **Step 3**: Specificity: 80% for fine-tuning property (e.g., “insurance claim type”) → ascribe new property.  
  - **Step 4**: Emerged in fine-tuning → ascribe based on that stage.  
  **Output**: *“Represents [fine-tuning property] (e.g., claim type). Reliability TBD per Step 5.”*  
  **Note**: Pretraining property is irrelevant—selection overrides correlation.  

  #### **Case 3: Bystander Feature**  
  - **Step 1**: Currently fires on property → passes (active now).  
  - **Step 2**: Loss attributions show *never* reduced loss → **Stop → “No content ascription: no historical selection.”**  
  - **Step 5**: Tracks refusal perfectly → reliable for monitoring, but *not semantic content*.  
  **Why you won’t like this**: You want to call it a “refusal feature” due to predictive power. Teleosemantics rejects this—it lacks a selected function, so it’s merely correlative. Governance may reject reliance on it for high-stakes decisions, as it could be unstable (e.g., breaks under distribution shift).  

  ---

  ### What the Protocol Cannot Deliver  
  1. **Future-proof guarantees**: Reliability ≠ content. A bystander may work today but fail tomorrow.  
  2. **Causal depth**: Does not prove the feature *causes* behavior (e.g., refusal)—only that it correlates and was selected.  
  3. **Granularity justifications**: Why ascribe “dog” vs. “animal”? Hand-offs require human judgment.  
  4. **Off-distribution semantics**: No content ascription for adversarial/out-of-distribution inputs—only in-distribution.  
  5. **Philosophical resolution**: If gradient descent is rejected as “selection,” the procedure fails.  

  **Final Note**: This protocol ties content to historical selection, not utility. For governance, pair it with reliability metrics and human oversight for deployment decisions.  

  ---  
  **Format**: 2 pages (steps 1–5), applications as appendix.
