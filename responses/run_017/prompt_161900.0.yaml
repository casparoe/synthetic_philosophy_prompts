   4. Apply weights for vulnerable groups (if burden is on them) and check for individual burden caps.
   5. Calculate net benefit. If positive, and no individual exceeds the burden cap, then approve. Otherwise, reject or escalate.

   Value judgments that must be set by the panel and documented:
     - De minimis thresholds: 
          * Annual monetary: $5 per person per year?
          * Annual time: 5 minutes per person per year?
          * Per-incident time: 2 minutes (if no connection risk)?
          * Per-incident money: $0.05?
          * Risk: 1 in 1,000,000 per year?
     - Weights for vulnerable groups: 2x? (or more for extreme vulnerability)
     - Burden cap: e.g., no individual should bear more than $500 or 10 hours per year without explicit compensation.

   6. If the numbers are uncertain, run with low and high estimates.

