          We recommend setting the per-incident time threshold at 2 minutes for delays that are not expected to cause missed connections. But if the delay might cause missed connections (e.g., at a transfer point), then even 1 minute counts.

          Without that information, we must assume the worst or get more data.

   Given the importance of the thresholds, the panel must establish them in advance and document them.

   Final note: the procedure is a tool, but it cannot replace judgment. The panel must still consider qualitative factors and may escalate when the burden is severe on a few even if the aggregate net is positive.

   For the three cases:

     Case 1: Fare rounding. We count the burden as $2.7 million. The agency gains that amount. It is a transfer. We must see if the transfer is justified (e.g., the agency uses it for service improvements that benefit riders). If not, then it's a net burden to riders. We might reject unless offset.

