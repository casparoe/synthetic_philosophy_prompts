          Per-incident: $0.03 < $0.05? Then if we set the per-incident threshold at $0.05, then we ignore per incident. But then we must check cumulative: if the cumulative per person per year is below $5, then we ignore. 
          With 500 rides: $15 > $5 -> so we must count. 
          However, if we set the per-incident threshold at $0.05 and the cumulative threshold at $5, then we only count if the cumulative is above $5. So we count the $15 for that person? But note: the per incident is below the per-incident threshold, but the cumulative is above the annual threshold. So we count the full aggregate? Or only the part above the threshold?

          We propose: if the cumulative per person is above the annual threshold, then we count the entire cumulative burden for that person (not just the excess). Why? Because once it's noticeable, the entire amount matters.

          Alternatively, we could count only the excess above the threshold? That would be $10 for that person (above $5). But that might be too lenient.

          We think: count the full amount per person if the cumulative is above the annual threshold. Then aggregate across persons.

          So for a person with $15, we count $15. For a person with $4, we count $0. But we don't have the distribution. Without data, we must assume the worst-case or average.

          If we assume the average rider has 200 rides/year: $6 -> above $5, so we count the entire $6 per average rider. Then total burden = (number of riders) * $6.

          How many riders? If 90 million rides and 200 rides per rider, then 450,000 riders. Total burden = 450,000 * $6 = $2,700,000 (same as before).

          Without rider data, we can use the aggregate and then divide by the per-incident threshold: but that doesn't work. We need the distribution.

          Alternatively, we can use the total revenue: $2,700,000 and note that it is above the agency's de minimis (which is probably high) so we count.

          So Case 1: burden is $2.7 million.

   Case 2: Station consolidation.
          Burden: 24 minutes per trip. 
          Per-incident time: 24 minutes > 2 minutes -> we count (and no threshold discount).
          Also, cumulative per person: 292 hours per year -> way above 5 minutes per year, so we count.

          Then we proceed as before.

   Case 3: Scheduling change: 90 seconds per trip.
          Per-incident: 90 seconds = 1.5 minutes. 
          If we set the per-incident threshold at 2 minutes and assume no missed connections, then we set the burden to zero for every trip.
          Then the burden is zero, and the benefit to workers is $80,000. Net positive -> approve.

          But note: if we set the per-incident threshold at 1 minute, then 1.5>1 -> we count. Then the burden is $54 million -> reject.

