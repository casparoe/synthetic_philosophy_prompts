     Case 1: We must account for the rounding as a burden of $2.7 million. If the proposal doesn't use that revenue for a rider benefit that at least offsets, then we reject.

     Case 2: Approve if we can mitigate the impact on the 12 residents (e.g., provide alternative service). Otherwise, we might reject due to severity.

     Case 3: Reject because the time burden to riders is too large compared to the benefit to workers.

   This may be surprising: the dust specks (in Case 1 and Case 3) are not discounted and dominate. 

   We must be transparent that the procedure counts small burdens if they add up to a large aggregate and if they exceed the per-person annual de minimis. 

   The panel might decide to adjust the thresholds (e.g., set the annual de minimis at $20 and the per-incident time threshold at 5 minutes) to avoid this. But then we risk ignoring real burdens.

   Alternatively, we can use a different aggregation rule: only count burdens that exceed the per-person annual threshold, and then only the excess. That would reduce the burden in Case 1.

   For example, in Case 1: 
     Only the amount above $5 per person counts. So for a person with $15, we count $10. Then total burden = number of riders * (average burden above $5). 

     With 450,000 riders and an average burden of $6, then the excess per rider is $1. Total burden = 450,000 * $1 = $450,000.

     Then the burden is much smaller. But is this fair? The rider still loses $15, but we only count $10 as a burden? We think not. We think the entire burden should be counted once it crosses the threshold.

     But it's a matter of debate.

   Given the complexity and the need for simplicity, we stick to counting the entire burden once the cumulative per person is above the annual threshold.

   Therefore, the procedure as designed will often find that the dust specks matter a lot.
answer: |-
  ### Distributional Review Procedure for Transit Authority Proposals

  This procedure provides a structured, auditable framework for evaluating distributional impacts. It combines arithmetic aggregation with explicit value judgments, clearly flags where judgment is required, and escalates cases where arithmetic alone is insufficient. The goal is transparency, consistency, and defensibility.

  ---

  #### **Step 1: Define Units of Aggregation**
  - **Rule:**  
    - **Time burdens:** Aggregate as **person-minutes lost/gained** (per trip).  
      *Rationale: Time loss accumulates across trips and is recoverable for other uses.*  
    - **Monetary burdens:** Aggregate as **total dollars** (not per person).  
      *Rationale: Money is fungible; small amounts aggregate to meaningful sums.*  
    - **Risks/health burdens:** Aggregate as **expected cases** (e.g., cancer cases from exposure).  
  - **Why not per-person?**  
    Per-person aggregation hides systemic costs (e.g., 90 sec × 400k trips = 10k hours lost). Per-trip units capture total societal burden.

  ---

  #### **Step 2: Apply Noticeability Thresholds**  
  Handle trivial burdens ("dust specks") with explicit thresholds:  
  - **Threshold criteria** (value judgment; set by panel):  
    - **Time:** ≤ 1 minute/trip → **$0 value** (below human perception).  
    - **Money:** ≤ $0.05/trip → **$0 value** (below transaction cost/attention).  
    - **Health risk:** ≤ 1/1,000,000 lifetime risk → **$0 value** (regulatory de minimis).  
  - **Above threshold?** Use full expected value.  
  - **Concentration adjustment:**  
    - If burdens **repeat for the same people** (e.g., daily commuters), calculate **annual cumulative burden per person**:  
      - If cumulative burden > threshold (e.g., >$5/year), **count fully**.  
      - Else, **discount to $0**.  

  ---

  #### **Step 3: Compare Burdens and Benefits**  
  - **Calculate:**  
    - Total burden = Σ(Adjusted person-minutes × value of time) + Σ(Adjusted dollars) + Σ(Expected health cases × cost per case).  
    - Total benefit = Same method (e.g., time saved, revenue gained).  
  - **Value of time** (judgment): Use regional standard (e.g., $15–$25/hour). Document.  
  - **Severe burdens:** Apply **vulnerability multiplier** (judgment):  
    - Severe burdens (e.g., loss of essential service) on vulnerable groups (elderly, disabled, low-income) get a ×2–5 weight.  
  - **Expected vs. actual harm:**  
    - Policies imposing **probabilistic harm** (e.g., 1-in-a-million risk to 5M people = 5 expected cases) are evaluated on **expected value**.  
    - Document: *"This imposes an expected burden of [X] cases/dollars. Actual outcomes may vary."*  

  ---

  #### **Step 4: Handle Uncertainty & Missing Data**  
  - **Data quality tiers:**  
    - **High confidence:** Current, validated data → Use directly.  
    - **Low confidence:** Old surveys/estimates → Use **bounds** (low/high estimates).  
  - **Decision rule with bounds:**  
    - If net benefit ≥0 in **both** low and high estimates → Approve.  
    - If net burden ≥0 in **both** → Reject.  
    - If ambiguous → Escalate to board with sensitivity analysis.  

  ---

  #### **Step 5: Escalation Triggers**  
  Hand off to board if:  
  1. Severe burdens (e.g., loss of essential access) remain after weighting.  
  2. Net benefit is positive, but burdens are highly concentrated on vulnerable groups.  
  3. Uncertainty bounds yield conflicting conclusions.  

  ---

  ### **Application to Cases**  
  **Key judgments pre-set by panel** (document these upfront):  
  - Value of time: **$20/hour**.  
  - Vulnerability multiplier: **×3** for elderly/disabled.  
  - Noticeability thresholds: **1 min (time)**, **$0.05 (money)**, **1/1M (risk)**.  

  #### **Case 1: Fare-Rounding Overcharge**  
  - **Burden:** $0.03/ride × 90M rides/year = **$2.7M/year**.  
  - **Noticeability:** $0.03 < $0.05/trip → **$0/trip burden**.  
  - **Concentration:** Daily commuters (assume 10% of riders, 500 rides/year):  
    - $0.03 × 500 = **$15/year** → Exceeds $5/year threshold → **Count fully**.  
  - **Total burden:** **$2.7M/year**.  
  - **Benefit:** Agency gains $2.7M (transfer, not net benefit).  
  - **Net:** **$0** (transfer), but distributionally regressive.  
  - **Verdict:** ✅ **Approve** (burden trivial per trip, net neutral).  
  - **Value judgment:** Thresholds and concentration rule.  

  #### **Case 2: Station Consolidation**  
  - **Burden:** 12 elderly residents, +1.2 miles/trip.  
    - Time/trip: 1.2 miles ÷ 3 mph = **24 min × 2 trips/day × 365 days = 17,520 min/resident/year**.  
    - Value: (17,520 ÷ 60) × $20 = **$5,840/resident/year**.  
    - Vulnerability multiplier: ×3 → **$17,520/resident/year**.  
    - Total burden: 12 × $17,520 = **$210,240/year**.  
  - **Benefit:** Agency saves **$600,000/year**.  
  - **Net benefit:** $600,000 - $210,240 = **+$389,760/year**.  
  - **Escalation?** Severe burden on vulnerable group → **Escalate to board**.  
    - Document: *"Net positive but terminates essential service. Board must weigh equity vs efficiency."*  

  #### **Case 3: Scheduling Change**  
  - **Burden:** 90 sec/trip × 400k trips/day = 60k min/day.  
    - Annual: 60k min × 365 ÷ 60 = **365,000 hours/year**.  
    - Value: 365,000 × $20 = **$7.3M/year**.  
  - **Noticeability:** 90 sec = 1.5 min > 1 min → **Count fully**.  
  - **Benefit:** 8 workers off 2am shift.  
    - Quality-of-life improvement: Valued at **$10,000/worker/year** (judgment).  
    - Total benefit: 8 × $10,000 = **$80,000/year**.  
  - **Net burden:** $80,000 - $7,300,000 = **-$7.22M/year**.  
  - **Verdict:** ❌ **Reject** (large net burden).  
  - **Value judgment:** Time threshold and worker benefit valuation.  

  ---

  ### **Key Takeaways**  
  1. **Dust specks matter:** Small burdens aggregate to large sums (e.g., fare rounding is $2.7M).  
  2. **Judgments are explicit:** Noticeability thresholds, vulnerability weights, and value of time are value choices—**document them transparently**.  
  3. **Escalate equity dilemmas:** When severe burdens hit vulnerable groups (Case 2), arithmetic alone is insufficient.  
  4. **Procedure outputs:**  
     - Case 1: Approve (neutral).  
     - Case 2: Escalate to board (equity concerns).  
     - Case 3: Reject (large net burden).  

  This forces hard choices but prevents deadlocks by separating arithmetic from values. Publish thresholds and weights annually to preempt criticism.
