  The audience composition is crucial here. The committee includes an experimental philosopher focused on methodology, a cultural psychologist skeptical of novelty, a robust realist metaethicist dismissive of empirical relevance, a political philosopher wary of objectivity claims, and potentially an anthropologist criticizing vignette validity. The user wants realistic, biting objections phrased as each member would actually speak, plus strategic responses.

  Hmm, the user's explicit requests are clear: a prep sheet with specific sections (objection order, detailed objections with responses, concessions, key reply, feared question). But reading between the lines, they're likely stressed about high-stakes performance anxiety—this job talk could define their career trajectory. They're not just asking for content but for tactical advantage: knowing when to hold firm versus concede gracefully. The phrase "tell me plainly where to hold/fold" suggests they value intellectual honesty over defensiveness.

  For the objection sequencing, I'll predict the cultural psychologist (Dr. Singh) will strike first on novelty—it's a natural opener. The experimental philosopher (Dr. Evans) will jump in next with methodological quibbles, inviting the metaethicist (Prof. Vance) to escalate to metaphysical objections. The political philosopher (Dr. Adebayo) will anchor mid-session with ideology concerns, while the anthropologist's vignette critique will linger as a recurring theme. Interruptions are likely between Evans/Singh (method wars) and Vance/Adebayo (ideology clash).

  For the objections themselves, I'll prioritize lethality: Vance's constitutive argument could outright dismiss the project, so it tops the list. Adebayo's laundering charge and Singh's novelty challenge follow for credibility damage. Evans' multiverse demand threatens claim (1), while the anthropologist undermines claim (2)'s foundation. The weight-vs-content reliability issue must be addressed but can be contained with transparency. Each response should grant what's fair (e.g., to Vance: "You're right that metaphysics isn't empirical") while pivoting to the limited but valid scope (e.g., "But if realism requires trackable disagreement patterns, here's why welfare items satisfy that").

  The concession section should proactively disarm Vance and Adebayo—admitting the empirical/metaphysical gap and liberal bias risk builds trust. The "must-land" reply is defending the coding validity for claim (2): if weight divergence isn't credible, the domain-restriction thesis collapses. I'll advise leading with inter-rater stats while emphasizing conceptual safeguards.

  The nightmare question—whether domain-restricted objectivity still counts as realism—is philosophically deep. I'll suggest framing it as a moderate position: "It's not robust realism but more than constructivism, and here's why that matters."

  Throughout, I'll maintain the user's coined "partitioned realism" term despite its flaws (land ownership jokes!), as switching names last-minute risks confusion. The tone should be professional but sharp—these are smart critics who'll smell hedging.
answer: |-
  Here’s your Q&A battle plan, tailored to that room. I’ll be blunt about weaknesses and concessions.

  **1. Who Objects First & Order (~150 words):**
  Expect **Dr. Singh (Cultural Psychologist)** to jump first: She’ll challenge novelty/contribution ("This just repackages MFT?"), setting the tone. **Dr. Evans (Experimental Philosopher)** will immediately follow or interrupt Singh, drilling into methods ("Why no multiverse analysis?"). **Prof. Vance (Robust Realist)** will likely interject here, siding *with Evans* against empirical relevance ("Even *if* your stats are perfect, what does this prove *metaphysically*?"). After this initial flurry, **Dr. Adebayo (Political Philosopher)** will deliver a slower, pointed critique about objectivity laundering liberalism. The **Anthropologist** (if present) will weave in throughout, especially during Singh’s or Evans’ lines, muttering about vignette artificiality ("How does this capture *actual* thick concepts?"). Vance might jump back in late to reiterate the constitutive point. Singh and Evans may briefly spar over MFT vs. your operationalizations.

  **2. The Objections & Your Answers (~700 words):**  
  *(Ordered by Potential Damage)*

  1.  **Prof. Vance (Robust Realist):** "Your empirical findings about *variation* simply cannot bear on the *constitutive question* of whether moral facts exist. You’re conflating descriptive patterns with metaphysical foundations."  
      *   **Why it bites:** Directly challenges the chapter's core philosophical ambition. If conceded, the project crumbles.  
      *   **Answer (90s):** "You're absolutely right that descriptive patterns don't *directly* settle constitutive metaphysics. My claim is more modest: *if* robust realism requires widespread, trackable convergence in judgment under relevant conditions (as many realists argue), then the *asymmetry* in convergence patterns I document creates a problem. Welfare items *approach* that standard cross-culturally; communal items demonstrably do not. This doesn't *disprove* realism metaphysically, but it challenges a common *motivation* for it – uniform objectivity – and suggests *where* realist arguments face their steepest empirical hurdle."  
      *   **Weakness:** Leaves Vance unconvinced metaphysically; relies on burden-shifting to realists. He’ll likely retort: "Motivations aren't arguments." *Hold firm on the asymmetry challenge.*

  2.  **Dr. Adebayo (Political Philosopher):** "Labeling welfare judgments 'objective' feels suspiciously like using metaphysics to canonize precisely those liberal, individualistic intuitions dominant in WEIRD societies, dismissing communal values as merely 'constructed' and thus less authoritative. Isn't this just philosophical imperialism?"  
      *   **Why it bites:** Accuses your metaethical conclusion of being politically loaded and culturally biased, undermining its legitimacy.  
      *   **Answer (90s):** "That's a crucial concern. My claim isn't that welfare values are *correct* and communal ones *wrong*, nor that objectivity implies universal *authority*. It's about the *structure* of disagreement. The data suggests welfare disagreements are largely about *application* ('how much?', 'when?') against a shared feature-set, which is compatible with tracking objective features. Communal disagreements more often involve *which features matter fundamentally*. This doesn't devalue communal concepts within their contexts; it describes a difference in *how* those concepts function cross-culturally. Objectivity here is about pattern stability, not moral superiority."  
      *   **Weakness:** Doesn't fully dispel the worry that "objectivity" language smuggles in normative privilege. *Concede the risk; reframe objectivity as descriptive of disagreement patterns.*

  3.  **Dr. Singh (Cultural Psychologist):** "This looks like Moral Foundations Theory warmed over. You have asymmetry, you split welfare/communal... What's genuinely *new* here? Why should psychologists care about the 'metaethically load-bearing' bit?"  
      *   **Why it bites:** Questions novelty and interdisciplinary relevance.  
      *   **Answer (90s):** "Three key novelties: 1) **Weight vs. Content:** MFT posits distinct *foundations*. My data suggests disagreements are often about the *weight* of shared features (like physical harm, betrayal) within scenarios, not entirely different foundational concerns. 2) **Asymmetry Control:** I explicitly control for methodological artifacts (translation/experimenter effects) to show the asymmetry isn't just noise. 3) **Metaethical Stakes:** The *philosophical* novelty is using this structured variation to argue *against* uniform objectivity/realism and *for* a domain-specific view. Psychologists should care because it refines the *interpretation* of cross-cultural differences and connects them to debates about moral truth."  
      *   **Weakness:** "Weight vs. Content" is your most vulnerable empirical claim. *Acknowledge it's a key contribution & distinction; pivot to its implications.*

  4.  **Dr. Evans (Experimental Philosopher):** "You report an asymmetry effect size, but without preregistration or a multiverse analysis showing robustness across reasonable analytical choices, how confident can we be this isn't a garden of forking paths artifact?"  
      *   **Why it bites:** Undermines the empirical foundation of Claim (1).  
      *   **Answer (90s):** "Fair point. While the core analysis was planned, it wasn't formally preregistered. However, the effect is large and consistent across multiple operationalizations of 'welfare' vs. 'communal' items and across different cultural groupings. I conducted targeted sensitivity analyses [*Briefly mention 1-2, e.g., different clustering, alternative item groupings*] which held the asymmetry. A full multiverse would be valuable future work, but the consistency and size of the effect here give strong initial confidence."  
      *   **Weakness:** Lack of prereg/multiverse is a real vulnerability. *Concede it's a limitation; emphasize effect size/consistency.*

  5.  **Anthropologist (Audience):** "Your vignettes depict artificial scenarios involving strangers. Thick moral concepts (like specific purity or loyalty obligations) are deeply embedded in lived relationships, rituals, and histories. How can this method possibly capture *real* moral reasoning in *any* culture, including yours?"  
      *   **Why it bites:** Challenges external validity, potentially invalidating the entire data set for Claims 1 & 2.  
      *   **Answer (90s):** "This is a fundamental challenge to experimental methods. You're right that vignettes simplify and decontextualize. My aim isn't to capture the full richness of *in-situ* thick concept application, but to probe *recognition* of core features *as morally relevant* in controlled scenarios. The cross-cultural variation *in these responses* is still a real phenomenon needing explanation. I triangulate with qualitative work on moral disagreement where possible [*Mention briefly if you have any*], showing similar patterns. It's a trade-off: vignettes sacrifice depth for comparative control."  
      *   **Weakness:** Doesn't fully resolve the tension; anthropologist remains skeptical. *Concede the limitation; argue the value of the controlled comparison.*

  6.  **Dr. Evans / Dr. Singh (Follow-up):** "Your key Claim 2 distinction – weight divergence vs. content divergence – relies on RA coding. 'Okay, not great' inter-rater reliability is worrying. How did you mitigate this? Can we trust this central claim?"  
      *   **Why it bites:** Strikes at the heart of your most original but methodologically weakest claim.  
      *   **Answer (90s):** "Critical point. We achieved Cohen's Kappa of [X] – acceptable but not excellent. Mitigations: 1) **Clear Codebook:** Extensive training with anchor examples. 2) **Adjudication:** Disagreements resolved by me, applying the codebook strictly. 3) **Conservatism:** Ambiguous cases were coded as 'content divergence' to avoid inflating weight divergence findings. While reliability could be improved (e.g., more raters, iterative training), the adjudication process ensured internal consistency for the final dataset. The *pattern* of weight divergence dominating emerged strongly despite this noise."  
      *   **Weakness:** "Acceptable" Kappa isn't ideal for such a pivotal claim. *Concede the limitation; emphasize conservative coding/adjudication.*

  7.  **Prof. Vance (Robust Realist - Follow-up):** "Even granting your asymmetry, why think *either* domain tracks mind-independent facts? Maybe the apparent 'objectivity' of welfare is just a particularly stable form of construction or projection?"  
      *   **Why it bites:** Pushes back on your positive claim for welfare objectivity.  
      *   **Answer (90s):** "That's a coherent alternative. My argument is *comparative* and *parsimonious*. The *pattern* of welfare disagreement – focused on thresholds and weights of shared features – closely mirrors disagreement patterns about paradigmatically objective domains (e.g., basic physical facts). Communal disagreement, involving fundamental feature divergence, mirrors domains where constructivism seems more plausible (e.g., etiquette). While I don't *prove* realism for welfare, the data makes realism a *better fit* there than for the communal domain, and a better fit for welfare than a uniform constructivism across *all* domains."  
      *   **Weakness:** Remains an inference to the best explanation, not proof. *Hold firm on the comparative argument.*

  **3. What to Concede Before Anyone Asks (~120 words):**

  *   **To Vance:** "To be clear, my empirical findings don't *directly* settle the constitutive metaphysical question of whether moral facts exist simpliciter. I'm arguing they challenge motivations for *uniform* realism and constrain viable *forms* of realism."
  *   **To Evans:** "You're right that the lack of formal preregistration and a full multiverse analysis is a limitation. Future work needs to solidify this."
  *   **To Adebayo:** "The language of 'objectivity' carries normative baggage I need to be careful of. My claim is about *patterns of disagreement*, not inherent moral superiority. I'm not dismissing the validity of communal values within their contexts."
  *   **To All:** "The coding for Claim 2, while carefully adjudicated, had only acceptable inter-rater reliability. This warrants caution and further validation."

  **4. The One Reply That Has to Land (~150 words):**

  **The Reply (When defending Claim 2 vs. Content Divergence):** "The distinction isn't arbitrary. We coded 'weight divergence' *only* when raters agreed participants across groups were invoking the *same core feature* (e.g., 'physical harm occurred', 'a promise was broken') but disagreed on its *significance* or *sufficiency* for wrongness. 'Content divergence' was coded when groups invoked *fundamentally different justifying features* (e.g., one group cites harm, another cites impurity, for the *same* action). The adjudicated data shows weight divergence is the dominant pattern *specifically* for welfare items across cultures. *This* is what allows the asymmetry finding to bear metaethical weight – it shows *how* the disagreement differs, not just *that* it differs. If this coding fails, the core argument for domain-restriction fails." **If this doesn't land, the chapter's central innovation collapses.**

  **5. The Question I'm Hoping Nobody Asks (~150 words):**

  **The Question:** "If 'objectivity' in the welfare domain just means 'widespread agreement on relevant features but disagreement on thresholds/weights', how is this significantly different from a sophisticated *constructivist* or *relativist* account? Doesn't this just show that welfare norms are *very stably constructed*, not that they track mind-independent facts? And if so, does 'partitioned realism' actually offer *realism* anywhere, or just varying degrees of construction?"

  *   **Why it's a nightmare:** It forces you to defend the *metaphysical* substance of your "realism-lite" in the welfare domain against a deflationary reading. It questions whether your view genuinely carves out space for realism at all. Your answer will sound like stipulation or special pleading to Vance, and Adebayo will pounce on the potential instability of "stable construction."
  *   **Your Best Shot:** "It's a spectrum. On one end, robust realism posits strong mind-independence. On the other, radical constructivism denies any stable constraints. My claim is that the welfare data pushes us towards the realist *end* of that spectrum *relative* to communal data. The stability, feature-focus, and pattern of welfare disagreement are *best explained* by positing response-dependent facts grounded in shared, biologically constrained features of vulnerability and cooperation – a form of *moderate* realism. It's not full-blown robust realism, but it's significantly more than constructivism across the board."

  **Final Advice:** Stay calm. Explicitly thank questioners for pinpointing vulnerabilities (it shows confidence). For Vance & Adebayo, concede the deep philosophical challenges upfront to build credibility, then pivot to your empirical contribution and its *constraining* role. For Evans & Singh, focus on data robustness and contribution clarity. Rehearse the "must-land" reply and the nightmare question answer until they’re instinctive. Good luck! This is tough but doable.
