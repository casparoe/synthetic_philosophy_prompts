  ## The Pasadena Game, Rearranged

  Heads on the first flip, we begin,  
  The pot at two, by one to win.  
  With chance one half, the term is spun:  
  What is owed to me: the first one.  

  Three tails, then heads, the fourth time,  
  The pot at sixteen, by four, a debt.  
  The chance one sixteenth, in its prime:  
  What I owe: a quarter, set.  

  A tail, then heads, the second try,  
  The pot now four, by two, a loss.  
  With chance one fourth, the fractions vie:  
  What I owe: half, across the toss.  

  Five tails, then heads, the fifth spin,  
  The pot at thirty-two, by five, a plus.  
  The chance one thirty-second, thin:  
  What is owed to me: a fifth, and thus.  

  Two tails, then heads, the third draw,  
  The pot at eight, by three, a gain.  
  The chance one eighth, without a flaw:  
  What is owed to me: a third, again.  

  Seven tails, then heads, the eighth throw,  
  The pot at two fifty-six, by eight, a cost.  
  The chance one two fifty-sixth, we know:  
  What I owe: an eighth, not lost.  

  Six tails, then heads, the seventh cast,  
  The pot at one twenty-eight, by seven, a boon.  
  The chance one one twenty-eighth, vast:  
  What is owed to me: a seventh, soon.  

  Four tails, then heads, the sixth round,  
  The pot at sixty-four, by six, a fee.  
  The chance one sixty-fourth, unbound:  
  What I owe: a sixth, you see.  

  The sum? Undefined, the theory's demand,  
  But ordered by the flip: sixty-nine cents in hand.  

  ---

  ### Notes  
  - **Structure**: Eight quatrains in loose iambic tetrameter, each syntactically independent. Any permutation preserves grammaticality.  
  - **Refrain**: Alternates between "What is owed to me" (positive terms, odd flip counts) and "What I owe" (negative terms, even flip counts), embodying the sign alternation structurally.  
  - **Mathematical Fidelity**:  
    - Each stanza corresponds to a term in the Pasadena game: payoff = (-1)^{n+1} · 2^n / n for first head on flip *n*.  
    - Probability = (1/2)^n → term contribution = [payoff] × [probability] = (-1)^{n+1} / n.  
    - Natural ordering sums to ln(2) ≈ $0.69.  
  - **Ambiguity**:  
    - The closing couplet juxtaposes "undefined" (Lebesgue integral requires absolute convergence) with "sixty-nine cents" (natural ordering).  
    - Permuting stanzas simulates rearrangement of series terms (which can yield any real number or diverge), making the couplet's verdict feel contingent on arrangement.  
  - **Movable Stanzas**: Rearrangement allows readers to "license" different interpretations—e.g., placing positive terms first suggests divergence to +∞, while alternating stanzas stabilizes near ln(2).  

  Both decision-theory camps (natural order privileged vs. no privileged order) hear their stance echoed in the tension between stanzas and couplet.
