  ### Instructor Notes  
  **Why This Works:**  
  - **Bureaucratic Absurdity:** The Bureau’s "success" is revealed through layered attrition masking circularity (e.g., excluding those who "misconstrue" morality by using local idioms).  
  - **Real Methods Exaggerated:** Comprehension checks → cultural litmus tests; rewording → pathologizing variance; downweighting → silencing dissent. The CDR annex formalizes WEIRD-centrism as "calibration."  
  - **Discovery via Exclusion:** The Cohort of Last Resort’s identity is buried in Section 3’s metadata (staff/students/kin). The "objective fact" is tautological and hedged ("in ordinary circumstances... cannot reasonably be described as...").  
  - **Satirical Jabs:**  
    - Officer Ghorbani’s interrupted objection ("Isn’t this just—") being administratively silenced.  
    - The trivial proposition declared a landmark "stable fact."  
    - CDR mathematically discounting non-WEIRD voices as "noise."  
  - **Specialist Accuracy:** Mirrors real practices: pathologizing cultural differences as "comprehension failure," reframing low variance as "robustness," and masking homogeneity as rigor.  

  **Teaching Use:**  
  Hand this out cold. Ask students: *"What did the Bureau discover, and who did they discover it about?"* Let them spot:  
  1. The circular winnowing (final cohort = researchers themselves).  
  2. The emptiness of the "objective fact."  
  3. How real methodological choices (e.g., excluding "incomprehensible" responses) can quietly exclude cultures.  
  The "Target" line ensures clarity during discussion.
