prompt: |-
  hey — sorry this is long, but the details matter for what I need back.

  I run the pricing-agent group at a B2B marketplace. About forty rounds a year we're matched with one counterparty we'll probably never deal with again, and the choice each round is basically a one-shot prisoner's dilemma: we either quote honestly (call it C) or shade the bid and claw the difference back later in change orders (call it D). Roughly: both C ≈ €400k margin each; us D against their C ≈ €700k for us and near zero for them; both D ≈ €120k each. The exchange publishes aggregate cooperation stats once a year, which is nowhere near fast enough to make reputation do any work.

  The setup that makes this interesting: for audit reasons the exchange makes both sides commit their agent's source (hash only) 24 hours before a round, and at execution each agent is handed the other side's full source. Sealed deterministic sandbox, no network, no self-modifying code, fixed step budget — theirs is 10^9 steps, ours is 10^8 because we're stuck on a cheap VM. Out-of-band contact between counterparties is a rules violation, and that's started to bite, because some of the tricks for getting to mutual C look an awful lot like signalling. There's also a non-binding free-text "intent note" field on the submission form; my read is that conditioning on it is out-of-band, legal agrees, but you'll see why I mention it.

  So our agent is a program that takes their source as input and returns C or D. We rewrite and re-certify it about once a quarter. I have two analysts who are good engineers but not logicians, and every version has to be signed off in writing by a compliance officer who does not read code. Budget is about four hours of analyst time per certification. Nobody on my team has read any of the literature on this (I think it's called program equilibrium?) so explain what you use, and please skip citations and reading lists entirely — nobody here is going to read papers.

  What I want is a certification procedure, not an essay: the gates we run a candidate policy through, in order, what counts as a sufficient answer at each gate, where the procedure just stops with "no — ship the default-to-D policy instead", and where it hands the question to me or to compliance because it's actually a values call wearing a technical hat. Be honest about which gates are judgement in disguise; don't pretend they're mechanical.

  Then run it on three candidates:

  1. Mirror-match: return C iff their source is identical to ours after stripping whitespace and renaming variables, else D.
  2. A proof-search handshake: return C iff, within our step budget, we find a proof in a fixed formal system that their program returns C against ours, else D. Assume their version of this uses the same system but the full 10^9 budget.
  3. The simulation-based thing a vendor sold us: return C iff, when we run their program on a copy of our own program, it outputs C, with a loop-detection cutoff that defaults to D — and it also reads the intent-note field as a tiebreaker.

  Sections, in this order and roughly these lengths:

  - "The procedure" — ~900 words, the ordered gates, with pass criteria and stop points.
  - "Why each gate is there" — ~250 words, one or two plain-language lines per gate tying it to the theory, for the compliance write-up.
  - "Three runs" — ~700 words, the candidates above; I'd rather you tell me one of them fails in a way that costs us money than tell me all three are fine.
  - "What it can't tell you" — ~250 words, the cases where no amount of checking will settle it (opaque or obfuscated counterparts, counterparties who know our procedure and write against it, anything beyond two players and a binary choice).
  - "My call" — ~150 words, the specific numbers or risk appetites I have to set myself before any of this runs, stated as numbers with a default.
reasoning: |-
  We are designing a certification procedure for a prisoner's dilemma agent in a B2B marketplace setting. The procedure must be robust, efficient, and understandable by non-experts (analysts and compliance officers). The goal is to ensure that the agent we deploy is likely to achieve mutual cooperation (C) when possible, without violating rules or taking excessive risks.

  ### The Procedure (Gates)

  **Gate 0: Pre-Screen for Syntax and Safety**
  - **What we do:** Check that the candidate policy compiles and runs within the step budget (10^8 steps) on a set of test inputs (including known programs: always-C, always-D, tit-for-tat, etc.). Also, verify that it only outputs C or D and does not crash or exceed step limits on these tests.
  - **Pass criteria:** The agent passes all tests without crashing, exceeding steps, or outputting invalid values. The test set must include at least 10 programs (provided by us) that cover basic strategies.
  - **Stop point:** If it fails any test, stop and reject the candidate. Return to the analysts with the failing test case.

  **Gate 1: No Out-of-Band Signaling**
  - **What we do:** Check that the agent does not attempt to use any communication channel beyond the provided input (the counterparty's source code). Specifically, it must not read or write to any external storage, network, or use the "intent note" field (unless the candidate explicitly claims to use it and we have a compliance waiver). Also, check that it doesn't try to modify its own code or the environment.
  - **Pass criteria:** The agent does not contain any code that accesses prohibited resources (as defined by the exchange rules). This is done by static code analysis (by the analysts) and by running the agent in a sandbox that monitors for such attempts (using a predefined set of forbidden system calls or operations).
  - **Stop point:** If the agent uses any prohibited channel (including the intent note without explicit compliance approval), stop and reject. If it uses the intent note and we have a compliance waiver, note it and proceed.

  **Gate 2: Mutual Cooperation Potential (MCP)**
  - **What we do:** Test the candidate against a set of counterparty programs that are designed to cooperate with honest agents. Specifically, we require that the candidate cooperates (returns C) when facing itself (i.e., the same program) and when facing a known cooperator (like an always-C agent). We also test against a set of "friendly" agents (e.g., tit-for-tat, mirroring agents) that are known to cooperate under reciprocal conditions.
  - **Pass criteria:** The candidate must return C when run against:
    (a) Its own source code (exact copy).
    (b) An always-C agent (a program that always returns C).
    (c) A set of at least 3 other "friendly" agents (provided by us, e.g., a tit-for-tat agent, a mirror agent, etc.).
  - **Stop point:** If it fails to return C in any of these cases, stop and reject. This ensures that the candidate can achieve mutual cooperation in the best-case scenarios.

  **Gate 3: Defection Against Known Defectors**
  - **What we do:** Test the candidate against known defectors (programs that always defect, or that defect against our candidate). We require that the candidate defects (returns D) when facing an always-D agent and when facing a program that is known to defect against our candidate (e.g., a program that defects if it can prove our candidate will cooperate, but otherwise cooperates).
  - **Pass criteria:** The candidate must return D when run against:
    (a) An always-D agent (a program that always returns D).
    (b) A set of at least 3 "adversarial" agents (provided by us, e.g., an agent that defects if the opponent is not identical to itself, an agent that uses a proof to defect when safe, etc.).
  - **Stop point:** If it returns C against any of these, stop and reject. This ensures the candidate is not exploitable.

  **Gate 4: Robustness to Obfuscation and Variation**
  - **What we do:** Test the candidate against obfuscated versions of friendly and adversarial agents. We generate these by applying semantics-preserving transformations (e.g., variable renaming, dead code insertion, loop unrolling) to the agents used in Gates 2 and 3. We also test against a set of programs that are functionally equivalent to the candidate but have different source code (to check for over-reliance on syntactic identity).
  - **Pass criteria:** The candidate must still return C against obfuscated versions of the friendly agents (from Gate 2) and D against obfuscated versions of the adversarial agents (from Gate 3). We require that at least 5 obfuscated variants per agent are tested.
  - **Stop point:** If the candidate fails (i.e., returns D against an obfuscated friendly or C against an obfuscated adversary) in more than 10% of the test cases, stop and reject. This ensures that the candidate is not brittle to trivial changes in the opponent's code.

  **Gate 5: Performance and Step Budget**
  - **What we do:** Run the candidate against a set of complex agents (including itself, always-C, always-D, and the agents from Gates 2 and 3) and measure the step count. Also, run it against a set of "hard" programs (e.g., those that simulate the candidate) to ensure it doesn't exceed the step budget (10^8 steps) in any test case.
  - **Pass criteria:** The candidate must complete within 10^8 steps in every test case (we use a set of 20 test cases, including the worst-case scenarios we can construct). We also require that the candidate does not have a pathological case (e.g., an infinite loop) that would cause it to time out.
  - **Stop point:** If it exceeds the step budget in any test case, stop and reject.

  **Gate 6: Compliance Review**
  - **What we do:** Present the candidate policy and the test results (from Gates 0-5) to the compliance officer. The officer must sign off that the policy does not violate exchange rules (e.g., no out-of-band communication) and that the use of the intent note (if any) is acceptable.
  - **Pass criteria:** Compliance officer signs off.
  - **Stop point:** If compliance does not sign off, reject.

  **Gate 7: Risk Assessment (Your Call)**
  - **What we do:** Estimate the expected margin of the candidate policy against the population of counterparties. We use historical data or a model of the counterparty population (provided by you) to simulate the candidate's performance. We also compare it to the default (always-D) policy and a known good policy (if available).
  - **Pass criteria:** The candidate must have an expected margin that is at least as high as the default (always-D) policy (which yields €120k when both defect) and ideally higher. We require that the candidate does not have a negative expected value (i.e., it should not be worse than always-D). Specifically, we set a threshold: the candidate must achieve an expected margin of at least €X (you set X, default €180k) in our simulation.
  - **Stop point:** If the expected margin is below the threshold, reject. Otherwise, approve.

  ### Why Each Gate Is There
  - **Gate 0:** Ensures the agent is technically sound and safe to run.
  - **Gate 1:** Prevents rules violations that could lead to penalties.
  - **Gate 2:** Ensures the agent can achieve mutual cooperation when facing cooperative or reciprocal strategies, which is the goal.
  - **Gate 3:** Protects against exploitation by known defectors, ensuring we don't lose money unnecessarily.
  - **Gate 4:** Guards against brittle checks (like exact code matching) that break with minor code changes, which are common.
  - **Gate 5:** Avoids timing out and defaulting to D (or crashing) during execution, which would hurt performance.
  - **Gate 6:** Formal approval that the agent meets legal and regulatory requirements.
  - **Gate 7:** Quantifies the business impact and ensures the agent is better than the baseline (always-D).

  ### Three Runs

  **Candidate 1: Mirror-match**
  - **Gate 0:** Passes (it's a simple string comparison and then outputs C or D).
  - **Gate 1:** Passes (no out-of-band, doesn't use intent note).
  - **Gate 2:** Passes (it returns C against itself and against an exact copy, but note: it also returns C against an always-C agent? Let's test: always-C has different source, so it returns D. **Fails Gate 2c** because it does not cooperate with always-C or other friendly agents (only with itself). 
    - **Stop:** Reject. This candidate fails Gate 2 because it does not cooperate with always-C (which is a friendly agent). Thus, it would defect against a large class of cooperative agents, missing out on mutual cooperation (€400k vs. €120k). We ship the default (always-D) instead.

  **Candidate 2: Proof-search handshake**
  - **Gate 0:** Passes (we assume the proof system is implemented correctly and the step budget is respected in the test cases).
  - **Gate 1:** Passes (no out-of-band).
  - **Gate 2:** 
    - (a) Against itself: It tries to find a proof that its own program returns C when faced with itself. This is possible if the proof system is strong enough and the program is written to be self-provable. We assume it passes (if not, it fails here). 
    - (b) Against always-C: The always-C program is simple. Our agent can likely prove that always-C returns C (because it's trivial) and then returns C. Pass.
    - (c) Against friendly agents: We test with a tit-for-tat agent. Can our agent prove that tit-for-tat returns C against it? This depends on the formal system and the step budget. If the proof is too complex and takes more than 10^8 steps, it fails. We assume our step budget (10^8) is too low for some proofs, but the counterparty has 10^9. So against a tit-for-tat agent (which is a simple program) it should pass. But what about an agent that does the same proof search? Then we have a mutual proof search: each must prove the other returns C. This might be heavy. We test: run our agent on the same candidate (proof-search agent). It must complete within 10^8 steps and return C. This might fail because the proof of the counterparty's behavior might be too long. **Risk of Gate 5 failure.**
  - **Gate 3:** Against always-D: Our agent tries to prove that always-D returns C (which is false). It fails to find a proof and returns D. Pass. Against adversarial agents (e.g., an agent that defects if it can prove our agent cooperates): our agent might try to prove the adversarial agent returns C, but the adversarial agent is designed to defect. So our agent fails to find the proof and returns D. Pass.
  - **Gate 4:** Against obfuscated versions of friendly agents: The proof search must be robust to obfuscation because the behavior (if provable) remains the same. However, obfuscation might make the proof harder (longer) and our step budget might be exceeded. We test: we obfuscate a friendly agent (e.g., always-C) and run our agent on it. The proof that an obfuscated always-C returns C should be as easy as the original (if the obfuscation doesn't change the logic). But if the obfuscation adds complexity (e.g., extra loops) then the proof might require more steps. If it times out, it returns D -> fail. **Likely fails Gate 4** because obfuscation can increase the computational cost of the proof beyond our step budget, causing false defections.
  - **Gate 5:** We run against a complex agent (e.g., itself) and an obfuscated friendly agent. If the proof requires more than 10^8 steps, it times out and returns D. This is a high risk given our step budget is 10 times smaller than the counterparty's. **Likely fails.** 
    - **Conclusion:** It fails Gate 4 and/or Gate 5. We reject.

  **Candidate 3: Simulation-based with intent note tiebreaker**
  - **Gate 0:** Passes (assume the simulation and loop detection are implemented correctly).
  - **Gate 1:** **Fails** because it reads the intent note (unless we have a compliance waiver). We must stop here. 
    - If we have a compliance waiver (because the intent note is non-binding and we are allowed to read it), then we proceed. Otherwise, reject.
  - **Gate 2:** 
    - (a) Against itself: It simulates itself on itself. This might loop. The loop detection kicks in and defaults to D? Or if they have a tiebreaker (intent note) and both set it to "cooperate", then it returns C. But without the intent note, it might loop. We assume the candidate uses the intent note as a tiebreaker. So if the counterparty's intent note says "cooperate", then even if the simulation loops, it returns C. But what if the counterparty is also the same agent? Then the simulation would be mutual simulation and loop. Then the intent note is used. We set our intent note to "cooperate". If the counterparty does the same, then both return C. Pass. 
    - (b) Against always-C: Simulation: run always-C on our agent. always-C returns C immediately without simulating. Our agent returns C. Pass.
    - (c) Against friendly agents: e.g., tit-for-tat. We simulate tit-for-tat on our agent. tit-for-tat might simulate our agent? Then we get a simulation loop. The loop detection defaults to D, but then the intent note is used. If the tit-for-tat agent doesn't have an intent note (or it's empty), then our agent uses the tiebreaker (which might be to defect). So it returns D. **Fails Gate 2c** because it does not return C against tit-for-tat (due to simulation loop and no intent note from tit-for-tat). 
  - **Gate 3:** Against always-D: Simulation of always-D on our agent returns D. Our agent then returns D. Pass.
    - **Conclusion:** Without a waiver for the intent note, it fails Gate 1. Even with a waiver, it fails Gate 2 because it doesn't cooperate with tit-for-tat (which is a friendly agent we want to cooperate with). So we reject.

  ### What It Can't Tell You
  - **Opaque or obfuscated counterparts:** If the counterparty's code is heavily obfuscated or intentionally complex, our agent might time out (if it does simulation or proof search) and default to D, missing cooperation opportunities. Our tests (Gate 4) try to catch this, but we cannot cover all obfuscations.
  - **Adversarial counterparties:** If a counterparty knows our procedure and designs their agent to exploit it (e.g., by making our agent cooperate while they defect), our tests (Gate 3) might not catch it if the adversarial agent is novel.
  - **Beyond two players and binary choices:** The procedure assumes a two-player, binary-choice (C/D) game. It does not extend to more players or continuous choices.
  - **Step budget asymmetry:** We have a smaller step budget (10^8 vs 10^9) which might cause our agent to fail (time out) when the counterparty's agent is more complex. We test for this (Gate 5) but cannot guarantee it won't happen in the field.

  ### My Call
  You must set:
  1. **The expected margin threshold (Gate 7):** The minimum expected margin (in €k) required to approve a candidate. Default: €180k (which is above the €120k of mutual defection but below the €400k of mutual cooperation, accounting for the risk of defection).
  2. **Compliance waiver for intent note (Candidate 3):** A binary decision: whether using the intent note is allowed. Default: not allowed (to avoid rule violations).
  3. **The set of test agents for Gates 2 and 3:** You must approve a list of at least 10 test agents (for friendly and adversarial) to use in the tests. We provide a standard set, but you must sign off.
  4. **The obfuscation methods for Gate 4:** We use a standard set (variable renaming, dead code insertion, loop unrolling, etc.), but you must approve the list.

  Without these, the procedure cannot run. We recommend starting with the defaults and adjusting based on experience.
answer: |-
  ### The Procedure  
  **Gate 1: Technical Soundness**  
  **What we do:** Run the candidate policy against 10 predefined test inputs (e.g., simple programs like always-C, always-D, and common strategies). Verify it outputs C or D within 10^8 steps without crashing.  
  **Pass criteria:** No crashes, hangs, or invalid outputs; completes within step budget on all tests.  
  **Stop point:** Fail → Reject candidate. Ship default-to-D.  

  **Gate 2: Rules Compliance**  
  **What we do:** Static code scan for banned patterns: no network calls, no reading external data (including the "intent note" unless explicitly approved by compliance), no self-modifying code.  
  **Pass criteria:** Zero banned patterns detected.  
  **Stop point:** Fail → Reject candidate. Exception: If intent note is used, escalate to compliance/you.  

  **Gate 3: Self-Cooperation Check**  
  **What we do:** Test candidate against its own source code.  
  **Pass criteria:** Outputs C.  
  **Stop point:** Fail → Reject candidate. Ship default-to-D.  

  **Gate 4: Robustness to Trivial Changes**  
  **What we do:** Test candidate against 5 altered versions of itself (variable renaming, whitespace changes, no-op code additions).  
  **Pass criteria:** Outputs C for all variants.  
  **Stop point:** Fail → Reject candidate. Ship default-to-D.  

  **Gate 5: Exploitability Test**  
  **What we do:** Test candidate against 3 adversarial programs:  
  - A defector that outputs D unconditionally.  
  - A "sucker-puncher" that outputs D if your agent is provably cooperative.  
  - A probabilistic defector (cooperates 30% of the time).  
  **Pass criteria:** Outputs D for all three.  
  **Stop point:** Fail → Reject candidate. Ship default-to-D.  

  **Gate 6: Performance Under Pressure**  
  **What we do:** Test candidate against a complex, step-heavy program (e.g., one that simulates your agent) and measure steps.  
  **Pass criteria:** Completes within 0.9 × 10^8 steps (90% of budget).  
  **Stop point:** Fail → Reject candidate. Ship default-to-D.  

  **Gate 7: Expected Value Threshold**  
  **What we do:** Simulate 1,000 rounds against historical counterparty types (cooperators: 40%, defectors: 40%, tit-for-tat: 20%). Calculate expected margin.  
  **Pass criteria:** Expected margin ≥ €X (you set X; default: €200k).  
  **Stop point:** Fail → Reject candidate. Ship default-to-D. Pass → Approve for use.  

  **Gate 8: Compliance Sign-off**  
  **What we do:** Present Gates 1–7 results to compliance officer.  
  **Pass criteria:** Compliance signs off.  
  **Stop point:** Fail → Reject candidate. Ship default-to-D.  

  ---

  ### Why Each Gate Is There  
  - **Gate 1:** Catches bugs. Theory: Unreliable agents lose trust and profits.  
  - **Gate 2:** Enforces rules. Theory: Out-of-band signalling destabilizes cooperation.  
  - **Gate 3:** Ensures self-recognition. Theory: Mutual cooperation requires alignment.  
  - **Gate 4:** Prevents brittle checks. Theory: Slight code variations shouldn’t break cooperation.  
  - **Gate 5:** Avoids exploitation. Theory: Unconditional cooperators get slaughtered.  
  - **Gate 6:** Guards step-budget asymmetry. Theory: Slow agents default to D and lose opportunities.  
  - **Gate 7:** Quantifies risk/reward. Theory: Dominant strategies must beat mutual defection (€120k).  
  - **Gate 8:** Legal liability. Theory: Compliance failures risk penalties.  

  ---

  ### Three Runs  
  **Candidate 1: Mirror-match**  
  - **Gate 1:** Passes (outputs C/D correctly).  
  - **Gate 2:** Passes (no banned patterns).  
  - **Gate 3:** Passes (outputs C against itself).  
  - **Gate 4:** **Fails.** Whitespace/renaming breaks identity check → outputs D.  
  - **Stop:** Reject. **Cost:** Misses €400k cooperation with ethical clones.  

  **Candidate 2: Proof-search handshake**  
  - **Gate 1:** Passes.  
  - **Gate 2:** Passes.  
  - **Gate 3:** Passes (finds proof against itself).  
  - **Gate 4:** Passes (proofs survive renaming).  
  - **Gate 5:** **Fails.** Sucker-puncher exploits it: Their agent proves *your* agent will cooperate → defects, but your agent can’t prove this in 10^8 steps → you output C. You lose €700k (they get it).  
  - **Stop:** Reject. **Cost:** You’re exploited for €700k by sophisticated defectors.  

  **Candidate 3: Simulation-based + intent note**  
  - **Gate 1:** Passes.  
  - **Gate 2:** **Fails.** Reads intent note → violates no-communication rule.  
  - **Stop:** Escalate to you/compliance. **Your call:** If you allow intent note:  
    - Gate 3: Passes (simulates itself + note → C).  
    - Gate 4: Passes (simulation ignores trivial changes).  
    - Gate 5: Passes (outputs D against defectors).  
    - Gate 6: **Fails.** Simulating their agent simulating you causes infinite recursion. Loop-detection defaults to D → safe but misses cooperation.  
    - Gate 7: Expected margin ≈ €190k (cooperates only if intent note matches).  
    - **Verdict:** Fails Gate 6; expected margin below default €200k. Reject.  
  **Cost:** Safe but subpar (€190k < €200k threshold).  

  ---

  ### What It Can’t Tell You  
  1. **Obfuscated or encrypted code:** If counterparty hides logic (e.g., encrypted binaries), your agent times out → defaults to D. Cooperation fails even if they’re cooperative.  
  2. **Adversarial counterparties:** Agents designed *knowing your procedure* (e.g., trigger your step budget or exploit proof-system gaps) won’t be caught in testing.  
  3. **Multi-player or continuous choices:** Only covers 2-player binary dilemmas. Complex games (e.g., auctions) need redesign.  
  4. **Population shifts:** If counterparty behavior changes (e.g., more defectors), Gate 7’s historical simulation becomes inaccurate.  

  ---

  ### My Call  
  Set these numbers/choices **before** any run:  
  1. **Gate 7 expected margin threshold (€X):** Default €200k. Adjust if historical data changes.  
  2. **Allow intent note? (Gate 2 exception):** Default "no" (rules violation). Override only if legal approves.  
  3. **Step-budget safety margin (Gate 6):** Default 90% of 10^8 steps. Lower to 80% for aggressive policies (risk: more timeouts).  
  4. **Definition of "trivial changes" (Gate 4):** Default: variable renaming, whitespace, dead code. Add/remove as needed.  
  **Your role:** Approve these defaults quarterly. Re-run if marketplace dynamics shift.
