  Below is a peer mediation diagnostic procedure based on the principles of Aumann's agreement theorem, adapted for your constraints (no probabilities, confidential evidence, differing priors, values disputes, time limits, and potential non-updating). The procedure is designed to be completed within 10 minutes and consists of sequential steps with clear decision points. Mediators should use a timer and move decisively through each step.

  ---

  ### **Peer Mediation Diagnostic Procedure**  
  **Purpose:** To determine why a disagreement persists and whether to keep mediating, escalate, or address values.  
  **Time Limit:** 10 minutes total.  
  **Materials:** Timer, notepad for recording responses.  

  #### **Step 1: Define the Factual Proposition (2 minutes)**  
  - **Mediator asks:** "What specific fact do you disagree about? State it as a true/false claim (e.g., 'The spreadsheet was copied,' 'The call was loud enough to hear,' 'The message was a threat')."  
  - **Sufficient answer:** Both parties agree on a single factual proposition. Must be about what *is* (facts), not what *should be* (values/actions).  
  - **If they cannot agree:**  
    - Reframe once: "Is this about what happened, or about what should happen?"  
    - If about values/actions (e.g., "Quiet hours should be a rule," "They should apologize"): **Stop. Verdict: HAND_TO_VALUES**.  
    - If no clear proposition after reframing: **Stop. Verdict: ESCALATE** (unresolvable ambiguity).  
  - **Record:** The agreed proposition. If parties waffle, write: "Vague proposition."  

  #### **Step 2: Check for Shared Prior (2 minutes)**  
  - **Mediator asks:** "Before this incident, what did you believe about this kind of situation? Describe using words like 'usually,' 'rarely,' or 'never.'"  
  - **Sufficient answer:** Both describe their prior beliefs in plain language (e.g., "I usually trust lab partners," "I’ve never heard calls through walls before").  
  - **If priors differ** (e.g., different experiences, backgrounds):  
    - Attempt quick reconciliation: "Can you agree on a neutral starting point? (e.g., 'School rules,' 'Common sense')."  
    - If reconciled within 1 minute: Proceed to Step 3.  
    - If not reconciled: **Stop. Verdict: RECORD_IMPASSE**.  
  - **Record:** Each party’s prior. If no commitment, write: "Prior: Unclear."  

  #### **Step 3: Share Posteriors and Evidence (4 minutes)**  
  - **Round 1 (2 minutes):**  
    - **Mediator asks Party A:** "What do you believe now about [proposition], and why? What evidence changed your mind?"  
    - **Mediator asks Party B:** "After hearing A’s view, what do you believe now? Did their evidence change your mind?"  
  - **Round 2 (2 minutes):**  
    - **Mediator asks Party B:** "What evidence supports your view?"  
    - **Mediator asks Party A:** "After hearing B’s evidence, what do you believe now?"  
  - **Handling confidential evidence:**  
    - If a party says, "I have private evidence I can’t share," mediator records: "Confidential evidence claimed."  
    - Ask the other party: "Knowing they have confidential evidence, does that change your belief?"  
    - If no change, proceed. Confidential evidence alone does not stop the process.  
  - **Sufficient evidence sharing:** Parties must cite specific facts (e.g., "I saw the edit log," "I heard the call," "The message said X"). Vague answers (e.g., "I just know") are insufficient.  
  - **Record:** Updated beliefs after each round, evidence cited, and any claims of confidentiality.  

  #### **Step 4: Diagnose Agreement or Non-Updating (2 minutes)**  
  - **If beliefs converge** (e.g., both say "likely" or "unlikely"): **Verdict: KEEP_TALKING** (mediate a resolution).  
  - **If beliefs diverge or stall:**  
    - **Mediator script for non-updating (say verbatim):**  
      > "We’ve shared all evidence, including confidential claims. If we’re both rational and started from the same place, we should agree by now. Since we don’t, someone isn’t updating based on the evidence. This stops here, and I’ll pass it to the dean."  
    - **Record:** "Non-updating after evidence exchange." **Verdict: ESCALATE**.  
  - **If time runs out during any step:** **Verdict: RECORD_IMPASSE** (note step where time expired).  

  #### **Prohibited Fallback**  
  - **Never split the difference.** It masks the real issue.  

  ---

  ### **Worked Cases**  
  **Case 1: Lab Partners (Copying Accusation)**  
  - **Step 1:** Proposition: "Student B copied data from the shared spreadsheet without doing the work." **Agreed.**  
  - **Step 2:** Priors differ. Student A: "I’ve been copied before, so I’m suspicious." Student B: "I’ve never had issues, so I trust partners." Attempt reconciliation: Both agree to start from "School rules prohibit copying." **Shared prior established.**  
  - **Step 3:**  
    - Round 1: A cites spreadsheet edit history (B accessed after corrections). B says, "I did my own work," but admits the timing looks bad. B’s posterior: "I didn’t copy."  
    - Round 2: B offers no new evidence (e.g., no drafts). A’s posterior unchanged: "B copied."  
  - **Step 4:** Beliefs diverge (A: "likely," B: "unlikely"). Confidential evidence? None. **Non-updating diagnosed.**  
  **Verdict: ESCALATE**  

  **Case 2: Roommate Dispute (Noise Complaint)**  
  - **Step 1:** Initial proposition: "The late-night calls were loud enough to hear through the wall." **Agreed (factual).** Underlying values issue deferred.  
  - **Step 2:** Priors differ. Complainant: "I’m sensitive to noise; it’s usually disruptive." Accused: "I’ve never had complaints, so it’s usually fine." Reconciliation: Both agree to "Thin walls allow normal hearing." **Shared prior established.**  
  - **Step 3:**  
    - Round 1: Complainant plays a recording. Accused updates: "Okay, it was audible." **Beliefs converge on fact.**  
    - Underlying issue surfaces: "Are quiet hours a rule or courtesy?" **Restart procedure for new proposition.**  
  - **New Step 1:** Proposition: "Quiet hours are a binding rule (violations have consequences)."  
  - **New Step 2:** Shared prior: Both cite the handbook saying it’s a rule. **Agreed.**  
  - **New Step 3:** Evidence: Handbook text. Accused says, "But I think it’s just courtesy—rules shouldn’t apply." **Values conflict exposed.**  
  **Verdict: HAND_TO_VALUES**  

  **Case 3: Group Chat Threat**  
  - **Step 1:** Proposition: "The message was a serious threat." **Agreed.**  
  - **Step 2:** Priors differ. Student A: "Sender has a temper, so threats are possible." Student B: "Sender jokes often, so threats are unlikely." Reconciliation: Both agree to "Most messages aren’t threats." **Shared prior established.**  
  - **Step 3:**  
    - Round 1: A cites message ("I’ll kill you") and sender’s anger. B cites sender’s history of hyperbolic jokes.  
    - Round 2: B shares a private text from sender saying "just kidding." A says, "But the group didn’t see that, so it’s still a threat." Beliefs stall (A: "likely threat," B: "unlikely").  
  - **Step 4:** Beliefs diverge. No confidential evidence claims. **Non-updating diagnosed.**  
  **Verdict: ESCALATE**  

  ---

  **Core Rule for Mediators to Memorize:**  
  "Disagreements that persist after sharing evidence and updating must escalate; if priors differ or the issue is values, record the impasse or hand to values."

  **Procedure Limitations:**  
  - **Misfires:**  
    - Fails if parties lie about evidence or priors (judgment call: mediator assesses sincerity).  
    - Confidential evidence claims may be abused; mediator must note but cannot verify.  
    - Time limits may force RECORD_IMPASSE even if more talking would help (theorem assumes infinite rounds).  
  - **Judgment Calls Dressed as Steps:**  
    - Step 2 (shared prior): Reconciling priors relies on mediator’s subjective "neutral" framing.  
    - Step 4 (non-updating): Assumes irrationality, but limited rounds may prevent convergence.  
  - **Cannot Do:**  
    - Resolve values disputes (only diagnose them).  
    - Handle multiparty conflicts (>2 people).  
    - Assign blame or verify evidence (only diagnose why disagreement persists).  

  \answer{Case 1: ESCALATE; Case 2: HAND_TO_VALUES; Case 3: ESCALATE}
