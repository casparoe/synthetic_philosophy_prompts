  The procedure will have a sequence of questions to uncover which failure occurred. We have constraints: no probabilities (use plain language), sometimes evidence is private, sometimes priors differ, sometimes it's about values, and we have time pressure.

  We design the procedure as a decision tree with steps. The steps are:

  1. **Clarify the Proposition**: Pinpoint exactly what factual claim they disagree about. If they can't state it as a matter of fact (e.g., if it's about what should be done or what is fair), then we are in a values dispute and hand it to the authority (HAND_TO_VALUES). If they can, then proceed.

  2. **Check for Shared Prior**: Ask each party to state their prior belief about the proposition (before the current evidence) in plain language. We are looking for whether they had a common starting point. If they didn't (e.g., one had a prior based on three fights, the other on none), then the disagreement is due to differing priors. We record that and then either (if time allows) try to reconcile the priors by sharing experiences or else note the impasse and hand to authority (RECORD_IMPASSE). But note: we are constrained by time.

     However, in practice, we might not have time to reconcile priors. So if priors differ and we cannot reconcile quickly (within a minute or two), we might have to RECORD_IMPASSE and hand to authority.

  3. **Share Posteriors and Evidence**: Ask each party to state their current belief (posterior) and the key evidence that led to it. If one party cannot disclose the evidence (because it's confidential), we note that and then we have a problem: the theorem requires common knowledge of the evidence (or at least the posterior and that it's based on evidence). Without disclosure, common knowledge of the posterior is not achieved? Actually, the theorem requires common knowledge of the posteriors, not necessarily the evidence. But without the evidence, the other party might not update. So we have to consider:

     - If one party cannot share the evidence, then we are in a situation of private evidence. The procedure should note that and then decide: if the evidence is critical and cannot be shared, then we might have to stop and escalate (ESCALATE) because the mediation cannot proceed fairly.

     However, we can try: ask the party with private evidence if they can at least state the existence of private evidence and the nature of it (without details) and how it affects their belief. Then the other party must update on that. But if they refuse to even mention the existence, then we have a problem.

