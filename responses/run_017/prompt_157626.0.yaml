answer: |-
  ## Committee Room 10:00 PM

  *(The fluorescent lights hum. Iris taps a stack of sensor-readout summaries. Wes stirs lukewarm coffee. The Chair has called for the final vote on Project Centennial: a forest plot, thirty years in, needing three hundred to test its core pathogen-response hypothesis. The room is divided.)*

  **Chair:** Right. Iris, Wes. You’re the holdouts. Talk it out. Then we vote.

  **Iris:** (Leans forward) Look, Wes. The question *is* real. How *will* that forest community reorganize? That’s a definite structure out there – trees, soil, microbes, the pathogen itself – interacting. Funding or not, *that interaction* has a trajectory. Truth about it is whatever the endless community of inquirers *would* settle on, given enough time and access.

  **Wes:** (Sighs) Endless community? Ideal limit? Iris, it’s 10 PM and we’re deciding *now*. Nobody alive sees that settlement. What does ‘*would* settle on’ mean for the scientist sweating over next year's grant? Or for us tonight? Your ‘truth’ feels like a… promissory note on a bank that might never open. Useful truth has to connect to *our* lives, *our* experience, what *works* for us, guides us fruitfully *now*. This project works *now* – it guides ecology, informs policy, trains students brilliantly. That’s its current truth-value.

  **Iris:** But Wes, it’s *about* something beyond us! If we defund it next year, bulldoze the plots, and the question is forgotten… forever orphaned… does the hypothesis just *stop* being true or false? Did the forest interactions *not* have a definite outcome? Surely, there *was* a right answer, even if we obliterated all chance of knowing it. Your ‘works now’ feels… unmoored. Reality constrains what can work in the long run.

  **Wes:** Orphaned? Okay. If we kill it tomorrow and forget it, then *for us*, that hypothesis becomes inert. It stops *mattering* as a live question guiding inquiry or action. Its ‘truth’ fades into irrelevance. What survives is not a ghostly ‘true answer’, but maybe the *methods* it developed, the *habits of mind* it fostered – things that *continue* to pay off in *other* inquiries. The specific claim about *that* forest? Without any possible future verification or consequence, calling it ‘true’ or ‘false’ loses its cash value. It’s a speculative fiction. Truth is what *happens* to an idea when it’s put to work.

  **Iris:** That sends a chill down my spine. What about… barnacles? Imagine a shipwreck, perfectly preserved, in an abyssal trench no one will ever visit. Say we *could* formulate a precise claim: “There are exactly 1,742 barnacles on the port hull.” Nobody asks, nobody investigates, ever. Is there *no* truth of the matter? Just because no one cares? That feels… wrong. The barnacles are there! Counting them *is* a reliable method. The reality of the wreck *would* constrain any potential counter, any investigation, forcing agreement. *That* potential constraint – the “would be” – *is* the truth-maker, even for unasked questions. It’s not ‘whatever’, it’s what the *reality* dictates *through* reliable investigation.

  **Wes:** (Rubs temples) The barnacles… exist, sure. But ‘exactly 1,742’? That’s *our* concept, *our* way of carving up the world. Without any sentient being ever interacting with that wreck, applying that concept, testing it… what does ‘true’ *do* there? It doesn’t guide, satisfy, resolve, or connect to *any* experience. It’s a static factoid in a vacuum. Truth is dynamic, Iris. It’s a *property* of beliefs *in use*. An unused belief is like an unused tool – it might have potential, but it isn’t *working*, isn’t *true* in the only sense that gives the word meaning in a living world. Your ‘would constrain’ is a useful fiction *we* deploy for *our* purposes, like imagining ideal gases. But it’s not *independent* of thought’s interests and methods.

  **Iris:** So, if a powerful state propagates a belief – say, that their leader is divinely chosen – and it becomes incredibly ‘useful’: unifying, justifying policies that ‘work’ for stability, fitting neatly with other state-sanctioned beliefs, providing immense psychological comfort… is it *true*, Wes? Just because it pays its way *now*? That seems like truth by decree! You need the ‘long run’ too! But then isn’t that just *my* ideal limit sneaking in?

  **Wes:** (Leans in, intense) No. *My* long run is the *actual* long run of *actual* human experience. Does that belief *continue* to pay its way? Does it lead to genuine human flourishing over generations, not just stability? Does it survive encounters with *all* the evidence, including suppressed evidence? Does it remain consistent with *all* our other evolving beliefs, not just a curated set? A belief propped up by force and lies will eventually crack under the weight of *real*, lived dissatisfactions – maybe cruelty, maybe inefficiency, maybe encountering a better way. Its ‘expediency’ proves shallow, temporary. Truth is what proves satisfactory *on the whole*, *over time*, to *all* who experience its consequences. It’s not momentary comfort, it’s *enduring* workability in the full stream of life.

  **Iris:** But Wes, that ‘enduring workability’… isn’t that just *your* description of what *would* happen in the *actual* long run? It sounds perilously close to the community settling on it *because* it fits reality! You’re smuggling in the constraint! The difference between a belief that’s *correct* and one that’s merely *unassailable within its bubble* is real. Lose that, and you lose truth’s critical edge.

  **Wes:** And your ideal terminus, Iris – never reached, maybe unreachable – gives us *no* critical edge *now*. For *this* committee, *tonight*, all it says is ‘keep inquiring… maybe someday…’. It turns every tough call into faith in an unreachable future verdict. Truth *now* has to be tethered to experience *now*, its current workability, its current power to guide us well.

  **Chair:** (Tapping pen) Gentle reminder: We need a vote. *Tonight*.

  **Iris:** (Takes a deep breath) Fine. I vote… Renew. Because inquiry is directed at understanding a world whose structure doesn’t bend to our lifespan or our neglect. That hypothesis *is* about something real, and truth is the compass pointing towards its resolution, whenever it comes.

  **Wes:** Renew. Because the beliefs this project feeds – about complexity, long processes, careful observation – are the ones demonstrably paying their way *right now* in ecology and beyond. If the future never comes… well, the truth was in the living inquiry we sustained.

  *(They vote. The Chair tallies. The project is renewed. The room stirs.)*

  **Iris:** (Quietly, to Wes) So… those barnacles on the wreck. Still no truth about the number? Just static factoids?

  **Wes:** (Meets her gaze) Still just factoids, Iris. Until someone needs to know. Then it becomes a question. And *then* it gets its truth. Or falsehood. When it matters.

  *(They gather papers, the residual disagreement hanging precisely there: orphaned barnacles, adrift in the abyss, waiting for a question that will never come.)**
