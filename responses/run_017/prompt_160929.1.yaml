prompt: |-
  I am a PhD student in criminology, writing the chapter of my dissertation that deals with how sentences are actually produced, and I have run into a normative question that I cannot get traction on. I would be grateful for help reconstructing what the practice I am studying presupposes.

  The practice, in the jurisdictions in my sample, has the following features, none of which I think is controversial:

  1. Sentence length is set by negotiation rather than by any finding about culpability. Roughly nine convictions in ten are pleas rather than verdicts, and the term imposed is a function of the charges the prosecutor files, the discount offered for waiving trial, and the defendant's willingness to accept it.

  2. The plea discount is a published scale keyed to timing rather than to culpability: on the order of a third off for a plea entered at the first hearing, tapering to a token few percent for a plea entered at the courtroom door. The official justification is administrative — witnesses spared, court time saved, victims not required to testify — and the doctrine is explicit that the discount is not a reward for remorse, remorse being handled separately as a mitigating factor.

  3. The largest reductions go to defendants who can hand over information about other people's crimes. The size of a defendant's discount therefore tracks how much they know, which in practice tracks how deeply embedded they were in the offending.

  4. The same systems also maintain, in appellate review, that a sentence must be proportionate to the gravity of the offence and the offender's culpability, that consequences falling on third parties are not mitigating, and that a person who lacked the capacity to conform is not a fit subject for punishment at all.

  5. One jurisdiction has gone further and made the mechanism explicit. A defendant convicted after a full contest at trial now receives the same reduction if, within a fixed window, they waive their appeal and accept a supervision and restitution plan. It is formally described as a credit for not consuming further public resources; it is refused to defendants who maintain innocence and pursue their appeals, including where the appellate court would later have found error on the record.

  My own suspicion is that the practice strictly presupposes almost nothing about desert, and that the proportionality language at the appellate level is decorative rather than load-bearing. But I do not know how to test that suspicion, because the features pull in different directions: some look like straightforward deterrence or resource allocation, while others — the refusal to count third-party harms, the capacity-based exemptions — seem to make sense only if desert is doing real work somewhere in the system.

  This is where I would particularly value help. I have been reading the debate between Dennett, who holds that desert survives the demise of libertarian free will as a social practice we have good reasons to maintain, and Caruso, who holds that no one is responsible in the desert-involving sense and that the state's coercive response to crime should be modelled on public health: prevention, incapacitation and treatment, constrained by something like a least-restrictive-means requirement. On the face of it these views are very far apart, and yet I cannot see that the practice discriminates between them. The first might say that negotiated sentences are exactly what taking desert seriously under uncertainty and scarcity looks like, or that desert functions as a loose outer constraint while efficiency determines the outcome within it. The second might say that the plea discount is triage under a budget constraint, and that the only thing wrong with it is the punitive framing — but equally that a credit for waiving rights is unintelligible on a quarantine model, since waiving an appeal does not make anyone less dangerous. If both can license the practice, what would have to be true of the practice for it to be evidence for one rather than the other, and what would concretely have to change in it if either view were adopted honestly rather than rhetorically?

  Two further things I would like addressed. First, the epistemic dimension: plea bargains are struck under deep uncertainty about what the defendant did, and one strand of the sceptical argument is that we are never in a position to know whether anyone is answerable in the desert-involving sense. Does that make a negotiated sentence the epistemically appropriate response to uncertainty about desert, or a sign that the desert question was never really being asked? Second, where the practice is underdetermined: which of the five features could be retained under several rival theories, and which is defensible on only one. If it turns out that the sentencing discount is the feature that no theory wants and every theory tolerates, I would like to know why toleration is so cheap.
reasoning: |-
  Okay, the user is a PhD student in criminology working on their dissertation about how sentences are actually produced. They're grappling with a normative question about what the sentencing practices in their sample jurisdictions presuppose regarding desert and other theories of punishment. I need to help them reconstruct the underlying assumptions.

  The user describes five key features of the practice: plea bargaining dominance, standardized discounts based on timing, larger reductions for informants, appellate proportionality rhetoric, and one jurisdiction's appeal waiver credit. Their core suspicion is that desert plays minimal substantive role despite being rhetorically present.

  The user wants help testing this suspicion. They're particularly interested in how the practice relates to the Dennett-Caruso debate on free will and desert. They also want to examine two specific aspects: the epistemic implications of plea bargaining under uncertainty, and which features are theory-dependent versus theory-neutral.

  I should consider how each feature aligns with different punishment theories. For example, the plea discount structure seems purely consequentialist (efficient resource allocation), while the capacity exemptions seem retributive (no punishment without culpability). The informant rewards look like pure crime-control utilitarianism.

  Regarding the Dennett-Caruso debate: Dennett's "desert as social practice" could interpret plea bargaining as a practical accommodation within a desert-based system, while Caruso's public health model would reject punitive framing but might accept efficiency measures. The key differentiator would be whether the system maintains punitive intent - does it express condemnation or just manage risk?

  On epistemology: Deep uncertainty in plea bargaining could either be seen as (a) a desert-appropriate acknowledgment of epistemic limits (since we can't know true culpability) or (b) evidence that culpability isn't the real concern. The persistence of trial penalties even for likely innocent defendants suggests the latter.

  For feature analysis: The timing-based discounts seem compatible with all theories as an efficiency measure. Capacity exemptions are retributive linchpins. Third-party harm exclusions are harder to place - they might reflect retributive purity or consequentialist focus on offender-specific deterrence.

  The user's deepest need might be methodological: how to empirically test normative presuppositions in complex institutions. I should suggest looking for tensions between rhetoric and practice, especially where efficiency overrides proportionality, or where features that only make sense under one theory are treated as peripheral.

  The appeal waiver credit is particularly telling - it explicitly trades rights for sentence reductions, which seems incompatible with desert theory's focus on just punishment. A system truly committed to desert would maintain proportionality regardless of procedural choices.
answer: |-
  Based on your detailed description and the Dennett/Caruso framework, here's a reconstruction of the sentencing practice's presuppositions, how to test your suspicion, and analysis of the features:

  **Core Presupposition: Efficient Social Defense Trumps Desert as the Primary Organizing Principle**

  Your analysis is likely correct: **The practice presupposes that the primary goal is efficient social defense (crime control, resource management) under constraints, with "desert" functioning primarily as a limiting principle or rhetorical device, not the core driver.** The system prioritizes finality, resource conservation, and leveraging offenders for intelligence *over* a meticulous, individualized assessment of just deserts.

  **Testing Your Suspicion (Desert as Decorative):**

  1.  **Look for Systemic Hypocrisy/Inconsistency:** Where does the system *actually* sacrifice proportionality for efficiency? Your Feature 5 (appeal waiver credit) is prime evidence. Offering the *same* discount for waiving an appeal *after a trial conviction* as for an early plea explicitly decouples the "credit" from any plausible desert-based rationale (remorse, acceptance of guilt *before* trial burden). It's purely transactional. Similarly, the "informant discount" (Feature 3) rewards embeddedness in crime, not reduced culpability, often leading to *less* proportional sentences for ringleaders compared to minor players.
  2.  **Examine the "Cost" of Proportionality:** How difficult is it to *actually* get a sentence reviewed/adjusted based *solely* on disproportionality (absent procedural errors)? If appellate courts are highly deferential to negotiated outcomes or primarily intervene only on procedural grounds, proportionality review is decorative. Does the system expend resources proportional to its stated commitment? Plea bargains are cheap; full culpability assessments (trials, thorough PSIs) are expensive.
  3.  **Interrogate the "Capacity" Exemption (Feature 4):** Is this applied rigorously *within* the plea system? Or is it primarily a trial/post-conviction doctrine? If defendants lacking capacity are routinely pressured into pleas (perhaps due to perceived lack of viable defense or coercion), the exemption is more theoretical than operational. Does the system proactively screen for incapacity pre-plea?
  4.  **Follow the Incentives:** Prosecutors file charges based on leverage and likely plea outcome, not pure desert. Defendants plead based on risk aversion and discount size, not necessarily admission of true desert. Judges approve bargains primarily for docket control. These dominant incentives point to efficiency, not desert, as the engine.

  **The Dennett vs. Caruso Conundrum: Why Both Can "License" It & How to Discriminate**

  *   **Dennett ("Desert as Practice"):** He could argue:
      *   The *framework* of proportionality and culpability is essential for the social practice to have meaning and legitimacy, even if imperfectly applied. It sets the outer bounds ("this crime *deserves* roughly 5-15 years") within which negotiation occurs.
      *   Plea bargaining is a practical accommodation under uncertainty and scarcity. We *treat* defendants *as if* they deserve punishment, but accept negotiated outcomes as a necessary compromise for the system to function. The capacity exemption shows the underlying retributive constraint is still operative.
      *   The discount *could* be seen as a recognition of reduced social cost/conflict (efficiency), fitting within a broader desert-based system focused on societal needs alongside individual blame.
  *   **Caruso ("No Desert / Public Health"):** He would argue:
      *   The practice reveals the system's *true* priorities: risk management, resource allocation, and crime control (deterrence, incapacitation of informants' targets). The desert language is a vestigial myth used to legitimize coercion.
      *   The plea discount, informant rewards, and appeal waiver credit are *perfectly* intelligible as triage and resource optimization under a public health/security model. Punishing less for saving resources aligns with "least restrictive means."
      *   Features like the capacity exemption aren't evidence for desert, but for a *separate* ethical constraint against harming the incompetent, compatible with public health ethics.

  **Discriminating Between Them: What Would Change?**

  *   **Evidence for Dennett (Desert doing work):** If the system consistently:
      1.  **Rejected Bargains Violating Proportionality:** Prosecutors/judges routinely refused deals where the *agreed sentence* fell demonstrably outside the acceptable desert range, regardless of efficiency gains.
      2.  **Made True Culpability Central to Discounts:** Discounts were primarily tied to provable remorse, acceptance of responsibility *for the act*, or strong evidence of significantly *lower* culpability than charged, not just timing or snitching.
      3.  **Treated Appeal Waivers Differently:** Saw post-trial appeal waivers as irrelevant to *desert* and thus not warranting a sentence reduction equivalent to an early plea (which arguably shows some acceptance).
  *   **Evidence for Caruso (Desert as Myth):** If the system consistently:
      1.  **Formalized Efficiency as the Core Justification:** Explicitly stated that sentence length is primarily determined by resource cost savings, intelligence value, and risk management, dropping the proportionality rhetoric. Feature 5 is a step here.
      2.  **Eliminated/Radically Reformed Culpability-Based Doctrines:** Abandoned or severely weakened the capacity exemption and "third-party harms" rule if they impeded efficient outcomes (e.g., jailing incompetent but dangerous individuals if cheaper/more effective than treatment; considering family hardship if it incentivized pleas).
      3.  **Focused Interventions on Risk/Needs:** Post-sentence supervision/restitution (Feature 5) would be the *primary* focus, designed purely around risk reduction and rehabilitation, decoupled from punitive desert. Sentences themselves might become shorter and purely incapacitative/restrictive based on risk assessment.
  *   **The Crucial Test: Punitive Intent vs. Risk Management:** Does the system fundamentally aim to *impose suffering because it is deserved*, or to *impose restrictions necessary to prevent harm*? The *framing*, the *emotional resonance* (condemnation vs. neutral restriction), and the tolerance for suffering beyond what's strictly necessary for prevention are key. Feature 5's refusal of the credit to those maintaining innocence highlights punitive intent – their *belief* in their innocence is punished with more restriction, even if it poses no greater risk.

  **Addressing Your Specific Queries:**

  1.  **Epistemic Dimension (Uncertainty & Desert):**
      *   **Negotiated Sentence as Epistemically Appropriate?** Only under a highly constrained view. If true desert requires knowing culpability, and uncertainty is high, a *cautious, lenient default* might be epistemically defensible. However, plea bargaining often pressures defendants into accepting *harsher* terms than a risk-averse assessment of likely trial outcome would suggest ("trial penalty"). The discount is offered against a *prosecutor's inflated baseline*, not a neutral desert assessment. This suggests efficiency and leverage, not epistemic humility about desert.
      *   **Sign Desert Was Never Central:** The deep uncertainty makes a meticulous desert-based system practically impossible. The *dominance* of pleas, the *standardization* of discounts based on non-desert factors (timing, snitching), and the *pressure* to plead all point to the system being *designed* to avoid the costly epistemic challenge of determining true desert through trial. It's a workaround, not an epistemic solution. The system avoids asking the desert question rigorously because it can't afford to.

  2.  **Feature Analysis: Underdetermination and Toleration:**

      | Feature                      | Compatible Theories                               | Most Aligned Theory                               | Defensible Only On...?                    | Why Toleration is Cheap                          |
      | :--------------------------- | :------------------------------------------------ | :------------------------------------------------ | :---------------------------------------- | :----------------------------------------------- |
      | **1. Plea Dominance**        | **All** (Retrib., Utilitarian, PH)                | **Crime Control / Resource Utilitarianism**       | *None exclusively* (Pragmatic necessity) | Universal need for efficiency in complex systems |
      | **2. Timing-Based Discount** | **Utilitarian (Deter swift pleas), PH (Efficiency)** | **Resource Utilitarianism**                       | *Not pure Retrib.* (Ignores culpability) | Easily administered; clear incentive; avoids messy culpability assessments |
      | **3. Informant Discount**    | **Utilitarian (Crime Control/Intel)**             | **Pure Crime Control Utilitarianism**             | *Only Utilitarian (Crime Control)*        | Delivers tangible results (convictions); powerful prosecutorial tool |
      | **4a. Proportionality (Appellate)** | **Retributivism, Utilitarian (Legitimacy)** | **Retributivism** (Rhetorically)                  | *Primarily Retributivism*                 | Legitimizing rhetoric; outer constraint          |
      | **4b. No 3rd Party Harm**    | **Retributivism (Focus on offender)**             | **Retributivism**                                 | *Primarily Retributivism*                 | Maintains focus on individual blame              |
      | **4c. Capacity Exemption**   | **Retributivism, PH (Non-punitive)**              | **Retributivism** (Core principle)                | *Primarily Retributivism*                 | Fundamental ethical barrier; hard to publicly abandon |
      | **5. Appeal Waiver Credit**  | **Resource Utilitarianism**                       | **Resource Utilitarianism**                       | *Only Resource Utilitarianism*            | Pure efficiency; explicitly transactional; undermines retributive logic |

  *   **Why Toleration is Cheap (Especially for Discounts):**
      *   **Systemic Inertia:** The machine runs on pleas. Disrupting the discount risks collapsing the system.
      *   **Diffuse Criticism:** No single actor (judge, prosecutor) feels solely responsible for the systemic outcome. Each is acting "reasonably" within their role.
      *   **Lack of Clear Victim:** The injustice (potentially disproportionate punishment) is abstract and spread across many defendants. Society "wins" via efficiency.
      *   **Plausible Deniability:** Desert rhetoric provides cover. "The sentence *could* have been worse at trial" masks the punitive pressure.
      *   **Perceived Necessity:** All sides believe (often correctly) that the system couldn't function without these incentives, making criticism seem idealistic or naive.

  **Conclusion:**

  Your practice strongly suggests a system where **efficient social defense through managerialism is the core logic, constrained by a residual (but rhetorically vital) commitment to retributive principles like proportionality and capacity, primarily at the appellate level where practical impact is limited.** The plea discount, especially in its timing-based form and the novel appeal-waiver variant, is the clearest indicator of the primacy of efficiency.

  To strengthen your thesis:
  1.  **Empirical Analysis:** Quantify how often proportionality/capacity claims *actually* alter plea-agreed sentences on appeal compared to procedural claims. Track the fate of defendants who try to raise pure proportionality challenges to pleas.
  2.  **Discourse Analysis:** Scrutinize judicial opinions in plea cases – how do they reconcile the bargain with proportionality doctrine? Is it hand-waved, or seriously engaged?
  3.  **Institutional Pressures:** Document prosecutor office policies explicitly prioritizing caseload closure and conviction rates over individualized sentencing justice.

  The system "tolerates" features like the standardized discount because they are its lifeblood, not because they are coherent under a unified theory. The Dennett/Caruso debate highlights the tension: the practice *needs* the *rhetoric* of desert (Dennett's social practice) for legitimacy but operates much closer to Caruso's public health/security model in its daily mechanics, albeit without abandoning the *form* of punishment. The appeal waiver credit (Feature 5) is perhaps the most honest, and thus most revealing, feature of all.
