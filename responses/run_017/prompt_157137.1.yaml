prompt: |-
  I've been arguing about blame with friends for years, and there's one move in these arguments that I want a name for. I should be clear up front that I have no academic background — I work in freight scheduling and read this sort of thing on my own — so I'll describe it the way I've actually encountered it, and then say what would count as an answer.

  The move goes like this. Someone does something bad, and a story is offered about why they had no real alternative: they were threatened; they were dependent; they were raised so that the other option never presented itself as an option at all. The reply that ends the conversation is: none of that made you do it. You weighed things up and you acted on your own reasons. Whatever would have made you act differently never actually came into play — and if it did come into play, you could have ignored it, since people do. So the "I had no choice" story doesn't do the excusing work it's supposed to do.

  What interests me is that this reply seems decisive in some cases, partly right in others, and hollow in still others, and I can't find the variable. Four cases:

  **A.** A warehouse supervisor means to steal some stock. Without his knowledge, his employer has set things up so that if he had shown the slightest sign of not going through with it, he would have been made to go through with it. He shows no such sign, and takes the stock entirely for his own reasons. We learn about the arrangement afterwards. My reaction, and everyone else's: it changes nothing about how much he's to blame — even though, given the arrangement, there was no way he was leaving that warehouse with the stock not taken.

  **B.** A shopkeeper is told that if she doesn't hand over the week's takings, her family will be harmed. She hands them over. Most people in her position, I think, would refuse and go to the police. Here "you could have resisted — people do" seems like a real point, and it seems to reduce blame, though not to nothing.

  **C.** The same shopkeeper, except that she took the loan deliberately, from people she knew the character of, on terms she understood, for a purpose of her own. She is now in a position she chose to be in. Here the reply gets a grip it doesn't have in A — but she still acts on her own reasons at the moment of handing over the money, and arguably still can't do otherwise at that moment.

  **D.** A man grows up somewhere a certain cruelty to his younger brother is simply what one does. It never occurs to him at the time that there is another way to behave, and nobody suggests it. Twenty years on he understands that it was wrong. Here "nobody held a gun to you — you could have done otherwise" seems to me to misfire badly, and yet a residue of blame doesn't go away, which puzzles me.

  I've tried several candidate variables and none of them sort the cases. Not whether the pressure was actually exercised: that splits A off from B and C but leaves those three tangled. Not whether the person knew about it: in A he didn't and the reply works, in C she did and it works too. My best guess is that it's something about whether the person's own earlier choices are part of the story, but that doesn't seem to touch A, and it doesn't explain the residue in D.

  So: does this reply — one move, or several moves wearing the same clothes — have a name? I've tried looking into it a couple of times and kept landing on things that felt adjacent rather than on the move itself: discussions of whether anyone really chooses anything if our brains are doing the causing, and of whether addicts can stop. Both near, neither it.

  What I want is not a label. If you reach for some well-known doctrine to the effect that blame doesn't require that a person could have done otherwise, tell me which of A–D it actually settles and which it leaves alone — my sense is that it handles A cleanly and the rest not at all, but I'd rather be corrected than agreed with. Specifically: are A–D one phenomenon or more than one; which, if any, is the one that's actually been worked on and what are the others; what the load-bearing difference is between the cases where the reply lands and where it doesn't; and if there's no established term, a coinage — name, definition, and a case at each edge, one clearly inside and one clearly outside. Please don't send me to books or papers; I can't get at them, and I'm not asking who said what first.

  After the discussion, give me a single JSON object summarizing it, valid and nothing outside it, with this schema:

  - "has_established_name": "yes" | "partly" | "no"
  - "nearest_concepts": array of objects with fields "concept" (the name), "what_it_covers" (one sentence), "cases_covered" (array of "A"/"B"/"C"/"D"), "fit" ("exact" | "partial" | "poor"), "why_not_just_this" (one sentence)
  - "case_by_case": one object per case, A through D, with fields "case", "best_label", "move_succeeds" ("yes" | "partly" | "no"), "load_bearing_feature" (the single feature that decides this case), "one_sentence_reason"
  - "is_it_one_move": object with fields "answer" and "criterion_that_sorts_the_cases"
  - "proposed_term": object with fields "term", "definition", "clear_case", "borderline_case", "excluded_case"

  Keep every string value to about thirty words; the point is the sorting, not the prose.
reasoning: |-
  We are given four cases: A, B, C, D. The "move" in question is a reply to an excuse that someone had no real alternative. The reply states that the circumstances did not force the action; the person weighed their own reasons and acted, and could have done otherwise if they had chosen to.

  We are to analyze:
  - Whether this move has an established name.
  - How it applies to each case (A, B, C, D).
  - What the load-bearing feature is in each case that makes the move succeed, partly succeed, or fail.
  - Whether it's one move or more than one.

  Let's break down the cases:

  **Case A**: Warehouse supervisor steals stock. Unbeknownst to him, if he had hesitated, he would have been forced. But he didn't hesitate and acted for his own reasons. The move works: we say he is fully to blame because the external arrangement didn't affect his decision.

  **Case B**: Shopkeeper hands over money under threat to her family. Most would refuse and go to police. The move partly works: it reduces blame but not to zero because she could have resisted (as some do) but the threat is a strong pressure.

  **Case C**: Shopkeeper who deliberately put herself in the situation (took a loan from shady people). The move works: because she chose to be in that situation, so even though at the moment she hands over the money she acts on her own reasons, the fact that she got into that situation voluntarily makes her more blameworthy.

  **Case D**: A man raised in a culture where cruelty to a sibling is normal, never thought of an alternative. The move fails: saying "you could have done otherwise" misfires because at the time he had no conception of an alternative. Yet there is a residue of blame.

  Now, we are to find the variable that sorts these cases.

  Looking at the cases, the key difference seems to be the **voluntariness of the agent's situation and the availability of alternative perspectives at the time of action**.

  But let's think in terms of established philosophical concepts:

  1. **Compatibilism vs. Incompatibilism**: This is about free will and determinism. But the cases are not about determinism per se but about external constraints and internal capacities.

  2. **Moral Responsibility**: The move is about whether the agent had a choice and could have done otherwise.

     - The classic principle: "ought implies can" (if you ought to do something, you must be able to do it). But here we are after the fact, blaming.

     - Harry Frankfurt's cases (Frankfurt-style counterexamples) are about alternative possibilities. He argues that moral responsibility does not require the ability to do otherwise. In Frankfurt's case, a person is going to do something (say, vote for Clinton) and a counterfactual intervener (nefarious neurosurgeon) would have forced him to do it if he showed any sign of not doing it. But the person does it on his own. So he is responsible even though he couldn't have done otherwise. This is exactly **Case A**. So for Case A, the established concept is a Frankfurt-style case.

  3. **Duress and Coercion**: In law and ethics, duress can excuse or mitigate blame. Case B is a classic duress situation. The threat of harm to family is a coercive pressure that reduces blame but doesn't always eliminate it (if the act is very serious). The move in Case B partly works because the threat is real and severe, but the agent still has a choice (though a hard one). So the load-bearing feature is the severity of the threat and the reasonableness of the choice.

  4. **Voluntariness and Prior Choices**: Case C is about prior fault. The agent voluntarily put herself in a position where she would face such a threat. This is sometimes called "culpable inducement" or "prior fault". So the move works because she is responsible for being in the situation.

  5. **Moral Ignorance and Socialization**: Case D involves an agent who, due to upbringing, never considered an alternative. This is about moral ignorance and the conditions for blameworthiness. Some philosophers argue that moral ignorance does not excuse if it is the result of the agent's own culpable conduct (but in D, he was raised that way and it wasn't his fault). Others argue that even in such cases, the agent might still be blameworthy because the act was wrong and he did it. The move fails because at the time, he had no access to an alternative perspective.

  Now, the variable that sorts the cases:

  - In A: The counterfactual intervener didn't actually do anything, so the agent acted freely. The move works because the agent's reasons were his own and the intervener was irrelevant.
  - In B: The threat is actual and present, and it is a strong pressure. But the agent could have resisted (as some do). The move partly works because the threat reduces blame but doesn't eliminate it because the choice was hard but not impossible.
  - In C: The agent is responsible because she voluntarily entered into the risky situation. The move works because she is blameworthy for her prior choice that led to the situation.
  - In D: The agent lacked the capacity to see the alternative at the time. The move fails because the argument "you could have done otherwise" is not true at the time of action (he couldn't have, because he didn't see the alternative) and it's not his fault that he was raised that way.

  So the load-bearing feature seems to be:

  - **The actual causal role of the external constraint in the agent's decision, and the voluntariness of the agent's situation that led to the constraint.**

  But let's try to be more precise for each case:

  - A: The constraint was not actual and did not influence the agent. Hence, the agent is fully responsible.
  - B: The constraint was actual and did influence the agent, but the agent could have resisted (so the constraint doesn't fully excuse). The blame is mitigated.
  - C: The constraint was brought about by the agent's own prior voluntary action. Hence, the agent is responsible for the action under constraint because she is responsible for the constraint.
  - D: The constraint (lack of moral awareness) was not the agent's fault and was not voluntarily assumed. Hence, the move fails because the agent lacked the capacity to see the alternative.

  Now, is there one move or more?

  The move is always the same: "You could have done otherwise because the constraint didn't force you; you acted on your own reasons." But its effectiveness depends on the context. So it's one move, but its success depends on the nature of the constraint and the agent's relation to it.

  But note that in D, the move doesn't even make sense because at the time, the agent didn't have the conceptual resources to do otherwise. So perhaps it's one move but it doesn't apply to all cases equally.

  Now, for the established concepts:

  - **Frankfurt-style cases**: Exactly Case A. It shows that moral responsibility does not require the ability to do otherwise.

  - **Duress**: Case B. In law, duress is a defense that excuses or mitigates when the act was done under threat of serious harm.

  - **Prior fault or culpable inducement**: Case C. If you voluntarily put yourself in a situation where you will be forced to commit a crime, you are still responsible.

  - **Moral ignorance and non-culpable ignorance**: Case D. If the ignorance is not the agent's fault, it might excuse. But in this case, there is a residue of blame. This is debated. Some (like Susan Wolf) might argue that the agent is not blameworthy because he couldn't have known better. Others (like Thomas Nagel) might point to moral luck and say we still blame because the act was wrong.

  So the nearest concepts:

  - For A: Frankfurt cases (exact fit)
  - For B: Duress (partial fit because the move partly works and duress is about mitigation)
  - For C: Prior fault (exact fit)
  - For D: Non-culpable moral ignorance (partial fit because the move fails, but there is residue of blame which might be explained by other factors)

  But note: the move in question is the same in all cases: the retort that the agent could have done otherwise. So we are to see how that retort fares.

  Now, to answer the questions:

  **has_established_name**: The move itself doesn't have a single established name. Frankfurt cases are about the irrelevance of alternative possibilities, but that's a specific argument. The retort is a common one in free will debates. So I'd say "partly".

  **nearest_concepts**:

  1. Concept: "Frankfurt-style counterexample"
     - What it covers: Shows that moral responsibility doesn't require alternative possibilities.
     - Cases covered: ["A"]
     - Fit: "exact"
     - Why not just this: Only applies to cases with counterfactual interveners, not actual threats.

  2. Concept: "Duress"
     - What it covers: A defense that excuses or mitigates blame when acting under threat of harm.
     - Cases covered: ["B"]
     - Fit: "partial"
     - Why not just this: Duress is about actual threats, but the move in B partly works because the threat doesn't always excuse.

  3. Concept: "Prior fault"
     - What it covers: When an agent is responsible because they voluntarily created the situation.
     - Cases covered: ["C"]
     - Fit: "exact"
     - Why not just this: Only applies when the agent has a prior choice that led to the constrained situation.

  4. Concept: "Non-culpable ignorance"
     - What it covers: When an agent's ignorance is not their fault, it may excuse blame.
     - Cases covered: ["D"]
     - Fit: "partial"
     - Why not just this: In D, there is a residue of blame, and the move fails, but the ignorance may not be fully excusing.

  **case_by_case**:

  - A:
    - best_label: "Frankfurt-style case"
    - move_succeeds: "yes"
    - load_bearing_feature: "Constraint was counterfactual and did not influence the agent's decision."
    - one_sentence_reason: "The agent acted freely because the intervention was never triggered."

  - B:
    - best_label: "Duress"
