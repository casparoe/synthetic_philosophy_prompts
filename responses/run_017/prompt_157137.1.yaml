    - load_bearing_feature: "Actual threat that creates pressure but doesn't eliminate all choice."
    - one_sentence_reason: "The threat was real and severe, making resistance difficult but not impossible, thus mitigating blame."

  - C:
    - best_label: "Prior fault"
    - move_succeeds: "yes"
    - load_bearing_feature: "The agent voluntarily assumed the risk that led to the constraint."
    - one_sentence_reason: "The agent is responsible for the action because she chose to be in the constrained situation."

  - D:
