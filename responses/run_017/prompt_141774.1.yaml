answer: |-
  0.55

  **Decomposition:**

  (a) **Nonzero expected reduction probability:** 0.70  
  *Justification:* With threshold effects (2,500 birds needed to drop a lot) and price pass-through recovering 0-40% of reductions, a customer's abstention has a tiny but calculable probability of being pivotal when aggregated near thresholds, creating a non-zero expected bird reduction.

  (b) **Preventing existence as moral gain:** 0.90  
  *Justification:* If a life is net-negative compared to non-existence, preventing it is a moral benefit (reducing net suffering), not merely a neutral population change, under standard consequentialist welfare principles.

  (c) **Expectation as primary moral currency:** 0.60  
  *Justification:* While expectation matters, moral reasons could also arise from complicity in collective harm or symbolic expression, independent of causal efficacy; expectation isn't clearly the sole determinant here.

  (d) **No vanishing threshold for moral significance:** 0.80  
  *Justification:* Small probabilities of large harms (like preventing a net-negative life) generate moral reasons proportionally; there's no plausible "zero floor" where microscopic expected impacts become irrelevant.

  (e) **Social clustering increases efficacy meaningfully:** 0.70  
  *Justification:* Correlated abstentions within social circles raise the likelihood of localized demand drops hitting thresholds, boosting expected impact compared to independent actions.

  (f) **Overdetermination undermines individual responsibility (ADDED):** 0.40  
  *Justification:* If the collective harm is overdetermined (many others' actions would maintain demand even if one abstains), individual causal contribution may be too diluted to ground a distinct moral reason, shifting focus to collective obligations.

  *(No deletions; all stipulated nodes addressed directly)*

  **Combination to 0.55:**  
  Terms don't multiply cleanly due to interdependencies: (a),(e),(f) all address causal structure; (b),(d) are moral premises; (c) bridges both. Synthesizing: Strong support from (b) and (d) (0.90 × 0.80 = 0.72), tempered by moderate confidence in nonzero efficacy (average of (a) and (e) ≈ 0.70), then discounted by skepticism that expectation dominates (c: 0.60) and overdetermination risk (f: 0.40). Weighted toward expectation-based reasons given the problem's framing, but hedging for alternative moral frameworks. Result: **0.55**.

  **Highest sensitivity:** (c) "Expectation as moral currency."  
  *Most moving evidence:* A compelling argument that moral reasons in collective harms stem solely from participatory guilt or symbolic expression (not expected outcomes) could lower (c) to 0.30, pulling the headline to ~0.40. Conversely, rigorous expected utility axioms could raise (c) to 0.90, pushing headline to ~0.70.

  **Disagreement locus:** Likely (c) or (f). You (0.65) probably weight expectation higher (e.g., (c) ≈ 0.80) and dismiss overdetermination ((f) ≈ 0.60), while your friend (0.25) sees expectation as irrelevant ((c) ≈ 0.30) and emphasizes futility from overdetermination ((f) ≈ 0.20).

  **Carry-over:**  
  - *Voting:* Similar (thresholds, tiny expectations), but individual impact is smaller; P less likely true here (≈0.40).  
  - *GHG emissions:* Dissimilar; emissions cause direct, incremental harm (no threshold/rounding), making expected impact clearer and P more plausible (≈0.75). The chicken case's "prevented existence" element is unique and does special work.
