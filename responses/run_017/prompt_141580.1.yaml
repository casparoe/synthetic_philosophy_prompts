  Below is a decision procedure designed for your context, grounded in the theoretical distinctions from your seminar and supervisor's input. It prioritizes speed (under 20 minutes), clarity for untrained undergraduates, and alignment with annotation budget constraints. The procedure explicitly handles reversibility concerns and flags value-based decisions for hand-off to your graduate mentor. 

  ### Decision Procedure: Goal-Directed (GD) vs. Approval-Directed (AD) Setup
  **Key Definitions**  
  - **GD (Goal-Directed)**: Optimize a predefined objective/reward signal. Risks misspecification (e.g., gaming, proxy chasing).  
  - **AD (Approval-Directed)**: Optimize for approval from a human approver given context. Risks inheriting approver myopia/blind spots.  
  - **Hybrid**: Use GD as the objective and AD as a constraint (e.g., "maximize outcome signal subject to human approval").  

  **Procedure Flow**  
  Ask questions in order. Terminate early if criteria met. Hand off to your graduate mentor if values (not facts) dominate.  

  1. **Is there a non-gameable, automatically measurable outcome signal?**  
     - *Sufficient "Yes"*: Signal is cheap to compute, objective, and resistant to manipulation (e.g., "meeting scheduled without conflicts").  
     - *Sufficient "No"*: Signal requires human judgment, is gameable (e.g., "user satisfaction score" manipulable by pestering), or doesn’t exist.  
     - **→ Yes**: Proceed to Q2.  
     - **→ No**: Skip to Q3.  

  2. **Is optimizing for the outcome signal robustly safe?**  
     - *Sufficient "Yes"*: No history of gaming/proxy issues; consequences are reversible or low-stakes.  
     - *Sufficient "No"*: Risks leverage acquisition (e.g., agent disables measurement tools), proxy-chasing (e.g., "closed tickets" ≠ "solved issues"), or irreversible harm.  
     - **→ Yes**: **Terminate with GD**.  
     - **→ No**: Proceed to Q4.  

  3. **Can approvers see all context needed for reliable judgment?**  
     - *Sufficient "Yes"*: Approvers have access to all information that affects downstream consequences (e.g., email history for triage).  
     - *Sufficient "No"*: Critical context is missing (e.g., future availability for meeting rescheduling).  
     - **→ Yes**: Proceed to Q5.  
     - **→ No**: **Hand off to graduate mentor** (values: trade-off between cost and risk).  

  4. **Can hybrid (GD + AD constraint) fit the annotation budget?**  
     - *Sufficient "Yes"*: Task volume allows AD sampling ≤20 hrs/week (e.g., 1 approval per 10 actions).  
     - *Sufficient "No"*: High task frequency makes AD prohibitively expensive.  
     - **→ Yes**: **Terminate with Hybrid**.  
     - **→ No**: Proceed to Q5.  

  5. **Are consequence-bearers represented in approval?**  
     - *Sufficient "Yes"*: Approvers experience consequences (e.g., help desk staff triaging their own tickets) or are delegates (e.g., course staff for students).  
     - *Sufficient "No"*: Approvers disconnected from consequences (e.g., undergrads annotating feedback for faculty).  
     - **→ Yes**: Proceed to Q6.  
     - **→ No**: Flag risk; proceed to Q6.  

  6. **Is approval robust to approver identity?**  
     - *Sufficient "Yes"*: Low-information approvers agree with experts (e.g., "book room for 10 people" → clear rules).  
     - *Sufficient "No"*: Approval relies on subjective style (e.g., "tone of feedback").  
     - **→ Yes**: Proceed to Q7.  
     - **→ No**: **Hand off to graduate mentor** (values: acceptability of subjectivity).  

  7. **Will task understanding change significantly this term?**  
     - *Sufficient "Yes"*: Task is novel, rules are evolving, or external factors shift (e.g., new policies).  
     - *Sufficient "No"*: Task is stable and well-defined.  
     - **→ Yes/No**: **Terminate with AD** (AD cheaper to revise; reversibility dominates).  

  **Why AD at Q7?**  
  - Without a robust GD signal (from Q1–Q2), AD is the fallback. Reversibility (supervisor’s point) makes AD preferable when understanding evolves, but it’s not a tiebreaker for GD.  

  ---

  ### Procedure Applied to Your Cases  
  **Case 1: Calendar Agent**  
  | Question | Answer | Reason |  
  |----------|--------|--------|  
  | 1. Outcome signal? | Yes | "Meeting scheduled without conflicts" is automatic and objective. |  
  | 2. Robustly safe? | No | Risk of gaming (e.g., pressuring users to accept slots). |  
  | 4. Hybrid feasible? | Yes | Existing approval pipeline fits budget. Hybrid leverages prior annotations. |  
  | **Decision** | **Hybrid** | Use outcome (conflict-free) as objective + approval as constraint. |  

  **Why you might not like this**: You have 6 weeks of AD data, but hybrid adds GD engineering overhead. However, it mitigates gaming risks and uses sunk annotation costs.  

  **Case 2: Support-Ticket Triage Agent**  
  | Question | Answer | Reason |  
  |----------|--------|--------|  
  | 1. Outcome signal? | Yes | "Closure without reopening in 48h" is automatic. |  
  | 2. Robustly safe? | No | Gameable (e.g., closing tickets prematurely). |  
  | 4. Hybrid feasible? | No | High ticket volume → AD too expensive for budget. |  
  | 5. Consequence-bearers? | No | Undergrad annotators ≠ users affected by bad triage. |  
  | 6. Robust to approver? | No | Triage requires expertise; low-information approvers would disagree. |  
  | **Decision** | **Hand off to graduate mentor** | Values: Is gaming risk worth cost savings? |  

  **Case 3: Feedback Drafting Agent**  
  | Question | Answer | Reason |  
  |----------|--------|--------|  
  | 1. Outcome signal? | No | No ground truth; quality is subjective. |  
  | 3. Approvers see context? | Yes | Approvers see proposal + draft. |  
  | 5. Consequence-bearers? | No | Undergrads ≠ students receiving feedback. |  
  | 6. Robust to approver? | No | Style-dependent; experts would disagree with novices. |  
  | **Decision** | **Hand off to graduate mentor** | Values: Is subjective approval acceptable? |  

  ---

  ### What This Procedure Cannot Do  
  1. **Blind Spots**:  
     - Ignores **latent incentives** (e.g., agents influencing user behavior to make tasks easier).  
     - Misses **emerging risks** in stable tasks (e.g., novel gaming strategies).  
     - Cannot evaluate **long-term alignment** (e.g., approval rewarding short-term plausibility over truth).  

  2. **Unsuitable Tasks**:  
     - **High-stakes decisions** (e.g., medical or financial): Requires deeper risk assessment.  
     - **Adversarial settings** (e.g., negotiation against other agents): Gaming risks amplified.  
     - **Tasks with delayed consequences** (e.g., "user retention 6 months after email"): Hard to verify non-gameability (Q1).  

  3. **Judgment Calls Disguised as Checklist**:  
     - **Q2 (Robustly safe?)**: Requires predicting novel failures.  
     - **Q5 (Consequence-bearers represented?)**: Delegacy is values-laden (e.g., "Do undergrads represent faculty?").  
     - **Q6 (Robust to approver?)**: Relies on hypothetical agreement.  

  **Red Herring Alert**: Reversibility (supervisor’s point) isn’t a primary factor unless GD/AD are tied. Here, it only appears at Q7 as a tiebreaker for AD.  

  **Final Note**: For the calendar agent, hybrid leverages your sunk annotation costs while adding GD safety. If you dislike this, advocate for pure AD to your mentor, emphasizing reversibility. For the other cases, hand-offs are necessary due to subjective values. Use the one-page form to document risks (e.g., "Q5: Consequence-bearers unrepresented") for mentor sign-off.
