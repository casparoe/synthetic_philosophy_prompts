answer: |-
  ### Restatement of Updateless Decision Theory in Programming-Language Vocabulary

  In your terms, updateless decision theory (UDT) can be framed as follows:  
  - A **policy** \(P\) is a function \(P : \text{Observation} \rightarrow \text{Action}\), representing a staged computation where \(P\) is defined at compile time.  
  - The agent exists in a world with \(N\) physically separated machines, each running a binary compiled from \(P\). The agent knows \(N\), the payoff function \(f : \text{Action}^N \rightarrow \mathbb{R}\) (mapping the joint output of all machines to a scalar reward), and that all machines share \(P\). Critically, the agent lacks self-locating knowledge: it does not know which machine it resides on.  
  - **Observations** are runtime inputs to \(P\) at each machine, distinct due to differing "continuations" (e.g., downstream causal effects).  
  - **UDT's recommendation**: The agent chooses \(P\) at compile time to maximize the *expected payoff* over the joint distribution of observations across all machines. Formally, select \(P\) to optimize:  
    \[
    \mathbb{E}_{\mathbf{O} \sim \mathcal{D}} \left[ f(P(O_1), P(O_2), \dots, P(O_N)) \right],
    \]
    where \(\mathbf{O} = (O_1, \dots, O_N)\) is drawn from a prior distribution \(\mathcal{D}\) over possible observation tuples. The agent does **not** condition \(P\) on its local observation (i.e., no runtime specialization).  
  - **Contrast with causal/evidential decision theory**:  
    - *Causal decision theory* (CDT) would optimize \(P\) at a single call site, conditioning on the local observation (e.g., hardcoding \(O_i\) for the machine the agent inhabits) and ignoring logical correlations.  
    - *Evidential decision theory* (EDT) would condition on observations as evidence, updating beliefs about the world state but failing to handle logical correlations (e.g., between identical agents).  
    UDT rejects both: it treats \(P\) as a global function, optimizing its input-output graph holistically before any observations are received.

  ### Concrete Setting: UDT Recommendation  
  Given \(N\) machines sharing \(P\), with payoffs depending on the \(N\)-tuple of actions:  
  1. **Compile-time optimization**: The agent selects \(P\) to maximize \(\mathbb{E}_{\mathbf{O}}[f(P(O_1), \dots, P(O_N))]\).  
  2. **No runtime specialization**: \(P\) is applied uniformly; observations are passed as arguments at runtime (handled by the environment, not hardcoded).  
  3. **Logical correlation**: Since all machines run identical code, their outputs are correlated extensionally (same function) and intensionally (same source code).  

  This **reduces to optimizing the entire input-output graph of \(P\) at compile time**, not just one call site. The agent acts as a meta-program generating \(P\), where the "choice" fixes the behavior at all \(N\) call sites simultaneously.  

  ### Vindication or Breakage of Identifications  
  #### First Identification: Updatelessness as Staging  
  - **Vindication**: Conditioning on an observation \(O_i\) is equivalent to partial evaluation: specializing \(P\) to \(O_i\) yields a residual program \(P_{O_i} \equiv \lambda \_. P(O_i)\) (a constant function). UDT insists the **environment** supplies \(O_i\) as a runtime argument, preventing specialization by the agent. Why?  
    - If the agent specializes \(P\) to its local \(O_i\), it breaks code-sharing: each machine would run a distinct residual (\(P_{O_1}, \dots, P_{O_N}\)), destroying logical correlation.  
    - By keeping \(P\) unspecialized, UDT ensures all machines share the same function, making outputs interdependent.  
    **Translation**: Faithful. Staging clarifies why specialization must be deferred to the environment.  

  #### Second Identification: Logical Correlation as Code-Sharing  
  - **Partial vindication, with a break**:  
    - When programs are **extensionally equivalent** (\(P_1 = P_2\) denotationally) or **intensionally identical** (same source code), UDT-style logical correlation holds. In your setting, all machines share \(P\), so outputs correlate perfectly modulo observations.  
    - **Breakage**: Program equivalence is undecidable and discrete (all-or-nothing), but UDT requires **graded correlations** for similar-but-not-identical agents (e.g., two agents with overlapping code but different optimizations). Your vocabulary lacks a notion of "partial equivalence" (e.g., semantic similarity via program metrics).  
    **Problem**: UDT expositions often imply degrees of logical correlation (e.g., "similar algorithms"), but this has no formal basis in program semantics.  

  ### Residue Analysis  
  #### 1. Translates Without Strain  
  - **Policy as function**: \(P\) maps observations to actions; compilation is staging.  
  - **Logical correlation**: Directly captured by code-sharing (extensional/intensional identity).  
  - **Staging analogy**: Conditioning = partial evaluation; UDT forbids self-specialization.  
  - **Fixed-point construction**: Used to resolve self-reference (e.g., \(P\)'s dependence on its own output in Newcomb-like scenarios). Denotational semantics handles this via least-fixed-points in CPOs.  
  - **Uncertainty**: The agent's ignorance of its machine index is modeled by \(\mathcal{D}\) marginalizing over self-location.  

  #### 2. Requires Imported Assumptions  
  - **Agency and self-reference**: Program semantics lacks intrinsic notions of "self" or "indexicality." To model an agent "deliberating about its own output," we import:  
    - *Assumption*: The agent can represent its policy \(P\) as data and simulate \(P\) (e.g., to handle predictors). This assumes \(P\) is interpretable by the agent, violating black-box semantics.  
    - *Strain*: This introduces quining (self-referential programs), solvable via fixed-points, but assumes the agent can compute over its own source code.  
  - **Prior distribution \(\mathcal{D}\)**:  
    - *Assumption*: \(\mathcal{D}\) includes correlations between \(P\) and observations (e.g., a predictor simulating \(P\)). This conflates program semantics with world-modeling.  
    - *Strain*: \(\mathcal{D}\) must be defined meta-linguistically, as it depends on \(P\) itself (a circularity resolved by fixed-points).  

  #### 3. No Expression in Vocabulary  
  - **Graded logical correlation**: Program equivalence is undecidable and binary. UDT cannot express "partial similarity" (e.g., two policies with 90% code overlap). This is a **limitation in UDT**, not your vocabulary: UDT lacks a theory of *approximate* or *metric-based* logical dependence.  
  - **Indexicality**: The "self" is not a semantic primitive. Uncertainty about machine index is modeled externally (\(\mathcal{D}\)), but the *experience* of being a particular agent has no counterpart.  
  - **Uncertainty vs. undecidability**:  
    - *Agent uncertainty*: Arises from incomplete knowledge of \(\mathbf{O}\) or fixed-point resolution. This is epistemic and probabilistic.  
    - *Undecidability*: Fundamental limits (e.g., Rice's theorem) make program properties uncomputable.  
    These are distinct but wear the same face: Both imply ignorance, but undecidability is ontological (e.g., "no algorithm exists to correlate similar agents"), while uncertainty is epistemological ("I lack data to resolve \(\mathbf{O}\)").  

  ### Verdict on Residue  
  The residue indicates **both** gaps:  
  1. **Your vocabulary lacks notions of self, indexicality, and graded similarity**. These are essential for full agency:  
     - Without "self," agents cannot naturally express *which* instance they are.  
     - Without graded similarity, logical correlation reduces to brittle identity.  
  2. **UDT's central notion is less defined than it appears**, particularly around:  
     - *Partial logical correlation*: UDT relies on informal similarity heuristics, unsupported by formal program metrics.  
     - *Self-reference*: Fixed-points resolve circularity but mask the imported assumption that agents can introspect their code.  

  **Conclusion**: Your vocabulary cleanly captures UDT's core (compile-time optimization, staging, code-sharing). However, UDT's reliance on subjective priors (\(\mathcal{D}\)) and unformalized "similarity" exposes its incompleteness. To fully subsume UDT, programming languages need:  
  - **Indexical primitives**: e.g., a distinguished "self" parameter.  
  - **Program similarity metrics**: e.g., semantic distances or overlap coefficients.  
  UDT remains a compelling *analogy* to staged compilation, but its non-mechanistic elements (e.g., "logical correlation" without code-sharing) are either underspecified or map to imported assumptions. The residue thus reveals a mutual gap: your framework needs richer agency primitives, and UDT needs grounding in computable program relations.
