answer: |-
  Here are the distilled desiderata for an adequate answer to the Special Composition Question (SCQ), integrating your requirements and cases. Desiderata marked **Non-Negotiable** are constraints any theory must satisfy; others reflect theoretical tensions.

  ---

  ### **Core Desiderata**
  1. **Distinction from Constitution/Coincidence**  
     *Non-Negotiable*.  
     Must resolve cases like the statue/clay: explain why they are distinct co-located objects (e.g., via modal or historical properties), not identical or mereologically coincident.  
     *Motivating Case*: A statue survives replacement of its arm but not being melted; the clay does not.

  2. **Resolution of Problem of the Many & Thinking Parts**  
     *Non-Negotiable*.  
     - *Problem of the Many*: For fuzzy-boundaried objects (e.g., a cloud), avoid proliferating equally eligible composites.  
     - *Thinking Parts*: Explain why a person thinks, but their arbitrary undetached head-complement does not (e.g., reject unrestricted mereological universalism for minds).  
     *Motivating Case*: A crowd of particles around a person has no clear boundary; no "cloud of particles-minus-one" is a thinker.

  3. **Causal Efficacy Without Systematic Overdetermination**  
     *Non-Negotiable*.  
     Composites must have irreducible causal powers (e.g., a hammer drives a nail), not merely inherit them from parts without pervasive overdetermination.  
     *Motivating Case*: If every part’s motion causes the nail’s movement, the hammer’s causal role is redundant.

  4. **Tribunal for Composition**  
     *Prejudice (Naturalism vs. Autonomy)*.  
     Must specify whether composition facts are fixed by:  
     - **Metaphysics alone** (e.g., universalism/nihilism), risking mismatch with science (e.g., denying ecosystems).  
     - **Special sciences** (e.g., biology for organisms), risking anthropocentrism or multiple composition relations.  
     *Motivating Cases*: Chemistry asserts molecules exist; astronomy asserts galaxies; biology asserts organisms. Denying these requires error-theory.

  5. **Vagueness/Extrinsicality Stance**  
     *Prejudice (Precision vs. Indeterminacy)*.  
     - *Vagueness*: Can composition hold vaguely (e.g., a melting glacier)?  
     - *Extrinsicality*: Can extrinsic facts (e.g., evolutionary context) affect whether *xs* compose?  
     *Motivating Case*: Is a dying organism still composite if its "life" is fading gradually?

  ---

  ### **Your Added Cases**
  6. **Borrowed Activity**  
     *Prejudice (Internalism vs. Holism)*.  
     For theories requiring unified activity (e.g., life):  
     - If an external synthetic organ sustains the organism, must it be included? **Worse horn: Exclusion**.  
       → Composition becomes extrinsic (depends on external sustainer).  
     - If included, boundaries shift arbitrarily. **Less bad: Inclusion**.  
       → Shows unifying relations *can* be vicarious (agency delegated).  
     *Key Lesson*: Demanding *intrinsic* unity may be untenable; holism is less destabilizing.

  7. **Near-Miss Problem**  
     *Non-Negotiable*.  
     Must reject *arbitrary* sharp cuts in continuous spectra (e.g., bonding strength). Options:  
     - **Vagueness**: Composition can be indeterminate (e.g., supervaluationism).  
     - **Degrees**: Composition holds to varying extents (risks blurring existence).  
     - **Salience**: Appeal to natural joints (e.g., homeostasis thresholds).  
     *Requirement*: Theory must *argue* for a stopping point in ordinary judgments (e.g., via pragmatic or teleological constraints).

  ---

  ### **Tensions and Exclusionary Power**
  - **Irreconcilable Pair**: **Tribunal Alignment** (sciences demand vague composites like ecosystems) vs. **Non-Arbitrariness** (metaphysics demands precise boundaries).  
  - **Most Exclusionary Requirement**: **Non-Arbitrariness** (Desideratum 7). It:  
    - Sinks *Brutalism* (composition facts are brute, offering no non-arbitrary cutoffs).  
    - Pressures *Life-Based Restrictivism* (fading life forces vague boundaries).  
    - Challenges *Universalism* (no principled basis to exclude near-misses).  
    - Favors *Nihilism* (no composites, no boundaries) or *Teleological Holism* (salient functions as natural joints).

  ---

  ### **Theories in Brief**
  - **Universalism**: Any *xs* compose something. *Fails*: Thinking parts, near-misses.  
  - **Nihilism**: No *xs* compose anything; only simples exist. *Fails*: Causal efficacy, tribunal.  
  - **Life-Based Restrictivism**: *xs* compose iff unified by life. *Fails*: Borrowed activity, near-misses.  
  - **Brutalism**: Composition has no informative analysis; facts are brute. *Fails*: Non-arbitrariness.

  ---

  \answer{No arbitrary composition boundaries.}
