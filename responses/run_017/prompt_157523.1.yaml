answer: |-
  Below is a complete, runnable design for your 75-minute session on the Platonia dilemma. It includes rules, materials, a minute-by-minute timeline, a payoff scheme with real stakes, exact wording for facilitation, debriefing guidance, and risk mitigation. The design ensures participants discover key insights through experience, avoids upfront philosophy, handles disruptions, and adapts to group size changes.

  ### **Core Mechanics & Materials**
  - **Pre-Session Survey (Sent 1–2 Days Prior)**:  
    Email participants 5 quantitative questions (scale 0–100) to compute similarity:  
    1. You receive $100 unexpectedly. How much would you give to a stranger?  
    2. In a sealed-bid auction for a $50 item, what would you bid?  
    3. Estimate the probability (%) of rain tomorrow in your city.  
    4. How many hours per week do you spend coding outside work?  
    5. On a scale of 0–100, how risk-seeking are you (0 = avoid all risk, 100 = embrace all risk)?  
    *Cluster participants into pairs ("echo pairs") using Euclidean distance (normalize answers to 0–1). Script in Python [here](https://gist.github.com/echo-platonia). If odd attendance, add yourself as a participant to ensure even pairs.*

  - **Session Materials**:  
    - Cards (one per participant) labeled "SEND" on one side, "DON’T SEND" on the other.  
    - A random number generator (e.g., [random.org](https://www.random.org/)) for the echo mechanic.  
    - A hat for public random draw (Round 4).  
    - Prizes: $50 cash per round (total $200 for 4 rounds).  

  - **Echo Mechanic (Run Live via Script)**:  
    For each pair, after decisions are sealed:  
    - With probability `c`, overwrite the echo’s card with the participant’s choice.  
    - With probability `1 - c`, leave the echo’s card unchanged.  
    *Correlation levels*: Round 1 (`c=0`), Round 2 (`c=0.5`), Round 3 (`c=1`).  

  - **Payoff Scheme**:  
    - Prize: $50 per round to the **only sender** (if exactly one "SEND" after echo adjustments).  
    - If zero or multiple send, no prize.  
    - Total possible payout: $200 (if all rounds have a winner), but likely less (budget-safe).  

  - **Key Adjustments**:  
    - **Group Size**: If **n** participants, use `p = 1/n` for randomization logic. For pairing, add yourself if odd.  
    - **Premature Solvers**: If someone announces randomization early, say: *"Interesting idea—let’s test it in the rounds. Everyone, focus on your own strategy for now."*  
    - **Round 4 (Public Draw)**: Essential—it contrasts with correlation and reinforces symmetry-breaking. Order: `c=0 → c=0.5 → c=1 → Public draw` (correlation increases logically).  

  ---

  ### **Timeline & Wording (75 Minutes Total)**  
  *Assume 18 participants. Adjust timing ±1 min per round for group size.*

  #### **Part 1: Setup & Rules (0:00–0:08 | 8 min)**  
  **Wording**:  
  *"Welcome! Today’s game is about a quirky challenge. Imagine an eccentric billionaire gathers 20 people and says: ‘If exactly one of you sends a telegram in 24 hours, that person gets $1 billion. If two or more send, or nobody sends, no one gets anything. No talking or coordinating allowed.’ We’ll simulate this with cards: ‘SEND’ or ‘DON’T SEND’. Each round, after you choose, I’ll apply a twist. If exactly one ‘SEND’ remains, that person wins $50 real cash. We’ll play 4 short rounds. Decisions are private—write nothing on cards except your choice. Ready? Let’s start."*  

  **Logistics**:  
  - Hand out cards.  
  - If someone mentions "Platonia," "superrationality," or randomization: *"Hold that thought—we’ll discuss after we see what happens."*  

  ---

  #### **Part 2: Rounds 1–4 (0:08–0:50 | 42 min)**  
  *Each round: 2 min explain, 2 min decide/collect, 2 min compute/reveal, 3 min discuss/prize.*  

  1. **Round 1: Low Correlation (`c=0`)** (0:08–0:16 | 8 min)  
     **Wording**:  
     *"Round 1: No twists yet. Everyone, choose SEND or DON’T SEND. Remember: You only win if you’re the only one who sends."*  
     - After collecting cards: *"I’ve paired you with someone whose pre-game answers resembled yours. But this round, I won’t change their choice. Let’s see what happened."*  
     - Run script (`c=0`). Reveal results (e.g., *"12 SENDs—no winner."*). Award $50 if one sender.  

  2. **Round 2: Medium Correlation (`c=0.5`)** (0:16–0:24 | 8 min)  
     **Wording**:  
     *"Round 2: Now, when you choose, there’s a 50% chance I’ll change your echo’s card to match yours. If you SEND, they might too; if you DON’T, they might not."*  
     - After collecting: *"I’m flipping coins to decide if I change echo cards."*  
     - Run script (`c=0.5`). Reveal (e.g., *"3 SENDs—no winner."*). Award prize if applicable.  

  3. **Round 3: High Correlation (`c=1`)** (0:24–0:32 | 8 min)  
     **Wording**:  
     *"Round 3: Now, if you choose SEND, I will change your echo’s card to SEND. If you choose DON’T, I’ll change theirs to DON’T. Your choice directly affects theirs."*  
     - After collecting: *"I’m overwriting all echo cards to match yours."*  
     - Run script (`c=1`). Result will show 0, 2, 4, etc. sends (never 1). *"6 SENDs—no winner. Notice anything?"*  

  4. **Round 4: Public Random Draw** (0:32–0:42 | 10 min)  
     **Wording**:  
     *"Round 4: New approach. I’ll draw one name from this hat. That person is the designated sender. Everyone else must NOT send. If only they send, they win $50. If multiple send, no one wins."*  
     - Draw one name. *"[Name], you’re designated. Others, DON’T SEND. But it’s your choice—I can’t enforce it."*  
     - Collect cards. No echo mechanic. *"Only [Name] sent? They win $50! / Multiple sent? No winner."*  

  ---

  #### **Part 3: Debrief (0:42–1:15 | 33 min)**  
  **Goals**: Link observations to your four key points. Use Socratic questioning—*"What did you see?"*—not lecturing.  

  | Time  | Key Point                          | Facilitation Wording & Activity                                                                                                                                                                  | Why It Works                                                                 |
  |-------|------------------------------------|--------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|-----------------------------------------------------------------------------|
  | 0:42–0:47 | **Point 1: Abstention isn’t a solution** | *"In Round 1, many abstained or sent. What happened? If everyone abstains, do you win? If everyone sends? [They’ll say ‘no win’]. Exactly—both extremes fail. Restraint alone doesn’t help."*                                  | Uses Round 1’s failure to show abstention = greed in outcome.               |
  | 0:47–0:55 | **Point 2: Randomized claiming**   | *"In Round 4, we forced one sender. But could we do this randomly without a hat? How? [Wait for ‘flip a coin’]. What probability? [Nudge: ‘If 18 people, what chance?’]. Yes, ~1/18. Why? [Discuss]."* | Public draw primes randomization; group constructs `p=1/n` logic.           |
  | 0:55–1:05 | **Point 3: Correlation’s role**    | *"Round 3: When your choice controlled your echo, what happened? Why couldn’t anyone win? [They’ll note pairs match]. Did you want to send? Why not? [Key: ‘I’d cause two sends’]. Exactly—correlation made sending self-defeating. Not kindness, just inevitability."* | Round 3’s impossibility forces insight; highlight lack of altruism/trust.   |
  | 1:05–1:12 | **Point 4: Perfect correlation → unwinnable** | *"In Round 3, at 100% correlation, the prize vanished. Why? [Elicit: ‘Pairs stick together’]. So: If you send, you create a pair (lose). If you don’t, you get nothing. Correlation killed the prize."* | Reinforces Point 3; uses Round 3’s result as proof.                         |
  | 1:12–1:15 | **Objection Handling**             | *"Someone might say: ‘But the echo’s card was sealed—my choice didn’t cause theirs!’ True. This simulates a world where decisions correlate. In reality, if others think like you, your choice signals theirs. This activity shows why correlation matters, but it can’t prove how real-world correlation works—that’s philosophy."* | Acknowledges causality debate; separates simulation from theory.            |

  ---

  ### **What Will Go Wrong & Mitigation**  
  | Issue                        | Fatal? | Mitigation & Debrief Use                                                                                                |
  |------------------------------|--------|------------------------------------------------------------------------------------------------------------------------|
  | **Spontaneous coordination** | No     | *Preempt*: Start with *"No talking during decisions."* *Debrief*: *"Did anyone try to coordinate? Why couldn’t it work?"* → Highlights communication ban. |
  | **Side deals/bribes**        | No     | *Preempt*: *"No deals—this is about individual choices."* *Debrief*: *"If bribes happened, would they scale to 20 people?"* → Shows trust failures. |
  | **Contrarian claims**        | No     | *Debrief*: *"Did someone send ‘to be funny’? How did that affect outcomes?"* → Illustrates fragility of non-symmetric strategies. |
  | **"Psychology experiment!"** | No     | *Respond*: *"Nope, just a game—focus on winning $50."* *Debrief*: *"Did suspicion change your strategy?"* → Discusses trust in setups. |
  | **Accusations of cheating**  | No     | When `c=1` kills prize: *"This was the rule—your choice forced your echo’s. Why did this make winning impossible?"* → Proves Point 4. |
  | **Low attendance (e.g., 9)** | No     | Add yourself to make 10. Use `p=1/10`. *Debrief*: *"Smaller group changes the probability—but not the logic."*                             |

  **Fatality Note**: No issue is fatal—all are debriefing fodder. The only **unsimulatable element** is true symmetric reasoning (participants don’t experience shared cognition; you only stage correlation). Admit in debrief: *"We forced correlation with echoes—in reality, it arises from shared logic. This game shows why correlation matters, but not how it forms."*

  ---

  ### **Post-Session Notes**  
  - **Slides/Shared Doc**: Share a recap with key takeaways:  
    > 1. Abstention fails like greed (no prize).  
    > 2. Randomization (`p=1/n`) is the fix.  
    > 3. Correlation, not altruism, drives restraint.  
    > 4. Perfect correlation kills the prize.  
  - **Feedback**: End with: *"How would you apply this to system design? Think: distributed consensus, load balancing."*  
  - **Scripts**: Use [this Python script](https://gist.github.com/echo-platonia) for pairing and echo simulation.  

  This design ensures experiential learning, uses real stakes for engagement, and turns disruptions into teachable moments. Run it as-is—you’ll crush it!
