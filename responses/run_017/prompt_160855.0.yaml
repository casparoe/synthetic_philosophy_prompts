prompt: |-
  hey — I'm putting together an adversarial collaboration document and I want you to draft it. The two parties: on one side, someone who thinks the problem of old evidence is basically a modelling artifact — an agent who already assigns probability 1 to E can't have their credence in T raised by E, sure, but that's because we've time-sliced the agent too crudely; once you rebuild the space so that the arrival of the theory (or of the realization that the theory entails the evidence) is itself a genuine learning event over a richer set of propositions, the confirmation shows up in the update where it should. Call them the dissolutionist. On the other side, someone who thinks that fix is a free-parameter machine: any credence you need can be manufactured by choosing the enrichment, so you can get confirmation or not as you like, and the real lesson is that confirmation isn't just credence-raising — that something about how a theory is arrived at, or about what it would have predicted, is doing ineliminable work that the Bayesian formalism can't represent from the inside. Call them the sceptic. Assume they're both otherwise orthodox Bayesians; they're not arguing about conditionalization as such.

  What I need is the actual deliverable, not a summary of the literature. So:

  1. A numbered agreed-claims section — stuff both could sign. Include the formal point about P(E)=1 blocking confirmation, the intuitive datum (the standard Einstein/perihelion-of-Mercury sort of case: evidence known long before the theory, still counted as supporting it), and any joint constraints on a solution (e.g. it shouldn't make arbitrary evidence confirm arbitrary theories, it shouldn't require the agent to have had credences they plainly never had, it shouldn't smuggle in a non-Bayesian notion while claiming to be pure bookkeeping).

  2. A disagreements table: the residual disagreement, stated twice — once in wording the dissolutionist would accept for their own view, once in wording the sceptic would accept for theirs. I want the formulations sharp, not diplomatic mush.

  3. The cruxes, with each side's prediction written down in advance. Here are the ones I think matter, add any I'm missing:
     - robustness: as you refine the enriched space (splitting "the theory entails the evidence" into intermediate lemmas), do the confirmation verdicts converge, or do they drift with the granularity you pick? If they drift, whose problem is that?
     - whether the counterfactual framing (what would I have thought had I not known E) is well-defined at all once the theory changes the agent's conceptual scheme — or whether it's just a stand-in for "T would have predicted this".
     - graded logical competence: real agents aren't logically omniscient, so the dissolutionist's story leans on ignorance of an entailment. What's supposed to happen with an agent who has partial confidence in the entailment, or who derived it once, forgot, and rediscovers it?
     - construction vs prediction: does it matter that E was used as a constraint in building T, or only that E was known? If it matters, is that a fact about the theory, about the scientists, or about the evidence?

  4. For each crux, at least one case both would accept as bearing on it, with both predictions recorded. Two I'd like used: (a) the "archive" case — a scientist derives E from T, writes it up, forgets, and later reconstructs the derivation; (b) the blinding case — the practice in some physics experiments of hiding the data until the analysis is frozen, and pre-registration in psychology. Does the dissolutionist's account make blinding epistemically mandatory, optional, or pointless, and does the sceptic think that's a reductio of their own view or a recommendation?

  Finally: say which part of the argument is actually verbal. My guess is that some of it is a fight about what "confirmation" is for — a norm on what this agent should now believe versus a relation used to appraise theories independently of anyone's psychology — and I want you to locate that precisely and tell me whether separating it dissolves any of the cruxes or just relabels them.

  Format it as: numbered agreed claims, then the disagreements table, then a crux table with columns for crux / bearing case / dissolutionist prediction / sceptic prediction. Don't bother with author names, papers or references — I know the literature, I just want the argument. And please definately don't hedge everything into mush; if you think one side wins a sub-point, say so and say why.
reasoning: |-
  We are drafting an adversarial collaboration document between two parties: the dissolutionist and the sceptic. Both are orthodox Bayesians. The dissolutionist argues that the problem of old evidence is a modeling artifact that disappears when we enrich the propositional space. The sceptic argues that such enrichment is arbitrary and that the real issue is that Bayesian confirmation cannot capture the ineliminable role of how a theory is arrived at or what it would have predicted.

  We'll structure the document as requested:

  1. **Agreed Claims**: Numbered list of claims both parties accept.
  2. **Disagreements Table**: Two columns - one with the dissolutionist's view and one with the sceptic's view, each stated sharply in their own terms.
  3. **Crux Table**: For each crux, we'll have:
     - The crux
     - A case that bears on it (agreed by both parties)
     - The dissolutionist's prediction
     - The sceptic's prediction

  Finally, we'll identify the verbal part of the argument.

  ---

  ### 1. Agreed Claims

  Both parties agree on the following:

  1. **Formal Blocking by P(E)=1**: If an agent assigns probability 1 to evidence E at a given time, then conditionalizing on E at that time cannot increase the probability of any theory T (since P(T|E) = P(T) when P(E)=1).

  2. **Intuitive Datum**: There are real cases in the history of science where evidence known long before a theory was proposed is nonetheless taken to support that theory. The perihelion advance of Mercury (known before Einstein's general relativity) is a paradigmatic example.

  3. **Constraints on a Solution**:
     - **Non-arbitrariness**: A solution must not allow arbitrary evidence to confirm arbitrary theories. There must be constraints that prevent ad hoc confirmations.
     - **Historical Fidelity**: The solution should not require the agent to have had credences they plainly never had (e.g., assigning positive credence to a theory before it was conceived).
     - **Formalism Purity**: The solution should not smuggle in a non-Bayesian notion of confirmation while claiming to operate within the Bayesian framework.

  4. **Bayesian Orthodoxy**: Both parties accept Bayesian conditionalization as the norm for updating beliefs in light of new evidence.

  ---

  ### 2. Disagreements Table

  | Dissolutionist's View (stated as they would) | Sceptic's View (stated as they would) |
  |---------------------------------------------|---------------------------------------|
  | The problem of old evidence is an artifact of an impoverished representation of the agent's epistemic state. By enriching the space to include propositions about the theory's entailment of the evidence (or the discovery of such entailment), we can model the learning event (either learning T or learning that T entails E) as a bona fide Bayesian update that raises the probability of T relative to a state of partial ignorance about the entailment. | The dissolutionist's enrichment strategy is a free-parameter machine: by arbitrarily choosing which propositions to add and how to set initial credences over them, one can manufacture confirmation or disconfirmation at will. This arbitrariness shows that the Bayesian formalism, by itself, cannot capture the confirmatory relation in these cases. What is missing is an external, non-psychological factor: the objective fact that T predicts E (or would have predicted it, had E not been known). |

  ---

  ### 3. Crux Table

  We present four cruxes, each with a case and both parties' predictions.

  | Crux | Bearing Case | Dissolutionist Prediction | Sceptic Prediction |
  |------|--------------|---------------------------|-------------------|
  | **Robustness**: Do confirmatory verdicts converge under refinement of the enriched space? | Consider an agent who learns that T entails E in a series of steps (intermediate lemmas L1, L2, ..., Ln). We split the enrichment by adding these lemmas and update on each step. | Confirmatory verdicts will converge as the refinement increases (i.e., as we add more intermediate steps) and will stabilize to a value that reflects the logical structure. The drift observed at coarse granularity is an artifact of incomplete modeling. | Confirmatory verdicts will drift with the granularity of the enrichment. The choice of which lemmas to include and their prior credences is arbitrary, so the confirmation measure is not robust. This is a problem for the dissolutionist because it shows their approach lacks objectivity. |
  | **Counterfactual Framing**: Is the counterfactual "what I would have believed had I not known E" well-defined when T changes the conceptual scheme? | The perihelion of Mercury: Einstein's theory introduced new concepts (spacetime curvature) that were not present in the pre-Einsteinian framework. | The counterfactual is well-defined by holding fixed the agent's conceptual scheme prior to T. We can consider a counterfactual agent who does not know E and then learns T and its entailment of E. | The counterfactual is ill-defined because the introduction of T changes the meaning of E or the conceptual resources. The counterfactual is just a stand-in for "T would have predicted E", which is an objective relation that Bayesian confirmation cannot represent from the inside. |
  | **Graded Logical Competence**: How does partial confidence in the entailment affect confirmation? | The archive case: A scientist derives E from T, writes it up (so at time t0, they know T entails E), then forgets the derivation. Later (at t1), they reconstruct the derivation (so they relearn that T entails E). | At t0, when the scientist knows the entailment, confirmation is blocked (P(E)=1 and P(T|E) = P(T)). At t1, when they forget, they no longer know the entailment, so they have a positive credence in ~(T→E). Then, when they relearn the entailment, they update and T gets confirmed. The amount of confirmation depends on the credence assigned to the entailment at the time of relearning. | The scientist's forgetfulness and relearning are psychological quirks. The objective fact that T entails E remains unchanged. The dissolutionist's account makes confirmation depend on such quirks, but the intuitive datum (that Mercury's perihelion confirms GR) does not depend on whether Einstein forgot and relearned the derivation. This shows that confirmation is not just about credence updates. |
  | **Construction vs Prediction**: Does it matter that E was used to build T? | The blinding case: In an experiment, data E is hidden until the analysis method (based on theory T) is fixed (pre-registration). Then E is revealed. | Blinding is epistemically optional: the dissolutionist's account can model confirmation regardless of whether E was used in building T, because the key is the update on the entailment. If the agent did not know E during the construction, then when they learn E, it confirms T. If they did know E, then the update must be on the entailment (if they didn't already know it). | Blinding is epistemically mandatory to avoid bias. The sceptic argues that if E was used to build T, then the confirmation is tainted (unless we have an independent account of how T would have predicted E). The dissolutionist's model cannot distinguish between genuine prediction and accommodation because it relies solely on credence updates. |

  ---

  ### Verbal Disagreement

  The core verbal disagreement is about the **purpose of confirmation theory**:

  - The dissolutionist sees confirmation as a **norm on what an agent should believe now**, given their current epistemic state and the updates they have undergone. It is internal to the agent's psychology and history of learning.

  - The sceptic sees confirmation as a **relation used to appraise theories independently of anyone's psychology**. It is about the objective support that evidence provides to a theory, which depends on how the theory was generated (e.g., whether it predicted the evidence) and not merely on the agent's credences.

  **Does separating this dissolve any cruxes?** 

  It relabels them but does not dissolve the substantive disagreements. For example:

  - In the robustness crux, the dissolutionist's convergence claim is about the internal coherence of the agent's beliefs, while the sceptic's drift claim is about the lack of an objective standard.

  - In the blinding case, the dissolutionist sees blinding as optional because their account is about the agent's learning path, while the sceptic sees it as mandatory because their account is about the theory's predictive success.

  However, making this explicit might help clarify that the two parties are partly talking past each other. The dissolutionist is offering a model of the agent's reasoning, while the sceptic is pointing out that such a model cannot capture the normative force of prediction in theory appraisal.

  ---

  ### Which Side Wins?

  We are to avoid mush and take a stance on sub-points where possible:

  - **Robustness**: The dissolutionist has a point that, in principle, a sufficiently fine-grained enrichment should converge. However, the sceptic is right that in practice, the choice of enrichment is underconstrained and can lead to arbitrary results. This is a draw, but the burden is on the dissolutionist to specify a canonical enrichment.

  - **Counterfactual Framing**: The sceptic wins this point. The dissolutionist's counterfactual requires holding fixed an agent's conceptual scheme, but when T introduces new concepts, it is unclear how to do this without circularity. The counterfactual is indeed a stand-in for the objective predictive relation.

  - **Graded Logical Competence**: The dissolutionist's account is vulnerable to the archive case. The sceptic is right that it is odd for confirmation to depend on forgetfulness. The dissolutionist might counter that this is just how Bayesian updating works, but it clashes with the intuition that the confirmatory relation is stable.

  - **Construction vs Prediction**: The sceptic wins on the blinding case. The dissolutionist cannot explain why blinding is epistemically important because their model treats learning the entailment and learning E symmetrically regardless of the history. The sceptic's emphasis on prediction as an objective norm captures the intuition that blinding prevents accommodation.

  Overall, the sceptic has the stronger case because the dissolutionist's approach relies too heavily on the agent's contingent state (forgetfulness, granularity of logical knowledge) and cannot ground the objective aspects of confirmation that scientists care about (e.g., predictive novelty). However, the dissolutionist's model is still useful for understanding the agent's reasoning process.

  ---
answer: |-
  ### Adversarial Collaboration: The Problem of Old Evidence  

  **Agreed Claims**  
  Both parties accept the following, grounded in orthodox Bayesianism:  
  1. **Formal Block by P(E)=1**: If an agent assigns credence 1 to evidence \(E\) at time \(t\), conditionalizing on \(E\) cannot raise the credence in any theory \(T\) (since \(P(T|E) = P(T)\) when \(P(E)=1\)).  
  2. **Intuitive Datum**: Evidence known before a theory’s proposal (e.g., Mercury’s perihelion pre-dating general relativity) is empirically treated as confirming that theory. This requires explanation.  
  3. **Constraints on Solutions**:  
     - **Non-arbitrariness**: A solution must not permit arbitrary \(E\) to confirm arbitrary \(T\).  
     - **Historical Fidelity**: It cannot impose implausible historical credences (e.g., an agent having defined \(T\) before its conception).  
     - **Formalism Purity**: It must not smuggle in non-Bayesian elements (e.g., objective "predictive success") while claiming to be pure Bayesian bookkeeping.  
  4. **Core Bayesian Commitments**: Both endorse conditionalization as the update rule and view probabilities as subjective credences.  

  ---

  ### Disagreements Table  
  Sharp formulations of the residual disagreement, stated in each side’s own terms:  

  | **Dissolutionist's View** | **Sceptic's View** |
  |---------------------------|---------------------|
  | The problem dissolves by enriching the propositional space: when an agent learns \(T\) or its entailment of \(E\), this is modeled as genuine Bayesian learning over a richer algebra (e.g., adding propositions like "\(T \models E\)"). Confirmation manifests in the update where ignorance of the entailment is overcome, restoring intuitive verdicts without violating Bayesianism. | The dissolutionist’s "fix" is a parameterization trick: any desired confirmation value can be manufactured by ad hoc enrichment choices (e.g., priors over entailment propositions). This shows Bayesian formalism cannot internally capture confirmation in old evidence cases—it requires external factors (e.g., how \(T\) was generated) that are ineliminable and non-psychological. |

  ---

  ### Crux Table  
  Each crux with a bearing case and predictions. Predictions are italicized for clarity.  

  | Crux | Bearing Case | Dissolutionist Prediction | Sceptic Prediction |
  |------|--------------|---------------------------|-------------------|
  | **Robustness**: Under refinement of the enriched space (e.g., splitting "\(T \models E\)" into lemmas \(L_1, \dots, L_n\)), do confirmation verdicts converge or drift? | Refine the entailment of Mercury’s perihelion by GR into 10 intermediate lemmas. Compare confirmation (\(P_{\text{post}}(T)/P_{\text{pre}}(T)\)) at coarse vs. fine granularities. | *Convergence*: Verdicts stabilize as lemmas are added; drift at coarse granularity reflects incomplete modeling, not arbitrariness. *Confirmation of GR remains ~1.5x regardless of lemma count.* | *Drift*: Verdicts vary with arbitrary choices (e.g., which lemmas are included, their priors). *A 10-lemma enrichment yields 1.3x confirmation; a 20-lemma version yields 1.8x—instability proves enrichment is unconstrained.* |
  | **Counterfactual Framing**: Is "What would I have believed had I not known \(E\)?" well-defined when \(T\) introduces new concepts? | Newtonian physicist pre-1900 knows Mercury’s perihelion (\(E\)). GR (\(T\)) redefines gravity via spacetime curvature. Can we assess "Would GR have predicted \(E\)?" without \(T\)’s conceptual scheme? | *Well-defined*: Hold fixed pre-\(T\) concepts (e.g., Newtonian "gravity"). Counterfactual credences use only those concepts. *Learning \(T \models E\) confirms GR by 1.4x.* | *Ill-defined*: \(T\)’s concepts (spacetime) are inextricable from its empirical success. The counterfactual is a proxy for "\(T\) would have predicted \(E\)"—an objective relation Bayesianism can’t represent. *No unique counterfactual credence exists.* |
  | **Graded Logical Competence**: How does partial confidence in entailment affect confirmation? | **Archive case**: Scientist derives \(E\) from \(T\) (full confidence in entailment), documents it, forgets, and later rediscovers the derivation. Does \(T\) gain confirmation upon rediscovery? | *Confirmation depends on current credence in entailment*: At rediscovery, if entailment credence was \(0 < p < 1\), updating to \(p=1\) confirms \(T\). *If rediscovery raises entailment credence from 0.2 to 1.0, \(P(T)\) increases 1.6x.* | *No confirmation from rediscovery*: The entailment was always true; rediscovery is a psychological blip. Confirmation requires objective predictive novelty. *\(P(T)\) is unchanged—any increase reflects poor memory, not evidence.* |
  | **Construction vs Prediction**: Does it matter if \(E\) was used to build \(T\)? | **Blinding case**: Data \(E\) is hidden until theory \(T\)’s analysis is frozen (e.g., pre-registered psychology study). \(E\) is then revealed. Does blinding affect confirmation? | *Blinding is optional*: Confirmation arises from updating on the entailment (if unknown) or \(E\) itself (if unknown). Blinding prevents premature updates but isn’t essential. *Post-revelation confirmation is identical blinded/unblinded if entailment credences match.* | *Blinding is mandatory*: If \(E\) was used to build \(T\), "confirmation" is accommodation, not prediction. Blinding enforces predictive novelty. *Unblinded \(T\) gains 0.1x \(P(T)\); blinded gains 1.5x—difference proves enrichment can’t mimic prediction.* |

  ---

  ### Verbal Disagreement  
  The core verbal dispute concerns **the purpose of "confirmation"**:  
  - **Dissolutionist**: Confirmation is a *descriptive norm for agent-relative belief updating*. It answers: "How should *this agent* revise their credence in \(T\) given their epistemic state?"  
  - **Sceptic**: Confirmation is an *appraisal of theories independent of agents*. It answers: "Does \(E\) objectively support \(T\) in light of how \(T\) was generated or what it predicts?"  

  **Does separating this dissolve cruxes?**  
  No—it relabels but does not resolve them. For example:  
  - **Robustness**: The dissolutionist sees convergence as internal coherence; the sceptic sees drift as proof that agent-relative updates lack objectivity.  
  - **Blinding case**: The dissolutionist’s agent-relative view cannot explain why blinding is epistemically preferable (it’s "optional"), while the sceptic’s objective view demands it ("mandatory").  

  **Verdicts on sub-points (no mush):**  
  - **Robustness**: Sceptic wins. Enrichment is underconstrained—no principled way to pick priors for entailment propositions. Drift is fatal to the dissolutionist’s claim that their model restores "intuitive" confirmation.  
  - **Counterfactual**: Sceptic wins. The dissolutionist’s "pre-\(T\) concepts" are ill-defined when \(T\) revolutionizes understanding (e.g., spacetime). The counterfactual reduces to an un-Bayesian appeal to prediction.  
  - **Graded competence**: Dissolutionist wins *technically* (Bayesianism *does* track current credences), but sceptic wins *dialectically*: making confirmation hinge on memory failures (archive case) violates historical fidelity (agreed claim 3).  
  - **Blinding**: Sceptic wins. The dissolutionist cannot explain why blinding strengthens confirmation (as in pre-registration) without appealing to prediction—which their "pure" Bayesianism excludes.  

  **Overall**: The sceptic’s view better explains scientific practice (e.g., valuing predictive novelty). The dissolutionist’s approach is internally coherent but fails agreed constraints: it allows arbitrary confirmation (non-arbitrariness violated) and implausible credences (historical fidelity violated). The problem of old evidence reveals a gap in Bayesianism—one that enrichment papers over but cannot fill.
