  First, I need to recall the St. Petersburg paradox and why expected value fails there. The user mentions Bernoulli's log utility solution but points out Menger's critique—unbounded utility brings back the problem. They don't want a rehash of these solutions; instead, they want to understand why institutions behave the way they do.

  The user lists examples: casinos with bet caps, lotteries capping jackpots, insurers using reinsurance, traders with VaR limits. All these entities price using expected value but then limit exposure at levels that seem too low given their capital. The user's main question is: what implicit theory of rationality underpins this?

  I should consider possible explanations. Bounded utility? But the user might see that as ad hoc. Ruin constraints? That's about survival, but casinos have deep pockets. Maybe agency problems or regulatory factors? The user mentioned Knightian uncertainty about tail models. Also, the ergodicity economics angle by Ole Peters—is it just relabeled log utility or something more?

  The user wants a clear distinction between settled math and contested theories. They also ask about an entity with infinite capital—should it drop bet limits? If yes, that makes limits pragmatic; if not, there's a principle involved. Plus, how does spreading risk across many players affect this?

  I need to structure the answer. Start by acknowledging the institutional practices. Then break down the theories: bounded utility, ruin/CPP, ergodicity. Explain each, their strengths, and critiques. Highlight where the user's examples fit—casinos might be ruin-avoidance, insurers reinsurance due to capital constraints. 

  For the infinite capital case, argue that without ruin risk, pure EV maximization could work, but Knightian uncertainty might still apply. However, with many players, the law of large numbers kicks in, so maybe limits aren't needed. But tail model uncertainty persists. 

  Finally, clarify that ergodicity isn't just log utility relabeled—it's about non-ergodic processes where time averages differ from ensemble averages. But in many cases, it reduces to Kelly/log utility. 

  End by separating settled math (EV for pricing) from contested areas (ergodicity, utility boundaries). Note that institutional practices are pragmatic mixes, not pure theory applications. The user's deep understanding means avoiding oversimplification and highlighting nuances and open debates.
answer: |-
  Your observation cuts to the heart of the tension between normative decision theory and institutional risk management. The pattern you describe – pricing via expected value (EV) but sizing via strict truncation – reflects a pragmatic, often *precautionary* approach grounded in operational realities and deeper structural constraints, rather than a single, coherent "theory of rational choice" that cleanly replaces EV maximization. Here's a breakdown of the key underpinnings, their strengths/weaknesses, and how they map to your examples:

  **Core Institutional Drivers (The Pragmatic "Why"):**

  1.  **Finite Capital & Ruin Avoidance (Even for "Large" Entities):** While a parent company might have vast assets, the *operating unit* (casino table, trading desk, insurer's line) typically has allocated capital. Losing multiples of that allocation in a single tail event can trigger regulatory intervention, loss of reputation, internal restructuring, or even unit shutdown – even if the parent survives. This is **survival in an operational sense**, not literal bankruptcy. Kelly/log-optimal growth minimizes *probability* of ruin over time, but institutions often prioritize avoiding *any* single loss exceeding operational tolerance ("gambler's ruin" applied locally).
  2.  **Model Uncertainty & Knightian Doubt:** Institutions *know* their probability models (especially for extreme tails) are imperfect or incomplete. The St. Petersburg game assumes perfect knowledge of a fair coin and infinite capability. In reality:
      *   **Casinos:** Fear collusion, dealer error, physics-defying streaks, or unknown edge cases.
      *   **Insurers:** Face "model risk" – catastrophes (natural or man-made) can be worse, more frequent, or fundamentally different than models predict ("unknown unknowns").
      *   **Traders:** Know markets can gap, correlations break, liquidity vanish in ways models don't capture.
      *   **Lotteries:** Manage political/PR risk if jackpots become absurdly large or frequently hit.
      *   Truncation acts as a **robustness hedge against model error**. Paying EV relies on the model being correct *all the way out*. Truncating says, "We're confident in the model up to X; beyond that, we don't trust it enough to risk capital."
  3.  **Agency Problems & Stakeholder Management:** Decision-makers (traders, underwriters, casino managers) aren't optimizing the infinite-horizon wealth of the ultimate owners. They face performance evaluations, bonuses, career risk, and oversight.
      *   Losing $10M on a single 1-in-a-million bad bet (even if +EV) is far more likely to get someone fired than making $0.01M profit consistently via many small +EV bets. Truncation protects the *agent*.
      *   Stakeholders (regulators, shareholders, rating agencies, customers) have asymmetric tolerance. Losing a huge sum in a tail event often draws more scrutiny than consistently earning a small margin. Truncation manages stakeholder perception and regulatory capital requirements (which themselves often embed truncation via risk weights).
  4.  **Liquidity & Cash Flow Constraints:** EV is a long-run *average*. Paying out a massive tail loss *now* (e.g., a reinsurance claim, a huge jackpot) requires immediate liquidity, which has a cost. Graduated annuities (lotteries), reinsurance layers, and position limits help smooth cash flow, even if the net present value calculation suggests a lump sum is equivalent (liquidity risk and funding costs break this equivalence).
  5.  **Adverse Selection (Even Beyond Advantage Play):** Offering truly unlimited stakes can attract precisely the counterparties who know something you don't or have a structural edge you missed. Caps limit exposure to this selection.

  **Mapping to Theories of Rationality (The Normative "What"):**

  *   **Expected Value Maximization:** **Incompatible.** The practice of truncation explicitly rejects maximizing divergent or very high-variance EVs when the tails are "too fat" relative to capital or model confidence. Pricing *uses* EV for the *priced portion*, but the refusal to offer the full gamble refutes pure EV maximization as the governing principle for exposure.
  *   **Expected Utility Theory (EUT) with Concave Utility (e.g., Log Utility):**
      *   **Compatible in Principle, but...** It explains why individuals pay little for St. Petersburg (finite EU under log utility). For institutions, a sufficiently concave *corporate* utility function (e.g., value of survival) justifies truncation. Kelly/log-optimal betting is EU max under log utility.
      *   **Critique:** Menger's point stands – unbounded utility revives the paradox for super-favorable bets. More critically for institutions, **EUT doesn't inherently capture model uncertainty or agency problems.** Choosing a utility function steep enough to justify observed truncation levels often seems *ad hoc* or post-hoc. Is the utility function primitive, or is it a way to *represent* the operational constraints (1-5 above)?
  *   **Capital Growth / Kelly Criterion / Log-Optimality:**
      *   **Strongly Compatible (with caveats).** This is the closest normative fit for *repeated*, independent favorable gambles. Kelly maximizes the long-run growth rate of capital, inherently avoiding ruin and reducing variance relative to linear growth. Position sizing caps can be seen as rough approximations of fractional Kelly betting, ensuring no single bet risks a ruinous fraction of capital.
      *   **Mapping to Practice:** Casinos sizing table limits relative to bankroll, traders sizing positions relative to book capital, insurers keeping retentions within risk-bearing capacity – all echo Kelly logic. Reinsurance is explicitly about shedding "overbet" layers. **This is a key reason institutions appear risk-averse over "small" stakes: the stake isn't small relative to the *operational unit's* risk capital or the maximum fractional bet size deemed growth-optimal/safe.**
      *   **Caveat:** Kelly assumes known probabilities and repeated, independent bets. Institutional truncation also hedges model uncertainty (point 2) and agency issues (point 3), which pure Kelly doesn't address.
  *   **Survival / Ruin Minimization / Constant Proportion Portfolio Insurance (CPPI):**
      *   **Compatible & Pragmatic.** This prioritizes avoiding *any* loss that drives capital below a critical threshold (ruin). It often leads to more aggressive truncation than Kelly. While Kelly maximizes growth *given survival*, ruin minimization might accept lower growth for higher survival certainty. This aligns well with the operational survival instinct (point 1). CPPI dynamically adjusts exposure downward as capital approaches a floor.
      *   **Critique:** Can be overly conservative, sacrificing significant +EV opportunities for marginal reductions in already-low ruin probabilities. Doesn't directly address model uncertainty.
  *   **Ergodicity Economics / Time-Average Growth (Ole Peters et al.):**
      *   **What it claims to be:** A fundamental critique of EUT, arguing that for non-ergodic processes (where time averages ≠ ensemble averages), maximizing ensemble EV (the standard expectation) is irrational. Rationality requires maximizing the growth rate of wealth over time (time-average growth), which for multiplicative processes leads to Kelly/log-optimal behavior.
      *   **What it often *is* mathematically:** **For repeated i.i.d. multiplicative bets, it *is* equivalent to maximizing expected logarithmic utility (i.e., Kelly).** The core math reduces to the same optimization problem. The "ergodicity breaking" is often framed as the difference between the linear EV perspective (ensemble average) and the multiplicative/growth perspective (time average).
      *   **The Difference (Claimed):** The proponents argue it's a more fundamental reframing based on system dynamics (is the process ergodic?) rather than assuming a concave utility function. It highlights that using ensemble averages for *individual* time-series trajectories (like the path of a single investor or firm) is invalid for multiplicative wealth dynamics.
      *   **Relevance to Practice:** **It provides a compelling *narrative* and *justification* for why institutions prioritize growth/survival over linear EV maximization in repeated multiplicative settings.** It directly explains the irrationality of paying large sums for St. Petersburg or ignoring position sizing – the linear EV is irrelevant to the time-path of a single entity. It resonates with the focus on long-run compounding.
      *   **Critique:** The claimed fundamental difference from EUT/Kelly is heavily debated. For the i.i.d. repeated bet case, the prescription is identical to Kelly/log-utility. The novel power lies more in framing and applying the concept to non-i.i.d. or non-multiplicative scenarios (e.g., systemic risks). **Contested View:** Many decision theorists and economists view it as a valuable perspective but not a fundamental replacement for EUT; they see it as highlighting when specific utility functions (like log) are appropriate.
      *   **Settled vs. Contested:** **Settled:** For i.i.d. multiplicative repeated bets, maximizing time-average growth rate requires maximizing E[log(1+return)], same as Kelly. **Contested:** Whether "ergodicity breaking" is a more fundamental flaw in EUT than the known need to choose appropriate utility functions/objectives, and the extent to which it offers genuinely new solutions beyond Kelly in finance.

  **The Infinite Entity Thought Experiment:**

  *   **Should it drop the table limits?** **Mostly Yes, *but*...**
  *   **The "Yes" (Pragmatism Revealed):**
      *   **Ruin Constraint Gone:** No operational unit to protect, no risk of shutdown due to a loss.
      *   **Law of Large Numbers (LLN) Reigns:** With truly infinite capital and an infinite stream of *independent* players, the LLN guarantees the house edge will be realized with vanishing relative variance. The divergent EV of the St. Petersburg bet offered to *one* player becomes a perfectly manageable, finite *average* cost per player over infinity. Caps are no longer needed for survival or stability.
      *   **Pure EV Maximization Vindicated?** For pricing *and* sizing *across the entire infinite book*, maximizing expected total profit (linear utility) becomes viable and optimal due to the LLN. Risk aversion washes out at the aggregate level.
  *   **The "...but" (Persistence of Prudence - Knightian Uncertainty & Practicalities):**
      *   **Model Uncertainty Remains:** Does the AI *really* know the coin is fair out to 2^1000? Could there be unknown physics, cosmic rays flipping bits, or adversarial players exploiting a flaw? True Knightian uncertainty about the extreme tails might still justify *some* truncation as a safeguard against the model being catastrophically wrong. This isn't risk aversion, it's model distrust.
      *   **Independence is Idealized:** Correlated events (e.g., a coordinated attack exploiting a vulnerability simultaneously across all tables) could threaten even an infinite entity if the loss per event is unbounded. Caps mitigate this correlation risk.
      *   **Operational Infinity is Fiction:** No entity is truly infinite. "Effectively unbounded" still implies *some* boundary, even if vast. Prudence might dictate sizing relative to that vast boundary, but the *fraction* would be minuscule. Caps would likely be astronomically high, not $25 or $25k.
      *   **Agency Problems Might Morph:** Even an AI might have internal optimization targets or constraints set by creators that mimic risk aversion.

  **Conclusion: The Implicit Theory & Commitments**

  1.  **The Core Implicit Theory:** Institutional practice primarily reflects **Capital-Constrained Growth Optimization with Robustness to Model Error**. It's Kelly/log-optimal betting (or ruin minimization) applied to finite operational units, overlaid with a heavy dose of precaution driven by the recognition that tail models are unreliable and stakeholders (internal and external) are loss-averse. It's not strictly one normative theory; it's a pragmatic fusion.
  2.  **What it Rules Out:** It **fundamentally rules out pure expected monetary value maximization** as the sole principle governing exposure sizing. Linear utility is rejected for sizing decisions involving significant tail risk relative to capital.
  3.  **What it Commits To (Mathematically):** It commits to the idea that **maximizing the long-run growth rate of capital (or ensuring survival to continue growing) is paramount** for repeated favorable bets. This inherently requires concave objectives (like log) or direct constraints, ruling out linear utility for sizing. The practice is *mathematically consistent* with maximizing expected log utility (Kelly) or minimizing ruin probability under the *assumed* model.
  4.  **What it Commits To (Practically/Philosophically):** It commits to **profound skepticism about the accuracy of probability models in the extreme tails** (Knightian uncertainty) and prioritizes **operational resilience and stakeholder management** alongside, or sometimes above, pure mathematical optimization. The truncation point is often set more by "what we can stomach/survive/explain" than by a precise Kelly fraction.
  5.  **Ergodicity vs. Kelly:** For the repeated multiplicative bet case central to your examples, the practical prescription and mathematical core of "ergodicity economics" **is indistinguishable from the Kelly Criterion / Expected Log Utility.** Its value is primarily in the framing and emphasis on the non-ergodicity of individual wealth paths, which strongly justifies the institutional focus on growth/survival over linear EV. It doesn't provide a *new* math for this scenario but offers a compelling *why* the old math (Kelly) is essential.

  **In short:** Institutions price with EV because, conditional on their model and within their risk-bearing capacity, it's the competitive, efficient way to set *margins*. They truncate because they prioritize sustained existence and compounding growth (Kelly/survival) and deeply distrust their models in the tails (Knightian uncertainty), all within the constraints of finite operational units and stakeholder expectations. The caps aren't principled objections to EV in the abstract infinite case; they are essential tools for navigating a finite, uncertain world. The infinite entity *should* drop the caps in theory, but even it might retain vestigial ones as a concession to the irreducible unknown.
