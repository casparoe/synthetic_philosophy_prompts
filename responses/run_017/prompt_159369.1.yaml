answer: |-
  ### Assertion Norm Diagnostic Instrument  
  **Designed for the Reading Group: Epistemologists & Philosophers of Language**  
  *Purpose: Sort participants by their verdicts on cases and meta-commitments, revealing their implicit norm of assertion. Avoids name-dropping; focuses on logical space and cases.*  

  ---

  ### **Part A: Meta-Questions Decision Tree**  
  *Answer each question based on your intuition. Proceed down the branches without peeking at labels.*  

  1. **Is there a norm of assertion specific to the speech act itself (beyond the general intention to get someone to believe something)?**  
     - **No** → Deflationary view (leaf: no further norm).  
     - **Yes** → Proceed to Q2.  

  2. **If violated, does this norm make the assertion *incorrect as a move* (like an ineligible chess move), or only the *speaker blameworthy*?**  
     - **Incorrect as a move** → Constitutive norm. Proceed to Q3.  
     - **Only blameworthy** → Regulative norm. Proceed to Q3.  
     - **Neither (or unclear)** → Revise Q1; else → Deflationary.  

  3. **Does the required epistemic status for proper assertion vary with practical stakes (e.g., how bad it would be to be wrong)?**  
     - **Yes** → Stakes-sensitive. Proceed to Q4.  
     - **No** → Binary (fixed threshold). Proceed to Q4.  

  4. **Is the norm uniform across contexts (e.g., casual chat vs. courtroom testimony), or tied to the practice?**  
     - **Uniform** → Proceed to Q5.  
     - **Tied to the practice** → Practice-relativized. Proceed to Q5.  

  5. **Can the same assertion (same speaker, content, evidence) be proper for one audience but improper for another, due to the audience’s knowledge?**  
     - **Yes** → Audience-relativized. Proceed to Q6.  
     - **No** → Speaker-centered. Proceed to Q6.  

  6. **Must the speaker be able to tell “from the inside” (without investigation) that they meet the norm?**  
     - **Yes** → Internally accessible.  
     - **No** → Externally assessable.  

  *Result: Part A identifies your meta-commitments (e.g., “constitutive, stakes-sensitive, practice-relativized, speaker-centered, internally accessible”). Combine with Part B to locate your norm.*  

  ---

  ### **Part B: Cases Quiz**  
  *For each scenario, choose one verdict:*  
  - **A. Defective assertion** (incorrect as a move, even if blameless).  
  - **B. In order** (proper assertion).  
  - **C. Not defective, but pointless/infelicitous** (pragmatic issue, not normative).  

  1. **Gettiered Shepherd**:  
     *Lara sees a sheep-shaped rock in a field of real sheep. She asserts, “There’s a sheep in the field.” Unbeknownst to her, a hidden real sheep is nearby. Her belief is justified and true, but environmentally unlucky.*  
     - A. Defective  
     - B. In order  
     - C. Pointless  

  2. **Lottery Ticket**:  
     *Jin asserts, “Your ticket lost,” based solely on 1-in-a-million odds. The ticket did lose.*  
     - A. Defective  
     - B. In order  
     - C. Pointless  

  3. **High-Stakes Train**:  
     *Alex asserts, “The train leaves at 9,” based on a reliable but fallible app. Normally, this evidence suffices. But now, if wrong, Alex and their friend will miss a life-saving treatment. Alex reasserts it in this high-stakes context.*  
     - A. Defective  
     - B. In order  
     - C. Pointless  

  4. **False but Justified**:  
     *Sam checks a well-maintained bus schedule and asserts, “The next bus is at 3.” Unbeknownst to Sam, the schedule had a rare error; the bus comes at 3:30.*  
     - A. Defective  
     - B. In order  
     - C. Pointless  

  5. **Self-Fulfilling Intention**:  
     *Taylor asserts, “I will finish this paper by tomorrow,” despite doubts. Saying this motivates Taylor; they finish on time.*  
     - A. Defective  
     - B. In order  
     - C. Pointless  

  6. **Redundant Sky**:  
     *On a clear day, Blake asserts to a meteorologist, “The sky is blue.” The meteorologist already knows this.*  
     - A. Defective  
     - B. In order  
     - C. Pointless  

  7. **Borderline Baldness**:  
     *Casey asserts, “Bob is bald,” about Bob (who has thinning hair). Baldness is vague; no precise threshold exists.*  
     - A. Defective  
     - B. In order  
     - C. Pointless  

  8. **AI Weather Report**:  
     *An automated system asserts, “It will rain tomorrow,” based on aggregated data. No human reviewed the output.*  
     - A. Defective  
     - B. In order  
     - C. Pointless  

  9. **Hedged Claim**:  
     *Riley asserts, “I think the meeting is at 4—but don’t quote me.” They have good but inconclusive evidence.*  
     - A. Defective  
     - B. In order  
     - C. Pointless  

  10. **Clinical Prognosis**:  
      *A doctor asserts to a patient, “You have 6 months to live,” based on statistics and tests. The patient requested full honesty.*  
      - A. Defective  
      - B. In order  
      - C. Pointless  

  ---

  ### **Scoring Key**  
  *Map your Part A meta-profile and Part B verdicts to a norm. Patterns matter; no single case is decisive. Ties/inconsistencies indicate hybrid views or unresolved intuitions.*  

  #### **Step 1: Resolve Part A Meta-Profile**  
  - Use your answers to define a framework: e.g., *[constitutive, binary, uniform, speaker-centered, internally accessible]*.  
  - **Deflationary exit**: If Q1 = "No," you hold the **deflationary view** (no norm beyond belief-intention). Ignore Part B.  

  #### **Step 2: Score Part B**  
  - **Verdict patterns** determine your base epistemic norm:  
    | Base Norm       | Key Verdicts (B=In order; A=Defective)                          |  
    |-----------------|------------------------------------------------------------------|  
    | **Knowledge**   | 1A, 2A, 4A, 5A, 7A (if truth-value indeterminate), 8A, 9B      |  
    | **Truth**       | 1B, 2B, 4A, 5B (if future truth assumed), 7B (if truth-apt), 9B |  
    | **Justified Belief** | 1B, 2B, 4B, 5B, 7B, 8B, 9B                              |  
    | **Warrant**     | 1A, 2A, 4A, 5B (if intention counts as warrant), 7A, 8B, 9B     |  
  - **Stakes-sensitive variants**: If Part A Q3 = "Yes," your norm is **interest-relative** (e.g., interest-relative knowledge). Verdict 3A supports this; 3B rejects it.  
  - **Relativized variants**: If Part A Q4/Q5 = "Tied/relativized," your norm is **practice-** or **audience-relativized** (e.g., contextualist knowledge). Verdicts 8B, 10B support this; 8A, 10A reject it.  
  - **C-Verds (pragmatic)**: Consistent C-answers (e.g., 6C, 9C) suggest you distinguish normative propriety from pragmatic felicity.  

  #### **Step 3: Locate Your Leaf in Logical Space**  
  - **Occupied leaves** (combine Part A and Part B):  
    | Meta-Profile + Base Norm                     | Usual Label                          |  
    |----------------------------------------------|--------------------------------------|  
    | Constitutive + binary + knowledge            | **Knowledge Norm**                   |  
    | Constitutive + stakes-sensitive + knowledge  | **Interest-Relative Knowledge Norm** |  
    | Constitutive + binary + truth                | **Truth Norm**                       |  
    | Constitutive + binary + justified belief     | **Justified Belief Norm**            |  
    | Constitutive + binary + warrant              | **Warrant Norm**                     |  
    | Practice-relativized + knowledge             | **Practice-Relativized Knowledge**   |  
    | Audience-relativized + knowledge             | **Contextualist Knowledge Norm**     |  
    | Regulative + any base norm                   | **Regulative Variant** (e.g., regulative knowledge) |  
    | Deflationary                                 | **Deflationary View**                |  

  - **Empty cells** (diagnosed):  
    - *Uniform + audience-relativized*: Incoherent (uniformity contradicts audience-relativity).  
    - *Stakes-sensitive + truth*: Unattractive (truth is binary; stakes-sensitivity irrelevant).  
    - *Externally assessable + justified belief*: Unexplored (justification is typically internal).  

  #### **Handling Ambiguities & Ties**  
  - **Knowledge vs. Warrant**: Hard to distinguish (both reject Gettier/lottery). *Decider case*: If you allow warranted false assertions (e.g., Case 4B), you lean to warrant; if not (4A), to knowledge.  
  - **Truth vs. Knowledge on vagueness/hedges**: Use Case 7/9. If 7B/9B, you likely hold truth; if 7A/9A, knowledge. If tied, you may conflate truth with knowledge.  
  - **Inconsistent patterns**: E.g., Part A = stakes-sensitive, but Part B = 3B. Diagnose as *unresolved stakes-sensitivity* or hybrid view.  

  #### **Case-Pair Distinctions Table**  
  | Case | Designed to Pull Apart                          |  
  |------|-------------------------------------------------|  
  | 1    | Knowledge vs. Truth/Justified Belief            |  
  | 2    | Knowledge vs. Truth                             |  
  | 3    | Binary vs. Stakes-Sensitive Norms               |  
  | 4    | Truth/Knowledge vs. Justified Belief            |  
  | 5    | Knowledge vs. Warrant (intentional acts)        |  
  | 6    | Normative Defect vs. Pragmatic Infelicity       |  
  | 7    | Knowledge/Truth vs. Justified Belief (vagueness)|  
  | 8    | Individual vs. Institutional Norms              |  
  | 9    | Knowledge/Truth vs. Warrant (hedging)           |  
  | 10   | Uniform vs. Practice-Relativized Norms          |  

  ---

  ### **Design Notes**  
  - **Why this works**: Forces reflection on cases first, avoiding label bias. Meta-questions frame intuitions; cases test commitments.  
  - **Indistinguishable positions**: Knowledge and warrant norms converge on most cases. Add a *decider case* (e.g., “warranted false assertion”) to separate them. Truth and knowledge norms blur on hedges (Case 9)—add a case with *true but unjustified assertion* to clarify.  
  - **Minimal proper names**: Labels (e.g., “knowledge norm”) are standard but anonymized; no theorists cited.  
  - **Logical space first**: Branches cover all 16 meta-combinations; cases locate base norms in this space. Unoccupied cells (e.g., stakes-sensitive truth) are named and diagnosed.  

  Participants receive their norm only after submitting verdicts, ensuring unbiased self-diagnosis. Ideal for triggering debate!
