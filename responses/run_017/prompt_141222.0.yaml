answer: |-
  ## Scenario: The Overloaded Footbridge

  During a city festival, a historic footbridge is temporarily reopened as a scenic shortcut to the main square. Authorities calculate that the bridge will collapse if the total weight exceeds 1,000 kg. A crowd of 500 people (averaging 70 kg each, totaling 35,000 kg) gathers at the entrance. An engineer loudly announces via megaphone that the bridge is *already* overloaded by 34,000 kg and will collapse under the first step of the crowd regardless of anyone's individual choice. Lena, weighing 70 kg, knows this announcement is accurate and verifiable. She chooses to cross simply to save 5 minutes on her walk to a café. The crowd proceeds simultaneously, no one coordinates, and Lena’s choice is invisible in the mass. The bridge collapses instantly, killing dozens. Lena’s step leaves no trace, affects no one’s decisions, and doesn’t alter her character or habits. Her motive is trivial convenience.

  ### Check  
  - **Harm**: Bridge collapse causing deaths.  
  - **Operative quantity**: Total weight on the bridge (threshold: 1,000 kg).  
  - **Agent’s act**: Adding 70 kg by stepping onto the bridge.  
  - **Relevant counterfactual**:  
    - Collective: If only ≤14 people crossed (≤980 kg), no collapse.  
    - Individual: With or without Lena, total weight = 35,000 kg > 1,000 kg → collapse occurs.  

  (a) **Difference-making/expected-consequences view**: Lena’s act changes nothing. Collapse is certain either way → *no reason to refrain*.  
  (b) **Complicity view**: No joint action, shared plan, or institutional role; contributors are symmetric strangers → *no reason to refrain*.  
  (c) **Causal-contribution view (non-counterfactual)**: Lena’s weight is physically part of the overload causing collapse. She is a *material component* of the harm → *reason to refrain*.  

  ### Verdict  
  (c) **survives** the disabling of the four moves. Lena’s contribution is:  
  - Not difference-making (certainty of overload).  
  - Not complicit (no coordination).  
  - Not expressive (unobserved, no traces).  
  - Not character-shaping (no impact on dispositions).  
  The scenario isolates raw *causal participation* in harm: Lena’s mass literally constitutes part of the destructive aggregate. This suggests "contribution without difference-making" **can** be an independent moral notion, challenging your advisor’s claim that it merely gestures at the four moves.  

  ### Minimal Change & Difference-Maker’s Rebuttal  
  **Feature doing the work**: Physical incorporation of Lena’s act into the harm mechanism (her body is a load-bearing element).  
  **Minimal change**: Lena stays off the bridge but presses a button that *symbolically registers approval* of crossing, without adding weight. Now her act is causally inert—it doesn’t alter the load. A difference-making theorist argues this change is **morally irrelevant**:  
  > "In both cases, Lena’s act doesn’t affect the outcome. Her physical presence in the original is redundant—the harm occurs identically without her. ‘Causal contribution’ without necessity is just a misleading label for *being part of a sufficient set*. But only necessity (difference-making) grounds reasons, as redundancy implies no responsibility. Your intuition otherwise conflates causation with moral significance."  

  **Conclusion**: The case satisfies all constraints and weakens your advisor’s claim. It shows contribution *can* function independently—but difference-makers will reject its normative force, insisting overdetermined causes are morally null. This highlights the core dispute: whether mere membership in a harm-causing aggregate matters. The footbridge scenario forces this disagreement into sharp relief.
