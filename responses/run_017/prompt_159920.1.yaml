prompt: |-
  I am a novelist, and I am well into a book set in the southern Maya lowlands during the Terminal Classic: a multigenerational novel about a family of scribes attached to a court that is slowly, and without ever deciding to, giving up the habit of raising carved and dated stone monuments. I find that I cannot write a page of it until I know what kind of event I am depicting, so what I need is a case analysis rather than background reading.

  The criterion I have been working with — call it the testamentary criterion — is this: a society has collapsed, as opposed to merely changed, when it loses the practices by which it hands a description of itself to those who come after it. Collapse on this view is not the loss of population, territory, or complexity, but the breaking of a chain of address: the cessation of records made for the sake of a future reader who will not otherwise know what has been lost, and who could therefore either reclaim it or knowingly refuse it. What is destroyed in a genuine collapse is not well-being or power but the capacity of successors to know what it is they are missing.

  Please take the Terminal Classic transformation of the Classic Maya and analyze it strictly through this criterion, and then tell me where the criterion breaks. Take the following as given: the number of dated monuments erected per year across the Maya area rises to roughly forty around 750, falls back to about ten by 800, and reaches zero by about 900, with no new major construction in the central Maya area after roughly 830; the Copán valley population, which peaked near twenty-eight thousand in the fifth century, declines to about fifteen thousand by 900 and to under a thousand by 1200; the northern Yucatán subsequently prospers, with Chichén Itzá, Mayapán and Uxmal flourishing in very different artistic and architectural styles and with far less monumental hieroglyphic writing; Maya communities and languages persist, and an independent Maya polity survives until the Spanish conquest of Nojpetén in 1697.

  I would like four things. First, a disciplined mapping: what the unit is (a city-state, a polity, a scribal institution, the Long Count itself), what on this criterion counts as the record addressed to the future, what it says was happening to people who went on farming, trading and building while the carving stopped, and whether the verdict is collapse, transformation, or something the criterion has no word for.

  Second, the places where the criterion misdescribes the case. It appears to make the fate of a whole population track the fate of an elite technology of self-commemoration; I want to know whether that is a fatal class bias or a defensible consequence, and how the criterion should handle a society most of whose members never had a testament at all.

  Third, two stress cases from outside the Maya material. For Mycenaean Greece: Linear B was a script used almost entirely for palace administration, it disappears with the destruction of the palaces around the end of the Late Bronze Age, and the following centuries offer no conclusive evidence of writing in Greece until the adoption of the alphabet several centuries later — so does the criterion deliver the result that the Mycenaean world collapsed, or the result that it never addressed the future in the first place and so was never the kind of thing that could collapse? And for the Maya themselves: if the destruction of the surviving Maya books by Spanish missionaries in the sixteenth century, and the long period in which Maya writing was present but unreadable before its decipherment in the twentieth century, both bear on the chain of address, then the criterion seems to say either that the Maya collapse was inflicted from outside in the 1500s or that it was revoked by scholars in the 1900s. Tell me what the criterion should say about collapse imposed by a conqueror and about collapse repaired retroactively. If you bring in Rapa Nui, do not rest anything on the disputed demographic and ecological story there.

  Fourth, what the case does to the criterion in return — whether it confirms it, or is an anomaly, or is a case the criterion never anticipated — and one further matter that is personal to the project: my own novel is an artifact of exactly the kind whose disappearance is supposed to constitute a collapse. Does the criterion in fact imply that a people can be un-collapsed by being written about, that collapse is revocable by art, and does it give any guidance to an agent inside the process, such as a lord deciding in a bad year whether the stela still gets carved? Where the criterion is silent, say so rather than making it speak. Do not give me citations or reading lists; work from the facts I have supplied and from what you already know.
reasoning: |-
  Okay, this novelist is working on a book set in the Terminal Classic Maya period, focusing on scribes as monument carving declines. Their core idea is fascinating: collapse isn't about population or power loss, but when a society stops creating records for future generations to understand what was lost. They need a strict analysis using this "testamentary criterion."

  First, I need to map this criterion onto the Maya case. The key units here seem to be the individual city-states (like Copán) and the scribal institutions within them. The "records addressed to the future" are clearly the dated stone monuments with hieroglyphic texts - stelae recording royal events, dynastic histories, etc. What's striking is that while carving stops, life continues: farming, trading, even building (though differently). The criterion would call this a collapse because the chain of address breaks - future generations won't know what the Classic Maya civilization truly was. 

  But problems emerge immediately. This elite practice never represented most people. The farmer in 850 AD experiencing drought probably didn't care about discontinued stelae. The criterion seems biased toward literate elites. Yet there's a defense: monumental writing was how Maya civilization consciously transmitted its self-concept. Its loss meant the end of that particular civilizational project, even if Maya identity persisted.

  Now for stress tests. Mycenaean Greece: Linear B was purely administrative, not meant for future readers. By this criterion, its disappearance isn't a collapse because no testament existed in the first place - just an administrative system failing. Contrast with the Spanish burning Maya books: that was a violent severing of the chain, making the 16th century the real collapse under this logic. But then 20th century decipherment complicates things - does retroactive recovery "uncollapse" them? The criterion struggles here; it's about contemporary intent, not future recovery.

  For the novelist's personal stake: their book becomes a paradox. If collapse is breaking the chain, then writing about it now creates a new chain. But that doesn't help their 9th century scribe character deciding whether to carve a stela in hard times. The criterion is silent on individual choices; it only judges outcomes centuries later. 

  The most profound tension is between the criterion's clean philosophical definition and messy reality. Maya communities survived, adapted, created new forms in the north. The criterion calls it collapse because the Classic civilization's self-description died, but that feels inadequate for the lived continuity. Perhaps we need a new category: not collapse, but "civilizational amputation" - where a specific elite tradition dies while the society transforms.

  For the novelist's character, the tragedy might be realizing they're not just stopping carving, but actively dismantling the future's capacity to miss what's being lost. That moment when the scribe asks "If no one will read this, does the king's glory exist?" - that's where the criterion becomes human.
answer: |-
  Here is the analysis strictly through your testamentary criterion, followed by its points of fracture and implications for your novel:

  ### 1. Disciplined Mapping of the Terminal Classic Maya  
  **Unit:** The scribal institution attached to individual city-state courts (e.g., Copán, Tikal, Palenque).  
  **Record Addressed to the Future:** Dated stone monuments (stelae, altars) using the Long Count calendar and monumental hieroglyphic script. These were not administrative records but deliberate "testaments": dynastic histories, royal accession rituals, and cosmological events framed for posterity.  
  **What the Record Says Was Happening:** The texts *stop narrating* before population decline or construction cessation. Monument dedications become sparse, then formulaic, then silent. The last monuments (c. 889 AD at Toniná) record ritual acts but feel perfunctory—like a habit fading. The record implies elite disinvestment in *this specific mode of address*, not societal halt. People farming/trading/building appear in the record only as silent participants in royal rituals; after carving stops, they vanish from the testamentary frame entirely.  
  **Verdict:** **Collapse** (of the testamentary practice). The chain of address is broken. Future generations (including Postclassic Maya at Chichén Itzá) could not reclaim or refuse Classic Maya courtly civilization because its self-description ceased. The "loss to be missed" (divine kingship, stela-cult) was rendered unknowable.

  ### 2. Where the Criterion Misdescribes the Case  
  - **Fatal Class Bias?** Partially. The criterion *necessarily* elevates the elite practice because it was the only one *aimed at testament*. A farmer’s milpa cycle needs no future reader. This is defensible if "society" here means the *civilization as it understood itself*—which for the Classic Maya was mediated by scribes and kings. However, it fails to describe the 90% who sustained life without monuments. Their continuity is "transformation"; the elite practice is "collapse."  
  - **Societies Without Testament:** The criterion is silent. It can only diagnose collapse in societies that *attempted* testament. For non-literate or non-monumental societies, it offers no framework—their changes are merely transformation or persistence by default.  

  ### 3. Stress Cases  
  **Mycenaean Greece (Linear B):**  
  - **Verdict:** No collapse *by this criterion*. Linear B records (inventories, tax rolls) were administrative ephemera, not addressed to the future. Their destruction with the palaces is administrative failure, not testamentary collapse. Mycenaean Greece never established a chain of address—so it could not "collapse" in this sense. The Dark Ages represent loss, but not of a transmitted self-description.  

  **Spanish Destruction of Maya Books & Modern Decipherment:**  
  - **Conqueror-Imposed Collapse (16th C.):** The burning of codices *is* testamentary collapse under the criterion—a violent severing of the chain. The surviving Maya (e.g., in Yucatán) retained oral tradition but lost the *written self-description* of their Classic past. The criterion calls this an external termination of testament.  
  - **Retroactive "Revocation" (20th C. Decipherment):** **The criterion breaks.** It is forward-looking: contemporaneous intent defines testament. Decipherment creates *new* readers, but does not restore the original chain. The Classic Maya’s *own act of address* remains broken. Modern scholarship is a parallel act of recovery, not revocation of collapse.  

  ### 4. What the Case Does to the Criterion & Personal Implications  
  - **Confirmation/Anomaly:** The Maya case **confirms** the core mechanism: cessation of testament = collapse of that civilizational project. But it **exposes an anomaly**: societies can "transform" materially while the elite self-understanding "collapses." The criterion cannot reconcile these parallel trajectories—it sees only the rupture in address.  
  - **Rapa Nui (Briefly):** If moai carving was testamentary (debatable), its cessation would be collapse per the criterion—regardless of whether people thrived afterward. Ecological disputes are irrelevant here.  

  **For Your Novel:**  
  - **Can Art "Un-Collapse"?** **No.** Your novel is a *new* testament, not a restoration. The Classic Maya scribes’ chain remains broken. You create a modern chain of address about the past, but this does not retroactively fulfill *their* intent. Collapse is irrevocable for its time.  
  - **Guidance for an Agent (e.g., a Lord/Scribe):** **The criterion is silent.** It is diagnostic, not prescriptive. A lord in 810 AD deciding not to carve a stela is not "causing collapse"—he’s responding to immediate pressures (cost, legitimacy, drought). The criterion only observes that the *cumulative effect* of such choices breaks the chain. Your scribe-character might intuit the existential weight: *"If we stop now, who will remember what a king was?"* But the criterion cannot advise him—it judges outcomes, not decisions.  
  - **The Silent Tragedy:** The criterion implies that collapse is **invisible to contemporaries**. Those farming after the last stela was raised experienced continuity; only we, seeing the broken chain, see collapse. Your novel’s power lies in depicting actors *unwittingly* ending a tradition—not through grand failure, but through mundane attrition.  

  ### Final Note  
  The testamentary criterion isolates a real phenomenon (the erasure of self-definition) but at the cost of rendering the living, adapting majority as "survivors in silence." Your novel, by giving voice to scribes *as the testament falters*, becomes a meta-testament: it documents the moment when a civilization’s voice fades, even as its body lingers. That tension—not collapse versus transformation, but **who gets to describe the change**—is where your criterion, and your story, finds its deepest resonance.
